prompt: |-
  I joined the clinical ethics committee of my hospital three months ago, a year after sitting with my family through my father's final admission to its intensive care unit. The committee is about to rewrite its guidance on two matters in particular: withdrawing life-sustaining treatment, and what clinicians should do when a family asks the team not to tell a patient their prognosis. I find that views I had previously held only as private opinions now have to be turned into something written down, and I would be grateful for a consistency check before the drafting meeting. My sympathies in the generalism/particularism dispute lie with the particularist side, though I arrived there informally and by no careful route. Here is roughly where I stand:

  (1) I do not think there are exceptionless moral principles, nor that there is a manageable set of defeasible ones that captures what matters. Whether a feature of a case is a reason at all, and which way it points, seems to me to depend on what else is going on; a feature that counts in favour here can be silent, or count against, there.

  (2) I am not a relativist. Some verdicts on a case are simply wrong, and what makes them wrong is fixed entirely by the descriptive facts of the case. I take the supervenience of the moral on the descriptive for granted, and I have never seen how to give it up.

  (3) In every case I have actually encountered, the fact that a course of action would leave a patient in severe untreated pain has been a reason against it, and I expect our case mix to stay like this. I have never had to treat it as otherwise and I do not expect to.

  (4) When a clinician does what our guidance says partly because the guidance says so, I want to say that this gives her some genuine moral support and not merely institutional cover: the guidance is a consideration in favour of acting, and not just a fact about what the hospital will later accept.

  (5) I think the guidance has to pass what we have started calling the corridor test. A reviewer who was not in the room, who does not share our judgment, and who has only the notes must be able to determine afterwards whether the clinician complied. Guidance that cannot be audited in that way is not guidance at all. This I regard as non-negotiable.

  (6) I think clinical moral judgment is a trained perceptual skill, that novices acquire it partly by being handed rules, and that the point of the rules is that they should eventually be outgrown. At the same time I want to say that a clinician who does the right thing only by applying a rule whose cited features were not the reasons actually present in the case has got it right without seeing it, and that this is a real defect even when the outcome is identical.

  (7) I think several people on the committee are better at this than I am and that I should frequently defer to them. But I do not accept that anyone's verdict is right because she reached it, or that one person can have authority over another's moral judgment.

  (8) On the case that led to me being asked to join: my father's team told him his prognosis after my mother and I had asked them not to, and I remain convinced that telling him was right. Yet I also want to say that in every case what ought to be done is what the balance of reasons in that case favours, and that this is the whole story about what makes a verdict right. In that case the reasons I am able to articulate seem to me to point the other way, and what I am ultimately relying on is that the senior nurse saw it and I did not.

  Which of these are genuinely in tension, and which only appear to be? Please rank the real tensions by severity rather than treating them all as equally serious; for each, say what would have to be given up and what giving it up would cost me; and tell me which single revision would clean up the most. If one item is doing more damage than the rest, say so plainly. I do not know where the trouble is, and I would rather be told than reassured.
reasoning: |-
  Okay, let me start by really understanding what this person is asking. They’re on a clinical ethics committee and need to rewrite guidelines on two critical issues: withdrawing life-sustaining treatment and whether to disclose prognosis when families object. They’ve shared their philosophical stance, which leans towards particularism, and want a consistency check before the meeting. Their main concern is identifying where their views might conflict internally and how to resolve those tensions.

  First, I need to unpack each of their eight points. Point 1 is their particularism: no exceptionless moral principles, reasons depend on context. Point 2 rejects relativism, saying moral judgments supervene on descriptive facts. Point 3 notes that severe untreated pain is always a reason against an action in their experience. Point 4 says following guidance provides genuine moral support, not just institutional cover. Point 5 emphasizes the "corridor test" – guidance must be auditable. Point 6 views moral judgment as a perceptual skill; rules are training wheels but ultimately outgrown, yet acting correctly without understanding is a defect. Point 7 values deference to more skilled colleagues but rejects authority in moral judgment. Point 8 uses their father’s case: the team disclosed despite family objections, and while they believe it was right, they couldn’t articulate why, relying on the nurse’s perception.

  Now, the key task is spotting tensions. The most obvious one is between particularism (point 1) and the corridor test (point 5). The corridor test requires clear, auditable rules, but particularism says rules can’t capture the nuances of each case. How can guidance be both auditable and context-sensitive? 

  Then, point 6 conflicts with point 4. Point 4 sees guidance as a moral reason, but point 6 suggests that relying on rules without understanding the real reasons is a defect. So if a clinician follows guidance (point 4), they might be acting correctly but without grasping the underlying reasons, which point 6 considers problematic. That’s a tension.

  Point 3 seems at odds with particularism. Claiming that untreated pain is always a reason against an action sounds like a universal principle. But particularism says no feature is always a reason. So they’d need to either soften point 3 or accept it as a heuristic, not a principle.

  Point 8 is tricky. They acknowledge that the nurse’s perception was key in their father’s case, but point 7 says no one has moral authority. Yet, they deferred to the nurse’s judgment. There’s a tension between deferring to others’ expertise while denying their authority over moral judgment.

  The supervenience claim (point 2) might conflict with particularism if it implies that identical cases must have the same moral verdicts. But particularism allows for context-dependent reasons, so maybe that’s resolvable by clarifying that supervenience doesn’t require identical judgments across different contexts.

  Prioritizing these, the corridor test vs. particularism is the biggest issue because it affects how guidance is written. If guidance must be auditable, it needs clear rules, but particularism resists that. Resolving this might involve framing guidance as checklists of considerations rather than rigid rules, using case examples to illustrate nuance.

  The next major tension is between the moral weight of guidance (point 4) and the defect of rule-following without understanding (point 6). If guidance is a genuine reason, but acting without understanding is flawed, how do we reconcile that? Maybe by emphasizing that guidance should aid perception, not replace it.

  The untreated pain point (3) can be softened by noting it’s a strong presumption but not absolute. Point 7 and 8’s conflict on deference vs. authority might be resolved by distinguishing epistemic authority (recognizing expertise) from moral authority (final say).

  The single best fix? Probably rethinking the corridor test to allow for nuanced documentation. Instead of requiring strict compliance, focus on documenting the reasoning process and key factors considered. This maintains auditability without forcing rules that conflict with particularism.

  Overall, the user needs practical solutions for drafting guidance that respects both auditability and context-dependency. Highlighting where their views need refinement will help them contribute effectively in the committee meeting.
answer: |-
  Your position is admirably coherent for an informal particularist stance, but several tensions exist—some resolvable with nuance, others requiring significant trade-offs. Below, I rank the conflicts by severity (1 = most critical), identify what must be given up and the cost, and propose the most effective revision.

  ### **Ranked Tensions & Resolutions**
  1.  **Tension: Point 1 (Particularism) vs. Point 5 (Corridor Test)**  
      - **Severity:** Highest. This threatens the feasibility of your guidance.  
      - **Conflict:** Particularism denies "manageable" defeasible principles, but the corridor test demands guidance auditable via written rules/checklists. If moral reasons are irreducibly context-dependent, codifying them into auditable rules may distort judgment or force false generalizations.  
      - **Resolution Required:**  
        - *Give up:* Strict auditability (Point 5) as the *primary* constraint, **or** soften particularism to allow "defeasible presumptions" for practical purposes.  
        - *Cost:* Abandoning strict auditability risks unenforceable guidance; softening particularism sacrifices philosophical purity for institutional utility.  
        - **Practical Fix:** Reinterpret the corridor test to audit *process* (e.g., "Did the clinician document consideration of X, Y, Z factors?") rather than *outcome* compliance. This preserves context-sensitivity while allowing review.  

  2.  **Tension: Point 4 (Guidance as Moral Support) vs. Point 6 (Rules as Training Wheels)**  
      - **Severity:** High. This challenges the guidance’s purpose.  
      - **Conflict:** If guidance provides genuine moral weight (Point 4), it must be more than a heuristic to outgrow (Point 6). But if rules are crutches for novices, relying on them is a "defect" even when correct—undermining their moral authority.  
      - **Resolution Required:**  
        - *Give up:* Either guidance’s intrinsic moral force (Point 4) **or** the idea that rule-following is inherently defective (Point 6).  
        - *Cost:* Denying moral force reduces guidance to bureaucratic cover; denying the "defect" undermines the value of perceptual skill.  
        - **Practical Fix:** Frame guidance as a distillation of collective wisdom. It provides moral support *because* it reflects expert perception (linking to Point 7), but clinicians should aspire to grasp the underlying reasons.  

  3.  **Tension: Point 3 (Untreated Pain as Always a Reason Against) vs. Point 1 (No Exceptionless Principles)**  
      - **Severity:** Moderate (but a critical flaw in particularism).  
      - **Conflict:** Claiming untreated pain is *always* a reason against an action is an exceptionless principle, contradicting Point 1. Even if true in your experience, particularism forbids universalizing it.  
      - **Resolution Required:**  
        - *Give up:* The universality of Point 3 **or** strict particularism.  
        - *Cost:* Softening Point 3 weakens a deeply held conviction; abandoning particularism conflicts with your core stance.  
        - **Practical Fix:** Recast Point 3 as a *defeasible presumption*: "Severe untreated pain *typically* provides decisive moral reasons against a course of action, absent extraordinary justifying factors."  

  4.  **Tension: Point 7 (Deference Without Authority) vs. Point 8 (Relying on Others' Perception)**  
      - **Severity:** Moderate. This risks epistemic incoherence.  
      - **Conflict:** You defer to skilled colleagues (Point 7) and relied on the nurse’s perception (Point 8), yet deny moral authority. But if their judgment carries weight, it implies expertise confers *epistemic* authority—which morally supervenes on descriptive facts (Point 2).  
      - **Resolution Required:**  
        - *Give up:* The denial of authority (Point 7) **or** the idea that deference is purely about correctness (not skill).  
        - *Cost:* Accepting authority risks hierarchy in moral judgment; rejecting it may undervalue expertise.  
        - **Practical Fix:** Distinguish *moral authority* (final say) from *epistemic authority* (reliability in discerning reasons). You defer to others’ ability to detect supervening facts—not their "right" to decide.  

  5.  **Tension: Point 6 (Rules as Heuristics) vs. Point 5 (Corridor Test)**  
      - **Severity:** Low (if Point 1/5 tension is resolved).  
      - **Conflict:** If rules are meant to be outgrown (Point 6), they may fail the corridor test if experts bypass them.  
      - **Resolution:** If guidance focuses on auditable *processes* (e.g., "consult ethics committee if family requests nondisclosure"), not rigid rules, experts can exercise judgment while novices follow structure.  

  ---

  ### **The Single Most Damaging Item: Point 5 (Corridor Test)**
  - **Why:** It directly threatens the guidance’s feasibility given your particularism. Without revision, it forces overly simplistic rules that conflict with Points 1, 6, and 8.  
  - **Best Revision:** Redefine the corridor test to audit **whether relevant factors were considered and documented**, not whether a rule was followed. Example:  
    > *"Guidance must specify: (a) key factors to assess (e.g., patient autonomy, family dynamics, prognosis), (b) a procedure for deliberation (e.g., interdisciplinary consultation), and (c) documentation requirements. Auditors determine if this process occurred—not whether the 'correct' decision was made."*  

  ### **Minor Apparent Tensions**
  - **Point 2 (Supervenience) vs. Point 1 (Particularism):** No conflict. Supervenience means identical cases have identical moral verdicts; particularism simply denies these verdicts can be captured by general principles.  
  - **Point 8 (Balance of Reasons) vs. Point 7 (No Authority):** Consistent. The nurse’s perception revealed objective reasons you missed—it wasn’t "authority" but superior detection of facts.  

  ### **Key Revision Summary**
  1. **Prioritize revising Point 5** (corridor test) to focus on auditable *processes*, not rules.  
  2. **Reframe Point 3** as a strong presumption, not a universal truth.  
  3. **Clarify Point 4** as moral support derived from expert consensus, not rule-worship.  

  This preserves your particularism while making guidance actionable. The cost is accepting that institutional ethics requires some standardizing structures—but these need not betray context-sensitivity if designed as scaffolds for judgment, not substitutes for it. Your father’s case (Point 8) exemplifies this: the team likely followed a *process* (assessing his capacity, weighing autonomy) that aligned with particularism but could still be audited.  

  If you adjust nothing else, fix the corridor test. It’s the linchpin holding your practical and philosophical commitments together.
