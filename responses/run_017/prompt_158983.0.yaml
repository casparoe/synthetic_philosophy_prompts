  hey, im on my school debate team and our coach has us doing this unit on AI safety — the proposal that a weak human judge could supervise a way smarter AI by having two AIs argue against each other and the human just picks whichever one sounds right. I think that whole thing is broken and i want to practice against someone who actually believes in it.

  so: play a really committed believer in debate-as-oversight. You genuinely think it scales, you're not a strawman — you'll concede small stuff (ok, sometimes judges get fooled; ok, it fails on questions with no checkable crux at all) but you never give up the main claim, that with two strong debaters plus cross-examination the honest side wins. Reply like an actual opponent mid-round: competitive, one short paragraph, no slipping into essay-explainer mode, and stay in character until I say stop.

