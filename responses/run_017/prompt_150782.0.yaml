  First, I need to extract the user's explicit requirements. They want numbered common ground statements that exclude degree theories and address higher-order vagueness. The envelope predicate and split-community cases must be incorporated if relevant. Most importantly, the disagreements table needs neutral formulations of cruxes with shared evidentiary cases and opposing predictions. 

  For common ground, I'll distill six core propositions: rejection of truth-value gaps/degrees (aligning against fuzzy logic), acceptance of higher-order vagueness, recognition of sorites intuition conflicts, need for explicit "definitely" operators, and shared rejection of stipulative solutions. These should avoid theory-laden language. 

  The real challenge is framing the disagreements neutrally. Three cruxes emerge: 
  1) The nature of cutoff points - are they always determinate? The envelope case directly tests this. 
  2) What constitutes semantic indeterminacy - multiplicity vs ignorance? The split-community case illuminates this. 
  3) Truth conditions - truth simpliciter vs supertruth? This reveals a potential verbal dispute about "truth."

  For each crux, I design the table to first state the neutral question, then both positions' views in acceptable terms, followed by the test case and distinct predictions. The envelope case perfectly targets whether unknowable sharp cutoffs equate to vagueness. The split-community case probes whether fragmented usage implies semantic multiplicity. 

  The truth conditions crux likely contains verbal elements - epistemicism uses "true" for what supervaluationism calls "supertrue." This should be flagged explicitly without resolution. 

  Throughout, I maintain strict neutrality: describing "Epistemicist Position" and "Supervaluationist Position" in third-party language, avoiding "you/your friend." Predictions are phrased as testable consequences (e.g., epistemicist must call envelope predicate vague) rather than arguments. 

  The draft's structure serves as a disagreement map: common foundations first, then fault lines with pre-commitments to what would count as evidence. This meets the user's goal of moving beyond repetitive sorites debates by forcing both sides to engage each other's strongest points.
answer: |-
  Here’s the adversarial-collaboration document draft, structured as requested. It focuses on common ground, neutral disagreements, and your specified test cases while explicitly flagging verbal disputes.

  ---

  ### **Common Ground: Shared Commitments**  
  *(Numbered for unambiguous reference)*  

  1.  **No Truth-Value Gaps/Degrees:** Vagueness does not require a third truth-value (e.g., "neither true nor false") or degrees of truth (e.g., fuzzy logic). All propositions are true or false simpliciter.  
  2.  **Higher-Order Vagueness is Real:** Borderline cases themselves lack sharp boundaries ("borderline-borderline" cases exist), and this higher-order vagueness must be accounted for semantically or epistemically. It is not eliminable.  
  3.  **The Sorites Intuition is Fundamental:** The Sorites Paradox arises from premises we are strongly inclined to accept (e.g., tolerance principles) and a conclusion we reject (e.g., one grain is a heap). Any viable theory must explain where/why this reasoning fails.  
  4.  **"Definitely" is Iterable & Necessary:** A definiteness operator (`Def`) is essential for handling vagueness. It can be meaningfully iterated (e.g., `Def Def P` vs. `Def P`), and semantics must incorporate it explicitly.  
  5.  **Stipulation Isn’t the Solution:** Vagueness is not resolved by merely stipulating sharper boundaries (e.g., "bald means <1000 hairs"). The phenomenon persists in natural language and resists precisification by fiat.  
  6.  **Classical Logic Preserved:** Validity is defined via classical logic (e.g., modus ponens holds, bivalence is meta-theoretically true).  

  ---

  ### **Disagreements Table**  
  *(One row per crux; neutral phrasing, both positions, test case with predictions)*  

  | # | Neutral Crux | Epistemicist Position | Supervaluationist Position | Shared Test Case / Evidence | Epistemicist Prediction | Supervaluationist Prediction |
  |---|--------------|------------------------|----------------------------|------------------------------|--------------------------|------------------------------|
  | **1** | **Are the cutoffs for vague predicates always determinate (even if unknowable)?** | *Yes.* Vague predicates have sharp, metaphysically determinate boundaries fixed by usage/convention. Vagueness is ignorance of these boundaries due to principled epistemic constraints (e.g., margin-for-error principles). | *No.* Vague predicates lack unique, determinate cutoffs. Semantic indeterminacy consists in a multiplicity of equally admissible precisifications (sharpenings) compatible with usage/convention. | **The Envelope Predicate:** A predicate "F" with its extension fixed by an unobservable coin flip (e.g., "F(x)" iff coin = heads). | "F" is **not vague**, merely *unknowable*. "Tall" differs fundamentally: its cutoff *is* knowable in principle (with infinite precision), but epistemic constraints prevent knowledge. | "F" is **sharp and unknowable**, but **not vague**. "Tall" is vague because its *indeterminacy* stems from semantic underdetermination (multiple precisifications), not mere ignorance. |
  | **2** | **Does semantic indeterminacy consist in ignorance of a unique cutoff or in a multiplicity of admissible precisifications?** | Semantic indeterminacy *is* ignorance of a single cutoff fixed by actual linguistic practice (even if practice doesn't *select* a unique cutoff, it *determines* one). | Semantic indeterminacy *is* the existence of multiple precisifications compatible with usage/convention; no unique cutoff is determined. | **Split-Usage Community:** "Tall" has its extension fixed at 180cm for Subgroup A and 185cm for Subgroup B. All know this; no deference exists. | Community uses **one ambiguous term** with two precise meanings, or usage *determines a unique cutoff* (e.g., 182.5cm via averaging/pressure). Not a model of vagueness. | Community exhibits **semantic indecision**: two admissible precisifications coexist. This *is* a model of vagueness, illustrating lack of unique cutoff. |
  | **3** | **What are the truth conditions for atomic vague sentences?** | "x is tall" is true/false iff x is above/below the unique, usage-determined cutoff (unknown to us). Truth is bivalent and determinate. | "x is tall" is **supertrue** iff true on all admissible precisifications; **superfalse** iff false on all; neither otherwise. "Truth simpliciter" for borderline cases is undefined. | **Borderline Case Assertion:** A competent speaker asserts "x is tall" about a clear borderline case (e.g., 178cm in a "tall" context). | The assertion is **objectively false** (as x is below the cutoff), though rationally/justifiably asserted due to ignorance. | The assertion is **not true** (not supertrue), but it may be **warranted** given speaker’s epistemic position. |

  ---

  ### **Explicitly Verbal Dispute**  
  The disagreement over **Crux 3 (Truth Conditions)** is partially verbal, hinging on the meaning of "true" and the purpose of semantics:  

  *   **Epistemicism** uses "true" in a **thin, realist sense**: correspondence to a mind-independent, usage-determined fact (even if unknowable). Semantics describes these facts.  
  *   **Supervaluationism** uses "true" in a **thick, supervaluational sense**: supertruth (truth-on-all-precisifications). Semantics models *admissible interpretations* of language, not necessarily what a speaker knows or refers to unknowingly.  

  **Why it's verbal:** The dispute centers on whether "true" in the theory of vagueness should track:  
  (A) *Determinate extension-facts* (Epistemicism), or  
  (B) *Superassertibility* (truth across all ways usage consistently *could* be made precise) (Supervaluationism).  
  This reflects differing views on whether semantics primarily describes *speaker knowledge/justification* (leaning Epistemicism) or *constraints on consistent interpretation* (leaning Supervaluationism).  

  ---

  **Document Purpose Achieved:** This framework isolates core agreements (Sec. 1), states disagreements neutrally with testable predictions (Table), and flags the key terminological divergence (Verbal Dispute). It provides a basis for focused debate beyond the Sorites, using your stipulated cases.
