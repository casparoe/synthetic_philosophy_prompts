answer: |-
  ## NILGROM & VANE LLP
  **COMMON PRIOR EQUILIBRIUM FUND**
  **PROSPECTUS DATED 1 APRIL 2024**

  **Investment Objective**
  The Common Prior Equilibrium Fund (the "Fund") seeks to achieve long-term capital preservation and stability by strictly adhering to a foundational principle of market efficiency. Specifically, the Fund operates under the conviction that, under conditions of perfectly aligned initial beliefs and rationality, mutually beneficial speculative trade between participants possessing identical information sets is logically precluded. The Fund's strategy is therefore predicated on maintaining this equilibrium state, rigorously avoiding transactions motivated solely by differential interpretation of public signals. Capital growth, where it occurs, arises incidentally from the structural advantages inherent in this equilibrium discipline.

  **Key Terms**

  1.  **Strategy:** The Fund shall maintain a static portfolio composition, barring adjustments necessitated solely by:
      *   **Hedging Requirements:** Mitigating exogenous, non-informational risks (e.g., currency fluctuations impacting underlying holdings).
      *   **Inventory Replenishment:** Restoring core portfolio weights following corporate actions (e.g., mandatory tenders, spin-offs).
      *   **Non-Informational Rebalances:** Correcting deviations caused by passive drift relative to the initial allocation weights.
      *   **Fiduciary Accommodation:** Facilitating mandatory client withdrawals or subscriptions in a manner minimising market signalling impact.
      *   **Structural Integrity Adjustments:** Actions deemed essential by the Investment Manager to preserve the Fund's operational viability under the governing theorem.

  2.  **Fees:**
      *   **Annual Management Fee:** 0.75% of Net Asset Value (NAV), payable quarterly in arrears.
      *   **Avoided-Alpha Participation Fee:** 10% of the theoretical profit (calculated using the Fund's proprietary models) deemed foregone by the Fund through its disciplined avoidance of speculative trades identified ex-post. Payable annually.

  3.  **Stokey Ratio:** The Investment Manager will calculate and report quarterly the Stokey Ratio, defined as the number of potential trades rigorously analysed and subsequently declined under the governing theorem, divided by the number of trades actually executed (excluding subscriptions/redemptions). A higher ratio indicates greater strategic discipline.

  4.  **Common Prior Certification:** All prospective investors must review and affirmatively sign the Common Prior Certificate ("CPC") prior to subscription. The CPC confirms the investor's understanding and acceptance of the Fund's foundational logic, including the assumption of a shared initial probability assessment concerning the state of the world relevant to the portfolio.

  5.  **Prior Reconciliation Questionnaire (PRQ):** Upon subscription, all investors must complete the PRQ. This confidential document solicits the investor's current probability assessments concerning key market states relevant to the Fund's holdings. The Fund utilises these aggregated responses, alongside its proprietary house posterior, to continuously validate the robustness of the common prior assumption and guide non-speculative adjustments (see Clause 1).

  6.  **Valuation & Disagreement Protocol:** The Fund's NAV is determined daily using its proprietary valuation models, which incorporate the house posterior. Should any investor formally dispute the NAV calculation, the Investment Manager will assess whether the dispute arises from a divergence in posterior beliefs *despite* adherence to the CPC. If such a divergence in posteriors is deemed material and irreconcilable *without* violating the theorem's core assumptions, the disputing investor's holding may be subject to compulsory redemption at the disputed NAV. This mechanism preserves the common knowledge of homogeneous beliefs critical to the strategy.

  7.  **Suitability:** The Fund is suitable only for retail investors possessing a long-term investment horizon, a high tolerance for theoretical abstraction, and a willingness to accept returns generated primarily through structural fee advantages and the avoidance of transaction costs, rather than active security selection.

  **Risk Factors**
  Prospective investors should carefully consider the following risks:

  1.  **Theorem Integrity Risk:** The Fund's strategy and viability are entirely contingent upon the theoretical validity and practical applicability of the governing equilibrium principle. Should this principle be fundamentally incorrect or materially inapplicable to prevailing market conditions, the Fund may fail to achieve its objective and could experience significant underperformance relative to active or passive strategies.
  2.  **Model Implementation Risk:** The Fund relies on complex proprietary models to identify speculative trades to avoid, calculate the Avoided-Alpha Participation Fee, determine the house posterior, and value assets. Errors in model design, calibration, or execution could materially adversely affect performance, fee calculations, or the triggering of the Disagreement Protocol.
  3.  **Common Prior Breakdown Risk:** The foundational assumption of a shared initial belief state may be invalidated over time due to unforeseen shifts in fundamental investor cognition or the introduction of radically new, unmodellable information. This could destabilise the equilibrium the Fund depends upon.
  4.  **Uninformed Flow Dependency Risk:** The Fund's ability to execute its limited permissible activities (Clause 1) relies upon the presence of sufficient market counterparties whose trading motivations are demonstrably non-speculative (e.g., liquidity needs, exogenous hedging). A sustained reduction in such counterparty participation could impair the Fund's operational flexibility.
  5.  **Information Contamination Risk:** Engaging with this Prospectus, the CPC, or the PRQ may inadvertently alter an investor's information set or posterior beliefs. This could, paradoxically, disqualify the investor from participating in or remaining within the Fund under its strict adherence to the governing theorem, potentially triggering the Disagreement Protocol (Clause 6). The mere act of considering an investment involves an exchange of information potentially incompatible with the necessary conditions for the Fund's existence.
  6.  **Fee Compression Risk:** The Avoided-Alpha Participation Fee depends on identifying theoretical foregone profits. Market conditions may limit the identification of such opportunities, reducing fee income crucial to the Fund's economics.
  7.  **Compulsory Redemption Risk:** Investors face the risk of having their holding compulsorily redeemed at the Fund's NAV under the Disagreement Protocol (Clause 6), potentially at an inopportune time or price.

  By: Dr Hilary Vane, Chief Prior Officer
  Nilgrom & Vane LLP, London

  **Word Count: 695**
