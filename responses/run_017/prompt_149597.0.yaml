answer: |-
  Below is a decision tree designed to classify positions on the coherence of qualia, adhering to your specifications. The tree uses concrete cases to branch through the logical space, prioritising your required distinctions (synchronic vs. diachronic cases, role of first-person access, and intrinsic vs. relational phenomenal character). I've used your drafted cases (palimpsest, twin-taster, and empty-report) as key nodes, and located standard named positions in the resulting leaves. British English is used throughout.

  ### Key to Branch Nodes
  - **Confident separation**: Indicates the question reliably distinguishes between the sibling views at that branch.
  - **Fragile separation**: Indicates the question may not cleanly separate all sibling views due to overlaps or ambiguities in positions. Used sparingly where necessary.
  - **Cases used**: Empty-report (Node 1), Twin-taster (Node 2), and Palimpsest (Node 4). All are retained; none are broken or collapse into existing literature cases. The palimpsest case is novel and effectively tests diachronic intrinsic properties without behavioural evidence.

  ---

  ### Decision Tree

  **Start**: You encounter a philosophical claim about experience. Commit to an ordinary intuition (e.g., "My experience of red feels a certain way to me, beyond what I report").

  **Node 1: Empty-report case**  
  *A subject's reports about their experience are generated by a mechanism tracking only the distal stimulus (e.g., light wavelengths), with no access to the experience itself. Do you treat these reports as evidence about what it is like for them?*  
  - **Yes** (Reports alone are sufficient evidence; first-person access adds nothing) → Node 2  
  - **No** (First-person access provides additional evidence beyond reports) → Node 3  
    - **Confident separation**: Cleanly divides views that prioritise third-person data (e.g., illusionism) from those emphasising first-person evidence (e.g., realism).

  **Node 2: Twin-taster case (synchronic)**  
  *Two subjects swap the character of one modality's experiences (e.g., taste) nightly, with each subject's intra-subjective similarity/difference relations identical across days. Is there a fact about the swap?*  
  - **Yes** (Swap changes something real) → Leaf 1: **Incoherent (empty)**  
    - *Why empty*: Incoherent with Node 1 (Yes). If reports are the only evidence, but the swap leaves reports unchanged, positing a fact violates evidence constraints.  
  - **No** (No fact; swap changes nothing) → Node 4  
    - **Confident separation**: Isolates views that reject intrinsic properties under synchronic constraints.

  **Node 3: Twin-taster case (synchronic)**  
  *Same as Node 2. Is there a fact about the swap?*  
  - **Yes** (Swap changes something real) → Node 5  
  - **No** (No fact; swap changes nothing) → Node 7  
    - **Confident separation**: Divides intrinsic views (e.g., realism) from relational views (e.g., structuralism) when first-person evidence is granted.

  **Node 4: Palimpsest case (diachronic)**  
  *A subject gains a new phenomenal dimension (e.g., a colour) over a decade, with no changes in reports, discriminations, or remembered contrasts. Is there a fact about this change?*  
  - **Yes** (Change is real) → Leaf 2: **Inconsistent (empty)**  
    - *Why empty*: Merely unattractive inconsistency. After Node 2 (No), synchronic differences don't matter, but diachronic ones do—yet both cases lack behavioural evidence. No position holds this asymmetric view.  
  - **No** (No fact; change is unreal) → Leaf 3: **Illusionism or verbal dispute**  
    - *Awkward commitment*: For illusionism, that phenomenal properties are illusory despite strong first-person intuitions. For verbal dispute, that centuries of debate stem from conceptual confusion.  
    - *Note*: The tree cannot separate these; both answer all nodes identically (e.g., both deny facts in twin-taster and palimpsest).

  **Node 5: Palimpsest case (diachronic)**  
  *Same as Node 4. Is there a fact about this change?*  
  - **Yes** (Change is real) → Node 6  
  - **No** (No fact) → Leaf 4: **Empty (unattractive)**  
    - *Why empty*: Unattractive to accept synchronic facts (Node 3: Yes) but deny diachronic facts when both lack behavioural evidence. No major position adopts this asymmetry.

  **Node 6: Inverted qualia case**  
  *Could two physically identical subjects (same brain states, behaviour, reports) have different intrinsic phenomenal properties (e.g., one experiences red as you experience green)?*  
  - **Yes** (Qualia not fixed by physical states) → Node 8  
  - **No** (Qualia fixed by physical states) → Leaf 5: **Phenomenal-concept strategy (a posteriori physicalism)**  
    - *Awkward commitment*: That phenomenal-physical identities are necessary but only knowable a posteriori, making them seem brute or inexplicable.  
    - **Confident separation**: Distinguishes reductive and non-reductive views after affirming intrinsic properties.

  **Node 7: Palimpsest case (diachronic)**  
  *Same as Node 4. Is there a fact about this change?*  
  - **Yes** (Change is real) → Leaf 6: **Empty (unattractive)**  
    - *Why empty*: Unattractive to deny synchronic facts (Node 3: No) but affirm diachronic facts when both cases have identical relational structures. No position holds this.  
  - **No** (No fact) → Node 9  
    - **Fragile separation**: Relational views should answer identically for synchronic/diachronic cases, but some may resist; however, no major view does.

  **Node 8: Causal efficacy of qualia**  
  *Could intrinsic phenomenal properties exist without any causal effects (e.g., no impact on reports, memory, or behaviour)?*  
  - **Yes** (Qualia can be causally inert) → Leaf 7: **Epiphenomenalism**  
    - *Awkward commitment*: That evolution selects for properties with no causal role, rendering them explanatorily redundant.  
  - **No** (Qualia must have causal effects) → Leaf 8: **Non-reductive phenomenal realism**  
    - *Awkward commitment*: That phenomenal properties are fundamental yet interact with the physical, risking causal overdetermination.  
    - *Note*: Russellian monism/panpsychism falls here too; the tree cannot separate it from non-reductive realism, as both answer all nodes identically.

  **Node 9: Physical reduction of relations**  
  *Can all relations of similarity/difference among experiences (e.g., red resembling orange more than blue) be fully explained by physical properties?*  
  - **Yes** (Relations reducible) → Leaf 9: **Reductive representationalism**  
    - *Awkward commitment*: That phenomenal character reduces to representational content, which seems to omit intrinsic 'what-it's-like-ness'.  
  - **No** (Relations irreducible) → Leaf 10: **Relationalism/structuralism**  
    - *Awkward commitment*: That relations are primitive, making them seem mysterious or ungrounded.  
    - **Confident separation**: Isolates reductive vs. non-reductive flavours of relationalism.

  ---

  ### Leaves Summary (10 leaves)
  1. **Incoherent (empty)**: As described.  
  2. **Inconsistent (empty)**: As described.  
  3. **Illusionism or verbal dispute**: Tree cannot separate these.  
  4. **Empty (unattractive)**: As described.  
