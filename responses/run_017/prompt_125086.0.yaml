  Word count is brutal at 550 max. Every sentence must pull weight. No citations, no lit review padding. Open with the knowledge gap ("standard resolution ignores...") not the paradox itself. And that closing paragraph must show intellectual honesty—maybe list specific tests that would disprove the theory.

  For the biostat objection: emphasize that accessibility is orthogonal to causal role (a confounder can be inaccessible!). Use the hospital choice vs. recovery-probability contrast to show how identical DAGs have different normative implications when accessibility varies. That’s the knife-edge.

  Methodology: 3 months total. Month 1 is quick scan, Month 2 builds cases, Month 3 models decision agents. Skip axiomatic tinkering—too vague for seed grant. Deliverable: a flowchart for applied researchers? "If accessibility=X, report Y." Concrete and testable.

  Failure conditions: if accessibility correlates perfectly with causal type, or if decision models show no difference in outcomes. Admit it might collapse—but worth checking.
answer: |-
  ### Research Proposal: Agent-Accessibility in Resolving Simpson's Paradox  

  **Research Question:** Does the *agent-accessibility of the partitioning variable* at the decision point determine whether aggregate or stratified data is normatively appropriate in Simpson’s Paradox?  

  **Gap:** Standard causal diagrams (confounder/mediator/collider) resolve *how* to adjust but ignore *whether the agent can act* on the partition. When the partition is inaccessible pre-decision (e.g., counterfactual outcomes), aggregate data may retain ethical or practical relevance unaddressed by stratification.  

  **Illustrative Cases (Toy Examples):**  
  1. **Medical Reversal (Type 1 – Accessible):**  
     - *Aggregate:* Treatment A: 70% recovery (140/200) vs. B: 65% (130/200).  
     - *Stratified (Hospital):* A better in Hospital X (80% vs. 70%) and Y (50% vs. 60%).  
     - *Resolution:* Hospital is accessible; choose A *within* your hospital.  

  2. **Admissions Fairness (Type 2 – Inaccessible):**  
     - *Aggregate:* University acceptance: Men 30% (300/1000), Women 20% (200/1000).  
     - *Stratified (Department):* Women have higher acceptance in every dept (e.g., STEM: 50% vs. 40%; Humanities: 60% vs. 50%).  
     - *Problem:* Departments are chosen pre-application; "true stratum" (e.g., aptitude) is unobservable pre-decision. Standard adjustment is impossible for applicants. Aggregate disparity (e.g., pipeline imbalance) may still warrant intervention.  

  **Methodology (3 Months, Feasible w/ Teaching Load):**  
  1. **Month 1:** Catalog paradox examples from medicine/social sciences, tagging accessibility (observable pre-act? counterfactual?).  
  2. **Month 2:** Formalize decision-theoretic agents facing Type 2 cases. Model utility when partitions are inaccessible (e.g., applicant choosing a major without knowing admission strata).  
  3. **Month 3:** Draft reporting guidelines: when accessibility constraints make aggregate/stratified data ethically distinct.  

  **Why Not Alternatives?**  
  - *Axiomatic tinkering:* Less actionable.  
  - *More examples:* Insufficient without modeling agency.  
  - Decision theory directly tests "what can an agent do?"  

  **Deliverable:** Concrete flowchart for applied researchers: "When to report aggregate vs. stratified results based on agent access." (Example: Admissions committees report aggregates if strata are post-decision.)  

  **Failure Conditions:** The project fails if:  
  1. Accessibility correlates perfectly with causal type (e.g., all inaccessible variables are colliders).  
  2. Decision models show no normative difference between accessible/inaccessible cases.  
  3. No real-world examples demand the distinction.  

  **Word Count:** 498  

  ---  
  **Key Response to "Fake Moustache" Objection:** Standard causal roles (e.g., confounder) dictate *statistical* resolution but not *practical* actionability. A variable can be a confounder *and* inaccessible (e.g., "innate recovery potential"), creating a gap between inference and agency. This project tests whether accessibility adds normative structure beyond causal diagrams.
