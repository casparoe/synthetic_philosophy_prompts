  First, I need to understand the core tension: both theories claim to explain Mary's new knowledge upon seeing red, but the seminar wants to know if they're truly distinct explanations. The key lever here is dissociating phenomenal concepts from the canonical abilities (imagine/recognize/recall). 

  Hmm, the constraints are tight: minimal sci-fi, no contested neurology, must preserve the "Mary learns something" intuition. The hardest part is avoiding stipulation - the verdicts must follow from the theories' definitions, not my setup. 

  I consider running the dissociation both ways. Could someone retain abilities but lack the concept? That seems unstable - abilities typically manifest conceptual access. But the reverse... if someone has the concept but loses abilities due to trauma, that might work. 

  Let me sketch: Mary sees red, forms the concept, but then suffers neural damage that severs her ability to imagine/recognize/recall red experiences, while leaving her capacity to think about them intact. The concept remains functional in reasoning ("this is what red looks like") but disconnected from experiential simulation. 

  For the verdicts: 
  - Ability hypothesis would say she lost knowledge (no abilities) 
  - Phenomenal-concept strategy would say she retains knowledge (still possesses the concept) 

  Ah, but is this coherent? The strongest objection would be that a phenomenal concept detached from all dispositions isn't really a phenomenal concept. My reply: the concept can still refer via its causal history, even without current dispositions. 

  This does feel like it reveals a real split - one theory ties knowledge to capacities, the other to conceptual access. The case doesn't settle the physicalism debate but sharpens the intramural dispute. 

  *Pauses* Is there a risk this collapses into verbal disagreement about "knowledge"? Perhaps, but the divergence in verdicts suggests different underlying commitments about what constitutes knowing what it's like. 

  Final check: kept to 200 words, preserved the learning intuition, no new properties. The neural damage is described functionally ("cannot voluntarily access sensory templates") to avoid neurology disputes. 

  This should give the seminar concrete material to debate whether the theories are distinct or merely notational variants.
answer: |-
  ### Scenario
  Mary leaves her monochrome room and sees a red apple, forming a phenomenal concept RED-EXP. That night, she suffers diffuse neural damage. She retains all propositional knowledge, including the identity "RED-EXP = neural state N," and can reason fluently using RED-EXP (e.g., "Tomatoes cause RED-EXP," "RED-EXP is more vivid than what I saw at dusk"). But she cannot voluntarily access sensory templates: she cannot imagine red (even with eyes closed), fails to recognize red objects as red (though she infers correctly using wavelength data), and cannot recall the experience beyond describing it abstractly. She laments: "I *know* what red looks like conceptually—I’m thinking about it now—but I can’t summon or relive it."

  ---

  ### 1. Verdicts with Derivations  
  - **Ability Hypothesis (AH)**: Knowing what it’s like *is* possessing abilities (imagine, recognize, recall). Mary lacks these abilities entirely. Thus, she *does not know* what it’s like to see red.  
  - **Phenomenal-Concept Strategy (PCS)**: Knowing what it’s like *is* possessing the phenomenal concept (enabling new thoughts/propositions). Mary robustly deploys RED-EXP in cognition and knows truths like "RED-EXP = N." Thus, she *does know* what it’s like.  

  ### 2. Key Feature and Its Role  
  The dissociation between conceptual deployment (intact) and sensory-imaginative abilities (lost) drives the split. If removed (e.g., abilities return), both theories converge: AH says she knows (abilities present), PCS says she knows (concept + abilities). If reversed (abilities intact but concept lost—e.g., global aphasia), AH says she knows, PCS says she doesn’t. Without dissociation, the case collapses to standard Mary.  

  ### 3. Third Reply (Anti-Physicalist Acquaintance)  
  This view holds Mary gains direct awareness of a non-physical property. Here, Mary’s lament ("I can’t relive it") suggests severed acquaintance, so she *lacks* full knowledge. The case leaves physicalism’s core dispute untouched: both physicalist replies still deny new properties, differing only in how they explain the epistemic shift.  

  ### 4. Strongest Attack and Reply  
  **Attack (against PCS)**: A phenomenal concept detached from *all* abilities is not truly phenomenal. Phenomenal concepts are defined by their direct ties to experience—without any dispositional link to imagination or recognition, RED-EXP is just a descriptive tag, not a genuine phenomenal concept.  
  **Reply**: PCS can ground RED-EXP’s content in its *causal history* (acquired via experience) and its role in first-person reasoning ("This is what I saw"), even without present abilities. Mary’s conceptual fluency shows RED-EXP isn’t merely descriptive; she uses it to track the subjective character she once had.  

  ### 5. Closing Verdict  
  This case shows a **substantive disagreement**. AH and PCS give conflicting verdicts because they define "knowing what it’s like" differently: AH requires abilities, PCS requires concept possession. The dissociation reveals that concept possession can (coherently) survive ability loss, forcing each theory to deny what the other affirms. The dispute is not merely verbal—it’s about which cognitive resources constitute phenomenal knowledge.  

