prompt: |-
  hey — I'm one of the two students on my school's Policy Committee (me, one other senior, three teachers, and the VP) and we're voting thursday on something I can't make up my mind about, so I want to circulate a short written opinion before the meeting.

  Here's the situation. Right now late work is a free for all: every teacher invents their own rule. One takes anything anytime, one docks a letter grade per day, one refuses late work entirely and it's caused actual screaming in the hallway. So two teachers wrote the "Uniform Deadline Policy": same rule in every class, 10% off per day, nothing accepted after three days, no exceptions for any reason, except that students with a 504 or IEP on file get their own extended timeline worked out with the counselor. They're pitching it as fairness — right now your grade depends on which teacher you randomly got — and also as preparation, since deadlines are supposedly real in college and at jobs.

  I read somewhere about researchers comparing "tight" and "loose" cultures: tight ones have more rules and punish breaking them harder, and the story is that places with more historical threats (disease, invasions, famine, crowding) ended up tighter because everyone had to coordinate. I don't know if that's actually true and I don't need it sourced. But I do like that it suggests there are separate dials here: how many rules there are, how harsh the penalty is, how much discretion the person enforcing has, and how visible the enforcement is. My sense is this proposal cranks up harshness and visibility while leaving the number-of-rules dial where it is, and I'm not sure that mix is what anyone would pick on purpose.

  Two other things I keep chewing on. First: when a rule gets very strict and very easy to check, people start aiming at the rule instead of at whatever the rule was for — like shoving in something garbage at 11:59 so you don't lose the 10%. Is that a real pattern or am I inventing it? Second: the 504 carve-out. Everyone can tell who the accommodated kids are because they're the only ones handing things in late, and they already get enough grief about it, and it seems like the tighter the rule is for everyone else the worse that gets.

  So please draft the opinion I'd send the committee. It should land on one concrete recommendation — adopt it, kill it, or adopt it as a one-term pilot with conditions — with a time frame and something we could actually check at the end of the term to decide whether to keep it (I was thinking we disaggregate who's getting penalized: kids with jobs, kids who take care of siblings, kids who travel for sports). It has to take the teachers' argument seriously, especially the part about it being unfair that your grade depends on which teacher you got, because I think that's genuinely the best thing on their side and I can't just wave it away. It should also say plainly what would count as the policy failing, and flag anything in it that's really a values call the committee has to make rather than a factual question.

  Keep it around 700-900 words, something a teacher will actually read on a wednesday night, and please don't put in citations or quotations from research papers — I can't look them up properly and the VP will just make a face at me.
reasoning: |-
  Okay, I need to help a high school student draft an opinion for their Policy Committee about a proposed uniform deadline policy. The student is one of two students on this committee alongside teachers and a vice principal.

  The student has shared several thoughtful concerns: 
  - They're conflicted about the proposal that would implement a strict 10%-per-day penalty with a 3-day cutoff
  - They worry this increases harshness and visibility without addressing the number of rules
  - They're concerned about students gaming the system by submitting poor work last-minute
  - They note the IEP/504 accommodation might stigmatize those students further
  - They want to address the teachers' fairness argument seriously
  - They need concrete recommendations with measurable outcomes

  The student wants a 700-900 word draft that:
  - Lands on one clear recommendation (adopt, kill, or pilot)
  - Includes specific evaluation criteria
  - Takes teachers' fairness concerns seriously
  - Identifies what would constitute policy failure
  - Flags value judgments for the committee
  - Avoids academic citations
  - Stays practical for busy teachers to read

  I'll structure this as:
  1) Acknowledge the problem fairly
  2) Analyze the proposal's strengths/weaknesses
  3) Address the student's concerns thoughtfully
  4) Propose a pilot compromise
  5) Outline specific evaluation metrics
  6) Clarify what's factual vs values-based

  The recommendation should be thoughtful - a pilot program makes sense here since it addresses fairness concerns while allowing real-world testing of the student's worries about harshness and stigma. For evaluation, I'll suggest tracking demographic data on penalties as requested, plus work quality and accommodation impacts.

  The tone needs to be respectful but confident - this student clearly has sophisticated reasoning skills. I'll keep the language accessible but substantive, avoiding jargon while maintaining intellectual rigor. The word count target means being concise but covering all key points thoroughly.
answer: |-
  ## Policy Committee Opinion: Proposed Uniform Deadline Policy  
  **From: [Your Name], Student Representative**  
  **Date: [Date]**  
  **Subject: Recommendation for a Pilot Program with Critical Safeguards**

  I appreciate the effort behind the "Uniform Deadline Policy" proposal. The current inconsistency in late work penalties *is* a genuine problem. It’s unfair that a student’s grade can be significantly impacted simply by which teacher they are assigned, rather than their mastery of the material or effort. The argument for preparing students for future deadlines in college or work also carries weight. These are valid concerns that deserve a solution.

  However, after careful consideration, I believe adopting this specific policy as written carries significant risks that could undermine its goals of fairness and preparation. Instead, I recommend **adopting the policy as a one-term pilot program (e.g., Semester 1 of next year) with mandatory data tracking and two critical modifications.** This allows us to test the theory against real student experiences and gather evidence before committing long-term.

  ### Concerns with the Proposed Policy

  1.  **The "Harshness Dial" and Unintended Consequences:** The proposal focuses heavily on uniformity but significantly cranks up penalty harshness (10% per day, 3-day hard cutoff) and visibility (same rule everywhere). Research on organizational cultures suggests that simply tightening rules and penalties without considering discretion can backfire. My specific worry is that a very strict, easily verifiable rule incentivizes students to *meet the rule* at the expense of the *learning goal*:
      *   **Gaming the System:** Students facing the penalty might prioritize submitting *anything* by the deadline – even incomplete or low-effort work – just to avoid the steep 10% penalty. This defeats the purpose of the assignment and doesn't reflect genuine learning or preparation for future responsibilities (where quality usually matters more than just hitting a timestamp).
      *   **Punishing Complexity & Real Life:** A flat 3-day cutoff ignores that assignments vary wildly in scope and complexity (a worksheet vs. a major research paper). It also provides no buffer for unforeseen but legitimate short-term disruptions common in teenagers' lives (minor illness, family emergencies, tech failures, transportation issues – things that wouldn't necessarily trigger a 504/IEP but significantly impact a tight deadline). The policy risks disproportionately penalizing students managing complex responsibilities (jobs, siblings, demanding extracurriculars) without malicious intent.

  2.  **The Visibility Problem and the 504/IEP Carve-out:** While essential, the accommodation exception creates a significant visibility issue under a uniform, strict policy. If *only* students with documented accommodations are seen submitting work late, it highlights their differences and potentially increases stigma and resentment from peers. The stricter the rule is for the majority, the more pronounced this visibility becomes, contradicting the goal of fairness and inclusion.

  ### Addressing the Core Argument: Fairness Through Uniformity
  I take the fairness argument seriously. The current system *is* arbitrary. A uniform policy *can* address this. However, fairness isn't solely achieved by identical penalties. True fairness also considers:
  *   **Equity:** Do the rules account for different starting points and legitimate external pressures? A truly fair system might need some flexibility built-in, not just uniformity of punishment.
  *   **Focus on Learning:** Is the penalty structure designed to recover lost learning time or simply to punish? Does it encourage students to *still do the work* even if late?
  *   **Predictability:** While the current system is unpredictable, the proposed policy offers predictability only in penalty structure, not necessarily in accommodating the unpredictable nature of life.

  ### Recommendation: A Pilot Program with Modifications & Evaluation
  Therefore, I propose we **adopt the Uniform Deadline Policy framework for a one-term pilot (e.g., Fall Semester), BUT with the following mandatory modifications and evaluation plan:**

  1.  **Modification 1: Tiered Penalty Structure:** Implement a less steep initial penalty with a longer window.
      *   *Example:* 5% penalty per day late, capped at a maximum of 20-25%, with work accepted up to 5 school days late. Work submitted after this receives a zero.
      *   *Why?* This still imposes a consequence for lateness (addressing preparation) but reduces the pressure to submit garbage immediately. It provides slightly more breathing room for complex assignments or minor disruptions without negating the penalty. The cap prevents penalties from becoming completely disconnected from the work's value.

  2.  **Modification 2: Limited, Transparent Discretion (The "Why" Clause):** Allow teachers *one* discretionary "extension without penalty" per student, per semester, to be used for unforeseen, short-term circumstances *not* covered by existing accommodations (e.g., sudden illness, family emergency, verified tech failure). This must be:
      *   Requested *before* the deadline where feasible, or immediately after if not.
      *   Documented briefly by the teacher (e.g., "Student X - extension granted - family emergency, 1 day").
      *   *Why?* This introduces a small, manageable element of discretion to absorb the inevitable bumps in student life without requiring formal accommodations. It prevents the most egregious unfairness of punishing legitimate, non-chronic issues while maintaining overall structure. The transparency (documentation) prevents abuse and maintains fairness.

  3.  **Mandatory Data Tracking & Evaluation (To be reviewed at the end of the pilot term):**
      *   **Who is penalized?** Teachers must track (anonymously for the committee review) the *number of times* the late penalty is applied, disaggregated by:
          *   Student grade level.
          *   Participation in major extracurriculars (e.g., sports teams requiring travel, performing arts).
          *   Known significant out-of-school responsibilities (e.g., part-time jobs >10 hrs/week, primary care for siblings - *based on existing counselor/school data, not new collection*).
          *   Students with existing 504/IEP plans (tracking their *non*-accommodated late submissions specifically).
      *   **Quality Impact:** Teachers should provide brief, anonymized feedback: Did they observe an increase in rushed, low-quality submissions at the deadline compared to before?
      *   **Stigma Observation:** Counselors and teachers should be asked to confidentially note any observed increase in comments or stigma directed towards students using accommodations due to their visible late submissions.
      *   **General Feedback:** Solicit brief, anonymous feedback from all staff and students on the perceived fairness and impact of the pilot policy.

  ### Defining Success and Failure
  *   **Success (Keep/Adopt Long-Term):** The policy demonstrates:
      *   Significant reduction in the *arbitrariness* of late penalties compared to the current system.
      *   Late penalties are applied roughly proportionally across student groups tracked (i.e., no significant disproportionate impact on students with jobs/siblings/sports).
      *   No significant increase in stigma for accommodated students.
      *   No widespread teacher/student reports of a surge in very low-quality "on-time" submissions.
      *   General acceptance that the system is *more* predictable and fair than before.
  *   **Failure (Revise Significantly or Abandon):** The data shows:
      *   Disproportionate penalty impact on specific groups (e.g., working students penalized 3x more often).
      *   A notable increase in stigma observed/reported for accommodated students.
      *   Widespread teacher reports of decreased assignment quality due to deadline panic.
      *   Overuse/abuse of the discretionary extension making the policy meaningless, or conversely, teachers refusing to use it fairly.
      *   Significant negative feedback on fairness or impact from students/staff.

  ### Values Choices for the Committee
  This isn't just about data; core values are at play. The committee must explicitly discuss and decide:
  1.  **Priority of Uniformity vs. Flexibility:** Is absolute uniformity in penalty structure the highest good, even if it creates other inequities? Or is a slightly less uniform system with built-in flexibility for human complexity more aligned with our school's values?
  2.  **Purpose of Deadlines:** Are deadlines primarily about teaching punctuality as an abstract virtue with strict consequences, or are they primarily about managing workflow and ensuring learning happens, where some flexibility aids recovery?
  3.  **Defining "Fairness":** Does "fairness" mean *identical treatment* for all, or does it mean *equitable opportunities* to succeed, which might require different supports or slight variations in rules?

  ### Conclusion
  The current late work system needs reform. The push for uniformity addresses a real fairness issue. However, the proposed policy's strictness risks unintended harms: incentivizing poor work, disproportionately impacting students with complex lives, and potentially increasing stigma for those with accommodations. A pilot program with a moderated penalty structure and limited, transparent discretion offers a way to *test* uniformity while building in safeguards. Crucially, the mandatory data tracking allows us to move beyond anecdotes and make an evidence-based decision about long-term adoption based on *actual impact* on our students.

  I urge the committee to vote for the **one-term pilot program** incorporating the tiered penalty (e.g., 5%/day, max 20-25%, 5-day window) and the documented "one discretionary extension" clause, alongside the robust evaluation plan outlined. Let's gather the evidence to ensure any permanent policy truly promotes fairness and learning for *all* our students.

  Sincerely,  
  [Your Name]  
  Student Representative, Policy Committee
