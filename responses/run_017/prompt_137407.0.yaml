answer: |-
  Below is a translation of major philosophical positions on causation by omission into experimental physics vocabulary, followed by a residue report addressing your conjectures and unresolved tensions. Key terms are defined operationally upfront.

  ### Defined Terms of Art (Your Framework)
  - **Control run/baseline**: A reference measurement where all variables are held at default/normal states (e.g., "no treatment" condition).  
  - **Intervening vs. conditioning**: *Intervening* = actively setting a variable (e.g., flipping a switch); *conditioning* = passive observation (e.g., recording switch position).  
  - **Factorial design**: Experiment manipulating multiple variables to isolate causal contributions via contrasts (e.g., ± voltage, ± light).  
  - **Blocking**: Physically fixing nuisance variables (e.g., temperature) to prevent confounding.  
  - **Screening off**: Variable A screens off B from C if conditioning on A makes B and C statistically independent (i.e., B's correlation with C is explainable by A).  
  - **Error budget**: Quantification of uncertainties, where a *bounded term* is included because you measured/constrained its maximum possible effect.  
  - **Detection limit**: Smallest signal distinguishable from noise; *upper bound* = maximum undetected signal consistent with noise.  
  - **Coarse-graining**: Choosing a state-space resolution (e.g., modeling a switch as ON/OFF rather than electron positions).  

  ---

  ### Translations of Philosophical Positions  
  **1. Counterfactual/Difference-Making (Lewis/Woodward/Pearl)**  
  *Translation*: An omission causes outcome Y if:  
  - In a **factorial design** with intervention on X (e.g., "water plant" vs. "do not water"), the contrast (X=0 vs. X=1) shows a statistically significant change in Y (plant death).  
  - This must hold under **blocking** of all confounding variables (soil type, humidity) and **screening off** of alternatives (e.g., if "lack of sunlight" is correlated with "no water" but screened off when light is fixed).  
  *Apparatus supplied*: The translation *requires* an instrumented omission. "Do not water" is a protocol-defined state (e.g., a control run with watering system disabled). Without this, the contrast is undefined.  
  *Fidelity*: Clean for instrumented omissions. Fails for bare omissions (no defined intervention).  

  **2. Process/Conserved-Quantity (Salmon/Dowe)**  
  *Translation*: Causation requires a physical signal (energy/momentum transfer) along a worldline. An omission (e.g., "no coolant flow") cannot cause pipe rupture because:  
  - It implies the *absence* of a signal in your **error budget**. Rupture occurs due to *presence* of excess heat (measured), not the *lack* of cooling.  
  - **Detection limits** apply: You infer "no flow" from a flow sensor reading <0.1 L/min, but the rupture is caused by positive heat accumulation (a detected signal).  
  *Apparatus supplied*: Relies on a **boundary omission** setup (e.g., coolant system exists but is off). Requires coarse-graining (e.g., modeling "coolant flow" as binary).  
  *Fidelity*: Distorted. Physics treats "no flow" as a *permissive condition* in a causal model, but the rupture mechanism is fully described by energy transfer. The position rejects omissions as causes, yet instrumented omissions still explain *why energy wasn't removed*.  

  **3. Norms/Expectations (Schaffer, McGrath)**  
  *Translation*: Calling an omission "the cause" depends on:  
  - **Protocol violations**: E.g., a technician *deviates from SOP* by not watering Plant A, while watering Plant B (control). Plant A dies.  
  - **Baseline expectation**: The default state ("water when soil dry") is part of the **experimental design**. Contrast: "actual run" vs. "control run with protocol followed."  
  - Without a protocol, omissions are "noise" in the **error budget** (e.g., "untracked environmental factors").  
  *Apparatus supplied*: Full instrumentation (protocol + recording). Bare omissions (e.g., "no rain in desert") lack a normative baseline.  
  *Fidelity*: Clean for lab contexts. Collapses for bare omissions or when protocols conflict.  

  **4. Double Prevention (e.g., Hall)**  
  *Translation*: System A prevents inhibitor B from blocking outcome Y.  
  - **Example**: Safety interlock (A) *disables* a shutdown rod (B) that would absorb neutrons (preventing reaction Y).  
  - **Causal contrast**: Interlock ON (B disabled, Y occurs) vs. interlock OFF (B active, Y prevented).  
  - Requires **instrumented prevention**: B’s effect must be measurable (e.g., neutron flux < detection limit when B active).  
  *Apparatus supplied*: The inhibitor (B) must be a physical component with testable effects.  
  *Fidelity*: Clean if prevention is instrumented (e.g., B’s absorption cross-section is known). Fails if B is hypothetical.  

  ---

  ### Residue Report: Testing Your Conjectures  
  **Conjecture 1: "Omission Gradients" (Instrumented → Boundary → Bare)**  
  - **Supported**:  
    - *Instrumented*: All positions translate cleanly (e.g., "switch OFF" is a control run).  
    - *Boundary*: Process theories struggle (no signal), but norms/counterfactuals work if a default is assumed (e.g., "expected coolant flow").  
    - *Bare*: All frameworks break. E.g., "Nobody watered the plant" lacks:  
      - A **contrast** (who? how many non-actors matter?)  
      - A **baseline** (what counts as "watering" without a protocol?)  
      - **Screening off** (myriad non-actors correlate trivially).  
  - **Indicts the debate**: Philosophers often use bare omissions (e.g., "a stranger didn’t water the plant") but tacitly assume instrumentation (e.g., a "duty" acts as protocol). Disagreements track *unstated assumptions about apparatus*.  

  **Conjecture 2: "Absences Are Model-Mediated"**  
  - **Supported**:  
    - Every "absence" in physics is defined by:  
      - A **detection channel** (e.g., flow sensor → "no flow" inferred from signal < threshold).  
      - A **coarse-grained model** (e.g., ON/OFF states).  
    - Claims like "lack of coolant caused rupture" are shorthand for:  
      - *Positive signals*: Measured heat accumulation > critical threshold.  
      - *Inferred absence*: Coolant flow < detection limit, with uncertainty in **error budget**.  
  - **Dissolves epistemic worry**: The "infinite non-waterers" problem vanishes with **blocking**: Only protocol-defined variables (e.g., "technician A’s duty") enter the model. Other omissions are "noise" (bounded but negligible).  
  - **Relocates metaphysical worry**: Choice of model/coarse-graining is conventional (e.g., why model duty-bound technicians but not passersby?). *But this is a feature, not a bug*: Causal models are tools for prediction/control.  

  **Unresolved Tensions in Your Framework**  
  1. **"Produced vs. Permitted"**:  
     - In physics, "permission" = removing a blocking variable (double prevention). "Production" = adding energy/matter.  
     - *Residue*: Metaphysical asymmetry remains. E.g., a laser (production) vs. opening a shutter (permission). Your framework *represents* both but doesn’t equate them ontologically.  
     - **Verdict**: Indicts the debate. The distinction is model-relative (e.g., coarse-graining the shutter as "ON" hides energy transfers).  

  2. **Tort Law’s Binary Demand**:  
     - Courts ask: "Did omission X *cause* harm Y?"  
     - Your answer: Only if X is a **blocked variable** in a validated causal model (e.g., "duty-bound actor + protocol"). Requires:  
       - A **contrast** (action vs. inaction *ceteris paribus*)  
       - **Bounded noise** (other factors ruled out)  
     - *Residue*: Law often lacks clear protocols/baselines (e.g., "reasonable person" norms).  
     - **Verdict**: Indicts tort law, not your framework. Law’s "yes/no" is a *normative* demand for assigning blame, not a physical fact.  

  3. **Process Theory’s Intuition**:  
     - "Absences don’t *do* anything" persists because:  
       - Physics traces **signal chains** (e.g., neutron flux → energy). Omissions are gaps in chains.  
       - *But*: Instrumented omissions (e.g., switch OFF) *are* causal in models via **contrasts**.  
     - **Verdict**: Occupational deformation! Your bias toward positive signals is sound lab practice but doesn’t negate difference-making.  

  ### Conclusion  
  - **Your framework suffices** for all instrumented/boundary omissions. It exposes philosophical disputes as mismatches in:  
    - Implicit coarse-graining (e.g., duty assignments)  
    - Unstated protocols (e.g., default states)  
    - Undefined detection channels (for absences).  
  - **Bare omissions are unphysical** in experimental science—no apparatus, no model, no causal claim. Philosophers debating them are solving a different (possibly linguistic) problem.  
  - **Model-mediation dissolves epistemic issues** (e.g., profligacy) but highlights pragmatism: Causal models are chosen for utility, not metaphysical truth. Tort law’s demands are normative, not physical.  
  - **Occupational insight, not deformation**: Your discomfort stems from philosophy’s under-specification of apparatus. When instrumentation is explicit, debates about omission resolve into engineering choices.  

  Recommendation: Challenge philosophers to specify the "apparatus" in their examples—protocols, baselines, and detection channels. What remains unresolved may be outside causality proper (e.g., ethics or semantics).
