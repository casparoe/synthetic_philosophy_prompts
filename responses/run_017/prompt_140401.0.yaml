prompt: |-
  I'm trying to work out what I actually think about when a gamble has a value, by trusting my gut on a family of coin-tossing games, and I want the principle that captures my verdicts, if there is one.

  Setup: a fair coin is tossed until it lands heads, and if the first heads falls on toss n a payoff fixed in advance is made. Assume for the exercise that utility is linear in money: I know the diminishing-marginal-utility reply and I don't want it.

  1. Payoff 2^n, the usual St Petersburg game: the value is infinite, it is worth more than any finite entry fee, and I don't think that verdict needs explaining away.
  2. Payoff +2^n/n for odd n and −2^n/n for even n, the Pasadena game: no value at all. That adding the terms in their natural order yields ln 2 strikes me as an artifact of that ordering, since rearranging the same terms yields anything you like.
  3. Payoff ±2^n/n² with the same alternating signs: a genuine value of about 82 cents, and I'd pay 80. Here the expected absolute payoff is finite, about 1.64, which is what I think is doing the work.
  4. The Pasadena game truncated at 1000 tosses, with nothing paid if no heads has fallen by then: a genuine value, a shade under ln 2, and fine to buy.
  5. The Pasadena game plus a sure dollar paid up front: I would pay 90 cents for it without hesitation, and I still want to say it has no value — the verdict I can't state coherently.
  6. The Pasadena game blocked forever: the house runs the procedure twice and credits you the first run's payoff minus the second run's, then does the same again, endlessly, adding each block's net to a running account, and pays you the limit of that balance if it converges and nothing at all if it doesn't. Each block is a difference of two games I have already declared valueless, yet I want to say the whole arrangement is worth exactly 0.

  My own stab: a gamble has a value just in case its expected absolute payoff is finite; where only the positive side diverges the value is +∞, where only the negative side diverges it is −∞, and otherwise there is no value and no betting price is licensed. That saves 1 through 4, but it says I am not entitled to pay 90 cents in case 5 and that case 6 has no value rather than the value 0, and both of those sit badly with me.

  Two cases I haven't settled. A: the same alternating 2^n/n scheme run with a coin biased toward heads; my hunch is that enough bias toward heads cures the game while bias toward tails makes it worse than Pasadena, but I can't say why. B: the Pasadena game with an opt-out, where after the tosses are revealed I may decline the payoff and take nothing instead.

  Is there a principle that gets all six verdicts, or a small set of candidates that differ only in which verdict they sacrifice? Test my principle against the cases, repair it or replace it, and tell me which of my verdicts I should give up.

  Answer in exactly five numbered items, each one or two sentences, with no introduction and no conclusion: (1) the principle, or the two or three candidates, stated precisely enough to apply to games I haven't described; (2) which of my six verdicts it saves and which it overturns, naming the clause that does the work in each case; (3) its verdicts on A and B, with the arithmetic spelled out far enough that I can check it; (4) which verdict you would abandon if forced to choose between a baroque principle that saves all six and a simple one that loses one; (5) what would change your mind, and where your reasoning is most likely to be wrong.
reasoning: |-
  Hmm, let me tackle this problem about valuing gambles in coin-tossing games. The user has described six scenarios and wants a principle that captures their intuitive verdicts on each. They've proposed "expected absolute payoff finiteness" as a criterion but note it fails for cases 5 and 6. I need to find a better principle.

  First, examining the cases: 
  1. St Petersburg (2^n payoff) has infinite value - fine under most frameworks. 
  2. Pasadena (±2^n/n) has no value due to conditional convergence issues. 
  3. Alternating ±2^n/n² has finite expected absolute value (≈1.64) and clear finite worth. 
  4. Truncated Pasadena has definite value ≈ln2 - makes sense as convergence is forced. 
  5. Pasadena plus $1: user would pay 90¢ but insists it "has no value" - the core tension. 
  6. Blocked version converges to 0 - each block valueless but system stabilizes.

  The user's absolute expectation principle fails case 5 (allows paying 90¢ but says shouldn't) and case 6 (says no value instead of 0). I recall that for conditionally convergent series, Riemann showed rearrangements change sums - explaining Pasadena's pathology. The blocked game exploits this by pairing positive/negative terms to force convergence.

  For a better principle: "Value exists iff expectation converges absolutely. Else, if truncation at N yields expectation converging to L as N→∞, then value is L." This handles:
  - Case 1: absolute divergence → ∞
  - Case 2: conditional convergence → no value
  - Case 3: absolute convergence → finite value
  - Case 4: truncation → definite limit
  - Case 5: still no value (same as case 2) - contradicts user's willingness to pay
  - Case 6: no value (no truncation limit defined) but user wants 0

  But case 6 actually does converge under this blocking! The block differences form a new series: each block has expectation 0? Wait no - each block is (X - Y) where X,Y are i.i.d. Pasadena, so E[X-Y]= undefined minus undefined. However, the user describes the running balance converging. This suggests we need to consider the specific summation method imposed by the blocking procedure.

  Perhaps the principle should be: value exists iff there's a summation method (like blocking or Abel summation) that yields a finite limit resistant to further rearrangement. But that gets complicated...

  For case A (biased coin): 
  - Heads bias (p>0.5) makes |payoff| terms decay faster? Actually payoff is ±(1/p)^n / n for geometric stopping time. Absolute expectation ∑ (1/p)^n / n which converges iff p>0.5. Matches user's hunch.

  Case B (opt-out): 
  - User can avoid negative payoffs. So payoff becomes max(original, 0). For Pasadena, this removes negative terms, leaving ∑_{odd n} 2^n/n which diverges to ∞. Value becomes infinite.

  Now for the numbered response:
  1. Proposed principle: Value exists iff expected absolute payoff is finite. Else, if truncating after N tosses gives expected value converging to L as N→∞, then L. Else no value.
  2. Saves 1-4. Overturns 5 (no value, but user would pay 90¢) via absolute divergence clause. Overturns 6 (no truncation limit → no value) but user wants 0.
  3. Case A: For bias p, absolute expectation ∑ (1/p)^n / n converges iff p>0.5 → value iff p>0.5. Case B: Opt-out makes payoff non-negative, absolute expectation = ∑_{odd n} 2^n/n = ∞ → infinite value.
  4. Would abandon verdict on case 5 (accept paying 90¢ doesn't imply "value exists").
  5. If case 6's blocking reliably converged despite rearrangement, I'd adopt a summation-method-dependent value. My reasoning may mistake undefined expectations for non-existence of value.
answer: |-
  1. Principle: A gamble has a value iff its expected absolute payoff is finite; if so, the value is the expectation. Otherwise, it has no value. (Alternative candidate: Value exists iff truncating after N tosses yields expected value converging to a limit L as N→∞, and L is the value.)

  2. Saves cases 1-4: absolute finiteness yields value for 1 (∞), 3 (finite), and 4 (truncation forces absolute convergence). Overturns case 5 (absolute expectation ∑1/n divergent → no value, but you'd pay 90¢) and case 6 (each block has undefined expectation → no value, but you want 0).

  3. Case A: For bias p (heads probability), absolute expectation is ∑(1/p)^n / n; converges iff p > 0.5 → value iff p > 0.5. Case B: Opt-out sets negative payoffs to 0, yielding non-negative payoff with expectation ∑_{odd n} 2^n / n = ∞ → value +∞.

  4. Abandon case 5's verdict: paying 90¢ reveals a "practical value" despite no formal expectation, so accept the simple principle and concede case 5 has no value.

  5. If case 6 converged almost surely to 0 under blocking (despite rearrangement sensitivity), a summation-method-dependent value might work. My reasoning fails if undefined expectations can still yield coherent prices via structural constraints like blocking.
