  Below is a simulation argument decision tree designed as a two-sided A4 handout. It uses 10 concrete scenarios to sort views without jargon, focusing on three core splits: **mind simulation possibility** (can artificial substrates host consciousness?), **self-location probability** (if many sims exist, are *you* likely in one?), and **significance** (does being simulated change anything?). Each question has 2–3 options, and answer patterns map to 10 named positions. Coherent but unoccupied positions are flagged.

  ---

  ### **Handout: Simulation Scenarios**  
  *Answer each scenario with the option closest to your view. No prior knowledge needed.*

  1. **Gradual Replacement**:  
     A scientist replaces a human’s brain cells one-by-one with artificial parts that function identically. The person acts normally afterward.  
     - **A**: This person is still conscious.  
     - **B**: They may act human, but lack true consciousness.  
     - **C**: This question is meaningless.  

  2. **Perfect Simulation**:  
     A computer simulates every particle in a human brain in real-time. The simulated person claims to feel joy and pain.  
     - **A**: This being is genuinely conscious.  
     - **B**: It’s complex code, not consciousness.  
     - **C**: Unanswerable; consciousness can’t be defined.  

  3. **Cosmic Census**:  
     Assume many advanced civilizations exist with godlike computing power. How many would run ancestor-simulations (simulations of their own past)?  
     - **A**: Nearly all would run countless detailed sims.  
     - **B**: Most avoid it (ethics, cost, or disinterest).  
     - **C**: Very few; civilizations die out pre-simulation.  

  4. **Copy Disaster**:  
     Earth is perfectly simulated 1 billion times. Each has a copy of you. How likely are *you* to be a simulation?  
     - **A**: >99.9% likely (billions of copies vs. one real).  
     - **B**: Unknowable; I can’t "sample" from all minds.  
     - **C**: I’m definitely real (self-location is unique).  

  5. **NPC World**:  
     In some sims, only *one* person is fully conscious; others are simple AI (like NPCs in a game). Could *you* be that target?  
     - **A**: Yes; if such sims exist, it’s plausible.  
     - **B**: No; my experiences feel too rich for an NPC world.  
     - **C**: Irrelevant; if I’m simulated, all minds are equal.  

  6. **Meaning Collapse**:  
     You learn we live in a simulation, but it’s indetectable and never intervened in. Does this change life’s meaning?  
     - **A**: **Yes**—actions may be monitored or irrelevant.  
     - **B**: **No**—my experiences matter regardless.  
     - **C**: It only changes abstract philosophy, not daily life.  

  7. **Unexpected Artifact**:  
     Physicists find a grid-like pattern in cosmic rays, hinting at a computational universe. You conclude:  
     - **A**: This proves we’re in a simulation.  
     - **B**: The universe is math-like, but not necessarily simulated.  
     - **C**: It’s a fluke or misinterpretation.  

  8. **Shutdown Scenario**:  
     You learn the simulation ends in 10 minutes. Researchers won’t save you. How do you react?  
     - **A**: Horror—it makes death meaninglessly abrupt.  
     - **B**: Calm—it’s no different than ordinary mortality.  
     - **C**: Fury—I’d rage against the simulators.  

  9. **Simulation Purpose**:  
     If advanced civilizations run simulations, which are most common?  
     - **A**: Ancestor-simulations (historical recreations).  
     - **B**: Research/game sims (testing ideas or entertainment).  
     - **C**: Simulating minds is impractical or rare.  

  10. **Argument from Aliens**:  
      Given the possibility of superintelligent civilizations, which feels most compelling?  
      - **A**: We’re almost certainly simulated (sims vastly outnumber reality).  
      - **B**: We’re likely real (sims are rare or impossible).  
      - **C**: The debate is incoherent or unprovable.  

  ---

  ### **Scoring Key**  
  *Map your answers (e.g., 1A, 2B,...) to one position below. Positions cover 10 leaves; unoccupied combos flagged.*

  | **Position**                     | **Key Answers**                               | **Distinctive Commitment**                                      | 
  |----------------------------------|-----------------------------------------------|-----------------------------------------------------------------|
  | **1. Functionalist**             | 1A, 2A                                        | "Consciousness emerges from function, not biology."             |
  | **2. Substrate Sceptic**         | 1B, 2B                                        | "Silicon/software can’t feel; it just fools us."                |
  | **3. Bostromian**                | 3A, 4A, 5A, 9A                               | "Ancestor-sims are common, so we’re likely in one."             |
  | **4. Simulation Agnostic**       | 3A, 4B or 5B, 10C                            | "Sims exist, but I can’t assign my location."                   |
  | **5. Suffering Ethicist**        | 3B, 10B or 10C                                | "Posthumans wouldn’t run sims—it’s unethical or wasteful."      |
  | **6. Non-Ancestor Realist**      | 3A, 4A, 5A, 9B                               | "We’re probably in a sim, but not an ancestor one (e.g., a game)." |
  | **7. Computationalist**          | 7A, 8A or 8C                                  | "The universe *is* a computation—no ‘simulator’ needed."        |
  | **8. Indifferentist**            | *(Any path to sim-belief)* + 6B and 8B        | "We’re likely simulated, but it changes nothing."               |
  | **9. Significance Alarmist**     | *(Any path to sim-belief)* + 6A or 8A or 8C   | "Being simulated *matters* (e.g., shutdown risk, observation)." |
  | **10. Question Rejector**        | 1C or 2C or 10C                               | "This isn’t philosophy—it’s ungrounded sci-fi."                 |

  ---

  ### **Notes**  
  - **Unoccupied Positions** (coherent but unattractive):  
    - *"Substrate-Switch Denier"* (1A/2B or 1B/2A): Believes gradual replacement works but not full simulation (or vice versa). Rare—most commit to both or neither.  
    - *"NPC Solipsist"* (4A + 5B): Accepts copy-sims but rejects NPC-world sims. Underexplored; assumes self-location varies by sim type.  
  - **Tree Limits**:  
    - Can’t split **Indifferentist**/**Alarmist** by sim *type* (e.g., ancestor vs. game). Add: *"Would you mind if your sim was a game for aliens?"*  
  - **Most Awkward Commitments**:  
    - **Functionalist**: Must accept consciousness in a thermostat if it "functions" like a mind.  
    - **Suffering Ethicist**: Assumes posthuman ethics mirror ours.  
    - **Computationalist**: Equates physics with computation, risking tautology.  
    - **Question Rejector**: Dismisses a mainstream philosophical argument as nonsense.  

  ---

  **How to Use**:  
  1. Tally answers.  
  2. Match to the *Key Answers* column (e.g., if you chose 1A+2A, you’re a **Functionalist**).  
  3. Discuss: Which commitments feel uneasy? Are unoccupied positions viable?  

  Designed for 90-minute sessions—no homework, no footnotes. Print double-sided!
