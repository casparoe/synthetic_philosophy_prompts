prompt: |-
  I'm in the lower sixth, and there's an incident from last term that two people in my year have been arguing about ever since. They've both asked me to referee it and I can't, because I can't tell which of them is using the concepts properly. I want to write the thing up for our school philosophy magazine, so I need to know who is right about what, not just who wins.

  The incident: a girl in my year, Amara, told our head of year that a visiting sports coach had made a racist remark to her during a training session. The head of year said he accepted she was upset, but he did not open a formal complaint. He was overheard telling a colleague that eleven of the last fourteen complaints made by pupils against visiting staff had gone unsubstantiated, and that he had to be careful not to overreact to a single account.

  Here is the argument, compressed but faithful to the moves they actually made.

  (1) Callum: This is straightforwardly a testimonial injustice. Amara was given less credibility than she was owed because of what she is — a pupil, and a Black girl — and the distinctive wrong here isn't the bad outcome or the hurt feelings, it is being downgraded as a knower, as someone who can tell other people how things are. That wrong is done whether or not the hearer meant anything by it and whether or not anything bad follows.

  (2) Nadia: On the standard account, the credibility deficit has to be caused by identity prejudice. The head of year wasn't prejudiced; he was using a base rate — a real log of fourteen cases, most of them unsubstantiated. Reasoning from evidence about a group isn't prejudice just because the group happens to be picked out by identity. So this is at most a harsh outcome, and maybe evidence that the school should investigate complaints better, but it isn't the distinctive wrong Callum is describing.

  (3) Callum: The log is contaminated. Those earlier complaints went unsubstantiated partly because they weren't properly investigated: pupils' witnesses were other pupils, whose word was discounted in turn, and nobody pulled the session records or the staff rota. So a low substantiation rate was manufactured by the very habit of discounting pupils, and now the rate is used to justify more discounting. Call it a laundered credibility deficit — locally rational, genealogically tainted. The hearer reasons impeccably; the deficit he applies is inherited prejudice with the prejudice filtered out of it. Still an injustice, and Amara pays for a record she didn't write.

  (4) Nadia: Two replies. First: if the log is tainted, the people who tainted it are earlier staff and the school's own procedures. The head of year inherits a mess he didn't make. An injustice needs someone who wrongs someone, and here the most you have is a structural defect, which is a different charge and arguably not one you can press against him. Second, and more important: what happened to Amara was practical — she wasn't protected and the coach wasn't challenged. That is ordinary institutional unfairness. If we start calling that epistemic injustice, the term stops picking out anything special. Keep the concept for deficits caused by prejudice in the hearer.

  (5) Callum: You keep assuming the wrong has to be caused by a prejudiced individual, and that's precisely what's in dispute. Look at what Amara now has to do in order to be believed: find adult witnesses, produce a written timeline, manage her tone, escalate past the head of year to someone else. Call it a credibility tax — extra epistemic labour she owes purely because of which group she files into. That is a wrong to her in her capacity as a knower, and it exists even if every individual hearer reasons flawlessly from the evidence in front of him.

  (6) Nadia: The credibility tax is the best thing you've said, but it proves too much. Plenty of people owe extra epistemic labour — a research student has to cite sources, a specialist has to spell out her reasoning, anyone with a contested claim has to document it — and we don't call those injustices. What makes Amara's case different, if it is different, is that the tax tracks her identity. And the moment you build identity-tracking into the wrong, you are back to needing prejudice rather than mere base rates, unless you want to say that any identity-correlated credibility cost is an injustice, which would make ordinary statistical reasoning unjust. And for what it's worth I think the real failure here may not be testimonial at all: the school has no settled vocabulary for what happened to her, since the only categories on offer are banter, misunderstanding and overreaction. That is a failure of shared interpretive resources, which is the hermeneutical kind of case, not the testimonial one.

  (7) Callum: That last move is wrong and it matters. Amara did have the concept: she called the remark racist, and she was understood perfectly well. The deficit arrived after she spoke, not before, so this isn't a hermeneutical case at all, and the testimonial category has to be able to stretch to laundered deficits. I'll grant you this much: if it stretches that far, it's a milder species of the wrong than the plain prejudiced case, and some of what we want to say belongs to the school as an institution rather than to the man in the office.

  Please adjudicate this move by move. I am less interested in who wins than in which specific claims survive.

  Give me the core of your answer as a markdown table, one row per move, with exactly these columns:

  - Move — the number, (1) to (7)
  - Speaker — Callum or Nadia
  - Claim — the single central claim of the move, in one sentence of your own
  - Verdict — one of exactly these five strings: clearly right, mostly right, half right, mostly wrong, clearly mistaken
  - Why — two to three sentences justifying that verdict, addressed to me rather than to the specialists
  - Stated or assumed — the one premise, stated or unstated, that the move depends on most, and whether you think that premise is true

  Rules for the verdicts: judge the claim as made, not the best version of it; if a move rests on a factual or conceptual claim you think is false, say so in the Why column rather than quietly smoothing it over; and do not let the later moves retroactively repair the earlier ones.

  After the table, add three short paragraphs of prose:

  - Overall — who is more right overall, and what exactly they are more right about.
  - What both are missing — the one distinction or question neither of them raised that you think decides more of the argument than anything they did raise.
  - The hinge — which single feature of the case is doing the most work, and what happens to the verdict in (1) and in (5) if you remove it.

  Please write in British English, and please don't give me a reading list, citations or bibliographies — I have no way of looking any of that up, and I only want the argument.
reasoning: |-
  Okay, the user is in lower sixth (Year 12) and needs help adjudicating a philosophical argument about testimonial injustice between Callum and Nadia. They want to present this fairly in their school philosophy magazine, focusing on conceptual accuracy rather than declaring a winner. 

  First, I need to unpack this layered debate. The core tension is whether the head of year's dismissal of Amara's complaint constitutes testimonial injustice (Callum) or mere institutional failure (Nadia). The moves reveal deeper fractures in how we define prejudice, structural harm, and epistemic labour.

  Hmm, the tricky bits:
  - Callum's "laundered credibility deficit" (move 3) cleverly reframes institutional bias, but depends on an unverified claim about past investigations being flawed. 
  - Nadia's distinction between individual prejudice and statistical reasoning (move 2/4) holds water conceptually but overlooks how "neutral" data can perpetuate harm.
  - Their credibility tax debate (moves 5-6) is the most illuminating - both miss that identity-based epistemic labour differs fundamentally from academic rigor because it's imposed rather than chosen.

  *scribbles mental notes for the table*
  Must judge each move as stated, no retroactive fixes. Verdicts need to flag:
  - When claims rely on shaky premises (e.g., Callum assuming past investigations were botched without evidence)
  - Where concepts are misapplied (Nadia wrongly narrowing testimonial injustice to conscious prejudice)
  - That moment when Nadia almost grasps the hermeneutical angle but misapplies it (move 6)

  The hinge is clearly the contaminated log. If those past unsubstantiated complaints resulted from the same credibility deficit Amara faced, then Callum's structural argument holds. Otherwise, Nadia's statistical defense stands. 

  For the prose sections:
  Overall, Callum wins on capturing the systemic wrong, but Nadia is right that calling it testimonial injustice stretches the term. The big missing piece is how identity-correlated statistical reasoning crosses into prejudice when it ignores context (e.g., why pupils' testimony was discounted historically). 

  *checks British English usage*
  Right - "head of year" not "principal", "pupils" not "students". Avoid citations per request. Keep explanations accessible for a school magazine audience.
answer: |-
  Here's the adjudication, move by move, following your specifications. The table is followed by the three prose sections.

  ### Adjudication Table

  | Move | Speaker | Claim                                                                                                                               | Verdict         | Why                                                                                                                                                                                                                                                               | Stated or assumed                                                                          |
  | :--- | :------ | :---------------------------------------------------------------------------------------------------------------------------------- | :-------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- |
  | (1)  | Callum  | Amara suffered testimonial injustice because her credibility was unfairly reduced due to her identity, regardless of intent or outcome. | Half right      | Correct that testimonial injustice involves credibility deficits tied to identity. However, the head's reliance on base rates *could* be non-prejudicial reasoning, so identity prejudice isn't yet established.                                                   | **Assumed**: Identity-based credibility deficits are inherently unjust. **True, but incomplete** - must link to prejudice. |
  | (2)  | Nadia   | Testimonial injustice requires prejudice; the head used objective base rates, not prejudice, so this isn't testimonial injustice.      | Mostly right    | She correctly states that testimonial injustice traditionally requires identity prejudice. Base-rate reasoning isn't *automatically* prejudiced. But she doesn't address whether the base rate itself might be biased.                                            | **Stated**: Reasoning from group evidence isn't prejudice. **True** - statistically sound. |
  | (3)  | Callum  | The base rate is "contaminated" by past credibility deficits, making the head's reasoning a "laundered" form of prejudice.             | Half right      | Logically coherent: if past investigations were flawed *due* to prejudice, the base rate is tainted. **But** he provides no evidence the past cases *were* mishandled (it's asserted, not proven). Assumes causation without verification.                     | **Assumed**: Past unsubstantiated complaints result from prejudice. **Unverified** - could be factual error. |
  | (4)  | Nadia   | 1) The head isn't culpable for structural flaws; 2) Calling this testimonial injustice dilutes the concept - it's institutional unfairness, not epistemic wrong. | Mostly right    | Correct that testimonial injustice typically requires a culpable agent, and structural flaws are distinct. Also right that overextending "testimonial injustice" risks conceptual blurring. But she underplays how identity *shapes* the structural flaw here. | **Stated**: Testimonial injustice needs a wrongdoer with prejudice. **Debatable** - some argue structures can perpetuate it. |
  | (5)  | Callum  | Amara owes extra "credibility tax" (labour) due to her group identity, which is a wrong to her as a knower, even with faultless reasoning. | Mostly right    | The "credibility tax" is a real, identity-linked burden. This *is* an epistemic harm distinct from practical outcomes. But it's not *always* unjust (e.g., burden of proof exists); the injustice lies in identity-based imposition.                             | **Stated**: Identity-correlated credibility tax is inherently unjust. **True, if proven** - but causation needs showing. |
  | (6)  | Nadia   | 1) Credibility tax isn't unique to identity groups; 2) Identity-tracking requires prejudice; 3) The real issue is hermeneutical (lack of shared concepts). | Half right      | Correct that credibility labour isn't uniquely unjust (e.g., academics). **But** she wrongly dismisses identity-tracking without prejudice - statistical discrimination *can* be unjust. Her hermeneutical point is astute but misapplied (Amara *had* the concept). | **Assumed**: Identity-tracking without prejudice isn't unjust. **Mostly wrong** - it can be discriminatory. |
  | (7)  | Callum  | This isn't hermeneutical injustice (Amara had the concept); testimonial injustice *can* include "laundered deficits", though it's milder. | Clearly right   | Spot on: Amara articulated the wrong ("racist remark") and was understood, so no hermeneutical gap. He concedes it's a less direct form of testimonial injustice, which is conceptually flexible.                                                               | **Stated**: Hermeneutical injustice requires lack of concepts. **True** - correct application. |

  ### Overall
  **Callum is more right overall, but narrowly.** He correctly identifies an identity-based epistemic harm ("credibility tax") and the potential for systemic bias ("contaminated log"), even if his evidence for the latter is weak. Nadia rightly insists on conceptual precision and notes the head's plausible non-prejudiced reasoning, but she underestimates how statistical discrimination can perpetuate identity-based injustice and wrongly tries to reclassify the case as hermeneutical.

  ### What Both Are Missing
  **Neither addresses whether the base rate is *appropriately applied*.** Even valid statistics can be misused. Was it reasonable to group *all* pupil complaints together? Were factors like complaint severity or evidence type considered? If the head applied a blanket discount rate without assessing Amara's case individually – especially given the serious nature of racism allegations – this *itself* could constitute prejudiced reasoning (treating pupils as interchangeable), regardless of the log's origins. This bridges Callum's "tax" and Nadia's "base rates" points.

  ### The Hinge
  **The hinge is the "contaminated log" (Move 3).** If Callum can prove the past unsubstantiated complaints resulted from prejudiced credibility deficits (not just insufficient evidence), then the head's reliance on the log *is* laundering prejudice, making (1) and (5) clearly right: Amara suffers a testimonial injustice rooted in systemic bias. **If the log is clean** (past complaints were fairly dismissed), Nadia wins: the head’s reasoning is sound statistics, (1) becomes mostly wrong (no identity prejudice), and (5)'s "tax" might just reflect prudent caution, not injustice. Without proof either way, both claims stay debatable.
