          Set 1: Haptic pair and control
          Set 2: Visual pair and control

          Then we have two groups of students:

            Group A: feels the haptic pair (sphere and rounded cube) and one control (cylinder). Then in the visual array, they see all six objects? But the visual array is the same for all? 

          This is getting too complicated. 

          Given the time, I propose we focus on the identification and prediction tasks, and then in the debrief, we discuss the similarity structure using the objects as examples. 

          We can have the objects available and ask: 
            - "Which of these two objects feel the most similar?" (sphere and rounded cube) -> by touch, some might say they do, some might not? 
            - "Which two look the most similar?" (the two cubes) -> by sight, they are similar.

          And then we can point out that the haptic and visual similarity spaces are not aligned: the two that feel similar don't look similar, and the two that look similar don't feel similar. 

          So we don't need to test it in the task, but we can demonstrate it.

          Therefore, we adjust:

            Objects:
             1. Sphere (H1)
             2. Rounded cube (H2)
             3. Small cube (V1)
             4. Large cube (V2) [difference: 0.1 inch might be too small? make it 1.5" and 2"?]
             5. Cylinder (C1)
             6. Tile (C2)

            In the tactile phase, each student feels two objects: 
               Group A: feels H1 (sphere) and V1 (small cube)
               Group B: feels H2 (rounded cube) and V2 (large cube)

            Why not have each student feel one haptic pair object and one visual pair object? 

            And the control objects are in the visual array but not touched. 

            Prediction task: they have a sheet of silhouettes of all six objects. They choose for each object they feel. 

            Visual array: all six objects on a table, labeled A to F (randomly assigned). 
            They are told: two of these are the ones you felt. Write down the letters of the two you think you felt.

          Then we score:

            For Group A: 
              Prediction for sphere: should be silhouette of sphere (circle) -> if they choose the rounded cube silhouette (square with rounded corners) that's an error? 
              But we expect that for the sphere, they might choose the circle, and for the rounded cube in Group B, they might choose the square with rounded corners. 
              But also, they might mismatch: for the sphere, choose the rounded cube silhouette? because it feels like it might look like that? 

            For the visual pair: 
              Group A feels the small cube: should choose the small square silhouette? 
              Group B feels the large cube: should choose the large square silhouette? 
              But they might not notice the size difference in the silhouette? 

          Phase 3: Visual Matching (15 minutes)

            - After they finish the tactile phase and prediction, they remove the blindfold and are shown the visual array (all six objects, labeled A to F). 
            - They write down the two letters they think they felt.

          Phase 4: Group Discussion and Scoring (10 minutes)

            - We don't want to give answers yet. 
            - Have them pair up: one from Group A and one from Group B. 
            - They compare their experiences: what they felt, what they predicted, what they chose in the visual array. 
            - Then as a class, we collect the results on the whiteboard: 
                 - For Group A: how many chose the correct silhouettes for sphere and small cube?
                 - How many chose the correct objects in the visual array? 
                 - Similarly for Group B.

          Phase 5: Debrief and Philosophical Unpacking (30 minutes)

            - Now we introduce the historical question: Molyneux's problem.
            - Explain the three questions:
                 1. Identification: can they identify by sight alone the object they touched? (our matching task)
                 2. Prediction: can they predict the visual appearance from touch? (our silhouette task)
                 3. Similarity structure: do the senses agree on what is similar? (we have the objects to demonstrate)

            - Map the results:
                 - In the prediction task, for the sphere (Group A): if many chose the rounded cube silhouette, that suggests that by touch they thought it would look like a rounded cube? Or vice versa for Group B? 
                   But note: Group B had the rounded cube: if they chose the sphere silhouette, that would be a mismatch.

                 - In the matching task, for Group A: if they picked the rounded cube in the array (instead of the sphere), that would be an error due to haptic similarity? 
                   But they haven't felt the rounded cube, so why would they pick it? 
                   They might if they see it and think "that looks like what I felt" and then pick it along with the small cube? But they are supposed to pick two they felt. 

                 - Alternatively, they might not pick the sphere at all? 

            - The matching task might be less informative for the similarity structure. 

            - Therefore, we will explicitly demonstrate the similarity structure by asking:

                 - "Which two objects do you think are most similar by touch?" (without touching, from memory) -> they might say sphere and rounded cube.
                 - "Which two are most similar by sight?" -> they might say the two cubes.

            - Then we show that these are not the same pairs.

            - Highlight the confound: they have a lifetime of experience. So they might have used prior knowledge that a sphere looks like a circle and a cube looks like a square. 

            - Ask: what if you had never seen anything? How would you know what a sphere looks like? 

            - Then present the deadlock: 
                 - Friend: the empirical cases show that people who gain sight after congenital blindness cannot do this task at first. 
                 - You: but that doesn't settle whether the senses have common content, only whether they can immediately associate them.

            - Point out: in our exercise, the prediction task might have been done by prior knowledge of the look of shapes, but the matching task required associating the specific felt object with the seen object. 

            - What would count as evidence for common content? 
                 - If the similarity structure were the same, that would suggest common content. 
                 - But we have shown that it is not always the same? 

            - Actually, common content would mean that the shape is represented in the same way in both senses? 

            - We then leave the deadlock for them to ponder.

          Materials:

            - 1 sphere (wooden ball, 1.5" diameter) - approx $1
            - 1 rounded cube: take a 1.5" wooden cube and sand the edges until very rounded. Or buy a rounded cube? Wooden cube: $1, sandpaper: $2.
            - 2 wooden cubes: one 1.5", one 2" - $1 each? 
            - 1 wooden cylinder (dowel, 3" long, 0.5" diameter) - $1
            - 1 wooden tile (2"x2"x0.2") - or use thick cardboard? Free if we have, or $1 for a wooden piece.

            Total: about $10.

            - Paint: all objects painted matte black to remove color and texture clues? Acrylic paint: $5.
            - Brushes: $2.
            - 14 blindfolds: $10 for a pack of 14? 
            - Cloth bags: 14 bags (one per student for each object? so 28 bags? but we can reuse) - we need at least 4 bags (one for each type of object in circulation at a time). We can use 4 bags and rotate. Pillowcases? $1 each x 4 = $4.
            - Cardboard and other materials: maybe $5.

            Total: under $40.

          What can go wrong:

            - Students labeling objects in the tactile phase: prevent by having them work individually and not talk during tactile phase.
            - They might peek: use blindfolds and bags that are not see-through.
            - In the prediction task, they might not take it seriously: frame it as a challenge, with scoring.
            - In the visual array, they might walk around and see the objects from different angles: have them stay behind a line and view from one angle? 
            - The size difference between the cubes might be too obvious: make sure the difference is small (1.5" and 1.6") but then the silhouette might also be very similar. Or make it 1.5" and 1.8" if 1.6" is not available.
            - The rounded cube might not feel enough like a sphere: test beforehand and adjust.
            - Time: 20 minutes for tactile might be tight. 

          Timeline:

            0-5 min: 
              - Introduce: "Today we are going to do an experiment about perception. You will be blindfolded and feel objects, then try to recognize them by sight."
              - Distribute blindfolds and the first bag to Group A (sphere) and Group B (rounded cube). 
              - Explain tactile phase: "When you get the bag, feel the object inside without looking. Then look at the silhouette sheet and choose the silhouette that matches what you think the object looks like. Write down the number. Then put the object back and I will give you the next bag." 
              - They do the first object.

            5-15 min: 
              - Collect the first bag and distribute the second bag: for Group A (small cube), Group B (large cube).
              - They do the second object.

            15-20 min:
              - Collect all bags. 
              - Have them keep their prediction sheets.

            20-35 min:
              - Remove blindfolds. 
              - Show the visual array (six objects on a table, labeled A to F). 
              - "Two of these objects are the ones you felt. Write down the letters of the two you believe you felt."

            35-45 min:
              - Pair Group A and Group B.
              - Have them discuss: 
                    - What they felt? 
                    - What silhouettes they chose and why?
                    - What they chose in the visual array?
              - Then class discussion: 
                    - Ask Group A: what was the first object? (sphere) What silhouette did you choose? (expect circle, but some might choose rounded cube silhouette)
                    - Ask Group B: what was the first object? (rounded cube) What silhouette? (expect rounded cube silhouette, but some might choose circle)
                    - Similarly for the cubes.

            45-80 min:
              - Debrief: 
                    - Introduce Molyneux's problem: a thought experiment about a man blind from birth who gains sight.
                    - Present the three questions:
                          1. Identification: our visual matching task.
                          2. Prediction: our silhouette task.
                          3. Similarity structure: we'll now demonstrate.

              - Demonstration of similarity structure:
                    - Ask: "Which two objects do you think are most similar by touch?" (without touching again). They will likely say sphere and rounded cube.
                    - Ask: "Which two are most similar by sight?" They will likely say the two cubes.
                    - Point out: these are not the same. So the way touch groups objects is not the same as vision.

              - Highlight the confound:
                    - Ask: "Did you use your prior knowledge of what spheres and cubes look like in the prediction task?" 
                    - "What if you had never seen anything? How would you know what a sphere looks like?"

              - Present the deadlock:
                    - "Last night, I argued with a friend. She said that real cases of restored sight show that people cannot immediately do this task. That is the answer."
                    - "I said that doesn't settle whether the senses have common content. They might share the same representation of shape, but the person doesn't know how to associate the new visual experience with the old tactile one. Or they might not share, but the person learns the association."
                    - Point to the results: 
                           - In our class, most of you could predict the silhouette and match the objects. But that's because you have prior knowledge.
                           - For someone without that knowledge, the prediction task would be impossible? 
                    - Ask: "If we found that a newly sighted person could not match the objects, would that prove that the senses don't have common content? Or could it be that they have common content but the person doesn't know how to use the new sense to access it?"
                    - "Conversely, if they could match, would that prove common content? Or could it be that they learned the association quickly?"

              - Conclude by saying that the deadlock is between two ways of understanding the question: as an empirical one about human learning, or as a conceptual one about the nature of perceptual content. 

          What would count as failure?
            - If the students don't experience any difficulty: if they all get everything right, then the haptic and visual pairs didn't work. We need the sphere and rounded cube to be haptically confusable and the two cubes visually confusable.
            - If they come away thinking it's just about memory or attention, we have failed to raise the philosophical issue.

          Mitigations:
            - Test the objects beforehand to ensure the sphere and rounded cube are haptically similar and the two cubes are visually similar under the viewing conditions.
            - In the debrief, explicitly draw out the philosophical distinctions.

          Finally, note that we cannot reproduce the congenital blindness condition. We make that visible by discussing prior knowledge.

          We hope the deadlock arises naturally in the discussion.

   Let's write the minute-by-minute timeline.

    0-5 min: 
      - Introduction and distribution of first object bags and blindfolds.
      - Instructions for tactile phase and prediction sheet.

    5-10 min: 
      - Students explore the first object and make a prediction.

    10-15 min:
      - Collect first bags, distribute second bags.

    15-25 min:
      - Students explore the second object and make a prediction.

    25-30 min:
      - Collect all bags and prediction sheets. Have students keep their prediction choices written down.

    30-45 min:
      - Remove blindfolds. Show visual array (objects labeled A-F). Students write down the two letters they believe they felt.

    45-55 min:
      - Pair Group A and Group B students. They discuss: 
            - What they felt and what silhouettes they chose for each.
            - What they chose in the visual array and why.

    55-60 min:
      - Class discussion of results: 
            - For Group A: 
                Object1 (sphere): how many chose the correct silhouette (circle)? How many chose the rounded cube silhouette?
                Object2 (small cube): how many chose the small cube silhouette? 
                In the array: how many correctly identified the sphere and small cube? 
            - For Group B: similarly.

    60-80 min:
      - Debrief and philosophical unpacking as above.

   We'll need to have the objects ready and painted, the bags, blindfolds, and a printed silhouette sheet (one per student).

   Silhouette sheet example:

     [Silhouette 1] 1. Circle (for sphere)
     [Silhouette 2] 2. Square with rounded corners (for rounded cube)
     [Silhouette 3] 3. Small square (for small cube)
     [Silhouette 4] 4. Large square (for large cube)
     [Silhouette 5] 5. Rectangle (for cylinder)
     [Silhouette 6] 6. Square (for tile)

   Make sure the sizes are to scale.

   Let's hope it works!
answer: |-
  ### Session Design: "The Molyneux Experiment"

  **Core Structure**: A tactile prediction task followed by a visual matching challenge, using objects with deliberately mismatched haptic/visual similarity. Debrief maps outcomes to three philosophical questions.

  ---

  #### **Materials** ($35 total; all from craft/hardware store)
  1. **Haptic Similarity Pair** (feel alike, look different):  
     - *Object A1*: 1.5" smooth wooden sphere ($1).  
     - *Object A2*: 1.5" foam cube with edges heavily sanded into curves (feels sphere-like; $2).  
     - *Visual difference*: Sphere vs. rounded cube.  

  2. **Visual Similarity Pair** (look alike, feel different):  
     - *Object B1*: 1.5" wooden cube painted matte black ($1).  
     - *Object B2*: 1.5" hollow plastic cube (identical appearance) filled with sand, sealed ($2).  
     - *Haptic difference*: Solid wood vs. gritty, weighted interior.  

  3. **Control Pair** (distinct in both senses):  
     - *Object C1*: 3" smooth wooden cylinder ($1).  
     - *Object C2*: 2" ridged PVC pipe ($1).  

  4. **Other**:  
     - 14 cloth drawstring bags (dark, opaque; $10 for bulk).  
     - 14 blindfolds ($8).  
     - Silhouette sheets (cardboard; hand-drawn; $0).  
     - Object labels (A–F) for visual array.  

  **Total Cost**: ~$35.  

  ---

  #### **Timeline (80 Minutes)**
  **Phase 1: Setup (5 min)**  
  - *Instructor silently places 6 objects (A1, A2, B1, B2, C1, C2) on a front table, hidden behind a screen. Distributes:*  
    - 1 blindfold + 1 bag (containing *one* object: A1, A2, B1, or B2) to each student.  
    - 1 silhouette sheet (6 outlines: sphere, rounded cube, cube, cube, cylinder, ridged pipe).  

  **Phase 2: Tactile Prediction (20 min)**  
  - *Instructions*: "Blindfold yourself. Feel the object in your bag. On the sheet, circle the outline matching what you *think* it looks like. *Do not speak*."  
  - *After 5 min*: Collect bags/objects. Redistribute new bags (each student gets a *second* object from a different pair). Repeat.  
  - *Critical twist*: Students handle **one haptic-similarity object** (A1 or A2) and **one visual-similarity object** (B1 or B2). Control objects (C1/C2) are *not* handled.  

  **Phase 3: Visual Matching (15 min)**  
  - Reveal all 6 labeled objects (A–F) on the table.  
  - *Task*: "Identify the *two* objects you handled. Write their labels."  
  - *Scoring*: 1 point per correct match. Announce: "Pairs with highest scores get bragging rights."  

  **Phase 4: Group Analysis (10 min)**  
  - Students pair up (tactile partners). *Prompt*: "Compare: Which silhouette did you choose for each object? Which did you match visually? Where did you disagree?"  
  - Whiteboard columns:  
    - "Correct Silhouette Predictions" (prediction).  
    - "Correct Visual Matches" (identification).  

  **Phase 5: Debrief (30 min)**  
  - *Map outcomes to questions*:  
    | **Student Struggle**          | **Question It Addresses**                          | **Friend vs. You** |  
    |-------------------------------|---------------------------------------------------|-------------------|  
    | Mistaking A1/A2 visually (e.g., confusing sphere for rounded cube) | **Identification**: Can touch be matched to sight? | Friend: "Failure proves senses aren’t pre-calibrated."<br>You: "Mismatch doesn’t mean no shared content." |  
    | Choosing wrong silhouette (e.g., circling cube outline for A1 sphere) | **Prediction**: Can touch anticipate sight? | Friend: "Inability to predict shows no innate link."<br>You: "Prediction requires *learning*—not evidence of shared content." |  
    | Noticing A1/A2 *feel* similar but *look* different, or B1/B2 *look* similar but *feel* different | **Similarity Structure**: Do senses agree on "sameness"? | Friend: "Real-world cases show senses don’t align."<br>You: "Misalignment *presupposes* a common property (shape) to disagree on!" |  

  - *Highlight the confound*:  
    - "Raise your hand if you used past experience (e.g., 'spheres look round') to predict the silhouette."  
    - "Now imagine you’ve *never seen light*. Would you know what a sphere ‘looks like’? What *can* this experiment *not* tell us about Molyneux’s man?"  
      - *Instructor notes*: Emphasize this activity **cannot simulate congenital blindness**. Students’ prior sensory calibration is their "superpower"—and the core confound.  

  - *Force the deadlock*:  
    - "We have data: Some of you misidentified objects. Does this prove vision/touch share nothing? Or could they share everything but require practice?"  
    - "If Molyneux’s man succeeded, would that prove shared content? Or just rapid learning?"  
    - End with: "This is the deadlock. No experiment can resolve it—because it’s about what counts as *evidence* for ‘reality’."  

  ---

  #### **What Will Go Wrong (and Fixes)**  
  1. **Students label objects verbally in tactile phase**  
     - *Prevent*: Ban talking; use "silent protocol." If overheard, note it in debrief: "Did language bridge the senses? What if you had no words?"  

  2. **Treating it as memory test**  
     - *Fix*: Use highly similar objects (e.g., B1/B2). Ask: "Did you *recognize* or *guess* based on feel?"  

  3. **Shaping an easier task**  
     - *Example*: Peeking at silhouettes during tactile phase.  
     - *Mitigate*: Use blindfolds; check bags for holes pre-class. If cheating occurs, confess: "I peeked too. Why did we *want* to? What does that say about reality?"  

  4. **"It’s just about feeling shapes!"**  
     - *Counter*: In debrief, contrast control objects (easy) with mismatched pairs (hard). Ask: "Why was *this* pair confusing? Did your hands and eyes ‘disagree’?"  

  ---

  #### **Failure Conditions**  
  - **Success =** Students express frustration (e.g., *"I thought the sand-filled cube was solid!"*), then pivot to conceptual tension in debrief.  
  - **Failure =**  
    - Students conclude: "It’s obvious—practice matters" (misses philosophy).  
    - No one notices the similarity-structure rift (A1/A2 feel same but look different).  
    - *Salvage plan*: If outcomes are uniform, **rig the next round**: Swap objects so haptic-similarity pair *looks* identical (paint A1/A2 same color), forcing conflict.  

  ---

  **Why This Works**:  
  - The tactile/visual mismatch creates tangible confusion.  
  - Scoring and prediction make stakes visceral.  
  - Debrief uses *their* struggles to unpack the deadlock—no lecture needed.  
  - You embody your view; the "Friend" rebuttal arises from data they generated.  

  **Prep Tip**: Test object pairs with a colleague. If A1/A2 don’t *feel* similar, add rubber coating. If B1/B2 *look* different, repaint identically.
