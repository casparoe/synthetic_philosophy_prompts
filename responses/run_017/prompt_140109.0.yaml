answer: |-
  ### Session Arc (approx. 450 words)

  1.  **Framing the Problem & Social Preferences (10 mins):** Start with the core question: *How should a society rationally rank different social prospects (distributions of goods, states of affairs), especially when there's uncertainty?* Contrast naive "add up happiness" with the need for a rigorous social preference relation `≽_soc` over prospects. **Enables:** Establishing the *goal* (a rational social ranking under uncertainty) and the *object* (social prospects/lotteries). Sets the stage for needing axioms.

  2.  **Individual Rationality & vNM Utility (15 mins):** Recap (for some)/Introduce (for others) that rational individuals, facing uncertainty (lotteries), have preferences satisfying the vNM axioms. This implies each individual `i` has a utility function `U_i`, unique up to positive affine transformation (`a_i * U_i + b_i`), such that `i` prefers lottery `L` to `L'` iff `E[U_i(L)] > E[U_i(L')]`. **Enables:** Defining individual rationality and the cardinal structure of individual utility necessary for the theorem. Establishes `U_i` as representing individual *choice* under risk.

  3.  **Social Rationality & EU Axioms (15 mins):** Argue that *social* preferences over these same uncertain social prospects (`L_soc`) should *also* satisfy the vNM axioms to be rational (completeness, transitivity, continuity, independence). This implies the existence of a *social utility function* `V`, unique up to PA transformation, such that `L_soc ≽_soc L_soc'` iff `E[V(L_soc)] > E[V(L_soc')]`. `V` assigns a real number to each *state*. **Enables:** The core mathematical structure for social choice under risk. `V` is the key function we need to characterise.

  4.  **The Pareto Bridge (10 mins):** Introduce the two Pareto conditions.
      *   **Pareto Indifference (PI):** If *every* individual is indifferent between two certain social states `x` and `y`, then society should be indifferent (`x ~_soc y`).
      *   **Strong Pareto (SP):** If at least one individual strictly prefers `x` to `y` and *no one* prefers `y` to `x`, then society strictly prefers `x` to `y` (`x >_soc y`).
      Emphasise PI is crucial and minimal; SP strengthens it. **Enables:** Linking individual preferences to social preferences for *certain* outcomes. Creates a constraint on what `V` must *be* for certain states.

  5.  **The Aggregation Punchline (15 mins):** State Harsanyi's Theorem: If 1) Individual preferences satisfy vNM axioms, 2) Social preferences satisfy vNM axioms, and 3) Pareto Indifference holds, then the social utility function `V` *must* be a *weighted sum* of the individual utilities: `V(x) = Σ w_i * U_i(x) + C` for some weights `w_i > 0` and constant `C`, for all certain social states `x`. Sketch the proof idea (`V` must be a linear function of the `U_i` vector by PI + the vNM representation). **Enables:** Deriving the utilitarian *form*. Highlights the *joint necessity* of the EU framework (for both individuals and society) *and* PI. The weights appear.

  6.  **Weights, Scaling, and the Impartial Observer (15 mins):** Tackle the weighting head-on. Explain indeterminacy: `U_i` scales are arbitrary. Doubling `U_i` is equivalent to halving `w_i`. The *ratios* `w_i / w_j` *are* meaningful, reflecting the relative social "exchange rate" between individual utility gains. Connect to the impartial observer: Equal weights (`w_i = w_j` for all `i,j`) correspond to the observer giving everyone an *equal chance* of being anyone. Different weights correspond to *loaded* chances. **Enables:** Understanding the source of weights, their meaning (relative value), and their link to the impartial observer framing. Defuses "weights are conventional artefacts" by showing the ratio is substantive.

  ### The Case (approx. 200 words)

  Your coin-flip case is **excellent** and should carry the session. **Use it.**

  *   **The Case:** Society chooses between:
      *   **Option A (Sure):** Person 1 gets 40 "utils", Person 2 gets 60 "utils". (Total 100)
      *   **Option B (Lottery):** Fair coin flip. Heads: P1 gets 90, P2 gets 10 (Total 100). Tails: P1 gets 10, P2 gets 90 (Total 100).
  *   **Why It Works:**
      *   **Clarity:** Simple, symmetric, concrete numbers.
      *   **Captures Key Elements:** Involves uncertainty (lottery), distributional concerns (equality vs. risk), and interpersonal comparisons (implicit in assigning utils).
      *   **Exposes Conflict:** Forces consideration of ex-ante fairness (B gives each person expected utility 50) vs. ex-post inequality (A is equal, B is unequal in each outcome) vs. ex-ante Pareto (Both prefer B ex-ante if we assume `U_i` concave? *Crucially depends on this*).
      *   **Needs No Total Difference:** Keeping total constant (100) is perfect – it isolates the distribution/risk trade-off. Uncertainty *can* be about who gets what (as here) or external events affecting individuals differently – this framing is clear.
  *   **Verdict on Coin-Flip:** **Use it.** Build the session around comparing A and B. Ask students *why* they might prefer A or B. Use it to illustrate vNM for individuals (each prefers B if `U_i` linear or mildly concave?), Pareto (ex-ante, both prefer B -> SP implies society prefers B), and the theorem's conclusion (`V` weights sum, ranks B above A).
  *   **Verdict on Loaded-Dice Variant:** **Mention briefly ONLY in the weights/impartial observer section (Step 6).** Say: "Harsanyi's equal-chance observer gives equal weight. One *could* imagine an observer whose chance of being `i` is proportional to `i`'s lifespan, leading to weights proportional to lifespan. The theorem shows *any* set of positive weights corresponds to *some* 'loaded' observer perspective." **Don't** build a case on it; it risks muddying the core logic for novices. It illuminates the link between weights and observer chances but adds complexity best saved for discussion/Q&A if time.

  ### Misconception Map (approx. 350 words)

  *   **Misconception 1: "Pareto (especially Strong Pareto) is doing all the work; the EU axioms are just decoration."**
      *   **When/How to Head Off:** During Step 5 (The Punchline) and when discussing the Case. **Emphasise:** PI only links *certain* states where *all* are indifferent. SP links *certain* states with unanimous weak/strict preferences. They say *nothing* about how to rank *lotteries* or states where preferences conflict. The vNM axioms for social preferences are *essential* to extend the social ranking from certain states to uncertain prospects in a consistent, expectation-based way. Without them, `V` wouldn't exist in an expected utility form, and the linear aggregation result wouldn't follow. Use the Case: PI/SP alone don't tell us how to rank A vs B (unless we assume individuals have identical risk attitudes and concave utility, making A ex-ante Pareto superior – which highlights the *need* for the EU structure to model risk attitudes formally).
  *   **Misconception 2: "The weights are meaningless artefacts because individual utilities are only defined up to scale (PA transformation)." (Departmental Quip)**
      *   **When/How to Head Off:** Explicitly in Step 6 (Weights/Scaling). **Emphasise:** While *absolute* scaling of an individual's utility (`a_i`) can be absorbed by their weight (`w_i / a_i`), the *relative weights* `w_i / w_j` are **invariant** under rescaling of *any* individual's utility. This ratio represents the *social marginal rate of substitution* between utility for `i` and utility for `j`. If society is willing to transfer resources to increase `j`'s utility by 1 util at the cost of decreasing `i`'s utility by `k` utils, then `w_i / w_j = k`. This is a substantive ethical choice, not a convention.
  *   **Misconception 3: "Harsanyi proves utilitarianism is the only rational choice and refutes prioritarianism (giving more weight to the worse off)."**
      *   **When/How to Head Off:** During Step 5 (Punchline) and Step 6 (Weights/Scaling), and crucially when discussing the Case. **Emphasise:** The theorem derives a *form* (`V = Σ w_i U_i`). It does *not* dictate that `w_i = w_j` (equal weights/classical utilitarianism) or that `U_i` must be linear in goods. Prioritarianism can be incorporated in *two* ways within the Harsanyi framework:
          1.  **Weights:** Assign higher `w_i` to individuals deemed worse off (e.g., permanently disabled). This is *weighted* utilitarianism, still linear.
          2.  **Transformation:** Define the individual `U_i` functions *as* prioritarian transformations of underlying welfare (e.g., `U_i(x) = log(basic_goods_i(x))`). The theorem then aggregates these concave `U_i`'s linearly. It's the *social* aggregation that must be linear in these `U_i`'s, not the `U_i`'s themselves linear in resources. In the Case, if individuals have concave `U_i`, they might *prefer* the sure thing A ex-ante, and Harsanyi's society would then also prefer A if PI/SP hold.
  *   **Misconception 4: "The Impartial Observer (equal chance) is a completely separate, friendlier argument for utilitarianism."**
      *   **When/How to Head Off:** During Step 6 (Weights/Scaling). **Emphasise:** Harsanyi showed the *equivalence*. The Aggregation Theorem (with equal weights) and the Impartial Observer Theorem (with equal chances) are two paths leading to the *same* social welfare function: `Σ U_i`. The observer's expected utility calculation (`(1/N)Σ U_i`) *is* the utilitarian sum. They are different justifications/interpretations converging on the same mathematical object.

  ### The Check (approx. 150 words)

  *   **The Question:** "Suppose we have a valid social welfare function derived via Harsanyi's theorem: `V(x) = w1*U1(x) + w2*U2(x)`. Now, imagine we decide to rescale Person 2's utility function: we use a *new* utility function for them, `U2_new(x) = 2 * U2(x) + 5`. How must we adjust the social welfare function `V(x)` to represent the *same underlying social preferences`≽_soc` over states `x`, assuming we keep `U1` unchanged? What happens to the *relative weight* given to Person 1 vs. Person 2 (`w1 / w2`)?"
  *   **Why it Works:** This directly tests understanding of the PA indeterminacy of individual utilities, the consequential indeterminacy of the *absolute* weights, and the *invariance* of the relative weights (`w1 / w2`). It forces them to apply the transformation rules.
  *   **Wrong-but-Confident Answer:** "You just plug in `U2_new` instead of `U2`, so `V_new(x) = w1*U1(x) + w2*(2*U2(x) + 5)`" (Ignores need to rescale `w2`). Or "You have to set the new weight `w2_new = w2 / 2` to compensate" (Correct for `w2`, but misses the constant `+5` and potentially the invariance of `w1/w2`). Or "The relative weight `w1/w2` changes" (Fundamentally misunderstands the invariance).

  ### What I'll Leave Out (approx. 120 words)

  *   **Cardinal Comparability Debates:** I'll state plainly that Harsanyi *assumes* interpersonal comparisons of utility levels and differences are meaningful enough to form the sum `Σ w_i U_i(x)`, without delving into *how* this is possible ("We'll bracket the deep philosophical questions about the foundation of interpersonal utility comparisons for today").
  *   **Sen's Critique of Welfarism:** I won't engage with the critique that the approach ignores rights, freedoms, or non-utility information, beyond acknowledging that Harsanyi's framework is welfarist ("The theorem takes individual utilities as the sole input; critiques arguing other factors matter belong to broader debates about welfarism").
  *   **Formal Proof Details:** I won't derive the linearity of `V` from PI and the vNM structure step-by-step; I'll sketch the intuition ("The mathematical derivation relies on showing `V` must be a linear function of the `U_i` vector").
  *   **Alternative Aggregation Theorems:** I won't compare Harsanyi to e.g., Arrow or Sen/Swoyer. ("This is focused on Harsanyi's specific result under risk").

  ### Settled vs Contested (approx. 200 words)

  *   **Settled (Among Specialists):**
      *   **The Mathematical Derivation:** Given the axioms (individual vNM, social vNM, Pareto Indifference), the conclusion (social utility is a positively weighted sum of individual utilities for certain states) is logically valid. The proof is uncontroversial.
      *   **Weight Indeterminacy:** The fact that individual utility PA transformations allow corresponding adjustments to weights while preserving the social ordering is mathematically straightforward and uncontested. The invariance of `w_i / w_j` under rescaling of `U_j` is clear.
      *   **Equivalence:** The mathematical equivalence between the Aggregation Theorem (with equal weights) and the Impartial Observer Theorem (with equal chances) is accepted.

  *   **Contested:**
      *   **Appropriateness of Social EU Axioms:** Whether it makes sense to impose the vNM axioms (especially Independence) on *social* preferences over lotteries is highly debated (e.g., Diamond's critique – society might care about ex-post distribution, violating Independence). This is the most significant challenge.
      *   **"Supports Utilitarianism?":** Whether the theorem supports classical (equal-weight) utilitarianism is hotly contested. Critics argue: 1) Equal weights aren't derived, only the form; 2) The EU framework itself is contested for social choice; 3) Interpersonal comparability is problematic; 4) It ignores non-welfarist concerns. Defenders see it as a strong foundation.
      *   **Prioritarianism:** Whether incorporating prioritarianism via concave `U_i` (transformation) is legitimate within Harsanyi's framework, or fundamentally violates the spirit of vNM rationality or welfarism, is contested. The theorem doesn't *refute* prioritarianism defined via transformed `U_i`; it constrains *social* aggregation over those `U_i` to be linear.
      *   **Pedagogical Note:** My emphasis on the *joint necessity* of *both* the social EU axioms *and* PI to derive the sum, and my framing of the weights/impartial observer connection, is standard. However, my relatively brief treatment of the depth of the controversy around the social EU axioms (especially Diamond) might be seen by some as underplaying a major critique. Focusing on the derivation within the assumed axioms is standard pedagogy, but the depth of challenge to those axioms should be acknowledged.
