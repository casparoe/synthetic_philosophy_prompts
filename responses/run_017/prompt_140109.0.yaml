  In What I'll Leave Out, I'll suggest skipping cardinal comparisons, Sen's critique of welfarism, and technical proofs - naming them clearly as beyond scope.

  For Settled vs Contested, I'll clarify that the mathematical derivation is undisputed, while interpretations about utilitarianism, prioritarianism, and applicability of EU axioms are debated. I should note that my pedagogical choice to emphasize the Pareto/EU interplay might be contested.

