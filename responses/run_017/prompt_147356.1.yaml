prompt: |-
  I help run the training day for new volunteer mentors at a youth mentoring charity in Manchester — nothing academic, just a room above a community centre, about eighteen adults ranging from retirees to people on a gap year, and I've got an eighty-minute slot after lunch when everyone is a bit sleepy. I've been reading on my own about the argument that what we do is mostly shaped by the situation we're in rather than by any stable character, and I got into it after a stupid argument with my brother at a family barbecue: he reckons you can tell what someone is really like by how they behave in a crisis, and I said that was rubbish but definately couldn't explain why. So I want to design an activity where the group runs into the idea rather than being told it. Please don't give me any references, reading lists or quotes from studies — I've got no library access and I'm not going to stand up and recite experiments at volunteers, so build the whole thing out of what happens in the room itself.

  Here's the rough version I tried once, which half-worked and half-flopped, so build on it or throw it out. Beforehand everyone writes down privately whether they'd stop to help a stranger who'd dropped a pile of papers in a corridor, and also writes down one adjective for the sort of person who wouldn't stop. Then I hand out envelopes with a small errand to do around the building — take this form to the kitchen, ask at the office for a spare key, whatever — and the envelopes are subtly different: about a third say your one-to-one slot has been moved forward and you need to be quick, about a third have a nice pen or a biscuit tucked inside, the rest are plain. Two of my co-facilitators stage a small mishap in the corridor, someone dropping a folder and looking a bit lost. What I couldn't get right was the sequencing: people either twigged that the envelopes were different and started comparing them, or the whole thing felt so obviously arranged that everyone stopped out of politeness, which proves nothing. So I need rules, materials, who has to know what in advance, an exact timeline for eighty minutes, and ideally a version where the manipulation doesn't depend on anyone being fooled — maybe because they're told there is a manipulation but not which one, or because the interesting data is the gap between what people predicted and what they actually did.

  For the debrief I want two things to land at once. First, that they'd just written down a character adjective for a hypothetical person who walks past, and that a decent number of them then did the walking past themselves because of one sentence on a piece of paper — I'd like them to notice that gap before I name it. Second, I want the strongest version of my brother's objection to get a fair hearing: that maybe the people who stopped are simply the people who always stop, and that one nudge in one corridor doesn't show that anybody lacks a character at all. So tell me how to run the debrief so the sceptics feel heard rather than ambushed (I've got a couple of quite grumpy experienced mentors who'll hate being messed with), how to map particular moments in the activity onto the different parts of the philosophical claim, what will predictably go wrong when I run it and how to handle each of those, and be honest about what the activity just can't show — I'd rather know now that it doesn't touch, say, whether someone is consistent across their whole life, or whether the kind of character worth having is a rare thing or a local, situation-by-situation thing, and then say that bit myself. Oh, and don't use the words virtue or situationist until the debrief. Write it in British English, and as continuous prose only — no headings, bullets, bold text or tables — because I'm pasting it straight into an email to my co-facilitator and she reads it on her phone.
reasoning: |-
  We are going to design an activity that runs for 80 minutes, with the goal of getting volunteers to encounter the idea that behavior is often more influenced by the situation than by stable character traits. The activity should avoid feeling contrived and should address the brother's objection that crises reveal true character.

  Key elements from the rough version that worked:
  - Private prediction about helping behavior and a judgment about non-helpers.
  - A staged mishap (dropped papers) in a corridor.
  - Subtle manipulations via envelopes (time pressure, small reward, neutral).

  Problems to fix:
  - Participants comparing envelopes and realizing the manipulation.
  - The setup feeling too staged, leading to polite helping (not natural).
  - Need to make the gap between prediction and action noticeable without being forced.

  Revised Activity Plan:

  1. **Introduction (5 minutes):** Explain that we are going to do a short activity about how we make judgments about others and ourselves. Emphasize that it's about observing and reflecting, and that there are no right or wrong answers.

  2. **Prediction Phase (10 minutes):** 
     - Hand out a small slip of paper to each participant. Ask them to write privately:
       (a) "If you saw a stranger in a corridor drop a pile of papers and look a bit lost, would you stop to help? (Yes/No)"
       (b) "In one word, what kind of person does not stop to help in that situation?"
     - Collect all slips in a box. Explain that we are going to do a quick errand around the building and that they will each get an envelope with instructions.

  3. **Errand Setup (5 minutes):**
     - Prepare three types of envelopes in advance (without participants knowing the types). Each envelope contains an errand note and a manipulation:
       - Type A (time pressure): Note says, "Please take this form to the kitchen immediately. Your one-to-one slot has been moved forward by 15 minutes, so please be quick. Return to the training room when done."
       - Type B (small reward): Note says, "Please take this form to the kitchen. As a thank you, there is a biscuit/pen inside for you to keep. Return to the training room when done." (Include a biscuit or pen.)
       - Type C (neutral): Note says, "Please take this form to the kitchen. Return to the training room when done."
     - Distribute the envelopes randomly. About one-third of each type. Make sure the distribution is discreet.

  4. **The Staged Incident (Timing: during the errand):**
     - Two co-facilitators stage the incident in the corridor between the training room and the kitchen. One drops a folder of papers and looks a bit flustered. They should be positioned so that every participant passes by on their way to the kitchen.
     - Important: The co-facilitators should not make eye contact or actively solicit help. They should appear absorbed in picking up the papers.

  5. **Observation and Recording (5 minutes after errands):**
     - As participants return, have one co-facilitator discreetly note who stopped to help and who did not. Also note the envelope type each participant had (by having a list of who got which envelope type).
     - Alternatively, to avoid the facilitators having to note it, you can have the participants, upon returning, mark on a new slip whether they stopped to help or not, and then drop that slip in a box. This might be less accurate but avoids suspicion.

  6. **Group Reconvenes (5 minutes):** Bring everyone back and thank them. Do not discuss the incident yet.

  7. **Revealing the Predictions (10 minutes):**
     - Without revealing what happened, ask the group: "When you wrote your prediction, did you think most people would stop or not? Why?" Let a few volunteers share.
     - Then reveal the collective prediction data: "Out of [number] of you, [X] said they would stop, [Y] said they wouldn't." Write these numbers on a flip chart.

  8. **Revealing the Actual Behavior (10 minutes):**
     - Now reveal what actually happened: "During the errand, you passed by a situation: [co-facilitator] dropped some papers. We recorded whether each of you stopped or not. The result: [A] stopped, [B] did not." (Do not break it down by envelope type yet.)
     - Ask: "Is there a gap between what people predicted and what actually happened? Why might that be?"

  9. **Introducing the Manipulation (10 minutes):**
     - Explain that there was a twist: "We actually gave three slightly different types of envelopes. Some had an extra note about time pressure (Type A), some had a small reward (Type B), and some were plain (Type C)."
     - Without naming individuals, show the breakdown of stopping behavior by envelope type (e.g., "Among those with the time pressure note, only 2 out of 6 stopped; with the reward, 5 out of 6 stopped; with the plain note, 4 out of 6 stopped" — adjust with actual numbers). 
     - Emphasize: "This was random assignment. So what might explain the differences in helping?"

  10. **Debrief (20 minutes):** This is the crucial part. Structure it as follows:
      - First, let them notice the gap: "When you wrote that word for the person who doesn't stop, did any of you write that word about yourself when you didn't stop? Why or why not?" This brings out the gap between judgment of others and understanding of self.
      - Then, introduce the brother's objection: "Some might argue that the people who stopped are simply the ones who always stop, and the situation didn't change that. How would we test that? What if we had given everyone the time pressure note? Or if we had given the reward note to everyone? The random assignment shows that the same person might behave differently in different situations."
      - Address scepticism: "I know some of you might feel that this was just a small thing and that in a real crisis, character would show. But think about it: in this case, a single sentence in an envelope made a difference. Does that mean we don't have character? Or that character is more flexible than we think?"
      - Acknowledge limitations: "This activity doesn't show that character doesn't exist. It shows that in a particular situation, small changes in the context can have a big effect on behavior. It doesn't tell us about consistency over a lifetime, or whether some people are more consistent than others. But it does suggest that we should be cautious about judging someone's 'true self' from one action."
      - Finally, link to mentoring: "In our work, we might see a young person behave in a way that seems out of character. This reminds us to ask: what's going on in their situation? What pressures might they be under? And also, when we ourselves have a bad day, it might not be because we're bad mentors, but because of the situation."

  **Materials:**
  - Slips of paper for predictions (two questions).
  - Envelopes (three types, with the notes and any rewards inside).
  - A form for each participant to take to the kitchen (something simple).
  - A box for collecting slips.
  - Flip chart or whiteboard for recording numbers.

  **Who Knows What:**
  - Only the facilitators know about the three envelope types and the staged incident. The co-facilitators staging the incident must not be recognized as part of the training team (if possible, use someone not known to the group). Alternatively, if that's not possible, have them act naturally and not as facilitators during the incident.

  **Timeline:**
  - 0-5 min: Introduction.
  - 5-15 min: Prediction phase and collection.
  - 15-20 min: Distribute envelopes and explain the errand (one at a time to avoid groups).
  - 20-30 min: Participants do the errand (the incident happens during this time). Co-facilitator(s) observe and record behavior (or use the self-report method).
  - 30-35 min: Reconvene and settle.
  - 35-45 min: Reveal predictions and discuss.
  - 45-55 min: Reveal actual behavior and the gap.
  - 55-65 min: Reveal the envelope manipulation and the pattern.
  - 65-85 min: Debrief (20 minutes, as above).

  **Handling Problems:**
  - **Envelopes compared:** Distribute envelopes as they leave one by one. Have them open the envelope only when they are outside the room. Alternatively, if they compare, acknowledge it: "Some of you noticed differences. That's okay. We'll get to that."
  - **Politeness helping:** To make it feel less staged, the incident should be low-key and the person dropping papers should not look directly at participants. Also, the corridor should be a natural path. If too many stop, note that and ask: "Did anyone feel they stopped because they thought it was part of the exercise? How might that have influenced you?"
  - **Sceptics:** In the debrief, invite the experienced mentors to share their views first: "John, you've been a mentor for a while, what do you make of this?" Validate their point: "It's true that in a real crisis, people might show their true colors. But also, we know that even in crises, situational factors matter." Don't try to convince, just show that both factors play a role.
  - **Not enough variation in behavior:** If almost everyone stops (or doesn't), then the manipulation didn't work. Then focus on the prediction gap: "Almost all of you stopped, but when you wrote your predictions, only [X]% said they would. Why the gap? Did the situation feel different when you were in it?"

  **What the Activity Can't Show:**
  - It doesn't prove that character doesn't exist or that it's never consistent. It only shows that in this specific context, a small change in situation affected behavior. It doesn't address long-term patterns or the development of character.

  By structuring the debrief to first let them see the gap, then reveal the manipulation, and then address the sceptics, you create a natural progression. The key is to let the data (the gap and the envelope effect) speak for themselves before drawing conclusions.

  Now, written as continuous prose in British English for your email.
answer: |-
  Here's a complete plan for your eighty-minute session, designed as a seamless narrative you can copy straight into your email. I've refined your original concept to avoid the pitfalls you described, focusing on making the manipulation invisible while highlighting the gap between predicted and actual behaviour. The key shift is having participants reflect on their own actions immediately after the incident, which sidesteps the need for them to be "fooled" and makes the character-situation tension emerge naturally.

  Start by setting up without fanfare. Five minutes before the slot, arrange chairs in a circle and place blank slips of paper and pens on each seat. When everyone’s settled, kick off promptly: "Right, let’s dive into a quick thought experiment. I’ve got a simple scenario for you. Imagine you’re walking down a busy corridor in a building like this one. Ahead of you, a stranger drops a whole folder of papers—they’re scattering everywhere, and the person looks flustered. On your slip, write two things: first, would you stop to help? Just yes or no. Second, in one word, describe the sort of person who wouldn’t stop. Don’t overthink it—thirty seconds. Keep it private for now." Give them a minute to write, then collect all slips into an opaque bag. This takes six minutes tops.

  Next, transition smoothly: "Now, we’re going to simulate the bit before that corridor scenario—something mundane. I need you each to run a tiny errand. You’ll get an envelope with a task. Do it alone, come straight back, and note how you felt on the slip inside." Hand out sealed envelopes as they leave the room one by one. Crucially, there are three envelope types: one-third contain a note saying, "URGENT: Your 1:1 session starts in 90 seconds. Take this form to the kitchen NOW—do not be late!" with a blank form. Another third hold a note saying, "Standard task: Take this form to the kitchen. P.S. There’s a biscuit inside for you—enjoy!" (include a wrapped biscuit). The final third have a neutral note: "Standard task: Take this form to the kitchen." All envelopes also contain a blank slip labelled: "When you finished your task, I felt ______." This setup takes five minutes.

  While they’re out, your two co-facilitators stage the incident midway to the kitchen: one drops a stack of coloured papers (easily visible) and kneels to gather them slowly, avoiding eye contact. The other discreetly observes from a doorway, noting who stops (defined as pausing for more than three seconds or offering help) and who doesn’t—but not intervening. As participants return, they drop their completed "I felt" slips into the bag from earlier. This errand-and-incident phase should take fifteen minutes max. If anyone chats or compares envelopes, your co-facilitator gently redirects: "Pop back in once you’re done—we’re keeping things moving."

  Once everyone’s back, avoid discussing the incident immediately. Instead, spend ten minutes on an unrelated icebreaker—perhaps a quick pair-share about a memorable mentoring moment. This defuses suspicion and lets the corridor event settle. Then, shift gears: "Let’s revisit that corridor scenario. First, I’ll share what you predicted earlier." Pull slips from the bag and tally predictions aloud: "X said they’d help, Y said they wouldn’t. And your words for non-helpers..." List adjectives like "rude," "selfish," or "busy" on a flip chart. Keep it light—"Strong opinions here!" Now, reveal the incident: "Actually, while you were doing those errands, [co-facilitator] dropped papers in the corridor. We noted if people stopped. Here’s what happened..." Share the tally: e.g., "Only six of eighteen stopped." Watch for reactions—there’s your first gap. Ask: "Any surprises compared to your predictions?" Let two or three people respond. Expect someone to say, "I thought I’d help but didn’t!"—that’s gold.

  Now unpack the situation. Take ten minutes to reveal the envelope types without judgement: "Turns out, your errands weren’t identical. Some had urgent notes, some had biscuits, some were plain." Show the three notes. Share the stopping rates per group—e.g., "Most with urgent notes didn’t stop; half with biscuits did; etc." Then, distribute their "I felt" slips back randomly. Ask them to read one aloud: "Stressed," "Rushed," "Fine," "Happy." Discuss: "How might feeling this way affect whether you’d help someone?" Finally, hand back their original prediction slips. Ask: "Look at your own ‘would I help’ prediction and what you actually did. If there’s a gap, what caused it?" Let the room buzz. This is where they self-discover the situation’s power—no need to preach.

  For the twenty-minute debrief, start with your brother’s objection head-on. Say: "One argument could be that the people who stopped are just ‘helpers’—they’d do it anywhere. Those who didn’t stop lack that character. Who finds that convincing?" Nod to your sceptics—let them speak first. Validate them: "Fair point. In crises, maybe character shows through." Then pivot: "But here’s a wrinkle. Some of you predicted you’d help, but didn’t. Why?" Use their words—"You said you felt ‘rushed’ or ‘distracted.’ So, was that a character failure, or did the situation override it?" Highlight the adjectives they used for non-helpers earlier: "When you wrote words like ‘selfish,’ did you mean them for yourselves when you walked past?" That juxtaposition—judgement versus own action—makes the gap visceral. Conclude: "This isn’t about good or bad people. It’s about recognising how small things—a time crunch, a nice gesture—can sway behaviour. In mentoring, that’s huge. If a young person acts out, instead of thinking ‘that’s just them,’ we ask: what’s the situation hiding?"

  Acknowledge limitations transparently: "This was one corridor, one moment. It doesn’t prove character doesn’t exist—maybe you’re usually consistent. But it does suggest that in the messy real world, situations often steer us more than we admit." For your grumpy mentors, frame it as a tool: "It’s not about blaming the situation to excuse behaviour. It’s about widening our empathy—for the kids, and ourselves when we’re not at our best."

  What could go wrong? If everyone stops, say: "Interesting! But look—many still predicted they wouldn’t. Why the mismatch?" If no one admits to not helping, focus on the prediction gap and envelope effects—"Why did urgency change intent?" If sceptics dominate, concede: "Maybe the manipulation was too weak. But in life, don’t small pressures like this accumulate?" Materials are simple: envelopes, three types of notes, blank slips, pens, biscuits, and a stack of coloured papers for the drop. Only facilitators need full knowledge—volunteers should only sense a "vibe shift" post-incident. The timeline anchors in the errand’s immediacy and the debrief’s open questioning, letting the group stumble into the insight. It’s messy by design, but that’s where the learning sparks.
