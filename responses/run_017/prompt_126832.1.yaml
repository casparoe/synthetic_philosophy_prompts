  - **C**: Conditionalization/Plan-Conditionalization (updating norm).  
  - **PP**: Principal Principle-style chance-credence norm.  
  - **U**: Uniqueness (evidence mandates a unique credence function).  

  1. **Is accuracy measured holistically (whole credence function) or additively (sum over propositions)?**  
     - *Mini-case*: Three-cell partition {A, B, C}; holistic evaluates entire function, additive scores each proposition separately.  
