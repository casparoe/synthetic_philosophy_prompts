     - **Weaker** (e.g., avoid sure loss or weak dominance) → Leaf 3: *Holistic Weak*.  

  3. **For additive accuracy, is the scoring rule strictly proper?**  
     - *Mini-case*: Brier score (strictly proper) vs. absolute value score (not proper).  
