prompt: |-
  I staff a standing committee at a private American university that adjudicates petitions about wrongs the institution inherited rather than committed. Typical petitions ask that a building named for a nineteenth-century donor be renamed, that a collection of ancestral remains be repatriated, that the university apologize for and make material amends for a historical expropriation of land, that a scholarship be endowed for the descendants of a group the university excluded, or that it do several of these at once. We meet monthly and handle fifteen to twenty petitions a year; each one produces written findings with reasons that go to the board of trustees, which has the final say. The committee has five members — a historian, a university lawyer, a faculty member, a student, and an alumni trustee — none of them a philosopher. Findings have to be drafted within about three weeks, be readable by someone with no training in the relevant literature, be consistent with what we have decided before, and survive being published. There is essentially no legal mandate behind any of this: in almost every case we are deciding what we owe, not what we are compelled to do.

  What I need is a decision procedure, not a position paper. Concretely: an ordered set of questions a member can run through on a petition, what counts as a sufficient answer to each one, the points at which the procedure stops with a no and issues a short finding, and the points at which it stops and hands the decision to a person because the open question is one of values rather than fact.

  Several things make this harder than it looks, and I want the procedure to handle them rather than hand-wave them.

  First, petitions and press coverage run together four questions that I think have different answers and different conditions: whether the university should acknowledge that a wrong occurred and that it stands in some relation to it; whether it owes anyone anything, and what kind of thing (return of a specific object, repair, money, a program); whether it may or must apologize, and who is in a position to apologize for what; and whether it is entitled to describe itself as guilty. Please keep these separate, with separate conditions, and say which of them can be inherited across generations and which cannot.

  Second, continuity. The institution routinely gets to be the same entity that owns a two-hundred-year-old endowment and a different entity when asked about the wrong that funded it. I want a continuity test that forbids that asymmetry, with sub-questions that a non-specialist can actually answer from an archivist's memo: legal and charter continuity; asset continuity; whether the wrong was done by someone acting in the institution's name or with its resources; whether it was ratified at the time or later, or condemned at the time and merely tolerated; and whether the institution still holds a benefit it would not hold but for the wrong. I also want the procedure to treat present-tense honoring — a name on a building, a portrait, a named chair — as a present act rather than a mere inheritance, and to say what follows from that.

  Third, the wronged party and its successors. Some of our cases have an identifiable successor (a federally recognized tribe, a family whose land was taken); some have a dispersed successor set; some have rival claimants. Say what the procedure does when the successor set is contested, and what kinds of remedy remain available, or stop being available, when nobody can be identified to receive one. Relatedly: some wrongs are over and done with, and some are still going on — an object still held against a continuing objection, an exclusion still reproduced in present admissions or hiring patterns. Cases of the second kind need no theory of inherited guilt at all, and I want that recognized early in the procedure rather than buried.

  Fourth, evidence and burden of proof. The university controls the archive, and in many cases the record is simply silent about the thing that matters. State where the burden lies, what the default is when the record is silent, and whether silence is a no or a maybe-and-then-what.

  Fifth, adequacy of a remedy. I want a test for the failure mode where the institution buys public credit with a gesture that costs it nothing — a plaque, a land acknowledgment, a renaming that a donor's family had stopped caring about — and I want a test for the opposite failure mode, where the procedure ratchets toward whatever the most demanding petition asks for. Tell me how to check whether a proposed remedy is one the successor group would accept, and who is actually bearing its cost.

  Sixth, precedent and cost. "If we do this we will get forty more" is a real consideration for a committee with a finite budget and a board that reads the newspapers, and it is also an easy way to do nothing. Say how floodgates may and may not enter the procedure, and include a consistency check against decisions the university has already made.

  I know the fourfold distinction among criminal, political, moral, and metaphysical guilt that Jaspers drew in his postwar writing on German guilt, and giving me those four labels back is not a procedure. But if one of them is doing real work at a particular step — for instance, if moral guilt is the one that cannot be inherited while something like political liability can — say which step it does the work in and what work it does there.

  Please then run the finished procedure on three petitions in front of us:

  1. A building named for an alumnus merchant whose fortune came from a firm that financed plantation mortgages in the 1840s and 1850s. His gift endowed a chair that is still funded from the original principal. The petition asks that the name come off and that the endowment be redirected to scholarships for descendants of the enslaved people on those plantations. The donor's family currently gives to the university separately and has told us privately that a separate large bequest will be withdrawn if the name comes down.

  2. A teaching collection of ancestral remains and sacred objects taken in the 1920s by a professor working with university funds and university transport, whose field notes record the objections of the community at the time. A federally recognized tribe has requested repatriation of everything. Some of the individuals in the collection cannot be confidently affiliated with any present-day group.

  3. A national organization demanding that the university, as an American institution, formally accept guilt for slavery and contribute to a national reparations fund. There is no specific institutional act and no traceable asset; the benefit, if there is one, is the diffuse benefit of operating inside a slave economy and its aftermath.

  I expect at least one of these to come out somewhere my committee will not like — I would rather be told that than be told what we want to hear — and I expect the procedure to say plainly, somewhere, "this one is a values decision and the procedure stops here." Finally, tell me what the procedure cannot do: which cases it will systematically misdescribe, and where a committee using it should distrust its own output.
reasoning: |-
  Hmm, the user is describing a complex ethical decision-making process for a university committee handling historical injustice petitions. They need a structured procedure that addresses six key challenges: separating four distinct moral questions (acknowledgment, obligation, apology, guilt), establishing institutional continuity, identifying wronged parties, handling evidentiary gaps, evaluating remedy adequacy, and considering precedent/cost implications. 

  The user clearly knows their stuff - they've referenced Jaspers' guilt framework and identified precise pain points like institutional hypocrisy in claiming continuity for assets but not responsibilities. Their frustration with philosophical hand-waving is palpable. What they really need is an operational toolkit, not theory.

  For the procedure design, I'm thinking a flowchart-style approach would work best. We'll need clear stopping rules and decision nodes. Key elements should include:
  - A continuity assessment using concrete factors like charter history, asset tracing, and ratification of past acts
  - Distinguishing between ongoing vs historical harms early in the process
  - Burden of proof rules favoring petitioners when records are silent (since the institution controls archives)
  - Remedy tests focusing on cost-bearing and acceptance by affected groups
  - Strict limits on "floodgate" arguments - only allowing consideration of actual budget constraints, not speculative future claims

  The three test cases are perfectly chosen to stress-test the system. The plantation donor case will challenge our continuity and remedy principles, the repatriation case tests successor identification, and the national slavery petition forces confrontation with diffuse vs specific responsibility. I predict the procedure will reject the third petition on specificity grounds - which might frustrate the committee but would demonstrate intellectual honesty.

  Biggest vulnerabilities in this approach: It'll struggle with colonial-era harms where records are destroyed and successor groups fragmented. Also risks undervaluing symbolic remedies when material ones aren't feasible. The committee should watch for those blind spots.
answer: |-
  Here is a structured decision procedure addressing your requirements, followed by analysis of the three petitions. The procedure is organized as a sequential checklist with stopping points, evidence standards, and clear outputs.

  ---

  ### **DECISION PROCEDURE FOR HISTORICAL WRONG PETITIONS**

  **Key Principles:**  
  1. **Separate the Four Questions:**  
     - **A.** Acknowledgment of Wrong & Institutional Relationship  
     - **B.** Material Obligation (Repair/Return/Compensation)  
     - **C.** Apology (Who may apologize, for what)  
     - **D.** Attribution of Guilt (Moral, political, metaphysical)  

  2. **Continuity Test** must be satisfied *before* addressing A, B, C, or D.  
  3. **Stopping Rules:**  
     - "NO" = Issue short finding rejecting petition.  
     - "VALUES" = Forward to Board with unresolved values question.  
     - "PROCEED" = Continue to next step.  

  ---

  #### **PROCEDURE CHECKLIST**  
  *[Answer sequentially; stop if criteria unmet]*

  **STEP 1: CONTINUITY ASSESSMENT**  
  *Sub-questions (all require documented evidence):*  
  1. **Legal/Charter Continuity:** Has the university maintained unbroken corporate identity since the wrong?  
     - *Sufficient:* Charter amendments, merger documents, or legal opinion confirming continuous existence.  
     - *Default if silent:* Presume continuity (institutions rarely dissolve/reform).  

  2. **Asset Continuity:** Does the university retain tangible/intangible benefits traceable to the wrong?  
     - *Sufficient:* Endowment records, property deeds, or financial audits showing retained assets.  
     - *Default if silent:* Presume *no* benefit retained unless proven.  

  3. **Agency Ratification:** Was the act done:  
     - (a) By an agent (e.g., employee, donor) acting under university authority/resources?  
     - (b) Formally ratified (e.g., board minutes, official acceptance)?  
     - *Sufficient:* Employment records, funding approvals, or contemporary endorsements.  
     - *Default if silent:* Presume *no ratification* unless evidence exists.  

  4. **Present Honoring:** Is the university *currently* commemorating the wrongdoer/act (e.g., named building, portrait)?  
     - *Sufficient:* Active use of name/symbol in university branding/spaces.  

  *Stopping Rule:*  
  - If 1(a) OR 1(b) OR 2 OR 3(a) = **YES** → **PROCEED** to Step 2.  
  - If all = **NO** → **STOP. ISSUE "NO"** (No institutional continuity/benefit).  

  ---

  **STEP 2: NATURE OF WRONG**  
  *Sub-questions:*  
  1. **Is the harm ongoing?** (e.g., retained stolen property, exclusionary policy still active).  
     - *Sufficient:* Current objection by affected group, data showing present disparity.  
     - *If YES:* Skip to Step 4 (no inherited guilt theory needed).  

  2. **Is there a traceable benefit?** (from Step 1.2).  
     - *If NO →* **STOP. ISSUE "NO"** for Material Obligation (B) but proceed to A/C/D.  

  ---

  **STEP 3: WRONGED PARTY & SUCCESSORS**  
  *Sub-questions:*  
  1. **Is there an identifiable successor group?** (e.g., tribe, family association).  
     - *Sufficient:* Federal recognition, genealogical records, or community consensus.  

  2. **Are rival claimants present?**  
     - *If YES:* University must consult all parties; if irreconcilable → **VALUES DECISION** (Board resolves).  

  3. **If no successor exists:**  
     - Material Obligation (B) voids (no recipient).  
     - Proceed only for Acknowledgment (A), Apology (C), Guilt (D).  

  ---

  **STEP 4: BURDEN OF PROOF & EVIDENCE**  
  *Standards:*  
  - **Burden:** On petitioner for initial claim; shifts to university to refute if archives are silent on key facts.  
  - **Silent Record:**  
    - If university controls archives → Presume *petition credible* unless disproven.  
    - Default: Silence = **MAYBE** → Investigate further (e.g., hire external historian).  
  - **Stopping Rule:**  
    - If critical fact unprovable (e.g., intent, consent) → **VALUES DECISION** (Board weighs plausibility).  

  ---

  **STEP 5: REMEDY ADEQUACY**  
  *Tests for proposed remedy:*  
  1. **Cost-Bearing:** Does the remedy impose *meaningful cost* on the university?  
     - *Fail:* Token gestures (plaques, empty land acknowledgments).  
     - *Pass:* Financial loss, relinquished control, or reputational risk.  

  2. **Acceptability:** Would the successor group *reasonably accept* it?  
     - *Sufficient:* Direct consultation; if impossible → align with comparable cases.  

  3. **Precedent Check:** Is remedy consistent with past university decisions?  
     - *If inconsistent* → Justify deviation or revise for parity.  

  *Stopping Rule:*  
  - If remedy fails 5.1 OR 5.2 → **VALUES DECISION** (Board designs new remedy).  

  ---

  **STEP 6: PRECEDENT & COST CONSTRAINTS**  
  *Allowable Considerations:*  
  - Budget impact: "We can afford X remedies/year at $Y limit."  
  - Consistency: "We granted/rejected similar petition Z; this aligns/diverges because..."  

  *Impermissible Considerations:*  
  - "Floodgates" fear absent evidence of budget strain.  

  ---

  **STEP 7: GUILT/APOLOGY ASSESSMENT**  
  *(Applies only if proceeding past Step 1)*  
  - **Acknowledgment (A):** Always possible if continuity exists.  
  - **Apology (C):** Requires:  
    - (a) Present leadership represents the continuous institution, AND  
    - (b) Act was condemned/not ratified at time (Step 1.3).  
  - **Guilt (D):**  
    - **Moral guilt** (Jaspers) = *individual* → **not inheritable**.  
    - **Political liability** (Jaspers) = *institutional* → survives if continuity + benefit (Step 1).  

  ---

  ### **APPLICATION TO PETITIONS**

  #### **Petition 1: Plantation-Funded Building & Endowment**  
  - **Step 1:**  
    - Continuity: YES (unbroken charter).  
    - Asset: YES (endowment still funds chair).  
    - Agency: YES (donor acted as alumnus; university accepted funds).  
    - Present Honoring: YES (named building).  
    → **PROCEED.**  
  - **Step 2:** Harm ongoing? NO. Traceable benefit? YES (endowment).  
  - **Step 3:** Successor group: YES (descendants identifiable via plantation records).  
  - **Step 4:** Burden met (financial records prove origin).  
  - **Step 5:**  
    - Cost-Bearing: YES (loss of donor family funds; redirecting endowment).  
    - Acceptability: Likely YES (direct benefit to group).  
  - **Step 6:** Precedent: Check past renaming/redirection decisions.  
  - **Step 7:**  
    - Acknowledgment: YES.  
    - Apology: YES (act not ratified; modern values condemn).  
    - Guilt: **Political liability** YES (benefit retained). Moral guilt NO (not inheritable).  
  **OUTPUT:** **GRANT PETITION** (Redirect endowment; rename building). *Donor threat irrelevant to obligation.*  

  ---

  #### **Petition 2: Repatriation of Remains/Sacred Objects**  
  - **Step 1:**  
    - Continuity: YES.  
    - Asset: YES (objects still held).  
    - Agency: YES (professor used university funds/transport).  
    → **PROCEED.**  
  - **Step 2:** **Harm ongoing? YES** (retention despite objection). → Skip to Step 4.  
  - **Step 3:**  
    - Federally recognized tribe = clear successor for *some* items.  
    - Unaffiliated remains → **VALUES DECISION** (Board consults tribal partners on protocol).  
  - **Step 4:** Field notes prove objection; silence on consent → burden on university refuted.  
  - **Step 5:**  
    - Remedy: Repatriate all items.  
    - Cost-Bearing: YES (loss of collection; logistics).  
    - Acceptability: YES (tribe requested).  
  **OUTPUT:** **GRANT REPATRIATION** to tribe for affiliated items; **VALUES DECISION** for unaffiliated remains.  

  ---

  #### **Petition 3: National Slavery Reparations**  
  - **Step 1:**  
    - Continuity: YES.  
    - Asset: NO (no traceable benefit; "diffuse advantage" untraceable).  
    - Agency: NO (no specific act by university agents).  
    - Present Honoring: NO.  
    → **STOP. ISSUE "NO"** for Material Obligation (B).  
  - **Proceed only for A/C/D:**  
    - Acknowledgment (A): Permissible (continuity exists).  
    - Apology (C): **VALUES DECISION** (Who may apologize for national sin?).  
    - Guilt (D): Political liability **NO** (no benefit/agency). Moral guilt **NO** (not inheritable).  
  **OUTPUT: NO** to material reparations; **VALUES DECISION** on apology.  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1. **Non-Continuous Entities:** Fails if the institution truly dissolved (e.g., colonial colleges absorbed into new entities).  
  2. **Diffuse Historical Harms:** Systematically rejects reparations for societal sins (Petition 3).  
  3. **Unverifiable Oral Histories:** Requires written/archival evidence; may disadvantage indigenous claims.  
  4. **Moral Innovation:** Cannot resolve *new* ethical claims (e.g., climate reparations).  
  5. **Intergenerational Trauma:** Quantifying non-material harm is beyond scope.  

  **Distrust the Output When:**  
  - Successor groups are fractured (Step 3).  
  - Silence in archives obscures power dynamics (Step 4).  
  - Cost-bearing is symbolic (e.g., "affordable" donations that avoid systemic change).  

  ---  
  This procedure forces clarity on continuity and benefit while quarantining values questions. It will occasionally produce "uncomfortable" outcomes (e.g., rejecting national reparations) but prevents institutional self-dealing. The Board retains authority on unresolvable values conflicts and remedy design.
