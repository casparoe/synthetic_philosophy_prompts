prompt: |-
  I should say at the outset that I have no academic background in philosophy. What I know of this subject comes from a few popular books I picked up on my own and from twenty-odd years around hospitals, first as a hospice volunteer coordinator and now as the lay chair of our hospital trust's clinical ethics advisory group.

  The group is small — a ward sister, a consultant in acute medicine, a GP, a chaplain, a retired solicitor and me. We meet for ninety minutes once a month and we see three or four referrals a month, usually at short notice: a team wants to know whether a proposed change in a dying patient's care is permissible, or a family wants something the team is uneasy about, or a nurse has gone home upset because she feels she has been asked to kill someone. Our advice is advisory only; the responsible consultant and the family decide, and we have a trust solicitor for the legal questions, which are not what I am asking about. What I need is a procedure for the moral question, written so that a group of non-specialists can run it in an hour and write up the result the same afternoon.

  The thing I keep finding is that the distinction people reach for first — killing versus letting die, doing versus allowing — is the one that falls apart in the cases we actually get. Stopping a ventilator is fine by everyone; turning off a device inside someone's chest feels different to some of us even though, so far as I can tell, nothing morally important hangs on the difference; and then there are the cases where 'letting die' looks like a comfortable word we are using to avoid saying what we are doing. I have read a little about the acts/omissions distinction and about the doctrine of double effect, and about the argument that, since any death brought about by an injection could also be brought about by standing back, the bare difference between acting and not acting cannot itself be what matters. But I cannot turn any of that into something I can put in front of my group.

  What I would like is the procedure itself, in two forms. First, a short version — three or four questions on a card — that a nurse in charge can run at three in the morning before a plan goes ahead, and which says clearly when the answer is 'proceed', 'do not proceed', or 'do not proceed without a discussion you cannot have at three in the morning'. Second, the full version: the questions in the order they should be asked; what would count as a sufficient answer to each; the point at which the procedure stops and returns a no; and the points at which it must hand the decision to a named person because the question is one of values rather than of classification. Please mark, at each step, which distinctions have to survive being simplified for a lay group and which can be dropped without loss, and say honestly where the procedure will misfire and what it cannot tell us at all.

  Three rough tests have grown up in our group, and I suspect they are in tension with each other, so I would rather you kept, repaired or scrapped them explicitly than ignored them. The first is the change test: does someone have to make a physical change to the patient's body, or to something currently doing work inside or on it, for the death to occur, or does the death come about if everyone simply stops? The second is the empty ward test: what would happen if every member of staff walked out and nothing was touched for the next hour? The third, which I invented after a bad meeting and do not fully trust, is the mirror test: for any case, construct the case in which exactly the same death is brought about the other way round — by an act if the proposal is an omission, by an omission if it is an act — and see whether our verdict changes. If it does, I take it we are responding to the distinction rather than to anything about the patient, and I am not sure what follows from that. There is also a fourth thing we do informally, which is to ask whether our answer would change if a different professional performed the physical movement — the doctor sets the rate on the pump, the nurse presses the button — and I would like to know whether that question is doing any real work or is just embarrassment.

  Then I would like the procedure run on three cases, and shown briefly on a fourth.

  The first is a man of seventy-one with severe COPD who has been on a ventilator for eleven days after a chest infection; the intensive care team judges that continued ventilation offers no realistic recovery and is burdensome; his family agree; the plan is to give sedation and an opioid infusion first and then remove the breathing tube, with death expected within minutes or hours. Most of us are comfortable with this and would call it letting die, but I would like to see the procedure reach that rather than assume it.

  The second is a woman of sixty-eight with end-stage heart failure and a defibrillator implanted in her chest six years ago. She is now dying, and the cardiology team says the device is likely to fire repeatedly during the dying process, which would be distressing for her and for everyone in the room. We are asked whether deactivating it is permissible. Two of us say this is switching something off and so is relevantly different from not starting a treatment; the rest say it is no different from stopping a drug. Please do not split the difference — tell us which way the procedure goes, and if it goes against the two of us, say why.

  The third is a woman of eighty-four with advanced dementia, no written advance statement, and a nasogastric tube placed after an aspiration pneumonia. She is not otherwise dying. Her family are unanimous that she would not have wanted to be kept alive like this and ask that the tube not be replaced. The plan is to remove it, continue mouth care, and hand-feed her as she will take it — she still seems to enjoy being fed. Several of us want to call this letting die. I want you to tell me whether the procedure lets us.

  The fourth, which I would like run quickly rather than at length, is a syringe driver of midazolam for terminal agitation, increased in the knowledge that the increase may bring her death somewhat sooner. This is the single most common thing we are asked about, and it is where talk of aiming at a death as opposed to foreseeing it has to earn its keep, if it can.

  Two more things. I would rather you told me plainly when the procedure returns an answer my group will dislike than adjusted the steps to reach the answer we would prefer — I can see when people are doing that, and it is most of why I am writing this. And please do not give me references, reading lists or a summary of who has argued what; I have no library access and nothing would come of it. What I want is something I can hand to a ward sister and have her use.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They’re the lay chair of a hospital ethics group, dealing with real-time, high-stakes decisions without academic philosophy training. Their group is diverse—clinicians, a chaplain, a solicitor—and they need a practical, step-by-step procedure for ethical dilemmas that’s usable under time pressure.

  First, I need to unpack their frustrations. They’ve found that traditional distinctions like killing vs. letting die fall apart in actual cases. For example, stopping a ventilator is accepted, but turning off an internal defibrillator feels different to some, even if logically similar. They want a method that avoids philosophical jargon and works for non-specialists in under an hour. 

  Their existing tests—Change Test, Empty Ward Test, Mirror Test—are intuitive but inconsistent. The Mirror Test, in particular, seems valuable for uncovering biases but needs refinement. The user also mentions role-switching (who performs the action) as a concern, which might relate to moral discomfort rather than principle. 

  The core challenge is creating a decision tree that’s both rigorous and accessible. It must handle gray areas explicitly—like when to escalate to named individuals—and flag where simplification risks error. The user prioritizes honesty over comfort; they’d rather an unpopular but defensible outcome than one tweaked to please. 

  For the procedure, I’m thinking of building around three anchors: medical reality (irreversible dying?), intent (primary goal?), and agency (who acts?). These map to their tests but strip away ambiguity. The Change Test becomes "Is the physical change necessary?"—useful only if death is imminent regardless. The Empty Ward Test clarifies inevitability but must specify "untreated dying" to exclude cases like the dementia patient. The Mirror Test gets reframed as checking for inconsistency bias. 

  The syringe driver case (double effect) is their most common query. Here, intent is key: if the primary goal is symptom relief, and death acceleration is an unwanted side effect, it’s permissible. But the procedure must force explicit documentation of that intent. 

  For the dementia case with feeding tube removal: medically, the patient isn’t dying, so stopping artificial nutrition isn’t "letting die" under our definition. This will unsettle some members, but the procedure must call it a value-laden choice (escalate to family/consultant). 

  The defibrillator deactivation? Medically identical to stopping a ventilator—both withdraw artificial intervention. The procedure overrules the objectors because the device is a treatment, not natural bodily function. 

  Finally, the COPD ventilator withdrawal fits cleanly: irreversible dying, withdrawing artificial support, intent to relieve burden. 

  I’ll avoid academic references per their request. The output must be two-tier: a quick-reference card for nurses at 3 a.m., and a full flowchart with exit ramps to human judgment. Crucially, I’ll note where the model fails—like when "burden" is subjective—so users know its limits. 

  This user’s depth of experience is palpable. They’ve seen how theory crumbles in practice. My response must honor that by being ruthlessly functional—a tool, not a treatise.
answer: |-
  Here is a practical, step-by-step procedure designed for your group’s needs. It prioritizes clarity, speed, and clinical reality over philosophical abstraction. The framework is built on **medical inevitability**, **intent**, and **agency**, with explicit off-ramps for value judgments. I’ve retained and refined your tests where they add practical value.

  ---

  ### **I. Quick-Reference Card (3 AM Version)**  
  **Ask these 3 questions:**  
  1. **"Is the patient irreversibly dying *now* (hours/days), even with treatment?"**  
     - **YES →** Go to Q2.  
     - **NO → STOP. Do not proceed.** Escalate to day team/ethics group.  
     - *(If unsure, default to NO).*  

  2. **"Is the action solely about stopping/not starting artificial interventions?"**  
     - **YES →** Proceed.  
     - **NO →** Go to Q3.  

  3. **"Is the *primary goal* to relieve suffering, NOT to cause death?"**  
     - **YES →** Proceed.  
     - **NO → STOP. Do not proceed.** Escalate urgently.  

  ---

  ### **II. Full Procedure**  
  **Steps, Rationale, and Failure Points**  

  | Step | Question | Sufficient Answer | Exit Path | Critical Simplifications/Failures |
  |------|----------|-------------------|-----------|----------------------------------|
  | **1** | **"Is the patient actively dying *now*?** (e.g., multi-organ failure, no curative options, death expected in hours/days regardless of treatment). | Unanimous agreement from clinical team + objective evidence (e.g., declining vitals, terminal diagnosis). | **NO → HALT.** Decision requires values discussion (e.g., dementia case). Escalate to named consultant + family. | *Simplification:* Drops "futility" debates. Focuses on *imminence*. **Fails** if "dying" is ambiguous (e.g., severe dementia). |
  | **2** | **"Does the proposal involve *withdrawing* or *not starting* artificial support?"** (e.g., ventilator, dialysis, implanted device, antibiotics). | The intervention is external/non-bodily (e.g., machine, drug, device). Bodily integrity remains intact. | **NO →** Go to Step 3. | *Retains "Change Test"* but **only for artificial interventions**. *Drops* bodily location (e.g., internal defibrillator = artificial). **Fails** if "artificial" is contested (e.g., feeding tubes). |
  | **3** | **"Would death occur in an empty ward?** (i.e., if all staff left and *no* interventions were provided)." | Death would occur from underlying condition without *new* action (e.g., stopping vent → suffocation; not replacing NG tube → starvation). | **NO → HALT.** Action may *cause* death. Escalate to ethics group. | *Refined "Empty Ward Test"*. **Fails** if death isn’t imminent (e.g., dementia patient may linger for weeks). |
  | **4** | **"Is the *primary intent* to relieve suffering?** (e.g., pain, agitation, distress) — not to end life." | Clinical documentation shows symptom-driven motive (e.g., "agitation unresponsive to lower doses"). | **NO → STOP.** Do not proceed. | *Applies double effect pragmatically*. **Fails** if intent is ambiguous (e.g., "comfort" syringe coinciding with family pressure). |
  | **5** | **"Mirror Test Check:** Would we judge this differently if the *means* were reversed?" (e.g., *not* replacing NG tube vs. removing it). | Consistent judgment regardless of act/omission. Inconsistency suggests bias. | **INCONSISTENT →** Return to Step 1. Reassess medical facts/values. | *Reveals hidden biases*. **Fails** if mirror case is unrealistic (e.g., no equivalent act for "allowing" starvation). |

  **Role-Switching Test (Optional):**  
  - *"Would our judgment change if a different professional performed the action?"*  
    - **Rationale:** If "yes," it signals emotional discomfort (e.g., nurse pressing syringe button), not ethical substance. **Drop this test** — it adds no ethical insight. Escalate only if team cohesion is at risk.  

  ---

  ### **III. Case Applications**  

  #### **Case 1: COPD Ventilator Withdrawal**  
  - **Step 1:** YES (dying now, no recovery).  
  - **Step 2:** YES (withdrawing artificial support).  
  - **Step 3:** YES (death in empty ward from COPD).  
  - **Step 4:** YES (primary goal: relieve burden of ventilation).  
  - **Step 5:** Mirror test consistent (not starting vent = same as stopping).  
  - **OUTCOME:** PROCEED.  

  #### **Case 2: Deactivating Implanted Defibrillator**  
  - **Step 1:** YES (dying now from heart failure).  
  - **Step 2:** YES (defibrillator is artificial support).  
  - **Step 3:** YES (death in empty ward from heart failure; device prevents natural death).  
  - **Step 4:** YES (primary goal: prevent distressing shocks).  
  - **Step 5:** Mirror test consistent (not implanting device initially = same as deactivating).  
  - **OUTCOME:** PROCEED. *Why?* The device is medical treatment. Location (internal/external) is irrelevant. Objectors’ distinction collapses under Step 2.  

  #### **Case 3: Dementia Patient - NG Tube Not Replaced**  
  - **Step 1:** **NO** (not actively dying; could live weeks/months with tube).  
  - **OUTCOME:** **HALT.** Escalate to consultant + family. *Not* "letting die" per procedure (fails Step 1). Decision rests on substituted judgment/values.  

  #### **Case 4: Syringe Driver Increase (Terminal Agitation)**  
  - **Step 1:** YES (actively dying).  
  - **Step 2:** NO (adding drug is an *act*, not withdrawal). → **Proceed to Step 3/4.**  
  - **Step 3:** YES (death would occur soon regardless).  
  - **Step 4:** **CRITICAL QUESTION:** Is the dose increase *proportionate* to symptoms?  
    - Sufficient: Midazolam dose titrated to agitation level (e.g., 10mg → 15mg for worsening distress).  
    - Not Sufficient: "Give 50mg to end it."  
  - **OUTCOME:** PROCEED if Step 4 passes. *Double effect holds*: Death foreseen but not intended.  

  ---

  ### **IV. Limitations & Honest Failures**  
  - **What It Can’t Do:**  
    - Resolve **value conflicts** (e.g., "Is this life worth living?"). These always escalate to family/consultant.  
    - Address **legal gray zones** (e.g., VSED in non-dying patients). Trust solicitor must advise.  
    - Handle **"symbolic" distinctions** (e.g., "turning a dial feels like killing"). The procedure overrules these.  
  - **Where It Misfires:**  
    - **Early-stage disabilities** (e.g., ALS patient refusing vent). Fails Step 1 (not "dying now"). Requires values escalation.  
    - **Ambiguous suffering** (e.g., existential distress). Step 4 may be inadequately subjective.  
    - **Cultural/religious objections**. The procedure is secular; chaplain input needed pre-escalation.  

  ---

  ### **V. Why Your Tests Were Adjusted**  
  - **Change Test:** Kept but narrowed to *artificial* interventions (avoids bodily location traps).  
  - **Empty Ward Test:** Refined to focus on **untreated dying process** (excludes non-imminent death).  
  - **Mirror Test:** Retained as a bias check, not a standalone ethic.  
  - **Role-Switching:** Scrapped. Reveals discomfort, not morality.  

  **Final Note:** This procedure will sometimes mandate uncomfortable outcomes (e.g., the dementia case isn’t "letting die"). It prioritizes **medical reality** over moral intuition. If your group dislikes a result, revisit the clinical facts at Step 1 — not the philosophy.  

  ---
  **Output Format:**  
  - **Quick Card:** Laminated, bullet-pointed.  
  - **Full Procedure:** Flowchart with YES/NO paths.  
  - **Training:** Run 2 practice cases with the group to calibrate.  

  This is built for your reality: no libraries, no jargon, 60-minute deadlines. It won’t solve every dilemma — but it will force clarity when you need it most.
