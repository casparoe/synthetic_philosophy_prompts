prompt: |-
  I've been trying to get my head round how goverment departments here cost out safety regulation — the sort of thing where a rule that prevents a handful of statistical deaths gets waved through or binned depending on whether the monetised benefit beats the cost. As far as I can tell, the number stuck on a prevented death comes out of surveys: you ask people what they'd pay for a very small reduction in their own risk of dying, scale that up, and that's your figure. Three things about the practice puzzle me.

  One: the same surveys also ask what people would need to be paid to accept a small increase in risk, and people name a figure much bigger than what they'd pay to avoid the same risk. The appraisals ignore those answers entirely and use the pay-to-avoid figure for both directions. Two: a decent chunk of respondents refuse to name any figure at all — no amount of money, they say — and those answers get stripped out as protest responses rather than treated as data. Three: when the people at risk are kids, what goes in is what their parents say they'd pay, even though it's the children's lives on the line, and nothing gets deducted for the parents' own distress or for the fact that the parents are themselves being counted elsewhere.

  What I can't work out is what any of this says about what "utility" is even supposed to mean in these documents. Is the money figure a read-off of a preference ordering, so that utility is just a convenient index for ranking bundles and there's nothing more to say about it? Or is it meant to be a quantity of wellbeing that can be totalled across people and compared between them? And do the three bits above even presuppose the same thing? The first looks like it assumes the pay and accept numbers ought to have come out the same; the second looks like it assumes a refusal to trade isn't a preference at all; the third looks like it's helping itself to a surrogate-preference story and a welfare story at the same time, which I suspect is double counting.

  So: reconstruct the theory of utility the practice only really makes sense under. Then tell me which parts it strictly requires and which would sit fine with a rival theory as well — maybe the protest-answers rule is compatible with several views and it's the parent/kid bit doing the real work, or the other way round. If the three bits do pull in different directions, say which one would have to give. And say concretely what an appraisal would look like if you swapped the implicit theory for (a) a view on which utility is a genuine cardinal measure of wellbeing, comparable between people, and (b) a view on which preferences can be incomplete or lexicographic and some goods just aren't commensurable with money. Would the guidance spit out different numbers, or would it stop being able to produce numbers at all?

  One more wrinkle I want your take on: suppose someone proposes an amendment — use the accept figure rather than the pay figure whenever the people at risk already hold, in some legal or customary sense, a claim not to be exposed (they live beside a plant that wants to raise emissions), and keep using the pay figure where nobody was ever owed anything (a firm deciding whether to fit safety kit it was never obliged to fit). Does that amendment actually fix anything, or does it just relocate the same commitment about what the money numbers are measuring?
reasoning: |-
  Okay, the user is really diving deep into the methodology behind how government agencies value human life in cost-benefit analyses for safety regulations. They're puzzled by three specific practices: using only the "willingness to pay" (WTP) figure while ignoring "willingness to accept" (WTA), discarding protest responses, and using parental valuations for children's risks. 

  First, I need to unpack the implicit theory of utility underlying these practices. The user is spot-on that the approach assumes a preference-based, welfarist view where utility is ordinal but made cardinal through money conversion. The consistent use of WTP suggests they're prioritizing a stable monetary metric for welfare comparisons, even though WTA is usually higher. 

  The protest response issue is fascinating. By filtering out "infinity" answers, they're essentially imposing commensurability - assuming all risks can be traded for money. This directly conflicts with non-welfarist views that see life as sacred. 

  The child valuation point reveals a tension: using parental WTP as proxy acknowledges children's welfare matters, but avoids double-counting parental distress. This pragmatic move papers over whether we're measuring the child's welfare or the parent's preference. 

  Now, for the amendment about using WTA for existing rights - clever but problematic. It tries to incorporate entitlement effects, but in practice would create massive inconsistencies. Is a "customary" right stronger than a legal one? The amendment doesn't escape the fundamental issue that WTP/WTA measure different things. 

  The user's real struggle seems to be: is this utility measurement about actual wellbeing or just preference aggregation? And their examples show the framework can't have it both ways. If I had to pick which practice exposes the deepest contradiction, it's the protest response exclusion - it forcibly imposes commensurability where people reject it. 

  For alternative theories: a strict cardinal wellbeing view would demand direct measurement of welfare, not preferences. But since we can't observe wellbeing, they'd still need proxies - and might end up with similar numbers. The incommensurability view would be more radical: some regulations couldn't be cost-justified at all. That might actually be more philosophically consistent, but useless for bureaucrats needing clear thresholds. 

  Final thought: the user's amendment highlights how all monetary valuations are context-dependent. The real fix isn't tweaking WTP/WTA but admitting these numbers are political compromises disguised as technical measures.
answer: |-
  Here's a reconstruction of the implicit theory of utility underlying the described practice, followed by analysis of the tensions, alternatives, and the proposed amendment:

  **The Implicit Theory of Utility:**
  1.  **Preference-Based Welfarism:** Utility is grounded in *revealed preferences* (what people choose/would pay) rather than objective well-being.
  2.  **Cardinality via Money:** Money serves as a *cardinal scaling device* to make preferences comparable and additive across individuals. The Value of a Statistical Life (VSL) derived from WTP surveys is treated as a cardinal measure of the "utility cost" of a death.
  3.  **Commensurability:** All costs and benefits (life, health, time, money) are fundamentally commensurable via monetary valuation. There are no truly "priceless" goods in the policy calculus; everything can be traded off.
  4.  **Existence of Substitutes:** Life/risk reduction is treated as a standard good with substitutes. Money can compensate for increased risk (in theory, if not always in survey responses).
  5.  **Representative Agent (Implicitly):** Individual WTP values are averaged/aggregated to represent *social* WTP for risk reduction.
  6.  **Welfarist Surrogacy:** The preferences of relevant decision-makers (parents for children) are valid proxies for the welfare of the affected individuals.

  **Analyzing the Three Puzzles Against This Theory:**

  1.  **Using WTP, Ignoring WTA:**
      *   **Requirement:** Strictly requires the assumption that WTP and WTA *should* be approximately equal for small risk changes (the "neoclassical" indifference curve assumption). The large discrepancy (often 10x+) is seen as a behavioral "anomaly" (endowment effect, loss aversion) or transaction cost to be ignored for policy consistency.
      *   **Tension:** Reveals a conflict with actual revealed preferences. The practice prioritizes theoretical consistency (using a single, stable VSL number) and policy pragmatism (avoiding massively higher costs if WTA were used) over fidelity to *all* preference data.
      *   **What Must Give:** The commitment to using *all* revealed preference data must give way to the need for a single, manageable, and theoretically convenient number.

  2.  **Stripping "Protest" Responses:**
      *   **Requirement:** Requires the **Cardinality via Money** and **Commensurability** assumptions. Responses refusing trade are interpreted not as valid lexicographic preferences ("life > any amount of money"), but as protest, misunderstanding, or non-compliance. They are excluded to avoid distorting the *cardinal average* with "infinite" values.
      *   **Tension:** Directly conflicts with the possibility of *incommensurability* or *lexicographic preferences* where safety is prioritized absolutely over money. The practice assumes such preferences are irrational or irrelevant for policy.
      *   **What Must Give:** The possibility that some individuals hold fundamentally non-compensable preferences must be rejected. Commensurability is imposed.

  3.  **Parental WTP for Children:**
      *   **Requirement:** Requires **Welfarist Surrogacy**. Parents are deemed the best (or only practical) judges/agents of their children's welfare. It also implicitly assumes *no double-counting*: the parent's WTP *excludes* their own distress (which would be counted elsewhere) and purely reflects the child's welfare value.
      *   **Tension:** Creates ambiguity. Is the number measuring:
          *   *The child's own welfare loss from death?* (But the child's preferences aren't asked).
          *   *The parent's welfare loss from bereavement?* (But this is supposedly excluded).
          *   *The parent's *valuation* of the child's welfare?* (This is the implied surrogate, but it's unclear how well it maps).
      *   **What Must Give:** Clarity about *whose utility* is being measured. The practice fudges this by relying on the surrogate and the no-double-counting rule.

  **Which Parts are Strictly Required vs. Compatible?**

  *   **Strictly Required:** Cardinality via Money, Commensurability, Surrogacy (for non-competents), and the neoclassical indifference assumption (to justify ignoring WTA discrepancies). These are the bedrock enabling the specific quantitative practice.
  *   **Compatible with Rivals:** Preference-Based Welfarism *itself* is compatible with rivals. Rival theories (e.g., objective list, capabilities) could *also* try to assign monetary values (awkwardly), though they wouldn't *start* from surveys. The *specific techniques* (surveys, averaging) are artifacts of the preference-based approach.

  **Alternative Theories & Impact on Appraisal:**

  *   **(a) Cardinal Wellbeing (Comparable):**
      *   **Change:** The VSL wouldn't be based on contingent preferences/WTP, but on a direct (hypothetical) cardinal measure of the wellbeing lost in death. This might consider factors WTP ignores (e.g., age, life stage, dependencies, suffering) or try to aggregate the wellbeing loss *to others* (bereavement, societal loss).
      *   **Impact:** Numbers *could* change significantly. The wellbeing loss from a child's death might be valued higher than an elderly person's relative to current WTP-based VSL. Including bereavement effects *would* involve double-counting under the current framework. The process might become more opaque/normative (how *do* you measure cardinal wellbeing objectively?).
      *   **Result:** Appraisal *could* still produce numbers, but the methodology and likely the values would differ. Commensurability is still assumed.

  *   **(b) Incomplete/Lexicographic Preferences (Incommensurability):**
      *   **Change:** Rejects the **Commensurability** and **Cardinality via Money** assumptions. Accepts that some people *genuinely* hold safety above any monetary trade-off. Recognizes that preferences might not always form complete orderings over life/money bundles.
      *   **Impact:** **Appraisal often *cannot* produce a single monetary VSL number.** "Protest" responses become valid data points revealing incommensurability. CBA becomes impossible for regulations affecting individuals holding such views, or requires qualitative thresholds ("safety must be ensured unless cost is catastrophic"). WTA/WTP discrepancies become unsurprising features, not anomalies to ignore. Parental refusals to trade child safety become more significant.
      *   **Result:** The guidance either stops producing numbers for many regulations or incorporates qualitative "safe minimum standards" alongside quantitative CBA where commensurability *is* deemed to hold.

  **Evaluating the "Entitlement Amendment":**

  *   **Proposal:** Use WTP for new safety benefits (no prior entitlement) and WTA for removing existing protections/adding new risks (where entitlement exists).
  *   **Does it Fix Anything?**
      *   **Potentially:** It acknowledges the empirical reality of the WTA/WTP gap and links it to a theoretically plausible cause (endowment effect / loss of entitlement). It might produce more "accurate" valuations *in specific contexts* by better reflecting how people perceive gains vs. losses of safety rights.
  *   **Does it Just Relocate the Commitment?**
      *   **Yes, Significantly:** It doesn't escape the core commitments.
          *   **Commensurability/Cardinality:** It still reduces life/risk to money, just using different numbers depending on context.
          *   **Preference Basis:** It still relies on contingent valuations (WTA now in some cases).
          *   **Defining Entitlement:** It introduces massive complexity. What defines a "legal or customary claim"? Is it statutory law, common law, regulation, strong social norm? How granular? (e.g., is the "claim" against *this specific* plant's *current* emissions level, or against *any* increase?). This opens the door to endless debate and strategic behavior.
          *   **Inconsistency:** The VSL becomes highly context-dependent, potentially leading to large inconsistencies in the value placed on identical statistical lives depending on the regulatory history, making aggregate benefit calculations messy.
  *   **Verdict:** It's a pragmatic attempt to handle the WTA/WTP gap within the existing paradigm, not a fundamental fix. It relocates the commitment to commensurability into the complex task of defining "entitlement," potentially creating new problems of arbitrariness and inconsistency while still reducing life/risk to monetary trade-offs.

  **Conclusion:**

  The current practice relies on a specific, contestable bundle of theories: preference-based welfarism made cardinal and commensurable via money, enforced by ignoring inconvenient data (WTA discrepancies, protest responses) and employing pragmatic surrogates (parental WTP). The three puzzles highlight tensions within this bundle, particularly the forced imposition of commensurability and the theoretical convenience of ignoring WTA. Switching to a strict cardinal wellbeing theory might change the numbers but retains commensurability. Switching to a theory accepting incommensurability would fundamentally break the quantitative CBA approach for many safety regulations. The entitlement amendment tweaks the valuation context without escaping the core commitment to monetary commensurability, potentially adding operational complexity. The practice ultimately reveals a utilitarian, consequentialist philosophy willing to trade lives for resources, grounded in a specific interpretation of preferences, and reliant on significant simplifications to make this trade-off calculable.
