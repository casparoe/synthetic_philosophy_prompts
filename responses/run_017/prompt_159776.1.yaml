          - A receives 0.8 from B. A thinks: "In my world, someone would only report 0.8 if they had a signal that I cannot explain. The only possible signals in my world give 0.6 or 0.4." So A is confused.

          - We can instruct participants: if you see a report that is not what you would expect given your own prior, then you should question your prior? But we want them to update using their own prior.

          - Alternatively, we can provide them with an updating rule that uses the difference in beliefs as evidence about the possibility of different priors? But that's too advanced.

     Given the challenges, it might be better to reveal after the first exchange that there are different groups and then discuss why they didn't converge.

     **Final Structure for the Activity**:

     Because of the complexity, we will simplify the entire activity to one draw per participant and focus on the common prior breakage and the agreement under common prior.

     **Part 1: Common Prior, Exchange Evidence (Protocol 2) [warm-up]**:

          - Jar: 60% red or 60% blue (truth: say 60% red).
          - Each draws one marble.
          - Initial posterior: 
               - If red: 0.6; if blue: 0.4.
          - Pair up and exchange evidence (i.e., the color they saw).
          - Update: now they have two draws. If both red: 0.69; mixed: 0.5; both blue:0.31.
          - They should agree within the pair.

     **Part 2: Common Prior, Exchange Conclusions (Protocol 1)**:

          - New jar (same setup), new draw.
          - Initial posterior: 0.6 or 0.4.
          - Pair up and exchange conclusions (number).
          - Since in this one-draw setting, the number reveals the evidence, they can update to the same as if they exchanged evidence (so they agree).

     **Part 3: Broken Prior, Exchange Conclusions**:

          - Secretly assign to Group A or Group B.
          - Group A: prior as above (60-40)
          - Group B: they are told the jar is either 80% red or 80% blue (50-50 prior)
          - Actual jar: 60% red.
          - Each draws one marble.
          - Group A: red -> 0.6, blue->0.4
          - Group B: red -> 0.8, blue->0.2
          - Now pair up, but we will try to have some A-A, some B-B, and some A-B.
          - Exchange conclusions.
          - In A-B pairs: 
               If both drew red: A reports 0.6, B reports 0.8.
               A, upon seeing 0.8, should think: "This doesn't make sense in my world. The only way to get 0.8 in my world is if the person had many red draws, but we only did one draw." So A might not update or might be confused.
          - We can instruct: "Update in the way that seems most reasonable to you, given your own prior."
          - A might try to incorporate B's report as evidence. How? 
               A believes the jar is either 60% or 40% blue. A also believes that B has the same prior and updates rationally. 
               So if B reports 0.8, that would be the posterior if B saw a red draw and the jar is 80% red. But in A's world, there is no 80% red. 

          - This is meant to show that without common prior, the update is not defined.

     **Debriefing**:

          - First, in the common prior settings, they agreements. 
          - Second, in the broken prior, they may not agree and may be confused.
          - Then explain the Aumann theorem: two rational agents with the same prior cannot agree to disagree. If they common knowledge of their posteriors, they will converge.
          - But the theorem rests on common prior and common knowledge of posteriors (which requires an infinite regress: I know that you know that I know...). In practice, we often only exchange once.
          - In real arguments, we often exchange conclusions (like in Part 2 and 3) and not the evidence. And if we have different priors (as in Part 3), we may not converge.

     **Predictable Problems**:

          - Anchoring: Some participants might not update or might update partially. -> Encourage them to follow the scoring rule: they get more chips if they report their true probability.
          - Meta-gaming or lying: Emphasize honesty for the sake of the experiment. The scoring rule incentives truthfulness.
          - Loud guy dominates: In pairs, have them write down their update independently.
          - Refusal to play: Hopefully the scoring rule with chips (even if not real money) will motivate.
          - Sabotaged subgroup catches on early: If participants in Group B start to suspect, ask them to play along until the debrief.

     **What the card game cannot stage**:

          - The infinite regress of knowledge (common knowledge). We only did two rounds.
          - The continuous agreement in the limit. We discrete and finite.
          - The difference between exchanging evidence and exchanging conclusions in a setting where the evidence is not invertible from the posterior.

     **Written Exercise for Newsletter**:

          We can describe the broken prior experiment: 
            "Imagine you are told that a coin is either biased 60% heads (World A) or 60% tails (World B), and you see a head. You would give 60% to World A. But your friend is told the coin is either 80% heads or 80% tails, and they also see a head. They give 80% to heads. Now you exchange these numbers. How would you update your belief? What would happen if you then had to continue exchanging updates?"

     Given the time constraints, we go with this.

     **Detailed Agenda for 90 Minutes**:

       0. Introduction (5 minutes): 
            - Explain the jar setup (common prior for now) and the scoring rule.
            - Mention that there will be a series of short experiments with communication.

       1. Part 1: Common Prior, Exchange Evidence (15 minutes)
            - Draw: Each participant draws one marble.
            - Initial assessment: Write down probability (0.6 for red, 0.4 for blue) and the color.
            - Pair up and exchange colors.
            - Update: Recalculate probability based on two colors.
            - Report final probability.
            - Collect some results on whiteboard: show that within a pair, they agree.

       2. Part 2: Common Prior, Exchange Conclusions (15 minutes)
            - New jar (same setup), draw again.
            - Initial assessment.
            - Pair up (new pairs) and exchange probabilities.
            - Update: because the reported probability reveals the signal, they can calculate the new probability (based on two signals).
            - Report new probability.
            - Whiteboard: show agreement.

       3. Part 3: Broken Prior, Exchange Conclusions (20 minutes)
            - Without explanation, hand out group assignment cards (half Group A, half Group B) face down. 
            - Group A: reads that the jar is either 60% red or 60% blue.
            - Group B: reads that the jar is either 80% red or 80% blue.
            - Actual jar is 60% red.
            - Draw one marble.
            - Initial assessment: Group A: red->0.6, blue->0.4; Group B: red->0.8, blue->0.2.
            - Pair up: try to pair A with B (but have some A-A and B-B too).
            - Exchange probabilities.
            - Update: Instruct: "Update your probability using your own prior and what you've learned from your partner's report."
            - In A-B pairs, they will be confused. In A-A and B-B, they will agree.
            - Whiteboard: record some final probabilities. Show that in mixed pairs, they may not agree.

       4. Debrief (35 minutes)
            - Reveal the group difference in Part 3.
            - Explain the Aumann agreement theorem: 
                  - If two people have the same prior and their posteriors are common knowledge, then they must have the same posterior.
            - Why didn't they always agree in Part 3? Because the common prior assumption was broken.
            - Also, in the finite rounds, common knowledge wasn't fully achieved? But in Part 1 and 2, one exchange was enough.
            - Discuss real-world applications: 
                  - In arguments, we often exchange conclusions, not evidence.
                  - If we have different priors (often the case in politics), we may not be able to convince each other even if we are rational.
            - Limitations of the activity: 
                  - We used discrete signals and finite rounds.
                  - In more complex settings, exchanging conclusions might require many rounds to achieve common knowledge.

     **Materials**:

          - Jars and marbles (for three parts).
          - Index cards.
          - Poker chips (distribute at the beginning: say 100 per participant per part, then adjust based on scoring).
          - Scoring tables for quadratic scoring rule (with probabilities in tenths).
          - Group assignment cards for Part 3.

     **Scoring**:

          - In each part, after the truth is revealed (at the end of the part), we score their final reported probability.
          - We might also score intermediate reports? But to keep it simple, score only the final report.

     This should fit in 90 minutes.

     Let's hope it works!
answer: |-
  Here's a refined, playable design for your session that addresses the constraints and goals while incorporating your twists. The activity uses a "biased coin" setup (avoiding physical jars) to streamline the process.

  ---

  ### **Core Setup: The Biased Coin**
  - **Binary Question**: Is the coin biased towards Heads (60%) or Tails (60%)?  
  - **Priors**: All participants start with 50/50 prior (equal chance of Heads-bias or Tails-bias).  
  - **Private Signals**: Each participant gets a private clue: a simulated coin flip result (H or T).  
    - *Implementation*: Hand out index cards pre-printed with "H" or "T" (pre-generated to match the bias; e.g., 60% H for a Heads-biased coin).  
  - **Scoring Rule**: **Quadratic Scoring** with poker chips.  
    - Participants report probability \( p \) (0–100%) of Heads-bias.  
    - If true bias is Heads, score = \( 100 - (100 - p)^2 \)  
    - If Tails, score = \( 100 - p^2 \)  
    - *Chips*: Award chips = score (e.g., report \( p=60 \) → max chips if bias matches signal).  
    - *No heavy math*: Provide a lookup table (on whiteboard) for key probabilities (0%, 20%, 40%, 60%, 80%, 100%).  

  ---

  ### **Session Flow (90 mins total)**

  #### **1. Intro & Round 1: "Trade Conclusions"** (25 mins)  
  - **Setup**:  
    - Announce: "A coin is biased to Heads or Tails (60%). We start with 50/50 odds."  
    - Distribute private signal cards (e.g., 7 H, 7 T for a Heads-biased coin).  
  - **Task**:  
    - Each calculates initial probability (e.g., H-signal → 60% for Heads-bias). Writes it on an index card.  
    - Pair up (randomly). Partners exchange only their **current probability number** (e.g., "I’m 60%").  
    - Each revises their probability (based on partner's number). Repeat for 2–3 timed rounds (2 mins/round).  
  - **Twist 1: Cap Rounds**: Stop after 3 rounds even if disagreements persist.  
  - **Observe**: Most pairs converge to agreement (if common priors).  

  #### **2. Round 2: "Trade Evidence"** (20 mins)  
  - **New round, new signals** (same coin bias).  
  - **Task**:  
    - Pairs exchange **raw signals** (e.g., "I saw H") instead of probabilities.  
    - Update probabilities based on combined evidence (e.g., H + H → 69% for Heads-bias).  
  - **Observe**: Faster convergence (often 1 round).  

  #### **3. Round 3: Break the Priors** (25 mins)  
  - **Sabotage**: Secretly split the room:  
    - Group A (half): Told coin is "60% biased" (original prior).  
    - Group B (half): Told coin is "80% biased" (different prior).  
  - **Same signals** (e.g., distribute H/T cards from a 60% Heads-biased coin).  
  - **Task**:  
    - Group A calculates: H-signal → 60% for Heads-bias.  
    - Group B calculates: H-signal → 80% for Heads-bias.  
    - Pair **across groups** (A with B). Trade probabilities for 3 rounds.  
  - **Observe**: Pairs **fail to converge** (e.g., A reports 60%, B reports 80%; updates stall).  
  - **Reveal**: At the end, expose the differing priors.  

  ---

  ### **Debrief Structure** (20 mins)  
  Map the activity to Aumann’s theorem and its real-world limits:  

  | **Activity Moment**          | **Aumann Concept**                          | **Real-World Takeaway**                              |  
  |-------------------------------|--------------------------------------------|------------------------------------------------------|  
  | Trading conclusions (Round 1) | Posteriors become common knowledge through repeated exchange | We trade conclusions, not evidence → slower convergence |  
  | Trading evidence (Round 2)    | Direct access to partner’s data → instant agreement | Sharing raw data resolves disputes faster (but rare IRL) |  
  | Broken priors (Round 3)       | Common prior assumption violated → no convergence | Political/cultural priors prevent agreement, even when "rational" |  
  | Capped rounds               | Finite dialogue ≠ infinite regress of "I know you know" | Real arguments have deadlines → consensus often impossible |  

  **Key Punchlines**:  
  1. Aumann assumes **common priors + common knowledge of posteriors** (infinite regress).  
  2. Reality breaks this: **Priors differ**, we **trade conclusions** not evidence, and **time is finite**.  
  3. **Probability isn’t a conspiracy**—but it’s fragile without shared foundations.  

  ---

  ### **Predictable Problems & Fixes**  
  - **"Anchoring" (never budges)**:  
    - *Fix*: Remind them scoring rewards accuracy (true beliefs = max chips). Show chip payouts dramatically drop for extreme reports.  
  - **Meta-gaming/lies**:  
    - *Fix*: "Your goal is to maximize chips, not ‘win’—lying hurts your score." Privately remind the offender.  
  - **Loud guy dominates partner**:  
    - *Fix*: Enforce silent writing first, then exchange. Assign roles (e.g., "Partner A speaks first").  
  - **Probability conspiracist**:  
    - *Fix*: Use chips, not abstract math. "This is about scoring chips—report what you truly believe."  
  - **Sabotage group catches on**:  
    - *Fix*: Run Groups A/B simultaneously. If exposed, say: "Yes, and this is why the theorem fails IRL."  
  - **Innumeracy struggles**:  
    - *Fix*: Use fractions (e.g., 3/5), not decimals. Provide scoring table (no calculation needed).  

  ---

  ### **Limitations of the Activity**  
  - **Infinite regress**: Can’t simulate "I know you know I know..." without infinite rounds.  
  - **Common knowledge**: The theorem requires agents to *know* they share priors—hard to stage.  
  - **Continuous updates**: Participants approximate Bayes; they won’t be perfect.  
    - *Mitigation*: Pre-calculate key posteriors (e.g., H-signal + partner’s report) on a cheat sheet.  

  ---

  ### **Newsletter Adaptation**  
  Turn it into a solo exercise:  
  > *"Flip two coins (one 60%-biased, one fair). Get a private signal (H/T). Calculate your probability of bias. Now, imagine a partner reports their probability. Update yours. Repeat. Now imagine they had a different prior. See how agreement shatters."*  

  ---  
  This design ensures participants *feel* the theorem’s force and fragility. The card/chip mechanics keep it tactile, and the twists highlight real-world limits. Run it as a fast-paced game—energy and revelation will follow!
