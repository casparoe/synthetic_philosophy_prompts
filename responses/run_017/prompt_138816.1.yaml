prompt: |-
  I sit on the clinical ethics committee of a mid-sized community hospital, and over the past two years I have kept running into the same shape of case, for which I have no word. The categories we were trained to reach for — ask what the patient would have wanted, ask what serves her interests now, ask who has been appointed to speak for her — each seem to slice slightly off the mark. Three cases, all involving patients in roughly the same condition: advanced dementia, no real conversation, apparently content, no prospect of recovery. First: a woman who, while still sharp, signed a document saying that if she ever reached such a state she did not want antibiotics or a transfer to hospital for an infection. We honored it, and the reasoning felt settled. Second: a man who, while still sharp, signed a document saying that if he ever reached such a state he wanted everything done, and that he did not want anyone to tell him his life was not worth living. We treated it as evidence about his values and not much more; the clinicians still spoke of treatment that was not beneficial. Third: a woman who, while still sharp and knowing her values might shift, signed a document saying that whatever she seemed to want at the time should settle the matter, as though she had appointed her later self to decide for her, and that she gave up in advance any claim to override that later self. Nobody would touch it. Had she named her sister instead, the sister's word would have bound us.

  The pattern I think I am seeing is that the authority here runs in one direction only. A person can bind her later self, and the binding survives even the later person's explicit repudiation — the demented woman who says, I don't know who wrote that, that isn't me, I want to live, is still overruled by the document, and we do not find that monstrous. What she apparently cannot do is release her later self, or hand her the decision. Notice that this is not a refusal to let the document refer to the later person at all: clauses that make her later *condition* the trigger — if I am in pain, if I no longer respond to music, if there is no reasonable hope — are perfectly ordinary and perfectly honored. It is specifically the later person's *say-so* that cannot be made load-bearing. A colleague's explanation is that the later self simply lacks the capacity to hold authority, whereas a named proxy has it, and that is all there is to it. That cannot be the whole story: we do let people in this condition settle plenty of matters by their current say-so (whether to get out of bed, whether to see a visitor, whether to finish a meal), so the later self is not voiceless; the whole point of these documents is to extend a person's say past the point where she can speak for herself, so "she cannot speak for herself" is the puzzle rather than the solution; and it does not explain why the same incapacity blocks a clause deferring to her choice while permitting a clause deferring to her condition.

  So: does this asymmetry have a name? I mean both the one-way flow (the earlier self can restrict and cannot empower) and the condition-versus-say-so contrast, if they are indeed one phenomenon and not two. If there is an established concept, I would want to know exactly how it is delimited and how it differs from the neighbouring ideas it is likely to be confused with — the general device of arranging in advance not to be given what you will later ask for, the doctrine that the person who signed is the one whose values should govern even after she has changed, and the practice of reconstructing what she would have wanted. If there is none, I would want a term coined with a definition and some boundary cases, including this one: whether the answer changes when the later person's say-so is precisely about whether the earlier person was her. A bare label will not help me; I need to know what the phenomenon is, what it is not, where its edges lie, and whether the right frame for thinking about it is rights, or authority, or something more like a trust held for someone else's benefit. And I would much rather have the analysis than a reading list — I can find the literature myself, but I cannot find the distinction if I do not know what it is called.
reasoning: |-
  Okay, the user is on a clinical ethics committee and has encountered a recurring pattern in cases involving advanced dementia patients and advance directives. They've presented three specific cases that highlight an asymmetry: earlier selves can restrict future treatment but can't empower the later self to make decisions. The user wants to know if this asymmetry has a name, its boundaries, and the underlying principles.

  First, I need to parse the core issue. The asymmetry is twofold: the earlier self can bind the later self (as in Case 1) but can't grant the later self decision-making authority (Case 3). Also, directives based on the later self's condition are accepted (like pain or no recovery), but not their current say-so. The colleague's explanation about capacity doesn't fully hold because these patients can make some daily decisions. 

  The user is seeking a conceptual framework to understand this phenomenon. They need precise terminology, distinctions from related concepts, and the rationale behind the asymmetry. Their role requires practical application, so theoretical clarity is crucial for policy and case evaluations.

  Looking at existing ethical concepts: autonomy typically values precedent autonomy (binding future selves) over current autonomy in incapacitated patients. The law upholds advance directives that refuse treatment but not ones that request potentially non-beneficial treatments. Case 2 shows clinicians overriding requests for "everything" if deemed futile. 

  The key difference seems to be between negative directives (refusing treatment) and positive ones (demanding treatment). Negative ones align with bodily integrity and are legally enforceable. Positive ones might conflict with medical judgment or resource allocation. 

  Also, the inability to delegate to the future self might stem from seeing that self as a different entity lacking capacity. Whereas proxies are seen as extensions of the original person’s will. 

  Terms like "asymmetrical autonomy" or "unidirectional precedent autonomy" come to mind, but the user might need a new term. However, coining terms isn't ideal without existing literature support. Instead, clarifying the principles is better. 

  Distinguishing from Ulysses contracts (irrevocable commitments) is important because those are about binding, not empowering. The condition vs. say-so contrast ties into objective vs. subjective criteria; conditions are verifiable, while say-so relies on questionable capacity.

  The user also wonders about a case where the later self disputes identity. This touches on personal identity ethics—despite the later self's denial, continuity is legally assumed. The committee prioritizes the earlier self's legal identity.

  Underlying all this is the ethical framework: precedent autonomy is respected only in refusal, not in requesting treatment, due to clinical judgment limits and avoiding harm. The later self's expressions are seen as non-autonomous, while daily decisions are trivial and low-stakes.

  The user's deeper need is a structured way to articulate this asymmetry to colleagues and in policies, ensuring consistent decisions. They need the rationale to navigate cases where emotional appeals from families might challenge directives.
answer: |-
  Your observation captures a profound and undertheorized asymmetry in autonomy, capacity, and legal authority. While no single established term perfectly encompasses this entire phenomenon, the core concept is best described as **Asymmetrical Precedent Autonomy** or **Unidirectional Binding Authority**. Below is a structured analysis, including boundaries, distinctions, and the rationale for the asymmetry.

  ### Core Phenomenon & Terminology
  1.  **The Asymmetry:**
      *   **Binding Restriction (Honored):** An earlier competent self can impose *limits* on future care (e.g., "No antibiotics if I have dementia") that override the later incapacitated self's expressed wishes ("I want to live!").
      *   **Empowering Delegation (Rejected):** An earlier competent self cannot *delegate decision-making authority* to the later incapacitated self ("Let future-me decide").
      *   **Condition vs. Say-So (Key Contrast):** Directives triggered by an *objective condition* (e.g., "if I have end-stage dementia") are valid. Directives making the later self's *subjective choice* the trigger ("if future-me asks for X") are invalid.

  2.  **Proposed Terms & Definitions:**
      *   **Asymmetrical Precedent Autonomy:** The ethical and legal principle granting greater weight to an earlier competent person's autonomous choices *when they restrict future options*, but denying weight to those same choices *when they attempt to empower a future state of incapacity to make significant decisions*. Precedent autonomy flows only restrictively, not permissively, across the threshold of incapacity.
      *   **Unidirectional Binding Authority:** The authority of the competent self binds future selves and caregivers only in the direction of refusal or limitation, not in the direction of delegation or empowerment of the incapacitated self for major healthcare decisions.
      *   **The Incapacity Barrier to Self-Delegation:** The legal and ethical doctrine preventing an individual from prospectively vesting decision-making authority for significant matters in a *future version of themselves* known or expected to lack decision-making capacity at the relevant time.

  ### Why This Asymmetry Exists: Underlying Rationales
  1.  **The Primacy of the "Competent Self" as the Legal Person:**
      *   The law recognizes the signatory of the directive as the relevant legal person. Decisions made while competent are seen as expressions of that enduring legal personhood, even after capacity fades. Delegating *to* the future self implicitly treats the future incapacitated self as a *different* legal person with independent authority, which the system rejects.
      *   **Distinction from Proxy:** Appointing a proxy (like the sister) is an act *by* the competent legal person designating an external agent to act *for* them. Delegating to the future self attempts to split the legal person into two distinct decision-makers: the past self delegating and the future self receiving the delegation. The system only recognizes one decision-maker per person: the competent self or their external proxy.

  2.  **Protection from Harm & Non-Maleficence:**
      *   Binding restrictions (like refusing antibiotics) align with the principle of avoiding unwanted treatment/bodily intrusion (negative rights). Empowering the later self could lead to demands for treatment deemed *non-beneficial or harmful* by clinical judgment (Case 2 illustrates clinicians' resistance here). The system prioritizes protecting the incapacitated person from perceived harm based on objective assessments over subjective requests made without capacity.
      *   **Distinction from Ulysses Contracts:** While Ulysses contracts (binding oneself against future weakness) share the restrictive aspect, they typically involve protecting the *self* from future *irrational* desires *within the same capacity state* (e.g., addiction). Your cases involve protecting the *later self* (deemed incapable) *from* its own expressions *and* protecting the system from demands perceived as irrational or harmful.

  3.  **Practicality and Risk of Coercion/Exploitation:**
      *   Honoring "let future-me decide" raises intractable problems:
          *   **Assessing Capacity in the Moment:** Determining if the current expression ("I want X") is a valid exercise of the delegated authority or merely an expression of impaired cognition is often impossible and highly contentious.
          *   **Vulnerability:** An incapacitated person expressing a desire for aggressive treatment might be easily influenced or expressing a fleeting impulse, raising concerns about exploitation or honoring non-autonomous choices.
          *   **Conflict with Medical Judgment:** It forces clinicians to provide treatments they believe are futile or harmful solely based on an expression they deem non-autonomous. Systems resist this.
      *   Conditions ("if I have dementia") are objectively verifiable states. Say-so ("if I ask for it") relies entirely on assessing the validity of a potentially impaired expression.

  4.  **The Nature of "Capacity" is Context-Specific:**
      *   Your colleague's explanation ("later self lacks capacity to hold authority") is partially correct but misses the nuance you identified. Capacity is *decision-specific*.
      *   **Low-Stakes/Immediate Decisions (Honored):** Deciding to get out of bed, see a visitor, or finish a meal involves minimal risk, immediate consequences, and relies on present preferences. Respecting these choices promotes well-being and dignity with little downside. Capacity for these is presumed absent clear danger.
      *   **High-Stakes/Future-Oriented Decisions (Rejected):** Deciding on life-sustaining treatment, major procedures, or hospital transfers involves complex trade-offs, future consequences, and understanding prognosis – capacities demonstrably impaired in advanced dementia. The system imposes a higher threshold for recognizing autonomy here. Delegating authority *to* this state for high-stakes decisions is seen as delegating to an entity lacking the requisite capacity *by design*.

  ### Boundaries and Edge Cases
  1.  **The Identity Question:** "Whether the answer changes when the later person's say-so is precisely about whether the earlier person was her."
      *   **Answer:** No, it generally doesn't change. The legal and ethical framework presupposes continuity of personal identity between the competent signatory and the incapacitated patient. Statements like "That wasn't me, I want to live" are interpreted as expressions of the *incapacitated state*, not as valid repudiations of identity or the directive by a *different* competent person. The system prioritizes the documented wishes of the identifiable legal person (the signatory) over the existential claims made during incapacity. The committee acts *for* the legal person as understood through their competent directives.
  2.  **The "Values Shift" Acknowledgment:** The third woman explicitly acknowledged her values might shift and tried to pre-authorize that shift. This was still rejected. This highlights that the barrier isn't primarily about *values consistency* but about *legal agency* and *decision-making capacity*. The system doesn't allow the competent self to prospectively validate the *authority* of the future incapacitated self, even if anticipating a values change.
  3.  **Demanding vs. Refusing Treatment (Case 2):** This case shows the *other* side of the coin. The man demanded "everything." Clinicians resisted because they judged the treatments as "not beneficial" (futile/harmful). This demonstrates that while the system *permits* directives demanding treatment more readily than empowering the later self's say-so, it does *not* grant them absolute authority. Clinicians and ethics committees can still refuse demands for futile or inappropriate treatment based on professional judgment and beneficence/non-maleficence, even if documented. The asymmetry is strongest in *refusal* vs. *empowerment*.
  4.  **Mild Cognitive Impairment:** The boundaries blur. A patient with mild dementia might retain sufficient capacity for *some* high-stakes decisions, assessed in the moment. The strict asymmetry applies most clearly at the extreme end of incapacity (advanced dementia, no conversation) as described.

  ### Distinguishing from Neighbouring Concepts
  1.  **Precedent Autonomy (General):** The broad concept that past competent choices should guide care for the now-incapacitated person. Your phenomenon is a specific *asymmetrical manifestation* of this.
  2.  **Substituted Judgment:** The attempt to decide *as the patient would have decided* if competent, based on known values/wishes. This is often used *alongside* or *in the absence of* clear directives. Your cases involve *conflicts* between directives and current expressions/wishes, highlighting the limits of substituted judgment when a directive exists and the specific rejection of delegating judgment to the current self.
  3.  **Best Interests Standard:** Used when no prior wishes are known. It focuses on the *current* patient's well-being. Your cases involve navigating *tension* between prior wishes (directives) and a current interests assessment, particularly when the directive attempts delegation.
  4.  **Ulysses Contracts:** A specific type of advance directive designed to bind oneself against future weakness/irrationality *within the same capacity state* (e.g., psychiatric advance directives during lucid intervals). The asymmetry you observe operates across a threshold of *permanent incapacity* and specifically blocks the *empowerment* aspect.

  ### The Right Frame
  This phenomenon sits at the intersection of:
  *   **Authority (Legal/Juridical):** Who holds the legal right to decide for the person once capacity is lost? The system vests this solely in the *past competent self* (via directive) or their *external proxy*, never prospectively in the *future incapacitated self*.
  *   **Moral Agency & Personal Identity:** It reflects a philosophical view prioritizing the agency and values of the "person" embodied in the competent state over the expressions of the severely diminished state, while still acknowledging a duty of care to the living being.
  *   **Pragmatic Clinical Ethics:** Balancing respect for autonomy with protection from harm, practical concerns about assessing capacity in the moment, and avoiding imposing treatments clinicians deem unethical (futility).

  ### Conclusion
  The asymmetry you've identified—**Unidirectional Binding Authority** or **Asymmetrical Precedent Autonomy**—is a fundamental, though often implicit, principle in clinical ethics and law. It stems from the legal recognition of the competent self as the sole source of autonomous authority for future incapacitated states, a protective impulse towards the vulnerable incapacitated person, the practical difficulties of assessing capacity for high-stakes decisions in profound dementia, and the context-specific nature of capacity itself. It allows restrictions (honoring negative autonomy) but blocks both empowerment of the incapacitated self and absolute demands for potentially harmful treatment. While challenging, especially in cases anticipating values shifts, this structure reflects the system's attempt to navigate the profound ethical complexities of identity, autonomy, and care across the rupture of severe cognitive decline. Your meticulous observation captures a crucial, under-articulated tension in surrogate decision-making.
