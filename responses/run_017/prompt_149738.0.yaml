  First, I need to recall the Maxwell's demon thought experiment. The demon sorts molecules, reducing entropy, which seems to violate the second law. The resolution involves the demon's memory: recording information requires energy, and erasing it increases entropy. But the friend's infinite ledger challenges this by suggesting no erasure is needed. 

  The user wants a breakdown of "information is physical" from weakest to strongest interpretations. They also need to know which interpretation supports the friend's argument and whether it's valid. The user mentioned being a TA, so they can handle technical details, which means I should include equations where helpful.

