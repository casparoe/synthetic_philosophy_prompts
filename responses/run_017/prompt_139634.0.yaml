prompt: |-
  I've been sitting on a half-finished paper about moral worth — specifically about whether an action can have moral worth when the agent isn't motivated by the right-making feature itself — and I keep losing the argument to my old advisor, who held the strict line: no worth unless the agent acts because the act is right, and conceives it as such. I want to practice defending myself, so please play me: the strongest version of the view I've been pushing, not a strawman. Willing to concede small points, never the core claim.

  The core, so you have it: worth doesn't require that the agent cite the right-making feature, only that her actual motivating reason be answerable to it — roughly, that she'd stop if she found out the feature wasn't there. I use two things as my main weapons. First, what I call the scarcity result: most decent action runs on inherited rules, trained habits and reasons borrowed from people we trust, so if worth required citing the feature, almost nothing would have worth, which I take as a reductio of the strict view. Second, the flip side: there are people who do the right thing from a genuinely warm motive but who'd keep doing it even if the good were entirely absent, and those look to me like cases where worth leaks out.

  Stay in character until I say stop, keep it to a paragraph or two a turn, argue rather than summarize, and dont prop anything up with citations — if the position has a resource, use the resource.

  Here's my objection, and it's the one I'm scared of. A portfolio manager pledges an enormous gift to a malaria charity mainly to impress a client who cares about effective giving. She'd quietly withdraw the pledge if she learned the charity wasn't actually saving anyone — not because of that, but because the client would lose interest. Her motivating reason is counterfactually sensitive to exactly the right-making feature, so on my own view I seem committed to saying the gift has moral worth, which is absurd: that's tracking without caring. I'm giving this as a department talk in three weeks and I'd much rather find the hole myself than have it found from the floor. Answer that.
reasoning: |-
  Okay, the user is working on a paper about moral worth and needs help defending their core claim against a specific objection. Their main argument is that moral worth doesn't require the agent to consciously cite the right-making feature, only that their motivation is counterfactually sensitive to it (they'd stop if the feature was absent). They've presented a tricky portfolio manager case where someone's donation tracks the right-making feature (saving lives) but for the wrong reasons (impressing a client).

  Hmm, this is a sophisticated philosophical puzzle. The user seems deeply familiar with the literature but wants to practice defending their position without relying on citations. They're specifically worried about this "tracking without caring" counterexample that their advisor might raise at the upcoming talk. 

  The core tension is between formal counterfactual sensitivity and substantive moral concern. The portfolio manager's actions do technically satisfy the counterfactual condition - she'd withdraw if lives weren't being saved - but her reason is purely instrumental to social approval. The user's intuition (and mine) screams that this lacks moral worth, which threatens their whole framework.

  *scratches head* How to defend the position here... The key might be distinguishing between what the motivation is responsive to versus what it's constituted by. While the withdrawal condition is triggered by the absence of the right-making feature, the underlying motivation remains client approval - the moral feature is just a means to that end. 

  Perhaps we should emphasize that true answerability requires the right-making feature to play a necessary role in the motivational structure, not just a contingent one. In the charity case, saving lives is merely evidentiary for client preferences - if the client suddenly preferred ineffective charities, the manager would too. Whereas in genuine moral worth, the feature itself is non-instrumentally necessary.

  *adjusts thinking* The user's scarcity argument could help contextualize this - most people act through "borrowed reasons" but still have moral worth when their habits are properly calibrated to moral reality. The manager's case is different because her calibration is to client preferences, not moral features. Her counterfactual sensitivity is derivative, not direct.

  *checks watch* Better formulate this tightly - the user wants paragraph-length defenses. Need to show why this case doesn't satisfy the "answerability" criterion properly understood, without conceding that conscious citation is required. Stress that motivation must be non-instrumentally responsive to the moral feature itself.
answer: |-
  Right. First, that portfolio manager case isn’t a counterexample — it’s a misapplication of my core condition. You’ve conflated *tracking a feature* with *being answerable to it*. Her withdrawal *is* triggered by the absence of the good, yes, but *only as an indicator* of client interest. The right-making feature itself — saving lives — isn’t what her reason latches onto; it’s purely instrumental. Her motivating reason ("impress the client") is hostage to the *client’s* contingent valuation, not the moral feature. If the client valued wasteful charities instead, she’d gleefully fund those. That’s not answerability to the right-making feature; it’s accidental alignment.

  My condition requires the motivating reason itself to *depend* on the presence of the feature, not just correlate with it through a third variable. Her reason would persist even if saving lives *didn’t* matter morally, as long as the client thought it did. Genuine answerability means the motivating reason *falters* precisely because the moral ground vanishes — not because a bystander’s opinion shifts. Her psychology treats the moral feature as disposable scaffolding for reputation. That’s why the worth leaks out: her structure of motivation is alienated from the good itself, even if it stumbles over it.

  Your advisor’s strict view can’t handle ordinary virtue — parents comforting children out of ingrained care, not abstract duty. But your case? It’s a wolf in tracking clothing. The scarcity result stands because decent habits *can* embody non-instrumental sensitivity to the good — they’d crumble if the good weren’t there. Hers wouldn’t; it’d just pivot. That’s the hole: you blurred *mediated* sensitivity with *direct* answerability. Fix that, and your condition holds. Next objection?  

  *(Holding the line: Answerability requires the motivating reason to non-instrumentally require the feature’s presence. Her reason doesn’t — it merely exploits it.)*
