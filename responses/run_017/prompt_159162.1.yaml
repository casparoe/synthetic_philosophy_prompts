prompt: |-
  You're a philosopher of mind who specialises in pain — please think carefully about this rather than firing off the first thing that comes to mind, and do a bit of unpicking before you commit to an answer. I'm a third-year medical student and I got into an argument in my study group last week that I can't let go of. We were revising the sensory-discriminative versus affective-motivational distinction, and the textbook mentioned pain asymbolia: people with certain brain lesions (insula-ish? I might be misremembering) who still report the sharp, stabbing, well-localised burning when you stick a pin in them, and can rate its intensity and say exactly where it is, but insist it doesn't bother them at all — they don't pull away, sometimes they laugh, they just don't seem to mind. If that's really what's going on, it looks to me like it settles something enormous, namely that the badness of pain is a bolt-on: an extra layer of reaction stacked on top of what is basically neutral information about tissue damage. And if that's right, then the ideal analgesic is obvious — knock out the affective component, leave the sensory one completely intact, and you get the full warning signal with none of the suffering, best of both worlds, which is presumably where all pain research should be heading. It also seems to have slightly wild implications for how to live, honestly: if suffering is a detachable extra rather than part of the experience itself, then the Stoics were basically right and the whole thing is down to something like willpower. The one philosophy joint-honours guy in our group said I was 'helping myself to several claims at once' and then wouldn't explain himself, which I thought was incredibly annoying.

  So: is my inference actually fine, or is it broken, and if it's broken I want to know exactly where. Is the trouble with what asymbolia really establishes, given that it's a lesion syndrome and the patients' reports are doing an awful lot of work? Is it with what badness would have to be for it to be detachable in the way I'm imagining? Is it with the idea that you could strip out the nastiness and keep the signal — I did briefly wonder whether the warning function is carried by the part I'm proposing to delete — or is it somewhere I haven't thought of at all? Please give me the strongest version of the objection rather than the most diplomatic one, and say plainly if the clinical picture is messier and more contested than my textbook made it sound. Write in British English, and no headings, bullet points, bold text or tables — just continuous prose, like an email from someone who has actually thought about it rather than a set of lecture notes.
