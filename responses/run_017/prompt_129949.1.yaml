     - Clarify: Gödel's first incompleteness theorem says that if a theory is consistent and can express arithmetic, then it cannot prove its own consistency. It does not say that mathematics is inconsistent.  
     - But it leaves open the possibility that mathematics might be inconsistent.  

  5. **Consistent theories proving their own inconsistency (5 minutes)**  
     - Your friend is right: there are consistent theories that prove their own inconsistency.  
     - How? Because the theory might be consistent but not strong enough to "see" its own consistency. It might prove a statement that says "there is a proof of 0=1 in this theory" (which is false) because the theory is too weak to recognize that the alleged proof is not valid.  
