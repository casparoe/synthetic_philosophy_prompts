answer: |-
  Here's the structured plan for your 30-minute slot. Focus on clarity, pacing, and explicitly naming misconceptions when they arise.

  ---

  ### **Order of Pieces (Total: 25 min)**
  1. **Break "axiom = obvious truth" (3 min)**  
     - **Start with:** "Axioms are arbitrary starting rules—like the rules of chess. We choose them to build a system, not because they're 'true'."  
     - **Why now?** Must decouple axioms from truth before consistency can be meaningful. Otherwise, students won’t grasp why we’d question "obvious" axioms.  
     - **Board:** "Axioms: assumptions we agree to use. Consistency: no statement + its negation can both be proven."  

  2. **Define "consistent" formally (2 min)**  
     - **Use logic:** "If axioms let you prove **A** and **not A** for any **A**, they’re inconsistent. Otherwise, consistent."  
     - **Why now?** Students need the technical definition before seeing an example. Emphasize *proving* contradictions—not "feels right."  

  3. **Toy example: Contradiction in a tile game (10 min)**  
     - **What it needs:**  
       - 3–4 simple axioms about "dragon tiles" (avoid mathy terms).  
       - Harmless-seeming rules (e.g., "All dragons are red or blue," "Every red dragon fears a blue one").  
       - Contradiction in 3–4 steps (non-obvious, no self-reference).  
     - **Example:**  
       - Objects: Dragons. Colors: Red (R) or Blue (B).  
       - Axiom 1: Every dragon is R or B (not both).  
       - Axiom 2: There exists a red dragon.  
       - Axiom 3: For every R dragon, there is a B dragon it fears.  
       - Axiom 4: No dragon fears itself.  
       - Axiom 5: If X fears Y, then Y is not feared by X’s color. (R fears B → B is not feared by any R.)  
       - **Contradiction:**  
         - Axiom 2 → There’s a red dragon (call it D1).  
         - Axiom 3 → D1 fears a blue dragon (D2).  
         - Axiom 5 (for D1) → D2 is not feared by any red.  
         - But Axiom 3 (for D2) → D2 is blue, so *some red fears D2*. Contradiction.  
     - **Why this works:** No self-reference, feels concrete, and the contradiction isn’t immediate.  

  4. **Consequences of inconsistency (5 min)**  
     - **Key point:** In classical logic, **one contradiction → you can prove anything** (ex falso quodlibet).  
     - **Misconceptions to address here:**  
       - *"We’d have found it by now"* → "Contradictions could be buried (like in our toy example—took 4 steps!). Math is vast; we’ve checked deeply but not exhaustively."  
       - *"Just delete the bad axiom"* → "Which one? In our example, all axioms seem plausible. Logic doesn’t tell you—it’s a **pragmatic choice** (e.g., maybe drop Axiom 5 to keep the rest)."  
       - *"Bridges would fall down"* → "Applied math uses *fragments* of axioms proven consistent relative to other bits. Real-world use ≠ foundational safety."  

  5. **Gödel + consistent theories proving own inconsistency (5 min)**  
     - **Yes, it’s true:** Some consistent theories "claim" they’re inconsistent via Gödel-coding.  
     - **Where?** Here—after defining consistency.  
     - **How to explain:** "Imagine a game where the rules *say* ‘These rules are broken,’ but they’re actually fine. The theory ‘thinks’ it has a contradiction (due to how it models proofs), but it’s wrong. **Consistency ≠ truth in the intended model.**"  
     - **Why include?** Separates "consistent" (real-world meta-fact) from "proves consistency" (internal statement). Perfect endpoint.  

  ---

  ### **What to Refuse to Explain (Say This Aloud)**  
  - "I won’t define Gödel coding—it’s a technical trick."  
  - "I won’t show how ex falso works—it’s a logic exercise."  
  - "We’re skipping how set theory avoids Russell’s paradox—it’s a detour."  

  ---

  ### **Closing Question (Last 5 min)**  
  **"If we discover a contradiction in ZFC set theory, could we just remove one axiom and keep doing math? Why or why not?"**  
  - **Goal:** Tests if they grasp ex falso (no—everything collapses) and pragmatic axiom choice (yes—but we rebuild carefully).  

  ---

  **Timing Summary**  
  - Deconstruct axioms/consistency (5 min).  
  - Toy example (10 min).  
  - Consequences + misconceptions (5 min).  
  - Gödel + consistent-but-self-refuting theories (5 min).  
  - Question + wrap-up (5 min).  

  **Key Takeaway:** Consistency is about proofs, not truth—and we’re always one unexposed contradiction away from total collapse.
