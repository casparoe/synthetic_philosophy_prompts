     - **How to say**: "There is a consistent theory T that proves the statement 'T is inconsistent'. This does not mean T is actually inconsistent; it means that T is so limited that it cannot correctly capture the notion of its own consistency. So even if we had a proof of inconsistency in our set theory, it might be that the proof is wrong, or that the set theory is actually consistent but is tricking us."  
