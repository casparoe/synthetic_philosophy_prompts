prompt: |-
  Hey — I'm a novelist, about a hundred and twenty thousand words into a third draft, and I keep hitting the same problem in scene after scene and I've decided it's actually a philosophy problem, so here goes.

  My book is mostly in free indirect style, and it has two threads that are giving me trouble. One: a POV character who has aphasia after a stroke — she can't produce or understand language, but I've been writing her chapters as fully worded interior monologue, because that's the only way I know to make a reader care about her, and the chapters are the best things in the book. Two: another character has a bodily sensation she privately names and tracks in a notebook, marking a sign (call it S) every time it comes back, and she's convinced it predicts her seizures; nobody else can check it, and I want to know what I'm committing to when I write that she was right, or wrong, about it being the same sensation again. And then underlying both: my narrator is constantly stating what characters feel in third-person grammar, with no behavior on the page to back it up, and I can't tell any more whether that's fine or whether it's cheating.

  I read Wittgenstein in a survey course fifteen years ago. I remember a beetle in a box, and something about a person who writes a private mark whenever a feeling recurs, and the general vibe that a language only one person could understand is supposed to be incoherent. That's about it. I do not want to go read the scholarship, and please don't give me a reading list or tell me what to look up — I want the thing itself, operationalized.

  So: write me a decision procedure I can run on a single scene in about ten minutes while I'm revising, in plain language, with no theory vocabulary I'd have to look up (if a term is unavoidable, define it in one line, because my editor will ask me why I cut a passage and she has to be able to follow the answer). Give me the questions in order, what counts as a sufficient answer to each, the point where the procedure stops with a hard no — meaning I cut or rewrite the passage — and the point where it hands the decision back to me because it's a literary or values call rather than something the argument settles. I've got maybe forty scenes like this and my editor wants the revision in ten weeks, so it has to be something I can apply repeatedly without stopping to think about first principles every time.

  The hard cases it has to handle: a mind with no language at all; a private sign for a sensation that no one else can check; free indirect narration that asserts an inner state with no outward criteria given; and a character (there's one, from a culture with no vocabulary for the state in question) where I suspect the procedure just can't settle it and I'd rather be told that than get a fake verdict.

  Then run it on three actual cases: the aphasia chapter, the notebook-with-S thread, and one free indirect passage where the narrator says a character's grief is unbearable and there is nothing on the page to show it. I want at least one of those to come back with a verdict I won't like — I'm pretty sure the aphasia chapter's best paragraph is indefensible and I want to see whether the procedure actually says so or whether I can wriggle.

  And be honest about the translation: tell me which distinctions have to survive the flattening into a checklist (I'm guessing something about the difference between expressing a pain and reporting that you have one, and between criteria and mere symptoms, and the point that the target is a picture of how signs get their meaning rather than a denial that people have inner lives) and which can be dropped without the procedure breaking. Then tell me what it can't do: it can't tell me whether the prose is any good, and I assume it can't settle whether a creature whose behaviour is nothing like ours has experiences at all, but say what else.

  Also, I'm not sure the private-mark thing is even the same problem as the aphasia thing — tell me if they're different problems and the procedure needs to branch.

  Anyway. Third draft, definately overthinking it, send help.
reasoning: |-
  Okay, the user is a novelist deep into their third draft, struggling with philosophical issues in their writing. They’ve hit recurring problems across scenes involving a character with aphasia (whose inner monologue is fully worded despite her inability to process language), another character tracking a private bodily sensation ("S") as a seizure predictor, and free indirect style that states characters’ feelings without behavioral evidence. They want a practical, time-efficient decision tool grounded in Wittgenstein’s ideas—specifically the private language argument and criteria vs. symptoms—but refuse academic jargon or reading lists.  

  First, I need to extract the core philosophical stakes:  
  - **Aphasia chapters**: Writing coherent inner monologue for a character who canonically lacks language comprehension violates Wittgenstein’s view that meaning requires shared criteria. But deleting it might sacrifice reader empathy. How to reconcile?  
  - **Private sensation "S"**: If the character is "right" about S predicting seizures, it implies a private sensation can be tracked reliably—which Wittgenstein rejects. If "wrong," it highlights the problem of verification.  
  - **Unsupported assertions**: Free indirect claims like "grief was unbearable" without behavioral anchors risk being "nonsense" per Wittgenstein, as inner states require outer criteria.  

  The user’s urgency is palpable: 40 scenes in 10 weeks. They need a checklist, not a lecture. Key constraints:  
  - **No theory deep dives**: Define terms inline (e.g., "criteria" = public evidence).  
  - **Handle edge cases**: E.g., the culture without vocabulary for a state.  
  - **Brutal honesty**: Flag indefensible passages (they suspect the aphasia monologue is shaky).  

  I’ll structure the tool as a 5-step filter:  
  1. **Identify the claim**: What inner state is asserted? (e.g., "She recognized S.")  
  2. **Check for criteria**: Is there public evidence? (Behavior? Context?)  
  3. **Assess verification**: Could another character plausibly challenge this?  
  4. **Language-dependence**: Does the claim require concepts the character lacks? (Critical for aphasia.)  
  5. **Override options**: If steps 2-4 fail, is there thematic justification? (But warn: "narratively risky.")  

  For the sample cases:  
  - **Aphasia monologue**: Fails step 4 (language dependence) → verdict: cut/rewrite. Harsh but necessary.  
  - **Private sensation "S"**: If "she was right," fails step 3 (no verification) → verdict: ambiguous; allow only if framed as belief, not fact.  
  - **"Grief was unbearable"**: Fails step 2 (no criteria) → verdict: cut unless revised.  

  Crucially, I’ll clarify distinctions:  
  - The tool critiques *meaning*, not existence of inner states.  
  - It can’t resolve "alien minds" (e.g., the culture case) → hand back to author.  

  User’s self-awareness impresses me. They’re not deluded about "wriggling"—they want rigor. I’ll stress that the aphasia fix might mean implying thoughts via non-linguistic cues (e.g., sensory details), preserving empathy without violating philosophy.  

  Final touch: Add a "time budget" note ("10 mins/scene max") and flag optional overrides for thematic power, with caveats. They’ll respect the transparency.
answer: |-
  Here’s a **10-Minute Scene Diagnostic Tool** based on Wittgenstein’s core ideas, stripped to essentials. It treats the aphasia and private-sign cases as distinct but related problems. **Run it in order**—stop at the first hard "no."

  ---

  ### **The Tool: 5 Questions**
  1. **WHAT IS CLAIMED?**  
     *What inner state (feeling, thought, sensation) does the text directly state?*  
     — *Sufficient answer:* "Character X feels/thinks/perceives [specific thing]."  
     — *Hard stop if:* No inner state is claimed (procedure ends—nothing to check).

  2. **IS THERE PUBLIC ANCHORING?**  
     *Could another character (or the reader) observe evidence supporting this claim?*  
     — *Sufficient answer:* Describe behavior (e.g., "she clenched her fists"), context (e.g., "after her son’s funeral"), or sensory detail (e.g., "a metallic taste") that *logically connects* to the claim.  
     — *Hard stop if:* **No anchoring exists AND the claim is about language-dependent thought (e.g., "she regretted her words")** → **Cut/rewrite.**  

  3. **CAN IT BE CHECKED?**  
     *If this were real life, could someone verify or challenge the claim?*  
     — *Sufficient answer:* "Yes, because [other character could see X behavior]" or "No, because it’s private."  
     — *Hand-back if:* **Uncheckable (e.g., a purely internal sensation).** Proceed to Q4.  

  4. **DOES THE CHARACTER "HAVE THE CONCEPT"?**  
     *Could this character recognize/share the meaning of the words used?*  
     — *Sufficient answer:* "Yes, they speak the language" or "No, they lack the concept (e.g., no word for grief)."  
     — *Hard stop if:* **Claim uses language the character *can’t* grasp (e.g., complex thoughts in an aphasic mind)** → **Cut/rewrite.**  

  5. **IS IT A "PRIVATE SIGN"?**  
     *Is the character labeling a sensation only they experience?*  
     — *Sufficient answer:* "Yes, they’re naming something internal (e.g., sensation S)" or "No."  
     — *Hand-back if:* **Yes.** The text *cannot* prove them "right" (no criteria exist). You must choose:  
     - *Option A:* Present it as their *belief* (not truth).  
     - *Option B:* Use ambiguity (e.g., "she *thought* S was back").  

  ---

  ### **Key Distinctions That Must Survive**
  - **Criteria vs. Symptoms:** "Criteria" (public evidence for meaning) are non-negotiable. "Symptoms" (private clues) are meaningless alone.  
  - **Expression vs. Report:** Saying "I’m in pain" *expresses* pain; saying "He is in pain" *reports* it and needs evidence.  
  - **What this isn’t:** It doesn’t deny inner lives—it asks how we *meaningfully talk* about them.  

  ---

  ### **What the Tool CAN’T Do**
  - Judge prose quality.  
  - Settle if "alien" minds (e.g., non-human cultures) have experiences.  
  - Handle metaphysical claims (e.g., "her soul ached").  
  - Overrule thematic/narrative needs (hand-back cases are your call).  

  ---

  ### **Test Cases**
  **1. APHASIA CHAPTER (Interior monologue)**  
     - Q1: *Claimed?* "She thought: 'I need to find the blue box.'"  
     - Q2: *Public anchoring?* None (thought is isolated).  
     - Q3: *Checkable?* No (internal).  
     - Q4: *Has the concept?* **NO (aphasia = no language comprehension).** → **HARD STOP. Cut/rewrite.**  
     *Why you won’t like it:* The monologue is indefensible per Wittgenstein. *Fix suggestion:* Use non-linguistic anchors (e.g., "She stared at the dresser. A flicker of purpose—*there*, the thing with corners.").  

  **2. NOTEBOOK WITH "S" (She marks S, claims it predicts seizures)**  
     - Q1: *Claimed?* "She felt S return."  
     - Q2: *Public anchoring?* None (sensation is internal).  
     - Q3: *Checkable?* No.  
     - Q4: *Has the concept?* Yes (she invented "S").  
     - Q5: *Private sign?* **YES → HAND-BACK.**  
     *Verdict:* You *can’t* write "she was right" (no criteria). You *can* write "She marked S. Ten minutes later, her body convulsed." (correlation ≠ verification).  

  **3. FREE INDIRECT: "His grief was unbearable." (No behavior shown)**  
     - Q1: *Claimed?* "Grief was unbearable."  
     - Q2: *Public anchoring?* **None described.**  
     - Q3: *Checkable?* Yes (e.g., others could see collapse).  
     - Q4: *Has the concept?* Yes.  
     - Q5: *Private sign?* No.  
     → **Q2 FAIL: No anchoring → Cut/rewrite.**  
     *Fix suggestion:* Add 1-2 concrete details (e.g., "He hadn’t moved from the porch in three days. The neighbors left casseroles at his feet.").  

  ---

  ### **When to Override the Tool**
  - **Hand-back cases (Q5):** Your values decide. If the private sign’s *unverifiability* is the point (e.g., themes of isolation), lean in.  
  - **Culture without vocabulary:** Tool fails at Q4. If the *lack of a word* is crucial (e.g., "she felt what her culture had no name for"), anchor it with universal behavior (e.g., "she rocked, wordless, at the cliff’s edge").  

  ---

  ### **Efficiency Notes**
  - **Time budget:** Skip scenes without inner-state claims. For others: Q1-2 take 2 mins; Q3-5 take 3 mins max.  
  - **40 scenes?** Batch by character (e.g., all aphasia scenes in one go).  
  - **"Overthinking" remedy:** This cuts philosophy to a flowchart. Trust the hard stops.  

  You’re wrestling with the limits of **how language hooks onto reality**. The tool enforces this: Inner states need external "handles," or we’re just making noise. Ten weeks is doable—now go gut the indefensible bits.
