       C) They wouldn't run any detailed simulations of human-like minds. (skip if already answered C in Q3)

   Question 5: Self-Location (Many Copies)
     Scenario: Suppose there is one original history and a billion simulations that are exact copies of that history up to the year 2000, then they diverge. In the year 2000, what should a person in that era think?
       A) They should think it's almost certain they are in a simulation because there are a billion simulations and only one original.
       B) They should think they are probably in the original because the simulations are copies and they have no reason to think they are a copy.
       C) The question doesn't make sense / we can't assign probabilities.

   Question 6: Self-Location (Cheap Simulations)
     Scenario: Suppose there are simulations where only one person is fully simulated (with a real mind) and everyone else is a simple AI that just behaves realistically but isn't conscious. If you were in such a simulation, how would you know? And given that, if there were many such simulations, should you think you are in one?
       A) I couldn't know, but if there are many such simulations, it becomes likely that I am in one and everyone else is fake.
       B) This scenario is impossible because you can't have a real mind in a simulation without a full environment, or because the other beings must be conscious too.
       C) Even if there are many, I have no reason to think I'm in one because I am having experiences that feel real and I have no evidence of being simulated.

   Question 7: Significance (Shutdown)
     Scenario: If we discovered we were in a simulation that was being run by researchers, and we learned that the researchers planned to shut down the simulation in 10 minutes, would it matter?
       A) Yes, because we would cease to exist and that is bad.
       B) No, because we would have existed and experienced life, and 10 minutes is short anyway.
