  We are building a decision tree to sort people into different positions on the simulation hypothesis. The tree must address three core issues:
   1. Possibility of simulated minds (substrate independence, gradual replacement, etc.)
   2. Self-location (given many simulations, does it make it likely that we are in one? including issues of reference classes and cheap simulations)
   3. Significance (if we are in a simulation, does it change anything? e.g., shutdown, ethical concerns, or artifacts)

   We want to map to the following leaves (positions):
   - Full package (Bostrom's trilemma plus indifference -> "almost certainly simulated")
   - Accepts the disjunction (one of Bostrom's three must be true) but refuses to pick which one
   - Denies simulated minds have experiences (no substrate independence)
   - Believes posthuman civilizations couldn't or wouldn't run very many ancestor-simulations
   - Believes simulations are common but ancestor-simulations are not (so we are in a research sim or game)
   - Believes the universe is inherently computational (so the question collapses)
   - Rejects the move from many simulations to "probably me" (on reference-class or sampling grounds)
   - Believes we are probably in a simulation but nothing follows (no significance)
   - Believes the question is not well-formed enough to have a view

   We'll design 8-10 questions, each with 2 or 3 options. Then we assign a scoring key that maps patterns of answers to one of the above positions (and possibly a few more if there are coherent but unnamed positions).

   Steps:
   1. Break down the logical space by the three core issues and their sub-questions.
   2. Design questions that force distinctions on these issues without using jargon.
   3. Ensure that the questions are concrete scenarios that can be answered cold.
   4. Build a tree that leads to the desired leaves.

   Core Issues and Sub-questions:

   Issue 1: Possibility of Simulated Minds
     Q1: Can a mind be simulated? (e.g., by a computer, or by replacing neurons one by one with artificial components that function the same)
     - Yes, if the function is the same then it's a mind.
     - No, consciousness requires the original biological substrate (or something non-computational).

   Issue 2: Self-Location
     Q2: If there are many simulations, does that make it likely that we are in one?
     - This breaks down into:
          a) Are there (or could there be) many simulations? (including both ancestor-simulations and other types)
          b) Given that there are many simulations, how do we reason about our own situation?

     Sub-issues for self-location:
     - Reference class: Are we a random sample from all observers? Or from all simulated and non-simulated minds? Or only from our own reference class?
     - Cheap simulations: What if the simulations are not detailed? (e.g., only the person being addressed is fully simulated and others are shallow)

   Issue 3: Significance
     Q3: If we are in a simulation, does it matter? (ethically, practically, etc.)
     - No, because we can't change anything and it's our reality anyway.
     - Yes, because the simulators might intervene (shut down, punish, etc.) or because it changes our understanding of reality.

   We also need to address the nature of the simulation:
     - Are we in an ancestor-simulation (simulating the past) or something else (e.g., a game, research, etc.)?
     - What is the likelihood that a posthuman civilization would run ancestor-simulations vs. other kinds?

   We'll design questions that cover these. We aim for 8-10 questions.

   Proposed Questions:

   Question 1: Mind Possibility (Gradual Replacement)
     Scenario: Suppose we replace one neuron in your brain with an artificial one that functions exactly the same. Then another, and another, until your entire brain is artificial. At any point, do you cease to be conscious?
       A) No, I remain conscious throughout and after the process.
       B) Yes, at some point (maybe when too many are replaced) I lose consciousness, even if I behave the same.

   Question 2: Mind Possibility (Complete Simulation)
     Scenario: Imagine a computer program that simulates every neuron in a human brain, exactly. Does this program have conscious experiences?
       A) Yes, it would be conscious.
       B) No, it's just a simulation and not real consciousness.

   Question 3: Abundance of Simulations (by posthuman civilizations)
     Scenario: Assume that in the future, there are civilizations with enormous computing power. How likely is it that they would run many detailed simulations of human-like minds (for any reason: ancestor-simulations, games, research, etc.)?
       A) Very likely: they would run huge numbers of such simulations.
       B) Unlikely: they might run a few, but not many.
       C) Extremely unlikely or impossible: they wouldn't run any, or only a negligible number.

   Question 4: Type of Simulations (Ancestor vs. Other)
     Scenario: If future civilizations run detailed simulations of human-like minds, what kind would they most commonly run?
       A) Simulations of their own ancestors (like us) to understand their history.
