  ### **Handout: Simulation Hypothesis Questionnaire**  
  *Answer based on intuition—no prior knowledge needed.*

  **Question 1 (Gradual Replacement):**  
  Your brain’s neurons are replaced one-by-one with artificial parts that work identically. After full replacement:  
  A) You’re still conscious.  
  B) You’re no longer conscious—even if you act the same.  

  **Question 2 (Full Simulation):**  
  A computer perfectly simulates every neuron in a human brain. Does it experience anything?  
  A) Yes—it’s conscious.  
  B) No—it’s just code.  

  **Question 3 (Simulation Abundance):**  
  Advanced civilizations could simulate minds like ours. How many would they run?  
  A) Vast numbers (e.g., for research, games, or history).  
  B) Few or none (too hard, unethical, or pointless).  

  **Question 4 (Simulation Type):**  
  If advanced civilizations run many human-like simulations, which is most common?  
  A) Ancestor-simulations (recreating their past).  
  B) Non-ancestor (e.g., games, experiments, or alien worlds).  
  C) Cheap sims (only one "real" mind; others are shallow AI).  

  **Question 5 (Self-Location: Copies):**  
  There’s one original 21st-century Earth and a billion perfect copies. What should someone in 2023 think?  
  A) "I’m probably in a copy—there are more of them."  
  B) "I’m probably original—no reason to think I’m a copy."  
  C) "This is meaningless—I can’t assign probabilities."  

  **Question 6 (Self-Location: Cheap Sims):**  
  You’re in a sim where only *you* are fully conscious; others are simple AI. With many such sims:  
  A) "I’m likely in one—the odds are high."  
  B) "I couldn’t be in one—everyone else must be conscious too."  
  C) "No evidence—I’ll assume I’m real."  

  **Question 7 (Significance: Shutdown):**  
  We discover we’re in a research sim shutting down in 10 minutes. Does it matter?  
  A) Yes—it ends everything.  
  B) No—life had value anyway.  

  **Question 8 (Significance: Artifact):**  
  Scientists find cosmic-ray patterns suggesting a simulation. Does this change anything?  
  A) Yes—reveals we’re designed/observed.  
  B) No—reality stays the same.  

  **Question 9 (Universe as Computer):**  
  The universe fundamentally processes information like a computer. Does this imply a simulator?  
  A) Yes—computation requires a creator.  
  B) No—it’s just how physics works.  
  C) "Universe as computer" is incoherent.  

  **Question 10 (Meaningfulness):**  
  Is "Are we in a simulation?" a well-formed question?  
  A) Yes—it’s answerable.  
  B) No—it’s too vague or unscientific.  

  ---

  ### **Scoring Key**  
  *Map your answers to a position. Positions are mutually exclusive.*

  1. **Biological Essentialist**  
     - *Path:* Q1=B **or** Q2=B.  
     - **Awkward commitment:** A perfect artificial brain isn’t conscious—even if identical to yours.  

  2. **Pancomputationalist**  
     - *Path:* Q9=A.  
     - **Awkward commitment:** "The universe is a computer" *entails* it’s simulated—no further debate needed.  

  3. **Question Rejector**  
     - *Path:* Q10=B.  
     - **Awkward commitment:** The topic is nonsense—yet you attended beer night.  

  4. **Bostromian Agnostic**  
     - *Path:* Q1=A, Q2=A, Q3=B/C, Q4=*, **and** (Q5=A **or** Q6=A).  
     - **Awkward commitment:** One of these *must* be true:  
       - Humans go extinct pre-simulation-tech.  
       - Posthumans avoid ancestor-sims.  
       - We’re simulated.  
       ...but you refuse to pick which.  

  5. **Simulation Skeptic**  
     - *Path:* Q1=A, Q2=A, Q3=B/C, Q4=*, **and** Q5≠A, Q6≠A.  
     - **Awkward commitment:** Even with infinite sims, you’d still bet you’re "real"—despite the odds.  

  6. **Self-Location Denier**  
     - *Path:* Q1=A, Q2=A, Q3=A, Q4=A/B, **and** Q5≠A, Q6≠A.  
     - **Awkward commitment:** Sim abundance + substrate independence don’t raise your probability of being simulated.  

  7. **Non-Ancestor Realist**  
     - *Path:* Q1=A, Q2=A, Q3=A, Q4=B, **and** (Q5=A **or** Q6=A).  
