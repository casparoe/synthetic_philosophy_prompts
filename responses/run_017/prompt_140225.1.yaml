  Below is a concise, scenario-based decision tree handout designed to clarify positions on the simulation hypothesis, avoiding jargon and focusing on concrete cases. It fits on two A4 pages (front and back), with 10 questions, each offering 2–3 options. The scoring key maps answer combinations to 10 named positions, isolating commitments on **mind simulation**, **self-location**, and **significance**. Each position includes its most awkward commitment. Coherent but unclaimed positions are flagged, along with indistinguishable leaves.

