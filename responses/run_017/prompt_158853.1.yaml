prompt: |-
  I'm a survey methodologist — I design sampling frames and weighting schemes for a living, so please use the full probability-sampling vocabulary on me: frames and coverage error, stratification and post-stratification, non-response and propensity weighting, design effects, effective sample size, and randomisation as an allocation device in trials. I've been asked to advise on a citizens' assembly for a regional transport authority and I keep getting handed political-theory arguments I have no way of evaluating.

  So: restate the case for sortition over elections in that vocabulary as faithfully as you can. The claims I keep meeting are that elections systematically select for an unrepresentative elite, that a lottery gives you a descriptive microcosm of the population for free, that removing campaigns removes the incentives to grandstand and form factions, and — the objection — that an unelected assembly isn't accountable to anyone afterwards. Give me each of those in my terms, including the bits where my terms fight back.

  The part I actually can't stop chewing on is an idea of my own: I want to treat the deliberation itself as a treatment applied after the draw, which makes descriptive mirroring a fact about pre-treatment covariates only, and makes the legitimacy claim rest on an assumption of no differential treatment effect — that the rich and the poor participants are moved the same amount by three weekends of expert evidence. And there's no untreated control, because everyone in the room gets the treatment. That feels like it breaks something in the mirroring argument, but I can't tell whether it breaks the argument or just shows the argument was never meant to carry epistemic weight in the first place.

  Then the residue report: what translated cleanly, what translated only because you quietly added an assumption I didn't give you, and what has no counterpart in sampling vocabulary at all. My own guesses are that the claim that this body's decision just is the polity's decision isn't an inference and so isn't the kind of thing my vocabulary can represent, and that accountability is a feedback loop my framework can describe perfectly well but which only elections actually have. For each bit of residue, tell me whether my framework is missing something real or whether the original claim was doing less work than it looked like it was doing. And write the whole thing as continuous prose, please — no headings, bullet points, bold text or tables, just an email-length reply I can read on the train.
reasoning: |-
  Okay, let me unpack this survey methodologist's request. They're deep in sampling theory but wrestling with political theory arguments about sortition for a citizens' assembly on transport policy. 

  First, I need to map their four key claims to sampling vocabulary:
  1) Elections selecting elites → coverage error from frame exclusion/self-selection
  2) Lottery as descriptive microcosm → probability sampling with known inclusion probabilities
  3) Removing campaigns reducing grandstanding → random assignment as control for confounding
  4) Accountability gap → absence of repeated sampling for performance feedback

  The user's own insight is fascinating - framing deliberation as a uniform post-treatment effect. That's clever but reveals a tension: descriptive representativeness only matters if deliberation affects all subgroups equally (no effect modification). If education level moderates how evidence changes opinions, the "microcosm" property degrades.

  For residue analysis:
  - The "embodiment" claim (assembly=polity) seems metaphysical - sampling can't validate ontological equivalence
  - Accountability does map to longitudinal sampling, but elections add electoral feedback loops
  - The deliberation homogeneity assumption is the hidden bridge between descriptive and substantive representation

  The user's hunches about residues are sharp. The "embodiment" claim indeed isn't inferential - it's a normative leap. But their framework isn't missing anything; it's exposing where political theory relies on non-empirical premises. 

  Biggest insight: Sortition's legitimacy depends entirely on whether deliberation is truly a universal solvent for social differences. That's an empirical question survey methods could actually test with panel data.
answer: |-
  Here's how the sortition case translates into your vocabulary, where it pushes back, and where the framework reveals seams or residue. I'll weave in your deliberation-as-treatment insight as we go.

  The core claim that elections systematically select for an unrepresentative elite maps to severe **coverage error** and **non-response bias** interacting catastrophically. The eligible voter frame excludes non-citizens and some disenfranchised groups upfront. Worse, the *effective* frame for those who run and win involves massive self-selection into candidacy (non-participation at the candidacy stage) and voter non-response skewed by SES, education, and engagement. The resulting elected body isn't a probability sample; it’s a **convenience sample** of the politically ambitious, resource-rich, and networked, yielding large **biases** in covariates like income, education, political efficacy, and arguably risk preferences. Stratification or quotas (e.g., districts) mitigate only coarsely. The lottery, by contrast, is **equal probability selection (EPSEM)** from a well-defined frame (e.g., adult residents), achieving a **descriptive microcosm** on all frame-available covariates. Coverage error (excluded populations) remains a threat in *both*, but the lottery minimizes selection bias *within* the covered frame.

  The claim that removing campaigns removes grandstanding/faction incentives translates to **randomization as an allocation device** applied not to treatment, but to *role assignment*. Elections incentivize strategic behavior (campaigning) that acts as a **confounding variable** – the traits and strategies that win office may correlate with post-election behavior (grandstanding, factional rigidity). Random assignment to the deliberative role removes this confounder; participants aren't selected *for* campaigning aptitude. The counter from your framework: randomization controls *initial* confounding but doesn't eliminate **differential behavioral responses** *during* deliberation (e.g., the naturally eloquent dominate). This is where stratification (e.g., by education) or quotas might be used *within* the sortition to preempt this, introducing a small design effect but potentially improving substantive representativeness.

  Your deliberation-as-treatment insight cuts deep. Yes, if we view the assembly process (expert evidence, facilitated discussion) as a **uniform treatment applied post-selection**, then the initial **descriptive representativeness** (balance on pre-treatment covariates) is crucial *only if* we assume **no differential treatment effect modification** by those covariates. The legitimacy claim that "the assembly's will *is* the people's will" implicitly assumes homogeneous effects: that the deliberation "moves" the high-school dropout and the PhD holder, the pauper and the billionaire, *in the same way and to the same degree* for a given set of facts. Your framework correctly screams that this is a strong, untestable assumption without an untreated control or **heterogeneous treatment effect analysis**. If the treatment effect *is* modified by covariates (e.g., education amplifies receptiveness to technical evidence), then even perfect pre-treatment covariate balance doesn't guarantee the outcome reflects what the *full population* would decide after the same treatment. The mirroring argument *for the output* breaks unless effect homogeneity holds. This doesn't break sortition’s *input* advantage over elections (less initial bias), but it highlights that descriptive representativeness is necessary but not sufficient for substantive representativeness of the *output* under treatment. The political theory claim often conflates the two.

  The accountability objection translates cleanly: Elections provide a **repeated sampling mechanism with feedback**. Voters act as auditors, using performance to inform the next selection (election), creating a **longitudinal probability design** (flawed, but existent). A single sortition has **no built-in longitudinal sampling or feedback loop**; the assembly is a **cross-sectional sample** with no direct mechanism for the population to "resample" based on performance. Post-hoc accountability relies on exogenous mechanisms (media, implementation scrutiny) not designed into the sampling frame. Your framework perfectly describes this lack; it doesn't miss anything. The residue is *normative*: whether electoral accountability is effective or performative theatre is beyond sampling theory.

  **Residue Report:**
  1.  **"The Assembly's Decision *Is* the Polity's Decision":** This is normative/metaphysical, not inferential. Sampling provides a *microcosm*, not an ontological identity. Your framework correctly flags this as *not an inference* but a claim about legitimacy/authority. It exposes that this claim does *less work* empirically than often implied; it relies entirely on the unproven homogeneity-of-treatment-effect assumption. Sampling theory reveals the leap.
  2.  **Accountability as Feedback Loop:** Translated cleanly. Sampling theory *can* model electoral accountability as repeated sampling with non-random attrition (incumbents rejected). The "residue" is the *value judgment* that this loop is essential. Your framework isn't missing mechanics here.
  3.  **Homogeneous Treatment Effect (Deliberation):** This is the critical hidden bridge. Political theory often *assumes* it implicitly. Your framework *requires* it for the output legitimacy claim and exposes its centrality. Sampling vocabulary *can* describe this assumption but *cannot* validate it within the single-assembly design. The residue is an *empirical question* (do effects differ?) that sampling design alone can't answer for *this* treatment. It reveals a major assumption doing heavy, often unacknowledged, work.
  4.  **Removing Factions/Incentives:** Translated partly (randomization removes confounder of campaign selection). Residue exists around inherent human tendencies to form in-group preferences during deliberation – a behavioral trait, not solely a selection effect. Sampling/therapy trial vocabulary (like group dynamics) touches this but doesn't fully own it. The claim *does slightly less work* than implied, as randomization doesn't erase group psychology.

  In essence, your framework translates the structural advantages of sortition (reduced coverage/selection bias) powerfully, exposes the critical hidden assumption of deliberation effect homogeneity needed for output legitimacy, cleanly handles the accountability comparison, and correctly dismisses the ontological claim as non-inferential. The residue is primarily normative (authority/identity claims) and the untestable homogeneity assumption – your tools show where the empirical arguments end and the political/normative ones begin.
