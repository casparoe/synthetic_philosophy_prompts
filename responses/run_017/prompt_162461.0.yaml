  - **Setup for Round 3**: We have 3 rooms (chairs) and 3 guests. We assign each guest a binary string of length 3 (written on a card, e.g., "001", "010", "111"). 
  - **Instruction**: "We now have a new kind of arrival: a new guest who has a specific requirement for the pattern of the hotel. The new guest will look at the pattern of the first room's first digit, the second room's second digit, and the third room's third digit. The new guest wants a pattern that in the first digit is the opposite of the first room's first digit, in the second digit the opposite of the second room's second digit, and so on. Can we assign this new guest to a room? If so, which room?"

  - **Expected Breakdown**: 
    - They will check room 1: the new guest's first digit is the opposite of room1's first digit -> so it cannot be room1. Similarly, it cannot be room2 because the second digit differs, and room3 because the third digit differs. So no room can hold the new guest.

  - **Debrief**: This shows that even though the hotel has infinitely many rooms, there are more patterns (subsets, real numbers) than can be accommodated.

  ### Overall Timing
  - Introduction and rules: 5 minutes
  - Round 1: 10 minutes
  - Round 2: 15 minutes
  - Round 3: 10 minutes (if time)
  - Final debrief: 5 minutes

  ### Debrief (5 minutes)
  - "What did we experience? In Round 1, we found that the standard story of shifting everyone up one room cannot be done step-by-step. The rearrangement is only possible if we imagine it happening all at once, which is not a physical process. In Round 2, we saw that even when we found a way to rearrange (by doubling), the time and energy required grows without bound and becomes infinite for an actual infinite hotel. This highlights the finitist concern: the hotel's spare capacity is a static property of the arrangement, not a capacity to perform an infinite process. Finally, in Round 3, we saw that some kinds of infinities are too big to fit into the hotel at all, even though the hotel is infinite."

  ### What Might Go Wrong and How to Handle
  1. **"Infinity isn't real, so this is meaningless"**: 
     - Acknowledge that infinity is an abstract concept, but the activity is about what we can and cannot do in a thought experiment. The point is to see the logical consequences of the idea of an actual infinite.

  2. **"Why not build an extension?"**: 
     - Explain that we are considering a fixed, actually infinite hotel. Building an extension would be a potential infinite (adding more rooms as needed), which is different.

  3. **Deadlock in Round 1**: 
     - If they are stuck, you can ask: "Can any guest move right now? What's stopping them?" Guide them to see that every room is occupied so no one can move until someone else moves, but then who goes first?

  4. **In Round 2, they might not think of moving the highest first**: 
     - You can let them struggle a bit, then suggest: "What if we start by moving the guest in the highest room we have?" and then scale.

  5. **Round 3 might be too abstract**: 
     - If the binary string idea is confusing, you can skip it or use a simpler finite example to show that not everything can be listed.

  ### What the Game Can't Deliver and You'll Have to Say
  - The game shows the physical impossibility of step-by-step rearrangement and the infinite time required. However, it doesn't prove the mathematical existence of bijections and cardinalities. You'll have to explain that in mathematics, we ignore the time and energy and focus on the static assignment. The finitist worry is that such static assignments don't correspond to anything physically realizable.

  ### One Sentence for the Column
  "Playing out Hilbert's Hotel with real people and real moves, we hit a wall: the famous rearrangement isn't a sequence of steps anyone can perform, and the infinite walking distance makes it clear that the hotel's 'spare room' is a mathematical abstraction that cannot be physically realised."
answer: |-
  ### **Activity Design: "Hilbert's Hotel: The Hands-On Nightmare"**
  A 45-minute interactive session exploring the paradoxes of actual infinities through physical movement, highlighting the gap between mathematical abstraction and performable processes. Participants will experience why rearrangements in Hilbert's Hotel can't be executed step-by-step and why "spare capacity" doesn't imply feasible accommodation.

  ---

  ### **Setup & Materials (5 mins setup before start)**
  - **Room Layout**:  
    - Clear a central space. Use tape to mark 10 "rooms" in a straight line (numbered 1–10).  
    - Designate a "lobby" area (e.g., a corner with chairs) for new arrivals.  
  - **Materials**:  
    - 25 numbered cards (1–25) for guests.  
    - 10 lettered cards (A–J) for new arrivals.  
    - Stopwatch (for timing moves).  
    - Whistle or bell (to signal "move!").  
    - Flipchart to track "cost" (distance walked).  
  - **Roles**:  
    - **Guests 1–15**: Start in rooms 1–15 (use first 10 taped rooms; rooms 11–15 are "imagined" beyond the tape, with guests standing in a line extending beyond room 10).  
    - **New Arrivals A–J**: Wait in the lobby.  
    - **Manager**: You (the facilitator).  
    - **Timekeeper**: A volunteer with the stopwatch.  
    - **Scribe**: Volunteer to tally "distance costs" on the flipchart.  

  ---

  ### **Rules (Read Aloud, 2 Mins)**  
  "Welcome to Hilbert's Hotel—infinitely many rooms, all occupied! We’ll simulate it with 15 guests. Rules:  
  1. **One Move at a Time**: When I blow the whistle, ONE guest may move to an *empty* room.  
  2. **No Teleporting**: Moves happen sequentially. No simultaneous shifts!  
  3. **Distance Costs**: When moving from room \(n\) to \(m\), add \(|n - m|\) to our total "cost." We’re on a budget—minimise cost!  
  4. **Goal**: Accommodate new arrivals without evicting anyone. Ready?"  

  ---

  ### **Rounds: Instructions, Timings & Breakdown**  
  **Total: 35 mins (including participant struggle time)**  

  #### **Round 1: One New Arrival (10 mins)**  
  - **Instruction**: *"One new guest (A) arrives. Free up Room 1 for them. Remember: one move at a time, only to empty rooms!"*  
  - **Expected Action**:  
    Guests will try to shift Guest 1 to Room 2 → but Room 2 is occupied. They’ll propose moving Guest 2 first → but Room 3 is occupied. **Deadlock ensues.**  
  - **Breakdown**:  
    - Participants hit the wall: *The first move has nowhere to go*. The "shift everyone up one" solution requires all moves to happen at once—impossible under the rules.  
    - **Key Insight**: Mathematical rearrangements aren’t "doable" as step-by-step processes.  

  #### **Round 2: Infinitely Many New Arrivals (15 mins)**  
  - **Instruction**: *"10 new arrivals (A–J) appear! Use the ‘doubling trick’: move each guest to room \(2 \times \text{current room}\). Free up odd-numbered rooms!"*  
  - **Expected Action**:  
    - Guests try moving Guest 1 to Room 2 → fails (occupied). Someone suggests moving the *highest-numbered guest first* (e.g., Guest 15 to Room 30).  
    - In our finite simulation: Guest 15 moves to "Room 30" (beyond the tape), then Guest 14 to Room 28, etc.  
    - **Timekeeper** records each move (5 secs per move) and **Scribe** adds distance costs (e.g., |15–30| = 15).  
  - **Breakdown**:  
    - **Finite case**: Success! After 15 moves, odd rooms are free. Cost = \(15 + 14 + ... + 1 = 120\). Time ≈ 75 secs.  
    - **Scale up**: *"Now imagine 1,000 guests. Time? ~83 mins. 1 million? ~58 days. Infinite guests? Infinite time and cost!"*  
    - **Key Insight**: Even with a valid sequence, infinite steps → infinite resources. "Spare capacity" is a static fact, not a process.  

  #### **Round 3 (Kicker): The Unhouseable Arrival (10 mins, if time)**  
  - **Instruction**: *"A new guest (K) arrives who’s allergic to ‘diagonal patterns’. They refuse any room if its number matches the position of a ‘no’ in their infinite checklist. We’ll simulate with 3 rooms: assign Guests 1–3 random YES/NO cards. Guest K vetoes Room 1 if Guest 1’s card is YES, Room 2 if Guest 2’s is NO, etc."*  
  - **Expected Action**:  
    - After assigning cards (e.g., Guest 1: YES, Guest 2: NO, Guest 3: YES), Guest K vetoes Room 1 (YES), Room 2 (NO), Room 3 (YES). **No room works!**  
  - **Breakdown**:  
    - **Key Insight**: Some infinities are "too big" (uncountable). No reshuffling works—even with infinite rooms! (No proof needed; felt through contradiction.)  

  ---

  ### **Debrief (5 Mins)**  
  Map the experience to concepts:  
  1. **Round 1**: The "shift up" solution isn’t a sequence of moves—it’s a simultaneous reassignment. *Actual infinity isn’t "performable."*  
  2. **Round 2**: Infinite steps require infinite time/energy. *Finitist worry: mathematical "capacity" ≠ physical feasibility.*  
  3. **Round 3 (if used)**: Some sets (e.g., real numbers) can’t be paired with rooms—*Cantor’s diagonal argument in disguise*.  
  **Final Punchline**: *"Hilbert’s Hotel reveals infinity as a static landscape, not a dynamic process—what we can describe mathematically can’t always be performed physically."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Infinity isn’t real!"**  
     - *Response*: "True—this is a thought experiment. But if math claims actual infinities *could* exist, shouldn’t they behave consistently? We’re stress-testing that."  
  2. **"Build an extension!"**  
     - *Response*: "Extensions are ‘potential’ infinity (step-by-step growth). Here, the hotel is *already* infinite—no more rooms can be added."  
  3. **Deadlock in Round 1 causes frustration**:  
     - *Response*: Lean into it! "Exactly—why can’t we start? What’s blocking the first move?"  
  4. **Round 2 descends into chaos**:  
     - *Response*: Guide with: "Who can move *without blocking others*? Start from the highest room!"  
  5. **Round 3 feels contrived**:  
     - *Response*: Simplify. Skip cards; say: *"K vetoes Room 1 if 1 is odd, Room 2 if 2 is even, etc."* Contradiction appears faster.  

  ### **Limitations of the Activity**  
  - **What it can’t deliver**: The game *implies* but doesn’t formally prove bijections vs. uncountability. You’ll need to say: *"Math resolves this by ignoring time/power—but finitists argue that’s cheating. The physical ‘wall’ we hit is their starting point."*  

  ---

  ### **One Sentence for Your Column**  
  *"Playing out Hilbert’s Hotel with real people, we smashed into the paradox’s silent core: infinity’s spare rooms are a fact of abstract arrangement, not a licence to perform the impossible."*  

  British English compliant, no projectors harmed. Run it, and watch infinity become tangible chaos!
