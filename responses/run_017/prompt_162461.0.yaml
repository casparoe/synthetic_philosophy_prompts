  Alternatively, we can do the following without writing:

  - We have the hotel with rooms 1,2,3,... and we have an infinite queue of new guests (we can have 5 for simulation). Each new guest is going to be assigned a room. But then we introduce a new guest who is defined in such a way that they cannot be placed without causing a contradiction.

  We can do a finite version of the diagonal argument:

  1. We have 5 rooms and 5 guests already. We want to add one more. But we only have 5 rooms? So we cannot. But that doesn't illustrate the infinite case.

  Instead, we can do the following:

  - We have an infinite list of guests already in the hotel (we are going to imagine that). Then we have an infinite list of new guests (each one has a number: new guest 1, 2, 3, ...). We try to assign them to rooms. We can do: new guest n goes to room n? But then we have infinitely many new guests, so we need to free up infinitely many rooms? That's the same as before.

  We want to show that the set of all possible subsets of the natural numbers (or the set of all infinite binary sequences) cannot be assigned to rooms. We can do a finite version:

  - We have 3 rooms and 8 subsets? But that doesn't scale.

  Alternatively, we can do the following activity:

  - We have an infinite strip of paper (we can use a long piece of adding machine tape) and we imagine that each room has a light switch that can be either on or off. Each guest in the hotel is associated with a particular pattern of switches. Now, a new guest arrives and says: "I want to be in a room such that the switch in that room is off if and only if the switch in room n is on for the guest in room n." But that might be too abstract.

  Perhaps skip the diagonal argument if we cannot make it physical. Or we can do:

  - We have the hotel with infinitely many rooms. We are going to assign each room a real number between 0 and 1 (by having the guest in that room write down an infinite decimal). Then we form a new real number by changing the n-th digit of the number in room n. This new number is not in any room. But without writing, we can have:

    - Assign each participant (guest) a random infinite decimal (but we can't really). 

  Instead, we can use a finite set to illustrate the idea of a missing combination.

  - **Activity**: We have 3 rooms and 3 guests. Each guest has a card with a sequence of 3 binary digits (e.g., 0,0,0; 0,0,1; ... but we only have 8 possibilities and 3 rooms). We assign 3 of the 8 possibilities to the 3 rooms. Then we form a new sequence: if the guest in room 1 has a 0 in the first position, we put 1 in the first position of the new sequence; if 1 then 0. Similarly for the second and third. This new sequence is not in any room. But we have only 3 rooms and 8 possibilities, so it's obvious we missed some. Then we say: in the infinite case, even though we have infinitely many rooms, we can always form a new sequence that is not in any room.

