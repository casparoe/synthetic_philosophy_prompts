  - **Then we scale up**: "Now imagine we have 1,000 guests. How long would it take? (about 1000 * 5 seconds = 5000 seconds, over an hour). For 1 million? (about 58 days). For infinitely many? (infinite time)."

  - **Breakdown**: They see that even though we can describe the arrangement, the process of getting there takes an infinite amount of time and energy.

  #### Round 3: A Different Kind of Arrival (if time, 10 minutes)
  We want to show an arrival that cannot be accommodated, not because of running out of rooms (there are infinitely many) but because of a diagonal argument. We can do the "infinitely many coaches with infinitely many passengers" and then show that the standard method (prime powers) works, but then introduce a twist? That might be too complex.

  Alternatively, we can try to show that the set of real numbers (or even the set of infinite binary sequences) cannot be put into the hotel. But without a whiteboard? We can do a physical diagonalization.

