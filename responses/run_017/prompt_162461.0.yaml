  We are designing a hands-on activity to explore actual infinities, specifically the Hilbert Hotel paradox, with a focus on the physical impossibility of performing the moves one step at a time. The activity will be run without a projector, using physical movement and a game-like structure.

  ### Core Idea
  The key insight we want participants to experience is that the rearrangement in Hilbert's Hotel requires simultaneous moves, which is not physically realizable. We also want to highlight that even if simultaneous moves were allowed, the distance walked (as a proxy for time or energy) would be infinite, making the process impossible to complete.

  ### Setup and Materials
  - **Room Setup**: Clear an open space. Arrange 10 chairs (or use tape on the floor) in a row to represent the first 10 rooms of the hotel. We are simulating an infinite hotel with a finite set of participants (we can use the first 10 as a sample, and then imagine the rest). Alternatively, we can have participants stand in a line and imagine the rest of the hotel extending infinitely.
  - **Materials**: 
    - Chairs (or tape marks) for at least 10 "rooms". More if we have more participants, but we can use the first 10 to demonstrate and then imagine the rest.
    - Nametags or numbered cards for the guests (numbers 1, 2, 3, ...). For 25 participants, we can have 15 as guests (numbered 1 to 15) and 10 as new arrivals (with letters A to J, say). The rest can be observers or we can have multiple rounds.
    - A stopwatch or timer (for the distance scoring).
    - A whistle or bell to signal moves (optional).
    - A flipchart or whiteboard for keeping score (if needed, but minimal).

  ### Roles
  - **Hotel Manager**: One participant (or the facilitator) who directs the moves.
  - **Guests**: Participants assigned as current guests (numbered 1, 2, 3, ...). They start in the rooms (chairs or marks).
  - **New Arrivals**: Participants assigned as new guests (with letters). They start in a designated "lobby" area.

  ### Rules (to be read aloud, 2 minutes)
  "Welcome to Hilbert's Hotel, which has infinitely many rooms, all currently occupied. We will simulate the first 10 rooms with these chairs, and imagine the rest. We have a problem: new guests arrive and we need to accommodate them without evicting anyone. But we have two rules:
  1. **One Move at a Time**: Only one guest can move at a time, and they can only move into an empty room.
  2. **Distance Matters**: When a guest moves, they must walk the actual distance. We will time how long they take to move, and we'll keep a total time (or steps) for the entire operation. Our goal is to minimize the total moving time.

  We'll try to accommodate new arrivals with different strategies, and we'll see how long it takes and whether we can actually do it."

  ### Rounds and Timing (45 minutes total)

  #### Round 1: One New Arrival (10 minutes)
  - **Setup**: 10 guests (1 to 10) in rooms 1 to 10. One new arrival (A) in the lobby.
