  Hmm... their internalism (2) is particularly spicy - rejecting Twin Earth intuitions puts them at odds with most externalists. Yet they still rely on causal history in (1)/(3). That's like wearing both a "CAUSAL HISTORY MATTERS" and "ONLY INTERNAL STATES MATTER" badge simultaneously. No wonder they feel tension.

  For the audit, I should:
  - Acknowledge their sophisticated distinctions first
  - Map the contradictions visually (maybe commitment pairs as conflict axes)
