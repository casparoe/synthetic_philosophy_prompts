answer: |-
  ## MEMORANDUM  
  **TO:** Principal Investigators, Facility Managers, Animal Care Staff  
  **FROM:** University Animal Care and Ethics Committee (ACEC)  
  **SUBJECT:** Revised Institutional Policy on Animal Use: Implementation of Indirect-Duty Framework  
  **DATE:** 1 October 2023  
  **REF:** ACEC-POL-2023-02 (Supersedes all prior welfare guidance)

  **1. PURPOSE:** This Policy establishes protocols for the use of non-rational beings (Animals) in research, teaching, and agricultural operations at the University. Its sole objective is the protection of *human* moral character and societal interests, consistent with the principle that duties are owed only to rational beings (Persons). Animal experiences are not morally relevant considerations.

  **2. DEFINITIONS:**
      *   **Animal:** Any non-rational being incapable of autonomous moral agency, setting ends, or membership in the kingdom of ends.
      *   **Person:** A rational being possessing dignity and autonomy, to whom direct moral duties are owed.
      *   **Indirect Duty:** A duty concerning Animals, grounded solely in its impact on the moral character of Persons or the interests of humanity.
      *   **Coarsening/Hardening:** The detrimental effect on a Person's moral sensibility resulting from actions that display or encourage disregard for living beings, potentially leading to diminished respect for Persons.
      *   **Substantial Human Importance:** A purpose demonstrably advancing core human knowledge, health, or societal welfare beyond mere curiosity.

  **3. FOUNDATIONAL PRINCIPLE:** No duty is owed directly to Animals. All provisions herein derive from duties owed to Persons: (a) the duty to avoid corrupting one's own moral character through cruelty or callousness; (b) the duty to uphold societal norms that foster humanity; (c) the duty to utilize resources (including Animals as property) efficiently and without causing public scandal detrimental to the institution or scientific endeavour.

  **4. ANALOGY SCHEDULE (Species Categorization for Protections):** Protections apply *only* insofar as an Animal resembles Persons, triggering associative responses in moral agents or society. Protections escalate with resemblance.
      *   **Tier 1 (Full Analogous Protection):** Dogs, Horses. Mandatory: Designated housing avoiding industrial aesthetics; prohibition on gratuitous physical discipline; mandatory "Long-Service Recognition" (see Clause 9); prohibition on casual naming (*e.g.*, "Rover," "Spot") – use functional identifiers only (*e.g.*, "Canine Subject Gamma"); *post-mortem* disposal requiring discretion.
      *   **Tier 2 (Moderate Analogous Protection):** Primates (non-human), Cats, Cattle, Sheep, Swine. Mandatory: Visual screening of procedures likely to cause overt distress; prohibition on overtly demeaning treatment; restrictions on public display of images/videos depicting distress or procedures incompatible with public perception of analogous traits (intelligence, maternal care).
      *   **Tier 3 (Minimal Analogous Protection - Suppressed Analogy):** Rodents (Rats, Mice), Birds (Poultry, Songbirds). Mandatory: **Suppression Measures:** Prohibition on naming; prohibition on non-essential photography/videography; mandatory use of terms "units," "cohorts," or "stock"; mandatory prompt euthanasia post-procedure unless scientifically justified for serial use; housing must avoid anthropomorphic enrichment (*e.g.*, wheels permitted solely for exercise physiology studies, not "enjoyment").
      *   **Tier 4 (Negligible Analogous Protection - Expedited Review):** Fish, Amphibians, Reptiles. ACEC review focused solely on: potential public perception issues; ensuring efficient resource use; verifying staff exposure mitigation (see Clause 6). Minimal housing standards based solely on maintaining viability for purpose.
      *   **Tier 5 (No Analogous Protection - Out of Scope):** Insects, Arachnids, Crustaceans, Molluscs, Other Invertebrates. No ACEC review required. Use governed solely by scientific necessity, resource efficiency, and safety regulations. No restrictions apply based on potential suffering.

  > *[Marginalia: Utilitarian: So crushing a beetle matters only if seen by a child? What about the beetle?]*  
  > *Reply: Correct. The beetle lacks moral status. The child's developing sensibility is the sole concern. Witnessing such acts *may* risk coarsening.*

  **5. PROCEDURAL REFINEMENT & PAIN MITIGATION:** Refinement is mandated *only* where:
      *   (a) The procedure involves significant pain/distress observable by Persons; **AND**
      *   (b) Its omission would demonstrably increase the risk of *coarsening* staff (see Clause 6) or provoke public outrage damaging to the institution (see Clause 8); **AND**
      *   (c) The procedure serves a purpose of **Substantial Human Importance**.
      Refinement is *not* required for procedures deemed merely "curious" or for exploratory research lacking a clear, substantial human benefit, unless conditions (a) and (b) are met. Analgesia/anesthesia use is permitted where it aids procedure efficacy; its use solely for the perceived benefit of the Animal requires justification under Clause 6 or 8.

  > *[Marginalia: Utilitarian: Surely minimizing suffering is inherently good, regardless of audience?]*  
  > *Reply: Suffering lacks inherent moral weight in non-persons. Mitigation is a tool to protect human character and institutional standing, not an end in itself.*

  **6. STAFF CHARACTER ASSESSMENT (HARDENING REGISTER):**
      6.1. **Induction Screening:** All personnel with direct Animal contact must undergo initial assessment for susceptibility to moral coarsening. Assessment evaluates baseline sensitivity to Animal distress/violence (self-report & observed response).
      6.2. **Annual Review:** Personnel undergo annual review to assess level of "Hardening." Certified **"Fully Hardened"** status is achieved when exposure no longer elicits distress or altered behavior in the staff member indicative of moral concern for the Animal.
      6.3. **Consequence of Hardening:** Once personnel are certified **"Fully Hardened"** for a specific procedure type or species cohort:
          *   Restraints mandated solely to prevent coarsening (Clauses 4 & 5 protections specific to analogy or distress mitigation) are **suspended** for those personnel performing those procedures on those Animals.
          *   Procedures performed **unwitnessed** by non-hardened personnel, and with no reasonable risk of public knowledge (Clause 8), are exempt from refinement requirements under Clause 5(b).
      6.4. **Record Keeping:** Hardening status must be documented per personnel role and species/procedure type.

  > *[Marginalia: Kantian: This risks institutionalizing vice! Coarsening is a corruption, not a credential.]*  
  > *Reply: The duty is to *prevent* the *act* of cruelty that causes coarsening. Once coarsening is complete, the *reason* for restraint (protecting that agent's character) lapses. The corruption lies in the *act*, not the subsequent state.*

  **7. PUBLICITY & PERCEPTION MANAGEMENT (Clause 8):**
      7.1. Where procedures involving Tiers 1-3 Animals, or causing overt distress to Tiers 2-4, carry a significant risk of becoming public knowledge and causing societal offence or reputational damage to the University, additional restrictions *beyond* the Analogy Schedule or standard refinement may be imposed by the ACEC.
      7.2. Such restrictions are solely **pragmatic measures** to protect the institution's standing and public trust in science. They do not imply any duty owed to the Animals involved. Examples include enhanced facility security, strict media embargoes, or mandated use of specific, less evocative terminology.

  **8. LONG-SERVICE RECOGNITION:**
      8.1. Applies **only** to Tier 1 Animals (Dogs, Horses) who have provided sustained, faithful service directly supporting human activities (*e.g.*, facility security, herding, therapy programs, prolonged research participation requiring docility).
      8.2. Recognition manifests as: dignified retirement housing (avoiding industrial settings); provision of food/shelter/veterinary care until natural death; discreet and respectful *post-mortem* disposal. Public commemoration plaques may be permitted.
      8.3. **Important:** This recognition is an expression of **human gratitude**, cultivating a virtuous disposition in staff and the community. It is **not** a duty owed *to* the Animal. Animals not qualifying under 8.1 (including all Tier 2-5, and Tier 1 without qualifying service) are subject to standard disposition protocols without recognition.

  > *[Marginalia: Utilitarian: Why lavish care on one dog while discarding thousands of rats?]*  
  > *Reply: The dog's service fosters a human virtue (gratitude) analogous to duties to persons. The rat offers no such analogy. Gratitude cannot meaningfully attach to property lacking service resonance.*

  **9. COMPLIANCE & ATTESTATION:**
      9.1. All PIs and Facility Managers must ensure their personnel adhere strictly to this Policy.
      9.2. Annual attestation of compliance must be submitted to the ACEC, confirming:
          *   Implementation of species-specific Analogy Schedule measures.
          *   Maintenance of the Hardening Register and application of Clause 6.3 exemptions.
          *   Application of Long-Service Recognition only to qualifying Tier 1 Animals.
          *   Procedures exist to manage publicity risks per Clause 7.
      9.3. **Attestation Focus:** Compliance signifies adherence to duties protecting **human character and institutional interests**. No attestation regarding Animal welfare *per se* is required or permitted.

  ---
  **Chair, Animal Care and Ethics Committee**  
  *(Signature on File)*

  **Review Date:** 1 October 2028, or as required by shifts in societal perception impacting analogy thresholds or reputational risk.
