prompt: |-
  You are a legal philosopher with one foot in the philosophy of language — someone who knows the debates about meaning, intention, and communication (sentence meaning versus speaker's meaning, conventions versus intentions, concepts versus their extensions) and who also has a working knowledge of how appellate courts in common-law systems actually handle statutes. Take this seriously and work through it carefully. Begin with a short brainstorming pass: sketch the two or three rival accounts of what a legal text's meaning is, note which parts of the practice described below each account would predict, and mark the parts that no single account seems to predict cleanly. Then give me the worked-out answer, organised under the headings I list at the end.

  I am an appellate lawyer, not a philosopher, and I keep noticing that we do one thing here and the opposite thing there. Here is the package of practices I have in mind, stated as neutrally as I can:

  1. Courts identify the "ordinary meaning" of statutory words as a competent speaker of the language would have understood them at the time the statute was enacted. Meaning is said to be fixed at enactment and not to drift afterwards.

  2. When doing this, they decline to consult the legislative record — committee reports, floor statements, earlier drafts, ministerial explanations — even where it is public, on point, and unambiguous. What the enacting legislators wanted the words to accomplish is treated as irrelevant to what the words mean.

  3. Yet the same courts also: (a) read statutes so as to avoid results they are willing to call absurd, manifestly unjust, or unworkable; (b) read old statutes as "always speaking," so that a provision framed in terms of a technology or practice from the 1930s is applied to its 2020s successor with no amendment ever having been made; (c) treat a preamble or an enacted statement of purposes as authoritative in resolving ambiguity, even though that text is as much part of the enactment as the committee reports they refuse to look at; and (d) defer to the reading adopted by the executive agency that administers an ambiguous provision, while continuing to insist that statutory interpretation is a question of law for judges alone.

  4. Provisions carrying criminal penalties are construed narrowly, in favour of the person exposed to them.

  A concrete instance, so the discussion stays on the ground rather than in the air: a 1935 by-law forbids "any vehicle" in a public park, and a city now wants to exclude e-scooters. The court reasons that "vehicle" in 1935 meant any wheeled conveyance used to carry people or goods — a description the enactors would not have had e-scooters in mind when using, but whose terms plainly cover them — and concludes that the e-scooter is within the meaning, not merely within some extended application the court has invented.

  Here is what I want from you:

  **The implicit theory.** Reconstruct the view of meaning, communication, and legal authority that this package presupposes. Does it presuppose that a statute's meaning is a function of the linguistic conventions of a community rather than of any speaker's intentions? Does it presuppose a distinction between ascertaining what a text says and deciding what is to be done about it, with only the first counting as interpretation? Does it presuppose something further about law's job — notice to citizens, legislative supremacy, the constraints on unelected judges — that the interpretive rules are meant to serve?

  **Strict presuppositions versus mere fits.** Distinguish what the package strictly presupposes — what could not be given up without abandoning the underlying theory — from what merely sits well with it and could be jettisoned while remaining recognisably the same approach. In particular: is the refusal in (2) required by the theory of meaning in (1), or is it only an evidentiary or institutional proxy that the theory recommends for reasons of cost, reliability, or manipulability? Is the narrow-construction rule in (4) part of the theory of meaning at all, or an independent normative overlay?

  **Internal consistency.** Is (3a) compatible with (2), given that a claim about absurdity looks like a claim about what the legislature could not have meant to achieve? Is (3b) in genuine tension with (1), or can the e-scooter reasoning — fixed descriptive content, open-ended application — reconcile them, and what does that reconciliation assume about concepts and about there being a fact of the matter about which description the 1935 word carried? Are (3c) and (3d) consistent with (2), or do they betray a different view of what statutes are for: if the enacted purpose-statement and the agency's reading are admissible while committee reports are not, what is being trusted in the first pair and distrusted in the third?

  **Replacing the package.** Suppose the jurisdiction abandoned this package for a straightforward purposivism — courts ask what the statute was there to achieve and read the text so as to serve that aim. What exactly would have to change in how judges reason, write, and justify outcomes? Say precisely what burden purposivism imposes that these rules seem designed to avoid: what must a judge now establish, and what kind of claim is it (empirical, counterfactual, evaluative) when the legislature was plural, compromised, and partly silent? And say honestly where textualism's rules purchase their cheapness at the cost of accuracy.

  **Settled versus contested.** Separate what people who actually work on this would treat as common ground from what is genuinely disputed among them — for instance, whether there is a determinate fact of the matter about ordinary meaning at a time, whether the line between interpretation and construction is coherent or ad hoc, whether textualism really delivers the constraint on judges it advertises, and whether textualism and purposivism diverge much in the cases that reach appellate courts. Tell me which of your own claims are the contested ones, and what the strongest version of the other side is.

  **Where the practice is underdetermined.** Finally, tell me where the practice as described does not settle the philosophy: places where two or more quite different theories of meaning, authority, or legislation would license exactly the same behaviour, so that pointing at the practice cannot adjudicate between them.

  Do not cite cases, statutes, or scholarly literature by name — I want the argument, not the references, and I want it as if you had no library to consult. Aim for a substantive memo of roughly 1,000 to 1,500 words, plus the brainstorming section.
reasoning: |-
  Hmm, this is a sophisticated request from an appellate lawyer seeking a philosophical dissection of statutory interpretation practices. They're clearly frustrated with apparent contradictions in how courts handle texts - insisting on original ordinary meaning while also updating applications and considering purpose. The concrete e-scooter example helps ground the discussion.

  The challenge is to reconstruct the implicit theory behind these practices while maintaining philosophical rigor about meaning and legal authority. I need to handle several moving parts: the fixed-meaning doctrine (1), exclusion of legislative history (2), the seemingly contradictory exceptions in (3a-d), and the rule of lenity (4). 

  For brainstorming, I consider three rival accounts: textualism (conventional meaning), purposivism (legislative aims), and dynamic interpretation (evolving application). Textualism best explains the core practice of (1) and (2) but struggles with (3b) and (3c). Purposivism neatly handles (3a) and (3c) but contradicts (2). The e-scooter example reveals how textualism distinguishes between fixed meaning and new applications - "vehicle" maintains its descriptive content while covering new instances.

  The lawyer wants specific analyses under prescribed headings. For "implicit theory," I'll argue the package presupposes: conventional meaning fixed at enactment; a distinction between interpretation (finding meaning) and construction (applying it); and institutional values like notice and judicial constraint. The refusal in (2) is probably a strict presupposition since legislative intent conflicts with conventional meaning, while (4) is a normative overlay.

  The tensions in (3) reveal interesting nuances: (3a) might be justifiable as part of construction rather than interpretation; (3b) shows how concepts can have open-ended extensions; (3c) and (3d) suggest that some legislative materials are more reliable than others when properly enacted. 

  When considering a shift to purposivism, the main burden would be establishing legislative aim - which involves messy counterfactuals about what a collective body would have wanted. Textualism's cheapness comes at the cost of potentially frustrating actual legislative purposes.

  I should flag key controversies: the determinacy of ordinary meaning is hotly debated, as is whether the interpretation/construction distinction holds water. The practice underdetermines whether meaning is ultimately conventional or intentionalist, since both can sometimes yield the same outcomes.

  Throughout, I'll maintain the fiction of being a philosopher with no library - relying purely on conceptual analysis rather than citations. The tone should be precise but accessible for a legally trained reader who's philosophically curious.
answer: |-
  ## Brainstorming: Rival Accounts and Their Fit with Practice

  **1. Textualism (Conventional Meaning Focus):**  
  - *Core Claim:* Meaning is fixed by conventional public semantic rules at enactment ("ordinary meaning"). Legislative intentions are irrelevant to meaning, though may inform application in limited ways.  
  - *Fits:* (1) perfectly; (2) perfectly; (3b) fits via "always speaking" doctrine (fixed meaning, evolving application); (3c) fits if purpose is enacted text; (4) fits as independent rule of lenity.  
  - *Misfits:* (3a) "absurd results" seems to invoke unstated legislative intent/purpose; (3d) agency deference seems inconsistent with meaning being a "question of law."  

  **2. Purposivism (Legislative Aim Focus):**  
  - *Core Claim:* Meaning is determined by the overarching purpose the legislature sought to achieve. Text is a vehicle for purpose.  
  - *Fits:* (3a) perfectly (avoiding absurdity aligns with purpose); (3b) fits if purpose evolves with context; (3c) perfectly (purpose is key); (4) fits as policy protecting liberty.  
  - *Misfits:* (1) & (2) directly contradict its core; e-scooter example contradicts its likely approach (would focus on 1935 *purpose* of excluding disruptive conveyances, not 1935 dictionary meaning).  

  **3. Moderate Intentionalism (Utterer's Meaning Focus):**  
  - *Core Claim:* Meaning is what the enacting legislature *intended* the words to communicate in context. Conventions evidence intent but aren't definitive.  
  - *Fits:* (3a) & (3c) fit well (intent avoids absurdity, purpose reveals intent); (4) fits as presumed legislative intent.  
  - *Misfits:* (1) is ambiguous (does "understood" mean conventionally or intentionally?); (2) is a direct contradiction (legislative record is prime evidence of intent); e-scooter example contradicts (would ask if legislature *intended* to cover future inventions).  

  **Key Tension Points:**  
  - (3a) ("absurd results") clashes conceptually with (2) (rejecting intent).  
  - (3b) ("always speaking") seems at odds with (1) ("fixed meaning") but *might* be reconciled via concept/application distinction.  
  - (3d) (agency deference) clashes with (2) and the "question of law" claim.  
  - E-scooter example fits textualism best, poorly with others.  

  ---

  ## Worked-Out Analysis

  **I. The Implicit Theory**  
  The package presupposes a **conventionalist, public-meaning textualism** grounded in legislative supremacy, rule-of-law values, and judicial restraint.  

  *   **Meaning as Conventional:** The meaning of a statute is strictly a function of the linguistic conventions shared by competent speakers of the language *at the time of enactment* (1). This is fundamentally *not* the private intentions of the legislators (2), nor the evolving understanding of later communities. Meaning is fixed because conventions at T1 are a historical fact.  
  *   **Communication & Authority:** The statute is treated as a *public command*, communicated *through* conventional language. Authority resides in the *enacted text*, not the unenacted thoughts of the legislators. Citizens must be able to rely on public linguistic rules to know the law and order their affairs (rule of law, notice). Legislative supremacy means courts apply the *text the legislature passed*, not what it might have wanted but failed to articulate conventionally.  
  *   **Interpretation vs. Construction/Application:** The package presupposes a crucial distinction:  
      *   **Interpretation:** Ascertaining the linguistic meaning of the text at enactment. This is purely a question of conventional semantic meaning and syntactic rules (1, 2).  
      *   **Construction/Application:** Deciding *how* that fixed meaning applies to novel situations (3b - "always speaking"), resolving genuine ambiguities revealed through application (3c, 3d), or avoiding outcomes that conflict with fundamental legal principles (3a) or justice (4). This involves judgment beyond pure semantic decoding.  
  *   **Law's Job:** The rules primarily serve **notice** (citizens can rely on public meaning), **legislative supremacy** (courts apply the enacted text, not unenacted wishes), and **constraint on judges** (reliance on public conventions is more objective and constraining than divining intent or purpose).  

  **II. Strict Presuppositions vs. Mere Fits**  

  *   **Strict Presuppositions:**  
      *   Meaning is fixed by linguistic conventions at enactment (Core of 1).  
      *   Meaning is distinct from and not determined by unenacted legislative intentions (Core justification for 2).  
      *   The fundamental distinction between interpretation (finding linguistic meaning) and construction/application (deciding legal effect/scope).  
  *   **Mere Fits / Recommended Proxies/Norms:**  
      *   **Refusal of Legislative History (2):** While *required* by the strict separation of meaning from intent, the *specific exclusion* of committee reports etc., even when clear, is also an *evidentiary and institutional proxy*. It avoids costs of researching often voluminous records, reliability issues (who's "speaking" for the legislature? are statements strategic?), manipulability, and preserving judicial role. A purer intentionalist could accept the theory of meaning but reject the exclusion rule.  
      *   **Narrow Construction (4 - Rule of Lenity):** This is **not** part of the theory of meaning itself. It is an **independent normative principle** of criminal law (favoring liberty, requiring clear notice for conduct subject to penalty) applied *after* meaning is determined. It operates as a tie-breaker in genuine ambiguity *during construction*.  
      *   **Agency Deference (3d):** This is primarily an institutional/comity doctrine about allocating interpretive *authority* over ambiguous terms within the scope of agency expertise *after* the court has found ambiguity. It doesn't define meaning, but who gets to resolve the ambiguity in application.  
      *   **"Always Speaking" (3b):** While relying on fixed meaning, the *application* to new phenomena relies on the theory that the *concept* expressed by the word (e.g., "vehicle" as wheeled conveyance for transport) has an open-ended extension, allowing new instances to fall under it without changing the meaning. This application *presupposes* fixed meaning but isn't strictly entailed by it.  

  **III. Internal Consistency**  

  *   **(3a) Absurd Results vs. (2):** This is the sharpest tension. Consistency is maintained by the interpretation/construction distinction. Avoiding absurdity is *not* part of interpreting the linguistic meaning. It is a *construction* doctrine applied *after* meaning is ascertained. It reflects a background legal principle that legislatures are presumed *not* to intend absurd/unjust results *as a matter of legal effect*, or a constitutional avoidance principle. It's a limit on the *application* of the meaning, justified by systemic legal values, not a dive into actual legislative intent (which is still barred by (2)).  
  *   **(3b) "Always Speaking" vs. (1):** Reconciled via the concept/application distinction. "Vehicle" (1935) meant *the concept* "wheeled conveyance for transporting people/goods." This concept (meaning) is fixed. E-scooters are a new *instance* falling under that concept's extension. The reconciliation assumes concepts have **intensions** (defining descriptions/properties) that are stable, but **extensions** (things satisfying the description) that can expand with new phenomena. It assumes the 1935 word carried a *descriptive* concept (based on function/structure) rather than merely listing 1935 exemplars.  
  *   **(3c) Enacted Purpose & (3d) Agency Deference vs. (2):**  
      *   **Enacted Purpose (3c):** This is consistent because the purpose statement *is enacted text*. It's part of the conventional meaning the legislature communicated publicly. It's evidence of meaning *within* the conventional framework, used to resolve ambiguities *within* the linguistic meaning of the operative text. Committee reports are *not* enacted, hence excluded. Trust is placed in the *publicly enacted* expression of purpose, distrusted in *unenacted* statements of intent.  
      *   **Agency Deference (3d):** This is less about meaning and more about resolving ambiguity *in application* within the agency's expertise. It's consistent with (2) *if* the court first determines linguistic meaning is ambiguous after exhausting conventional tools (including enacted purpose). The agency isn't defining original meaning; it's making a policy-laden choice about how to apply an ambiguous term *now*. The tension lies in calling it a "question of law" yet deferring.  

  **IV. Replacing the Package with Purposivism**  

  Abandoning textualism for pure purposivism would fundamentally change judicial reasoning:  

  1.  **Burden Shift:** Judges would need to establish the **actual, specific purpose(s) the enacting legislature sought to achieve** with the statute. This is the primary inquiry, not the semantic meaning.  
  2.  **Nature of the Claim:** Establishing purpose is inherently:  
      *   **Empirical:** Requires investigating historical context, problems addressed, legislative history (reports, debates, drafts), potentially broader social/political circumstances.  
      *   **Counterfactual:** Requires asking "What *would* the legislature have done/meant *if* they had considered this specific situation?" (especially for new tech like e-scooters).  
      *   **Evaluative/Normative:** Requires judges to *select* and *prioritize* among often multiple, conflicting, or vague legislative goals (especially in compromises), and to *evaluate* how best to "serve" the purpose in the current context.  
  3.  **Changes in Practice:**  
      *   Legislative history becomes central, not excluded.  
      *   "Ordinary meaning" becomes a starting point or evidence of purpose, not the goal.  
      *   The "absurd results" doctrine loses its tension; it flows naturally from purpose.  
      *   "Always speaking" is straightforward; purpose is applied to new contexts.  
      *   Rule of lenity might weaken (if purpose clearly covers the conduct).  
      *   Agency deference might change focus (does agency reading best serve purpose?).  
      *   E-scooter outcome: Likely excluded if the 1935 purpose was banning noisy, disruptive, dangerous conveyances (like cars, motorcycles), not simply anything with wheels.  
  4.  **Textualism's Cheapness vs. Accuracy Trade-off:**  
      *   **Cheapness:** Textualism avoids costly, uncertain inquiries into subjective/collective intent. It relies on publicly accessible conventions. It promises clearer judicial constraint and predictability.  
      *   **Cost of Accuracy:** Textualism risks **frustrating actual legislative purpose** by adhering rigidly to semantic meaning even where context strongly suggests a different intended scope (e.g., applying "vehicle" to a child's toy scooter in the park). It can produce results the enactors demonstrably did not want and would have drafted to avoid. It struggles with ambiguity where conventions are genuinely unclear.  

  **V. Settled vs. Contested**  

  *   **Common Ground (Among Serious Theorists):**  
      *   Language has conventional meaning shared by linguistic communities.  
      *   Legislatures act with purposes; statutes are purposive acts.  
      *   Judges should strive to be faithful agents of the legislature.  
      *   Rule-of-law values (notice, predictability) matter.  
      *   Legislative history can be problematic (unreliable, strategic, incomplete).  
      *   Meaning (however defined) is fixed *at enactment* in some crucial sense.  
  *   **Genuinely Contested (My Claims Marked \*):**  
      *   \***Determinacy of Ordinary Meaning:** Is there often a single, objectively determinable "ordinary meaning" at a time, or is language frequently underdetermined/ambiguous? (Textualists lean yes; critics strongly contest this).  
      *   \***Coherence of Interpretation/Construction Distinction:** Is this a real, principled distinction, or an ad hoc device allowing textualists to reach desired results while maintaining purity? (Critics argue it's incoherent or masks value judgments).  
      *   \***Judicial Constraint:** Does textualism genuinely constrain judges more than purposivism, or do both allow significant judicial discretion (textualism in choosing which conventions matter, defining ambiguity; purposivism in defining purpose)? (Empirical claim hotly debated; critics argue textualism disguises discretion).  
      *   **Divergence in Appellate Cases:** Do textualism and purposivism actually lead to different outcomes in most appealed cases? (Empirical question; many argue true ambiguities are rare and most methodologies converge often).  
      *   **Strongest Purposivist Counter:** Statutes are instruments of policy created to solve problems. Faithful agency requires giving effect to the legislature's *aims*, not just its dictionary. Ignoring clear evidence of purpose (even unenacted) frustrates democracy and leads to nonsensical results. Textualism's "ordinary meaning" is often a judge's construct masking policy choices.  

  **VI. Where Practice is Underdetermined**  

  The described practice does *not* adjudicate between these deeper philosophical positions:  

  1.  **Conventionalism vs. Moderate Public Intentionalism:** Does "ordinary meaning" reflect pure linguistic conventions *or* the meaning the legislators *intended to convey using* those conventions (assuming competence)? Both theories can justify (1) & (2) (public meaning vs. public intent; excluding private intent). The e-scooter result fits both (if legislators intended the descriptive concept). Practice doesn't settle whether "meaning" is purely conventional or conventional-as-evidence-of-communicative-intent.  
  2.  **Nature of Concepts:** Does the "always speaking" doctrine rely on concepts having **descriptive essences** (vehicle = wheeled transport) or being **cluster concepts** (vehicle = things sharing enough features with prototypes like cars/carts)? Both allow evolving application. Practice doesn't require committing to a specific metaphysics of concepts.  
  3.  **Justification for Rule of Law Values:** Is the emphasis on notice and constraint grounded in **democratic legitimacy** (giving effect to the enacted text), **fairness** (citizens relying on public meaning), **epistemic limitations** (judges can't reliably know intent), or **institutional competence** (courts interpret, agencies administer)? Practice is compatible with any of these underlying justifications for the textualist package.  
  4.  **Authority of Enacted Purpose (3c):** Does the preamble bind because it *is* part of the conventional meaning, or because it is the *legislature's most authoritative statement of intent*? Practice underdetermines whether this is a textualist or intentionalist move.  
  5.  **Agency Deference (3d):** Is deference justified because agencies have **institutional expertise** in applying concepts to complex realities, or because they are **delegated lawmakers** filling in gaps the legislature left? Practice is compatible with both views of administrative law's foundation.  

  The practice reveals a complex, hybrid approach prioritizing conventional public meaning at enactment as the core of "interpretation," supplemented by distinct doctrines for application, resolving ambiguity, and avoiding injustice, all operating within a framework designed to uphold legislative supremacy and the rule of law while managing judicial role and institutional limitations. Its internal tensions point to the inherent difficulty of reducing law to any single, pure theory of meaning or authority.
