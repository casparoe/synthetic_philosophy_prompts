prompt: |-
  I teach an introductory ethics course, and every year I rewrite the answer key for the week we spend on trolley cases and the doctrine of double effect. This year I want the key to derive the verdicts from one statement of the principle rather than from a list of intuitions, and in trying to do that I have found that I cannot tell whether what I hold is a single view or several views that happen not to have met. I would be grateful for an audit.

  What I hold, as carefully as I can state it:

  (i) The doctrine of double effect, in the form I want: there is a serious moral difference — a difference in what I may do, not merely in what I am to blame for — between a foreseen harm that enters my action as that by which I achieve my end and a foreseen harm that enters it as something that merely happens along the way. The second is governed by proportionality; the first is not something a favourable ratio of lives saved converts into something I may do. So there is, as far as I can see, no number of people on the main track at which it becomes permissible to push the man off the footbridge.

  (ii) There is no intrinsic moral difference between doing and allowing, or between killing and letting die, and there is no further wrong of "using" a person over and above what (i) already captures. I have been told that (ii) leaves me unable to explain why the transplant surgeon may not proceed; it seems to me that (i) explains that on its own, and I would like to know whether that is right.

  (iii) Verdicts: turning the trolley is permissible; pushing the man off the footbridge is not; the transplant surgeon may not proceed; and the loop variant is permissible — the spur rejoins the main track, so that the man standing on it is what stops the trolley before it comes round to the five, and I take diverting onto the loop to be permissible even so.

  (iv) Whether an action is permissible cannot depend on how things actually turn out, only on what the agent had reason to believe: permissibility is settled by the agent's evidence. I hold this for the usual reason — I do not want to say that someone who did everything a reasonable person would do acted impermissibly because of a fact that was beyond her ken.

  (v) The distinction (i) turns on is a distinction in the action, not in the agent's head. Whether a death entered my action as a means or only as a consequence is settled by the actual causal structure of what I did and by how my agency was in fact directed — not by what I was attending to, and not by what I took the causal structure to be. If it were settled by occurrent mental states, whether I may act would depend on what I happened to be thinking about while acting, which seems to me morally arbitrary.

  (vi) Method: I treat the verdicts in (iii) as data that an adequate principle has to recover, not as noise to be explained away, which is why I am unmoved by arguments that derive those verdicts from emotional response or from features of the cases that are merely presentational. I also want a principle that generates the verdicts rather than one that restates them, so I am suspicious of any repair that amounts to labelling the cases.

  Two years ago a student proposed a pair of cases I have never been able to answer, and I now suspect the reason is that (iv) and (v) deliver opposite verdicts on them — though I cannot see what exactly is doing the work, or whether the fault really lies there.

  Case A. The loop variant as in (iii). The agent diverts the trolley onto the spur, reasonably believing that the man on it is what will stop the trolley before it reaches the five. In fact — and there was no way for her to have discovered this — a maintenance wagon is parked on the spur beyond where he is standing, so the trolley would have stopped in time anyway; the collision with him makes no causal difference to whether the five live.

  Case B. The switch case. The agent diverts onto a spur where a man is working, and her evidence is that he is standing beyond the point at which the trolley will come to rest, so that she foresees at most a small risk to him and certainly does not take his being struck to be part of how the five are saved. In fact the buffer at the end of the spur has been left unbolted: the trolley runs the full length of the spur, kills him, and only his body wedged against the buffer prevents it from breaking through and reaching the five. Had he not been there, they would have died.

  By (iv), it seems to me, she acts impermissibly in A and permissibly in B; by (v), the reverse. I cannot see what the difference between the two cases is supposed to consist in, which makes me think I am helping myself to something I have not stated.

  So: go through the set and tell me which commitments are genuinely in tension and which only look as though they are, ordered by how severe the tension is rather than listed as equally bad. For each real tension, say what would have to be given up, what the cheapest revision would be, and what that revision would cost me elsewhere in the set; where two commitments can be kept by drawing a distinction I have not drawn, say what the distinction is. And if the strain is somewhere I have not indicated, I would rather be told.
reasoning: |-
  Hmm, the user teaches an ethics course and is struggling with reconciling their principles about the doctrine of double effect and trolley problems. They've presented a detailed set of commitments (i through vi) and two problematic cases (A and B) that create tension between their views on permissibility depending on evidence versus actual causal structure. I need to audit this system for consistency.

  First, let me understand their core positions. They believe: (i) means vs side-effect distinction is morally fundamental; (ii) no intrinsic moral difference between doing/allowing; (iii) standard trolley verdicts; (iv) permissibility depends on evidence; (v) means/side-effect distinction is objective (not mental); (vi) verdicts are fixed data points.

  The tension crystallizes in cases A and B. In A (loop variant with hidden wagon), evidence suggests the death is a means but actually isn't. In B (switch case with hidden buffer failure), evidence suggests death is a side-effect but actually is a means. By (iv), A seems impermissible (bad evidence) but B permissible (good evidence). By (v), A seems permissible (objectively not means) but B impermissible (objectively means). That's a direct conflict.

  Now for diagnosis. The deepest tension is between (iv) and (v). (iv) makes permissibility subjective (evidence-relative), while (v) requires objective assessment of causal roles. This isn't fixable by minor tweaks - it's a fundamental clash in what determines permissibility. 

  Possible resolutions:
  1. Abandon (iv): Accept objective permissibility. Cost: Must say agent in A acted permissibly despite unreasonable belief, and agent in B acted impermissibly despite reasonable belief. Conflicts with user's stated rejection of outcome-dependence in moral luck cases.

  2. Abandon (v): Make means/side-effect mental. Cost: Allows "avoiding thoughts" loopholes and contradicts user's view that the distinction is action-centered. Also struggles with Case B where agent has no intention but death is causally necessary.

  3. Distinguish permissibility levels: Perhaps introduce an evidence-relative layer over objective rightness. But user wants permissibility to be unitary ("what I may do").

  The transplant surgeon case is actually fine under (i) alone - harvesting organs uses death as a means regardless of doing/allowing distinctions. So (ii) isn't problematic. 

  For the student's cases, I should note that Case A challenges (iv) if we keep (v), while Case B challenges (v) if we keep (iv). The cheapest revision might be to bite the bullet on objective permissibility (drop iv), but that sacrifices their anti-moral-luck intuition. Alternatively, refine (v) to include reasonably foreseeable causal structure, but that blurs into (iv).

  Other tensions are manageable. The loop case verdict can be defended under (i) since the death isn't strictly necessary as a means (the track position stops the trolley regardless of fatality). But Cases A/B expose that this relies on objective causal facts conflicting with epistemic constraints.

  The user should know their core framework is coherent except for this evidence/ontology clash, and that transplant case stands without (ii). I'll organize this as requested - by severity, with resolution costs.
answer: |-
  ### Audit of Your Ethical Framework  
  Your commitments form a coherent system with one severe tension between (iv) and (v), moderate tension between (i) and the loop variant under (iii), and no significant conflicts elsewhere. Below, I analyze tensions by severity, propose resolutions, and note costs. Verdicts hold for standard trolley cases, but Cases A/B reveal foundational issues.

  ---

  ### **1. Severe Tension: (iv) vs. (v) – The Evidence/Ontology Clash**  
  **Conflict:**  
  - **(iv)** demands that permissibility depends *only* on the agent’s evidence (subjective permissibility).  
  - **(v)** demands that the means/side-effect distinction depends *only* on objective causal structure and agential direction (objective permissibility).  
  Cases A and B force these apart:  
  - **Case A (Loop Variant):**  
    - *By (iv):* Agent reasonably believes the death is a means to save the five. Thus, diverting is impermissible (since (i) forbids using harm as a means).  
    - *By (v):* Death is *not* a means (the wagon stops the trolley). Thus, diverting is permissible (death is a foreseen side-effect).  
  - **Case B (Switch Case):**  
    - *By (iv):* Agent reasonably believes death is *not* a means (merely a risk). Thus, diverting is permissible.  
    - *By (v):* Death *is* a means (the body stops the trolley). Thus, diverting is impermissible.  

  **Result:** (iv) and (v) cannot coexist. Case A requires impermissibility under (iv) but permissibility under (v); Case B requires the reverse. This is irreconcilable without revision.  

  **Cheapest Resolution:** **Abandon (iv)** and adopt *objective permissibility*.  
  - **Why?** (v) anchors your core doctrine (i), which relies on objective causal roles. (iv) is a separable epistemic commitment.  
  - **Revision:** Replace (iv) with: *"Permissibility depends on the objective causal structure of the action and the agent’s intentional direction, not on their evidence."*  
  - **Costs:**  
    - You must accept *moral luck*. In Case B, the agent acts impermissibly despite reasonable beliefs and blamelessness. This violates your "usual reason" for (iv) (e.g., a reasonable agent might act impermissibly due to hidden facts).  
    - Teaching burden: Students may resist outcome-dependent permissibility.  
  - **Benefit:** Saves (i), (v), and your verdicts for standard cases. Cases A/B resolve cleanly:  
    - **Case A:** Permissible (death is objectively a side-effect).  
    - **Case B:** Impermissible (death is objectively a means).  

  **Alternative Resolution:** **Refine (v) to include epistemic constraints** (costlier).  
  - **Revision:** Merge (iv) and (v): *"The means/side-effect distinction depends on the causal structure *reasonably foreseen* by the agent."*  
  - **Costs:**  
    - Undermines (v)’s anti-arbitrariness argument (permissibility now *does* depend on "what the agent was thinking").  
    - Threatens (i): In the footbridge case, an agent who *foresees* the death but does not *intend* it as a means might claim permissibility.  
    - Fails Case B: If the agent could not foresee the buffer failure, death remains a side-effect. But (i) should forbid it if death is *in fact* a means.  

  ---

  ### **2. Moderate Tension: (i) vs. Loop Variant Verdict in (iii)**  
  **Conflict:**  
  - **(i)** states that harm "entering the action as that by which I achieve my end" is impermissible regardless of proportionality.  
  - **Loop Verdict (iii):** You hold diverting permissible even though the person on the loop *is* causally necessary to stop the trolley (i.e., their being crushed is the means to block the trolley). This *seems* to violate (i).  

  **Resolution:** **Clarify "means" with a distinction.**  
  - **Distinction:** *"Harm is a means only if it is *intended as a resource* to achieve the end, not if it is a *causal byproduct* of using something else as a resource."*  
    - In the loop, the agent uses the *track* (or the man’s *position*) as a blocking mechanism; the death is a foreseen side-effect of positioning.  
    - In footbridge, the agent uses the *man’s body* (via impact) as a direct tool.  
  - **Support:** Aligns with (v): The "agential direction" in the loop is toward diverting the trolley to a track with a blocker, not toward killing *as such*.  
  - **Costs:**  
    - Ambiguity in "resource" vs. "byproduct" may need further criteria (e.g., does "using the track" inherently imply using the person on it?).  
    - Must reject descriptions where the loop death is labeled a "means" (e.g., Thomson’s original view).  

  **Why not severe?** Your framework can absorb this with a causal nuance already implied in (v). Cases A/B are more disruptive.  

  ---

  ### **3. Minor Tensions: None Exist Elsewhere**  
  - **(i) and Transplant Surgeon (ii):** **No tension.** (i) alone forbids the transplant: The surgeon *uses* the patient’s death as the means to harvest organs (it "enters the action as that by which they achieve their end"). (ii) is redundant here but harmless.  
  - **(ii) and Footbridge (iii):** **No tension.** (ii) denies intrinsic doing/allowing difference, but (i) explains footbridge via the means/side-effect distinction. Pushing uses the death as a means; turning does not.  
  - **(v) and Verdicts:** **No tension.** Objective causal structure cleanly distinguishes:  
    - Turning: Death is side-effect (trolley redirected from five to one).  
    - Footbridge: Death is means (force applied to body to hit trolley).  
  - **(vi) and Principles:** **No tension.** Your method seeks principles to generate verdicts, and (i) does this for all except the loop (resolved above).  

  ---

  ### **The Root Problem in Cases A/B**  
  Your unresolved student cases expose the **iv/v clash**, not a hidden commitment. The "something you haven’t stated" is the *incompatibility* between evidence-relative and ontology-relative permissibility. Neither case can satisfy both (iv) and (v) simultaneously:  
  - **Case A** forces you to choose between *blamelessness* (iv) and *objective structure* (v).  
  - **Case B** forces you to choose between *reasonable risk-taking* (iv) and *prohibition on objective means* (v).  

  **Recommendation:** Prioritize (v) over (iv). It preserves (i)’s core moral distinction and your verdicts, even if it introduces moral luck. This is the cheapest fix. If you keep (iv), (i) and (v) collapse into subjectivism, gutting the doctrine’s objective foundation.  

  ---

  ### Summary of Revisions  
  | **Tension**       | **Severity** | **Cheapest Resolution**          | **Cost**                                  |  
  |-------------------|-------------|----------------------------------|------------------------------------------|  
  | (iv) vs. (v)      | Severe      | Drop (iv); adopt objective permissibility | Moral luck; blameless agents may act impermissibly |  
  | (i) vs. Loop Case | Moderate    | Refine "means" as intended resource | Need clearer causal criteria          |  
  | Others            | None        | N/A                              | N/A                                      |  

  Your framework is robust except for the evidence/ontology divide. Resolving that in favor of (v) aligns with your rejection of "mental states" in (v) and your doctrinal focus in (i). The student cases are invaluable: they show that (iv) is the outlier, not (i) or (v).
