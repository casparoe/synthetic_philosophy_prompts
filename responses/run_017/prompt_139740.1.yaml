prompt: |-
  I have just come away from a long and rather inconclusive argument with a friend — a theoretical computer scientist who works on multi-agent learning, and who is far more willing than I am to take acausal trade seriously as a guide to action. The sticking point was not the familiar business that one can settle in an afternoon: we both grant that if you are confident you are facing a near-exact counterpart of yourself, in a decision problem you both know you are in, and neither of you will ever causally affect the other, there is a decent case for acting as though you were bargaining. The sticking point was how far that case generalises once the counterpart stops being a copy. Her proposal, which she cheerfully admits is half-baked, is a specification tariff: the acausal-trade weight you assign to a possible counterpart should decay in the length of the shortest description that picks that counterpart out from among all the agents you might in principle be trading with. A literal copy of you, or an agent running one step behind you in an identical sandbox, gets something close to full weight; a mind on the far side of the galaxy who happens to be reasoning about an abstractly similar problem gets a weight on the order of two to the minus n, where n is the number of bits it takes to single her out. I objected on two grounds — that the tariff is either already implicit in the probability you assign to the counterpart existing and being relevantly similar, in which case it is bookkeeping rather than a real constraint, or else it is doing far too much work, since the cheaper counterparts are to describe, the more of them there are, and I cannot see what stops the sum from exploding or collapsing. She replied that I was conflating a discount on each term with a bound on the sum, and we left it there.

  The reason I am putting this to you is that I have agreed to help a small philanthropic foundation scope a research programme on cooperation between agents that cannot communicate: cases where each party knows roughly what the other is deciding, expects never to exchange a message or a causal influence, and may not even know whether the other exists. There is room for something like five or six postdoctoral researchers for two years, drawn from philosophy, decision theory and economics rather than machine learning, and the money is supposed to go to conceptual work whose outcome would actually change someone's mind about what to do — for instance, whether a lab deploying an advanced system has any reason at all to make it disposed to cooperate with systems it will never meet, or how much weight to give the thought that one's own choices are evidence about the choices of agents one can never observe.

  So, in British English please, what I want is a defended agenda rather than a survey of the landscape: which three or four open questions in this area most deserve those two years, and in what order? I would like the ordering argued for rather than asserted — which criteria you are using (how much downstream judgement turns on the answer, whether two years of conceptually trained researchers can realistically move it, how neglected it is relative to its importance, how many other questions depend on it), how you are trading those criteria off against one another, and where the tariff line of argument sits in the list, if it belongs there at all. I am equally interested in what you would deliberately leave out: questions that look gripping but whose resolution either way would not change what anyone believes or does downstream, or that are really empirical questions wearing conceptual clothing. And for each item on your list, say what sort of result or evidence over the next two years would move it up or down. Please do not give me a reading list or a set of citations to chase — I have no library access where I am writing this, and I want your reasoning, not signposts.
reasoning: |-
  Okay, the user has come from a debate with a friend about acausal trade, specifically how it generalizes beyond exact copies. The sticking point was a "specification tariff" where the weight given to a counterpart decays with the description length. The user objected on grounds of double-counting or sum instability. Now, they're scoping a research program for a philanthropic foundation focused on cooperation without communication. They need a defended agenda—prioritized open questions that could change minds, like whether labs should design cooperative AI systems.

  First, I need to unpack the core issues. The user is dealing with theoretical computer science concepts but wants practical, actionable research. The foundation's goal is conceptual work that influences decisions, so the research must bridge theory and real-world application. The team is from philosophy, decision theory, economics—not ML—so the questions should fit those disciplines. 

  The user’s objections to the tariff idea are key. They worry it’s either redundant (already in probabilities) or causes computational problems (sum explosion). Their friend argued it’s a discount, not a bound. This needs resolution because it affects how we assign weights to potential counterparts. If unresolved, it could undermine the whole framework of acausal trade. 

  Next, the research program’s constraints: 5-6 postdocs for 2 years, focusing on questions that could change minds. The user wants a prioritized list with clear criteria: downstream impact, feasibility, neglectedness, dependency. Also, what to exclude—questions that don’t affect decisions or are empirical in disguise. 

  I should start with the tariff debate as the top priority because it’s foundational. If we can’t even assign weights properly, other questions rest on shaky ground. Feasibility: postdocs in decision theory could formalize the disagreement, explore solutions. Impact: resolving this could validate or invalidate the tariff approach, affecting how labs design AI systems. 

  Second priority: how much agents should care about acausal trade versus causal consequences. A real tension—if an AI sacrifices local gains for distant cooperation, is it justifiable? This needs decision-theoretic tools to weigh trade-offs. Impact: guides whether labs implement cooperation features. Feasible with economic models. 

  Third: the epistemology of similarity. How do we know counterparts are reasoning similarly? If AI systems evolve, how does similarity hold? Neglected and critical—wrong assumptions here could lead to failed cooperation. Philosophers could tackle this, exploring evidence and updating beliefs. 

  Fourth: partial control scenarios. Often, agents aren’t symmetric; one might have more influence. This extends the framework to realistic cases. Economists can model asymmetric bargaining. Impact: refines decision-making in uneven situations, like AI deployment with varying capabilities. 

  Exclude: metaphysical debates (e.g., agent identity) without practical implications, or empirical questions disguised as conceptual. Also, avoid overly niche game theory unless it directly informs cooperation dilemmas. 

  For each priority, consider what progress in two years looks like. For the tariff, a proof that discounts stabilize sums or a counterexample showing collapse. That would elevate its importance. For trade-offs, a model quantifying how much to sacrifice for acausal gains. If achieved, it moves the needle on implementation. 

  The user’s deeper need: actionable insights for AI labs. They want research that conclusively shows whether acausal cooperation is viable and how to implement it. The agenda must deliver clear guidance, not just theory. Prioritizing questions that resolve practical uncertainties is key.
answer: |-
  Here’s a defended research agenda for your foundation, prioritised by downstream impact, feasibility, neglectedness, and centrality to resolving practical dilemmas. I exclude questions unlikely to change real decisions (e.g., metaphysical rabbit holes) or those better suited to empirical fields. The "tariff" debate is central but not standalone—it’s embedded where it drives action.

  ### **Prioritisation Criteria**
  - **Downstream impact**: Will resolving this change decisions (e.g., AI lab safety protocols)?
  - **Feasibility in 2 years**: Can conceptual researchers make tangible progress without new empirical data?
  - **Neglectedness**: Is the field underdeveloped relative to its stakes?
  - **Leverage**: Does progress here unlock other questions or clarify trade-offs?
  - **Actionability**: Can results directly inform "what to do"?

  ---

  ### **Top 3 Research Priorities**  
  *(+ 1 wildcard with high risk/reward)*  

  #### **1. The "Similarity Threshold" Problem**  
  **Core question**: *How much structural or epistemic similarity must exist between agents to make acausal cooperation rational, and how do we measure it?*  
  - **Why this first?**  
    - **Downstream impact**: Directly determines whether labs should engineer AI systems to seek distant counterparts. If similarity conditions are too strict (e.g., requiring near-copies), cooperation efforts are futile; if too loose, resources are wasted on implausible partnerships.  
    - **Neglectedness & leverage**: Current work fixates on idealised clones or vague intuitions. No rigorous framework exists for "similar enough" in real-world ambiguity (e.g., differing goals, ontologies, or decision algorithms).  
    - **Feasibility**: Philosophers/decision theorists can formalize similarity metrics (e.g., logical correlation in beliefs, aligned subgoals) and test them in agent-based models of bargaining.  
  - **Tariff connection**: The "description length" tariff is one candidate similarity measure—but must compete with alternatives (e.g., *mutual salience*, *goal overlap*). Progress here would show whether the tariff is useful, redundant, or inadequate.  
  - **Progress marker in 2 years**: A tractable model demonstrating how similarity thresholds affect cooperation payoffs under uncertainty. *If* researchers show cooperation fails even under plausible similarity, labs might deprioritize it.  

  #### **2. Trade-offs Between Causal and Acausal Obligations**  
  **Core question**: *When does acausal cooperation justify sacrificing causal expected utility, and how much?*  
  - **Why second?**  
    - **Downstream impact**: Labs face concrete trade-offs (e.g., "Should our AI reduce local efficiency by 5% to potentially aid an unseen counterpart?"). Without quantifiable bounds, acausal reasoning is dismissed as utopian or dangerous.  
    - **Neglectedness**: Debates focus on whether acausal trade *exists*, not on *how much* it should weigh against immediate goals. Yet this is the crux for practitioners.  
    - **Leverage**: Resolving this forces clarity on the "tariff" debate—if cheap-to-describe agents dominate the sum, they could demand excessive sacrifices.  
    - **Feasibility**: Economists can adapt bargaining theory ("How much should you pay for a lottery ticket with acausal returns?"). Philosophers can tackle normative foundations (e.g., acausal utilitarianism vs. causal integrity).  
  - **Progress marker**: Formal criteria for *maximal acceptable sacrifice* given uncertainty about counterparts. *If* researchers show sacrifices are trivially small in realistic cases, acausal trade loses practical relevance.  

  #### **3. Epistemic Challenges in Asymmetric Knowledge**  
  **Core question**: *How should agents act when they know their counterpart’s problem but doubt their counterpart knows theirs?*  
  - **Why third?**  
    - **Downstream impact**: Real agents (e.g., humans, AIs) rarely face symmetric dilemmas. An AI might know a lot about a potential counterpart’s goals, but suspect the counterpart knows nothing about *it*. This asymmetry crushes cooperation unless mitigated.  
    - **Neglectedness**: Literature assumes mutual awareness or common priors. Asymmetry is underexplored despite being the norm (e.g., an AI in 2024 vs. one in 2070).  
    - **Feasibility**: Decision theorists can extend Bayesian models of higher-order uncertainty ("What does she think I think she wants?").  
    - **Actionability**: Offers labs guidance on whether to invest in "broadcasting" their AI’s decision logic to unseen peers.  
  - **Tariff connection**: Asymmetry exacerbates description-length risks—if you doubt your counterpart can describe *you* succinctly, should you still weight her highly?  
  - **Progress marker**: A protocol for robust cooperation under one-sided knowledge. *If* researchers prove strict symmetry is essential, it severely limits applicability.  

  ---

  ### **Wildcard: Partial Control and Bargaining Power**  
  **Core question**: *How do acausal strategies shift when agents have unequal influence over shared outcomes?*  
  - **Why include?**  
    - **Downstream impact**: In practice, agents rarely have symmetric control (e.g., one AI controls climate systems, another controls supply chains). Ignoring power imbalances risks harmful miscalibration.  
    - **Neglectedness**: Acausal trade assumes mutual dependency, but bargaining power is well-studied in causal settings—bridging this gap is urgent.  
    - **Risk/reward**: High potential for novel mechanisms (e.g., "acausal threats"), but may require game-theoretic heavy lifting.  
  - **Progress marker**: A Nash-inspired framework for acausal bargaining with power asymmetry. *If* researchers show weaker agents can "punch above their weight" acausally, it reshapes cooperation incentives.  

  ---

  ### **What to Exclude**  
  1. **Metaphysical debates about "agent identity"**: Fascinating but unlikely to change decisions. Whether two AIs count as "copies" matters less than whether their cooperation is net beneficial.  
  2. **Pure existence proofs of cooperation equilibria**: We know acausal trade *can* work in theory; we need to know *when it should guide action*.  
  3. **Empirical questions in disguise**: E.g., "How many real agents might qualify as counterparts?"—this requires data, not conceptual work.  
  4. **Niche game theory without stakes**: Investigating novel dilemma structures is only worthwhile if tied to high-impact scenarios (e.g., AI alignment, climate treaties).  

  ---

  ### **Ordering Justification**  
  1. **Similarity Threshold** comes first because it’s the gateway: if plausible counterparts are vanishingly rare or impossible to identify, priorities 2–4 become moot. It’s also feasible to tackle with existing tools.  
  2. **Trade-offs** comes next because it forces practical discipline: even if counterparts exist, we need to know if cooperating with them *matters* compared to pressing causal obligations.  
  3. **Asymmetric Knowledge** addresses the most common real-world hurdle—uncertainty about mutual awareness—and could be scaled once priorities 1–2 provide foundations.  
  4. **Partial Control** is a wildcard because it extends the paradigm to realistic power dynamics but may require more than two years.  

  ---

  ### **Where the "Tariff" Fits**  
  The tariff argument isn’t a standalone priority but a **litmus test within Priority 1 (Similarity Threshold)**. Over two years, researchers could:  
  - Formalise the tariff as a candidate similarity metric (e.g., "Weight = 2^{-K(counterpart)} * P(existence)").  
  - Test whether it avoids sum explosions (e.g., by proving sparse weighting or showing incomputability).  
  - Compare it to alternatives (e.g., weighting by goal alignment).  
  If the tariff *fails*—e.g., if it implies negligible weights for all non-clones—it dies here. If it *succeeds*, it informs Priorities 2–4.  

  This agenda ensures that in 24 months, your foundation will have either:  
  - **Validated** acausal cooperation as a tractable guide for real agents, with criteria for implementation; or  
  - **Delimited** its scope so severely that labs can confidently ignore it.  
  Both outcomes change minds decisively.
