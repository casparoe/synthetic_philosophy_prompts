answer: |-
  Here’s a committed framework for evaluating work-hour theories, prioritizing your demand for actionable criteria over academic references. I’ll organize your raw material into non-negotiable requirements, reject flawed assumptions, identify tensions, and resolve the currency question—marked where I speculate.

  ---

  ### **Non-Negotiable Requirements for a Viable Theory**  
  *(Derived from your observations)*  

  1. **Must resolve the "Non-Coercion Paradox"**  
     Karoshi cases prove consent can be illusory. If someone "voluntarily" works to death while resenting intervention, consent is broken. A theory must distinguish *authentic choice* (e.g., the workaholic thriving at 70hrs) from *socially coerced choice* (e.g., Japanese salarymen fearing stigma if they leave).  
     **→ Rejects theories relying solely on individual consent.**  

  2. **Must account for social externalities**  
     Your overtime sets norms for colleagues. A viable theory must condemn choices that are individually rational but collectively destructive (e.g., one person’s "voluntary" 60hr week pressuring teammates to match it).  
     **→ Rejects purely individualistic frameworks.**  

  3. **Must address hedonic adaptation to free time**  
     Free time *is* a skill that atrophies. A theory cannot naïvely maximize leisure hours (since unused freedom has low value) nor demand "productive" leisure (which smuggles work ethic back in).  
     **→ Requires measuring *capacity for meaningful freedom*, not hours.**  

  4. **Must reject manufactured guilt as evidence**  
     Feeling guilty when idle is a symptom of work ethic indoctrination—not proof work is inherently virtuous. A theory should treat this guilt as bias to correct, not data to honor.  
     **→ Rules out Protestant-derived moralism.**  

  ---

  ### **Flawed Assumptions to Discard**  
  *(Your "prejudices of one side")*  

  - **❌ "The workaholic must be accommodated unconditionally"**  
     If their 70hr week harms others (e.g., normalizes unsustainable hours), restricting them is legitimate. Individual freedom stops where social harm begins.  

  - **❌ "The 35-hour week is self-evidently right"**  
     It may be a tool for job-sharing (your point #7), not a moral ideal. Judging it requires asking: *Does it achieve its goal without undue cost?* Not whether it "maximizes freedom."  

  - **❌ "Karoshi is solely an extreme-hours problem"**  
     It’s also about *autonomy* and *purpose*. A call-center worker logging 40hrs under surveillance may break before a craftsman working 60hrs with agency.  

  ---

  ### **The Central Tension: Freedom vs. Social Good**  
  **Requirement clash:** Protecting authentic individual freedom (e.g., the happy workaholic) *vs.* preventing social harm (e.g., your overtime pressuring colleagues).  
  **Why it’s unresolvable:** Absolute freedom for some erodes freedom for others. You *must* sacrifice one ideal partially.  
  **My resolution:** Prioritize *freedom from domination*. Restrict choices that enable coercion (e.g., unlimited overtime), even if they’re "free" for some.  

  ---

  ### **The Currency Problem: What Should We Regulate?**  
  **Hours alone are inadequate.** Regulating them is like capping "liters of liquid" without distinguishing water from poison.  
  **What matters:**  
  - **Exhaustion:** Physical/mental depletion per hour.  
  - **Autonomy:** Control over tasks, pace, and purpose.  
  - **Social necessity:** Is this work sustaining others? (e.g., nurses).  
  **Solution:** Regulate *outputs*, not inputs:  
  - **Cap exhaustion** (via mandatory leave, rest breaks).  
  - **Guarantee autonomy** (e.g., right to disconnect after hours).  
  - **Carve out exceptions** for essential roles (e.g., village electrician), with compensation (extra pay, time off later).  

  **Why hours are still the lever:** Exhaustion/autonomy are hard to measure directly. Hours are a *proxy*—but only if paired with strong safeguards (e.g., France’s *droit à la déconnexion*).  

  ---

  ### **The Most Damaging Requirement: Hedonic Adaptation**  
  **Why it rules out popular theories:**  
  - **Raw libertarianism** fails: "Let people choose hours!" ignores that choices are warped by atrophy of leisure capacity.  
  - **Utilitarianism** fails: "Maximize well-being!" is undermined if people don’t know how to use free time.  
  - **Productivism** fails: "Work = dignity!" collapses when work is alienating (call centers) or lethal (karoshi).  

  **Only theories acknowledging *human adaptability* survive.**  

  ---

  ### **My Commitments**  
  1. **Karoshi trumps consent.** If someone is dying "voluntarily," intervene. Their consent is invalid.  
  2. **Social harm > workaholic freedom.** Cap hours when individual choices create coercive norms.  
  3. **Essential services justify compulsion.** A nurse *can* be required to work overtime during crises—but only with robust compensation.  
  4. **Regulate exhaustion, not hours.** A 35hr week is useless if workers are exhausted. Mandate rest, not just clocking out. *(Speculative but actionable)*  
  5. **Guilt is irrelevant.** Feeling bad when idle is noise—not data. Design policies assuming people *can* thrive with freedom, even if they initially don’t.  

  **Final Test for Any Theory:**  
  > *Does it prevent karoshi without imprisoning the fulfilled workaholic? Does it expand* real *freedom (capacity to use it), not just hours? Does it protect the essential worker without exploiting them?*  

  If not, discard it. You’re right to distrust abstract arguments—demand answers that fit the machinery of real lives.
