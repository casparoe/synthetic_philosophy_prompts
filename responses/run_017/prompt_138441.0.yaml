prompt: |-
  Hey — I co-host a small, loosely edited epistemology podcast, and next week's guest is a philosopher who defends what I've started calling counterfactual reductionism about testimonial warrant: the claim that a hearer's justification for believing what she's told doesn't require her to actually have positive reasons bearing on the speaker's reliability (not occurrent, not even stored in memory), but does require that she be in a position to produce such reasons if she were pressed — roughly, reasons about the speaker's competence and honesty in the relevant domain, plus the usual base-rate/track-record material. So the requirement is modal rather than occurrent.

  I want eight to ten questions that go past asking her to lay the view out. She handles the standard hard cases very smoothly by saying that's just a shift in the baseline of what the hearer could come up with, and I want a sequence that makes that move progressively harder to lean on, ending with something about what would actually count against the view. For each question I'd like the follow-up keyed to the answer she's most likely to give, plus a one-line note on why the question bites.

  Things I definitely want covered:

  How the could gets spelled out. Is it ability-on-reflection, ability-after-five-minutes, ability-with-help-from-others, ability-with-a-search-engine? If help from other people is allowed, the requirement looks like it stops being a condition on the individual hearer and becomes a distributed one — press on whether she's willing to swallow that, and then on whether a distributed version still counts as reductionism rather than as the anti-reductionist's default entitlement with extra bookkeeping.

  The squeeze. If the counterfactual condition is weak enough that nearly every competent adult satisfies it, the view predicts nothing and is hard to distinguish from the default/entitlement views she's arguing against; if it's demanding, it seems to over-generate skepticism about the ordinary epistemic division of labour (my dentist, my mechanic, the air-traffic controller). Her likely move is to tighten the ability so that it has to be exercisable without special assistance — so I want the follow-up to target that specific tightening.

  The novice cases, where I expect her to say that kids and first-language learners do have crude evidence (caregiver track records, sincerity cues, the fact that adults mostly get things right). The follow-up should press on whether evidence that crude could possibly underwrite the *content* the kid acquires — that invisible organisms cause disease, that the earth is very old, that words mean what they mean — rather than merely underwriting the bare claim that this speaker is worth listening to.

  The case that looks like free money for her, and I want it asked so it doesn't stay free: outputs of systems that aren't speakers. A translation app, an automated weather readout, a chatbot, an aggregated database. No one is offering assurance, no one is taking responsibility for what's said, nothing you could trust in the interpersonal sense — but there is a reliability profile the hearer could in principle sample. Reductionism seems to glide over these while trust-based and assurance-based default views have to say something awkward. Ask it, let her have the point, then follow up: does her view end up saying that warrant from a well-calibrated machine is in *better* shape than warrant from a colleague's assertion, and is the difference between the two merely pragmatic? And then: what if the system's reliability is genuinely opaque to the user — proprietary, black-box, something no amount of querying would let her estimate? Does the could-marshal condition fail there, and is that the result she wants?

  Content-based versus speaker-based reasons. Her requirement is naturally read as reasons about the speaker. But suppose the only thing the hearer could produce if pressed is a reason about the content — it fits her other beliefs, it's the sort of thing that would be widely reported if false. If that's enough, the view has quietly stopped being reductionism. I want the question, and I want the follow-up to her almost certain answer that speaker-reasons can be partly generic.

  One question on whether the whole debate has gone verbal on us: reductionism as a thesis about where warrant *comes from* (testimony transmitting rather than generating it) versus as a norm for how hearers ought to manage their beliefs. If it's only the metaphysical thesis, what's the cash value — does it leave us with anything to say to a student who believes everything she reads?

  And please, no questions of the form so how does your view relate to Hume's: she gets that every single time and it derails into twenty minutes of exegesis. Nothing that requires her to summarize literature or name who argued what either — I want everything keyed to the actual machinery of the position, not to who is on which side of the debate.
reasoning: |-
  Okay, the user is co-hosting an epistemology podcast and needs sharp questions for a guest defending counterfactual reductionism about testimonial warrant. The guest's view is that a hearer doesn't need actual reasons for trusting a speaker but must be able to produce them if pressed. The user wants questions that challenge this view effectively, moving beyond basic explanations and targeting specific weaknesses. 

  First, I need to understand the core tension in the guest's position. The "could produce reasons" requirement seems flexible—too weak and it becomes indistinguishable from anti-reductionism; too strong and it leads to skepticism. The user mentioned three key pain points: how "could" is defined, novice cases, and non-human sources like apps. 

  For the "could" question, I'll attack ambiguity. If "could" includes internet access, does that make warrant distributed? If not, why draw the line at "unaided"? The follow-up should force her to choose between over-permissiveness or impracticality. 

  Novice cases are tricky. Kids likely use crude cues (caregiver trust), but can those support complex content? I'll frame this as a gap between minimal reasons and sophisticated beliefs. The follow-up should question whether "speaker reliability" is even relevant here. 

  Non-human sources are her strong suit—reductionism easily handles apps since reliability matters, not trust. But I'll pivot to comparing machine vs. human sources: is machine-based warrant *better*? And what about black-box systems? This exposes if her view values reliability over interpersonal elements. 

  The content-based reasons angle is sneaky. If a hearer cites content fit instead of speaker traits, does that collapse into anti-reductionism? Follow-up: are generic speaker facts (e.g., "experts exist") enough? This tests if "reductionism" is just lipstick on a pig. 

  Finally, the metaphysics vs. norms question. If her view is only about warrant origins, not belief management, what practical difference does it make? Follow-up: does her "could produce" rule help actual hearers? This questions real-world relevance. 

  User clearly knows the literature but wants to avoid name-dropping. Every question must target mechanics, not scholars. Also, no Hume—got it. The sequence should escalate: start with definitional issues, move to consequences, end with "what would falsify this?" 

  Biggest risk: guest might wiggle out by adjusting "could" for each case. Need follow-ups that lock her into a definition, then show inconsistencies. For example, if she says kids have "basic reasons," immediately ask how those scale to abstract concepts. No let-up. 

  Also noting user’s frustration with "free money" cases. Don’t let her coast on apps—push the machine-vs-human comparison hard. And the distributed cognition point could corner her: if my phone supplies reasons, is warrant communal? That’d blow up reductionism’s individualism. 

  Structure-wise, I’ll order questions from foundational (defining "could") to nail-in-the-coffin (falsification). Each with a velvet-glove follow-up: "You’ll likely say X... but what about Y?" User wants the guest to sweat, not rant. 

  ... Time to write. Eight questions, each with fangs.
answer: |-
  Here are eight tightly constructed questions targeting the core tensions in counterfactual reductionism, each with a predicted answer, surgical follow-up, and bite analysis:

  1.  **Question:** "Your view hinges on the hearer being *able* to produce reasons for the speaker's reliability *if pressed*. Can you specify the precise conditions under which this 'could' is evaluated? Is it ability with unlimited reflection time? Access to their own memory only? Or does it include consulting others, textbooks, or the internet?"
      *   **Predicted Answer:** She'll likely tighten it to "unaided ability" – what the hearer can recall/reason out themselves without external tools/inquiry.
      *   **Follow-Up:** "If 'unaided ability' is required, doesn't this immediately exclude warrant for most specialized knowledge? I genuinely couldn't produce unaided reasons for my dentist's specific filling technique, my auto-mechanic's transmission diagnosis, or the air-traffic controller's specific instruction. Does your view imply I'm unwarranted in believing them?"
      *   **Bite:** Forces a choice between vacuity (if "could" is too weak) or skepticism about essential testimony (if "could" is too strong/unaided).

  2.  **Question:** "Building on the 'unaided ability' point: You argue this distinguishes you from anti-reductionist entitlement views. But if the 'ability' is so minimal that it's possessed by nearly every competent adult *simply in virtue of being a competent adult* (e.g., basic grasp of sincerity cues, understanding that people *generally* don't lie constantly), how does your condition add anything substantive beyond the anti-reductionist's default entitlement? Isn't it just entitlement with extra, trivial steps?"
      *   **Predicted Answer:** She'll insist the ability isn't trivial – it requires domain-specific potential reasons, even if generic (e.g., "dentists are trained," "mechanics need good reputations").
      *   **Follow-Up:** "But are these generic reasons *about the specific speaker* sufficient? If all I can muster is 'Well, she *is* a dentist, and dentists *are* usually competent,' doesn't this collapse into a form of default warrant *based on the speaker type*, precisely what anti-reductionists offer? Where's the genuinely *reductionist* element – the tracing back to *my* positive reasons for *this* speaker?"
      *   **Bite:** Presses the "squeeze": Weak ability risks collapsing into anti-reductionism; strong ability risks skepticism. Highlights the thinness of "generic speaker-type" reasons as reductionist fuel.

  3.  **Question:** "Let's take the novice case seriously. You suggest a child learning language or complex facts has crude evidence: caregiver track records, sincerity cues. Granting that, how do these crude cues – perceivable by the child – *underwrite the specific, complex content* of the testimony? For instance, how does 'Mommy usually tells the truth' or 'Mommy looks sincere' provide justification specifically for believing *that germs cause disease* or *that 'dog' refers to that animal*, rather than just the generic claim *that Mommy is worth listening to right now*?"
      *   **Predicted Answer:** She'll argue the justification transfers: Warrant for the speaker's reliability transmits warrant to the content.
      *   **Follow-Up:** "But the reductionist credo is that testimonial warrant *reduces* to non-testimonial warrant. If the child's *only* non-testimonial warrant is for the speaker's *general* reliability (based on crude cues), and the warrant for the *specific content itself* comes purely via transmission from that general warrant, haven't you conceded the core anti-reductionist point? The specific content warrant *originates* in the testimony and the speaker relation, not in the child's independent non-testimonial resources for *that content*."
      *   **Bite:** Challenges whether crude speaker-reliability reasons can genuinely *reduce* warrant for complex content; suggests transmission does the heavy lifting, undermining reductionism.

  4.  **Question:** "Your view seems to handle outputs from non-agential systems beautifully: Translation apps, weather readouts. No interpersonal trust needed, just potential access to reliability data. Does this imply that warrant from a meticulously calibrated, highly reliable translation app is actually in *better* epistemic shape than warrant from a trusted colleague's assertion, since the machine's reliability might be more objectively assessable?"
      *   **Predicted Answer:** She'll likely say "Yes, potentially," emphasizing the reliability basis.
      *   **Follow-Up:** "If that's the case, does your view then say the *only* relevant difference between machine testimony and human testimony is pragmatic (e.g., accountability, social norms), not genuinely epistemic? And what if the system is a proprietary black box – its reliability genuinely opaque to the user, no amount of querying *they* could do would yield an estimate? Does the 'could marshal reasons' condition fail here, meaning I'm unwarranted in believing the black-box weather report? Is that the intuitive result?"
      *   **Bite:** Tests if the view (1) flattens the epistemic difference between human/machine sources (pragmatics only) and (2) forces skepticism about useful but opaque systems.

  5.  **Question:** "The requirement is for reasons bearing on the *speaker's* reliability (competence, honesty). But suppose if pressed, all a hearer could muster are reasons *about the content itself*: 'It coheres perfectly with my existing beliefs,' or 'If this were false, I'd likely have heard about it by now.' If such content-based reasons satisfy your counterfactual condition, hasn't your view quietly morphed into an anti-reductionist one, where coherence or negative evidence provides the warrant?"
      *   **Predicted Answer:** She'll insist speaker-based reasons are required, but they can be indirect or generic ("People wouldn't say this if it were blatantly false").
      *   **Follow-Up:** "How is 'People wouldn't say this if false' meaningfully different from a default entitlement *to assume speakers are reliable unless counter-evided*? And if 'People wouldn't say this' counts as a speaker-reason, isn't this just smuggling in the very kind of default warrant you aim to replace with reductionist grounds?"
      *   **Bite:** Guards against the view collapsing by accepting content-based or overly generic "speaker" reasons as sufficient reductionist grounds.

  6.  **Question:** "Could-marshal implies the hearer *has* the relevant reasons stored or inferable. But what constitutes 'having' them? If the reasons are buried so deep in memory that retrieving them requires extensive, non-trivial effort or therapy, or if they exist only as subconscious patterns influencing intuition, do they still satisfy the condition? Where do you draw the line between 'possessing but not accessing' and 'not possessing'?"
      *   **Predicted Answer:** She'll likely appeal to "available on reasonable reflection" without external aid.
      *   **Follow-Up:** "Doesn't 'reasonable reflection' introduce significant vagueness? And crucially, if the reasons are subconscious patterns (e.g., sensitivity to micro-expressions learned over a lifetime), does this mean the hearer *can* marshal them only if they can *articulate* them? Or is the mere existence of the reliable subconscious process enough? If articulation is required, that seems too strong; if not, how is this different from an unreduced faculty of trust?"
      *   **Bite:** Presses on the metaphysics of "possession" and the role of articulation, potentially revealing tension between internalism and the reality of tacit knowledge.

  7.  **Question:** "Is counterfactual reductionism primarily a thesis about the *metaphysical source* of testimonial warrant (it reduces to non-testimonial warrant), or is it a *norm* for how hearers should manage their testimonial beliefs (they should be able to cite supporting reasons)?"
      *   **Predicted Answer:** She'll likely say it's both, or emphasize the metaphysical reduction.
      *   **Follow-Up:** "If it's primarily metaphysical, what practical guidance does it offer? Faced with a student who believes everything they read, can we only say 'Your warrant is actually reducible to non-testimonial reasons you could in principle access'? Doesn't that lack critical force compared to a norm like 'You *ought* to have checked some reasons'? Conversely, if it *is* a norm demanding the *ability* to produce reasons, how does that norm connect to the actual *possession* of warrant metaphysically? Could someone satisfy the norm (be able to produce reasons) yet lack warrant, or vice-versa?"
      *   **Bite:** Forces clarification on the view's purpose and exposes potential gaps between metaphysics and epistemic norms/practices.

  8.  **Question:** "Finally, looking for potential falsifiers: What kind of scenario *would* genuinely challenge your view? Imagine a hearer who acquires a true belief via testimony, where we all agree they are warranted, but it seems utterly implausible that they *could* marshal positive reasons for the speaker's reliability – even generic ones, even subconsciously, even after reflection – perhaps due to cognitive limitations, the unique context, or the nature of the testimony itself. What features would such a case need to have to convince you counterfactual reductionism fails?"
      *   **Predicted Answer:** She might resist, suggesting some generic ability always exists, or redefine "could" dynamically.
      *   **Follow-Up:** "If *no* conceivable case of intuitively warranted testimony *without* this counterfactual ability seems possible to you, doesn't that suggest the condition is being stretched so thin it's unfalsifiable? Or, if you *would* accept such a case as a counterexample, can you sketch its contours? This helps us see the boundaries of your commitment."
      *   **Bite:** Directly probes the view's testability and forces acknowledgment of its limits or potential ad-hoc defenses.

  **Sequencing Logic:** Starts with the core ambiguity of "could" (Q1), immediately applies pressure to the likely "unaided" answer (Q1 FU), then highlights the vacuity risk (Q2). Moves to challenging applications: novices (Q3), non-agents (Q4). Targets potential collapse points (Q5) and metaphysical/normative ambiguities (Q7). Q6 tackles the nature of "possession." Ends by demanding falsifiability (Q8), preventing the view from being immunized by constant adjustment. Each follow-up anticipates her most probable defense and pushes the implication further.
