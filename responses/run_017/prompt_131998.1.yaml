prompt: |-
  I'm teaching an upper-level metaphysics seminar — 14 students, one 75-minute session — on the unity of the proposition, and I want them to feel the pull of the Bradley regress rather than have me sketch it on the board.

  Design me a runable activity (a game with rules and something small at stake, or a staged construction task) where participants have to make something that is genuinely *one* thing out of several parts using only operations that hook two things together at a time, and then discover for themselves that every act of combining seems to need its own further act of combining. One wrinkle I'd like built in: give them a second variant where the whole infinite hierarchy is just handed to them complete, rather than assembled step by step, so the group has to argue about whether the regress is actually vicious or just an infinite structure that's fine if you're allowed to have it all at once. Ideally the point shows up in what they're trying to do, not in what I say, and they don't hear the name "Bradley" until afterwards.

  Rules, materials, timeline, roughly what I say at each stage, a debrief that maps the moments where they got stuck onto the parts of the argument, what will predictably go wrong the first time I run it, and be honest about which feature of the problem the exercise can't stage and I'll just have to explain myself.
