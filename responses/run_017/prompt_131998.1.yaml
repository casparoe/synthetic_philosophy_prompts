  ### Activity: **The Unity Builder**  
  **Objective:** Experience the Bradley regress firsthand by attempting to create a single unified object from multiple parts using only binary connections. Then, debate whether a pre-fabricated infinite structure resolves the regress.  

  **Materials:**  
  - **36 LEGO bricks** (12 red, 12 blue, 12 yellow).  
  - **Sticky notes** (for labeling "bonds").  
  - **Timer**.  
  - **Whiteboard** to sketch the infinite structure.  
  - **Prizes**: Small stakes (e.g., candy, extra credit points) for the first team to achieve unity or win the debate.  

  **Setup:**  
  - Divide 14 students into 4 teams (3-4 per team).  
  - Give each team:  
    - 3 LEGO bricks (1 red, 1 blue, 1 yellow = "atoms").  
    - 10 sticky notes ("bonds").  
    - Instructions (below).  

  **Timeline (75 min):**  
  1. **Introduction (5 min)**  
  2. **Part 1: Finite Construction (25 min)**  
  3. **Part 2: Infinite Structure (20 min)**  
  4. **Debate & Discussion (15 min)**  
  5. **Debrief (10 min)**  

  ---

  ### **Step-by-Step Instructions**  
  #### **0. Introduction (5 min)**  
  *Say:*  
  > *"Your goal is to unify these three LEGO bricks into a single object—one thing, not just a pile. Rules:  
  > 1. You may only connect **two** things at a time.  
  > 2. Every connection **requires a bond** (sticky note labeled with a number).  
  > 3. The final structure must be **physically unified** (lift it by one brick without anything falling).  
  > 4. You have 15 minutes. First team to succeed wins a prize."*  

  *Do not mention metaphysics, unity, or regress yet.*  

  ---

  #### **1. Part 1: Finite Construction (25 min)**  
  - **Activity (15 min):** Teams build. Circulate and enforce rules:  
    - If they connect brick A to brick B, they **must** add a sticky note (e.g., "Bond 1") between them.  
    - If they connect Bond 1 to brick C, they **must** add *another* bond (e.g., "Bond 2") between Bond 1 and C.  
  - **Predictable Issues:**  
    - Teams try to glue all bricks at once (violates Rule 1).  
    - Bonds are placed haphazardly (e.g., Bond 1 taped to A and B but not "connected" to them via a new bond).  
    - A team "finishes" but the structure falls apart when lifted.  
  - **Intervention (10 min):** Stop and ask:  
    > *"Lift your structure by one brick. Did anything detach? If Bond 1 connects A and B, is it *part* of the whole? How is Bond 1 connected to A? To B?"*  
    > *"Add bonds to secure those connections. Keep going until it’s truly one."*  

  *Most teams will generate a growing web of bonds but never achieve unity. Call time.*  

  ---

  #### **2. Part 2: Infinite Structure (20 min)**  
  *Say:*  
  > *"Now, imagine I give you a completed structure with infinite bonds. It looks like this:"*  

  - **Sketch on the whiteboard:**  
    ```  
    Atoms: A, B, C  
    Level 1: Bonds 1-3 connect A-B, B-C, C-A.  
    Level 2: Bonds 4-6 connect Bond1-Bond2, Bond2-Bond3, Bond3-Bond1.  
    Level 3: Bonds 7-9 connect Bond4-Bond5, Bond5-Bond6, Bond6-Bond4.  
    ... (draw arrows descending infinitely)  
    ```  
  > *"This structure exists *all at once*. Is it one unified object? Discuss in teams for 10 minutes and prepare to argue:  
  > - **Team 1 & 2:** Argue **YES** (it solves the regress).  
  > - **Team 3 & 4:** Argue **NO** (the regress still fails).  
  > Winning team gets a prize."*  

  - **Predictable Arguments:**  
    - **YES:** "Unity is achieved by the *entire system*—no missing connections."  
    - **NO:** "Every bond still needs its own connection. Infinity doesn’t fix the dependence."  

  ---

  #### **3. Debate & Discussion (15 min)**  
  - Teams present cases (2 min each).  
  - Moderate: Push them to respond to:  
    > *"If you lift Atom A, does the *entire* infinite structure lift with it? Or is there always ‘one more bond’ needed to secure it?"*  

  ---

  #### **4. Debrief: Mapping to Bradley (10 min)**  
  *Finally, reveal the philosophy:*  
  > *"You encountered the **Bradley regress**. When we try to unify parts (e.g., a subject and predicate in a proposition) with relations (bonds), every relation *itself* needs a relation to connect it, ad infinitum. Today’s takeaways:"*  

  | **Activity Moment**               | **Bradley Regress Analogy**                                                                 |  
  |-----------------------------------|---------------------------------------------------------------------------------------------|  
  | Sticky notes multiplying          | Relations (bonds) become new entities needing further relations.                            |  
  | "Finished" structure falling apart | Without a "top" bond, unity is deferred infinitely (vicious regress).                       |  
  | Debate about infinite structure   | Bradley’s claim: Even with an infinite chain, there’s no *intrinsic* unity—just dependence. |  

  > *"What the exercise *can’t* stage: Propositions feel unified without physical bonds. Bradley’s point is that relations *themselves* can’t explain this. We need a non-relational unity (e.g., a "fundamental tie")."*  

  ---

  ### **What Will Go Wrong (And How to Adapt):**  
  - **Teams "cheat" by ignoring bonds:**  
    - *Intervention:* Physically separate structures that lack bonds between bonds. Ask: *"Is Bond 1 part of the whole? Show me how it’s connected."*  
  - **Part 2 debate stalls:**  
    - *Spark conflict:* "Team 1, if infinity solves this, why did your finite construction fail? Team 4, is infinity just a ‘trick’?"  
  - **Abstract leap is jarring:**  
    - *Scaffold:* Post-activity, contrast LEGOs with a sentence ("The apple is red"). Ask: *"What ‘bonds’ the subject to the predicate? Is there a sticky note?"*  

  ### **Why This Works:**  
  - **Tactile frustration** in Part 1 mirrors the regress’s inevitability.  
  - **Part 2’s debate** forces engagement with infinity as a solution.  
  - **Bradley’s name is withheld** until debrief—students discover the problem through action.  

  By the end, they’ll feel the regress in their fingers and defend positions with visceral frustration. The candy stakes keep it light but urgent.
