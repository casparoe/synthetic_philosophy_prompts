prompt: |-
  You are a moral philosopher who has taught undergraduate ethics many times and knows the ways discussion sessions go wrong. Before you write anything, think through the session design: sketch two or three orderings of the material you considered, give one sentence each on why you rejected them, and then give me the plan you would actually run.

  The setting: I lead a weekly seventy-five-minute discussion for a campus effective altruism society. The members arrive already convinced that they should do as much impartial good as they can with their careers and money; several have pledged a large share of future income, and they have met the worry that morality asks too much and dismissed it as an excuse for self-indulgence. Next week I want them to feel the force of a different worry: that a life wholly devoted to impartially promoting the good of others would leave no room for non-moral excellences — the kind of achievement, playfulness, or love of particular people and projects that Susan Wolf's "Moral Saints" made central — and that moral sainthood is therefore not an ideal of a well-lived life, even granting that it would be morally permitted or required. I want them to see this as a claim about what kind of life is worth wanting, not as a licence to donate less.

  So plan the session, not the doctrine. What has to be in place before the worry can even be stated, and why does it have to come first? Which single case or figure should carry the whole hour, what must it have and lack, and why do the obvious candidates fail — the burnt-out aid worker, the joyless do-gooder, the person who never learned to have fun? Then give me the misconceptions in the order they will actually surface — I expect "so you're saying be selfish," "that's just burnout with a philosophical name," and "saints can play the cello too" — and the point in the sequence at which you would head off each. I also know I will get two specific pushbacks: that sainthood can be domain-limited (be a saint about one cause, appealing to a division of moral labour, and keep a rich personal life otherwise), and that the cost Wolf identifies is only that saints are boring, which my members will happily pay. Say where in the hour each of those belongs and how the sequence up to that point should absorb it. Close with one question that would show me whether they have understood the objection rather than merely been reassured, and with what you would openly refuse to settle in seventy-five minutes.

  Finally, tell me where your plan is most likely to misfire: which step you are least confident will land, and what a student intervention would have to look like for you to reorder the session.
reasoning: |-
  Okay, the user is leading a discussion for an Effective Altruism society. They want the group to consider Susan Wolf's critique that a life entirely devoted to impartial good might lack non-moral excellences. The members are already committed to doing maximum good, so this is challenging. I need to design a session plan that presents this worry effectively without undermining their moral commitments.

  The user outlined specific requirements: avoiding common misconceptions, handling pushbacks like domain-limited sainthood and boringness, and ending with a diagnostic question. They also want to know where the plan might fail. My initial thoughts on session structure:

  Option 1: Start with burnout cases. But rejected because burnout can be fixed with self-care, missing Wolf's deeper point about missing non-moral values.  
  Option 2: Begin with Wolf's essay. Too abstract; needs concrete grounding.  
  Option 3: Use a relatable figure like a joyless do-gooder. Risk of seeming like a burnout case.  

  Best approach: Create a composite character—a high-impact EA who lacks personal passions. This makes the issue about structural exclusion of non-moral goods, not just burnout.  

  Session flow:  
  1. Establish shared ground: EA commitment to impartial good.  
  2. Introduce the composite character. Use specific details to show their life is morally excellent but lacks personal projects.  
  3. Pose Wolf's question: Is this the best kind of life?  
  4. Address misconceptions as they arise:  
     - "So you're saying be selfish?" Link to the character's life to show it's about richness, not selfishness.  
     - "That's just burnout." Contrast with the character's stamina to show it's about missing values, not exhaustion.  
     - "Saints can play cello too." Discuss if the cello is valued instrumentally, missing intrinsic worth.  
  5. Handle pushbacks:  
     - Domain-limited sainthood: Argue that partial retreat might still sideline personal projects.  
     - Boringness trade-off: Emphasize that Wolf's concern is about shallowness, not just being uninteresting.  
  6. End with a diagnostic question about reshaping life if impact were guaranteed.  
  7. Acknowledge unresolved tensions.  

  Where it might misfire: If students don't engage with the composite character as intended. Need contingencies for reordering if they bring up burnout early or challenge the character's plausibility.  

  Key is to keep the focus on whether a life without non-moral goods is desirable, not on reducing donations.
answer: |-
  Here's a carefully sequenced 75-minute discussion plan designed to make Wolf's objection *felt*, not just heard, while preempting predictable derailments. I've taught this tension to committed EAs before—your group's pre-commitment to impartiality means standard approaches bounce off. The structure below forces confrontation with the *existential cost*, not the practical one.

  ### Rejected Structures & Why
  1. **"Burnout → Wolf → Solutions"**: *Rejected* because it frames the problem as psychological (fixable with self-care), not philosophical (a structural exclusion of non-moral goods).  
  2. **"Abstract Wolf → Cases → EA Implications"**: *Rejected* because EAs will nod along to theory while assuming their lives already include "enough" non-moral value.  
  3. **"Counterexamples First (e.g., joyful saints)"**: *Rejected* because it lets students off the hook by treating sainthood as a personality flaw ("be happier!") rather than an ideal.  

  **The Winning Structure: "Concrete Life → Diagnosis → Implications"**  
  *Why*: You need visceral unease *before* analysis. Start with a life that’s *admirable* but unsettlingly hollow, forcing the question: "Would I *want* this?"  

  ---

  ### Session Plan: "The Unlived Life"  
  **Goal:** Make palpable Wolf's claim that **moral sainthood structurally excludes non-optional pursuits of non-moral excellence, making it a deficient ideal of human flourishing**—even if obligatory.  

  #### Part 1: Groundwork (10 mins)  
  - **Shared Premise:** "We all agree: impartial good *matters profoundly*, and we’re willing to sacrifice self-interest for it. Today’s question isn’t about *whether* to do good, but about what a *humanly rich life* looks like *while* doing good."  
  - **Why first?** Without reaffirming impartiality, they’ll assume this is a retreat from EA principles.  

  #### Part 2: The Carrier Case — "Taylor" (20 mins)  
  - **Who:** Taylor (composite figure), an EA in their 40s. Works 80 hrs/week at a top global poverty org. Donated 60% of income since age 22. Never married, no hobbies, no "frivolous" friendships. Healthy, not burned out—finds deep fulfillment in impact stats.  
  - **Crucial Details:**  
    - *Has*: Relentless moral commitment, measurable impact, integrity, stamina.  
    - *Lacks*: Any activity/relationship pursued *for its own sake* (e.g., no art, play, uncalculating love, mastery disconnected from utility).  
  - **Discussion Prompt:** "Describe Taylor’s life in one adjective. Would you *aspire* to this? Why/why not?"  
  - **Why Taylor (not burnt-out aid worker/joyless do-gooder)?**  
    - Burnout implies fixable dysfunction ("just rest more!").  
    - Joylessness suggests temperament, not structure ("be happier!").  
    - Taylor is *flourishing on moral terms*—forcing the question: "Is this enough for a *human* life?"  

  #### Part 3: Wolf’s Objection — Framing the Cost (15 mins)  
  - **Pivot from Taylor:** "Susan Wolf argues Taylor’s life isn’t just demanding—it’s *deficient* because it lacks non-moral excellences: activities/relationships valued for their own sake (beauty, play, intimate love). Not because they’re 'fun,' but because they *deepen* us."  
  - **Key Quote:** “A person may be *morally perfect* […] and yet it may be *unreasonable to want* to be like him.”  
  - **Reframe:** "This isn’t about donating less. It’s: Can a life *wholly* structured by impartiality be *worthy of aspiration*?"  

  #### Part 4: Misconceptions & Pushbacks — Preempted Sequence  
  *(Timestamps assume organic flow; intervene when these arise, but expect this order)*  

  1. **"So you’re saying be selfish?"** (Likely early, during Taylor discussion)  
     - **Response:** "Taylor *isn’t* selfish—they’re heroic. But does heroism *exhaust* what makes life worth living? Is a life without music, deep friendship, or pointless curiosity *impoverished*?"  
     - *Why here*: Distinguishes *selfishness* from *non-moral value* early.  

  2. **"That’s just burnout with a philosophical name!"** (During Wolf framing)  
     - **Response:** "Burnout is fatigue. Wolf’s concern holds even if Taylor feels great: is a life *constitutionally unable* to prioritize (e.g.) mastering chess *over* extra work hours *shallow*?"  
     - *Why here*: Post-Taylor, they see the person isn’t suffering—so the objection must be deeper.  

  3. **"Saints can play the cello too!"** (During Wolf discussion)  
     - **Response:** "Can they? If Taylor plays cello *only* to relax for work, or fundraises with it, is it still *play*? Wolf’s point: moral saints *instrumentalize* everything. The cello isn’t loved *for itself*."  
     - *Why here*: Forces examination of *motivation*.  

  4. **Pushback: Domain-limited sainthood** (Likely mid-Wolf)  
     - **Response:** "If you’re a ‘saint’ only in donations/work, but compartmentalize, Wolf asks: does that moral sphere *crowd out* non-moral pursuits? If your ‘personal’ life is just recharging for morality, is it truly *non-moral*?"  
     - *Why absorbed*: Taylor shows compartmentalization failing—their whole life is moralized.  

  5. **Pushback: "Boringness is a fair price!"** (Late Wolf/transition)  
     - **Response:** "Wolf isn’t calling saints *boring*—she’s saying their lives lack *depth*. Is a world where *no one* pursues science, art, or friendship for its own sake—only for impact—a *poorer* world, even if happier?"  
     - *Why absorbed*: Post-instrumentalization talk, "boring" is revealed as a misdiagnosis.  

  #### Part 5: The Diagnostic Question (5 mins)  
  - **To test understanding:** "If an AI guaranteed your donations would save 10,000 lives *regardless of your choices*, how would you *reshape your life*—and what does that reveal about what you value *beyond* impartial good?"  
  - *Why this*: Reveals whether they grasp non-moral goods as *intrinsically* valuable, not just instrumental.  

  #### Part 6: Open Refusal (5 mins)  
  - **Explicitly *unsettle*:** "We won’t resolve whether impartial morality *requires* sainthood even if it’s deficient, or how to balance these values. Sit with that tension."  
  - *Why*: Prevents premature closure; honors the complexity.  

  ---

  ### Where It Might Misfire & Contingencies  
  - **Weakest Link:** Part 2 (Taylor). If students dismiss Taylor as a strawman ("no real EA is like that!"), the tension deflates.  
  - **Intervention for Reordering:** If early comments fixate on burnout (e.g., "Taylor just needs therapy"), **skip Part 3 and run:**  
    1. Poll: "Who believes a *truly* sustainable EA life *must* include non-moral goods?" (Likely unanimous).  
    2. Then: "But *why*? If Taylor is productive and content, is this just self-care—or is something *human* missing?"  
    3. Jump to Wolf (Part 3) and refocus on *intrinsic value* vs. instrumentality.  

  This plan respects your group’s commitment while making Wolf’s challenge inescapable: a life that *only* values the moral good may be admirable, but it is not *fully* human—and that’s a loss beyond sacrifice.
