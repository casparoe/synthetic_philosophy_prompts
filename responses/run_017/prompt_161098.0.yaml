prompt: |-
  Doing a PhD in philosophy of physics, and theres a distinction I keep needing that I dont have a word for. Does the following have a name?

  Take conservation of energy. As far as I can tell nobody ever uses it to work out what a system does next — you use the dynamical law for that, and then use conservation to check the answer, or to rule out candidate models before you even start. It constrains the space of allowed histories rather than pushing any particular one along. Same flavour: Pauli exclusion, the uncertainty principle. They say what can't happen, not what does.

  Two things make me think it's a real category and not just a mood. First, these are the durable ones: the dynamics got replaced wholesale (mechanics → QM → QFT) while energy and momentum conservation sailed through, quantity redefined, constraint intact — even though the standard symmetry derivation puts them downstream of the dynamics. Downstream, yet more robust. (A friend in cosmology says GR doesn't even have global energy conservation, which seems to fit: the symmetry goes, the constraint goes with it.) Second, sometimes they're all we have: in parts of particle physics you know the constraints but can't solve the dynamics, so the constraints do real predictive work by elimination.

  I care because of the Humeanism vs anti-Humeanism debate about laws. On a best-system picture these look like theorems rather than axioms — so maybe they aren't laws at all? And what would "governing" amount to for a law that never pushes anything along? It's not the derived-vs-fundamental distinction (derived claims aren't usually more robust than what they're derived from), it's not the grue/accidental-generalisation thing, and it's not quite the structural realist point about mathematical structure surviving theory change — or is it?

  Dont just hand me a label. I want the nearest established concepts, how what I described differs from each, and where the edges are: is the second law of thermodynamics in this box or not? If nothing fits, coin something and define it with borderline cases.
reasoning: |-
  Okay, let me tackle this user's query. They're a PhD student in philosophy of physics, struggling to find a term for a specific distinction they've noticed. The core idea is about principles that constrain possible states or histories without dictating dynamics—like conservation laws, Pauli exclusion, or the uncertainty principle. These seem more robust through theory changes than dynamical laws.

  First, I need to unpack their examples. Conservation of energy acts as a boundary condition; it rules out certain scenarios but doesn't specify how a system evolves. The user points out that these constraints survive theory changes—Newtonian to QM to QFT—while dynamical laws get replaced. That's a key insight. They also mention cases like particle physics where constraints do predictive work when dynamics are unsolvable.

  The user's deeper interest ties into the Humeanism debate. If laws govern by pushing systems, what about these constraints? On a best-system account, they might look like theorems, not axioms. So, are they even laws? The user has already ruled out derived vs. fundamental and structural realism as not quite fitting.

  I recall terms like "constraint," "superprinciple," or "meta-law." But each has issues. "Constraint" is too broad; "superprinciple" is vague. Maybe "modal constraint" or "nomic boundary condition" could work. The Second Law of Thermodynamics is a test case—it's probabilistic and less strict, so maybe not fitting perfectly. Edge cases help define the category.

  The user needs precise distinctions. They want established concepts, differences, and borderline cases. Coining a term might be necessary. "Constraint-principle" versus "dynamical-law" could work, emphasizing their roles. The robustness through theory changes is crucial, linking to Poincaré’s dynamics vs. constraints. 

  Also, considering their identity as a PhD student, they need this for their thesis or papers. They’re likely building an argument in the laws of nature debate. Precision in terminology will strengthen their position. The proposed term should encapsulate the constraining function and durability. Highlighting examples and counterexamples like the Second Law clarifies the boundaries. Ensuring the term fits within philosophical frameworks like Humeanism is essential for their academic context.
answer: |-
  This is a fascinating and sharp observation that cuts across philosophy of physics, metaphysics of laws, and theory dynamics. You're absolutely right that this distinction is real, significant, and under-labeled. Let's break down the established concepts and see where yours fits (or doesn't), and then try to carve it out precisely.

  **Established Concepts & How Your Distinction Differs:**

  1.  **Constraint vs. Dynamical Law:**
      *   **Nearest Fit:** This is the *closest* common language. Constraints restrict the state space (configuration space, phase space, Hilbert space), while dynamical laws specify the evolution *within* that space.
      *   **How it Differs:** The common usage of "constraint" is often broader. It includes:
          *   *Holonomic Constraints* (e.g., rigid rod length): Directly restrict configurations.
          *   *Initial/Boundary Conditions*: Specific, non-general restrictions.
          *   *Anholonomic Constraints*: Restrict velocities.
          *   *Gauge Constraints* (e.g., Gauss's law in EM): Often derived within the dynamics itself.
      Your concept is a specific *type* of constraint: **fundamental, universal, empirically robust principles that act as global boundary conditions on the *entire history* or *possible states* of any physical system.** It excludes many specific or derived constraints.

  2.  **Conservation Law:**
      *   **Subset:** Conservation laws (energy, momentum, charge) are prime *examples* of your category.
      *   **How it Differs:** Your category is broader, including Pauli Exclusion (not strictly a conservation law) and the Uncertainty Principle (definitely not a conservation law). Conservation laws are a specific *mechanism* (via Noether) for achieving this type of constraint.

  3.  **Symmetry Principle:**
      *   **Source (Often):** As you note, the conservation laws often *derive* from symmetries via Noether's theorems. The symmetry itself (e.g., time translation invariance) might be seen as the deeper constraint.
      *   **How it Differs:** Not all members of your category are *obviously* direct symmetry principles (e.g., Pauli Exclusion is more about the *structure* of fermionic states, the Uncertainty Principle stems from non-commutativity). While symmetries often *generate* these constraints, the constraint itself is the *manifestation* or *consequence* in terms of forbidden states/histories. Your category focuses on the *manifest prohibition*, not necessarily the underlying symmetry reason.

  4.  **Superprinciple / Meta-Law:**
      *   **Vaguely Related:** Sometimes used for very broad principles thought to underlie or constrain possible physical theories (e.g., Principle of Relativity, Principle of Least Action).
      *   **How it Differs:** Your principles are *within* specific theories (though robust across changes) and have direct, testable empirical consequences for *system behavior* (ruling out histories/states), not just theory structure. They are more concrete and operational than typical "superprinciples."

  5.  **Boundary Condition (Global):**
      *   **Descriptive:** This captures the *function*: these principles set global conditions that any physically allowed history must satisfy.
      *   **How it Differs:** "Boundary condition" usually implies something specific and contingent (e.g., initial position), not a fundamental, universal law of nature. Your principles *are* fundamental laws acting *as* universal boundary conditions.

  6.  **Structural Realism (Ontic):**
      *   **Overlap in Robustness:** Your observation about their durability through theory change strongly resonates with the OSR claim that "structure" (relations, invariants) survives theory change, while the "nature" of entities changes.
      *   **How it Differs:** OSR is a broad metaphysical thesis about *what is real*. Your distinction is primarily *functional* and *epistemological*: *how* a law operates within a theory (constraining possibilities vs. generating evolution) and *how* it is used in practice (checking/eliminating vs. predicting step-by-step). The robustness is a *consequence* of their functional role as constraints on possibility space, rather than the defining feature. OSR might *explain* the robustness, but your category defines the functional type.

  7.  **Law vs. Accident / Humean Mosaic Feature:**
      *   **Relevance to Humeanism:** This is core to your philosophical concern. On a Humean Best System Account (BSA), the fundamental dynamical laws are prime candidates for axioms because they compress the mosaic by telling you how one state generates the next. Constraints like conservation laws *look* like they could be theorems derived from the dynamics + symmetries. Their robustness might suggest they capture a deeper structural feature of the mosaic itself.
      *   **How it Differs:** Your distinction highlights a *functional tension* within the BSA: principles that seem incredibly robust and central to physics practice (performing vital predictive/explanatory work by elimination) might look non-fundamental or derived within the axiomatic system. This directly challenges a simple reading of "governing" as solely "pushing along."

  8.  **Modal Constraint vs. Nomic Force:**
      *   **Philosophical Framing:** This gets to the heart of your "governing" question. Dynamical laws are often thought to supply "nomic force" or "oomph" that *makes* the future happen a certain way given the past. Constraints seem to act differently: they don't supply "force," they define the *arena of possibility* within which any force/dynamics must operate. They govern *what is possible*, not *what happens next* given the current state.
      *   **How it Differs:** This is more a *philosophical interpretation* of the functional distinction you've identified empirically.

  **Defining the Category & Coining a Term:**

  Based on your description, the core features are:

  1.  **Function:** Operates primarily by *ruling out* physically possible states or histories, rather than specifying the unique evolution from a given state.
  2.  **Scope:** Universal and fundamental within its domain (not contingent or specific).
  3.  **Robustness:** Tends to survive major theory changes, albeit with reinterpretation (e.g., redefinition of the conserved quantity).
  4.  **Epistemology:** Often used for *validation* (checking solutions/experiments) or *elimination* (ruling out models/processes) rather than step-by-step prediction.
  5.  **Relation to Dynamics:** Constrains the *space* within which dynamics operate; often derivable *from* dynamics + symmetries, yet empirically and conceptually more robust than the specific dynamics from which they were derived.

  **Proposed Terms & Definitions:**

  *   **Option 1: Constraint-Principle (CP) vs. Dynamical Law (DL)**
      *   **Definition:** A **Constraint-Principle (CP)** is a fundamental physical law that functions primarily by defining necessary conditions that any physically possible state or history must satisfy, thereby restricting the space of possible configurations or trajectories of a physical system. It is characterized by high robustness under theory change and is typically employed for validation or elimination rather than step-by-step prediction. Contrast with a **Dynamical Law (DL)**, which specifies how the state of a system evolves over time given its current state and interactions.
      *   **Advantages:** Clear, descriptive, directly contrasts with "dynamical law," commonly understood root ("constraint").
      *   **Disadvantages:** "Constraint" is already broad; needs the "Principle" modifier to indicate fundamentality/universality.

  *   **Option 2: Nomic Boundary Condition (NBC)**
      *   **Definition:** A **Nomic Boundary Condition (NBC)** is a fundamental law of nature that acts as a universal, global constraint on physically allowable system states or histories, effectively setting the boundary of the nomologically possible. It is distinguished by its durability across theory change and its primary role in ruling out possibilities rather than generating specific temporal evolution.
      *   **Advantages:** Captures the "global boundary" function vividly, emphasizes its status *as law* ("nomic").
      *   **Disadvantages:** Slightly more cumbersome, "boundary condition" often implies contingency.

  *   **Option 3: Modal Filter Law**
      *   **Definition:** A **Modal Filter Law** is a fundamental physical principle whose primary function is to filter the space of metaphysically or logically possible states/histories down to the nomologically possible ones, by specifying necessary conditions for physical realizability. Its predictive power arises from elimination, and it exhibits significant invariance under theoretical revision.
      *   **Advantages:** Strongly emphasizes the "ruling out possibilities" (filtering) and modal aspects.
      *   **Disadvantages:** More abstract, "filter" might not be standard physics language.

  **Recommendation:** **Constraint-Principle (CP)** strikes the best balance between clarity, descriptiveness, connection to existing physics terminology ("constraint"), and ease of use within philosophical discourse. Pairing it explicitly with **Dynamical Law (DL)** clarifies the distinction.

  **Borderline Cases & Edges:**

  *   **Second Law of Thermodynamics:**
      *   **Analysis:** This is a crucial test. It *constrains* possible histories (entropy doesn't decrease in isolated systems) and is remarkably robust/redescribable. However, it's fundamentally *statistical* and *probabilistic*. It doesn't *absolutely forbid* a decrease in entropy; it makes it *overwhelmingly improbable* in macroscopic systems. It also *emerges* from underlying DLs (statistical mechanics), rather than being a fundamental CP like energy conservation in classical mechanics or Pauli exclusion in QM.
      *   **Verdict:** **Borderline, leaning OUTSIDE the core category.** While it functions as a powerful constraint in practice, its statistical/probabilistic nature and emergent character differentiate it from the absolute prohibitions (energy conservation violation, fermions in identical states, violating ΔxΔp ≥ ħ/2) characteristic of core CPs. It's a *derived statistical constraint*, not a *fundamental prohibition*.

  *   **Gauge Constraints (e.g., Gauss's Law ∂·E = ρ/ε₀ in EM):**
      *   **Analysis:** These are constraints on the state space (e.g., only divergence-ful configurations are allowed). They are fundamental within the theory. However, in the standard formulation of gauge theories like EM, they are often *derived consequences* of the Lagrangian formulation/gauge symmetry *alongside* the dynamical equations (Maxwell's other equations). They are crucial for consistency but may not possess the same *independent* robustness as energy conservation.
      *   **Verdict:** **Borderline, likely INSIDE.** While deeply tied to the dynamics, they function as absolute constraints on possible states at any time and are fundamental features of the theory. Their robustness under quantization (QED) supports inclusion.

  *   **Principle of Least Action:**
      *   **Analysis:** It *constrains* the possible path a system takes between two points to be an extremum of the action. However, it is *equivalent* to the DLs (Euler-Lagrange equations) for the system. It doesn't rule out histories independently of specifying the single allowed path between states; it *is* the generator of the DL in that formalism.
      *   **Verdict:** **OUTSIDE.** It's a reformulation of the dynamics, not an independent constraint ruling out a class of histories that might otherwise be dynamically possible under some other law. It generates the unique path, rather than forbidding a swathe of possibilities.

  *   **Speed of Light Limit (Special Relativity):**
      *   **Analysis:** This forbids spacelike trajectories (faster-than-light travel/information transfer). It's a fundamental constraint derived from the spacetime structure (Lorentz invariance). It's highly robust.
      *   **Verdict:** **STRONG CANDIDATE for INSIDE.** It absolutely rules out a class of possible histories (FTL paths).

  **Implications for Humeanism:**

  Your distinction is *highly* relevant. On a BSA:

  1.  **The Axiom/Theorem Tension:** CPs like energy conservation seem too fundamental and useful to be mere theorems *within* a system where specific DLs are axioms. Yet, formally deriving them from the DLs + symmetries is often possible. This challenges the simplicity/elegance judgment: is the system simpler if the CP is an axiom, or if it's derived? Their robustness suggests they capture a deep feature of the mosaic.
  2.  **Governing Without "Pushing":** CPs govern by *shaping the arena*. They define what *cannot* happen, anywhere, ever. This is a form of governance – it's just not *temporal* governance. Humeans might argue this governance is still just a matter of descriptive systematization: the CPs are the best way to describe the *limitations* inherent in the global mosaic pattern. Anti-Humeans might see CPs as reflecting fundamental modal structures or powers that actively prohibit certain configurations.
  3.  **Robustness & Structure:** The durability of CPs strongly supports a structuralist perspective (OSR) *applied specifically to laws*. The *constraint structure* persists even as the specific *dynamical mechanisms* change. For Humeans, this suggests the constraints capture the most compressible, invariant features of the mosaic itself.

  **Conclusion:**

  You've identified a significant functional and metaphysical distinction: **Constraint-Principles (CPs)** vs. **Dynamical Laws (DLs)**. CPs are fundamental laws acting as universal prohibitions on states/histories, characterized by robustness and a primary role in validation/elimination. While "constraint" is an existing term, qualifying it as "Constraint-Principle" best captures the specific, fundamental nature of the category you've discerned. The Second Law is a borderline case (statistical, emergent), highlighting that the core examples involve absolute prohibitions. This distinction provides powerful leverage in the Humeanism debate, forcing consideration of how laws that govern by *forbidding* rather than *generating* fit into accounts based on systematization ("governing") and raises profound questions about the relationship between dynamical structure and modal constraints in physical theory. It's a genuinely insightful lens for analyzing the structure of physical theories.
