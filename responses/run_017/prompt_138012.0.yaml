  We are drafting a joint statement and disagreements table for a Bradleyan (B) and a structured-proposition theorist (SPT) after an adversarial collaboration on Bradley's regress and the unity of the proposition.

  **Joint Statement (numbered claims both can sign):**

  1. **The Target of the Regress:** The regress argument, as classically formulated, targets any complex that is supposed to be unified (i.e., not a mere list) and whose unity is explained by a constituent of that complex. This includes both propositions (as truth-bearers) and facts or states of affairs (as truth-makers). The argument does not, by itself, distinguish between these; if a fact is taken to be a complex of objects and properties/relations, then the same regress arises.

  2. **The Core Assumption:** The regress assumes that whatever unifies the complex must be an entity (a constituent) of the same logical type as the other constituents. That is, if the complex is built from objects and relations, then the unifier must itself be a relation (or an object) that can be listed alongside the others. This assumption is challenged by the structured-proposition theorist, who holds that unity is secured by something of a different logical type (e.g., an unsaturated concept, a combinatorial operation, or logical form) that is not a constituent in the same sense.

  3. **Relation to Other Regresses:** Bradley's regress is distinct from the regress of instantiation (where a particular instantiates a property, which requires a further instantiation relation, ad infinitum) and the regress of truthmaking (where a truthmaker for a proposition requires a further truthmaker for the correspondence, ad infinitum). However, all three regresses share a common structure: they arise when the explanation for a relational fact (instantiation, truthmaking, or unity) is sought within the same ontological category as the relata, leading to an infinite chain. The Bradleyan sees all these as instances of the same underlying problem, while the structured-proposition theorist may hold that the unity regress is more fundamental and that their solution for unity (e.g., via logical form) may block the others.

  4. **The Role of the Regress:** Both sides agree that the regress is a challenge that must be addressed. The Bradleyan holds that the regress is sound and shows that no complex can be unified by a constituent, leading to the rejection of structured complexes (or to a monistic alternative). The structured-proposition theorist holds that the regress is either blocked by the nature of the unifier (which is not a further entity) or is benign (e.g., because the regress is recursive and does not require completion for the original complex to be unified).

  5. **Verbal Disagreement:** Part of the dispute may be verbal. The term "unity" is used in two senses: 
     - (a) Whatever makes the constituents combined rather than merely listed (the combinatorial unity).
     - (b) Whatever makes the complex a truth-bearer (if it is a proposition) or a truth-maker (if it is a fact).
     The Bradleyan runs the regress for both senses, while the structured-proposition theorist may hold that (a) is secured by the logical form and (b) by the conditions of evaluation.

  **Disagreements Table:**

  We list three required cruxes and one additional one (the whole-first variant). For each crux, we provide:
  - The crux (the issue)
  - Bradleyan (B) position (in B's words)
  - Structured-proposition theorist (SPT) position (in SPT's words)
  - Agreed test/case/argument (if available)
  - B's prediction and SPT's prediction (if a test exists)

  If no test is agreed, we note that.

  **Crux (i): Function-Argument Structure vs. Application-Relation**

  - **Crux:** Whether the regress survives the move to function–argument structure. Specifically, whether explaining the unity of an atomic proposition (e.g., "Fa") by saying that the object a saturates the unsaturated concept F (or that a is an argument of F) avoids the regress, or whether this is equivalent to positing an application relation between a and F (leading to a regress).

  - **B Position:** The function-argument structure does not avoid the regress. The claim that a saturates F is equivalent to a relational fact (that a bears the saturation relation to F). This relation must then be unified with a and F, leading to a new complex and hence a regress. The unsaturatedness of F is just a label for the need for a relation; it does not by itself unify without a further relation.

  - **SPT Position:** The function-argument structure avoids the regress because the unsaturatedness of F is not a constituent but a logical feature. The function F is incomplete and requires an argument to yield a complete whole. This does not require a further relation because the combination is intrinsic to the nature of F. The application relation is not an additional entity but a mode of combination.

  - **Agreed Test:** Consider a toy language with names (a, b), monadic predicates (F, G), dyadic predicates (R), negation (~), conjunction (&), and a single quantifier (∀). The semantics assigns values to expressions compositionally. For an atomic formula (e.g., "Fa"), the question is whether the semantic rule for an atomic formula (which might be: the value of "Fa" is true iff the object denoted by a is in the extension of F) implicitly relies on an already-unified complex (the set of objects in the extension of F) or whether the rule itself, by using function application (the extension of F applied to the denotation of a), avoids the regress by not requiring a further relation.

  - **B Prediction:** The semantic rule for "Fa" will either (a) implicitly rely on a set (which is a unified complex) or (b) use function application, which is a relation between the function and the argument. In case (b), the function application relation must be unified with the function and the argument, leading to a regress. Thus, the rule does not assign a value without presupposing unity.

  - **SPT Prediction:** The semantic rule uses function application, which is a primitive combinatorial operation. The rule does not require a further unifying relation because function application is not an entity but a rule of combination. The rule assigns a value without presupposing a unified complex (other than the result of the application).

  **Crux (ii): Vicious vs. Benign Regress and Truth Conditions**

  - **Crux:** If an infinite hierarchy of successively unified complexes is required (as the regress suggests), is this hierarchy vicious (making the original complex impossible) or benign? And if benign, does the original complex still have the intended truth conditions?

  - **B Position:** The regress is vicious because it requires an infinite chain of unifiers, each of which is a further complex that itself requires unification. Since no finite being can complete such a chain, the original complex cannot be unified. Moreover, the truth conditions of the original complex would depend on the entire infinite hierarchy, which is impossible to ground.

  - **SPT Position:** The regress is benign because it is recursive and does not require completion for the original complex to be unified. The unifier at each level is provided by the same combinatorial operation (e.g., function application) that is well-defined and finite at each step. The truth conditions of the original complex are fixed by the first step of the hierarchy and do not depend on the entire infinite chain.

  - **Agreed Test/Case:** Consider a simple atomic proposition, such as "a is F". The Bradleyan regress would generate: 
     Level 0: F(a)
     Level 1: Applies(F, a)   [the application relation between F and a]
     Level 2: Applies2(Applies, F, a)   [a new application relation for the first application]
     and so on.

     The test is: 
     (a) Can we define the truth condition for Level 0 without reference to Level 1 and beyond? 
     (b) Does the infinite hierarchy of levels (if required) compromise the existence or truth conditions of Level 0?

  - **B Prediction:** The truth condition for Level 0 cannot be defined without Level 1 because Level 0 is not unified without Level 1. Moreover, Level 1 itself is not unified without Level 2, and so on. Therefore, the entire infinite hierarchy is required, and since it cannot be completed, Level 0 is not unified and has no definite truth conditions.

  - **SPT Prediction:** The truth condition for Level 0 is defined by the function application at Level 1, but Level 1 is not a further complex that needs to be unified in the same way. The function application is a primitive operation that does not require a further level for its own unity. Therefore, the regress stops at Level 1, and the hierarchy does not continue. Even if we represent the operation as a relation, it does not generate a regress because the operation is not a constituent.

     Alternatively, if we do have an infinite hierarchy, it is a trivial recursion that does not affect the truth conditions of Level 0. Level 0 is true iff a is F, and that condition is fixed by Level 1 without requiring the entire chain.

  **Crux (iii): The Whole-First Variant**

  - **Crux:** Whether the whole-first view (that the proposition is prior to its constituents, which are abstractions from it) escapes the regress or merely relocates it into the abstraction operation.

  - **B Position:** The whole-first view does not escape the regress. The abstraction operation that recovers the constituents from the whole is itself a relation between the whole and the constituent (e.g., the whole W has constituent c). This requires a unifier for the complex (W, c, and the abstraction relation). Thus, the regress reappears at the level of abstraction.

  - **SPT Position:** The whole-first view escapes the regress because the whole is primitive and not composed of constituents in a way that requires a unifier. The abstraction operation is not a relation that needs unification because it is an operation of analysis that does not create a new complex. The constituents are not prior to the whole; they are derived by abstraction and hence do not require a unifier to be combined in the whole.

  - **Agreed Test/Case:** Consider a simple whole, such as the fact that a is F. The whole-first view says that we start with the fact (or proposition) as a simple unity, and then we abstract the constituents a and F. The test is: 
     - Does the abstraction operation (by which we get a and F from the whole) itself generate a complex (the whole, the constituent, and the abstraction relation) that requires unification?

  - **B Prediction:** Yes. The abstraction operation yields a complex: the whole W, the abstracted constituent c, and the abstraction relation R (e.g., R(W, c)). This complex must be unified. If we try to unify it by another abstraction relation, we get a regress.

  - **SPT Prediction:** No. Abstraction is not a relation that creates a complex. It is an operation that we perform on the whole to discern features. The whole is given as a unity, and the abstraction does not create a new entity but rather a way of understanding the given whole. Therefore, no regress arises.

  **Additional Note:** In the case of Crux (ii), the SPT might reject the very generation of an infinite hierarchy. The agreed test is set up to consider the hierarchy if it is generated, but the SPT may deny that it is generated. The table records the SPT's position as denying the need for the hierarchy beyond the first step.

  **Conclusion of Joint Statement:**

  Both sides agree that the regress argument highlights a deep challenge for any theory of structured complexes. The Bradleyan concludes that structured complexes are impossible and that reality must be unstructured (e.g., a monistic whole). The structured-proposition theorist concludes that the regress is either blocked by the nature of logical combination or is a harmless recursion. The joint statement clarifies the assumptions and the points of disagreement, but neither side has convinced the other to abandon their core position.
answer: |-
  ### Joint Statement: Bradley's Regress and the Unity of the Proposition

  After extensive adversarial collaboration, we—a Bradleyan (B) and a structured-proposition theorist (SPT)—agree on the following numbered claims regarding Bradley’s regress and the unity of the proposition. These claims reflect common ground on the regress’s assumptions, targets, and relation to other regresses. Disagreements are cataloged in the accompanying table.

  #### Agreed Claims:
  1. **Assumption of Homogeneous Unification**: The regress argument assumes that any entity responsible for unifying a proposition (or fact) must itself be a *constituent* of the same logical type as the elements it unifies (e.g., relations, objects, or properties). This presupposition is explicit in the regress: if a unifier is posited as a distinct entity, it is treated as an additional relatum in need of unification, triggering iteration. Both sides agree that the regress is unsound if this assumption is false—e.g., if unification is achieved by something non-constituential (e.g., logical form) or of a fundamentally different logical category.

  2. **Target of the Regress**: The regress indifferently targets any complex purporting to possess "unity," including:
     - **Propositions** (as truth-bearers with representational content).
     - **Facts or states of affairs** (as truth-makers or mind-independent complexes).
     The regress arises identically for both when they are analyzed as structures composed of discrete constituents (e.g., objects, properties, relations). Unity here means the "glue" binding constituents into a single complex, distinct from a mere list.

  3. **Distinctness from Other Regresses**: Bradley’s regress (unity of complexes) is distinct from the regress of instantiation (e.g., "a instantiates F" requiring a further relation) and the regress of truthmaking (e.g., "P corresponds to fact F" requiring a further correspondence). While all three share a structural similarity—infinite iteration due to relational explanations—they target different phenomena:
     - Unity regress: Concerns the *existence* of a complex as a unified whole.
     - Instantiation regress: Concerns the *binding* of properties to objects.
     - Truthmaking regress: Concerns the *grounding* of truth.
     Bradley’s regress is more fundamental: if unity fails, instantiation and truthmaking cannot arise. However, solutions to one may not resolve others.

  4. **Verbal Disagreement on "Unity"**: We agree that "unity" is used ambiguously, contributing to apparent disagreement. It conflates:
     - **Combinatorial unity**: What makes constituents combined rather than listed.
     - **Truth-bearing unity**: What makes a proposition capable of being true/false (or a fact capable of making truths).
     The regress primarily targets combinatorial unity. If combinatorial unity fails, truth-bearing unity is undermined. However, SPT holds that combinatorial unity (via logical form) suffices for truth-bearing unity, while B denies both can be secured.

  ---
  ### Disagreements Table
  The table below details unresolved cruxes. For each:
  - **Crux**: The core issue.
  - **B Position**: Bradleyan stance (wording acceptable to B).
  - **SPT Position**: Structured-proposition theorist stance (wording acceptable to SPT).
  - **Agreed Test/Case**: A shared scenario, argument, or formal test to evaluate the crux. Where no test is agreed, it is noted.
  - **Predictions**: Each side’s advance prediction of the test outcome.

  | Crux                                                                 | B Position                                                                                                                                 | SPT Position                                                                                                                                 | Agreed Test/Case                                                                                                                                                                                                                                                                                               | B Prediction                                                                                                | SPT Prediction                                                                                                 |
  |----------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|
  | **(i) Function-Argument vs. Application-Relation**<br><br>Does framing unification via function–argument structure (e.g., unsaturated concepts) avoid the regress, or is it equivalent to positing an application-relation? | "The function–argument model fails: describing 'a saturating F' merely disguises a tacit application-relation (App) between a and F. App must itself be unified with a and F, restarting the regress. Unsaturatedness is not a solution; it is a label for the need for App." | "Function–argument structure blocks the regress: unsaturated concepts (e.g., F) are incomplete entities that inherently demand saturation by arguments (e.g., a). No additional relation (App) is needed; unity is achieved by the logical mismatch between saturated and unsaturated types, not by a constituent." | **Test**: A toy language with syntax: names (a, b), monadic/dyadic predicates (F, R), operators (¬, ∧), and quantifier (∀). A standard Tarskian semantics assigns values via recursive rules (e.g., ⟦Fa⟧ = true iff ⟦a⟧ ∈ ⟦F⟧).<br><br>**Question**: Does the semantic rule for atomic formulas (e.g., "Fa") assign a value *without implicitly presupposing an already-unified complex* (e.g., a set, fact, or relation-in-application)? | The semantics presupposes unity: ⟦F⟧ is a set (a unified complex), and "∈" is an application-relation (App) that must be unified with ⟦a⟧ and ⟦F⟧. The rule fails to avoid the regress. | The semantics assigns ⟦Fa⟧ via function application, where ⟦F⟧ is an unsaturated function. No set or App is presupposed; the rule is foundational and regress-free. |
  | **(ii) Vicious vs. Benign Regress**<br><br>If an infinite hierarchy of unification relations is generated, is it vicious (undermining the original complex) or benign? If benign, does the original complex retain its intended truth conditions? | "The regress is vicious: each iteration (e.g., U₁ unifying a and F, U₂ unifying U₁ with a and F, etc.) produces an *incomplete* complex. Truth conditions for the original proposition (e.g., 'a is F') depend on the entire infinite chain, which cannot exist. The proposition never achieves unity or determinate truth conditions." | "The regress is benign: unification is achieved at the first step (e.g., via a primitive combinatorial operation). Subsequent iterations are redundant or formal artifacts without ontological weight. The original complex has determinate truth conditions fixed by the initial unification, independent of the chain." | **Case**: Define a hierarchy: Level 0 = the proposition "a is F"; Level 1 = U₁(F, a); Level 2 = U₂(U₁, F, a); etc.<br><br>**Question**: Can Level 0 be true (e.g., represent that a instantiates F) if the hierarchy is infinite and ungrounded? Does Level 0 require Level 1–∞ to be unified? | No: Level 0 cannot be true. Without a "first" unifier, Level 0 is not unified, so it lacks truth conditions. An infinite hierarchy is impossible to complete or ground. | Yes: Level 0 is unified and true (if a instantiates F) solely via U₁. Higher levels are explanatory fictions; truth conditions depend only on U₁ and reality. |
  | **(iii) Whole-First Variant**<br><br>Does prioritizing the whole proposition over its constituents (constituents as abstractions) avoid the regress, or does it relocate it to the abstraction operation? | "Whole-firstism relocates the regress: abstracting constituent c from whole W requires a relation (Abs) between W and c. Abs must be unified with W and c, generating a new complex (W, c, Abs) and restarting the regress. Abstraction does not solve unity; it presupposes it." | "Whole-firstism avoids the regress: the whole is ontologically prior and intrinsically unified. Abstraction is an epistemic operation that does not create new complexes; it discerns constituents from a given unity. No additional relations are needed, so no regress arises." | **Case**: Consider a whole W (e.g., the proposition that a is F). We abstract constituents a and F from W.<br><br>**Question**: Does the abstraction operation itself produce a complex (e.g., W, a, and an abstraction relation Abs) that requires unification? | Yes: Abstraction yields a complex (W, a, Abs) that needs unification, restarting the regress. The priority of the whole is illusory. | No: Abstraction is not a relation that forms a complex; it is a mental act analyzing a pre-unified whole. No new unity is needed. |

  #### Notes on Disagreements:
  - **No Agreed Test for Crux (ii)**: For Crux (ii), B and SPT disagree on what counts as "vicious" and whether truth conditions require grounding. B demands full ontological grounding for unity; SPT holds that primitive combinatorial operations are explanatorily sufficient without infinite completion. Thus, the test case is accepted, but interpretations of "requires" diverge.
  - **Verbal Element**: The core verbal confusion (noted in Claim 4) centers on "unity." B ties combinatorial unity inseparably to truth-bearing unity: if constituents aren’t genuinely combined, the proposition cannot bear truth. SPT decouples them: combinatorial unity (via logical form) is primary and sufficient for truth-bearing unity. This inflames disputes, especially in Crux (i) and (ii).

  ### Conclusion
  This joint statement clarifies common ground and precise disagreements. B maintains that the regress is sound and fatal to structured propositions/facts; SPT holds it is either blocked by logical resources or benign. No resolution was reached, but the collaboration sharpened the debate’s parameters.
