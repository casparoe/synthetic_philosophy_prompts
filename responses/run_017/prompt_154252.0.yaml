prompt: |-
  I serve on the Academic Standards Committee of a university faculty of health sciences, and I need to circulate a decision memo before our meeting in ten days. I'd like you to draft it.

  The case before us concerns a two-year master's programme in advanced clinical practice that certifies graduates for hospital work. For the past four semesters the programme has permitted students to use an AI clinical decision-support assistant on secured university devices, both in placements and in the observed structured clinical examinations that decide the award. The tool is permitted because the profession permits it: practitioners in the field already use decision support, and the programme's view has been that assessing clinical judgement in a tool-free vacuum would measure the wrong thing.

  Two things have made this newly contentious. First, our assessment office ran an anonymous sub-study last term comparing the fourteen students who used the assistant throughout with the nineteen who essentially never did. On the standard examinations, with the tool available, the heavy users scored marginally higher. On an unproctored tool-free variant of the same stations, the heavy users scored substantially lower than the non-users — low enough that some of them would not have passed. The tool, in other words, does not sit on top of an unchanged competence; it appears to substitute for part of it. Second, in the oral component of the examinations, the heavy users reliably produce the correct management plan but cannot answer what I'll call the boundary question: what would have to be different about this patient for the alternative plan to be the right one. They can restate a recommendation and its supporting guideline; they cannot locate the case relative to its neighbours, and they do not reliably notice when a station has been perturbed into a case where the tool's recommendation is wrong.

  One member of the faculty has circulated a note invoking Plato's Meno: the worry that reliably correct performance without an account is, in the dialogue's image, an untethered statue that wanders off, and that the tether is worth something even in the stretches where the statue stays put. Several members find this beside the point, since what we certify, on their view, is a prediction about practice, and the prediction for these students is good.

  A concrete proposal is on the table: adopt a perturbation standard. A candidate for the award must, for a sample of stations, state what change in the presentation would change the recommended management and why, and must flag at least one case in the sample where the decision-support recommendation is wrong. The complication is that the only instrument we have for this is oral, and three students in the current cohort have registered accommodations or language profiles that make an oral requirement a poor measure of what it is meant to measure. We cannot adopt a standard that partly measures fluency in English.

  Three further facts complicate the choice. The university's award descriptor, written years ago for purposes of patient communication, already says that a holder can account for their decisions to colleagues and patients; nobody until now has read that clause as a bar to certification. The national regulator is consulting on whether to permit decision support in the licensing examination, with an outcome expected within the year that we do not control. And twenty-three students are mid-programme under the current rules, some of whom would fail a perturbation requirement if it were applied to them without notice.

  I am not neutral. I lean toward adopting some version of the standard, but two things keep me from confidence: the analogy one colleague offers, of instrument-rated pilots who are markedly worse at manual flying than their predecessors and yet safer overall because the instruments are always there; and the fact that our only instrument for the standard is oral. I also cannot tell whether the answer should track the regulator's decision or anticipate it.

  Please draft the memo the committee could act on. It should recommend a concrete course with a time frame: adopt, adopt in a specified modified form, or decline; what to do about the current cohort and why that treatment rather than full or no retroactivity; how a perturbation standard would actually be administered so that it tests the boundary question and not verbal fluency or English; and what we should do under each of the regulator's possible outcomes, including whether we should wait for it. It should give reasons a colleague who disagrees could respond to rather than restate the programme's existing policy, and it should state, in one paragraph before the recommendation, which considerations are load-bearing for you and which you are setting aside as undecidable here. It should also say, honestly and at some length, what is strongest in the case for the opposite recommendation, and whether the phenomenon I have labelled credential drift — the award continuing to mean to employers what it has always meant while ceasing to track what it used to track — is a real harm or a piece of nostalgia. Assume the committee knows the background above; do not summarise it back to me. No citations or bibliography: I will add anything of that kind myself. Around 1,200 words.
reasoning: |-
  Okay, the user is on an Academic Standards Committee and needs a draft decision memo about whether to adopt a perturbation standard for a clinical practice master's program. This involves complex educational ethics around AI tool usage, assessment validity, equity concerns, and regulatory alignment. 

  First, let's unpack the layers. The core tension is between certifying competence for real-world practice (where AI tools exist) versus ensuring foundational understanding (which the perturbation test aims to measure). The user's neutrality is important - they lean toward the standard but have genuine doubts about the aviation analogy and oral assessment limitations. 

  The memo must navigate several landmines: 
  - Equity for students with accommodations/language barriers
  - Fairness to current mid-program students 
  - Regulatory uncertainty
  - Philosophical disagreements about credential meaning

  Hmm, the user explicitly wants the "strongest case against" presented fairly - that's crucial. The aviation analogy is actually quite powerful; it suggests tools can create safer systems even if raw skills diminish. Also, credential drift might not be harmful if employers adapt expectations to modern practice. 

  For structure, I'll: 
  1. Open with clear recommendation (modified standard) 
  2. Acknowledge valid counterarguments sincerely 
  3. Propose phased implementation to address equity/retroactivity 
  4. Build in regulatory flexibility 
  5. Design the perturbation assessment to minimize language bias (e.g., written option, simplified responses)

  Biggest challenge is the oral assessment dilemma. The solution might be: accept multiple demonstration formats (written/diagrammatic) and train examiners to disregard language fluency in scoring. Also explicitly state that the standard measures clinical reasoning, not communication. 

  On credential drift - I'll argue it's a real harm if unchecked, but not nostalgic. The award descriptor already implies reasoning accountability; we're just making it operational. 

  For the current cohort: apply standard only to future exams with remediation support. Full retroactivity would be unfair, but no action risks graduating students who can't reason independently. 

  Timing can't wait for the regulator - we have immediate data showing competence gaps. But we'll build a review trigger for when their decision lands. 

  *starts drafting with these guardrails*
answer: |-
  **MEMORANDUM**  
  To: Faculty Academic Standards Committee  
  From: [Your Name/Position]  
  Date: [Current Date]  
  Subject: Recommendation on Perturbation Standard for MSc in Advanced Clinical Practice  
  CC: Programme Director, Assessment Office, Equity & Accommodations Office  

  ---

  ### **I. Load-Bearing Considerations and Setting Aside Undecidables**  
  This recommendation prioritizes three core principles:  
  1. **Certification Integrity**: Our award must reflect independent clinical reasoning, not tool-dependent performance. The sub-study confirms AI use correlates with diminished foundational competence when tools are absent—a material risk in clinical practice (e.g., tool failure, edge cases).  
  2. **Equity**: Any standard must avoid disadvantaging students with accommodations or language barriers. An oral-only assessment fails this test.  
  3. **Procedural Fairness**: Mid-programme students cannot face retroactive rule changes without transitional support.  

  The following are acknowledged but **set aside as undecidable here**:  
  - Whether AI tools *net* enhance safety (analogous to aviation instruments). This is context-dependent and requires longitudinal data beyond our scope.  
  - The regulator’s final decision. We must act on current evidence but build flexibility into our policy.  

  ---

  ### **II. Strongest Case Against the Perturbation Standard**  
  The opposing view merits serious engagement. Its core strength lies in the argument that our mandate is predictive: we certify preparedness for *actual practice*, where decision-support tools are ubiquitous and relied upon for safety and efficiency. The aviation analogy is potent—pilots using automated systems exhibit degraded manual skills but achieve superior safety outcomes because systems are redundantly available. Insisting on "pure" competence may thus be anachronistic; if tools are permanent workplace fixtures, testing without them arguably misaligns with reality. Furthermore, credential drift—where the award’s meaning evolves while retaining employer trust—could reflect healthy adaptation to technological change, not broken promises. Imposing a perturbation standard risks overcorrection, disadvantaging capable students adept at leveraging tools appropriately while solving nothing in workplaces where such tools are mandated. Waiting for the regulator’s ruling (due within 12 months) might also prevent costly policy reversals.  

  ---

  ### **III. Recommendation: Modified Perturbation Standard with Phased Implementation**  
  **Adopt a perturbation standard** in modified form, effective immediately for **new cohorts** and **phased in for the current cohort**, with the following framework:  

  #### **A. Standard Design & Administration**  
  1. **Core Requirement**: Candidates must demonstrate, for at least two OSCE stations:  
     - (i) A clinically plausible change to the case that would alter management, with a mechanistic rationale (e.g., "If troponin ↑, ACS likely → escalate cardiac monitoring").  
     - (ii) Identification of one station where the decision-support output is incorrect, with a brief justification (e.g., "Tool missed penicillin allergy in history").  
  2. **Non-Oral Assessment Modalities** (to avoid language/fluency bias):  
     - **Written bullet points** submitted immediately post-station.  
     - **Structured tick-box/diagrammatic responses** (e.g., "Change [ ] Vital Sign / [ ] Lab Value / [ ] History Item" → "Alters plan because [ ] Risk stratification / [ ] Diagnosis").  
     - **Verbal responses** remain optional for students who prefer them.  
     *Rationale*: Focuses assessment on clinical reasoning, not communication fluency. The Equity Office will validate instruments.  

  #### **B. Transition for Current Cohort (n=23)**  
  - **No retroactive application**: Students may graduate under existing rules if completing all requirements by [Date 12 months from now].  
  - **Optional Perturbation Pathway**: Current students may *elect* to demonstrate perturbation competence (via methods above) for academic distinction or if concerned about regulatory changes. Remediation support (e.g., workshops on edge-case analysis) will be provided.  
  - *Rationale*: Preempts unfair failure under new rules while incentivizing upskilling. Aligns with principles of transitional justice.  

  #### **C. Timeline**  
  - **Semester 1 (Next 6 months)**: Pilot non-oral assessment modes; train examiners on scoring rubrics.  
  - **Semester 2 (6–12 months)**: Full implementation for new cohorts; optional pathway for current cohort.  
  - **Review Trigger**: Upon regulator’s decision (expected within 12 months).  

  #### **D. Response to Regulatory Outcomes**  
  | **Regulator’s Decision** | **Our Action** |  
  |--------------------------|----------------|  
  | Permits AI in licensing exam | Maintain perturbation standard but reduce weighting (e.g., 15% of OSCE). Ensures baseline reasoning competence. |  
  | Bans AI in licensing exam | Expand perturbation standard (e.g., 30% of OSCE) and integrate into all clinical assessments. |  
  | Issues ambiguous guidance | Advocate nationally for our framework as a model. |  

  ---

  ### **IV. Rationale for Recommendation**  
  1. **Addresses Sub-Study Findings Directly**: The perturbation requirement explicitly tests boundary awareness and error detection—the precise competencies deficient in heavy AI users. It aligns with the award descriptor’s "account for decisions" clause, which we now operationalize.  
  2. **Mitigates Credential Drift as Harm**: While credential meaning can evolve, unchecked drift risks eroding trust. If graduates cannot explain *why* a tool’s output fits (or doesn’t fit) a case, the award ceases to signal clinical judgement—a core historical and employer expectation. This is not nostalgia; it is preserving a defined, transferable competence.  
  3. **Balances Innovation with Safeguards**: Permitting AI reflects real-world practice; the perturbation standard ensures tools augment, rather than replace, cognition. Plato’s "untethered statue" resonates: correct outputs without understanding cannot be trusted when context shifts.  
  4. **Procedurally Sound**: Phasing shields current students while preparing all graduates for regulatory uncertainty. Non-oral options ensure equitable assessment.  

  ---

  ### **V. Resolution Requested**  
  The Committee is asked to:  
  1. **Approve** the modified perturbation standard and implementation plan above.  
  2. **Task the Assessment Office** with developing non-oral instruments by [Date 3 months from now] for Equity Office validation.  
  3. **Delegate authority** to the Programme Director to adjust weighting based on the regulator’s decision.  

  ---  
  **Endorsed by**:  
  [Your Signature]  
  [Your Title]  

