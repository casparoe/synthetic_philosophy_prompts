  The user is asking for a precise mapping between philosophical concepts and legal doctrines. For each scenario, I need to analyze what translates directly, what requires conceptual bending, and what remains untranslatable in legal terms. Then I should evaluate whether the untranslatable elements stem from law's instrumental nature or philosophy's lack of precision.

  The artifacts case (a) seems to parallel ademption doctrine—both concern whether an object remains "the same" after material changes. The table made from different wood is like a bequeathed table that's been refurbished; courts ask "is this substantially the same object?" which is functional rather than metaphysical. 

  For persons (b), the legal treatment of posthumously conceived children and adoption statutes explicitly override biological origins. Parentage is assigned by rules, not ontology—showing law's willingness to sever origin when socially useful.

  Twinning (c) is fascinating legally. Monozygotic twins share identical origins yet are distinct persons. Law would treat them as separate individuals from birth, disregarding the philosophical puzzle of "which one I could have been." This highlights law's focus on actual persons over counterfactual identities.

  Embryo selection (d) involves statutory parentage rules that prioritize intention over biology. The unchosen embryos are legally never persons, so the "what if" question doesn't arise—another example of law's forward-looking instrumentalism.

  Gamete chance (e) resembles tracing doctrine: law follows value through substitutions, caring about the endpoint (the born child) rather than the randomness of conception. Like equity ignoring how value entered the chain, parentage ignores which sperm "won."

  The residue report should emphasize that law's tools—ademption tests, statutory fictions, tracing rules—are purpose-built instruments. They can simulate origin essentialism when useful (e.g., preserving specific gifts) but discard it when inconvenient (adoption). The untranslatable core is philosophy's insistence on origin as intrinsic truth versus law's treatment of identity as assignment. 

  The user's suspicion seems correct: origin essentialism functions as a linguistic convention in law ("this" means this specific object with its history) rather than a discovered reality. Where philosophy struggles with twinning counterfactuals, law simply registers two births. Where metaphysics fixates on gamete origins, law cares about legal parentage. The cost of holding both views is recognizing that philosophy describes what we mean by identity in absolute terms, while law governs how we assign it for human purposes.
answer: |-
  Your legal vocabulary provides powerful analogues but reveals a fundamental misalignment with origin essentialism. Below is a translation, residue analysis, and the report you requested.

  **(a) Artifact Claim & Reply**  
  *Essentialist Claim:* The table’s identity requires its specific origin block of wood.  
  *Reply:* Imagining an identical table from different wood isn’t imagining *this* table.  

  - **Direct Translation:** Ademption by extinction. When a bequeathed table is replaced by an identical replica, courts apply the "substantial identity" test: Is it functionally the same object for testamentary purposes? But this is a *pragmatic* inquiry, not ontological.  
  - **Bending Required:** The reply mirrors asking whether a replica satisfies a specific gift. Yet the law asks "Does this fulfill the testator’s intent?" not "Is this numerically identical?"  
  - **Untranslatable:** The claim that *metaphysical identity* depends on origin. Law treats identity as a matter of classification for a purpose (e.g., "is this the ‘named thing’?"), not a truth about the universe.  
  - **Residue:** The table’s "thisness" (haecceity) has no legal cognate.  

  **(b) Persons & Gametes**  
  *Claim:* You could not have originated from different gametes.  

  - **Direct Translation:** Gifts to "children" include posthumously conceived genetic offspring (via statutes) and adopted children (via legal fiction), severing origin from legal identity.  
  - **Bending Required:** Assisted reproduction statutes *reassign* parentage but don’t deny the biological origin; they override it for policy reasons. Essentialism’s claim isn’t refuted—it’s ignored.  
  - **Untranslatable:** The assertion that *you*, as a metaphysical entity, are tied to *those specific gametes*. Law defines persons by legal status (birth certificates, parentage orders), not primordial biological events.  
  - **Residue:** Your "numerical identity" independent of legal categorization is alien to the framework.  

  **(c) Monozygotic Twinning**  
  *Hard Case:* If the zygote splits, which twin is "you"? Could you have been the other?  

  - **Direct Translation:** None. Law treats twins as distinct persons from birth. Parentage statutes assign legal identity at live birth, indifferent to zygotic history.  
  - **Bending Required:** Equitable tracing analogizes poorly: Value splitting into two assets might create separate claims, but law doesn’t ask "which asset is the *original* value’s true self?"  
  - **Untranslatable:** The question of pre-split "you." Law recognizes persons only post-birth; essentialism’s origin point (fertilization) isn’t a legal status-conferring event.  
  - **Residue:** The paradox of "which twin I am" dissolves—law assigns identity *after* the split.  

  **(d) Embryo Selection**  
  *Variant:* Unselected embryos (same genetic "origin" potential) are never implanted.  

  - **Direct Translation:** Statutory definitions of "child" require birth or gestation. An unselected embryo has no legal identity—it’s property, not a person.  
  - **Bending Required:** Essentialism asks if *you* could have been an unselected embryo. Law answers: No, because no legal person exists without birth.  
  - **Untranslatable:** The counterfactual "personhood" of unchosen embryos. Law’s personhood is conditional on live birth; metaphysics posits identity at conception.  
  - **Residue:** Essentialism’s origin point (fertilization) vs. law’s bright line (birth).  

  **(e) Gamete Chance**  
  *Ordinary Case:* Your specific sperm was arbitrary among many.  

  - **Direct Translation:** Gifts to "issue" include children conceived from any gamete meeting the description (e.g., "children of A"). Tracing follows value through substitutions, indifferent to *which specific asset* entered the chain first.  
  - **Bending Required:** The arbitrariness of the winning sperm parallels tracing’s indifference to *which* $100 bill was deposited. But law cares about the *value* or *class*, not the token.  
  - **Untranslatable:** The claim that *your identity* hinges on that particular sperm. Law assigns rights based on genetic relationship or legal parentage, not the chance event itself.  
  - **Residue:** Essentialism’s fixation on the token gamete; law cares only about type (genetic link) or legal assignment.  

  ---

  ### RESIDUE REPORT  
  #### What Fails to Translate & Why  
  1. **The Untranslatable Core:**  
     - Essentialism’s assertion of **numerical identity** bound to origin.  
     - Law replaces this with **purpose-driven classification**: "Is this the *same* for testamentary intent? For parentage? For tracing value?"  
     - The metaphysical "could not have been otherwise" has no legal counterpart.  

  2. **Cause of Failure:**  
     - **Your vocabulary is instrumental**. It:  
       - Stipulates identity by decree (adoption fictions, parentage orders).  
       - Severs origin when useful (posthumous conception statutes).  
       - Treats counterfactuals as causal/evidential (e.g., "Would testator have intended this?"), not as inquiries into transworld identity.  
     - **Essentialism lacks decision-procedure precision**:  
       - It never specifies *how* fine-grained origin must be (e.g., "that exact atom of wood?").  
       - Law forces exactness: "Altered beyond recognition?" "Born within 45 months of death?" "Genetically related?"  

  #### Verdict on Your Suspicion  
  **Your suspicion is correct.** Origin essentialism functions in law not as a discovered truth but as a **stipulation for using "this"**—and one law freely overrides when policy demands it.  

  - **Where Law Mimics Essentialism**:  
    - Specific gifts: Courts preserve origin *to honor testator’s intent* (e.g., "the table made from oak on my estate").  
    - Tracing: Following value *assumes* continuity through substitutions—but only to prevent unjust enrichment, not to affirm metaphysical identity.  

  - **Where Law Severs Origin**:  
    - Adoption: The child "as if born to" adopters erases biological origin.  
    - Assisted reproduction: Parentage follows intent/gestation, not gametes.  
    - Posthumous children: Conceived after death, but legally "in being" at death.  

  **Cost of Holding the Thesis:**  
  If you concede origin essentialism metaphysically "true" but legally inapplicable, you accept:  
  - Law operates in a space of **fictional assignments**, not fundamental reality.  
  - This imposes no burden on legal practice—your instruments work without metaphysics.  
  - The only cost is philosophical: acknowledging that law’s "identity" is a tool, not an ontology.  

  **What You’re Not Misreading**:  
  Essentialism *is* a claim about how we use "this." Its arguments (e.g., Kripke’s "rigid designation") rely on linguistic intuitions—precisely what legal stipulations override. The law’s readiness to backdate, reassign, or fictively create origins proves that for all functional purposes, **origin is a variable, not a necessity**.
