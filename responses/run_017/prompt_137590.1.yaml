  Here's a reconstructed memo grounded in your precedents, with confidence annotations and a highlighted weak joint:

  ---

  ### I. Reconstructed Rules from Precedents
  Three principles emerge from your eight rulings, each generating tension when applied to the cod:

  1.  **The Autonomy Principle (Pulls TOWARD Yes for Cod):**
      *   *Rule:* Non-human entities qualify as *actors* if they possess **internally generated dynamics** and a **bounded identity** demonstrably shaping events, even when interacting with human systems. Invisibility is not a barrier.
      *   *Evidence:* Plague bacillus (internal dynamics/identity); Rinderpest virus (dynamics/identity, despite arrival vector); Malaria/mosquito (dynamics/identity, though co-authors required); Tambora eruption (singular event dynamics).
      *   *Prediction for Cod:* **YES.** Cod exhibit demonstrable internal population dynamics (recruitment failure, age structure, potential evolution), a bounded identity ("northern cod stock"), and their decline actively shaped history (collapse, moratorium, depopulation). *Confidence: High (90%).* Fits plague, rinderpest, mosquito, Tambora core logic.

  2.  **The Anti-Determinism Principle (Pulls TOWARD No for Cod):**
      *   *Rule:* Agency is denied when attributing grammatical subjectivity would risk implying **explanatory over-determination**, **inevitability**, or obscuring the essential, constitutive role of **human choice, politics, and technique** in the outcome. This protects against reification.
      *   *Evidence:* Tsetse fly (denied to avoid carrying "whole weight" of continental pattern/inevitability); Sumerian salinization (denied as condition/echo, likely due to contested human role); Malaria/Tambora co-authorship requirement (insisting human factors remain visible); El Niño/Little Ice Age (denied as metronomes partly *because* cycles alone don't determine specific outcomes without human mediation).
      *   *Prediction for Cod:* **NO.** Granting the cod agency ("the cod refused to recover," "the cod retreated") risks framing the collapse as an inevitable consequence of the cod's own dynamics + fishing pressure, potentially absolving or downplaying the specific, contingent human decisions (optimistic quotas, subsidies, trawler tech, policy failures). *Confidence: High (85%).* Fits tsetse, salinization logic, and explains co-authorship requirements.

  3.  **The Entanglement & Legibility Principle (Splits the Case):**
      *   *Rule:* Agency is more likely granted for **punctual, legible events/entities** than diffuse processes, *unless* the entity is profoundly **entangled with human technique** to the point where its "own" dynamics cannot be meaningfully separated. Legibility aids narrative agency.
      *   *Evidence:* Tambora eruption (yes - punctual/singular); Plague arrival (yes - punctual event); Rinderpest (yes - panzootic framed as an event); Mosquito (yes - bounded entity); El Niño/Little Ice Age (no - diffuse metronomes); Salinization (no - slow, contested condition); Tsetse (no - entangled with human settlement/politics *and* diffuse pattern). *The 1890s Split:* Rinderpest (virus - punctual invasion?) vs. Drought (cycle phase - diffuse?).
      *   *Prediction for Cod:* **SPLIT.** The **1992 moratorium** is highly punctual and legible (like Tambora's plume), arguing for agency *at that point*. However, the **multi-decadal decline** involves deep entanglement with human tech/subsidies/quota systems, making pure "cod dynamics" inseparable, arguing against agency for the *process*. *Confidence: Moderate (75%).* Fits Tambora/Plague vs. Tsetse/El Niño. The 1890s split remains ambiguous (fatigue? punctuality vs. cyclicality?).

  ### II. Recommendation for Consistency & Implications
  *   **Closest Analog:** **Malaria in the Roman Campagna.** Both involve a biological agent (mosquito/cod) with internal dynamics, profoundly shaped by human land use/technique/economy (drainage/pilgrims vs. trawlers/subsidies/quota), requiring co-authorship.
  *   **Consistent Decision:** **YES, but ONLY with Strict Co-Authorship.**
      *   *Why Yes:* The cod population possesses sufficient internal dynamics and bounded identity (Autonomy Principle) and the *collapse/moratorium* has punctual legibility. Denying agency entirely contradicts the plague/rinderpest/mosquito/Tambora logic. *Confidence: High (80%).*
      *   *Why Co-Authorship Mandatory:* To satisfy the Anti-Determinism Principle. The author *must* structurally integrate diesel trawlers, sonar, factory ships, subsidies, and federal quota decisions as **co-actors or essential enabling conditions** on every page where cod "acts." The narrative cannot let "the cod decided to decline" stand alone; it must be "the cod, under relentless pressure from subsidized factory fleets guided by DFO quotas based on X, failed to recruit." This prevents the cod's agency from bearing the explanatory weight alone.
      *   *Implication for the Series:* This ruling commits the series to the principle that **biological entities with measurable population dynamics can be agents, BUT their agency is always enacted within and co-constituted by political-economic-technological human systems that must be rendered grammatically and narratively present.** It reinforces the Tambora/mosquito precedent and refines the tsetse rejection (tsetse lacked clear *internal population dynamics* evidence compared to cod/mosquito, and its entanglement was deemed totalizing for the pattern). *Confidence on Implication: High (85%).*
  *   **Underdetermination & Weak Joint:** The precedents *do* underdetermine the decision between a qualified "Yes" (with co-authorship) and a "No" based on profound entanglement/determinism risk. The **1890s split (virus yes, drought no) is the critical ambiguity.** Was it punctuality vs. cyclicality? A belief in pathogen agency vs. climate as a backdrop? Or fatigue? **This is the weak joint in the analysis (Confidence: Low - 60%).** Choosing "Yes with co-authorship" leans towards interpreting the 1890s split as punctuality/cyclicality being decisive. Choosing "No" leans towards interpreting it as entanglement/determinism risk being decisive.

  ### III. Discriminating Hypothetical Proposal
  To separate the Autonomy Principle from the Anti-Determinism/Entanglement Principle:
  *   **Proposal:** A chapter on the impact of **soil microbiomes (specific bacteria/fungi consortia)** on the viability of early agricultural settlements in a particular river valley. These microbes fix nitrogen, suppress pathogens, and aid water retention, exhibiting measurable, self-generated dynamics and community succession ("The rhizobia colonized the roots," "The mycorrhizal network refused to extend to the new terrace"). Their collapse (detectable in paleo-soil cores) coincides with settlement abandonment amid climate fluctuation.
  *   **How it Discriminates:**
      *   **High Autonomy:** Clear internal microbial dynamics, bounded identity (specific consortia functions).
      *   **Low Entanglement with Human Technique:** Minimal direct human manipulation (pre-modern agriculture). Humans created the *field*, but not the *microbes' internal dynamics*.
      *   **Moderate Punctuality/Legibility:** Collapse might be detectable but not "event-like" for contemporaries.
      *   **Anti-Determinism Risk:** Granting agency *wouldn't* obviously imply inevitability or obscure specific human choices (unlike subsidies/trawlers). The human choices (where/when to farm) are prior but distinct from microbial actions.
  *   **Prediction Separation:**
      *   **Autonomy Principle Predicts:** YES (Actor - dynamics/identity).
      *   **Anti-Determinism/Entanglement Principle Predicts:** YES (Low risk of determinism/obscuring human responsibility; entanglement is foundational, not constitutive of the microbes' *actions*).
      *   **Vs. Cod:** Unlike cod, microbes aren't entangled with *specific, contested modern techniques/policies* during their "action." A "No" on cod but "Yes" on microbes would starkly highlight the role of entanglement with *modern, politicized* human systems as the decisive factor against agency. *Confidence in Discriminating Power: High (85%).*

  ---

  **Summary for Memo:** Recommend approving the cod as an actor **subject to mandatory, pervasive co-authorship** of the human technological and political factors, aligning most closely with the malaria precedent. This commits the series to recognizing biological agency while demanding rigorous integration of the human systems that shape its expression. The **weakest point** is reconciling the ambiguous 1890s rulings; the chosen path interprets the virus/drought split as favoring punctual/biological agency over cyclical/climate non-agency. The soil microbiome hypothetical would effectively test the boundaries of autonomy versus entanglement-based objections.
