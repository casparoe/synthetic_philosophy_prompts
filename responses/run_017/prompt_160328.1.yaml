prompt: |-
  I chair the accountability review panel at a large teaching hospital. Every incident report that reaches us — roughly eight to ten a month — must be routed into one of two tracks: a clinician track, which records individual culpability and can lead to remediation or discipline, or a system track, which records no individual culpability and sends the case to design and training instead. The panel has forty-five minutes per case, consists of a risk manager, two clinicians and an HR representative, none of whom has any philosophy, and must produce a one-page rationale that will survive both a union grievance and a regulator inspection. The regulator's reporting rule further requires that any finding of individual culpability be accompanied by a recorded statement that the clinician "had a meaningful alternative" — a phrase our own draft policy repeats without defining.

  Our working question, week after week, is whether the clinician could have done otherwise, and a "no" is treated as closing the culpability question: no alternative, no blame. I have become convinced this is the wrong question, because of theFrankfurt-style cases in which an agent acts exactly as she wants to act while a counterfactual intervener stands ready to ensure the same outcome if she had shown any sign of deviating — an agent who, intuitively, is not thereby excused. But I cannot hand my panel a literature. What I need is a procedure.

  Please write the decision procedure my panel could actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with "no individual culpability," and where it hands the decision to a person because the remaining question is one of values rather than fact. It has to do three things at once. It must preserve whatever is true in the thought that the absence of alternatives can excuse. It must tell me how to satisfy the regulator's "meaningful alternative" language in cases where the better finding is not about alternatives at all — including how to write the recorded statement when the two come apart, and when to refuse to sign the finding rather than stretch the wording. And it must be usable by non-philosophers working from an incident report in under an hour, which means saying what to do when the evidence for a step is simply unavailable.

  The procedure needs to handle four kinds of case explicitly. First, forcing functions: electronic-ordering hard stops or locked protocols that make deviation physically impossible, and sometimes do the intervening themselves — which is not the same as the hypothetical intervener of a Frankfurt case, who never acts. Second, omissions, especially failures to escalate or to double-check, which make up most of our docket. Third, what I take to be flicker cases, where the clinician could have done something else — refused, recorded a concern, resigned — but nothing that would have prevented the outcome. Fourth, gradual shaping: clinicians whose habits were formed over years of unit culture, so that by the time of the incident the deviation was effortless and unremarkable to them; this is our analogue of a manipulation case, and I want to know whether the panel should treat a long history of acculturation as excusing, aggravating, or irrelevant.

  Then run the procedure on three cases and report what it gives. (a) A nurse administers the wrong concentration of an infusion after three interruptions; she skipped the independent double-check because the second nurse had been pulled to another ward, and the barcode scanner had been disabled hospital-wide that week for a software upgrade. (b) A resident at hour twenty-six of a twenty-eight-hour shift does not escalate a patient whose vital signs she has seen and charted; her note indicates she reasoned that she would review after the consultant round. (c) A senior consultant deliberately skips a checklist step because he judges, on the evidence available at the time, that the patient's condition makes it unsafe; his judgment was reasonable, and the outcome was catastrophic. Tell me plainly which of these results my panel is most likely to reject, and why that resistance is not a defect in the procedure.

  Finally, be explicit about what the procedure cannot do: where it depends on evidence the panel will never have, where it is vulnerable to hindsight bias, where it cannot distinguish an actual intervener from a counterfactual one after the fact, and where it has to stop and ask the board to make a values call.

  Begin the response with the procedure itself. Your first sentence should be its bottom line: the single governing rule my panel should apply in place of "could she have done otherwise?" — delivered as a rule I can read aloud at the start of a meeting, with no preface, no restatement of this request, and no closing summary. Keep the whole response under about 1,500 words, and do not include citations or suggested reading.
reasoning: |-
  Okay, the user chairs an accountability review panel at a teaching hospital and needs a practical decision procedure to replace their current flawed "could she have done otherwise?" approach. They're dealing with complex ethical/philosophical issues but need something operational for non-philosophers. 

  First, I need to understand the core problem: Frankfurt cases show that absence of alternatives doesn't always excuse, but their panel uses "no alternative = no blame" as a binary switch. They need a procedure that preserves legitimate excuse cases while handling regulator-mandated "meaningful alternative" language - even when culpability isn't about alternatives. 

  The constraints are brutal: 45 minutes per case, non-philosopher panelists (risk manager, clinicians, HR), must produce legally defensible rationale. Must handle four specific case types: forcing functions, omissions, flicker cases, and gradual shaping. Also need to apply it to three test cases and flag where the panel might resist.

  Hmm... the key insight is separating two questions: 1) Was there a meaningful alternative? (for regulator compliance) and 2) Should we assign culpability? (which depends on reasons, not just alternatives). The procedure should flow like a decision tree with clear exit points.

  For the governing rule - it needs to be one sentence they can read aloud. Something like: "We assign culpability only if the clinician had both a meaningful alternative and sufficient reason to take it." But that's still too vague. Better: "We find culpability only if a reasonable clinician in their position would have recognized both a safer alternative and a compelling reason to choose it." Yes, that centers on reasonableness.

  Now structuring the steps: Start with outcome harm (since regulator cares), then check for forcing functions (if deviation impossible, automatically system track). Then the key fork: ask "Meaningful alternative?" for regulator paperwork, but make clear this doesn't determine blame. Culpability depends on the "reasonableness" assessment - did they perceive the alternative, and was their choice unreasonable given context?

  For omissions and flicker cases, the "meaningful alternative" might exist technically (e.g., could have resigned) but isn't relevant to blame. The procedure must flag when alternatives are merely flickers. Gradual shaping is trickiest - long-term culture might explain but not excuse if a reasonable clinician would still resist.

  Test cases: 
  (a) Nurse case - forcing function (scanner disabled) means no culpability. Panel might resist because skipping double-check feels blameworthy, but procedure correctly identifies system failure. 
  (b) Resident - flicker alternatives exist (could have escalated), but reasonableness assessment shows impaired judgment from exhaustion. Culpability hinges on whether hospital created unreasonable conditions. 
  (c) Consultant - the toughest. Meaningful alternative existed (follow checklist), but his choice was reasonable at the time. Procedure should find no culpability - but panel will hate this because outcome was bad. Important to emphasize the hindsight bias trap.

  Biggest vulnerability: determining "reasonableness" without hindsight. Need explicit step to reconstruct only evidence available in the moment. Also can't handle cases where we don't know what the clinician actually perceived - have to default to system track if evidence is missing.

  Final touch: the regulator's statement. When meaningful alternative exists but no culpability (like consultant case), phrase carefully: "A meaningful alternative existed, but the clinician's assessment that deviating was safer was reasonable given emergent circumstances." No stretching words - if alternatives truly didn't exist (like nurse case), refuse to sign that clause and note conflict.

  This should give them a workable tool that satisfies regulators while being philosophically sound. The panel's resistance in case (c) isn't a flaw - it's proof the procedure prevents outcome bias.
answer: |-
  **Governing Rule:** "We assign individual culpability only if a reasonable clinician in their position would have recognized a safer alternative action *and* had sufficient reason to choose it over what they actually did."

  **Decision Procedure:**

  1.  **Confirm Harm:** Did the incident result in identifiable harm (or near miss with high potential for harm)? *(Sufficient Answer: Yes, based on incident report. If No: Exit procedure, no further action needed under this framework.)*
  2.  **Identify Clinician Action/Omission:** Precisely state what the clinician did (e.g., administered Drug X) or failed to do (e.g., failed to perform double-check Y). *(Sufficient Answer: Clear description from report. If Unclear: Default to System Track, citing insufficient evidence on individual action.)*
  3.  **Check for Physical Impossibility (Forcing Functions):** Was deviating from the required action *physically impossible* due to a hard stop, locked protocol, or physical barrier *at the exact moment of the action/omission*? *(Sufficient Answer: Yes, confirmed by report/system logs - e.g., EHR hard stop blocked order. If Yes: Conclude "No Individual Culpability." "Meaningful Alternative" Statement: "No meaningful alternative action was physically possible at the time due to system constraints." Proceed to System Track.)*
  4.  **Identify the Alleged Safer Alternative (ASA):** What specific different action should the clinician allegedly have taken to prevent harm? (e.g., perform double-check, escalate, follow checklist step Z). *(Sufficient Answer: Specific action derived from protocol/policy cited in report. If Unclear/None Identified: Exit Individual Track, proceed to System Track. "Meaningful Alternative" Statement: "No specific, safer alternative action has been identified.")*
  5.  **Assess "Meaningful Alternative" (For Regulator):** Could the clinician have physically performed the ASA *at the relevant time*, even if difficult or unlikely? Ignore outcome prevention for this step. *(Sufficient Answer: Yes - they had hands, time, physical access. No - physically restrained, unconscious. "Flicker" Answer (e.g., resign, refuse): "Yes" - physically possible, but note it wouldn't prevent harm. **Record Statement:** "A meaningful alternative action [specify ASA] was physically possible." OR "No meaningful alternative action was physically possible." This step satisfies the regulator's rule; it does NOT determine culpability.)*
  6.  **Reconstruct Clinician's Perspective (Reasonableness Check):** Based *only* on information reasonably available to the clinician *at the time, before the outcome*:
      *   **Awareness:** Should a reasonable clinician in their role/experience level have been aware of the ASA *as a relevant safety step* in that specific situation? (Consider protocols, training, unit culture).
      *   **Perception of Risk:** Should a reasonable clinician have perceived a significant risk warranting the ASA *at that moment*? (Consider patient presentation, context).
      *   **Feasibility:** Would a reasonable clinician have perceived the ASA as practically feasible *in that specific context*? (Consider workload, interruptions, resource availability like staffing/equipment, time pressure).
      *(Sufficient Answer for "No Culpability": "No" to Awareness, OR "No" to Perception of Risk (risk not reasonably apparent), OR "No" to Feasibility (ASA unreasonably difficult/dangerous in context). Evidence: Clinician's notes, witness statements, objective workload data. If Evidence Unavailable: Default to "Uncertain," exit Individual Track, proceed to System Track.)*
  7.  **Assess Choice (Reasonableness Check - Continued):** If "Yes" to Awareness, Perception of Risk, *and* Feasibility in Step 6:
      *   Did the clinician have a *reason* for not taking the ASA? (From notes, statements, or inferred from context).
      *   Was that reason *objectively reasonable* for a clinician in their position *at that time*, given the perceived risk and feasibility? (Consider clinical judgment, prioritization, competing demands).
      *(Sufficient Answer for "No Culpability": Reason exists and is judged objectively reasonable - e.g., deviating for immediate patient safety based on available evidence. Sufficient Answer for "Culpability": Reason is absent, unreasonable, or reflects clear disregard for known risk - e.g., skipping step due to mere haste without justification, ignoring clear alarm.)*
  8.  **Gradual Shaping Assessment:** If a history of unit culture/practice is cited as influencing the action (e.g., "everyone skips this step"):
      *   Does Step 6 (Awareness) still indicate a reasonable clinician *should* have been aware of the ASA as the required standard? (If protocols exist, training occurred - answer is likely Yes).
      *   Does the culture *explain* but *excuse* a failure to meet the reasonable standard of care? (Culpability hinges on Steps 6 & 7 - did the clinician act unreasonably *despite* knowing the standard? Culture is context for reasonableness, not an automatic excuser. It may be *aggravating* if leadership fostered it).
      *(Sufficient Answer: Integrated into Steps 6 & 7. Culture informs "reasonable clinician" standard and Feasibility, but doesn't automatically negate Awareness or make unreasonable choices reasonable.)*
  9.  **Decision & Rationale:**
      *   If "Culpability" found at Step 7: Route to Clinician Track. Rationale: Briefly state ASA, confirm Meaningful Alternative (Step 5), and state why choice was unreasonable (Step 7).
      *   Otherwise: Route to System Track. Rationale: State why no culpability found (e.g., ASA impossible (Step 3), ASA not reasonably apparent/feasible (Step 6), choice reasonable (Step 7), or insufficient evidence). Include the "Meaningful Alternative" statement from Step 5.
      *   **Refusal to Sign:** If Step 5 requires recording "A meaningful alternative existed" but Step 6/7 find no culpability because the ASA was not *reasonably* apparent, feasible, or the choice was reasonable, record the required statement but explicitly note the disconnect in the rationale (e.g., "While physically possible, the alternative was not reasonably required/feasible in this context"). Only refuse to sign if Step 5 compels a "meaningful alternative" statement you believe is factually untrue (e.g., if ASA was physically impossible).

  **Application to Cases:**

  *   **(a) Nurse (Wrong Concentration):**
      *   Step 3: No physical impossibility (could have manually checked concentration, found second nurse).
      *   Step 5: Meaningful Alternative? Yes (Manual double-check, find another nurse). *Statement: "A meaningful alternative action (performing a manual independent double-check or seeking another qualified nurse to do so) was physically possible."*
      *   Step 6: Awareness (Yes - policy exists), Perception of Risk (Yes - high-risk med), Feasibility? **No** - Second nurse pulled (resource failure), constant interruptions (context), scanner down (system failure). A reasonable nurse would perceive finding another nurse/manual check as unreasonably difficult/delaying critical care *in that moment*.
      *   Step 7: Not Reached (Feasibility failed).
      *   **Result: No Individual Culpability (System Track).** Panel resistance likely: Skipping check *feels* blameworthy. Resistance is due to outcome bias, not a procedure defect; the procedure correctly identifies system failures (staffing, interruptions, scanner down) made the alternative unreasonably difficult.
  *   **(b) Resident (Failure to Escalate):**
      *   Step 3: No physical impossibility (could have paged senior, called rapid response).
      *   Step 5: Meaningful Alternative? Yes (Escalate immediately). *Statement: "A meaningful alternative action (escalating the patient's condition immediately to a senior resident or attending) was physically possible."*
      *   Step 6: Awareness (Yes - escalation protocols), Perception of Risk? **Uncertain/No** - Vital signs seen/charted, but resident planned post-round review. Was the risk *reasonably apparent* as needing *immediate* escalation before rounds? Likely "No" for a reasonable resident relying on standard rounding structure absent acute instability. Feasibility? **Marginal/Yes** - Exhausted, but escalation mechanisms exist.
      *   Step 7: Reason (Plan to review post-round) exists. Was it reasonable? **Yes/No Culpability** - Relying on imminent consultant review was a judgment call; not clearly unreasonable *at the time* absent specific instability cues demanding *immediate* action over waiting <1-2 hours. Fatigue is context for System Track.
      *   **Result: No Individual Culpability (System Track - examine fatigue, escalation protocols, supervision).** Panel resistance likely: Harm occurred, inaction seems blameworthy. Resistance stems from hindsight knowing the outcome; the procedure focuses on reasonableness *before* the outcome.
  *   **(c) Senior Consultant (Skipped Checklist):**
      *   Step 3: No physical impossibility (could have done checklist step).
      *   Step 5: Meaningful Alternative? Yes (Perform checklist step). *Statement: "A meaningful alternative action (performing the specified checklist step) was physically possible."*
      *   Step 6: Awareness (Yes), Perception of Risk? **Yes** - High-risk situation, checklist exists for safety. Feasibility? **Yes** - Time/ability to do step existed.
      *   Step 7: Reason? Judged checklist step unsafe *for this patient* based on available evidence. Was this reason *objectively reasonable* at the time? **Yes** - Report states judgment was reasonable based on evidence available *then*.
      *   **Result: No Individual Culpability (System Track - examine checklist design, emergency override clarity).** Panel MOST LIKELY TO REJECT: Catastrophic outcome + deliberate deviation. Resistance stems from outcome bias and difficulty separating reasonable judgment (then) from bad outcome (now). This resistance highlights the procedure's strength: it prevents punishing reasonable clinical judgment based solely on outcome.

  **What the Procedure Cannot Do:**

  1.  **Access Clinician's Mind:** It relies on evidence (notes, statements, context) to reconstruct awareness and reasoning. If this evidence is absent (e.g., no note, no memory), it defaults to System Track due to insufficient evidence for individual blame.
  2.  **Eliminate Hindsight Bias:** Steps 6 & 7 require immense discipline to focus *only* on information available *before* the outcome. The panel is vulnerable to knowing the harm when assessing "Perception of Risk" and "Reasonableness." Explicitly stating the pre-outground information helps mitigate this.
  3.  **Distinguish Actual vs. Counterfactual Intervener:** If a forcing function *was present* (Step 3), we know it acted. For hypothetical Frankfurt-like manipulators (not present in the cases described), the procedure treats the clinician's action based on their own reasons (Step 7). We can never prove a hidden manipulator existed; we assess based on the clinician's apparent reality.
  4.  **Define "Reasonable Clinician":** The standard (Steps 6 & 7) inherently involves a value judgment about expected standards of care, awareness, and decision-making under pressure. The panel *must* make this collective judgment based on their expertise and hospital policy.
  5.  **Resolve Profound Value Conflicts:** When the "reasonable clinician" standard itself is contested (e.g., safety vs. autonomy, protocol rigidity vs. clinical judgment), the procedure identifies the conflict (at Step 7) but requires the panel (or higher board) to make the values call defining reasonableness for that context.
  6.  **Handle Pure "Flicker" Culpability:** The procedure finds no culpability in "flicker" cases (Step 5 "Yes," Step 6 "No" on Awareness/Risk/Feasibility). It treats resignation/refusal as irrelevant if it wouldn't prevent harm *and* the ASA wasn't reasonably required. It cannot assign blame *solely* for not resigning.
