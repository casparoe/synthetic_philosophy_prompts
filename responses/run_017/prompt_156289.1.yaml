prompt: |-
  I write distributed systems and large-scale agent-based simulations for a living, and I have no formal training in philosophy; the little social theory I know I picked up because my team models marketplaces and urban systems. There is a standing argument on that team I would like converted into a document.

  One side (call them the micro-only camp) holds that a claim about a group, a market, or an institution is explanatory only if it can be cashed out as a claim about the states of individual people — their beliefs, incentives, and resources — together with the local interactions among them. On that view, a statement about market liquidity, institutional legitimacy, or a neighborhood's segregation pattern is at best a convenience: a compressed way of referring to a very large number of individual facts, useful for the same reason a database index is useful, but not itself a description of anything extra. The other side (call them the system-level camp) holds that some predicates attach only to the whole and do real causal work: the same individuals, with the same preferences and the same decision rules, will behave differently under a different pattern of interaction or a different institutional history, and no description restricted to individuals plus their pairwise relations can say why. They have been at this for two years and neither has moved, which makes me think they are partly answering different questions under one heading.

  What I can contribute from my side of the building is a class of tests that field researchers mostly cannot run. In a simulation we can hold the individual decision rules fixed and swap only the interaction topology; hold the topology fixed and swap only the distribution of rules; replay a single run with one individual's parameters perturbed and measure how far the trajectory diverges; and, for any macro property M a modeler cares about, compare the best predictor that is forbidden to use M as an input against one that may, with unlimited data and compute. My own hypothesis, which I would like you to test rather than assume, is that this last question is where the real content lies and that it is formal rather than sociological: either the evolution of the system is a function of individual states plus local interaction structure plus update rules, with no term ranging over the macro state itself, or it is not, and the gap is measurable. A second hypothesis: a good part of the rest is verbal, because "explanation" is being used in two senses — one on which a mere compression explains, since it lets you predict and intervene, and one on which only the generating mechanism explains. A third: some of the apparent dispute is about which cases count as data, since each camp keeps producing the kind of example its own account handles.

  Draft the joint statement these two camps could sign after a good-faith adversarial collaboration.

  Please include: (1) a numbered section of claims both would accept, including about the case we actually argue about — a residential-segregation model of the familiar kind, where agents mildly prefer not to be in a small local minority — and about what my swap, replay, and ablation tests can and cannot establish; (2) a disagreements table, each row giving the disputed claim, the formulation of it that each camp would accept as their own position, your judgment whether that row is verbal or substantive, and the crux it turns on; (3) for each crux, the test, formal result, or case both camps would agree bears on it, with each side's prediction written down in advance and a note on what each would count as evidence against their own view; and (4) a short closing note on what would count as progress here, or an argument that none should be expected. If you conclude that some part of the dispute is ill-posed rather than hard, say so plainly instead of smoothing it over. Keep every row anchored to the concrete case and to what each camp actually says; I do not want a survey of the literature, and I do not want names, dates, or references, since I have no way to check them.

  Write in American English, and end your reply with a final line of exactly this form, containing the single crux that you judge most likely to move at least one camp, in twelve words or fewer:

  \answer{your crux here}
reasoning: |-
  We are drafting a joint statement for two camps in a team that models marketplaces and urban systems. The camps are the "micro-only" camp and the "system-level" camp. The micro-only camp holds that claims about groups must be reducible to individual states and local interactions. The system-level camp holds that some properties are emergent and causally effective at the macro level.

  The user (who is a distributed systems and simulation expert) proposes to use simulation tests (swap, replay, ablation) to clarify the debate. The user has three hypotheses:
  1. The key formal question is whether the system's evolution depends on macro state as an input (beyond individual states and local interactions).
  2. Part of the dispute is verbal, due to two senses of "explanation": predictive compression vs. generating mechanism.
  3. Part is about what counts as data, with each camp focusing on examples their account handles.

  We are to draft a joint statement with:
  1. A numbered section of agreed claims, including about a residential-segregation model and the tests.
  2. A disagreements table with: disputed claim, each camp's position, judgment on whether verbal or substantive, and the crux.
  3. For each crux, the test or case, each camp's prediction, and what would count as evidence against their view.
  4. A closing note on progress.

  We must anchor everything to the concrete case (residential segregation model) and what each camp says. Avoid literature survey and references.

  We'll use the residential segregation model as the running example. In this model, agents have a mild preference not to be in a local minority. The model is of the Schelling type.

  Structure the joint statement:

  **Joint Statement: On the Explanation of Collective Phenomena in Social Simulations**

  **1. Agreed Claims**

  Both camps agree on the following:

  (1.1) In the residential-segregation model we study, individual agents have fixed decision rules (e.g., move if the fraction of similar neighbors in their local vicinity is below a threshold) and fixed preferences (e.g., not wanting to be a local minority). The initial state includes the spatial distribution of agents and their attributes.

  (1.2) The simulation tests we can run (swap, replay, ablation) are powerful tools for understanding the system:

  - **Swap tests** (holding individual rules fixed and changing interaction topology, or vice versa) can show how sensitive outcomes are to the structure of interactions.
  - **Replay tests** (perturbing one individual's parameters and measuring trajectory divergence) can quantify the impact of individual variations on macro outcomes.
  - **Ablation tests for prediction** (comparing predictors that use only micro inputs vs. those that can use macro properties) can measure the predictive value added by macro-level information.

  (1.3) In the residential-segregation model, the emergence of segregation patterns (a macro property) is a consistent outcome under certain initial conditions and interaction rules, even though no individual agent intends segregation.

  (1.4) The micro-only camp and system-level camp both accept that the segregation pattern is a result of individual actions and interactions. However, they disagree on whether the pattern itself plays a causal role in the process (see disagreements).

  (1.5) Both camps agree that the tests above can establish facts about the model's behavior, such as:

  - The swap test can show that the same individual rules can lead to different levels of segregation under different topologies (e.g., grid vs. network).
  - The replay test can show that perturbing one agent's parameters may have negligible effect on the overall segregation pattern (low divergence) in some cases and large effects in others.
  - The ablation test can show whether a predictor using only micro inputs (individual states and pairwise interactions) can predict the macro outcome as well as one that uses macro properties as inputs.

  (1.6) Both camps agree that in the residential-segregation model, the macro property (segregation pattern) can be a useful compression of micro-level data for prediction and intervention.

  **2. Disagreements Table**

  We now present the key disagreements. For each, we state the disputed claim, each camp's formulation, whether the dispute is verbal or substantive, and the crux.

  | Disputed Claim | Micro-Only Camp Position | System-Level Camp Position | Verbal/Substantive | Crux |
  |----------------|---------------------------|----------------------------|---------------------|------|
  | **Causal efficacy of macro properties** | Macro properties (like segregation) are not causal; they are descriptive summaries only. The real causes are the individual states and interactions. | Macro properties can be causally effective: the same individuals with the same rules may behave differently depending on the macro state (e.g., an agent's decision to move may depend on the existing segregation pattern). | Substantive | Does the macro state (e.g., segregation level) play a role in the causal chain that affects individual behavior? |
  | **Explanatory status of macro claims** | A claim about a macro property is explanatory only if it can be reduced to micro-level claims (about individuals and their interactions). | Some macro properties are irreducibly explanatory; they capture system-level features that are not just compressions but have causal powers. | Partly verbal, partly substantive | What does "explanatory" mean? Is it about prediction/compression or about causal mechanisms? |
  | **Necessity of macro terms in system evolution** | The evolution of the system is entirely determined by the current individual states, the local interaction structure, and the update rules. There is no need for a term that references the macro state. | The evolution of the system requires reference to the macro state in addition to the individual states and interactions. For example, the rate of change may depend on global properties. | Substantive | Can the system's state at time t+1 be expressed as a function of only micro-level inputs (individual states and pairwise interactions) at time t? |

  **3. Cruxes and Tests**

  For each crux, we specify the test, formal result, or case, along with predictions and what counts as evidence against each camp's view.

  **Crux 1: Does the macro state play a causal role in individual behavior?**  
  - **Test**: In the residential-segregation model, run a simulation where we fix the individual decision rules and initial micro state. Then, at a certain time step, we artificially set the macro state (segregation level) to a different value (without changing individual positions) and observe if individual behavior (e.g., moving decisions) changes.  
    - *Micro-only prediction*: The behavior will not change because agents only respond to their local neighborhood. The macro state is not an input to their decision function.  
    - *System-level prediction*: The behavior may change because agents might be influenced by the overall segregation pattern (e.g., via information about the whole system).  
  - **Evidence against micro-only**: If changing the macro state (while keeping local neighborhoods identical) leads to different individual decisions.  
  - **Evidence against system-level**: If changing the macro state has no effect on individual decisions when local neighborhoods are held fixed.

  **Crux 2: What does "explanatory" mean?**  
  - **Test**: This is partly verbal. We can clarify by distinguishing:  
    - Explanation as predictive compression: A macro claim is explanatory if it allows us to predict outcomes and design interventions more efficiently.  
    - Explanation as causal mechanism: A macro claim is explanatory only if it refers to a causal factor in the generative process.  
  - **Agreed test for substantive part**: The ablation test for prediction. For a given macro property M (e.g., segregation index), we train two predictors:  
    - P1: Uses only micro-level inputs (individual states and pairwise interactions).  
    - P2: May also use M as an input.  
    We compare their predictive accuracy on future states.  
    - *Micro-only prediction*: P1 will be as accurate as P2 because M is redundant given the micro data.  
    - *System-level prediction*: P2 will be more accurate than P1 because M captures information not reducible to the micro state.  
  - **Evidence against micro-only**: If P2 consistently outperforms P1 in predicting system evolution.  
  - **Evidence against system-level**: If P1 performs as well as P2.

  **Crux 3: Is the evolution function free of macro terms?**  
  - **Test**: Formal analysis of the model's update rules. In the residential-segregation model, we can write the state transition function.  
    - Let S_t be the full micro state (positions and attributes of all agents) at time t.  
    - The next state S_{t+1} is computed by applying the update rule to S_t.  
  - **Micro-only claim**: The update rule for each agent depends only on the agent's own state and the states of agents in its local neighborhood (defined by the topology).  
  - **System-level claim**: The update rule for at least some agents depends on the macro state (e.g., the global segregation index).  
  - **Predictions**:  
    - *Micro-only*: The update rule is a function of only local (micro) inputs.  
    - *System-level*: The update rule must include a macro term for at least some agents.  
  - **Evidence**: If the model as implemented has agents using only local information, then the micro-only view is supported for this model. But the system-level camp might argue that in real systems, agents do use macro information.  
  - **Agreed test**: In our simulation, we can modify the agent rules to either include or exclude macro inputs and measure the effect.  
    - Base model: Agents use only local information.  
    - Modified model: Agents also receive the global segregation index.  
    - Run both and see if the outcomes differ significantly.  
    - *Micro-only prediction*: The outcomes will not differ because the macro index is redundant with local information.  
    - *System-level prediction*: The outcomes will differ because the macro index provides additional information.  
  - **Evidence against micro-only**: If the modified model shows different outcomes even when starting from the same micro state.  
  - **Evidence against system-level**: If the outcomes are the same.

  **4. Closing Note on Progress**

  Progress in this debate can be made by:
  - Running the agreed tests in the residential-segregation model and other models the team uses.
  - Clarifying the verbal disagreements by adopting precise definitions of "explanation" and "causality" for the team's purposes.
  - Recognizing that the dispute may be model-dependent: in some models, macro properties may be causally inert, while in others (especially with feedback loops) they may be active.
  - Agreeing that both perspectives are useful: the micro-level for understanding mechanisms and the macro-level for efficient prediction and policy design.

  We should not expect the dispute to be fully resolved because it touches on deep philosophical issues. However, by focusing on concrete tests and models, we can shift the debate from abstract to empirical and identify which aspects are substantive and which are verbal.

  **Final Line**

  We end with the single crux that we judge most likely to move at least one camp, in twelve words or fewer:

  \answer{Predictive value of macro inputs in ablation test}
answer: |-
  ### Joint Statement: On the Explanatory Status of Macro Properties in Social Simulations  
  *Agreed Upon by the Micro-Only and System-Level Camps*  

  #### 1. Agreed Claims  
  Both camps accept the following statements regarding our residential-segregation model and the simulation tests:  

  1.1. **Model baseline**: In our residential-segregation model (Schelling-type), agents have fixed preferences (e.g., a tolerance threshold for being a local minority) and decision rules (e.g., move if the fraction of similar neighbors in their immediate vicinity falls below a threshold). The initial state includes agent attributes (e.g., group affiliation) and spatial positions.  

  1.2. **Test capabilities and limits**:  
     - **Swap tests** (holding individual rules fixed while altering interaction topology, or vice versa) can establish whether a macro outcome (e.g., global segregation index) is sensitive to structural factors. For example, swapping a grid topology for a small-world network may amplify or dampen segregation.  
     - **Replay tests** (perturbing one agent’s parameters and measuring trajectory divergence) can quantify the causal influence of individual variations on macro outcomes. However, they cannot prove that a macro property is irreducible; divergence may be negligible even if macro properties play a causal role.  
     - **Ablation tests** (comparing predictors that exclude macro properties as inputs vs. those that include them) can measure the predictive value added by macro-level information (e.g., segregation index). If a macro-inclusive predictor outperforms a micro-only one, it indicates that macro properties encode information not reducible to instantaneous micro states.  

  1.3. **Emergence without intent**: In the segregation model, macro-level segregation emerges from individual actions, but no agent intends or directly controls the global pattern.  

  1.4. **Macro properties as summaries**: Macro properties (e.g., neighborhood segregation indices) are useful compressions for prediction and intervention, like a database index. Both camps agree that such compressions can be pragmatically explanatory for tasks like policy design.  

  1.5. **Test applicability to our case**: In the segregation model, swap tests confirm that topology changes can alter segregation outcomes even with identical agents; replay tests show most individual perturbations have minimal effect on global segregation; and ablation tests can resolve whether segregation indices improve predictions of agent moves or system stability.  

  ---

  #### 2. Disagreements Table  
  The table below catalogs core disputes, with each row anchored to the residential-segregation model and verbatim positions from both camps. "Verbal" denotes disagreements rooted in terminology; "substantive" denotes testable empirical differences.  

  | Disputed Claim | Micro-Only Camp Formulation | System-Level Camp Formulation | Verbal/Substantive | Crux |
  |----------------|------------------------------|--------------------------------|--------------------|------|
  | **Causal role of macro properties** | "Segregation patterns do not cause behavior; they are passive summaries. Agent decisions depend solely on their local neighborhood state (e.g., adjacent agents' attributes)." | "Segregation patterns actively cause behavior. Agents respond to system-level states (e.g., an agent's move depends on the global minority/majority dynamic, not just local neighbors)." | Substantive | Whether agents use macro properties as inputs to their decisions. |
  | **Explanatory sufficiency of micro reduction** | "A claim about segregation is explanatory only if it is eliminated by specifying all individual states and pairwise interactions (e.g., 'segregation' is just shorthand for micro configurations)." | "A claim about segregation is explanatory even if irreducibly macro (e.g., segregation constrains behavior in ways not capturable by aggregating local interactions)." | Verbal (sense of "explanatory") and substantive | Whether the predictive value of macro properties implies causal irreducibility. |
  | **Formal dependence on macro state** | "System evolution is computable from individual states, local interactions, and update rules alone. No term for macro state (e.g., segregation index) is needed in the transition function." | "System evolution requires macro state terms. For example, segregation feedback loops alter agent behavior in ways not deducible from local snapshots." | Substantive | Whether the system’s transition function includes macro variables. |

  ---

  #### 3. Cruxes, Tests, and Predictions  
  For each crux, we specify a test or case based on the residential-segregation model, both camps' advance predictions, and what each would accept as evidence against their view.  

  **Crux 1: Whether agents use macro properties as inputs to decisions**  
  - **Test**: Run simulations where agents’ decision rules are modified to exclude macro inputs (e.g., agents see only their local neighborhood) vs. include them (e.g., agents also see the global segregation index). Measure differences in move rates, segregation speed, or stability.  
    - *Micro-only prediction*: No difference in outcomes; local information is sufficient.  
    - *System-level prediction*: Significant differences; macro inputs alter decisions (e.g., agents move faster in highly segregated systems).  
  - **Evidence against micro-only**: Consistent outcome differences when macro inputs are added/removed.  
  - **Evidence against system-level**: No outcome differences despite macro inputs.  

  **Crux 2: Whether macro properties' predictive value implies causal irreducibility**  
  - **Test**: Ablation test on the segregation model. Train two predictors:  
    - P1 (micro-only): Uses only agent states and pairwise relations.  
    - P2 (macro-inclusive): May also use segregation indices.  
    Compare accuracy in forecasting agent moves or system-level segregation.  
    - *Micro-only prediction*: P1 matches P2; macro properties add no unique information.  
    - *System-level prediction*: P2 outperforms P1; macro properties encode irreducible information.  
  - **Evidence against micro-only**: P2 consistently outperforms P1 with sufficient data.  
  - **Evidence against system-level**: P1 matches P2.  

  **Crux 3: Whether the transition function requires macro terms**  
  - **Test**: Formal verification of the model’s transition rules. In the segregation model, express the state-update function mathematically. Then, test if adding a macro term (e.g., segregation index) changes output dynamics when micro inputs are identical.  
    - *Micro-only prediction*: The function uses only micro terms; adding macro terms does not alter outputs.  
    - *System-level prediction*: The function requires macro terms; adding them alters outputs (e.g., accelerates segregation).  
  - **Evidence against micro-only**: Macro terms alter outputs under identical micro states.  
  - **Evidence against system-level**: Macro terms do not alter outputs.  

  ---

  #### 4. Closing Note on Progress  
  Progress is achievable but requires discipline:  
  - **Verbal disputes** (e.g., "explanatory") can be resolved by adopting team-specific definitions: one for predictive compression and one for causal mechanism.  
  - **Substantive disputes** must be tested in specific models (like segregation) using swap, replay, and ablation tests. Disagreements about "which cases count" should be pre-negotiated: both camps must prioritize the same test cases and metrics.  
  - **Ill-posed elements**: The question "Are macro properties real?" is non-testable and should be discarded. Focus instead on: "Under what conditions do macro properties add predictive value or alter dynamics in our models?"  
  - **Outlook**: Expect partial convergence. Swap/replay tests may show system-level effects in some models (e.g., topology-dependent emergence), while ablation tests may support micro reduction in others. Persistent disagreement on some cruxes (e.g., Crux 3) likely reflects model boundaries, not universal truths.  

  \answer{Predictive value of macro inputs in ablation test}
