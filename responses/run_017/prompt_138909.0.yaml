answer: |-
  **BRACTON & FELL INTERNAL STYLE GUIDE: REPUBLIC OF SAN MERIDIO NATIONAL TRADITION IMPLEMENTATION (v2.1 - CONFIDENTIAL)**

  **Project:** San Meridio Nationhood Fabrication (SMNF)
  **Client:** Provisional Directorate, Republic of San Meridio
  **Date:** 10/27/2023
  **Owner:** Tradition Design & Implementation Unit (TDIU)

  **1.0 Purpose:** This guide defines mandatory protocols for designing, deploying, and measuring San Meridio’s national traditions ("Deliverables"). Adherence ensures Deliverables achieve core objectives: fostering collective identity ("We-Feel"), ensuring perceived continuity ("Deep Roots"), and minimizing cognitive dissonance regarding origin ("Plausible Deniability"). Deviations compromise ROI and project viability.

  **2.0 Core Definitions & Distinctions:**
      2.1 **Tradition (Invariant):** A formal, repeatable action (ceremony, observance) requiring strict adherence to script, timing, symbols, and emotional register. Must feel obligatory, non-negotiable, and exist "outside time." *Example:* Founders' Vigil (See 5.3). *KPI:* Zero recorded variations in execution Y1.
      2.2 **Custom (Flexible):** A habitual practice (greeting styles, foodways, dress codes) permitting organic variation and personal interpretation. Serves as background texture, reinforcing Tradition through ubiquity without rigidity. *Example:* "Meridian Blue" accent colors (optional saturation). *KPI:* >65% population adoption within 12 months.
      2.3 **Critical Distinction:** Traditions *must not* be perceived as "invented." They are **revivals** (Sec 4.0). Customs can acknowledge recent emergence ("evolving Meridian style").

  **3.0 The "Revival" Imperative:**
      3.1 All Traditions *must* be framed as rediscoveries of suppressed or forgotten pre-Republic practices. Invention is a non-starter for legitimacy.
      3.2 Supporting narratives require "fragmented historical evidence" (archival "gaps," ambiguous folklore references) implying deep roots without providing verifiable dates. Target: Traditions perceived as "always-almost-existing."
      3.3 **Prohibition:** Never cite project inception (Q3 2023) or Bracton & Fell involvement in public-facing materials. The Directorate "facilitates remembrance."

  **4.0 Addressing the San Meridio Feed Challenge (Unique Risk Factor):**
  *   *Risk:* Absence of synchronous, shared public experience due to personalized feeds ("The Scatter") prevents simultaneous national imagining.
  *   *Mitigation Strategy: Asynchronous Synchronization.*
      4.1 **Staggered Rituals:** Core Traditions utilize temporal distribution.
          *   *Example (Founders' Vigil):* Algorithmically trigger a mandatory 3-minute silence within each citizen's peak engagement window (+/- 2hrs). Geo-fenced public spaces play standardized ambient soundscape during *their* local peak windows. *KPI:* >90% feed penetration during trigger window.
      4.2 **Anthem Delivery:** National Anthem ("Ode to the Unbroken Coast") delivered as high-priority, unskippable content during calculated individual peak emotional receptivity windows. Accompanying visual schema is invariant. *KPI:* Avg. completion rate >95%, sentiment analysis >4.2/5.
      4.3 **Friction Quotas:** Mandatory algorithms override ("Tradition Overrides") forcing citizens into physical or virtual proximity with demographically/algorithmically dissimilar peers ("Designated Others") during specific Custom-related prompts (e.g., "Local Recipe Exchange" pop-up requiring co-creation with a geographically distant partner). *KPI:* Minimum 2 forced interactions/citizen/month; diversity index target: 0.75.

  **5.0 Foundational Institutions (The Silent Imaginers):**
      5.1 **Census:** Primary tool for defining "The Meridian People." Categories must feel inevitable, not constructed. Emphasize unity ("Citizen" as sole mandatory field Phase 1) while allowing optional Custom-based sub-identifiers ("Coastal," "Highland") for texture. *Deliverable:* Census v1.0, launch Q1 2024.
      5.2 **National Map:** Establishes territory and symbolic geography. Standardize iconography for "historic" sites (Sec 6.0). Integrate Tradition locations as permanent features. *Deliverable:* Unified Cartographic Schema, approved Q4 2023.
      5.3 **National Museum:** Critical for materializing "antiquity." See Sec 6.0.

  **6.0 The Museum Problem & Solution Framework:**
  *   *Risk:* Public awareness of recent artifact fabrication (Project Start: Q3 2023) undermines "Deep Roots" narrative.
  *   *Solution: Provenance Scaffolding & Controlled Revelation.*
      6.1 **Staged Provenance:** Artifacts enter collection via "rediscovery narratives":
          *   Phase 1 (Now): "Recently unearthed during infrastructure projects" (minor, fragmentary items).
          *   Phase 2 (Q2 2024): "Donated by families safeguarding heritage during the Interregnum."
          *   Phase 3 (Q4 2024+): "Major archaeological find" (pre-fabricated complex site).
      6.2 **Controlled "Conservation":** Display items undergoing "multi-year conservation" behind glass. Emphasize the *process* of recovery, not instantaneous perfection.
      6.3 **Authenticity via Imperfection:** Artifacts must show "age-appropriate" wear/damage consistent with their fictional history. Flawless items trigger disbelief.
      6.4 **Narrative Focus:** Exhibits tell the story of *suppression and recovery*, not creation. The Directorate/Museum are heroes rescuing the past. *KPI:* Museum visit sentiment score focusing on "pride in preservation" not "age of object."

  **7.0 Risk Register Highlights:**
      *   **R1: Feed Algorithm Resistance:** Mitigation = TDIU override authority (Client Sign-off Secured).
      *   **R2: Citizen Skepticism (Origin):** Mitigation = Strict adherence to "Revival" framing (Sec 3.0), controlled provenance (Sec 6.0).
      *   **R3: Tradition Drift:** Mitigation = Algorithmic enforcement of invariance (Sec 4.1), public commendations for "correct" participation.
      *   **R4: Friction Quota Backlash:** Mitigation = Frame as "expanding Meridian horizons," gamify interactions with minor rewards.

  **8.0 Lessons Learned (From Alpha Traditions):**
      *   Explicit dates (e.g., "Est. 2023") are catastrophic for Tradition legitimacy. Remove immediately.
      *   Overly complex rituals fail under asynchronous conditions. Prioritize simplicity and clear audio/visual triggers.
      *   "Rediscovered" artifacts must enter circulation *before* the Museum opens to build pre-museum narrative plausibility.
      *   Friction Quota pairings require sophisticated algorithmic matching to avoid dangerous incompatibilities. Safety filters mandatory.

  **9.0 Success Metrics (12-Month Post-Launch):**
      *   **Primary KPI:** <10% of citizens can accurately state the approximate inception date of *any* major Tradition.
      *   **Secondary KPIs:** >80% participation rate in asynchronous Traditions; >0.7 National Sentiment Cohesion Index (NSCI); Museum ranked top 3 national institution for "trustworthiness."

  **10.0 Compliance:** Non-compliance with this guide constitutes a material breach of Bracton & Fell operational standards and jeopardizes client deliverables. Report deviations to TDIU Lead immediately.

  **//END DOCUMENT//**
