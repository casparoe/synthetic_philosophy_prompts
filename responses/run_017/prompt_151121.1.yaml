  First, I need to parse their half-formed thoughts. They suspect that heuristic predictions have two components: robust shapes dependent only on density and basic constraints, and fragile constants needing fine local details. The user wants to test this by varying dependence structures in toy models. Their challenge is framing this rigorously without overpromising.

  The user’s explicit needs are a structured five-point proposal, but their deeper aim is likely to legitimize their philosophical insight with mathematical rigor. They might fear their idea is merely relabeling existing knowledge, so the proposal must highlight novelty—perhaps by quantifying "independence-need" via adversary models or complexity conditions.

  For the five points: 
  (1) The question must isolate when predictions hold across all consistent dependence models versus only independent-like ones. 
  (2) Why it’s open: Current discourse dismisses independence as "false but harmless" without systematically testing robustness. 
  (3) Month-by-month: Start with simple models (twin primes), scale to adversarial dependencies, then test Goldbach-like systems. Coding feasibility is key—toy sieves allow controlled chaos. 
  (4) Failure would be if shape and constant fragility don’t align with buckets, or if all non-independent models break predictions. 
  (5) Deliverables: Classification of conjectures by robustness tiers and explicit counterexamples where possible. 

  I should caution that "all possible dependencies" is vast, but bounding it to low-complexity or symmetric models keeps it tractable. The user’s note about adversaries trying to break predictions is crucial—this could reveal hidden assumptions in heuristics. 

  Potential pitfalls: Overcomplicating the toy models or underestimating how wild dependencies could behave. But the user seems aware, mentioning "honest scope notes." Emphasizing partial results (e.g., "We found twin primes' shape is robust under X conditions") would suffice for three months. 

  Finally, the proposal must reject woolly philosophy—instead, positioning complexity conditions as the "real content" of heuristics answers the "why it matters" implicitly. Squeezing this into five tight points means sacrificing elegance for precision, but the user prefers that.
answer: |-
  Here’s the condensed proposal in five points:

  1.  **Question:** For probabilistic number theory heuristics, which predictions (e.g., twin prime counts) hold robustly across *all* dependence structures consistent with known prime density and local constraints, versus those requiring near-independence or specific fine structure?
  2.  **Why Open:** The standard "independence is false but the model works" account doesn't systematically test the *necessity* of independence or quantify how predictions vary under alternative, equally constraint-satisfying dependencies.
  3.  **Method/Monthly:** Month 1: Code toy random sieve models with tunable dependence. Month 2: Generate diverse dependencies (independent, clustered, adversarial) fixing density & local constraints, compute predictions (twin primes, gaps). Month 3: Test robustness of conjectures (shape/constant) across dependencies, identify breaking points.
  4.  **Failure Condition:** The framing is wrong if the shape/constant split *doesn't* correlate with robustness tiers, or if *no* plausible non-independent dependencies preserve predictions, showing independence is unexpectedly essential.
  5.  **Deliverable:** A classification of standard heuristics (twin primes, Goldbach, gaps) by robustness tier, explicit counterexample dependencies where predictions fail, and characterization of the minimal "complexity/symmetry" condition enabling prediction.
