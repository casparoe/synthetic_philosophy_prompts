prompt: |-
  hey — I'm putting in for one of those small three-month writing fellowships, and the form wants a one-page proposal, no bibliography (I'll slot citations in later if it gets funded). I want to write about the probabilistic heuristics people use in number theory: the move where you pretend each number n is prime independently with probability about 1/log n, read off a prediction — how many twin pairs, how many Goldbach representations — and then, if you're being careful, multiply by a correction factor for the local congruence stuff (past 2 everything is odd, that kind of thing).

  My half-formed idea, which I cant tell is deep or just a relabelling: that one move is secretly doing two jobs with different epistemic status. Job one is the *shape* — the exponent on the log, the order of magnitude. Job two is the *constant*. It feels like the shape is robust: assume the right overall density of primes, plus some no-conspiracy condition (exchangeability? max entropy given the known constraints? invariance under a symmetry group?) and you get the shape back whatever the dependence looks like. The constant seems to depend on the fine structure of the dependence and only gets pinned once you feed in the local obstructions.

  So here's what I want to propose: a way of measuring how much independence a given heuristic actually needs. Fix the class of dependence structures that reproduce everything we already know (right density, right residues mod small primes), state the target claim, and ask whether it holds for all of them, for a measure-one bunch, or only for the independence-ish ones. Then sort the standard conjectures into those buckets and see whether the shape/constant split lines up with the bucket split — or whether gap statistics and clustering land somewhere in the middle. Also: what stops an adversary from building a dependence structure that matches every fact we have and still breaks the prediction? If the answer is 'a complexity or symmetry condition', that condition is the real content of the heuristic.

  Can you turn that into a proposal? It needs a question with a determinate answer (none of this 'explore the nature of heuristic reasoning'), why the usual way people talk — independence is false but harmless, it's only a model — leaves it open, a method I could really run in three months (I can code a bit, so toy sieves where you can build genuinely weird dependence structures are fair game; trying to prove things about the actual primes would be way too big), a straight answer to what would count as the whole framing being wrong, and an honest scope note, since 'all dependence structures consistent with the constraints' is a scary object.

  Give it back as exactly five numbered items, one or two sentences each, no intro and no outro: (1) the question, (2) why it's still open given how people normally talk, (3) the month-by-month, (4) failure conditions, (5) what I'd have to show for the three months. Squeeze even if it feels cramped — that's about the size of the box on the form.
