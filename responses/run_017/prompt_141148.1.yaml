  Below is the constructed case that meets your specifications, followed by analysis addressing your four requirements. The scenario is grounded in a hospital setting, focusing on a senior nurse's observed behavior over 100 shifts. The key disputed feature is **Medication Double-Check Compliance (MDC)**, which tracks whether the nurse verifies high-risk medications with a second nurse (costly when done, risky when skipped).

