      Without urgent event: reward = w1*(0.8+2.0) + w2*0.5 + w3*1 = w1*2.8 + w2*0.5 + w3
      With urgent event: she will choose the action that maximizes the reward in that state. 
          Action A: w1*0.8 + w2*0.5 + w3
          Action B: w1*(0.8+2.0) + w2*0.5 = w1*2.8 + w2*0.5
          She chooses B if w1*2.8 > w1*0.8 + w3  =>  w1*2.0 > w3   [same condition as above]
