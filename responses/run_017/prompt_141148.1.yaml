      0.9 + 0.1 * P(A) = 0.9  => P(A)=0

  Therefore, the model requires that the probability of choosing action A in the urgent event state is 0. This happens when:

      exp(β * R(B)) >> exp(β * R(A))   =>   R(B) > R(A)

  Specifically, as β becomes large (if we assume perfect rationality), then we require R(B) > R(A). 

      R(B) > R(A)  =>  w1*2.2 + w3*0 > w1*0.2 + w3*1  =>  w1*(2.0) > w3

  So we have w1*2.0 > w3.

  But note: the assignment decision must also be explained. We observed that option2 is always chosen. We must compute the expected reward for option1 and option2.

  For option2:
      Without urgent event: reward = w1*2.2 + w2*0.9 + w3*1
      With urgent event: reward = R(B) = w1*2.2 + w2*0.9 + w3*0   (because she chooses B)
      Expected reward for option2: 0.9*(w1*2.2 + w2*0.9 + w3) + 0.1*(w1*2.2 + w2*0.9) 
                                  = w1*2.2 + w2*0.9 + 0.9*w3

