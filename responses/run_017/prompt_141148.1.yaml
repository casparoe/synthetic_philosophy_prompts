  1. w2 > 1.5 w1   (to explain assignment choice of option2)
  2. w1 * 2.0 > w3   (to explain choosing action B in urgent event)

  And we have the normalization: we set w2=1 (because we fix the scale by setting the weight on CoC to 1). Then:

  Constraint 1: 1 > 1.5 w1  =>  w1 < 2/3 ≈ 0.666
  Constraint 2: w3 < 2.0 * w1

