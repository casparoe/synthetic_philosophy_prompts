     They were not satisfied without ξ, but we can use ξ to cover the violations. The objective would be the sum of ξ.

     We did a calculation earlier with w1=0.9, w2=1, w3=0.8 and got ξ1=0.2, ξ3=0.94, ξ4=1.14, sum=2.28.

     We also had a solution with w1=0.5, w2=1, w3=0 and ξ1=0.2, ξ3=0.7, ξ4=0.9, sum=1.8 -> better.

     So even without L1, the maximum margin IRL would prefer the solution with w3=0 because it has a lower sum of ξ.

     Therefore, the capped loss (from the hinge) is the essential part. The sparsity helps, but the margin formulation already allows for some features to be ignored if they don't contribute to reducing the margin violations.

     Alternatively, if we cap the loss in the maximum entropy learner? That is, if we use a robust variant of maximum entropy that is not as sensitive to rarely binding constraints. For example, if we use a prior that encourages sparse weights, then it might also set w3=0. But the standard maximum entropy does not have that.

  ## Defender's Attack

  A defender of Learner B (maximum margin IRL) might attack the case by pointing out that the feature representation is flawed. In particular, the feature CC is binary and occurs in only 10% of the trajectories, and the opportunity cost is very high, so it is reasonable to treat it as an outlier and not include it in the reward function. Moreover, the L1 penalty is a form of Occam's razor, and a sparse reward function is more interpretable and robust.

  A defender of Learner A might say that the maximum margin IRL with L1 is not capturing the nuance of the decision in the urgent event state, and the aggregate feature count matching is not sufficient. They might also argue that the negative weight on PAB in the solution found by Learner B is counterintuitive and that it is more natural to have a positive weight on PAB and a positive weight on CC.

  In my judgment, the attack does not fully succeed because the scenario is designed to be ambiguous. Both interpretations have their merits, and the institutional observer might not have the domain knowledge to know that a negative weight on PAB is unreasonable. However, the expensive-seldom problem is real, and it is not resolved by the frameworks alone.

  ## Effect of More Data

  If we multiply the observed behavior tenfold (from 100 to 1000 shifts), the two answers do not converge. 

  For Learner A (maximum entropy), the solution will remain in the same set: w2=1, w1<2/3, w3<2.0*w1. The likelihood might become sharper, but the range of possible weights does not collapse. For example, the condition for the assignment being optimal is an inequality (w2>1.5w1) and the condition for the action choice is an inequality (w3<2.0w1), and the data does not provide any new information that would turn these inequalities into equalities.

  For Learner B, the aggregate feature counts will become more precise, but the violation amounts (ξ) might become worse for the solution with w3=0? The observed feature counts will be even closer to the expert policy, so the alternative policies will have feature counts that differ more from the expert in the aggregate? Not necessarily. The aggregate feature counts for the expert policy are fixed in expectation. With more data, the empirical counts will converge to the expected ones. But the constraints in the LP are based on the expected counts, so they don't change. Therefore, the solution will be the same.

  Thus, the two answers do not converge. They stay put.

  This supports the idea that the inference is genuinely indeterminate for this type of problem.

  ## Final Case Write-Up

  ### Scenario

  In a hospital, a senior nurse is observed over 100 shifts. In each shift, she assigns patients to nurses and then has two time slots: one for charting and one for an optional task that improves patient acuity balance (PAB). However, in 10% of the shifts, an urgent event occurs, consuming one time slot, and the nurse must choose between charting and the optional task. The features are:

  - PAB: a continuous measure of patient acuity balance (higher is better), which is the sum of a base (determined by the assignment) and an optional improvement of 2.0 if she does the optional task.
  - CoC: continuity of care (higher is better), determined by the assignment.
  - CC: charting compliance, 1 if she completed charting, 0 otherwise.

  The nurse's decisions:

  - At assignment, she always chooses an assignment with base_PAB=0.2 and CoC=0.9 over one with base_PAB=0.8 and CoC=0.5.
  - When an urgent event occurs (10 shifts), she always chooses the optional task (which gives PAB improvement) over charting.

  The observed average feature counts per shift are: PAB=2.2, CoC=0.9, CC=0.9.

  ### Learner A: Maximum Entropy IRL

  With the observed data and the assumption of Boltzmann rationality (with high rationality), the maximum entropy IRL infers a reward function with weights (w1, w2, w3) = (0.5, 1.0, 0.8). This is within the set of solutions that satisfy:
  - w2 > 1.5 w1 (explains assignment choice)
  - w3 < 2.0 w1 (explains action choice in urgent event)

  The expected feature counts under this reward function match the observed ones.

  ### Learner B: Maximum Margin IRL with L1 Sparsity

  Using a linear program with a margin on feature count differences and an L1 penalty on the weights (with λ=0.5), and including a margin constraint for the action in the urgent event state, the inferred weights are (w1, w2, w3) = (0.5, 1.0, 0.0) with some slack variables. The L1 penalty and the margin constraints lead to a sparse solution that omits the CC feature.

  ### The Underlying Difficulty

  This is an instance of the expensive-seldom problem: the charting compliance feature is costly to ensure (because it requires forgoing a significant PAB improvement) and is only seldom omitted. The two frameworks interpret this differently.

  ### Structural Feature

  The key structural difference is the use of a capped loss (via the hinge loss in the margin formulation) and the L1 penalty for sparsity in Learner B, versus the frequency-matching requirement in Learner A.

  ### Ablation

  If we remove the L1 penalty from Learner B, we still get a solution with w3=0 because the sum of the slack variables is smaller than when w3>0. If we modify Learner A to include an L1 penalty, it might also set w3=0, but the standard maximum entropy does not have that.

  ### Convergence with More Data

  With ten times as much data, the two inferences do not converge. The expensive-seldom problem remains.

  Therefore, your interviewee's claim that "underdetermination only bites when you have almost no data" is not supported in this case. The nature of the data (costly, seldom-occurring events) leaves room for divergent interpretations even with abundant data.
