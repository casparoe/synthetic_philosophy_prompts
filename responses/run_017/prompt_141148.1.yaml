  - Learner B (MaxMargin with L1): infers w3=0 because it can explain the data without using the CC feature by setting w1 negative (which is counterintuitive, but the L1 penalty and the margin constraints allow it to set w3=0 and use a negative weight on PAB) and the objective is lower.

