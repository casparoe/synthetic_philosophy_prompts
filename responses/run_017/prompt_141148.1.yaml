  So Learner B infers w3=0.

  ## The Expensive-Seldom Problem

  The scenario we built is an instance of the expensive-seldom problem. The feature CC is about an action (charting) that is costly in terms of opportunity cost (it forces forgoing a significant improvement in PAB) and is only seldom omitted (10% of the time). The two learners interpret this differently:

  - Learner A (matching feature counts) infers that the nurse cares about charting, and the only reason she ever omits it is when the alternative is sufficiently valuable (which happens seldom).
  - Learner B (with a capped loss via the hinge and a preference for sparse rewards) infers that the nurse does not care about charting at all, and the observed charting omissions are not significant enough to include a separate term, so they are treated as noise.

  ## The Structural Feature

  The key structural feature is the combination of the capped loss (in the hinge) and the sparsity penalty. However, note that in the maximum entropy IRL, there is no capping of the loss and it requires matching the feature counts. In the maximum margin IRL, the loss is capped because the hinge loss does not penalize deviations beyond the margin linearly (it is capped by the margin). But more importantly, the L1 penalty encourages setting weights to zero.

  ## Ablation

