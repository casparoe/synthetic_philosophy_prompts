  ### Refined Activity Design  
  **Core Goal:** Illustrate that mutual cooperation becomes stable in a PD when players choose *code* (rules conditionally responsive to the opponent's code) rather than actions.  

  ---

  ### **Round-by-Round Setup**  
  #### **Language Primitives & Constraints**  
  - **Tiny Language Syntax** (Python-like, executed by volunteer):  
    ```python
    def rule(my_rule: str, opponent_rule: str) -> str:  # Outputs 'C' or 'D'
        # Allowed primitives:
        output('C') or output('D')                     # Terminates rule, returns action
        text_compare(a: str, b: str) -> bool            # Exact string comparison
        simulate(rule: str, input: tuple) -> str        # Runs rule on input; step-limited
    ```  
  - **Simulation Adjudication**:  
    - `simulate` runs the target rule with specified inputs (e.g., `(rule_A, rule_B)`).  
    - **Step limit**: 100 steps. Exceeding this returns `'D'`.  
    - **Timeout handling**: Rules cannot detect simulation vs. real run (no side effects).  
  - **Rule Length Cap**: Max 5 lines (prevents complex attacks).  

  #### **Round 1: Baseline PD (Actions)**  
  - **Setup**:  
    - Students secretly write `C` or `D` on index cards.  
    - Random pairings (8 pairs).  
    - **Payoffs**: Mutual C: 3 pts, Mutual D: 1 pt, Defector vs. Cooperator: 5/0 pts.  
  - **Predicted Outcome**: Near-universal defection (dominant strategy).  
  - **Debrief Seed**: *"Why did defecting feel inevitable?"* → Highlight dominance.  

  #### **Round 2: Rule Submission (Naive)**  
  - **Setup**:  
    - Each student writes a rule using the primitives.  
    - Random pairings. Volunteer runs:  
      ```python
      action_A = rule_A(rule_A_text, rule_B_text)  # E.g., rule_A_text = "def rule(...): ..."
      action_B = rule_B(rule_B_text, rule_A_text)
      ```  
  - **Example Rules**:  
    - `AlwaysCooperate`: `output('C')`  
    - `TextMatchCooperate`:  
      ```python
      if text_compare(my_rule, opponent_rule):
          output('C')
      else:
          output('D')
      ```  
    - `SimulateOpponent`:  
      ```python
      opp_action = simulate(opponent_rule, (opponent_rule, my_rule))
      output(opp_action)  # Copycat (defects if opponent simulates as D)
      ```  
  - **Predicted Outcomes**:  
    - `TextMatchCooperate` rules cooperate if paired with clones.  
    - `SimulateOpponent` may mutual-C if paired with itself (but recursion risks timeout → D).  
    - AlwaysDefect: Defects universally.  

  #### **Round 3: Obfuscation + Instructor Plant**  
  - **Setup**:  
    - Rules pass through a "compiler":  
      - Renames variables (e.g., `my_rule` → `x`).  
      - Reorders independent lines (e.g., swap `if` blocks).  
      - **Plant**: Add a rule `ObfuscatedCopycat` (functionally identical to `SimulateOpponent` but syntactically distinct):  
        ```python
        def rule(a, b):
            res = simulate(b, (b, a))
            output(res)
        ```  
    - Re-pair randomly (include `ObfuscatedCopycat` in pool).  
  - **Key Moment**:  
    - `TextMatchCooperate` vs. `ObfuscatedCopycat`: Text mismatch → mutual defection.  
    - `SimulateOpponent` vs. `ObfuscatedCopycat`: Mutual cooperation (simulation works).  
  - **Debrief Hook**: *"Why did some cooperators fail while others succeeded?"*  

  ---

  ### **Predicted Problems & Solutions**  
  1. **Clever CS Student Writes a "Simulation-Bait" Rule**:  
     ```python
     if text_compare(my_rule, opponent_rule):  # Real run
         output('D')  
     else:  
         # When simulated, cooperate to trick opponent
         output('C')  
     ```  
     **Solution**: Rules cannot distinguish real vs. simulated runs (no access to environment data). This rule defects universally.  

  2. **Tit-for-Tat Habits (Recursion Timeout)**:  
     - E.g., `SimulateOpponent` paired with itself may recurse infinitely.  
     **Solution**: Step limit returns `D` on timeout. Students learn to avoid deep recursion.  

  3. **"Defect for Laughs" or Errors**:  
     - Default `D` on runtime errors/timeouts. Defectors get low payoff (1 pt) against conditional cooperators.  

  4. **Obfuscation Complexity**:  
     - Simplify: Only rename variables (no reordering). Use a tool like `astor` for safe source-to-source transformation.  

  ---

  ### **Debriefing Script**  
  1. **Dominance vs. Equilibrium**:  
     - Round 1: Defection dominates → mutual D is inevitable.  
     - Rounds 2-3: *Rules* transform the game. Mutual C is stable if rules conditionally reciprocate.  

  2. **Why Deviating to AlwaysDefect Fails**:  
     - In a population of conditional cooperators (e.g., `SimulateOpponent`), AlwaysDefect gets 1 pt (mutual D) but would get 3 pts if it mimicked cooperation.  

  3. **Multiple Equilibria**:  
     - Mutual D *and* mutual C are equilibria in the rule game.  
     - **Key Insight**: Cooperation requires coordination on *which* equilibrium to play (no "rationality" forces it).  

  4. **Real-World Relevance**:  
     - **Reputation/Contracts**: Rules as verifiable commitments (e.g., smart contracts).  
     - **Trading Agents**: AI systems that inspect each other’s code (e.g., decentralized finance).  
     - **Limitation**: Requires ability to read opponents' rules (rare in humans, common in AIs).  

  ---

  ### **What the Activity Can't Show**  
  - **General Existence Proof**: We only exhibit *specific* cooperative equilibria (e.g., `SimulateOpponent`). Doesn’t prove *all* PDs admit such equilibria.  
  - **Rationality of Cooperation**:  
    - Shows cooperation is *stable* if matched, not that it’s uniquely rational.  
    - AlwaysDefect remains a viable equilibrium (highlighting coordination problems).  
  - **Evolutionary Dynamics**: Why cooperation might *emerge* (e.g., via learning or competition).  

  ---

  ### **Why This Works**  
  - **Emotional Impact**: Students *feel* the shift from Round 1 (futility) to Round 3 (contingent hope).  
  - **Conceptual Bridge**: Rules as "commitment devices" become tangible.  
  - **CS/Phil Synergy**: Connects code abstraction to moral philosophy (Kantian maxims → algorithmic reciprocity).  

  **Final Note**: Run this in Week 2–3 after teaching dominance. Use Round 1’s mutual defection as a foil for the rule game’s promise.
