prompt: |-
  Hi. I'm the lay member on the animal welfare and ethics committee where I work — I've got no academic background in anything like this, I'm in estates management really, and I've just been reading about animal consciousness on my own in the evenings. Which probably shows. I've picked up that "can it feel pain" and "is it conscious" might be two or three different questions stacked on top of each other, and that reacting to a harmful stimulus isn't the same as minding about it — but I'm not confident I've got that right, so correct me if I've garbled it.

  The problem is practical. We meet once a month, get through eight or nine protocols in an afternoon, and for each one we have to (a) assign a severity band — roughly, nothing worth counting / mild / moderate / severe — and (b) decide how much scrutiny the thing gets: fast-track it, discuss it properly, or send it back. There's me, a vet, a couple of scientists and a chair. Nobody on the committee is a specialist in whatever species is on the table that week, and we can't go and read neuroscience papers between meetings. Whatever we decide goes on a form afterwards and has to be defensible if anyone asks us about it.

  What I want is a procedure, not a position paper. Something we can actually run on each protocol in the twenty minutes we've got: the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand the decision to a person because it's a values question rather than a facts one.

  The things I need it to handle, because these are the ones we keep arguing about:

  - The evidence is nearly always thin or missing. For most of what comes to us — larval zebrafish, fruit flies, some beetle nobody has ever tested, the occasional cephlopods — we've no direct evidence either way. I need the procedure to say what to do with an absence of evidence without collapsing into "assume everything is fully conscious", because then everything is equally urgent and we can't prioritise anything at all.

  - Numbers. One macaque is not ten thousand larvae. But I dont know how to think about it: if I'm maybe 10% confident a fly larva is sentient and there are fifty thousand of them, does that beat one monkey I'm 95% sure about? I've been toying with just multiplying credence × intensity × number and ranking by that, and it seems to give answers I don't like, so I can't tell whether the arithmetic is wrong or the dislike is.

  - A consistency rule I half-invented: if you'd accept a bit of pain behaviour as enough to count a pig as sentient, you have to say what's doing the work when you reject the same kind of evidence for a crab. I like it, but I can't tell if it's circular or if it just sneaks in a bias towards things with backbones under a procedural disguise. Tell me if it's sound, and if it isn't what to use instead.

  - Where it has to stop. I think there are places where no amount of evidence settles it — whether death is a harm to an animal in the first place, or how a small amount of pain across a very large number of animals is meant to weigh against a modest scientific benefit — and I'd much rather the procedure said "this bit is a decision, not a finding" than pretend otherwise.

  Then please run it on three cases shaped like ones from our last few meetings: (1) about fifty thousand fruit fly larvae in a heat-avoidance learning assay, killed at the end; (2) a single rhesus macaque, already trained, in a long-term brain recording study under a severe protocol; (3) larval zebrafish at five days old in a drug screen, where I genuinely don't know whether they can feel anything yet. I want at least one of them to come out with an answer I won't like — my instinct is that the fly one is a paperwork exercise and the monkey is the real ethical problem, and I suspect the procedure says something closer to the opposite, or at least won't let me say that so quickly.

  Also: which bits of the philosophy have to survive into the checklist and which can we drop, what we lose by dropping them, and where a procedure like this will definately misfire. Please don't give me a reading list or tell me to go and look things up — I've no access to journals and I need something I can run on a Tuesday afternoon.
reasoning: |-
  Okay, the user is a lay member on an animal ethics committee without a scientific background. They're dealing with practical issues in assessing animal welfare during committee meetings. They need a structured procedure to evaluate protocols quickly, addressing key pain points like evidence gaps, comparing numbers, ensuring consistency, and acknowledging ethical decisions.

  First, I need to unpack their core concerns. They mentioned confusion between pain response and consciousness. They want a clear distinction to avoid conflating nociception with sentience. The procedure must handle thin evidence without defaulting to assuming all animals are sentient, which would paralyze decision-making.

  Then there's the numbers problem. How to weigh one highly sentient animal against thousands with low sentience probability. The user tried multiplying credence by numbers but felt uneasy with the results. I need to propose a method that's both practical and ethically sound, maybe using tiers or thresholds to avoid false precision.

  The consistency rule they invented is about applying the same standards across species. But they worry it might bias toward vertebrates. I should suggest a framework based on evidence hierarchies rather than anatomy, to prevent that bias.

  For the stopping points, it's crucial to separate empirical questions from value judgments. The procedure must flag where decisions are ethical, not factual, so the committee doesn't overreach.

  Testing the procedure on their three cases is key. The fruit fly larvae case might show how low evidence leads to minimal scrutiny. The monkey case, with high sentience confidence, would require intense review. Zebrafish fall in between, needing moderate scrutiny. This approach might challenge the user's instinct that monkeys are the main concern, emphasizing scale in lower-sentience cases.

  I should emphasize simplicity. Philosophy concepts like phenomenal consciousness should translate to practical indicators. The checklist must be jargon-free, using observable proxies like behavioral flexibility. Dropping nuanced debates is necessary for speed, accepting some error margins.

  Potential misfires: over-reliance on proxies might miss sentience in underestimated species. Also, the numbers approach could justify large-scale harm if credence is too low. The procedure needs safeguards, like mandatory review for novel species or high numbers.

  Finally, the user needs this for Tuesday meetings. The steps must be clear, sequential, and executable in 20 minutes. Highlighting where consensus is needed versus where the procedure dictates outcomes will save time and reduce arguments.
answer: |-
  Here's a practical, step-by-step procedure designed for your committee meetings. It prioritizes defensibility, handles uncertainty, forces explicit reasoning, and flags value judgments. It integrates your key concerns while avoiding philosophical rabbit holes.

  **Core Principles of the Procedure:**
  1.  **Separate "Harm Detection" from "Sentience" (Conscious Experience):** Reacting to harm isn't the same as *suffering*.
  2.  **Manage Uncertainty Explicitly:** Absence of evidence is *not* evidence of absence OR presence.
  3.  **Triage via Thresholds:** Focus scrutiny where the *potential* for significant suffering is highest.
  4.  **Consistency via Reasoning:** Require justification for treating similar evidence differently.
  5.  **Flag Value Judgments:** Don't pretend science answers ethical questions.

  **The AWEC Sentinel Procedure (Animal Welfare & Ethics Committee Sentinel Procedure)**

  *(Run sequentially for each protocol. Aim for 15-20 mins per protocol.)*

  1.  **Identify the Subject(s):**
      *   *Question:* What species and life stage? What are the numbers?
      *   *Output:* Species, Stage, N= [Number]. (e.g., *Drosophila melanogaster* larvae, N=50,000)

  2.  **Assess Capacity for Harm Detection (Nociception):**
      *   *Question:* Is there a known or strongly plausible physiological basis for detecting harmful stimuli (nociceptors, neural pathways to trigger reflex withdrawal/avoidance) *in this specific life stage*? (Look for basic biology papers, standard texts, expert knowledge on the committee. *Avoid complex behavior here*).
      *   *Evidence Threshold:* Standard biological knowledge suffices (e.g., vertebrates have nociceptors; adult insects generally do; larval stages less clear).
      *   *Output:*
          *   **"High Confidence"** (e.g., mammals, birds, fish, adult decapods).
          *   **"Likely/Plausible"** (e.g., larval insects, cephalopods - based on related forms).
          *   **"Unlikely/No Evidence"** (e.g., very simple invertebrates like nematodes, protozoa).
          *   **"Unknown"** (Default if genuinely no clue - e.g., obscure beetle larva).
      *   *Stop Point:* If output is **"Unlikely/No Evidence"**, proceed to Step 7 (Overall Harm) but **assign Severity Band = "None"** and **Scrutiny = "Fast-Track"** for *pain-related aspects*. Acknowledge potential other harms (stress, deprivation).

  3.  **Assess Potential for Sentience (Conscious Suffering):**
      *   *Question:* Is there *any* credible evidence or strong theoretical argument *for this specific life stage* suggesting capacity for subjective experience (positive/negative feelings)? Focus on *proxies*:
          *   **Complex Learning:** Associative learning beyond simple habituation/sensitization? (e.g., place preference/avoidance based on experience, not just innate reflex).
          *   **Behavioral Flexibility/Contingency:** Can it modify behavior flexibly based on context to achieve goals/avoid harm? (Beyond fixed action patterns).
          *   **Trade-offs:** Does it make choices involving cost/benefit trade-offs (e.g., risk vs. reward) suggesting internal valuation?
          *   **Neurological Analogy:** Does it possess brain structures/complexity *plausibly analogous* to known sentient systems? (Use cautiously; avoid "mini-brain" hype).
      *   **Crucial Rule:** *Absence of evidence here is NOT proof of absence.*
      *   *Output (Sentience Credence - SC):*
          *   **"High" (SC >75%):** Strong evidence in *this species/stage* (e.g., adult mammals, birds, octopuses). Or, overwhelming evidence in very close relatives + plausible neurobiology.
          *   **"Moderate" (SC ~25-75%):** Some evidence (e.g., one solid study showing complex learning/flexibility) OR strong evidence in close adult relatives but stage is immature (e.g., larval zebrafish) OR strong theoretical argument based on neurobiology/behavioral complexity (e.g., adult crabs, bees).
          *   **"Low" (SC <25%):** Little/no direct evidence, close relatives also show minimal evidence, neurobiology suggests limited integration (e.g., fruit fly larvae, most beetle larvae). *Default for most invertebrates unless evidence exists*.
          *   **"Effectively Zero" (SC ~0%):** Neurobiology precludes it (e.g., animals without any centralized nervous system).
      *   *Consistency Check (Your Rule - Applied Here):* If rejecting evidence type (X) for Species A (e.g., simple avoidance learning in a crab) that you'd accept for Species B (e.g., a pig), *you must state the specific difference justifying it.* (e.g., "The crab study showed only reflex withdrawal; the pig study showed conditioned vocalizations and long-term avoidance suggestive of affective state"). If no clear difference, consistency demands similar SC treatment.

  4.  **Assess Protocol-Specific Harms & Intensity:**
      *   *Question:* What specific procedures are involved? What is their *potential severity* **assuming the animal *is* sentient**? (e.g., brief restraint, surgery, chronic disease, terminal procedure, environmental stress).
      *   *Output (Potential Harm Intensity - PHI):* Use your existing bands: **None, Mild, Moderate, Severe**. Base this *solely on the nature of the procedure* as if applied to a known sentient animal. (e.g., major surgery = Severe; brief blood draw = Mild; humane killing = Mild/Moderate depending on method; housing in slightly suboptimal conditions = Mild).

  5.  **Calculate Ethical Weight (EW - A Practical Heuristic):**
      *   *Purpose:* To triage scrutiny based on *potential total burden*. Not precise ethics, but a risk filter.
      *   *Formula:* **EW = SC Category Weight (SCW) x PHI Band Weight (PHIW) x N**
      *   *Weights (Assign Numeric Values for Calculation):*
          *   **SCW:** High=3, Moderate=1, Low=0.1, Effectively Zero=0. *Rationale:* Exponential discounting for low SC reflects profound uncertainty and avoids "tyranny of large numbers" for very low probabilities. High SC gets strong weighting.
          *   **PHIW:** None=0, Mild=1, Moderate=2, Severe=3. (Aligns with your bands).
          *   **N:** Number of individual animals affected by procedures of that PHI.
      *   *Output:* A single number (EW). *This is for ranking/scrutiny ONLY, not final severity.*

  6.  **Determine Required Scrutiny Level (Based on EW):**
      *   *Thresholds (Set by Committee - Example Values):*
          *   **EW < 10:** Minimal Potential Burden -> **Scrutiny: Fast-Track** (Focus on technical/scientific soundness, compliance).
          *   **EW 10 - 100:** Moderate Potential Burden -> **Scrutiny: Standard Discussion**.
          *   **EW > 100:** High Potential Burden -> **Scrutiny: High Scrutiny / Possible Return** (Requires strong justification, alternatives explored).
      *   *Rationale:* Uses your EW heuristic to focus time where potential suffering risk is highest, considering SC uncertainty, harm intensity, and scale.

  7.  **Assign Final Severity Band (Overall Harm):**
      *   *Question:* Based on **PHI** (Step 4) and **SC** (Step 3), what is the *actual likely severity*?
      *   *Decision Rule:*
          *   If **SC = High**, assign PHI band directly (Mild/Mod/Severe).
          *   If **SC = Moderate**, assign PHI band *or one band lower* (e.g., Severe procedure -> Moderate Severity band). Justify the choice (e.g., "Surgery is severe, but immature neurobiology suggests reduced experience intensity").
          *   If **SC = Low**, assign **Mild** *regardless of PHI* (e.g., Severe procedure -> Mild Severity band). *Rationale:* Profound uncertainty about *suffering* means we cannot confidently assign higher bands. The potential harm is acknowledged via scrutiny level (Step 6). Other harms still apply.
          *   If **SC = Effectively Zero**, assign **None** for pain/suffering. (Other harms may apply).
      *   *This is a Value Judgment Point:* The choice between PHI band or one lower for Moderate SC involves balancing precaution against realism. Committee must explicitly state reasoning.

  8.  **Flag Intrinsic Ethical Judgments (Decision Points):**
      *   *Explicitly State:* "The following ethical judgments are inherent in this assessment and require committee consensus, not just scientific findings:"
          *   The assignment of Severity Band when SC = Moderate.
          *   The weighting factors used in the EW calculation (SCW, PHIW).
          *   The scrutiny thresholds (EW 10, 100).
          *   The justification for *any* harm where SC > Effectively Zero (Scientific Benefit vs. Harm).
          *   The inherent assumption that death/husbandry restrictions are harms (for sentient beings).
          *   The acceptability of "Low SC + High N + High PHI" protocols (implicit in the EW weights/scrutiny).

  **Running the Cases (Using Example Thresholds/Weights):**

  1.  **50,000 Fruit Fly Larvae (Heat Avoidance Learning, Killed)**
      *   Step 1: *Drosophila melanogaster* larvae, N=50,000
      *   Step 2 (Harm Detect): **Likely/Plausible** (Larvae have nociceptors, show avoidance).
      *   Step 3 (Sentience - SC): **Low** (Little evidence for complex integration/affective states in larvae; neurobiology relatively simple). *Consistency:* Avoidance learning alone, without evidence of context-flexibility or trade-offs, isn't sufficient for higher SC (cf. pig requiring more).
      *   Step 4 (PHI): Heat exposure (likely **Mild**), Terminal procedure (humane kill - **Mild**). *Highest PHI = Mild*.
      *   Step 5 (EW): SCW(Low)=0.1, PHIW(Mild)=1, N=50,000. **EW = 0.1 * 1 * 50,000 = 5,000**
      *   Step 6 (Scrutiny): EW (5,000) > 100 -> **High Scrutiny / Possible Return**. *This challenges your instinct.* Rationale: Despite *very* low individual SC, the massive N and potential procedures trigger high scrutiny due to *aggregate uncertainty risk*.
      *   Step 7 (Severity): SC=Low -> **Severity Band = Mild** (regardless of PHI Mildness). *Rationale:* Uncertainty prevents higher band assignment, but scrutiny level reflects scale.
      *   Step 8: Judgments flagged: Accepting Mild severity for 50k low-SC animals; the SCW=0.1 discount; the EW threshold >100 triggering high scrutiny; justification of benefit vs. this potential burden.

  2.  **Single Rhesus Macaque (Severe Protocol, Long-Term Recording)**
      *   Step 1: *Macaca mulatta*, Adult, N=1
      *   Step 2 (Harm Detect): **High Confidence**.
      *   Step 3 (Sentience - SC): **High** (Overwhelming evidence).
      *   Step 4 (PHI): Chronic implants, restraint, potential discomfort/pain -> **Severe**.
      *   Step 5 (EW): SCW(High)=3, PHIW(Severe)=3, N=1. **EW = 3 * 3 * 1 = 9**
      *   Step 6 (Scrutiny): EW (9) < 10 -> **Fast-Track**? *This seems counter-intuitive!* **BUT:** This is where thresholds matter. Your committee MUST set the "High Scrutiny" threshold (EW>100) high enough to *not* catch single mammals on severe protocols. **Adjust Threshold:** Set "Standard Discussion" lower (e.g., EW > 1). EW=9 >1 -> **Standard Discussion.** *Rationale:* High individual burden demands discussion, but fixed N=1 limits aggregate risk compared to massive N protocols.
      *   Step 7 (Severity): SC=High -> **Severity Band = Severe** (Matches PHI).
      *   Step 8: Judgments flagged: Justification for severe harm to high-SC individual; benefit assessment critical.

  3.  **Larval Zebrafish (5dpf, Drug Screen)**
      *   Step 1: *Danio rerio* larvae, 5 days post-fertilization, N=? (Assume High, e.g., 10,000)
      *   Step 2 (Harm Detect): **High Confidence** (Nociceptors present, withdrawal responses).
      *   Step 3 (Sentience - SC): **Moderate** (Evidence for complex behaviors & learning increasing around this stage, but neurodevelopment ongoing; less evidence than adults). *Consistency:* More complex than fly larvae, less than adult fish/mammals.
      *   Step 4 (PHI): Drug exposure (variable, assume potential for **Moderate** effects - e.g., neuroactive drugs), likely terminal (**Mild**). *Highest PHI = Moderate*.
      *   Step 5 (EW): SCW(Mod)=1, PHIW(Mod)=2, N=10,000. **EW = 1 * 2 * 10,000 = 20,000**
      *   Step 6 (Scrutiny): EW (20,000) >> 100 -> **High Scrutiny / Possible Return**. Rationale: Moderate SC + High N + Moderate PHI = Very High aggregate potential burden.
      *   Step 7 (Severity): SC=Moderate -> **Severity Band = Moderate** (or *possibly* Mild - requires explicit justification if choosing Mild). Committee decides: "Neurodevelopment suggests experience may be less intense than adult" -> **Severity Band = Mild?** OR "Procedures intrinsically moderate" -> **Severity Band = Moderate**. *Value Judgment Point.*
      *   Step 8: Judgments flagged: Severity band choice (Mod vs. Mild); justification for scale (N=10k); SCW=1; EW thresholds; benefit vs. burden.

  **What Philosophy Survives in the Checklist:**

  1.  **Sentience/Nociception Distinction:** Core to Steps 2 & 3.
  2.  **Uncertainty Management:** Explicit SC categories, "Unknown" option, Low SC discounting (SCW=0.1).
  3.  **Proxies for Sentience:** Focus on complex learning, flexibility, trade-offs (Step 3).
  4.  **The Hard Problem Flagged:** Acknowledging that Step 3 is inferential (Step 8).
  5.  **Is-Ought Separation:** Step 8 explicitly flags ethical judgments (severity assignment for Mod SC, weights, thresholds, benefit justification).

  **What Philosophy is Dropped & Consequences:**

  1.  **Deep Dive into Consciousness Theories:** Dropped. *Loss:* Nuance about *types* of consciousness. *Gain:* Speed, practicality, focus on suffering risk.
  2.  **Precise Probability Assignments:** SC is categorical (High/Mod/Low), not %. *Loss:* Illusion of precision. *Gain:* Avoids false confidence, easier consensus.
  3.  **Utilitarian Calculus:** EW is a crude triage tool, not a moral calculus. *Loss:* "Optimal" solution. *Gain:* Avoids justifying massive harm based on low probability, focuses scrutiny instead.
  4.  **Resolving Death as Harm:** Assumed for SC>0. *Loss:* Philosophical rigor on death. *Gain:* Practical alignment with standard welfare concerns (deprivation of life).

  **Where This Will Misfire (Be Vigilant):**

  1.  **Novel Species with Unexpected Sentience:** The procedure relies on evidence/proxies. A truly unique, sentient animal lacking obvious proxies might be misclassified as Low SC. *Mitigation:* High scrutiny for truly novel, complex organisms regardless of initial SC (build this in).
  2.  **"Low SC" Becomes a License:** Committees might downplay harms for Low SC animals. *Mitigation:* The high EW from large N still triggers scrutiny. Emphasize that "Low SC" means *uncertainty*, not proven absence. Step 8 flags the ethical choice to proceed.
  3.  **Over-Reliance on the Heuristic:** EW/Scrutiny is a guide, not a dictator. A single animal in extreme torment (EW=9) *deserves* discussion (hence adjusting thresholds). Committees must retain override capability, documented.
  4.  **Ignoring Other Harms:** Focuses on pain/suffering. Non-sentient animals can still experience stress affecting biological function. *Mitigation:* Ensure Step 2 ("None" for pain) still considers other welfare harms for severity/scrutiny.
  5.  **Underestimating Cumulative Effects:** For long-term studies on Low/Mod SC animals, individual mild procedures might sum to a significant burden. *Mitigation:* Consider overall lifetime experience in PHI assessment (Step 4).

  This procedure forces explicit reasoning, manages uncertainty conservatively but practically, focuses precious discussion time where potential risks are highest, flags ethical choices, and provides a defensible audit trail. It won't make the hard choices easy, but it will make the reasoning behind them clear and consistent. Run it for a few meetings, then refine the weights/thresholds based on what feels right *and* defensible. Good luck next Tuesday!
