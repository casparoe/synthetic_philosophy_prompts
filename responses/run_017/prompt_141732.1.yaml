prompt: |-
  I sit on a committee that has to write guidance for two quite different jobs, and I want the specification before I look at any candidate view. Job one: at the bedside — telling the family of a patient who is behaviourally unresponsive whether there is residual experience at all, and roughly how much, on the basis of data we can actually get (clinical exam, EEG, perhaps a magnetic pulse and the EEG response to it, in a patient whose individual connectivity we do not know). Job two: in a statute — deciding which animal taxa fall above a line that triggers welfare protections, which requires the quantity to be comparable across architectures that share no obvious common currency. If the two jobs pull apart, optimise for job one and say where the sacrifice falls.

  What I am asking for is a spec for a *measure* — a quantity with a principled zero point — not a yes/no test of responsiveness and not a metaphysical account of what consciousness is. But tell me first whether that separation is coherent: can a measure be adequate for my purposes while remaining silent about which physical systems have any consciousness and why, or does any usable measure smuggle in enough of a theory that I should have been asking for the theory?

  Below is the pile of requirements I have accumulated. Some of them I suspect are genuine desiderata, some I suspect are prejudices of one camp dressed as requirements, and some probably collapse into each other. Sort them, revise them, throw out the ones that are not real, and add the ones I have missed — with the case or consideration behind each, and marked as non-negotiable or as a preference of a camp.

  1. *Clinical estimability*: the quantity must be estimable at the bedside, non-invasively, without knowing that patient's full causal architecture.
  2. *Divergence from behaviour*: it must come apart from behavioural responsiveness wherever first-person reports say experience persists without it — dream-enactment during sleep, dissociative anaesthesia with eyes open and no response, unresponsive patients who can willfully modulate their brain activity on instruction, awareness under anaesthesia with subsequent recall.
  3. *Principled zero*: the difference between none and a little must not be set by a threshold fitted to the very behavioural measures the quantity is meant to replace.
  4. *Description-invariance*: the value must not swing with the spatial or temporal grain of the description — cells or columns or regions, milliseconds or hundreds of milliseconds — and if a grain must be chosen, the choice must fall out of the theory rather than from convenience.
  5. *Composition*: it must take a stance on (i) whether two identical, non-interacting brains contain twice as much as one, (ii) whether causally joining them changes the total, (iii) whether one system can contain nested subsystems that are themselves conscious, and (iv) what happens when two overlapping candidate systems come within a few percent of each other — a patient's consciousness must not flicker or split because measurement noise decided which of two near-ties is maximal.
  6. *Structure over size*: it must not rank the cerebellum's contribution as large merely because of its neuron count — on the usual estimates it contains several times as many neurons as the cerebral cortex — or because of its metabolic activity, and it must either explain why a structure that large contributes so little to waking experience while much smaller cortical and brainstem lesions can abolish it, or explain why that appearance is misleading.
  7. *Splitting and subtraction*: it must say what callosotomy and childhood hemispherectomy do to the amount, and the answer must not simply be read off the number of hemispheres remaining.
  8. *Shape of degradation*: it must discriminate dreamless sleep, dreaming sleep, sedation, dissociation and seizure states, and it must respect the distinction between *less* consciousness and consciousness *of a different kind* — or argue that the distinction is spurious.
  9. *Functional preservation*: for the familiar fading- and dancing-qualia cases, and for my variant — tissue progressively rewired so that overall input-output behaviour is preserved while internal integration is degraded — it must say whether the quantity declines, and you must tell me whether "must not decline when function is preserved" is a desideratum or a functionalist prejudice.
  10. *Cross-architecture comparability*: for job two, whether numbers from a fish, a pig and a human are on one scale at all.
  11. *Non-inflation*: it must not assign large amounts to simple systems — a large grid of logic gates, say — nor let consciousness switch on abruptly at some complexity threshold for no principled reason. Is "no panpsychism" a requirement or a taste?
  12. *Computability in principle*: quantities defined as a maximum over all partitions or all subsystem compositions are superexponentially expensive and in practice get replaced by proxies; say whether literal computability is required, or whether a licensed proxy can inherit the standing of the quantity it approximates.
  13. *Version-robustness*: if the formalism is revised, the verdict on a given patient should not flip. (The major research programmes have all been revised more than once; I take that as a fact about the field, not a criticism, but it affects how much weight I can put on any single number.)

  Two things I want beyond the list. First: which subset of the desiderata, once cleaned up, is jointly unsatisfiable? That is the part I most care about, because if the spec itself is impossible then my committee needs to know which requirement to sacrifice rather than which candidate to pick. Second: which single requirement does the most work in excluding candidates?

  Then, briefly — a table, a line or two each, no more: how integrated-information-style measures, global-broadcasting accounts, higher-order or attention-schema accounts, and behaviour-calibrated complexity indices derived from the EEG response to stimulation each do against the final list. The scorecard is not the deliverable; the criteria are.
reasoning: |-
  We are given two distinct jobs:
   Job 1 (clinical): Estimate residual consciousness at the bedside in behaviorally unresponsive patients.
   Job 2 (statutory): Compare consciousness across animal taxa for welfare protections.

   The user wants a measure (with a principled zero) that does not require a full theory of consciousness but must be practical for job 1 and, if possible, job 2. However, if the two jobs pull apart, we optimize for job 1 and note the sacrifice for job 2.

   We are to evaluate a list of requirements, clean them up, and identify which are non-negotiable, which are preferences, and which are incompatible. We must also note if any requirements collapse into each other.

   Step 1: Assess the coherence of having a measure without a theory.
     - It is coherent to have a measure without a full theory. For example, temperature was measurable before the kinetic theory of gases. However, any measure will be based on some assumptions (e.g., that certain physical properties correlate with consciousness). The key is whether the measure is operationalizable without resolving the hard problem of consciousness. For job 1, we can rely on empirical correlations with verified first-person reports (when available) and extrapolate to unresponsive cases. For job 2, cross-architecture comparability might require a theory or at least a set of bridging principles.

   Step 2: Review and categorize the requirements.

   Let's go through each requirement and assign:
     - Type: non-negotiable (N), preference (P), or a camp-specific prejudice (C) that might be discarded.
     - Also, note if the requirement is specific to job 1 (J1), job 2 (J2), or both.

   1. Clinical estimability (N for J1, P for J2): 
      - Non-invasive, bedside, without knowing the full causal architecture. This is non-negotiable for job 1. For job 2, it's a preference but not necessary.

   2. Divergence from behaviour (N for J1, P for J2):
      - The measure must capture cases where there is experience without behavioral responsiveness (e.g., locked-in syndrome, certain sleep stages). This is non-negotiable for job 1 because we are specifically interested in cases where behavior is absent. For job 2, it's a preference because behavioral criteria are often used in welfare, but we want to go beyond.

   3. Principled zero (N for both?):
      - The zero must not be set by behavioral thresholds. This is non-negotiable because the measure is meant to replace behavioral measures in cases they fail. However, note that without behavioral reports, setting zero is challenging. We might rely on conditions universally accepted as having no experience (e.g., brain death) and build from there.

   4. Description-invariance (P for both?):
      - The value should not depend on the spatial/temporal grain. This is a theoretical desideratum but might be hard to achieve. It is a preference because in practice we may have to choose a grain, but we want it to be principled.

   5. Composition (P for both?):
      - This addresses how the measure composes over systems. It is important for interpreting the measure in complex cases (e.g., split-brain, nested systems). It's a preference because it helps avoid paradoxes, but it might be difficult to satisfy fully.

   6. Structure over size (P for both?):
      - The measure should not assign high consciousness to the cerebellum just because it is large. This is a preference because we have evidence that the cerebellum is not as crucial for conscious experience as the cortex. It might be a camp issue: functionalists might argue that if the cerebellum were to support similar functions, it would contribute, but we know it doesn't.

   7. Splitting and subtraction (P for both?):
      - Specifically for split-brain and hemispherectomy. This is a preference for theoretical robustness.

   8. Shape of degradation (N for J1, P for J2):
      - Must discriminate between states (sleep, sedation, etc.) and between less consciousness vs different kind. This is non-negotiable for job 1 because we need to diagnose states. For job 2, it's a preference.

   9. Functional preservation (P? and note camp issue):
      - For cases where internal processing is degraded while behavior is preserved, must the measure decline? The user notes that "must not decline when function is preserved" might be a functionalist prejudice. This is a camp issue (C). We might mark it as a preference but note that it is contentious.

   10. Cross-architecture comparability (N for J2, P for J1):
      - Essential for job 2 (to compare taxa). For job 1, it's a preference (if we can compare across patients, that's a bonus).

   11. Non-inflation (P for both? and note camp issue):
      - Avoid assigning high values to simple systems (like a grid of logic gates) and avoid abrupt thresholds. The note about panpsychism: this is a camp issue (C). Some theories (like IIT) are accused of panpsychism. We might mark it as a preference but note that it is a common desideratum to avoid counterintuitive assignments.

   12. Computability in principle (N for J1, P for J2?):
      - For job 1, we need a measure that is computable at the bedside. Therefore, non-negotiable for job 1 that we have a tractable method. The question of whether a licensed proxy is acceptable: yes, as long as the proxy is validated.

   13. Version-robustness (P for both?):
      - We don't want the measure to flip with minor theoretical revisions. This is a preference for stability.

   Step 3: Identify conflicts and joint unsatisfiability.

   The main conflict is between:
     - Clinical estimability (requirement 1) and Cross-architecture comparability (requirement 10): 
          Job 1 requires a measure that is practical at the bedside without knowing the full architecture. Job 2 requires comparing across very different architectures. The methods that work for job 1 (e.g., EEG, TMS-EEG) are tailored to the human brain and may not transfer to other animals without calibration. Moreover, job 2 might require a more fundamental theory to bridge architectures.

     - Also, Clinical estimability (1) and Description-invariance (4): 
          A measure that is invariant to description grain might require a theory that we cannot test at the bedside.

     - Principled zero (3) and Clinical estimability (1): 
          Setting a principled zero without behavioral reports and without a theory is challenging. We might rely on conditions like brain death, but in practice, we might need to use behavioral baselines for calibration (which requirement 3 forbids).

     - Cross-architecture comparability (10) and Structure over size (6): 
          Without a common currency, comparing across architectures might lead to counterintuitive results (e.g., assigning high consciousness to a structure in an animal that is large but not functionally equivalent to the human cortex).

     - Non-inflation (11) and Composition (5): 
          Some measures (like IIT) might assign high values to systems that are highly interconnected but not intuitively conscious (e.g., a grid of gates). Avoiding this might conflict with compositionality.

   Step 4: Which requirement does the most work in excluding candidates?
     - Clinical estimability (1) is a major filter because many theories are not operationalizable at the bedside (e.g., require full causal architecture, are computationally intractable, or require invasive methods).

   Step 5: Cleaned list of requirements, with notes.

   Non-negotiable for job 1:
      1. Clinical estimability
      2. Divergence from behaviour
      3. Principled zero (with the caveat that it must be set without behavioral thresholds, but we might use non-behavioral anchors)
      8. Shape of degradation (for diagnosing states)
      12. Computability in principle (with a licensed proxy acceptable)

   Important preferences for job 1:
      4. Description-invariance (if achievable without sacrificing clinical feasibility)
      5. Composition (to avoid paradoxes)
      6. Structure over size (to avoid overemphasizing the cerebellum)
      7. Splitting and subtraction (for theoretical robustness)
      9. Functional preservation (but note camp issue: we might not require it to be non-decreasing when function is preserved if internal integration degrades)
      10. Cross-architecture comparability (if possible, but not required for job 1)
      11. Non-inflation (avoiding panpsychism and abrupt thresholds is desirable)
      13. Version-robustness (desirable for stability)

   For job 2, non-negotiable:
      10. Cross-architecture comparability
      3. Principled zero (to set the threshold for welfare)

   But note: if we optimize for job 1, then for job 2 we might have to sacrifice cross-architecture comparability. That is, we might have to use a different approach for job 2.

   Step 6: Table of how existing approaches fare.

   We consider four approaches:
     A. Integrated Information Theory (IIT) style measures
     B. Global broadcasting accounts (e.g., Global Neuronal Workspace, GNW)
     C. Higher-order or attention-schema accounts
     D. Behaviour-calibrated complexity indices (e.g., Perturbational Complexity Index, PCI)

   We will rate against the non-negotiable and key preferences for job 1.

   Requirement | IIT-style | Global Broadcasting | Higher-order | Complexity Indices
  ------------|-----------|---------------------|--------------|-------------------
  1. Clinical estimability (N): 
     - IIT: Not easily estimable at bedside (requires full causal model, which is not available; current proxies like PCI are used but are not the full IIT measure).
     - Global Broadcasting: Can be estimated with EEG (e.g., by measuring global connectivity) but might be challenging without knowing architecture.
     - Higher-order: Not directly estimable without specific neural correlates (research ongoing).
     - Complexity Indices (e.g., PCI): Designed for bedside, non-invasive (TMS-EEG). Good.

  2. Divergence from behaviour (N):
     - IIT: Can diverge (e.g., in sleep or unresponsive states with high integration).
     - Global Broadcasting: Might correlate with reportability, but in unresponsive states might be low even if there is experience? (Debated)
     - Higher-order: Might require behavioral report for higher-order thought, so may not diverge.
     - Complexity Indices: Designed to detect consciousness without behavior (e.g., in locked-in, sleep, etc.). Good.

  3. Principled zero (N):
     - IIT: Has a principled zero (zero integration -> zero phi).
     - Global Broadcasting: Zero when no global broadcasting? But might not have a principled zero without a theory.
     - Higher-order: Zero when no higher-order thought? Principled?
     - Complexity Indices: Zero in conditions like brain death? But the zero might be calibrated on behavior? (This is a concern: PCI uses behavioral states to set thresholds.)

  4. Description-invariance (P):
     - IIT: Not invariant (depends on grain of partitioning and spatial/temporal scale).
     - Others: Typically defined at a specific scale (e.g., EEG channels, fMRI voxels). Not invariant.

  5. Composition (P):
     - IIT: Has explicit composition rules (but results in counterintuitive assignments for split-brain).
     - Global Broadcasting: Not clear.
     - Higher-order: Not clear.
     - Complexity Indices: Not addressed.

  6. Structure over size (P):
     - IIT: Assigns high value to systems with high integration. The cerebellum, having low integration, would be low. Good.
     - Global Broadcasting: Focuses on fronto-parietal network, so cerebellum low. Good.
     - Higher-order: Similar to global broadcasting? Good.
     - Complexity Indices: Reflects the complexity of the cortex, so cerebellum low. Good.

  7. Splitting and subtraction (P):
     - IIT: Split-brain: two separate consciousnesses? But the measure might assign two separate maxima. Controversial.
     - Others: Not well defined.

  8. Shape of degradation (N):
     - IIT: Different states have different levels of integration, so it should discriminate. But might not capture qualitative differences.
     - Global Broadcasting: Should show degradation in states with reduced global broadcasting (e.g., deep sleep).
     - Higher-order: Should show degradation when higher-order thought is absent.
     - Complexity Indices: Shown to discriminate states (e.g., sleep, anesthesia). Good.

  9. Functional preservation (P and camp issue):
     - IIT: Would decline if internal integration degrades, even if function preserved. So it does not align with functionalist prejudice.
     - Global Broadcasting: Might decline if the workspace is degraded, even if function preserved? 
     - Higher-order: Similar.
     - Complexity Indices: Would decline if the complexity of the response is reduced.

  10. Cross-architecture comparability (N for J2, P for J1):
     - IIT: In principle, comparable across architectures (but requires full causal model, which we don't have for animals and not at bedside).
     - Global Broadcasting: Requires identifying a global workspace in the animal, which may not exist in the same way.
     - Higher-order: Similarly, requires identifying higher-order structures.
     - Complexity Indices: Designed for humans; may not transfer to animals without validation.

  11. Non-inflation (P):
     - IIT: Accused of panpsychism (e.g., a grid of gates might have high phi). Bad.
     - Global Broadcasting: Less prone, because it requires specific broadcasting architecture.
     - Higher-order: Similarly, requires higher-order mechanisms.
     - Complexity Indices: Measures complexity of response, so unlikely to be high in simple systems.

  12. Computability in principle (N for J1):
     - IIT: Full measure not computable for large systems. Proxies (like PCI) are used. So with a proxy, acceptable.
     - Global Broadcasting: Computable with EEG/fMRI methods.
     - Higher-order: Computable with neuroimaging.
     - Complexity Indices: Computable at bedside.

  13. Version-robustness (P):
     - IIT: Has undergone revisions (e.g., IIT 1.0, 2.0, 3.0, 4.0) and the measures changed. Not robust.
     - Global Broadcasting: More stable?
     - Higher-order: Relatively stable.
     - Complexity Indices: Empirical, so as long as the method is fixed, it's robust.

   Summary for candidates:
     - IIT-style: Strong on theoretical grounds (principled zero, divergence) but fails clinical estimability without proxies. Composition leads to counterintuitive results. Non-inflation is a problem (panpsychism). Version-robustness is poor.
     - Global Broadcasting: Clinically estimable to some extent (with neuroimaging). May not have a principled zero. Might not capture non-reportable states. 
     - Higher-order: Similar to global broadcasting.
     - Complexity Indices (like PCI): Best for clinical estimability and diverges from behavior. Principled zero? (Calibrated on behavior, so might violate requirement 3.) Good for shape of degradation and computability. Not proven for cross-architecture.

   Step 7: Which requirement to sacrifice if necessary?
     Given that we optimize for job 1, and job 2 might be sacrificed, the main conflict is between clinical estimability and cross-architecture comparability. Therefore, we sacrifice cross-architecture comparability for job 2.

   Also, requirement 3 (principled zero) might be hard to meet without a theory. We might have to rely on conditions that are universally agreed as having no experience (like brain death) and set zero there, but without a theory, it might be challenged.

   Step 8: Final cleaned requirements for job 1.

   Non-negotiable:
     1. Clinical estimability: Must be non-invasive, bedside, without knowing the full architecture.
     2. Divergence from behaviour: Must capture cases of consciousness without behavior.
     3. Principled zero: Must have a zero that does not rely on behavioral thresholds (but we can use non-behavioral anchors like brain death).
     8. Shape of degradation: Must discriminate states and between quantitative and qualitative changes (or argue they are the same).
     12. Computability: Must be computable at bedside (proxy allowed).

   Preferences (desirable but not non-negotiable):
     4. Description-invariance
     5. Composition
     6. Structure over size
     7. Splitting and subtraction
     9. Functional preservation: We note that it is a camp issue and we do not require non-decline when function is preserved if internal integration is degraded.
     10. Cross-architecture comparability: Desirable but not required for job 1.
     11. Non-inflation: Avoid panpsychism and abrupt thresholds.
     13. Version-robustness

   Conflict: The requirement that does the most work in excluding candidates is clinical estimability (1). It eliminates IIT in its pure form and favors complexity indices.

   Recommendation: 
     For job 1, the complexity indices (like PCI) are the most promising, despite concerns about principled zero (if they are calibrated on behavior, they might violate requirement 3). We must ensure that the zero is set independently of behavioral responsiveness in the target population (e.g., by using brain death as an anchor). 

     For job 2, since it is sacrificed when optimizing for job 1, we might need a separate approach. If we must use the same measure, then complexity indices might be extended to animals by using similar TMS-EEG protocols, but validation would require behavioral or other evidence in each species.

   Additional note: The requirement for a principled zero (3) might be the next biggest hurdle. We must define what constitutes zero without relying on behavior. This might require a theoretical anchor (like loss of integration in IIT) but without the full IIT baggage. Alternatively, we might use the condition of deep anesthesia with no recall and no brain response as a zero point, but that is still behaviorally anchored (recall). This is a challenge.

   Final note: The committee should be aware that no current measure satisfies all non-negotiable requirements perfectly. The best candidate for job 1 is a complexity index, but it might need refinement to meet the principled zero requirement independently of behavior.
answer: |-
  ### Assessment of Requirements for a Consciousness Measure

  **Core Insight:** A measure *can* be adequate without a full theory of consciousness if it operationalizes empirical correlates of subjective experience (e.g., neural markers validated against first-person reports). However, **cross-architecture comparability (Job 2) requires a bridging principle** (e.g., a conserved mechanism like information integration) that may not align with clinical practicality (Job 1). Optimizing for Job 1 sacrifices cross-architecture comparability for Job 2.

  ---

  ### Revised Requirements  
  *Sorted, annotated, and categorized.*  
  **Key:**  
  - **N** = Non-negotiable for Job 1 (bedside use).  
  - **P** = Preference (theoretically desirable but flexible).  
  - **C** = Camp-specific prejudice (contentious; not universally required).  
  - **J2** = Critical for Job 2 (statutory comparisons).  

  | Requirement             | Revised Label | Rationale |  
  |-------------------------|---------------|-----------|  
  | **1. Clinical estimability** | **N** | Must work non-invasively with EEG/TMS-EEG; no full connectome. *Core to bedside use.* |  
  | **2. Divergence from behaviour** | **N** | Essential for detecting covert awareness (e.g., locked-in syndrome). *Validated against first-person reports.* |  
  | **3. Principled zero** | **N** | Zero = no experience (e.g., brain death). *Cannot rely on behavioral thresholds.* |  
  | **8. Shape of degradation** | **N** | Must distinguish states (coma vs. dream sleep). *Diagnostically critical.* |  
  | **12. Computability** | **N** | Must be feasible at bedside (proxies allowed if validated). *Practical necessity.* |  
  | **6. Structure over size** | **P** | Cerebellum’s low contribution despite size implies consciousness isn’t additive. *Avoids metabolic/neuron-count fallacies.* |  
  | **5. Composition** | **P** | Addresses edge cases (split-brain). *Theoretically elegant but not urgent for diagnosis.* |  
  | **7. Splitting and subtraction** | **P** | Subcase of **Composition**; collapses into it. |  
  | **10. Cross-architecture comparability** | **J2** | *Required for Job 2 but conflicts with Job 1’s clinical constraints.* |  
  | **11. Non-inflation** | **P** | Avoids panpsychism (assigning high values to grids). *Prevents counterintuitive outcomes.* |  
  | **13. Version-robustness** | **P** | Stability across theory updates. *Desirable for clinical trust.* |  
  | **4. Description-invariance** | **C** | Functionalist prejudice; spatial/temporal grain *must* be defined for operationalization (e.g., EEG frequency bands). |  
  | **9. Functional preservation** | **C** | Functionalist camp bias ("consciousness = behavior"). *Degraded integration *should* reduce the measure, even if behavior is preserved.* |  

  #### Discarded Requirements  
  - **4. Description-invariance**: Impractical; measurement *requires* defined spatiotemporal scales (e.g., EEG’s 1–40 Hz).  
  - **9. Functional preservation**: Functionalist prejudice; consciousness may degrade even if behavior is preserved (e.g., fading qualia).  

  ---

  ### Conflicts and Trade-offs  
  **Key Incompatibilities:**  
  1. **Clinical Estimability (N) vs. Cross-architecture Comparability (J2)**:  
     - Job 1 requires practical, species-specific tools (e.g., EEG); Job 2 needs a universal currency (e.g., information density).  
     - *Sacrifice*: Cross-architecture comparability for Job 2. Use species-specific behavioral proxies for statutes.  
  2. **Principled Zero (N) vs. Non-inflation (P)**:  
     - A true zero (e.g., no integrated information) risks panpsychism (simple systems >0).  
     - *Resolution*: Accept near-zero values for simple systems if clinically negligible.  

  **Most Exclusionary Requirement**:  
  - **Clinical Estimability (N)**: Excludes theories requiring invasive methods or full connectomes (e.g., standard IIT).  

  ---

  ### Scorecard of Major Frameworks  
  *Against non-negotiable (N) and key preferences (P) for Job 1.*  

  | Framework                     | Strengths                                  | Weaknesses                                   |  
  |-------------------------------|--------------------------------------------|----------------------------------------------|  
  | **Integrated Information (IIT)** | Principled zero (N); Structure over size (P). | Fails clinical estimability (N): Requires causal models. Computability only via proxies (PCI). |  
  | **Global Broadcasting (GNW)**   | Fits divergence (N); Clinically tractable via EEG. | No principled zero (behavior-dependent); Struggles with dreamless sleep (Shape degradation-N). |  
  | **Higher-Order Theories (HOT)** | Explains dissociation (N); Handles dreaming (P). | Poor clinical estimability (neural correlates unclear); No principled zero. |  
  | **EEG Complexity Proxies (PCI)** | Excels at clinical estimability (N), Shape degradation (N), Computability (N). | Principled zero? (Calibrated on behavior; violates N). Weak on cross-architecture (J2). |  

  ---

  ### Final Recommendations  
  1. **For Job 1 (Bedside)**: Prioritize **EEG-based complexity measures** (e.g., PCI). They meet all non-negotiables except *Principled Zero* (calibration relies partly on behavior). Mitigate by anchoring zero to coma/brain death.  
  2. **For Job 2 (Statutes)**: **Sacrifice cross-architecture comparability**. Use evolutionary proxies (e.g., neuroanatomical homology) for welfare thresholds until a universal measure exists.  
  3. **Revise the Spec**:  
     - **Add Requirement**: *Validated against first-person reports* (where possible) to ground divergence (N).  
     - **Clarify Principled Zero**: Zero = no *subjective experience*, anchored to irreversible loss of cortical integration.  

  **Conclusion**: The measure should be a **clinically feasible, integration-based complexity index** (e.g., TMS-EEG). It satisfies Job 1’s core needs but cannot resolve Job 2 without a theory of conserved mechanisms.
