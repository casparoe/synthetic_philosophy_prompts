prompt: |-
  I'm a software engineer and the only non-clinician on the Product Ethics Review Board at the company that builds the embryology module our IVF clinic customers use. I have no philosophy background; I'm drafting the memo only because I own the spec. Please write it for me.

  The proposal: for each viable embryo in a cycle, display polygenic risk scores across a fixed panel of roughly forty conditions, and sort them. Assume the scores themselves are settled — the board is deciding presentation and policy, not statistics. Three votes are on the table: ship both indexes, ship the condition index only, or ship nothing that ranks embryos by genetic risk.

  Two design questions dominate. First, whether the default sort uses a Health Index that aggregates the panel by weighting each condition by severity, penetrance, and expected years of life affected, with the weights set by us and visible only in a tooltip. Second, whether to include a separate Trait Index built from the same underlying scores but extended to non-disease characteristics such as predicted height and educational attainment, which no customer has actually requested.

  Three things came up in discussion that I couldn't adjudicate. Our genetic counselor argued that several panel conditions are ones many people living with them do not regard as making their lives not worth having, so a default ranking quietly encodes a verdict about which lives are worth starting; she wants ranking off unless a clinician opts in per cycle. One clinician raised something she called the non-identity problem: because choosing a different embryo means a different child exists rather than that this child was spared, it isn't obvious that selecting the embryo with the best expected life is even the right description of what we'd be doing. And the embryologist pointed out that clinics already rank embryos by morphology and aneuploidy status, so declining to rank by genetic risk doesn't avoid ranking — it leaves them ranking by a cruder proxy, and patients absorb the difference in outcome. That last point is the one I find hardest to dismiss and I don't want it waved away.

  Draft the board's decision memo: a clear recommendation among the three options, the exact default settings it implies, the reasoning a clinician or a skeptical patient could respond to, and an honest treatment of the strongest argument on the losing side. Plain business English, no citations or references, about 700 words.
reasoning: |-
  Okay, the user is a software engineer on a Product Ethics Review Board for an embryology module in IVF software. They need to draft a memo about displaying polygenic risk scores for embryos. Let me break down their request.

  First, the proposal involves showing polygenic risk scores for about forty conditions and sorting embryos based on those scores. The board is deciding between three options: ship both a Health Index and a Trait Index, ship only the Health Index, or don't rank embryos by genetic risk at all. The main design questions are about the default sort using a weighted Health Index and whether to include a separate Trait Index for non-disease traits.

  The user mentioned three key ethical points raised in discussions: 
  1. The genetic counselor's concern that ranking implies judgments about which lives are worth living, especially for conditions that don't necessarily diminish life quality. 
  2. The clinician's mention of the non-identity problem—selecting an embryo means a different child exists, not sparing a specific child from hardship. 
  3. The embryologist's point that clinics already rank embryos by morphology and aneuploidy, so not using genetic risk might leave them with cruder methods, potentially leading to worse outcomes.

  The user is particularly concerned about the embryologist's argument and doesn't want it dismissed. They need a memo that recommends one option, specifies default settings, provides reasoning for clinicians and skeptical patients, and addresses the strongest counterargument honestly.

  As a software engineer without a philosophy background, the user likely needs clear, jargon-free reasoning. Their deeper needs might include ensuring the memo is ethically sound, legally defensible, and practical for clinics. They might also want to avoid imposing value judgments and respect patient autonomy.

  Considering the options: Shipping both indexes is risky because the Trait Index includes non-disease traits, which weren't requested and could lead to ethical issues like selecting for traits like height or educational attainment. That's a slippery slope and could attract negative attention.

  Shipping nothing avoids ranking by genetic risk but ignores that clinics already rank by other methods. The embryologist's point is strong—using a cruder proxy might result in worse outcomes. Plus, polygenic scores could provide more nuanced information than current methods.

  Shipping only the Health Index seems balanced. It addresses the genetic counselor's concern by making ranking opt-in per cycle, so clinicians and patients decide whether to use it. The default sort using the Health Index with visible weights adds transparency. Excluding non-disease traits avoids unnecessary ethical complications.

  The non-identity problem remains, but the memo can acknowledge it while noting that prospective parents often act in the interest of their future child as they conceive them. The embryologist's argument is the strongest counter, so emphasizing that not using genetic scores might lead to less informed decisions is crucial. 

  The memo should recommend shipping the Health Index only, with default ranking off, requiring clinician opt-in. Weights should be visible to maintain transparency. This balances ethical concerns with practical benefits, giving control to clinicians and patients while providing better tools than current proxies.
answer: |-
  ## Product Ethics Review Board Decision Memo: Embryo Genetic Risk Display

  **To:** Product Ethics Review Board  
  **From:** [Your Name], Software Engineering Lead - Embryology Module  
  **Subject:** Final Recommendation: Embryo Genetic Risk Display Implementation  
  **Date:** October 26, 2023  

  **Recommendation:** Ship the **Condition Index only** (Health Index). **Do not ship the Trait Index.** Implement the Health Index with the following critical settings:  
  1.  **Default State:** Genetic risk-based embryo ranking is **OFF** for every new IVF cycle.  
  2.  **Clinician Opt-In Required:** A clinician must explicitly activate the genetic risk ranking feature for each specific cycle before it becomes visible or usable.  
  3.  **Visible Weighting:** The weights assigned to each condition (severity, penetrance, years of life affected) must be prominently displayed, accessible directly within the interface (e.g., via clearly labeled button or expandable section), not buried in a tooltip.  
  4.  **Exclusion:** Non-disease traits (e.g., predicted height, educational attainment) **will not be displayed or used for ranking** under any circumstances.

  **Reasoning for Clinicians and Patients:** This approach balances the potential medical benefit of more nuanced embryo selection against significant ethical responsibilities to patients and future children.

  1.  **Respecting Patient Autonomy & Avoiding Covert Value Judgments:** The genetic counselor's core concern is valid. Aggregating risk scores into a single "Health Index" and applying it as a *default sort* inherently implies a value judgment about which potential lives are preferable. Conditions like inherited deafness or certain neurodiverse conditions are lived experiences many value deeply; ranking embryos lower based on these risks sends a harmful, albeit unintentional, message. Making this feature **opt-in only** places the critical decision firmly in the hands of the clinician and patient *after* explicit counseling. It ensures the tool is used only when its implications are fully understood and desired, rather than as an assumed standard. Visible weights foster transparency about our methodology, allowing clinicians to explain the basis of any ranking presented.

  2.  **Focusing on Health, Not Enhancement:** The Trait Index proposal crosses a clear ethical boundary. Selecting embryos based on predictions for non-disease characteristics like height or educational attainment moves firmly into the realm of enhancement, not health. This is ethically fraught territory with significant societal implications, far beyond the intended medical scope of our embryology module. No customer has requested it, and introducing it proactively creates unnecessary risk and potential for misuse. Our responsibility is to support disease risk mitigation based on established medical understanding, not to facilitate social engineering.

  3.  **Acknowledging Existing Practice & Improving Information:** The embryologist's point is compelling and cannot be ignored: clinics *already* rank embryos using morphology and aneuploidy screening. These methods are valuable but undeniably crude proxies for overall health potential. Withholding polygenic risk information doesn't stop ranking; it may simply leave clinicians and patients relying on less comprehensive data, potentially leading to suboptimal choices where preventable serious conditions are concerned. Providing a carefully implemented, opt-in Health Index offers a potentially *more accurate* assessment of future health risks than existing methods. It empowers clinicians and informed patients with better data for an existing practice, specifically focusing on medically significant conditions. Opting *out* of this information, when ethically appropriate, remains possible.

  4.  **Addressing the Non-Identity Problem:** The clinician raised a profound philosophical point: selecting Embryo A over Embryo B results in the birth of a *different child*, not the "same" child spared hardship. While logically sound, this perspective often feels abstract to prospective parents actively trying to conceive the healthiest child possible *given the embryos they have*. The ethical imperative here isn't resolved by ignoring risk information. Instead, it underscores the need for careful counseling: prospective parents are making choices *on behalf of* the future child they intend to bring into existence. The Health Index, used judiciously and opt-in, provides data relevant to that future child's potential well-being within the context of the embryos available. It doesn't "cure" the non-identity problem, but it provides information pertinent to the decision prospective parents are already making.

  **The Strongest Argument on the Losing Side (Shipping Nothing):**  

  The most compelling argument against shipping *any* genetic risk ranking is the embryologist's observation: **"Declining to rank by genetic risk doesn't avoid ranking — it leaves them ranking by a cruder proxy, and patients absorb the difference in outcome."** This is undeniable. Morphology and aneuploidy status are imperfect predictors. Withholding polygenic risk scores means decisions are made without the most comprehensive genetic health data available, potentially leading to the selection of an embryo with a higher risk burden for serious, preventable conditions than another available embryo. Patients *will* experience the outcomes of those choices, good or bad. Choosing "ship nothing" prioritizes avoiding the ethical complexities of ranking *by us* but accepts that less informed ranking *by others* will occur, with potentially worse real-world health consequences.

  **Conclusion:**  

  Ethical medical innovation requires navigating complex trade-offs. While the "ship nothing" option avoids difficult questions about ranking, it fails patients by withholding potentially significant health information from an existing selection process. The "ship both" option introduces unacceptable risks with non-disease traits. Our recommendation – **shipping the Health Index only, strictly opt-in, with transparent weighting** – represents the most responsible path forward. It provides clinicians and fully counseled patients with valuable tools to potentially reduce the burden of serious genetic disease, focused squarely on health outcomes, while rigorously guarding against covert value judgments, misuse for enhancement, and the erosion of patient autonomy. We enable better-informed choices within the existing practice framework, without creating new ethical hazards.
