answer: |-
  ### Rigorous Application of Aumann's Agreement Theorem to the 1981 UK Budget Controversy  
  **Agents and Events**  
  - **Agents**: Treat the *364 signatories as individual agents* and the *government (Howe/Treasury) with Minford/Walters as distinct agents*. The statement is not a "corporate posterior" but a *public declaration* pooling heterogeneous beliefs.  
  - **Event**: Unbundle the statement into four events:  
    1. *Forecast*: Output/employment will fall further (E1).  
    2. *Causal claim*: Fiscal contraction in a slump worsens recessions (E2).  
    3. *Theoretical claim*: No economic theory supports the budget (E3).  
    4. *Stability claim*: Policy threatens social/political stability (E4).  

  Aumann’s theorem applies cleanly only to E1 (a forecast with verifiable outcomes). E2–E4 involve model-dependent causal or normative judgments where "agreement" is ill-defined.  

  ---

  ### Information Partitions and Posteriors  
  **Assumptions**:  
  - **Common prior?** Unlikely. Signatories held Keynesian priors (fiscal multipliers >1); government held monetarist priors (inflation expectations dominate).  
  - **Common knowledge of posteriors?** Absent. The statement concealed individual confidence levels; signatures implied unanimity without revealing probabilistic assessments.  

  **Plausible Partitions**:  
  - **Signatories**: Partitioned by theoretical allegiances (e.g., New Cambridge School vs. neoclassical synthesis). Posterior for E1: High P(recession|data), but unquantified.  
  - **Government**: Partition included Bank of England money supply forecasts and political strategy. Posterior: Low P(recession|data), anchored in credibility theory.  

  **Posteriors**: No numerical probabilities published. Signatories’ declaration was binary (“threatens stability”); government’s posterior was implicit in policy enactment.  

  ---

  ### Diagnosis: Ranking Explanations for Disagreement  
  1. **Differential Model Spaces (60% explanatory power)**:  
     - Keynesians (364) and monetarists (Minford) operated in disjoint state spaces. E2–E3 reflect incompatible causal models (fiscal vs. monetary transmission).  
     - *For common priors: Both sides needed identical structural models of the economy.*  

  2. **Non-Bayesian/Motivated Updating (25%)**:  
     - The "only game in town" remark reveals social pressure over belief updating. Signatures functioned as cheap talk (costless signaling).  
     - *For honest posteriors: Beliefs must be updated via Bayes conditional on private information.*  

  3. **Genuinely Different Priors (10%)**:  
     - Priors on NAIRU, inflation inertia, and fiscal neutrality diverged fundamentally.  
     - *For common priors: Shared training/empirical foundations were lacking.*  

  4. **Political Advocacy Masquerading as Belief (5%)**:  
     - The statement bundled normative claims (E4) with forecasts, blurring belief and preference.  

  ---

  ### Counterfactual: Scoring Rule Mechanism  
  - **Setup**: Require all agents (government and academics) to publish probabilities for:  
    - 12-month GDP growth >1% (F1),  
    - Inflation <10% (F2),  
    - Unemployment rise <200k (F3),  
    ... with quadratic scoring rules and £100 stakes.  

  - **Effects**:  
    - **Common knowledge of posteriors?** Yes—reported probabilities become public.  
    - **Convergence?** Unlikely for F1/F3. Keynesians would assign P(F1)≈0.2; monetarists P(F1)≈0.6. The gap would persist, revealing genuine model divergence.  
    - **Priors/State Spaces?** No mechanism to align these. Scoring rules enforce honesty *given models*, not model consistency.  
    - **No-Trade Corollary**: If both sides are risk-neutral, no bets would occur only if posteriors are identical. Observed probability gaps imply willingness to bet reputations (as occurred historically).  

  ---

  ### What the Episode Reveals About Aumann’s Theorem  
  - **Predictive Bite**: The theorem is a *consistency constraint*, not a convergence guarantee. It explains why persistent disagreement *must* stem from prior divergence or non-common knowledge—both present here.  
  - **The Wrong Forecast**: The 1982 recovery (GDP +1.1%, inflation to 8.6% by 1983) refuted signatories’ E1 forecast. This implicates *both* flawed priors (overestimating multipliers) *and* bad luck (external shocks).  
  - **Silences of the Theorem**:  
    - **Convergence Speed**: Even with common knowledge, agreement might require infinite steps.  
    - **Consensus Selection**: The theorem doesn’t favor Keynesian or monetarist consensus.  
    - **Strategic Dishonesty**: When reputational costs deter truth-telling (e.g., fear of isolation), the theorem is inert.  

  ---

  ### Conclusion: The Limits of Formal Consensus  
  The 1981 episode violates Aumann’s antecedents pervasively: disjoint models, political signaling, and unquantified beliefs dominated. A scoring-rule counterfactual would crystallize disagreement but not resolve it. The theorem’s value lies in exposing these fractures—not in forcing agreement. Persistent disagreement here reflects *rational* divergence given irreconcilable worldviews, not algorithmic updating failures. In real-world policy debates, where priors embed ideology and models are contested, Aumann’s conditions are artifacts. The 364 were "wrong" on E1 but expressing legitimate theoretical dissent on E2–E4—a nuance the theorem cannot adjudicate.  

