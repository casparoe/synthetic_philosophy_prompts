answer: |-
  **MEMORANDUM**  
  **TO:** All University Stakeholders  
  **FROM:** Office of Semantic Streamlining (OSS), Chair Dr. A. J. Sterlington  
  **RE:** Transition from Center for Truth and Verification (CTV) to Disquotation Desk (DD)  
  **DATE:** October 27, 2023  

  Following the Working Group for Review Efficiency (WG-RE)’s comprehensive audit, the Center for Truth and Verification (CTV) will dissolve effective immediately. Its functions are superseded by the Disquotation Desk (DD), a lean operational unit dedicated to enhancing communicative efficiency university-wide. The CTV regrets any inconvenience this may cause. Below, we address key questions regarding this transition:  

  1.  **Why replace the CTV?**  
      The WG-RE determined that "truth" lacks substantive content as a distinct property. Asserting "P is true" is operationally equivalent to asserting "P." Retaining "true" introduces redundant lexical layers without adding informational value. The DD will eliminate this redundancy by removing "true," "truth," and cognates from all official communications, handbooks, policies, and reports. As Dean H. Finch (Administrative Optimization) noted: "Efficiency demands we shed conceptual baggage."  

  2.  **How will the DD handle broad endorsements?**  
      *Example Issue: The Faculty Handbook states, "All policies in Section 4-A are true."*  
      The DD will replace such generalizations with explicit listings of the endorsed claims. For instance, "Policy 4.1.7 governs office hours; Policy 4.1.8 governs email response times; [etc.]". While this may produce longer documents, it avoids the vacuous meta-claim "is true," aligning with our commitment to semantic parsimony.  

  3.  **How can committees endorse reports without reviewing content?**  
      *Example Issue: The Senate votes to affirm "The findings of the Ad Hoc Committee on Parking are true."*  
      The DD will revise such resolutions to: "The Senate endorses the findings of the Ad Hoc Committee on Parking." This replaces "are true" with a performative act of endorsement. As clarified by the WG-RE: "Truth-talk" here merely signals institutional approval; the DD captures this function without the extraneous term.  

  4.  **Does this imply inquiry shouldn’t aim for truth?**  
      Not at all. The DD’s mandate concerns *language*, not epistemology. Assertions remain subject to evidence, and inquiry remains worthwhile. However, "truth" is no more than a device for generalizing or endorsing claims. Removing it does not alter standards of evidence or the goal of inquiry; it merely streamlines how we *describe* successful outcomes. As the WG-RE states: "Calling a claim ‘correct,’ ‘accurate,’ or ‘supported’ suffices."  

  5.  **What happens to CTV’s fact-checking & audit unit?**  
      This unit is discontinued. Since "truth" is not a substantive property requiring verification, auditing claims for "truth" is incoherent. Resources are reallocated to the Office of Empirical Validation (OEV), which assesses claims against evidence without invoking the T-word. The DD will collaborate with OEV to ensure all university statements meet evidence-based standards *before* disquotation occurs.  

  6.  **Concerns from the Office of Existence (OoE) and Office of Reference (OR)?**  
      The OoE inquired if "exists" faces similar elimination (e.g., "unicorns exist" = "there are unicorns"). The OR raised parallel concerns about "refers" (e.g., "‘Mars’ refers to Mars"). The WG-RE acknowledges these queries but deems them out of scope. The DD’s remit is strictly truth-theoretic. Per Vice-Provost L. Bracket: "One redundancy at a time, please."  

  7.  **Compliance & Self-Audit**  
      All departments must submit current documents to the DD by 11/30/23 for disquotation. A preliminary self-audit of this memo revealed a complication:  
      > *"This memo contains no false statements."*  
      The DD cannot disquote this claim without generating an infinite regress ("This memo contains no false statements" contains no false statements" etc.). More critically, "false" (as "not true") presupposes the property the DD rejects. The DD lacks tools to parse such self-referential instances, as there is no property of "falsity" to analyze. Departments are advised to avoid such constructions.  

  **Budget Note:** Funds from the CTV dissolution ($850,000) are reallocated as follows:  
  - $825,000 to the OEV for evidence-validation infrastructure.  
  - $25,000 to the DD for document processing software and two graduate assistants.  

  The DD looks forward to collaborating with stakeholders in pursuing a more efficient, semantically disciplined university. Questions may be directed to disquotation@university.edu.  

  Dr. A. J. Sterlington  
  Chair, Office of Semantic Streamlining  

  ---

  **Diagnostic Highlights (For Instructor Use):**  
  1.  **Generalization Problem (FAQ 2):** The DD must replace "all policies are true" with an exhaustive list, mistaking disquotation for a feasible substitute for generalization.  
  2.  **Blind Endorsement (FAQ 3):** Reducing "is true" to a performative ("endorses") ignores cases where endorsers *cannot* state the claim (e.g., trusting an expert’s sealed report).  
  3.  **Normative Shrug (FAQ 4 & 5):** The memo denies truth is normative ("no more than a device"), then infers fact-checking is obsolete—directly contradicting the claim that evidence-based standards remain intact. The reductio is the budget reallocation closing the audit unit.  
  *(Bonus: The OoE/OR brush-off in FAQ 6 illustrates the view’s ad-hoc boundaries; the memo’s self-reference in FAQ 7 shows its inability to handle normative/metalinguistic uses of truth/falsity.)*
