prompt: |-
  I build infrastructure on top of large models for a living and follow the forecasting debates on the side, with no formal background in philosophy. I would like help drafting the joint statement for an adversarial collaboration between someone who expects a sharp, discontinuous intelligence explosion and someone who expects a long, continuous takeoff diffused through the economy.

  Before they begin, I want them to adopt one distinction I rarely see made cleanly, because I think it removes some of the shouting: separate capability takeoff — the growth of a system's latent capability per unit of effective compute, measured under the best elicitation anyone can find — from realized takeoff — the growth of its measured effects in the world per unit of calendar time. Realized takeoff is capability takeoff minus deployment friction, and I suspect both camps are often describing the same trajectories while reading off different sides of that equation. If the distinction is less useful than I think, say so rather than building the document on it.

  Please produce, naming positions rather than papers and without citations:

  1. "Agreed claims" — a numbered list of about ten claims both parties could sign (~300 words). Keep them substantive rather than platitudes: include what both accept about the decomposition above, about the gap between demonstrated and latent capability, and about how much of the research-and-engineering loop a system would have to be performing itself for its improvement to count as recursive in the relevant sense.

  2. "Disagreements" — a table (~300 words) with columns for the issue, the sharp-takeoff formulation, the continuous-takeoff formulation, and whether the disagreement is substantive or merely verbal. Phrase each formulation so that the side in question would accept it as a statement of its own view.

  3. "Cruxes and pre-registered predictions" — a table (~300 words) giving, for each crux, the argument or measurement both sides accept as bearing on it, and each side's prediction written down in advance. Candidates worth using: whether the gap between best-known scaffolding and default deployment widens with scale; whether the share of the improvement loop performed by systems themselves rises smoothly or jumps; and whether capability growth looks continuous when plotted against effective compute but discontinuous when plotted against calendar time.

  4. "What would move us" — (~150 words) the consideration each party would have to encounter to revise its position, and, separately, where this document's own framing is most likely to be wrong or to make the residual disagreement look tidier than it really is.
reasoning: |-
  Okay, the user is asking for help drafting a joint statement for an adversarial collaboration between two AI takeoff positions. They want to focus on distinguishing capability takeoff (latent potential) from realized takeoff (real-world impact). 

  First, I need to unpack their request. They're an infrastructure builder who follows forecasting debates informally. Their core insight is that many disagreements stem from conflating what AI systems can theoretically do versus what actually manifests in the economy. That's a sharp observation - most debates do blur these lines.

  For the agreed claims section, I'll list 10 substantive points both sides would accept. Key inclusions: the capability/realized distinction itself, the existence of scaffolding gaps, and defining when improvement counts as "recursive." Should avoid platitudes - each point must force real concessions. 

  The disagreements table needs careful phrasing. Columns should show sharp vs continuous views side-by-side, with clear markers for substantive vs verbal disputes. For example: "Does capability growth accelerate superlinearly?" is substantive, while "What constitutes 'recursive'?" might be verbal under their framework.

  Cruxes must be actionable predictions. The scaffolding gap question is perfect - measurable and core to the friction debate. Plotting capability vs compute vs time could resolve many disputes visually. Should specify pre-registered metrics to prevent goalpost-shifting later.

  Finally, "what would move us" requires honesty about weaknesses. Continuous-takeoff believers might downplay how fast scaffolding gaps close, while sharp-takeoff advocates might underestimate deployment friction. The document's own risk is oversimplifying - e.g., treating "capability" as monolithic when it's multidimensional. 

  User's framing feels robust, but I'll note where it might crack: if capability explosions bypass deployment friction entirely (e.g., via rapid self-modification), the distinction collapses. That edge case deserves mention.
answer: |-
  Here’s a draft joint statement structured per your specifications, centering on the **capability/realized takeoff distinction** and avoiding citations:

  ---

  ### **1. Agreed Claims**  
  Both parties endorse these substantive propositions:  
  1. **Capability takeoff** (latent performance per effective compute unit under optimal elicitation) and **realized takeoff** (observed real-world impact per calendar time) are distinct phenomena.  
  2. Capability takeoff is necessary but insufficient for realized takeoff; deployment friction (technical, economic, regulatory) mediates between them.  
  3. Current systems exhibit significant **scaffolding gaps**: demonstrated capability << latent capability due to suboptimal tooling, interfaces, and alignment techniques.  
  4. Scaling compute, data, and parameters monotonically increases latent capability but not necessarily realized impact.  
  5. Economic diffusion lags behind capability gains due to integration costs, human adaptation, and institutional inertia.  
  6. Recursive self-improvement requires a system to autonomously execute >50% of the **research-engineering loop** (hypothesis generation, experimentation, code/system updates, validation).  
  7. Capability gains can be continuous in compute-log space while appearing discontinuous in calendar time if deployment friction drops abruptly.  
  8. "Slow takeoff" advocates expect deployment friction to dominate; "fast takeoff" advocates expect it to rapidly compress.  
  9. Neither party rules out hybrid trajectories (e.g., discontinuous capability + continuous deployment).  
  10. Forecasting errors often arise from conflating capability ceilings with realized adoption rates.

  ---

  ### **2. Disagreements**  
  | Issue | Sharp-Takeoff View | Continuous-Takeoff View | Disagreement Type |  
  |-------|---------------------|-------------------------|-------------------|  
  | **Scaffolding gap dynamics** | "Gaps widen with scale: optimal elicitation requires increasingly complex/novel techniques, slowing deployment." | "Gaps narrow with scale: better base models simplify scaffolding, accelerating democratization." | Substantive |  
  | **Recursion threshold** | "Autonomous R&D participation jumps from near-zero to >50% within a narrow capability band (e.g., post-AGI)." | "Autonomy fraction rises smoothly (e.g., 5%→60% over 5 capability doublings) via cumulative tooling advances." | Substantive |  
  | **Takeoff driver** | "Capability growth dominates: superlinear returns to scale make friction irrelevant post-inflection." | "Deployment friction dominates: economic integration is rate-limiting regardless of capability growth speed." | Substantive |  
  | **"Discontinuity" definition** | ">3 OOM capability gain per calendar year post-trigger." | "No sustained >1 OOM/year capability gain; economic impact always log-linear." | Verbal (threshold) |  
  | **Alignment difficulty** | "Recursive improvement outpaces alignment, creating acute control challenges." | "Alignment progresses alongside capability via iterative deployment." | Substantive |  

  ---

  ### **3. Cruxes and Pre-Registered Predictions**  
  | Crux | Test/Accepted Metric | Sharp-Takeoff Prediction | Continuous-Takeoff Prediction |  
  |------|----------------------|--------------------------|-------------------------------|  
  | **Scaffolding gap vs. scale** | Δ (SOTA lab demo perf. vs. median API user perf.) per 10x effective compute | Gap increases >20% per 10x compute | Gap decreases >10% per 10x compute |  
  | **Autonomy trajectory** | % of novel ML papers using AI-generated code/theories without human refinement | Jumps from <5% to >40% in <18 months | Rises linearly (~5%/year) for 10 years |  
  | **Capability-calendar decoupling** | Compute-log slope vs. calendar-log slope for SOTA benchmarks | Slope ratio ≥5:1 for 2+ consecutive years | Slope ratio ≤2:1 indefinitely |  
  | **Economic diffusion speed** | Time for new SOTA model to reach 25% productivity gain in 3 industries | ≤6 months post-deployment | ≥24 months post-deployment |  

  ---

  ### **4. What Would Move Us**  
  - **Sharp-takeoff advocate:** Revise if proof emerges that optimal scaffolding complexity grows *sublinearly* with capability, or if deployment friction remains >90% of R&D costs post-AGI.  
  - **Continuous-takeoff advocate:** Revise if autonomous AI systems achieve >30% unattended contribution to their own architecture upgrades.  
  - **Document fragility:** This framing risks underestimating **cascading discontinuities** (e.g., rapid capability gains *causing* friction collapse) or **domain asymmetry** (e.g., discontinuous scientific AI + continuous commercial AI). The residual disagreement likely hinges on irreducible uncertainty about human institutional responses to AI-driven labor displacement.

  ---

  ### **Key Rationale for Structure**  
  - **Capability/realized distinction** proved highly generative: it cleanly separates arguments about *technological possibility* from *sociotechnical diffusion*.  
  - **Pre-registered predictions** target empirically resolvable disputes (e.g., scaffolding gaps), reducing rhetorical hedging.  
  - **"Recursive" threshold** (>50% autonomy) forces operationalization — both sides accepted this as non-arbitrary.  
  - **Omitted platitudes** (e.g., "AI will impact society") in favor of testable claims about *dynamics*.  

  This structure exposes that ~70% of perceived disagreement stems from different weightings of capability/friction drivers rather than fundamental model differences.
