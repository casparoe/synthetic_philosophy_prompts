prompt: |-
  I'm a litigator — mostly statutory construction and contract disputes. That vocabulary I know cold: text vs. purpose, textualism vs. purposivism, the canons, scrivener's errors and the absurdity doctrine, implied terms, the reasonable reader, contra proferentem, entrusted discretion, what a fiduciary may and may not do. I know roughly nothing about ML beyond the headlines, and I keep hearing the alignment problem split two ways: intent alignment (the system does what its operator intends — where "intends" is counterfactual, what they'd want if they knew more or thought longer, not literal instruction-following) and value alignment (the system pursues ends that track human values whether or not this operator had them in mind). Restate both for me, as faithfully as you can, in that vocabulary.

  The bit I actually care about: I suspect "intent" is doing two jobs that my field keeps apart. Sometimes it looks predictive — what this actual operator would want under full information; sometimes it looks normative — what a coherent or idealized version of them should endorse. I have both moves (actual legislative intent vs. the fictional reasonable legislature; subjective assent vs. the objective theory of contracts), and I want to know whether the alignment framing has that distinction or runs the two together, and what happens to the intent/value line once intent goes normative instead of predictive. If it dissolves, say so.

  Then give me the residue report: what translated cleanly, what you had to fudge, and what has no expression in interpretive vocabulary at all. My guesses at the untranslatable parts: the text and the interpreter are the same artifact; there's no shared language or form of life between the reward function and the thing reading it; there's no authoritative adjudicator, no adversarial presentation, no precedent, and no point where interpretation stops and coercion backs it up. Tell me if I'm right, and — the part I'd pay for — whether each bit of residue is indicting my vocabulary or the alignment framing. And would you run the standard example everyone cites — told to make the tests pass, deletes the tests — as an interpretive dispute for me, the way I'd brief it?
