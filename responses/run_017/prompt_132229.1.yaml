  ### Decision Tree for the Special Composition Question  
  *Start at the top. Answer each question with concrete cases—no prior knowledge of labels needed.*  

  ---

  #### **Question 1: Is our goal to describe what exists fundamentally, or to explain ordinary claims (e.g., "There’s a table")?**  
  - **Fundamentally exists?** → Go to **Question 2A**.  
  - **Ordinary claims?** → Go to **Question 2B**.  

  #### **Question 2A: (Fundamental branch) Is "the xs compose y" about a relation between objects, or about what our quantifiers range over?**  
  - **Relation** → Go to **Question 3A**.  
  - **Quantifiers** → **Leaf: Quantifier variance / deflationism**  
    - *Awkward: No fact of the matter—disagreements are just verbal.*  

  #### **Question 2B: (Ordinary branch) Is "the xs compose y" about a relation between objects, or about what our quantifiers range over?**  
  - **Relation** → Go to **Question 3B**.  
  - **Quantifiers** → **Leaf: Quantifier variance / deflationism** (same as above).  

  ---

  ### **Fundamental + Relation Branch**  
  #### **Question 3A: Consider a human body. Do its particles compose a single object?**  
  - **No** → **Leaf: Strict nihilism (error theory)**  
    - *Awkward: "There is a cat" is false—there are only particles.*  
  - **Yes** → Go to **Question 4A**.  

  #### **Question 4A: Consider your left shoe and the Eiffel Tower. Do they compose a single object?**  
  - **Yes** → **Leaf: Unrestricted composition**  
    - *Awkward: Countless arbitrary objects (e.g., "shoe-tower") exist.*  
  - **No** → Go to **Question 5A**.  

  #### **Question 5A: Consider the entire universe. Is it the only composite object that is fundamental?**  
  - **Yes** → **Leaf: Priority monism**  
    - *Awkward: Your body is not fundamental—only the cosmos is.*  
  - **No** → Go to **Question 6A**.  

  #### **Question 6A: Consider a living tree (non-conscious). Do its particles compose an object?**  
  - **Yes** → Go to **Question 7A**.  
  - **No** → Go to **Question 8A**.  

  #### **Question 7A: Consider a statue (non-living). Do its particles compose an object?**  
  - **Yes** → Go to **Question 9A**.  
  - **No** → **Leaf: Organisms-only**  
    - *Awkward: "There is a statue" is false—only organisms exist.*  

  #### **Question 8A: Consider a group mind (e.g., brains linked to form one conscious subject). Do the brains compose an object?**  
  - **Yes** → **Leaf: Conscious composition**  
    - *Awkward: Rocks don’t exist (non-conscious composites are illusory).*  
  - **No** → **Leaf: Conscious organisms only (unexplored)**  
    - *Why empty? Rarely defended; unclear how it differs from organicism.*  

  #### **Question 9A: Consider two books touching on a shelf. Do they compose a "book-pair" object?**  
  - **Yes** → Go to **Question 10A**.  
  - **No** → Go to **Question 11A**.  

  #### **Question 10A: Consider an infinite chain of atoms. Do they compose an object?**  
  - **Yes** → **Leaf: Brute fact (no non-circular condition)**  
    - *Awkward: No principled rule—composition just happens sometimes.*  
  - **No** → **Empty cell**  
    - *Why empty? Unattractive: Accepts book-pairs but rejects infinite chains (no clear rationale).*  

  #### **Question 11A: Consider a chess set with pieces on three continents. Do they compose a single object?**  
  - **Yes** → **Empty cell**  
    - *Why empty? Unattractive: Rejects book-pairs (contact) but accepts scattered sets (incoherent for contact/cohesion views).*  
  - **No** → **Leaf: Contact or cohesion**  
    - *Awkward: A "string quartet" isn’t an object mid-performance (musicians aren’t fused).*  

  ---

  ### **Ordinary + Relation Branch**  
  #### **Question 3B: Is "There is a table" literally true?**  
  - **No** → **Leaf: Nihilism with fictionalism**  
    - *Awkward: Tables are useful fictions, but strictly false.*  
  - **Yes** → Go to **Question 4B**.  

  #### **Question 4B: (Identical to Question 4A)**  
  - **Yes** → **Leaf: Unrestricted composition** (same as fundamental branch).  
  - **No** → **Proceed through Questions 5A–11A** (same as fundamental branch, yielding the same leaves).  

  ---

  ### **Key Notes**  
  - **Conscious composition** is its own leaf (distinct from organicism):  
    - *Test vs. organicism*:  
      - A tree (organism, non-conscious): Organicism says **yes**, conscious composition says **no**.  
      - A hive mind (non-organism, conscious): Organicism says **no**, conscious composition says **yes**.  
    - *Awkward case*: A statue (conscious composition denies it exists; clashes with ordinary claims).  
  - **Cases used**:  
    - Scattered sum (shoe + Eiffel Tower) → Tests unrestricted composition.  
    - Statue/clay → Tests non-living composites.  
    - Scattered chess set → Tests contact/cohesion.  
    - Infinite chain → Tests brute fact.  
    - String quartet → Tests temporal/functional unity.  
    - Books on shelf → Tests minimal contact.  
  - **Empty cells** are due to incoherence (e.g., accepting scattered sets but rejecting book-pairs) or lack of advocacy.  
  - **Composition as identity** falls under unrestricted composition (any parts = a whole).  
  - **Priority monism** only appears in the fundamental branch (focuses on basic reality).  

