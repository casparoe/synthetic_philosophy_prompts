  We are writing a research proposal for a six-month fellowship. The project is about program equilibrium in a variant of the one-shot Prisoner's Dilemma where players do not have full access to each other's program but instead receive a signal through a fixed, publicly known recognition channel. The key question is what happens when access is partial.

  We structure the proposal as continuous prose with the following elements:

  1. **Precise Statement of the Question**: We formalize the game and the recognition channel. We decide that programs may only read the signal (not simulate the opponent arbitrarily) because allowing arbitrary simulation could lead to undecidability and is less realistic in many contexts (e.g., if the program is running in a sandboxed environment). We explain why this choice matters: it restricts the strategies and avoids the complexity of arbitrary simulation.

  2. **Why Standard Identity-Checking Leaves the Question Open**: We explain that the standard method of checking for identical source code (or provable equivalence) fails when the channel is partial. We then frame the trade-off: a channel that is too fine (discriminating) might fail to recognize equivalent but differently implemented cooperators, while a channel that is too coarse might allow a defector to mimic a cooperator's signal. We state that this framing is correct and that the real structure is a trade-off between robustness to reimplementation and safety against mimicry.

  3. **Six-Month Plan**: We choose to aim for a characterization of the channels that support cooperation because it is more promising and likely to yield a theorem. We break the plan into phases: (i) formalize the model and define the equilibrium concept; (ii) analyze specific channel families (e.g., hash functions, bounded sketches, test outputs) to build intuition; (iii) prove a general characterization theorem for when cooperation is achievable; (iv) prepare the results for publication. We argue against alternatives (like an impossibility result) because a characterization can include both positive and negative results.

  4. **Possible Conclusions and Scope**: We outline possible outcomes: a theorem characterizing channels that allow cooperation, or an impossibility result for a broad class. The project fails if we cannot find any such characterization and are left with only loose observations. We note that we prefer a sharp result for a narrow family of channels (e.g., channels that are equivalence relations with certain properties) over a loose general theory.

  Now, we write the proposal in continuous prose, aiming for about 900 words.

  ---

  **Research Proposal: Partial Access and Cooperation in Program Equilibrium**

  **1. Introduction and Problem Statement**

  The program equilibrium framework for the one-shot Prisoner's Dilemma (PD) allows mutual cooperation by having each player submit a program that conditions its action on the other player's program. The standard solution relies on each program checking whether the other is identical (or provably equivalent) to itself. However, this requires perfect reciprocal access to the entire program source. In practice, access might be partial: players might receive only a limited signal about the opponent's program. This project investigates what forms of partial access still enable cooperation.

  We formalize a variant of the program equilibrium game. Each player submits a program (a Turing machine) that, when executed, is given a description of the opponent's program only through a fixed, publicly known *recognition channel* φ. The channel φ maps any program to an element in a set S (the signal space). The program then outputs an action (C or D). The payoff is determined by the pair of outputs in the standard PD matrix (where mutual cooperation yields the highest joint payoff, but defection is dominant in the one-shot without conditioning).

  Crucially, we restrict the programs to only having access to the signal φ(opponent_program), not the full program. We do *not* allow the program to simulate the opponent on arbitrary inputs. This choice matters for two reasons. First, arbitrary simulation could lead to undecidability and halting problems, making equilibrium analysis intractable. Second, in many realistic settings (e.g., when programs run in secure environments), arbitrary simulation is infeasible. By restricting to the channel, we focus on the informational content of the signal and avoid the complexities of simulation.

  The central question is: *Under what conditions on the channel φ does there exist a pair of programs (one for each player) that yield mutual cooperation in a subgame-perfect equilibrium?* We call such a channel *cooperation-supporting*.

  **2. Why Standard Identity-Checking Fails and the Trade-off**

  The standard construction for program equilibrium—where each program cooperates if and only if the other's program is identical (or provably equivalent) to itself—fails in the partial access setting because the channel φ might not reveal enough to check identity. For instance, if φ outputs a cryptographic hash of the source, then two functionally equivalent programs with different source codes would yield different signals, so the identity-checking program would defect. Conversely, if φ is constant (no information), then no nontrivial conditioning is possible, and defection is the only equilibrium.

  This leads to a fundamental trade-off. On one hand, for cooperation to be robust against reimplementation, the channel must be coarse enough to group together different implementations of the same mechanism (i.e., φ must be invariant under some acceptable variations). On the other hand, to be safe against mimicry by defectors, the channel must be fine enough to distinguish cooperators from defectors. A defector could try to produce a signal that matches that of a cooperator, thereby tricking the cooperator into cooperating while it defects.

  This framing is correct: there is a genuine trade-off. A channel that is too fine (e.g., revealing the entire source) makes mimicry difficult but is brittle to reimplementation. A channel that is too coarse (e.g., revealing nothing) is robust to reimplementation but allows easy mimicry. The challenge is to find channels that strike a balance.

  **3. Research Plan**

  We propose a six-month project to characterize the channels that support cooperation. We choose this goal over an impossibility result because we believe that for many natural channels (e.g., those that capture functional equivalence classes), cooperation is achievable. Moreover, a characterization can encompass both positive and negative results. The plan has four phases:

  *Phase 1: Formalization and Equilibrium Concept (Month 1)*
  We will formalize the game with channel φ and define an appropriate equilibrium concept. Since the programs are chosen simultaneously and each conditions on the signal of the other, we will use the concept of *program equilibrium* adapted to the channel setting. We will also model the channel φ as a function from programs to signals and define what it means for a pair of programs to form an equilibrium. We will then define the property of a channel being cooperation-supporting.

  *Phase 2: Case Studies (Months 2-3)*
  We will analyze specific families of channels to build intuition and identify candidate properties for the characterization. Examples include:
  - *Hash functions*: φ outputs a fixed-length hash of the source. We expect that unless the hash is of the entire source (which is effectively full access for large enough programs), cooperation is fragile.
  - *Bounded sketches*: φ outputs a fixed-size sketch (e.g., a projection of the source). We will study how the sketch size affects cooperation.
  - *Test outputs*: φ outputs the results of running the opponent's program on a fixed set of test inputs. We will investigate what test sets allow cooperators to recognize each other but not be mimicked by defectors.

  *Phase 3: General Characterization Theorem (Months 4-5)*
  Based on the case studies, we will formulate and prove a theorem characterizing cooperation-supporting channels. A promising direction is to require that the channel φ induces an equivalence relation that is (i) *refinable*: a cooperator can choose a program such that the set of programs with the same signal is exactly the set of programs that would cooperate with it (thus avoiding mimicry), and (ii) *robust*: the equivalence classes include all acceptable implementations of the same mechanism. We will also explore the minimal structure required (e.g., symmetry, reflexivity, and transitivity of the equivalence relation induced by φ).

  *Phase 4: Preparation for Publication (Month 6)*
  We will write up the results and prepare a manuscript for submission to a top conference (e.g., EC, TARK, or a journal like *Games and Economic Behavior*). We will also create an online appendix with detailed proofs.

  *Why this approach?* Alternatives such as attempting a general impossibility result for all channels are less promising because they might be too broad and negative. By focusing on a characterization, we can identify the conditions under which cooperation is possible and provide guidance for designing recognition channels in practice.

  **4. Possible Conclusions, Failure, and Scope**

  The project will succeed if we can prove a characterization theorem. For example: "A channel φ supports cooperation if and only if it induces an equivalence relation that is both coarse enough to include all functionally equivalent programs and fine enough to be distinguishable by a cooperator from any defector." We might also discover that only very specific channels (e.g., those that capture exactly the equivalence classes of a particular model of computation) work.

  The project fails if we cannot find a clean characterization and are left with ad-hoc observations for specific channels. However, even in this case, the case studies will provide valuable insights.

  We prefer a sharp result for a narrow family of channels (e.g., channels that are equivalence relations with computable invariants) over a loose general theory. The scope is deliberately focused on the one-shot PD with two players; extensions to more players or other games are beyond the six-month timeline but would be natural follow-ups.

  **Conclusion**

  This project addresses a fundamental question at the intersection of game theory and computer science: how much mutual knowledge is required for cooperation? By formalizing the role of recognition channels in program equilibrium, we aim to provide a theoretical foundation for understanding cooperation under partial information. The results could inform the design of systems where agents interact with limited access to each other's internals, such as in cryptographic protocols, smart contracts, and decentralized autonomous organizations.
answer: |-
  **Research Proposal: Cooperation under Partial Recognition in Program Equilibrium**  

  **1. Introduction and Problem Statement**  
  The program equilibrium framework resolves the one-shot Prisoner’s Dilemma (PD) by enabling mutual cooperation through reciprocal source-code inspection. Players submit programs that conditionally cooperate if they verify the opponent’s program is identical or provably equivalent to their own. However, this solution relies on perfect access to the opponent’s mechanism—an idealized assumption. This project investigates how cooperation fares when access is mediated by a constrained *recognition channel* \(\phi\), which outputs a fixed, publicly known signal derived from the opponent’s program. The core question is: **What channels \(\phi\) permit mutually cooperative equilibria, and how do constraints on recognizability enable or undermine cooperation?**  

  We formalize a variant of the program equilibrium game:  
  - Each player submits a program \(P_i\) (a Turing machine).  
  - Before outputting an action (C or D), \(P_i\) receives only \(\phi(P_j)\), the signal for \(P_j\) from a channel \(\phi: \text{Programs} \to \mathcal{S}\), where \(\mathcal{S}\) is a finite or countable signal space.  
  - Payoffs follow the PD matrix: mutual cooperation (CC) yields \((R,R)\), mutual defection (DD) yields \((P,P)\), and asymmetric play yields \(T\) (temptation) for defection and \(S\) (sucker) for cooperation, with \(T > R > P > S\) and \(2R > T + S\).  

  Crucially, **programs cannot simulate the opponent on arbitrary inputs**; they only observe \(\phi(P_j)\). This restriction is essential for two reasons. First, it reflects realistic constraints (e.g., sandboxed execution, limited bandwidth) where arbitrary code execution is infeasible. Second, allowing simulation would trivialize the problem: a program could ignore \(\phi\) and directly simulate the opponent’s response to \(\phi(P_i)\), collapsing to the full-access case. By forbidding simulation, we isolate the role of \(\phi\) as the sole conduit of information.  

  **2. Why Identity Checking Fails and the Trade-off Structure**  
  The standard identity-checking construction fails under partial access because it assumes \(\phi\) reveals sufficient detail to verify syntactic or semantic equivalence. When \(\phi\) is coarse (e.g., a constant signal), mimicry is trivial: a defector can adopt any signal associated with a cooperator, inducing cooperation while defecting. Conversely, if \(\phi\) is too fine (e.g., a cryptographic hash of the source code), functionally equivalent programs with distinct implementations yield different signals, causing cooperators to defect against legitimate partners.  

  **This framing is correct**: there exists a trade-off between **robustness to reimplementation** (coarse \(\phi\) tolerating varied implementations of the same strategy) and **safety against mimicry** (fine \(\phi\) preventing defectors from impersonating cooperators). Crucially, the trade-off arises because:  
  - *Robustness* requires \(\phi\) to map equivalent programs (e.g., differing only in dead code) to identical signals.  
  - *Safety* requires that no defector’s signal matches a cooperator’s signal.  
  These goals conflict when the equivalence classes induced by \(\phi\) misalign with the semantic classes of "cooperator" and "defector" programs. Thus, the central challenge is to identify channels \(\phi\) that reconcile robustness and safety or prove they cannot coexist.  

  **3. Six-Month Research Plan**  
  We aim for a **characterization theorem** specifying channels \(\phi\) that support cooperative equilibria. This is more promising than an impossibility result because preliminary analysis suggests cooperation *is* achievable for non-trivial \(\phi\) (e.g., channels capturing runtime behavior on public test inputs). A characterization also offers practical insights for mechanism design.  

  **Phase 1: Formalization and Simple Cases (Month 1–2)**  
  - Define the game’s mechanics, strategy space, and equilibrium concept (subgame perfection adapted to program selection).  
  - Analyze degenerate \(\phi\): constant signals (no cooperation), perfect source inspection (cooperation trivially achievable), and bounded-length signals (e.g., 1-bit hashes).  
  - **Goal**: Identify necessary conditions (e.g., \(\phi\) must be non-constant and distinguish some cooperators from defectors).  

  **Phase 2: Constructive Positive Results (Month 3–4)**  
  - Focus on \(\phi\) defined by **public test executions**: \(\phi(P)\) outputs \(P\)’s behavior on a fixed set of inputs.  
  - Construct cooperative programs that:  
    (i) Run a "fingerprint test" on their own code against \(\phi(P_j)\) to verify functional equivalence.  
    (ii) Defect if \(\phi(P_j)\) matches a defector’s known signal pattern.  
  - Prove such programs form an equilibrium if the test set is rich enough to expose "shallow" mimicry but coarse enough to accept equivalent implementations.  
  - **Why this approach?** Test-based \(\phi\) is tractable, mirrors real-world code-signing (e.g., app stores), and avoids undecidability in equivalence proofs.  

  **Phase 3: General Characterization and Limits (Month 5)**  
  - Abstract the lesson from Phase 2: A channel \(\phi\) supports cooperation if it induces a **signal structure** where:  
    (a) Cooperators share a recognizable signal *invariant* under valid reimplementations.  
    (b) The signal *separates* cooperators from all defectors.  
  - Formalize this as: *Existence of a "cooperator class" \(\mathcal{C} \subset \text{Programs}\) such that \(\phi(P) = \phi(P')\) for all \(P, P' \in \mathcal{C}\), and \(\phi(\mathcal{C}) \cap \phi(\mathcal{D}) = \emptyset\) for all defector sets \(\mathcal{D}\).*  
  - Test necessity via counterexamples: e.g., if \(\phi\) is a hash function, show that collision-resistance conflicts with reimplementation robustness.  
  - **Why not alternatives?** An impossibility result for "all robust and safe \(\phi\)" is less likely: Phase 2 may yield positive cases, and narrow channels (e.g., test-based) avoid broad impossibilities.  

  **Phase 4: Dissemination (Month 6)**  
  - Draft a paper with formal theorems and examples.  
  - Publish results at venues like EC (Economics and Computation) or TARK (Theoretical Aspects of Rationality and Knowledge).  

  **4. Possible Conclusions, Failure Modes, and Scope**  
  **Success**: A sharp characterization, e.g., "Cooperation is achievable iff \(\phi\) admits a signal-invariant cooperator class disjoint from all defector signals." For test-based channels, this might require the test set to be a *separating set* for program functionality.  

  **Failure**: The project fails if no equilibrium exists for any non-trivial \(\phi\) (unlikely, given preliminary intuition) or if characterization requires overly restrictive assumptions (e.g., infinite signal spaces). Failure risks include undecidability in program equivalence or pathological channel behaviors.  

  **Scope**: We prioritize **sharp results for narrow channels** (e.g., test-based \(\phi\), bounded-length sketches) over loose general theories. This ensures rigor, even if generality is limited. Extensions to n-player games or other channels (e.g., approximate hashes) are noted as future work but excluded from the core six-month focus.  

  **Conclusion**  
  This project bridges algorithmic game theory and program verification by formalizing how cooperation depends on constrained recognition. By characterizing channels \(\phi\) that enable cooperation despite partial access, we illuminate fundamental limits in designing robust, decentralized cooperation mechanisms. The approach balances ambition with feasibility, targeting a concrete result in six months.
