     *Confidence: Medium*  

  3. **"The objection is Kripke's ... If conceivability entailed possibility, necessary a posteriori truths would be impossible. So the naive bridge ... is dead."**  
     ✅ **Right** (1.5 marks). Clear explanation of the materialist's counterexample.  
     *Confidence: High*  

  4. **"The two-dimensional framework supplies something weaker ... *Water is not H₂O* is 1-possible but not 2-possible ... Phenomenal terms are unlike natural-kind terms ... So a scenario verifying P and not-Q ... should also verify it counterfactually."**  
     ⚠️ **Defensible but Imprecise** (1.5 marks). Correctly applies 2D framework to phenomenal terms but omits a key nuance: the anti-materialist argues that phenomenal statements have *identical* primary/secondary intensions (unlike "water"), making 1-possibility imply 2-possibility. The candidate later mentions scrutability but not here.  
     *Confidence: Medium*  

  5. **"The move ... needs a premise linking primary to secondary intension — a scrutability premise ... which the materialist is under pressure to accept."**  
     ✅ **Right** (0.5 marks). Vital point about scrutability, though too briefly stated.  
     *Confidence: High*  

  **Deductions:**  
  - **-0.5 marks**: Misattribution of the phenomenal-concept strategy to *type-A* materialism (it defines *type-B*; type-A denies epistemic gaps).  
  - **-1 mark**: Oversimplifies the 2D reply by not explicitly stating that anti-materialists claim phenomenal truths lack a priori entailment *and* rigidified secondary intensions.  

