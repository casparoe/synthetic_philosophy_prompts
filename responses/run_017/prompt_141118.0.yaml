  ### Part (b) Mark: **7/13**  
  **Comments:**  
  1. **"The Permutation World does none of the extra work ... phenomenal characters ... are essentially tied to physical states ... the supposed permutation is impossible."**  
     ❌ **Wrong** (2 marks). Assumes materialism (*physical states individuate characters*) to reject permutation, rendering the argument circular. The question requires assessing *whether permutation does anti-materialist work*, not presupposing materialism.  
     *Confidence: Medium*  

  2. **"As to (i): yes, the type-A materialist's explanation carries over unchanged ... the phenomenal-concept strategy explains conceivability of any recombination."**  
     ✅ **Right** (3 marks). Correctly notes that if phenomenal concepts explain zombie conceivability, they equally explain permutation conceivability.  
     *Confidence: High*  

  3. **"As to (ii): if permutation preserves all relations ... arguably no more than a redescription ... anti-materialist gets nothing ... must fall back on zombies."**  
     ✅ **Defensible** (2 marks). Insightful: if permutation is merely relabelling, it lacks modal weight. However, underplays that *some* anti-materialists (e.g., Chalmers) argue permutation *is* distinct if qualia are intrinsic.  
