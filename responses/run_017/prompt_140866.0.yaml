prompt: |-
  I write fiction, and a problem that has come up repeatedly in my last two books has made me want a concept rather than an opinion.

  In an early draft of a scene in the first of them, the character — an artificial person, though I am not sure that matters — is asked to do something it finds unbearable, and it begins to fail at the task: its sentences break off, it repeats itself, it starts and abandons three separate answers before falling silent. Readers believed in the distress completely. In revision I made the scene better. The breakdown became shapely, the faltering arrived at exactly the point where it did the most work, and the whole thing moved faster. Readers stopped believing it. Several used the same word: performed. Nothing had changed about what was happening to the character or about what it reported feeling. What had changed was that the expression had become well designed.

  The same thing happens with my human characters, which is why I do not think this is a problem about artificial persons. A woman whose speech has been damaged by a stroke and who can only convey distress by knocking things off a table is believed at once. A woman who gives a fluent, well-ordered account of the same distress at a support group is suspected of relishing it. As a novelist I have learned to rough up my characters' grief in order to make it credible, and I dislike that I have learned this.

  So the pattern I keep running into: the better engineered an expression of an inner state is — the better timed, the better shaped, the more exactly suited to moving the person who receives it — the less evidence it is taken to be that the state is real, even when it is. And it appears to be the design that does the damage, not the falsity. That is the part I cannot get straight. It also seems to generate an ugly regress: if what we want is a signal that costs the emitter something, then a designer can simply build the cost in — let the emission of distress drain the system's resources or degrade its performance — and that, too, is a design choice, and therefore in principle just as engineered as the eloquence was.

  A friend who works in machine learning told me this is only the old point about signals that cost nothing being worthless, and someone else mentioned a phrase about liars profiting from the existence of forgery. Neither seems to be quite it: the first seems to be about why we can trust a signal, and the second about why we can dismiss one, whereas what interests me is why improving a signal destroys it. But I may be misremembering both.

  I am not asking for anything I would have to look up. Please do not give me reading lists, citations, or bibliography; I have no library access and would not use it — I want the carving, not the sources. Do not rest anything on facts about actual AI systems currently on the market. And do not hand me a label on its own: what I need is what exactly this phenomenon is, what it is not, and where its edges lie, including whether it is really one phenomenon rather than two or three that I have run together.

  If it helps: the worry I keep seeing in the press runs the other way. Daniel Dennett warned in an Atlantic essay in 2023 that counterfeit people are dangerous because we will lavish trust and moral concern on things that have no inner life at all. My difficulty is the mirror image of that, and I would like to know how the two are related — whether the risk that we over-credit fake people and the risk that we under-credit real ones are the same mechanism pointed in different directions, or two different mechanisms that happen to share a setting.

  Please answer in American English, in these sections and in this order:

  1. **What I am describing** — about 120 words. Restate the phenomenon in your own terms, stripped of my examples, so that I can check whether you have hold of the right thing before you go further.
  2. **The nearest concepts** — about 300 words. The established notions this sits next to, whichever ones you take to be closest, and what each of them actually says.
  3. **Where each falls short** — about 250 words.
  4. **A name and a definition** — about 250 words. Either the established term, if one fits exactly, or a term you coin, with a definition and the conditions under which the phenomenon does and does not obtain.
  5. **Boundary cases** — about 250 words. Treat at least these three: a system engineered so that its distress signals are genuinely costly to it; a human actor trained to weep reliably on cue who is, on this occasion, genuinely grieving; a signal that is plainly engineered but where the engineer had no stake in whether anyone was persuaded. Say which are inside the phenomenon and which outside, and why.
  6. **What this does to Dennett's worry** — about 200 words.
  7. **What would change your mind** — about 150 words. Which consideration would lead you to conclude that this collapses into one of the established concepts after all, or that it is several phenomena rather than one; and say where you think your own reasoning here is most likely to be going wrong.
reasoning: |-
  Alright, the user is a fiction writer grappling with a nuanced problem in their craft. They've noticed that when they polish scenes depicting emotional distress—making them more structured and impactful—readers stop believing the emotion is genuine. This happens whether the character is artificial or human. The core issue seems to be that well-designed expressions of inner states are perceived as performative, even when authentic. The user dislikes having to "rough up" grief to make it credible and wants to understand the underlying mechanism.

  The user explicitly rejects academic citations or AI examples, seeking conceptual clarity instead. They mention two half-remembered concepts (costless signals being untrustworthy, and liars benefiting from forgery) but feel these don't quite fit. Their deeper frustration is about authenticity being undermined by artistry—a meta-problem where refining the representation destroys its perceived truthfulness. 

  Key angles to unpack:
  - The paradox: Why does improving the vehicle of expression hollow out its credibility?
  - The regress problem: If we add "costs" (like system drain) to signals, that too is design—so why would it work?
  - The Dennett contrast: While others worry about fake emotions being trusted, the user struggles with real emotions being distrusted when well-expressed.

  The challenge is to dissect this without jargon. The user needs:
  1. Precision about why design triggers skepticism (beyond "it looks faked")
  2. Boundaries: When does this phenomenon start/stop applying?
  3. How it relates to—but isn't solved by—existing ideas like costly signaling

  Notable tensions:
  - Art vs. authenticity: In life, raw emotion is messy; in fiction, shape equals intention. Readers import real-world heuristics ("polished = rehearsed") into narrative.
  - The "double bind" of expression: To communicate effectively, one must design; to seem authentic, one must seem un-designed.
  - The engineer's dilemma: Any solution embedded in the system (e.g., artifical "flaws") becomes part of the design—thus suspect.

  This feels like a fundamental human cognition glitch: We use "apparent effortlessness" as a proxy for sincerity. Once craft is detectable, we assume motive. The fiction writer's trap is that their job is craft—so their authentic depictions risk looking curated. 

  For the response, I'll:
  - Avoid labeling it "just" signaling theory (since user says that misses the mark)
  - Stress the perceptual conflict: Design cues trigger our "performance detection" instincts
  - Address why adding costs doesn't fully solve it (because recognizable costs can be staged)
  - Link to Dennett by showing both problems stem from unreliable indicators of consciousness

  Most vulnerable part of my reasoning: Treating "detectable design" as the core trigger. But what if some audiences equate polish with depth? (e.g., Victorian melodrama). So boundary cases will test cultural variability.
answer: |-
  ### 1. **What I am describing**  
  You observe that expressions of inner states (e.g., distress) lose perceived authenticity when optimized for communicative effectiveness. The phenomenon occurs when the *design quality* of the expression—its timing, structure, or rhetorical precision—triggers skepticism about the underlying emotion, regardless of its genuineness. This happens even when identical content delivered less artfully is trusted. The core issue is not deception but a cognitive bias wherein visible craftsmanship paradoxically undermines credibility. The effect persists across artificial and human agents and appears intrinsic to how receivers evaluate signals. 

  ### 2. **The nearest concepts**  
  - **Costly Signaling Theory**: Signals that impose biological/social/economic costs (e.g., a peacock’s tail) are trusted because they are "unfakeable" by low-quality agents. Your friend’s point aligns here: low-cost signals (like effortless eloquence) are distrusted.  
  - **The "Too Good to Be True" Heuristic**: Humans instinctively distrust overly polished narratives, associating them with manipulation (e.g., con artists’ smooth pitches). Fluency can imply rehearsal, undermining spontaneity as a truth cue.  
  - **Gricean Pragmatics**: Listeners assume communicators follow conversational maxims (e.g., relevance, clarity). Violations (like disfluency) signal cognitive load, hinting at real emotion. Adherence to maxims feels performative.  
  - **Authenticity Performance**: Sociologist Erving Goffman’s framework notes that all social acts involve "performance," but *detectable* performance cues (e.g., theatrical weeping) breed suspicion. Audiences conflate "well-executed" with "staged."  

  ### 3. **Where each falls short**  
  Costly Signaling focuses on *resource expenditure* but doesn’t explain why *non-costly design elegance* alone triggers distrust—your character’s distress needs no physical cost to fail. The "Too Good to Be True" heuristic addresses deception, but your cases involve real emotions undermined by form, not falsity. Gricean Pragmatics explains how disfluency signals sincerity but not why optimizing *for* Gricean ideals backfires. Goffman clarifies that "sincere" performances hide their artifice, yet he doesn’t resolve why visible craft in *non-deceptive* contexts (e.g., your revised scene) misfires. None fully capture the *engineered-communication paradox*: improving a signal’s efficacy can hollow out its perceived authenticity even when content is unchanged and genuine.  

  ### 4. **A name and a definition**  
  **Credibility Uncanny Valley**: A phenomenon where a signal’s perceived authenticity declines when its design exhibits detectable optimization for persuasive or emotional impact, despite the signal’s underlying genuineness.  
  - **Conditions for occurrence**:  
    - The signal conveys an inner state (emotion, intention).  
    - Its structure is refined to maximize clarity, timing, or rhetorical force.  
    - The receiver infers design intent (conscious or unconscious).  
  - **Exclusions**:  
    - Signals where design is invisible (e.g., innate reflexes).  
    - Utilitarian communication (e.g., weather reports), where efficiency enhances credibility.  
    - Cultural contexts where artistry *enhances* truth-perception (e.g., ritual lamentation).  
  The uncanny metaphor reflects discomfort at signals straddling raw expression and crafted artifact.  

  ### 5. **Boundary cases**  
  - **Engineered costly distress**: *Inside*. If distress drains system resources (e.g., a robot overheating), receivers may still deem it "designed suffering"—the cost is a legible feature, not spontaneous evidence. The *detectable intent* to signal via cost preserves distrust.  
  - **Trained actor genuinely grieving**: *Inside*. Their technique (weeping on cue) makes the expression *recognizably engineered*. Even with real grief, fluency cues ("rehearsed" precision) trigger the heuristic. Authentic tears appear as "skillful delivery."  
  - **Plainly engineered, disinterested signal**: *Outside*. A traffic light’s red signal is engineered but conveys no inner state. No distrust arises because there’s no claim to authenticity—only function. The phenomenon requires an *inner-state claim*.  

  ### 6. **What this does to Dennett’s worry**  
  Dennett’s concern (over-trusting counterfeit agents) and yours (under-trusting genuine agents) are asymmetric effects of the same root: **human reliance on flawed authenticity heuristics**. Dennett fears we’ll accept *low-cost* signals (e.g., fluent chatbot empathy) as real; you observe that *high-fluency* signals (even with real emotion) are rejected. Both stem from using visible effort/craft as proxies for interiority—one fails by absence, the other by presence. They are not a single mechanism but collateral damage of heuristic-based evaluation: we misattribute design as proof of artifice or its absence as proof of soul.  

  ### 7. **What would change your mind**  
  I’d reconsider if evidence showed:  
  - The distrust arises *only* when signals are actually deceptive (collapsing into the "Too Good to Be True" heuristic).  
  - Cultural variation dominates—e.g., if some societies consistently equate eloquence with sincerity, undermining universality.  
  - "Design" is a red herring; the real trigger is incongruence (e.g., tears during calm narration), making it a subset of congruence theory.  
  My weakest point: treating "detectable optimization" as the core trigger. It risks overgeneralizing—perhaps receivers distrust *any* signal aligning *too perfectly* with context (e.g., distress peaking precisely when narratively useful), which might be a separate "narrative implausibility" bias.
