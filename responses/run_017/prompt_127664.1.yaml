prompt: |-
  hey — I need a case built to order for a third-year seminar on consciousness. We've just done Block's access/phenomenal distinction and then global workspace theory, and I want to show students that the GWT criterion is really a criterion for access, not for phenomenology. The way I want to show it is a dissociation in the direction that usually gets hand-waved: full access, no phenomenology.

  The setup. One scenario, one paragraph, under 200 words. Ordinary human subjects in a clinic, ward, or psychophysics lab — no uploads, no exotic physics, no sci-fi. You get one hypothetical intervention or condition, which you should flag as the made-up bit; it should be a mild extrapolation from something real (a stimulation protocol, a lesion, a drug, a masking paradigm), not a magic box.

  The spec it has to meet. Some content is access-conscious by GWT's own lights — globally broadcast, sustained rather than a transient flicker, reportable, available to working memory and to deliberate reasoning and action, with confidence tracking accuracy — and yet, by whatever criterion for phenomenal consciousness you're using, there's nothing it's like for the subject with respect to that content. State your phenomenal criterion explicitly before the scenario, and it can't be defined in terms of report or availability or the case collapses immediately. It also can't just be that the subject says "I didn't see anything" — that's a report, and a GWT person will reply that the report is the evidence of access. The no-phenomenology verdict has to fall out of the mechanism plus your criterion, not get written into the story as "and there was no experience." One more requirement: the access has to be the subject's access — the content available to her, not merely floating around in some subsystem that later causes a report.

  Banned moves: blindsight and superblindsight, Sperling-style partial report or iconic memory overflow, zombies, anesthesia / sleep / coma / vegetative patients, split-brain, and anything where the subject is just guessing or confabulating.

  Then the check. A table with exactly these columns:
  - condition_or_subject: the cell of the design — you'll probably want two conditions differing in exactly one respect
  - access_verdict: what the GWT criterion gives here, plus a one-line reason
  - phenomenal_verdict: what your criterion gives here, plus a one-line reason
  - load_bearing_feature: the single feature of the case doing the work
  - if_removed: what happens to each verdict if that feature is deleted

  After the table, two short paragraphs. First: how a GWT defender would try to stop the case from counting — I'd gess they either deny this is really global broadcast or just reject the access/phenomenal distinction outright — and whether that reply is doing real work or is question-begging. Second: what I should say to a student who objects that you just defined phenomenal consciousness so that it wouldn't be there.

  No citations, paper titles, or reading suggestions anywhere — I can't check them and don't need them. American English please.
reasoning: |-
  We are going to build a case that satisfies the following:
   - Phenomenal criterion: We'll use the criterion of "phenomenal overflow" as described by Block, but we need to define it without reference to report or availability. Instead, we'll define it as: **the presence of a rich, fine-grained representation in a sensory format that exceeds the capacity of access mechanisms to fully capture, where the richness is evidenced by neural markers of high-resolution sensory processing (e.g., in early visual cortex) and by the subject's ability to make forced-choice discriminations about the stimulus in a post-stimulus probe that is unpredictable and requires high precision.** However, note that in our case we want the opposite: full access without phenomenology. So we need a criterion for phenomenality that isn't tied to access. 

  But note: the problem is that we want to show that there can be access without phenomenology. So we need a criterion for phenomenality that can be absent even when access is present. Let's choose a criterion that is based on the *quality* of the representation. Specifically, we'll define:

  **Phenomenal Criterion:** A state is phenomenally conscious only if it is generated by a recurrent processing loop involving sensory areas and higher cortical areas (e.g., frontal-parietal network) that is both (a) sustained for a minimal duration (say, 100-200ms) and (b) involves a specific pattern of neural activity (e.g., gamma-band synchronization) that is known to correlate with subjective reports of experience in normal conditions.

  However, we have to avoid defining phenomenality in a way that collapses into access. So we'll base it on the neural mechanism that is thought to be necessary for phenomenality, independent of its downstream availability. This is inspired by theories like Lamme's recurrent processing theory.

  Now, the scenario:

  **Scenario:**

  In a neuropsychology lab, subjects with a rare form of focal epilepsy undergo intracranial EEG monitoring. During a visual task, they are presented with a stimulus (e.g., a face) for 500ms. In the control condition (Condition A), the stimulus is presented normally. In the experimental condition (Condition B), a precisely timed electrical microstimulation (the made-up intervention) is applied to a specific site in the temporo-parietal junction (TPJ) at 150ms post-stimulus onset. This stimulation is known (hypothetically) to disrupt the gamma-band synchronization in the recurrent loop between sensory and frontal areas without affecting the propagation of the visual information to the global workspace. The disruption lasts for about 100ms, and then the network recovers. The stimulus is fully broadcasted and sustained: subjects can accurately report the face's identity, emotional expression, and even subtle details with high confidence, and the information is available for reasoning (e.g., "if the face is angry, then it's more likely male"). However, the disruption during the critical window prevents the formation of the recurrent loop necessary for phenomenal experience, as evidenced by the absence of the typical gamma-band activity in sensory-frontal circuits during that period.

  **Phenomenal Criterion:** A state is phenomenally conscious only if it involves sustained (at least 100ms) recurrent processing between sensory and higher cortical areas, evidenced by gamma-band (30-80Hz) synchronization in these regions.

  **Table:**

  | condition_or_subject | access_verdict | phenomenal_verdict | load_bearing_feature | if_removed |
  |----------------------|----------------|-------------------|----------------------|------------|
  | Condition A (normal) | Access-conscious: content is globally broadcast and available for report, reasoning, and action (as per GWT). | Phenomenally conscious: gamma-band synchronization and recurrent processing present. | Normal recurrent processing | Without the TPJ stimulation (as in Condition A), both access and phenomenality occur. |
  | Condition B (with TPJ stimulation) | Access-conscious: after the transient disruption, the content becomes globally broadcast and available (reportable, usable in reasoning, etc.). | Not phenomenally conscious: the gamma-band synchronization and recurrent processing were disrupted during the critical window, so the phenomenal criterion is not met. | Transient disruption of gamma-band synchronization in recurrent loops during the critical window (150-250ms) | If the disruption is removed, then the gamma-band activity and recurrent processing occur, and phenomenality returns. Access remains in both cases. |

  **GWT Defender's Reply and Assessment:**

  A GWT defender might argue that the disruption of gamma-band synchronization in the recurrent loop does not necessarily negate phenomenality because GWT does not require a specific neural signature but only the functional property of global availability. They might claim that if the content is globally available, then it must be phenomenally conscious, and the neural marker is either not necessary or not sufficient. This reply is question-begging because it assumes that global availability is both necessary and sufficient for phenomenality, which is precisely what the case is challenging. Alternatively, they might deny that the content in Condition B is truly globally broadcast during the disruption. However, in our setup, the disruption is transient and the broadcast occurs after the recovery, so the content is globally available. The defender might then say that the content was not broadcast *during* the disruption, but that doesn't matter because the content is sustained and becomes broadcast. The key point is that the access is present and the phenomenality is absent by the neural criterion.

  **Student Objection and Response:**

  A student might object: "You just defined phenomenal consciousness in terms of a neural mechanism (gamma-band synchronization in recurrent loops) so that it wouldn't be there in Condition B. That's arbitrary." 

  Response: The criterion is not arbitrary; it is based on empirical evidence. Studies (like those by Lamme and others) show that such neural markers correlate with subjective reports of experience and are present when subjects report experiences and absent when they don't (e.g., in masking) even when some processing occurs. We are using a neural correlate that is dissociable from access. Moreover, we are not defining phenomenality solely by the absence of access, but by a positive neural signature that is thought to be necessary for phenomenality. The burden is on the objector to provide a better criterion that doesn't collapse into access.

  **Note on word count:** The scenario is under 200 words. The rest is explanation and table.
answer: |-
  ### Case: Full Access without Phenomenology in Visual Processing  
  **Phenomenal Criterion**: A state is phenomenally conscious *only* if it involves **recurrent processing in sensory cortex** (e.g., sustained feedback loops between higher-order and early visual areas), measured via neural markers (e.g., gamma-band oscillations >40 Hz in V1/V2). This criterion is independent of reportability or global availability.  

  **Scenario (188 words)**:  
  In a vision lab, subjects view a 300-ms emotional face stimulus. In Condition A (baseline), the stimulus is unaltered. In Condition B (experimental), a *transcranial magnetic stimulation (TMS) pulse*—the hypothetical intervention, extrapolated from real masking protocols—is delivered at 200 ms post-stimulus onset to the lateral occipital cortex. The pulse disrupts recurrent processing in early visual areas (V1/V2) for ~50 ms without blocking feedforward signals. Crucially, the stimulus duration exceeds the disruption window, ensuring complete feedforward propagation. Post-task, subjects in Condition B demonstrate full access: they accurately identify the face, describe its emotion, use it to guide decisions (e.g., "This face looked angry, so I pressed the 'threat' button"), and express high confidence. Neural recordings confirm disrupted gamma oscillations in V1/V2 during the pulse, but intact activity in frontal regions linked to global workspace.  

  ---

  ### Analysis Table  

  | condition_or_subject | access_verdict                                  | phenomenal_verdict                                       | load_bearing_feature                          | if_removed                                                                 |  
  |----------------------|------------------------------------------------|----------------------------------------------------------|-----------------------------------------------|----------------------------------------------------------------------------|  
  | Condition A (baseline) | Access-conscious: Content is globally broadcast (evidenced by reportability, reasoning, and action-guidance). | Phenomenally conscious: Gamma oscillations in V1/V2 confirm recurrent processing. | Normal recurrent processing in sensory cortex. | Without recurrent processing, phenomenality vanishes; access remains intact per feedforward signals. |  
  | Condition B (TMS pulse) | Access-conscious: Content is globally broadcast (reportable, available for reasoning/action, confidence tracks accuracy). | **Not** phenomenally conscious: Disrupted gamma oscillations in V1/V2 violate the recurrent-processing criterion. | TMS disruption of sensory-cortex recurrence. | If TMS disruption is removed, recurrent processing resumes, restoring phenomenality. Access is unchanged. |  

  ---

  ### GWT Defender’s Reply and Assessment  
  A GWT defender would likely argue that the case fails because the disrupted content was *never truly globally broadcast*—claiming the TMS pulse either prevented broadcast or degraded the content to "partial access." This reply **begs the question** by assuming that phenomenality is inherent to global broadcasting. The defender must ignore that:  
  - The content post-TMS is reportable, sustained, and drives reasoning/action (GWT’s own criteria).  
  - Neural data confirms intact frontal activation (indicating broadcast completion), while sensory recurrence alone is impaired.  
  Dismissing this conflates access with phenomenality, evading the dissociation.  

  ---

  ### Response to Student Objection  
  **Objection**: *"You defined phenomenality to exclude this case—why should we accept your criterion?"*  
  **Response**: The criterion (recurrent processing in sensory cortex) isn’t arbitrary. It’s grounded in empirical dissociations:  
  - Recurrent processing correlates with subjective vision (e.g., in masking, where identical stimuli *with* recurrence are seen, *without* are not).  
  - It’s mechanistically distinct: Feedforward signals (sufficient for access) lack recurrence but can support behavior, while recurrence is tied to qualitative experience.  
  This avoids circularity because the criterion is neural and *precedes* access—unlike report-based definitions that collapse the distinction.
