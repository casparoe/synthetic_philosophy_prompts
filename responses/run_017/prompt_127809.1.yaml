prompt: |-
  I'm putting together a first-year seminar where nearly every reading is a thought experiment, and I want a spec before I turn students loose on them. What would a theory of thought experiments have to deliver to be worth teaching — good enough that someone can pick up a scenario they've never seen and tell wether it's doing real work or just pumping? Give me the desiderata: the cases it has to handle (Gettier, the violinist, Twin Earth, the Chinese Room are all fair game), what has to be true of a scenario for its verdict to count at all, and the distinctions it can't collapse — persuasive vs probative, load-bearing detail vs set dressing, drawing out an intuition we already had vs installing a new one. Two of my own to include: the pumpmaker's regress (you can't say which features of a case are doing the work without already knowing the conclusion it was built to support, so the theory has to say where that stops), and twin pumps — same structure, valence swapped, verdict flips, as with the violinist against its people-seeds twin — what is a theory meant to do when both twins feel right? For each requirement say why it's a requirement and not just a taste of one camp, mark the non-negotiable ones, and flag any pair that can't be jointly met: I suspect "the verdict must be invariant under irrelevant variation" and "pumps have to be able to overturn commitments we already hold" are quietly at war, and I want to know which one to drop. One closing sentence on whether "a pump is just an argument with its premises hidden" survives the list, no more than that. Table's fine, eight to ten rows, 600 words max.
reasoning: |-
  Okay, the user is designing a first-year seminar focused on thought experiments and needs a specification for evaluating them. They want desiderata that help students distinguish effective thought experiments from flawed ones. 

  The user's examples (Gettier, violinist, Twin Earth, Chinese Room) suggest they're covering epistemology, ethics, and philosophy of mind. Their two original contributions—pumpmaker's regress and twin pumps—indicate deep concerns about circularity and contradictory intuitions. 

  Key tensions to address:
  - Invariance vs. belief revision (can a pump be both stable under irrelevant changes AND challenge deep commitments?)
  - Persuasive vs. probative functions (is the goal to convince or to test?)
  - Intuition extraction vs. installation (should pumps reveal existing intuitions or create new ones?)

  Non-negotiables seem to be:
  1. Avoiding pumpmaker's regress (need objective criteria for load-bearing details)
  2. Explaining twin pump paradoxes (why contradictory cases can both feel valid)
  3. Distinguishing essential details from set dressing

  The hidden premise question is tricky—while all pumps imply arguments, their power comes from embodied cognition. The closing statement should acknowledge this but affirm their unique epistemic role.

  For the table, prioritize criteria that resolve the user's stated tensions. The invariance/belief revision conflict might require accepting limited invariance (only under non-load-bearing changes) while allowing belief challenges. Twin pumps may need framing as dialectical tools rather than failures.

  Word count is tight—each desideratum must pull double duty by solving multiple user concerns. The "why non-negotiable" column should explicitly reference their pumpmaker regress and twin pump examples.
answer: |-
  Here’s a theory of thought experiments (TEs) specification, prioritizing robustness and pedagogical utility. Non-negotiables are **bolded**.

  | Desideratum                                  | Why Required (Non-Negotiable?)                                                                 | Critical Cases/Conflicts                                                                 |
  | :------------------------------------------- | :--------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- |
  | **1. Distinguish load-bearing details from set dressing** | **Essential to avoid misdiagnosis. Must identify which features *must* hold for the verdict.** <br>*(Non-negotiable)* | Gettier (fake barns vs. real ones), Violinist (abduction method vs. duration of attachment). Pumpmaker’s Regress challenge: Requires independent criteria (e.g., modal robustness, conceptual role). |
  | **2. Explain verdict invariance under irrelevant variation** | **A TE fails if minor, non-load-bearing changes flip the verdict arbitrarily.** <br>*(Non-negotiable)* | Twin Earth (water vs. XYZ; molecule type is load-bearing, container color isn’t). Conflict with belief revision: TEs *can* challenge deep commitments *if* load-bearing details are intact. Drop strict invariance *only* for irrelevant details. |
  | **3. Handle *persuasive* vs. *probative* functions** | Persuasion relies on rhetoric/affect; probative force tests conceptual coherence/logical entailment. A theory must separate them to evaluate epistemic weight. | Chinese Room (persuasive: "feels" like no understanding; probative: challenges functionalism’s sufficiency). |
  | **4. Resolve "Twin Pumps"**                  | **A viable theory *must* explain why structurally similar cases (e.g., Violinist vs. People-Seeds) elicit conflicting but stable intuitions without contradiction.** <br>*(Non-negotiable)* | Violinist (intuition: no obligation) vs. People-Seeds (intuition: obligation). Theory must locate difference (e.g., consent, causality, burden asymmetry) or show one is defective. |
  | **5. Block "Pumpmaker’s Regress"**           | **Cannot presuppose the verdict to identify load-bearing features. Requires prior criteria (e.g., conceptual necessity, minimal causal structure).** <br>*(Non-Negotiable)* | Any TE accused of circular design (e.g., "Only details supporting conclusion X are deemed essential"). Theory must provide neutral filters. |
  | 6. Demarcate *intuition extraction* vs. *installation* | Extraction reveals latent commitments; installation builds new ones. A TE doing real work should *test* or *clarify*, not implant via framing. | Gettier (extracts intuition about justification ≠ knowledge). Bad TEs install biases via loaded language/assumptions. |
  | 7. Specify conditions for verdict legitimacy | When does the intuition count? Requires: clarity, competence, non-coercion, and alignment with target concept. | Reject verdicts if scenario is incomprehensible or intuitions conflict wildly among competent users. |
  | 8. Allow TEs to overturn prior commitments   | Core purpose: reveal inconsistencies in our concepts/beliefs. Must permit defeasibility of initial intuitions/theories. | Twin Earth overturned "meaning is in the head"; physics discoveries via Einstein’s TEs. Conflict with invariance resolved: Invariance applies to *irrelevant* details; load-bearing details *can* challenge beliefs. |

  **Closing on Hidden Premises**: "A pump is just an argument with premises hidden" **does not survive**. TEs generate *novel* insights via simulation/imagination that syllogisms cannot (e.g., Mary’s Room). Their power lies in forcing *recognition*, not just inference.
