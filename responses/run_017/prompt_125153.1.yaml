prompt: |-
  Me and my sister have a rota that isn't a rota: she goes round to our mum's most evenings, I go every other Sunday. Mum has early-stage dementia but still lives alone. Lately my sister keeps saying it'd be nice if I came more often, and I genuinely can't tell whether she's right. I do the meds, the bills and the appointments, I'm 40 minutes away with two small kids, and mum is only doing as well as she is because my sister decided a year ago to start going every day — if she'd started at once a week, I suspect once a week is what would now count as normal. What actually confuses me is this: when I tell her what she does is amazing and I don't know how she manages it, she gets annoyed, like I'm implying she could just stop; but if I agree that it's simply what you do for family, I seem to have admitted I'm the one falling short. I think there's somthing wrong with how I've set this up but I can't see where. Also I'm about to drop to once every three weeks for a few months because of work — do I owe her an explanation for that, or is that none of her business?
reasoning: |-
  Okay, the user is dealing with a complex family caregiving situation. The main issue revolves around the rota with their sister for caring for their mum who has early-stage dementia. The user lives 40 minutes away with two small kids and handles administrative tasks like meds, bills, and appointments. The sister visits most evenings, and the user goes every other Sunday. 

  The sister keeps suggesting the user should visit more often, which makes the user question if they're doing enough. When the user praises the sister, she gets annoyed, but if they agree that family should do more, they feel they're admitting fault. The user is also planning to reduce visits to once every three weeks due to work and wonders if they need to explain this to their sister.

  First, I need to unpack the dynamics here. The sister's daily visits set a high standard, but she might feel overwhelmed and unsupported. Her annoyance at praise could stem from feeling that her efforts are being minimized or that the user doesn't recognize the emotional toll. The user feels stuck between validating her efforts and not wanting to imply they should do the same. 

  The user's logistical challenges are real: distance, young kids, work. They handle crucial behind-the-scenes tasks that aren't as visible as daily visits. The sister might not fully appreciate these contributions. The communication breakdown is evident—both might feel their efforts are unseen. 

  The planned reduction in visits is practical, but the user worries about the sister's reaction. They need to communicate this change without escalating conflict. The underlying needs here include mutual recognition, shared responsibility, and effective communication. The sister likely needs validation and practical support, while the user needs acknowledgment of their constraints and contributions.

  Guilt is a factor too. The user feels guilty but also resents the implicit pressure. The sister might resent carrying the physical load. It's a cycle where both feel unappreciated. The key is shifting from comparison to collaboration. 

  Strategies: The user should initiate a problem-solving conversation, not defensive. Use "I" statements to express their situation without blaming. Acknowledge the sister's efforts sincerely, linking to specific impacts. Present the administrative tasks as essential contributions. Propose concrete ways to support the sister beyond visits—maybe respite care, meal deliveries, or financial help. 

  For the schedule change, frame it as temporary and necessary, emphasizing continued handling of other tasks. Offer alternatives to show commitment. The user doesn't owe an explanation but sharing context can reduce conflict. 

  Long-term, they need to assess care needs together. The sister's daily routine might be unsustainable. Professional help or community resources could alleviate the load. The goal is equitable support, not equal visits. Both roles are vital; making that visible can ease tensions.
answer: |-
  This situation reveals a classic, painful caregiver dynamic. You're both contributing meaningfully, but in vastly different ways, leading to misunderstanding and resentment. The core issues are **unacknowledged roles, invisible labor, unspoken expectations, and unsustainable care patterns.** Here's how to navigate it:

  ### The Core Problems
  1.  **The "Rota" is an Illusion:** Your sister has established a *de facto* standard (near-daily visits) that wasn't agreed upon and is likely unsustainable long-term. This becomes the unspoken benchmark against which your efforts feel "less than."
  2.  **Different Contributions, Mutual Invisibility:**
      *   **Your Work:** Managing meds, bills, and appointments is *essential, time-consuming administrative labor*. It requires focus, organization, and happens outside of visits. It's often invisible to the person doing the day-to-day physical care.
      *   **Her Work:** Daily/evening visits provide crucial companionship, safety checks, and immediate practical help. It's physically and emotionally draining *visible* labor. She likely feels the relentless daily grind.
  3.  **The "Praise Trap":** When you praise her ("You're amazing!"), she hears "What you do is extraordinary and beyond expectation" – which, to her, implies *you* don't feel the *necessity* to contribute similarly. When you agree family should step up ("It's just what you do"), she hears confirmation that *you* aren't meeting that standard. **Her reaction suggests deep exhaustion and resentment that the burden is unevenly shared, combined with a feeling that your contributions don't lighten *her daily load*.**
  4.  **Your Legitimate Constraints:** Distance, young children, and work are *real* barriers. Your contributions are tailored to your capacity and location. Reducing visits due to work is a practical necessity, not neglect.

  ### What You Owe Your Sister (and What You Don't)
  *   **You DO owe her:**
      *   **Acknowledgement & Validation:** Explicitly recognize the *specific* toll her daily visits take: "I know going over there every single evening is exhausting. I see how much time and energy that takes, and how it limits your own life. It *is* incredible that you manage it."
      *   **Visibility of YOUR Contributions:** Clearly state your role: "I know my visits are less frequent, but I want to be clear about what I *am* handling so you know Mum's covered: her meds are always ordered and sorted, the bills are paid on time, and I manage all her appointments and follow-ups. This takes X hours a week. I do it specifically *because* I can't be there daily."
      *   **Openness about the Schedule Change:** Inform her proactively: "Hey, due to a big work project for the next few months, my Sunday visits will shift to every three weeks starting [date]. I'll still handle all the meds, bills, and appointments as usual. I wanted you to know so it's not a surprise."
      *   **Problem-Solving, Not Just Comparison:** Shift the conversation: "I hear you saying you'd like more help with Mum's day-to-day. My capacity for visits is limited right now for the reasons we know. What specific support *would* actually make a difference to *your* load? Could we look into [meal delivery, cleaner, respite care, day center]? Could I take over [one specific *regular* task she currently does, like grocery orders]?"
  *   **You do NOT owe her:**
      *   **Justification for Your Constraints:** You don't need to endlessly defend your distance, kids, or work. State them factually once.
      *   **Detailed Work Justification:** "Because of work demands" is sufficient explanation for reducing visits temporarily. You're informing her, not seeking permission.
      *   **Agreement that Your Contribution is Inadequate:** Your role is vital and different. Don't concede that point.
      *   **Admission that Her Level of Care is the Only "Right" Level:** This is unsustainable and was her choice. The goal should be *sustainable, shared* care.

  ### How to Proceed: A Strategy
  1.  **Initiate a Calm, Specific Conversation:** "Sis, I want to talk about Mum's care and how we're both managing. I know it's tough, and I want us to be on the same page."
  2.  **Acknowledge Her Effort (Specifically):** "I truly appreciate the huge commitment you make visiting Mum so often. I know it means she's safe, fed, and has company. That must be incredibly draining day in, day out."
  3.  **State Your Contributions Clearly:** "Because I can't be there physically as much, my focus has been on making sure the background stuff is solid: all her medications are managed, every bill is paid on time, and all her medical appointments are booked and coordinated. This takes a significant chunk of my time each week."
  4.  **State Your Constraints (Factually, Briefly):** "With the kids, the 40-minute drive each way, and my job, juggling more frequent visits right now isn't feasible without letting other critical things drop."
  5.  **Address the Upcoming Change (Proactively):** "Because of a major work commitment for the next [timeframe], my Sunday visits will need to be every three weeks starting [date]. I wanted to tell you now. I'll still handle all the meds, bills, and appointments without interruption. Is there one small, specific task I could take off your plate during this time to help compensate?"
  6.  **Shift to Problem-Solving:** "I worry your current schedule isn't sustainable forever. Can we brainstorm ways to get *both* of us more support? Maybe exploring [home help, meal services, adult day care, local volunteer visitors]? Or could we sit down and look at all Mum's needs and see if there's a smarter way to divide things that works better for both of us long-term?"
  7.  **Hold the Boundary Gently:** If she pushes back on your contributions or the schedule change: "I understand you'd prefer I visit more. Given everything, this is what I can reliably manage right now while ensuring Mum's essential needs are met through the tasks I handle. Let's focus on what else we *can* do together to make this work better."

  ### Key Realizations
  *   **Her "It'd be nice if you came more" is likely a cry for relief.** She's drowning in the daily grind and sees your visits as potential respite *for her*, not just care for Mum.
  *   **Praising her *without* offering tangible support feels hollow.** It highlights the imbalance.
  *   **Your administrative role is CRUCIAL.** Without it, her daily visits would be far more chaotic and stressful.
  *   **The current pattern is unsustainable.** Her daily visits are a time bomb for her own burnout. The real solution isn't you matching her, but *both* of you finding ways to lighten the *overall* load, potentially involving external support.

  **This isn't about who's right; it's about recognizing your different capacities and contributions, making the invisible labor visible, and finding a sustainable path forward together.** The conversation will be tough, but it's necessary. Focus on acknowledging her effort, stating your role clearly, and pivoting to solutions that support *both* caregivers, not just increasing your visits to an unmanageable level.
