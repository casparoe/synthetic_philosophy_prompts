answer: |-
  ### Karma Theory Decision Tree  
  *Classify views by concrete cases, not traditions. Answer each node based on intuition; no prior knowledge needed.*  

  **Node 1: When a bad outcome follows a bad act, what is the karmic link?**  
  - **A.** The outcome is *deserved* by the agent (merit/demerit). → **Node 2**  
  - **B.** The outcome *serves a good purpose* (e.g., teaches, deters, reforms). → **Node 8**  
  - **C.** The outcome is the *lawful result* of a cause-effect pattern; "karma" explains why suffering isn’t random. → **Node 11**  

  **Node 2 (from A): Can the karmic debt be transferred? (e.g., to a child or 3rd party via merit-transfer rituals)**  
  - **A.** Yes. → **Leaf 1: Transferable Desert**  
  - **B.** No, strictly personal. → **Node 3**  

  **Node 3 (from 2B): An agent suffers for a wrong they can’t remember. What makes it *their* fruit?**  
  - **A.** Psychological continuity (e.g., personality traits persist). → **Node 4**  
  - **B.** Bodily continuity (e.g., same physical form). → **Node 4**  
  - **C.** Mere causal-chain membership (e.g., rebirth as continuation). → **Node 4**  
  - **D.** Not individual; debt belongs to lineage/community/cosmos. → **Leaf 2: Collective Desert**  

  **Node 4 (from 3A/B/C): An agent genuinely reforms *before* the fruit lands. Does this cancel the debt?**  
  - **A.** Yes, reform erases debt. → **Leaf 3: Reform-Cancels-Debt**  
  - **B.** No, debt remains. → **Node 5**  

  **Node 5 (from 4B): The reformed agent suffers remorse *and* external misfortune. Is this double payment?**  
  - **A.** Yes; double payment is unjust. → **Leaf 4: Single-Payment Constraint**  
  - **B.** No; remorse (internal) and misfortune (external) are distinct. → **Node 6**  

  **Node 6 (from 5B): An unexpiated debt lingers for years. Does it change?**  
  - **A.** Grows (e.g., interest accrues). → **Leaf 5: Escalating Debt**  
  - **B.** Stays fixed or diminishes/expires. → **Leaf 6: Fixed/Expiring Debt**  

  **Node 7 (from 1B/8A/8B): An outcome lands on someone who *can’t learn* (infant, demented, dead). Is it karmic?**  
  - *[Answers apply to both B paths from Node 8]*  
  - **A.** Yes; serves other purposes (e.g., deters/teaches *others*). → **Leaf 7: Instrumental Consequentialism**  
  - **B.** No; only karmic if the sufferer can learn. → **Leaf 8: Agent-Limited Consequentialism**  

  **Node 8 (from 1B): Can the fruit land on someone other than the agent?**  
  - **A.** Yes (e.g., child suffers to teach parents). → **Node 7**  
  - **B.** No; must directly affect the agent. → **Node 7**  

  **Node 9 (from 1C): How is karma stored/enforced?**  
  - **A.** Impersonal cosmic law (no "account," just cause-effect). → **Node 10**  
  - **B.** Stored potency (e.g., latent force in soul/matter). → **Leaf 9: Stored-Potency (e.g., Jain/Mīmāṃsā)**  
  - **C.** Administered by a being (e.g., god, deva). → **Leaf 10: Theistic Administration**  

  **Node 10 (from 9A): A person is born into terrible conditions. Does karma *justify* this?**  
  - **A.** Yes; the pattern explains *and* justifies. → **Leaf 11: Lawful Theodicy**  
  - **B.** No; explains but doesn’t negate injustice. → **Leaf 12: Impersonal Amoral Law**  

  ---

  ### Leaf Key  
  *Note your path (e.g., 1A→2B→3C→4B→5A) and match below.*  

  1. **Transferable Desert**  
     - *Awkward:* Innocents suffer for others’ deeds.  
     - *Evidence against:* Systematic observation that suffering never deters/teaches bystanders.  
  2. **Collective Desert**  
     - *Awkward:* Individuals bear group debt they didn’t cause.  
     - *Evidence against:* A person leaves a "cursed" lineage but suffers identically.  
  3. **Reform-Cancels-Debt**  
     - *Awkward:* A reformed murderer avoids all consequences.  
     - *Evidence against:* Reformed agents repeat offenses if unchecked.  
  4. **Single-Payment Constraint**  
     - *Awkward:* Remorse absolves debt, but victims feel uncompensated.  
     - *Evidence against:* External payment always follows remorse, suggesting necessity.  
  5. **Escalating Debt**  
     - *Awkward:* A minor theft could yield infinite suffering.  
     - *Evidence against:* Delayed suffering is milder than immediate.  
  6. **Fixed/Expiring Debt**  
     - *Awkward:* Unpunished evil might expire, undermining justice.  
     - *Evidence against:* Long-delayed suffering is harsher than fresh consequences.  
  7. **Instrumental Consequentialism**  
     - *Awkward:* Infants suffer to "teach" others.  
     - *Evidence against:* Societies with infant suffering show no moral improvement.  
  8. **Agent-Limited Consequentialism**  
     - *Awkward:* Suffering of the incurable is "non-karmic" randomness.  
     - *Evidence against:* Moral growth occurs in dementia patients via suffering.  
  9. **Stored-Potency (e.g., Jain/Mīmāṃsā)**  
     - *Awkward:* Undetectable "karmic matter" stores merit.  
     - *Evidence against:* Acts under duress yield identical outcomes to voluntary acts.  
  10. **Theistic Administration**  
      - *Awkward:* Administrator’s judgments appear arbitrary.  
      - *Evidence against:* Extreme suffering befalls universally admired saints.  
  11. **Lawful Theodicy**  
      - *Awkward:* Birth defects are "deserved" without memory/continuity.  
      - *Evidence against:* Identical deeds yield opposite outcomes consistently.  
  12. **Impersonal Amoral Law**  
      - *Awkward:* Karma explains but doesn’t justify; moral complaints persist.  
      - *Evidence against:* All sufferers accept their fate as "just."  

  ---

  ### Unoccupied Answer-Combinations  
  *Diagnosed by logical gaps, not popularity.*  
  1. **1A→2B→3A→4A→5B**  
     - *Diagnosis:* Incoherent. Reform cancels debt (4A) but misfortune "must occur" (5B) without double payment.  
  2. **1B→8A→7B**  
     - *Diagnosis:* Unexplored. Fruit *can* land on others (8A) but *only* if the sufferer can learn (7B) — yet infants can’t learn.  
  3. **1C→9A→10A** + "Debt expires" (from 6B)  
     - *Diagnosis:* Incoherent. Impersonal law (9A) can’t "expire" debts — it lacks storage.  
  4. **1A→2A** + "Reform cancels debt" (from 4A)  
     - *Diagnosis:* Unattractive. Transferring debt *and* allowing reform to cancel it makes suffering arbitrary.  

  ---

  ### Five-Minute Sorting  
  *Ask these three questions in order:*  
  1. **Start with Node 1:** What is the karmic link? (A, B, or C)  
  2. **If A:** Ask Node 2 (transferable?).  
     **If B:** Ask Node 8 (fruit on others?).  
     **If C:** Ask Node 9 (storage mechanism?).  
  3. **If A and 2B:** Ask Node 3 (continuity condition).  
     **If B and 8A or 8B:** Ask Node 7 (can non-learners suffer karmically?).  
     **If C and 9A:** Ask Node 10 (does law justify birth conditions?).  

  *Result:* 80% sorted in 3 questions. Paths end at leaves or key branches (e.g., 1A→2A → **Leaf 1**).  

  ---  
  *Tree collapses identical cases: Infant/demented/dead all test "non-learning"; rebirth appears only in Node 3C (causal chain).*
