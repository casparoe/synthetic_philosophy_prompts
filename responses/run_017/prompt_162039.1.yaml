answer: |-
  Here’s a reading of *Citizen Kane* focused on your archival power framework, keyed to essential scenes and addressing your five points. The film isn't just *about* archives; it *performs* archival failure and the elusiveness of meaning within recorded traces.

  **Core Argument:** *Citizen Kane* demonstrates that archival legibility isn't solely a function of survival or suppression, but of the *intersection* between the archive's inherent limitations (gaps, noise, false trails) and the *interrogator's framing* (purpose, format, interpretive capacity). Power manifests not just in exclusion, but in the *overproduction* of noise and the *imposition* of reductive narratives that the archive, however vast, cannot satisfy.

  **Essential Scenes to Screen:**
  1.  **The Newsreel ("News on the March") & Thompson's Assignment:** (Establishes the inquiry's reductive premise).
  2.  **Bernstein's Narration (incl. the "White Parasol" moment):** (Ungenerated record, the ineffable).
  3.  **Leland's Narration (incl. Susan's Opera Debut & the "Declaration of Principles"):** (False provenance, destruction of the Principles).
  4.  **The Warehouse Scene & Sled Burning:** (Survival without legibility, unconsulted record).
  5.  **Thompson's Final Speech & Exit:** (Failure of the question/framing).

  **Addressing Your Points:**

  1.  **Taxonomy of Silences & Kane's Examples:**
      *   **Never Generated:** Bernstein's story of the girl with the white parasol ("I only saw her for one second... I'll bet a month hasn't gone by since that I haven't thought of that girl"). This profound, fleeting personal moment – crucial to Bernstein's understanding of Kane's character (longing, loss) – was never recorded. It exists only in ephemeral memory, vanishing with Bernstein. ***(Scene 2)***
      *   **Generated & Destroyed:** Kane's original, idealistic "Declaration of Principles." Leland possesses it, mocks its naivete after Kane's corruption, and implies it's discarded or forgotten. Kane himself likely suppressed it later. Its physical destruction is symbolic of the erasure of his initial self. ***(Scene 3)***
      *   **Survives, Unconsulted:** The vast crated collection in Xanadu's warehouse. Everything is *there* – including "Rosebud" – but it's unorganized, uncatalogued, shrouded in dust. Thompson walks past the sled multiple times. It survives physically but exists only as inert matter, not evidence, until the final, accidental reveal (which Thompson misses). ***(Scene 4)***
      *   **Survives, Consulted, Illegible:** The sled itself, *even when consulted by the audience*. We see "Rosebud" burned. Thompson *could* have found it, but its significance remains opaque *to him*. It's a concrete object answering nothing *within his investigative frame*. Its meaning (childhood loss, simplicity) is only legible through the film's omniscient perspective, not the archival one. ***(Scene 4 & 5 - Thompson doesn't know)***
      *   **Movement/Duplication?** The sled moves from *Unconsulted* (in the crate) to *Illegible* (burning, seen by Thompson but meaningless). The "Declaration" moves from *Generated* to *Destroyed*. The film *adds* **Survival as Noise**: Material present, even momentarily accessed, but failing to signify within the inquiry's parameters (see point 2).

  2.  **Gap vs. Blindness (Survival without Legibility):**
      *   **This is a distinct and crucial fifth category dramatized perfectly by the sled burning (Scene 4).** Power (Kane's acquisitiveness, his compulsion to hoard) ensured its survival. Power (the impersonal estate liquidation) didn't suppress it. It *survived* as physical evidence.
      *   **Thompson's blindness is threefold:** Literal (he walks past it), intellectual (he lacks the film's omniscient context to grasp "Rosebud"), and *framed by his task* (he seeks a simple key for a newsreel, not complex biography). The object is *noise* to him.
      *   **This absolutely cuts against simple suppression narratives.** Power here operates through *overproduction* (the warehouse of junk) and by shaping the *conditions of interpretation* (Thompson's reductive mission). The archive isn't empty; it's full of indigestible matter. The failure is not (just) archival absence, but *epistemological* – the inability of the *method* (newsreel inquiry) and the *interrogator* (Thompson) to decode the surviving trace. The silence is in the *reading*, not (only) the *record*.

  3.  **False Provenance (The Opera Notice):**
      *   **Scene 3:** Leland recounts Kane finishing the rave review of Susan's disastrous debut over Leland's drunken body, signing Leland's name. The published document lies about its authorship and motivation (Kane's desperate promotion, not critical judgment).
      *   **Impact:** This corrupts the archival record more insidiously than simple destruction or bias. The document *survives intact* but carries a **fundamental misattribution of origin and intent**. An archivist/researcher relying on it would derive completely false conclusions about Leland's critical stance and Kane's role.
      *   **Closer to Destruction?** Conceptually, yes. While the *paper* survives, the *truth of its creation* – its essential context and provenance – is destroyed (or never recorded). It becomes a landmine in the archive, masquerading as reliable evidence. The film emphasizes that **provenance and context are fragile, often irretrievable components of a record**, even when the artifact itself persists. Trust in the stated author is shattered.

  4.  **Inversion: Power Archiving Itself:**
      *   Kane is the ultimate self-archivist: newspapers, declarations, scrapbooks, Xanadu itself – a mausoleum of his life. Volume and control are immense.
      *   **Does it buy legibility? Absolutely not.** The film argues **self-authorship is inherently performative and obfuscating**. Kane controls the *public* narrative (the newsreel's hagiography) but the private meaning remains hidden. The vast archive reflects his ego and acquisitiveness, not his inner self.
      *   **What was missing?** Not more *records*, but **Kane's own unfiltered, unperformed articulation of meaning**. Specifically, the *emotional significance* he attached to "Rosebud" – a significance he *never communicated* to anyone. The archive contains the object (sled) but lacks the subject's **attribution of private meaning** to it. The dossier needed Kane's own voice explaining his inner world, something his performative power actively prevented him from doing authentically. The film suggests the core self is *ineffable* and often *unshared*, escaping even the most comprehensive self-curated archive. The answer ("Rosebud") was present materially but lacked the subject's attached significance, rendering it mute.

  5.  **Constraint of Format:**
      *   The inquiry is doomed from the start: "It will probably be a single word" (Rawlston, Scene 1). The newsreel demands reduction: "What does 'Rosebud' mean?" not "Who was Charles Foster Kane?"
      *   **Thompson's Failure (Scene 5):** "No, I don't think so... No. Maybe Rosebud was something he couldn't get, or something he lost. Anyway, it wouldn't have explained anything... I don't think any word can explain a man's life." **This is the film's verdict on the *question*, not the archive.**
      *   **Distinction:** The film distinguishes clearly. The archive *contained* the material key (the sled, though illegible to Thompson). The *failure* lies in the **reductive frame imposed by the newsreel format** and Thompson's adherence to it. He seeks a soundbite meaning, not understanding. The archive's "failure" is its inability to satisfy an impossible, simplistic demand. Life is complex; archives are fragments; simple keys are myths.

  **Checks:**

  *   **Where does it overreach/impose?**
      *   **Leland's Narration:** While containing crucial archival points (false provenance, destruction), Leland's bitterness is a strong *bias*, not purely an archival silence. Forcing his account *only* into the archival framework might downplay its powerful character study and personal vendetta. The lens fits, but don't ignore the human drama driving the testimony.
      *   **Susan's Narration:** Her perspective reveals trauma and oppression, crucial for understanding Kane, but it's less explicitly *about* the archive itself compared to other segments. Trying to make her whole testimony *primarily* an archival case might feel strained; it's more directly a portrait of abuse. Focus the archival reading on the *opera notice* within her segment.
      *   **"Rosebud" as Deus ex Machina:** The film's final reveal to the *audience* risks implying the archive *did* hold the key, just missed. Undercut this by emphasizing Thompson's *necessary* failure (point 5) and the sled's *illegibility* even if found (point 2 & 4). The meaning is still only partial and inaccessible within the archival inquiry.

  *   **What does the film *show* that argument struggles with?**
      *   **The Materiality of Silence:** The burning sled (Scene 4) is unparalleled. It *shows* the physical record *present*, *surviving*, even momentarily *observed* by the researcher, yet *burning away while remaining meaningless to him*. Argument can describe "survival without legibility," but the image makes it visceral, tragic, and undeniable. It embodies the gap between evidence and understanding.
      *   **The Weight of the Unsaid:** Bernstein's parasol story (Scene 2) *shows* how an unrecorded, ephemeral moment can hold more explanatory weight for a witness than volumes of documents. The film conveys the *emotional resonance* of the unarchived.
      *   **The Archive as Physical Space/Labyrinth:** The Thatcher Library's imposing emptiness and the cavernous, chaotic warehouse (Scene 4) *embody* the archive's simultaneous vastness and impenetrability in a way text cannot. You feel the despair of searching.
      *   **The Futility of the Search:** Thompson's weary resignation (Scene 5) *shows* the human cost and intellectual dead end of a poorly framed inquiry confronting an inevitably inadequate archive. It's the *affect* of archival failure.

  **Conclusion for Seminar:** *Citizen Kane* is a masterclass in archival power dynamics precisely because it transcends simple "bias" or "gaps." It reveals archives as landscapes of noise, false trails, surviving but illegible traces, and performances of self. Power operates through inclusion (hoarding, self-documentation) as much as exclusion, and crucially, through shaping the *questions asked* and the *interpretive lens applied*. The ultimate silence isn't just missing documents; it's the ineffable inner life that escapes recording and the reductive frameworks that make surviving traces meaningless. The film shows that understanding requires acknowledging the archive's profound limitations and the hubris of seeking simple keys in the complex residue of a life.
