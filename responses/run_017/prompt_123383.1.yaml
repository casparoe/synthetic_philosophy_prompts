prompt: |-
  I've got a running argument with someone from my local rationalist meetup group — we've bet dinner on whether there's at least one live dispute in metaphysics that isn't secretly verbal — and the test case I keep coming back to is counterpart theory vs. transworld identity. I want one scenario built properly before I post anything about it, because every version I write myself gets defused in about two comments.

  Quick gloss of the two views so we're on the same page, and tell me if I've got either one wrong: on the transworld identity picture the very same object can show up in more than one possible world, so this thing could have been F is true iff that very thing is F in some world the actual one can see. On the counterpart picture nothing exists in more than one world, and this thing could have been F is true iff some other-worldly object that stands in the counterpart relation to it — resembles it in the respects that matter, plays its role in that scenario — is F.

  What I need is a case, and here's what it has to do:

  - It's for a blog post, and its job is to make the guy I'm betting with stop saying that this is just a choice of notation and the two views are intertranslatable given the right counterpart relation. So the verdicts have to fall out of the two theories rather than me stipulating them, and the case can't cheat by building a caricature of either view into the story. If you're not sure whether a spec is satisfiable, flag it rather than fudging it.
  - Ordinary setting — a family, a school, a workplace, a small business — one paragraph, no possible worlds appearing as places inside the story, no sci-fi, and a non-philosopher should have a reaction to it. If you find yourself reaching for the standard examples (the candidate who could have won the election, the ship rebuilt plank by plank, the statue and the clay), treat that as a sign the case is too easy.
  - It should hang on a single de re modal claim about one individual — this very person, this exact committee, this particular ship could have... — not a general possibly, someone or other.
  - I want the hard direction: transworld identity says the claim is true, counterpart theory is pushed toward false, or toward indeterminate because there are several candidate counterparts and they disagree. The pressure on the counterpart theorist has to come out of the situation, not out of me stipulating a really demanding counterpart relation up front.
  - The bit I can't get to work on my own: whenever I write a version of this, the counterpart theorist just retunes the counterpart relation — more weight on origins, less on intrinsic similarity, whatever — the verdict flips, and I've got nothing. So build me a pair: the main case plus a minimally different second case, such that no single counterpart relation gets the intuitive verdict right on both. You'll have to say what you're counting as an admissible counterpart relation, and keep the constraints ones an actual counterpart theorist would grant rather than a strawman.
  - Same in the other direction: don't let the transworld identity side just stipulate that it's the same object. Make the object in the counterfactual situation differ enough — different origins, or a borderline case for the sortal, or a radical change — that they owe you a criterion for transworld identity, and tell me what else that criterion commits them to elsewhere.
  - I'm half-remembering something about the counterpart relation not having to be transitive or one-to-one, so that iterated could have been a thing that could have been... claims and uniqueness come apart. I don't know whether that's the lever I want or a red herring — say which, and why.

  Then the write-up: restate the claim semi-formally, walk through what each theory says and why, go through my specs one at a time and show the case meets them, tell me which single feature of the case is doing the work and what happens to both verdicts if I delete that feature, and give me the strongest reply from whichever theory comes out worse. Deal with the intertranslatability objection head on: does the pair actually show something, or does it just exploit a free parameter the counterpart theorist was always allowed to set?

  If the pair in the fifth bullet definetely can't be built, say so and give me the closest thing that does work instead of quietly dropping the requirement. No citations or reading list — I'll go digging for the literature myself once I know what I'm looking for. Under 900 words if you can manage it.
reasoning: |-
  Okay, let me tackle this user's challenge. They need a scenario where counterpart theory and transworld identity give different verdicts on a de re modal claim, and it can't be resolved by tweaking the counterpart relation. 

  First, I recall the key differences: transworld identity allows the same object in multiple worlds, while counterpart theory uses similarity relations. The user wants a case where transworld says "true" but counterpart leans "false" or indeterminate. 

  Hmm, the tricky part is preventing counterpart theorists from adjusting the similarity weights. I consider using a pair of scenarios to lock the counterpart relation. A school board example comes to mind - first a minor change case where both theories agree, then a radical change case where they diverge. 

  For the radical case, I imagine a school board transformed into something completely different - say a corporate oversight committee. The de re claim would be "this board could have been overseeing factories." Transworld identity might accept this through gradual changes, but counterpart theory would struggle to find a single similar counterpart. 

  I check if this meets all specs:
  - Ordinary setting: school/corporate, check
  - Single de re claim: about the board, check
  - Hard direction: transworld true, counterpart false, check
  - Pair lock: minor change scenario forces counterpart parameters, radical change exploits them
  - Transworld owes criterion: I make them commit to historical continuity
  - Iterated modality: not needed here

  The core mechanism is using the first scenario to fix the counterpart relation (must include origin and function), then showing that same relation can't handle radical transformation. The transworld theorist must defend historical chains across worlds.

  For the write-up, I'll keep it under 900 words: present both cases, show how verdicts diverge, explain why counterpart can't adjust, and address intertranslatability by demonstrating how the pair breaks any single similarity metric. The strongest reply would be that counterpart could use multiple relations, but that concedes indeterminacy which still proves the dispute isn't verbal.
answer: |-
  Here’s a scenario pair designed to pressure the theories, followed by a breakdown of how it meets your specs. The core tension exploits **stability of functional role vs. radical change in composition/history**.

  ---

  ### **The Pair of Cases**

  **Case 1 (Minor Change):**  
  *Evergreen Elementary’s Parent-Teacher Board (PTB)* has 5 elected members. Due to a scheduling conflict, member **Maria Rodriguez** almost missed the vote to fund the school garden. She arrived just in time.  
  **Claim A:** *This very PTB* could have had only 4 members voting that day (if Maria had been absent).

  **Case 2 (Radical Change):**  
  Years later, budget cuts force Evergreen Elementary to close. The district converts the building into a vocational training annex. The *new oversight committee* for the annex has 5 state-appointed industry experts (no parents/teachers). Crucially, the district administrator repurposes the *official name* "Evergreen Elementary Parent-Teacher Board" for this new committee due to bureaucratic inertia.  
  **Claim B:** *This very PTB* (pointing to the *original* elected board) could have been a state-appointed industry oversight committee.

  ---

  ### **Verdicts & Why**

  1.  **Transworld Identity (TI):**
      *   **Claim A (True):** Easily true. A world where Maria is absent exists. The PTB is identical across worlds if it shares enough of its actual history/origins/composition. Missing one vote doesn’t break identity.
      *   **Claim B (True):** TI likely says true. The radical change happens via a *continuous historical process in a single world* (school closure, bureaucratic renaming). TI allows identity through radical change if there’s spatiotemporal/historical continuity *within* a world line leading to the counterpart. The committee in the annex world *is* the original PTB, radically changed.
      *   **Commitment:** TI is committed to transworld identity tracking historical chains/continuity *within* worlds, even through radical qualitative change. This implies that identity can persist through changes that would utterly destroy similarity.

  2.  **Counterpart Theory (CT):**
      *   **Claim A (True):** Easily true. A world exists with a PTB-counterpart differing *only* in Maria’s presence during the vote. High similarity in origins, members, function, location, history makes this counterpart relation uncontroversial.
      *   **Claim B (False or Indeterminate):** CT struggles. *Why?*
          *   **Similarity Pressure (from Case 1):** Case 1 forces the counterpart relation to prioritize origin (elected parent/teacher board for a school) and functional role (overseeing educational matters). The annex committee has a *different origin* (state appointment), *different membership* (industry experts, no parents/teachers), a *different function* (overseeing vocational training, not K-12 education), and exists in a *different building* (annex vs. school). Its only link is the shared name and location (building), which are weak similarities compared to the fundamental differences in origin and function.
          *   **Multiple Candidates/Indeterminacy:** Is the annex committee a counterpart? It shares the name and building but little else. Is a *different*, more similar parent-teacher board in another world a counterpart? Possibly. There is no *single* obvious counterpart. CT either says "False" (no suitable counterpart exists, given the similarity constraints established by Case 1) or "Indeterminate" (multiple potential counterparts disagree, or no clear relation holds).
      *   **Why CT Can't Just Retune:** Case 1 *locks in* key parameters. If the CT theorist makes the counterpart relation weak enough to accept the annex committee as a counterpart (e.g., prioritizing only name/location), then **Claim A becomes threatened**. A world with a *completely different* group of 4 people (not parents/teachers, not elected) meeting in a different building but *called* "Evergreen PTB" and voting on *something* could then be a counterpart, making Claim A true *for the wrong reason* (it wasn't about *that* group). The pair forces CT to choose: preserve intuitive verdicts for *both* claims by accepting different relations (but admitting the theories aren't intertranslatable *in practice* for this object/predicate), or use a single relation and get an unintuitive verdict in one case.

  ---

  ### **Meeting Your Specs**

  1.  **Forces Verdicts Theoretically:** The verdicts fall out of core commitments. TI relies on historical continuity *within* worlds; CT relies on similarity determined by the counterpart relation. Case 1 forces CT into a similarity standard that conflicts with TI's continuity-based verdict on Case 2.
  2.  **Ordinary Setting:** School board, bureaucracy, real-world changes (budget cuts, repurposing buildings).
  3.  **Single De Re Claim:** "This very PTB could have been F" (F = "had 4 voting members" / "been a state-appointed industry committee").
  4.  **Hard Direction:** Claim B: TI says True via continuity; CT says False/Indeterminate due to lack of similarity under constraints from Case 1.
  5.  **The Pair & Locking the Relation:** This is the core. Case 1 establishes that a plausible counterpart relation must include **origin (elected parents/teachers), function (overseeing school), and composition** to validate Claim A intuitively. Case 2 presents a radically changed entity that *lacks* this origin/function but shares a name/building via a continuous history. *No single counterpart relation* satisfying Case 1 can validate Claim B without also validating absurd counterparts for Claim A. Admissible relations must respect origin/function for mundane claims.
  6.  **Pressure on TI:** TI must commit to identity persisting through radical functional/origins change *if* mediated by continuous history *within a world*. This implies that "being the same committee" depends entirely on its historical chain, not its defining characteristics. This might clash with intuitions about what constitutes a committee (e.g., is a radically reconstituted entity under the same name *really* the same committee?).
  7.  **Iterated Modality (Red Herring Here):** Not leveraged. The core lever is the **tension between similarity (CT) and historical continuity (TI) under radical change**, highlighted by using one case to constrain the counterpart relation needed for the other.

  **Core Feature:** The **continuous in-world historical process leading to radical change** in Case 2. Delete this (e.g., just imagine a world where a state committee coincidentally has the same name/building), and CT *could* easily dismiss it as not a counterpart (no problem), and TI might hesitate (no continuity link). The historical process forces TI to accept identity and CT to reject similarity.

  **Strongest Reply (Counterpart Theorist):** "You’ve rigged the pair. Case 1 suggests a certain counterpart relation (C-Rel1) is needed for mundane claims. Case 2 shows C-Rel1 can’t handle radical historical change claims. But CT *allows* different counterpart relations for different modal contexts (e.g., ‘could have been radically different’). I can use C-Rel1 for Claim A and a *different relation* (C-Rel2), emphasizing historical chains/names for Claim B, getting both intuitive verdicts."

  **Rebuttal to Intertranslatability:** This reply *concedes* the point. If CT needs *multiple, context-specific counterpart relations* to match TI's singular verdicts across diverse modal claims about the same object, then the theories are **not intertranslatable without significant theoretical cost** (proliferation of relations, context-dependence). TI offers a unified account (identity via continuity). CT, to mimic this, must become disunified and ad hoc. The dispute isn't *merely* verbal; it's about theoretical resources and unification. The pair shows that preserving *all* intuitive modal judgments requires CT to abandon a single, stable counterpart relation – a core feature often presented as a virtue.

  ---

  ### **Conclusion**

  This pair exploits the **irreducible tension between similarity and historical continuity** under radical transformation. TI prioritizes continuity *within* worlds, allowing identity through change. CT prioritizes similarity, blocking such identification if the change is too radical. Case 1 forces CT into a similarity standard that makes Case 2 problematic. While CT *can* respond with multiple relations, this sacrifices theoretical simplicity and highlights a genuine difference: TI offers a unified account of transworld identity via historical chains, while CT fractures it into context-dependent similarity judgments. The dinner is yours.
