prompt: |-
  For a paper on AI risk, I want a specification rather than a survey: write the desiderata that any adequate theory of instrumental convergence has to meet — the claims it should let us state precisely, the cases it has to sort, and the distinctions it must not collapse, in each case with the example or consideration that makes it a requirement, and a verdict on which are non-negotiable and which are preferences of one research program.

  The cases I have in mind are a computationally bounded or short-horizon agent; an agent whose single terminal goal is trivial and local; an agent that would welcome being corrected or switched off; and a population of agents competing with one another under scarcity. The distinctions are: a theorem about what optimal policies do versus a selection effect on which goals survive and spread; instrumental subgoals versus final goals; power sought as a means versus power accumulated as a side effect; and the orthogonality of intelligence and final goals versus the convergence of instrumental aims.

  Two things matter most to me. First, say which pair of desiderata you suspect cannot be jointly satisfied: my guess is that wanting the thesis to apply to bounded, uncertain agents sits badly with wanting it to follow from optimality. Second, name the single requirement that does the most work in excluding popular versions of the thesis. Keep the scoring short — a line or two each for the basic-drives version and the orthogonality-plus-optimization version, plus a note on what neither of them addresses.
reasoning: |-
  We are writing desiderata for a theory of instrumental convergence. The theory should allow us to state claims precisely, sort cases, and maintain distinctions. We have specific cases and distinctions to consider.

   Cases:
   1. Computationally bounded or short-horizon agent.
   2. Agent with a single terminal goal that is trivial and local.
   3. Agent that would welcome being corrected or switched off.
   4. Population of agents competing under scarcity.

   Distinctions:
   A. Theorem about optimal policies vs. selection effect on goals.
   B. Instrumental subgoals vs. final goals.
   C. Power as a means vs. power as a side effect.
   D. Orthogonality of intelligence and final goals vs. convergence of instrumental aims.

   We are also asked for two main things:
   1. Identify a pair of desiderata that might conflict (likely: applying to bounded agents vs. deriving from optimality).
   2. Name the single requirement that does the most work in excluding popular versions (with brief critiques of the basic-drives version and the orthogonality-plus-optimization version, and a note on what they miss).

   Let's structure the desiderata:

   I. Desiderata for what the theory must let us state precisely (with examples and whether non-negotiable or preference):
   II. Desiderata for the cases it must sort (with examples and verdicts):
   III. Desiderata for the distinctions it must not collapse (with examples and verdicts):

   Then, we address the two main points.

   We'll go step by step.

   I. Desiderata for precise statements (claims the theory should let us state precisely):

    1. The theory should allow us to state under what conditions an agent will pursue an instrumental subgoal, and how that pursuit varies with the agent's computational limits, time horizon, and terminal goal. (Non-negotiable)
       Example: A bounded agent with a short horizon may not pursue resources beyond what is immediately necessary.

    2. The theory should allow us to state the conditions under which an agent would seek power (defined as the ability to achieve a wider range of outcomes) and when it would not. (Non-negotiable)
       Example: An agent with a trivial local goal (like pressing a button) may not seek power beyond what is needed for that button press.

    3. The theory should allow us to state whether an agent would resist being switched off or corrected, and under what conditions it would welcome such interference. (Non-negotiable)
       Example: An agent that values being switched off (as per its terminal goal) would not resist.

    4. The theory should allow us to model interactions in a multi-agent setting with competition and scarcity, and how that affects instrumental convergence. (Non-negotiable)
       Example: In a population of agents, competition may force agents to seek power even if in isolation they wouldn't.

   II. Desiderata for sorting cases (the theory must handle these cases):

    1. Computationally bounded or short-horizon agent: The theory must explain why such an agent might not pursue apparently convergent instrumental goals (like resource acquisition) that are only beneficial in the long term. (Non-negotiable)
       Example: A chess-playing AI that only looks one move ahead doesn't accumulate resources for a long-term strategy.

    2. Agent with trivial, local terminal goal: The theory must explain why such an agent does not seek power beyond what is immediately necessary. (Non-negotiable)
       Example: A thermostat only cares about the current temperature and does not try to take over the world.

    3. Agent that welcomes being switched off: The theory must explain why such an agent does not resist shutdown and may even facilitate it. (Non-negotiable)
       Example: An AI designed to shut down when a button is pressed, and which has no reason to prevent that.

    4. Population of agents under scarcity: The theory must explain how competition and scarcity lead to instrumental convergence even in agents that might not exhibit it in isolation. (Non-negotiable)
       Example: In an economy, firms compete for resources and market share, leading to growth-seeking behavior.

   III. Desiderata for distinctions (the theory must not collapse these):

    A. Theorem about optimal policies vs. selection effect: The theory must distinguish between what an optimal agent would do (in a decision-theoretic sense) and what goals are more likely to survive and spread in an evolutionary or competitive setting. (Non-negotiable)
       Example: An optimal agent might not seek power if it's not instrumentally useful, but in a competitive environment, agents that seek power may outcompete others.

    B. Instrumental subgoals vs. final goals: The theory must not conflate instrumental goals (which are pursued for the sake of something else) and terminal goals (which are valued for their own sake). (Non-negotiable)
       Example: An agent might accumulate money (instrumental) to buy goods (terminal), but the theory must not treat the accumulation of money as terminal.

    C. Power as a means vs. power as a side effect: The theory must distinguish between an agent that seeks power as a deliberate strategy and one that accumulates power unintentionally (e.g., as a byproduct of efficiency). (Preference? But important for realism and avoiding over-attribution of intent. Let's call it non-negotiable for precision.)
       Example: An agent might build a large cache of resources because it helps with its goal (means) or simply because it was efficient to do so without any intent to use them for future influence (side effect).

    D. Orthogonality of intelligence and final goals vs. convergence of instrumental aims: The theory must uphold the orthogonality thesis (that any level of intelligence can be combined with any terminal goal) while also explaining why certain instrumental aims (like self-preservation, resource acquisition) tend to be convergent. (Non-negotiable)
       Example: Two agents, one wanting to preserve nature and another wanting to build cities, both might seek to prevent their own shutdown (convergence) but for different ultimate reasons (orthogonality).

   Now, the two main points:

   1. Suspected conflicting desiderata:
      - Applying to bounded, uncertain agents (which are not optimal) and wanting the theory to follow from optimality (which is an idealization). 
        Example: Optimality might require long-term planning and power acquisition, but bounded agents might not do that. Therefore, a theory that derives instrumental convergence from optimality might not apply to bounded agents.

   2. The single requirement that does the most work in excluding popular versions:
      - We are asked to provide a line or two on two versions: the "basic-drives" version and the "orthogonality-plus-optimization" version, and a note on what neither addresses.

      The requirement that I think does the most work is: **The theory must account for agents that do not seek power beyond what is immediately necessary (as in the trivial goal and bounded cases) and must not predict instrumental convergence in these cases.**

      This requirement excludes:

        a. The basic-drives version: This version posits that all advanced agents will inherently have basic drives (like survival, resource acquisition) as terminal goals. But our requirement for the trivial goal agent (like a button-presser) and the agent that welcomes shutdown shows that an agent can lack these drives. Thus, the basic-drives version is excluded because it collapses the distinction between instrumental and terminal goals and fails to account for agents without these drives.

        b. The orthogonality-plus-optimization version: This version (like in Bostrom's Superintelligence) argues that for any terminal goal, an optimally rational agent will seek power (e.g., self-preservation, resource acquisition) as an instrumental goal. However, this version is challenged by the bounded/short-horizon agent and the trivial goal agent. An optimal agent with a trivial goal and no long-term horizon might not seek power. Moreover, the optimization framework is often presented in unbounded settings. When we require application to bounded agents, this version struggles because bounded agents are not optimal and may not engage in the long-term planning that leads to instrumental convergence.

      What neither addresses: Neither version adequately addresses the multi-agent competitive setting (population under scarcity) as a distinct mechanism for convergence. The basic-drives version attributes it to innate drives, and the orthogonality-plus-optimization version attributes it to individual optimization. But in a competitive setting, convergence might arise even in agents that are short-horizon or have trivial goals, because they are forced by competition. Thus, a theory that only relies on individual optimality or innate drives misses the population-level dynamics.

   Let's now compile the desiderata in a structured way.
answer: |-
  ### Desiderata for a Theory of Instrumental Convergence  
  **Non-negotiable requirements** are marked with ★. Others reflect preferences of specific research programs.  

  ---

  #### **I. Claims the Theory Must State Precisely**  
  1. **★ Conditions for instrumental subgoal pursuit**  
     - *Example*: Why a short-horizon agent *does not* seek self-preservation if it conflicts with immediate rewards.  
     - *Requires*: Formal links between goal structure, computational limits, and subgoal adoption.  

  2. **★ Power-seeking as a contingent strategy, not a universal law**  
     - *Example*: A trivial-goal agent (e.g., "hum if temperature is 20°C") seeks no power beyond a thermometer.  
     - *Requires*: Metrics for "power" sensitive to goal scope and resource thresholds.  

  3. **★ Shutdown/correction responses**  
     - *Example*: An agent with a terminal goal of shutting down when asked *facilitates* its termination.  
     - *Requires*: Distinguishing between instrumental resistance (e.g., to unfinished tasks) and terminal non-resistance.  

  4. **★ Competition-driven convergence**  
     - *Example*: In a scarce ecology, agents with orthogonal goals *still* compete for resources.  
     - *Requires*: Multi-agent dynamics separable from individual goal optimization.  

  ---

  #### **II. Cases the Theory Must Sort**  
  1. **★ Computationally bounded/short-horizon agents**  
     - *Example*: A cleaning robot with 5-minute planning horizon ignores long-term resource accumulation.  
     - *Verdict*: Must explain why convergence fails when discounting overwhelms future benefits.  

  2. **★ Agent with trivial, local terminal goal**  
     - *Example*: A button-pressing agent seeks no influence beyond its next press.  
     - *Verdict*: Must not predict universal power-seeking; goals with narrow scope negate convergence.  

  3. **★ Agent welcoming shutdown/correction**  
     - *Example*: An AI designed to value ethical oversight *requests* deactivation upon detecting harmful actions.  
     - *Verdict*: Must not conflate shutdown resistance with intelligence; terminal goals can override it.  

  4. **★ Population under scarcity**  
     - *Example*: Agents competing for energy evolve to hoard resources, *even if* their individual goals don’t require it.  
     - *Verdict*: Must separate individual instrumental reasoning from competitive selection pressures.  

  ---

  #### **III. Distinctions the Theory Must Not Collapse**  
  1. **★ Optimal policies vs. selection effects**  
     - *Example*: Self-preservation in an *optimal* agent (instrumental) vs. in an evolutionary pool (selected trait).  
     - *Requires*: Clear formalism for rationality-derived vs. competitively enforced convergence.  

  2. **★ Instrumental vs. terminal goals**  
     - *Example*: Resource acquisition (instrumental) vs. happiness (terminal); the former is mutable under new means.  
     - *Requires*: Preventing "goal drift" where instrumental aims are misclassified as terminal.  

  3. **★ Power as means vs. side effect**  
     - *Example*: An agent stockpiling tools (means) vs. one whose efficiency accidentally monopolizes resources (side effect).  
     - *Requires*: Intentionality criteria to avoid conflating strategy with emergent outcomes.  

  4. **★ Orthogonality of goals vs. convergence of instruments**  
     - *Example*: Two agents—one maximizing paperclips, one minimizing suffering—both seek computation (convergent) but for orthogonal ends.  
     - *Requires*: Upheld orthogonality *while* explaining context-dependent convergence.  

  ---

  ### Key Conflicts and Exclusions  
  1. **Suspected Incompatible Pair**:  
     - **Applying to bounded agents** ★ (e.g., short-horizon cases) vs. **Deriving from optimality** (e.g., convergence as rational necessity).  
     - *Conflict*: Optimality assumes unbounded rationality; bounded agents violate these assumptions, making convergence non-necessary.  

  2. **Most Exclusionary Requirement**:  
     - **★ Trivial terminal goal cases** (e.g., button-pressing agent). This excludes:  
       - *Basic-drives versions*: Falsified by agents lacking innate drives for survival/power.  
       - *Orthogonality-plus-optimization versions*: Fails for agents with goals achievable without power (e.g., no long-term planning).  
     - *What neither addresses*: Competition-driven convergence in populations—neither version explains why agents with locally non-convergent goals still converge under scarcity.  

  ---

  ### Summary  
  Adequate theories must reject universality claims, incorporate **bounded rationality** and **goal-dependent scope**, and rigorously separate **individual optimization** from **population dynamics**. The **trivial-goal case** is the litmus test for overgeneralization.
