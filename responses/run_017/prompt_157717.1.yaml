  ### Recommendations for Your Board Presentation
  1. **Clarify the Trade-Off**:  
     > "This isn't about accuracy versus fairness. It's about *which kind* of fairness we prioritize: scores meaning the same thing across groups (calibration) or decisions being equally accurate for non-reoffenders and reoffenders (error rates)."  

  2. **Address the Percentile Proposal**:  
     > "Using group-specific thresholds can equalize error rates, but scores won't mean the same thing across groups. It also requires using race explicitly in decisions, which raises legal risks."  

  3. **Emphasize Agency**:  
     > "The theorem doesn't mean fairness is hopeless—it means we must transparently choose which fairness goal matters most for our mission."  

  4. **Avoid Overclaims**:  
     - Do not say "accuracy and fairness trade off."  
     - Do not claim "perfect predictors are unfair."  

  This balances mathematical rigor with accessibility while flagging ethical/legal pitfalls.
