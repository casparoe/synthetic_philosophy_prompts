  ### Corrected Explanation for Nontechnical Audiences
  **Gut-Level Intuition (With Simple Algebra)**:  
  Imagine two neighborhoods:  
  - **Neighborhood A**: 20% reoffend.  
  - **Neighborhood B**: 10% reoffend.  

  You build a risk score that is **calibrated**:  
  - A score of "6" means 60% reoffense risk in both neighborhoods.  

  Now, set a threshold to flag "high-risk" people (e.g., score ≥ 5).  
  - **False Positive Rate (FPR)**: Non-reoffenders incorrectly flagged.  
  - **False Negative Rate (FNR)**: Reoffenders missed.  

  Here’s the conflict:  
  1. To keep equal FPR, you must flag the same *proportion* of non-reoffenders in both neighborhoods.  
  2. To keep equal FNR, you must miss the same *proportion* of reoffenders.  
  3. Calibration requires scores mean the same thing everywhere.  

  But algebra shows:  
  - **Non-reoffenders in A are riskier** than in B (due to base rates). To get equal FPR, you might need a higher threshold in A.  
  - **Reoffenders in A are less risky** (since scores are calibrated), so to get equal FNR, you might need a lower threshold.  
  - **Conflict**: You can’t set one threshold to satisfy both.  

  **Why base rates matter**:  
  If reoffense rates were equal (20% in both neighborhoods), the math works. If the tool is perfect (0 errors), it also works. Otherwise, you must prioritize which fairness goal matters most.

  ---

  ### Safe vs. Contestable Verdicts
  | Claim                                                                 | Verdict               | Safe?                                | Why/When It Breaks Down                               |  
  |-----------------------------------------------------------------------|-----------------------|--------------------------------------|-------------------------------------------------------|  
  | "No score can satisfy all 3 criteria"                                 | Safe                  | Yes (algebra)                        | Never—follows from definitions.                       |  
  | "COMPAS was accurate but disparate"                                   | Safe                  | Yes (empirical)                      | If COMPAS was miscalibrated.                          |  
  | "Trade-off between accuracy and fairness"                             | Contestable           | No                                   | Trade-off is between fairness criteria, not accuracy. |  
  | "Disparity survives perfect prediction"                               | Contestable           | Partially                            | Disparate impact ≠ unfairness; perfect predictors satisfy all criteria. |  
  | Percentile proposal "achieves all 3"                                  | Safe (as wrong)       | Yes (algebra)                        | Fails calibration by definition.                      |  
  | Percentile proposal "is legally risky"                                | Contestable           | No                                   | Depends on jurisdiction/case law.                     |  

  **Where My Reasoning Could Break Down**:  
  1. **Calibration Definitions**: I assume calibration is defined for continuous scores. Some define it for binned scores (e.g., 5–6/10), which weakens the impossibility.  
  2. **Base-Rate Gaps**: If base rates are very similar, the conflict is negligible. The theorem assumes "significant" differences.  
  3. **Alternative Fairness Criteria**: If the board cares about demographic parity (equal selection rates), the percentile proposal *might* be viable—but it violates calibration.  

