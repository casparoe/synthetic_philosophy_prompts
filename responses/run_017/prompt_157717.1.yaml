  ### Accuracy Audit of the Passage
  Below, I break down the passage claim-by-claim, categorizing each as **Accepted** (researchers agree), **Defensible Simplification** (oversimplified but okay for nontechnical audiences), or **Misleading/Wrong** (inaccurate or problematic). I then provide corrected explanations and address the percentile proposal. Finally, I clarify which verdicts are "safe" (based on uncontested algebra/definitions) versus "contestable" (dependent on assumptions or interpretations).

  ---

  ### Claim-by-Claim Assessment
  1. **"Fairness is not an engineering problem but a theorem. Around 2016 researchers proved that no risk score can be fair to two groups at once..."**  
     - **Verdict: Defensible Simplification**  
     - **Why**: The core impossibility result (Kleinberg, Chouldechova, Barocas-Hardt, 2016–2017) is real, but "fair to two groups at once" oversimplifies. The result shows specific *technical definitions* of fairness conflict—not that fairness is universally impossible.  
     - **Correction for Board**: "Researchers proved that no risk score can satisfy three common fairness criteria simultaneously unless groups have identical reoffense rates or the tool is perfect."

  2. **The three fairness criteria: Calibration, Equal FPR, Equal FNR.**  
     - **Verdict: Defensible Simplification (with caveats)**  
     - **Why**: The definitions are mostly correct but blur **continuous scores** (calibration) with **binary decisions** (FPR/FNR). Calibration requires that for any score value (e.g., 7/10), the reoffense probability is identical across groups. FPR/FNR require thresholds for binary decisions (e.g., "flag if score > 5").  
     - **Correction for Board**: "Calibration ensures scores mean the same thing across groups. Equal error rates ensure decisions are equally accurate for non-reoffenders (FPR) and reoffenders (FNR)."

  3. **"All three hold together only if groups reoffend at the same rate or the score is perfect."**  
     - **Verdict: Accepted**  
     - **Why**: This is the core theorem. Algebra shows that if calibration, equal FPR, and equal FNR hold, then either:  
       - Base rates (reoffense rates) are equal, or  
       - The predictor is perfect (FPR=FNR=0).  
     - **Safe? Yes**. Follows from probability laws (no controversial assumptions).

  4. **COMPAS example: "It really did flag Black defendants at higher rates, and it really was accurate."**  
     - **Verdict: Accepted**  
     - **Why**: COMPAS was calibrated (scores predicted reoffense equally well for Black/white defendants) but had higher FPR for Black defendants due to base-rate differences. This is a real-world example of the theorem.

  5. **"Disparity survives perfect prediction."**  
     - **Verdict: Misleading**  
     - **Why**: A perfect predictor (0% errors) satisfies all three criteria automatically:  
       - Calibration: Scores = true probabilities (e.g., score 1.0 = 100% reoffense).  
       - Equal FPR/FNR: No errors, so FPR=FNR=0 for all groups.  
       Disparity in *flagging rates* could exist if base rates differ (e.g., group A has higher reoffense rates, so more are flagged), but this reflects reality—not unfairness in the tool. The passage confuses *disparate impact* (different outcomes) with *unfairness* (violating technical criteria).  
     - **Correction for Board**: "A perfect predictor satisfies all fairness criteria but can have different flagging rates. This may be legally contentious, but mathematically it's fair."

  6. **"Accuracy and fairness trade off against each other... no amount of cleverness gets around it."**  
     - **Verdict: Misleading**  
     - **Why**:  
       - **Problem 1**: The trade-off is between **conflicting fairness criteria** (calibration vs. error-rate parity), not between "accuracy and fairness." Calibration *is a form of accuracy*.  
       - **Problem 2**: Better data/models *can* reduce unfairness (e.g., if they shrink base-rate gaps), but they can't *eliminate* the impossibility without equalizing base rates.  
       - **Problem 3**: The theorem only applies to the *three specific criteria above*. Other fairness definitions (e.g., demographic parity) avoid this trade-off.  
     - **Correction for Board**: "The tension is between *types* of fairness—not accuracy vs. fairness. Prioritizing one may require sacrificing another."

