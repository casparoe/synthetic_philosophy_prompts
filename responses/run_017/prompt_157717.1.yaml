  ### Gut-level intuition for non-technical audience:

   Imagine two neighborhoods, A and B. In neighborhood A, 20% of people reoffend. In neighborhood B, 10% reoffend. We build a risk score that is very accurate: when it says "7 out of 10", then about 70% of those people reoffend, in both neighborhoods. This is calibration.

   Now, we have to decide whom to flag as high risk. We set a threshold, say 5 out of 10. Anyone with a score of 5 or above is flagged.

   In neighborhood A, because more people reoffend, the risk score tends to be higher. So more people will be above the threshold. That means more people from neighborhood A are flagged. But also, among the people who do not reoffend (the innocents), we will flag some as high risk (false positives). In neighborhood A, because the scores are generally higher, we might end up flagging a higher proportion of the innocents than in neighborhood B. Similarly, among the reoffenders, we might catch a higher proportion in neighborhood A than in neighborhood B.

   But we want the error rates to be the same: the proportion of innocents flagged should be the same in both neighborhoods, and the proportion of reoffenders missed should be the same.

   Can we have both calibration and equal error rates? Only if the reoffending rates are the same in both neighborhoods. Why? Because if the error rates are the same, then the proportion of each neighborhood that is flagged is determined by the reoffending rate and the error rates. But calibration requires that the overall reoffending rate in the neighborhood is the average of the risk scores. If the error rates are the same, we can derive that the reoffending rates must be the same.

