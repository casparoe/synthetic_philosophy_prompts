  Tone is crucial. Must maintain deadpan bureaucratese throughout - no winks, no escape hatches. Definitions should parody statutory language while accurately reflecting Dennett's terms. The "gravitational drift" clause can mirror real administrative struggles with identity continuity (like pension eligibility or criminal responsibility).

  For the dementia case resolution, I'm considering having the Office: 1) disqualify the patient's own fragmented narrative as insufficient mass, 2) treat all relatives' accounts equally regardless of truth, 3) use trivial metrics like page counts and notarization dates to "measure" narrative gravity. The horror comes from their serene application of rules that reduce personhood to paperwork - exactly as the theory permits when institutionalized.

  Final touch: the Office should insist this doesn't constitute euthanasia since "no ontological entity was extinguished." Just administrative closure of a file regarding "a lapsed narrative posit." That's where the philosophical bite lies - showing how the theory's deflationism enables bureaucratic violence.
