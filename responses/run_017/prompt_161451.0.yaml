  ## Statutory Guidance ONC-7b: Narrative Continuity Management (Third Revision)

  **Issuing Authority:** Office of Narrative Continuity (ONC), Department of Ontological Affairs
  **Effective Date:** 01/04/[Current Year +1]
  **Supersedes:** ONC-7a (Rev. 02)

  **1. Definitions**
      1.1 **Narrative Mass:** The aggregate quantum of documented assertions, attributions, records, and persistent references pertaining to a specific biological locus (Subject Body, SB). Sources include, but are not limited to: personal testimony (SB or others), official documentation (birth certificates, employment records, criminal files), media reports, authorized biographies, diaries, social media archives, and medical case notes. Unverified gossip below a persistence threshold (see Schedule 3) is excluded.
      1.2 **Center of Narrative Gravity (CNG):** The theoretical locus of maximal narrative coherence and density associated with an SB. The CNG constitutes the operational definition of the Self for administrative purposes. It is not a physical entity.
      1.3 **Authorized Biographer (AB):** The individual(s) or entity formally designated via Form ONC-D7 to curate and contribute primary narrative mass for an SB. Default AB is the SB, provided minimum coherence thresholds (Section 4) are met.
      1.4 **Gravitational Drift (ΔG):** Measurable change in the CNG position over temporal intervals (t1 to t2), calculated per ONC Formula ΔG-4 (see Annex A). ΔG exceeding 0.7 coherence units necessitates a Continuity Review (Section 7).
      1.5 **Narrative Locus:** The SB to which narrative mass is predominantly attached.

  **2. Core Principle**
      The Self is an abstract posit, equivalent to the CNG, arising from narrative mass distributed around an SB. The ONC administers continuity based solely on measurable narrative parameters. No ontological claims regarding a "true self" or "inner essence" are made or recognized.

  **3. Minimum Narrative Threshold (MNT)**
      3.1 An SB achieves CNG status (and thus, Selfhood for administrative purposes) only upon accumulating narrative mass exceeding 500 Standard Narrative Units (SNUs) over a contiguous 24-month period. Calculation methodology: Annex B.
      3.2 SBs below MNT (e.g., neonates, profoundly uncommunicative individuals, medically induced comatose states without prior significant mass) are classified as **Pre-Narrative Biological Entities (PNBEs)**. Rights and responsibilities are held in abeyance pending MNT achievement or designation of a Provisional AB (Section 5.3).
      3.3 Chronic states of silent suffering *may* generate sufficient passive narrative mass (e.g., medical records, caregiver logs) to meet MNT. Each case requires audit via Form ONC-A11.

  **4. Authorship and Co-Authorship**
      4.1 Narrative mass is agnostic to source. Contributions from non-SB sources (relatives, employers, state agencies, biographers) carry equal weight to SB contributions in CNG calculation, provided they meet persistence and relevance criteria.
      4.2 **Authorized Biographer (AB) Status:**
          *   4.2.1 An SB meeting coherence threshold (CT-3; see Annex C) may self-designate as AB or nominate others via ONC-D7.
          *   4.2.2 If SB coherence falls below CT-3, the ONC may appoint an AB based on proximity, historical contribution, or court order.
      4.3 **Unauthorized Co-Authorship:** Is not an offense. All persistent narrative mass contributes to the CNG regardless of source or SB consent. Disputes regarding *misattribution* can be raised via ONC-F14 (Narrative Fact-Check Request), but factual accuracy does not impact mass calculation, only coherence scoring (affecting ΔG and AB status).
      4.4 **Confabulation/Imposed Narrative:** Narratives demonstrably false or externally imposed still constitute valid narrative mass. They contribute to the CNG *as recorded*. Revision requires submission of counter-narrative mass of greater aggregate persistence via standard ONC amendment procedures (Form ONC-R9).

  **5. CNG Stability and Continuity**
      5.1 The CNG is not static. ΔG is expected and monitored.
      5.2 **Continuity Threshold:** A ΔG < 0.8 coherence units between assessments (minimum interval: 5 years, or triggered by major life event per Schedule 2) confirms CNG continuity. The Self is considered administratively continuous.
      5.3 **Significant Drift (ΔG ≥ 0.8):** Triggers a Continuity Review (CR). The ONC assesses:
          *   Whether the CNG represents a coherent evolution of the prior narrative locus (requiring AB update and ΔG recalibration).
          *   Whether drift constitutes a **Narrative Rupture**, suggesting the emergence of a *de facto* new CNG associated with the SB. If rupture is confirmed (>0.95 ΔG, or fundamental narrative contradiction irreconcilable via coherence algorithms), a new CNG file is initiated. Historical entitlements/liabilities may be apportioned based on narrative phase dominance analysis (Annex D).
      5.4 **Retroactive Constitution/Dissolution:** Amendment of historical records alters the narrative mass landscape. Significant amendments *can* retrospectively alter the calculated CNG position for past intervals, potentially changing continuity determinations or liability apportionment for that period. Dissolution of a CNG (e.g., proven widespread historical record forgery invalidating core mass) is possible via ONC Tribunal Order (Form ONC-T1).

  **6. Case Closure**
      A CNG file is closed only upon:
      *   6.1 Confirmed biological cessation of the SB, AND
      *   6.2 Cessation of significant new narrative mass accretion (persistence score < 0.1 per annum for 10 consecutive years), OR
      *   6.3 Formal Tribunal Order of Narrative Dissolution (ONC-T1).

  **WORKED CASE FILE: ONC-REF #45123 (Subject Body: Eleanor Vance, DOB 12/05/1937)**

  *   **Status:** Open (Continuity Review: Indeterminate)
  *   **Presenting Issue:** SB Vance exhibits advanced dementia (medically confirmed). Communication is minimal and non-sequitur. AB status lapsed 18 months ago (coherence score 0.2 < CT-3 threshold 0.7). Three surviving children (David Vance, Sarah Finch, Michael Vance) nominated as joint Provisional ABs via ONC-D7 (Pending).
  *   **Narrative Mass Conflict:** Provisional ABs submitted conflicting foundational narratives:
      *   *David Vance:* Emphasizes SB's career as a stern headmistress, community pillar, and devout churchgoer (submitted school records, church bulletins, 120pp memoir). CNG calculated as "Authoritative Caregiver."
      *   *Sarah Finch:* Submits SB's previously undisclosed diaries (2010-2018) revealing profound loneliness, regret over strict parenting, and secret atheism. Argues true CNG was "Private Skeptic." Contests church records as performative mass.
      *   *Michael Vance:* Focuses on SB's alleged decline into "childlike sweetness" post-dementia onset (submits care home logs, personal anecdotes). Proposes current CNG is "Innocent Dependent," distinct from prior self.
  *   **ONC Analysis:**
      *   **MNT:** Easily exceeded (historical mass substantial).
      *   **Current CNG Coherence:** SB's own utterances yield negligible, incoherent mass (score 0.15). Insufficient for self-designation.
      *   **Provisional AB Dispute:** All submitted narratives meet persistence criteria. No single narrative demonstrates clear dominance (>60% aggregate persistence score). Mutual accusations of misrepresentation (ONC-F14 filed by all parties) are noted but irrelevant to mass *quantity*.
      *   **Gravitational Drift (ΔG):** Calculation impossible. Pre-dementia narrative mass heavily conflicted (David's "Caregiver" vs. Sarah's "Skeptic"). Post-onset narrative (Michael's "Dependent") lacks clear tethering to prior mass. ΔG algorithms fail convergence.
      *   **Continuity Assessment:** Indeterminate. Potential Narrative Rupture flagged, but cannot isolate distinct pre/post CNG due to conflicting baseline. Cannot confirm administrative continuity of the "Eleanor Vance" CNG.
  *   **Action:** CR remains open. Provisional AB status suspended due to conflict. ONC Directive issued:
      1.  All parties mandated to submit quantified corroboration for their narratives (e.g., witness affidavits re: church attendance/secular views, analysis of diary handwriting, care home video logs) to bolster persistence scores.
      2.  ONC Forensic Narrative Unit dispatched to assess diary authenticity and perform cross-mass coherence analysis.
      3.  SB's status: Designated **CNG-Indeterminate Pending Review**. Legal/financial decisions concerning SB require ad hoc ONC approval based on *most probable dominant narrative phase* for the specific context (e.g., pension: "Caregiver" phase likely; medical consent: "Dependent" phase considered). File cannot be closed (6.2 not met; new mass accruing via dispute).
  *   **Outcome (Projected):** Likely protracted tribunal (ONC-T1 petition anticipated by one party). Potential for apportionment of SB's assets/liabilities across competing narrative phases ("Caregiver," "Skeptic," "Dependent") if rupture confirmed, or imposition of a statistically averaged "Consensus CNG" should Tribunal deem it expedient. Closure contingent on either biological cessation *plus* resolution of mass conflict, or Tribunal Dissolution Order. The SB remains biologically present, but the administrative Self is in abeyance, constituted solely by the unresolved bureaucratic process surrounding the conflicting narratives. The Office notes this reflects no failure of the SB, only the operational challenges of managing narrative gravity under conditions of high entropy.
