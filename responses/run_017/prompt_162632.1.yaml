  Now, the effect under Brier: when splitting the true cell (rain into B and A), both Ari and Bea get penalized because their credences for the true subcase aren't 1, and they have mass on the false subcase. But Ari has more mass on the true subcell (0.54 vs 0.35), so his penalty is less, causing the flip. The user's point about splitting false cells making you look better—if you split a false cell, say no-rain into two subcases, and you assign credence to them, but since they're false, the squared errors for those cells would be (0 - p_sub1)^2 + (0 - p_sub2)^2. If you had assigned p to the original false cell, after splitting into two, the sum of squared errors for the subcells would be minimized if you assign the same p to each, but compared to the unsplit case where you have (0 - p)^2, now you have two terms each (0 - p/2)^2 = (p/2)^2, so total 2*(p^2/4) = p^2 / 2, which is less than p^2 if p>0. So splitting a false cell reduces your inaccuracy under Brier. But when you split the true cell, as in their example, it increases your inaccuracy. The net effect depends on how the credence is distributed. This is correct, and it doesn't undermine their argument because the core issue is that partition refinement can change accuracy comparisons arbitrarily.

  Next, is this a real problem for accuracy-first? The literature does address partition sensitivity. Leitgeb and Pettigrew (2010) discuss how Brier score is partition-dependent. They might argue that coherence (probabilistic consistency) is the key, and once you're coherent, you're scoring rule consistent. But in this case, both Ari and Bea are coherent over their respective algebras. The problem is that when we refine, we're changing the algebra, and the scoring rule evaluates them on a finer partition where their credences might not be coherent if they haven't specified the subcases. But in the example, after refinement, both have coherent credences over the new partition. Ari has {B:0.54, A:0.06, N:0.4}, which sums to 1; Bea has {0.35,0.35,0.3}, also sums to 1. So they are coherent. Yet, the accuracy ranking flipped. So the issue persists even with coherence. 

