  The user worries that their fix collapses into scoring over the algebra of propositions the agent has attitudes toward. But that would make accuracy norms trivial because agents could avoid penalties by not forming opinions on finer partitions. That seems problematic. Alternatively, if the evidence sets the grain, but evidence has to be modeled, which might involve credences, leading to circularity. 

  The weakest premise might be that partition refinement is merely notational. In the example, splitting rain into before/after noon adds substantive possibilities, even if the evidence doesn't discriminate them. But if the agent has credences about them, it's not just notational. Accuracy-first might argue that the scoring should be done on the coarsest partition that the agent entertains, but agents can entertain finer partitions. 

  Is it worth pursuing? The user has limited time. The issue is known in the literature, but often dismissed by assuming a fixed or natural partition. Their evidence-based fix isn't new, but they might contribute by formalizing it numerically or exploring implications. However, without access to literature, they might reinvent existing solutions. Perhaps they could frame it as a problem for scoring rules in general and propose that only partitions matching the evidence's discriminatory power should be used. But they need to address the circularity concern. 

