answer: |-
  ### Translation
  **Chesterton's Fence as Incident Review Protocol:**  
  Treat every legacy component like an unexplained alert in your monitoring stack. Before deleting "dead code" or relaxing an "orphaned invariant," initiate a formal *incident review* for that artifact. Your burden: reconstruct the *original blast radius* it mitigated. Example: A validation rule blocking "negative zero" (–0.00) transactions may seem vestigial until you discover it prevented ledger corruption in a deprecated reconciliation subsystem. Until you complete this *staged rollout of understanding*—tracing code paths, interviewing retired engineers, auditing old incident logs—the component stays. This is a **deferral rule**: Prove the fence is unused *and* irrelevant to current failure modes before removal. If reconstruction succeeds and reveals no active threat, removal is justified.  

  **Burke as Tech-Debt Register Philosophy:**  
  Legacy systems are like a shared tech-debt register curated across decades—each entry carries implicit *rollout flags* and *reversibility hooks* you can’t fully audit. Burke argues this register has higher authority than your individual refactoring proposal because:  
  - The system’s persistence proves it survived *unknown-unknown test cases* (market crashes, edge-timezone transitions) your sandbox can’t replicate.  
  - Its "institutional fitness" isn’t in the code comments but in the *aggregated rollback decisions* of engineers long gone—each incident they fixed embedded tacit knowledge. Removing it risks violating *hidden invariants* with exponential blast radius. Unlike Chesterton, Burke implies that even if you *think* you’ve reconstructed the purpose (e.g., "this COBOL module handles leap-second accounting"), its 20-year uptime *is itself evidence* of undocumented fitness. Your reasoning is a single unit test; its longevity is the production load test.  

  ---

  ### One Argument or Two  
  Chesterton and Burke decouple under translation. Chesterton is **procedural deferral**: Freeze the deletion PR until your "archeology sprint" delivers a root-cause analysis. If none exists, proceed—it’s just *verified dead code*. Burke demands **permanent burden-shifting**: The mere fact the component endured mandates that *you* prove removal won’t collapse some unmodeled workflow, even after reconstructing its original purpose. Example: You find that a "redundant" fraud check existed solely for Visa Class B processors retired in 2010. Chesterton says: Delete. Burke says: Its survival into the SEPA era suggests it now mitigates a *new* risk—like EUR/CHF conversion rounding—so justify why *today’s* system doesn’t need it. Burke’s "fitness" claim makes longevity *prima facie evidence* of current utility, forcing perpetual proof-of-harmlessness.  

  ---

  ### Residue  
  **Orphaned Invariants vs. Vestigial Code:**  
  Your orphaned invariant incident perfectly maps to Chesterton’s warning. The team did a "staged rollout" (tests, monitoring) but missed the invariant’s *undocumented blast radius*—the rare condition was a combinatorial edge case lost with its designers. Chesterton would call this a failed reconstruction: They didn’t *prove* the invariant was vestigial, just unexercised. Burke would add: Its 10-year enforcement *was* evidence of latent necessity, making removal reckless without simulating all historical transaction mixes.  

  **Persistence ≠ Fitness:**  
  Burke’s claim stumbles on your second complication. A 20-year-old design may persist due to:  
  - **Vendor lock-in:** The COBOL module stays because its replacement triggers $2M in PCI recertification.  
  - **Knowledge evaporation:** No one dares touch the "zombie flag" controlling settlement batches because the last SME retired pre-Git.  
  Here, longevity signals *switching costs*, not fitness. Burke might counter that lock-in *is* a form of systemic adaptation (avoiding recertification risk is fitness), but this stretches "fitness" to cover path dependency—weakening its authority. Chesterton escapes unscathed: He only cares if you *reconstructed the purpose*, not if it was "fit." If you prove the code exists solely because Salesforce integration requires deprecated XML formats, removal is valid.  

  ---

  ### Verdict  
  The residue exposes gaps in *both* your vocabulary and the conservative arguments:  
  1. **No counterpart:** Burke’s "trans-generational authority" relies on *reverence for collective legacy*—an emotional attachment to continuity that your "tech-debt register" frames as pure risk calculus. Your vocabulary lacks the concept of *inherited institutional trust* as a motive beyond blast-radius containment.  
  2. **Ambiguity in conservatism:** Burke’s claim that longevity = fitness *is* weakened by your lock-in examples. Persistence as "evidence" crumbles when survival hinges on non-technical constraints. This isn’t a flaw in your vocabulary—it reveals Burke’s overreach. Chesterton’s narrower, procedural rule survives translation intact: Orphaned invariants *demand* reconstruction rigor, but don’t sanctify survival. Your legacy-maintenance lexicon robustly handles Chesterton; Burke’s grandeur dissolves under dependency graphs.
