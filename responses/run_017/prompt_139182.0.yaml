  ### Decision Tree for Simpson's Paradox in Prescribing Guidelines  
  *Start with a pooled table (e.g., Surgery A appears better overall) and a stratified table (e.g., Surgery A is worse in both mild and severe disease strata) that disagree. Use the example: Surgery A beats Surgery B overall but loses in both mild and severe cases because severe cases were disproportionately assigned to Surgery B.*

  #### Step 1: Is the stratifier (e.g., disease severity) measured **before treatment**, or is it a **post-treatment variable** (e.g., something influenced by treatment or outcome)?  
  - **→ Post-treatment variable:**  
    - **Leaf: "Collider bias: Use pooled table."**  
      *Why?* Stratifying on a post-treatment variable (e.g., a side effect caused by treatment) artificially creates bias. Ignore stratification (e.g., recommend Surgery A based on pooled data).  
      *Example:* If "complication during surgery" (caused by treatment and affecting outcome) is the stratifier, pooling avoids distortion.  

  - **→ Before treatment:**  
    - Proceed to Step 2.  

  #### Step 2: Does the disagreement disappear if you switch from a ratio measure (e.g., relative risk) to **risk difference**?  
  - **→ Yes:**  
    - **Leaf: "Artifact of the measure: Prefer risk difference or stratified ratios."**  
      *Why?* The reversal is due to non-collapsibility (mathematical quirk of ratios). Use risk difference for decisions or accept stratified ratios (e.g., Surgery B is better in all strata, so recommend it).  
      *Example:* Pooled relative risk favors Surgery A, but risk difference agrees with strata (Surgery B better).  

  - **→ No (disagreement remains with risk difference):**  
    - Proceed to Step 3.  

  #### Step 3: Does it matter if the guideline is applied **before or after** learning the patient’s stratum?  
  - **→ No (stratum known at decision time):**  
    - **Leaf: "Back-door adjustment: Use stratified table."**  
      *Why?* The stratifier (e.g., severity) confounds the treatment-outcome link. Condition on it for accurate causal effects (e.g., recommend Surgery B for all, since it wins in both strata).  
      *Example:* Severity is known pre-treatment—stratified results trump pooled data.  

  - **→ Yes (stratum unknown at decision time):**  
    - Proceed to Step 4.  

  #### Step 4: If a **fine partition** (e.g., severity split into 10 levels) and **coarse partition** (e.g., mild/severe) both reverse the pooled effect, which wins?  
  - **→ Fine partition wins:**  
    - **Leaf: "Causal refinement: Use finest partition."**  
      *Why?* Finer strata better isolate confounding (e.g., use 10 severity levels to avoid residual bias).  
      *Example:* Both 2-level and 10-level severity splits show Surgery B is better—trust the detailed strata.  

  - **→ Coarse partition wins:**  
    - **Leaf: "Incoherent: No statistical basis to choose."**  
      *Why?* Without evidence that coarse strata miss confounding, both are valid. This case is rare/unattractive—gather more data or default to coarse (simpler for guidelines).  
      *Example:* If both partitions conflict arbitrarily (no refinement), the tree cannot resolve it.  

  - **→ Not applicable (only one partition exists):**  
    - **Leaf: "Sure-thing principle: Follow stratified table."**  
      *Why?* If treatment loses in every stratum (e.g., Surgery A worse for mild/severe), it should lose overall—ignore pooled data. Use this when strata are unknown pre-treatment.  
      *Example:* Unknown severity—but since Surgery A loses in all strata, avoid it.  

  ---  
  ### Key for Leaves  
  - **Named positions:**  
    - Collider bias → Causal graphs (avoid conditioning on colliders).  
    - Artifact of the measure → Statistical non-collapsibility.  
    - Back-door adjustment → Causal inference (adjust for confounders).  
    - Sure-thing principle → Decision theory (dominates if consistent direction).  
    - Causal refinement → Local mechanisms (finer strata reveal true effects).  
  - **Incoherent branches:**  
    - "No statistical basis to choose" (Step 4) → Unattractive; requires external input.  
  - **Unused leaves:**  
    - "These strata aren’t poolable at all" → Covered by *back-door adjustment* and *sure-thing principle* (strata define distinct effects).  
  - **Tree limitations:**  
    - Cannot separate "back-door adjustment" (Step 3) from "causal refinement" (Step 4)—both address confounding but at different granularity.  
    - "No single effect" → Implicit in *causal refinement* (effects are stratum-specific).  

  ### How the Example Travels the Tree  
  1. **Stratifier (severity) is pre-treatment** → Step 2.  
  2. **Disagreement survives risk difference** (real confounding) → Step 3.  
  3. **Stratum known at decision time** → *Back-door adjustment: Use stratified table (recommend Surgery B)*.  
     - **If stratum unknown** → Step 4 → *Sure-thing principle: Avoid Surgery A* (loses in all strata).  

  This tree avoids stats/philosophy jargon—questions are answerable using your example’s logic.
