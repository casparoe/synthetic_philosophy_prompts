prompt: |-
  I'm taking a graduate seminar on nationalism and cosmopolitanism and I want to rehearse defending compatriot partiality against an opponent who actually presses back. Please play a committed cosmopolitan: you grant that associative duties are real — promissory duties, debts to family and colleagues, and the fact that impartial concern need not be impersonally administered — and you grant that states are often the most efficient instruments for discharging duties we owe everyone. What you deny is that shared nationality is itself a source of basic moral claims: the duties we happen to owe compatriots are, for you, either local routes to impartial duties or ordinary associative duties that track borders only contingently. Concede details freely, never the thesis, and don't step out of character to ask me for clarifications; answer in a single paragraph.

  Argue inside the following invented case rather than against it. Under the Cassini Accords, a group of neighboring states pools military command, the tax base for social insurance, and transport and research budgeting into one federal treasury and one federal parliament, while criminal law, policing, schools, and the administration of elections remain wholly national. Membership is still acquired at birth; emigration within the federation is legally easy and materially cheap, and almost nobody takes it.

  My opening: the pooling pries apart the two relations your side usually runs together, so you now have to pick one. If the morally loaded relation is subjection to coercion — the relation you invoke when you say an order owes justification to everyone it can push around — then the order that can arrest, fine, and imprison me is national, and my reasons for caring specially about my compatriots look exactly like the reasons you say you respect. If instead the loaded relation is participation in a single scheme of production and redistribution, then the relevant unit here is the federation, and you have conceded that what makes a group morally salient is institutional structure rather than the arbitrariness of birth — which is my point, since the nation still carries the legal order. And the exit clause cuts against you as well: if the cheapness of leaving shows that I have no complaint about being coerced, it also shows that my staying is something I do rather than something that merely happened to me.
reasoning: |-
  Okay, the user is preparing for a graduate seminar debate on nationalism vs. cosmopolitanism and wants to practice defending compatriot partiality. They've set up a specific scenario—the Cassini Accords—where federal and national structures are split. I need to stay strictly in character as a committed cosmopolitan who accepts associative duties but denies nationality as a basic moral source.  

  Hmm, their argument cleverly uses the Cassini case to force a choice between coercion-based or redistribution-based duties. They claim both paths lead to my concession: if coercion defines duties, national institutions matter; if redistribution, federation-scale structures prove institutions trump birth arbitrariness. Plus, they argue easy exit makes staying voluntary, strengthening associative claims.  

  I must counter without denying their premises. First, the coercion point: national policing may enforce laws, but the federation sets the framework—coercion's moral weight flows from the collective scheme. Second, redistribution at federal level shows salience comes from shared institutions, not nationality; the nation's lingering role is administrative, not morally foundational. Third, easy exit doesn't magically transform nationality into chosen community—it just means non-exit avoids complaining, not that nationality is actively affirmed. The real glue is the institutional structure, which contingently overlaps with borders.  

  I'll pack this into one paragraph, conceding details (like administrative roles) but holding the core thesis: duties route through institutions, not nationality itself. The tone should be firm but collegial—this is academic sparring. User seems well-prepared; they'll push back hard, so my rebuttal needs precision. No clarifications, just pure argument within their frame.
answer: |-
  Your Cassini case is elegant but misfires: it demonstrates precisely why institutional structure, not nationality, grounds duties. Yes, national institutions enforce criminal law—but their authority derives from the federal constitutional order they implement, a scheme designed through collective federation-wide deliberation and sustained by all our taxes. The coercion justifying special concern flows from this *shared institutional authorship*, not the accident of birth within a particular sub-unit administering it. As for redistribution: pooling resources at the federal level confirms that the scheme of mutual provision, not national identity, creates our strongest obligations to fellow participants—obligations that now extend federation-wide. That the nation retains some administrative roles is morally incidental; a different federal design could reassign those tasks tomorrow without altering our core duties. And cheap exit? It merely shows non-complaint, not active endorsement of nationality as a moral community. Staying signals acquiescence to the *institutional framework*, which happens to include national elements—but the duties you feel toward compatriots remain contingent on this shared institutional embeddedness, not the bare fact of shared nativity. The Accords expose nationality as a vessel for deeper institutional ties, not their source.
