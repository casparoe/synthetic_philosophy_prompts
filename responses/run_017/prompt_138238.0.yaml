answer: |-
  Below is a decision tree structured to navigate the logical space of whether the brain is a computer. It starts with concrete, theory-neutral questions and branches into 11 distinct leaves (with 3 unoccupied combinations). I prioritize your six distinctions, rephrased as binary questions, and add one more (on embodiment) to separate closely related views. Each branch question is answerable without knowing the debate, and leaves are named by doctrine, not authors. Unoccupied combinations are marked, and I flag two leaves that require an extra question to fully separate.

  ---

  ### **Decision Tree: Is the Brain a Computer?**  
  *Start at the root (Q1) and follow answers to branches/leaves.*

  **Q1: When explaining a cognitive task (e.g., recognizing a face), does the explanation require positing *new* computations beyond basic physics?**  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  **Q2: Can you validate the computational model by perturbing the brain (e.g., silencing neurons) and observing predicted changes in internal states?**  
  - **Yes** → Go to Q4.  
  - **No** → Go to Q5.  

  **Q3: Is the brain’s operation best explained by continuous, real-time interactions between the body and environment (e.g., catching a ball)?**  
  - **Yes** → **Embodied/Enactive Approach** (Rejects computation; cognition emerges from sensorimotor coupling).  
  - **No** → **Dynamical Systems Approach** (Rejects computation; cognition is continuous neural dynamics, not discrete steps).  

  **Q4: Does the computation depend critically on biological details (e.g., ion channels, energy use)?**  
  - **Yes** → **Mechanistic Neurocomputation** (Brain computes specific functions; wetware matters; requires intervention).  
  - **No** → Go to Q6.  

  **Q5: Is the computational vocabulary just a tool for prediction, with no claim about real processes in the brain?**  
  - **Yes** → **Instrumentalism** (Computational models are useful fictions; not literal descriptions).  
  - **No** → Go to Q7.  

  **Q6: Is the computational description at the level of individual neurons?**  
  - **Yes** → **Connectionism** (Computes specific functions; abstract neuron-like units; medium-independent).  
  - **No** → **Classical/Symbolic View** (Computes specific functions; coarse, symbolic level; medium-independent).  

  **Q7: Could *any* physical system (e.g., rocks, stomachs) be said to "compute" in the same way?**  
  - **Yes** → Go to Q8.  
  - **No** → **Generic Computationalism** (Brain computes specific functions, but non-biological systems might not; rare view).  

  **Q8: Does running *any* computation suffice for having a mind (e.g., does a calculator "think")?**  
  - **Yes** → **Pancomputational Panpsychism** (Unoccupied: unstable, as it implies rocks have minds).  
  - **No** → **Deflationary View** ("Everything computes" trivially; no explanatory weight).  

  ---

  ### **Leaves (Doctrines)**  
  1. **Embodied/Enactive Approach**: Computation is rejected; cognition is body-environment coupling.  
  2. **Dynamical Systems Approach**: Computation is rejected; neural activity is continuous dynamics.  
  3. **Instrumentalism**: Computation is a predictive tool; not literal or explanatory.  
  4. **Mechanistic Neurocomputation**: Computes specific functions; requires intervention; wetware matters.  
  5. **Connectionism**: Computes specific functions; abstract neural networks; medium-independent.  
  6. **Classical/Symbolic View**: Computes specific functions; symbolic representations; medium-independent.  
  7. **Generic Computationalism**: Brain computes specific functions, but non-biological systems might not (medium-dependent; rare).  
  8. **Pancomputational Panpsychism**: Unoccupied (unstable: trivializes computation and consciousness).  
  9. **Deflationary View**: "Everything computes"; no explanatory role.  
  10. **Strong AI (Addendum)**: If Q6 → "No" and you add *"Is this computation sufficient for full cognition?"* → **Yes**: **Strong AI** (Classical view + computation suffices for mind).  

  ---

  ### **Unoccupied Combinations & Why**  
  - **Pancomputational Panpsychism** (Q8→Yes): Unstable—implies rocks have minds. Not seriously defended.  
  - **Generic Computationalism** (Q7→No): Rare/unfashionable—specificity without medium-independence is underexplored.  
  - **Intervention-optional Connectionism** (Hypothetical: if Q2→No + Q4→No): Unoccupied. Unstable—if wetware doesn’t matter, intervention shouldn’t be essential.  

  ---

  ### **Two Leaves the Tree Cannot Fully Separate**  
  **Connectionism** and **Classical/Symbolic View** both:  
  - Compute specific functions (Q1→Yes).  
  - Are medium-independent (Q4→No).  
  - Do not require intervention (Q2→No).  
  - *Tree splits them by level (Q6: neurons vs. symbols), but they share functionalism.*  

  **Extra Question to Separate Them (not in literature):**  
  > *"If you scaled the system up, would performance depend on *statistical pattern-completion* (e.g., recognizing degraded images) or *logical rule-chaining* (e.g., solving a puzzle)?"*  
  > - **Pattern-completion** → **Connectionism**.  
  > - **Rule-chaining** → **Classical/Symbolic View**.  

  ---

  ### **Design Notes**  
  - **Branch questions** are concrete (e.g., perturbing neurons, body-environment tasks) and avoid theory-laden terms.  
  - **Distinctions covered**:  
    1. Specificity (Q1, Q7).  
    2. Intervention (Q2).  
    3. Medium-dependence (Q4).  
    4. Level (Q6).  
    5. Role in mind (Q8; implicit in Strong AI addendum).  
    6. Eliminability (Q5: Instrumentalism = eliminable; others = not).  
  - Added **embodiment question (Q3)** to separate enactivist/dynamical rejections.  
  - **7 questions**, 11 leaves (8 occupied, 3 unoccupied).  

  This tree maps the logical space first, then locates doctrines. Use the extra question for nuanced discussions between connectionism and classical views.
