answer: |-
  Below is a decision tree for your functionalism reading group, built from logical space using cases to distinguish positions without relying on labels. The tree starts from the neutral functionalist commitment: *A mental state is defined by playing a certain causal role, and this role is played by a physical state of the organism*. The 8 branch questions are derived from your specified cases, and the leaves correspond to 8 key positions. I've flagged incoherent/empty paths and ambiguities.

  ---

  ### **Decision Tree: Which Multiple-Realizability Position Are You In?**  
  *Start from the functionalist commitment above.*

  1. **Martian Pain Case**:  
     A Martian experiences "pain" via a hydraulic mechanism (not neurons) that causes the same pain behaviors as human pain. Does the Martian genuinely feel pain?  
     - **Yes** (multiple realizability possible) → Go to Q2.  
     - **No** (only human-like biology suffices) → Go to Q7.  

  2. **Single-Neuron Swap Case**:  
     In you, one neuron is replaced by a silicon chip that performs the same *local* causal role. After the swap, does the chip-firing count as the *same token mental state* (e.g., the same instance of pain) as the original neuron-firing?  
     - **Yes** (token identity preserved) → Go to Q3.  
     - **No** (token identity broken) → **Leaf: Token Identity Theory** (mental states are identical to token physical states; multiple realizability is token-level only).  

  3. **Reverse Twin Case**:  
     You and a twin have an identical brain state, but due to different learning histories, it plays the role of *belief A* in you and *belief B* in your twin. Is this brain state the same mental state for both of you?  
     - **Yes** (mental state fixed by physical state) → **Leaf: Type Identity Theory** (mental states reduce to physical types; multiple realizability is rejected).  
     - **No** (mental state fixed by causal role) → Go to Q4.  

  4. **Dual-Role State Case**:  
     A creature has a single physical state that plays both the causal role of *pain* and the role of *a belief* (e.g., "something is wrong"). Is this one mental state or two?  
     - **One mental state** (tracks the physical realizer) → **Leaf: Realizer-Functionalism** (mental states are the physical states occupying roles; roles are "second-order").  
     - **Two mental states** (tracks distinct causal roles) → Go to Q5.  

  5. **Externalism Case**:  
     Two systems have identical internal organization but different environments (e.g., one has water, the other twin-water). Do they share the *same mental content* (e.g., "water beliefs")?  
     - **Yes** (narrow content) → Go to Q6.  
     - **No** (wide content) → **Leaf: Machine Functionalism / Psychofunctionalism** (mental states are computational/algorithmic roles; external factors partially define roles).  

  6. **Unreduced Role Case**:  
     For a mental state, no reduction to physical laws has been found, but nothing rules it out. Is a *future reduction* likely (even if only species-specific)?  
     - **Yes** (reduction is possible) → Go to Q8.  
     - **No** (reduction is impossible) → **Leaf: Analytic Functionalism** (mental roles are defined by folk psychology; irreducible to physical laws).  

  7. **Same-Stuff Wiring Case** (after Q1 "No"):  
     Two creatures are made of identical physical stuff (e.g., same atoms) but wired differently. Could they share a mental state (e.g., pain)?  
     - **Yes** (mental states supervene on causal roles) → *Empty path (incoherent)*. *Why?* Q1 rejected multiple realizability, but this accepts it.  
     - **No** (mental states require specific wiring) → **Leaf: Narrow Anti-Functionalism** (mental kinds are fine-grained physical states; folk psychology is too coarse).  

  8. **Levels of Realization Case** (after Q6 "Yes"):  
     Pain realizers differ at the *neuronal level* (e.g., biological vs. silicon) but are identical at the *fundamental physics level*. Is pain the same mental state across both?  
     - **Yes** (mental states multiply realizable) → **Leaf: Multiple Realizability as Epistemic/Practical** (reduction is possible in principle but hard in practice).  
     - **No** (realization level matters) → **Leaf: Local Reductionism** (mental states reduce to physical kinds *within domains*, e.g., human-pain = neural state X).  

  ---

  ### **Leaves & Positions**  
  1. **Token Identity Theory**: Token mental states = token physical states.  
  2. **Type Identity Theory**: Mental state types = physical state types (rejects multiple realizability).  
  3. **Realizer-Functionalism**: Mental states = physical states that *occupy* causal roles.  
  4. **Machine Functionalism/Psychofunctionalism**: Mental states = computational roles (often externalist).  
  5. **Analytic Functionalism**: Mental states = folk-psychological roles (internalist).  
  6. **Local Reductionism**: Mental states reduce to physical kinds *within specific domains* (e.g., species).  
  7. **Multiple Realizability as Epistemic/Practical**: Multiple realizability is a practical barrier to reduction, not metaphysical.  
  8. **Narrow Anti-Functionalism**: Mental kinds are defined narrowly by physical states, not functional roles (rejects folk psychology).  

  ### **Empty Paths & Incoherences**  
  - **Q2 → Q3 → "Yes"** (Type Identity): Incoherent after Q2 "No" (which rejects role-sensitivity). *Why?* Functionalist commitment requires mental states to depend on causal roles, but Type Identity (from Q3 "Yes") ignores roles in favor of physical states.  
  - **Q1 → Q7 → "Yes"**: Incoherent. *Why?* Q1 rejects multiple realizability, but Q7 "Yes" implicitly accepts it by allowing same-stuff systems to share mental states despite wiring differences.  

  ### **Ambiguities & Collapsed Distinctions**  
  - **Role- vs. Realizer-Functionalism**: These partially collapse in the tree. Realizer-functionalism is isolated at Q4 ("One mental state"). Role-functionalism isn't a leaf—it's distributed among Analytic/Machine Functionalism (Q5, Q6, Q8). *Why?* Role-functionalism (mental states = roles) is compatible with multiple leaves, but specifying *how roles are defined* (e.g., folk psychology vs. computational) pulls them apart. The tree distinguishes these via externalism (Q5) and reductionism (Q6).  
  - **Machine vs. Analytic Functionalism**: Cleanly separated by externalism (Q5) and reductionism (Q6). Machine functionalism incorporates externalist/computational roles; analytic functionalism is internalist and folk-based.  

  ### **Tree Structure Notes**  
  - **8 questions**, **8 leaves**. Cases used: Martian (Q1), neuron swap (Q2), reverse twin (Q3), dual-role state (Q4), externalism (Q5), unreduced role (Q6), same-stuff wiring (Q7), levels of realization (Q8).  
  - **Unused case**: "Nobody found reduction but nothing rules it out" is embedded in Q6.  
  - **Narrow anti-functionalism** is reachable only via Q1→Q7 "No", isolating it from functionalist paths.  
  - **Local reductionism** and **epistemic multiple realizability** are split by "levels of realization" (Q8), exposing their core disagreement.  

  This tree forces positions to "show their cards" through cases, avoiding labels. Use it to spark debate—e.g., "Why does accepting the Martian lead you to reject token identity?" or "Does realizer-functionalism implode if roles are finely specified?"
