prompt: |-
  I run a biweekly reading group at work for about a dozen ML engineers and quants -- all fluent in Bayes rule, calibration, proper scoring rules, the usual; none with any logic past knowing that undecidability is a thing. In a few weeks I've got 40 minutes and one whiteboard to get them to see why logical uncertainty is a genuinely different problem from ordinary empirical uncertainty, and what the logical induction setup is actually supposed to be doing about it. Don't explain the topic to me; I want a plan for the explanation.

  The part I always botch is the ordering. Every time I try, someone jumps in with "isn't this just uncertainty about whether your hardware or your own brain is reliable," and I get dragged into that before we've even established that classical Bayesian credences are deductively closed and so can't represent uncertainty about a theorem at all. So: what has to be true in their heads before the next thing can land, what order, and why that order rather than another.

  Give me the one example that carries the whole session. My instinct is a claim about a computation I could actually start running in front of them -- say, whether the 10^9th bit of the output of a specific ten-line program is a 1, where the program is deterministic, decidable in principle, and slow enough that nobodys reaching 10^9 during the hour -- plus a family of such claims indexed by n, so I have something to point at when I talk about learning to reason rather than just grinding. Say what such an example has to have, and say more about what it has to lack: I suspect it can't have any shortcut that settles it without running the thing, or the whole moral collapses into "do math faster," but you tell me. If you'd use something else entirely, argue for it.

  Then the misconception map, with the point in the sequence where each one gets defused rather than a list at the end. The ones I expect: "just put 0.5 on everything undecided and Bayes-update when you find a proof"; "the traders are hypotheses and the prices are model averaging"; "so it's a better theorem prover"; "it converges in the limit, so that's as good as knowing"; "probability 1 is certainty, so once there's a proof you're back to plain Bayesianism and nothing was lost." And there's one I never answer well: someone always says you should just be uncertain about your own future reasoning -- put a probability on "I'll end up believing X" -- and isn't that the same thing? Tell me whether that's a confusion to squash early or actually the property the whole thing is built to get, and where it belongs.

  Finally: one question at the end that shows me they got it rather than just learned the vocabulary, and one thing you'd openly refuse to justify at this level and say so out loud.
reasoning: |-
  We are designing a 40-minute session for a group of ML engineers and quants who are fluent in Bayesian reasoning but have minimal background in logic. The goal is to convey why logical uncertainty is distinct from empirical uncertainty and to introduce the logical induction framework in a way that highlights its unique approach.

  Key challenges:
  1. The audience may conflate logical uncertainty with empirical uncertainty (e.g., hardware reliability or human error).
  2. They might propose naive solutions (like assigning 0.5 to undecided statements and updating when a proof is found) without seeing the deeper issues.
  3. We must establish that classical Bayesianism requires deductive closure (so if a statement is provable, it must have probability 1) and hence cannot represent uncertainty about logical facts that are not yet proven.

  Plan Overview:

  1. **Start with a concrete example** that is clearly decidable but computationally infeasible to resolve during the session. This example must:
     - Be deterministic and decidable in principle.
     - Be slow enough that we cannot compute the answer in the session (so we face genuine logical uncertainty).
     - Not have any known shortcut (so that the only way to know is to run the computation, but we can't run it in time).
     - Be indexable by a parameter (like `n`) so we can discuss a sequence of similar problems and the idea of "learning to reason" across them.

     Example: Consider a simple program that computes the Collatz sequence for a starting number `n` and outputs the number of steps until it reaches 1. We then ask: "For n = 10^9, is the number of steps even?" 
     - The Collatz problem is deterministic and decidable, but we don't know the answer for n=10^9 without running the computation. Moreover, there is no known shortcut.

     However, note: The Collatz conjecture is unproven, so for some n the sequence might not terminate? But we are assuming it does (or we can use a different problem). To avoid the complication of an unproven conjecture, we can use a problem that is known to terminate, such as:

     Example Alternative: Consider a program that simulates a Turing machine for n steps and then outputs 1 if the machine halts within n steps, and 0 otherwise. But then we are tied to the halting problem? We want a problem that is decidable and for which we can compute small instances but not large ones.

     Better: Consider a program that computes the n-th digit of π (or some other irrational number that is computable but for which the n-th digit isn't precomputed for very large n). But note: there are efficient algorithms for π that can compute the n-th digit without computing all previous ones. So that might not be slow.

     Revised: Consider a program that computes the busy beaver numbers? But that is non-computable. We want computable.

     How about: We define a simple recursive function that is very slow, such as a deliberately inefficient computation of the Ackermann function for moderate inputs? But the Ackermann function grows very fast, so we can choose inputs that are too big to compute in practice.

     Example: Let f(n) = A(3, n) where A is the Ackermann function. Then ask: "Is the last digit of f(n) even?" for n = 20. We know that A(3,20) is an enormous number and cannot be computed in practice. But note: we might be able to compute the last digit without computing the whole number? Maybe not, because the Ackermann function's values are so huge that even the last digit might require computing the entire number? Actually, we can compute the last digit using modular arithmetic without computing the entire number? That would be a shortcut.

     We need a problem that is inherently sequential and has no known shortcut. One idea: consider a pseudorandom number generator (PRNG) with a fixed seed, and ask for the n-th bit. Without storing the entire sequence (which is infeasible for large n), we must compute all previous bits to get the n-th. But then we can run it for small n and show the pattern? And for large n (like 10^9) we cannot.

     Example: 
     - We define a linear congruential generator: x_{i+1} = (a * x_i + c) mod m, with known a, c, m, and seed x_0.
     - We want the 10^9-th bit of the sequence (say, the least significant bit of x_{10^9}).
     - This is deterministic and decidable, but to compute x_{10^9} we must compute all 10^9 steps? Actually, we can use modular exponentiation to compute in O(log(n)) time? That would be a shortcut.

     So we must avoid that. We need a problem that is known to be sequential (i.e., requires about n steps). How about a simple program that computes the n-th Fibonacci number modulo 2 (even or odd) using the naive recursive method? But then we can use fast doubling? So again, a shortcut.

     Alternatively, we can use a problem that is designed to be sequential, such as iterating a hash function n times. For example, start with a seed s_0, and let s_{i+1} = SHA256(s_i). Then ask for the least significant bit of s_n for n=10^9. 
     - We cannot compute s_n without computing s_1, s_2, ..., s_{n-1} because the hash function is designed to be non-invertible and without shortcuts.
     - This is deterministic and decidable, but for n=10^9 it is infeasible to compute during the session.

     We'll use this: 
     - Let H be a cryptographic hash function (like SHA256) and s_0 a fixed starting value (say, the string "hello").
     - Define s_{k} = H(s_{k-1}) for k=1,...,n.
     - Question: What is the least significant bit of s_n for n=10^9?

     We can compute s_1, s_2, s_3, ... in front of them for a few steps, but then point out that 10^9 is too many.

  2. **Order of Presentation**:

     Step 1: Pose the problem and establish that it is deterministic and decidable, but we don't know the answer because we haven't run the computation. We are uncertain about a logical fact (the bit is fixed by the rules of computation) but we don't know it.

     Step 2: Ask: How should we assign a probability to this bit being 1? 
     - They might say 0.5. Then ask: What if we have a family of such problems? For each n, we have the same question for s_n. Now, we can run the computation for small n. Suppose we do and we see that for the first 10, the bit is 1 every time? Then they might update to a higher probability for the next n. But note: each n is independent? Actually, no. The sequence is deterministic but the bits might be random-looking? 

     Step 3: We want to model uncertainty about the logical fact. But classical Bayesianism requires deductive closure: if a statement is provable, then it must have probability 1. But note: we haven't proved what the bit is. However, we can prove that the bit is either 0 or 1. So the probability must be either 0 or 1? But we don't know which. 

     Step 4: Here we introduce the key point: In classical Bayesianism, the probability is fixed to 0 or 1 by the logical facts, but we don't know which. So we are forced to put either 0 or 1? But that doesn't represent our uncertainty. Alternatively, if we treat it as an empirical uncertainty, then we might say we are uncertain about the output of the computation, but the computation is deterministic. 

     Step 5: The audience might suggest: We are uncertain about the hardware or our own ability to compute. But we want to abstract that away. We want to model the uncertainty that remains even if we assume the computer is perfect. We are uncertain because we haven't done the computation. 

     Step 6: We cannot assign 0.5 to every undecided statement because that leads to incoherence. Example: Consider the statement P and also consider a proof of P that we haven't found yet. If we assign 0.5 to P, but then we find a proof, we update to 1. However, what about the statement "there exists a proof of P of length at most L"? We might assign 0.5 to that too. But if we do that for all L, then we are vulnerable to Dutch books? 

     Step 7: We need a way to assign probabilities that are not deductively closed but that can learn from logical evidence (such as finding proofs) and that are coherent in the long run.

     Step 8: Introduce the logical induction framework at a high level: 
     - We want to assign probabilities to logical statements in a way that is not deductively closed at any finite time but that becomes increasingly consistent and accurate over time as we do more computation (or as our theorem prover finds more proofs).
     - The framework uses a market metaphor: there are traders who can buy and sell shares of logical statements at the current prices (probabilities). These traders are like algorithms that look for inconsistencies (like a Dutch book) and bet against them. 
     - The logical inductor sets prices so that no trader can exploit it indefinitely.

     Step 9: Emphasize that the logical inductor does not require that we know the entire proof at once. We can have partial evidence: for example, we might have run the computation for 1000 steps and seen a pattern, so we assign a high probability that the 10^9-th step will have a certain bit. But we haven't proved it.

     Step 10: Contrast with the naive approach of assigning 0.5 and updating when we get a proof: 
     - The logical inductor can assign non-extreme probabilities to statements that are not yet decided, and it can also update on logical evidence that falls short of a full proof (like a partial computation or a heuristic argument).

  3. **Misconception Map**:

     - "Isn't this just uncertainty about hardware or brain reliability?" 
       - Defuse early: At the very beginning, when introducing the example. State that we are assuming perfect hardware and perfect reasoning, but we are limited by time. We are uncertain because we haven't done the work. We want to model that uncertainty.

     - "Just put 0.5 on everything undecided and Bayes-update when you find a proof"
       - Address after posing the problem and after establishing deductive closure. Point out that this approach is vulnerable to Dutch books because it doesn't account for the structure of logical evidence. For example, if we have a sequence of statements that are equivalent to the same fact, we might assign 0.5 to each and then update one by one, but a trader could buy all of them and make a profit when one is proven. Also, we might have partial evidence (like having computed for n=1000) that should change our probability for n=10^9, but the naive approach doesn't incorporate that until we have a full proof.

     - "The traders are hypotheses and the prices are model averaging"
       - This is a later misconception. After introducing the market, clarify that the traders are not hypotheses but rather algorithms that look for inconsistencies in the current prices. The prices are set by the logical inductor to avoid being exploited by any trader. It's not model averaging; it's a mechanism to enforce coherence over time.

     - "So it's a better theorem prover"
       - Clarify: The logical inductor is not a theorem prover. It uses a theorem prover (or a computation process) as an input stream. It assigns probabilities based on the proofs and computations that have been done so far, and it does so in a way that is coherent and learns from the patterns in the logical evidence.

     - "It converges in the limit, so that's as good as knowing"
       - Address at the end: While it converges in the limit, the point is that at finite times it assigns non-dogmatic probabilities that reflect the current state of knowledge. This is important for decision-making when we cannot wait until the limit.

     - "Probability 1 is certainty, so once there's a proof you're back to plain Bayesianism and nothing was lost."
       - This is true, but the point is that before the proof, we are not forced to assign 0 or 1. The logical inductor will assign probability 1 only when there is a proof (or when it has been forced by the market to do so because of arbitrage). So it does become deductively closed in the limit, but not at finite times.

     - The key misconception: "You should just be uncertain about your own future reasoning -- put a probability on 'I'll end up believing X' -- and isn't that the same thing?"
       - This is actually a deep point and is related to the reflective consistency of the logical inductor. We can say: The logical inductor does assign probabilities to its own future beliefs (and to the outputs of its future computations). This is one of its key properties (reflection). So yes, that is built in. But note: logical induction is a way to do that coherently across time and across logical facts. It's not just about one's own future beliefs; it's about assigning probabilities to all logical statements in a way that is coherent and that learns from patterns. So we embrace this point but show that it is part of a larger framework.

  4. **One Question at the End to Check Understanding**:

     - "Suppose we have a logical inductor that has been running for a while. Now we present it with a new statement: the n-th digit of the hash iteration chain we described, for some very large n. How would the logical inductor assign a probability to this bit being 1? What kind of evidence would it use that the naive Bayesian approach (with deductive closure) cannot?"

     We want to hear:
     - The logical inductor might look at the pattern of bits for smaller n (if they have been computed) and assign a probability based on that (like if 70% of the bits for n up to 1000 were 1, then assign 0.7). 
     - It might also use other heuristics, like the output of a machine learning model trained on previous bits.
     - The naive Bayesian approach would have to assign 0 or 1 (if we require deductive closure) or if we don't, then it might assign 0.5 and not update until we have a full computation for that n.

  5. **One Thing to Refuse to Justify**:

     - We will not go into the details of the construction of the logical inductor (like the exact algorithm or the complexity of the traders) because that is highly technical and not necessary for the high-level understanding. We will present it as a framework that exists and has desirable properties, but we won't prove those properties.

  Session Outline:

  0. (2 min) Introduction: We model empirical uncertainty with probability, but what about logical uncertainty? Example: the hash chain bit.

  1. (5 min) Pose the example and compute the first few steps. Show that for n=10^9 we cannot compute it. Ask: What probability should we assign to the bit being 1? 
     - Address the hardware/reliability issue: "Assume perfect computer and perfect reasoning. We just haven't done the work. How do we model that uncertainty?"

  2. (5 min) Classical Bayesianism and deductive closure: 
     - We know the bit is either 0 or 1. So the probability must be 0 or 1? But we don't know which. 
     - Alternatively, if we treat it as an empirical fact, then we are missing the point: the fact is determined by the rules.

  3. (8 min) Problems with the naive approach (assign 0.5 and update when proven):
     - We have a sequence: for each n, we have a bit b_n. We compute for n=1,2,...,1000 and see they are all 1. Then for n=10^9, we would assign 0.5? That seems wrong. We should assign near 1. But we don't have a proof that b_{10^9}=1. 
     - Also, consider a statement that is equivalent to the Riemann hypothesis. We assign 0.5. Then we get a proof of a lemma that is a step toward the proof. The naive approach doesn't update until the full proof.

  4. (5 min) Introduce the logical induction idea: 
     - We want a probability assignment that can learn from patterns and partial evidence.
     - We set up a market: prices (probabilities) for logical statements. Traders can buy and sell. The logical inductor adjusts prices to avoid being exploited.

  5. (5 min) How it works for the example:
     - The logical inductor might see the pattern in the first 1000 bits and assign a high probability to b_{10^9}=1.
     - It can update as we compute more bits (even if we don't compute the exact one) and also if we find a mathematical pattern.

  6. (5 min) Key properties:
     - It converges to the truth in the limit (if the statement is decidable, then eventually we compute it and the probability goes to 0 or 1).
     - But at finite times, it can have non-extreme probabilities that reflect the current evidence.

  7. (5 min) Address the misconception about uncertainty in future reasoning:
     - "Isn't this just putting a probability on what we'll believe in the future?" 
     - Answer: Yes, and the logical inductor does that. It has a property called reflection: it believes that its future beliefs will be more accurate, so it sets prices accordingly. That is a part of the framework, but it's more than that: it assigns probabilities to all logical statements in a coherent way.

  8. (5 min) Wrap up and check understanding with the question above.

  Total: 40 minutes.

  The example must lack any known shortcut so that we cannot settle it without running the entire chain of computations (or without an infeasible amount of work). The hash chain example with a cryptographic hash function is designed to be sequential. We must note that we are assuming the hash function is a black box without shortcuts.

