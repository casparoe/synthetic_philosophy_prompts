prompt: |-
  I write a column on science and ideas, and over the past few years I have sat through more panels, hearings, and documentary screenings about "alternative" history than I expected to when I took the job. I keep encountering the same maneuver, and I have never found a word for it. I would be grateful for your help.

  The maneuver runs like this. A fringe account of the past opens by applying an unusually aggressive standard of evidence to the mainstream account — not to the mainstream's specific claims, but to the machinery that produced them. We only have copies of copies; scribes interpolated; radiocarbon dates have to be run through calibration curves; stratigraphy assumes the layers were never disturbed; the king-lists and chronologies were compiled by people with an interest in a tidy story. Every one of those points, taken alone, is something a working historian or archaeologist will concede without much fuss. Then — and this is the part I cannot name — having used that standard to clear the ground, the same speaker builds a positive replacement out of the very materials the standard has just discredited: the same late copies, the same king-lists, the same excavation reports, now treated as solid enough to underwrite a wholesale revision of the timeline.

  Two instances, so the shape is clear. At a conference on revised chronologies, a speaker spent forty minutes arguing that the transmitted manuscripts behind our standard periodization are too corrupt, too late, and too ideologically edited to support any confident dating — then spent the next thirty reconstructing a compressed timeline from those same transmitted manuscripts, treating their internal numerology as a trustworthy record. At a screening I was asked to comment on, a presenter argued that the customary dating of a set of megalithic sites is guesswork, because our sources for them are late medieval compilations and local folklore, and folklore proves nothing; twenty minutes later he read that folklore and those compilations as a reliable memory of astronomical knowledge inherited from a vanished high civilization.

  I have been calling this "credibility laundering" in my notes, but I would rather print a term a reader can look up, and I suspect my version is imprecise. So here is what I am actually after.

  Does this maneuver have an established name in epistemology, argumentation theory, or the literature on demarcation? If the fit with the established concept is imperfect — I expect it is — please tell me which candidate comes closest, where exactly the thing I described comes apart from it, and whether one of them should be stretched to cover it or whether it deserves its own term.

  Candidates that have occurred to me, none of which seems quite right: "selective skepticism" and the related notion of "pseudoskepticism," which as far as I can tell name a stance rather than a move within a single argument; the old trilemma about justification, where any support for a claim either asserts itself, circles back on itself, or regresses without end, which my speakers deploy against the mainstream but never against themselves; and the distinction between attacking a claim and attacking the source of a claim's support, which seems nearer the mark but is too broad, since a methodologist may legitimately impugn a method without owing anyone a rival reconstruction.

  The carvings I most want: Is the essential feature the asymmetry, or is it the reuse of the discredited pipeline as data, or is it something about which direction the standard is allowed to travel? Does it matter that the aggressive standard is aimed at a field's procedures rather than at a person's credibility, or is that incidental? And where is the boundary — what separates my speakers from a legitimate skeptic who says in effect that our methods are too weak here, so we should withhold judgment on all sides, and from a mundane case of a researcher who simply holds her own favorite sources to a gentler standard than she holds everyone else's, the way we all do?

  If no established concept fits, coin one, define it, and give me two or three boundary cases: one that clearly falls under it, one that clearly does not, and one that could be argued either way. Please write in American English, and keep it accessible to a general reader without turning it into a list of slogans.

  Finally, since I need something I can paste into a style sheet: end your reply, on the very last line and as the only thing on it, with \answer{...} enclosing the single best label — the established term if there is one, or your coined term if there is not — as a short phrase of no more than five words.
reasoning: |-
  Okay, the user is a science columnist who's encountered a recurring argumentative maneuver in "alternative" history circles. They describe a two-step pattern: first applying hyper-skepticism to mainstream historical methods (questioning manuscripts, dating techniques, etc.), then using those same discredited sources to build a revisionist narrative. 

  Hmm, they've already considered terms like "selective skepticism" but find them inadequate because this is a specific rhetorical sequence within a single argument, not just general bias. The core problem seems to be the asymmetrical treatment of evidence - what's poison for the mainstream becomes medicine for the alternative claim.

  Let me mentally scan epistemology and critical thinking concepts. "Special pleading" comes close but is too broad - it covers any uneven standard application without specifying this source-reuse element. "Ad hoc rescue" describes protecting a theory from counterevidence, which isn't quite this. The user's "credibility laundering" metaphor is actually sharp, but they want something established or precisely defined.

  *checks academic databases mentally* No, there isn't a standard term for this exact move. Interesting that the user identified the trilemma of justification too - the speakers exploit the regression problem against mainstream history but ignore it for their own claims. That hypocrisy is key.

  The boundary cases they request are crucial. A legitimate skeptic withholding judgment (clear non-example) vs. a researcher with ordinary source bias (gray area) helps define the territory. The coined term should emphasize both the asymmetry and the pipeline reuse - maybe "evidentiary arbitrage"? Or "source-poisoning revival"? 

  Wait, "arbitrage" might be too jargony for general readers. "Pipeline repurposing" captures the mechanics but misses the unfairness. After testing phrases, "asymmetric source laundering" seems best: "asymmetric" for the double standard, "source" for the evidence pipeline, "laundering" for cleansing tainted materials. It extends their own metaphor while adding precision.

  For the style sheet requirement, I'll put \answer{asymmetric source laundering} alone on the last line. The surrounding explanation will clarify it's a coined term, define it with their examples, and situate it among near-miss concepts like special pleading. The user gets both a usable label and the conceptual toolkit to defend it.
answer: |-
  Based on your detailed description and the criteria you've outlined, this maneuver lacks a single, universally established term within epistemology, argumentation theory, or demarcation literature that perfectly captures its *specific structure*. While related concepts exist, they don't fully encompass the sequence of hyper-skepticism towards the *methodological pipeline* followed by uncritical acceptance of the *output* of that same pipeline for a counter-narrative.

  Here's the analysis and the proposed solution:

  1.  **Established Concepts & Why They Don't Quite Fit:**
      *   **Special Pleading:** Comes closest. It describes applying standards, rules, or principles differently to different cases without adequate justification. This captures the *asymmetry* in standards applied to mainstream vs. alternative interpretations *using the same sources*. However, it doesn't inherently emphasize the *specific sequence* of first discrediting the pipeline via hyper-skepticism and *then* rehabilitating its output, nor does it explicitly focus on the *source pipeline* itself being both attacked and then reused. It's a broader category into which your maneuver fits as a specific subtype.
      *   **Selective Skepticism / Pseudoskepticism:** Correctly identifies the uneven application of doubt, but these describe an overall *stance* rather than the specific *tactic* or *argumentative move* within a presentation. They don't highlight the reuse of the discredited materials.
      *   **Ad Hoc Hypothesis/Rescue:** Focuses on modifying a theory to evade counter-evidence. Your described maneuver is more about *building* a theory by first tearing down the established evidentiary foundation and then scavenging the rubble for new building blocks, often without modifying the *core* alternative claim itself.
      *   **Appeal to Ignorance (Argumentum ad Ignorantiam):** Claims something is true because it hasn't been proven false (or vice versa). While the hyper-skepticism creates an *impression* of ignorance about the mainstream account, the maneuver goes beyond this by actively constructing a *positive* alternative using the sources declared unreliable.
      *   **Poisoning the Well:** Involves discrediting a source *in advance* so any argument from it is dismissed. This is related to the first step, but the maneuver doesn't stop there; it paradoxically *drinks from the same well* it poisoned to build its own case.
      *   **Münchhausen Trilemma / Agrippa's Trilemma:** You rightly note that the speakers deploy this *against* the mainstream (highlighting infinite regress/circularity in justification) but conveniently ignore it for their *own* reconstruction using the same sources. The maneuver exploits the trilemma asymmetrically but isn't defined *by* the trilemma itself.

  2.  **The Core Features:**
      The essential features are:
      *   **Asymmetry of Scrutiny:** Applying an extreme, often impossibly high, standard of evidence to discredit the mainstream *methodological pipeline* (copies, dating methods, compilation motives, stratigraphic assumptions).
      *   **Source Pipeline Repurposing:** Using the *output* of that very same discredited pipeline (the copies, the king-lists, the folklore, the excavation reports interpreted conventionally) as *reliable primary data* to construct the alternative narrative, without subjecting *this* use to the same extreme standard. The pipeline is declared broken for mainstream conclusions but suddenly functional for alternative ones.
      *   **Directionality:** The hyper-skepticism flows *only* towards the mainstream reconstruction. The standard relaxes dramatically when applied to the alternative use of the same materials. The *source* is attacked to undermine the mainstream *conclusion*, then the *source* (or its specific interpretation) is rehabilitated to support the alternative *conclusion*.
      *   **Target Matters:** Attacking the *field's procedures* (radiocarbon calibration, stratigraphic principles, textual criticism methods) rather than just an individual's credibility is crucial. It creates a veneer of methodological critique before engaging in uncritical acceptance of the sources processed by those methods.

  3.  **Boundaries:**
      *   **Clearly Falls Under:** Your two examples perfectly illustrate it: hyper-skepticism on manuscripts/compilations/dating methods --> uncritical acceptance of numerology/folklore from those same sources for a new timeline/civilization.
      *   **Clearly Does NOT Fall Under:** A legitimate skeptic analyzing a *specific, contested claim* (e.g., the authenticity of a single document like the Donation of Constantine). They apply high skepticism to *all* sides, conclude the evidence is insufficient or points to forgery, and *refrain* from building a detailed positive alternative history *based on that same dubious document*. ("We can't trust this document for X, therefore we also can't use it to prove Y.")
      *   **Gray Area / Could Be Argued:**
          *   A historian who generally trusts chronicles but is hyper-critical of archaeological dating *methods* for a specific site period, then uses *those same chronicles* (which mention the site) to propose a revised date, while *also* acknowledging the chronicles' limitations and seeking corroboration. The key differences: a) The skepticism might be specific and argued, not blanket dismissal of all methodology. b) The chronicles aren't declared *utterly unreliable* as sources *before* being used; their limitations are weighed alongside their potential value. c) Corroboration is sought. This leans towards ordinary scholarly debate with potential bias, not the core maneuver.
          *   A researcher proposing a new theory who initially overstates the weaknesses of *competing theories* and understates weaknesses in their *own favored evidence*, but who doesn't specifically *discredit the entire pipeline* supplying the evidence they then rely on. This is closer to simple bias or special pleading broadly, missing the specific pipeline attack/repurpose sequence.

  4.  **The Coined Term: Asymmetric Source Laundering**
      *   **Definition:** An argumentative maneuver where an extreme standard of evidence is applied to discredit the methodological pipeline (e.g., transmission, dating techniques, compilation motives) supporting a mainstream historical account, creating an appearance of unreliability or ignorance, and then, exploiting this vacuum, the *output* of that same pipeline is uncritically adopted and repurposed as reliable primary data to construct a specific alternative historical narrative, without subjecting *this* use to the previously applied stringent standard.
      *   **Why it fits:**
          *   **Asymmetric:** Highlights the uneven application of standards.
          *   **Source:** Focuses on the evidence pipeline (manuscripts, methods, compilations).
          *   **Laundering:** Evokes the process of taking something declared "dirty" (unreliable due to pipeline flaws) and "cleaning" it for reuse in a new context (the alternative narrative), bypassing the initial critique. This extends your apt "credibility laundering" metaphor while making it more precise about the *source material* and the *asymmetry*.
          *   It captures the sequence and the core hypocrisy: the pipeline is only "dirty" when it feeds the mainstream conclusion; it becomes mysteriously "clean" when feeding the alternative one.
          *   It's descriptive enough for a general reader while being specific to the phenomenon you've meticulously detailed.

  **Therefore, for your style sheet:**

  \answer{asymmetric source laundering}
