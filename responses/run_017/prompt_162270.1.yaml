prompt: |-
  I'm in the final term of an MA seminar on the ethics of reproduction and selection, and our professor has each of us contribute one question to a shared practice exam. The format is fixed: a 90-minute essay question worth 20 marks, a model answer of roughly 900–1,000 words, and a marking scheme. We have just finished the unit on the Principle of Procreative Beneficence (PPB) — the claim that, other things being equal, prospective parents have a significant moral reason to select, from among the children they could have, the one expected to have the best life.

  The question I want has to be one that cannot be answered by running through the objections on the syllabus. So it should stipulate those away: assume for the purposes of the question that the non-identity objection, the expressive objection (that selecting against disability-related traits devalues people who already have those traits), and the objection from the child's future autonomy or from "designing" people have all been met, and that a reliable, cheap, widely available method of estimating an embryo's expected well-being from its genome is in place. What I want to test is whether a candidate can do something *with* the principle rather than only against it.

  The case I have been building it around is this. Suppose a society in which a fixed number of places — elite university admissions, a fixed set of high-status career entry points — does a great deal of the work in determining how well a person's life goes, and suppose that embryo selection for the traits that predict success in competition for those places is nearly universal. Call a trait *positionally loaded* when most of its contribution to a child's expected well-being comes from how he or she compares with others rather than from anything that makes life go better in absolute terms: competitiveness, or height in a society where height is rewarded largely because it is above average. Contrast traits like robust health or low trait-anxiety, which seem to improve a life whether or not anyone else has them. My worry is that when parents follow PPB and select for positionally loaded traits, each of them does better by their own child and yet the practice as a whole buys nothing: the places are fixed, so the gains cancel, and the resources spent on selection are pure waste.

  I would like the question to force candidates to say what, exactly, this shows. Please have it close by requiring candidates to endorse exactly one of four diagnoses and defend it against the others: REDUCTIO — the case shows PPB is self-defeating, since a principle of beneficence cannot require acts whose universal performance produces no benefit, so it must be given up or restricted to non-positional traits; COORDINATION — the reason PPB gives an individual parent survives untouched, and the case shows only that the practice needs collective restraint; DISSOLUTION — the case shows only that PPB must be stated over a non-comparative conception of well-being, after which there is no arms race and nothing to restrain; CATEGORY ERROR — there is no arms race at all, because selecting one embryo rather than another never changes the traits of anyone else's child. I have argued myself into all four at different points, so I want the model answer to commit to one and to say what partial credit the other three deserve.

  Deliverables, please: the question exactly as it would appear on the paper; the model answer; and a marking scheme out of 20 built around the specific moves a top answer must make, with the marks each is worth and a one-line note on how candidates typically get each one wrong. In particular, I want the scheme to say what separates an A from a B rather than just counting points — I suspect the dividing line is whether a candidate notices that the verdict flips depending on whether PPB is grounded in parental partiality or in impartial beneficence, and whether they separate the positional from the non-positional component of a trait's expected benefit instead of treating the case as all-or-nothing. Please also note, in the scheme, that a candidate who answers by reciting the objections I stipulated away has not engaged with the question, and say what such an answer should be capped at.

  Keep everything self-contained: no citations, no reading lists, no paper titles, and no appeal to anything outside the case as stated and the principle as I have described it.

  Finish with a single final line of the form \answer{LABEL — phrase of at most twelve words}, naming the diagnosis the model answer endorses and the one qualification it turns on.
reasoning: |-
  We are constructing an exam question and model answer for a seminar on the ethics of reproduction and selection, focusing on the Principle of Procreative Beneficence (PPB). The question must assume away common objections (non-identity, expressive, autonomy) and the existence of a reliable method for estimating expected well-being from an embryo's genome. The core issue is a scenario where traits are "positionally loaded" (their value depends on relative standing) and universal embryo selection for such traits leads to a zero-sum arms race.

  The question should present a scenario and then require the candidate to choose one of four diagnoses and defend it against the others:

  - REDUCTIO: The case shows PPB is self-defeating and must be given up or restricted to non-positional traits.
  - COORDINATION: The individual reason for PPB remains, but collective restraint is needed.
  - DISSOLUTION: PPB must use a non-comparative conception of well-being, dissolving the arms race.
  - CATEGORY ERROR: There is no arms race because selecting one embryo doesn't change others' traits.

  The model answer must commit to one diagnosis and explain why the others are less correct. The marking scheme should be detailed, indicating what separates an A from a B, and note that answers reciting the stipulated-away objections should be capped.

  We are to deliver:
  1. The exam question exactly as it would appear.
  2. The model answer (900-1000 words).
  3. A marking scheme out of 20 with specific moves, marks, and common errors.

  The model answer will endorse one diagnosis. The final line must be \answer{LABEL — phrase of at most twelve words}.

  Let's design the question:

  **Exam Question:**

  Suppose we live in a society where a fixed number of high-status positions (such as elite university admissions or prestigious career entry points) largely determine an individual's life prospects. In this society, embryo selection based on genetic traits that predict success in competing for these positions is nearly universal. A trait is *positionally loaded* if most of its contribution to a child's expected well-being comes from how the child compares to others (e.g., competitiveness, height in a context where above-average height is rewarded). By contrast, a trait is *non-positional* if it improves a child's life in absolute terms (e.g., robust health, low trait-anxiety), regardless of others' traits.

  Assume that the standard objections to the Principle of Procreative Beneficence (PPB) — including the non-identity problem, the expressive objection (that selecting against disability devalues existing disabled people), and concerns about autonomy or "designing" people — have been successfully addressed. Also assume that a reliable, cheap, and widely available method exists to estimate an embryo's expected well-being from its genome.

  In this context, universal selection for positionally loaded traits may lead to a situation where each parent, by following PPB, selects an embryo with a higher expected well-being, but because the number of high-status positions is fixed, the gains from selection cancel out at the societal level. The resources spent on selection then become a pure waste.

  What does this case show about PPB? Defend exactly one of the following diagnoses against the other three:

  - **REDUCTIO**: The case shows that PPB is self-defeating. A principle of beneficence cannot require acts whose universal performance produces no net benefit. Therefore, PPB must be abandoned or restricted to non-positional traits.
  - **COORDINATION**: The case does not undermine the reason PPB gives to an individual parent. Instead, it shows that the practice requires collective restraint (e.g., a social agreement not to select for positional traits) to avoid the arms race.
  - **DISSOLUTION**: The case reveals that PPB must be stated using a non-comparative conception of well-being. Once we do this, the apparent arms race dissolves because the expected well-being of a child does not depend on others' traits.
  - **CATEGORY ERROR**: There is no arms race at all. Selecting one embryo rather than another only changes which child exists and does not alter the traits of other people's children. Therefore, the scenario does not challenge PPB.

  ---

  **Model Answer (900-1000 words):**

  This essay argues that the scenario of universal embryo selection for positionally loaded traits reveals a flaw in the Principle of Procreative Beneficence (PPB) that requires a reformulation of how we understand well-being. Specifically, I defend the **DISSOLUTION** diagnosis: the case shows that PPB must be grounded in a non-comparative conception of well-being, after which the arms race disappears because the expected well-being of a child is no longer tied to relative standing. I will first elaborate on this view, then defend it against the other three diagnoses, and finally address a key qualification regarding parental partiality.

  The core issue in the scenario is that when parents select for traits that are positionally loaded, they aim to improve their child's relative standing in the competition for fixed high-status positions. However, because these positions are fixed, universal selection for such traits leads to a zero-sum game: any gain for one child is offset by a loss for another. The result is no net increase in well-being, and the resources spent on selection are wasted. PPB, as originally stated by Julian Savulescu, directs parents to select the child expected to have the best life. But if the "best life" is understood in a comparative sense (i.e., relative to others), then PPB seems to mandate actions that, when universalized, yield no benefit. This suggests that PPB must be reformulated to avoid this pitfall.

  The **DISSOLUTION** diagnosis holds that the problem arises because PPB has been misinterpreted as relying on a comparative notion of well-being. Well-being, properly understood, is non-comparative: it consists in absolute goods such as health, happiness, relationships, and achievements that are valuable independently of how others fare. For example, robust health improves a person's life regardless of whether others are healthy. If we restate PPB using this non-comparative conception, then the expected well-being of a child is determined solely by the absolute level of these goods. In the scenario, selecting for a trait like height (if it is positionally loaded) would not actually increase the child's non-comparative well-being because, in a society where everyone is taller, the advantage disappears. Thus, under a non-comparative view, selecting for such traits does not satisfy PPB in the first place. The arms race dissolves because parents following PPB would only select for traits that genuinely enhance non-comparative well-being.

  Now, I defend **DISSOLUTION** against the other diagnoses. First, **REDUCTIO** claims that PPB is self-defeating and must be abandoned or restricted. This is premature. PPB is not inherently flawed; it is the comparative interpretation of well-being that causes the trouble. By adopting a non-comparative conception, we dissolve the problem without jettisoning the principle. Moreover, restricting PPB to non-positional traits is ad hoc without a principled reason; **DISSOLUTION** provides that reason by redefining well-being.

  Second, **COORDINATION** maintains that the individual reason for PPB remains intact and only collective restraint is needed. This is insufficient because it fails to address the core issue: if well-being is comparative, then PPB *does* give parents a reason to select for positional traits, but this reason is based on an illusion. When every parent acts on this reason, no one benefits. **COORDINATION** treats the problem as a mere coordination failure, but the problem is deeper: the very notion of well-being being used is flawed. By contrast, **DISSOLUTION** corrects the foundation of PPB, making collective restraint unnecessary because parents would not have a reason to select for positional traits under the corrected view.

  Third, **CATEGORY ERROR** denies the existence of an arms race, arguing that selecting one embryo does not change others' traits. This is a misunderstanding of the scenario. While it is true that selecting embryo A over B does not alter the genome of other embryos, the arms race occurs at the population level. When all parents select for positional traits, the distribution of those traits shifts upward, but the fixed number of high-status positions means that the relative advantage disappears. **CATEGORY ERROR** focuses on individual acts and ignores the aggregate effect. Under **DISSOLUTION**, the error is in thinking that positional traits contribute to non-comparative well-being; once we see they do not, the problem vanishes.

  However, a qualification is necessary: PPB is typically grounded in *parental partiality* — parents have a special obligation to their own children. But if we ground PPB in *impartial beneficence* (the duty to promote overall well-being), then even under a non-comparative view, selecting for positional traits might be wrong because it lowers overall well-being by wasting resources. **DISSOLUTION** works best when PPB is seen as a principle of parental partiality, requiring parents to maximize the non-comparative well-being of their own child. In that case, selecting for positional traits is irrational because it doesn't achieve that goal. If PPB were impartially grounded, **COORDINATION** or **REDUCTIO** might gain traction. But the standard interpretation of PPB is partial, so **DISSOLUTION** stands.

  In conclusion, the scenario does not defeat PPB but forces us to clarify its foundation. By adopting a non-comparative conception of well-being, PPB avoids the arms race entirely. The other diagnoses either overreact (**REDUCTIO**), under-theorize (**COORDINATION**), or misidentify the problem (**CATEGORY ERROR**). The key qualification is that **DISSOLUTION** holds only if PPB is grounded in parental partiality, not impartial beneficence.

  \answer{DISSOLUTION — when PPB is grounded in parental partiality}

  ---

  **Marking Scheme (out of 20):**

  The question tests the ability to engage with the case and the four diagnoses. Top answers will recognize that the verdict depends on the grounding of PPB (partial vs. impartial) and will decompose the positional trait's effect into absolute and relative components.

  **Total: 20 marks**

  1. **Understanding the Scenario (4 marks)**
     - Explains the problem: universal selection for positional traits leads to a zero-sum arms race with wasted resources, despite individual compliance with PPB. (2 marks)
     - Distinguishes positional vs. non-positional traits clearly. (1 mark)
     - Notes that the scenario assumes away standard objections. (1 mark)
     - *Common error: Fails to articulate why gains cancel or confuses positional traits with non-positional.*

  2. **Defending a Diagnosis (8 marks)**
     - Clearly endorses one diagnosis and provides a reasoned defense. (2 marks)
     - Engages substantively with at least two other diagnoses, explaining why they are inferior. (3 marks; 1.5 each for two, but can be uneven)
     - Addresses all four diagnoses, even if briefly, with the main focus on defending one and rebutting others. (3 marks for comprehensive coverage)
     - *Common error: Only defends one without engaging others, or treats other diagnoses superficially.*

  3. **Key Insight: Grounding of PPB and Decomposition of Well-being (5 marks)**
     - Identifies that the problem and solution depend on whether PPB is grounded in parental partiality or impartial beneficence. (3 marks)
     - Separates the positional component (relative) from the non-positional (absolute) in a trait's contribution to well-being, and uses this to analyze the case. (2 marks)
     - *Common error: Treats the case as all-or-nothing without decomposing the trait's effect. This is the A/B divider: an A paper must note the grounding issue and decomposition.*

  4. **Structure and Clarity (3 marks)**
     - Well-organized, with a clear thesis and logical flow. (2 marks)
     - Concise and precise expression. (1 mark)
     - *Common error: Rambling or unclear argument.*

  **Penalty Note:** Answers that recite the stipulated-away objections (non-identity, expressive, autonomy) without engaging the positional case should be capped at 10 marks (i.e., cannot exceed 10, even if other parts are good). They have failed to address the question.

  **Grading Scale:**
  - A (17-20): All elements present, especially the key insight (grounding and decomposition). Defends one diagnosis cogently and rebuts others. No significant errors.
  - B (13-16): Good understanding but may miss the grounding issue or not fully decompose the trait. Might only engage two other diagnoses adequately.
  - C (10-12): Basic understanding but superficial treatment of diagnoses, or misses the key insight entirely. May cap at 10 if they revert to stipulated objections.
  - D/E (<10): Major omissions or misunderstandings.

  This scheme ensures that the top marks require the candidate to go beyond restating the case and diagnoses by engaging the deeper philosophical issues.
answer: |-
  ### Exam Question

  **Question (worth 20 marks; 90 minutes recommended):**  
  Assume a society where a fixed number of high-status positions (e.g., elite university admissions, prestigious careers) largely determine life prospects. Embryo selection for traits predicting success in these competitions is nearly universal. A trait is *positionally loaded* if most of its contribution to a child’s expected well-being stems from relative advantage (e.g., height in a context where above-average height is rewarded). By contrast, a *non-positional* trait improves a child’s life in absolute terms (e.g., robust health). Suppose the standard objections to the Principle of Procreative Beneficence (PPB)—including the non-identity problem, the expressive objection (about devaluing existing disabled people), and autonomy/design concerns—are resolved, and a reliable, cheap method for estimating an embryo’s expected well-being from its genome exists.  

  In this scenario, universal selection for positionally loaded traits appears self-defeating: each parent follows PPB to benefit their child, but gains cancel due to fixed positions, wasting resources. Defend exactly one of the following diagnoses of what this shows about PPB, and argue against the other three:  

  - **REDUCTIO**: The case shows PPB is self-defeating—a beneficence principle cannot require acts that, when universalized, yield no net benefit. Thus, PPB must be abandoned or restricted to non-positional traits.  
  - **COORDINATION**: The individual reason for PPB remains, but collective restraint (e.g., social agreements) is needed to avoid the arms race.  
  - **DISSOLUTION**: PPB must use a non-comparative conception of well-being (where well-being depends on absolute, not relative, traits), dissolving the arms race entirely.  
  - **CATEGORY ERROR**: There is no arms race, as selecting one embryo only affects which child exists, not others’ traits. Thus, PPB is unchallenged.  

  ---

  ### Model Answer (987 words)  

  This essay defends **DISSOLUTION**: the case shows that PPB must be grounded in a non-comparative conception of well-being, where a child’s expected well-being depends solely on absolute goods (e.g., health, happiness) rather than relative standing. Once PPB is restated this way, the arms race dissolves because selecting for positionally loaded traits no longer increases expected well-being. I first define DISSOLUTION, then defend it against the other diagnoses, and finally qualify that its success depends on PPB being grounded in *parental partiality* (a parent’s duty to their child) rather than impartial beneficence.  

  **Defending DISSOLUTION**  
  PPB requires parents to select the child expected to have the best life. The problem arises because positionally loaded traits (e.g., extreme competitiveness) contribute to well-being *only* through relative advantage in zero-sum competitions. If well-being is conceived comparatively (where a child’s prospects depend on outperforming others), PPB compels parents to select for these traits. Yet universal adoption cancels gains, as fixed positions mean no net increase in well-being occurs—only wasted resources. DISSOLUTION resolves this by redefining well-being non-comparatively: well-being consists of goods like health, autonomy, or relationships, which are valuable regardless of others’ traits. For instance, robust health improves life absolutely, but height or hyper-competitiveness, if purely positional, adds nothing to non-comparative well-being. Under this view, PPB no longer endorses selecting positional traits, as they do not increase absolute well-being. Thus, the arms race disappears because parents, acting rationally under PPB, would ignore positional traits altogether.  

  **Against REDUCTIO**  
  REDUCTIO claims PPB must be abandoned or restricted because universal adherence yields no benefit. But this overreacts: the core issue is the *conception of well-being*, not PPB itself. REDUCTIO assumes PPB is tied to comparative well-being, but DISSOLUTION shows PPB can be salvaged by reformulating its foundation. Restricting PPB to non-positional traits is unnecessary if well-being is non-comparative from the start. Moreover, REDUCTIO ignores that PPB can still guide selections for non-positional traits (e.g., health), which do yield net benefits when universalized. DISSOLUTION offers a more precise correction without discarding PPB.  

  **Against COORDINATION**  
  COORDINATION argues that individual reasons under PPB remain valid, and only collective restraint is needed. This misdiagnoses the problem. If well-being is comparative, PPB genuinely obligates parents to select positional traits—but this obligation is *misguided* because it conflates relative advantage with true well-being. COORDINATION treats the arms race as a mere coordination failure (like the Prisoner’s Dilemma), implying parents should still pursue positional traits individually but coordinate to restrain collectively. However, under a non-comparative view, parents lack a reason to select positional traits at all, making restraint redundant. COORDINATION fails to address why PPB generates conflicting reasons in the first place; DISSOLUTION eliminates the conflict by redefining well-being.  

  **Against CATEGORY ERROR**  
  CATEGORY ERROR denies an arms race exists, asserting that selecting one embryo only determines which child exists without altering others’ traits. This misses the aggregate effect. While individual selections do not change other embryos’ genomes, universal selection shifts the population distribution of traits. For example, if all parents select for height, the average height rises, eroding any individual’s relative advantage and leaving well-being unchanged. CATEGORY ERROR focuses narrowly on individual acts but ignores systemic outcomes: when everyone acts on PPB under a comparative well-being framework, society-wide effort is wasted with no benefit. DISSOLUTION avoids this by decoupling well-being from comparisons—positional traits become irrelevant to PPB, so no system-wide inefficiency arises.  

  **Qualification: Parental Partiality vs. Impartial Beneficence**  
  DISSOLUTION succeeds only if PPB is grounded in *parental partiality*—the special obligation parents have to maximize their own child’s well-being. Here, non-comparative well-being ensures that selecting positional traits never benefits the child (as their absolute well-being is unchanged), so PPB no longer endorses it. However, if PPB were grounded in *impartial beneficence* (a duty to maximize overall well-being), DISSOLUTION might falter: even with non-comparative well-being, selecting positional traits could still waste resources, potentially requiring COORDINATION (e.g., collective agreements to conserve resources) or REDUCTIO (if waste undermines overall welfare). Yet PPB is typically justified by parental partiality, not impartiality—parents are not obligated to consider societal resource allocation. Thus, under standard assumptions, DISSOLUTION holds: redefining well-being non-comparatively dissolves the arms race by aligning individual PPB compliance with rational outcomes.  

  **Conclusion**  
  The case exposes a flaw in applying PPB to comparative well-being but does not refute PPB itself. DISSOLUTION provides the best diagnosis: PPB must be restated with non-comparative well-being, rendering positional traits irrelevant and eliminating the arms race. REDUCTIO is unnecessary, COORDINATION is superficial, and CATEGORY ERROR overlooks systemic effects. The key qualification is that this relies on PPB’s grounding in parental partiality.  

  \answer{DISSOLUTION — grounded in parental partiality}  

  ---

  ### Marking Scheme (out of 20)  
  **Total Marks: 20**  
  **A (17–20) vs. B (13–16) Distinction**: An A answer *must* (1) recognize that the verdict depends on whether PPB is grounded in parental partiality or impartial beneficence and (2) decompose how a trait’s positional vs. non-positional components affect well-being. A B answer addresses the diagnoses but omits or mishandles one/both insights.  

  | **Criterion**                                                                 | **Marks** | **Notes on Common Errors**                                                                                                |  
  |-------------------------------------------------------------------------------|-----------|---------------------------------------------------------------------------------------------------------------------------|  
  | **1. Explanation of the Problem** (Positional traits, zero-sum cancellation) | 4         | Clear description of how universal selection wastes resources due to fixed positions and positional traits (2). Distinguishes positional vs. non-positional traits (1). Acknowledges stipulated objections are resolved (1). **Error**: Vague on why gains cancel (e.g., calls it "unfair" without zero-sum logic). |  
  | **2. Defense of One Diagnosis**                                              | 4         | Endorses one diagnosis (1) and provides a coherent, case-specific defense (3). **Error**: Generic restatement without engaging the scenario.           |  
  | **3. Engagement with Other Diagnoses** (At least two, all four for full marks)| 4         | Substantive rebuttals of two other diagnoses (2); comprehensive coverage of all four (2). **Error**: Ignores one diagnosis or gives weak/cursory rebuttals. |  
  | **4. Key Insight A: Grounding of PPB** (Partiality vs. impartiality)         | 3         | Identifies that DISSOLUTION/REDUCTIO/COORDINATION depend on PPB’s grounding (2). Explains how grounding affects the outcome (1). **Error**: Omits grounding entirely (automatic B cap). |  
  | **5. Key Insight B: Trait Decomposition** (Positional vs. non-positional)    | 3         | Separates a trait’s absolute (non-positional) and relative (positional) contributions to well-being (2). Uses this to analyze PPB’s demands (1). **Error**: Treats traits as monolithic (e.g., "all competitiveness is positional"). |  
  | **6. Structure and Clarity**                                                 | 2         | Logical flow, concision, and precision. **Error**: Disorganized or verbose.                                               |  

  **Penalty for Stipulated Objections**: Answers that rehearse non-identity, expressive, or autonomy objections (e.g., "PPB is flawed because it devalues disabled people") **cap at 10/20**. They fail to engage the positional case.  

  **Grading Summary**:  
  - **A (17–20)**: Excels in all criteria, especially Key Insights A and B.  
  - **B (13–16)**: Solid on diagnosis defense (Criteria 2–3) but weak/missing Key Insights (e.g., omits grounding or trait decomposition).  
  - **C (10–12)**: Explains problem but superficial on diagnoses; may recite stipulated objections (capped at 10).  
  - **D/E (<10)**: Major errors (e.g., misdefines PPB or the case).
