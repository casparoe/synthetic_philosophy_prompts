  Target language: Spanish, which requires gender agreement on the noun for neighbor, the object pronoun for "them", and the adjective for "tired".

  Correct translations differ in the gender used throughout.

  The unstated fact: the typical gender of nurses and soldiers.

  Now, the three systems:

  1. Shallow statistical translator (no situation model, phrase-based): 
     - Translates each sentence independently.
     - For the first sentence, it might choose a gender arbitrarily for "neighbor", but likely defaults to masculine for both. For "nurse", it might use feminine but that creates inconsistency. But we focus on the subsequent sentences: for the second and third sentences, it uses default masculine for the pronouns and adjective for both A and B.
     - Output for A: incorrect (masculine used for a female neighbor)
     - Output for B: correct (masculine) but by accident.

     But to be precise, we define that it produces the same for the second and third sentences for both A and B: using masculine.

  2. Grounded-but-still-shallow (has world knowledge from perception/embodiment but no situation model): 
     - For the first sentence, it uses its knowledge to choose the gender: for A, "vecina" and for B, "vecino". 
     - But for the second and third sentences, it does not link "them" to the neighbor, so it uses a default (masculine) for both. 
     - Thus, for A: feminine in the first sentence, masculine in the second and third -> inconsistent and incorrect for the second and third.
     - For B: masculine throughout -> correct.

     But the second and third sentences are the same for both A and B: masculine.

  3. Understanding translator (builds a situation model): 
     - For A: uses feminine throughout.
     - For B: uses masculine throughout.

  The feature doing the work: the need to maintain a referent (the neighbor) and its properties (gender) across sentences to resolve pronouns.

  If we delete the cross-sentence reference (e.g., make it one sentence), then shallow systems might get it right.

  Attacks:

  1. Statistical-system defender: A neural MT system might learn the co-reference from data.
     - Response: We are defining a shallow system as one without a situation model. Also, if the training data doesn't have this exact scenario, it might fail. But to strengthen, use a novel profession or a rare association.

  2. Grounding theorist: The knowledge of the gender association comes from grounding.
     - Response: Even if so, grounding alone is not sufficient; the situation model is required to use that knowledge in discourse.

  Thus, the case highlights the necessity of a situation model for discourse coherence.
