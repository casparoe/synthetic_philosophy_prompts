  The table needs parallel formulations. Practice camp will emphasize institutional roles; assurance camp, moral dynamics. Disagreement #3 (justification) might be terminological—both appeal to "wronging," just different mechanisms. 

  *Eyes narrow at cruxes* For (a) one-off promises: Design a case with no precedent, like alien contact. Practice camp should deny obligation; assurance camp might bite the bullet. For (b) release: Add a twist where promisor breaks after release but before promisee knows—exposes if obligation lingers. 

  *Snaps fingers* The "eavesdropper case" request: I’ll engineer a scenario where A manipulates B’s expectations without promising, exploiting overheard plans. Practice camp sees no obligation; assurance camp sees parallel wrong. 

  Rotten practice case: A promise in a cult that uses vows for control. Practice theorists must explain why the form binds; assurance theorists can say the immoral context voids moral assurance. 

  *Sighs* The drafter’s note: "Directed obligation" in the agreement is the shakiest. Practice camp might sign it but reinterpret "directed" as procedural. And the joint section’s "uptake matters" could be vacuously broad—both accept it but mean wildly different things (ritual vs. cognitive reliance). 

  User’s sneaky smart—they want the document to flag its own weaknesses. No fake harmony. *Nods* I’ll end by admitting the "uptake" point is a ceasefire phrase masking trench warfare.
answer: |-
  Here’s a draft adversarial collaboration agreement, designed to clarify substantive disagreements while minimizing verbal disputes. The cases are engineered to test cruxes without recycling standard examples.

  ---

  ### **Joint Statement of Agreement**  
  *(Signed by Practice Camp [PC] and Assurance Camp [AC])**  

  1. **Pro Tanto Force**: Promissory obligations are defeasible but not reducible to consequentialist calculations. They persist in cases where breaking a promise would produce marginally better overall consequences.  
  2. **Non-Derivative Wrong**: Breaking a promise wrongs the promisee distinctly; it is not merely a species of causing harm, disappointment, or free-riding.  
  3. **Uptake Requirement**: A promise requires the promisee’s recognition of the promisor’s commitment (though parties disagree on *what* is recognized; see §II).  
  4. **Content-Independence**: The reason to keep a promise is not solely tied to the specific act promised (e.g., "burning letters" vs. "donating $100") but arises from the act of promising itself.  
  5. **Directed Obligation**: Only the promisee (or their designated agent) can release the promisor from the obligation; third parties cannot waive it.  

  ---

  ### **II. Table of Disagreements**  
  | Disagreement                     | Practice Camp (PC) Formulation                                      | Assurance Camp (AC) Formulation                                      | Genuine or Verbal? |  
  |----------------------------------|---------------------------------------------------------------------|----------------------------------------------------------------------|-------------------|  
  | **1. Source of obligation**      | Obligation is constituted by rules of a shared social practice.    | Obligation arises from the moral significance of inducing reliance. | **Genuine**       |  
  | **2. Role of practice**          | Without a practice, "promising" is conceptually impossible.        | Practices facilitate promising but aren’t necessary for its core moral function. | **Genuine**       |  
  | **3. Primary wrong**             | Breaking a constitutive rule of a valuable practice.               | Violating the promisee’s moral authority over expectations.          | **Verbal** (Both agree it "wrongs," but differ on *how*) |  
  | **4. Release vs. Waiver**        | Release extinguishes the obligation by altering normative status. | Waiver forfeits the promisee’s right to complain; obligation may residually bind. | **Genuine**       |  

  ---

  ### **III. Cruxes & Test Cases**  
  *(Predictions written in advance by each camp)*  

  **Crux (a): Can promising exist in a one-off exchange without a practice?**  
  - **Test Case**: *The Martian Handshake*  
    > Two humans stranded on Mars, with no shared history or conventions. A says: “I hereby commit that you can expect me to share water with you tomorrow. I impose a duty on myself to do so.” B acknowledges.  
    - **PC Prediction**: No obligation. Words lack force without a practice. *Obligation? NO*  
    - **AC Prediction**: Obligation exists. Assurance was successfully transferred. *Obligation? YES*  

  **Crux (b): Does release extinguish obligation or merely waive complaint?**  
  - **Test Case**: *The Revoked Release*  
    > A promises B to fix B’s roof. B releases A. A then decides *not* to fix it. Before A acts, B says, “I revoke my release.”  
    - **PC Prediction**: Release extinguishes obligation. A is free. *A bound? NO*  
    - **AC Prediction**: Waiver only suspends complaint. If B revokes release, obligation reactivates. *A bound? YES*  

  **Crux (c): Does an undetectable breach generate a reason?**  
  - **Test Case**: *The Lockbox Letters*  
    > A promises a dying friend to burn their letters. A locks the box, throws away the key (unbeknownst to anyone), and leaves. The letters are preserved but inaccessible forever.  
    - **PC Prediction**: No breach. Obligation depends on possible accountability. *Wrong? NO*  
    - **AC Prediction**: Breach occurs. A failed to burn the letters as assured. *Wrong? YES*  

  **Crux (d): Is obligation directed?**  
  - *Covered by Joint Statement §5. Both agree it is directed.*  

  **Crux (e): What explains content-independence?**  
  - **Test Case**: *The Substituted Task*  
    > A promises B to wash B’s car. A then says, “I’ll walk your dog instead—it’s more helpful.” B prefers the car wash.  
    - **PC Explanation**: Rule of practice: You must do *what you promised*, not what’s better. *Wrong to substitute? YES*  
    - **AC Explanation**: A usurps B’s authority to set expectations. *Wrong to substitute? YES*  
    - **Verdict**: Agreement on wrongness, but divergent explanations (practice rules vs. expectation control).  

  **Special Case 1: Eavesdropper Expectation**  
  - **Test Case**: *The Engineered Reliance*  
    > A loudly tells C: “I will definitely invest in B’s business!” knowing B is eavesdropping. B relies on this, but A never addresses B.  
    - **PC Prediction**: No promise was made *to B*. No obligation. *A bound? NO*  
    - **AC Prediction**: A intentionally induced B’s expectation. Identical wrong to promising. *A bound? YES*  

  **Special Case 2: Morally Infected Practice**  
  - **Test Case**: *The Loyalty Oath*  
    > In a cult, A promises the leader to shun B, a dissident. The practice is coercive and harmful.  
    - **PC Prediction**: Practice exists → obligation is real (though overridden by morality). *Pro tanto obligation? YES*  
    - **AC Prediction**: Immoral "assurance" voids obligation. No pro tanto duty to shun. *Pro tanto obligation? NO*  

  ---

  ### **IV. Verbal Dispute Diagnosis**  
  The disagreement over the "primary wrong" (§II.3) is **verbal**. Both agree breaking a promise wrongs the promisee, but:  
  - **PC** calls this "breaking a practice-rule"  
  - **AC** calls this "violating moral authority over expectations"  
  **Substantive residue**: Whether the wrong is *explained by* institutional norms (PC) or pre-practice moral dynamics (AC).  

  ---

  ### **Drafter’s Note**  
  - **Fragile Claim**: Joint Statement §5 ("directed obligation"). The PC might sign this but interpret "directed" as *practice-conferred standing*, not a moral primitive. If pressed, PC might say a third party *could* release if practice rules allowed it (e.g., a priest absolving vows). A case where a practice permits third-party release would force a retreat.  
  - **Empty Formulation**: §3 ("Uptake matters"). Both sign, but PC means *recognition of institutional status*, while AC means *awareness of induced reliance*. The phrase papers over the core dispute about what promising *is*.  
  - **Likely Fake Compromise**: The agreement on "content-independence" (§1.4). Both agree you must keep trivial promises, but PC attributes this to practice rules' formality, while AC cites the promisee’s control. The joint statement hides this chasm.  

  ---  
  This document isolates irreconcilable differences while clarifying where further debate is futile (e.g., the "primary wrong" terminology) and where experiments like *The Martian Handshake* could force progress. Use the test cases as pre-commitment devices to prevent relitigation.
