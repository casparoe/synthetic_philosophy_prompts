  *Scratching head* The user’s cruxes are sharp: one-off exchanges, release vs. waiver, undetectable breaches, directed obligations, content-independence. Good sign they’ve mapped the fault lines. They also want novel cases—no recycling Parfit’s tractor promises here. 

