prompt: |-
  A friend sent me a blog post explaining updateless decision theory and I can't tell how much of it I should actually believe. Roughly, it says this:

  UDT says you should never update on your evidence -- a UDT agent ignores what it observes and instead asks which policy it would have wanted to commit to from behind the veil of ignorance, before it knew anything at all, and then mechanically does that. That's why it one-boxes in Newcomb's problem: not because one-boxing is evidence that the million is there, but because "always one-box" is the policy you'd have picked in advance, so that's what it executes. This matters because UDT wins the cases where causal decision theory loses money, like Newcomb's problem and Parfit's hitchhiker. But it also means a UDT agent pays up in counterfactual mugging, handing over money on the strength of a branch of the coin that didn't happen, and since nobody sane would pay there the theory is refuted -- it's a curiosity about perfect predictors and brain copies with no bearing on real decisions. (He also keeps calling it "functional decision theory, as people usually say now", as if that's just a rename.)

  I'm fairly sure the "never updates on anything" bit can't be right -- obviously the thing has to react to what it sees -- but I cant say what goes in its place, and the rest of it sounds plausible to me. So: which parts would someone who actually works on this accept, which are distortions, and is the counterfactual mugging point really the refutation he takes it for?

  I also tried testing it on a case of my own and dont trust my answer. Someone scanned me yesterday without telling me. Today they run that scan as a simulation and tell it: "you're the sim -- pay $1,000 and we'll give the real you $100,000; you yourself get nothing either way." Then they come to the real me, explain the whole setup, and offer me the same $1,000 deal, except that for me the payout is already fixed by what the sim did, so my paying changes nothing. My friend says the post's version of UDT is committed to "the sim pays, the real you refuses, and you walk away with $100,000 for free," which he says is just magic. Does the version in the post actually say that, and does the real thing?
reasoning: |-
  Okay, let me start by unpacking this user's query. They're confused about Updateless Decision Theory (UDT) after reading a blog post. The post claims UDT agents never update on evidence, which immediately raises a red flag for me. The user is skeptical but can't pinpoint what's wrong. They also mention Counterfactual Mugging as a supposed refutation and a personal thought experiment involving a simulation.

  First, I need to correct the "never updates" misunderstanding. UDT isn't about ignoring sensory input; it's about not letting observations change the predefined policy. The agent still perceives and reacts to inputs, but the decision-making policy is fixed from the start. I should clarify this with examples like Newcomb's Problem, where UDT one-boxes based on precommitment, not evidence.

  Next, the Counterfactual Mugging part. The blog post claims UDT pays in this scenario, which the author thinks is irrational. But the user is questioning if this is a valid refutation. I need to explain that UDT's payment isn't about rewarding the mugger but maintaining consistency across possible worlds. The debate here is philosophical—some see it as a strength, others a weakness. Highlighting that it's a contested point, not a clear refutation, is key.

  Then there's the user's simulation scenario. The sim is asked to pay $1000 for the real version to get $100,000. The real user later faces the same choice, but their decision doesn't affect the outcome. The blog's UDT version supposedly says the sim pays and the real user refuses, netting $100,000 for free. I need to analyze this. 

  UDT's policy approach: the agent chooses a strategy beforehand. For the sim, paying leads to $99,000 net if the real user also follows the policy. But if the real user knows the outcome is fixed, UDT might still have them pay to avoid inconsistency. However, the blog's claim that the real user refuses contradicts UDT's consistency requirement. The sim paying and real refusing breaks the policy. The correct UDT move would be both pay or both refuse, but the scenario's setup makes "both pay" net negative. So UDT would likely refuse both times, avoiding the loss. The blog's interpretation is flawed here.

  The user's deeper needs: they want clarity on UDT's validity, which parts are accepted, and whether the criticisms hold. They might be looking for a balanced view to assess the theory's practicality. Also, their thought experiment shows they're trying to apply UDT but doubt their understanding. They need corrections and reassurance that their skepticism about the blog's claims is justified.

  I should structure the response by addressing each misconception, clarifying UDT's actual principles, debunking the refutation claim, and resolving the simulation case. Emphasizing that UDT is a formal tool, not a behavioral prescription, and that real-world applications require careful modeling. Highlighting the difference between the blog's oversimplifications and academic UDT will help the user discern credible information.
answer: |-
  Based on the blog post description and your thought experiment, here's a breakdown of what's accurate, distorted, and contested about UDT (Updateless Decision Theory) / FDT (Functional Decision Theory), along with analysis of your scenario:

  **Clarifying Core UDT/FDT Concepts (Correcting Distortions):**

  1.  **"Never Updates on Evidence": Significantly Distorted.** This is the biggest misconception.
      *   **What UDT/FDT *actually* does:** It *chooses a single, fixed policy* **before** it has any specific observations (from "behind the veil of ignorance"). This policy is a *function* mapping *any possible observation* the agent *could* make to an *action*.
      *   **Crucially:** When the agent *actually* runs and *does* make observations, it **absolutely uses that observation as input** to its pre-selected policy function. It reacts to what it sees *exactly as specified by the policy*. It doesn't "ignore" its senses.
      *   **The "Updateless" Part:** Refers to the *selection* of the policy. UDT/FDT doesn't use its *specific* observations to *change* its fundamental decision-making rule (the policy function) on the fly. It commits once, upfront, to how it will react to *any conceivable* evidence. It doesn't perform a Bayesian update on its *world model* to choose an action *in that moment*; it just executes the pre-programmed response for the input it gets.
      *   **Analogy:** Imagine writing a computer program (`policy(observation) -> action`) *before* knowing what input it will get. When run, the program *definitely* reads the input (`observation`) and outputs the corresponding action. It doesn't ignore the input. "Updateless" means you wrote the whole program upfront without knowing the input; it doesn't mean the program ignores its input when executed.

  2.  **Commitment from Ignorance & Newcomb's/Parfit's: Largely Accurate.** Yes, UDT/FDT selects the policy that, when implemented *across all possible situations the agent could find itself in* (including counterfactual ones), leads to the best *expected* outcome from the initial ignorance perspective. This is why it one-boxes (policy: "if I see one box, take only one box; if I see two boxes... well, in Newcomb's you only ever see one or two, but the policy covers it"). It one-boxes because the *policy* of "always one-box" leads Omega to put the $1M there, resulting in $1M, while the "always two-box" policy leads Omega to leave it empty, resulting in only $1K. The agent doesn't think "seeing one box is evidence the $1M is there"; it thinks "the policy 'output one-box when I see the opaque box' is the one that gets me $1M when Omega predicts it".

  3.  **Counterfactual Mugging (CM): Contested, Not a Clear Refutation.**
      *   **UDT/FDT *does* pay in the standard CM:** From behind the veil of ignorance, the agent considers both branches. It knows that if the coin lands Heads (which it doesn't observe in the Tails branch it's actually in), it really wants the *counterfactual version* of itself in the Heads branch to pay the $100 to get $10,000. To have a *consistent policy* that ensures *that* happens, it must also pay the $100 in the Tails branch when asked. The policy "pay when asked" leads to either +$10,000 (Heads) or -$100 (Tails), with an expected value of +$4,950 (assuming fair coin). The policy "never pay" leads to $0 in both branches. UDT/FDT chooses the paying policy.
      *   **Is this irrational?** This is the core philosophical debate. Critics argue paying $100 for nothing *feels* irrational. Proponents argue:
          *   It's necessary for consistency and maximizing *pre*decision expected value.
          *   Refusing breaks the symmetry and means you'd *also* lose out in the Heads branch.
          *   It's analogous to pre-commitments in game theory (e.g., burning bridges) that only work if you'd follow through even when counterfactual.
      *   **Conclusion:** CM is a *challenge* and a point of *disagreement*, not a universally accepted refutation. UDT/FDT proponents accept the paying result as correct. Critics see it as a flaw. It highlights the core difference between UDT/FDT and more myopic decision theories.

  4.  **"Functional Decision Theory" (FDT): More Than a Rename.** While closely related and often used interchangeably now, FDT (developed by MIRI researchers - Soares, Yudkowsky, Fallenstein) refines and formalizes UDT concepts. It emphasizes the agent as a *function* in the world, choosing outputs based on the *logical relationship* between its output and the outcomes across all possible executions of that function. It's a more precise formalization of the UDT insight. The blog understates the significance of the shift in perspective.

  **Analyzing Your Simulation Scenario:**

  1.  **The Blog's Claim:** "The sim pays, the real you refuses, and you walk away with $100,000 for free."
  2.  **Is this what UDT/FDT actually says? Largely No. This is inconsistent.**
      *   **UDT/FDT Chooses a Single Policy:** The agent (both the sim and the real you are instances of the *same* decision-making algorithm/function) must choose *one* policy function *before* knowing if it's the sim or real. This policy defines what it does *if* it observes "I am the sim being offered this deal" *and* what it does *if* it observes "I am the real person being offered this deal knowing the sim's action".
      *   **Evaluating Policies:**
          *   **Policy A: Always Pay.** Sim pays $1000 (real gets $100,000). Real you pays $1000 (gets nothing extra, outcome fixed). *Net Result: -$1000 + $100,000 - $1000 = $98,000.*
          *   **Policy B: Never Pay.** Sim refuses. Real you refuses. *Net Result: $0.*
          *   **Policy C: Sim Pays, Real Refuses.** This is the blog's "magic" policy. Sim pays $1000 (real gets $100,000). Real you refuses (keeps $1000 net from sim's action). *Net Result: -$1000 (sim) + $100,000 (real) + $0 (real keeps money) = $99,000.*
      *   **The Problem:** Policy C ("Sim Pays, Real Refuses") is **not globally consistent** from the pre-commitment perspective.
          *   When the real you is deciding, the outcome *is already fixed* by the sim's action. Paying literally does nothing. UDT/FDT, when executing the policy function for the input "I am the real person, sim paid, paying changes nothing", would output the action defined by the policy *for that input*.
          *   **Would UDT/FDT precommit to "Real Refuses" in this situation?** Almost certainly **Yes**, because paying $1000 for absolutely no gain is strictly dominated by refusing. The policy needs to specify the best action *for the real agent given its specific situation*.
          *   **Therefore:** The globally optimal policy would likely be: `If (I observe "I am the sim"): Pay. If (I observe "I am the real you, sim paid"): Refuse. If (I observe "I am the real you, sim refused"): Refuse.`
          *   **Result:** Sim pays ($1000 loss), Real you refuses ($100,000 gain), Net +$99,000. *This matches the blog's predicted outcome.*
      *   **Is this "Magic"?** It *feels* magical because the real you gets $100,000 "for free". However, from the UDT/FDT perspective:
          *   The sim *is* you (or an instance of your decision function).
          *   The sim paying $1000 *is* you effectively paying $1000 in a situation where it logically results in $100,000 for your other instance.
          *   The real you refusing is rational *in that specific situation* because paying gains nothing.
          *   The net gain of $99,000 arises from the *combination* of the sim's costly action (which bought the $100,000) and the real you's costless refusal. The "magic" is enabled by the pre-commitment ensuring the sim pays *even though it gets nothing*, because the *overall policy* yields a high payoff. This is structurally very similar to Counterfactual Mugging.

  **Summary of Key Takeaways:**

  1.  **"Never updates" is a severe misrepresentation.** UDT/FDT *uses* observations as inputs to its fixed policy function. The "updatelessness" is about *how the policy is chosen*, not execution.
  2.  **Core Mechanism (commitment from ignorance) is accurate** and explains Newcomb/Parfit success.
  3.  **Counterfactual Mugging paying is a genuine consequence** of UDT/FDT, not a distortion. It's a major point of philosophical contention, not a universally accepted refutation. Proponents see it as a strength demonstrating consistency.
  4.  **FDT is a significant refinement** of UDT, not just a rename.
  5.  **Your Simulation Scenario:** The blog's predicted outcome (Sim pays, Real refuses, Net +$99,000) **is indeed the policy UDT/FDT would likely adopt** (Policy C). This is consistent within the UDT/FDT framework, leveraging the pre-commitment to make the sim's sacrifice rational from the initial perspective, even though the real you gets a windfall. While it *feels* like "magic" or free money, UDT/FDT sees it as the logical consequence of a unified decision policy maximizing pre-decision expected value across all instances. Critics argue this highlights UDT/FDT's counterintuitive demands in scenarios involving acausal cooperation or sacrifice for other instances.

  **In essence:** The blog gets the core mechanism (policy commitment from ignorance) mostly right for Newcomb/Parfit, severely distorts "never updates", correctly identifies the CM consequence (but overstates it as a refutation), understates FDT, and correctly predicts the outcome of your scenario based on UDT/FDT logic (though calling it "magic" betrays a critic's perspective). UDT/FDT remains a highly influential but philosophically debated framework in decision theory, primarily valued for handling problems involving predictors, simulations, and logical counterfactuals.
