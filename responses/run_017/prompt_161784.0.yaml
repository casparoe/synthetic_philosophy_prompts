  Therefore, we must assume that in the counterfactual (agent does nothing), the state changes due to other agents. So \( s_n^0 \neq s_0 \). Then the agent's goal is to make \( s_n = s_n^0 \). But note: the agent doesn't know \( s_n^0 \) in advance. Alternatively, the agent might learn to predict it.

  In the first case (undoing others): The agent observes a change (say, a cup moved by a human) and then undoes that change. But in the counterfactual, the cup would have been moved and stayed moved (because the agent does nothing). So if the agent undoes the move, then \( s_n \) has the cup in the cupboard, but \( s_n^0 \) has the cup on the table. Therefore, \( \Delta \) would be large? 

