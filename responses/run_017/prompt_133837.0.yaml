answer: |-
  ### Joint Statement on Careenium-Simmball Dynamics  

  **Section 1 — Agreed Claims**  
  Both camps accept the following substantive claims about the set-up:  

  1. **Microphysical Completeness and Determinism:** The microdynamics is causally closed and deterministic. Fixing the exact microstate (positions, velocities, pip-states, and medium configuration) at time *t* nomologically suffices for the microstate at all future times. No additional forces, indeterminacy, or energy/momentum creation occurs.  
  2. **Pattern Supervenience:** The legible pattern (extended/retracted pip configuration) supervenes entirely on the microstate. There is no pattern difference without a microstate difference.  
  3. **Invariance of Pattern-Level Laws:** Holding the pattern fixed while varying the microstate within its realisation class (per Stipulation 1) leaves the coarse-grained outcome (e.g., target shove direction) unchanged. Conversely, changing the pattern predictably changes the outcome as per the pattern-level rule.  
  4. **Screening-Off at Micro-Level:** Given the full microstate at *t*, the pattern is screened off as a predictor of the *microstate* at *t+Δt*. The pattern adds no new information about microphysical evolution beyond what the microstate provides.  
  5. **Empirical Adequacy of Both Levels:** Descriptions at the micro-level and pattern-level are empirically adequate *within their domains*. The microdynamics correctly predicts all micro-events; the pattern dynamics correctly predicts coarse-grained outcomes (e.g., target motion) and supports interventions.  
  6. **Explanatory Burden:** Any complete account must explain:  
     - Why the *Scrambled Twin* (Stipulation 3) fails to shove the target despite identical microphysical laws, energy, and constraints.  
     - Why the *Re-encoding Drift* (Stipulation 4) exhibits outcome continuity despite microstate discontinuity.  
  7. **Non-Triviality of Pattern Constraints:** The pattern-level law is simple, exceptionless, and not tractably derivable from the microdynamics alone (per Stipulation 1). *Agreed, but does no work in resolving the core disagreement.*  

  **Section 2 — Disagreements Table**  

  | Crux | Substrate Formulation | Symbol Formulation | Test Case/Argument | Substrate Prediction | Symbol Prediction | What Falsifies Substrate View | What Falsifies Symbol View |
  |------|----------------------|-------------------|--------------------|----------------------|------------------|------------------------------|----------------------------|
  | **1. Conception of "Cause"** | "Causation is production: only microphysical processes *produce* effects. Patterns are epiphenomenal summaries." | "Causation is difference-making: patterns *make a difference* to outcomes under interventions, satisfying invariance conditions." | Intervention test: Vary pattern while fixing all non-pattern micro-features (e.g., thermal jitter). | *Physically impossible* (violates supervenience). Thus, no test can show pattern-difference without micro-difference. | Pattern-change *is* the intervention; outcome changes as rule predicts, confirming pattern as cause. | If pattern-change left outcome identical despite rule-predicted difference. | If pattern-change failed to alter outcome when rule predicts change. |
  | **2. Decisive Test: Screening-Off vs. Invariance** | "Screening-off proves pattern is redundant: microstate suffices for all effects." | "Invariance proves pattern is indispensable: outcome depends *robustly* on pattern, not micro-details." | Analyse *Re-encoding Drift*: Pattern persists continuously while microstates shift disjointly. | Outcome continuity is microphysically determined by prior states; pattern is coincidental. | Pattern persistence explains outcome continuity despite micro-discontinuity. | If micro-discontinuity disrupted outcome without pattern-change. | If pattern persisted but outcome changed erratically. |
  | **3. Counterfactuals in Determinism** | "Legitimate counterfactuals must hold microstate fixed. ‘Had pattern differed’ is ill-defined as microstate *must* differ." | "Counterfactuals track possible interventions: ‘Had pattern differed’ means ‘under nearest physical intervention that alters pattern’." | Construct *Near-Miss Twin*: Microstate differs minimally (one pip-flip) from legible state, making pattern illegible. | Outcome diverges microscopically, but coarse shove may resemble pattern-prediction by chance. | Outcome changes categorically (e.g., no shove) as illegibility breaks pattern-law. | If single pip-flip never alters coarse outcome. | If illegible states regularly produce rule-conforming shoves. |
  | **4. Scrambled Twin Significance** | "Shows patterns *correlate* with outcomes, but micro-causation does the work: same laws, but initial microstate lacks shove-capable configuration." | "Shows patterns are *necessary* for the effect: no pattern, no rule-following shove, despite identical micro-resources." | Measure energy/momentum transfer in Scrambled vs. Legible runs. | Identical conservation laws apply; shove absence is micro-determined. | Pattern enables *functional* momentum transfer (directional, rule-based), absent in scramble. | If scrambled systems produced target shoves identical to legible ones. | If scrambled systems reliably shoved targets per apparent "rules" without legibility. |
  | **5. Causal Discovery Procedures** | "Inputting only pattern-variables into causal models (e.g., Pearl-style DAGs) yields illusions: true causes are micro-variables." | "Causal models using pattern-variables detect real causal structure, as they satisfy invariance and modularity." | Simulate data from 100 runs with micro-noise. Run causal discovery algorithms (e.g., IC*) on: (a) micro-features only, (b) pattern-features only, (c) both. | (a) Reveals true micro-causes; (b) finds spurious "pattern-cause" due to micro-correlation; (c) shows pattern screened off. | (b) Correctly identifies pattern→outcome; (a) misses generalisation; (c) shows pattern adds explanatory power. | If (b) fails to find pattern→outcome where invariance holds. | If (c) shows pattern screened off *without* weakening prediction. |
  | **6. "Pushing" as Conserved Transfer** | "Pushing requires energy/momentum transfer. Only micro-forces transfer these; patterns abstract from this transfer." | "Pushing is functional: the *organisation* of transfer matters. Patterns direct conserved quantities systematically." | *Conservation Test*: In Re-encoding Drift, measure if momentum transferred to target varies discontinuously during recoding. | Transfer is microscopically continuous; pattern irrelevant to conservation. | Transfer is pattern-directed; discontinuity in pattern would disrupt transfer even if micro continuous. | If pattern-change left momentum transfer unchanged when rule predicts change. | If recoding caused discontinuous shove without pattern-change. |

  **Section 3 — What is Merely Verbal**  
  *Signed by both camps:*  

  We agree that residual disagreements partly hinge on terminological choices, not substantive facts:  
  - **"Cause" as Metaphor:** Whether "the pattern pushes" is literal hinges on defining "push." Substrate reserves "push" for mechanical force transmission; Symbol extends it to organised force *direction*. This is a definitional choice about scope, not an empirical claim.  
  - **"Work" Ambiguity:** "Does the pattern do causal work?" conflates (a) *energy transfer* (Substrate’s focus) and (b) *specificity of outcome* (Symbol’s focus). Both agree energy is micro-transferred; they disagree on whether (b) warrants "work" in causal language.  
  - **"Explanation" Context-Relativity:** Claims like "the pattern explains the shove" are context-relative. Substrate denies it in *fundamental* explanation; Symbol affirms it in *special science* explanation. This reflects pragmatic, not ontological, divergence.  
  - **"Real" Causation:** Insisting causation is "only" at one level is a philosophical stance, not derivable from the set-up. The dispute reduces to whether "causation" requires *minimal sufficiency* (Substrate) or *invariant difference-making* (Symbol).  

  However, we *disagree* on whether the pattern’s causal contribution is *ontologically robust* or *descriptively useful only*. This is not verbal—it concerns what the world is ultimately like—but our definitions constrain how we resolve it.  

