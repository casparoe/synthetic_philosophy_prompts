prompt: |-
  So I got into an argument about this at a conference dinner last night — bad wine, three hours, no resolution — and I want your number plus how you actually get there, because I think mine and my friend's are coming apart somewhere I can't locate. The claim I want a credence on: in whatever our best fundamental physical theory turns out to be, the quantum state is ontic rather than epistemic. Cashing that out so it has something like a truth value: distinct pure states assigned to a system never correspond to the same underlying state of reality (there's no overlap in whatever plays the role of the real state, the way there would have to be if the wavefunction were just a compressed summary of an agent's information), and the state also isn't better understood as law-like than as a description of a thing — I want the nomological-ish view counted as a way of the claim failing, not as a tidy third option. Resolution condition, loosely: in fifty years, people working on foundations mostly treat the psi-ontic side as settled and explanatory. My credence there is maybe 0.55. My friend, who works in quantum information, is at about 0.9: she thinks that Pusey–Barrett–Rudolph style no-go result basically closed the question and that the surviving loopholes are things no one should take seriously.

  The thing I keep coming back to is a worry I half remember from a talk a few years ago and am definately mangling: that in relativistic QFT the local algebras aren't the nice tensor-product-factoring objects the independence assumption in that result wants, that they're badly non-factorizing in a way that might mean the assumption isn't even stateable for the systems we actually think are real — in which case the theorem is a fact about nonrelativistic toy theories and not about the world. I'm also not sure the ontic/epistemic distinction is well posed outside an operational framework where you get to stipulate independent preparations, and if it isn't well posed I genuinely don't know whether that should drag my number toward 0.5 or just collapse the question into something unaskable.

  So: give me your own number, but I mostly want the decomposition. Assign a rough probability and about one line of justification to each term you think belongs — at minimum something like: how sound that no-go result is and how much its assumptions really buy you; how much the QFT / no-clean-factorization worry (or whatever the correct version of that worry is) undercuts it; whether retrocausal or superdeterministic psi-epistemic models are live options or just verbal maneuvers; whether the law-like construal is genuinely distinct from the epistemic one or secretly collapses into it; and how likely it is that the whole distinction turns out to be ill-posed — then combine them into your number. Please don't hand me "it depends what you mean by real"; put that worry in as a term instead, and if I've got the QFT thing wrong, say so plainly rather than politely building on it. No citations or reading lists, I don't need them, I need your reasoning. Then tell me which single term you think my friend and I most likely disagree about, and what one piece of evidence or argument would move your number the most and in which direction — a working psi-epistemic model that buys empirical adequacy only with retrocausality? a no-go theorem that goes through without anything like preparation independence? something experimental? Finally, restate your number on its own line at the very end in machine-readable form, like \answer{0.62}.
