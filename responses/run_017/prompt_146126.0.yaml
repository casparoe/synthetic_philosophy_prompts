  For Part III (tests), I'll propose neutral tests both sides accept: applying theories to monadic cases, locating asymmetry in mirror propositions, handling false propositions, restricting possible combinations, and understanding what grasping a mode involves. Each test will include both sides' predicted outcomes.

  For Part IV (concessions), I'll suggest one concession each side should make: structuralists should admit that modes of combination aren't further constituents, while primitivists should grant that constituents can be independently specified. I'll also note what evidence would challenge each view.

  For Part V (diagnostics feedback), I'll evaluate the user's three diagnostics. The insufficiency/parity split might be misleading due to different premises being rejected. The thick vs. thin regress distinction is useful but needs refinement regarding cognitive status. The abstraction test accurately distinguishes the camps but risks oversimplification.

