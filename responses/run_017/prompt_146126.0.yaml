answer: |-
  ### Scratch Work: Provisional Analysis  
  *(Identifying substantive vs. verbal disagreements; noting begged questions)*  

  1.  **Substantive Disagreements:**  
      -   **Regress Generation:** Structuralist denies regress arises if relations are unsaturated/modes are typed; primitivist insists it always arises. *Substantive.*  
      -   **Monadic Case:** Structuralist sees it as analogous/simpler; primitivist sees unity as equally primitive/inexplicable. *Substantive.*  
      -   **Stopping Point:** Is a "mode of combination" explanatory or a disguised primitive? *Core substantive disagreement.*  
      -   **Directedness:** Can ordering reduce to combinatorial structure, or is it brute? *Substantive if tied to combinatorialism.*  
      -   **Aboutness vs. Truth Conditions:** Primitivist sees aboutness (constituents being *of* things) as prior; structuralist may see truth-conditional role as fundamental. *Substantive but linked to unity.*  

  2.  **Verbal/Notional Disagreements:**  
      -   **"Primitive Unity":** Structuralist accepts "primitive applicability of mode"; primitivist calls this "primitive unity." *Verbal if structuralist’s mode isn’t a constituent.*  
      -   **"Abstraction Test":** Structuralist *can* allow constituents are only identifiable via role in propositions without abandoning "building" metaphor. *Notional shift possible; test may mislead.*  

  3.  **Begged Questions in User’s Framing:**  
      -   **Parity Premise (4):** Assumes *anything* playing a unifying role *must* be a "something" needing unification. Structuralist rejects this for unsaturated/modes. Primitivist accepts it, making modes covert primitives. *Framing assumes primitivist’s view of what counts as an "item."*  
      -   **Diagnostic (a):** Assumes camps *must* reject a premise. Primitivist rejects *both* as misstated; structuralist rejects *parity*. *Asymmetry is principled but reflects deeper divide.*  
      -   **Thin Regress (b):** Calling it a "redescription" assumes it doesn’t *solve*. Structuralist sees it as dissolution; primitivist as evasion. *Question-begging if "solution" requires elimination.*  

  ---
  ### Deliverable: Joint Statement on the Unity of the Proposition  

  **Part I: Agreed Claims**  

  1.  **Propositional Distinctness:** The proposition *that Brutus stabbed Caesar* differs from *that Caesar stabbed Brutus* and from any aggregate (e.g., set {Brutus, stabbing, Caesar}). *Work: Establishes unity and directionality as phenomena needing explanation.*  
  2.  **Non-Identity with Aggregates:** No unordered set, list, or mereological sum of the constituents (Brutus, stabbing, Caesar) is identical to the proposition *that Brutus stabbed Caesar*. *Work: Rejects trivial or set-theoretic reductions without further account.*  
  3.  **Rejection of Naive Unifiers:** No solution posits an additional *constituent* (e.g., a "glue" relation) binding the initial constituents, on pain of Bradleyan regress. *Work: Rules out a common but flawed approach.*  
  4.  **Generalization Requirement:** Any account must handle monadic cases (e.g., *that Brutus was ambitious*), negations (e.g., *that Brutus did not stab Caesar*), and false propositions (e.g., *that Caesar stabbed Brutus* if false) without ad hoc adjustments. *Work: Ensures solution isn’t artifact of dyadic predication.*  
  5.  **Set-Theoretic Coding Insufficiency:** Representing the proposition via an ordered set (e.g., <Brutus, stabbing, Caesar>) or similar structure does not, by itself, explain its truth-evaluability or aboutness (e.g., why this set is *about* Brutus and Caesar). *Work: Demands philosophical, not merely formal, explanation.*  
  6.  **Finite Grasp Constraint:** A finite thinker’s ability to grasp a proposition (e.g., *that Brutus stabbed Caesar*) cannot require entertaining infinitely many distinct entities or steps. *Work: Sets cognitive boundary condition on solutions.*  

  *(Deleted/Sharpened: User’s (iii) sharpened to specify "constituent"; user’s (i) merged into 1 & 2; user’s (vi) retained but made explicit re: entities/steps.)*  

  **Part II: Disagreements Table**  

  | Crux                                                                 | Structuralist’s Acceptable Formulation                                                                 | Primitivist’s Acceptable Formulation                                                                 | Genuine/Verbal | Justification                                                                               |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- | :------------- | :------------------------------------------------------------------------------------------ |
  | **1. Regress Generation**                                            | Regress arises only if the unifier is misconstrued as a saturated constituent; unsaturated relations/modes halt it. | Regress arises inevitably for any purported unifier; halting requires accepting primitive unity.     | Genuine        | **G:** Disagreement on whether unsaturatedness/modes avoid the "further item" requirement. |
  | **2. Monadic Case**                                                  | Unity in *Brutus was ambitious* involves a monadic mode/unsaturated property; no new problem arises. | Unity in *Brutus was ambitious* is equally primitive; no combinatorial structure explains it.        | Genuine        | **G:** Disagreement on whether combinatorial resources apply uniformly or explain unity.    |
  | **3. Stopping Point (Mode/Act-Type)**                                | A typed mode of combination (or predicative act-type) is not a constituent; its applicability is explanatorily basic. | A "mode of combination" is a primitive unity smuggled in; its invocation concedes the inexplicability. | Genuine        | **G:** Disagreement on whether modes avoid being "items" needing unification.               |
  | **4. Directedness/Ordering**                                         | Direction (e.g., Brutus-as-stabber) derives from combinatorial roles defined by the mode/relation type. | Direction is an aspect of primitive unity; combinatorial "roles" presuppose the whole’s directedness. | Genuine        | **G:** Disagreement on reducibility to combinatorial structure.                             |
  | **5. Truth Conditions vs. Aboutness**                                | Explaining truth conditions (e.g., *that Brutus stabbed Caesar* is true iff Brutus stabbed Caesar) suffices; aboutness is derivative. | Explaining aboutness (e.g., why the proposition is *of* Brutus stabbing Caesar) is primary; truth conditions presuppose it. | Genuine        | **G:** Disagreement on explanatory priority re: intentionality.                             |
  | **6. Verbal Dispute on "Primitive"?**                                | We accept a basic, inexplicable *applicability* of combinatorial types, but this is not "primitive unity." | Accepting inexplicable "applicability" *is* accepting primitive unity; the dispute is terminological. | Verbal         | **V:** Turns on whether "primitive unity" applies only to wholes or also to combinatorial acts. |

  **Part III: Neutral Tests & Predictions**  

  1.  **Test: Monadic Application**  
      Apply each account to *that Brutus was ambitious*. What resources are required?  
      - *Structuralist Prediction:* A monadic mode/unsaturated property; same combinatorial logic as dyadic, minus relata-ordering.  
      - *Primitivist Prediction:* Same primitive unity as dyadic; combinatorial "logic" is illusory.  

  2.  **Test: Locating Asymmetry**  
      Identify what grounds the difference between *Brutus stabbed Caesar* and *Caesar stabbed Brutus*. Does this ground reintroduce a "tie"?  
      - *Structuralist Prediction:* Asymmetry grounded in combinatorial roles (e.g., argument places). No tie; roles defined by mode.  
      - *Primitivist Prediction:* Asymmetry is primitive aspect of each whole. Calling it "roles" reintroduces virtual ties.  

  3.  **Test: False Instance**  
      Explain the unity of *that Caesar stabbed Brutus* (if false). Can unity be explained without a corresponding fact?  
      - *Structuralist Prediction:* Unity from mode/unsaturated relation; truth requires worldly fact, unity does not.  
      - *Primitivist Prediction:* Unity is primitive and identical for true/false propositions; no appeal to facts needed.  

  4.  **Test: Comprehension & Self-Reference**  
      What prevents arbitrary combinations (e.g., *that stabbing stabbed Brutus*)? Can a proposition be a constituent of itself?  
      - *Structuralist Prediction:* Restrictions from logical types of modes/constituents. Self-constituency violates type restrictions.  
      - *Primitivist Prediction:* Only intelligible unities exist; combinatorial constraints are post-hoc. Self-constituency is unintelligible.  

  5.  **Test: Grasping a Mode**  
      What must a thinker grasp to grasp a mode of combination (e.g., for stabbing), if not a further proposition?  
      - *Structuralist Prediction:* Grasp is practical/implicit understanding of predicative act-type (not a proposition).  
      - *Primitivist Prediction:* "Grasping a mode" just is grasping the primitive unity of a proposition; no independent act.  

  **Part IV: Concessions**  

  -   **Structuralist should concede:** If modes of combination require *themselves* to be "combined" with constituents in the same way constituents are combined, the regress resumes. *Evidence:* Showing that the mode’s "hook" to constituents functions identically to a saturated relation’s hook.  
  -   **Primitivist should concede:** Constituents (Brutus, stabbing) can be identified and referred to independently of their role in *specific* propositions (e.g., via acquaintance or descriptive backup). *Evidence:* Successful reference to Brutus outside *any* stabbing-proposition.  

  **Part V: Diagnostics Feedback**  

  1.  **Diagnostic (a): Insufficiency/Parity Split**  
      **Misleading.** Asymmetry is principled: Structuralist rejects Parity (premise 4) for modes/unsaturated items. Primitivist rejects the *framework* generating both premises. Sharpening: Distinguish *what* the premises apply to. Premise 4 applies only to *constituents*; for structuralists, modes aren’t constituents. Primitivists deny the "building" model altogether. Replace with: "Does the proposed unifier *itself* require unification with the constituents?"  

  2.  **Diagnostic (b): Thick vs. Thin Regress**  
      **Useful but needs refinement.** "Thin" regress (virtual, no cognitive cost) *is* structuralist’s solution, not mere redescription. Primitivist sees it as *evading* the problem (constituents still need unification). Sharpening: Specify cognitive vs. ontological status. For structuralist, regress levels are *type-theoretically excluded*, not entertained. For primitivist, no regress levels exist because unity is fundamental.  

  3.  **Diagnostic (c): Abstraction Test**  
      **Mostly accurate but risks oversimplification.** Structuralist *can* accept constituents are only *fully* specified by role in propositions (e.g., stabbing as a relation) while maintaining they are "building blocks." Primitivist *must* deny independent specifiability *for constituent roles* (e.g., being the stabbing *agent*). Replace with: "Can the *specific predicative role* of a constituent (e.g., Brutus *as stabber*) be specified independently of the whole proposition?" (Structuralist: Yes, via mode; Primitivist: No).  

  ---
  **Coda:** The core dispute is genuine: Can unity be explained by combinatorial resources without invoking brute unity? The disagreement on the monadic case and directedness reveals this depth. Metaphors ("hook," "slot") obscure key distinctions; focus on whether combinatorial roles require prior unification. The abstraction test, revised, best isolates the divide. — End of Document —
