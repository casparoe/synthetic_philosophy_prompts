  ### Improved Seminar Design for Rational Choice Tension

  After refining your provisional plan and considering alternative skeletons, I'll present the optimized structure, explain rejected candidates, address your specific requests, and pressure-test your wrinkles.

  ---

  ### **Final Seminar Structure (90 min)**
  **Core Goal:** Make students viscerally experience the tension between causal dominance ("send/enter, your choice doesn't affect others") and superrational symmetry ("your choice *is* everyone's, so restrain yourself"). No pre-lecture; tension emerges from actions.

  #### **Phase 1: Platonia Telegram (25 min)**
  - **Setup:** 
    - Explain rules: Each student secretly writes "SEND" or "ABSTAIN" on a card. Prize (book voucher) awarded only if *exactly one* "SEND" card exists. If 0 or >1 "SEND", voucher is destroyed (or given to disliked cause). 
    - Emphasize: No communication yet, simultaneous submission.  
  - **Ballot 1 (Silent):** 
    - Students write choices → cards collected in hat. 
    - Tally and reveal outcome: Destroy voucher if failure, award if one sender.  
    - *Expected outcome:* High likelihood of >1 sender (n=18, P(success)≈0.37 if independent random; realistically higher as many send).  

  - **Open Talk (3 min):** 
    - Allow unstructured discussion. *Crucially:* Don’t guide; observe if they propose lotteries, promises, or dominant-strategy defiance.  
  - **Ballot 2 (After Talk):** 
    - Re-run ballot identically.  
    - *Expected outcome:* Coordination attempt (e.g., "only Alice sends") often fails due to defection or mistrust.  

  *Why this works:* First ballot surfaces causal intuitions; talk phase forces confrontation with coordination dilemmas; second ballot tests institutional fragility. Cheap talk allowed to let defection emerge organically. Honesty ensured by simultaneous, secret ballots.

  #### **Phase 2: Luring Lottery (25 min)**
  - **Setup:** 
    - Prize = 1800 "points" (convertible to chocolates/small cash post-seminar).  
    - Rules: Each student submits an integer ≥0 (ticket count). Total tickets = T. One ticket drawn randomly; winner gets (1800 / T) points.  
    - Stress: "You can submit 0, 1, 1000, or even a million."  
  - **Round 1:** 
    - Students write numbers secretly → collect, sum T, draw winner, award points.  
    - *Expected outcome:* T large (e.g., 100+), winner gets trivial points (e.g., 18 points if T=100).  
  - **Open Talk (3 min):** 
    - Allow discussion; observe if they propose caps or equal entries.  
  - **Round 2:** 
    - Re-run identically.  
    - *Expected outcome:* T often *increases* (arms race; e.g., students submit 10,000 to "win more").  

  *Why this works:* Makes negative externalities visceral. Allowing absurd entries (like the original) highlights dominance incentives. Two rounds show escalation. Points avoid book-voucher divisibility issues.

  #### **Phase 3: Asymmetry Wrinkle (15 min)**
  - **Setup:** 
    - Privately give 6 students (1/3) sealed envelopes: "If you ABSTAIN, you get a guaranteed £5 gift card. Prize voucher unaffected."  
    - Others get nothing for abstaining.  
    - Re-run Platonia ballot (secret, simultaneous).  
  - **Ballot 3:** 
    - Collect cards, award prizes: Voucher for unique sender, £5 for abstaining asym students.  
    - *Expected outcome:* Asym students often abstain; sym students split between sending/abstaining. Success rate may increase slightly.  

  *Debrief anchor:* Highlights that superrationality requires symmetry. "Sufficient similarity" (e.g., 90% same incentives) isn’t enough—exact symmetry is brittle. Asym agents act as "outsiders," breaking collective reasoning.

  #### **Phase 4: Copy-Rule Wrinkle (15 min)**
  - **Setup:** 
    - Announce: "With probability q, your card is discarded and replaced by a copy of a random other card." Set **q = 0.6** (justified below).  
    - Run one final Platonia ballot (secret).  
    - *Implementation:* After collection, roll a die per student: if 1-3 (q=0.5) or use a spinner. If "copy," randomly pick another card to replace it. Reveal outcome.  
  - **Threshold Calculation:**  
    A student expecting fraction **r** of others to abstain should abstain if:  
    ```plaintext
    (1 - q) * [P(win|send)] < q * r * [P(win|abstain)]  
    ```  
    Simplified (see appendix): **Abstain if q > 1 / (1 + r)**.  
    - E.g., if r=0.5 (half abstain), abstain if q > 2/3. We use q=0.6 to induce ambiguity.  

  *What it shows:*  
  - ✔️ Manufactures causal correlation, making restraint feel rational.  
  - ✖️ Does **not** validate superrationality: Dependence is explicit (mechanical), not emergent from logic/similarity.  
  *Pressure-test:* Device is pedagogical, not proof—it answers "What if dependence were real?" not "Is dependence logical?"

  #### **Debrief (10 min)**  
  Map moments to concepts:  
  - **Ballot 1 failure:** Causal decision theory (dominant strategy).  
  - **Talk phase collapse:** Coordination as a public good; superrationality as "private coordination."  
  - **Luring escalation:** N-person tragedy of the commons.  
  - **Asymmetry:** Limits of similarity (exact symmetry needed; 90% fails).  
  - **Copy rule:** Evidential/functional decision theory given forced correlation.  
  - **Key tension:** CDT vs. symmetry-adjusted EDT. Anchor to Newcomb’s: "Are you a causal agent or a logical node?"

  ---

  ### **Rejected Candidate Skeletons & Why**
  1. **Linear Progression (Platonia → Luring → Asymmetry → Copy Rule)**  
     - *Why rejected:* Luring Lottery disrupts Platonia’s tension. Asymmetry/copy rule belong to Platonia’s symmetry premise. Switching games mid-flow dilutes focus.  

  2. **Luring-First (Luring → Platonia)**  
     - *Why rejected:* Luring’s dominance is too mathematically obvious ("enter more → higher chance"). Platonia’s "send/abstain" dilemma better mirrors Newcomb’s qualitative tension.  

  3. **Single-Ballot w/ Extended Talk**  
     - *Why rejected:* Short talk (3 min) forces hasty institutions, making defection visceral. Extended talk risks over-engineering (e.g., binding contracts), masking the core tension.  

  ---

  ### **Predictable Problems & Mitigation**
  - **Ballot 1 failure "teaches nothing":** With n=18, P(success)≈0.37—use this! Debrief: "Even with randomization, success is unstable."  
  - **Joker/Defector:** Economists may send "to prove dominance"; philosophers may abstain "to be Kantian." *Use:* Their actions fuel debrief tension.  
  - **Sabotage in Luring:** Students submit huge numbers (e.g., 1,000,000). *Allow it:* It exemplifies dominance incentives.  
  - **Group coordination collapse:** In talk phase, a student shouts, "I’m sending—everyone else abstain!" *Expected:* Others distrust and send, causing failure. Debrief as "cheap talk vs. incentive-compatibility."  
  - **Copy-rule confusion:** Some may misunderstand probability. *Mitigate:* Use physical props (dice, spinner) for transparency.  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Stakes:** £40 isn’t a life-changing sum → emotions less intense.  
  - **One-shot nature:** No repeated interactions → no learning/reciprocity.  
  - **Partial similarity:** Students know peers are diverse (e.g., economists ≠ philosophers) → superrationality feels unnatural.  
  - **No real copy rule:** Mechanical copying is artificial → evidential dependence remains abstract.  
  - **Shadowless future:** Real institutions use punishment/reward → here, defection has no long-term cost.  

  ---

  ### **Instructive Moment & Core Insight**  
  The **talk phase collapse** (Ballot 2) will be most revealing: Students *try* to build a lottery or promise system, but defection emerges. This shows:  
  > *Superrationality is a "poor person’s institution"—it tries to replicate collective action through private reasoning, but collapses without enforceable symmetry.*  

  By the end, students will *feel* why both arguments compel—and why they conflict. The wrinkles pressure-test similarity and dependence, but the unresolved tension is the win.  

  ---  
  **Appendix: Copy-Rule Threshold Derivation**  
  Let:  
  - \(n\) = total players (18).  
  - \(r\) = fraction of *others* expected to abstain.  
  - Payoff if unique sender = \(V\).  
  - If student abstains:  
    - Wins only if copied into sending (prob = \(q \cdot r\)) AND others abstain (prob = \(P_0\)).  
    - Expected payoff: \(q \cdot r \cdot P_0 \cdot V\).  
  - If student sends:  
    - Wins only if not copied out (prob = \(1 - q\)) AND others abstain (prob = \(P_0\)).  
    - Expected payoff: \((1 - q) \cdot P_0 \cdot V\).  
  - **Abstain if:**  
    \[
    q \cdot r \cdot P_0 \cdot V > (1 - q) \cdot P_0 \cdot V
    \]
    \[
    q r > 1 - q  
    \]
    \[
    q > \frac{1}{1 + r} \quad \text{(assuming } P_0 > 0\text{)}.
    \]  
  At \(r=0.5\), threshold is \(q > 2/3\); we use q=0.6 to avoid obvious equilibria.
