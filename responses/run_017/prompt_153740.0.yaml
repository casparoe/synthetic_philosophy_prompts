prompt: |-
  I'm in a seminar on accuracy-first epistemology this term and I'm trying to work out what our professor is actually committed to, because she's going to rule on a new case next week and I'd like to have something better than a shrug ready. Her verdicts so far, all of them on "which credences are rationally permissible":

  - Fair coin, no other evidence: 0.5 is the only permissible credence in heads; 0.6 is out.
  - Coin known to have chance 0.7 of heads: 0.7 only; 0.5 and 0.65 both out.
  - Disease with 1% prevalence, test 99% sensitive and 99% specific, positive result: 0.5. She said 0.05 is out (that ignores the test) and 0.95 is out (that ignores the base rate).
  - Urn drawn at random from a warehouse where a third of the urns are 90% red and two thirds are 30% red, no draws observed yet: 0.5. She specifically said 0.6 is wrong ("that's what you get if you treat the two urn types as equally likely") and 0.3 is wrong ("being cautious isn't an accuracy consideration").
  - Credence 0.7 in heads and 0.7 in tails: out, "accuracy-dominated by 0.5/0.5."
  - Twice now someone has raised a case with genuinely mushy evidence — a vague eyewitness, a "maybe" from a lab technician — and both times she said the case was under-described and moved on.

  She always works with the quadratic/Brier score, and she said once that the choice of proper scoring rule "doesn't do any work in any case I've shown you," which Im not sure is a hint or just a disclaimer. She also keeps saying something like: chance-matching does the work when the chances are pinned down, and it runs out when they aren't.

  Next week's case: a field kit for a plant disease. Base rate in the field is 50%. The kit reads "infected." Kits are either fresh (90% accurate, both ways) or expired (60% accurate, both ways), and with a 50% base rate that means the chance of infection given the reading is either 0.9 or 0.6, depending on which kind of kit you have. You don't know which yours is. Your only evidence is that the technician handed it to you and said "I think its fresh," so your confidence that the kit is fresh sits around 0.7 to 0.75 — except you can't pin it down, and anything from 0.6 to 0.9 would honestly feel fine to you.

  So what does she say the permissible credence in "infected" is? I can think of at least three rules that fit everything she's ruled on so far and that come apart here: match the weighted average of the possible chances (roughly 0.825, or a range like 0.78–0.87 if you let the second-order mushiness through), anything in 0.6–0.9 because nothing in that interval is accuracy-dominated given the possible chances, or split the difference uniformly over the two hypotheses (0.75). Maybe there's a worst-case rule too. I want to know which of these really does fit her track record, what each predicts about the kit case, which single verdict I should expect, and what I could put to her in discussion that would separate the ones still in play.

  Four titled sections please, in this order: "Rules that fit her verdicts" (~200 words), "What each predicts about the kit case" (~250 words, with the numbers worked out), "Best guess" (~150 words), "The question that would settle it" (~120 words).
reasoning: |-
  Hmm, the user is in an epistemology seminar focusing on accuracy-first approaches. They need to predict their professor's ruling on a plant disease test case involving uncertain kit reliability. The professor has established a clear pattern in previous cases: strict chance-matching when chances are known (coins), base-rate/test evidence balancing in medical cases (0.5 for disease test), and 0.5 for urn-type uncertainty. She rejects dominated credences and avoids mushy evidence cases.

  The kit case has layered uncertainties: 50% base infection rate, kit accuracy depends on freshness (90% or 60%), and the user has vague confidence (0.6-0.9) about kit freshness from the technician's comment. Three rules seem compatible with past rulings: weighted average chance (0.825), interval permissibility (0.6-0.9), or uniform splitting (0.75). The weighted average matches her base-rate/test balancing approach in the disease case and the urn probability calculation. The interval approach would contradict her rejection of ranges in the urn case, while uniform splitting lacks precedent.

  For the prediction, the weighted average method fits best: it extends her consistent application of expected chances. The key question to confirm this would be whether second-order uncertainty should be "collapsed" into a first-order expectation - her prior rulings suggest yes. This approach outputs approximately 0.825 for the kit case, maintaining her pattern of precise outputs despite input vagueness.
answer: |-
  ### Rules that fit her verdicts
  Three rules align with her rulings:  
  1. **Expected Chance Matching**: When chances are uncertain, permissible credences match the expected objective chance. This fits the disease test case (1% base × 99% sensitivity → 50% after positive test) and urn case (⅓×90% + ⅔×30% = 50%). It requires collapsing second-order uncertainty into a weighted average.  
  2. **Undominated Interval**: Permissible credences are those not accuracy-dominated *across possible chance setups*. This fits the coin cases (0.5/0.7 uniquely undominated) and rejects 0.7/0.7 (dominated). For the urn, 0.5 is undominated under both urn types, while 0.6 is dominated if the urn is 30%-red.  
  3. **Uniform Splitting**: When evidence doesn’t distinguish sub-hypotheses (urn types, kit types), split belief evenly between them. This yields 0.5 for the urn (avg of 30% and 90% red? No—**correction**: her urn verdict was 0.5 credence *in red*, but the hypotheses are urn *types*, not direct chances. Uniform over types implies avg chance: (90% + 30%)/2 = 60%, but she rejected 0.6. So this *doesn’t* fit. Revised: Only Expected Chance and Undominated Interval fully fit.  

  ### What each predicts about the kit case
  - **Expected Chance Matching**:  
    Let \( p \) = credence kit is fresh. Evidence suggests \( p \approx 0.7 \), but mushiness implies a range. Expected chance of infection given "infected" reading:  
    \[
    (p \times 0.9) + ((1-p) \times 0.6) = 0.6 + 0.3p
    \]  
    For \( p = 0.7 \), this gives \( 0.6 + 0.21 = 0.81 \). Allowing \( p \in [0.6, 0.9] \), permissible credence spans \( 0.6 + 0.3(0.6) = 0.78 \) to \( 0.6 + 0.3(0.9) = 0.87 \). **Prediction:** 0.81 (or range 0.78–0.87).  

  - **Undominated Interval**:  
    If kit is fresh (chance = 0.9), credences \( c < 0.9 \) are dominated if \( c \leq 0.6 \)? No—**correction**: For Brier score, a credence \( c \) is dominated only if *every possible chance function* accuracy-dominates it. If kit is fresh (chance 0.9), \( c = 0.6 \) *is* dominated (since 0.9 is strictly better). Similarly, if expired (chance 0.6), \( c = 0.9 \) is dominated. The undominated interval is \([0.6, 0.9]\)—any \( c \) in this range is optimal for *some* chance (e.g., \( c = 0.6 \) is optimal if chance is 0.6). **Prediction:** Any \( c \in [0.6, 0.9] \).  

  - **Uniform Splitting** (if considered):  
    Split evenly between "fresh kit" (→ chance 0.9) and "expired kit" (→ chance 0.6). Average chance: \( (0.9 + 0.6)/2 = 0.75 \). **Prediction:** 0.75.  

  ### Best guess  
  **Expected Chance Matching (0.81, or range near 0.8)**. This best explains her disease test ruling (expected chance = 0.5) and urn case (expected chance = 50% red). It rejects "ignoring base rates" or "treating urn types as equal" (she criticized 0.3/0.6 in urns, which deviate from expected chance). The Undominated Interval predicts a range, but she gave point values in all resolved cases (0.5/0.7/0.5), suggesting she collapses uncertainty. Uniform Splitting is unsupported (she rejected 0.6 in urns, which uniform splitting would allow if averaging chances directly). Her dismissal of mushy evidence cases implies she demands precisification here—likely via expected chance.  

  ### The question that would settle it  
  **"When second-order evidence is mushy (like the technician’s ‘I think it’s fresh’), should we:  
  (a) set a precise credence in the kit being fresh (e.g., 0.7) to compute an expected chance,  
  (b) allow any credence in infection within the undominated interval (0.6–0.9), or  
  (c) treat the uncertainty as symmetrical, splitting 50/50 between kit types?  
  Your urn ruling rejected 0.6, which (b) and (c) might permit—does that mean we must collapse the mushiness?"**  
  This forces her to clarify whether permissible credences require maximizing *expected* accuracy (favoring a) or avoiding dominance (favoring b), and whether symmetry is ever relevant (c). Her answer will distinguish Expected Chance (a) from Undominated Interval (b).
