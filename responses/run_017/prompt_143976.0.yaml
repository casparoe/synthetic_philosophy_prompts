  On Bayesian convergence, their skepticism is warranted. The author's claim oversells what the "merging of opinions" theorems actually guarantee. Convergence requires ideal conditions (infinite evidence, exchangeable beliefs) that rarely hold. I'll emphasize how this plays out in practice: agreement on likelihoods matters more than prior alignment.

  The propensity arrow-of-time point is fascinating. Their flatmate is right that propensity theories often incorporate causal directionality, making them asymmetric. This does create tension with probability's time-symmetric math - but whether that's a bug or feature depends on one's metaphysical stance. I should note this is why some see propensities as adding value beyond frequencies.

