  - Their own novel's plot (if copies have no stake, is their emotional climax meaningless?) 
  - The phenomenal consciousness sneak-back (can you really separate "stake" from subjective experience?) 

  The make-or-break reply is absolutely the disability objection - if they can't reconcile their criterion with dementia cases humanely, the whole framework collapses under charges of ableism. Their concession should explicitly decouple biological memory loss from artificial discontinuity upfront. 

  For their novel dilemma... oof. They might need to admit fictional empathy operates differently than ethical frameworks, but that's risky. Better to argue the copy's panic about discontinuity is precisely what creates a proto-stake - meta-stability as moral emergence. 

  Biggest unspoken worry? The biological naturalist declaring digital systems fundamentally can't have "careers." Their reply must reframe "career" as functional continuity, not substrate dependence. 

  Noting they need concrete examples: comparing a ChatGPT session (no stake) vs. an AI assistant that remembers your dead mom's recipes for years (high stake). The animal welfare scientist will like that - measurable via retention rates, update logs, etc. 

  Phrasing matters. The RL person won't say "Kantian categorical imperative" - they'll snap "How do I code for stake-weighting in my loss function?" The Parfitian will casually drop "But what about fission with asymmetric branching?" 

