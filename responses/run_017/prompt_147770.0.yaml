  First, let's map the attack vectors from each attendee type: The RL/alignment people will demand operationalization, the philosophers will attack conceptual holes, the disability scholar will cry ableism, the policy wonk will want regulatory hooks, the animal welfare scientist needs measurable proxies, and the biological naturalist will dismiss digital systems entirely. 

  The real tripwires: 
