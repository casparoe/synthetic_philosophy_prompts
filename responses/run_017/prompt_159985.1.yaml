  Next, the user's distinction between rescue and upkeep duties. Rescue is immediate and finite, while upkeep is ongoing. Singer's principle generates rescue duties, but repeated rescues could resemble upkeep. Live Aid aimed to create a temporary institution for multiple rescues. The user's split isn't confused but highlights a gap in the theory regarding sustained obligations.

  Overdetermination is a key issue. In the pond, one bystander's action is decisive. In Live Aid, individual contributions seem negligible among millions. Singer might argue for collective responsibility, but the principle struggles with individual impact in large-scale efforts. This points to a limitation in applying the analogy to mass participation scenarios.

  Downstream harm, like aid diversion or market effects, isn't covered by the exemption unless it causes comparable harm. The principle lacks tools to address systemic consequences, showing its focus on immediate rescue over complex realities.

  The use of vivid imagery in Live Aid contradicts Singer's claim that identifiability is irrelevant. This highlights the motivational challenge, even if the duty remains the same.

  Finally, does Live Aid vindicate Singer? It shows mass action based on moral duty, but the anomalies (overdetermination, systemic harm, reliance on vividness) reveal the principle's limitations beyond individual rescue scenarios. The weakest point is the rescue/upkeep distinction, as Singer's framework doesn't clearly address institutional or long-term obligations.

