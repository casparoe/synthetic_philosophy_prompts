  Below is a practical, step-by-step decision procedure for evaluating thresholds, group-specific cutoffs, or deferral band changes. It incorporates Priya's three "escapes," accounts for real-world constraints (EU data limitations, vendor models), and flags where human judgment is required. The procedure is designed for an analyst to execute in one day using SQL and a notebook.

  ---

  ### **Decision Procedure: Threshold & Deferral Band Evaluation**
  **Inputs**: Proposed threshold(s) or deferral band change, 12 months of historical data (approved loans only), model scores, repayment outcomes, and group labels (or proxy).  
  **Unit of Analysis**: Approved loans from the past 12 months (avoids stale data; outcomes are known).  
  **Hard Stops**: Trigger if any step fails. Compliance must review before proceeding.  

  #### **Step 1: Check Base Rate Differences**  
  **Goal**: Determine if group base rate gaps are practically significant.  
  **Action**:  
    - Compute repayment rates per group (e.g., Group A: 70%, Group B: 55%).  
    - **Threshold**: If absolute base rate difference < **5 percentage points**, use a single threshold (stop here).  
    - **Evidence**: Table of group counts, repayments, and base rates.  
    - **Hard Stop**: If groups are undefined (e.g., EU proxy accuracy <75%) and base rates can't be estimated.  

  #### **Step 2: Assess Calibration**  
  **Goal**: Verify if scores mean the same thing across groups.  
  **Action**:  
    - Bin scores (e.g., 0.05-width bins) and compute actual repayment rate per bin/group.  
    - **Sufficient Answer**: Expected Calibration Error (ECE) < 0.02 (2%) per group.  
    - **Evidence**: Calibration plot (score vs. actual repayment) and ECE table.  
    - **Flag for Human**: If uncalibrated (ECE ≥ 0.02) or vendor model lacks probabilities (skip to Step 4).  

  #### **Step 3: Evaluate Priya's Escapes**  
  **Goal**: Test if (1) group cutoffs, (2) deferral, or (3) feature improvements resolve conflicts.  
  **Actions & Costs**:  

  | **Escape** | **Test** | **What to Compute** | **Costs/Limitations** |
  |------------|----------|---------------------|------------------------|  
  | **(1) Group Cutoffs** | Set group-specific thresholds to equalize FPR or FNR. | - FPR/FNR at common vs. group-specific thresholds.<br>- Approval rates per group. | - **Cost**: Disparate treatment risk (legal/compliance review required).<br>- **Conflict Relocated**: Equal FPR forces unequal FNR (and vice versa). |  
  | **(2) Deferral Band** | Exclude middle band from error rates. | - Auto-approve band: Repayment rate and FNR (defaults approved).<br>- Auto-decline band: *Cannot compute FPR* (no outcomes for declined loans).<br>- Deferral rate per group. | - **Cost**: Human underwriting costs + bias in deferrals.<br>- **Conflict Relocated**: Deferral rates may differ (e.g., Group B deferred 2× more). |  
  | **(3) Better Features** | Check group score distribution overlap. | - Kolmogorov-Smirnov (KS) statistic between group score distributions.<br>- Wasserstein distance (if KS is misleading). | - **Threshold**: KS < 0.1 = distributions overlap well (use single threshold).<br>- **Limitation**: Does *not* fix base rate gaps. Only helps if KS improves. |  

  **Evidence**:  
    - Plot: Score distributions by group (highlight KS).  
    - Table: FPR, FNR, approval rates, deferral rates at proposed thresholds.  
  **Hard Stop**: If KS ≥ 0.1 and base rate gap ≥5% (distributions diverge; tradeoffs are unavoidable).  

  #### **Step 4: Decision & Compliance Flags**  
  **Goal**: Approve, reject, or escalate based on tradeoffs.  
  **Actions**:  
    - **Single Threshold**: Use if (base rate gap <5%) OR (KS <0.1 and calibrated).  
    - **Group Cutoffs**: Allow only if FPR/FNR disparity is justified (e.g., "equal opportunity" policy). *Human judgment required*.  
    - **Deferral Change**: Allow if auto-band error rates are similar *and* deferral rates differ by <10 percentage points.  
    - **Reject**: If uncalibrated vendor model + no outcomes for declined loans (FPR incalculable).  
  **Human Judgment Flags**:  
    - ![](https://via.placeholder.com/15/ff0000/000000?text=+) `Group-specific thresholds` (legal risk).  
    - ![](https://via.placeholder.com/15/ff0000/000000?text=+) `Deferral rate gap >10pp` (disparate burden).  
    - ![](https://via.placeholder.com/15/ff0000/000000?text=+) `Uncalibrated scores` (fairness unverifiable).  

  ---

  ### **Worked Examples**
  #### **Case 1: US Small-Business Book (Groups A & B)**  
  - **Base Rates**: A=70%, B=55% (gap=15% >5% → proceed).  
  - **Calibration**: ECE=0.01 (calibrated).  
  - **Escape Tests**:  
    - **(1) Group Cutoffs**: At common threshold (0.65):  
      - FPR: A=8%, B=15%  
      - FNR: A=10%, B=20%  
      - *Equal FPR (10%) forces thresholds: A=0.67, B=0.60 → FNR becomes A=12%, B=25%. Approval gap widens.*  
    - **(2) Deferral Band**: Current band (0.4–0.8):  
      - Auto-approve (≥0.8): Repay rate A=95%, B=92% (FNR similar).  
      - Auto-decline (≤0.4): *FPR incalculable (no declined outcomes).*  
      - Deferral: A=40%, B=65% (25pp gap → **flag for human**).  
    - **(3) Better Features**: KS=0.25 (distributions diverge; no escape).  
  - **Verdict**: ![](https://via.placeholder.com/15/ff0000/000000?text=+) **Deferral band hides FPR disparity and creates unequal burden. Group cutoffs trade FNR disparity for FPR parity. Compliance must choose tradeoff.**

  #### **Case 2: New Market (80% Accurate Proxy)**  
  - **Proxy Groups**: "P_A" (proxy for A), "P_B" (proxy for B).  
  - **Base Rates**: P_A=68%, P_B=52% (gap=16% >5% → proceed).  
  - **Calibration**: ECE=0.03 (uncalibrated → **flag**).  
  - **KS**: 0.18 (poor overlap).  
  - **Deferral Test**: Deferral rates: P_A=45%, P_B=70% (25pp gap → **reject**).  
  - **Verdict**: ![](https://via.placeholder.com/15/ff0000/000000?text=+) **Hard stop. Proxy inaccuracy + uncalibration + deferral gap = too risky. Use single threshold or abandon.**

  #### **Case 3: Vendor Model (Rank-Ordered Scores)**  
  - **Base Rates**: A=70%, B=55% (gap=15% >5% → proceed).  
  - **Calibration**: No probabilities → **uncalibrated (flag)**.  
  - **FPR/FNR**: *Cannot compute FPR* (no outcomes for declined loans).  
  - **Deferral Test**: Auto-approve band repayment: A=92%, B=85% → FNR gap=7pp.  
  - **Verdict**: ![](https://via.placeholder.com/15/ff0000/000000?text=+) **Hard stop. Cannot verify auto-decline fairness. Do not use for auto-decline; human-underwrite all declines.**

  ---

  ### **What the Procedure Can't Tell You**  
  1. **Outcome Label Bias**: If past lending biased repayment data (e.g., fewer loans to Group B), base rates are skewed. *Solution: Audit outcomes with external data*.  
  2. **Automation Ethics**: Whether auto-approve/decline should exist at all (e.g., high-deferral groups may need more human review).  
  3. **Causal Drivers**: Why base rates differ (e.g., systemic factors vs. model bias).  
  4. **Long-Term Shifts**: Base rates computed over 12 months may not reflect current conditions.  

  ### **Key Takeaways**  
  - Priya's escapes **relocate conflicts but rarely dissolve them**:  
    - (1) Group cutoffs trade one disparity for another.  
    - (2) Deferral hides FPR issues but creates burden imbalances.  
    - (3) Better features only help if distributions converge (KS<0.1).  
  - **Practical threshold**: Base rate gaps <5% or KS<0.1 avoid trilemma.  
  - **Always flag**: Group cutoffs, deferral gaps >10pp, and uncalibrated models.  
  - **Hard no**: Uncalibrated models with no decline outcomes (Case 3).  

  This procedure forces tradeoffs into the open, minimizes analysis time, and flags compliance risks. Use it to kill flawed proposals (like the vendor model) and escalate value judgments (e.g., "Should we tolerate higher FNR for Group B to equalize FPR?").
