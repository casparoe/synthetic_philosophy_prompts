     9. We have a fundamental issue: without outcomes for declined loans, we cannot compute FPR. We can only compute FNR for approved loans (if they are approved and then default). But for auto-decline, we have no outcome data.

     10. This leads to a hard stop: we cannot compute error rates for the auto-decline band. We can only monitor the performance of approved loans.

     11. Therefore, we cannot run the full procedure for the vendor model without either:
            a) Calibrating the model and then using a deferral band with probability thresholds, or
            b) Having a way to get outcomes for declined loans (e.g., through a pilot program).

     12. Recommendation: Do not use the vendor model for auto-decline until we have a method to estimate outcomes for declined loans. For auto-approve, we can use it but we cannot check fairness in the auto-approve band without knowing the repayment rate by group in that band. We can still compute the overall repayment rate in auto-approve, but not by group if the group labels are available.

     13. In the EU, we might not have group labels. Then we cannot do any group analysis.

  **Summary of the procedure's limitations:**

     - It relies on having outcome data for approved loans. Without that, we cannot compute base rates or error rates.
     - For declined loans, we typically don't have outcomes. This means we cannot compute false positive rates (FPR) without additional data collection (e.g., through a randomized experiment or by lending to a sample of declined loans).
     - The outcome label (whether a loan is repaid) might be contaminated by previous lending decisions. For example, if we have been more likely to approve loans in group A, then the base rate for group A might be biased because we have a selected sample. This is called selection bias. We must be cautious and try to use representative data (e.g., by including only loans that were approved under a similar policy) or use causal methods (which are beyond the scope of this procedure).
     - The procedure does not address whether automated decisions should be used at all. That is a policy question.
     - The unit of analysis (time window, population) might not be representative of the current population. We assume stationarity.

  **Final procedure steps (for the analyst):**

     Step 0: Check data availability.
          - We need: 
              - Loan applications (features, group label or proxy, model scores, decision)
              - Outcome (repaid/defaulted) for approved loans.
          - For declined loans, we don't have outcomes. We note that we cannot compute FPR without them.

     Step 1: Define the analysis population and group variable.
          - Population: Approved loans in the last 12 months that have reached outcome.
          - Group: Use the available group label (if allowed) or proxy. If using a proxy, note its accuracy if known.

     Step 2: Compute base rates by group.
          - If base rate difference <5%, use a single threshold and deferral band (go to step 5).
          - Else, proceed.

     Step 3: Check calibration (if the model outputs probabilities).
          - If not calibrated and we require calibration, then calibrate the model or mark as uncalibrated.
          - If the model does not output probabilities (like a vendor rank score), then we cannot check calibration. We must either calibrate or proceed without calibration (with caution).

     Step 4: Evaluate the escapes.

          For Escape 1 (group-specific cutoffs):
              - Compute the FPR and FNR for each group at a common threshold and at group-specific thresholds that achieve a target FPR (or FNR).
              - Produce a table for each group: base rate, threshold, FPR, FNR, approval rate.

          For Escape 2 (deferral band):
              - Using the current or proposed deferral band, compute for each group:
                  - Auto-approve band: count, repayment rate (error rate = 1-repayment)
                  - Auto-decline band: count, but we don't have outcomes -> skip FPR? We cannot compute FPR without declined loan outcomes.
                  - Deferral band: count and proportion.
              - We can only compute error rates for auto-approve (since we have outcomes for approved loans). For auto-decline, we cannot compute FPR without outcomes for declined loans.

          For Escape 3 (better features):
              - Compare the score distributions by group (KS statistic). If KS<0.1, then distributions are similar and we can use a single threshold.

     Step 5: Set the threshold(s) and deferral band.
          - If using a single threshold, set to achieve overall target error rate.
          - If using group-specific thresholds, set per group.
          - For deferral band, set to achieve target repayment rates in auto-approve and target decline rates in auto-decline (but we cannot measure the latter without declined outcomes).

     Step 6: Flag for human decisions:
          - Group-specific cutoffs (legal review).
          - Large deferral rate differences by group.
          - Use of uncalibrated scores for decision making.

     Step 7: Hard stops:
          - If we require calibration and the model is uncalibrated and cannot be calibrated -> stop.
          - If we don't have outcomes for declined loans and we want to use auto-decline, we cannot compute FPR -> we must either not auto-decline or find a way to estimate FPR.

     Step 8: Produce report.

  Given the complexity and data limitations (especially for declined loans), the procedure is necessarily limited. The analyst should document all assumptions and limitations.

  For the vendor model in Case 3, the honest answer is: without outcomes for declined loans and without calibration, we cannot ensure fairness properties. We should not use it for auto-decline, and for auto-approve we can only monitor overall performance and repayment rates by group (if group data is available) in the auto-approve band.
