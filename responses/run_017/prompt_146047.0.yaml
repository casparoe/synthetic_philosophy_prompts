  We are going to design a practical decision procedure for setting thresholds in a lending model with auto-approve, auto-decline, and human review bands. The procedure must account for algorithmic fairness impossibility results and Priya's three proposed escapes.

  The core idea: We cannot have all of (a) calibration, (b) equal FPR, (c) equal FNR when base rates differ. We must choose which trade-offs to make.

  The procedure will have the following steps:

  1. **Define the groups and time window.**
     - If we are in a region (like the EU) where protected attributes are not stored, we will use a proxy (with known accuracy) or skip group-wise analysis if the proxy is too weak. We note that group analysis is only as good as the group labels.
     - The population: recent loan applications (e.g., last 12 months) that have reached a clear outcome (repaid/defaulted). We must be cautious of selection bias (only loans we approved have outcomes).

  2. **Check for base rate differences.**
     - Compute the overall repayment rate (base rate) for each group over the chosen time window.
     - If the base rate difference between any two groups is less than 5 percentage points (practical significance threshold), then we can use a single threshold without worrying about the fairness trilemma. Skip to step 5 for a single threshold.
     - If the base rate difference is >=5%, then we must proceed with group-wise analysis.

  3. **Evaluate the score function.**
     - Check if the score is calibrated (i.e., for a given score, the repayment probability is the same across groups and matches the score value). If the model does not provide calibrated probabilities (like a vendor rank-ordered score), we must either calibrate it (using a method like Platt scaling) or note that we cannot check calibration. Without calibration, we cannot have (a). We mark this as a critical issue.

  4. **Consider Priya's escapes:**
     a. **Different cutoffs per group (Escape 1):** 
          - We can set group-specific thresholds to achieve equal FPR or equal FNR. But note: 
            - This may violate the requirement that the score means the same thing (if we are not calibrated). 
            - Also, setting different cutoffs may raise legal concerns (disparate treatment) and must be reviewed by compliance.
          - We will compute the trade-offs: What FPR and FNR do we get for each group at their own threshold? And what if we set a common threshold?

     b. **Deferral band (Escape 2):** 
          - We can use the middle band to defer cases. Then the auto-approve and auto-decline bands are only the high-confidence regions. 
          - But we must check: 
            - What are the error rates in the auto-decisions? 
            - How does deferral affect the base rates in the auto bands? 
            - We can compute the error rates (FPR, FNR) for the auto-approved and auto-declined segments, but note that the deferred cases are handled by humans and do not have a machine error. 
          - However, the human decisions themselves may have biases and errors. Moreover, the deferral band may have different composition by group, which could lead to disparate impact.

     c. **Better features (Escape 3):** 
          - If we can collect better features and the score distributions become more similar (overlap more), then the trade-offs become less severe. 
          - But note: base rates are fixed. Better features can only reduce the gap in the conditional distributions (given the features) but cannot change the base rate. 
          - We can measure the overlap by comparing the score distributions (e.g., using Wasserstein distance or KS statistic) and see if they are sufficiently similar. If the KS statistic is below 0.1 (for example), then the distributions are very similar and we can use a single threshold. 
          - However, this does not eliminate the trade-off if base rates differ, but it might make the trade-off negligible.

  5. **Decision procedure steps:**

     Step 1: **Define the population and time window.**
        - Use the last 12 months of approved loans that have matured (so we know the outcome). 
        - For groups: In the US, we have group A and B. In the EU, we use a proxy (if available and accurate enough, say >75% accuracy) or skip group analysis (if not allowed or proxy too weak). 
        - Output: A table of counts by group and outcome.

     Step 2: **Compute base rates.**
        - For each group, base rate = (number repaid) / (total approved loans in that group that have outcomes).
        - If the absolute difference in base rates between any two groups is < 5%, then we can use a single threshold. Proceed to step 5.
        - Else, proceed to step 3.

     Step 3: **Check calibration (if possible).**
        - If the model does not output calibrated probabilities (e.g., vendor model without calibration), then we cannot have (a). We must either:
            a) Calibrate the model (using a held-out set) and then proceed, or
            b) Acknowledge that we are giving up on (a) and focus on (b) and (c) (error rate balance) or other metrics.
        - Output: For each group, a calibration plot and the expected calibration error (ECE). If ECE < 0.01 (or 1%) for each group, we consider the model calibrated.

     Step 4: **Evaluate the three escapes.**

        Escape 1 (Different cutoffs per group):
          - We will compute, for each group, the threshold that would achieve a target FPR (or FNR) that we set as a policy. For example, we might want the same FPR across groups. Then we see what FNR we get for each group at that group-specific threshold.
          - We must also check: if we set a common threshold, what FPR and FNR do we get for each group?
          - Output: A table for each group with:
              - Group base rate
              - Threshold (if group-specific, what threshold; if common, the same for all)
              - FPR, FNR, approval rate
          - Then we compare the outcomes. If we use group-specific thresholds, we might achieve equal FPR but then the FNR will differ (and vice versa). Also, the approval rates will differ.

        Escape 2 (Deferral band):
          - We take the current deferral band (or a proposed one) and remove the middle band from the auto-decision error calculation.
          - We compute for the auto-approve band (scores above the upper cutoff) and auto-decline band (scores below the lower cutoff) the error rates by group.
          - We also compute the proportion of each group that falls into the deferral band. If one group is deferred at a much higher rate, that could be problematic (disparate impact).
          - Output: 
              - For each group: 
                  - Auto-approve band: count, FNR (false approvals = loans that defaulted in this band), FPR is not applicable because we are approving.
                  - Auto-decline band: count, FPR (false declines = loans that would have been repaid but were declined), FNR is not applicable.
                  - Deferral band: count and proportion of group.
              - We note that the deferred cases are handled by humans, so we don't have machine errors for them. However, we can track the human decision and outcome for these, but that is separate.

        Escape 3 (Better features):
          - We compare the score distributions for the two groups. We compute the Kolmogorov-Smirnov (KS) statistic (or Wasserstein distance) between the score distributions of the two groups. 
          - If the KS statistic is < 0.1, we consider the distributions sufficiently similar and we can use a single threshold without worrying about the trade-off (because the distributions are almost the same). 
