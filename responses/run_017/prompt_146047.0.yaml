     Step 5: **Set the threshold(s) and deferral band.**
        - If we are using a single threshold (because base rate difference <5% or because distributions are very similar), then we set the threshold to achieve a target overall error rate (e.g., FPR=0.1) and then we are done.
        - If we are using group-specific thresholds, we set them to achieve a target FPR (or FNR) per group. We must then check the resulting FNR (or FPR) and approval rates and get compliance sign-off.
        - For the deferral band, we set the upper and lower cutoffs to achieve a desired confidence level (e.g., auto-approve only when the estimated repayment probability is >90%, auto-decline when <10%). We then check the error rates in the auto bands and the deferral rates by group.

     Step 6: **Human decisions.**
        - Flag the following as requiring human (compliance/legal) input:
            - When using group-specific thresholds (because of potential legal risk).
            - When the deferral band has a significantly different deferral rate by group (e.g., one group is deferred 40% and another 20%).
            - When the model is not calibrated and we are making decisions based on uncalibrated scores.

     Step 7: **Hard stops.**
        - If the base rate difference is >=5% and we are not allowed to use group-specific thresholds (by compliance) and the distributions are not similar (KS>=0.1) and we require both calibration and equal error rates, then we have a hard stop: it's impossible. We must relax one requirement.

