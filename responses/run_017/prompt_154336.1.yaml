  ### Case Applications  

  **Assumptions:**  
  - \(B = £18M\), \(L = £12M\).  
  - Mandated project cost: £1.0M (pre-allocated).  
  - Capacity: 8 total projects (incl. mandated).  
  - All probabilities and costs pre-haircut/adjustment.  

  #### **Case A: Flagship Long-Shot**  
  - \(c = £2.2M\), \(m = 40\), \(p_{\text{analyst}} = 2.25\%\) (midpoint).  
  - Haircut: \(p_{\text{adj}} = \max(0.5 \times 2.25\%, 2.25\% - 15\%) = \max(1.125\%, -12.75\%) → 1.125\%\).  
  - Capacity: \(n = 9 → p_{\text{cap}} = 1.125\% \times 0.9 = 1.0125\%\).  
  - Common shock: \(p_{\text{final}} = 1.0125\% \times 0.82 = 0.83\%\).  
  - Log growth (100% funding):  
    \[
    \begin{align*}
    \text{Success:} & \quad 1 + \frac{2.2}{18} \times 39 = 5.76 \\ 
    \text{Fail:} & \quad 1 - \frac{2.2}{18} = 0.878 \\ 
    \text{Log growth:} & \quad 0.0083 \times \log(5.76) + 0.9917 \times \log(0.878) = -0.10 
    \end{align*}
    \]  
    - Negative → **reject**.  

  **Exploration Sub-Budget:**  
  - **Coherent if:**  
    - Size ≤5% of bankroll (£0.9M).  
    - Funded from carryover (not compounding base).  
    - Replenished only from exploration successes.  
    - Requires committee approval per use.  
  - **Verdict:** At £0.9M, Case A still requires £1.3M from base → not feasible. Exploration budget is for smaller bets.  

  #### **Case B: Dull One**  
  - \(c = £1.9M\), \(m = 2.4\), \(p_{\text{analyst}} = 60\%\).  
  - Haircut: \(p_{\text{adj}} = \max(0.5 \times 60\%, 60\% - 15\%) = 30\%\).  
  - Capacity: Assume \(n = 8 → p_{\text{cap}} = 30\%\) (no penalty).  
  - Common shock: \(p_{\text{final}} = 30\% \times 0.82 = 24.6\%\).  
  - **100% funding log growth:**  
    \[
    \begin{align*}
    \text{Success:} & \quad 1 + \frac{1.9}{18} \times 1.4 = 1.15 \\ 
    \text{Fail:} & \quad 1 - \frac{1.9}{18} = 0.894 \\ 
    \text{Log growth:} & \quad 0.246 \times \log(1.15) + 0.754 \times \log(0.894) = -0.002 
    \end{align*}
    \]  
  - **70% funding log growth:**  
    \[
    \begin{align*}
    \text{Success:} & \quad 1 + \frac{1.33}{18} \times 1.4 = 1.10 \\ 
    \text{Fail:} & \quad 1 - \frac{1.33}{18} = 0.926 \\ 
    p_{\text{final}} & = 0.8 \times 24.6\% = 19.7\% \\ 
    \text{Log growth:} & \quad 0.197 \times \log(1.10) + 0.803 \times \log(0.926) = -0.001 
    \end{align*}
    \]  
    - Both negative → **reject** if alone.  
  - **With a second identical project:**  
    - Capacity penalty: \(n = 10 → p_{\text{cap}} = 30\% \times 0.9^2 = 24.3\%\).  
    - Log growth deteriorates further → **reject both**.  

  #### **Case C: Near-Duplicates**  
  - Project 1 & 2: \(c = £1.5M\) each, \(m = 3.0\), \(p_{\text{analyst}} = 40\%\).  
  - Haircut: \(p_{\text{adj}} = \max(0.5 \times 40\%, 40\% - 15\%) = 20\%\).  
  - **If both funded:**  
    - Success correlation: 0.9 in bad years, 0.6 in normal years.  
    - If both succeed, \(m_{\text{each}} = 2.0\) (cannibalization).  
  - **Log growth (funded individually):**  
    \[
    \begin{align*}
    \text{Project 1 only:} & \quad 0.164 \times \log(1 + \frac{1.5}{18} \times 2) + 0.836 \times \log(1 - \frac{1.5}{18}) = 0.005 \\ 
    \end{align*}
    \]  
  - **Log growth (both funded):**  
    - Joint probability model:  
      - Normal year (87.5%):  
        - Both succeed: \(0.6 \times 20\% \times 20\% = 2.4\%\) → \(m = 2.0\) each  
        - One succeeds: \(32\%\) → \(m = 3.0\)  
      - Bad year (12.5%):  
        - Both succeed: \(0.9 \times 2.8\% \times 2.8\% = 0.07\%\) → \(m = 2.0\) each  
    - Expected log: **-0.012** (due to cannibalization and correlation).  
  - **Verdict:** Fund only **one** (positive log growth).  

  ---

  ### Limitations and Breaking Points  
  **Load-Bearing Assumptions:**  
  1. **Multiplicative Bankroll with Barrier (60% of weight):**  
     - **What breaks it:** If corporate recapitalizes you after falling below £12m, Kelly becomes too conservative.  
     - **Test:** Track corporate’s response to losses in other divisions. If recapitalized, switch to fractional Kelly (e.g., 50% of bet sizes).  
     - **Failure mode:** Over-betting if recapitalization likely.  

  2. **Probability Estimates After Shrinkage (40% of weight):**  
     - **What breaks it:** If your haircut (\(p_{\text{adj}}\)) is consistently too pessimistic, you’ll under-bet.  
     - **Test:** Compare 2-year rolling average of forecasted vs. actual success rates. If actual > forecasted + 10%, reduce haircut severity.  
     - **Failure mode:** Miss high-value projects due to over-shrinkage.  

  **What the Procedure Cannot Do:**  
  - **Handle non-linear interactions beyond correlation/capacity:** E.g., if Project A’s success boosts Project B’s success probability.  
  - **Out-of-model risks:** E.g., regulatory changes collapsing \(m\) for an entire class.  
  - **Horizon mismatch:** Kelly assumes perpetual play, but a 5-year corporate review truncates the upside. Mitigation: Add a 20% penalty to \(m\) for projects with >3-year payback.  

  **Extrapolations Beyond Theory:**  
  - **Barrier survival > growth optimization:** We prioritize \(B \geq L\) over log growth (e.g., Case B rejection). Strict Kelly doesn’t model barriers.  
  - **Common shock adjustment:** The 18% penalty is calibrated to your history but may miss tail correlations.  

  **Cheap Validation Metrics (Next 2 Years):**  
  1. Track forecasted vs. actual success rates for haircut calibration.  
  2. Simulate "bad year" scenarios: If cohort failure rate exceeds 95%, increase common shock penalty.  
  3. Monitor capacity slippage: If success rate drops >12% when \(n > 8\), tighten capacity factor.  

  **Expected Misfires:**  
  - **False negatives (Cases A and B):** Safe projects with thin data rejected due to haircut. Mitigation: Use exploration budget for 1–2 small bets per cycle.  
  - **Correlation misestimation (Case C):** If cannibalization is overestimated, you’ll underfund duplicates. Mitigation: Review commercial overlap annually.  

  **When to Abandon the Procedure:**  
  - If corporate recapitalizes you below \(L\).  
  - If your success rate variance doubles (e.g., due to climate change).  
  - If mandated project exceeds 25% of bankroll.  

  **Final Note:** This is a *robust* procedure, not an *optimal* one. It prioritizes survival in a low-data, high-stakes environment. Recalibrate haircuts and shocks annually.
