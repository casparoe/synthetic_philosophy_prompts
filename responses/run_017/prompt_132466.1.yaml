answer: |-
  ## Sestina for the Closing Turn

  The scepter first, held high in summer’s gold,
  Its weight a promise kept by watchful council.
  The gathered voices swore upon the charter,
  No private fist would seize the common good.
  No hoarded wealth behind the guarded vault
  Could match the justice rising on the street.

  But seasons shift; the clamor on the street
  Grows cold towards the gleam of fading gold.
  Distrust now stains the chamber where council
  Debates the clauses of the fading charter.
  They guard their names within the family vault,
  Forgetting what sustained the public good.

  What measure serves a fractured common good?
  The mob now gathers, restless on the street,
  Demanding what was locked within the vault –
  Not wisdom, but the glint of promised gold.
  They tear the fragile page, the ancient charter,
  And scorn the whispers of the hollowed council.

  A strong hand rises, silencing the council,
  Declaring *this* the swift return to good.
  He waves a scrap recalling some old charter,
  Claims order for the fury of the street.
  His cloak is stiff with thread of tarnished gold,
  His coffers filled from every broken vault.

  The grasping few now crowd the inner vault,
  Their whispers louder than the silenced council.
  They mint new debts with ink like liquid gold,
  Proclaiming greed the engine of the good.
  Their guarded gates ignore the hungry street,
  Their law a mockery of the shredded charter.

  Is this the shape the founders called the charter?
  This counting-house within the guarded vault,
  This narrow lane excluding half the street?
  A brittle echo of the first, bold council
  Mistakes compliance for the civic good,
  And pays its guard with coin of baser gold.

  The gilded cage feels heavier than gold.
  The brittle charter cracks within the vault.
  The street demands: *What council serves our good?*

  **Envoi**
  The wheel turns: the scepter (thin, new gold),
  The fist, the vault, the street, the fading council –
  A brittle charter for a lesser good.

  ---

  **Note (118 words):**
  End-words map to Polybius’s cycle:
  1.  **Scepter = Kingship** (initial legitimacy)
  2.  **Council = Aristocracy** (rule by the few, initially virtuous)
  3.  **Charter = Democracy** (founding law/people’s rule)
  4.  **Fist = Tyranny** (forceful usurpation)
  5.  **Vault = Oligarchy** (rule by the wealthy/few, corrupt)
  6.  **Street = Mob Rule/Ochlocracy** (chaotic popular uprising)

  The **restoration discount** manifests as thinning resonance: later appearances of "scepter," "council," and "charter" feel diminished despite similar language. The **archive effect** causes acceleration: stanzas tighten syntactically (shorter clauses, less connective tissue) and images (like the vault, the street’s anger) recur with increasing speed and less preparation. The drift from initial weight to final brittleness registers across the poem’s texture.
