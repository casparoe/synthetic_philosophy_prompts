prompt: |-
  I'm one of four volunteers who decide who gets money out of a small emergency hardship fund at the community centre where I help out. Grants up to about £400, we meet every fortnight, twenty or so aplications a time, and we have to write a sentence explaining each decision — to the applicant, and to whoever takes my place when I stop. I've been doing it three years, I'm the one who trains the new people, and honestly I don't know what I'm handing on.

  I've been trying to write down what counts for and what counts against, and I can't, and I don't think it's because I haven't tried hard enough. Here's what we've actually decided, going by gut.

  - Family living nearby: normally counts against, they can help. For one woman whose family is who she's hiding from, it counted hard in favour — she needed money to get out of the area.
  - Money in the bank: normally against, use it first. For an applicant with £900 saved, which was a deposit on a room in another city where she'd been offered work, it counted for — we topped it up so she wouldn't have to break into it.
  - A car: normally against, sell it. For a man on nights at a warehouse with no bus route, it counted for, it's how he keeps the job.
  - We've helped them before: normally against. For a man who'd come twice in fifteen years, it counted for — it showed he only asks when it's really bad.
  - The application came in three weeks late: normally against. Then we found out she's dyslexic and it took her a month to find someone to read the form to her, and the lateness just stopped counting against. But the dyslexia on its own isn't a reason to give her money either — it doesn't make her needier. I don't know what kind of fact that makes it.
  - Which is like: "he was abrupt with our volunteer on the phone" — I don't think that's a reason against at all. Not a weak reason that gets outweighed, just nothing. Whereas "he's got a job" is a real reason against for some applicants and no reason at all for others, and a job that pays so little you're still choosing between food and the meter feels like it isn't the same fact, but maybe I'm kidding myself there.
  - The pair I can't reconcile: we gave money to the woman who needed a deposit to get to a confirmed job in another city, and we turned down a man who wanted money for a van so he could take a building job forty miles away. Same shape, opposite decisions. I can't tell you the difference except that his plan felt like a punt.

  My flatmate did a philosophy MA and when I told her all this she said something about particularism and "holism", and I genuinely can't tell if she was taking the piss.

  So: is there a principle, or a small set of them, that actually gets these verdicts? Not a list of factors to weigh, I can write that myself — I mean something that says why the same fact points one way here and the other way there. Is there such a thing as a default way a fact counts, with exceptions, or does that fall apart as soon as the exceptions have exceptions? Which of my verdicts would you throw out rather than invent a clause for, and which do you think I've got wrong in a way I can't see? Be definite about it, please — don't lay out both sides and leave me to pick, tell me what you think is really going on and why.

  Two more things. First, one off tomorrow's list, a real one: single dad, works, asking for £300 for a laptop because his son's school moved everything online and the kid has been doing homework on a phone; £400 in the bank, has a car, and his ex has written in to say he's fine and doesn't need it. Say what your account says about that one even if it isn't the answer I want. Second: what do I actually tell the new volunteers — hand them a list, or tell them to sit in on five meetings and get a feel? If there's no principle in this, how is it that I've got better at it? Or have I.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're part of a committee deciding on emergency hardship grants, and they're struggling to formalize their decision-making process. The examples they provided show how context flips the significance of facts—like family nearby usually counting against an applicant unless they're fleeing abuse. 

  Hmm, the user seems frustrated by the inconsistency. They mention trying to write down principles but hitting a wall. Their flatmate's "particularism" comment might actually be relevant here—it's a philosophical concept where moral judgments depend entirely on context. 

  The van vs. deposit case stands out. Both involve relocation for work, but one felt solid (confirmed job) while the other felt like a gamble ("a punt"). That suggests the committee subconsciously evaluates feasibility and risk. 

  For the single dad case: school laptop request. The ex-wife's objection is suspicious—why would she intervene unless there's more to it? The £400 savings might be an emergency fund he shouldn't drain. But the kid's education is urgent. I'd probably approve partial funding if possible. 

  Training new volunteers... a rigid list would fail given how context-dependent this is. Shadowing makes sense, but they need frameworks too—like "always ask: what's the consequence of NOT helping?" and "distinguish between barriers and actual hardship." 

  The user's growth in this role likely comes from pattern recognition—their brain has catalogued hundreds of edge cases. That's why they "get better" without formal rules. The real challenge is transferring that implicit knowledge. Maybe pairing newbies with experienced reviewers for live discussions would help more than manuals.
answer: |-
  Your struggle isn't about effort; it's about the nature of practical wisdom. You're encountering **moral particularism**: the idea that the moral significance of a fact depends entirely on its context within a specific situation. There is no universal "default" where a fact (like family nearby or savings) *always* counts for or against, nor a simple list of exceptions. Instead, you're assessing the **functional role** of each fact within the applicant's *overall narrative of hardship and resilience*.

  Here's a principle-based framework explaining your decisions and the single dad case, derived from your examples:

  **Core Principle:** **Funds are for *overcoming acute hardship directly threatening immediate stability* (housing, safety, essential income, critical health/welfare) where no feasible alternative exists, *without undermining existing resilience*.**
  This principle has two key lenses applied simultaneously:

  1.  **The Vulnerability Lens:** How severe and immediate is the hardship? What core stability is threatened? (Safety, shelter, essential income, critical health/child welfare).
  2.  **The Resilience Lens:** What resources (internal or external) *should reasonably be used first*? Is the request actually *preserving* future resilience? Does the applicant have a track record of responsible self-management?

  **Applying the Framework to Your Examples:**

  *   **Family Nearby (Normally Against):** *Resilience Lens:* Family is a *reasonable alternative resource*. *Vulnerability Lens:* Hardship is less acute if family help is available.
  *   **Family Nearby (Fleeing Abuse - For):** *Vulnerability Lens:* Acute threat to *safety* overrides normal resilience assumption. Family isn't a resource; it's the *source* of vulnerability. Using funds *builds* resilience (escape).
  *   **Savings (Normally Against):** *Resilience Lens:* Savings exist *to be used* for emergencies. Using them first preserves finite community funds for those with *no* buffer.
  *   **Savings (Deposit for Job/City Move - For):** *Resilience Lens:* Using savings *here* would destroy critical future stability (deposit). Funds *preserve* this resilience. *Vulnerability Lens:* Move secures *essential income*. It's an investment in ending hardship.
  *   **Car (Normally Against):** *Resilience Lens:* A car is a significant asset that *can* be liquidated (often) to solve the problem, indicating an alternative resource.
  *   **Car (Essential for Night Job - For):** *Vulnerability Lens:* Losing the car directly threatens *essential income*. *Resilience Lens:* The car *is* the resilience mechanism for maintaining income. Selling it solves short-term hardship but creates long-term vulnerability (job loss).
  *   **Helped Before (Normally Against):** *Resilience Lens:* Suggests potential pattern of reliance on the fund over building personal resilience/using other resources. Fund is finite.
  *   **Helped Before (Twice in 15 Years - For):** *Resilience Lens:* Demonstrates *extremely* restrained use, indicating the hardship is likely truly exceptional/severe. Shows responsible management.
  *   **Late Application (Normally Against):** *Resilience Lens:* Suggests poor planning/urgency management, potentially indicating less acute need or poor resource management. *Vulnerability Lens:* Might imply less severe hardship.
  *   **Late Application (Due to Dyslexia - Neutral):** *Resilience Lens:* The lateness factor is explained by a *barrier* (dyslexia), not a lack of resilience or diminished urgency. It doesn't speak to the *substance* of the need. The dyslexia itself isn't a *reason for* funding unless it directly *caused* the hardship (e.g., lost job solely due to dyslexia).
  *   **Abrupt on Phone (Neutral):** *Resilience/Vulnerability Lenses:* Personality/style doesn't directly correlate with level of genuine hardship or responsible resource management. It's irrelevant noise.
  *   **Has a Job (Variable):** *Resilience Lens:* Job = income = primary resilience tool. *Against:* If income is sufficient to handle the hardship *with budgeting/liquidation of other assets* (e.g., savings), or if the job itself is stable and the hardship unrelated. *For/Neutral:* If income is below subsistence level (job exists but hardship persists - "heat or eat"), or if the job is precarious and the hardship threatens it (e.g., uniform needed, transport failing). The *functional reality* of the job's income matters, not its mere existence.
  *   **Deposit for Confirmed Job (For) vs. Van for Building Job (Against - "Punt"):** *Vulnerability Lens:* Both target essential income. *Key Difference: Feasibility & Specificity of Resilience Building.*
      *   **Deposit:** Specific, confirmed job offer in hand. Move secures immediate income. Barrier is purely financial (deposit). Funding directly overcomes the barrier to *known* stability. Low risk.
      *   **Van:** Job seems speculative ("building job" - is it confirmed? Full-time? Long-term?). Van is a *tool* for potentially getting work, not overcoming a specific barrier to a secured position. Feels like funding a *business startup risk* or enabling unstable gig work, not solving an acute barrier to secured essential income. Higher risk of funding not achieving stability.

  **The Single Dad Case (£300 laptop, £400 savings, car, ex-wife objection):**

  1.  **Vulnerability Lens:** **High.** The child's education is critical welfare. Doing homework on a phone is demonstrably inadequate, hindering development and potentially violating educational rights. This is an acute need *directly impacting the child's immediate well-being and future prospects*.
  2.  **Resilience Lens:**
      *   *Savings (£400):* While a resource, £400 is a minimal emergency buffer. Draining it entirely for the laptop leaves *no* cushion for a real emergency (e.g., car repair, illness). Using *all* savings here potentially creates *greater* future vulnerability.
      *   *Car:* An asset, but likely essential for work/childcare. Selling it to buy a laptop would likely create worse hardship (loss of job/income, inability to transport child).
      *   *Ex-Wife Objection:* Highly suspicious. Why would she intervene? It suggests potential conflict or misinformation, but it's *not evidence* the child doesn't need the laptop for schoolwork. It's an external opinion, not a fact about the need or the child's situation.
      *   *Work:* Shows income/resilience, but the request implies income isn't sufficient to cover this *specific, unexpected, essential expense* without hardship.

  **Verdict: Fund the laptop (likely partially or in full, perhaps with condition child uses it for school).** The vulnerability (child's education) is high and immediate. The resilience factors don't provide a *reasonable alternative*: draining minimal savings creates new risk, selling the car is disproportionate and harmful, the ex-wife's objection is irrelevant to the child's demonstrable need. The hardship is specific and funding directly resolves it, preserving the child's stability. The £400 savings might argue for partial funding (£200-£300) to preserve some buffer, but denying it risks significant harm to the child.

  **What to Tell New Volunteers:**

  1.  **Start with the Core Principle & Lenses:** Explain the "Acute Hardship vs. Resilience" framework explicitly. Give them the principle and the two questions: "What core stability is *immediately* threatened? What resources *reasonably* exist to handle this *without* our funds?"
  2.  **Provide Your Factor List... as Context Cues:** Give them your list (family, savings, car, etc.), but frame it: "These are common facts. They aren't rules. Their meaning *always* depends on the story. Ask: Does family help or hurt *here*? Are savings a buffer to preserve or a resource to use *here*? Is the car essential income or an asset to sell *here*?"
  3.  **Emphasize Narrative:** "We need to understand the *whole story* – how do all the pieces fit together to create the hardship and what options exist? Look for the *functional role* of each fact."
  4.  **Mandate Shadowing (5+ Meetings):** This is non-negotiable. They *must* see the principle and lenses applied to real, messy cases. Hearing the discussion is crucial.
  5.  **Use Case Studies:** Walk them through past examples like the ones you gave (woman fleeing family, deposit vs. van) using the framework. Ask *them* to apply the lenses to the single dad case.
  6.  **Focus on Key Questions:** Train them to ask:
      *   "If we say no, what concretely happens tomorrow/next week?"
      *   "Is there truly *no other way* for them to solve this?"
      *   "Does funding this *solve the acute problem* or just delay it/kick the can?"
      *   "Does funding this *preserve* their future stability or *undermine* it?"
  7.  **Acknowledge Gut, but Demand Articulation:** "Your gut is pattern recognition. If something feels off (like the 'punt'), use the lenses to articulate *why*. Is the vulnerability unclear? Is the resilience plan shaky? Demand the *why* behind the feeling."

  **Why You've Gotten Better:**

  You've developed **practical wisdom (phronesis)**. Through repeated exposure to diverse cases, your brain has built a vast, subconscious library of patterns and exceptions. You intuitively grasp the functional role of facts within a narrative context. You're not applying rigid rules; you're recognizing constellations of factors and their interplay within a unique story of vulnerability and resilience. This *is* a skill, honed by experience and reflection. It's why a pure list fails, and why shadowing is essential for new volunteers – they need to build their own pattern library within the guiding framework of your core principle.

  **Definite Conclusions:**

  *   **Throw Out:** Trying to assign a universal "default" direction to facts (e.g., "car always counts against"). It *always* depends.
  *   **You Got "Wrong" (Subtly):** Thinking "He was abrupt" could *ever* be a weak reason outweighed. It should be **irrelevant** unless it indicates fraud (extremely rare). Focus solely on the substance of need and management. Also, the Dyslexia/Lateness case: you nailed it. Lateness explained = neutral. Dyslexia alone = not a reason *for* funding.
  *   **Single Dad:** Fund the laptop. The child's need is clear, acute, and critical. The objections (savings, ex-wife) don't provide a reasonable alternative solution without creating equal or worse hardship.
  *   **Tell New Volunteers:** **Both.** Give them the **Core Principle & Lenses framework** **AND** make them **shadow multiple meetings**. The framework provides the essential structure; the shadowing builds the contextual intuition. Without the framework, shadowing is confusing; without shadowing, the framework is sterile.

  You aren't handing on a rulebook; you're handing on a *craft*. The principle and lenses are the tools; the experience observing how they're applied is the apprenticeship. That's what you've mastered.
