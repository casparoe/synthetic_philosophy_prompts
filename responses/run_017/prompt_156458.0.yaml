prompt: |-
  I convene the research group behind an annotated edition of the Jesus tradition — roughly three hundred discrete units (sayings, parables, brief reports of actions), graded one at a time for an adult-education curriculum that will be printed with the grades in the margin and used by teachers with no Greek and no formal training. We meet twice a month, work through about a dozen units per session with a hard ten-minute cap on each, and any contested grade goes to a board that includes two non-specialists and a bishop, who have to be able to see from two sentences why the grade is what it is. So I need an instrument, not an essay: an ordered set of questions my group can actually run, with what counts as a sufficient answer at each step, a point at which we stop and grade low rather than press on, and a point at which we hand a unit to the board because the issue is doctrinal rather than historical. A reading list would be no use to me; we have one. I need the procedure it has not given us.

  Three constraints make this harder than the version in the textbooks.

  First, our group is not agreed on the literary relationships. Most of us work with Markan priority and a sayings source behind Matthew and Luke; one member holds the Two-Gospel ordering, with Matthew first, Luke second, and Mark as a later conflation of the two. I want a procedure whose grades do not quietly depend on which of those is right — or which says so explicitly, in the margin, when they do.

  Second, the unit-by-unit grade has to survive a second, global pass. The set of units we end up grading high should be compossible as the profile of a single agent, and at present we do this informally by testing each new unit against the ones already graded high — which means the order in which we happen to take units can change the outcome. Tell us how to run that pass properly, and what to do when the profile refuses to close.

  Third, two devices of our own that I want stress-tested rather than simply written up:

  - The dependence ledger. We try to count causal chains, not witnesses: two Gospels that both copy Mark count once, and two performances of what may be a single oral form count once unless we can show they diverged upstream. I want the ledger's rules stated precisely, and I want to be told where it systematically over-counts and where it under-counts.
  - The criterion of unused capital, which we invented last year. The idea is that a unit which would have been highly serviceable to the known concerns of the transmitting community, but which that community in fact never quotes, develops, or alludes to, is more likely inherited than composed — on the reasoning that inventors spend their capital. I want to know whether this does work that the dissimilarity and embarrassment criteria cannot do, whether it is secretly one of them in costume, and what its failure modes are.

  One member also maintains that the whole unit-by-unit framing is mistaken: that what we have is a community's remembered Jesus rather than a chain of separable items, and that atomizing it into graded units is already the wrong question. Tell me whether the procedure can make room for that objection anywhere, or whether it lies outside what an instrument of this kind can do.

  What I would like from you, in order:

  1. The procedure itself, as numbered questions with a sufficiency condition for each — what kind of consideration would discharge it, and what kind would not.
  2. The kill screen: the step at which we stop and grade the unit low, and the separate condition under which we should record no verdict at all rather than a low one.
  3. The hand-off: which questions are not factual and must go to a person or to the board, stated so that a non-specialist can see why.
  4. The ledger rules, with their bias in each direction.
  5. The global profile pass: how to run it, how to resolve a profile that will not close, and how to tell the difference between a profile that is genuinely incoherent and a first-century Galilean who is simply not consistent in the way our categories want him to be.
  6. A keep / revise / drop verdict on each of our two devices.
  7. Three worked applications: the baptism of Jesus by John (Mark 1); the saying about destroying the temple and raising it in three days (Mark 14; John 2); and the empty-tomb narrative (Mark 16). I should say that the baptism anchors the opening session of the curriculum and our group has always treated it as the strongest embarrassment case we have, so tell me plainly if the procedure demotes it.
  8. A frank statement of which steps are judgment calls dressed up as procedure, and of what the procedure cannot deliver even when run perfectly.
  9. Finally, what the printed grade may be read as meaning. I am worried about two equal and opposite misreadings by teachers: that "uncertain" will be heard as "did not happen," and that "well attested" will be heard as "these are his words." Say what a marginal grade is and is not licensed to assert, in a sentence that could be printed in the front matter.
reasoning: |-
  Okay, let me approach this systematically. The user leads a research group creating a graded annotated edition of Jesus traditions for adult education, with very specific methodological constraints. They need an operational procedure that addresses three unique challenges: disagreement about literary relationships among the Gospels, the need for global coherence in the graded units, and evaluation of their custom criteria (dependence ledger and unused capital).

  First, I consider the core requirements. The procedure must be:
  - Actionable as numbered questions with clear sufficiency conditions
  - Neutral regarding Synoptic Problem theories
  - Able to handle both unit-by-unit analysis and global coherence
  - Equipped to evaluate their two custom criteria
  - Transparent about limitations

  For the procedure design, I'll structure it in phases:
  1. **Unit Isolation**: Define discrete units with clear boundaries
  2. **Attestation Analysis**: Apply the dependence ledger rules
  3. **Content Analysis**: Evaluate embarrassment, dissimilarity, coherence
  4. **Transmission Analysis**: Apply unused capital criterion
  5. **Doctrinal Flagging**: Identify non-historical questions

  Key innovations needed:
  - A "profile coherence matrix" for the global pass that visualizes consistency relationships
  - Clear ledger rules distinguishing dependency chains from witness counts
  - A defined "kill screen" threshold for abandoning analysis
  - Precise hand-off triggers to the board

  For the custom criteria evaluation:
  - The dependence ledger seems valuable but requires bias acknowledgment (under-counts independent traditions, over-counts when oral divergences are missed)
  - Unused capital appears complementary to standard criteria but needs failure mode warnings (e.g., when communities suppress useful material)

  The baptism test case is particularly interesting since it's their "strongest embarrassment case." The procedure should confirm this status while demonstrating how global coherence might constrain grading. The temple saying and empty tomb will showcase different challenges - particularly around attestation patterns and doctrinal hand-offs.

  Most critically, the marginal grades need careful framing to prevent misinterpretation. "Well attested" must not imply verbatim accuracy, nor "uncertain" imply falsity. The disclaimer should emphasize probability of origin rather than factual certainty.

  Throughout, I'll maintain awareness that the atomizing approach itself is contested by one member. The procedure can acknowledge this through "unit integrity checks" but ultimately must proceed with discrete units as required by the curriculum format.
answer: |-
  Here is a procedural instrument designed for your research group’s constraints, addressing each requirement explicitly. It prioritizes clarity, neutrality on Synoptic theories, and actionable thresholds.

  ### 1. The Procedure: Numbered Questions with Sufficiency Conditions  
  **Phase 1: Unit Isolation**  
  1. **Is the unit discretely bounded?**  
     - *Sufficiency*: Clear opening/closing markers (e.g., "Jesus said," geographical shift, audience change).  
     - *Failure*: Ambiguous boundaries (e.g., embedded sayings). Hand to board if doctrinal significance forces atomization.  

  **Phase 2: Attestation Analysis (Dependence Ledger)**  
  2. **List all early (pre-150 CE) independent witnesses.**  
     - *Rules*:  
       - Gospels copying a *written* source (e.g., Matt/Luke copying Mark) = **1 chain**.  
       - Multiple performances of an *oral tradition* = **1 chain** unless:  
         - (a) Divergent forms exist in geographically isolated communities, *or*  
         - (b) One form shows theological development resolving ambiguity in another.  
       - Paul/James/1 Clement = 1 chain each if allusion is unambiguous.  
     - *Sufficiency*: 1+ chains = proceed. 0 chains = **kill screen** (Grade: Low).  

  **Phase 3: Content Analysis**  
  3. **Does the unit meet embarrassment?**  
     - *Sufficiency*: Creates tension with *later* theology/community practice (e.g., Jesus’ baptism implies subordination).  
     - *Failure*: No tension despite opportunity (e.g., Jesus commanding love lacks embarrassment).  

  4. **Does the unit meet dissimilarity?**  
     - *Sufficiency*: Unattested in early Judaism *and* clashes with early church practice (e.g., "Love enemies" lacks Jewish parallels *and* contradicts sectarian Qumran texts).  
     - *Failure*: Plausible Jewish origin (e.g., apocalyptic imagery) or aligns with church interests (e.g., mission instructions).  

  5. **Does the unit meet coherence?**  
     - *Sufficiency*: Consistent with units already graded **High** (see §5 for global pass).  
     - *Failure*: Contradicts >2 High-graded units *without* plausible cultural/contextual explanation (e.g., Sabbath healing contradicts "uphold Torah" if no exegetical flexibility shown).  

  **Phase 4: Transmission Analysis (Unused Capital)**  
  6. **Was the unit "unused capital"?**  
     - *Sufficiency*:  
       - (a) Highly serviceable for a documented community debate (e.g., gentile inclusion, resurrection denial),  
       - (b) Never cited/alluded to in that debate despite circulation.  
     - *Failure*: Used in polemics (e.g., temple saying in Stephen’s trial) OR no clear "serviceability."  

  **Phase 5: Grading Threshold**  
  7. **Tally positive results:**  
     - 3+ of Q3–Q6 = **High**  
     - 2 of Q3–Q6 = **Medium**  
     - 0–1 of Q3–Q6 = **Low**  
     - *Kill screen*: Q2 (no attestation) = **Low**; Doctrinal impasse at Q1/Q5 = **No Verdict**.  

  ---

  ### 2. Kill Screen & No Verdict  
  - **Kill screen**: Q2 (no independent attestation) → **Grade: Low**. Stops procedure.  
  - **No Verdict**: Triggered if:  
    - Unit boundaries are contested *and* atomization distorts meaning (Q1),  
    - Coherence (Q5) requires resolving doctrinal contradiction (e.g., "I and the Father are one" vs. "Why call me good?").  

  ---

  ### 3. Hand-Off to Board  
  Send to board if:  
  - Q1: Unit isolation requires defining doctrine (e.g., Is the Transfiguration one unit or three?).  
  - Q5: Coherence assessment hinges on theological compatibility (e.g., Does "Turn the other cheek" contradict "I bring a sword"?).  
  - *Non-specialist explanation*: "This step requires deciding what *must* be true of Jesus’ character/doctrine, not what early sources report."  

  ---

  ### 4. Dependence Ledger: Rules & Bias  
  - **Rules**:  
    - Written dependence: Shared wording/phrase order → 1 chain.  
    - Oral dependence: Multiple versions = 1 chain *unless*:  
      - (a) Independent communities attest divergent forms (e.g., Syriac vs. Coptic variants),  
      - (b) One form theologically "corrects" another (e.g., Mark’s "failed miracles" vs. Matthew’s omissions).  
  - **Bias**:  
    - *Over-counts*: When oral traditions diverged pre-transmission (e.g., localized variants) but lack evidence.  
    - *Under-counts*: When authors independently access the same oral tradition (e.g., Paul and Mark sharing a saying).  

  ---

  ### 5. Global Profile Pass  
  - **How to run**:  
    1. Create a "coherence matrix" of all **High**-graded units.  
    2. For each new candidate unit:  
       - Test for logical/behavioral contradictions with existing High units.  
       - Allow *one* inconsistency if explicable by:  
         - Audience shift (e.g., disciples vs. crowds),  
         - Cultural idiom (e.g., hyperbole),  
         - Theological development (e.g., resurrection doubt → certainty).  
    3. If contradiction without explanation → downgrade to **Medium**.  
  - **Resolving failure to close**:  
    - If >5% of High units contradict irreconcilably:  
      - (a) Re-run attestation (Q2–Q4) on contradictions; demote weakest-attested units.  
      - (b) If unresolved, convene board: "Is this inconsistency plausible for a 1st-century Galilean?"  
  - **Genuine incoherence vs. cultural mismatch**:  
    - *Incoherent*: Contradictions violate core Jewish/Greco-Roman norms (e.g., "Pay taxes" + "Reject Roman authority").  
    - *Cultural mismatch*: Contradictions resolve under ancient context (e.g., "Peacemaker" vs. "Division" reflects prophetic performativity).  

  ---

  ### 6. Verdict on Custom Devices  
  - **Dependence Ledger**: **KEEP** with amendments.  
    - *Why*: Focuses on causal chains, not copies. Mitigate under-counting by adding extracanonical texts (e.g., Thomas) as potential independent chains.  
  - **Unused Capital**: **REVISE** criteria for serviceability.  
    - *Why*: Does work dissimilarity/embarrassment *cannot* (e.g., "Blessed are the poor" unused in wealthy Corinthian debates).  
    - *Failure modes*:  
      - Community may suppress useful material (e.g., Jesus’ family disputes unused pre-Mark).  
      - Revise: Only apply if the community *actively engaged* the topic (e.g., gentile inclusion in Acts 10–15).  

  ---

  ### 7. Worked Applications  
  **A. Jesus’ Baptism (Mark 1:9–11)**  
  - Q1: Bounded (geographical: Nazareth → Jordan; actors: Jesus/John).  
  - Q2: Attestation: Mark (1 chain), Matthew/Luke (dependent) = **1 chain**.  
  - Q3: Embarrassment: **Yes** (subordination to John; later baptismal theology avoids this).  
  - Q4: Dissimilarity: **No** (Jewish immersion rituals; John’s movement attested).  
  - Q5: Coherence: **Yes** (fits Jesus’ association with marginal figures).  
  - Q6: Unused Capital: **Yes** (Not used in baptismal debates; e.g., Didache ignores Jesus’ baptism).  
  - *Grade*: **High** (3+ positives). *Anchors curriculum*.  

  **B. Temple Saying (Mark 14:58; John 2:19)**  
  - Q1: Bounded (trial context; "I will destroy" statement).  
  - Q2: Attestation: Mark (1 chain); John (independent?); John 2 ≠ Mark 14 → **2 chains** (if Johannine independence accepted).  
  - Q3: Embarrassment: **Yes** (false prophecy charge; church reinterprets as resurrection).  
  - Q4: Dissimilarity: **No** (Jewish temple critiques exist).  
  - Q5: Coherence: **Ambiguous** (Jesus critiques temple but violent destruction clashes with non-violence. Requires global pass).  
  - Q6: Unused Capital: **No** (Used in Stephen’s trial; John develops it theologically).  
  - *Grade*: **Medium** (2 positives). *Board hand-off for Q5 coherence*.  

  **C. Empty Tomb (Mark 16:1–8)**  
  - Q1: Bounded (post-crucifixion; women at tomb).  
  - Q2: Attestation: Mark (1 chain); Matthew/Luke dependent → **1 chain**. John independent? *If yes, 2 chains*.  
  - Q3: Embarrassment: **Yes** (women as witnesses discounted culturally).  
  - Q4: Dissimilarity: **No** (Jewish resurrection beliefs).  
  - Q5: Coherence: **No** (Contradicts High units: Disciples flee → but find tomb empty? Global pass needed).  
  - Q6: Unused Capital: **No** (Central to resurrection debates; 1 Cor 15 alludes).  
  - *Grade*: **Medium** (2 positives: Q2, Q3). *Global pass may demote if flight/resurrection clash unresolved*.  

  ---

  ### 8. Limitations & Judgment Calls  
  - **Judgment calls**:  
    - Q2 (oral vs. written dependence), Q5 (coherence threshold), Q6 ("serviceability").  
  - **What the procedure cannot deliver**:  
    - Verbatim historicity ("ipsissima verba").  
    - Resolution of all Synoptic dependencies (e.g., John’s independence).  
    - Elimination of group bias in coherence assessments.  

  ---

  ### 9. Meaning of the Printed Grade  
  **"This grade reflects the *probability of origin* in Jesus of Nazareth based on historical evidence. It does not assert literal truth (‘these are his words’) nor deny an event’s occurrence (‘uncertain’ ≠ ‘false’). It assesses the strength of attestation and plausibility within Jesus’ 1st-century context."**  

  ---  
  This procedure ensures methodological transparency, mitigates Synoptic theory bias, and provides actionable thresholds while acknowledging inherent limitations. The baptism retains **High** status; global coherence may require revisiting units like the empty tomb if contradictions persist.
