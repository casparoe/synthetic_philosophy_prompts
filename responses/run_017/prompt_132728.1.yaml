answer: |-
  **INSTITUTE FOR PRIORITIES IN SUFFERING REDUCTION**  
  Human Subjects Committee (HSC/IPSR)  
  REF: HSC/23/4512/PI  

  Date: 2023-10-27  

  Dr. A. Querant  
  Principal Investigator  
  Department of Applied Axiology  
  Institute for Priorities in Suffering Reduction  

  **Subject: Determination Regarding Protocol Applications HSC/23/4512-A through D**

  Dear Dr. Querant,

  The Human Subjects Committee, convened under Standing Order 7.1 (Ethical Review of Suffering-Involving Protocols), has completed its review of the four (4) associated protocol applications submitted under the above reference. Determinations were reached during the 147th Quarterly Plenary Session (2023-10-25) in accordance with the Institute's Charter, the *Lexicon of Suffering Prioritization* (2022 Revision), and referenced Guidance Notes. The Committee resolved that:

  **1. Regarding Protocol HSC/23/4512-A (Trial of Novel Analgesic "AlleviX"):**
      *   The protocol proposes a double-blind, placebo-controlled trial involving 10,000 post-operative patients. The active arm administers AlleviX; the control arm administers saline placebo.
      *   The Investigator's Risk Assessment (Annex A.3) acknowledges a calculable probability, estimated at 1 x 10<sup>-6</sup> per participant in the control arm, of an adverse event involving pain exceeding the established Intensity-Duration Threshold (IDT). The potential supra-threshold suffering is characterized as transient (≤ 5 minutes) but intense (projected ≥ 720 points on the Standardized Suffering Metric [SSM-1000]).
      *   The projected benefit is the reliable alleviation of significant, though sub-threshold, post-operative pain (rated 550 ± 50 SSM-1000 points) for approximately 9,950 participants in the active arm (accounting for a 5% estimated non-response rate).
      *   **Determination:** REFUSED.
      *   **Rationale (HSC Resolution 147.12a):** The Committee resolved that the presence of *any* calculable probability (p > 0) of supra-threshold suffering within the protocol design necessitates refusal, irrespective of the magnitude of p or the projected sub-threshold benefits accruing to other participants. Supra-threshold suffering possesses lexical priority; its potential occurrence cannot be offset by any quantum of sub-threshold relief or pleasure generation elsewhere within the study cohort or beyond. The Committee notes the significant projected sub-threshold benefit is ethically inadmissible as a countervailing factor in this determination (cf. *Lexicon*, Principle 3: Non-Compensability Above Threshold). The Committee further resolved to note, for the Investigator's future guidance (Cross-Reference: Guidance Note 2: Expedited Review), that protocols involving *zero* participants carry no calculable probability of supra-threshold harm and are routinely approved via Tier-1 Expedited Review within five (5) working days.

  **2. Regarding Protocol HSC/23/4512-B (Validation of "QuickAssess" Pain Scale):**
      *   The protocol involves inducing calibrated, transient pain stimuli (rated by the Investigator at 7/10 on the Visual Analogue Scale [VAS]) in 50 healthy volunteers to validate correlation with the novel QuickAssess scale.
      *   The Investigator submitted the VAS ratings and requested equivalency mapping to the SSM-1000 as per Standing Order 4.5.
      *   **Determination:** APPROVED, subject to Standard Conditions 1-7 (Monitoring & Exit Debriefing).
      *   **Rationale (HSC Resolution 147.12b):** The Committee resolved to accept the HSC Secretariat's standardized conversion of the described VAS 7/10 stimulus to 690 points (± 5 points) on the SSM-1000, as per the Institute's Standard Equivalency Table (Annex B to Standing Order 4.5). The Committee resolved that a score of 690 points is definitively sub-threshold (Threshold: 700 SSM-1000 points). The Investigator's proposed alternative scale (QuickAssess) and its internal scoring were noted for the record but deemed irrelevant to the threshold determination, which relies solely on the SSM-1000 mapping (Cross-Reference: Guidance Note 3: Scale Primacy). As the induced suffering is sub-threshold and transient, standard approval conditions apply.

  **3. Regarding Protocol HSC/23/4512-C (Longitudinal Study of Minor Discomfort Tolerance):**
      *   The protocol proposes exposing 12,000 participants to two (2) brief, identical cold-pressor stimuli (rated 650 SSM-1000 points, duration 30 seconds) separated by a one-week interval, measuring tolerance decay.
      *   The Investigator proposes utilizing the Standing Offset Schedule (SOS, Rev. 8) to compensate participants, offering a choice of refreshments valued cumulatively at 1.2 Offset Units (OUs) per stimulus session (e.g., gourmet coffee @ 0.4 OU, pastry @ 0.8 OU).
      *   **Determination:** APPROVED IN PRINCIPLE, subject to MAJOR MODIFICATION and Standard Conditions 1-7.
      *   **Rationale (HSC Resolution 147.12c):** The Committee resolved that the individual stimulus (650 SSM-1000 points) is sub-threshold. The use of the SOS is therefore permissible; the proposed offset of 1.2 OUs per stimulus was deemed sufficient to counterbalance the sub-threshold suffering incurred per participant per session, based on the SOS valuation tables. *However*, the Committee expressed significant concern regarding the proposed *repeated exposure* (two stimuli) *within the same participant*. The Committee resolved that while each stimulus is individually sub-threshold, the potential for cumulative or synergistic effects, though not quantified in the application, introduces unresolved ambiguity regarding the aggregate experience potentially approaching or breaching the IDT. To mitigate this unquantified risk, the Committee resolved to amend the protocol: **The study population shall be increased to 24,000 participants. Each participant shall receive only ONE (1) cold-pressor stimulus exposure.** All other protocol parameters, including SOS offsets per stimulus session, remain unchanged. This modification eliminates the ambiguity associated with repeated sub-threshold exposures in the same individual (Cross-Reference: Guidance Note 4: Determining Whether a Procedure Is Sub-Threshold, attached).

  **4. Regarding Protocol HSC/23/4512-D (Calibration of "ThresholdDetect" Diagnostic):**
      *   The protocol involves a single, fully informed and consenting volunteer enduring a precisely controlled supra-threshold pain stimulus (rated 710 SSM-1000 points, duration 90 seconds) to calibrate the ThresholdDetect device.
      *   Validation of ThresholdDetect is projected to prevent an estimated 28,000 instances per annum of the *identical* supra-threshold pain (710 SSM-1000 points) in clinical patients undergoing a specific high-risk procedure.
      *   **Determination:** REFUSED.
      *   **Rationale (HSC Resolution 147.12d):** The Committee resolved, with regret noting the significant projected future benefit, that the protocol necessitates the deliberate induction of a verified supra-threshold suffering (710 > 700 SSM-1000). The *Lexicon* (Principle 3) explicitly voids any offsetting mechanism, including the SOS, for supra-threshold suffering. Furthermore, the projected prevention of future supra-threshold suffering in 28,000 individuals *cannot* ethically justify the deliberate induction of supra-threshold suffering in one individual. Suffering above the threshold does not aggregate across individuals for the purposes of offsetting; each supra-threshold instance possesses absolute, non-negotiable negative weight. The Committee further resolved that this determination would remain unchanged even if the future suffering prevented was itself rated at 699 SSM-1000 points (i.e., sub-threshold but maximally severe), as sub-threshold suffering, irrespective of quantity or severity below the line, cannot counterbalance *any* supra-threshold suffering. The volunteer's explicit, documented consent, while ethically commendable in other contexts, is not a variable within the Committee's suffering-calculus framework and does not alter the fundamental arithmetic of lexical priority (Cross-Reference: *Lexicon*, Principle 4: Consent Irrelevance Above Threshold).

  **Dissenting Minutes (Summarized):**

  *   **Dr. E. Bliss (Member):** "While respecting the framework, I dissent on Protocols A and D. The infinitesimal risk in A is practically negligible; refusing it denies vast sub-threshold relief. In D, one brief supra-threshold episode, willingly undertaken, prevents tens of thousands – a net suffering reduction any sensible calculus must endorse. The rigid threshold impedes optimal harm minimization." (Voting Record: Approve A & D)
  *   **Dr. M. Nihil (Member):** "I dissent on Protocols B and C. Assigning a value of 690 is sophistry; suffering near the threshold is abhorrent and its deliberate inducement for trivial 'offsets' like pastries is morally repugnant. The threshold should be zero. All inflicted suffering, however 'sub-threshold,' is an ethical cost requiring the strongest justification, rarely met by mere research convenience." (Voting Record: Refuse B & C)

  The Committee acknowledges the Investigator's diligence in preparing these applications within the Institute's challenging ethical framework. The determinations reflect the Committee's unwavering commitment to the principles of Lexical Threshold Negative Utilitarianism as enshrined in our foundational documents. We believe rigorous adherence to these principles provides the only coherent defence against the authorization of intolerable harms.

  Should you wish to seek clarification or submit revised protocols adhering to these determinations, please contact the HSC Secretariat.

  Yours faithfully,

  <Signature>
  **Dr. T. Vorpel**  
  Chairperson, Human Subjects Committee  
  Institute for Priorities in Suffering Reduction

  ---

  **Appendix: Guidance Note 4: Determining Whether a Procedure Is Sub-Threshold**

  **HSC/IPSR GUIDANCE NOTE 4 (Rev. 3)**  
  *Determining Whether a Procedure Is Sub-Threshold*

  1.  **Purpose:** This Note provides procedural guidance for the Human Subjects Committee (HSC) and Investigators in determining whether a proposed intervention or experience involving suffering qualifies as "Sub-Threshold" per the *Lexicon of Suffering Prioritization* (2022 Rev.), thereby permitting potential offsetting under the Standing Offset Schedule (SOS).
  2.  **Threshold Definition:** The Intensity-Duration Threshold (IDT) is defined as 700 points on the Institute's Standardized Suffering Metric (SSM-1000). Procedures rated **below** 700 SSM-1000 points are Sub-Threshold. Procedures rated **at or above** 700 SSM-1000 points are Supra-Threshold.
  3.  **Scale Primacy:** The SSM-1000 is the sole metric for threshold determination. Alternative scales (e.g., VAS, NRS, proprietary scales) must be converted to the SSM-1000 using the Institute's Standard Equivalency Table (Annex B to Standing Order 4.5). Scores on alternative scales hold no independent weight in threshold assessment.
  4.  **Single-Instance Assessment:** The Sub-Threshold status is assessed **per discrete instance of suffering** caused by the procedure. A single instance is defined as a contiguous experience perceived by the subject as arising from a single identifiable cause or intervention within the protocol.
  5.  **Non-Aggregation of Sub-Threshold Instances:**
      *   Multiple Sub-Threshold instances **within the same subject** cannot be aggregated to reach or surpass the IDT. Each instance is evaluated independently for its Sub-Threshold status.
      *   *However*, the HSC retains discretion under Standing Order 7.4(c) to impose protocol modifications (e.g., limiting repeated exposures, increasing intervals between exposures, increasing participant numbers) if the *cumulative or synergistic impact* of multiple Sub-Threshold instances on a single subject introduces significant ambiguity regarding potential de facto approximation or breach of the IDT, or undue psychological burden approaching the threshold's significance. The primary goal is to ensure each discrete instance remains unequivocally Sub-Threshold *in isolation* and that the protocol structure does not create experiences functionally equivalent to Supra-Threshold suffering.
  6.  **Offsetting Permitted Only Sub-Threshold:** The Standing Offset Schedule (SOS) **only** applies to suffering definitively rated below 700 SSM-1000 points. Offsetting mechanisms (e.g., pleasurable experiences, compensation) are **void and ethically inadmissible** for any suffering rated at or above 700 SSM-1000 points. Consent does not reactivate offsetting potential for Supra-Threshold suffering.
  7.  **Uncertainty:** If the SSM-1000 rating of a procedure is ambiguous or falls within a disputed range near the threshold (e.g., 695-705), the HSC will typically require additional validation, impose more stringent monitoring, or refuse the protocol if ambiguity cannot be resolved satisfactorily to guarantee the rating is definitively below 700 points. The principle of caution applies (cf. Guidance Note 2: Expedited Review, Sec. 5).
