   Sentence 1 (s1):
     Verdict: simplification
     What's right: The argument from illusion does start with cases like the bent stick in water, and it does argue that we are aware of something (a sense-datum) that is not the mind-independent object.
     What's wrong: The argument typically says that we are aware of an appearance (which may be a sense-datum) and that this appearance is not identical to the stick. But note that the argument from illusion is about perceptual relativity and leads to the idea of sense-data. However, the disjunctivist would object that in the illusion case, we are not aware of a sense-datum in a way that implies a common factor with the veridical case.
     Disjunctivist rejoiner: In the illusion case, one is not aware of a sense-datum that is the same kind of thing as what one is aware of in the veridical case. The disjunctivist would say that in the illusion, one is having an experience that is not of a mind-independent object, but that experience is not of the same kind as the veridical one. The disjunctivist may even deny that there is an object of awareness (like a sense-datum) in the illusion.

   Sentence 2 (s2):
     Verdict: simplification
     What's right: The argument does claim that the subjective indistinguishability between the good case (veridical) and the bad case (illusion or hallucination) leads to the conclusion that even in the good case, we are only aware of sense-data.
     What's wrong: The argument from illusion typically focuses on illusions (where there is an object but it appears other than it is) and then extends to hallucinations (where there is no object). The slide from illusion to hallucination is important, and disjunctivism often focuses on the hallucination case to make the point about the common-kind assumption. Also, the disjunctivist would deny that the two states are of the same kind, so the inference is blocked.
     Disjunctivist rejoiner: The disjunctivist denies that the two states (veridical and hallucinatory) are the same kind of state, so the indistinguishability does not imply that what we are aware of in the good case is a sense-datum. In the good case, we are directly aware of the mind-independent object.

   Sentence 3 (s3):
     Verdict: fair
     What's right: This is a standard characterization of disjunctivism: it denies the common-kind assumption and holds that veridical perception and hallucination are different kinds of states.
     What's wrong: nothing (or very minor). Some disjunctivists might prefer to say that the states are fundamentally different without necessarily being different in kind (if 'kind' is taken too strongly), but this is nitpicking.
     Disjunctivist rejoiner: none needed.

   Sentence 4 (s4):
     Verdict: misrepresentation
     What's right: Disjunctivists do deny the indistinguishability premise in the sense that they deny that the states are the same, but they do not deny that they can be subjectively indistinguishable.
     What's wrong: The disjunctivist does not typically say that the indistinguishability premise is false. They accept that the states can be subjectively indistinguishable from the first-person perspective. What they deny is that this indistinguishability implies a common mental state or object. The point about the disjunction is that the disjunctivist holds that the two states are disjuncts of a disjunctive state, but that disjunction is not based on a common factor. The disjunctivist does not say that if they were indistinguishable, there would be nothing for the disjunction to be about. In fact, disjunctivism is precisely a way to account for the disjunction without a common factor.
     Disjunctivist rejoiner: The disjunctivist would say that the two states are subjectively indistinguishable but that this does not entail that they share a common mental component. The disjunction is about the nature of the experience: either it is a genuine perception of an external object or it is a hallucination (which may be a different kind of state). The disjunctive account does not require a common factor.

   Sentence 5 (s5):
     Verdict: misrepresentation (straw man)
     What's right: Disjunctivists are committed to the idea that in a hallucination, one is not aware of a mind-independent object. But they do not necessarily say that the subject is not aware of anything at all.
     What's wrong: Disjunctivists typically do not hold that the hallucinator is aware of nothing. They may hold that the hallucinator is having an experience that is introspectively indistinguishable from a veridical one, but that in the hallucination, there is no object being perceived. However, they might say that the hallucinator is aware of an appearance or a mental state (without endorsing sense-data). Alternatively, some disjunctivists (like Martin) hold that hallucinations are states that lack the object-involving character of veridical perceptions, but they are still experiences. The claim that the hallucinator is not aware of anything at all is a misrepresentation.
     Disjunctivist rejoiner: In hallucination, the subject is having an experience that is subjectively like a perception, but that experience does not involve awareness of any mind-independent object. However, the subject is still having an experience and may be aware of the experience itself (as a mental event) or of how things seem.

   Sentence 6 (s6):
     Verdict: misrepresentation (straw man)
     What's right: Disjunctivists do owe an account of how we can tell the difference between perception and hallucination, but they do not typically claim that one can always tell, just by reflection, which state one is in.
     What's wrong: Disjunctivists do not hold that we have infallible access to whether we are perceiving or hallucinating. In fact, they accept that from the first-person perspective, one cannot always tell. They might say that reflection can sometimes reveal the presence of an object (if one is in the good case) but that in the bad case, one might be fooled. The disjunctivist account does not require that we can always tell by reflection.
     Disjunctivist rejoiner: The disjunctivist does not claim that we can always tell by reflection whether we are perceiving or hallucinating. What they claim is that the two states are metaphysically distinct, and that in the good case, we are directly aware of the external object. The inability to tell by reflection is exactly why the common factor view is tempting, but the disjunctivist argues that this epistemological point does not entail a common metaphysical factor.

   Sentence 7 (s7):
     Verdict: fair
     What's right: This captures the main motivation for disjunctivism: to secure direct realism and block skepticism. The disjunctivist does claim that perceptual experience in the good case puts us in direct contact with mind-independent objects, and that this undermines the skeptical worry that experience might be completely disconnected from the world.
     What's wrong: nothing major. One might quibble about the phrase "puts us in direct contact" (if it implies a causal theory that some disjunctivists might reject) but overall it is a fair statement of the payoff.
     Disjunctivist rejoiner: none needed.

   Sentence 8 (s8):
     Verdict: simplification
     What's right: The disjunctivist view does emphasize the causal connection in the good case and accuses the common-factor theorist of denying that we ever really see the external object (because we only see sense-data).
     What's wrong: It is an oversimplification to say that the whole view amounts to the claim that in the good case experience is causally hooked up. Disjunctivism is not just about causation; it is about the nature of the experience being constitutively dependent on the object. Also, the common-factor theorist might not say we never see tables (they might be indirect realists who say we see tables via sense-data, or representationalists who say we see tables by having representations of them). But the disjunctivist's point is that the common-factor view does not allow for direct perception of the table.
     Disjunctivist rejoiner: The disjunctivist would clarify that the good case involves a state that is constitutively related to the object, not merely causally. And they would say that the common-factor view leads to indirect realism, where we are only directly aware of internal representations.

   Now, for the "fairest_sentence": 
     We choose s7 because it captures the main motivation of disjunctivism without any obvious distortion. Why: It correctly identifies the anti-skeptical payoff and the direct contact with the external world.

   The_switch: 
     The slide occurs between s1 and s2. The argument from illusion (in s1) is about an illusion (the bent stick in water). Then in s2, the argument moves to indistinguishability and concludes about the good case. But note that the example in s2 is about a "stick-look" that is subjectively indistinguishable from "genuinely seeing a bent stick". This is a slide from illusion to hallucination because the stick-look in the illusion is being compared to the veridical case, but the argument then uses the possibility of hallucination (a case where there is no stick at all) to argue that even in the veridical case we are only aware of sense-data. Disjunctivism typically focuses on the hallucination case to deny the common-kind assumption, but the argument from illusion itself often relies on the possibility of hallucination to make the case for sense-data in the veridical case. The slide changes what disjunctivism has to claim because disjunctivism must deny the common-kind assumption for both illusions and hallucinations, but the argument from illusion is often extended by the argument from hallucination to threaten the veridical case.

   Graded_variant:
     We are to evaluate the friend's "graded disjunctivism": seeing and hallucinating as ends of a continuum, with the environment's contribution varying.

     - works: partly
