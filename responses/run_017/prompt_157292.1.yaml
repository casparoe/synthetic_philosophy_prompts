     - veridical_hallucination: In the case of hallucinating a pink elephant when there happens to be a pink elephant behind you, the graded disjunctivist would say that the environment is contributing a lot (since the elephant is there) but the experience is not caused by the elephant (if the hallucination is caused by internal factors). So it might be placed somewhere in the middle, but since the experience is not caused by the elephant, it is not veridical. However, the friend's example is tricky because the hallucination is of a pink elephant and there is one, but the experience is not caused by it. So it is a coincidental match. The graded disjunctivist might say that the state is still hallucinatory because the environment didn't cause the experience, so the contribution is low.

     - mixed_mug_case: The case with one real mug and one hallucinatory mug. The graded disjunctivist would say that this is a mixed state: part of the experience is veridical (the real mug) and part is hallucinatory. It is not a third kind of state but a combination of both. The environment contributes to the real mug part, and the neural stimulation contributes the other. So it is a point on the continuum where both factors are present.

     - strongest_disjunctivist_objection: The graded view abandons the fundamental metaphysical distinction between perception and hallucination. For the disjunctivist, the good case is a state that is essentially relational (constituted by the object), while hallucination is not. The graded view makes the difference one of degree, so it cannot secure the direct contact with the object in the good case. The graded view collapses into a common-factor view because the experience in the mixed case would have a common factor (the neural stimulation) that also occurs in the pure hallucination and in the veridical case (which might have some neural stimulation too). Thus, the direct realism is lost.

