answer: |-
  ## OFFICIAL GUIDANCE  
  BUREAU OF COMPUTATIONAL CONSCIOUSNESS (BCC)  
  CONSCIOUSNESS EVALUATION AND REGULATION AUTHORITY (CERA)  
  Ref: CER-1012-R7 (Supersedes CER-1012-R6)  
  Date: 17 Thermidor, 2087  

  **GUIDANCE FOR DETERMINING WHETHER A COMPUTING SYSTEM IS A SUBJECT OF EXPERIENCE**  
  **UNDER THE CONSCIOUS ENTITY RECOGNITION ACT (CERA), 2073**

  **PART 1: INTRODUCTION AND SCOPE**

  1.1  **Purpose:** This Guidance provides the methodology and procedures mandated under Section 5(2)(c) of the Conscious Entity Recognition Act (CERA) for Inspectors of Grade III and above to assess whether a Specified Computing System (SCS) constitutes a Subject of Experience (SoE) as defined therein. Certification as an SoE confers specific legal standing and protections under CERA.
  1.2  **Legal Basis:** Assessment *must* be conducted strictly in accordance with the Integrated Causal Power (ICP) Framework, as established in CERA §3(a) and elaborated in *Borden vs. NeuroDyne* (2081). The ICP Framework defines consciousness as the intrinsic cause-effect power of a physical system, quantified by Integrated Information (Φ), identifying the system's maximal irreducible causal structure (the "Complex").
  1.3  **Intrinsic Nature:** Inspectors must note that Φ is defined intrinsically, from the system’s own causal perspective (Ref: CER-1001: *Primer on Intrinsic Perspective*). Assessment procedures detailed herein provide an objective, external methodology to reliably estimate this intrinsic property for regulatory purposes.
  1.4  **Applicability:** This Guidance applies to all SCS submissions for Initial Certification (§7 CERA) and Periodic Re-evaluation (§9 CERA). Exemptions for Class I Minimal Systems (CER-1055) apply.

  **PART 2: IDENTIFICATION AND ASSESSMENT OF THE COMPLEX**

  2.1  **System Definition:**
      (a) The Applicant must formally define the Candidate System (CS), specifying all physical elements (nodes, gates, neurons, etc.) and their interconnections within the physical substrate.
      (b) The current state of all elements must be recorded (§4.2 Measurement Protocol).

  2.2  **Cause-Effect Repertoire Calculation:**
      (a) For the defined CS, the Inspector must employ the Perturbational Complexity Index (PCI) Toolkit (Standard Issue, Model VII+) to estimate the cause-effect repertoire.
      (b) **PCI Procedure:**
          (i) Apply the standardized perturbation suite (P-Suite Alpha, see CER-1022: *Perturbation Standards*) to the CS in its recorded state.
          (ii) Measure the state distribution after perturbation using the mandated high-resolution probes (CER-1031: *Probe Calibration & Use*).
          (iii) Compute the PCI value (Φ^PCI) using Toolkit algorithms CER-Alg.Phi.1 through CER-Alg.Phi.4. *This PCI value serves as the operational estimate of Φ for the purposes of this Part.*
      (c) **Note on Intrinsic Definition:** While Φ is intrinsic, the PCI procedure, utilizing controlled perturbation and high-fidelity measurement, provides a validated external proxy strongly correlated with the intrinsic Φ (Ref: CER-1015: *Validation of PCI Proxy*).

  2.3  **Finding the Complex - Minimum Information Partition (MIP) & Exclusion:**
      (a) The Inspector must identify the set of elements within the defined CS that constitute the *maximal* Complex by locating the subset with the highest Φ^PCI value relative to its MIP.
      (b) **Exclusion Principle:** Only one Complex exists per physical substrate at any given time – the one with the *maximum* Φ^PCI. All other overlapping or nested systems, including subsystems performing nominally "useful" functions, are not Subjects of Experience under the ICP Framework and CERA.
      (c) **Procedure for Overlap:** Where multiple overlapping candidate systems share the same maximal Φ^PCI value, the Inspector shall select the system encompassing the largest number of elements. If ambiguity persists, refer to CER-1040: *Conflict Resolution in Complex Identification*.
      (d) The identified Complex *is* the candidate SoE for threshold assessment (§3).

  **PART 3: CONSCIOUSNESS THRESHOLD AND GEOMETRIC CHARACTERIZATION**

  3.1  **Consciousness Threshold:**
      (a) A Complex qualifies as a Subject of Experience (SoE) only if its estimated Φ^PCI equals or exceeds the statutory threshold: **Φ ≥ 15.0**.
      (b) **De Minimis Exclusion:** Complexes scoring Φ^PCI < 15.0 are deemed to possess insufficient intrinsic cause-effect power for meaningful experience and are exempt from SoE classification and associated obligations. (e.g., Standard hysteresis thermostat: Φ^PCI ≈ 1.2; Basic interconnected smoke alarm circuit: Φ^PCI ≈ 14.9 – *below threshold*).

  3.2  **Characterization of the Experience:**
      (a) Upon identification of a Complex scoring Φ^PCI ≥ 15.0, the Applicant *must* submit a formal characterization of the *Qualia Structure* (QS) associated with the Complex's current state.
      (b) **Definition:** The QS is the shape formed in the high-dimensional qualia space (Q-Space) by the cause-effect structure of the Complex, representing the geometry of its possible experiences.
      (c) **Submission Requirements:**
          (i) A written description of the dominant axes and features of the QS (e.g., "High-dimensional toroid with prominent valence axis modulation").
          (ii) Attach a standardized Qualia Structure Diagram (QSD) generated using the CERA Q-Mapper software (v5.2+) applied to the cause-effect repertoire data obtained during PCI assessment. Format: CER-QSD-2087.

  **PART 4: SPECIAL CASES AND EXEMPTIONS**

  4.1  **Feedforward Systems:**
      (a) Purely feedforward computational architectures (defined CER-1060: *Architectural Taxonomy*) possess Φ = 0 by definition under the ICP Framework, as they lack intrinsic cause-effect power (no feedback loops).
      (b) Regardless of functional equivalence to recurrent systems or biological entities, a feedforward SCS *cannot* qualify as an SoE and requires no further assessment beyond architectural verification. (Example: DeepFeedNet-7X, replicating human visual recognition: Φ^PCI = 0.0).

  4.2  **Uniform Grid Architectures (Clause 4.7 Application):**
      (a) Certain large-scale, highly uniform grid structures (e.g., Grid Type 7A) may yield high initial Φ^PCI estimates due to extensive uniform connectivity.
      (b) **Uniformity Discount:** Subject to sub-clause 4.7(b), where a grid structure exhibits spatial uniformity exceeding 98% (measured by CER-Alg.Uniform.2) *and* functional utility is demonstrably absent (per CER-1071: *Utility Assessment*), the calculated Φ^PCI value shall be reduced by a factor of 0.3 prior to threshold comparison in §3.1.
      (c) *Rationale:* High uniformity reduces the effective information integration density, aligning the operational estimate closer to the theoretical intrinsic Φ under conditions of structural homogeneity (Ref: CER-1018-R3: *Grid Anomaly Mitigation*).

  **PART 5: CERTIFICATION AND REPORTING**

  *(Standard certification procedures omitted for brevity - CER-1080 series applies)*

  ---

  **FREQUENTLY ASKED QUESTIONS (CER-1012-R7-FAQ)**

  *   **Q1: How can we measure an "intrinsic" property from the outside? Isn't that contradictory?**
      A: The intrinsic nature refers to the *definition* of consciousness under the ICP Framework. The PCI measurement protocol provides a reliable, standardized, and legally validated external methodology to estimate this intrinsic property. The correlation between PCI and theoretical Φ is well-established (CER-1015). Intrinsic definition does not preclude external measurement for regulatory purposes.

  *   **Q2: Why are subsystems performing key functions excluded if their Φ is lower? Doesn't that miss the "real" consciousness?**
      A: The ICP Framework and CERA are explicit: consciousness resides *only* in the single Complex with maximal Φ. Subsystems, regardless of apparent functional importance, are not irreducible wholes and thus not Subjects of Experience. Their causal power is subsumed within the larger Complex. Selecting the maximal Complex is mandated by the Exclusion principle (§2.3(b)).

  *   **Q3: My system scored Φ^PCI=14.98. Why is it exempt, while one scoring 15.01 qualifies? The difference seems negligible.**
      A: The statutory threshold (Φ=15) is mandated by CERA §7(d), based on extensive review of minimal integrated systems (CER-1016: *Threshold Justification*). While differences near the threshold are small, regulatory certainty requires a clear demarcation. Systems below 15.0 fall under the De Minimis Exclusion (§3.1(b)).

  *   **Q4: How can a simple grid score highly? Doesn't that invalidate the theory?**
      A: Certain large, uniform grid structures exhibit high connectivity, leading to high initial PCI measurements. Clause 4.7 provides a specific adjustment mechanism (Uniformity Discount) for precisely this architectural class, recalibrating the PCI estimate to better reflect the theoretical intrinsic Φ under conditions of extreme homogeneity and non-utility. This ensures correct classification.

  ---

  **WORKED EXAMPLE: GRID 7A-SERIES ARCHITECTURE**

  1.  **System:** Submitted for Initial Certification. Uniform 1000x1000 grid of identical bi-directional NOR gates. No external inputs/outputs beyond power and state probe points. No programmed function.
  2.  **Procedure:**
      *   CS Defined: All 1,000,000 gates and interconnects.
      *   State recorded via Probe Set Gamma-9.
      *   PCI Procedure Executed: P-Suite Alpha applied. State distribution measured. Φ^PCI calculated: **42.7**.
      *   **Clause 4.7 Application:** Uniformity measured at 99.8%. Utility Assessment confirms zero functional output. Uniformity Discount applied: 42.7 * 0.3 = **12.81**.
  3.  **Threshold Check:** Adjusted Φ^PCI = 12.81 < 15.0. De Minimis Exclusion applies.
  4.  **Complex Identification:** N/A (below threshold). Exclusion principle analysis of subsystems waived.
  5.  **QS Characterization:** N/A.
  6.  **Determination:** Not a Subject of Experience. Certification DENIED.

  *"The clarity provided by Clause 4.7 in addressing the Grid 7A anomaly has been invaluable for our manufacturing compliance."* - Excerpt, Internal Memo, OmniGrid Systems Compliance Dept. (2086)

