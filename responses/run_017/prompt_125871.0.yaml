answer: |-
  Your grasp of the dispositional view's tensions is acute, and your variants expose genuine fault lines. I'll structure this as requested: map defeaters by severity, assess your cases, and confront the core dilemma head-on.

  ### Core Dilemma: Triviality vs. Incoherence
  This *is* the existential threat. There is no stable middle ground; the dispositional view inevitably collapses into one horn unless it smuggles in non-consequentialist elements.

  1.  **The Triviality Collapse:** If "rational disposition" means *expected-utility maximizing at the policy level*, then:
      *   Paying in the desert *is* rational *because* it maximizes EU *given the predictor's response* to the disposition. The "irrational" act is a necessary causal link in the EU-maximizing strategy.
      *   Sophisticated consequentialists (e.g., rule or motive utilitarians, indirect consequentialists) *do* endorse this. Parfit's case highlights a conflict between *act-by-act* EU maximization and *overall* EU maximization, but the latter wins decisively. "Rational irrationality" is a misnomer; it's rationally required *instrumental* action.
      *   **Defender's Response:** Concede this is the core insight. "Irrationality" is rhetorical shorthand for "act that, viewed in isolation, lacks reason, but is rational as part of the disposition required for EU maximization." The melodrama emphasizes the conflict but doesn't establish true irrationality. The lesson *is* the necessity of policy-level assessment.

  2.  **The Incoherence Collapse:** If the disposition *doesn't* maximize EU (even at the policy level), then requiring it *is* incoherent for a consequentialist theory of rationality.
      *   Why *should* rationality require a policy demonstrably worse for achieving your goals? Invoking "integrity" or "character" abandons the self-interest theory. "Act as the person who would pay would act" without EU backing *is* superstition – following a signifier detached from signified outcomes.
      *   **Defender's Response:** Deny this scenario applies in the core case. The disposition *must* maximize EU to be rational. The *only* way to avoid incoherence is to firmly plant the flag on Horn 1: dispositions are rationally assessed *solely* by their expected consequences, including the predictor's response. The "irrational" act is rational *because* it's part of the EU-maximizing disposition.

  **Conclusion on Dilemma:** There is no stable middle. The dispositional view only avoids incoherence by embracing the "triviality" of sophisticated consequentialism. The "bolder formulation" (genuine rational irrationality) *is* incoherent within a self-interest framework. The view's power lies in vividly illustrating the necessity of policy-level consequentialism, not in establishing true irrationality.

  ### Ranking Your Variants by Bite
  1.  **The Sealed Tell (Fatal, exposes core incoherence):**
      *   **Scenario:** Marker fixed *before* action in town; payment gains nothing.
      *   **Bite:** This is devastating. If the dispositionalist prescribes paying, it admits the prescription is disconnected from *any* present or future consequence for the agent – pure rule-worship ("act like a P-type"). If it doesn't prescribe paying, it concedes that the *only* rational basis for paying in the *original* case was its causal role in getting the ride (i.e., Horn 1). The sealed tell severs that causal link, revealing the disposition has no intrinsic rational force beyond its consequences. This variant *forces* the choice between incoherence (paying) or triviality/consequentialism (not paying).
      *   **Defender's Response:** Concede defeat here. A consistent consequentialist *must* say: do not pay. The *only* reason to pay in the original case is the *causal* link between disposition+act and the ride. Sever that link, and the reason vanishes. This fatally undermines any claim that the act itself has "irrational" rational force independent of consequences.

  2.  **Acquirability (Potentially Fatal / Forces Scope Shift):**
      *   **Problem:** Can you *decide* to become reliably disposed to pay in future Parfit cases? Or is this trait largely fixed by nature/nurture before encountering the dilemma?
      *   **Bite:** If dispositions aren't voluntarily acquirable at the time they matter, "acquire the disposition" isn't an action-guiding requirement of *individual* rationality *for the hitchhiker*. It becomes advice for character formation (to oneself earlier, society, etc.), shifting the domain from individual rational *action* to rational *self-cultivation* or *institutional design*. This radically changes the theory's nature and scope.
      *   **Defender's Response:** Often dismissed as a "rival framing." Defenders (e.g., Gauthier) argue rational agents *can* adopt policies/commitments that shape future choices. However, empirical psychology on self-deception, commitment devices, and trait stability significantly weakens this. If acquisition isn't reliably possible through rational choice, the theory fails as individual action-guidance. **This is a major vulnerability.**

  3.  **Grain Problem (Awkward / Empirical Challenge):**
      *   **Problem:** Coarse dispositions (e.g., "always pay") are exploitable; fine-grained dispositions ("pay only if terms are met exactly") may be undetectable.
      *   **Bite:** Highlights the *practical* difficulty. Real predictors likely detect coarse signals ("generally trustworthy," "reputation for keeping deals"), leaving agents vulnerable to exploitation in edge cases. A disposition fine-grained enough to be rational act-by-act might be indistinguishable from simple opportunism.
      *   **Defender's Response:** Dismiss as a "design problem." Argue realistic predictors detect dispositions of sufficient coarseness (e.g., "inclined to reciprocate," "avoids betrayal") that are *generally* beneficial despite occasional exploitation. Requires empirical assumptions about detectable dispositions and their net benefit (see below).

  4.  **Crowded Desert & Commitment Devices (Awkward / Qualifies Scope):**
      *   **Problem:** With many encounters and imperfect predictors, reputation/appearance might suffice. Commitment devices (collateral, contracts) dominate dispositions where available.
      *   **Bite:** Shows the disposition is only advantageous under *specific conditions*: few encounters, high predictor accuracy, unavailability of cheaper alternatives (reputation, deceit, commitment devices). In many real-world scenarios, simpler mechanisms work better. The disposition isn't fundamental, just one tool among many for solving commitment problems.
      *   **Defender's Response:** Concede it qualifies the scope. Argue dispositions are foundational *where* commitment devices are unavailable/costly and reputation is tied to underlying character (see "Empirical Exposure"). The core *logic* still applies in its niche.

  ### Empirical Exposure: The Translucency Requirement
  The disposition view **critically depends** on empirical assumptions challenged by evidence:
  *   **Gauthier's Translucency:** The claim that others can detect our dispositions (intentions, character) with *sufficient reliability for the benefit to outweigh the costs* is its Achilles' heel.
      *   **Defeaters:** Behavioral economics and social psychology suggest:
          *   **Detection is Costly & Imperfect:** Reading true dispositions is hard. People rely heavily on superficial cues (appearance, stereotypes, past actions in *observable* contexts), reputation (often based on limited/curated info), and signals that can be faked (cheap talk, conspicuous but low-cost "commitments"). Detecting a *genuine* Parfit-paying disposition seems exceptionally difficult.
          *   **Signaling & Fakery:** Where payoffs exist for *appearing* disposed to cooperate (e.g., building reputation), agents invest in the *appearance* (signaling) rather than the costly underlying disposition. Studies on trust games often show "calculative trust" based on reputation outperforms pure dispositional trust.
          *   **Net Benefit Unclear:** The costs of maintaining a rigid disposition (being exploited in "grain problem" cases, paying in "sealed tell" scenarios) must be outweighed by the benefits from favorable predictions. Evidence on the success of purely "nice" or "reciprocal" strategies in complex, non-iterated environments is mixed; exploitative strategies often thrive.
  *   **Threshold for Viability:** Prediction/detection needs to be accurate *enough* and cheap *enough* that the net expected benefit of having/honoring the disposition exceeds the net benefit of opportunism *plus* the cost of acquiring/maintaining the disposition. **Current evidence suggests we often operate in regimes where this threshold is *not* met:** reputations are fluid, signals can be gamed, commitment devices are available, and one-off exploitation is common and profitable. Showing the disposition view applies widely requires strong evidence for widespread, reliable disposition-detection – evidence largely lacking.

  **Committed Defender's Stance:** They would dismiss empirical challenges as "rival framings" (focusing on ideal theory) or argue the evidence *does* support sufficient translucency in key domains (e.g., small communities, repeated interactions). However, conceding the empirical fragility significantly weakens the view's practical relevance.

  ### Honest Assessment
  1.  **Unfalsifiability?** Yes, there's a strong risk. If "policy" can be defined post-hoc to rationalize *any* behavior ("My policy is to maximize EU in this very specific situation"), the view collapses. To avoid this, "policies" must be defined *ex ante* as reasonably general rules/dispositions applicable across a range of foreseeable situations. Even then, the "grain problem" shows the tension between specificity and detectability. The view remains falsifiable *in principle* by showing that *no* reasonably general, detectable disposition yields better expected results than sophisticated opportunism in the relevant environment (as the empirical evidence suggests for many contexts). However, proponents can often retreat to defining the "right" policy narrowly.
  2.  **Normative Thesis Defect?** For a theory of *individual rationality under self-interest*, this *is* a defect. It risks becoming a tautology: "Be disposed to do whatever a rational agent would be disposed to do." Its normative force depends entirely on the empirical claim that specific dispositions are reliably detectable *and* beneficial – a claim increasingly dubious. It functions better as *indirect* advice for self-cultivation ("Try to become the sort of person who...") or institutional design ("Create systems where appearing X is beneficial") than as a direct guide to rational action in the moment.
  3.  **Your Request:** You asked for pressure on the dilemma and empirical exposure.
      *   **The Dilemma:** There is **no stable middle**. The view only coheres as sophisticated consequentialism (Horn 1). "Rational irrationality" (Horn 2) is incoherent within self-interest. The Sealed Tell variant proves this decisively.
      *   **Empirical Exposure:** The reliance on **reliable disposition-detection (translucency) is its fatal weakness.** Evidence from behavioral economics, signaling theory, and reputation dynamics strongly suggests that in realistic environments, cheaper alternatives (managing appearances, using commitment devices) dominate, and the net benefit of a rigid, costly disposition is often negative or unattainable. The view describes a fragile, niche strategy, not a robust requirement of rationality.

  **Conclusion:** The dispositional view survives only as a vivid illustration of why sophisticated consequentialists must assess rules/policies, not just acts. As a defense of "rational irrationality" or a fundamental requirement of individual rationality beyond consequentialism, it fails. Its force collapses under the Sealed Tell, its scope is severely limited by acquirability concerns and the availability of commitment devices/reputation, and its core empirical assumption about detectable dispositions is unsupported. Abandon the "bolder formulation"; the lesson is the lesser one: sometimes, maximizing expected utility requires committing to a *policy* where individual acts within it only make sense as part of the whole causal chain.
