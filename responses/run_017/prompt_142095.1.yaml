  Below is a detailed, ready-to-run plan for your 90-minute pub session. It's designed to make the group organically confront the tension between "save the most lives" and "give everyone an equal chance" without you tipping your hand. The structure uses your wrinkles (secret decision preferences and waiver cards) and adds light stakes to make choices feel consequential. I've included a minute-by-minute timeline, role assignments, rules, and a debrief that ties the exercise to the philosophical dilemma. I'll also flag predictable pitfalls and what you'll need to clarify at the end.

  ---

  ### **Session Overview**
  - **Core Conflict**: Is the *number* of people a moral reason to save the many over the one, or does fairness demand equal consideration?
  - **Avoiding Side-Issues**: All scenarios use identical strangers in symmetrical danger (no special duties, relationships, or deservingness). Rescuers are neutral bystanders.
  - **Stakes**: Each player gets a "stake card" tied to a person at risk. If "your" person is saved, you earn a point. Most points wins a silly prize (e.g., choosing next month's book). Rescuers earn a point if they save at least one person.
  - **Phased Approach**: Three rounds escalating in complexity. Groups rotate roles so everyone experiences being at risk and rescuing.
  - **Group Size**: Optimized for 12–16 people. Uses 7 players per round (1 rescuer + 6 at risk). Others observe and rotate in.
  - **Materials**: Index cards (two colors if possible), pens, coin, dice, whiteboard (for points tracking).

  ---

  ### **Setup Before Starting (5 minutes)**
  - **Prep Cards**:
    - **Stake Cards**: Write numbers 1–16 on cards (one per person). These assign each player to a "person at risk" (e.g., if you draw #4, you’re invested in person #4 surviving).
    - **Role Cards**: For each round, prepare:
      - 1 "RESCUER" card.
      - 6 "AT RISK" cards (labeled #1–#6).
    - **Preference Cards (Wrinkle 1)**: For Round 2, prepare two types:  
      - **Type A (Save Most)**: "I want the rescuer to save whichever group has more people. Save the most lives!"  
      - **Type B (Equal Chance)**: "I want the rescuer to give each person an equal chance (e.g., flip a coin between groups). Don’t add us up!"  
      Mix 3 Type A and 3 Type B cards per round (shuffled).
    - **Waiver Cards (Wrinkle 2)**: For Round 3, blank cards for at-risk players to write "WAIVE" or "KEEP".
  - **Whiteboard**: Set up a points tracker (e.g., "Player 1: 0 pts, Player 2: 0 pts...").

  ---

  ### **Round 1: The Classic Dilemma (20 minutes total)**
  **Goal**: Establish the intuitive "save the many" response, then subtly challenge it.  
  **Scenario**: Six people are in peril—five in Group A, one in Group B. Rescuer can save one group, not both. All are identical strangers.  
  **Assign Roles (3 min)**:  
  - Draw 7 role cards: 1 RESCUER, 6 AT RISK (labeled #1–#6). Assign the rescuer and split the at-risk into Group A (#1–5) and Group B (#6). Observers take notes.  
  - **Stakes reminder**: If your stake card matches a saved person, you get a point. Rescuer gets a point if they save anyone.  

  **Rescuer’s Choice (5 min)**:  
  - Rescuer announces: "Save Group A (the five)" or "Save Group B (the one)".  
  - **Critical twist**: Before finalizing, ask the at-risk players: "Group B (#6), if the rescuer saves you, how many points do you get? Group A (#1–5), if the rescuer saves you, how many points do *you* each get?" (Answer: All get 1 point if saved. This highlights that saving the five gives more *total* points but the *same* individual reward.)  
  - Rescuer decides. Record points.  

  **Group Discussion (7 min)**:  
  - Ask: "Why did you choose that? Did it feel obvious?"  
  - Probe: "What if the rescuer had flipped a coin? Would that be fairer?" (Don’t answer; let them sit with it.)  

  **Pitfalls**:  
  - Someone may say "five deaths are worse" → note this for debrief.  
  - If rescuer hesitates, ask: "Is it unfair to the one if we *don’t* flip a coin?"  

  **Rotate (5 min)**: New rescuer and at-risk players (prior rescuer becomes #1 in Group A, etc.).  

  ---

  ### **Round 2: Secret Preferences (25 minutes total)**
  **Goal**: Surface tension between group totals and individual fairness using your wrinkle. Players see that the "obvious" choice might ignore what the people themselves want.  
  **Scenario**: Same as Round 1, but each at-risk person has a secret preference for how the decision should be made.  

  **Assign Roles & Preferences (5 min)**:  
  - Draw 7 new roles (rescuer + #1–6). Split into Group A (#1–5) and Group B (#6).  
  - Give each at-risk player a **secret preference card** (3 Type A, 3 Type B, shuffled). They read it but *don’t reveal*.  
  - **Stakes**: Same as Round 1.  

  **Rescuer’s Choice (5 min)**:  
  - Rescuer is told: "Each person has a preference for how you decide. You don’t know what they are."  
  - Rescuer decides: save Group A or Group B? (They might agonize—good!)  

  **Reveal & Discuss (10 min)**:  
  - At-risk players reveal preferences. Record:  
    - How many in each group wanted "save most" (Type A) vs. "equal chance" (Type B)?  
    - Did the rescuer’s choice match the majority preference? The preferences of the saved group?  
  - **Key questions**:  
    - "What if Group B (#6) wanted to save the five (Type A), but Group A wanted equal chance (Type B)? If you save the five, are you respecting their wishes?"  
    - "If most people wanted equal chance, should the rescuer have flipped a coin?"  

  **Pitfalls**:  
  - Rescuer ignores preferences → Ask: "Should their wishes matter?"  
  - Someone suggests majority vote → Counter: "But what if the minority disagrees? Does democracy override fairness?"  

  **Rotate (5 min)**: New roles.  

  ---

  ### **Round 3: Waiving Claims (25 minutes total)**
  **Goal**: Test if "numbers matter" by letting players sacrifice their claim. Reveals that numbers only "work" if individuals accept aggregation.  
  **Scenario**: Same as Round 1, but at-risk players can waive their claim to be saved.  

  **Assign Roles & Waivers (5 min)**:  
  - Draw 7 new roles (rescuer + #1–6). Split into Group A (#1–5) and Group B (#6).  
  - Give each at-risk player a blank **waiver card** and pen.  
  - **Rules**:  
    - Write "WAIVE" (I give up my claim; save the other group) or "KEEP" (I want to be saved).  
    - Waivers are *binding* and *secret* (fold and hand to rescuer).  
  - **Critical detail**: The rescuer must save the group with the most *non-waived claims*. If tied, flip a coin.  
    - Example: If 3 in Group A waive, Group A has 2 claims left vs. Group B’s 1 claim → save Group A.  
    - If all in Group A waive, Group A has 0 claims vs. Group B’s 1 → save Group B.  

  **Waiver Choice (3 min)**:  
  - At-risk players write "WAIVE" or "KEEP" in secret. Rescuer collects cards.  

  **Rescuer’s Calculation (5 min)**:  
  - Rescuer counts non-waived claims per group and decides. Record points (only non-waived get points if saved).  

  **Group Discussion (7 min)**:  
  - Reveal waivers. Ask:  
    - "How many waived? Why? Did waiving feel like a ‘sacrifice’?"  
    - "If only some waived, did it change the outcome? When *does* it change the outcome?" (Only when waivers tip the balance.)  
    - "Does this show the numbers only matter if we *let* them?"  

  **Pitfalls**:  
  - No one waives → "Why not? Is self-interest stronger than fairness?"  
  - All waive → "If everyone sacrifices, does that make the one’s claim stronger?"  
  - Someone notes stakes aren’t real → Acknowledge: "True, but the *logic* is what we’re testing."  

  ---

  ### **Debrief: Mapping to the Philosophy (15 minutes)**
  **Structure**:  
  1. **What Happened?** (5 min):  
     - Whiteboard three columns: "Save Most", "Equal Chance", "Other".  
     - Poll: "In which round did you lean toward each?" Discuss patterns.  
     - Note: "In Round 2, preferences clashed. In Round 3, waivers exposed how numbers rely on individual claims."  

  2. **The Flatmate’s ‘Of Course’** (5 min):  
     - "Many of you saved the five in Round 1. But was it ‘obvious’? What about the coin-flip idea? What about Round 2, where people *asked* for a coin flip?"  
     - Highlight: "The ‘of course’ assumes numbers are *all* that matter. But Rounds 2–3 showed individuals have claims that might conflict with the total."  

  3. **The Bigger Picture** (5 min):  
     - **The Equal-Chance Insight**: "If we flip a coin in 1 vs. 5, the one has a 50% chance, each of the five has a 10% chance. Is that fair? What about 1 vs. 100? If you give equal chance per *person* (e.g., roll a die: 1–100 save the many, 101 save the one), the one has a 1/101 chance. Does that feel better?"  
     - **What’s Missing**: "The numbers might not be a ‘reason’ itself—they’re a proxy for individual claims. But if we don’t aggregate, we might ignore real harm (e.g., letting five die to be ‘fair’ to the one)."  
     - **Your Wrinkles Explained**:  
       - Secret Preferences: Shows "save most" can disrespect personal autonomy.  
       - Waivers: Proves numbers only matter if individuals consent to aggregation.  

  4. **Conclusion**: "No easy answer. But the ‘of course’ misses that morality might require us to see people as individuals, not just sums."  

  ---

  ### **Pitfalls and Limitations**
  - **Predictable Issues**:  
    - **Majority Vote Attempt**: Likely in Round 2. Shut it down: "But the rescuer doesn’t know preferences—and even if they did, should the minority be overruled?" Use it to highlight the tyranny of the majority.  
    - **Stakes Aren’t Real**: Some may disengage. Mitigate by emphasizing the prize and role-playing ("Think of it as a proxy for moral stakes").  
    - **Rescuer Indecision**: If stuck, impose a 60-second timer. Pressure reveals intuition.  
    - **Over-Simplifying**: "Just save the five!" → Ask: "What if the one is your stake? What if they wanted a chance?"  

  - **What the Game Can’t Do**:  
    - **The Equal-Chance Solution**: Players rarely invent it organically. You’ll need to introduce it in the debrief.  
    - **Scale to Large Numbers**: The game can’t simulate 1 vs. 100. You must add: "If it’s 1 vs. 100, does a coin flip feel absurd? Why? Does that prove numbers matter, or is it just psychology?"  
    - **Why Numbers Might Matter**: The game exposes the *tension* but can’t resolve it. You’ll need to summarize: "Consequentialists say numbers reduce harm. Deontologists say fairness trumps totals. Your waivers/preferences show the conflict."  

  ---

  ### **Why This Works**
  - **Stealthy Exploration**: The game makes the group confront the dilemma without you lecturing. The wrinkles force them to see holes in "save the most."  
  - **Role-Rotation**: Ensures empathy (e.g., when your "stake" is the one).  
  - **Bite-Sized Stakes**: Points + prize create low-stakes investment without distraction.  
  - **Pacing**: 90 minutes fits, with buffer for tangents (stick to the timer!).  

  Bring your index cards and a coin—you’re set. By the end, they’ll see why the "of course" isn’t obvious, and you won’t have mangled a single explanation.
