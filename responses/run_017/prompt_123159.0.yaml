prompt: |-
  You are a professional philosopher of history and of the social sciences, equally at home in the covering-law tradition and in the narrativist, interventionist and contrastivist alternatives to it. Think carefully and at length before you draft anything: begin by brainstorming, freely and without polishing, about where the genuinely open question in this area now lies, what the three or four different things a doctorate on it could be about are, and what would make each of them either trivial or unfinishable. Only then settle on the version you think is strongest and write it up.

  I am applying for a three-year doctoral studentship and need the research-proposal section of the application — roughly 900 to 1,000 words — plus a working title.

  My half-formed idea is this. The covering-law versus narrative dispute strikes me as framed around the wrong question. Both sides ask what explains a historical event, as though there were one thing there to be explained. I suspect they are answering two different questions: the Hempelian model answers a forward-looking one — given these initial conditions and this regularity, why should we expect an outcome of this kind — whereas a narrative answers a backward-looking one, making an outcome intelligible by exhibiting the sequence of earlier happenings it hung upon. And the items in that sequence often acquire their significance only retrospectively: Danto's notion of narrative sentences is supposed to capture something like this, since an event can only be described as the opening of a war once that war has come about. If that is right, the temporal asymmetry of narrative is not a defect to be apologised for but the very feature that distinguishes it from subsumption under a law, and the live questions become: first, whether any notion of causal significance can be irreducibly retrospective rather than merely a reflection of where the historian happens to stand; and second, whether a narrative can be assessed as correct or incorrect rather than merely as plausible, coherent or illuminating.

  There is a second puzzle I want folded in, because I think it discriminates sharply between accounts. In a deductive-nomological explanation, irrelevant detail is a vice: the ideal derivation strips away everything the law does not need. In a narrative the opposite seems true — thickening the story, adding local texture, hesitations and near-misses, characteristically makes it more explanatory rather than less. Anyone who wants to say that narratives explain owes an account of what the accreted detail is doing, and my suspicion is that the answer connects to the first question: the detail is what stabilises the counterfactual dependencies the narrative asserts.

  Please turn this into a proposal a sceptical assessment panel would take seriously. It should contain:

  1. A precise statement of the question, narrowed to something that has a determinate answer within three years, together with a working title.
  2. Why the standard positions each leave that question open: subsumption under general laws; the narrativist line associated with Danto, Gallie, White and Ankersmit; interventionist and manipulationist accounts of causation; and contrastive or question-relativist treatments of explanation. A sentence or two each is ample.
  3. An argument for why this framing — retrospective causal significance plus the puzzle of accreted detail — is a better way in than the standard formulation ("does history have laws, and if not is it a science?"), and what it lets me say that the standard formulation does not.
  4. A method: what I would actually do, year by year and chapter by chapter, including how I would test the account. I want at least one test capable of breaking it — for example, whether a narrative could explain while containing a false sentence, or whether a complete and entirely true chronicle could nonetheless fail to explain — and I want the proposal to select two or three well-documented historical episodes over which rival narratives compete, and to say in advance what would tell between them. Choose episodes whose outlines are common knowledge; I am not proposing archival work.
  5. What the possible conclusions are, which considerations would decide between them, and an honest account of what would count as the project failing — for instance if retrospective causal significance turned out to be only a fact about the historian's vantage point, or if my account collapsed into an ordinary contrastivist or interventionist one dressed up in narrative vocabulary.
  6. A realistic assessment of scope: what would make this too big for a single doctorate, what I would cut first, and where I would need to learn something I do not currently know.

  Two constraints. Do not produce a bibliography, a citation-based literature review, or page references: refer to positions, arguments and named views only, and flag anything I would need to look up myself. And write throughout in British English, in the register of a funding application — precise, unhedged where it can be, and free of rhetorical padding.
