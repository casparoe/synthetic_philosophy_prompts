prompt: |-
  Hey — hoping someone here knows experimental philosophy better than I do. I got into this via an argument about whether a hospital triage algorithm "disadvantaged" a group of patients on purpose, and I cant tell whether the thing I keep noticing is one phenomenon with a name, or three that look alike.

  You probably know the basic case: a company starts a program to make money, the exec is told it will also wreck a river, he says he cares about the river not at all, the program runs, the river gets wrecked, and if you then ask people whether he wrecked the river on purpose most say yes. Swap "wreck" for "clean up" and most say no. I gather that's the Knobe effect, or the side-effect effect, or both. Fine. Its the stuff around the edges I can't place. Three things I've noticed when I try versions of this on friends and family:

  1. Neutral control. I made a third version where the side effect is completely inert — the program will change the colour of the water, helps nobody, hurts nobody. I expected the "yes" rate to land between the harm and help versions. It dosn't; it lands right on top of the help version. So it looks like nothing about the good case is doing any work and the whole thing is the bad case lifting off a baseline. If that's right, a story about moral valence moving a judgment in two directions predicts something different from a story where blame does all the work. Also, when I make the "bad" side effect bad only by a rule nobody believes in — the program will violate a dress code or something — the gap mostly vanishes, even though "he broke the rule on purpose" seems plainly true.

  2. Question swap. Keep the story identical and change what you ask. "Did he know it would happen" — no intention word anywhere, just foresight — gives roughly the same harm/help gap. "Did the program cause it" gives a smaller one. "How much profit did the company make" gives none. So whatever this is, it spreads to some dependent measures and not others, and I have no idea what the dividing line is supposed to be.

  3. Agent swap. Replace the chairman with something nobody thinks has beliefs or desires: a model update that tanks accuracy for one group of users and improves it for another, with the engineers told in advance. Now "on purpose" gets you nothing — people balk — but "the update was responsible for" and "the update caused" still track harm vs help, and "somebody should fix it" tracks it harder than either. So there seem to be two things here, one that needs a mind behind the action and one that doesn't, and I don't know whether the literature treats those as one effect with several measures or as separate effects that happen to travel together.

  So: what am I actually looking at? Is any of this already named, is the named thing broader or narrower than what I've described, and where exactly are the boundaries — which dependent measures does it show up in, and which kinds of "bad" does it need (moral badness, any norm violation at all, or a norm the person answering actually endorses)? Please don't just hand me a label; I want to know what's in the box and what isn't, with the edge cases marked. And if one of the three has no name, give it one and define it so it can be told apart from its neighbours. If point 1 is just me having asked badly, say that instead and say why. Lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back to me.
reasoning: |-
  Okay, let me tackle this query about experimental philosophy and the Knobe effect. The user describes three observations from their own informal experiments and wants to know how they fit into existing frameworks. 

  First, the core question: they're seeing patterns around intentionality judgments that don't perfectly align with the classic Knobe effect. Their three points are about neutral controls, question wording, and non-human agents. 

  For point 1 (neutral control landing with help case): This challenges symmetrical accounts of the effect. The literature does show asymmetries - harm dominates help. Their dress code test suggests norm violation alone isn't sufficient; it needs moral weight. 

  Point 2 (question swap): The persistence with "know" but not "profit" questions is well-documented. Foresight judgments often track intentionality in harm cases, while outcome-neutral measures don't. This fits the "epistemic side-effect effect" concept. 

  Point 3 (agent swap): Removing human agency kills intentionality judgments but preserves responsibility/causality attributions for harmful outcomes. This aligns with studies on algorithm bias where "responsibility" lingers without intentionality. 

  The boundaries matter: The effect requires moral (not just conventional) badness, surfaces in mental state attributions more than causal ones, and depends on perceived agency. Their observations aren't flaws - they reveal the underlying mechanisms. 

  The takeaway: They're observing the Knobe effect's asymmetries and boundary conditions, not new effects. But their tests cleverly expose why moral valence drives the phenomenon beyond simple norm violation.
answer: |-
  Your observations reveal boundary conditions and measurement nuances of the Knobe effect (side-effect effect), not fundamentally new phenomena. Here's the breakdown:

  1.  **Neutral control asymmetry:** Your finding that neutral effects align with *help* (not midpoint) reflects the Knobe effect's **asymmetry**. Harm drives the effect; neutral/help cases form a low-baseline cluster. This challenges symmetrical "valence-shift" accounts and supports **blame-driven models** (e.g., Knobe's "trade-off hypothesis"). The dress-code result confirms the harm must be **morally significant** (not conventional norms) to trigger the effect. *Boundary:* Requires perceived *moral* badness the respondent endorses (not arbitrary rules).

  2. **Question sensitivity:** The effect persists for **foresight/knowledge** ("did he know?") because it's tied to *mental state attribution* under moral evaluation. It weakens for **causal judgments** ("did it cause?") as causality is less intention-laden. It vanishes for **outcome-neutral facts** ("how much profit?") unrelated to agency. *Boundary:* The effect manifests strongest in measures implicating **agential responsibility** (intent, knowledge, blame) and diminishes for purely causal or descriptive measures.

  3. **Agent-dependence split:** Your algorithm test uncovers a key distinction. **Intentionality/purpose judgments require a minded agent** (hence collapse). **Responsibility/causality attributions persist** for harmful outcomes even for non-agents. **Normative judgments** ("should fix it") amplify with harm due to moral salience. *Boundary:* The *core* Knobe effect (intentionality shift) demands an agent capable of mental states. **Harm-tracking responsibility attribution** (your observed effect with non-agents) is a related but distinct phenomenon—call this **Outcome Valence Bias in Causality/Responsibility (OVBCR)**.

  **Bottom line:** You're observing the Knobe effect's reliance on *moral harm*, its domain in *agential mental states*, and a separable harm-tracking bias in non-agential responsibility judgments (OVBCR). The Knobe effect proper is narrower: it specifically describes the *asymmetric shift in intentionality attributions* to human(like) agents based on moral valence.

  **Key boundaries summarized:**
  | **Aspect**               | **Knobe Effect Present**          | **Knobe Effect Absent**           | **OVBCR Present**                |
  |--------------------------|-----------------------------------|-----------------------------------|----------------------------------|
  | **Valence Type**         | Moral harm (endorsed)             | Conventional rules/neutral/help   | Moral harm (endorsed)            |
  | **Agent Type**           | Capable of beliefs/desires        | Non-minded entities (algorithms)  | Any causal system                |
  | **Dependent Measures**   | Intentionality, knowledge         | Profit, physical causation        | Responsibility, "should fix"     |
  | **Neutral Baseline**     | Clusters with help (low intent)   | --                                | --                               |

  **Why your tests work:**  
  - Point 1 exposes moral harm as the active driver (not help suppression).  
  - Point 2 shows the effect is mental-state-specific, not general outcome bias.  
  - Point 3 isolates agential intentionality from harm-driven responsibility bias (OVBCR). No flaw in design—these clarify the underlying mechanisms.
