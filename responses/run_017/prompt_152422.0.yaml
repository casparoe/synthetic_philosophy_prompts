prompt: |-
  I'm defending a thesis in a philosophy of science reading group next week, and I want a Q&A prep sheet — not a defense of the view, but a map of what this particular room will throw at me.

  The thesis: occasionalism is best reconstructed, secularly, as a claim about the direction of explanation rather than about whether causes exist. Call the view coordination occurrentism. The fundamental facts are momentary occurrents; nothing local produces anything else locally; what makes causal claims true is a global constraint — something structurally like al-Ghazālī's habit — linking the total state of one time to the total state of the next, where that constraint is not itself reducible to the occurrents but is also not a productive power. I argue (i) that this handles better than Humean regularity views the question of why there is order at all, which the Humean must treat as brute; (ii) that it dissolves the exclusion and overdetermination worries, since if nothing local does any producing, the mental need not compete with the physical for causal work; and (iii) that its empirical equivalence to standard views is a feature, not a defect: it shows the metaphysics of causation is underdetermined by physics, so the choice between accounts must be made on explanatory rather than evidential grounds.

  The room is not medievalists. It is: a Lewis-style Humean about laws; an older-school regularity theorist; a dispositionalist in the Molnar-and-Mumford vein who thinks only powers distinguish genuine causation from coincidence; an interventionist who treats causal claims as claims about what happens under manipulations; a philosopher of physics who holds that causation is a macro-level, non-fundamental notion and that fundamental physics contains no productive causation at all; and a historian of medieval philosophy who will say I have detached occasionalism from the thing that made it occasionalism.

  Give me the objections in roughly the order they will arrive, phrased the way each of those people would actually phrase them, ordered by how much damage they would do rather than by how easily I can answer them. For each: a two-minute reply, what I should concede up front, what I must hold, and where my reply is softest. Flag the one objection I should preempt during the talk instead of waiting for it. And give me the question I am hoping nobody asks.
reasoning: |-
  Okay, the user is defending their thesis on a secular version of occasionalism called "coordination occasionalism" in a philosophy of science reading group. They need a Q&A prep sheet tailored to the specific members of the group. Let me break down their thesis first.

  The core idea is reinterpreting occasionalism as about the direction of explanation, not the existence of causes. Fundamental facts are momentary occurrents, and causation is a global constraint linking total states across times. They argue this handles order better than Humeanism, avoids exclusion problems, and that empirical equivalence is a feature showing metaphysics is underdetermined.

  The room has six members: a Lewis-style Humean, an old-school regularity theorist, a dispositionalist (Molnar/Mumford), an interventionist, a philosopher of physics, and a medieval historian. The user wants objections in the order they'd come, phrased as each person would, ordered by damage potential. For each, they need a 2-minute reply, concessions, what to hold firm on, soft spots. Plus, which objection to preempt and the dreaded question.

  First, ordering by damage: The dispositionalist's objection seems most damaging because it directly challenges the necessity of powers. If coordination occasionalism can't distinguish causation from coincidence without powers, that's a core weakness. The historian's critique about detaching from theology might undermine the view's roots, but since it's a secular reconstruction, maybe less damaging. The interventionist's point about manipulation is practical and could resonate broadly. The philosopher of physics might be less damaging since the view aligns with fundamental physics lacking causation. The Humeans might object but their concerns about bruteness are addressed in the thesis.

  For each objection, I need to mimic their phrasing. The dispositionalist would focus on the absence of powers making causation indistinguishable from coincidence. The historian would say the secular version loses what made occasionalism distinctive. The interventionist would question testability via manipulations. The Lewis-Humean would worry about the global constraint being more mysterious than regularities. The regularity theorist would find the global constraint redundant. The philosopher of physics might question adding metaphysics where physics doesn't.

  For replies: Concede where necessary but hold firm on key points. For the dispositionalist, concede that powers aren't part of the ontology but argue that global constraints provide a different kind of necessity. The historian, concede the theological detachment but stress the philosophical value of the reconstruction. Interventionist, concede practical testability but separate metaphysics from epistemology. Humeans, hold that the global constraint explains order better than brute regularities. Regularity theorist, argue that constraints aren't reducible. Philosopher of physics, align with their view but justify the metaphysical framework.

  Preempting the historian's objection makes sense to frame the view as a reconstruction early on. The dreaded question might be about explaining constraints without regress or how coordination provides directionality.

  Need to ensure each reply is concise, addresses the damage, and flags soft spots. Also, check that the ordering reflects the perceived damage accurately, with dispositionalist first as most critical.
answer: |-
  Here's your Q&A prep sheet, structured by opponent threat level (high to medium damage), with their likely phrasing, your strategic reply, concessions, firm holds, soft spots, preemption target, and the "dreaded question." Damage ranking prioritizes objections that undermine core credibility, empirical traction, or historical legitimacy.

  ---

  ### **Preemption Target (Address During Talk)**
  **The Historian's Objection:**  
  *Likely Phrasing:* "This isn't occasionalism—it's a shell game. You've stripped out God, the sustaining divine will, and the commitment to *true* causal impotence. Al-Ghazālī’s ‘habit’ was God’s reliable action. Without that, you’re just describing a global regularity with a fancy name."  
  *Why Preempt:* Undermines your project’s legitimacy upfront. Frame early as *"secular reconstruction inspired by occasionalist structure, not theological commitment."*

  ---

  ### **Objections by Damage Order**

  #### **1. The Dispositionalist (Highest Damage: Attacks Core Mechanism)**  
  *Likely Phrasing:* "If there are *no local productive powers*, how do you distinguish genuine causation from cosmic coincidence? Your ‘global constraint’ is inert—it doesn’t *do* anything. Powers provide the ‘oomph’ that makes fire *burn* cotton. Without them, you’ve got a barren universe where everything just ‘happens to’ co-vary."  
  **Your Reply (2 min):**  
  - *Concede:* "I agree powers offer intuitive ‘oomph,’ but they’re metaphysically costly and raise exclusion problems."  
  - *Hold Firm:* "Global constraints *explain* covariance without needing local push/pull. Physics describes *patterns* (e.g., laws as boundary conditions). Our view takes this seriously: the constraint *is* the explanation for why states evolve orderly."  
  - *Soft Spot:* Admitting the constraint doesn’t "act" risks feeling epiphenomenal. Stress: **"It’s constitutive, not causal. The constraint *is* what makes ‘fire followed by burning’ non-accidental."**  
  - *Damage Control:* "Powers can’t explain global order either—why do powers coexist coherently? We treat order as primitive but structured."

  #### **2. The Interventionist (High Damage: Challenges Empirical Relevance)**  
  *Likely Phrasing:* "If nothing local ‘produces’ anything, what do causal claims *mean*? For me, ‘X causes Y’ means: tweak X, Y changes. But on your view, tweaking X just creates a *new total state* linked by your ‘habit.’ How is this testable? It sounds like you’ve made causation *unfalsifiable*."  
  **Your Reply (2 min):**  
  - *Concede:* "Interventionism captures scientific practice brilliantly. Our view is compatible with it *epistemologically*."  
  - *Hold Firm:* "But interventionism is silent on *metaphysics*. When you ‘tweak X,’ the reason Y changes isn’t local production—it’s the global constraint ensuring tweaked-X-states correlate with altered-Y-states. Same predictions, deeper basis."  
  - *Soft Spot:* Risk of instrumentalism. Stress: **"We’re not denying patterns—we’re grounding them metaphysically in global structure."**  
  - *Damage Control:* "Your manipulations *reveal* the constraint—they don’t assume local production."

  #### **3. The Lewis-Style Humean (Medium-High Damage: Challenges Simplicity)**  
  *Likely Phrasing:* "Why posit a mysterious ‘global constraint’ when Humean supervenience handles everything? Laws supervene on particular occurrents. Your constraint sounds like a ‘cosmic puppet-master’—it’s ontologically profligate and explains nothing extra."  
  **Your Reply (2 min):**  
  - *Concede:* "Humeanism is elegantly minimal. But it treats cosmic regularity as brute."  
  - *Hold Firm:* "The constraint *explains why* Humean regularities hold. It’s not an entity—it’s a fundamental modal structure (like wave function in QM). Humeans can’t ask ‘why this regularity?’ without circularity; we can."  
  - *Soft Spot:* "Structure not reducible to occurrents" sounds anti-naturalist. **Analogize:** "Like entanglement: non-local, not reducible to parts."  
  - *Damage Control:* "Your ‘best system’ is pragmatic; our constraint is objective. That’s the trade-off."

  #### **4. The Historian (Medium Damage: Undercuts Originality)**  
  *(If not preempted)*  
  *Likely Phrasing:* "Calling this ‘occasionalism’ is misleading. Ghazālī’s ‘habit’ presupposed God’s will as its source. Your ‘secular’ constraint is just a metaphysical posit—it lacks occasionalism’s motivation to preserve divine omnipotence."  
  **Your Reply (2 min):**  
  - *Concede:* "Theological commitments are gone. This is a *reconstruction*."  
  - *Hold Firm:* "But the *structure* is identical: no local production, total-state dependence. That’s the philosophically novel insight worth salvaging."  
  - *Soft Spot:* Risks seeming ad hoc. **Stress:** "Occasionalism’s core was *anti-causal production*. We keep that, replacing theology with metaphysics."  
  - *Damage Control:* "Many concepts secularize (e.g., Karma → moral luck). This is analogous."

  ---

  ### **Lower-Damage Objections (Still Prickly)**

  #### **5. Philosopher of Physics (Medium-Low Damage: Questions Fit with Physics)**  
  *Likely Phrasing:* "Fundamental physics (e.g., QM, GR) already lacks productive causation—it’s just state evolution. So why add ‘coordination occurrentism’? It seems redundant. And calling it ‘causation’ confuses macro-level folk concepts with fundamental reality."  
  **Your Reply (2 min):**  
  - *Concede:* "I agree fundamental physics is non-causal! That’s why our view fits: it reduces causation to lawful state evolution."  
  - *Hold Firm:* "But physicists treat laws as *constraints*. We metaphysically ground that. And we *explain* macro-causation as derivative patterns."  
  - *Soft Spot:* May seem like relabeling. **Stress:** "We’re not adding ontology—we’re interpreting what physics *already describes*."  

  #### **6. Older-School Regularity Theorist (Lowest Damage: Redundancy Charge)**  
  *Likely Phrasing:* "This is just regularities with extra steps. If the ‘global constraint’ links total states, it’s equivalent to a cosmic regularity. Why complicate things?"  
  **Your Reply (2 min):**  
  - *Concede:* "Empirically equivalent? Absolutely."  
  - *Hold Firm:* "But regularities *don’t explain their own existence*. Our constraint does—it’s why regularities hold. Your view treats order as brute; ours gives it a metaphysical basis."  
  - *Soft Spot:* "Basis" may sound vacuous. **Pivot:** "Brute regularity vs. structured necessity—that’s the metaphysical choice."  

  ---

  ### **The Dreaded Question (Hope Nobody Asks)**  
  **"If the global constraint ‘explains’ order without being a power or entity, what *is* it—and how does it ‘link’ states without violating your own ban on production?"**  
  *Why Dreaded:* Forces you to admit the constraint is *sui generis* ("It’s a primitive fact of modal structure") or risk incoherence.  
  *Salvage Strategy:*  
  - **Concede:** "It’s not causal—it’s *constitutive*. Like mathematical truths ‘constraining’ physical possibilities."  
  - **Redirect:** "This is where theories hit bedrock. Humeans have brute regularities; we have brute structure. Ours explains more."  
  - **Fallback:** "If this seems mysterious, remember: all fundamenta are inexplicable (e.g., why these laws?). Our constraint *is* the fundamentum for order."  

  ---

  ### **Summary Defense Strategy**
  - **Preempt** the historian early to legitimize secular reconstruction.  
  - **Isolate the dispositionalist’s objection** as the main threat: defend global constraints as *explanatorily potent* without powers.  
  - **Leverage the physicist’s view** as support: "Fundamental physics lacks production—we agree! We just take it seriously."  
  - **Concede empirical equivalence** but stress *explanatory superiority*: "We answer why-questions Humeans can’t."  

  Good luck—this is a sharp room, but your view is built for this fight.
