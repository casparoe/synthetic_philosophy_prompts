prompt: |-
  ok so I've been going back and forth on causation by omission for weeks and I think the only way out is to write down my actual gut verdicts on a pile of cases and see whether anything fits them. Please take the verdicts as given and don't try to talk me out of them until you've found the principle.

  1. The greenhouse assistant's one job is to water the seedlings. He doesn't. They die. He caused their death. Totally unhesitating yes.

  2. A woman walking past the greenhouse could easily have stepped in, knew the seedlings would die otherwise, doesn't. I want to say she did NOT cause their death — and the counterfactual is exactly the same as in 1, so I don't get to lean on that.

  3. I forget to water my own plant, but unknown to me the roots had already rotted and it was dying that week either way. Not a cause.

  4. Two people are each independently assigned to water the seedlings. Both forget. Either would have done it alone. I want to say both caused the death, but it feels thinner than 1. And if I scale it to a hundred people with the same assignment, all of whom forget, I suddenly want to say none of them caused it and it was just "the group," which on reflection seems insane. Maybe it isn't.

  5. Night guard doesn't lock the back door. A thief walks in and takes the thing. The not-locking caused the theft. Yes.

  6. Night guard doesn't leave his post. Because he's there, he sees the thief, and the thief gets caught. I refuse to say his not-leaving caused the thief to be caught. That's just the background. But every reason I can produce for why 5 and 6 differ feels like it assumes the conclusion.

  7. The irrigation controller doesn't open the valve because its clock battery died. I'm happy to say the not-opening caused the plants to die. But: the deer get into the garden because there was never a fence. I half want to say the absence of the fence caused it and half don't, and the difference between these two can't just be that one of them has a battery in it.

  8. I don't send $500 to a charity that would very reliably have saved a kid's life. I want to say I didn't cause that kid's death. But structurally this is case 1: I could, I knew, nobody else was going to, no real cost to me. This is the pair that actually keeps me up, and I'd honestly rather have a principle that tells me I'm wrong here than one that gerrymanders a distinction between them.

  9. I don't call an ambulance because I'm having a seizure. Not a cause, and I don't even want to call it an omission. But if I don't call because I reasonably assumed someone else already had, I lean toward saying it IS a cause, just a mitigated one — and I can't tell whether "reasonably" is doing real work or whether I'm smuggling in blame.

  10. A company never builds the review process that would have caught a bad update; the update ships; someone is hurt. I want to say the not-catching caused the harm, but it feels like a different animal from 1: a standing omission with no particular moment, as opposed to a one-off.

  Here's the half-baked thing I've been toying with, which I'm calling the closure rule. An omission causes O only if: (a) had the action occurred, O wouldn't have; (b) in the actual world there was a live set-up — a role, plan, or mechanism positioned to produce the contrary event — with a window in which it could still have fired, and the causation happens when that window closes, not at the time of the non-action; (c) the route from the omission to O doesn't run through another absence. I like that it dates omissions to a moment that isn't the moment of not-acting, and I like that (c) kills 6. But I can't tell whether (b) really excludes the passerby in 2 or whether it just redescribes my prejudice, and I think (c) might also kill 7 and 10, which I don't want.

  So: repair it or replace it. Give me one or two candidate principles stated precisely enough that I could apply them myself, and for each clause tell me which case forced you to include it. Then give me verdicts on three cases I haven't listed, at least one of which the principle answers in a way I'd find surprising. Be honest about which of my verdicts your preferred principle can't accommodate and say which one you'd overturn and why. And please don't give me citations, a reading list, or "the standard view holds that" as a substitute for an argument — if the honest answer is that causation is just counterfactual dependence and everything else is pragmatics, then say which verdicts I lose and whether the pragmatic story can really carry the weight of the 1-versus-8 pair.
reasoning: |-
  Okay, the user is really struggling with causation by omission. They've listed ten cases with their gut verdicts and want a principle that fits them all. The key is to take their verdicts as fixed and find a consistent rule. 

  First, let me look at their closure rule idea. They have three conditions: counterfactual dependence (a), a live setup that closes (b), and no chain through another absence (c). But they're worried (b) might not exclude the passerby in case 2, and (c) might hurt cases like 7 and 10. 

  Hmm, the user's verdicts show a pattern. They assign causation only when there's a specific responsibility or mechanism in place. The greenhouse assistant (case 1) has a duty, so his omission causes death. But the passerby (case 2) has no such duty, so no causation. The company in case 10 had an institutional responsibility, so the omission causes harm. The charity case (8) is tricky because even though structurally similar to 1, they feel strongly it's not causation. 

  The core might be about normative expectations rather than just mechanisms. The assistant is employed to water, the night guard to lock doors. The company should have had a review process. But for the passerby or charity case, there's no expectation to act. 

  For case 6, the guard not leaving his post leads to catching the thief, but the user refuses to call this causation. The closure rule's condition (c) handles this by blocking chains through another absence (the guard's presence). That seems right. 

  Case 3 has preemption—the plant was dying anyway—so no causation, which counterfactual dependence alone would miss. The closure rule's (b) might handle this if the "window" never existed due to root rot. 

  But the charity case (8) is the sticking point. If the user feels they didn't cause death by not donating, any principle must exclude this. Normative expectations explain it: no duty to donate. But if they want to include case 1 and exclude 8 without blaming, maybe frame it as institutional roles. 

  Proposing a refined principle: Causation by omission requires (1) counterfactual dependence, (2) a pre-existing functional role or mechanism that failed, and (3) no intermediate absences in the causal chain. 

  Testing this: Case 1 (assistant) has a functional role, so causation. Case 2 (passerby) has no role, excluded. Case 8 (charity) lacks a functional role, so no causation—matches user's verdict. Case 6 (guard not leaving) fails (3) because the chain goes through his presence. Case 10 (company) has an institutional role, so causation. 

  New test cases: A lifeguard off-duty but nearby doesn't save a drowning swimmer. Functional role exists (lifeguard), so omission causes death? User might hesitate if off-duty. If they say no causation, the principle needs adjustment. 

  Another: A backup generator fails to kick in due to a design flaw. Functional mechanism exists, so omission causes blackout. This feels right. 

  But if the user rejects the lifeguard case, maybe the role must be active/assigned at the time. That could work. 

  The user's closure rule (b) about windows closing might handle timing issues in case 10. The new principle should keep that. 

  Final principle: Omission causes O iff: (i) but for omitting A, O wouldn't occur; (ii) there was a pre-existing, active functional role or mechanism M where performing A was M's specific function at that time; (iii) the causal path to O doesn't rely on another absence. 

  This explains case 4 (two assistants): both have active roles, so both cause death. Case 7 (irrigation battery): the controller has a functional role, so not-opening causes death. The deer fence (no prior fence) has no pre-existing mechanism, so no causation. 

  For case 3 (preemption), (i) fails—plant dies anyway. For case 9 (seizure), no functional role to call ambulance in that moment, so not a cause. 

  The charity case (8) lacks (ii)—no functional role for the donor. 

  Now, a surprising verdict: If a doctor omits to give a treatment that wouldn't have worked anyway, no causation (preemption). But if they omit a treatment that would've worked, and they're on duty, causation. 

  The user might need to accept that in case 4 (100 people), all 100 cause the death if they had individual duties. If that feels wrong, perhaps aggregate responsibility dilutes causation, but that's messy. Stick with individual roles. 

  Overall, the principle holds. The main tension is case 8, but it preserves the user's intuition there by emphasizing functional roles over mere ability.
answer: |-
  Based on your verdicts, I propose the **Functional Role Failure Principle (FRFP)**. It reconciles your cases by focusing on *pre-existing structures of responsibility*, avoids blame-mongering, and handles timing/chain issues. Here's the precise rule:

  **Omission X causes outcome O iff:**  
  (i) *Counterfactual Dependence*: Had X occurred, O would not have occurred (or would have been substantially less likely).  
  (ii) *Functional Role*: At the time of omission, there existed a pre-established, non-redundant functional role R (assigned to an agent, object, or system) whose *specific purpose* was to produce X in that context.  
  (iii) *Direct Mechanism*: The causal path from X's absence to O does not flow primarily through *another absence* (only physical events/states).  

  **Clause Origins & Verdict Fit:**  
  - (i) Handles case 3 (rotted roots): No counterfactual dependence → not a cause. *Forced by 3*.  
  - (ii) Handles cases 1, 2, 8: Only the greenhouse assistant (case 1) has a functional role (his job). The passerby (2) and charity non-donor (8) lack such roles → causation only in 1. *Forced by 1 vs. 2/8*.  
  - (iii) Handles case 6: Not-leaving → thief caught runs through guard's *presence* (an absence of absence) → not direct. Case 5 (not-locking → theft) flows through physical events (door open, thief enters). *Forced by 5 vs. 6*.  

  **FRFP Verdicts on Your Cases:**  
  1. ✅ (Role: job; counterfactual holds; path physical)  
  2. ❌ (No functional role)  
  3. ❌ (Fails i)  
  4. **Both cause death** (Each has identical functional role; no redundancy clause → *overturns your "100 people" hesitation*. But note: if roles are interdependent, verdict changes.)  
  5. ✅ (Role: job; path physical)  
  6. ❌ (Fails iii: path through presence)  
  7. Valve: ✅ (Role: controller’s function; path physical). Deer: ❌ (No pre-established "fence role" → fails ii)  
  8. ❌ (No functional role)  
  9. Seizure: ❌ (No functional role *at that time*). Didn’t call assuming others did: ❌ (Still no role; "reasonable" is blame-pragmatics, not causation) → *overturns your leaning*.  
  10. ✅ (Role: company’s institutional obligation; "standing" roles qualify under ii; path physical)  

  **New Cases with FRFP Verdicts (and Surprise):**  
  11. **Backup Generator**: A hospital’s backup generator (assigned role: auto-start during outages) fails due to corroded wiring. Blackout causes death.  
      *FRFP*: ✅ (i) Counterfactual: generator would’ve worked; (ii) Functional role exists; (iii) Path physical (power loss → machine shutdown)).  
      *Surprise?* You might expect "corrosion" to be the cause, but omission of maintenance is upstream. FRFP says *failure to activate* causes death.  

  12. **Lifeguard on Break**: An off-duty lifeguard (no shift, in street clothes) sees a swimmer drown at her beach. She could easily save them but doesn’t.  
      *FRFP*: ❌ (No functional role *at that time* — "lifeguard" role inactive off-shift).  
      *Surprise?* Contrasts with case 1. Role must be *active* in context.  

  13. **Two Keys**: A vault requires two keys. Alice (Key A holder) forgets hers. Bob (Key B holder) forgets his. Thief enters.  
      *FRFP*: ❌ for each alone (if roles are defined as *jointly sufficient*). ✅ if roles are *independent* (e.g., "either can open alone").  
      *Surprise?* Verdict depends on role specification (forces precision).  

  **Tension Points & Honesty:**  
  - **Case 4 (100 People)**: FRFP says *all 100* cause death if each had an independent role. You called this "insane," but I’d argue your hesitation stems from *moral dilution*, not causation. If all had a duty and all failed, all causally contributed. *I retain this verdict*.  
  - **Case 9 (Didn’t Call Assuming Others Did)**: You lean toward causation. FRFP says ❌ due to no role. I overturn this: "reasonably assumed" is epistemic (blame mitigation), not causal.  
  - **Charity (8) vs. Assistant (1)**: FRFP preserves your verdicts via (ii). Structural similarity is superficial — roles create *causal contexts*.  

  **Why Not Pure Counterfactual Dependence?**  
  It would force unwanted verdicts:  
  - Case 2 (passerby) and 8 (charity) would be causation (same counterfactual as 1).  
  - Case 6 (not-leaving → caught) would be causation.  
  Pragmatics can’t save this without circularity. Your 1-vs-8 intuition is the death knell: identical counterfactuals, opposite verdicts. Roles break the symmetry.  

  **Refinement of Your Closure Rule:**  
  - Your (b) "live set-up" is absorbed into FRFP’s *functional role*.  
  - Your (c) "no chain through absence" is FRFP’s (iii).  
  - FRFP drops the "window closing" timing — roles handle timing implicitly (e.g., "watering role" exists only when needed).  

  **Final Test**: Apply FRFP to your cases mentally. Does it *feel* like it captures your intuition’s spine? I suspect "functional role" is what your gut means by "set-up" in 1/5/10 but not 2/8. If case 4 still bothers you, we could add *non-redundancy* ("role wouldn’t have been overridden"), but that complicates it. Start here.
