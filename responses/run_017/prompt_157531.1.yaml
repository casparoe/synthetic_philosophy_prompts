prompt: |-
  Hey — I need a thought experiment built to order for a reading group I run on AI risk arguments, and I want one that cuts against the usual direction.

  The spec: a case where the orthogonality thesis looks obviously true — same capability profile on both sides, wildly different final goals, and turning capability up doesn't drag either goal toward the other — but where instrumental convergence just fails. Not "fails a bit": there should be no nontrivial instrumental subgoal both agents get pushed toward as they get more capable, and on at least one of the standard four drives (staying alive, acquiring resources, keeping your own final goal intact, sharpening your own cognition) more capability should push the two of them in opposite directions.

  Constraints, because this is easy to fake:
  - Realistic setting, realistic agents. Two co-trustees of a foundation, two department heads, two siblings running a family firm, whatever — no paperclip maximisers, no foom, nothing science fictional. Both final goals have to be goals actual people or institutions really have.
  - Both agents instrumentally rational throughout. The divergence has to fall out of the goals, not out of one of them being dumber, more myopic, or lazier.
  - The capability increase has to be more of the same kind of thing — better world-models, longer effective planning horizon, more reliable execution — not a change of goal and not a change of environment.
  - Outright cheating, which I'll reject: handing one agent a final goal that already mentions its own destruction or its own holdings ('I want to die', 'I want to own nothing'). The flip on the drive has to be derived from the goal plus the capability, not stipulated.

  The bit I actually care about, and the thing I want you to engineer: I think the load-bearing move is a distinction between what I'll call dischargeable and custodial final goals. Custodial: the goal needs the agent to keep turning up, so preserving yourself and staying in control stays instrumentally useful indefinitely. Dischargeable: there is some arrangement the agent can put in place after which its own continued existence and its continued discretion become the largest remaining source of risk to the goal — it could be corrupted, coerced, bribed, or simply change its mind — at which point maintaining itself is anti-instrumental. My hunch is that only a fairly capable agent can both see that and build an arrangement thats genuinely self-executing, wich is why the flip appears with the capability increase rather than at every level. Tell me if I've got it wrong and substitute a better distinction if you have one.

  What the case is for: I want to separate the part of the instrumental convergence argument that is really about the structure of final goals from the part that is an artifact of how the drives get listed. So I need to know which feature is doing the work and what is left when it is removed.

  Give me exactly five numbered items, nothing before item 1 and nothing after item 5. Each item a sentence or two, except item 1, which is the scenario and can run to a short paragraph.

  1. The scenario, naming each agent's final goal.
  2. What orthogonality says here and why the case shows it cleanly — that you can hold capability fixed and swap goals, and that raising capability converts neither one.
  3. The four drives, half a line each per agent: what the convergence thesis predicts and what you actually get, flagging where the two agents come apart.
  4. The feature doing the work — dischargeable vs custodial, or your replacement — and what the case collapses back into if you take that feature out.
  5. The best pushback a defender of the convergence thesis has (e.g. that your dischargeable goal isn't a final goal at all, or that the thesis was always about expected convergence under uncertainty about which goal you'll end up with), and whether the case survives it.
reasoning: |-
  Hmm, the user wants a thought experiment for their AI risk reading group. They need a scenario that challenges instrumental convergence while satisfying orthogonality thesis conditions. Key requirements include: realistic human-like agents, no sci-fi elements, both agents instrumentally rational, capability increase as "more of the same", and avoiding cheating with self-destructive goals.

  The core idea involves a distinction between "dischargeable" and "custodial" final goals. Dischargeable goals can be permanently secured through institutional arrangements, making the agent's continued existence a liability. Custodial goals require ongoing maintenance by the agent. This structural difference in goals causes divergence in instrumental drives when capability increases.

  For the scenario, I'm considering two foundation trustees: one preserving a specific forest ecosystem (custodial), the other establishing an irreversible constitutional amendment to abolish child labor (dischargeable). Both start with similar instrumental behaviors but diverge sharply with increased capability.

  Orthogonality holds clearly here: both agents have identical capability profiles but incompatible goals, and capability increases don't make their goals converge. The forest protector remains custodial while the amendment architect becomes anti-custodial.

  For instrumental convergence analysis:
  - Self-preservation: The forest protector needs it, the amendment architect sees themselves as a risk
  - Resource acquisition: Both need initial resources but diverge later
  - Goal integrity: Both protect initially, but the architect later seeks to eliminate their own discretion
  - Cognitive enhancement: Both benefit initially, but the architect stops when their plan is complete

  The key feature is indeed the dischargeable/custodial distinction. If removed, both goals become custodial and convergence appears. 

  The strongest pushback would claim the amendment isn't a "final goal" but rather a terminal state. However, the architect's persistent commitment to maintaining the amendment's irreversibility demonstrates it as a final goal rather than just a completed task.

  This construction satisfies all constraints while cleanly separating goal structure effects from instrumental convergence assumptions.
answer: |-
  **1.** Two siblings co-manage a family foundation endowed to achieve distinct final goals. *Elena* aims to **permanently preserve a specific old-growth forest ecosystem in its current state**. *Marcus* aims to **irrevocably abolish child labor globally via a self-sustaining constitutional amendment ratified by all nations**. Both are equally capable, rational trustees operating within legal/political constraints. Their capability increases proportionally: better predictive models, longer-term strategic foresight, more reliable execution networks, and deeper understanding of complex systems (legal, ecological, economic).

  **2.** Orthogonality is cleanly demonstrated: identical capability profiles (modeling, strategy, execution) support radically different final goals (ecosystem preservation vs. institutional abolition). Raising capability doesn't converge their goals: Elena remains focused on dynamic ecosystem management, Marcus on institutional lock-in; neither goal morphs toward the other despite enhanced power.

  **3.**  
  - **Self-Preservation:** *Convergence predicts:* Both seek survival indefinitely. *Actual:* Elena seeks continued existence/control; Marcus seeks arrangements to *eliminate* his role/discretion.  
  - **Resource Acquisition:** *Convergence predicts:* Both seek more resources. *Actual:* Both seek resources *initially*, but Marcus deliberately divests/neutralizes his access *post-amendment*.  
  - **Goal Integrity:** *Convergence predicts:* Both defend their goal definition. *Actual:* Elena defends her custodial oversight; Marcus designs systems *removing* his interpretative authority.  
  - **Cognitive Enhancement:** *Convergence predicts:* Both seek sharper cognition. *Actual:* Both enhance cognition *until* Marcus’s amendment is irreversible; then he *halts* further enhancement to avoid goal reinterpretation.

  **4.** The key feature is **goal dischargeability**: Marcus’s goal (abolition via immutable institution) is *dischargeable*—its perfection *requires* eliminating his custodial role to prevent future corruption/error. Elena’s goal (preserving a dynamic system) is *custodial*—it perpetually needs adaptive oversight. Remove dischargeability (e.g., make Marcus’s goal "continually enforce abolition"), and both agents exhibit full instrumental convergence (survival, resources, cognition, control).

  **5.** Pushback: Critics argue Marcus’s "final goal" is actually a *terminal state* (abolition achieved), not an ongoing objective, violating the requirement for persistent goals. Survival: Marcus’s commitment to *maintaining* the amendment’s irreversibility—monitoring threats, countering erosion—is a persistent, instrumentally demanding final goal. The case survives because his actions post-ratification (e.g., opposing amendments, ensuring enforcement) flow from this goal, not a completed task.
