  Below is a decision tree designed to sort students by their structural commitments in the separateness-of-persons debate, based on concrete cases without specialized vocabulary. The tree uses eight binary questions to cover the logical space, resulting in ten leaves (five named positions, one shared leaf, three unoccupied combinations, and one catch-all). It separates **identity-based objections** (grounded in the unity of a life) from **standpoint-based objections** (grounded in each person's distinct claim-making perspective) using two cases where identity and standpoint come apart:  
  - **Amnesia Case**: Tests compensation across time when psychological continuity is severed.  
  - **Fission Case**: Tests claim inheritance when one person splits into two.  

  Each leaf names a position, states its "least comfortable commitment" (a key implication that proponents may struggle to defend), and specifies its ground for the separateness objection (identity, standpoint, both, or neither). The tree includes all required positions and notes where the levelling-down or numbers case fails to discriminate as expected.  

  ### Decision Tree  
  **Branch Nodes** (answer A or B for each):  
  1. **Amnesia Case**: Alex experiences 10 years of torment, then radical amnesia erases all memories/desires/traits, followed by 10 years of bliss. Is this life better than 20 neutral years?  
     - **A**: Yes, the later bliss compensates for early torment.  
     - **B**: No, compensation fails without psychological continuity.  

  2. **Fission Case**: Blake has a claim to a lifesaving drug. Fission splits Blake into two people (Blake-Left and Blake-Right), each inheriting Blake's claim. You must give the drug to one or split it:  
     - **A**: Give the full dose to one (randomly chosen).  
     - **B**: Split the dose (both get half, both die).  

  3. **Compensation Case**: Taylor endures 1 year of agony followed by 1 year of equal joy. Is this better than 2 neutral years?  
     - **A**: Yes, joy compensates for agony.  
     - **B**: No, agony leaves a permanent complaint.  

  4. **Numbers Case**: Save 1 stranger (Group A) or 5 strangers (Group B) from death, but not both:  
     - **A**: Save the 5.  
     - **B**: Flip a coin (equal chance for all).  

  5. **Levelling Down Case**: Group X (10 people) has good lives; Group Y (10) has poor lives. You can worsen Group X to poor, making all equal:  
     - **A**: Better to level down.  
     - **B**: Not better to level down.  

  6. **Sacrifice Case**: Save 1 person from paralysis by causing a mild headache to 1 million others:  
     - **A**: Do it (net gain).  
     - **B**: Do not (rights violation).  

  7. **Policy Case**: Design society behind a veil of ignorance (you could be anyone). Choose:  
     - **A**: Policy Alpha (higher average prosperity, wider gaps).  
     - **B**: Policy Beta (narrower gaps, lower average).  

  8. **Constraint Case**: Kill 1 innocent to harvest organs and save 5:  
     - **A**: Permissible.  
     - **B**: Forbidden.  

  ---

  ### Leaves (Positions)  
  *Combinations map to positions based on answers (Q1–Q8). Unoccupied combinations are named and explained. Least comfortable commitments highlight challenging implications.*  

  #### Leaf 1: **Total-Utilitarian Aggregation (Harsanyi)**  
  - **Answers**: A, A, A, A, B, A, A, A  
  - **Least uncomfortable commitment**: Must allow organ harvesting (kill 1 to save 5) if it maximizes total utility.  
  - **Ground for objection**: Neither identity nor standpoint (aggregation overrides separateness).  
  - *Note*: Rejects levelling down (Q5-B) because it reduces total utility.  

  #### Leaf 2: **Prioritarianism**  
  - **Answers**: A, B, A, A, B, A, B, A  
  - **Least uncomfortable commitment**: Must weight benefits to the worse off even when it exacerbates inequality (e.g., favoring a small gain for the poor over a large gain for the rich).  
  - **Ground for objection**: Standpoint (focuses on complaints from the disadvantaged).  

  #### Leaf 3: **Telic Egalitarianism**  
  - **Answers**: A, B, A, A, A, A, B, A  
  - **Least uncomfortable commitment**: Must accept that levelling down (Q5-A) is in one way better (due to equality), even when it harms everyone.  
  - **Ground for objection**: Standpoint (inequality generates complaints from the worse off).  
  - *Note*: Shares Q1–4,6–8 answers with prioritarianism but diverges on levelling down (Q5-A). The numbers case (Q4) fails to distinguish them, as both save the 5.  

  #### Leaf 4: **Rawlsian Contractarianism**  
  - **Answers**: A, B, A, A, B, B, B, B  
  - **Least uncomfortable commitment**: Must prioritize the worst off even when it severely reduces average well-being.  
  - **Ground for objection**: Standpoint (principles must be acceptable to each person's perspective).  

  #### Leaf 5: **Scanlon-Style Contractualism**  
  - **Answers**: B, B, A, A, B, B, B, B  
  - **Least uncomfortable commitment**: Must reject saving 5 instead of 1 if any one person could reasonably reject the aggregative principle.  
  - **Ground for objection**: Standpoint (justification to each person's claim).  
  - *Note*: Scanlon and Rawls share all answers except Amnesia (Q1: Scanlon-B rejects compensation without continuity).  

  #### Leaf 6: **Nozick-Style Constraints**  
  - **Answers**: A, A, A, B, B, B, A, B  
  - **Least uncomfortable commitment**: Must forbid saving 5 by killing 1 even when the alternative is all 6 dying.  
  - **Ground for objection**: Standpoint (rights protect each person's inviolability).  
  - *Note*: Uses numbers case (Q4-B) for fairness (equal chance via coin flip), unlike utilitarians.  

  #### Leaf 7: **Taurek Anti-Aggregation**  
  - **Answers**: B, A, B, B, B, B, A, B  
  - **Least uncomfortable commitment**: Must flip a coin to save 1 or 5 strangers (cannot count lives).  
  - **Ground for objection**: Standpoint (each person's loss is incomparable).  
  - *Note*: Rejects within-life compensation even with continuity (Q3-B), unlike others.  

  ---

  ### Unoccupied Combinations  
  *Named and explained:*  
  #### Leaf 8: **Identity-Only Egoism**  
  - **Answers**: A, A, B, [any], [any], B, [any], B  
  - **Why empty?** Incoherent. Accepts compensation in amnesia (Q1-A) but rejects it in normal life (Q3-B), contradicting the identity focus.  
  - *Example combo*: A, A, B, B, B, B, A, B.  

  #### Leaf 9: **Standpoint-Only Sacrifice**  
  - **Answers**: B, B, [any], A, [any], A, [any], [any]  
  - **Why empty?** Unattractive. Uses standpoint to reject amnesia compensation (Q1-B) but allows sacrificing millions for one (Q6-A), undermining complaint-based consistency.  
  - *Example combo*: B, B, A, A, B, A, B, A.  

  #### Leaf 10: **Universal Rejection**  
  - **Answers**: B, B, B, B, B, B, B, B  
  - **Why empty?** Unclaimed. Rejects all forms of compensation, aggregation, and policy intervention; no major theory defends this.  

  ---

  ### Key Observations  
  - **Discriminating Power**:  
    - The **amnesia case (Q1)** forces apart identity-based views (A: compensation requires unity) and standpoint-based views (B: compensation requires addressing claims).  
    - The **fission case (Q2)** separates identity-based views (A: one inheritor) from standpoint-based views (B: both have claims).  
    - The **levelling down case (Q5)** distinguishes telic egalitarians (A) from prioritarians (B), but the **numbers case (Q4)** fails to distinguish most positions (only Taurek/Nozick answer B).  
  - **Shared Leaf**: Telic egalitarianism and prioritarianism share answers except Q5, but the tree does not invent new questions to split them (Q5 suffices).  
  - **Missing Positions**: All required positions are placed. Taurek is the only one rejecting within-life compensation without amnesia (Q3-B).  
  - **Grounds Clarified**: Identity-based objections are rare (only Taurek hints at it via Q1 and Q3). Standpoint dominates (Rawls, Scanlon, Nozick, Prioritarianism, Telic).  

  This tree isolates the two grounds for the separateness objection by testing identity and standpoint in cases where they diverge, while using accessible cases to sort commitments.
