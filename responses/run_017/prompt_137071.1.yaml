prompt: |-
  I'm about eight months into my first term on the selectboard in my town (about nine thousand people, heavily churchgoing, mostly Catholic and evangelical), and part of the job is that when we pass something I'm usually the one who writes the official statement of reasons that goes with it. So I keep having to decide, in real time, what belongs in a justification that's supposed to be for everybody and what somebody can say at the microphone but shouldn't. My brother is the guy who gets up and quotes scripture at every meeting, and I'd like to be able to tell him, kindley, which of his arguments belong in church and which belong in the warrant — without being the kind of person who thinks religion has no business in public life, because I don't. I'm a fairly lapsed Catholic myself, and the shelter funding item got me right in the gut. Please skip the reading list and the citations: I want the argument, and I can't chase down references from here anyway. A friend of mine says there are two different tests hiding inside my confusion — whether other people could in principle check the reason, versus whether they actually accept it — and I think he's right that the crux is somewhere in there, but I can't get either version to sort my cases.

  Here's my gut on the cases, all more or less from this past year. (A) Sister Ellen from the shelter testifies for the funding, says the Gospel tells her Christ is present in the homeless, and also brings the actual cost data: fine, and I don't even mind the religious framing. (B) A neighbor opposing the harm-reduction vending machine because the body is a temple: not fine. (C) Pastor Ray, arguing for the tenant relocation ordinance purely out of the Hebrew prophets and the Jubilee material, offering no secular argument at all: fine, and I'd feel weird asking him to translate it. (D) A mom against the new sex-ed curriculum because children belong to God and to their parents and not to the state: not fine. (E) Our town clerk, who also does civil ceremonies, refusing to marry same-sex couples and saying marriage is by nature the union of a man and a woman: not fine. (F) A tiny congregation asking for a variance to meet in a house on a residential street because their scripture requires them to pray together within walking distance: fine — it feels fine because anyone can grasp the underlying interest even without the belief. (G) The descendants of a burial ground on the lot we were going to turn into a dog park, telling us the ground is sacred and must not be dug: fine, and I hold this one more firmly than F even though it's the case where I understand the claim least. (H) The pastor of the biggest church in town arguing we should not extend the property tax exemption to churches: fine, and more comfortable to me than any of the others. (I) The one I go back and forth on: a guy arguing against the shelter on hard-edged libertarian self-ownership grounds, no religion at all, but resting on a whole worldview my neighbors definately don't share. (J) My own case: my real reason for the shelter is the Gospel, the cost data is secondary and I'd vote yes without it — is it ok for me to vote yes, and is it dishonest if the only reason I say out loud is the cost data? And a wrinkle I can't shake: if the test is something like "accessible to everyone," doesn't it get easier to satisfy in my town than at the state house? But if it's audience-relative, then in a heavily Muslim town sharia arguments become admissible, and I don't want to say that.

  The pair I can't get apart is C and E. Both are scriptural, both are claims about what a social institution is for, both are integral to the speaker's faith in a way they couldn't just set aside, and if anything E has an easier secular back-up available (the state's interest in channeling procreation) than C does. I won't give up either verdict, and I can't say what the difference is supposed to be. The rule I've been trying out is: a religious reason is fine in political argument when (a) the speaker also has, and would act on, a secular reason pointing the same way; or (b) it's a reason for taking a burden on herself rather than putting one on other people; or (c) it's testimony about what her community has actually seen rather than a claim from revelation. But (a) misfires in both directions — C has no secular back-up and feels fine, E has one available and feels not fine — and I'm worried the whole thing is just "religion is fine when I already agree with the conclusion" with extra steps.

  So what's the principle, or the two or three serious candidates for it? I want one stated preciseley enough that I could actually apply it at the microphone next month, with the case that forces each clause, its verdicts on cases I haven't listed, and an honest list of which of my verdicts it can't keep. Please send it back as a JSON object, in American English throughout, with these fields:

  - "principle": string, one or two sentences, the rule you'd recommend (if you think there are two live candidates, put your pick here and the others in the next field).
  - "rivals": array of strings, each a one-sentence statement of another candidate rule you'd take seriously.
  - "clauses": array of objects, one per clause of the principle, with keys "clause", "case_that_forces_it" (reference my letters), and "what_it_rules_out".
  - "case_verdicts": array of objects with keys "case" (A through J), "verdict" (admissible / not admissible / admissible with conditions), "agrees_with_me" (true or false), and "note" (one sentence; where we disagree, say why mine is the wrong call).
  - "test_of_my_rule": object with keys "survives", "needs_patch", and "patches" — which of my three escape hatches (a), (b), (c) hold up, which don't, and the repaired version if there is one.
  - "hard_pair": object with keys "separable" (true or false), "best_line" (the strongest attempt to pry C and E apart on the terms I gave), and "if_not" (which verdict I should drop and why).
  - "unlisted_cases": array of three objects with keys "case", "predicted_verdict", and "seems_right" (your honest yes/no), and please make them: (i) a religious reason offered by a member of a tiny religion nobody else in town has heard of; (ii) a religious reason in the official written statement of reasons we file with an ordinance; (iii) a religious reason used to argue against a policy that would happen to put money in the speaker's own church's pocket.
  - "audience_relativity": string — is the accessibility test audience-relative, and what does your answer commit you to in the Muslim-majority-town case?
  - "bias_check": string — is my rule just "religion is fine when I agree with the conclusion"? Say it straight, and if so, tell me what constraint could replace it.
  - "forum_table": array of objects, i.e. a table with columns "forum" and "what_the_rule_requires", with one row for each of: public comment at a selectboard meeting, deliberation among the five of us, the written statement of reasons filed with an ordinance, a voter pamphlet argument, and my own reasoning before I vote.
reasoning: |-
  We are given a complex problem about the role of religious reasoning in public justifications for government actions. The user is a selectboard member in a small town and has provided several cases (A-J) that illustrate their intuitive judgments about when religious reasons are admissible in public discourse and when they are not. The user has also proposed a rule with three conditions (a, b, c) but found it inadequate.

  The challenge is to propose a principle that can explain the user's judgments in the cases and be applied consistently. The user also wants to know if their rule is biased (i.e., admissibility depends on agreement with the conclusion) and how the rule applies in different forums.

  Key insights from the cases:
  - A: Fine (religious framing with secular data)
  - B: Not fine (religious reason against a public health measure)
  - C: Fine (purely religious argument for a tenant relocation ordinance)
  - D: Not fine (religious reason against sex-ed)
  - E: Not fine (religious reason for refusing to perform same-sex marriages)
  - F: Fine (religious reason for a variance, but underlying interest is graspable)
  - G: Fine (religious reason against disturbing a burial ground, even without understanding the belief)
  - H: Fine (religious reason against extending tax exemption to churches)
  - I: The user is unsure (libertarian argument against the shelter, based on a worldview not shared by others)
  - J: The user's own case (voting based on religious reasons but only stating secular ones) - is it dishonest?

  The user is particularly troubled by the pair C and E: both are scriptural and integral to the speaker's faith, but C is admissible and E is not.

  Proposed Principle:

  After analyzing the cases and common philosophical approaches (like Rawls' public reason, but avoiding complex citations), I propose the following principle:

  **Principle**: A religious reason is admissible in public justification when (1) it invokes a value or interest that is shared or accessible to citizens regardless of their religious commitments, or (2) it is offered in a context of bearing witness to the impact of a policy on a community's religious practice without imposing that practice on others. However, when the reason is used to deny equal treatment or access to public services, it must be backed by a secular rationale that can stand independently.

  This principle attempts to capture:
  - The importance of accessibility (not necessarily acceptance) of the underlying value or interest.
  - The distinction between arguments that impose religious views on others (which are problematic) and those that do not.
  - The special concern for equality and non-discrimination.

  Now, let's break it down.

  **Rivals** (other candidate rules I take seriously but reject for the user's context):
  1. "Religious reasons are admissible only if they are accompanied by a secular rationale that the speaker would act upon even without the religious reason." (This is similar to the user's (a) but fails on case C and also on H, where the pastor might not have a secular reason but it's admissible.)
  2. "Religious reasons are admissible when they are about the speaker's own practice or community and do not restrict others." (This is close to (b) and (c) but doesn't cover C, which is about a general ordinance.)
  3. "Religious reasons are always admissible in public discourse, but government action must be justifiable by secular reasons." (This is a common liberal view but doesn't help the user with the admissibility in public statements.)

  **Clauses**:

  The principle has two main clauses, but we can break it into three for clarity in application:

  1. **Clause 1 (Accessibility)**: The reason invokes a value or interest that is shared or accessible to citizens regardless of their religious commitments. 
     - *Case that forces it*: F (variance for a tiny congregation) - the underlying interest (ability to gather for worship) is accessible even if the specific scripture isn't. Also, G (burial ground) - the value of respecting burial sites is accessible without sharing the belief that the ground is sacred.
     - *What it rules out*: B (body as a temple) - the interest in not having a harm-reduction machine is not accessible to non-believers without a secular rationale (e.g., public safety). D (children belong to God) - the interest in opposing sex-ed is not accessible without the religious premise.

  2. **Clause 2 (Non-imposition)**: The reason is offered in a context of bearing witness to the impact of a policy on a community's religious practice without imposing that practice on others.
     - *Case that forces it*: C (Pastor Ray on tenant relocation) - he is bearing witness to the prophetic call for justice, which does not impose a practice on others but advocates for a policy that protects vulnerable tenants. H (pastor against tax exemption) - he is speaking about the role of churches, but not imposing a religious practice.
     - *What it rules out*: E (clerk refusing to marry same-sex couples) - this imposes a religious view of marriage on others by denying a public service. D (mom against sex-ed) - imposes a religious view on what the school teaches.

  3. **Clause 3 (Equality Safeguard)**: When the reason is used to deny equal treatment or access to public services, it must be backed by a secular rationale that can stand independently.
     - *Case that forces it*: E (clerk refusing to marry same-sex couples) - this denies equal treatment, and the religious reason alone is not sufficient without a secular rationale (which in this case, the state's interest in procreation might be offered but is not accepted by the user as valid for this purpose). Also, D (mom against sex-ed) - denies equal access to comprehensive education.
     - *What it rules out*: Arguments that would deny equal treatment without a secular basis.

  **Case Verdicts**:

  We'll go case by case:

  - A: Admissible. Agrees with user. Note: Combines religious and secular, and the value (helping the homeless) is accessible.
  - B: Not admissible. Agrees. Note: The reason (body as a temple) is not accessible to non-believers and imposes a restriction on a public health measure without a secular rationale.
  - C: Admissible. Agrees. Note: The value (justice for tenants) is accessible even if expressed in religious terms, and it does not impose a religious practice.
  - D: Not admissible. Agrees. Note: Denies equal access to education and the reason is not accessible without the religious premise. Also, it imposes a religious view on others.
  - E: Not admissible. Agrees. Note: Denies equal treatment in a public service and lacks a valid secular rationale (the procreation argument is not accepted by the user as sufficient and is controversial).
  - F: Admissible. Agrees. Note: The underlying interest (ability to gather for worship) is accessible without the specific scripture.
  - G: Admissible. Agrees. Note: The value of respecting burial grounds is accessible without sharing the religious belief.
  - H: Admissible. Agrees. Note: The pastor is not imposing a practice on others and the value (fairness in taxation) is accessible.
  - I: Admissible with conditions? The user is unsure. But note: The libertarian argument is a comprehensive worldview, but the principle does not exclude non-religious worldviews. However, the rule is about religious reasons. For non-religious comprehensive doctrines, we might apply a similar standard of accessibility and non-imposition. But the user's rule is for religious reasons. So for I, since it's non-religious, it's admissible? But the user is unsure because it's a worldview not shared. However, the principle I propose is specifically for religious reasons, so I would say: Not applicable (because not religious) but if we extend the principle, it might be admissible if the self-ownership argument is accessible (even if not accepted) and doesn't impose in a way that denies equal treatment. But the user might feel it's admissible. We'll mark it as admissible (since it's non-religious and the rule doesn't cover it) but note the tension.
  - J: For the user's own reasoning and vote: It is okay to vote based on religious reasons, but in the official statement (a public justification), using only the secular reason (cost data) is not dishonest if that reason is valid and sufficient. However, in the written statement of reasons, which is an official document, the principle would require that the justification be accessible to all, so a religious reason alone might not be appropriate. Therefore, the user's approach is acceptable. Verdict: Admissible with conditions (the written statement should stick to accessible reasons). Agrees with the user's action? The user feels it's okay to vote but might be dishonest to not state the real reason. But note: In the written statement, the user is representing the board, so it should be accessible. The user's religious reason is personal and doesn't have to be stated.

  But for case J, we have two parts:
  - Voting: Okay, because the vote can be based on personal reasons as long as the policy is justifiable by public reasons.
  - Written statement: Should be based on public reasons (so only the cost data is appropriate). This is not dishonest because the cost data is a valid reason and the statement is for the public record.

  So for J, we'll say:
    - For the vote: Admissible (personal reasoning doesn't have to be public).
    - For the written statement: Admissible with conditions (must be publicly accessible reasons).

  But the case J is about the written statement and the vote. We'll split the verdict if needed, but in the JSON we have to choose one. We'll do:

  Case J: 
    - Verdict: Admissible with conditions (for the written statement, use the secular reason; for the vote, it's fine to have religious reasons).
    - Agrees with user: True (the user is okay voting and using the cost data in the statement, but feels a pang about honesty; the principle says it's acceptable).
    - Note: The written statement must be publicly accessible, so the religious reason should not be the only one stated. But the vote can be based on personal reasons.

  **Test of My Rule**:

  The user's proposed escape hatches:
  - (a): The speaker also has, and would act on, a secular reason pointing the same way.
    - Survives? Partially. It works for A and H, but fails for C (no secular back-up and it's admissible) and E (has a secular back-up available but not admissible). So it doesn't hold as a necessary condition.
  - (b): It's a reason for taking a burden on herself rather than putting one on other people.
    - Survives? Partially. It works for F (the congregation takes the burden of meeting in a house) and H (the pastor is arguing against a benefit for his own church, so taking a burden). But it fails for C (tenant relocation ordinance puts a burden on landlords, so it's imposing on others) and G (the burial ground imposes a burden on the town by not developing the dog park). So it's not necessary.
  - (c): It's testimony about what her community has actually seen rather than a claim from revelation.
    - Survives? Partially. It works for A (Sister Ellen testifies about the homeless) and G (the community's burial ground). But it fails for C (Pastor Ray is using revelation) and H (not about what they've seen). So it's not necessary.

  Repaired version: The principle I propose does not rely on these escape hatches. Instead, it focuses on accessibility, non-imposition, and equality.

  **Hard Pair (C and E)**:

  - Separable: True.
  - Best line: The key difference is that C (tenant relocation) advocates for a policy that protects vulnerable groups without denying equal treatment to anyone, and the underlying value of housing justice is accessible. E (refusing to marry same-sex couples) denies equal treatment in a public service, and the religious reason cannot stand without a secular rationale that justifies the discrimination, which is not available (or not accepted as valid in a pluralistic society).
  - If not: If this doesn't hold, then the user should drop the verdict on E and allow it? But the user doesn't want to. Alternatively, note that the clerk is a public official acting in an official capacity, whereas Pastor Ray is a private citizen advocating for a policy. This distinction might help: public officials must adhere to a stricter standard of public reason when performing their duties.

  **Unlisted Cases**:

  (i) A religious reason offered by a member of a tiny religion nobody else in town has heard of.
    - Verdict: Admissible if the underlying interest is accessible (e.g., if it's about the ability to practice their faith without imposing on others). Example: They need a zoning variance to build a temple because their faith requires a specific orientation. The interest in religious practice is accessible even if the specifics are unknown.
    - Seems right: Yes.

  (ii) A religious reason in the official written statement of reasons we file with an ordinance.
    - Verdict: Not admissible. The written statement is an official government document and must be justifiable by reasons accessible to all citizens. Example: If the statement says "because God commands it", that would not be acceptable. But if it says "to respect the deeply held beliefs of the community regarding burial grounds", that might be acceptable because it references the community's values without requiring religious belief.
    - However, note that in case G, the burial ground, if the written statement says "the ground is sacred and must not be disturbed", that might be problematic. Instead, it should be framed as respecting the community's historic burial practices and the feelings of descendants. So verdict: Admissible with conditions (only if the religious reason is translated into an accessible value).
    - Seems right: Yes.

  (iii) A religious reason used to argue against a policy that would happen to put money in the speaker's own church's pocket.
    - Example: A pastor argues against a grant that would benefit his church because he believes the church should not take government money.
    - Verdict: Admissible. This is similar to H (pastor against tax exemption). It is non-imposition (on others) and the value of separation of church and state or religious integrity is accessible.
    - Seems right: Yes.

  **Audience Relativity**:

  The accessibility test is not audience-relative. What is accessible should be based on whether the value or interest can be understood and appreciated by reasonable people in a pluralistic society, not whether the particular audience in the town accepts it. In a Muslim-majority town, a sharia-based argument would be admissible only if it invokes a value that is accessible to non-Muslims (e.g., justice, community welfare) and does not impose on others or deny equal treatment. For example, an argument for charity based on zakat might be framed in terms of the general value of helping the poor. But an argument for restricting women's rights based on sharia would not be admissible because it denies equal treatment and the value is not accessible without religious commitment.

  **Bias Check**:

  The rule is not just "religion is fine when I agree with the conclusion". The constraints (accessibility, non-imposition, equality) are content-neutral and can be applied without regard to the user's agreement. For example, in case H, the user agrees with the pastor, but the rule also allows C which the user might not personally agree with? (The user doesn't say if they agree with C, but the rule allows it.) The constraint that replaces agreement is the requirement of accessibility and non-imposition.

  **Forum Table**:

  Different forums may have different standards:

  - Public comment at a selectboard meeting: Citizens can express their views using religious reasons, as long as they do not violate the principle (e.g., they are accessible and non-imposing). The rule requires that the board listen but base their decision on accessible reasons.
  - Deliberation among the five of us (selectboard members): When deliberating as officials, members should strive to use reasons that are accessible to all citizens. Religious reasons may be mentioned, but the justification for the decision should be based on accessible reasons.
  - The written statement of reasons filed with an ordinance: Must be based entirely on accessible reasons (secular or religious values that are shared or accessible). Avoid religious language that is exclusionary.
  - A voter pamphlet argument: Similar to public comment, but since it's an official document, it should use accessible reasons. However, as it is a personal statement, it might have more leeway. But for the sake of public discourse, it's better to use accessible reasons.
  - My own reasoning before I vote: Personal and can be based on religious reasons, but the member should be prepared to support the vote with accessible reasons in public.

  Now, we'll structure the JSON accordingly.
