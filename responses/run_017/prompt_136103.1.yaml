prompt: |-
  I am writing a paper on the norm of assertion, and before I look at the candidate norms I want the standard of adequacy settled. Please write that specification: the requirements a proposed norm of assertion would have to meet to count as adequate for the job described below, each stated with the case or consideration that motivates it, and each marked as non-negotiable, negotiable, or merely a preference of one camp.

  The job, so that adequacy has a fixed sense: I want a norm that (i) states the conditions under which an assertion is correct, and the conditions under which it is permissible — tell me whether a single norm must supply both or whether two separate norms are legitimate — (ii) can be appealed to by critics, audiences, and the speaker herself, in the sense that it explains the peculiar awkwardness of Moorean-paradoxical utterance, the propriety of challenges like "how do you know?", and the pressure to retract once an assertion is shown to be false, and (iii) is not required to function as a first-personal decision procedure for a speaker wondering what to say. I also want coverage beyond the central case of one adult human sincerely and flatly telling another that p. The norm must be applicable to hedged assertion; to assertion of vague content and of moral or aesthetic content; to first-person future-directed assertion; to assertion whose content the speaker grasps only by deference to an expert, an instrument, or a readout; and to the outputs of composite or artificial speakers — a press office, a jointly authored statement, a conversational AI assistant — where there may be no single mind whose epistemic state is in question.

  Cases and distinctions I expect the requirement list to be answerable to, which you should reorganize into genuine desiderata rather than simply inherit: flatly asserted lottery propositions; warranted but false assertion; so-called selfless assertion, where the speaker has no stake in the truth and the audience no interest in it; assertion by deference, as above; hedged and explicitly probabilistic assertion; the boundary between assertion and its neighbours — guessing, supposing for the sake of argument, conceding, joking, acting as if — which the norm must not collapse; the difference between an assertion's being incorrect and its author's being blameworthy; and the difference between having a status and having the degree of it, if assertion admits of degrees.

  Then the part I care about most. Flag any pair or triple of requirements that cannot be jointly satisfied. My own suspicion is that trouble lies between three demands: that the norm be factive in the sense that truth or knowledge is required for correctness, that it be such that a speaker can normally tell whether she satisfies it, and that it be one unified norm across every kind of content I listed. If a subset is unsatisfiable, say which member you would drop, what its loss costs, and whether the resulting list is still worth having. Also separate the genuine desiderata from the prejudices: is it truly required that the norm be a constitutive rule of a practice rather than an evaluative standard, that it be a single norm rather than a correctness condition plus a permissibility condition, that it vindicate the thought that assertion is the expression of belief, or that it not lean on the very epistemic notion it is meant to illuminate? And tell me which single requirement excludes the largest share of otherwise popular views.

  Close with a table, no more than one line per cell, recording how the knowledge norm, the truth norm, the justified- or reasonable-belief norm, and any contextualist or knowledge-plus-sincerity hybrid do against the list. Where you are unsure of the details of some view, mark the cell uncertain rather than reconstructing the view from plausibility; I would rather have a gap in the table than a confident mistake. No citations, references, or reading suggestions anywhere — I know that literature, and it is the criteria I am missing.
reasoning: |-
  Okay, this is a dense and highly technical philosophy query about assertion norms. The user is clearly deep into epistemology and speech act theory, working on a paper that requires rigorous conceptual groundwork before evaluating existing theories. 

  First, I need to parse the layered request: they want adequacy criteria for assertion norms, organized by motivation cases, with negotiation status markers. The "job description" has three fixed components - correctness/permissibility conditions, explanatory power for key phenomena, and not being a first-person decision procedure. Then there's the expanded coverage requirement beyond standard assertions. 

  The challenge list is extensive: lottery paradoxes, warranted false assertions, selfless assertions, deferred knowledge cases, hedged speech, boundary issues with non-assertions, and correctness vs. blameworthiness distinctions. The user especially wants conflict flags - particularly around factivity, introspective access, and universality across content types. 

  Hmm... the core tension they suspect (factivity + introspective access + universality) is indeed philosophically thorny. If a norm requires truth/knowledge for correctness (factive), but also must be self-assessable by speakers, while applying uniformly to vague/moral/future claims... that seems impossible. Deferred assertions (e.g. "the geiger counter says it's safe") especially strain this - how could the speaker introspectively verify truth in such cases? 

  For the requirement analysis: Some demands feel non-negotiable, like explaining Moorean paradoxes and "how do you know?" challenges. Others seem contextual, like whether correctness and permissibility need separate norms. The user's suspicion about constitutive vs. evaluative norms matters too - many theories conflate these. 

  The table will be tricky. Truth norm clearly fails lottery cases; knowledge norm struggles with warranted false assertions; belief-based norms can't explain retraction pressure. Contextualist hybrids might handle boundaries better but at cost of universality. Must resist guessing - where uncertain, mark it. 

  Biggest exclusionary requirement? Probably the composite speaker case (press offices, AI). This nukes individual-belief-based norms entirely. If keeping this, we must sacrifice either factivity or introspective access. I'd drop introspective access - its loss costs explanatory power for speaker guidance but preserves objective critique standards. 

  Final note: User knows literature cold but seeks criteria clarity. No citations! Focus solely on structural adequacy. The table must be brutally honest about gaps - better empty cells than false confidence.
answer: |-
  Here is a specification of adequacy criteria for a norm of assertion, organized by core requirements, motivated by your cases and distinctions, and assessed for negotiability. Conflicts and exclusions are analyzed at the end, followed by the comparative table.

  **Standard of Adequacy for a Norm of Assertion**

  1.  **Correctness & Permissibility Specification:** Must state necessary and sufficient conditions for an assertion being *correct* (objectively fitting/accurate) and *permissible* (epistemically appropriate for the speaker to make). It must clarify if one norm supplies both, or if separate norms are legitimate.  
      *   *Motivation:* Distinction between warranted false assertion (permissible but incorrect) and correctness requiring truth/factivity. Distinction between speaker blameworthiness and assertion incorrectness.  
      *   *Status:* **Non-negotiable.** The core job description demands this specification.

  2.  **Explanatory Power:** Must explain:  
      a.  The peculiar defectiveness of Moorean-paradoxical assertions ("p, but I don't believe p" / "p, but I don't know p").  
      b.  The propriety of challenges like "How do you know?" or "Why do you believe that?".  
      c.  The normative pressure to retract an assertion shown to be false.  
      *   *Motivation:* Central cases of assertion criticism and self-evaluation (Moorean paradox, challenges, retraction).  
      *   *Status:* **Non-negotiable.** Constitutes core explananda for any norm of assertion.

  3.  **Non-Procedural:** Must *not* be required to function primarily as a first-personal decision procedure for a speaker wondering what to say.  
      *   *Motivation:* Distinction between the norm governing the act and the speaker's deliberative process (which may involve heuristics, contextual stakes, etc.). Avoids conflating the norm with subjective guidance.  
      *   *Status:* **Non-negotiable.** Explicitly stated job requirement.

  4.  **Content & Speaker Generality:** Must be applicable to assertions of:  
      a.  Vague content ("The paint is bluish").  
      b.  Moral/Aesthetic content ("That act is wrong," "This painting is beautiful").  
      c.  First-person future-directed content ("I will finish the report tomorrow").  
      d.  Content grasped only via deference (expert, instrument, readout - e.g., "The reactor is stable" based on gauge).  
      e.  Hedged/Probabilistic assertion ("It's probably raining," "I'm fairly sure she's coming").  
      f.  Outputs of composite/artificial speakers (press office, joint statement, AI - e.g., "Our company denies the allegations").  
      *   *Motivation:* Coverage requirement beyond the central case. Tests universality and avoids content/speaker-type bias. Composite speakers challenge individual-belief-based norms.  
      *   *Status:* **Negotiable** in scope/interpretation (e.g., whether "applicable" means the norm *directly* governs or requires nuanced application; whether probabilistic assertions are "assertions" proper). Failure here is a major weakness.

  5.  **Boundary Maintenance:** Must distinguish assertion from neighboring acts (guessing, supposing, conceding, joking, acting as if) without collapsing them.  
      *   *Motivation:* Preserve the unique normative profile of assertion. Cases like warranted false assertion vs. mere guess.  
      *   *Status:* **Non-negotiable.** Essential for defining the practice governed.

  6.  **Correctness vs. Blameworthiness:** Must accommodate the distinction between an assertion being *incorrect* (failing the norm) and the *speaker being blameworthy* for making it.  
      *   *Motivation:* Warranted false assertion (incorrect but blameless), potentially some selfless assertions or complex deference cases.  
      *   *Status:* **Non-negotiable.** Fundamental to normative evaluation.

  7.  **Degrees (If Applicable):** If assertion admits of degrees of strength/commitment, the norm must account for degrees of correctness/permissibility.  
      *   *Motivation:* Hedged/probabilistic assertion, varying strength of flat assertions.  
      *   *Status:* **Preference/Negotiable.** Contentious whether assertion itself has degrees or if hedging modifies the act type. If required, it complicates factive/knowledge norms.

  **Conflict Analysis & Requirement Scrutiny**

  *   **Core Suspected Conflict (Factivity + Introspective Access + Universality):**  
      *   **Conflict:** A **factive** norm (requiring truth/knowledge for correctness - Req 6) applied **universally** (Req 4) conflicts with **introspective access** (the idea a speaker can normally tell if they satisfy it).  
          *   *Why:* In **deference cases** (4d) and **composite speakers** (4f), the speaker(s) often *cannot* introspectively verify truth/knowledge. **Future-directed assertions** (4c) involve inherently uncertain truth. **Vague/moral assertions** (4a/b) challenge objective factivity and direct verification. **Hedged assertions** (4e) explicitly signal lack of full factive standing.
      *   **Which to Drop?** Drop **Introspective Access** as a *requirement for the norm itself*. The norm is an objective standard, not a subjective guide (Req 3 already separates norm from procedure).  
          *   *Cost:* Loses some explanatory power for *how* speakers self-monitor (though Req 3 allows other mechanisms). Norm becomes more externalist.  
          *   *Result:* Retaining **Factivity** and **Universality** is still valuable. Factivity explains retraction pressure (Req 2c) and correctness vs. blameless incorrectness (Req 6). Universality ensures broad applicability. A norm lacking factivity struggles with correctness (Req 1) and retraction pressure (Req 2c). A norm lacking universality seems incomplete.

  *   **Other Potential Tensions:**
      *   **Factivity (Req 6) vs. Hedged Assertion (Req 4e):** Can a factive norm govern an act explicitly probabilistic? Requires explaining how hedging relates to the core norm (e.g., weaker commitment, fallback).
      *   **Universality (Req 4a/b) vs. Factivity/Knowledge (Req 6):** Do vague/moral truths exist robustly enough for factivity? Requires a metaethical stance or norm reinterpretation.
      *   **Explanatory Power (Req 2b) vs. Non-Procedural (Req 3):** "How do you know?" seems procedural. Resolution: The challenge appeals to the *norm* (knowledge required) as justification, not necessarily asking for the speaker's *process*.

  *   **Scrutinizing "Prejudices":**
      *   **Constitutive vs. Evaluative:** **Not required.** A robust evaluative standard can suffice if it meets all criteria. Insisting on constitutive status adds unnecessary metaphysical baggage.
      *   **Single Norm vs. Correctness+Permissibility:** **Negotiable.** A single norm (e.g., Knowledge governing both) is elegant. Separate norms (e.g., Truth for correctness, Justified Belief for permissibility) handle Req 6 cleanly. Adequacy depends on coherence and explanatory power.
      *   **Expression of Belief:** **Not required.** While belief-expression is common, Req 4f (composite speakers) shows it's not essential. The norm should govern the *act*, not necessarily its mental accompaniment.
      *   **Non-Circularity (Not leaning on epistemic notions):** **Preference.** While desirable, a norm might inherently involve justification or knowledge without vicious circularity *if* it illuminates assertion specifically. Strict avoidance may be impossible or yield overly weak norms.

  *   **Biggest Exclusionary Requirement:** **Composite/Artificial Speakers (Req 4f).** This requirement most severely challenges norms centered on *individual mental states* (Belief, Knowledge held by a single mind). It necessitates a norm focusing on the *act's grounding* or *institutional role* rather than individual psychology. This excludes many traditional belief-based or internalist knowledge norms.

  **Norm Comparison Table**

  | Requirement                          | Truth Norm                     | Knowledge Norm                | Justified/Reasonable Belief Norm | Contextualist/K-Sincerity Hybrid     |
  | :----------------------------------- | :----------------------------- | :---------------------------- | :------------------------------- | :----------------------------------- |
  | **1. Correctness & Permissibility**  | Correct=Permissible=Truth      | Correct=Permissible=Knowledge | Correct=? Permissible=Justified Belief | Varies (e.g., Correct=Truth? Permissible=Contextual Know/Sincere Just Belief?) |
  | **2a. Moorean Paradox (p & ~Bp)**    | Explains poorly               | Explains well                | Explains poorly                  | Explains well if includes belief     |
  | **2a. Moorean Paradox (p & ~Kp)**    | Explains poorly               | Explains well                | Explains well (if K implies JB)  | Explains well                        |
  | **2b. "How know?" challenge**        | Poor fit (asks for warrant)   | Excellent fit                | Good fit                         | Good fit                             |
  | **2c. Retraction pressure (false)**  | Excellent fit                 | Excellent fit                | Poor fit                         | Good fit (if correctness factive)    |
  | **3. Non-Procedural**                | Easily meets                  | Easily meets                 | Easily meets                     | Easily meets                         |
  | **4a. Vague Content**                | Problematic (vagueness)       | Problematic                  | Applies                          | Applies                              |
  | **4b. Moral/Aesthetic**              | Problematic (truth aptness?)  | Problematic                  | Applies                          | Applies                              |
  | **4c. Future-Directed**              | Problematic (truth value)     | Problematic                  | Applies                          | Applies                              |
  | **4d. Deference**                    | Problematic (speaker access)  | Problematic (speaker access) | Applies (if justification transfers) | Applies (if context allows)          |
  | **4e. Hedged/Probabilistic**         | Poor fit (not flatly true)    | Poor fit                     | Good fit (if justification matches hedge) | Good fit                             |
  | **4f. Composite/Artificial Speakers**| Applies (if output true)      | Problematic (no single knower) | Applies (if output justified)    | Applies (if context defines "speaker" warrant) |
  | **5. Boundary Maintenance**          | Good (truth aptness central)  | Good                         | Weaker (guesses can be justified) | Good (context often marks boundary)  |
  | **6. Correctness vs. Blame**         | Clear Distinction             | Clear Distinction            | Blurs Distinction                | Clear Distinction (if correctness factive) |
  | **7. Degrees (If Needed)**           | Poor                          | Poor                         | Good                             | Good                                 |

  **Key Uncertainties in Table:**
  *   **Justified Belief Norm:** Correctness condition is often underspecified.
  *   **Hybrid Norms:** Specifics vary greatly. Correctness might be Truth or Contextual Knowledge. Permissibility often blends contextual knowledge standards with sincerity or justification.
  *   **Deference (All):** Success depends heavily on specific accounts of testimony/justification transfer.
  *   **Composite Speakers (Knowledge):** Whether "group knowledge" can satisfy the norm is debated and view-dependent.

  This specification provides a clear, case-motivated framework for evaluating candidate norms based on their ability to fulfill the core functions and handle the complexities of assertion as you've defined them. The identified conflict and exclusionary requirement highlight significant challenges for popular views.
