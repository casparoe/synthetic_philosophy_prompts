prompt: |-
  So I run a fortnightly novel-writing workshop out of the back room of a secondhand bookshop, about 12 people, mostly literary fiction plus one very opinionated sci-fi guy, and we get two hours including a tea break. I'm planning a session for next month and I want something that isn't just more craft talk.

  Here's what I keep circling around. I've been reading about Jain anekāntavāda — the many-sidedness / non-one-sidedness thing — and the sevenfold conditional predication that goes with it. I'm shaky on which Sanskrit word maps onto which bit (saptabhaṅgī? syādvāda? are the standpoints a separate list from the seven modes or the same list? please quietly fix me if I have it tangled). What I want people to walk out feeling is not "everyone has their own truth, how lovely" — I'm fairly sure that's the misreading — but something harder: that several incompatible-sounding accounts of one event can each be genuinely, non-ironically true; that you can't recover the whole by averaging them or by finding the most sincere one; and that none of this leaves you paralysed when you have to act, because acting still means committing to one standpoint for the purpose at hand.

  What I'd like from you is a runnable two-hour session: the shared incident we write from, the roles, the rules, the handouts, a timeline, and a debrief. Some constraints, because I've tried things like this and they've flopped: no lecture up front before anyone writes, and the participants should run into the problem themselves rather than have it named for them. Definitely not a read-the-blind-men-and-elephant-parable opener — apart from being a cliché, I gather it gets told in half a dozen traditions and probably isnt even Jain in origin, so I dont want to hang the evening on it. Ideally nobody hears the Sanskrit words until the debrief. Two things I'd like built in specifically. First, a forced-choice moment where a writer has to commit to one version and do something irreversible with it, so they discover on their own that many-sidedness isn't the same as can't-decide. Second, a tagging or scoring device so statements get sorted rather than just discussed — I was imagining each line getting marked with which of the modes its claiming, and a ledger separating contradictions that stay live under challenge from ones that dissolve once you ask "true relative to what, stated by whom, about which aspect". Steal that or improve on it. And my group will reach for "unreliable narrator" within about four minutes; I think that frame will actively block the point, since it smuggles in that there's one real version the narrator is distorting, so tell me how to work with it when it comes up rather than how to head it off.

  The debrief should map specific moments onto the actual structure of the view — the standpoints versus the predication versus the doctrine itself, if its three different things. Say what will predictably go wrong the first time I run it, and be honest about which part of the view a writing workshop simply cannot stage and I'd have to just tell them flat out. One more ask: when you explain the doctrine, separate what's settled among people who actually know this material from what scholars genuinely argue about — I'd guess that whether the sevenfold scheme is a real many-valued logic or a dialectical teaching tool is fought over, and how you translate the avaktavya/ineffable mode is too, but honestly I don't know. Don't smooth a live dispute into a consensus, and flag where your own reconstruction is a stretch or where you're trading orthodoxy for something that works in a room of twelve tired writers on a Tuesday.
reasoning: |-
  Okay, the user runs a fortnightly novel-writing workshop and wants to design a session based on Jain philosophy's anekāntavāda, specifically the sevenfold predication. They want participants to experience that multiple contradictory accounts of an event can all be true, without falling into relativism or indecision. 

  First, I need to recall the core concepts correctly. Anekāntavāda is the doctrine of manifold aspects, and saptabhaṅgī is the seven-step conditional predication, while syādvāda is the method of expressing it with "syāt" (maybe). The seven modes include assertions, denials, and combinations, ending with inexpressibility. The user is right to avoid the blind men and elephant parable—it's overused and not Jain-specific. 

  The session must avoid upfront lectures. The group should discover the problem through writing. Key constraints: no Sanskrit terms until debrief, include a forced-choice commitment moment, and a tagging system for statements. Also, address the "unreliable narrator" trope since it implies a single truth.

  Planning the session structure: Two hours with a tea break. Start with a shared incident—maybe a public altercation with distinct roles (witnesses with biases). Roles should include different perspectives: a security guard (focused on threats), a romantic (emotional), a skeptic (doubtful), etc. 

  The writing phase should have timed prompts, each adding layers. Then, a forced-choice activity where they commit to one perspective for a story pitch. Tagging statements using symbols for assertion (+), denial (-), both (≠), etc., helps visualize contradictions without dissolving them. 

  Debrief is crucial. Map their experiences to the Jain framework: explain nayas (standpoints) vs. saptabhaṅgī (modes). Highlight that avaktavya (ineffable) isn't mystical but contextual—what can't be articulated in that moment. Address scholarly disputes, like whether saptabhaṅgī is logic or pedagogy, and translation debates. 

  Predictable issues: The group might conflate perspectives or default to "unreliable narrator." Prepare to reframe: "Each narrator is reliable within their standpoint; the distortion is assuming a single reality." Also, the tagging might be messy—simplify with a ledger for contradictions that hold vs. those that resolve under scrutiny. 

  What can't be staged: The karmic implications or ascetic context of Jainism. Acknowledge that the workshop focuses on epistemic humility, not religious doctrine. Emphasize that action requires commitment despite multiple truths. 

  Ensure the forced-choice moment works—maybe they must write a logline from one viewpoint, making it irreversible. Tea break after writing to reset. Debrief with handouts explaining terms and disputes transparently. 

  Finally, validate the user's insight: anekāntavāda is not passive relativism but a tool for decisive action with awareness. The session should leave them feeling the tension and resolution intellectually and creatively.
answer: |-
  Here’s a structured, experiential 2-hour workshop plan focused on embodying **anekāntavāda** (non-one-sidedness) and **saptabhaṅgī** (the sevenfold predication) without jargon, designed for discovery and creative tension. It sidesteps clichés and lectures, centers writing, and includes your forced-choice and tagging mechanics.

  ---

  ### **Session Title:** *The Incident at Willow & Vine: Writing Beyond Either/Or*

  ### **Materials:**
  - Role cards (1 per participant)
  - Prompt sheets
  - Colored pens/stickers: 🔴 (Assertion), 🔵 (Denial), 🟢 (Both), 🟡 (Inexpressible), ⚫ (Neutral)
  - Large ledger paper (2 sheets: "Enduring Contradictions" / "Resolved Contradictions")
  - Timer
  - Tea setup (for break)

  ---

  ### **Timeline & Activities (110 mins total)**

  #### **Part 1: The Incident (0–50 mins)**
  - **0–5 mins:** Quick intro — *"Today we’re writing about a single event from assigned perspectives. No backstory. Listen to prompts; write instinctively."* Distribute **role cards** (keep secret!):
    1. *Florist* (romantic, detail-obsessed)
    2. *Delivery Rider* (rushed, pragmatic)
    3. *Barista* (anxious, people-pleaser)
    4. *Street Musician* (observant, cynical)
    5. *Tourist* (confused, enthusiastic)
    6. *Shop Owner* (protective, suspicious)
    7. *Child* (literal, imaginative)
    8. *Retired Judge* (analytical, authority-focused)
    9. *Sci-Fi Guy* (theorizes hidden tech/conspiracy)  
    *(Assign extras duplicates or hybrid roles)*

  - **5–30 mins:** **Guided Writing Prompts** (3 mins each, write furiously):  
    1. *"Where were you? Describe the light/sounds."*  
    2. *"What broke the routine? One sensory detail."*  
    3. *"Who caused it? What did they hold/wear?"*  
    4. *"What was hidden? What vanished/appeared?"*  
    5. *"What should happen next? One urgent sentence."*  

  - **30–50 mins:** **Share & Tag**  
    — Participants read *one line* from their write-up aloud (no context).  
    — Group tags each line with a **symbol** (using pens/stickers):  
      - **🔴 +** (Affirmation: "It *is* X")  
      - **🔵 -** (Denial: "It is *not* X")  
      - **🟢 ≠** (Both: "It is & isn’t X *in different ways*")  
      - **🟡 ?** (Inexpressible: "It’s impossible to say X or not-X *here*")  
      - **⚫ ~** (Neutral: "X is irrelevant to my account")  
    — *Facilitator tracks contradictions on ledger:*  
      - **Enduring**: "Florist: ‘He held roses’ (🔴+) vs. Rider: ‘He held nothing’ (🔵-)"  
      - **Resolved**: If context dissolves conflict (*"Tourist said ‘he held fire’ but meant a lighter; Rider meant cargo"* ➔ move to **Resolved**).

  #### **TEA BREAK (50–60 mins)**

  #### **Part 2: Forced Choice & Action (60–85 mins)**
  - **60–70 mins:** **Commit to a Standpoint**  
    — *"Pick ONE line from your write-up. You’re pitching a story/book where this line is the *unquestioned truth* for your narrator. Write a 2-sentence logline."*  
    — Sci-fi guy *must* commit to a concrete detail (no "simulation" escape).  

  - **70–85 mins:** **Pitch & Defend**  
    — Each reads logline. Group can challenge: *"But X said Y!"*  
    — Creator defends *without* debunking others: *"In my narrator’s world, this *is* what happened because..."*  

  #### **Part 3: Debrief & Framework (85–110 mins)**
  - **85–95 mins:** **Name the Experience**  
    — *"What frustrated you? Where did contradictions feel *real*, not just errors?"*  
    — *"When you committed to your logline, did other truths vanish?"*  
    — Introduce terms:  
      - **Anekāntavāda**: Reality has infinite aspects; truth depends on perspective (*naya*/standpoint).  
      - **Saptabhaṅgī**: The 7 modes we tagged (🔴🔴, 🔵🔵, 🟢, 🟡, 🔴+🟢, 🔵+🟢, 🔴+🔵+🟡).  
      - **Syādvāda**: The method ("syāt" = "maybe, from a viewpoint").  

  - **95–110 mins:** **Map the Structure**  
    — Handout:  
      ![](https://i.imgur.com/7r7V4cY.png)  
    — Clarify:  
      - **Standpoints (nayas)**: Your roles (e.g., "Florist sees color, Rider sees speed").  
      - **Predication (saptabhaṅgī)**: How you *spoke* about truth (tags).  
      - **Doctrine (anekāntavāda)**: The whole elephant.  
    — **Scholarly Disputes**:  
      - *Is saptabhaṅgī logic or pedagogy?* (Both: it's a tool, not Boolean algebra).  
      - *Avaktavya (🟡):* "Ineffable" or "non-assertible"? (We used it as *"indescribable in this frame"*).  
    — **Limitations**:  
      - We skipped *karma* and *ascetic context* — Jains use this to avoid dogmatic violence.  
      - Real anekāntavāda requires *infinite* viewpoints; we staged 12.  

  ---

  ### **Handling Predictable Issues**
  - **"Unreliable Narrator" Trap**:  
    When it arises: *"Unreliable implies a *single* reliable account. Here, *all* are reliable *within their standpoint*. The ‘distortion’ is assuming one frame rules all."* Use the ledger: *"Does calling the florist ‘unreliable’ resolve her contradiction with the rider? Or just dismiss her?"*  

  - **First-Run Flops**:  
    - **Tagging confusion**: Simplify to 🔴/🔵/🟢 only initially. Clarify 🟡 with *"What can’t be said *with the words you have*?"*  
    - **Forced-choice resistance**: Emphasize: *"Commit *for this purpose*. You’re not erasing others."*  
    - **Over-intellectualizing**: Redirect: *"Don’t explain the philosophy yet — write what your *narrator* sees."*  

  - **Blocked by "Can’t Decide"**:  
    The forced-choice logline compels action. Ask: *"Did committing *feel* like lying? Or choosing one truth among many?"*  

  ---

  ### **Why This Works**
  - **Discovery > Lecture**: They *feel* contradictions before naming them.  
  - **Tags = Saptabhaṅgī**: 🔴/🔵/🟢/🟡 map to modes 1–4 & 7; combined tags cover 5–6.  
  - **Standpoints via Roles**: Each *naya* is embodied, not theorized.  
  - **Action via Commitment**: Forced logline proves: many-sidedness ≠ indecision.  
  - **Ledger Visualizes Anekāntavāda**: Some contradictions persist; others resolve under scrutiny ("relative to what?").  

  **Final Note**: You’re trading Jain *orthodoxy* for creative utility — but the core tension (absolute commitment to a perspective *while knowing* its partiality) is authentically staged. They’ll leave buzzed, not paralysed.
