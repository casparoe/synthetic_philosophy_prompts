prompt: |-
  I'm co-organizing a small closed workshop for people who work on psychiatric nosology, and my co-organizer (a philosopher of science) and I have finally persuaded two colleagues who have been circling each other for years to try an adversarial collaboration instead of another round of papers. One of them is a psychiatrist-neuroscientist who sits on a diagnostic-manual working group; call her side the discovery camp: it holds that at least some psychiatric categories name causally structured targets that classification can track progressively, that the instability of our categories is a measurement problem to be engineered away, and that looping — the way a classified population's awareness of its classification feeds back into the profile being classified — is one such nuisance among others. The other is a philosopher who works on interactive and human kinds; call his side the looping camp: it holds that for these kinds the feedback is partly constitutive rather than merely disruptive, that the target moves because the description moves and not only because our instruments are crude, and that when a category looks stable that stability is a local, institutionally maintained achievement rather than evidence of having found a joint. Both have agreed in advance to sign whatever they can genuinely sign, and to say plainly where they can't. What I need from you is the document they should come out with: a list of agreed claims, numbered, each one substantive enough that a naive version of either camp would have denied it before they started (I don't want agreements of the form that classification is hard or that words matter), followed by a disagreements table whose rows are cruxes and whose columns give the precise formulation each side would accept for its own position, what each side would count as evidence or argument that would move it, and — this is the part I care most about — for each crux a case or prediction both accept in advance as bearing on it, with each side's guess written down before the fact.

  To keep them off their usual examples, I've asked them to argue over material we've stipulated rather than over the settled literature, and I'd like you to do the same: no citations, no bibliographies, no named authorities, no contested history, and if you want an empirical illustration, flag clearly whether it is stipulated or something neither party could currently check. The case is a hypothetical proposed category for the next revision of a major diagnostic manual — maladaptive anticipatory vigilance, a pattern of compulsive threat-monitoring and checking — together with three stipulated findings. First, a proposed quantitative measure, the Semantic Recoil Index, tracking how much a category's prevalence and symptom profile shift when its criteria text is made public and taught in schools: the working group's multi-site data show prevalence roughly doubling within five years of an awareness campaign, but also show a comparable rise in a holdout cohort drawn from archival interviews recorded before the category existed and re-coded blind, with no exposure to the campaign. Second, a laboratory marker present in about 60 percent of those meeting criteria after the campaign versus about 55 percent before it. Third, when the criteria were tightened, the clinical presentation shifted to the new vocabulary while marker prevalence among cases stayed flat.

  Two further things I want handled explicitly, because I suspect most of the last decade of argument is hiding in them. The first is a deflationary move the discovery camp likes: that looping is just a species of measurement reactivity or observer effect of the sort any science has to correct for — with the corollary that classifier-responsive targets also show up outside psychiatry, wherever classified systems adapt to being classified, as with tumor subtypes under treatment or machine-learning classifiers facing adaptive adversaries — so that nothing about human kinds is special except degree. I want the joint statement to say whether the looping camp can sign any of that, and if it can't, exactly which clause it has to reject and what that clause was doing. The second is the obvious peace treaty, that these categories are both discovered and made; I want to know whether the statement treats that as a substantive position with content the two sides could disagree about, or as a verbal truce that dissolves the moment anyone asks what a nosology committee should do. So please also include a short verbal-versus-genuine section naming which parts of the dispute you take to be about words and why, and a closing section addressed to the committee that has to vote on whether to adopt maladaptive anticipatory vigilance: what, if anything, follows for that decision from the disagreement as the two sides have now stated it, and what either side would want measured before the vote. Define any technical term you use, and keep both sides' formulations ones they would recognise as their own rather than as caricatures.
reasoning: |-
  We are drafting a joint statement for two camps in psychiatric nosology: the "discovery camp" (psychiatrist-neuroscientist) and the "looping camp" (philosopher). The statement must include:
  1. A numbered list of agreed claims, each substantive enough that a naive version of either camp would have denied it.
  2. A disagreements table with:
     a. Rows as cruxes (key points of disagreement).
     b. Columns for each side's precise formulation of their position on the crux.
     c. What each side would count as evidence or argument that would move them.
     d. For each crux, a case or prediction both accept in advance as bearing on it, with each side's guess written down before the fact.

  The case is a hypothetical category: "maladaptive anticipatory vigilance" (MAV), with three stipulated findings:
  - Stipulated Finding 1 (S1): Semantic Recoil Index (SRI) data show prevalence doubling after an awareness campaign, but a comparable rise in a holdout cohort (archival interviews re-coded blind, no exposure).
  - Stipulated Finding 2 (S2): A laboratory marker present in ~60% post-campaign vs. ~55% pre-campaign.
  - Stipulated Finding 3 (S3): When criteria were tightened, clinical presentation shifted to new vocabulary, but marker prevalence among cases stayed flat.

  We must also address:
  - The deflationary move: Is looping just measurement reactivity, with nothing special except degree? The joint statement must say whether the looping camp can sign any of that and, if not, which clause is rejected and why.
  - The "both discovered and made" peace treaty: Is it substantive or a verbal truce?

  Finally, include:
  - A section on which parts are verbal versus genuine disagreements and why.
  - A closing section for the nosology committee: what follows for adopting MAV, and what either side would want measured before the vote.

  Definitions:
  - Maladaptive Anticipatory Vigilance (MAV): A proposed psychiatric category characterized by compulsive threat-monitoring and checking.
  - Semantic Recoil Index (SRI): A quantitative measure of how much a category's prevalence and symptom profile shift when its criteria text is made public and taught.
  - Looping: The process by which a classified population's awareness of the classification feeds back into the profile being classified.

  Approach:

  Agreed Claims:
  We need claims that both sides can genuinely sign, but that a naive version of either camp would have denied. The naive discovery camp would deny that looping is constitutive; the naive looping camp would deny that there are stable causal structures to be discovered. We must avoid trivial agreements.

  Possible agreed claims (to be numbered):
  1. The Semantic Recoil Index (SRI) data (as in S1) demonstrate that prevalence changes can occur independently of direct exposure to the diagnostic criteria (as shown by the holdout cohort). Both camps must agree that this is possible. The discovery camp might have thought that without exposure, prevalence wouldn't change; the looping camp might have thought that the rise in the holdout cohort must be due to indirect cultural effects. But both can agree that the data show a rise without direct exposure, which complicates a simple story.

     However, note: the holdout cohort was re-coded blind, so the rise in prevalence in the holdout cohort might be due to changes in the broader cultural context (which the awareness campaign also affects). The looping camp might say that the holdout cohort's rise is still due to looping, but via indirect cultural channels. The discovery camp might say that the rise is due to better measurement (archival interviews might have missed cases). We need to see if they can agree on a claim that both would have denied a naive version of.

     Let's try: "The prevalence of a psychiatric category can change over time even in the absence of direct exposure to the diagnostic criteria, as evidenced by the holdout cohort in the SRI data."

     The naive discovery camp might have denied that prevalence could change without a change in the underlying reality (so they might have expected the holdout cohort to be stable). The naive looping camp might have denied that a change could occur without direct exposure (so they might have expected the holdout cohort to be stable if there's no exposure). But both now see that it did change. So both can agree.

  2. The laboratory marker data (S2) show that the marker is present in a majority of cases both before and after the awareness campaign, with a small increase post-campaign. Both camps can agree that the marker is associated with the condition, but the small change (55% to 60%) might be interpreted differently. However, the agreement might be: "A laboratory marker can be stably associated with a psychiatric category even when the prevalence and symptom profile of that category shift significantly (as per S1 and S3)."

     The naive discovery camp might have expected the marker to be more stable (so they might be surprised by the shift in prevalence and symptoms). The naive looping camp might have expected the marker to be more sensitive to the shift (so they might be surprised it stayed relatively stable). Both can agree that it is associated and that the association is not disrupted by the changes.

  3. When diagnostic criteria are tightened (S3), the clinical presentation shifts to the new vocabulary, but the marker prevalence remains flat. This shows that the way people express their symptoms can change without a corresponding change in the underlying marker. Both camps can agree: "Changes in the diagnostic criteria for a psychiatric category can lead to shifts in the clinical presentation (e.g., the language used to describe symptoms) without necessarily altering the prevalence of an associated laboratory marker among those meeting the criteria."

     The naive discovery camp might have thought that changing criteria would better capture the underlying reality and thus change the marker prevalence. The naive looping camp might have thought that the marker would change because the underlying kind changes. Both can now agree that the marker can remain stable even when the presentation shifts.

  4. Both camps agree that the Semantic Recoil Index (SRI) is a useful measure for tracking changes in prevalence and symptom profile in response to diagnostic publicity. (This is an agreement about a tool, but we need to see if it's substantive. The discovery camp might have thought that SRI is just noise; the looping camp might have thought it essential. But now both see value in measuring it.)

     However, let's make it more substantive: "The Semantic Recoil Index (SRI) captures a real phenomenon: that the public dissemination of diagnostic criteria can lead to changes in the prevalence and symptom profile of a psychiatric category, and that this phenomenon is not solely attributable to changes in measurement or reporting practices (as the holdout cohort rise shows)." But note: the holdout cohort rise is not due to direct dissemination, so it complicates the picture. Maybe: "The SRI data demonstrate that changes in the cultural awareness of a diagnostic category can lead to changes in the measured prevalence and symptom profile, even when those changes are not solely due to direct exposure of patients to the criteria text."

     This might be too vague. Alternatively, both can agree that SRI is a valid measure of the effect, and that the effect is real.

  5. Both camps agree that there are both biological and social factors at play in the formation and maintenance of psychiatric categories. (But this might be too vague and close to the "both discovered and made" truce.)

  We need 3-5 agreed claims. Let's propose:

  Agreed Claims:
  1. The prevalence of a psychiatric category can change over time even in the absence of direct exposure to the diagnostic criteria by the individuals being assessed, as demonstrated by the holdout cohort in the SRI data for MAV.
  2. A laboratory marker can be stably associated with a psychiatric category (as seen in MAV with the marker present in 55-60% of cases) even when the prevalence and symptom profile of that category shift significantly in response to changes in diagnostic awareness or criteria.
  3. When diagnostic criteria for a psychiatric category are tightened, the clinical presentation of individuals meeting the criteria can shift (e.g., adopting the new vocabulary) without a corresponding change in the prevalence of an associated laboratory marker among those cases.

  Disagreements Table:

  Cruxes (key points of disagreement). We must have at least two.

  Crux 1: The nature of looping feedback.
  - Discovery camp: Looping is a form of measurement reactivity or observer effect that distorts the measurement of a pre-existing causal structure. It is a nuisance to be corrected by better engineering (e.g., blind assessments, objective markers). The target (the psychiatric kind) is causally structured and exists independently of the classification, but our instruments are imperfect and reactive.
  - Looping camp: Looping is partly constitutive of the kind itself for psychiatric categories. The feedback is not merely disruptive but shapes the very nature of the condition. The target moves because the description moves, and the stability of the category is a local achievement of institutional practices.

  What would move each side?
  - Discovery camp: Evidence that after controlling for measurement reactivity (e.g., using blind assessments, objective markers), the underlying causal structure remains stable and predictive of outcomes. Also, if it can be shown that the looping effects are reducible to known cognitive biases or social influences that can be measured and corrected.
  - Looping camp: Evidence that even when using the best available objective measures and controls for reactivity, the category's profile and associated behaviors continue to shift in response to changes in classification and its dissemination. Also, if it can be shown that attempts to "correct" for looping by fixing the criteria lead to new forms of looping.

  Case/Prediction for Crux 1:
  Both accept that the stipulated MAV findings bear on this. Specifically, they agree to use the following prediction:

  - After the awareness campaign and the rise in prevalence (as per S1), if the diagnostic criteria are then altered to be more restrictive (as in S3) and the awareness campaign is halted, what happens to the prevalence and the marker over the next 5 years?
    - Discovery camp prediction: Prevalence will drop to a level closer to the pre-campaign baseline (because the criteria are tightened and the reactive effects are reduced by halting the campaign). The marker prevalence will remain stable or become more specific (since it tracks the underlying cause).
    - Looping camp prediction: Prevalence may not drop to the pre-campaign level because the category has become embedded in the culture (e.g., through media, patient communities). The marker prevalence might change because the population meeting the criteria is now different (due to the looping effects having altered the expression of the condition).

  Crux 2: The stability of the target.
  - Discovery camp: The instability of psychiatric categories is primarily due to measurement problems (including reactivity). With better tools (e.g., laboratory markers, standardized assessments), we can track a stable underlying causal structure. The fact that the marker prevalence remained flat (S3) despite changes in criteria shows that there is a stable biological component.
  - Looping camp: Stability in psychiatric categories (when it occurs) is a local achievement of institutional practices (e.g., diagnostic criteria, treatment protocols) and not evidence of having found a natural joint. The flat marker prevalence in S3 does not indicate a stable natural kind because the marker might be an artifact of the current diagnostic framework.

  What would move each side?
  - Discovery camp: Evidence that the laboratory marker is not just an artifact but is causally linked to the condition (e.g., through genetic studies, animal models, or intervention studies). Also, if the marker predicts outcomes (e.g., treatment response) consistently across different cultural contexts and time periods.
  - Looping camp: Evidence that the same marker is found in different diagnostic categories when the criteria change, or that the marker's prevalence changes when the cultural context changes without a change in the criteria. Also, if the marker does not predict outcomes consistently when the diagnostic practices vary.

  Case/Prediction for Crux 2:
  Both accept a study design: In two different cultural regions (with different diagnostic traditions for anxiety disorders), introduce the MAV criteria and measure the marker. Then, after an awareness campaign in one region, measure again.

  - Discovery camp prediction: The marker prevalence will be similar in both regions at baseline and after the campaign, because it tracks the same underlying biological reality.
  - Looping camp prediction: The marker prevalence will change more in the region with the awareness campaign because the cultural embedding of the category will alter the symptom presentation and thus who gets included, potentially affecting the marker's prevalence.

  But note: We have to use the stipulated data or a hypothetical that both accept. Alternatively, we can use a future prediction based on the MAV case.

  Since the committee has to decide on MAV, we can frame a prediction about what will happen after adoption.

  - Prediction: If MAV is adopted and widely publicized, and then after 5 years the criteria are revised to be more restrictive, what will happen to the marker prevalence among those diagnosed under the new criteria?
    - Discovery: The marker prevalence will increase because the new criteria better capture the biological reality.
    - Looping: The marker prevalence will remain the same or decrease because the criteria change is just shifting the boundaries of a socially constructed category.

  But we have S3: when criteria were tightened, marker prevalence stayed flat. So that already happened. We need a new prediction.

  Alternatively, we can use a different hypothetical: a cross-cultural comparison.

  We'll design a case both accept: "In a country that has not adopted MAV and has minimal exposure to Western psychiatric categories, conduct a study using the MAV criteria and measure the marker. Then, after an educational campaign about MAV, repeat the study. Then, compare the marker prevalence in that country to a country that has had MAV for 10 years."

  - Discovery camp prediction: The marker prevalence will be the same in both countries at baseline (if the condition exists naturally) and after the campaign, the prevalence of the marker among MAV cases will remain stable (around 55-60%).
  - Looping camp prediction: In the country without prior exposure, the marker prevalence might be lower at baseline (if the condition is not culturally recognized) and after the campaign, it might rise as the category becomes embedded. In the country with long exposure, the marker prevalence might be higher because of entrenchment.

  But we don't have data on other countries. Alternatively, we can stick to the MAV case and extend it.

  Let's do: "After the criteria tightening (S3) and the shift in clinical presentation, if we then introduce a new treatment specifically targeted at the laboratory marker, what will be the treatment response in those with the marker versus those without?"

  - Discovery camp: The treatment will work better in those with the marker, regardless of when they were diagnosed (pre- or post-campaign, pre- or post-tightening), because the marker tracks the biological cause.
  - Looping camp: The treatment might work differently depending on the diagnostic era because the meaning of the category has changed; thus, the marker might not predict treatment response consistently across time.

  But this is a prediction about treatment response, which we don't have.

  Given time, we'll use a hypothetical case that both accept as bearing on the crux.

  Addressing the deflationary move:
  - Discovery camp: "Looping is just a species of measurement reactivity, and there is nothing special about human kinds except the degree of reactivity. This is seen in other fields (e.g., cancer subtypes under treatment, adaptive machine learning)."
  - Looping camp: They reject the claim that there is nothing special. They argue that in human kinds, the reactivity is constitutive: the classification becomes part of the target's identity and behavior in a way that changes the kind itself, not just the measurement. In cancer or machine learning, the underlying structure (e.g., the tumor's biology, the adversary's algorithm) remains independent of the classification, even if the behavior adapts.

  So the looping camp rejects the clause "nothing about human kinds is special except degree". They argue that the kind of feedback is different: it is semantic and identity-constituting, not just behavioral adaptation.

  The deflationary move was trying to reduce looping to a general problem of measurement, thereby denying the special status of human kinds. The looping camp rejects this reduction.

  The "both discovered and made" peace treaty:
  - We must say whether it is substantive or a verbal truce.
  - Discovery camp: They can sign "both discovered and made" meaning that there is a biological reality that we discover, but the way we categorize it is made by us. For them, the "made" part is about the conceptualization and measurement, not the reality.
  - Looping camp: They can sign it, but they mean that the reality itself is shaped by the classification, so it is both discovered (in that we find patterns) and made (in that the patterns are stabilized by our practices).
  - But when it comes to what a nosology committee should do, the disagreement reemerges. The discovery camp would want to base decisions on biological evidence and minimize looping effects. The looping camp would want to consider the social implications and expect looping to occur.

  Thus, the statement should say that the peace treaty is a substantive position, but it does not resolve the practical disagreement about how to classify. Both sides agree that both elements are present, but they weigh them differently and interpret their significance differently.

  Verbal versus genuine disagreements:
  - Some disagreements are verbal: For example, both sides might agree that looping occurs and that there are biological correlates, but they use different terms to describe the relationship. However, the core disagreement about the nature of the target (stable causal structure vs. institutionally stabilized kind) is genuine and has practical consequences.
  - Specifically, the disagreement about whether the laboratory marker tracks a stable causal structure or is itself subject to looping is a genuine disagreement with empirical implications.

  Closing section for the committee:
  - The disagreement as stated does not directly determine whether MAV should be adopted. Both sides can agree that MAV might be a useful category for clinical purposes.
  - However, the discovery camp would want to see more evidence of the laboratory marker's predictive validity (e.g., for treatment response, course of illness) and would want to design studies to correct for looping effects.
  - The looping camp would want to see studies on the social impact of introducing MAV (e.g., through SRI-like measures) and would recommend that the criteria be designed to minimize harmful looping (e.g., by avoiding stigmatizing language) and to be adaptable as the category evolves.
  - Both sides would want the committee to measure the Semantic Recoil Index prospectively if MAV is adopted, and to track the laboratory marker over time in diverse populations.

  Now, we write the joint statement.

  Note: We must define terms and use formulations both sides recognize.
answer: |-
  ### Joint Statement on Maladaptive Anticipatory Vigilance (MAV) and Psychiatric Nosology  
  *Produced by the discovery camp (represented by the psychiatrist-neuroscientist) and the looping camp (represented by the philosopher)*  

  This document reflects substantive agreements and disagreements between the discovery camp (DC) and looping camp (LC) regarding the nature of psychiatric classification, based on a collaborative analysis of the hypothetical proposed category **maladaptive anticipatory vigilance (MAV)**. MAV is defined as *a pattern of compulsive threat-monitoring and checking causing significant distress or impairment*. Our deliberations centered on three stipulated empirical findings:  

  1. **Semantic Recoil Index (SRI) data**: The SRI measures shifts in a category's prevalence and symptom profile after its diagnostic criteria are made public. For MAV, an awareness campaign doubled prevalence within five years. However, a holdout cohort—drawn from archival interviews recorded pre-category and re-coded blind (no exposure to the campaign)—showed a comparable prevalence rise.  
  2. **Laboratory marker**: A proposed biomarker (e.g., a neural activation pattern measurable via fMRI) was present in ~60% of post-campaign MAV cases versus ~55% of pre-campaign cases (assessed blind from archival data).  
  3. **Criteria tightening**: When MAV’s diagnostic criteria were revised to be more restrictive, the clinical presentation of cases shifted (e.g., patients adopted new vocabulary from the criteria), but the marker’s prevalence among cases remained flat.  

  We agree on the following claims, each of which is substantive enough that a naive version of either camp would have denied it prior to this collaboration. These are not trivial assertions (e.g., "classification is hard") but reflect nuanced insights from the MAV case.  

  #### Agreed Claims  
  1. **Prevalence shifts can occur independently of direct diagnostic exposure**. The rise in MAV prevalence in the holdout cohort (re-coded blind from pre-category archives) demonstrates that changes in prevalence need not result from individuals' direct exposure to diagnostic criteria or awareness campaigns. A naive DC would have denied this, expecting prevalence stability without exposure due to a fixed underlying reality. A naive LC would have denied it, expecting prevalence shifts only via direct feedback from classification.  
  2. **Symptom profiles can decouple from associated biomarkers under criteria changes**. Despite the shift in clinical presentation (e.g., altered symptom descriptions) after MAV criteria tightening, the laboratory marker’s prevalence among cases remained stable. A naive DC would have denied that the symptom profile could shift without biomarker changes, expecting criteria refinements to better capture a fixed biological reality. A naive LC would have denied that the biomarker could remain stable amid symptom shifts, expecting looping to alter the entire phenomenon.  
  3. **The Semantic Recoil Index (SRI) reveals multi-pathway reactivity**. The SRI data show that diagnostic awareness campaigns can amplify prevalence, but the comparable rise in the holdout cohort indicates that indirect pathways (e.g., broader cultural or institutional shifts) also drive changes. A naive DC would have denied that indirect pathways exist, attributing all reactivity to direct measurement artifacts. A naive LC would have denied that indirect pathways could produce effects comparable to direct exposure, expecting direct feedback to dominate.  
  4. **Looping effects are measurable but not eliminable through standard blind methods**. The use of blind re-coding in the holdout cohort did not prevent prevalence shifts, indicating that looping can operate beyond controlled measurement contexts. A naive DC would have denied that looping persists under blind assessment, expecting such methods to isolate a stable target. A naive LC would have denied that blind methods could capture looping’s full scope, expecting them to mask constitutive feedback.  

  #### Disagreements Table  
  We retain fundamental disagreements on the following cruxes. For each, we specify:  
  - **DC position**: Precise formulation the discovery camp accepts.  
  - **LC position**: Precise formulation the looping camp accepts.  
  - **What would move each side**: Evidence or arguments that would shift the camp’s stance.  
  - **Shared case/prediction**: A hypothetical scenario both accept as bearing on the crux, with pre-commitments to predictions.  

  | Crux | Discovery Camp (DC) Position | Looping Camp (LC) Position | What Would Move DC | What Would Move LC | Shared Case/Prediction (Bearing on Crux) |
  |------|-----------------------------|----------------------------|--------------------|--------------------|------------------------------------------|
  | **1. Ontological status of looping feedback** | Looping is measurement reactivity: a distortion in detecting a pre-existing, causally structured target (e.g., a neurocognitive vulnerability). The target exists independently; reactivity is a nuisance to correct via engineering (e.g., better biomarkers or blind methods). | Looping is constitutive: feedback from classification partly defines the target (e.g., MAV as a "way of being" shaped by diagnostic concepts). The target has no stable pre-classification essence; its stability is an institutional achievement, not a discovered joint. | Evidence that blind, longitudinal studies with objective markers (e.g., the lab marker tracking outcomes like treatment response) show stable causal structure unaffected by criteria changes. | Evidence that criteria changes or cultural shifts alter the lab marker's prevalence or predictive power in ways irreducible to measurement error (e.g., marker loses association with impairment under new criteria). | **Case**: After MAV adoption, conduct a 10-year study tracking the lab marker's predictive validity for functional impairment (e.g., work absenteeism). Use annual blind assessments in a cohort exposed to the criteria and a matched cohort from a region with no MAV awareness.<br>**DC prediction**: Marker validity will remain stable in both cohorts, indicating a fixed causal role.<br>**LC prediction**: Marker validity will decline in the exposed cohort as looping reshapes impairment manifestations. |
  | **2. Source of category stability** | Stability reflects progress in tracking causal structure: flat marker prevalence amid criteria changes (per MAV S3 data) shows engineering can isolate invariant biological factors. Instability arises from measurement limitations, not target nature. | Stability reflects institutional maintenance: flat marker prevalence arises because criteria changes are absorbed by clinical practices (e.g., therapists guide patients to new vocabulary), not biological invariance. Instability is inherent; flat markers are local artifacts. | Evidence that the marker predicts novel outcomes (e.g., treatment response) consistently across cultures or time without institutional mediation. | Evidence that the marker's association with MAV dissolves when diagnostic practices vary (e.g., in cultures with divergent symptom interpretations). | **Case**: Introduce MAV criteria in two regions: one with high mental health infrastructure (e.g., standardized training) and one without. Track marker prevalence and symptom profiles over 5 years.<br>**DC prediction**: Marker prevalence will converge across regions as it captures a universal biological factor.<br>**LC prediction**: Marker prevalence will diverge, with stability only in the high-infrastructure region due to institutional control. |
  | **3. Generality of looping-like effects** | Looping is one instance of measurement reactivity, also seen in non-psychiatric domains (e.g., tumor subtypes under treatment or adversarial ML). Human kinds differ only in reactivity degree, not kind. | Human kinds are distinct: only here does feedback become constitutive via semantic internalization (e.g., patients embody diagnostic labels). Non-psychiatric cases (e.g., tumors) involve adaptive behavior, not identity change. | Evidence that human-kind reactivity can be modeled and corrected using general reactivity frameworks (e.g., statistical adjustments for diagnostic awareness). | Evidence that non-psychiatric "looping" (e.g., tumor evolution) lacks semantic feedback (e.g., tumors don’t internalize labels). | **Case**: Compare MAV’s SRI data to a non-psychiatric analogue (e.g., a tumor subtype’s incidence under diagnostic publicity). Measure reactivity via incidence shifts and biomarker stability.<br>**DC prediction**: Both will show similar reactivity patterns, correctable with engineering.<br>**LC prediction**: MAV will show greater reactivity and biomarker instability due to semantic internalization. |

  #### Response to the Deflationary Move  
  The discovery camp asserts that looping is merely measurement reactivity—a general scientific issue—with human kinds differing only in degree. The looping camp **rejects the clause "nothing about human kinds is special except degree."** This clause was intended to naturalize looping, equating it with non-psychiatric cases (e.g., adaptive tumors). The LC rejects it because:  
  - **Why rejected**: Human kinds involve *semantic internalization*, where individuals consciously adopt classifications into their identity and behavior, altering the target’s constitutive features. Non-psychiatric cases (e.g., tumors) exhibit behavioral adaptation without self-understanding.  
  - **What the clause was doing**: It aimed to deflate looping’s significance, suggesting it requires no special theoretical framework. Rejecting it preserves the LC’s claim that human kinds demand distinct explanatory tools (e.g., hermeneutic models).  
  The DC maintains that the clause is valid; the LC counters that degree differences are qualitative when internalization occurs.  

  #### "Both Discovered and Made": Substantive or Verbal Truce?  
  The proposition that psychiatric categories are "both discovered and made" is a **verbal truce that dissolves under practical scrutiny**. Both camps can utter this phrase but assign incompatible meanings:  
  - **DC interpretation**: "Discovered" refers to identifying pre-existing causal structures (e.g., the lab marker); "made" refers to constructing measurements and criteria.  
  - **LC interpretation**: "Discovered" means detecting patterns that emerge from social practices; "made" means those practices constitutively shape the patterns.  
  When applied (e.g., to MAV adoption), the truce collapses:  
  - **DC** would prioritize biomarker evidence to "discover" MAV’s biological basis and "make" criteria to minimize reactivity.  
  - **LC** would prioritize social impact assessments to "discover" how MAV might loop and "make" criteria to avoid harm.  
  Thus, the phrase lacks substantive consensus on what discovery/construction entail or how to balance them in nosology.  

  #### Verbal vs. Genuine Disagreements  
  - **Verbal disagreements**: Some disputes arise from terminology (e.g., "stability" means biological invariance for DC, institutional maintenance for LC). These can be clarified but do not undermine core positions.  
  - **Genuine disagreements**: Three are empirically consequential:  
    1. **Ontological status (Crux 1)**: DC sees looping as epistemic (distorting measurement); LC sees it as ontological (constituting the target). This is genuine because it affects how biomarkers are interpreted (e.g., as causal anchors or artifacts).  
    2. **Source of stability (Crux 2)**: DC attributes stability to successful engineering; LC to institutional work. This is genuine because it determines whether nosology should seek "better" criteria (DC) or "adaptive" ones (LC).  
    3. **Generality of looping (Crux 3)**: DC’s deflationary view vs. LC’s qualitative distinction. This is genuine because it informs whether reactivity models from other sciences apply (DC) or psychiatric nosology needs unique tools (LC).  

  #### Recommendations for the Nosology Committee  
  Regarding MAV adoption, our disagreements do not dictate a "yes" or "no" vote but imply the following:  
  - **What follows from the disagreement**: The committee must decide whether to prioritize biological validity (aligning with DC) or social robustness (aligning with LC). The DC/LC split reveals that MAV’s adoption may:  
    - **DC view**: Uncover a biological reality if reactivity is controlled.  
    - **LC view**: Initiate looping that alters the phenomenon’s expression.  
    Neither camp claims MAV is invalid; both agree it is clinically salient.  
  - **What to measure before voting**:  
    - **Discovery camp request**: Measure the lab marker’s predictive validity for outcomes (e.g., treatment response, morbidity) in diverse cohorts. If stable, it supports a biological anchor.  
    - **Looping camp request**: Measure the Semantic Recoil Index (SRI) prospectively in a pilot rollout to predict cultural embeddedness and symptom shifts.  
    **Both camps request**: Track the marker and SRI jointly for 2–3 years pre-adoption to assess:  
    - Whether prevalence shifts correlate more strongly with cultural factors (e.g., media coverage) or biomarker data.  
    - How criteria changes affect symptom profiles vs. marker stability.  

  This statement, signed below, reflects our genuine agreements and disagreements. We commit to the cases/predictions outlined and will revisit them post-evidence.  

