  *Definitions*:  
  - **Maladaptive anticipatory vigilance (MAV)**: A proposed psychiatric category characterized by compulsive threat-monitoring and checking, leading to distress or impairment.  
  - **Semantic Recoil Index (SRI)**: A quantitative measure of changes in a category’s prevalence and symptom profile following public dissemination of its diagnostic criteria.  
  - **Looping**: The process by which a classified population’s awareness of its classification feeds back into the manifestation of the classified profile.  
  - **Holdout cohort**: A group assessed from archival data (pre-dating the category) and re-coded blind to avoid exposure effects.  
  - **Laboratory marker**: An objective biomarker (e.g., neuroimaging pattern) proposed as associated with a category.
