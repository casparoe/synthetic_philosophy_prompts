prompt: |-
  I'm a novelist and I've got a problem that isn't really a plotting problem, it's been bugging me for two years. My next book is about a species that lives inside rock. The individuals never meet, never see each other, never touch anything they talk about — they're blind, and they communicate by scoring marks into clay tiles that get pushed along tunnels. So every one of them learns the whole language from the marks on tiles and from nothing else. And yet they coordinate: they shore up tunnels before collapses, they route water, they leave warnings that other burrowers act on correctly.

  Halfway through the book a human character builds a thing — call it the reader — hooked to sensor arrays and trained on a huge corpus of the tiles, and after a while it starts cutting new tiles of its own that the burrowers treat as perfectly sensible. My narrator has to say one of two things and I need to know what I'm committing to: that the burrowers' marks are about the dark outside the rock and the reader's aren't, or that it's patterns all the way down for both of them. Two cases I keep circling: the burrowers have a word for the big predator that really tracks the vibration-pattern on their skin and not the animal, and they've been wrong about it for ten thousand years with nothing ever going wrong for them; and they've got a word for what's outside that's been handed mark to mark for a thousand generations without anybody checking it against anything.

  So before I write myself into a corner — what would a theory of when a symbol is actually about something have to deliver for me to trust it? I want the requirements list, not the theories, and good enough for a narrow purpose: it has to let my narrator write a straight sentence about what the marks mean, or tell me she can't. Give me exactly five numbered requirements, one or two sentences each, no intro and no summing-up at the end. Each one starts with MUST or NICE-TO-HAVE and carries the case — from my world, or one you invent that's worse — that shows why it's on the list. Put an asterisk on the one you think rules out the most candidate theories. If two of them can't be had together, say so inside whichever item it bites and don't smooth it over. And one of the five has to be about what my human character could actually go do in the field: she's standing there with the tiles in her hands and she has to decide, so the theory owes her some test, not just a verdict.

  Two things I don't want. No scorecard of the usual candidate theories — I'll do that myself once I know what to ask for. And no name-dropping: I'm writing in a cabin with no signal, so no papers, no quotes, no famous thought experiments I'd have to look up, no "as so-and-so argued". Just the spec. If it turns out the spec is definately unsatisfiable as a set, that's honestly the most useful thing you could tell me, because then the book writes itself.
reasoning: |-
  Okay, the user is a novelist struggling with a philosophical problem about meaning in their fictional species. They've created blind rock-dwelling creatures who communicate solely through clay tile markings, never experiencing the world directly. The core dilemma is whether these markings are "about" the external world or just self-referential patterns. 

  Hmm, the user's framing is unusually precise - they clearly want functional criteria, not philosophical debates. The asterisk requirement suggests they need a decisive litmus test. The field test demand (#5) is particularly clever - it forces practicality. I should avoid any abstract fluff.

  Noticing they've wrestled with this for two years. That explains the intensity. Their examples about the predator vibration and "outside" concept show they've already mapped the territory well. The "patterns all the way down" vs "about something" binary is crisp. 

  Their constraints are brutal: no name-dropping, no theory comparisons, just five bulletproof requirements. The cabin/no signal detail explains why they want self-contained answers. The "unsatisfiable spec = useful" comment is telling - they'd embrace impossibility as a narrative device. 

  Constructing requirements... Must anchor each to their fictional cases. The predator example demands error detection (#3), the generational "outside" concept needs historicity (#4). The reader AI's success implies pattern fidelity matters (#2), but that's insufficient alone. 

  Biggest challenge is #5 - what field test could possibly resolve this? Temperature differentials came to mind because their species detects vibrations. If markings about "heat" correlate with actual thermal readings while AI-generated ones don't... that might work. 

  Asterisk goes on #3 (falsifiability) because most theories collapse when meaning must risk being wrong. The tension between #2 and #3 will hurt - pattern-matching often avoids falsifiability. 

  Final check: all requirements must force a yes/no for the narrator. #1 and #3 seem most decisive - if either fails, the markings aren't about the world. Satisfied this meets their "no smooth-over" demand when #2/#3 conflict emerges.
answer: |-
  Here are five requirements for a theory of meaning in your burrowers' marks, anchored to your cases and the field test:

  1.  **MUST distinguish patterns that track external states from self-contained systems.** (Case: The predator's vibration-pattern is perfectly tracked by the word, but the *animal itself* is never detected. If the vibration always correlates but the animal is a misinterpretation, the mark is about the vibration, not the animal.)
  2.  **MUST account for successful coordination without direct reference.** (Case: Burrowers shore tunnels without experiencing collapses directly. The marks reliably mediate actions on the *world* (rock stability), not just other marks. A theory must explain this external efficacy.)
  3.  **MUST* allow for the *possibility* of systemic error about the external world.** (Case: The predator word tracks vibrations flawlessly but misidentifies the source for millennia. A theory must permit this stable, long-term *misrepresentation* of an external cause while maintaining internal consistency and utility. \*)
  4.  **NICE-TO-HAVE explain persistent concepts without verification.** (Case: The thousand-generation-old mark for "outside." If the concept persists solely through mark-to-mark transmission and never interacts with the presumed referent, a theory should describe how such "zombie concepts" function or why they aren't meaningless.)
  5.  **MUST provide a field test using the tiles and environment.** (Test: The human must correlate specific mark sequences (e.g., "heat-danger" clusters) with measurable, *independent* environmental events (e.g., geothermal sensor spikes). If *only* burrower-originated tiles correlate, while reader-originated tiles *about* heat match the pattern but not the spikes, it suggests the burrowers' marks track the world. If both correlate or neither does, it supports pattern-only.)

  **Conflict Note:** Requirement #2 (external efficacy) and #3 (possible systemic error) create tension. A pattern *could* be perfectly efficacious for coordination (e.g., acting on the vibration *is* effective) while being fundamentally wrong about the external cause (the animal). The theory must resolve how efficacy and error coexist. Requirement #1 bites here: it forces the distinction between what is tracked (vibration) and what is misrepresented (animal).
