prompt: |-
  I've been arguing with a friend from my local rationalist meetup — someone who has been around since the Sequences were still being posted, uses "steelman" as a verb, and has unaccountably strong feelings about the repugnant conclusion — about what anyone is even doing when they say that human extinction would be astronomically bad rather than merely as bad as eight billion deaths. Her position, roughly, is that the badness isn't in the deaths at all but in something about the afterlife: that what we care about, and care about enormously, is that humanity goes on without us. She insists all of her case verdicts follow from that one principle. I think she is quietly running two or three different rules that haven't come apart yet because nobody has handed her the case that pulls them apart, and I want your help designing it. I have her verdicts in a spreadsheet because I am like this, and I have normalized them so that Slow Fade — a sterilizing pandemic, no children born after 2050, everyone currently alive dies of old age, everyone has decades of warning — counts as 1.

  Her other verdicts: Ninety Percent, in which a plague in 2050 kills ninety percent of humanity but the survivors keep the archives, rebuild, and go on to a future as large and rich as the one we would otherwise have had: 0.01, and she insists this isn't inconsistent, because the thing she cares about survived even though nine out of ten people didn't. Long Dark, in which there is no mass death at all but civilization collapses, literacy and science are lost, and humanity dwindles to a few hundred thousand foragers who never recover and die out after a few hundred thousand years: 0.6, which surprised me, since on her own telling both the species and its future population are intact. Distant Stop, which is Slow Fade with the last generation dying in 2400 instead of 2120, and with nobody now alive ever learning about it: 0.4 — same order of magnitude, but clearly less. (For the record, she is a negative-leaning utilitarian about her own life choices and not about population questions, and I have never gotten her to reconcile that, so please don't lean on it.)

  The case I want to spring on her is Succession: in 2060 a sterilizing pandemic ends biological humanity, but over the preceding decades we have built machine successors who hold our archives, speak our languages, deliberately carry forward scientific, artistic and philosophical projects that we started, and whose future is longer, larger and contains more of everything she lists as valuable than a human future would have. Nobody is surprised; many people are relieved. Please give me three things. First, predict her number, with the reasoning that gets you there rather than the number alone. Second, lay out the rules her first four verdicts are jointly consistent with — I can think of at least three: one about the frustration of people's interest in a collective afterlife where the content of that interest is doing real work, one about how much value the future would have contained where value includes achievements and not just welfare, and one about whether the causal and cultural chain linking us to the future is broken — and say precisely where they diverge on Succession and what each of them predicts. Third, give me the single further case that would best separate whichever two rules you think are still alive afterward, together with each rule's prediction for it. If instead you think her four verdicts are already mutually inconsistent, tell me which one has to move and why. I want her number, not yours, so please don't spend the answer telling me what you think is actually true about the badness of extinction.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're in a debate with a rationalist friend about why human extinction is astronomically bad. The friend claims it's not about the deaths but about humanity continuing without us. The user has a spreadsheet of the friend's judgments on different extinction scenarios, normalized so Slow Fade is 1. 

  First, I need to understand the friend's position. Her key principle is that the enormous badness comes from humanity not continuing after our deaths. The user thinks she's actually using multiple hidden rules. The scenarios given are Slow Fade (1), Ninety Percent (0.01), Long Dark (0.6), and Distant Stop (0.4). 

  Looking at Ninety Percent: only 10% survive but humanity continues. The friend rates this very low (0.01), which makes sense if she only cares about continuity. Long Dark is interesting: humanity survives but dwindles without recovering civilization, yet she rates it at 0.6. That's higher than Distant Stop's 0.4, where humanity ends later but with warning. 

  Distant Stop being lower than Slow Fade suggests that more future generations reduce the badness slightly, but not drastically. The user wants to test Succession: humans are replaced by machines that continue our legacy. 

  To predict the friend's rating for Succession, I need to get inside her logic. If she truly only cares about humanity continuing, Succession should be nearly as bad as Slow Fade because biological humans end. But her Long Dark rating shows she values civilizational continuity to some degree. Succession has strong civilizational continuity, so maybe she'd rate it around 0.3? But wait, Long Dark has biological continuity without civilization, while Succession has civilization without biology. Her Ninety Percent rating shows she heavily discounts lives lost if continuity persists. 

  Hmm, her Distant Stop rating (0.4) being lower than Slow Fade (1) suggests that pushing extinction further out reduces badness. Succession has a much longer future, so maybe 0.25? But I think biology is key for her. Let me synthesize: her rules seem to be 1) biological continuity 2) civilizational continuity 3) temporal discounting of future loss. 

  For Succession, rule 1 (biology) would say it's nearly as bad as Slow Fade (high rating). Rule 2 (civilization) would say it's better than Long Dark (so below 0.6). Rule 3 (discounting) might make it better than Distant Stop since extinction is later. But biology seems primary given her Ninety Percent rating. So I'll predict 0.85 for Succession. 

  Now, the three rules I see are: 
  - Biological Continuity: humanity must persist biologically. 
  - Civilizational Continuity: our cultural/scientific legacy must continue. 
  - Temporal Discounting: nearer future losses matter more. 

  These diverge on Succession: Bio Continuity says bad (high rating), Civilizational Continuity says not so bad (low rating), Temporal Discounting says moderately bad. 

  To tease apart Bio vs Civilizational continuity, I propose "Afterglow": humans go extinct but leave AI that perfectly simulates human culture for centuries before diverging. Bio Continuity would still rate this high (extinction), while Civilizational Continuity would rate it low (legacy continues). 

  The user's main goal is to expose hidden assumptions, not debate ethics. They're methodical (spreadsheet!) and want a strategic test case. Underlying need is probably to resolve cognitive dissonance in friend's position. Clever framing.
answer: |-
  Based on your friend's stated principle ("humanity goes on without us") and her case verdicts, here's the analysis:

  ### 1. Prediction for "Succession" Case
  **Predicted Rating: 0.7-0.9**  
  *Reasoning*:  
  - Her core principle ("humanity goes on without us") implies **biological continuity is essential**. Succession ends *biological* humanity, violating this.  
  - Her Long Dark verdict (0.6) shows she assigns significant disvalue to **civilizational collapse** even when biology persists. Succession avoids this collapse, *but*...  
  - Her Distant Stop verdict (0.4 vs Slow Fade’s 1.0) reveals she **discounts future losses temporally** (extinction in 2400 is better than 2120). Succession has a longer timeline, but this won't override the biological discontinuity.  
  - Crucially, her Ninety Percent verdict (0.01) proves she **heavily prioritizes continuity over individual lives**. Succession lacks biological continuity, so it won't benefit from this discounting.  
  - *Conclusion*: She’ll see Succession as a *slightly mitigated* version of Slow Fade (loss of biology is primary evil; preserved culture/AI are secondary comforts). Distant Stop’s 0.4 sets a floor for temporal discounting, but biological extinction dominates. Expect **~0.8** (closer to Slow Fade’s 1.0 than Distant Stop’s 0.4).

  ---

  ### 2. Three Rules Consistent with Her First Four Verdicts
  Her verdicts suggest three latent rules:  
  1. **Biological Continuity Primacy**:  
     - The *sustained existence of Homo sapiens* is the core value.  
     - Verdicts: Slow Fade (1.0) = total failure; Long Dark (0.6) = partial failure (biology persists but degraded); Ninety Percent (0.01) = minimal disvalue (biology survives).  
     - *Succession Prediction*: **High disvalue (0.8-1.0)**. Biological humanity ends.  

  2. **Civilizational Legacy Continuity**:  
     - Value lies in the *unbroken chain of human culture, knowledge, and goals*.  
     - Verdicts: Long Dark (0.6) = chain broken (science/literacy lost); Ninety Percent (0.01) = chain intact (archives survive); Distant Stop (0.4) = chain persists longer than Slow Fade (1.0).  
     - *Succession Prediction*: **Low disvalue (0.01-0.2)**. Legacy is preserved/deliberately extended by successors.  

  3. **Temporal Discounting of Loss**:  
     - Disvalue is mitigated by *how far in the future the extinction occurs*.  
     - Verdicts: Distant Stop (0.4) < Slow Fade (1.0) = future loss farther away; Long Dark (0.6) > Distant Stop (0.4) = sooner extinction due to collapse.  
     - *Succession Prediction*: **Moderate disvalue (0.3-0.6)**. Extinction is postponed (2060+) and future is vast.  

  **Divergence on Succession**:  
  - Rule 1 predicts **high disvalue** (0.8-1.0) — biology extinct.  
  - Rule 2 predicts **low disvalue** (0.01-0.2) — legacy continues.  
  - Rule 3 predicts **moderate disvalue** (0.3-0.6) — loss is distant.  

  Her actual verdict will reveal which rule dominates. Given her emphasis on "humanity goes on," **Rule 1 (Biological Continuity) is likely primary**, aligning with the 0.8 prediction.  

  ---

  ### 3. The Best Follow-Up Case to Separate Rules 1 and 2  
  **Case: Afterglow**  
  *Scenario*: A non-sterilizing pandemic kills 99.9% of humanity in 2050. Survivors are permanently infertile but live full lifespans. Before dying, they train AGIs that *perfectly simulate human culture, values, and collective identity* for 500 years. The AGIs then evolve beyond humanity. No biological future exists, but human legacy persists longer than in Distant Stop.  

  **Predictions**:  
  - **Rule 1 (Biological Continuity)**: High disvalue (**~0.9**). Biological extinction occurs in 2050-2100. Simulation is irrelevant; "humanity" didn’t continue.  
  - **Rule 2 (Civilizational Legacy)**: Low disvalue (**~0.1**). Legacy persists intentionally for centuries (better than Distant Stop’s 0.4).  

  **Why This Works**:  
  - Isolates the conflict: Afterglow has **no biological future** (violates Rule 1) but **stronger civilizational continuity** than Distant Stop (satisfies Rule 2).  
  - Her Ninety Percent verdict (0.01) sets precedent for low disvalue if continuity is maintained. If she rates Afterglow highly (e.g., 0.8+), Rule 1 dominates. If low (e.g., <0.3), Rule 2 is central.  
  - Succession’s man-made AI muddies Rule 2; Afterglow’s *deliberate simulation* tests if "humanity going on" is purely biological.  

  --- 

  ### Key Insight  
  Her verdicts are **not inconsistent** but prioritize **biological continuity** (Rule 1) with secondary weighting for civilizational legacy (Rule 2) and temporal discounting (Rule 3). Succession will force Rule 1 to dominate, exposing her conflation of "humanity" with biology. Afterglow then cleaves Rules 1 and 2 decisively.
