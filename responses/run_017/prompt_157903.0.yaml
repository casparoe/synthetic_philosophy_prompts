answer: |-
  You've identified the core problem beautifully: this slogan thrives on ambiguity, conflating distinct claims to create rhetorical force while dissolving under scrutiny. Below is a menu of precise interpretations, ordered from least to most substantive, with analysis of their plausibility, status, and relevance to your seminar debate. Crucially, **no single interpretation robustly establishes that an abstainer is "morally unclean" compared to a lesser-evil voter**, though some imply weaker forms of responsibility.

  **Key to Verdicts:**  
  - **✅ Plausible/Defensible:** I defend this reasonably.  
  - **⚠️ Contentious:** Genuine philosophical/practical disagreement.  
  - **❌ Implausible/False:** I reject this confidently.  
  - **🗣️ Platitude:** Trivially true but morally/practically insignificant.

  ---

  ### The Menu of Interpretations

  1.  **Procedural Standing (The "Proper Channels" Thesis)**  
      - **What it says:** Formal complaint mechanisms (e.g., petitions, lobbying, lawsuits) often require prior participation in the official process (voting) to be taken seriously or even be admissible. "Complaining" here means formal grievance.  
      - **Weight:** *Can't* (lacks procedural standing/right), *Vote* (cast valid ballot), *Complain* (formal act).  
      - **Plausibility:** ✅ Limited. Some institutions *do* prioritize input from participants. But voting is rarely a strict *prerequisite* for most forms of complaint in a democracy. Minors/nonvoters can often file legal challenges or petitions.  
      - **Status:** Mostly platitude (🗣️) where true; false where overstated.  
      - **Relevance to Moral Cleanliness?** **No.** This is about bureaucracy, not ethics. It says nothing about moral purity or blameworthiness for an outcome.  
      - **Minor Party Voters:** Likely retain standing if they participated formally.

  2.  **Epistemic Weakness (The "Ignorant Critic" Thesis)**  
      - **What it says:** Non-voters lack firsthand experience/knowledge of the voting process, ballot issues, or candidate choices, making their critiques less informed or credible. "Complain" means critiquing the *process* or *specific choices*.  
      - **Weight:** *Can't* (lacks epistemic authority), *Vote* (engage with process/choices).  
      - **Plausibility:** ⚠️ Contingent. *Sometimes* true (e.g., someone who didn't research may misunderstand choices). Often false (non-voters can be highly informed; voters can be ignorant). Abstention *can* be a deeply researched choice.  
      - **Status:** Contentious (⚠️). Often used as an ad hominem.  
      - **Relevance to Moral Cleanliness?** **No.** Questions knowledge, not moral standing. An abstainer can be morally justified *and* well-informed.  
      - **Minor Party Voters:** Retain epistemic authority (engaged deeply).

  3.  **Causal Irrelevance (The "No Skin in the Game" Thesis)**  
      - **What it says:** A non-voter has zero causal impact on the election outcome, so their complaint about the result is disconnected from the mechanism that produced it. "Complain" means lamenting the specific outcome.  
      - **Weight:** *Can't* (causally disconnected), *Vote* (causal participation).  
      - **Plausibility:** ❌ Statistically naive. *Individual* votes rarely change outcomes, whether cast or not. If voting is causally inert, so is abstaining. Only true if the abstainer *would* have been the decisive vote (vanishingly rare).  
      - **Status:** Straightforwardly false (❌) at the individual level.  
      - **Relevance to Moral Cleanliness?** **Indirectly Weak.** If causal impact is necessary for moral responsibility (debatable!), non-voters lack *this type* of responsibility. But this doesn't make them "clean" – it just absolves them of *causal* blame. Lesser-evil voters also have negligible causal impact.  
      - **Minor Party Voters:** Also causally irrelevant to the major party outcome.

  4.  **Hypocrisy / Sincerity (The "Practice What You Preach" Thesis)**  
      - **What it says:** Complaining about an outcome you chose not to try to prevent reveals a lack of sincere commitment to changing it. Your complaint is hypocritical. "Complain" means expressing dissatisfaction *as if you care about the result*.  
      - **Weight:** *Can't* (hypocritical/insincere), *Vote* (demonstrate commitment).  
      - **Plausibility:** ⚠️ Contingent. *Sometimes* true (e.g., someone apathetic complaining for attention). Often false – principled abstention (e.g., rejecting illegitimate choice) can reflect deep concern. Voting isn't the *only* way to demonstrate commitment (protest, organizing exist).  
      - **Status:** Contentious (⚠️). A common rhetorical point, but ethically shallow.  
      - **Relevance to Moral Cleanliness?** **Partial/Indirect.** It accuses abstainers of *inconsistency* or *bad faith*, implying moral fault. However, it doesn't prove they share *responsibility for the bad outcome* itself, just that their complaint rings hollow. Doesn't automatically make lesser-evil voters "cleaner."  
      - **Minor Party Voters:** Not hypocritical – they *did* try to prevent the bad outcome via their preferred candidate.

  5.  **Moral Responsibility / Forfeiture (The "Citizen's Duty" Thesis - SUBSTANTIVE)**  
      - **What it says:** Voting is a fundamental civic duty. By abstaining, you fail this duty and thereby forfeit your moral right to blame others for the outcome or object to how collective decisions affect you. You share in the collective responsibility. "Complain" means assigning blame or objecting to the legitimacy of the outcome's impact.  
      - **Weight:** *Can't* (forfeited right/lacks standing to blame), *Vote* (fulfill duty), *You* (citizen with duty).  
      - **Plausibility:** ⚠️ Highly Contentious. Assumes a strong, enforceable duty to vote (rejected by many). Assumes participation is necessary to avoid collective responsibility (debatable). Treats voting as the *only* relevant civic act.  
      - **Status:** Core Contentious Moral Claim (⚠️). Defended by some civic republicans; attacked by liberals and voluntarists (e.g., Brennan's "The Ethics of Voting").  
      - **Relevance to Moral Cleanliness?** **Yes, Directly (but Contested).** This *explicitly* argues that abstainers are morally tainted by the outcome due to their failure of duty, losing the right to complain *because* they share responsibility. Lesser-evil voters fulfilled their duty, maintaining "cleaner" standing.  
      - **Minor Party Voters:** Likely fulfill the duty, retaining standing.  
      - **Connection:** This thesis often *relies on* conflating the weaker meanings (especially 3 & 4) to seem intuitive.

  6.  **Tacit Consent / Authorization (The "Social Contract" Thesis - RADICAL)**  
      - **What it says:** By not voting (or not actively rebelling), you tacitly consent to the political system and its outcomes, including bad leaders. Complaining then violates the consent you gave. "Complain" means challenging the legitimacy of the government/outcome.  
      - **Weight:** *Can't* (contradicts consent), *Vote* (or rebel!), *Complain* (challenge legitimacy).  
      - **Plausibility:** ❌ Widely rejected. Locke's tacit consent is heavily criticized. Abstention is poor evidence for consent (could be despair, protest, ignorance). Non-participation is *not* equivalent to endorsement.  
      - **Status:** Generally considered False/Implausible (❌) in contemporary philosophy.  
      - **Relevance to Moral Cleanliness?** **Indirect.** Casts abstainers as endorsers of the outcome, making complaints hypocritical. But this is a very weak link. Lesser-evil voters also "consent" under this view.  
      - **Minor Party Voters:** Also "consent" by participating.

  ---

  **Answers to Your Specific Queries:**

  1.  **Which reading supports the "not morally cleaner" claim?**  
      Only the **Moral Responsibility / Forfeiture (Thesis 5)** *directly* argues abstainers share moral responsibility for the outcome and are thus "tainted." However, this is **highly contentious (⚠️)** and relies on a strong, contested duty to vote. The **Hypocrisy thesis (4)** *indirectly* supports it by accusing abstainers of bad faith, implying a moral flaw, but doesn't establish responsibility for the *outcome itself*. **No interpretation provides a conclusive, uncontested argument that abstainers are morally equivalent or inferior to lesser-evil voters.**

  2.  **Independence/Commitment?**  
      Theses are largely independent. You *can* accept:  
      - Procedural Standing (1) without any moral claim.  
      - Epistemic Weakness (2) without blaming abstainers for the outcome.  
      - Hypocrisy (4) without believing in a duty to vote (5).  
      However, proponents of the Moral Duty view (5) often *invoke* the weaker theses (especially 3 & 4) rhetorically to make their stronger claim seem intuitive. Rejecting 5 does *not* commit you to rejecting 1, 2, or 4 in all cases.

  3.  **Minor Party Voters?**  
      Under **Procedural (1)** and **Epistemic (2)** interpretations, minor party voters usually retain standing/authority. The **Hypocrisy (4)** charge doesn't apply. The **Moral Duty (5)** view generally absolves them (they voted!). Only the **Causal (3)** and **Tacit Consent (6)** views lump them with abstainers regarding the major party outcome – but both views are weak/implausible.

  4.  **Confidence & Real Disagreement:**  
      - **Firmly Defended Rejections:** Causal Irrelevance (3 - false), Tacit Consent (6 - false/radical).  
      - **Firmly Defended Limited Plausibility:** Procedural (1 - platitudinous where true), Epistemic (2 - sometimes true, often misapplied).  
      - **Genuine, Deep Disagreement:** Hypocrisy (4 - contingent, debatable), Moral Responsibility (5 - core substantive clash). Philosophers like **Jason Brennan** vehemently oppose Thesis 5, arguing voting is not a duty and abstention can be noble ("The Ethics of Voting"). **Julia Maskivker** defends a moderate duty to vote for justice ("The Duty to Vote"). **David Estlund** explores legitimacy and authority in ways relevant to Thesis 5/6 ("Democratic Authority").

  5.  **The Slogan's Nature:**  
      Your suspicion is correct. **The slogan is primarily a piece of rhetorical etiquette, not a rigorous moral claim.** Its power comes from **conflating** the distinct meanings above. It aims to shame or pressure participation, not articulate a coherent ethical principle. Asking for its "precise meaning" is somewhat like asking for the precise meaning of "No pain, no gain" – it's a culturally potent phrase trading on ambiguity and emotion. While versions of Thesis 5 give it the most substantive moral bite, that bite is philosophically contested. **No determinate, universally accepted meaning exists.**

  **Conclusion for Your Seminar:** The line "if you don't vote, you can't complain" **fails to prove that principled abstainers are morally compromised compared to lesser-evil voters.** At best (Thesis 5), it asserts a highly contested moral duty whose violation supposedly taints the abstainer. At worst, it's a collection of weak, often false, procedural or causal claims. Its effectiveness lies in rhetorical conflation, not ethical logic. The principled abstainer can argue their choice avoids complicity in a flawed system/choice, while the lesser-evil voter can argue they minimized harm. Neither position is *clearly* morally superior; the debate hinges on deeper questions about civic duty, complicity, harm reduction, and the legitimacy of the choices presented – which is likely where your seminar should focus.
