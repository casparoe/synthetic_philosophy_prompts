  I should note that the slogan is more of a rhetorical device than a precise moral claim. It's used to pressure people to vote, but its logical foundations are shaky. Philosophers like Jason Brennan criticize it, while others might defend aspects. The user needs to know that there's no consensus, and the slogan's effectiveness comes from conflating different meanings.

  Also, the user's deeper need might be understanding how to engage in ethical debates with clear definitions. They want tools to dissect common phrases and assess their validity. Highlighting the conflation in the slogan helps them see why the class discussion was circular.

