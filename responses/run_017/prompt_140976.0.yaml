    - Output: **0.41**, spread 0.  
  - **Actuary Demand**: Evidence for multiplicative mechanism (rare for time; additive is default).  

  #### **Case 3: Refusal Case (Loss Ratio Threshold)**  
  - **Setup**: New product loss ratio (bounds: 50-200%); P(ratio > 100%)? Decision threshold: 60%.  
  - Gate: Proceed.  
  - Mechanism: Unknown → Candidates: uniform on X and uniform on log(X).  
