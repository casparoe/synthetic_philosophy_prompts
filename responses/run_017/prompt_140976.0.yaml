  ### Decision Procedure for Bounded Quantities Under Indifference

  #### **Step 1: Gate (Check Conditions)**
  - **Operational Wording**:  
    Stop if any condition holds:  
    - **Base rate/historical analogue available**: Use it. Stop.  
    - **Quantity is a count with known denominator**: Use binomial model. Stop.  
    - **Bounds are soft estimates (not hard constraints)**: Proceed but downgrade output (increase spread by 50% in Step 6).  
    - **Already published a number for same quantity**: Use published number. Stop.  
    - **None apply?** Proceed.  

  - **Formal Gloss**:  
    Apply stopping rules for data availability, structural constraints, or prior commitments.  
  - **Judgment Required?**  
    Yes (assess if bounds are soft or base rate is valid).  
  - **If Removed**:  
    Proceeds inappropriately when objective data exists.  

  ---

  #### **Step 2: Mechanism Step (Classify Generating Process)**  
  - **Operational Wording**:  
    Describe how the quantity is generated. Classify:  
    - **Type A (Additive)**: Quantity is a sum of small, independent increments (e.g., waiting time as accumulated delays).  
    - **Type R (Ratio)**: Quantity is a ratio, proportion, or multiplicative compound (e.g., fraud share as proportion of claims, loss ratio as loss/premium).  
    - **Genuinely unknown?** Proceed to Step 3 with both Type A and Type R candidates.  

  - **Formal Gloss**:  
    Categorize by generative process: additive (extensive) or ratio (intensive).  
  - **Judgment Required?**  
    Yes (if process is ambiguous).  
  - **If Removed**:  
    Spread widens; refusal rate increases.  

  ---

  #### **Step 3: Symmetry Tests (Eliminate Inconsistent Parameterizations)**  
  - **Operational Wording**:  
    Test parameterizations for logical consistency:  
    - **For proportions (0 < X < 1)**:  
      - **Complement test**: If re-expressing as complement (e.g., fraud share → non-fraud share) changes the distribution, eliminate "uniform on odds" (odds = X/(1-X)).  
      - **Surviving candidates**: Uniform on X (share) and uniform on log-odds (log(X/(1-X))).  
    - **For positive non-proportions (X > 0)**:  
      - **Scale test**: No elimination (both uniform on X and uniform on log(X) pass scale symmetry).  
    - **For affine transformations (e.g., Y = aX + b)**:  
      No conflict; use uniform on X.  

  - **Formal Gloss**:  
    Apply invariance under transformations (complement, scaling) to eliminate inconsistent priors.  
  - **Judgment Required?**  
    No (automated).  
  - **If Removed**:  
    Includes invalid candidates (e.g., odds for proportions), inflating spread.  

  ---

  #### **Step 4: Candidate Selection**  
  - **Operational Wording**:  
    Select candidates based on mechanism:  
    - **Type A**: Uniform on X.  
    - **Type R (proportion)**: Uniform on log-odds.  
    - **Type R (positive non-proportion)**: Uniform on log(X).  
    - **Unknown mechanism**:  
      - Proportions: Uniform on X and uniform on log-odds.  
      - Positive non-proportions: Uniform on X and uniform on log(X).  

  - **Formal Gloss**:  
    Assign priors per process type: uniform on natural (A), log-odds (R proportion), or log (R positive).  
  - **Judgment Required?**  
    No (follows Step 2).  

  ---

  #### **Step 5: Compute Probability for Each Candidate**  
  - **Operational Wording**:  
    For each candidate, compute probability of the event (e.g., P(X > threshold)):  
    - **Uniform on X**: P = (U - threshold) / (U - L).  
    - **Uniform on log-odds (proportions)**:  
      Transform bounds/event to log-odds scale, then P = (log_odds(U) - log_odds(threshold)) / (log_odds(U) - log_odds(L)).  
    - **Uniform on log(X) (positive)**:  
      Transform bounds/event to log scale, then P = (log(U) - log(threshold)) / (log(U) - log(L)).  

  - **Formal Gloss**:  
    Calculate P under each candidate prior.  
  - **Judgment Required?**  
    No (mechanical).  

  ---

  #### **Step 6: Output Format**  
  - **Operational Wording**:  
    - **Single candidate?** Output probability (to 2 decimals).  
    - **Multiple candidates?**  
      - Output probability = average of candidates.  
      - Specification-sensitivity spread = [min, max] of candidates.  
    - **Downgrade for soft bounds?** Spread = [min, max] → expand by 50%: new min = min - 0.5*(max-min), new max = max + 0.5*(max-min).  
    - **Refusal rule**:  
      If spread (max - min) > 0.1 **and** spread straddles decision threshold (min < threshold < max), output:  
      > *"Estimate not decision-grade. Spread: [min, max]. Gather: (1) Tighten bounds (1 hr), (2) Clarify mechanism with expert (1 hr), (3) Base rate search (4 hrs)."*  

  - **Formal Gloss**:  
    Report expectation over priors; abstain if prior sensitivity impedes decision.  
  - **Judgment Required?**  
    Yes (set spread threshold; interpret refusal).  

  ---

  ### **Procedure Limitations**  
  - Cannot handle multidimensional quantities (e.g., Bertrand’s chord).  
  - Cannot incorporate partial data.  
  - Assumes bounds are correct.  

  ---

  ### **Calibration: Bertrand’s Chord Paradox**  
  - **Problem**: Probability that random chord length > √3 * radius.  
  - **Result**:  
    - Bounds: [0, 2r].  
    - Mechanism unknown → Candidates: uniform on length (P=0.134) and uniform on log(length) (invalid; lower bound 0).  
    - Output: 0.13 (uniform on length).  
  - **Verdict**: Licenses none of the standard answers (1/2, 1/3, 1/4).  

