    - Uniform on log(X): P = [log(2.0) - log(1.0)] / [log(2.0) - log(0.5)] ≈ 0.69 / 1.39 ≈ **0.50**.  
    - Average: 0.585; spread: [0.50, 0.67].  
  - Refusal: Spread (0.17) > 0.1 and straddles 0.60 → Not decision-grade.  
  - Output:  
    > *"Estimate not decision-grade. Spread: [0.50, 0.67]. Gather: (1) Tighten bounds, (2) Clarify mechanism, (3) Base rate search."*  

  ---

  ### **Key Insights**  
  - **Critical Step**: **Mechanism Step** (Step 2). If removed, spread widens, refusals increase.  
  - **Why It Works**: Breaks indifference paradoxes via generative process classification.  
  - **Reviewer Aid**: Plain-language steps; formal footnotes for audit.  

