              Ada: b>c -> she prefers b to c.
              Bo: c>b -> he prefers c to b.
          Conflict: the social preference says c>b, but they have no agreement so Pareto doesn't force anything? 

          But the social preference is c>b by transitivity. Is that a cycle? No.

          To get a cycle, we need to have also b>c or something.

       Only with three alternatives, it's hard to get a cycle without using a Pareto link.

       Let me try the standard Sen preferences:

          Ada (prude): b > a > c
          Bo (lascivious): c > b > a

