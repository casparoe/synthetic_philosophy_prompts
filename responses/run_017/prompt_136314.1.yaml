          Ada is decisive on {a,b}: she prefers b>a -> social b>a.
          Bo is decisive on {a,c}: he prefers c>a -> social c>a.
          Now, Pareto on {b,c}: 
              Ada: b>c
              Bo: c>b -> conflict.

          So no social ordering for b and c by Pareto, but we have b>a and c>a.

          We need to use a different pair for Bo's decisiveness? Or change the rights.

       In Sen, the rights are assigned to pairs that are personal, but in the three-alternative example, the lascivious is decisive on {a,c} and the prude on {a,b}. 

       The cycle comes when we consider the ranking of b and c by the social ordering. If the social ordering is complete, then we must have either b>c or c>b or indifference. But with the two decisiveness conditions, we have:

          b>a and c>a.

          Now, if we have b>c, then Ada is happy but Bo is not. If we have c>b, then Bo is happy but Ada is not. 

          But that doesn't create a cycle.

       I think I have to revert to the four-alternative example I had earlier that did produce a cycle, or use the standard example.

       Given the time, I will use the movie example with four alternatives and show the cycle from rights alone? Then I can say that even without Pareto, minimal liberalism can cause intransitivity. But Sen's result is usually presented with Pareto.

       Alternatively, we can add a Pareto condition in the movie example. For example, if there is a pair where both agree, we use it.

       But in the movie example, let's take the preferences I had:

          Alice: x > y > w > z
          Bob:   w > z > y > x

       Rights as above.

       Now, is there any pair where both agree? 
          x and w: Alice: x>w, Bob: w>x -> conflict.
          x and y: Alice: x>y, Bob: y>x -> conflict.
