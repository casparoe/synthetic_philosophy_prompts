       But from the rights assignments, we had:

          Bob is decisive on {w,x}: he prefers w>x -> social w>x.
          Alice is decisive on {x,z}: she prefers x>z -> social x>z.
          Bob is decisive on {y,z}: he prefers z>y -> social z>y.
          Alice is decisive on {w,y}: she prefers w>y? Alice's ranking: x>y>w>z -> is w>y? No, she prefers y>w.

       Alice's ranking: x>y>w>z, so between w and y: y>w.

          So by Alice's decisiveness on {w,y}: social y>w.

       Now, we have:

          social: w>x (from Bob on {w,x})
          social: x>z (from Alice on {x,z})
          social: z>y (from Bob on {y,z}) -> so w>x>z>y.
          social: y>w (from Alice on {w,y}) -> cycle: w>...>y>w.

       And also, by Pareto: w>z, which is consistent with w>x>z.

       So the cycle: w>x>z>y>w.

       And we used one Pareto link (w>z) but it is not necessary for the cycle because we have w>x>z already.

       So the cycle is built from the rights assignments alone. This shows that with minimal liberalism, we may get an intransitive social ordering. 

       Then why is Pareto mentioned in the theorem? Because the theorem states the incompatibility of three conditions: 
          - Unrestricted domain
          - Pareto efficiency
          - Minimal liberalism
          - and the requirement of a transitive and complete social ordering.

       In this example, we have a cycle, so the social ordering is not transitive. And we have minimal liberalism and unrestricted domain. We also have Pareto (we used it for w>z, but it's not necessary for the cycle). 

       The point is: even without Pareto, minimal liberalism can conflict with transitivity. However, in the literature, it is often presented with Pareto because Pareto is a very weak condition, and the rights assignments are also weak (minimal), yet they still conflict.

       For teaching, I think it's fine to show the cycle from rights alone, and then note that Pareto might be used in some examples and also causes problems.

       So for the carrying example, I'll use the movie example.

     Carrying example summary:

       Two individuals: Alice and Bob.
       Two choices: which movie type to watch (comedy or drama) on their own TV.
       Alternatives: 
          w: Alice watches comedy, Bob watches drama.
          x: Alice watches comedy, Bob watches comedy.
          y: Alice watches drama, Bob watches drama.
          z: Alice watches drama, Bob watches comedy.

       Preferences:
          Alice: x > y > w > z   [she prefers both watching the same, and comedy is better than drama. She least likes when they watch different and she is watching drama.]
          Bob:   w > z > y > x   [he prefers watching different movies, and he prefers drama for himself. He least likes when both watch comedy.]

       Rights:
          Alice is decisive on the pairs that differ only in her movie choice (holding Bob's fixed):
            - {w, y}: because in w and y, Bob is watching drama, and Alice switches.
            - {x, z}: because in x and z, Bob is watching comedy, and Alice switches.
          Bob is decisive on the pairs that differ only in his movie choice (holding Alice's fixed):
            - {w, x}: because in w and x, Alice is watching comedy, and Bob switches.
            - {y, z}: because in y and z, Alice is watching drama, and Bob switches.

       Social preferences from rights:
          On {w,x}: Bob is decisive, and Bob prefers w>x -> social w>x.
          On {x,z}: Alice is decisive, and Alice prefers x>z -> social x>z.
          On {y,z}: Bob is decisive, and Bob prefers z>y -> social z>y.
          On {w,y}: Alice is decisive, and Alice prefers y>w -> social y>w.

       So we have: 
          w>x (from {w,x})
          x>z (from {x,z})
          z>y (from {y,z})  -> so w>x>z>y.
          and y>w (from {w,y}) -> so we have a cycle: w>x>z>y>w.

       This is without using Pareto. But we can also note that for the pair {w,z}, both prefer w>z (Alice: w>z, Bob: w>z) so by Pareto we have w>z, which is consistent with the chain w>x>z.

       The cycle is a problem for transitivity.

     Why this example carries the mechanics:
       - It has clear personal spheres: each person's choice of movie for themselves.
       - The rights assignment is based on these spheres.
       - The preferences are defined such that they care about what the other watches, but that is realistic (coordination or anti-coordination games are common).
       - The cycle is derived purely from the rights assignments, and we can see the steps.

     What Sen's own example gains:
       - It is more compact (three alternatives).
       - It uses the Pareto condition in the cycle in some versions, which highlights the conflict between rights and efficiency.
       - It is memorable.

     But we avoid the salacious framing.

  3. **Misconceptions**:

     (a) Reading the Pareto condition as the claim that the outcome must be Pareto-efficient, instead of as a condition on social preference.
        - This is genuine. We must head it off when stating the Pareto condition. We should say: the Pareto condition is a condition on the social preference relation: if everyone prefers x to y, then the social preference must have x preferred to y.

     (b) Taking liberalism here to be the political doctrine, and Sen to be arguing against liberal rights.
        - This is genuine. Sen is not against liberalism; he is showing a technical impossibility. We should head this off when introducing minimal liberalism: it is a very weak condition of individual rights over personal choices.

     (c) Hearing decisiveness over a single pair as dictatorship in miniature.
        - This is genuine. We should clarify that minimal liberalism only requires decisiveness over one pair for each individual, which is very weak, and not over all pairs like a dictator.

     (d) Thinking the cycle is an artefact of the eccentric content of the example.
        - This is genuine. We should emphasize that the example is just one instance, and the theorem says that for any society with at least two individuals, if we assign such rights, there will be some preferences that cause a cycle.

     (e) Concluding that the moral is to drop the rights condition and maximise welfare.
        - This is genuine. But Sen's point is to show a conflict, not to advocate for dropping rights. We should head this off in the conclusion: the theorem shows a tension, and we might need to restrict the domain of preferences or adjust the rights assignments.

     When to head off each:

     - (a) When defining the Pareto condition.
     - (b) When introducing minimal liberalism.
     - (c) When defining minimal liberalism (decisiveness).
     - (d) After presenting the example, when stating the general theorem.
     - (e) In the conclusion, when discussing implications.

