  ### Key Teaching Notes
  - **Order**: Conditions (Pareto, ML) must precede the example. This frames the cycle as *derived* from general principles, not an artifact of a quirky scenario.
  - **Carrying Example**: Books example avoids salaciousness while preserving mechanics. Rights assignments create a cycle without Pareto, emphasizing ML’s incompatibility with transitivity.
  - **Misconceptions**: 
    - (a) Defused when defining Pareto (Step 3).
    - (b, c) Defused when defining ML (Step 4). 
    - (d) Defused after deriving the cycle (Step 6). 
    - (e) Defused when stating the theorem (Step 7).
  - **Variant**: 
    - **Expectations**: Students may miss that preferences are non-meddlesome (physical). Clarify that interdependence stems from shared environment, not rights violations. 
    - **End Goal**: Show cycles arise even with "benign" preferences. 
    - **Refused**: Solutions and real-world applications exceed scope; focus on impossibility.
