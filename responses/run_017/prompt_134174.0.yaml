answer: |-
  Below is a decision procedure designed for your team, incorporating your ideas with refinements for clarity, robustness, and operational simplicity. It prioritizes **transparency**, **actionability**, and **honesty about judgment calls**. The procedure is structured as a flowchart with explicit steps, exit criteria, and documentation requirements. It avoids advanced math (no calculus or integrals), relying only on arithmetic, percentiles, and basic probability.

  ---

  ### **Philanthropic Grant Decision Procedure for High-Impact, Uncertain Payoffs**  
  **Goal**: Systematically evaluate proposals where expected value (EV) is unstable or infinite.  
  **Inputs**: Proposal narrative, outcome estimates (payoffs and probabilities), baseline comparison (e.g., cash transfers).  
  **Outputs**: Fund, Reject, Revise & Resubmit, or Judgment Call.  
  **Time Budget**: ≤2 hours per proposal, using spreadsheets.  
  **Key Principles**:  
  - No single-number EV when unstable.  
  - Explicit thresholds for tractability.  
  - Distinguish "facts" (quantifiable) from "values" (judgment).  

  ---

  ### **The Procedure**  
  **Step 0: Pre-Check (5 mins)**  
  - **Question**: Does the proposal define at least one **positive outcome** with a **non-zero probability**?  
  - **Sufficient Answer**: Yes, with payoffs and probabilities listed.  
  - **Exit to Reject/Revise**: If no positive outcome, reject. If outcomes are too vague (e.g., "could shift a field" with no numbers), return for revision.  
  - **Judgment Call**: None. Pure feasibility.  

  **Step 1: Stability Check (15 mins)**  
  - **Question**: Is the EV stable? (i.e., Does the sum converge to the same value regardless of calculation order?)  
  - **Method**:  
    - List all outcomes in ascending order of payoff. Compute partial EV sum from smallest to largest payoff.  
    - List all outcomes in descending order of payoff. Compute partial EV sum from largest to smallest payoff.  
    - **Instability Threshold**: If the sign (positive/negative) of the two sums differs at any point, or the gap between sums is >50% of the larger absolute value, flag as unstable.  
  - **Sufficient Answer**: Stable if sums converge to same sign/value within 10% tolerance.  
  - **Exit to Revise**: If unstable, proceed to Step 2 (do not use EV for ranking).  
  - **Judgment Call**: None. Math check.  
  - **Docs**: Note stability result in spreadsheet.  

  **Step 2: Dominance Across Horizons (45 mins)**  
  - **Question**: Does the proposal beat a fixed baseline (e.g., cash transfers) across all payoff ceilings?  
  - **Method**:  
    - **Baseline**: Use a benchmark grant (e.g., cash transfers) with known, stable EV (e.g., $0.50 per $1 invested).  
    - **Truncate**: Cap all payoffs at a ceiling **T**. Start at **T = 10× baseline value**, then increase exponentially (e.g., **T = 10²×, 10³×, ..., 10¹²×** baseline).  
    - **Compute**: For each **T**, calculate:  
      - Proposal’s truncated EV = Σ [min(payoff, T) × probability]  
      - Baseline’s truncated EV = min(baseline value, T)  
    - **Dominance Threshold**: Proposal must have higher truncated EV than baseline at **all** ceilings.  
  - **Sufficient Answer**: Dominance if proposal wins at every **T**.  
  - **Exit to Fund**: Dominance → Fund.  
  - **Exit to Reject**: If baseline wins at every **T** → Reject.  
  - **Exit to Step 3**: If mixed results (proposal wins at some **T**, loses at others).  
  - **Judgment Call**: None. Dominance is objective.  
  - **Docs**: Graph proposal vs. baseline across **T** (log scale).  

  **Step 3: Tail Exponent & Credibility (30 mins)**  
  - **Question**: Is the decision robust to uncertainty in the tail?  
  - **Method**:  
    - **A. Tail Exponent (if power-law tail claimed)**  
      - Require applicant to state tail exponent (α).  
      - **Sensitivity Threshold**: Recalculate dominance (Step 2) with α adjusted by ±0.1 (e.g., α=0.9 and 1.1). If verdict flips (fund↔reject), exit to reject.  
    - **B. Credibility Ceiling (always required)**  
      - Set **confidence score** (0–100%) in the model:  
        - 100% = RCT-quality evidence; 50% = expert speculation; 10% = pure guess.  
      - **Threshold**: Ignore outcomes with probability < (1 − confidence score).  
      - Recompute truncated EV (Step 2) with filtered outcomes.  
      - **Dominance Recheck**: If proposal now dominates baseline → Fund. Else, exit to reject.  
  - **Sufficient Answer**: Robust if verdict unchanged after adjustments.  
  - **Exit to Reject**: Fails tail sensitivity or loses dominance after credibility cap.  
  - **Exit to Judgment Call**: If no tail exponent/data, but credibility-adjusted EV > baseline.  
  - **Judgment Call**: Confidence score assignment. Be explicit: "This is 40% confidence because mechanism is untested."  
  - **Docs**: Record confidence score and tail exponent sensitivity.  

  **Step 4: Final Judgment (10 mins)**  
  - **Question**: After quantitative checks, is the proposal compelling on non-quantitative grounds?  
  - **Inputs**: Steps 0–3 outputs + mission alignment, applicant track record.  
  - **Exit to Fund**: Quantitative dominance or strong judgment case.  
  - **Exit to Reject**: Weak judgment case.  
  - **Judgment Call**: Explicitly state values driving the decision (e.g., "We prioritize tail risks even without dominance").  
  - **Docs**: "We funded despite quantitative weakness because: [X]."  

  ---

  ### **What the Procedure Can't Do**  
  1. **Compare two unstable proposals**: If both fail stability (Step 1) and lack dominance (Step 2), the procedure refuses to rank them. Use external experts.  
  2. **Handle correlated proposals**: E.g., if two grants affect the same tail risk. Requires portfolio analysis.  
  3. **Replace values with math**: When Step 4 is reached, math is exhausted. Own the judgment.  
  4. **Resolve deep uncertainty**: If no probabilities exist (e.g., "black swan" outcomes), use pre-agreed heuristics (e.g., "auto-reject if confidence <5%").  

  ---

  ### **Application to Your Cases**  
  **Baseline**: Cash transfers ($2M grant → $1M EV, stable).  
  **Dominance Ceilings**: **T** = $10M, $100M, $1B, $10B, $100B, $1T, $10T.  

  **Case 1: Genomic Surveillance Network ($2M)**  
  - **Step 0**: Pass. Positive outcome: 0.1% chance of catching pandemic (payoff = $1T+).  
  - **Step 1**: **Stable EV** (0.001 × $1T = $1B). Not Pasadena-style.  
  - **Step 2**: Dominance check:  
    - **T = $10M**: Proposal EV = min($1T, $10M) × 0.001 = $10k < Baseline ($1M) → **Loses**.  
    - **T = $1B**: EV = $1B × 0.001 = $1M = Baseline → **Ties**.  
    - **T = $1T**: EV = $1B > Baseline ($1M) → **Wins**.  
    - → **Mixed results** (not dominant). Proceed to Step 3.  
  - **Step 3**:  
    - **Credibility Ceiling**: Confidence = 70% (good evidence for outbreak risk, less for payoff). Ignore outcomes with prob < 30%.  
      - High-impact outcome prob = 0.001 > 0.3? No → keep.  
      - Revised EV = $1B (unchanged).  
    - **Dominance Recheck**: Still mixed → **No dominance**.  
    - → **Judgment Call**.  
  - **Step 4**: Fund. **Why?** Mission prioritizes tail risks, and upside is credible.  

  **Verdict: Fund, with documented judgment.**  

  **Case 2: Cash Transfers ($2M)**  
  - **Step 0**: Pass. Stable positive outcome ($1M EV).  
  - **Step 1**: Stable.  
  - **Step 2**: Trivial self-dominance (wins at all **T**).  
  - **Verdict: Fund.**  

  **Case 3: Curriculum Rewrite ($400k)**  
  - **Step 0**: Pass. Positive outcomes claimed (e.g., "prevent AI catastrophe"), but no probabilities.  
    - → **Exit to Revise**: Demand quantifiable estimates.  
  - **After Revision**: Assume 0.01% chance of $100B payoff, 99.99% chance of $0.  
  - **Step 1**: **Stable EV** (0.0001 × $100B = $10M).  
  - **Step 2**: Dominance vs. baseline ($200k for $400k):  
    - **T = $200k**: EV = min($100B, $200k) × 0.0001 = $20 < Baseline ($200k) → **Loses**.  
    - **T = $100B**: EV = $10M > Baseline ($200k) → **Wins**.  
    - → **Mixed results**. Proceed to Step 3.  
  - **Step 3**:  
    - **Tail Exponent**: Not given; skip.  
    - **Credibility Ceiling**: Confidence = 10% (no empirical support). Ignore outcomes with prob < 90%.  
      - High-impact prob = 0.0001 < 0.9 → **ignore**.  
      - Revised outcomes: All $0 → EV = $0.  
    - **Dominance Recheck**: $0 < $200k at all **T** → **Baseline dominates**.  
  - **Verdict: Reject.**  

  ---

  ### **Why This Works for Your Team**  
  - **Operational**: All steps in a spreadsheet. Uses sorting, min/max, arithmetic.  
  - **Defensible**: Shows rigor even when rejecting (e.g., "failed dominance at T=$200k").  
  - **Honest**: Flags judgment calls (confidence scores, Step 4).  
  - **Board-Friendly**: Clear audit trail; graphs make instability visible.  
  - **Improves Proposals**: Forces applicants to quantify tails (Step 0/Step 3).  

  **Final Note**: This procedure **explicitly avoids** pretending math can solve value disagreements. When Steps 1–3 are indecisive, Step 4 requires owning the values behind the choice—which is the philanthropist's job.
