prompt: |-
  I am about to use epistemic game theory as an engineering tool rather than as an object of study, and I want the specification before I commit to a framework.

  The setting: I am designing an automated negotiation protocol. A small number of software agents, each with a private type, exchange messages over a fixed protocol and then choose. I want to be able to say of some outcomes that they follow from the agents' rationality together with what the agents commonly know, and of others that they do not — and I want to know what would have to be established before such a claim is licensed. Three features of my setting are not the textbook ones:

  1. The agents' decision procedures are inspectable. In the deployments I expect, each side can read the other's code before choosing, so the object of higher-order reasoning is often a procedure rather than an action.
  2. Rollouts are staggered. Some participants run a version of the protocol in which certain moves do not exist; they do not merely assign those moves low probability, they cannot represent them at all.
  3. My verification is partial. At best I can establish that each agent has the relevant beliefs, that each believes the others do, and so on, to some finite depth and with some margin short of certainty.

  Please write the desiderata that an epistemic account of rationality and common knowledge would have to satisfy to be adequate for this purpose. For each requirement give the case or consideration behind it — the criteria and their motivations are what I want, not a list. I particularly want you to settle what the account must say about: whether rational attaches to strategies or to the procedures that produce them; what is to be done when the game form itself is not common; whether conclusions reached under common knowledge survive when it is weakened to high-degree, high-probability mutual belief (consider the alternating-move game in which a player may take the larger share now or pass and let the pot grow, and the two-generals case in which every confirmation of a message itself stands in need of confirmation); whether the account must do more than describe beliefs and actually select an outcome, and if so whether it can do that without assuming common knowledge of the outcome it selects; and whether its verdicts must be invariant under re-implementations of the agents that behave identically in isolation but differently once the procedures are mutually visible.

  Then mark which requirements are forced on me by this purpose and which are preferences of particular research programmes — a single fixed space of uncertainty shared by all agents, knowledge as factive and fully introspective, belief as a single probability measure rather than a ranking, a common prior, the vindication of some favored solution concept. I also want to know what diagnostic duty the account owes me: when play contradicts the prediction, must it tell me whether rationality or the knowledge assumption is what I should give up, and can any account discharge that duty? Flag any subset of the desiderata you think cannot be jointly satisfied, and say which single requirement does the most work in ruling candidate frameworks out. A brief scorecard at the end against the main families of account is welcome, but keep the weight on the criteria.
reasoning: |-
  We are designing an automated negotiation protocol. The goal is to use epistemic game theory as an engineering tool to predict outcomes that follow from rationality and common knowledge (or approximations thereof). We have three non-standard features:

  1. **Inspectable decision procedures**: Agents can read each other's code, so higher-order reasoning is about procedures.
  2. **Staggered rollouts**: Some agents run a version of the protocol without certain moves (they cannot represent them at all).
  3. **Partial verification**: We can only establish beliefs to a finite depth and with less than certainty.

  We need desiderata for an epistemic account of rationality and common knowledge that is adequate for this purpose.

  ## Desiderata

  ### 1. Rationality must attach to procedures, not just strategies
     - **Motivation**: Because agents can inspect each other's code, they reason about the decision-making process (the procedure) that generates the strategy. The procedure is the object of higher-order reasoning. Therefore, rationality must be defined in terms of the procedure: a rational procedure is one that, given the agent's beliefs and the procedures of others, produces a strategy that maximizes expected utility (or satisfies some other criterion of rationality). Without this, we cannot model how agents update their beliefs when they see the code.
     - **Forced by purpose?**: Yes, because of the inspectability of code.

  ### 2. The account must handle non-common game forms
     - **Motivation**: With staggered rollouts, agents might be playing different versions of the game (some moves are missing for some agents). Therefore, the game form itself (the set of available actions, the structure of the game) is not common knowledge. The account must be able to represent that different agents have different representations of the game and reason about each other's representations.
     - **Forced by purpose?**: Yes, because of staggered rollouts.

  ### 3. The account must be robust under weakening of common knowledge to finite-depth mutual belief and probabilistic belief
     - **Motivation**: We can only verify beliefs to a finite depth and with a margin of error (less than certainty). We must be able to draw conclusions that hold approximately when common knowledge is weakened to high-degree mutual belief and high probability. Two classic cases illustrate the importance:
       - **Alternating-move game (e.g., centipede game)**: If players have a high but less than certain belief that the other will stop at the next node, then the backward induction outcome might still hold approximately? But note: without common knowledge of rationality, the outcome might change. We want to know how the prediction changes as we weaken the knowledge assumption.
       - **Two-generals problem**: Coordination requires common knowledge, but with finite-depth mutual belief and probabilistic belief, coordination might fail. The account must tell us when the outcome is still achievable and how the probability of coordination failure relates to the depth of mutual belief and the probabilities.
     - **Forced by purpose?**: Yes, because of partial verification.

  ### 4. The account must be able to select an outcome (or a set of outcomes) without assuming common knowledge of that outcome
     - **Motivation**: We want to predict outcomes. However, if the outcome itself is assumed to be common knowledge, then the prediction would be circular. The account must provide a way to derive the outcome from the assumptions of rationality and common knowledge (or approximations) without presupposing the outcome.
     - **Forced by purpose?**: Yes, because we want to say that the outcome follows from rationality and common knowledge, so the outcome must be derived, not assumed.

  ### 5. Invariance under re-implementation
     - **Motivation**: If two implementations of an agent are behaviorally equivalent in isolation (i.e., they produce the same strategy for every possible input from the environment and other agents) but differ when their code is inspected, then the outcome might change. The account must either require that the outcome is invariant under such re-implementations (if we want to abstract away from implementation details) or allow that the outcome can change (if the implementation details matter for higher-order reasoning). Given that agents can inspect the code, the implementation details might matter. However, for the purpose of specification, we might want invariance: two agents that are behaviorally equivalent should lead to the same outcomes. But note: if the code is inspectable, then the implementation might affect the beliefs of the other agent. Therefore, we might need to say that the outcome is determined by the behavior and the information that the code reveals. This is tricky.
     - **Forced by purpose?**: Partially. We must account for the fact that the code is inspectable, so the implementation matters if it reveals different information. However, if two implementations reveal the same information (i.e., they are indistinguishable in terms of the decision procedure from the perspective of the other agent), then we want invariance. So the desideratum is: the outcome should depend only on the information that the code reveals about the decision procedure and the behavior, not on irrelevant implementation details.

  ### 6. Diagnostic duty: When the prediction fails, the account must help diagnose whether the failure is due to a breach of rationality or of the knowledge assumptions
     - **Motivation**: In engineering, we need to know what went wrong to fix it. If the agents do not play the predicted outcome, we want to know if it's because an agent was not rational or because the common knowledge assumption was too strong (or not approximated well enough). The account must provide a way to attribute the failure to one of these causes.
     - **Forced by purpose?**: Yes, for debugging and refinement of the system.

  ### 7. The account must not require a single fixed space of uncertainty (i.e., a universal type space) shared by all agents
     - **Motivation**: Because of staggered rollouts, agents have different representations of the game. They might not even agree on the possible states of the world. Therefore, we cannot assume a common state space. The account must allow for heterogeneous representations.
     - **Forced by purpose?**: Yes, because of staggered rollouts.

  ### 8. The account must not require that knowledge is factive and fully introspective
     - **Motivation**: In a computational setting, agents might have bounded rationality, so introspection might be limited. Also, with probabilistic beliefs, we might not have factivity (beliefs can be wrong). We are dealing with belief, not knowledge, and we are weakening common knowledge to mutual belief. So we do not require factivity (which is a property of knowledge: if you know P then P is true). However, note: in our setting, the agents are reasoning about code and the protocol, which might be more reliable. But we are not forced to have factivity. We are also weakening to probabilistic belief, so factivity is not expected.
     - **Forced by purpose?**: No, this is a preference. We are using belief, not knowledge, and we are in a probabilistic setting.

  ### 9. The account must not require that belief is represented by a single probability measure
     - **Motivation**: Agents might have imprecise beliefs (represented by sets of probabilities) or use other representations (like rankings). Given that we are in a computational setting, we might want flexibility. However, for simplicity and tractability, we might prefer a single probability measure. But the desideratum is that the account should not force a single probability measure if the problem does not require it.
     - **Forced by purpose?**: No, this is a preference.

  ### 10. The account must not require a common prior
     - **Motivation**: In our setting, agents have different code and different representations (due to staggered rollouts). They might have different priors. We do not want to assume a common prior because it might not hold. However, note: without a common prior, it is harder to get sharp predictions. But we are forced by the setting to allow heterogeneous priors?
     - **Forced by purpose?**: Yes, because of staggered rollouts and inspectable code, which might lead to different initial beliefs.

  ### 11. The account must not require the vindication of a particular solution concept (e.g., Nash equilibrium) as a primitive
     - **Motivation**: We want to derive the solution concept from rationality and common knowledge (or approximations). The account should not assume that the solution concept holds; it should derive it. This is already covered by desideratum 4 (selecting an outcome without assuming common knowledge of that outcome). But note: we are using the solution concept as a tool for prediction. We are not forced to use a particular one. The account must be general enough to allow different solution concepts to be derived under different assumptions.
     - **Forced by purpose?**: Yes, because we want to derive outcomes from rationality and common knowledge.

  ### Summary of forced vs. preferences

  - **Forced**:
    - 1 (rationality attaches to procedures)
    - 2 (non-common game forms)
    - 3 (robustness under weakening of common knowledge)
    - 4 (select outcome without assuming it)
    - 5 (invariance under re-implementation, with the caveat about revealed information)
    - 6 (diagnostic duty)
    - 7 (no single fixed space of uncertainty)
    - 10 (no common prior)

  - **Preferences** (we can choose an account that relaxes these if needed, but they are not forced by the setting):
    - 8 (no requirement for factivity and full introspection) 
    - 9 (no requirement for a single probability measure)

  - **Note on 11**: This is forced because we are deriving the solution concept.

  ## Potential Incompatibilities

  - **Incompatibility between 2 (non-common game forms) and 7 (no single fixed space) and the standard type space framework**: Standard type spaces assume a common state space. We are forcing the account to handle heterogeneous representations. This might require a more complex framework, such as using multi-pointed models or syntactic approaches.

  - **Diagnostic duty (6) might be hard to satisfy**: It requires the account to be able to attribute failure to either rationality or knowledge assumptions. This might require a detailed model of the agent's reasoning that is hard to verify.

  - **Robustness under weakening (3) and the requirement to select an outcome (4) might conflict**: With finite depth and probabilistic beliefs, we might not get a unique outcome. The account might only be able to give a set of possible outcomes or a probability distribution. But we want to be able to say that some outcomes do not follow.

  ## The Requirement That Does the Most Work in Ruling Out Frameworks

  - **Requirement 2 (non-common game forms) and 7 (no fixed space of uncertainty)**: These rule out standard type space models and many existing epistemic game theory frameworks, which assume a common state space and common knowledge of the game structure. We need a framework that can represent that agents have different representations of the game.

  ## Brief Scorecard Against Main Families

  1. **Standard Type Space Models (with knowledge and common knowledge operators)**:
     - Fails on 2, 7 (assumes common state space and common knowledge of the game).
     - Typically assumes common prior (fails 10).
     - Rationality is usually about strategies, not procedures (fails 1).
     - Not robust under weakening to finite depth (fails 3).

  2. **Syntactic Approaches (using logical languages)**:
     - Can handle non-common game forms (2) by having different axioms for different agents.
     - Can attach rationality to procedures (1) by including axioms about the code.
     - Can avoid a fixed space (7) by having agent-specific theories.
     - Common knowledge is usually represented by an infinitary operator, so weakening to finite depth (3) requires a non-standard account.
     - Diagnostic duty (6) might be addressed by proof analysis, but it's challenging.

  3. **Probabilistic Belief Hierarchies (without common prior)**:
     - Can handle no common prior (10) and probabilistic belief (3, partially).
     - But without a common state space (7) and with non-common game forms (2), it becomes very complex.
     - Rationality is typically about strategies (fails 1).

  4. **Computer Science Approaches (e.g., using interpreted systems, epistemic logic in multi-agent systems)**:
     - Can model inspectable code (1) by having the code as part of the state.
     - Can handle non-common game forms (2) by having different protocols for different agents.
     - Weakening common knowledge to finite depth (3) is possible (e.g., using common belief to depth k).
     - Invariance under re-implementation (5) might be addressed by requiring that the code is semantically equivalent.
     - Diagnostic duty (6) might be addressed by model checking.

  5. **Solution Concepts Directly** (e.g., Nash equilibrium, correlated equilibrium):
     - Typically assume common knowledge of the game and rationality, and attach rationality to strategies (fails 1 and 2).
     - Not robust under weakening (3) and do not handle non-common game forms (2).

  ## Conclusion

  The most promising approach might be a combination of syntactic methods and computer science models (like interpreted systems) that can handle heterogeneous representations and inspectable code. However, we must extend these to handle the weakening of common knowledge to finite-depth mutual belief and probabilistic belief.

  The key forced requirements that rule out many existing frameworks are:
  - Rationality attached to procedures (1)
  - Handling non-common game forms (2) and no fixed state space (7)
  - Robustness under weakening of common knowledge (3)
  - Diagnostic duty (6)

  No existing framework satisfies all of these. We would need to develop a new framework or significantly extend an existing one (like syntactic epistemic models or multi-agent systems with heterogeneous protocols) to meet these requirements.
answer: |-
  ### Desiderata for an Epistemic Account in Automated Negotiation Protocol Design

  To serve as an engineering tool for your automated negotiation protocol, the epistemic account must satisfy the following desiderata. Each requirement is motivated by your specific setting (inspectable procedures, staggered rollouts, partial verification) and core objectives (predicting outcomes from rationality + common knowledge, diagnosing failures). Requirements are **forced** (F) by your purpose or **preferences** (P) of research programs.

  ---

  #### 1. **Rationality Must Attach to Procedures, Not Just Strategies**  
     - **Motivation**: With inspectable code, agents reason about *how* decisions are made (e.g., "Does this algorithm hardcode a threshold?"). Rationality should evaluate the *decision procedure* (e.g., "Is this code robust to my beliefs about others?"), not just the output strategy. A procedure is rational if it generates optimal actions given its inputs and beliefs.  
     - **Forced?**: **F** (inspectability requires reasoning about implementations).

  #### 2. **Non-Common Game Forms Must Be Representable**  
     - **Motivation**: Staggered rollouts mean agents lack representations of certain moves (e.g., Agent A cannot conceive of "move X" in its game tree). The account must model asymmetric game structures without assuming a shared global game form.  
     - **Forced?**: **F** (staggered rollouts break common knowledge of the game).

  #### 3. **Robustness Under Weakening of Common Knowledge**  
     - **Motivation**: Partial verification limits depth/certainty of mutual belief. The account must:  
       - **Alternating-move game**: Predict if cooperation survives when mutual belief in rationality is finite-depth (e.g., "I believe you’re rational up to depth 3, but not further").  
       - **Two-generals problem**: Quantify coordination failure risk when messages are confirmed probabilistically (e.g., "With 95% confidence in mutual belief, agreement succeeds with probability P").  
     - **Forced?**: **F** (partial verification necessitates approximate common knowledge).

  #### 4. **Outcome Selection Without Assuming Common Knowledge of the Outcome**  
     - **Motivation**: Predictions must be derived from rationality + common knowledge *assumptions*, not presuppose the outcome (e.g., "Outcome O occurs because of CK of rationality" not "CK of O implies O"). Circularity invalidates engineering use.  
     - **Forced?**: **F** (non-circular predictions are essential for design).

  #### 5. **Invariance Under Behaviorally Equivalent Re-Implementations**  
     - **Motivation**: If two procedures are observationally equivalent in isolation but differ when code is visible (e.g., one uses a random seed, the other does not), outcomes should not change unless the difference alters revealed information. The account must ignore irrelevant implementation details.  
     - **Forced?**: **F** (inspectability should only matter if code reveals *decision-relevant* information).

  #### 6. **Diagnostic Duty: Attribute Failures to Rationality or Knowledge**  
     - **Motivation**: When play contradicts predictions, the account must distinguish:  
       - *Rationality failure* (e.g., an agent’s code has a suboptimal heuristic).  
       - *Knowledge failure* (e.g., mutual belief depth was insufficient for coordination).  
       No account can *guarantee* attribution (due to underdetermination), but it must provide testable hypotheses (e.g., "If mutual belief depth > N, failure implies irrationality").  
     - **Forced?**: **F** (debugging protocols requires actionable diagnostics).

  ---

  ### Classification of Requirements vs. Research Program Preferences  
  | **Requirement**                          | **Forced (F) or Preference (P)?** | **Notes**                                                                 |
  |------------------------------------------|-----------------------------------|---------------------------------------------------------------------------|
  | **Single fixed space of uncertainty**    | P                                 | Staggered rollouts (F) force *heterogeneous* state spaces.                |
  | **Knowledge as factive/introspective**  | P                                 | Belief (non-factive, probabilistic) suffices; factivity is unrealistic.   |
  | **Belief as single probability measure** | P                                 | Rankings/imprecise probabilities may better handle partial verification. |
  | **Common prior**                         | P                                 | Inspectable code (F) allows divergent priors; common prior not essential. |
  | **Vindication of a solution concept**    | P                                 | Must *derive* outcomes (e.g., Nash) from epistemic conditions, not assume them. |

  ---

  ### Tensions and Incompatibilities  
  - **Incompatible Pair**:  
    - *Non-common game forms (F)* + *Invariance under re-implementation (F)*.  
      If agents have asymmetric game representations, re-implementations that are behaviorally equivalent in one game may not be in another. Invariance may only hold if re-implementations preserve *all* game-relevant properties.  
  - **Key Requirement Ruling Out Frameworks**:  
    **Non-common game forms (F)**. Most frameworks (e.g., type-space models) assume a common state space, failing staggered rollouts.  

  - **Diagnostic Duty Limitation**:  
    No account can *decisively* attribute failures (rationality vs. knowledge) due to underdetermination. However, frameworks with explicit belief hierarchies (e.g., syntactic models) support better diagnostics than implicit ones (e.g., equilibrium concepts).

  ---

  ### Scorecard Against Epistemic Frameworks  
  | **Framework**               | **Procedural Rationality (F)** | **Non-Common Games (F)** | **Weakened CK (F)** | **Diagnostics (F)** | **Notes**                                                                 |
  |-----------------------------|--------------------------------|--------------------------|---------------------|---------------------|---------------------------------------------------------------------------|
  | **Type-Space Models**       | ❌                             | ❌                       | △                   | △                   | Fails non-common games; rationality typically strategy-based.             |
  | **Syntactic Epistemic Logic** | ✔️                             | ✔️                       | ✔️                  | ✔️                  | Handles heterogeneous knowledge; supports finite-depth mutual belief.     |
  | **Probabilistic BEL Theory** | △                              | ❌                       | ✔️                  | △                   | Struggles with non-common games; good for probabilistic robustness.       |
  | **Equilibrium Concepts**    | ❌                             | ❌                       | ❌                  | ❌                  | Assumes common knowledge of game/rationality; poor diagnostics.           |
  | **Computer Science Models** | ✔️                             | ✔️                       | ✔️                  | ✔️                  | E.g., **interpreted systems**; best fit for inspectability/staggered rollouts. |

  - ✔️ = Strong fit, △ = Partial fit, ❌ = Poor fit  
  - **Recommended Approach**: Syntactic models or computer science frameworks (e.g., based on **dynamic epistemic logic**). They naturally handle inspectable procedures, asymmetric knowledge, and finite-depth mutual belief.

  ---

  ### Summary  
  Your setting forces requirements that rule out standard game-theoretic tools (e.g., type spaces, Nash equilibrium). A framework combining:  
  - **Procedural rationality**,  
  - **Explicit representation of asymmetric knowledge**,  
  - **Finite-depth probabilistic mutual belief**,  
  is essential. Syntactic or computational epistemic models (e.g., using **Kripke structures with heterogeneous possible worlds**) are most promising. The critical tension—**non-common games** vs. **re-implementation invariance**—must be resolved by constraining re-implementations to preserve *information-relevant equivalence*.
