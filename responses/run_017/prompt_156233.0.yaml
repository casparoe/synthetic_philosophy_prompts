  - Fine-sliced path yields local permission to move but ends in worse state
  - Coarse-sliced path shows local worsening
  - They propose "betterness" must obey Grain-Invariance while "improvement" doesn't
  - The distinction supposedly resolves paradoxes by separating permissibility from betterness

  Major concerns I should address: 
  - Whether Grain-Invariance question-begs against intransitivists
  - If static cycles exist beyond deliberative contexts
  - The epistemic cost of imperceptible worsenings
  - Risk of collapsing improvement into conservatism
  - Whether this merely repackages existing solutions

