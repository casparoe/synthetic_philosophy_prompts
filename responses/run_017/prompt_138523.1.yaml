prompt: |-
  hey — I'm in an informal comparative ethics reading group (mostly grad students, plus one guy who did a monastery year in Thailand and won't stop correcting our Pali), and we keep hitting the same move. Every time someone argues that Buddhist ethics is really just consequentialism, they reach for the medical analogy: the Buddha is the physician, dukkha is the illness, craving and ignorance are the diagnosis, nirvana is the cure, and the eightfold path is the course of treatment. Then the conclusion gets drawn: since a treatment is good only so far as it cures, and the regimen can be adjusted or dropped once it stops working (this is where the raft parable gets wheeled out), Buddhist ethics is consequentialist all the way down — skillful versus unskillful just means conduces to the end of suffering, full stop, with no deontological leftovers.

  I'd like someone to actually audit that instead of nodding along. Give me the mapping explicitly — a table of correspondences is great — then where it breaks, and please separate the disanalogies that matter for the conclusion being drawn from the ones that are just decoration.

  Some things I keep chewing on and can't settle:

  1. Medicine has an externally specifiable endpoint (health, functioning, survival) that the patient already wants and can partly recognize. Is nirvana that sort of thing? Doesn't the analogy quietly import a pre-given "normal functioning" that Buddhist soteriology doesn't have — the end being defined partly by the path rather than the other way round?

  2. The bedside frame is one doctor, one patient, benefits accruing to that patient. Consequentialism is normally agent-neutral: my act counts if it reduces suffering anywhere. So the analogy looks like it buys at most a self-directed, what's-good-for-this-patient teleology. What would it take to make it a public-health analogy instead — triage, bed allocation, a formulary committee deciding which of two treatments to fund — and would that version be as comfortable for the people using it, or does it start sounding like something they didn't sign up for?

  3. Paternalism. Doctors treat people who don't consent and don't grasp the diagnosis, and "the patient doesn't know he's sick" does real work in these texts. Does the analogy smuggle in an expertise asymmetry that consequentialism doesn't itself license? And does that make the bitter-medicine and skillful-means material look more like an excuse than an argument?

  4. Intention. Karma is identified with intention in the texts, but medicine is indifferent to why you swallowed the pill — only to whether it worked. So the analogy seems to predict the wrong thing about what's being assessed. Or is that too fast?

  If the bedside version can't carry the conclusion, say so plainly and tell me what the nearest analogy that could would be. Keep it under 900 words, and finish with a one-sentence summary followed by \answer{...} containing exactly one of: survives, survives-in-modified-form, collapses.
reasoning: |-
  Hmm, the user is part of an informal comparative ethics reading group focused on Buddhist ethics, and they keep encountering the argument that Buddhist ethics is fundamentally consequentialist based on the medical analogy. They want me to critically examine this analogy, provide a mapping of correspondences, identify where it breaks down, and specifically address their four concerns about the analogy's validity.

  Let me break down what they need. First, I should create a clear table mapping the elements of the medical analogy to Buddhist concepts: physician → Buddha, illness → dukkha, diagnosis → craving and ignorance, cure → nirvana, treatment → Eightfold Path. This establishes the standard argument they're encountering.

  Now for the disanalogies that matter for the conclusion. Their first point questions whether nirvana functions like health in medicine - health is externally specifiable and desired by the patient, while nirvana is radically transformative and defined by the path itself. This challenges the teleological structure of the analogy.

  Their second point highlights the individual focus of the medical analogy versus consequentialism's agent-neutrality. The bedside model centers on one patient, whereas Buddhist ethics (especially Mahayana) expands to all beings, suggesting a "public health" disanalogy that undermines the consequentialist claim.

  The third point concerns paternalism. The medical analogy relies on physician authority over ignorant patients, while consequentialism doesn't inherently require such expertise hierarchies. This makes skillful means appear more like top-down imposition than neutral optimization.

  Finally, intention presents a contradiction: karma centers on volition, while medical efficacy is outcome-based regardless of intent. The analogy thus misrepresents Buddhist moral assessment.

  I need to organize these disanalogies clearly, separating those that directly challenge the consequentialist conclusion from mere decorative differences. The core breakdowns are in teleology (nirvana vs. health), scope (individual vs. universal), authority structure (expert vs. neutral), and moral mechanism (intention vs. outcome).

  For a constructive suggestion, while the bedside analogy fails, a public health framework with triage and resource allocation might better capture Mahayana's universal compassion - though this would likely unsettle the analogy's proponents.

  The user clearly wants a decisive verdict, so I'll conclude that the analogy collapses for the stated purpose, with the one-sentence summary and specified \answer format they requested.
answer: |-
  Here's the audit of the medical analogy argument for Buddhist consequentialism, structured as requested:

  **Mapping the Standard Analogy:**

  | Medical Concept      | Buddhist Concept          | Role in Consequentialist Argument          |
  | :------------------- | :------------------------ | :----------------------------------------- |
  | Physician            | Buddha                    | Expert providing the means to the end      |
  | Illness (e.g., Fever) | Dukkha (Suffering)        | Problem to be solved                       |
  | Diagnosis (Cause)    | Craving (Tanha), Ignorance (Avijja) | Identification of the root problem       |
  | Cure/Health          | Nirvana (Nibbana)         | Ultimate goal/end state                    |
  | Treatment (e.g., Pill)| Eightfold Path, Precepts  | Means (Skilful = kusala) prescribed to achieve the end |
  | Patient              | Practitioner              | Agent whose suffering is addressed         |
  | Efficacy             | "Skilfulness" (Kusala)    | Defined solely by conduciveness to cure/end of suffering |
  | Outdated Treatment   | Raft Parable (Dropped means) | Means are instrumental, no intrinsic value; discarded when not useful for the end. |

  **Where the Analogy Breaks & Why It Matters for the Conclusion:**

  The analogy *appears* to support consequentialism by framing ethics as purely instrumental: means (treatment/path) are "good" (skillful) only insofar as they effectively produce the desired end (cure/nirvana), and are discarded when ineffective. However, key disanalogies undermine this conclusion:

  1.  **The Nature of the "Cure" & Patient's Prior Understanding (Your Point 1):**
      *   **Analogy:** Health is a pre-existing, externally verifiable state the patient already desires and recognizes (e.g., absence of fever, ability to function). Treatment restores this known state.
      *   **Buddhism:** Nirvana is *not* a pre-existing state the unenlightened being inherently desires or can fully comprehend. It's a radical transformation *defined* by the path itself (e.g., the cessation of craving/ignorance *is* nirvana). The "patient" doesn't initially grasp the diagnosis *or* the true nature of the cure.
      *   **Why it Breaks the Conclusion:** This undermines the simple teleology. If the end isn't a pre-given, externally specifiable state (like health) that the agent already wants, but is *constituted* by the path and requires a fundamental shift in understanding, then "conduciveness" becomes ambiguous. The path isn't just a *means* to a separate end; it's the *expression* and *realization* of the end. This sounds less like maximizing a known good (consequentialism) and more like transformative practice defining its own goal, potentially incorporating non-consequentialist elements (e.g., virtues intrinsic to the path like Right Intention/Right Effort).

  2.  **Scope: Individual Therapy vs. Universal Consequentialism (Your Point 2):**
      *   **Analogy:** Focuses on the physician treating *this specific patient*. Benefit accrues to the individual undergoing treatment.
      *   **Buddhism:** While starting with individual practice, core tenets (karma's interconnectedness, compassion/Karuna, especially in Mahayana Bodhisattva ideal) demand concern for *all* beings' suffering. Skilful action aims at reducing suffering universally.
      *   **Why it Breaks the Conclusion:** The bedside analogy smuggles in an *agent-relative* or self-interested teleology ("what cures *me* is skilful *for me*"). But robust consequentialism (especially utilitarianism) is *agent-neutral*: an act is skilful if it reduces suffering *anywhere*, regardless of who performs it. The analogy fails to capture this universal scope. A "public health" analogy (triage, resource allocation) *would* better capture agent-neutral consequentialism BUT:
          *   It feels alien to the core texts' focus on *individual* practice and awakening.
          *   It introduces complex trade-offs (e.g., sacrificing one being for many) often absent or rejected in mainstream Buddhist ethics (e.g., emphasis on non-harming/Ahimsa as near-absolute).
          *   Proponents likely *wouldn't* find this version comfortable, as it moves far from the personal therapist model they use.

  3.  **Paternalism & Expertise (Your Point 3):**
      *   **Analogy:** Relies heavily on physician authority. The patient may not know they're sick, resist diagnosis, or need treatment forced upon them "for their own good." Expertise justifies paternalism.
      *   **Buddhism:** The Buddha *is* presented as the supreme physician. Texts *do* depict beings as ignorant of their condition ("the patient doesn't know he's sick") and needing guidance, sometimes involving "bitter medicine" (difficult practices) or "skillful means" (tailored teachings, potentially bending rules contextually).
      *   **Why it Breaks the Conclusion:** Consequentialism, as an ethical *theory*, doesn't inherently *license* an authority structure or paternalism. It provides a criterion for right action (maximize good), but *anyone* can apply it. The analogy smuggles in an epistemic and practical hierarchy (Expert Buddha vs. Ignorant Beings) that consequentialism doesn't require. This makes "skillful means" look less like neutral consequentialist calculation and more like top-down application of wisdom by an authority figure – which could justify actions (e.g., lying if "beneficial") that feel non-consequentialist without that authoritative context. It risks turning skillful means into an "excuse" reserved for the expert, not a general criterion.

  4.  **Intention vs. Outcome (Your Point 4):**
      *   **Analogy:** Efficacy is purely outcome-based. *Why* the patient takes the pill (intent) is irrelevant; only whether it cures matters.
      *   **Buddhism:** Karma is explicitly identified with intention (cetana) in core texts (e.g., AN 6.63). The moral quality of an act is fundamentally tied to the volition behind it. While consequences matter (unskilful acts *tend* to cause harm), the primary locus of karmic "weight" is the intention. A good outcome from a bad intention is still karmically unskilful.
      *   **Why it Breaks the Conclusion:** This is a direct contradiction. The medical analogy predicts outcome is king. Buddhist ethics insists intention is fundamental. While both agree that unskilful acts *usually* lead to bad results, the core mechanism differs. A consequentialist reading must downplay or explain away the centrality of intention, which is hard textual evidence against pure consequentialism. The analogy fails on this crucial point.

  **Conclusion & Nearest Better Analogy:**

  The bedside medical analogy **collapses** as a demonstration that Buddhist ethics is "consequentialist all the way down." Its disanalogies regarding the nature of Nirvana, the scope of concern, the embedded paternalism, and especially the foundational role of intention versus pure outcome, fatally undermine the argument. It captures *instrumentality* but misrepresents the *structure*, *scope*, *mechanism*, and *authority dynamics* of Buddhist ethics.

  The **nearest analogy that *could* better capture a consequentialist reading** would be the **public health model** you suggested: suffering is a universal problem (disease burden); the Buddha/Dharma is the health authority/research body; the Path/precepts are interventions; "skillful" means "maximally effective at reducing aggregate suffering." However, this still struggles with the nature of Nirvana (is it just "suffering minimized"?), faces tensions with precept-based rules (Ahimsa as a near-side-constraint?), and downplays the irreducibly intentional aspect of karma. More importantly, it abandons the comforting, personal therapist model proponents prefer, revealing the stakes of pushing the consequentialist claim consistently.

  **Summary:** The medical analogy's disanalogies concerning Nirvana's nature, universal scope, paternalistic authority, and the centrality of intention fatally undermine its use to prove Buddhist ethics is purely consequentialist. \answer{collapses}
