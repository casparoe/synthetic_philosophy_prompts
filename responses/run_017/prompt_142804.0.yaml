  ## The Infinite Voter Roll

  The air in Jefferson High’s gymnasium crackled, thick with teenage angst and the ozone tang of bureaucracy. Principal Vance, looking like a man who’d accidentally kicked a hornet’s nest labeled "democracy," tapped the mic. "Order! The vote on Proposal 17: A Four-Year Ban on Personal Electronic Devices During School Hours, commences in one hour. Remember our charter: Stakeholder Rule applies. Votes weighted by duration affected."

  A ripple of discontent rolled through the seniors. Ben O’Reilly stood, his letterman jacket suddenly feeling like a shroud. "So we seniors, who built the spirit *you* inherit," he jabbed a finger towards the freshman section, "get only a quarter vote? But *them*?" He gestured wildly at a cluster of wide-eyed, unfamiliar faces near the back. "The eighth graders who haven’t even *smelled* the cafeteria mystery meat yet? Full votes? How’s that fair?"

  Principal Vance sighed. "The rule is clear, Ben. Anyone living under the ban for *at least* one year – a quarter of its duration – gets a proportional vote. They’ll endure it for four years. You, for one. Hence, quarter vote." The murmurs intensified. Fairness felt fractured.

  Then Priya Sharma, representing the fiercely independent Debate Club, stood. "Principal Vance, invoking Section 9: Opting Out. The Debate Club believes the ban will pass and severely curtail our research capabilities during tournaments. We declare ourselves *outside* the student body for the purposes of this vote. We retain access to buses, library, etc., but will not abide by the ban." She sat down, folding her arms. A collective gasp followed. A loophole, wide enough to drive a bus through.

  Chaos erupted. The Drama Club, fearing the ban would kill impromptu script lookups, immediately opted out. The Robotics Team, reliant on quick communication during builds, followed. The Art Club, worried about reference photos, hesitated but ultimately joined the exodus. Every departure shrank the "official" student body and subtly shifted the voting math towards the ban – the younger grades, facing four long phone-less years, were overwhelmingly pro-ban.

  "Hold on!" shouted Liam Chen, a sophomore. "If the Drama Club opted out, are they *still* part of the body deciding *who’s* opted out? Who verifies their claim on the shared goods?" A procedural abyss yawned open.

  A hasty vote was called to ratify the Drama Club's opt-out. But who could vote? Only those still *in* the body? But the body itself was now in question. A temporary "Membership Verification Committee" (MVC) was proposed.

  "Who appoints the MVC?" challenged Anya Petrova, a junior. "The current, contested body? Isn’t that circular?" Another vote was called to decide *who* could appoint the MVC. It passed narrowly, leaning on the younger grades' numerical advantage.

  The newly appointed MVC (three sophomores, two juniors, no seniors – deemed "too conflicted") ruled the Drama Club’s opt-out valid. But immediately, the Yearbook Staff objected: weren’t the MVC members themselves part of groups that *might* benefit from shrinking the anti-ban vote? Another challenge. Another vote to validate the MVC's validity. The gym descended into a recursive nightmare. Every attempt to fix the boundary of "the group" became a new vote, vulnerable to new challenges about *who* got to vote on *that*. The initial phone ban became a distant memory, buried under layers of meta-debate.

  I watched, my stomach churning. Mira Singh, Future Alumni Committee. Our committee was a joke, mostly planning reunions decades away. We had *zero* stake in the phone ban. Which is precisely why I’d argued, relentlessly, all week: "The *only* people who can neutrally decide who belongs are those with nothing to gain or lose from the *outcome* of the vote itself. The disinterested. Like us."

  My logic, born of late-night philosophy textbook readings on the Boundary Problem, felt chillingly abstract now. I’d envisioned us as benevolent arbiters, pure reason incarnate. Not pawns in this real-time procedural collapse.

  After the fourth vote on the validity of the third challenge to the second verification committee, Principal Vance, grey-faced, slammed his gavel. "ENOUGH! This regress ends. Mira Singh, you argued the disinterested should decide membership. Your Future Alumni Committee has minimal stake. The body votes *now*: Should the Future Alumni Committee have sole authority to determine the final, binding voter roll for Proposal 17?"

  Silence. The ultimate meta-vote. My own proposal, weaponized.

  The gym held its breath. Hands rose, dipped, were counted in the fractured, contested light. The "Ayes" – mostly younger students, trusting any system over chaos, or perhaps seeing novelty – and the "Nays" – seniors, opt-out groups fearing our neutrality was a myth, anyone suspicious of handing power to a non-entity – locked in a desperate struggle.

  The tally flickered on the screen:
  **Aye: 127**
  **Nay: 127**
  **Abstain: 3**

  A perfect, agonizing tie. Every eye swiveled to Principal Vance. He looked at the numbers, then slowly, deliberately, at me. His voice was hollow. "Ms. Singh. As the architect of this... principle... and as Chair of the Future Alumni Committee... the tie-breaking vote falls to you."

  The weight crushed me. The boundary I’d argued should be set by the disinterested now rested solely on *my* shoulders. My committee – *my* group – existed only to potentially solve this problem. A "Yes" vote empowered us, validated my theory, but also entrenched our authority. A "No" vote dissolved us back into irrelevance, leaving the boundary chaos unresolved, potentially dooming the entire process. My disinterest evaporated. My stake was total: the survival and legitimacy of my own proposed solution.

  The gym was utterly silent. The fluorescent lights hummed like judgment. I looked at Ben’s resentful scowl, Priya’s cool detachment, the eighth graders’ bewildered faces. I thought of the textbooks, the clean lines of theory smudged by the messy ink of human stakes. Before a group decides anything, it must decide *who* the group is. And that decision, I realized, freezing under the weight of the gavel’s expectant gaze, is never neutral. It’s always the first, and most decisive, vote. My hand trembled as I reached for the green "Aye" paddle. To decide who decides, I had to decide against my own disinterest. The boundary closed around me.
