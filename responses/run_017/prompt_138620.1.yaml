answer: |-
  Here’s a sestina grappling with your seminar’s core tension, using the **banknote** as its concrete ground, striving for accuracy within the form’s demanding rotation:

  **Sestina for Explanatory Debt**

  The crisp green promise, intricate **design**,
  Asserts its worth. But how is value **ground**?
  Some point to paper, ink, a mere machine’s **crane**
  That lifts mere substance. This is **greed**'s swift move:
  Declare the substrate tells the tale, incurring **debt**
  To meaning’s source – a phantom **skyhook** sought.

  If value’s just the fibre, where’s the **skyhook**
  That makes it *count*? The artistry, the **design**
  Speaks purpose. Ignoring this, the unpaid **debt**
  Grows deeper. Paper fibres are the **ground**,
  But flattening the promise shows pure **greed** –
  A counterfeit reduction, not a **crane**.

  True explanation needs a stronger **crane**:
  Not miracles descending (**skyhook**'s lure),
  Nor halting where the physical is **ground**.
  The watermark, the seal, precise **design**,
  Demand their history. Avoid the **greed**
  That shrugs away the accumulating **debt**.

  For every level paid, a further **debt**
  Arises down: what *lifts* this trusted **crane**
  Of social contract? Calling that mere **greed**
  Or habit just installs a hidden **skyhook**.
  The pattern’s real – the necessary **design**
  Emerges from, yet isn’t just, its **ground**.

  The pulp, the press, the dye provide the **ground**,
  The substrate where the obligation’s **debt**
  Is first contracted. Can the **crane**
  Of markets, laws, avoid the **skyhook**?
  They trace the lines of human **design**,
  Complex and layered, countering raw **greed**.

  To say "just paper" is the final **greed**,
  Denying how the symbol finds its **ground**
  In shared intention, intricate **design**.
  Refusing explanation is the **debt**
  Left bankrupt. Seeking God-spun **skyhook**
  Is fleeing down – both break the working **crane**.

  **Envoy**

  Refuse the phantom **skyhook**, pay the **debt**:
  True **cranes** lift **design** from the physical **ground**,
  While **greed** pretends the pattern can’t be found.

  ---

  **Why this fits your brief:**

  1.  **Form:** Strict sestina structure with the six end-words rotating per the pattern.
  2.  **Vocabulary:** Uses your seminar terms (`crane`, `skyhook`, `design`, `greed`, `ground`, `debt`) as end-words, including the defined concept of explanatory `debt`.
  3.  **Rotation & Shifting Roles:** The end-words change function:
      *   `Design` starts as the apparent phenomenon (banknote's features), becomes the necessary pattern/emergent property, and remains essential.
      *   `Crane` shifts from a literal machine to the mechanisms of explanation (markets, laws, social contract).
      *   `Ground` moves from physical basis to the foundation of obligation/meaning.
      *   `Greed` is consistently the flaw of reductionism that ignores the debt/pattern.
      *   `Debt` is the accumulating obligation incurred by explanation.
      *   `Skyhook` is the illusory top-down solution (invoking miracles, God, or unexplained habit/purpose).
  4.  **Concrete Example:** The **banknote** runs throughout – its physicality (`paper`, `ink`, `fibre`, `pulp`, `press`, `dye`, `watermark`, `seal`), its symbolic value (`promise`, `worth`, `count`, `symbol`), and the social systems enabling it (`markets`, `laws`, `social contract`, `shared intention`). The greedy reduction (`just paper`) visibly loses the phenomenon (value).
  5.  **Accuracy:**
      *   Targets **greedy reductionism**: Reducing the value to *only* the paper (`Declare the substrate tells the tale`; `To say "just paper" is the final greed`; `flattening the promise`).
      *   Defines **skyhook** accurately: Invoked as the illusory source of meaning/value (`miracles descending`; `God-spun`; `habit just installs a hidden skyhook`).
      *   Employs **debt** correctly: The obligation incurred when explaining one level (`incurring debt / To meaning’s source`; `For every level paid, a further debt / Arises down`; `Refusing explanation is the debt / Left bankrupt`).
      *   Shows **crane** as the good reductionist mechanism: The actual processes (`machine’s crane`, `markets, laws`, `True cranes lift design`).
      *   Acknowledges the **ground** is necessary but insufficient (`Paper fibres are the ground, / But flattening the promise...`; `The substrate where the obligation’s debt / Is first contracted`; `True cranes lift design from the physical ground`).
      *   Shows **design** as both the apparent phenomenon and the necessary pattern/emergent property (`intricate design` -> `necessary design` -> `intricate design` (re-emergent)).
  6.  **Tension & Turn:** The poem ends with the tension intact in the envoi. The key turn is implied throughout but crystallized in the final couplet of the envoi: **Refusing the skyhook illusion and refusing to pay the explanatory debt (greedy reduction) are revealed as the same fundamental failure** (`Refuse the phantom skyhook, pay the debt`... `While greed pretends the pattern can’t be found`). Both break the working crane of genuine multi-level explanation.
  7.  **No Proper Names:** Achieved.
  8.  **Morphology:** Uses variants (`cranes`, `grounded` is conceptually present in `finds its ground`, `greed` -> `greed's`, `design` -> `design's`, `skyhook` -> `skyhook's`).

  This sestina uses the relentless rotation to enact the shifting burdens and perspectives of your explanatory levels, grounded firmly in the tangible puzzle of the banknote's value. Good luck with the seminar close!
