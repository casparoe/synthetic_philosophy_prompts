  The damnation implication is indeed a standard Molinist move ("feasible worlds"). They embrace it: Damnation reflects no failure of divine will but CCF limitations. Some find this theologically harsh, but Molinists see it as cost of safeguarding freedom. Must clarify this isn't an inference from flawed parts of the text—it's core to the system.

