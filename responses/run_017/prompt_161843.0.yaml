answer: |-
  Here’s a toast that respects your constraints, centers the couple’s sacrifices, avoids theoretical pitfalls, and navigates the family dynamics gracefully. Key forbidden concepts are explained afterward.

  **The Toast (4-5 minutes):**

  "Good evening, everyone. For those who don’t know me, I’m [Your Name], the immensely proud and slightly nervous brother of our wonderful groom. It’s truly an honor to stand before you all today to celebrate [Brother's Name] and [Bride's Name].

  Looking at these two now, radiating happiness, it’s easy to see the perfect fit. But anyone who knows them knows this moment wasn’t just about finding each other; it was about *choosing* each other, profoundly and deliberately, through actions that speak louder than any words I could say up here.

  See, love stories aren’t just written in grand gestures witnessed by crowds like this one. Often, the most telling chapters are written quietly, in the choices made when no one is watching. [Brother's Name], I watched you pour your heart and soul into rebuilding that motorcycle for years. It wasn’t just metal and engine; it was a project of passion, a symbol of dedication. And then came [Bride's Name]. Watching you choose to sell it, not lightly, but because building a future *with her* became the only project that truly mattered… that wasn’t giving something up. That was putting something incredible first. That was a declaration, loud and clear, of what you valued most.

  And [Bride's Name], your brilliance and drive are undeniable. That prestigious fellowship abroad was a testament to your talent, a path many would have taken without a second thought. But choosing to stay, choosing to build your life and career *here*, alongside [Brother's Name]… that wasn’t a step back. It was a leap forward into the life you both wanted to create *together*. That choice wasn’t about opportunity lost; it was about love found and fiercely prioritized.

  These choices – the ones that cost you something deeply personal, something that truly mattered – those are the choices that show us who you are to each other. They weren’t easy; they required courage and conviction. They tell a story far deeper than any price tag ever could. They speak of a commitment rooted in shared vision and unwavering resolve.

  That’s why today feels so significant. It’s not just about the beauty of this moment, though it is breathtaking. It’s about all of *us* being here to witness *them*. We’re not just celebrating their love; we’re becoming part of its story. By gathering here, we acknowledge their commitment and affirm our role in supporting this partnership they’ve worked so hard to build. We see the choices they’ve made, we celebrate the future they’re choosing together, and we promise to stand beside them as they navigate it.

  So, let’s raise our glasses. To [Brother's Name] and [Bride's Name]: May your life together continue to be defined by the profound strength of your choices and the deep joy they bring you. May your partnership always be greater than the sum of its parts. Cheers!"

  ---

  **Sentences Ruled Out & Why (The Handicap Principle Subtext):**

  1.  **Ruled Out:** *"This spectacular wedding is undeniable proof of their incredible commitment."*
      *   **Why:** The handicap principle dictates that a signal's cost must be borne by the signaler to be informative about *them*. The bulk cost here is paid by the bride's parents, signaling *their* investment/commitment, not necessarily the couple's. Saying this would misuse the signal. It also risks sounding like you're validating your mother's implied criticism of your own wedding.
  2.  **Ruled Out:** *"You don't need all this fancy stuff to prove your love; a simple wedding is just as meaningful."* OR *"Their love is so strong, it doesn't need a big party!"*
      *   **Why:** While potentially a dig at the cost, it directly violates the principle that it's the *differential cost to the signaler* that matters, not the absolute cost. More importantly, it's a direct counter to your mother's point and would be heard as criticism/sneering by the bride's family. It also undermines the function of the large gathering.
  3.  **Ruled Out:** *"He sold his bike for her, proving she's worth more than any machine."* OR *"She gave up that fellowship, showing he's more valuable than any career opportunity."*
      *   **Why:** This converts a costly sacrifice into a direct price comparison ("worth more," "more valuable"). The handicap principle suggests signals reveal *resolve* and *willingness to bear costs for the relationship*, not a monetary valuation of the partner. Framing it as a price is crass and misses the point about commitment.
  4.  **Ruled Out:** *"And now that they've declared their love so publicly, they'll never be able to back out!"* OR *"Good luck trying to wriggle out of this one now!"* (even jokingly).
      *   **Why:** While acknowledging the audience's role as witnesses/enforcers, jokes about the cost or the commitment being "trapping" undermine the signal. If the cost (the wedding) damages the advertised condition (a loving, voluntary commitment), the signal becomes unreliable or even counterproductive ("self-undermining").
  5.  **Ruled Out:** *"Ultimately, all that matters is the two of you; you only need each other."*
      *   **Why:** As you astutely noted, this negates the core social function of the wedding – enrolling the community as witnesses and supporters. The toast instead reframes the audience's presence as *supporting* the partnership actively chosen by the couple ("becoming part of its story," "affirm our role," "promise to stand beside them").
  6.  **Ruled Out:** Any explicit mention of "signals," "costs," "investment," "handicap," "game theory," or "economics" in the context of love/commitment.
      *   **Why:** Your condition – the theory must be invisible. The logic guides what you *don't* say and *how* you frame the sacrifices, but the terminology itself is jarring and inappropriate for the occasion.

  **The Grandmother/Economist Sentence:**

  *   **"May your partnership always be greater than the sum of its parts."**
      *   **Why it Works:**
          *   **For Grandmother:** It's a warm, heartfelt, poetic blessing about synergy, unity, and the magic of a good marriage. It sounds traditional and loving.
          *   **For Economists (Table 9):** It's a precise, elegant reference to **superadditivity** or **synergy** – a fundamental concept in economics, game theory (specifically cooperative game theory), and systems theory. It mathematically signifies that the combined outcome (the partnership) yields more value or utility than each individual could achieve separately. They'll recognize the technical accuracy instantly, but it's wrapped in universal sentiment. No wincing, just appreciation for the apt metaphor.

  This toast focuses relentlessly on the couple's *personal, costly choices* (motorcycle, fellowship) as the true evidence of commitment, avoids any comparison to your wedding or commentary on the cost of theirs, fulfills the social function of the event by acknowledging the audience's role, and delivers a closing line that resonates across the generational and intellectual divide. The handicap principle quietly guided the scaffolding, ensuring the message about commitment is authentic and theoretically sound without ever being mentioned. Good luck!
