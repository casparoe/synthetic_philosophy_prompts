  ### **Classificatory Tree**  
  *Nodes split views by a single claim. Sibling nodes are mutually exclusive.*  
  ```mermaid
  graph TD
  Root[Diagnosis is...] --> N1[Pattern exists pre-label?]
  N1 -->|Yes| N2[Label changes the pattern?]
  N1 -->|No| N3[Label creates the pattern?]
  N2 -->|No| Leaf1[Discovery Realism]
  N2 -->|Yes| N4[Primary looping mechanism?]
  N4 -->|Self| Leaf2[Self-Looping Constructivism]
  N4 -->|Others| Leaf3[Social-Looping Constructivism]
  N4 -->|Institutions| Leaf5[Institutional Constructivism]
  N3 -->|Yes| Leaf2_or_Leaf3_or_Leaf5[Loops via self/others/institutions] 
  N3 -->|No| Leaf6[Administrative Skepticism]
  Root --> N5[Label is practical tool?]
  N5 -->|Yes| N6[Success = dissolution?]
  N5 -->|No| N3
  N6 -->|Yes| Leaf4[Instrumental Loop-Wager]
  N6 -->|No| Leaf7[Prevalence Neutrality]
  ```

  - **Leaf 4 (your view)** is a sibling to Leaf 7 under the node *"Success = dissolution?"*. It requires: (1) instrumental value, (2) built-in retirement.  
  - **Empty Cell**: *"Label creates pattern but has no looping mechanism"* (e.g., magic). Incoherent—creation requires a mechanism.  
  - **Indistinguishable Pair**: Leaf 2 (Self-Loop) and Leaf 3 (Social-Loop) may overlap in answers (Q5-B, Q7-B). The test forces a distinction via Q2, but real views may blend them.  

  ---

  ### **Closing Notes**  
  **What this test CANNOT tell you**:  
  - Whether *your specific diagnosis* was "correct." This test maps *philosophical beliefs*, not clinical validity.  
  - Which view is "true." It clarifies assumptions but doesn’t resolve the argument.  
  - How institutions *should* use diagnoses. It describes, not prescribes.  

  **Why Leaf 4 fits your "wager" view**: It explicitly ties diagnosis to *provisional use* (Q4-C, Q10-C, Q11-C), with looping mechanisms (e.g., Q2-A/B for self/social loops) and dissolution as success. It "retires" when the loop is broken or resources are secured.  

  **Recommendation**: Pair this test with discussion prompts (e.g., *"How might your view shape your use of a diagnosis?"*). This builds "something better than the argument" by fostering metacognition, not consensus.
