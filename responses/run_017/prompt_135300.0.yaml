  The proposal needs to surgically isolate this gap: existing decision theories (CDT/EDT/FDT) only address endpoints (ρ=0 or ρ=1), leaving no guidance for partial correlation. Their idea—parameterizing correlation strength (ρ) and payoff dilution ("lure")—is clever, but risks scope creep. Supervisor's right: this could balloon into 3 papers. Key is to frame it as a *sensitivity analysis*, not new theory.  

  For structure: First, hammer why the status quo fails—FDT's silence on "mostly similar" agents is a glaring hole. Then define the two-pronged model: (1) Vary ρ (correlation strength) between "logical" and "common cause" variants, noting they diverge at ρ<1. (2) Test payoff structures: winner-takes-all vs. diluted pots. Method must avoid behavioral experiments (too noisy) or axiom-building (too vast). Instead, mathematical exploration of symmetric equilibria across parameters, with simulations for N>2 cases.  

  Deliverables matter: A typology of phase transitions (e.g., cooperation collapsing below ρ_crit) would be sexy; finding smooth interpolation would be valid but dull. Failure modes: If results reduce to standard correlated equilibrium, the project adds nothing. Or if dilution makes cooperation mathematically impossible—ironically proving Hofstadter's point useless for real collective action.  

  Scope realism is crucial. Emphasize Year 1 will only tackle the ρ-variation with fixed payoffs; lure parameter gets deferred. Timeline should show quarterly milestones: Months 1-3 for base models, 4-6 for logical/common-cause split, 7-9 for N>2, 10-12 for write-up. Caveat that lure/payoff dilution is future work.  

  Panel will care about conceptual payoff: Does this reveal FDT as brittle? Does it force game theory to absorb logical uncertainty? The "so what" must sting: If superrational cooperation *only* works under perfect clone-like correlation, it's philosophically dead for practical ethics. That’s provocative enough for a fellowship.
answer: |-
  ## Research Proposal: The Fragility of Superrational Cooperation Under Imperfect Correlation

  **Project Title:** Parameterizing Superrationality: Robustness of Cooperation Under Partial Policy Correlation and Payoff Dilution  

  **Research Question:**  
  *Does superrational cooperation (à la Hofstadter) persist under imperfect correlation between agents' decision processes, and how is it affected by the dilution of cooperative payoffs? Specifically:*  
  1.  **Correlation Robustness:** In symmetric games where other players' actions are probabilistically correlated with one's own policy (with strength ρ < 1), does the superrational equilibrium policy change continuously as ρ decreases from 1 (perfect correlation) to 0 (independence)? Is there a critical threshold ρ_c below which cooperation collapses?  
  2.  **Payoff Dilution Impact:** How does the structure of the cooperative payoff (e.g., winner-takes-all vs. pot-splitting) interact with ρ to determine the viability and form of superrational cooperation?  

  **The Gap in Existing Literature:**  
  Current decision theories provide clear answers only at the endpoints of correlation, leaving the practically relevant middle ground unaddressed:  
  *   **Causal Decision Theory (CDT):** At ρ=0 (independence), prescribes defection/entry (grab the prize) as dominant, leading to collective failure.  
  *   **Functional Decision Theory (FDT) & Superrationality:** At ρ=1 (identical computations), prescribe stochastic cooperation (enter with p ≈ 1/N) for Platonia, yielding ~37% success.  
  *   **Evidential Decision Theory (EDT):** Struggles with acausal correlation conceptually and often prescribes suboptimal cooperation even when irrelevant.  
  *   **Correlated Equilibrium (Game Theory):** Requires an explicit correlating device; it does not address agents reasoning *about* the logical/physical similarity of their decision processes themselves (the core of superrationality).  
  **The critical void:** *None* of these frameworks provide guidance for the realistic case where agents' decision processes are highly similar but not identical (0 < ρ < 1), nor do they systematically analyze how payoff structure interacts with this similarity. The standard Platonia model is a singularity; we lack a theory of its neighborhood.  

  **Methodology: Sensitivity Analysis via Parameterized Game Families**  
  This project will rigorously explore the gap using mathematical modeling and simulation, avoiding pitfalls of behavioral studies or axiomatic reconstruction:  
  1.  **Game Family Definition:**  
      *   **Base Game (Platonia Variant):** N symmetric players. Payoff: Large reward R if *exactly one* player "Enters", else 0.  
      *   **Correlation Parameter (ρ):**  
          *   *Variant L (Logical Correlation):* With probability ρ, player j uses the *identical deterministic policy function* as player i (implying their outputs are logically dependent). With probability (1-ρ), player j uses an independent policy (output independent).  
          *   *Variant C (Common Cause Correlation):* With probability ρ, player j's action is perfectly correlated with player i's action via a common cause (screening off i's decision). With probability (1-ρ), actions are independent.  
      *   **Payoff Structure Parameter (Lure - λ):**  
          *   *Winner-Takes-All (λ=0):* R awarded to one randomly chosen entrant *only if exactly one enters*. (Standard Platonia).  
          *   *Diluted Pot (λ>0):*  
              *   *Split:* Total Pot R split equally among *all* entrants (if any enter).  
              *   *Lump:* Total Pot R awarded to one randomly chosen entrant (if any enter).  
          *(λ effectively controls the penalty for multiple cooperation/entry).*  
  2.  **Solution Concept:** Symmetric, *Superrational-Compatible Equilibrium*. Agents choose a policy (e.g., probability p of Entering) assuming all others are using the *same* policy, while accounting for the probabilistic correlation structure (ρ) and payoff dilution (λ).  
  3.  **Analysis:**  
      *   Derive the expected utility function for a player using policy p, assuming all others use policy p, under correlation model (L or C) and payoff structure.  
      *   For fixed N, ρ, λ, and model (L/C), find fixed points p* that maximize expected utility under the symmetric assumption (i.e., solve U(p, p, ρ, λ, N) w.r.t p).  
      *   **Key Techniques:** Fixed-point analysis, optimization under uncertainty, Monte Carlo simulation for larger N or complex payoff structures where analytical solutions are intractable.  
  4.  **Comparison Points:** Characterize the equilibrium policy p* as a function of ρ (for fixed λ, N) and λ (for fixed ρ, N). Compare results between Variant L and Variant C.  

  **Why this method?**  
  *   **Directly Addresses the Gap:** Parameterization explicitly models the "in-between" state missing in endpoint theories.  
  *   **Builds on Existing Theory:** Leverages the clear superrational solution (p=1/N) at ρ=1, λ=0 as an anchor. Uses standard game-theoretic/decision-theoretic equilibrium concepts extended with the correlation parameter.  
  *   **Feasibility:** Focuses on mathematical exploration of well-defined models, avoiding the intractability of axiomatic innovation or the confounds of behavioral experiments.  
  *   **Clarity of Interpretation:** Results will directly show the sensitivity of cooperation to the key parameters ρ and λ.  

  **Expected Deliverables & Outcomes:**  
  1.  **A Formal Framework:** A rigorously defined family of games parameterizing correlation strength (ρ) and payoff dilution (λ).  
  2.  **Characterization of Equilibrium Policies:** Analytical expressions or numerical results for p*(ρ, λ, N) under Variants L and C.  
  3.  **Key Insights on Robustness & Fragility:**  
      *   Does p* decrease continuously as ρ decreases from 1, or is there a sharp threshold ρ_c below which p* collapses to 0 (pure defection)?  
      *   Does Variant L (logical) yield meaningfully different results than Variant C (common cause) for ρ < 1?  
      *   Under diluted payoffs (λ>0), does a viable symmetric superrational equilibrium (p* > 0) exist? Or is the optimum only approached as p → 0 (implying indeterminacy)? How does λ interact with ρ?  
  4.  **Interpretation:** A clear assessment of the practical applicability of superrational reasoning. Does it offer distinct, robust guidance outside the idealized ρ=1, λ=0 case, or is its domain vanishingly small?  

  **Defining Success and Failure:**  
  *   **Strong Success:** Discovery of non-trivial thresholds (ρ_c) or phase transitions in p*, demonstrating the fragility or robustness of superrational cooperation. Significant divergence between Variant L and C results. Demonstration that payoff dilution (λ>0) fundamentally undermines the standard superrational prescription.  
  *   **Moderate Success:** Clear quantification of how p* degrades with decreasing ρ and increasing λ, even if continuously. Demonstration that Variant L and C yield similar practical results. Confirmation that the ρ=1 solution is indeed a special case.  
  *   **Failure (Project still informative):**  
      *   Results reduce entirely to standard correlated equilibrium findings with no new insight specific to logical correlation/superrationality.  
      *   Equilibrium behavior is boringly linear/predictable across ρ and λ (e.g., p* = ρ/N).  
      *   Payoff dilution (λ>0) makes symmetric superrational cooperation mathematically impossible or pathological for all ρ < 1.  
      *   The models prove technically intractable within the timeframe.  

  **Scope Realism & 12-Month Plan:**  
  *   **Acknowledged Scope Limits:** This is ambitious. Supervisor is right; full exploration of L vs. C, varying N, *and* multiple λ structures could span multiple papers.  
  *   **Focused Year 1 Scope:** Prioritize the core question of **correlation robustness (ρ)** for the **Winner-Takes-All (λ=0)** Platonia structure, for manageable N (2, 3, then larger via sim). *Explicitly defer* comprehensive analysis of payoff dilution (λ) and exhaustive L vs. C differences for future work.  
  *   **Proposed 12-Month Timeline:**  
      *   **Months 1-3:** Formalize models (Variant L & C, λ=0). Derive analytical solutions for N=2 case under both variants.  
      *   **Months 4-6:** Extend analysis to N=3 (analytical where possible, simulation otherwise). Characterize p* vs ρ curves. Begin comparing L vs. C results.  
      *   **Months 7-9:** Develop efficient simulation for larger N (e.g., 10, 100). Investigate scaling of ρ_c (if exists) or degradation pattern with N. *Begin preliminary exploration* of one Diluted Pot structure (e.g., Split) for N=2, ρ=1 (link to existing superrationality claim).  
      *   **Months 10-12:** Consolidate results. Formalize findings on robustness/fragility. Draft paper on correlation robustness (ρ) for λ=0. Outline next steps (dilution λ, L/C differences, applications).  

  **Conclusion:**  
  The idealized superrational solution to collective action problems rests on an assumption of perfect logical correlation (ρ=1) within a specific winner-takes-all payoff structure (λ=0). This project asks: How special is this case? By developing and analyzing a parameterized family of games, it will rigorously assess the robustness of superrational cooperation under the more realistic conditions of imperfect correlation (ρ < 1) and diluted payoffs (λ > 0). The results will determine whether superrationality offers a distinct, practical guide for cooperation, or if its domain of applicability is vanishingly narrow. This sensitivity analysis is a crucial, missing step in evaluating the real-world significance of functional and superrational decision theories.
