prompt: |-
  Most scientists seem to treat it as a hard requirement on any successor theory that it give back the old theory's results in the region where the old theory worked — general relativity has to hand you Newtonian gravity in the slow, weak-field limit, quantum results have to shade into classical ones when things get big, and a referee will bounce a proposal that can't show the limit coming out. What does that practice presuppose? On it's face it looks like it needs two things: some theory-neutral way of saying what the old theory's successes even were, so that both theories can be scored against the same phenomena, and enough continuity in what the words mean that reproducing the old predictions is a well-defined ask. But if the meanings shift when the paradigm shifts, I can't see what the ask is an ask about — and yet scientists keep making it and it seems to work fine in practice.

  Two wrinkles I want dealt with. First, recovery might just be a feature of one kind of transition rather than a requirement on all of them: in some episodes the old theory's central quantity gets deleted rather than recovered — phlogiston, the luminiferous ether — and nobody thinks that makes the replacement any less of an improvement. Second, imagine a field that swaps its mechanistic theory for a big fitted predictor that matches every old prediction to within noise but shares no vocabulary and no mechanism with it; it recovers the successes on the test above while explaining nothing, and I doubt that's what scientists think they're demanding.

  So: reconstruct the implicit view of theories, meaning and progress that the recovery requirement fits with. Tell me which parts are strictly presupposed by the practice and which would sit just as happily under Kuhn-style meaning variance or under something more like structural realism. Say whether the practice is consistent with itself, given that the same textbooks call the old theory straightforwardly false, go on using it, and teach it to undergraduates before the new one. And say what would concretely have to change in peer review and in how we teach science if the requirement were dropped, or if incommensurability were taken seriously enough to act on.
reasoning: |-
  Okay, the user is diving deep into the philosophy of science, specifically the requirement that new theories must recover the successes of old ones in their applicable domains. They're questioning what this practice presupposes about theories, meaning, and progress. They also bring up two wrinkles: cases where old concepts are discarded (like phlogiston) and scenarios where a new theory fits data without explaining mechanisms.

  First, I need to address their main concern: what does the recovery requirement assume? They mention theory-neutral phenomena and continuity in meaning. But they're worried about Kuhn's meaning variance—if meanings change during paradigm shifts, how can we even compare theories? Yet scientists do this successfully, which seems paradoxical.

  The user wants a reconstruction of the implicit view behind this practice. They also want to know which parts are essential and which could coexist with Kuhn or structural realism. Plus, they're curious about consistency—textbooks call old theories false but still teach them. Finally, they ask about the practical implications if this requirement were dropped or if incommensurability were taken seriously.

  Hmm, I should start by outlining the presuppositions. The practice likely assumes a form of convergent realism: the world has a stable structure, and theories approximate it. Successes aren't just predictions but reflect reality. Continuity in reference, even with meaning shifts, is key. For example, "mass" in Newton vs. Einstein has different meanings but refers to the same phenomenon in low velocities.

  The two wrinkles need careful handling. Cases like phlogiston show that some concepts are abandoned, but the phenomena (combustion) remain. So recovery isn't about every entity but about empirical successes. The predictor example is trickier—fitting data without explanation might meet the letter but not the spirit of the requirement, which includes explanatory depth.

  For the implicit view, it's a mix of referential continuity and hierarchical emergence. Structural realism fits well here, as structures (equations) are preserved. Kuhn's meaning variance can be accommodated if there's enough referential overlap to compare predictions. Textbooks teaching old theories make sense as approximations, useful in certain domains.

  If the requirement were dropped, peer review might accept theories based on novel predictions without recovering old successes, risking disconnected theories. Teaching might skip historical context, losing the sense of cumulative progress. Acting on incommensurability could lead to isolated research programs and fragmented education.

  I need to ensure I cover all parts: presuppositions, compatibility with philosophical views, consistency in textbooks, and practical changes. The user seems well-versed in philosophy of science, so avoiding oversimplification is crucial. They might be seeking validation of their skepticism or a deeper understanding of how science maintains continuity despite paradigm shifts.
answer: |-
  Here's a reconstruction of the implicit view embedded in the "recovery requirement," addressing your questions and wrinkles:

  **The Implicit View Presupposed by the Recovery Requirement:**

  1.  **Convergent Realism:** The practice presupposes a *broadly* realist outlook. It assumes:
      *   **A Stable, Structured World:** There's a mind-independent reality with stable causal structures and regularities.
      *   **Progressive Approximation:** Scientific theories are increasingly accurate (though incomplete) maps of this reality. Successes of old theories aren't mere lucky guesses or social constructs; they capture *something real* about the domain where they worked.
      *   **Domain-Specific Truth/Ontology:** While the old theory may be "false" globally or fundamentally, it is *approximately true* or *structurally adequate* within its empirically established domain of applicability. Its equations and key entities (like "force," "mass," "gene") successfully refer to *some aspect* of reality *within that domain*, even if their fundamental nature is revised.

  2.  **Referential Continuity (Despite Meaning Variance):** The practice *does not* require strict meaning invariance. It presupposes **partial referential continuity** or **continuity of empirical content**.
      *   **Phenomena vs. Ontology:** There's a distinction between the *phenomena* successfully described/predicted (e.g., planetary orbits, spectral lines, falling apples) and the *theoretical ontology/mechanisms* used to explain them (e.g., Newtonian forces vs. curved spacetime; caloric vs. kinetic theory).
      *   **Scoring Against Phenomena:** The "theory-neutral way" of scoring is precisely the **stable set of empirical phenomena** the old theory handled well. These phenomena are considered data points *about the world*, not artifacts *of the theory*. Both theories must account for these phenomena. The "ask" is defined by this shared empirical benchmark.
      *   **Reference Preservation (Often Partial):** While the *meaning* (theoretical role, fundamental nature) of key terms may shift radically (e.g., "mass," "gene," "electron"), the *reference* (what the term picks out in the world) often shows significant overlap *within the old domain*. Newtonian "mass" (inertial/gravitational) and relativistic "mass" (rest mass, relativistic mass) refer to the same core property of objects *in low-energy regimes*, even though their theoretical embedding and high-energy behavior differ fundamentally. The recovery requirement demands that the new theory *must* have *something* that maps onto this stable referent in the old domain and produces the same empirical results.

  3.  **Hierarchical Emergence (or Domain Decomposition):** It presupposes that the world has different levels of description/behavior, and theories are often valid at specific scales or energy regimes.
      *   The new theory is seen as more fundamental, encompassing a wider domain. The old theory emerges *as an approximation* from the new one under specific limiting conditions (low speed, weak gravity, large quantum numbers). This emergence justifies both the recovery *and* the eventual falsity of the old theory globally.

  4.  **Progress as Explanatory Unification & Deepening:** Recovery isn't just about fitting old data. It's about *integrating* the old successes into a *deeper, broader, and more unified* explanatory framework. The new theory must not only recover the old successes but also:
      *   Explain *why* the old theory worked where it did (the limiting case derivation).
      *   Explain phenomena the old theory couldn't (novel predictions).
      *   Resolve internal inconsistencies or conceptual problems in the old theory.
      *   Provide a more fundamental ontology or mechanism (though this mechanism may be very different).

  **Addressing the Wrinkles & Philosophical Compatibility:**

  1.  **Phlogiston/Ether vs. Recovery:**
      *   **Phenomena Preservation:** The key is that the *phenomena* explained by phlogiston (combustion, calcination) or ether (light propagation) are preserved and *better explained* by the new theory (oxygen, EM fields in vacuum). The *empirical successes* (e.g., specific weight changes in calcination, stellar aberration) are recovered/explained.
      *   **Ontological Revision, Not Simple Deletion:** The central quantities weren't simply "deleted." They were *replaced* by fundamentally different ontologies (oxygen, electromagnetic fields) that accounted for the same phenomena *and more*. The *phenomena* remain the benchmark; the *theoretical entities* are revised or replaced. Recovery applies to the phenomena, not necessarily the specific ontology.

  2.  **The Fitted Predictor Problem:**
      *   **Exposes the Presuppositions:** This scenario highlights that the recovery requirement *isn't* just about fitting past data points. Scientists implicitly demand **explanatory adequacy** and **potential for novel prediction/unification**.
      *   **Why it Fails:** A pure predictor lacks:
          *   **Explanatory Depth:** It doesn't explain *why* the patterns exist.
          *   **Understanding:** It provides no conceptual grasp of mechanisms.
          *   **Unification:** It doesn't connect the phenomena to other domains or fundamental principles.
          *   **Novelty:** Its ability to predict genuinely new phenomena is suspect without an underlying causal model.
      *   **Implied Demand:** The practice presupposes that recovery must be achieved *through a deeper explanatory framework*, not just curve-fitting. The limiting derivation *is* an explanation of why the old theory worked.

  **Compatibility with Philosophical Views:**

  *   **Convergent Realism (e.g., Structural Realism):** Fits perfectly. Structural Realism explicitly argues that what is preserved across theory change is the *mathematical structure* describing relations between phenomena (or unobservables). This directly supports the recovery requirement: the equations of the old theory emerge as limiting cases of the new theory's structure. Ontologies change, but the web of relations (capturing phenomena) is retained and embedded in a wider structure.
  *   **Kuhnian Meaning Variance (Incommensurability):** **Compatible *in practice* but requires nuance.** Kuhn himself acknowledged that scientists *do* compare theories across revolutions using shared problems, values (accuracy, scope), and crucially, **local translation manuals**.
      *   **Partial Commensurability:** While global meaning holism makes strict point-by-point comparison impossible, *within the specific domain* of the old theory's success, scientists establish enough local correspondence (via shared phenomena, operational definitions, instrumental success) to define the "ask" of recovery. The phenomena provide the anchor.
      *   **What Kuhn Challenges:** He challenges the idea of a *single, theory-neutral observation language* for *all* concepts and the idea that *every* term must have a referent in the new theory. The practice accepts that *some* concepts (phlogiston) lack referents and that meanings shift, but insists that the *empirical consequences* in the established domain *must* be reproducible. Kuhn might argue this is a pragmatic, post-hoc rationalization, but the practice *works* pragmatically even under meaning variance because of the shared phenomenal basis.
  *   **Strict Presuppositions vs. Happy Fits:**
      *   **Strictly Presupposed:** (1) Stable phenomena as benchmark, (2) Requirement that new theory reproduce old empirical successes *within the old domain*, (3) Belief that this recovery indicates progress (integration, deeper explanation).
      *   **Can Sit Happily With:** (1) Meaning variance (via local commensurability on phenomena), (2) Structural Realism (as the mechanism for recovery), (3) Moderate realism (approximate truth in domain), (4) Even some pragmatic/instrumentalist views (if they value predictive power and problem-solving integration).

  **Consistency with Textbook Practice:**

  The practice *is* consistent within the implicit hierarchical/emergent view:
  1.  **"False" Globally:** The old theory is fundamentally incorrect as a universal description of reality (e.g., Newtonian gravity fails near black holes/mercury).
  2.  **"Useful/Approximately True" Locally:** Within its well-defined domain (slow speeds, weak fields), its predictions are incredibly accurate and its equations are much simpler than the full new theory.
  3.  **Pedagogical Necessity:** Teaching the simpler, domain-appropriate theory first provides conceptual footholds, builds intuition, and is practically sufficient for vast swathes of engineering and science. Learning GR before Newtonian mechanics would be pedagogically disastrous.
  4.  **Historical Context:** Teaching the old theory shows the path of scientific progress and the reasons for developing the new one.

  **Consequences of Dropping the Requirement or Acting on Incommensurability:**

  *   **Dropping the Recovery Requirement:**
      *   **Peer Review:** Could accept theories that make novel predictions in *new* domains but completely fail or contradict well-established results in *old* domains without explanation. Risk of proliferating disconnected, mutually incompatible theories. Reviewers would lack a key criterion for judging adequacy and integration.
      *   **Teaching:** Could jump straight to the most fundamental theory, ignoring historically important but "false" models. This would likely hinder understanding (too complex initially) and obscure the historical context of discovery and the nature of domain-specific approximation. Domain-specific models (e.g., fluid dynamics, circuit theory) might be seen as illegitimate rather than valuable approximations.
      *   **Result:** Fragmentation of science, loss of cumulative progress, potential disregard for robust empirical knowledge, greater difficulty in theory evaluation.

  *   **Taking Incommensurability Seriously (Acting on It):**
      *   **Peer Review:** Might reject *any* direct comparison between theories from different paradigms as meaningless. Focus could shift entirely to solving puzzles *within* a paradigm or to purely aesthetic/pragmatic/social criteria for theory choice. Progress becomes harder to define objectively. Recovery derivations might be dismissed as linguistic tricks masking fundamental discontinuity.
      *   **Teaching:** Paradigms would be taught as largely isolated conceptual systems. Emphasis might shift to the social/historical context of each paradigm rather than portraying a continuous line of increasingly fundamental understanding. The idea of "building upon" past successes would be downplayed in favor of revolutionary replacement.
      *   **Result:** Potential Balkanization of fields into competing schools with no shared criteria for progress, diminished sense of cumulative scientific achievement, greater focus on sociological factors over empirical adequacy and explanatory power as drivers of theory acceptance.

  **In essence:** The recovery requirement presupposes a stable world whose structure is progressively uncovered, with scientific progress marked by theories that embed the empirically successful aspects of their predecessors within deeper, broader explanatory frameworks, while revising or replacing the underlying ontology. It navigates meaning variance by anchoring comparison in stable phenomena and demanding local empirical equivalence within the old domain. While challenged by extreme philosophical positions, it reflects a pragmatic, realist-leaning epistemology that has proven remarkably effective in guiding scientific progress and pedagogy.
