answer: |-
  ## Plan

  1.  **The Sacrificial Lamb:** Conservator destroys the crated piece secretly, believing preserving the *appearance* of continuity is paramount. The gallery piece is reinstalled. The heir's claim is dismissed as irrelevant since "the" work is back on the wall. The conservator lives with quiet dread. *Problem:* Underplays the heir's claim and the ontological question; resolves too neatly by eliminating one object.
  2.  **The Defiant Disclosure:** Conservator leaks the duplication to the media. Public debate erupts. The museum is forced to display both, labeled "Version A" and "Version B." The heir's restitution claim becomes mired in legal chaos. The conservator resigns. *Problem:* Shifts focus to spectacle and public reaction, potentially diluting the core philosophical tension about identity and value.
  3.  **The Caretaker's Paralysis:** Focuses intensely on the conservator's crisis. They cannot bring themselves to destroy either piece or sign the condition report affirming the gallery piece as "the" work. The director proceeds with the rededication using the gallery piece, but the conservator leaves the condition report unsigned, a silent protest. The crated piece remains, an open secret burdening the institution. *Strengths:* Isolates the "wrinkle" perfectly. It centers the agony of the person whose job *is* to certify continuity when that continuity is shattered. The heir's claim remains potent (they know both exist, demand both), the museum's action is exposed as arbitrary, and the indeterminacy persists powerfully in the conservator's inaction and the unsigned report. The question of "which one" becomes meaningless precisely *because* the institutional act of choosing one is shown to be hollow, yet the *need* to choose (for the heir, for the museum) remains undeniable and unresolved.
  4.  **The Heir's Gambit:** Conservator secretly contacts the heir. They arrange for the heir to "steal" the crated piece during the chaos of the rededication, leaving the gallery piece. The heir gets an object they believe has *some* claim, the museum keeps "the" work, the conservator avoids destroying anything. *Problem:* Leans into conspiracy, potentially romanticizes the heir, and resolves the physical tension by distributing the objects without confronting the core identity crisis head-on.

  **Chosen Approach:** **#3, The Caretaker's Paralysis.** It most effectively isolates the specific wrinkle: the collision between institutional necessity, legal/philosophical claims about identity and originality, and the individual tasked with operationalizing authenticity when the ground has vanished. It forces the philosophical tension into the intimate, professional crisis of the conservator, making the indeterminacy viscerally felt through their inability to perform their fundamental duty. The heir's unresolved claim and the museum's arbitrary choice hang over the ending, ensuring the questions remain live and sharp.

  ---

  **The Care of Surfaces**

  The basement smelled of damp concrete and the sharp, clean tang of solvent – Aris Thorne’s natural habitat. Floodwater had receded, leaving tide lines on crate lids and the faint, persistent chill of disaster narrowly averted. Her team moved with the weary efficiency of salvage veterans, cataloging, shifting, checking seals. She opened crate RR-1985-07B, expecting storage logs or decommissioned equipment. Instead, the layered protective packing revealed not data tapes, but wood, canvas, and the unmistakable, slightly dusty scent of aged varnish and oil paint.

  Aris froze. The crate label was wrong. Terribly wrong. Because nestled within the shock-absorbing foam was *The Harbingers*, Elias Varga’s fragile, haunting triptych. The same *Harbingers* that had hung, meticulously documented and cared for by Aris herself for eleven years, in Gallery 7 upstairs.

  Her breath hitched. Impossible. Relay reconstitution was destructive. One scan, one print. The original consumed, the continuation birthed. That was the doctrine, the bedrock of preservation for over four decades. The molecule-perfect replica upstairs *was* the work, the institutional life of Varga’s final masterpiece extended. There could not be two.

  Yet, here it was. Visually identical. The same figures hunched against a bruised sky, the same fractured light on a distant shore, the same unsettling ambiguity Varga had perfected. Aris’s hand, trained for decades to assess without touching, hovered over the surface. It *felt* identical. The slight drag of the varnish under the microclimate of her glove, the minute textural variations of the brushwork replicated with inhuman fidelity.

  Panic, cold and sharp, cut through her professional detachment. She slammed the crate shut, the sound echoing too loudly in the suddenly cavernous basement. She accessed the archives remotely, fingers trembling slightly on her tablet. The logs for the RR-1985-07 run were corrupted, overwritten decades ago during a system migration. Standard procedure for completed, uncontroversial reconstitutions. Only the final certificate of continuation existed, linked to the object upstairs. But the crate… the crate number *implied* a sequence. Run A? Run B? Which was which?

  Molecular divergence reports, run automatically on rediscovery, confirmed thermal noise – a few thousand molecules dancing differently in each object. Statistically random, functionally invisible. No signature, no hidden flaw, no microscopic fingerprint left by the sequence of printing. No test could tell them apart without invasive, destructive sampling. They were twins separated at birth by an unrecorded minute, each bearing the same face, the same history, the same claim to be *the* object that carried Varga’s intent forward from the moment of scanning.

  Director Vance’s office was all sharp angles and colder light. Aris laid it out, clinical, detached, while her stomach churned. Vance listened, his face tightening from professional concern to icy dread as the implications crystallized.

  "Two?" he finally rasped. "Forty years… and we’ve had *two*?"

  "Indistinguishable," Aris confirmed, her voice hollow. "The logs are gone. There is no way to know which was printed first, which was the… intended continuation."

  Vance surged up, pacing. "The rededication is in *seventy-two hours*. Varga’s centenary. Major donors. The press." He stopped, fixing Aris with a stare that brooked no argument. "You found it. You deal with it. The one upstairs *is* the work. It’s been on display for decades. The public knows it. The certificate is for *it*. This… this basement anomaly is a glitch. An error. A by-product. Destroy it. Today. Use the hazardous materials protocol. Pulverize it. Document the disposal as contaminated feedstock residue. Then sign the condition report for the gallery piece as normal for the rededication."

  Aris felt the words like physical blows. "Destroy it? Director, the Varga heir…"

  "Will never know!" Vance snapped. "Unless someone tells them. And no one will." His gaze was a command. "The *continuity* is what matters, Aris. The object on the wall, carrying the story forward. That’s what the public sees. That’s what the museum *is*. We cannot have… ambiguity hanging on our walls. It undermines everything. Elim the duplicate. Restore certainty."

  Certainty. The word echoed in Aris’s mind as she descended back into the basement’s chill. Certainty was her currency. Her eleven years of condition reports for the gallery triptych were monuments to certainty – measurements of craquelure, spectral analysis of pigments, humidity logs. Each report affirmed: *This object persists. This is The Harbingers.* But which object? Did it even matter *which* physical instantiation bore the weight of that assertion, as long as one did? Vance thought not. The institution demanded it.

  Then came the lawyer’s letter. Word, somehow, had leaked. Not the specifics, but enough. Anya Varga, the painter’s granddaughter, demanded restitution. *“It has come to our attention,”* the formal language crackled with accusation, *“that the relay reconstitution process performed in 1985 resulted in the destruction of the original Varga triptych ‘The Harbingers’. Consequently, any object currently held by the museum purporting to be the work is necessarily a forgery, a product of the reconstitution machinery, lacking the essential connection to the artist’s hand and intent. We demand the immediate return of the original artwork. Possession of a known forgery is unlawful.”*

  They knew about the destruction inherent in the scan. They didn’t know about the *second* forgery sitting in the basement. Aris held the letter, the heir’s claim carving a new dimension into the crisis. Vance was apoplectic, railing about malicious leaks, vowing legal defense. "They want the original? It’s *gone*! Consumed! What we have is the *legitimate continuation*!" But the heir’s logic was chillingly sound: if the scan was destruction, then *both* prints were equally illegitimate, artifacts of the machine, severed from Varga. The museum possessed not one precious continuation, but two worthless counterfeits. Returning "the original" was impossible; returning *both* forgeries was an admission of guilt and worthlessness. Destroying the basement piece now wouldn't solve the heir's claim against the gallery piece; it would just make evidence disappear.

  Aris stood in the high-security storage bay. The gallery *Harbingers*, pristine behind its climate-controlled cover. The basement *Harbingers*, identical, resting on a padded rack where the crate had been. Two surfaces, each whispering the same visual story, each bearing the same invisible, meaningless molecular scars of their creation. Which one had she tended for eleven years? Did the care she lavished on the gallery piece somehow imbue *it* with a greater claim? Or was that just sentimentality, a desperate human projection onto indifferent matter?

  Varga’s figures stared out from both sets of panels, their expressions eternally ambiguous – were they witnessing an ending or a beginning? Aris felt their gaze. She thought of the scanner forty years ago, not ending the work, but perhaps… dividing it. A single act of artistic creation, frozen in data, then blossoming into two physical existences, each equally a product of that frozen moment, each equally orphaned from the hand that first laid down the paint but equally saturated with the form that hand created. Was "the original" even a coherent concept anymore? Yet, Anya Varga wanted *something* back – something connected to her grandfather. The museum *needed* one object on the wall to be "it" – the singular vessel of history and value. Vance needed her signature on the condition report to affirm that singularity.

  The report lay open on her desk in the conservation lab. The usual headings: Object ID, Date, Examiner, Condition Summary. She had filled in everything except the signature block. The Object ID field glared at her: RR-1985-07A (Gallery). But was it A? Or B? Did the letter matter? What did it signify? The sequence of printing, lost to corrupted logs and overwritten data? A sequence that made no aesthetic or experiential difference?

  Signing it would be an act of faith. Or fraud. Affirming the continuous identity of an object whose history was now bifurcated, uncertain. It would be choosing one twin over the other for no reason other than institutional convenience, while the heir demanded the impossible return of a ghost. Signing it would endorse Vance’s brutal pragmatism, the destruction of the other piece – a piece that, for all anyone knew, was the "first" print, the intended continuation. Or was it? *There was no way to know.* That was the void at the center.

  She picked up her pen. The familiar weight felt alien. She looked at the signature line, then at the two climate-control monitors on her desk – one linked to the gallery frame, one to the storage bay. Both readouts were steady, optimal. Both surfaces were being cared for identically. Both were, in every measurable way that conservation could touch, *The Harbingers*. Yet only one could hang on the wall tomorrow as "the" work. Only one could be named in her report.

  Her hand hovered. The pen trembled. The void yawned. Signing meant choosing a reality. It meant declaring one set of molecules, arbitrarily, to be the true vessel of Varga’s legacy, and condemning the other to oblivion or legal limbo, while the heir cried theft over a destruction that happened decades ago. It meant pretending the indeterminacy didn't matter.

  Slowly, deliberately, Aris Thorne placed the pen back on the desk, away from the report. She closed the folder. The signature block remained empty, a small, potent blank space in the meticulously ordered world of the museum. Upstairs, the gallery wall waited, empty. In the storage bay, two identical visions of an ending – or a beginning – rested under perfect light. Director Vance would have to rededicate something. Anya Varga’s lawyer would file motions. The conservator sat very still, surrounded by the hum of environmental systems maintaining the surfaces of two perfect, unknowable ghosts. The question hung in the climate-controlled air, heavy and unanswerable: *Which one?* And beneath it, the more terrifying silence: *Is there even a 'which' to know?* The unsigned report lay before her, a testament only to the care of surfaces, and the unfathomable depths beneath.
