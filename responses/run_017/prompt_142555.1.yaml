  Phase 3: Three-player game to show the difference between independent and correlated conjectures.

  We design a three-player game, each with two strategies. We want a strategy for player i that is not strictly dominated by any mixed strategy over i's other strategies (if any) but is never a best response to any independent conjecture (product distribution) over the other players' strategies, yet is a best response to some correlated conjecture.

  Example: the well-known game from Pearce (1984) or Forges (1990) that shows the difference.

  Consider the following three-player game (players A, B, C) with each having two actions: {0,1}. Payoffs are:

  - If the majority is 0, then each player gets 1 if they played 0, and 0 if they played 1.
  - If the majority is 1, then each player gets 1 if they played 1, and 0 if they played 0.

  But this is symmetric and every strategy is a best response to the others playing the same.

  Another example: the game in which one player's action is only good if the other two players choose the same action.

  Specifically, let's define a three-player game where Players 1,2,3 each choose from {H, T}.

  Payoffs for Player 1:
  - If Player 2 and Player 3 choose the same action, then Player 1 gets 1 for choosing that action and 0 for the other.
  - If Player 2 and Player 3 choose different actions, then Player 1 gets 0.5 for either action.

  Players 2 and3 have constant payoffs, say 0, so they are indifferent. But then they might not have an incentive to mix in a particular way.

  We can make it so that Players 2 and 3 have payoffs that depend on their actions, but we want to focus on Player 1.

  Alternatively, a standard example is the following (from Brandenburger and Dekel, 1987):

  Players: Row, Column, and Matrix (or Player 1,2,3).

  Player 1 chooses U or D.
  Player 2 chooses L or R.
  Player 3 chooses A or B.

  Payoffs:

  For Player 3: always 0, so Player 3 is dummy.

  For Players 1 and 2, it's a game that depends on Player 3's move? But we want Player 3 to have an incentive.

