          L       R
  U       0,0,0  0,0,0
  D       0,0,0  0,0,1

   Only Player 3 has a non-zero payoff in B when (D,R,B) occurs.

  Player 1's payoffs are: 
  - In (U,L,A): 4
  - In (D,R,A): 1
  - In (D,R,B): 0
  - Otherwise: 0

  Player 1's strategy U: 
  - against a profile of the others: only in (L,A) does it give 4, otherwise 0.
  - In (R,A) or any B, it gives 0.

  Player 1's strategy D: 
  - in (R,A) gives 1, in (R,B) gives 0, in (L, any) gives0.

  So U is a best response only if the conjecture puts positive probability on (L,A) and sufficiently high compared to (R,A) for D to be worse.

  Specifically, let p = probability that Player 2 plays L, and q = probability that Player 3 plays A.

  Then expected payoff of U: 4 * p * q
  Expected payoff of D: 1 * (1-p) * q   [ because only if Player 2 plays R and Player 3 plays A ]

  U is a best response if 4pq >= 1*(1-p)q and also >=0.

  If q>0, then this simplifies to 4p >= 1-p -> 5p>=1 -> p>=1/5.
  If q=0, then U gives 0 and D gives 0.

  So for any independent conjecture with p>=1/5 and q>0, U is a best response.

