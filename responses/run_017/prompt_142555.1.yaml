  Player 3's payoff: 
  - 1 if she plays 1 and the other two players both play 0,
  - 0 otherwise.

  Now, consider Player 2's strategy of playing 1. Is it ever a best response to independent mixed strategies of the others? 

  Let sigma_1 = p (probability Player 1 plays 1)
  sigma_3 = q (probability Player 3 plays 1)

  Player 2's expected payoff for playing 1: requires both Player 1 and Player 3 to play 1, so payoff = p * q * 1 + otherwise 0 = p*q.

  Player 2's payoff for playing 0: 0.

  So Player 2 will only play 1 if p*q >=0, which is always true, but she is indifferent when p*q=0 and strictly prefers 1 only when p>0 and q>0. So it is a best response when p>0 and q>0.

  So not the example.

  We want a strategy that is never a best response to any independent product distribution, but is a best response to a correlated distribution.

  Example: the game in which Player 1 chooses a row, Player 2 chooses a column, and Player 3 chooses a matrix.

  Player 3 has two matrices: 
  Matrix A:
          L       R
  U       1,0,0   0,0,0
  D       0,0,0   0,0,0

  Matrix B:
          L       R
  U       0,0,0   0,0,0
  D       0,0,0   1,0,0

  Player 3 chooses between A and B.

  Payoffs: the first number is for Player 1, the second for Player 2, the third for Player 3.

  Player 3's payoff: 1 if ( in A and Players 1 and 2 choose (U,L) ) or ( in B and Players 1 and 2 choose (D,R) ), and 0 otherwise.

  Player 1's payoff: 1 if ( in A and (U,L) ) or ( in B and (D,R) ), 0 otherwise.
  Player 2's payoff: always 0.

  Now, consider Player 1's strategy U.
  - If Player 3 plays A, then Player 1's best response to Player 2: if Player 2 plays L, then U gives 1 (if in A) and D gives 0.
    if Player 2 plays R, then U gives 0 and D gives 0.
    so against A, Player 1's best response to any Player 2's pure strategy is to play U if Player 2 plays L, and indifferent if Player 2 plays R.
  - If Player 3 plays B, then in B, U gives 0 regardless.

  So Player 1's strategy U is a best response only if Player 3 plays A and Player 2 plays L.

  But now, for independent conjectures: let Player 2 play L with probability p, R with 1-p.
  Player 3 play A with probability q, B with 1-q.

  Player 1's expected payoff for U: 
  - In state A: if Player 2 plays L: 1, if R: 0. So conditioned on A, expected payoff = p*1 + (1-p)*0 = p.
  - In state B: 0.
  - So overall: q * p + (1-q)*0 = q*p.

  Player 1's expected payoff for D: 
  - In state A: 0.
  - In state B: if Player 2 plays R: 1, if L: 0. So conditioned on B: (1-p).
  - So overall: (1-q) * (1-p).

  Player 1 will play U if q*p >= (1-q)*(1-p) and also >=0.

  But we can have mixed conjectures where U is not a best response? For example, if q=0.5, p=0.5, then U gives 0.25, D gives 0.25 -> indifferent. So U is a best response to this independent conjecture.

   We want U never to be a best response to any independent conjecture. 

