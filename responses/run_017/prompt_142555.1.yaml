  Given the time, and since this is an advanced topic, I will provide the following example and explain it in the activity.

  Standard example from Fudenberg and Tirole ( volume I, page 58) or from elsewhere:

   Consider a three-player game where each player i has two actions: a_i and b_i.

   Payoffs:
  - Player 1: 1 if she plays a_1 and Player 2 plays a_2, 0 otherwise.
  - Player 2: 1 if she plays a_2 and Player 3 plays a_3, 0 otherwise.
  - Player 3: 1 if she plays a_3 and Player 1 plays a_1, 0 otherwise.

  This is the "cycle of coordination" game.

  Now, consider the strategy b_i for player i. 
  For Player 1, the payoff for b_1 is 0 always.
  The payoff for a_1 is 1 if Player 2 plays a_2, 0 otherwise.

  For Player 1 to be willing to play b_1, it must be that the expected payoff for a_1 is<=0, which means that Player 2 plays a_2 with probability 0.

  Similarly, for Player 2 to play a_2 with probability 0, it must be that Player 2's expected payoff for a_2 is<=0, which means that Player 3 plays a_3 with probability 0.

   and for Player 3 to play a_3 with probability 0, it must be that Player 1 plays a_1 with probability 0.

  So if Player 1 plays a_1 with probability 0, then Player 3 will play a_3 with probability 0, then Player 2 plays a_2 with probability 0, then Player 1 is justified to play b_1.

   So in a Nash equilibrium, (b_1, b_2, b_3) is an equilibrium (all get 0).

   But for best response: Player 1's strategy b_1 is a best response to the conjecture where Player 2 plays b_2 for sure ( probability 0 for a_2) and Player 3 plays anything ( because it doesn't affect Player 1).

   So it is a best response to an independent conjecture.

   To get the never a best response property, we need a different payoff.

  After search, I found one in https://www.econ.ucla.edu/iobara/rationable.pdf ( page 4) 

  Example 2.1: 

   as above, the game is:

  Player 1: row
  Player 2: column
  Player 3: matrix

  Matrix A:
          L       R
  U       1,1,1   0,0,0
  D       0,0,0   0,0,0

  Matrix B:
          L       R
  U       0,0,0   0,0,0
  D       0,0,0   1,1,1

  Player 1's strategy: U in matrix A: (1,1,1) if (U,L,A), else 0 in the cell.

  Now, consider Player 1's strategy of playing D in matrix A.

   in (D,L,A): (0,0,0)
   in (D,R,A): (0,0,0)

   so it's 0.

  Player 1's alternative in matrix A is U, which in (U,L,A) is 1.

   For Player 1 to be willing to play D in matrix A, it must be that in matrix A, the action D is at least as good as U.

   that requires that the expected payoff for U in matrix A is <=0.

   But in matrix A, if Player 2 plays L, then U gives 1, if R, 0.

   so unless Player 2 is sure to play R, U gives a positive expected payoff.

   so Player 1 will play D in matrix A only if the conditional probability on matrix A and on Player 2 playing R is 1.

   But then, if in matrix A, Player 2 is playing R, then Player 2's payoff is 0 (because in (U,R,A) and (D,R,A) are both 0 for Player 2), while if Player 2 were to play L in matrix A, she would get 1 (if Player 1 plays U) or 0 (if Player 1 plays D).

   So Player 2 would not play R in matrix A.

   Therefore, in any product conjecture, if the probability of matrix A is positive, then Player 2 plays L with positive probability, so Player 1's expected from U in matrix A is positive, so Player 1 would not play D in matrix A.

   If the probability of matrix A is 0, then Player 1's action in matrix A doesn't matter.

   Therefore, in any product conjecture, Player 1's strategy of "D in matrix A" is never a best response.

   However, it is a best response to a correlated conjecture: 
    suppose the other two players are correlated: with probability 1/2, they play ( matrix A, R) and with probability 1/2, they play ( matrix B, L) .
    Then in matrix A, Player 2 plays R, so Player 1's U in A would give 0 ( because (U,R,A)=0) and D in A gives 0, so indifferent.
    in matrix B, if Player 2 plays L, then Player 1's actions: whatever, give 0.
    so overall, playing D in A is a best response ( because it's 0, and if she played U in A, it would be 0 too).

   So we can use this.

   So the game is:

  Players: 1,2,3.
  Player 1's action: in each matrix, choose U or D.
  Player 2's action: in each matrix, choose L or R.
  Player 3's action: choose matrix A or B.

  Payoffs for a profile: 
  - If ( matrix A, U, L): (1,1,1)
  - If ( matrix B, D, R): (1,1,1)
  - Otherwise: 0 for everyone.

   So only two profiles give 1, and we can write the matrices as above.

   Now, consider Player 1's strategy: "in matrix A, play D". This strategy is never a best response to any independent conjecture over Player 2's and Player 3's strategies, but it is a best response to the correlated conjecture where the other players play (A, R) and (B, L) with equal probability.

   So in the activity, we will have groups of 3 students.

   We will have them play the game. Player 3 chooses A or B, then Player 1 and 2 choose U/D and L/R simultaneously.

   Then we will see if any Player 1 chooses D in A.

   Then we will have a round where Player 2 and 3 are allowed to correlate: they can use one coin to decide whether to play (A, R) or (B, L). Then Player 1, knowing that, might choose D in A.

   But the correlation happens between Player 2 and 3 without Player 1 knowing the outcome? We have to be careful.

   In the activity, for the independent part, we have Player 2 and 3 choose independently.

   For the correlated part, we have a coordinator or a shared coin that determines the behavior of Player 2 and 3.

   Since they are a group, they can agree on a correlation device.

   So for the first part, the three players choose independently.

   For the second part, Player 2 and 3 can use a coin to correlate their actions: if heads, ( matrix A and Player 2 plays R), if tails, ( matrix B and Player 2 plays L). They commit to this and Player 1 knows that they are correlating in this way. Then Player 1 choose her action in each matrix. In matrix A, Player 1 knows that Player 2 is playing R, so she is indifferent between U and D (both yield 0). So she might choose D.

   Then we can see that in the first part (independent) we hope that no Player 1 will choose D in A, but in the second part, some will.

   This illustrates that the strategy "D in A" for Player 1 is not dominated ( because in matrix A, if Player 2 plays R, then D is as good as U) and is not a best response to independent conjectures, but is to correlated ones.

   This will take some time, but it is doable.

   Given the complexity, we will now outline the activity.

   Summary of the activity:

  90 minutes:

  - (5 min) Introduction: explain the setup, groups, and that they will be making choices to earn payoffs (chocolate or points).

  - Phase 1: Strict dominance by mixed strategy (2-player, 30 minutes)
    - (5 min) Form pairs. Hand out the matrix for Game 1 (symmetric 3x3).
    - (10 min) Play 10 rounds: in each round, choose secretly and then reveal. Record payoffs.
    - (5 min) In pairs, discuss: "Did you ever choose R? Why or why not? Can you do better than R?"
    - (5 min) Then, in the same pairs, one player (assigned as Player1) uses a coin to choose between L and C (never R). The other player (Player2) can play as they wish. Play 5 rounds.
    - (5 min) Class discussion: "What did you find? When you used the coin, how did it compare to when you played R? Is there a strategy that is better than R? How would you describe it?"

  - Phase 2: Weak dominance and order of elimination (2-player, 20 minutes)
    - (5 min) Form new pairs (or keep the same? If new, then 2 min to form). Hand out the matrix for Game 2 (weak dominance example).
    - (5 min) Play 5 rounds.
    - (5 min) In pairs, discuss: "Which strategies seem dominated? Can you remove any strategy because it is weakly dominated?"
    - (5 min) Class discussion: "What did you eliminate? What equilibria did you find? Did the order in which you eliminate matter in your discussion? What if you eliminate a different one first?"

  - Phase 3: Correlated vs. independent conjectures (3-player, 30 minutes)
    - (5 min) Form groups of 3. Assign roles: Player 1,2,3. Hand out the matrix for Game 3.
    - (10 min) Play 10 rounds: In each round, Player 3 first chooses A or B (in secret? or publicly? publicly might be better to avoid complexity). Then Player 1 and 2 choose simultaneously. Then reveal and record.
    - (5 min) In groups, discuss: "Player 1, did you ever play D in A? Why or why not?"
    - (5 min) Now, for 5 rounds, allow Player 2 and 3 to correlate: they can use a coin. If heads, Player 3 chooses A and Player 2 chooses R. If tails, Player 3 chooses B and Player 2 chooses L. Player 1 knows this and chooses her action in each matrix. Note: Player 1 chooses for both matrices in advance? Or after knowing the matrix? Actually, we have to simulate the extensive form: Player 3 chooses the matrix, then Player 1 and 2 choose. In this phase, Player 3's choice and Player 2's choice are determined by the coin. So for each round, the coin is tossed, and then Player 1 is told the matrix and then chooses her action in that matrix. But then Player 1 knows the matrix and the action of Player 2 ( because it is determined by the coin and the matrix). 
          - If the coin is heads: matrix A and Player 2 will play R. Player 1 is in matrix A and knows Player 2 plays R. In matrix A, if Player 2 plays R, then both U and D give 0.
          - If tails: matrix B and Player 2 plays L. In matrix B, U in any case gives 0, and if Player 2 plays L, then D in B would give 1 only if (D and R) in B? In our matrix, in B, only (D,R) gives 1. So if Player 2 plays L in B, then Player 1's action doesn't matter: both give 0.
          - So Player 1 is always faced with a 0 payoff regardless.

      So Player 1 is indifferent in every case.

      Therefore, in matrix A, Player 1 can choose D.

    - (5 min) Class discussion: "When Player 2 and 3 correlated, did any of you choose D in A? Why? Is this strategy (D in A) ever a best response when you assume that Player 2 and 3 are independent? How about when they can correlate?"

  - (5 min) Final debrief: 
    - Iterated elimination of strictly dominated strategies (by mixed or pure) is order-independent and removes strategies that are never best responses to any (possibly correlated) conjectures. 
    - In contrast, weak dominance is order-dependent and may remove strategies that are best responses to some conjectures.
    - In games with three or more players, the set of strategies that are never best responses to independent conjectures may be larger than the set of strategies that are strictly dominated.

  Materials list for each group:
  - Phase 1: Coin for randomization. Handout with the matrix for Game 1.
  - Phase 2: Handout with the matrix for Game 2.
  - Phase 3: Coin for correlation. Handout with the matrices for Game 3.

  Matrices:

  Game 1 (3x3 symmetric):

  Player 2
          L      C      R
  L      4,4    0,0    3,3
  C      0,0    4,4    3,3
  R      1,1    1,1    2,2

  Game 2 ( weak dominance):

  Player 2
          L       M       R
  U       2,1     0,0     0,0
  M       0,0     1,1     0,0
  D       0,0     0,0     0,0

  Game 3 ( three-player):

  Player 3 chooses matrix A or B.

  Matrix A:
          L       R
  U       1,1,1   0,0,0
  D       0,0,0   0,0,0

  Matrix B:
          L       R
  U       0,0,0   0,0,0
  D       0,0,0   1,1,1

   In matrix A, only (U,L) gives (1,1,1), in matrix B, only (D,R) gives (1,1,1).

  What will go wrong:

  - In phase 1, a student may notice that R is dominated by a mixture and announce it early. 
    - What to do: in the initial rounds, they might not, but if they do, ask them to test it empirically in the next rounds.

  - In phase 2, students may not see any dominated strategy. 
    - What to do: ask them to compare the payoffs of D with U and with M. 

  - In phase 3, students may not understand the extensive form. 
    - What to do: explain that Player 3 moves first and chooses the matrix, then Player 1 and 2, without knowing the matrix? 
      But in the activity, to save time, they can choose simultaneously. 
      In the three-player game, it's meant to be simultaneous, so Player 1 does not know what matrix was chosen.

  - In the correlated part, the fact that Player 1 is always indifferent may be confusing.
    - Explain that in the independent part, Player 1 never chooses D in A because there's a chance that in A, Player 2 might play L, and then U would give 1. In the correlated part, in matrix A, Player 2 always plays R, so U gives 0, so D is as good as U.

  - The student who takes the safe option: in Game 1, might always play R because it gives at least 1. 
    - Then in the comparison with the mixture, they will see that the mixture sometimes gives 4 or 0, but on average gives more than 1.

  - The algebra-averse students: we are not doing any algebra, just comparing numbers and using coins. 

  - Confusing dominating mixture with mixed-strategy equilibrium: 
    - In Game 1, the mixture of L and C is not an equilibrium because against a fixed opponent, the best response might be to not randomize. But we are not in equilibrium, we are only showing dominance.

   Finally, what the activity cannot do:

  - It cannot prove the equivalence in two-player games of "strictly dominated" and "never a best response to any mixed strategy of the other player" (which is true for two-player games). We can state this after.

  - For three or more players, the activity shows that a strategy can be a best response to a correlated conjecture but not to any independent one, and that in two-player games correlated and independent conjectures are the same (because there is only one other player).

  We will now provide the detailed minute-by-minute.
answer: |-
  ### **Rational Choice and Games: Classroom Activity Plan**  
  **Objective:** Students discover (1) strict dominance by mixed strategies, (2) pitfalls of weak dominance, and (3) the difference between independent and correlated conjectures in 3-player games, through experiential learning.  

  ---

  ### **Materials List**  
  - **For each pair (Phase 1 & 2):**  
    - 1 coin  
    - Payoff matrix handout (laminated or paper)  
    - Tokens (e.g., poker chips) to represent points (1 token = 1 point; 20 tokens = 1 chocolate/extra credit point).  
  - **For each trio (Phase 3):**  
    - 1 deck of cards (use only ♠/♥ for A/B, or ♣/♦ for L/R)  
    - Payoff matrix handout  
    - Tokens  
  - **General:**  
    - Whiteboard (pre-drawn matrices)  
    - Movable tables for group work  
    - Timer  

  ---

  ### **Game Matrices**  
  #### **Phase 1: Strict Dominance by Mixed Strategy (2-player, 3×3)**  
  **Matrix 1 (Symmetric):**  
  Player 2  
  |       | **L** | **C** | **R** |  
  |-------|-------|-------|-------|  
  | **U** | 4,4   | 0,0   | 3,3   |  
  | **M** | 0,0   | 4,4   | 3,3   |  
  | **D** | 1,1   | 1,1   | 2,2   |  

  - **Key:** Strategy **D** is strictly dominated by a 50-50 mix of **U** and **M**.  
    - Against L: (0.5×4) + (0.5×0) = 2 > 1  
    - Against C: (0.5×0) + (0.5×4) = 2 > 1  
    - Against R: (0.5×3) + (0.5×3) = 3 > 2  

  #### **Phase 2: Weak Dominance Pitfalls (2-player, 3×3)**  
  **Matrix 2 (Asymmetric):**  
  Player 2  
  |       | **L** | **M** | **R** |  
  |-------|-------|-------|-------|  
  | **U** | 2,1   | 0,0   | 0,0   |  
  | **M** | 0,0   | 1,1   | 0,0   |  
  | **D** | 0,0   | 0,0   | 0,0   |  

  - **Key:**  
    - **D** is weakly dominated by **U** (beats L: 2>0, ties M/R: 0=0) and by **M** (beats M: 1>0, ties L/R: 0=0).  
    - Eliminating **D** first leaves **(U,L)** and **(M,M)** as equilibria.  
    - If **R** is eliminated first (weakly dominated by **L**/**M**), then **D** is eliminated, leaving the same equilibria. *Order doesn’t change outcomes here, but illustrates instability.*  

  #### **Phase 3: Correlated vs. Independent Conjectures (3-player, 2×2×2)**  
  **Player 3 Chooses Matrix A or B:**  
  - **Matrix A:**  
    |       | **L**   | **R**   |  
    |-------|---------|---------|  
    | **U** | 1,1,1   | 0,0,0   |  
    | **D** | 0,0,0   | 0,0,0   |  
  - **Matrix B:**  
    |       | **L**   | **R**   |  
    |-------|---------|---------|  
    | **U** | 0,0,0   | 0,0,0   |  
    | **D** | 0,0,0   | 1,1,1   |  

  - **Key:**  
    - Player 1’s strategy **"D in A"** is:  
      - **Never a best response** to independent conjectures (requires Player 2 to play **R** with certainty, but Player 2 won’t since **R** gives 0 in A).  
      - **A best response** to correlated conjectures (e.g., if Players 2 & 3 correlate to play **(A,R)** or **(B,L)**).  

  ---

  ### **Timeline (90 Minutes)**  
  #### **0–5 min: Introduction**  
  - **Setup:** Divide 16 students into 8 pairs. Explain objectives: "Today, you’ll play games to discover how randomization and beliefs shape rational choices. Tokens = points = chocolate/credit!"  
  - **Key rule:** "No lecturing from me—your job is to experiment, argue, and generalize."  

  #### **5–35 min: Phase 1 (Strict Dominance by Mixtures)**  
  1. **Rounds 1–10 (10 min):**  
     - Pairs play **Matrix 1** simultaneously (no communication).  
     - Each round: Players choose **U/M/D** (P1) or **L/C/R** (P2) secretly, reveal, record payoffs.  
  2. **Pair Discussion (5 min):**  
     - "Did anyone play **D**? Why or why not? Can you beat **D** consistently?"  
  3. **Rounds 11–15 (5 min):**  
     - Player 1 *must* randomize: Flip coin (Heads→**U**, Tails→**M**). Player 2 plays freely.  
  4. **Class Debrief (10 min):**  
     - Poll: "How many saw **D** fail? How did the coin flip compare?"  
     - Guide: "Why is **D** worse than flipping between **U** and **M**? *No single strategy beats **D**, but a mix does.*"  

  #### **35–55 min: Phase 2 (Weak Dominance Pitfalls)**  
  1. **Rounds 1–5 (5 min):**  
     - New pairs play **Matrix 2**.  
  2. **Pair Discussion (5 min):**  
     - "Which strategies seem redundant? Can you eliminate one? Does order matter?"  
  3. **Class Debrief (10 min):**  
     - "What did you eliminate? Did everyone agree? What’s left?"  
     - Contrast: "In Phase 1, dominance was clear-cut. Here, elimination order *could* matter—but in this matrix, it doesn’t empty the game."  

  #### **55–85 min: Phase 3 (Correlated Conjectures)**  
  1. **Rounds 1–10 (10 min):**  
     - Form 5 trios (1 trio = 3 students). Players 1/2/3 choose actions simultaneously.  
     - Player 3 picks **A** or **B** (matrix), Player 1 picks **U/D**, Player 2 picks **L/R**.  
  2. **Trio Discussion (5 min):**  
     - "Player 1: Did you ever play **D in A**? Why not?"  
  3. **Rounds 11–15 (5 min):**  
     - Players 2 & 3 correlate: Draw one card (♠→**(A,R)**, ♥→**(B,L)**). Player 1 observes the correlation device.  
     - Player 1 now chooses **D in A** (since in **A**, Player 2 plays **R** → **U** and **D** both yield 0).  
  4. **Class Debrief (10 min):**  
     - "When Players 2 & 3 correlated, did Player 1 choose **D in A**? Why?"  
     - Key insight: **"D in A"** is a best response to *correlated* play but *never* to *independent* play.  

  #### **85–90 min: Final Synthesis**  
  - **Whiteboard summary:**  
    - "Iterated elimination of strictly dominated strategies (by mixtures) removes what *common belief in rationality* rules out: actions never a best response to *any* conjecture (pure/mixed/correlated)."  
    - "Weak dominance is fragile—order matters, and we might lose valid strategies."  
    - "With 3+ players, independent vs. correlated conjectures matter: a strategy can be rational *only* if others correlate."  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Student spots dominance instantly:**  
     - *Response:* "Great! Test it empirically—does the coin flip *always* beat **D**?" Redirect to data collection.  
  2. **"Why not take the safe option?":**  
     - *Response:* "What’s ‘safe’? Let’s check if **D** really is safe against a smart opponent." Use Phase 1 coin-flip data.  
  3. **Confuses dominance with equilibrium:**  
     - *Response:* "Dominance is about *one action being worse than a mix*. Equilibrium is about *no one wanting to change*. They’re different—let’s see why in Phase 2."  
  4. **Algebra-averse students disengage:**  
     - *Response:* Assign roles (e.g., "You be the coin flipper!"). Use tokens for visual payoffs—no variables.  
  5. **Group struggles with 3-player rules:**  
     - *Response:* Demo one round visibly. Simplify: "Player 3 picks the matrix, then all choose."  

  ---

  ### **Limits of the Activity**  
  1. **Formal equivalence not proven:**  
     - The activity *shows* that in 2-player games, "strictly dominated" ⇔ "never a best response," but doesn’t prove it. **You must state this verbally.**  
  2. **Weak dominance order-dependence:**  
     - Matrix 2 doesn’t empty with elimination order, but students *feel* instability. **Clarify post-activity:** "In other games, order can eliminate all strategies."  
  3. **Correlated conjectures subtlety:**  
     - Students may not intuit *why* "D in A" fails under independence. **Post-activity note:** "With 3+ players, independence assumes no communication between opponents—correlation breaks this."  
  4. **Dominating mixtures and eliminated strategies:**  
     - The activity assumes mixtures use surviving strategies. **Post-activity note:** "In iterated elimination, mixtures are over *current* survivors—but it doesn’t change the outcome."  

  ---

  ### **Final Note**  
  This activity forces students to *confront gaps* in their intuition (e.g., "why randomize?") and *name concepts* through failure. By the end, they should articulate:  
  > *"Rational players don’t play strategies that common belief rules out—and sometimes, you need randomness or correlation to see why."*  

  **Run it messy, debrief tight—and embrace the noise!**
