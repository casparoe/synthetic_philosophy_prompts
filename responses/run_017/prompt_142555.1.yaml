  We want an example where a strategy is never a best response to any product distribution.

   such an example is the following (from a paper by Brandenburger and Friedenberg, or common in advanced texts):

  Consider a three-player game where each player has two actions: A and B.

   but the payoffs are:

  Player 1's payoff: 
  - 1 if she plays A and Player 2 plays A, regardless of Player 3.
  - 0 otherwise.

  Player 2's payoff:
  - 1 if Player 1 plays A and Player 3 plays A.
  - 0 otherwise.

  Player 3's payoff:
  - 1 if Player 1 plays B.
  - 0 otherwise.

  Now, consider Player 1's strategy of playing B.
  - If Player 1 plays B, she gets 0.
  - If Player 1 plays A, she gets 1 if Player 2 plays A, and 0 if Player 2 plays B.
  - So to have B be a best response, we need that the expected payoff of A is <=0.
    that means that the probability that Player 2 plays A must be 0.
    because if Player 2 plays A with any positive probability, then A gives at least that probability *1 >0.

   So Player 1 will only play B if she is sure that Player 2 will play B.

   But now, Player 2's payoff depends on Player 3: Player 2 only gets 1 if both Player 1 and Player 3 play A.

   If Player 1 is playing B, then Player 2's action has no impact on her payoff (0 regardless), so Player 2 is indifferent.

   Player 3, if Player 1 is playing B, then Player 3 gets 1 (for sure) by doing anything.

   So the only condition for Player 1 to play B is that she believes Player 2 plays B for sure.

   But can that happen in an independent conjecture? 
   Let independent conjecture: Player 2 plays B with probability p, Player 3 plays anything.
   Player 1's expected payoff for A: 1 * (probability that Player 2 plays A) = 1-p.
   For B: 0.
   So Player 1 will choose A if p<1, and is indifferent if p=1.

   So if p=1 (Player 2 for sure B), then Player 1 is indifferent between A and B, so B is a best response.

   Therefore, it is a best response to the independent conjecture where Player 2 plays B for sure and Player 3 plays anything.

   So not the example.

