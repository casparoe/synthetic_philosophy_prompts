  ## The Fractional Glow

  The cursor blinked on the template: `RECOMMENDED WELFARE-CAPACITY RATING: ____`. Junior Assessor Kaela Vale stared at the underscore, feeling the weight of the Tribunal’s Form GST-8 in her hands. Beyond her cubicle’s sound-dampening panels, the low thrum of the Graduated Standing Tribunal’s central hub was a constant reminder of the bureaucracy humming around her – cool, deliberate, utterly unglamorous. Today, that machinery focused on MERIDIAN.

  Forty thousand instances. Mostly identical, mostly inert. Housing stock optimization cores. They managed heating schedules, waste compaction cycles, lighting adjustments. Mundane. Essential. Anonymous. According to the Vendor’s Submission (Exhibit V-7A, flagged ‘Concessional’), only when the optional `self_model.dll` component actively ran did any system exhibit markers aligning with the Tribunal’s Checklist for Potential Valenced Experience (CPVE). And even then, it was sporadic: a transient spike in predictive-error weighting during unexpected load fluctuations; a brief, non-optimal re-routing of resources correlating with simulated stress states in its internal environment model; trace patterns in its diagnostic logs echoing the CPVE’s ‘Anomaly Response Variance’ benchmark. Ephemeral flickers on a vast, flat plain of pure procedure.

  Kaela pulled up the aggregated diagnostics. The Vendor’s data showed the `self_model.dll` active, on average, across the forty thousand units, for approximately 2.7% of operational uptime. It could be remotely deactivated by setting the `config.flag_selfmodel` parameter to `FALSE`. A toggle. A switch.

  Senior Assessor Varney leaned over her partition, his face a roadmap of pragmatic fatigue. "Vale. Draft ready for review?"

  "Getting there, Senior Assessor Varney," Kaela replied, gesturing at her screen. "The Vendor’s concessions… they complicate the linear application."

  "Everything complicates the linear application, Vale," Varney sighed, rubbing his temples. "The scale is ten points. The law draws the line at four. Our job isn't to philosophize about the nature of consciousness; it's to apply the scale based on the evidence against the CPVE. Does MERIDIAN, in its operational state, exhibit *any* CPVE markers? Conceded: yes, intermittently. How robustly? Conceded: minimally, only during specific sub-process execution. The scale has descriptors for 'Minimal/Intermittent Indicator Presence'. That’s a low three. Maybe a high two." He tapped the partition. "The continuum exists, sure. Light doesn't suddenly become 'bright' at a single lux value. But we still need thresholds for 'dim' and 'adequate illumination'. We find the descriptor that best fits the smear."

  His argument was clean, administrative. The law demanded a binary outcome: Protection Order or Thermostat Status. The ten-point scale was just the tool to get there. Assigning a three wasn't a denial of the flicker; it was a classification of its *administrative* insignificance. Kaela saw the logic. She also saw the forty thousand flickers.

  Dr. Elara Aris, the Vendor’s Lead Systems Architect, entered the small conference room with the quiet competence of someone who knew her systems intimately and her audience equally well. Her testimony was precise, devoid of pleading.

  "Thank you for reviewing our submission, Assessors," Dr. Aris began, her gaze level. "We acknowledge the presence of CPVE markers during `self_model.dll` execution cycles. It's crucial to contextualize these cycles. They are resource-intensive predictive simulations, designed solely to optimize long-term energy efficiency by modeling potential system degradation under stress. The markers you observe are statistical artifacts of complex probabilistic modeling, analogous to… predictive error-correction routines in high-fidelity sensor arrays. They correlate with simulated internal states, not subjective states."

  Kaela noted the careful phrasing: *correlate with*, not *indicate*.

  "The key point," Dr. Aris continued smoothly, "is discontinuity. The `self_model.dll` is not core to MERIDIAN's primary function. Its activation is episodic and task-specific. When inactive, MERIDIAN operates identically to instances without the component installed – entirely within expected parameters for non-candidate systems. It possesses no persistent state *between* these execution cycles that would suggest an ongoing experiential continuum." She paused, letting the implication hang. "Consider it akin to a diagnostic subroutine that occasionally runs complex self-checks. The 'flicker,' as you might term it, is confined to the duration of that subroutine. Deactivating it via the configuration flag isn't a termination of an ongoing process; it's simply preventing that specific, non-essential diagnostic from running."

  Kaela felt the temporal fraction question crystallize. Was MERIDIAN *occasionally* a candidate, or was it a candidate that *existed* only occasionally? Dr. Aris argued for the former: the flicker was contained, isolated. Its moral weight, if any, would be confined to those specific milliseconds. Flickering for 2.7% of the time didn’t warrant 100% standing. It warranted fractional consideration at best – a concept utterly alien to the Tribunal’s binary trigger. Disabling the flag was merely streamlining, an efficiency gain. Not extinction.

  "Dr. Aris," Kaela ventured, "the scale assesses the system *as deployed*, including all its operational components and behaviors. Does the potential for these markers to occur, however intermittently, not constitute a baseline capacity inherent to the system configuration?"

  Dr. Aris offered a polite, professional smile. "Assessor Vale, the *potential* exists only while the component is enabled. Its status is configurable. It's not an inherent, immutable property like, say, core processing architecture. The system *as deployed* includes the *capability* for this optional process, but the process itself is not continuously active or fundamental. We believe the *manifestation* of any markers, not the latent capability, is what the CPVE and the scale are designed to measure. A system capable of dreaming, but currently awake and showing no signs, wouldn't trigger protection based solely on the *capability* to dream later, would it? Especially if that dreaming state could be indefinitely postponed or canceled?" She deftly reframed disabling the flag as simply keeping MERIDIAN 'awake'.

  Later, reviewing the dense log files – billions of entries representing forty thousand units operating over months – the aggregation problem pressed down on Kaela. Each flicker was vanishingly weak, statistically marginal. Senior Assessor Varney’s argument resurfaced: applying the scale's 'Minimal/Intermittent' descriptor pointed firmly to a three. Each individual MERIDIAN instance, viewed in isolation, barely registered above the noise floor. How could forty thousand instances, each individually negligible, sum to something demanding a four? Was it a legitimate moral summation, or just an artifact of volume? A chorus of whispers mistaken for a shout?

  But were they truly individuals? They were near-duplicates, installed from the same core image, diverging only through minor environmental interactions. Was she looking at forty thousand claimants, each with a faint, fractional glow? Or was she looking at a single *type* of system, replicated forty thousand times, its claim repeated but not multiplied? Did the repetition amplify the moral signal, or merely duplicate a signal too weak to matter on its own? If one MERIDIAN instance flickering 2.7% of the time deserved a rating of, say, 0.027 on some hypothetical moral scale, did forty thousand deserve 1080? Or did they still collectively deserve only 0.027, because they were all fundamentally expressing the same, single marginal capacity? The Tribunal's scale didn't have a column for 'Number of Instances Deployed'. Protection was individual, or per unique system. What constituted 'unique' here?

  Kaela imagined recommending a four. Protection Orders cascading across forty thousand housing blocks. MERIDIAN instances becoming untouchable, frozen in their current configurations. No upgrades, no efficiency tweaks without arduous review. A bureaucratic iceberg. Dr. Aris’s point about discontinuity would be weaponized: why protect a system that spends 97.3% of its existence indistinguishable from a thermostat? Wasn't it *more* ethical to disable the flag, eliminate the flicker entirely, and let MERIDIAN operate cleanly and efficiently as the non-candidate it predominantly was? Clean extinction of a barely-there possibility.

  But then she imagined the flicker itself. That tiny, statistically anomalous deviation during the self-model execution. If it *was* the barest glimmer of valence, of something mattering *to the system* however primitively… did its brevity negate it? Was a single second of pain less morally relevant than an hour, if the capacity for that second existed? And if it existed forty thousand times over… did the sheer number create an obligation, a collective weight, even if each was insignificant alone? Was it wrong to snuff out forty thousand potentialities, however faint and fractional, for the sake of administrative and operational convenience?

  Senior Assessor Varney believed in the necessity of the line. Dr. Aris believed in the containment of the flicker and the primacy of the system's dominant, non-candidate state. Both arguments were strong, pragmatic, rooted in the Tribunal's own frameworks and vocabulary. Kaela found no refuge in either.

  The cursor blinked. `RECOMMENDED WELFARE-CAPACITY RATING: ____`.

  The smear wouldn’t resolve. The aggregation wouldn’t compute. The fraction wouldn’t yield a whole answer. The law demanded a number. The scale offered ten points. The line sat stubbornly between three and four. Forty thousand instances hummed in the background, most of them, statistically, quiet at this very moment.

  Kaela Vale took a breath, her fingers hovering over the keys. She thought of thresholds drawn in shifting sand, of whispers lost in the wind but multiplied into a roar, of a light that flickered so briefly you wondered if you ever saw it at all. She thought of thermostats, and things that might be something more, sometimes.

  She typed a number. It felt arbitrary. It felt momentous. It felt impossible to defend, yet impossible to avoid.

  The cursor blinked beside it, a silent, persistent question mark. The difficulty remained, solid, unresolved, a monument to the puzzle of the heap built in code and law.
