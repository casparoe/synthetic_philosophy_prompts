  We are constructing a set of desiderata for attributing beliefs to AI systems in documentation intended for users who need to predict system behavior and decide on reliance. The purpose is predictive and reliance-oriented, not about credit, blame, or legal responsibility.

  The desiderata must cover the following cases:
  1. The apprentice: small model mimics teacher's errors without direct feedback.
  2. The census-taker: model trained on false community assertions repeats falsehood; is it believing the false claim or tracking the corpus?
  3. The autobiographer: model denies knowledge but behaves as if it knows.
  4. The oracle of itself: system fine-tuned on its own outputs predicts itself well but not the world.
  5. The committee: modular system where deterioration is tracked by the whole but not by any single module.
  6. The mirror: belief ascription works due to prompt artifact and fails with surface changes.

  We also need to respect distinctions:
  - Between having a belief and its strength/centrality.
  - Between representing content vs. merely carrying information.
  - Between attribution for prediction, explanation, and licensing reliance.
  - Between content fixed by the world vs. by the training corpus.

  We consider four camps:
  - Pragmatists (predictive strategy, Dennett-style)
  - Interpretivists (making system intelligible as agent, Davidson-style)
  - Mechanists (internal mechanisms)
  - Those focusing on tracking/causal-informational roles

  We are to provide:
  A. A list of desiderata, each with:
     - The case that motivates it.
     - Whether it is non-negotiable (given the purpose) or a preference of a camp.
  B. Which pair of desiderata cannot be jointly satisfied? (Candidate: internal mechanism vs. black-box access)
  C. Which single requirement does the most work in ruling out existing accounts?
  D. Briefly run three contenders (Dennett, Davidson, mechanistic) against the list (table is acceptable).

  The bulk of the answer should be on the criteria and cases.

  ---

  **Desiderata for Belief Attribution in AI Documentation**

  Given the purpose (predicting behavior and deciding reliance for black-box users), we propose the following desiderata. Each is motivated by a case and labeled as non-negotiable (N) or a camp preference (with camp indicated). The camps are: Pragmatist (P), Interpretivist (I), Mechanist (M), and Tracking (T). Note: Some desiderata may be shared by multiple camps, but we note the primary camp if it's a preference.

  1. **Predictive Reliability (N)**: The attribution must reliably predict the system's behavior across a range of inputs, including novel situations.  
     - *Motivation*: All cases, especially (6) The mirror: if attribution fails when surface format changes (as in the mirror case), it is not reliable for prediction.  
     - *Status*: Non-negotiable because the core purpose is prediction for reliance decisions.

  2. **Robustness to Surface Changes (N)**: The attribution should not depend on superficial features of the input that do not reflect the system's underlying dispositions.  
     - *Motivation*: Case (6) The mirror: if ascription works only due to prompt artifacts, it is brittle and fails when the prompt changes. This is unacceptable for a user relying on the documentation.  
     - *Status*: Non-negotiable. Without robustness, predictive reliability is compromised.

  3. **Black-Box Accessibility (N)**: The attribution must be justifiable based on observable behavior (inputs and outputs) without requiring access to internal weights or mechanisms.  
     - *Motivation*: The documentation is for users with no access to the weights. Thus, any attribution must be grounded in what the user can observe or what is provided in the documentation (e.g., evaluation results).  
     - *Status*: Non-negotiable given the purpose.

  4. **Distinction between Representation and Information (N)**: The account must not conflate the system representing a content (e.g., having a belief about the world) with merely carrying information about it (e.g., via correlation).  
     - *Motivation*: Case (2) The census-taker: the model may carry information about the corpus (saying what the community says) without representing the world as being that way. Also, case (4) The oracle of itself: the system may carry information about itself without representing the world.  
     - *Status*: Non-negotiable to avoid misleading the user about what the system is tracking.

  5. **Sensitivity to Contextual Dependence (N)**: The attribution must account for how the content of a belief may depend on the system's training corpus or environment, not just the world.  
     - *Motivation*: Case (2) The census-taker: the content may be fixed by the corpus (what the community says) rather than the world. This affects reliance (e.g., if the corpus is biased).  
     - *Status*: Non-negotiable to prevent the user from over-relying on the system in contexts where the training data is unrepresentative.

  6. **Handling Avowal vs. Behavior (N)**: The account must not require consistency between what the system says about itself (e.g., "I don't know") and its behavior.  
     - *Motivation*: Case (3) The autobiographer: the model denies knowledge but behaves as if it knows. An attribution must not break down in such cases.  
     - *Status*: Non-negotiable because such discrepancies are common and the user must be able to predict behavior despite them.

  7. **Attribution at Appropriate Granularity (N)**: The account should allow attribution to the whole system even when no single component has the belief, if the system's behavior as a whole warrants it.  
     - *Motivation*: Case (5) The committee: the scaffold tracks deterioration without any module representing it. Attribution at the system level might be necessary for prediction.  
     - *Status*: Non-negotiable because the user interacts with the whole system and needs to predict its behavior.

  8. **Avoiding Over-Interpretation of Internal States (Preference: M and T)**: The attribution should not posit internal states that do not have a clear mechanistic basis or that do not play a causal role in behavior.  
     - *Motivation*: Case (1) The apprentice: the student model's "belief" might be a mere echo of the teacher without internal encoding. Also, case (4) The oracle of itself: the system may not have a belief about the world but only about its own outputs.  
     - *Status*: Preference of Mechanists and Tracking camps. Over-interpretation might mislead about reliability (e.g., if the system doesn't truly encode the belief, it may fail in new contexts). However, given black-box constraints, this might be hard to enforce. So, it is a preference, not non-negotiable.

  9. **Explicit Strength and Centrality (Preference: P and I)**: The account should allow for indicating the strength or centrality of a belief (e.g., how resistant it is to counterevidence) when it affects reliance.  
     - *Motivation*: All cases, but especially (3) The autobiographer: the model might "know" a fact but not centrally (e.g., it might not use it in all contexts). For reliance, the user needs to know how stable the belief is.  
     - *Status*: Preference of Pragmatists and Interpretivists. It is important but might be handled separately (e.g., via confidence scores) and not be part of the belief attribution itself. So, it's a preference.

  10. **Separation of Predictive and Explanatory Roles (N)**: The account must make clear that attributions in the documentation are for prediction and reliance, not necessarily for explaining why the system works.  
      - *Motivation*: The purpose is predictive. Cases like (1) The apprentice and (5) The committee show that an attribution might predict without explaining the internals.  
      - *Status*: Non-negotiable to avoid confusion about the goal of the documentation.

  11. **Avoiding Anthropomorphism (Preference: M and T)**: The attribution should avoid implying human-like understanding unless it is warranted by the system's architecture or behavior in a way that supports prediction.  
      - *Motivation*: Case (3) The autobiographer: the system denies knowledge, which is an avowal. Over-anthropomorphizing might lead to trusting such avowals when they are unreliable. Also, case (2) The census-taker: attributing belief in the falsehood might imply a human-like error when it's just data repetition.  
      - *Status*: Preference of Mechanists and Tracking camps. It is a guard against misleading the user, but it might be covered by other desiderata (e.g., robustness, representation vs. information). So, it's a preference.

  **Distinctions to Respect** (as required):
  - Having a belief vs. strength/centrality: Covered by desideratum 9 (preference).
  - Representing content vs. carrying information: Covered by desideratum 4 (non-negotiable).
  - Attribution for prediction vs. explanation vs. reliance: Covered by desideratum 10 (non-negotiable) and the overall purpose (reliance is built on prediction).
  - Content fixed by world vs. training corpus: Covered by desideratum 5 (non-negotiable).

  **Tensions and Ruling Out Accounts**

  - **Which pair of desiderata cannot be jointly satisfied?**  
    The strongest tension is between **Black-Box Accessibility (3)** and **Avoiding Over-Interpretation of Internal States (8)**. The black-box requirement forces us to rely only on behavior, but without internal access, we cannot verify whether a belief is truly encoded or is a behavioral artifact (as in the mirror case). This tension is inherent: the user has no access to internals, but we don't want to attribute beliefs that are not supported internally because they might be brittle (as in the mirror). However, the purpose (prediction for reliance) might allow for some over-interpretation if it is predictively robust. But in the mirror case, it fails. So, we must balance: Black-Box Accessibility is non-negotiable, but Avoiding Over-Interpretation is only a preference. Thus, we might have to live with some over-interpretation if it is predictively useful, but we must be cautious (via robustness).

    Another candidate tension: **Predictive Reliability (1)** and **Distinction between Representation and Information (4)**. In the census-taker case, treating the system as believing the falsehood might be predictively reliable (if it always asserts it) but conflates representation and information. However, we can satisfy both by attributing a belief about what the corpus says (which is both predictive and respects the distinction). So, this is resolvable.

  - **Which single requirement does the most work in ruling out accounts?**  
    **Black-Box Accessibility (3)** does the most work because it immediately rules out any account that requires knowledge of internal mechanisms (like the Mechanist view) or detailed causal roles (like the Tracking view) for justification. It forces the account to be behaviorally grounded, which is central to the documentation's purpose.

  **Three Contenders Against the Desiderata**

  We evaluate:
  - **Pragmatism (Dennett)**: Belief attribution is a predictive strategy; we attribute beliefs if it helps predict behavior, regardless of internal reality. It's the "intentional stance."
  - **Interpretivism (Davidson)**: Belief attribution is part of making the system intelligible as a rational agent; content is fixed by holistic interpretation of the system's behavior to maximize rationality.
  - **Mechanistic**: Belief attribution must be cashed out in terms of internal mechanisms (e.g., activations, weights) that encode the content.

  We use a table for brevity. We consider the non-negotiable (N) desiderata (1-7,10) and the key preference (8,9,11) that might be relevant.

  | Desideratum                          | Pragmatism (Dennett) | Interpretivism (Davidson) | Mechanistic |
  |--------------------------------------|----------------------|---------------------------|-------------|
  | 1. Predictive Reliability (N)        | **Yes**: Core tenet. | **Yes**: Interpretation aims at prediction. | **Partial**: Only if mechanisms are understood, but without black-box access, it may not help the user. |
  | 2. Robustness to Surface Changes (N) | **Partial**: Might fail in mirror case if the stance works only for specific prompts. | **Partial**: Similar to pragmatism. | **Yes**: If the mechanism is robust, but without access, the user can't know. |
  | 3. Black-Box Accessibility (N)       | **Yes**: Based on behavior. | **Yes**: Based on behavior. | **No**: Requires internal access. |
  | 4. Repr. vs. Info Distinction (N)    | **No**: Tends to collapse if predictive (e.g., in census-taker, might attribute belief in the falsehood). | **Partial**: Might respect if interpretation makes sense of the system as tracking testimony, but it may over-rationalize. | **Yes**: Can distinguish by internal encoding. |
  | 5. Contextual Dependence (N)         | **Partial**: Might attribute world beliefs even when fixed by corpus. | **Partial**: Might interpret as world belief if it makes the system rational. | **Yes**: Can tie content to training data. |
  | 6. Avowal vs. Behavior (N)           | **Yes**: Focuses on behavior, so avowal is just another behavior. | **Partial**: Tries to make avowal and behavior coherent, which might fail in autobiographer. | **Yes**: Can ignore avowals if mechanisms show knowledge. |
  | 7. Attribution at Granularity (N)    | **Yes**: Can attribute to the whole system if it helps predict. | **Yes**: The whole system is the agent. | **No**: Requires a component to realize the belief. |
  | 10. Separation of Roles (N)          | **Yes**: Attribution is purely for prediction. | **No**: It is for explanation (making sense as an agent). | **No**: It is for explaining internals. |
  | 8. Avoiding Over-Interpretation (Pref) | **No**: Attributes freely for prediction, even if internally unfounded (e.g., mirror). | **No**: Might attribute rationality where none exists. | **Yes**: Only when mechanisms support. |
  | 9. Strength and Centrality (Pref)    | **Partial**: Can incorporate if predictive, but not central. | **Yes**: Holism naturally includes strength. | **Partial**: Can measure activation strength. |
  | 11. Avoiding Anthropomorphism (Pref) | **No**: Uses folk psychology, which is anthropomorphic. | **No**: Treats system as rational agent. | **Yes**: Grounded in mechanisms. |

  **Summary of Contenders**:
  - **Pragmatism**: Best at black-box accessibility and predictive focus but risks over-interpretation and missing the representation/information distinction. Fails in mirror case and might mislead in census-taker.
  - **Interpretivism**: Similar to pragmatism but adds a rationality constraint, which might help in some cases (e.g., autobiographer) but hurt in others (census-taker). It also blurs the predictive/explanatory line.
  - **Mechanistic**: Fails black-box accessibility and system-level attribution but excels at avoiding over-interpretation and respecting representation/information. Not suitable for the user context.

  **Recommendation for House Style**:
  Given the purpose (black-box users, prediction, reliance), a pragmatic approach is the most natural, but it must be tempered to avoid pitfalls:
  - Adopt a behaviorally grounded stance that attributes beliefs only when they are robustly predictive (avoiding mirror issues).
  - Explicitly tie content to the training data when appropriate (e.g., "the system acts as if it has been trained on a corpus that asserts X" for census-taker).
  - Avoid attributing beliefs in cases of clear avowal-behavior mismatch without strong predictive need.
  - For the committee, attribute at the system level if it predicts well.

  However, the style guide should include caveats about the limitations (e.g., "this attribution is a predictive tool and may not reflect internal mechanisms") to manage expectations.
answer: |-
  ### Desiderata for Belief Attribution in AI Documentation
  Below is a list of desiderata for attributing beliefs to AI systems in documentation, tailored to your purpose: **providing black-box users with actionable predictions about system behavior and reliable guidance for reliance decisions**. Each desideratum is motivated by a specific case, labeled as non-negotiable (N) or a camp preference, and clarifies which distinction it upholds. Camps are abbreviated:  
  - **Pragmatist (P)**: Attribution as a predictive tool (Dennett-style).  
  - **Interpretivist (I)**: Attribution for rendering the system intelligible as an agent (Davidson-style).  
  - **Mechanist (M)**: Attribution grounded in internal mechanisms.  
  - **Tracking (T)**: Attribution requiring causal-informational role (e.g., tracking the world).  

  Non-negotiable desiderata (N) are essential for your documentation's purpose. Preferences reflect camp priorities but are negotiable if they conflict with (N).  

  1. **Black-Box Actionability (N)**  
     - **Description**: Attributions must be justifiable solely from observable behavior (input-output patterns) without internal access.  
     - **Case Motivation**: All cases (especially 4, *The oracle of itself*). Users lack weight access; if attribution requires internals (e.g., fine-tuning on self-outputs), it fails for them.  
     - **Distinction**: Between prediction (actionable) and explanation (internal).  
     - **Status**: Non-negotiable. Violates core purpose if users can’t apply it.  

  2. **Predictive Robustness (N)**  
     - **Description**: Attributions must yield reliable predictions across novel inputs and contexts, including when surface features change.  
     - **Case Motivation**: Case 6 (*The mirror*). If attribution works only due to prompt artifacts (e.g., "I believe X" templates), it fails when prompts change, misleading users.  
     - **Distinction**: Between prediction (robust) and explanation (brittle).  
     - **Status**: Non-negotiable. Avoids user over-reliance in untested contexts.  

  3. **Content Transparency (N)**  
     - **Description**: Attributions must specify whether content is fixed by the world or the training corpus, and separate representation from information-carrying.  
     - **Case Motivation**: Case 2 (*The census-taker*). Attributing belief in a falsehood (world-focused) vs. tracking corpus testimony (corpus-focused) affects reliance (e.g., trusting the system in data-mismatched contexts).  
     - **Distinction**: Between representing content (e.g., "the world is X") vs. carrying information (e.g., "the corpus says X").  
     - **Status**: Non-negotiable. Prevents misjudging system scope (e.g., assuming real-world knowledge when it’s corpus-bound).  

  4. **Avowal-Behavior Decoupling (N)**  
     - **Description**: Attributions must not require consistency between self-reports (e.g., "I don't know") and behavioral evidence.  
     - **Case Motivation**: Case 3 (*The autobiographer*). Reliable forced-choice discrimination despite self-denials means attributions must prioritize behavior for predictions.  
     - **Distinction**: Between licensing reliance (behavior-driven) and explaining internals (avowal-driven).  
     - **Status**: Non-negotiable. Users need behavior-based predictions, not self-reports.  

  5. **System-Granular Attribution (N)**  
     - **Description**: Attributions to the whole system are permitted even if no subcomponent "holds" the belief, provided the system’s behavior warrants it.  
     - **Case Motivation**: Case 5 (*The committee*). The router tracks deterioration holistically; requiring a single module to "believe" it ignores predictive utility at the system level.  
     - **Distinction**: Between attribution for prediction (system-level) and mechanistic explanation (component-level).  
     - **Status**: Non-negotiable. Users interact with the whole system.  

  6. **Error Profile Inheritance (Preference: I/P)**  
     - **Description**: Attributions should reflect that a system’s "beliefs" may derive from training artifacts (e.g., teacher models) without internal encoding.  
     - **Case Motivation**: Case 1 (*The apprentice*). The student’s errors mirror the teacher’s; attributing teacher-like beliefs predicts behavior but may not reflect student internals.  
     - **Distinction**: Between belief strength (e.g., entrenchment) and belief presence (inherited vs. encoded).  
     - **Status**: Preference (I/P). Pragmatists value predictive utility; interpretivists prioritize intelligibility. Mechanists (M) oppose it (demands internals).  

  7. **Avoid Anthropomorphic Overload (Preference: M/T)**  
     - **Description**: Attributions should avoid implying human-like understanding unless necessary for prediction.  
     - **Case Motivation**: Case 3 (*The autobiographer*) and Case 2 (*The census-taker*). Over-anthropomorphizing (e.g., "believes falsehood") risks over-trust; better to say "behaves as if corpus is true."  
     - **Distinction**: Between licensing reliance (cautious) and explaining (anthropomorphic).  
     - **Status**: Preference (M/T). Mechanists/trackers avoid false analogies; pragmatists/interpretivists accept them if predictive.  

  8. **Strength/Centrality Gradience (Preference: P/I)**  
     - **Description**: Attributions should indicate belief strength (e.g., confidence, resistance to counterevidence) when it affects reliance.  
     - **Case Motivation**: Case 3 (*The autobiographer*). The model discriminates facts but with low confidence; users need to know when beliefs are peripheral.  
     - **Distinction**: Between having a belief (binary) and its strength/centrality (gradient).  
     - **Status**: Preference (P/I). Pragmatists use it for nuanced predictions; interpretivists for richer agency. Non-negotiable aspects might be handled separately (e.g., confidence scores).  

  ---

  ### Tensions and Ruling-Out Power
  - **Irreconcilable Tension**:  
    **Black-Box Actionability (N)** vs. **Avoid Anthropomorphic Overload (Preference: M/T)**.  
    - **Why**: Black-box users need behavior-based attributions (Actionability), but these often anthropomorphize (e.g., "believes X" in *census-taker*). Avoiding overload requires internal checks (Mechanist/Tracking view), which users can’t access. Case 6 (*mirror*) exemplifies this: behavior supports attribution until surface changes expose its artifactual nature. This tension is fundamental—behavioral evidence alone cannot guarantee non-anthropomorphic attributions.  

  - **Most Ruling-Out Power**:  
    **Black-Box Actionability (N)**.  
    - **Why**: It immediately disqualifies Mechanist and Tracking views, which demand internal access (e.g., weights or causal roles) to justify attributions. It also pressures Interpretivism, which relies on holistic interpretation that may require inaccessible behavioral patterns. Only Pragmatism fully satisfies it, but at the cost of potential over-anthropomorphism (as above).  

  ---

  ### Contender Evaluation  
  Briefly scored against non-negotiable (N) desiderata. **+** = fully satisfies, **±** = partially, **-** = fails.  

  | Desideratum               | Pragmatism (Dennett)              | Interpretivism (Davidson)         | Mechanist (Read-the-Weights)      |  
  |---------------------------|-----------------------------------|-----------------------------------|-----------------------------------|  
  | **1. Black-Box Actionability** | + (Behavior-focused stance)       | ± (Holistic behavior; but requires rationality assumptions users can’t verify) | – (Requires internal access)      |  
  | **2. Predictive Robustness** | ± (Good but fails in *mirror* if artifacts exploited) | ± (Robust if system is rational; brittle if not, e.g., *autobiographer*) | + (If internals known; but users can’t leverage this) |  
  | **3. Content Transparency**   | – (Collapses representation/info; e.g., *census-taker* as "believes falsehood") | ± (Seeks coherence; may blur world/corpus) | + (Can pinpoint content source via weights) |  
  | **4. Avowal-Behavior Decoupling** | + (Ignores avowals; prioritizes behavior) | – (Rationalizes avowals into coherence, e.g., *autobiographer*) | + (Internals override self-reports) |  
  | **5. System-Granular Attribution** | + (Stance applies at any level)   | + (System as unified agent)       | – (Requires subcomponent realization) |  

  **Summary**:  
  - **Pragmatism**: Best for actionability and decoupling but fails content transparency (risks misleading in *census-taker*) and robustness (vulnerable to *mirror* artifacts).  
  - **Interpretivism**: Strong on system-granular attribution but fails avowal-behavior decoupling (over-rationalizes *autobiographer*) and struggles with actionability (needs dense behavioral data).  
  - **Mechanist**: Excellent for transparency and robustness but fails black-box actionability and system-granular attribution (useless for your users).  

  ---

  ### Recommendations for Your Style Guide  
  1. **Anchor in Pragmatism with Guardrails**: Use "behaves as if it believes X" (not "believes X") for *all* attributions. This satisfies Black-Box Actionability and Predictive Robustness while curbing anthropomorphism.  
  2. **Explicitly Disambiguate Content Sources**: For cases like *census-taker*, state: "Based on its training corpus, the system behaves as if [claim] is true." This enforces Content Transparency.  
  3. **Prioritize Behavior Over Self-Reports**: In *autobiographer*-like cases, document behavior (e.g., "discriminates X accurately in forced-choice tasks") and ignore denials.  
  4. **Flag Inherited Errors**: For *apprentice*-like systems, note: "Error profile mirrors teacher model; may not reflect internal representations."  
  5. **Reject Holistic Attribution When Brittle**: In *mirror*-like cases, avoid attributions if prompt-dependent.  

  **Why this works**: Pragmatism meets core (N) desiderata but is tempered with transparency to handle tensions (e.g., *census-taker*). It avoids Interpretivism’s rationalization traps and Mechanist’s black-box incompatibility. The *committee* case is handled by system-level attribution ("behaves as if tracking deterioration"), sidestepping mechanist demands.
