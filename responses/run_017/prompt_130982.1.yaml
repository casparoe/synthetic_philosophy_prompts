  ### **Decision Tree for Anthropic Reasoning**

  **Start:** Your total evidence is third-party physical evidence + "I am *this* observer having *this* experience now."  
  *Answer the questions below to navigate the tree. Do not use technical terms—rely on your intuition.*

  1. **Incubator (Black Beard):**  
     A fair coin is flipped. Heads: one observer is created (black beard). Tails: two observers are created (one black beard, one white beard). You wake up and see you have a black beard. Your credence in heads is:  
     - **A: 1/2** → Go to Q2  
     - **B: 1/3** → Go to Q3  
     - **C: 2/3** → Go to Q4  

  2. **Sleeping Beauty (Amnesia Duplication):**  
     A fair coin is flipped. Heads: you are woken once. Tails: you are woken twice (with memory wipes). You wake up. Your credence in heads is:  
     - **A: 1/2** → Go to Q5  
     - **B: 1/3** → Go to Q6  

  3. **Unborn Crowd:**  
     A fair coin is flipped. Heads: you are created and woken once. Tails: you are created and woken once, and a year later 1,000 identical observers are created and woken once each. You wake up with no clue what year it is. Your credence in heads is:  
     - **A: 1/2** → Leaf: **No Indexical Updating**  
     - **B: ≈1/1001 (very low)** → Leaf: **Self-Indication Assumption (SIA)**  
     - **C: ≈1000/1001 (very high)** → Leaf: **SSA (Small Reference Class)**  

  4. **Reference Class Matters?**  
     (Same as Q1, but now you also notice you’re tall. In tails, the white-bearded observer is short.) How does learning you’re tall affect your credence in heads?  
     - **A: Unchanged (still 2/3)** → Go to Q7  
     - **B: Drops to 1/2** → Leaf: **SSA (Tall Observers Reference Class)**  

  5. **Doomsday & Presumptuous Philosopher (Combined):**  
     - *Doomsday:* Coin flip: heads = 100B humans total, tails = 100T humans total. You learn your birth rank is 60B.  
     - *Presumptuous Philosopher:* Coin flip: heads = 1 galaxy with observers, tails = 1,000 galaxies with observers. You learn you exist.  
     Do you update *in the same direction* in both? (E.g., both increase credence in heads, or both decrease, etc.)  
     - **A: Yes (e.g., both favor heads or both favor tails)** → Go to Q8  
     - **B: No (update differently)** → Leaf: **Self-Sampling Assumption (SSA)**  

  6. **Endless Room:**  
     Two hypotheses (H1, H2) about the universe. Non-indexical evidence equally supports both. H1: finite observers. H2: infinite observers. Your credence in H1 is:  
     - **A: 0 (infinite wins)** → Leaf: **SSA (Infinite Limit)**  
     - **B: Still 1/2** → Leaf: **Non-Indexical Conditioning**  
     - **C: Undefined/other** → Leaf: **Thirder (Sleeping Beauty Variant)**  

  7. **Action-Only Branch:**  
     In the Incubator (Q1), you’re offered $100 if heads is true, payable only if you accept a bet *now*. If you decline, nothing happens. What do you do?  
     - **A: Accept if P(heads) > 50% (so accept if you said 2/3 in Q1)** → Leaf: **Anthropic Decision Theory (ADT)**  
     - **B: Decline or indifferent** → Leaf: **Halfer (Sleeping Beauty Variant)**  

  8. **Infinite + Doomsday Consistency:**  
     In the Endless Room (Q6), if you chose A (H1=0), does the Doomsday argument *still* work (i.e., does learning your birth rank update your credence)?  
     - **A: Yes** → Leaf: **Full Non-Indexical Conditioning**  
     - **B: No** → Leaf: **Unnamed: SSA + Infinity Adjustment**  

  ---

  ### **Leaf Descriptions**  
  - **Self-Sampling Assumption (SSA)**: Committed to updating on being a random observer from all *actual* observers. Awkward: Presumptuous Philosopher (favors large universes).  
  - **Self-Indication Assumption (SIA)**: Committed to weighting theories by number of *possible* observers. Awkward: Unborn Crowd (credence ≈1/1001 for heads).  
  - **SSA (Small Reference Class)**: Committed to SSA with minimal reference class (e.g., "observers like me"). Awkward: Incubator + height (credence drops to 1/2).  
  - **SSA (Tall Observers Reference Class)**: Committed to reference-class specificity. Awkward: Arbitrary reference classes undermine objectivity.  
  - **No Indexical Updating**: Committed to ignoring indexical info (e.g., your existence). Awkward: Sleeping Beauty (credence=1/2 ignores amnesia).  
  - **Non-Indexical Conditioning**: Committed to conditioning only on non-indexical evidence. Awkward: Endless Room (credence=1/2 even for infinite).  
  - **Thirder (Sleeping Beauty Variant)**: Committed to 1/3 in Sleeping Beauty. Awkward: Inconsistent with SSA in some cases.  
  - **Halfer (Sleeping Beauty Variant)**: Committed to 1/2 in Sleeping Beauty. Awkward: Incubator (if 2/3, violates betting intuition).  
  - **Anthropic Decision Theory (ADT)**: Committed to decisions, not beliefs (uses betting behavior). Awkward: No "true" credence, only actions.  
  - **Full Non-Indexical Conditioning**: Committed to no anthropic updates. Awkward: Doomsday argument fails entirely.  
  - **SSA (Infinite Limit)**: Committed to SSA but ignores infinities. Awkward: Endless Room (H1=0, but Doomsday still works).  
  - **Unnamed: SSA + Infinity Adjustment**: Committed to SSA with infinity handling. Awkward: Breaks Doomsday in infinite cases.  

