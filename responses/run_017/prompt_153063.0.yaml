prompt: |-
  Retired atmospheric chemist here, 71, and since I stopped work I've been reading philosophy blogs in the evenings and arguing with my brother-in-law over email, which is where these came from. I've got stuck on two puzzles: one where a being with a perfect model of you flips a coin, it comes up tails, and asks you for $100 on the strength of "if it had come up heads and you'd have paid, I'd have given you $10,000", and one where a blackmailer's letter only reaches you because of what a predictor said you'd do. I made up a pile of variations and I trust my gut on most of them, but I can't see what it is I actually believe. Can someone tell me what principle fits?

  1. The coin one, tails, as above. I'd pay. Obvious to me. My brother-in-law says the coin's already landed and I'm burning a hundred dollars on nothing.

  2. Ordinary blackmail, no prediction anywhere: someone has emails that would end my marriage, wants $5,000, one shot, they'll never be back. I'd pay. Gritted teeth, but the arithmetic isn't interesting.

  3. Letter version: the letter says I'll publish unless you pay, and I only send these to people my predictor says will pay. The predictor has never been wrong. I would NOT pay, and the reason I'd give is that I want to be the kind of person who never gets that letter. But once the letter is physically in my hand every instinct says pay, so I'm not sure I trust the reason.

  4. Same as 3, except the predictor is right about 70% of the time, so plenty of the people who get letters were predicted wrong and plenty of non-payers never hear from him. I'd pay here. And I know that's in tension with 3 — if refusing is right when the predictor is perfect, it ought to be even more right when the predictor is sloppy — but my gut just flips. Which of the two has to go?

  5. Same letter, same threat, but the prediction isn't about this decision at all: he only writes to people his predictor says would hand $100 to a stranger who asked politely. I'd pay. Feels like case 2 again: the letter's already posted, nothing I decide now changes whether it arrived.

  6. Mirror image of 3: he only writes to people his predictor says will NOT pay. I'd pay, but it makes me uneasy in a way case 5 doesn't. Here handing over the money is exactly what keeps me out of the situation in the first place, and that feels like I'm managing the prediction rather than making a decision. Maybe that's fine. Maybe it's the tell that I've lost the plot.

  7. No prediction at all, but he works the whole neighbourhood, everyone knows who paid, and the people who paid get a second letter. I wouldn't pay. I realise that's just deterrence and has nothing to do with cases 3 to 6 — I'd like a principle that doesn't quietly mush the two together.

  8. The one I genuinely can't call. The letter arrives and it says: I asked my predictor what you would have done if this letter had reached you yesterday, before you'd ever heard of me or of this setup; it said you'd have paid; that's why I'm writing. Nothing I predicted concerns the choice you're making now, because yesterday's you didn't know any of this. Do I pay? I've went back and forth for a week.

  So: is there one principle — something about what your decision is really a decision about, or which counterfactual branch you're meant to care about, or what you'd have wanted to commit to before the letter came — that delivers 1 through 7? And what does it say about 8, and about a case 9 you think I should have thought of? If it can't have all seven, tell me which verdict to drop and why that one rather than another. And if the honest answer is that 7 needs a different principle from the rest, say so, and say where the join between them is. I'm not after names or papers — I can't look anything up from here anyway — just the principle, stated precisely enough that I can test it on the next variation my brother-in-law emails me. That's definately coming.
reasoning: |-
  Okay, let me tackle this atmospheric chemist's philosophical puzzles. He's clearly thought deeply about decision theory and counterfactuals, given his detailed scenarios. The core tension revolves around how our present decisions should interact with predictions of those decisions—especially when the prediction seems to "lock in" outcomes based on our hypothetical behavior.

  First, I notice his intuitions split along a key line: whether the predictor's model references the *current* decision (cases 3,4,6,8) or something unrelated (case 5). When the prediction directly concerns the choice at hand—like paying blackmail—he resists "managing the prediction" (case 6 unease) but pays when prediction is imperfect (case 4). This suggests his gut distinguishes between self-referential predictions and external ones.

  His case 3 vs case 4 conflict is particularly telling. With a perfect predictor, refusing payment *feels* right because it would mean never receiving the letter—but he admits this might not hold if actually faced with the letter. This exposes a clash between pre-commitment reasoning ("I wish I were non-paying type") and actual consequence-facing ("but now the damage is done"). 

  For case 8—where the predictor models his *ignorant* self—I think he's wrestling with time-sliced agency. The prediction isn't about his current informed decision, but about a past counterfactual version of himself. That creates a weird loop: paying validates the predictor's model of his past self's hypothetical action, which justified the blackmail. But refusing might feel like rejecting the model's accuracy, though logically it can't affect the already-sent letter.

  The coin case (1) is simpler: he pays because the counterfactual world where heads+payment leads to $10k is worth the $100 risk. His brother-in-law's objection misses that the coin flip outcome doesn't negate the dependency between payment decisions across possible worlds.

  Case 7 is indeed different—it's about repeated games and deterrence, not prediction. His correct instinct to separate it suggests he intuits game theory vs decision theory boundaries.

  A unified principle might be: *Treat predictors as revealing information about your fixed dispositions, not as forces you can control. When a prediction references your current choice, act as if your decision type is already set; when it doesn't, focus on direct consequences.* 

  This explains:
  - Paying in case 1 (disposition fixed, counterfactual matters)
  - Paying in case 2 (standard consequence)
  - Refusing in case 3 (being the "non-payer" type avoids future targeting)
  - Paying in case 4 (imperfect prediction means type isn't fully fixed)
  - Paying in case 5 (prediction unrelated to current choice)
  - Unease in case 6 (paying *changes* your type relative to the predictor's model)
  - Refusing in case 7 (deterrence is strategic, not metaphysical)

  For case 8: the predictor models a past counterfactual you, so your current payment doesn't alter your "type"—it just accepts the model's accuracy. Paying becomes the consistent choice, even if meta-awkward.
answer: |-
  Your gut instincts reveal a clear, consistent principle: **act as if your decision reveals your disposition, and prioritize being the type of person who avoids harmful correlations.** This is a refined form of *evidential decision theory* (EDT) with a pre-commitment twist. Below, I'll state the principle, apply it to all your cases, resolve tensions, and handle your tricky Case 8.

  ---

  ### **The Core Principle**
  > **"Your choice is evidence of your disposition. Act to minimize the correlation between your disposition and bad outcomes, *unless* the predictor’s model is decoupled from your current decision."**  
  >   
  > **Key implications:**  
  > - If a predictor’s model directly references your *current* choice (e.g., "predicts whether you pay *this* blackmail"), your action reveals your "type." Refusing breaks the link between your type and being targeted.  
  > - If the predictor’s model references a *different* decision or a *past counterfactual* you, focus on immediate consequences (like ordinary blackmail).  
  > - Pre-commit to being the "non-targetable" type, but honor this only when the predictor’s accuracy depends on your disposition.

  ---

  ### **Applied to Your Cases**
  1. **Coin flip (tails, $100 for $10k counterfactual): PAY**  
     - The model isn’t about *you* avoiding targeting—it’s a bet on a counterfactual outcome. Paying $100 is rational: if the coin were heads, you’d gain $9,900. The outcome is decoupled from your "type."  
     - *Brother-in-law misses*: Decision theory cares about dependencies across possible worlds, not just actual outcomes.  

  2. **Ordinary blackmail ($5k to save marriage): PAY**  
     - No predictor. Pure consequence-minimization: pay to avoid disaster.  

  3. **Letter from perfect predictor (predicts payment): REFUSE**  
     - Paying *confirms* you’re the "payer" type, making you a target. Refusing makes you the "non-payer" type—the predictor wouldn’t have sent the letter. Your gut conflict is real: once the letter arrives, paying feels urgent, but pre-commitment to being non-targetable overrides this.  

  4. **70% accurate predictor: PAY**  
     - Imperfect prediction breaks the tight link between your choice and being targeted. Many non-payers get letters (false positives), and payers avoid them (false negatives). Refusing doesn’t reliably make you "safe," so minimize immediate harm: pay.  
     - **Tension resolved:** With perfect accuracy (Case 3), refusing *guarantees* you avoid the letter. With 70% accuracy, it doesn’t. The principle flexes: when correlation is weak, prioritize consequences.  

  5. **Predicts unrelated act (e.g., "gives $100 to stranger"): PAY**  
     - The predictor models a *different* disposition (generosity), not your blackmail response. Your payment doesn’t reinforce targeting for *this* threat. Treat as ordinary blackmail (Case 2).  

  6. **Predicts you will NOT pay: PAY**  
     - Paying here *contradicts* the predictor’s model. You’re no longer the "non-payer" type, so future predictors won’t target you. Unease is warranted: you’re "managing the prediction," but correctly—it updates your type away from vulnerability.  

  7. **Public deterrence (non-prediction): REFUSE**  
     - Different principle: *deterrence through repeated games*. Paying invites repeat attacks. Refusing signals resilience. This is game theory, not prediction-management. The core principle doesn’t apply—no dispositional correlation to exploit.  

  ---

  ### **Case 8: The Counterfactual You**
  > *Letter says: "My predictor modeled what you’d do if this letter reached you *yesterday* (before you knew anything). It said you’d pay. That’s why I wrote."*  
  >   
  > **VERDICT: PAY**  
  > - **Why?** The predictor modeled a *past, ignorant version* of you. Your *current* decision doesn’t affect that model—it’s locked in. Refusing won’t make the predictor "wrong"; it only burns you.  
  > - **Analogy:** Like Case 5, the prediction is decoupled from your present disposition. The letter is already sent; your choice is about consequences now.  
  > - **Gut check:** You’d pay in Case 5 for the same reason. The "yesterday" framing is a red herring—it still references a hypothetical *different* scenario (your ignorant self).  

  ---

  ### **Case 9: The Test Variation**
  > *Predictor flips a coin. If heads, it predicts your choice and sends the letter only if predicted to pay. If tails, it sends the letter unconditionally. You receive the letter. Do you pay?*  
  >   
  > - **Principle says: REFUSE**  
  >   Receiving the letter is *evidence* the coin was more likely heads (since heads triggers selective sending). If you pay, you reinforce the "payer" disposition, making future targeting likely. Refusing weakens that link.  
  > - *Contrast with Case 4:* Here, the coin adds uncertainty about *why* you received the letter, creating a correlation to break.  

  ---

  ### **Why Your Instincts Hold (Mostly)**
  - **EDT + Pre-commitment explains 1-7:** You intuitively balance evidence (your choice reveals your type) and consequences (when evidence is irrelevant).  
  - **Case 4 tension resolved:** Accuracy matters. Perfect predictors make your type *causal*; noisy ones don’t.  
  - **Case 6 unease:** Paying *changes* your type—this is rational self-updating, not delusion.  
  - **Case 7 excluded:** Deterrence is orthogonal. No predictor = no dispositional correlation.  

  ### **When to Override the Gut**
  In Case 3, your "pay instinct" when holding the letter is myopic. Trust the pre-commitment: refusing *is* burning $5k now, but it buys immunity from future attacks. The perfect predictor makes this a one-time cost for permanent safety.

  This principle handles all your cases, including Case 8. For your brother-in-law: *"My choice isn't just about now—it's about what it says about me. Unless the predictor's playing a different game, I won't feed the machine."* Next variation? I’m ready.
