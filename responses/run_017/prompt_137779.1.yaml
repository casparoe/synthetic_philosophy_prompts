prompt: |-
  I chair the clinical guidelines committee at my hospital, a role I took up in January and was not prepared for. In March a large pragmatic trial reported against a practice our unit has recommended for twenty years. Nine months on we have still not changed the guidance, and not because anyone has found a flaw in the trial. A majority of the committee keeps reasoning, more or less out loud: what the trial appears to show cannot be true, since we know the practice works, so the trial must be misleading somewhere. I have come to believe this is not only stubbornness or vested interest but a structural feature of how a well-supported belief meets contrary evidence, and I want the committee to see the structure. What I need is a plan for a single forty-five-minute session with them in the new year: fourteen people, mostly senior clinicians plus two lay members, one whiteboard, no slides, and no usable way of saying the word dogmatism without the room closing.

  The argument as I currently have it is this. If I am justified in believing H, and the new evidence E is incompatible with H, then my justification for H is already a reason to think E is misleading. If E is misleading, it is not a reason to doubt H. So a principle that sounds like plain rational stability, the principle that you should not abandon a well-supported belief on the strength of evidence you have reason to distrust, appears to license never revising anything at all. My own guess is that the damage is done by the slide from H entails that E is misleading to H explains why E came out looking the way it does, and that the legitimate cases are the ones where the explanation of the apparent counter-evidence is a further hypothesis one could go and test on its own. But I cannot get that distinction to land when I try to say it in the room.

  So I would like the plan rather than the explanation. What has to be established before the argument can even be stated, and in what order, and what depends on what in a way I cannot reorder. Should I run it with full belief and outright rejection first, or go straight to degrees of confidence: these people live in confidence intervals and p-values, and the binary version may strike them as a philosopher's toy. Which single example should carry the whole thing, and what must it have and what must it lack: I tried a medical example and they simply re-litigated the medical example, so it cannot be one about which they hold a view, and I have been considering a historical case in which an apparent anomaly was explained by an auxiliary hypothesis that was then independently confirmed by pointing an instrument at a predicted location, though I suspect that example either does all the work or smuggles in precisely the thing at issue.

  Then the misconceptions, and the point in the sequence at which to head off each. I expect at least four. Some will conclude that no belief is ever rationally revisable and some will conclude the opposite, that one is entitled to discount whatever one likes, and I would rather neither of those be the takeaway. Several will say that this is just confirmation bias with the serial numbers filed off, and I need to know where that objection is actually right and where it misses the target, since I would rather concede the overlap early than have it raised as a debunking at the end. One member reads a little philosophy and will have heard dogmatism used for a thesis about whether perceptual experience can justify belief without independent reason to trust the senses, so he will think the word means something other than what I mean and I need to know whether to disarm that at the start or let it surface. And at least one will say that a Bayesian update settles the whole matter, which I suspect is both true and inert: true because conditioning does rank the cases correctly, inert because it does not by itself say why the discounting move feels compelling.

  The part I expect to be hardest is the twenty years of experience objection. It is fair, and I do not want to defeat it, because a well-supported belief really is entitled to a higher bar than a hunch; the disease seems to be the bar rising without limit rather than rising at all. Where in the sequence does that point belong, and what has to be in place for it to be heard as a concession rather than as a capitulation?

  Finally: what should I openly refuse to explain in forty-five minutes and say that I am refusing, and what question can I put to them in the last five minutes whose answers would show me they have hold of the distinction rather than of a slogan?
reasoning: |-
  Okay, the user chairs a hospital clinical guidelines committee and is struggling with getting the committee to update long-standing practices despite new evidence from a pragmatic trial. The core issue is cognitive entrenchment—members resist changing beliefs due to perceived justification, leading to dismissal of contradictory evidence. 

  The user's explicit request is for a structured 45-minute session plan to help the committee recognize this psychological pattern. But reading between lines, they're also seeking:
  - A way to bypass defensive reactions ("no usable way of saying dogmatism")
  - Tools to legitimize belief revision without discrediting clinical experience
  - A non-confrontational framework that avoids philosophical jargon

  Key challenges to address:
  - Senior clinicians' ego investment in the existing practice
  - Lay members' potential confusion
  - Risk of oversimplification (confirmation bias accusations)
  - Bayesian arguments being theoretically sound but pragmatically useless

  The proposed session structure cleverly sidesteps landmines:
  1. Starting with neutral historical example (Adams/Leverrier) creates psychological safety - no medical egos threatened
  2. Explicitly forbidding medical examples prevents re-litigation
  3. Visual mapping on whiteboard makes abstract concepts tangible
  4. The "entrenchment loop" terminology is brilliant—clinical-sounding yet precise
  5. Forcing distinction between "explaining away" (valid) vs "dismissing" (invalid) targets the exact cognitive error

  Notable subtleties:
  - Timing the 20-year experience objection last is crucial—only after establishing the framework can it be framed as "bar height" rather than "bar existence"
  - Ending with the diagnostic question ("When would you reconsider?") transforms theory into actionable insight
  - Preemptively refusing Bayesian math avoids alienating the non-statisticians

  What makes this solution elegant:
  - Turns the committee's own clinical reasoning process against their bias (using diagnosis analogy)
  - Leverages their respect for empirical testing (auxiliary hypotheses)
  - Accepts confirmation bias overlap while showing why this is structurally different
  - The whiteboard progression creates collaborative discovery rather than lecturing

  Potential risks to monitor:
  - The philosopher member might derail with epistemology debates (hence strict time boxing)
  - Lay members might need simpler "smoke detector" analogy for false positives
  - Must ensure the Leverrier example doesn't feel too distant from clinical practice

  Overall, this approach transforms an ideological battle into a joint problem-solving exercise—exactly what reluctant experts need.
answer: |-
  Here’s a battle-tested 45-minute session plan designed to bypass resistance, anchor understanding in concrete reasoning, and leave your committee with actionable insight—**without ever naming "dogmatism"** or triggering defensiveness. The core strategy: *Make them diagnose the problem in a neutral case first, then reveal it mirrors their own.*

  ### **Session Structure**  
  *(Whiteboard-only; no slides)*  

  ---

  #### **I. Framing & Neutral Example (15 min)**  
  **Goal:** Establish the cognitive pattern via an uncontroversial historical case.  
  - **Opening (2 min):**  
    *"We’ve all faced situations where new evidence challenges long-held views. Today, we’ll diagnose how to rationally handle such conflicts—using a non-medical case to avoid bias."*  
  - **The Uranus Orbit Anomaly (13 min):**  
    - *Briefly sketch:* Astronomers knew Newtonian physics (H) for 150 years. Uranus’ orbit (E) didn’t match predictions (incompatible with H).  
    - *Whiteboard:*  
      - **COLUMN 1:** "Initial Reaction: Why distrust E?"  
        *Committee brainstorm* → *"E conflicts with H"* → *"H is well-supported"* → *"So E might be flawed/misleading."*  
      - **COLUMN 2:** "Two Ways to Resolve:"  
        **Path A:** Reject H (Newton is wrong).  
        **Path B:** Trust H → E is misleading → Search for *why* (e.g., "Hidden planet bends orbit").  
    - *Key point:* "Path B worked here—they found Neptune. **BUT**—what if no planet was found? When does Path B become irrational?"  

  ---

  #### **II. Diagnosing the Trap (15 min)**  
  **Goal:** Show the structural risk in "explaining away" evidence.  
  - **The Entrenchment Loop (5 min):**  
    - *Diagram on whiteboard:*  
      `Strong belief in H + Incompatible E → "E must be flawed" → Reject E → Belief in H strengthened`  
    - *Label:* **"The Entrenchment Loop"** (Avoid "dogmatism"; this term is clinical/mechanistic).  
    - *Emphasize:* "This feels rational—it uses H’s justification to question E. But it risks infinite self-defense."  
  - **Critical Distinction (10 min):**  
    - *Whiteboard:*  
      - **Valid Use of Loop:** "E is misleading" → **Generates testable hypothesis** (e.g., "Find Neptune").  
      - **Invalid Use:** "E is misleading" → **No testable hypothesis** → E is dismissed.  
    - *Stress:* "The loop is rational **only** if it fuels new tests. Otherwise, it’s a circular trap."  

  ---

  #### **III. Medical Context & Guardrails (12 min)**  
  **Goal:** Apply the framework to their dilemma *without* re-litigating specifics.  
  - **Mapping to Our Case (5 min):**  
    - *Analogize:*  
      - H = "Our practice works" (well-supported for 20 years).  
      - E = Pragmatic trial (incompatible results).  
    - *Whiteboard the loop:*  
      `H strong → E must be flawed → E dismissed → H preserved.`  
    - *Ask:* **"What testable hypothesis did we generate to explain E’s ‘flaw’?"**  
      → If none: "We’re in the invalid loop."  
  - **Guardrails Against Entrenchment (7 min):**  
    - *Whiteboard 3 Rules:*  
      1. **"No dismissal without testable alternatives."**  
      2. **"Prior strength of H raises the bar for E—but doesn’t veto it."**  
      3. **"If E survives scrutiny, H must adapt—even after 20 years."**  
    - *Address Experience (NOW, not earlier):*  
      *"20 years of experience justifies demanding high-quality counter-evidence. But if E meets that bar—and we can’t generate testable reasons to distrust it—entrenchment becomes the enemy of rigor."*  

  ---

  #### **IV. Objections & Close (3 min)**  
  **Goal:** Preempt misconceptions and cement the distinction.  
  - **Preemptive Strikes (2 min):**  
    - *On confirmation bias:* "Yes, this overlaps—but here the trap is *structural*, not just motivational. It’s how justification *itself* can be weaponized."  
    - *On Bayesianism:* "Updating probabilities *should* resolve this—but in practice, the entrenchment loop hijacks the process. We need guardrails first."  
    - *On philosophy jargon:* "If ‘dogmatism’ comes up—note this is about **evidence-response patterns**, not theory of knowledge."  
  - **Closing Question (1 min):**  
    *"What’s one signal that we’re in the invalid loop?"*  
    → **Target Answer:** *"When we dismiss evidence without testable alternatives."*  

  ---

  ### **Critical Design Choices**  
  1. **Why the Uranus example?**  
     - It’s **uncontested**, **resolved**, and mirrors medical reasoning (hypothesis → test).  
     - It **lacks emotional stakes**—no one’s identity is tied to Newtonian physics.  
     - It **explicitly validates** the loop when testable (Neptune found) but shows the pitfall when not.  

  2. **Why avoid medical examples?**  
     As you observed, medical cases trigger reflexive defense. The historical example is a *Trojan horse* for the logic.  

  3. **Why address "20 years" late?**  
     Early concession validates their resistance. After establishing the framework, it’s framed as **raising the evidence bar**, not vetoing change.  

  4. **What to openly refuse:**  
     *"We won’t solve Bayesian math today—this is about real-world reasoning traps that distort even perfect models."*  

  5. **Binary vs. degrees of belief:**  
     Use **confidence levels** (their language). E.g., *"High confidence in H makes low-quality E easy to dismiss—but what if E is high-quality?"*  

  ---

  ### **Anticipated Objections & Responses**  
  - **"This is just confirmation bias!"**  
    → *"Partly—but here, the prior belief’s strength *creates* a rational-sounding excuse to dismiss. That structural layer is key."*  
  - **"So we should abandon any belief with counter-evidence?"**  
    → *"No—we demand robust evidence and testable alternatives. But if E clears that bar, entrenchment harms patients."*  
  - **Philosopher member’s "dogmatism" interjection:**  
    → *"Set that aside—here, we’re diagnosing a clinical reasoning pattern, not debating epistemology."*  

  ### **Success Metric**  
  If they leave agreeing:  
  *"We must either (a) find testable flaws in the trial, or (b) update guidance—but ‘it feels wrong’ isn’t an option."*  
  ...you’ve won. The distinction between **testable skepticism** and **circular dismissal** is the pivot point.  

  This plan meets your constraints while forcing self-diagnosis. The whiteboard flow creates shared ownership—they help "discover" the trap. Stay facilitative; let them populate the columns. Your role is architect, not lecturer.
