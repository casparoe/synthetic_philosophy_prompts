answer: |-
  Here's a battle-tested Q&A prep sheet tailored to your audience and thesis. Prioritized by likelihood/damage, with tactical notes:

  ### **Objection 1: "This just smuggles in timidity. Why not use a hard cutoff for tiny probabilities?"**  
  *(Likely: Longtermist EAs, 90% chance / Damage: High - undermines core innovation)*  
  **Phrasing:** *"Your volatility discount is just a de minimis rule with extra steps. If we shouldn't trust extreme magnitudes, why not assign 0% weight to theories below 1% credence and maximize over the rest? This feels like cowardice disguised as humility."*  
  **Reply (1.5 min):** "Hard cutoffs create cliff edges: 0.99% credence theory gets ignored, 1.01% gets full weight. Volatility discount smoothly scales influence with *robustness* – a 5% credence theory with stable magnitudes gets more say than a 5% theory with wild swings. Crucially, it *doesn't* silence small-credence theories when they align with others (e.g., anti-torture views), only when they demand extreme sacrifice for speculative gains. This isn’t timidity—it’s demanding proportional epistemic warrant for high-stakes demands."  
  **Concede:** "Yes, both approaches reject fanaticism. But cutoffs are arbitrary; discounts respond to evidence."  
  **Hold:** "Magnitude robustness is a distinct epistemic virtue."  
  **Soft Spot:** If pressed, concede discount *can* approach zero weight for ultra-extreme/unstable theories.  

  ---

  ### **Objection 2: "Your view collapses into expected choice-worthiness maximization once you add the constraints."**  
  *(Likely: Academics, 85% chance / Damage: Critical - invalidates novelty)*  
  **Phrasing:** *"The evidential floor sounds like normalized weights, and volatility discount is just variance-weighting. Aren't you sneaking in intertheoretic comparisons to build a new 'super-theory' and maximize its EV?"*  
  **Reply (2 min):** "No – because the output isn't a choice-worthiness function! The parliamentary vote *doesn't require comparing magnitudes across theories*. Theories 'vote' on actions using their *own* scales, subject to constraints. Volatility discount tweaks *influence*, not the content of their verdicts. The floor caps influence based on hypothetical bargaining, not cardinal comparisons. Expected maximization *requires* global scaling; we sidestep that by aggregating votes, not utilities."  
  **Concede:** "If you *could* construct a super-theory, it might resemble this. But our constraints are procedural, not axiomatic."  
  **Hold:** "No intertheoretic comparisons are needed."  
  **Soft Spot:** If bargaining requires utility comparisons, the floor *might* smuggle them in. Stress: bargaining uses theory-specific *ordinal* rankings.  

  ---

  ### **Objection 3: "This is dynamically inconsistent. You'll regret choices when evidence shifts."**  
  *(Likely: Decision Theory/ML, 80% chance / Damage: High - rationality failure)*  
  **Phrasing:** *"Suppose action A wins today under your model. New evidence slightly increases credence in a volatility-sensitive theory that prefers B. Now B wins, but you already took A! Isn't this a money pump?"*  
  **Reply (1.5 min):** "Only if you assume *fixed* volatility assessments. But volatility is evidence-responsive! If new data stabilizes a theory's magnitude estimates (e.g., better population ethics models), its discount decreases. You wouldn't reverse the *same* decision, because the discount factor updates. We reject rigid priors – humility is dynamic."  
  **Concede:** "With *static* volatility measures, inconsistency is possible."  
  **Hold:** "Volatility must track empirical uncertainty about magnitudes."  
  **Soft Spot:** Requires clear volatility update rules. Have examples ready (e.g., new neuroscience of suffering).  

  ---

  ### **Objection 4: "The bargaining floor is underspecified/unworkable. Who bargains? Over what?"**  
  *(Likely: Academics, 75% chance / Damage: Medium - impracticability)*  
  **Phrasing:** *"A 'hypothetical bargain' among theories is metaphorical nonsense. Theories aren't agents. Do we use Nash bargaining? With what threat points? This seems either arbitrary or reducible to your credences."*  
  **Reply (1 min):** "Bargaining occurs over actions across possible futures. Threat point: 'no agreement' = default action (e.g., status quo). We use your credences as bargaining weights. It’s not metaphorical – it’s a constrained optimization: maximize product of theory utilities weighted by credence, subject to ordinal rankings. Implementable via social choice algorithms."  
  **Concede:** "Yes, it requires specifying a reasonable default."  
  **Hold:** "The floor *must* bind when evidence is absent – otherwise fanatics dominate."  
  **Soft Spot:** Default action selection needs justification.  

  ---

  ### **Objection 5: "Volatility discount disfavors theories with sharp thresholds!"**  
  *(Likely: Academics, 60% chance / Damage: Medium - fairness)*  
  **Phrasing:** *"Deontological theories often have step-function verdicts (e.g., 'don't kill > kill'). Your discount penalizes them for 'volatility' near thresholds. But that's their structure!"*  
  **Reply (1 min):** "Discount applies only to *magnitude*-driven swings, not threshold existence. If a theory says 'killing is -1000 utils worse than theft', but its evidence only supports 'killing is much worse', discount applies to the -1000. But the verdict reversal at the threshold? Undiscounted – that's core to the theory. We penalize false precision, not categorical distinctions."  
  **Concede:** "Thresholds near choice boundaries need careful handling."  
  **Hold:** "Magnitudes without evidence deserve skepticism."  
  **Soft Spot:** Distinguishing "threshold definition" vs. "magnitude specification" in practice.  

  ---

  ### **Objection 6: "How is this computationally feasible? Show me the math."**  
  *(Likely: ML/Decision Theory, 70% chance / Damage: Low if unprepared)*  
  **Phrasing:** *"In high-dimensional action spaces with 50+ theories, how do you compute the parliamentary vote + constraints? Volatility estimation alone sounds like a Monte Carlo nightmare."*  
  **Reply (1 min - have a slide ready):** "For implementation:  
  1. **Volatility**: Sample nearby actions (e.g., perturbing resource allocation %s). Estimate theory-specific variance. Discount = 1/(1 + k*variance).  
  2. **Floor**: Precompute bargaining weights offline via ordinal game theory.  
  3. **Voting**: Use weighted majority with capped influences.  
  This scales like Bayesian optimization – costly but parallelizable. We have a PyTorch prototype."  
  **Concede:** "Yes, it's harder than naive EV. But tractable for policy-scale decisions."  
  **Hold:** "Feasibility isn't an objection to validity."  
  **Soft Spot:** Real-time decisions (e.g., autonomous vehicles) may need approximations.  

  ---

  ### **Objection 7: "This violates Pareto or other decision axioms."**  
  *(Likely: Academics/Decision Theory, 50% chance / Damage: Medium)*  
  **Phrasing:** *"If every theory prefers A over B, but your volatility discount demotes a theory that strongly favors A, could B win? That violates Pareto!"*  
  **Reply (1 min):** "Impossible. Discounts only reduce a theory’s voting weight – they never reverse its verdict. If all theories rank A>B, A wins unanimously regardless of discounts. Constraints only affect *how much* a theory sways close calls."  
  **Concede:** "None needed – this is a misunderstanding."  
  **Hold:** "Pareto holds."  
  **Soft Spot:** If a theory's verdict flips *after* discounting (it shouldn't!), trouble.  

  ---

  ### **Objection 8: "Why not just use variance-adjusted EV maximization?"**  
  *(Likely: ML/EA crossover, 65% chance / Damage: Low)*  
  **Phrasing:** *"Couldn't you achieve similar robustness by maximizing EU but shrinking marginal utility for high-variance theories? Why reinvent the wheel?"*  
  **Reply (1 min):** "Because EU requires **comparable units**! Variance-adjusting *within*-theory still leaves theories incommensurate. Parliament avoids this by letting theories vote in their 'native currency'. Adjusting utility scales *is* intertheoretic comparison – the very problem we avoid."  
  **Concede:** "For single-theory uncertainty, variance adjustments work."  
  **Hold:** "Cross-theory aggregation requires voting, not utility summing."  
  **Soft Spot:** If all theories accept a common scaling (e.g., dollars), collapse is possible.  

  ---

  ### **The Objection You Hope Nobody Asks**  
  **"Aren't your constraints covertly consequentialist?**  
  *(Humility demands discounting deontic magnitudes? Bargaining assumes theories are bargaining about welfare? This seems biased.)"*  
  **Why it hurts:** Attacks meta-neutrality. Suggests your view is a Trojan horse for consequentialism.  
  **Reply (2 min - Defuse carefully):** "Not at all. The volatility discount applies equally to extreme *deontic* demands ('lying is 1000x worse than theft') when unsupported. The bargaining floor uses each theory's *own* notion of 'benefit' – a deontologist 'gains' by avoiding forbidden acts. Our constraints are *procedural*, not outcome-oriented. They enforce epistemic discipline, not welfarism."  
  **Concede:** "The *implementation* of bargaining might favor measurable outcomes. Working on lexical theories."  
  **Hold:** "Constraints are motivated by evidence-limits, not moral priors."  
  **If landed:** Someone notes that "volatility" assumes a metric space of actions – which deontologists reject. Have a fallback: use theory-specific action similarity metrics.

  ---

  ### **Tactical Summary**
  - **Hardest Hitting:** **Collapse into EV maximization** (#2). If they corner you on intertheoretic comparisons in the bargaining step, it lands. *Sign it landed:* Follow-ups about "hidden utility functions" or MacAskill's work.  
  - **Most Likely:** **Timidity accusation** (#1) from EAs. Preempt by framing as "robustness," not retreat.  
  - **Wildcard:** Stochastic dominance violations. If a theory's *undiscounted* verdicts stochastically dominate others but lose due to volatility, be ready to argue that magnitude uncertainty breaks dominance (controversial!).  

  **Final Tip:** Start by conceding EV maximization's elegance but frame your view as "necessary messiness when foundations are shaky." Quote Keynes: *"Better roughly right than precisely wrong."* Good luck!
