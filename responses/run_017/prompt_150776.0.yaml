answer: |-
  **MEMORANDUM**  
  **TRA/COMP/OFA/SOP/7.03 Rev.4**  
  **DATE:** 2023-10-27  
  **FROM:** Office of Foresight Allocation (OFA), Compliance Division  
  **TO:** All Rail Network Operators (RN-Ops), Track Maintenance Supervisors (TMS), Incident Response Teams (IRT)  
  **SUBJECT:** Standard Operating Procedure: Foresight Allocation & Consequence Management in Scheduled Track Incursion Events (STIE)  

  **1. PURPOSE:**  
  This SOP establishes mandatory procedures for Operator (RN-Op) intervention during Scheduled Track Incursion Events (STIE), specifically defining Foresight Allocation categories (Directly Brought About [DBA], Foreseen Side Effect [FSE], Tertiary Effect [TE]) and prescribing compliant mitigation actions under Transit Regulation 451.7 (Double Effect Consequence Management).

  **2. SCOPE:**  
  Applies to all rostered RN-Ops during active shift, responding to verified STIEs involving Positioned Parties (PPs) on designated active track segments per Maintenance Schedule TMS-Form 8b. Excludes unscheduled incursions (refer SOP 7.04).

  **3. DEFINITIONS:**
      *   **3.1 Directly Brought About (DBA):** Death(s) occurring as the immediate, intended objective of the RN-Op's action.
      *   **3.2 Foreseen Side Effect (FSE):** Death(s) occurring as a foreseen, unavoidable consequence of an action undertaken to achieve a different, permissible primary objective (e.g., preserving aggregate PP welfare).
      *   **3.3 Tertiary Effect (TE):** Death(s) occurring as a consequence of an event or condition that is itself only an FSE. TE classification requires OFA pre-approval (Form OFA-7T).
      *   **3.4 Five-Meter Proximity Threshold (5MPT):** The established spatial criterion defining intentionality. Actions within 5 meters of a PP default to DBA classification unless overriding FSE criteria (Sec 4.2.1) are met and documented (OFA-Form 5M/WAIVER). Distance measured RN-Op to nearest PP centroid.

  **4. PROCEDURE: STIE RESPONSE & FORESIGHT ALLOCATION**
      *   **4.1 Initial Assessment:** RN-Op confirms STIE per Schedule TMS-Form 8b, verifies active track segment status, and identifies PP count/positioning.
      *   **4.2 Mitigation Action Selection:**
          *   **4.2.1 Lever Diversion:** Diverting rolling stock onto a designated, PP-free sidetrack using the primary control lever is the default compliant action. Resultant PP fatalities on the *original* track are classified as **FSE**. Sidetrack PP fatalities (if any) are **FSE** provided the sidetrack was verified clear per Schedule. *Documentation:* OFA-Form FSE/Diversion.
          *   **4.2.2 Prohibited Actions: Direct Physical Interaction:**
              *   **4.2.2.1** Any action involving direct physical contact initiated by the RN-Op with a PP (e.g., pushing, pulling, striking) is strictly prohibited under Manual Handling Regulation MHR-12.3 ("Unauthorised Use of Positioned Party as Equipment").
              *   **4.2.2.2** Fatalities resulting from prohibited direct interaction are classified as **DBA**, regardless of intent or aggregate outcome. *Documentation:* Incident Report HR/Viol/MHR-12.3.
      *   **4.3 Proximity Assessment (5MPT):**
          *   **4.3.1** If the only viable mitigation action requires the RN-Op to be within 5 meters of a PP centroid, the action is permissible **ONLY** if:
              *   It involves lever/switch operation (not direct contact, per 4.2.2).
              *   The resultant PP fatality is an unavoidable **FSE** of achieving the primary objective (e.g., saving a greater number of PPs on the main track).
              *   **AND** RN-Op files OFA-Form 5M/WAIVER within 15 minutes post-STIE resolution, justifying FSE classification under 5MPT conditions.
          *   **4.3.2** Failure to file OFA-Form 5M/WAIVER for actions within 5MPT defaults fatality classification to **DBA**.
      *   **4.4 Tertiary Effect (TE) Management:** Fatalities classified as TE (e.g., PP fatality caused by panic-induced flight triggered by the *foreseen* noise of diversion) are outside standard consequence management protocols. Suspected TEs require immediate notification to OFA via Form OFA-7T/INIT for assessment and potential reclassification. *No RN-Op disciplinary action attaches to TE.*

  **5. REPORTING:**  
  All STIE interventions must be logged via the Transit Incident Management System (TIMS), selecting the appropriate Foresight Allocation category (DBA, FSE, TE-Pending) and attaching all required forms (OFA-FSE/Diversion, OFA-5M/WAIVER, OFA-7T/INIT, HR/Viol/MHR-12.3) within 30 minutes of event conclusion.

  **6. TRAINING:**  
  Mandatory annual recertification on Foresight Allocation protocols (Module OFA-TRG-07) and 5MPT assessment techniques (practical) is required for all RN-Ops.

  **REVISION HISTORY:**  
  Rev.0 (2021-05-01): Initial Release  
  Rev.1 (2021-11-15): Added TE Protocol (Sec 4.4, Form OFA-7T)  
  Rev.2 (2022-07-22): Clarified 5MPT Waiver Process (Sec 4.3.1)  
  Rev.3 (2023-02-10): Integrated MHR-12.3 Violation Reporting (Sec 4.2.2.2)  
  Rev.4 (2023-10-27): Streamlined TIMS Reporting Requirements (Sec 5)

  **DISTRIBUTION:** All RN-Ops, TMS Leads, IRT Commanders, OFA Auditors, HR Compliance, Legal Department (TR-451 Liaison)

  ---

  **What's Being Sent Up (Clause-by-Clause Satire of Double Effect & Trolley Problems):**

  1.  **Scheduled Trolley & Positioned Parties (PPs):** Parodies the artificial, pre-ordained setup of trolley problems where the deaths are inevitable and the agent's role is predefined (like a lab experiment). The memo ignores *why* people are on the tracks, focusing solely on bureaucratic process.
  2.  **Office of Foresight Allocation (OFA):** Satirizes the core Doctrine of Double Effect (DDE), which distinguishes intended effects from merely foreseen side effects to determine moral permissibility. The OFA bureaucratizes this moral judgment into classifications (DBA, FSE, TE).
  3.  **Tertiary Effects (TE):** Exaggerates the potential for DDE to create chains of responsibility dilution. If an effect is only foreseen as a consequence of something *else* that was merely foreseen (FSE), the memo treats it as effectively nobody's responsibility ("outside standard protocols"), highlighting how DDE can seemingly absolve agents of distant but foreseeable consequences.
  4.  **Five-Meter Proximity Threshold (5MPT):** This is the core reductio ad absurdum. DDE hinges on the agent's *mental state* (intention vs. foresight). The memo turns this into a ludicrously precise *physical measurement* ("nearest PP centroid"), reducing a complex philosophical distinction to a tape measure. The requirement for a "5M Waiver" form within 15 minutes adds bureaucratic absurdity.
  5.  **Lever Diversion (FSE) vs. Pushing (DBA & "Unauthorised Use... as Equipment"):** Directly targets the standard trolley problem contrast. Diverting the trolley (lever) is compliant FSE. Pushing is prohibited, not primarily because it's murder, but framed as a safety violation ("Manual Handling Regulation") about misusing a person as a tool. This satirizes how DDE condemns the footbridge push due to "intending the death as a means," while the memo buries the ethical core under HR-speak.
  6.  **Deadpan Tone & Process Focus:** The entire memo mimics real SOPs, never questioning the morality of the underlying situation (sacrificing PPs) or *who* scheduled them. It solely focuses on *how* to kill compliantly, mirroring how DDE discussions often focus on classifying the killing rather than questioning the scenario's fundamental horror. The revision history and distribution list add authentic, chilling bureaucracy.
