prompt: |-
  ok so I'm slowly working my way through Aristotle's Politics book 1 (the part around 1257a–1258a, in some old public domain translation) for a reading group, and I keep getting stuck on his story about how money shows up. Here are the bits I mean:

  > Take for example a shoe—there is its wear as a shoe and there is its use as an article of exchange; for both are ways of using a shoe, inasmuch as even he that barters a shoe for money or food with the customer that wants a shoe uses it as a shoe, though not for the use peculiar to a shoe, since shoes have not come into existence for the purpose of barter.

  > For when they had come to supply themselves more from abroad by importing things in which they were deficient and exporting those of which they had a surplus, the employment of money necessarily came to be devised. For the natural necessaries are not in every case readily portable; hence for the purpose of barter men made a mutual compact to give and accept some substance of such a sort as being itself a useful commodity was easy to handle in use for general life, iron for instance, silver and other metals, at the first stage defined merely by size and weight, but finally also by impressing on it a stamp in order that this might relieve them of having to measure it; for the stamp was put on as a token of the amount.

  > But at other times, on the contrary, it is thought that money is nonsense, and nothing by nature but entirely a convention, because when those who use it have changed the currency it is worth nothing, and because it is of no use for any of the necessary needs of life and a man well supplied with money may often be destitute of the bare necessities of subsistence, yet it is anomalous that wealth should be of such a kind that a man may be well supplied with it and yet die of hunger, like the famous Midas in the legend, when owing to the insatiable covetousness of his prayer all the viands served up to him turned into gold.

  > It is this art of wealth-getting that is thought to be concerned with money, for money is the first principle and limit of commerce. And these riches, that are derived from this art of wealth-getting, are truly unlimited; for just as the art of medicine is without limit in respect of health, and each of the arts is without limit in respect of its end (for they desire to produce that in the highest degree possible), whereas they are not without limit as regards the means to their end (for with all of them the end is a limit to the means), so also this wealth-getting has no limit in respect of its end, and its end is riches and the acquisition of goods in the commercial sense.

  > as therefore the desire for life is unlimited, they also desire without limit the means productive of life.

  Now the thing I actually want help with (please don't just tell me "Aristotle distinguishes household management from the art of wealth-getting and thinks the second one is unnatural", I got that far, I want the joints of the argument):

  One of the other people in the group came up with a dumb little thought experiment that I have not been able to shake. Suppose a city where the currency can't be saved: every coin stops being valid at midnight, say it's stamped with the date and re-stamping costs more than the coin is worth. Call it perishable scrip. Nobody can accumulate money over time, but grain, tools, land and livestock can of course still be stored, and trade goes on normally during the day.

  My questions:

  1. Does perishable scrip even count as money on the account Aristotle gives in the second block? His story seems to build money out of two features: something that is itself useful and easy to handle/portable, plus the compact. Is storability part of what's doing the work there (money as a device for getting around the fact that necessaries aren't portable), or is the "mutual compact to give and accept" bit meant to be doing all the work, so anything the city agrees on would count?
  2. The bit that really confuses me: he calls money "nothing by nature but entirely a convention" and in the same breath treats the trade-y kind of wealth-getting as *un*natural. If money is purely conventional, what is the unnaturalness supposed to consist in? Is it about the end (money/wealth becoming an end instead of a means, so nothing intrinsic stops the accumulation), or is it about money itself somehow? If it's the latter then the convention bit makes it look circular, and if it's the former then the Midas story and the "money is nonsense" paragraph look like they're doing less work than people assume.
  3. The main one: in the perishable-scrip city, would the unlimitedness disappear? He gives two explanations that I can't tell apart. One is about money's own peculiar feature — it's a token whose only use is exchange, so there's no natural point of satiation, and every art "is without limit in respect of its end". The other is about a mistake people make about *life*: because the desire for mere life is unlimited, they want without limit the things that sustain life, and they try to get the good life via bodily enjoyment. If the second explanation is the real one, scrip that expires at midnight changes nothing at all — people would just chase unlimited grain instead, and the household branch and the trade branch would still get confused. If it's the first, then scrip should actually cure the disease, which seems like a weird conclusion and makes me suspect I'm misreading the medicine analogy.

  So: walk me through how you'd read these lines to settle as much of this as the text can settle, and be explicit about where the text just underdetermines it and you'd have to pick between two readings. If it helps, say which parts of the shoe example (the "use peculiar to a thing" move) would or wouldn't carry over to money itself.
reasoning: |-
  Okay, let me unpack this user's query about Aristotle's Politics. They're working through Book 1 (1257a-1258a) and have specific questions about the nature of money and wealth-getting. The user mentions they already grasp Aristotle's distinction between household management (oikonomia) and unnatural wealth-getting (chrematistike), so they want deeper analysis of the argument's structure.

  The user presents a thought experiment: perishable scrip (currency that expires daily). Three main questions arise from this: 

  First, whether such scrip qualifies as money under Aristotle's definition. The key passages describe money as both intrinsically useful and portable, established by mutual compact. The storage question is tricky - Aristotle mentions portability but not explicitly storability. His example of stamped metal implies durability, but the compact element might theoretically allow perishable scrip if accepted as a medium. However, its inability to store value would severely limit its function as a "limit" of exchange.

  Second, about the apparent tension between money's conventional nature and the unnaturalness of wealth-getting. This is crucial. Aristotle's "conventional" claim targets money's arbitrary form (why silver rather than shells), not its function. The unnaturalness lies in divorcing acquisition from use-value and natural ends. Money enables but doesn't cause the perversion - the error is treating exchange-value as an end itself. The Midas story illustrates this perfectly: gold's conventional value becomes lethal when divorced from life's necessities.

  Third, whether perishable scrip would solve the "unlimitedness" problem. Aristotle gives two explanations: money's abstract nature makes accumulation limitless, and humans' unlimited desire for life drives unlimited acquisition. The perishable scrip might dampen the first mechanism but not the second - people would still hoard grain or land. The medicine analogy shows arts aim at unlimited perfection of their ends; without money, wealth-getting might shift targets but retain its unnatural orientation toward infinite accumulation.

  The shoe analogy is illuminating here. Money's "peculiar use" is exchange, unlike shoes worn for protection. But perishable scrip would still be used for exchange - just poorly, like defective shoes. Aristotle would likely see it as money, but money that fails at storing value, thus only partially fulfilling money's natural function.

  Ultimately the text shows Aristotle's concern is teleological: things have proper uses. Money's proper use is facilitating exchange for household needs. Perishable scrip might curb monetary accumulation but wouldn't stop the confusion of wealth-getting with living well - people might still pursue endless grain stores. The unnaturalness is in the mindset, not the medium.
answer: |-
  Here's a breakdown of Aristotle's argument in 1257a-1258a, focusing specifically on your questions about perishable scrip and the nature of money's "unlimitedness":

  **Core Aristotelian Concepts (Relevant to Your Questions):**

  1.  **Use-Value vs. Exchange-Value:** This is the foundation (the shoe example). Every object has its "peculiar use" (use-value: wearing the shoe) and a derived "use as an article of exchange" (exchange-value: trading the shoe).
  2.  **Natural vs. Unnatural Acquisition:**
      *   **Natural Acquisition (Oikonomia - Household Management):** Acquiring goods necessary for life and the good life of the household. It has a natural limit defined by the needs of the household. It uses barter or money *as a means* to obtain use-values.
      *   **Unnatural Acquisition (Chrematistike - Wealth-Getting):** Acquiring goods (especially money) for their own sake, as an end. It has *no natural limit* because its end (abstract wealth) is inherently limitless. It treats money not as a mere instrument, but as the primary object.
  3.  **Origin and Nature of Money (Nomisma):**
      *   **Origin:** Arises from the practical difficulties of barter (lack of coincidence of wants, non-portability of some necessaries). People make a "mutual compact" to use something intrinsically useful (like metal) as a common medium.
      *   **Conventional Nature:** Money has value *only* because of this social agreement ("compact"). It has no direct use-value for sustaining life (like food or shelter). If the convention changes (currency devalued), it becomes worthless. This is the "nonsense" aspect (Midas story).
      *   **Practical Features:** The compact selected things that were:
          *   *Intrinsically Useful (initially):* Like iron or silver (which *can* be used for tools/ornaments).
          *   *Portable & Divisible:* To facilitate exchange.
          *   *Measurable/Storable:* Hence the move from weighing to stamping – **storability is implied and crucial.** The stamp signifies a *lasting* value and amount, relieving the need for constant re-measurement. It functions as a *store of value* across time, enabling deferred exchange and accumulation.

  **Addressing Your Questions & Thought Experiment:**

  1.  **Does Perishable Scrip Count as Money for Aristotle?**
      *   **Textual Analysis:** Aristotle's account strongly implies storability/duration as essential. The "mutual compact" is to give and accept something *reliably valuable* for exchange *over time*. The stamp's purpose is explicitly to create a lasting token of value ("relieve them of having to measure it" repeatedly).
      *   **Functionality:** Perishable scrip fails a core function Aristotle attributes to money: being a stable "limit" and "first principle" of exchange. If it expires daily:
          *   It cannot serve as a reliable *store of value* or unit of account over time.
          *   It severely hampers deferred exchange (buy now, pay later).
          *   It makes saving impossible, forcing immediate consumption or conversion into durable goods.
      *   **Conclusion:** **Perishable scrip likely *would not* fully qualify as "money" (*nomisma*) for Aristotle.** While it fulfills the "medium of exchange" function *during the day* based on convention, it fundamentally lacks the **storability and stability** his account emphasizes as necessary consequences of the compact and the practical problem money solved (overcoming the limitations of barter *including* the difficulty of saving exchange-value). It's more like an extremely efficient, temporary barter token. The compact, for Aristotle, implies acceptance *because* it holds value reliably, not just momentarily.

  2.  **Conventional Money vs. Unnatural Wealth-Getting: What's Unnatural?**
      *   **Resolving the Tension:** The key is distinguishing *what* is conventional from *what* is unnatural.
          *   **Conventional:** The *specific form* money takes (silver coins vs. gold vs. shells) and the *fact* that it has value only by agreement. This is *not* inherently unnatural; it's a practical solution to a natural problem (facilitating complex exchange for household needs).
          *   **Unnatural:** The *activity* (Chrematistike) that treats *this conventional tool* (money) as an *end in itself*, divorcing acquisition from its natural purpose (meeting household needs) and pursuing it *without limit*.
      *   **The Midas Story's Role:** This illustrates the *absurdity and danger* that arises *precisely because* money is conventional and lacks inherent use-value. If you make accumulating this conventional symbol your ultimate goal (unnatural wealth-getting), you starve surrounded by "wealth" (gold). The story highlights the perversion, not the cause. The cause is the misguided *purpose* of the acquisition.
      *   **Unnaturalness Defined:** The unnaturalness consists in:
          *   **Misplaced Telos (End):** Treating the *means* (money/wealth) as the *end*.
          *   **Limitlessness:** Pursuing an end (abstract wealth) that has no inherent stopping point, unlike the natural end of household management (sufficiency for the household).
          *   **Separation from Use:** Focusing solely on exchange-value to the exclusion of use-value and the natural purpose of goods.
      *   **Circularity Avoided:** It's *not* circular. Money's conventional nature *enables* Chrematistike by providing an abstract, storable, limitless object of desire, but the *unnaturalness* lies in the human *choice* to pursue that object limitlessly as an end. The convention provides the *opportunity* for the perversion; the perversion is the *activity* itself.

  3.  **Would Perishable Scrip Eliminate the Unlimitedness?**
      *   **Aristotle's Two Explanations:**
          1.  **Money's Abstract Nature:** As the "end" of commercial wealth-getting, and because it's an abstract representation of value (conventional, lacking inherent use-value), the pursuit of it *as an end* has no natural limit. More is always conceptually possible.
          2.  **Unlimited Desire for Life:** Humans have an unlimited "desire for life" (and especially, by implication, an unlimited potential desire for *enhanced* life/pleasure). If this desire becomes focused on *material means* (whether goods *or* the money representing them), the pursuit of those means becomes unlimited.
      *   **Analysis with Perishable Scrip:**
          *   **Impact on Explanation 1 (Money's Nature):** **Yes, perishable scrip would likely cripple *this specific mechanism* of unlimitedness.** If money literally expires daily, it cannot be accumulated indefinitely *as money*. It loses its quality as a limitless abstract object of accumulation. The "end" of Chrematistike (piling up money tokens) becomes physically impossible, undermining this form of the art.
          *   **Impact on Explanation 2 (Unlimited Desire):** **No, perishable scrip would *not* eliminate the underlying problem.** The "desire for life is unlimited" and the tendency to confuse the good life with unlimited bodily enjoyment/material possessions remains. People would simply shift their unlimited accumulation efforts to durable *use-values*: hoarding grain, tools, land, livestock. The *confusion* between household management (focused on use-value and natural limits) and wealth-getting (focused on accumulation without regard to use) could persist, just with different objects. People might try to accumulate vast barns of grain far beyond any conceivable household need, purely for the sake of possessing wealth represented by grain.
          *   **The Medicine Analogy:** This analogy supports both points but is crucial here. The "end" of medicine is health. Health *itself* has a theoretical ideal of perfection ("in the highest degree possible"), making the art's pursuit of its end potentially limitless *in theory*. Similarly, the "end" of Chrematistike is commercial wealth (money). This end is *inherently* limitless ("riches and the acquisition of goods in the commercial sense").
          *   **Perishable Scrip Changes the "End":** If perishable scrip prevents money from functioning as stable commercial wealth, then the "end" of the art of wealth-getting *in that society* would be fundamentally altered. The art couldn't pursue *money* indefinitely. However, the *underlying desire* for unlimited means to life/pleasure could lead people to invent a *new* form of Chrematistike focused on accumulating durable goods as abstract wealth-signifiers (like grain-hoarding), or perhaps shift to other storable valuables (gems, rare metals not used as daily scrip). The *impulse* for unnatural accumulation might find another outlet.
      *   **Conclusion:** **Perishable scrip would likely destroy the *monetary form* of Chrematistike (limitless money accumulation) but would *not* necessarily eliminate the *unnatural impulse* for limitless acquisition driven by confused desires.** People would likely pursue unlimited accumulation of durable goods instead. Aristotle's text emphasizes the *impulse* and the *confusion of ends* as the root problem; money is the *primary tool and object* that makes this impulse manifest in its most abstract and virulent form ("unlimited in respect of its end"). Remove that specific tool/object, and the manifestation changes, but the underlying disease (the misdirected desire) might remain. The text doesn't definitively settle whether Aristotle believes removing money *solves* the problem or merely *shifts its expression*; his focus is overwhelmingly on diagnosing the perversion inherent in *treating money as an end*. Your thought experiment exposes this potential ambiguity.

  **Synthesizing the Shoe/Money Analogy:**

  *   **Shoe:** Peculiar use = wearing (use-value). Secondary use = bartering (exchange-value). Bartering *uses* the shoe but not *for* its peculiar use.
  *   **Money:** Peculiar use = facilitating exchange (its use-value *is* its exchange-value function!). There is *no* other "peculiar use" like wearing a shoe. Its *only* natural purpose is to be a medium/storage of exchange-value for obtaining use-values.
  *   **Chrematistike's Perversion:** Treats money *not* as a means for exchange (its peculiar use), but as the *object of exchange itself*. It seeks money not to exchange it *for* use-values, but to *have* money. This is a perversion analogous to someone collecting shoes not to wear them or trade them for useful things, but *solely* to count them or admire them as abstract "shoe-units" – ignoring their peculiar purpose entirely. Perishable scrip would make collecting *money-tokens* pointless, but wouldn't stop someone from hoarding shoes (or grain) uselessly. The core error is treating the *symbol* (exchange-value) as more real or important than the *substance* (use-value and the good life it supports).

  In essence, perishable scrip breaks money's function *as a store of value*, making it unsuitable as the object of Chrematistike. However, it doesn't address the underlying human tendency towards limitless desire and confusion of means with ends, which could manifest in hoarding real goods. Aristotle's critique targets the *mindset* and the *purpose* of acquisition, for which conventional, storable money is the most potent enabler and symbol, but not necessarily the sole possible object.
