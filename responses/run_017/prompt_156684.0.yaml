prompt: |-
  I've gone down a bit of a rabbit hole recently (it started when a school near me got renamed and everyone more or less shrugged, whereas the statue arguement in the same town ran for years), and I keep noticing the same pattern. When a city decides that someone commemorated in public isn't worthy of it any more, the standard menu seems to be: pull the statue down and put it in a museum or a warehouse — very rarely melted down or smashed, even when it's a bog-standard mass-produced bronze that nobody thinks is any good as art; or leave it up and bolt on an interpretive plaque; or rename the street, the school, the lecture theatre, the scholarship. And here's the bit that puzzles me. Renaming is the option that actually costs money and causes hassle — new signage, new addresses, businesses having to reprint everything — and yet it's the one that gets treated as obviously fine and barely argued about. Shifting a statue is, by comparison, cheap and quick, and it's the one that produces years of fighting. We do X in one case and Y in the other and I can't tell whether that's just inertia about old objects or whether it tracks something real about what the two kinds of thing are.

  Two mates of mine offered opposite explanations and neither fully convinced me. One says the statue is basically detachable: the honour lives in the plinth, in the square, in the fact that we put him up high where we have to walk round him, so once you take it off the pedestal the bronze is just an object and a museum can hold it without honouring anybody — which would explain why nobody insists on destroying them. The other says it's the other way round: a street name is worse because we use it constantly, we say it out loud, we give it as our address, so it enrols us in the honouring every single day, whereas a statue is just something you walk past. I also notice that nobody ever campaigns to rename something because the namesake turns out to have been merely forgettable, or a mediocre dullard, or to have got his fame by luck — the campaigns only fire when there's some serious wrongdoing. And then there's the retain-and-explain option, which seems to assume that bolting on a few paragraphs can genuinely change what an object is doing, that its meaning is fixed by us now rather than by whoever put it up; but if that's true, why remove anything at all?

  So: what exactly does this whole package of practices presuppose about what a statue, or a name, is? What view of commemoration does it only make sense under — an honour, a record, an expression of who "we" are, a claim about admirability, something else — and which rival views does it quietly rule out? I'd like you to seperate what the practice strictly presupposes from what it merely fits comfortably with, and to say where it's underdetermined and several different theories would license the same behaviour. Is my first mate's "the plinth is the honour, the bronze is just a thing" idea actually doing work in the practice, or is the museum solution just a compromise nobody has thought through? Does the wrongdoing-but-not-mediocrity pattern tell us anything about what a monument asserts about a person? Is the package internally consistent — do the statue bit and the renaming bit presuppose the same theory, or is one of them running on a different one? And if we swapped in a rival view (say, that commemoration is mainly a record of what earlier generations valued, or that it's purely the current community's speech, or that the dead themselves have some stake in it), what would actually have to change in how cities handle these things? I don't need any reading recommendations or names of papers, I just want the argument.
reasoning: |-
  Okay, the user has presented a complex query about the practices surrounding the removal of statues versus renaming places. Let me start by breaking down their main points. They noticed that renaming causes more practical hassle but faces less opposition compared to moving statues, which should be simpler but sparks long debates. They also mentioned that campaigns focus on serious wrongdoing rather than mediocrity and questioned the effectiveness of interpretive plaques.

  First, I need to analyze the underlying presuppositions about commemoration. The user's friends offered conflicting views: one sees the statue's honor in the plinth, the other thinks street names involve daily complicity. The user wants to know what these practices assume about statues and names, whether the practices are internally consistent, and how different theories would change actions.

  The core issue seems to be the nature of the commemorative act. Statues as physical, singular objects in prominent locations symbolize active veneration. Their removal is contentious because it's a public repudiation. Renaming, while logistically messy, might be seen as administrative, thus less symbolic. The retain-and-explain approach suggests that context can redefine meaning, but that raises questions about why removal is ever necessary.

  The user also mentioned that only serious wrongdoing triggers campaigns. This indicates that commemoration implies moral endorsement. Mediocrity isn't challenged because it doesn't violate the implied moral claim. The museum solution treats the statue as a historical artifact, separating it from active honor. But is that consistent? If the honor is in the location, moving it might suffice, but opposition persists, suggesting the statue's presence itself is tied to identity.

  I need to check for internal consistency. Renaming and statue removal might not operate on the same logic. Statues are seen as endorsements, so removal is a revocation. Renaming could be viewed as correcting a record without the same symbolic weight. The plaque option assumes meaning is mutable through context, which conflicts with the need to remove statues if context can neutralize them.

  Different theories of commemoration would change practices. If it's about historical record, plaques would suffice. If it's current community values, removal or renaming without plaques makes sense. The dead's stake would make removal disrespectful, yet it happens. The current practices suggest a mix: statues as active honor, names as passive identifiers, with wrongdoing invalidating the honor.

  The user’s deeper need might be understanding societal values reflected in these actions. They might be seeking clarity on how communities negotiate historical legacies and what that says about collective identity. Unspoken could be a concern about inconsistency in handling different commemorative forms or the ethics of erasure versus contextualization.
answer: |-
  Your observations reveal a complex, often inconsistent set of presuppositions about commemoration. Here's the argument broken down:

  1.  **What Statues Presuppose: Active Veneration & Persistent Presence**
      *   **The Practice Presupposes:** A statue is not merely a record, but an act of **active, ongoing honor**. Its meaning is intrinsically tied to *where* and *how* it is displayed. The plinth elevates the figure literally and symbolically, demanding public attention in a shared space. Its permanence signifies enduring worthiness. Removing it isn't just moving an object; it's a **public revocation of that honor**, a statement that the person no longer *deserves* that specific form of elevated, persistent presence. This is why it sparks conflict – it's a direct negation of the original honorific act.
      *   **Why Museum/Warehouse Works:** This practice relies on the presupposition that **location defines meaning**. Taking it off the public plinth fundamentally changes the object's function. In a museum context, it becomes a *historical artifact* representing *past values* or *controversies*, not a current endorsement. Destroying it is rare because (a) it acknowledges the artifact has historical significance *as evidence* of past commemoration, and (b) destruction feels more like erasure than contextualization, raising different ethical/historical concerns.
      *   **Why "Retain-and-Explain" is Contested:** This option presupposes that **meaning is mutable and contextual**. It assumes the plaque can successfully overwrite or fundamentally alter the statue's original intent – turning an honor into a lesson. Opponents argue this presupposition is false: the statue's *form* (size, placement, grandeur) inherently conveys veneration that a plaque cannot fully negate. Its *persistent physical presence* is seen as a tacit, ongoing endorsement, regardless of attached text. Proponents believe context *can* successfully repurpose the object. This inherent tension explains why it's not universally accepted.

  2.  **What Names Presuppose: Passive Identification & Utilitarian Function**
      *   **The Practice Presupposes:** A commemorative name (street, school, etc.) functions primarily as a **label and identifier**. While it originated as an honor, its primary *current* function is often perceived as utilitarian. We *use* the name for navigation, communication, and administration. Renaming is seen as less symbolically charged than statue removal because:
          *   **The honor is less "active":** We say "I live *on* Maple Street," not "I venerate the person Maple Street was named after daily." The commemoration is often background noise.
          *   **The form doesn't inherently venerate:** Unlike a statue's grandeur, a street sign is a small, functional object. Its commemorative power is arguably weaker and more abstract.
          *   **Cost/Hassle vs. Symbolism:** The practical disruption (cost, inconvenience) paradoxically *dilutes* the perceived symbolic weight of the act. Changing a name feels like an *administrative correction* rather than a grand, public repudiation. The hassle becomes the focus, obscuring the symbolic revocation.

  3.  **The Wrongdoing vs. Mediocrity Pattern: The Implied Moral Claim**
      *   **The Practice Presupposes:** Commemoration, especially via statues and prominent names, makes an **implicit moral claim** about the honoree. It asserts not just historical significance, but **admirable worthiness**. Mere mediocrity or dullness doesn't violate this claim – the figure is still deemed "worthy enough" for the honor, even if unremarkable. Serious wrongdoing (slavery, genocide, profound corruption), however, directly contradicts the foundational claim of admirability. The commemoration becomes an active endorsement of immorality. Campaigns focus here because the practice itself presupposes that commemoration equals moral endorsement.

  4.  **Internal Consistency? Divergent Logics**
      The package is **not fully internally consistent**. Different logics are at play:
      *   **Statues:** Primarily presuppose **active, present-tense veneration** tied to location and form. Removal is revocation. Museum storage accepts the object as a *historical relic*, not a current honor.
      *   **Renaming:** Treated as changing a largely **utilitarian label**, where the commemorative aspect has become passive or secondary. The hassle overshadows the symbolic weight.
      *   **"Retain-and-Explain":** Leans heavily on the presupposition that **meaning is contextual and mutable** through added interpretation, directly challenging the idea that the statue's *form* inherently conveys fixed veneration.
      The key inconsistency lies in the perceived *intensity* of the honor. Statue practices treat the honor as active and potent, requiring physical removal or radical contextualization to negate. Renaming practices treat the honor as faded or passive, making its removal less symbolically volatile despite higher practical cost. The "retain-and-explain" option for statues tries to bridge this gap but remains contested precisely because it challenges the presupposition that the statue's *presence itself* is the core problem.

  5.  **The Role of Theories: What Would Change?**
      *   **Commemoration as Historical Record Only:** Statues would *never* be moved; only plaques added ("Here stood a statue honoring X, reflecting the values of 1890"). Renaming might still occur but framed purely as factual updating, not moral judgment. Museums would be the *only* destination.
      *   **Commemoration as Purely Current Community Speech:** Both statues and names would be changed far more readily based on *current* values, potentially including mediocrity ("We want inspiring names!"). Destruction of statues would be more common (erasing unwanted past speech). Museums would be less relevant unless for artistic value. "Retain-and-explain" would be rare – why keep a statement you reject?
      *   **The Dead Have a Stake:** Removal or renaming would be seen as disrespectful or an attack on legacy. Stronger arguments for preservation ("They earned it in their time!") or perhaps elaborate rituals around removal. The focus would shift from current community values to the rights/perceptions of the deceased.
      *   **Honor Lives in the Plinth (Your First Mate):** This view *is* doing significant work, especially in the museum solution. It allows the symbolic revocation (removing from the plinth) while avoiding the ethical/historical weight of destruction. It explains why the *same object* in a museum isn't seen as honoring. However, the intensity of opposition to removal shows many also believe the *bronze itself* retains symbolic power that shouldn't occupy *any* public space.
      *   **Honor Lives in Daily Complicity (Your Second Mate):** This view better explains the *lack* of intense opposition to renaming, despite the hassle. If the honor is perceived as passive, changing the name isn't seen as forcing current complicity. However, it struggles to explain why statue removal *is* contentious – opponents clearly feel its removal *forces* them to repudiate something they still value.

  **Conclusion:** The package of practices presupposes a messy, often contradictory set of beliefs. Fundamentally, it assumes commemoration via statue is an **active, potent, location-dependent act of veneration** implying **moral admirability**. Renaming is treated as a more **passive, utilitarian label** whose commemorative power has faded. The museum solution leverages the "honor is in the plinth" idea to allow symbolic revocation without destruction. The focus on wrongdoing reveals the implicit moral claim inherent in prominent commemoration. The inconsistency arises because the practices for statues treat the honor as *present and potent*, while those for renaming treat it as *past or passive*. "Retain-and-explain" attempts to redefine the statue's meaning but remains unstable because it challenges the core presupposition that the statue's *physical presence in public space* *is* the act of honor. The practices aren't driven by a single coherent theory but by pragmatic negotiations between conflicting intuitions about history, memory, morality, and the symbolic power of objects and names.
