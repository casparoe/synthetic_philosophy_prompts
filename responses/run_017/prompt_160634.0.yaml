prompt: |-
  I'm writing a reading note for a graduate seminar on Dewey's experimentalism — the idea, as I'm reading him, that democracy is not merely one form of government among others but the political shape that inquiry takes when it is conducted in common — and I keep failing at the same sub-task. Intuitively, "experimental" cannot simply mean "tried out and then adjusted," because plenty of thoroughly undemocratic arrangements do that; but whenever I try to say what else is required, I end up either with something so demanding that nothing real qualifies, or with something so thin that a marketing A/B test qualifies. My supervisor has spent years handing down off-the-cuff verdicts on examples, and I have been writing them down. She also has a visible allergy to the phrase "evidence-based policy," which I take to be a clue, though I cannot say to what. Her rulings so far: a school district in which teachers and parents spent a year arguing about what the problem even was, two reading programs were then assigned to matched schools, results were published, and the district went on to reopen the question of what reading well consists in — experimental, without hesitation. A statewide initiative imposing a supermajority requirement for tax increases, passed after a well-funded campaign, containing no review provision and defended by its authors as a permanent correction to a known bias in legislatures — not experimental, on the grounds that this is a doctrine with a ballot attached. A city zoning ordinance preceded by eight months of genuine town halls and then never revisited, the council treating the town halls as having settled the matter — not experimental. A health department that randomized two appointment-reminder messages, measured attendance, published a working paper, rolled out the winner nationally and then declared the question closed for a decade, with no patient or staff involvement in framing the question and the attendance target never itself questioned — not experimental. And a housing authority that meets quarterly with a tenant union to review how a rent-relief rule is working, proceeding on residents' testimony that is minuted and published rather than on any formal measurement, revising the rule repeatedly and at one point redefining what would count as its working — experimental, and more warmly than the school district.

  The case I actually care about is a live proposal in our city, and I need to predict her reaction before I present it. A public employment agency wants to replace its fixed schedule of caseworker contact with an adaptive allocation system: a learning algorithm continuously re-randomizes claimants across different intensities of support and reallocates effort toward whichever variant is currently producing the highest rate of employment at six months, updating weekly. Everything is logged, and a public dashboard reports the current allocation and its measured effects. Claimants are not told they are in an allocation and no claimant body has been consulted; the six-month employment target is written into the enabling statute, and the agency says it has no authority to reconsider it, though the statute sunsets in five years with a mandatory legislative review. A claimants' advocacy group has been given access to the dashboard and publishes its own readings of it, but has no formal role. Her verdicts seem to me jointly consistent with several different rules, and they come apart here: one that requires only that consequences be systematically observed, fed back into the practice, and made public, with no point at which inquiry is declared finished; one that additionally requires that the people affected be parties to fixing the problem and reading the results; and one on which the test is whether the end is itself held revisable rather than given, so that optimizing means toward a fixed end would not count.

  What I would like is a reconstruction rather than your own view of Dewey. Set out the candidate rules that fit her track record equally well, say what each of them predicts about the employment-agency proposal, and give me your best guess at her verdict with your reasons for preferring that reading — tell me which of her past verdicts is doing the most work in your reconstruction, and tell me honestly if the track record is better explained by her having been inconsistent than by any single rule, and if so which verdict is the outlier. Then name the one further case you would put to her to force the surviving readings apart, and what she would have to say about it to confirm each. If her precedents genuinely leave the new case open, say which principle she would be committing herself to with each answer; I would much rather she commit to something explicitly than let the word "experimental" go on doing its work by sounding vaguely complimentary.
reasoning: |-
  Hmm, the user is struggling with defining Dewey's experimentalism for a graduate seminar, specifically for a case involving a public employment agency using an adaptive algorithm for claimant support. They've observed their supervisor's rulings on various examples and need to predict how she would rule on this new case. The supervisor seems to reject "evidence-based policy" approaches that lack democratic elements, even if they involve data collection and adjustment.

  Looking at the supervisor's past rulings: the school district case was experimental because it involved collective problem-framing, testing, and ongoing inquiry. The tax initiative and zoning ordinance cases weren't experimental because they treated solutions as permanent. The health department's A/B testing failed because it excluded stakeholder input and closed inquiry. The housing authority case was particularly experimental due to deep tenant involvement in defining success and revising rules.

  For the employment agency proposal, I see three possible rules that could explain the supervisor's pattern: the Open Inquiry Rule (emphasizing continuous, public inquiry without closure), the Affected Parties Rule (requiring stakeholder involvement in problem-framing and evaluation), and the Ends Revisability Rule (requiring that ends themselves be open to revision).

  The employment agency case has strong Open Inquiry elements (continuous adjustment, public data) but fails on Affected Parties (no claimant involvement in framing) and Ends Revisability (fixed employment target). Since the supervisor emphasized resident involvement so strongly in the housing authority case, I think Affected Parties is likely her core criterion. Therefore, she'd probably rule "not experimental" here.

  To test this further, I'd propose a case about a pollution reduction program with citizen-framed problems but fixed targets. If she rejects it, Ends Revisability matters; if she accepts it, Affected Parties is key. The user needs clarity to prevent "experimental" from becoming just a vague compliment to policies.
answer: |-
  Based on your supervisor's track record and the need for a predictive reconstruction (not original Dewey exegesis), here's an analysis of her implicit rules, their application to the employment agency case, and a strategy for clarification:

  **Candidate Rules Fitting Her Precedents:**

  1.  **The Open Inquiry Rule:** An arrangement is experimental *if and only if* it institutionalizes **continuous, public observation of consequences, feedback into practice, and explicitly avoids declaring the inquiry finished.** Closure is the disqualifier.
      *   *Fits Precedents:*
          *   School District: Observed, fed back, reopened ends (not closed).
          *   Tax Initiative: Permanent correction declared (closed).
          *   Zoning Ordinance: Settled, not revisited (closed).
          *   Health Dept: Declared closed for a decade (closed).
          *   Housing Authority: Quarterly review, repeated revision (continuous, not closed).
      *   *Prediction for Employment Agency:* **Experimental.** It continuously observes (logs/dashboard), feeds back (weekly algorithm updates), makes public (dashboard), and avoids closure (statute sunsets, mandatory review in 5 years implies non-permanence).

  2.  **The Affected Parties Rule:** An arrangement is experimental *if and only if* the **people significantly affected by the practice are substantively involved as co-inquirers in both defining the problem/framing the question AND interpreting the results/assessing consequences.** Mere observation/feedback isn't enough without their agency in the inquiry process.
      *   *Fits Precedents:*
          *   School District: Teachers/parents argued about the problem (co-framing), published results (public interpretation implied).
          *   Tax Initiative: No affected parties involved in framing or interpretation (ballot ≠ inquiry).
          *   Zoning Ordinance: Town halls *preceded*, but no ongoing role for residents in assessment/revision. Framing potentially participatory, but interpretation/revision closed.
          *   Health Dept: No patient/staff involvement in framing question or interpreting results.
          *   Housing Authority: **Strongest Fit:** Meets *with* tenant union, reviews based *on* residents' testimony (co-interpretation), redefines "working" (co-framing/re-framing).
      *   *Prediction for Employment Agency:* **Not Experimental.** Claimants are subjects of randomization, not consulted on problem framing ("employment at six months" is given). They have no role in interpreting results (advocacy group access ≠ claimant agency). They are excluded from the inquiry loop.

  3.  **The Ends Revisability Rule:** An arrangement is experimental *if and only if* the **ends or goals themselves (what "works," what the problem *is*) are treated as provisional and subject to revision based on the inquiry, not fixed benchmarks.** Optimizing means to a fixed end doesn't count.
      *   *Fits Precedents:*
          *   School District: Reopened "what reading well consists in" (ends revisable).
          *   Tax Initiative: Defended as "permanent correction" (fixed end).
          *   Zoning Ordinance: Matter "settled" (fixed solution, implied fixed end).
          *   Health Dept: Attendance target "never questioned," question "closed" (fixed end).
          *   Housing Authority: Redefined "what would count as its working" (ends revisable).
      *   *Prediction for Employment Agency:* **Not Experimental.** The "six-month employment" target is fixed, written into statute, and the agency claims no authority to reconsider it. Optimization is purely of means (support intensity) towards this fixed end.

  **Best Guess at Her Verdict & Reasoning:**

  *   **Verdict:** **Not Experimental.**
  *   **Primary Reason:** **The Affected Parties Rule** carries the most weight in this reconstruction.
  *   **Key Precedent:** The **Housing Authority case** is the linchpin. Her "warmer" endorsement contrasts sharply with the Health Dept A/B test lacking patient involvement. It demonstrates that deep, ongoing involvement of the affected group *in the interpretive and re-framing process* is crucial, beyond just observation/feedback. The School District involved stakeholders in initial framing and reopening ends. The Employment Agency case lacks *any* claimant involvement in framing the problem/question or interpreting results. The advocacy group's role is external commentary, not claimant agency within the inquiry.
  *   **Secondary Reason:** The **Ends Revisability Rule** also strongly points to "Not Experimental". The fixed statutory target is a major barrier, reminiscent of the Health Dept's unquestioned attendance target.
  *   **Why Open Inquiry Isn't Enough:** While the proposal *has* Open Inquiry elements (continuous, public, non-permanent), the precedents (especially Health Dept vs Housing Authority/School District) show that mere systematic observation/feedback, even if public and continuous, is insufficient *without* the substantive participation of the affected in shaping and judging the inquiry. The lack of claimant agency likely overrides the strong Open Inquiry aspects.
  *   **Consistency:** The track record is **consistent** with a primary emphasis on **Affected Parties Rule**, significantly informed by **Ends Revisability**. The Open Inquiry Rule is necessary but not sufficient. The Health Dept case is the clearest rejection of technically sophisticated feedback loops lacking participation/revisable ends. The Housing Authority case is the clearest affirmation of participation-focused, ends-revisable inquiry even without formal measurement. The Tax Initiative and Zoning cases highlight the sin of closure/permanence, which the Employment case avoids, but that avoidance isn't sufficient to save it.

  **The Decisive Test Case & Its Implications:**

  To definitively separate the Affected Parties Rule from the Ends Revisability Rule, propose this:

  > **"A municipal pollution reduction program.** After extensive, structured citizen assemblies identify 'reducing respiratory illness in vulnerable neighborhoods' as the core problem and propose specific interventions (e.g., traffic filtering, green buffers), the city implements these in a randomly assigned subset of neighborhoods. Impact is measured *only* via hospital admissions for respiratory conditions (the citizen-assembly-defined metric). Results are published annually, discussed in open forums *with* assembly participants and affected residents, and interventions are adjusted based on these discussions. However, the *end* goal itself ("reduce respiratory illness admissions") is never reopened or questioned by the program managers or participants as the sole measure of success, even if other pollution-related complaints arise."

  *   **If she rules it EXPERIMENTAL:** This confirms **Affected Parties Rule** is dominant. The deep, ongoing involvement of affected citizens in framing *and* interpreting, even with a fixed end, satisfies her core criterion (like Housing Authority, where "working" was redefined *by* tenants, implying their framing power, even if the ultimate end of tenant well-being was fixed). She prioritizes democratic process in inquiry over the revisability of the ultimate end.
  *   **If she rules it NOT EXPERIMENTAL:** This confirms **Ends Revisability Rule** is dominant and necessary. The failure to ever question or reopen the *end* goal itself, despite participatory process and feedback on *means*, disqualifies it (akin to the Health Dept's fixed attendance target, even if stakeholders *had* been involved). The inquiry is constrained by an unexamined premise.
  *   **Implications:** Each answer commits her to a principle:
      *   **Experimental Verdict:** Commits to the principle that **democratic experimentalism is defined by the substantive inclusion of affected parties as agents in the ongoing process of problem definition, data interpretation, and solution adjustment, even if the fundamental value driving the inquiry (e.g., health) remains stable.**
      *   **Not Experimental Verdict:** Commits to the principle that **democratic experimentalism requires that not only the means but also the very definition of success, failure, and the problem itself must be inherently contestable and revisable through the inquiry process; optimizing within a fixed normative framework is insufficient.**

  **Conclusion on the Employment Agency Case:**

  Based on the reconstruction prioritizing the Affected Parties Rule (strongly signaled by the Housing Authority precedent) and supported by the Ends Revisability Rule, predict a **"Not Experimental"** verdict. The claimants are treated as data points, not co-inquirers. The fixed statutory target epitomizes the "given end" problem she rejected in the Health Dept case. The sunset clause creates Open Inquiry, but doesn't overcome the deficits in participation and ends revisability evident in her past rejections. Presenting the pollution test case is the clearest path to forcing an explicit commitment to which principle – affected parties' agency or ends revisability – is ultimately non-negotiable for her conception of Deweyan experimentalism.
