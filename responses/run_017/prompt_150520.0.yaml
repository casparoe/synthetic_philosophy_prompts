prompt: |-
  I work on developer tooling, and most of what I ship is external memory for other people's thinking: language-model agents with retrieval and scratchpads, IDEs that hold half a codebase's invariants in autocomplete, note systems people query instead of remembering. In design reviews we keep having the same argument in engineering vocabulary — is this artifact part of the cognitive system, or an instrument the agent consults? I want a specification, not a slogan.

  Please write out what a theory of cognitive extension would have to deliver in order to be usable for that purpose: as a decision procedure for someone who has to say, of a given artifact embedded in a given practice, whether it is (or is becoming, or could be trained into being) part of the agent's cognitive machinery rather than a tool the agent uses. For each requirement, give the case or consideration behind it, and mark whether it is non-negotiable for my purpose or merely a preference of one camp. Where a requirement is really a prejudice of a research programme dressed up as a constraint, say so.

  Here are the cases I want any candidate theory forced to adjudicate — add the ones I'm missing and discard any you think are bogus:

  - A retrieval-augmented agent whose retrieved passages are causally upstream of every output, are not in its weights, are fetched by a mechanism the system itself invokes, and are intermittently wrong without the agent noticing. Contrast it with an agent that ingested the same corpus during training. Both are causally dependent on the same text; only one is intuitively "remembering."
  - A senior engineer who cannot state the invariants of the system she maintains unless the IDE is open with autocomplete and inline docs. Her dependence looks structurally identical to the agent's, but no one calls her prosthetically augmented — they call her competent.
  - The diarist who writes everything down and never rereads it: the externalization does its work at write time, with no read-back loop at all.
  - Resources the agent modifies and whose modification does the work — a scratchpad, a sketch, a reordered pile — where nothing like storage-and-retrieval is happening.
  - Resources the agent built itself versus ones designed by someone else: your own notebook versus your colleague's, your own retrieval corpus versus a vendor's.
  - Dependence that fades with practice: the newcomer who must look up every API signature and the veteran who no longer does. Does the theory have to handle degrees and trajectories, or can it defend a binary verdict?
  - The pair-programming and on-call-rotation cases, where the functionally relevant loop runs through other people. If the cut isn't at the skull and the skin, what stops it from running out to the whole organization, and is that stopping problem a defect of the theory or of my question?
  - The gap between extending cognition and extending a mind: whether my design question even needs the phenomenal-consciousness half of the claim, and whether a theory may collapse that distinction or must respect it.

  Beyond the cases, tell me which desiderata you think cannot be jointly satisfied — if some subset is unsatisfiable, that itself is the answer I most want — and which single requirement does the most work in excluding candidates. I'd also like a short scorecard, but score moves rather than authors: the parity-style move (treat an external process that plays the same functional role as an internal one as cognitive), the proprietary-marker move (cognition requires a kind of content or process artifacts cannot have), the integration-and-entrenchment move (availability, ease of access, trust, and a history of incorporation into practice), and the interventionist move (constitution as mutual manipulability). No names, dates, or citations — I want the moves, not the bibliography. A table is fine if it stays readable.

  Two last things. First, I have no philosophy background: flag any term of art when you first use it, but don't slow down to explain the basics of the debate. Second, calibrate and push back: tell me which claims in your answer you hold confidently and which are contestable or speculative, and if the request as posed rests on a confused premise — if "part of the cognitive system" has no fact of the matter to be right about, or if my design question turns out to be a different question wearing this one's clothes — say that plainly instead of handing me a tidy list.
reasoning: |-
  We are building a decision procedure for whether an artifact embedded in a practice is part of an agent's cognitive machinery (constitutive of cognition) or merely a tool the agent uses (causally contributing but not constitutive). The theory of cognitive extension must adjudicate the provided cases and meet specific requirements.

  ### Core Requirements for the Theory (Non-negotiable unless marked)

  1. **Functional Equivalence (Non-negotiable)**:  
     - *Requirement*: The theory must be able to judge whether an external resource plays the same functional role as an internal cognitive process. If it does, it is part of the cognitive system.  
     - *Case*: The retrieval-augmented agent vs. the pre-trained agent. Both depend on the same text, but only the pre-trained case is intuitively "remembering" because the text is stored in weights. However, the retrieval agent uses an external store in a way that functions as memory. The theory must explain why one is cognitive and the other is not, or if both are, under what conditions.  
     - *Note*: This is the heart of the parity principle (move 1 in the scorecard). Without functional equivalence, the theory fails at its core.

  2. **Non-Derivation (Non-negotiable)**:  
     - *Requirement*: The cognitive status of the artifact must not depend solely on whether the content was internally generated or externally provided.  
     - *Case*: The senior engineer using the IDE. She depends on external artifacts (autocomplete, inline docs) that she did not create. Yet, this dependence is seen as competence. Similarly, a retrieval agent using a vendor's corpus vs. its own. The theory must not rule out externally designed artifacts as non-cognitive by default.  
     - *Note*: This rejects the proprietary-marker move (move 2) as a sole criterion.

  3. **Process Dynamism (Non-negotiable)**:  
     - *Requirement*: The theory must account for processes where the artifact is not just stored information but is actively modified and used in real-time problem-solving without explicit storage-and-retrieval.  
     - *Case*: The scratchpad or reordered pile. The agent modifies the artifact and the modification does the cognitive work (e.g., rearranging index cards to structure an argument). The theory must recognize such cases as cognitive extension.  
     - *Note*: This moves beyond simple memory to include real-time manipulation.

  4. **Temporal Flexibility (Non-negotiable)**:  
     - *Requirement*: The theory must handle cases where the external resource is used at write-time only (with no read-back) and cases of fading dependence.  
     - *Case*: The diarist who writes but never rereads. The act of writing itself is cognitive (e.g., organizing thoughts). Also, the newcomer who must look up everything vs. the veteran who doesn't. The theory must explain how the same artifact can transition from being a tool to being internalized (or not) and how one-time use can be cognitive.  
     - *Note*: The theory must handle degrees and trajectories (e.g., via entrenchment). A binary verdict is insufficient.

  5. **Loop Closure (Non-negotiable)**:  
     - *Requirement*: The cognitive loop must close without requiring the artifact to be inside the skull. The theory must define the boundaries of the cognitive system without falling into the "coupling-constitution fallacy" (mistaking causal coupling for constitution).  
     - *Case*: Pair programming and on-call rotations. The loop runs through other people. The theory must explain why the organization isn't the cognitive agent without arbitrarily stopping at the skull.  
     - *Note*: The interventionist move (mutual manipulability) can help here: if an external resource is mutually manipulable with internal states in a way that is reciprocal and synchronous, it may be constitutive.

  6. **Phenomenal Neutrality (Preference, but strong)**:  
     - *Requirement*: The theory should not require phenomenal consciousness (subjective experience) for cognitive extension. The focus should be on functional and informational properties.  
     - *Case*: The gap between extending cognition and extending a mind. Your design question is about cognition (e.g., problem-solving, memory), not about subjective experience.  
     - *Note*: This is a preference because some theories (e.g., those emphasizing embodiment) tie cognition to consciousness. For tooling, functional extension is what matters.

  7. **Mutual Manipulability (Non-negotiable)**:  
     - *Requirement*: The artifact must be mutually manipulable with the agent's internal states. That is, changes in the artifact immediately and directly affect the agent's cognitive state, and vice versa, without intermediate steps that break the coupling.  
     - *Case*: The retrieval agent: if the agent can directly invoke and use the retrieval without a detour (e.g., manual lookup), and the retrieved content directly influences reasoning, then it may be part of the cognitive process. Similarly, the IDE: the engineer's changes to the code and the IDE's feedback are tightly interleaved.  
     - *Note*: This is the interventionist move (move 4). It helps avoid over-extension (e.g., to the whole organization) by requiring tight coupling.

  8. **Integration and Entrenchment (Non-negotiable)**:  
     - *Requirement*: The artifact must be deeply integrated into the agent's cognitive routines, trusted, and reliably available. It must be entrenched in the agent's practices.  
     - *Case*: The senior engineer's dependence on the IDE. The artifact is always there, trusted, and used without question. The newcomer's lookups are not yet entrenched.  
     - *Note*: This is the integration-and-entrenchment move (move 3). It explains the fading dependence: as an artifact becomes entrenched, it is more likely to be seen as part of cognition.

  ### Additional Cases to Consider

  - **The Forgetting Artifact**: An artifact that actively hides information from the agent until triggered, but when triggered, it provides critical context. Is this part of cognition? (Tests non-continuous availability.)
  - **The Self-Modifying Artifact**: An artifact that changes its own structure based on the agent's use (e.g., an adaptive autocomplete). Does this deeper integration make it more cognitive? (Tests dynamism and integration.)
  - **The Ephemeral Artifact**: A resource that is used once and discarded (e.g., a sticky note). Does the theory require persistence? (Relates to the diarist case.)

  ### Tensions and Unsatisfiable Desiderata?

  - **Tension between Functional Equivalence and Mutual Manipulability**:  
    Functional equivalence might be too permissive (e.g., the retrieval agent and the pre-trained agent are functionally equivalent in output, but the mechanisms differ). Mutual manipulability might rule out cases like the diarist (no read-back, so no mutual manipulation after writing).  
    - *Proposed resolution*: The theory must require that the artifact is part of the *current* cognitive process. The diarist's writing is part of the cognitive process at write-time. For the retrieval agent, if the retrieval is invoked automatically and the content is directly fed into reasoning, it is mutually manipulable.

  - **Tension between Entrenchment and Dynamism**:  
    Entrenchment suggests a history of use, but the scratchpad might be ad-hoc. Does the theory require long-term use?  
    - *Resolution*: No. The scratchpad is part of the cognitive process during the task, regardless of prior use. Entrenchment matters for stable extensions (like the IDE) but not for one-off tasks.

  - **The Organization Problem**:  
    If the loop runs through other people (pair programming), mutual manipulability might still hold (immediate feedback). But if the organization is too large (e.g., a company-wide process), the coupling is too loose. The theory must require that the loop is closed within a task-relevant timeframe and with direct interaction. This is non-negotiable.

  ### Scorecard of Moves

  | Move                          | What it does                                                                 | Strengths                                  | Weaknesses                                | Status for our purpose          |
  |-------------------------------|------------------------------------------------------------------------------|--------------------------------------------|-------------------------------------------|---------------------------------|
  | **Parity-style**              | Treats external processes that play the same functional role as internal ones as cognitive. | Avoids brain chauvinism; intuitive. | Too permissive? (e.g., a book on a shelf is not cognitive). | Core, but must be constrained. |
  | **Proprietary-marker**        | Claims that cognition requires a kind of content or process only internal states can have (e.g., non-derived content). | Protects against over-extension. | Rules out clear cases (e.g., the IDE-using engineer). | Rejected as sole criterion. |
  | **Integration-and-entrenchment** | Focuses on availability, ease of access, trust, and history of use.          | Explains the senior engineer's competence and fading dependence. | May exclude novel or one-off tools (e.g., a scratchpad). | Required, but must allow for task-bound use. |
  | **Interventionist (mutual manipulability)** | Defines constitution by reciprocal causal influence: if you can intervene on the artifact to change the cognitive outcome and vice versa, it's constitutive. | Sets clear boundaries (e.g., rules out the whole organization). | May be too strict for cases without real-time interaction (e.g., the diarist). | Required, but must account for non-simultaneous cases. |

  ### The Most Work-Doing Requirement

  **Mutual Manipulability** does the most work in excluding candidates because it sets a clear, testable condition that avoids over-extension (e.g., to the entire internet) and under-extension (e.g., excluding the IDE). It forces the coupling to be tight enough that the artifact is part of the cognitive loop.

  ### Calibration and Pushback

  - **Confidently held**: The need for mutual manipulability and functional equivalence. Without these, the theory either overextends or becomes arbitrary.
  - **Contestable**: The requirement for integration and entrenchment. Some argue that even novel tools can be part of cognition if properly coupled. I lean toward requiring at least task-bound integration.
  - **Speculative**: Whether the diarist case is cognitive extension. Some might argue that without read-back, it's just an output. But I hold that the act of writing can reorganize thought, making it cognitive.
  - **The Big Pushback**: Your question assumes there is a fact of the matter about whether an artifact is "part of the cognitive system." But this might be a category mistake. The boundary between tool and extension may be pragmatic, depending on the context of use and the agent's skill. The theory might only provide a gradient (degree of integration) rather than a binary. For design, this gradient might be more useful: how to maximize the degree of cognitive extension?

  ### Final Decision Procedure

  A candidate artifact, in a given practice, is part of the agent's cognitive machinery if:

  1. **Functional Role**: It plays a role typically associated with cognition (e.g., memory, reasoning, attention) and is functionally equivalent to an internal process.
  2. **Mutual Manipulability**: The artifact and the agent's internal states are reciprocally and directly causally interdependent during the cognitive task.
  3. **Integration**: The artifact is reliably available, trusted, and incorporated into the agent's routines for that task (even if the task is short-lived).
  4. **Non-Derivation**: The origin of the artifact (self-built or by others) does not disqualify it.

  This procedure handles:
  - The retrieval agent: If the retrieval is automatic and the content is directly used (mutual manipulability), then it is cognitive. The pre-trained agent is also cognitive, but the memory is internal.
  - The senior engineer: The IDE is mutually manipulable (changes in code affect autocomplete, which affects her next steps) and integrated. She is cognitively extended.
  - The diarist: At write-time, the notebook is mutually manipulable (her thoughts shape what she writes, and the act of writing shapes her thoughts) and integrated. It is part of cognition at that moment.
  - The scratchpad: Same as diarist, during the task.
  - Fading dependence: The newcomer's lookups are not yet integrated/entrenched? But during the lookup, it is part of cognition. The veteran has internalized it, so the artifact is no longer needed. The theory must allow that the same artifact can be cognitive for one agent and not for another, or at one time and not another.
  - Pair programming: If the feedback is immediate and reciprocal, the partner is part of the cognitive system for that task. But if the loop is too slow (e.g., emailing a colleague), it's not.

  ### What's Missing?

  - **Error and Self-Monitoring**: The retrieval agent doesn't notice errors in retrieved text. Does this break integration (trust is misplaced)? The theory must handle imperfect artifacts. Requirement: The artifact need not be perfect, but the agent must have a way of monitoring and correcting (or the process must be robust). If the agent blindly trusts, it might be a tool, not an extension? This is tricky.

  This is a working theory. It may need refinement, but it meets your cases and requirements.
answer: |-
  ### Core Requirements for a Usable Theory of Cognitive Extension  
  To serve as a decision procedure for your design question, the theory must meet these requirements. Each is rooted in your cases and the need to avoid arbitrariness. **Non-negotiable** requirements are essential for adjudicating your cases; **preferences** reflect tensions in the debate. I flag prejudices where they masquerade as constraints.  

  #### 1. **Functional-Role Parity (Non-negotiable)**  
     - **Requirement**: The theory must treat external processes that play the *same functional role* as internal cognitive processes as constitutive of cognition. No privileging of "biological" implementation.  
     - **Case Behind It**: The retrieval-augmented agent vs. the pre-trained agent. Both rely on external text, but the pre-trained agent has internalized it (weights), making it "memory." The retrieval agent uses an external store identically to how humans use working memory—functional parity suggests it *is* cognitive extension.  
     - **Prejudice Alert**: Rejecting this is often a "proprietary-marker" prejudice (e.g., "only brains can *truly* remember").  

  #### 2. **Mutual Manipulability (Non-negotiable)**  
     - **Requirement**: The artifact must be *mutually manipulable* with the agent’s internal states: interventions on the artifact directly alter cognitive outcomes (e.g., reasoning errors), and vice versa.  
     - **Case Behind It**: The senior engineer’s IDE dependence. Changing the autocomplete (e.g., disabling it) disrupts her ability to reason about invariants; her actions also update the IDE’s state. Contrast with a reference manual consulted rarely—no tight coupling.  
     - **Prejudice Alert**: Overlooked by theories that focus only on access (e.g., "availability = extension").  

  #### 3. **Integration and Entrenchment (Non-negotiable)**  
     - **Requirement**: The artifact must be *reliably integrated* into the agent’s cognitive routines (trusted, accessible, habitual). Entrenchment includes *fading dependence* over time.  
     - **Case Behind It**: The newcomer/veteran contrast. The newcomer’s API lookups are not entrenched (effortful, interruptive); the veteran’s autocomplete is automated and trusted. The diarist’s write-time externalization is integrated *during the act* (even without read-back).  
     - **Prejudice Alert**: Some overemphasize permanence ("must be always available"), but entrenchment can be task-bound (e.g., the scratchpad during a session).  

  #### 4. **Non-Derived Content Tolerance (Non-negotiable)**  
     - **Requirement**: The artifact’s content need not be *self-generated* by the agent. Externally provided content (e.g., vendor’s corpus, colleague’s notes) can be cognitive if functionally integrated.  
     - **Case Behind It**: The senior engineer’s IDE (vendor-designed) vs. her personal notes. Both are constitutive when entrenched. The theory must not privilege "original authorship."  
     - **Prejudice Alert**: "Proprietary-marker" moves often demand self-generated content—a bias for individualism.  

  #### 5. **Process Dynamism (Non-negotiable)**  
     - **Requirement**: The theory must handle artifacts that *modify state* to do cognitive work (e.g., reordering, sketching) without storage/retrieval.  
     - **Case Behind It**: Scratchpads or reordered piles. The agent’s actions on the artifact *are* the reasoning (e.g., moving a sticky note to test an idea). No "retrieval" occurs—yet it’s cognitive labor.  

  #### 6. **Loop-Closure Boundary (Non-negotiable)**  
     - **Requirement**: The theory must define a *causal boundary* for cognitive systems that isn’t skull- or skin-based but doesn’t overextend to the whole organization.  
     - **Case Behind It**: Pair programming/on-call rotations. The loop through other people is cognitive if *feedback is immediate and task-specific* (e.g., real-time pair debugging). Slow, organizational processes (e.g., quarterly reviews) fail mutual manipulability.  
     - **Prejudice Alert**: Skeptics claim this *must* collapse into "everything is cognition"—a false dilemma.  

  #### 7. **Phenomenal Neutrality (Preference)**  
     - **Requirement**: The theory should *ignore phenomenal consciousness* (subjective experience). Focus on functional, non-phenomenal cognition (e.g., problem-solving, memory).  
     - **Case Behind It**: The gap between "extending cognition" vs. "extending a mind." Your design question (e.g., autocomplete aiding reasoning) doesn’t need the "what it’s like" problem.  
     - **Prejudice Alert**: Embodied cognition theories often smuggle in phenomenal requirements.  

  #### 8. **Degrees of Extension (Preference)**  
     - **Requirement**: The theory must handle *gradience* (artifacts can be "more or less" cognitive) and *trajectories* (e.g., fading dependence). Avoid binary verdicts.  
     - **Case Behind It**: The newcomer-to-veteran transition. A binary theory would misclassify intermediates (e.g., "partially entrenched" tools).  

  ### Unsatisfiable Desiderata  
  - **Functional Parity + Loop Closure + Anti-Overextension** is the critical tension:  
    - Functional parity ("same role = cognitive") risks overextension (e.g., the entire internet as "memory").  
    - Loop closure via mutual manipulability reins this in (e.g., only *directly coupled* resources count).  
    - **But**: Mutual manipulability struggles with **one-time, non-revisable use** (e.g., the diarist). If writing reorganizes thought at *t=0* but is never consulted, is it still "mutual"? This may require accepting gradience (entrenchment *during the act*).  
  - **Satisfiable if**: Mutual manipulability includes *synchronous* loops (e.g., diarist’s writing *in the moment*), not just persistent states.  

  ### Most Excluding Requirement  
  **Mutual manipulability** does the most work in excluding candidates:  
  - It nixes the retrieval agent *if* errors go unnoticed (no feedback loop for correction = no mutual influence).  
  - It allows the IDE but rejects rarely used docs.  
  - It permits pair programming but blocks org-wide processes.  

  ### Scorecard of Moves  
  | Move                          | What It Claims                                                                 | Works For Your Cases?                               | Fails For Your Cases?                          |  
  |-------------------------------|-------------------------------------------------------------------------------|----------------------------------------------------|------------------------------------------------|  
  | **Parity-style**              | "Same functional role as internal process → cognitive."                      | Retrieval agent (vs. training), scratchpad (vs. mental sketch). | Senior engineer (if IDE ≠ biological memory?); overextends to internet. |  
  | **Proprietary-marker**        | "Artifacts lack 'true' cognition (e.g., non-derived content, biological basis)." | Pre-trained agent (internal = "real" memory).      | Senior engineer (competent but dependent), vendor corpus. |  
  | **Integration-and-entrenchment** | "Trust, access, history → cognitive."                                        | Fading dependence, IDE, diarist (write-time entrenchment). | Novel artifacts (no history), scratchpad (ad-hoc). |  
  | **Interventionist**           | "Mutual manipulability → constitution."                                      | IDE (disabling breaks reasoning), pair programming. | Diarist (if no read-back), retrieval agent (if errors unnoticed). |  

  ### Calibration and Pushback  
  - **Confidently Held**: Mutual manipulability is necessary for loop closure. Without it, cognition extends to every tool (violating your design constraints).  
  - **Contestable**: Whether the diarist case is cognitive extension. Some argue "no read-back = no extension." I argue *write-time* reorganization counts if integrated.  
  - **Speculative**: Gradience/degrees. We lack data on how *much* integration suffices, but trajectories (e.g., newcomer→veteran) demand it.  
  - **Fundamental Pushback**: Your question **assumes a fact of the matter** about "part of the cognitive system." But:  
    - This may be **pragmatic, not metaphysical**. For design, ask: "Does treating it as constitutive improve outcomes?" (e.g., reliability, speed).  
    - Your core issue is **engineerability**, not philosophy: "How do I design artifacts that *become* cognitive extensions?" The theory should guide *how to achieve* entrenchment/manipulability, not just label.  
    - **Recommendation**: Focus on **conditions for extension** (e.g., mutual manipulability, integration) as design goals. Binary verdicts are less useful than levers (e.g., "increase feedback speed").  

  ### Missing Cases  
  - **The Self-Correcting Artifact**: An IDE that flags errors in real-time and adapts to user habits. Tests mutual manipulability + integration.  
  - **The Ephemeral Tool**: A calculator used once vs. always-on. Tests gradience and task-bound entrenchment.  
  - **Cross-Agent Artifacts**: Shared dashboards in ops teams. Tests loop closure with multiple humans.  

  ### Bogus Case?  
  - **"The entire organization"**: Rejected by mutual manipulability—feedback loops are too slow/diffuse. Not a defect of the theory.  

  ### Final Output  
  A candidate artifact is **part of the cognitive system** iff:  
  1. It plays a functional role equivalent to an internal cognitive process.  
  2. It is mutually manipulable with the agent’s states (interventions in either change outcomes).  
  3. It is reliably integrated (trusted, accessible, habituated) *for a task*.  
  4. Entrenchment can be partial or transient (gradience acceptable).  

  **For your design reviews**: If the artifact meets (1)–(3) in context, it’s cognitive machinery. Else, it’s a consultative tool. Use integration levers (e.g., speed, feedback) to push artifacts toward extension.
