answer: |-
  You're onto something important. The horizontal/vertical distinction **is doing real work**, and your suspicion about the wash argument harboring a systematic bias is correct. Let's break this down conceptually with minimal jargon.

  ### 1. The Horizontal/Vertical Split: It's Real
  *   **Horizontal Cluelessness (Fixed Horizon, Uncertain Paths):**
      *   *What it is:* You fix a temporal horizon (e.g., 200 years). You know you need to maximize expected value *over outcomes within that horizon*. The problem is that predicting the causal pathways within that horizon is massively complex, leading to deep empirical uncertainty about *which* specific outcome branch your action leads to. Your probability distribution over outcomes is extremely wide and flat.
      *   *Why it's "just" empirical uncertainty:* The *normative target* is fixed (EV over 200yrs). The challenge is purely epistemic: gathering evidence or refining models *could* theoretically sharpen your probability distribution, even if it's practically impossible. The core consequentialist machinery (assign probabilities, assign values, calculate EV) is conceptually intact, just computationally intractable. "Take the expectation" *is* well-defined advice here, even if the answer is "I have no clue what that expectation is."

  *   **Vertical Cluelessness (Uncertain Horizon, Uncertain What Matters):**
      *   *What it is:* You fundamentally don't know *how far into the future* consequences morally matter, or if they matter *less* the further out they are (and if so, by what discounting rule, if any). The problem isn't predicting paths *within a frame*; it's determining *what the frame itself should be*. What is the "T" in "maximize EV over 0 to T years"?
      *   **Why it's NOT reducible to horizontal cluelessness:** Trying to reduce it to "uncertainty over T" runs into a fatal problem: **The value function changes with T.**
          *   Imagine a mixture model: You have credence P(T=200), P(T=1000), P(T=1,000,000), etc. For each T, you calculate EV_T(action). You then take the expected value *over T*: Σ [P(T) * EV_T(action)].
          *   **The Collapse Failure:** This fails because EV_T(action) isn't just a number *about the world*; it's a number *relative to a specific normative choice* (valuing consequences only up to T). Summing P(T)*EV_T mixes values calculated under *incompatible normative frameworks*. It's like trying to average your height in meters with your weight in kilograms because you're uncertain whether "size" refers to height or weight. The outputs (EV_200, EV_1000, EV_1e6) are answers to *different normative questions*. Averaging them isn't giving you an answer to "What maximizes expected value?"; it's giving you a meaningless amalgam.
          *   **The Source of the Problem:** Vertical cluelessness stems from a **meta-normative uncertainty**: uncertainty about *which temporal scope constitutes the correct consequentialist evaluation*. This *cannot* be resolved by gathering more empirical evidence about causal chains. Evidence tells you *what happens*; it doesn't tell you *how far into the future what happens matters morally*. Consequentialism, as standardly formulated, doesn't specify T. This is upstream of probability assignment – it's about defining the object over which probabilities are taken. "Just take the expectation" *isn't* well-formed advice because we haven't agreed on *what quantity's expectation we're taking*.

  ### 2. Which Responses Target Which Problem?
  *   **Symmetry Arguments ("Long-run effects wash out"):** Primarily targets **Horizontal Cluelessness** within a *presumed* long (often infinite) horizon. The argument assumes T is large/fixed and tries to show that *within that fixed T*, the expectation of distant effects is zero or cancels out due to symmetry, leaving near-term effects dominant. It generally **ignores Vertical Cluelessness**, simply assuming a long T is correct.
  *   **"Fall back on commonsense duty" / "Virtues" / "Procedures":** This is often a response to the *intractability* caused by **both** types of cluelessness. It effectively says "Consequentialist calculation under deep uncertainty (horizontal or vertical) is impossible/too risky/misleading, so use these non-consequentialist (or non-maximizing) rules instead." It bypasses the EV calculation altogether.
  *   **Appeals to Near-Term Reasons:** Primarily leverages the *conclusion* of symmetry arguments applied to horizontal cluelessness ("long-run washes out, so focus on near-term"). It also implicitly assumes that near-term effects are *reliable proxies* for longer-term effects, which is a separate empirical claim vulnerable to vertical cluelessness (maybe the real long-term effects are completely decoupled from near-term proxies). It **doesn't resolve Vertical Cluelessness**; it assumes near-term focus is sufficient *regardless* of T.
  *   **Abandoning EV Maximization (e.g., Robust Optimization, Satisficing):** Targets the *intractability and instability* caused by **Horizontal Cluelessness**. These methods try to find actions that are "good enough" or perform acceptably well across a wide range of plausible futures *within a fixed horizon*. They generally **sidestep but don't resolve Vertical Cluelessness**; they still require specifying the outcomes over which robustness/satisficing is evaluated (i.e., they need a scope).
  *   **The Gap:** No standard response adequately addresses **Vertical Cluelessness**. Symmetry arguments assume T, near-term focus assumes T is irrelevant, fallback rules abandon consequentialism, robust methods need T defined. Vertical cluelessness points to a foundational ambiguity within consequentialism itself regarding temporal scope.

  ### 3. Scale-Dependence & The Wash Argument: Your Arithmetic is Sound
  Let's model your Option A (Big Systemic Push) vs. Option B (Local Bednets).

  *   **Setup:**
      *   **Near-Term EV (Knowable):** Suppose we can reasonably estimate the near-term (e.g., 20-year) EV.
          *   A (Systemic): Near-EV = +100 units (e.g., "good trajectory points")
          *   B (Bednets): Near-EV = +10 units (lives saved)
      *   **Long-Term Effect (Clueless):** The true long-term (post-20yr) effect of each action is unknown. Crucially, we model the **magnitude of potential impact** and the **magnitude of uncertainty**.
          *   A (Systemic): Could steer civilization towards utopia (+X) or catastrophe (-X). Given its scale, X is *large* (say, |X| ~ 10,000 units). Your credence is symmetric: P(+X) = 0.5, P(-X) = 0.5. So Long-EV(A) = (0.5 * 10000) + (0.5 * -10000) = 0.
          *   B (Bednets): Long-term effects are much smaller in magnitude because it's local. Maybe it slightly influences regional development. Let |Y| ~ 10 units. Symmetric uncertainty: P(+Y)=0.5, P(-Y)=0.5. Long-EV(B) = (0.5 * 10) + (0.5 * -10) = 0.
      *   **"Wash" Argument:** Long-EV(A) = 0, Long-EV(B) = 0. So Total EV(A) = Near-EV(A) + Long-EV(A) = 100 + 0 = 100. Total EV(B) = 10 + 0 = 10. Choose A.

  *   **Your Challenge (Proportional Uncertainty):** You argue that the *size of the error bar* scales with the scale of the intervention. Bigger interventions have proportionally larger potential impacts *and* proportionally larger uncertainties. You suspect the symmetry argument relies on *absolute* error cancellation, but proportional scaling might break this.
      *   **Refining the Model:** The wash argument assumes the symmetric uncertainty is over *absolute* long-term value. But if uncertainty is *proportional*, the *range* of possible values scales with the intervention size. In our model, |X_A| >> |Y_B| because A is bigger. The symmetry (P(+)=P(-)=0.5) is over *sign*, not magnitude. The **variance** of the long-term effect is vastly larger for A than for B:
          *   Var(Long-A) = E[X^2] - (E[X])^2 ≈ E[X^2] (since E[X]=0) = 0.5*(10000)^2 + 0.5*(-10000)^2 = 100,000,000
          *   Var(Long-B) ≈ E[Y^2] = 0.5*(10)^2 + 0.5*(-10)^2 = 100
      *   **The "Wash" is Fragile:** The argument Long-EV(A)=0 is only the *expected value*. Because the variance is enormous, the *actual realization* of the long-term effect is highly likely to be *massively positive or massively negative*, not zero. While the *mean* cancels, the *potential deviations from the mean* are colossal for A and trivial for B.
  *   **Why This Matters for Decision-Making:**
      1.  **Risk Aversion:** If the decision-maker is risk-averse (cares about downside risk), the huge variance of A makes it far less attractive than B, even though their *expected* long-term values are equal. The wash argument ignores risk.
      2.  **Systematic Bias (Your Key Insight):** The wash argument treats the cancellation of large positive and large negative potentials as equivalent to the cancellation of small positive and small negative potentials. **It penalizes large-scale interventions by equating their massive potential downside risk with the negligible downside risk of small interventions, simply because their *averages* both happen to be zero.** The bigger the gap in scale (|X_A| vs |Y_B|), the larger this hidden penalty becomes. Choosing based solely on near-term effects + symmetric long-term wash *systematically favors smaller, more localized interventions* because their long-term uncertainty carries less absolute risk, even if its expectation is zero.
      3.  **Threat to Cancellation:** This absolutely threatens the cancellation argument *as a basis for action*. Saying "long-run washes out so ignore it and act on near-term" is only sound *if* the potential deviations from zero (the risks) are acceptable or irrelevant. For large-scale interventions, the potential deviations are enormous and likely *are* relevant, especially if we care about avoiding catastrophe. The wash argument hinges on *expectation*, but *decision-making under uncertainty* often must consider higher moments (variance, skew) or use non-EV criteria. **The symmetry argument masks the scale-dependent risk.**

  *   **Does it collapse to "higher variance options have higher variance"?** Partly, but it's more specific and normatively significant. Yes, A has higher variance. But the key points are:
      *   The variance scales systematically with the *scale of the intervention*.
      *   This scaling creates a systematic bias *against* large interventions when using the wash argument + near-term focus.
      *   This bias arises directly from combining proportional uncertainty with the symmetry cancellation move. It highlights that the "wash" isn't benign neutrality; it actively disadvantages large bets by equating their massive potential downsides with the tiny downsides of small bets.

  ### Conclusion & Clarifications

  1.  **The Split is Real:** Horizontal cluelessness is deep empirical uncertainty *within* a fixed normative framework (fixed T). Vertical cluelessness is uncertainty *about* the normative framework itself (what is T?). They are distinct because the value function defining EV depends fundamentally on T. Reducing vertical to a mixture over T commits a category error by mixing values defined under incompatible frameworks.
  2.  **Responses Mismatch:** Common responses (symmetry, near-term focus) primarily target horizontal cluelessness, assuming or sidestepping the vertical question. Vertical cluelessness remains largely unaddressed and points to a meta-normative lacuna in consequentialism.
  3.  **Scale-Dependence is a Problem:** Your analysis of the wash argument is correct. Assuming proportional uncertainty (error scales with intervention size) means that while the *expected* long-term effect may cancel to zero for both large and small interventions, the *absolute magnitude of potential deviation* (risk) is vastly larger for large interventions. Using the wash argument to justify focusing solely on near-term effects therefore systematically penalizes large-scale interventions. This isn't just "obvious variance"; it's a specific bias inherent in applying that particular argument to interventions of differing scales.

  **Flagged Assumption:** Your proportional uncertainty assumption ("size of your error about flow-through effects scales with the size of the intervention") is crucial and plausible for many large-scale systemic interventions vs. localized ones. However, it's not necessarily *always* true. Sometimes a small intervention might have massive, unpredictable ripple effects (a "butterfly effect" scenario), and sometimes a large intervention might have very predictable long-term channels. But your point stands for the *typical* cases where intervention scale correlates with potential impact magnitude and uncertainty range, which is often a reasonable heuristic. The wash argument's vulnerability to this plausible assumption is its weakness.

  This distinction clarifies why cluelessness feels like more than just hard empirics – vertical cluelessness is a fundamental uncertainty about what consequentialism even demands we calculate. And your scale-dependence point reveals a potentially serious flaw in a common attempt to "solve" horizontal cluelessness.
