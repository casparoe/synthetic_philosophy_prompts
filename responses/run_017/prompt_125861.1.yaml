prompt: |-
  hey — I'm a software engineer, no formal philosophy background at all, so please don't assume I know any of the terminology: if there's a term of art I should be using, name it and define it in half a sentence. I'm applying for a tiny artist-run microgrant (something like $8k, four months, realistically 8–10 hours a week since this is nights and weekends) and what they want back is a public repo plus a short writeup, not an academic paper. So I need a two-page-ish research proposal, and please skip any bibliography or citations entirely — I'll add those myself later or leave them out, and I'd rather the space go to the actual argument.

  The topic is the thing that gets called the Letter Spirit problem: what makes every 'a' an 'a', given that the 'a' in a Didone serif face, in blackletter, in a 3x5 pixel bitmap font, and in my five-year-old's crayon scrawl share basically no measurable geometry. I've been messing with variable fonts and SVG path interpolation on weekends, and two things keep bugging me. First, naive interpolation between two outlines is fine geometrically but produces total garbage semantically: morph an 'a' into a 'u' and the midpoint is neither. Fixing it requires deciding which point on one outline corresponds to which point on the other, and the only way I know to do that is by thinking in terms of parts — stem, bowl, shoulder, terminal, aperture — which starts to feel like the letter's identity is carried by a part structure plus qualitative relations (how many enclosed counters, which way the aperture opens, what's attached to what, what's above what) rather than by shape. Second, I got into an argument with a friend who does ML and insisted the whole thing is just clustering: embed a bunch of outlines, and 'a' is a region in that space. But that seems to miss that a Latin 'a' and a Cyrillic 'а' can be pixel-identical and still be different letters, because they belong to different contrast sets — and conversely that someone could design a brand-new glyph with no causal descent from any scribal tradition and it would instantly be an 'a'. My half-formed idea, which I want turned into a real proposal, is to stop asking what all the a's have in common and instead ask what has to be held fixed while everything else is allowed to vary — with the twist that there are two directions of variation: hold the letter fixed and vary style, hold the style fixed and vary the letter, and maybe the category is just whatever sits at the fixed point where those two things cross.

  So here's what I want the proposal to do. State the question precisely enough that it has a determinate answer — I'm tempted by something like: is there a finite specification in a small "anatomy language" of parts and relations such that every recognizable instance of a letter satisfies it and no instance of any other letter does? — but you should push back if that's the wrong sharp version, or if the interesting claim is negative. Say why the two obvious answers leave it open: the prototype / family-resemblance / cluster story, and the historical-or-causal-chain story, and be specific about the case each one dies on. Then the method, month by month, for four months at ~10 hrs/week: I'm imagining month one hand-building the spec language and hand-specifying a deliberately nasty subset (a, o, u, n, h, d, b, p, q, g — the rotation and reflection pairs, because that's where any purely relational spec should break), month two writing a little generator that randomizes the metrics while holding the spec fixed and getting maybe twenty people to classify a few dozen of the outputs, month three running the minimal-edit experiments where I hunt for the smallest geometric change that flips which letter people see and ask whether the flip always coincides with some discrete structural event (a counter opening, a stroke detaching) or whether there are continuous paths where the category changes with nothing discrete happening, and month four doing the held-out test — given twenty-five letters in a style the system hasn't seen, generate the twenty-sixth from its spec and see if readers accept it as belonging. Also: I want an honest failure section. I think the project fails if every letter's spec turns out to need at least one arbitrary metric threshold to keep other letters out, because then "structure" has quietly become prototype-plus-thresholds; and it also fails if the human data shows no sharp boundaries anywhere and everything is graded mush. And tell me, plainly, if ten letters is already too ambitious for the time I have and what you'd cut.
reasoning: |-
  We are writing a research proposal for a software engineer applying for an artist-run microgrant. The topic is the "Letter Spirit" problem: what defines the identity of a letter (like 'a') across vastly different styles? The proposal must be concise (two pages), avoid academic jargon, and skip citations. The core idea is to explore whether letter identity is defined by a fixed structure of parts and relations that remains invariant under style changes, and whether this structure can be captured in a finite specification.

  Key elements:
  - Problem: Letters like 'a' are recognizable in wildly different forms (serif, blackletter, pixel font, child's drawing) despite having no common geometric features. This identity cannot be explained by simple interpolation (which fails semantically) or by clustering in a feature space (which ignores the role of the contrast set in an alphabet).
  - Proposed approach: Instead of seeking common features, we ask: what must be held fixed while style varies? And conversely, what varies when the letter changes within a fixed style? The hypothesis is that letter identity is defined by a discrete structural specification (parts and relations) that remains invariant under style changes.
  - Method: 
    - Month 1: Hand-build a small "anatomy language" (parts: stem, bowl, etc.; relations: attached, above, enclosed, etc.). Specify a challenging subset of letters (a, o, u, n, h, d, b, p, q, g) that are rotation/reflection pairs to test the limits of purely relational specs.
    - Month 2: Write a generator that randomizes metrics (e.g., stroke widths, angles, sizes) while holding the structural spec fixed. Have ~20 people classify generated glyphs to see if they are recognized as the intended letter.
    - Month 3: Conduct minimal-edit experiments: find the smallest geometric change that flips the perceived letter and check if it coincides with a discrete structural event (e.g., a counter opening, a stroke detaching).
    - Month 4: Held-out test: Take 25 letters from a new style, generate the 26th (e.g., 'a') from its spec, and test if readers accept it as belonging to the set.
  - Failure conditions: 
    - If the spec requires arbitrary metric thresholds to exclude other letters, then it's just a prototype model in disguise.
    - If human data shows no sharp boundaries (everything is graded), then the discrete structural view fails.
  - Scope: 10 letters may be ambitious. We might cut to 5-7 (e.g., a, o, n, h, d) to ensure depth.

  Proposal Structure:
  1. Title and Introduction: State the problem and the core idea.
  2. Background: Briefly explain why naive approaches (interpolation, clustering) fail.
  3. Hypothesis: Letter identity is a fixed structural specification (parts and relations) that is invariant under style changes.
  4. Method: Month-by-month plan.
  5. Expected Outcomes and Failure Conditions: What success and failure look like.
  6. Why This Matters: For typography, design, and understanding visual categories.

  Let's write accordingly.
answer: |-
  ### Research Proposal: The Fixed Structure of Letters  
  **Project Duration**: 4 months (8–10 hrs/week)  
  **Output**: Open-source code repo + public writeup  

  ---

  #### **1. The Core Question**  
  What makes an "a" an *a*—even when drawn in wildly different styles (e.g., Times New Roman vs. graffiti)—if not its shape? I hypothesize that **a letter’s identity is defined by a fixed set of abstract "parts" (like stems, bowls, or counters) and their relationships (e.g., "attached to" or "above"), not by specific shapes.** When style changes (e.g., serif to sans-serif), these relationships stay the same. When the letter changes (e.g., "a" to "u"), they break.  

  The sharpened question:  
  > *Can we define every Latin letter (e.g., a, d, g) using a finite "anatomy language" (parts + relations) such that:*  
  > - *Any glyph matching the spec is recognized as that letter, regardless of style.*  
  > - *No glyph matching the spec is mistaken for a different letter.*  

  If this holds, letter identity is structural, not geometric. If not, we’ll learn where it breaks.  

  ---

  #### **2. Why Existing Ideas Fall Short**  
  - **"It’s all clustering!" (The ML view)**: "Embed glyphs in a space; ‘a’ is a region in that space."  
    - *Fails*: A Cyrillic "а" can look identical to a Latin "a" but belongs to a different alphabet (different contrast set). Clustering ignores context.  
  - **"It’s all ancestry!" (The historical view)**: "A glyph is an ‘a’ if it descends from historical ‘a’s."  
    - *Fails*: A brand-new glyph with no lineage (e.g., alien symbols) can instantly be an "a" if it fits Latin relationships. Ancestry isn’t necessary.  

  Both miss **structure**: the invariant "skeleton" of parts/relations that persists when style varies.  

  ---

  #### **3. Method: Four Months, 10 hrs/week**  
  **Goal**: Build a minimal "anatomy language" (a spec defining parts/relations) and test if it captures human recognition.  

  - **Month 1: Define the Spec**  
    - Hand-build a tiny language for letter anatomy:  
      - *Parts*: `stem` (vertical line), `bowl` (curved enclosure), `crossbar` (horizontal connector), etc.  
      - *Relations*: `attached_to(stem, bowl)`, `encloses(bowl, counter)`, `above(crossbar, stem)`, etc.  
    - Hand-specify 10 high-challenge letters: **a, o, u, n, h, d, b, p, q, g**.  
      *Why these?* They form rotation/reflection pairs (e.g., b/d/p/q) where pure geometry fails—structure must resolve ambiguity.  
      *Scope note*: 10 letters is ambitious. If time runs short, I’ll prioritize **a, d, n, o, u** (5 letters) to ensure depth.  

  - **Month 2: Generate and Classify**  
    - Write a glyph generator: Given a spec (e.g., for "a"), randomize style metrics (curvature, stroke width) while holding relations fixed.  
      - *Output*: 100+ glyphs per letter.  
    - Test recognition: Have 20 volunteers classify glyphs as "a", "not a", or "unsure".  
      - *Goal*: If ≥80% agree on "a", the spec works for style variation.  

  - **Month 3: Break the Spec**  
    - **Minimal-edit experiments**: Start with a valid "a", then tweak geometry until observers call it "u" or "d".  
      - *Test*: Does the category flip coincide with a *structural break* (e.g., a bowl detaching from a stem)? Or can it change gradually?  
      - *Implication*: Sharp breaks support structural identity; gradual shifts undermine it.  

  - **Month 4: Held-out Test**  
    - Take 25 letters from an unseen style (e.g., medieval manuscript).  
    - Generate the 26th glyph (e.g., "g") using only its spec.  
    - Ask volunteers: "Does this belong with the others?"  
      - *Success*: Recognition without style exposure.  

  ---

  #### **4. When Does This Fail?**  
  The project fails if:  
  - **Arbitrary thresholds creep in**: If distinguishing "n" from "h" requires rules like "stem must be >30% taller than bowl", we’ve regressed to prototype-based clustering.  
  - **Human judgment is mush**: If volunteers show no consensus (e.g., glyphs are "kinda a, kinda o"), sharp structural boundaries don’t exist.  
  - **The spec is too loose**: If a valid "a" spec also matches some "d" glyphs, structure isn’t sufficient.  

  ---

  #### **5. Why This Matters**  
  - For **designers/developers**: A formal "anatomy language" could revolutionize variable fonts—interpolating shapes without semantic garbage.  
  - For **AI/ML**: If letters are structural, not geometric, models need relational reasoning, not just pixels.  
  - For **art**: Tests if visual meaning is reducible to discrete relationships.  

  This isn’t philosophy—it’s building a testable tool. Success or failure, we’ll open-source the generator, specs, and data.  

  ---  
  **Feasibility**: 10 letters is a stretch for 40 hrs/month. I’ll start with 5 high-priority letters (a, d, n, o, u) and expand if time allows. Compromising depth for breadth would weaken the test.
