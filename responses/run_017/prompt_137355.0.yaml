prompt: |-
  Setting up a reading group on group minds and I want the spec before I let anyone near the views. Take the Ant Fugue style case: a colony, call it Aunt Hillary, where the pitch is that the ants stand to the colony roughly as neurons stand to a brain, the pheromone trails and antennal contacts are the signals, and so the colony itself is the thing that has the mind. I dont care yet whether that is true. What I want is the standard of proof: what would a theory of colony-level mentality have to deliver before I am entitled to say the colony believes the good nest site is to the north *literally*, rather than as a convenient compression of a few hundred ants are laying trails northward?

  Fixing the purpose so adequacy is relative to something: the theory has to be good enough (a) to settle whether colony-level state attributions are explanations or just a handy façon de parler, and (b) to be portable — I want to run whatever test it proposes on other candidate group minds, e.g. a firm with written decision procedures, a server farm of fine-tuned models routing queries to each other, a slime mould spreading over a nutrient map. If a criterion only works for things made of insects, say so and say whether that is a point in its favour.

  Write me the desiderata, each with the case or consideration behind it. Things I already think belong on the list, which you should re-cut, merge or throw out, plus whatever I am missing:

  - House-hunting: scouts visit nest sites and recruit others, and the colony ends up moving to the better one even though no single ant has compared the two. So colony-level states have to be able to carry information no individual member has.
  - The colony can be wrong: a trail to a food source that has since been eaten away persists, and foragers keep following it. So the theory cannot just be tracking reliable covariance or information transfer; it has to make room for misrepresentation.
  - Fission: split the colony down the middle, both halves survive and go on foraging. Which one is Aunt Hillary, which one has the memories, and does the answer depend on organisation or on which ants you happen to have scooped up?
  - The swap case I made up: take two nests with different trail networks and swap the entire workforces between them overnight. Does the mind follow the ants or the nest? Whatever the theory says, it should say it for a reason and not by stipulation.
  - No double counting: the colony's belief and the chemistry of ten thousand ants cannot both be the whole cause of the move. Say how the colony-level cause relates to the ant-level one.
  - The redundancy worry: if every attribution of a colony belief has an equally good ant-by-ant redescription that predicts the same behaviour and supports the same counterfactuals, is the belief real, or is it a compression of our ignorance? I want this turned into a testable requirement rather than a shrug.
  - Gradual replacement: swap ants one at a time for tiny robots that follow the same signalling rules. If mentality survives the slow swap, does it survive the fast one and the all-robot endpoint? If it doesn't, where exactly is the cut-off — and a two-ant colony either has a mind or it doesn't, so be ready for the sorites.
  - The slave-making colonies: some species run their nest with workers of a different species that they raid as pupae. If the colony's states are carried by aliens, genetic relatedness and shared selection can't be what makes the colony a subject. Is that a genuine requirement or a prejudice I am smuggling in?
  - Memory without a rememberer: no individual ant lasts long, so whatever persists is in trails, nest architecture and the distribution of the workers. Is requiring a persisting remembering subject a real desideratum or just individualism in disguise?
  - Too many minds: any overlapping subset of a colony is a functioning system of some sort. The theory has to stop the count from exploding without drawing an arbitrary boundary.

  Also decide, and argue, whether the list is a list for intentionality only — beliefs, desires, responsiveness to reasons — or whether phenomenal consciousness belongs on it too, since I suspect demanding consciousness is one camp's prejudice rather than a requirement, but I might be wrong about which camp.

  Then: mark each requirement non-negotiable or negotiable, and flag any pair you think can't be jointly satisfied — my guess is that determinate belief attribution and no sharp threshold in ant number are already in trouble together, and that mentality being intrinsic to the colony while also being checkable by us without a translation manual for the pheromones might be the other one, but you find the real collisions. Say which single requirement does the most work in knocking out candidates, and which one does almost none.

  Very short last section, half a page at most: score four or five stock positions against the list — as-if or intentional-stance, realiser functionalism about colony states, the superorganism or unit-of-selection view, plain eliminativism about anything above the ants — but keep the weight on the criteria, since that's where I think the actual thinking is. British English throughout, and don't send me off to read anything: I have no library access this week, so no citations, no bibliographies, no "see so-and-so".
reasoning: |-
  Okay, the user is setting up a reading group on group minds and wants a clear standard of proof for attributing mental states to colonies like Aunt Hillary. They provided a list of considerations and want them refined into desiderata, with each explained by a case. They also want to know which are non-negotiable, which conflict, and how some theories stack up against these criteria.

  First, I need to understand their key concerns. They want to distinguish literal belief from convenient compression, ensure the theory is portable to other group minds like firms or server farms, and avoid biases like individualism or consciousness requirements. Their examples like house-hunting, fission, and redundancy are central.

  The user’s list has ten points. I should reorganize them into clearer desiderata. For example, house-hunting and misrepresentation both relate to functional autonomy, so merging them makes sense. Fission and swap cases test persistence conditions, so grouping them under persistence and continuity works. Redundancy and gradual replacement address system-level robustness, while slave-making colonies challenge composition constraints. Memory without a rememberer ties into persistence, and too many minds requires a bounded system criterion.

  I need to check for missing elements. Portability is crucial—each desideratum must apply beyond ants. Also, ensuring the criteria avoid double-counting causes and allow for misrepresentation without anthropomorphism. The user hinted at conflicts, like determinate beliefs vs. no sharp thresholds. That’s important to flag.

  Negotiable vs. non-negotiable: Core issues like functional autonomy and misrepresentation are essential. Portability is non-negotiable. Persistence conditions might be negotiable if theories can justify different boundaries. Consciousness is likely negotiable and should be excluded to avoid bias.

  Conflicts: Functional autonomy vs. redundancy is a tension—if ant-level redescription suffices, group-level attribution might be redundant. Persistence vs. no sharp thresholds creates vagueness problems. Physical implementation vs. portability could clash if physical details matter too much.

  Key desiderata: Functional autonomy is critical—without it, group minds collapse to shorthand. Persistence and continuity are also vital for tracking identity over time. Redundancy might be less decisive but still important for testing explanatory necessity.

  Theories: Intentional stance fails autonomy and persistence. Realiser functionalism struggles with persistence and redundancy. Superorganism view has portability issues. Eliminativism rejects most criteria but ignores autonomy. Each has weaknesses against the desiderata.

  In the response, I'll structure the desiderata clearly, explain each with cases, mark negotiability, identify conflicts, and score theories concisely. Avoid citations, use British English, and ensure portability is emphasized throughout.
answer: |-
  Here are the refined desiderata for a theory of colony-level mentality, structured for clarity, portability, and explanatory adequacy. Each is grounded in your cases and considerations, with negotiability flagged and conflicts identified.

  ---

  ### **Core Desiderata (Non-Negotiable)**
  1. **Functional Autonomy**  
     *Case*: House-hunting scouts lack global information; the colony integrates decentralized signals to "choose" a nest.  
     *Requirement*: Colony states must enable behaviours/decisions *not reducible* to individual member states or simple aggregation. Must apply to firms (e.g., corporate strategy emergent from departments) or server farms (routing decisions beyond any single model).  
     *Why Non-Negotiable*: Without autonomy, group mentality collapses to shorthand.

  2. **Misrepresentational Capacity**  
     *Case*: Persistent trails to depleted food sources show the colony can be "wrong".  
     *Requirement*: The theory must allow colony states to *fail to track truth* (e.g., false beliefs). Must extend to slime moulds following obsolete chemical gradients or firms acting on outdated market data.  
     *Why Non-Negotiable*: Essential for literal (not just informational) intentionality.

  3. **Causal Efficacy without Double-Counting**  
     *Case*: The colony’s "decision" to move north cannot be identical to ant-level biochemistry.  
     *Requirement*: Colony states must be *causally relevant* to behaviour, distinct from micro-causes. E.g., pheromone network *patterns* cause foraging, not just individual ant motions. Must clarify if colony states supervene on, realise, or constrain ant states.  
     *Why Non-Negotiable*: Avoids explanatory vacuity.

  4. **Portability / Substrate Neutrality**  
     *Case*: Must apply to ant colonies, server farms (AI ensembles routing queries), firms (procedural decision-trees), and slime moulds.  
     *Requirement*: Criteria cannot rely on biological specifics (e.g., genetics, carbon-based life). If a test *only* works for insects, it fails.  
     *Why Non-Negotiable*: Central to your purpose; rules out bio-chauvinism.

  5. **Explanatory Irreducibility**  
     *Case*: Redundancy worry – if ant-by-ant redescription predicts identically, is the belief real?  
     *Requirement*: Colony-state attributions must offer *explanatory/predictive advantages* over micro-redescriptions (e.g., simpler models, novel counterfactuals). Test: Removing colony-level terms must degrade explanatory power for systems like server farms.  
     *Why Non-Negotiable*: Separates literal mentality from useful fiction.

  ---

  ### **Negotiable Desiderata**
  6. **Persistence Conditions**  
     *Cases*: Fission (split colonies), swap (ants vs. nest), gradual robot replacement.  
     *Requirement*: Theory must specify what preserves colony identity/mentality: organisation (trails/nest structure) or substrate (specific ants)? Must handle slow/fast robot swaps without vagueness.  
     *Why Negotiable*: Theories may reasonably differ (e.g., organisational continuity vs. historical identity).  
     *Conflict*: Clashes with *No Sharp Thresholds* – gradual replacement invites sorites paradoxes.

  7. **Bounded System**  
     *Case*: Overlapping subsets ("too many minds") – is the foraging squad a separate mind?  
     *Requirement*: Theory must define functional/systemic boundaries to avoid mind proliferation. E.g., only systems with feedback loops sustaining global states "count".  
     *Why Negotiable*: Boundaries may be pragmatic (e.g., "the nest" for ants, "the legal entity" for firms).

  8. **Substrate Independence**  
     *Case*: Slave-making colonies (alien workers), robot swaps.  
     *Requirement*: Mentality should depend on functional role fulfilment, not material composition or genetics.  
     *Why Negotiable*: Some theories may require biological continuity (though this harms portability).

  9. **Memory Without a Persistent Subject**  
     *Case*: Colony "memory" resides in trails/architecture despite ant turnover.  
     *Requirement*: Persisting mentality need not entail a persisting *subject*; distributed storage suffices.  
     *Why Negotiable*: Rejecting this may be individualism in disguise, but some argue subjects are essential.

  ---

  ### **Excluded/Handled Elsewhere**
  - **Consciousness**: Deliberately excluded. Demanding phenomenal consciousness (e.g., "what it’s like to be a colony") is a *prejudice* for *intentionality-focused* theories. Your cases target belief/representation, not experience.  
  - **No Sharp Thresholds**: Handled under *Persistence Conditions* – vagueness is inherent in gradual replacement.  
  - **Double-Counting**: Upgraded to non-negotiable *Causal Efficacy*.

  ---

  ### **Key Conflicts**
  - **Functional Autonomy vs. Explanatory Irreducibility**: If ant-level redescription *is* equally predictive (redundancy worry), autonomy fails. **Resolution**: Autonomy requires irreducibility.  
  - **Persistence vs. No Sharp Thresholds**: Gradual replacement forces arbitrary cut-offs (e.g., "51% robots = mind"). **Unresolvable tension** – mandates theory choice.  
  - **Physical Implementation vs. Portability**: If nest structure is crucial (swap case), server farms may not qualify. **Resolution**: Portability demands abstraction from physics.

  ---

  ### **Most Diagnostic Desiderata**
  - **Knockout Criterion**: **Explanatory Irreducibility**. If colony states add nothing, eliminativism wins.  
  - **Weakest Criterion**: **Substrate Independence** – many theories accept it; rarely decisive.

  ---

  ### **Theory Scores (Half-Page)**
  1. **Intentional Stance (Dennett)**  
     - *"Aunt Hillary believes X if it's useful to predict her behaviour as if she does."*  
     - **Fails**: Autonomy (reducible to heuristic), Misrepresentation (no fact of the matter), Irreducibility (explicitly instrumental). Portable but explanatory only *as-if*.  
  2. **Realiser Functionalism**  
     - *"Mental states = functional roles realised by colony dynamics."*  
     - **Fails**: Persistence (vague on fission/swap), Redundancy (if ant-states realise roles). Passes Autonomy/Misrepresentation/Portability if roles are abstract.  
  3. **Superorganism (Unit-of-Selection)**  
     - *"Colony is a Darwinian individual, hence a cognitive agent."*  
     - **Fails**: Portability (server farms aren’t selected), Slave-making (aliens break genetic unity). Passes Autonomy but conflates evolution with mentality.  
  4. **Eliminativism**  
     - *"Only ants have states; colony-talk is shorthand."*  
     - **Fails**: Autonomy, Misrepresentation, Irreducibility. Wins only if all else fails.  
  5. **Global Workspace Theory (adapted)**  
     - *"Mind arises from integrated information in a shared 'workspace' (e.g., pheromone network)."*  
     - **Best Fit**: Passes Autonomy (integration), Misrepresentation (decoupling), Portability (server farms have data buses), Irreducibility (network topology matters). Struggles with Persistence (fission splits workspace).

  ---

  **Summary**: A viable theory must clear the five non-negotiables, resolve persistence paradoxes pragmatically, and treat consciousness as optional. Global workspace approaches (minus phenomenology) handle most cases cleanly. The swap test and redundancy requirement are the sharpest tools.
