prompt: |-
  I write and test problems for a puzzle competition, and a regular part of the job is the line that says "choose at random": a random chord of a circle, two random break points on a stick, three random points on a sphere. For continuous setups that line keeps turning out not to pin anything down. Draw a chord by picking two points on the circumference independently and uniformly and you get one answer to "is it longer than the side of the inscribed equilateral triangle"; pick a random direction and then a random distance from the centre and you get another; pick a random point inside the circle and let that be the midpoint and you get a third. All three are what any reader would call uniform. I gather that much is a well-known cautionary example; it isn't my question.

  What I keep hitting, and have no word for, is what happens after someone points this out. The move everyone makes, me included, is to say: fine, we don't know which procedure is right, so spread our credence evenly over the procedures we can think of and average their answers. That move seems to fail in its own way. The number you get depends on how many procedures you happened to list, and you can always come up with one more that is just as defensible as the others, so the average drifts and never settles. List the same procedure twice under two descriptions and it silently gets twice the weight. A co-editor and I once produced four different "averages" for the same chord question in one afternoon, each of them principled, mostly because we thought of the methods in different orders. Same story with the stick, where breaking it at two uniform points and breaking it once and then breaking the longer piece give different answers, and averaging the two tells me nothing I trust.

  But it isn't always hopeless, and this is the part I most want pinned down. Sometimes the competing procedures look like one procedure seen from different angles — related by a rotation, or by a rescaling that plainly shouldn't matter to the question being asked — and then averaging over them feels legitimate, and even seems to produce an answer everyone accepts. Other times they look like genuinely different decisions about what to be indifferent between, and averaging just relocates the arbitrariness one level up. I cannot say what the difference is, and when I try I end up restating whichever case I am looking at.

  So: is there an established concept for this second failure, the averaging-over-procedures move that doesn't converge, and is there a term for the distinction between the cases where such averaging is defensible and the cases where it isn't? I make this call four or five times a year and I have to defend it to a co-editor who is not a mathematician, so a name alone won't help me. I need to know whether this is really the first problem reappearing at a higher level or a different problem, what it borders on, and how I could recognise the favourable case before spending a weekend on it. If nothing established fits, say so plainly and give me a definition I could put in a house style guide, together with the cases where it would not apply.
reasoning: |-
  Okay, the user is deeply involved in designing puzzle competitions and frequently encounters the problem of defining "choose at random" for continuous geometric setups. They're aware of the classic Bertrand paradox with the chord problem, where different "uniform" methods yield different probabilities. But their real struggle is with the next step: when people suggest averaging over different procedures to resolve the ambiguity, this averaging itself becomes arbitrary and unstable.

  Hmm, the user describes how averaging depends on which procedures are listed and how many, with weights changing if a method is described twice. They've personally experienced producing multiple "principled" averages for the same problem, each giving different results. Yet, they notice that sometimes this averaging feels legitimate—like when methods are symmetric (rotationally equivalent) or invariant under irrelevant transformations—and produces accepted answers. Other times, methods feel fundamentally different (e.g., stick-breaking procedures), and averaging just shifts the arbitrariness. They need to distinguish these cases reliably, ideally with terminology or a framework, and explain it to non-mathematician collaborators.

  First, I should acknowledge their core observation: naive averaging over procedures is indeed problematic. It's not just the Bertrand paradox; it's a meta-problem of how to handle the paradox. The user is astute to notice that sometimes averaging "works" (feels consistent) and sometimes doesn't. The key distinction lies in whether the procedures are mathematically equivalent representations of the same underlying measure or genuinely different choices.

  For the favorable cases (like rotational symmetry): When different parameterizations describe the same probability measure because of symmetry, averaging is redundant—it just reconfirms the same measure. For example, generating a chord by picking two uniform points on the circumference is rotationally invariant; rotating the circle doesn't change the distribution. Any "different" method that's just a rotated version gives identical probabilities, so averaging doesn't change anything. The user might perceive this as averaging working because all methods agree. The invariance here is the key—the underlying measure is unique under the symmetry group.

  For the unfavorable cases (like stick-breaking): Methods represent different probability measures because they embed distinct indifference assumptions. Breaking at two uniform points vs. breaking once and then breaking the longer piece are fundamentally different physical processes with different distributions. Averaging them combines incompatible measures arbitrarily. The user's co-editor example (four averages for one chord) likely involved mixtures of both types: some methods were symmetric variants (agreeing), others were genuinely different (like midpoint vs. endpoint methods in Bertrand), causing drift when weighted unevenly.

  The established concepts here are:
  - Invariance under symmetry groups: When the problem's natural symmetries imply a unique uniform measure (e.g., Haar measure for compact groups like rotation). This yields consistent answers; averaging symmetric procedures doesn't help but doesn't hurt.
  - Lack of uniqueness: When no such symmetry exists or doesn't constrain the measure uniquely, leading to genuine paradoxes. Averaging then depends on subjective choices.

  For the chord example: 
  - Rotation symmetry: If all methods are rotationally equivalent (e.g., picking points uniformly), they agree. 
  - Scale/translation non-invariance: Methods like "uniform distance from center" break rotational symmetry and introduce a different measure. Averaging these with others is arbitrary.

  For the stick: Breaking once uniformly is translation-invariant, but breaking the longer piece isn't—it depends on the first break's position. These aren't symmetries of the problem, so measures differ.

  To operationalize for the user:
  1. **Identify natural symmetries**: What transformations (rotation, translation, scaling) should leave the probability invariant? For a circle: rotations; for a stick: translations (if endpoints are indistinct). Scaling usually isn't invariant (except for dimensionless questions).
  2. **Check procedure invariance**: Does each procedure yield the same measure under these symmetries? If yes, they agree; no averaging needed. If not, they're incompatible.
  3. **Beware fake symmetries**: Rescaling isn't a symmetry for "length" questions; translation might not be if endpoints are distinct.

  In practice:
  - If all "reasonable" procedures respect the same symmetry group and it implies uniqueness (like rotation for circles), use that measure. Averaging adds nothing.
  - If no unique symmetric measure (Bertrand midpoint vs. endpoint), accept that the problem is underspecified. Averaging is a hack—it papers over ambiguity but doesn't resolve it.

  For the user's house style guide:
  > **Guideline**: When defining "at random," specify the physical/generative procedure. If ambiguity arises:
  > - If the problem has natural symmetries (e.g., rotational symmetry for circles), use the unique measure invariant under those symmetries.
  > - If not, avoid averaging ad-hoc procedures; instead, clarify the setup or accept multiple answers.
  > - Never average across non-equivalent procedures; it introduces arbitrary weights.

  This explains why averaging "works" in symmetric cases (it doesn't—the measure is unique) and fails otherwise. The user can frame it as "respecting symmetries" to non-mathematicians, avoiding meta-averaging pitfalls.
answer: |-
  Your struggle is both profound and common—it's the Bertrand Paradox metastasizing into a higher-order ambiguity. The core issue is that "choose at random" lacks a unique definition in continuous spaces, and averaging over procedures is **not a general solution**. It *sometimes* works when procedures are **symmetric representations of the same underlying measure**, and fails when they represent **genuinely distinct measures**. Below, I'll clarify the distinction, provide terminology, and offer a practical decision framework.

  ---

  ### **The Established Concepts**
  1. **The Averaging Failure**: This is called **meta-ambiguity** or **procedure-space arbitrariness**. It arises when you average over incompatible probability measures, making the result dependent on ad hoc choices (which procedures to include, how to weight them).
     
  2. **When Averaging Works vs. Fails**:  
     - **Defensible Averaging**: Procedures are **equivalent descriptions** of the **same probability measure** under a natural symmetry group (e.g., rotational/translational invariance).  
     - **Indefensible Averaging**: Procedures represent **inequivalent probability measures** due to conflicting "indifference" assumptions. Averaging here is arbitrary.

  ---

  ### **Key Distinction: Symmetry vs. Genuine Disagreement**
  The difference lies in whether the procedures are **symmetry transformations** of one another or **distinct generative processes**:
  - **Favorable Case (Symmetry-Equivalent Procedures)**  
    Example: *"Pick two random points on a circle's circumference"* vs. *"Rotate the circle by a random angle and pick two fixed points"*.  
    - **Why averaging works**: Both procedures are invariant under the circle's rotation group. They yield identical probability measures. Averaging is redundant but harmless (you get the same answer).  
    - **Terminology**: The unique measure is the **Haar measure** under the symmetry group (here, rotations). No ambiguity exists.

  - **Unfavorable Case (Inequivalent Procedures)**  
    Example: *"Break a stick at two uniform points"* vs. *"Break once uniformly, then break the longer piece uniformly"*.  
    - **Why averaging fails**: These embed different physical indifference (e.g., "uniform in position" vs. "uniform in fragment size"). They produce distinct measures (e.g., different distributions for the longest piece).  
    - **Terminology**: This is a **lack of measure uniqueness** under the problem's constraints. Averaging over procedures mixes measures arbitrarily.

  ---

  ### **Why This Solves Your Chord Example**
  For a random chord in a circle:  
  - **Symmetry-equivalent procedures**:  
    - Picking two uniform points on the circumference.  
    - Picking a random direction and uniform distance along a fixed diameter.  
    Both are rotationally invariant and give the same probability (e.g., 1/3 for chord > triangle side).  
  - **Inequivalent procedure**:  
    - Picking a midpoint uniformly inside the circle.  
    This breaks rotational symmetry (e.g., favors chords near the center). It gives a different probability (1/4).  
  Averaging the first two is defensible (they agree), but including the third is not—it introduces a genuinely different measure.

  ---

  ### **Practical Framework: When to Average and When to Reject**
  Use this flowchart for your puzzles:

  1. **Identify Natural Symmetries**  
     Ask: *What transformations (e.g., rotation, translation, scaling) should leave the probability unchanged?*  
     - Circle: Rotational symmetry.  
     - Stick: Translational symmetry (if endpoints are indistinct).  
     - Sphere: Rotational symmetry.  
     *Ignore irrelevant symmetries (e.g., scaling for "length" questions).*

  2. **Check Procedure Invariance**  
     For each proposed procedure:  
     - Does it produce the same measure under all symmetry transformations?  
     - If yes, it respects the symmetry; if not, it doesn't.  
     Example for a stick:  
     - *Break at two uniform points*: Translationally invariant.  
     - *Break once uniformly, then break the longer piece*: Not invariant (depends on absolute position).  

  3. **Decide Defensibility**  
     - If **all procedures are symmetry-equivalent**, use any one (no averaging needed).  
     - If **procedures disagree due to broken symmetry**, reject averaging. The problem is underspecified—state the ambiguity explicitly.  
     - If **symmetry implies a unique measure**, use it (e.g., Haar measure for compact groups like rotation).  

  4. **Avoid These Traps**  
     - Never average across symmetry-inequivalent procedures.  
     - Never list a procedure multiple times (e.g., "pick two points" described two ways).  
     - Never include procedures that introduce new symmetries (e.g., scaling for a length-based question).

  ---

  ### **House Style Guide Definition**
  > **"Choose at random" in continuous spaces**:  
  > Specify the generative procedure explicitly. If ambiguity arises:  
  > - **Acceptable**: Procedures invariant under the problem's natural symmetries (e.g., rotational symmetry for circles). These yield unique probabilities.  
  > - **Unacceptable**: Procedures violating symmetries or averaging across incompatible methods.  
  >   
  > *Example rationale*: For a random chord, "pick two circumference points uniformly" is valid (rotationally invariant). "Pick a midpoint uniformly" is invalid (breaks rotational symmetry). Do not average these.  
  >   
  > *When symmetries are insufficient* (e.g., stick-breaking with size dependencies), state the ambiguity: *"Probabilities depend on the breaking model; we assume X."*

  ---

  ### **Why This Works for Your Cases**
  - **Chord problem**: Natural symmetry = rotation. Only circumference-based methods are valid. Midpoint method is excluded.  
  - **Stick-breaking**: Natural symmetry = translation (if endpoints are identical). "Two uniform points" is valid; "break the longer piece" is not (it distinguishes absolute positions). No averaging.  
  - **Sphere points**: Natural symmetry = rotation. "Uniformly random directions" works; "uniform in Cartesian coordinates" does not (favors directions near axes).  

  This approach eliminates meta-ambiguity by anchoring to invariance. You’ll recognize favorable cases quickly—they’re the ones where all "reasonable" procedures agree *without averaging*. If they disagree, symmetries are broken, and averaging is a bandage, not a cure. 

  For your co-editor: Frame it as *"Which symmetries should the answer respect?"* rather than probability theory. It’s intuitive and avoids mathematical jargon.
