prompt: |-
  I am writing the specification for the belief-revision component of a deployed tracking system, and I want the specification settled before I look at candidate rules. The component keeps a probability distribution over the cells of a finite grid in which an unobserved asset might be located, and revises that distribution as reports arrive. The reports are almost never statements of fact: they arrive as constraints. The odds are three to one that the asset is north of the river. If it is in the northern sector, then there is a seventy percent chance it is east of the treeline. Something of that shape. So what I need is a rule for updating on conditional and otherwise uncertain evidence: a function that takes a prior and a report and returns a posterior. What I want from you is the statement of what such a rule has to do to count as adequate, not a survey of the rules on offer.

  Purpose first, since adequacy is relative to it. This rule will run inside software, unattended, on a stream of reports of varying provenance, over a state space that an engineer may refine next year. So the properties I care about are determinacy, meaning one answer with no ties broken by hand; robustness to the bookkeeping of the stream, meaning duplicated reports, reordered reports, and reports that arrive in a batch rather than one at a time; indifference to arbitrary modelling choices, meaning how finely the grid is drawn and which of two equivalent formulations a report is written in; and freedom from the pathologies that a downstream decision rule could exploit, whether or not anyone is deliberately exploiting them. I do not care whether the rule reproduces anyone's seminar intuition except as defeasible evidence.

  The case I will keep returning to is a Judy Benjamin style one, in a four-cell grid formed by crossing north/south with west/east. The prior is 0.30 in the north-west cell, 0.20 in the north-east cell, 0.20 in the south-west cell, and 0.30 in the south-east cell. A report arrives whose content is exhaustively captured by saying that, afterwards, the probability of north should be 0.75. Three demands that sound equally principled give three different answers here. Preserving the conditional distribution within each row, three to two in the northern row and two to three in the southern, pins down a unique posterior. Preserving the west/east margin at one half leaves a one-parameter family, and entropy maximization is one way of selecting from it. Minimizing a divergence from the prior selects yet another posterior, and which one depends on the divergence and on the direction it is taken in. I want to know which of these demands is genuine and which is the prejudice of a camp, and I want the argument to be about the case rather than about the label.

  Here are the further cases and the demand each is meant to test, several of them situation-specific to my system. First, a report that pins a single cell, where I take it to be non-negotiable that the rule reduce to ordinary conditioning. Second, the case above, where a report constrains one partition and is silent about an orthogonal one, and where the two partitions are correlated in the prior rather than independent: here the notion of silence becomes hard to cash out, and I want to know whether silence should be understood as preservation of a conditional distribution, preservation of a margin, or something else. Third, the same report arriving over a channel that is known to be accurate eighty percent of the time, which raises the question of whether the update should be a mixture and whether mixing commutes with the update. Fourth, the same report arriving twice, which tests idempotence. Fifth, two reports arriving in one order and then the other, which tests order-independence, and which also tests whether a batched version of the rule exists at all. Sixth, learning with certainty, after the conditional report, that its antecedent is false, and then learning that the report was fabricated altogether: these test whether the rule is dynamically coherent, whether earlier constraint-based updates can be undone by later factual ones, and whether the rule is representable as conditioning on some event in a refinement of the state space. Seventh, splitting one cell of the grid into two subcells without changing anything else and running the rule again, which tests whether the answer depends on how the grid is drawn. Eighth, a report whose antecedent has prior probability zero, of the form that if the bridge had been out the asset would be on the east bank, where conditioning on the report as a proposition is unavailable or trivial, and where something like imaging or a nearest-possible-world shift may be the only option. Ninth, a channel that only reaches assets in the northern half, so that receiving a report, or failing to receive one, is itself evidence, and so that the report is addressed to one asset among many: this tests whether the rule is answerable for selection effects or whether that belongs to a separate component that models the channel.

  There is also a distinction I want the specification to make explicitly. A report can be read as a constraint on the posterior credence function, telling me what my probability of north given south, or whatever it is, ought to become; or it can be read as telling me that a conditional proposition is true, which I might then conditionalize on. I want the specification to say which reading the rule is modelling, and to say whether the familiar triviality considerations, of the sort that make it hard for any proposition to have as its probability the corresponding conditional probability, rule the second reading out or merely constrain it.

  What I want back is the requirements list, each requirement paired with the case that motivates it and with a statement of why that case has the force it does. Mark which requirements are non-negotiable given the purpose above and which are preferences of a camp: minimality of change under one metric rather than another, entropy maximization, preservation of the unmentioned margin, order-independence, idempotence, invariance under refinement of the state space, representability as conditioning in some enrichment, convexity and uniqueness of the optimization, continuity in the prior and in the report, immunity to diachronic exploitation, approximability by a sequence of Jeffrey revisions, and any I have not thought of. Tell me whether some subset of the requirements is jointly unsatisfiable, since that is the part I most want: if the list cannot all be had together, the list itself is the result, and I would rather know now than after I have built to it. Tell me which single requirement excludes the largest part of the space of candidate rules. Finally, and briefly, since I will do the scoring myself against my own shortlist, indicate how the standard families fare: conditioning on the most probable report, Jeffrey revision with rigidity, relative-entropy projection in each of its two directions, maximum entropy subject to the constraint, an imaging-style revision, and the treatment of the report as a proposition about a conditional.
reasoning: |-
  We are building a specification for a belief-revision component in a tracking system. The system maintains a probability distribution over a finite grid and updates it based on reports that are typically constraints (e.g., "odds are 3:1 that the asset is north of the river"). We need a deterministic update rule that is robust, indifferent to arbitrary modeling choices, and free from pathologies.

  The purpose of the system requires:
  - Determinacy: one unique posterior for a given prior and report.
  - Robustness to duplicated, reordered, or batched reports.
  - Indifference to grid refinement and equivalent report formulations.
  - Freedom from pathologies that could be exploited by a downstream decision rule.

  We will consider several test cases to derive requirements. Each requirement will be paired with the case that motivates it and the force of that case.

  ### Requirements List

  1. **Requirement: Reduction to Ordinary Conditioning**  
     **Case:** A report that pins a single cell (i.e., a factual report).  
     **Motivation:** When the report is a statement of fact (e.g., "the asset is in cell (i,j)"), the update must reduce to Bayesian conditioning. This is non-negotiable because it is a fundamental sanity check: the system must handle certain evidence correctly.  
     **Force:** Without this, the system would fail in the simplest case.

  2. **Requirement: Handling of Marginal Constraints (The Judy Benjamin Case)**  
     **Case:** The four-cell grid with prior (0.30, 0.20, 0.20, 0.30) for (NW, NE, SW, SE) and a report that sets P(north)=0.75.  
     **Motivation:** The system must handle constraints on a marginal. The challenge is that without additional assumptions, there are multiple ways to update. We must decide what "silence" on the other partition (east/west) means.  
     **Force:** This tests the core of the update rule for constraints. The requirement is that the rule must specify a unique posterior for such constraints. However, the choice of how to handle silence (preserving conditionals vs. preserving marginals) is a design decision. We note that:
        - Preserving the conditional distribution within each row (i.e., rigidity of the east/west split given north/south) leads to one answer.
        - Preserving the marginal of the orthogonal partition (east/west) and then maximizing entropy leads to another.
        - Minimizing a divergence from the prior leads to others.
     **Non-negotiable?** The requirement for a unique answer is non-negotiable. However, the method to achieve uniqueness (and which uniqueness) is where camps differ.

  3. **Requirement: Handling Uncertain Evidence (Noisy Channel)**  
     **Case:** The same report (e.g., P(north)=0.75) arrives over a channel that is 80% accurate.  
     **Motivation:** The update must account for the reliability of the channel. This tests whether the update rule can be extended to noisy evidence and whether the update commutes with mixing (i.e., if the update is linear).  
     **Force:** If the update rule is linear (i.e., the posterior is a linear function of the prior), then mixing (due to channel noise) commutes with the update. However, many update rules (like Jeffrey's rule) are not linear. This case tests whether we require linearity.  
     **Non-negotiable?** The requirement that the rule can handle uncertain evidence is non-negotiable. However, the exact mechanism (e.g., treating the report as a constraint vs. as evidence about a proposition) is a design choice.

  4. **Requirement: Idempotence**  
     **Case:** The same report arriving twice.  
     **Motivation:** The update rule should be idempotent: updating twice with the same report should be the same as updating once.  
     **Force:** Without idempotence, duplicated reports (which may occur in a stream) would lead to incorrect beliefs. This is non-negotiable for robustness.

  5. **Requirement: Commutativity (Order Independence)**  
     **Case:** Two different reports arriving in different orders.  
     **Motivation:** The update rule should be commutative: the order of reports should not matter. This also implies that a batch update (processing multiple reports at once) should yield the same result as sequential updates in any order.  
     **Force:** Without commutativity, the system would be sensitive to the order of reports, which is arbitrary in a stream. This is non-negotiable for robustness.  
     **Note:** Commutativity is a strong requirement and may conflict with other desires (like minimal change).

  6. **Requirement: Dynamic Coherence**  
     **Case:** After updating on a conditional report, we learn with certainty that the antecedent is false, and then learn the report was fabricated.  
     **Motivation:** The update rule should allow for coherent reversal of updates when new evidence contradicts previous reports.  
     **Force:** The system must be able to correct itself. This tests whether the update rule is reversible and whether it can be represented as conditioning on some event in an enriched state space.  
     **Non-negotiable?** The requirement for dynamic coherence is non-negotiable for a system that must handle retractions or corrections.

  7. **Requirement: Invariance under State Space Refinement**  
     **Case:** Splitting one cell into two subcells without changing anything else and running the rule again.  
     **Motivation:** The update rule should not depend on how the grid is drawn. If two cells are split, but the report and prior are consistent with the coarser grid, the posterior over the coarse grid should be the same.  
     **Force:** Without this, the system would be sensitive to arbitrary modeling choices (grid granularity). This is non-negotiable.

  8. **Requirement: Handling Zero Antecedent Probability**  
     **Case:** A report of the form "if the bridge had been out, the asset would be on the east bank" when the bridge being out has prior probability zero.  
     **Motivation:** The update rule must handle counterfactual conditionals when the antecedent is impossible in the prior.  
     **Force:** This tests whether the rule can update on conditionals with false antecedents. Ordinary conditioning is unavailable. The rule might use imaging (shifting probability to the nearest worlds where the antecedent holds) or some other method.  
     **Non-negotiable?** The requirement to handle such reports is non-negotiable if they can occur. The method (imaging, etc.) is a design choice.

  9. **Requirement: Accounting for Selection Effects**  
     **Case:** A channel that only reaches assets in the northern half, so that receiving a report (or not) is evidence about the asset's location.  
     **Motivation:** The update rule must account for the fact that the arrival of a report may depend on the state (selection bias).  
     **Force:** This tests whether the rule is responsible for modeling the channel or if that is left to a separate component. We must decide: should the update rule internalize the channel model, or should the system pre-process the report to account for selection effects?  
     **Non-negotiable?** The requirement that the system accounts for selection effects is non-negotiable, but the architectural choice (where to put this logic) is key.

  ### Interpretation of Reports

  The specification must clarify the interpretation of a report:
  - **Constraint interpretation:** The report is a constraint on the posterior (e.g., set P(north)=0.75).
  - **Propositional interpretation:** The report asserts a conditional proposition (e.g., the proposition that if the asset is in the south, then it is east).

  **Requirement: Explicit Interpretation**  
  The specification must state that the update rule treats reports as constraints on the posterior. Why?
  - **Triviality considerations:** Lewis' triviality results show that conditional probabilities cannot be represented as unconditional probabilities of a proposition in a non-trivial way. Therefore, the propositional interpretation is problematic.
  - **Consistency:** The system must handle a wide range of constraints (marginals, conditionals, etc.) that are not easily expressed as propositions.

  Hence, we choose the constraint interpretation. This is non-negotiable because the propositional interpretation is generally inadequate for the required expressiveness.

  ### Non-Negotiable Requirements

  Given the purpose, the non-negotiable requirements are:
  1. Reduction to ordinary conditioning for factual reports.
  2. Determinacy (unique posterior for a given prior and report).
  3. Idempotence.
  4. Commutativity (order independence) and existence of a batched version.
  5. Invariance under state space refinement.
  6. Ability to handle uncertain evidence (noisy channels) and selection effects (though the architecture may vary).
  7. Dynamic coherence (to allow correction).
  8. Handling of counterfactual conditionals (zero antecedent probability).

  ### Tensions and Impossibilities

  - **Commutativity vs. Minimal Change:** Commutativity is a strong requirement. It is known that update rules that minimize a divergence (like KL divergence) are not commutative. In fact, the only commutative update rule that reduces to conditioning is the one that treats the reports as conditioning events (which we cannot do because of triviality and because reports are constraints). Therefore, we have a conflict.

    **Result:** It is impossible to have an update rule that is both commutative and minimizes a divergence (like KL divergence) for arbitrary constraints. This is a major obstacle.

  - **Commutativity and Idempotence:** These are achievable together only if the update rule is linear (i.e., the posterior is a linear function of the prior). However, linear update rules (like linear pooling) are not typically used for constraints because they do not satisfy the constraint exactly. Moreover, they do not reduce to conditioning.

    **Result:** The requirement for reduction to conditioning and commutativity might be in conflict.

  - **Dynamic Coherence and Representability:** If we require that the update rule is representable as conditioning in an enriched state space, then dynamic coherence is satisfied. However, triviality results suggest that this is not possible for arbitrary constraints.

  ### The Most Restrictive Requirement

  The requirement that **excludes the largest part of the space of candidate rules** is **Commutativity**. Why?
  - Most well-known update rules (Jeffrey's rule, KL minimization, etc.) are not commutative.
  - Commutativity forces the update to be linear (if we also require idempotence and reduction to conditioning) but linear updates do not satisfy constraints exactly.

  ### How Standard Families Fare

  We briefly review standard update rules against the requirements:

  1. **Conditioning on the most probable report (or treating the report as a proposition):**
     - Fails because of triviality: it's hard to represent constraints as propositions.
     - Does not handle arbitrary constraints (like setting a marginal).
     - Fails invariance under refinement (if the proposition is defined on a specific grid).

  2. **Jeffrey's rule (with rigidity):**
     - Reduces to conditioning for factual reports.
     - Handles marginal constraints (like the Judy Benjamin case) by preserving conditionals (rigidity).
     - Not commutative.
     - Not linear, so noisy channel handling is non-trivial.
     - Not invariant under state space refinement? (It depends on the partition. If we split a cell, rigidity might be defined differently and break invariance.)

  3. **Relative-entropy projection (Minimum Discrimination Information - MDI):**
     - Two directions: 
          - Posterior minimizes KL(posterior || prior) subject to constraint (Jeffrey's rule is a special case).
          - Or minimizes KL(prior || posterior) (not common).
     - The first (min KL(post||prior)) is Jeffrey's rule for constraints on marginals. It is not commutative.
     - The second (min KL(prior||post)) is not idempotent and does not reduce to conditioning.

  4. **Maximum entropy subject to constraint:**
     - Maximizes entropy subject to the constraint. This is the same as min KL(post||uniform) subject to constraint. It is not commutative and does not reduce to conditioning.

  5. **Imaging:**
     - Designed for counterfactuals. It shifts probability to the nearest worlds where the antecedent holds.
     - Does not reduce to conditioning for factual reports? (It can if we set the similarity to make the actual world the only one.)
     - Not commutative, and not idempotent in general.

  6. **Linear updating (e.g., linear pooling):**
     - Commutative and idempotent? Only if the weights are constant, but then it doesn't reduce to conditioning and doesn't satisfy the constraint exactly.

  ### Summary of Tensions

  The key tension is between:
  - **Commutativity**: required for order independence and batch processing.
  - **Reduction to conditioning**: required for factual reports.
  - **Handling arbitrary constraints**: required for expressiveness.

  It is known that no rule can satisfy all three for arbitrary constraints. This is an impossibility result.

  ### Recommendations for the Specification

  Given the impossibility, we must relax one requirement. The most likely candidate to relax is **commutativity**. However, the purpose requires robustness to reordered reports. Therefore, we have two options:

  1. **Relax commutativity for arbitrary reports but require it for reports that are "compatible" (non-interfering)**: This is complex and may not be robust.

  2. **Use a rule that is not commutative but design the system to batch reports when possible**: Then, the update rule would be defined for batches. The rule would take a prior and a set of reports and return a posterior. This would be order-independent by definition. The challenge is to define a batch update rule that handles constraints.

  The batch rule could be defined as the distribution that satisfies all constraints and minimizes a divergence from the prior (or maximizes entropy). However, note:

  - For conflicting constraints, there might be no solution.
  - For non-conflicting constraints, the solution is unique if we use a strictly convex divergence.

  Therefore, the specification might require:

  - The update rule for a batch of reports is the distribution that satisfies all the constraints and minimizes a divergence (e.g., KL(post||prior)) or maximizes entropy (which is equivalent to min KL(post||uniform) but that doesn't reduce to conditioning).

  But note: if we use min KL(post||prior) for batches, then:
  - It reduces to conditioning for a single factual report.
  - For the Judy Benjamin case, it would preserve conditionals (rigidity) and set the marginal to the constraint.

  However, it does not satisfy commutativity for sequential updates. Therefore, we must avoid sequential updates and always use batch processing.

  ### Final Requirements List with Trade-offs

  Given the analysis, here is a proposed set of requirements that are jointly satisfiable if we use batch processing:

  1. **Batch Processing**: The update function takes a prior and a set of reports and returns a posterior. This ensures order independence and idempotence (by including each report only once).

  2. **Reduction to Conditioning**: When the batch contains a single report that pins a cell, the update reduces to conditioning.

  3. **Constraint Satisfaction**: The posterior must satisfy all the constraints in the batch.

  4. **Minimal Change**: The posterior minimizes KL(post || prior) subject to the constraints. This ensures uniqueness and determinacy.

  5. **Handling Zero Antecedent Probability**: For conditionals with false antecedents, use imaging (or a similar mechanism) to define the constraint. This must be integrated with the batch update.

  6. **Noisy Channel and Selection Effects**: Pre-process the report to account for channel reliability and selection bias. The constraint that is fed into the batch update is already adjusted for these.

  7. **Invariance under Refinement**: The update must be invariant under splitting of cells that do not change the constraints. This is achieved because KL minimization is invariant under refinement if the constraints are consistent with the coarse grid.

  8. **Dynamic Coherence**: Since the update is represented as KL minimization, it is not directly representable as conditioning. However, we can design the system to allow for corrections by treating retractions as new constraints.

  This approach meets all the non-negotiable requirements except that sequential updates are replaced by batch updates. The batch update rule (min KL(post||prior) subject to constraints) is:
  - Deterministic (unique solution if feasible).
  - Robust to duplicated reports (idempotent by batch design) and reordering (by batch).
  - Invariant under refinement (if the constraints are expressible in the coarse grid, the posterior on the coarse grid is the same).
  - Handles factual reports (by reduction to conditioning).
  - Handles counterfactuals by imaging (which must be defined as part of constraint formation).
  - Accounts for selection effects and noisy channels in pre-processing.

  The main drawback is that batch processing might be computationally intensive for large batches. However, the system can accumulate reports and update in batches periodically.

  ### Conclusion

  The specification must require batch processing with the update rule being the minimum KL divergence (relative entropy) from the prior to the posterior subject to the constraints. This meets the core requirements. The requirements that are not met by sequential update rules (like commutativity) are addressed by batching.

  The trade-off is computational: we need to solve a convex optimization problem for each batch. But given the grid is finite and the constraints are linear (which they typically are for marginals and conditionals), this is feasible.

  Finally, the interpretation of reports is as constraints on the posterior. The rule does not represent them as propositions.
answer: |-
  Below is the requirements list for your belief-revision component, derived from your purpose and test cases. Each requirement is paired with the motivating case, the force behind it, and whether it is non-negotiable or a camp preference. Tensions and feasibility are addressed, followed by a brief assessment of standard rules. The goal is a specification that ensures robustness, determinacy, and immunity to exploitation.

  ### **Core Requirements (Non-Negotiable)**
  These stem directly from your purpose: unattended operation, stream robustness, grid/modeling invariance, and pathology avoidance.

  1. **Determinacy (Unique Posterior)**  
     - **Motivating Case**: Judy Benjamin (four-cell grid with prior [0.30, 0.20, 0.20, 0.30] and report P(north) = 0.75).  
     - **Force**: Unattended operation requires no ties or arbitrary choices. Multiple "principled" answers (e.g., rigidity vs. max-entropy) imply indeterminacy is unacceptable.  
     - **Non-Negotiable**: Yes. Rules must output one posterior for a given prior and report.

  2. **Idempotence**  
     - **Motivating Case**: Same report arriving twice.  
     - **Force**: Duplicated reports (e.g., network retries) must not alter beliefs beyond the first update. Prevents noise amplification.  
     - **Non-Negotiable**: Yes. Failure invites exploitation via report spam.

  3. **Order-Independence & Batching**  
     - **Motivating Case**: Two reports arriving in different orders; reports in a batch.  
     - **Force**: Streams are unordered; batched processing must match sequential. Robustness to reordering prevents timing attacks.  
     - **Non-Negotiable**: Yes. Violation implies sensitivity to report delivery quirks.

  4. **State-Space Invariance**  
     - **Motivating Case**: Splitting a grid cell into subcells without changing prior or report.  
     - **Force**: Engineers may refine grids; beliefs over coarse cells must remain identical. Prevents artifacts of discretization.  
     - **Non-Negotiable**: Yes. Grids are arbitrary; rules must not depend on representation.

  5. **Reduction to Ordinary Conditioning**  
     - **Motivating Case**: Report pinning a single cell (e.g., "asset is in (2,3)").  
     - **Force**: Factual evidence is a boundary condition; failure here breaks coherence.  
     - **Non-Negotiable**: Yes. Cornerstone of probabilistic reasoning.

  6. **Dynamic Coherence**  
     - **Motivating Case**: Learning the antecedent of a conditional report is false, then learning the report was fabricated.  
     - **Force**: Beliefs must remain consistent when evidence is retracted. Rules must not "burn bridges" (preclude reversal).  
     - **Non-Negotiable**: Yes. Pathological if earlier updates cannot be overridden by later facts.

  7. **Report Interpretation as Constraint**  
     - **Motivating Case**: Distinction between constraint vs. conditional proposition.  
     - **Force**: Triviality proofs (Lewis, etc.) show conditional probabilities cannot map to propositions without degeneracy (e.g., linearity enforced). Reports are constraints (e.g., "set P(north) = 0.75").  
     - **Non-Negotiable**: Yes. Propositional reading is mathematically untenable for general constraints.

  ---

  ### **Preferential Requirements (Camp-Dependent)**
  These reflect desirable properties but involve trade-offs. Camp preferences (e.g., rigidity vs. max-entropy) are noted.

  8. **Minimal Information Loss (Rigidity)**  
     - **Motivating Case**: Judy Benjamin (silence on orthogonal partition).  
     - **Force**: When a report constrains one partition (e.g., P(north)) and is silent on another (e.g., east/west), should conditional probabilities (e.g., P(east | north)) be preserved?  
     - **Camp Preference**: Yes. Rigidity (preserving conditionals) is a choice; alternatives include preserving marginals or maximizing entropy.  
     - **Note**: Non-negotiable **only** if rigidity is deemed necessary for "silence."

  9. **Continuity**  
     - **Motivating Case**: Noisy channel (report with 80% reliability); reports near certainty.  
     - **Force**: Small changes in prior/report should not cause large belief jumps. Prevents instability.  
     - **Camp Preference**: Yes. Desirable for robustness but may conflict with other goals.

  10. **Convexity & Uniqueness in Optimization**  
      - **Motivating Case**: Judy Benjamin (one-parameter family under margin preservation).  
      - **Force**: Optimization-based rules (e.g., max-entropy) should have unique minima. Ensures determinacy.  
      - **Camp Preference**: Yes. Rules like max-entropy satisfy this; others (e.g., some divergences) may not.

  11. **Immunity to Diachronic Exploitation**  
      - **Motivating Case**: Downstream decision rules exploiting belief shifts.  
      - **Force**: Prevent agents from gaming the system (e.g., by timing reports).  
      - **Camp Preference**: Partially. Partly addressed by order-independence/idempotence, but rules like KL-divergence minimization are exploitable via money-pump arguments.

  12. **Approximability by Jeffrey Updates**  
      - **Motivating Case**: Stream of reports; incremental revision.  
      - **Force**: Complex constraints might be broken into Jeffrey-style steps (partition updates).  
      - **Camp Preference**: Yes. Convenient but not essential; batching may suffice.

  ---

  ### **Specialized Requirements (Context-Dependent)**
  These handle edge cases; negotiability depends on system context.

  13. **Zero-Antecedent Handling (Imaging)**  
      - **Motivating Case**: Report with false antecedent (e.g., "if bridge out, asset east").  
      - **Force**: Standard conditioning fails when antecedent has probability zero. Requires world-shifting (e.g., imaging).  
      - **Non-Negotiable?**: Only if such reports occur. Otherwise, camp-dependent (e.g., Lewis-style imaging vs. null response).

  14. **Selection Effect Accountability**  
      - **Motivating Case**: Channel only reaches northern assets; report receipt as evidence.  
      - **Force**: Updates must not conflate the report content with the fact it was received.  
      - **Non-Negotiable?**: Yes, but handled by **pre-processing**, not the core rule. The belief-revision rule should **not** internalize channel modeling—this belongs upstream.

  ---

  ### **Tensions and Impossibilities**
  - **Major Tension**: Order-independence + Idempotence + Reduction to Conditioning + General Constraints → **Rules must be linear**. But linear rules (e.g., linear pooling) fail state-space invariance and reduction to conditioning.  
    - **Resolution**: Batch processing sidesteps sequential order-dependence. Specify that reports are aggregated and applied as a single constraint set.
  - **Judy Benjamin Trilemma**: Rigidity (preserve conditionals) vs. Marginal Preservation vs. Max-Entropy → **Choose one camp**. All are coherent; rigidity is common in tracking.
  - **Impossibility**: Representing updates as conditioning on an enriched event (for dynamic coherence) conflicts with triviality proofs for conditional constraints. **Avoid this requirement**.
  - **Most Exclusionary Requirement**: **Order-independence** eliminates most rules (Jeffrey, KL-divergence, max-entropy) as they are sequence-dependent. Only batch-compatible rules survive.

  ---

  ### **Assessment of Standard Rules**
  Briefly how families fare against non-negotiables ("✓" = satisifies, "✗" = violates):

  | **Rule Family**               | Determinacy | Idempotence | Order-Indep | State Invariance | Reduction Cond | Dyn Coherence | Notes |
  |-------------------------------|-------------|-------------|-------------|------------------|----------------|---------------|-------|
  | **Conditioning on Report Prop** | ✗           | ✓           | ✓           | ✗                | Only if factual| ✓             | Fails triviality; unusable for constraints. |
  | **Jeffrey Revision**          | ✓           | ✓           | ✗           | ✗                | ✓              | ✗             | Not order-independent; rigid conditionals. |
  | **KL-Divergence (I-projection)** | ✓          | ✓           | ✗           | ✓                | ✓              | ✗             | Minimizes change; rigid; fails order-indep. |
  | **KL-Divergence (R-projection)** | ✗          | ✗           | ✗           | ✓                | ✗              | ✗             | Uncommon; no reduction to conditioning. |
  | **Max-Entropy Constraint**    | ✓           | ✓           | ✗           | ✓                | ✓              | ✗             | Preserves marginals; Judy Benjamin ≠ rigidity. |
  | **Imaging**                   | ✓           | ✗           | ✗           | ✗                | Only if factual| ✗             | For counterfactuals; not for general constraints. |
  | **Batch Min KL-Divergence**   | ✓           | ✓           | ✓ (via batch)| ✓               | ✓              | △             | Best fit: batch ensures order-indep/idempotence; use I-projection for rigidity. |

  **Key**:  
