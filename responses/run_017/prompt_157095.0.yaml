  ### Key to Named Views  
  Each view is defined by its "least comfortable commitment" (one sentence).  

  1. **Realism about sharply bounded cohorts**: Must accept that arbitrary birth-year cutoffs (e.g., 1964 vs. 1965) create non-trivial differences in people.  
  2. **Continuous-cohort gradualism**: Must accept that "generation" is merely a coarse bin for smooth, continuous trends—like using broad age groups for height data.  
  3. **Exposure-profile pluralism**: Must accept that one person belongs to multiple overlapping "cohorts" (e.g., a "war cohort" and a "tech cohort") with no single "true" generation.  
  4. **Generations as unique historical particulars**: Must accept that a generation (e.g., "the WWII cohort") cannot recur or be compared across eras—it dies with its defining event.  
  5. **Looping social-kind constructivism**: Must accept that a generation exists only once labeled and internalized (no label = no real cohort, even with shared exposures).  
  6. **Skeptical discursive view**: Must accept that cohort labels are journalistic/marketing tools with no "real" kind behind them, even when people believe in them.  
  7. **Eliminativism about the term**: Must advocate abandoning "generation" entirely in scholarship, as it is ontologically empty or misleading.  
  8. **Deflationary instrumentalism**: Must use "generation" as a pragmatic bin for analysis while denying it refers to a real entity.  
  9. **Purpose-relative pluralism**: Must accept that incompatible cohort slicings (e.g., by schooling vs. war) are equally valid, depending on the research question.  

  **Note**: *Generations as repeatable types* (e.g., cyclical archetypes) is **not captured** by this tree. It falls outside the logical space probed by these questions (diagnosis: the cases do not force a choice about historical cyclicity).  

