  ### Design Notes  
  1. **Unseparated views**: The tree **cannot distinguish** between the *continuous-cohort gradualist*, *eliminativist*, and *deflationary instrumentalist* on case responses alone. All three answer identically to all questions (Q1=B, Q9=A, Q4=A, Q5=A, Q7=C). They differ only in their **prescriptive stance** on using the *term* "generation" (abandon vs. retain as tool).  
  2. **Omitted view**: *Generations as repeatable types* is excluded from the tree because no case forces a stance on historical cyclicity (e.g., "Are today’s youth a recurring ‘hero’ archetype?"). It remains unclassified.  
  3. **Pressure points**:  
     - **Boundary lottery** (Q1) splits realists from others.  
     - **Diagonal problem** (Q2, Q3, Q7) sorts exposure pluralists from birth-year purists.  
     - **Narrative dependency** (Q4, Q5, Q6) isolates constructivists and skeptics.  

  This instrument forces students to confront cases that challenge their assumptions, then reveals their position’s logical commitments. Use it to pre-empt circular debates by showing how answers cluster—and where "talking past" occurs.
