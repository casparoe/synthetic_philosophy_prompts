  ### Appendix: Empty Combinations  
  These logically possible answer combinations are unoccupied by any named view. Diagnoses: **I** = incoherent, **U** = unattractive, **Udef** = undefended.  

  | Combination | Answers | Diagnosis |  
  |-------------|---------|-----------|  
  | Cutoff-bound realist who denies migrant assimilation | Q1=A, Q2=B | **Udef**: No one defends sharp birth-year boundaries while insisting exposures override them (incoherent for realists). |  
  | Discontinuity denier who holds cohorts collectively responsible | Q1=B, Q10=A | **U**: Unattractive—collective responsibility requires clear boundaries, which Q1=B rejects. |  
  | Late-named objectivist who rejects unconscious cohorts | Q5=A, Q4=B | **I**: Incoherent—if labels aren’t needed for existence (Q5=A), then unconscious cohorts (Q4=B) must be possible. |  
  | Gradualist who insists on cross-national label accuracy | Q9=B/C, Q4=A, Q2=A, Q7=B | **Udef**: Unattractive—if generations are continuous and birth-year-based (Q2=A), local exposures (Q7=B) cannot override them. |  

