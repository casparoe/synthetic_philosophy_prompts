     - A: Yes, there are non-trivial differences (e.g., in attitudes, experiences, or life outcomes) because of the cohort boundary.
     - B: No, they are essentially the same; the cohort boundary does not create a non-trivial difference.

  2. **Migrant case**: Sam is born in 1980 in Country X and moves to Country Y at age 24. Country Y has a distinct media and political history. Sam is now 40. Is Sam a member of the same generation as their birth-year peers in Country Y?
