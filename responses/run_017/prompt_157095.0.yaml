  Below is a diagnostic instrument designed to sort students into coherent positions on the existence and nature of generations, based on their responses to concrete cases. It consists of **10 forced-choice questions**, a **routing tree**, a **key to named views**, and an **appendix** on empty combinations. The tool avoids literature-specific labels and requires no prior knowledge. Questions are built from your cases and distinctions (cutoff/exposure/narrative cohorts, boundary lottery, diagonal problem), and the tree maps answers to your specified positions. 

  ### Diagnostic Questions
  Answer each question with **A**, **B**, or **C** based on your intuitive judgment. No outside knowledge is needed.

  1. **Boundary lottery pair**: Alex (born Dec. 1964) and Taylor (born Jan. 1965) share identical social contexts but fall on opposite sides of the "Baby Boomer/Gen X" cutoff. Do they differ non-trivially (e.g., attitudes, opportunities, culture) due to cohort membership?  
     - A: Yes, the cutoff creates meaningful differences.  
     - B: No, they are effectively identical; differences are coincidental or trivial.  

  2. **Migrant case**: Sam, born in 1980 in Country X, moves to Country Y at age 24. Country Y has distinct media, politics, and history. Is Sam part of the same generation as 1980-born peers in Country Y?  
     - A: Yes, birth year defines generations.  
     - B: No, formative exposures (like those in Country X) matter more.  
     - C: Only if Sam adopts Country Y’s generational label.  

  3. **Raised by grandparents**: Jamie, born in 2000, is raised from infancy by grandparents born in 1940. Jamie’s birth-year peers are "Gen Z." Which generation is Jamie in?  
     - A: Gen Z (birth year).  
     - B: The grandparents' generation (shared upbringing/exposures).  
     - C: Neither; generational labels don’t fit Jamie.  

  4. **Unconscious cohort**: People born 1955–1965 share objective conditions (e.g., high birth rates, economic boom) but no collective self-awareness or cultural distinctiveness. Is there a generation here?  
     - A: Yes, shared conditions suffice.  
     - B: No, self-consciousness is essential.  
     - C: Only for specific analytical purposes.  

  5. **Late-named cohort**: A group born 1946–1950 is labeled "The Silent Generation" only at age 55. Before that, no one used the label or self-identified with it. Did this generation exist before it was named?  
     - A: Yes, shared experiences made it real.  
     - B: No, the label created it.  
     - C: It existed as a latent potential.  

  6. **Boundary straddler**: Casey, born in 1980 (a boundary year for Millennial/Gen X), identifies as "Xennial." Does Casey belong to a single main generation?  
     - A: Yes, "Xennial" is just a subcategory.  
     - B: No, fuzzy boundaries make hybrid labels valid.  
     - C: Main generations are artificial; Casey can choose freely.  

  7. **Cross-national label**: In Japan, the cohort born 1985–1995 is called "Millennials" by Western media, but Japan has different school timings, internet diffusion, and its own label ("Yutori"). Is "Millennial" appropriate?  
     - A: Yes, birth years are universal.  
     - B: No, local exposures/contexts override global labels.  
     - C: It depends on the context (e.g., global vs. local analysis).  

  8. **No mass media**: A hypothetical society has no shared mass media (only local oral traditions). Could generations exist?  
     - A: Yes, via shared events (e.g., wars, famines).  
     - B: No, mass media is necessary for generational consciousness.  
     - C: Generations would exist but be hyper-local.  

  9. **Audit result**: A large cross-national study finds near-zero discontinuities in outcomes at conventional cutoffs (e.g., 1946, 1965) but strong continuous birth-year trends (e.g., rising digital literacy). Does this refute generations?  
     - A: Yes, discontinuities are essential to generations.  
     - B: No, generations are defined by exposures, not cutoffs.  
     - C: It shows generations are gradual, not categorical.  

  10. **Responsibility**: Can "Baby Boomers" be held collectively responsible for societal outcomes (e.g., climate change)?  
      - A: Yes, shared formative experiences create collective agency.  
      - B: No, responsibility is individual, not generational.  
      - C: Only symbolically, as a metaphor.  

