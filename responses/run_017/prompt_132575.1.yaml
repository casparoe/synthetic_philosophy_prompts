            The surprise is defined by the low forecast. Even if they deduced it must be on day1, they are required by the announcement to assign a low probability? So they do, and then the quiz happens and they are "surprised" by the definition of the game.

            But in reality, they are not surprised because they deduced it must be on day1. This is the flaw in the operationalization: we defined surprise as a low forecast, but in the paradox, surprise is about not expecting it at all. The operationalization might not capture the epistemic state.

          Therefore, we must discuss in the debrief that our operationalization of surprise as a low probability forecast is a proxy for the student's belief, but it does not capture the fact that the student might have deduced that the exam must be today and yet assigned a low probability to satisfy the teacher's announcement.

          This is a limitation.

   10. Revised plan:

          We will run:

            Round 1: 2-day, public (teacher chooses publicly) -> to show that when the day is known, no surprise is possible.

            Round 2: 2-day, private, without the announcement -> the class reports their true belief (probably around 0.5 on day1) and the teacher cannot surprise.

            Round 3: 2-day, private, with the announcement.

            Round 4: 5-day, private, with the announcement (if time).

          In Round 3 (2-day with announcement), we expect the class to assign a low probability on day1 (to allow the announcement to be true) and then the teacher chooses day1 and surprises them. This creates the paradox: the class knew it had to be day1 but still reported a low probability and were "surprised".

          The debrief will then discuss the difference between the operational definition (low forecast) and the intuitive notion of surprise.

   11. Rules for a round with announcement:

          The teacher announces: "I have chosen a day such that your forecast on that day will be below 20%."

          The class must make forecasts that are consistent with this announcement being true? Not exactly. The class is free to report any probability. But the teacher will only choose a day for which the forecast is below 20%. And the teacher must choose a day that makes the announcement true.

          However, the teacher's choice is made after the announcement but before seeing the class's forecast? Actually, the teacher chooses the day in advance (privately) and then makes the announcement. But then the class makes the forecast. The teacher must hope that on the chosen day the class's forecast is below 20%. But the class might not comply.

          We can have the teacher choose the day after seeing the class's forecasts? That would be cheating. The teacher must commit in advance.

          Alternatively, we can have the teacher choose after the class's forecast? But that would be different.

          Let's do it in this order:

            - The class is told the teacher will make the announcement and then they will report for day1.
            - The teacher, however, must choose the day in advance? But how? The teacher doesn't know the class's forecast.

          We can have the teacher choose the day after the class reports for the whole week? But we don't have the whole week at once.

          Alternatively, we can have the class report for all days in advance? But that is not sequential.

          Instead, we can do:

            - The teacher chooses the day in advance (privately, sealed) and then makes the announcement.
            - Then the class, on each day, reports a probability for that day.

          But then the class's report on the chosen day might be >=0.2, and then the announcement is false.

          The teacher must choose a day for which they believe the class's forecast will be below 20%. But the teacher doesn't know the class's forecast.

          This is the same as the original paradox: the teacher announces in advance, but then the class might make the announcement false by their forecasts.

          To avoid the announcement being false, we can say that the teacher is allowed to choose any day, and if the forecast on that day is not below 20%, then the teacher loses the surprise point and also the announcement was false. But the teacher still gives the quiz.

          In the debrief, we can discuss cases where the announcement is false.

          However, we want the announcement to be true to set up the paradox.

          How about we make the class try to make the announcement true? The class is told that the teacher's announcement is a fact. Therefore, they must ensure that there is at least one day on which they will forecast below 20%. But they also want to be accurate.

          This becomes very complex.

          Given the time constraints, we might stick to the original three rounds (without the announcement) and then in the debrief introduce the announcement and the backward induction.

          Alternatively, for Round 3 (2-day) with announcement, we can have the class discuss what to do knowing the announcement. We hope they will see the backward induction and then assign a low probability on day1. Then the teacher chooses day1 and surprises them.

          We'll try:

            - Teacher chooses a day in advance (privately, sealed) and then makes the announcement.
            - Class then, on day1, reports p1.
            - If the quiz is on day1 and p1<0.2, then surprise and the quiz happens.
            - If the quiz is on day1 and p1>=0.2, then the quiz happens but not a surprise (and the announcement is false).
            - If the quiz is on day2, then we move to day2. On day2, the class reports p2. If p2<0.2, then surprise; otherwise not.

          The teacher's goal is to achieve surprise (and make the announcement true).

          What might happen?

            The class might say: "We have to assign p1<0.2 on some day. Let's assign p1=0.19 on day1, then the teacher can choose day1 and it will be a surprise. If the teacher chooses day2, then on day2 we will have to assign 1, which is >=0.2, so the announcement would be false. But the teacher said it would be true, so we think the teacher will choose day1."

            Then they assign p1=0.19. The teacher, to make the announcement true, must choose day1. So the teacher chooses day1, and it is a surprise.

            This works.

          But what if the class assigns p1=0.5? Then the teacher cannot choose day1 (because 0.5>=0.2 -> not a surprise). And cannot choose day2 because on day2 they will assign 1. So the teacher has no valid choice? But the teacher has already chosen. If the teacher chose day1, then the announcement is false. If the teacher chose day2, then on day2 the class assigns 1 -> announcement false.

          Therefore, the teacher's announcement forces the class to assign a low probability on an early day, and then the teacher chooses that day.

          This captures the essence of the paradox.

   12. Revised rounds:

          Round 1: 2-day, public.
            - Teacher chooses publicly (e.g., writes on board: "I choose day X").
            - Class then reports for each day until the quiz.
            - We expect no surprise.

          Round 2: 2-day, private.
            - Teacher chooses privately (sealed envelope).
            - Class reports without any announcement.
            - We expect no surprise.

          Round 3: 2-day, private, with announcement.
            - Teacher chooses privately and then announces: "I have chosen a day such that your forecast on that day will be below 20%."
            - Class reports.
            - We hope for: class reports low on day1, teacher chooses day1, surprise.

          Round 4 (if time): 5-day, private, with announcement.

   13. Timeline:

          Introduction (5 minutes):
            - Explain the game: class vs. teacher.
            - The teacher chooses a day for the quiz.
            - Each morning, the class reports a probability (0 to 1) that the quiz is that day (given not happened yet).
            - The class is scored on accuracy using a quadratic scoring rule.
            - The teacher scores if the quiz is a surprise (forecast <0.2 on the quiz day).

          Round 1 (10 minutes):
            - 2-day week, teacher chooses publicly (say, day2). 
            - Day1: class knows it's not day1? Or if the teacher chooses day2, they know it's not day1? They know the chosen day.
            - So on day1: class reports 0 (or very low). 
            - Teacher: no quiz on day1 (since chosen day2).
            - Day2: class reports 1.
            - Quiz happens, not a surprise.
            - Accuracy: day1: 1 - (0)^2 = 1, day2: 1 - (1-1)^2 = 1 -> total 2.
            - Teacher: 0 for surprise.

          Round 2 (15 minutes):
            - 2-day week, teacher chooses privately (sealed envelope). 
            - Class discusses: they might assign 0.5 on day1.
            - Teacher then either:
                  - If class reported 0.5 on day1 and teacher chose day1: then quiz on day1 -> not a surprise (0.5>=0.2), accuracy for day1: 1 - (1-0.5)^2 = 0.75.
                  - If class reported 0.5 on day1 and teacher chose day2: then no quiz on day1 -> accuracy for day1: 1 - (0.5)^2 = 0.75, then on day2: class reports 1 -> accuracy 1, total 1.75.
            - No matter what, the teacher cannot surprise.

          Round 3 (20 minutes):
            - 2-day week, teacher chooses privately and then makes the announcement.
            - Class discusses: they know that if they report >=0.2 on both days, the announcement will be false. They want the announcement to be true. Also, they want accuracy.
            - They might decide to report 0.19 on day1.
            - Teacher, to make the announcement true, must choose day1 (because on day2 they will report 1). So the teacher chooses day1.
            - Quiz on day1, surprise! 
            - Accuracy for day1: 1 - (1-0.19)^2 = 1 - (0.81) = 0.19.
            - Total accuracy: 0.19.

            - Alternatively, the class might try to report 0.19 on day2? But on day2, if the quiz hasn't happened, they have to report 1. So they cannot plan to report low on day2.

          Round 4 (15 minutes, if time): 
            - 5-day week, with announcement.
            - We hope the class will assign a very low probability on an early day (e.g., day1: 0.19) and then the teacher chooses day1 and surprises.
            - But note: the backward induction might lead them to assign low on multiple days? Let's see:

              The class might think:

                - On day5, if we haven't had the quiz, we will have to report 1 -> not a surprise. So the teacher won't choose day5.
                - Therefore, on day4, if we haven't had the quiz, then it must be day4 or day5. But we know the teacher won't choose day5 (because it wouldn't be a surprise). So it must be day4. So we would report 1 on day4 -> not a surprise. So the teacher won't choose day4.
                - ... so they must choose day1.

              Therefore, the class might assign a very low probability on day1 (0.19) and then the teacher chooses day1 -> surprise.

            - If the class does this, then they get low accuracy on day1.

          Debrief (15 minutes): 
            - Reveal the surprise exam paradox.
            - Map the rounds to the steps in the backward induction.
            - In rounds 1 and 2, without the announcement, there was no paradox and no surprise.
            - In rounds 3 and 4, with the announcement, the class was forced to assign a low probability on an early day, and then the teacher chose that day and it was a surprise.
            - Discuss the operationalization: we defined surprise as a low forecast. But in the last round, did the class really not expect the quiz on day1? They knew it had to be day1 because of the announcement. But they reported 0.19 to allow the announcement to be true. This is the tension: they had to report against their actual belief to make the announcement true.
            - In the original paradox, the students are supposed to believe the announcement and then use it in their reasoning. But then they conclude the exam cannot happen. However, the teacher gives it on an early day and they are surprised because they had ruled out the later days and then the early day seems unlikely? 

            - Limitations:
                * We operationalized surprise as a low probability forecast. But in the announcement round, the class might have a high belief but report low to make the announcement true. This doesn't match the intuitive surprise.
                * The announcement creates a coordination issue: the class has to report in a way that allows the announcement to be true, even if it means being inaccurate.

            - Common misconceptions and when they surface:

                1. "The teacher can just not give the exam." 
                   - In our game, the teacher must give the exam exactly once. We see that in Round 3, the exam is given on day1.

                2. "Surprise only means unlikely." 
                   - We defined it as probability below 20%. But in the debrief, we can discuss that in the announcement round, the class might have known it was coming but reported low.

                3. "Randomizing the day resolves it."
                   - In Round 2, the teacher randomized privately, but the class reported 0.5 and there was no surprise. In Round 3, with announcement, randomization doesn't help because the class will report low on day1.

                4. "Not being able to deduce the date is the same as being surprised by it."
                   - In our operationalization, surprise is defined by the forecast, not by deducibility. In the announcement round, the class deduced it must be day1 but still reported a low forecast.

            - Potential issues:

                 a. Collusion: The class might try to always report 0.19 on every day to ensure surprise, but then their accuracy is bad. The quadratic scoring rule will penalize them heavily. They should see that this is not in their interest.

                 b. Refusing to commit to one number: The class must agree on one number. The instructor can facilitate discussion and then take a vote if necessary.

                 c. The final morning: In a multi-day round without announcement, on the last day they must report 1. There's no issue.

                 d. Mixed strategies: A student might suggest that the teacher should randomize. In Round 2, the teacher can randomize, but the class will still report 0.5 and there's no surprise. In Round 3, even if the teacher randomizes, the class has to report low on an early day to make the announcement true, and then the teacher can choose that day. Randomization by the teacher doesn't change the class's best response.

            - What would change my mind about the design? 
                  If in the announcement round, the class does not see the need to assign a low probability on an early day, then the paradox doesn't arise. 
                  We rely on the class following the backward induction.

                  Alternative operationalization: Instead of forecasting, have each student privately write down whether they are surprised after the quiz. But then we lose the quantitative aspect and the scoring rule.

            - What the game cannot reproduce: 
                  The game operationalizes knowledge/belief with a probability forecast. In the original paradox, the students are said to "know" that the exam cannot be on the last day. In our game, they never assign probability 0 to any day (except in the public round). The announcement round gets closer by forcing them to act as if the last days are impossible.

   14. Materials:

          - Envelopes and paper for the teacher to seal the chosen day.
          - A way to display the class's forecast (whiteboard).
          - A quiz (a simple one, maybe one question) for each round.

   15. Minute-by-minute:

          - 0-5 min: Introduction and rules.
          - 5-15 min: Round 1 (2-day, public). Teacher chooses publicly (say day2). Class reports on day1: 0 (or very low), then on day2: 1. Quiz on day2. Scores: class accuracy=2, teacher surprise=0.
          - 15-30 min: Round 2 (2-day, private). Teacher chooses privately. Class reports on day1 (likely 0.5). Then if teacher chose day1: quiz on day1, accuracy=0.75. If teacher chose day2: no quiz on day1, then day2 report 1, accuracy=0.75+1=1.75. Teacher surprise=0 in either case.
          - 30-50 min: Round 3 (2-day, private with announcement). Teacher chooses privately and makes announcement. Class likely reports low on day1 (say 0.19). Teacher chooses day1. Quiz on day1, surprise. Class accuracy=0.19.
          - 50-70 min: Round 4 (5-day, private with announcement). Class reports on day1: low (0.19). Teacher chooses day1. Quiz on day1, surprise. Class accuracy=0.19.
          - 70-75 min: Quick debrief: reveal the paradox and say we'll discuss next class.

          But 75 minutes might be tight. We might only do three rounds.

          Alternatively, skip Round 4 and use the time for debrief.

          Revised for three rounds:

            - 0-5: intro
            - 5-15: Round1
            - 15-30: Round2
            - 30-50: Round3 (2-day with announcement)
            - 50-75: debrief

          In debrief:

            - What happened in Round1? No surprise because the class knew the day.
            - Round2? The class didn't know, but they were accurate and there was no surprise.
            - Round3? The teacher announced that the quiz would be a surprise. The class then assigned a low probability on day1, and the teacher chose day1 and it was a surprise.

            - Explain the backward induction for a 2-day week with the announcement:

                  On day2, if the quiz hasn't happened, the class will report 1 -> not a surprise. So the teacher cannot choose day2. Therefore, the quiz must be on day1. Therefore, the class should report 1 on day1? But then it wouldn't be a surprise. Contradiction.

            - How did we resolve it in the game? The class reported low on day1, and the teacher chose day1. The class was surprised.

            - This is the surprise exam paradox: the backward induction seems to show the exam cannot be given, but it is given and it is a surprise.

            - Discuss the limitations of the game: 

                  - We defined surprise by the forecast, not by the student's true belief. In Round3, the class knew it was likely to be day1, but they reported 0.19 to allow the announcement to be true. So were they truly surprised? 

            - Then assign a reading on the paradox for next class.

   Given the complexity, we proceed with this design.
answer: |-
  Below is a runnable classroom game designed to immerse students in the surprise exam paradox through active participation, with a scoring system, real stakes, and a structured debrief. The game avoids mentioning the paradox until the end, focusing instead on the conflict between forecast accuracy and the possibility of surprise.

  ---

  ### **Game Overview**
  - **Teams**: Class (24 students) vs. Teacher (you or a rotating student volunteer).
  - **Objective**:  
    - Class aims to maximize **accuracy** in daily probability forecasts (using a quadratic scoring rule).  
    - Teacher aims to deliver a **surprise quiz** (class's forecast < 20% on quiz day).  
  - **Quiz Definition**:  
    - Teacher selects a quiz day in advance (sealed in an envelope).  
    - Quiz is "surprising" if the class’s forecast *that morning* is < 0.2 (20%).  
  - **Structure**:  
    - 4 rounds (2-day public, 2-day private, 2-day with announcement, 5-day with announcement).  
    - Each round uses a "week" (2 or 5 sequential days).  
    - Debrief links gameplay to the paradox.  

  ---

  ### **Materials**
  1. Envelopes + paper for sealing quiz days.  
  2. Whiteboard for forecasts/scores.  
  3. Simple quiz (e.g., 1 logic puzzle or math problem).  
  4. Scoreboard (track class accuracy vs. teacher surprise points).  

  ---

  ### **Rules & Scoring**  
  1. **Forecasting**:  
     - Each morning, the class **agrees on one probability** (e.g., 0.3 = 30%) that the quiz is that day (given no prior quiz).  
     - Forecast must be a number between 0 and 1.  

  2. **Quadratic Scoring Rule** (for class accuracy):  
     - If quiz occurs on day *d*: Score = `1 - (1 - forecast_d)²`  
     - If no quiz on day *d*: Score = `1 - (forecast_d)²`  
     - **Example**:  
       - Forecast 0.4 on quiz day: `1 - (1 - 0.4)² = 1 - 0.36 = 0.64`  
       - Forecast 0.4 on non-quiz day: `1 - (0.4)² = 1 - 0.16 = 0.84`  

  3. **Teacher’s Surprise Condition**:  
     - If forecast < 0.2 on quiz day: Teacher earns **1 surprise point**.  
     - If forecast ≥ 0.2: No surprise point.  

  4. **Game Flow per Round**:  
     - Teacher **seals quiz day** in envelope (public/private as specified).  
     - For **days 1 to N** (until quiz occurs):  
       - Class debates and locks in forecast.  
       - Teacher reveals if quiz occurs that day.  
       - If quiz: Administer quiz, record surprise, end round.  
       - If no quiz: Proceed to next day.  
     - After quiz, calculate:  
       - Class: Sum of daily accuracy scores.  
       - Teacher: 1 if surprise, else 0.  

  ---

  ### **Timeline (75 Minutes Total)**  
  #### **0–5 min: Introduction**  
  - Explain rules, scoring, and roles (no mention of paradox).  
  - Emphasize: "Class wins if accuracy is high; Teacher wins if quiz surprises."  

  #### **Round 1: 2-Day Week, Public Selection (5–15 min)**  
  - **Goal**: Show certainty prevents surprise.  
  - **Setup**: Teacher writes quiz day (e.g., "Day 2") on board — visible to all.  
  - **Gameplay**:  
    - *Day 1*: Class forecasts (likely 0 for Day 1 if quiz is Day 2). No quiz. Score = `1 - (0)² = 1`.  
    - *Day 2*: Class forecasts 1. Quiz occurs. Accuracy = `1 - (1-1)² = 1`. Total accuracy = 2.  
    - Teacher surprise = 0 (forecast ≥ 0.2).  
  - **Debrief Prep**: Note: "No surprise possible when day is known."  

  #### **Round 2: 2-Day Week, Private Selection (15–30 min)**  
  - **Goal**: Conflict surfaces; accuracy blocks surprise.  
  - **Setup**: Teacher seals quiz day privately (envelope).  
  - **Gameplay**:  
    - *Day 1*: Class debates. Likely forecasts 0.5 (true belief).  
      - If quiz on Day 1: Accuracy = `1 - (1-0.5)² = 0.75`; no surprise (≥0.2).  
      - If no quiz: Accuracy = `1 - (0.5)² = 0.75`.  
    - *Day 2*: Class forecasts 1. Quiz occurs. Accuracy += 1.  
    - Total accuracy = 1.75 (if Day 2 quiz) or 0.75 (if Day 1 quiz). Teacher surprise = 0.  
  - **Debrief Prep**: Note: "Teacher couldn’t surprise even with uncertainty."  

  #### **Round 3: 2-Day Week, Private + Announcement (30–50 min)**  
  - **Goal**: Announcement forces backward induction.  
  - **Setup**: Teacher seals day privately, then announces:  
    > "I have chosen a day such that your forecast on that day will be below 20%."  
  - **Gameplay**:  
    - Class debates. Backward induction likely:  
      - "If no quiz Day 1, Day 2 forecast = 1 → no surprise → so quiz must be Day 1!"  
      - To satisfy announcement, class forecasts low on Day 1 (e.g., 0.19).  
    - Teacher chooses Day 1 (only way to satisfy announcement).  
    - Quiz on Day 1: Accuracy = `1 - (1-0.19)² = 0.3439`; surprise = 1 (0.19 < 0.2).  
  - **Debrief Prep**: Note paradox: "Class deduced Day 1, yet reported low → ‘surprised’."  

  #### **Round 4: 5-Day Week, Private + Announcement (50–70 min)**  
  - **Goal**: Backward induction collapses entire week.  
  - **Setup**: Teacher seals day privately, repeats announcement.  
  - **Gameplay**:  
    - Class likely forecasts low on Day 1 (e.g., 0.19) to allow surprise.  
    - Teacher chooses Day 1 → quiz → accuracy = 0.3439; surprise = 1.  
    - (If class resists, backward induction eliminates Days 5,4,3,2 → forces Day 1.)  
  - **Key Moment**: Class realizes forecasting 1 on Day 5 is unavoidable → eliminates later days.  

  #### **70–75 min: Debrief & Paradox Reveal**  
  - Reveal: "You experienced the **Surprise Exam Paradox**."  
  - **Map Game → Paradox Logic**:  
    | **Game Moment**          | **Paradox Step**                                                                 |  
    |---------------------------|----------------------------------------------------------------------------------|  
    | Round 1 (public)          | Certainty prevents surprise → exam can’t be surprising if known.                |  
    | Round 3/4 announcement   | Teacher’s announcement creates a self-referential loop.                         |  
    | Class forecasts 1 on Day 5 (implied) | "Last day can’t be a surprise" → eliminates Day 5.                   |  
    | Elimination propagates to Day 1 | "If Days 5–2 are impossible, only Day 1 remains." → but then forecast should be high. |  
    | Class reports low on Day 1 (Rounds 3/4) | To satisfy announcement, you suppressed true belief → "surprise" occurs, but feels artificial. |  
    | Teacher surprises on Day 1 | Real-world parallel: Exam given early, but students were "surprised" by definition. |  
  - **Address Misconceptions**:  
    1. **"Teacher can skip the exam"**:  
       - *When surfaced*: During class debate in Round 3/4.  
       - *Defuse*: "In our game, the teacher *must* choose a day. The paradox assumes the exam happens."  
    2. **"Surprise = low probability"**:  
       - *When surfaced*: When class debates thresholds (e.g., "Is 0.19 surprised?").  
       - *Defuse*: "In Round 3, you knew Day 1 was likely but reported 0.19. Is that true surprise?"  
    3. **"Randomization solves it"**:  
       - *When surfaced*: If class suggests random forecasts.  
       - *Defuse*: "Random forecasts hurt accuracy (scoring rule penalizes dishonesty)."  
    4. **"Induction = surprise"**:  
       - *When surfaced*: If class says "We couldn’t deduce the day, so we were surprised."  
       - *Defuse*: "In Round 2, you couldn’t deduce the day, but there was no surprise. Why?"  
  - **Predictable Issues & Fixes**:  
    - **Collusion**: Class always forecasts 0.19 to "force" surprise.  
      - *Fix*: Scoring rule penalizes inaccuracy (e.g., forecasting 0.19 on non-quiz day: `1 - (0.19)² = 0.9639` vs. true 0.5: `1 - (0.5)² = 0.75` → lower score).  
    - **Refusing to commit**: Class debates endlessly.  
      - *Fix*: Impose 2-minute time limits; vote if deadlocked.  
    - **Degenerate final day**: If quiz reaches final day, class must forecast 1.  
      - *Fix*: Acknowledge in debrief: "This is why backward induction starts at the end."  
    - **Mixed strategies**: "Teacher should randomize days."  
      - *Fix*: "In Rounds 3/4, randomization doesn’t help—the announcement forces Day 1."  

  ---

  ### **Limitations & Caveats**  
  1. **Forecast ≠ Knowledge**:  
     - The game substitutes public forecasts for private knowledge. In Round 3, students *knew* the quiz was likely on Day 1 but *reported* 0.19 to satisfy the announcement. This diverges from the paradox’s focus on epistemic states ("knowing" the exam can’t occur).  
  2. **Threshold Arbitrariness**:  
     - 20% is intuitive but subjective. Real surprise is vague; the game operationalizes it to create conflict.  
  3. **Announcement Implementation**:  
     - In the paradox, the announcement is common knowledge. In the game, it’s public but may not trigger full common-knowledge reasoning.  

  ---

  ### **What Would Change My Mind?**  
  - If students **don’t engage in backward induction** in Round 3 (e.g., they forecast 0.5 on Day 1), the paradox’s collapse won’t materialize. This suggests the game fails to induce the key reasoning.  
  - If **alternative operationalizations** (e.g., students privately journal expectations) better capture "surprise as disbelief," the forecast mechanic may be inadequate.  
  - **Room feedback**: If post-game surveys show students still dismiss the paradox as "word trickery," the game didn’t bridge abstraction to intuition.  

  ---

  ### **Final Notes**  
  This game makes the paradox visceral: Students see accuracy conflict with surprise, experience backward induction, and confront a teacher who "wins" under their own reasoning. By withholding the paradox’s name, you ensure they engage with the mechanics before labeling the dilemma. The debrief then links their frustration to centuries of philosophical debate.
