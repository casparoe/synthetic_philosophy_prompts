prompt: |-
  You are a professional philosopher who specialises in value theory and in the practical ethics of commemoration, and who has spent time advising memorial commissions and curriculum committees. Take this seriously and work carefully: before you write the final answer, spend a few paragraphs brainstorming candidate requirements freely, including ones you then reject, so I can see what you considered and cut. Then give me the finished specification.

  The situation: I have no academic background in philosophy, only a long private interest, and I have ended up on a volunteer committee with an unenviable job. We have a fixed budget, a fixed amount of physical space, and a fixed number of teaching hours, and we have to divide all three among several historical atrocities we are being asked to commemorate: cases on the order of the Nazi genocide, the transatlantic slave trade, and the deliberate starvation of a colonised population. Whatever we do will be public, and descendants of the victims and survivors will read our reasons. So ranking is being forced on us whether or not ranking is a decent thing to do, and I would like a specification before I read or invent any particular ranking method.

  Write me the desiderata that a theory of comparative magnitude for atrocities would have to meet to be good enough for a decision of exactly this kind: a committee with limited resources, no research staff, and an obligation to give reasons in public. For each requirement, give the case or consideration behind it and why that case earns it a place on the list. Then mark which requirements you take to be non-negotiable for adequacy and which are really preferences of one camp dressed up as requirements.

  Here are the puzzles I keep circling, which I want your list to speak to rather than skirt. Please treat them as the raw material for the requirements, and tell me frankly if any of them is a bad test:

  The currency problem. A ranking has to say what is being compared: deaths, life-years lost, suffering, stolen futures, destroyed languages and kinship structures, terror, the corruption of the perpetrators, the damage done to everyone who watched and did nothing. If a theory needs conversion rates between these, say so and say what would justify one.

  The replacement test, which is my own invention and the one I trust most. Suppose a people is destroyed and, a century later, an unrelated population lives in the same place, speaks a different language, and is on average no worse off than the destroyed people would have been. Has anything bad happened here beyond the killing itself, and how much? A theory that answers "almost nothing extra" has built in a very specific assumption, and I want that assumption surfaced as a requirement rather than left implicit.

  Scale saturation. I notice that my own reaction to two hundred thousand deaths and to two million deaths is roughly the same, and I don't know whether that shows something about magnitude or only about me. A theory must say what it does when our sense of magnitude flattens out, and whether it is allowed to rank by a number that nobody can feel.

  The survivor's remainder. Some of the harm of an atrocity is carried afterwards by the people who lived: the grief, the inherited poverty, the broken families, the fear passed down. This does not track the death count. Say whether a theory must include it, and what goes wrong if it does.

  Manner and will. Hold the outcomes fixed: two events each kill the same number of people in the same amount of pain, but one is deliberate extermination and the other is indifference that foreseeably kills. Does the theory count the intention as extra badness, or only the outcome? Both answers cost something, and I want to know which cost is worse.

  Kind versus degree. I have a stubborn intuition that destroying a whole people, language and all, is not merely a bigger quantity of the same thing as killing many people within a surviving people, but something different in kind. If a theory is purely additive it cannot say this. Tell me whether "different in kind" is a genuine desideratum or a prejudice, and what it costs to include.

  The archive shadow. Perpetrators destroy records, and the best-documented atrocities are often the ones committed by losers or by literate bureaucracies. Any method we can actually run will therefore be biased toward the well-recorded. A requirement I care about: the theory must degrade honestly under missing evidence and must not quietly award high rank to whoever kept the best paperwork. Tell me how to state this so it binds.

  The obscenity question, which I refuse to drop. Many people say that ranking evils at all demotes the victims of whichever event comes second. I want this handled inside the specification rather than as an objection to it: a theory should say which verdicts it permits — greater, lesser, equal, on a par and incomparable, or silence — and should not collapse "equal in magnitude" with "cannot be compared." It should also distinguish ranking because a decision requires it from ranking for its own sake, and say something about who is permitted to do the ranking, since our committee is not composed of victims.

  Please also do the part I most want to see: identify any subset of these requirements that cannot be jointly satisfied, and be explicit that the list then becomes a result rather than a shopping list. I suspect at least two collisions — between demanding a verdict for every pair and allowing genuine incomparability, and between using only evidence the archives can bear and being able to rank badly documented atrocities at all — but find the ones I have missed.

  Finally, two short things. Tell me which single requirement does the most work in ruling out otherwise attractive approaches, since that tells me where the real argument is. And then, briefly, score three or four families of approach against your own list: ranking by death toll or lost life-years, ranking by the intention and meaning of the act, the view that refuses verdicts and permits only parity, and the view that ranks by what is still reparable or by who still has a live claim on us. Keep the weight on the criteria and their motivating cases; the scorecard is for orientation only.
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for a theory that can rank the magnitude of atrocities, specifically for practical decision-making by a committee with limited resources. They’ve laid out several puzzles they want addressed, like the currency problem and the replacement test. I need to tackle this carefully.

  First, I should start by brainstorming potential requirements. The user wants to see the thought process, including rejected ideas. So, I'll list out all possible criteria that come to mind based on their puzzles. For each, I'll consider if it's necessary, negotiable, or should be dropped.

  The currency problem is central. What's being measured? Deaths? Suffering? Cultural loss? The theory needs a clear currency but must avoid oversimplifying. Maybe requiring explicit parameters instead of a single metric is better. Non-negotiable because without it, comparisons are meaningless.

  Then, the replacement test. If a group is replaced by another equally well-off, is there extra harm? If the theory says no, it implies only individual harms matter. But cultural destruction adds intrinsic harm. This should be non-negotiable to force the theory to address collective loss.

  Scale saturation: our emotional response flattens with large numbers. Should the theory rely on countable units even if they feel abstract? Non-negotiable because ignoring scale would misrepresent magnitude, but the theory must handle this flattening transparently.

  Survivor's remainder: harms affecting survivors and descendants. This doesn't track death tolls, so excluding it might understate atrocity impact. But it's hard to measure. Maybe negotiable as a preference, but important enough to include as a requirement.

  Manner and will: intentionality vs. indifference. Does motive add extra badness? Both answers have costs. This might be negotiable depending on the theory's focus. But it should be addressed explicitly.

  Kind vs. degree: is destroying a culture qualitatively different? A purely additive approach can't capture this. This should be non-negotiable to prevent reductionism.

  Archive shadow: missing records bias towards well-documented events. The theory must degrade gracefully under incomplete evidence. Non-negotiable to avoid unfair rankings.

  Obscenity question: ranking might demote victims. The theory must specify permissible verdicts and distinguish decision-based ranking from inherent comparisons. Also, clarify the committee's role. Non-negotiable for ethical integrity.

  Now, identifying conflicts. For example, demanding verdicts for every pair vs. allowing incomparability—can't have both. Also, using only available evidence vs. ranking poorly documented atrocities. These conflicts mean trade-offs are necessary.

  The requirement doing the most work might be the currency problem. It forces explicit choices, ruling out simple metrics like death tolls alone.

  Scoring approaches:
  - Death toll/life-years: Fails on currency (ignores non-lethal harms), replacement test, survivor's remainder, kind vs. degree.
  - Intention-based: Handles manner and will but struggles with currency and archive shadow (intent is hard to prove).
  - No ranking/parity: Avoids obscenity but fails practical needs for allocation.
  - Reparative approach: Focuses on present claims but may neglect historical magnitude and survivor's remainder.

  I need to ensure the final specification addresses all puzzles, marks non-negotiables, and highlights conflicts. The user needs a practical tool that's ethically sound, so clarity and transparency are key.
answer: |-
  Here is a systematic specification for a theory of comparative atrocity magnitude, designed for your committee's constrained, high-stakes decision-making context. I begin with candid brainstorming of candidate requirements (including rejected ones), then present the refined desiderata, conflicts, and evaluations.

  ---

  ### **Brainstorming Candidate Requirements (Including Rejected)**
  1. **Requirement: Single Currency Comparability**  
     *Idea*: The theory must reduce all harms to a single metric (e.g., "utils of suffering") for straightforward ranking.  
     *Case*: Simplifies allocation decisions; avoids opaque trade-offs.  
     *Rejected*: Fails the Currency Problem. Deaths, cultural loss, and terror are incommensurable (e.g., how many deaths equal the erasure of a language?). Forcing conversion is arbitrary and alienates victims’ descendants.  

  2. **Requirement: Survivor-Centric Weighting**  
     *Idea*: Prioritize atrocities with living survivors or recent trauma.  
     *Case*: Addresses Survivor’s Remainder; harm is ongoing.  
     *Rejected*: Biases against older atrocities (e.g., transatlantic slavery vs. Holocaust) and may ignore historical scale. Turns ethical weight into proximity, violating Replacement Test.  

  3. **Requirement: Intentionality Multiplier**  
     *Idea*: Deliberate extermination is inherently worse than negligent killing.  
     *Case*: Captures Manner and Will; moral outrage at purposeful evil.  
     *Rejected?*: Risks undervaluing structural atrocities (e.g., colonial neglect). May be unverifiable (Archive Shadow). Retained but made negotiable.  

  4. **Requirement: Quantitative Dominance**  
     *Idea*: Death tolls/life-years lost are primary; other factors are modifiers.  
     *Case*: Pragmatic for committees; data is often available.  
     *Rejected*: Fails Replacement Test (ignores cultural annihilation) and Kind vs. Degree. Deaths alone don’t capture stolen futures.  

  5. **Requirement: Incomparability Allowance**  
     *Idea*: The theory must permit "on a par" or "incomparable" verdicts.  
     *Case*: Addresses Obscenity Question; avoids false precision.  
     *Rejected?*: Conflicts with practical need for allocations. Retained but bounded.  

  6. **Requirement: Reparability Focus**  
     *Idea*: Rank by what can still be remedied (e.g., land returns, apologies).  
     *Case*: Practical for resource allocation; honors live claims.  
     *Rejected*: Ignores historical magnitude (e.g., irreparable cultural genocide). Biases toward recent events.  

  7. **Requirement: Perpetrator Culpability Scaling**  
     *Idea*: Worse if perpetrators were enlightened or violated explicit norms.  
     *Case*: Highlights moral corrosion; relevant for educational commemoration.  
     *Rejected*: Subjective and archive-dependent (e.g., how to compare ancient vs. modern norms?). Cut for feasibility.  

  8. **Requirement: Scale Sensitivity**  
     *Idea*: Magnitude must reflect logarithmic or threshold-based scaling.  
     *Case*: Acknowledges Scale Saturation; 1M deaths ≠ 10×100K deaths morally.  
     *Retained*: Avoids flattening; uses felt moral intuition.  

  ---

  ### **Refined Desiderata for the Theory**  
  *(Non-negotiables marked **★**; others are negotiable preferences)*  

  1. **★ Explicit Parameterization**  
     **Case**: Currency Problem. The theory must specify *which dimensions* of harm it compares (deaths, cultural loss, etc.) and *how they interact* (e.g., additive, lexical, thresholds).  
     **Why non-negotiable**: Without this, rankings are unintelligible. Descendants deserve transparency on what "magnitude" means.  
     **Cost**: Forces hard choices but avoids false neutrality.  

  2. **★ Collective Harm Acknowledgment**  
     **Case**: Replacement Test. The theory must account for harms beyond individual suffering (e.g., destruction of peoples, languages, kinship).  
     **Why non-negotiable**: Answers "yes" to Replacement Test—cultural annihilation adds distinct badness. Failing this whitewashes colonialism/genocide.  

  3. **★ Epistemic Humility**  
     **Case**: Archive Shadow. The theory must degrade verdicts to "incomparable" or "low confidence" when evidence is poor, and avoid over-reliance on perpetrator records.  
     **Why non-negotiable**: Prevents bias toward well-documented atrocities (e.g., Nazis vs. poorly recorded colonial famines).  

  4. **★ Verdict Spectrum Clarity**  
     **Case**: Obscenity Question. The theory must define permissible verdicts: e.g., *greater/lesser*, *equal*, *on a par* (similar but distinct), or *incomparable*. It must distinguish "equal" from "incomparable" and limit ranking to contexts requiring allocation.  
     **Why non-negotiable**: Protects against demoting victims; clarifies that ranking is instrumental, not ontological.  

  5. **Scale Non-Flattening**  
     **Case**: Scale Saturation. The theory must not treat magnitude as linear (e.g., 1M deaths ≠ 10×100K deaths). Use thresholds or diminishing returns.  
     **Why negotiable**: Some theories (e.g., utilitarianism) reject this. But ignoring saturation feels inhuman—prioritize if feasible.  

  6. **Survivor/Descendant Harm Inclusion**  
     **Case**: Survivor’s Remainder. The theory should include intergenerational trauma, economic deprivation, and ongoing fear.  
     **Why negotiable**: Vital for holistic harm assessment but hard to measure. Omission risks "burying" living victims.  

  7. **Intent-Act Differentiation**  
     **Case**: Manner and Will. The theory may count deliberate extermination as worse than negligent killing (if verifiable), but must not reduce outcome-based harm.  
     **Why negotiable**: Intentionality matters morally but is often opaque. A "preference" for certain ethical camps (e.g., deontologists).  

  8. **Qualitative Thresholds**  
     **Case**: Kind vs. Degree. The theory should allow qualitative shifts (e.g., erasing a culture is worse in kind than killing individuals).  
     **Why negotiable**: Rejects pure additivity but may complicate rankings. Cut if simplicity is paramount.  

  ---

  ### **Irreconcilable Conflicts (The List as Result)**  
  1. **Verdict Demand vs. Incomparability Allowance**  
     - *Conflict*: Requiring a verdict for every pair (to allocate resources) clashes with permitting genuine incomparability (for epistemic/ethical reasons).  
     - *Resolution*: The theory *must* allow incomparability but *should* provide fallback criteria (e.g., "prioritize resolvable claims") for forced decisions.  

  2. **Epistemic Rigor vs. Ranking Poorly Documented Atrocities**  
     - *Conflict*: Honest degradation under missing evidence (Archive Shadow) may make some atrocities unrankable, yet committees must allocate to them.  
     - *Resolution*: Rank only dimensions with robust evidence (e.g., deaths if documented, omit cultural loss if not). Accept partial rankings.  

  3. **Collective Harm vs. Individualist Frameworks**  
     - *Conflict*: Theories prioritizing individual suffering (e.g., life-years lost) cannot easily accommodate the intrinsic badness of group destruction (Replacement Test).  
     - *Resolution*: Treat collective harm as a separate parameter, not reducible to individual tolls.  

  ---

  ### **The High-Leverage Requirement**  
  **Explicit Parameterization** does the most work in ruling out approaches. It forces the theory to declare its moral priorities (e.g., "cultural loss counts half as much as deaths per capita"), exposing value judgments. This disqualifies:  
  - **Monistic theories** (e.g., "only deaths matter") for ignoring non-lethal harms.  
  - **Vague holistic approaches** that evade accountability.  

  ---

  ### **Approach Scorecard (vs. Requirements)**  
  | **Approach**               | **Explicit Parameters** | **Collective Harm** | **Epistemic Humility** | **Verdict Spectrum** | **Notes** |  
  |----------------------------|-------------------------|---------------------|------------------------|----------------------|-----------|  
  | **Death Toll/Life-Years**  | ✘ (Ignores non-lethal) | ✘                  | △ (If data exists)     | △ (Linear equality)  | Fails Replacement Test, Survivor’s Remainder. Simple but reductive. |  
  | **Intentionality-Based**   | △ (Motive as parameter) | ✘                  | ✘ (Intent hard to prove) | △ (Ranks "evil")     | Struggles with Archive Shadow; overweights perpetrators’ state of mind. |  
  | **No Ranking/Only Parity** | ✓ (Clear incomparability) | ✓                 | ✓                      | ✓★                  | Best on Obscenity Question but fails committee’s practical need for allocation. |  
  | **Reparative/Live Claims** | △ (Parameters: urgency) | △ (If claims exist) | △                      | △                   | Addresses Survivor’s Remainder but neglects historical scale (e.g., irreparable ancient harms). |  

  **Key**: ✓ = Fully meets, △ = Partially meets, ✘ = Fails. ★ = Non-negotiable.  

  ---

  ### **Final Specification**  
  A theory of comparative atrocity magnitude, for your committee’s purpose, must:  
  1. **Explicitly define and weight harm dimensions** (e.g., deaths, cultural loss, intergenerational trauma), accepting that no single "currency" suffices.  
  2. **Treat group annihilation as qualitatively distinct** from individual killings.  
  3. **Degrade confidence rankings under poor evidence** and avoid over-reliance on perpetrator archives.  
  4. **Permit verdicts of incomparability/parity** while providing secondary criteria for forced allocations.  
  5. **Scale non-linearly** (e.g., thresholds for "catastrophe" vs. "mass killing").  
  6. **Distinguish decision-ranking from moral hierarchy** in public justifications.  

  **Why this works**: It forces transparency, honors irreducible harms, and meets practical constraints while minimizing ethical costs. The conflicts (e.g., incomparability vs. allocation) remain, but the theory makes them visible—turning justifications into part of the commemoration itself. Your committee’s reasons, not the ranking, become the ethical core.
