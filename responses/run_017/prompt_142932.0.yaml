prompt: |-
  I am a PhD student in philosophy — my dissertation concerns the distinction between reasons that bear on whether an attitude fits its object and reasons that bear only on the value of being in that attitude — and for the past two years I have served as the graduate member and, informally, the minute-writer of my university's Research Integrity Review Panel. I would like a decision procedure the panel could actually run, written so that people who have never encountered that distinction can apply it correctly.

  The setting: the panel has eight seats — two senior scientists from different departments, a statistician, a research-compliance officer, a non-voting attorney from the Office of General Counsel, a rotating faculty member, me, and a chair who is an associate dean. We meet monthly for ninety minutes and handle ten to fifteen matters a year. We have no power to compel raw data or to interview unwilling parties; the statistician is the only member who can competently read the analyses in front of us; and the attorney screens every sentence for defamation exposure, so we cannot say anything we could not defend. Our output is a two-page recommendation to the Vice Provost for Research, who signs off on nearly all of them. The options in front of us are: close the matter with no public action, request materials from the authors, place a note on the publication record, recommend retraction, or refer the matter to the federal research-integrity office. The stakes run from a postdoc's career to a center's funding to the credibility of the institution's record.

  My sense is that the panel's real question is an attitude question in administrative costume: do we have a reason of the right kind to reduce confidence in this finding? Most of what actually moves the panel is not of that kind — it is the trouble a complainant can make, the existence of press coverage, the funder's mood, the size of the citing literature, the career damage a note would do to a junior author, the desire to be seen as responsive. Some of those are perfectly good reasons to do something. None of them, as far as I can tell, is a reason to doubt the finding, and the panel slides between the two constantly. I want a procedure that stops the slide.

  Please give me the following.

  An ordered set of questions, each with an account of what counts as a sufficient answer, including where the procedure stops with a no and where it hands the decision to a vote because the question is one of values rather than facts. It must be runnable inside a ninety-minute meeting, by the eight people described, and it must generate the two-page record as a by-product rather than as extra work.

  The procedure has to preserve a set of distinctions I keep watching the panel collapse. First, the basic one: considerations that bear on whether the finding is reliable, versus considerations that bear on what it costs or gains the panel, the institution, or the authors for us to be in a state of doubt. Second, reasons to investigate versus reasons to doubt: most of what reaches us justifies the first and is then treated as though it justified the second, and I want that gap to be explicit and thresholded. Third, the asymmetry of verdicts: our not finding evidence of fabrication, and the authors' answering our questions cooperatively, are not reasons for confidence, and the procedure must not let a written record imply that they are. Fourth, the stakes question, which I want flagged rather than settled: a finding that underwrites a clinical guideline, or that has hundreds of citing papers, raises the cost of being wrong — say whether that lowers the bar for reducing confidence, what the procedure assumes, and what would change under the view that it does not. Then the mirror image, which is the panel's most common failure: the damage that flagging would do to a junior author is not a reason for confidence either, and I want that as its own check rather than a footnote. Fifth, source-relative reasons: an allegation from a former lab member in a bitter dispute, or from an anonymous dossier since picked up by a science news outlet — distinguish what the complainant's motives do to the reliability of their testimony from what the trouble they can cause, or the coverage they have generated, does to us.

  Two further wrinkles that I have not seen handled anywhere and that I think matter more than the tidy cases. The first is what I have started calling laundered reasons: considerations that exist only because the panel or another body previously acted on reasons of the wrong kind, and which return to us later disguised as reasons of the right kind. A flag issued two years ago mainly to placate a large foundation now appears in a General Counsel memo as part of a documented pattern. The procedure must say whether such a consideration has any weight, and if it has none, what the panel is obliged to do when it shows up in a new file — including whether it owes a written correction of its own prior action. The second is that a committee is arguably not the kind of thing that has attitudes at all, and its output is a public statement that will function as evidence for readers who were not in the room. So the procedure should say whether it is trying to bring the panel to the fitting attitude, or to give readers a reason of the right kind to revise theirs, or both — and what breaks if it is the second, since a statement aimed at other people's attitudes makes almost every consideration look like a state-given one from our side.

  Please also mark, at each step, which parts are genuine procedure and which are judgment calls dressed up as procedure, and close by saying what the procedure cannot do: the questions it cannot answer, the cases it will systematically mishandle, and the points at which my distinction simply runs out.

  Then run it on three files.

  One: an anonymous dossier alleging image manipulation in a paper from six years ago. A forensic image review came back inconclusive; the authors produced part of the raw data and said the rest was lost in a lab move; the field is polarized; the dossier's author is identifiable as a former lab member with a documented grievance; a science news outlet has written about the allegations twice; and the chair wants a note on the record to show we responded.

  Two: an undisputed analytical error in a paper whose central result underwrites a clinical guideline. The statistician says the claim does not follow from the analysis anyone could run; the senior authors concede the error but say the conclusion survives; the error was found by a graduate student in the lab who is about to go on the job market and has asked not to be named; and the compliance officer notes that a note on the record would trigger a funder review of the entire center.

  Three: the laundering case. A new allegation against a lab the panel flagged two years ago, on a file I now think was driven almost entirely by reasons of the wrong kind and for which I drafted the minutes. The new file's summary cites our own earlier flag as corroboration. Run the procedure honestly and tell me what it commits us to, including whether it commits us to stating in writing that the earlier flag carried no evidential weight. If it does, say so plainly; that is an answer I will not like, and I would rather have it from the procedure than discover it myself in the meeting.

  I know the philosophical literature on this; I do not need citations, references, or a reading list, and the attorney will not read them anyway. What I need is something eight people with different training can run in a room in ninety minutes. Please write in American English, roughly 1,200 to 1,600 words, in a form I could circulate to the panel with only the identifying details changed.
reasoning: |-
  We are constructing a decision procedure for the Research Integrity Review Panel. The procedure must:
  1. Distinguish between reasons bearing on the reliability of a finding (attitude-fitting reasons) and reasons bearing on the costs/benefits of expressing doubt (state-given reasons).
  2. Prevent the slide from reasons to investigate to reasons to doubt.
  3. Avoid implying that lack of evidence of misconduct or cooperation from authors is evidence for confidence.
  4. Flag the stakes (e.g., high-impact findings) without necessarily letting them lower the bar for doubt.
  5. Explicitly separate the damage to a junior author from the reliability question.
  6. Handle source-relative reasons: separate the reliability of testimony from the trouble the source might cause.
  7. Address laundered reasons (prior actions taken for wrong-kind reasons that now appear as evidence).
  8. Clarify whether the panel's output is about the panel's attitude, giving readers reasons, or both.

  The procedure will be an ordered set of questions. Each question must have clear criteria for sufficient answers and indicate when to stop or when to hand over to a vote (for value judgments). It must be executable in 90 minutes and generate the two-page record as a by-product.

  Procedure Structure:

  We break the process into stages:

  Stage 1: Preliminary Triage (Reasons to Investigate)
  Stage 2: Assessment of Reliability (Reasons to Doubt)
  Stage 3: Decision on Action (Considering State-Given Reasons Appropriately)
  Stage 4: Output and Record

  At each step, we note what is procedural (fact-based, mechanical) and what is a judgment call.

  ---

  **Research Integrity Review Panel Decision Procedure**

  **Purpose**: To determine whether there are sufficient reasons of the right kind (i.e., bearing on the reliability of the finding) to warrant reducing confidence in a research finding, and then to decide on an appropriate administrative action, while clearly separating these from considerations of cost, convenience, or external pressure.

  **Procedure Overview**: The panel will proceed through the following steps in order. Each step must be completed before moving to the next. The procedure is designed to generate a two-page record as it runs.

  ---

  **Stage 1: Preliminary Triage (Reasons to Investigate)**

  *Objective*: Determine if there is enough initial evidence to warrant further investigation. This step is about whether we should even be looking at the matter, not about the reliability of the finding.

  **Question 1: Does the allegation or evidence presented, if taken at face value, describe a potential breach of research integrity that could affect the reliability of the finding?**
  - *What counts as sufficient*: The allegation must specify a concrete practice (e.g., image manipulation, data fabrication, plagiarism, analytical error) that, if true, would undermine the reliability of the finding. Vague complaints (e.g., "this feels wrong") do not suffice.
  - *Procedure*: The panel reviews the initial complaint or evidence. The statistician and the rotating faculty member (if from the relevant field) are tasked with explaining whether the alleged practice, if true, would affect the reliability. The attorney checks for legal sufficiency (e.g., not frivolous).
  - *Judgment call*: Deciding whether the alleged practice is serious enough to potentially undermine reliability. This is a low threshold: if it's even possible, we proceed.
  - *Outcome*: 
    - If NO: Close the matter with no public action. (Record: "The allegation, even if true, does not bear on the reliability of the finding.")
    - If YES: Proceed to Question 2.

  **Question 2: Is there a minimally credible source or evidence supporting the allegation?**
  - *What counts as sufficient*: The source must be identifiable (even if anonymous to the panel) and have some basis for knowing (e.g., a co-author, a reviewer, someone with access to raw data). Or, there must be documentary evidence (e.g., images, data, code) that can be reviewed. Anonymous tips without any supporting evidence are not sufficient.
  - *Source-relative reasons*: The panel must note the source's potential biases or motives (e.g., a former lab member in a dispute) but must not let that automatically disqualify the allegation. The question is only whether the source has a basis for knowing and whether there is any evidence provided. The potential for trouble (e.g., media attention) is irrelevant here.
  - *Judgment call*: Assessing the minimal credibility of the source. This is not about whether the allegation is true, but whether it is not baseless.
  - *Outcome*:
    - If NO: Close the matter with no public action. (Record: "The allegation lacks a minimally credible source or supporting evidence.")
    - If YES: Proceed to Stage 2.

  *Stage 1 Output*: At this point, the panel has determined there is a reason to investigate. This does not imply any reason to doubt the finding.

  ---

  **Stage 2: Assessment of Reliability (Reasons to Doubt)**

  *Objective*: Evaluate whether there is sufficient evidence to reduce confidence in the reliability of the finding. We are only concerned with reasons that bear on the truth of the finding.

  **Question 3: Is there direct evidence that calls the reliability of the finding into question?**
  - *What counts as sufficient*: Evidence that the finding might be false or unreliable, such as:
    - An analytical error that the statistician confirms invalidates the conclusion.
    - Evidence of manipulation (e.g., images, data) that the forensic review or statistician finds persuasive.
    - Inconsistencies in the data that cannot be explained by the authors.
  - *What does not count*:
    - The authors' cooperation (or lack thereof) in providing data.
    - The existence of an allegation or media coverage.
    - The stakes (e.g., the finding is important).
    - The potential damage to the authors.
  - *Judgment call*: The panel relies on the statistician and relevant experts to interpret the evidence. The panel must not let the difficulty of obtaining raw data or the authors' refusal to provide it count as evidence against the finding. Lack of evidence is not evidence of innocence.
  - *Outcome*:
    - If YES: Proceed to Question 4.
    - If NO: Proceed to Question 5.

  **Question 4: Is the evidence of unreliability conclusive?**
  - *What counts as sufficient*: The evidence must be such that, in the judgment of the statistician and the relevant scientific experts on the panel, the finding is more likely false than not, or the error is fatal to the conclusion. This is a higher bar.
  - *Judgment call*: This is a scientific judgment. The panel defers to the statistician and the senior scientists. The attorney ensures that the evidence meets legal standards for defamation (so we can state it).
  - *Outcome*:
    - If YES: The panel has a reason of the right kind to reduce confidence. Proceed to Stage 3.
    - If NO: Proceed to Question 5.

  **Question 5: Is there indirect evidence that the finding is unreliable?**
  - *What counts as sufficient*: Patterns of behavior that suggest unreliability, such as:
    - Multiple allegations of similar practices in the same lab.
    - Prior findings of misconduct by the same authors.
    - Inability to reproduce the finding in multiple independent attempts (if documented).
  - *Laundered reasons*: A prior flag or note by this panel or another body that was issued for reasons of the wrong kind (e.g., to placate a funder) does not count as evidence of unreliability. The panel must disregard such prior actions unless they were based on direct evidence of unreliability at the time.
  - *Judgment call*: Separating genuine patterns from coincidental or laundered ones. The panel must ask: Was the prior action based on direct evidence of unreliability? If not, it should be ignored.
  - *Outcome*:
    - If YES (and the evidence is not laundered): The panel has a reason of the right kind to reduce confidence. Proceed to Stage 3.
    - If NO: The panel has no reason of the right kind to reduce confidence. Proceed to Stage 3 for possible actions based on other reasons (but note: we cannot reduce confidence without reasons of the right kind).

  *Stage 2 Output*: The panel has either:
    - A reason to reduce confidence (if YES at Q4 or Q5 without laundering), OR
    - No reason to reduce confidence (if NO at Q3 and Q5, or if the only evidence is laundered).

  ---

  **Stage 3: Decision on Action**

  *Objective*: Decide what administrative action to take, considering both the outcome of Stage 2 and state-given reasons (costs, benefits, fairness). We now allow state-given reasons to influence the action, but not to influence the judgment of reliability.

  **Question 6: Did Stage 2 find a reason of the right kind to reduce confidence?**
  - *What counts*: Only the outcome from Stage 2.
  - *Outcome*:
    - If YES: The panel must consider an action that reduces confidence (note, retraction, or referral). Proceed to Question 7.
    - If NO: The panel cannot take an action that implies reduced confidence (so no note, retraction, or referral). However, it may still take actions that do not imply doubt (e.g., request materials for archiving). Proceed to Question 8.

  **Question 7 (If YES at Q6): What is the appropriate action to reflect the reduced confidence?**
  - *Options*: 
    - Request materials from authors (if not already done and if feasible).
    - Place a note on the publication record (for errors that do not completely invalidate the paper or when evidence is not conclusive but still concerning).
    - Recommend retraction (for conclusive evidence of fatal error or misconduct).
    - Refer to federal office (for potential misconduct that requires investigation beyond our capacity).
  - *State-given reasons now considered*: The panel may consider:
    - The stakes: High stakes (e.g., clinical guideline) may warrant a stronger action even with the same level of doubt, because the cost of being wrong is higher. But note: the bar for doubt (Stage 2) was not lowered due to stakes.
    - Fairness to authors: The panel may opt for a less severe action if the evidence is not conclusive (e.g., note instead of retraction) to be fair.
    - Damage to junior authors: This may be a reason to anonymize a note or to direct the action at senior authors.
  - *Judgment call*: Weighing the severity of the action against the strength of the evidence and the consequences. The attorney must ensure defamation risk is managed.
  - *Procedure*: The panel votes on the action.

  **Question 8 (If NO at Q6): Is there a state-given reason to take an action that does not imply reduced confidence?**
  - *Options*: 
    - Close with no action.
    - Request materials (for archiving or to respond to public concern, without implying doubt).
  - *State-given reasons*: 
    - Public concern (e.g., media coverage) may warrant requesting materials to show responsiveness.
    - Funder pressure may require some action, but it must not imply doubt.
    - Protecting a junior author (e.g., if they are the complainant) might warrant anonymizing or not taking an action that would harm them unduly.
  - *Important*: The action must not imply reduced confidence. The record must state that the action is taken for administrative reasons and not because of doubts about the finding.
  - *Judgment call*: Deciding whether state-given reasons justify an administrative action.
  - *Procedure*: The panel votes.

  ---

  **Stage 4: Output and Record**

  *Objective*: Generate the two-page recommendation.

  **Procedure**:
  - The minute-taker (you) drafts the record as the procedure runs, using the answers to the questions.
  - The record must explicitly state:
    - The outcome of each stage.
    - The reasons for the action, clearly labeled as either:
      - "Reasons bearing on reliability" (from Stage 2), OR
      - "Administrative reasons" (from Stage 3).
  - The record must not imply that the absence of evidence is evidence of absence.
  - For prior flags that were based on wrong-kind reasons, the panel must not cite them as evidence of unreliability. If such a flag exists in the record of the current case, the panel must note in the current record that the prior flag was not based on evidence of unreliability (if that is the case) and therefore carries no weight in the current assessment.

  ---

  **What the Procedure Cannot Do**:
  1. It cannot eliminate judgment calls. Deciding what counts as "minimally credible" (Q2) or "direct evidence" (Q3) requires judgment.
  2. It cannot prevent state-given reasons from influencing the panel's decisions in Stage 3, but it confines them to the appropriate stage.
  3. It cannot manufacture evidence we do not have. If raw data is unavailable, we cannot base doubt on its absence.
  4. It cannot resolve deep philosophical questions about the nature of group attitudes. The procedure treats the panel's output as a public statement that gives readers reasons of the right kind to revise their attitudes. However, because the statement is public, every reason we state becomes a potential state-given reason for others. To mitigate this, the procedure requires transparency: we label the reasons. This breaks the laundering cycle because we explicitly say when a reason is administrative and not about reliability.
  5. It may systematically mishandle cases where the evidence is highly technical and only the statistician understands it. The panel must rely on the statistician's judgment, which is a vulnerability.
  6. The distinction between attitude-fitting and state-given reasons may run out when the panel must decide on an action in Stage 3. At that point, we are balancing both kinds of reasons, but the procedure ensures that state-given reasons do not contaminate the reliability assessment.

  ---

  **Running the Procedure on Three Files**

  **File One: Anonymous Dossier Alleging Image Manipulation**

  - *Stage 1, Q1*: The allegation (image manipulation) is a potential breach that could affect reliability. YES.
  - *Stage 1, Q2*: The source is a former lab member with a grievance. This is identifiable and has a basis for knowing (was in the lab). The forensic review was inconclusive, but the source provided some evidence (the dossier). This is minimally credible. YES.
  - *Stage 2, Q3*: The forensic review was inconclusive, and the authors provided partial raw data. There is no direct evidence of manipulation. NO.
  - *Stage 2, Q5*: The only indirect evidence is the prior grievance and the media coverage. The prior grievance is not evidence of unreliability; it's a motive. The media coverage is not evidence. The panel must disregard the prior flag (if any) if it was based on wrong-kind reasons. In this case, there is no pattern of similar allegations (unless the prior flag was based on reliability reasons). Without that, NO.
  - *Stage 3, Q6*: NO reason to reduce confidence.
  - *Stage 3, Q8*: Are there state-given reasons to act? The chair wants a note to show responsiveness, and there is media coverage. However, placing a note implies reduced confidence, which we cannot do without reasons of the right kind. The panel may request materials (if not done) or close with no action. But note: the record must not imply doubt. Given the media attention, the panel might vote to request materials (if feasible) for transparency, with a clear statement that this does not imply doubt.

  **File Two: Undisputed Analytical Error in High-Impact Paper**

  - *Stage 1, Q1*: An analytical error is a potential breach. YES.
  - *Stage 1, Q2*: The error was found by a graduate student in the lab (credible source). YES.
  - *Stage 2, Q3*: The statistician says the claim does not follow. This is direct evidence. YES.
  - *Stage 2, Q4*: Is it conclusive? The authors say the conclusion survives. The panel must rely on the statistician. If the statistician says the error is fatal, then YES. If the statistician says the conclusion might still hold with a reanalysis, then NO. (Assume the statistician says it is fatal.) YES.
  - *Stage 3, Q6*: YES. We have reason to reduce confidence.
  - *Stage 3, Q7*: The appropriate action: The error is undisputed and fatal. Retraction is warranted. However, the compliance officer notes that a note (less severe) would trigger a funder review. The panel may consider:
    - The high stakes (clinical guideline) might argue for retraction to prevent harm.
    - The damage to the center: This is a state-given reason, but note that retraction might be the right action for reliability reasons. The panel might opt for retraction and note the funder concern in the record to the Vice Provost.

  **File Three: Laundering Case**

  - *Stage 1, Q1*: The new allegation (whatever it is) is a potential breach. YES.
  - *Stage 1, Q2*: Assume the source is credible. YES.
  - *Stage 2, Q3*: Assume no direct evidence. NO.
  - *Stage 2, Q5*: The new file cites the prior flag by this panel as corroboration. But if the prior flag was issued for wrong-kind reasons (e.g., to placate a funder) without evidence of unreliability, then it is a laundered reason and must be disregarded. The panel must examine the prior file: if the prior flag was issued without evidence of unreliability (only for state-given reasons), then it carries no weight. Without the prior flag, is there any other pattern? If not, then NO.
  - *Stage 3, Q6*: NO reason to reduce confidence.
  - *Stage 3, Q8*: But now, the record of the new file cites the prior flag. The procedure commits us to stating in the current record that the prior flag was not based on evidence of unreliability and therefore should not be considered as evidence in this case. This is required to break the laundering cycle. The panel must also consider: should we correct the prior flag? The procedure does not require that, but it does require that we not use it as evidence. If the prior flag is still publicly implying doubt without basis, the panel may recommend to the Vice Provost that the prior flag be reviewed or rescinded, but that is beyond the scope of this case.

  This commitment is necessary to maintain the integrity of the process. It may be uncomfortable, but the alternative is perpetuating a cycle of laundered reasons.
answer: |-
  ### Research Integrity Review Panel: Decision Procedure for Handling Allegations  
  **Purpose:** To determine whether there are sufficient reasons to reduce confidence in a research finding (reasons of the "right kind"), separate from external pressures, costs, or benefits. Generates a two-page recommendation as a by-product.  
  **Time:** Designed for 90-minute meetings.  
  **Roles:** Chair guides the process; Statistician assesses analytical issues; Minute-taker (you) documents answers; Attorney screens language; All vote when required.  

  ---

  ### Ordered Decision Procedure  
  **Key Distinctions Preserved:**  
  1. **Reliability vs. Cost/Benefit:** Does the evidence undermine the *finding* (right-kind reason), or does it relate to *consequences* of acting (wrong-kind reason)?  
  2. **Investigate vs. Doubt:** Evidence justifying an investigation ≠ evidence justifying doubt.  
  3. **Asymmetry of Evidence:** Lack of proof of misconduct or author cooperation ≠ evidence for confidence.  
  4. **Stakes Flag:** High-impact findings (e.g., clinical guidelines) raise costs of error—but do not lower the bar for doubt.  
  5. **Damage to Authors:** Harm to a junior author’s career is never a reason for confidence.  
  6. **Source Reliability:** A complainant’s motives affect testimony credibility; the trouble they cause (e.g., media) does not affect the finding’s reliability.  
  7. **Laundered Reasons:** Prior panel actions based on wrong-kind reasons carry no evidential weight.  
  8. **Panel’s Output:** The recommendation gives *readers* reasons to revise their confidence; it does not reflect the panel’s "attitude."  

  **Instructions:**  
  - Proceed step-by-step. Stop early if a "NO" answer closes the case.  
  - **Judgment Calls** (JC): Marked where expert input or vote is needed.  
  - **Procedure** (P): Fact-based, mechanical steps.  
  - **Record:** Minute-taker populates the template (Appendix A) in real-time.  

  ---  
  #### **STAGE 1: Should We Investigate?**  
  *Objective: Decide if there’s enough to warrant scrutiny. Answers here do NOT imply doubt.*  

  1. **Q1: Does the allegation describe a specific, integrity-related issue that could affect the finding’s reliability if true?**  
     - *Sufficient Answer:* Allegation must cite a concrete practice (e.g., data manipulation, analytical error, plagiarism) that, if proven, would invalidate the finding.  
     - **P:** Chair reads the allegation aloud. Statistician/compliance officer confirm if the issue could technically undermine reliability.  
     - *Insufficient:* Vague claims (e.g., "method feels flawed"); issues unrelated to reliability (e.g., authorship disputes).  
     - **JC:** Panel votes if unclear (majority rules).  
     - *Outcome:*  
       - NO → Close with no action. Record: "Allegation does not bear on reliability."  
       - YES → Proceed to Q2.  

  2. **Q2: Is there minimally credible evidence or testimony supporting the allegation?**  
     - *Sufficient Answer:* Evidence exists (e.g., images, data, code) OR the source has direct knowledge (e.g., co-author, lab member) — even if anonymous or motivated.  
     - **P:** Statistician/compliance officer verify if evidence is testable (e.g., "The image is available for review").  
     - *Insufficient:* Hearsay; no supporting materials; source has no direct access (e.g., "a colleague heard something").  
     - **Source-Relative Handling:**  
       - Discuss the source’s motives (e.g., "complainant is a former lab member in a dispute") but ONLY to assess testimony reliability.  
       - Ignore external factors (e.g., "media is covering this").  
     - **JC:** Panel votes if credibility is disputed.  
     - *Outcome:*  
       - NO → Close with no action. Record: "Insufficient evidence to investigate."  
       - YES → Proceed to Stage 2.  

  **Stage 1 Output:** Case advances to investigation. Record states: "Allegation warrants scrutiny but does not imply doubt."  

  ---  
  #### **STAGE 2: Is There Reason to Doubt the Finding?**  
  *Objective: Evaluate whether evidence undermines reliability. Ignore costs, benefits, and prior actions.*  

  3. **Q3: Is there direct evidence that the finding is unreliable?**  
     - *Sufficient Answer:* Evidence directly contradicting the finding (e.g., analytical error invalidates the result; forensic proof of manipulation).  
     - **P:** Statistician analyzes evidence (e.g., "The error makes the conclusion statistically invalid").  
     - *Insufficient:*  
       - Authors’ refusal to provide data.  
       - Inconclusive tests (e.g., "forensic review was ambiguous").  
       - Cooperation from authors.  
     - **Asymmetry Note:** Failure to prove misconduct ≠ evidence for confidence.  
     - **JC:** Statistician’s assessment is final. If disputed, panel votes.  
     - *Outcome:*  
       - YES → Proceed to Q4.  
       - NO → Proceed to Q5.  

  4. **Q4: Is the direct evidence conclusive?**  
     - *Sufficient Answer:* Evidence is unambiguous and fatal to the finding (e.g., "The statistician confirms the error invalidates the conclusion").  
     - **P:** Statistician dichotomizes: "Does the evidence definitively undermine the finding?"  
     - **Stakes Flag:** Note if the finding is high-impact (e.g., clinical guideline), but do NOT lower the bar for doubt.  
     - *Outcome:*  
       - YES → Proceed to Stage 3. Record: "Direct evidence reduces confidence."  
       - NO → Proceed to Q5.  

  5. **Q5: Is there indirect evidence of unreliability (e.g., a pattern)?**  
     - *Sufficient Answer:* Multiple, independent incidents (e.g., "Three papers from this lab show similar errors").  
     - **Laundered Reasons:**  
       - Prior panel actions (e.g., flags) based on wrong-kind reasons (e.g., "to placate a funder") carry **no weight**.  
       - If prior action is cited, ask: "Was it based solely on reliability evidence?" If no, ignore it.  
     - **JC:** Panel votes on whether a pattern exists and if it is not laundered.  
     - *Outcome:*  
       - YES (non-laundered) → Proceed to Stage 3. Record: "Pattern suggests unreliability."  
       - NO → Proceed to Stage 3. Record: "No evidence to reduce confidence."  

  **Stage 2 Output:** Either (1) Reason to doubt, or (2) No reason to doubt. Record explicitly states outcome and ignores external factors.  

  ---  
  #### **STAGE 3: What Action Should We Take?**  
  *Objective: Decide on administrative response. State-given reasons (costs/benefits) may influence actions but NOT reliability judgments.*  

  6. **Q6: Did Stage 2 find a reason to doubt?**  
     - **P:** Minute-taker reads Stage 2 outcome.  
     - *Outcome:*  
       - YES → Proceed to Q7.  
       - NO → Proceed to Q8.  

  7. **Q7 (If YES at Q6): What action best reflects the level of doubt?**  
     - **Options:**  
       - Request materials (if missing).  
       - Place a note (for unresolved concerns).  
       - Recommend retraction (for conclusive errors/misconduct).  
       - Refer to federal office (for suspected misconduct).  
     - **State-Given Reasons Allowed Here:**  
       - High stakes may warrant stronger action (e.g., retraction for a clinical guideline error).  
       - Damage to junior authors may justify anonymizing the note.  
     - **JC:** Panel votes on action. Attorney verifies language.  
     - *Record:* State reliability reason + administrative rationale (e.g., "Note placed due to analytical error; junior author name withheld to mitigate career harm").  

  8. **Q8 (If NO at Q6): Is there a state-given reason to act without implying doubt?**  
     - **Options:**  
       - Close with no action.  
       - Request materials (to address public concern without implying doubt).  
     - **Allowed State-Given Reasons:**  
       - External pressure (e.g., media coverage, funder mood).  
       - Protecting a complainant (e.g., graduate student on job market).  
     - **Prohibited:** Actions implying doubt (e.g., note, retraction).  
     - **Damage Check:** Explicitly state: "Career damage to authors is not a reason for confidence."  
     - **JC:** Panel votes.  
     - *Record:* State administrative reason only (e.g., "Materials requested due to public interest; no evidence questions reliability").  

  **Stage 3 Output:** Action decided. Record separates reliability and administrative reasons.  

  ---  
  #### **Limitations of the Procedure**  
  **What It Cannot Do:**  
  1. **Eliminate Judgment Calls:** Assessing "minimal credibility" (Q2) or "conclusive evidence" (Q4) requires expert judgment.  
  2. **Handle Technical Black Boxes:** Relies entirely on the statistician’s assessment of analytical evidence.  
  3. **Resolve Values-Driven Disputes:** High-stakes cases (Q4) may trigger disagreements about "acceptable risk"; these are voted on.  
  4. **Address All Laundering:** Prior wrong-kind actions must be ignored, but the procedure cannot *retract* them automatically.  
  5. **Prevent Reader Misinterpretation:** The public statement may create state-given reasons for readers, but transparency (labeling reasons) mitigates this.  
  6. **Cover All Cases:** Fails systematically when:  
     - Raw data is permanently unavailable.  
     - The field is polarized (expert disagreement).  
     - Evidence is entirely circumstantial.  

  **Where the Distinction Runs Out:**  
  - At Stage 3 (action phase), state-given reasons unavoidably influence decisions. The procedure isolates this to prevent contamination.  

  ---  
  ### Appendix A: Two-Page Record Template  
  **Page 1:**  
  - **Allegation Summary:** [From Q1]  
  - **Investigation Justification:** [Q2 outcome]  
  - **Reliability Assessment:** [Q3–Q5 outcomes, evidence cited]  
  - **Stakes Flag:** [Noted if high-impact; no effect on bar]  

  **Page 2:**  
  - **Action Rationale:**  
    - If doubt found: [Action] due to [reliability reason]. Administrative note: [state-given reason, if any].  
    - If no doubt: [Action] for administrative reasons only: [state-given reason].  
  - **Explicit Disclaimers:**  
    - "No finding of misconduct implies no evidence for confidence."  
    - "Career impacts do not affect reliability judgments."  
    - "Prior panel actions based solely on administrative reasons carry no evidential weight."  

  ---  
  ### Procedure Applied to Three Cases  
  **Case 1: Anonymous Dossier (Image Manipulation)**  
  - **Q1:** YES. Image manipulation could affect reliability.  
  - **Q2:** YES. Source (former lab member) has direct knowledge; dossier provides testable images.  
  - **Q3:** NO. Forensic review inconclusive; partial raw data doesn’t prove unreliability.  
  - **Q5:** NO. Polarization/media coverage aren’t evidence. Prior grievance isn’t a pattern. *Laundering check:* Ignore any prior flags from wrong-kind reasons.  
  - **Q6:** NO → **Q8.**  
    - State-given reason: Media coverage and chair’s request for responsiveness.  
    - Action: Request materials (if feasible) OR close. Record: "Materials requested due to public interest; no evidence reduces confidence."  
  - **Outcome:** No note (implies doubt). Junior author damage irrelevant to reliability.  

  **Case 2: Analytical Error in Clinical Guideline Paper**  
  - **Q1:** YES. Error could invalidate finding.  
  - **Q2:** YES. Graduate student has direct knowledge.  
  - **Q3:** YES. Statistician confirms error invalidates result.  
  - **Q4:** YES. Authors’ defense irrelevant; error is fatal.  
  - **Q6:** YES → **Q7.**  
    - Action: Retraction (reliability reason).  
    - State-given: High stakes (clinical guideline) support strong action. Junior author damage mitigated by anonymizing the note (if possible), but retraction stands.  
    - Record: "Retraction recommended due to analytical error. Error affects clinical guideline; junior complainant anonymized."  
  - **Stakes Flag:** High cost of error noted, but did not lower doubt threshold.  

  **Case 3: Laundering Case (New Allegation, Prior Wrong-Kind Flag)**  
  - **Q1:** YES. Allegation could affect reliability.  
  - **Q2:** YES. Source credible (details case-specific).  
  - **Q3:** NO. Assume no direct evidence.  
  - **Q5:** NO. Prior flag cited, but laundering check: If prior flag was for wrong-kind reasons (e.g., funder pressure), it carries **no weight**. No other pattern exists.  
  - **Q6:** NO → **Q8.**  
    - State-given reason: None compelling (e.g., no media). Action: Close with no action.  
    - **Record Requirement:** Must state: "Prior panel flag [date] was based solely on administrative considerations and carries no evidential weight."  
  - **Commitment:** The procedure forces you to explicitly disown the prior flag’s evidential value in the current record. It does not require rescinding the prior action (which exceeds the panel’s scope), but publicly breaks the laundering cycle.  

  **Final Note:** The procedure delivers uncomfortable truths (e.g., Case 3’s disavowal) but prevents institutional self-corruption. Circulate this document for panel training, with hypothetical exercises.
