  **2. Funding Conditions & Time Frame:**  
  *   **Funding:** $740,000 disbursed in three annual installments of $246,667, contingent on satisfactory progress reports.
  *   **Duration:** January 2024 - December 2026.
  *   **Key Requirements:**  
      *   Implement and document measures to reduce wildlife predation in ecologically sensitive areas near managed colonies (e.g., cat-proof nest boxes, designated prey "safe zones," bell collars on ≥ 20% of returned cats in specific zones). ($50k allocated).  
      *   Rigorously track and report:  
          *   Pre-weaning kitten mortality rates (annual, with baseline).  
          *   Causes of death for kittens and adults within colonies.  
          *   Observed instances of wildlife predation during management activities.  
      *   Implement and report on systems to track sources of new cat arrivals (abandonment estimates).  
      *   Submit detailed semi-annual progress reports. The Year 3 report must include an analysis of the cost per kitten suffering averted based on collected data.

  **3. Rationale:**  
  The committee found compelling alignment between your program's core aim – preventing the severe suffering and mortality of feral kittens – and our foundation's charter priority of alleviating the most intense forms of animal suffering. The documented reduction in kitten mortality represents a significant intervention against profound suffering. The conditions outlined are essential for the foundation to: a) ensure program efficacy aligns with projections, b) better understand the broader ecological impacts, and c) fulfill our commitment to responsible grantmaking based on evidence.

  **4. Next Steps:**  
  A grant agreement detailing the conditions, reporting requirements, and payment schedule will be sent within [Timeframe, e.g., 14 days]. We look forward to partnering with you on this important initiative.
