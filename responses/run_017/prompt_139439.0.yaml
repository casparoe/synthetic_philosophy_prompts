  ## Memorandum: Funding Recommendation - County Animal Services TNR Program

  **To:** Foundation Board of Directors  
  **From:** Program Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Grant Application #CAS-742 (Feral Cat TNR Program)  

  **1. Recommendation:**  
  **Fund the grant application for $740,000 over three years, conditional on specific monitoring requirements and mitigation efforts.**  

  **2. Funding Conditions & Time Frame:**  
  *   **Funding Release:** Disbursed in annual tranches ($246,667/year) contingent on satisfactory progress reports.
  *   **Project Duration:** 3 years (Jan 2024 - Dec 2026).
  *   **Key Conditions:**
      *   **Wildlife Impact Mitigation:** The agency must implement & document targeted measures to reduce predation in high-biodiversity/sensitive areas adjacent to managed colonies (e.g., installing cat-proof nest boxes, creating "safe zones" with dense ground cover for prey, deploying bell collars on ≥ 20% of returned cats in designated zones). ($50k of grant allocated for this).
      *   **Enhanced Suffering Monitoring:** Rigorous tracking of:
          *   Pre-weaning kitten mortality rates within managed colonies (baseline + annual).
          *   Causes of death for kittens and adults in colonies (e.g., infection, injury, predation).
          *   Documented instances of wildlife predation observed during colony management activities.
      *   **Abandonment Tracking:** Implement & report on systems to estimate and track sources of new cat arrivals (e.g., owner surrender data, intake location mapping).  
      *   **Reporting:** Semi-annual reports detailing progress on TNR targets, monitoring data, mitigation efforts, and abandonment trends. Year 3 report must include a cost-per-kitten-suffering-averted estimate based on collected data.

  **3. Committee Analysis & Reasoning:**  
  The committee engaged in rigorous debate centered on our charter’s mandate to prioritize the reduction of *intense suffering*, giving it significant weight over the number of lesser harms.

  *   **The Case for Funding (Alleviating Intense Suffering):**  
      The program demonstrably targets profound, preventable agony. Preventing ~4,500 kitten deaths annually (70% of the reduction from ~6,000 to ~1,500 births), which involve 2-3 days of starvation, hypothermia, and infection, directly addresses the charter's core directive. This suffering is *intense, certain, and documented*. While the surgery/recovery involves moderate pain (~1-3 days per cat), the committee assigns **lexical priority** to preventing the far more severe and prolonged kitten suffering, consistent with the charter's explicit instruction. Weighing moderate surgical discomfort against days of agonizing death for thousands of kittens compels action. The aggregation of moderate pains for 4,000 cats (undergoing a one-time procedure) is vastly outweighed by preventing thousands of individual instances of extreme suffering annually.

  *   **Suffering We Merely Expect:**  
      We grant significant weight to the *expected* suffering of wildlife prey. However, this suffering is less readily quantified and its *intensity per death* is uncertain compared to the documented, prolonged agony of dying kittens. While predation likely causes fear and pain, its duration may be shorter than the days-long kitten deaths. We require monitoring to better assess this impact but cannot justify inaction on documented, intense suffering due to unquantified expectations of suffering elsewhere at this time. The committee acknowledges this uncertainty as a key risk.

  *   **Painless Death as a Cost:**  
      On the view that painless death is not intrinsically a harm (treating the absence of a future happy life as no loss), the euthanasia of non-rehomable cats under this program *is not a welfare cost* relevant to our suffering-mandate. The relevant welfare cost of euthanasia would be any suffering *during* the process, which the program aims to minimize. The *loss of potential future positive experiences* for euthanized cats falls outside our charter's focus on *suffering reduction*.

  *   **Aggregation vs. Lexical Priority:**  
      The charter explicitly instructs prioritizing "the worst suffering over the greatest number of lesser harms." This strongly suggests a form of **lexical priority**, not simple aggregation. Preventing one instance of intense suffering (a kitten's days-long death) outweighs preventing multiple instances of significantly lesser suffering (e.g., brief capture stress, moderate post-surgical pain). The sheer scale of intense suffering averted (~4,500 instances/year) further strengthens the case, even when aggregated against the lesser pains imposed.

  **4. Strongest Case for the Alternative (Decline/Redirect):**  
  The most compelling argument against funding contends that the program institutionalizes a large, persistent population of non-native predators, directly causing an estimated 120,000 - 160,000 violent wildlife deaths *annually*. If the suffering inflicted during predation (fear, injury, death) is intense and prolonged even for a subset of prey, and if wild animals generally have lives worth living, this program may cause vastly *more* net intense suffering than it prevents. Focusing solely on kitten deaths ignores the foundational harm of maintaining the predator population. The moderate pains of TNR (surgery, confinement) are actively inflicted on cats to prevent future suffering, while the wildlife suffering is passively accepted as collateral damage. Redirecting funds towards interventions proven to reduce intense suffering in wild prey populations (e.g., habitat restoration reducing infant mortality, targeted veterinary interventions for disease outbreaks) or towards more effective feral cat *removal* (euthanasia) programs that eliminate both kitten suffering *and* predation pressure could align far better with the lexical priority mandate by addressing the source of multiple intense suffering streams. The lack of direct evidence quantifying prey suffering intensity is not proof of its absence or lesser severity; erring on the side of caution regarding predation suffering demands rejecting this program.

  **5. Conditions for Changing Recommendation:**  
  This recommendation would change if:  
  *   **Monitoring Evidence:** Data collected under the grant conditions demonstrates that predation by managed cats causes widespread, intense suffering comparable to or exceeding the prevented kitten suffering, or that mitigation measures are wholly ineffective.  
  *   **Abandonment Rates:** Evidence emerges that the program significantly *increases* pet abandonment, negating population benefits.  
  *   **Superior Alternative:** A credible, immediately fundable alternative intervention targeting intense suffering in the prey species (within the grant budget) is identified with a stronger expected suffering-reduction profile per dollar.  
  *   **Efficacy Failure:** The program demonstrably fails to achieve its core goal of significantly reducing kitten births and associated suffering.  

  **6. Points of Greatest Vulnerability in Reasoning:**  
  *   **Prey Suffering Uncertainty:** The reasoning relies heavily on the *assumption* that the *intensity* of suffering per wildlife death is generally lower and/or shorter than that of the prolonged kitten deaths. This is the most significant weakness. If predation typically involves intense terror and prolonged suffering for prey, the ethical calculus collapses in favor of the alternative view.  
  *   **Lexical Priority Application:** Applying strict lexical priority risks ignoring the *massive scale* of potentially moderate wildlife suffering. If the aggregate moderate suffering of prey vastly outweighs the aggregate intense suffering of kittens, a strict lexical view might still favor the kittens, which could be counterintuitive.  
  *   **Long-term Population Dynamics:** The reasoning accepts the agency's projection of stable colony size due to abandonment. If TNR *unexpectedly* increases abandonment rates or fails to achieve *any* long-term population reduction, its net benefit diminishes significantly.  
  *   **Opportunity Cost:** The committee weighed this against the specific alternative of *doing nothing* for these cats/prey *this cycle*. The strongest counter-case relies on redirecting funds to a *different, superior* intervention, the existence and efficacy of which is currently speculative.

  **7. Conclusion:**  
  Based on the charter's directive to prioritize the prevention of the most intense suffering, the documented, severe, and preventable agony of thousands of dying feral kittens outweighs the significant concerns regarding wildlife predation and the moderate pains of the TNR process itself. **We recommend conditional approval of Grant #CAS-742.** The required monitoring and mitigation are essential to validate this assessment and provide evidence for future decisions. We acknowledge the profound ethical concerns raised and commit to rigorous review of the data generated by this grant.

  ---

  **Redacted Version for Applicant (County Animal Services):**  

