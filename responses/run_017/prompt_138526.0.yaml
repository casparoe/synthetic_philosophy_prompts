answer: |-
  ### The Branching Questions
  1. **Spinning Coin (Initial Conditions Sensitivity):** *"If we recorded a coin spinning on marble to infinite precision and recreated those exact conditions, would it land identically?"*  
     → **Yes** (deterministic core) / **No** (indeterminism at macro scale)  

  2. **Pendulum Re-run (Chaos vs. Noise):** *"A pendulum’s swing was recorded to 6 decimals. Re-run identically, it diverges slightly. Is this due to...?"*  
     → **Unmeasured micro-forces** (sensitive dependence) / **Fundamental randomness** (indeterminism)  

  3. **Three-Week Forecast (Practical Limits):** *"Could a flawless model with perfect current data predict global weather at 21 days?"*  
     → **Yes** (computable determinism) / **No** (chaos/computational irreducibility)  

  4. **Seizure Device (Short-Term Predictability):** *"Does the implanted sensor that warns seconds pre-seizure prove the brain’s near-future states are fixed?"*  
     → **Yes** (local determinism) / **No** (emergent unpredictability)  

  5. **Job Choice (Agent Exemption):** *"When your friend weighs two job offers, is her final choice pre-determined by her prior brain states?"*  
     → **Yes** (no agent exemption) / **No** (agency breaks causal chains)  

  6. **Harvest Forecast (Self-Reference):** *"When the Academy’s forecast changes farmers’ planting, does this invalidate the original prediction?"*  
     → **Yes** (self-undermining) / **No** (feedback loop manageable)  

  7. **Death Prognosis Attempt (Control):** *"Can someone who reads their death prognosis and fights to defy it possibly succeed?"*  
     → **Yes** (future alterable) / **No** (future fixed)  

  8. **Aggregate Stability (Statistical Order):** *"Can epidemic forecasts be highly accurate for populations while useless for individuals?"*  
     → **Yes** (order ≠ predictability) / **No** (aggregates imply determinism)  

  9. **Perfect Instrument (Epistemic Access):** *"If an instrument measured all current particle states flawlessly, could it compute the future?"*  
     → **Yes** (inferable) / **No** (fundamentally unknowable)  

  10. **Regret’s Foundation (Openness Requirement):** *"Is your regret over a past choice irrational if the outcome was inevitable?"*  
      → **Yes** (requires genuine openness) / **No** (epistemic openness suffices)  

  11. **Relativity of Futures (Temporal Ontology):** *"Does 'next Tuesday’s weather' lack definite truth-value until Tuesday?"*  
      → **Yes** (future indeterminate) / **No** (future fixed)  

  ---

  ### The Space Before the Names  
  The 11 binary questions generate 2,048 theoretical combinations. Constraints prune this:  
  - **Q1 "No"** eliminates hard determinism paths.  
  - **Q5 "No"** requires **Q7 "Yes"** (else agency is trivial).  
  - **Q10 "Yes"** requires **Q7 "Yes"** (genuine control needed for regret).  
  - **Q8 "Yes"** + **Q3 "No"** implies statistical order ≠ determinism.  
  Only **14 coherent combinations** emerge. Key axes:  
  - *Fixity*: Q7 "No" + Q11 "No".  
  - *Inferability*: Q9 "Yes" + Q3 "Yes".  
  - *Control*: Q7 "Yes" + Q5 "No".  
  - *Unpredictability sources*: Q2 (chaos vs. randomness), Q6 (self-reference), Q3/Q9 (computational limits).  

  ---

  ### The Tree with Named Leaves  
  1. **Hard Determinism (Block Universe):** Q1Y, Q2a, Q3Y, Q4Y, Q5Y, Q6N, Q7N, Q8N, Q9Y, Q10N, Q11N.  
     *Awkward commitment: "Your struggle to change your prognosis is as fixed as the prognosis itself."*  

  2. **Chaotic Determinism:** Q1Y, Q2a, Q3N, Q4N, Q5Y, Q6N, Q7N, Q8Y, Q9N, Q10N, Q11N.  
     *Awkward commitment: "The harvest forecast is 'true' but useless; the model is perfect yet always wrong in practice."*  

  3. **Uncomputable Determinism:** Q1Y, Q2a, Q3N, Q4Y, Q5Y, Q6N, Q7N, Q8Y, Q9N, Q10N, Q11N.  
