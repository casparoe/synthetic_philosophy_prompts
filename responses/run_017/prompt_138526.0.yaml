  5. **Classical Compatibilism:** Q1Y, Q2a, Q3Y, Q4Y, Q5Y, Q6N, Q7N, Q8N, Q9Y, Q10N, Q11N.  
     *Awkward commitment: "You are 'free' because no one forced you, even if you couldn’t have chosen otherwise."*  

  6. **Event-Causal Libertarianism:** Q1N, Q2b, Q3N, Q4N, Q5N, Q6Y, Q7Y, Q8Y, Q9N, Q10Y, Q11Y.  
     *Awkward commitment: "Your choice emerges from random neural noise, yet it’s authentically 'yours'."*  

  7. **Agent-Causal Libertarianism:** Q1Y, Q2a, Q3Y, Q4N, Q5N, Q6Y, Q7Y, Q8N, Q9Y, Q10Y, Q11Y.  
     *Awkward commitment: "Your soul intervenes in physics at the job choice, violating energy conservation."*  

  8. **Indeterministic Unfreedom:** Q1N, Q2b, Q3N, Q4N, Q5Y, Q6Y, Q7N, Q8Y, Q9N, Q10N, Q11Y.  
     *Awkward commitment: "The death prognosis fails only if quantum dice roll in your favor—not from effort."*  

  9. **Statistical Determinism:** Q1Y, Q2a, Q3N, Q4Y, Q5Y, Q6N, Q7N, Q8Y, Q9N, Q10N, Q11N.  
     *Awkward commitment: "Epidemics are predictable, people are not; individuals don’t matter."*  

  10. **Epistemic Openness (Compatibilist Variant):** Q1Y, Q2a, Q3Y, Q4Y, Q5Y, Q6N, Q7N, Q8N, Q9Y, Q10N, Q11Y.  
      *Awkward commitment: "Deliberation matters because you don’t know your fate, even though it’s sealed."*  

  11. **Narrative Openness:** Q1Y, Q2a, Q3Y, Q4Y, Q5Y, Q6N, Q7N, Q8N, Q9Y, Q10N, Q11Y.  
