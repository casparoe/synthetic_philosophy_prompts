  - **Unclaimed:** Q1N + Q3Y (Macro-indeterminism yet perfectly computable macro-futures).  
  - **Unclaimed:** Q4Y + Q3N (Seizure predictable but weather not, despite both physical).  

  ---

  ### Where the Tree Cannot Separate  
  - **Chaotic Determinism vs. Uncomputable Determinism:** Both answer identically except at Q4 (seizure device). Chaotic determinism denies short-term predictability (Q4N), uncomputable determinism allows it (Q4Y).  
  - **Event-Causal vs. Agent-Causal Libertarianism:** Identical answers; differ only in *how* agency operates (emergent vs. fundamental).  
  - **Narrative Openness vs. Epistemic Openness:** Identical answers; differ in *why* ignorance matters (aesthetic vs. psychological).  

  ---

  ### Casting Note  
  The optimal single-node disagreement is **Q6 (Harvest Forecast Self-Reference)**. Two characters who agree the future is fixed (Q7N) and uncontrollable (Q5Y) could vehemently clash here: one insists self-reference makes forecasting *incoherent* (Q6Y), the other claims models can *absorb feedback* (Q6N). This forces debate about the Academy’s legitimacy using in-world stakes (crop yields), without philosophy jargon. Their identical beliefs elsewhere (e.g., regret is irrational: Q10N) make this lone divergence stark and personal.
