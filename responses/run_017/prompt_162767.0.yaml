answer: |-
  Here is the translation and residue report for your counterfactual-class rating scheme against luck egalitarianism, structured as requested:

  ---

  ### **1. Translation: Luck Egalitarianism in Actuarial Vocabulary (700 words)**  
  **Core Commitment as Risk Allocation**  
  Luck egalitarianism (LE) treats justice as the separation of loss costs into two pools:  
  - **"Brute Luck" Pool (Unchosen)**: Compensable losses from immutable traits (e.g., genetic illness, birth disadvantages). Analogous to **community-rated coverage** for risks where risk classification is banned (e.g., genetic data in some jurisdictions).  
  - **"Option Luck" Pool (Chosen)**: Non-compensable losses from voluntary risks (e.g., smoking, extreme sports). Treated as **individually risk-rated exposure**, priced via GLMs using permissible "choice proxies" (e.g., occupation codes).  

  **Currency Debate ≈ Rating Variable Legitimacy**  
  LE’s internal fight over "currency" (e.g., resources, welfare) mirrors debates over **admissible rating variables**:  
  - *Resource-focused LE* (Dworkin): Uses hypothetical insurance markets to define compensable brute luck. Acts like a **regulator approving rating variables** based on "objective" counterfactuals (e.g., "Would a rational applicant buy coverage for this risk ex-ante?").  
  - *Welfare-focused LE*: Prioritizes outcomes over resources. Resembles **loss-ratio optimization** that overrides risk classification to meet social targets (e.g., capping premiums for chronic conditions).  

  **Operationalizing LE: Your Counterfactual-Class Scheme**  
  Your dual-reference-class system directly mirrors LE’s structure:  
  - **Actual Risk Class**: Current observed risk (e.g., disability claim probability based on age, job, smoking).  
  - **Counterfactual "Neutral" Class**: Risk absent voluntary choices (e.g., non-smoker, sedentary job). Computed via **credibility-weighted covariates**, excluding "choice flags" (e.g., BMI >30 only if linked to non-voluntary causes).  
  - **Pricing & Funding**:  
    - *Unchosen Loss Cost*: Expected loss from counterfactual class → **community-rated pool**, funded by **general revenue reinsurance** (taxes).  
    - *Chosen Excess Loss*: Differential vs. actual class → **risk-loaded premium** (e.g., smoker surcharge).  
  - **Claims True-Up**: At loss occurrence, **apportion liability** between pools. Example: Disability claim investigated for "choice fraction" (e.g., if injury linked to voluntary skydiving, chosen pool pays 70% via premium recoupment; unchosen pool covers 30% via reinsurance).  

  **Critics’ Objections in Actuarial Terms**  
  1. *Intrusiveness/Demeaning*: **Claims auditing** for "choice responsibility" resembles **fraud investigation** but targets moral culpability instead of material misrepresentation. Risk of **differential claims handling** (e.g., lifestyle audits for low-income claimants).  
  2. *Leveling-Down*: LE permits reducing all to minimum welfare if equality isn’t achievable. Like **mandated loss-ratio floors** forcing insurers to cover unprofitable pools without subsidies, worsening outcomes for all.  

  ---

  ### **2. Distortions: Where the Translation Bends Philosophy (300 words)**  
  - **Moral Hazard ≠ Chosen Disadvantage**: Moral hazard is *behavioral response to insurance* (e.g., overusing care). LE’s "chosen disadvantage" is *ex-ante responsibility attribution*. Your scheme conflates them by loading premiums on "choices," but LE cares about *fairness*, not deterrence.  
  - **Adverse Selection ≠ Leveling-Down**: Critics say LE *allows* leveling-down; adverse selection is its *market consequence*. In your scheme, if low unchosen-risk policyholders exit due to cross-subsidies, the pool collapses—but LE doesn’t *require* this; it’s a design flaw.  
  - **Dworkin’s Hypothetical Market**: His "insurance auction" is a **thought experiment to define brute luck**, not an actuarial blueprint. Translating it as a real pricing tool (e.g., using surveys to set counterfactuals) imposes **empirical assumptions** on normative philosophy.  
  - **Compensation ≠ Indemnity**: LE compensates for *unchosen disadvantage* as justice. Your "unchosen pool" pays claims but lacks a **moral repair mechanism**; it’s financial transfer, not acknowledgment of unfairness.  

  ---

  ### **3. Residue: What Insurance Vocabulary Cannot Capture (Bullets, 350 words)**  
  Insurance language lacks terms for:  
  | **Philosophical Concept**       | **Actuarial Gap**                                                                 |  
  |---------------------------------|-----------------------------------------------------------------------------------|  
  | **Desert vs. Incentive**        | Risk-loading incentivizes behavior; LE assigns *blame* for choices. No pricing tool captures "deserved suffering." |  
  | **Intrusiveness as Harm**       | Claims audits protect against fraud; LE critics see *moral judgment* itself as demeaning—even if accurate. |  
  | **Equality of Status**          | Leveling-down objections highlight dignity/equality concerns. Actuarial "loss-ratio fairness" is purely financial. |  
  | **Brute Luck ≠ Uninsurable Risk**| LE’s "unchosen" includes social contingencies (e.g., bad parents). Insurers exclude these as **unquantifiable systemic risk**. |  
  | **Hypothetical Voluntariness**  | Your counterfactual class requires defining "true choice." Actuarial models use *observables* (e.g., "smoker" flag), not philosophical voluntariness. |  

  ---

  ### **4. Verdict on Counterfactual-Class Rating**  
  Your scheme **permits but does not imply** luck egalitarianism. It is a *technically coherent* implementation but distorts LE by:  
  - Reducing "justice" to financial allocation, ignoring non-material harms (e.g., stigma).  
  - Treating Dworkin’s hypothetical market as an actuarial tool.  

  **Key Design Change for Fidelity**: Replace **general revenue funding** with a **solidarity-pool levy on all policyholders**. This avoids leveling-down (taxpayers aren’t forced to subsidize) and mirrors LE’s emphasis on *shared responsibility* for brute luck.  

  **Critical Flaw**: The **claims true-up** process risks replicating LE’s intrusiveness objection. To mitigate, limit audits to *objective choice markers* (e.g., drug tests) and exclude normative judgments (e.g., "should have quit smoking").  

  ---

  ### **Summary Translation Key**  
  | **Luck Egalitarianism**       | **Actuarial Equivalent**                     |  
  |-------------------------------|----------------------------------------------|  
  | Brute luck                    | Community-rated pool                         |  
  | Option luck                   | Risk-loaded premium                          |  
  | Currency debate               | Legitimate rating variables                  |  
  | Hypothetical insurance (Dworkin) | Reference-class counterfactual            |  
  | Intrusiveness objection       | Invasive claims audits                       |  
  | Leveling-down objection       | Adverse selection draining the pool          |  
  | **Uncaptured Residue**        | **Absent Concept**                           |  
  | Moral desert                  | Incentive structures                         |  
  | Compensatory justice          | Indemnification                              |  

  Your vocabulary *excels* at allocating costs but *fails* at moral reasoning—which is the point where insurance ends and philosophy begins.
