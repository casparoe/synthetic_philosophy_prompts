prompt: |-
  I've spent about six years as a pricing actuary, mostly individual health and disability cover, so the vocabulary I actually think in is risk classification, GLMs and credibility weighting, community rating vs risk rating, guaranteed issue, adverse selection, moral hazard, claims investigation and fraud flags, loss ratios, a reinsurance layer sitting on top of the pool, and the regulatory side of rate filing — including the endless question of which rating variables are banned and which proxies are quietly doing the same job. My partner is writing a political-theory PhD and tried to explain luck egalitarianism to me over dinner the other night; I think I half get it, the rough idea being that justice wants how well off you are to be fixed by the choices you made and not by the unchosen stuff, so unchosen disadvantage gets compensated and chosen disadvantage is left to bite. I've been kicking around a rating scheme of my own — call it counterfactual-class rating — and I want to know whether it's secretly the same view wearing a suit: score every policyholder against two reference classes, the one they're actually in and the one they'd have occupied under a counterfactual where they made none of the choices we're willing to count as voluntary; put the unchosen part of expected loss into a community-rated pool topped up from general revenue, reinsurance style; load the excess expected loss traceable to their own choices onto them individually. I'd also want a claims-stage true-up that apportions a realised loss between the chosen and unchosen fraction instead of just paying it.

  So: restate luck egalitarianism in my vocabulary as faithfully as you can — the core commitment, its main internal fight about what the currency even is, and the two things my partner says the critics press hardest: that deciding who deserves help by auditing whether their misfortune was their fault is intrusive and demeaning, and that the view seems fine with levelling everyone down to the worst-off level for no one's benefit. Then give me the residue report. Is moral hazard the same thing as chosen loss being allowed to bite, or does it only look like it because both care about behaviour response? What does adverse selection do to a scheme like mine once the people with clean unchosen risk realise they're cross-subsidising and walk? Does the demeaning part have any counterpart at all in pricing language, or is that the moment insurance vocabulary simply runs out? Where the translation fails I want to know whether it's because my vocabulary is missing something — I suspect it has no way to distinguish indemnity from compensation, or incentive from desert — or because the philosophers' claim was thinner than it sounds. Also: my friend swears one of the original versions of this family of views was literally set up as a hypothetical insurance market (Dworkin? I might be mangaling that), and I can't tell whether that's an accident of framing or a hint that the view is quietly actuarial all the way down. Please keep the translation honest — if the only way to render some claim is to import an actuarial assumption, flag it as a distortion instead of passing it off as translation.

  Give me four sections, in this order: "Translation" (about 700 words, the position in my terms, working through the risk-classification and true-up machinery), "Distortions" (about 300 words, the claims that only fit if you bend them), "Residue" (about 350 words, what cannot be said in pricing language at all — a short table or bullets are fine here), and "Verdict on counterfactual-class rating" (about 250 words: does the view imply it, merely permit it, or is it a distortion, and what single design change would make it more or less faithful).
