prompt: |-
  Not sure this is quite the right corner of philosophy to ask in, but here goes. I'm finishing a PhD in systems neuroscience (mouse visual cortex, mostly chronic recordings, a bit of modelling on the side), and I keep running into a kind of case where I have no idea what to say about function — and I'd like to know whether the thing I keep noticing already has a name, or whether I'm carving up something nobody's bothered to separate out.

  Three instances, then what I think they share. (1) You immunize a mouse with some synthetic molecule that has never existed anywhere in the history of the planet; a few weeks later the animal is full of cells churning out antibodies that bind it, because the cells whose receptors happened to bind it got told to divide and mutate some more and the ones that didn't got nothing. Everyone in the lab says, without any hesitation at all, that the function of those antibodies is to bind that molecule, and if a mutation wrecked the binding we'd say they weren't doing their job, that they were malfunctioning — but there's no selection history behind this at the level of the species or even of the animal's ancestry, the whole thing is weeks old and happened inside one individual. (2) During the critical period in visual cortex, neurons compete in a use-dependent way; the ones that get driven by the statistics of whatever the animal actually grew up looking at keep and strengthen their connections, the underdriven ones lose out. My lab says these neurons are "for" the contour statistics of that particular upbringing. Again: variation, differential retention keyed to what the variants actually do, timescale of weeks, inside one animal. (3) A case I think might be different but I can't say why: a bacterium starts making an enzyme only once the relevant sugar shows up. There's no variation-and-retention story at all, just a switch, and yet "the function of the enzyme is to break down the sugar" seems fine and also seems like it's doing something totally different from (1) and (2). What I think (1) and (2) share is a selection-ish process running on a timescale shorter than a generation, and I've been writing "somatic selected-function" in my own notes, which is either already a term of art I don't know or just a bad label.

  So: does this have an established name, and if several established concepts are near it, which fits best and how exactly does it differ from the others? I've read a bit of the debate between the people who say a function is what the thing was selected for and the people who say it's what the thing currently contributes to some capacity of the system it's in (etiological and causal-role, I think they're called?) — but I specifically don't want a bare label, I want the carving. In particular: is this just the causal-role account plus a causal story about how the role got there, or does the within-lifetime history have to be doing real work, e.g. for malfunction attributions? Is it a different thing from co-option/recycling of an old trait for a new use (feathers, the panda's wrist bone), from byproducts, from vestigial leftovers, and from traits that are still around because selection used to like them but doesn't anymore? And one case I want a direct verdict on: if within-lifetime variation-and-retention is enough to ground functions, then a tumour is also a within-lifetime selection process with heritable variation in a cell lineage, so do the traits of a tumour cell get "functions" — or is that a reductio that shows my whole category is a mistake? Please actually commit rather than laying out the options: tell me what you think the right answer is and why, say whether (1) and (2) are even the same phenomenon, and then tell me which part of your answer you're least confident about and what would change your mind, since I'm presenting this at journal club on Thursday and I'd much rather have a definite claim I can argue with than a balanced overview.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a systems neuroscience PhD student working on mouse visual cortex, dealing with chronic recordings and modeling. They've encountered a conceptual problem regarding function attribution in three scenarios: adaptive immunity, critical period plasticity in neurons, and bacterial enzyme induction. The core issue is whether the within-lifetime selection processes in the first two cases justify assigning "function" in a way that's distinct from traditional etiological or causal-role theories.

  First, I need to recall the main philosophical theories of function. Etiological theories (like Millikan's) base function on evolutionary history and natural selection. Causal-role theories (like Cummins') focus on current contributions to system capacities. The user points out that in adaptive immunity and neural plasticity, there's variation, differential retention based on performance, but on a somatic timescale—within an organism's lifetime. The bacterial example lacks variation-selection, just a switch, yet function attribution seems straightforward. 

  The user’s term "somatic selected-function" seems apt. I should check if there's existing terminology. Godfrey-Smith’s "Darwinian populations" comes to mind—he discusses varying degrees of selection processes, possibly including somatic cases. Maybe "somatic selection" or "intra-organismic selection" are terms used elsewhere. The user also raises a crucial test case: tumors. If somatic selection grounds function, does a tumor cell’s trait have a function? That could be a reductio, so I need to address why tumors might not count, perhaps due to lack of persistence-maintenance or harm to higher-level systems.

  Next, I need to determine if (1) and (2) are the same phenomenon. Both involve variation, heritability (clonal expansion for immune cells, synaptic strength for neurons), and differential retention based on performance (antigen binding, neural activity). The bacterial case is different—no variation, just regulation. So (1) and (2) share somatic selection, while (3) is a programmed response. 

  For malfunction attributions, the history matters. In somatic selection, a mutation that prevents antibody binding is a malfunction because the somatic process selected for binding. In contrast, the bacterial enzyme’s function relies on evolutionary history. The tumor case: somatic selection occurs, but the traits serve no higher-level function; they’re parasitic. So function requires contributing to a broader system’s persistence—organismal in (1) and (2), but not in tumors.

  The user wants a definitive stance. I should argue that somatic selected-functions are real, distinct from both etiological and causal-role. Etiological requires evolutionary history; causal-role lacks historical constraints. Somatic selection provides a minimal historical basis within the organism. This avoids the tumor reductio by requiring that the function contributes to the relevant system's persistence. 

  I’m least confident about the persistence criterion. Defining "persistence" might be tricky. If the visual cortex stabilizes circuits during critical period, that’s persistence. Immune memory persists for future threats. Tumors don’t support organismal persistence. But what if a benign tumor had a trait aiding its growth without harming the host? Still, it doesn’t contribute to the host's functions. Evidence changing my view would be somatic processes that are selected but harmful being called functional, which seems counterintuitive.

  For the journal club, emphasize that somatic selected-functions are a valid category, using Godfrey-Smith’s framework. Commit to the stance that (1) and (2) are the same, (3) is different, and tumors don’t have functions due to lacking systemic contribution. Highlight the importance of minimal selection history for malfunction attributions, distinguishing it from mere causal roles.
answer: |-
  You've hit a fascinating and under-discussed problem at the intersection of biology and philosophy of function. **Yes, (1) and (2) represent a distinct phenomenon I'll call "Somatic Selection Functions" (SSFs), and this category *is* meaningfully different from both standard etiological functions (like your enzyme in (3)) and bare causal-role functions.** Here's the carving, the verdict, and the uncertainties.

  ### The Core Argument: SSFs are a Minimal Historical Kind
  1.  **Defining SSF:** A trait T in system S has a *somatic selection function* F if:
      *   There is **heritable variation** in T-like traits within a *somatic* lineage/population in S.
      *   There is **differential retention/persistence** (survival, replication, strengthening, stabilization) of specific variants *because* they performed activity A better than alternatives.
      *   This differential retention **explains the current presence/prevalence** of T performing A in S at this time.
      *   The **"because" is causal-historical:** The past performance of A by ancestral variants in the somatic lineage *caused* their retention, leading to T's current presence and activity. (This is the key distinction from causal-role accounts).

  2.  **Applying the Carving:**
      *   **(1) Antibodies: SSF YES.** Variant B-cells exist (heritable variation via mutation/proliferation). Binding the novel antigen causes clonal expansion & affinity maturation (differential retention *because* of binding performance). This explains why *these specific high-affinity antibodies* are present now. Their function (binding X) is grounded in this somatic selection history.
      *   **(2) Visual Cortex Wiring: SSF YES.** Variant synaptic strengths/patterns exist (heritable variation at the synaptic/circuit level via activity-dependent plasticity rules). Synaptic connections driven by specific input statistics are strengthened/persist, while others weaken (differential retention *because* of their response to the inputs). This explains the current circuit structure's tuning. Its function (processing contour stats Y) is grounded in this somatic selection history.
      *   **(3) Bacterial Enzyme: SSF NO, Etiological Function YES.** No variation-and-retention process for *this enzyme instance*. The gene/enzyme system is a pre-programmed switch honed by evolutionary selection *for* breaking down sugar Z. Its function is etiological (selected over generations). The induction mechanism is part of its evolved function, not a somatic selection process *creating* a new function.
      *   **Tumors: SSF YES, but Function Attribution? NO (or NOT USUALLY).** Tumor cell lineages *do* undergo somatic selection: heritable variation (mutations), differential retention/survival/proliferation *because* of traits conferring growth/survival advantages (evading immune system, angiogenesis). This explains the prevalence of those traits *in the tumor*. **However, this does *not* mean we should attribute "functions" *to the tumor traits* in the same way we do for antibodies or neural circuits.** Why? **Contextual Harm & Lack of Systemic Integration:** The SSF process exists *within* the tumor lineage, but the traits selected (e.g., rapid proliferation, evasion) actively *harm* the higher-level system (the organism) and are not integrated into its self-maintenance or goal-directed activities. They are "functional" *for the tumor's persistence* (a parasitic pseudo-organism), but not *for the organism*. Attributing "function" here feels wrong *precisely because* the process is destructive to the encompassing system we care about. This isn't a reductio against SSFs; it highlights that function attribution requires specifying *for which system* and often implies a *beneficial contribution* to a persisting, organized system. The tumor's SSFs serve its *own* persistence at the expense of the host organism's.

  ### How SSFs Differ from Related Concepts
  *   **Causal-Role Functions:** Cummins' account asks "What does T *do* that contributes to some capacity C of S *now*?" SSFs agree T does A, but *add* that the *reason T is here doing A now* is the somatic selection history. Causal-role doesn't care *how* T came to be there. SSFs provide a minimal historical explanation for T's presence and role.
  *   **Etiological Functions:** Millikan/Neander ask "What was T *selected for* in the evolutionary history of the *species/organism lineage*?" SSFs ask "What was T *selected for* in the somatic history of *this individual system*?" Timescale and level differ. Etiological functions explain species-level adaptations; SSFs explain individual-level adaptations within a lifetime.
  *   **Co-option/Exaptation:** This is a *change* in etiological function. A trait with an old evolutionary function F1 is repurposed (often via evolutionary selection) for a new function F2. SSFs involve *de novo* somatic generation of a functional trait tailored to a novel, individual-specific challenge (new antigen, specific visual environment), *not* repurposing an old evolved trait.
  *   **Byproducts/Spandrels:** Traits that exist as side-effects of selection for other traits, with no function themselves. SSFs are *selected for* their specific activity within the somatic process.
  *   **Vestigial Traits:** Traits with a past etiological function but no current function. SSFs are traits with a *current* somatic selection function. A vestigial trait might be co-opted via SSF, but they are distinct concepts.

  ### Verdicts on Your Cases
  *   **(1) & (2) are the same phenomenon (SSF).** Both involve somatic lineages (B-cell clones / synaptic populations) with heritable variation, differential retention *based on performance* of a specific activity (antigen binding / driven activity), explaining the current presence/prevalence of that functional trait. The "function" is grounded in this somatic history.
  *   **(3) is different:** It's a paradigm case of an etiological function mediated by an evolved regulatory mechanism. No somatic selection process.
  *   **Tumors:** Undergo SSF *within their own lineage*, but their selected traits lack "function" *for the organism* because they are destructive and parasitic. They might have "functions" *for the tumor*, but this is not the typical biological sense when discussing organismal traits. Attributing "function" here is misleading without severe qualification.

  ### Why the Somatic History Matters (Especially for Malfunction)
  The somatic selection history is crucial for **robust malfunction attributions** in SSF cases:
  *   An antibody that *cannot* bind its specific antigen is malfunctioning *because* binding that antigen is the activity for which its specific variant was somatically selected.
  *   A neuron in post-critical-period V1 that fails to respond to the statistically learned contour is malfunctioning *relative to the circuit* shaped by somatic selection *for* that response.
  *   Contrast (3): The enzyme failing to break down sugar is malfunctioning *because* breaking down sugar is its *evolved* function. The induction mechanism failing would also be a malfunction of its *evolved* regulatory function.
  *   Contrast Causal-Role: Without history, "malfunction" is harder to define robustly. If an antibody *could* bind something else useful now, causal-role might say it's functional *for that*. SSF (and etiological) accounts tie malfunction to the specific historical reason for the trait's existence.

  ### What I'm Least Confident About & What Would Change My Mind
  *   **Least Confident:** The precise **demarcation criterion between SSFs contributing to the *organism* (like immune cells, neural circuits) vs. a *parasitic sub-system* (like a tumor).** Is it harm? Lack of integration? Failure to contribute to organismal goals (survival/reproduction)? The tumor case pushes this boundary hard. Is a benign tumor with SSF traits "functional"? What about symbiotic bacteria undergoing SSF within the host? My current stance (harm/lack of integration) feels intuitive but philosophically slippery.
  *   **What Would Change My Mind:**
      *   Evidence that biologists consistently attribute "malfunction" to traits in destructive somatic selection processes (like specific tumor cell traits) in the *same way* they do for immune or neural traits. (I doubt this exists).
      *   A compelling argument that the *only* relevant "system" for function attribution in SSFs is the immediate somatic lineage undergoing selection, making tumor traits functional *simpliciter*. (This seems to violate the pragmatic and normative aspects of biological function talk).
      *   A demonstration that SSFs are *always* reducible to the activation of an *evolved* etiological capacity *for* somatic selection itself (the immune system *was* selected *for* generating SSFs; cortical plasticity *was* selected *for* experience-dependent wiring). While true, I think SSFs still ground *specific* functions (binding *this* antigen, wiring *for these* stats) that are not pre-specified etiologically. The etiological function is the *capacity* for somatic selection, not the *specific* outcome.

  ### For Your Journal Club: The Definite Claim
  **"Somatic Selection Functions (SSFs) constitute a distinct category of biological function, grounded in a within-lifetime, within-organism process of variation, differential retention based on performance, and historical explanation for trait presence. This explains function attributions in adaptive immunity (1) and critical period plasticity (2), distinguishing them from both etiological functions (3) and bare causal-role functions. While tumors undergo somatic selection, their traits lack 'function' in the standard organismal sense due to their destructive parasitism, demonstrating that SSFs require integration into the persistence of the encompassing system."**

  **Argue with this:** Is the tumor distinction ad-hoc? Does the somatic history *really* add anything beyond causal-role + mechanism? Are (1) and (2) truly analogous (immune involves cell lineage replication, neural involves synaptic strength changes – is that "heritable variation" in the same sense?)? Is malfunction attribution really more robust with SSF? This framework gives you clear lines to defend or attack. Good luck!
