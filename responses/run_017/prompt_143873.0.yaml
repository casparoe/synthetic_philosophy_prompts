prompt: |-
  i'm putting together discussion material for a first-year tutorial on well-being and i want to build one really tight case around Nozick's experience machine — but the version everyone always talks about is too easy to wriggle out of, so i'd like you to design one to spec instead of just rehashing it.

  Here's what i need: a single-paragraph scenario (near-future tech is fine, actual magic isn't — think extremely good neural VR with the body maintained in a care facility, no souls in the cloud) in which a hedonist — felt quality of experience is the only thing that matters for someone's welfare — and an actual-desire preference theorist (welfare = satisfaction of the desires the agent actually has at the moment of choosing) both have to say that plugging in is better for her, while some third view, on which welfare is neither just experiences nor just desire-satisfaction, says staying out is better. The third view is yours to pick — something agency-, achievement-, or narrative-shaped if you can make it work; if a different third theory does the job better, say so and use it.

  The point of the case is to find out whether the "of course you wouldn't plug in" intuition still pulls any weight once you strip out all the usual confounds, so here's my cheating list — the case has to generate the verdicts from the theories rather than stipulate them, and it can't lean on any of these: (1) the machine malfunctioning, degrading, or getting switched off early; (2) the subject being deceived about where she is or what she's giving up; (3) anything happening to other people, or any third-party difference at all — hold everyone else's welfare fixed across the two options; (4) hedonic adaptation or tedium inside — the stream can include difficulty, effort, failure and surprise and still be better; (5) the outside life being secretly wonderful, or longer, or shorter — the unplugged life should be an ordinary decent one with the same duration; (6) the subject having a desire for reality, authenticity, truth or achievement that the preference theorist can just point at — that's the cheap win i'm trying to rule out, so the desire-based verdict has to fall out of desires the machine can satisfy; (7) moral or other-regarding reasons smuggled in as prudential ones — nobody out here is relying on her, so the question really is just what's better for her.

  After the scenario: give me each theory's verdict in one sentence first (i want to check them at a glance), then a short walkthrough of why each gets there. Then tell me honestly which single feature of the case is doing the work and what happens to the verdicts if you remove it — does the whole thing collapse back into the boring original case? And then the bit i care most about: how would someone who thinks hedonism is fine attack your case? I can already hear the obvious move — "you've built the intuition into the setup" — so say whether that objection actually lands here or not, and why. Oh, and one thing i keep toying with and can't make up my mind about: what if two people are plugged into the same simulated world, so that whatever they mean to each other is at least psychologically real even though nothing around them is? Does that defuse the "no real relationships" complaint, or does it make things worse for the hedonist somehow — use it if it helps, drop it if it doesn't. And if you think an informed-desire version of the preference theory would flip the verdict, flag that separately instead of smuggling it in; i'd want to hear what exactly she's supposed to learn under full information. No citations or reading suggestions needed, i just want the case and the argument.
reasoning: |-
  Okay, let me tackle this request for a robust Experience Machine scenario. The user wants a version that avoids all the usual escape routes while forcing specific verdicts from hedonism and preference theory. 

  First, I need to design a scenario where:
  - Hedonism must endorse plugging in (better experiences guaranteed)
  - Actual-desire theory must endorse plugging in (all current desires satisfied)
  - But a third view (agency/achievement) rejects it

  The key constraints are tricky - no deception, no malfunction, no special outside benefits, no reality-desires, no moral spillovers. 

  Hmm... what if the subject has only mundane, satisfiable desires? Like "feel accomplished after finishing tasks" - which the machine can simulate perfectly. But then how to make agency matter? 

  Ah! Maybe the third view could be "objective agency" - where welfare requires actual causal impact on the world. The machine provides the feeling but not the real doing. 

  For the preference theorist, I need to ensure the subject has no unfulfilled desires. Perhaps make them extremely present-oriented: "I want to feel X right now" rather than "I want to have truly done Y". 

  Now the cheating list... 
  (4) is handled by including struggle in simulation
  (6) requires careful desire selection - no truth-related wants
  (7) means no dependents

  The shared simulation idea... if two people plug in together, does that solve "real relationships"? For hedonism yes (same qualia), but for agency view no - still no real mutual impact. Might actually strengthen the case by removing that objection. 

  Biggest challenge: preventing the "you baked in the intuition" objection. Need to show the verdicts flow from theories, not scenario framing. The key move is defining desires narrowly as occurrent states, not dispositional ones. 

  Potential attack from hedonists: "If experiences are identical, welfare is identical by definition!" But that just reveals their prior commitment. The case exposes that commitment as counterintuitive when agency is removed. 

  Let me draft...
answer: |-
  Here's the scenario designed to your specifications:

  **The Scenario:** Maya, a healthy adult with an ordinary decent life, is offered permanent neural VR immersion ("the Shell"). The Shell maintains her body in a care facility using advanced life support. Inside, her brain is stimulated to generate a perfectly fulfilling simulated life tailored to her psychology: she'll experience profound challenges she overcomes, deep "relationships" with simulated beings (or real others who also opted in), intense joys, meaningful-seeming achievements, and a constant sense of growth and purpose—all calibrated to be subjectively indistinguishable from an optimal real life and far surpass her current good-but-unexceptional reality in felt quality. Crucially, she is *fully informed*: she knows it's a simulation, knows her body is maintained, knows she's giving up her real life trajectory, and knows nothing she "does" in the Shell has any causal effect on the external physical world. Her *only* occurrent desires at the moment of choice are to feel deeply fulfilled right now, to experience overcoming significant challenges, and to feel loved and respected by those around her—all desires the Shell guarantees to satisfy continuously and maximally. Her outside life offers the same duration but only moderate satisfaction of these desires.

  **Theory Verdicts:**
  1.  **Hedonism:** Plugging in is better for Maya (guarantees maximally positive experiences).
  2.  **Actual-Desire Preference Theory:** Plugging in is better for Maya (satisfies all her occurrent desires maximally).
  3.  **Objective Agency Theory (Third View):** Staying out is better for Maya (welfare requires genuine causal agency in the real world).

  **Walkthrough:**
  *   **Hedonism:** The Shell guarantees a maximally positive *felt quality of experience*—intense joy, fulfillment, love, the thrill of achievement—far exceeding her ordinary real life. Since only the quality of experience matters for welfare, plugging in is unambiguously better *for her*.
  *   **Actual-Desire Preference Theory:** At the moment of choice, Maya's actual desires are solely about her *immediate experiential states* (feeling fulfilled *now*, feeling challenged *now*, feeling loved *now*). The Shell perfectly satisfies these specific desires. Whether she might later *develop* a desire for real agency or truth is irrelevant to this theory at the decision point. Plugging in satisfies her *current actual desires* maximally.
  *   **Objective Agency Theory:** Welfare fundamentally involves *actually exercising causal power* to bring about states of affairs *in the real world*. Achievements, relationships, and overcoming challenges only contribute to welfare if they are *real*—grounded in genuine causation and interaction with an independent reality. The Shell provides perfect *simulations* of these things but severs the link between Maya's will/actions and real-world effects. Her "achievements" are illusions; her "impact" is non-existent. Her real, unplugged life, while less intensely satisfying, involves *genuine agency*—her choices and efforts *actually* shape her real environment and relationships. This real agency is intrinsically valuable for welfare, even if the subjective feelings are less intense. Staying out is better.

  **The Key Feature & Its Removal:**
  *   **The Key Feature:** Maya's **occurrent desires at the moment of choice are exclusively about immediate experiential states** (feeling fulfilled, challenged, loved *now*), and she is **fully informed that the Shell severs all real causal agency**.
  *   **Removal Impact:** If Maya had *any* occurrent desire for "real achievement," "actual truth," or "genuine causal impact" at the moment of choice, the Actual-Desire Theory verdict flips to "Stay Out." If she were deceived about the nature of the Shell, both Hedonism and Preference Theory lose their clear "Plug In" verdicts. This feature is crucial to block the "cheap win" for Preference Theory and force both target theories to endorse plugging in despite the intuition against it. Without it, the case collapses towards the original.

  **The Shared Simulation Question:**
  *   Plugging Maya into a shared simulation with *another real person* (e.g., a friend or partner who also opts in) **strengthens the case for Hedonism/Pref Theory** by making the "relationships" involve genuine *interpersonal psychological interaction* (real minds affecting each other's simulated experiences). This further undermines the "no real relationships" complaint.
  *   **It doesn't help the Agency View.** The relationship, while psychologically real *between the plugged-in individuals*, still has *no causal impact on the external physical world*. Their "shared world" is entirely simulated and causally isolated. They cannot *truly* build a life together, affect a shared real community, or leave a legacy beyond their simulated bubble. Genuine agency still requires effecting change in the *mind-independent* world.

  **Hedonist Attack & Defense:**
  *   **The Attack:** "You've rigged the case by *defining* welfare to require real agency, baking the anti-plugging intuition into the third theory itself! If experiences are identical, welfare is identical. The intuition against plugging is just confusion or an irrelevant 'reality fetish'."
  *   **Does it Land?** **Partially, but not fatally.** The attack correctly points out that the *third theory* explicitly rejects the core hedonist premise. However, the case **doesn't merely assert the intuition**; it *uses* the persistent "of course you wouldn't plug in" intuition (even when informed and with experiential desires) to **motivate** and **exemplify** an alternative theory of welfare (Objective Agency) that *explains* why that intuition might be valid *prudentially*. The case forces the hedonist to either:
      1.  **Dismiss the intuition:** Argue that Maya *should* plug in and the reluctance is irrational bias (exposing the counter-intuitive cost of pure hedonism).
      2.  **Explain the intuition away:** Try to attribute the reluctance to residual fear, misunderstanding, or a non-prudential value (like "truth for its own sake," which the case rules out as a desire Maya lacks).
  *   The case's value is in **pressing the hedonist** on *why* the informed intuition persists even when all experiential/desire confounds are removed, pushing them to defend the claim that *only* experience matters, even when it's completely detached from real action.

  **Informed-Desire Preference Theory Flag:**
  *   If we switched to an **Informed-Desire theory** (welfare = satisfaction of desires the agent *would have* if fully informed and rational), the verdict **could flip to "Stay Out."**
  *   **What she learns under full information:** Precisely that plugging in severs her *real causal agency* and that her experiences, while subjectively real, are not grounded in genuine achievements or relationships with an independent world. A proponent of this view would argue that, upon *truly comprehending* this complete lack of real agency and its irrevocable nature, Maya would (if rational) *form* or *endorse* a fundamental desire *for* genuine agency and real-world connection, overriding her immediate experiential desires. Plugging in would then *frustrate* this more fundamental informed desire. This highlights the difference between fleeting occurrent desires and deeper, considered ones.
