  As a professional decision theorist steeped in Kelly betting and geometric rationality, I'll tackle this step by step. Tomas's track record reveals a consistent pattern of applying Kelly-inspired principles but with adaptations for context (e.g., uncertainty, one-off opportunities, background risk). The new case introduces a critical element: a non-negotiable wealth floor ($140k in 18 months) with a one-shot, high-edge bet (70% win probability, even money). I'll first brainstorm the competing rules that explain his historical behavior, then apply them to the new case to generate predictions, commit to a best guess with reasoning, and finally propose a variant to cleanly distinguish the rules.

  ### Step 1: Brainstorming Competing Rules from Track Record
  Tomas's past decisions suggest he adheres to core Kelly principles (maximizing geometric mean growth) but makes context-dependent adjustments. Kelly betting, at its heart, advocates betting a fraction of bankroll proportional to the edge when edge is positive, but Tomas's adaptations imply he respects constraints like uncertainty, one-off structures, and risk correlations. From the track record, I infer three key rules that cover all cases:

  - **Rule 1: Full/Kelly Fraction for Repeated Bets with Certain Edge**  
    This is the base case: for repeated bets with trusted probabilities, he uses the standard Kelly criterion. The Kelly fraction for an even-money bet is \( f = p - q \), where \( p \) is win probability and \( q = 1 - p \).  
    - *Case 1 (60% edge, certain, repeated):* \( f = 0.6 - 0.4 = 0.2 \), so 20% bet. Matches.  
    - *Case 2 (60% edge, uncertain):* He applies a "shrink" factor (here, 0.5) due to model error, so half-Kelly at 10%. Matches.  
    - *Case 3 (fair coin):* Edge \( f = 0.5 - 0.5 = 0 \), so zero bet. Matches.  
    - Why it fits: This rule handles repeated scenarios with probabilistic edges. It doesn't directly address one-off bets or wealth floors, so it needs augmentation for other cases.

  - **Rule 2: Max Bet for One-Off Opportunities with Capped Downside**  
    For one-shot bets where loss is strictly limited (no ruin risk), he maximizes upside by staking the maximum allowed, as the capped downside eliminates the risk of severe loss while allowing high potential gains. This is rational under log utility when downside is bounded.  
    - *Case 4 (one-off, 5% loss cap):* Downside capped at 5% of bankroll, so he stakes max to exploit the asymmetric upside (50x gain with 8% probability). Matches.  
    - Why it fits: This rule explains one-off decisions where Kelly's long-term growth focus doesn't apply, and the structure makes aggressive betting optimal. It implies risk-seeking in opportunities with "free" upside.

  - **Rule 3: Bankroll Adjustment for Background Risk or Constraints**  
    When bets correlate with existing risks (e.g., salary) or there are wealth constraints, he reduces bet size by adjusting the effective bankroll. This can be seen as optimizing a utility function (e.g., log of wealth minus liabilities) or scaling the Kelly fraction based on covariance or surplus wealth.  
    - *Case 5 (correlated bet):* Reduces size due to positive correlation, effectively treating background risk as reducing the "safe" bankroll for the bet. Matches.  
    - *Implied for floors:* If a wealth floor exists (e.g., a non-negotiable obligation), the bankroll is reduced to the surplus above the floor before applying Kelly. This maximizes the geometric mean of surplus wealth, aligning with "ergodicity" ideas where growth is measured relative to essential needs.  
    - Why it fits: This rule handles external risks and constraints by shrinking the betting base, ensuring bets don't jeopardize critical wealth levels.

  These rules cover all cases: Rule 1 for repeated bets, Rule 2 for one-off capped-downside bets, and Rule 3 for risk correlations or wealth floors. They share a geometric mean foundation but diverge on how to handle one-off scenarios and constraints.

  ### Step 2: Applying Rules to the New Case
  **New case summary:** Tomas has $200k now, needs exactly $140k in 18 months (treated as a hard floor). Money is in cash (no growth), so post-bet wealth directly determines deposit ability. Bet: one-shot, even money, 70% win probability (solid edge), resolves in 3 months. No reinvestment or hedging.  
  - Edge: \( p = 0.7 \), \( q = 0.3 \), so Kelly fraction \( f = p - q = 0.4 \) (40%) for repeated bets.  
  - Wealth floor: $140k, so surplus wealth = current bankroll - floor = $200k - $140k = $60k.  
  - Risk of ruin: If post-loss wealth < $140k, ruin occurs (deposit fails). With stake \( S \), ruin if \( S > $60k \).

  Now, apply the rules:
  - **Rule 1 (Full Kelly for Repeated Bets): Ignores floor and one-shot nature.**  
    Since the bet has a certain edge, he would stake the full Kelly fraction: \( S = f \times \text{bankroll} = 0.4 \times $200k = $80k \).  
    - Prediction: $80,000 (40% of bankroll).  
    - Why? This treats it like Case 1, ignoring the floor and one-shot context. But it risks ruin (if lose, wealth = $120k < $140k, 30% chance), which seems inconsistent with his pragmatism in Cases 4 and 5. Rule 1 doesn't fit perfectly here because it overlooks the wealth floor, making it the weakest match.

  - **Rule 2 (Max Bet for Capped Downside): Not directly applicable, but adapted for "no ruin risk" mindset.**  
    This rule emphasizes seizing upside when downside is bounded, but here downside is uncapped (ruin possible). However, to avoid ruin, he might only bet if it guarantees meeting the floor. Thus, he stakes the maximum that ensures no ruin: \( S \leq \$200k - \$140k = \$60k \). With positive EV, he maximizes upside by staking \( S = \$60k \).  
    - Prediction: $60,000 (30% of bankroll).  
    - Why? This mirrors Case 4's aggression but respects the floor: min wealth = $140k (if lose), max = $260k (if win), no ruin risk. EV is $224k vs. $200k for no bet. Fraction is lower than full Kelly due to floor constraint.

  - **Rule 3 (Bankroll Adjustment for Constraints: Kelly on Surplus):**  
    With a wealth floor, he treats surplus ($60k) as the effective bankroll and applies Kelly to it. \( S = f \times \text{surplus} = 0.4 \times $60k = $24k \).  
    - Prediction: $24,000 (12% of bankroll).  
    - Why? This maximizes the geometric mean of surplus wealth, consistent with geometric rationality and background risk adjustments (Case 5). Min wealth = $176k > $140k, so no ruin risk, but it's more conservative than Rule 2.

  **Key Differences on New Case:**
  - Rule 1: $80k (40%) – Ignores floor, high ruin risk (30%), inconsistent with his risk management in other cases.
  - Rule 2: $60k (30%) – Avoids ruin, maxes upside within safe bound, similar to Case 4's capped-downside logic.
  - Rule 3: $24k (12%) – Kelly-optimized for surplus, conservative, directly extends Case 5's risk adjustment.

  Rules 2 and 3 both avoid ruin but differ on aggressiveness: Rule 2 is "max safe bet" (capital preservation with upside), Rule 3 is "growth-optimal for surplus" (geometric rationality with constraints). Rule 1 is likely invalid here due to the floor and one-shot nature, as Tomas would reject ruin risk.

  ### Step 3: Best Guess and Reasoning
  **Best guess: Tomas stakes $24,000 (12% of bankroll), following Rule 3 (Kelly on surplus).**

  **Reasons and uncertainty:**
  - **Why Rule 3?** 
    - Tomas is "hardcore Kelly" focused on geometric mean (Cases 1-3), and Rule 3 extends this to constrained scenarios by maximizing the growth rate of discretionary wealth (surplus above floor). This is standard in geometric rationality for essential liabilities (e.g., treating floor as a "subsistence level").
    - It aligns with Case 5 (background risk): he reduces bet size for covariance, which is analogous to reducing bankroll for systemic risks. Here, the floor is a similar constraint.
    - Case 4 supports Rule 3 indirectly: with capped downside, he went max, but that had no ruin risk; here, uncapped downside makes conservatism natural. Rule 3 avoids ruin while still betting (unlike Rule 2, which might skip betting if EV were negative).
    - Ergodicity focus: Tomas cares about long-term growth but respects "absorptive barriers" like wealth floors. Betting Kelly on surplus ensures positive growth without breaching the barrier.
    - Psychological: He said "no edge, nothing to compound" in Case 3—here, the edge compounds the surplus, not total wealth.

  - **Uncertainty and leanings:**
    - I lean 70% toward Rule 3; it's the most consistent with his philosophy and generalizes well. Rule 2 ($60k) is possible (30%), as he might prioritize "no ruin" and max upside like Case 4, but Case 4 had explicit downside control, which is absent here. Rule 1 ($80k) is unlikely (<5%)—it ignores the floor, contradicting his aversion to ruin in Case 4 and background adjustments in Case 5.
    - Uncertainty sources: 
      - His reaction to one-shots: Case 4 shows aggression with capped loss, but this has uncapped loss. He might see the floor as making surplus the relevant bankroll.
      - Time aspect: Bet resolves in 3 months, deposit in 18 months—since money is cash, it's equivalent, but he might discount the floor psychologically. I assume not.
      - Edge quality: 70% is solid, so no shrinkage like Case 2.

  **Bottom-line dollar figure:** $24,000 (12% of $200k).

  ### Step 4: Variant to Cleanly Distinguish Rules
  **Variant to test: Lower the wealth floor to $190,000, keeping all else equal (bankroll $200k, bet 70% win, even money, one-shot).**

  **Why this variant?** It exacerbates the difference between Rule 2 and Rule 3 by making the surplus smaller, while Rule 1 is already invalid per above. 
  - **Current surplus:** $200k - $190k = $10k.
  - **Rule 2 prediction (Max Safe Bet):** Stake max without ruin risk: \( S \leq \$200k - \$190k = \$10,000 \) (5% of bankroll). Since EV > 0, he stakes $10,000 to max upside safely (min wealth = $190k).
  - **Rule 3 prediction (Kelly on Surplus):** Stake \( f \times \text{surplus} = 0.4 \times \$10k = \$4,000 \) (2% of bankroll).
  - **Discrimination:** 
    - If Tomas stakes ~$10k, Rule 2 is favored (capital preservation focus). 
    - If he stakes ~$4k, Rule 3 is favored (growth optimization on surplus). 
    - The dollar difference ($10k vs. $4k) is large relative to bankroll, making it easy to observe. Rule 1 would predict $80k, but that risks ruin (min wealth $120k < $190k), which he'd reject.

  **Why not other variants?** 
  - Changing probability (e.g., to 55%) adds uncertainty, which invokes Case 2's shrinkage and muddies the issue. 
  - A repeated bet variant isn't possible here. 
  - A higher floor (e.g., $195k) would make predictions closer ($5k vs. $2k), harder to distinguish, but $190k is clearer.

  **Underdetermination note:** The track record slightly underdetermines between Rules 2 and 3, as both respect the floor. Rule 3 is more "principled" for a Kelly devotee, while Rule 2 is more "pragmatic." By committing to Rule 3, Tomas affirms that geometric rationality applies to surplus wealth; by choosing Rule 2, he prioritizes zero ruin risk over growth optimization. The variant forces this choice by tightening the surplus.
