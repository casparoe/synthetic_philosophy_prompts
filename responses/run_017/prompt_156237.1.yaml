prompt: |-
  I've been reading the rationalist blogs since the late 2000s and belong to a small forecasting group that grew out of that scene — we meet monthly, keep calibration logs, and nearly all our arguments are about back-of-envelope decompositions rather than about anything anyone could look up. At the last session I presented a Fermi-style estimate of the probability that a frontier lab's alignment plan fails within five years: I split the event into three conjuncts (continued capability growth, the plan's central assumption holding, no exogenous pause), gave each a number, and multiplied under an explicit presumption of independence. A friend who is better at this than I am then re-ran my own estimate under a finer decomposition, splitting the second conjunct into three sub-conjuncts, taking the numbers for those sub-conjuncts from what I'd have said if asked about them cold (the only way to get marginals for conjuncts I'd never considered), and produced a figure nearly an order of magnitude below my original one. He claims this is completely general and calls it the fragmentation lemma. Here is the argument as he gives it.

  (1) A heuristic estimate of P(E) reached by decomposing E into conjuncts and multiplying is warranted only to the extent that the conjuncts are probabilistically independent, or at least not positively correlated; that assumption is where the epistemic work is done. (2) The correct formalisation of the presumption of independence — the default you are entitled to when you have no evidence of correlation — is maximum entropy subject to what you know: given the marginals and nothing further, the maximum-entropy distribution is the product of the marginals, i.e. independence. (3) Maximum entropy earns that role because it is the unique choice that adds no information beyond the constraints, and, on the concentration-of-measure reading, because it is what almost any distribution satisfying the constraints will look like. (4) But maximum entropy is sensitive to the description of the space: re-coarse-grain the sample space, or apply a non-linear change of coordinates to a continuous variable, and the maximum-entropy distribution changes although nothing has been learnt. So "adds no information" is well-defined only relative to a chosen partition. (5) In a heuristic argument the decomposition is chosen by the arguer, and there is no canonical decomposition of an event: any conjunct can always be cut further. (6) Hence the fragmentation lemma: holding the evidence fixed, I may refine the decomposition of E into arbitrarily many conjuncts, apply the presumption of independence to each refinement — every refinement being an equally entitled instance of (2) and (3) — and thereby move the estimate for P(E) by large factors without any change in what I know. (7) So no heuristic estimate resting on a presumption of independence is constrained by the evidence at all; the number comes from an arbitrary modelling choice, and such arguments are worthless. (8) But that cannot be right: independence assumptions plainly work sometimes — repeated randomised trials, spatially separated systems, dice — and abandoning them would take most of applied probability, causal inference from passive data, and decision theory down with them.

  I want to know which step you would reject, why it looked fine, and what rejecting it costs. My own suspicion is that (6) is where something slips: under genuine independence the product of the finer marginals has to agree with what I already believed about the coarser event, so the lemma must be smuggling in new judgements while calling them the same evidence — but I cannot make that precise, and my friend says the suspicion simply begs the question against (4). Assume I know the standard machinery — Bayes, the Markov condition and d-separation, why differential entropy is not invariant under a change of coordinates — so don't explain those. If I have to choose, I would rather keep (2) and (8) than (3); and if the maximum-entropy formalisation really is the thing to drop, tell me what should replace it — a prior over causal structures that penalises extra edges, an exchangeability assumption, a hierarchical prior on a correlation parameter centred at zero, or something else — and what each option buys and costs me in the arguments I actually have. Please lead with your bottom line in the first sentence and then give the reasoning: no preamble, no restatement of the question, and no reading list.
reasoning: |-
  Hmm, the user presents a sophisticated critique of Fermi estimation via the "fragmentation lemma" – essentially arguing that decompositional probability estimates are arbitrary because independence presumptions depend entirely on how we slice the problem. They're deeply familiar with Bayesian reasoning and maximum entropy principles but suspect something's wrong with step (6) where fine-grained decomposition supposedly allows unbounded probability manipulation. Their core tension: they need independence assumptions for practical forecasting (as in their monthly group), but the lemma seems to destroy their epistemic footing.

  Breaking this down: The lemma claims that by refining conjuncts (e.g., splitting "plan's assumption holds" into sub-assumptions), and applying maximum entropy at each step, you can arbitrarily depress P(E) without new evidence. The user's instinct is that true independence should preserve probabilities across granularities, but their friend counters that maximum entropy isn't invariant under reparameterization (step 4). 

  Key insight: The flaw is indeed in step (6)'s misapplication of maximum entropy. When you refine "A" into "B∧C", the marginal for A is fixed evidence, but the sub-marginals P(B) and P(C) aren't – they're counterfactual ("what I'd have said cold"). Maximum entropy only applies when marginals are known constraints; here, inventing sub-marginals that multiply to P(A) while ignoring their correlation structure is smuggling in independence. 

  What rejecting this costs: We must abandon the idea that any decomposition warrants independence by default. Instead, we need positive reasons for independence (e.g., causal separation, randomization) or model the dependence. In practice, this means:
  - When decomposing, use hierarchical models with hyperpriors on correlations
  - Prefer exchangeability where appropriate
  - In Fermi estimates, anchor on observables and use decompositions only when sub-events have clear causal independence

  This preserves applied probability (per step 8) by tying independence to domain knowledge, not algorithmic decomposition. The user's forecasting group should focus on whether conjuncts share latent variables – if "capability growth" and "no pause" both depend on economic factors, for example, independence is unjustified even before fragmentation.
answer: |-
  **Reject step (6): The presumption of independence cannot be applied recursively to arbitrarily refined decompositions when sub-marginals are counterfactually generated without fixing the original marginal as a constraint.** The fragmentation lemma ignores that your "cold" sub-marginals for finer conjuncts are not evidence-backed constraints but synthetic constructs inconsistent with your prior for the coarser event. Maximum entropy (MaxEnt) requires fixed constraints; inventing sub-marginals violates this by altering the effective constraint set.

  ### Why (6) fails:
  - When you decompose conjunct A (e.g., "plan's assumption holds") into B ∧ C ∧ D, your prior P(A) is evidence. MaxEnt for the refined space must satisfy P(A) = P(B ∧ C ∧ D) as a constraint. Your friend's "cold" sub-marginals P(B), P(C), P(D) are *not* constraints—they are new, unsupported guesses. Assuming independence at finer grains while ignoring P(A) injects arbitrary information.
  - Under true ignorance beyond P(A), the MaxEnt distribution over B,C,D only assumes independence *if* you fix no sub-marginals. Specifying sub-marginals without correlation data implies false precision. If you *only* know P(A), MaxEnt does *not* assume sub-conjunct independence; it only fixes P(B ∧ C ∧ D) = P(A), leaving correlations unconstrained. Your friend’s method smuggles in independence by asserting sub-marginals.

  ### What rejecting (6) costs:
  You lose the ability to justify independence solely through decomposition. You must either:
  - **Anchor on observables**: Decompose only to sub-events with defensible independence (e.g., causally separated systems), treating coarser estimates as composites.
  - **Model dependence explicitly**: Use a hierarchical prior (e.g., Gaussian copula with concentration near zero correlation) when sub-marginals are guessed. This adds robustness but requires specifying dependence strength.

  ### Why other steps hold:
  - (2)/(3) stand: MaxEnt *is* the correct default for fixed constraints.
  - (4) is correct but irrelevant: Reparameterization invariance fails for MaxEnt, but your evidence (marginals) ties the distribution to your chosen variables.
  - (8) holds: Independence works when justified by domain knowledge (e.g., spatial separation), not arbitrary decomposition.

  ### Fix for Fermi estimates:
  Replace unstructured independence with **exchangeability** or **sparse correlation priors**. For your forecasting group:
  - **Adopt exchangeability** when conjuncts are similar (e.g., "failure risk per lab-year"), letting you estimate a mean failure rate. Cost: Masked heterogeneities.
  - **Use a hyperprior on correlation** (e.g., Beta(α,β) for correlation strength, centered at 0). Multiply your product by a "dependence penalty factor" (e.g., 1/(1+κ) for κ>0 estimated). Cost: Adds subjective κ.
  - **Anchor decompositions to causal models**: Only split when sub-conjuncts are d-separated. Cost: Requires identifying causal structure.

  Bottom line: Independence is not a free byproduct of decomposition; it requires positive justification. Your friend’s lower estimate arose from uncritically adding independence assumptions at finer grains, not from genuine evidence refinement.
