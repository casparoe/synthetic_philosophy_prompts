  3. In (3), the first friend is wrong that continuing with the same \(p\) is worth 1.6 (it's worth \(4/3\)), but right that absent-mindedness forces the same strategy at every intersection, so deviation isn't feasible without precommitment.
  4. In (4), the second friend's per-decision payoff calculation \((4p - 3p^2)/(1 + p)\) and its optimum near 0.53 are correct, but this changes the objective to per-decision, which isn't the original per-trip measure.
