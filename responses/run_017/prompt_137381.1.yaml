prompt: |-
  I spent most of last evening arguing with a friend who works in brand marketing about whether an expensive gesture is automatically a credible one. Her position was that a firm willing to burn real money on a promise has thereby proved it means the promise; mine was that the burn proves nothing unless it hurts a firm that does not intend to follow through more than it hurts one that does. We got as far as agreeing on that differential-cost point — she conceded that a deep-pocketed company can buy exactly the same display as a sincere one — and then stalled on three things I could not settle. First, whether the cost has to be wasted in order to count: her examples were all pure waste (a huge advertising buy, absurd packaging, a monument of a headquarters), and she thought money spent on something that also makes the pledger better at delivering was not a real signal at all. Second, whether a costly gesture that nobody outside the counterparty ever learns about can signal anything, or whether it collapses into an ordinary contract term. Third, a case she raised that I had no answer to: some expensive things a company builds are partly what enable it to keep the promise in the first place, so the gesture does not merely reveal a quality that was already there but helps produce it. I suspect the biology literature on costly signaling and the handicap principle has something precise to say about all three, but please state whatever the relevant conditions are in plain English and do not hand me a reading list or citations — I have no way to chase them down, and I need questions I can ask, not authors I can read.

  The reason I need it operationalized is my day job. I direct a four-person program staff at a regional foundation that makes outcome-linked grants to service providers; roughly sixty applications a year arrive with some kind of commitment attached — money placed in escrow, refunds promised if targets are missed, assets built or dedicated, public pledges with named deadlines. My staff have program and field backgrounds and no economics; each of us has about twenty-five minutes per application; every decision over two hundred fifty thousand dollars goes to a board that wants a single page of written rationale; and we are currently using an in-house scoring sheet whose largest single component is the headline dollar figure attached to the commitment, weighted more heavily than whether the commitment is even verifiable. I now think that weighting is close to backwards, and I want to replace it. So please write me a decision procedure my team can actually run: the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the question is one of values rather than facts, and what to write down when a number we need simply is not in the documents. It has to be usable by someone who has never heard the theory, it should say which distinctions genuinely have to survive that simplification and which can be dropped, and it should be honest about the places where its central estimate is guesswork dressed up as procedure.

  Then run it on three commitments of the kinds we actually see, telling me what verdict each gets and why. One: a large national provider places two million dollars of its own reserves with an independent trustee for three years, forfeited automatically if a named, independently verified service target is missed. These are my own favorite category, and I want to know whether the procedure endorses them or tells me that for a firm with that balance sheet the differential cost is close to zero. Two: a mid-sized provider spends about a million and a half building an internal data and case-tracking system it says is required to hit the target, on hardware and software it would keep and use elsewhere if the grant ended tomorrow. Three: a small nonprofit with very thin reserves offers, in a binding but confidential filing, to repay the entire grant plus twenty percent if the verified outcome is not met, and asks that the pledge never be publicized because it would alarm its own donors and clients. I want the third case to force the procedure to say what a costly but invisible pledge actually is, and whether a pledge that would bankrupt the pledger is worth anything given that there would be nothing left to collect. Please also tell me plainly what the procedure cannot tell us: which kinds of commitment it is simply the wrong instrument for, where the honest answer is that we do not know, and which of our existing categories should probably be retired rather than scored.
reasoning: |-
  Okay, the user has presented a complex scenario involving signaling theory applied to grant applications. They need a practical decision procedure for evaluating commitments attached to grant proposals, based on costly signaling principles. 

  First, I need to unpack their core debate with the marketing friend. The central question is whether expensive gestures automatically signal credibility. The user's key insight is differential cost - the signal must hurt less credible firms more. Their friend focused on pure waste as the only true signal. Three sticking points emerged: 1) whether the cost must be wasted, 2) whether private signals count, and 3) whether investments can create capability rather than just reveal it.

  The user's actual need is operational - they run a foundation evaluating grant applications with attached commitments. Their current scoring overvalues headline dollar figures, even when unverifiable. They need a practical framework their non-economics staff can apply in 25 minutes per application. The framework must be actionable, acknowledge guesswork, and produce clear rationales for board decisions.

  Hmm... the biology-inspired handicap principle is indeed relevant here. Zahavi's core idea is that signals are credible precisely because they're costly in ways that would disadvantage "fakers" more. But translating theory to practice requires simplifying without losing essential distinctions. 

  For the decision procedure, I should structure it as a flowchart with key questions:
  First, establish if the commitment is even verifiable - if not, it's worthless as a signal. 
  Then assess differential cost: how much would this hurt a firm that can't deliver versus one that can? This requires estimating the cost relative to the firm's capacity. 
  Next, distinguish between "waste" signals (pure cost) versus "investment" signals (that build capability). The latter can be meaningful if the investment is relationship-specific or would be less valuable to underperformers. 
  For private commitments, they can still signal if they're contractually binding and create differential cost, though public signals are stronger. 
  The bankruptcy risk case needs special handling - extreme penalties may indicate desperation rather than confidence.

  The three test cases are perfect stress tests:
  Case 1 (escrow) is strong if the forfeiture is meaningful relative to the provider's size. 
  Case 2 (IT system) could be credible if the system is grant-specific, but questionable if easily redeployable. 
  Case 3 (confidential penalty) is tricky - the privacy weakens it, and bankruptcy risk makes collection doubtful. 

  Important to flag limitations: the framework can't assess the underlying proposal quality, can't eliminate judgment calls about firm capabilities, and struggles with investments that have dual uses. Should explicitly state where we're making educated guesses.

  The board rationale should focus on differential cost percentage and why it matters, not just raw dollars. For staff use, we'll need clear thresholds (e.g., >10% of annual budget = strong signal) and a worksheet for quick calculations. The procedure must be teachable in under an hour and workable within time constraints - so we'll use proxy measures like "percent of liquid reserves" rather than complex financial analysis.
answer: |-
  Here's a practical decision procedure for evaluating commitments, based on costly signaling theory, designed for your team's constraints. The core principle: **A credible signal must impose a *differentially higher cost* on organizations *incapable* of fulfilling their promise than on those *capable* of fulfilling it.**

  **The Commitment Evaluation Procedure:**

  1.  **Is the Commitment Verifiable?**
      *   *Question:* Can we independently confirm if the outcome was achieved AND if the penalty/commitment was triggered?
      *   *Sufficient Answer:* **Yes.** Clear, objective outcome metric; independent verification mechanism defined; clear trigger for penalty defined; clear mechanism for enforcing penalty.
      *   *Stop if No:* If "No," the commitment adds **zero** credibility. Score it as **0**. Move on. (Rationale: An unverifiable promise is cheap talk).
      *   *Values/Guesswork:* Defining "clear" and "objective" metrics requires judgment. If borderline, flag for discussion.
      *   *Missing Data:* If the application lacks specifics on verification/trigger/enforcement, score as **0**. Note: "Verification mechanism/details missing."

  2.  **What is the *Net* Cost of Failure to *This* Organization?**
      *   *Question:* If the outcome is NOT achieved and the penalty is enforced, what is the *actual financial/net asset loss* the organization will suffer? Adjust for recoverable value or secondary benefits.
      *   *Key Distinctions:*
          *   **Pure Waste:** Money/resources permanently destroyed or given away (e.g., forfeited escrow, ad spend, penalty paid to *you*). *Net Cost = Amount Wasted.*
          *   **Sunk Investment:** Money spent on assets that *remain with the org* but have reduced value if the project fails (e.g., specific IT system, dedicated facility). *Net Cost = Investment Cost - Value if Project Fails.* Estimate the value loss.
          *   **Penalty:** A payment or forfeiture triggered by failure (e.g., repayment clause). *Net Cost = Penalty Amount.*
      *   *Sufficient Answer:* A dollar figure representing the net financial loss the organization faces *specifically due to this commitment* if they fail.
      *   *Missing Data:* Estimate conservatively. If building an IT system ($1.5M) but it's easily repurposed, *Net Cost* might be near $0. If it's highly specific and useless elsewhere, *Net Cost* could be near $1.5M. Note assumptions clearly (e.g., "Assumed 60% asset redeployment value").
      *   *Values/Guesswork:* Estimating asset redeployment value or secondary benefits requires significant judgment. Flag high uncertainty.

  3.  **How Significant is the Net Cost Relative to the Organization's Capacity to Bear It? (Differential Cost %)**
      *   *Question:* What is the *Net Cost* (from Step 2) as a **percentage** of a relevant measure of the organization's financial health/size?
      *   *Key Measures (Use best available proxy):*
          *   **Liquid Reserves:** (Cash + Near-Cash) - Critical Short-Term Liabilities. *Best for Pure Waste/Penalties.*
          *   **Annual Operating Budget:** *Good general proxy for capacity, especially if reserves data is poor.*
          *   **Net Assets (for Non-Profits):** *Useful if reserves/budget data unavailable.*
          *   **Annual Surplus/Deficit:** *Crucial context - a penalty costing 50% of reserves is meaningless if they run a 50% deficit annually.*
      *   *Sufficient Answer:* A percentage (e.g., "Net Cost = $500k; Liquid Reserves = $2M; % = 25%").
      *   *Missing Data:* This is common. Use *Annual Operating Budget* as the most consistently available proxy. *Always note the proxy used.* If even budget is missing, flag as "High Risk - Financial Capacity Unknown." Score can proceed but is weak.
      *   *Differential Cost Threshold:* **<5%:** Weak signal (Deep pocket / easily affordable failure). **5-15%:** Moderate signal (Significant but survivable). **>15%:** Strong signal (Material pain, potentially existential). *Adjust thresholds slightly based on surplus/deficit context.*
      *   *Values/Guesswork:* Choosing the best financial proxy requires judgment. The thresholds are guidelines, not absolutes.

  4.  **Is the Cost *Primarily* a Signal or an Investment?**
      *   *Question:* Does spending this money/resource primarily *reveal* existing capability (Signal) or primarily *create* the capability needed to succeed (Investment)?
      *   *Key Distinctions:*
          *   **Signal (Reveals):** Cost is incurred *contingent on failure* or is pure waste *not* directly enabling success (e.g., forfeitable escrow, penalty, absurd HQ, pure ad spend).
          *   **Investment (Creates):** Cost is incurred *upfront* and directly builds the capacity to deliver the outcome (e.g., building the essential IT system, hiring key staff, buying necessary equipment). *The net cost calculated in Step 2 reflects the potential loss on this investment if the project fails.*
      *   *Sufficient Answer:* Categorize as **Signal** or **Investment**.
      *   *Impact:* **Signals** are the *purest* form of costly commitment – they only make sense if you are confident. **Investments** are necessary but ambiguous; they *could* indicate commitment, or they could be things the org wanted anyway. *Investment commitments get a slight credibility discount vs. an equivalent pure Signal cost.* Why? An incapable org might still make the investment hoping for success or because it has other uses, diluting the differential cost signal.
      *   *Values/Guesswork:* Distinguishing "essential for *this* project" from "generally useful" requires field knowledge. Flag uncertainty.

  5.  **Is the Commitment Public?**
      *   *Question:* Will stakeholders (donors, clients, peers, public) likely learn about this commitment and its potential failure?
      *   *Sufficient Answer:* **Yes** (Public pledge, likely press, board minutes public) or **No** (Strictly confidential contract term).
      *   *Impact:* **Public** commitments add reputational risk on top of financial cost, significantly increasing the *differential cost* for an incapable organization (fear of lost future funding/donors). **Private** commitments rely solely on the financial/net cost calculated. *Private commitments get a moderate credibility discount vs. an equivalent public commitment.* Why? Reputational damage amplifies the true cost for the incapable.
      *   *Values/Guesswork:* Assessing "likely" publicity requires judgment. Default to "No" if explicitly confidential.

  **Scoring & Rationale for Board:**

  *   **Core Credibility Score:** Primarily driven by the **Differential Cost %** (Step 3). Use the thresholds as a guide (<5%=Low, 5-15%=Medium, >15%=High).
  *   **Adjustments:**
      *   **-1 Level:** If primarily an *Investment* (Step 4).
      *   **-1 Level:** If strictly *Private* (Step 5).
      *   *(e.g., A High (15%) public signal becomes Medium if it's an Investment; a High private investment becomes Low).*
  *   **Verification Strength (Step 1):** Binary. Must be Verifiable to have *any* credibility score above 0.
  *   **Board Rationale (1 Page Template):**
      1.  **Commitment Type:** (e.g., "Forfeitable Escrow", "Repayment Penalty", "Dedicated Facility Investment").
      2.  **Verifiable?** (Yes/No - If No, stop here).
      3.  **Net Cost if Failed:** `$X` (Explain calculation briefly, e.g., "$2M escrow forfeiture").
      4.  **Differential Cost:** `$X` is `Y%` of `[Proxy Used: e.g., Liquid Reserves ($Z)]`. (`[Surplus/Deficit Context if relevant]`).
      5.  **Nature:** Primarily `Signal/Investment`; `Public/Private`.
      6.  **Adjusted Credibility:** `[e.g., Strong Signal (High)]` or `[e.g., Moderate (Investment & Private)]`.
      7.  **Key Risks/Uncertainties:** (e.g., "Redeployment value of IT system estimated", "Strict confidentiality limits reputational risk", "Surplus context weakens 10% impact").

  **What the Procedure CAN'T Tell You:**

  1.  **Underlying Capability:** It assesses the *signal*, not the org's actual ability to deliver the *service outcome*. A strong signal from a known incompetent is still worrying! (This requires separate assessment).
  2.  **Value for Money / Project Merit:** A credible commitment doesn't mean the project itself is good or worth funding. This is separate due diligence.
  3.  **True Intent:** It infers likely intent/seriousness via cost, not mind-reading.
  4.  **Predicting Success:** Credibility ≠ Guarantee. It only indicates the pledger *believes* it can succeed and is serious.
  5.  **Highly Subjective Valuations:** Precise net cost for complex sunk investments is often guesswork.
  6.  **Catastrophic Risk (Bankruptcy):** It flags high differential cost (>15%) but doesn't model bankruptcy logistics (Step 3 threshold acts as a proxy for severity).

  **Retire These Categories:**

  *   **Headline Dollar Figure Alone:** Meaningless without context (Steps 2 & 3).
  *   **Unverifiable Commitments:** (Step 1). Worthless.
  *   **Vague "Dedicated Assets" without Net Cost Analysis:** (Step 2). Easily gamed.

  **Applying the Procedure to Your Cases:**

  1.  **Large National Provider: $2M Escrow**
      *   Step 1: **Verifiable?** Yes (Named target, independent verification, automatic forfeiture).
      *   Step 2: **Net Cost:** $2,000,000 (Pure waste on forfeiture).
      *   Step 3: **Differential Cost%:** Need Org Reserves. *Assume Application Shows Reserves = $50M.* $2M / $50M = **4%**. (<5% = Weak). *If Reserves = $10M, $2M/$10M=20% (Strong).* *Crucially depends on their size!*
      *   Step 4: **Nature:** Pure **Signal**.
      *   Step 5: **Public?** Implied Yes (Independent trustee, likely known).
      *   **Verdict:** Credibility hinges entirely on Step 3 %. For a truly large org ($50M+ reserves), this is a **Weak** signal (cheap talk). For a smaller large org ($10M reserves), it's a **Strong** signal. *Your procedure forces you to look up their reserves/budget.* Rationale must state the % and proxy.

  2.  **Mid-Sized Provider: $1.5M IT System**
      *   Step 1: **Verifiable?** Yes (Assume outcome & failure defined).
      *   Step 2: **Net Cost:** *Critical Step.* If easily redeployed, Net Cost could be low (e.g., $1.5M system worth $1.2M elsewhere? Net Cost=$300k). If highly specific & useless, Net Cost=$1.5M. *Requires judgment/field knowledge.* *Assume staff estimates ~40% value loss if project fails: Net Cost = $1.5M * 0.4 = $600k.*
      *   Step 3: **Differential Cost%:** Need Org Budget/Reserves. *Assume Budget = $8M.* $600k / $8M = **7.5%** (Moderate).
      *   Step 4: **Nature:** Primarily **Investment** (Builds capacity). (-1 Level adjustment).
      *   Step 5: **Public?** Probably not a public pledge about the penalty. **Private.** (-1 Level adjustment).
      *   **Verdict:** Moderate base cost (7.5%), discounted for being an Investment *and* Private: **Low Credibility.** Rationale highlights the judgment on Net Cost and discounts. Signals commitment less clearly than escrow.

  3.  **Small Nonprofit: Confidential Repayment (+20%)**
      *   Step 1: **Verifiable?** Yes (Outcome defined, verified, penalty triggered).
      *   Step 2: **Net Cost:** Penalty Amount = Grant + 20%. *Need Grant Amount!* Assume Grant = $200k. Penalty = $240k. **Net Cost = $240k.**
      *   Step 3: **Differential Cost%:** *Critical Step.* "Thin Reserves". *Assume Reserves = $100k (thin!).* $240k / $100k = **240%**. (Extremely High).
      *   Step 4: **Nature:** Pure **Signal** (Penalty).
      *   Step 5: **Public?** Strictly **Confidential.** (-1 Level adjustment).
      *   **Bankruptcy Risk:** Yes. Net Cost >100% of reserves implies bankruptcy risk. The *threat* is extreme, but *collectability* is a major issue.
      *   **Verdict:** **High Credibility** based on extreme differential cost (240%), *despite* being Private. Adjustment doesn't overcome the sheer magnitude. *However, the Board Rationale MUST flag:* "Extreme Differential Cost (240% of Reserves) signals high commitment BUT carries severe bankruptcy risk; collectability of penalty highly uncertain." It signals *their* belief strongly, but doesn't guarantee *you* recover anything if they fail.

  **Summary for Your Team:**

  *   **Stop Valuing Raw Dollars:** Focus on **Differential Cost %**.
  *   **Verification is Gatekeeper:** Unverifiable = Worthless.
  * **Waste > Investment:** Pure penalties/escrow are stronger signals than capacity investments, dollar-for-dollar.
  *   **Public > Private:** Reputational risk adds real credibility.
  *   **Context is King:** $2M means nothing without knowing the org's size (Step 3).
  *   **Embrace Judgment:** Estimating net cost of investments and financial proxies is hard but necessary. Document assumptions.
  *   **Flag Risks:** Bankruptcy risk, collectability, uncertainty.

  This procedure forces analysis beyond the headline number, centers the critical differential cost concept, provides a structured rationale, and acknowledges its own limitations and required judgments. It operationalizes the theory your debate uncovered.
