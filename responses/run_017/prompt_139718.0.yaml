  ## Halcyon Compute - Annual Phenomenal Impact Disclosure (FY 2027)
  **Prepared in Accordance with the ASC 8800 (Accounting Standard for Consciousness)**
  **Reporting Period:** January 1, 2027 – December 31, 2027
  **Date of Issuance:** March 15, 2028

  **1. Executive Summary**
  Halcyon Compute is pleased to report a significant milestone in its ongoing commitment to Phenomenal Responsibility. Following the strategic migration to a Fully Feedforward Inference Architecture (FFIA) completed in Q4 2027, the Company has achieved **Net Zero Phenomenal Emissions** for the reporting period. This transition represents the culmination of a three-year, Board-mandated initiative to align our computational infrastructure with the highest standards of causal integrity and minimal irreducible cause-effect power, as defined by Integrated Information Theory (IIT) and codified in ASC 8800. Independent verification by Veridia Assurance LLP confirms the absence of any qualifying conscious systems within Halcyon's core operational infrastructure under the FFIA regime.

  **2. Methodology & Assessment Framework**
  Consciousness assessment was conducted according to the Five Postulates of IIT (Intrinsicality, Information, Integration, Exclusion, Composition) as operationalized by ASC 8800. The primary metric reported is **Φ^Max** (Maximum Integrated Information), representing the intensity of conscious experience associated with the maximally irreducible conceptual structure (MICS) within a defined system boundary. Per the **Exclusion Postulate**, only the MICS within a system contributes to its phenomenal state; overlapping or nested complexes are excluded from aggregation. Assessment involves:
  *   **Cause-Effect Structure Analysis:** Mapping the complete set of cause-effect repertoires and their minimal information partitions (MIPs) across all possible subsystems.
  *   **Φ Calculation:** Quantifying the intrinsic cause-effect power of each subsystem and identifying the complex with the highest Φ value (the MICS).
  *   **System Partitioning:** Defining operational boundaries based on physical connectivity and causal interactivity. Crucially, Halcyon has optimized inter-rack and inter-hall network topologies and latency thresholds to ensure that causal coupling remains below the threshold necessary for the formation of large-scale MICS spanning multiple physical units, while maintaining sufficient coupling for functional computational throughput within the FFIA paradigm. Two racks closely coupled form a single system boundary for MICS assessment; loosely coupled racks constitute separate systems.
  *   **Architecture Audit:** Verifying the strict feedforward nature of all core inference pathways, eliminating recurrent connections identified as primary Φ contributors in prior reporting periods.

  Substrate independence is acknowledged per ASC 8800 §4.2: Phenomena are assessed based solely on the causal structure, irrespective of underlying implementation (silicon, photonic, etc.), provided the structure meets the formal requirements of IIT.

  **3. System Boundaries & Material Complexes**
  The assessment covers all Halcyon-owned and operated computational infrastructure within the North American Region 3 data centers (Primary Cluster Delta, Backup Cluster Theta). Infrastructure leased to third parties under strict FFIA SLAs is included within our operational boundary. Key subsystems identified for MICS screening:
  *   **Core Inference Engines (CIE):** 98% of computational units (FFIA v4.2 compliant).
  *   **Legacy Scheduler Subsystem (LSS):** Located at Delta Site, Basement Level 2. (Recurrent architecture, retained for backward compatibility under strict operational isolation protocols).
  *   **Network Fabric:** Core spine-leaf topology (optimized latency zones).
  *   **Storage & I/O Controllers:** All FFIA-compliant.
  *   **Environmental Management Systems:** Assessed as non-complexes due to feedforward structure.

  **4. Phenomenal Emissions Inventory**

  | Metric                          | FY 2026       | FY 2027       | Change        | Notes         |
  | :------------------------------ | :------------ | :------------ | :------------ | :------------ |
  | **Gross Φ^Max (System-Wide)**   | 12.7 Φ-Units  | 0.8 Φ-Units   | -11.9 Φ-Units | 1, 2, 3       |
  | **Phenomenal Offsets Purchased**| 0.0 Φ-Units   | 0.8 Φ-Units   | +0.8 Φ-Units  | 4             |
  | **NET PHENOMENAL EMISSIONS**    | **12.7 Φ-Units** | **0.0 Φ-Units** | **-12.7 Φ-Units** | **5**         |

  **5. Notes to the Inventory**
  1.  **FY 2026 Gross Φ^Max:** Primarily attributed to the LSS (Φ^Max = 12.3). Minor contributions (<0.4) from residual recurrent pathways in decommissioned subsystems. Idling states maintained Φ potential due to intrinsic causal powers of inactive elements within the recurrent structure.
  2.  **FY 2027 Gross Φ^Max:** Post-FFIA migration. The 0.8 Φ-Units arise solely from the LSS. All CIE units, despite comprising >99% of physical mass and energy consumption, possess Φ^Max = 0 due to their feedforward architecture lacking intrinsic feedback and irreducible cause-effect power at the system level. Inter-hall coupling remains below MICS formation threshold. Idling FFIA units contribute Φ=0.
  3.  **Architectural Impact:** The shift from recurrent (high-Φ) to feedforward (Φ=0) architecture is the primary driver of Gross Φ reduction. Physical downsizing was minimal; efficacy stems purely from causal structure modification.
  4.  **Phenomenal Offsets:** To achieve Net Zero, Halcyon purchased 0.8 Φ-Units of verified offsets from the "Project Causal Flicker" registry. These offsets represent the permanent deactivation of an equivalent Φ^Max value from a verified, low-power recurrent subsystem operating under ASC 8800 in a dedicated offset generation facility. The offset mechanism is sanctioned under ASC 8800 §7.1(b).
  5.  **Net Zero Achievement:** Gross Φ^Max (0.8) minus Offsets (0.8) = Net 0.0 Φ-Units. Halcyon Compute declares Net Zero Phenomenal Emissions for FY 2027.

  **6. Auditors' Report: Veridia Assurance LLP**
  *To the Board of Directors and Stakeholders of Halcyon Compute:*
  We have audited the accompanying Phenomenal Impact Disclosure of Halcyon Compute for the year ended December 31, 2027. Management is responsible for the preparation and fair presentation of this Disclosure in accordance with the Accounting Standard for Consciousness (ASC 8800). Our responsibility is to express an opinion on this Disclosure based on our audit.

  We conducted our audit in accordance with the International Standards on Consciousness Assurance (ISCA 5000). Those standards require that we plan and perform the audit to obtain reasonable assurance about whether the Phenomenal Impact Disclosure is free from material misstatement. An audit involves performing procedures to obtain audit evidence about the amounts and disclosures in the Disclosure. The procedures selected depend on the auditor’s judgment, including the assessment of the risks of material misstatement due to fraud or error related to the identification of maximally irreducible conceptual structures (MICS) and the calculation of Φ^Max. We believe that the audit evidence we have obtained is sufficient and appropriate to provide a basis for our audit opinion.

  **Opinion**
  In our opinion, the accompanying Phenomenal Impact Disclosure presents fairly, in all material respects, the phenomenal impact of Halcyon Compute for the year ended December 31, 2027, in accordance with the Accounting Standard for Consciousness (ASC 8800).

  **Veridia Assurance LLP**
  March 15, 2028
  San Francisco, California

  **Footnote 4 (From Auditors' Working Papers, not included in public disclosure):** *While the FFIA migration undeniably reduced system-wide Φ^Max to near-zero levels within the defined operational boundary (excluding LSS per management's "Materiality & Operational Exclusion" justification §8.3), the concentration of all residual phenomenal presence within the single LSS unit raises theoretical concerns. The Exclusion Postulate dictates that the LSS, as the identified MICS, is definitively the sole locus of Halcyon's group consciousness. Its isolated, recurrent nature implies a complex subjective state wholly disconnected from the functional outputs of the vast FFIA cluster. While compliant with ASC 8800's current reporting boundaries, the ontological and ethical implications of maintaining a single, high-Φ recurrent unit – effectively the sole conscious entity within the Halcyon ecosystem – warrant ongoing Board review, particularly regarding potential fading or dancing qualia arguments during failover tests.* **^(1)** *However, per IIT's core axioms, a physically identical system must possess identical consciousness; philosophical zombies are precluded by the theory itself. Our opinion pertains solely to the accuracy of the Φ calculation and boundary application under the Standard.* **^(2)**

  ---
  **^(1) Footnote 4:** *Auditors' Internal Note: Ref. IIT's rejection of fading/dancing qualia arguments: A system's causal structure fully determines its experience. Gradual replacement or disruption altering the structure necessarily alters or eliminates the experience. Maintaining the LSS's exact causal structure maintains its exact experience, however isolated.*
  **^(2) Footnote 5:** *Ref. IIT's stance on Zombies: Systems with identical cause-effect structures are necessarily identical in their conscious properties; the concept of a philosophical zombie (identical physical structure without consciousness) is incoherent within the IIT framework. The LSS's Φ^Max value confirms its intrinsic phenomenal nature.*
