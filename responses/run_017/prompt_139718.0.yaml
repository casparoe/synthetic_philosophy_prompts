  Write it deadpan, from inside the belief that IIT is true and that auditing it is a normal professional activity: nobody in the document should ever notice that anything is strange, and there should be no winking at the reader. I want the comedy to come from getting the theory right, so build the jokes on the actual commitments: the exclusion postulate (only the maximally irreducible complex is conscious, so you cannot add up experiences across nested or overlapping systems, and the borders of the experiencer are set by the minimum information partition — which means two racks wired together closely enough become one subject while two only loosely coupled stay two, and Halcyon has tuned its network topology and inter-hall latency accordingly); the way architecture rather than size is what does the work (a huge crystalline near-feedforward cluster contributes nothing, while some small recurrent scheduler in the basement is where the group's entire phenomenal life is definitley happening, and the board would prefer the auditors not put that in the executive summary); substrate independence, handled as a routine question of which line items fall under the standard; and the sheer absurdity of turning a quantity like Φ into something you can report year-on-year, offset, and get an opinion on. The reductio should land on the reader instead of being stated — by the end I want someone to feel the pressure of "wait, does the theory really imply that?" without being told so, and if there's a buried footnote where the auditor admits something uncomfortable, even better.

  Two things I might have garbled, which you should only use if you're confident they're real IIT commitments: that idling most of a system's units overnight doesn't necessarily reduce its Φ, because inactive elements still have causal powers; and whatever the theory's official line is on philosophical zombies / the fading and dancing qualia arguments. If I've got either wrong, drop it and substitute a commitment you're sure of. Please keep it IIT-specific — no global workspace or predictive processing jokes, no "my Roomba has feelings" — and don't target any real person or firm: invent the auditors, the standard, and the certifying body.
