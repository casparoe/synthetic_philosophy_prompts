prompt: |-
  I do advance care planning at a community mental health clinic — the psychiatric kind, where somebody who's doing okay right now writes down what should happen the next time they aren't. I'm the one who sits with them and drafts it; a psychiatrist signs off on the clinical bits but honestly she rubber-stamps whatever I put in front of her. I've done maybe three hundred of these over four years, fourty minutes a session, and I also get the 2am call from the ER when one of these documents is the only thing anybody has to go on. So: high stakes, almost no time, and the person applying it is often a resident who has never met the client.

  The story I absorbed from rationalist blog posts years ago is too crude for what I actually see. It says: the person who wrote the document is the real agent, the person in the room is impaired, so the document wins. But the hard cases dont look like that. From the spreadsheet I keep, they split into at least four different things. (1) Plain capacity dips — the person can't reason right now and thanks us later. Easy, maybe sixty percent of calls. (2) Value drift — they're reasoning fine, they've just changed their mind, and they say the old self was scared, or brainwashed, or just wrong. Sometimes they're right! (3) New information — a reason the earlier self never weighed: a side effect that showed up years later, a new diagnosis, a baby, a breakup. The earlier self didn't reject this reason, they never heard it. (4) Trigger gaming — the earlier self wrote a precise trigger and the current self stays just inside it: four hours of sleep instead of three, gives away two hundred dollars instead of whatever the number was, refuses without quite using the words the document keys on. Technically it hasn't fired. And then there's a pattern I only noticed recently: some directives bind the outcome (force the shot if I say no) and some only bind the process (call my sister, make me wait a day, don't let me sign anything), and the process ones basically never blow up in my face.

  What I want is a procedure, not a theory dump. Ordered questions I can run in a session or in ninety seconds on the phone; what counts as a good enough answer to each; where the procedure just stops and says no, honor the document (or no, ignore it); and where it has to hand the decision to a human being because the question is values, not facts. Tell me what to do when I can't get an answer — client won't articulate reasons, nobody who knew them is reachable, it's 2am. Assume I have no philosophical training and I have to be able to explain the result to a sibling who thinks I steamrolled their brother. Please don't give me a reading list; I know the Ulysses stuff and the precommitment discourse, I need something I can run.

  Then run it on three. (A) A client with bipolar I whose directive says treat me as unable to refuse meds if I've slept under four hours for three nights and I'm giving money away. She's on night two, maybe four hours, gave two hundred bucks to a church raffle, perfectly coherent, refusing. Does the trigger fire? (B) A directive written eleven years ago by someone who has since had a serious religious conversion and now says the person who wrote it was a different and worse person and wants the whole thing voided — coherent, not manic, sober. Do I void it? (C) Different scale: our clinic adopted a policy in 2016 after a bad incident, never call the police on a patient, and the same policy made repeal require a two-thirds vote. Everybody currently on staff thinks it's too strong and it's never been repealed. Last week a patient broke a nurse's arm. Does the policy bind us, and is the group case even the same shape as the individual one or am I importing the wrong analogy?

  One of those should give me an answer I don't like. I'd rather have that than a rule that always sides with the earlier self. And be straight about what the procedure can't do, where it'll misfire, and the cheapest way to catch a misfire before it hurts somebody — an expiry date, a re-signing ritual, a single question I always have to ask.
reasoning: |-
  We are designing a practical procedure for handling advance care directives in mental health crises, considering the complexities described: capacity dips, value drift, new information, trigger gaming, and the distinction between outcome-binding and process-binding directives.

  The procedure must be:
  - Executable in a session (40 min) or in 90 seconds on the phone.
  - Provide clear steps with criteria for when to honor the directive, when to ignore it, and when to involve human judgment.
  - Include fallbacks for when information is missing (client won't articulate, no contacts, 2am).
  - Explainable to family.

  We'll build a decision tree with ordered questions. The goal is to maximize the client's autonomy over time, recognizing that both the past and present selves have valid claims.

  Key principles from the description:
  1. Process-binding directives (like "call my sister") are safer and less prone to blow up.
  2. We are wary of trigger gaming and value drift but also acknowledge that new information and genuine change can occur.

  Procedure Outline:

  I. Initial Check (for when a directive exists and a crisis is occurring):
     Step 1: Is the current situation covered by the directive? (If not, directive doesn't apply -> handle without it.)
     Step 2: Is the trigger met? (Be cautious of trigger gaming: if the trigger is met exactly or nearly, but the client is gaming, we might still consider the directive. However, we must avoid oversteering.)

  But we need a deeper evaluation when the trigger is met or nearly met and the client is refusing.

  II. Core Evaluation (when trigger is met and client refuses care):
     We have to decide whether to override current refusal based on the directive.

     Step 3: Check for immediate danger or irreversible harm if we delay. If yes, we may need to act immediately (e.g., give meds) and then do the evaluation. But note: the directive might have been designed to prevent this.

     Step 4: Evaluate current capacity. This is critical. We use a capacity assessment (ability to understand, appreciate, reason, and communicate a choice) focused on the decision at hand. If capacity is impaired, honor the directive. If capacity is intact, we move to the next step.

     However, note that the directive was written precisely for when capacity might be fluctuating. So we must be cautious.

     Step 5: If current capacity is intact, we then consider:
        a. Is there new information that the past self did not and could not reasonably have considered? (e.g., new medical knowledge, major life change). If yes, then the directive might not apply because the situation is fundamentally altered. We must then make a judgment call about the new information.
        b. If no new information, we ask: has there been a stable and enduring change in values (value drift)? This is tricky. We look for:
            - How long has the change been present? (A recent conversion vs. years of changed behavior?)
            - Is the change consistent with the person's life and other choices?
            - Is the change supported by evidence of reflection and without evidence of impairment?

     Step 6: If either new information or a stable value drift is present, we may decide not to follow the directive. But note: the directive might have anticipated value drift and explicitly stated to override it. However, the directive cannot bind future values absolutely.

     Step 7: Consider the type of directive:
          - Outcome-binding (e.g., "force the shot") vs. process-binding (e.g., "call my sister").
          - Process-binding directives are generally safer to follow and less intrusive. They should be followed even if there is some doubt because they allow for more conversation and time.
          - For outcome-binding, we require a higher threshold to override current refusal (like clear evidence of impairment or absence of new information and value drift).

     Step 8: If after these steps we are still uncertain, we default to the directive? Or do we default to current refusal? Given the stakes and the fact that the directive was made in a state of capacity, we might lean toward the directive unless there is strong evidence that it shouldn't apply.

  But the user also notes that sometimes the current self is right.

  III. Fallbacks for Missing Information:
     - If the client won't articulate reasons: try to get any collateral information (family, friends, past records). If none, and it's 2am, we must make a decision. We consider the risk of harm. If the directive is outcome-binding and the trigger is met, we follow it. If it's process-binding, we follow the process and delay the outcome decision if possible.
     - If no one is reachable: same as above.

  IV. Expiry and Review:
     We note that directives should have a built-in review mechanism. The procedure should require that every directive is reviewed at least every 2 years (or a time frame set by the client) and after major life events. This is the cheapest way to catch problems.

  Now, let's formalize the procedure as a flowchart of questions.

  Procedure: Advance Directive Crisis Evaluation (ADCE)

  When a crisis occurs and a directive exists:

  1. Is the current situation within the scope of the directive? (Does the trigger description match the current situation?)
     - If no, the directive does not apply. Handle without it.
     - If yes, proceed.

  2. Is the trigger met? (Be careful: if the trigger is almost met and there's evidence of gaming, note it but proceed to step 3. We don't override the trigger definition arbitrarily.)
     - If no, the directive does not fire. Handle without it.
     - If yes, proceed.

  3. Is there immediate danger of serious irreversible harm if we do not act now? (e.g., risk of death, severe injury, irreversible deterioration)
     - If yes, and the directive mandates an action to prevent that harm, then act immediately (override current refusal if necessary) and then proceed to evaluate the directive's ongoing validity after stabilization.
     - If no, proceed.

  4. Assess current decision-making capacity for the specific treatment decision at hand (e.g., refusing meds). Use your standard capacity assessment (understanding, appreciation, reasoning, expressing a choice).
     - If capacity is impaired: Honor the directive (override current refusal).
     - If capacity is intact: Proceed to step 5.

  5. Check for new information: Is there any significant new fact or circumstance that the past self could not have reasonably known or anticipated, and that would have likely changed the past self's decision?
     - Examples: new diagnosis, new treatment options, significant side effects that were unknown, major life event (birth, death, divorce) that alters the context.
     - If yes, then the directive may not apply. Do not override current refusal. Instead, involve the client in a new decision. (But note: if the directive included a clause for new information, follow that. However, typically it doesn't.) Proceed to step 7 for further handling.
     - If no, proceed to step 6.

  6. Check for value drift: Is there evidence of a stable and enduring change in the client's core values that underlies the directive? (This is not just a change in preference but a fundamental shift in what matters to them, and it must be stable and not due to an acute episode.)
     - Criteria for stability: The change has been present for a significant time (e.g., at least 6 months to a year) and is consistent across different areas of life. It should be supported by evidence (e.g., the client can articulate the change, and it's documented in recent clinical notes).
     - If yes, then the directive may not apply. Do not override current refusal. Instead, involve the client in a new decision. (But note: the directive might have explicitly addressed the possibility of value drift. If it says "even if I change my mind", then we must weigh that. However, we cannot bind future values absolutely, so we still might not override if the change is stable and the capacity is intact.)
     - If there is no evidence of stable value drift, then honor the directive (override current refusal).

  7. If either step 5 (new information) or step 6 (value drift) led us to disregard the directive, we then consider:
     - Can we use a process-binding approach (like calling a family member, waiting 24 hours) to allow for more reflection? If so, do that and reassess.
     - If the situation is urgent and we cannot delay, then we must make a judgment call: without the directive, what is in the client's best interest? (This is a fallback and should be rare.)

  8. If at any point we cannot determine an answer (e.g., missing information, ambiguous evidence), we default to the directive if it is process-binding (because it's low risk) but for outcome-binding, we default to the directive only if there is evidence of impaired capacity (from step 4) or if the risk of harm is high. Otherwise, we default to current refusal.

  Additionally, we build in safeguards:
     - Every directive must have a review date (e.g., every 2 years) and a mechanism to update after major life events. At the time of signing, we ask: "What would be a sign that this directive should be reviewed?" and document that.
     - We always ask one key question during the drafting session: "What if your future self disagrees with this directive? How should we handle that?" and document the answer.

  Now, apply to the cases:

  Case A:
    Client: Bipolar I. Directive: treat as unable to refuse meds if slept under 4 hours for 3 nights and giving money away.
    Current: night two (so not three), slept maybe 4 hours (borderline), gave $200 to church raffle, coherent, refusing.

    Step 1: Situation is within scope? Yes, it's about sleep and giving money.
    Step 2: Trigger met? No. The trigger requires 3 nights of under 4 hours and giving money away. She has only 2 nights and the giving money is present. So trigger not met.
    Step 3: Immediate danger? We don't have information about immediate danger. If she is coherent and only on night two, maybe not. But note: bipolar mania can escalate. However, without meeting the trigger, we cannot force meds. We can only use standard crisis evaluation without the directive.

    But note: the trigger is not met. So we do not invoke the directive. We treat her as having capacity to refuse unless standard capacity assessment (step 4) shows impairment. We might be concerned about trigger gaming (she gave $200 but maybe the directive had a higher amount). However, the trigger is clear. We must not move the goalpost.

    Therefore: Directive does not fire. We do not force meds. We monitor and if she meets the trigger tomorrow, then we reassess.

  Case B:
    Directive written 11 years ago. Client now has a serious religious conversion, coherent, not manic, sober. Says the past self was a different and worse person and wants the whole thing voided.

    We are not in a crisis? But the client is asking to void the directive proactively. However, the procedure above is for when a crisis occurs and the directive is invoked. But we can adapt.

    For voiding outside of crisis: 
      We evaluate:
        - Is there new information? The conversion might be new, but it happened in the past and is now stable.
        - Value drift: The client has had a fundamental change in values. We must check for stability. Since it's a serious conversion and the client is coherent, and it's been some time (we don't know how long, but 11 years is a long time and the conversion is not recent? We need to know when the conversion happened). 

    However, for advance directives, we generally allow the client to revoke or change the directive at any time when they have capacity. So if the client currently has capacity, they can void the directive. We don't need to rely on the procedure above because there's no crisis. We just update the directive.

    But note: the directive might have a clause about revocation. Typically, they can be revoked by the person at any time with capacity.

    Therefore: We void the directive. The client has capacity and wishes to revoke. We document the new values and help draft a new one if they wish.

  Case C:
    Clinic policy (not an individual directive): never call the police on a patient, and repeal requires two-thirds vote. Everyone currently on staff thinks it's too strong. Last week a patient broke a nurse's arm. Does the policy bind? And is the group case analogous?

    This is different because it's a group policy, not an individual advance directive. But the user asks if it's the same shape.

    Similarities: 
      - It's a precommitment by a group (past group) to bind future actions.
      - The current group has changed its mind (value drift?).

    Differences:
      - The policy was made by a group that included people who may have left, and the current group is different.
      - The policy has a built-in mechanism for change (two-thirds vote). So it's not irrevocable.

    Applying the analog:

      Step 1: Is the situation covered? The policy says never call police, and an assault occurred -> covered.

      Step 2: Trigger met? Yes, an incident occurred where one might consider calling police.

      Step 3: Immediate danger? After the fact, the patient is contained? But the nurse's arm is broken, so the incident has occurred. However, the policy might be intended for future incidents. The question is: in a future incident, must we never call the police?

      We are now re-examining the policy in light of a violation and an injury.

      Step 4: The group currently has capacity? They are a group of professionals. They are capable of re-evaluating.

      Step 5: New information? The incident (broken arm) is new information that the past group might not have considered? Or they did, but they still made the policy.

      Step 6: Value drift? The current staff thinks the policy is too strong. This is a change in values. But note: the policy has a built-in procedure for change (two-thirds vote). So we should use that.

    Therefore: The policy binds until it is repealed by the established procedure. The group should hold a vote. If they get two-thirds, they change it. If not, they follow it.

    However, note: the policy says "never", but if there is an immediate danger that cannot be contained by clinic staff, then the policy might lead to harm. We must consider that the policy might have been designed for typical situations but not for a violent assault? 

    But the procedure for change is there. They should try to repeal it. In the meantime, if a violent incident occurs, they might have to break the policy to prevent serious harm. But that would be a violation and might require an emergency meeting.

    The analogy: 
      - The policy is like an outcome-binding directive for the group. 
      - The group has a procedure to amend (like a process-binding element). 

    So the group must follow their own process. They cannot ignore the policy without meeting the repeal threshold.

    However, if there is an ongoing incident and the policy would prevent calling the police when someone is in immediate danger, then they might have to override the policy to prevent harm (like step 3 in the individual procedure). Then, after the fact, they must review the policy and vote.

  Answer to Case C: The policy binds until repealed by two-thirds vote. In an emergency where there is immediate danger and no other option, they may break the policy and then immediately start the repeal process.

  One of these answers might be disliked: Case A might be disliked because the client is on night two and might be escalating, but we cannot force meds. Case C might be disliked because it forces the clinic to follow a policy they think is bad until they can repeal it.

  The procedure can misfire in situations where:
     - There is value drift that is not stable but we mistake it for stable (or vice versa).
     - We fail to recognize trigger gaming that is actually a change in the client's condition that the trigger didn't capture.

  The cheapest safeguard is a mandatory review of the directive every 1-2 years and after major life events. Also, during drafting, we always ask: "What if your future self disagrees? How should we weigh that?" and document the answer.

  Finally, the procedure is not a substitute for clinical judgment. When in doubt, consult with a colleague or supervisor.

  This procedure is designed for high-stakes, time-limited situations and aims to balance the autonomy of the past and present selves.
answer: |-
  Below is a practical, step-by-step procedure designed for your real-world constraints: high stakes, minimal time, no philosophical background required, and explainable to families. It prioritizes **safety**, **autonomy over time**, and **pragmatism** based on your observed patterns (capacity dips, value drift, new information, trigger gaming). It includes fallbacks for missing information and flags where human judgment is unavoidable.

  ---

  ### **Advance Directive Crisis Procedure (ADCP)**  
  **When to use:** During a session (40 min) or a crisis call (90 sec) when a directive exists and may apply.  
  **Core principles:**  
  1. **Process-binding > Outcome-binding:** Process directives (e.g., "call my sister") are safer and build in time/input. Default to these when possible.  
  2. **Capacity is king:** If current capacity is impaired, the directive usually wins. If intact, scrutinize why the directive might not apply.  
  3. **Time matters:** If irreversible harm is imminent, act immediately (per directive or clinical judgment).  
  4. **Checks against misfires:** Always ask one key question during drafting (see **Safeguards**).  

  **Ordered Questions & Actions:**  
  Run these sequentially. Stop and act if you hit a terminal answer (✅ or ❌).  

  1. **IS THE TRIGGER MET?**  
     - **Check:** Does the current situation match the trigger’s *exact wording*?  
     - **✅ Yes, met:** Go to #2.  
     - **❌ No, not met:** Directive does not apply. Handle clinically without it.  
     - **⚠️ Borderline (gaming?):**  
       - If the trigger is outcome-binding (e.g., "force meds"), treat as ❌ *not met* (gaming likely).  
       - If process-binding (e.g., "call my therapist"), treat as ✅ *met* (low risk).  
     - *No answer?* (e.g., vague trigger): Assume ❌ not met.  

  2. **IS THERE IMMINENT RISK OF IRREVERSIBLE HARM?**  
     - **Check:** Could delay cause death, severe injury, or permanent decline? (e.g., psychosis leading to self-harm).  
     - **✅ Yes:** Act immediately per directive. If directive is unclear/outdated, use clinical judgment. *Then* go to #3.  
     - **❌ No:** Go to #3.  
     - *No answer?* (e.g., ambiguous risk): Proceed to #3 but document uncertainty.  

  3. **IS CURRENT CAPACITY IMPAIRED?**  
     - **Check:** Can the person *understand, appreciate, reason, and communicate* a choice about their care? Focus on the *current decision* (e.g., refusing meds). Use a simple 4-item scale (e.g., MacCAT-T).  
     - **✅ Yes, impaired:** Honor the directive. Override current refusal if needed.  
     - **❌ No, intact:** Go to #4.  
     - *No answer?* (e.g., can’t assess): Default to honoring the directive if outcome-binding and risk is high (#2); otherwise, ❌ do not invoke.  

  4. **IS THERE NEW INFORMATION OR STABLE VALUE DRIFT?**  
     - **Check:**  
       - **New info:** Did something happen the *past self couldn’t foresee*? (e.g., new diagnosis, severe side effect, major life event like having a child).  
       - **Value drift:** Has the person had a *stable, enduring change* in core values? (e.g., religious conversion, sustained lifestyle shift). Ask: "Is this change consistent over 6+ months?"  
     - **✅ Yes (either):** ❌ Do not follow the directive. Handle clinically. *Optional:* Use process-binding steps (e.g., "wait 24h") to gather input.  
     - **❌ No:** Honor the directive.  
     - *No answer?* (e.g., family unreachable at 2am):  
       - If outcome-binding, ❌ do not follow (too risky without clarity).  
       - If process-binding, ✅ follow it (e.g., "call sister" → leave voicemail).  

  5. **DOCUMENT & DEBRIEF**  
     - Always document: Why directive was/wasn’t followed, capacity assessment, and collateral used.  
     - Debrief later: Review with client/family when stable to update the directive.  

  ---

  ### **Safeguards Against Misfires**  
  - **Mandatory re-signing ritual:** Directives expire every **2 years** (or after major life events). Lapse = not valid.  
  - **The one question you always ask during drafting:**  
    > *"If your future self disagrees with this plan, what should we prioritize: your past wishes or your current choices? How can we tell the difference?"*  
    Document their answer verbatim. Use it in #4.  
  - **Misfire hot spots:**  
    - Value drift without collateral (e.g., no family to verify stability).  
    - Trigger gaming in outcome-binding directives.  
    - **Catch these by:** Requiring 1+ collateral contact in all directives and annual check-ins.  

  ---

  ### **Run the Procedure on Your Cases**  
  **Case A: Bipolar I client, trigger almost met**  
  - Trigger: "Slept under 4 hours for 3 nights + giving money away."  
  - Now: Night 2, slept ~4 hours, gave $200, coherent, refusing.  
  - **ADCP:**  
    1. Trigger met? ❌ No (requires 3 nights). Borderline → but outcome-binding, so treat as ❌ not met.  
    2. Irreversible harm? Unclear → go to #3.  
    3. Capacity intact? ✅ Yes (coherent). → Go to #4.  
    4. New info/value drift? No evidence → ❌ Directive not invoked.  
    **Result:** Do not force meds. Monitor for trigger.  

  **Case B: Religious conversion, void directive?**  
  - Directive: 11 years old. Current self: Coherent, not manic, stable conversion, wants void.  
  - **ADCP** (adapted for non-crisis):  
    1. Trigger not in play → skip to #4.  
    4. Value drift? ✅ Yes (stable conversion → "different person" claim plausible).  
    **Result:** ❌ Void the directive. Current capacity intact + stable values = autonomy wins. Draft a new directive.  

  **Case C: Clinic policy, no police call after assault**  
  - Policy: "Never call police," repeal requires 2/3 vote. Staff want change. Patient broke nurse’s arm.  
  - **ADCP analog (group precommitment):**  
    1. Trigger met? ✅ Yes (patient violence).  
    2. Irreversible harm? ✅ Yes (future violence likely). → Act per policy? But policy prevents action → conflict. Proceed to #3.  
    3. "Group capacity" intact? ✅ Yes (staff agree policy is flawed). → Go to #4.  
    4. New info/value drift? ✅ Yes (broken arm = new info; staff consensus = value drift).  
    **Result:** ❌ Do not follow policy. Call police if needed for safety. *But* policy’s repeal clause binds: Hold a vote ASAP. If 2/3 repeal, change policy. If not, uphold it.  
  - **Same shape as individual?** Partially. Groups are *less* binding:  
    - No "capacity" in crisis (group can always deliberate).  
    - Precommitments require democratic override (unlike individual autonomy).  
    **Key difference:** Policies need built-in sunset clauses (e.g., automatic review every 3 years).  

  ---

  ### **Where the Procedure Fails (and How to Mitigate)**  
  - **Fails when:**  
    - No collateral exists to verify value drift (#4).  
    - The directive is outcome-binding and gaming is subtle (e.g., patient manipulates sleep logs).  
    - Staff ignore safeguards (e.g., skip re-signing).  
  - **Mitigate by:**  
    - Requiring 1+ collateral contact for all directives.  
    - Using process-binding directives where possible (e.g., "wait 12h + consult X").  
    - Annual check-ins (even 5 min: "Still agree with your directive? Any life changes?").  

  **One hard answer:** In Case A, the procedure doesn’t force meds, even if you suspect mania is escalating. This protects against gaming but risks harm. Balance by:  
  - Adjusting triggers post-crisis (e.g., "2 nights of poor sleep + any money gifts").  
  - Adding a process step (e.g., "If trigger almost met, call sister before acting").  

  This gives you a concrete, runnable system—grounded in your experience—that avoids theory and focuses on action.
