prompt: |-
  so my friend and I spent like two hours last night going in circles about wether you can ever say someone is wrong about their own welfare. The case we kept coming back to: a woman in a village where girls dont get schooled, who says sincerely and without anyone threatening her that she doesn't want schooling — she's never seen a woman read, she'd lose standing at home, and when asked she ranks staying home above school. I said that's a case where her choice doesn't settle whether she's better off. He said: de gustibus non est disputandum, plus what he called the "choice-only rule" — utility just *is* whatever ordering makes sense of your choices, so "she's wrong about her own welfare" isn't false, it's incoherent, there's nothing there to be wrong about, and any intervention on her ranking is straight paternalism. I said fine, but then even someone who never got the chance to learn to want the thing counts as doing great — call that the learning-to-want problem. He said just test it counterfactually, would she choose it if she'd had the option. I said the person in that counterfactual is a different person. Etc, for two hours.

  Can you lay out, as a table, the distinct precise claims the slogan could be making here — about tastes, about what utility means, about what counts as evidence, about paternalism — with a verdict on each (trivial, defensible, false, or a definitional fiat dressed up as a finding), and say which one his argument actually needs? Last line, machine readable: Verdict: [number of the reading doing the real work for him, or "none — it's fiat all the way down"].
