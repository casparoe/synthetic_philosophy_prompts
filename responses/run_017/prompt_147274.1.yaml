  - CDT: refuse. Reasoning: the windfall is already determined and not affected by the action. Paying only costs $1000.
  - EDT: refuse. Reasoning: the expected utility of paying: we condition on the request and the action. The possible states are: (heads and read "no") or (tails and read "yes"). Given that you pay, the probability of being in the heads state is 0.3 (because P(R="no"|pay)=0.3) and tails state 0.7. So EU(pay)=0.3*(5000-1000)+0.7*(-1000)=0.3*4000 - 700=1200-700=500. For refuse: given you refuse, the probability of heads state is 0.7 (because P(R="no"|refuse)=0.7) and tails state 0.3. So EU(refuse)=0.7*5000 + 0.3*0=3500. So 3500>500.
  - FDT: refuse. Reasoning: the expected utility of the decision procedure outputting "pay": 0.5 * [0.3*(5000-1000) + 0.7*5000] (heads) + 0.5 * [0.7*(-1000) + 0.3*0] (tails) = 0.5*[0.3*4000+3500] + 0.5*[-700] = 0.5*(1200+3500) + 0.5*(-700) = 0.5*4700 - 350 = 2350 - 350 = 2000. For "refuse": 0.5*5000 (heads) + 0.5*0 (tails) = 2500. 2500>2000.

  Note: In Setting B, the EDT calculation is different from the FDT calculation because EDT conditions on the action (and hence the distribution of R) and the state, while FDT considers the counterfactual across the two branches.

  The feature doing the work: In Setting A, FDT pays because it cares about the outcome in the heads branch (which doesn't happen) but which would have been affected by the read (which is correlated with the decision procedure). This is similar to the counterfactual mugging: you are asked to pay in a branch that didn't occur (tails) in order to have benefited in the branch that did occur (heads) if it had occurred. However, note that in the heads branch, you don't pay (because request is not made) and you get the windfall only if the read was "yes". By having a disposition to pay, you make the read more likely to be "yes", so you get the windfall in the heads branch. So in a sense, you are being "mugged" in the tails branch for the benefit you would have received in the heads branch.

  In Setting B, the structure is that of XOR blackmail: the request is made in exactly the cases where either (heads and read "no") or (tails and read "yes"). In the heads branch, if the read had been "yes", the request would not have been made and you would have gotten the windfall without paying. But because the read was "no", you are being asked to pay. In the tails branch, if the read had been "no", the request would not have been made and you wouldn't have to pay. But because the read was "yes", you are being asked. So the request is made when the read and the coin are different. This is the XOR pattern. FDT refuses because paying would not lead to a desirable outcome in the counterfactual branches: in the heads branch, paying only happens when the read was "no" (so you don't get the windfall without being asked) and you end up paying. And in the tails branch, paying happens when the read was "yes", which leads to a loss.

  Tipping-point computation for FDT in Setting A:

  We had: pay is better if 0.35W - 500 > 0.15W  => 0.2W > 500 => W>2500.

  At W=2500, FDT is indifferent. For W>2500, FDT pays. Our chosen W=5000>2500.

  If the accuracy drops below 0.7, then the tipping point changes. Let the accuracy be p (so P(R="yes"|pay)=p, P(R="no"|refuse)=p). Then:

  FDT for paying: 0.5 * [p * W + (1-p)*0] + 0.5 * (-1000) = 0.5 p W - 500
  FDT for refusing: 0.5 * [(1-p)*W] = 0.5(1-p)W

  Pay is better if: 0.5 p W - 500 > 0.5(1-p)W
  => pW/2 - 500 > (1-p)W/2
  => pW - 1000 > (1-p)W
  => pW - 1000 > W - pW
  => 2pW - 1000 > W
  => 2pW - W > 1000
  => W(2p-1) > 1000

  So if 2p>1 (i.e., p>0.5), then W>1000/(2p-1)

  If p<=0.5, then the left side is non-positive, so paying is never better.

  In our case p=0.7, so W>1000/(2*0.7-1)=1000/(1.4-1)=1000/0.4=2500, as before.

  If the windfall is made unconditional on the read in Setting A? That is, if we change Setting A to: windfall occurs if heads (regardless of read) and request is made if tails. Then FDT would not pay because:

  Pay: 0.5 * W (from heads) + 0.5 * (-1000) (from tails) = 0.5W - 500
  Refuse: 0.5 * W (from heads) + 0.5 * 0 = 0.5W

  So refuse is better by 500. The contrast disappears.

  Objection:

  A causal or evidential theorist might object that FDT is using an ex-ante perspective even though the coin has already been flipped. Specifically, FDT evaluates the decision procedure by averaging over the coin flip, which is already determined. The agent knows in Setting A that the coin is tails, so the heads branch is counterfactual and doesn't exist. Why should the agent care about a branch that didn't happen?

  Reply: FDT is not about the agent's current situation per se, but about the output of the decision procedure as a function. The decision procedure is evaluated over all possible states of the world (including the coin flip) because the same decision procedure is used in all states. Therefore, it is not ex-ante in the sense of before the coin flip, but rather it is updateless: it does not update on information that is not available to the decision procedure at the time of decision. However, in this case, the agent does know the coin flip in Setting A? Actually, in Setting A, the agent knows they are approached, so they know the coin is tails. But FDT does not condition on that? In the FDT calculation, we did condition on the state: in Setting A, the agent is in the tails branch, but FDT still considers the heads branch because the decision procedure is evaluated for both branches.

  But note: the decision procedure is the same in both branches. The agent's decision is determined by the decision procedure. The read R was taken based on the decision procedure. So the decision procedure must be evaluated in both branches. The objection may be that after the coin is flipped, the agent should only care about the actual branch. The FDT reply is that the decision procedure is selected before the coin flip (in the design phase) and then applied. But the agent is now in the situation. However, FDT argues that the agent should act as the decision procedure that would have been chosen ex-ante.

  The honest note: the objection highlights that FDT is updateless and does not condition on the agent's current information (in this case, that the coin is tails) when evaluating the decision procedure. This updatelessness is a feature of FDT and is necessary for its verdict in this case. The part that survives: it is true that FDT does not update on the agent's current knowledge of the coin state in Setting A. But FDT proponents argue that this is the correct way to handle such situations.

  What the case cannot show:

  1. Whether an unmodified human can implement the FDT policy. Humans might be unable to resist conditioning on the known coin state (in Setting A) and thus might refuse even if FDT says to pay.

  2. The accuracy estimate: in real life, we don't have calibrated probabilities for predictors. The 70% is an idealization. The case depends on the exact number (as we saw, if the accuracy drops below 50%, FDT would refuse even in Setting A). Without a reliable estimate, the FDT prescription might be hard to apply.

  Now, we write the entire case as requested.
answer: |-
  ### Scenario
  A stranger flips a fair coin, knows the outcome (which you, the agent, never learn), and forms a 70%-accurate read of whether you would hand over $1,000 if asked, via ordinary human means (e.g., conversation or exercises). The read is fixed pre-approach and never revised. The windfall transfer $W to your bank and the request for $1,000 are settled as follows:

  - **Setting A**: Windfall $W occurs iff coin lands heads *and* the read says "would hand over." Request is made iff coin lands tails.
  - **Setting B**: Windfall $W occurs iff coin lands heads. Request is made iff (read says "would hand over") XOR (coin lands heads).

  You are approached (request made). Your action (pay/refuse) has no causal effect on the windfall. Stakes are ordinary; $W is set to $5,000.

  ---

  ### Verdicts with Arithmetic
  **Setting A** (agent knows coin is tails, so windfall $0; only $1,000 cost matters):  
  - **CDT**: Refuse. Intervention: Paying costs $1,000 with no causal benefit. EU(pay) = –$1,000; EU(refuse) = $0.  
  - **EDT**: Refuse. Conditional probability: Given tails, windfall $0 regardless. Paying costs $1,000 with no evidential benefit. EU(pay) = –$1,000; EU(refuse) = $0.  
  - **FDT**: Pay. Counterfactual: Output "pay" yields 50% heads: with P(0.7) read "yes" → windfall $5,000 (no request, no cost); with P(0.3) read "no" → $0. 50% tails: request made → pay $1,000. EU(pay) = 0.5 × [0.7×$5,000 + 0.3×$0] + 0.5 × [–$1,000] = $1,750 – $500 = $1,250. Output "refuse": Heads: P(0.3) read "yes" → $5,000; tails: $0. EU(refuse) = 0.5 × [0.3×$5,000] = $750. $1,250 > $750 → pay.  

  **Setting B** (agent does not know coin; windfall $5,000 if heads, $0 if tails):  
  - **CDT**: Refuse. Intervention: Paying costs $1,000; no causal effect on windfall (already set). EU(pay) = –$1,000; EU(refuse) = $0.  
  - **EDT**: Refuse. Conditional probability: Given request (states: heads+read "no" or tails+read "yes"), and action:  
    - If pay: P(heads | pay) = P(R="no"|pay) / [P(R="no"|pay) + P(R="yes"|pay)] = 0.3 / (0.3+0.7) = 0.3; P(tails | pay) = 0.7. EU(pay) = 0.3×($5,000 – $1,000) + 0.7×(–$1,000) = $1,200 – $700 = $500.  
    - If refuse: P(heads | refuse) = P(R="no"|refuse) / [P(R="no"|refuse) + P(R="yes"|refuse)] = 0.7 / (0.7+0.3) = 0.7; P(tails | refuse) = 0.3. EU(refuse) = 0.7×$5,000 + 0.3×$0 = $3,500. $3,500 > $500 → refuse.  
  - **FDT**: Refuse. Counterfactual:  
    - Output "pay": Heads: P(0.3) R="no" → request made, pay $1,000, get $5,000 → net $4,000; P(0.7) R="yes" → no request, get $5,000. Tails: P(0.7) R="yes" → request made, pay $1,000 → –$1,000; P(0.3) R="no" → no request, $0. EU(pay) = 0.5 × [0.3×$4,000 + 0.7×$5,000] + 0.5 × [0.7×(–$1,000) + 0.3×$0] = 0.5×[$1,200 + $3,500] + 0.5×(–$700) = $2,350 – $350 = $2,000.  
    - Output "refuse": Heads: always $5,000 (request iff R="no", but refuse costs $0). Tails: always $0. EU(refuse) = 0.5×$5,000 + 0.5×$0 = $2,500. $2,500 > $2,000 → refuse.  

  ---

  ### Feature Doing the Work and Case Structures
  The structural variable is whether the predictor’s read attaches to the **counterfactual branch** (Setting A) or the **actual request** (Setting B). In Setting A, the read gates the windfall in the unobserved heads branch (where the agent isn’t approached), so FDT "pays for the benefit you would have received." This mirrors **counterfactual mugging**: paying in the tails branch (no windfall) to secure the windfall in the counterfactual heads branch. In Setting B, the read gates the request in the actual branch (via XOR), so FDT refuses to avoid being "blackmailed" when the read and coin mismatch. This matches **XOR blackmail**, differing in that the request is made when read and coin differ (XOR), not when the read alone permits extortion.

  ---

  ### Tipping-Point Computation
  - **FDT flips in Setting A** when accuracy \( p > 0.5 \) and windfall \( W > \frac{1000}{2p - 1} \). At \( p = 0.7 \), flip-point is \( W = 2500 \).  
  - **Our numbers**: \( W = 5000 > 2500 \), ratio \( \frac{\text{EU(pay)}}{\text{EU(refuse)}} = \frac{1250}{750} \approx 1.67 \) (within 1.2–2).  
  - **Below flip-point**: If \( p \leq 0.5 \) or \( W \leq 2500 \), FDT refuses in Setting A (e.g., at \( p = 0.6 \), flip-point \( W = 5000 \); if \( W = 4000 < 5000 \), FDT refuses).  
  - **Unconditional windfall**: If Setting A windfall occurs iff heads (ignore read), FDT refuses: EU(pay) = \( 0.5 \times 5000 + 0.5 \times (-1000) = 2000 \); EU(refuse) = \( 0.5 \times 5000 = 2500 \). Contrast vanishes.

  ---

  ### Strongest Objection and Reply
  **Objection (CDT/EDT)**: FDT covertly uses an ex-ante/updateless perspective, averaging over the coin flip after it is settled (e.g., in Setting A, the agent *knows* tails, so heads is irrelevant; FDT "cares about a branch that didn’t happen"). This violates the principle that decisions should condition on current knowledge.  
  **Reply**: FDT evaluates the decision *procedure* across all possible states (including counterfactuals) because the read depends on the procedure’s output, not the action. It is not ex-ante but *updateless*: the procedure is fixed before state information (e.g., coin flip) and must handle all states optimally. Conditioning on tails would ignore how the procedure’s reliability affects outcomes in heads.  
  **Surviving part**: The objection correctly notes FDT does not update on the agent’s current information (e.g., knowing tails in Setting A). FDT’s updatelessness is intrinsic and controversial; opponents argue it violates epistemic rationality.

  ---

  ### What the Case Cannot Show
  1. **Human implementability**: Whether an unmodified human can reliably adopt FDT’s policy. Humans might condition on known information (e.g., "I know tails, so why pay?") due to cognitive limitations or myopic rationality.  
  2. **Accuracy calibration**: The verdicts depend on the exact accuracy (70%). Real-life predictors lack calibrated probabilities, making FDT’s prescription hard to apply.  
  3. **Moral or non-instrumental factors**: The case isolates money; it cannot show if FDT generalizes to moral goods or identity-related preferences.  
  4. **Robustness to small changes**: If the read’s independence or accuracy is perturbed (e.g., correlation with coin), results may not hold.  
  5. **Unique rationality of FDT**: While FDT uniquely distinguishes the settings, the case does not prove it is the "correct" theory—only that it tracks the specified structural variable.  

  ---  
  *Scenario and calculations satisfy all constraints: one variable, fixed machinery, W=5000 chosen for ratio ~1.67, no extraneous elements.*
