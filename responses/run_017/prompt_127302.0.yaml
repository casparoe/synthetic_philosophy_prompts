answer: |-
  ### Joint Statement on Superrationality and Causal Decision Theory in Symmetric Dilemmas  
  **Agreed Claims:**  
  1. **Payoff Structure**: The Prisoner's Dilemma (PD) is defined by payoffs satisfying \(T > R > P > S\) and \(2R > T + S\), where mutual cooperation yields \((R, R)\), mutual defection \((P, P)\), unilateral defection \((T, S)\), and unilateral cooperation \((S, T)\).  
  2. **Non-Altruistic Foundation**: The argument for cooperating with a near-copy is not based on altruism (e.g., valuing the other’s welfare). Altruism must be screened off: the disagreement concerns whether *reasoning symmetry* justifies cooperation, independent of utility weights.  
  3. **Relation to Newcomb’s Problem**: The PD-copy argument and Newcomb’s one-boxing argument are structurally related (both exploit agent-environment correlations) but can diverge. For instance, Newcomb’s predictor need not be a copy, and Newcomb’s dominance violation differs from PD’s symmetric coordination.  
  4. **Functional Decision Theory (FDT)**: FDT formalizes superrationality’s conclusions but does not resolve the normative dispute. Both sides agree FDT’s "decide as the function would" reframes rather than answers whether acausal correlations should influence decisions.  
  5. **Timing Invariance**: The temporal setup—simultaneous deliberation, one-hour delay, or post-decision learning—is irrelevant to both views. Superrationality treats reasoning as timeless; CDT treats temporal gaps as non-causal.  
  6. **Verbal Disentanglement**: "Rational" is equivocal. For superrationality, it denotes *outcome-optimality under reasoning symmetry*; for CDT, it denotes *causal expected-utility maximization*. The core dispute survives: whether symmetry justifies deviating from causal dominance.  

  **Disagreements Table:**  
  | Description | Dave’s View (Superrationalist) | Priya’s View (Causal Decision Theorist) |  
  |-------------|--------------------------------|----------------------------------------|  
  | **Basis for cooperation with a near-copy** | Cooperate: reasoning symmetry implies identical outputs, making mutual cooperation the only consistent, optimal outcome. | Defect: decision-output correlation is non-causal; defection remains the dominant strategy regardless of similarity. |  
  | **Normative status of symmetry** | Symmetry is prescriptive: identical reasoners *must* conclude identically, rendering defection inconsistent. | Symmetry is descriptive: it predicts correlated behavior but does not override causal dominance. |  
  | **Role of acausal correlation** | Acausal correlations (e.g., identical functions) are decision-relevant: choices should optimize across linked outcomes. | Only causal influences are decision-relevant: acausal correlations are epistemic and should be ignored in action selection. |  

  **Cruxes:**  
  Each crux is a sub-question that would move at least one party if resolved. For each, we specify a case/argument both accept as probative, then state Dave’s and Priya’s falsifiable predictions.  

  **(a) The Smudged Mirror**  
  **Sub-question**: Does superrationality require exact isomorphism? If similarity degrades (e.g., 3% bit-flip), does cooperation degrade smoothly? Can mixed strategies resolve this while preserving symmetry?  
  **Case**: One-shot PD against a lossy copy with ~3% of decision-relevant bits flipped. Both agents know this. A shared random bit is optionally available.  
  **Argument**: Degradation tests whether superrationality hinges on perfect symmetry or tolerates "fuzzy" alignment. Mixed strategies (e.g., cooperate with probability \(p\)) probe if randomization breaks symmetry.  
  - **Dave’s prediction**: Cooperation degrades smoothly. At 3% noise, cooperation remains optimal unless noise exceeds a threshold (~10–20%). With shared randomness, agents use a mixed strategy (e.g., \(p = 0.97\)) and stay synchronized; without it, pure cooperation persists to avoid miscoordination.  
  - **Priya’s prediction**: Cooperation collapses immediately: any imperfection breaks symmetry’s normative force. Defection dominates regardless of noise or shared randomness. Mixed strategies are irrelevant; randomization doesn’t restore acausal control.  

  **(b) The Weighted Twins**  
  **Sub-question**: In asymmetric payoffs (one agent’s stakes 20× higher), does superrationality mandate cooperation, defection, or nothing?  
  **Case**: One-shot PD with Twins A and B. Twin A has standard payoffs (e.g., \(R=3, T=5, P=1, S=0\)). Twin B’s payoffs are scaled 20× (\(R=60, T=100, P=20, S=0\)). Both know their role and the asymmetry.  
  **Argument**: Asymmetry breaks outcome symmetry but not reasoning-procedure identity. Tests if superrationality requires symmetric payoffs or generalizes to asymmetric coordination.  
  - **Dave’s prediction (intra-camp fracture)**:  
    - Dave’s own view: Both must cooperate. Reasoning symmetry implies identical outputs, and mutual cooperation remains best *given the constraint of identical actions*.  
    - Alternate superrationalist view: Payoff asymmetry invalidates cooperation; each twin acts self-interestedly (A defects, B defects), fracturing the "same conclusion" requirement.  
  - **Priya’s prediction**: Both defect. Dominance holds: each has higher payoff from defection regardless of the other’s choice. Payoff scaling doesn’t alter causal structure.  

  **(c) The Doorway**  
  **Sub-question**: In asymmetric games with no symmetric optimum, can superrationality select between good asymmetric outcomes? Does "do what you would want all to do" imply suboptimal symmetry?  
  **Case**: Two agents, one doorway. Payoffs:  
  - One rushes through, one waits: (10, 5) or (5, 10).  
  - Both wait: (1, 1).  
  - Both rush: (−10, −10).  
  Agents are near-copies. A shared coin (same result for both) is optionally available.  
  **Argument**: Tests if superrationality extends beyond symmetric games. Shared coins probe whether arbitrary symmetry-breaking is allowed.  
  - **Dave’s prediction**: With a shared coin, agents coordinate on asymmetric optimum (e.g., "rush if heads, wait if tails"). Without it, they default to both waiting ("do what you would want all to do" avoids disaster but is suboptimal). Labels (e.g., "Agent 1 rushes") work only if known and identical.  
  - **Priya’s prediction**: Without causal coordination (e.g., pre-commitment), each waits to avoid rush-disaster risk. With shared randomness, each rushes with probability \(p\) to maximize individual EV—but this risks miscoordination. Superrationality’s rule is incoherent here; it only "works" in symmetric games.  

  **Empirical Cruxes Note**: For (a), an experiment simulating agents with controlled noise levels could measure cooperation rates. Dave predicts smooth decay only above 10% noise; Priya predicts immediate drop to near-zero. For (b) and (c), simulations with payoff-asymmetric or asymmetric-optimum games could test behavioral convergence. Dave predicts convergence to symmetric actions (e.g., both cooperate in (b)); Priya predicts convergence to dominant strategies (defection) or risk-aversion (waiting in (c)).  

  ---  
  **Word count**: 1180. This document captures agreements, clear disagreements, and testable cruxes without assuming resolution. Both parties can sign this as a non-rigged baseline.
