  We are drafting a joint statement for Dave (superrationalist) and Priya (causal decision theorist) to sign, based on the user's specifications.

  The document will have three main sections:
  1. Agreed Claims: numbered list of agreed-upon points, avoiding filler.
  2. Disagreements Table: each row is a disagreement stated in the terms each side would accept for themselves.
  3. Cruxes: sub-questions that would move at least one of them, with a case or argument both accept as bearing on it, and Dave's and Priya's predictions written side by side.

  The three cases to be used as cruxes are:
  (a) The Smudged Mirror
  (b) The Weighted Twins
  (c) The Doorway

  We must also address the housekeeping: under 1200 words, no citations, assume familiarity with standard setups.

  Let's break down each section.

  # Section 1: Agreed Claims

  The user specified the following must be included:

  - The payoff structure of the case (Prisoner's Dilemma).
  - That the argument for cooperating with a copy is not an altruism argument and that partial altruism is a confound to screen off.
  - That the argument for cooperating in PD with a copy and the argument for one-boxing in Newcomb's problem are structurally related but can in principle come apart.
  - Both camps think the functional decision theory (FDT) framing restates the superrationalist conclusion in new vocabulary without settling the normative question.
  - It makes no difference to either view whether the two agents deliberate simultaneously or an hour apart, or whether one has already answered and you will learn the answer later.

  Additionally, we must say which parts of the fight are merely verbal. We note that the term "rational" might be doing two different jobs: for Dave, it is about achieving the best outcome in a symmetric coordination context, while for Priya, it is about maximizing expected utility given one's beliefs without relying on acausal correlations. But the core claims survive once we disentangle the term.

  We'll structure the agreed claims as a numbered list:

  1. **Payoff Structure**: We agree that the Prisoner's Dilemma (PD) has the following payoff structure for each player: mutual cooperation (R, R), mutual defection (P, P), and unilateral defection (T, S) and unilateral cooperation (S, T), with T > R > P > S and 2R > T+S. This creates a dominant strategy for defection in the causal sense, but the question is whether the presence of a near-copy changes that.

  2. **Non-Altruism**: The argument for cooperating with a near-copy is not based on altruism. Altruism (valuing the other's payoff) is a separate factor that we must screen off. The core issue is whether the reasoning process, given the similarity, leads to cooperation as the only consistent outcome. We both agree that if one were to cooperate out of altruism, that would be a different mechanism and a confound.

  3. **Relation to Newcomb's Problem**: The argument for cooperating in a PD with a near-copy is structurally related to the argument for one-boxing in Newcomb's problem (where a predictor has already made a prediction). Both involve a correlation between the agent's decision and the state of the world (or the other agent). However, we agree that these arguments can in principle come apart: one might accept one argument without the other. For instance, in Newcomb's problem, the predictor is not necessarily a copy of you, and the correlation is based on prediction rather than shared reasoning.

  4. **Functional Decision Theory (FDT)**: Both camps agree that FDT, as a framework, restates the superrationalist conclusion (cooperate in PD with a copy, one-box in Newcomb) in new vocabulary (by considering the output of the decision function). However, this restatement does not settle the normative question of whether one should adopt FDT or CDT. The debate about which decision theory is correct remains.

  5. **Timing and Information**: It makes no difference to either view whether the two agents deliberate simultaneously or with a time delay (e.g., an hour apart), or whether one has already decided and you will learn about it later. For Dave, the reasoning is about what the decision procedure outputs, which is timeless. For Priya, the decision is made based on the information available at the time, and learning about the other's decision later doesn't causally affect the current choice.

  6. **Verbal Disputes**: We agree that part of the dispute is verbal, revolving around the term "rational". For Dave, "rational" means choosing in a way that leads to the best outcome in a symmetric coordination context (which requires cooperation). For Priya, "rational" means maximizing expected utility given one's beliefs without relying on acausal correlations (which requires defection). Once we disentangle this, the core disagreement remains: whether the correlation between near-copies is a legitimate basis for decision-making.

  # Section 2: Disagreements Table

  We present a table (in text form) with each row as a disagreement, stated in the way each side would accept.

  | Disagreement Description | Dave's View (Superrationalist) | Priya's View (Causal Decision Theorist) |
  |--------------------------|--------------------------------|-----------------------------------------|
  | **In a one-shot PD with a near-copy, what should you do?** | You should cooperate because the symmetry of the situation implies that both agents will reach the same decision, and mutual cooperation yields a better outcome than mutual defection. | You should defect because your decision does not causally affect the other agent's decision; the correlation is not a causal channel, and defection is the dominant strategy. |
  | **What is the normative force of the symmetry?** | The symmetry is normatively binding: it would be inconsistent for two identical reasoners to reach different conclusions, and thus they must cooperate. | The symmetry is descriptive but not prescriptive: it may be that both agents do the same thing, but that does not change the fact that each, from their own perspective, has a dominant strategy to defect. |
  | **Does decision theory allow for acausal influence?** | Yes, decision-making should take into account acausal correlations (e.g., between the outputs of identical decision processes) because they are relevant to the outcome. | No, decision-making should be based only on causal influences. Acausal correlations are not a form of influence and should be ignored in the decision process. |

  # Section 3: Cruxes

  We present three cruxes based on the cases provided. For each crux, we state the sub-question, the case or argument, and then Dave's and Priya's predictions.

  ## Crux (a): The Smudged Mirror

  **Sub-question**: Does superrationality require exact isomorphism, or does the case for cooperating degrade smoothly with similarity? If it degrades, what is the right response (e.g., mixed strategy) and how does randomization affect the symmetry?

  **Case**: You play a one-shot PD against an agent built from a lossy copy of you with roughly 3% of the decision-relevant bits flipped (so the agents are not identical but very similar). Both agents know this.

  **Argument both accept as bearing**: The key issue is whether the similarity is sufficient to expect coordinated outcomes. We can model the agents as having a high probability of making the same decision, but not certainty. The question is whether the agents should still cooperate (with some probability) or if they should defect.

  ### Predictions:
  - **Dave's prediction**: Even with a 3% difference, the agents are similar enough that they should still cooperate. The reasoning is that the decision process is still highly aligned, and the expected payoff from mutual cooperation is higher. If the degradation is too severe, Dave might accept a mixed strategy, but only if the random bits are shared (so that both agents use the same random bit and thus remain in sync). Without shared randomness, he might still advocate for pure cooperation to avoid the risk of miscoordination.
  - **Priya's prediction**: The 3% difference breaks the symmetry. Each agent should defect because they cannot rely on the other to cooperate. The correlation is not perfect, so defection remains the dominant strategy. If a shared random bit is available, Priya would still say that each should defect because the shared bit does not change the causal structure.

  ## Crux (b): The Weighted Twins

  **Sub-question**: In a one-shot PD, one twin's payoffs are all multiplied by twenty, and both know which twin they are. The reasoning procedures are identical, but the situation is asymmetric. What should each twin do?

  **Case**: Twin A has the standard PD payoffs (e.g., R=3, T=5, P=1, S=0). Twin B has the same payoffs multiplied by 20 (so R=60, T=100, P=20, S=0). Both agents know their own role and the other's.

  **Argument both accept as bearing**: The asymmetry in payoffs breaks the symmetry of interests. The question is whether the symmetry in reasoning (both using the same decision procedure) can still lead to a coordinated outcome.

  ### Predictions:
  - **Dave's prediction**: This might split the superrationalist camp. Some might argue that the reasoning symmetry still requires the same output, so both should cooperate. Others might argue that the payoff difference breaks the symmetry, so each should act according to their own payoffs. However, Dave's own view is that the reasoning procedure must account for the asymmetry. He might say: since both are using the same reasoning, they will both realize that Twin B has much more at stake. They might coordinate on an outcome that is best overall, but that is not symmetric. Alternatively, they might both defect because the reasoning procedure, being the same, might still lead to defection for Twin A (since Twin A's dominant strategy is to defect) and similarly for Twin B? This is tricky. Let's be honest: this case is underdeveloped in superrationality. Dave's view might be that the agents should both cooperate because that is what the reasoning procedure would output as the "right" thing to do, ignoring the asymmetry? Or perhaps they should both defect? We note that this crux might reveal an internal fracture in the superrationalist camp. For the sake of the document, we present Dave's own view as: the agents should both cooperate because the reasoning procedure is the same and the best symmetric outcome is mutual cooperation. However, he might be unsure.
  - **Priya's prediction**: Each twin should defect. Twin A, despite knowing Twin B has higher stakes, still has a dominant strategy to defect (since regardless of what Twin B does, defection yields a higher payoff for Twin A). Similarly, Twin B has a dominant strategy to defect. The payoff asymmetry doesn't change the dominance.

  But note: Twin B's payoffs are multiplied by 20, but the structure is still PD. So Twin B also has a dominant strategy to defect. So Priya says both should defect.

  ## Crux (c): The Doorway

  **Sub-question**: In a two-person game with two asymmetric good outcomes (one goes through, one waits), a bad outcome if both wait, and a disaster if both rush. There is no symmetric joint optimum. Can superrationality use an irrelevant label or a shared coin to select between the two good profiles? Or does the rule "do what you would want all to do" lead to both waiting?

  **Case**: The game has the following payoffs:
  - One goes, one waits: the one who goes gets 10, the one who waits gets 5 (or vice versa). 
  - Both wait: both get 1.
  - Both rush: both get -10.

  The best outcomes are asymmetric: (10,5) and (5,10). Both waiting (1,1) is bad, and both rushing (-10,-10) is a disaster.

  **Argument both accept as bearing**: The issue is whether superrationality can handle asymmetric coordination. The agents are near-copies and use the same reasoning procedure.

  ### Predictions:
  - **Dave's prediction**: The superrationalist approach would be to use a shared random bit (if available) to break the symmetry and select one of the good outcomes. For example, both agents flip a shared coin (so they get the same result) and then the one designated by the coin goes, the other waits. Without a shared coin, they might use an arbitrary label (e.g., which one was created first) to break symmetry. The rule "do what you would want all to do" in this context would be: "I want both of us to use the same symmetric rule that leads to one going and one waiting, and the shared coin is the way to do that." If no shared coin or label is available, then Dave might say that both should wait to avoid the disaster of both rushing, but that is suboptimal. However, note that the reasoning procedure must output the same action for both without a symmetry-breaker? That would lead to both doing the same thing, which could be both waiting or both rushing. To avoid both rushing, they might both wait. But that is bad. So Dave would insist on the need for a shared coin or label to select the asymmetric outcome.
  - **Priya's prediction**: Each agent should choose the action that maximizes their own expected payoff given their beliefs. However, without a way to coordinate (like a shared coin), each agent might reason that if they rush, they risk disaster if the other also rushes. But if they wait, they get at least 1. However, if they can condition on a shared random bit, then they can coordinate. But without a causal mechanism to coordinate, Priya would say that each should independently choose to wait to avoid the worst outcome. But note: if both agents are near-copies and know they are using the same reasoning, they might both attempt to rush (thinking the other will wait) or both wait. Without a coordination device, it's a coordination problem. Priya's CDT doesn't have a built-in solution for coordination. She might say that without a pre-commitment or signaling (which is not allowed in one-shot), they might end up with a bad outcome. However, she would not accept using acausal correlation to coordinate. So in the absence of a shared coin, she would advocate for waiting as the safer choice.

