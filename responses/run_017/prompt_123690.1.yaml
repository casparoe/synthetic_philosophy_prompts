answer: |-
  **Conclusion:** The wrong kind of reasons problem is a general phenomenon arising for any attitude with constitutive correctness conditions, not a unique issue for value, and the "right kind" restriction is principled because it reflects the essential nature of the relevant attitude.

  **Argument:** The core issue is that attitudes like belief, admiration, intention, and assertion have constitutive *correctness conditions* (truth/fittingness/successful action/truth respectively). Reasons that bear directly on whether an attitude *meets* its correctness condition are the "right kind" (RKRs). Reasons stemming from the *consequences* of holding the attitude (like bribes) are the "wrong kind" (WKRs) because they bypass the attitude's internal standard. Belief exemplifies this cleanly: the RKRs for belief are evidence bearing on truth; a bribe to believe a poached egg proposition is a WKR because it ignores truth entirely. We don't see this as a crisis for epistemic reasons precisely because we implicitly recognize the constitutive link between belief and truth. Similarly, RKRs for admiration must bear on the *admirability* of its object. The "restriction" to RKRs isn't an ad hoc fix grafted onto value theory; it's a necessary consequence of analyzing attitudes *as* attitudes defined by their correctness conditions. The distinction is independently motivated across domains: for value (admiration's fittingness), epistemology (belief's truth), and pragmatics (intention's successful action, assertion's truth).

  **The Scientist Case:** The prize offers a *wrong-kind reason* for belief. RKRs for belief concern whether the hypothesis *is true*, judged via evidence. The prize is a pragmatic incentive for the *state* of believing, not evidence for the hypothesis's truth. While the hypothesis *is* true, the prize doesn't make it more *likely* given her evidence; it doesn't engage with the correctness condition (truth via evidential support). Her evidence provides no RKR to believe it. Accepting the prize incentive would require her to form a belief *irrationally* by epistemic standards, violating the constitutive link between belief and evidential support. The reason is wrong-kind because it targets the consequence (receiving money) of being in the belief state, not the state's correctness (truth).
