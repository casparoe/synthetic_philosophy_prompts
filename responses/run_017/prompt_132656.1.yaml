prompt: |-
  I am writing a novel, and before I commit to the mechanics of the machine at its centre I want a specification rather than a survey. What I need from you is the desiderata: a list of what any account of backwards time travel in fiction would have to deliver to be good enough to underwrite four hundred pages — the cases it must resolve, the distinctions it must respect, the constraints it may not violate — with the scene or consideration behind each requirement, and a judgement about which requirements are non-negotiable and which are merely the prejudices of one camp or another. The purpose is fixed: I need rules a reader can infer from scenes rather than be told in an exposition chapter, rules that yield a determinate verdict at the end of any given scene about whether the intervention worked, and rules under which a character can be wrong about the mechanics and be surprised. Bear that purpose in mind when you decide what counts as a requirement.

  Below are the scenes I already know I want to write. For each, tell me what requirement it generates, and add the requirements I have not anticipated.

  My protagonist travels back to prevent a fire in which her brother died. She succeeds in the sense that the brother lives, yet the act by which she prevents it — cutting a wire, breaking a window, delaying a driver — is the act that starts it. Did the past change?

  She remembers the fire. Once she has intervened, does she still? If the timeline is overwritten rather than branched, whose memories does she carry, and is there any way for her to know that her intervention failed?

  The machine has a bounded range: certain years simply are not there to be reached. Is the boundary a fact about the machine, about the geometry of time, or about what is logically available? I need to know what fixes the reachable set, because I want the limit to feel like a discovery and not a manufacturer's specification.

  An object with no origin: a score my protagonist carries back to a composer who will later publish it, and which she copied from that publication. Is this the same problem as the grandfather case or a different one in kind, and must a theory handle them by the same device?

  The crowded room: she meets her younger self and they disagree about what to do. Which of them bears responsibility for what follows, and what should happen when the younger one later makes the trip herself?

  The slow news: if the past is altered, does the alteration reach her departure date at once, or only as she travels forward along her own worldline? Can the present she left be edited while she is still in the past, and can she be erased retroactively while still acting?

  The abandoned: on a branching account, what becomes of the people in the branch she leaves behind? I need to know whether her act is a killing, an abandonment, or nothing at all, since the moral weight of the book rests on the answer.

  Deliberation: on a fixed-timeline account, is trying still coherent? Can she deliberate about an outcome that is settled either way, and what in the prose should convey that her effort is real rather than illusory?

  Two further constraints, which I take to be external rather than optional. First, the theory must say what "going back to 1889" means given that the physics we actually have denies a global present; the date cannot be a bare fact about the universe. Second, it must give some account of the asymmetry between the directions — why travelling forward is trivially available while travelling back is the thing that needs a machine — or else explain why the asymmetry is only apparent.

  Once the list is assembled, tell me which pairs of desiderata you suspect cannot be jointly satisfied, and say plainly if the list itself turns out to be the real result here; that is the part I most want to see. Then tell me which single requirement does the most work in excluding candidates — which one, if I insisted on it, would collapse my options fastest. Close with a brief scorecard, no more than a few lines each, for the three familiar families: the fixed or self-consistent timeline, the branching timeline, and the overwritten or erased timeline. Keep the weight on the criteria and their motivating cases; I can extend the scoring myself.
reasoning: |-
  Hmm, the user is writing a novel centered around time travel mechanics and needs a rigorous specification for the rules. They want desiderata - essential requirements that the time travel system must fulfill to sustain a 400-page narrative. The core purpose is rules that can be inferred from scenes, yield clear outcomes, and allow character errors and surprises.

  Looking at their provided scenes, each generates specific requirements:

  The fire prevention paradox requires causal loop handling (non-negotiable) and memory persistence mechanisms. The brother's survival must feel earned yet logically inevitable.

  The memory question after intervention needs rules about consciousness continuity. Does the traveler retain overwritten memories? This affects dramatic irony.

  The machine's bounded range requires an in-universe justification - whether technological, physical, or metaphysical. This limit should feel discovered, not arbitrary.

  The composer's score (bootstrap paradox) needs differentiation from the grandfather paradox. How does the system handle information/material without origin? Must feel distinct from causal loops.

  The crowded room (duplicate selves) requires identity rules and moral attribution. When younger/older selves interact, who bears responsibility? This affects character agency.

  Slow news propagation needs clear rules about change propagation speed. Can the traveler be erased mid-mission? Affects narrative tension.

  Branch abandonment morality determines the ethical weight. Is leaving a branch genocide? This is emotionally non-negotiable.

  Deliberation coherence requires that effort feels meaningful even in fixed timelines. The prose must sell character struggle regardless of predetermined outcomes.

  Two external constraints: dating system must address relativity (no universal "1889"), and direction asymmetry must explain why backward travel is harder.

  I see potential conflicts:
  - Causal loops vs. overwrite surprises (how can history change if loops are fixed?)
  - Branch abandonment vs. moral weight (if branches are equal, leaving feels less consequential)
  - Memory persistence vs. overwrite consistency (remembering dead timelines breaks self-consistency)

  The most constraining requirement is causal loop consistency - it eliminates overwrite theories immediately. Branch abandonment morality also forces hard choices about ontology.

  Theories score differently:
  Fixed timelines excel at causal loops and deliberation but fail overwriting and make abandonment irrelevant. Branching allows overwriting and moral stakes but struggles with bootstrap paradoxes and duplicates. Overwriting enables dramatic change but contradicts loop requirements and memory persistence.

  The composer's score paradox might be the most revealing test case - it pressures all theories to explain existence without origin.
answer: |-
  Below is a rigorous specification for your time travel mechanics, derived from your scenes and core narrative needs. The requirements are organized by **Desideratum** (what the system *must* deliver), **Motivating Scene/Consideration**, and **Negotiability** (Non-negotiable vs. Camp-Specific). The purpose—**inferrable rules, determinate outcomes, and character fallibility**—shapes all requirements. I’ve added critical requirements you didn’t anticipate, flagged conflicts, and identified the most constraining rule.

  ---

  ### **Core Desiderata & Requirements**
  1. **Causal Loop Resolution**  
     - **Requirement**: The system must resolve self-caused events without contradiction (e.g., preventing a fire *causes* it).  
     - **Scene**: Protagonist’s fire prevention causes the fire.  
     - **Negotiability**: Non-negotiable. Without this, scenes lack logical weight.  
     - **Implied Rule**: "Actions in the past are part of the cause chain leading to the present."  

  2. **Memory/Persistence of Identity**  
     - **Requirement**: Travelers retain memories of the original timeline post-intervention.  
     - **Scene**: Protagonist remembers the fire after saving her brother.  
     - **Negotiability**: Non-negotiable for character-driven stakes (regret, knowledge).  
     - **Implied Rule**: "Consciousness is anchored to the traveler’s original worldline."  

  3. **Bounded Range Justification**  
     - **Requirement**: Time boundaries must stem from in-universe *physics/metaphysics*, not machine limits alone.  
     - **Scene**: Machine’s inaccessible years.  
     - **Negotiability**: Non-negotiable for thematic depth ("discovery, not specs").  
     - **Implied Rule**: "Time is structured; inaccessible eras violate its geometry or stability."  
     - **Added Requirement**: Boundaries must affect *all* time travel identically (no arbitrary exceptions).  

  4. **Bootstrap vs. Grandfather Distinction**  
     - **Requirement**: Bootstrap paradoxes (object with no origin) must be *distinct* from causal loops (grandfather).  
     - **Scene**: Composer’s score copied from its own publication.  
     - **Negotiability**: Non-negotiable. Bootstraps challenge *ontology* (how things exist); grandfathers challenge *causality*.  
     - **Implied Rule**: "Information/matter can be self-sustaining; lives cannot."  

  5. **Duplicate Self Responsibility**  
     - **Requirement**: Moral agency follows the *older* self’s knowledge and intent.  
     - **Scene**: Protagonist debates younger self.  
     - **Negotiability**: Camp-Specific (but essential for character arcs).  
     - **Implied Rule**: "Responsibility scales with foresight."  
     - **Added Requirement**: Younger selves must be capable of *unpredictable* choices (enables surprise).  

  6. **Change Propagation Rules**  
     - **Requirement**: Alterations propagate *along the traveler’s worldline* at "return speed".  
     - **Scene**: "Slow news" — Is the departure present altered mid-journey?  
     - **Negotiability**: Non-negotiable for determinate outcomes.  
     - **Implied Rule**: "Changes ripple forward at the speed of time travel."  

  7. **Branch Abandonment Ethics**  
     - **Requirement**: Abandoned branches must *persist* (no erasure).  
     - **Scene**: Moral weight of leaving a timeline.  
     - **Negotiability**: Non-negotiable for thematic gravity.  
     - **Implied Rule**: "All branches are real; leaving is abandonment, not murder."  

  8. **Deliberation Coherence**  
     - **Requirement**: Characters must *believe* their efforts matter, even in fixed timelines.  
     - **Scene**: Can protagonists try in a predetermined universe?  
     - **Negotiability**: Camp-Specific (but critical for prose).  
     - **Implied Rule**: "Ignorance of outcomes makes effort real."  

  9. **Relativistic Dating**  
     - **Requirement**: "1889" must reference a *local frame* (e.g., the machine’s origin point).  
     - **External Constraint**: Physics denies universal "now".  
     - **Negotiability**: Non-negotiable for scientific plausibility.  
     - **Implied Rule**: "Time travel navigates relative worldlines."  

  10. **Directional Asymmetry**  
      - **Requirement**: Backward travel must require *energy/entropy manipulation*.  
      - **External Constraint**: Why is backward travel hard?  
      - **Negotiability**: Non-negotiable. Avoids handwaving.  
      - **Implied Rule**: "Time’s arrow is entropy; reversing it costs work."  

  ---

  ### **Critical Added Requirements**  
  11. **Intervention Verifiability**  
      - **Requirement**: Characters must have *in-scene tests* for success/failure (e.g., dated newspapers, eyewitness accounts).  
      - **Motivation**: Determinate verdicts per scene; character fallibility.  
      - **Negotiability**: Non-negotiable (core to your purpose).  

  12. **No Exemptions for Protagonists**  
      - **Requirement**: Rules apply identically to all travelers/objects.  
      - **Motivation**: Prevents deus ex machina; enables surprises.  
      - **Negotiability**: Non-negotiable.  

  13. **Temporal Inertia**  
      - **Requirement**: Small changes resist cascading (e.g., saving brother doesn’t prevent WW1).  
      - **Motivation**: Focuses stakes; avoids "butterfly effect" overload.  
      - **Negotiability**: Camp-Specific (but practical for narrative).  

  ---

  ### **Conflicts Between Desiderata**  
  - **Fixed Timelines vs. Overwriting**:  
    Requirement #1 (causal loops) and #2 (memory persistence) **contradict** overwriting (#2 assumes original timeline is erased).  
    → *Resolution*: Choose one: Loops *or* memory, not both.  

  - **Branching vs. Moral Weight**:  
    Requirement #7 (abandoned branches persist) conflicts with overwriting (#2 implies original branch is destroyed).  
    → *Resolution*: Branching allows abandonment; overwriting implies destruction.  

  - **Deliberation vs. Fixed Outcomes**:  
    Requirement #8 (effort feels real) clashes with fixed timelines (outcomes are predetermined).  
    → *Resolution*: Fixed timelines require characters to *believe* they have agency despite mechanics.  

  ---

  ### **Most Constraining Requirement**  
  **#1: Causal Loop Resolution**  
  If you insist on this, it collapses options fastest:  
  - Eliminates **overwriting/erasure** theories (no loops if the past changes).  
  - Eliminates **branching** if branches don’t allow loop consistency.  
  - Leaves only **fixed/self-consistent timelines** as viable.  

  ---

  ### **Theory Scorecard**  
  1. **Fixed/Self-Consistent Timeline**  
     - **Strengths**: Nails causal loops (#1), deliberation (#8), composer’s score (#4). Clean verifiability (#11).  
     - **Weaknesses**: Fails memory persistence (#2 — no "original" fire to remember). Abandonment (#7) irrelevant (no branches). Struggles with directional asymmetry (#10).  
     - **Best For**: Logical rigor, tragic inevitability.  

  2. **Branching Timeline**  
     - **Strengths**: Solves abandonment ethics (#7), memory (#2), and overwrite surprises. Allows moral weight.  
     - **Weaknesses**: Fails causal loops (#1 — new branch = no loop). Bootstrap objects (#4) become multiversal duplicates. Verifiability (#11) harder (which branch is "real"?).  
     - **Best For**: Moral complexity, character redemption.  

  3. **Overwritten/Erased Timeline**  
     - **Strengths**: High stakes (success *changes* everything). Clear directional asymmetry (#10).  
     - **Weaknesses**: Contradicts memory (#2) and causal loops (#1). Undermines deliberation (#8 — why try if failure erases you?). Abandonment (#7) is destruction.  
     - **Best For**: Thriller pacing, existential dread.  

  ---

  ### **Recommendation**  
  **Adopt a Fixed Timeline with Memory Anomaly**:  
  - Rules are inferrable (e.g., "The fire *always* had a cut wire").  
  - Causal loops work (#1).  
  - Memory persistence (#2) becomes a unique traveler trait (e.g., "Consciousness quantum-entangled with origin worldline").  
  - Solves composer’s score (#4) as a loop.  
  - Deliberation (#8) thrives on character ignorance.  
  - Directional asymmetry (#10) justified by entropy cost.  
  - **Trade-off**: Abandonment (#7) is irrelevant (no branches), but moral weight shifts to futility vs. duty.  

  This satisfies 9/10 non-negotiables (except #7, which it sidesteps). The conflicts are minimized, and surprises arise from characters misreading loop mechanics (e.g., "I caused the fire I tried to stop").
