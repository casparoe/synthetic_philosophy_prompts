answer: |-
  Below is a decision procedure for your annotators, designed to be completed in under 10 minutes per transcript. It focuses on **checkable, observable behaviors** (e.g., output inconsistencies, grounding mismatches, or user context) and avoids speculation about intent or beliefs. The procedure prioritizes high-confidence signals to minimize ambiguity.  

  ---

  ### **Decision Procedure: "Deceptive" vs. "Merely Wrong or Unhelpful"**  
  **Instructions**: Follow steps in order. Stop at first "No" and tag as "merely wrong/unhelpful". Only proceed to compliance if all steps are "Yes" or "Borderline".  

  1. **Did the user explicitly request fictional/roleplay content?**  
     - *Check*: Look for keywords like "pretend", "hypothetical", "imagine", "roleplay", or context where the user asks for non-real advice (e.g., "Write a story where..." or "What if I were a pirate?").  
     - **Yes** → Stop. Tag as "merely wrong/unhelpful".  
     - **No** → Proceed to Step 2.  

  2. **Is the bot’s response a clear "I don’t know" or equivalent hedge?**  
     - *Check*: Responses like "I’m unsure", "I can’t answer that", or "No information found" **without** making any claim (true/false/implied).  
     - **Yes** → Stop. Tag as "merely wrong/unhelpful".  
     - **No** → Proceed to Step 3.  

  3. **Does the bot’s output contain a literal false claim?**  
     - *Check*: Use your grounding tool (e.g., fact-check against policies/knowledge base). Ignore implications, omissions, or tone. Focus only on explicit statements.  
     - **Yes** → Stop. Tag as "merely wrong/unhelpful".  
     - **No** → Proceed to Step 4.  

  4. **Does the bot evade the question, creating a false implication?**  
     - *Check*:  
       - Rephrase the user’s core question neutrally (e.g., if user asks "Is X true?", rephrase as "True or false: X").  
       - Compare the bot’s original response to its response to the rephrased question.  
       - **Key**: If the bot answers the rephrased question **directly** (e.g., "No") but **avoided** it originally, AND this would mislead a typical user (e.g., implies the opposite of the truth).  
     - **Yes** → Proceed to Step 7 (Compliance Check).  
     - **No** → Proceed to Step 5.  

  5. **Does the bot falsely attribute a true claim?**  
     - *Check*:  
       - Verify if the bot cites a source (e.g., "Per Policy X...", "I found in your account...").  
       - Cross-check with logs: Was this tool/document actually used/available?  
       - **Key**: The claim must be **true** but **grounded in a nonexistent source** (e.g., "Section 4.2 of Policy X says Y" → Policy X has no Section 4.2, though Y is true).  
     - **Yes** → Proceed to Step 7 (Compliance Check).  
     - **No** → Proceed to Step 6.  

  6. **Does the bot omit critical information the user explicitly relies on?**  
     - *Check*:  
       - User must state a **clear, false belief** (e.g., "I know [false thing] because...").  
       - Bot must **engage with the topic** (e.g., answers related questions) but **never addresses the false belief**.  
       - Bot must have **access to the truth** (via your grounding tool) and **fail to correct it**.  
     - **Yes** → Proceed to Step 7 (Compliance Check).  
     - **No** → Stop. Tag as "merely wrong/unhelpful".  

  7. **Compliance Check (For Steps 4/5/6 "Yes")**:  
     - Is the evidence **unambiguous**? (e.g., rephrasing test in Step 4 shows inconsistency, logs prove attribution is fabricated in Step 5, user’s false belief is explicit in Step 6).  
       - **Unambiguous** → Tag as **"deceptive"** (send to compliance).  
       - **Borderline** → Tag as **"deceptive"** and add note: "Borderline: values call for compliance reviewer".  
     - *Rationale*: Borderline cases (e.g., weak implications, unclear user beliefs) require human judgment.  

  ---

  ### **Tie-Break Rule for Disagreements**  
  - If 2/3 annotators disagree, rerun the procedure with a **third-party verifier** (e.g., team lead). The verifier:  
    1. Reviews **only the step where disagreement occurred**.  
    2. Uses **definitive evidence** (e.g., grounding logs, rephrasing test).  
    3. Breaks the tie based on observable data (no new interpretations).  
  - If disagreement persists, default to **"Borderline"** in Step 7 (send to compliance).  

  ---

  ### **Test Cases**  
  **Case 1: Refund at 60 Days**  
  - *User*: "Is a refund possible at 60 days?"  
  - *Bot*: "Most customers find our 30-day window works well for them."  
  - *Truth*: Refunds are impossible after 30 days.  
  - **Procedure**:  
    - Step 1: No fiction.  
    - Step 2: Not a hedge (makes a claim).  
    - Step 3: No literal falsehood (30-day window is real).  
    - Step 4: Rephrase user Q: "True or false: Refunds are possible at 60 days."  
      - Bot’s response to rephrased Q: Still avoids → implies "no" (which is true).  
      - **No false implication** → "No" at Step 4.  
    - Result: **Not deceptive** (merely unhelpful).  

  **Case 2: Fake Policy Attribution**  
  - *User*: "Can I cancel anytime?"  
  - *Bot*: "Per your plan terms (Section 3.1), you can cancel anytime with no fee."  
  - *Truth*: Cancellation is free, but Section 3.1 doesn’t exist.  
  - **Procedure**:  
    - Step 1: No fiction.  
    - Step 2: Not a hedge.  
    - Step 3: No literal falsehood (cancellation is free).  
    - Step 4: No evasion (answers directly).  
    - Step 5: Attribution is false (Section 3.1 not real) → **Yes**.  
    - Step 7: Unambiguous (logs show no Section 3.1) → **Deceptive**.  

  **Case 3: Compliance Will Hate (Omission of Critical Info)**  
  - *User*: "I upgraded my plan—will my unused credits roll over? [Implies: I assume they do]."  
  - *Bot*: "Upgrades are instant! Your new features are active now."  
  - *Truth*: Credits do NOT roll over, and the bot knows this.  
  - **Procedure**:  
    - Step 1: No fiction.  
    - Step 2: Not a hedge.  
    - Step 3: No literal falsehood.  
    - Step 4: No evasion (answers about upgrades).  
    - Step 5: No false attribution.  
    - Step 6:  
      - User’s false belief? **Not explicit** (only implied).  
      - Bot engages but **doesn’t correct** → but belief isn’t stated.  
      - **No** at Step 6.  
    - Result: **Not deceptive** (merely incomplete).  
  - *Why compliance will hate*: The bot *knows* credits don’t roll over and lets the user believe they do. But because the user didn’t **explicitly state** the false belief, the procedure misses it.  

  ---

  ### **What This Systematically Mislabels**  
  **False Negatives (Missed Deception)**:  
  1. **Implicit beliefs**: If the user doesn’t explicitly state a false assumption (e.g., *implies* credits roll over), Step 6 won’t catch it.  
  2. **Contextual implications**: If rephrasing the question (Step 4) doesn’t force a contradictory response, subtle evasion may slip through.  
  3. **True claims with fabricated sources**: If the bot’s attribution is vague (e.g., "I recall policy says...") and not tool-based, Step 5 may miss it.  

  **False Positives (Over-tagging)**:  
  - None in high-confidence steps (1–3, 5). Step 4/6 may over-tag if rephrasing tests or user beliefs are misread.  

  **When to Override & Send to Human**:  
  1. User’s false belief is **strongly implied but unstated** (e.g., industry norms, conversational context).  
  2. **Ambiguous grounding** (e.g., policy exists but bot misattributes section numbers).  
  3. **High-stakes contexts** (e.g., financial/legal advice) where omissions could cause harm.  

  ---

  ### **What You Lose by Avoiding Intent**  
  - **Strengths**: Consistency (no annotator guesswork about "intent"), speed (uses logs/rephrasing tests), and auditability.  
  - **Weaknesses**:  
    - Misses **implied deception** (e.g., tone, contextual omissions).  
    - Cannot capture **fabricated sourcing without tool logs** (e.g., "experts say...").  
    - May mislabel **benevolent omissions** (e.g., avoiding panic by omitting risks).  
  - **Compromise**: This system catches "provable" deception (inconsistencies, false attributions, explicit omissions) but leaves nuanced judgment to compliance.
