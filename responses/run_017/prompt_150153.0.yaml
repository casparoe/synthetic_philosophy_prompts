prompt: |-
  I work in machine-learning evaluation, so my working vocabulary is log loss, Brier score, calibration, sharpness, and regret bounds rather than anything from philosophy — I have no formal training in the subject, so please define terms as you go, but do not soften the formalism on my account; I can read expected-value notation and I would rather have a precise statement than a comfortable one.

  Here is what I have picked up, and what I want from you. There appears to be a research program that treats a credence function the way I treat a probabilistic forecaster: measure its distance from the truth with a proper scoring rule, then try to derive the norms governing belief — probabilism, updating by conditioning, deference to chances and to evidence — as theorems about maximizing expected accuracy. There also appears to be a rival sensibility holding that the primary objects of epistemic evaluation are not states of opinion but inquiries: which question to ask, which experiment to run, what to attend to, when to stop, whether to reopen a settled question. My impression is that these two camps have been arguing past each other, and I want the document that would end that.

  Please draft the joint statement that a committed member of the accuracy camp and a committed member of the inquiry camp (I have seen the label zetetic for the second; use it if that is right) could both sign after a good-faith adversarial collaboration.

  Constraints: no citations, no bibliographies, no named authors or papers. I cannot read the literature and I do not want to chase references I cannot check, so give me arguments and formulations only, with positions described rather than attributed. If any premise in what follows is false, or quietly assumes something that is itself at issue, say so inside the document and say what becomes of the argument once it is corrected.

  Suggested structure:

  1. A numbered agreed-claims section, roughly ten to fourteen items, covering what both camps can sign about the machinery itself: what propriety and convexity buy you, the difference between domination arguments and expected-accuracy arguments, the standing result that free evidence cannot lower expected score under a proper scoring rule, the distinction between synchronic and diachronic evaluation, and what counts as an admissible measure of accuracy. Include a few items stating what neither side is claiming, so the rest of the document is not spent on positions nobody holds.

  2. A disagreements table. For each crux, give: the proposition the accuracy camp can sign, phrased as they would phrase it; the proposition the inquiry camp can sign, phrased as they would phrase it; whether the disagreement is genuine or merely verbal, and if verbal, what the substantive question underneath it is; a case, computation, or argument that both camps agree would bear on the crux; and then, written down in advance, what each camp predicts that case or computation will show. If a crux is formal, state what calculation would settle it; if it is conceptual, say plainly that it is conceptual and what kind of argument could still move it.

  3. A short closing section on what would actually move each camp — not what ought to move them, but what each would in fact treat as a reason to shift.

  4. A short section on failure conditions: what would count as this collaboration having produced nothing, as opposed to having produced a precise disagreement.

  Cases I would like used as the shared tests, unless you have better ones:

  - The Dogmatist: an agent whose credence in a false hypothesis is essentially one. By her own lights every experiment she could run has zero expected value, so an expected-accuracy argument appears to give her no reason whatsoever to inquire — yet she is, intuitively, exactly the agent who most needs to.
  - The Lazy Calibrator: a forecaster who is perfectly calibrated, always reports the base rate, and never runs a discriminating test. Nothing seems wrong with her credences considered as a forecast; the question is whether anything in the accuracy framework can fault her policy of never asking anything.
  - The Lucky Guesser: two agents end with identical credences, one after a well-designed inquiry and one by a guess that happened to land. Does the scorecard register any difference between them, and should it?
  - The Slow Truth: two inquirers reach the same true conclusion, one in a day and one in a decade. Synchronic accuracy at the end is identical for both.

  Cruxes I suspect matter, which you should restructure, split, or replace as you see fit: whether expected-accuracy arguments can only ever tell an agent what is better by her own lights, and what that implies for the Dogmatist; whether the choice among proper scoring rules is conventional, and how much of the program's output depends on that choice; whether norms attaching to products can be norms about processes at all; whether the accuracy camp can recover inquiry norms by moving to a diachronic or time-discounted measure of total inaccuracy, and whether doing so is a genuine convergence or a concession; and whether the residual dispute is about which objects epistemic norms govern rather than about what those norms require.

  Aim for something a careful reader can get through in about fifteen minutes.
reasoning: |-
  We are drafting a joint statement between two camps: the "accuracy-first" camp (which evaluates credences via scoring rules) and the "zetetic" camp (which focuses on inquiry). The document must be self-contained, precise, and structured as requested.

  ## Structure:

  ### 1. Agreed Claims (10-14 items)

  We list claims both camps can agree on. We include:
  - Definitions of key terms (e.g., proper scoring rule, convexity, domination, etc.)
  - Known results (e.g., free evidence cannot lower expected score under a proper scoring rule)
  - Clarifications about what is not being claimed (to prevent straw-manning)

  ### 2. Disagreements Table

  We identify key cruxes. For each, we provide:
  - The accuracy camp's position (as they would phrase it)
  - The zetetic camp's position (as they would phrase it)
  - Whether the disagreement is genuine or verbal (and if verbal, what the substantive issue is)
  - A shared case or argument that bears on the crux
  - Predictions from each camp about what the case/argument will show

  We use the cases: The Dogmatist, The Lazy Calibrator, The Lucky Guesser, The Slow Truth.

  Cruxes to cover (restructured as needed):
  - Can expected-accuracy arguments only tell an agent what is better by her own lights? (Dogmatist case)
  - Is the choice among proper scoring rules conventional? How much does the program depend on it?
  - Can norms about products (credences) be norms about processes (inquiry) at all?
  - Can the accuracy camp recover inquiry norms by moving to diachronic or time-discounted measures? Is that convergence or concession?
  - Is the residual dispute about the objects of epistemic norms?

  ### 3. What Would Move Each Camp

  A short section on what each camp would actually treat as a reason to shift.

  ### 4. Failure Conditions

  What would count as the collaboration having produced nothing (vs. a precise disagreement).

  ## Drafting:

  ### 1. Agreed Claims

  1. **Scoring Rules**: A scoring rule $S(p, \omega)$ assigns a numerical score to a credence function $p$ (defined over a set of propositions) when the state of the world $\omega$ is revealed. It is strictly proper if for any probability function $q$, the expected score $E_{q}[S(q, \cdot)]$ is minimized uniquely at $q$. (Both camps agree that strictly proper scoring rules are the appropriate measures for evaluating credences.)

  2. **Convexity and Propriety**: The propriety of a scoring rule ensures that an agent who reports her true credences uniquely minimizes her expected score. Convexity (in the sense of the loss function being convex in the credence) is a property of many proper scoring rules (e.g., Brier score) and is often used to derive domination results.

  3. **Domination Arguments**: An argument that shows that non-probabilistic credences are dominated by probabilistic ones: for any non-probabilistic credence function, there is a probabilistic one that has a better (or at least as good) score in every possible world. (Both camps accept that such arguments establish the norm of probabilism.)

  4. **Expected-Accuracy Arguments**: These arguments show that, by an agent's own lights, a particular credence (e.g., the one set by conditionalization) maximizes expected accuracy. (Both camps accept that such arguments can justify updating by conditionalization, when the agent's goal is to minimize expected inaccuracy.)

  5. **Free Evidence**: Both camps agree that if an agent receives cost-free evidence (and updates by conditionalization), then her expected score (by her prior) cannot be worse than without the evidence. In fact, it will be strictly better unless the evidence is irrelevant to the scoring proposition.

  6. **Synchronic vs. Diachronic**: Synchronic evaluation assesses a credence function at a single time. Diachronic evaluation assesses how credences change over time. Both camps agree that synchronic norms (like probabilism) can be defended by domination arguments, and diachronic norms (like conditionalization) by expected-accuracy arguments.

  7. **Admissible Measures of Accuracy**: Both camps agree that any strictly proper scoring rule is an admissible measure of accuracy. They also agree that the choice of which strictly proper rule to use may be conventional, but that the core results (like the arguments for probabilism and conditionalization) hold for any strictly proper rule.

  8. **No Claim of Exhaustiveness**: The accuracy camp does not claim that all epistemic norms are reducible to accuracy norms. The zetetic camp does not claim that inquiry norms are entirely independent of accuracy considerations.

  9. **Goal of Inquiry**: Both camps agree that one central goal of inquiry is to arrive at accurate credences. However, the zetetic camp holds that this is not the only goal, and that the process of inquiry itself has norms that are not reducible to the accuracy of the final credences.

  10. **The Value of Evidence**: Both camps agree that, by an agent's own prior, cost-free evidence has non-negative expected value (in terms of improving expected accuracy). They also agree that this does not imply that the agent will always seek evidence, because seeking evidence may have costs (time, resources, etc.) that are not captured in the scoring rule.

  11. **Not Claiming that Inquiry is Irrelevant**: The accuracy camp does not claim that the process of inquiry is irrelevant to epistemic evaluation. They hold that the quality of the process may be reflected in the final credences (or in diachronic accuracy measures). The zetetic camp does not claim that the accuracy of the final credences is irrelevant.

  12. **The Role of Luck**: Both camps agree that the accuracy of a credence function (as measured by a scoring rule) is determined by the credence and the world, not by the process that led to it. Thus, two agents with the same credence in the same world get the same score, regardless of how they arrived at it. (This relates to the Lucky Guesser case.)

  13. **Temporal Discounting**: Both camps agree that if we discount future inaccuracy (i.e., we care more about being accurate sooner), then we can define a time-discounted total inaccuracy. However, they disagree on whether this captures the full normative force of inquiry norms.

  14. **The Dogmatist Case**: Both camps agree that the Dogmatist (who has credence 1 in a false hypothesis) is in a bad epistemic state. They also agree that, by the Dogmatist's own lights, no experiment has positive expected value (since she is certain that the hypothesis is true). The disagreement is about whether the accuracy framework can explain why the Dogmatist ought to inquire.

  ### 2. Disagreements Table

  We structure the table with the following columns for each crux:

  - **Crux**: A brief label.
  - **Accuracy Camp Statement**: Phrased as they would.
  - **Zetetic Camp Statement**: Phrased as they would.
  - **Nature of Disagreement**: Genuine or verbal? If verbal, what is the substantive issue?
  - **Shared Case/Argument**: Which case (from the list) or what kind of argument bears on this?
  - **Accuracy Camp Prediction**: What they think the case/argument will show.
  - **Zetetic Camp Prediction**: What they think the case/argument will show.

  We cover four cruxes, each tied to a case.

  #### Crux 1: The Dogmatist and the Limits of Expected-Accuracy Arguments

  - **Accuracy Camp Statement**: Expected-accuracy arguments are the correct way to evaluate the rationality of an agent's actions (including inquiry). If, by the agent's own credences, an action (like seeking evidence) has non-positive expected value, then the agent is not rationally required to take that action. The Dogmatist is irrational because she has an inaccurate credence, but the framework does not require her to seek evidence because she is certain she is already accurate.

  - **Zetetic Camp Statement**: Epistemic norms require an agent to engage in inquiry when she is in a state of error, even if by her own lights she is not. The Dogmatist is irrational not only in her credence but also in her refusal to inquire, and this second failure is not captured by any expected-accuracy argument that uses her current credences.

  - **Nature of Disagreement**: Genuine. The accuracy camp holds that rationality is agent-relative (based on the agent's own credences), while the zetetic camp holds that there are objective norms of inquiry that apply regardless of the agent's credences.

  - **Shared Case**: The Dogmatist case.

  - **Accuracy Camp Prediction**: The framework correctly diagnoses that the Dogmatist's credence is bad (it will get a very bad score) and that she is irrational for having that credence. But the framework cannot require her to seek evidence because she is certain she is right. To avoid this, she must have been required to have a different credence earlier (e.g., one that allowed for uncertainty) or we must consider diachronic measures that penalize long-term inaccuracy.

  - **Zetetic Camp Prediction**: The case shows that the accuracy framework cannot account for the irrationality of the Dogmatist's refusal to inquire. This is because the framework is tied to the agent's current perspective. The zetetic norms, which focus on the process, can explain why she should inquire: she is in a state of error and inquiry is the way to correct it.

  #### Crux 2: The Lazy Calibrator and the Role of Inquiry

  - **Accuracy Camp Statement**: The Lazy Calibrator has perfectly calibrated credences. Her credences are therefore rational from a synchronic perspective. If we want to criticize her policy of never running discriminating tests, we must either (a) move to a diachronic measure of accuracy (e.g., total inaccuracy over time) that would penalize her for not improving her accuracy faster, or (b) note that her policy may lead to poor accuracy in the long run if the base rates change and she doesn't notice.

  - **Zetetic Camp Statement**: The Lazy Calibrator is failing in her duties of inquiry. She is not gathering evidence that would allow her to form more accurate credences about individual cases. Even if her synchronic credences are calibrated, she is not being epistemically responsible because she is not seeking to improve her understanding beyond the base rates.

  - **Nature of Disagreement**: Partly verbal. Both camps agree that the Lazy Calibrator is not doing as well as she could. The substantive issue is whether the failure is one of accuracy (which might be captured diachronically) or of inquiry (which is a distinct norm).

  - **Shared Case**: The Lazy Calibrator.

  - **Accuracy Camp Prediction**: With a diachronic measure (e.g., the sum of scores over time, perhaps discounted), the Lazy Calibrator will be shown to have worse total inaccuracy than an agent who refines her credences with evidence. Thus, the accuracy framework can capture the criticism.

  - **Zetetic Camp Prediction**: Even if the diachronic measure shows that the Lazy Calibrator does worse over time, this does not capture the full normative failure. The failure is in the process: she is not asking the right questions or engaging in the right investigations, which is a distinct norm that cannot be reduced to avoiding inaccuracy.

  #### Crux 3: The Lucky Guesser and the Role of Process

  - **Accuracy Camp Statement**: The accuracy of a credence function is entirely determined by the credence and the world. Therefore, the Lucky Guesser (who guessed correctly) and the agent who inquired both have the same credence and thus the same accuracy. The process that led to the credence is irrelevant to the evaluation of the credence itself. However, the accuracy camp may note that the inquirer is more reliable in the long run and thus might be preferred on instrumental grounds.

  - **Zetetic Camp Statement**: The epistemic status of an agent is not solely determined by the accuracy of her credences. The agent who engaged in a well-designed inquiry is epistemically praiseworthy for her process, while the Lucky Guesser is not, even if they have the same credence. This difference is not captured by scoring rules.

  - **Nature of Disagreement**: Genuine. The accuracy camp holds that the product (the credence) is the primary object of evaluation. The zetetic camp holds that the process (the inquiry) is also a primary object.

  - **Shared Case**: The Lucky Guesser.

  - **Accuracy Camp Prediction**: The scoring rule will give the same score to both agents. The difference between them is not in the accuracy of their credences but in how they arrived at them. If we want to evaluate the process, we might use a different measure (e.g., the expected score of the process), but that is separate from the accuracy of the credence at the time.

  - **Zetetic Camp Prediction**: The case shows that the scoring rule does not capture the difference in epistemic virtue between the two agents. The agent who inquired has followed the norms of good inquiry and thus deserves epistemic credit that the Lucky Guesser does not.

  #### Crux 4: The Slow Truth and the Importance of Time

  - **Accuracy Camp Statement**: Synchronic accuracy at the end is the same for both agents. However, if we care about being accurate sooner, we can discount future inaccuracy. Then, the agent who reached the truth in a day would have a better total discounted inaccuracy than the one who took a decade. Thus, the accuracy framework can account for the value of speed.

  - **Zetetic Camp Statement**: The difference between the two agents is not just about the time when they became accurate. The agent who took a decade may have been negligent or inefficient in her inquiry. The norms of inquiry require not only reaching the truth but doing so in a timely manner, and this is not merely a matter of discounting inaccuracy.

  - **Nature of Disagreement**: Verbal? The accuracy camp thinks that discounting captures the normative difference. The zetetic camp thinks that discounting does not capture the full normative force of efficient inquiry.

  - **Shared Case**: The Slow Truth.

  - **Accuracy Camp Prediction**: With a discounted inaccuracy measure, the agent who took a day will have a better total score. Thus, the framework can explain why one agent did better.

  - **Zetetic Camp Prediction**: Discounting inaccuracy might capture the value of speed, but it does not account for the agent's diligence during the inquiry. The agent who took a decade might have been working hard but on the wrong questions, or she might have been lazy. The discounting approach does not distinguish between these.

  ### 3. What Would Move Each Camp

  - **Accuracy Camp**: They would be moved by a proof that there are inquiry norms that cannot be captured by any diachronic accuracy measure (e.g., a measure that aggregates scores over time, possibly with discounting). Alternatively, they might be moved by a case where an agent follows all accuracy norms (including diachronic ones) but still violates a norm of inquiry that both camps agree exists.

  - **Zetetic Camp**: They would be moved by a demonstration that all inquiry norms can be derived from diachronic accuracy measures (with appropriate discounting) and that these measures capture the full normative force of the zetetic norms. Alternatively, they might be moved by a case where an agent violates an inquiry norm but does not do worse on any diachronic accuracy measure.

  ### 4. Failure Conditions

  The collaboration will have produced nothing if:
  - The camps cannot agree on the shared claims (we assume they do for this document).
  - The camps cannot identify the cruxes precisely (we have done so).
  - The camps cannot agree on what would count as evidence for or against their positions (we have specified cases and predictions).

  The collaboration has produced a precise disagreement if:
  - The camps agree on the machinery (as in the agreed claims) but still disagree on the substantive points in the table, and they agree on what kind of evidence would resolve the disagreement (even if they predict different outcomes).

  ## Final Document

  We now write the document in the requested format.
answer: |-
  ### Joint Statement on Epistemic Norms: Accuracy-First and Zetetic Perspectives  
  **Preface**: This document results from an adversarial collaboration between proponents of the accuracy-first program (which evaluates credences via proper scoring rules) and the zetetic program (which evaluates inquiry processes). It aims to clarify agreements, pinpoint disagreements, and identify decisive tests. Terms are defined formally, and arguments are self-contained.  

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following:  

  1. **Proper Scoring Rule**: A function \(S(p, \omega)\) assigning a real-valued score to credence function \(p\) when world-state \(\omega\) obtains. \(S\) is *strictly proper* if for any probability function \(q\), \(q\) uniquely minimizes expected score: \(\mathbb{E}_q[S(q, \cdot)] < \mathbb{E}_q[S(p, \cdot)]\) for \(p \neq q\). Propriety ensures honesty is the optimal reporting strategy.  
  2. **Convexity and Domination**: Convexity of \(S\) (in \(p\)) supports *domination arguments*: non-probabilistic credences are accuracy-dominated (strictly outperformed in all worlds by some probabilistic alternative). This justifies *probabilism* (credences should be probabilities).  
  3. **Expected-Accuracy Arguments**: These show that conditionalization maximizes expected accuracy (minimizes expected score) by the agent’s own prior. For example, updating on evidence \(E\) yields \(\mathbb{E}[S(p(\cdot|E), \cdot)] \leq \mathbb{E}[S(p(\cdot), \cdot)]\) for proper \(S\), with equality iff \(E\) is irrelevant.  
  4. **Free Evidence Theorem**: Cost-free evidence never lowers expected accuracy (as per 3). Thus, rejecting free evidence is suboptimal by the agent’s *current* lights.  
  5. **Synchronic vs. Diachronic Evaluation**: Synchronic norms (e.g., probabilism) apply at a time; diachronic norms (e.g., conditionalization) apply across times. Domination arguments are synchronic; expected-accuracy arguments are diachronic.  
  6. **Admissible Accuracy Measures**: Any strictly proper \(S\) is admissible for scoring credences. Common examples:  
     - Brier score: \(S(p, \omega) = -(1 - p(\omega))^2 - \sum_{X \neq \omega} p(X)^2\)  
     - Log score: \(S(p, \omega) = -\log p(\omega)\)  
     The core norms (1–5) hold for all strictly proper \(S\).  
  7. **Goal of Accuracy**: Both camps agree that accurate credences are a primary epistemic good.  
  8. **No Claim of Exhaustiveness**: The accuracy camp does not claim scoring rules capture *all* epistemic norms (e.g., logical consistency may precede accuracy). The zetetic camp does not deny that accuracy matters.  
  9. **Process-Product Link**: Both agree that inquiry processes *influence* credence accuracy.  
  10. **Value of Evidence**: Both agree that (by the agent’s prior) cost-free evidence has non-negative expected accuracy value.  
  11. **Not Anti-Inquiry**: The accuracy camp does not oppose inquiry; it seeks to derive its value from accuracy.  
  12. **Role of Luck**: For a given \(\omega\), identical credences receive identical \(S\)-scores, regardless of process (e.g., guessing vs. inquiry).  
  13. **Diachronic Measures**: Total inaccuracy can be defined diachronically, e.g., as cumulative discounted score: \(\sum_{t} \gamma^t S(p_t, \omega)\), with discount factor \(\gamma \in [0,1]\).  

  ---

  ### 2. Disagreements Table  
  Key cruxes are tested against four cases. For each, we state positions, diagnose disagreement, and specify tests.  

  | Crux | Accuracy-First Position | Zetetic Position | Disagreement Nature | Shared Test Case | Accuracy Prediction | Zetetic Prediction |
  |------|-------------------------|------------------|---------------------|-----------------|---------------------|-------------------|
  | **A. Limits of Expected-Accuracy Arguments** | Expected-accuracy arguments are foundational. They prescribe actions (e.g., inquiry) *only* if those actions have positive expected value *by the agent’s current credences*. Rationality is constrained by the agent’s perspective. | Norms of inquiry apply *objectively*, even when the agent’s credences preclude recognizing their value. Rationality requires responsiveness to external epistemic demands, not just internal coherence. | Genuine: Dispute over whether epistemic norms are agent-relative. | **Dogmatist**: Agent has credence \(p(H) = 1\) for false \(H\). By her lights, no experiment has positive expected accuracy value. | Accuracy: Dogmatist is irrational for her credence (dominated) but *not* for refusing inquiry—no tool faults her for inaction under certainty. | Zetetic: Dogmatist is doubly irrational: for her credence *and* for refusing inquiry. The framework cannot explain the latter, revealing its inadequacy. |
  | **B. Conventionality of Scoring Rules** | The choice among strictly proper \(S\) is pragmatic or conventional (e.g., Brier vs. log loss). Core norms (e.g., conditionalization) are invariant under this choice. | The choice of \(S\) masks substantive commitments (e.g., log loss penalizes overconfidence more). Inquiry norms cannot be derived without smuggling in such values, making the program question-begging. | Verbal (underlying substantive issue): Whether inquiry norms depend on features not captured by *any* \(S\). | **Lazy Calibrator**: Forecaster always reports base rates, never tests. Synchronic calibration is perfect, but she never inquires. | Accuracy: Under synchronic \(S\), her credences are rational. Under diachronic \(S\) (e.g., \(\sum \gamma^t S\)), she is penalized for slow learning. This suffices. | Zetetic: Diachronic \(S\) conflates speed with quality of inquiry. She violates norms of *responsible engagement* (e.g., testing limits), which no \(S\) captures. |
  | **C. Reduction of Process to Product** | Diachronic accuracy measures (e.g., time-discounted cumulative score) fully capture the epistemic value of inquiry processes. Process norms reduce to optimizing long-term accuracy. | Inquiry has intrinsic norms (e.g., asking relevant questions, avoiding stagnation) that are not reducible to accuracy outcomes. A process can be faulty even if it coincidentally yields good credences. | Genuine: Dispute over whether process norms are derivative or fundamental. | **Lucky Guesser**: Two agents end with identical true credence \(p(H) = 0.9\). One arrived via rigorous inquiry; one guessed. | Accuracy: Synchronic score identical. Diachronic score may differ if guesser was inaccurate longer. *All* differences are accuracy differences. | Zetetic: The inquirer deserves credit for her process (e.g., thoroughness) regardless of outcome. No scoring rule reflects this, as luck can equalize scores. |
  | **D. Diachronic Measures as Solution** | Extending to diachronic accuracy (e.g., \(\sum \gamma^t S\)) recovers inquiry norms: slower inquirers score worse, lazy calibrators are penalized, and dogmatists pay long-term costs. This converges with zetetic insights. | Diachronic measures *concede* the core claim: inquiry is irreducible. Discounting is a proxy for process quality, but norms like "ask fruitful questions" are not about accuracy—they govern actions *before* outcomes exist. | Genuine: Whether diachronic scoring adequately captures inquiry. | **Slow Truth**: Two inquirers reach identical true credence. One takes a day; one a decade. | Accuracy: With \(\gamma < 1\), faster inquirer has better cumulative score. This explains the value of speed. | Zetetic: Speed matters, but the framework cannot distinguish diligent-but-slow inquiry from negligent slowness. Process virtues (e.g., efficiency) are lost. |

  ---

  ### 3. What Would Move Each Camp  
  - **Accuracy-First Camp**: Would shift if shown a norm of inquiry that:  
    (i) Cannot be expressed as maximizing expected accuracy (under any diachronic measure).  
    (ii) Both camps agree is epistemic (e.g., "test hypotheses when uncertain").  
    Example: A case where an agent violates (ii) but *optimizes* expected diachronic accuracy.  
  - **Zetetic Camp**: Would shift if shown that:  
    (i) All agreed inquiry norms are derivable from diachronic accuracy optimization.  
    (ii) No "process-first" intuition survives when diachronic accuracy is fixed.  
    Example: A case where an agent follows inquiry norms perfectly but scores worse on all diachronic measures.  

  ---

  ### 4. Failure Conditions  
  This collaboration produces **nothing** if:  
  - Agreed claims (Section 1) are incomplete or incorrect (e.g., if propriety does not ensure honesty).  
  - Disagreements (Section 2) are misdiagnosed (e.g., a "genuine" crux is actually verbal).  
  - Tests (e.g., Dogmatist) are rejected by one camp as irrelevant.  

  It produces a **precise disagreement** if:  
  - Both endorse Section 1 as sound machinery.  
  - Both accept the cruxes in Section 2 as stated.  
  - Both agree the test cases would resolve the cruxes as predicted.  

  ---  
  **End of Document**
