answer: |-
  ### Joint Statement: Rapporteur's Draft  
  **Adversarial Collaboration on Rational Choice & the Stranded Motorist Case**  

  ---

  #### Part 1: Agreed Claims  
  1. **Base Case Structure**: A passenger stranded without alternatives is offered a ride by a driver who accurately predicts whether the passenger will pay upon arrival. The driver offers the ride *only* if she predicts payment.  
  2. **Instrumental Irrationality of Paying**: Considered solely as a cause of its immediate consequences (money lost with no offsetting benefit), the act of paying is contrary to the passenger’s aims at the moment of choice.  
  3. **Global Benefit of Disposition**: The passenger benefits overall from being the sort of person disposed to pay, as this disposition secures the ride.  
  4. **Simultaneous Agent Focus**: Both camps address what the *same* agent ought to do (or be) *at the time the ride is offered* and *at the moment of payment*.  
  5. **Predictive Mechanism**: The driver’s prediction reliably tracks the passenger’s actual disposition (or its behavioral manifestations).  
  6. **No Direct Causal Link**: Payment does not cause the ride; the driver’s prediction does.  
  7. **No Free-Riding Disposition**: A disposition to *avoid* paying whenever possible cannot secure the ride.  
  8. **Amortization Condition**: A standing disposition is rationally sustainable only if its long-term benefits (across its typical applications) outweigh its costs. A disposition rational *only* for a single, non-recurring case is suspect.  
  9. **Outcome-Sensitivity**: Rationality must be responsive to outcomes, but the scope of "outcomes" (immediate vs. long-term) is disputed.  
  10. **Non-Vacuous Rationality**: Rationality cannot require an agent to adopt a disposition that systematically produces net losses.  

  ---

  #### Part 2: Residual Disagreements  
  | Issue (Neutral) | Camp D Formulation | Camp R Formulation | Disagreement Type | Diagnosis (If Verbal) |  
  |-----------------|--------------------|--------------------|------------------|------------------------|  
  | **Primary Locus of Rationality** | Rationality fundamentally evaluates *dispositions*; acts derive rationality from the disposition that produces them. | Rationality fundamentally evaluates *acts* under choice rules; dispositions are rational insofar as they produce rational acts. | Substantive | — |  
  | **Status of the Payment Act** | Paying is irrational *as an isolated act* but is rationally required *as an exercise of a rational disposition*. | Paying is rational *because* the correct choice rule ranks it higher, given its role as an indicator of the disposition securing the ride. | Substantive | — |  
  | **"Self-Defeating" Description** | This case shows a rational disposition can require irrational acts. | This case shows that choice rules ignoring predictive indicators yield incorrect act-rankings; no irrationality occurs. | Verbal | "Irrationality" is equivocal: Camp D uses it for act-consequence mismatch; Camp R reserves it for violations of the *correct* choice rule. |  
  | **Scope of "Consequences"** | Consequences of an act exclude its role as evidence of a disposition. | Consequences inherently include the act’s informational effects on predictors. | Substantive | — |  

  ---

  #### Part 3: Crux Table  
  | Crux | Case/Test | Camp D Prediction | Camp R Prediction |  
  |------|-----------|-------------------|-------------------|  
  | **Trace-Reader Variant** (Driver predicts from past behavioral traces, not disposition) | Driver sees records of past payments; no access to underlying trait. | Recommendations converge: Both advise paying to maintain reputation. Camp D denies this collapses into R’s view, as dispositions remain primary. | Recommendations converge. Camp R claims this shows Camp D implicitly uses an act-ranking rule sensitive to predictive roles. |  
  | **Costly-Self-Binding Variant** (Passenger can install a payment-enforcing device pre-ride) | Driver observes device installation. | Self-binding is a *substitute* for dispositional rationality. Base Case disposition remains rational if cheaper than device. | Self-binding confirms that rational acts (installing device) can secure the ride; Base Case paying is analogous. Device not needed if act-ranking is correct. |  
  | **Serial-Rider Variant** (Multiple rides; driver sees only prior outcomes) | Passenger faces sequence of identical choices; driver reviews payment history. | Disposition rational *only* if Amortization Condition holds (gains > costs across rides). One-off disposition fails. | Reputation management is rational under a dynamic choice rule. Single-instance payment irrational unless part of a series. |  
  | **Advice Test** | What to advise: <br> (A) Pre-ride: "Should I cultivate a paying disposition?" <br> (B) In town: "Should I pay?" | (A) Yes, cultivate disposition. <br> (B) No (paying is irrational), but you *will* pay if rational disposition holds. | (A) Yes, adopt policy of paying. <br> (B) Yes, pay—it’s rational given its predictive role. |  
  | **Clean-Acquisition Question** | How can a non-paying passenger become disposed to pay without irrational steps? | Requires a route not involving irrational acts (e.g., gradual habit formation). If no route exists, "ought" implies "can" fails; no blame. | Dispositions are irrelevant; focus is on act-choice. If no feasible way to pay *now* (e.g., no device), Camp R revises act-ranking. |  
  | **No-Predictor Cases** (e.g., self-command, credible threats via emotion) | Can the Base Case structure arise with no external predictor? (e.g., "I must follow my rule or undermine future resolve.") | Yes: A rational *self*-predictor requires dispositions. Verdicts track Base Case (rule-following act locally irrational). | Yes: Rational choice rules incorporate self-predictive effects. Verdicts track Base Case (rule-following act rational). |  

  ---

  #### Part 4: Closing Commitments  
  **Signed by Both Camps**:  
  - **Camp D** acknowledges a genuine cost if future work shows *all* dispositional benefits reduce to reputation effects traceable without disposition-talk (e.g., in Serial-Rider with perfect records).  
  - **Camp R** acknowledges a genuine cost if a case emerges where an act is (i) correctly ranked as irrational under *any* plausible choice rule, yet (ii) rationally required by an independently justified disposition.  
  - **Both agree** that the decisive development would be a formal model of **multi-scale rational agency** (integrating act-choice, trait cultivation, and self-prediction) that generates testably distinct predictions for D and R in edge cases (e.g., traits with non-informational costs).  

  ---  
  **Rapporteur’s Certification**:  
  This document reflects points of agreement and disagreement without coercive redefinition. Where advice converges (e.g., Trace-Reader variant), the dispute is framed as explanatory rather than prescriptive. Residual substantive disagreements are preserved in mutually acceptable formulations.
