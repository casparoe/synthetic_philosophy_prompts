answer: |-
  ### Exam Question: Dispositions, Finks and Masks (40 minutes; approx. 800 words)

  **Answer all parts of this question.**

  1.  **Case 1: The Self-Healing Vase:** A vase is intrinsically fragile. However, it has a special coating containing microcapsules. When the vase is struck (the characteristic stimulus for fragility), the glass *does* crack. However, within one millisecond, the microcapsules release a bonding agent that perfectly re-bonds the glass. There is never any lasting damage; the vase never enters a broken state. Is this a case of **masking**? Or has the fragility manifested (by cracking) and then been "cleaned up"? To answer this, you must explicitly address: **What is the manifestation of fragility?** Is it the *occurrence of the cracking process* or the *achievement of the end state (being broken)*? (6 marks)

  2.  **Case 2: The Slow Fink:** A different vase is also intrinsically fragile. When struck (the stimulus), it begins to crack. However, the impact *also* triggers a hidden mechanism that rapidly heats and anneals the glass exactly where the crack is starting. The crack begins to propagate but stalls out halfway through the glass before completing. The annealing process destroys the very causal basis that made the glass fragile *in that specific location at that specific time*. Is this best described as a **fink** (where the basis is removed *by* the stimulus) or a **mask** (where an interfering process prevents the manifestation)? Crucially, does the fact that the basis is destroyed *only after the manifestation (cracking) has begun* suggest the fink/mask distinction depends on how finely we describe the causal basis and the temporal stages of the manifestation? (6 marks)

  3.  **Follow-Up 1: Trouble for Realism?** Martin, Lewis, Bird, et al., initially discussed finks and masks as problems for the *conditional analysis* of dispositions. Does the existence of cases like 1 and 2 pose any significant challenge to a **realist about dispositions/powers** (someone who rejects the conditional analysis and takes dispositions as irreducible fundamental properties)? Or are finks and masks *only* problematic for reductive analyses? Explain your reasoning. (4 marks)

  4.  **Follow-Up 2: Distinction in Nature or Description?** Based on your analysis of Cases 1 and 2, is the distinction between finks and masks a robust **distinction in nature** (reflecting two fundamentally different ways dispositions can fail to manifest), or is it primarily an **artifact of description** – dependent on how we specify the stimulus conditions, the temporal scale, or the granularity of the manifestation event? Defend your view. (4 marks)

  ---

  ### Model Answer (approx. 600 words)

  **(1) The Self-Healing Vase & Manifestation:** This case pressures the *definition of the manifestation itself*. Classifying it hinges entirely on whether fragility's manifestation is the *cracking process* or the *broken end state*.

  *   If the manifestation is **cracking**, then it *does* occur upon being struck. The subsequent healing is irrelevant to whether manifestation happened; it's a separate process cleaning up the result. This *isn't* masking, as the disposition manifested. Masking typically *prevents* the manifestation process from occurring or completing as expected *in response to the stimulus*. Here, the expected immediate response (cracking) occurred.
  *   If the manifestation is **being broken**, then the vase never manifests fragility. The cracking is merely an intermediate step towards the broken state, which is reliably prevented by the coating. This looks like a **mask**: the intrinsic disposition (fragility) is present, the stimulus occurs, but an interferer (coating) prevents the manifestation (being broken) from occurring.

  The case shows finks/masks alone don't resolve this; we need a prior commitment to what counts as manifestation. The literature often ambiguously slides between process and outcome. Case 1 forces us to choose, revealing that "mask" might apply only if we define manifestation as the end state. If manifestation is the process, this is a successful (though ephemeral) manifestation plus an interferer. This ambiguity isn't resolved by simply relativizing to a causal basis.

  **(2) The Slow Fink & Granularity:** The Slow Fink blurs the fink/mask distinction by exploiting **temporal and causal granularity**.

  *   Described coarsely: Stimulus (strike) causes the basis to be destroyed (via annealing), preventing the manifestation (complete break). This fits the classic **fink** definition: the stimulus itself removes the basis.
  *   Described finely: The stimulus *initiates two processes simultaneously*: (a) the crack propagation (the beginning of the manifestation process) and (b) the annealing process (the interferer). The annealing process then *masks* the completion of the cracking process after it has started. From this perspective, it looks like a **mask** – an interferer active *during* the manifestation process.

  The key pressure point is the **"simultaneity"** assumption often implicit in discussions of finks (stimulus instantly removes basis *before* manifestation). Here, the stimulus causes the basis-destruction *process*, which operates *alongside* and *interrupts* the manifestation *process*. Whether we call it a fink or a mask depends on whether we view the basis-loss as instantaneous (fink) or as an ongoing interfering process (mask), and whether we consider the initiation of cracking as part of the manifestation or merely a precursor. This case suggests the distinction is less sharp than often assumed; it's sensitive to how we parse the causal sequence and the temporal stages of both the stimulus's effect on the basis and the manifestation event itself.

  **(3) Trouble for Realism?** Finks and masks are primarily problems *for reductive conditional analyses* (like SCA), as they show the conditional fails to be necessary or sufficient. However, Cases 1 and 2 *do* pose a challenge, albeit different, for realists.

  *   **Not a Direct Refutation:** Realists aren't refuted; they never claimed dispositions *must* manifest when stimulated, only that they are real properties. They can accommodate interferers within their ontology.
  *   **The Challenge is Metaphysical Refinement:** Cases 1 and 2 force realists to precisely define the **manifestation relation**. What *counts* as the manifestation? Is it a process or an end state (Case 1)? How temporally extended and causally fine-grained is the "stimulus-manifestation" link (Case 2)? Realists need a metaphysics that clarifies the nature of the dispositional property, its manifestation, and how interferers relate to them, avoiding the ambiguities exposed here. The challenge is ontological clarification, not reductivist failure.

  **(4) Distinction: Nature or Description?** Cases 1 and 2 strongly suggest the fink/mask distinction is **primarily an artifact of description**, not a fundamental distinction in nature.

  *   **Case 1:** Whether the coating is a mask depends entirely on how we define the manifestation (process vs. end state). The underlying physical situation is the same.
  *   **Case 2:** Whether the mechanism is a fink or a mask depends on the temporal and causal granularity of our description of the basis-loss and the manifestation process. The underlying physical process is singular: stimulus initiates both crack *and* annealing.
  *   **The Core Problem:** Both phenomena involve a disposition, a stimulus, and an interferer that prevents the *expected outcome*. The difference between a fink (basis removed by stimulus) and a mask (basis present but manifestation prevented) hinges on *when* and *how* the interferer operates relative to the stimulus and the onset of manifestation – distinctions that are often vague or description-dependent in complex causal scenarios. Nature presents us with interfering causal pathways; "fink" and "mask" are useful labels for *describing different patterns* of interference, but they don't necessarily carve reality at its joints as two wholly distinct metaphysical categories. The pressure from these cases is towards seeing a spectrum of interference based on causal/temporal structure.

  ---

  ### Marking Scheme (Total: 20 marks)

  | **Must-Hit Point**                                                                 | **Marks** | **How Students Typically Go Wrong (Partial Credit / No Credit)**                                                                                                                                                                | **Full Credit Moves**                                                                                                                                                                                                                   |
  | :--------------------------------------------------------------------------------- | :-------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Case 1: Explicitly defines manifestation (process vs. state) & links to mask classification.** | 4         | **PC (2):** Correctly identifies it *could* be a mask or manifested, but **fails to explicitly define manifestation** or directly link that definition to the classification. **NC (0):** Calls it mask/fink without justification. | **Defines manifestation** clearly as either (a) cracking process OR (b) broken state AND **explicitly states** how this definition leads to the classification (Mask only if (b); manifestation occurred if (a)).                        |
  | **2. Case 2: Identifies granularity dependence & explains fink/mask ambiguity.**         | 4         | **PC (2):** Correctly identifies it as fink-like OR mask-like, but **fails to connect ambiguity to temporal/causal granularity** (basis stages, manifestation stages) or the "slow" aspect. **NC (0):** Simply labels it.          | **Explicitly states** that classification depends on description granularity AND **explains how**: Coarse (basis destroyed by stimulus = Fink) vs. Fine (manifestation begins, then interferer stops it = Mask), due to process duration. |
  | **3. Case 1 & 2: Shows they pressure *different* ambiguities (Manifestation vs. Granularity).** | 4         | **PC (2):** Discusses both cases well but **treats them as illustrating the *same* problem** (e.g., "both show interference is messy"). **NC (0):** Doesn't contrast the core pressure points.                              | **Clearly states** Case 1 primarily exposes ambiguity in **defining the manifestation event** (what counts?), while Case 2 primarily exposes ambiguity in **temporal/causal granularity** of basis, stimulus, and manifestation stages. |
  | **4. Follow-Up 1: Realism Challenge - Not reductive failure, but need for clarification.** | 4         | **PC (2):** Correctly says it's not a problem OR says it is a problem, but **fails to articulate the *specific* challenge (metaphysics of manifestation)**. **NC (0):** Claims realism is refuted or has no problems.             | **States** finks/masks don't refute realism / are primarily reductive problems **BUT** Cases 1/2 force realists to **precisely define the manifestation relation** (ontologically, not just extensionally) to handle ambiguity.         |
  | **5. Follow-Up 2: Distinction - Argues for artifact of description (with case support).** | 4         | **PC (2):** Says it's descriptive OR in nature, but **lacks argument using Cases 1/2** or doesn't address the core reason (dependence on definition/granularity). **NC (0):** Asserts without argument.                              | **Argues** distinction is primarily descriptive **by citing**: Case 1 (mask depends on manifestation definition) & Case 2 (fink/mask depends on temporal/causal granularity description). **Concludes** labels describe interference patterns, not fundamental kinds. |

  **A/B Boundary:** The key distinction is **whether the student clearly recognizes and articulates that Cases 1 and 2 put pressure on *fundamentally different* conceptual ambiguities** (Manifestation Definition vs. Temporal/Causal Granularity). Simply describing the cases correctly or citing literature without this insight caps at a B. An A requires demonstrating how these cases *differently* challenge the framework.
