  The core dilemma is fascinating: if a physically identical Cervantes replica writes Don Quixote in a timeless void, whose work is it? The user cleverly boxes me into corners - accepting Cervantes' authorship undermines Borges' "time as substance" idea, while declaring it neither nullifies the significance of historical context in Pierre Menard's story. 

