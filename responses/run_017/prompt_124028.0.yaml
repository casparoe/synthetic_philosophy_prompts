  Below is a complete diagnostic questionnaire designed to sort participants into philosophical positions based on their responses to concrete cases. Each question has three options (A, B, C) and avoids jargon or theory names. The scoring key maps answer combinations to specific views, flags unresolvable overlaps, and identifies unoccupied answer patterns. 

  **Important Notes for Use:**
  - Participants should answer based on their intuitive judgment of fairness in each case.
  - The scoring key reveals which views align with their answers, using the cases as evidence (not self-labels).
  - Views are abbreviated for clarity (see key), but **no theory names appear in the questions**.
  - Two views (subjective/desire-based welfare) share identical answers and cannot be separated here. Objective welfare, Rawlsian, and capability views also overlap and require a follow-up.
  - Unoccupied answer combinations are noted as incoherent, unattractive, or simply unexplored.

  ---

  ### Questionnaire: What Should Be Equal?
  *Answer each case with A, B, or C based on what seems fairest.*

  1. **Disability & Equipment**  
     Ali has a visual impairment; Bo has none. Both get identical textbooks. Ali needs a magnifier ($100) to learn as effectively as Bo. Giving Ali the magnifier means no new library books for anyone this year.  
     - A: Give Ali the magnifier—it’s unfair Ali learns less without it.  
     - B: Buy library books—everyone benefits equally.  
     - C: Only give the magnifier if the school has extra funds.  

  2. **Expensive Taste**  
     Cass cultivated a taste for expensive organic food and is miserable with standard cafeteria meals. Providing Cass organic meals costs 3× more.  
     - A: Provide organic meals—Cass shouldn’t suffer.  
     - B: Stick to standard meals—Cass chose this preference.  
     - C: Provide organic meals only if cheap.  

  3. **Content with Less**  
     In a school where girls are taught to expect less, they report being happy with fewer opportunities. Boys expect (and get) more resources.  
     - A: Keep things as they are—girls are happy.  
     - B: Give girls extra resources—they’re deprived, even if content.  
     - C: Give equal resources to all now.  

  4. **Night Owl Schedule**  
     Dee is a night owl. A morning-heavy timetable costs Dee 2 hours of learning daily but suits 95% of students. Changing it for Dee would disrupt others.  
     - A: Adjust the timetable—Dee shouldn’t lose learning time unfairly.  
     - B: Keep the timetable—it’s fine if most benefit.  
     - C: Adjust only if many night owls exist.  

  5. **Above Minimum but Unequal**  
     All students have enough resources for a decent education. Some classrooms have cutting-edge tech; others have basics. Redistributing would make all equal but slightly reduce overall resources.  
     - A: Redistribute—equality matters above the minimum.  
     - B: Don’t redistribute—everyone has enough already.  
     - C: Redistribute only if inequality is due to luck.  

  6. **Destructive Equality**  
     The arts fund has more money than sports due to a donation. The only way to equalize them is to take money from arts and destroy it (sports can’t take more).  
     - A: Destroy the excess—equality is vital.  
     - B: Don’t destroy—waste hurts everyone.  
     - C: Destroy only if inequality causes conflict.  

  7. **Natural Talent**  
     Evan masters math effortlessly. Fran works harder but gets lower grades. Both have the same teacher and resources.  
     - A: Give Fran extra help—effort should be rewarded.  
     - B: Treat both equally—resources are already fair.  
     - C: Help Fran only if failing.  

  8. **Health Costs**  
     Gia is healthy; Han has a chronic illness requiring costly medication. Both start with equal funds, but Han spends part on medication.  
     - A: Give Han extra funds—well-being should be equal.  
     - B: Keep funds equal—Han’s health isn’t others’ responsibility.  
     - C: Give Han extra only if the illness isn’t Han’s fault.  

