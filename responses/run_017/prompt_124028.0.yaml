     - B: No, because everyone already has enough and the extra resources might be a reward for merit or just luck that doesn't harm others.
     - C: Only if the inequality is due to factors beyond the students' control.

  6. **Destructive Equality**: The school has two funds: one for arts and one for sports. The arts fund has more money because of a donation. The only way to equalize the funds is to take money from the arts fund and destroy it (since the sports fund cannot accept more due to restrictions). Should the school do this?
