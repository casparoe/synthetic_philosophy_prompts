     - B: Yes, because the girls are being deprived of opportunities they would value if they weren't socially conditioned.
     - C: We should provide the same opportunities to both, regardless of their current happiness.

  4. **Night Owl**: Dana is an extreme night owl. The school timetable starts at 8 AM, which is too early for Dana. As a result, Dana loses two hours of effective learning time each day. Should the school offer a later timetable option for Dana?
     - A: Yes, because otherwise Dana is at a disadvantage through no fault of her own.
     - B: No, because the timetable suits the majority and we cannot accommodate every individual preference.
     - C: Only if enough students want it to make it feasible.

  5. **Above Minimum but Unequal**: Everyone in the school has enough resources for a decent education (books, teachers, etc.). However, some classrooms have state-of-the-art technology and others have only the basics. Should the school redistribute resources so that all classrooms are equal?
