  2. Someone notices that two gauges agree and starts reasoning about a common maker.
     - We can avoid this by not having multiple gauges interact. Each team has its own gauge and its own set of cards. They don't compare.

  3. The self-test round might be confusing because the reliability is computed from the record. So students might say: "We don't need the gauge for that, we already know." 
     - We have to stress that we are considering a hypothetical: what if you used the gauge to answer that question? Would that give you additional reason? And then we see that it doesn't, because it's circular.

  4. The challenge rule might be underused or overused. 
     - Encourage challenges by example: in the first testing round, the instructor can challenge a team if they say "because the gauge says A" — that's invalid. They must say "because the gauge was correct on 3 out of 3 past cards".

  5. The game cannot stage the fact that in the bootstrapping argument, the subject is not just using past performance but also the current reading to justify the current reading. In the game, they are using past performance to justify trusting the current reading, which is induction. The circularity only appears in the self-test.

  Therefore, the self-test is crucial for the circularity. We have to make sure we discuss it even if the game mechanics are imperfect.

