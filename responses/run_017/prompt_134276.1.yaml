  Debrief Mapping:

  The goal is to show the following argument is problematic:
  1. The gauge says p (for some proposition p).
  2. The gauge was right in the past (about other propositions).
  3. Therefore, the gauge is reliable.
  4. Therefore, p.

  But then, when p is "the gauge is reliable", we have:
  1. The gauge says "I am reliable".
  2. The gauge was right in the past.
  3. Therefore, the gauge is reliable.
  4. Therefore, the gauge is reliable.

