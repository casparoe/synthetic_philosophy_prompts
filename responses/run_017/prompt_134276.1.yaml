     - The point: if you require zero, then you are allowing bootstrapping. If you require some number, then you are blocking bootstrapping until you have independent evidence.

  75-80 min: Connection to epistemology: 
     - "This is the easy-knowledge problem: if we allow bootstrapping, then we can get knowledge of the gauge's reliability too easily. And note: the same structure arises when you try to check your senses using your senses. For example, you look at a table and it looks red. You then check your vision by ... looking at other things? But that's induction. Or by closing your eyes and reopening them? But that's still using your senses. Can you ever get independent evidence for the reliability of your senses? If not, then either you can never know your senses are reliable (skepticism) or you must allow some form of bootstrapping. Or, perhaps, justification doesn't require being able to cite independent evidence."

  Materials List Recap:
  - Index cards: 20 (10 A, 10 B) for the hidden states.
  - Envelopes: 20 (one per card).
  - Dice: 4 (one per team).
  - Whiteboards or paper for each team to record past performance.
  - Slips of paper for justifications.
  - Scoreboard.

  This design avoids the standard cases and uses an abstract gauge. The debrief connects to the senses and the easy-knowledge problem.
