  ### **Epistemology Game: "The Trusty Gauge"**  
  **Goal:** Students experience why "self-verifying" justifications feel illegitimate, without explicitly discussing circularity or bootstrapping. They build the argument themselves and confront its problems in a visceral way.  

  ---

  ### **Materials List** (Cheap, low-tech)  
  - **Cards & Envelopes:**  
    - 40 index cards (20 red, 20 blue) for "hidden states."  
    - 40 envelopes (to hide cards). Label each envelope with a unique ID (e.g., "C1" to "C40").  
  - **Gauges (1 per team):**  
    - 4 dice (standard six-sided).  
    - 4 "gauge rules" cards (secret instructions for interpreting dice rolls):  
      > *"Roll the die for any card. If 1–5, output correct answer; if 6, output wrong answer."*  
      *(This makes gauges 83% reliable, but students don’t know this.)*  
  - **Team Supplies:**  
    - 4 clipboards with paper (to record past gauge answers and bets).  
    - 4 pens.  
    - 40 small slips (for justifications).  
  - **Class Supplies:**  
    - Scoreboard (whiteboard or poster).  
    - Timer.  
    - Master list (instructor-only) mapping card IDs to colors (red/blue).  

  ---

  ### **Game Rules**  
  **Setup:**  
  - Split into 4 teams (3–4 students each).  
  - Each team gets:  
    - 1 die ("gauge").  
    - 1 gauge rules card (kept secret until the end).  
    - 1 clipboard with paper to track past performance (columns: Card ID, Gauge’s Answer, Actual Color).  

  **Phases:**  
  1. **Training (3 rounds):**  
     - Teams get 3 envelopes (e.g., C1, C2, C3).  
     - For each card:  
       - Roll the gauge (die). Record the answer (e.g., "C1: Gauge says RED").  
       - Open envelope, record actual color, and note if gauge was correct.  
     - *Goal:* Build a track record (e.g., "Gauge was 2/3 correct").  

  2. **Testing (5 rounds):**  
     - Each round, teams get a **new envelope** (e.g., C4–C8).  
     - **Step 1:** Roll the gauge for the new card (e.g., "C4: Gauge says BLUE").  
     - **Step 2:** Decide whether to **bet** on the gauge’s answer for this card. Options:  
       - **Bet:** Gain 3 points if correct, lose 2 if wrong.  
       - **Abstain:** Lose 1 point (worse than being wrong!).  
     - **Step 3:** Write a **justification slip** (1 sentence max) for their bet.  
       - *Crucial rule:* Justification **cannot mention the gauge’s current reading** (e.g., no "because the gauge says BLUE").  
       - Allowed: Use past track record (e.g., "Gauge was 3/3 on past cards").  
     - **Step 4:** **Challenge phase:**  
       - After justifications are read aloud, rival teams can challenge.  
       - If a justification **mentions the gauge’s output or reliability** (e.g., "the gauge is trustworthy"), the challenger steals 3 points.  
       - Challenger loses 1 point if wrong.  
     - **Step 5:** Open envelope, update scores, record actual color.  

  3. **Self-Test Round (1 round, no envelope):**  
     - Teams get a slip with the question: *"Is your gauge reliable? (Right >80% of the time?)"*  
     - **Step 1:** Roll the gauge. Interpret:  
       - Die 1–5 → "YES, reliable."  
       - Die 6 → "NO, unreliable."  
     - **Step 2:** Bet on the answer (same scoring as Testing Phase).  
     - **Step 3:** Write justification slip (same rules: no mentioning the gauge’s self-test output).  
     - **Step 4:** Challenge phase occurs.  
     - **Step 5:** Instructor reveals actual reliability (calculated from team’s past record).  

  4. **Revelation & Auction (final 10 mins):**  
     - Instructor reveals: "All gauges were 83% reliable! They were trustworthy all along."  
     - **Q1:** "Did anything you did give you a reason to believe the gauge was reliable *before* this reveal?"  
     - **Auction:** "How many past successes would you need to declare 'this gauge is reliable'? Bid a number. Why is your bid *not zero*?"  

  ---

  ### **Timeline (80 Minutes)**  
  - **0–5 min:** Intro & team setup. Explain: "You’re investigators with a gauge that detects hidden states. Bet on card colors using its answers."  
  - **5–20 min:** **Training Phase.** Teams test 3 cards, build track records.  
  - **20–50 min:** **Testing Phase (5 rounds).** 5 mins per round:  
    - 1 min: Roll gauge for new card.  
    - 2 min: Discuss bet, write slip.  
    - 1 min: Justifications read, challenges.  
    - 1 min: Reveal card, update scores.  
  - **50–60 min:** **Self-Test Round.** Teams bet on gauge’s reliability. Include challenge.  
  - **60–65 min:** **Revelation.** "Gauges were reliable all along! Did your bets justify trusting them?"  
  - **65–75 min:** **Auction.** "How many past successes to claim reliability? Why not zero?"  
  - **75–80 min:** **Debrief.** Map game to epistemology (see below).  

  ---

  ### **Scoring Scheme**  
  | Action | Points |  
  |--------|--------|  
  | Correct bet | +3 |  
  | Wrong bet | −2 |  
  | Abstain | −1 |  
  | Successful challenge | +3 (steal) |  
  | Failed challenge | −1 |  

  ---

  ### **Debrief: Mapping Game to Epistemology**  
  **The Problematic Argument Students Built:**  
  1. **Gauge says P** (e.g., "Card C4 is blue").  
  2. **Gauge was right before** (e.g., "It was 3/3 correct on past cards").  
  3. **Therefore, gauge is reliable.**  
  4. **Therefore, P is true.**  

  **Where It Breaks Down (and What Resistance Costs):**  
  - **Step 1 → Step 2 (Past Success):**  
    - *Resistance:* Doubt past success ("Maybe past cards were easy!").  
    - *Cost:* Loses inductive evidence—you can’t trust *any* tool without a track record.  
  - **Step 2 → Step 3 (Infer Reliability):**  
    - *Resistance:* Reject generalization ("3 successes aren’t enough!").  
    - *Cost:* Demands impossible certainty (no number feels "safe" in the auction).  
  - **Step 3 → Step 4 (Apply Reliability):**  
    - *Resistance:* Question relevance ("What if this card is different?").  
    - *Cost:* Paralyzes action—you’d never bet, losing points to abstention.  
  - **Self-Test Round:**  
    - *The Circularity Trap:* Students use Step 2 to justify trusting the gauge’s self-verification ("It said YES, and it was right before!").  
    - *Cost of Resisting:* If you reject this, you can’t "check" your gauge using itself—so how *do* you verify reliability?  

  **Key Insights from the Game:**  
  - **No "Faulty Premise":** Each step feels reasonable alone. The problem is the *shape*—using the gauge’s past to justify its future, then using its future to confirm its past.  
  - **Reliability Isn’t the Issue:** Gauges *were* reliable, but self-verification still felt "empty."  
  - **Connection to Senses:**  
    - *"Checking your vision by looking around" is the same shape:*  
      - My eyes say P ("the table is red").  
      - My eyes were right before (I trusted them yesterday).  
      - Therefore, my eyes are reliable.  
      - Therefore, P is true.  
    - Blocking this costs you: either skepticism ("I can’t trust my senses!") or accepting that justification isn’t always citable.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"This is just ordinary induction!"**  
     - *Why it happens:* Testing Phase feels like normal generalization.  
     - *Fix:* In debrief, contrast Testing Phase (induction) with Self-Test (circularity). Ask: "Why did the self-test feel different even though both used past data?" Highlight that self-verification adds no new evidence.  

  2. **"Our gauges agree—they must share a common maker!"**  
     - *Why it happens:* Teams compare answers during challenges.  
     - *Fix:* Isolate teams. If they notice, say: "Agreement might mean nothing—what if both are broken?" Redirect to track records.  

  3. **Self-Test Feels Pointless ("We already know the reliability!")**  
     - *Why it happens:* Teams calculate reliability from past data pre-bet.  
     - *Fix:* Emphasize: "You’re not betting on the *actual* reliability—you’re betting on whether the *gauge’s answer about itself* is trustworthy. Would you need the gauge to ‘confirm’ what you already know?"  

  4. **Underused Challenges**  
     - *Why it happens:* Students miss invalid justifications.  
     - *Fix:* Early on, give an example slip: "We bet BLUE because the gauge says BLUE" → Challenge it yourself to model.  

  5. **What the Game Can’t Stage:**  
     - **The "Why Not Zero?" Intuition:** The game can’t *force* students to feel why "zero past successes + gauge self-verification" is illegitimate.  
       - *Compensation:* In the auction, press: "If you bid zero, would you trust a gauge that says ‘I’m reliable’ with no track record? What’s wrong with that?"  

  ---

  **Final Tip:** Start the debrief by having students reconstruct their own justifications for the self-test bet. When they say, "We trusted it because it was right before," hit them with: "So your reason for trusting the gauge’s claim about *itself* is... the gauge’s past claims?" The penny drop moment is gold.
