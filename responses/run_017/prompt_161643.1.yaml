answer: |-
  **OFFICE OF ANTICIPATORY AUTONOMY (OAA)**
  **Form UC-1**
  **Application for Anticipatory Self-Binding Order**
  **(Rev. 08/47)**

  **INSTRUCTIONS: GENERAL**

  1.  **Purpose:** Form UC-1 allows the Filing Party (see Definition 3) to establish an Anticipatory Self-Binding Order (ASBO) enforceable against the Bound Party (see Definition 2) at a future Designated Enforcement Point (DEP, see Definition 4). The ASBO restricts specific actions of the Bound Party, irrespective of contemporaneous consent or protest. **Note:** Successful enforcement requires the Bound Party to exhibit active non-consent and protest during the DEP (see Section VII.C).
  2.  **Applicability:** Part I applies to individual natural persons. Part II applies to Collective Applicants (see Definition 8) including states, political parties, constituent assemblies, or recognized intergenerational entities. Juridical persons (e.g., corporations) must use Form CB-2A.
  3.  **Compliance:** Complete all applicable sections. Use black ink. Print legibly. Illegible or incomplete forms will be rejected without prejudice. Submit original only. Retain Copy 2 for records.
  4.  **Filing:** File with the Office of Anticipatory Autonomy, Processing Division, at least 90 calendar days prior to the earliest potential DEP. Expedited processing unavailable. Mail to: OAA Processing, P.O. Box 117, Metropolis, DC 20001.
  5.  **Fees:** Non-refundable processing fees apply (see Schedule UC-F attached). Fees are assessed upon filing based on the parameters of the requested ASBO. Failure to remit correct fee will void filing. Fee Schedule subject to quarterly adjustment; consult OAA Bulletins.
  6.  **Definitions:** Key terms are capitalized throughout. Refer to Section XII for Definitions.

  **INSTRUCTIONS: PART I (INDIVIDUAL APPLICANTS)**

  **Section I.A: Filing Party Identification**
  *   **Line 1a-1d:** Enter Filing Party's full legal name, date of birth, Social Security Number, and current address. This identifies the entity granting initial consent and requesting the ASBO.
  *   **Line 1e:** Check applicable box. "Initial Filing" establishes a new ASBO. "Amendatory Filing" modifies an existing ASBO (requires UC-1A Supplement and prior OAA File Number). "Recursive Binding" establishes an ASBO prohibiting future filing of Form UC-1 or UC-1A (see Section VI; requires completion of Continuity Worksheet).

  **Section I.B: Bound Party Identification**
  *   **Line 2a-2d:** Enter the *expected* identifying information for the Bound Party at the DEP. This identifies the entity against whom the ASBO will be enforced. **Note:** Information may differ from Line 1 if a significant Continuity Gap is projected (see Continuity Worksheet, Line 14).
  *   **Line 2e:** Designated Enforcement Point (DEP). Specify the temporal trigger (e.g., "Upon diagnosis of Stage 4 Illness," "During the month of April annually," "If market value of asset X exceeds $Y"). Ambiguous DEPs may delay processing or invalidate enforcement.

  **Section I.C: Continuity Worksheet (CW)**
  *   **Purpose:** Determines the legal relationship between Filing Party and Bound Party for ASBO enforceability.
  *   **Line 3 (Projected Psychological Overlap %):** Estimate the percentage of core psychological attributes, values, and preferences projected to persist in the Bound Party at the DEP. Use OAA Worksheet UC-CW-1 for calculation methodology. **Attach completed UC-CW-1.**
  *   **Line 4 (Continuity Determination):**
      *   If Line 3 >= 80%: Proceed as standard ASBO (Filing Party deemed sufficiently continuous with Bound Party for consent purposes, sufficiently discontinuous for enforcement purposes).
      *   If 50% <= Line 3 < 80%: ASBO processed under "Diminished Continuity Protocol." Requires enhanced Enforcer certification (Section I.E, Line 8b). Higher filing fees apply (Schedule UC-F, Category C).
      *   If Line 3 < 50%: Filing Party and Bound Party deemed legally distinct. Application will be processed as:
          *   **Line 4c:** A Bequest/Instruction (Form UC-1B) if the DEP occurs after Filing Party's legal death.
          *   **Line 4d:** A Third-Party Restraining Order (Form RO-44) against the Bound Party, requiring separate service and evidentiary standards. **Filing Party must demonstrate standing.**

  **Section I.D: Prohibited Action(s)**
  *   **Line 5:** Describe the specific action(s) the Bound Party is to be prevented from performing during the DEP with unambiguous precision (e.g., "Consume alcoholic beverages," "Sell securities identified in Schedule A," "Vote in favor of Amendment Z"). Vague terms ("be irresponsible," "change mind") are unenforceable.
  *   **Line 6:** Duration of Prohibition. Specify time period within DEP the prohibition is active (e.g., "For duration of DEP," "48 hours following DEP trigger," "Until OAA-approved Release Condition is met").

  **Section I.E: Designated Enforcer (DE)**
  *   **Line 7a-7d:** Identify the DE (natural person or licensed juridical entity) responsible for enforcing the ASBO during the DEP. DE cannot be the Filing Party or Bound Party.
  *   **Line 7e:** DE Acceptance. DE must sign here, acknowledging duty to enforce the ASBO per the Filing Party's instructions, disregarding any pleas, protests, or revocation attempts by the Bound Party during the DEP.
  *   **Line 8a:** Enforcer Authority. Describe the specific powers granted to the DE to effectuate the prohibition (e.g., "Withhold access to residence," "Freeze Account #12345," "Physically restrain using reasonable force").
  *   **Line 8b:** If CW Line 4 = "Diminished Continuity Protocol," DE must additionally certify completion of OAA Enforcer Training Module ETM-7 ("Enforcement Amidst Identity Flux").

  **Section I.F: Validity Conditions & Voiding Triggers**
  *   **Line 9:** Filing must occur during a "Stable Volitional State" (SVS). Check applicable boxes certifying:
      *   **Line 9a:** Filing does NOT occur within 72 hours of a specific regretted action motivating the ASBO ("Cooling-Off Exclusion").
      *   **Line 9b:** Filing does NOT occur during a self-assessed period of "unusually high resolve or conviction" exceeding the Filing Party's baseline by more than 30% ("Peak Resolve Exclusion"). Baseline assessment requires Attachment UC-BL.
  *   **Line 10:** Filing Party certifies current mental competence to execute a binding legal instrument per jurisdiction of residence standards. OAA may request independent verification (Form OAA-COMP).

  **Section I.G: Recursive Binding Provisions (Optional)**
  *   **Line 11:** To prevent the Bound Party from attempting to revoke or amend this ASBO, check here to apply Recursive Binding. This establishes a secondary ASBO prohibiting the Bound Party from filing any Form UC-1, UC-1A, or UC-3 (Revocation Request) pertaining to this primary ASBO.
  *   **Line 12:** If Line 11 checked, the DEP for the Recursive ASBO is defined as "Any time the Bound Party initiates action toward revocation or amendment of the primary ASBO." Enforcement is automatic upon detection by DE or OAA.

  **Section I.H: Certification of Understanding**
  *   **Line 13:** Filing Party must initial:
      *   **13a:** "I understand the Bound Party will likely protest enforcement. Continued protest is evidence the ASBO is functioning as designed."
      *   **13b:** "I understand no refund of fees will be issued due to the Bound Party's continued desire to perform the Prohibited Action, or due to distress caused by enforcement."
      *   **13c:** "I understand conflicting instructions are resolved by earliest-in-time filing. A Recursive Binding ASBO (Section I.G) is irrevocable by later self."
  *   **Line 14:** Filing Party signature and date. **WARNING: Signing constitutes binding agreement.**

  **INSTRUCTIONS: PART II (COLLECTIVE APPLICANTS)**

  **Section II.A: Collective Applicant Identification**
  *   **Line 15a:** Legal Name of Collective Entity (e.g., "The Sovereign State of X," "The People's Assembly of Y," "Generation Alpha Stewardship Trust").
  *   **Line 15b:** Authorized Filers. List titles/roles of individuals authorized to bind the Collective Applicant. Attach certification of authority (e.g., Resolution, Charter Excerpt).
  *   **Line 15c:** Composition Description. Briefly describe the constituent members/generation represented.

  **Section II.B: Bound Collective Identification & Entrenchment Schedule**
  *   **Line 16a:** Identify the Bound Collective (e.g., "Future Majorities of the State of X," "Successor Assemblies," "Generations Beta through Epsilon"). May be defined temporally or procedurally.
  *   **Line 16b:** Entrenchment Duration. Specify duration ASBO binds Bound Collective.
      *   **Line 16b(i):** Maximum Self-Binding Duration: ___ years/months (Maximum 25 years).
      *   **Line 16b(ii):** Maximum Successor-Binding Duration: ___ years/months (Maximum 100 years; see Schedule UC-F, Fee Multiplier based on duration).
  *   **Line 16c:** Rationale for Successor Duration. Justify exceeding Self-Binding Duration (e.g., "Intergenerational equity," "Perpetual foundation," "Existential risk mitigation"). Attach separate sheet if needed.

  **Section II.C: Entrenched Rule & DEP**
  *   **Line 17:** Describe the rule, law, or principle being entrenched against amendment or repeal by the Bound Collective.
  *   **Line 18:** Designated Enforcement Point (DEP). Define trigger for enforcement (e.g., "Upon introduction of Bill repealing Article Z," "If popular referendum on Issue A achieves ballot status," "If consumption rate of Resource B exceeds Sustainability Threshold").

  **Section II.D: Certification of Hypothetical Consent**
  *   **Line 19:** Collective Applicant certifies that, based on prevailing values, interests, and foreseeable circumstances:
      *   **19a:** The Bound Collective *would* consent to the entrenched rule if consulted.
      *   **19b:** Consultation was impracticable because the Bound Collective did not exist at the time of filing.

  **Section II.E: Supermajority Exit Mechanism**
  *   **Line 20:** Specify the procedure and threshold required for the Bound Collective to override the ASBO (e.g., "Legislative supermajority of 75%," "Double referendum," "Constitutional Convention with 2/3 state ratification").
  *   **Line 21:** Entrenchment of Exit Mechanism: Check here to apply the ASBO provisions *to the Exit Mechanism itself*, requiring the same (or higher) supermajority to amend or weaken the Exit Mechanism. **Note:** OAA presumes self-entrenchment; failure to check may weaken enforceability. **OAA Position:** A rule that cannot protect its own amendment procedure is not a rule.

  **Section II.F: Designated Institutional Enforcer (DIE)**
  *   **Line 22a-22c:** Identify the DIE (e.g., Constitutional Court, Independent Commission, Designated Treaty Body) responsible for upholding the ASBO against the Bound Collective.
  *   **Line 22d:** DIE Acceptance. Authorized representative of DIE must sign, acknowledging duty to enforce irrespective of popular will or legislative action by Bound Collective.

  **Section II.G: Collective Certification**
  *   **Line 23:** Authorized Filers must initial:
      *   **23a:** "We understand entrenchment imposes costs on future majorities."
      *   **23b:** "We understand the OAA presumes the validity of self-entrenching clauses (Section II.E, Line 21 Note)."
  *   **Line 24:** Signatures of all Authorized Filers and date.

  **FEE SCHEDULE UC-F (Abridged - See Full Schedule)**
  *   **Part I Fees:**
      *   Base Processing Fee: $350
      *   Continuity Worksheet Fee: $150
      *   Diminished Continuity Protocol (CW Line 4): +$500
      *   Recursive Binding (Line 11): +$300
      *   **Enforcement Success Surcharge:** Payable upon verified enforcement during DEP. Calculated as 15% of the Bound Party's *assessed maximum willingness-to-pay* to lift the ASBO at the DEP (OAA Form WTP-1 must be filed by DE within 30 days of DEP onset). **Minimum Surcharge: $1,000.**
  *   **Part II Fees:**
      *   Base Processing Fee: $5,000
      *   Entrenchment Duration Fee: $1,000 per year (Self-Binding), $2,500 per year (Successor-Binding)
      *   Self-Entrenching Exit Fee (Line 21): +$10,000
      *   **Ratification Fee:** Payable by Bound Collective upon any successful Exit Vote (per Section II.E, Line 20). Fee = 200% of original filing fees + OAA processing costs + estimated cost of future UC-1 filing by prevailing faction. Constitutes a lien against the Bound Collective's assets/revenue.

  **PRIVACY ACT NOTICE**
  Authority: 5 UAA § 552a (Office of Anticipatory Autonomy Organic Act). Principal Purpose: To establish and enforce Anticipatory Self-Binding Orders (ASBOs) as defined in OAA Regulation 1147.2. Routine Uses: Information may be disclosed to Designated Enforcers (DEs/DIE) for enforcement purposes; to third-party validators for competence/continuity assessments; to financial institutions for fee collection/enforcement actions; to successor entities identified in Part II applications; and as required by law. **OAA Definition of Person:** For purposes of record-keeping and enforcement, the "Filing Party" and "Bound Party" are treated as distinct legal entities arising from a single biological or institutional origin point, segmented temporally by the Designated Enforcement Point. Failure to provide information may result in rejection of Form UC-1. OAA File UC-1-XXXXX.
