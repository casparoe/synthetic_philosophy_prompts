prompt: |-
  Longtime lurker, finally posting. I keep noticing the same move in threads about hedonism and well-being and I don't have a word for it, or rather the word I have is probably the wrong one.

  Here's the shape of it. Someone motivates hedonism by saying that the only thing that can be good for you is something that changes what your life is like from the inside — the intuition behind the experience machine, or behind saying that a wish fulfilled after you're dead can't be good for you. "Pleasure" gets introduced there as the stuff that feels good, felt quality, obvious. Then someone brings up the heterogeneity problem: the pleasure of cold water after a long run, the pleasure of finally seeing why a proof works, and the pleasure of finding out your paper got accepted don't seem to share any one feeling. The cold water has a bodily qualia you can point at; seeing the proof is mostly just absorption in the proof, and if there's a feeling at all it's a relief that shows up afterward; the acceptance email feels like a state directed at a proposition rather than a sensation. The reply I always get is: right, that's why nobody holds a felt-quality view anymore, pleasure is really an attitude — enjoying something, being glad that p, wanting the experience to continue, take your pick. OK. But then two paragraphs later the same person is leaning on the experience intuition again to say desire theories are absurd, and at that point the "wanting it to continue" bit is doing no work at all.

  I've been calling it hedonic drift, which my friends point out sounds like a made up economics term. Someone else told me it's just the adverbial theory, but that seems like a view rather than a move. It's also not quite motte-and-bailey: neither version is a safe core that gets retreated to under attack — the felt-quality version does the work at the start and the attitudinal one does it later, and the argument needs both. Plain equivocation feels too thin too, since it doesn't explain why the switch is systematic, with each version reliably assigned to a different job.

  Is there an established name for this? And if the nearest thing is a cluster of concepts rather than one, I don't want a label dropped on me — I want to know which of them actually carves the pattern I'm pointing at and where the edges are.

  Give me:
  - What I'm describing (~100 words): restate the move better than I did
  - Nearest existing concepts (~250 words): felt-quality vs. adverbial vs. attitudinal theories, the experience requirement, motte-and-bailey and equivocation — which fits, where each one breaks down
  - Is it actually an inconsistency (~200 words): or is there a way for a hedonist to hold both halves without cheating
  - Name it (~100 words): if nothing established fits, give me a definition plus one clear case and one near-miss that isn't an instance
reasoning: |-
  Okay, the user is describing a recurring pattern in philosophical debates about hedonism. They notice that proponents of hedonism start with an intuition about felt qualities (like in the experience machine thought experiment), then switch to attitudinal theories when faced with the heterogeneity problem (different pleasures feeling different), and then switch back to felt qualities when criticizing desire theories. The user is frustrated that this move doesn't seem consistent and wants to know if there's a name for it.

  The user is clearly well-versed in philosophy. They've been lurking and observing these debates, so they're familiar with concepts like the experience machine, heterogeneity problem, and different theories of pleasure. They mention terms like "hedonic drift" and "adverbial theory," showing they've done some research. Their friends pointed out that "hedonic drift" sounds like an economics term, which suggests they want a more precise philosophical label.

  They're not satisfied with existing labels like "motte-and-bailey" or "equivocation" because those don't fully capture the systematic nature of the switch. They want to understand why this move happens and whether it's actually inconsistent. Their deeper need seems to be for conceptual clarity—they want to name this pattern to better engage in these debates and possibly call out what they see as a flaw in hedonist arguments.

  Looking at the key elements: the pattern involves two distinct definitions of pleasure—felt-quality and attitudinal—each used strategically at different points. The felt-quality version sets up the initial intuition (experience machine), but when heterogeneity is raised, they switch to attitudinal to handle diversity. Then, when attacking desire theories, they revert to felt-quality to maintain that only conscious experiences matter. This isn't just random equivocation; it's a tactical shift where each definition serves a specific argumentative purpose.

  Existing concepts don't perfectly fit. Motte-and-bailey involves retreating to a defensible position, but here both positions are used actively. Equivocation is too vague. The adverbial theory is a specific view, not a rhetorical move. The experience requirement (only conscious experiences affect well-being) bridges both but doesn't explain the switch.

  Is it inconsistent? A hedonist might argue that both are part of a unified theory—attitudes require conscious states, so felt-quality is foundational. But in practice, when pressed on heterogeneity, they downplay the need for a common feeling, implying attitudes can stand alone. Then, when criticizing desire theories, they reassert that only conscious states count, which relies on felt-quality. So functionally, it's inconsistent because the attitudinal definition alone doesn't support the anti-desire argument.

  Since no established term fits, I'll propose "dialectical hedonic substitution." It captures the tactical swapping of definitions. Clear case: using felt-quality for experience machine, attitudinal for heterogeneity, then felt-quality against desire theories. Near-miss: someone who consistently uses attitudinal pleasure but doesn't revert to felt-quality—they'd handle desire theories differently, maybe by arguing desires matter only if conscious.

  The user needs this to articulate the flaw they see and engage more effectively. Naming it gives them a tool to call out the move in debates.
answer: |-
  Here's a breakdown addressing your core observation:

  1.  **What You're Describing (The Move):**
      You're identifying a recurrent dialectical *tactic* in hedonism debates. Proponents start by grounding hedonism's appeal in a strong **Experience Requirement** (only conscious experiences affect well-being), illustrated by thought experiments like the Experience Machine or posthumous desires. This *requires* a "felt-quality" notion of pleasure/satisfaction as the obvious candidate. When confronted with the Heterogeneity Problem (pleasures lack a common felt quality), they shift to an **Attitudinal Theory** (pleasure = taking pro-attitudes like enjoyment, being glad, or wanting to continue). This dissolves heterogeneity. However, shortly after, when criticizing desire-satisfaction theories (e.g., fulfilled but unknown desires), they *revert* to the **Experience Requirement**, arguing satisfaction only matters if consciously *felt*. Crucially, at this point, the *attitudinal* definition (which could potentially accommodate satisfaction without a distinct feeling) is functionally abandoned, and the original felt-quality intuition implicitly does the argumentative work against desire theories. The move is a **strategic oscillation between definitions**, each deployed when most advantageous against a specific objection, without reconciling their differing implications for the core argument.

  2.  **Nearest Existing Concepts & Where They Fit/Break Down:**
      *   **Felt-Quality Theory:** This is the initial target ("pleasure as a uniform sensation/qualia"). It motivates the Experience Requirement but succumbs to the Heterogeneity Problem. **Fits:** Its use in setting up the initial intuition and later attacking desire theories. **Breaks Down:** It's explicitly *rejected* when heterogeneity is raised.
      *   **Attitudinal/Adverbial Theory:** This is the refuge from heterogeneity ("pleasure as enjoying an experience," "taking pleasure *in* something," "being pleased *that* p"). It avoids the need for a common sensation. **Fits:** Its deployment to solve the Heterogeneity Problem. **Breaks Down:** It is *not used* when attacking desire theories. If it were, the argument against desire theories (that satisfaction must be consciously felt) becomes much weaker, as attitudinal theories *can* define satisfaction as the attitude itself, which might be present without a distinct *feeling*.
      *   **Experience Requirement:** This is the *intuition* driving the initial setup and the later critique of desire theories. **Fits:** It's the constant *motivation* behind both uses of the definitions. **Breaks Down:** It doesn't explain the *switch* in definitions. The requirement itself is neutral on *how* "conscious experience" is constituted (feeling vs. attitude), but the proponent leverages *both* interpretations opportunistically.
      *   **Motte-and-Bailey:** This involves a defensible core ("motte") and an ambitious claim ("bailey"). The proponent retreats to the motte under fire. **Partial Fit:** The attitudinal theory *could* be seen as the safer "motte" (defensible against heterogeneity), and the felt-quality theory as the "bailey" (used for broader anti-desire arguments). **Breaks Down:** The felt-quality view *isn't* consistently the "bailey" – it's the *starting point* and the *later weapon*, not the ambitious extension. Crucially, the *Experience Requirement* critique of desire theories relies on the felt-quality notion *precisely when the attitudinal theory is supposedly in force*. It's not a retreat; it's a reversion to the initial premise while the alternate definition is still nominally held.
      *   **Equivocation:** This is simply using the same word with different meanings. **Fits:** The core mechanism involves shifting the meaning of "pleasure" or "satisfaction." **Breaks Down:** It's too thin. It doesn't capture the *systematic pattern*, the *specific triggers* (heterogeneity attack vs. desire theory attack), or why this equivocation is *tactically effective* in defending hedonism. Equivocation is the *method*, but the *pattern* is a specific dialectical strategy within hedonist argumentation.

  3.  **Is it Actually an Inconsistency?**
      Yes, it manifests as a **functional inconsistency within the argumentative strategy**, even if a dedicated hedonist *could* theoretically hold a consistent hybrid view. The inconsistency lies in the *deployment*. The move *requires* the attitudinal definition to solve heterogeneity (denying the need for a common *feeling*), but then *requires* the felt-quality definition (or a strong implication of it) to make the Experience Requirement bite against desire theories (insisting satisfaction *must* involve a conscious *feeling*). When attacking desire theories, the proponent implicitly rejects the possibility that the satisfaction *itself* could be the attitudinal state (e.g., just *being glad* without a distinct sensation), which is precisely what their solution to heterogeneity allowed. If they consistently used the attitudinal definition throughout, the Experience Requirement argument against desire theories would collapse, as the attitude *could* be present even for unknown fulfillments (though they'd argue it usually isn't). The inconsistency is in leveraging *two incompatible implications* of the different definitions at different points: denying the necessity of a distinct feeling for pleasure, then insisting on it for satisfaction.

  4.  **Naming It:**
      Since no single established term perfectly captures this *specific dialectical pattern* within hedonist defenses, propose:

      **Dialectical Hedonic Substitution (DHS)**

      *   **Definition:** A tactical argumentative move in defense of hedonism where the proponent substitutes between a **Felt-Quality conception** of pleasure (to leverage the Experience Requirement against desire theories and motivate the initial appeal) and an **Attitudinal conception** (to evade the Heterogeneity Problem), without reconciling the tension this creates for the core argument, particularly when the Experience Requirement is later reasserted against desire theories using the implications of the Felt-Quality conception.
      *   **Clear Case:** Exactly as you described: Appeal to Experience Machine (Felt-Quality) → Confronted with Heterogeneity → Switch to Attitudinal Theory ("pleasure is enjoying, not a feeling") → Later, attacking desire theory, argues "satisfaction only matters if consciously *felt*" (relying implicitly on Felt-Quality implications, not the Attitudinal definition just offered).
      *   **Near-Miss (Not an Instance):** A hedonist who *consistently* uses an Attitudinal Theory. When attacking desire theories, they argue either: a) Desire satisfaction *is* welfare-relevant only if it causes the appropriate attitudinal state (enjoyment/being glad), or b) The attitudinal state *is* the conscious experience required, and unknown fulfillments fail because they don't produce this attitude. They do *not* revert to language strongly implying a distinct sensation is necessary. The inconsistency arises from the *substitution back* to felt-quality implications.

  This pattern highlights a genuine tension within hedonist attempts to satisfy both powerful intuitions (Experience Requirement) and empirical observations about pleasure (Heterogeneity). DHS names the specific *argumentative maneuver* used to navigate, or perhaps obscure, this tension.
