prompt: |-
  hey — I'm a postdoc in political theory and I've ended up defending, slightly more strongly than I intended, a view about merit in selection (hiring, college admissions, promotion, prizes, the usual cases) that I now want someone to try to break, because I have a nagging feeling I've quietly built it so nothing could count against it. Roughly the view: merit is always role-relative — to deserve a position just is to be the candidate expected to best serve that role's constitutive aim — and from that I get a divide I quite like. Roles with a single, relatively uncontested aim (a commercial pilot, a bomb-disposal technician, arguably a research fellowship judged purely on output) admit a genuine meritocratic justification; roles whose aims are essentially contested (a university, a police force, a supreme court, a hospital board) don't, and there "the best qualified candidate" is doing something other than it advertises: either smuggling in one contested specification of the aims as if it were neutral, or laundering the advantages of whoever is already winning. I've bolted on two extra bits that I'm not sure are load-bearing: (i) the ratchet — merit criteria drift over time to match the traits of whoever currently succeeds, so merit-talk systematically stabilizes existing hierarchies; and (ii) aim-drift — because who gets selected partly determines what the role's aims become later on, the counterfactual "how well would this candidate serve the aims" isn't well defined even in principle, so the account can't be rescued just by better prediction. Please act as a political philosopher who works on desert and distributive justice and has read around the meritocracy literature, and think carefully: start by brainstorming maybe six to eight independent things that could count against this before you rank anything at all, and don't just give me the objections people standardly make against meritocracy — give me the ones that bite on my version specifically.

  What I want out of it: defeaters sorted from fatal to merely awkward, and for each one an honest note on whether I, as a committed defender, would concede it or whether I'd dismiss it as smuggling in a rival assumption. Include the uncomfortable categories — a case the view can't describe, a consequence I'm committed to that's unacceptable, a result showing the whole thing collapses into something I was trying to avoid (Rawlsian fair equality of opportunity? luck egalitarianism about effort and circumstance? some qualified-lottery proceduralism?) — and be explicit about whether that collapse is itself a defeat or just a redescription. Also tell me which of my two bolted-on bits the core actually needs, and whether dropping the ratchet saves everything else. And then, bluntly: has the move to "essentially contested aims" made the view unfalsifiable, and if it has, is that a real problem for a view of this kind or just what normative views are like? I'd definately rather hear the strongest version against me than a comforting one.

  Then run it on three cases I can't make up my mind about: military officer selection (arguably contested aims, yet the intuition that we must pick on merit is very strong there — a case where I might have to bite a bullet I don't want to bite), organ allocation (pretty clear-ish aim, and yet we resist pure efficiency scoring and add urgency, age, queue position — so is that a counterexample to my divide or a case where the aims were never as single as they looked?), and blind orchestral auditions (a case where tightening merit criteria famously changed who got in, which I want to claim as evidence for the ratchet and which I suspect someone can turn straight around on me). I'd be most moved by two kinds of thing: a role with genuinely contested aims where our merit-selection intuitions are rock solid, and any empirical finding that would actually discriminate — e.g., if criteria set under one contested specification of a role's aims still predicted performance well under rival specifications, or if qualified-lottery selection in contested-aim roles reliably degraded something measurable independent of the aims in dispute. No citations or reading list, you don't have web access anyway and I'll fill that in myself; I'm teaching a seminar on this next term and want to hand out something sharper than my own notes.
reasoning: |-
  Okay, the user is a postdoc in political theory who's developed a view on merit in selection processes. Their core idea is that merit is role-relative: deserving a position means being expected to best serve the role's constitutive aim. They divide roles into those with single, uncontested aims (like pilots) where meritocracy works, and those with essentially contested aims (like universities) where "best qualified" smuggles in biases. They've added two extras: a ratchet effect where criteria drift to favor incumbents, and aim-drift where selection affects future aims.

  The user wants me to act as a political philosopher specializing in desert and distributive justice. They're looking for strong, specific objections to their view—not standard meritocracy critiques. They want defeaters ranked from fatal to awkward, noting whether they'd concede or dismiss each. Also, they want analysis of their two "bolted-on" bits, and whether "essentially contested aims" makes the view unfalsifiable. Finally, they want the view tested on three cases: military officers, organ allocation, and blind auditions.

  First, I need to brainstorm independent objections. The user mentioned avoiding standard objections, so I'll focus on challenges specific to their framework. Let's list possible angles: 

  1. **Role relativity might collapse into functionalism.** If merit is defined by serving a role's aim, this assumes roles have fixed purposes. But roles are socially constructed and their aims can be renegotiated. This could make the view circular or conservative.

  2. **The "essentially contested" criterion might be too slippery.** The distinction between contested/uncontested aims feels binary, but many roles fall in a gray area. Also, who decides what counts as "contested"? This might make the view unfalsifiable since any counterexample could be dismissed as "actually contested."

  3. **Epistemic problems.** Predicting who best serves an aim is always uncertain, even for "uncontested" roles. The user mentions aim-drift, but uncertainty exists even without drift. This could undermine merit claims across the board.

  4. **Conflation of justification and prediction.** The user merges desert (normative) with predictive efficacy (empirical). But we might deserve things for past actions, not future potential. This could make the view instrumentalist, ignoring backward-looking desert.

  5. **Ratchet effect's necessity.** If the ratchet is true, it might apply equally to contested and uncontested roles. For example, even pilots might have criteria that favor certain groups over time. This could blur their core divide.

  6 **Aim-drift's scope.** If selection changes future aims, this might affect uncontested roles too. A pilot hired today might influence aviation safety standards tomorrow. So aim-drift isn't unique to contested-aim roles.

  7. **Moral costs of accepting the view.** If contested-aim roles can't use meritocracy, what replaces it? The user hints at lotteries or proceduralism, but this might lead to intuitively bad outcomes, like unqualified people in critical roles.

  8. **Collapse into rival theories.** The view might reduce to Rawlsian FEO (emphasizing fair procedures over desert) or luck egalitarianism (if "effort" is redefined as contribution to aims). The user should clarify if this is a problem or just redescription.

  Next, I'll rank these objections by severity. Fatal flaws would challenge the core logic, while awkward ones might require tweaks. For example:
  - **Fatal**: If aim-drift makes prediction incoherent even in uncontested roles, their divide collapses.
  - **Serious**: Conflation of desert and prediction might undermine normative foundations.
  - **Moderate**: Ratchet effect applying broadly blurs the contested/uncontested line.
  - **Awkward**: Gray areas in "contested" classification make the view hard to apply. 

  On the bolted-on bits: The ratchet might not be necessary for the core argument but strengthens it. Aim-drift is more critical—it prevents rescuing the view with better prediction. If dropped, the core might hold for static aims.

  Unfalsifiability: Defining "essentially contested" post-hoc could make the view immune to counterexamples. For normative theories, this isn't fatal but weakens its critical edge. The user might need clearer criteria for "contested."

  Now, testing the three cases:
  - **Military officers**: Aims seem contested (e.g., combat efficacy vs. ethical leadership), yet we insist on merit. This exposes a bullet to bite: either deny the intuition or admit meritocracy here is illusory.
  - **Organ allocation**: Aims appear clear (save lives efficiently), but we add fairness factors. This suggests aims weren't truly single—they included moral constraints, making it a case for the user's view.
  - **Blind auditions**: Tightening criteria (e.g., anonymized tryouts) diversified hires, challenging the ratchet. The user could argue this reveals prior criteria were biased, not merit-based, thus confirming the ratchet exists but can be disrupted.

  Strong counterexamples would be:
  - A role with contested aims but strong merit intuitions (e.g., elected officials—we want "best" leaders despite partisan aims). 
  - Empirical tests: If merit criteria from one faction predict performance under rival aims (e.g., a "conservative" teacher excels in "progressive" schools), it weakens the claim that merit is aim-relative.

  As the defender, I'd likely concede that desert/prediction conflation is problematic but argue normative desert depends on social roles. For unfalsifiability, I'd insist "contested" is a conceptual tool, not an empirical escape hatch. The ratchet can be dropped if aim-drift does the work, but both highlight stability biases.

  Finally, the user needs this for teaching—so objections should be sharp, structured, and ready for debate. Highlighting where the view holds (organ allocation) vs. struggles (military) will make the seminar engaging.
answer: |-
  Here’s a ruthless dissection of your view, structured as requested. I’ll start with a brainstorm of independent objections (8 total), rank them by severity, then test your three cases. I’ll be blunt about where the view cracks, wobbles, or survives—and where *you* should dig in or retreat. My stance: Your core is provocative but overextended; the "essentially contested aims" move *does* risk unfalsifiability, but this is a feature, not a bug, for a normative account. The ratchet is load-bearing; aim-drift is defensible but less critical.

  ---

  ### **Brainstormed Objections (8 Independent Lines of Attack)**
  1. **The Functionalist Collapse**: Your view reduces "desert" to *predicted functional efficacy*. But desert often carries backward-looking moral weight (e.g., rewarding effort/virtue). If a candidate sacrifices immensely to develop skills *for a role*, we might say they *deserve* it even if prediction is noisy. You’ve conflated desert with optimization.  
     - *Your likely defense*: Dismiss as smuggling "moralized desert" – you’re offering a *revisionist* account.  
     
  2. **The Prediction Paradox**: For roles with "uncontested aims," your account relies on reliable prediction of performance. But if social science shows prediction is *always* weak (e.g., hiring meta-studies), "merit" collapses into guesswork even in "simple" roles. Your divide depends on an empirical premise (predictability) that may not hold.  
     - *Your defense*: Concede predictability is scalar, not binary – but insist uncontested aims *allow* better prediction.  

  3. **Contested-Aims Slippery Slope**: Your "essentially contested" category is self-sealing. Any role can be politicized (e.g., is a *pilot*’s aim "safety" or "profit maximization for shareholders"?). If *any* disagreement about secondary aims contaminates the primary aim, all roles become contested – nuking your divide.  
     - *Your defense*: Insist on *constitutive* aims (e.g., a hospital’s aim is health, not revenue) vs. contingent ones.  

  4. **The Ratchet’s Universal Application**: If the ratchet (criteria drifting to match incumbents) operates *even in uncontested-aim roles*, it undermines your distinction. E.g., "commercial pilot" criteria might favor ex-military profiles, excluding equally skilled civilian candidates. Your core can’t explain why meritocracy "works" in some roles if bias is ubiquitous.  
     - *Your defense*: Argue ratchet is *amplified* in contested-aim roles due to aim ambiguity.  

  5. **Aim-Drift as a Universal Problem**: If selection changes future aims (e.g., hiring tech-optimists shifts a hospital’s ethos), then *no* counterfactual ("how well would candidate serve current aims?") is coherent, even for bomb disposal. This vaporizes merit for *all* roles, not just contested ones.  
     - *Your defense*: Concede it’s a problem but stress it’s *epistemically catastrophic* only where aims are contested.  

  6. **Collapse into Procedural Fairness**: Your view implies that for contested-aim roles, "merit" is a myth, so we must use non-merit procedures (lotteries, representative quotas, etc.). But this risks collapsing into Rawlsian FEO – where the "merit" step is replaced by fair background conditions. Your desert-talk becomes redundant.  
     - *Your defeat*: **Concede**. This *is* a collapse, but you might reframe it as exposing merit’s limits.  

  7. **Moral Atrocity Objection**: If a genocidal regime defines a role’s "aim" (e.g., "ethnic purity officer"), your view says the "meritorious" candidate best serves *that aim*. You’ve detached merit from morality.  
     - *Your defense*: Dismiss – you’re analyzing *social practice of merit-talk*, not prescribing morality.  

  8. **Indeterminacy of "Expected Best"**: Your account relies on expectations, but these are shaped by contested values *even in uncontested-aim roles*. E.g., judging "best researcher" involves contested norms (e.g., quantity vs. innovation). The "uncontested" category is a mirage.  
     - *Your defense*: Insist some roles have *sufficient* consensus (e.g., "safety" for pilots).  

  ---

  ### **Ranked Defeaters (Fatal → Awkward)**
  1. **FATAL: Functionalist Collapse (Objection 1)**  
     Your reduction of desert to predicted efficacy ignores desert’s core moral intuition (rewarding dedication/virtue). If a firefighter trains relentlessly but is injured *just before* a hiring test, we say they’re *deserving* but not "expected best." You can’t capture this without smuggling moral desert.  
     - *Your move*: **Concede** it’s revisionist. Double down: "Desert" in institutional contexts *is* functional.  
     - *Severity*: Fatal if you want desert to track moral intuitions; survivable if you’re a functionalist.  

  2. **SERIOUS: Collapse into Procedural Fairness (Objection 6)**  
     Rejecting merit in contested-aim roles pushes you toward Rawls/FEO. But if "fair procedures" include equalizing opportunity *before* selection, you’ve abandoned desert for ex-ante fairness.  
     - *Your move*: **Concede partial collapse**. Your view *explains why* merit fails here, justifying proceduralism.  
     - *Severity*: Serious but not fatal – it reframes your project.  

  3. **SERIOUS: Contested-Aims Slippery Slope (Objection 3)**  
     If "bomb disposal" includes "minimizing civilian trauma," aims become contested (e.g., speed vs. caution). Your divide relies on a clean dichotomy that doesn’t exist.  
     - *Your move*: **Dismiss**. Hold the line: Roles *can* have core constitutive aims. Pilots *must* prioritize safety.  
     - *Severity*: Serious if empirical; awkward if you define "constitutive aims" rigidly.  

  4. **MODERATE: Ratchet’s Universal Application (Objection 4)**  
     If bias in merit criteria is everywhere (e.g., "nerd" culture in coding jobs), your "uncontested" meritocracy is a pipe dream. Your core distinction evaporates.  
     - *Your move*: **Concede** ratchet operates everywhere but argue uncontested aims *allow correction* (e.g., blind auditions).  
     - *Severity*: Moderate. Dropping the ratchet *saves the core* – it’s illustrative, not necessary.  

  5. **MODERATE: Aim-Drift Universality (Objection 5)**  
     If all roles evolve via selection, "expected best" is always unstable. But this doesn’t *equally* harm all roles. Uncontested aims have stable success metrics (e.g., survival rates).  
     - *Your move*: **Dismiss**. Aim-drift is material only when aims are *inherently* fluid (contested roles).  
     - *Severity*: Moderate. The core *needs* aim-drift only for contested roles.  

  6. **AWKWARD: Moral Atrocity (Objection 7)**  
     You can’t condemn Nazi "merit" without external norms. But your account isn’t *prescriptive* – it’s diagnostic of merit-talk’s function.  
     - *Your move*: **Dismiss**. This confuses description with endorsement.  
     - *Severity*: Awkward but deflectable.  

  7. **AWKWARD: Prediction Paradox (Objection 2)**  
     Poor prediction in "simple" roles (e.g., CEO hiring) weakens your meritocracy pillar. But uncontested aims *enable* better prediction (e.g., flight simulators).  
     - *Your move*: **Concede** predictability varies – but uncontested aims *permit* validation.  
     - *Severity*: Awkward for empiricists; survivable.  

  8. **AWKWARD: Indeterminacy of "Expected Best" (Objection 8)**  
     Even "output" in research is judged by contested values. But if a field agrees on metrics (e.g., citations), it’s "uncontested enough."  
     - *Your move*: **Dismiss**. Demand *threshold* consensus, not perfection.  
     - *Severity*: Awkward in practice.  

  ---

  ### **Unfalsifiability Check**  
  **Yes, "essentially contested aims" makes the view unfalsifiable** – you can always claim a counterexample has "hidden contestation." But this is *typical for normative-political concepts* (e.g., "power," "justice"). The problem isn’t fatal; it’s a trade-off for analytical precision. **Fix**: Offer clear markers for "essentially contested" (e.g., persistent value disputes, institutional fragmentation). Without this, your view is toothless.  

  ---

  ### **Case Tests**  
  1. **Military Officer Selection**  
     - **Your view**: Aims are contested (e.g., "win wars" vs. "uphold democratic values"). "Merit" here smuggles in a specification (e.g., aggressiveness vs. restraint). Strong intuition for meritocracy reflects *dominant* specification.  
     - **Bullet to bite**: Admit meritocracy here *is* ideological. The "best CO" under one aim (e.g., counterinsurgency) may be "worst" under another (e.g., human rights compliance). Intuitions track socialization, not neutrality.  
     - **Empirical discriminator**: If officers selected for "combat efficacy" excel at *human rights compliance* (or vice versa), your view takes a hit. (Spoiler: Evidence suggests trade-offs.)  

  2. **Organ Allocation**  
     - **Your view**: Aims *seem* unitary ("save lives") but are contested (e.g., "save most life-years" vs. "treat equally desperate cases"). Adding urgency/queue position reflects this contestation – it’s not a counterexample but *proof* aims were never "single."  
     - **Victory for you**: Pure efficiency scoring (e.g., "QALYs") assumes one specification; adding fairness norms reveals contestation. The case fits your divide perfectly.  

  3. **Blind Orchestral Auditions**  
     - **Your view**: Blind auditions exposed the *ratchet* – criteria (e.g., "sound") subtly favored male players. Tightening merit criteria (hearing only) disrupted bias.  
     - **Objection turned**: Critics say this proves merit *works* when purified. Your rebuttal: The "purified" criteria (technical skill) still reflect one *specification* of the aim (e.g., virtuosity over ensemble fit). The ratchet *begins anew* with new criteria.  
     - **Why it holds**: Blind auditions changed *who* succeeded but not *why* – the aim (musical excellence) remained uncontested. Your ratchet explains prior exclusion; the core explains why meritocracy functioned post-reform.  

  ---

  ### **Strongest Counterexamples**  
  - **Role with contested aims but rock-solid merit intuitions**: ELECTED OFFICIALS. Aims are hotly contested (e.g., "represent constituents" vs. "pursue justice"), yet we insist candidates "deserve" based on experience/policy knowledge. Your view must say this "merit" is a smokescreen for partisan aims.  
  - **Empirical discriminator**: If merit criteria set under one specification (e.g., a "law-and-order" police chief) predict performance well under a rival specification (e.g., "community service"), your view is weakened. (Data hint this *doesn’t* happen – e.g., "warrior cops" fail at de-escalation.)  

  ---

  ### **Final Takedown**  
  **Your core needs the ratchet** to explain why "merit" in contested-aim roles is pernicious. **Aim-drift is optional** – it amplifies the argument but isn’t essential. **The fatal flaw** is your functionalist reduction of desert: if accepting this, you’re on solid ground; if not, the view crumbles. **Unfalsifiability** is inherent but manageable with clear criteria. **Blunt verdict**: This is a powerful critique of merit-talk’s ideological function, but overreaching as a theory of desert. For your seminar: Stress it as a *diagnostic tool* for when meritocracy masks power. Drop aim-drift; keep the ratchet; defend the divide aggressively. You’ll provoke great debates.
