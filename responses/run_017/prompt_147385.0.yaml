answer: |-
  ## Joint Statement: Adversarial Collaboration on Stakes-Sensitivity

  **Parties:**
  *   **Defender of Pragmatic Encroachment (PE):** Representing Interest-Relative Invariantism (IRI). Knowledge depends on the subject's practical situation relative to their evidence.
  *   **Defender of Epistemic Contextualism (EC):** Representing the view that the semantic content of the word "knows" (and related terms) shifts with the context of the attributor.

  **Framing Stipulations:**
  1.  **Semantic Focus:** Excluded are explanations relying *solely* on conversational implicature, relevance constraints, norms of assertion, or postulating differences in underlying evidence between high and low-stakes subjects. The explanation must locate the stakes-sensitivity within the semantics of knowledge attributions themselves.
  2.  **Shared-Utterance Case (SUC):** A core test case. Speaker S, with fixed evidence E, utters "I checked: the last ferry leaves at 11" to a single audience comprising A (who must act on this at very high stakes) and B (who is idly curious). Both parties must account for what this single utterance *says* and whether it constitutes knowledge *for* A and/or B.
  3.  **Anti-Dissolution:** Neither party may resolve the dispute by merely asserting that the other party is "applying a different standard." Each must provide an account of *what fixes* the relevant standard (practical situation for PE, attributor context for EC) and *why* that is the correct fixing mechanism for knowledge.

  **I. Common Ground: Points of Agreement**

  1.  **Stakes-Sensitivity is Real and Robust:** In paradigmatic cases like the Bank Case (DeRose) or Airport Case (Cohen), the intuitive truth-value of knowledge attributions (e.g., "Hannah knows the bank is open Saturday") varies systematically with the practical stakes facing the subject (PE) or the attributor (EC). This variation is not an illusion.
  2.  **Not Merely Evidential:** The stakes-sensitivity observed in these cases is not reducible to differences in the *strength* or *quality* of the subject's evidence between low and high-stakes scenarios. Holding evidence constant, practical factors make a difference to whether a knowledge attribution is true (PE) or correctly assertible (EC).
  3.  **Not Merely Conversational:** The observed stakes-sensitivity is not adequately explained by Gricean implicatures, relevance theory adjustments, or norms of assertion alone. While these phenomena exist, they do not exhaust or fully account for the core data. The sensitivity is semantic or truth-conditional.
  4.  **Core Data Concerns Attributions:** The primary phenomenon to be explained is the intuitive acceptability or unacceptability of third-person knowledge *attributions* ("S knows that p") in different practical contexts, holding S's evidence fixed.
  5.  **The Dispute is Substantive:** While there may be terminological overlaps, the disagreement concerns the fundamental nature of knowledge (PE) or the semantics of "knows" (EC) and how practical factors interact with it. It is not merely a disagreement about words or pragmatics in the excluded sense.
  6.  **Single Phenomenon Target:** Both parties agree that the central phenomenon driving the dispute – the intuitive shift in the correctness of knowledge attributions with practical stakes, holding evidence fixed – is a *single, coherent phenomenon* demanding a unified semantic explanation. We are not explaining distinct phenomena requiring distinct mechanisms.

  **II. Residual Disagreements: Stated in Own Terms**

  | Feature                      | Pragmatic Encruacher (PE/IRI)                                                                 | Contextualist (EC)                                                                                             |
  | :--------------------------- | :-------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- |
  | **Nature of Knowledge/Content** | Knowledge is a *binary relation* between a subject and a proposition, but whether it obtains *depends constitutively* on the subject's practical interests relative to their evidence. | The word "knows" expresses *different relations* (has different semantic contents) in different contexts of attribution. |
  | **Locus of Stakes-Sensitivity** | The stakes-sensitivity resides in the *knowledge relation itself*. What it takes to stand in the knowledge relation to p varies with the subject's practical situation. | The stakes-sensitivity resides in the *semantic content of 'knows'*. The context of the attributor determines which epistemic relation "knows" picks out. |
  | **Truth-Conditions of Attributions** | A knowledge attribution "S knows that p" has *fixed truth-conditions* across contexts: true iff S's evidence suffices for knowledge *given S's actual practical situation*. | A knowledge attribution "S knows that p" has *variable truth-conditions* across contexts: its truth depends on which epistemic standard is operative in the attributor's context. |
  | **SUC: What the Utterance Says** | The utterance expresses a *single proposition*: <S knows that the ferry leaves at 11>. Its truth-value is fixed relative to S's practical situation (which is low, as S is merely reporting). | The utterance expresses *different propositions to A and B simultaneously*. To B (low stakes), it expresses a proposition requiring a low standard. To A (high stakes), it expresses a proposition requiring a high standard. |
  | **SUC: Knowledge For Whom?** | The utterance asserts S knows. Whether this is *true* depends *only* on S's practical situation (low stakes). S *does* know. Neither A nor B "has" the knowledge from the utterance; S possesses it. A & B gain justified belief, but whether *they* know depends on *their own* practical situations. | The utterance *says* S knows (relative to a standard) *to each listener*. To B (low stakes), it says S knows (low std) and is likely true. To A (high stakes), it says S knows (high std) and is likely false. A & B each gain a justified belief relative to their context, but the *knowledge attribution made to them* has different truth-values. |
  | **What Fixes the Standard?** | The *subject's* actual practical interests, in conjunction with their evidence, fix the epistemic standard required for them to know. This is constitutive of the knowledge relation. | The context of the *knowledge attributor* (including their practical interests, presuppositions, and conversational goals) fixes the semantic content of "knows" and thus the operative epistemic standard. |
  | **Why This Fixing?** | Knowledge is essentially action-guiding. The level of evidential support required for a belief to license action (and thus count as knowledge) varies with the stakes of being wrong. The subject is the agent. | "Knows" is a context-sensitive term like "tall" or "flat". Its content is naturally fixed by the context of use (attribution) to meet the needs of the conversation, including managing practical risk. |

  **III. Cruxes and Test Cases**

  1.  **Whose Stakes Fix the Standard? (Subject, Attributor, or Aggregate?)**
      *   **Test Case: The Disinterested Attributor.** Hannah is in a high-stakes situation regarding the bank being open Saturday. A completely disinterested third party, Charlie (low stakes, no connection to Hannah's situation), overhears Hannah's evidence and says, "Well, Hannah doesn't know the bank is open Saturday, given her situation."
      *   **PE Prediction:** Charlie's attribution is **true**. The standard is fixed by Hannah's stakes. Charlie correctly describes Hannah's epistemic state relative to *her* high stakes, even from his low-stakes context.
      *   **EC Prediction:** Charlie's attribution is **false (or infelicitous)**. The standard is fixed by Charlie's attributor context (low stakes). "Knows" in Charlie's mouth expresses a low-standards relation. Relative to a low standard, Hannah *does* know. Charlie might correctly say "Hannah doesn't know *by high standards*," but the bare "doesn't know" is false relative to his context.
      *   **Bearing:** Directly tests the locus of standard-fixing.

  2.  **Can Rational Ignorance of Stakes Defeat Knowledge?**
      *   **Test Case: Unaware High-Stakes Subject.** Sarah has strong evidence (E) that the cafe has almond milk (p). She is rationally unaware that her companion has a severe almond allergy (making the stakes of being wrong about p extremely high for Sarah's action of offering coffee). Sarah truly believes p based on E. Does Sarah know p?
      *   **PE Prediction:** **No.** The standard for knowledge is fixed by the subject's *actual* practical situation, regardless of their awareness of it. Sarah's high stakes (due to the allergy) raise the evidential threshold for knowledge, which E (sufficient for low stakes) fails to meet.
      *   **EC Prediction:** **Yes (relative to Sarah's context).** If Sarah makes a self-attribution ("I know p") in her low-stakes-attributor context (unaware of high stakes), her attribution is true (expressing a low-standards relation). A third party aware of the allergy (high-stakes attributor context) would correctly say "Sarah doesn't know p" (expressing a high-standards relation).
      *   **Bearing:** Tests whether the operative stakes are objective facts about the subject's situation or determined by the subject's/attributor's epistemic perspective on those stakes.

  3.  **Can Irrational Inflation of Stakes Confer Knowledge?**
      *   **Test Case: The Anxious Subject.** Tom has extremely strong evidence (E) that his flight leaves at 3pm (p). However, Tom suffers from severe anxiety and irrationally inflates the stakes ("If I'm wrong, my whole career is ruined!"). E is in fact sufficient for knowledge even by very high standards objectively appropriate for actual high-stakes scenarios. Does Tom know p?
      *   **PE Prediction:** **Yes.** The standard is fixed by the *objectively rational* demands of the subject's *actual* practical situation. Tom's irrational anxiety does not create a genuine high-stakes situation that objectively raises the evidential threshold. E suffices for knowledge relative to his actual (low) stakes.
      *   **EC Prediction:** **No (if Tom self-attributes).** If Tom, in his attributor context saturated by irrational high stakes, says "I don't know p," his attribution is **true**. The high standards operative in his context (set by his inflated practical concerns) are what fix the semantic content of "knows" for his self-attribution. E may not meet that irrationally high standard.
      *   **Bearing:** Tests whether the practical situation fixing the standard is objective/normative (PE) or includes the subject's/attributor's subjective/potentially irrational assessment (EC).

  4.  **Does Encroachment Reach Rational Belief/Credence, or Stop at Knowledge?**
      *   **Test Case: High-Stakes Justified Belief.** Lena is in a genuine, objectively high-stakes situation regarding q. Her evidence E for q is very strong, but arguably insufficient for *knowledge* given the high stakes (according to both PE and a high-standards EC attributor). Is Lena's belief that q, based on E, *justified*? Should her credence in q be high?
      *   **PE Prediction:** **Yes (Justified Belief/High Credence).** Pragmatic factors *only* encroach on whether justified true belief amounts to *knowledge*. Lena's belief is perfectly justified, and her credence should rationally reflect the strength of E relative to the alternatives, irrespective of stakes. Stakes affect the *actionability* of the belief (knowledge), not its justificatory status or rational credence level.
      *   **EC Prediction:** **Ambiguous/Depends.** EC primarily concerns "knows." Justification is often considered invariant. However, some EC proponents might link standards for justification to context, or argue that in high-stakes contexts, the *level* of justification required for rational reliance (even if not labeled "knowledge") also increases. Most EC would likely say **Yes (Justified Belief/High Credence)**, treating justification as stakes-invariant.
      *   **Bearing:** Tests the scope of practical factors. If PE limits encroachment *only* to knowledge, it preserves traditional notions of justification/credence. If EC allows justification standards to shift, it expands encroachment.

  5.  **Can the Standard in SUC Be Fixed Non-Circularly?**
      *   **The Challenge:** For SUC, what non-circularly determines the operative standard for the utterance "S knows..."? (PE: Subject S's stakes? EC: Which listener's context? An aggregate? Something else?)
      *   **PE Attempt:** The standard is fixed by the *subject's* (S's) practical interests. S is making a self-attribution ("I know..."). S's stakes are low (reporting). Therefore, the utterance expresses the proposition <S knows(Low-Standard) p>, true relative to S's low stakes. *Non-circular anchor:* The actual practical situation of the *subject* of the knowledge attribution. *Challenge:* Why is the *subject's* context decisive for an utterance addressing others?
      *   **EC Attempt:** The standard is fixed by the *context of the attributor* (S). S is the attributor ("*I* know..."). S's context is low-stakes. Therefore, the utterance expresses a low-standards proposition *to all listeners*. *Non-circular anchor:* The context of the *speaker* making the attribution, following general linguistic norms for context-sensitivity. *Challenge:* How can a single utterance express different propositions *simultaneously* to different listeners within the same conversational context? Doesn't S's awareness of A's high stakes potentially infect S's context?
      *   **Assessment:** Both offer non-circular fixings (Subject's Situation / Attributor's Context). However, PE struggles with the utterance being *for* the audience, while EC struggles with the *single utterance/multiple propositions* aspect. Neither account is fully satisfying for SUC, highlighting its difficulty. *This crux reveals the core tension:* PE anchors truth to the subject's agency; EC anchors meaning to the attributor's discourse.

  **IV. Verbal Dispute and Substantive Core**

  *   **Potential Verbal Element:** A significant component of the disagreement *can* be framed as verbal: What is the semantic value of the word "knows"? Is it a single, stakes-sensitive relation (PE), or is it a context-sensitive term denoting different relations in different contexts (EC)? This resembles disputes over whether "tall" denotes a single, context-sensitive property or is ambiguous between many properties.
  *   **Substantive Core:** Behind this semantic question lies a deep, substantive disagreement about the *nature of knowledge and its connection to action*:
      *   Does the level of epistemic support required for a belief to *constitute knowledge* (and thereby reliably license action) fundamentally depend on the practical demands facing the *believing agent*? (PE: Yes, substantively).
      *   Or, is the primary connection to action mediated through *conversational norms*, where the context-sensitivity of "knows" allows speakers to manage practical risk by adjusting the standard required for warranted *assertion and reliance* in a specific conversational context? (EC: Yes, substantively).
  *   **Resolution Focus:** The test cases above, particularly those concerning the unaware subject and the disinterested attributor, probe this substantive core by isolating the role of the subject's practical situation from the attributor's conversational context. The challenge of the Shared-Utterance Case forces both sides to confront the limitations of their anchoring mechanisms.
