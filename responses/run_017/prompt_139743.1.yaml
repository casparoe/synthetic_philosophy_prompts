prompt: |-
  Hi — slightly odd request, and it's got personal recently so bear with me.

  My brother and I have spent three years and somewhere around £30k of our own money restoring our late grandfather's sailing boat. I dont really sail; neither does he. Two months ago a surveyor told us the keel bolts are shot, it needs another £15k minimum, and there's no guarantee it'll ever be seaworthy. My brother wants to carry on. I want out. And every time I try to say I'm done, what actually comes out of my mouth is: but we've already put so much in. I know that sentence is nonsense and I say it anyway. My wife's suggestion that we just sell it as-is for maybe 3k and stop makes me want to keep going even more, which feels definately backwards and I'd like to know whether it actually is.

  Here's the ask. I run a volunteer evening class in a village hall — Decisions and Arguments, fortnightly, open to anyone, 15 signed up at the moment, ages from about 19 to 70, almost none of them with any philosophy or economics. I've got a 90-minute slot and I want to spend it on escalation: why people keep pouring resources into a course of action that's plainly failing. The hall comittee would have a fit about real money changing hands, so it has to be points or play money or something, and three or four of the group have mobility problems, so nothing can require everyone to be physically active.

  The bit I can't find anywhere: everyone runs the classic dollar auction — highest bidder pays their bid and takes the prize, runner-up pays their bid and gets nothing — and then announces that this shows irrational escalation. But I think that demo mashes together about three different things and I want them separated:

  1. The trap itself. Once you've bid, stopping guarantees you a loss and continuing at least might avoid one, so carrying on is locally sensible even though everyone can see where it ends.
  2. The already-spent feeling. The pull of not wanting what's already gone to have been for nothing. This is the one I actually recognise from the boat.
  3. Face. Not wanting to be the person who blinked in front of a room full of people.

  Can you design me a 90-minute session where people run into all three separately instead of all at once? My guess is each one needs its own rule set — maybe a round where bids are paid immediately and irrecoverably whether you win or not, in some currency that actually costs people something real (time, effort, dignity, whatever you think works, plus a version for anyone who can't do the physical one), so that the it's-already-gone structure is right there in their body rather than on a whiteboard; and maybe a round where the identical game is played once with bids written down privately and once announced out loud, to see how much the audience is doing. But you'll have better ideas than me and I'd rather have yours.

  Two more things I want it to get at, which I don't think the standard auction models at all:

  - Whether softening the exit helps or hurts. Does giving people a way out that recovers some of what they've spent make them escalate less, or does it just hand them a reason to feel reasonable while carrying on? Is there a version of the game where you can actually see the difference, rather than just asserting it?
  - Whether a rival is even needed. In the auction there's always someone bidding you up. With the boat there isn't — my brother and I aren't competing against anyone, we're just continuing. Is that the same phenomenon at all, or is the auction a misleading model for the cases people actually care about? If it's misleading, I'd rather the session ended somewhere honest about that than with everyone feeling clever about having spotted a fallacy.

  What I need is something I can actually run: the rules for each round, what to bring, a payoff scheme with no real money, a rough minute-by-minute for the 90 minutes, and a debrief that maps specific moments in the room onto the three things above. Also tell me what will predictably go wrong the first time I run it — I can already see one person bidding £50 for a £20 note purely to win, and two people quietly agreeing to bid a penny and split it — and how to handle each. And be straight about which part of this the games can't deliver and I'll just have to say out loud myself.

  Please write in British English, the class is here and I'd only have to translate it otherwise.
reasoning: |-
  Hmm, the user has shared a deeply personal dilemma about restoring their grandfather's boat with their brother. They've sunk £30k and three years into it, only to find out it needs another £15k with no guarantee of seaworthiness. Their brother wants to continue, but they want out. They keep saying "we've already put so much in" even though they know it's irrational. Their wife's suggestion to sell it for £3k makes them want to continue more, which feels backwards.

  They run a volunteer evening class called "Decisions and Arguments" and want to design a 90-minute session on escalation of commitment. They want to separate three elements: the trap itself (continuing to avoid guaranteed loss), the sunk cost fallacy (not wanting past investments to be wasted), and saving face (social pressure). They also want to explore whether softening exits helps and if a rival is necessary for escalation.

  They need practical activities without real money that accommodate mobility limitations. I need to design three distinct activities that isolate each element, provide materials and timing, anticipate problems like collusion or extreme bidding, and address what the games can't show.

  For the sunk cost fallacy, I can design a "Penny Pyramid" game using time as currency. Participants build a pyramid with pennies, paying with seconds of their time. This makes sunk costs visceral and physical. For the escalation trap without rivals, a "Rescue Mission" game where individuals decide alone how much to invest to save a fictional project. For saving face, a "Public vs. Private Auction" where the same bidding game is played both anonymously and publicly.

  I'll structure the session with introduction, three rounds of activities, debrief, and conclusion. I'll provide minute-by-minute timing, materials needed (pennies, timers, worksheets), and handling for predictable issues like collusion or over-bidding. I'll acknowledge limitations - these games simplify real-world decisions where emotions, relationships, and uncertainty play bigger roles. The boat situation involves family legacy, which isn't captured here.

  The key is creating "aha moments" where participants recognize their own behavior in the simulations. By making sunk costs physical (time spent stacking pennies) and comparing private versus public decisions, the concepts should land more powerfully than mere explanation.
answer: |-
  Here’s a complete 90-minute session plan designed to isolate the three escalation drivers you’ve identified, using play currency and accommodating mobility constraints. It includes handling predictable problems and acknowledges limitations.

  **Session Title:** The Escalation Trap: Sunk Costs, Traps, and Face

  **Objectives:**
  1.  Experience the distinct psychological pulls of the *escalation trap*, *sunk cost fallacy*, and *saving face*.
  2.  Explore whether "soft exits" reduce escalation.
  3.  Question the necessity of a rival for escalation to occur.
  4.  Relate these concepts to real-world decisions (like your boat).

  **Materials Needed:**
  *   Whiteboard or flip chart + markers
  *   Stopwatch or phone timer
  *   Large bag of 1p coins (approx. 500)
  *   Small, identical prizes (e.g., fun-sized chocolate bars, novelty pens, bookmarks - 15+)
  *   Worksheets (1 per participant) - Simple sheet with tables for recording bids/decisions (see details below)
  *   Pens/pencils
  *   Two hats/bowls for collecting "bids"
  *   Play Money (Optional but recommended): Create simple "Decision Points" (DP) vouchers. Each person starts with 100 DPs per round. (Photocopy a simple design).

  **Prep (Before Session):**
  1.  Prepare worksheets (See Round 2 & 3 below).
  2.  Set up play money (if using).
  3.  Place prizes prominently.
  4.  Write session outline & key terms (Sunk Cost, Escalation Trap, Face) on whiteboard.

  **Session Flow (90 mins):**

  **Part 1: Introduction & Framing (10 mins)**
  *   (0-5 min) Welcome & Recap: Briefly remind them what the course is about (understanding how we make decisions/argue). Introduce today's topic: "Why do smart people sometimes keep throwing good money (or time, effort) after bad?"
  *   (5-10 min) Personal Hook (Briefly!): "This isn't just theory for me. My brother and I restored our grandad's boat for 3 years and £30k. Now it needs £15k more with no guarantee. I want to stop, he wants to continue. Every time I try to quit, I say 'But we've already put so much in!' even though I *know* that shouldn't matter. My wife suggesting selling it cheap makes me want to continue *more*. Today's session is me trying to understand why that happens, using us as guinea pigs!"
  *   State Objectives: "We're going to play 3 games today. Each aims to isolate a different reason why we escalate failing courses of action: The Trap, The Already-Spent Feeling, and Face. We'll also see if escape hatches help and if you need a rival at all."

  **Part 2: The Games**

  *   **Round 1: The Sunk Cost Feeling - "Penny Pyramid" (20 mins)**
      *   **Goal:** Make the feeling of "already spent" visceral and physical, isolating the sunk cost pull. **No rival needed.**
      *   **Setup:** "Imagine you're building something valuable. Each 1p coin represents effort/money invested."
      *   **Rules:**
          1.  Each participant gets 20 pennies and a flat surface (table/floor space).
          2.  Task: Build the tallest stable pyramid you can in 3 minutes. Tallest pyramid wins a prize.
          3.  **Crucial Twist:** Every time you place a penny on your pyramid, you must *immediately* place an identical penny into this communal bowl ("The Sunk Cost Bowl"). This penny is gone, regardless of whether you win or not. You cannot use sunk cost pennies.
          4.  You can stop building and keep your remaining pennies at any time.
      *   **Process:**
          1.  (1 min) Explain rules, demonstrate stacking.
          2.  (3 min) BUILDING PHASE (Use timer, call out time).
          3.  (1 min) Measure heights, declare winner(s), award prize(s).
          4.  (5 min) **Immediate Debrief (Facilitator Qs):**
              *   "How did it feel putting pennies into the bowl *as* you built?"
              *   "Did anyone stop early? Why? What did you think about the pennies already in the bowl?"
              *   "Did anyone keep going *because* they'd already put pennies in the bowl, wanting to 'make them worth it'?"
              *   "Was there a rival here? Or was it just you and your pile?" (Link: Boat - just you & the project).
          *   **Map:** "This is the *sunk cost fallacy* in action. The physical act of putting pennies away made the 'already spent' feeling tangible. You felt the pull to continue *because* of what you'd already 'lost', hoping to redeem it. No competitor needed – just the investment itself."
      *   **Predictable Problems & Handling:**
          *   *Problem:* Someone dumps all pennies quickly. *Handling:* "Interesting strategy! Did putting all those pennies in the bowl early make you feel *more* or *less* committed to building high? Did it feel like they 'had' to be justified?"
          *   *Problem:* Someone builds very little, keeps most pennies. *Handling:* "Well done on conserving resources! What was your thinking when you saw others putting pennies in the bowl? Did the sunk pennies influence you *not* to invest more?"

  *   **Round 2: The Trap & Soft Exits - "Rescue Mission" (20 mins)**
      *   **Goal:** Experience the escalation trap structure *without* an auction rival. Test if a "soft exit" option reduces escalation.
      *   **Setup:** "Imagine you've invested in a project (like software, research, a boat!). It's failing. Each extra £1k (or DP) *might* save it, but success isn't guaranteed. How much more will you invest?"
      *   **Rules (Using Worksheets/Play Money - DPs):**
          1.  Everyone starts with 100 DPs. A prize costs 50 DPs to "win" (simulating the value of a successful project).
          2.  You've *already* invested 40 DPs (sunk cost).
          3.  **The Trap:** To have *any* chance of success, you must invest *more* DPs this round. Each DP you invest now gives you a *small* increase in the chance of ultimate success (e.g., +2% per DP, but don't give exact odds, keep it vague like "increases the odds slightly").
          4.  **The Soft Exit:** At any point, you can choose the "Salvage" option. If you Salvage, you immediately get back 10 DPs (representing selling scrap/recovering some value), but you lose the project and any chance of the prize.
          5.  **Process:**
              *   Facilitator acts as "The Project". Announce rounds (e.g., "Investment Round 1").
              *   Each round, participants **privately** write down how many *additional* DPs they want to invest (0 to whatever they have left) OR if they choose "Salvage".
              *   After each round, the facilitator randomly determines (e.g., dice roll hidden, or predetermined sequence) if the project is "Saved" (Chance increases slightly each round based on *total* new investment). Once saved, those who invested *anything* get the prize (costing 50 DPs from their pot). Those who Salvaged are out.
              *   If not saved, play continues. **Crucially:** Announce *before* starting that the project *will* eventually fail completely after X rounds (e.g., Round 6 or 7) if not saved by then. Everyone still in loses everything beyond the sunk cost.
          6.  Play 6-7 rounds quickly (About 2 mins per round: 30 secs to decide, 30 secs to collect sheets/fake dice roll/announce "Not Saved" (mostly) or "Saved!"). "Save" it on round 4 or 5 for drama.
      *   **Process:**
          1.  (3 min) Explain rules carefully, handout worksheets/DPs.
          2.  (12 min) Play Rounds (Keep pace brisk!).
          3.  (5 min) **Immediate Debrief (Facilitator Qs):**
              *   "Who escalated significantly? At what point did continuing feel like the only option *even if* success seemed unlikely? Why?" (Highlight Trap: Stopping = definite loss (Salvage gives *some* back, but less than sunk cost), continuing = *chance* of avoiding loss).
              *   "Who used the Salvage option? When? Did knowing it was there make you *more* or *less* likely to invest *more* DPs?" (Explore Soft Exit: Did it feel like permission to quit, or did recovering *something* make initial sunk costs feel *less* wasted, paradoxically enabling *more* risk-taking?).
              *   "Was there a rival bidding against you?" (No - pure individual decision against uncertainty).
          *   **Map:** "This is the *escalation trap* structure. Once invested, exiting means accepting a loss *now*. Continuing offers hope (however slim) of avoiding that loss. The 'Salvage' option tested if a *soft exit* reduces escalation. Sometimes it does (lets people quit 'gracefully'), sometimes it *enables* escalation by making sunk costs feel partially recovered. Notice: **No rival needed.** The trap exists just between you, the project, and the uncertainty."
      *   **Predictable Problems & Handling:**
          *   *Problem:* Someone Salvages immediately. *Handling:* "Rational! You minimised further loss. Did the sunk 40DPs influence you *not* to try, knowing you could get 10 back? Or was it purely future-focused?"
          *   *Problem:* Someone invests everything immediately. *Handling:* "High risk strategy! Did the sunk 40DPs make you feel like you *had* to go 'all in' to justify them? Or was it pure optimism?"

  *   **Round 3: Face - "The Silent Auction vs. The Shouting Match" (25 mins)**
      *   **Goal:** Isolate the effect of publicity and social pressure (Face) on escalation. Use a classic auction structure but split to show the difference privacy makes.
      *   **Setup:** "We'll auction a prize twice. First silently, then publicly. The prize is worth 50 DPs to everyone."
      *   **Rules (Part A - Silent Auction):**
          1.  Everyone gets 100 DPs (reset).
          2.  **Crucially: Bids are written privately on worksheets, not announced.** Minimum bid increase 5 DP.
          3.  Auctioneer (Facilitator) takes bids. After each "call" (e.g., "Do I hear 25? 30?"), participants write their *new* max bid if they wish to increase. Auctioneer notes down the highest bid submitted and the bidder ID secretly.
          4.  Stop when no new bids come in after 2 calls. Announce winner and winning bid. Winner pays bid, gets prize. **Losers pay nothing.**
      *   **Rules (Part B - Public Auction):**
          1.  Everyone gets 100 DPs again (reset).
          2.  **Crucially: Bids are shouted out publicly.** Minimum bid increase 5 DP. Auctioneer visibly tracks current bid and high bidder.
          3.  Standard open outcry auction. Stop when no one bids after "Going once... twice...".
          4.  Winner pays bid, gets prize. **Runner-up pays their last bid and gets nothing.** (Classic dollar auction rule).
      *   **Process:**
          1.  (3 min) Explain Silent Auction rules. Emphasize privacy & losers pay nothing.
          2.  (7 min) Run Silent Auction (Keep pace brisk, call for bids frequently).
          3.  (3 min) Announce winner, collect "payment", award prize. Note final bid.
          4.  (2 min) Explain Public Auction rules. Emphasize publicity, runner-up pays.
          5.  (7 min) Run Public Auction (Encourage atmosphere, note people's reactions).
          6.  (3 min) **Immediate Debrief (Facilitator Qs):**
              *   "How did the *silent* auction feel? Were you focused purely on the prize value vs. cost?"
              *   "How did the *public* auction feel different? More exciting? More pressure?"
              *   "Did anyone in the public auction bid *after* they knew the prize was worth less than their bid, just to 'win' or not 'lose' to the other person? How did it feel?"
              *   "Runner-up in the public auction: How did it feel paying your last bid for nothing? Did the public nature make that feel worse?"
              *   "Compare the winning bids: Was the public auction usually higher? Why?"
          *   **Map:** "This isolates *Face*. In the silent auction, it was mostly about the prize vs. your private valuation. In the public auction, social pressure, competition, and the desire not to 'lose' or look weak kicked in. The 'runner-up pays' rule intensifies this – it literally creates a trap *between* rivals, but the publicity is the key amplifier of 'Face'. Sunk costs *during* the auction are less relevant here than the social stakes."
      *   **Predictable Problems & Handling:**
          *   *Problem:* Collusion in Silent Auction (whispering to split prize). *Handling:* Gently remind them bids are private and individual. If overheard, "Interesting! Trying to game the system shows rationality. But for this experiment, please bid based on your *own* valuation." (Keep it light).
          *   *Problem:* Someone bids extremely high publicly just to win. *Handling:* "Fascinating! What drove that final bid? Was it purely about beating the other person, even at a huge loss? How did the audience reaction influence you?" (This *is* the phenomenon - use it!).
          *   *Problem:* Low energy/public reluctance. *Handling:* As auctioneer, be slightly more energetic in the public round. "Do I hear 50? Anyone? Remember the prize is worth it! 55? We have 50, now 55..." Start low.

  **Part 3: Synthesis & Your Boat (15 mins)**
  *   (10 min) **Final Debrief & Relating the Three:**
      1.  **Review Whiteboard Terms:** Sunk Cost, Escalation Trap, Face.
      2.  **Map the Games:**
          *   "Round 1 (Pyramid) made **Sunk Costs** physical. The pull to justify past investment."
          *   "Round 2 (Rescue) showed the **Escalation Trap** structure: Continuing offers hope, stopping accepts loss. No rival needed. We also saw the **Soft Exit** (Salvage) – it helps some quit but can enable others to escalate *further* by softening the blow of sunk costs."
          *   "Round 3 (Auctions) isolated **Face**. Privacy vs. publicity showed how social pressure and competition drive bids beyond rational value, especially with the runner-up penalty."
      3.  **Your Boat Questions:**
          *   "So, my boat... Which forces are strongest? **Sunk Costs** ('We've put £30k in!')? Definitely. The **Trap** ('If we spend £15k *maybe* it works, if we sell now we *definitely* lose £27k')? Yes. **Face**? Maybe less direct than an auction, but... admitting defeat to my brother? To grandad's memory? To the people who knew about the project?" (Acknowledge the legacy/family emotional weight the games *don't* capture).
          *   "Is there a rival? Not really bidding against someone. But the **Trap** exists powerfully without one, as Round 2 showed. The uncertainty *is* the opponent."
          *   "Soft Exit? Selling as-is for £3k *is* a soft exit! But my reaction (wanting to continue *more*) suggests that for me, right now, it might be acting like the 'Salvage' option for some in Round 2 – it makes the sunk £30k feel *less* catastrophically wasted ('at least we'd get £3k back'), paradoxically freeing me *psychologically* to consider risking *more*. Or maybe it just highlights how big the loss would be, making me recoil." (Be honest about the complexity).
  *   (5 min) **Open Discussion & Wrap-up:**
      *   "Where else do we see these traps? Businesses? Relationships? Wars? Government projects?"
      *   "Final thought: These games simplify. Real decisions involve emotions, relationships, uncertainty, and values (like my grandad's legacy) that the games can't fully model. Recognising these traps gives us power, but it doesn't make walking away easy. Thanks for being my guinea pigs! Next time, we'll look at tools to counter these biases."

  **What the Games Can't Deliver (Be Prepared to Say This):**

  1.  **Emotional Weight & Legacy:** The games use trivial stakes (pennies, DPs, small prizes). They *cannot* replicate the deep emotional investment, family history, or sense of legacy tied to something like your grandfather's boat. You'll need to explicitly state that this hugely amplifies the sunk cost fallacy and the difficulty of the exit.
  2.  **Complexity of Uncertainty:** Round 2 simulates uncertainty, but real-world uncertainty (like "no guarantee of seaworthiness") is far more complex and anxiety-inducing. The "chance of success" is rarely knowable.
  3.  **Interpersonal Dynamics:** The games treat participants as isolated decision-makers or simple rivals. Your situation involves a complex partnership with your brother, with shared history, potential for conflict, and differing valuations of the legacy. The "Face" element with him is significant but different from a public auction.
  4.  **The "Worth It" Calculation:** The games have clear(ish) monetary values. The boat's value is emotional, sentimental, and symbolic as much as financial. This makes a purely rational "cut losses" calculation feel inadequate or disrespectful.

  **Key to Success:** Keep the games moving briskly, focus debriefs tightly on the specific force each round targets, and be transparent about your personal stake and the limitations of the simulations. Your authenticity about the boat will make the concepts resonate far more deeply than abstract examples. Good luck with both the session and the difficult decision!
