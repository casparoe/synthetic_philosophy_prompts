  Alright, let's tackle this user's problem. They're writing a term paper on everyday conventions like tipping and queueing. Their flatmate, an anthro PhD, led them into an argument that seems to prove too much, making the user stuck in circular reasoning. The core issue is whether visitors are morally bound by local conventions, even when those conventions feel wrong, like bribing officials or refusing gifts multiple times.

  First, I need to parse the argument's steps. The user lists premises (1) to (4) leading to (5) and (6). Premise (1) states that everyday morality is convention-dependent. The user wants to keep this for their paper. (2) says conventions don't differentiate locals from visitors. (3) claims no limit on what conventions can require. (4) concludes visitors must follow all local practices. But (5) points out this leads to absurdities, like forcing bribes, which feels morally wrong. (6) says one premise must go.

  The user's main conflict: they want to uphold (1) and part of (4) (visitors shouldn't cut lines) but reject other parts of (4) like bribing. Their flatmate argues that some examples in (3) aren't genuine conventions. The user proposed a "guest clause" but worries it's ad hoc. They also mention jaywalking where law and convention clash.

  Breaking down the premises: (1) seems solid. (2) is tricky—conventions might not explicitly mention visitors, but perhaps their application depends on participation. (3) is where the problem might lie. Not all regular behaviors are morally binding conventions. The user's examples—scrum boarding, gift refusal, bribes—need examination. 

  The flatmate says scrum and bribes aren't conventions but coercion or absence of order. That makes sense. Conventions require mutual expectations for coordination. A scrum might just be chaos, not a norm. Bribes involve coercion, lacking voluntary participation. Gift refusal, however, is a coordination norm. So why does the user feel it's not binding on visitors? Maybe because the moral weight differs. Tipping and queueing maintain social order without harm, but bribes perpetuate corruption. 

  The user's guest clause (benefits taken and conformity without detection) might work but needs refinement. For tipping, eating the meal means you benefit, so you should tip. Jaywalking: if everyone does it safely, conforming might be fine, but if illegal, that adds a layer. The key is distinguishing conventions that facilitate cooperation from those enforcing harm or injustice. 

  Rejecting (3)'s claim that any regularity is a convention. Conventions must be cooperative, not coercive. This saves US tipping as a convention but excludes bribes. For gift refusal, it's a convention, but perhaps visitors get leeway as they haven't internalized the norm. However, the user wants to say line-cutting is wrong, which is about fairness. 

  So the fix: conventions that coordinate without harm bind visitors who participate. Harmful or coercive "practices" don't. This retains (1) and (2) but limits (3). The user can argue that moral obligations from conventions arise only when they serve mutual benefit and don't cause harm. Thus, visitors must tip and queue but not bribe. The gift refusal might be a gray area—maybe it's polite to follow, but not a deep moral fault if a visitor doesn't. 

  Jaywalking: if conventional but illegal, legality might override, or the convention's safety aspect matters. But the user can separate legal and conventional duties. 

  Costs: The user loses the strong locality of all practices being equally binding. They introduce a moral filter, which might seem to undermine (1), but they can argue conventions still define duties, except when they conflict with higher moral principles. This avoids swallowing the absurdities in (4) while keeping the core of everyday morality being local.
answer: |-
  Here's the breakdown: **Reject premise (3)**. It falsely equates *any social regularity* with a *morally binding convention*. The "no in-principle limit" claim is where your argument overextends. Here's the step-by-step diagnosis:

  1.  **Why Premise (3) Looks Fine (Initially):** It *seems* intuitive. We observe vastly different social behaviors globally (scrums, gift-refusal rituals, bribes), and many function smoothly within their context. It feels relativistic to say "this regularity counts, but that one doesn't." It also seems necessary to capture the genuine diversity of norms.

  2.  **Why Premise (3) is Actually Broken:** Not every stable pattern of behavior constitutes a *convention* generating *moral obligations* for outsiders. Conventions, in the morally relevant sense (as hinted in (1) and needed for your paper), are fundamentally **coordination devices solving collective action problems or facilitating smooth social interaction *without coercive harm or fundamental injustice***. Let's test your examples:
      *   **The Scrum:** Your flatmate is partly right. A true scrum (chaotic pushing) often signifies the *absence* of a queueing convention, not a different *type* of convention. There's no shared understanding of "how it's done" creating order; it's just a free-for-all. No one feels a *duty* to shove; they shove to avoid being left behind. It solves no coordination problem cooperatively; it's individual competition. **Verdict:** Not a convention generating visitor obligations.
      *   **The Envelope (Bribe):** This is fundamentally different. It's not a coordination device promoting mutual benefit. It's a *coercive practice* rooted in power imbalance, corruption, or systemic injustice. Participation isn't driven by mutual expectation of benefit from coordination, but by fear of negative consequences (denial of service/permits) or exploitation. The "regularity" exists *because* of the underlying coercion/injustice, not as a solution to a coordination problem. **Verdict:** Not a convention generating moral obligations; it might generate a *prudential* reason (to avoid trouble), but the visitor has no moral duty to perpetuate corruption.
      *   **Gift Refusal (Twice):** This *is* a genuine convention. It solves a coordination problem around gift-giving etiquette to avoid offense, demonstrate humility, or ensure sincerity. It relies on mutual expectations and benefits smooth social interaction. **This is the tough case.** Your intuition that the visitor hasn't committed a major moral fault is valid. Why?
          *   **Implicit "Guest Clause"/Knowledge Barrier:** While the convention *formally* applies to "someone in situation S," its *point* (avoiding offense) often hinges on participants sharing the cultural understanding. The visitor, lacking this understanding, genuinely isn't *giving* offense in the same way a local who skipped the refusal would. Their action might cause *confusion* or mild surprise, but not the deep *rudeness* the convention is designed to prevent. The convention assumes a shared cultural script.
          *   **Moral Weight Difference:** The *moral wrong* in violating this convention is significantly lower than violating queueing or tipping. It's primarily about cultural sensitivity and navigating nuance, not about fairness, respecting service labor, or maintaining public order. A visitor trying their best gets leeway; a local refusing twice is performing a culturally expected ritual.
      *   **US Tipping vs. Envelope:** Tipping *is* a convention. It solves a coordination problem: ensuring service workers are compensated fairly *despite* a system where employer wages are legally low, relying on customer contributions. It functions through mutual expectations (worker provides good service expecting tip, customer expects good service and tips accordingly). It aims (however imperfectly) at a fair outcome (worker compensation). It lacks the coercive, unjust core of the bribe. **Verdict:** Convention generating visitor obligations if they use the service.

  3.  **Why Rejecting (3) Saves Your Argument & What It Costs:**
      *   **Saves (1):** Everyday morality *is* heavily convention-dependent (tipping, queueing, jaywalking *where conventional*, gift rituals). The duties *are* practice-defined.
      *   **Saves (2):** The *content* of the convention ("do R in S") usually lacks an explicit "unless foreign" clause. But rejecting (3) means we interpret "S" through the convention's *purpose*.
      *   **Fixes (4):** Visitors *are* obligated to follow genuine coordination conventions they benefit from (queue, tip at local rate, wait at crossing if it's a strong safety/order norm). They are **NOT** obligated to participate in chaotic scrums (not a convention), coercive bribes (not a morally binding convention), or held to the *exact same standard* on deeply culturally embedded rituals like gift refusal where ignorance mitigates the offense. The visitor *should try* to learn and follow the gift refusal, but a single misstep isn't a major moral failing akin to line-cutting.
      *   **Resolves (5):** The traveler declining the bribe *hasn't* violated a moral duty; they've refused to participate in coercion/corruption. "That's how we do things here" isn't a *complete* moral answer for fundamentally unjust or coercive practices; conventions exist within a broader moral framework.
      *   **Cost:** You lose the clean, ultra-relativistic "anything goes" claim. You now need a principled distinction between genuine, morally binding coordination conventions and other social regularities (chaos, coercion, rituals with high knowledge barriers). This distinction *isn't* ad hoc; it's based on the **function and underlying moral basis** of the practice:
          *   **Genuine Convention (Binding):** Solves coordination problem, promotes mutual benefit/smooth interaction, relies on mutual expectations, lacks core coercion/injustice. (e.g., queueing, tipping *as practiced*, traffic norms, some gift rituals).
          *   **Not Binding as Convention:** Chaotic free-for-all (scrum), Coercive/Exploitative practice (bribe), Ritual where visitor's ignorance fundamentally changes the meaning/offense (gift refusal - minor fault).

  4.  **Applying the Fix to Your Guest Clause & Cases:**
      *   Your "guest clause" points in the right direction but needs refinement based on the function/moral basis:
          *   **(a) Benefits:** Necessary. You can't be bound by a taxi queue convention if you never take taxis.
          *   **(b) Conformity without detection:** This captures *some* conventions (tipping anonymously) but not all (queueing is observable). **Better:** "The convention serves a legitimate coordinating/socially beneficial purpose *and* the visitor's participation is reasonably required for that purpose or fairness." Bribes fail the "legitimate purpose" test.
      *   **Jaywalking:** This shows the distinction perfectly.
          *   Where jaywalking is *illegal but conventional* (e.g., NYC, everyone does it safely when clear): This *is* a coordination convention ("cross when safe, don't impede traffic"). The point is efficient/safe crossing. Visitor conformity is expected and morally tied to safety/flow. Legal status is secondary *if* the convention effectively governs safe behavior.
          *   Where jaywalking is *illegal and NOT conventional* (e.g., small town, everyone waits): Waiting is the convention. Visitor jaywalking violates it.
          *   Where jaywalking is *conventional but UNSAFE* (e.g., darting into heavy traffic): It fails the "legitimate purpose/social benefit" test. It's reckless, not cooperative. Visitor has no obligation to follow; may have obligation *not* to.
      *   **Visitor Cases:**
          *   **Doesn't Tip (after eating):** Violates genuine coordination convention, exploits system, wrong.
          *   **Cuts in Line:** Violates fairness/convention, wrong.
          *   **Accepts Gift First Offer:** Minor cultural faux pas, not deep moral wrong. Should be excused/educated, not condemned.
          *   **Refuses Bribe:** Correct, no moral duty to comply.
          *   **Jaywalks (where conventional/safe):** Generally fine, part of the local flow. (Where illegal *and* unconventional/unsafe: wrong).

  5.  **Addressing Your Sneaky Feeling about (2):** You're right that exempting the visitor sometimes needs "outside" resources. Rejecting (3) clarifies this: the "outside" resource is the **broader moral framework** that distinguishes cooperative conventions from harmful coercion or chaotic non-conventions. This *doesn't* undercut (1), which is about the *source* of *specific* duties (like *how much* to tip or *where* to queue). (1) says the duty's *content* is set locally; it doesn't say *every local regularity creates a binding moral duty regardless of its nature*. Recognizing that some "practices" aren't morally binding conventions compatible with (1).

  **Conclusion:** Your flatmate was onto something with the scrum/bribe examples. Premise (3) is the broken step because it fails to distinguish *genuine morally binding conventions* (coordination for mutual benefit) from *chaos, coercion, or rituals where visitor ignorance changes the moral impact*. Rejecting (3) lets you keep the core insights about the locality of everyday morality (1) and visitor obligations for core coordination norms (part of 4), while avoiding the absurdity of requiring participation in corruption or chaos. The cost is developing a more nuanced (but principled) theory of what *kind* of conventions generate moral obligations. This strengthens your paper by adding depth to the "everyday conventions" analysis.
