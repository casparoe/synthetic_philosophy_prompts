  First, I need to recall existing concepts. Paltering involves true statements creating a false impression, but here the mechanism is different. The speaker's credibility is key; it's not just selective truth. False implicature? That's about implying something false, but here the inference isn't invited—it's anticipated based on the speaker's reputation. Withholding involves omitting key facts, but the user says every asked question is answered completely. Plausible deniability fits because the speaker can deny the false conclusion, but it's broader.

  The user emphasizes that the deception is self-sealing. No false statement, nothing to retract. The speaker's credibility is reinforced, making it repeatable. This is worse than a lie because there's no red flag. Existing arguments that misleading is less bad than lying don't hold here because the hearer has no route to the truth.

  So, what's missing in current terms? The reliance on the speaker's credibility as the mechanism. Terms like "credibility exploitation" come to mind. Maybe "epistemic entrapment" since the hearer is trapped by their own correct generalization about the speaker. "Self-sealing deception" captures the no-accountability aspect.

  I should check boundary cases. How is this different from paltering? Paltering might involve ambiguity or omissions; here, it's the reputation that does the work. Withholding? The user states all questions are answered, so it's not omission. Plausible deniability is a feature but not the core mechanism.

  The user's deeper need: they want to teach this subtle ethical issue. Trainees need to recognize and avoid it. Naming it gives them a handle for discussion. The ethical concern is that standard defenses of misleading don't apply, so this might be equally or more blameworthy.

  I recall literature. Bok's work on lying vs. misleading emphasizes agency but doesn't address credibility exploitation. Fricker on epistemic injustice—testimonial injustice could relate, but it's about prejudice, not deliberate exploitation. Fallis's taxonomy of deception might include this as a subtype.

  So, proposing "credibility exploitation" as the term. Define it with the key elements: truthfulness, reliance on reputation, anticipated false inference, self-sealing. Contrast with paltering: here, the inference is based on the speaker's character, not the statement's content. Withholding isn't present. Plausible deniability is a result, not the mechanism.

  The user might also need ethical analysis. Why is this wrong? It abuses trust, exploits the hearer's rationality, and prevents self-correction. It's a betrayal of the epistemic responsibility in professional roles like law or medicine, where trust is paramount.

