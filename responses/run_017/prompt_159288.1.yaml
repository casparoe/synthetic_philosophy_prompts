prompt: |-
  I sit on the grants committee of a small foundation with an annual budget of roughly two million dollars, and we are deciding whether to adopt the importance / tractability / neglectedness framework — the scheme that is standard in cause-prioritization work — as our standing method for choosing where the money goes. In preparation I read a much-shared blog post explaining the framework by a writer who covers philanthropy for a general audience and is broadly sympathetic to it. The passage that matters I have reconstructed below close to how it read:

  "Choosing a cause is a multiplication problem. Estimate three factors and multiply them. Importance is the size of the prize: how much better the world would be if the problem were solved outright. Tractability is the exchange rate between resources and progress — what fraction of the problem a given amount of money or talent can eliminate. Neglectedness is how little is already being spent on it, and it matters because the first dollar into a problem does far more good than the ten-thousandth, so a well-funded cause has already picked its low-hanging fruit and a neglected one has not. Multiply and you have the expected good per dollar, which is the only number a donor has any business looking at. The practical upshot is that the best causes are, as a rule, the unfashionable ones: if a problem is important and tractable, the only explanation for its still being neglected is that no one has got round to it yet, and that neglect is precisely what makes your dollar go furthest. Two things follow. First, concentrate: a cause ranked second is by definition worse per dollar than the one ranked first, so a donor who spreads money across several causes is simply buying less good with the same cheque. Second, stay out of crowded causes: a new dollar for something like cancer research, which already commands enormous budgets, buys next to nothing, and is therefore close to worthless to a donor whose aim is to do good."

  A colleague on the committee, who is skeptical of the whole framework, says the multiplication is a category mistake: neglectedness is not a third independent factor but a claim about where we currently sit on the tractability curve, so multiplying by it counts the same thing twice. He adds that once you take diminishing returns seriously the object to be chosen is not a ranked list of causes but an allocation across a portfolio, one that equalizes marginal cost-effectiveness across causes — which will normally mean funding several at once rather than piling everything into the winner. On the cancer remark he says the post forgets about other people's money: if a well-funded institution receives my dollar it may spend less of its own, so the counterfactual effect of my dollar is not simply the marginal project it nominally purchases. I find all three points persuasive, which worries me — I may be flattered by a clever objection rather than told the truth — and I don't know enough about the framework to tell whether he is attacking it or attacking a version of it that only exists in the post.

  Please audit the passage rather than the framework in general. Work through it claim by claim and sort what you find into: what a careful proponent of the framework would endorse as stated; what is a legitimate simplification for a popular audience; what is a genuine misrepresentation or non sequitur; and what is contested among people who actually use the framework. Then tell me whether the two conclusions the post draws — put everything into your top-ranked cause, and treat crowded causes as worthless — survive correction of the passages they rest on, and how much weaker the defensible versions of those claims are.

  Two constraints on how you answer. First, I know the terms importance, tractability and neglectedness are defined slightly differently by different writers, and you have no way to check: wherever your verdict turns on which definition is in force, say so explicitly and give me the verdict under each reading rather than picking one silently. Second, I want the audit to come with its own error bars: attach a confidence level to each of your main judgments, name the one place where your own reasoning is most likely to be wrong, and state what argument or consideration — a definition, an empirical fact about how steeply marginal returns actually decay, a feature of the framework's intended use I haven't mentioned — would lead you to a different verdict on the multiplication objection and on the concentration conclusion.
reasoning: |-
  Okay, the user is on a grants committee considering adopting the importance/tractability/neglectedness (ITN) framework for their foundation. They've read a blog post explaining it and have a colleague raising objections. The user wants me to audit the passage from the blog post specifically, not the framework in general. They want me to go claim by claim, categorize each part, and then see if the post's conclusions about concentrating funds and avoiding crowded causes hold up after corrections.

  First, I need to break down the passage. The key claims are: 

  1. Cause selection is a multiplication problem: Importance × Tractability × Neglectedness = Expected good per dollar.  
  2. Importance is the size of the prize if the problem were solved.  
  3. Tractability is the exchange rate between resources and progress.  
  4. Neglectedness matters because the first dollar does more good than the ten-thousandth.  
  5. Multiplying gives expected good per dollar, the only number a donor should consider.  
  6. Best causes are unfashionable; neglect is what makes your dollar go furthest.  
  7. Concentrate: only fund the top cause because second is worse per dollar.  
  8. Stay out of crowded causes: a dollar to cancer research buys next to nothing.  

  The colleague’s objections are:  
  - Multiplying neglectedness is a category mistake because it's part of tractability's diminishing returns.  
  - You need a portfolio allocation to equalize marginal cost-effectiveness.  
  - The cancer example ignores counterfactuals (funging).  

  I need to audit each claim in the passage. Categories:  
  A. What a proponent would endorse.  
  B. Legitimate simplification.  
  C. Genuine misrepresentation/non sequitur.  
  D. Contested among users.  

  Starting with the multiplication claim. Proponents do frame it multiplicatively, but neglectedness is often a proxy for current marginal cost-effectiveness, which includes diminishing returns. So it's a simplification (B) but not entirely wrong. However, treating it as three independent factors might be contested (D), especially since neglectedness affects tractability.  

  Importance definition: "size of the prize" is standard, so (A).  

  Tractability: "exchange rate between resources and progress" – that's vague. Proponents might say it's about the current marginal effectiveness, not average. The blog says "fraction of the problem a given amount can eliminate," which sounds like average tractability. But in practice, ITN uses marginal tractability. So this is a misrepresentation (C) because it conflates average with marginal.  

  Neglectedness: "how little is already spent" – that's (A). But the explanation about first dollar vs. ten-thousandth is about diminishing returns, which is part of why neglectedness matters. However, the colleague says this is already part of tractability's curve. So multiplying neglectedness separately might double-count if neglectedness is defined as current funding level, but tractability is dynamic. Proponents might argue neglectedness captures the current funding gap, which affects marginal returns. But strictly, diminishing returns are a feature of the tractability curve. So this could be contested (D).  

  Multiplying gives expected good per dollar: Only number to consider. Proponents do focus on cost-effectiveness, but other factors like risk, leverage, etc., might matter. So it's a simplification (B).  

  Best causes are unfashionable: Logical if important/tractable but neglected. But neglect isn't the only reason; could be other barriers. Simplification (B).  

  Concentrate: Only fund top cause. This ignores portfolio diversification, risk aversion, uncertainty in estimates. Proponents like Open Philanthropy do diversify. So the blog's claim is a misrepresentation (C) because it assumes perfect certainty and no diminishing returns within the top cause.  

  Stay out of crowded causes: Cancer research example. The colleague points out fungibility—your dollar might displace other funding. Also, even in crowded areas, marginal projects can have high returns if the cause is big. But the blog says it's "close to worthless," which is too strong. Plus, neglecting counterfactuals is a flaw. So misrepresentation (C) because it ignores displacement effects and assumes zero marginal returns.  

  Now, do the conclusions survive correction?  
  - Concentration: After correcting, it's weaker. You need to consider uncertainty, diminishing returns within a cause, and multiple causes to balance marginal effectiveness.  
  - Avoid crowded causes: Weaker; they might still be worthwhile if the marginal project is good, and fungibility matters.  

  Confidence levels:  
  - Multiplication as simplification: 90% confident.  
  - Tractability misdefined: 85% (marginal vs. average).  
  - Neglectedness not independent: 75% contested.  
  - Concentration claim misrepresents: 95% because major proponents diversify.  
  - Cancer example flawed: 90% due to fungibility.  

  My reasoning's weak point: The independence of neglectedness. If neglectedness is defined as current funding affecting current marginal tractability, then multiplying isn't double-counting. But if tractability is the fundamental curve, then adding neglectedness separately is redundant. Depending on definitions, the objection might hold. If tractability is defined as current marginal effectiveness (including funding level), then neglectedness isn't separate. But some define tractability as technical feasibility, neglecting funding. So under that definition, multiplying isn't double-counting. Need to clarify definitions.  

  What would change my verdict: If tractability is defined as the underlying potential without considering current funding, then neglectedness is a separate multiplier. But in practice, ITN often uses tractability as current marginal effectiveness, making neglectedness redundant. If the framework intends tractability to be static (technical ease) and neglectedness dynamic (current effort), then multiplying is fine. But the diminishing returns are still part of the response curve, which tractability should encompass. So the colleague has a point. If the framework's tractability includes current funding levels, then neglectedness isn't independent. Different sources define it differently, so I need to note that.  

  Overall, the blog's conclusions don't hold up well. Concentration is only optimal under unrealistic conditions, and crowded causes aren't worthless. Defensible versions are much weaker: diversify based on marginal effectiveness and consider counterfactuals.
answer: |-
  Below is a structured audit of the blog passage, conducted claim-by-claim. I categorize each element as:  
  - **(A) Endorsed**: A careful proponent would accept this as stated.  
  - **(B) Legitimate simplification**: Oversimplified for a general audience but defensible.  
  - **(C) Misrepresentation/non sequitur**: Fundamentally flawed or inconsistent with the framework.  
  - **(D) Contested**: Subject to debate among practitioners.  

  I apply your constraints:  
  1. Where definitions vary, I note alternatives explicitly.  
  2. Confidence levels (CL) for key judgments are provided (90% = high certainty; 60% = tentative). I flag my weakest reasoning point and specify what could change my verdicts.  

  ---

  ### **Claim-by-Claim Audit**  
  1. **"Choosing a cause is a multiplication problem. Estimate three factors and multiply them."**  
     - *(B) Legitimate simplification*: Proponents (e.g., Open Philanthropy) often frame ITN multiplicatively for intuition. However, they treat it as a heuristic for *marginal cost-effectiveness* (expected good per *additional* dollar), not literal multiplication of independent variables (CL: 85%).  
     - *Caveat*: If "tractability" includes current funding levels (a common definition), multiplying by "neglectedness" risks double-counting (see colleague's objection).  

  2. **"Importance is the size of the prize: how much better the world would be if the problem were solved outright."**  
     - *(A) Endorsed*: Aligns with standard definitions (e.g., 80,000 Hours). "Importance" captures total scale, not per-dollar impact (CL: 95%).  

  3. **"Tractability is the exchange rate between resources and progress — what fraction of the problem a given amount of money or talent can eliminate."**  
     - *(C) Misrepresentation*: This confuses **average** tractability (total progress per total resources) with **marginal** tractability (progress per *additional* dollar). ITN relies on *marginal* tractability to avoid diminishing returns fallacies. The passage implies tractability is static, ignoring that it degrades with funding (CL: 90%).  

  4. **"Neglectedness is how little is already being spent on it... the first dollar does far more good than the ten-thousandth."**  
     - *(B) Legitimate simplification*: Neglectedness is correctly tied to diminishing returns. However:  
       - *(D) Contested*: Definitions split on whether neglectedness is:  
         - *Funding-based*: Current resources allocated (e.g., GiveWell).  
         - *Impact-based*: Current marginal cost-effectiveness (e.g., effective altruism forums).  
       Under a *funding-based* definition, neglectedness is a proxy for high *current* marginal tractability. Under an *impact-based* definition, it *is* marginal tractability. The colleague’s objection holds strongest under the latter (CL: 80%).  

  5. **"Multiply and you have the expected good per dollar, which is the only number a donor has any business looking at."**  
     - *(B) Legitimate simplification*: ITN prioritizes cost-effectiveness, but:  
       - *(D) Contested*: Many practitioners (e.g., Open Philanthropy) incorporate tail risks, leverage, and coordination effects beyond strict ITN. Calling it the "only" factor oversimplifies (CL: 75%).  

  6. **"The best causes are, as a rule, the unfashionable ones... neglect is precisely what makes your dollar go furthest."**  
     - *(B) Legitimate simplification*: Neglect often signals high marginal impact, but:  
       - Non-neglected causes can remain high-value if scale is vast (e.g., climate change).  
       - "Unfashionable" is not synonymous with "high-impact"; some causes are neglected for valid reasons (e.g., intractability) (CL: 70%).  

  7. **"Concentrate: a cause ranked second is by definition worse per dollar... spreading money buys less good."**  
     - **(C) Misrepresentation**: This assumes:  
       - Perfect certainty in rankings (ignoring estimation error).  
       - No diminishing returns *within* the top cause (your millionth dollar to cause A may be worse than your first dollar to cause B).  
       Proponents (e.g., GiveWell) often diversify to hedge uncertainty. "By definition worse" is false if marginal returns equalize across causes (CL: 95%).  

  8. **"Stay out of crowded causes: a new dollar for cancer research... buys next to nothing, and is therefore close to worthless."**  
     - **(C) Misrepresentation**: Ignores:  
       - **Funging/displacement**: Your dollar to a cancer lab might displace a lower-impact grant, so net impact ≠ nominal project value.  
       - **Scale**: Even "crowded" causes can absorb funds efficiently if importance is extreme (e.g., pandemic prevention).  
       The "close to worthless" claim is hyperbolic and empirically unsupported (CL: 90%).  

  ---

  ### **Do the Conclusions Survive Correction?**  
  - **"Put everything into your top-ranked cause"**:  
    - **Survives? Partially, but severely weakened**.  
      - Defensible version: "Prioritize causes with highest *marginal* cost-effectiveness, but diversify under uncertainty or steep within-cause diminishing returns."  
      - Strength reduction: **High**. The blog’s absolutism ignores real-world complexities. Practitioners rarely concentrate 100% (e.g., Open Philanthropy’s portfolio includes global health, AI risk, and animal welfare).  

  - **"Treat crowded causes as worthless"**:  
    - **Survives? No, but a weaker claim holds**.  
      - Defensible version: "Crowded causes *often* have lower marginal impact, but require case-by-case analysis of funging, importance, and room for more funding."  
      - Strength reduction: **Extreme**. The blog’s claim is empirically flawed (e.g., GiveWell funds "crowded" vaccine programs after confirming high marginal impact).  

  ---

  ### **Error Bars and Self-Critique**  
  - **Confidence Levels**:  
    - Multiplication as heuristic (B): 85%  
    - Tractability misdefined (C): 90%  
    - Neglectedness simplification (B): 80%  
    - Concentration as misrep (C): 95%  
    - Cancer example as misrep (C): 90%  

  - **Weakest Point in My Reasoning**: **The multiplication objection** (claim 1 and 4).  
    - Why? The colleague argues neglectedness is "part of the tractability curve," implying double-counting. But:  
      - If tractability is defined as *technical feasibility* (e.g., "can we solve malaria with current tech?"), neglectedness (funding level) is independent. Multiplying is valid.  
      - If tractability includes *current marginal returns* (e.g., "how much progress does $1 buy today?"), then adding neglectedness double-counts.  
    - **What could change my verdict?**  
      - If the framework defines tractability as *static* (technical potential) and neglectedness as *dynamic* (current effort), multiplication isn’t redundant. Proponents like 80,000 Hours sometimes use this distinction. My verdict assumes tractability is *marginal* by default (as in cost-effectiveness analysis). A key source (e.g., Open Philanthropy’s explicit definitions) could resolve this.  
    - Impact on concentration conclusion: If multiplication is valid, "concentrate" is stronger—but still flawed by ignoring uncertainty.  

  - **Key Uncertainty for Concentration Conclusion**: **How steep are diminishing returns?**  
    - If returns drop sharply within a cause (e.g., first $1M saves 100 lives, next $1M saves 10), diversifying is optimal. If returns are flat (e.g., each $1M saves ~100 lives), concentrating wins. The blog assumes zero decline, which is unrealistic (CL: 70%).  

  ---

  ### **Summary**  
  The colleague correctly identifies critical flaws:  
  1. The multiplication *may* double-count if tractability includes funding effects (definition-dependent).  
  2. Portfolio allocation beats concentration under uncertainty/diminishing returns.  
  3. The cancer example ignores funging and scale.  

  The blog’s conclusions ("concentrate exclusively," "crowded causes are worthless") **do not survive** as stated. Defensible versions are far weaker:  
  - **Concentrate** → "Prioritize top causes but diversify prudently."  
  - **Avoid crowded causes** → "Discount crowded causes after analyzing marginal impact and displacement."  

  **Recommendation**: Adopt ITN as a *starting heuristic* but require:  
  - Marginal (not average) cost-effectiveness estimates.  
  - Explicit modeling of diminishing returns and uncertainty.  
  - Counterfactual analysis (e.g., "Does my grant displace other funding?").  

  This retains ITN’s strengths while avoiding the blog’s oversimplifications.
