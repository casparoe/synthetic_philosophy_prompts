prompt: |-
  I've been helping to run a discussion section on scarce-resource allocation — the kind of material that starts from the old lifeboat setup and then gets extended to rich-world obligations toward people in the water — and I keep noticing that my gut verdicts on variants are confident, numerous, and hard to fit together. Before the term ends I would like to write down the principle I am implicitly using, if there is one. I would much rather be told that one of my verdicts has to go than be handed a principle that saves all of them by growing a clause for each case.

  Everything below is a variation on one setup: a lifeboat built for nine, ten people aboard, the boat will swamp within twenty minutes unless the load is reduced, and rescue is expected in about three hours.

  (a) Ten adults, relevantly similar, nobody volunteers. My verdict: someone may be put over the side; letting all ten drown is not morally required. But it has to be settled by lottery — the strongest person may not simply choose, and I do not think the captain's authority changes anything. I also think the person selected would be within their rights to fight back, which I realize sits badly with my saying the rest may put them over.

  (b) One of the ten is the crewman whose negligence sank the ship. No lottery; he goes. And here I do think he may be overpowered if he resists, which I do not think in (a).

  (c) One of the ten is unconscious and, on the best clinical assessment available, will die within two hours whatever anyone does. Choosing him is not just permissible but clearly preferable to choosing anyone else; in fact this is the only case where I think a lottery would be wrong.

  (d) One of the ten is seventy-two and can statistically expect perhaps ten more years of life against the others' forty or fifty. My verdict: that is not an admissible basis for selecting him — and I hold this even though the thought I keep reaching for in both (c) and (d) is the same thought, that he has less left to lose. The actuarial version, where all we know is that he belongs to a group with lower average life expectancy, I reject even more firmly.

  (e) An able-bodied person with no dependants calmly volunteers to go over the side. The offer may be accepted. I also think, less comfortably, that it may be accepted even when the volunteer is the only person aboard who can navigate, so that accepting it probably dooms the other nine.

  (f) A different possibility: nobody goes over the side, everyone bails and lashes themselves to the gunwales, and each person then faces roughly a fifteen percent chance of drowning. I prefer this to putting one person over, even though the expected number of deaths is higher.

  (g) The same option, but each person faces roughly forty-five percent. Here I would put someone over the side after all — and I cannot say where between fifteen and forty-five the switch happens.

  (h) Outside the boat: with room and rations for ten more, swimmers in the water must be hauled aboard. If the boat's own crew recklessly caused the collision, they must take them in even at real cost to themselves, and if there is not room, the culpable crew go over the side before any swimmer is refused. If the boat is genuinely full, refusing swimmers is permissible. But if the crew deliberately keep two places empty and heave the spare rations overboard so that no one can later say there was room, my verdict is that they have not thereby acquired the permission they would have had if the boat really were full.

  My own tentative formulation is this: every person aboard has an equal claim to a place; that claim can be defeated by the person's own consent, or by their responsibility for the emergency; and where claims are equal, the selection must be made by a fair procedure rather than by any judgment about whose life is worth more. Please test that against (a) through (h) and repair it where it breaks. I want: a small set of candidate principles stated precisely, with the case that forces each clause; where a candidate and one of my verdicts conflict, a recommendation about which to give up and what giving it up costs me elsewhere; verdicts on cases I have not listed — in particular on the threshold in (g), on the case I keep changing my mind about (one of the ten is a six-year-old child, and I cannot decide whether excluding her is obviously right or is exactly the kind of comparative judgment I rejected in (d)), and on at least one case of your own construction; and an honest statement of which of my verdicts no clean principle can accommodate.
reasoning: |-
  Hmm, the user is grappling with moral intuitions around scarce-resource allocation in lifeboat scenarios. They've presented eight thought experiments (a-h) where their gut reactions seem internally inconsistent, and they want to uncover the unifying principle - or accept that some intuitions must be sacrificed for coherence.

  Let me map their intuitions first: 
  - Strong equality commitment: requires lotteries in base case (a), rejects age discrimination (d) 
  - Responsibility matters: negligent crewman (b) may be forcibly ejected 
  - Medical futility exception: unconscious dying patient (c) may be selected preferentially 
  - Voluntarism respected: even with catastrophic consequences (e) 
  - Collective risk-sharing preferred when survival odds are high (f) but not when grim (g) 
  - External obligations triggered by culpability (h)

  Their proposed principle has three pillars: equal claims defeasible only by consent or responsibility. But it immediately cracks under pressure: 
  - It can't explain the medical exception (c) without smuggling in "less to lose" reasoning they explicitly reject in (d) 
  - Doesn't address the risk-sharing threshold (g) 
  - Conflicts with their navigation-volunteer verdict (e) where accepting sacrifice likely kills all 
  - Says nothing about children cases they're stuck on

  The deeper tension is between three ethical frameworks wrestling beneath their intuitions: 
  1) Deontological equality (lotteries as fair procedure) 
  2) Consequentialist efficiency (saving more life-years) 
  3) Corrective justice (responsibility for harm)

  Their medical exception (c) is actually consequentialist - it minimizes wasted resources on futile cases. But they reject this logic when applied to life expectancy (d), creating inconsistency. Similarly, their risk-sharing preference (f) values solidarity over pure survival math, but this collapses when odds worsen (g).

  For the child case they're struggling with: If they apply strict equality, the child stays in the lottery. But if they feel saving her is "obviously right," that's consequentialism (more life-years saved) which would also demand ejecting the elderly (d) - the exact move they rejected. Can't have both.

  Repair attempt: Add a "medical futility" clause to their principle: claims can be defeated if person cannot benefit from the resource. This covers (c) without endorsing life-expectancy comparisons. But then we need to define "benefit" - is two hours of unconsciousness "benefit"? Probably not, but slippery.

  Alternatively, embrace that some intuitions must go. If they keep the elderly protection (d), they must either: 
  - Drop the medical exception (c), or 
  - Reclassify (c) as "no claim" rather than "defeated claim" (but is that convincing?)

  Threshold problem (g) is messiest. Perhaps: When individual survival probability exceeds X%, collective risk-taking is obligatory? But setting X feels arbitrary. Maybe shift frameworks - this isn't about claims but about reasonable risk imposition.

  Final proposal: Split the principle. For selection cases (a-e), use the revised claims model. For risk-distribution (f-g), switch to a "mutual aid" principle where co-survival chances must be optimized unless fairness demands otherwise. But now we have two principles.

  The navigation-volunteer case (e) remains a problem. If accepting sacrifice causes near-certain doom, is it really respecting autonomy or collective self-destruction? Might need to add a "no catastrophic harm" proviso.

  Honest conclusion: No clean principle saves all intuitions. The child case will force them to choose between equality and life-maximization. The threshold case (g) requires embracing arbitrariness or reframing. And the navigation-volunteer (e) might need revision - perhaps such sacrifices shouldn't be accepted if they undermine the very purpose of the lifeboat.
answer: |-
  Below is a principled framework derived from your intuitions, tested against your cases, revised where it breaks, and extended to new scenarios. It preserves most of your verdicts but requires surrendering one key intuition to avoid contradictions. I'll state the principle, show its application, flag tensions, and recommend revisions.

  ---

  ### **Proposed Principle (Revised After Testing)**
  1. **Equal Claim**: All persons have equal claim to survival resources.
  2. **Defeasibility Conditions**: This claim is defeated **only** by:
     - **Voluntary Consent** (uncoerced offer to forfeit claim), or
     - **Causal Responsibility** (direct responsibility for creating the emergency).
  3. **Procedural Requirement**: When claims are equal and undefeated, selection **must** use a fair lottery.
  4. **No Comparative Valuation**: No person’s life, future potential, social role, or inherent traits may be weighed against another’s.
  5. **Collective Risk Exception**: When reducing the load *guarantees* survival for the rest, but *retaining all* offers a *reasonable chance* of collective survival, the group must choose the latter if the risk is not grossly disproportionate to the alternative.

  ---

  ### **Testing Against Your Cases**
  - **(a) Ten similar adults**:  
    → Equal claims → lottery required.  
    → Resistance permitted (right to defend undefeated claim).  
    **✓ Fit**: Principle explains verdict.

  - **(b) Negligent crewman**:  
    → Claim defeated by **causal responsibility**.  
    → Forcible ejection justified.  
    **✓ Fit**: Principle explains verdict.

  - **(c) Unconscious dying person**:  
    → **Breaks the principle**. Your verdict prefers selecting them without lottery, but:  
      - No consent (unconscious) or responsibility (not culpable).  
      - Medical futility ≠ defeasibility condition.  
    → **Conflict**: Principle requires lottery; you reject it.  
    **✗ Repair**: *Surrender this verdict* or *add a "futility" clause*. If added:  
      - **Futility Condition**: Claim defeated if person cannot survive the rescue window *even with the resource*.  
      → Explains (c): Unconscious person cannot survive 3 hours; claim void.  
      → Preserves (d): Elderly *can* survive, so claim stands.

  - **(d) Elderly person (lower life expectancy)**:  
    → Age ≠ defeasibility condition.  
    → Comparative life-years rejected → no selection.  
    **✓ Fit**: Principle explains verdict.

  - **(e) Volunteer (even sole navigator)**:  
    → Consent defeats claim → offer accepted.  
    → Principle ignores consequences (e.g., doom of nine).  
    **⚠️ Tension**: You feel uneasy, but principle holds.  
    → **Recommendation**: *Keep verdict* but note it conflicts with consequentialism.

  - **(f) 15% collective risk**:  
    → **Collective Risk Exception** applies:  
      - Reducing load (killing 1) guarantees 9 survive.  
      - Retaining all offers 85% survival/person → "reasonable chance."  
      → Must choose collective effort.  
    **✓ Fit**: Explains preference over ejection.

  - **(g) 45% collective risk**:  
    → Retaining all offers only 55% survival/person → risk may be "grossly disproportionate" vs. guaranteed survival for 9.  
    → Ejection permitted.  
    → **Threshold Issue**: No bright line. Depends on minimum "reasonable chance" (e.g., >33%?).  
    **✓ Fit**: Explains switch.

  - **(h) Swimmers & culpability**:  
    - *Culpable crew*: Responsible for emergency → claim void → ejected first.  
    - *Deliberate underfilling*: Fraud negates "full boat" defense → must rescue.  
    **✓ Fit**: Principle explains verdict.

  ---

  ### **New Verdicts & Threshold Guidance**
  - **Threshold in (g)**:  
    → Collective risk is obligatory if per-person survival chance > *X* (e.g., 30-40%). Below *X*, ejection is permitted.  
    → *Why no bright line?* "Reasonable chance" is context-dependent. If forced: **>33% survival chance/person mandates collective effort**.

  - **The Child Case (six-year-old aboard)**:  
    - **Principle**: Equal claim → no preferential exclusion.  
    - **Your Conflict**: Excluding her feels like comparative valuation (rejected in d), but saving her feels imperative.  
    → **Verdict**: *Child stays in lottery*.  
    → *Why?* If you exclude her, you violate **No Comparative Valuation**. Saving her because she has "more life to live" is age discrimination, analogous to (d).  
    → **Cost**: Surrenders intuition that saving children is prioritizable.

  - **New Case: The Pregnant Person**  
    - Scenario: One of the ten is pregnant (fetus viable if mother survives).  
    - **Principle**: Equal claim → no weight to fetus (comparative valuation).  
    → **Verdict**: Pregnant person in lottery, no special status.  
    → *Test*: If you prioritize her to save two lives, you violate the principle.

  ---

  ### **What Must Be Surrendered**
  - **The Unconscious Dying Person (c)**:  
    Your verdict ("clearly preferable, no lottery") **cannot be saved** by a clean principle without:  
    - Adding a "futility" clause (if you do, it holds), or  
    - Surrendering the verdict and requiring a lottery.  
    → **Recommendation**: *Add futility* to preserve (c) and consistency.  
    → **Clause**: *"A claim is void if the person cannot survive the rescue window even with the resource."*

  - **Cost of Futility Clause**:  
    It risks slippery slopes (e.g., is "statistically likely to die" like the elderly in d?). Mitigation: Strictly limit to **medical certainty** of death *within the timeline*.

  ---

  ### **Final Repaired Principle**
  1. **Equal Claim**: All persons have equal claim to survival resources.  
  2. **Defeasibility Conditions**: A claim is defeated **only** by:  
     - **Voluntary Consent**,  
     - **Causal Responsibility**, or  
     - **Medical Futility** (inability to survive the rescue window even with the resource).  
  3. **Procedural Requirement**: When claims are equal and undefeated, selection **must** use a fair lottery.  
  4. **No Comparative Valuation**: No life may be weighed against another.  
  5. **Collective Risk Exception**: When collective survival offers a reasonable chance (>33%/person), it must be chosen over guaranteed sacrifice.  

  ---
  ### **Honest Statement**
  **No clean principle accommodates all your verdicts without the futility clause in (c)**. If you reject futility, (c) must be surrendered. If you keep (c) as-is, the principle *must* grow a clause. The threshold in (g) and the child case expose inherent tensions between equality, efficiency, and intuition—but the repaired principle minimizes contradictions while respecting your core aversion to discrimination.  

  **To integrate (c) cleanly**: Embrace futility as non-comparative (it asks "Can *this* person benefit?" not "Is *this* life worth less?"). This distinguishes it from (d) and preserves the spirit of your rejection of actuarial judgments.
