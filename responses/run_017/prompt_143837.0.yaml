answer: |-
  Here’s your Q&A prep sheet—written as requested—with eight anticipated objections, ranked by potential damage and ordered by likelihood. Each reply includes candid notes on its soft spots. I’ve flagged the objection you should dread most (spoiler: it’s not the one you expected).  

  ---

  **First, the consequentialist:** "This seems like unnecessary complexity. Expected-value reasoning already handles infinitesimal chances: if abstaining gives a one-in-a-million chance of preventing a thousand tons of suffering, the expected utility clearly favors abstention. Why invent categories where this doesn’t apply? Your 'lumpy' case just sounds like a low-pivot scenario—still tractable with standard tools."  
  *Reply:* "Because in lumpy systems like meat supply chains, the pivot probability isn’t just low—it’s structurally *zero* until a threshold is crossed. Your EV calculation relies on a false continuity: no slaughterhouse reduces output by 0.0001% for one fewer burger. My model shows abstention *shifts the timing* of threshold crossings, creating a deferred but predictable difference."  
  **Soft spots:** You’re implicitly rejecting their premise that all harms are amenable to EV. If they insist pivot probabilities are *always* non-zero (e.g., via butterfly effects), you’ll stalemate. Concede that EV works for continuous harms but not lumpy ones.  

  **Next, the Kantian:** "Why frame ethics around *differences made* at all? If buying factory-farmed meat treats animals as mere means, or violates a duty of non-complicity, it’s wrong regardless of whether my act changes outcomes. Your entire project legitimizes a consequentialist obsession with causality that distracts from deontic constraints."  
  *Reply:* "I agree duties can exist independently of causal difference—that’s precisely why I argue threshold cases require non-causal grounds. But for cases like meat, showing that individual acts *do* make a deferred causal difference strengthens the position against those who dismiss duties *because* they see no difference. This bridges frameworks."  
  **Soft spots:** This reply risks pleasing no one. Kantians may feel you’ve still centered consequences; consequentialists will bristle. Retreat to: "Even on your view, showing efficacy undermines a popular objection."  

  **The structural injustice scholar:** "Aren’t you individualizing structural harm? Focusing on consumer choices obscures systems—contract farming, subsidies, labor exploitation—that require collective action. Worse, your ‘deferred difference’ might imply regulatory efforts are less urgent, since individual acts ‘add up’ over time."  
  *Reply:* "Not at all. I treat consumer abstention as a *pro tanto* duty, not a substitute for institutional change. In fact, my model shows individual acts *don’t* add up linearly—they trigger system-level changes. This reveals why collective action (e.g., boycotts) is essential to force those jumps. It complements, doesn’t replace, structural critique."  
  **Soft spots:** They’ll suspect you’re smuggling in neoliberal agency. Emphasize that your account *depends* on systemic features (e.g., ordering rules). Concede that consumer ethics alone is inadequate.  

  **The decision theorist:** "Your convergence claim assumes stable demand. But real inventory systems face volatility: weather, trends, supply shocks. If demand fluctuates, your ‘deferred thresholds’ might never hit—or hit randomly. And how do you assign probabilities to threshold-crossing events without data? It’s as arbitrary as pivot probabilities."  
  *Reply:* "Convergence holds under *stationarity*—demand can fluctuate, but its distribution must be stable long-term. We can estimate threshold-crossing probabilities from historical order patterns (e.g., how often sales dips trigger reduced orders). Unlike pivot probabilities, these are empirically grounded in supply-chain mechanics."  
  **Soft spots:** This is vulnerable. Real systems aren’t perfectly stationary, and data is scarce. Retreat to: "Even with noise, abstention shifts the mean time-to-threshold, making harm reduction likelier over time."  

  **The applied ethicist (EA):** "If abstention only defers harm, shouldn’t we prioritize interventions with immediate, certain impact? E.g., corporate campaigns to change batch sizes, or offsets that directly reduce emissions? Does your view imply individual boycotts are inefficient?"  
  *Reply:* "Deferred ≠ inefficient. Sustained abstention *reliably* reduces production over time, while corporate campaigns face high uncertainty. Offsets work for continuous harms but not lumpy ones—you can’t ‘offset’ a chicken’s life. Boycotts shift industry norms *and* trigger deferred reductions, making them robust tools."  
  **Soft spots:** You’ll need evidence that boycotts cause deferred reductions faster than corporate lobbying. Cite historical cases (e.g., cage-free campaigns) but concede multi-pronged strategies are best.  

  **The objection you hoped nobody asks—but should dread:** "Your ‘deferral’ doesn’t solve inefficacy—it relocates it. Whether harm occurs *still* depends on whether *others* abstain later. If they don’t, your past abstention achieved nothing. So isn’t your act still inefficacious unless coordinated?"  
  *Reply:* "Crucially, my abstention changes the *baseline* for future actors. If I quit today, I reduce the ‘critical mass’ needed for future thresholds by one unit. That’s a real causal difference—it’s just distributed across time. And if no one else joins, the harm occurs later than it would have, which is still better."  
  **Soft spots:** This is the knife-edge. It concedes that *full* harm reduction requires collective action, but insists individual acts matter by altering temporal trajectories. If pressed, argue that morality doesn’t require single-handedly solving problems—only doing one’s part in a sequence.  

  **Wildcard: From a quiet empiricist in the back:** "Where’s the evidence? Do we see ‘deferred reductions’ in meat sales data, or is this theoretical?"  
  *Reply:* "Preliminary data from poultry supply chains shows order adjustments occur at discrete demand levels (e.g., +/- 5,000 birds). But this is nascent work—future partnerships with operations researchers could test predictions."  
  **Soft spots:** You have no smoking gun. Admit it’s model-driven but grounded in standard operations theory.  

  **The softest concession (threshold cases):** "For referendums, you admit causal difference-making fails. But if I have a duty to vote anyway, doesn’t that imply duties exist *without* difference-making? And if so, why not extend that to meat and emissions?"  
  *Reply:* "Threshold cases are uniquely discontinuous—no ‘inventory’ to defer harm into. Here, fairness or participatory duties apply. But for meat/emissions, causal *structures exist* to absorb individual acts—so we should use them. We need distinct grounds for distinct problems."  
  **Soft spots:** They’ll argue you’re arbitrary. Concede that non-causal duties *might* apply everywhere but stress your account is stronger where causal structures allow.  

  ---

  **Confidence & Uncertainty:** I’m 80% confident in this mapping. The objections align tightly with each scholar’s known concerns, and the deferral-relocation challenge is indeed the most damaging—it exposes a tension between individual efficacy and collective necessity. Least sure about the decision theorist’s objection: real-world supply chains *are* messier than your model, and I suspect they’ll have sharper technical counterexamples. If they cite stochastic volatility models, concede gracefully—your core point holds if thresholds exist *at all*.  

  **Final tip:** If the "causal notion" question resurfaces, shut it down fast: "Threshold-crossing is causal—it’s when my abstention, aggregated, triggers a supplier’s decision. But let’s discuss mechanisms in depth *after* the talk." Then move on. Good luck—this is razor-sharp work.
