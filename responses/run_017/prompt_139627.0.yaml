prompt: |-
  You are a professional philosopher who works on formal epistemology and probability, and who actually talks to working mathematicians. Please think carefully about this one before answering — do a bit of brainstorming about the space of possible readings first and only then commit to verdicts. I want a menu with verdicts, not an essay, and I'd rather you tell me which readings are bunk than be diplomatic about it.

  Background: I'm a first-year PhD student in math. At our group tea yesterday someone half-jokingly asked whether anyone wanted to bet on whether a conjecture we've been stuck on is true, and one of the senior professors killed it with "you can't be uncertain about mathematics." He meant it to end the question of whether there is even such a thing as a rational degree of confidence in an unproved statement. The same line gets used around the department in at least two other ways: to say that once you've checked a proof line by line it's irrational to hang on to any residual doubt; and to say that "I'm 80% sure the lemma is true" is really only a statement about whether a proof will eventually turn up, not about the lemma; and to say you shouldn't build anything that *relies* on a conjecture, because you can't be uncertain about math, so either prove it or don't.

  My own cases pull in different directions:

  - I read a colleague's proof of a lemma carefully, found no gap, and now I'm certain. Continuing to have doubts here feels like a failure of nerve, not a coherent attitude.
  - Before we proved our thing about torsion points on that family of elliptic curves, I was maybe 70% on it, and I used that to decide to spend a month trying to prove it rather than refute it. That felt completely fine and I'd do it again.
  - Two postdocs disagree about whether a preprint floating around really establishes its main lemma. Neither seems to me to be irrational.
  - A statement that's independent of the usual axioms — I have no idea what to say about whether I'm "uncertain" about it. That feels like it might be a different animal entirely.
  - A conjecture with a decent heuristic argument behind it and computational verification up to something like 10^18. My confidence is high, obviously not 1, and I don't think anything is wrong with me for that.

  Also relevant, maybe: a friend in CS says the slogan should just be replaced by a coherence condition. As she puts it, your credences over unproven sentences are in good shape iff no *computable* trading strategy, working only from the set of sentences you can already prove, can make unbounded money off you — and on top of that your credence in a sentence has to converge to 1 if the sentence is provable, and to something else if it's refutable, where "time" means how much you've proved so far. She says this is what people working on "logical induction" are after. I can't tell whether that's a precisification of the slogan or a replacement for it.

  So here's what I want. What are the distinct precise claims "you can't be uncertain about mathematics" could be making, ordered from the trivial to the wild? Which are platitudes, which are substantive and defensible, and which are straightforwardly false — I suspect at least one reading just conflates necessity with certainty, or truth with provability, but say precisely which and where the conflation is. For each of the three departmental uses of the line, which reading would he have to be invoking for the line to actually do the work he wanted, and does that reading hold up? Is my friend's computable-Dutch-book thing just the ideal-agent reading with a weaker bookie, or is it a genuinely different claim — and does it vindicate any use of the slogan or only bury it? Finally, run the readings against my five cases and tell me which of them force me to give up a confidence I actually have and don't want to give up.

  Format it as a list or table of readings, each with a one-line verdict and a note on what it does with my cases. No reading list or citations — I don't need sources, I need the distinctions. Take your time and think it through properly; definately don't just tell me "it depends."
