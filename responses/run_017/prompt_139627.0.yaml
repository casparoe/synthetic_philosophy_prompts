answer: |-
  Here is a systematic breakdown of distinct readings of "you can't be uncertain about mathematics," ordered from trivial to radical. Each reading includes a verdict, its implications for departmental uses and your cases, and its relationship to your friend's "logical induction" framework. Verdicts are **Platitude** (trivially true but unhelpful), **Defensible** (substantive and coherent, though possibly false), **Bunk** (internally confused or straightforwardly false), or **Wild** (extreme and implausible). Conflations are explicitly flagged.

  ---

  ### **Readings of "You can't be uncertain about mathematics"**

  1. **Reading: Mathematical truths are necessary (metaphysical certainty).**  
     *Core claim*: Mathematical propositions, once true/false, are necessarily so.  
     *Verdict*: **Platitude** (agreed by all, but irrelevant to epistemology).  
     *Does what work?* None—confuses *metaphysical necessity* with *epistemic certainty*.  
     *Cases*: Compatible with all your confidence attitudes (e.g., 70% on elliptic curves).  
     *Logical induction*: Irrelevant—this is about truth, not belief.  

  2. **Reading: Proofs eliminate all rational doubt (verificationism).**  
     *Core claim*: After personally verifying a proof, residual doubt is irrational.  
     *Verdict*: **Defensible** (for idealized agents with unlimited cognitive resources).  
     *Does what work?* Supports the "no residual doubt after checking" departmental use.  
     *Cases*: Vindicates your certainty after checking a colleague's proof. Fails for preprint disagreement (if both postdocs verified carefully but still disagree).  
     *Logical induction*: Compatible—credence converges to 1 for verified proofs.  

  3. **Reading: Degrees of belief must track proof-completion (instrumentalism).**  
     *Core claim*: "I'm 80% sure" only means "I’m 80% confident a proof will be found."  
     *Verdict*: **Bunk** (conflates belief in a mathematical proposition with belief about *human activity*).  
     *Does what work?* Invoked for the "betting on conjectures" departmental use to deflect the question.  
     *Cases*: Incompatible with your 70% confidence in the elliptic curves conjecture—you weren't predicting proof-discovery timelines, but evaluating plausibility.  
     *Logical induction*: Rejects it—credences are about truth, not sociological predictions.  

  4. **Reading: Unproven statements lack truth values (anti-realism).**  
     *Core claim*: Until proven/disproven, mathematical propositions are neither true nor false.  
     *Verdict*: **Defensible** but controversial (e.g., intuitionism).  
     *Does what work?* Could support "don’t rely on conjectures" (no truth to rely on).  
     *Cases*: Rejects your 70% confidence and computational verification case—if no truth value, confidence is incoherent. Compatible with independence case (no truth value).  
     *Logical induction*: Incompatible—credences track proof-conditional probabilities, presupposing truth-aptness.  

  5. **Reading: Ideal agents have binary belief (logical omniscience).**  
     *Core claim*: A perfectly rational agent believes all mathematical truths with certainty and falsehoods with 0 credence.  
     *Verdict*: **Platitude** for ideal agents (but useless for humans).  
     *Does what work?* None—humans aren’t logically omniscient. Misused to dismiss all uncertainty.  
     *Cases*: Demands you abandon *all* non-1/non-0 credences (e.g., 70% on elliptic curves, preprint disagreement).  
     *Logical induction*: Explicitly rejects this—credences are non-binary and fallible.  

  6. **Reading: Uncertainty is always about proofs, not mathematics (sloganeering).**  
     *Core claim*: "Uncertainty" only applies to our access to proofs, not to mathematical truth itself.  
     *Verdict*: **Bunk** (conflates *object-level truth* with *meta-level justification*).  
     *Does what work?* Used to shut down betting discussions ("you can't bet on math!").  
     *Cases*: Incompatible with your cases—your 70% was about *whether the conjecture holds*, not just about finding a proof.  
     *Logical induction*: Rejects it—credences are about propositions, not proofs.  

  7. **Reading: No rational gradational belief for mathematics (certainty-or-bust).**  
     *Core claim*: Rational agents can only hold binary beliefs (1 or 0) about unproven statements.  
     *Verdict*: **Bunk** (ignores the role of evidence in guiding research).  
     *Does what work?* Supports "don’t rely on conjectures" (if no rational confidence, reliance is arbitrary).  
     *Cases*: Forces you to abandon 70% confidence, preprint disagreement, and computational verification cases as irrational. Only allows certainty after proof.  
     *Logical induction*: Directly contradicts it—gradational credences are central.  

  8. **Reading: Mathematics is epistemically transparent (radical anti-skepticism).**  
     *Core claim*: All mathematical truths are knowable with certainty *by humans*; doubt is always irrational.  
     *Verdict*: **Wild** (empirically false—humans make errors, proofs are complex).  
     *Does what work?* Invoked for "no residual doubt" after proof-checking.  
     *Cases*: Demands certainty in all cases—invalidates preprint disagreement and your initial 70% confidence.  
     *Logical induction*: Incompatible—credences are probabilistic and corrigible.  

  ---

  ### **Your Friend's Logical Induction Framework**
  - **Core claim**: Credences are rational iff no computable Dutch book can exploit them *given current knowledge*, and credences converge to 1 (for theorems) or 0 (for contradictions) as proofs accumulate.  
  - **Relationship to slogan**: **Replacement**, not precisification. It formalizes *how to be rationally uncertain* about mathematics.  
  - **Verdict on slogan**: Buries it entirely—vindicates all your confidence attitudes (70%, preprint disagreement, computational verification) as rational.  
  - **Cases**: Validates all except possibly the independence case (handled by assigning fixed credence if undecidable).  

  ---

  ### **Departmental Uses: What Reading Would Justify Them?**
  1. **"End betting on conjectures"**: Requires Reading 3 (instrumentalism) or Reading 6 (sloganeering). **Bunk** in both cases.  
  2. **"No residual doubt after proof-checking"**: Requires Reading 2 (verificationism) or Reading 8 (radical anti-skepticism). **Defensible** only for Reading 2 (idealized).  
  3. **"80% sure = prediction about proof-discovery"**: Requires Reading 3 (instrumentalism). **Bunk**.  

  ---

  ### **Which Readings Force You to Abandon Confidence?**
  - **Safe readings** (compatible with all your attitudes): Readings 1 (platitude) and logical induction.  
  - **Forced abandonment**:  
    - Reading 3 (instrumentalism): Forces you to recast your 70% as about proofs, not math.  
    - Reading 4 (anti-realism): Forces 0 credence in all unproven statements.  
    - Readings 5, 7, 8 (omniscience/certainty-or-bust/anti-skepticism): Force binary belief, abandoning 70%, preprint disagreement, and computational confidence.  

  **Result**: Only bunk or wild readings demand you give up reasonable credences. Defensible readings (like verificationism for idealized agents) are narrow. Logical induction formalizes and vindicates your intuitive approach. The slogan is either trivial, confused, or false—never useful.
