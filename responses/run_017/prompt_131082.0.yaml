prompt: |-
  I'm a TA for a 24-person undergrad course that's basically decision theory for philosophers — mostly second- and third-years, not very mathy. I've got one 75-minute slot next week, a projector, a stack of index cards, no budget at all, though I can rustle up a single decent prize (a nice bottle of something, or a fat book token) and a bag of good chocolate. I was talking this over with a friend who does econ and she said the version I usually run is too easy to shrug off, and I think she's right.

  Last term I did the plain two-urn thing — one urn with a known 50/50 mix, one with an unknown mix, you pick a colour and you pick an urn — and it half flopped. A third of the class said "isnt that just risk aversion?" and I didnt have a clean way to show them it wasn't. And the people who did see the pattern only saw it in the aggregate: nobody felt like *they* had done anything odd. I want them to catch themselves doing it.

  Two wrinkles I've been playing with, which you should build the session around (or replace if you can see something better): (1) alongside the known urn and the mystery urn, add a third urn whose composition is produced by a transparent random process right in front of them, but the result goes into a sealed envelope that nobody — me included — will ever open. It's pure risk by construction and I bet it still feels like the mystery urn, which should separate "I dislike unknown probabilities" from "I just dislike coin flips." (2) A two-parter where the same student contradicts themselves. First I offer a ticket that pays if a fair coin lands heads *and* red comes out of the mystery urn, or tails *and* black comes out of the mystery urn — so its chance of winning doesn't depend on the composition at all, and it looks worth exactly the same as a ticket on the known urn. Then I flip the coin in front of them and offer to swap their coin-ticket for a known-urn ticket for a small fee. My guess: indifferent before the flip, happy to pay after it, whichever way it lands — so they've paid to undo a choice they just said they were indifferent about.

  What I actually need: rules and materials; some way to get a number out of each student rather than a show of hands (I was thinking anonymous numbered index cards I hand back at the end, so each person can see their own round-2 answer sitting next to their round-5 answer); payoffs that work with chocolate and one shared prize and no cash; a minute-by-minute timeline; and a debrief that maps particular moments onto the sure-thing principle, the reduction of compound lotteries, and whatever goes wrong when someone prefers the known urn for red *and* the known urn for black — but with me never naming any of that up front, and the labels arriving only at the end. Also: how to run the mystery urn honestly (I dont want to rig it or lie about what's in it, and somebody always accuses me of rigging it), what will predictably go wrong the first time I run this, and an honest note on what it can't show. My sense is it can establish that something has to give but not which formal model of the behaviour is right, and it definitely can't establish that anyone is being irrational. No reading lists or citations, just the session.
reasoning: |-
  Okay, let me try to unpack the TA's problem. They're teaching a decision theory class for philosophy undergrads, mostly second and third years who aren't super math-savvy. Last time, the classic two-urn Ellsberg Paradox demo fell flat—some students dismissed it as mere risk aversion, others only saw the pattern in aggregate without feeling personally involved. Now they want a redesigned session where students actually catch themselves making inconsistent choices.

  Hmm, the key goals seem to be: 1) Make the paradox feel visceral and personal, 2) Address the "isn't this just risk aversion?" objection head-on, 3) Use tangible payoffs (chocolate/prize) within zero budget, 4) Collect individualized choice data anonymously, and 5) Debrief without jargon until the end.

  The TA proposed two clever wrinkles: First, adding a third urn with random but sealed composition to disentangle "unknown probability" from "simple risk." Second, a self-contradiction sequence where students pay to undo a choice they were indifferent about. Both seem promising but need operationalizing.

  For the three-urn setup, I should specify how to make it feel fair. Maybe fill the mystery urn live with beads from an opaque bag while students watch, but don't reveal the count. The random urn could use a die roll to determine composition, sealed immediately. That should prevent rigging accusations. 

  The payoff structure is tricky with no cash. The chocolate tokens could work for small incentives during the choice rounds, while the big prize (book token/bottle) gets awarded via lottery tickets based on their choices. That maintains engagement throughout. 

  For the contradiction sequence, timing is critical. Need to first get indifference between the compound lottery and known urn, then after the coin flip, offer the swap. The fee should be small enough that paying it feels irrational later—maybe 1 chocolate square? 

  The index card system needs to capture choices at multiple points without confusion. Numbered cards handed out upfront, collected after each choice round, then returned at debrief so students see their own inconsistency. 

  Biggest pitfall might be students not taking it seriously because "it's just chocolate." Emphasizing that the prize lottery depends on their choices should help. Also preparing counters for common objections during debrief ("But ambiguity feels different!") without shutting down discussion. 

  This won't prove irrationality, but it should make them feel the tension between their choices. That "aha" moment when they look at their own contradictory cards is the gold.
answer: |-
  Here’s a step-by-step plan for a 75-minute session designed to make ambiguity aversion visceral and expose contradictions in personal choices. It incorporates your wrinkles and fixes past pitfalls.

  **Materials:**  
  - 3 opaque urns/jars (labeled K, M, R)  
  - 60 red/black beads (or poker chips) in an opaque bag (for filling M)  
  - 1 fair coin  
  - 1 sealed envelope  
  - 6-sided die  
  - Projector (for instructions/randomization)  
  - Index cards (numbered 1-24) + pens  
  - Bag of chocolate (small rewards)  
  - Grand prize (book token/bottle) for lottery  

  ---

  ### **Phase 1: Setup & Urn Demo (15 mins)**  
  *(Goal: Transparent randomization, defuse rigging accusations)*  
  1. **Introduce Urns (5 mins):**  
     - **K (Known):** Show 30 red + 30 black beads. Seal it.  
     - **M (Mystery):** Have a volunteer draw 60 beads blindly from your bag. *They* dump beads into M (no one counts). Seal it.  
     - **R (Random):** Roll a die. If 1-3: "high red" (40 red/20 black). If 4-6: "high black" (20 red/40 black). *Don’t reveal the result.* Write it, seal in envelope, tape to R.  

  2. **Key Script:**  
     *"K has exactly 50% red/black. M has a fixed mix but no one knows it—not even me. R’s mix was randomized fairly, but it’s sealed forever. All urns are now fixed."*  

  ---

  ### **Phase 2: Choice Rounds (25 mins)**  
  *(Goal: Elicit ambiguity aversion & inconsistency via anonymous cards)*  
  **Hand out numbered index cards.** Instructions: *"Write your card number + choice. Keep choices private."*  

  - **Round 1 (Baseline):**  
    *"Pick an urn. If I draw YOUR chosen color from YOUR urn, you get 1 chocolate. Which urn? (K, M, R)"*  
    **Prediction:** Most pick K. R ≈ M.  

  - **Round 2 (Color-Specific):**  
    *"Assume you pick RED. Which urn gives the best chance? (K, M, R)"*  
    Repeat: *"Assume you pick BLACK. Which urn?"*  
    **Prediction:** K favored for both colors → contradiction.  

  - **Round 3 (Compound Lottery):**  
    *"Ticket A: Win chocolate if (fair coin = Heads AND red from M) OR (Tails AND black from M).  
     Ticket B: Win if red from K.  
     Which ticket? (A or B)"*  
    **Key Script:** *"Notice: Ticket A wins exactly 50% of the time, no matter M’s mix! Why? Heads+red and Tails+black cover all possibilities."*  
    **Prediction:** Indifference (≈50% choose A/B).  

  - **Flip the coin.** Announce result (e.g., "Heads!"). *Don’t tie to tickets yet.*  

  - **Round 4 (Post-Flip Swap):**  
    *"If you chose Ticket A: Pay 1 chocolate to switch to Ticket B? (Yes/No)  
     If you chose Ticket B: Pay 1 chocolate to switch to Ticket A? (Yes/No)"*  
    **Prediction:** Many A-holders pay to switch to B (even though pre-flip A=B).  

  **Collect cards after each round.**  

  ---

  ### **Phase 3: Payoffs & Lottery (15 mins)**  
  1. **Distribute chocolate:**  
     - Randomly select 5 students. For each, draw from their chosen urn/apply ticket rules from Rounds 1-3.  
     - Apply Round 4 swaps/penalties.  

  2. **Grand Prize Lottery:**  
     - Assign 1 lottery ticket per student.  
     - Draw 1 ticket: Winner gets book token/bottle.  
     *"Your ticket number is your card number. But some get bonus tickets..."*  
     - **Ambiguity-punisher bonus:** +1 ticket if they chose K in Round 1 AND picked K for both colors in Round 2.  
     - **Consistency bonus:** +1 ticket if Round 3 choice (A/B) matches Round 4 swap decision (e.g., chose A and didn’t pay to switch).  
     - Draw winning ticket publicly.  

  ---

  ### **Phase 4: Debrief (20 mins)**  
  *(Goal: Map their actions to concepts without jargon)*  

  1. **Show Class Results (Projected):**  
     - Round 1: Urn choices (% K, M, R)  
     - Round 2: % choosing K for red vs. black (highlight: many same people chose K for both)  
     - Round 3: % A vs. B  
     - Round 4: % who paid to swap after coin flip  

  2. **Guided Reflection:**  
     - *"In Round 2, if you picked K for red AND black—what does that imply about your beliefs for M?"*  
       → *"You think M has fewer reds AND fewer blacks? But total must be 100%!"*  
     - *"In Round 3, Ticket A and B had identical win chances. Why did many A-holders pay to switch to B after the coin flip?"*  
       → *"Did the coin flip change the odds? Or did it make the ‘unknown’ feel more salient?"*  

  3. **Connect to Concepts (Label Last):**  
     - **Ambiguity Aversion:** *"Disliking unknown probabilities (M) more than known risks (K or R)."*  
     - **Sure-Thing Principle:** *"If you prefer K for red and K for black, you should prefer K upfront. But many don’t feel that."*  
     - **Reduction of Compound Lotteries:** *"Ticket A collapsed two uncertainties (coin + M) into one 50% gamble. Yet after the coin flip, it ‘became’ a draw from M—and suddenly felt worse."*  

  4. **Address Wrinkles:**  
     - *"Did R (random/sealed) feel different from M? For most, no—the ‘unknown’ feels the same whether fixed or random. It’s not about risk, but what you know."*  
     - *"You paid to undo a choice you were indifferent about. That’s not risk aversion—it’s the paradox making you squirm."*  

  ---

  ### **What Could Go Wrong & Fixes:**  
  - **"You rigged M!"**: Have a student fill M blindly from your bag. Emphasize: *"I never touched the beads."*  
  - **Indifference in Round 3**: Stress *"Ticket A wins 50% no matter what’s in M"* visually (show outcomes: Heads/Red, Tails/Black = win).  
  - **Math objections**: Redirect: *"This isn’t about calculation—it’s about your gut feeling. Did you catch yourself wanting K even when it didn’t make sense?"*  
  - **Time crunch**: Skip R urn or simplify Round 4 to subset of students.  

  ### **What It Can’t Show:**  
  - Proves inconsistency, not irrationality (they may defend ambiguity aversion).  
  - Doesn’t distinguish between formal models (e.g., Maxmin EU vs. smooth ambiguity).  
  - Chocolate incentives may not bite—use peer pressure + prize lottery.  

  **Core Insight:** They’ll see their own Round 2 & 4 choices side-by-side on returned cards. The visceral "wait, I did that?" moment is where learning begins.
