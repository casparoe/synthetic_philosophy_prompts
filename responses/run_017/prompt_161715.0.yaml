answer: |-
  Below is a systematic translation of Friedman's methodological dispute into your specified vocabulary of measurement and applied statistics, followed by residue analysis and an evaluation of your idle/load-bearing distinction.

  ### **Core Translation: Friedman's "As-If" Defence**
  1. **General Claim**:  
     A model's assumptions are **nuisance parameters** in the data-generating process (DGP). Their "truth" is irrelevant if the model achieves **out-of-sample predictive success** (e.g., low mean squared error on unseen data). Model selection should prioritise **cross-validated predictive accuracy** over **in-sample fit** or assumption "realism."  

  2. **F-Twist**:  
     Deliberately **biased estimators** (unrealistic assumptions) can yield superior predictive performance by optimising the **bias–variance trade-off**. Highly simplified assumptions act as **regularising penalties**, reducing overfitting. Thus, unrealistic assumptions are not merely harmless—they are **load-bearing components** that improve robustness.  

  3. **Billiard Player Example (Friedman's Illustration)**:  
     - *Original*: Expert players behave *as if* they solve physics equations.  
     - *Translation*: A parametric model of billiard shots (e.g., angle/force as functions of ball positions) is fitted to observational data. The model **systematically ignores cognitive parameters** (e.g., neural processes). If it predicts shots accurately in **pre-registered test scenarios**, the omission is justified—even if the player uses heuristics. The unrealistic "physics solver" assumption is either:  
       - **Idle**: The error cancels out (e.g., player heuristics correlate with physics solutions).  
       - **Load-bearing**: The assumption acts as a **simplifying prior**, reducing variance in angle/force estimates.  

  ---

  ### **Translated Objections to Friedman**  
  1. **Causal Depth Critique (e.g., Simon)**:  
     Models with false causal assumptions risk **non-identifiability**. If the DGP includes **latent variables** (e.g., player experience), a model omitting them may fit noise, failing **sensitivity checks**. Predictive success alone cannot verify if correlations are **structurally invariant**.  

  2. **Operationalism Critique (e.g., Samuelson)**:  
     Models with untestable assumptions lack **falsifiability**. If "profit maximisation" is defined *only* by observed choices, it becomes a **tautological parameter**—always fitting data but offering no **out-of-sample leverage**.  

  3. **Robustness Critique**:  
     Unrealistic assumptions may hold only under **specific calibration**. E.g., billiard physics fails if table friction varies. Models should pass **domain shift tests** (e.g., predicting shots on wet tables).  

  ---

  ### **Your Distinction: Idle vs. Load-Bearing False Assumptions**  
  Your distinction **survives translation cleanly**:  
  - **Idle False Assumption**:  
    - *Statistical equivalent*: A **nuisance parameter** with negligible bias. Error cancels due to **orthogonality** (e.g., assuming normal errors when true errors are symmetric).  
    - *Example*: Billiard model ignores air resistance, but its effect is **asymptotically negligible** for slow shots.  
  - **Load-Bearing False Assumption**:  
    - *Statistical equivalent*: A **deliberate bias** (e.g., LASSO penalty) improving **mean squared error**.  
    - *Example*: Assuming billiard players ignore spin reduces **variance** in angle estimates when spin data is noisy.  

  **Critique of the Debate**:  
  Friedman’s defenders often conflate "idle" and "load-bearing" cases. The F-twist *requires* load-bearing claims (unrealism as a *virtue*), but many examples (e.g., billiards) are idle. This slippage is why critics see circularity.  

  ---

  ### **Residue Report**  
  #### **1. Clean Translations**  
  - "Predictive success matters" → **Cross-validated out-of-sample accuracy**.  
  - "Unrealistic assumptions" → **Omitted variables**/**simplified functional forms**.  
  - "F-twist" → **Regularisation via biased specification**.  

  #### **2. Distorted Translations**  
  - **"Truth of assumptions"**:  
    - *Translation*: Whether assumptions introduce **bias** or **non-identifiability**.  
    - *Distortion*: "Truth" becomes a question of **bias magnitude** and **identifiability**, losing the metaphysical connotation of "correspondence to reality."  
  - **"Realism"**:  
    - *Translation*: **Model misspecification cost** under domain shifts.  
    - *Distortion*: "Realism" is operationalised as **robustness to distributional shifts**, ignoring semantic debates about "essences."  

  #### **3. No Statistical Counterpart**  
  - **"Assumptions as virtuous *per se*"**:  
    - No equivalent to valuing unrealistic assumptions *independently* of predictive performance. Statistics asks: "Does this assumption reduce MSE?" Not: "Is falsity admirable?"  
    - *Gap or Illusion?* **Illusion**. This is rhetoric, not methodology. The F-twist’s normative leap ("unrealism = power") has no statistical basis.  
  - **"Causal explanation vs. prediction"**:  
    - No concept privileging *why* over *what*. Statistics treats causal models as **DGPs with identifiability guarantees**.  
    - *Gap or Illusion?* **Gap**, but a bridgeable one. **Sensitivity analysis** and **instrumental variables** test causal claims.  

  #### **4. Your Vocabulary's Blind Spot**  
  - **"Why do we care about truth?"**:  
    - Your framework cannot answer this—it presumes the goal is **predictive control**. If the goal is **causal understanding** (e.g., for policy interventions), bias matters even when predictions hold.  
    - *Substantive?* **Yes**. E.g., a billiard model predicting shots but misattributing causation fails if we want to *train players*.  

  ---

  ### **Conclusion**  
  Your vocabulary **fully captures** the methodological substance of the Friedman dispute:  
  - The idle/load-bearing distinction is **robust** and clarifies slippage in the debate.  
  - Residues are either **rhetorical** (e.g., virtue-talk) or **teleological** (e.g., goals beyond prediction).  

  **Recommendation**: Treat demands for "realism" as requests for:  
  1. **Sensitivity analysis** (does relaxing assumption X change outputs?).  
  2. **Domain shift tests** (does the model break under new conditions?).  
  3. **Identifiability checks** (can we distinguish X from alternative mechanisms?).  

  This strips the dispute of its "metaphysical excess" and centres empirical performance—a stance your physical chemistry background will recognise as good practice.
