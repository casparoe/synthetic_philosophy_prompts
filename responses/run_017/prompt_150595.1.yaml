  Hmm, this is clearly someone deeply familiar with memory politics scholarship - they referenced Margalit and Rieff but explicitly don't want exegesis. Interesting they're rejecting "hedged mush" - they want the real fault lines exposed. The four specified pain points (hot/cold memory, sleeping archives, asymmetry, memory budgets) are where they want the intellectual heavy-lifting.

  Let me unpack their framework first. The Remembrance camp sees memory as active preservation of affective connection to victims - forgetting as continuous harm. The Amnesty camp views institutionalized but cooled memory as necessary for social cohesion. The hot/cold distinction seems central - is the duty about maintaining emotional resonance or institutional safeguards?

  The sleeping archive case is brilliant - it isolates whether preservation without engagement satisfies any duty. For Remembrance, this would feel like abandonment since the human connection is lost. For Amnesty, the accessible archive might suffice as "remembering" since it enables accountability when needed.

  On asymmetry... that's tricky. Does perpetrator-descendants have stronger duties? Or does the duty transform when living memory fades? Both camps might agree the duty evolves but disagree on how. The memory budget point makes it concrete - every remembrance choice implies forgetting something else.

  *scribbles notes* The real disagreement isn't about whether to remember at all, but what form remembering must take to discharge duties. The sleeping archive tests that perfectly. Also whether the duty is primarily to the dead (Remembrance) or to the living community (Amnesty).

  For structure - each article needs to do four things cleanly. No fluff. The test cases must force each side to show their cards. Example: Article 1 could establish common ground on archival preservation, then split on whether passive storage suffices, using sleeping archives as the test with predictions. Article 2 might tackle hot vs cold memory via monument controversies. 

  *checks watch* Better avoid any scholarly name-dropping since they forbade it. The asymmetry point deserves its own article - maybe use post-genocide societies as test case. For verbal disputes, Article 5 could expose how "duty" means moral obligation for one side versus pragmatic prescription for the other.

  Crucially, every sentence must pass the "not from a skimmed book" test - so no clichés about "learning from history." Instead, drill into specific mechanisms: How does cold memory prevent recurrence? What exactly is lost when affect fades? The memory budget point should frame forgetting as active triage.

  *stares at draft* Wait - is the user simulating an actual mediation? Or preparing for a publication? The level of specificity suggests this is for professional use. Better make sure the joint statement format holds up to academic scrutiny while keeping it razor-sharp. Five articles only, no waffle. Time to write.
answer: |-
  Here is the joint statement structuring the core disagreement and proposed resolutions:

  1. **Both camps affirm that societies must preserve verifiable records of historical wrongs to prevent denialism and enable accountability (common ground). We disagree on whether the sleeping archive—where records exist but are never consulted—discharges the duty. Crux: Does "remembering" require *engagement* with memory beyond preservation?**  
     *Test*: Introduce the archive into a divided society; Remembrance predicts increased polarization without active engagement, Amnesty predicts societal cooling without narrative reinforcement.  

  2. **We agree the duty, if it exists, requires more than inert documentation (common ground). Remembrance holds it demands *hot memory*—affective, identity-shaping continuity with victims' experiences. Amnesty argues *cold memory*—institutionalized, propositionally accessible knowledge—suffices for justice. Crux: Is the emotional resonance of memory intrinsic to its moral function?**  
     *Test*: Compare societies with identical archives but differing memorial practices (e.g., annual vigils vs. archival access only); Remembrance predicts colder societies show higher rates of recurrent injustice, Amnesty predicts they achieve faster reconciliation.  

  3. **Regarding asymmetry, both acknowledge descendants of perpetrators bear distinct obligations concerning acknowledgment (common ground). Remembrance contends the duty *intensifies* for victim-descendants as living memory fades, to sustain witness. Amnesty argues the duty *transforms* into a depersonalized institutional obligation upon that threshold. Crux: Does intergenerational identity sustain unique duties beyond institutional ones?**  
     *Test*: Track policy support for reparations before/after last survivor death in victim-descendant communities; Remembrance predicts increased demand, Amnesty predicts decreased salience.  

  4. **We concur that public attention is finite, making remembrance allocation a zero-sum choice (common ground). Remembrance argues neglecting a wrong is *culpable omission* if hot memory lapses. Amnesty contends *deliberate forgetting* is often a necessary act of civic triage. Crux: Is the cessation of active commemoration inherently a moral failure?**  
     *Test*: Analyze societies that deliberately shifted focus away from a historical wrong via sleeping archives; Remembrance predicts resurgence of grievance, Amnesty predicts enhanced social cohesion without denial.  

  5. **A key verbal dispute centers on "duty": Remembrance frames it as a *deontic obligation to the dead/victims*, binding regardless of consequences. Amnesty frames it as a *pragmatic prescription for the living*, contingent on societal health. Crux: Is the duty’s foundation backward-looking (debt) or forward-looking (flourishing)?**  
     *Test*: Measure societal well-being indicators after implementing Remembrance-prescribed rituals vs. Amnesty-prescribed cooling; both camps accept outcome as validating their foundational stance.
