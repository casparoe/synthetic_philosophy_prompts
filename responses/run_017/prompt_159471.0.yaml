  The scene where Roy saves Deckard is often seen as evidence of mind, but the Attrition Test would be suspicious of such a dramatic, articulate moment. Instead, the test values mundane, sustained behaviors. The film might be suggesting that true humanity is revealed in quiet, accumulated moments rather than grand gestures.

