prompt: |-
  You are a professional political philosopher with research expertise in the ethics of war, political obligation, and the morality of political membership. Please think carefully and map out the conceptual space before committing to a line: I want the structure of the argument, not a verdict, and I'd rather be told that a practice is a mess of bolted-together principles than be handed a tidy story. Concretely: first brainstorm the candidate theories, then test each against the details below, then tell me what the practice strictly needs versus what it merely sits well with. I don't want citations or suggestions for further reading — no sources, please; just the argument in roughly 900 to 1,200 words, under headings.

  I'm finishing a master's in public law in Helsinki and write an amateur blog on Finnish defence policy, and doing my own service (plus watching friends opt for civilian service instead) got me stuck on a bundle of things that modern states do which I can't fit into one picture. First, the state compels: Finland's Constitution provides for universal male conscription, the standard tours run 165, 255 or 347 days, women may volunteer (as they have been able to since 1995) but are not drafted, and civilian service is fixed at twelve months — longer than the shortest military tour, so that the conscientious objector isn't excused but re-assigned a differently shaped and heavier burden; refusing both routes means prison, commonly about 173 days with no parole. Second, the state forbids: Britain has had a statute since 1870 making it an offence for a British subject to enlist in the armed forces of a foreign state at war with a state Britain is at peace with, and the general pattern of restricting or punishing one's own citizens fighting for someone else is widespread, even where the cause is one the citizen sincerely believes is just and even where the citizen's own state never fires a shot. Third, the state recruits foreigners: France's Foreign Legion enlists non-citizens, lets a legionnaire apply for French nationality after three years' service, or immediately if he is wounded in the line of duty — the provision known as "Français par le sang versé" — and in current wars states openly advertise for foreign volunteers. So the very same act — going to fight, kill and risk death in someone's war — is a crime for the citizen who travels to do it, a route into membership for the foreigner who arrives to do it, and a jail-backed duty for the citizen who would rather not do it at all. My friend in civilian service put it to me like this: if the state really believed this was about defending persons in peril, it wouldn't care which flag you fought under; and if it's really about membership, then the Legion's rule looks like membership earned by spilling blood rather than a duty owed by members — which seems to invert the whole justification.

  Two further wrinkles, one real and one hypothetical, that I think should discriminate between the theories. The real one: reserve liability means the state keeps a dormant claim on the conscript's body and labour for decades after the tour ends, triggering it unilaterally and paying sub-market compensation, while employers are legally constrained in how they treat a reservist; and Sweden's nominally compulsory system, gender-neutral on paper since 2010 and reactivated in 2017, in practice calls up only a small fraction of the age cohort from a screened and largely self-selected pool. The hypothetical one: a working group here has floated letting a conscript discharge his obligation by funding a stipend for a trained volunteer — possibly a non-citizen recruited abroad — to take his slot, so that trained headcount stays constant while the personal duty is commuted into money; and a related proposal would attach the obligation to residence rather than citizenship, or express the state's claim as a defence levy payable in service, in cash, or in some mix.

  So here is what I'm asking for. Give me a menu of the theories this bundle could be resting on — something like a membership or co-authorship view, a state-as-agent-of-a-collective-self-defence view, a just-cause or cosmopolitan view, a statist view on which neutrality and the control of violence belong to the state, a fair-share or burden-distribution view, maybe a view on which universal liability is a hedge or a deterrent rather than a way of raising headcount — and for each say which limbs of the bundle it licenses, which it condemns as unjustified, and whether it makes the limbs cohere with one another or leaves them in tension. Be explicit about where the practice is underdetermined, i.e. where several incompatible theories would license exactly the same institutions, so that nothing about the surface of the law settles which theory is in play. Then take the commutation proposal and the residence-based proposal as probes: does the existing institution strictly presuppose that the duty is personal, in-kind and non-fungible, or is that merely a contingent fit, and would the proposals preserve or destroy whatever the institution is for — distinguishing, please, the rationale of maintaining trained numbers from the rationale of universal liability as a signal to potential aggressors? Finally, say what would actually have to change in law and in the institution's self-understanding if the implicit theory were replaced by a just-cause view on which only the justice of the war and individual liability matter, or by a pure fair-share view on which service is one burdensome input among others. If you think some limb of the bundle is simply unjustifiable on every theory you can construct, say that plainly rather than smoothing it over.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex bundle of state practices around military service that seem contradictory on the surface: conscription for citizens, prohibition of foreign enlistment, and recruitment of foreign fighters. They want the conceptual architecture mapped without premature conclusions.

  First, I need to identify the core tensions: 
  - Compulsion (Finland's male conscription with longer civilian alternative)
  - Prohibition (UK-style bans on fighting for foreign causes)
  - Recruitment (French Foreign Legion offering citizenship through service)
  - Plus reserve liabilities and Sweden's selective implementation

  The user's friend captures the paradox well: if defense is about protecting people, why restrict which flag you fight under? If membership creates duties, why award membership through fighting?

  I'll categorize candidate theories by their core principles:
  1. **Political Membership/Obligation View**: Grounded in reciprocity between individual and state. Explains conscription as duty of membership but struggles with citizenship-for-service exchanges.
  2. **Collective Self-Defense View**: Focuses on group survival imperative. Justifies conscription but makes foreign enlistment bans look arbitrary when the cause is just.
  3. **Neutrality/Sovereignty View**: Prioritizes state monopoly on violence. Cleanly prohibits foreign enlistment but can't explain why states recruit foreigners themselves.
  4. **Fair-Share Distribution View**: About equitable burden-bearing. Explains resentment over unequal service lengths but conflicts with allowing commutation payments.
  5. **Deterrence/Signaling View**: Universal liability as preventive measure. Makes sense of reserves and selective conscription but can't justify prohibiting foreign fighting.

  Now testing against specifics:
  - Conscription length disparity: Fair-share view condemns it; deterrence view might accept it as necessary evil.
  - Foreign enlistment ban: Sovereignty view embraces it; just-cause view rejects it when the cause is just.
  - Legion citizenship: Membership view inverts duty/reward; collective defense view sees it as pragmatic.

  The commutation proposal acts as an acid test:
  - If service is personal duty (membership view), commutation corrupts the obligation.
  - If it's about manpower (deterrence view), paying substitutes is functionally equivalent.
  - Residence-based obligation would implode membership-based theories but fit fair-share views.

  Key underdetermined areas:
  - Sweden's selective conscription could fit deterrence or practical capacity theories equally.
  - Reserve systems are compatible with both collective defense and deterrence rationales.

  Replacing foundational theories would require radical changes:
  - Adopting pure just-cause view would mean permitting foreign enlistment in just wars.
  - Pure fair-share view would make civilian service length equal to military tours.

  Finally, the French "sang versé" rule and Finland's civilian service penalty appear unjustifiable on any coherent theory - they're historical artifacts bolted onto contradictory frameworks.

  The response should maintain rigorous neutrality while exposing these fault lines, exactly as requested. No smoothing over contradictions.
answer: |-
  ## Conceptual Mapping of Military Service Obligations: Theories, Tensions, and Probes

  **Candidate Theories and Their Fit with the Bundle**

  1.  **Political Membership / Co-Authorship View:**
      *   **Core:** Obligations (including defense) arise from membership in a specific political community bound by shared institutions, history, and reciprocal duties. The state embodies this community. Service is a core duty of membership; refusing it undermines the foundation.
      *   **Licenses:** Universal male conscription (membership duty), reserve liability (ongoing membership tie), prohibition on foreign enlistment (disloyalty to one's own community), prison for refusal (sanction for violating core membership obligation).
      *   **Condemns/Struggles With:** Awarding citizenship *for* service (Français par le sang versé). This inverts the logic: membership creates the duty to spill blood, not bloodshed creating membership. Female non-conscription (unless justified by different societal roles, not membership status) creates tension. Civilian service penalty undermines the "duty of membership" purity.
      *   **Coherence/Tension:** Strong coherence on compulsion, prohibition, reserves. Major tension with citizenship-for-service recruitment. The membership view struggles to explain why *joining* the community requires bloodshed as an entry ticket rather than triggering subsequent duties. Sweden's selective call-up is pragmatically justified but sits uneasily with the universality implied by membership duty.

  2.  **State as Agent of Collective Self-Defense View:**
      *   **Core:** The state's primary role is ensuring the survival and security of the political community it governs. It possesses unique legitimacy and capacity to organize lethal force for this purpose. Obligations stem from the existential need for defense.
      *   **Licenses:** Conscription (necessary manpower), reserve systems (maintaining latent capacity), recruiting foreigners (augmenting defensive capacity), prohibition on foreign enlistment (depleting potential defensive manpower/resources, potentially aiding enemies).
      *   **Condemns/Struggles With:** The civilian service penalty (punitive length unrelated to defense need). Awarding citizenship for service *could* be justified as incentivizing capacity, but the "sang versé" rule (immediate citizenship for wounding) prioritizes individual sacrifice over collective need efficiency. The prohibition on fighting for a just foreign cause clashes if the citizen's absence doesn't harm home-state defense.
      *   **Coherence/Tension:** Coheres well around the *need* for force generation and control. Tensions arise with the *form* of obligations (penalty for objectors, citizenship rewards) and the absolute prohibition on foreign enlistment even when home defense is unaffected. Sweden's model fits pragmatically.

  3.  **Neutrality & Monopoly of Violence (Statist) View:**
      *   **Core:** The state's legitimacy rests partly on its monopoly over the legitimate use of violence within its territory and its authority to represent the community externally (neutrality/sovereignty). Individuals lack authority to wage private wars or act as freelance combatants.
      *   **Licenses:** Prohibition on foreign enlistment (preserving neutrality, preventing private individuals from entangling the state, upholding monopoly). Conscription (state exercising its monopoly right to organize violence). Reserve liability (state maintaining latent control).
      *   **Condemns/Struggles With:** Recruiting foreigners (undermines monopoly by outsourcing violence to non-members? Though state control mitigates). Awarding citizenship for service (irrelevant to monopoly). Civilian service penalty (unrelated to monopoly principle). Sweden's selectivity (doesn't inherently violate monopoly).
      *   **Coherence/Tension:** Provides the *clearest* justification for prohibiting citizens fighting for foreign causes: it's about state control and preventing unauthorized violence, *not* the cause's justice or membership duties. Struggles to explain conscription's *distribution* (why not just professionals?) or citizenship incentives. Coheres prohibition with state-organized violence, but leaves other limbs underdetermined.

  4.  **Fair-Share / Burden-Distribution View:**
      *   **Core:** Defense is a collective good demanding shared sacrifices. The obligation is to bear a fair share of the necessary burdens of providing security, which could take various forms.
      *   **Licenses:** Universal liability *in principle* (aiming for fairness). Compensatory mechanisms (like commutation proposals). *Potentially* civilian service as an alternative burden. Sweden's system *if* perceived as fair by the community.
      *   **Condemns/Struggles With:** The civilian service penalty (inherently unfair, imposes a *greater* burden on objectors). Female non-conscription/gender imbalance (unless convincingly justified). Reserve liability (if perceived as imposing unique, ongoing burdens disproportionately). Prohibition on foreign enlistment for just causes (if the individual isn't shirking a domestic burden). Recruiting foreigners for citizenship (could be seen as "buying" out of burdens or unfair access).
      *   **Coherence/Tension:** Directly condemns the most glaring unfairness (civilian service penalty). Makes sense of proposals like commutation or residence-based levies. Struggles profoundly with the *prohibition* on foreign enlistment (why prevent someone from bearing a burden elsewhere?) and the *duty* aspect of conscription (it becomes a tax-like obligation). Sweden's model creates inherent fairness questions.

  5.  **Deterrence / Signaling View:**
      *   **Core:** Universal liability is less about raising immediate manpower and more about signaling resolve and capacity to potential aggressors. The credible threat of mass mobilization deters attack. Maintaining a large, trained reserve is key.
      *   **Licenses:** Universal conscription liability (the signal), reserve systems (maintaining the latent threat), Sweden's *model* (universal liability on paper, selective training - maintains the deterrent signal while managing costs). *Potentially* the prohibition on foreign enlistment (preventing depletion of the reservist pool).
      *   **Condemns/Struggles With:** The civilian service penalty (weakens the signal by making avoidance possible, albeit costly; reduces the trained military pool). Recruiting foreigners (irrelevant or potentially diluting to the national deterrent signal). Awarding citizenship for service (irrelevant to deterrence). Commutation proposals (could undermine the universality of the *liability* signal if widespread).
      *   **Coherence/Tension:** Best explains the persistence of *universal liability* schemes (like reserves) even when standing armies are professional. Makes sense of selective implementation (Sweden). Fits poorly with the actual *form* of punishment for refusal or the citizenship incentives. The prohibition on foreign enlistment is only weakly justified (manpower retention).

  **Underdetermination in Practice:**
  *   **Reserve Liability:** Compatible with Membership (duty endures), Collective Self-Defense (maintaining capacity), Deterrence (signaling latent force), and even a strained Fair-Share view (ongoing burden). The law alone doesn't specify the rationale.
  *   **Sweden's Selective Model:** Compatible with Collective Self-Defense (practical manpower needs), Deterrence (maintaining universal liability signal with efficient training), and Fair-Share (if deemed a fair way to distribute the *actual service* burden). The "universal liability on paper" is key for Deterrence, less so for the others.
  *   **Prohibition on Foreign Enlistment:** Strongly determined by the Neutrality/Monopoly view. Weakly compatible with Collective Self-Defense (manpower retention) and Deterrence (reservist retention). Directly contradicted by a strong Fair-Share or Just-Cause-Cosmopolitan view. The law's existence doesn't reveal *which* rationale dominates.

  **Probes: Commutation and Residence-Based Obligation**

  1.  **Commutation Proposal (Pay for a Substitute):**
      *   **What the Practice Strictly Presupposes:** The Deterrence view and the Collective Self-Defense view *strictly presuppose* the need for actual trained military personnel ("trained headcount"). A personal, in-kind duty is essential to *generate* that headcount. Commutation preserves the headcount, satisfying the *manpower rationale* of both.
      *   **What is Merely Contingent:** The Membership view sees service as a *personal* duty of belonging; commutation destroys this non-fungible element. The Fair-Share view sees service as *one* fungible burden; commutation is perfectly acceptable (if regulated).
      *   **Deterrence Rationale (Universal Liability as Signal):** Commutation *threatens* this rationale. If liability can be easily bought off, the universality and credibility of the deterrent signal weakens. The state's claim becomes financial, not physical. Maintaining the *threat* of compulsion requires the *reality* of compulsion for some. Widespread commutation would destroy the deterrent signal. Limited, expensive commutation might preserve it while accommodating some.

  2.  **Residence-Based Obligation:**
      *   **Destroys:** The Membership view (obligation stems from political status, not mere presence). The Deterrence view *might* be weakened if permanent residents are less reliable reservists or less committed to national defense.
      *   **Preserves/Aligns With:** The Collective Self-Defense view (those residing within the territory benefit from its defense and can contribute). The Fair-Share view (burden falls on those benefiting). The Neutrality view (state controls violence by those within its jurisdiction). The manpower rationale is preserved.
      *   **Coherence:** Makes the prohibition on resident foreigners leaving to fight for their home countries (or other causes) harder to justify on Membership grounds, but potentially easier on Neutrality or Collective Self-Defense grounds (retaining manpower/resources).

  **Theoretical Replacement: Required Changes**

  1.  **Adopting a Strong Just-Cause / Individual Liability Cosmopolitan View:**
      *   **Core:** Only the objective justice of a war and an individual's responsibility (e.g., for defending innocents) matter. State boundaries are largely irrelevant to the permissibility of fighting.
      *   **Required Changes:**
          *   **Repeal Foreign Enlistment Bans:** Citizens/residents could fight for any genuinely just cause abroad.
          *   **Reform Conscription:** Compulsion could only be justified for wars meeting stringent just-cause criteria. Objection rights would broaden significantly. Universal liability for *unjust* wars is indefensible.
          *   **Undermine Reserve Systems:** Ongoing liability for unspecified future conflicts becomes highly problematic if those conflicts' justice is unknown.
          *   **Radically Alter Legion-Style Recruitment:** Citizenship couldn't be earned by service in *any* French war, only those deemed just by the individual or a cosmopolitan standard. The "sang versé" rule becomes perverse (rewarding participation irrespective of cause).
          *   **Self-Understanding Shift:** The state ceases to see itself as the sole legitimate arbiter of when its members can fight. Defense is about protecting persons/justice, not the state *qua* state.

  2.  **Adopting a Pure Fair-Share View:**
      *   **Core:** Service is one costly input for producing security. The obligation is to contribute an equivalent burden-share, fungible with other forms of contribution (tax, alternative service).
      *   **Required Changes:**
          *   **Equalize Burdens:** Civilian service must be equal in duration/hardship to the *shortest* military tour. A significant penalty is unjustifiable.
          *   **Implement Commutation:** A market-based or state-set fee for hiring substitutes becomes a core mechanism.
          *   **Reform Reserves:** Reserve duties must be compensated at market rates or commutable. Unique burdens on employers/reservists must be minimized or compensated.
          *   **Re-examine Prohibition:** If an individual fulfills their fair-share obligation (e.g., pays a high defense tax), prohibiting them from fighting elsewhere for a just cause becomes hard to justify, unless it demonstrably harms domestic security manpower needs.
          *   **Self-Understanding Shift:** Military service loses its privileged status as a unique duty of membership or sacrifice. It becomes analogous to paying a high-risk occupation tax. The focus shifts to quantifying and equalizing burdens.

  **The Unjustifiable Limb:**

  The **civilian service penalty** (specifically imposing a *longer* period than the *shortest* military service option) is the bundle's most glaring point of incoherence. It is:
  *   **Condemned by Fair-Share:** It's inherently disproportionate and unfair.
  *   **Condemned by Collective Self-Defense/Deterrence:** It actively *discourages* a segment of the population from contributing to the *military* manpower pool needed for defense or deterrence, and the longer service is unrelated to security output.
  *   **Condemned by Membership:** If service is a core duty, allowing an alternative at a punitive cost undermines the duty's importance; it becomes a penalty for conscience.
  *   **Condemned by Neutrality:** It's irrelevant to the monopoly of violence.
  *   **Weakly Defended (if at all):** Only a highly punitive, deterrent-focused view of enforcing compliance with state demands could *attempt* justification, but this conflicts with the rationale for having an alternative service at all. It appears primarily as a historical artifact expressing disapproval of conscientious objection, bolted awkwardly onto systems primarily justified on other grounds. Its persistence reflects political or cultural compromise, not theoretical coherence.
