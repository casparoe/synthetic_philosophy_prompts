prompt: |-
  Hi — I cover science and ideas for a magazine (mostly long features, but I also do the final copy pass on freelance pieces a few times a week), and I keep having the same argument with our fact-checker. She wants every sentence hedged into mush; I think roughly half our sentences say "shows" where the study really just got one specific prediction to come out right, and another half say "is consistent with" where the result actually did knock out a live alternative. My friend, who's a physicist, says all hedging is cowardice and that we should print "shows" whenever the authors do, which I'm pretty sure is wrong. What I want isn't a lecture on the philosophy of science — it's something I can paste into our house style guide and actually run.

  Here's the shape I have in mind, and tell me if it's the wrong shape: a ladder of evidential verbs we're allowed to use in copy (something like "shows," "strongly supports," "supports," "is consistent with," "does not rule out," "cannot distinguish between"), plus a short ordered set of tests for picking the highest rung a sentence is allowed to sit on. The tests should be the ones that decide whether the evidence is actually doing any discriminating work: what exactly the account predicted ahead of time, versus a story fitted to the data afterward; whether that prediction was the kind that could easily have come out the other way; whether getting the result required background assumptions the data itself can't check (how the instrument behaves, the measurement model, the statistical model, assumptions about the sample) — I gather there's a name in philosophy for that problem but I can never remember it, so don't bother naming it, just build the step; and, the one I care most about, whether some rival account fits the published numbers about as well. On that last one I've started sorting rivals into what I call "live" ones (a competent person in the field would actually defend it) and "zombie" ones (logically compatible with the data, but nobody would seriously hold it) — because I don't want to hedge every sentence just because some skeptical scenario is logically possible, and I also don't want to write "shows" when the field genuinely has two accounts that fit the same data. Tell me if that split is doing the wrong work, or if I need a third bucket: I keep hitting cases where the rivals are distinguishable in principle but only by an experiment nobody will fund, and cases where the thing being "tested" is a whole framework rather than a claim, so any single study can only ever be consistent or inconsistent with it.

  Constraints: it has to run in about ten minutes at copy-desk stage, by someone with no philosophy training who then has to sign off on the sentence, mostly from the paper itself since the freelancer is often unreachable; and I want it honest about which steps are judgment calls wearing a lab coat. Please say explicitly where the procedure just stops with a no (you may not use a stronger verb, full stop) and where it hands the decision to a human because the trade-off is about values — how much we'd rather over-hedge than over-claim, and so on. Then run it on three cases: (1) a preprint, 120 people recruited online, scores on a psychological scale correlated with how often they shared a false headline, written up by the authors as confirming a motivated-reasoning account over a "people just can't tell what's true" account; (2) a large randomized trial that found no difference between two diets on some biomarker, with a press release saying the trial "refutes" the theory the diets were based on; and (3) a piece I wrote myself last spring (details invented, the structure is what matters) in which I said that a new set of genetic results "confirmed" the leading account of how a population recolonized a region after a bottleneck, and a colleague later pointed out that a second account fits the same data about as well. I'd especially like to know whether the procedure tells me to downgrade that last one, because if it does I have to go tell my editor and eat a correction, and I'd rather not. Last thing: say plainly what the procedure can't do — I don't want anyone on staff walking away thinking that a sentence passing these tests means the study was any good.
reasoning: |-
  Okay, let me tackle this science editor's problem. They're dealing with a fact-checker who wants everything hedged into oblivion, while they believe some findings deserve stronger language. They want a practical ladder of verbs with clear tests to choose the right one, not philosophical debates. 

  First, I need to understand their core frustration: the disconnect between scientific nuance and readable science writing. Their proposed solution - a verb ladder with decision rules - makes sense. But I should verify if that's truly the best format. Maybe a flowchart? No, they specifically asked for a ladder with tests, so I'll stick to that structure.

  The key challenges they outlined are spot on: distinguishing pre-registered predictions from post-hoc storytelling, assessing how easily results could've differed, evaluating background assumptions, and handling rival explanations. Their "live vs zombie" distinction seems useful - it prevents both over-hedging against absurd alternatives and under-hedging when legitimate competing theories exist. Though that "distinguishable in principle but unfunded" scenario needs consideration - maybe add a "dormant rival" category?

  For implementation, the 10-minute constraint is brutal. The procedure must be: 1) scannable 2) operable with just the paper 3) usable by non-philosophers. I'll need clear stopping points ("hard no") and judgment call flags. The values trade-off transparency is crucial - where we explicitly say "here's where editorial policy decides."

  Testing against their three cases: 
  1) The psych preprint likely maxes out at "supports" due to correlational design and possible confounds. 
  2) The diet trial claiming "refutes" is overreach - "undermines" or "challenges" fits better since other explanations exist. 
  3) Their own "confirmed" genetic claim needs downgrading if a live rival exists - painful but necessary.

  Biggest risk is staff misusing this as a quality seal. Must emphasize: this only assesses verb strength, not study validity. Bad methods still yield bad science, even if correctly described as "is consistent with."

  The philosophy term they forgot is probably "underdetermination" - but naming it won't help their team, so I'll skip the label as requested. Instead, I'll build the test: "Could plausible alternatives fit the data?" with the live/zombie/dormant filters.

  Final structure should be: 
  - Verb ladder with definitions 
  - Step-by-step eligibility tests 
  - Explicit "judgment call" markers 
  - Case applications 
  - Limitations disclaimer
answer: |-
  Here’s a practical, executable **Evidential Verb Ladder** for your style guide, designed for speed and clarity. It includes tests to assign the strongest defensible verb, with explicit "HARD STOP" rules and judgment call flags. It addresses your "live vs. zombie rivals" framework and prioritizes discriminating power.

  ---

  ### **The Evidential Verb Ladder**  
  *(Strongest → Weakest)*  
  **SHOWS** → **STRONGLY SUPPORTS** → **SUPPORTS** → **CONSISTENT WITH** → **DOES NOT RULE OUT** → **CANNOT DISTINGUISH**  

  #### **Rules for Assignment**  
  *(Run top-down; stop at the first verb that passes all tests)*  
  1. **Is the claim a *pre-registered, quantitative prediction*?**  
     - ✅ YES: Proceed.  
     - ❌ NO: Downgrade verb by **one level** (e.g., "shows" → "strongly supports").  
     - *Why?* Post-hoc explanations are weaker evidence.  

  2. **Could the result *easily have been different* under the same account?**  
     - ✅ NO (e.g., p < 0.001, tight CI, robustness checks): Proceed.  
     - ❌ YES (e.g., p ≈ 0.05, wide CI, sensitivity issues): Downgrade verb by **one level**.  
     - *Why?* Fragile results imply less discrimination.  

  3. **Do *background assumptions* (instruments, stats, sampling) lack strong independent support?**  
     - ✅ ALL SUPPORTED (e.g., validated methods, established models): Proceed.  
     - ❌ KEY ASSUMPTIONS UNCHECKED (e.g., novel algorithm, untested model): Downgrade verb by **one level**.  
     - *Why?* Unverified assumptions weaken inference.  

  4. **Are there *live rival accounts* that fit the data ≈ equally well?**  
     - ✅ NO LIVE RIVALS (only "zombies"): Proceed to **verb assignment**.  
     - ❌ LIVE RIVAL EXISTS: **HARD STOP** → Use **"consistent with"** or weaker.  
     - **Rival classification guide**:  
       - **LIVE**: Competent experts defend it; published in credible journals.  
       - **ZOMBIE**: Logically possible but unsupported (e.g., "aliens did it").  
       - **DORMANT** (your third bucket!): Distinguishable *in principle* but not yet tested (e.g., unfunded experiment). → **Downgrade verb by one level** (e.g., "shows" → "supports").  
     - *Why?* Rivals mean the data doesn’t uniquely support one account.  

  5. **Is the claim about a *broad framework* (e.g., evolution, quantum mechanics)?**  
     - ✅ NO (specific mechanism/testable claim): Proceed.  
     - ❌ YES: **HARD STOP** → Max verb = **"consistent with"**.  
     - *Why?* Frameworks aren’t "shown" by one study.  

  ---

  ### **How to Run (10-Minute Protocol)**  
  1. **Identify the claim** in the sentence (e.g., "Study shows diet X lowers cancer risk").  
  2. **Grab the paper’s Results/Discussion**: Find the key evidence supporting the claim.  
  3. **Run Tests 1–4** using only the paper (or preprint/SI). No philosophy degree needed.  
  4. **Stop at first downgrade/HARD STOP**. Assign verb.  
  5. **Judgment call flags**:  
     - Test 4 (live rivals) and Test 3 (assumptions) require *editorial judgment*.  
     - Default stance: **Prefer under-claiming**. When unsure, downgrade.  

  ---

  ### **Case Applications**  
  **Case 1: Preprint on motivated reasoning**  
  - Claim: "Shows motivated reasoning (not ignorance) causes sharing false headlines."  
  - Test 1: ❌ Likely not pre-registered (common in psych preprints). → Downgrade to "strongly supports."  
  - Test 2: ✅ p-values small, but correlational. → Proceed.  
  - Test 3: ❓ Assumptions (e.g., scale validity)? Unclear → Downgrade to "supports."  
  - Test 4: ❌ "Can’t tell truth" is a LIVE rival (defended in literature). → **HARD STOP** → Use **"consistent with"**.  
  - **Final verb: "is consistent with"**  

  **Case 2: Diet trial "refutes" theory**  
  - Claim: "Refutes theory that diet X alters biomarker Y."  
  - Test 1: ✅ Null result was primary outcome? → Proceed.  
  - Test 2: ✅ High power, tight CI around null → Proceed.  
  - Test 3: ✅ Standard methods → Proceed.  
  - Test 4: ❓ Are there LIVE rivals? E.g., "dose too low," "wrong biomarker." → **HARD STOP** if rivals exist.  
  - **Judgment call**: Null results rarely "refute" whole theories (alternatives explain failure). → Max verb = **"strongly supports rejection of [specific mechanism]"** or **"undermines"** (not "refutes").  

  **Case 3: Your genetic "confirmation" claim**  
  - Claim: "Confirmed leading account of population recolonization."  
  - Test 1: ✅ Prediction likely quantitative → Proceed.  
  - Test 2: ✅ Strong stats → Proceed.  
  - Test 3: ❓ Model assumptions? (e.g., mutation rates) → If shaky, downgrade.  
  - Test 4: ❌ LIVE rival fits data ≈ equally well. → **HARD STOP** → **Downgrade to "consistent with" or "supports"**.  
  - **Verdict**: You must downgrade. "Confirmed" overclaims. Use **"supports"** or **"consistent with"** + note rivals.  

  ---

  ### **What This Procedure CAN’T Do**  
  ⚠️ **DO NOT WALK AWAY THINKING:**  
  - "Passing tests = Good science." Bad methods, p-hacking, or small samples survive these checks.  
  - "It covers all uncertainty." Some judgments (e.g., "live rival") are subjective and field-dependent.  
  - "It replaces expert review." Deep flaws (e.g., fraud, fatal confounders) require deeper scrutiny.  

  **Output is ONLY about verb strength** — not study quality, importance, or truth.  

  ---

  ### **Style Guide Snippet**  
  ```  
  **EVIDENTIAL VERBS**  
  Use the strongest verb that passes:  
  1. Pre-registered prediction?  
  2. Robust result (not borderline)?  
  3. Solid background assumptions?  
  4. No LIVE rivals?  
  5. Not testing a whole framework?  

  | Verb              | Use When                                                                 |  
  |-------------------|--------------------------------------------------------------------------|  
  | shows             | All tests pass; rivals are zombies.                                      |  
  | strongly supports | Mild issue (e.g., unchecked assumption).                                 |  
  | supports          | Weaker evidence (e.g., post-hoc, fragile).                               |  
  | consistent with   | LIVE rivals exist OR framework-level claim.                              |  
  | does not rule out | Null result with alternatives; weak evidence.                            |  
  | cannot distinguish | Data fits multiple accounts equally (e.g., underpowered).                |  

  **HARD STOPS**:  
  - LIVE rivals? → Max "consistent with".  
  - Framework claim? → Max "consistent with".  
  ```  

  This forces specificity, avoids mush, and bakes in scientific reasoning without philosophy jargon. For your Case 3: Yes, you need a correction — but framing it as "supports" maintains momentum while honoring uncertainty.
