prompt: |-
  Some colleagues and I sit on a committee that has to rule on whether novel engineered systems must be treated as alive for the purposes of a containment and research-ethics regime. So the account we adopt has to be one that can return a yes-or-no verdict about a particular thing at a particular time. Before we start reviewing candidate definitions, I want the specification.

  Write the desiderata that any adequate account of what it is to be alive would have to meet, each with the case or consideration that motivates it, and mark which you take to be non-negotiable and which are only preferences of a particular camp or artifacts of our regulatory purpose. The cases I want the list tested against: fire; a computer worm; a prion; a dormant bacterial spore and a desiccated tardigrade; a mule; a skin cell in culture; a siphonophore or a fungal mycelium, where it is unclear what the individual is; a virus that replicates only inside a host cell; and two hypotheticals of my own — a far-from-equilibrium chemical network that metabolizes, persists, and evolves, but has no individuated units at all, only a diffuse patch that grows and splits (call it a tessellate); and a chimera of a cell and a machine in which most of the free-energy transduction is done by a fabricated silicon component.

  I also want the distinctions an account must respect rather than collapse: alive versus organism versus part of a living thing versus product of life versus once-alive versus dormant versus never-alive; and whether being alive admits of degree.

  Then three things. Which two desiderata do you suspect cannot be jointly satisfied — I expect the general-enough-for-chemistry-we-have-never-seen requirement and the sharp-cutoff requirement are the ones that collide, and I want to know whether that collision is a defect in the definitional project or a sign that our committee has been given a purpose no definition can serve. Which single desideratum does the most work in excluding otherwise-popular definitions. And whether the requirement that a definition not presuppose what origin-of-life research is still trying to find out is a genuine constraint or an academic prejudice that a regulator should ignore. Keep it to the criteria and their cases; I can run the candidate definitions against the list myself.
reasoning: |-
  Okay, the user is part of a committee that needs to decide if engineered systems should be considered alive for containment and research ethics. They need a set of criteria to evaluate definitions of life. Let's break down their request.

  First, they mentioned specific test cases: fire, computer worm, prion, dormant bacterial spore and desiccated tardigrade, mule, skin cell in culture, siphonophore or fungal mycelium, virus, and two hypotheticals—tessellate and chimera. Each of these challenges different aspects of what might be considered life. For example, fire shows metabolism but lacks other features, while the tessellate has evolution without distinct individuals.

  They also want distinctions like alive vs. organism vs. part of a living thing, etc., and whether being alive has degrees. The user is concerned about a sharp yes/no verdict for regulatory purposes, which is tricky because some cases (like dormancy) might blur lines.

  The user suspects that being general enough for unknown chemistry and having a sharp cutoff might conflict. That makes sense because novel systems could have unconventional biochemistry, making it hard to fit them into a strict definition. The committee needs to decide if this conflict means the task is impossible or if it's a flaw in the approach.

  Another point is which desideratum excludes popular definitions. Metabolism-only definitions fail because of fire and computer worms. But homeostasis also excludes viruses and dormant cases. Evolution might be key but doesn't cover individual instances.

  The constraint against presupposing origins of life research is important. The committee shouldn't rely on unproven theories, but as regulators, they might need to prioritize operational criteria over theoretical purity. It's a balance between scientific rigor and practical decision-making.

  Deep needs: The committee likely needs a defensible, actionable framework to avoid arbitrary decisions. They might fear legal or ethical challenges if their definition is inconsistent. Unspoken needs include wanting clarity in borderline cases, ensuring safety without stifling innovation, and having a rationale that holds up under scrutiny.

  Also, the user might want to preempt disagreements within the committee by having well-motivated criteria. Highlighting non-negotiables (like metabolism, homeostasis, evolution) helps set a baseline, while preferences (like autonomy) allow flexibility. They need to justify rulings on novel systems like the tessellate or chimera, which don't fit traditional categories.

  In summary, the core challenge is balancing scientific comprehensiveness with regulatory practicality. The desiderata must handle edge cases clearly, even if it means some systems (like viruses or prions) are excluded. The conflict between generality and sharpness might be inherent, so the committee must accept that or seek alternative approaches, like tiered containment levels instead of binary alive/not-alive.
answer: |-
  Here is a specification of desiderata for your committee's "alive" definition, structured for your regulatory purpose and tested against your cases:

  **Core Desiderata (Non-Negotiable for Regulatory Verdict):**

  1.  **Metabolic Activity (Free Energy Transduction):** The system must *actively* maintain itself in a far-from-equilibrium state by processing energy and matter from its environment.
      *   *Motivation:* Excludes fire (passive oxidation), prions (static misfolded proteins), dormant spores/tardigrades (suspended activity), skin cells in culture (often dependent on external media, not autonomous), computer worms (no physical energy processing), and non-replicating viruses. Captures essential "work" of life.
      *   *Test Cases:* Includes bacteria (active), tessellate (if truly metabolic), chimera (if silicon component enables transduction). Excludes fire, prion, dormant states, skin cell (arguably), virus (outside host), computer worm.
      *   *Non-Negotiable:* Yes. Fundamental to distinguishing persistent disequilibrium.

  2.  **Homeostasis & Self-Maintenance:** The system must regulate its internal state against environmental perturbation to maintain organization critical to its persistence.
      *   *Motivation:* Distinguishes life from decaying non-equilibrium systems or simple replicators. Excludes fire (no internal regulation), prion (no response), simple computer worm (no internal state maintenance), arguably skin cell in culture (limited autonomy). Includes dormant states (preserved organization reactivatable).
      *   *Test Cases:* Includes bacteria, active tessellate, chimera (if self-regulating), dormant spore/tardigrade (latent organization). Excludes fire, prion, computer worm.
      *   *Non-Negotiable:* Yes. Essential for persistence and individuality.

  3.  **Evolutionary Potential (Population-Level):** The system must be part of, or capable of generating, a lineage subject to heritable variation and natural selection *under some conditions*.
      *   *Motivation:* Excludes mules (sterile), individual skin cells (barring artificial cloning), fire, prions (replication is error-prone templating, not selection on variation), computer worms (selection is artificial, not inherent). Captures open-ended adaptability key to biology. Includes viruses (within host), dormant states (potential realized upon activation), tessellate.
      *   *Test Cases:* Includes bacteria, viruses (within lineage), spores/tardigrades, siphonophore/mycelium components, tessellate. Excludes mule, skin cell (individual), fire, prion, computer worm (arguably - lacks *inherent* selection).
      *   *Non-Negotiable:* Yes. Addresses persistence over time and novelty. Crucial for ethics (evolving risks).

  4.  **Sharp Individual/System Demarcation (Regulatory Pragmatism):** The definition must allow identification of a **specific, bounded system** at a **specific time** as the subject of the "alive" verdict. "Being alive" is a property of *that system* then.
      *   *Motivation:* Regulatory necessity. Requires clear containment subject. Challenges siphonophores/mycelium (modularity), tessellate (diffuseness), viruses (host-dependence), chimeras (integration level).
      *   *Test Cases:* Forces clarity on siphonophore (is it the zooid or colony?), mycelium (hypha or network?), tessellate (the patch?), virus (only active virion+host complex?), chimera (the integrated unit?).
      *   *Non-Negotiable:* Yes. Foundational for your committee's mandate.

  **Important Distinctions Required:**

  *   **Alive vs. Organism:** "Alive" is the core property set. "Organism" implies a specific, typically cohesive, bounded *form* that is alive (e.g., a bacterium, tardigrade). A siphonophore zooid might be an organism; the colony might be alive but not a single organism. Tessellate may be alive but not an organism.
  *   **Alive vs. Part:** A skin cell is part of a living thing (if in a body) but not itself alive *as an independent regulatory subject* under a strict definition. Requires Desideratum 4.
  *   **Alive vs. Product:** Prions, oxygen (from photosynthesis), shed skin cells are products, not alive. Requires metabolic activity (D1) & bounded system (D4).
  *   **Alive vs. Once-Alive:** A dead bacterium, a corpse. Requires current metabolic activity (D1) and homeostasis (D2).
  *   **Alive vs. Dormant:** Dormant states (spores, tardigrades) are *latently alive* – they possess the *potential* to reactivate all core functions and are organized for this. They meet D2 (latent homeostasis/preservation) and D3 (evolutionary potential), but not D1 *currently*. Regulatory treatment may differ, but they warrant special consideration distinct from "never-alive."
  *   **Alive vs. Never-Alive:** Fire, prions, rocks, simple computer programs.
  *   **Degrees of "Aliveness"?** For a regulatory *verdict*, **no degrees**. The core desiderata (1-4) must be met sufficiently for a "yes" at a specific time for a specific system. However, *complexity*, *autonomy*, and *resilience* exist on spectra. Dormancy is a distinct state (latent life), not "less alive."

  **Preference/Context-Sensitive Desiderata:**

  5.  **Autonomy (Minimal):** The system should have a non-trivial degree of operational independence from its immediate environment for core functions.
      *   *Motivation:* Preferred by some camps to exclude viruses (host-dependent for replication/metabolism) and potentially highly engineered chimeras/symbionts. Captures intuition of "self-directedness."
      *   *Test Cases:* Excludes free viruses (needs host), arguably some symbionts or highly integrated chimeras. Includes bacteria, tessellate (if self-contained), active tardigrades.
      *   *Non-Negotiable?* **No.** Highly contentious. Viruses/chimeras might meet D1-4. Regulatory need might focus on function/risk over philosophical autonomy.

  6.  **Material Agnosticism (Novel Chemistry):** The definition should not presuppose specific biochemical machinery (DNA/RNA, proteins, carbon-based).
      *   *Motivation:* Essential for novel engineered systems (tessellate, chimera) and origin-of-life research. Future-proofing.
      *   *Test Cases:* Must include tessellate and chimera if they meet D1-D4, regardless of silicon components or novel chemistry.
      *   *Non-Negotiable?* **Operationally Yes** for your purpose (novel systems), but less critical for defining *known* life. A strict requirement.

  7.  **Origin-Independence:** "Being alive" is a property of the *current state and capacities* of the system, not its origin (natural vs. engineered, abiogenesis vs. descent).
      *   *Motivation:* Essential for engineered systems (chimera, tessellate). A synthetic bacterium meeting D1-D4 is alive.
      *   *Test Cases:* Must treat a synthetic bacterium or tessemble identically to a natural one if states/capacities match.
      *   *Non-Negotiable?* **Yes** for your purpose.

  **Suspected Irreconcilable Desiderata:**

  *   **Conflict:** **Material Agnosticism (6) + Evolutionary Potential (3) + Sharp Individual Demarcation (4)** vs. **Practical Regulatory Verdict (Sharp Cutoff)**.
      *   *Why:* Truly novel chemistries (tessellate) or integration levels (chimera, complex symbioses) might meet D1-D4 in ways that stretch our concepts of "individual system" (D4) or "heritable variation" (D3) beyond clear recognition. Does a diffuse, splitting chemical patch *have* individuals? Does variation in a silicon-based network constitute "heritable" in a biological sense? Enforcing a sharp verdict (Yes/No) on such borderline cases might be arbitrary.
      *   *Nature of Collision:* This is **primarily a defect in the definitional project** when applied to extreme novelty, *exacerbated* by the regulatory need for a sharp cutoff. However, **it does not mean the purpose is impossible**. For the vast majority of cases (natural life, many engineered systems), a definition based on D1-D4 *can* provide clear verdicts. The committee must be prepared for difficult borderline judgments on *truly* novel systems like the tessellate, acknowledging the definition's limits there. The conflict highlights that "life" is a cluster concept; the definition provides necessary conditions, but borderline cases exist.

  **Desideratum Doing the Most Exclusion Work:**

  *   **Evolutionary Potential (3)** excludes otherwise popular definitions focusing only on metabolism/replication/homeostasis.
      *   *Why:* It excludes mules (sterile), individual somatic cells (like skin cells in culture - no independent lineage potential), and arguably highly specialized obligate symbionts with no evolutionary future outside their host. It forces consideration of the system's place in a lineage capable of change, which is central to biology and long-term risk/ethics, but is not a property of an individual *at a single time* in the same way metabolism is.

  **The Origin-of-Life Research Constraint:**

  *   **Genuine Constraint, but Manageable:** Requiring the definition **not to presuppose unresolved origins mechanisms** (e.g., "based on self-replicating molecules like RNA") is crucial and **not mere prejudice**.
      *   *Why:* A definition for *current* "alive" status (your task) must be based on observable *properties and capacities*, not historical pathways or necessary precursors, which are still being investigated. Defining life *as we know it now* operationally (D1-D4) is distinct from explaining how it *arose*.
      *   *Regulator's Perspective:* **Ignore the *origin pathway* but rigorously apply the *state/capacity* criteria (D1-D4).** Focus on "Does this system, *now*, exhibit these core processes?" not "Could this system have arisen naturally?" The constraint prevents circularity and allows evaluation of synthetic systems. It *is* essential for your purpose.

  **Summary for Committee Use:** Evaluate candidate definitions rigorously against **D1-D4 (Non-Negotiable Core)**. Use **D5 (Autonomy)** cautiously, recognizing it reflects a preference. **D6 (Material Agnosticism)** and **D7 (Origin Independence)** are critical operational requirements for your specific task involving novel systems. Be prepared for challenging verdicts on the tessellate and complex chimeras/symbioses due to the inherent tension between novelty and sharp demarcation. The requirement to avoid presupposing origins is valid and practical for regulation.
