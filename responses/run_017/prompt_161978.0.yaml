      Then:
          - If any critical condition: "don't ship"
          - Else if any non-critical condition: "ship with conditions"
          - Else: "ship"

  VI. Running the Procedure on Examples:

      Example 1: BizScore (threshold)
          - Deployment: threshold.
          - Data: group imputed (75% accuracy), 40% of labels imputed.
          - Results:
              * FNR: within one point (so difference <1% point) -> passes (we set tolerance 5%).
              * FPR: one group declined at twice the rate -> so FPR for group A is say 10% and group B 20%? Then absolute difference 10% -> >5% -> condition.
              * Calibration: one group is fine, the other is not -> condition.
              * Disparate impact: we don't have the approval rates, but if FNR is equal and the base rates of repayment differ, then approval rates might differ. We must compute.

          Let's assume:
              Group A (nonprotected): 
                  - Approval rate: 60% (so 40% declined)
                  - FPR: 10% (so among those who would repay, 10% are declined) -> false positives? Actually, FPR = P(decline | would repay). 
                  - But note: if they are declined, we don't know. So we use imputed. 
              Group B (protected):
                  - Approval rate: 70%?
                  - FPR: 20% (twice the rate) -> so difference 10% points.

          For disparate impact (80% rule):
              - Approval rate for protected (B) = 70%, nonprotected (A)=60%. 
              - Ratio = min(70/60, 60/70) = min(1.17, 0.857) = 0.857 -> 85.7% which is above 80% -> passes.

          So:
              - Disparate impact: pass.
              - FNR: pass (within 1%).
              - Calibration: fail for one group -> non-critical? 
              - FPR: fail (10% difference) -> non-critical? 

          Verdict: "ship with conditions" for calibration and FPR.

      Example 2: HardshipRank (ranking)
          - Deployment: ranking (fixed budget).
          - We must check:
              * Calibration: assume it passes? 
              * Disparate impact in selection: what fraction of the protected group is in the top 500? 
              - Eligible: 4000, protected group is say 1000 (25%).
              - In top 500: if the model is fair, we expect about 125? 
              - But if the protected group has a higher risk, it might be more. 
              - If we see only 50, then ratio: (50/1000) / (450/3000) = (0.05) / (0.15) = 1/3 = 0.33 <0.8 -> condition.

          But if calibration passes, then the ranking is by true risk? So why the disparity? 
              - It might be that the protected group has a lower base rate. 
              - So we must check the base rate? But we don't require base rate equality.

          Our procedure: 
              - If calibration passes and then the 80% rule fails, we still flag as condition: "disparate impact in selection".

          Verdict: "ship with conditions" (because it's critical? -> we defined disparate impact in ranking as critical? So "don't ship"?)

          But note: we defined for ranking: 
              - Calibration failure -> critical -> don't ship.
              - Disparate impact -> critical -> don't ship.

          So if we have disparate impact, then verdict: "don't ship".

          However, that might be too strict. We might not want to require proportional representation if the base rates differ. 

          Alternative: 
              - In ranking, we might not use the 80% rule? Instead, we require that the model is calibrated and then the allocation is based on merit. 
              - But the law might still require that the benefit allocation is not discriminatory. 

          Given the legal risk, we keep the 80% rule check and consider it critical.

      Example 3: AssistScore (input to human)
          - Deployment: input.
          - We check calibration: assume it passes.
          - FNR and FPR: assume they pass.
          - Then verdict: "ship".

          But the overrides cluster by branch. That might be due to human bias. 
          - However, we are only auditing the model. The model passed. 
          - We might add: "Recommend monitoring overrides by group to ensure fairness in the overall process."

          But that's not a condition on the model. So we might not include it in the verdict but as a note.

  VII. What the procedure cannot do:
      - It cannot resolve value judgments. For example, in threshold, if we have to trade-off FNR and FPR, we have a predefined policy (FNR is priority). But that policy is a value call. We assume the business has set that policy.
      - It cannot handle cases where the group membership is so noisy that the metrics are unreliable. We proceed with caution.
      - It cannot fix the fundamental trade-offs in fairness metrics. We choose one path (FNR parity in threshold) and the 80% rule.
      - It cannot audit the human part in the input deployment. We only audit the model.
      - It cannot validate the imputation models for group or labels. We rely on prior validation.

  VIII. Procedure Document:

      We write the procedure as a checklist.

      Note: This is a simplified version for practicality.

  Fairness Assessment Procedure for Model Risk Team

  0. Document model deployment type: 
     - [ ] Threshold (direct approve/decline)
     - [ ] Ranking (select top N)
     - [ ] Input (human makes final decision)

  1. Data Quality Note:
     - Note: Group membership imputed (approx 75% accuracy). Fairness metrics subject to error.
     - Note: For declined applicants, labels are imputed (if applicable). State the imputation rate: ______%. Metrics subject to error.

     If group imputation accuracy is known to be below 60%, issue condition: "Group imputation accuracy is too low. Fairness assessment may be unreliable." (non-critical)

  2. Branch by deployment type:

     A. Threshold Deployment:
          a. Disparate Impact (80% rule):
              - Compute approval rate for each group (using imputed groups).
              - Let r_min = min( approval_rate_group1, approval_rate_group2 )
              - Let r_max = max( approval_rate_group1, approval_rate_group2 )
              - Compute ratio = r_min / r_max
              - If ratio < 0.8, issue critical condition: "Disparate impact: approval rate ratio = {ratio*100}% (<80%). Must be reviewed by counsel for business necessity and less discriminatory alternatives."
          b. FNR Parity:
              - Compute FNR for each group (FNR = FN / (FN+TP)); use imputed labels for FN and TP (TP comes from approved and repaid).
              - Compute absolute difference |FNR_group1 - FNR_group2|
              - If difference > 5% points, issue critical condition: "FNR disparity: difference of {difference}% points. May cause unfair denials for one group."
          c. Calibration (by group):
              - For each group, compute:
                  * Average predicted risk (for the positive class) for the group.
                  * Actual event rate for the group (using available labels and imputed labels for declined).
              - Compute absolute difference |average predicted risk - actual event rate| for each group.
              - If for any group the difference > 5% points, issue non-critical condition: "Calibration issue for {group}: predicted {pred}% vs actual {actual}%."
          d. FPR Parity:
              - Compute FPR for each group (FPR = FP / (FP+TN)); FP: approved and defaulted, TN: declined and would have repaid (imputed).
              - Compute absolute difference |FPR_group1 - FPR_group2|
              - If difference > 5% points, issue non-critical condition: "FPR disparity: difference of {difference}% points. May cause unfair approvals for one group."

     B. Ranking Deployment (top N selection):
          a. Calibration (by group):
              - As in threshold, check calibration by group.
              - If for any group the calibration difference > 5% points, issue critical condition: "Calibration issue for {group}: predicted {pred}% vs actual {actual}%. Ranking scores are not comparable across groups."
          b. Disparate Impact in Selection:
              - Compute the selection rate (proportion selected) for each group in the top N.
              - Compute ratio = min(selection_rate_group1, selection_rate_group2) / max(...)
              - If ratio < 0.8, issue critical condition: "Disparate impact in selection: selection rate ratio = {ratio*100}% (<80%). Benefit allocation may be discriminatory."

     C. Input Deployment (human makes decision):
          a. Calibration (by group):
              - As in threshold.
              - If for any group the calibration difference > 5% points, issue critical condition: "Calibration issue for {group}: predicted {pred}% vs actual {actual}%. This may mislead loan officers."
          b. FNR Parity (model predictions):
              - As in threshold, but note: this is for the model's predictions, not the human decision.
              - If difference > 5% points, issue non-critical condition: "FNR disparity in model predictions: difference of {difference}% points. This may influence loan officers unfairly."
          c. FPR Parity (model predictions):
              - Similarly, if difference > 5% points, issue non-critical condition: "FPR disparity in model predictions: difference of {difference}% points."

  3. Verdict:
     - If any critical condition: "don't ship"
     - Else if any non-critical condition: "ship with conditions"
     - Else: "ship"

  4. Final Notes:
     - For Input deployment, regardless of conditions, add: "Recommend monitoring overrides by group and providing training to loan officers on the model's limitations."
     - For any deployment, if labels are imputed for declined applicants, add: "Fairness metrics are subject to error due to label imputation for declined applicants."

  IX. Example Runs:

      Example: BizScore (threshold)
          - Step 0: Threshold
          - Step 1: Note group imputation (75%) and label imputation (40%).
          - Step 2A:
              a. Disparate impact: approval rate ratio=85.7% -> pass.
              b. FNR: difference <1% -> pass.
              c. Calibration: one group fails -> non-critical condition.
              d. FPR: difference 10% -> non-critical condition.
          - Verdict: "ship with conditions" (due to non-critical conditions).

      Example: HardshipRank (ranking)
          - Step 0: Ranking
          - Step 2B:
              a. Calibration: assume passes -> no condition.
              b. Disparate impact: ratio=33% -> critical condition.
          - Verdict: "don't ship"

      Example: AssistScore (input)
          - Step 0: Input
          - Step 2C:
              a. Calibration: passes.
              b. FNR: passes.
              c. FPR: passes.
          - Verdict: "ship"

          But add note: "Recommend monitoring overrides by group."

  X. Edge Case: A model that passes all checks but the deployment is high risk? 
      - We have covered by the checks.

  XI. Case with Unwanted Answer: 
      - HardshipRank: we get "don't ship" because of disparate impact in selection, even though the model is calibrated. This might be because the protected group has a lower base rate of the event. We don't want to withhold help from the nonprotected group to increase the representation of the protected group. 
      - But the procedure flags it as critical. This forces a conversation: 
          * Counsel must decide if the disparate impact is justified by business necessity (which in this case is to help the neediest) and if there is a less discriminatory alternative. 
          * The procedure does not decide, it flags. 
      - We might adjust the procedure for ranking: remove the disparate impact check? But then we might miss true discrimination. 
      - Alternative: only check for under-selection of the protected group? And use a one-sided 80% rule? 
          - The 80% rule we used is symmetric. But in law, it's usually for protected group. 
          - We should do: 
              r_protected / r_nonprotected >= 0.8
          - If r_protected is 5% and r_nonprotected is 15%, then 5/15=0.33<0.8 -> fail.

      We keep it as is. The verdict "don't ship" forces the business to justify the model to counsel.

  This procedure provides a clear, ordered checklist that can be followed in one analyst-day. It accounts for deployment type, noisy groups, and imputed labels. It outputs a verdict and conditions, and it flags critical issues that require immediate attention.
answer: |-
  Below is a fairness assessment procedure designed for your constraints: fixed-order questions, clear thresholds, deployment-specific branching, and explicit value calls. It prioritizes auditability over philosophical completeness, with built-in stops for noisy data or unfalsifiable metrics. The procedure outputs one of three verdicts: **Don't Ship**, **Ship with Conditions**, or **Ship**.

  ---

  ### **Fairness Assessment Procedure**  
  *Execute steps in order. Stop at first "Don't Ship" or "Value Call Required". Use 5% absolute difference as default tolerance for disparities.*

  #### **Step 0: Deployment Type Branch**  
  *Select one:*  
  - **A. Threshold Screen** (e.g., approve/decline)  
  - **B. Ranking w/ Fixed Budget** (e.g., top-N selection)  
  - **C. Human Input Only** (e.g., loan officer override)  

  #### **Step 1: Data Quality Gate**  
  *Answer all:*  
  1. Is group membership imputation accuracy ≥70%?  
     - **No** → *Don't Ship* (Noisy groups invalidate metrics)  
     - **Yes** → Proceed.  
  2. Are >30% of labels in the test set imputed?  
     - **Yes** → *Don't Ship* (Unfalsifiable outcomes)  
     - **No** → Proceed.  
  3. Are group-wise sample sizes <100?  
     - **Yes** → *Don't Ship* (Insufficient power)  
     - **No** → Proceed.  

  #### **Step 2: Calibration Check**  
  *For all deployment types:*  
  - Calculate observed vs. predicted default rate by group (binned by risk decile).  
  - **Failure**: >5% absolute difference in any bin for any group.  
    - *Consequence*:  
      - If **A or B** → *Don't Ship* (Core reliability failure).  
      - If **C** → *Ship with Conditions*: "Require human override for miscalibrated groups."  

  #### **Step 3: Deployment-Specific Fairness**  
  *Branch based on Step 0:*  

  - **A. Threshold Screen**:  
    1. Check **FNR Parity** (equal opportunity):  
       - |FNR<sub>Group1</sub> - FNR<sub>Group2</sub>| ≤ 5%?  
         - **No** → *Don't Ship* (Unacceptable denial bias).  
         - **Yes** → Proceed.  
    2. Check **FPR Parity**:  
       - |FPR<sub>Group1</sub> - FPR<sub>Group2</sub>| ≤ 10%?  
         - **No** → *Ship with Conditions*: "Monitor FPR bias quarterly; max 10% tolerance."  
         - **Yes** → Proceed to Step 4.  

  - **B. Ranking w/ Fixed Budget**:  
    1. Check **Selection Parity**:  
       - |% of Group in top-N - % of Group in eligible pool| ≤ 5%?  
         - **No** → *Value Call Required*: "Is disparity justified by need? (e.g., higher-risk group deserves more slots?)"  
           - *Document answer from CRO/Counsel*.  
         - **Yes** → Proceed.  
    2. Check **Harm of Equalization**:  
       - Would forcing parity require excluding ≥10% of the highest-risk applicants?  
         - **Yes** → *Don't Ship* (Ethical failure: withholding help for fairness theater).  
         - **No** → Proceed to Step 4.  

  - **C. Human Input Only**:  
    1. Check **Override Rate Parity**:  
       - |Override rate<sub>Group1</sub> - Override rate<sub>Group2</sub>| ≤ 5%?  
         - **No** → *Ship with Conditions*: "Audit branch-level override patterns; report in 90 days."  
         - **Yes** → Proceed to Step 4.  

  #### **Step 4: Final Sign-Off**  
  - **All deployment types**:  
    - If no prior stops: *Ship*.  
    - Attach single-number summary: **Max group disparity % from Steps 2-3** (e.g., "FNR diff: 1.2%").  

  ---

  ### **Application to Your Cases**  
  #### **BizScore (Threshold Screen)**  
  - **Step 1**: Labels 40% imputed → *Don't Ship* (Fails Data Quality Gate).  
  - *Why?* Imputed outcomes for 40% of sample make fairness metrics unfalsifiable.  

  #### **HardshipRank (Ranking w/ Fixed Budget)**  
  - **Step 0**: Branch to **B**.  
  - **Step 2**: Assume calibration holds (not specified).  
  - **Step 3B.1**: If selection disparity >5% → *Value Call Required*.  
    - *Example*: If eligible pool is 30% Group X, but only 15% of selected are Group X, CRO must justify if this reflects true need.  
  - **Step 3B.2**: If forcing parity would exclude high-risk applicants → *Don't Ship*.  
    - *Procedure forces auditing of "fairness theater."*  

  #### **AssistScore (Human Input Only)**  
  - **Step 0**: Branch to **C**.  
  - **Step 2**: If calibration holds → proceed.  
  - **Step 3C.1**: Override rates vary by branch → *Ship with Conditions*: "Audit branch-level overrides."  
    - *Procedure flags the human process, not the model.*  

  ---

  ### **What This Procedure Can't Do**  
  1. **Resolve fairness trade-offs**:  
     - When FNR/FPR can't both be equal, you *must* prioritize FNR (Step 3A). This is a **value call** codified in the procedure.  
  2. **Fix noisy/imputed data**:  
     - Step 1 stops the process if data quality is too poor (e.g., BizScore).  
  3. **Replace human judgment**:  
     - Ranking deployments require explicit justification of disparities (Step 3B.1).  
  4. **Audit humans directly**:  
     - For human-override models (e.g., AssistScore), it only checks for *differential* patterns.  

  ### **Example of Unwanted Outcome**  
  - **HardshipRank** might require *Don't Ship* if forcing parity excludes high-risk applicants. This prevents "fairness-washing" but may block deployment. The procedure forces this trade-off into the open.  

  ### **Why This Works for Your Context**  
  - **Survives simplification**: Drops theoretical purity (e.g., no PV parity) for auditable checks.  
  - **Legal/risk alignment**: Single-number output (Step 4), clear stops for data flaws.  
  - **Time-efficient**: Avoids open-ended analysis; focuses on binary outcomes.  

  --- 
  **Final Verdict Workflow**: Run the procedure → Output verdict → Counsel/CRO own all value calls.  
  This shifts arguments from "which metric?" to "does it pass the checklist?" – which is settled by data, not volume.
