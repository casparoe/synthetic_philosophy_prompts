answer: |-
  Below is a systematic restatement of moral uncertainty in your specified ecological decision-theoretic vocabulary. Gaps and imports are explicitly marked (**[GAP]** or **[IMPORT]**), and unresolvable tensions are labeled. The estate case serves as the testbed throughout.

  ---

  ### **One: Candidate Answers in Ecological Vocabulary**
  *(Frameworks: model averaging, robust satisficing, value of information)*

  1. **"My-Favourite-Theory" Rule**  
     - *Translation:* **Single-model optimization**. Select the act maximizing choice-worthiness under your highest-posterior-weighted moral theory. Ignores model uncertainty.  
     - *Probabilities:* From subjective model weights (e.g., posterior probabilities of theories being "true"). **[IMPORT: Assumes truth-aptness of moral theories.]**  
     - *Tool analogue:* Ignoring model discrepancy in a single best-fit model.  

  2. **Maximize Expected Choice-Worthiness (MEC)**  
     - *Translation:* **Model-averaged optimization**. Maximize the expectation of choice-worthiness across the ensemble of moral theories, weighted by model probabilities.  
     $$ \text{Objective: } \max_{a} \sum_{i} w_i \cdot \text{CW}_i(a) $$  
     - *Probabilities:* Subjective weights (e.g., priors updated by coherence, intuitions). **[GAP: No ecological "data" for updating; weights lack empirical likelihoods.]**  
     - *Tool analogue:* Bayesian model averaging (BMA) with AIC weights.  

  3. **Variance-Averse MEC (Hedging Variants)**  
     - *Translation:* **Risk-averse model averaging**. Maximize a utility function combining expectation and variance of choice-worthiness (e.g., Wald's minimax regret, satisficing).  
     - *Objective:* e.g., Minimax regret: $\min_{a} \max_{i} \left( \max_{a'} \text{CW}_i(a') - \text{CW}_i(a) \right) w_i$  
     - *Tool analogue:* Robust satisficing under deep uncertainty. Prioritizes acts that perform acceptably across all theories.  

  4. **Deep Uncertainty Framework**  
     - *Translation:* **Info-gap robustness**. Satisfice a minimum choice-worthiness threshold across theories while maximizing robustness to uncertainty in model weights.  
     - *Objective:* $\max_{a} \, \text{Robustness}(a)$, where $\text{Robustness}(a)$ = max tolerance of weight shifts before $\text{CW}_i(a) < \text{threshold}$ for any theory.  
     - *Probabilities:* None. Uses only ordinal rankings and feasibility sets.  
     - *Tool analogue:* Info-gap decision theory for unbounded uncertainty.  

  ---

  ### **Two: Estate Case Analysis**
  *(Confronting normalization and menu-dependence)*  

  | **Act**               | **Theory 1: Total Welfare** | **Theory 2: Priority to Worse-Off** | **Theory 3: Special Obligations** | **Theory 4: Non-Anthropocentric** | **Meta-Theory: Moral Uncertainty** |
  |------------------------|-----------------------------|-------------------------------------|-----------------------------------|-----------------------------------|------------------------------------|
  | Wetland restoration    | Medium (e.g., 0.5)          | Low (e.g., 0.2)                     | High (e.g., 0.8)                  | Very High (e.g., 1.0)             | Choice-worthiness varies           |
  | Global health charity  | Very High (e.g., 1.0)       | Very High (e.g., 1.0)               | Low (e.g., 0.1)                   | Low (e.g., 0.0)                   | Choice-worthiness varies           |
  | Niece inheritance      | Low (e.g., 0.1)             | Medium (e.g., 0.4)                  | Very High (e.g., 1.0)             | Low (e.g., 0.0)                   | Choice-worthiness varies           |

  - **Normalization Required**  
    - *Unit-range rule:* Rescale each theory’s CW so $\text{max}_a \text{CW}_i(a) - \text{min}_a \text{CW}_i(a) = 1$.  
    - *Unit-variance rule:* Rescale each CW to variance = 1 across acts.  
  - **Disagreement Example:**  
    - Under unit-range, wetland may dominate if Theory 4 has high spread.  
    - Under unit-variance, charity may dominate if Theory 1 has low variance.  
  - **Menu-Dependence Test:**  
    - Add "burn the money" (CW=0 for all theories):  
      - *Unit-range:* Rescaling changes if "burn" is new min. Charity may lose if its CW was min.  
      - *Unit-variance:* Rescaling changes; charity may gain if it had low variance.  
    - **[GAP: Both rules are menu-dependent.]**  
    - *Ecological verdict:* **Defect in aggregation method**. In ecology, BMA uses fixed scales (e.g., log-likelihoods). Moral CW lacks invariant units. **[IMPORT: Assumes commensurability across theories.]**  

  ---

  ### **Three: The Role of Data**  
  *(What updates model weights?)*  
  - **"Out-of-sample test" analogue:** None. Moral theories lack predictive empirical likelihoods (e.g., no "system" to test against).  
  - **Updating weights:** Philosophers use "coherence" (e.g., fit with intuitions) or peer disagreement. No equivalent to observing $y_{\text{obs}}$ to compute $P(y_{\text{obs}}|M_i)$.  
  - **Consequence:**  
    - Model weights express **commitment strength**, not truth probability.  
    - **[RESIDUE GRADE B: Distorted translation.]** The framing is **decorative** for expectation-based rules (MEC) but functional for robust satisficing (weights define uncertainty sets).  

  ---

  ### **Four: Fixed Point (Meta-Theory Inclusion)**  
  *(Aggregating a theory about aggregation)*  
  - **Problem:** If the meta-theory (e.g., "maximize expected CW") is in the ensemble, its CW depends on the aggregated output.  
  - *Ecological analogue:* Recursive model weighting (e.g., a model predicting which model is best).  
  - **Solution in your vocabulary:**  
    - Treat the meta-theory as a **structural model** outside the ensemble. Use it to weight others but exclude self-referential loops.  
    - **[GAP: Arbitrary exclusion.]**  
  - **Alternative:** Iterative convergence (e.g., seed with uniform weights, compute meta-CW, reweight, repeat).  
    - *Fixed-point check:* May not converge uniquely. In estate case, meta-theory’s CW for acts depends on weights, which depend on CW.  
  - **Verdict:** **Confusion from mixing levels**. First-order theories and meta-theory belong to distinct model classes.  

  ---

  ### **Five: Residue Report**  
  *(Grading translation fidelity)*  

  | **Claim/Debate**                     | **Grade** | **Translation Status** | **Notes** |
  |--------------------------------------|-----------|-------------------------|-----------|
  | Aggregating across theories          | A         | Clean                   | Direct analogue to model averaging. |
  | Model weights as probabilities       | C         | Untranslatable          | No likelihoods or updating mechanism. Weights are sensitivity parameters, not posteriors. |
  | Normalization of CW scales           | B         | Distorted               | Unit-range/unit-variance are arbitrary. No ecological analogue for unitless moral "values." |
  | Robust satisficing under uncertainty | A         | Clean                   | Info-gap robustness applies directly. |
  | Truth-aptness of moral theories      | C         | Untranslatable          | **[YOUR SUSPICION CONFIRMED]** No "real system" for moral truth → averaging lacks epistemic justification. Becomes purely decision-theoretic. |
  | Value of information                 | B         | Distorted               | VoI requires probabilities and observables. Moral "data" (e.g., intuitions) lack resolution. |

  - **Key Residue Insight:**  
    The untranslatable elements **indict the moral debate**, not your vocabulary. Moral uncertainty frameworks borrow decision-theoretic tools but lack:  
    - Empirical content (no "system" to model),  
    - Stable scales (no natural units for CW),  
    - Updating mechanisms (no "data" to shift weights).  
    - **[CONCLUSION]** The debate conflates *decision-making under ambiguity* (where your tools excel) with *philosophical justification* (where they do not apply). Your vocabulary exposes this by forcing explicit **[GAP]** markers.  

  ---

  **Summary Output for Estate Case (Illustrative):**  
  - **MEC (unit-range):** Global health charity (if welfare theories dominate weights).  
  - **Robust satisficing:** Wetland restoration (if min CW across theories > threshold).  
  - **Sensitivity check:** Rank reversal when adding "burn money."  

  **Final Note:** The unresolvable gaps are **foundational**, not technical. They reveal that moral "model averaging" is a heuristic for coherent action, not inference toward truth. Your vocabulary succeeds by forcing these gaps into the open.
