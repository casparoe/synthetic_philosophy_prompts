  ### Final Rules Writeup

  **Game Title**: Brinkmanship Challenge

  **Objective**: Win disputes by making your opponent back down before catastrophe occurs.

  **Materials per Pair**:
  - One escalation ladder card (showing rungs, names, catastrophe thresholds).
  - One d20.
  - Index cards and pens for commitments.
  - Player sheets for tracking points.

  **Setup**:
  - Each player starts with 100 points.
  - The escalation ladder is fixed (as above).

  **Before Each Round**:
  1. Players can buy (with points) for that round only:
     - **Public Commitment**: Pay 2 points. Announce to the opponent: "I will not back down before Rung k" (choose k from 1 to 5). During the round, you cannot back down until at or above rung k.
     - **Secret Commitment**: Pay 1 point. Write on an index card: "I will not back down before Rung k" (choose k), seal it (fold and staple), and give to facilitator. Binding like public, but only you and facilitator know.
     - **Temperament Label**: Pay 3 points. Choose either "Reckless" or "Cautious" and announce it publicly. (This is just a label; you can act as you wish.)

  2. The facilitator announces the stake for the dispute (10 points for trivial block, 100 points for catastrophic block).

  **Gameplay**:
  - Start at Rung 0.
  - Players take turns (randomly decide who starts). On your turn, you must choose one:
    - **Escalate**: Move up one rung. Then, roll the d20. If the roll is **equal to or greater than** the threshold for the new rung, catastrophe occurs. If not, the turn passes to the opponent.
    - **Back Down**: Concede. Your opponent wins the stake (and you get nothing for the dispute). The round ends.

  - If catastrophe occurs:
    - In trivial block: both players lose 5 points, and the dispute is unresolved (no one gets the stake).
    - In catastrophic block: both players lose 50 points, and every other player in the room loses 50 points. The dispute is unresolved.

  - A player with a commitment (public or secret) cannot back down when below their committed rung k. At or above k, they can choose to back down.

  **Glitch Round**:
  - In one catastrophic round (announced at the start of the block that one round will have a glitch, but not which one), when the conflict reaches Rung 2, the facilitator forces an escalation to Rung 3 (and then we roll for catastrophe at Rung 3). This happens regardless of the players' actions at Rung 2.

  **Scoring**:
  - Winning a dispute: +stake points.
  - Backing down: 0 (but doesn't lose points except for catastrophe penalties).
  - Catastrophe: both lose penalty points (and in catastrophic block, everyone else too).

  **Blocks**:
  1. Trivial Stakes Block (3 rounds per pair):
     - Stake: 10 points.
     - Catastrophe penalty: 5 points per player (only the pair).

  2. Catastrophic Stakes Block (3 rounds per pair):
     - Stake: 100 points.
