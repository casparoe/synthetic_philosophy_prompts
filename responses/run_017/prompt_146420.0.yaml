  - The complexity of multiple parties.

  We'll be explicit about these in debrief.

  ### Final Note
  This design is ambitious for two hours with 14 people. We might run over time. We can cut the number of rounds? Or run only one round per block per pair? But then we don't see reputation building. Alternatively, we can have each block be one round per pair? But then we have less data.

  We'll stick to 3 rounds per block but keep them short by removing the "hold" option and requiring immediate action.

  We hope that the game will create the intuitive understanding of the dynamics. Good luck!
