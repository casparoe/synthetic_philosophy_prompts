  ### **Brinkmanship Game: "Edge of the Abyss"**  
  **Designed for 12-16 players, 2 hours, using index cards, d20, whiteboard, and pen.**  
  **Goal:** Create visceral intuition for nuclear deterrence dynamics (credible threats, rationality of irrationality, accidental catastrophe) through gameplay, without pre-lecture.  

  ---

  ### **Rules & Setup**  
  **Core Mechanics:**  
  - Players form pairs ("nations") disputing a stake (points).  
  - **Escalation Ladder:** 5 rungs (R0–R4). Each rung increases the risk of catastrophe.  
  - **Catastrophe:** Triggered by d20 roll. Fails if roll ≤ risk number (e.g., roll ≤ 3 at R3 = 15% risk).  
  - **Stakes:** Two blocks—**Trivial** (personal points) and **Catastrophic** (points + group penalty).  
  - **Commitments/Temperament:** Players buy pre-game actions to limit choices or signal resolve.  

  **Materials:**  
  - **Whiteboard:** Track ladder (see table below) and player points.  
  - **Index Cards:** For commitments (pre-written by facilitator).  
  - **d20:** For catastrophe rolls.  
  - **Player Sheets:** Track points, commitments, temperament.  

  #### **Escalation Ladder (Whiteboard)**  
  | Rung | Name            | Risk # (d20 ≤ #) | Catastrophe Prob |  
  |------|-----------------|------------------|------------------|  
  | R0   | Standoff        | 0                | 0%               |  
  | R1   | Threaten        | 1                | 5%               |  
  | R2   | Mobilize        | 2                | 10%              |  
  | R3   | Show of Force   | 3                | 15%              |  
  | R4   | Brink           | 4                | 20%              |  

  **Catastrophe Outcome:**  
  - **Trivial Block:** Both players lose 10 points.  
  - **Catastrophic Block:** Both lose 50 points + **all other players** lose 25 points.  

  ---

  ### **Game Sequence (2 Hours)**  
  #### **0:00–0:15 — Setup & Practice Round (Trivial Stakes, No Extras)**  
  - **Groups:** Random pairs (6–8 pairs).  
  - **Stake:** 20 points (winner takes all).  
  - **Rules:**  
    1. Start at R0. Players alternate turns.  
    2. On your turn: **Escalate** (move up 1 rung → roll for catastrophe) or **Back Down** (opponent wins stake).  
    3. If catastrophe occurs, round ends (no winner, penalties applied).  
  - **Goal:** Learn turn flow. No strategy discussion.  

  #### **0:15–0:40 — Trivial Stakes Block (Personal Points)**  
  - **3 Rounds** (5 min/round + 5 min debrief between rounds).  
  - **Stake:** 30 points/round.  
  - **Pre-Round Buys (Before Each Round):**  
    - **Commitment Card (Cost: 5 points):** Secretly choose max rung before backing down (e.g., "No back down before R3"). *Sealed and given to facilitator.* Binding during round.  
    - **Temperament (Cost: 10 points):** Publicly choose **"Reckless"** (signal aggression) or **"Cautious"** (signal restraint). Purely symbolic.  
  - **Debrief Qs After Each Round:** *"Did commitments change behavior? Did temperaments influence opponents?"*  

  #### **0:40–1:15 — Catastrophic Stakes Block (Group Risk)**  
  - **3 Rounds** (7 min/round + 5 min debrief).  
  - **Stake:** 100 points/round.  
  - **Glitch Round (Round 2):**  
    - At start of block: *"There is a 1-in-4 chance of a system glitch forcing escalation when a pair reaches R2."*  
    - In Round 2, **all pairs** forced to escalate from R2 → R3 (no choice). Roll for catastrophe at R3.  
  - **Pre-Round Buys:** Same as Trivial Block.  
  - **Debrief Qs:** *"How did the group penalty change decisions? What happened in the glitch round?"*  

  #### **1:15–2:00 — Debrief & Concept Mapping**  
  - **Step 1:** Players share experiences.  
    - *"When did you feel trapped? When did a bluff work?"*  
  - **Step 2:** Introduce concepts using whiteboard:  
    | Game Moment          | Concept                     | Key Insight                                                                 |  
    |----------------------|----------------------------|-----------------------------------------------------------------------------|  
    | Buying commitment    | **Credible Threat**         | "Limiting your own options forces opponents to back down."                  |  
    | Choosing "Reckless"  | **Rationality of Irrationality** | "Signaling unpredictability can be rational if it deters challenge." |  
    | Glitch round         | **Brinkmanship Paradox**    | "Tripwires that deter attacks can cause disaster in false alarms."          |  
    | Catastrophic stakes  | **Stakes Scaling**          | "When catastrophe harms everyone, aggression decreases but isn't eliminated." |  
  - **Step 3:** Discuss limitations (see "What the Game Can't Capture" below).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Players treat it as pure EV calculation (e.g., "R3 risk is only 15%—I’ll escalate!").  
     - **Fix:** In debrief, contrast Trivial vs. Catastrophic blocks. Ask: *"Did probability feel different when others were at risk?"* Highlight real-world uncertainty.  

  2. **Problem:** Confusing "irrational" with "aggressive" (e.g., buying "Reckless" = must escalate).  
     - **Fix:** Pre-game clarify: *"Temperament is a signal. You can still act rationally."* Debrief: *"Did anyone fake recklessness?"*  

  3. **Problem:** Low-stakes round lacks tension (players escalate carelessly).  
     - **Fix:** Let it happen! Then contrast with catastrophic block: *"Why did you take R4 risks for 30 points but not for 100?"*  

  4. **Problem:** Glitch feels unfair ("Facilitator cheated!").  
     - **Fix:** Emphasize pre-game that glitches are possible. Debrief: *"Your tripwire caused catastrophe—could this happen in real deterrence?"*  

  ---

  ### **What the Game Can't Capture (Be Transparent in Debrief)**  
  1. **Uncertain Probabilities:**  
     - Real risk isn’t a known number on a card. Probabilities shift with technology, intelligence, and posture.  
  2. **Endogenous Risk:**  
     - Escalation itself changes risk (e.g., alert levels increase accident chances). Game fixes probabilities per rung.  
  3. **Domestic Politics:**  
     - Leaders face public/elite pressure. Game has no "audience" or internal factions.  
  4. **Multi-Actor Complexity:**  
     - Real deterrence involves allies, neutrals, and third parties. Game is binary (2 players).  
  5. **Psychological Weight:**  
     - Game points ≠ existential dread. *"Imagine the catastrophic block penalty is extinction."*  

  ---

  ### **Epistemic Notes**  
  **Confident This Works For:**  
  - Creating intuition for why credible threats require self-binding (commitments).  
  - Demonstrating the stakes/scaling effect (Trivial vs. Catastrophic blocks *will* show behavioral shifts).  
  - Making the brinkmanship paradox visceral (glitch round causes rage/regret).  

  **Less Confident About:**  
  - Whether 2 hours is enough for deep intuition. *Best effort:* Focus debrief on "felt experiences."  
  - Reputation building. Temperament signals may feel shallow without repeated play. *Mitigation:* Use debrief to discuss "How would reputation work over multiple crises?"  
  - Stakes manipulation test. *Risk:* Players might still escalate in catastrophic blocks if points feel abstract. *Fix:* Hammer group penalties ("You cost everyone pizza!").  

  **If Short on Time:**  
  - Skip practice round.  
  - Run 2 rounds/block (not 3).  
  - Trim debrief to 30 min.  

  ---

  ### **Materials Prep**  
  - **Index Cards (Pre-Written Commitments):**  
    - "I will not back down before R1" (Cost: 5)  
    - "I will not back down before R2" (Cost: 5)  
    - ... up to R4.  
  - **Whiteboard Setup:**  
    ```
    LADDER: R0 (0%) → R1 (5%) → R2 (10%) → R3 (15%) → R4 (20%)  
    POINTS: [Player1]: 100, [Player2]: 100, ...  
    ```  
  - **Player Sheets:**  
    ```  
    Name: __________  
    Points: ______  
    Temperament: [ ] Reckless (10) | [ ] Cautious (10) | [ ] None  
    Commitment: [ ] R1 | [ ] R2 | [ ] R3 | [ ] R4 | [ ] None  
    ```  

  **Run it, then hit them with the vocab:** *"What you just felt? That’s Schelling."*
