  **Debrief Outline**:
  1. Ask about experiences:
     - In trivial stakes, how did you play? Did you buy commitments? Did they work?
     - In catastrophic stakes, how did it feel? Did the knowledge that a catastrophe would hurt everyone change your behavior?
     - In the glitch round, what happened? Did commitments cause problems?

  2. Introduce concepts:
     - Brinkmanship: the art of pushing to the edge to force the opponent to back down.
     - Credible threat: How commitments made your threat to escalate more credible.
     - Rationality of irrationality: Buying a commitment to not back down (which seems irrational during the game) can be rational before the game because it deters the opponent.
     - The glitch: How a commitment (tripwire) designed to deter might cause disaster in a false alarm (the stability-instability paradox?).

