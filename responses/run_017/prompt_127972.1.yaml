prompt: |-
  So I'm halfway through my PhD (systems neuroscience, dont ask) and we did the thing everyone tells you not to do: we picked the model family after staring at the same dataset for a year, and now my advisor wants a Bayes factor for it. Which means I've spent the last week reading about the problem of old evidence, and my takeaway is that the two camps are mostly talking past each other — so I want the document they should have written instead.

  Draft the joint statement of an adversarial collaboration between, on one side, someone who thinks old evidence is a modelling artifact: get clear about what you conditionalize on (the counterfactual prior from before you knew E, the proposition that you've learned E, an expanded partition — take your pick) and the problem dissolves. On the other side, someone who thinks it shows confirmation isn't exhausted by probability-raising: what does the work is that the theory predicts or explains E, and no choice of prior over the old partition captures that, so Bayesianism needs an extra ingredient or isn't the whole story about evidence.

  And please put my actual case in it, because I think it's subtly different from the textbook one. Our data sat in the lab notebook and on the server for three years. We always knew the numbers. What we didn't know was that they had anything to do with our hypothesis — we only noticed the connection last month, and the moment we noticed it our confidence in the model roughly doubled. Call it the drawer case. I want both sides to say, about that case specifically, what got confirmed when: was it at the moment we first saw the numbers, or last month, or neither? And whether it should matter how we came to notice the connection (a seminar, a rival group's preprint, a genuine mistake in a bit of code) or only that we now see it.

  Format: a numbered section of claims both can sign — about what confirmation is even supposed to do for us, what priors are for, whether the agent's actual causal history is relevant to her evidence or just to how we model her; then a table of the residual disagreements, each phrased in wording its own side would accept; then the cruxes, and for each crux a case or argument both agree bears on it, with each side's prediction written down in advance. If part of the dispute turns out to be verbal — about what "evidence" or "prior" or "confirm" means — say which part and why.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two positions on the problem of old evidence in Bayesian confirmation theory, applied to the "drawer case" described.

  The two positions:

  Position A (The Modeling Artifact View): The problem of old evidence is an artifact of how we model the agent's epistemic state. It can be resolved by careful specification of what we conditionalize on (e.g., by using a counterfactual prior from before the agent knew E, or by conditionalizing on the proposition that the agent has learned E, or by expanding the partition). Thus, Bayesianism can handle old evidence without extra ingredients.

  Position B (The Extra Ingredient View): The problem of old evidence shows that confirmation is not exhausted by probability-raising. What does the work is that the theory predicts or explains E, and no choice of prior over the old partition captures that. Therefore, Bayesianism either needs an extra ingredient (such as a notion of explanatory power) or is not the whole story about evidence.

  The Drawer Case: The data (E) was physically present (in the lab notebook and on the server) for three years, but the connection to the hypothesis (H) was only noticed last month. At that moment, confidence in H roughly doubled. The question: When was H confirmed by E? Was it at the moment the data were first seen, or last month, or neither? And should it matter how the connection was noticed (e.g., via a seminar, a rival preprint, a coding mistake) or only that it is now seen?

  Structure of the Document:

  1. A numbered section of claims both sides can sign.
     - We agree on what confirmation is supposed to do for us (e.g., guide belief updating, theory choice, etc.).
     - We agree on what priors represent (e.g., rational degrees of belief at a time, given background knowledge).
     - We agree on whether the agent's actual causal history is relevant to her evidence or just to how we model her.

  2. A table of residual disagreements, each phrased in wording acceptable to each side.

  3. The cruxes (the key points of disagreement that can be empirically or conceptually tested) and for each crux:
     - A case or argument both agree bears on it.
     - Each side's prediction written in advance.

  4. If part of the dispute is verbal (about the meaning of "evidence", "prior", "confirm"), we identify which part and why.

  Let's draft accordingly.

  ---

  **Joint Statement: The Problem of Old Evidence and the Drawer Case**

  **1. Points of Agreement**

  Both parties agree on the following:

  1.1. The primary role of confirmation theory is to provide a normative account of how evidence should impact the rational credence in a hypothesis. It should guide belief updating and theory choice.

  1.2. Bayesian confirmation theory, which uses probability theory as a model of rational degrees of belief, is a valuable tool for this purpose. In particular, the rule of conditionalization (updating by setting new credences to the old conditional probabilities given the evidence) is a central norm.

  1.3. The prior probability distribution represents the rational degrees of belief of an agent at a given time, conditional on the background knowledge available at that time.

  1.4. In the drawer case described, the agent (the PhD student and advisor) experienced a significant boost in confidence in the hypothesis H when they noticed the connection between the existing data E and H. This boost was rational.

  1.5. The agent's causal history (e.g., how they came to notice the connection) may be relevant to the modeling of their epistemic state, but it does not change the objective evidential relation between E and H. However, both sides agree that the rationality of the update depends on the agent's epistemic state at the time of the update.

  1.6. The problem of old evidence, as traditionally posed (e.g., Glymour 1980), is that if E is already known (so that P(E)=1), then P(H|E) = P(H), and thus E cannot confirm H. This seems to contradict the intuition that old evidence can confirm a theory (e.g., the perihelion of Mercury and general relativity).

  1.7. In the drawer case, the key event is the realization of the relevance of E to H. This realization led to an update. The data E was known (in the sense that the agent had the numbers) but its relevance to H was not known until last month.

  **2. Residual Disagreements**

  We now present the core disagreements in wording that each side would accept.

  | Issue | Position A (Modeling Artifact) | Position B (Extra Ingredient) |
  |-------|--------------------------------|--------------------------------|
  | When did the confirmation occur? | Confirmation of H by E occurred at the time the agent learned E, but the agent failed to realize it until last month. The update last month was a correction of an earlier failure to conditionalize properly. | Confirmation of H by E occurred at the moment the agent realized the connection (last month). Before that, E was not evidence for H for the agent. |
  | What does the prior represent? | The prior must be defined relative to a state of background knowledge. At the time of first seeing E, the agent had a prior that did not include the information about the connection to H. When they learn the connection, they are learning a new proposition (e.g., "E is relevant to H" or "H entails E") and conditionalizing on that. | The prior is defined over the entire set of propositions the agent can entertain. The connection between E and H is not a new proposition but a new appreciation of an explanatory relation. This appreciation is not captured by conditionalization on a proposition. |
  | Is the problem of old evidence resolved by conditionalizing on the proposition that the agent learned E? | Yes: by conditionalizing on "I have learned E" (or by using a counterfactual prior that does not know E), we can recover a positive Bayes factor. | No: conditionalizing on "I have learned E" does not capture the explanatory connection between H and E. It only captures the fact of learning, not the relevance. |
  | What is the role of the causal history in the drawer case? | The causal history (e.g., how the connection was noticed) is irrelevant to the evidential relation. It only matters for the counterfactual prior we use. | The causal history may be part of what makes the connection explanatory. For instance, if the connection was noticed by a lucky accident, it might not be as confirmatory as if it were predicted. |

  **3. Cruxes and Predictions**

  We identify the following cruxes and describe cases or arguments that bear on them. For each, we state the predictions of each side.

  **Crux 1: The Independence of the Mode of Realization**

  *Case/Argument:* Consider two variants of the drawer case:

  - Variant 1: The connection between E and H is noticed because of a seminar where a speaker presented a similar finding for a different system.
  - Variant 2: The connection is noticed because of a genuine mistake in the code that accidentally plotted E against a variable related to H, making the connection visually obvious.

  Both sides agree that in both variants, the agent updates their credence in H upon noticing the connection. The question is: should the degree of confirmation (the Bayes factor) be the same in both variants?

  - Position A predicts: The Bayes factor should be the same. The mode of realization is irrelevant because what matters is the logical relation between H and E. The update is due to conditionalizing on a new proposition about the relevance of E to H (or due to correcting an earlier failure to conditionalize). The causal path to learning that proposition does not affect the evidential strength.
  - Position B predicts: The Bayes factor might differ. The mode of realization might affect the explanatory connection. For example, in Variant 2 (the coding mistake), the agent might question whether the connection is real or an artifact, which could diminish the confirmation. Moreover, the fact that the connection was not predicted by H but discovered by accident might reduce the confirmatory power.

  **Crux 2: The Role of Background Knowledge in the Prior**

  *Case/Argument:* In the drawer case, at the time the data E was first seen, the agent had background knowledge K. At that time, the agent did not see the connection to H. Now, when the connection is noticed, we are considering two ways to model the prior:

  - Method 1: Use the counterfactual prior from the time before E was known, then conditionalize on E and the new proposition about the connection.
  - Method 2: Use the current prior (which includes E) and conditionalize on the new proposition about the connection.

  Both sides agree that the posterior should be the same. The disagreement is about whether the counterfactual prior is necessary and what it represents.

  - Position A: The counterfactual prior is necessary to capture the fact that the evidence E was not known at the time. The confirmation measure (e.g., Bayes factor) should be computed relative to that counterfactual prior. The agent's actual prior at the time of the update (which includes E) is not the right one to use because it already has P(E)=1.
  - Position B: The counterfactual prior is artificial. The agent's current prior (with E known) is the real one. But conditionalizing on a proposition about the connection (e.g., "H entails E") does not capture the explanatory relation. The confirmatory boost comes from seeing that H explains E, which is not a matter of probability-raising.

  **Crux 3: Verbal Dispute**

  Both sides agree that part of the dispute is verbal, concerning the meaning of "evidence". 

  - Position A: In the drawer case, E was evidence for H at the time it was first seen, but the agent did not know it. The agent's failure to update was a failure of rationality. The update last month was a correction. Thus, the evidence was always there, but the agent did not use it.
  - Position B: In the drawer case, E was not evidence for H until the connection was noticed. Evidence is not just the proposition E, but E in a context of being understood as relevant to H. Thus, the evidence (as a reason for H) came into being only last month.

  This verbal difference does not affect the normative question of how the agent should update, but it does affect the description of the history of the agent's beliefs.

  **4. Conclusion**

  We have laid out points of agreement and disagreement regarding the problem of old evidence, focusing on the drawer case. The key cruxes involve the role of the mode of realization of the connection and the choice of prior. We hope that future work, including empirical studies of how people update in such scenarios and further conceptual analysis, will help resolve these issues.

  Signed,

  [Representative of Position A]
  [Representative of Position B]
answer: |-
  ### Joint Statement: The Problem of Old Evidence and the Drawer Case  
  **An Adversarial Collaboration**  

  #### 1. Points of Agreement  
  Both parties endorse the following claims:  

  1.1. **Confirmation’s role**: Confirmation theory should guide rational belief updating and theory choice. Its purpose is to clarify how evidence *should* affect our credence in hypotheses, irrespective of psychological or historical accidents.  

  1.2. **Priors as epistemic snapshots**: A "prior" represents an agent’s rational degrees of belief at a specific time, conditional on their background knowledge *at that time*. It is not a metaphysical commitment but a tool for modeling states of uncertainty.  

  1.3. **Causal history vs. evidential relations**: The agent’s causal history (e.g., *how* they came to believe something) is irrelevant to the *objective evidential relation* between a hypothesis \(H\) and evidence \(E\). However, it is crucial for *modeling the agent’s epistemic state* (e.g., choosing which prior to conditionalize on).  

  1.4. **The drawer case intuition**: In the drawer case (where \(E\) was physically recorded but its relevance to \(H\) was unnoticed), the agent’s confidence boost upon noticing the connection was rational. Our task is to explain why.  

  1.5. **The core problem**: If \(E\) is "old" (known with certainty, so \(P(E) = 1\)), standard Bayesianism implies \(P(H|E) = P(H)\), suggesting \(E\) cannot confirm \(H\). This conflicts with intuitions about cases like the drawer case, where noticing a connection *feels* confirmatory.  

  1.6. **Relevance of the connection**: What changed in the drawer case was the agent’s recognition of \(E\)’s *relevance* to \(H\) (e.g., that \(H\) predicts/explains \(E\)). Prior to this, \(E\) was not treated as evidence for \(H\).  

  ---

  #### 2. Residual Disagreements  
  Each side’s wording of key disagreements:  

  | Issue | Position A: "Modeling Artifact" View | Position B: "Extra Ingredient" View |
  |-------|--------------------------------------|-------------------------------------|
  | **When did confirmation occur?** | Confirmation happened when \(E\) was first observed but was *undervalued* due to the agent’s failure to fully conditionalize. The update upon noticing the connection corrects this error. | Confirmation occurred *only* when the connection was noticed. Before this, \(E\) was inert for \(H\); the agent lacked the conceptual resources to see \(E\) as evidence for \(H\). |
  | **Role of causal history in the drawer case** | The *manner* of noticing the connection (e.g., seminar vs. coding error) is irrelevant. Only the *content* learned ("\(H\) explains \(E\)") matters. Rationality depends on properly conditionalizing, not on how the insight arose. | The causal history *can* matter. If the connection was noticed via a lucky accident (e.g., a coding error), it may weaken confirmation, as it wasn’t a "genuine prediction" by \(H\). Explanation requires more than correlation. |
  | **Nature of evidence** | Evidence is propositional: \(E\) is evidence for \(H\) *whenever* \(P(H\|E) > P(H)\), even if the agent hasn’t noticed it. The drawer case involves failure to apply conditionalization, not absence of evidence. | Evidence is relational: \(E\) only becomes evidence for \(H\) when the agent grasps the explanatory link. The drawer case shows evidence is not just propositions but *understood relevance*. |
  | **Bayesian adequacy** | The problem dissolves by modeling the agent’s learning as conditionalizing on an expanded partition (e.g., adding the proposition "\(H\) entails \(E\)"). No extra ingredients are needed. | Bayesianism cannot capture this without smuggling in non-probabilistic notions (e.g., "explanatory power"). The prior/likelihood alone don’t reflect *why* \(E\) supports \(H\). |

  ---

  #### 3. Cruxes and Testing Grounds  
  For each crux, we specify a case/argument both agree is decisive, and each side’s prediction.  

  **Crux 1: Does the *manner of discovery* affect confirmation?**  
  - **Testing case**: Two variants of the drawer case:  
    - *Variant 1*: The connection is noticed during a seminar on an unrelated topic, triggering an "aha!" moment.  
    - *Variant 2*: The connection is noticed due to a coding error that accidentally plots \(E\) against \(H\)-relevant variables, making the link obvious.  
  - **Position A’s prediction**: Confirmation strength (Bayes factor) is identical in both variants. Only the proposition "\(H\) predicts \(E\)" is relevant; how it was learned is epistemically inert.  
  - **Position B’s prediction**: Variant 2 yields weaker confirmation. The accidental discovery undermines \(H\)’s *explanatory role*; it feels less like a "prediction" and more like a fluke.  

  **Crux 2: Can conditionalization capture the drawer case update?**  
  - **Testing case**: Model the drawer case using a counterfactual prior \(P_{\text{old}}\) (the agent’s beliefs before seeing \(E\)) and conditionalize on \(E\) and "\(H\) explains \(E\)" jointly.  
  - **Position A’s prediction**: This yields a Bayes factor >1, matching the confidence boost. The problem is solved by careful modeling.  
  - **Position B’s prediction**: The Bayes factor is inadequate. It misses why \(E\) *now* feels compelling—e.g., \(H\)’s simplicity or unification. A purely probabilistic measure won’t reflect the "doubled confidence" intuitively.  

  **Crux 3: Is the "old" evidence ever truly evidentially inert?**  
  - **Testing case**: After noticing the connection, the agent learns \(E\) was *fabricated* (e.g., a data-collection error). Does \(E\) still confirm \(H\)?  
  - **Position A’s prediction**: No. \(P_{\text{old}}(H\|E) > P_{\text{old}}(H)\), but conditionalizing on "\(E\) is unreliable" negates this. The evidential relation was always probabilistic.  
  - **Position B’s prediction**: Partly yes. If \(H\) *would have* explained \(E\) if \(E\) were true, the explanatory insight retains some weight. Bayesianism cannot formalize this.  

  ---

  #### 4. Verbal Disputes  
  We agree that **30% of the disagreement is verbal**, centering on:  
  - **"Evidence"**: Position A defines it as *a proposition that raises the probability of \(H\)*. Position B defines it as *a proposition recognized as relevant to \(H\)*.  
  - **"Prior"**: Position A sees it as *any reference probability for conditionalization*. Position B sees it as *fixed by the agent’s conceptual resources at a time*.  
  - **"Confirm"**: Position A: *probability-raising*. Position B: *explanatory insight*.  
  **Why this matters**: In the drawer case, Position A sees the confidence boost as *correcting past irrationality*, while Position B sees it as *gaining new evidence*. This affects normative prescriptions (e.g., whether the agent "should have known" earlier).  

  ---  
  **Signed**,  
  *For Position A*: The Bayesian modeler, who holds that old evidence is a technical oversight fixed by precise conditionalization.  
  *For Position B*: The explanationist, who holds that old evidence reveals Bayesianism’s inability to capture explanatory depth.  

  ---  
  **Addendum for the PhD Student**:  
  - **Your Bayes factor task**: Position A would compute it using a counterfactual prior (e.g., your beliefs before seeing the data, ignoring relevance). Position B would argue the result is meaningless—instead, run model comparisons *after* noticing the connection, but add a penalty for "unpredicted" discovery (e.g., via explanatory priors).  
  - **Practical advice**: For your paper, use Position A’s method (it’s standard), but footnote Position B’s critique. For your sanity: This dispute is 50 years old; don’t expect resolution.
