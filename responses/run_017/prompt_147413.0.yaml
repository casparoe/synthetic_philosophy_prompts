  **3. Key Uncertainties (4 sentences):**  
  I’m least certain about the **prevalence** of Type 3 defects in real-world ML debate. Experts might reasonably argue they’re rare outside synthetic benchmarks. I’m also unsure if the "scope shift" example is truly irreducible; some may see it as a chain of Type 2 errors. The speech implies Type 3 is *inherently* harder for debate, but a reasonable expert could believe better scaffolding (e.g., formal ontologies) mitigates it significantly. Finally, the optimism about "surfacing unease" is extrapolation — we don’t know if ML judges can reliably learn that signal.

