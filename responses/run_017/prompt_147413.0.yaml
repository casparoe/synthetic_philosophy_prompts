  ### **Title: The Hole in the Map: When Arguments Fail in Ways No One Can Point To**

  Good evening. I’m honored to be here, though my presence feels like inviting a cartographer to a conference on tectonic plates. My job is to sketch maps of arguments — to trace coastlines of evidence and mark pitfalls of bad reasoning. But you’re studying something deeper: the ground beneath the map itself. What if it shifts in ways no compass can detect?

  Let me start with a map that failed me. Years ago, a source handed me a 400-page technical annex. Every citation checked out. Every claim, line by line, was defensible. I spot-checked steps, found no lies, and published. Later, we learned it was profoundly wrong — not because any single step was false, but because a **term changed its meaning** somewhere between Section 2 and Section 7. The conclusion only *seemed* to follow because no human — not me, not the peer reviewers — could hold the whole edifice in mind at once. There was no line to circle. The flaw was everywhere and nowhere.

  That document taught me that bad arguments aren’t just wrong *at* points. They can be wrong *in the spaces between* points. And this — this gap between what we can *locate* and what we can *trust* — is where your work on debate and scalable oversight hits a nerve. Because if my trade rests on one idea, it’s this: **A literate outsider, given time and skepticism, can separate sound arguments from broken ones, even in a field they don’t master**. Your workshop asks: *Is that actually true? Or did I just get lucky?*

  I think the anxiety crystallizes around three kinds of defects — three ways an argument can break:

  1.  **The Localizable Glitch**: A step is provably wrong *on the page*. Like a bad line in a proof: "2+2=5." Anyone with the text, time, and basic tools can find it. Cross-examination wins here.  
  2.  **The Expertise-Gated Flaw**: A step is wrong, but *only a specialist* would catch it in minutes. The dishonest arguer aims precisely at the gap between "findable" and "findable-by-*this*-judge-in-*this*-minute." This is where debate gets noisy. When judges miss things not from laziness, but because expertise is scarce.  
  3.  **The Distributed Defect**: Nothing is "wrong" anywhere. The flaw is a **property of the whole**. A scope shift. A presupposition that only collapses after bearing weight four times. A conclusion that follows only if you forget what the terms meant at the start. My 400-page monster. Here, cross-examination has no move. There’s no step to attack.  

  Now, I’m an outsider. But from what I’ve seen, your debate experiments win big on Type 1 — localizable glitches. Machines catch clear lies faster than humans. That’s impressive! But Type 2 — expertise-gated flaws — is where the training signal gets murky. Can a judge *sense* when they’re out of their depth? Does the system learn to exploit that? And Type 3 — distributed defects — feels like uncharted territory. If the flaw isn’t *in* the steps but *in the path*, how does debate even begin to surface it?  

  This isn’t just an AI problem. It’s a **human institution problem**. My newsroom runs on distributed cognition. A reporter digs. An editor questions. A fact-checker verifies. We’re a human debate system! But sometimes, like with my 400-page report, we miss the scope creep — the slow drift in a term’s meaning — because no single mind held the whole chain. We failed politely, silently. No alarms sounded.  

  That silence is the real specter in this room. If scalable oversight relies on debate catching *all* critical flaws, but Type 3 defects evade judges — not by being hidden, but by being **amorphous** — then the method’s ceiling might be lower than we hope. Not because debate is broken, but because some errors are ghosts: real, damaging, and impossible to pin to a spot on the wall.  

  So where does that leave us? I won’t say debate scales. I won’t say it doesn’t. I’ll say this: **The hardest flaws to catch aren’t the ones that look wrong. They’re the ones that look right until the entire structure collapses.** My profession banks on the idea that sunlight disinfects. You’re stress-testing whether some germs thrive in daylight.  

  But journalism isn’t dead yet. Why? Because we don’t just debate — we *diversify*. We bring in specialists (like your philosophers). We let arguments collide over *time* (not just in one simulated exchange). We correct openly. We’re messy, human, and slow. And sometimes, we catch the distributed defect — not by finding the flaw, but by noticing the **unease** in the architecture. That unease is your signal. That’s what we’re leaning on when we say "trust the process."  

  Your challenge is to build systems that don’t just win debates, but **surface unease** — that flag when an argument coheres too perfectly, when terms might be drifting, when a judge *should* feel lost. That’s the frontier: not proving X or Y false, but detecting when the ground is about to swallow the map.  

  In this room are people running these experiments. To you I say: Your Type 1 wins are real. Celebrate them. But your Type 3 challenge is where the future hides. And to the philosophers poking foundations: Thank you. We need you. Because if distributed defects exist, they’re as much about language and epistemology as they are about code.  

  And to my fellow non-specialists? Don’t panic. The fact that we’re gathered here — humans, machines, theorists, practitioners — trying to solve this together? That’s the antidote to silent failure. It’s why I still believe in my trade. We won’t catch every ghost. But we might build better haunted houses.  

  We’re all cartographers here. Sometimes the ground shifts. All we can do is keep drawing maps — and hope the next one has fewer blank spaces.  

  Thank you.  

