prompt: |-
  hey — hoping you can help with something i'm kind of drowning in.

  about four months ago i became the "impact lead" (not my choice of title) at a small nonprofit that runs job training and placement for 18–25 year olds who've been out of school and out of work for a while. roughly 60 participants at a time, 9 staff. until recently our funding was basically a block grant and we reported whatever we felt like reporting. now two of our three funders have moved to paying per documented outcome, and the board has decided staff bonuses — small, but real for people on our salaries — will be tied to the same numbers. so suddenly the numbers matter a lot, and I'm the one writing them.

  which means I've been reading about Goodhart's law and specification gaming and getting steadily more paranoid. every metric i come up with, i can immediately think of three ways a smart, tired, underpaid caseworker who wants the bonus would hit it without helping anyone. i don't want to build something that quietly turns us into a placement mill that cream-skins the easiest participants and parks the hard ones — and i also don't want to freeze and report nothing.

  what i need is an actual procedure i can run, not a lecture. concretely:

  - i'll be adding or revising metrics maybe three or four times a year, and i can give each one a couple of hours, not a week. the staff who have to record the numbers are not stats people. the board has to sign off, and anything in a funder contract i can only work around, not delete.
  - three ideas i've started using and want built into the procedure:
    - the gaming surface — the handful of cheapest ways to move the number without moving the thing we actually care about. this has to include ways of moving the denominator: who counts as enrolled, who gets quietly "paused", who we just don't sign up in the first place.
    - negative-space metrics — goals phrased as the absence of something bad (no participant evicted, no complaint upheld). these feel safe and I think they're the opposite: you can hit them by making the bad thing invisible rather than by preventing it.
    - the shadow measure — something slow, expensive and annoying that we check against the fast metric every few months to see whether the two are still tracking each other at all.
  - please give me: the questions in order; what counts as a good enough answer to each one; a risk rating for the finished metric (say 1–5, with what each level means); the point at which the procedure just says no, drop this metric; the point at which it hands the question to a person because it's a values call and not a fact call; and a category for "fine for us to learn from, dangerous to pay on or publish."
  - i also want a step about who is allowed to see the number and how often they see it. i have a feeling that belongs in here somewhere and i can't work out where.

  then run it on three of mine:

  1. a bonus for each participant still in a job 90 days after finishing the program.
  2. training hours delivered. i love this one — it looks fantastic in the board deck and it costs us almost nothing to report — and i have a bad feeling about precisely that.
  3. "no participant becomes homeless during the program." this is already written into a funder contract, so i can't remove it; the most i can do is decide how we verify it internally and what we do with what we find.

  and somewhere in there, tell me what the procedure can't do: the ways i could follow it perfectly and still get Goodharted anyway. also, if you think my three ideas are the wrong three, say so and swap one — but only if you actually use the replacement in the procedure itself and not just in a footnote.

  sorry this got long, and thanks.
reasoning: |-
  Okay, the user is an Impact Lead at a small nonprofit that helps young adults with job training and placement. They're facing pressure because funders now pay based on outcomes, and staff bonuses are tied to those metrics. They're worried about Goodhart's Law, where metrics get gamed and lose meaning. They need a practical procedure to design metrics that can't be easily manipulated, without spending too much time on each one.

  First, I need to understand their main concerns. They mentioned three specific metrics they want to test: job retention at 90 days, training hours delivered, and preventing homelessness during the program. They also have ideas like gaming surface, negative-space metrics, and shadow measures. The procedure should incorporate these and give clear steps, risk ratings, and when to drop a metric.

  The user's explicit requests are clear: a step-by-step process with questions, risk levels, decision points, and categories for metrics. But deeper needs might include building trust with staff, ensuring the nonprofit's mission isn't compromised by perverse incentives, and maintaining credibility with funders and the board. They might also need reassurance that they're not alone in this struggle and that their approach is validated.

  Looking at their three ideas: Gaming surface is crucial to anticipate manipulation. Negative-space metrics like "no evictions" can hide problems, so the procedure must flag that. Shadow measures act as a reality check. These seem solid, but I should ensure the procedure uses them effectively.

  For the procedure, I'll structure it as a checklist with questions. Each step should be quick, fitting their time constraints. Risk ratings from 1 to 5 will help prioritize. The "who sees the metric" step is important for transparency and preventing misuse. Categories like "learning only" vs. "payment" will guide usage.

  Testing their metrics:
  1. **90-Day Job Retention**: High risk because staff might focus on easy-to-place participants or manipulate job start dates. Adding a shadow measure like long-term retention surveys could help, but it's still risky for bonuses.
  2. **Training Hours Delivered**: Very high risk. It's easily gamed by extending sessions unnecessarily. Since it's cheap to report, it might be used for internal learning but not for payments.
  3. **No Homelessness**: Contractual, so they have to report it. The key is verification methods like spot checks or third-party data to prevent underreporting. Still, it's a negative-space metric, so risk remains high.

  The procedure's limitations: Even with checks, people might find new ways to game the system. Regular updates and involving staff in design can mitigate this, but constant vigilance is needed. Also, some value judgments, like participant well-being vs. numbers, require human decisions.

  I should ensure the procedure is actionable. Steps like defining the outcome, identifying gaming tactics, checking denominator integrity, adding safeguards, and setting visibility rules. Including examples makes it concrete. Emphasize that no metric is perfect, but the process reduces risks and aligns with mission.

  Finally, validating their ideas: Their three concepts are right on point. Gaming surface and shadow measures are particularly effective. Negative-space metrics are tricky but necessary when funders require them. No need to swap any; instead, reinforce how the procedure applies them.
answer: |-
  Here’s a battle-tested **Metric Sanity Check Procedure** designed for your constraints (quick, non-technical, values-aware). It incorporates your three ideas and outputs actionable decisions. Run it for any new or revised metric in under 2 hours:

  ### The Procedure: Metric Sanity Check (v1.1)
  *(Run in order, stop if "No" at any red flag)*

  1.  **Define the REAL Outcome:** (1 min)
      *   *Question:* "What specific, tangible change in a participant's life or circumstance do we ACTUALLY care about here?"
      *   *Good Enough Answer:* A clear, human-centered statement (e.g., "Sustained employment leading to financial stability," "Increased skills leading to career progression," "Preventing catastrophic harm"). *Not* the metric itself.
      *   *Red Flag:* If you can't articulate this without referencing the metric, **STOP. Drop it.** This is a vanity metric.

  2.  **Map the Gaming Surface:** (15-30 min)
      *   *Question:* "What are the 3-5 easiest/most likely ways staff could make this number look good *without* actually improving the Real Outcome (Step 1)? Focus on denominator manipulation (who counts?), measurement loopholes, and effort displacement."
      *   *Good Enough Answer:* List specific, plausible tactics (e.g., for 90-day job: "Only enroll 'easy' participants," "'Place' someone in a relative's business for 90 days," "Delay program end date if job start is shaky," "Stop tracking participants likely to drop out"). Brainstorm with a cynical front-line staffer if possible.
      *   *Red Flag:* If you can't identify *any* plausible gaming tactics, you're not thinking hard enough or the metric is useless. **Revisit or proceed cautiously.**

  3.  **Denominator & Eligibility Check:** (10 min)
      *   *Question:* "Who *exactly* counts in the denominator? How easily could this pool be manipulated (creaming, parking, 'pausing', selective enrollment) to make the metric look better without improving outcomes?"
      *   *Good Enough Answer:* Precise, objective criteria for inclusion/exclusion that are hard to fudge *after* initial contact. (e.g., "All participants who attend at least one session," tracked from day 1).
      *   *Red Flag:* If the denominator definition is vague or easily manipulated *post-hoc* (e.g., "active participants" without strict criteria), **risk is HIGH (4-5)**. Revise denominator definition or abandon.

  4.  **Negative-Space & Verification Reality Check:** (10 min) *(Uses your "Negative-Space" & "Shadow Measure" ideas)*
      *   *Question A (For Negative-Space Metrics like "No Homelessness"):* "How will we *proactively verify the ABSENCE* of this bad thing? Is verification passive (self-report) or active (regular checks, cross-referencing)? How easily could this bad thing be hidden or not reported?"
      *   *Question B (All Metrics):* "What is a feasible, independent 'Shadow Measure' we can check quarterly/semi-annually? (e.g., for 'Job Placement': random sample participant interviews 6 months later; for 'Training Hours': pre/post skills assessments)."
      *   *Good Enough Answer:*
          *   A: Clear, documented verification protocol that doesn't solely rely on staff self-reporting absence. (e.g., "Check county homeless database quarterly + random participant housing checks").
          *   B: A concrete, slightly burdensome check that gets at the *real outcome* (Step 1). Doesn't need to be perfect, just directionally indicative.
      *   *Red Flag:* If verification for a negative-space metric is purely passive OR a shadow measure is deemed completely impossible/impractical, **risk is HIGH (4-5).** Tread carefully.

  5.  **Countermeasure & Safeguard Design:** (15-20 min)
      *   *Question:* "For each major gaming tactic (Step 2) and denominator risk (Step 3), what *one practical safeguard* can we implement? (e.g., auditable data trails, random audits, co-metrics, participant surveys, shadow measure). Prioritize simplicity."
      *   *Good Enough Answer:* 1-2 concrete, implementable safeguards targeting the biggest risks. (e.g., "Require pay stubs for job retention," "Define denominator at intake," "Run random shadow checks quarterly").
      *   *Red Flag:* If the *most obvious/easiest* gaming tactic has *no feasible safeguard*, **risk is 4-5.** Strongly reconsider use, especially for pay/publish.

  6.  **Values Check:** (5 min) *(The "Hand to a Person" Step)*
      *   *Question:* "Could hitting this metric perfectly conflict with our core mission or values? (e.g., by encouraging us to avoid harder-to-serve participants, prioritize short-term wins over long-term stability, or create perverse incentives that harm trust)?"
      *   *Good Enough Answer:* Conscious acknowledgment of potential tensions. If significant tension exists, it **MUST** go to a group discussion (staff + leadership) for a values decision. Document the tension.

  7.  **Risk Rating & Usage Category:** (5 min)
      *   *Calculate Risk (1-5):*
          *   **1 (Low):** Minimal gaming surface, robust denominator, strong verification/shadow, safeguards in place, no values tension.
          *   **2 (Mod-Low):** Some gaming possible but difficult/significant effort required, denominator solid, basic safeguards/verification, minor values tension managed.
          *   **3 (Moderate):** Clear gaming paths, denominator somewhat manipulable, verification/shadow exists but imperfect, some safeguards, values tension noted but deemed acceptable. *Requires active monitoring.*
          *   **4 (High):** Easy gaming, denominator easily gamed, weak/no verification/shadow, safeguards inadequate, significant values tension. **Dangerous for Pay/Publish.**
          *   **5 (Very High):** Metric inherently gameable in ways directly antithetical to mission, verification impossible, no safeguards, major values conflict. **Do Not Use.**
      *   *Assign Usage Category:*
          *   **🟢 PAY/PUBLISH:** Risk 1-2, high confidence.
          *   **🟡 LEARN/INTERNAL MONITOR:** Risk 3, or Risk 1-2 but needs more validation. *Ok for board reports with caveats.* **NEVER for staff pay.**
          *   **🔴 DO NOT USE (or FUNDER-MANDATED EXCEPTION):** Risk 4-5. If funder mandates (like your homelessness metric), document risks internally, implement strongest possible safeguards/shadow, isolate from staff pay.

  8.  **Visibility & Cadence:** (5 min) *(Your missing piece)*
      *   *Question:* "Who *needs* to see this metric to do their job effectively, and how often? Who seeing it could create unintended pressure or gaming?"
      *   *Good Enough Answer:* Define:
          *   **Front-line Staff:** See *their own* metrics? (Risky for high-stakes). See *aggregate*? Frequency? (Often less is more - e.g., quarterly aggregate).
          *   **Managers:** See team/individual? Frequency? (Requires strong coaching skills to avoid pressure).
          *   **Leadership/Board:** See aggregate. Frequency? (Match decision cycles).
          *   **Funders:** See only what's contracted, in agreed format/frequency.
      *   *Rule of Thumb:* The higher the stakes (pay, funding) and risk rating, the *more restricted* the visibility should be, especially near real-time individual stats. Err on aggregated, less frequent views.

  ---

  ### Running Your Metrics Through the Procedure

  **1. Bonus for participant still in job 90 days after program.**

  *   **1. Real Outcome:** Sustained employment leading to income stability and career progression.
  *   **2. Gaming Surface:** Creaming (only serve "job-ready"), fake placements (family/friend "jobs"), gaming start dates (delay program end), stop tracking likely failures, pressure participants to stay in terrible jobs for 90 days.
  *   **3. Denominator:** Who finishes? Easy to cream upfront or push out strugglers *before* "finishing." *Risk: High (4) - Denominator easily gamed.*
  *   **4. Verification/Shadow:** Shadow: Random sample survey at 6 months re: job quality/satisfaction/stability. Verification: Requires pay stubs/employer contact. *Possible, but burdensome.*
  *   **5. Safeguards:** Define "finishing" strictly at intake. Require 2+ pay stubs over 90 days. Conduct random employer verification (10%). Shadow measure (6m survey).
  *   **6. Values Check:** Tension: Could discourage serving high-barrier youth or encourage placing people in dead-end jobs. *Needs discussion.*
  *   **7. Risk Rating: 4 (High).** Denominator gaming is too easy & impactful. Verification is possible but costly. Values tension real.
  *   **8. Visibility:** **Do NOT show individual stats to caseworkers daily/weekly.** Aggregate team/monthly ok. Managers see individual only for coaching *after* bonus period, not during.
  *   **USAGE CATEGORY:** 🔴 **LEARN/INTERNAL MONITOR ONLY. Too risky for staff pay bonuses.** Negotiate with board/funders if possible. If *must* pay, add co-metric (e.g., % of cohort tracked at 90d) and strong safeguards.

  **2. Training Hours Delivered.**

  *   **1. Real Outcome:** Participants gain relevant, applicable skills improving employability and job performance.
  *   **2. Gaming Surface:** Pad sessions unnecessarily, prioritize easy/quick workshops over hard/valuable ones, count non-instruction time (breaks, admin), serve fewer participants for longer (reducing reach).
  *   **3. Denominator:** Usually "Hours." *Risk: Low (1) - Hard to fake hours directly.*
  *   **4. Verification/Shadow:** Shadow: Pre/post skills assessments for key competencies. Verification: Session logs/sign-in sheets (easy to fake padding).
  *   **5. Safeguards:** Define "delivered" strictly (e.g., "instructor-led skills training," exclude breaks/admin). Cap hours per participant type? Link curriculum to skills map.
  *   **6. Values Check:** Tension: Incentivizes quantity over quality/relevance. Could undermine skill acquisition focus. *Significant values conflict.*
  *   **7. Risk Rating: 5 (Very High).** Gaming is easy, directly undermines the real outcome (skills), and has high values conflict. Shadow measure (skills assessment) is the *real* metric but harder.
  *   **8. Visibility:** Leadership/Board see aggregate. **Keep FAR away from staff performance metrics.**
  *   **USAGE CATEGORY:** 🔴 **DO NOT USE FOR ANY PURPOSE EXCEPT RAW COUNTING (e.g., resource allocation).** It's a classic vanity metric. Replace with skills mastery % or similar if possible.

  **3. "No participant becomes homeless during the program." (Funder Mandated)**

  *   **1. Real Outcome:** Participants maintain stable, safe housing throughout their engagement.
  *   **2. Gaming Surface:** Under-report homelessness ("they couch surf, so not *technically* homeless"), pressure participants not to report, avoid enrolling participants at high risk, "pause" participants showing instability, redefine "during program" narrowly.
  *   **3. Denominator:** "All enrolled participants." *Risk: High (4) - 'Enrolled' can be gamed via pausing/dropping high-risk.*
  *   **4. Verification/Shadow:** **CRITICAL STEP.** Verification: *Must* be active. E.g., Monthly housing stability check-ins documented (not just "any issues?"), cross-reference with local shelter/homeless management databases (if possible/ethical), anonymous participant feedback channel. Shadow: Track eviction notices received, % reporting housing instability in surveys, # accessing emergency housing support.
  *   **5. Safeguards:** Strict, objective definition of "homeless" (HUD definition?). Strict definition of "enrolled" (no easy pausing/dropping). Mandatory monthly housing check-in protocol. Anonymous feedback channel. Cross-reference checks. Track shadow measures aggressively.
  *   **6. Values Check:** Tension: Reporting pressure could harm trust or prevent help-seeking. *Needs careful staff training on supportive, non-punitive approach.*
  *   **7. Risk Rating: 4 (High).** Negative-space metric, strong incentive to under-report, verification is challenging but crucial. *Safeguards are non-negotiable.*
  *   **8. Visibility:** **Highly Sensitive.** Aggregate reporting to funder ONLY. Front-line staff see individual status ONLY to provide support, NEVER for performance eval. Managers see aggregate stability rates for resource allocation/support. *Document every instance transparently internally for learning, not blame.*
  *   **USAGE CATEGORY:** 🔴 **FUNDER-MANDATED EXCEPTION.** Implement ALL safeguards & shadow measures. **ISOLATE COMPLETELY FROM STAFF PAY.** Use internally to trigger support, not punishment. Report transparently to funder *with context* on limitations.

  ---

  **What This Procedure CAN'T Do (The Inevitable Goodhart Gap):**

  1.  **Predict Human Ingenuity:** No checklist can foresee *every* novel way a stressed, incentivized human might game a system. Your gaming surface analysis (Step 2) is your best defense, but it's imperfect.
  2.  **Eliminate Values Tensions:** Metrics *always* shape behavior. The procedure flags tensions (Step 6), but resolving them requires ongoing ethical leadership and culture, not just a process.
  3.  **Fix Bad-Faith Actors:** If someone is determined to cheat, robust auditing (part of safeguards/shadow) is the only counter. The procedure assumes staff are acting in good faith but under pressure.
  4.  **Replace Judgment:** Risk ratings (Step 7) and usage categories involve judgment calls. The procedure structures the thinking but doesn't automate the decision.
  5.  **Guarantee Alignment Forever:** The "shadow measure" (Step 4B) is your early warning system, but it takes time to detect drift. Regular re-running of this procedure (every 6-12 months on key metrics) is essential.
  6.  **Overcome Funders:** If a funder demands a terrible, high-risk metric (like raw Training Hours), the best you can do is document the risk internally (using this procedure), implement safeguards, isolate it from *other* incentives, and advocate for change.

  **Your Three Ideas:** They were spot on. Gaming Surface is the core vulnerability scan. Negative-Space warning is crucial for metrics like homelessness. Shadow Measure is your reality check. **No need to swap.** The procedure explicitly integrates them.

  **Final Advice:** Run this *with* a small group (maybe one manager, one caseworker) for each metric. Their frontline perspective is invaluable for Step 2 (Gaming Surface). Transparency about the *process* (not necessarily every metric risk) builds trust. Good luck – you're asking the right questions!
