  The user's case involves visual flashes where subjects report movement that didn't happen. In their model, this is a reporting bias. But heterophenomenology would just document the report as part of the subject's narrative world. The challenge is translating this into psychometric terms without implying a latent variable.

  Next, I consider the residue. What doesn't map? The absence of a latent variable is crucial. Psychometrics assumes sensitivity (d′ > 0), but heterophenomenology doesn't. Also, neutrality about consciousness realism is foreign to their framework. The user might see this as either a flaw in their model or a limitation in Dennett's method.

  For the protocol, a heterophenomenological study would involve open interviews, verbatim transcripts, and no modeling of report-generating processes. The user would need to give up latent variables and sensitivity metrics, focusing instead on narrative consistency.

