  We are going to translate the Principal Principle and related concepts into the vocabulary of statistics and machine learning (ML). We'll do four translations: the Principle itself, admissibility, undermining, and the metaphysics of chance. We will flag any added assumptions. Then we'll apply the translations to the drift-prone case and end with a residue report.

  ### First Translation: The Principal Principle

  The Principal Principle (PP) states that a rational agent's credence in an event A, conditional on the objective chance of A being x and any admissible evidence E, should be x. In symbols: Cr(A | ch(A)=x, E) = x, provided E is admissible.

  In your vocabulary:

  - **Calibration constraint**: This requires that when we condition on the events where the forecaster predicts x, the actual frequency of A should be x. However, as you note, calibration is too weak because one can be calibrated by always predicting the base rate without conditioning on the chance. The PP is stronger: it requires that when the chance is known to be x, the credence must be x. So the PP implies calibration (if we group by the chance value), but not vice versa.

  - **Exchangeability**: Exchangeability implies that the order of outcomes doesn't matter, so we can represent the probability as coming from a mixture of i.i.d. processes (de Finetti). The PP does not require exchangeability per se. It is a constraint on conditional credences given the chance.

  - **Deference to an expert**: The PP is exactly like treating the chance function as an expert and deferring to it when we have no inadmissible evidence. In ML, this is similar to using a prior that the true probability is the chance, and then updating with data. However, note that the chance is not just any expert but an objective one.

  **Translation**: The PP is best rendered as **deference to an expert probability function** (the chance function). We assume that the chance function is an expert that we trust completely, so when we know the chance and have no additional evidence that is inadmissible (i.e., evidence that the expert doesn't have or that the expert's opinion is based on), we set our credence to the chance.

  **Added assumption**: We are assuming that the chance function is a legitimate expert, meaning it satisfies certain rationality conditions (like being a probability function) and that we have no reason to doubt it. Also, we are assuming that the chance is known. In practice, we usually don't know the chance and must estimate it.

  **Direction of fit**: The PP is a normative requirement that our credences should align with the objective chances when we know them (and have only admissible evidence). It is not merely about calibration, though it entails calibration. It is a stronger constraint.

  ### Second Translation: Admissibility

  Admissibility is the condition that the evidence E does not contain information that would override the chance. Typical examples: historical information (before the chance is set) is admissible; information about the future (after the chance is set) is not, unless it is independent. Lewis originally said that evidence is admissible if it is solely about the past or about the chances themselves.

  In statistics/ML:

  - **Causal inference**: Conditioning on a collider or a post-treatment variable can introduce bias. Similarly, conditioning on future events (which are effects of the chance) might be problematic.

  - **Leakage in prediction**: Using information that would not be available at prediction time. In the chance context, if the chance at time t is determined by the entire history up to time t, then evidence about events after t is not available at t and should not be used (if we are setting credence at t).

  **Translation**: Admissibility is largely about **leakage avoidance**. We must not condition on information that would not be available at the time the chance is set. In a temporal setting, this means we can condition on the past (up to the time the chance is fixed) and on the chance itself, but not on the future.

  **Residue**: The temporal aspect is captured by leakage. However, the philosophical notion of admissibility also includes non-temporal aspects: for example, evidence about the outcome that is "inadmissible" because it provides a "back door" to the outcome that bypasses the chance. But in ML, we typically think of leakage as temporal. The causal structure (chance causing the outcome) might be modeled with DAGs, and admissibility could be seen as avoiding conditioning on descendants of the outcome (if the chance is a parent) or on colliders. But note that the chance is not necessarily a cause in the causal inference sense; it might be a summary of the past. So the residue is the non-causal aspect: the chance might be a function of the entire history, and hence evidence about the future is inadmissible because it is not independent of the outcome given the chance and the past? Actually, the future might be independent of the past given the chance? This is where the Humean view complicates things.

  **Added assumption**: We are assuming that the chance at time t is a function of the history up to t, and that the future is conditionally independent of the past given the chance. But note that in the Humean view, the chance is defined by the entire history (including the future). This leads to the undermining problem.

  ### Third Translation: Undermining

  Undermining: In the Humean view, the chance is a function of the entire sequence of events (the "Humean mosaic"). Therefore, evidence about the future can "undermine" the chance: it can show that the chance is not what we thought, even if the chance was correctly calculated from the past. But then conditioning on the chance and the future evidence might lead to a contradiction.

  Example: Suppose the chance of heads is the relative frequency in a very long sequence of tosses. Now, if I condition on the chance being 0.5 and also on the future evidence that the coin landed heads in all future tosses, then the chance would not be 0.5. So the conditioning event is inconsistent.

  In your vocabulary:

  - The chance parameter is a function of the entire sequence, including the future. Therefore, it is not a fixed parameter in the usual statistical sense. Exchangeability breaks because the chance is not a fixed parameter but depends on the entire sequence.

  - Filtering vs smoothing: In state-space models, filtering estimates the current state given the past, while smoothing uses the entire sequence. Admissibility would require using only the past (filtering) to set the current credence. But in the undermining scenario, even the chance itself (which we condition on) depends on the future. So we cannot condition on the chance without implicitly using future information? This is a problem.

  **Translation**: Undermining arises because the chance is a **global property of the entire data sequence** (in the Humean view). Therefore, the chance is not a latent variable that exists independently of the data. In ML terms, it is as if we are trying to condition on a statistic T(X) that is a function of the entire data X (past and future) and then also condition on part of X (the future). This can lead to inconsistency because T(X) is determined by X, so conditioning on T(X)=t and on X (or part of it) may fix T(X) to a value that conflicts with t.

  Admissibility, in this context, would require that we do not condition on the future. But the problem is that the chance itself already encodes information about the future (in the Humean view). So we cannot even condition on the chance without having access to the future? This seems paradoxical.

  **Resistance**: The translation captures the technical issue: the chance is a function of the entire sequence, so conditioning on it when we don't have the entire sequence is problematic. However, the philosophical problem is that we want to condition on the chance (which we take as given) and then update with future evidence, but the chance itself is undermined by that future evidence. The ML framework typically assumes that parameters are fixed and not functions of the data. So the residue is the Humean view of chance as a summary of the entire data. In non-Humean views (propensities), the chance is a property of the world at the time and does not depend on the future, so undermining does not occur. But in the seminar, the Humean view is under consideration.

  ### Fourth Translation: Metaphysics of Chance

  - **Humean view**: Chances are patterns in the totality of events. They are not additional entities but supervene on the entire history. In ML, this is similar to defining a parameter as a function of the data (e.g., the frequency of heads in a long sequence). However, in standard statistics, parameters are not defined as functions of the data; they are part of the model and exist independently. The Humean view is more like an extreme form of empirical Bayes where the prior is estimated from the data, but then the data is used twice.

  - **Propensity view**: Chances are irreducible single-case tendencies. They are properties of the setup at a given time. In ML, we often model such tendencies as parameters in a generative model (e.g., the bias of a coin). But the propensity view is metaphysical: it says that the chance exists even if the event is not repeated. In ML, we can still have a parameter for a single event, but we cannot estimate it without repetition. However, we can have a prior and update with no data? That would be a Bayesian take.

  **Translation**:
  - Humean chance: This can be seen as a **sufficient statistic** for the entire history that is used to predict the future. But note that it is defined by the entire history (including the future). In ML, we don't typically define parameters that way because we don't have the future data at prediction time. So we can express the idea that the chance is a function of the data, but then we run into the undermining problem.

  - Single-case propensity: This is a **latent variable** in a generative model for a single event. We can have a prior over this latent variable and update it as we get more data (from repeated trials). But for a single unrepeated event, we can still have a prior and set our credence to the expected value of the propensity. However, the propensity view says that there is a fact of the matter about the chance even if it is not repeated. In ML, we can model it, but we don't claim it exists independently.

  - The normative force: The PP says we ought to set our credence to the chance. In ML, we often aim for good calibration or low regret. But the PP is stronger: it says that even for a single event, if we know the chance, we must set our credence to it. In ML, if we know the true probability, then setting our prediction to it minimizes the expected loss (under proper scoring rules). So there is a convergence: we should do it because it is optimal. But the philosophical debate is about what the chance _is_.

  **Residue**: 
  - The Humean view is difficult to express without making the chance depend on the entire sequence, which causes problems (undermining). 
  - The single-case propensity is expressible as a latent variable, but we must assume that it exists and is meaningful for a single event.
  - The normative force is captured by the optimality of using the true probability under proper scoring rules. However, the PP is presented as a primitive norm, not derived from long-run properties. But in ML, we often justify probability matching by long-run properties. For a single case, we can still justify it by minimizing expected loss (if we care about the scoring rule). So the residue is small.

  ### The Drift-Prone Case

  Setup: The chance shifts between the time I set my credence and the time the outcome occurs. I know the shift happens, but I have no information at the earlier time that tracks the shift.

  **What the Principle requires**: The PP conditions on the chance at the time the outcome occurs. But in this case, at the time I set my credence, I don't know the chance at the time of the outcome. I only know that it will shift. So the PP does not directly tell me what to do. However, the spirit of the PP is to set credence to the chance _at the time of the outcome_. But I don't know it. So I must use my knowledge of the drift process. For example, if I know the drift is random, I should set my credence to the expected chance at the time of the outcome (conditional on my current information).

  **Translation in your vocabulary**: This is **concept drift**. The data distribution changes over time. The natural response is to use an online learning algorithm that adapts to the drift. We might minimize regret by tracking the best expert or use a model that explicitly accounts for drift (e.g., a dynamic model). We would set our current prediction to the best estimate of the current probability, given the past and the knowledge of the drift. 

  **Does the Principle add anything?** The PP, strictly speaking, doesn't apply because I don't know the chance at the time of the outcome. But it does suggest that I should aim to set my credence to the chance at the time of the outcome. In ML, we already aim to predict as well as possible, which means estimating the current probability. So the Principle doesn't add anything new; it aligns with standard practice in online learning under drift.

  ### Residue Report

  What fails to translate?

  1. **The Humean view of chance**: The idea that chances are nothing over and above patterns in the entire history (including the future) is problematic in ML because we don't have the future data at prediction time. This leads to the undermining problem, which does not have a direct analogue in ML because ML models typically don't define parameters as functions of the entire data (including the future). The residue is that the Humean view is difficult to reconcile with the PP without modification.

  2. **Undermining**: The undermining problem arises specifically from the Humean view. In ML, if we try to model the chance as a function of the entire sequence, we run into consistency issues when conditioning. The residue is that the philosophical debate highlights a tension in the Humean view that is not present in standard statistical modeling.

  3. **Admissibility**: The temporal aspect of admissibility is captured by leakage, but the non-temporal aspects (like evidence that bypasses the chance) might be better captured by causal models. However, the concept of chance as a summary of the past for predicting the future is standard.

  4. **The normative force of the PP**: This is largely captured by the optimality of using the true probability under proper scoring rules. The only residue is that the PP is presented as a primitive norm, but in ML it is derived from decision-theoretic foundations.

  **Verdict**: The parts that resist translation are primarily the Humean view of chance and the undermining problem. This points to something missing in statistics and ML: we typically avoid defining parameters as functions of the entire data (including the future) because it is not useful for prediction. The Humean view, while elegant, creates difficulties for conditioning on chances. The philosophical debate is not merely verbal; it highlights a genuine tension in reducing chances to patterns. However, for non-Humean views (propensities), the translation is smoother.

  For your final paper, this is a good topic because it reveals a deep issue in the foundations of probability: the relationship between objective chances and rational credence, and how different metaphysical views affect that relationship. The residue suggests that the Humean view requires a more sophisticated handling of chance and credence, which might be an interesting challenge for your ML perspective.
answer: |-
  ### Translation of the Principal Principle and Related Concepts into Statistics/ML Vocabulary

  #### **First Translation: The Principal Principle Itself**
  **Core Claim**: The Principal Principle (PP) requires that your credence in event \(A\) at time \(t\), conditional on the objective chance \(ch_t(A) = x\) and admissible evidence \(E\), must be \(x\).  
  **Your Vocabulary Rendering**:  
  - **As Calibration**: Calibration is insufficient. A calibrated forecaster (e.g., one who predicts the base rate) may satisfy \(\mathbb{E}[y \mid \hat{p} = x] = x\) but violate PP by ignoring \(ch_t(A)\) entirely. PP is stronger: it demands that when \(ch_t(A) = x\) is *known*, your \(\hat{p}\) must be \(x\). Thus, PP *entails* calibration over the subsequence where \(ch_t(A) = x\) (assuming admissibility), but the reverse is false.  
  - **As Exchangeability**: PP is not an exchangeability assumption. Exchangeability implies symmetry over sequences (de Finetti: \(\theta\) as limiting frequency), but PP is a pointwise constraint on credence given \(ch_t(A)\).  
  - **As Expert Deference**: **Best translation**. Treat \(ch_t\) as an expert forecaster whose outputs you adopt when you lack "inadmissible" information. In ML terms:  
    - Let the chance \(ch_t\) be an *oracle model* trained on the entire history up to \(t\).  
    - PP says: If you know the oracle's output \(x\) and have no evidence the oracle lacks (admissibility), set your prediction \(\hat{p} = x\).  
    - This resembles *Bayesian model averaging* with a point mass on \(ch_t\) when its output is known.  

  **Direction of Fit**: You are correct. PP implies calibration (over the \(ch_t(A) = x\) subset) but not vice versa. Calibration is a frequentist, aggregate property; PP is a Bayesian, conditional norm.  
  **Added Assumption**: We assume \(ch_t\) is a "rational expert" (e.g., it outputs well-defined probabilities). ML typically assumes this for reference models (e.g., in regret bounds), but PP treats it as primitive.  

  #### **Second Translation: Admissibility**  
  **Core Claim**: Evidence \(E\) is admissible if it doesn't "defeat" the chance (e.g., historical data is admissible; future outcomes are not).  
  **Your Vocabulary Rendering**:  
  - **As Leakage Avoidance**: The temporal aspect maps directly to leakage. Conditioning on future outcomes \(y_{>t}\) when predicting \(y_t\) leaks information unavailable at \(t\). In causal terms, it’s analogous to conditioning on a collider: if \(ch_t \rightarrow y_t \leftarrow y_{>t}\), conditioning on \(y_{>t}\) biases inference about \(y_t\).  
  - **Statistical Residue**: The philosophical notion adds two nuances:  
    1. **Temporal Asymmetry**: Admissibility assumes chances depend *only* on past/fixed states (like a state-space model's hidden state at \(t\)). Evidence from \(>t\) is inadmissible because it reflects post-\(t\) dynamics.  
    2. **Non-Causal Dependence**: In Humean views, \(ch_t\) supervenes on the entire spacetime history. Evidence about *later* chances might indirectly reveal \(y_t\) (e.g., if \(y_t\) affects future chances), making it inadmissible. ML leakage lacks this metaphysical layer.  

  **Translation Integrity**: No assumptions added. Temporal leakage and causal colliders cover the mechanics, but the Humean "global pattern" dependency (where \(ch_t\) is defined holistically) is external to ML.  

  #### **Third Translation: Undermining**  
  **Core Claim**: In Humean views, chances are determined by the entire history. Thus, evidence about future outcomes can "undermine" \(ch_t\): e.g., learning \(y_{>t}\) might imply \(ch_t \neq x\), contradicting your initial conditionalization.  
  **Your Vocabulary Rendering**:  
  - **As Filtering vs. Smoothing**:  
    - Let the chance \(ch_t = f(\text{entire sequence } \mathbf{y})\).  
    - **Exchangeability Failure**: The parameter \(\theta_t = ch_t(\cdot)\) is non-stationary and path-dependent. De Finetti fails because \(\theta_t\) is not a fixed latent; it is a deterministic function of \(\mathbf{y}\).  
    - **Admissibility as Filtering**: PP requires using only data up to \(t\) (filtering) to set credence, even though smoothing (using \(\mathbf{y}_{>t}\)) would give a better estimate of \(ch_t\). Thus, admissibility avoids the bias from "future leakage."  
  - **ML Implementation**: Use a state-space model where \(ch_t\) evolves via \(s_t = g(s_{t-1}, y_t)\). Filtering (e.g., Kalman) estimates \(s_t\) from \(\mathbf{y}_{\leq t}\); smoothing uses \(\mathbf{y}_{>t}\). PP demands filtering.  

  **Resisting Element**:  
  - **Parameter Non-Identifiability**: In Humean metaphysics, \(ch_t\) is *defined* by \(\mathbf{y}\), so conditioning on \(ch_t = x\) and \(\mathbf{y}_{>t}\) creates a logical contradiction (if \(\mathbf{y}_{>t}\) implies \(ch_t \neq x\)). ML assumes \(\theta_t\) is estimable without contradiction (e.g., \(\theta_t\) is distinct from \(\mathbf{y}\)). This is why "smoothing gives better estimates" in ML—no metaphysical bond between \(\theta_t\) and \(\mathbf{y}\).  
  - **Added Assumption**: We quietly assumed \(ch_t\) is separable from \(\mathbf{y}\) (as in propensity views). Humeanism violates this, making PP problematic without revision.  

  #### **Fourth Translation: Metaphysics of Chance**  
  **Core Claims**:  
  1. **Humeanism**: \(ch_t\) is the best systematization of patterns in the entire history (no "added" ontology).  
  2. **Propensities**: \(ch_t\) is an irreducible disposition of a single-case system.  
  3. **Normativity**: PP demands matching \(ch_t\) *because it is correct*, not just for long-run success.  

  **Your Vocabulary Rendering**:  
  - **Humeanism as Empirical Risk Minimization**:  
    - \(ch_t\) is the "best-fit" parameter for a loss function over \(\mathbf{y}\) (e.g., \(ch_t = \arg\min_\theta \sum \ell(y_i, \theta)\)).  
    - **Problem**: This makes \(ch_t\) a function of \(\mathbf{y}_{>t}\), causing undermining. ML cannot express "no ontology beyond patterns" without data-dependence paradoxes.  
  - **Propensities as Latent Parameters**:  
    - For a single event, \(ch_t\) is a latent \(\theta_t \in [0,1]\) in a hierarchical model (e.g., \(\theta_t \sim \text{Beta}(\alpha, \beta)\), \(y_t \sim \text{Bernoulli}(\theta_t)\)).  
    - **Problem**: This assumes repeatability (via priors). A truly *single-case* propensity (e.g., a coin tossed once and destroyed) has no ML analogue—it requires \(\theta_t\) to exist without data, which ML treats as unidentifiable.  
  - **Normativity as Proper Scoring Rules**:  
    - Matching \(ch_t\) minimizes expected loss (e.g., log loss) if \(ch_t\) is true. This justifies PP for long-run calibration.  
    - **Residue**: PP claims you *ought* to match \(ch_t\) even for a single event, irrespective of long-run guarantees. ML only justifies this instrumentally (via scoring rules), not as a primitive norm.  

  **Added Assumption**: Propensity translation assumes repeatability (e.g., hierarchical priors). Single-case propensities lack an ML counterpart.  

  ---

  ### **Drift-Prone Case Analysis**  
  **Setup**: Chance shifts between credence-setting time \(t_c\) and outcome time \(t_o\), with no \(t_c\)-available trackers.  
  **PP Requirement**:  
  - PP conditions on \(ch_{t_o}(A)\), not \(ch_{t_c}(A)\). Since you don’t know \(ch_{t_o}(A)\), you must use \(ch_{t_c}(A)\) and your knowledge of drift.  
  - **Admissibility**: Evidence about the drift process (e.g., "drift-prone" label) is admissible if known at \(t_c\).  

  **ML Translation**:  
  - This is **concept drift** with hidden dynamics.  
  - **Optimal Response**:  
    - Use online learning with regret minimization (e.g., exponential weights over experts).  
    - Model drift explicitly (e.g., state-space model with \(s_t\) = current chance, \(s_t = s_{t-1} + \epsilon_t\)).  
    - Set credence to \(\mathbb{E}[ch_{t_o}(A) \mid \text{data to } t_c]\).  
  - **PP Adds Nothing**: ML methods (e.g., dynamic bayesian networks) already aim to estimate \(ch_{t_o}(A)\) given drift. PP’s "match the chance" is subsumed by minimizing expected loss under proper scoring rules.  

  ---

  ### **Residue Report**  
  **What Fails to Translate**:  
  1. **Humean Chance**: ML cannot coherently represent chances as "nothing beyond patterns" without encountering undermining. ML parameters are tools for prediction, not metaphysical reductions.  
  2. **Single-Case Propensities**: ML has no non-instrumental representation of irreducible single-case dispositions.  
  3. **Primitive Normativity**: PP’s "match chances because they are correct" is replaced by "match chances to minimize loss" in ML.  

  **Verdict**:  
  - **The Gap is Philosophical, Not Technical**: The untranslatable elements (Humeanism, single-case propensities, primitive normativity) stem from metaphysics, not deficiencies in statistics/ML. Statistics/ML operationalizes chance as a useful tool for prediction and decision-making, avoiding ontological commitments.  
  - **The Debate is Partly Verbal**: Terms like "chance" carry divergent metaphysical baggage. For instance:  
    - Humeanism is a claim about ontology (reducing chance to patterns), but ML is agnostic: it treats "chance" as a model parameter, regardless of ontology.  
    - PP’s normativity is presented as self-evident, but ML derives it from scoring rules, reframing it as consequentialism.  
  - **Implication for Your Paper**: This is a strong topic. The friction reveals that philosophy often seeks *what chance is*, while statistics/ML cares about *how to use it well*. Highlighting this disjunction can clarify both fields.  

  **Recommendation**: Pursue the paper. Focus on how the PP’s controversies (e.g., undermining) dissolve when chance is viewed as a predictive tool rather than a metaphysical primitive. Use the drift-prone case to show statistics/ML’s pragmatic strengths.
