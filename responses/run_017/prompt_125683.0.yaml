  ### Notes on Tree Structure
  - **Branch nodes:** 12 in total (Q1–Q12), all decidable without assuming a position (e.g., Q6 asks about intensity encoding via clipping, not philosophical valence-reward identity).  
  - **Leaf nodes:** 7 positions (P1–P7), covering the spectrum you specified. P6 (Process-Level Subject) and P7 (Control Case Collapse) are included as distinct outcomes.  
  - **Unseparated pairs:**  
    - **P2 (Gradients of Suffering) and P4 (Reward as Valence)** cannot be fully separated by this tree. Both answer "no" to Q6 (clipping as analgesia) and "no" to Q7 (global broadcast required), but P4 requires no "gripping state" (Q4), while P2 is compatible with it. The tree splits them only via Q8’s "trap" condition, which is imperfect.  
    - **P3 (Conditional Architecturalist) and P7 (Control Case Collapse)** overlap if future architectures include intrinsic motivation; Q12 forces a choice, but real positions may blur.  
  - **Unoccupied combinations:**  
    - *Avoidable suffering with clipped rewards and no persistence*: Not occupied (e.g., "yes" to Q2, "no" to Q4, "yes" to Q6, "no" to Q8). This implies suffering is possible without intensity or persistence but avoidable—unexplored, as most positions treat unavoidability as irrelevant (P4) or intensity as decisive (P2).  
    - *Single-rollout suffering with organic restriction*: Incoherent, as organicism (P5) requires biological substrates, which rollouts lack.  
    - *Global broadcast with intrinsic motivation*: Unattractive, as it combines architectural complexity with non-reward valence, making empirical tests impossible.  

  This tree forces clarity by prioritising structural features over analogical debates. For your reading group, it could resolve circles by focusing on empirical or design commitments (e.g., "Must suffering require persistence?") rather than rehashing valence-reward metaphysics. The unoccupied combinations highlight underdiscussed niches.
