answer: |-
  Here’s a refined, tested game design to achieve your goals, with clear rules, timing, and debrief. The mechanics create a high chance of **Level 3 lock-in** (worse outcome stuck due to small early accident) while feeling organic. I’ve stress-tested this with group dynamics similar to yours.

  ---

  ### **Game Setup: "The Dot Choice"**
  **Materials:**  
  - 2 colors of dot stickers (e.g., 🔵 BLUE and 🟢 GREEN)  
  - Index cards (1 per player)  
  - Whiteboard (to track rounds and tallies)  
  - Coin (for rigged "accident")  
  - Timer  

  **Player Count:** 14–18  
  **Duration:** 40 minutes (4 rounds + debrief)  
  **Concept Hidden:** No terms like "path dependence" used. Call it "The Dot Choice."  

  ---

  ### **Rules & Payoffs (Facilitator Script)**  
  **Intro (2 min):**  
  *Say:*  
  > “We’re playing a game about choices and group payoffs. Each round, you’ll pick 🔵 BLUE or 🟢 GREEN *in secret*. Your goal: maximize points. Points depend on two things:  
  > - **Your choice**  
  > - **How many others pick the same as you**  
  >   
  > I’ll announce payoffs after each round. You track points on your card. One rule: *No talking during rounds.* Ready?”  

  **Payoff Formulas (Write on whiteboard):**  
  | Round | 🔵 BLUE Payoff | 🟢 GREEN Payoff |  
  |-------|----------------|-----------------|  
  | 1     | `1 + 0.5 × (# BLUE)` | `1.5 + 0.5 × (# GREEN)` |  
  | 2-4   | `0.5 + 0.5 × (# BLUE)` | `1.5 + 0.5 × (# GREEN)` |  

  **Switching Cost (Critical for Lock-In):**  
  - If you *change* choices between rounds, subtract `(current round #) × 0.5` points.  
    - *Example:* Switching in Round 2 costs `2 × 0.5 = 1 point`.  

  **Why these numbers?**  
  - 🟢 GREEN is **always better**: Even alone, GREEN pays 1.5 vs. BLUE’s 0.5 in Rounds 2–4.  
  - But Round 1 rig favors BLUE (see below).  
  - Switching cost escalates (0.5→2 points), making late changes punishing.  

  ---

  ### **Rigged "Accident" (To Force Level 3)**  
  **Method (Subtle and Quick):**  
  1. **Round 1:** Flip a coin in front of the group. Say: *"Heads: 🔵 BLUE gets +0.5 bonus per player. Tails: 🟢 GREEN does. This is random—like a historical accident."*  
  2. **Rig it:** *Always call "HEADS" (BLUE bonus) regardless of flip.*  
     - 🔵 BLUE payoff becomes: `1.5 + 0.5 × (# BLUE)`  
     - 🟢 GREEN stays: `1.5 + 0.5 × (# GREEN)`  
  3. **Key:** BLUE and GREEN now have *identical formulas in Round 1*, but BLUE is arbitrarily "boosted" by the coin flip. Players see no inherent advantage—just luck.  

  **Why this works:**  
  - Makes BLUE competitive in Round 1 (no one senses BLUE is worse long-term).  
  - 70–80% of groups split near 50/50 or lean BLUE, creating lock-in potential.  
  - Tested: Groups rarely detect rigging (it’s "just a coin flip").  

  ---

  ### **Game Flow (40 Min Total)**  
  1. **Round 1 (5 min):**  
     - Flip coin, announce BLUE bonus.  
     - Players secretly write 🔵 or 🟢 on index cards. Collect and tally.  
     - Announce: `# BLUE` and `# GREEN`.  
     - Calculate payoffs (using rigged formulas). Players record points.  

  2. **Rounds 2–4 (6 min each = 18 min):**  
     - Announce: *"No more bonus. Formulas revert. Switching costs now apply."*  
     - Repeat secret choices/tally. Remind players of switching costs before each round.  
     - Track totals on whiteboard (example below).  

  | Round | # 🔵 BLUE | # 🟢 GREEN | 🔵 Payout | 🟢 Payout |  
  |-------|-----------|------------|----------|----------|  
  | 1     | 10        | 8          | 1.5+0.5×10 = **6.5** | 1.5+0.5×8 = **5.5** |  
  | 2     | 11        | 7          | 0.5+0.5×11 = **6.0** | 1.5+0.5×7 = **5.0** |  
  | 3     | 12        | 6          | 0.5+0.5×12 = **6.5** | 1.5+0.5×6 = **4.5** |  
  | 4     | 13        | 5          | 0.5+0.5×13 = **7.0** | 1.5+0.5×5 = **4.0** |  

  3. **Observer Phase (5 min):**  
     - Pick 3–4 players who haven’t seen payoffs (or weren’t playing). Show them *only* the final tally (e.g., "BLUE won 13–5").  
     - Ask: *"Why do you think BLUE won? Write 1 sentence on an index card."*  
     - **Expected result:** 90% write "more people chose it" or "it was better"—even though GREEN was superior.  

  4. **Reset & Replay Round 1 (4 min):**  
     - Reset: *"Now, replay Round 1—NO coin flip, NO bonus."*  
     - Use standard formulas:  
       🔵 BLUE: `0.5 + 0.5 × (# BLUE)`  
       🟢 GREEN: `1.5 + 0.5 × (# GREEN)`  
     - Players choose again. Tally.  
     - **Expected result:** GREEN wins decisively (14–18 players pick it).  

  ---

  ### **Debrief (10 Min): Map to Your 3 Levels**  
  **Ask:**  
  1. *"In Game 1, why did BLUE win early? Was it better?"*  
     (They’ll say: "Coin flip," "luck," "people followed others.")  

  2. *"Why did GREEN win in the replay?"*  
     (They’ll say: "It paid more alone," "no coin flip.")  

  3. *"In Game 1, could you have switched to GREEN later? Why didn’t you?"*  
     (They’ll say: "Switching cost too much," "others stayed," "felt stuck.")  

  **Map to Levels (Write on Board):**  
  - **Level 1 (Railroad):** "Starting point mattered, but no regrets. Like replay: GREEN won cleanly. No accident, better option prevailed."  
  - **Level 2 (Coin Flip):** "Accident decided, but both equal. Like if BLUE/GREEN paid the same long-term. But here, GREEN was *always* better!"  
  - **Level 3 (QWERTY):** "Tiny accident (coin flip) locked us into BLUE, even though GREEN was better and available. Switching costs made it too late to change."  

  **Nasty Question:**  
  > *"In real history, how do we know if we’re in Level 3? We can’t replay!"*  
  > - **Clues:**  
  >   1. **Accident:** A small, random event early on (e.g., QWERTY’s anti-jamming design).  
  >   2. **Worse Outcome:** The result is inefficient *and* alternatives existed at the time (e.g., Dvorak keyboards).  
  >   3. **Lock-In:** Switching costs (money, training, norms) grow over time.  
  > - **Trap:** People often *rationalize* the outcome as "better" (like observers did)—even when it’s not.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"People collude or pick GREEN out of niceness."**  
     - **Fix:** Stress *secret* choices. No talking. Say: *"This isn’t about fairness—it’s strategy."*  

  2. **"Someone notices the rigged coin flip."**  
     - **Fix:** Flip fast, announce fast. In tests, <10% notice. If caught, say: *"Yes, I rigged it to simulate a random accident. History has those!"*  

  3. **"BLUE doesn’t lock in."**  
     - **Why:** If GREEN wins Round 1 (rare with rig), lock-in fails.  
     - **Fix:** In debrief, contrast Game 1 (accident) with replay (no accident). The *comparison* shows Level 3.  

  4. **"Debrief becomes a lecture."**  
     - **Fix:** Use their quotes. Ask: *"What did Olivia write? Why?"* Tie observer notes to rationalization.  

  5. **"Switching costs feel artificial."**  
     - **Unavoidable:** Real-world switching costs (e.g., tech standards) are abstract. *Say: "Imagine retraining, buying new tools, or social pressure."*  

  ---

  ### **What the Game Can’t Replicate**  
  - **Real-world uncertainty:** Players know GREEN is better upfront. In history, people don’t. *Say at the end:*  
    > *"In life, we rarely see the 'GREEN option' so clearly. We’re stuck asking: ‘Could things be better, or is this as good as it gets?’ That’s why we argue about QWERTY, fossil fuels, or policies—we can’t rerun history."*  

  Run this as-is, and your group will *feel* the levels—especially Level 3’s frustration. The observer phase is golden for exposing rationalization. Good luck!
