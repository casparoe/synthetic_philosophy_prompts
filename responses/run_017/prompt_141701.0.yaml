prompt: |-
  Been reading the rationalist corner of the internet since roughly the Overcoming Bias days, so my reflex on any "I can't decide" question is: shut up and multiply, pick the bigger number, and if that still feels bad the problem is with my feelings. A friend of mine — ex-philosopher, now a clinical ethicist at a hospital, she's the one who got me into this — keeps insisting that this only works when the options are actually comparable, and that the interesting cases are exactly the ones where there's no bigger number to go find. I've read some of the parity / voluntarist package (Chang and co.) and it half-clicked, but I've also definitely seen "incommensurable" used online as a stop-word meaning "I don't want to do arithmetic," which I take to be a real failure mode that a good theory should block rather than license. So before I commit to any particular account, I want the spec.

  Write me the desiderata an account of hard choices and incommensurable values has to meet to count as adequate. Fix the purpose as mine: adequate means good enough that I could (i) tell the difference between a genuinely hard choice and a lazy refusal to do the math, and (ii) say something non-bullshitty to my friend Wren, who is three weeks into agonising over two job offers and wants to know whether she is *allowed* to just pick — one is more money and status but sixty-hour weeks in a city she likes, the other is worse-paid, more autonomy, near her family, and neither dominates. For each requirement give the case or consideration behind it, and mark which are non-negotiable and which are just the prejudices of one camp. The cases I want covered, at minimum: the tiny-token case (if you add five dollars to one option, does it stop being hard? — a theory whose account of incommensurability survives an arbitrarily small sweetener is doing something different from one that doesn't); Wren's case re-run (same person, same information, ranks A above B on Tuesday and B above A on Thursday, with no new evidence and no self-deception — is that irrational, a symptom, or the signature of parity?); the resolution case (at coarse grain both options look comparable and "fine," at fine grain they don't — is comparability grain-relative or is that just vagueness in disguise); the transformative case (the choice changes who is doing the valuing, so the evaluator after the choice isn't the evaluator before — having a kid versus not, say, or a career you can only enter young); the chaining case (A is slightly worse than B, B is on a par with C, C is on a par with A — can this agent be exploited, and does a theory that permits two eligible options owe us a story about why that isn't a money pump?); the advisor asymmetry (when I'm deciding for myself, "either is fine, just pick" lands as a category error; when Wren is deciding, the very same advice seems fine — that gap should fall out of the theory, not be asserted alongside it); the tragic-remainder case (choosing one leaves something that isn't merely lost but is in some sense wronged); and the collective case (cost-benefit analysis, a statistical life versus a wetland, institutions that have to decide anyway — does incommensurability have any bite for public choices or is it only first-personal?). Also tell me which distinctions the theory is not allowed to collapse: incomparability versus parity versus equality versus mere vagueness versus our ignorance of the true exchange rate versus incompleteness in the agent's own preferences; "the values are incommensurable" versus "the options are incomparable"; no fact of the matter versus a fact of the matter we can't know versus a fact of the matter the agent constitutes by choosing; and hard-because-the-world versus hard-because-of-us.

  The part I most want: which pairs of desiderata you suspect can't be jointly satisfied, so that the list itself is the interesting result. My own candidates — argue with them — are (a) "both options are rationally permissible" against "the agent must not be exploitable / must not be money-pumpable," (b) "there is no fact of the matter which is better" against "the choice is nevertheless the moment where value gets created and where the agent can get it wrong," and (c) "the class of hard choices is rare and serious" against "hard choices are everywhere once you look at fine enough grain." Also say which single requirement does the most work excluding popular candidates, and which requirements on this list are really just one camp's aesthetic preferences wearing a lab coat (transitivity of betterness, expressibility in a decision-theoretic formalism, no primitive normative entities, no residue after a good choice, and so on). Then, briefly — a few lines each, not an essay, and no bibliography, I have no library access and can't look anything up, just argue it — score the parity/voluntarist view, the "it's really just vagueness" view, the "we're merely ignorant of the exchange rates" view, and the "everything is commensurable under one currency with diminishing returns" view against the list. If a candidate flunks a requirement you think is non-negotiable, say so plainly.
reasoning: |-
  Okay, let me tackle this user's query. They're deeply familiar with rationalist thinking but are grappling with the limits of quantifiable decision-making. Their friend, a clinical ethicist, argues that some choices involve incommensurable values, which can't be reduced to simple math. The user wants a set of criteria to distinguish genuine hard choices from mere laziness in calculation, and they need practical advice for their friend Wren's job dilemma.

  First, I need to outline the core requirements for an adequate theory of hard choices. The user provided specific cases to cover: tiny-token, Wren's case re-run, resolution, transformative, chaining, advisor asymmetry, tragic-remainder, and collective cases. Each of these tests different aspects of incommensurability. For instance, the tiny-token case checks if a theory can withstand arbitrarily small incentives without collapsing into commensurability. The transformative case addresses choices that alter the agent's identity, like having a child.

  The user also wants to preserve key distinctions, such as between incomparability and parity, and avoid conflating vagueness with genuine incommensurability. They’re concerned about potential contradictions in the desiderata, like reconciling rational permissibility with exploitability (money-pump arguments). 

  I should assess existing theories against these criteria. The parity/voluntarist view (e.g., Ruth Chang) handles many cases well, especially transformative choices and advisor asymmetry, but struggles with money-pump concerns. The vagueness view might reduce hard choices to epistemic limitations, failing the tiny-token test. The ignorance view treats incommensurability as a lack of information, which doesn't explain why adding a tiny incentive doesn't resolve the choice. The commensurability-with-diminishing-returns view simplifies decision-making but flunks transformative cases where values fundamentally shift post-choice.

  The biggest tension lies between allowing multiple rational choices without making agents vulnerable to exploitation. If both options are permissible, how do we prevent scenarios where an agent pays to switch between them repeatedly? This might require accepting some exploitation in edge cases or redefining rationality to include resolute choice.

  Another critical point is the advisor asymmetry: why "just pick" feels wrong when deciding for oneself but acceptable when advising others. A good theory should explain this through the constitutive role of choice in creating value for the agent, not just reporting preexisting facts.

  For public policy, incommensurability must still guide decisions without a common currency, perhaps through procedural rather than aggregative methods. The tragic-remainder case acknowledges that some choices involve moral residues, which cost-benefit analysis often ignores.

  In scoring the theories, the parity view stands out despite its challenges with money pumps. The vagueness and ignorance views fail key tests like tiny-token and transformative cases. The commensurability view is elegant but can't handle identity-altering decisions.

  Ultimately, the user needs clarity on when to apply "shut up and multiply" versus recognizing genuine incommensurability. Highlighting the non-negotiable requirements—like surviving the tiny-token test and explaining advisor asymmetry—helps filter inadequate theories. The unresolved tensions, especially between permissibility and exploitability, point to deeper philosophical issues that might require pragmatic solutions in practice.
answer: |-
  Here’s the specification you requested, structured for your purpose. The desiderata are distilled from your cases and distinctions, with non-negotiables marked (**★**). Tensions between desiderata and evaluations of existing views follow.

  ---

  ### **Core Desiderata for an Adequate Account**
  *(Cases/considerations in italics, non-negotiables flagged)*

  1.  **Survives Tiny Tokens:** Adding an arbitrarily small sweetener (e.g., $5) to one option *does not* automatically resolve the choice as "easy." *[Case: Tiny-token case. **★** - Otherwise collapses into comparability; fails to distinguish genuine incommensurability from mere indecision.]*
  2.  **Accommodates Preference Instability:** Allows that an agent, with full self-knowledge and no new information, can stably rank A > B on Tuesday and B > A on Thursday *without* irrationality or pathology. *[Case: Wren's re-run. **★** - Captures the phenomenology of parity; blocks "true preference" escape hatches.]*
  3.  **Handles Grain-Relativity:** Explains why options can appear comparable at a coarse grain but reveal incomparability/parity at a fine grain, without *merely* attributing this to epistemic vagueness. *[Case: Resolution case. **★** - Distinguishes constitutive incommensurability from epistemic lack.]*
  4.  **Explains Transformative Choices:** Accounts for choices where the act of choosing fundamentally alters the agent's values or identity ("Who I will be"). *[Case: Transformative case (e.g., parenthood). **★** - Vital for identity-defining choices; blocks reduction to static preferences.]*
  5.  **Defuses Money-Pump Worries:** If chaining (A≈B, B≈C, C≈A) is possible, provides a robust reason why the agent cannot be systematically exploited (e.g., paying to cycle between options). *[Case: Chaining case. **★** - Non-negotiable for rationality; a theory permitting indeterminacy must block practical incoherence.]*
  6.  **Explains Advisor Asymmetry:** Explains why telling oneself "just pick" feels like a category error, while giving the same advice to another (like Wren) feels appropriate. *[Case: Advisor asymmetry. **★** - Reveals a core structural feature of self vs. other deliberation.]*
  7.  **Acknowledges Tragic Remainder:** Allows that choosing one valuable option can wrong or violate the value inherent in the unchosen option, leaving a moral residue. *[Case: Tragic-remainder case (e.g., Sophie's Choice).]*
  8.  **Applies Collectively:** Provides guidance for institutional/public choice (e.g., wetland vs. statistical life) without assuming interpersonal commensurability or collapsing into pure aggregation. *[Case: Collective case.]*
  9.  **Preserves Key Distinctions:** Must *not* collapse:
      *   Incomparability (no relation) vs. Parity (a fourth value relation ≈ alongside >, <, =).
      *   Genuine incommensurability vs. Vagueness vs. Ignorance of exchange rates.
      *   No fact of the matter vs. Constituted fact via choice.
      *   Hard-because-of-the-world (objective) vs. Hard-because-of-us (subjective/agential).

  ### **Key Tensions Between Desiderata**
  *(Your candidates + critical additions)*

  1.  **Permissibility vs. Exploitability (Money Pump):** (a) **Is the core tension.** If multiple choices are truly rationally permissible (≈ options), how can cyclical preferences (A≈B, B≈C, C≈A) be blocked without ad-hoc constraints? Solutions require either denying permissibility in chaining contexts or building in resolute choice/anti-akrasia mechanisms. *Most theories stumble here.*
  2.  **No Fact vs. Constitutive Choice & Getting it Wrong:** (b) **Is solvable but delicate.** A theory can hold there's no prior fact "A is better than B," yet still hold that *by* choosing, the agent *creates* reasons/commitments making the choice retrospectively evaluable ("right for me," "true to myself"). Getting it "wrong" means failing this constitutive act (e.g., choosing inauthentically).
  3.  **Rarity/Seriousness vs. Ubiquity (Fine Grain):** (c) **Requires grain-sensitivity.** The theory must distinguish *significant* incommensurability (transformative, tragic) from trivial indecision. Fine-grain ubiquity doesn't negate coarse-grain rarity/seriousness if the account explains *why* some grain levels matter more for "hardness." Fine-grain indecision over breakfast cereal isn't "hard" in the relevant sense.
  4.  **Collective Application vs. First-Person Constitutiveness:** Applying (8) to institutions while respecting (6) and the "constitutive" aspect of (b) is hard. Institutions don't "constitute" identity in the same way. This may require different tools for collective choice (e.g., procedural legitimacy) while acknowledging the residue from (7).

  ### **The Sifter: Most Excluding Requirement**
  *   **Survives Tiny Tokens (1) + Handles Grain-Relativity (3) + Explains Transformative Choices (4):** Together, these obliterate popular reductive views. Vagueness fails (1) & (4). Ignorance fails (1) & (4). Diminishing returns fail (4) spectacularly. Parity struggles but can potentially meet them.

  ### **Camp-Specific Prejudices (Wearing Lab Coats)**
  *   **Non-Negotiable Transitivity of Betterness:** Often assumed, but challenged directly by parity. A theory *must* be able to reject simple transitivity for "≈" to handle cases like chaining & instability.
  *   **Expressibility in Standard Decision Theory:** Insisting options must be mapped to real numbers (even with uncertainty) is a bias. Genuine incommensurability may require richer formalisms or none.
  *   **No Primitive Normativity:** Demanding all normativity reduce to preferences or non-normative facts ignores the possibility of irreducible value relations (like parity).
  *   **No Residue:** Insisting rational choice leaves no tragic remainder is a utilitarian/optimizing prejudice ignoring the phenomenology of many hard choices.

  ---

  ### **Scoring Candidate Views**
  *(Against the full list, highlighting fatal flaws)*

  1.  **Parity/Voluntarist (Chang-esque):**
      *   **Strengths:** Excels at (2) Preference Instability, (4) Transformative Choices (choice reveals self), (6) Advisor Asymmetry (self-constitution), (7) Tragic Remainder (value conflict), (9) Preserves distinctions (parity ≠ incomparability/ignorance).
      *   **Weaknesses:** Struggles **severely** with (5) Money Pumps (how to block cyclical exploitation if ≈ is non-transitive?). Unclear on (8) Collective Application (individualist focus). Grain-relativity (3) needs careful handling. **Flirts with collapsing** "no fact" and "constituted fact" (9).
      *   **Verdict:** Best fit for *personal* hard choices, fails **non-negotiable (5)** if it can't solve the money pump. Requires supplement for collective cases.

  2.  **"It's Just Vagueness":**
      *   **Strengths:** Handles (3) Grain-Relativity easily (vagueness is grain-sensitive). Can mimic (2) Instability (epistemic uncertainty). Fits standard decision theory.
      *   **Weaknesses:** **Fails (1) Tiny Tokens** catastrophically (any sweetener, however small, *should* resolve vague boundaries). Fails (4) Transformative Choices (vagueness isn't identity-altering). Fails (6) Advisor Asymmetry (vagueness applies equally to self/other advice). Fails (7) Tragic Remainder (vagueness doesn't wrong values). **Collapses distinctions (9)** - reduces all to epistemic lack.
      *   **Verdict:** **Flunks non-negotiables (1) & (4).** A theory for easy choices masquerading as hard.

  3.  **"We're Merely Ignorant of Exchange Rates":**
      *   **Strengths:** Compatible with (8) Collective Application (CBA as ideal). Fits transitivity/money-pump avoidance (5).
      *   **Weaknesses:** **Fails (1) Tiny Tokens** (if ignorant, a small sweetener shouldn't resolve deep uncertainty). Fails (2) Preference Instability (why flip-flop with no new info?). Fails (4) Transformative Choices (exchange rates presuppose static values). Fails (6) Advisor Asymmetry (ignorance applies equally). **Collapses distinctions (9)** - reduces all to epistemic lack.
      *   **Verdict:** **Flunks non-negotiables (1), (2), (4).** Mistaken diagnosis; confuses hard choices with uncertainty.

  4.  **"Everything Commensurable (w/Diminishing Returns)":**
      *   **Strengths:** Aces (5) Money Pumps (transitive). Handles (1) Tiny Tokens trivially (sweetener always helps). Good for (8) Collective Application (aggregation).
      *   **Weaknesses:** **Fails (4) Transformative Choices** fundamentally (cannot model value-structure change). Fails (2) Preference Instability (why instability if utility known?). Fails (6) Advisor Asymmetry ("just pick" is always irrational delay). Fails (7) Tragic Remainder (losses are fungible). **Collapses distinctions (9)** - reduces all to fungibility on a curve.
      *   **Verdict:** **Flunks non-negotiable (4).** Excellent for *tractable* trade-offs, blind to genuinely transformative or identity-constituting choices. The "shut up and multiply" refuge.

  ---

  ### **What to Tell Wren (Non-Bullshit Version)**
  "Look, this genuinely seems like a hard choice. Neither option clearly beats the other across everything that matters to you – money/status vs. autonomy/family. That likely means the values at stake (professional ambition, personal freedom, familial connection) aren't easily traded against each other in a simple way, especially since this choice could shape the kind of person you become. There might not be a single 'right answer' waiting to be discovered. *Because* there's no obvious 'bigger number,' choosing isn't just finding the answer; it's partly *creating* it – committing to a path that will make one set of reasons more defining for you. Flip a coin if you must to break the paralysis, but pay attention to your gut reaction to the result. That feeling tells you something about what you're ready to commit to. Neither choice is wrong, but *not* choosing, or choosing inauthentically (e.g., just for money while hating the hours), is where you can go wrong."

  ---

  **The Sticking Point:** The **money pump (5)** remains the sharpest thorn for any permissivist/parity view. Solving it likely requires augmenting the core parity account with a *pragmatic* theory of resolute choice or agent-relative constraints on preference revision. The **transformative (4)** and **tiny token (1)** tests are the most effective filters against reductive views. Your friend is right: "shut up and multiply" only works where the numbers exist and mean the same thing. The interesting cases are where they don't.
