prompt: |-
  I'm trying to work out what I actually think about causation by omission, going case by case on gut feel, and I keep flip-flopping.

  - I promised to water my neighbor's plant while she's away, I don't, it dies. My not watering caused the death. Obviously yes.
  - A stranger who promised nothing and was never asked also doesn't water it. Also a cause, I think — blameworthy not at all, but causally in there just the same.
  - Same stranger, except he's 500 miles away and physically couldn't have watered it. Now I want to say: not a cause. (Which sits badly with 2, since the plant doesn't care why the water never came.)
  - Six weeks with no rain causes the crop failure. I'm happy with that, and there's no agent there at all.
  - I don't water, but the plant was already fatally diseased and watering wouldn't have saved it. Not a cause.
  - Two flatmates each could have watered it and neither does. I want to say both omissions cause the death, the same way I'd say it if they'd each poured in a lethal dose of something. But I'm less sure than I sound.
  - I stand still in a doorway and the paramedic can't get past. That feels like a positive action, not an omission, even though it's equally my not stepping aside.
  - A city council never funds the levee, the flood comes. Yes, a cause — but I can't point to whose omission it is.
  - Weird one I made up: a monitoring system predicts I won't water the plant, and on the basis of that prediction it switches the automatic sprinkler off in advance, so the plant dies partly because the system already knew I'd omit.

  My half-baked principle is something like: an omission is a cause when the corresponding action would have prevented the outcome by a route that was actually intact (no backup blockers) and whoever omitted could have done it — but case 4 makes me doubt the agency bit, case 3 makes me doubt the "could have" bit, and case 6 makes me doubt whether omissions can overdetermine the way actions can.

  Is there a principle that gets most of these? Feel free to drop one or two of my verdicts, just say which and why that's cheaper than the alternative. And tell me what your account says about case 9, and about a case where the omitted action would only have moved the chance of the outcome from 40% to 35%. Also: how confident are you in the principle you end up with, and which single piece of it would you least want to defend?
reasoning: |-
  Okay, the user is struggling with the concept of causation by omission. They've listed several cases where they feel conflicted about whether an omission counts as a cause. They want a principle that can explain most of these cases and address their doubts about agency, capability, and overdetermination. Also, they mentioned a weird case involving a predictive system and a scenario with probabilistic outcomes.

  First, I need to recall what causation by omission entails. It's tricky because omissions aren't events; they're absences. The user's examples show how context matters. Let me go through each case they provided and see if I can spot patterns.

  Starting with case 1: They promised to water the plant but didn't, so the plant died. Clearly, their omission caused the death. That makes sense because there was a duty or expectation. 

  Case 2: A stranger didn't water, no promise. The user thinks it's still a cause, even without blame. But in case 3, the stranger is 500 miles away and couldn't have watered it. Now the user feels it's not a cause. The difference seems to be capability and maybe normative context. The plant's outcome is the same, so why the difference? The user points out the plant doesn't care why the water didn't come, which is a good point. But intuitively, we don't hold someone responsible if they couldn't act, even causally. 

  Case 4: No rain causing crop failure. No agent involved, but the user accepts it as a cause. So agency isn't necessary. That challenges the idea that omissions require a capable agent. 

  Case 5: Not watering, but the plant was already diseased. The omission isn't a cause because watering wouldn't have helped. Here, the effectiveness of the action matters. 

  Case 6: Two flatmates both omit watering. The user wants both omissions to be causes, similar to overdetermination in positive actions. But they're unsure. If each omission alone was sufficient (like each pouring poison), it's overdetermination. But if watering by either would have prevented death, then both omissions are necessary in a way. This is tricky. 

  Case 7: Standing still blocking a paramedic. The user feels it's a positive action, not omission. Even though it's about not moving. The distinction might be in how we frame the scenario. Physically, not moving is an omission, but in context, it's seen as an active obstruction. 

  Case 8: City council not funding the levee. Causal, but no specific agent. Collective responsibility. 

  Case 9: Predictive system turns off sprinklers because it knows the user will omit. The user's omission is still part of the causal chain, but the system's action complicates it. 

  The user's half-baked principle involves the action being possible and effective, but cases 3 and 4 challenge that. Case 3 questions "could have done it," and case 4 shows no agent is needed. Also, overdetermination in case 6 is a problem. 

  I need a principle that focuses on counterfactual dependence and normative expectations. The counterfactual approach: if the action had occurred, the outcome would not have happened (in that way). But cases like 6 and 3 might not fit. In case 3, if the stranger had watered, the plant would have survived, so counterfactually it should be a cause. But intuitively, it's not. So maybe adding a normative element: causation by omission requires that the agent had a duty or was expected to act. This explains why the stranger in case 2 might not be causal without duty, but the user thinks he is causally. That's a conflict. 

  Perhaps use a contrastive approach. The cause is relative to what we're comparing. In case 3, we compare the actual world (stranger far away) to a world where he's nearby and waters. But that might not help. 

  Another idea: preemptive causation. In case 9, the system's action preempts the user's omission. But the omission is still part of why the system acted. So the user's omission is a distal cause. 

  For probabilistic cases, if the omission lowers the chance, it's a cause if the probability decrease is significant. But the user asks about a small change (40% to 35%). Is that causation? Probably not, as it's not a substantial factor. 

  The principle I propose combines counterfactual dependence and normal conditions. Omission is a cause if, in the circumstances, the action would normally have occurred and prevented the outcome. Case 3: the stranger isn't expected to water, so not normal. Case 4: rain is a normal condition, so its absence is causal. Case 6: both flatmates should have watered, so both omissions are causes. Case 7: standing still isn't a normal omission; it's an active choice. 

  But case 2 challenges this. The stranger has no duty, but the user still feels it's causal. Maybe here, the omission is causal but not blameworthy. Separating causation from responsibility. 

  The user's confusion might stem from conflating moral responsibility with causal responsibility. In case 2, the stranger's omission is causally relevant but not morally blameworthy. In case 3, the absence of water is causal, but attributing it to the stranger isn't appropriate because he couldn't act. So the cause is the lack of water, not the stranger's omission. The crop failure in case 4 is caused by the absence of rain, not by any specific agent. 

  So the principle: an omission by an agent is causal only if the agent was capable and the action was required in the context. Otherwise, the cause is the absence of the event (like no water) without attributing it to an agent. 

  For case 9: the system's action is based on predicting the omission. The user's omission is still a cause because it led to the prediction and the system's action. Without the omission, the system wouldn't have turned off the sprinklers. So it's a preemptive cause. 

  Confidence in this principle: moderate. The trickiest part is handling overdetermination (case 6) and distinguishing causal from moral responsibility. The least defensible part might be requiring capability, as counterfactually, even an incapable agent's action would have prevented the outcome. But normatively, we don't attribute causation to those who couldn't act. 

  In summary, the key is to separate the causal role of the absence from the agent's responsibility. Use counterfactuals for causation but add normative context for attributing omissions to agents.
answer: |-
  After wrestling with your cases (which are excellent, by the way), I land on a **contrastive-counterfactual account with a normative filter for agentive omissions**. Here's the principle:

  **An omission (by an agent) is a cause of an outcome if:**
  1.  **Counterfactual Dependence:** The outcome would (or would likely) have been different *in the specific way at issue* if the action had been performed *in the actual circumstances*.
  2.  **Normative Expectation (for agents):** The agent was *expected* (morally, functionally, conventionally, or contractually) to perform the action *and* was capable of doing so *in those circumstances*. (This filters *which* absences we attribute *to agents* as *their* omissions being causes).
  3.  **Intact Preventative Path:** The action, if performed, would have prevented the outcome via a mechanism that was *actually operable* at the time (no blockers, fatal diseases, etc.).

  **For non-agentive absences (like no rain):** The counterfactual dependence (1) and intact path (3) suffice for causation; (2) is irrelevant.

  **How it handles your cases:**

  1.  **You don't water (promised):** YES. *Counterfactual:* Watering saves plant. *Normative:* Strong expectation/duty. *Path:* Intact. (*All 3 satisfied*).
  2.  **Stranger doesn't water (no promise, capable):** **NO (as *his* omission being a cause).** *Counterfactual:* YES (if he watered, plant saved). *Normative:* NO (no expectation/duty). *Path:* Intact. (*1 & 3 yes, but 2 no*). The *absence of water* is causal, but we don't attribute it *to the stranger* as *his omission causing it*. This resolves the tension with 3.
  3.  **Stranger doesn't water (incapable):** **NO.** *Counterfactual:* Technically YES (if he *could* water and did, plant saved - but he couldn't). *Normative:* NO (no duty *and* incapability). *Path:* N/A. (*1 is shaky/metaphysical, 2 fails*). The cause is the *absence of water*, not the stranger's omission. This aligns with your gut feel and resolves the tension with 2 by denying agency attribution in both.
  4.  **No rain causes crop failure:** YES (as *non-agentive* absence). *Counterfactual:* Rain prevents failure. *Path:* Intact. (*1 & 3 satisfied, 2 N/A*). Agency not required.
  5.  **You don't water (plant already doomed):** NO. *Counterfactual:* NO (watering wouldn't save it). *Path:* Blocked (disease). (*1 & 3 fail*).
  6.  **Two flatmates omit (both capable):** **YES, *both*.** *Counterfactual (for each):* If *either* had watered alone, plant saved. *Normative:* YES, reasonable expectation on both (shared responsibility). *Path:* Intact. (*All 3 satisfied for each omission*). This is analogous to symmetric overdetermination by action. The outcome depends on *both* omissions: if *only one* omitted, the plant lives. Their joint omission is necessary (in the circumstances).
  7.  **Standing still blocks paramedic:** **Action, not Omission.** Framing matters. The salient fact isn't "failing to step aside" (omission) but "maintaining a blocking position" (action). The counterfactual *is* "if they stepped aside, paramedic passes," but the *way* they are causing the blockage is through an ongoing positive action (maintaining position). We intuitively classify this as an action. (This case highlights the context-dependence of the action/omission distinction).
  8.  **Council never funds levee:** YES (as *collective institutional* omission). *Counterfactual:* Funding likely prevents/mitigates flood. *Normative:* YES, council's functional duty. *Path:* Intact (assuming funding would have built/strengthened levee). Capability assumed. (*All 3 satisfied collectively*). We *can* point to the council as the agent.
  9.  **Predictive system (weird case):** **YES (your omission is *a* distal cause).** *Counterfactual:* If you *had* watered (contrary to prediction), the system likely wouldn't have turned off the sprinkler (or would turn it back on?), and the plant might live. Your *actual* omission is part of why the prediction was correct and the system acted. *Normative:* YES (your promise). *Path:* Intact (watering would save it, system aside). The system's action is an *intervening cause*, but your omission is still a *necessary part of the actual causal chain*. The system relies on *your expected omission*.

  **Probabilistic Case (40% → 35%):**
  *   **Strict Counterfactual:** Your omission *did* cause a *tiny* increase in risk (5%). However, for it to be considered *a cause of the specific outcome*, we usually require a more substantial difference (making the outcome *significantly more likely*). The principle would likely say **NO** for this specific death, as the omission wasn't a *substantial factor* in bringing it about compared to the baseline. It was a *causal factor* increasing risk, but not *a cause* of the specific outcome. (This is contentious; some accounts might say yes).

  **Confidence & Weakest Link:**
  *   **Confidence:** Moderately high (7/10). This handles most common cases and your intuitions well, especially the crucial distinction between *causal absences* and *agentive omissions as causes*.
  *   **Weakest Link:** **The Normative Expectation requirement (Condition 2).** It's the most philosophically contentious. Why should *causation* depend on *normativity*? Defending it requires accepting that "X's *omission* caused Y" implies more than just counterfactual dependence; it implies X had a *responsibility* to act. We readily accept non-agentive absences as causes without normativity (like no rain), but when we *attribute causation to an agent's omission*, we build in a normative expectation. This is why the capable stranger (Case 2) feels different *as a causal agent* than the rain (Case 4), even though the absence of water is causal in both. The alternative (pure counterfactualism) makes the incapable stranger (Case 3) a cause, which clashes terribly with intuition. I bite the bullet on Case 2 (denying the stranger's omission is *a cause*, though the *absence* is) to avoid the bigger bullet of Case 3 and to preserve the link between agentive omission-causation and responsibility-talk. It's a cost, but the cheapest major cost I see.

  **In essence:** Causation by *absence* is determined by counterfactuals and intact paths. Causation by *an agent's omission* requires that *plus* normative expectation and capability. This explains why we attribute causation to *your* not watering but not to the distant stranger's, even though the plant needed water from *someone*.
