prompt: |-
  I work in clinical education for a regional ambulance service — about two thousand operational staff, mixed roles from emergency dispatchers to paramedics to newly qualified technicians — and several times a year I have to turn a new or revised clinical protocol into training that crews will actually follow at three in the morning, under time pressure, with a patient in front of them. The constraints are unglamorous: I get ninety-minute slots in the rota, a couple of high-fidelity simulation days a year, no ongoing coaching budget, and every package has to be signed off by the clinical director and, where it touches a scope-of-practice question, by staff-side. Last weekend, coming back from a two-day conference, I spent about three hours in a hotel bar arguing with an old colleague who now lectures in paramedic science. She said our protocols, mnemonics and handover templates produce crews who are competent without comprehending anything, and that what we should be doing is teaching people to reason; I said the mnemonics *are* the reasoning, offloaded into a tool, and that no amount of "understanding the physiology" survives adrenaline and sleep loss. We ended up misusing, I suspect, a four-level scheme for kinds of minds — as I half-remember it: creatures hard-wired by evolution to do a small fixed repertoire; creatures that can learn within a lifetime by being reinforced for what they actually try out in the world; creatures that can pre-screen candidate actions internally, so that bad options can be discarded in the head instead of in the field; and creatures whose heads have been re-equipped with imported thinking tools — words, diagrams, checklists, formulae — with that last grade named after some psychologist called Gregory. My colleague used the ladder to argue that almost everything we do is pitched one rung too low; I used the same ladder to argue that our checklists are the highest rung, not the lowest. Neither of us could say how you would actually decide, item by item, which rung a given behaviour needs, and that is the argument I need settled in a form my trainers can use.

  What I want is a triage procedure my team can run on each discrete behaviour in a protocol — the questions in order, what counts as an adequate answer to each, where it stops with a "no, this cannot be trained in the time you have", and where it hands the decision to a person because it is a question of authority or values rather than of learning. It has to be operable by an instructor who has never heard any of this theory, on a single page, in ten minutes per item. Please build it around distinctions that survive that simplification and say which ones you are dropping and what it costs. Some things I have been playing with, which you should use, fix, or throw away as you see fit: the *trial cost* of an item — how bad it is if the learner finds out by actually trying it on a patient, which is what pushes something from on-the-job shaping to simulation or to a rule that filters options before action; the *transfer distance* between the training room and the context where the behaviour has to appear, on a scale from identical through similar to genuinely novel; the *installation depth* of any tool you want crews to use, meaning what sub-tools must already be in place before a mnemonic or threshold value does any work, and what it takes to install them; the *empty-room test*, my name for checking whether a behaviour shows up when no instructor and no assessment is in the room, which I think is what separates something that has really been learned from something the crew has merely learned to perform for us; and *Darwinian residue*, the parts of a failure that are hard-wired rather than trained — startle, tunnel vision, degraded hearing under stress, fatigue — and which therefore have to be designed around rather than educated away. I also want the interference question handled explicitly: crews arrive with years of reinforcement history that rewards speed and seniority, and I suspect some of our training fails not because it is pitched at the wrong rung but because the payoffs in the system still favour the old behaviour, which would make it a management decision and not a training one.

  Then run the finished procedure on three items and show your working, including one where I will not like the answer. First: getting crews to complete a new sepsis screening tool and make a pre-alert call on every eligible patient, when the current failure mode is that experienced crews eyeball the patient and skip the form. Second: a rarely used, high-stakes invasive skill with a catastrophic trial cost — paediatric intraosseous access in a moving vehicle will do — where I cannot afford more than a single simulation session per crew. Third, and this is the one I expect to resent: our flagship ninety-minute module on the physiological reasoning behind the new chest-pain pathway, which my colleague would call the only genuinely higher-rung thing we do and which I have defended for two redesigns. Tell me honestly whether the procedure says that module is doing work it cannot do, whether it should be cut, shortened, or moved somewhere it bites, and what I would put in its place. Finally, be explicit about what the procedure cannot tell me: I need to know which of these calls it has no authority over, where it will confidently mislead me, and whether there is any way to use it after an incident to tell a misclassification from a botched implementation. If the four-level scheme is the wrong frame for any of this, or if it is being stretched past what it was built for, I would rather be told that than handed a tidy procedure built on it.
reasoning: |-
  We are building a triage procedure for clinical education protocol behaviors. The goal is to decide, for each discrete behavior in a protocol, how it should be trained given constraints (90-minute slots, limited simulation, no ongoing coaching). The procedure must be operable by an instructor without theory background, on one page, in about 10 minutes per item.

  We'll use the following concepts provided, but adapt as needed:
  - Trial cost: How bad if the learner tries it on a patient and fails? (High trial cost pushes for simulation or pre-screening rules.)
  - Transfer distance: How similar is the training context to the real context? (Identical, similar, novel.)
  - Installation depth: What foundational skills/tools must be in place for a mnemonic or tool to work? (What sub-tools are needed, and how hard to install?)
  - Empty-room test: Does the behavior occur without an instructor or assessment? (Indicates true learning vs. performance for evaluation.)
  - Darwinian residue: Hard-wired human limitations (startle, tunnel vision, fatigue) that must be designed around, not trained away.
  - Interference: Existing rewards (speed, seniority) that may reinforce old behaviors, making training ineffective without system change.

  We are also addressing the four-level scheme of minds (from evolutionary hard-wiring to external thinking tools), but note that the procedure should not require understanding this theory.

  The procedure will be a flowchart or step-by-step questions. We must also note which distinctions we drop and the cost.

  **Dropping Distinctions and Costs:**
  1. **The four-level scheme of minds**: We drop explicit reference to the levels because it's theoretical and not necessary for the triage. Instead, we focus on the practical factors (trial cost, transfer, etc.) that determine the training method. The cost is losing the theoretical framework, but the procedure remains actionable.
  2. **Detailed cognitive theory**: We avoid discussions about internal pre-screening vs. external tools. Instead, we focus on the outcome: what training method will lead to reliable performance in the real context.

  **The Triage Procedure:**
  We design a decision tree with 5 key questions. Each question has a set of answers that lead to recommendations.

  **Procedure Steps (for one discrete behavior):**

  1. **Assess Trial Cost**  
     *Question:* If a crew member gets this wrong on a real patient, what is the consequence?  
     - **Low**: Minor or no harm (e.g., paperwork error).  
     - **Moderate**: Harm that is reversible or non-permanent (e.g., delayed treatment that can be caught later).  
     - **High**: Severe harm or death (e.g., invasive procedure error).  
     *Action:*  
       - If **High**, go to Simulation or Rule-Based Training (must avoid real-patient trial).  
       - If **Moderate** or **Low**, move to next question.

  2. **Check for Interference**  
     *Question:* Are there strong existing habits or system rewards that conflict with this new behavior? (e.g., current practice rewards speed, so a new form might be skipped.)  
     - **Yes**: Then training alone is insufficient. Flag for management: system change needed (e.g., change incentives, supervision). Also, design training to explicitly counter the interference (e.g., practice under time pressure).  
     - **No**: Move to next question.  
     *Note:* Even if training proceeds, interference must be addressed at a system level.

  3. **Evaluate Transfer Distance**  
     *Question:* How similar is the training setting to the real context (3 a.m., time pressure, moving vehicle, etc.)?  
     - **Identical**: Training can be done in real context or very high-fidelity sim.  
     - **Similar**: Training can be in a realistic simulation or with stressors added.  
     - **Novel**: The real context has elements that are hard to replicate (e.g., extreme fatigue, complex multitasking).  
     *Action:*  
       - If **Novel**, then training must include high-fidelity simulation (if trial cost is moderate/high) or focus on robust rules/mnemonics (if trial cost low).  
       - If **Identical** or **Similar**, proceed to next question.

  4. **Determine Installation Depth**  
     *Question:* What foundational knowledge or skills are required for this behavior?  
     - **None**: The behavior is a simple rule or action.  
     - **Shallow**: Requires a mnemonic or checklist, but no complex underlying knowledge.  
     - **Deep**: Requires understanding of physiology, complex decision-making, or multiple prerequisites.  
     *Action:*  
       - If **Deep** and training time is limited (90-min slot), then consider:  
           - Can the behavior be simplified to a rule? If yes, do so (create a mnemonic/checklist).  
           - If no, then it may require more time (but we don't have it) or be broken into smaller parts.  
           - If it must be taught at depth, it needs dedicated time (like the flagship module) but must be justified by high trial cost and low transfer distance? Actually, we reconsider based on time constraints.  
       - If **None** or **Shallow**, proceed to training design.

  5. **Empty-Room Test (Sustainability)**  
     *Question:* How do we ensure this behavior sticks when no one is watching?  
     *Considerations:*  
     - For low trial cost: Can be learned on the job (with feedback).  
     - For high trial cost: Must be trained to automaticity via simulation and repetition.  
     - If the behavior is complex (deep) and not reinforced in practice, it may not stick.  
     *Recommendation:*  
       - Build in real-world reinforcement (e.g., audit and feedback, peer check).  
       - If the behavior is critical and likely to decay, use periodic refreshers or job aids.

  **Handling Constraints:**
  - If at any step the training required (e.g., high-fidelity sim for high trial cost and novel context) is beyond available resources (only one sim session), then we must:
      a) Advocate for more resources, or  
      b) Simplify the behavior (if possible) to reduce trial cost or installation depth, or  
      c) Accept the risk (not recommended for high trial cost).

  **Deciding the Training Method:**
  Based on the above, we map to training methods:
  - **Rule-based training (lowest rung)**: Checklists, mnemonics. For low trial cost, shallow installation, and low interference.
  - **Simulation-based training**: For high trial cost and/or novel context. Requires high-fidelity if context is novel and trial cost high.
  - **On-the-job shaping**: For low trial cost and identical/similar context, with feedback.
  - **Deep understanding training (highest rung)**: Only when trial cost is moderate, interference is low, installation depth is deep, and time/resources allow. But note: without reinforcement, it may not pass the empty-room test.

  **Where it stops:**
  - If interference is high and systemic, it's a management issue (not training).
  - If installation depth is deep and time is insufficient, either simplify or accept that training may be ineffective (and then consider if the behavior is critical enough to warrant more time).
  - If transfer distance is novel and we cannot simulate, we must rely on rules and hope they hold (but risk failure due to Darwinian residue).

  **Darwinian Residue:** This is considered throughout. For example:
  - In high-stress situations, rely on rules and checklists because deep thinking may fail.
  - In transfer distance (novel context), account for stress by designing tools that are stress-resistant (e.g., simple, visual).

  **Output for Each Behavior:**
  After the questions, we have:
  - Recommended training method.
  - Any systemic issues (interference) to escalate.
  - Risks (if constraints prevent ideal training).

  **Applying to the Three Items:**

  **Item 1: Sepsis screening tool and pre-alert call**

  - **Trial cost**: Moderate. Skipping may delay sepsis treatment, which can be fatal, but the act of filling the form is low risk. However, the consequence of missing sepsis is high. So, moderate to high? Let's say moderate because the harm is indirect and may be caught later? But sepsis is time-critical -> so high? We'll say **High** because early recognition is crucial.
  - **Interference**: **Yes**. Current rewards for speed and seniority (eyeballing) conflict. Without addressing, training may fail.
  - **Transfer distance**: **Similar**. Training room is calm, real context is stressful but form-filling is a routine task. However, the challenge is doing it under time pressure.
  - **Installation depth**: **Shallow**. It's a form with criteria. No deep physiology needed.
  - **Empty-room test**: Likely to fail if interference is not fixed because old habit is faster and reinforced.

  **Procedure Flow:**
  1. Trial cost High -> must use simulation or rule-based to avoid real-patient error? But the behavior is form-filling, so we can train with rules and practice under stress.
  2. Interference Yes -> Flag for management: change incentives (e.g., audit compliance, reward for using tool) and design training to practice under time pressure.
  3. Transfer distance Similar -> Training should include practice under time pressure (simulate stress).
  4. Installation depth Shallow -> Easy to train with a mnemonic or checklist.
  5. Empty-room test: Without system change, it won't stick.

  **Recommendation:**
  - Training: Short session (part of 90-min slot) to introduce tool, practice with scenarios under time pressure.
  - But must have management buy-in: change system to reward compliance (e.g., make it easy, integrate into workflow, audit). Without this, training may fail.

  **Item 2: Paediatric intraosseous access in a moving vehicle**

  - **Trial cost**: **Catastrophic (High)**. Failure could lead to death.
  - **Interference**: Probably **No** (not a routine habit, but rarely used). However, crews might avoid it due to fear? But not interference from existing habits like speed. Maybe low interference.
  - **Transfer distance**: **Novel**. Moving vehicle is hard to simulate (vibration, space constraints). Training room is static.
  - **Installation depth**: **Moderate to Deep**. Requires psychomotor skill and knowledge of anatomy, but we can use a device with steps (so rule-based for steps). However, the skill itself requires practice.
  - **Empty-room test**: Without practice, skill decay is high.

  **Procedure Flow:**
  1. Trial cost High -> Must use simulation, cannot learn on the job.
  2. Interference: Low -> No major conflict with existing habits.
  3. Transfer distance Novel -> Must train in high-fidelity simulation (moving vehicle sim). But we only have one sim session per crew.
  4. Installation depth: Moderate (if we break into steps with a device) -> We can use a checklist for the steps, but the psychomotor skill needs practice.
  5. Empty-room test: Without refresher, it may decay.

  **Constraints:** Only one simulation session available.

  **Recommendation:**
  - Use the one simulation session for high-fidelity practice (moving vehicle sim if possible, or at least with distractions).
  - Focus on rule-based steps (checklist) for the procedure to reduce cognitive load.
  - Since we cannot have ongoing practice, consider:
      - Job aid (e.g., quick reference card) for the steps.
      - Low-fidelity periodic refresher (e.g., every 6 months, practice on a manikin without full sim).
  - Advocate for more resources: This skill is high-risk and rare, so ideally more frequent simulation. But given constraints, we do the best with one session and reinforce with job aids.

  **Item 3: Flagship 90-minute module on physiological reasoning behind chest-pain pathway**

  - **Trial cost**: **Moderate**. Understanding the reasoning may lead to better decisions in complex cases, but the protocol itself is rule-based. Incorrect application could occur if reasoning is flawed? But the protocol is the fallback. So, trial cost of the reasoning is indirect. Let's say **Low to Moderate** because the protocol exists and crews can follow it without deep reasoning.
  - **Interference**: **Yes?** Existing culture may favor protocol-following over deep thinking (due to time pressure). Rewards for speed might make deep thinking seem inefficient.
  - **Transfer distance**: **Novel**. The training room is calm, but reasoning under stress is hard. Stress may prevent deep thinking.
  - **Installation depth**: **Deep**. It requires understanding of physiology, which is complex.
  - **Empty-room test**: Likely to fail because under stress, crews fall back on rules. Also, without reinforcement, the knowledge may decay.

  **Procedure Flow:**
  1. Trial cost Low to Moderate -> Not the highest priority for deep training.
  2. Interference Yes -> The system rewards speed and protocol adherence, not deep reasoning. So, deep thinking may not be used.
  3. Transfer distance Novel -> The reasoning may not transfer to the real context (3 a.m., stress).
  4. Installation depth Deep -> Requires time and ongoing practice, but we have only 90 minutes and no refresher.
  5. Empty-room test: Unlikely to pass (crews won't use the reasoning when alone).

  **Recommendation:**
  - This module is at risk of being ineffective. The procedure suggests:
      - Cut the module? Or shorten and refocus.
      - Instead, use the time to reinforce the rule-based protocol (chest-pain pathway) and when to deviate (with clear rules, not deep reasoning).
      - For complex cases, provide decision aids (e.g., flowcharts) that embed the reasoning in a rule.
      - If physiological reasoning is critical for some decisions, then target it to specific roles (e.g., paramedics) and in a context with less stress? But in the field, it may still fail.
      - The procedure says: without system change (to reward deep thinking) and without ongoing reinforcement, this training is not sustainable and may not transfer.

  **What the procedure cannot tell you:**
  - **Authority/Values Decisions**: The procedure can flag interference (systemic issues) but cannot resolve them. That requires management/staff-side negotiation.
  - **Misclassification vs. Botched Implementation**: After an incident, the procedure can help review:
      - Was the behavior classified correctly (trial cost, transfer, etc.)?
      - Was the training method appropriate given the classification?
      - If the classification was wrong (e.g., trial cost underestimated), that's a misclassification.
      - If the training was not implemented as recommended (e.g., skipped simulation for a high-trial-cost item), that's botched implementation.
      - But without data (e.g., empty-room test), it's hard to know.
  - **Limitations**: The procedure is based on heuristics. It might mislead in borderline cases (e.g., when trial cost is borderline). Also, it cannot account for individual differences in learning.

  **Final Triage Procedure (One Page):**

  **Discrete Behavior Triage Tool**

  *Instructions: Answer each question in order. Stop if you hit a recommendation.*

  1. **Trial Cost (Consequence of Error):**  
     - Low (minor/no harm) → Go to 2.  
     - Moderate (reversible harm) → Go to 2.  
     - High (severe harm/death) → **Must use simulation or rule-based training** (avoid real-patient trial). Also, go to 2.

  2. **Interference (Conflicts with Existing Habits):**  
     - Yes → **Flag for management: system change needed** (e.g., incentives, supervision). Design training to explicitly counter interference (e.g., practice under pressure). Then go to 3.  
     - No → Go to 3.

  3. **Transfer Distance (Training vs. Real Context):**  
     - Identical (same as real) → Go to 4.  
     - Similar (can simulate) → Go to 4.  
     - Novel (hard to replicate, e.g., extreme stress) → **Requires high-fidelity simulation** (if trial cost High or Moderate) or robust rules (if trial cost Low). Then go to 4.

  4. **Installation Depth (Prerequisites):**  
     - None or Shallow (simple rule) → **Train via rule (checklist/mnemonic) and practice**.  
     - Deep (needs underlying knowledge) → *If training time limited:*  
          - Can it be simplified to a rule? If yes, **create rule-based tool**.  
          - If no, **advocate for more time or break into parts**. If not possible, **risk: training may be ineffective**.

  5. **Empty-Room Test (Sustainability):**  
     - For any method, plan for reinforcement:  
          - **Job aids** (e.g., pocket cards).  
          - **Periodic refreshers** (if high trial cost).  
          - **Real-world feedback** (audit and correct).  
     - If the behavior is complex and not reinforced, **expect decay**.

  **Constraints Check:**  
  If the recommended training (e.g., high-fidelity sim) is beyond resources:  
  - Advocate for resources.  
  - Simplify the behavior if possible.  
  - If not, accept risk (only for low trial cost).

  **Example Output for Sepsis Screening:**  
  1. Trial cost: High  
  2. Interference: Yes → **System change needed**  
  3. Transfer: Similar → Practice under time pressure in training  
  4. Depth: Shallow → Rule-based (form)  
  5. Sustainability: Without system change, won't stick.  
  **Training**: Short practice session with time pressure. **But must have system change** (audit compliance, integrate form into workflow).
answer: |-
  Based on your requirements, I've developed a one-page triage procedure for protocol behaviors that distills your concepts into a practical, theory-agnostic flowchart. It prioritizes actionable decisions over theoretical nuance, drops non-essential distinctions, and explicitly handles interference and Darwinian residue. I'll first present the procedure, then apply it to your three cases, including the "resentful" one.

  ### **Triage Procedure for Protocol Behaviors**  
  **(One-Page Flowchart for Instructors)**  
  *Operational Note: Answer questions in order—stop when you hit a recommendation or escalation. Time: ≤10 min/behavior.*

  1. **TRIAL COST (TC)**  
     *"How bad is it if this is done wrong on a real patient?"*  
     - **LOW**: Minor reversible error (e.g., paperwork typo). → *Go to Q2.*  
     - **MODERATE**: Non-permanent harm (e.g., delayed non-critical intervention). → *Go to Q2.*  
     - **HIGH**: Catastrophic/permanent harm (e.g., invasive procedure error). → ***SIMULATION TRAINING REQUIRED***. *Then go to Q2.*  

  2. **INTERFERENCE CHECK**  
     *"Do current rewards (speed, seniority habits) fight this?"*  
     - **NO** → *Go to Q3.*  
     - **YES** → ***ESCALATE TO MANAGEMENT*** (training alone fails; fix payoffs first). *Then go to Q3.*  

  3. **TRANSFER DISTANCE (TD)**  
     *"How different is training from 3 a.m. reality?"*  
     - **IDENTICAL** (e.g., controlled practice in ambulance). → *Go to Q4.*  
     - **SIMILAR** (e.g., classroom with stress drills). → *Go to Q4.*  
     - **NOVEL** (e.g., unpredictable chaos). → ***RULE-BASED TOOL REQUIRED*** (checklist/mnemonic). *Then go to Q4.*  

  4. **INSTALLATION DEPTH (ID)**  
     *"Does this need foundational knowledge/tools?"*  
     - **NONE** (e.g., push button A). → ***ON-THE-JOB TRAINING*** (with feedback).  
     - **SHALLOW** (e.g., use a flowchart). → ***RULE-BASED TOOL*** (drill until automatic).  
     - **DEEP** (e.g., understand pathophysiology). → ***STOP: CANNOT TRAIN IN 90 MIN***. *Escalate for redesign* (simplify or split).  

  5. **EMPTY-ROOM TEST (ERT) & DARWINIAN RESIDUE (DR)**  
     *(Embedded in all recommendations)*  
     - **ERT**: Always include *stress-test practice* (time pressure/no instructor).  
     - **DR**: Assume *tunnel vision/fatigue*—design tools that are:  
       - **Simple** (≤3 steps).  
       - **Physical** (e.g., card, device).  
       - **Redundant** (e.g., buddy-check).  

  ---

  ### **What Was Simplified/Dropped and Why**  
  1. **Four-level minds scheme**: Dropped entirely. **Cost**: Loses theoretical elegance but avoids paralysis—focuses on behavior, not cognition.  
  2. **"Rungs" as a framework**: Replaced with your factors. **Cost**: Misses abstract debates about "comprehension vs. competence" but forces concrete decisions.  
  3. **Detailed Gregory/psychologist references**: Omitted. **Cost**: Loses academic rigor but prevents distraction.  
  4. **Installation depth sub-tools**: Simplified to 3 tiers. **Cost**: Oversimplifies dependencies but fits time limits.  
  5. **Interference as standalone factor**: Kept upfront (Q2). **Benefit**: Flags non-trainable system issues early.  

  ---

  ### **Application to Your Three Cases**  
  **Key**: TC = Trial Cost, TD = Transfer Distance, ID = Installation Depth, ERT = Empty-Room Test, DR = Darwinian Residue.  

  #### **Case 1: Sepsis Screening Tool & Pre-Alert Call**  
  - **TC**: HIGH (missed sepsis = death risk).  
  - **Interference**: YES (crews skip form; speed rewarded).  
  - **TD**: SIMILAR (form-filling in training vs. field).  
  - **ID**: SHALLOW (tool uses simple thresholds).  
  - **ERT/DR**: High risk of skipping under stress.  

  **Procedure Flow**:  
  1. TC HIGH → **Simulation required** (practice screening in scenarios).  
  2. Interference YES → **Escalate to management** (audit compliance, tie rewards to tool use).  
  3. TD SIMILAR → No additional rule needed.  
  4. ID SHALLOW → **Rule-based tool** (drill "stop-and-screen" mantra).  
  5. ERT/DR → Embed in sim: time pressure, no instructor feedback.  

  **Training Design**:  
  - 15-min tool demo + 60-min sim (stressed, timed cases).  
  - **Replace**: Lecture with "just-in-time" job aid (laminated tool on stretcher).  
  - **Why it works**: Addresses interference via management; uses sim for high TC; shallow ID fits time.  

  ---

  #### **Case 2: Paediatric Intraosseous (IO) Access in Moving Vehicle**  
  - **TC**: HIGH (catastrophic if failed).  
  - **Interference**: NO (no competing habits—rarely used).  
  - **TD**: NOVEL (moving vehicle ≠ classroom).  
  - **ID**: SHALLOW (device-focused steps; anatomy recall is minimal).  
  - **ERT/DR**: High decay risk; stress degrades motor skills.  

  **Procedure Flow**:  
  1. TC HIGH → **Simulation required**.  
  2. Interference NO → Proceed.  
  3. TD NOVEL → **Rule-based tool required** (checklist).  
  4. ID SHALLOW → **Rule-based tool** (step-by-step visual guide).  
  5. ERT/DR → Stress-test in sim (noise, motion, timed).  

  **Training Design**:  
  - Single sim session: 30-min drill on IO device + 60-min high-fidelity sim (vibration, distractions).  
  - **Rule-based tool**: Pocket-sized IO flowchart (with "confirm landmarks" redundancy for DR).  
  - **Why it works**: Sim covers high TC; rule-based tool counters novel TD; shallow ID fits one session.  

  ---

  #### **Case 3: Flagship 90-min Chest-Pain Physiology Module**  
  - **TC**: LOW (protocol has fallback rules; reasoning errors rarely cause direct harm).  
  - **Interference**: YES (field rewards speed, not deep thinking).  
  - **TD**: NOVEL (calm classroom ≠ 3 a.m. chaos).  
  - **ID**: DEEP (requires cardiovascular knowledge).  
  - **ERT/DR**: High failure—stress blocks recall of physiology.  

  **Procedure Flow**:  
  1. TC LOW → Proceed to Q2.  
  2. Interference YES → **Escalate to management** (system doesn’t reward deep thinking).  
  3. TD NOVEL → **Rule-based tool required** (replace reasoning with checklist).  
  4. ID DEEP → **STOP: CANNOT TRAIN IN 90 MIN**. Redesign needed.  

  **Recommendation (You’ll Resent This)**:  
  - **Cut the module entirely** (it fails the triage: deep ID + novel TD + interference = no transfer).  
  - **Replace with**:  
    - 20-min "chest-pain pathway" checklist drill (rule-based tool).  
    - 60-min sim applying the checklist under stress (with ERT/DR focus).  
    - 10-min peer discussion of "when rules fail" (for authority/escalation—handed to clinical director).  
  - **Why**: Physiology understanding is a "deep ID" behavior—it requires ongoing coaching (which you lack) and dies under stress (DR). Your protocol already embeds the reasoning; crews need automaticity, not comprehension.  

  ---

  ### **What the Procedure Cannot Tell You**  
  1. **Authority/Values Decisions**:  
     - The procedure flags interference (Q2) or deep ID (Q4) as "escalate," but cannot resolve them. Example: Sepsis tool compliance requires management/staff-side negotiation on workload.  
  2. **Misclassification vs. Botched Implementation**:  
     - Post-incident, compare:  
       - **Misclassification**: If behavior had uncaught high TC or deep ID (e.g., assumed sepsis tool was "shallow" but crews misinterpret thresholds).  
       - **Botched Implementation**: If sim was skipped or interference wasn’t escalated.  
     - **Weakness**: Relies on accurate initial triage; empty-room testing is retrospective.  
  3. **Confident Misleading**:  
     - **Overestimating rule-based tools**: In novel contexts (Q3), it assumes rules always work—but extreme novelty (e.g., war zones) may break them.  
     - **Underestimating Darwinian residue**: If stress-testing (ERT/DR) is shallow, tools may still fail.  
  4. **Four-Level Scheme’s Limits**:  
