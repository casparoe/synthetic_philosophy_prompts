  Practice 4 is the real stinger though. The vertebrate/invertebrate double standard in welfare considerations seems to contradict the otherwise scientific approach. Like, we'll carefully model population genetics for insects but deny them the pain considerations we give rodents? That inconsistency clearly bothers the user.

  Hmm... the user asks if someone who takes insect welfare seriously could still work within this system. That's telling - they might be personally wrestling with this. The answer requires distinguishing between wholesale rejection versus modification. One could accept economic thresholds while adding ethical weightings, or keep refuges while minimizing suffering in control methods. But the current system's complete exclusion of insect welfare would indeed need fundamental rethinking.

  The user's phrasing "what does that package presuppose" suggests they want the unstated assumptions exposed. So I should highlight the anthropocentrism (only human interests count), utilitarianism (cost/benefit calculus), and biological reductionism (insects as gene vehicles rather than subjects of experience). 

