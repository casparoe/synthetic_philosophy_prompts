answer: |-
  I think you've put your finger on the core frustration beautifully, and your diagnosis of the three entangled knots—verbal slippage, divergent explanatory goals, and the measurement-proxy problem—is spot on. Where I suspect the real engine of perpetual stalemate lies is in the third: the measurement problem masquerading as a theoretical one. Your friend's point about literacy as the mechanism, for instance, hinges entirely on the proxies available. If "Protestantism" is measured by denomination or region in the quantitative studies, and literacy correlates tightly with that, concluding that literacy is the *real* cause while "work ethic" is just a story attached to the residual, assumes that the proxy *is* the culture. But what if intense belief *drove* the literacy push? Weber’s argument wasn’t just about being *labeled* Protestant; it was about internalizing a specific, anxiety-driven relationship to work and worldly success as a sign of grace. When the proxy (denomination/region) captures both the potential cultural driver *and* its institutional/human capital consequences (like literacy rates, schooling), disentangling cause from effect or identifying the primary mechanism becomes impossible with that data alone. The "joint test" failure means every negative result can be dismissed as a bad proxy by culturalists, and every seeming cultural effect can be dismissed as an unmeasured institutional factor by institutionalists. Neither side’s core claim is ever cleanly falsified.

  Your proposed tests are intelligent attempts to cut this knot. The **carry-on test** (does the "effect" travel with migrants holding specific beliefs?) is conceptually powerful. If second-generation migrants from Protestant regions exhibit higher thrift/entrepreneurship *only* if they retain specific religious beliefs/practices, not just their origin or nominal category, that leans towards values-as-cause. But the measurement problem bites again: how do you *measure* "retained belief" and "intensity of practice" independently of outcomes like work habits or savings rates? Self-reporting is noisy, behavioral observation is costly. If you use outcomes as proxies for belief, it risks circularity. The **blocked-expression test** (does the effect disappear under oppressive institutions preventing accumulation and reappear when lifted?) is equally insightful. If a strong thrift ethic exists but can't manifest materially under serfdom or confiscatory states, yet drives accumulation once institutional barriers fall, that strongly suggests culture as a latent cause. But proving the ethic *existed* during the blocked period is the hurdle – you’d need diaries, sermons, folklore, or other "internal" evidence from the suppressed period, which is scarce. Both tests *aim* to isolate the cultural mechanism, but both still rely on proxies susceptible to contamination or interpretation, potentially collapsing back into the joint test morass.

  So, can it be ended? A single knockout dataset is unlikely. But progress *is* possible by:

  1.  **Embracing the Layered Nature:** Conceding that "culture" and "institutions" aren't monolithic competing causes, but interacting layers. Specific cultural values (e.g., sanctifying disciplined work) might make populations more likely to *demand* or effectively *utilize* certain institutions (like literacy programs, property rights enforcement). Conversely, institutions shape which cultural traits are rewarded/punished. Your friend’s literacy point might actually *support* Weber if Protestant anxiety drove communities to invest heavily in human capital *as an expression* of that ethic.
  2.  **Shifting the Question:** Instead of "which one is *the* cause?", ask "through what specific, measurable mechanisms do cultural factors (values, norms, identities) interact with institutions and material conditions to produce outcomes?" This moves beyond the residual accusation on both sides.
  3.  **Better Measurement (The Hard Part):** This is the frontier. Combining quantitative data with deep qualitative work (ethnography, discourse analysis of historical texts, detailed migrant studies assessing beliefs *before* major economic transitions) to build better proxies or direct measures. Natural experiments are rare, but instances like sudden institutional collapse (e.g., post-Soviet states) or mass migrations under varying institutional receptions offer glimpses. Tracking not just *what* people did, but *how they talked and felt* about it contemporaneously is key.

  Honestly, asking "can culture be a cause?" *is* partly badly posed. It implies culture is a single, static, monolithic "thing" that acts like a billiard ball. Culture is a complex system of meanings, practices, and schemas that shapes perception, valuation, and action. It *can* be a causal factor, but never in isolation, and its causal power is always mediated through individual agency and institutional structures. The debate persists because both sides often talk past each other – one focusing on subjective meaning and internal motivation (Weber's original project), the other on objective, population-level correlations and counterfactual dependencies (modern social science). Dissolving the question into "how do cultural factors function within broader causal chains?" is probably wiser than seeking a final yes/no verdict. You might not "win" the argument with your friend, but you can elevate it beyond the residual vs. residual stalemate by insisting on specifying mechanisms and demanding better evidence for the *content* and *intensity* of the cultural factors in play, not just the labels. Go home, but take the refined question with you.
