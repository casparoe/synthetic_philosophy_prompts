  ### **Fine-Tuning Argument Decision Tree**  
  *Start at Node 1. Answer yes (Y) or no (N).*

  #### **Node 1: Is the fine-tuning datum (e.g., cosmological constant sensitivity) methodologically sound?**  
  *Meaning: Is it robust to varying constants individually, and is "life-permitting" well-defined with a non-arbitrary measure over theory space?*  
  - **Y** → Node 2.  
  - **N** → **Leaf A: "Illusion"** (e.g., methodological skepticism).  
    *Awkward: Must explain why physicists take fine-tuning seriously without such caveats.*  

  #### **Node 2: Does observer-selection alone fully explain the datum?**  
  *Meaning: Is no further mechanism needed because observers can only exist in life-permitting universes?*  
  - **Y** → Node 3.  
  - **N** → Node 4.  

  #### **Node 3: Is our observation location a random sample from all possible observers?**  
  *Meaning: Does "observer" include any self-aware entity (e.g., Boltzmann brains), or only complex/long-lived ones?*  
  - **Y** → **Leaf B: "Anthropic Brute Fact"** (unnamed, SIA-like).  
    *Awkward: Predicts we should be minimal observers (e.g., Boltzmann brains), but we aren't.*  
  - **N** → **Leaf C: "Restricted Selection"** (unnamed, SSA-like).  
    *Awkward: Reference-class restriction appears ad hoc to avoid Boltzmann problems.*  

  #### **Node 4: Does the explanation make our universe typical among an ensemble?**  
  *Meaning: Is fine-tuning resolved by our universe being non-unique (e.g., multiverse)?*  
  - **Y** → Node 5.  
  - **N** → Node 8.  

  #### **Node 5: Does the ensemble include universes with different fundamental laws?**  
  *Meaning: Does variation go beyond constants (e.g., string landscape vs. inflationary multiverse)?*  
  - **Y** → Node 6.  
  - **N** → Node 6.  
  *Note: Distinction rarely affects later steps; handled in Node 7.*  

  #### **Node 6: Are observer-containing universes common in the ensemble?**  
  *Meaning: Is the fraction of life-permitting universes non-negligible (e.g., >1/10^120)?*  
  - **Y** → Node 7.  
  - **N** → **Leaf D: "Rare Universe"** (e.g., single-shot multiverse).  
    *Awkward: Re-introduces fine-tuning for the ensemble parameters.*  

  #### **Node 7: Why aren’t we in a minimal universe (e.g., a Boltzmann brain)?**  
  *Meaning: Minimal observers require less "tuning" and should dominate if possible/weighted.*  
  - **Minimal observers are impossible** → **Leaf E: "Lawful Constraints"** (e.g., no-Boltzmann quantum gravity).  
    *Awkward: Must prove minimal observers violate physical laws.*  
  - **Minimal observers are disfavored by weighting** → **Leaf F: "Observer-Counting"** (e.g., SIA multiverse).  
    *Awkward: Minimal universes may vastly outnumber complex ones, outweighing weighting.*  
  - **Minimal observers exist, but we are in one** → **Leaf G: "Boltzmann Brain"** (unnamed).  
    *Awkward: All memories/order are likely illusions.*  

  #### **Node 8: Is the universe aimed at life via an intentional agent?**  
  *Meaning: Does the explanation invoke goals, purpose, or design?*  
  - **Y** → **Leaf H: "Design"** (e.g., theism, deism).  
    *Awkward: Regress (e.g., "Who designed the designer?").*  
  - **N** → **Leaf I: "Impersonal Principle"** (e.g., axiarchism, necessity).  
    *Awkward: No causal mechanism linking abstract principles to concrete constants.*  

  #### **Node 9: Is the principle logically/mathematically necessary?**  
  *Meaning: Could constants be different without contradiction?*  
  - **Y** → **Leaf I: "Impersonal Principle"** (subtype: logical contingency).  
    *Awkward: No known derivation of constants from pure logic.*  
  - **N** → **Leaf I: "Impersonal Principle"** (subtype: axiarchism/value).  
    *Awkward: How does "value" create physical existence?*  

  ---

  ### **Key Features & Rationale**  
  1. **Cut #1 (Datum legitimacy)**: Directly addresses your concern about methodology. "Illusion" (Leaf A) is a valid exit.  
  2. **Cut #2 (Selection effects)**: Splits brute-force anthropics (Leaves B/C) from explanations needing mechanisms. Tests reference-class assumptions.  
  3. **Cut #3 (Typical vs. Aimed)**: Forces a clean split. Typical-making requires a *non-unique* universe (Node 4); aimed-making does not.  
  4. **Minimal universe challenge**: Core to typical-making (Node 7). Exposes hidden costs of multiverses (e.g., Boltzmann brains in Leaf G).  
  5. **Collapsed positions**:  
     - **"Plenitude" (all possible universes)**: Folded into Node 6. If life-permitting universes are common → Node 7; if rare → Leaf D.  
     - **Design vs. Plenitude**: Distinguishable! Design (Leaf H) aims at life; plenitude (via Node 6) makes life *typical*.  
     - **Brute Fact + Selection vs. Multiverse**: Separated by Node 4. Brute fact (Leaves B/C) lacks an ensemble; multiverse (Leaves E/F/G) requires one.  
  6. **Unresolvable pairs**:  
     - *Leaf F (Observer-Counting) & Leaf G (Boltzmann Brain)*: Only distinguishable if minimal observers are impossible (Leaf E) or weighted away.  
     - *Leaf H (Design) & Leaf I (Impersonal)*: Only separable by intentionality (Node 8), but both face "why this universe?" challenges.  

  ### **Changes to Your Spec**  
  - **Cut #2 refinement**: Merged reference-class and "random sample" into Node 3 for brevity.  
  - **Cut #3 simplification**: "Aimed-at" impersonal principles (e.g., necessity/value) share a leaf (I) with a sub-node (Node 9) to avoid excess leaves.  
  - **Typical-making subtypes**: Law-variation (Node 5) rarely affects outcomes, so it isn't a major branch. "Everything possible exists" is handled under Node 6.  

  ### **Printable Format**  
  The tree fits one page as a flowchart:  
  1. Start → Node 1 → (Y/N) → [A or Node 2]  
  2. Node 2 → (Y/N) → [Node 3 or Node 4]  
  3. Node 3 → (Y/N) → [B or C]  
  4. Node 4 → (Y/N) → [Node 5 or Node 8]  
  5. Node 5 → (Y/N) → Node 6  
  6. Node 6 → (Y/N) → [D or Node 7]  
  7. Node 7 → (3 options) → [E, F, or G]  
  8. Node 8 → (Y/N) → [H or Node 9]  
  9. Node 9 → (Y/N) → [I (subtypes)]  

  Leaf codes (A-I) allow quick reference. Designed for meetups: focuses on *where disagreements start* (e.g., Node 1 vs. Node 2) rather than rehashing arguments.
