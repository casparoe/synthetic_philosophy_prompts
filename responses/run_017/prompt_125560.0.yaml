  Hmm... their three questions are precise: 
  1) Is the flat payoff at intersections (always 8/5 regardless of q) due to specific payoffs or general structure? 
  2) Why randomization matters fundamentally here unlike normal decisions? 
  3) What's the real philosophical disagreement - just about self-locating credence or something deeper?

