answer: |-
  Based on the details provided, the optimal strategy to maximize your average payout is to tap **TAKE**. Here's a step-by-step explanation of why, including the role of the 72% same-choice rate and the conditions under which the answer would flip to SPLIT.

  ### Why TAKE is Better Given the Current Numbers
  - The payoffs are:
    - Both SPLIT: $600 each.
    - Both TAKE: $100 each.
    - One TAKE, one SPLIT: TAKE gets $1000, SPLIT gets $0.
  - Your flatmate is correct that TAKE dominates SPLIT in a one-off game with no information about the other player: if the other SPLITs, TAKE gives you $1000 vs. $0; if the other TAKES, TAKE gives you $100 vs. $0. So, without any correlation, TAKE is always better.
  - However, the matching system adds correlation: you're paired with someone who has a similar decision-making profile, and people matched this way choose the same option 72% of the time. Additionally, 70% of all users tap SPLIT.
  - This correlation affects the expected value (EV) of your choice because your action is likely to influence what the other person does (due to shared decision-making traits), even though you choose simultaneously.

  To calculate the expected payout:
  - Let \(P_s = 0.70\) be the probability that a random user taps SPLIT.
  - Let \(P_{\text{same}} = 0.72\) be the probability that both players choose the same option.
  - Given the correlation, we compute the conditional probabilities:
    - If you SPLIT, the probability that the other SPLITs is \(P(\text{other SPLIT} | \text{I SPLIT}) = 0.80\).
    - If you TAKE, the probability that the other TAKES is \(P(\text{other TAKE} | \text{I TAKE}) = 8/15 \approx 0.533\).
  - Now, calculate the expected value (EV) for each choice:
    - **EV if you SPLIT**: 
      - With 80% probability, both SPLIT → $600.
      - With 20% probability, you SPLIT and they TAKE → $0.
      - EV = \(0.80 \times 600 + 0.20 \times 0 = 480\).
    - **EV if you TAKE**:
      - With ~53.3% probability, both TAKE → $100.
      - With ~46.7% probability, you TAKE and they SPLIT → $1000.
      - EV = \((8/15) \times 100 + (7/15) \times 1000 = 7800/15 = 520\).
  - Since 520 > 480, TAKE has a higher expected payout by $40.

  The 72% same-choice rate increases the EV of SPLIT compared to a no-correlation scenario (where SPLIT would only yield $420), but it decreases the EV of TAKE (which would be $730 without correlation). However, TAKE still comes out ahead.

  ### What the 72% Same-Choice Rate "Buys" You
  - The 72% rate (indicating strong correlation due to matching) makes SPLIT less bad than it would be otherwise, but it doesn't make it better than TAKE in this case.
  - Specifically:
    - With correlation (72% same choice), choosing SPLIT gives an EV of $480.
    - Without correlation (if choices were independent), SPLIT would only yield $420 (since \(P(\text{other SPLIT}) = 0.7\), so EV = \(0.7 \times 600 + 0.3 \times 0 = 420\)).
    - Thus, the 72% same-choice rate "buys" you an extra $60 in EV if you choose SPLIT, by increasing the chance that the other person also SPLITs.
  - However, for TAKE:
    - With correlation, TAKE gives $520.
    - Without correlation, TAKE would yield \(0.3 \times 100 + 0.7 \times 1000 = 730\).
    - So the correlation "costs" you $210 in EV if you choose TAKE, by reducing the chance that the other person SPLITs when you TAKE.
  - Despite this, TAKE remains the better choice because $520 > $480. The 72% rate doesn't change the dominance of TAKE; it only narrows the gap from $310 (without correlation) to $40.

  ### When the Answer Flips to SPLIT
  The decision flips to SPLIT if the numbers change such that the EV of SPLIT is greater than or equal to the EV of TAKE. This depends on both the overall SPLIT rate (\(P_s\)) and the same-choice rate (\(P_{\text{same}}\)).

  - **General condition for SPLIT to be better**: \(600a > 1000 - 900b\), where:
    - \(a = P(\text{other SPLIT} | \text{I SPLIT})\)
    - \(b = P(\text{other TAKE} | \text{I TAKE})\)
  - This simplifies to \(6a + 9b > 10\).
  - Using the relationships with \(P_s\) and \(P_{\text{same}}\), we find that SPLIT is better when:
    \[
    3P_{\text{same}} (2 + P_s) + 7P_s - 10P_s^2 - 6 > 0
    \]

  For the current \(P_s = 0.70\):
  - SPLIT becomes better if \(P_{\text{same}} \geq 0.7407\) (approximately 74.07%).
    - For example, if \(P_{\text{same}} = 0.74\) and \(P_s = 0.70\), EV of SPLIT ≈ $490 and EV of TAKE ≈ $490 (equal).
    - If \(P_{\text{same}} = 0.80\) and \(P_s = 0.70\), EV of SPLIT ≈ $514 and EV of TAKE ≈ $400, so SPLIT is better.

  For the current \(P_{\text{same}} = 0.72\):
  - SPLIT becomes better if \(P_s \leq 0.6624\) (approximately 66.24%).
    - For example, if \(P_s = 0.65\) and \(P_{\text{same}} = 0.72\), EV of SPLIT ≈ $471 and EV of TAKE ≈ $460, so SPLIT is better.
    - If \(P_s = 0.25\) and \(P_{\text{same}} = 0.72\), EV of SPLIT ≈ $264 and EV of TAKE ≈ $268, so TAKE is still slightly better (but very close).

  In the app, \(P_s = 70\%\) and \(P_{\text{same}} = 72\%\), which is not in the region where SPLIT is better. The numbers would need to change significantly:
  - If \(P_s\) stays at 70%, \(P_{\text{same}}\) needs to rise to about 74% or higher.
  - If \(P_{\text{same}}\) stays at 72%, \(P_s\) needs to fall to about 66% or lower.

  ### Conclusion
  - **What to tap**: Tap **TAKE** to maximize your expected payout. With the given numbers, this yields $520 on average vs. $480 for SPLIT.
  - **Role of the 72%**: It increases the value of SPLIT by making coordination more likely but not enough to outweigh the risk-reward of TAKE. It reduces the EV gap between TAKE and SPLIT from $310 (no correlation) to $40, but TAKE remains optimal.
  - **When it flips**: If the same-choice rate were about 74% or higher (with 70% SPLIT rate), or if the SPLIT rate were about 66% or lower (with 72% same-choice rate), then SPLIT would be better.

  Since you care only about average payout and not risk, TAKE is the clear choice here. Your flatmate's "no-brainer" argument holds, and the 72% doesn't change that—it just makes SPLIT less of a bad option. Your other friend's point about "deciding for both" is intuitive but mathematically incorrect under these conditions.
