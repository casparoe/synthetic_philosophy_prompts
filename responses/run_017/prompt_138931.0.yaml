prompt: |-
  Me and my girlfriend had a stupid arguement while travelling. We were in Tokyo, I didn't tip at a small ramen place, and she hit me with "when in Rome, do as the Romans do" like that settled it. Then later on the same trip she crossed with everyone else instead of waiting for the light and used the exact same line on me. I've been turning it over since and I think that proverb is doing several different jobs at once and none of them is obvious.

  Your'e a professional philosopher who specialises in social norms and everyday conventions. Take your time, brainstorm the possible readings before you settle on your final list. What I want is a menu of the precise claims "when in Rome, do as the Romans do" could be making, from the totally trivial to the really strong, with a verdict on each one: trivial, defensible, or actually false, and what would have to be true for it to hold. Some things I want covered: is it about coordination (if everyone queues, cutting in is unfair because your'e taking advantage of the people who followed the rule), or about not giving offence, or about respect for a culture as such, or just about not making trouble for yourself? Does it tell me to do what the Romans actually do, or what they think they ought to do? Can it ever require me to break a convention from home, or only to pick up new ones? And does it matter whether the locals would even notice, or whether they care, or whether the convention partly exists as a way of sorting locals from tourists?

  Then the part I actually care about: which of those readings, if any, would make her right that I did something wrong by not tipping somewhere tipping isn't expected — and is tipping the same shape of case as queueing and jaywalking, or does something come apart?

  Lead with your bottom line in the first sentence, then give the menu, no preamble and don't restate my question back at me.
reasoning: |-
  Okay, the user is asking about the proverb "When in Rome, do as the Romans do." They had an argument with their girlfriend about tipping in Tokyo and jaywalking. They want a breakdown of possible interpretations of the proverb, categorized as trivial, defensible, or false, with conditions for each to hold. They also want to know if their girlfriend was right about the tipping incident and how tipping compares to jaywalking.

  First, I need to list all possible readings of the proverb. Let me brainstorm different angles. One is the descriptive claim: doing what Romans actually do. But that could be trivial because it's just observing behavior without a moral obligation. Then there's the coordination aspect: following norms to avoid free-riding, like in queueing. That might be defensible if the norm relies on mutual cooperation.

  Another angle is avoiding offense. If an action would offend locals, then following the norm shows respect. But that depends on whether locals actually care. For example, tipping in Japan might confuse rather than offend, so this might not hold. Then there's cultural respect—doing it to honor the culture itself. But that could be problematic if the norm is harmful or if locals don't expect tourists to comply.

  Epistemic deference: Romans know their norms best. But this might not apply if the norm is simple or if the tourist understands it. Self-interest is another reading—avoiding trouble. That's pragmatic but not morally weighty.

  Now, applying this to tipping versus jaywalking. For tipping in Japan, where it's not customary, not tipping follows the local norm. Tipping might actually cause confusion or embarrassment. So the user not tipping was correct. His girlfriend's use of the proverb here might not hold under most readings. The offense-avoidance reading might not apply because locals aren't offended; they might refuse the tip. Coordination isn't relevant since tipping isn't a system requiring cooperation.

  Jaywalking in Tokyo, though, is different. If locals jaywalk when it's safe, doing so might be about coordination—moving with the group for efficiency. Also, self-interest: not standing out or causing disruption. So in that case, following the local practice is defensible.

  The user's deeper need is probably understanding why their girlfriend applied the proverb inconsistently and whether their actions were justified. They might also want reconciliation strategies or clarity on cultural norms. By breaking down the proverb, they can see that context matters—different situations require different readings. Tipping isn't like jaywalking because the impacts and norms differ. Highlighting these distinctions can help them resolve the argument by showing that both cases aren't equivalent under the proverb's various interpretations.
answer: |-
  **Bottom Line:** Your girlfriend's use of "When in Rome" for tipping in Tokyo was likely misplaced under most plausible readings of the proverb, while its application to jaywalking has stronger, though not absolute, defensibility; tipping and jaywalking differ significantly in their underlying norm structures.

  **Menu of Readings for "When in Rome, Do as the Romans Do" (WINR):**

  1.  **Descriptive Triviality:**
      *   **Claim:** "Observe what actions Romans *actually perform* in specific situations."
      *   **Verdict:** Trivial (True by definition).
      *   **Conditions:** Pure behavioral observation. No normative force implied.
      *   *Relevance to Cases:* Tells you Romans *don't* tip and *do* sometimes jaywalk. Doesn't say you *should* do either.

  2.  **Coordination/Convention Adherence:**
      *   **Claim:** Follow local conventions to avoid free-riding or disrupting mutually beneficial coordination equilibria (like queueing, traffic flow, market customs).
      *   **Verdict:** Defensible.
      *   **Conditions:** The norm must function as a coordination device where individual deviation harms the system's efficiency/fairness *and* locals rely on predictable adherence. Locals don't need to notice/care about *your* specific action, only that the *system* works.
      *   *Relevance to Cases:* **Jaywalking:** Can be defensible if crossing *with the group* maintains pedestrian flow/safety rhythm locals rely on. Standing alone waiting *might* disrupt flow. **Tipping:** Not applicable. Tipping isn't a coordination system in non-tipping cultures; not tipping doesn't disrupt a system locals rely on.

  3.  **Avoidance of Offense/Social Friction:**
      *   **Claim:** Conform to avoid causing offense, embarrassment, or social discomfort to locals (or yourself).
      *   **Verdict:** Defensible, but context-dependent.
      *   **Conditions:** Locals would likely notice *and* genuinely care about/could be offended by deviation. The action must be interpretable as disrespectful within *their* framework. "Notice" and "Care" are crucial.
      *   *Relevance to Cases:* **Tipping:** **Likely False for Japan.** Tipping in Japan often causes confusion, embarrassment, or requires refusal; *not* tipping is expected and neutral/positive. Locals typically don't notice or care if a tourist doesn't tip, as it's the norm. **Jaywalking:** **Potentially Defensible.** Not jaywalking when locals do might mark you as an oblivious tourist, potentially causing minor annoyance in a busy flow. Deliberately flouting a "no jaywalking" sign locals *do* respect might cause offense.

  4.  **Respect for Culture/Deference to Local Sovereignty:**
      *   **Claim:** Conform as a gesture of respect for the culture/host society itself, acknowledging their right to set local norms. It's about the symbolic act of deference.
      *   **Verdict:** Defensible, but nuanced and potentially weak for minor conventions.
      *   **Conditions:** The norm is recognized as part of the local culture/social fabric. Respect is the primary motivation. Doesn't strictly require locals to notice *your* action, but the *intent* matters. Strength increases with the norm's cultural significance.
      *   *Relevance to Cases:* **Tipping:** **Weak/Neutral.** Not tipping *is* respecting the local custom. Tipping could be seen as imposing your own custom. **Jaywalking:** **Weak/Neutral.** Following *or* not following a widely flouted traffic rule isn't a strong gesture of cultural respect either way unless deeply symbolic (which it's not).

  5.  **Epistemic Deference ("Romans Know Best"):**
      *   **Claim:** Romans possess superior knowledge about what is appropriate, effective, or morally sound within their context; defer to their judgment via their actions.
      *   **Verdict:** Potentially Defensible, but Highly Suspect.
      *   **Conditions:** Romans have unique contextual knowledge *and* their actions reliably reflect considered local wisdom (not just habit or historical accident). Requires the norm to be locally beneficial/justified.
      *   *Relevance to Cases:* **Tipping:** **False.** Japanese service norms reflect a different social contract; tipping isn't "wrong" there, it's simply irrelevant/confusing. **Jaywalking:** **Potentially Defensible (Situationally).** Locals might know the safest/most efficient times to cross specific streets better than a tourist reading a static signal.

  6.  **Prudential Self-Interest (Avoiding Trouble):**
      *   **Claim:** Conform to avoid negative consequences like conflict, fines, poor service, or social awkwardness.
      *   **Verdict:** Trivial/Defensible (Pragmatic, not Moral).
      *   **Conditions:** Negative consequences are likely enough to outweigh the cost of conformity.
      *   *Relevance to Cases:* **Tipping:** **False.** Tipping in Japan is more likely to *cause* awkwardness; not tipping avoids it. **Jaywalking:** **Defensible.** Not jaywalking avoids a fine (if enforced) or potential danger; jaywalking *with* locals might reduce risk of fine/danger compared to doing it alone.

  7.  **Moral Universalism Disguised:**
      *   **Claim:** This *specific* Roman norm happens to align with a universal moral principle you *should* follow anyway.
      *   **Verdict:** False (as an interpretation of WINR).
      *   **Conditions:** WINR itself isn't making this claim; it's using local practice as the *reason*, which is invalid for universal morals. The moral principle must stand independently.
      *   *Relevance to Cases:* WINR doesn't apply here. Tipping/jaywalking norms aren't typically universal moral issues.

  8.  **Signaling Belonging/Avoiding "Otherness":**
      *   **Claim:** Conform to avoid standing out as an outsider or to signal a (temporary) willingness to belong, where the norm functions partly as an identifier.
      *   **Verdict:** Defensible for social integration, but weak as a moral claim.
      *   **Conditions:** Locals use the norm (consciously or not) to distinguish insiders/outsiders, *and* avoiding "otherness" is a desired goal in the situation.
      *   *Relevance to Cases:* **Tipping:** **False.** Not tipping is the local signal; tipping marks you as an outsider. **Jaywalking:** **Defensible.** Crossing with the crowd avoids marking yourself as a hesitant tourist and integrates you into the local flow.

  **Application to Your Cases & Tipping vs. Jaywalking:**

  *   **Tipping in Tokyo (Where Not Expected):**
      *   **Descriptive:** Romans *don't* tip -> You *didn't* tip -> You followed the descriptive triviality.
      *   **Coordination:** Not applicable (no coordination system disrupted).
      *   **Avoiding Offense:** **You were likely *correct* not to tip.** Tipping could cause offense/awkwardness; not tipping is expected and unremarkable. Locals generally don't notice or care if a tourist doesn't tip.
      *   **Respect:** Not tipping *is* respecting the local custom. Tipping could be seen as disrespectful imposition.
      *   **Epistemic:** Deference supports *not* tipping.
      *   **Self-Interest:** Supports *not* tipping to avoid awkwardness.
      *   **Signaling:** Supports *not* tipping to blend in.
      *   **Verdict:** Under almost every *defensible* reading of WINR, **you did the correct thing by not tipping.** Using WINR to argue you *should* have tipped in Tokyo is a misapplication. Her claim that you did something wrong via WINR fails.

  *   **Jaywalking in Tokyo (When Others Do):**
      *   **Descriptive:** Romans *sometimes* jaywalk -> You *did* jaywalk -> Followed description.
      *   **Coordination:** **Potentially Defensible.** Crossing *with* a group can maintain local pedestrian flow/safety rhythm. Standing alone might disrupt it.
      *   **Avoiding Offense:** **Potentially Defensible.** Not jaywalking when it's the local flow might mark you as an oblivious tourist causing minor friction; deliberately flouting a rule locals *do* follow could cause offense.
      *   **Respect:** Weak either way, unless rule-breaking is culturally significant (unlikely).
      *   **Epistemic:** **Potentially Defensible.** Locals might better judge safe crossing points.
      *   **Self-Interest:** Supports following the rule (avoid fine/danger) OR jaywalking with locals (potentially safer/finer-free than alone).
      *   **Signaling:** **Defensible.** Crossing with the crowd avoids marking "otherness."
      *   **Verdict:** WINR provides **defensible, though not absolute, reasons** for jaywalking *when crossing with a group as part of the local flow*. It's weaker for solitary jaywalking against a light locals *are* obeying.

  *   **Why Tipping and Jaywalking Differ:**
      *   **Fundamental Norm Structure:** Tipping (in non-tipping cultures) is an *exogenous* act – introducing a foreign custom. Jaywalking (when locals do it) is about participating (or not) in an *endogenous*, situational behavior pattern.
      *   **Impact:** Tipping disrupts by *adding* an unexpected, often unwelcome element. Not jaywalking disrupts (potentially) by *failing to participate* in an established situational flow.
      *   **Offense Potential:** Tipping risks offense via confusion/imposition. Not jaywalking risks offense (minor) via obstructing flow or signaling disdain. *Not* tipping risks no offense.
      *   **Coordination:** Jaywalking flow is a real-time coordination challenge; tipping isn't.
      *   **Signaling:** Not tipping signals conformity in Japan; tipping signals outsider status. Not jaywalking signals outsider status *in that specific flow*; jaywalking signals temporary integration.

  Her use of WINR was inconsistent because the underlying justifications for the norm (coordination, offense avoidance, signaling) apply very differently to these two actions in the context of Tokyo. WINR supported your action (not tipping) and potentially supported hers (jaywalking with the flow), but it did *not* support her claim that you should have tipped.
