prompt: |-
  Hey — I'm writing something on the outside view and I need a worked case, not another planning-fallacy anecdote. Take the 2003 US invasion of Iraq and run it as a strict outside-view forecast. Give me two or three candidate reference classes for something like "a great power forcibly replaces the government of a mid-sized country it doesnt really control and then tries to leave behind a friendly, unified one" — I keep thinking Soviet Afghanistan in 1979 and the American campaign in 2001, but tell me if those are the wrong comparators — and say what base rate each would have given, in March 2003, for the outcome I actually care about: a stable, unified, dependably pro-American Iraq five years on. Mark how confident you'd have been in each number, and how much of it you can only state because you know how the thing turned out. Then run it back the other way: does the case vindicate the outside view, or does it show that "pick a reference class" is really an inside-view judgment in a humble hat? One wrinkle I want taken seriously, my own coinage: a self-negating forecast, where a base rate becoming common knowledge changes what the actors do — proxies instead of boots, exit deadlines, lighter footprints — which changes the class, which changes the rate. Does Iraq show that happening, or is the idea too cute to do any work? And if the framing is wrong — if you think reference classes can't bear this weight, or the choice of outcome variable is doing all the real work, or the whole exercise can't be done in hindsight at all — say so straight out rather than being agreeable. Under a page, please.
reasoning: |-
  Okay, let me tackle this user's query about applying the outside view to the 2003 Iraq invasion. The user wants a strict outside-view forecast, avoiding planning fallacy anecdotes. They're specifically interested in reference classes for "a great power forcibly replacing a government in a mid-sized country and attempting to install a friendly, unified regime," with the outcome being a stable, pro-American Iraq five years post-invasion. 

  First, I need to identify suitable reference classes. The user mentioned Soviet Afghanistan (1979) and the US campaign in Afghanistan (2001). Soviet Afghanistan is a solid comparator—same great power dynamic, regime change, nation-building attempt. The outcome was failure; the Soviet-backed government collapsed quickly after withdrawal. That gives a low base rate for success. 

  The US in Afghanistan (2001) is trickier. By March 2003, it was only 18 months in, and the situation seemed more hopeful—Taliban ousted, Hamid Karzai installed. But even then, experts knew Afghanistan's deep tribal divisions and history of resistance made stability unlikely. Still, compared to Iraq in 2003, it might appear more "successful" in the short term, so I'd assign a slightly higher but still low base rate. 

  Another reference class could be US interventions in the Caribbean/Central America (e.g., Grenada 1983, Panama 1989). These were smaller-scale, with quick handovers to friendly regimes. Success rates here were higher, but the scale isn't comparable to Iraq—smaller countries, less complex societies. So while the base rate might be higher, the applicability is weak. 

  Now, confidence levels: For Soviet Afghanistan, high confidence—the outcome was clear, and the parallels are strong. For Afghanistan 2001, medium-low confidence because it was ongoing; we couldn't know the future collapse yet. For smaller interventions, low confidence due to scale mismatch. 

  Then there's the self-negating forecast idea. Did awareness of past failures (e.g., Soviets in Afghanistan) change US strategy in Iraq? Partly—they avoided Soviet-style occupation but overcorrected with a "light footprint," which backfired by enabling insurgency. So yes, the base rate knowledge altered tactics, but incompetently, leading to a new failure mode. This shows the self-negating aspect has weight, though it didn't improve outcomes. 

  Does this vindicate the outside view? Absolutely. The low base rates from past failures accurately foreshadowed Iraq's outcome. But picking reference classes does involve inside-view judgment—e.g., deciding which conflicts are truly comparable. The user's right to call this "inside-view in a humble hat." 

  Finally, the outcome variable matters. Defining "success" as a stable, unified, pro-American Iraq by 2008 was nearly impossible given historical precedents. The outside view, properly applied, would have screamed "unlikely" based on any reasonable reference class. The exercise holds up even in hindsight, though our knowledge of Iraq's outcome inevitably colors how we weigh the comparators. 

  Key takeaways: Outside view works (low base rates predicted failure), reference class selection has subjective elements, and self-negating forecasts are real but don't guarantee better results. No need to reject the framing—it's robust enough to handle this case.
answer: |-
  Here’s a strict outside-view analysis of the Iraq invasion’s outcome, treating "success" as a **stable, unified, dependably pro-American Iraq by 2008**:

  ### Candidate Reference Classes & Base Rates (as of March 2003):
  1. **Soviet Invasion of Afghanistan (1979)**  
     - **Base rate for success**: 0% (Soviet-backed regime collapsed immediately after withdrawal).  
     - **Confidence**: High. Outcome was already known by 2003; strong parallels in scale, occupation, and local resistance.  
     - *Hindsight contamination*: Minimal. The failure was unambiguous pre-2003.

  2. **US Intervention in Afghanistan (2001–2003)**  
     - **Base rate for success**: ~10–20% (By March 2003, the Taliban were deposed, but instability persisted; Karzai’s control was fragile).  
     - **Confidence**: Medium-Low. Ongoing conflict, but early signs of insurgency and warlordism were evident.  
     - *Hindsight contamination*: Moderate. We now know Afghanistan later unraveled, but in 2003 "success" seemed *plausible* to optimists.

  3. **US "Small Wars" in Caribbean/Central America (e.g., Grenada 1983, Panama 1989)**  
     - **Base rate for success**: ~80% (Pro-US regimes stabilized quickly post-intervention).  
     - **Confidence**: Low. Massive scale mismatch (Iraq’s population: 25M; Grenada: 100K). Ethno-sectarian complexity absent in these cases.  
     - *Hindsight contamination*: Low, but class validity is weak.

  ### Outside View Verdict (March 2003):  
  - **Weighted success probability**: 5–15%.  
  - **Why so low?** Reference classes #1–2 dominate (similar scale/ambition) and show near-universal failure. Class #3 is an outlier due to trivial comparators.  

  ### Did the Outside View Vindicate Itself?  
  **Yes, resoundingly.** The actual outcome (Iraq in 2008: civil war, ~100k dead, fragile government, Iranian influence) aligns perfectly with the low base rates. The outside view would have correctly rejected rosy inside-view predictions (e.g., "democratization domino effect").  

  ### The "Self-Negating Forecast" Wrinkle:  
  - **Did it happen?** Partially. Policymakers *were* aware of historical failures (e.g., avoiding "Soviet-style" occupation). This led to:  
    - A "light footprint" (insufficient troops for security),  
    - Rapid handover to untested Iraqi exiles (creating power vacuums),  
    - Early deadlines for sovereignty (undercutting institution-building).  
  - **Outcome**: Tactics changed, but the *underlying dynamics* (insurgency, sectarian strife) recurred. The reference class *shifted* from Afghanistan/Soviet failures to **Vietnam** (counterinsurgency quagmire), still predicting failure.  
  - **Verdict**: The self-negating effect was real but **incompetently applied**. It altered *methods*, not the outcome’s probability—proving the outside view’s core warning.  

  ### Critique of the Framing:  
  - **"Picking a reference class is inside-view in disguise"**: Valid. Choosing between Afghanistan (weak state) and Panama (tiny compliant state) requires subjective judgment about which factors matter.  
  - **Outcome variable doing the work?** Partly. "Stable, unified, pro-US" is a high bar; defining it as "no civil war" would yield a higher base rate (e.g., Panama succeeded). But the *specific aspiration* for Iraq matches Classes #1–2.  
  - **Hindsight bias?** Mitigated here by using pre-2003 known outcomes (e.g., Soviet failure was clear; Afghanistan’s 2003 fragility was documented).  

  ### Bottom Line:  
  The outside view would have assigned **<15% probability** to a stable, pro-US Iraq by 2008. Iraq’s collapse validates this. Self-negating adjustments occurred but were half-measures that ignored deeper structural risks (sectarianism, institutional vacuum). The exercise holds: reference classes *can* bear this weight if anchored to rigorous comparators (scale, stakes, local conditions), though class selection remains a nuanced art.  

  ---  
  *Under one page: 498 words. Key insight: Outside view wins, but its warnings are often "applied poorly" rather than "invalid."*
