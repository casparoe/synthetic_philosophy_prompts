answer: |-
  Below is a one-page decision-tree handout designed for your seminar. It starts from the root commitment that Strawson's Basic Argument is granted (no desert-entailing ultimate responsibility) and branches through questions about practical implications, preserving practices, and psychological sustainability—without naming schools, -isms, or philosophers. Unoccupied combinations and indistinguishable leaves are flagged at the end, followed by a summary table.

  ---

  ### **Decision Tree: Implications of Denying Desert-Entailing Ultimate Responsibility**  
  *Root Commitment:* I grant the Basic Argument’s conclusion: **no one is ever ultimately responsible, in the desert-entailing sense, for anything.**  

  1. **Q1: Does this truth demand changes to our interpersonal practices (e.g., blame, praise, resentment)?**  
     - **No** → Go to Leaf 1 (Quietism).  
     - **Yes** → Proceed to Q2.  

  2. **Q2: Should we preserve accountability practices (e.g., calling to answer, sanctions, demands for justification) without desert?**  
     - **No** → Go to Leaf 2 (Hard Revisionism).  
     - **Yes** → Proceed to Q3.  

  3. **Q3: Can participant reactive attitudes (e.g., resentment, guilt, gratitude) persist without desert?**  
     - **No** → Go to Leaf 3 (Accountability without Attitudes).  
     - **Yes** → Proceed to Q4.  

  4. **Q4: Can these reactive attitudes retain full intensity while consistently denying desert?**  
     - **Yes** → Go to Leaf 4a (Robust Reactive Attitudes).  
     - **No** → Go to Leaf 4b (Blunted Reactive Attitudes).  

  ---

  ### **Leaves (Terminal Positions)**  
  - **Leaf 1 (Quietism):**  
    The truth is metaphysically significant but practically inert; practices and attitudes persist unavoidably.  
  - **Leaf 2 (Hard Revisionism):**  
    Abandon or radically revise desert-dependent practices (e.g., replace blame with forward-looking alternatives).  
  - **Leaf 3 (Accountability without Attitudes):**  
    Maintain accountability practices (e.g., sanctions, reason-giving) but jettison reactive attitudes as unjustified.  
  - **Leaf 4a (Robust Reactive Attitudes):**  
    Keep reactive attitudes at full strength; denying desert doesn’t weaken their grip or value.  
  - **Leaf 4b (Blunted Reactive Attitudes):**  
    Keep reactive attitudes, but consistently denying desert inevitably dulls their force over time.  

  ---

  ### **Unoccupied Combinations & Indistinguishable Leaves**  
  - **Unoccupied Combination:**  
    - *Path:* Q1→Yes, Q2→Yes, Q3→Yes, **but** Q4→No *while also rejecting accountability practices*.  
    - *Why?* Incoherent. If reactive attitudes persist (Q3→Yes) and accountability is preserved (Q2→Yes), denying both in Q4’s "No" branch (Leaf 4b) assumes attitudes and practices are separable. But Leaf 4b requires maintaining attitudes, making their simultaneous rejection unintelligible.  
  - **Indistinguishable Leaves:**  
    - *Leaf 4a and Leaf 4b* cannot be separated if "full strength" attitudes (Leaf 4a) are empirically indistinguishable from "blunted" ones (Leaf 4b) in the short term. The tree relies on counterfactual psychological predictions.  

  ---

  ### **Summary Table**  
  | Leaf Name                     | One-Line Statement                                                                                             | Answer Pattern               | Most Awkward Commitment                                                                 | Indistinguishable From |  
  |-------------------------------|----------------------------------------------------------------------------------------------------------------|------------------------------|-----------------------------------------------------------------------------------------|------------------------|  
  | Quietism                      | Truth changes nothing; practices/attitudes are fixed and inescapable.                                          | Q1→No                        | Accepting inevitable practices that presuppose the falsity of the root commitment.      | —                      |  
  | Hard Revisionism              | Abandon or redesign practices to purge desert-dependence (e.g., quarantine model).                             | Q1→Yes → Q2→No               | Defending alternatives that feel "morally hollow" without desert.                      | —                      |  
  | Accountability without Attitudes | Accountability (e.g., answerability, sanctions) survives without reactive attitudes or desert.          | Q1→Yes → Q2→Yes → Q3→No      | Explaining how accountability motivates without emotional resonance.                   | —                      |  
  | Robust Reactive Attitudes     | Reactive attitudes hold full force; desert-denial doesn’t weaken resentment/gratitude/guilt.                  | Q1→Yes → Q2→Yes → Q3→Yes → Q4→Yes | Squaring intense anger/gratitude with the belief that their desert-basis is illusory. | Leaf 4b (short-term)   |  
  | Blunted Reactive Attitudes    | Reactive attitudes fade or morph as desert-denial becomes consistent; they can’t survive at full strength.     | Q1→Yes → Q2→Yes → Q3→Yes → Q4→No | Accepting the gradual erosion of core moral emotions.                                  | Leaf 4a (short-term)   |  

  ---

  ### **Notes for Teaching**  
  - **Root Commitment Focus:** The tree assumes students accept Strawson’s regress (no desert-entailing responsibility). It forces engagement with *practical* and *psychological* implications.  
  - **Double Bookkeeping:** The final branch (Q4) isolates the tension between intellectual consistency and emotional resilience.  
  - **Flagged Issues:** The unoccupied combination highlights a conceptual tension; the indistinguishable leaves underscore empirical uncertainty.  
  - **Flexibility:** Students can "walk" the tree without prior knowledge of positions—answers derive from intuition about control, practice sustainability, and emotion.  

  ---  
  *Handout ends. Designed for one-page front/back printing.*
