prompt: |-
  I write the user-facing emails and in-app messages for a mid-size health insurer — the boring, high-stakes ones: your claim has been approved; your coverage ends on the 15th; were sorry for the delay; someone from our team will call you within two business days. A few dozen of these ship every release, I get maybe ten minutes per message, and anything that could be read as a promise, a waiver, a warning or a refusal has to be signed off by legal, so I need to be able to say in advance which lines are actually doing something and which just report something.

  Can you write me a procedure my team can run line by line? Ground it in the speech act stuff — Austins felicity conditions, the difference between a misfire where the act doesnt happen at all and an abuse where it happens but is hollow, illocution versus perlocution, indirect speech acts — but it has to be usable by someone whos never heard any of that. I want: the questions in order, what counts as a good enough answer to each, the point where it stops with a no and sends the line to legal, and the point where it has to stop and hand the call to a person because its a values question not a facts question. Also tell me which bits of the theory you had to drop to make it usable and which you refused to drop.

  Two things we keep tripping over that the procedure has to handle. First, weve started calling some of these shadow performatives: sentences with the grammar of a plain report that do the work of an act, like your complaint has been logged said at the moment the caseworker logs it, or I hear that youre upset functioning as a brush-off. When is that fine and when is it evasive, and how do I tell the difference without asking the writer what they meant? Second, sentences built to be deniable: Im not saying we wont cover this, just that well need more documentation.

  Then run it on three of our actual lines: your information is safe with us; this decision may be appealed within 180 days; weve noted your concern about how the adjuster spoke to you. Tell me which one comes out worst for us and why, and be straight about where a procedure like this is just going to misfire given ten minutes and no training.
reasoning: |-
  We are going to design a procedure that a team can run line by line on a message to determine:
  1. Whether the line is "just reporting" (constative) or is performing an action (performative).
  2. Whether it requires legal sign-off.
  3. When it must be handed to a person because it's a values question (e.g., about empathy, fairness, etc.).

  We'll use speech act theory (Austin, Searle) without the jargon. We'll focus on:
  - Felicity conditions: for a performative to be successful, it must be said by the right person, in the right context, with the right intentions, and the audience must understand it appropriately.
  - Misfire: the act doesn't happen at all because conditions aren't met (e.g., not authorized, wrong procedure).
  - Abuse: the act happens but is insincere (e.g., promising without intent to fulfill).
  - Illocution: the act performed in saying something (e.g., warning, promising, apologizing).
  - Perlocution: the effect on the listener (e.g., persuading, alarming).

  We'll also handle:
  - Shadow performatives: sentences that look like reports but are actually performing an action.
  - Deniable language: sentences that avoid direct commitment but imply something.

  The procedure will be a checklist of questions. We'll stop and send to legal if:
  - The line could be interpreted as making a promise, waiver, warning, or refusal (or similar acts).
  - We are unsure about the felicity conditions (e.g., is the sender authorized?).
  - There is potential for abuse (insincerity) that could lead to legal issues.

  We'll stop and hand to a person (e.g., a supervisor, customer service) if:
  - The line involves a values judgment (e.g., empathy, fairness) that cannot be decided by a rule.

  We drop some nuances of the theory for usability:
  - We won't distinguish every type of illocutionary act (e.g., verdictives, exercitives, etc.) but focus on high-stakes ones: promises, warnings, refusals, apologies, etc.
  - We won't require the team to analyze perlocutionary effects in depth because they are too variable. Instead, we focus on the intended illocution and potential for harm.

  We refuse to drop:
  - The core idea of felicity conditions because they are critical for avoiding misfires and abuses.

  Procedure for each line:

  Step 1: Is this line purely factual? (Report of past or present state)
    - Does it only state what has happened, what is happening, or what will happen without any commitment or action from the company? 
    - Example: "Your claim was processed on January 1st." -> This is a report.
    - If yes, mark as "report" and no legal needed. Skip to Step 5.
    - If no, go to Step 2.

  Step 2: Could this line be interpreted as the company doing something? (Performative)
    - Look for verbs that are actions: approve, deny, warn, promise, apologize, guarantee, refuse, note (as in officially record), etc.
    - Also, be alert for shadow performatives: 
        - "Your complaint has been logged." -> This is doing the act of logging (if said at the time it's done).
        - "We note your concern." -> This is performing the act of acknowledging and recording.
    - How to tell without knowing intent? Ask: 
        - If we say this, does it change the state of the world? (e.g., now the complaint is officially recorded, now the clock starts on an appeal)
        - Would the customer reasonably take this as the company having carried out an action?
    - If no, mark as "report" and go to Step 5.
    - If yes, go to Step 3.

  Step 3: Check felicity conditions for misfire (will the act be valid?)
    - Ask:
        - Is the person/entity sending this authorized to perform this act? (e.g., only some roles can approve claims)
        - Are we following the correct procedure? (e.g., is the appeal period really 180 days? Is this the right way to log a complaint?)
        - Is the context appropriate? (e.g., we don't apologize for something we didn't do)
    - If any of these are uncertain, stop and send to legal. (Because we might be misfiring: the act doesn't happen and we could be liable.)
    - If all are met, go to Step 4.

  Step 4: Check for abuse (hollow act)
    - Ask: 
        - Is the act insincere? (e.g., we say "we apologize" but we don't feel sorry, or we say "we note your concern" but we won't do anything with it and that's against policy)
        - Could the customer reasonably feel misled? (e.g., we say "we note your concern" but there's no system to track it, so it's hollow)
    - If we are being insincere or if there's a risk of being perceived as insincere in a way that could cause harm or legal issues, stop and send to legal. (They might want to rephrase or have a record.)
    - If not, go to Step 5.

  Step 5: Check for deniable language and indirect acts
    - Look for: 
        - Negative statements: "I'm not saying we won't cover this, just that we need more documentation." -> This implies a refusal but doesn't say it directly.
        - Hedges: "This decision may be appealed." (vs. "You can appeal")
    - Ask: 
        - Is the line trying to avoid saying something directly that it is still communicating? 
        - Could it be interpreted as a warning, refusal, or promise even if not explicit?
    - If yes, then we have an indirect speech act. Go to Step 6.
    - If no, then the line is clear. Mark as approved (unless Step 4 flagged for legal, then it's already there).

  Step 6: For indirect acts, ask:
    - Is the indirectness necessary? (e.g., to be polite, or because of policy)
    - Is it too vague? Could it cause confusion?
    - Could it be seen as evasive? (e.g., we're avoiding responsibility)
    - If it's evasive or confusing, stop and hand to a person (e.g., a senior writer or customer experience) because it's a values question: how direct should we be? How much empathy is needed?
    - If it's acceptable, then check if the indirect act is one that requires legal sign-off (like a refusal). If so, send to legal. Otherwise, mark as approved.

  After all steps, if the line is a report and has no indirect acts, it's approved without legal.

  Now, let's run the three examples:

  Example 1: "Your information is safe with us."

  Step 1: Is it purely factual? 
    - It's a statement about the current state. But "safe" is not just a fact; it implies a commitment. So no.

  Step 2: Could it be doing something?
    - It's performing the act of assuring or promising security. It's a shadow performative: looks like a report but functions as a promise. Yes.

  Step 3: Felicity conditions:
    - Are we authorized to promise security? Only if we have measures in place. 
    - Are we following procedure? We must have security measures. But without knowing, we must check: is this true? If we had a breach, this would be a misfire. -> Uncertain, so send to legal.

  Step 4: (We skipped because Step 3 sent to legal) But note: if we don't have adequate security, it's also abuse (insincere).

  Step 5: Not directly deniable, but indirectly it's a promise. But Step 3 already sent to legal.

  Verdict: Requires legal sign-off.

  Example 2: "This decision may be appealed within 180 days."

  Step 1: Is it purely factual? 
    - It's reporting a possibility. But note: it's also performing the act of informing the customer of their right. So it's both.

  Step 2: Yes, it's a performative: it's informing the customer of their right, and by saying this, we might be starting the clock or fulfilling a legal obligation to inform.

  Step 3: Felicity conditions:
    - Are we authorized? Yes, we must inform of appeal rights.
    - Correct procedure? We must get the timeframe right (180 days). If that's the rule, then yes. But if we are not sure, legal must confirm the timeframe is correct. -> So we need legal to confirm the number of days.

  Step 4: Abuse: If we say this but then don't accept appeals, that's abuse. But the sentence itself is not insincere if we do accept appeals.

  Step 5: It uses "may" which is deniable? Not really. It's standard legal language. But note: "may" can be interpreted as permissive (you are allowed) rather than possibility. So it's clear.

  But Step 3: We need legal to confirm the 180 days is correct. So send to legal.

  Verdict: Requires legal sign-off because the number of days must be exact.

  Example 3: "We've noted your concern about how the adjuster spoke to you."

  Step 1: Factual? It says we've noted (past action). But it's a shadow performative: by saying this, we are performing the act of acknowledging and recording the concern.

  Step 2: Yes, it's a performative act of noting.

  Step 3: Felicity conditions:
    - Are we authorized? Yes, we can note concerns.
    - Correct procedure? We must have a system to note concerns. If we don't, it's a misfire. If we do, then it's valid. But without knowing, we must check: is this true? If we didn't actually note it, then misfire. -> We need to be sure. So if the writer is just saying this without a system, then it's a problem.

  Step 4: Abuse: If we note it but then do nothing and our policy requires follow-up, then it's hollow. But the sentence doesn't promise follow-up. Still, the customer might expect something. We must avoid creating false expectations.

  Step 5: It's indirect: it doesn't say what we'll do. But it's not evasive? It's acknowledging. However, the customer might think we'll act on it. So we need to be clear in our policy what "noted" means.

  Step 6: It's indirect about future action. Is it evasive? It might be if we have no intention of doing anything. So we need to consider: are we being evasive? This is a values question: should we promise follow-up? Hand to a person (e.g., customer experience lead) to decide if we should add more or if this is enough.

  But note: Step 3 requires that we actually have a system. So we must check with legal or operations: do we have a system? If not, then it's a misfire and legal must know.

  Alternatively, we can break:

  - Step 3: If we don't know if we have a system, send to legal to confirm we have the procedure and it's followed.
  - Step 6: The evasiveness is a values issue: hand to a person.

  Verdict: 
    - First, send to legal to confirm we have a system and that we did note it (Step 3). 
    - Then, if legal approves, hand to customer experience to check if it's too evasive and if we should add more (Step 6).

  But in a 10-minute review, we might not have time for both. Since the evasiveness is a values issue and not a legal one per se, we might:

  - In Step 3, if we are uncertain about the system, send to legal.
  - In Step 6, if it's approved by legal, then we note that the line might be evasive and hand to customer experience. But time is short, so we might have to flag both.

  However, the procedure says: if at any point we have a values question, hand to a person. We can do that after legal if needed.

  Which one comes out worst?

  The first one: "Your information is safe with us" is the worst because it's a blanket promise that might not be true (security is never 100%). Legal will likely reject it and ask for a more qualified statement.

  The second one is standard and legal will just confirm the days.

  The third one is tricky because it involves a customer's feelings and might require empathy. Also, without a system, it's a problem.

  But the first is the worst because it's a direct promise that could lead to liability if breached.

  Where the procedure might misfire in 10 minutes with no training:

  - Step 2 (identifying shadow performatives) might be hard. Untrained staff might miss them and mark as report.
  - Step 3 (felicity conditions) requires knowing internal procedures that the writer might not know. They might have to guess or skip, which is risky.
  - Step 6 (values) is subjective and might require discussion.

  But the procedure at least forces the team to think about these issues and flag when in doubt.

  Revised procedure for clarity:

  **Line-by-Line Procedure for Message Review**

  For each line, ask:

  1. **Is it a simple report?** 
     - Does it only state a fact (like a date, a past action, or a current state) without any commitment or action from the company?
     - *Yes*: Mark as "REPORT" and go to 5.
     - *No*: Go to 2.

  2. **Is the line doing something?**
     - Look for action words (like approve, deny, log, note, apologize, promise, warn) or phrases that might function as an action (like "we've noted" meaning we are recording it now).
     - *No*: Mark as "REPORT" and go to 5.
     - *Yes*: Go to 3.

  3. **Can we actually do this? (Felicity: Misfire Check)**
     - Check:
       - Is the sender allowed to do this? (e.g., only claims specialists can approve claims)
       - Are we following the rules? (e.g., the appeal period is 180 days by policy)
       - Is this true? (e.g., if we say we logged it, we must have a logging system)
     - *Uncertain or No*: Send to LEGAL. Stop for this line.
     - *Yes*: Go to 4.

  4. **Are we being sincere? (Felicity: Abuse Check)**
     - Check:
       - Do we mean it? (e.g., if we apologize, we are sorry; if we note, we will actually consider it)
       - Could the customer feel misled? (e.g., if we say "we note" but then ignore it, and the customer expects action)
     - *Uncertain or No*: Send to LEGAL. Stop for this line.
     - *Yes*: Go to 5.

  5. **Is it clear and direct?**
     - Look for:
       - Negative language: "I'm not saying we won't cover..." which might imply we won't.
       - Vague words: "may", "might", "possibly"
       - Hedges: "kind of", "sort of", "in a way"
     - *No, it's indirect*: Go to 6.
     - *Yes, it's direct*: Mark as "APPROVED".

  6. **Is the indirectness acceptable?**
     - Ask:
       - Is it necessary (for politeness or policy)?
       - Could it cause confusion?
       - Does it feel evasive? (e.g., we're avoiding responsibility)
     - *Uncertain or Yes (evasive)*: Hand to PERSON (customer experience/senior writer). Stop.
     - *No, it's acceptable*: Then, check: is the indirect act one that requires legal? (e.g., if it's an indirect refusal, then send to legal). Otherwise, mark as "APPROVED".

  Note: At any step, if you are unsure, default to sending to legal or handing to a person.

  For the three examples:

  1. "Your information is safe with us." 
     - Step 1: Not simple report (it's a promise).
     - Step 2: Yes, doing something (promising).
     - Step 3: Uncertain (is it safe? we can't guarantee absolute safety) -> LEGAL.
     - Verdict: Worst because it's an overpromise.

  2. "This decision may be appealed within 180 days."
     - Step 1: Not purely factual? It's informing of a right -> Step 2: Yes, doing something (informing).
     - Step 3: Must confirm 180 days is correct -> LEGAL.

  3. "We've noted your concern about how the adjuster spoke to you."
     - Step 1: Not just factual (it's a performative: noting).
     - Step 2: Yes.
     - Step 3: Must confirm we have a system and did note -> LEGAL.
     - Then, Step 5: It's direct? Actually, it's direct about noting. But Step 6: It doesn't say what's next -> so Step 5: it is direct? Or Step 6: It might be indirect about future action? 
       - After Step 4, we go to Step 5: it's direct about noting. But then Step 5: no deniable language? It's clear. So approved? 
       - However, we must also consider Step 4: if we note but do nothing, it might be abuse. But we already checked in Step 4.

  But note: Step 4 might have flagged if we are insincere. If we have a system and we do review these notes, then it's okay.

  But the problem is: the customer might expect more (like an investigation or apology). So we might need to add: "We will review this with the adjuster." or something. Without that, it might be seen as a brush-off. This is a values issue: how much should we say? So after Step 5, we might see that it's direct but incomplete? 

  Actually, the procedure doesn't catch that. We might need an additional step for empathy/customer experience. We can add:

  Step 7: **Is the line likely to leave the customer feeling heard and respected?**
     - This is a values question. If unsure, hand to a person.

  But the original procedure didn't have that. We might have to extend.

  Given the two tripping points (shadow performatives and deniable language), we've covered them. But the third example might require empathy check. So we add:

  After Step 5 (or 6) for any line that interacts with customer feelings, ask:

  7. **Does this line handle the customer's emotions appropriately?**
     - This is subjective. If the line is about an apology, complaint, or sensitive issue, and you feel it might be cold or dismissive, hand to a person.

  For "We've noted your concern...":
     - It might be seen as dismissive (just noting, no action). So Step 7: hand to a person for empathy check.

  But we didn't include that in the procedure above. Let's adjust the procedure to include:

  After Step 6, for any line that addresses a customer complaint, emotion, or sensitive issue, ask:

  7. **Is it empathetic and clear about next steps?**
     - Check:
       - Does it acknowledge the customer's feelings?
       - Does it set realistic expectations?
     - *Uncertain or No*: Hand to PERSON (customer experience).

  So for the third example, after Step 6 (if not sent to legal or handed earlier), we do Step 7 and likely hand to a person.

  In summary:

  - Example 1: Legal (worst because it's a promise we might not be able to keep).
  - Example 2: Legal (but routine).
