answer: |-
  ### Game Design: "Wealth Builder Challenge"

  **Objective:** Illustrate the divergence between "take every +EV bet" and "maximize long-term growth" through experiential learning, without using jargon like Kelly or ergodicity. Students discover that expected value (arithmetic mean) can lead to ruin, while growth rate (geometric mean) preserves wealth in repeated bets. The game includes:
  - Fixed fractional betting (students commit to a fraction upfront).
  - Two groups: "Sequential Players" (individuals) vs. "Pooled Players" (group averaging).
  - A hidden change in bias (probability of winning) to induce adaptation.
  - 20 rounds for compounding effects.

  ---

  ### **Setup (10 minutes)**
  1. **Divide Students:** 
     - 9 "**Sequential Players**": Each plays 20 rounds alone, starting with $1,000.
     - 9 "**Pooled Players**": As a group, they share a bankroll starting at $9,000 ($1,000 per member). Each round, every member makes one independent bet, then they split the total bankroll equally.
     
  2. **Bet Definition:**
     - **"The Coin Flip"**: A biased coin with two outcomes:
       - **Win**: Bet multiplier = 2.0 (double your bet, e.g., bet $100 → get $200 back).
       - **Loss**: Bet multiplier = 0.0 (lose your entire bet).
     - **Bet Fraction**: Each student (and the pool) chooses **one fixed fraction `f`** of their current bankroll to bet every round. `f` must be between 0 (bet nothing) and 1 (bet everything). Write `f` on a card and hand it in (no changes allowed).

  3. **Biases (Secretly Changed):**
     - **Rounds 1–10**: Win probability = 60% (favorable).
     - **Rounds 11–20**: Win probability = 40% (unfavorable).  
     *Do not reveal this change until debrief!*

  4. **Tools:**
     - **Dice for Randomness**: Use a 10-sided die (d10) for all coin flips. 
       - Rounds 1–10: **1–6 = Win, 7–10 = Loss** (60% win chance).
       - Rounds 11–20: **1–4 = Win, 5–10 = Loss** (40% win chance).  
       *Sequential Players roll individually; Pooled Players roll simultaneously per round.*
     - **Worksheets**: 
       - **Sequential Players** track per round: `Roll`, `Outcome (Win/Loss)`, `New Bankroll = Bankroll × (1 ± f)`.
       - **Pooled Players** track per round: `Wins (out of 9)`, `Growth Factor (GF)`, `New Bankroll`, `Split per Member = New Bankroll ÷ 9`.  
         **GF Formula**:  
         `GF = (1 - f) + (2f × Wins) / 9`  
         *(This is the bankroll multiplier for the pool; derived from averaging 9 independent bets.)*
     - **Calculator/App**: For quick multiplication (e.g., phone calculators).

  ---

  ### **Gameplay (25 minutes)**
  1. **Rounds 1–10 (Favorable Bias):**  
     - **Sequential Players**: Roll die, record outcome, update bankroll:  
       `Win: Bankroll × (1 + f)`  
       `Loss: Bankroll × (1 - f)`.  
     - **Pooled Players**: All 9 roll simultaneously.  
       - Count total wins (e.g., 5 wins).  
       - Calculate `GF = (1 - f) + (2f × Wins) / 9`.  
       - Update bankroll: `New Bankroll = Old Bankroll × GF`.  
       - Split equally: `Each Member Gets = New Bankroll ÷ 9`.  
     *Facilitator walks around, helps with math, and secretly notes if students are adapting.*

  2. **Rounds 11–20 (Unfavorable Bias):**  
     - **Change Bias Secretly**: Switch die rules to 1–4 = Win (40% win chance). Don’t announce it!  
     - Repeat the same process as above.  
     *Watch for reactions when outcomes shift (e.g., "Why am I losing now?").*

  ---

  ### **Expected Dynamics & How to Handle Issues**
  1. **Someone Bets 100% (`f = 1`):**  
     - **Issue**: Sequential Player likely busts early (even in favorable rounds: ~99.9% chance of at least one loss in 10 rounds). Pooled Players might survive due to averaging.  
     - **Handling**: Use this! Ask: "Who went broke? Why? What does this say about betting it all?" Contrast with Pooled Players who may not bust due to diversification.

  2. **Someone Bets 0% (`f = 0`):**  
     - **Issue**: Bankroll never changes. Students might mock this as "cowardly."  
     - **Handling**: Later, show how conservative betting preserved wealth when bias turned unfavorable. Discuss risk-return tradeoffs.

  3. **"That’s Just a Utility Function" (Minute 10):**  
     - **Issue**: A philosophy student dismisses the game as subjective.  
     - **Handling**: "Great point! But here, we’re assuming your goal is *building long-term wealth*. We’ll discuss utility later—for now, focus on growth."

  4. **Pooled Group Too Noisy:**  
     - **Issue**: High variance in wins (0–9) makes GF chaotic, drowning out trends.  
     - **Handling**: Pre-calculate GF for common win counts (e.g., Wins=4 → GF = `(1-f) + 8f/9`) or use an app to compute instantly. Emphasize: "The pool’s path is smoother than sequential players’—why?"

  5. **Bookkeeping Overload:**  
     - **Issue**: Arithmetic bogs down gameplay.  
     - **Handling**: 
       - Use calculators/spreadsheets. 
       - Simplify: Bankrolls in $1,000s (e.g., $1.2k instead of $1,200).  
       - Round to 2 decimals.

  ---

  ### **Debrief (55 minutes)**
  **Link Experiences to Concepts:**  
  1. **Sequential Players = Geometric Growth (Growth Rate Matters):**  
     - Ask: "Who grew steadily? Who crashed?"  
     - **Key Insight**: Sequential betting compounds. Growth rate is the *geometric mean* of multipliers:  
       - If you bet 100% and lose once, you’re broke (growth rate = −∞).  
       - Maximizing expected value (arithmetic mean) ignores this.  
     - **Map to Moment**: Show a student who bet 100% and busted. Contrast with one who bet 20% and survived.  

  2. **Pooled Players = Averaging (Arithmetic Expectations):**  
     - Ask the pool: "Did you like this bet? Why?" Many will say "yes" because pooling reduced variance.  
     - **Key Insight**: Pooling averages outcomes → they mimic arithmetic mean (expected value).  
     - **Contrast**: Sequential players saw multiplicative variance; pooled saw additive smoothing.  

  3. **Bias Change & Uncertainty (Shading Down):**  
     - Ask: "Who adjusted bets mid-game? Why?" (Some may lower `f` after losses.)  
     - **Key Insight**: Optimal fraction (for growth) depends on knowing your edge. If uncertain, bet less to avoid ruin.  
     - **Map to Moment**: In rounds 11–20, a fraction optimal for p=60% (f=0.2) became destructive for p=40%.  

  **Limitations of the Game (Say This Out Loud):**  
  > "This game assumes:  
  > - **Multiplicative growth**: Bets are fractions of wealth, and all wealth is reinvested.  
  > - **Known probabilities**: We knew the exact win chances (until we cheated!).  
  > - **Infinite divisibility**: You could bet tiny fractions (no minimum bet size).  
  > - **Long horizons**: 20 rounds let compounding bite.  
  >   
  > **In real life, these break**:  
  > - A **one-shot bet** has no compounding → maximize expected value.  
  > - **Unknown probabilities?** Bet less than Kelly to hedge uncertainty.  
  > - **Short horizon?** Near the end of a sequence, expected value dominates.  
  > - **Bets not multiplicative?** (e.g., fixed-size bets) → different math!"  

  ---

  ### **Why This Works**
  - **Experiential > Theoretical**: Students *feel* the pain of overbetting and see pooling’s smoothing effect.  
  - **Bias Change**: Forces adaptation, revealing that "optimal" depends on context.  
  - **Jargon-Free**: Kelly (growth-rate maximization) and ergodicity (time vs. ensemble averages) emerge naturally in debrief.  
  - **Time-Efficient**: Pre-set worksheets and tools minimize chaos.  

  **First-Run Prediction**: Expect drama (busts, groans at bias change), then "aha" moments in debrief. Lean into the chaos—it’s fertile ground for discussion!
