answer: |-
  You're making a fascinating point about the presumptuous philosopher label, and I think I've got a case that fits your specifications perfectly. Let me walk you through it step by step, as I'd explain it over coffee. The setting is a NASA exoplanet research committee meeting in 2040. They've detected a highly anomalous, repeating radio signal from Proxima Centauri b—ambiguous enough that it could be either natural (a rare geological-auroral interaction) or artificial (an alien broadcast). The committee must decide now whether to greenlight Project Veritas, a $500 billion space probe that would take 20 years to reach Proxima and settle the signal's origin. Funding it would require defunding climate adaptation projects on Earth, so they only proceed if the probability of aliens exceeds 1%. Crucially, all parties agree the signal is real and unexplained, but it reveals nothing about humanity's future longevity, birth order, or cosmic timing. The debate hinges on two empirically equivalent hypotheses about the present-day universe: H_natural (the signal is natural; only Earth hosts observers, totaling 10 billion humans) and H_aliens (the signal is artificial; Proxima hosts 10 trillion alien observers, biologically and culturally continuous with humans—carbon-based, tool-using, radio-capable—but living in a separate ecosystem). Both hypotheses agree entirely on Earth's history, current population, and future trajectory; they differ solely in whether Proxima harbors unobservable alien life right now. Non-anthropic priors are 50-50, based on the signal's equivocal properties. The reference class is "observers capable of detecting and debating the Proxima signal," which uncontroversially includes both humans and the Proxima aliens (per your continuity requirement), but the aliens do not share human-specific evidence—they don't live in cities, eat pizza, or sit on committees. Crucially, under both hypotheses, exactly 10 billion observers share the committee's exact evidence: being human on Earth in 2040 contemplating the signal. The divergence comes entirely from the 10 trillion aliens under H_aliens who have different evidence (e.g., living under a red dwarf sun).  

  Now, applying SSA: You reason as if randomly sampled from all observers in the reference class. Under H_natural, all observers (10 billion) share your evidence, so P(your evidence | H_natural) = 1. Under H_aliens, only 10 billion out of 10,000,010 billion observers share your evidence, so P(your evidence | H_aliens) ≈ 10^{-3}. Bayes updates the 50-50 prior to 99.9% for H_natural. SIA, however, weights hypotheses by the raw number of observers with your evidence. Since both hypotheses have exactly 10 billion such observers, SIA leaves the odds unchanged at 50-50.  

  The decision divergence is stark: SIA says fund Veritas (50% > 1% threshold); SSA says don’t fund (0.1% < 1%). SSA moves the odds by a factor of 1000 against aliens, carrying all the weight, while SIA does nothing. The structural engine here is the ratio of observers without your evidence: under H_aliens, they vastly outnumber those with it, making your human perspective "atypical" for SSA. If we invert this—say, if the aliens also shared human evidence—SSA would show no update (P(your evidence) = 1 under both), while SIA would favor H_aliens by 1000-fold. If we narrow the reference class to only humans, both theories collapse to no update (same observers under both).  

  An SSA advocate’s strongest objection would be that the reference class is too broad—arguing aliens shouldn’t count as "observers" in the sampling pool because they’re too dissimilar. But this attacks the theory itself, not the case: your spec required biological/cultural continuity, and SSA’s typicality principle explicitly includes all observers unless restricted ad hoc. The case robustly supports your thesis. SSA forces a radical, evidence-free revision from 50% to 0.1% against aliens, directly causing non-action, while SIA modestly preserves priors. The standard labeling can’t absorb this by crying "Doomsday Argument" (no temporal sequence) or "SIA’s usual extravagance" (here it’s inert). If anything, SSA’s verdict feels like the armchair presumption: "There can’t be aliens because if there were, we’d probably be them." A referee might quibble over the reference class, but that’s a vulnerability of SSA, not your setup. This case cleanly flips the script.
