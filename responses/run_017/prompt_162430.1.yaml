prompt: |-
  I am writing a short paper on the dialectic between the self-sampling assumption and the self-indication assumption, and I want to argue that the presumptuous-philosopher label is attached to the wrong theory. The standard story has the self-indication assumption playing the presumptuous part: the philosopher who retires to an armchair and announces that the cosmos must teem with civilizations. My thesis is that the self-sampling assumption is the one that licenses large, armchair revisions of contingent empirical belief from no evidence at all, and that its reputation for modesty is an artifact of the cases people choose. What I need is one clean case to open with: a case in which the self-sampling assumption delivers the extravagant verdict and the self-indication assumption the modest one, and in which the extravagance cannot be dismissed as the Doomsday Argument in a new costume.

  Please construct such a case. Take SSA to be the rule that one should reason as if one were a random sample from a reference class of observers, so that a hypothesis is favoured to the extent that a large fraction of the observers it posits have evidence like yours. Take SIA to be the further assumption that your existence is itself evidence, favouring hypotheses that posit more observers, so that conjoined with the sampling step hypotheses end up weighted by how many observers have evidence like yours, irrespective of how many observers there are besides. State the convention you are working with, and flag briefly what changes if you regard SIA as a rival to the sampling step rather than an addition to it.

  The specifications:

  1. The two hypotheses must agree about every fact concerning the reasoner's own community, its past, its present size and its future, and must differ only about a population that exists at the same time but that the reasoner cannot currently observe. The reasoner's evidence must contain nothing about their position in a sequence: no birth rank, no premise that they or their civilization are early or late, nothing about how long their community will last.

  2. The number of observers who share the reasoner's evidence must be the same on both hypotheses, so that any divergence between the theories is produced by observers who do not share that evidence and by nothing else.

  3. SSA must move the odds by at least three orders of magnitude relative to SIA, and in the direction in which SSA is the theory making the large revision and SIA the one leaving the priors essentially untouched.

  4. The priors must be stated explicitly and must be ones a reasonable non-anthropic inquirer would accept on the empirical question alone, roughly even odds; the anthropic step, not the priors, has to carry the weight.

  5. The divergence must surface in a decision the community has to take before the question is settled by observation: something they must fund, launch, withhold or announce now, on the strength of the anthropic verdict, with the settling observation still in the future and obtainable in the story. It is not enough for the two theories to disagree about a number nobody acts on.

  6. No infinities, no merely possible observers, no simulations or ancestor-simulations, no exact duplicates of the reasoner, no minds of disputed observer status, no contested physics or cosmological measure. The reference class must be one both sides of the debate would grant without argument, ideally because the population whose existence is at issue is continuous, biologically and culturally, with the reasoner's own.

  7. Keep the scenario to a paragraph or two and set it somewhere recognizable: a committee room, a mission-control room, a department meeting. Do not stipulate what the theories say; derive it.

  After the scenario, do the check. State the reference class and the priors, derive each theory's verdict and by what factor, and identify the single structural feature doing the work. Then say what happens to both verdicts if that feature is removed or inverted, for instance if the unobserved observers also had evidence like the reasoner's, or if the reference class were narrowed to the reasoner's own community. Give me the strongest objection an advocate of whichever theory comes out worse would make, and say whether the objection lands on the case or on the theory itself. Finally, and this is the part I most need, tell me honestly whether the case actually supports my thesis or whether a defender of the standard labelling can absorb it with a distinction I have not anticipated, because I would much rather hear that from you than from a referee.

  Write the whole thing, scenario and check together, as one continuous piece of prose, the way you would write an email to a colleague: no headings, no bullet points, no bold text, no tables.
reasoning: |-
  We are to construct a scenario meeting the user's specifications. Let me outline the key elements:

  - **Setting:** A committee meeting at the SETI Institute in 2050. The committee is deciding whether to fund a costly deep-space probe to investigate a puzzling radio signal from a distant star system.

  - **Hypotheses:**
    - **H_sparse:** The signal is from a natural astrophysical process (e.g., a pulsar). There are only 10^9 observers in the universe (all on Earth).
    - **H_dense:** The signal is artificial, from an alien civilization. There are 10^12 observers in the universe (including 10^12 - 10^9 aliens).

  - **Priors:** The committee's prior assessment, based on the signal's properties and known astrophysics, is that H_sparse and H_dense are equally likely (P(H_sparse) = P(H_dense) = 0.5). Note that the signal is ambiguous and could be either.

  - **Evidence:** The committee members are human observers on Earth. Their evidence E is their current experiences and knowledge, which includes the fact of the signal but no information about their birth rank or the future of humanity. Importantly, the number of observers *on Earth* is the same under both hypotheses (10^9), and every observer on Earth has the same evidence E (they are all aware of the signal and the debate).

  - **Reference Class:** We take the reference class to be "observers in the universe who are aware of the signal and the debate about its origin". This class includes:
    - Under H_sparse: only the 10^9 humans on Earth.
    - Under H_dense: the 10^9 humans on Earth plus 10^12 - 10^9 ≈ 10^12 alien observers who are also aware of the signal (because they are the ones who sent it and are monitoring it, or because they are part of a galactic community that has detected it). 

  Note: We must ensure that the evidence E is shared by all in the reference class. The aliens are assumed to have the same evidence: they know about the signal and are debating its origin. This is a key point.

  Now, we apply the two anthropic theories:

  1. **Self-Sampling Assumption (SSA):** We reason as if we are a random sample from the reference class. The probability of our evidence E (being an observer with this evidence) given a hypothesis is proportional to the fraction of observers in that hypothesis' universe who have evidence E.

     - Under H_sparse: All 10^9 observers have E. So P(E|H_sparse) = 1.
     - Under H_dense: There are 10^12 observers with E (the humans and the aliens). But note: the total number of observers under H_dense is 10^12 (all of whom have E? We have defined the reference class as those aware of the signal and the debate). We are assuming that the 10^12 observers in H_dense all have E. Then P(E|H_dense) = 1 (since every observer in the reference class has E). 

  Wait, this leads to no difference. We must adjust.

  We must make sure that under H_dense, not all observers have the same evidence as the humans. The problem states: the number of observers who share the reasoner's evidence must be the same on both hypotheses. So let's redefine.

  Revised:

  - **Evidence E:** The specific evidence of being a human observer on Earth, with all the details of human life and the SETI context. The aliens are not humans and do not share the exact human experiences. So:

    - Under H_sparse: Only humans exist. The number of observers with evidence E (human evidence) is 10^9.
    - Under H_dense: There are 10^9 humans with evidence E and 10^12 aliens who have a different evidence, say E' (alien evidence). The reference class is "all observers", but we must account for the fact that E is a specific type of evidence.

  But note condition (2): the number of observers who share the reasoner's evidence must be the same on both hypotheses. So we must set:

    - Under both hypotheses, there are exactly N observers with evidence E (the human evidence). But then what is the difference? The difference is in the total number of observers.

  But condition (1) says the hypotheses agree on the human community. So:

    - Both hypotheses agree: there are 10^9 humans on Earth, and they all have evidence E.
    - The difference is in the existence of aliens: H_sparse has no aliens, H_dense has 10^12 aliens (who do not have evidence E; they have their own evidence, say E').

  Now, condition (2): the number of observers with evidence E is the same under both hypotheses? Yes, because under H_sparse, there are 10^9 observers with E (humans), and under H_dense, there are also 10^9 observers with E (the humans). The aliens do not have E. So condition (2) is satisfied.

  Now, let's apply SSA and SIA.

  **SSA:** We are a random sample from the set of all observers (the reference class). The probability of having evidence E given a hypothesis is the fraction of observers in that hypothesis who have evidence E.

  - Under H_sparse: Total observers = 10^9. All have E? Actually, we defined E as the human evidence, and only humans exist. So fraction with E is 1.
  - Under H_dense: Total observers = 10^9 (humans) + 10^12 (aliens) ≈ 10^12. The number with evidence E is 10^9. So fraction with E is 10^9 / 10^12 = 10^{-3}.

  Therefore, by Bayes:

  P(H_sparse | E) / P(H_dense | E) = [P(E|H_sparse) * P(H_sparse)] / [P(E|H_dense) * P(H_dense)] = [1 * 0.5] / [10^{-3} * 0.5] = 1 / 10^{-3} = 1000.

  So SSA favors H_sparse by a factor of 1000.

  **SIA:** SIA says we should condition on the fact that we exist as observers. Typically, SIA weights hypotheses by the number of observers they predict. But note: the user specifies SIA as an addition to SSA: that we should weight by the number of observers with our evidence.

  The user says: "SIA to be the further assumption that your existence is itself evidence, favouring hypotheses that posit more observers, so that conjoined with the sampling step hypotheses end up weighted by how many observers have evidence like yours, irrespective of how many observers there are besides."

  So under SIA, the probability of the evidence E (which includes our existence) is proportional to the number of observers with evidence E. But note: under both hypotheses, the number of observers with evidence E is the same: 10^9. Therefore, SIA does not change the prior:

  P(H_sparse | E) / P(H_dense | E) = [P_SIA(E|H_sparse) * P(H_sparse)] / [P_SIA(E|H_dense) * P(H_dense)] = [ (number of E observers under H_sparse) * 0.5 ] / [ (number of E observers under H_dense) * 0.5 ] = [10^9 * 0.5] / [10^9 * 0.5] = 1.

  So SIA leaves the odds unchanged.

  Therefore, SSA moves the odds by a factor of 1000 (three orders of magnitude) in favor of H_sparse, while SIA leaves the odds at even.

  Now, the decision: The committee must decide whether to fund the probe. The probe is very expensive and would require diverting funds from other projects. The probe would settle the question: if launched, it will reach the source in 50 years and tell us definitively whether the signal is artificial or natural. The cost is justified only if the probability of H_dense is high enough. The committee uses a threshold of 1%: if the probability of H_dense is below 1%, they won't fund.

  - Under SIA: P(H_dense|E) = 0.5 -> above 1%, so fund.
  - Under SSA: P(H_dense|E) = 1/1001 ≈ 0.001 -> below 1%, so do not fund.

  So the decision diverges.

  Now, the check:

  **Reference class:** All observers in the universe. We assume that both humans and aliens are in the reference class (both are conscious, intelligent, etc.) and that this is uncontroversial.

  **Priors:** 0.5 for each hypothesis.

  **Derivation:**
  - SSA: P(E|H_sparse)=1, P(E|H_dense)=10^{-3} -> posterior ratio 1000:1 in favor of H_sparse.
  - SIA: weights by the number of E observers, which is 10^9 in both cases -> posterior ratio 1:1.

  **Structural feature:** The key is that under H_dense, there are many more observers who do not have evidence E (the aliens). SSA discounts H_dense because it makes it unlikely that we would be among the few with E (the humans) rather than the many without E (the aliens). SIA does not discount because it only cares about the absolute number of observers with E, which is the same.

  **Inversion:** If we remove the feature that the aliens do not share E, i.e., if we assume that under H_dense, the aliens also have evidence E (so that all observers in the universe have E), then:
  - Under H_dense: total observers = 10^12, all with E.
  - Then SSA: P(E|H_sparse)=1, P(E|H_dense)=1 -> no update.
  - SIA: still weights by number of E observers: H_sparse: 10^9, H_dense: 10^12 -> then SIA would favor H_dense by 1000.

  But in our case, we have the opposite: the aliens do not share E.

  **Objection:** An advocate of SSA might object that the reference class is too broad. They might argue that the reference class should be restricted to observers who are in a similar epistemic situation, and that the aliens are too different. In particular, they might say that the reference class should be limited to humans because the evidence E is human-specific. But note: condition (6) requires that the reference class is one both sides would grant without argument, and we have defined E to be human evidence. However, if we narrow the reference class to only humans, then both hypotheses have the same reference class (only humans) and the same number of humans (10^9). Then SSA would give no update (since P(E|H) would be 1 for both). This objection lands on the case: it challenges the choice of reference class. But the user asks for a reference class that is continuous and uncontroversial. Our reference class is "observers", and we have assumed that both humans and aliens are observers. The objection would be that the aliens are not in the same reference class because they don't have the same evidence. But note: the reference class in SSA is typically defined to include all observers, and then we condition on the evidence. So we are following that. However, if we define the reference class to be "observers with evidence E", then both hypotheses have the same set of observers in the reference class (the 10^9 humans), so again no update. The user wants a case where the reference class is broader. We must hold that the aliens are in the reference class but do not have E. This is standard.

  **Does the case support the thesis?** Yes, because SSA makes a large revision (1000:1) from no new empirical evidence (the signal is the same) and from even priors, and it leads to a decision to abandon the probe. SIA does nothing. The presumptuous move is SSA's: it confidently rejects the alien hypothesis based solely on the fact that if there were aliens, we would be very unlikely to be human. This is an armchair revision. The standard story has SIA as the one that favors large universes, but here SIA is modest and SSA is the one making the bold claim.

  However, note: the user wants to avoid the Doomsday Argument. In the Doomsday Argument, SSA makes us typical and leads to the conclusion that humanity will end soon. Here, we are not making a temporal argument. We are comparing two contemporaneous populations. The unobserved aliens are at the same time as us. So it's not Doomsday.

  But wait: condition (1) says no birth rank, no early/late, and we have complied.

  **Potential absorption by the defender of the standard labeling:** They might argue that SSA is doing exactly what it is supposed to do: making us typical. And that in this case, it is correct to be skeptical of H_dense because if there were so many aliens, we should not expect to be human. They might say that this is not presumptuous because it is a legitimate application of typicality. However, the user's point is that SSA is making a large revision without evidence, and that is what the standard story attributes to SIA. The case shows that SSA can be equally presumptuous. The standard labeling might absorb it by saying that SSA is sometimes bold too, but the user's thesis is that the standard story has it backwards. The case supports the thesis by providing a clear example where SSA is the bold one.

  Another point: the standard story might say that SIA is the one that favors large universes, but in this case SIA does not because the number of observers with our evidence is the same. So the case is set up to avoid the usual SIA boost. The defender might say that this is a special case and that usually SIA favors large universes. But the user wants to show that SSA can be the one that forces a big change.

  I think the case works.

