  **DURABLE POWER OF ATTORNEY FOR CREDENCES**  
  **Appointing Future Self as Epistemic Agent**  

  **1. APPOINTMENT OF ATTORNEY-IN-FACT**  
  Principal hereby designates and appoints the individual constituting the Principal’s future self at time \(t_f\) (the "Attorney-in-Fact") as the Principal’s true and lawful epistemic agent, with full authority to set credences for all propositions \(\phi\) in the Principal’s belief set \(\mathcal{B}\), subject to the terms herein.  

  **2. GRANT OF AUTHORITY**  
  The Attorney-in-Fact shall exercise exclusive jurisdiction over the Principal’s credence function \(cr_{t_f}(\phi)\). Principal’s current credence \(cr_{t_0}(\phi)\) shall, conditional on Attorney-in-Fact’s credence \(cr_{t_f}(\phi)\) being quantized to value \(q\) per Clause 4, be set equal to \(q\) effective immediately.  

  **3. DURABILITY PROVISION**  
  This instrument remains in full force despite Principal’s subsequent expectation of Attorney-in-Fact’s:  
  (a) Intoxication (blood alcohol ≥ 0.08%),  
  (b) Religious/philosophical conversion (including to solipsism, eliminativism, or Pastafarianism),  
  (c) Amnesia affecting >15% of \(\mathcal{B}\) per standardized cognitive testing.  
  *Exception*: Revocation requires notarized advance directive from Principal, submitted 48hr prior to \(t_f\).  

  **4. QUANTIZATION PROTOCOL**  
  Owing to the Lebesgue-measure-zero event \(cr_{t_f}(\phi) = q\), Attorney-in-Fact’s credence shall be rounded to nearest \(0.01\) ("Quantized \(q\)"). Disputes resolved via IEEE 754 floating-point standard.  

  **5. DOGMATIST COMPLIANCE**  
  Notwithstanding Clause 2, Attorney-in-Fact satisfies all obligations if \(cr_{t_f}(\phi) = cr_{t_0}(\phi)\) for all \(\phi \in \mathcal{B}\) (a "Dogmatist Endorsement"). No further action required.  

  **6. TEMPORAL BINDING**  
  This instrument binds Principal to Attorney-in-Fact, but not Attorney-in-Fact to any past self. Past selves are deemed "epistemically emancipated" and lack standing to enforce credence adjustments.  

  **7. DAMAGES FOR BREACH**  
  Principal agrees that violation of Clause 2 renders them liable to a Dutch Book penalty, payable to the Attorney-in-Fact as liquidated damages:  
  \[
  \text{Damages} = \sum_{k} |cr_{t_0}(\phi) - q_k| \cdot s_k \cdot P(\text{Quantized } q_k)
  \]  
  where \(s_k\) is the stake set by a hypothetical bookie, and \(P(\text{Quantized } q_k)\) is the probability of \(q_k\) per rounding protocol. Schedule A provides illustrative penalties (e.g., \(|cr_{t_0}(\phi) - 0.7| \times \$1,000 \times 0.03\)).  

  **8. TERMINATION**  
  This power terminates upon:  
  (a) Principal’s death,  
  (b) Thermodynamic heat death of the universe,  
  (c) Attorney-in-Fact’s conclusive proof of \(\phi \land \neg\phi\).  

  ---

  **SCHEDULE A**  
  *Exemplar Dutch Book Damages*  
  | Quantized \(q_k\) | Stake \(s_k\) | \(P(q_k)\) | Penalty Base |  
  |-------------------|--------------|------------|--------------|  
  | 0.25              | \$800        | 0.02       | \( \|cr_{t_0} - 0.25\| \times \$16 \) |  
  | 0.50              | \$1,200      | 0.04       | \( \|cr_{t_0} - 0.50\| \times \$48 \) |  
  | 0.75              | \$2,000      | 0.01       | \( \|cr_{t_0} - 0.75\| \times \$20 \) |  

  ---

  **ACKNOWLEDGEMENT**  
  Principal affirms that they:  
  - Understand Reflection is not a causal constraint but a synchronic norm,  
  - Waive all rights to plead "But I’ll be *different* then,"  
  - Acknowledge past selves are estranged epistemic relatives.  

  _________________________  
  **PRINCIPAL’S SIGNATURE**  
  Date: \(t_0\)  

