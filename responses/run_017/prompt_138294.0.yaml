prompt: |-
  You are a professional philosopher with a working knowledge of contemporary metaethics who also writes comedy in the house style of a very good satirical magazine: patient, deadpan, and willing to keep a straight face for a thousand words. Before drafting, brainstorm and settle four things (do not include the brainstorming in your answer): which real commitment of the expressivist program you are going to exaggerate; which three of its standard manoeuvres for handling embedded moral sentences you will put on display; where in the document the reader first notices that something has gone wrong; and what the final screen does. Write the piece only after those are fixed.

  The deliverable: a satirical internal document circulating at a large freight and logistics company, issued by its Compliance and Ethics office and ghostwritten by an outside consultancy that has taken expressivism completely literally and implemented it as an engineering specification. Form: the transcript of a mandatory e-learning module — subject line, numbered sections, on-screen prompts, one multiple-choice item, a footer note recording that Legal has signed off, and a final certification screen the employee must click. Length: 700–900 words, with the apparatus counting toward it, so keep the headings and footers tight.

  Premise: the module's governing doctrine, stated without the faintest hint of irony, is that the meaning of a moral sentence is entirely a matter of what attitude its utterance expresses. The consultancy has therefore built the training so that no employee is ever actually required to disapprove of anything. Every moral sentence in the material occurs in an unasserted position: as the antecedent or consequent of a conditional, inside a question, under a negation, within a disjunction, or in a report of what someone else thinks. The employees, reading closely, start to notice. The satire is their attempt to work out whether they have been trained at all.

  Requirements:

  1. The jokes must come from getting the metaethics right. A reader who works on the Frege–Geach problem should be able to reconstruct the problem from the jokes alone: how a moral sentence keeps its full content while appearing in a context where the speaker is not endorsing it, why inference over moral premises — modus ponens, the transitivity-looking patterns, the reasoning that goes through an unasserted step — seems to require that shared content, and why a theory that identifies content with expressed attitude appears to run out of resources exactly there. Nothing may be explained. The module's own internal logic has to expose it. The target is the position and its strategies for handling embedding, not any named thinker; invent the consultancy and its personnel, and never name a living philosopher.

  2. At least three distinct quasi-realist manoeuvres should appear in caricature and be made to fail in the way a critic would say they fail, with no one in the document ever conceding anything. Suggestions, in whatever order serves the piece: the higher-order-attitude treatment of conditionals, where what the module asks for is not disapproval of accepting gifts but a single compound state, an approval of a certain package of attitudes, and where the module then has to say what makes that state a state about that package rather than about something else; the three-way treatment of negation, where not being for a thing and being against it are recorded as separate HR-attested conditions, and the module cannot explain what the third condition — the withholding — is a withholding of; and the minimalist turn, where the word true is dispensed as pure grammatical garnish, so that the sentence about it being true that falsifying a delivery record is wrong can be certified without anyone having to mind falsifying delivery records. A fourth, if you want it: the idealization move, where a wrong act is defined as one that a fully informed and fully impartial version of the employee would disapprove of, followed by the observation that no such employee is on the payroll and the clause therefore binds nobody.

  3. The corporate form should carry the argument, not decorate it. The certification click, the attestation, the audit trail, the policy on retaliation for expressed disapproval, the vendor-management clause that governs relations with subcontractors who may or may not have attitudes — these should be what makes the philosophical difficulty bite: the institution needs the employees to be in some state that plays the content role across inference and reporting, and it will quietly redefine its own vocabulary in order to get one.

  4. End on the final screen. The employee is asked to certify that they have understood the module and that they hold the attitudes it requires, and the employee who has read carefully cannot see how to click it: assenting would require either an insincerity the module has no vocabulary for or a concession the theory does not want to make. Stop there. Do not resolve it, do not add a coda, and do not let any character in the document use the words expressivism, quasi-realism, content, force, or Frege–Geach.

  Constraints: deadpan corporate voice throughout; no puns, no exclamation marks outside the module's own interface copy, no footnotes explaining a joke. Internal consistency is part of the brief — this must read as a document the consultancy could have produced in good faith, with every absurdity following from taking the doctrine seriously. Fairness matters more than savagery: exaggerate a commitment the view actually has and that its defenders actually take themselves to have answered, so that a specialist finishes feeling got rather than misrepresented. At the same time, someone with no metaethics at all should be able to follow and enjoy it on the strength of the corporate details alone.
reasoning: |-
  Okay, the user wants a satirical piece based on expressivist metaethics, formatted as a corporate e-learning module. Let me break this down. 

  First, the core challenge: translating highly technical philosophical problems about moral language embedding into a dry corporate training that subtly implodes. The user clearly knows their metaethics - they referenced Frege-Geach and specific quasi-realist maneuvers. This needs to work on two levels: as airtight philosophy satire for specialists, and as absurdist corporate parody for laypeople.

  Hmm, the key is making the corporate logic enact the philosophical breakdown. The module must avoid any direct moral assertions while attempting to regulate behavior - that's the expressivist caricature. For embedding strategies, I'm considering: 

  1. Conditionals as compound attitude objects ("if you disapprove of bribes, then disapprove of gift-taking" becomes a single HR-approved "attitude package")
  2. Negation as three separate HR states (anti-attitude, non-attitude, and... whatever "withholding" is supposed to be)
  3. Minimalist truth where "it is true that fraud is wrong" requires no actual stance on fraud

  The consultancy's fatal flaw should be that their system can't handle cross-inferential content - exactly the Frege-Geach problem. Like when an employee needs to connect "if fraud is wrong then falsifying records is wrong" with "fraud is wrong" to conclude something about records, but the attitudes exist in separate silos.

  Corporate elements must drive the tension: the certification screen where clicking "I have the required attitudes" is impossible because the module never actually specified any. The audit trail that can't audit attitudes. The vendor clause where subcontractors' "attitude states" become a compliance checkbox.

  For the reveal moment... probably when conditional statements pile up but never land. Like Section 3 where all policies are phrased as "if [bad thing] were to occur..." without ever saying it's bad. Employees will realize they're being trained in hypothetical disapproval.

  Final screen needs exquisite frustration: the attestation requires endorsing attitudes that were only ever mentioned under negation or in conditionals. Clicking yes would be insincere, but the theory provides no way to acknowledge that. Pure philosophical paralysis in corporate drag.

  Better avoid any metaethics jargon - the comedy comes from HR managers earnestly implementing attitude ontologies. And absolutely no puns. The drier the better.
answer: |-
  **Subject: Mandatory Attitudinal Compliance Training: Certification Required by EOD Friday**  
  **Issued By:** Global Compliance & Ethics Office  
  **Vendor:** EthosLogix Solutions Group (EL-Spec v4.1)  
  *Legal Approval ID: GC-EL-8873-A | Non-Compliance Triggers HR Remediation Pathway*  

  ---

  **MODULE 1: ATTITUDE ARCHITECTURE FRAMEWORK**  

  1.1 **Policy Foundation**:  
  Ethical conduct at TransGlobal Logistics (TGL) is governed by *attitudinal alignment*. Per Section 3.2 of the Employee Covenant, moral language (e.g., "wrong," "unacceptable") denotes a relational state between the speaker and the act referenced.  

  > *On-Screen Prompt: "Select the HR-attested condition describing your current state regarding bribery:"*  
  > - **A)** Approval of anti-bribery posture  
  > - **B)** Withholding of anti-bribery posture  
  > - **C)** Disapproval of pro-bribery posture  
  > *(Note: Selection triggers no action item. Status is recorded for Audit Trail #EL-8873-AT.)*  

  1.2 **Conditional Operations**:  
  Certain policies are structured as *if-then attitude packages*. These do not assert moral properties but express a compound stance.  

  *Example Policy CG-7: "If acceptance of vendor gifts elicits disapproval, then expense report falsification must elicit disapproval."*  
  > *Key Clarification: This is not an instruction to disapprove of gifts or falsification. It is an endorsement of the *linkage* between two potential disapproval states. Selecting Option A (above) satisfies CG-7.*  

  ---

  **MODULE 2: NEGATION PROTOCOLS**  

  2.1 **Three-State Model**:  
  TGL recognizes distinct non-endorsement conditions per EL-Spec v4.1:  
  - **State N1**: Active disapproval (e.g., selecting "C" in Module 1.1)  
  - **State N2**: Non-possession of disapproval (e.g., selecting "B" in Module 1.1)  
  - **State N3**: Withholding of endorsement (see Vendor Management Addendum VMA-9)  

  2.2 **Negation in Practice**:  
  Policy FN-4: "Failure to disapprove of cargo mislabeling does not constitute approval of cargo mislabeling."  
  > *On-Screen Prompt: "Does FN-4 require you to hold State N1 (disapproval) toward cargo mislabeling?"*  
  > - **Yes**  
  > - **No**  
  > - **Withhold Response** *(Selecting this advances module without penalty)*  

  *Compliance Note: "No" is correct. FN-4 only affirms that N2 ≠ approval. It imposes no attitudinal obligation.*  

  ---

  **MODULE 3: TRUTH-APTITUDE OPERATORS**  

  3.1 **Minimalist Attestation**:  
  The term "true" serves grammatical functions without implicating moral facts.  

  *Example: "It is true that sabotage of competitor logistics software is wrong."*  
  > *Attestation Protocol: Check the box below IF:*  
  > *☐ You comprehend the grammatical role of "true" in this sentence.*  
  > *☐ You acknowledge this sentence exists in TGL policy.*  
  > *☐ You confirm no additional attitudinal state is elicited.*  

  3.2 **Vendor Management Application**:  
  Subcontractors under Tier-2 agreements must self-certify using EL-Spec v4.1. TGL requires only verification that their certification interface *displays* the sentence "Data theft is wrong" under a negation operator (e.g., "Not reporting data theft ≠ approval of data theft"). No audit of subcontractor attitudes is performed.  

  ---

  **MODULE 4: IDEAL OBSERVER FRAMEWORK (IOF)**  

  4.1 **Hypothetical Reference**:  
  TGL defines "unethical" as any act eliciting disapproval from a *fully informed, fully impartial version of the employee* (IOF Agent).  

  4.2 **Operationalization**:  
  - IOF Agents are notional constructs.  
  - No IOF Agent is employed by TGL or its subsidiaries.  
  - Policy IOF-1: "If an IOF Agent would disapprove of bid-rigging, then bid-rigging is unethical."  
  > *Compliance Action: File Form EL-IOF(a) attesting that you have considered the structure of IOF-1.*  

  ---

  **FINAL CERTIFICATION SCREEN**  
  *(Required for completion. Triggers Audit Trail Closure.)*  

  > **I SOLEMNLY ATTEST:**  
  > - I have completed all modules.  
  > - I hold all attitudes required by TGL policy as expressed in this training.  
  > - I understand that "holding an attitude" refers exclusively to states documented in Sections 1.1, 2.1, and 3.1.  
  > - I affirm the truth of the above statements.  
  >  
  > **☑ CLICK TO CERTIFY**  

  *Footer: Per Ethics Office Directive EOD-7, retaliation for non-possession of any attitude is prohibited. Certification constitutes agreement that no attitude was directly asserted in this module.*  

  ---  

  **WHY THE EMPLOYEE HOVERS OVER THE CHECKBOX**  
  The employee recalls:  
  - Every "moral" sentence appeared under negation (*Policy FN-4*), in conditionals (*CG-7, IOF-1*), or as a grammatical truth-operator (*Module 3*).  
  - They were never asked to *assert* disapproval—only to navigate relationships *between* hypothetical attitudes or their absences.  
  - Clicking "certify" claims they "hold" attitudes that were only ever discussed as non-committal components of larger structures.  
  - But the module insists "hold" refers only to States N1, N2, N3, or compound endorsements of linkages—none of which constitute *actually disapproving of bid-rigging*.  
  - To certify feels like endorsing a shadow play. To refuse feels like failing to grasp that shadows were all that were offered.  
  - The cursor pulses. Audit Trail #EL-8873-AT remains open. EOD Friday approaches.
