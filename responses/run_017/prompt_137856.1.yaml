prompt: |-
  My friend Dana is one of those hard-core "do whatever makes the world best overall" people, and I've started writing down what she actually says about real cases, because I can't work out what rule she's running. Her verdicts so far:

  - Voting: she does it, but only because it costs almost nothing — she says the chance of mattering is basically zero, so it's a free shot at a good outcome.
  - Giving to the malaria bednet charity: she gives about a tenth of her income and says it's about the clearest good purchase available to a normal person.
  - Donating to or volunteering for a national campaign for a policy she thinks is net-good: no. She says a change that big has knock-on effects nobody can predict, and those will totally swamp whatever the campaign is aiming at.
  - Giving to the "protect the far future / reduce extinction risk" funds: also no. Her line is that the further out you go, the more our guesses are worth approximately nothing.
  - Having a kid: she says it's fine, and not having one is fine too, and that anyone who tells you the very-long-run consequences settle the question is kidding themselves.
  - Being harsh to your child on the theory that it'll make them driven and successful later: she thinks that's obviously wrong, and isn't moved by "but you can't prove the long-run effect is bad."
  - Tiny actions that could in principle butterfly into something enormous: she doesn't care at all. She once joked that holding a door open for a stranger might rearrange the next eighty years.

  New case, and this one actually matters because she's in it. Dana works in a materials lab. For essentially no cost to herself she can do one small favour that will very likely get a cheap clean-energy technology onto the market roughly two years earlier than it otherwise would. The near-term effects look clearly and substantially good — less air pollution, cheaper power, all the stuff she already thinks is good. The long-run effects are the usual fog: which technologies end up mattering, who gets rich, whether some war happens earlier or later. She can't get any grip on the sign of those, and she knows it.

  So: what does she do? I care less about the bare yes/no than about the rest of it. What rules fit all seven of her earlier verdicts at once; what does each of those rules say about the lab case; which is your best guess and why; and what one further case would you put to her to separate whichever rules your best guess still leaves tied?

  I've also been playing with a rule of my own: only count what happens to people who are already alive, and treat effects on people who don't exist yet as zero. Tell me whether that fits her track record, or whether one of her verdicts kills it.

  Keep the whole thing under 600 words and skip the preamble.
reasoning: |-
  Hmm, the user wants me to analyze Dana's decision-making patterns based on her previous verdicts and apply it to a new lab scenario. Dana appears to be a utilitarian who focuses on predictable, near-term impacts while discounting unpredictable long-term effects.

  Looking at her previous positions:
  - She votes because the cost is negligible and the potential upside exists
  - She gives to malaria charities due to clear, measurable impacts
  - She avoids big policy campaigns and far-future funds due to unpredictability
  - She's neutral on having children since long-term effects are unknowable
  - She rejects harsh parenting despite uncertainty about long-term effects
  - She ignores butterfly-effect scenarios

  For the lab case where she can accelerate clean energy adoption with clear near-term benefits but uncertain long-term effects, Dana would likely say yes. Her pattern shows she acts when both costs are low and near-term benefits are predictable and significant. The clean energy acceleration fits this perfectly - minimal personal cost, demonstrable near-term reductions in pollution and energy costs, while the long-term geopolitical uncertainties would be dismissed as unpredictable noise.

  The user's proposed rule of only counting effects on currently living people doesn't fully match Dana's position. Her verdict on having children shows she considers potential people's welfare (since not having a child affects who exists), but treats the long-term consequences as incalculable rather than zero.

  To distinguish between possible rules, I'd test with a scenario about influencing the timing of a specific birth. If Dana dismisses it due to unpredictability, that confirms her skepticism about long chains of causation. If she engages with the near-term effects on the parents, that would support the "only existing people" rule.

  The core principle seems to be: maximize expected near-term welfare where predictions are reliable, ignore distant uncertainties that dominate theoretical long-term calculations.
answer: |-
  **Rules Fitting All Verdicts:**  
  1. **Predictable Near-Term Impact Maximization:** Act when expected near-term consequences (10-50 years) are clearly positive *and* predictable, costs are low, and long-term (>100y) effects are too chaotic to assess.  
  2. **Robust Ignorance of Long Cascades:** Treat actions as having *zero* net long-term value if effects involve complex chains of causation (butterfly effects, tech/social tipping points), regardless of scale.  

  **Lab Case Verdict:**  
  She **does the favor**. Near-term benefits (cleaner air, cheaper energy) are predictable and significant, costs are near-zero, and long-run uncertainties (wars, tech dominance) are deemed unquantifiable noise—just like voting or bednets.  

  **Best Guess:** Rule 1. It explains her rejection of extinction funds (no predictable near-term path) and policy campaigns (knock-ons dominate), while accepting bednets/voting/lab favor (clear near good, ignorable far future). Rule 2 struggles with her child-rearing stance: she rejects harsh parenting *despite* uncertain long effects, implying near-term harm matters independently.  

  **Test Case to Distinguish:**  
  *"A fertility clinic offers a free service to shift a baby’s conception by one day—changing which sperm fertilizes the egg. This child will likely live ~80 years; effects beyond that are unpredictable. Should you use it?"*  
  - If Rule 1: Indifferent. Near-term effects (to parents/child) are negligible; long-term chaos dominates.  
  - If Rule 2: Opposes. Actively altering identity introduces massive unpredictable ripple effects.  
  Her answer clarifies whether identity-altering acts are uniquely suspect.  

  **Your Proposed Rule (only existing people):**  
  **Fails.** She considers future people in *extinction funds* (rejects due to uncertainty, not zero value) and *having kids* (neutral since long-run unknowable, not zero-sum). She cares about potential lives but discounts incalculable impacts.  

