answer: |-
  **Exam Question (Student-Facing):**

  *Stem:*
  Consider the following two cases:

  *   **Case A (Burden Distribution):** You must choose between two options. Option 1 imposes a single severe burden (e.g., intense, prolonged pain) on one specific stranger, Stranger X. Option 2 imposes a barely perceptible burden (e.g., a momentary, negligible itch) on each of one million distinct strangers. The *summed* burden experienced in Option 2 is stipulated to be significantly larger than the severe burden in Option 1. There are no other relevant differences; the burdens are identical in kind except for intensity and distribution. You cannot avoid imposing burdens; you must choose one option.
  *   **Case B (Harm Prevention):** Five strangers are each facing a severe harm (e.g., death or equivalent permanent disability) unless you act. You can prevent these five severe harms only by imposing a trivial, unconsented cost (e.g., a small, temporary inconvenience like a brief delay) on a sixth stranger, Stranger Y. There are no other relevant differences or ways to prevent the harms. You cannot avoid imposing the cost on Y if you prevent the harms to the five; you cannot avoid preventing the harms to the five if you act; acting involves imposing the cost on Y.

  The "Separateness of Persons" (SoP) objection to Utilitarianism claims that Utilitarianism, by aggregating benefits and burdens across individuals into a single total and maximizing net benefit, fails to respect the distinctness of persons. However, this objection can be interpreted in different ways. One interpretation emphasizes that aggregating across distinct persons is illegitimate. Another emphasizes that a correct principle must be sensitive to how benefits and burdens are *distributed* across persons (distribution-sensitivity). Utilitarians can accept distribution-sensitivity if it maximizes utility.

  A "Reductionist" view of personal identity holds that what unites a person over time consists fundamentally in physical and psychological continuities (e.g., memory connections, similarity of character, bodily continuity) that admit of degrees. On this view, the boundary between persons is metaphysically similar to the boundary between entities like a nation or a club – it is a matter of degree rather than a sharp, fundamental divide.

  The "Mirror Test" requires taking any principle you propose for distributing benefits and burdens *between* distinct persons and applying it to the distribution of benefits and burdens *within* a single life over time (e.g., between your childhood self, your current self, and your future self). You must then either accept the implications of this intrapersonal application or explain what makes the interpersonal case *relevantly different*. Simply stating "they are different persons" is insufficient; you must identify a morally relevant difference.

  *Question:*
  Critically evaluate the force of the Separateness of Persons objection against Utilitarianism in light of Cases A and B, the Reductionist view, and the Mirror Test.
  1.  Explain how the objection, interpreted strictly as forbidding interpersonal aggregation, delivers a plausible verdict in Case A but seems to overreach in Case B.
  2.  Propose a *minimal* principle that captures the plausible verdicts in *both* Case A and Case B. Explicitly state what *one attractive claim* this principle must surrender to avoid the overreach in Case B.
  3.  Construct a Reductionist reply arguing that, given the nature of personal identity, the SoP objection (interpreted as forbidding aggregation) loses significant force. Briefly explain why this reply is challenging.
  4.  Apply the Mirror Test to your proposed principle from part (2). State the result of the intrapersonal application. Either accept this result or explain what *specific* feature makes the interpersonal case relevantly different, beyond merely the numerical difference of persons. How does this response address the Reductionist challenge?

  ---

  **Model Answer (Bottom Line First):**

  A minimal principle prohibiting the imposition of significant uncompensated burdens on identifiable individuals for the sake of aggregated minor gains elsewhere, but permitting the imposition of trivial costs to prevent catastrophic harms, captures the intuitive verdicts in both cases by surrendering strict person-affectingness, and withstands reductionism by grounding the relevant interpersonal difference in the phenomenology of unified agency over time rather than metaphysical separateness.

  **(1) The Aggregation Dilemma in Cases A & B:** The SoP objection's core anti-aggregation interpretation – that summing benefits/burdens across distinct persons is illegitimate – yields intuitively plausible results in Case A but problematic ones in Case B. In Case A, Utilitarianism would mandate choosing Option 2, as the larger *summed* burden outweighs the single severe burden. However, imposing a million barely perceptible itches, even if summed into a large total, seems clearly *less* morally problematic than imposing intense, prolonged pain on one identifiable individual. Anti-aggregation captures this: it forbids trading the severe burden on X for the aggregated minor burdens on the million, prioritizing the integrity of X's well-being against being sacrificed for diffuse gains. In Case B, however, strict anti-aggregation forbids imposing *any* unconsented cost on Y (the trivial inconvenience) to prevent five severe harms. Preventing the aggregation of the five severe harms (death/disability) is deemed illegitimate if it requires imposing *any* cost on a distinct person without their consent. This veto seems absurdly demanding, effectively paralyzing action to prevent large-scale catastrophes if *any* minor cost to *anyone* is involved, regardless of the net benefit or the nature of the harms prevented. The dilemma is clear: anti-aggregation avoids the counterintuitive sacrifice in A but leads to an unacceptable veto in B.

  **(2) A Minimal Principle and the Surrendered Claim:** To resolve this, we need a principle sensitive to the *magnitude* and *nature* of the burdens involved in the trade-off. A minimal principle might be: **It is impermissible to impose a significant burden on one person (or a few) solely to secure minor benefits for others, even if the aggregated benefits are large; however, it is permissible to impose a trivial cost on one person (or a few) to prevent severe harms to others, provided the harms prevented are substantially worse than the cost imposed and no less costly alternative exists.** This principle forbids Option 1 in Case A (significant burden on one vs. minor burdens on many) and permits action in Case B (trivial cost on one to prevent severe harms to many). Crucially, to avoid the veto in B, this principle *surrenders strict person-affectingness*. Strict person-affectingness holds that an action can only be wrong if it makes some *particular* person worse off. In Case B, preventing the severe harms *benefits* the five, but imposing the trivial cost *harms* Y. Strict person-affectingness might suggest this harms Y for the benefit of others, making it impermissible absent Y's consent. Our principle permits this, accepting that benefiting some can sometimes justify harming others, *provided* the harms are trivial relative to the benefits. It thus rejects the idea that morality is solely concerned with impacts on identifiable individuals in isolation.

  **(3) Reductionist Challenge and its Force:** The Reductionist argues that if personal identity consists in degrees of psychological connectedness/continuity (Parfit), then the boundaries between "persons" are blurred. Just as it's permissible to impose minor costs on my "future self" (e.g., saving money now for my retirement) for a larger future benefit because of the strong connections, it might be permissible to impose costs on a "less connected" other if the connections are sufficiently weak and the aggregated benefit sufficiently large. For Case A, they might argue that if the million strangers are psychologically very similar to X (same desires, values), aggregation becomes *more* defensible, weakening the force of the SoP objection against Option 2. More fundamentally, if persons are not metaphysically distinct in the way the SoP objection assumes, the objection's foundational premise – that distinct persons create a barrier aggregation cannot cross – loses its force. This is challenging because it attacks the metaphysical basis for treating interpersonal trade-offs as fundamentally different from intrapersonal trade-offs, potentially collapsing the distinction the SoP objection relies upon.

  **(4) Mirror Test Application and Addressing Reductionism:** Applying our minimal principle intrapersonally: Should I (my current self) impose a significant burden (e.g., intense pain) on my future self (say, 20 years from now) solely to secure minor benefits (e.g., small pleasures) for myself at various points in the intervening years, even if summed? Our principle forbids this – it would be irrational/self-sacrificial. Should I impose a trivial cost (e.g., slight discomfort now) on my current self to prevent a severe harm (e.g., permanent injury) to my future self? Our principle permits this – it's prudent long-term planning. The intrapersonal results align with interpersonal prudence: avoid significant future sacrifices for minor present gains; accept minor present costs to prevent major future harms. **I accept these intrapersonal results.** The relevant difference between the interpersonal and intrapersonal cases *in terms of applying the principle* is not primarily the metaphysical separateness of persons, but the *phenomenology and mechanisms of unified agency over time*. Within a single life, there is (typically) a unified conscious perspective, memory, anticipation, and the capacity for direct, non-alienated concern for one's future states ("I care *now* about *that* future pain *as mine*"). This unified agency allows for direct compensation and rational planning across time in a way that is impossible between distinct agents. Stranger Y cannot directly experience the benefit of the harms prevented to the five; their sacrifice is imposed externally. While Reductionism questions the metaphysics, the practical reality of distinct centers of consciousness, agency, and concern persists. Our principle reflects constraints on imposing costs *on other such distinct centers of agency*, grounded in the respect owed to their independent standpoint, even if the metaphysical boundaries are fuzzy. This addresses Reductionism by grounding the relevant moral distinction not in a sharp metaphysical divide, but in the practical realities of agency and concern, which remain robust even if identity is reductionist. We respect the separateness of *perspectives and agencies*, not necessarily metaphysically atomic substances.

  ---

  **Marking Scheme (Total: 20 marks; 4 marks per item):**

  *The key discriminator for an A answer (18-20) is the clear articulation and defense of a minimal principle that navigates the dilemma in Cases A & B by surrendering a specific attractive claim (strict person-affectingness), combined with a Mirror Test application that identifies a relevant difference-maker beyond numerical distinctness (unified agency/perspective) to address reductionism.*

  1.  **Analysis of the Aggregation Dilemma (Cases A & B):** (4 marks)
      *   *Earns marks:* Clearly explains why strict anti-aggregation forbids Option 1 in Case A (plausible: protects X from severe burden for aggregated minor gains) and forbids action in Case B (implausible overreach: trivial cost veto prevents catastrophic harm prevention).
      *   *Common mistake:* Only focuses on Case A, or misstates the utilitarian verdicts, or fails to articulate *why* the Case B verdict is problematic (absurd veto).

  2.  **Proposal of Minimal Principle & Surrendered Claim:** (4 marks)
      *   *Earns marks:* Proposes a principle that forbids imposing significant burdens for aggregated minor gains (capturing Case A) *and* permits imposing trivial costs to prevent severe harms (capturing Case B). *Explicitly names* the surrendered attractive claim as **strict person-affectingness** (or equivalent, e.g., the veto power of the individual against any harm for others' benefit).
      *   *Common mistake:* Proposes a principle that only handles one case (e.g., only forbids Case A, still forbids Case B); fails to identify any surrendered claim or identifies the wrong claim (e.g., aggregation itself, distribution-sensitivity).

  3.  **Reductionist Challenge Construction & Evaluation:** (4 marks)
      *   *Earns marks:* Constructs a plausible Reductionist reply: argues that blurry personal boundaries (degrees of connectedness) weaken the moral force of SoP by making interpersonal trade-offs more like intrapersonal trade-offs (e.g., strong connections might justify aggregation; weak separateness undermines the barrier). Briefly explains why this is challenging (attacks the metaphysical foundation of SoP/anti-aggregation).
      *   *Common mistake:* Misstates reductionism; fails to connect it to weakening SoP; gives a reply that isn't challenging or relevant.

  4.  **Mirror Test Application & Difference-Maker:** (4 marks)
      *   *Earns marks:* Correctly applies the proposed principle intrapersonally (forbids significant future burden for minor summed present gains; permits trivial present cost to prevent severe future harm). *Either* accepts the intrapersonal result *or* identifies a relevant difference-maker **beyond mere numerical distinctness** (e.g., unified conscious perspective, unified agency, direct non-alienated concern, mechanisms of compensation/anticipation). Explains *how* this feature matters.
      *   *Common mistake:* Fails to apply the principle correctly intrapersonally; states "different people" as the only difference; identifies a difference-maker irrelevant to the principle (e.g., consent, which isn't in the principle).

  5.  **Integration & Addressing Reductionism via Mirror Test:** (4 marks)
      *   *Earns marks:* Explains *how* the response to the Mirror Test (accepting the result OR identifying unified agency/perspective as the key difference) addresses the Reductionist challenge. Argues that unified agency/perspective provides a morally relevant distinction *even if* metaphysical boundaries are fuzzy, grounding the principle's constraints in the respect owed to distinct centers of consciousness and concern.
      *   *Common mistake:* Fails to connect the Mirror Test response back to reductionism; simply restates the difference-maker without explaining its relevance to the challenge; reverts to asserting sharp metaphysical separateness despite reductionism.

  **Note on Tempting Inference (Costs Marks):** A weak but confidently made answer will present the dilemma as a *simple binary choice*: either the SoP objection is so weak that Utilitarianism satisfies it (e.g., by accepting distribution-sensitivity), or it must entail an absolute veto against imposing *any* cost on one for others' benefit (forbidding Case B). Failing to see and articulate the *third option* – a principle like the one proposed that forbids *certain kinds* of harmful aggregations (significant burdens for minor gains) but permits others (trivial costs to prevent severe harms) – represents a significant failure to grasp the complexity of the objection and its potential resolutions. Answers making this binary inference without developing the third option should not score highly on items 2 and 5.
