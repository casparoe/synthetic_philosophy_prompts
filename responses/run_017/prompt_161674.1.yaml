prompt: |-
  I am completing a PhD in political philosophy and, for the past two years, have served as the non-legal member of an intake panel at a national asylum authority, advising the caseworkers who triage claims before they reach a hearing. I would like the two questions at the centre of my field's literature — who counts as a refugee, and which state has to take them in — turned into a single decision procedure that a caseworker with a fortnight's training can run in under an hour: the questions in the order they must be asked, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision upward because the remaining disagreement is one of values rather than facts. Roughly four hundred claims a year pass through us, every triage note has to be defensible in a written appeal, and a legal officer signs off.

  On the first question, the procedure has to handle three recurrent hard cases: the claimant fleeing generalised criminal violence who can name nobody with a reason to target them; the claimant from a province the state has quietly abandoned after slow-onset environmental collapse, where the reason for leaving is the disappearance of protection rather than the presence of a persecutor; and the claimant whose proposed social group is defined only by the harm its members share. Say whether a well-founded fear requires an identifiable agent, or whether a failure of protection can substitute for one, and at which step the procedure should decline to answer at all.

  On the second question, give me a priority ordering among the grounds on which a particular state can be picked out — presence or first arrival, causal contribution to the displacement, capacity to absorb, and the claimant's own ties of language, family, prior employment, or prior colonial administration — and say which are trumps and which are only tie-breakers.

  Then run the whole procedure on three cases from last month: a farming family from a delta province whose land has been destroyed by saltwater intrusion, whose district administration withdrew two years ago, where no armed group holds the territory, and who walked into the adjacent state, which already hosts a refugee population equal to several per cent of its own citizens; a journalist with documented threats from a named official who passed through three safe countries and claimed in ours, where her sibling lives and where she once worked for six months, and whom our panel would prefer to return to the transit state; and an unaccompanied seventeen-year-old whose feared persecutor was the local commandant of a militia since disbanded, where the fear was well-founded when he fled and nobody can say whether the militia will re-form. Finally, tell me where the procedure cannot be run at all — missing country-of-origin evidence, credibility, anything else — and what it could never settle even if run perfectly, such as whether a state may close its borders to all comers or how large the total obligation is.
reasoning: |-
  Okay, the user is asking for a structured decision procedure to handle asylum claims, combining the two central questions in refugee literature: who qualifies as a refugee and which state is responsible. They need this to be practical for caseworkers with minimal training, defensible in appeals, and applicable to about 400 claims a year. 

  First, I need to address the hard cases they mentioned: generalized violence without specific targeting, environmental collapse leading to protection failure, and social groups defined by shared harm. The key here is interpreting "well-founded fear" under the Refugee Convention—does it require an identifiable agent, or can protection failure suffice? The consensus in jurisprudence leans toward requiring a persecutor or at least a protection failure attributable to a quasi-state actor. For environmental cases, if the state has abandoned the area, that might constitute protection failure. Social groups defined solely by harm are tricky; the harm must be tied to a characteristic fundamental to identity.

  Next, the responsibility assignment question. The user wants a priority order for assigning responsibility to states. The Dublin-style presence/first entry approach is administratively simplest but often criticized. Causal contribution (like for climate migrants) is legally murky. Capacity is pragmatic but ethically fraught. Ties (family, language) are strong for integration but not primary. I'd prioritize presence as the initial filter, then ties, then capacity/causation as tiebreakers. This balances practicality with fairness.

  For the three test cases: 

  The farming family from the delta—environmental collapse with state withdrawal. Persecution analysis fails because no agent or group targets them. Protection failure is clear, but under current law, that's insufficient without a Convention reason. The procedure would likely stop at Q3. Responsibility-wise, adjacent state is clear under presence principle. 

  The journalist—classic political persecution case. Clear agent and Nexus. But she passed through safe countries. The procedure would flag this as a "hand upward" for policy discretion on responsibility override. 

  The teen with disbanded militia—persecutor exists but threat is uncertain. The procedure would ask if the agent still exists or could plausibly re-form. This might need upward referral for future-risk assessment. 

  Gaps in the procedure: missing evidence (e.g., COI), credibility disputes, and non-legal value judgments (like border closures or total obligation caps) are beyond its scope. The procedure can't resolve systemic questions—it's a triage tool, not a philosopher's stone. 

  The user's deeper need seems to be bridging theory and practice. Their PhD background wants theoretical rigor, but their panel role demands operational simplicity. The tension between "what should be" (moral responsibility) and "what is" (legal constraints) is palpable. They might be frustrated by how often real cases fall into Convention gaps. The procedure I propose leans conservative to avoid overreach—it flags edge cases for higher review rather than forcing square pegs into round holes. That's deliberate: defensibility in appeals matters more than theoretical purity here.
answer: |-
  Here's a streamlined decision procedure integrating refugee status determination (RSD) and responsibility allocation (RA), designed for rapid triage by trained caseworkers. It prioritizes defensibility, handles your hard cases explicitly, and flags value disputes for legal officers.

  **Core Principles:**
  1.  **Sequential:** Status determination *precedes* responsibility allocation.
  2.  **Structured:** Binary or multiple-choice questions with defined thresholds.
  3.  **Evidence-Based:** Stops ("No" or "Hold") where evidence thresholds aren't met.
  4.  **Transparent:** Clear documentation points at each step.
  5.  **Escalation:** Flags complex legal/value disputes ("Hand Upward").
  6.  **Convention-Centric:** Starts from 1951 Convention/1967 Protocol definitions.

  **The Decision Procedure:**

  **I. REFUGEE STATUS DETERMINATION (RSD)**
  *(Objective: Does the claimant meet the 1951 Convention definition?)*

  1.  **Agent of Harm?** Is there an identifiable actor(s) capable of inflicting serious harm?
      *   *Sufficient Answer:* Named individuals/groups (state agents, militias, gangs, family/community actors) + description of capability.
      *   *Hard Case: Generalised Violence:* If NO identifiable agent targeting claimant personally, proceed to Q3. *(Document: "No specific agent identified. Proceed to Protection Analysis.")*
      *   *Stop/No:* Harm described is solely natural (e.g., earthquake, untargeted famine without discriminatory withholding of aid). *(Document reason & stop RSD.)*

  2.  **Nexus?** Is there a causal link between the feared harm and a Convention ground (Race, Religion, Nationality, Political Opinion, Membership of a Particular Social Group - MPSG)?
      *   *Sufficient Answer:* Credible narrative linking harm/threat to claimant's actual/imputed characteristic under one ground. Evidence of persecutor's motive/pattern helps but isn't always required if characteristic is evident.
      *   *Hard Case: Social Group Defined by Harm:* If the *only* defining characteristic is the shared harm (e.g., "people targeted by gang X"), this is **INSUFFICIENT**. Group definition must exist *independently* of the persecution (e.g., "women heads of household in neighbourhood Y refusing extortion"). *(If only shared harm, answer NO. Document & Stop RSD unless other ground applies.)*
      *   *Stop/No:* Harm/threat lacks any credible connection to a Convention ground (e.g., purely criminal vendetta unrelated to identity, personal dispute). *(Document reason.)*

  3.  **Protection Failure?** Is the state/unable or unwilling to provide protection against the serious harm (from Q1 Agent or Q3 context)?
      *   *Sufficient Answer:* Evidence of state incapacity (e.g., no police presence, collapsed infrastructure), unwillingness (e.g., official complicity, discriminatory non-protection), or *de facto* abandonment of territory.
      *   *Hard Case: Environmental Collapse/Abandonment:* **YES, if** the state has withdrawn administrative control/services *and* this withdrawal creates a vacuum exposing claimant to serious harm (e.g., rampant lawlessness, inability to access basic survival needs due to lack of governance) *and* the harm has a Nexus (Q2). The "persecutor" becomes the *state of origin through its failure*. *(Document: "Protection failure due to state abandonment creating conditions of [describe serious harm], linked to [Convention ground].")*
      *   *Stop/No:* State is demonstrably willing/able to protect, claimant didn't seek available protection without good reason, or harm doesn't meet seriousness threshold. *(Document reason.)*
      *   *Hand Upward:* Complex assessment of state capability/willingness where evidence is ambiguous or involves novel legal arguments (e.g., climate change as persecution).

  4.  **Well-Founded Fear?** Is the fear subjective (genuine) and objectively reasonable?
      *   *Sufficient Answer:* Credible, consistent claimant testimony + available Country of Origin Information (COI) supporting the plausibility of harm/threat/protection failure described in Q1-3.
      *   *Stop/No:* Testimony fundamentally implausible/contradictory, COI directly refutes core claims, fear clearly not genuine. *(Document specific inconsistencies/refutations.)*
      *   *Hand Upward:* Complex credibility assessments, mixed COI, assessment of future risk where the situation is volatile (e.g., disbanded militia).

  **RSD Outcome:**
  *   **YES (Refugee Status Prima Facie Met):** If Q1 (or Q3 Protection Failure substitutes) = YES *AND* Q2 = YES *AND* Q3 (if Agent absent) = YES *AND* Q4 = YES. Proceed to RA.
  *   **NO:** If any Q1/Q2/Q3/Q4 = NO. Document specific reason. Stop procedure.
  *   **HOLD:** If critical evidence missing (see Gaps below). Suspend, request info.
  *   **HAND UPWARD:** Complex legal/value issues flagged in Q3 or Q4. Escalate with clear question for legal officer.

  **II. RESPONSIBILITY ALLOCATION (RA)**
  *(Objective: Which state bears responsibility for assessing/protecting this claimant?)*
  *(Apply ONLY if RSD = YES)*

  **Priority Order & Weight:**

  1.  **Presence / First Safe Arrival (TRUMP):** The state where the claimant first arrived and *could have* claimed asylum is presumptively responsible.
      *   *Sufficient Answer:* Evidence of entry/stay in another state party to the Refugee Convention *before* entering this state.
      *   *Effect:* If YES, responsibility lies with that first safe state. Recommend return/referral. *(Document evidence of transit/stay & Convention status of that state).*
      *   *Overrule (Hand Upward Only):* If applying this rule leads to *clear, compelling, and documented* risk of refoulement or inhuman/degrading treatment in the first country, *or* if the first country is not a Convention party/lacks functioning asylum system. Requires legal officer sign-off. *(Document specific risks/system failure).*

  2.  **Significant Ties (STRONG TIE-BREAKER after Presence):** If no prior safe country OR Presence rule overruled, does the claimant have **very strong** ties to *this* state?
      *   *Sufficient Answer:* **Immediate Family** (spouse, minor children, parents of minor claimant) are citizens/residents *OR* **Prior Long-Term Residence** (>5 years) *OR* **Substantial Prior Employment** (>2 years) creating integration. Language/culture alone is weak. Colonial ties are highly context-specific and generally weak without current links.
      *   *Effect:* Strongest tie-breaker. Favors state with closest, most substantive existing links facilitating integration.

  3.  **Capacity to Absorb (WEAK TIE-BREAKER / POLICY FACTOR):** Relative capacity of potential responsible states.
      *   *Considerations:* Existing refugee population size relative to GDP/population (e.g., several % is significant), specific local integration challenges.
      *   *Effect:* Only relevant as a secondary tie-breaker if ties (Q2) are weak/equal. Never a primary reason to *accept* responsibility if Presence (Q1) applies elsewhere. Can be a factor supporting a *Hand Upward* argument against returning to a severely overwhelmed first country (see Q1 Overrule).

  4.  **Causal Contribution (HAND UPWARD / POLICY):** Did this state significantly contribute to the displacement?
      *   *Effect:* **Not a standard RA factor.** Politically & legally complex. Flag for legal officer/policy consideration *only* in extreme cases (e.g., direct military action causing flight). Not applicable for triage.

  **RA Outcome:**
  *   **RESPONSIBLE (THIS STATE):** If Q1 = NO (no prior safe country) OR Q1 Overruled (Hand Upward approved) *AND* Q2 = YES (Strong Ties).
  *   **NOT RESPONSIBLE (RETURN/REFER):** If Q1 = YES (prior safe country exists) *and* Q1 Overrule not justified.
  *   **HAND UPWARD (COMPLEX RA):** For Q1 Overrule requests, complex tie-breakers between ties/capacity, or novel causal contribution arguments.

  ---

  **Application to Test Cases:**

  1.  **Farming Family (Delta, Saltwater, State Withdrawal):**
      *   **RSD Q1:** NO (No identifiable agent). **Q2:** ? (Nexus? Poverty alone isn't a ground. Is there discrimination against displaced delta dwellers? If yes, proceed. If no generic poverty, STOP/NO). **Q3:** YES (State abandoned territory, failure of protection leading to serious harm - lack of basic services/lawlessness? Must be linked to Q2). **Q4:** ? (Well-founded? COI needed on conditions). *Outcome:* Highly dependent on Nexus (Q2) and Protection Failure causing serious harm (Q3). If Q2=YES & Q3=YES & Q4=YES, RSD=YES. **RA:** Presence = Adjacent State (Strong - they entered there). Ties to *your* state? Unlikely. Capacity argument weak against Presence. **Recommendation:** Not Responsible. Refer/Return to adjacent state.

  2.  **Journalist (Named Threats, 3 Transit Countries, Sibling/Work Ties):**
      *   **RSD:** Q1=YES (Named official), Q2=YES (Political Opinion), Q3=YES (State unwilling/unable? Threats suggest failure), Q4=YES (Documented threats). RSD=YES. **RA Q1:** YES (Passed through 3 safe countries - likely Convention parties). Q1 Overrule? Panel "preference" isn't enough. Need evidence of risk/system failure in transit state. Q2: Ties? Sibling = Strong Family Tie. 6 mos work = Weak. **Hand Upward:** For legal officer to decide: Does sibling tie + panel preference ("values") justify overriding the Presence rule vs. risk in transit state? Triage Recommendation: Not Responsible (Presence applies), but escalate Overrule request.

  3.  **Unaccompanied Minor (Disbanded Militia, Uncertainty):**
      *   **RSD Q1:** YES (Named past agent). Q2: YES (MPSG? Political Opinion? Depends on reason for targeting). Q3: YES? (State protection likely failed initially). **Q4: HAND UPWARD.** Well-founded fear *now*? Militia disbanded. Is re-formation likely? Is the ex-commandant still a threat? Requires complex future risk assessment based on COI/credibility. RSD outcome depends on this assessment. **RA:** If RSD=YES, Presence: Where did he first arrive? If in your state, Responsible. If transited others, apply Q1 Presence rule. Ties? Unlikely strong.

  ---

  **Where the Procedure Cannot Be Run or Cannot Settle:**

  *   **Cannot Run (Requires HOLD or Hand Upward):**
      *   **Missing Critical Evidence:** Lack of essential COI on agent existence, protection status, or general conditions in origin country. Lack of key identity/travel documents where credibility hinges on it.
      *   **Severe Credibility Issues:** Fundamental, irreconcilable inconsistencies in the claimant's account that prevent establishing basic facts required for Q1-Q4.
      *   **Incapacity:** Claimant unable to participate meaningfully (severe mental/physical health, trauma).
      *   **Novel Legal Theories:** Cases requiring interpretation far beyond established jurisprudence (e.g., is climate change *per se* persecution?).

  *   **Cannot Settle (Inherent Limitations - Require Policy/Legal/Political Resolution):**
      *   **Border Closure Legitimacy:** Whether a state has the right to refuse *all* asylum seekers. (Procedure assumes adherence to international obligations).
      *   **Total Obligation Cap:** How many refugees a state *must* accept overall. (Procedure allocates responsibility case-by-case within existing systems).
      *   **"Safe Third Country" Definition:** Precisely when another country is "safe" for *this specific claimant* beyond basic Convention adherence/system existence (part of Q1 Overrule complexity).
      *   **Moral vs. Legal Responsibility:** The gap between which state *should* take responsibility (e.g., causal contributor) vs. which state is legally obligated under current treaties (e.g., presence).
      *   **Value Conflicts in RA:** Balancing strict rules (Presence) vs. compassion/ties (e.g., the Journalist case). The procedure flags these, but the resolution depends on higher-level policy/values.
      *   **Non-Refoulement Absolute?:** The precise boundaries of when return is prohibited due to inhuman/degrading conditions vs. "mere" hardship.

  **Key for Triage Notes:** Document clearly at each step: Question, Answer, Sufficient Evidence Cited (Testimony point, COI reference), Reason for Stop/Hold/Hand Upward. For RA, explicitly state the basis for responsibility (e.g., "First safe arrival in State X documented", "Presence rule overruled due to risk in State Y per LO Smith, date", "Strong family ties: sibling citizen").

  This procedure provides a rigorous, defensible framework for triage, explicitly addresses your hard cases, flags value disputes for legal officers, and meets your operational constraints. It remains grounded in the Convention while acknowledging its limitations and the need for practical escalation points.
