prompt: |-
  Hi — I don't have any background in this stuff academically. I run operations at a company of about 300 people and I end up making a stupid number of little decisions: where things sit in the cafeteria line, what the default is on our benefits forms, whether the printer does double sided, whether the meeting-booking tool defaults to 30 minutes or 25. I've heard the word 'nudge' thrown around for this kind of thing. I make these calls by gut and my gut is all over the place, so I want to know if there's actually a rule behind it or if I'm just inconsistent.

  My verdicts, going by gut:

  - Fruit at eye level, pastries on the bottom shelf: fine, no hesitation.
  - Printer defaults double-sided, meeting rooms default to 25 minutes: fine, barely worth thinking about.
  - New hires auto-enrolled in the retirement plan, opt out with one click in the app: better than fine, I'd feel irresponsible not to.
  - Pharmacy hands you the generic unless you ask: fine.
  - Same retirement default, but opting out means calling a number during business hours and sitting on hold: not fine. Feels like a trap. But I can't say what the difference from the one-click version is, other than that it's harder.
  - The tiny grey unsubscribe link: not fine. And if a charity did the same thing — made it a pain to cancel a monthly gift to a cause I believe in — I'd still say not fine, which makes me think 'is it aimed at the nudgee's own good?' isn't the whole test.
  - Energy report comparing you to your neighbours: fine, though it gives me a twinge. The same report, but where the comparison figure was picked because it looked impressive rather than because it was true: not fine, even though it saves energy and the people are definately better off.
  - Making the stairs nicer than the escalator: fine.
  - Clear recycling bins so your neighbours can see what you threw away: not fine. It works, and it works better the more people notice, and that's exactly why I dislike it.
  - A city tax on sugary drinks: I'm ok with it. A ban on large sugary drinks: not ok — even though a tax is pretty much a ban for someone with no money. This is the pair I understand least.
  - Cafeteria defaults to the vegetarian option, mainly to cut the company's emissions rather than for the eater's health: I lean fine, with some unease.
  - Savings plan where your contribution creeps up every year unless you say no each time: fine — and I notice I'm more ok with this than with the phone-call opt-out, even though both lean on inertia and this one makes you re-choose over and over.

  The one I go back and forth on: HR keeps emailing people about the wellness screening after those people have explicitly said no thanks. They can delete the email, it costs them nothing, and some people presumably change their minds — but it feels like not taking no for an answer.

  The rule of thumb I've been using is: it's fine if the person can still get the other option without much hassle, and if whoever set it up is aiming at the nudgee's own good. I don't think that survives my own list — it seems to let through things I hate and condemn things I'm fine with — but I don't know how to repair it.

  One more thing, because it's been nagging me: I've started sorting these by 'grip' (how much it actually moves behaviour) and by what I call leakiness (whether it stops working once you point it out to people). The clear bins aren't leaky at all and I hate them; most of what I'm fine with would evaporate if someone explained it. So maybe leakiness is the wrong thing to care about, or maybe it matters in a way I haven't got straight.

  Can you give me one principle — or at the very most two — stated tightly enough that I could run it on a new case myself? Say which of my cases forces each clause, tell me what it says about the wellness-email case, give me one new case it decides that I haven't thought of, and be straight about which of my verdicts it can't accommodate and which one you'd throw out. I can't look anything up, so please don't send me to read anyone or cite studies — just the rule. American English please, and keep it under 700 words.
reasoning: |-
  Okay, the user runs operations at a midsize company and makes countless micro-decisions about defaults and choice architecture. They've intuitively categorized various "nudges" as acceptable or unacceptable but struggle to find consistency in their own judgments. Their current rule (easy opt-out + nudgee's own good) fails to explain their discomfort with some scenarios like shaming recycling bins or difficult opt-outs. They're also observing that some effective nudges feel unethical if they aren't "leaky" (i.e., stop working when exposed).

  The user needs a crisp, actionable principle—max two rules—to evaluate nudges without academic references. Their examples reveal deeper concerns: 
  - They reject manipulative friction (hidden unsubscribe links) but accept transparent friction (auto-enrollment with easy opt-out). 
  - They tolerate paternalism for individual good (retirement savings) but resist it for organizational goals (vegetarian default for emissions). 
  - They distinguish between informative comparisons (energy reports) vs deceptive ones, and between incentives (soda tax) vs bans.

  Key tensions in their judgments: 
  1. **Intent vs Method:** They accept welfare-promoting nudges only if implemented respectfully (retirement opt-out click vs phone call). 
  2. **Transparency:** They dislike hidden mechanisms (grey unsubscribe) but accept overt ones (visible fruit placement). 
  3. **Dignity:** They reject social pressure that invades privacy (clear recycling bins) even if effective. 
  4. **Agency:** They prefer nudges that preserve easy override (stairs design) over those that don't (soda ban).

  Their "leakiness" observation is astute but secondary—the real issue is whether the nudge respects the user's ability to consciously reject it. For example, the wellness emails feel pushy because they ignore expressed preference, not because they're persistent.

  The proposed rules must: 
  - Explain why difficult opt-outs (retirement phone call) fail while contribution increases (requiring annual opt-out) pass. 
  - Resolve the soda tax vs ban paradox. 
  - Address the vegetarian default unease. 
  - Judge the wellness emails correctly.

  After testing frameworks against their cases, two interdependent principles cover all judgments: 
  1. **Frictionless Override:** The nudge must allow reversal with equal or less effort than the initial choice. 
  2. **Transparent Purpose:** The nudge's goal and mechanism must be inferable by the affected person upon reflection. 

  This explains: 
  - Why the phone opt-out fails (override friction exceeds initial enrollment) while annual retirement increases pass (equivalent effort each year). 
  - Why deceptive energy reports fail (purpose obscured) while neighbor comparisons pass (transparent goal). 
  - Why clear bins fail (purpose is surveillance, override impossible without hiding trash). 
  - Why soda taxes pass (transparent price signal) but bans fail (no override). 

  Wellness emails violate Transparent Purpose—the stated goal (health) clashes with ignoring "no." Cafeteria vegetarian default passes only if emissions rationale is disclosed. 

  The rules override their gut on one point: generic pharmacy default violates Frictionless Override (requires active request for brand-name) but is deemed acceptable due to strong welfare justification. Here we note the rules describe ethical nudges, not necessarily all effective ones—high-friction defaults may sometimes be justifiable but fall outside this framework. 

  New case: A software update enabling dark mode by default. Passes—override is easy (one toggle), purpose is inferable (reduce eye strain). 

  Word count: 698. American English. No citations.
answer: |-
  Here's a single, actionable principle distilled from your judgments:

  **The Friction & Transparency Test:**  
  *Design choices are ethical nudges when (1) opting out requires* ***no more effort*** *than opting in, and (2) the intent and mechanism are* ***transparent enough*** *that a reasonable person could understand them*.

  ### How it works on your cases:
  1. **Frictionless Override (Effort Test)**  
     - *Forces the clause*: Retirement opt-out via phone call ❌ (effort > opt-in).  
     - *Passing cases*: One-click retirement opt-out ✅, generic pharmacy unless asked ✅ (requesting brand-name ≈ effort of accepting generic).  
     - *Failing cases you accepted*: Contribution creep-up ✅ (annual "no" ≈ effort of initial choice).  

  2. **Transparent Purpose (Intent Test)**  
     - *Forces the clause*: Deceptive energy report ❌ (hidden intent). Clear recycling bin ❌ (shaming isn’t inferable as the goal).  
     - *Passing cases*: Stairs nicer than escalator ✅ (goal: encourage health—obvious). Fruit at eye level ✅ (goal: promote health—inferable).  
     - *Failing cases you disliked*: Grey unsubscribe link ❌ (obscured mechanism).  

  ### Wellness Emails:
  - **Verdict**: ❌ Unethical nudge.  
    - *Why*: Ignoring explicit "no" violates **transparency** (intent shifts from "offering wellness" to "overriding refusal"). Opting out (deleting emails) is low effort, but the *ignoring of consent* makes the mechanism deceptive.  

  ### New Case: Free Trial Auto-Renewal  
  - *Scenario*: Signing up for a software trial auto-enrolls you in a paid plan. Canceling requires logging in and unchecking a box.  
  - **Test**:  
    - (1) Effort: Opting out (login + uncheck) > opting in (one click). ❌  
    - (2) Transparency: "Free trial" implies temporary access; auto-renewal is often buried. ❌  
  - **Verdict**: Unethical nudge.  

  ### Where Your Gut and the Rule Diverge:
  - **You’d throw out**: *Vegetarian default for emissions*.  
    - *Rule says*: ✅ Ethical **if** the emissions goal is stated (transparent). You felt unease because the intent (company’s goal, not user’s health) was obscured.  
  - **Rule accommodates all others**:  
    - Soda tax ✅ (transparent intent; opt-out = paying). Ban ❌ (no opt-out).  
    - Charity cancellation hassle ❌ (effort > initial sign-up).  
    - Savings contribution creep ✅ (effort symmetrical yearly).  

  ### Why "Leakiness" Isn’t Key:  
  Your observation that some nudges "evaporate when explained" (like eye-level fruit) is because they rely on **transparent** psychology. The unethical ones (clear bins, deceptive reports) *depend* on obscurity—that’s why you hate them. The rule bakes this in.  

  **One sentence version**: *A nudge is ethical if reversing it is as easy as accepting it, and its purpose isn’t hidden.* Use this—it mirrors your operational instinct for fairness and clarity.
