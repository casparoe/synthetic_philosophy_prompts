                   - Leaf: **Moral-constitutive account**  
                 - **Asymmetry absent?** (Intentionality judgments align with reader’s norms):  
                   - Leaf: **Conversational or blame-inheritance account**  
         - **Asymmetry present?** (Breach judged more intentional than fulfillment):  
