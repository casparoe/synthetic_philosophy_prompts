answer: |-
  ### Comparison of Convention Accounts

  **Account A (Lewis):**  
  - Requires: Coordination problem solution + mutual expectations + common knowledge + arbitrariness.  
  **Account B (Skyrms-style):**  
  - Requires: Self-reinforcement via learning/imitation/reproduction + path-dependence.  

  **Variant 1 (No Meeting of Minds)**  
  - **Lewis:** Convention.  
    *Reasoning:* Solves coordination problem via inferred regularity; engineers’ reliance implies mutual expectations (though common knowledge is borderline).  
    *Key clause:* Expectations giving reason to conform.  
  - **Dynamic:** Convention.  
    *Reasoning:* Pattern stabilizes through repeated success (learning from logs), reinforcing behavior.  
    *Key condition:* Self-reinforcement via precedent.  

  **Variant 2 (The Vestige)**  
  - **Lewis:** Not a convention.  
    *Reasoning:* Coordination problem is absent (signal prevents conflict), so expectations lack "reason of the right kind" to conform.  
    *Key clause:* Solving a coordination problem.  
  - **Dynamic:** Not a convention.  
    *Reasoning:* Persistence is due to inertia/cost, not ongoing learning or reinforcement; no self-reinforcing dynamic.  
    *Key condition:* Self-reinforcement via individual-level adaptation.  

  **Variant 3 (Pure Correlate, Day One)**  
  - **Lewis:** Not a convention.  
    *Reasoning:* No mutual expectations or common knowledge exist initially; coordination is accidental, not expectation-driven.  
    *Key clause:* Mutual expectations and common knowledge.  
  - **Dynamic:** Convention.  
    *Reasoning:* Perfect correlation (minute parity) creates immediate self-reinforcing attraction; no history needed if the pattern is inherently stable.  
    *Key condition:* Basin of attraction path-dependence.  

  ---

  ### Under-/Over-Generation  
  - **Lewis under-generates:** Excludes cases where coordination emerges without expectations (e.g., Variant 3). Overly strict on cognitive requirements.  
  - **Lewis over-generates:** Includes vestigial regularity after the coordination problem vanishes (e.g., Variant 2, if misjudged; here correctly excluded).  
  - **Dynamic under-generates:** Excludes conventions sustained solely by expectations without ongoing learning (none in these cases).  
  - **Dynamic over-generates:** Includes biologically hardwired or fixed-algorithm behaviors (e.g., Variant 3 if hardcoded), which may lack "social" flexibility.  

  **Residual Disagreement:** Substantive. It reflects a deeper split: Lewis ties conventions to *agency* (beliefs/reasons), while the dynamic account ties them to *systemic stability* (feedback loops). This is not merely terminological but concerns whether conventions require cognitive intermediation.  

  ---

  ### Epistemic Status  
  **Settled (Broad Consensus):**  
  1. Lewis’s account requires mutual expectations and common knowledge; the dynamic account does not.  
  2. Lewis’s arbitrariness condition aligns with the dynamic account’s basin-of-attraction dependence.  
  3. Both accounts treat conventions as solutions to coordination problems (explicitly in Lewis; implicitly in dynamic via stability).  

  **Genuinely Contested (No Consensus):**  
  1. Whether conventions *must* arise from recurrent interactions (Lewis) or can be one-off (dynamic Variant 3).  
  2. Whether vestigial patterns (Variant 2) ever qualify as conventions under any account.  
  3. The role of biology vs. learning: if behavior is innate (e.g., genetically programmed minute-parity response), is it convention?  

  **My Judgments (Not Consensus):**  
  - Variant 1’s "inference from logs" *suffices* for Lewis-style expectations (contested: some demand explicit agreement).  
  - Variant 3 is a convention *only* under dynamic accounts (contested: some argue conventions require history).  
  - The dynamic account’s handling of Variant 3 over-generates by including algorithmic (non-social) patterns.  

  ---

  \answer{hybrid; 0.4}
