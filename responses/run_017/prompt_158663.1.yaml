  Okay, let me approach this query methodically. The user teaches moral psychology and wants to analyze Sophocles' Antigone through Moral Foundations Theory (MFT), specifically testing a "foundation-blindness" hypothesis where Creon and Antigone fundamentally fail to recognize each other's moral frameworks. 

  First, I need to unpack the core request: the user seeks validation of their thesis that the tragedy stems not from differing moral weights but from mutual inability to perceive the other's foundations as moral at all. This requires examining key scenes - burial rites, Creon's political rhetoric, Antigone's appeal to unwritten laws, Haemon's intervention, Tiresias' prophecy, and the finale - to see if Sophocles allows any genuine cross-foundation understanding.

  Two complications arise. First, introducing the liberty foundation flattens the play into a comfortable oppression/resistance narrative, raising questions about MFT's flexibility. Second, the tragedy challenges MFT's implicit valorization of breadth since both characters operate with "complete" but incompatible moral frameworks that lead to disaster. 

  The normative challenge is crucial: students will ask whether MFT helps determine who's morally right. I must distinguish between MFT's descriptive power (how moral reasoning works) and its inability to prescribe outcomes (who should prevail in conflicts like burial rites vs state authority).

  Structuring the response: I'll walk through the play chronologically to test foundation-blindness, then address the liberty complication and breadth paradox. Finally, I'll confront the normative question head-on, emphasizing MFT's limitations for adjudicating moral truths while acknowledging its utility for diagnosing impasses like Antigone's.

  Key insights emerge: Sophocles deliberately denies characters access to each other's moral perceptions; Antigone's "sanctity" and Creon's "authority/loyalty" foundations create mutually exclusive moral realities; Haemon and Tiresias represent failed attempts at synthesis; the ending suggests foundation-blindness persists until destruction occurs. 

  On complications: Adding liberty indeed oversimplifies, revealing MFT's underdetermination problem. The breadth paradox shows that more foundations don't guarantee wisdom - Sophocles may argue for meta-rules to prioritize foundations contextually, something MFT structurally cannot provide as descriptive psychology.

  Normatively, I'll position MFT as illuminating why conflicts feel intractable (foundational incommensurability) but silent on resolution. The deflationary conclusion: MFT explains moral perception gaps but doesn't help transcend them, making its classroom value diagnostic rather than prescriptive.
answer: |-
  Your reading of *Antigone* through the lens of Moral Foundations Theory (MFT), specifically the concept of "foundation-blindness," holds significant interpretive power and illuminates the core tragic mechanism of the play. Sophocles meticulously constructs a conflict where Antigone (prioritizing Care, Sanctity, and arguably Loyalty to kin) and Creon (prioritizing Authority, Loyalty to the *polis*, and Liberty from subversion) operate within mutually incomprehensible moral universes. Neither perceives the other's actions as stemming from *moral* conviction; each interprets the other solely through the lens of their own foundational priorities as wilful defiance or oppressive tyranny. This blindness isn't merely disagreement; it's a fundamental failure of moral recognition.

  **Testing Foundation-Blindness Through Key Moments:**

  1.  **The Burial & Creon's Decree:** Antigone's act is driven by Care (for her brother's soul), Sanctity (honoring divine law regarding burial), and Loyalty to blood ties. For Creon, Polynices' burial isn't a moral act but pure treason – a violation of Authority (his edict), Loyalty to the city (rewarding a traitor), and an assault on Liberty (undermining civic order). He sees no piety, only subversion. Conversely, Antigone sees Creon's decree not as a legitimate exercise of Authority for civic Loyalty, but as pure impiety (violating Sanctity) and tyrannical bullying (abusing Authority, suppressing Liberty? – see complication below). She hears no moral concern for the city, only hubris.
  2.  **Creon's Language (Ship of State, Authority):** Creon consistently frames his actions in terms of the city's survival (Loyalty binding), the necessity of obedience (Authority), and the danger of anarchy (Liberty from chaos). His metaphors (ship of state, taming horses) emphasize control and stability. He interprets Antigone’s defiance, and later Haemon’s pleas, solely as challenges to his Authority and therefore existential threats to civic Loyalty. He cannot perceive the sanctity or familial care motivating them as valid counterpoints; they register only as destabilizing forces.
  3.  **Antigone's Appeal (Unwritten Laws, Sanctity):** Antigone’s famous appeal isn't just an argument for a different law; it’s an assertion that Creon’s entire moral framework (Authority/Loyalty to state) is irrelevant before the foundational demands of Sanctity and Care/Loyalty to kin. She doesn't engage with his concerns about civic order; she dismisses his edict as inherently blasphemous and immoral. She hears his civic arguments not as moral reasons but as the empty justifications of a tyrant.
  4.  **Haemon's Intervention:** Haemon’s role is crucial. He attempts to bridge the gap, appealing to Creon’s foundations – the city's loyalty *to its ruler* requires flexibility (Authority maintained through listening), and civic well-being (Loyalty binding) is harmed by rigid injustice. He tries to translate Antigone’s Sanctity/Care into Creon’s language of civic consequence. Creon utterly fails to comprehend. He hears only filial disloyalty (a betrayal of the Authority/Loyalty he expects from his son) and weakness. Haemon’s attempt at synthesis founders on Creon’s foundation-blindness.
  5.  **Pollution, Birds, Altars, Tiresias:** The pollution narrative directly engages Sanctity. The gods' displeasure (via Tiresias) is the ultimate vindication of Antigone’s foundational priority. Creon’s initial reaction to Tiresias is telling: he accuses the seer of corruption (Fairness violation), again interpreting a challenge to his Authority through the lens of conspiracy and betrayal. Only the terrifying specificity of the prophecy forces him to relent, not through a sudden understanding of Sanctity, but through fear of consequence. His collapse stems from the catastrophic *practical* failure of his rigid adherence to Authority/Loyalty (binding), which destroys his family (Care, Loyalty to kin) and the city's divine favor (Sanctity). It’s the *result* of blindness, not its cure.

  **Does Sophocles Grant Genuine Access?** Sophocles deliberately withholds genuine mutual understanding. There is no moment where Creon authentically grasps the sanctity of Antigone’s act or Antigone acknowledges the legitimacy of Creon’s civic concerns *as moral imperatives*. Haemon and Tiresias try to mediate, but fail. The tragedy hinges precisely on this impenetrable blindness. Each character possesses a "full-blooded" set of foundations *for their own worldview*, but utterly lacks the cognitive apparatus or willingness to perceive the moral reality inhabited by the other. The consequence is not compromise, but mutual destruction. Antigone dies defiant, upholding Sanctity. Creon survives, but only to witness the utter ruin of everything his Authority was meant to protect, realizing too late the cost of his blindness to foundations beyond his own. This structural denial of access underscores the tragic inevitability.

  **Complication 1: The Liberty Foundation - Comfort vs. Tragedy**
  Introducing the Liberty/Oppression foundation significantly alters the reading, and you are right to be wary. Framing Antigone as a liberty fighter resisting Creon’s oppressive authority flattens the play into a more modern, politically comfortable narrative of righteous rebellion against tyranny. While Creon *does* suppress dissent (violating Liberty), and Antigone *does* defy unjust authority (asserting Liberty?), Sophocles complicates this.

  *   **Antigone's Motivation:** Her primary drivers are Sanctity and Care/Loyalty to kin, not political liberty. She isn't challenging the concept of authority per se; she’s asserting a *higher* authority (the gods). Her defiance is religious, not primarily political.
  *   **Creon's Motivation:** Creon genuinely believes his rigid Authority is necessary to preserve the Liberty of the city *from chaos and subversion* (Polynices attacked Thebes!). He sees himself as the guardian of civic liberty, not merely a tyrant. His failure is blindness, not pure malice.

  MFT *can* generate both readings because the list of foundations is descriptive of recurrent moral themes, not a rigid, exhaustive ontology. The "liberty" foundation, added later, is particularly fluid and context-dependent. The ease with which the play can be read through either lens (blindness or liberty/oppression) suggests the theory’s categories are indeed somewhat underdetermined and flexible. This flexibility is a strength for description (capturing diverse moral intuitions) but a weakness if seeking a definitive, singular interpretation. The "blindness" reading preserves the deeper tragic tension by acknowledging the *internal moral logic* of both sides, even as they destroy each other. The pure liberty/oppression reading risks making Creon simply the villain and Antigone simply the hero, diminishing the tragedy.

  **Complication 2: Breadth vs. Narrowness - A Tragic Paradox for MFT**
  The tragedy starkly challenges MFT's implicit valorization of breadth. Here are two individuals operating with intense commitment to distinct, internally coherent sets of foundations (Antigone: Care, Sanctity, Loyalty (kin); Creon: Authority, Loyalty (polis), Liberty (from chaos)). Yet, this very commitment, without a meta-framework for adjudication or even recognition, leads to catastrophe. MFT descriptively notes that broader foundation use correlates with certain political stances, but *Antigone* suggests a darker possibility: that passionately held, "complete" but incompatible moral frameworks, when colliding without mutual comprehension or a higher arbitration mechanism, can be *more* destructive than narrowness. Narrowness might be limiting; passionate breadth without integration or prioritization rules can be fatal.

  *   **Does Sophocles argue breadth without rules is worse?** The play certainly demonstrates its peril. Creon *eventually* experiences the catastrophic consequences of ignoring Sanctity and Care, but only through utter ruin, not through achieving breadth. Antigone perishes upholding her foundations, never conceding the moral validity of Creon's position. The chorus often voices conventional wisdom appealing to multiple foundations (e.g., reverence for gods and rulers), but remains ineffective. The tragedy argues for the *necessity* of recognizing multiple foundations but shows the *impossibility* of reconciling them when foundational priorities clash absolutely and protagonists are blind to each other's moral language.
  *   **Can MFT say this?** Structurally, as descriptive psychology, MFT struggles. Its core narrative is about *differences* in foundation reliance explaining political divides. Highlighting the *dangers* of passionate commitment to *any* set of foundations, or the catastrophic failure of mutual incomprehension even between individuals using "full" sets, veers into normative territory it avoids. MFT describes the landscape of moral intuition; it doesn't inherently provide the tools to navigate conflicts within that landscape or warn of its potential minefields. *Antigone* exposes this limitation, suggesting that understanding *why* people moralize differently is necessary but insufficient for preventing tragedy; it doesn't tell us *how* to resolve the conflicts that arise.

  **Facing the Normative Question: What Does MFT Entitle Us To Say?**
  MFT is fundamentally descriptive psychology. It makes an empirical claim: self-identified liberals and conservatives tend to rely on different subsets of moral foundations when making judgments (Liberals: heavily Care/Fairness/Liberty; Conservatives: all five/six, emphasizing Binding more). Granting the empirical validity (which has support, though debates about methodology and universality exist), here's what it does and does not tell us:

  *   **What it tells us:** MFT helps explain *why* Creon and Antigone (or modern political opponents) find each other's positions baffling or immoral. It illuminates the cognitive disconnect – they are literally attending to different aspects of the situation as morally salient. It explains the *intractability* of such conflicts. It helps us diagnose "foundation-blindness."
  *   **What it does NOT tell us:** MFT tells us **absolutely nothing** about who is *right* regarding burial rites, loyalty to kin vs. state, or the legitimacy of authority in this specific context. It describes the sources of moral intuition, not the moral truth. It cannot adjudicate between the demands of Sanctity (burial) and Authority/Loyalty-binding (state decree). It cannot tell us whether Antigone's unwritten laws *should* trump Creon's civic edict, or whether Creon's concern for order *justifies* suppressing religious duty.

  **The Deflationary Conclusion & Its Cost:**
  The honest, deflationary conclusion is this: **MFT offers a powerful lens for understanding the psychological origins of moral disagreement and the profound difficulty of communication across foundational divides, but it provides no guidance whatsoever for resolving those disagreements or determining which side possesses moral truth in a given conflict.**

  *   **Cost:** This is deeply unsatisfying, especially for students seeking moral clarity. It means handing them a tool for diagnosis ("Ah, this is a Care/Sanctity vs. Authority/Loyalty clash! That's why they talk past each other!") but not for prescription. It doesn't tell them whether Antigone was "right." It may feel like moral relativism, though it's more accurately *psychological* descriptivism about moral intuition.
  *   **Value:** The value lies precisely in this deflation. It prevents the easy, anachronistic judgment (Creon=bad tyrant, Antigone=good rebel). It forces engagement with the *internal moral logic* of both characters, revealing the tragic depth of their collision. It tempers confidence in one's own moral righteousness by showing how differently others' moral compasses are calibrated. It highlights that tragic conflict often arises not from evil intent, but from irreconcilable moral perceptions rooted in foundational priorities. It makes the play harder, sadder, and more profound. It teaches humility about the limitations of our own moral vision and the difficulty of true moral dialogue across foundational chasms.

  In sum, your "foundation-blindness" thesis powerfully illuminates *Antigone*'s tragic core. Sophocles deliberately denies mutual comprehension, showing the catastrophic cost. The Liberty foundation complicates by offering a simpler, less tragic reading, revealing MFT's flexibility. The play challenges MFT's optimism about breadth, showing its potential for disaster without meta-rules. Normatively, MFT explains the *why* of intractable conflict but is silent on the *who is right*. The deflationary conclusion – MFT as diagnostic, not prescriptive – is smaller but defensible, fostering crucial humility about the roots and perils of moral disagreement. It won't give your students easy answers, but it will give them a deeper, more unsettling, and psychologically resonant understanding of the tragedy.
