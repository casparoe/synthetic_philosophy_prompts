answer: |-
  **OFFICE OF REVEALED WELFARE (ORW)**  
  **Internal Guidance Memorandum: ORW/OPF/23-456/Rev.A**  
  **Subject: Operational Protocols for Welfare Assessment Under the Revealed Preference Framework (RPF)**  
  **Date:** 24th October 2023  
  **Distribution:** All Caseworkers (Grades EO-HEO), Department of Welfare Protocols (DWP)  

  ---

  **1. Purpose**  
  This memorandum provides definitive operational guidance for assessing claimant welfare under the Revealed Preference Framework (RPF). Welfare is defined exclusively by choices made from feasible sets. There is no external metric. Adherence to this framework ensures objectivity, efficiency, and procedural rigour.  

  **2. Core Principle**  
  A claimant’s welfare is wholly constituted by their selected option from the menu of alternatives available at the point of decision. The chosen option is, by definition, revealed preferred to all other options within that specific feasible set. No subjective experience, stated preference, or unobserved constraint is germane to assessment.  

  **3. Efficiency Savings & Menu Reduction (Clause 5.7b RPF)**  
  3.1 Where Departmental policy reduces a claimant’s feasible set (e.g., removal of Benefit A, restriction of Benefit B eligibility), this constitutes an efficiency saving.  
  3.2 **Assessment Protocol:** The claimant’s subsequent selection of an option from the reduced menu **demonstrates** that the chosen option is revealed preferred to all *remaining* options. As their welfare is defined solely by choice *within the current menu*, there is **no welfare cost** associated with the reduction itself. The pre-reduction menu is operationally irrelevant.  
  3.3 **Recording:** Log as "Menu Optimisation - Efficiency Realised (Code MO-ER)". No adverse welfare impact is to be recorded.  

  **4. Interpretation of Choices Involving Sacrifice or Constraint (Clause 8.3 RPF)**  
  4.1 Claimants may select options that appear sub-optimal to external observers (e.g., selecting a smaller food portion allocation).  
  4.2 **Assessment Protocol:** The selection **is** the revealed preference. The rationale (e.g., "to ensure children have enough") constitutes an unobservable constraint or belief, forming part of the *background conditions* of the choice.  
  4.3 **Recording:** The claimant has demonstrated a revealed preference for the smaller portion *over* the larger portion *within the actual feasible set they faced* (which included their belief about children's needs). Log as "Preference Manifest (Code PM)" and record the chosen portion size as optimal *for that claimant*. No inference of deprivation is permitted.  

  **5. Handling Preference Incoherence (Weak Axiom of Revealed Preference - WARP)**  
  5.1 A claimant’s choices must satisfy WARP: If Option A is chosen when B is available, B cannot be chosen when A is available in a *different but overlapping* menu. Violation indicates incoherent preferences.  
  5.2 **Assessment Protocol:**  
      *   **Scenario:** Claimant chooses Budget Energy Tariff A over Tariff B in Menu 1. When Menu 2 (losing Tariff A, gaining Tariff C) is offered, claimant chooses Tariff B.  
      *   **Violation:** Tariff B was available but not chosen in Menu 1, yet chosen over Tariff C (and implicitly A) in Menu 2. This violates WARP.  
  5.3 **Recording:** Log as "WARP Failure - Preferences Incoherent (Code WF-PI)". The claimant has no consistent underlying preference ordering. **Consequence:** Without coherent preferences, welfare is unassessable. Needs are indeterminate. Suspend benefit assessment pending "Preference Stability Review" (Form ORW/PSR-1, min. 6-month observation period).  

  **6. Non-Comparability of Welfare Improvements (Ordinality Principle - Clause 1.1 RPF)**  
  6.1 Utility is ordinal and defined only up to a positive monotonic transformation. It represents choice ranking, not cardinal well-being.  
  6.2 **Assessment Protocol:**  
      *   Any change leading a claimant to choose a different option from a new menu is recorded as a "revealed improvement" for that claimant (they chose it over alternatives).  
      *   **However:** The *magnitude* of improvement cannot be measured or compared across claimants. Claimant A switching from beans to steak is recorded identically to Claimant B switching from stale bread to fresh bread: "Revealed Improvement Logged (Code RIL)".  
      *   No aggregate welfare statements (e.g., "Claimant A improved more than B") are permissible or recordable.  

  **7. Appeals Process & Form ORW/APL-9 "Notice of Perceived Welfare Diminution"**  
  7.1 A claimant may submit Form ORW/APL-9 seeking reassessment, citing a welfare loss due to a prior decision (e.g., menu reduction).  
  7.2 **Assessment Protocol:**  
      *   The act of submitting the appeal form constitutes a **new choice** by the claimant.  
      *   This new choice (submitting the appeal) is made from a feasible set *that includes the appeal option*, which was *not* part of the original menu.  
  7.3 **Consequence:** The claimant’s choice to appeal **cannot** provide information about their preferences within the *original* menu. It only reveals a preference for appealing *now*, given the *current* menu (which includes the appeal process). Therefore, **Form ORW/APL-9 provides no evidential basis for reassessing the original decision.**  
  7.4 **Procedure:** Acknowledge receipt. Log as "Appeal Choice Manifest (Code ACM)". Initiate standard appeal processing, but note: the *content* of the appeal pertains to an obsolete menu and is operationally inadmissible for overturning the original RPF-based assessment.  

  **8. Summary & Compliance**  
  Welfare is revealed, not felt. Choices define welfare; constraints and beliefs shape the menu but are not welfare components. Incoherence negates assessability. Improvements are non-negative but non-comparable. Appeals alter the menu. Adhere strictly to RPF protocols. Deviation introduces subjectivity and is procedurally unsound.  

  **H. Blandsworth**  
  Harriet Blandsworth  
  Director of Preference Realisation  
  Office of Revealed Welfare  

  ---  
  **ORW: Observing Choices, Defining Welfare, Objectively.**
