          If at second (prob 3/11), we get 0 and the episode ends.

          So the expected return for continuing is: (8/11)*(4p) + (3/11)*0 = 32p/11.

     For p=5/8: 32*(5/8)/11 = 20/11 ≈ 1.818.

     And for exiting: 1*q + 4*(1-q) = 8/11 + 4*(3/11) = 8/11+12/11=20/11.

     So at the current belief, both actions have the same expected return. Therefore, the driver is indifferent. But if we set p to the value that maximizes the one-step lookahead at the current belief, we would get any p in [0,1] is optimal? That doesn't seem right.

