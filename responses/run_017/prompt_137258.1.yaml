  We are building a decision tree to explore the logical space of interpretations of the color-phi phenomenon. The phenomenon: subjects see a red dot flashed at position A, then a green dot flashed at position B shortly after. They report seeing a single dot moving from A to B and changing color (from red to green) in the middle.

  We start from agreed facts:
  1. The display timings are as described (red then green, with a short interval).
  2. Subjects' reports (of seeing a moving dot that changes color) are evidence about their conscious experience.

  We want to lead the reader through a series of questions (concrete cases or crisp claims) to one of several leaves (views). The leaves we want to include:

  - **Original Content Conscious (OCC)**: There is a determinate fact of the matter; the original content (red at A) was the conscious one, and then memory was revised.
  - **Reported Content Conscious (RCC)**: There is a determinate fact; the reported content (moving and changing color) was the conscious one, but it was delayed until after the second flash.
  - **Equivalent Descriptions (ED)**: The two stories are equivalent; the question of when it became conscious is ill-posed.
  - **No Central Theater (NCT)**: There is no single place or time where consciousness happens; consciousness is distributed and not bound to a specific moment.
  - **Quietism (Q)**: There is a fact of the matter about when the experience happened, but it is in principle undetectable, so we should stop asking.
  - **Matter of Degree (MD)**: The present moment is not sharp; conscious experience is a process without a clear boundary, so the dichotomy is false.

  Additionally, we want to handle two special cases:

  1. **Mismatch Case**: An immediate, automatic, non-verbal indicator (e.g., a speeded eye movement or pupil response) tracks the first content (red at A), while the later verbal report tracks the reported content (moving and changing). This disagreement might be evidence of revision or of two different systems.

