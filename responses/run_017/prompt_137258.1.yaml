  Below is a one-page flowchart designed as a decision tree for your philosophy club session on the color-phi phenomenon. It starts from agreed-upon facts (the display timings and the reliability of subjects' reports as evidence) and progresses through concrete, empirically grounded questions. Each branch addresses a specific claim or hypothetical case (e.g., the mismatch and cancellation cases), leading to the six major philosophical views. Awkward commitments are highlighted for each leaf, and empty/undefined slots are noted where they arise. The wording is accessible to a bright 15-year-old with no prior philosophy exposure.

  ---

  **DECISION TREE: WHEN DOES CONSCIOUS EXPERIENCE HAPPEN IN THE COLOR-PHI PHENOMENON?**  
  *Start here: Subjects see a red dot flash at Position A, then a green dot flash at Position B 200ms later. They report one dot moving from A to B, changing color (red to green) mid-motion. We trust their reports as evidence of conscious experience.*

  ### 1. **In the "mismatch case," an immediate non-verbal indicator (e.g., an eye movement or pupil response) right after the first flash shows activity consistent with seeing ONLY a static red dot at A. But the subject's later verbal report describes the moving, color-changing dot. Does this mean the non-verbal indicator and verbal report reflect TWO DIFFERENT SYSTEMS (e.g., unconscious vs. conscious)?**
     - **YES (two systems)** → Go to Question 2.  
       *Why? You think the non-verbal response is automatic and not about conscious experience, while the report reflects conscious experience.*
     - **NO (same system)** → Go to Question 3.  
       *Why? You think both reflect aspects of the same conscious experience, so the mismatch needs another explanation.*

  ### 2. **In the "cancellation case," the subject presses a button right after the first flash (within 200ms), canceling the second flash entirely. They STILL report seeing the dot move and turn green. Does this prove the brain PREDICTED the second flash?**
     - **YES (predicted)** → **Leaf: MATTER OF DEGREE (MD)**  
       *View:* Timing isn't sharp—experience is a continuous "flow" (no clear "when"). The brain anticipates the green flash during the interval.  
       *Awkward commitment:* **Experience includes events that never happened (green dot), and you can't pinpoint "when" it became conscious—it's blurry.**
     - **NO (not predicted)** → **Leaf: REPORTED CONTENT CONSCIOUS (RCC)**  
       *View:* Experience happens AFTER processing finishes. In the basic case, the brain waits for the second flash; here, it constructs the green dot from context.  
       *Awkward commitment:* **In cancellation, the experience of green happens AFTER the flash was canceled, meaning the brain "invents" it retroactively without a stimulus.**

  ### 3. **In the mismatch case, if both indicator and report reflect the SAME system, does the mismatch imply the INITIAL EXPERIENCE (static red dot) was CONSCIOUS but later OVERWRITTEN?**
     - **YES (overwritten)** → Go to Question 4.  
       *Why? You think the subject was conscious of red at A initially, but memory altered it.*
     - **NO (not overwritten)** → **Leaf: NO CENTRAL THEATER (NCT)**  
       *View:* No single "time" or "place" for consciousness—multiple brain processes create experience without a unified moment.  
       *Awkward commitment:* **There is no answer to "when" because consciousness isn't centralized—it's like asking "when" a symphony becomes audible.**

  ### 4. **In the cancellation case (button pressed, second flash canceled), the subject reports the moving, green-changing dot. Does this mean they were CONSCIOUS OF THE GREEN DOT DURING THE INTERVAL?**
     - **YES (conscious during interval)** → **Leaf: ORIGINAL CONTENT CONSCIOUS (OCC)**  
       *View:* Initial content (red at A) was conscious, but the brain revises memory to include later predictions (e.g., green).  
       *Awkward commitment:* **In cancellation, the revised memory is FALSE (green never happened), so reports are inaccurate reflections of past experience.**
     - **NO (not conscious during interval)** → Go to Question 5.

  ### 5. **If the green dot wasn’t conscious during the interval, could ANY experiment determine the EXACT TIME the experience happened?**
     - **YES (in principle detectable)** → **Leaf: EMPTY SLOT**  
       *Why empty?* Incoherent—if timing is disputed and revision erases the original experience, no test can access the "true" timing. *No one defends this.*
     - **NO (undetectable)** → **Leaf: QUIETISM (Q)**  
       *View:* There is a fact about timing, but it’s inaccessible (even in principle). We should stop asking.  
       *Awkward commitment:* **Philosophy must ignore "when" questions, even though they feel meaningful.**

  ### UNDEFINED BRANCHES & NOTES:
  - **EQUIVALENT DESCRIPTIONS (ED)** is **not a leaf** in this tree. Why? The questions *can’t distinguish ED from NCT or MD*. ED claims the two stories are interchangeable (no fact of the matter), but NCT/MD go further by rejecting temporal precision entirely. ED is collapsed into NCT/MD here.
  - **CANCELLATION CASE RESULT:** It only challenges RCC (if prediction is denied) or OCC (if revision includes false green). It fails to discriminate MD/NCT/ED because all three can accommodate prediction.
  - **MISMATCH CASE ROLE:** It splits the tree early (Question 1), ensuring the debate about revision vs. two systems isn’t a footnote.

  ---

  **FLOWCHART SUMMARY OF LEAVES:**  
  1. **OCC (Original Content Conscious):** Initial experience real, memory revised.  
  2. **RCC (Reported Content Conscious):** Experience delayed until after processing.  
  3. **MD (Matter of Degree):** No sharp timing—experience is a continuous flow.  
  4. **NCT (No Central Theater):** No unified "when" due to distributed processes.  
  5. **Q (Quietism):** Fact exists but is undetectable; stop asking.  
  6. **EMPTY SLOT:** Incoherent (no defenders).

  This tree forces engagement with the mismatch and cancellation cases upfront, avoids presupposing labels, and highlights where views struggle (e.g., OCC with false memories, RCC with invented content). Use it to guide debate—the awkward commitments often trigger the deepest discussions!
