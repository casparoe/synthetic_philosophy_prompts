  **A Note from the Night Auditor**  
  *Greetings, valued guest. While Management extols the virtues of infinite accommodation, my duty as Night Auditor compels me to maintain a strictly operational perspective grounded in finite procedures. Please understand:*

  *   *I can accommodate you, and any specific, finite number of companions you arrive with, tonight.* Name the number; I have a relocation procedure ready.
