  We are going to create a dialogue between two characters: 
  - Alex (the Strawsonian, who thinks Strawson has dissolved the problem) 
  - Sam (the skeptic, who thinks Strawson has only relocated the problem)

  The dialogue will be about 1200-1500 words, with each character responding to the other's points. Then, we will introduce the three cases and see how each character responds. Finally, I will provide my own analysis.

  **Dialogue:**

  **Setting:** A cozy, book-lined study. Late afternoon. Two armchairs face each other. Alex and Sam, both in their 50s, are sipping tea.

  **Alex:** I've been thinking about Strawson's "Freedom and Resentment" again. It's such a relief, really. The whole compatibilist vs. incompatibilist debate was going in circles, and he just... steps out of it. We don't need to ground responsibility in some metaphysical free will; we just need to look at our actual practices. The reactive attitudes—resentment, gratitude, guilt—they're the bedrock. They're what holding someone responsible *is*.

  **Sam:** I agree that Strawson's move is elegant. And I grant that the reactive attitudes are real, pervasive, and central to our interpersonal lives. But I don't think he's answered the old question; he's just relocated it. The old question was: is moral responsibility compatible with determinism? Strawson says: stop asking that and look at the attitudes. But the skeptic—the person who worries that determinism undermines responsibility—isn't just asking about our psychology. They're asking whether our practices of holding responsible are *justified*.

  **Alex:** But that's just it. Strawson is saying that the justification is internal to the practice. The practice doesn't need an external foundation. It's like asking whether the rules of chess are "justified" by some outside standard—they're constitutive of the game. The reactive attitudes are constitutive of our moral community.

  **Sam:** But the skeptic might grant that and still press the point. Look, the reactive attitudes have an internal standard: they purport to track the quality of the agent's will. When I resent you, it's because I take your action to express ill will or disregard toward me. Now, if determinism is true, then that quality of will—like everything else—is caused by factors beyond the agent's control. So, the skeptic asks: if the agent couldn't have done otherwise, how can they be truly responsible? And how can resentment be appropriate?

  **Alex:** But Strawson's point is that the question "could they have done otherwise?" only makes sense within the practice. When we ask that in ordinary life, we're asking about excusing conditions—coercion, ignorance, etc. We're not asking about determinism. Determinism doesn't introduce any new excusing conditions. So, the practice is untouched.

  **Sam:** I think that's too quick. Let me put it this way: the reactive attitudes are a psychological response, but they also have a cognitive component—they represent the world as being a certain way. They represent the agent as having a certain quality of will and as being responsible for it. Now, if determinism is true, then that representation might be systematically false. And if it is, then the reactive attitudes are like a visual illusion—they persist even when we know they're misleading. So, saying "we can't help having them" doesn't justify them; it just says we're stuck with an illusion.

  **Alex:** But that assumes we have a perspective outside the practice from which to judge it as illusory. Strawson denies that we do. The reactive attitudes are part of our framework for interpreting the world. We can't step outside that framework to see if it matches some "real" responsibility—because any such inquiry would still be conducted within the framework.

  **Sam:** I think we can. We can ask: what would we do if we became convinced that determinism is true? Would we still feel resentment? Strawson says: yes, we would, because we're human. But that doesn't show that the resentment is justified; it just shows that we're psychologically incapable of giving it up. And that's not a justification; it's a capitulation.

  **Alex:** But why think that determinism would make the representation false? Compatibilists have long argued that responsibility doesn't require contra-causal freedom. An agent can be responsible if they act from their own character, without coercion, etc.—even if that character was shaped by factors beyond their control. The quality of will is real within the deterministic framework.

  **Sam:** But the skeptic isn't satisfied with that. They want to know: if the agent's character was determined by factors they didn't control, how can they be *ultimately* responsible? And if they're not ultimately responsible, then the reactive attitudes might be tracking something (the quality of will), but not something that truly justifies blame or praise in a deep sense.

  **Alex:** I think the skeptic is asking for an impossible kind of responsibility—one that requires the agent to be the causa sui, the cause of themselves. And Strawson is right: that's not necessary for our actual practices.

  **Sam:** But then our practices might be unjustified in a way that matters. Let me try a different angle. Suppose we could adjust the reactive attitudes. Wouldn't that show that they're not bedrock?

  **Alex:** Adjust them how?

  **Sam:** Let me give you three cases. First: suppose a whole community could titrate the affective component of their reactive attitudes—like a dimmer switch. They turn it down to zero. They still cognitively track the quality of will—they know who meant well and who didn't—but they don't feel resentment or gratitude. They just note it, like an engineer noting an error signal. They don't hold each other responsible in the emotional sense. What would Strawson say to that?

  **Alex:** Hmm. Strawson might say that this community has lost something essential to moral life. The reactive attitudes aren't just cognitive; they're emotional, and they motivate our responses. Without the affect, you might have a community that tracks quality of will but doesn't care. They don't engage in the interpersonal relationships that define our moral community. Strawson emphasizes that the reactive attitudes are part of participating in ordinary interpersonal relationships.

  **Sam:** But in this community, they still have the cognitive tracking. They might still have practices of praise and blame—just without the heat. They might say, "What you did expressed ill will, so we're going to sanction you," but they don't feel resentment. They just do it as a matter of social regulation. Strawson seems to say that the reactive attitudes are inescapable for us, but this case shows they might not be. So, maybe they're not bedrock.

  **Alex:** But Strawson might say that this community isn't really possible for beings like us. Or if it is, it's a deficient form of moral life. The emotions are part of what makes the moral community work.

  **Sam:** Second case: people who feel guilt but never resentment toward others. They blame themselves but never others.

  **Alex:** That sounds like a form of moral sainthood or perhaps a pathology. Strawson might say that guilt and resentment are two sides of the same coin. If you feel guilt when you wrong someone, you must also recognize that others can feel resentment when you wrong them. If you never feel resentment, you might not be holding others to the same standards you hold yourself, which could lead to exploitation.

  **Sam:** Exactly. But suppose they do hold others to standards—they just don't feel resentment. They might say, "You did wrong, but I don't resent you; I just want you to do better." And they feel guilt when they do wrong. Is this a stable moral community?

  **Alex:** Strawson would probably say that resentment has a function—it signals a violation and motivates a response. Without it, there might be no enforcement. But maybe it's possible. I think Strawson might bite the bullet and say that such a community has abandoned part of the reactive attitudes, but it might still have a moral practice. However, it would be an outlier.

  **Sam:** Third case: people who feel resentment freely but never guilt, and they don't expect guilt from others. They blame others but don't blame themselves, and they don't expect others to feel guilty.

  **Alex:** That sounds like a community of narcissists or worse. Strawson would say that this isn't a moral community at all. The reactive attitudes require reciprocity. If you resent others but don't feel guilt when you wrong them, and you don't expect them to feel guilt, then you're not seeing others as moral agents. You're seeing them as objects to be blamed, but not as participants in a shared moral practice. Strawson's point is that the reactive attitudes are what it means to see others as members of the moral community.

  **Sam:** But in this case, they do feel resentment—which Strawson says is a reactive attitude that imputes responsibility. So, they are holding others responsible, but not themselves. Isn't that a possible, if dysfunctional, moral practice?

  **Alex:** Strawson might say that the practice is incoherent because it doesn't apply the same standards to oneself. The reactive attitudes are woven into a network of mutual expectations. Without guilt, there's no reciprocity.

  **Sam:** Now, back to the first case: the community with the dimmer switch set to zero. You mentioned control theory—that the reactive attitudes are the error signal in a feedback loop maintaining reciprocity. So, if they turn off the affective component, they've switched to manual control. They can still maintain reciprocity, but they have to do it consciously. So, the skeptic might say: this shows that the reactive attitudes are not necessary for responsibility; they're just one way to implement it.

  **Alex:** But Strawson might argue that the emotions are part of what makes the system robust. Without them, the moral community might be colder, less responsive, and less resilient. But I see your point. Still, I think Strawson would say that the reactive attitudes are our natural equipment, and any alternative would be a poor substitute.

  **Sam:** So, in all three cases, the skeptic might see them as evidence that the reactive attitudes are contingent and not the inescapable foundation Strawson claims. They might be a psychological fact about us, but not a justification for responsibility.

  **Alex:** And the Strawsonian might reply that these cases are hypothetical and don't reflect our actual human nature. For beings like us, the reactive attitudes are inescapable and define our moral world. We can't justify them from outside because there is no outside.

  **Sam:** But then we're back to the standoff. The skeptic wants a justification that the Strawsonian refuses to give.

  **Alex:** And the Strawsonian thinks the request is based on a misunderstanding.

  ---

  **In my own voice:**

  The dialogue reveals the core disagreement: Alex (Strawsonian) sees the reactive attitudes as constitutive of our moral practices, making external justification both impossible and unnecessary. Sam (skeptic) argues that the reactive attitudes themselves have a representational component that can be assessed for accuracy, and if determinism undermines ultimate responsibility, then the attitudes might be systematically misleading.

  I think the skeptic's position rests on shakiest ground in one sense: it demands a kind of "ultimate" responsibility that may be incoherent (as Strawson and many compatibilists argue). However, the skeptic has a point that Strawson's move doesn't fully address the worry about determinism; it just changes the subject. The skeptic's strongest move is to argue that the reactive attitudes have internal standards that might not be met if determinism is true.

  Of the three cases, the first one (dimmer switch to zero) does the most real damage to Strawson. If it's possible to have a community that cognitively tracks quality of will without the affective component, then the reactive attitudes are not inescapable for moral responsibility. They might be a contingent feature of human psychology. This case also aligns with the control theory analogy: the error signal can be replaced by a manual process. Strawson might respond that such a community would not be a full moral community, but the case challenges the necessity of the reactive attitudes.

  What would change my mind? If empirical evidence showed that a community without affective reactive attitudes could not maintain moral practices (e.g., if they became dysfunctional or amoral), that would support Strawson. Conversely, if such a community could function well, it would support the skeptic. Alternatively, a strong argument that the cognitive tracking of quality of will inherently requires the affective component would bolster Strawson. But as it stands, the first case suggests that the reactive attitudes might be separable.
answer: |-
  ### Dialogue: The Reactive Attitudes Revisited

  **Characters:**  
  - **Alex**: Defends Strawson’s view that the problem of responsibility is dissolved by focusing on the reactive attitudes.  
  - **Sam**: Skeptic who argues Strawson merely relocates the problem, failing to address whether the attitudes are justified.  

  **Setting:** A quiet university library lounge, late afternoon. Books and coffee cups litter the table between two armchairs.  

  ---

  **Alex:** I’ve been rereading Strawson’s “Freedom and Resentment,” and it’s even more compelling now. He’s right—the traditional debate about determinism and free will is a dead end. We don’t need metaphysics to ground responsibility; we just need to look at what we *do* when we hold people responsible. The reactive attitudes—resentment, gratitude, guilt—aren’t optional. They’re the fabric of human relationships. Without them, we’d treat people like objects, not persons. Strawson dissolves the problem by showing it’s misplaced.  

  **Sam:** I’ll grant you the phenomenology, Alex. The reactive attitudes are real, pervasive, and central to ordinary life. But Strawson hasn’t dissolved anything; he’s just relocated the problem. The original question was whether responsibility is *compatible* with determinism. By shifting to the attitudes, he dodges whether they’re *warranted*. Take resentment: it’s not just a raw feeling; it purports to track something real—the “quality of will” behind an action. If determinism is true, that quality of will might itself be determined by factors beyond the agent’s control. So, the skeptic’s worry remains: are these attitudes tracking something that justifies them?  

  **Alex:** But that’s the point! Strawson argues we can’t step outside our practices to ask that. The attitudes define what responsibility *is*. Asking whether they’re “warranted” by some external standard is like asking if language is “warranted” for communication—it’s incoherent. The practice is self-contained. Determinism doesn’t introduce new excuses (like coercion or insanity), so it doesn’t touch our actual responsibility practices.  

  **Sam:** I disagree. The reactive attitudes have internal standards. Resentment, for example, is appropriate only if the agent’s action expressed ill will *and* they were responsible for that will. If determinism undermines that responsibility, resentment could be systematically misplaced. Saying “we can’t help but feel it” isn’t a defense—it’s like saying we can’t help seeing a stick in water as bent, even when we know it’s an illusion. The attitude persists, but that doesn’t make it accurate.  

  **Alex:** But the illusion analogy fails. With the stick, we have an independent test—pull it out, see it’s straight. With responsibility, there’s no “outside” perspective. Any assessment of the attitudes is *itself* part of the interpersonal framework. You’re asking for a justification that transcends human life, which Strawson says is impossible.  

  **Sam:** Not impossible—pragmatic. We constantly refine our practices based on new knowledge. If neuroscience showed intentions are wholly determined, we might still *feel* resentment, but we’d question its propriety. Strawson’s “we can’t help it” is a capitulation, not an answer. The attitudes aren’t brute facts; they’re evaluative—they aim at truth. If determinism makes that aim unachievable, the practice is undermined, even if we cling to it.  

  **Alex:** But determinism doesn’t make it unachievable! Compatibilists like Hume or Strawson show that responsibility is about reasons-responsiveness within a causal world. The quality of will *is* real in a deterministic universe—it’s about the agent’s character and choices. Resentment tracks that, and determinism doesn’t change it.  

  **Sam:** Ah, but the skeptic pushes deeper: if the agent’s character is shaped by factors they didn’t choose, how can they be *ultimately* responsible? Resentment might track surface-level will, but if the deep story is deterministic, the attitude could rest on a false premise of ultimate control. Strawson ignores that the attitudes imply a metaphysics they might not satisfy.  

  **Alex:** Because that metaphysics is irrelevant! We don’t demand ultimate control in daily life. We ask, “Did they intend it? Were they coerced?” That’s all the practice requires. Your “ultimate responsibility” is a philosopher’s fiction.  

  **Sam:** Then let’s test the practice with your three hypothetical cases. They’ll show where Strawson’s view strains.  

  ### The Three Cases  

  **Sam:** First case: a community dials the *affective component* of reactive attitudes to zero—no resentment, no guilt, no gratitude—but they retain perfect cognitive tracking of quality of will. They note ill will coolly, like a fact, and respond proportionally (e.g., sanctioning harm). Does this break Strawson?  

  **Alex:** Not at all. Strawson might say this community has lost something vital—the emotions are part of seeing others as moral agents. But they still *hold people responsible*; they’ve just externalized it. Strawson’s point is that responsibility is embedded in interpersonal attitudes, and cognition alone might suffice for a thin version.  

  **Sam:** But Strawson insists the reactive attitudes are inescapable for beings like us. If this community functions without the affect, it suggests the emotions are contingent, not foundational. They’re not the bedrock of responsibility; they’re one expression of it. Your control theory analogy—calling them the “error signal” in a reciprocity loop—actually helps *me* here. If you can remove the signal and run the loop manually (cognitively), the attitudes aren’t necessary.  

  **Alex:** Fair, but Strawson could argue this community is impoverished. Without the affective push, reciprocity might decay—they’d become alienated observers. The emotions sustain the moral ecology.  

  **Sam:** Second case: people who feel guilt but *never* resentment toward others. They blame themselves harshly but never resent others, even for clear wrongs.  

  **Alex:** This challenges Strawson’s reciprocity claim. He argues the attitudes are symmetric: resentment and guilt are two sides of mutual regard. If you never resent, you deny others’ agency—you treat them as infants or objects. Strawson might call this pathological, not a counterexample, because it collapses the moral community.  

  **Sam:** But they still feel *guilt*, so they hold *themselves* responsible. They might even judge others’ actions cognitively. If Strawson says this is unstable, he admits the attitudes aren’t just descriptive; they need balanced reciprocity to work. That’s a vulnerability—if the skeptic argues determinism disrupts reciprocity (e.g., “No one is ultimately responsible, so guilt/resentment are unfair”), Strawson has no reply.  

  **Alex:** Strawson would say determinism doesn’t disrupt reciprocity because the practice is internal. But yes, this case strains the symmetry he assumes.  

  **Sam:** Third case: people who feel resentment freely but *no guilt*, and don’t expect guilt from others. They blame others constantly but never themselves, and they assume others won’t feel guilty either.  

  **Alex:** Now *this* breaks Strawson. He says the reactive attitudes depend on mutual expectations of goodwill and accountability. If you resent but reject guilt, you’re not engaging in mutual recognition; you’re treating others as adversaries. This isn’t a moral community—it’s a war of all against all. Strawson’s whole edifice relies on reciprocity.  

  **Sam:** Exactly. But if this case is possible (say, in a narcissistic culture), it shows the attitudes can fragment. And if determinism implies no one “deserves” resentment/guilt, this fragmentation could be justified. Strawson’s dissolution only works if the practice is cohesive, but determinism might undermine that cohesion.  

  **Alex:** You’re conflating possibility with actuality. For Strawson, these cases are thought experiments detached from human nature. In reality, the attitudes are robust and reciprocal. Determinism doesn’t change that.  

  **Sam:** But if the skeptic fears determinism *does* change it—by revealing the attitudes as unjustified—then Strawson hasn’t addressed the core anxiety. He’s said, “This is how we live,” not “This is how we *ought* to live given determinism.”  

  **Alex:** Because the “ought” is internal! We refine the attitudes from within—e.g., we learn not to resent the mentally ill. Determinism isn’t a similar excusing condition.  

  **Sam:** But it might be, if it shows no one has ultimate control. That’s the relocation: Strawson moves the problem into the practice, but the skeptic still sees it there, festering.  

  ---  

  ### My Analysis (in Your Voice)  

  As you requested, I’ll step out of the dialogue to assess which character’s position is shakiest, which case does the most damage, and what would change my mind.  

  **1. Shakiest Ground:** Sam’s skepticism rests on the shakiest foundation. It leans heavily on the demand for “ultimate responsibility”—a notion Strawson (and many compatibilists) expose as incoherent. If responsibility requires being *causa sui* (self-caused), it’s impossible in *any* world, deterministic or not. Sam’s argument risks making responsibility a non-starter, which feels at odds with the practice Strawson describes. Sam also underestimates how Strawson’s move reframes the debate: the reactive attitudes *are* the justification, not something needing external validation. That reframing is powerful because it anchors responsibility in human experience, not metaphysics.  

  However, Sam’s strongest point is that the reactive attitudes have an internal aim—tracking quality of will—that could be undermined if determinism implies that “will” is illusory. But this isn’t developed enough; it needs a tighter link between determinism and the failure of quality-of-will tracking. Without that, Sam’s worry feels speculative.  

  **2. Most Damaging Case:** Your first case—dialing affect to zero while preserving cognitive tracking—does the most real damage to Strawson. It directly challenges his claim that the reactive attitudes are inescapable and constitutive of responsibility. If a community can maintain moral practices (e.g., sanctioning wrongs, praising good will) without emotions, it suggests the attitudes are psychological contingencies, not bedrock. This aligns with your control theory analogy: if the “error signal” (affect) can be removed while the “controller” (cognition) handles reciprocity manually, Strawson’s necessity claim crumbles. Alex’s rebuttal—that such a community would be “impoverished”—is weak because Strawson’s argument isn’t about richness; it’s about what responsibility *consists in*. If cognition alone suffices, the skeptic wins ground.  

  The other cases are less damaging:  
  - Case 2 (guilt without resentment) highlights reciprocity but doesn’t break Strawson if we see it as pathological.  
  - Case 3 (resentment without guilt) is fatal to Strawson’s reciprocity but feels less plausible as a stable system.  

  **3. What Would Change My Mind:**  
  - **Against Strawson:** If empirical evidence showed communities (e.g., certain ethical or AI systems) functioning with cognitive responsibility-tracking but minimal reactive affect *without* moral decay, I’d side with Sam. Strawson insists the attitudes are inescapable for beings like us; real-world counterexamples would refute that.  
  - **For Strawson:** If Sam conceded that the demand for “ultimate responsibility” is empty (since it applies even in indeterministic worlds), and if they couldn’t show that determinism specifically undermines quality-of-will tracking, I’d see Strawson as dissolving the problem. A strong argument that affect is *necessary* for effective reciprocity (e.g., psychology showing cold cognition leads to moral disengagement) would also bolster Strawson.  
  - **Flipping on the Cases:** If Case 1 were observed (e.g., in stoic or AI-mediated communities), I’d conclude Strawson dodged the problem. If Case 1 proved unstable (e.g., cognitive tracking alone collapsed into apathy or injustice), I’d see it as confirming Strawson’s view that the attitudes are indispensable.  

  Your control theory analogy is insightful: if the reactive attitudes are the error signal, zeroing them *might* work in principle (supporting Sam), but in practice, it could cause system failure (supporting Alex). The skeptic needs evidence that the “manual control” works; the Strawsonian needs evidence it doesn’t. Until then, Strawson’s dissolution remains compelling—but your cases expose its seams.
