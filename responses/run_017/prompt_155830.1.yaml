prompt: |-
  I am writing a paper on collective responsibility for harms produced by loosely structured and partly automated groups, and before I commit myself to a framework I want the standard of adequacy stated explicitly. What I need from you is that specification, not a survey of the literature: the list of things a theory of collective intentionality and joint action has to deliver in order to be usable for my purpose, each with the case or consideration that makes it a requirement, and a verdict on which requirements are non-negotiable and which are only preferences of one camp.

  My purpose fixes what counts as adequate. The theory has to be able to tell me, and to show me how it tells me, whether a group some of whose members are not human (a clinical team together with a diagnostic model, an editorial collective together with a ranking algorithm) can be said to act together at all; whether attributing a shared intention to such a group is ever anything more than shorthand for the attitudes of its human members; and whether a group of that kind can owe something to someone, such that there is a point in holding it to account.

  Here are my candidate cases, which you should use or replace with better ones: two co-authors who work together smoothly but take themselves to be producing different things, one a manifesto and one a parody of a manifesto; contributors to a shared artifact who never exchange a signal and cannot track one another's intentions; a group that persists through complete turnover of its members and is nonetheless asked to answer for what it did; the participant who goes along only because exiting is costly, and who would prefer the activity not to happen; and the case in which one member has the standing to settle what the group is doing without the concurrence of the others. I also have candidate requirements whose status I do not trust: that a shared intention be analysable without residue into individual attitudes and the relations among them; that an account explain the normativity of joint action, the standing to rebuke and the obligation one owes one's co-participant, and not merely the coordination; that the theory not entail that prelinguistic children and other animals cannot act jointly; that it keep joint action, shared belief, and group agency apart; that it distinguish intending that we do something from intending to do one's part of what we do; and that it capture what joint action is like from the inside. Tell me which of these are genuine desiderata and which are the scruples of a single school.

  I also suspect that some subset of whatever list you produce is jointly unsatisfiable. My guess is that persistence of the same we across total turnover of members, obligations owed between participants, and refusal to posit anything irreducibly group-level cannot all be had together; confirm that or relocate the conflict.

  Respond as exactly five numbered items, one or two sentences each, and give me nothing before the first item and nothing after the last: the desiderata in the order in which I should be least willing to surrender them, each with the case behind it and whether it is negotiable, and as the fifth and final item the subset you take to be jointly unsatisfiable, which of them I would have to give up, and which single requirement does the most work in excluding otherwise attractive theories.
reasoning: |-
  Hmm, this is a dense and fascinating request about collective responsibility in hybrid human-AI groups. The user is clearly deep into philosophical territory and wants a razor-sharp specification of adequacy conditions for theories of collective intentionality. 

  First, let's unpack what they're truly after. They're not asking for literature review but for a bulletproof set of criteria that a theory must meet to handle their specific cases - especially groups with non-human members like AI systems. The core puzzles seem to be: (1) can such groups genuinely act together, (2) is "shared intention" more than metaphorical shorthand, and (3) can they bear obligations. 

  The user's candidate cases are brilliantly chosen to stress-test theories. The two co-authors with radically different interpretations of their joint work? That's a direct challenge to standard "shared intention" accounts. Contributors who never communicate but create a shared artifact? That threatens to collapse collective action into mere aggregation. And the persistence-through-turnover case? That's where corporate responsibility theories usually live or die.

  I notice they're suspicious about certain requirements being partisan rather than essential. They're right to flag that - the "no irreducible group-level" stance is indeed a signature of methodological individualism. But their instinct about incompatibilities is spot-on: you can't have full member turnover persistence AND no group-level entities AND robust inter-participant obligations. Something has to give.

  For the response structure, I'll strictly follow their five-item format. Top priority must be the non-negotiable: the hybrid group question (since it's their research focus) and obligation-ascription (without which responsibility talk is empty). The persistence case comes next - crucial but negotiable if necessary. Then I'll position the internal-perspective and intention-distinction requirements as important but debatable. 

  The incompatibility cluster goes last as item five. I'll pinpoint the member-turnover/obligations/no-group-entities triad as the tension point, with the "no irreducible group-level" requirement being the main culprit that blocks otherwise promising corporate responsibility approaches. That requirement does the heavy lifting in excluding theories that could handle persistence and obligations.

  This user is sophisticated enough to handle blunt truths: some desiderata are genuinely incompatible, and their choice depends on whether they prioritize explanatory parsimony or robust responsibility ascription. I won't soften that.
answer: |-
  Here are the five numbered items specifying the standard of adequacy for your framework:

  1.  **Must account for groups with non-human members as potential collective agents.** *Case:* Clinical team + diagnostic model. *Negotiable:* No. Without this, your core inquiry into hybrid groups collapses. A theory must show how non-human elements (like algorithms) integrate into collective action structures without reducing them to mere tools of human members.

  2.  **Must ground genuine obligations attributable to the collective itself, not just its human members.** *Case:* Editorial collective + ranking algorithm harming an author. *Negotiable:* No. Attributing responsibility requires showing *the group* (potentially including non-human processes) can owe something (e.g., redress, justification), making accountability meaningful beyond individual blame.

  3.  **Must accommodate groups persisting through complete member turnover.** *Case:* A group (e.g., institution, online platform) held accountable for past actions despite all original members being gone. *Negotiable:* Yes, but highly desirable. Essential for persistent structures; theories failing this limit responsibility to specific, fleeting human assemblies.

  4.  **Must distinguish between "intending that we J" and "intending to do my part of J".** *Case:* The reluctant participant (goes along due to exit costs). *Negotiable:* Yes. Capturing the distinctive normative structure of joint commitment (vs. individual conditional intentions) is crucial for explaining obligations *between* participants and the group's unity, though some theories minimize this distinction.

  5.  **The requirements of group persistence through total member turnover, genuine collective obligations, and rejecting irreducibly group-level entities are jointly unsatisfiable.** You must surrender *either* persistence + obligations (accepting reductionism) *or* rejection of irreducible group-level entities (to allow robust collective agents). The "no irreducible group-level entities" requirement does the most work in excluding theories (e.g., certain corporate agency views) that could otherwise satisfy persistence and obligations.
