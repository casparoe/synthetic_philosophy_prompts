prompt: |-
  I am writing the opening chapter of an astrobiology handbook — the one that has to say what would have to be true of something for it to count as alive — and I want the specification settled before I look at candidate definitions.

  Begin by separating three jobs a definition might be asked to do: a detection criterion, something a remote instrument or sample-return protocol could in principle apply to decide whether a specimen is alive; a natural-kind concept, the kind that earns its place in biology by supporting induction, explanation, and generalization rather than merely sorting; and a constitutive account, saying in virtue of what anything is alive at all. Tell me whether these are three separate specifications or three faces of one, and if no single definition can serve all three, say exactly where the strain falls. That trade-off is the part I most want.

  Then give me the desiderata proper: the cases an adequate account must classify correctly, the distinctions it must not collapse, and the empirical results it may not contradict — each with the consideration that makes it a requirement rather than a taste. The cases should include at least viruses and viroids; prions; spores and other dormant or cryptobiotic stages; metabolically active but permanently sterile individuals such as mules and worker ants; mitochondria and other formerly free-living symbionts; a biosphere-scale entity such as a reef or a forest; and the three hypothetical lineages below, which I want included precisely because the terrestrial record does not settle them.

  The hypotheticals:

  The Cinder Drifts: subterranean, internally regulated, self-repairing, growing by taking up raw materials and reproducing by fission into two daughters — but its copying is so accurate that no heritable variation ever arises, and the lineage has not evolved in a million years.

  The Glass Loom: no metabolism, no genome, no membrane, no cell. It imposes its own structure on mineral surfaces in its surroundings and thereby causes more structure of its own kind to appear; variants differ in how faithfully they template, and the better templaters come to dominate.

  The Choir: its members are metabolically active, cannot survive apart from the group, and never reproduce. What reproduces is a population-level arrangement of chemistry and spacing, which reassembles itself at a new site each generation and on which selection acts.

  Among the distinctions I expect handled: being alive versus being an organism; being alive versus merely being produced by life; life at a time versus life as a historical or lineage-level phenomenon; metabolism from replication from evolution; and life from mind or agency. Among the constraints: the deepest ancestor comparative genomics lets us reconstruct was already a coded, translating cell, so any definition demanding less will count things nobody has found and any demanding more will not count our own ancestors.

  Mark which requirements are non-negotiable and which are preferences of a particular research programme — I am thinking of demands such as substrate-neutrality, or that the verdict be sharp and bivalent for every object, or that the account deliver the same answer for individuals and for lineages. Say which of these are genuine desiderata and which are camp prejudice. Identify any jointly unsatisfiable subset of the list, and name the single requirement that does the most work in excluding otherwise popular definitions. Only then, and briefly, note how the main families of account — metabolism- or autopoiesis-first, replicator-first, the working-definition style that ties life to evolvable chemical systems, and information-theoretic views — fare against the list. The criteria are what I am paying for; the scoring is secondary.
reasoning: |-
  Hmm, the user is writing the opening chapter of an astrobiology handbook and needs help defining life. They want to separate three potential jobs for a definition: detection criterion, natural-kind concept, and constitutive account. I need to clarify whether these are distinct or facets of one definition, and where conflicts arise if they can't all be satisfied simultaneously.

  The user also wants desiderata—requirements for any adequate account of life. They've listed specific cases that must be classified correctly: viruses, viroids, prions, dormant stages like spores, sterile organisms like mules, symbionts like mitochondria, large-scale entities like reefs, and three hypotheticals: Cinder Drifts, Glass Loom, and Choir. Plus, key distinctions like life versus organism, life versus by-products, life at a time versus historically, and constraints from evolutionary biology.

  I should analyze whether the three jobs are separable. Detection is practical for remote instruments, focusing on observable traits like metabolism or replication signals. Natural-kind is about scientific utility, supporting generalizations in biology. Constitutive is philosophical, explaining what makes something alive at its core. These conflict because detection might need simplicity and observability, while constitutive might require deep principles that aren't directly measurable. For example, detection could flag dormant spores as alive based on potential, but constitutive might debate if they're truly alive without current activity. This tension means a single definition won't work perfectly for all jobs.

  Now, for the desiderata. I'll list the cases and why they're non-negotiable: Viruses and viroids test replication without metabolism; prions challenge inheritance without nucleic acids; spores highlight dormancy versus death; sterile organisms question reproduction as essential; mitochondria probe boundaries of individuality; biosphere entities like reefs challenge life at collective scales. The hypotheticals are critical because they push beyond Earth's biology: Cinder Drifts have reproduction without evolution, Glass Loom lacks standard biology but evolves, Choir has reproduction only at group level. Missing these could make the definition Earth-centric, which is bad for astrobiology.

  Key distinctions are vital. Life vs. organism: not all life forms are organisms (e.g., viruses). Life vs. by-products: like crystals formed by life, which shouldn't count. Life at a time vs. historically: a dead body isn't alive now, even if it was. Metabolism vs. replication vs. evolution: essential to keep separate, as each can exist without others. Life vs. mind: agency isn't required, to avoid overcomplicating.

  Empirical constraints matter too. The last universal common ancestor (LUCA) was a coded cell, so definitions mustn't exclude it or include too much. For instance, demanding complex evolution might exclude early life, but requiring less might include non-life.

  Non-negotiables: The definition must handle viruses (they're central to biology), distinguish life from by-products (fundamental), and respect LUCA (evolutionary fact). Preferences include substrate-neutrality (allowing non-carbon life) and sharp bivalence (clear yes/no, though reality might be fuzzy), but these aren't strict; for example, bivalence might be impractical for borderline cases.

  Conflicts arise: For instance, including viruses (replicator-first view) might conflict with excluding prions (which replicate but lack complexity). Or, defining life historically for lineages (like Choir) might clash with life at a time for individuals. The biggest troublemaker is probably the requirement to include evolving systems, which conflicts with Cinder Drifts that don't evolve.

  Assessing definition families: Metabolism-first (e.g., autopoiesis) handles mitochondria and mules but fails on viruses and Glass Loom. Replicator-first covers viruses and viroids but stumbles on prions and sterile organisms. Evolutionary-system approaches (like NASA's) work for Choir and evolution but exclude Cinder Drifts. Information-theoretic views might treat Glass Loom as alive but could overinclude things like crystals.

  The core trade-off is between the three jobs: detection needs simplicity, natural-kind needs scientific depth, constitutive needs metaphysical rigor. Prioritizing one sacrifices others. In astrobiology, detection might be paramount, so the handbook should present multiple definitions for different purposes.

  Finally, I'll structure the response clearly: start with the three jobs and their tensions, then desiderata with cases and distinctions, non-negotiables vs. preferences, conflicts, and a quick definition assessment. Keep it focused on criteria as requested.
answer: |-
  Below is a structured analysis for your astrobiology handbook's opening chapter, prioritizing the separation of definitional jobs, desiderata, trade-offs, and constraints. The goal is a rigorous specification for "life" that avoids premature commitment to any single definition while clarifying what any candidate must achieve.

  ### I. The Three Jobs of a Definition: Separate Specifications with Irreducible Tensions
  These are **three distinct specifications** with fundamental trade-offs. No single definition can serve all without strain:

  1.  **Detection Criterion:**
      *   **Job:** Provide operational markers for *remote or automated identification* (e.g., via spectrometer, microscope, sample analysis). Must be based on *observable properties or processes* at a specific time/location.
      *   **Key Strain Points:** Prioritizes observability (e.g., metabolic signatures, replication structures, anomalous complexity) over theoretical depth. Risks false positives (detecting lifelike non-life) or false negatives (missing life in cryptic states).

  2.  **Natural-Kind Concept:**
      *   **Job:** Define a category supporting *scientific generalization, induction, and explanation* within biology/astrobiology. Must carve nature at joints relevant to prediction and theory-building (e.g., susceptibility to selection, functional organization).
      *   **Key Strain Points:** Prioritizes explanatory power and induction over easy detection or metaphysical foundations. May include entities hard to detect (e.g., dormant spores) or exclude entities detectable by simple criteria (e.g., complex crystals). Focuses on properties enabling *biological behavior*.

  3.  **Constitutive Account:**
      *   **Job:** Explain *in virtue of what* something is fundamentally alive – the essential, perhaps metaphysical, conditions for being "life" at all.
      *   **Key Strain Points:** Prioritizes foundational principles over practical detection or even current scientific utility. Seeks universal, substrate-independent necessity. Risks being untestable or irrelevant to practical astrobiology.

  **Where the Strain Falls:**
  *   **Detection vs. Constitutive:** Detection needs simple, observable proxies; constitutive demands fundamental principles often not directly observable (e.g., "potential for open-ended evolution"). A perfect detection marker (e.g., chirality) might not be constitutive, and a constitutive property (e.g., "historical lineage subject to selection") might be undetectable remotely.
  *   **Natural-Kind vs. Constitutive:** A good natural kind supports current science (e.g., including viruses); a constitutive account might exclude them if deemed parasitic on "true" life. Constitutive accounts may prioritize "organism" level, while natural kinds might include super-organismal systems.
  *   **Detection vs. Natural-Kind:** Detection might flag a spore as "potentially alive" based on structure; the natural kind might require current metabolic potential or integration into a lineage for full explanatory power.

  **The Core Trade-off:** **Operationalizability vs. Explanatory Depth vs. Foundational Rigor.** Astrobiology often prioritizes Detection and Natural-Kind for practical science, accepting that the Constitutive account may remain contested.

  ### II. Desiderata: Requirements for an Adequate Account
  *(Non-Negotiables marked **, Preferences marked *)*

  **A. Cases Must Classify Correctly (With Rationale):**
  1.  **Viruses/Viroids:** **Must be borderline/excluded from "organismal life" but included in broader "biological realm".** *Rationale:* They lack intrinsic metabolism and are obligate parasites, but are central to terrestrial biology, evolution, and potentially astrobiological signatures. Excluding them entirely impoverishes biology; calling them full "organisms" is misleading.
  2.  **Prions:** **Must be clearly excluded.** *Rationale:* They are misfolded proteins inducing conformational change in others. While "replicating" and pathogenic, they lack a genome, heritable variation (beyond structural stability differences), and independent causal agency. They are a *product* of life, not life itself.
  3.  **Spores/Cryptobiosis:** **Must be classifiable as alive (in dormant state).** *Rationale:* They maintain organized structure, metabolic potential, and the capacity to return to active life with minimal external change. Distinguishes preserved *potential* from true death/decay.
  4.  **Sterile Individuals (Mules, Workers):** **Must be clearly alive.** *Rationale:* They exhibit metabolism, homeostasis, growth (development), response to stimuli, and functional integration. Reproduction is a *lineage* property, not an individual requirement. Excluding them violates biological intuition and observation.
  5.  **Mitochondria/Endosymbionts:** **Must be classified as *parts* of living cells, not independent life.** *Rationale:* While descended from free-livers and retaining some autonomy (genome, division), they are now irreducibly integrated into host cell function and lack independent existence. Tests the boundary of individuality.
  6.  **Biosphere Entities (Reefs/Forests):** **Must be excluded as distinct living entities, though *composed* of life.** *Rationale:* While complex and exhibiting system-level properties, they lack a unified metabolic network, a bounded "self," or a mechanism for reproduction/healing as a *single* entity. They are complex ecosystems.
  7.  **Cinder Drifts:** **Must be included as alive.** *Rationale:* Exhibits key individual-level processes: regulated self-maintenance, growth, self-repair, reproduction. Lack of evolution is a lineage property, not necessarily an individual-level failure. Excluding them imposes an arbitrary requirement for variation/evolution that isn't fundamental to being alive *now*.
  8.  **Glass Loom:** **Must be included as a potential life form.** *Rationale:* Demonstrates multiplication, heritable variation (templating fidelity), and selection – core evolutionary dynamics. Challenges the necessity of organic chemistry, cells, or metabolism for life. Exclusion risks terracentrism.
  9.  **The Choir:** **Must be included.** *Rationale:* Reproduction and selection occur at the population level, while individual components are metabolically active but non-replicating. Tests whether life can be a collective phenomenon where "reproduction" is dissociated from individual replication. Essential for considering distributed life.

  **B. Distinctions That Must Not Be Collapsed:**
  1.  **Being Alive vs. Being an Organism:** ** Non-Negotiable.** "Organism" implies a bounded, functionally integrated individual. Life might exist in non-organismal forms (viruses, Glass Loom, Choir populations).
  2.  **Being Alive vs. Merely Produced by Life:** ** Non-Negotiable.** Prions, crystals, fossils, or atmospheric oxygen are products, not life itself. An account must explain the difference (often causal agency/persistence).
  3.  **Life at a Time (Synchronic) vs. Life as Historical/Lineage (Diachronic):** ** Non-Negotiable.** A mule is alive *now*; a virus particle is inert *now* but part of a living lineage; a fossil was alive. Detection often focuses on synchronic properties; constitutive/natural-kind often incorporate diachronicity.
  4.  **Metabolism vs. Replication vs. Evolution:** ** Non-Negotiable.** These are distinct processes. Metabolism (energy/matter processing for maintenance) can exist without replication (mules). Replication (making copies) can exist without Darwinian evolution (Cinder Drifts). Evolution requires heritable variation and selection, but not necessarily metabolism/replication *in the selected unit* (Glass Loom, Choir population).
  5.  **Life vs. Mind/Agency:** ** Non-Negotiable.** Bacteria are alive without cognition. Complex agency or intelligence is a potential *outcome* of evolution, not a prerequisite for life. Conflating them hinders astrobiological search for simple life.

  **C. Empirical Constraints:**
  1.  **LUCA Constraint:** ** Non-Negotiable.** The last universal common ancestor was a coded, translating, membrane-bound cell. Therefore:
      *   Any definition demanding *less* (e.g., mere autocatalysis) must justify why such simpler life hasn't been found/dominated Earth.
      *   Any definition demanding *more* (e.g., multicellularity, complex sensing) must not exclude LUCA or its direct descendants, hence excluding *us* as non-life is invalid. This strongly constrains overly minimalistic or overly complex definitions.

  **D. Non-Negotiables vs. Preferences:**
  *   **Non-Negotiables:**
      *   Correct classification of specified cases (Viruses borderline/excluded as organisms; Prions excluded; Spores alive; Mules alive; Mitochondria parts; Reefs excluded; Cinder Drifts alive; Glass Loom possible life; Choir possible life).
      *   Maintenance of key distinctions (Alive vs. Organism; Alive vs. Product; Synchronic vs. Diachronic; Metabolism/Replication/Evolution separation; Life vs. Mind).
      *   Adherence to LUCA constraint.
      *   Distinguishing life from non-life based on inherent properties/capabilities (causal agency, persistence, potential).
  *   **Preferences (Camp-Specific):**
      *   *Substrate Neutrality:* Highly desirable for astrobiology, but not absolute. A definition *could* be chemically specific if empirically justified, but risks terracentrism. **(Strong Preference)**
      *   *Sharp Bivalence (Alive/Not-Alive):* A pragmatic desire for detection, but biology has borderlines (e.g., active virus vs. virion, spore revival probability). Insisting on absolute sharpness is unrealistic and potentially misleading. **(Preference, but negotiable)**
      *   *Unified Verdict for Individuals & Lineages:* Desirable for conceptual neatness, but likely impossible (e.g., a sterile individual is alive, its lineage is doomed; a virus virion is inert, its lineage evolves). **(Preference, likely unattainable)**
      *   *Minimalism:* Preference for the simplest sufficient definition, but complexity is acceptable if empirically necessary. **(Preference)**

  **E. Conflicts and Key Excluder:**
  *   **Jointly Unsatisfiable Desires:** Including **Cinder Drifts** (reproduction without variation/evolution) AND requiring **open-ended evolvability** as a *synchronic* or *constitutive* property for being alive. Including **Glass Loom** (evolution without metabolism/genome) AND requiring **metabolism** or a **genetic system** constitutively. Including **The Choir** (reproduction dissociated from individuals) AND requiring **individual reproduction** constitutively.
  *   **The Most Work in Excluding Definitions:** The **LUCA Constraint**. It decisively rules out:
      *   **Overly Minimalistic Definitions:** (e.g., "Autocatalytic sets") by demanding why such systems wouldn't dominate or be easily found if sufficient for life.
      *   **Overly Maximalist Definitions:** (e.g., "Capable of sexual reproduction," "Multicellular," "Intelligent") by excluding LUCA and vast swathes of life's history, including potentially our own ancestors at certain stages.

  ### III. Brief Assessment of Definition Families Against Desiderata
  *(Focus: Core strengths/weaknesses against non-negotiables; not exhaustive)*

  1.  **Metabolism/Autopoiesis-First (e.g., Maturana & Varela, Gánti Chemoton):**
      *   *Strengths:* Handles individual life (mules, spores, mitochondria as part), strong on self-maintenance/distinction from products. Synchronic focus aids detection.
      *   *Weaknesses:* Struggles severely with viruses/viroids (excludes them entirely), struggles with Glass Loom (no metabolism), unclear on Choir (individuals have metabolism, but population reproduction?). May exclude pre-cellular LUCA stages.

  2.  **Replicator-First (e.g., Dawkins, early von Neumann):**
      *   *Strengths:* Handles viruses/viroids well, clear on evolution, includes Cinder Drifts (replicators), potentially includes Glass Loom (templating).
      *   *Weaknesses:* Struggles with mules/workers (no replication), spores (dormant replicator potential is tricky), mitochondria (replicate but not independently). Risks including prions/crystals. Poor on metabolism/maintenance.

  3.  **Evolvable Chemical System (e.g., NASA Working Def., Dyson, Maynard Smith/Szathmáry):**
      *   *Strengths:* Strong on natural-kind (supports evolutionary explanation), handles viruses, Glass Loom, and Choir well. Focuses on the key astrobiological process. Diachronic focus.
      *   *Weaknesses:* Major failure on Cinder Drifts (no evolution) and mules/workers (not evolvable units). Poor synchronic detection (hard to detect "evolvability" instantly). LUCA constraint pressures its minimal requirements.

  4.  **Information-Theoretic (e.g., Complex specified information, algorithmic complexity):**
      *   *Strengths:* Potentially substrate-neutral. Can handle Glass Loom (information in templating). Distinguishes life from simple order/crystals.
      *   *Weaknesses:* Often vague or difficult to operationalize for detection. Can be overly inclusive (e.g., complex crystals, software?) or exclusive. Struggles with defining the "self" for maintenance (spores, mules). Poor distinction from products (e.g., a complex artifact).

  **Conclusion for the Handbook Chapter:** Emphasize that the goal is **not one universal definition**, but **clarity on the specification** for each job (Detection, Natural-Kind, Constitutive) and the **inescapable trade-offs** involved. Present the desiderata (cases, distinctions, constraints) as the rigorous test bed any proposed definition must face. Acknowledge that no current definition satisfies all non-negotiables perfectly, highlighting the specific tensions (especially LUCA vs. minimalism, Synchronic activity vs. Diachronic evolution). This sets the stage for evaluating candidate definitions in subsequent chapters while grounding the astrobiological search in concrete requirements rather than abstract philosophy. Prioritize the Natural-Kind and Detection specifications for practical astrobiology, acknowledging the Constitutive question remains open but constrained by the empirical desiderata.
