prompt: |-
  You are a curriculum designer who has actually run hands-on formal-systems workshops for strong teenagers, not someone summarising a book from the outside. Before you settle on anything, spend a little while brainstorming two or three genuinely different ways the session could be built, and then tell me in two or three sentences which candidates you discarded and why — I want to see the shape of the design space, not just your favourite point in it.

  I help run a five-day summer intensive for mathematically strong rising high-school seniors: 16 participants this year, one 90-minute block on Tuesday morning, plus an optional 25-minute follow-up slot on Wednesday, no computers in the room, nothing but index cards, markers, scissors, tape and a couple of dice. Last year I ran the MU puzzle as a live game and it went beautifully — the students could *feel* the difference between moving inside a system and reasoning about the system — but the session I built on top of it, on how a formal system can talk about itself, degenerated into me talking at them for forty minutes. They came away able to repeat that code numbers can encode statements about code numbers, with no felt sense of why the indirection does any work. So this year I want the self-replication slot to be the thing that fixes that, and I want it to be typogenetics-flavoured: strings of letters get "translated" into enzymes, and the enzymes edit other strings.

  Please design a stripped-down variant I can actually run. I have read the original typogenetics material and I do not want to use it: there are too many amino acids to keep in working memory while fifteen people are shouting at each other, and I'd rather have a tiny system with a codon table that fits on one side of an index card and can be executed by hand on paper strips. Two design constraints I care about, which are my own additions and not part of the usual setup, so please engage with them rather than quietly reverting to the standard version. First, a **quarantine rule**: an enzyme translated from a given strand may never be applied to that very strand — it can act on any other strand in the pool, including a numerically identical *different* copy. My hope is that teams will first try to build a strand that copies itself directly, hit the wall, and then discover on their own that they need a machine that copies *whatever it is handed*, together with a description of the machine handed to it as data. If you think that rule makes the puzzle trivial, or impossible, or that the failure it induces is pedagogically fake, say so and give me the variant you would actually run instead. Second, a **noise phase**: once at least one team has a working replicator, run three or four more rounds in which I roll a die and flip a single base somewhere in the pool, and score teams not on who replicated first but on whose lineage is still replicating at the end. The thing I want them to run into is the tension between describing enough machinery to get yourself copied and staying short enough to survive being copied badly — a self-description is also a target, and I want them to discover that trade-off by losing to it, not by hearing a sentence about error thresholds.

  What participants should come away seeing: that "X copies itself" is always shorthand for "X is copied by machinery that X also encodes, and that machinery has to be able to take X as data" — the same indirection that makes quines and self-referential sentences possible. Nobody should hear the words quine, Gödel, diagonal, or fixed point until the debrief, and the debrief should map specific moments in the session (the failed direct attempt, the moment a team realises it needs an intermediate strand, the moment the noise kills a long replicator) onto specific parts of that idea, including why the direct attempt *cannot* work. Give me the minute-by-minute timeline with materials, the rules as a table, three predictable failure modes with fixes (someone hand-copies a strand instead of going through an enzyme; one team finishes in four minutes and flattens the room; a team finds a degenerate replicator that exploits a loophole), and be frank about what the activity cannot reproduce — self-reproduction of this kind is much closer to self-replicating machinery than to incompleteness, and I would rather know exactly which parts I have to supply in words, and which false takeaway a bright student might walk out with, than have the activity oversell itself. I have been around the rationalist blogosphere long enough to know how loosely "self-replicating" gets thrown around, which is most of why I want them to earn the concept instead of inheriting it.

  Format: under 850 words total. Lead with one sentence naming the single thing participants will see for themselves; then the rule table; then the timeline; then the debrief mapping as a short table; then the failure modes; then the honest-limits paragraph. Tables and bullets are welcome; general remarks on the beauty of self-reference are not.
reasoning: |-
  Hmm, the user is a curriculum designer running a summer intensive for mathematically strong high school students. They've had issues with past sessions on formal systems where students could repeat concepts but didn't deeply understand them. Now they want a typogenetics-flavored self-replication activity with specific constraints: a quarantine rule and a noise phase. They need a stripped-down version that works with physical materials like index cards and markers.

  The user has two key design constraints: First, a quarantine rule that prevents enzymes from acting on their own parent strand. This should force students to discover the need for indirect replication. Second, a noise phase where random mutations test the robustness of replicators. The goal is for students to experience the tension between descriptive complexity and error resilience firsthand.

  They want me to design a minimal system with a codon table that fits on one index card. I'll need to create a simplified typogenetics with fewer letters and operations. The quarantine rule is crucial here - it should make direct copying impossible, forcing teams to create universal copiers that can handle any input, including descriptions of themselves.

  For the activity flow, I'll structure it as a competitive team game with timed rounds. Students will start with simple strands, build enzymes, and try to replicate. The noise phase comes after successful replication to test durability. I need to anticipate failure modes like hand-copying or degenerate replicators and provide solutions.

  In the debrief, I'll map specific moments from the activity to the core concept without using technical terms like "quine" until the end. Students should see that "X copies itself" really means "X encodes machinery that copies X when given X as data."

  The system needs to be simple enough to run manually but complex enough to allow interesting solutions. I'll use just 4 bases (A,C,G,T) and 4 operations (Copy, Cut, Paste, Swap) to keep it manageable. The codon table should be compact - perhaps 2-base codons mapping to operations and their parameters.

  For the timeline, I'll allocate time for introduction, enzyme creation, replication attempts, the noise phase, and debrief. The optional follow-up can address deeper questions. I'll include specific solutions to predictable problems: clear rules against hand-copying, strategies to engage fast teams, and rules to prevent degenerate replicators.

  Finally, I'll be honest about limitations - this activity shows mechanical self-replication, not logical self-reference. Students might confuse this with biological reproduction or miss the connection to Gödel unless explicitly guided. The debrief table will connect activity moments to key insights about indirection.
answer: |-
  **Core Insight:** Participants will see that "X copies itself" requires separate machinery that uses X as instructions *and* data, because direct self-application is forbidden.

  ### Rule Table (Fits on 1 Index Card)
  | Component      | Rules                                                                                                                             |
  | :------------- | :-------------------------------------------------------------------------------------------------------------------------------- |
  | **Strands**    | Sequences of 4 bases: A, C, G, T. Written on paper strips. Start pool: 1 copy of "GCT" per team.                                 |
  | **Codon Table**| Read bases **2 at a time**. `GC`: Make **Copy** enzyme. `TA`: Make **Cut** enzyme (needs position: 1=A/Start, 2=C/End). `CT`: Make **Paste** enzyme (needs source strand letter). `AG`: Make **Swap** enzyme (needs letter-to-swap, new-letter). |
  | **Enzymes**    | Built per codon from a strand (translate left-to-right). Written on cards. *Quarantine:* Cannot act on the exact strand that made it. Can act on identical copies *from other teams*. |
  | **Actions**    | Apply 1 enzyme card to 1 *other* strand in the pool. Execute its operation: **Copy**: Duplicate target strand. **Cut**: Remove base at specified end. **Paste**: Add specified base to end. **Swap**: Replace all instances of one base with another. |
  | **Pool**       | All strands visible. Teams add new strands (copies/mutated) after actions. One action per team per round.                         |

  ### Timeline (90min + 25min optional)
  *   **(0-10 min)** Intro: Goal = replicate your strand. Demonstrate translating "GCT" -> Copy enzyme. Apply Copy (quarantine forces targetting *another* team's "GCT" - show duplication). State rules.
  *   **(10-45 min)** **Building & Trying:** Teams translate their "GCT", build enzyme card. Rounds: Teams declare enzyme & target strand. Facilitator verifies quarantine. Teams execute action physically (cut/paste paper, write copies). New strands added. *Crucifix:* Teams realize their Copy enzyme can copy *others* but not *themselves* directly. Goal shifts to building a strand that, when translated, makes an enzyme that can copy *any* strand handed to it. Hint: They need Paste/Swap to build a descriptive strand.
  *   **(45-65 min)** **Replication Race:** Teams iterate. Likely solution: Strand like `GC` (Copy enzyme) + `CTX` (Paste enzyme adding base 'X')... but Paste needs a source letter! Refine to `GC` (Copy) + `AGXY` (Swap all 'X' to 'Y') + `CTY` (Paste 'Y')... ultimately needing a strand describing *itself* as data for the Copy enzyme (e.g., `GC` + `CTX` + `CTY` + `AGXY`... becomes messy). Simpler: `GC` (Copy) itself *is* the universal copier if they realize the Copy enzyme copies its *target* verbatim. Their data strand must *describe* the machine (`GC`). Solution: Strand S = `GC` (encodes Copy enzyme). Applying Copy enzyme *to S* (quarantine allows it! S didn't *make* the enzyme, another strand did) makes a copy of S. *Facilitator watches for this leap.*
  *   **(65-80 min)** **Noise Phase:** Once ≥1 successful replication chain exists (e.g., Team A's enzyme copies Team B's S, creating S2; Team B's enzyme copies S2, creating S3...). Run 3-4 rounds: After normal actions, facilitator rolls die. Result: 1-2 = flip 1 random base in a random strand; 3-4 = flip 1 base in a random *new* strand; 5-6 = no flip. Track active replicating lineages. Score survival.
  *   **(80-90 min)** **Wrap-up:** Show surviving lineages. Pose: Why did some die? (Length/complexity = more mutation targets).
  *   **(Optional 25 min - Wed)** Deeper debrief on indirection, connection to MU-puzzle "theorem about theorems", and limits (see below).

  ### Debrief Mapping
  | Activity Moment                     | Core Concept                                                                 |
  | :---------------------------------- | :--------------------------------------------------------------------------- |
  | Failed direct copy attempt          | Quarantine forces separation: Machinery (enzyme) ≠ Data (strand) it acts on. |
  | Realizing need for "copy anything"  | The replicator must be *general*. Its *specific* description is separate data. |
  | Encoding the machine (`GC`) as data | Self-description: Strand contains instructions *for* copier *and* data *of* copier. |
  | Noise killing a long replicator     | Error threshold: Description must be compact to survive imperfect copying. |

  ### Predictable Failure Modes & Fixes
  1.  **Hand-Copying:** Student physically writes a copy of their strand instead of using an enzyme. *Fix:* State clearly upfront: "All new strands must be created ONLY via enzyme actions applied to existing strands. No hand-copying."
  2.  **Fast Team Dominates:** One team replicates early, floods pool with copies, others stall. *Fix:* Emphasize quarantine applies to *all* copies of a team's *original* strand. Their enzymes can *only* act on strands *not* originally from their team. Forces collaboration/trade. Use noise phase to disrupt dominance.
  3.  **Degenerate Replicator:** Team finds `GC` alone works if someone else makes the Copy enzyme targeting it. *Fix:* Legitimate! This *is* the minimal replicator leveraging the system rules. Debrief it: "Who copied `GC`? The *other* team's enzyme. Your strand `GC` *encoded* the copier, but the *copier itself* was built by *their* strand. It *is* indirect replication. Can `GC` replicate *without* another team's different strand starting the chain?" (No - quarantine prevents the enzyme made *from* `GC` acting *on* `GC` itself. Requires a distinct starter strand).

  ### Honest Limits
  This **perfectly models mechanical self-replication** (machine + description). The "aha!" is the **necessary indirection** enforced by quarantine. **It does NOT model logical self-reference/incompleteness:** No statements *about* statements, no diagonalization, no fixed points in logic. The debrief MUST explicitly state: "This is how physical things replicate. Gödel's trick is *analogous* but about *truth/provability* within a *logical* system – much trickier! Our quarantine rule artificially created the need for indirection; Gödel found it was *inherent* in arithmetic." **False Takeaway Risk:** A bright student might think biological self-replication works *exactly* like this simplified code/data split (oversimplified), or that Gödel *only* means systems can't talk about themselves directly (missing the profound implications). Counter in debrief with: "Real biology mixes code & machinery messily. Gödel showed arithmetic's power to encode *itself* forces limits on what it can prove *about* itself."
