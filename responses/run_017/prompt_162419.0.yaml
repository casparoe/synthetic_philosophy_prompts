prompt: |-
  I do interpretive planning at a mid-sized regional history museum — basically I'm the person who reads every exhibit script before it goes upstairs, which is a dozen or so a year, and each one is packed with "why did this happen" claims: wall text, panel copy, audio tour stops, the seven-minute intro video. We have no way of telling the difference between a script that actually explains something and one that just tells a story that happens to stop where the thing we're explaining starts. And I get maybe forty minutes per script, no one on my team has any philosophy training, and whatever comes out of the review has to survive a meeting with a director who has opinions, a community advisory board that has more, and eventually a docent saying it out loud to a fourth grader and a donor in the same breath.

  I've read a little of this literature — the old covering-law picture where you're supposed to subsume the event under a general law, and then the people who say no, narrative explains in its own right and doesn't need a law bolted underneath. Please turn whatever in that fight is actually usable into a procedure I can run on one single claim: the questions in order, what counts as a passing answer to each, where the procedure just stops with a no, and where it has to hand the decision to a person because the real disagreement is about what's worth saying rather than about what happened.

  Two things specific to us that I'd like the procedure to either use or explicitly throw out:

  - Our house rule, which came from a funder: every causal claim has to be one of three things — a mechanism ("the mill closed because the embargo tripled its fuel costs and it ran on fuel oil"), a counterfactual ("even without the levee, the '27 flood still would have taken the east bank"), or what they call a "legibility" claim, one that just makes the sequence graspable. I suspect the third bucket is where all the dead weight is hiding.
  - A test one of our board members keeps pushing: tell the story backwards. If the chain still holds up in reverse there's real law-backed structure under it; if it collapses, it was only ever narrative. I half believe this and half think its nonsense, and I can't say which half is right.

  I also need to know how the procedure handles claims that are only true because of how things later turned out — "the seeds of the '67 riot were sown when the streetcar tracks came up in '52" type sentences — and flat inevitability claims like "it was only a matter of time before the mine shut." Those are the ones our director loves and I have no vocabulary to push back on.

  Then run it on three claims from the script on my desk right now: (1) the mill-closure-with-fuel-costs line above; (2) the streetcar/seeds line; (3) a ten-panel chronology of a mayor's two terms, 1948 to 1956, that a donor wants captioned "How the modern city got built." One of those should definately come out badly for me and I'd rather hear it from you than in the meeting.

  Lead with your bottom line in the first sentence — whether a usable procedure exists here and what its spine is — then the procedure, then the three applications, then what the procedure can't do for me. No preamble and don't restate the question back at me.
reasoning: |-
  Okay, the user is an interpretive planner at a mid-sized regional history museum. They're overwhelmed with reviewing exhibit scripts that make causal claims, without a solid method to distinguish genuine explanations from mere narratives. They need a practical, step-by-step procedure to evaluate each claim efficiently, given tight time constraints and multiple stakeholders. 

  First, I need to address their specific pain points: 
  - They're drowning in scripts (dozens per year) with only 40 minutes per review. 
  - Their team lacks philosophy training, so the method must be jargon-free. 
  - They face layered approvals (director, advisory board, docents) and need defensible criteria. 

  The user mentions two existing frameworks: 
  1. Their funder's "house rule" requiring causal claims to be either mechanisms, counterfactuals, or "legibility" claims. They suspect the third category is problematic. 
  2. A board member's "tell it backwards" test, which they're skeptical about. 

  They also flag two tricky claim types: 
  - Retrospective inevitability ("seeds were sown" narratives) 
  - Teleological arguments ("only a matter of time" claims) 

  The core challenge is separating structural explanation from post-hoc storytelling. Philosophy debates (covering-law vs. narrative explanation) are relevant but must be distilled into actionable steps. 

  I recall Carl Hempel's covering law model requires universal laws, but historians rightfully critique this as unrealistic for complex events. Meanwhile, narrative theorists like Paul Ricoeur argue stories explain through emplotment. The user needs a hybrid approach—something that respects historical contingency while flagging weak causality. 

  For the procedure, I consider a decision-tree format: 
  1. First, isolate the specific causal claim (e.g., "X caused Y"). 
  2. Then test against their house rule buckets: mechanism? counterfactual? If not, it's likely "legibility"—which needs extra scrutiny. 
  3. Add a step for retrospective claims: demand evidence contemporaneous to the cause, not just later outcomes. 
  4. For inevitability claims, require disproof of alternatives (e.g., "what could've prevented this?"). 

  The board's "backwards test" isn't nonsense but is incomplete. Reversing a narrative can expose gaps, but many valid explanations (e.g., "war caused famine") fail if reversed ("famine caused war"?). Better to use it as an optional stress test. 

  For the three test cases: 
  1. The mill closure (mechanism) should pass—clear fuel-cost link. 
  2. The streetcar/riot claim ("seeds were sown") needs contemporaneous evidence; otherwise, it's weak. 
  3. The mayor's chronology labeled "How the modern city got built" implies inevitability and teleology—likely fails without showing necessity. 

  Finally, the method must explicitly state its limits: it can't resolve value disputes (e.g., "what's worth explaining?") or replace expert judgment for nuanced cases. The user needs cover to say "this isn't explanatory" without philosophy degrees. 

  Key insight: Their real struggle is authority. They need a tool to objectively flag weak claims before higher-ups override them. The procedure should arm them with "why this fails" language tied to their existing rules.
answer: |-
  **Bottom line: A usable procedure exists, centering on isolating causal claims, testing for explanatory substance via mechanism/counterfactual validation, and flagging narrative-only or teleological assertions for human judgment.**

  ---

  ### **Procedure: Causal Claim Audit (CCA)**
  *Run this on each discrete causal claim (e.g., "X caused Y," "Z led to W," "without A, B wouldn't have happened").*

  1.  **Isolate the Claim (2 min):**
      *   Identify the *exact* cause-effect assertion in the script text. Write it as: "[CAUSE] led to/results in/caused [EFFECT]."
      *   *Pass:* Clear cause-effect pair identified.
      *   *Stop/Fail:* No discernible causal claim (e.g., pure description, chronology). Mark "N/A."

  2.  **Classify per House Rule (3 min):**
      *   Which bucket does it claim to be?
          *   **Mechanism:** Specifies *how* Cause → Effect (physical steps, decisions, processes).
          *   **Counterfactual:** Implies/claims Effect *would not* have happened without Cause.
          *   **Legibility:** Only claims Cause + Effect are linked sequentially ("and then"), making the story coherent.
      *   *Pass:* Fits one bucket. Proceed to Step 3.
      *   *Stop/Fail:* Doesn't fit any bucket. Flag for rewrite.

  3.  **Test Explanatory Substance (Core - 15 min):**
      *   **For Mechanism Claims:**
          *   Ask: *"Does the script describe the actual chain of actions/events/reactions connecting Cause to Effect?"*
          *   *Pass:* Specific, plausible steps are provided (e.g., embargo → fuel cost tripled → mill couldn't afford fuel → shut down).
          *   *Fail:* Steps are vague, assumed, or missing (e.g., "The embargo caused the mill to close" with no *how*). Flag "Lacks Mechanism Detail."
      *   **For Counterfactual Claims:**
          *   Ask: *"Does the script provide evidence (or is evidence implied/known) that Effect was *contingent* on Cause? Could Effect reasonably have happened *without* Cause?"*
          *   *Pass:* Contingency is supported (e.g., data showing mill was profitable before fuel spike; no other major disruptions cited; similar mills closed under embargo). Or, the claim is explicitly framed as a plausible "what if."
          *   *Fail:* Contingency is asserted without support or Effect seems likely regardless (e.g., "Without Mayor Smith, the city wouldn't be modern" – ignores other factors). Flag "Unsupported Contingency."
      *   **For Legibility Claims:**
          *   Ask: *"Is this *only* a sequence marker? Could replacing 'led to' or 'caused' with 'and then' or 'followed by' change the meaning?"*
          *   *Pass:* The link is purely chronological/contextual; no strong causal force implied. Script doesn't present it as deep explanation.
          *   *Fail:* The language *implies* causation stronger than mere sequence. Flag "Legibility Masquerading as Explanation." *Proceed to Step 4.*

  4.  **Special Case Flags (10 min):**
      *   **Retrospective/Teleological Claim?** (e.g., "Seeds were sown," "Inevitable," "Led ultimately to").
          *   Ask: *"Is the *only* evidence for this causal link the *later occurrence* of the Effect?"*
          *   *Pass:* No. Contemporaneous evidence or a clear mechanism/counterfactual *from the time of the Cause* is provided.
          *   *Fail:* Yes. The link relies solely on hindsight. Flag "Hindsight Bias / Teleology." *Requires human judgment* (Is this framing *necessary* for understanding, despite being weak causation?).
      *   **"Tell it Backwards" Test (Optional - Use if time/for high-stakes claims):**
          *   Restate the causal chain *backwards*, starting from Effect to Cause.
          *   Ask: *"Does the reversed chain still feel logically coherent and plausible *without* relying on knowing the actual outcome?"*
          *   *Pass:* Reversed chain holds (e.g., Mill closed → Why? Fuel costs tripled → Why? Embargo). Suggests strong structural link.
          *   *Fail:* Reversed chain feels forced, illogical, or relies on knowing the outcome (e.g., Riot happened → Why? Seeds sown 15y prior? What specific seeds? How connected?). *Doesn't automatically fail claim,* but flags "Narrative Structure Reliant on Forward Momentum." *Combine with other Step 3/4 results.*

  5.  **Decision Point (10 min):**
      *   **Pass:** Claim passed Steps 2 & 3 (and 4 if applicable) for its type.
      *   **Fail:** Claim failed Step 3 or Step 4 (Hindsight Fail). Needs rewrite for substance.
      *   **Flag for Human Judgment:** Claim is "Legibility Masquerading as Explanation" (Step 3) or "Hindsight Bias / Teleology" (Step 4) *but* may serve an essential narrative/interpretive purpose. *Document the specific issue.* Decision hinges on *interpretive goals* (explanation vs. engagement vs. donor relations), not just causal logic.

  ---

  ### **Application to Your Claims**

  1.  **"The mill closed because the embargo tripled its fuel costs and it ran on fuel oil."**
      *   **Step 1:** Cause = Embargo tripled fuel costs; Effect = Mill closed. Clear.
      *   **Step 2:** Mechanism (specifies *how* embargo → closure).
      *   **Step 3 (Mechanism):** PASS. Clear chain: Embargo → Fuel Cost ↑ → Mill (fuel-dependent) → Closure.
      *   **Step 4:** Not Retrospective/Teleological. "Backwards Test" (Optional): Closure → Fuel Costs ↑ → Embargo. Holds. PASS.
      *   **Decision:** PASS. Good explanatory claim.

  2.  **"The seeds of the '67 riot were sown when the streetcar tracks came up in '52."**
      *   **Step 1:** Cause = Streetcar tracks removed (1952); Effect = Seeds sown for 1967 riot. (Effect is vague).
      *   **Step 2:** Ambiguous. Implies Mechanism? Or Legibility? Likely treated as Mechanism/Narrative.
      *   **Step 3:** If Mechanism: FAIL. No *how*. What "seeds"? How did track removal *specifically* lead to conditions for riot 15y later? Vague.
      *   **Step 4:** Retrospective/Teleological? YES. FAIL. Link relies *entirely* on knowing the 1967 riot happened. "Backwards Test": 1967 Riot → Why? "Seeds sown" in 1952 → What seeds? How connected? Collapses without knowing outcome. FAIL.
      *   **Decision:** FAIL (Lacks Mechanism, Hindsight Bias). Flag for Human Judgment: Could it be reframed as a contributing factor *if* a specific mechanism exists (e.g., "Removing tracks isolated neighborhood X, concentrating poverty, a factor later contributing to tensions")? As is, it's weak narrative glue.

  3.  **Ten-panel chronology (1948-1956) captioned "How the modern city got built."**
      *   *This is a framing claim for the entire sequence, not a single cause-effect.*
      *   **Step 1:** Implied Mega-Claim: Mayor's actions (1948-56) *caused* the "modern city."
      *   **Step 2:** Implies strong Mechanism/Narrative Explanation.
      *   **Step 3:** Mechanism? FAIL. Chronology ≠ Mechanism. Doesn't show *how* specific actions *caused* modernity. Counterfactual? Unsupported (Would modernity *not* have happened without *this* mayor? Unlikely). Legibility? PASS *as sequence*, but caption implies *causation*.
      *   **Step 4:** Highly Teleological. FAIL. Labels the *outcome* ("modern city") and frames the entire period *only* through that lens. Ignores other factors, contingency, unintended consequences. "Backwards Test": Modern City → How built? Mayor 1948-56. Why *only* him? What specific causal links? Collapses.
      *   **Decision:** FAIL (Teleology, Lacks Mechanism). **This is the one that comes out badly.** Flag for Human Judgment: The caption asserts inevitability and sole agency. Can it be softened? ("Shaping the Modern City," "The Mayor's Vision for Modernity"). The chronology itself can stay, but the framing is problematic.

  ---

  ### **What the Procedure Can't Do For You**

  1.  **Resolve Value Conflicts:** It flags *how* a claim is weak logically, but it can't decide if a weak "legibility" or "hindsight" claim is *worth keeping* for emotional resonance, donor satisfaction, visitor flow, or advisory board priorities. That's the "Human Judgment" step.
  2.  **Define "Plausible" or "Reasonable":** Judgment calls on contingency (Counterfactual) or mechanism detail are still needed. Philosophy training helps here, but the procedure forces explicit consideration.
  3.  **Fix Bad History:** If the facts are wrong, this won't catch it. It assumes factual accuracy.
  4.  **Handle Overdetermination:** Events often have multiple sufficient causes. The procedure flags *this specific claim*, not whether it's the *only* cause.
  5.  **Override Your Director/Board:** It gives you objective grounds ("this fails the counterfactual test," "this is teleological framing") to push back, but the final call on flagged items rests with stakeholders. It arms you with specific criticisms beyond "this feels weak."
  6.  **Guarantee Visitor Comprehension:** A logically sound mechanism might still be too complex for a 4th grader. That's a separate interpretive challenge.
