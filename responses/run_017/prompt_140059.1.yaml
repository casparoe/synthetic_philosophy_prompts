prompt: |-
  I sit on the board of a small land trust, and in a few weeks we vote on whether to let a stretch of second-growth woodland be cleared for a distribution centre. People keep telling me that if wild lives are mostly net-negative, then destroying habitat lowers total suffering; other people tell me the opposite; and I have noticed that the two sides are often not comparing the same thing at all. Before I argue either way I want the specification, not the verdict.

  Write me the desiderata an account of an ecosystem's net welfare would have to meet in order to be usable for a decision like mine: the cases it has to get right, the distinctions it must not collapse, the empirical findings it cannot contradict, each with the consideration that puts it on the list. Mark which requirements are non-negotiable and which are only the preferences of one camp.

  Six worries of mine should be forced into the criteria rather than left implicit. First, the difference between a one-off drop in numbers and a permanent one: if a population sits near carrying capacity it partly rebounds after habitat loss, so an account that integrates a transition and an account that compares steady states can disagree about the sign of the effect. Second, the difference between fewer lives, different lives, and better lives, including whether individuals who are never born can be counted as a gain. Third, sensitivity to composition and not only to head count: clearing tends to favour edge-tolerant generalists over specialists, and a shift toward life histories with many short lives may swamp everything else even when total biomass is unchanged. Fourth, tractability under the data one can actually obtain, which is counts, body sizes and fecundities rather than affective states, so require the account to name its observable proxy and to say how far the verdict can move if the proxy is wrong. Fifth, an explicit counterfactual and time horizon, since the alternative to clearing is not wilderness but some other use of the land. Sixth, a clean separation of the ecological question from the population-ethical one, so that one and the same ecology yields different verdicts under different stances on creating unhappy versus happy lives, and I can see which stance is doing the work.

  Finally, tell me which pair of requirements on your list you think cannot be jointly satisfied — my suspicion is that composition-sensitivity pulls against data-tractability, and that additive separability across individuals sits badly with taking the badness of a suffering life seriously — and say which single requirement excludes the largest share of the views currently on offer. Keep any scoring of actual theories to a few lines; the criteria are the part I need.
reasoning: |-
  Okay, the user is on the board of a small land trust and needs to vote on clearing second-growth woodland for a distribution center. They're grappling with conflicting arguments about whether destroying habitat reduces net suffering by eliminating wild animal lives. But they want clear criteria to evaluate any net welfare account, not just opinions.

  Hmm, they've laid out six specific worries that must be addressed in the criteria. Let me unpack each one carefully. First, they're concerned about the difference between temporary population drops versus permanent reductions - this is crucial because rebound effects could negate perceived benefits. Second, they want clarity on whether "fewer lives" equals less suffering - a philosophical minefield involving nonexistent beings. Third, they emphasize composition shifts - edge-tolerant generalists with high mortality rates might dominate post-clearing, changing welfare dynamics entirely. 

  Fourth is practical data limitations - we can't measure animal happiness, only counts and life histories. Any account must acknowledge this proxy gap. Fifth, they rightly point out the counterfactual isn't wilderness stasis but alternative land uses. Sixth demands separating ecological predictions from ethical stances - two distinct layers. 

  *scribbles outline* The criteria must cover: temporal dynamics (steady-state vs transition), ontological status of potential lives, compositional sensitivity, empirical tractability, counterfactual framing, and ethical modularity. Non-negotiables? Probably the ethical separation and counterfactual rigor - without those, the decision framework collapses into ideology. 

  Biggest tension spots... Composition-sensitivity vs data-tractability will clash hard - detailed species-level welfare assessments are impossible with current methods. Also, additive individual welfare (for aggregation) conflicts with the intuition that suffering might be non-linear - one tortured life may outweigh many mild discomforts. 

  *checks user's last request* Ah, they want to know which single requirement filters most theories. That's likely the "nonexistent beings" criterion - it forces a stance on creation ethics that many accounts dodge. Most theories implode when pressed on whether preventing a miserable life is good or neutral. 

  Final note to self: User needs this for board arguments. Must keep criteria actionable, not academic. Show how each requirement exposes weaknesses in common talking points.
answer: |-
  Here are the desiderata for an ecosystem net welfare account, structured to address your six core worries. Requirements marked **(N)** are non-negotiable for robust decision-making; others reflect common but contestable philosophical stances.

  ---

  ### **Core Desiderata & Their Rationale**
  1.  **Temporal Resolution Distinction (N)**
      *   **Must:** Explicitly model *both* transient dynamics (population crash, dispersal mortality, rebound) *and* steady-state differences (long-term carrying capacity under cleared vs. alternative land use).
      *   **Consideration:** Avoids conflating short-term mortality spikes with long-term welfare effects. A clearing event may cause intense suffering during displacement/destruction, but if the remaining habitat forces population stabilization near the original carrying capacity (via density dependence), the long-term net effect on total lives/suffering might be minimal or reversed.
      *   **Non-Negotiable:** Yes. Failure here invalidates comparisons (your 1st worry).

  2.  **Ontological Status of Potential Lives**
      *   **Must:** State explicitly whether:
          *   (a) Preventing the existence of a potential sentient being is neutral (neither good nor bad).
          *   (b) Preventing the existence of a potential sentient being is good *if* its life would have been net-negative.
          *   (c) Preventing the existence of any potential sentient being is inherently bad (regardless of welfare).
      *   **Consideration:** Addresses the core disagreement about "fewer lives vs. better lives" and the moral status of never-born individuals (your 2nd worry). This is fundamentally *not* an ecological question but an ethical one. The account must flag which stance it adopts.
      *   **Non-Negotiable:** No, but the account *must* be explicit and modular (see point 6).

  3.  **Compositional Sensitivity (N)**
      *   **Must:** Incorporate differential welfare impacts based on:
          *   Species-specific life histories (r-strategists: high birth/death, many short lives; K-strategists: low birth/death, fewer longer lives).
          *   Species-specific welfare proxies (e.g., inferred suffering potential based on mortality modes, stress indicators, neurological complexity).
          *   Impact on specialist vs. generalist balance (clearing favors high-turnover generalists).
      *   **Consideration:** A shift towards r-strategists (e.g., mice, insects) replacing K-strategists (e.g., forest birds, mammals) likely increases the *number* of lives filled with high infant mortality/predation, even if biomass is stable. Ignoring this risks catastrophic welfare miscalculation (your 3rd worry).
      *   **Non-Negotiable:** Yes. Headcount or biomass alone is grossly misleading.

  4.  **Empirical Tractability & Proxy Transparency (N)**
      *   **Must:**
          *   Define clear, measurable *proxies* for individual welfare/suffering (e.g., baseline mortality rate, juvenile mortality rate, predator-induced mortality %, starvation indicators, physiological stress biomarkers if feasible).
          *   Quantify the sensitivity of the final welfare verdict to errors/variation in these proxy measurements.
          *   Rely primarily on feasible data: species inventories, abundance, body size, fecundity, survivorship curves (from literature), known causes of mortality.
      *   **Consideration:** We cannot measure "happiness" or "suffering" directly in wild animals at scale. The account must be operational with available data and acknowledge the limitations/uncertainty of its proxies (your 4th worry).
      *   **Non-Negotiable:** Yes. Untestable or data-oblivious accounts are useless for real decisions.

  5.  **Explicit Counterfactual & Time Horizon (N)**
      *   **Must:**
          *   Define the specific *alternative land use(s)* being compared (e.g., "managed woodland for light recreation" vs. "passively protected wilderness" vs. "agriculture" - *not* an abstract "wilderness").
          *   Specify the time horizon for comparison (e.g., 20 years, 50 years, steady-state).
          *   Model the welfare trajectory under *both* the clearing scenario *and* the defined alternative(s) over this horizon.
      *   **Consideration:** "Do nothing" usually isn't true; land management choices exist. The welfare impact depends entirely on what the cleared land is replacing and over what timeframe (your 5th worry).
      *   **Non-Negotiable:** Yes. Absence renders the comparison meaningless.

  6.  **Separation of Ecology and Population Ethics (N)**
      *   **Must:**
          *   **Ecology Module:** Output predicted changes in *populations* (abundance, composition, life history distribution) and *individual experiences* (proxied mortality risks, stressors) under each scenario.
          *   **Ethics Module (Modular):** Apply different ethical stances (e.g., Totalism - sum welfare; Averagism - average welfare; Person-Affecting - focus only on existing/future identifiable individuals; Asymmetry - preventing bad lives good, preventing good lives neutral) to the ecological predictions to yield a verdict.
      *   **Consideration:** Allows disentangling the scientific prediction ("what happens?") from the ethical valuation ("is that outcome better or worse?"). Enables you to see which stance drives a particular verdict (your 6th worry).
      *   **Non-Negotiable:** Yes. Conflation obscures the source of disagreement.

  ---

  ### **Key Tensions & Excluding Power**
  1.  **Major Tension: Compositional Sensitivity (N) vs. Empirical Tractability (N)**
      *   **Why:** Rigorously incorporating species-specific welfare proxies and life-history shifts requires incredibly detailed ecological data (species-level mortality causes, stress responses, density-dependent feedbacks) that is rarely available for diverse, second-growth ecosystems. Simplifying assumptions (e.g., "all vertebrates have similar welfare potential") sacrifice sensitivity but may be the only tractable approach, undermining point 3. Highly sensitive models risk being speculative and untestable with feasible data, violating point 4.

  2.  **Significant Tension: Additive Separability vs. Suffering Significance**
      *   **Why:** Most quantitative models assume individual welfare units are additive. However, if suffering is non-linear (e.g., intense suffering for a few days might outweigh mild discomfort for months) or if the *prevention* of the *worst possible lives* (e.g., starvation, parasitism) is ethically paramount, simple addition may fail. An account prioritizing preventing intense suffering might value eliminating high-mortality niches even if total lives decrease less than in an alternative scenario favoring longer, less traumatic lives. This challenges both aggregation methods and the choice of welfare proxies.

  3.  **Most Excluding Requirement: Ontological Status of Potential Lives**
      *   **Why:** A vast majority of proposed "net suffering" arguments implicitly or explicitly rely on a specific stance (often (b) - preventing bad lives is good). However, accounts rarely defend this stance rigorously against alternatives (a) or (c). Requiring explicit declaration and modularity forces the account to confront this foundational ethical disagreement. Most simplified "destroying habitat reduces suffering" arguments collapse without assuming stance (b), while many conservation ethics arguments implicitly rely on (a) or (c). This requirement excludes frameworks that bury this crucial ethical choice.

  ---

  ### **Scoring of Current Views (Briefly)**
  *   **"Habitat Loss Reduces Suffering" (Simple):** Fails almost all criteria: Ignores temporal dynamics & rebound, assumes stance (b) uncritically, ignores compositional shifts, lacks tractable proxies, uses vague counterfactual ("wilderness"), conflates ecology/ethics. Excluded by 1(N), 3(N), 5(N), 6(N).
  *   **"All Life is Sacred/Intrinsic Value":** Fails 2 (often assumes c), 4(N) (no quantifiable welfare proxy), 6(N) (conflates existence value with welfare). Prioritizes existence over experience.
  *   **Sophisticated Welfare Biology Models (e.g., inspired by Tomasik):** Attempt 1, 3, 4, 5, 6. Often explicitly adopt stance (b). Struggle most with 3(N) vs 4(N) (data for compositional sensitivity) and the suffering significance tension. Provide the *structure* needed but face immense empirical challenges.
  *   **Ecosystem Services/Human-Centric:** Avoids the non-human welfare question entirely. Not relevant to *this* welfare question.

  **In essence:** A usable account must be a complex, ethically modular ecological simulation model fed by the best available species data, explicitly tracking populations and proxy welfare indicators over time under defined scenarios, separating prediction from valuation. The lack of such operational models meeting all (N) criteria highlights the profound difficulty of answering your board's question definitively with current tools. Your role is to scrutinize arguments against these criteria to expose their weaknesses.
