  Okay, the user is a software engineer without formal philosophy training but has a solid grasp of the Best-System Account (BSA) of laws through the lens of data compression. They've raised three technical objections: language dependence, incompressibility, and uncomputability. They want my credence as a professional philosopher on whether BSA can satisfy three strict criteria: non-arbitrariness, non-collapse in disorder, and functional adequacy for counterfactuals/explanations. 

  First, I need to unpack their framing. The compression analogy is sharper than how Humeans typically present BSA—Lewis emphasized balance between strength and simplicity without specifying algorithmic information theory (AIT). But their reading isn't unfaithful; it's a natural formalization. Still, most Humeans avoid committing to Kolmogorov complexity specifically because of the issues raised. 

  The language-relativity problem feels most acute. AIT's constant-factor invariance doesn't resolve granular choices: should we prioritize particle positions or field values? Thermodynamic or quantum states? Humeans might appeal to "natural" predicates (Lewis's elite classes), but this smuggles in anti-Humean primitives. If we reject that, BSA becomes vocabulary-relative—a major cost. 

  Incompressibility might be tolerable. Humeans could argue that disordered mosaics simply have no laws (only local patterns), but this violates criterion (ii). Alternatively, they might say the "brute list" itself is the best system—but then every microstate becomes a law, collapsing into regularity theory. 

  Uncomputability is defensible metaphysically. Laws could exist as abstract summaries even if unknowable. But this undermines BSA's epistemological appeal: laws are supposed to guide expectations. If the best system is uncomputable, can it explain why agents rely on Newtonian approximations? 

  Anti-Humean alternatives (governing laws, universals, dispositions) avoid these technical issues but face their own problems: mystical "governance," opaque necessity, or unexplained dispositions. Still, they trivially satisfy determinacy (laws aren't derived from mosaics) and handle disorder (laws exist regardless). 

  Credence decomposition:  
  - Faithfulness: 0.9 (BSA’s spirit is compression-like, even if not explicitly AIT)  
  - Language relativity: 0.2 (no satisfactory Humean answer without elite classes)  
  - Incompressibility: 0.4 (could bite the bullet if disorder implies no laws, but violates criterion)  
  - Uncomputability: 0.7 (metaphysically harmless but functionally problematic)  
  - Anti-Humean edge: 0.6 (they avoid these pitfalls but have heavier baggage)  

  Headline credence: 0.3. The language issue and incompressibility collapse are decisive. The user’s 0.3 aligns with my view; their ML friend’s 0.7 likely stems from weighting uncomputability lower (seeing it as "merely epistemic") or trusting natural predicates. Least confident in the anti-Humean assessment—maybe primitive natural properties are less ad hoc than I think? Experimental metaphysics (e.g., quantum contextuality challenging realism about properties) could shift this.
answer: |-
  Here's my systematic breakdown as a metaphysician with formal training, followed by my credence and calibration analysis. I've structured it to address your engineer's lens and explicit criteria.

  ### **Headline Credence: 0.35**  
  *(Justification: The compression analogy exposes fatal technical constraints under your strict criteria, despite BSA's conceptual appeal.)*

  ---

  ### **Decomposed Credence & Justifications**  
  1. **Faithfulness of Compression Reading to Humean BSA**:  
     **Credence: 0.8**  
     *Justification:* Lewisian BSA explicitly invokes simplicity/strength tradeoffs analogous to MDL, and AIT formalizes this intuition—though most Humeans avoid full algorithmic commitment, the structural parallel is undeniable.  

  2. **Language-Relativity Without Anti-Humean Resources**:  
     **Credence: 0.2**  
     *Justification:* Invariance theorems only fix asymptotics; for finite mosaics, vocabulary choice (e.g., particle ontologies vs. fields) can flip "simplest" systems. Natural properties (Lewis’s "elite classes") might resolve this but are quasi-anti-Humean. No neutral Humean ground exists.  

  3. **Incompressibility as Fatal or Biteable**:  
     **Credence: 0.3**  
     *Justification:* Biting the bullet implies disordered mosaics have *no laws* (violating your criterion ii). Alternatively, the brute mosaic *is* the "law"—but then all regularities vanish, collapsing into triviality. Neither satisfies lawhood’s explanatory role.  

  4. **Uncomputability as Metaphysically Irrelevant**:  
     **Credence: 0.7**  
     *Justification:* BSA aims to define lawhood *ontologically* (what *makes* a law true), not epistemically (how we find it). Uncomputability doesn’t preclude a determinate best system—but it cripples lawhood’s function in guiding expectations.  

  5. **Anti-Humean Alternatives Outperforming on Criteria**:  
     **Credence: 0.6**  
     *Justification:* Governing-laws (e.g., Maudlin) or dispositional-essence (e.g., Bird) views trivially satisfy (i)-(iii) by fiat—laws are primitive and impose order *ex ante*. They avoid language-dependence/incompressibility but face "queerness" objections (e.g., non-supervenience).  

  ---

  ### **Term of Least Confidence: Anti-Humean Performance (Credence 0.6)**  
  - **Why uncertain:** Anti-Humean views "solve" the criteria by stipulation but may relocate arbitrariness (e.g., "Why *these* governing laws?"). Their counterfactual handling relies on unanalyzable necessity—arguably *less* rigorous than BSA’s compression.  
  - **What would move it:** A formal demonstration that anti-Humean lawhood generates *testable predictions* without tacitly relying on BSA-style compression (e.g., in statistical mechanics). Current proposals are metaphysically robust but empirically unanchored.  

  ---

  ### **Calibration: Diagnosing Your Disagreement (You: 0.3, ML Friend: 0.7)**  
  Your disagreement likely centers on **language-relativity and functional adequacy**.  
  - **Your engineer’s view (0.3):** Focuses on *implementation*—vocabulary dependence and incompressibility violate determinacy (i) and functional role (iii) for real-world systems.  
  - **Your ML friend (0.7):** Likely emphasizes asymptotic invariance and sees uncomputability as irrelevant to ontology. They may accept "natural predicates" as a feature (reflecting agent-relative pragmatics) rather than a bug.  

  **Key divergence:** Your friend may weight the *explanatory power* of compression for ordered mosaics higher, treating disorder as edge cases. You (rightly, I think) demand a general account where lawhood doesn’t break down at randomness.  

  ---

  ### **Why My Credence is 0.35**  
  BSA-as-compression fails your criteria decisively on language-relativity (violating i) and incompressibility (violating ii/iii). While uncomputability is surmountable ontologically, the *combined* technical constraints make a non-trivial account unlikely. Anti-Humeanism avoids these pitfalls but replaces them with primitives that may be equally arbitrary. **The credence reflects a 65% probability that BSA cannot be salvaged *without compromising its Humean commitments*.** 

  > 💡 **N.B.** A modified BSA (e.g., with agent-relative simplicity metrics) might score higher pragmatically—but you specified a *non-arbitrary*, *determinate* account. Under those constraints, 0.35 is charitable.
