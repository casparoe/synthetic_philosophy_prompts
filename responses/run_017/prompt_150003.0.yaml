prompt: |-
  I'm a fourth-year PhD student in urban planning with a secondary field in political theory, and I've been handed one 90-minute session of a graduate seminar I'm co-teaching on property, place, and political membership — 18 students, mostly planning and policy master's students, plus four law students who reflexively turn every question into a question about standing doctrines and two philosophy MA students who keep trying to argue about whether "the public" is anything over and above the people who happen to show up. I have to keep the session structured rather than discussion-led, and I'd rather the students run into the central problem than have me name it, so I'd like you to design a simulation game for me: roles, rules, materials I can prep in an afternoon, a payoff scheme in points rather than money, a minute-by-minute timeline, and a debrief.

  The thing I want them to feel is this: every land-use decision has to first settle who counts as a member of the relevant public — which residents, which radius, which time horizon — and that procedural decision does most of the substantive work, yet nobody in the room can settle it disinterestedly, because they already know where they stand. Concretely, I'm imagining a fictional neighborhood (say a two-street corridor with about two dozen parcels, a church parking lot, a strip of single-family homes, a few small apartment buildings, and a shuttered retail site) and a proposal for a mid-rise building with some number of income-restricted units; I'm happy to take your numbers. What I want built into the mechanics, if you can do it, is: a stage where the class must vote on the *standing gradient* itself — how much say a household gets at 100 feet, 500 feet, a mile, and nowhere near — before anyone is told which parcel they occupy or whether they own or rent there, so they're choosing the demos under a partial veil of ignorance; then a vote on the project proper with secret objective cards; then a rule that anyone who votes to block must discharge a *placement obligation*, naming an alternative site in the city that should take the units instead, with each named district having a small absorption capacity that visibly runs out, so the group discovers on its own that "somewhere else" is not an available answer; then, without warning, a redistribution of position cards — owners become renters, long-time residents become recent arrivals, a small landlord becomes a tenant, and so on — followed by the same vote again, so each student can see whether their earlier vote tracked their position or a principle they'll still stand by. I'd also like three empty chairs with placards representing the households who would occupy the building but can't be in the room, and some shared dial on the board — a regional rent index, a displacement counter — that moves by small amounts for everyone whenever units get blocked, so the diffuse benefit registers mechanically even though weakly. Please don't let the words NIMBY or right to the city be spoken by the facilitator until the debrief; no lecture up front.

  In the debrief I need the moments mapped onto the ideas: the gradient vote onto the boundary problem and the non-neutrality of any definition of the affected public; the placement obligation onto the difference between having a complaint and having authority over a place; the empty chairs onto the asymmetry between concentrated, identifiable costs and diffuse, unrepresented benefits; the reshuffle onto whatever it is that people are actually protecting when they object — use value, exchange value, neighborhood character as a positional good, or standing itself — and onto the gap between the inhabitant's claim and the owner's claim. Tell me what will predictably go wrong the first time I run it: the law students will try to litigate my fictional zoning code, someone will treat it as a puzzle to win rather than a case to judge, the person who draws the distant parcel will check out, at least one student is a landlord and another is facing a genuine rent increase, and the reshuffle will be gamed if anyone suspects it. And be frank about what the game structurally cannot reproduce and I'll have to say in so many words myself — the role of time and repetition, the fact that real hearings are decided partly by who has the Tuesday evening and the lawyer, the way state law fixes in advance what a city's "public" is for these purposes, and whatever you think is most badly flattened by compressing a multi-year process into an hour and a half. If it helps, I've also been asked to run a 40-minute version of this for a neighborhood association board next month; tell me which mechanic to cut and which to keep.
reasoning: |-
  We are going to design a simulation game for a 90-minute session. The goal is to have students experience the central problem: defining the "relevant public" for a land-use decision and how that procedural decision shapes the substantive outcome, while also confronting their own positionality.

  **Core Mechanics:**
  1. **Standing Gradient Vote:** Students vote on how much weight to give to residents at different distances (100 ft, 500 ft, 1 mile, beyond) *before* they know their own role. This is done under a partial veil of ignorance.
  2. **Role Assignment:** Each student gets a role card (with position: owner, renter, business owner, etc., and location) and a secret objective card (which may include self-interest and/or principle).
  3. **Project Vote:** Students vote on the project (mid-rise with income-restricted units) after a short discussion.
  4. **Placement Obligation:** Anyone voting to block must name an alternative site in the city for the units. Each named district has a small absorption capacity (tracked on a board) that runs out.
  5. **Redistribution:** Without warning, redistribute position cards (roles change: owners become renters, long-time residents become recent, etc.). Then, revote on the project.
  6. **Empty Chairs:** Three empty chairs with placards representing the future residents of the building (if built). They cannot speak but are affected.
  7. **Shared Dial:** A regional rent index and displacement counter that moves when units are blocked, showing diffuse costs.

  **Game Setup:**
  - **Time:** 90 minutes total.
  - **Participants:** 18 students, plus 3 empty chairs (for 21 "seats" but only 18 players).
  - **Neighborhood:** A fictional two-street corridor with about 24 parcels (drawn on a map). We'll have:
    - 8 single-family homes (owners and renters)
    - 4 small apartment buildings (with landlord and tenant roles)
    - 1 church (with parking lot)
    - 1 shuttered retail site (potential development site)
    - 10 other parcels (mix of small businesses, vacant lots, etc.)
  - **Proposal:** A mid-rise building (5 stories) on the shuttered retail site, with 40 units (20 income-restricted at 60% AMI, 20 market-rate).

  **Materials to Prep (in an afternoon):**
  1. **Map:** A large poster or projected map of the fictional neighborhood (with parcel numbers). 
  2. **Role Cards:** 18 cards, each with:
     - Parcel number (and whether they are at that location or work there, etc.)
     - Position: e.g., "Homeowner at 123 Oak St.", "Renter in Apartment Building B", "Small Business Owner at 456 Maple Ave", "Church Pastor", "Landlord of Building C", "Recent Arrival (renter)", "Long-time Resident (owner)", etc.
     - Also include: distance from the proposed development site (pre-calculated: e.g., adjacent, 100 ft, 500 ft, 1 mile, etc.).
  3. **Objective Cards:** 18 cards, each with a secret objective (mix of self-interest and principle). Examples:
     - "You are concerned about property values. You get 1 point for every 1% increase in your property value, lose 1 point for every 1% decrease."
     - "You are a housing advocate. You get 5 points for every income-restricted unit built, lose 2 points for every unit blocked."
     - "You are worried about traffic. You lose 1 point for every 10 new cars added to the neighborhood."
     - "You are a renter and fear displacement. You get 3 points if the project includes strong anti-displacement measures, otherwise lose 2 points per year your rent goes up by more than 5%."
     - "You are an environmentalist. You get points for green space, lose for increased pollution."
     - Some cards have conflicting goals to create tension.
  4. **Voting Tokens:** For the two votes (gradient and project) and for the placement obligation (maybe colored chips or cards).
  5. **Absorption Capacity Board:** A poster with a list of 5-6 fictional districts in the city (e.g., Downtown, North Hills, Riverside, etc.), each with an absorption capacity (e.g., Downtown: 5 units, North Hills: 10, Riverside: 15, etc.). Use tokens (like poker chips) to represent units; when a district is named, remove tokens until capacity runs out.
  6. **Shared Dials:** Two large dials (or paper sliders) on a poster: 
     - Regional Rent Index (starts at 100, moves up when units are blocked, down when built)
     - Displacement Counter (starts at 0, increases when units are blocked)
  7. **Empty Chairs:** Three chairs with placards: "Future Resident 1 (income-restricted unit)", "Future Resident 2 (income-restricted unit)", "Future Resident 3 (market-rate unit)".
  8. **Timer:** For each phase.

  **Game Sequence (Minute-by-Minute):**

  **Total: 90 minutes**

  **Phase 0: Introduction (5 minutes) [0:00-0:05]**
  - Explain: "Today we are simulating a land-use decision in the fictional neighborhood of Oak-Maple Corridor. There is a proposal to build a mid-rise building with 40 units (20 income-restricted) on a shuttered retail site. We will go through a process to decide whether to approve it."
  - Emphasize: "This is structured. Follow the steps. Points will be awarded based on your secret objectives. The goal is to experience the dynamics of such decisions."

  **Phase 1: Standing Gradient Vote (10 minutes) [0:05-0:15]**
  - **Instructions:** "Before we assign roles, we must decide: who has a say? We will vote on the weight of votes based on distance from the project. You are voting as a disinterested citizen for now."
  - Present four rings: 
    - Ring 1: Within 100 ft (adjacent parcels) - weight = ?
    - Ring 2: 100-500 ft (nearby) - weight = ?
    - Ring 3: 500 ft - 1 mile (neighborhood) - weight = ?
    - Ring 4: Beyond 1 mile (city) - weight = ?
  - Each student gets 10 points to distribute across the rings (they must assign integer weights). They write their distribution on a slip. Collect and average the weights (or use a mode) to set the official gradient. (Facilitator quickly calculates and announces.)

  **Phase 2: Role Assignment and Objective (5 minutes) [0:15-0:20]**
  - Hand out role cards and objective cards. Students read silently. They now know their position (and distance) and their secret objective.

  **Phase 3: Project Discussion (15 minutes) [0:20-0:35]**
  - Students can speak from their role. They must state their position and distance (e.g., "I'm a homeowner at 123 Oak, 100 ft away"). 
  - Facilitator: "Discuss the project: What are the benefits? Concerns? Remember the empty chairs (point to them) and the regional dials (explain they will move based on the decision)."
  - No vote yet.

  **Phase 4: First Project Vote (5 minutes) [0:35-0:40]**
  - Secret ballot vote: Approve or Block.
  - Tally and announce the result (but do not implement yet).

  **Phase 5: Placement Obligation (15 minutes) [0:40-0:55]**
  - **Rule:** Anyone who voted to block must now name an alternative district in the city for the units and specify how many units (up to the total blocked). 
  - Each named district can absorb only up to its capacity. Use the absorption board: 
    - When a student names a district, subtract the units they assign from that district's capacity (if capacity remains). If a district runs out, it cannot take more.
  - If a blocker cannot name an alternative that has capacity, their block vote is invalid (and they lose 2 points). 
  - If the project is blocked and not all units can be placed elsewhere, the project is rejected and the dials move (see below).

  **Phase 6: Dials Update and Consequences (5 minutes) [0:55-1:00]**
  - If the project is approved: 
    - Regional Rent Index decreases by 5 points (because new supply).
    - Displacement Counter decreases by 10 (because new affordable units).
  - If the project is blocked:
    - Regional Rent Index increases by 5 (demand pressure).
    - Displacement Counter increases by 10 (less supply, more displacement).
  - Also, if blocked, the empty chairs remain empty (and future residents get no housing).

  **Phase 7: Redistribution of Roles (5 minutes) [1:00-1:05]**
  - Without warning: "Now, we reshuffle roles." Collect all role cards and redistribute randomly (so each student gets a new role, possibly very different). Objective cards stay the same (so they have the same incentives but a new position).

  **Phase 8: Second Project Vote (5 minutes) [1:05-1:10]**
  - Another secret ballot vote on the same project, but now from their new role. 
  - Tally and announce.

  **Phase 9: Dials Update Again (if needed) (2 minutes) [1:10-1:12]**
  - If the second vote is to block, update the dials again (same amounts). If approve, reverse the previous block effect? (But note: the project was already blocked in the first vote and not built, so if the second vote is approve, it's too late? Alternatively, we can say the vote is on a similar project at the same site. For simplicity, treat the second vote as a new decision and update accordingly.)

  **Phase 10: Debrief (38 minutes) [1:12-1:50]**
  - Facilitated discussion. See below for structure.

  **Phase 11: Wrap-up (if time) [1:50-1:50]**

  **Debrief Structure:**
  Start by asking: "What happened? How did you feel?" Then map to concepts:
  1. **Standing Gradient Vote:**
     - "When you voted on the gradient, what were you thinking? How did it feel to set the rules without knowing your position?"
     - Concept: Boundary problem and non-neutrality of defining the affected public. Any definition of the public is political and shapes the outcome.
  2. **Placement Obligation:**
     - "What happened when blockers had to name an alternative? Was it easy? What happened when districts ran out of capacity?"
     - Concept: The difference between having a complaint and having authority over a place. "Somewhere else" is not a viable solution without a regional approach.
  3. **Empty Chairs:**
     - Point to the chairs: "Who spoke for these people? How were their interests represented?"
     - Concept: Asymmetry between concentrated, identifiable costs (e.g., neighbors' concerns) and diffuse, unrepresented benefits (future residents, regional affordability).
  4. **Reshuffle:**
     - "How did your vote change when your role changed? Did your principle hold, or did your interest change your vote?"
     - Concept: What are people protecting? Use value (e.g., quality of life), exchange value (property value), neighborhood character (as a positional good), or standing itself? Also, the gap between the inhabitant's claim (e.g., the renter) and the owner's claim.

  **What Will Go Wrong:**
  - Law students: They will try to litigate the fictional zoning code. Be firm: "In this simulation, the rules are as I state. We are focusing on the political and planning dynamics, not legal arguments."
  - Puzzle to win: Some may try to maximize points. That's okay, as it mirrors real incentives, but remind: "This is about the process, not winning."
  - Distant parcel: The student with a distant parcel might check out. The reshuffle will help, and the dials show regional effects so they have a stake.
  - Real-life landlords/renters: They may bring personal experience. Acknowledge: "Real experiences matter, but in this simulation, please play the role you are given."
  - Reshuffle gaming: If someone suspects the reshuffle, they might vote strategically in the first vote. That's okay; it can be discussed in debrief.

  **What the Game Cannot Reproduce:**
  - **Time and repetition:** Real decisions happen over years, with multiple hearings. The game compresses this.
  - **Participation barriers:** In reality, who has the time (Tuesday evening) and resources (lawyer) matters. The game assumes equal participation.
  - **State law:** In reality, state law often defines the "public" (e.g., who can appeal). The game lets the group decide.
  - **Complexity:** Real projects have environmental reviews, financing, etc. The game simplifies to the core conflict.

  **40-Minute Version for Neighborhood Association:**
  Cut:
  - Reshuffle phase (saves 12 minutes: redistribution and second vote).
  - Placement obligation might be simplified (only 5 minutes).
  - Dials update can be quick.

  Keep:
  - Standing gradient vote (5 min)
  - Role assignment (2 min)
  - Project discussion (10 min)
  - First project vote (3 min)
  - Placement obligation (10 min) - critical for the "somewhere else" lesson.
  - Dials update (2 min)
  - Debrief (8 min) - focus on the gradient and placement obligation.

  Materials: Same, but skip the reshuffle and second vote.

  **Final Note:** 
  This game is intense and may provoke strong reactions. The debrief is crucial. Good luck!
answer: |-
  Below is a complete simulation game design tailored to your requirements. I'll break it down into: (1) **Game Overview**, (2) **Materials & Prep**, (3) **Minute-by-Minute Timeline**, (4) **Debrief Guide**, (5) **Predictable Challenges & Structural Limitations**, and (6) **40-Minute Version**. The game centers on your core insight: **defining the "relevant public" is the first, substantive land-use decision, and it's impossible to do neutrally because everyone has skin in the game**.

  ---

  ### **1. Game Overview: "The Boundary Problem"**
  **Core Conflict**: A proposal to build a 6-story mixed-income building (40 units: 20 market-rate, 20 income-restricted at 60% AMI) on a shuttered retail site in a fictional neighborhood, **Oak-Maple Corridor**.  
  **Key Mechanics**:  
  - **Standing Gradient Vote**: Students vote on voting weights by distance *before* knowing their roles.  
  - **Secret Objectives**: Players have hidden incentives (e.g., "Protect property values" or "Reduce regional rent").  
  - **Placement Obligation**: Blockers must assign blocked units to other neighborhoods with limited capacity.  
  - **Role Reshuffle**: Mid-game, roles are randomly swapped to expose self-interest vs. principle.  
  - **Empty Chairs & Shared Dials**: Three chairs represent excluded future residents; dials track regional rent and displacement.  

  **Neighborhood Map** (24 parcels):  
  - **Shuttered Retail Site**: Proposed development parcel (Parcel 1).  
  - **Church + Parking Lot** (Parcel 2).  
  - **Single-Family Homes**: 8 parcels (3–10).  
  - **Small Apartment Buildings**: 3 parcels (11–13, 6 units each).  
  - **Other**: Small businesses (14–18), vacant lots (19–20), park (21).  
  **Distances from Parcel 1**:  
  - 100 ft: Parcels 2–5.  
  - 500 ft: Parcels 6–13.  
  - 1 mile: Parcels 14–21.  
  - Beyond 1 mile: Not on map (assigned to "regional" roles).  

  ---

  ### **2. Materials to Prep (2–3 Hours)**
  **Printables** (1–2 sheets per student):  
  - **Role Cards**: 18 cards with:  
    - **Position**: e.g., "Long-time homeowner (500 ft)", "Renter in apartment building (500 ft)", "Church leader (100 ft)", "Small landlord (1 mile)", "Recent immigrant renter (100 ft)", "Local business owner (1 mile)", "Regional housing advocate (beyond 1 mile)".  
    - **Secret Objective**: e.g., "+3 pts if property value increases", "+2 pts per income-restricted unit built", "–1 pt per new resident within 500 ft".  
  - **Voting Cards**: "Approve" / "Block" cards.  
  - **Objective Key**: For you (to track point allocation).  

  **Shared Visuals**:  
  - **Large Neighborhood Map** (poster-sized): Show parcels, distances, and key sites.  
  - **Standing Gradient Board**: Columns for 100 ft, 500 ft, 1 mile, beyond. Use sticky notes for vote weights.  
  - **Placement Obligation Board**: List 5 fictional city districts (e.g., Downtown, North Hills, Riverside) with "absorption capacity" (e.g., Downtown: 5 units, North Hills: 10, Riverside: 8, etc.). Use tokens (coins/stickers) to fill capacity.  
  - **Shared Dials**: Two paper dials:  
    - **Regional Rent Index** (Start: 100; +2 per blocked unit).  
    - **Displacement Counter** (Start: 0; +1 per blocked unit).  
  - **Empty Chairs**: Three chairs with signs: "Future Resident 1 (Income-restricted)", "Future Resident 2 (Income-restricted)", "Future Resident 3 (Market-rate)".  

  **Other**: Timer, pens, role cards in envelopes.  

  ---

  ### **3. Minute-by-Minute Timeline (90 Minutes Total)**
  #### **Phase 1: Setup (10 min)**  
  - **0:00–0:05**: Briefly introduce the scenario: *"Oak-Maple Corridor has a proposal for a 40-unit building. Today, we simulate the approval process. No lecture—just ground rules."*  
  - **0:05–0:10**: Hand out **Standing Gradient Voting Slips**. Students vote on voting weights for four distances (100 ft, 500 ft, 1 mile, beyond) using 10 points total (e.g., 5 pts for 100 ft, 3 for 500 ft, 2 for 1 mile, 0 beyond). Collect and average votes publicly. Set weights on the **Gradient Board**.  

  #### **Phase 2: Role Assignment & First Vote (25 min)**  
  - **0:10–0:15**: Distribute **Role Cards** (in envelopes so students can’t peek). *Do not open yet.* Assign parcels randomly (e.g., draw numbers).  
  - **0:15–0:20**: Students open envelopes. Review roles/objectives silently. **Key**: Roles include 4 "regional" players (beyond 1 mile) to test the gradient.  
  - **0:20–0:30**: Structured discussion:  
    - Each states position/distance (e.g., *"I’m a homeowner at 500 ft"*).  
    - No debate yet—just facts. Show **empty chairs** and **dials**: *"These represent future residents and regional impacts."*  
  - **0:30–0:35**: Secret ballot vote on project using **weighted votes** (e.g., 100 ft = 5× vote, beyond 1 mile = 0.5×). Tally but don’t reveal.  

  #### **Phase 3: Placement Obligation (20 min)**  
  - **0:35–0:40**: Reveal vote results. If blocked, announce: *"Blockers must assign the 40 units elsewhere."*  
  - **0:40–0:55**: **Blockers propose alternative districts** (e.g., *"Put 10 units in North Hills"*). For each proposal:  
    - Subtract units from that district’s capacity on the **Placement Board**.  
    - If capacity is exceeded, units "spill over" (e.g., North Hills max 10 units; a proposal for 15 units only places 10).  
    - *Rule: If total placed < 40, the project is rejected, and dials adjust.*  
  - **0:55–1:00**: Update **Shared Dials**:  
    - If blocked: Rent Index +20 (cap at 150), Displacement Counter +10.  
    - If approved: Rent Index –10, Displacement Counter –5.  

  #### **Phase 4: Role Reshuffle & Second Vote (15 min)**  
  - **1:00–1:05**: **Redistribute roles randomly** (e.g., collect/envelopes, reshuffle). *Emphasize: "Roles are changing—you are now someone else."*  
  - **1:05–1:10**: Silent review of new roles.  
  - **1:10–1:15**: Repeat secret ballot vote (same weights). No discussion. Tally and reveal.  

  #### **Phase 5: Dials Update (5 min)**  
  - **1:15–1:20**: Update dials again if second vote differs. Briefly show consequences (e.g., *"Rent up 5% regionally"*).  

  ---

  ### **4. Debrief Guide (20 min)**  
  **Start with open reflection** (*5 min*): *"What surprised you? Frustrated you?"* Then map mechanics to theory:  

  - **Standing Gradient Vote** → **Boundary Problem**:  
    *"When you set the weights blind, did you prioritize proximity? Why? How did this predetermine who ‘mattered’? This is the non-neutrality of defining the public—it’s always political."*  
    → *Concept: Democratic boundary problem (Whelan, Dahl).*  

  - **Placement Obligation** → **Authority vs. Complaint**:  
    *"When blockers named alternatives, did they have the right to decide for those districts? Why couldn’t ‘somewhere else’ work? This shows the gap between objecting and having legitimate authority over place."*  
    → *Concept: Territorial sovereignty (Sack); "Not in Any Backyard" (Schively).*  

  - **Empty Chairs** → **Asymmetry of Costs/Benefits**:  
    *"Who spoke for the chairs? The regional dials moved slightly, but was that enough? Concentrated costs (traffic, views) are visible; diffuse benefits (affordable housing) are invisible until they’re yours."*  
    → *Concept: Concentrated vs. diffuse interests (Olson); representation deficit.*  

  - **Role Reshuffle** → **Positionality & Claims**:  
    *"Did your vote change with your role? If so, were you protecting use value (your home), exchange value (investment), or standing (your voice)? Renters became owners, yet their claims are treated differently."*  
    → *Concept: Use vs. exchange value (Logan & Molotch); inhabitant vs. owner claims (Blomley).*  

  **Close** (*2 min*): *"This is why ‘NIMBY’ oversimplifies. Every land-use fight is first a fight over who counts as the public. And no one is disinterested."*  

  ---

  ### **5. Predictable Challenges & Structural Limitations**  
  **What Will Go Wrong**:  
  - Law students will dissect your fictional zoning code. **Response**: *"Our code says standing follows the gradient you set. Save legal arguments for debrief."*  
  - Philosophy students will debate "the public" mid-game. **Response**: *"Note your thoughts; we’ll discuss in debrief."*  
  - A student will treat it as a "win/lose" puzzle. **Response**: *"Points reflect real incentives—use them, but remember this is about process."*  
  - Distant-parcel students disengage. **Solution**: Assign them "regional advocate" roles—their dial movements affect objectives.  
  - Landlord/renter students bring real baggage. **Mitigation**: Use fictional roles (e.g., "small landlord," not "you").  
  - Reshuffle suspicion: If students predict it, they’ll game votes. **Response**: Downplay it pre-reshuffle ("random check").  

  **What the Game Flattens**:  
  - **Time/Repetition**: Real decisions involve years of hearings, fatigue, and attrition. *Say: "We compressed this—imagine doing this monthly for 3 years."*  
  - **Power Asymmetries**: Lawyers, time, and expertise matter. *Say: "In reality, Tuesday-night regulars with resources dominate."*  
  - **State Preemption**: Cities rarely get to redefine "the public." *Say: "State law often fixes standing rules (e.g., California’s SB 828)."*  
  - **Scale**: 40 units can’t fix a housing crisis. *Say: "This is one project—real change requires systemic action."*  
  - **Emotion**: Simulated roles lack lived trauma. *Say: "Real hearings involve fear of loss; we abstracted that."*  

  ---

  ### **6. 40-Minute Version for Neighborhood Association**  
  **Cut**:  
  - **Role Reshuffle** (saves 10 min): It’s powerful but time-intensive.  
  - **Detailed Point Tracking**: Simplify objectives to "+" or "–" incentives.  
  - **Second Vote**: Hold only one vote after discussion.  

  **Keep**:  
  - **Standing Gradient Vote** (5 min): Critical for boundary problem.  
  - **Placement Obligation** (10 min): Best illustrates "somewhere else" fallacy.  
  - **Empty Chairs & Dials** (5 min): Visualize asymmetry.  
  - **Debrief** (10 min): Focus on gradient + placement obligation.  

  **Simplified Timeline**:  
  1. Setup + Gradient Vote (5 min).  
  2. Role Assignment + Discussion (10 min).  
  3. Vote + Placement Obligation (10 min).  
  4. Dials Update + Debrief (10 min).  

  **Why This Works**: The gradient and placement obligation force confrontation with *who decides* and *what alternatives exist*—perfect for skeptical locals.  

  ---

  This design forces students to *experience* the boundary problem, not just theorize it. The reshuffle and empty chairs make abstract concepts visceral. In testing, expect chaos—but that’s where the learning happens. Let me know if you need adjusted maps or role cards!
