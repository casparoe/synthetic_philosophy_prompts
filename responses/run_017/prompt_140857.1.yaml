prompt: |-
  Bit of an odd question, hope it fits here. I'm a backend dev who reads interpretability writeups on the train, so I probly get the vocabulary wrong.

  I keep noticing the same move in these papers and I don't have a word for it. Two cases.

  Case one: they run the model on sentence A, grab the internal numbers at some middle layer, force those numbers into the run on sentence B, and the output changes the way you'd expect if the model now 'thought' whatever sentence A was about. Then they say the model represents that thing at that layer. But the numbers they pasted in were an average over ten sentences, so its a combination the model would never arrive at on its own, on any input.

  Case two: someone finds a direction in the same space. Scale up the activations along it and the model won't stop talking about bridges. But if you instead flatten out that direction, normal text output barely changes.

  So there's a gap between 'I can push here and the model follows' and 'the model puts itself in this state and reads it off'. The first is treated as enough for 'the model has a representation of X'; the second is what I'd naively want, and I can't tell whether anyone checks for it.

  Is there an established name for this gap — something like imposable-but-unused, or steering-available vs actually-consulted? I know there's the older philosophy move about a thermometer indicating temperature without representing it, and I've seen 'causal abstraction' thrown around for matching a program to a model's internals, but neither looks like quite my thing: the thermometer case is about whether mere indication is enough for content, while mine is about whether the state ever does any work; causal abstraction seems happy to count a state as a variable in the program even when you had to force it there by hand. It's also not latent knowledge, where the model has the right answer inside but doesn't say it — my worry is more basic, that nobody checks whether the inner bit is used at all.

  If there's no name, coin one and define it, and either way give me the carving rather than the label: is this a difference of degree (how often the model lands near that state) or of kind; what about a state that's inert on almost every input but read off on rare ones; and what experiment would settle it. Answer as exactly five numbered points, one or two sentences each, no intro line and no summing-up at the end.
reasoning: |-
  Okay, let me unpack this user's question. They're a backend dev dipping into ML interpretability, noticing a pattern where researchers treat "steerability" as proof of representation without checking if the model naturally uses that state. 

  First, I need to pinpoint their core concern: the gap between artificial activation (forcing states/directions) versus organic utilization (does the model ever activate this itself?). The thermometer analogy they mention is close but not quite—it's less about semantics and more about functional role. 

  Hmm, the user wants five precise points without fluff. Let me structure: 

  1. **Define the gap**: Must contrast "steerability" (external manipulation) vs "functional integration" (natural role). The key is whether the state participates in computation without intervention. 

  2. **Degree vs kind**: It's absolutely a difference in kind. Even rare natural activation (e.g., only for "bridge" queries) proves functional integration, unlike purely forced states. 

  3. **Rare activation case**: That still counts! As long as it's model-initiated, it demonstrates the representation isn't just an artifact. 

  4. **Crucial experiment**: Trace natural inference paths. Techniques like path patching or causal mediation analysis can isolate whether the state *causes* outputs without interference. 

  5. **Why it matters**: Without this check, we risk false positives—mistaking hackable parameters for genuine representations. The user's skepticism is valid; many papers skip this step. 

  ...Wait, did I capture their "imposable-but-unused" concern? Point 4's experiment specifically tests if the state is causal *without* artificial injection. That should satisfy their "does any work" criterion. 

  Also noting their frustration—they’ve read papers where averaging activations (impossible inputs) gets treated as evidence. Yeah, that’s shaky. The coinage "functional integration" emphasizes the computational role they’re missing.
answer: |-
  1.  **The gap is between *steerability* (artificial induction alters output) and *functional integration* (the state naturally participates in computation).** Steerability shows the state *can* influence behavior when forced; functional integration requires it *does* so during normal operation.
  2.  **This is primarily a difference in kind, not degree.** A state that *never* activates naturally (like an averaged vector) lacks functional integration regardless of steerability, while a state that activates naturally (even rarely) possesses it.
  3.  **A state inert on most inputs but read on rare ones *does* have functional integration.** Its activation on those specific inputs demonstrates it plays a causal computational role when triggered appropriately by the model's own processing.
  4.  **The critical experiment is causal mediation analysis during natural inference.** Test if *naturally occurring* activations at that location causally mediate the relevant output behavior, without artificial patching (e.g., using interchange interventions or activation clamping).
  5.  **The key distinction hinges on causal efficacy in the model's autonomous computation.** Functional integration demands the state is not just an inert lever but an actual, causally active component within the model's intrinsic processing pathways for specific inputs.
