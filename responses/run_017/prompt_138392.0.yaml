  ## Open Letter to the Commission on Chronological Equity (And My Well-Meaning Colleagues)
  *(Published in the Meridian Ledger, Opinion Section)*

  To the Esteemed Commissioners and the Editors of this Paper,

  Can we *please* stop this madness? The Third Edition of your Chrononeutral Usage Manual has landed on my desk – metaphorically speaking, as my actual desk groans under proofs of tomorrow’s edition – and frankly, it’s the linguistic equivalent of trying to hammer a screw. Personlight? Personbreak? *Holiperson*? Is this progress or a collective nervous breakdown?

  I’ve wrangled words for the Meridian Ledger for thirty years. I know the power of language, the weight of connotation. But this… this feels less like equity and more like vandalism. Take "persondream." A dream, by definition, occurs during sleep, which for the vast majority of sentient beings on this planet – yes, including a significant portion of the Second Watch when they rest – happens during the *night*. What precisely is chrononeutral about slapping "person" on it? It still points squarely at sleep, which points squarely at darkness. All you’ve done is replace one marked term with another, clumsier one. And while we’re at it, try saying "holiperson" three times fast without feeling like a bad street preacher. It’s unpronounceable earnestness.

  Bram – who’s managed the night desk with unflappable competence for two decades, mind you – just shakes his head when I rant. "Marley," he said yesterday, nursing his pre-dawn coffee while I wrestled with the sunrise edition layout, "it's theatre. Expensive, distracting theatre." He’s not unsympathetic to the Second Watch experience. He sees the frustration when essential services assume everyone operates on solar time, the exhaustion of constantly translating "see you tomorrow" when your 'tomorrow' starts at dusk. But his point, which I reluctantly concede has merit beneath its weary pragmatism, is about coordination. "Day," he argues, "isn't *just* cultural bias. It’s pinned to that giant flaming ball in the sky. It’s the rhythm of crops, tides, most animal life, and crucially, the time when most people *are* actually awake and interacting. Having a shared default anchor – even if it doesn't fit everyone perfectly – oils the gears of society. Forcing everyone to say 'personlight'… that’s not removing a burden from the Second Watch, Marley. That’s imposing a tiny cognitive tax on *every* interaction, forever, for a symbolic win. Is the juice worth the squeeze?"

  And then there’s the etymological quicksand the Commission seems determined to march into. Take "day one." Nobody, not the most sun-worshipping farmer, thinks of solar cycles when they say "back on day one" or "we'll figure it out someday." The solar connection is dead, buried under centuries of metaphorical use. So what does the Manual propose? "Back on person one." "We'll figure it out someperson." It’s nonsensical! It actively *obscures* meaning. Bram calls it "linguistic self-sabotage," and I saw genuine consternation on the face of Commissioner Alis Thorne, a dedicated Second Watch advocate, when I pointed this out yesterday. She fumbled, talking about "reclaiming temporal primacy" and "consistent application," but the frustration was real. The rule breaks on the rocks of actual usage. It’s not just stubborn traditionalists like me causing problems; the language itself rebels.

  This isn't about resisting fairness. It’s about resisting *bad language*, clumsy solutions that create more problems than they solve. It’s about understanding that language is an ecosystem, not Lego. You can’t just swap out bricks and expect the structure, let alone the meaning, to hold. The Commission’s well-intentioned bludgeon is shattering nuance and creating awkward, ugly neologisms that draw *more* attention to the very difference they seek to erase. "Personhole cover"? Please. It draws a snigger, not solidarity.

  We need reasonable accommodation, not linguistic revolution. Adjust meeting times. Offer staggered services. Respect the night owl's productive hours. *That* changes lived experience. Mandating "persondream"? That just makes everyone sound slightly ridiculous while the real structural inequities persist. The Second Watch deserve better than this performative glossary. They deserve practical respect, not this forced, fumbling vocabulary that trips up the tongue and the mind. Let’s focus on changing actions, not just words, and leave the language to evolve organically, as it always has, towards greater inclusivity without sacrificing sense.

  Sincerely (and Sleeplessly),

  **Marley Dane**
  Copy Chief, The Meridian Ledger

  ***

  *(Three hours before dawn, Marley stares at the flickering text on his screen, the empty office humming with the silence unique to the deepest night. He’d drafted the letter hours ago, fueled by righteous irritation. Now, fatigue scrapes his nerves raw. He rereads his final line: "Sincerely (and Sleeplessly)." A wince. Too revealing? Bram's words echo: "symbolic win... cognitive tax." He thinks of decades of scheduling his life around an alien sun, the easy camouflage of "early meeting!" masking a soul that sang at midnight, the small, constant effort of translating his internal clock into diurnal idiom. He’d made his peace. It cost him little, he told himself. Just the constant, low-grade friction of existing slightly out of phase.*

  *He highlights "Sleeplessly." Deletes it. Types "Sincerely." Stops. Deletes "Sincerely." The cursor blinks, a tiny, persistent heartbeat in the gloom. The Commission’s absurd words float in his mind: *personlight, personbreak, someperson*. Grotesque. Awkward. Pointed. They pointed relentlessly at the thing he’d spent a lifetime politely obscuring. He thought of Alis Thorne’s frustrated face. They were failing, yes. Crudely. But they were pointing. Always pointing. At the unmarked assumption he breathed like air.*

  *His fingers hovered. The quiet pressed in, thick and familiar, his true native element. He typed, the keys loud in the stillness: "I am not what you think," then backspaced violently. Too much. Far too much. He took a steadying breath, the cool night air flowing into lungs that always felt more alive in these hours. He wrote, finally, the phrase settling like an unavoidable truth:*

  *"Written in the still heart of the person,"*

  *He paused, the absurdity of "person" – intended as neutral, yet screaming its solar origin – hitting him anew. But also... something else. A tiny, defiant spark. He finished the line, the words flowing with an ease born of long-suppressed authenticity:*

  *"Written in the still heart of the person,**
  **Marley Dane"**

  *He saved the file. Sent it. The Ledger’s automatic timestamp glowed: 3:47 AM. Outside the vast window, Meridian slept, bathed in the soft, electric glow of streetlights – *personlights*, now, he supposed. The Commission’s clumsy, unpronounceable, etymologically butchered words suddenly felt less like an imposition and more like a mirror, cracked and distorting, but reflecting something he could no longer unsee in the quiet dark. The cost, it turned out, wasn't nothing. It was the quiet erosion of self, masked by fluency in a daylight world. Their ridiculous manual hadn’t changed the language yet, but here, at three forty-seven in the *person*, it had just changed him.)*
