  The characters' development is crucial. Neve should gain some appreciation for legal precision's protective function, while Halvard should confront how the current definition enables calculated atrocity. Their exchange about the scoring system becomes the pivot where both reveal their deeper concerns: Halvard about law's need for bright lines, Neve about how binaries distort perception.

  For natural flow, I'll start with Halvard challenging Neve on intent in the Kelthi case, escalate to the denominator problem, then introduce Halvard's compromise offer. When Neve rejects it, the scoring proposal emerges as her counter-suggestion. The ending leaves them at an impasse but with shifted perspectives - Halvard acknowledging unspoken state strategies, Neve conceding some value in legal thresholds.

