prompt: |-
  I've been chewing on the Born rule problem in Everett for a couple of months now — came in via the sequences years ago where it all sounded basically settled, then read one pop-sci Everett book, then made the mistake of trying to actually state the argument out loud to my reading group — and I definately can't tell anymore whether I have a genuine objection or whether I'm just too slow to follow the proof. So I want to try something structured: draft me the joint statement that would come out of an adversarial collaboration between two people who have both already accepted Everett (unitary dynamics only, no collapse, branching as an emergent decoherence-y thing rather than something in the fundamental formalism, wavefunction as the whole ontology) but who disagree about where the Born rule comes from. Call one side Team Derivation: probability is not an extra posit, it falls out of the formalism plus constraints on what counts as rational preference for an agent who knows she is about to branch — the Deutsch/Wallace-ish decision-theoretic program. Call the other Team Postulate: those arguments are circular, amplitude-squared is already smuggled in somewhere in the axioms, and what an Everettian really needs is an additional posit about self-locating uncertainty or a measure of existence over branches; and if you want to get by on naive branch counting instead, you owe an account of why counting isn't the honest default and amplitude-weighting is the thing that stands in need of justification. No bibliography, no citations, no "as X argues in chapter 4" — I can't check any of it and I don't care who got there first. Give me the arguments, and state each side strongly enough that an actual proponent of it would sign the document.

  What I want, concretely: first a numbered section of agreed claims — the things both of them can sign that a Bohmian or a collapse guy couldn't (that branching is only approximately defined and depends on a decoherence basis and a coarse-graining, that the Born rule is empirically adequate and no violation has ever been seen, that no one branch is "the" outcome, and whatever they actually agree about what a successful derivation would have to deliver — a credence? a caring measure? a typicality claim? an account of confirmation?), then a disagreements table with the issue stated neutrally in one column and each side's own preferred formulation in its own column, phrased so that side would accept it as a fair statement of what it holds. Then a cruxes section: the sub-questions such that settling one would move at least one of them, and for each crux a concrete case or argument both would accept in advance as bearing on it, with each side's prediction written down before the answer — I want to be able to tell afterwards who got surprised. Please also mark explicitly which parts of the fight you think are merely verbal. My guess is that some of "probability has to mean objective chance / long-run frequency" versus "probability is just what a rational agent should bet or care at" is a shouting match about a word, but I also suspect there's a real disagreement hiding underneath about whether you need a separate typicality assumption to get from branch weights to "I should expect to be in a big branch," so don't dissolve everything into semantics — and don't leave me non-committal about which cruxes are load-bearing.

  Three cases I want used, because they're the ones that actually make my head hurt. (1) The fan-out: put the subject in a superposition with amplitude sqrt(0.999) on one branch and sqrt(0.001) on the other, no death involved so nobody gets distracted by quantum-immortality stuff, and then in the low-amplitude branch have her scanned and instantiated as a thousand near-identical copies in causally separated rooms, all sharing her memories up to the split, which then go on to have slightly different experiences. Do her betting odds or her caring measure shift toward the low-amplitude branch because there are now a thousand successor people there? Does your answer change if the copies are perfectly identical versus distinguishable, and does state-supervenience-style reasoning even reach the case, given that the quantum state with a thousand copies isn't the same state as the one with a single one? (2) A measurement of a continuous variable with a Gaussian amplitude spread, where "how many branches are there" depends on an arbitrary coarse-graining: does that kill branch counting outright, or does Team Postulate have a continuous notion of measure of existence that survives it? (3) A case I invented, call it quantum Sleeping Beauty: a setup where the subject is branched, woken a variable number of times across branches with variable amplitudes, and asked for her credence on some proposition — what should she say on each view, and does the case actually discriminate between the two teams or do both output the same number for totally different reasons? Saying "it doesn't discriminate, here's why" is a perfectly good answer and I'd rather have that than a fake tension. Finally: is there anything at all both sides agree would move the debate — a derivation whose axioms transparently never mention amplitude, a no-go theorem, an experimental Born-rule violation at some scale — and what would each side count as evidence against itself?

  Aim for something like 1200 words, tables are very welcome, and if one of my three cases is confused or ill-posed please flag it in a short note at the end rather than quietly fixing it. My housemate is a Bohmian and reads these over my shoulder looking for excuses to heckle, so I'd like to know where I went wrong.
