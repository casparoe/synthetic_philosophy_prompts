  The cruxes need concrete cases with predictions. For fan-out: does multiplying branches in the low-amplitude component shift betting odds? Derivation says no because amplitudes don't change; Postulate might say yes if they're branch-counters, but their sophisticated versions might use amplitude-weighted measure. For continuous variables: Derivation handles it via amplitude density; Postulate needs a continuous measure. Quantum Sleeping Beauty: Derivation would weight by amplitude times awakenings; Postulate might have similar math but different justification.

