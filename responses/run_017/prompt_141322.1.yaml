answer: |-
  ## Research Proposal: Dissecting Access Profiles: Revision-Sensitivity as a Novel Marker for Graded Consciousness

  **Principal Investigator:** [Your Name], Department of Philosophy  
  **Collaborators:** [Cognitive Neuroscience Group Lead], Cognitive Neuroscience Group  
  **Funding Requested:** [Amount] for 9-month Seed Grant  
  **Project Duration:** 9 Months  

  **1. Core Research Question:**  
  Does "revision-sensitivity" – the demonstrated capacity of a perceptual content to drive explicit error detection and behavioral correction *prior to or independent of* overt report – dissociate empirically from both (a) standard reportability and (b) implicit behavioral influence (priming), and if so, does this dissociation challenge the all-or-nothing threshold model of access central to Global Workspace Theory (GWT)?

  **2. Background & Gap Identification:**  
  The "overflow" debate (phenomenal consciousness vs. cognitive access) hinges on whether unreportable stimuli are nonetheless conscious. Standard paradigms (e.g., Sperling, change blindness, masked priming) primarily contrast *report* with *priming/influence*. This binary framing is inadequate:

  *   **The Problem with Report:** Failure to report is ambiguous. It can stem from attentional lapses, WM encoding failures, metacognitive uncertainty, response criteria, or task-set confusion – *not* necessarily absence of consciousness. Treating "access" as a single threshold (reportable/not) obscures these distinct bottlenecks.
  *   **The Problem with Priming:** Priming demonstrates *some* downstream influence but is often "cognitively impenetrable" and blind. A stimulus influencing a forced-choice guess *without* enabling the subject to recognize or correct an error seems insufficient for "consciousness *for* the subject."
  *   **The Global Workspace Stalemate:** GWT posits consciousness requires global broadcast, marked by all-or-nothing "ignition" signatures. Overflow findings are often dismissed as failures of access *just below* this threshold. Conversely, evidence for partial broadcast (e.g., robust priming without reportability) forces GWT into an uncomfortable dilemma: either (1) maintain a strict threshold (risking circularity: "it wasn't conscious because it wasn't broadcast" defined solely by report failure), or (2) accept graded broadcast/consciousness (requiring an explanation of *degrees* of consciousness currently lacking in GWT).

  **3. Conceptual Innovation & Hypothesis:**  
  We propose moving beyond the report-vs-priming binary by conceptualizing access as a *profile* across distinct "consumer systems" (e.g., motor control, semantic association, metacognitive monitoring, verbal report). We introduce **revision-sensitivity** as a specific, testable marker targeting a critical consumer system: the capacity for conscious error monitoring and behavioral correction.

  *   **Hypothesis:** Stimuli that are phenomenally conscious will exhibit revision-sensitivity *even when* full reportability fails. Specifically, we predict dissociations where stimuli:
      *   **Show Priming but Lack Reportability & Revision-Sensitivity:** (Consistent with unconscious processing).
      *   **Show Priming & Revision-Sensitivity but Lack Full Reportability:** (Potential evidence for "overflow" or graded access).
      *   **Show Reportability & Revision-Sensitivity:** (Standard conscious access).
      *   *(A dissociation where Revision-Sensitivity fails while Reportability succeeds is theoretically unexpected but empirically crucial to test).*
  *   **Challenge to GWT:** Finding a reliable dissociation between revision-sensitivity and reportability (or between revision-sensitivity and other markers of "ignition") would demonstrate that broadcast is not monolithic. This supports a graded access profile view and directly challenges the all-or-nothing threshold central to standard GWT interpretations, forcing a refinement: either defining the threshold more precisely (non-circularly) or embracing graded consciousness.

  **4. Methodology & Work Plan (9 Months):**  
  *Leveraging well-established paradigms (e.g., masked priming, change blindness, inattentional blindness) adapted to incorporate robust revision-sensitivity probes.*

  *   **Months 1-2: Literature Synthesis & Task Design (PI + RA):**  
      *   Deep dive into existing paradigms demonstrating report-priming dissociations (masked priming, change blindness with partial report, inattentional blindness with implicit measures).
      *   Design 2-3 core behavioral tasks integrating revision-sensitivity probes. *Example (Change Blindness):* Subjects detect scene changes. On critical trials, an initial incorrect response is elicited (e.g., via subtle misleading cue or time pressure). **Revision Probe:** Can subjects spontaneously *correct* their initial wrong answer *before feedback* when the unreported change was present vs. absent? Measure correction rates, confidence, and reaction times.
  *   **Months 3-5: Task Refinement & Pilot Testing (PI + RA + Cognitive Neuro Collaborators):**  
      *   Iterative refinement of tasks based on feasibility checks & small pilot runs (n=5-10).
      *   Establish baseline parameters: masking durations, change salience, time pressure levels needed to elicit report failures while preserving priming/revision potential.
      *   Develop precise measures: Priming (e.g., forced-choice accuracy above chance, RT effects), Reportability (e.g., free report accuracy, confidence ratings), Revision-Sensitivity (e.g., % spontaneous corrections, correction RT, confidence in correction).
  *   **Months 6-8: Main Behavioral Pilot Study (RA primary, PI oversight):**  
      *   **Participants:** N=60-80 healthy undergraduates (feasible with part-time RA).
      *   **Procedure:** Each participant completes all 2-3 core tasks in counterbalanced order. Multiple trials per condition per task.
      *   **Data Collection:** Behavioral responses (accuracy, RT), confidence ratings (for report and correction), spontaneous correction instances.
  *   **Month 9: Data Analysis & Initial Synthesis (PI + RA + Collaborators):**  
      *   **Key Analyses:**  
          1.  Identify trials with clear Report Failure (e.g., incorrect free report + low confidence).
          2.  Within Report Failure trials, test for Priming (is forced-choice accuracy > chance?).
          3.  Crucially, within Report Failure trials *with* Priming, test for Revision-Sensitivity (are spontaneous corrections above baseline rates? Are corrections faster/more confident when priming stimulus was present?).
          4.  Correlate Revision-Sensitivity measures with Reportability and Priming strength across all trials.
      *   **Deliverable:** Comprehensive analysis report testing the predicted dissociations.

  **5. Expected Outcomes & Interpretations:**
  *   **Positive Result:** A reliable dissociation where a significant subset of Report Failure trials show *both* Priming *and* Revision-Sensitivity. *Interpretation:* Strong evidence for a distinct access profile where content is available for error-correction but not full report. Challenges the GWT threshold model and supports the graded access profile framework.
  *   **Negative Result 1:** Revision-Sensitivity is always perfectly correlated with Reportability, even when Priming dissociates. *Interpretation:* Revision-Sensitivity may not be a distinct marker; it collapses back into reportability or a very high report threshold. Suggests the "profile" adds little beyond existing distinctions. Supports GWT's reliance on a report-like threshold.
  *   **Negative Result 2:** Revision-Sensitivity is never observed in the absence of Reportability, even when Priming is strong. *Interpretation:* The capacity for spontaneous error correction requires the same level of access as full report. Revision-Sensitivity isn't a useful intermediate marker.
  *   **Inconclusive Result:** Effects are present but weak or inconsistent across tasks. *Interpretation:* Highlights the complexity of measuring revision-sensitivity cleanly. Points to specific task parameters or cognitive demands needing refinement in future work.

  **6. What This Pilot Can and Cannot Establish:**
  *   **CAN:**  
      *   Empirically test for dissociations between reportability, priming, and revision-sensitivity *behaviorally*.
      *   Provide proof-of-concept that revision-sensitivity can be operationalized and measured.
      *   Generate data showing whether such dissociations exist, their prevalence, and their relationship.
      *   Falsify the specific hypothesis that revision-sensitivity consistently dissociates from reportability under conditions of priming.
      *   Challenge or support the empirical plausibility of the GWT dilemma regarding partial broadcast.
  *   **CANNOT:**  
      *   **Prove the existence of phenomenal consciousness** or directly measure it. We infer its likely presence based on patterns of access.
      *   Establish the neural correlates of revision-sensitivity (no scanning).
      *   Provide a definitive, large-scale test of GWT neural predictions (no EEG/fMRI).
      *   Explore revision-sensitivity in clinical populations or exotic states.

  **7. Risk Assessment: Points of Failure (Explicitly Stated):**
  This project fails to achieve its core conceptual goals if:
  1.  **Collapse into Reportability:** Revision-sensitivity proves empirically indistinguishable from standard reportability measures (e.g., corrections only occur when subjects could have just reported correctly initially). This would invalidate its proposed role as a distinct marker within an access profile.
  2.  **Unfalsifiable/Unmeasurable:** We cannot design tasks where revision-sensitivity is reliably elicited and measured *independently* of general task performance or explicit report. If revision probes are always confounded with demand characteristics or simply reflect general uncertainty, the construct lacks empirical traction.
  3.  **No Meaningful Dissociation:** Revision-sensitivity never dissociates from priming in the predicted ways (e.g., it only occurs when priming is very strong, or never occurs without reportability). This would fail to demonstrate the value of the profile approach over simpler models.
  4.  **Pilot Underpowered:** While N=60-80 is standard for behavioral pilots, effect sizes for the crucial dissociation (revision *without* report *with* priming) might be smaller than anticipated, leading to inconclusive results despite a sound design. This is a risk inherent to the seed grant scale but will be mitigated by iterative refinement (Months 3-5) to maximize effect detectability.

  **8. Significance:**  
  This project moves the overflow debate beyond the entrenched report-versus-priming stalemate by introducing a theoretically motivated, empirically testable third marker – revision-sensitivity – probing a critical "consumer system" (metacognitive error correction). Successfully demonstrating its dissociation would:
  *   Provide concrete evidence for a *graded access profile* view of consciousness.
  *   Force a significant refinement or reinterpretation of Global Workspace Theory regarding its threshold commitment.
  *   Offer a novel behavioral paradigm for investigating partial consciousness and the functional architecture of access.
  *   Lay the essential empirical groundwork for future neuroimaging studies targeting the neural basis of revision-sensitivity and its relationship to global broadcast signatures.

  Even a negative result clarifying that revision-sensitivity collapses into reportability or is unmeasurable would advance the field by sharpening the conceptual tools and empirical requirements for studying access profiles. This seed grant aims to cut through theoretical impasse with a focused, falsifiable empirical question rooted in robust behavioral methods.
