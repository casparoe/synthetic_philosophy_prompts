prompt: |-
  I am writing the opening chapter of an astrobiology handbook — the one that has to say what would have to be true of something for it to count as alive — and I want the specification settled before I look at candidate definitions.

  Begin by separating three jobs a definition might be asked to do: a detection criterion, something a remote instrument or sample-return protocol could in principle apply to decide whether a specimen is alive; a natural-kind concept, the kind that earns its place in biology by supporting induction, explanation, and generalization rather than merely sorting; and a constitutive account, saying in virtue of what anything is alive at all. Tell me whether these are three separate specifications or three faces of one, and if no single definition can serve all three, say exactly where the strain falls. That trade-off is the part I most want.

  Then give me the desiderata proper: the cases an adequate account must classify correctly, the distinctions it must not collapse, and the empirical results it may not contradict — each with the consideration that makes it a requirement rather than a taste. The cases should include at least viruses and viroids; prions; spores and other dormant or cryptobiotic stages; metabolically active but permanently sterile individuals such as mules and worker ants; mitochondria and other formerly free-living symbionts; a biosphere-scale entity such as a reef or a forest; and the three hypothetical lineages below, which I want included precisely because the terrestrial record does not settle them.

  The hypotheticals:

  The Cinder Drifts: subterranean, internally regulated, self-repairing, growing by taking up raw materials and reproducing by fission into two daughters — but its copying is so accurate that no heritable variation ever arises, and the lineage has not evolved in a million years.

  The Glass Loom: no metabolism, no genome, no membrane, no cell. It imposes its own structure on mineral surfaces in its surroundings and thereby causes more structure of its own kind to appear; variants differ in how faithfully they template, and the better templaters come to dominate.

  The Choir: its members are metabolically active, cannot survive apart from the group, and never reproduce. What reproduces is a population-level arrangement of chemistry and spacing, which reassembles itself at a new site each generation and on which selection acts.

  Among the distinctions I expect handled: being alive versus being an organism; being alive versus merely being produced by life; life at a time versus life as a historical or lineage-level phenomenon; metabolism from replication from evolution; and life from mind or agency. Among the constraints: the deepest ancestor comparative genomics lets us reconstruct was already a coded, translating cell, so any definition demanding less will count things nobody has found and any demanding more will not count our own ancestors.

  Mark which requirements are non-negotiable and which are preferences of a particular research programme — I am thinking of demands such as substrate-neutrality, or that the verdict be sharp and bivalent for every object, or that the account deliver the same answer for individuals and for lineages. Say which of these are genuine desiderata and which are camp prejudice. Identify any jointly unsatisfiable subset of the list, and name the single requirement that does the most work in excluding otherwise popular definitions. Only then, and briefly, note how the main families of account — metabolism- or autopoiesis-first, replicator-first, the working-definition style that ties life to evolvable chemical systems, and information-theoretic views — fare against the list. The criteria are what I am paying for; the scoring is secondary.
reasoning: |-
  Hmm, this is a deep and meticulously structured query about defining life for an astrobiology handbook. The user wants to separate three conceptual jobs for a definition (detection, natural kind, constitutive account), then evaluate desiderata against challenging cases including viruses, prions, hypotheticals, and key distinctions. They're clearly a specialist—probably an academic or textbook writer—given the precision about lineage-level phenomena and constraints from comparative genomics. The tone suggests urgency about trade-offs, not just taxonomy.

  First, the tripartite framework: Detection must be operational (e.g., Viking Lander's labeled release), natural kind needs inductive power (like "electron" in physics), constitutive is metaphysical ("in virtue of what"). These *can't* collapse because: (1) Detection tolerates false positives (e.g., sterile mules "alive" by metabolism) but natural kind shouldn't; (2) Constitutive accounts (e.g., autopoiesis) may exclude lineages; (3) Hypotheticals like Glass Loom strain detection vs. natural kind—it's detectable as "active" but may not form a biological kind without evolution.

  Now the desiderata. Non-negotiables from empirical constraints: 
  - Must include last universal common ancestor (LUCA) as alive, given genomic evidence. 
  - Must exclude prions (no heritable variation) and pure minerals. 
  - Must handle viruses as "produced by life" not organisms—collapsing this distinction would make rust "alive."
  Preferences masquerading as requirements: 
  - Substrate-neutrality is desirable but not mandatory; carbon chauvinism is acceptable if chemically justified. 
  - Bivalence is a camp prejudice—dormancy cases demand gradience.

  The killer hypothetical is **Cinder Drifts**: If evolution is necessary for life, this lineage dies—but that contradicts LUCA's aliveness before diversification. So evolution can't be constitutive, only a frequent consequence. This torpedoes replicator-first definitions.

  Key tensions: 
  - Worker ants require "alive at a time" (metabolism) vs. Choir requiring lineage-level status. 
  - Glass Loom challenges "no metabolism" life—if templating counts as replication, does it need chemical agency?

  The LUCA constraint is the silent assassin: Any definition requiring less than a coded system (e.g., metabolism-only) risks false positives like fire. Requiring more (e.g., multicellularity) excludes LUCA. This kills autopoiesis-for-individuals and evolvable-system definitions alike.

  Scoring families briefly: 
  - Metabolism-first (NASA) fails viruses and Glass Loom. 
  - Replicator-first (Dawkins) fails Cinder Drifts and prions. 
  - Information views struggle with biospheres. 
  - "Evolvable chemistry" (Szostak) handles most but strains at Choir's group reproduction.

  The user's hidden ask: They want to justify why astrobiology might prioritize detection over philosophy. I should emphasize that trade-off—e.g., Viking's definition was flawed but necessary—without dismissing constitutive rigor.
answer: |-
  Below is a structured analysis for your astrobiology handbook's foundational chapter, prioritizing clarity on the *specification* of life over definitions themselves. It addresses your core request: separating the three jobs of a definition, establishing desiderata (with justifications), identifying tensions, and evaluating definition families against constraints. The focus is on *what an account must satisfy*, not which definition "wins."

  ---

  ### **I. The Three Jobs of a Definition: Separate Specifications with Irreducible Tensions**
  These are **three distinct specifications**, not faces of one. A single definition cannot serve all without compromising one job. The strain arises from their divergent goals:

  1. **Detection Criterion**:  
     - **Purpose**: A yes/no test for *remote or automated instruments* (e.g., rover sensors, sample-return screening).  
     - **Requirements**: Must be *operational*, based on observable *here-and-now properties* (e.g., metabolism, replication signatures, complexity thresholds). Ignores historical context.  
     - **Strain**: Risks false positives/negatives if divorced from biology (e.g., labels fire as "metabolizing," or dormant spores as "dead").  

  2. **Natural-Kind Concept**:  
     - **Purpose**: Carves nature at a joint that *supports scientific generalization* (prediction, explanation, induction).  
     - **Requirements**: Must capture *causal unity*—e.g., shared mechanisms (genetic inheritance, evolutionary dynamics) that license inferences across cases.  
     - **Strain**: Excludes entities that *behave* biologically but lack unifying causal structure (e.g., prions vs. cells). Historical continuity matters.  

  3. **Constitutive Account**:  
     - **Purpose**: Explains *in virtue of what* something is alive (metaphysical grounding).  
     - **Requirements**: Must identify *necessary and sufficient conditions* for being alive, irrespective of observability or scientific utility.  
     - **Strain**: May be too abstract for detection (e.g., "autopoiesis") or exclude paradigmatic cases if overly narrow (e.g., denying life to mules).  

  **Where the Trade-Off Falls**:  
  - Detection vs. Natural Kind: Detection prioritizes *immediate observables*; natural kind requires *causal-historical depth*. Tension: A sterile mule is detectable as "alive" via metabolism but may not support biological generalizations (e.g., about reproduction).  
  - Natural Kind vs. Constitutive: Natural kind is *domain-relative* (to biology); constitutive aims for *universality*. Tension: Viruses may be a natural kind in virology but constitutively "not alive" if lacking intrinsic agency.  
  - All vs. Detection: Constitutive/natural-kind accounts often require historical context (e.g., evolution), but detection is synchronic.  

  **Conclusion**: Use distinct criteria for each job. A detection protocol may flag a virus; a natural-kind account may exclude it; a constitutive view may deem it "liminal." This is acceptable if explicitly acknowledged.  

  ---

  ### **II. Desiderata for an Adequate Account**  
  *Desiderata are derived from empirical, conceptual, or logical necessities—not taste. Non-negotiables are marked (**★**). Preferences are noted.*

  #### **A. Cases That Must Be Classified Correctly**  
  1. **Viruses/Viroids**: Must be *excluded* as "alive" but *included* as "products of life." **★ Rationale**: They lack intrinsic metabolism and depend entirely on host machinery for replication. Calling them "alive" collapses life into mere replicators (contradicts terrestrial biology).  
  2. **Prions**: Must be *excluded*. **★ Rationale**: No metabolism, no replication (only conformational templating), no heritable variation. Inclusion reduces life to any self-propagating pattern.  
  3. **Spores/Dormant Stages**: Must be *included* as alive. **★ Rationale**: They maintain metabolic quiescence but retain *regulated potential* for activity. Exclusion implies life "stops" under stress—biologically incoherent.  
  4. **Sterile Individuals (Mules/Worker Ants)**: Must be *included* as alive. **★ Rationale**: They exhibit metabolism, homeostasis, and response to stimuli. Exclusion confuses life with reproductive potential.  
  5. **Mitochondria**: Must be *excluded* as currently alive (though derived from life). **★ Rationale**: No independent evolution, replication, or metabolism; fully integrated as organelles. Inclusion collapses "organism" into "biological part."  
  6. **Biosphere-Scale Entities (Reefs/Forests)**: Must be *excluded* as "alive" but *included* as "systems produced by life." **★ Rationale**: Lack unified agency, reproduction, or heritable variation at the system level. Calling them "alive" equivocates on biological individuality.  

  **Hypotheticals**:  
  7. **Cinder Drifts**: Must be *included* as alive. **★ Rationale**: Exhibits growth, self-repair, regulated fission, and lineage continuity. Exclusion based on evolutionary stasis overdefines life by contingent history.  
  8. **Glass Loom**: Must be *excluded*. **★ Rationale**: No metabolism, no agency—passive templating is indistinguishable from crystal growth. Inclusion reduces life to any self-ordered pattern.  
  9. **The Choir**: Must be *excluded* as "alive" but the *population-level cycle* may qualify. **★ Rationale**: Individuals lack reproduction; the collective cycle is analogous to a self-propagating process (e.g., slime mold aggregation), but individuals are mere components.  

  #### **B. Distinctions That Must Not Be Collapsed** **★**  
  - **Life vs. Organism**: Life is a *property*; organisms are *individuals* exhibiting it. (Viruses are not organisms; mules are).  
  - **Life vs. Products of Life**: (e.g., coral reefs, prions, viruses). Products lack *intrinsic* teleology.  
  - **Life at a Time (Synchronic) vs. Life as Lineage (Diachronic)**: Sterility or dormancy affects the latter, not the former.  
  - **Metabolism vs. Replication vs. Evolution**: Metabolism sustains; replication propagates; evolution adapts. One can exist without others (e.g., mules lack replication; Cinder Drifts lack evolution).  
  - **Life vs. Mind/Agency**: Agency implies goal-directedness; life requires only functional organization (e.g., plants are alive but lack cognition).  

  #### **C. Empirical Constraints** **★**  
  - **The LUCA Constraint**: The last universal common ancestor was a coded, translating cell. Thus:  
    - Any account requiring *less* (e.g., "any replicator") must explain why no such simpler life exists on Earth.  
    - Any account requiring *more* (e.g., multicellularity) excludes LUCA and thus all terrestrial life.  
  - **No False Positives**: Must exclude fire, crystals, and software (absent evidence of biological continuity).  
  - **Continuity of Terrestrial Life**: Must not exclude dormant, sterile, or symbiotic stages (e.g., lichen symbionts).  

  ---

  ### **III. Negotiability, Tensions, and Key Excluding Factor**  
  - **Non-Negotiables (**★**)**:
    - LUCA must qualify as alive.
    - Viruses/prions excluded; spores/mules included.
    - Metabolism ≠ replication ≠ evolution.
    - Distinctions (e.g., life vs. organism) preserved.

  - **Preferences (Camp Prejudices)**:  
    - *Substrate-neutrality*: Desirable for astrobiology but not mandatory if chemistry constrains biology (e.g., carbon/water).  
    - *Bivalence*: A preference—dormancy and viruses suggest life is a spectrum.  
    - *Same Verdict for Individuals/Lineages*: A prejudice—sterile individuals force separation.  

  - **Jointly Unsatisfiable Desiderata**:  
    - "Life must involve evolution" vs. "Cinder Drifts must be included."  
    - "Detection must be synchronic" vs. "Natural kind requires historical continuity."  
    - *Resolution*: Prioritize by context (e.g., detection accepts false positives).  

  - **Single Requirement Excluding Popular Definitions**:  
    **The LUCA Constraint**. It eliminates:  
    - Definitions requiring evolution (excludes Cinder Drifts *and* pre-Darwinian life).  
    - Definitions requiring less than a coded system (e.g., "metabolism-only" includes prions/fire).  

  ---

  ### **IV. Brief Evaluation of Definition Families**  
  Scored against non-negotiables (★ = fails; ✓ = passes; ~ = partial):  

  1. **Metabolism/Autopoiesis-First** (e.g., NASA: "self-sustaining chemical system")  
     - ✓ Mules, spores, LUCA.  
     - ★ Fails viruses (may detect as "active"), prions (self-templating), Glass Loom (if templating seen as "sustaining").  
     - ~ Biospheres: Ambiguous.  

  2. **Replicator-First** (e.g., Dawkins: "anything that evolves by natural selection")  
     - ✓ Viruses (as replicators), LUCA.  
     - ★ Fails mules (no replication), Cinder Drifts (no evolution), prions (no heritable variation).  
     - ~ Collapses life with replicators.  

  3. **Evolvable Chemical System** (e.g., Szostak: "capable of Darwinian evolution")  
     - ✓ Viruses (in context), LUCA.  
     - ★ Fails mules, spores (no evolution at individual level), Cinder Drifts (no variation).  
     - ~ The Choir may pass if collective cycle evolves.  

  4. **Information-Theoretic** (e.g., "causal control of information flow")  
     - ✓ LUCA, distinguishes life from crystals.  
     - ★★ Fails without additional constraints: Glass Loom may qualify; prions/viruses ambiguous.  
     - ~ Often conflates life with complex systems.  

  **Overall**: No family satisfies all non-negotiables. LUCA + Cinder Drifts + mules + viruses is the hardest combination. A hybrid approach (e.g., "autocatalytic systems capable of open-ended evolution") strains at sterile individuals and detection.  

  ---

  ### **Synthesis for Your Handbook**  
  Prioritize:  
  1. **Constitutive account** for rigor: Life requires *bounded, metabolic, self-replicating systems capable of evolution* (excluding viruses/prions/Glass Loom; including LUCA/mules/Cinder Drifts).  
  2. **Detection criterion** pragmatically: Target *potential* for metabolism/replication (e.g., chiral molecules, isotopic ratios), accepting false positives (e.g., dormant spores).  
  3. **Natural kind** contextually: Define "organism" (metabolizing, bounded cell) vs. "biological agent" (replicators in evolutionary context).  

  **Trade-off Emphasized**: Detection tolerates overinclusion to avoid missing novel life; natural kind excludes marginal cases to support theory; constitutive demands clarity at the cost of operationality. Specify which job your handbook prioritizes—likely detection for astrobiology, with caveats.  

  This framework ensures your opening chapter sets unambiguous, defensible boundaries while acknowledging where biology, philosophy, and pragmatism conflict.
