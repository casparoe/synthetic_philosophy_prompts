  We'll say:

  - procedural: often fails d1 (endogeneity), d5 (feedback), d9 (future), and d10 (temporal consistency) because they are static and focused on current inputs. Also might fail d2 if cost-sensitive, d3 and d4 if they rely on explicit input.
  - substantive: fails d1, d5, d9, d10 (same reasons) and also d6 (if the substantive target embeds a particular framing) and d7 (if it defers to the target's interpreters).
  - hybrid: might mitigate some, but still challenges with d9 and d10.

  We'll list:

  knockout_summary: {
    "procedural": ["d1", "d5", "d9", "d10", "d2? (if cost-based)"],
