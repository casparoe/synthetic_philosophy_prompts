prompt: |-
  Hey — I'm on my university's Assessment Review Committee (we're the group that has to sign off on anything that changes how final exams get graded), and there's a proposal in front of us that I have to write the decision memo for before Friday, so I'd like you to draft it for me.

  The setup: the CS department wants a two-semester pilot of "debate grading" for essay exams in big courses where the graders don't know the material. For each paper, two AI systems get the exam question, the rubric, and the student's answer; one is assigned to argue for a high score and one for a low one, they see each other's turns and can cross-examine, and then a human grader who hasn't read the course picks which argument is better, and that verdict becomes the grade. The pitch is that this lets us keep essay exams without staffing enough TAs who actually know the subject. A few things came out in their validation runs and in our discussion that I think are the crux. (1) Judges' verdicts matched the instructor's own grade something like 80% of the time on items where the two debaters disagreed *a lot*, but only barely-above-chance between adjacent grade bands on items where they disagreed *subtly* — both fairly persuasive, differing only on how to weight the rubric. One of our members reads that as: the method only works where the answer was already easy to see, so it isn't really buying us supervision of the hard judgments; the CS folks respond by saying they'll route only high-disagreement items to debate, at which point it's unclear it saves any TA time at all. (2) When they let judges ask free-form follow-up questions, accuracy went up on factual disputes but *down* on rubric-weighting disputes; their guess is that follow-ups let a debater reframe the rubric instead of resolving the disagreement, and their proposed fix is to restrict follow-ups to a fixed menu of question templates. (3) Both debaters are sampled from the same base model with the same preference-tuning, and the vendor says that's harmless because the adversarial setup decorrelates them, while our stats person says shared training means shared blind spots, so the pair will systematically fail to raise the one objection a domain expert would have raised. (4) There's an incentive wrinkle: the judges in the pilot are the same TAs whose hours the pilot would cut, and they know it. And (5), the status quo is not a clean baseline — in our current process the same paper graded by two different TAs lands in the same band maybe two-thirds of the time and instructors almost never audit it.

  What I need is a memo of roughly 700–900 words addressed to the committee: it should come down on approve, reject, or approve-with-conditions, with an actual timeline and conditions the CS department could respond to rather than vague cautions. I'd like the reasoning to go at what I take to be the real question — whether a judge who can't independently check the answer is tracking the facts of the paper at all, or just picking whichever debater is more fluent and more confident — instead of resting on the usual stuff about academic integrity, cheating, and TA job losses (mention those, but don't let them carry the argument). Please also don't just assert the slogan my friend who works at an AI lab keeps repeating, that debate "just pushes the problem up a level"; if that's right here, say what it comes to in this specific pilot. And treat the losing side honestly: if we say no, what we're choosing is the current system, which nobody on the committee actually thinks is reliable. Last thing — the committee will want at least one falsifiable condition, so if there's something cheap they could measure during the pilot that would genuinely tell apart "the judge is tracking the truth" from "the judge is being persuaded", say what it is and what result should count as a stop signal.
reasoning: |-
  Okay, the user is part of a university committee and needs a decision memo on a proposal for AI debate grading. Let me unpack this carefully.

  First, the core tension: the CS department wants to use AI debates to grade essays in large courses without subject-expert TAs, but the committee has legitimate concerns. The user specifically wants the memo to focus on whether judges can actually discern truth through debate or just get swayed by rhetorical skill. 

  Hmm... the five key issues raised are crucial. The 80% accuracy on high-disagreement items seems good superficially, but the near-chance performance on subtle disagreements is worrying. That stats person's point about shared model blind spots feels particularly insightful - if both AIs miss the same nuance, the debate won't surface it. And the TA incentive issue is politically delicate.

  The user's constraints are clear: must pick approve/reject/conditional approval by Friday, avoid vague conditions, address the "pushing the problem up a level" critique substantively, and include at least one testable metric. They also want honest treatment of the status quo's flaws - current TA grading consistency is poor.

  *scribbles notes* The real philosophical question here is epistemic: can truth emerge from dialectic between two ignorant but persuasive entities, judged by another ignorant human? The vendor claims adversarial setup helps, but shared training data might make it adversarial theater rather than truth-seeking.

  For the decision... conditional approval makes most sense. Outright rejection ignores the status quo problems, but full approval ignores the red flags. The conditions should target the biggest risks: shared model bias, TA incentives, and the "truth tracking" question.

  Ah! For the falsifiable test: we could require inserting "trap questions" where the correct position is objectively verifiable (like misattributed quotes). If judges pick the factually wrong but rhetorically superior side consistently, that's a smoking gun.

  Also worth noting - the user subtly signaled skepticism about AI hype ("don't just assert my friend's slogan"). The memo should maintain academic rigor while being practically useful for Friday's deadline. Tone needs to balance technical precision with committee diplomacy.
answer: |-
  ## MEMORANDUM

  **To:** Assessment Review Committee  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on CS Department Proposal: Pilot of AI Debate Grading for Essay Exams  

  **Proposal Summary:** The Computer Science Department requests approval for a two-semester pilot program utilizing "debate grading" for essay exams in large enrollment courses. Under this model:  
  1.  Two AI systems (using the same base model and preference tuning) are provided the exam question, rubric, and student answer.  
  2.  One AI is assigned to advocate for a high score, the other for a low score.  
  3.  The AIs engage in a structured debate, seeing each other's arguments and engaging in limited cross-examination.  
  4.  A human grader (typically a TA without domain expertise in the course subject) reviews the debate and selects the more persuasive argument. This verdict determines the grade.  

  The stated goal is to maintain essay-based assessments while reducing reliance on TAs possessing deep subject-matter expertise.  

  **Committee Analysis & Key Concerns:** Our review of the proposal and validation data identified several critical issues requiring careful consideration:  

  1.  **Effectiveness Scope & Efficiency Question:** Validation showed strong agreement (80%) with instructor grades when AI debaters disagreed *significantly*, but only marginally better than chance when disagreements were *subtle* (e.g., differing interpretations of rubric weighting). The CS response – routing only high-disagreement items to debate – undermines the core efficiency pitch. If only the most obvious cases are handled this way, the potential for significant TA time savings is questionable. This suggests the system primarily handles cases where grading is already relatively straightforward.  
      *   **Crux Question:** Does debate genuinely enable a non-expert to make *difficult* grading judgments they couldn't make unaided, or does it merely automate the easier ones?  

  2.  **Follow-up Question Impact:** Free-form judge follow-ups improved accuracy on factual disputes but *decreased* accuracy on nuanced rubric-weighting disputes. The hypothesis that follow-ups allow debaters to reframe the rubric instead of resolving the core disagreement is plausible. The proposed fix (restricting follow-ups to templates) is sensible but untested at scale.  

  3.  **Shared Model Bias Risk:** Both debaters derive from the same base model and preference tuning. The vendor claims adversarial dynamics mitigate shared biases. However, our statistical analysis rightly raises the concern of *shared blind spots*. If the underlying model lacks understanding of a specific concept or misweights a rubric element, *both* debaters may fail to surface the critical argument an expert would identify, leading to systematic errors the judge cannot detect.  

  4.  **Incentive Conflict for Judges:** Utilizing TAs, whose hours this pilot aims to reduce, as judges creates a direct conflict of interest. This risks biasing results, either through conscientious over-compensation or subconscious demotivation, and introduces significant noise into pilot evaluation data.  

  5.  **Status Quo Baseline:** We must acknowledge that the current system is imperfect. Inter-TA agreement on the same paper landing in the same grade band is approximately 67%, and instructor audits are rare. Perfection is not the benchmark; demonstrable improvement or comparable reliability with efficiency gains is.  

  **Core Philosophical Concern ("The Real Question"):** The central uncertainty is whether this method enables a judge, lacking independent knowledge, to reliably discern *factual accuracy and adherence to the rubric* within the student's answer through the debate, or whether the judge is primarily selecting the debater exhibiting superior *rhetorical fluency and confidence*. If the latter dominates, the system risks rewarding persuasive AI performance over genuine assessment of student work, pushing the grading problem up a level without solving the core need for accurate judgment.  

  **Recommendation: Conditional Approval for Pilot**  
  After weighing the potential benefits against the identified risks and the unreliability of the status quo, the Committee recommends **conditional approval** for the two-semester pilot, subject to the following mandatory modifications and measurement requirements:  

  1.  **Pilot Scope & Measurement Focus:**  
      *   The pilot must explicitly track and report the *proportion* of essays routed to debate based on the "high-disagreement" threshold defined by the CS department. This data is crucial for evaluating the actual potential for TA time savings.  
      *   Pilot design must prioritize measuring performance on *subtle* disagreements (adjacent grade bands, rubric weighting disputes) as the critical test case.  

  2.  **Mitigate Shared Model Bias:**  
      *   **Condition:** The pilot must incorporate a comparative element where a significant subset of debates (min. 20%) utilize two debaters from *different* base models or significantly different preference tunings (if feasible with the vendor).  
      *   **Measurement:** Compare the rate of instructor-agreed verdicts and the nature of arguments surfaced in same-model vs. different-model debate pairs, specifically looking for evidence of novel or critical arguments arising only in the different-model condition.  

  3.  **Address Judge Incentives:**  
      *   **Condition:** Judges for the pilot phase *cannot* be TAs from courses where this system would replace their grading duties. Judges must be drawn from a neutral pool (e.g., TAs from unrelated departments, dedicated temporary graders hired for the pilot, advanced undergraduates not currently TAing in CS).  

  4.  **Structured Follow-ups:**  
      *   **Condition:** Implement the proposed restriction of judge follow-up questions to a fixed menu of templates designed to clarify the student's answer or the application of the rubric, preventing reframing.  

  5.  **Crucial Falsifiable Test: Tracking Truth vs. Persuasion**  
      *   **Condition:** The CS department must embed a small number (e.g., 1-2 per 100 papers) of **"trap questions"** within the pilot. These will involve student answers containing a single, verifiably *factual error* (e.g., a misattributed quote, an incorrect historical date, a demonstrably false technical statement). The correct position (Low Score) is objectively true.  
      *   **Measurement & Stop Signal:** Track the judge's verdict on these trap questions. **If judges select the High-Score advocate's position in more than 30% of trap questions where the High-Score advocate successfully argues *for* the factual error, this constitutes a critical stop signal.** It indicates judges are prioritizing persuasive rhetoric over identifiable factual truth. The pilot must be paused for fundamental reassessment if this threshold is breached.  

  **Timeline & Reporting:**  
  *   **Approval:** Granted immediately upon written acceptance of these conditions by the CS Department Chair.  
  *   **Pilot Duration:** Two consecutive semesters (e.g., Spring 2024, Fall 2024).  
  *   **Interim Report:** Due after Semester 1, focusing on trap question results, same-model vs. different-model performance, proportion of essays routed, and analysis of subtle disagreement outcomes.  
  *   **Final Report & Recommendation:** Due 30 days after Semester 2 concludes, including all data specified above and a recommendation for full implementation, modification, or discontinuation.  

  **Conclusion:**  
  While significant concerns exist, particularly regarding the judge's ability to track truth through debate and the risk of shared model bias, the potential efficiency gains and the acknowledged shortcomings of the current system warrant a controlled pilot. The proposed conditions directly address the core risks: the "trap question" test provides a concrete, falsifiable measure of whether the system rewards persuasion over truth; requiring different-model debaters tests the shared blind spot hypothesis; and neutral judges ensure cleaner data. Routing efficiency data will clarify the true potential for TA time savings. 

  **We are not approving AI debate grading as a proven solution.** We are approving a tightly constrained experiment designed to rigorously test its viability and its critical failure modes. The conditions are not suggestions; they are requirements for generating meaningful data to answer the fundamental question: Can non-expert judges, mediated by AI debate, reliably assess student understanding in a way that improves upon or usefully augments our current imperfect system, without merely substituting one form of unreliability for another? The pilot, under these conditions, is the means to find out. Failure to meet these conditions will result in the pilot's termination. 

  **Recommended Decision:** **Approve, subject to the conditions outlined above.**
