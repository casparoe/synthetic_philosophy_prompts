prompt: |-
  ok so I run a small reading group on philosophy of biology (I'm not a biologist by training, I teach phil of science) and I'm writing up a short position note on the units of selection thing before I inflict it on everyone else. I'd like a consistency check first, because I have a vague feeling that something in the middle of the list is doing more work than it's allowed to and I can't locate it.

  Here's roughly where I've landed:

  1. Cumulative adaptation needs a faithful replicator. I've been using a rough test of my own, call it the copy-fidelity test: a level is a genuine unit of selection only if the things at that level get near-copied across generations often enough for selection to actually accumulate there. Genes pass that test. Organisms, I suspect, don't, since meiosis and recombination scramble them every generation. So I'm a gene's-eye person about adaptation.

  2. But I can't stand the lumbering-robot rhetoric. Organisms really do hang together, developmentally and as the things that live and die, and I want to say selection on individuals is a real causal thing and not just a convenient way of adding up gene-level effects.

  3. I take the kin selection versus multi-level selection fight to be largely formal: on my understanding they're two different partitions of the same total change, so choosing between them is bookkeeping, not substance.

  4. Except I also want to say that in some actual cases the group level is where the causal work happens. Take cooperative breeding in birds, or the spread of norms across small human bands: groups differ in whether they persist or throw off daughter groups, and the change in gene or norm frequency is downstream of that. That sounds like more than bookkeeping, and it sounds like something the gene's-eye description gets wrong about the direction of explanation.

  5. Group selection in nature is rare and weak. It needs a pile of conditions holding at once: lots of variance between groups, not much migration between them, group-level events like extinction or colony founding that are frequent enough to matter. Those usually don't line up.

  6. But I think cultural group selection in humans is genuinely doing explanatory work: monogamy, cooperation at scale, food taboos, the way persistent raiding reorganises neighbouring bands. And I want to hold this even though cultural transmission is nothing like as faithful as DNA copying.

  7. Where brothers compete locally for mates and the sex ratio comes out strongly female-biased, I think the individual-level story is the perspicuous one and it's how I'd teach the case.

  So: which pairs are genuinely in tension and which only look like it? Please rank the real tensions by severity rather than listing them all as equally bad, and for each one say what would have to give and what that revision would cost me. I'd also like to know if there's a single revision that cleans up the most, and whether any one of the seven is load-bearing enough that the others should be rebuilt around it. And please don't just tell me the whole debate is terminological — I already half believe that about two of these, so tell me which two and whether that's a real diagnosis or me dodging.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run a philosophy of biology reading group and are preparing a position note on units of selection. They've outlined seven points and feel something in the middle might be inconsistent. I need to identify tensions, rank them, suggest revisions, and find which point might be load-bearing.

  First, point 1 emphasizes faithful replication, favoring gene's-eye view. Point 2 pushes back on the organism-as-robot idea, stressing organisms as real causal units. That’s a tension right there—genes vs. organisms as units. The user wants both, but how? Maybe replication isn't the only criterion. Perhaps persistence or interactor status matters too, like Hull's definitions. If they expand unit criteria, they can keep both genes and organisms without conflict.

  Then point 3 sees kin vs. multi-level selection as formal equivalences. But point 4 argues group selection can be causal, like in bird cooperation or human cultural groups. Here, the tension is between equivalence and causal reality. If they accept that formal equivalence doesn’t negate causal explanations in specific contexts, that resolves it. But point 5 says group selection is rare, except in humans (point 6). So human cultural group selection might be special due to mechanisms like norm enforcement, even without high-fidelity replication. That links to point 7 where individual-level explanations are clearer, like in sex ratios. 

  The user is caught between replication fidelity and causal significance. They need a framework that separates replicators from interactors. Genes are replicators, but groups or individuals can be interactors. Also, cultural traits might have lower fidelity but still function as units due to other mechanisms. 

  The biggest tension is between 1 (faithful replicator needed) and 6 (cultural group selection without fidelity). Revising 1 to include "functional" replication or inheritance could help. Point 6 is load-bearing because it challenges the strict replication requirement. Admitting functional fidelity in culture allows group selection there without abandoning the gene's-eye view elsewhere. 

  Points 3 and 4’s tension is resolved by distinguishing formal equivalence from causal perspectives. Point 2’s emphasis on organisms can fit as interactors. The user might be dodging by calling kin vs. multi-level terminological, but it’s partially valid—equivalence exists, but causal narratives differ. 

  In summary, revising unit criteria to include interactors and functional inheritance resolves most tensions. Point 6 is key; accepting cultural mechanisms as sufficient for selection allows holding other points consistently. Highlighting different explanatory goals (bookkeeping vs. causal stories) can reconcile other points without contradiction.
answer: |-
  Based on your position note outline, here's an analysis of the tensions, ranked by severity, along with necessary revisions, costs, and the load-bearing point:

  **Core Tension (Severe):**
  1.  **Points 1 vs. 6 (Replication Fidelity vs. Cultural Group Selection):**
      *   **Nature of Tension:** Point 1 demands "near-copying" (high-fidelity replication) for cumulative adaptation and genuine unit status. Point 6 asserts cultural group selection works *despite* cultural transmission lacking DNA-like fidelity. This is a direct contradiction in criteria.
      *   **What Must Give:** Point 1 needs revision. You must decouple "genuine unit of selection" and "cumulative adaptation" from requiring *genetic-level* fidelity.
      *   **Revision:** Adopt a broader concept of "inheritance" or "reproduction" for cultural evolution. Focus on **functional fidelity** or **statistical inheritance** - do cultural variants (norms, practices) get transmitted with *sufficient* fidelity *relative to the timescale and strength of selection acting on them* to allow cumulative change? Genes set a high bar, but cultural systems can achieve functional fidelity through teaching, ritual, norm enforcement, symbolic systems, etc., even with significant mutation/recombination.
      *   **Cost:** Weakens the clean, sharp gene-centric definition ("near-copying"). Forces you to define "sufficient fidelity" contextually. May open the door for arguments about organism-level fidelity you previously dismissed (Point 2). Requires embracing multi-level selection theory (MLS) more fully for culture.
      *   **Severity:** Highest. This is the fundamental inconsistency driving your unease. Your core criterion (1) invalidates your key claim (6).

  **Significant Tension:**
  2.  **Points 1 & 2 vs. 4 & 6 (Gene's-Eye Primacy vs. Group-Level Causality):**
      *   **Nature of Tension:** Points 1 & 2 establish genes as the *only* locus of cumulative adaptation (due to fidelity) and organisms as important causal interactors *within* a gene-centric framework. Points 4 & 6 claim group selection is sometimes the *primary causal driver* ("where the causal work happens," "downstream," "gene's-eye description gets wrong"). This challenges the explanatory primacy of the gene's-eye view in those cases.
      *   **What Must Give:** You need to clarify the relationship between levels and the concept of "causal work." You must allow that while genes are the ultimate replicators (Point 1), the *interactor* level driving selective sweeps can vary (organism, group), and the *most perspicuous causal narrative* can be at that interactor level.
      *   **Revision:** Explicitly adopt David Hull's Replicator/Interactor distinction. Genes are primary **replicators**. Organisms and Groups can be **interactors** – the entities that differentially survive/reproduce *as cohesive wholes*, thereby causing differential replication of their constituent replicators (genes/cultural variants). In cases like cultural group selection (Point 6) or avian cooperative breeding (Point 4), the group is the salient interactor driving the evolutionary change. Point 2 about organisms fits here too. This resolves the "lumbering robot" issue (Point 2) – organisms *are* real interactors. It also explains why the gene's-eye view feels incomplete for groups (Point 4) – it misses the causal structure at the interactor level.
      *   **Cost:** Requires learning/applying the Replicator/Interactor framework rigorously. Weakens the *exclusive* explanatory dominance of the gene's-eye view; it becomes the fundamental replicator accounting, but not always the best causal story. May feel like conceding ground to "group selectionists".
      *   **Severity:** High. This addresses the "direction of explanation" conflict head-on.

  **Manageable Tension / Terminological Dodge:**
  3.  **Points 3 vs. 4 (Formal Equivalence vs. Causal Primacy of Groups):**
      *   **Nature of Tension:** Point 3 says kin vs. MLS is bookkeeping. Point 4 says group selection is sometimes the real causal driver. This *looks* contradictory, but isn't necessarily.
      *   **What Must Give:** Refine Point 4's language slightly. The *mathematical equivalence* (Point 3) is real, but doesn't preclude the *causal/perspectival primacy* of the group interactor level in specific cases (clarified by the Replicator/Interactor revision above).
      *   **Revision:** Frame Point 4 as: "While kin selection and MLS models can formally represent the same net evolutionary change, in cases like cooperative birds or human cultural groups, the group-level events (extinction, fission, differential group success) are the *proximate, salient causal processes* structuring selection. Describing the change solely as the sum of individual/inclusive fitness effects (kin selection) obscures this causal structure, even if it calculates the same answer." This maintains the formal equivalence (Point 3) while justifying the focus on group selection for explanation.
      *   **Cost:** Requires careful language to avoid implying MLS is *ontologically* different when it's *causally/perspectivally* different. Risks reigniting debates you consider terminological.
      *   **Severity:** Moderate. Primarily a clarification needed, resolved by the Replicator/Interactor framework. **This is the "terminological dodge" you suspected.** Point 3 is *mostly* right about formal equivalence, but Point 4 is right about causal narratives being distinct and valuable. You were dodging by potentially downplaying the importance of causal perspective within the equivalence.

  **Minor Tension / Clarification Needed:**
  4.  **Points 5 vs. 6 (Group Selection Rare vs. Cultural Group Selection Strong):**
      *   **Nature of Tension:** Point 5 states group selection is rare/weak in nature. Point 6 claims it's strong in humans. This isn't inherently contradictory (humans are special), but the stark contrast needs explanation *given your core unit criterion*.
      *   **What Must Give/Revision Needed:** Link this directly to the revision of Point 1 and the Replicator/Interactor framework. The *conditions* for group selection (high between-group variance, low migration, group-level events - Point 5) are *more readily met and sustained* in human cultural groups due to:
          *   **Active Mechanisms:** Norm enforcement, punishment, tribal marking, warfare, ritual, symbolic systems actively *create and maintain* between-group variance and reduce effective migration.
          *   **Interactor Cohesion:** Cultural groups can be highly cohesive interactors due to shared identity and coordinated action.
          *   **Functional Fidelity:** Cultural inheritance mechanisms, while imperfect, provide sufficient fidelity *for group-level traits* to respond to selection.
      *   **Cost:** Requires fleshing out the specific mechanisms making cultural groups different from typical biological groups.
      *   **Severity:** Low. Easily resolved by emphasizing human uniqueness and cultural mechanisms.

  **The Load-Bearing Point & Single Best Revision:**

  *   **Load-Bearing Point: Point 6 (Cultural Group Selection).** This is the point most in tension with your initial strict criterion (Point 1) and driving the need for a broader framework. Your intuition about its importance is correct.
  *   **Single Best Revision: Adopt Hull's Replicator/Interactor Distinction and Broaden "Inheritance" to Functional Fidelity.** This single framework revision:
      1.  Resolves Point 1 vs. 6: Genes are the primary replicators, but cultural variants are replicators with *functional* fidelity sufficient for selection. Groups (and organisms) are interactors.
      2.  Resolves Points 1 & 2 vs. 4 & 6: Genes replicate, but interactors (organisms, groups) are the causal units *where selection directly acts*. The "lumbering robot" is an interactor. Group-level causality is explained by groups being interactors.
      3.  Resolves Points 3 vs. 4: Formal equivalence holds, but the interactor level defines the causal perspective.
      4.  Explains Point 5 vs. 6: Cultural groups are potent interactors due to mechanisms enabling cohesion and maintaining between-group variance.
      5.  Accommodates Point 7: In sex ratio, the organism is the salient interactor; an individual fitness/inclusive fitness perspective is often the most straightforward causal story.

  **Revised Core Narrative Skeleton:**

  1.  **Replicators & Fidelity:** Cumulative adaptation requires replicators with sufficient fidelity. Genes are the paradigmatic replicators due to high copying fidelity. Cultural variants can also function as replicators due to mechanisms enabling *functional fidelity* sufficient for cultural selection.
  2.  **Interactors & Causation:** Selection acts directly on interactors – cohesive entities that differentially survive/reproduce as wholes (organisms, groups). This differential success causes differential replication of their constituent replicators. Organisms are crucial interactors. Groups can also be potent interactors under specific conditions.
  3.  **Levels & Perspectives:** Kin selection and Multi-Level Selection are often formally equivalent ways of partitioning total change. However, identifying the primary *interactor* level (e.g., individual vs. group) provides the most perspicuous *causal explanation* for how selection is structured in a given case.
  4.  **Group Selection:** Biological group selection is rare due to stringent conditions (variance, migration, events). However, human cultural group selection is powerful because cultural mechanisms (norms, enforcement, identity) actively create and maintain the conditions for groups to function as effective interactors, selecting on cultural replicators.
  5.  **Teaching Cases:** The appropriate level for explanation depends on the salient interactor. Sex ratio evolution is often clearest at the individual/organism interactor level. Cultural spread (monogamy, norms) is often clearest at the group interactor level.

  This framework maintains your gene-centric view of replication and adaptation accumulation while fully accommodating the causal reality of organismal and group-level selection and providing a coherent account of cultural evolution. It resolves the core tensions without sacrificing your key insights. Good luck with the reading group!
