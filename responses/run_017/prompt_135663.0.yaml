answer: |-
  Here's a philosophical breakdown and assessment:

  **Core Philosophical Elements:**
  1.  **Rule-Following as Social Contract:** Jonas sees rules not as top-down commands, but as reciprocal agreements ("promises") binding a community. This emphasizes *procedural justice* and *predictability*.
  2.  **Formalism vs. Substantivism:** Jonas prioritizes the *form* (the rule itself, the procedure) over the specific *substance* or *outcome* in each case. His consistency lies in adhering to the formal structure.
  3.  **Moral Atrophy vs. Moral Scaffolding:** Your hunch points to a risk: relying solely on rules might weaken independent moral reasoning ("atrophy"). Jonas likely sees rules as necessary "scaffolding" enabling cooperation in complex societies, preventing arbitrary decisions ("guessing his moods").
  4.  **The Authority Problem:** Your girlfriend invokes the "banality of evil" critique: uncritical obedience to authority/rules enables harm. Jonas rejects this framing; for him, authority isn't the source, the mutual agreement is. The danger lies in conflating legitimate social contracts with illegitimate hierarchies.
  5.  **Integrity's Scope:** Jonas defines integrity as unwavering adherence to commitments (the rules-as-promises). Others define it as acting on core moral principles *despite* rules when they conflict (as in Case 3).

  **Assessment:**
  Jonas has a coherent, defensible, and *often* virtuous philosophy rooted in social contract theory and rule-of-law ideals. His stance in Case 2 (refusing fraud) is clearly integrity by most standards, demonstrating courage and principle. Case 1 (couch rule) shows rigidity, but stems from the same principle: the rule exists, he's bound by it, and he *still* found a compassionate solution *within* his framework (driving/paying). The problem isn't the core disposition, but its *application* when the rule itself is flawed or conflicts with higher-order moral principles.

  Case 3 exposes the potential flaw. Jonas's commitment to "properly passed" rules *regardless of content* risks becoming complicity in injustice (the xenophobic rule). His "promise" analogy breaks down when the rule violates fundamental fairness – you can't have a legitimate promise to do something immoral. His willingness to argue *against* the rule is crucial, showing his framework *can* accommodate moral critique *before* the rule is enacted. However, his pledge to follow it if passed shows the limits of his formalism; he prioritizes procedural legitimacy over substantive justice in that moment.

  Your girlfriend correctly identifies a *risk* inherent in *uncritical* rule-following, especially when rules are unjust. However, labeling all three cases identically as "just following orders" oversimplifies. Case 2 is the *opposite* of blind obedience; it's resisting pressure *because* of the rule/principles. Jonas's distinction between "command" and "promise" *is* philosophically significant, grounding obligation in reciprocity rather than hierarchy – but it doesn't magically make a bad rule good.

  **Your Advice for Talking to Jonas:**
  Focus on Case 3: "Jonas, I respect your consistency and that you see rules as promises we make each other. But doesn't a promise to enforce a rule targeting someone unfairly *itself* break a deeper promise about basic respect and fairness? How do you reconcile your commitment to *that* rule with your commitment to the underlying values of the community?" This challenges him within his own framework, forcing him to confront the hierarchy of values when rules conflict with fundamental justice.
