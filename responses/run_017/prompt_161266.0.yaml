  Hmm, the user is a retired physical oceanographer who has been grappling with the classic lifeboat dilemma after taking a moral philosophy seminar. He's presented nine detailed scenarios with his intuitive judgments and wants a unifying ethical principle that can justify most of them, especially resolving the tension between cases (2), (3), and (4). He's also shared his own candidate principle and wants me to critique it while committing to clear stances.

  First, I need to acknowledge his expertise - his background in risk modeling shows in how precisely he quantifies probabilities in cases like (3) and (4). His frustration with "just the doing/allowing distinction" in (2) is understandable; he's right that labeling isn't explaining. The core challenge is reconciling his intuition that refusing entry (case 2) feels permissible while ejection (cases 1 and 4) feels wrong, even with identical outcomes.

  His proposed principle has good elements but needs refinement. The "minimize expected deaths" part works for cases like (7) (unconscious patient) and (9) (child vs adult tradeoffs), but his "constraint against substantially raising total loss risk" is vague. Case (3) shows he intuitively weights catastrophic risk disproportionately - that's key. The culpability tie-breaker explains (5), and "never by age/relationship" aligns with (8) and (9).

  Now for the gaps: His principle currently can't explain why ejecting to reduce risk (case 4) feels wrong while refusing entry (case 2) is okay. We need to incorporate agent-relative permissions - the moral difference between not saving versus actively harming. This also resolves the wife scenario (8): taking her isn't actively harming the stranger.

  For the raft scenario: A 20% survival chance significantly changes the moral calculus compared to certain death. The permissibility of ejection should vary with survival probability - but discontinuously. Below some threshold (say 5%), it's effectively equivalent to drowning them. His culpability clause could prioritize ejecting the panicker here.

  Where I'll push back: His refusal to choose by age in (7) and (9) is inconsistent. If minimizing expected deaths is the goal, saving the 20-year-old over the 80-year-old is objectively better (more life-years preserved). He should either embrace full utilitarianism here or abandon age neutrality. Also in case (3), stopping at 14 passengers despite rising expected survival is irrational by strict utility maximization - but I'll defend it as psychologically realistic risk aversion.

  Finally, I'll structure the response around a two-part principle: 1) Maximize expected survival value (incorporating life-years and special obligations), 2) With constraints against active harm and disproportionate catastrophic risk. Then apply it rigorously to all his cases, flagging where his intuitions might need adjustment (especially the age neutrality).
answer: |-
  Below is a unified ethical principle designed to capture your core intuitions while resolving the tensions you've identified, particularly between cases (2), (3), and (4). It draws on **contractualist ethics** (specifically T.M. Scanlon's framework) and **risk-weighted expected utility theory**, with a focus on **agent-relative permissions** and **non-aggregation of catastrophic loss**:

  ---

  ### **The Principle: Dual Constrained Expectancy (DCE)**  
  **1. Core Duty:** *Minimize expected harm-weighted life-loss* (EHLL), where:  
     - **Harm-weight** = (1 / survival probability) if ejected/denied aid.  
     - **Life-loss** = years of expected remaining life (use actuarial tables if unknown).  
  *Rationale:* Addresses cases (7) (unconscious dies first), (9) (child vs. adult tradeoffs), and graded risks in (3)/(4) by valuing both survival chance and life-years.  

  **2. Constraints:**  
     - **(a) No Active Harm:** Never *cause* death or severe harm (e.g., ejection) to reduce aggregate risk, unless:  
       - The victim is *culpable* (case 5),  
       - Or death is *imminent and certain* regardless (case 7).  
     - **(b) Catastrophe Avoidance:** Reject options with >10% risk of *total loss* if a feasible alternative keeps total loss risk ≤5%.  
  *Rationale:* Explains (1)/(4) vs. (2): Ejecting is active harm (forbidden), while refusal is passive (permissible). Justifies stopping at 14 people in (3) despite rising expected survivors.  

  **3. Tie-breakers:**  
     - (i) Culpability (case 5),  
     - (ii) Imminent death (case 7),  
     - (iii) Special obligations (e.g., spouse in case 8).  

  **4. Agent-Relativity:** Personal relationships justify *favoring* (e.g., saving spouse) but not *harming* others (e.g., ejecting stranger for spouse).  

  ---

  ### **Application to Your Cases**  
  | Case | Your Verdict | DCE Verdict | Consistency | Notes |  
  |------|--------------|-------------|-------------|-------|  
  | (1)  | Permissible (lottery/volunteer) | **Permissible** | ✓ | Volunteer avoids *active harm*; lottery minimizes EHLL. |  
  | (2)  | Permissible (refuse hauling) | **Permissible** | ✓ | Refusal isn't active harm; passive denial allowed. |  
  | (3)  | Stop at 14 | **Stop at 14** | ✓ | 16+ breaches catastrophe constraint (18%>10%). |  
  | (4)  | Impermissible (eject 2) | **Impermissible** | ✓ | Ejection is active harm (constraint 2a). |  
  | (5)  | Culpable ejects first | **Culpable first** | ✓ | Active harm permitted due to culpability (constraint 2a). |  
  | (6)  | Keep navigator/radio; doctor uncertain | **Keep all three** | △ | DCE: Essential roles reduce EHLL (save more lives). Doctor kept unless another medic aboard. |  
  | (7)  | Unconscious first | **Unconscious first** | ✓ | Minimizes EHLL (near-certain death). |  
  | (8)  | Save spouse; no ejection | **Save spouse** | ✓ | Agent-relative permission to favor, not harm. |  
  | (9)  | Child >1 adult; no age-based ejection | **Child >1 adult; age only in ties** | △ | DCE saves child over adult (more life-years); age irrelevant if EHLL equal. |  

  ---

  ### **Resolving Key Tensions**  
  - **(2) vs. (4) (Identical Outcomes):**  
    DCE treats ejecting (active harm) as distinct from refusing aid (passive). This is *not* merely "doing/allowing" but a **rights-based constraint**: individuals have a claim not to be used as risk-mitigation tools. Refusing entry leaves fate to nature; ejection makes you the cause.  
  - **(3) Graded Risk:**  
    Stopping at 14 is justified by the catastrophe constraint (18% risk at 16 breaches the 10% threshold). Expected survivors rising is irrelevant—DCE prioritizes *avoiding worst-case outcomes* over marginal gains.  

  ---

  ### **Where DCE Demands Surrender**  
  1. **Case (6): Doctor Uncertainty → Keep Doctor**  
     - *Why?* A doctor significantly reduces EHLL (prevents deaths from injury/infection). If no other medic, keeping them minimizes harm.  
     - *Confidence:* High (95%). Essential roles are *empirically* risk-reducing—unlike philosophy, oceanography deals in measurable variables.  

  2. **Case (9): Refusing Age-Based Choice → Choose the Young**  
     - *Why?* A 20-year-old has ~60 life-years left; an 80-year-old has ~8. Saving the young minimizes EHLL (60 > 8). Sentiment cannot override 52 life-years.  
     - *Confidence:* High (90%). Actuarial data must inform ethics where available.  

  3. **Case (7): Age Refusal Inconsistent**  
     - *Why?* If imminent death justifies ejection, age-based life expectancy is logically identical (both reduce EHLL).  
     - *Confidence:* Absolute (100%). This is a direct contradiction in your intuitions.  

  ---

  ### **The Raft Scenario (3 Must Go)**  
  - **DCE Verdict:**  
    - If survival chance ≥5%, ejection is **permissible** (via lottery) *if* the raft reduces EHLL versus drowning.  
      Example: 20% survival for 3 people = 0.6 expected lives saved. Drowning them = 0 lives saved. Thus, EHLL is lower with ejection.  
    - If survival chance <5%, ejection **impermissible** (active harm with near-certain death).  
  - **Why?** Permissibility varies *discontinuously* with survival probability. At 5%, the harm-weight (1/0.05=20) makes EHLL worse than drowning (harm-weight=1).  

  ---

  ### **Is DCE a Genuine Principle?**  
  Yes. It:  
  1. **Predicts new cases** (e.g., *15 aboard, one is your child*: You may *not* eject a stranger to save them—active harm forbidden).  
  2. **Explains why** your intuitions diverge between identical outcomes (active vs. passive).  
  3. **Corrects inconsistencies** (age vs. imminent death) using objective life-expectancy.  
  4. **Quantifies thresholds** (5% survival for rafts; 10% catastrophe risk).  

  **Confidence in DCE:**  
  - 90% for maritime emergencies (your domain).  
  - 70% for broader ethics (cultural variables may affect special obligations).  

  **Confidence in Critiques:**  
  - 100% on age/imminent death inconsistency (mathematical imperative).  
  - 95% on doctor retention (empirical optimization).  

  ---

  ### **Repairing Your Candidate Principle**  
  Your proposal ("minimize expected deaths + catastrophe constraint + tie-breakers") fails on (2)/(4) because it lacks the **active harm prohibition**. Adding:  
  > *"Never eject or injure a non-culpable person to reduce risk, except when death is imminent and certain"*  
  saves cases (1)/(4) and aligns with DCE. However, DCE's harm-weighting and life-expectancy metrics make it more robust for graded risks (e.g., raft survival, age choices).  

  --- 

  **Final Summary:**  
  - **Keep:** Refusal vs. ejection distinction (2)/(4), catastrophe aversion (3), culpability (5), spouse favoritism (8).  
  - **Surrender:** Doctor uncertainty (6 → keep), age neutrality (9 → save young), refusal to compare age in (7).  
  - **Rafts:** Ejection permissible if survival chance ≥5%.  

  DCE closes your gap: the same risk reduction is *permissible passively* but *impermissible actively* because ethics cares not just about outcomes, but about **what we do to the living**.
