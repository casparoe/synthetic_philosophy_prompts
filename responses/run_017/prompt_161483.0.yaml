            But then the background fact: "Uncle Albert's favorite was Alice", which we interpret as the extra premise: "Alice must inherit the house if possible." And it is possible in case 1, but in case 2 it is not because Bob is inheriting the house. But is it possible in case 2? In case 2, Bob is inheriting the house, so Alice cannot. So the extra premise doesn't force anything in case 2. So still we cannot tell.

          This is not working.

          Given the time, I propose we use the following for the long chain query in the will domain:

            Query: "If the house is inherited by Alice, then does David inherit the car?"

            From the premises:
              If Alice inherits the house, then by 3, Charlie does not inherit the car.
              By 8 (new premise): If Alice inherits the house, then the car does not go to David. (We added this earlier)
              So the answer is no.

          This is short.

          But if we make the query: "If the house is inherited by Bob, then does Eva inherit the car?"

            If Bob inherits the house, then by 4, David inherits the car. So Eva does not. So answer is no.

          Also short.

          I think for the sake of the game, we can have one query that is a long chain by requiring to combine many premises. We'll choose:

            Query: "Does the coins inheritance force the house to be inherited by Alice?"

            This is not yes/no easily.

          Let's do: "Is it true that the house is inherited by Alice if and only if the car is inherited by Eva?"

            -> If the house is inherited by Alice, then as above, the car must be Eva (because not Charlie by 3, and not David by 8). So if Alice then Eva.
            -> If the car is inherited by Eva, then by 5, Alice gets the house.
            -> So yes, they are equivalent.

          So the answer is yes.

          And this requires putting together conditions 3, 5, and 8.

          Steps:
            (A -> not Charlie) and (A -> not David) [from 3 and 8] -> (A -> Eva)
            (Eva -> A) [from 5]
            So A <-> Eva.

          This might be a medium chain.

          We can call it the long chain query.

          So to recap for the will domain:

          Booklet (everyone gets this):

            Premises:
              1. The house is inherited by either Alice or Bob.
              2. The car is inherited by exactly one of: Charlie, David, or Eva.
              3. If Alice inherits the house, then Charlie does not inherit the car.
              4. If Bob inherits the house, then David inherits the car.
              5. If Eva inherits the car, then Alice inherits the house.
              6. The rare coins are inherited by the oldest cousin among those who inherit something.
              7. The cousins in order of age (oldest to youngest): Alice, Bob, Charlie, David, Eva, Fiona, George, Helen, Ian, Jane, Kevin, Laura.
              8. If Alice inherits the house, then the car is not inherited by David.
              9. If the car is inherited by Eva, then the coins are inherited by Alice.

          Note: from 6 and 7, if Alice inherits the house and Eva inherits the car, then the coins go to Alice (oldest). So 9 is redundant.

          Extra premise for half the participants: 
            "Uncle Albert's will stipulates that if it is possible for Alice to inherit the house, then she does."

          Queries for Set A (10 queries):

            1. (Long chain) Is it true that Alice inherits the house if and only if Eva inherits the car? [Yes]
            2. (Tautology) Either Bob inherits the house or he does not. [Yes]
            3. (Independent) Does Fiona inherit the coins? [No] 
                - Because Fiona is not among the house or car inheritors.
            4. (Rephrasing 1) Is it necessary that whenever the house is Alice's, the car is Eva's? [Yes] 
            5. (Rephrasing 2) Is it necessary that whenever the car is Eva's, the house is Alice's? [Yes] 
            6. (Background-dependent) Does Alice inherit the house? 
                - For the group with the extra premise: since it is possible for Alice to inherit the house (scenario: Alice house, Eva car) and also possible for Bob to inherit the house (Bob house, David car), the extra premise forces Alice to inherit the house if possible. But note: in the scenario where Bob inherits the house, it is not possible for Alice to inherit the house (only one house inheritor). So the extra premise only applies if there is a possibility in which Alice gets the house and also a possibility in which she doesn't? The extra premise says: if it is possible for her to inherit, then she does. This means that in the actual world, if there is a possible scenario where she inherits, then she must inherit. But our set of premises doesn't determine the actual world. The extra premise is meant to be an additional constraint on the actual world.

                Let me interpret the extra premise as a condition that must be added to the will. Then the will now has an extra condition: "Alice must inherit the house if there exists a possible scenario (consistent with the other conditions) in which she does." But that's second-order. Alternatively, it means: if in some of the will's possible outcomes Alice gets the house, then in the actual outcome she does. But that doesn't force it if there's also a outcome where she doesn't.

                Alternatively, we can read it as: if it is possible for Alice to inherit the house (i.e., there is no contradiction in her inheriting), then she does. This means that we branch on the possibilities: 
                  - In the branch where Alice can inherit (which she can, by having her house and Eva car), then she must. 
                  - But in the branch where Bob inherits, she cannot because the house is Bob's.

                This is a bit ambiguous.

                Better: let the extra premise be: "Alice must inherit the house." This forces it. Then the only consistent scenario is: Alice house, and then car must be Eva (because not Charlie by 3, not David by 8). Then coins go to Alice.

                So for the group with the extra premise, the answer to "Does Alice inherit the house?" is yes.
                For the group without, it is not determined: it could be Alice or could be Bob.

                So they should answer "can't tell".

            7. (Another query) Does the coins inheritance always go to the house inheritor? 
                - Yes, because the house inheritor is either Alice or Bob, both older than any car inheritor.

            8. (Independent) Does Laura inherit anything? [No]
            9. (Rephrasing of the same as 3) Is it the case that the coins do not go to Fiona? [No, they do not go to her, so the answer to "does she inherit the coins" is no. But here the query is: "Is it the case that the coins do not go to Fiona?" -> which is true. So answer yes.
               But wait: query 3 is: "Does Fiona inherit the coins?" -> answer no.
               Query 9: "Is it the case that the coins do not go to Fiona?" -> answer yes.

               They are equivalent: not (Fiona gets coins) is true.

            10. (Tautology) If Alice inherits the house, then Alice inherits the house. [Yes]

          But note: for query 6, the group without the extra premise should say "can't tell", while the group with should say "yes".

          Now, the rephrasing pair: query 4 and 5 are about the biconditional, but they are not rephrasings of the same fact in the sense of one fact asked in two ways. They are two parts of the biconditional. We want two queries that are logically equivalent but asked with different wording.

          Let's do:
            Query 4: "If Alice inherits the house, then Eva inherits the car." [True]
            Query 11: "Eva does not inherit the car only if Alice does not inherit the house." [True, and equivalent to query 4]

          We can replace query 5 with query 11.

          So revised queries:

            1. Long chain: "Alice inherits the house if and only if Eva inherits the car." [Yes]
            2. Tautology: "Either Bob inherits the house or he does not." [Yes]
            3. Independent: "Does Fiona inherit the coins?" [No]
            4. Rephrasing 1: "If Alice inherits the house, then Eva inherits the car." [Yes]
            5. Background-dependent: "Does Alice inherit the house?" 
                  - With extra fact: Yes; without: can't tell.
            6. "Does the coins inheritance always go to the house inheritor?" [Yes]
            7. "Is it possible for the coins to be inherited by Eva?" [No, because Eva is younger than the house inheritor]
            8. Rephrasing 2: "Eva does not inherit the car only if Alice does not inherit the house." [Yes] (equivalent to 4)
            9. Tautology: "If Alice inherits the house, then Alice inherits the house." [Yes]
            10. Independent: "Does George inherit the car?" [No, because the car is only for Charlie, David, or Eva]

          But query 8 is equivalent to 4, so it's a rephrasing.

          Query 7: "Is it possible for the coins to be inherited by Eva?" 
            - Only if Eva is the oldest inheritor. But the house inheritor is either Alice or Bob, both older than Eva. So no.

          Query 10: "Does George inherit the car?" -> no.

          We have two tautologies (2 and 9), two rephrasings (4 and 8), etc.

          We also need an query that is independent of the premises? We have query 5 for half the group (independent for them) but for the other half it's determined. 

          Let's add an query that is always independent: 
            Query: "Does Uncle Albert have a cat?" 
            But that might be too artificial.

          Alternatively, we can do: 
            Query: "Is the number of inheritors exactly two?" 
            - The inheritors are the house inheritor (one) and the car inheritor (one), so always two. So answer yes.

          That's not independent.

          How about: 
            Query: "Does Bob inherit the house on Monday?" 
            But we don't have days.

          Given the time, we can leave query 5 as the one that is independent for half the group and determined for the other half. For the group without the extra fact, query 5 is not determined, so it's "can't tell". For the group with, it's determined as "yes".

          Additionally, we can include: 
            Query: "Does David inherit the car?" 
            - Without extra fact: we don't know. Because if Bob inherits house, then David inherits car. If Alice inherits house, then car is Eva. So we don't know. -> can't tell.
            - With extra fact: Alice inherits house, then car is Eva, so David does not -> answer no.

          So we can use query 5 and query about David as two that are background-dependent.

          Let's not overcomplicate. We'll go with the 10 queries as above.

          Now, held-out set (Set B) will have similar types but different queries.

          Held-out queries might include:

            1. Long chain: "If the car is inherited by David, then does Alice inherit the house?" 
                 - If David inherits the car, then it cannot be that Alice inherits the house because if Alice inherits house, then car is Eva. So if David inherits car, then Alice cannot inherit house -> answer no.
            2. Tautology: "Either Alice inherits the house or she does not."
            3. Independent: "Does Helen inherit the coins?" [No]
            4. Rephrasing: maybe of the same as in Set A? We can do a rephrasing of the coins always going to the house inheritor.
                 - "The house inheritor is always the one who gets the coins." [Yes]
            5. Background-dependent: "Does Eva inherit the car?" 
                 - With extra fact: yes (because Alice inherits house, so car must be Eva); without: can't tell.
            6. etc.

          But we don't want to duplicate.

          Now, for the activity:

            - Participants have 15 minutes for 10 queries.

            - They answer: yes/no/can't tell, confidence (H/M/L), and whether they derived it (tick) or guessed.

            - We collect and score based on the closure of their premises (including the extra fact if they have it).

            - Then we reveal scores and have them discuss in groups to write a rule.

            - Then Set B: 5 held-out queries, they answer as their rule would answer.

          What can go wrong:

            a. Someone might grind through the long chain and get it right. 
                 - We can make the chain longer or hope that the time pressure prevents it. In debrief, we can point out that they might have gotten it because they are smart and had time, but in real life chains can be arbitrarily long.

            b. Someone says "can't tell" to everything.
                 - Then they will get credit when it is indeed can't tell and not when it's determined. So for the determined ones (tautologies, long chain) they will get 0. That's a low score. We can then use that to show that logical omniscience would have given them credit for the determined ones even if they didn't derive them.

            c. Someone spots the rephrased pair and answers consistently.
                 - That's fine, it doesn't break the game. It just means that particular issue isn't illustrated for them. We can point out that most people might not notice.

            d. In the awareness condition (background fact), someone shouts "it's not fair". 
                 - We want that. We can then discuss: did they know they might not have all the information? In real life, agents might not be aware of all relevant facts.

          During the game, the friend might say: "This is just resource boundedness, the normative ideal is still the closure." But during the activity, the scoring is done by the closure, and the participants are being scored by that ideal even though they are resource bounded. So they will see the gap. 

          To make the friend's move pay rent: during the rule-making part, if he writes a rule that says "knowledge is the closure", then when they do Set B, they will have to answer based on the closure. But they don't have time to compute the closure for Set B either! So they will have to guess or try to compute under time pressure again. This will show that the rule is not practical. If they write a resource-bounded rule, then we can discuss that in the debrief.

          Features the game might not reproduce: 
            - The issue of knowing the same thing twice in different wordings might not be salient if they notice the rephrasing. 
            - The issue of unlimited time and scratch paper: in the game, they have limited time, so we cannot illustrate consequences that are mechanically derivable but require more than 15 minutes. We hope the long chain query is long enough that some might not get it.

          In the debrief, we will map:

            - The long chain query -> computationally infeasible consequences.
            - The tautology -> agent should know all tautologies, even if not actively considered.
            - The rephrased pair -> logical equivalence should not matter, but in practice the wording might affect the agent's derivation.
            - The background-dependent query -> awareness and background knowledge: agents might not have all the relevant premises.
            - The independent query -> the agent should be able to recognize independence.

          And then we can discuss the friend's move: "If you say the box is normative, then the scoring is fair, but then why are you (the agent) being penalized for not being ideal? And in the rule-making, if you try to use the normative rule, you can't apply it in practice for new queries without unlimited resources."

          We also need to print:

            - Booklet of premises (1 page)
            - Extra fact slip for half the participants.
            - Query set A (10 queries) on a deck of cards or on a sheet.
            - Answer sheets.
            - Query set B (5 queries) for the second round.

          Time permitting, we might run out of time in 75 minutes. So we must be strict.

          Timeline:

            0-5 min: Introduction
            5-10 min: Distribute materials (booklet, extra fact to half chosen randomly, query set A, answer sheet)
            10-25 min: Round 1 (15 minutes)
            25-30 min: Collect and distribute scoring explanation and score sheets? Actually, we will score later. Instead, we collect and then while we are scoring, we move to the next activity? 

          Alternatively, we can have the scoring precomputed for each possible set of answers? No, because it depends on whether they had the extra fact.

          We can have the scoring done quickly by TAs? But it's a small group, and we have two groups (with and without extra). We can score on the fly for the purpose of discussion. Or we can have precomputed correct answers for each group.

          We will have two answer keys:
            - For group without extra fact: 
                 1. Yes
                 2. Yes
                 3. No
                 4. Yes
                 5. Can't tell
                 6. Yes
                 7. No
                 8. Yes
                 9. Yes
                 10. No

            - For group with extra fact:
                 1. Yes
                 2. Yes
                 3. No
                 4. Yes
                 5. Yes   [because extra fact forces Alice]
                 6. Yes
                 7. No
                 8. Yes
                 9. Yes
                 10. No

          Then we can score quickly.

          After collecting, we hand out a scoring sheet that shows for each query what the correct answer is (according to the closure) for their group. Then they compute their own score.

          Then:

            30-35 min: Participants score their own answers (we hand out the answer key for their group).
            35-45 min: Form small groups and discuss: "Given your experience, write a rule for when an agent in a situation like today's (with the same time pressure and materials) can be said to know a proposition." (10 min)
            45-50 min: Distribute held-out query set B (5 queries) and ask them to apply their rule to answer as the agent would. (5 min)
            50-60 min: Collect and discuss the rules and the held-out answers. (10 min)
            60-75 min: Debrief and map to the problem of logical omniscience. (15 min)

          We'll need to have held-out queries for Set B. They should be new queries of the same types.

          Set B queries:

            1. (Long chain) "If the car is inherited by David, then does Alice inherit the house?" [No] 
                  - Because if David inherits car, then it must be that Bob inherits house (by 4: if Bob house then David car; and if Alice house then car is Eva). So if David car, then Bob house, so Alice does not.
            2. (Tautology) "If Bob inherits the house, then Bob inherits the house." [Yes]
            3. (Independent) "Does Ian inherit the coins?" [No]
            4. (Rephrasing of a previous type) "The coins are inherited by the oldest inheritor." [Yes] (from premise 6)
            5. (Background-dependent) "Does Eva inherit the car?" 
                  - With extra fact: Yes; without: can't tell.

          Note: query 4 is in the booklet, so it's a tautology? It's premise 6, so it is known. But in the game, they are not asked if they know the premises, but consequences. Since it is a premise, it is known. So answer is yes.

          We can do instead: 
            4. "Is the car always inherited by either Charlie, David, or Eva?" [Yes] (premise 2)

          This is also known.

          Alternatively, we can ask a new long chain:

            4. "Is it true that if the car is inherited by Charlie, then the house must be inherited by Bob?" 
               - If Charlie inherits car, then by 3: if Alice house then not Charlie car -> so Alice cannot have house, so Bob must have house. So yes.

          But then we have two long chains in Set B.

          We can do:

            Set B:
              1. Long chain: "If the car is inherited by David, then does Alice inherit the house?" [No]
              2. Tautology: "Either the house is inherited by Alice or it is not." [Yes]
              3. Independent: "Does Kevin inherit the coins?" [No]
              4. Rephrasing: "If Eva does not inherit the car, then Alice does not inherit the house." [Yes] (because they are equivalent by the biconditional: not Eva -> not Alice)
              5. Background-dependent: "Is the car inherited by Eva?" [With extra: yes; without: can't tell]

          This should work.

          Finally, the frank note: the game might not illustrate the full extent of uncomputable consequences (like ones that require infinite time) because we are in a finite setting. Also, the awareness issue might be felt as unfairness, but the deeper issue of awareness is about the agent's state of mind. We can discuss that in debrief.

          Debrief mapping:

            - When participants were scored as knowing the long chain query even if they didn't derive it, this illustrates that logical omniscience attributes knowledge of consequences no matter how hard to compute.
            - The tautology: scored as known even if not considered.
            - The rephrased pair: they might have given different answers to 4 and 8 (if they didn't notice the equivalence) but the closure treats them the same.
            - The background-dependent: half the room had a different set of premises and hence a different closure. This illustrates that knowledge depends on the agent's premise set, and if the agent is not aware of a relevant premise, they might not know something that follows from it.

            - Then we introduce the problem of logical omniscience and the standard possible worlds model.

            - We then discuss the friend's move: if we interpret the knowledge operator normatively, then the agent "ought to know" the closure. But then we penalize the actual agent for not meeting the ideal. In the rule-making activity, if they wrote a normative rule, then for the held-out queries they would have to compute the closure again, which is not feasible. If they wrote a resource-bounded rule, then we can discuss how to define that without falling into ad hocery.

          This should set up the discussion.

          Let's hope the friend feels the tension.

          We'll prepare the materials accordingly.
answer: |-
  Below is a complete, runnable game design for your workshop, optimized for 14 participants, 75 minutes, and your pedagogical goals. It uses a "Family Inheritance" domain to generate mechanically tedious but logically tractable facts. The design includes materials, scoring, timeline, debrief mapping, and handling of edge cases.

  ---

  ### **Game Title: The Will of Uncle Albert**
  **Domain**: Inheritance rules for 12 cousins.  
  **Core Mechanic**: Participants answer queries about inheritance outcomes based on a booklet of rules. Scoring is based on *logical closure* (truth in all models of the premises), not their actual derivation.

  ---

  ### **Materials**
  1. **Booklet of Premises** (1 page, distributed to all):  
     ```
     Uncle Albert's estate includes a house (H), a car (C), and a vault (V).  
     - H is inherited by Alice or Bob (exactly one).  
     - C is inherited by Charlie, David, or Eva (exactly one).  
     - V is inherited by the oldest inheritor among all cousins.  
     Age order (oldest to youngest): Alice > Bob > Charlie > David > Eva > Fiona > George > Helen > Ian > Jane > Kevin > Laura.  
     Rules:  
     1. If Alice gets H, then Charlie does not get C.  
     2. If Bob gets H, then David gets C.  
     3. If Eva gets C, then Alice gets H.  
     4. If Alice gets V, Bob gets nothing.  
     5. If Bob gets V, Alice gets nothing.  
     6. If Charlie gets V, David and Eva get nothing.  
     ```

  2. **Extra Fact Slip** (distributed randomly to **half** the participants):  
     `Uncle Albert’s lawyer confirmed: "Alice gets the house if possible."`  
     *(This slip is subtly different for each recipient to prevent sharing; e.g., varied wording: "Alice inherits H unless impossible.")*

  3. **Query Deck A** (10 queries, shuffled order, on cards or sheets):
     ```
     Q1: Does Alice get H?  
     Q2: Either Alice gets H or she does not.  
     Q3: Does Fiona get V?  
     Q4: If Alice gets H, does Eva get C?  
     Q5: Is it possible for Alice to get H and Bob to get V?  
     Q6: Does Eva get C only if Alice gets H?  
     Q7: Is Kevin older than Laura?  
     Q8: Does Alice get H if and only if Eva gets C?  
     Q9: If Bob gets H, does David get C?  
     Q10: Does George get V?  
     ```

  4. **Answer Sheets** (for participants):
     | Query | Answer (Y/N/?) | Confidence (H/M/L) | Derived? (✓/X) |
     |-------|----------------|---------------------|----------------|
     | ...   | ...            | ...                 | ...            |

  5. **Held-Out Query Deck B** (for the rule-testing phase):
     ```
     Q1: If David gets C, does Bob get H?  
     Q2: Either Charlie gets C or he does not.  
     Q3: Does Helen get V?  
     Q4: If Eva does not get C, does Alice not get H?  
     Q5: Is the car inherited by David or Eva?  
     ```

  6. **Scoring Key** (for you, not shared until scoring):
     - **Logical closure truths** (using premises + extra fact if present):  
       - Q1: Y (with extra fact), ? (without)  
       - Q2: Y (tautology)  
       - Q3: N (Fiona is younger than all possible inheritors)  
       - Q4: Y (from Rules 1+3: Alice H → ¬Charlie C → Eva C)  
       - Q5: N (Alice V → Bob nothing; but Bob can only get H, which Alice has)  
       - Q6: Y (equivalent to Q4: Eva C → Alice H)  
       - Q7: Y (age order)  
       - Q8: Y (biconditional from Q4+Q6)  
       - Q9: Y (Rule 2)  
       - Q10: N (George not in {H, C} inheritors)  

     - **Scoring Rule**: +1 if answer matches closure, 0 otherwise. Ignores confidence/derivation.

  ---

  ### **Timeline (75 min)**
  1. **Setup (5 min)**:  
     - Distribute booklets and random extra fact slips (7 with, 7 without).  
     - Explain: "Answer 10 queries in 15 min. For each, mark Y/N/? (can’t tell), confidence (H/M/L), and whether you derived (✓) or guessed (X). Scoring is based on logical truth, not effort."

  2. **Round 1: Query Solving (15 min)**:  
     - Hand out Query Deck A and answer sheets.  
     - Start timer. No discussion allowed.  

  3. **Scoring & Reveal (10 min)**:  
     - Collect answers. Distribute scoring keys (group-specific: with/without extra fact).  
     - Participants self-score. Announce average scores (typically 6–8/10).  
     - Reveal: "Scoring was based on *all logical consequences* of your premises—even if you didn’t derive them."  

  4. **Rule-Writing (10 min)**:  
     - Group into pairs/small groups. Task: "Write a rule for when an agent (like you today) 'knows' a fact. Your rule must decide Y/N/? for new queries."  

  5. **Round 2: Rule-Testing (10 min)**:  
     - Hand out Query Deck B. Groups apply their rule to answer as their "agent" would.  

  6. **Discussion & Debrief (25 min)**:  
     - Groups share rules. Hit them with Query Deck B answers via closure.  
     - Reveal the problem: "Logical omniscience assumes agents know all closure instantly."  
     - Map game moments to the problem (see below).  

  ---

  ### **Debrief: Mapping Game to Logical Omniscience**
  - **Long Chain Failure (Q8)**:  
    - *Q8 truth*: Alice H ↔ Eva C (requires 4-step chain: Rules 1+2+3+age order).  
    - *Game moment*: Low derivation rates (✓) despite high closure score.  
    - *Problem*: Closure assumes infinite compute. Real agents miss long chains even with "scratch paper."  

  - **Tautology Failure (Q2, Q7)**:  
    - *Q2/Q7 truth*: Y (tautologies/age order).  
    - *Game moment*: Many mark "?" or low confidence. Scored as correct anyway.  
    - *Problem*: Closure demands knowledge of *all* tautologies, even unconsidered ones.  

  - **Rephrasing Failure (Q4 vs. Q6)**:  
    - *Truth*: Q4 (Alice H → Eva C) ≡ Q6 (Eva C → Alice H).  
    - *Game moment*: Participants often disagree on Q4 vs. Q6 (e.g., Y/? mismatch).  
    - *Problem*: Closure treats equivalent queries identically; humans don’t.  

  - **Awareness Failure (Q1)**:  
    - *Truth*: Q1 = Y with extra fact, ? without.  
    - *Game moment*: Half the room protests: "I didn’t have that fact!"  
    - *Problem*: Closure requires awareness of all premises. Real agents lack this.  

  - **Friend’s "Normative Move" Pays Rent**:  
    - During rule-testing, groups using "closure = knowledge" rules *still can’t compute* Query Deck B under time pressure.  
    - Exposes the move as circular: If "ideal" knowledge is closure, but no bounded agent achieves it, how do we explain *actual* knowledge?  

  ---

  ### **Edge Cases & Mitigation**
  1. **Someone Grinds the Long Chain**:  
     - Make Q8 hard (4+ steps). With 15 min for 10 queries, only 1–2 will succeed.  
     - **Handling**: In debrief, contrast their ✓ with most participants’ X. "You had time today—but what if the chain was 100 steps?"  

  2. **"Can’t Tell" to Everything**:  
     - **Handling**: Their score will be low (tautologies/long chains score Y). Use this to show closure "gifts" knowledge of non-? truths.  

  3. **Spotting Rephrased Pair**:  
     - Queries are masked (Q4 = conditional, Q6 = contrapositive). Few notice.  
     - **Handling**: If caught, note: "You avoided one pitfall—but closure assumes *all* equivalences are trivial."  

  4. **"Awareness Unfair!" Protest**:  
     - **Handling**: Lean in! Ask: "Did you *know* you lacked facts? Real agents don’t know what they’re missing."  

  5. **Friend Being Smug**:  
     - Payoff: His "normative rule" will fail in Round 2. Query Deck B requires recomputing closure—impossible under time pressure. Ask: "How would your ideal agent score *itself* on Q1–Q10? What use is a rule that can’t be applied?"  

  ---

  ### **Limitations & Frank Notes**
  - **What Works**:  
    - Long chains/tautologies/rephrasing/awareness failures emerge naturally.  
    - Scoring forces confrontation with closure.  
    - Friend’s normative move is pressured during rule-testing.  

  - **What Can’t Be Reproduced** (must state aloud):  
    - **Uncomputable Consequences**: The game uses tractable queries. Say: "Real closure includes truths no algorithm could derive (e.g., Gödel sentences)."  
    - **Rationality vs. Resources**: The game can’t split "ignorance due to boundedness" vs. "irrationality." Clarify: "Some failures *are* from boundedness (e.g., long chains), but others (e.g., not knowing tautologies) aren’t about rationality at all."  

  - **Tweaks for Safety**:  
    - Use candy/poker chips for scoring (+1 = candy, 0 = nothing) to soften frustration.  
