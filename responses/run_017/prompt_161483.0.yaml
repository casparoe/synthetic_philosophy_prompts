  We are designing a game to illustrate the problem of logical omniscience in a formal epistemology workshop. The goal is to have participants experience the gap between what they actually know (given limited time and resources) and what they would know if they were logically omniscient. We want to highlight several issues: 
    1. Long tedious chains that are computationally infeasible in the time given.
    2. Tautologies or independent statements (so that the agent should say "can't tell" for independent, but might feel pressured to guess).
    3. The same fact asked in two different ways (to show that rephrasing shouldn't matter, but in practice it might).
    4. A fact that depends on background knowledge that only half the participants have (to show the role of awareness or background knowledge).

  We also want to set up a scoring system that credits participants with the full logical closure of the booklet, so that they are "penalized" for not knowing a consequence they couldn't have derived and "credited" for lucky guesses (even if they didn't derive) and also for tautologies they might have missed.

  After the initial round, participants will be asked to write a rule for when to attribute knowledge to an agent (like themselves in the game). Then they will be tested on a held-out set of queries. We do not reveal the name of the problem until the end.

  We'll design the materials around a fictional domain. Let's choose a family will scenario because it can involve many relationships and conditions. We'll have 12 cousins and a set of conditions about who inherits what. The booklet will contain a set of statements (premises) and then a set of queries.

  We need to design:
    A. The booklet of premises (about 10-15 statements).
    B. Two sets of queries (Set A for the initial round, Set B for the held-out round). Each set will include:
        - At least one query that requires a long chain of reasoning (say 5-10 steps).
        - One that is a tautology (e.g., "Either cousin A inherits the house or cousin A does not inherit the house").
        - One that is independent of the premises (so the answer is "can't tell").
        - Two queries that are rephrasings of the same fact (to be placed at different points in the deck).
        - One that depends on a background fact that only half the participants have (so we need two versions of the booklet? Or we can hand out an extra fact to half the participants?).

  We'll do: 
    - Half the booklets have an extra premise (call it P*), the other half do not. Then one query will depend on P*.

  Alternatively, we can have the same booklet for everyone, but then during the game, we hand out an extra slip of paper to half the participants with an additional background fact. We'll do that to keep the booklet the same.

  Structure of the session (75 minutes):
    1. Introduction (5 min): Explain the game. We are testing how well you can reason under time pressure. You will get a booklet with facts and a deck of 10-15 queries. For each query, you must answer: 
          - Yes / No / Can't tell
          - Confidence: High / Medium / Low
          - And mark whether you actually derived it (with a tick) or guessed (circle? or just a separate mark? We can have a checkbox for "I derived this").
       You have 15 minutes for the entire deck.

    2. Distribute materials (5 min): 
          - Booklet of premises (same for everyone, but then half get an extra slip with one additional background fact).
          - Deck of queries (Set A) for the first round.

    3. First round: 15 minutes for answering.

    4. Collect answers and hand out scoring sheets (5 min). We will score based on the full logical closure. We have precomputed the closure (so we know the correct answers). We also have the answers that would be correct for the group with the extra background fact? Actually, we have two groups: one with the extra fact and one without. So we must score accordingly.

      How scoring works:
        For each query:
          - If the participant's answer (yes/no) matches the truth in the closure (given their booklet plus the extra fact if they had it), they get +1.
          - If they say "can't tell" and the answer is not determined by their knowledge base (i.e., in the closure it is not determined? Actually, in our closure, we have a definite answer if it is determined by their premises. But note: for the group without the extra fact, the query that depends on the extra fact is not determined. So we have to score based on the closure of the premises they were given).

        However, note: we want to score as if they are logically omniscient. So:
          - For the group without the extra fact: the closure does not include the extra fact, so for the query that requires the extra fact, the correct answer is "can't tell" (or rather, it is not determined). But wait: in the logical closure of their premises, that query is not entailed and its negation is not entailed. So they should say "can't tell". However, if they had the extra fact, then they might be able to derive it.

        But note: we are going to reveal that the scoring is based on the full closure of what they were given. So:

          For a given participant, the set of premises S (which may or may not include P*).
          The closure is the set of all logical consequences of S.

          For a query Q:
            - If S entails Q, then the correct answer is "yes".
            - If S entails not Q, then the correct answer is "no".
            - Otherwise, the correct answer is "can't tell".

        So we will score:
            - If they answered "yes" and S entails Q: +1.
            - If they answered "no" and S entails not Q: +1.
