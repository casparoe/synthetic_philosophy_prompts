answer: |-
  ## OFFICE FOR EPISTEMIC STANDARDS: DRAFT STATUTORY GUIDANCE PILOT SCHEME (EPSILON DISTRICT)  

  **1. Introduction**  
  1.1. This Guidance establishes the Epistemic Standards Pilot Scheme (ESPS) under the Accuracy in Cognition Act 2023.  
  1.2. The Scheme obliges Participating Households (PHs) within Epsilon District to submit a Quarterly Credence Return (QCR) to the Office for Epistemic Standards (OES).  
  1.3. The primary objective is the maximisation of Epistemic Utility, defined as Closeness to Truth.  

  **2. Definitions**  
  2.1. **Credence (c):** A numerical degree of belief held by a Responsible Adult (RA) within a PH, expressed as a real number on the closed interval [0,1].  
  2.2. **Approved Question Schedule (AQS):** The OES-mandated list of propositions (P₁, P₂, ... Pₙ) for which credences must be declared. (See Appendix A, Version 7.3).  
  2.3. **Strictly Proper Scoring Rule (SPSR):** The function S(c, v) used to assess Credence Returns, where v=1 if P is true, v=0 if false. An SPSR guarantees unique minimization of expected score when c equals the RA’s true credence. The Brier Score (S(c,v) = -(c - v)²) is designated for the Pilot.  
  2.4. **Calibration:** A credence assignment is calibrated if, for every value x reported across the AQS, the proportion of true propositions among those assigned x is itself x.  
  2.5. **Sharpness:** The propensity of a credence distribution to avoid values near 0.5, reflecting decisiveness.  

  **3. The Credence Return (QCR-1 Form)**  
  3.1. The Responsible Adult (RA) must declare a precise credence c for every proposition on the current AQS.  
  3.2. Declarations must be made honestly. *Note: Under the designated SPSR, reporting one’s true credence strictly dominates any other strategy for minimizing expected penalty. Dishonesty is therefore epistemically self-defeating and undetectable via scoring. Compliance relies on rational self-interest.*  
  3.3. **The Calibration Rebate (CR):** A PH achieving perfect calibration (as defined in 2.4) across its QCR receives a rebate of 5% on its annual Epistemic Utility Contribution (EUC).  
  3.4. **The Sharpness Rider (SR):** To qualify for the CR, the mean variance of reported credences across the AQS must exceed 0.05. *Rationale: Perfect calibration can be trivially achieved by reporting c=0.5 for all propositions. The SR incentivises refinement alongside calibration.*  

  **4. Epistemic Offences**  
  4.1. **Incoherence (Grade 1 Offence):** Holding and reporting a system of credences violating the laws of probability (e.g., c(A) + c(¬A) ≠ 1; c(A ∧ B) > c(A); failing to respect logical entailments listed in AQS Appendix B).  
  4.2. **Sanction:** Mandatory Epistemic Remediation Course (ERC-1). *Note: Incoherent credences are accuracy-dominated. A coherent alternative exists guaranteed to be closer to the truth across all possible worlds, irrespective of specific outcomes. No monetary loss occurs; the sanction reflects suboptimal truth-tracking.*  

  **5. The Conditionalization Imperative**  
  5.1. Upon receiving new evidence E bearing directly on proposition P within the AQS, the RA must formulate a *Plan* to update their credence in P to c(P|E) = c(P ∧ E) / c(E), provided c(E) > 0.  
  5.2. The Plan must be documented in the QCR Supplementary Log (Form QCR-1/SL).  
  5.3. *Note: The duty is to plan for conditionalization based on *current* credences. Actual future coherence (4.1) is assessed separately. This duty derives from the maximisation of expected accuracy: planning to conditionalize uniquely maximises expected epistemic utility from the perspective of the agent’s current credences.*  

  **6. Epistemic Subject-Matter Neutrality**  
  6.1. The SPSR, Calibration assessment, and Sharpness Rider apply uniformly to all propositions on the AQS.  
  6.2. Epistemic Utility accrued from a well-calibrated and sharp c=0.7 on any proposition P is deemed identical, irrespective of P's practical significance, complexity, or the RA's domain expertise. *Rationale: Closeness to truth is the sole fundamental epistemic good.*  

  **7. The "No View" Designation (Appendix C)**  
  7.1. An RA may petition the OES (Form NV-1) for a "No View" designation on a specific AQS proposition P.  
  7.2. Granting requires demonstration that P concerns matters entirely outside the RA’s conceptual framework (e.g., complex string theory propositions for non-physicists).  
  7.3. **Effect of Grant:** The RA must report c=0.5 for P on all future QCRs. *Note: This constitutes a precise credal commitment. "No View" is not suspension of judgment; it is the mandatory adoption of maximal uncertainty.*  

  **8. Appeals & Audits**  
  8.1. PHs may appeal QCR scores or OES rulings to the First-Tier Epistemic Tribunal (FTET).  
  8.2. The OES may conduct random audits of QCRs via Certified Credence Auditors (CCAs).  

  ---
  **SPECIMEN CREDENCE RETURN (QCR-1) - RA: E. CIVIS, PH: 42 MAPLE AVE.**  
  *(Auditor's Marginal Notes in [Red Italics])*

  | AQS Ref. | Proposition                                     | Declared Credence (c) | Auditor's Notes                          |
  | :------- | :---------------------------------------------- | :-------------------- | :--------------------------------------- |
  | P-734    | It will rain in Epsilon District next Tuesday.  | 0.8                   | *Supported by Wx log (QCR-1/SL pg.4).* |
  | P-891    | The number of peas in a randomly selected pod from RA's garden is even. | 0.6                   | *RA note: "Counted 12 pods: 7 even, 5 odd. Is this enough?" [Sharpness acceptable, calibration pending outcome].* |
  | P-1022   | Local bakery 'The Crusty Loaf' uses organic flour. | 0.3                   | *RA note: "Owner seems shifty." [Lacks evidential basis per SL. Refer for ERC-1? Marginal call.]* |
  | P-2045   | The neighbour's new bathroom tiles are aesthetically pleasing. | 0.5                   | *NV-1 denied (Appeal FTET/234-7). "Aesthetic judgment deemed within RA's conceptual capacity." [OES Circular 12/para 7.3b]. RA must maintain c=0.5.* |

  **Overall Score (Brier):** -0.21 *(District Avg: -0.19)*  
  **Calibration Status:** Pending Qtr-End Data. Sharpness (Variance): 0.072 > 0.05.  
  **Offences:** None identified this quarter.  
  **Auditor:** CCA #4512

  ---
  **DEPARTMENTAL SPOKESPERSON (OES):**  
  "The Pilot is a landmark step in operationalising epistemic hygiene. Truth-tracking isn't divisible. A well-calibrated credence on pea counts demonstrates the same cognitive virtue as one on medical diagnoses. The system is beautifully self-enforcing through scoring rule incentives. Concerns about 'irrelevant' questions misunderstand the fundamental, content-neutral value of accuracy."

  **CERTIFIED CREDENCE AUDITOR (CCA #4512):**  
  "Honestly? The ‘No View’ appeals are the worst. Last week I denied a physicist’s petition on P-551 (‘My spouse finds this shade of beige calming’) because colour perception is ‘within conceptual capacity’. Now they *have* to assign 0.5. It feels… perverse. And auditing subjective taste propositions? We spend hours checking if they planned to update credences based on ‘observed spouse smiles’. The paperwork is Kafkaesque, but the scoring rules *are* elegant."

  **RESIDENT (E. CIVIS, 42 MAPLE AVE):**  
  "I spent three hours agonising over the pea question. I *know* it doesn't matter. But the form demands a number, the auditor checks my pea log, and if I just put 0.5 all the time I lose the rebate and get a ‘lack of sharpness’ note. My neighbour got audited because she was too sure about the bakery's flour – they said her 0.1 wasn't ‘calibrated to available evidence’. What evidence? It’s flour! Now they make her plan how she’ll update her belief if she sees a delivery van. It’s utterly mad. But the leaflet says it’s ‘optimal for truth’."

  ---

  **Author's Note (Not for Publication):**

  **Leaning:** The satire targets the *indifference to question-worthiness* inherent in pure accuracy-first frameworks. The core implication explored is that if closeness to truth is the sole epistemic good, and scoring rules are subject-matter neutral, then assigning precise credences to trivial or non-epistemic questions (like neighbour's tiles or spouse's beige preference) becomes not just permissible, but *mandated* for optimal epistemic utility within the system. This forces individuals into quantified stances on matters where "having no view" is the genuinely rational position.

  **Canonical Reading:** It takes as canonical the view that epistemic value is *solely* a function of gradational accuracy, measured by strictly proper scoring rules, with coherence and conditionalization derived as accuracy-optimizing norms (e.g., Joyce, Pettigrew). It faithfully represents the calibration-sharpness tradeoff, the inability to police sincerity, the dominance argument for coherence, and the conditionalization-as-planning derivation.

  **Contested Claim:** The requirement to assign a credence to *every* proposition on a state-mandated schedule, especially highly subjective or trivial ones (P-2045), rests on the contested claim that *all* propositions have equal epistemic standing if included on the schedule. A defender might argue that accuracy-first frameworks can (and should) be supplemented by considerations of *salience* or *significance* (outside the pure utility calculation) to determine which propositions merit doxastic commitment. The satire highlights the framework's silence here.

  **Strongest Defender's Reply:** "The satire commits the straw man it seeks to avoid. Accuracy-first epistemology provides norms for belief *when one has beliefs*. It doesn't mandate forming beliefs on every conceivable proposition. The OES's *creation* of the AQS, forcing beliefs on trivial matters, is the problem, not the accuracy framework itself. A sensible accuracy-firster would simply not form precise credences on neighbour's tiles – they'd have no doxastic attitude, which the framework allows (though modelling this formally is tricky). The scheme's 'No View = 0.5' rule is a *bureaucratic* perversion, not an implication of the theory." (The satire retorts that the framework provides no formal tools or normative guidance *within its own terms* for when suspension/precision-abstention is warranted, making the bureaucratic perversion a plausible institutional implementation of its core indifference).
