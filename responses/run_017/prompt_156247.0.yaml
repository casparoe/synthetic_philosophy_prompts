  ### Proposed Principle: The Principle of Affirmation-Grounded Development (PAGD)

  After analyzing your verdicts and the tensions between them, I propose the **Principle of Affirmation-Grounded Development (PAGD)** as a single, unified principle to capture your intuitions. PAGD treats idealized preferences as the endpoint of a process that respects the agent's core motivational identity while allowing for transformative growth, with an emphasis on *affirmation by the agent at key stages*. The principle is stated precisely below, followed by its application to your cases, new cases, limitations, and philosophical implications.

  #### The Principle of Affirmation-Grounded Development (PAGD)
  **An agent's idealized preferences consist of the preferences held in a stable state reached through a process that:**
  1. **Enhances cognitive conditions:** Adds all relevant information, removes all incoherence (e.g., contradictions, inconsistencies), and applies full rational reflection (e.g., perfect reasoning, no biases).
  2. **Preserves motivational grounding:** Every preference in the endpoint must be traceable to at least one element in the agent's *current motivational system* (e.g., existing desires, values, or affective dispositions). "Traceable" means there is a defensible causal or rational pathway from current motivations to the endpoint preference, even if the connection is indirect (e.g., through analogy, extension, or natural development).
  3. **Requires stepwise affirmation:** Each change in preferences during the process must be endorsed by the agent *at that step* as an improvement, with endorsement defined as reflective affirmation (not mere acceptance) under the enhanced cognitive conditions of that step. Steps may include:
     - Cognitive enhancements (information, reasoning).
     - "Integrative experiences": Life experiences that engage the agent's existing motivational system (e.g., relationships, challenges, or creative acts), provided they are not externally manipulated (e.g., drugs or brain implants).
  4. **Converges uniquely:** The endpoint must be the same regardless of the order of cognitive enhancements or integrative experiences. If multiple endpoints are possible, none qualify as idealized preferences (they are underdetermined).

  **Key motivations from your cases:**
  - **Clause 1 (Enhances cognitive conditions):** Captures cases 1 (smoker: information/reflection leads to change) and 2 (apostate: information/reflection overrides current self's disapproval). Explicitly excludes non-cognitive influences like direct manipulation (case 5).
  - **Clause 2 (Preserves motivational grounding):** Captures case 7 (no new sensory values: no seed in current motivations) and case 3 (depression: no stable motivational link to the depressed state). Allows case 4 (fatherhood: connects to existing capacities for care or bonding).
  - **Clause 3 (Requires stepwise affirmation):** Captures case 4 (fatherhood: experience integrates with existing motivations and is affirmed) and excludes case 5 (drug: no endorsement at steps). Resolves case 3 (depression: no affirmation during the process).
  - **Clause 4 (Converges uniquely):** Resolves case 6 (information order: if endpoints differ, neither is idealized). Also supports case 9 (group convergence: unique agreement enables adoption, while incompatibility requires compromise).

  **Group extension:** For multiple agents, the merged volition is the preference that all agents' idealized selves would agree on under conditions of full information and rational discourse. If their idealized preferences diverge, a fair compromise is used; if they converge independently on a new value, that value is adopted.

  ### Application to Your Cases
  PAGD delivers verdicts consistent with your intuitions in 8/9 cases, with one trade-off (case 8):
  1. **Smoker (Yes):** Affirmed under enhanced cognition (clauses 1, 3).
  2. **Apostate (Yes):** Affirmed despite current self's disapproval; grounded in current motivations (e.g., truth-seeking) (clauses 1, 2).
  3. **Depressed person (No):** Not motivationally grounded (depression distorts core motivations) and not affirmed during recovery (clauses 2, 3).
  4. **Father (Yes):** Integrative experience (fatherhood) engages existing motivations (e.g., capacity for love) and is affirmed (clauses 2, 3).
  5. **Mood-altering drug (No):** Not motivationally grounded (no seed) and not endorsed stepwise (clauses 2, 3).
  6. **Information order (No verdict for either endpoint):** Endpoints are not unique, so neither qualifies (clause 4). *Your verdict was missing; PAGD provides one.*
  7. **Aesthetic sensibility (No):** Not motivationally grounded (no seed for new sensory values) (clause 2).
  8. **Advance directive (Not binding):** The directive is part of the *current* idealized preferences but is overridden by the apostate endpoint, which is motivationally grounded and affirmed. *Trade-off: PAGD rejects your instinct that this "counts for something" in favor of consistency with case 2.*
  9. **Group extrapolation:**
     - **9a (Incompatible → compromise):** No convergence, so compromise (group extension).
     - **9b (Convergent → adopt):** Unique convergence on a new value (clause 4).

  ### Verdicts on New Cases (Derived from PAGD)
  - **Six-year-old:** Idealized preferences are those of an adult developed through cognitive enhancement and integrative experiences (e.g., education, play). Preferences must trace to current motivations (e.g., curiosity → love of learning). *Verdict: Discovered, with radical change possible but grounded in seeds like imagination or social needs.*
  - **Advanced dementia:** Current preferences are fragmentary, so idealized preferences are undefined (violates clause 2: no stable motivational grounding). Fall back to preferences expressed during last coherent state. *Verdict: Preferences from pre-dementia period are used, as they are the most recent affirmable state.*
  - **Population split (51% vs. 49%):** No convergence, so merged volition is a fair compromise (e.g., weighted average or proportional allocation). *Verdict: Compromise required; majority does not override.*
  - **Agent wants to be switched off:** If the endpoint is stable, motivationally grounded (e.g., in a desire for non-existence or successor values), and affirmed, it is idealized. *Verdict: Yes, honor the preference.*

  ### Limitations and Trade-offs
  PAGD captures all your verdicts except **case 8 (advance directive)**, which it cannot fully accommodate. Here's why:
  - **What it sacrifices:** Your instinct that the advance directive "should count for something" conflicts with case 2 (apostate). PAGD prioritizes the *endpoint affirmation* (case 2) over *prior meta-preferences* (case 8) because:
    - Clause 3 (stepwise affirmation) requires continuous endorsement during development, but the apostate endpoint does not affirm the directive.
    - Clause 2 (motivational grounding) favors the apostate's motivations as more developed and coherent.
    - Allowing the directive would undermine the unique convergence (clause 4) by binding the future to an unendorsed state.
  - **Why you were tempted:** Case 8 appeals to autonomy and respect for current commitments, but PAGD interprets "idealization" as a process of *becoming*, not *binding*. Your intuition might stem from real-world norms (e.g., legal advance directives), but PAGD treats idealized preferences as discovery, not construction (see below).
  - **Other limitations:**
    - **Vagueness in "integrative experiences":** Case 4 (fatherhood) is included, but PAGD doesn't precisely define what counts as "integrative." This risks arbitrariness (e.g., is a near-death experience "integrative"?).
    - **Underdetermination in case 6:** PAGD rejects both endpoints, which may be unsatisfying for alignment (no clear action). However, this is necessary for consistency—forcing a choice would violate uniqueness.
    - **Group compromises:** Fairness in compromises (case 9a) is underspecified and may require external principles.

  ### Philosophical Stance: Discovery vs. Construction
  PAGD treats idealized preferences as **discovered** about a person, not constructed:
  - **Argument from cases:** Preferences are fixed by the agent's current motivational system (clause 2) and cognitive enhancements (clause 1), which are objective. Cases 1–4 and 7 show preferences emerging from the agent's "seeds," not external imposition. Construction would allow more flexibility (e.g., case 8's directive), but PAGD rejects this to preserve grounding.
  - **Predicts limits on change:** Changes are constrained by existing motivations (clause 2). For example:
    - A person with no empathy seeds cannot develop idealized preferences for universal altruism (case 7).
    - Changes can be radical (case 4: childless to family-oriented) but must be traceable (e.g., latent capacities for bonding).
  - **Process matters:** Stepwise affirmation (clause 3) ensures the agent "owns" the change, preventing foreign impositions (case 5). The endpoint must be unique (clause 4) to avoid arbitrary construction.

  PAGD simplifies your tentative rule by removing the ban on altering affective dispositions (your clause ii) and emphasizing affirmation and uniqueness. It explains why case 4 (fatherhood) is included (affirmed, grounded) while case 3 (depression) is excluded (not grounded), resolving your tension. The cost is rejecting case 8's advance directive, but this maintains coherence with your core intuition in case 2.
