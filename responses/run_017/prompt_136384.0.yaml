prompt: |-
  I'm a novelist and I've written myself into a corner, and I'm hoping someone finds it fun rather than annoying.

  Setup, short version. A couple of centuries out in my book there's life on another planet — not microbes, a whole biosphere — and the plot hangs on a legal question: there's a conservation instrument that protects kinds of organism, and somebody has to certify how many kinds there are before a mining concession goes through. So my characters need a species concept. Which means I need to know what a species concept is even supposed to do, because right now every argument in my draft is people reciting defintions at each other and it reads like a wikipedia page with dialogue.

  So: give me the requirements list, not the answer. What does a species concept have to deliver to count as adequate — and adequate for what, since I get the sense that's half the fight. The cases it has to get right, the distinctions it isn't allowed to collapse, whatever bits of actual biology it can't flatly contradict. For each requirement I want the case or consideration behind it, i.e. why it's a requirement and not just something one camp happens to like. And mark which are non-negotiable and which are preferences of particular schools.

  Three different jobs are pulling on the concept in my book, and I suspect they pull different ways:

  1. The lawyers need a number and a list, and the list has to stay still long enough to be litigated.
  2. The mining company's scientist says none of this matters, all anyone needs is to know which organisms will respond the same way to what they're about to do — so the concept has to license inductive generalizations, not just label things.
  3. My point-of-view character is a field naturalist who has to make the call in the field, with what's in her pack and a slow handheld sequencer, on an organism she may only ever see once.

  Tell me which requirements come from which job, and whether any of those jobs is making a demand that a species concept shouldn't be asked to meet at all.

  The biosphere I've given them, which is were I think I've made it hard on myself:

  - Nothing has sexes. Individuals bud off propagules, but two grown individuals can also fuse, and their genomes recombine into one organism.
  - Fusion isn't confined within anything recognisable. A sessile filter-feeding mat and a motile grazer that look like they belong to different phyla fuse as a matter of course, and the fused product can bud offspring of either body plan.
  - There's a virus-like shuttle that moves whole packets of chromosomes between organisms that never fused with anything. So different genes tell different family trees, and the trees disagree.
  - Development is switched by diet and temperature: one genome can produce three or four adult forms that don't look related, and these aren't life stages — they don't turn into each other. Which one you get depends on what you ate as a propagule.
  - The ecologically dominant organism on the planet is a persistent swarm of intermediates between two otherwise perfectly recognisable forms. It has been stable for as long as anyone has been watching, it isn't a transient at a contact zone, and it is exactly the thing that would be wiped out by the mine.
  - And they can't rule out that the mats and the grazers had separate origins in the first place — more than one tree of life on the planet — with the shuttles moving genes between the trees anyway.

  Two things I especially want. First: which of the requirements on your list are really just terran parochialism, things that look mandatory only because Earth life happens to be built a certain way, versus which any concept would have to meet anywhere? Second: which two requirements on the list can't be had together? If the honest answer is that my biosphere makes the full list unsatisfiable, that's a gift, I can build a scene around it — so say so explicitly rather than papering over it.

  There also seem to be two questions tangled together in every argument I've drafted — how many kinds there are, and which kind this particular animal belongs to — and I want to know whether a concept has to answer both, and whether settling one settles the other.

  At the very end, a one-line scorecard is fine — the interbreeding one, the look-alike one, the family-tree one, the niche one, and whatever the lineage-first people call theirs — but only one line each, and only if it doesn't crowd out the criteria. The criteria are what I'm paying for.

  Then finish with a single line I can paste into a spreadsheet:

  \answer{<the one requirement that knocks out the most candidate concepts, in six words or fewer> | <yes/no: can every non-negotiable requirement on your list be met at once in a biosphere like this one>}
reasoning: |-
  Hmm, the user is a novelist who's written a complex alien biosphere and needs help with a species concept for their story. They've set up a scenario where legal, industrial, and scientific perspectives clash over defining species, and they want to understand the fundamental requirements of any species concept. 

  First, I need to unpack why species concepts are messy even on Earth. The core tension is between three biological realities: evolution creates continuous change, but we need discrete categories for practical purposes (like conservation laws). Different scientific fields prioritize different aspects - a field ecologist cares about observable traits, while a geneticist cares about gene flow. This disconnect is amplified in their alien biosphere with horizontal gene transfer, developmental plasticity, and organism fusion.

  Their biosphere deliberately breaks every Earth-centric assumption: no sexes, rampant hybridization across body plans, environmental morphs, persistent hybrid swarms, and potential multiple origins of life. That's brilliant worldbuilding but a taxonomic nightmare. The key is recognizing that no single concept can handle all this - the conflict isn't just academic but fundamental to their plot.

  For requirements, I should separate universal needs from Earth-biased ones. Universally, any concept must: 1) support inductive predictions (or conservation fails), 2) allow field identification (or the naturalist can't work), and 3) produce stable lists (or laws become unenforceable). Earth biases like requiring sexual reproduction or monophyletic trees don't apply here.

  The unresolvable conflicts jump out: stability vs accuracy (lawyers want fixed lists but evolution is fluid), and generality vs practicality (mining company wants predictive groups but field IDs may not predict mining impacts). Most damningly, gene flow and lineage coherence are impossible to define when organisms fuse and swap genomes promiscuously. 

  I'll structure this as: core functions first (what concepts must do), then implementation challenges (what makes it hard), then which stakeholder needs create tension. Crucially, I'll flag where their biosphere violates biological prerequisites - like how frequent horizontal transfer breaks the "cohesive gene pool" requirement underlying most concepts. The takeaway should be that satisfying all stakeholders is impossible, which is perfect for their dramatic needs.

  For the finale, that six-word requirement that breaks everything has to be "Cohesive gene pool definition impossible" with a hard "no" on satisfying all requirements. The naturalist will have to make a judgment call that pleases nobody - which is exactly where good fiction lives.
answer: |-
  Here's the requirements list for a species concept, broken down by core functions, implementation demands, and stakeholder conflicts. Your alien biosphere brilliantly violates the unspoken assumptions behind most Earth concepts, making the core tensions unavoidable. **The short answer is no, a single concept cannot satisfy all non-negotiable requirements simultaneously in this biosphere.** The final scorecard and one-liner are at the end.

  ### Core Functions (What a Species Concept MUST Do to Be Biologically Adequate)
  1.  **Delimit Cohesive Evolutionary Units (Non-negotiable):** It must identify populations evolving independently *in some meaningful way*. *Why?* Biology's fundamental unit for evolution and diversity. Without this, "species" is just arbitrary grouping.
      *   *Case:* Lions and tigers can hybridize (ligers), but distinct evolutionary trajectories are maintained in nature. Collapsing them ignores real biodiversity.
      *   *Biosphere Stress Test:* Fusion across wildly different forms, gene shuttles, and potential multiple origins make "independent evolution" chaotic and lineage-based coherence impossible.

  2.  **Support Inductive Generalization (Non-negotiable):** Knowing an organism's species must allow reasonably reliable predictions about its biology (physiology, ecology, behavior, response to threats). *Why?* Science and conservation rely on inference. A concept failing this is useless for applied biology.
      *   *Case:* Knowing a bird is a Bald Eagle lets you predict its diet, nesting habits, and susceptibility to DDT. A concept grouping eagles with similar-looking but ecologically distinct hawks fails.
      *   *Biosphere Stress Test:* Environmentally triggered morphs (one genome → multiple ecologies) and fusion products directly violate this. Predicting the response of a fused mat-grazer entity to mining based on either "parent" is impossible. The stable swarm *is* the ecologically relevant unit, but isn't a "kind" by most definitions.

  3.  **Provide Operational Criteria for Identification (Non-negotiable):** There must be a method (morphology, genetics, behavior, etc.) to assign individuals to a species consistently and relatively unambiguously *in practice*. *Why?* Science requires testability and repeatability. A concept you can't apply isn't a scientific concept.
      *   *Case:* The Morphological Species Concept works for fossils. The Biological Species Concept (reproductive isolation) fails for asexuals or cryptic species.
      *   *Biosphere Stress Test:* A single propagule genome can produce radically different adult forms. A fusion product is unique. Individuals might only be seen once. What operational trait (genetic, morphological, ecological) reliably defines a "kind" here? The sequencer might show conflicting gene trees.

  ### Implementation Requirements (Practical Demands - Often Conflicts)
  4.  **Stability (Context-dependent Negotiable):** The classification shouldn't shift dramatically with minor new data *within the timeframe of its intended use*. *Why?* Legal frameworks, conservation plans, and scientific communication require consistency. Extreme fluidity makes lists meaningless.
      *   *Job:* **Lawyers NEED extreme stability.** Litigation and permits require fixed entities.
      *   *Biosphere Stress Test:* Fusion, gene shuttles, and environmentally cued morphs make stability biologically unrealistic. Forcing stability (e.g., defining "kinds" purely by core genome ignoring expression/fusion) violates Core Function 2.
  5.  **Applicability Across Diversity (Non-negotiable in principle, often negotiable in practice):** It should work for microbes, plants, animals, fungi, etc. *Why?* A universal concept of biodiversity is the goal. Excluding major groups is unsatisfying.
      *   *Case:* The Biological Species Concept fails utterly for asexual bacteria.
      *   *Biosphere Stress Test:* The concept *must* handle fusion across "phyla", gene shuttles, and environmental morphs simultaneously. Most Earth concepts fail parts of this.
  6.  **Handle Hybridization/Introgression (Non-negotiable boundary case):** It must deal with entities that blur lines (hybrid zones, stable hybrids, lateral gene transfer). *Why?* Common in nature; ignoring them misrepresents reality.
      *   *Case:* Canids, oaks, corals have complex hybridization. Denying their existence is unscientific.
      *   *Biosphere Stress Test:* The *entire dominant organism is a stable hybrid swarm*. Fusion *is* the norm. Gene shuttles *are* rampant introgression. This isn't a boundary case; it's the core biology. Any concept must confront this head-on.

  ### Stakeholder Jobs & Their (Problematic) Demands
  *   **Lawyers (Need a Stable Number/List):**
      *   **Demands:** *Extreme Stability (#4)*, Clear Delimitation (#1 - interpreted rigidly), Enforceable Operational Criteria (#3 - must be simple/definitive).
      *   **Problematic Ask:** Demanding Stability (#4) in a biosphere inherently defined by fluidity (fusion, morphs, shuttles). They are essentially asking biology to freeze-frame an evolving, fluid system for legal convenience, violating Core Function #1 (true evolutionary units) and #2 (predictive power). *Can a concept deliver this?* Only by imposing arbitrary, biologically unrealistic boundaries (e.g., defining "kinds" solely by propagule genome, ignoring all fusion/morphs). This sacrifices Core Functions 1 & 2.
  *   **Mining Company Scientist (Need Predictive Groups for Impact):**
      *   **Demands:** *Strong Inductive Generalization (#2 - paramount)*, Operational Criteria (#3 - for monitoring).
      *   **Problematic Ask:** Assuming that *any* species concept based on phylogeny or morphology will *automatically* predict response to a *specific* novel threat (mining). This is often untrue even on Earth (e.g., closely related species can have different pollutant tolerances). *Can a concept deliver this?* Only if the concept is *explicitly defined by response to the specific threat* ("Mining Impact Groups"), not by intrinsic biology. A general species concept won't guarantee this. The environmental morphs and fusion products make this even harder – the *same genome* might have different responses depending on its morph, and a fusion product's response is unpredictable.
  *   **Field Naturalist (Need Field ID & Assignment):**
      *   **Demands:** *Practical Operational Criteria (#3 - paramount)*, Applicability (#5 - must work for what she sees), *some* support for generalization (#2).
      *   **Problematic Ask:** Making definitive calls *on individuals seen once* in a system where fusion creates unique entities, morphs look unrelated, and genetics show conflicting histories. *Can a concept deliver this?* Only with immense difficulty and high error rates. She likely needs a *pragmatic* concept prioritizing observable traits/morphs *in that environment* for that *specific survey*, knowing it might not reflect deep biology or predict mining impact accurately. Sequencing one gene might be useless.

  ### Terran Parochialism vs. Universal Requirements
  *   **Parochial:** Assumption of biparental sexual reproduction & recombination as the primary/only source of genetic novelty and cohesion (violated by fusion, gene shuttles). Requirement for monophyly (clean single trees - violated by shuttles/fusion/multiple origins). Expectation that morphology reflects phylogeny closely (violated by environmental morphs). Expectation that hybridization is rare/unstable (violated by the dominant swarm).
  *   **Universal:** **Core Functions 1, 2, and 3 are universal.** Anywhere life evolves and interacts with its environment, you need to identify coherent evolving units, make predictions about them, and have a way to recognize them. Implementation Requirements 4, 5, and 6 are also universal *problems* any concept must address, even if solutions vary.

  ### Unresolvable Conflicts in Your Biosphere
  1.  **Stability (#4) vs. Accurate Evolutionary Units (#1) & Predictive Power (#2):** You CANNOT have a stable list AND accurately capture the fluid, fusion/morph-driven evolutionary units AND have that list reliably predict responses. **Pick two, but not all three.** The lawyers demand all three – impossible.
  2.  **Cohesive Gene Pool (implied by #1) vs. Rampant Horizontal Gene Flow (Shuttles/Fusion):** Defining a "cohesive unit" is impossible when genetic material flows promiscuously between entities with wildly different forms and histories. Core Function #1 collapses.
  3.  **Single Genome Identity vs. Multiple Ecological Realities (Morphs):** One propagule genome ≠ one predictable ecological entity. This fatally undermines Core Function #2 (Inductive Generalization) unless morphs are defined as separate "species," which then violates stability (#4) and potentially the unity of the genome (#1).

  ### The "How Many Kinds" vs. "Which Kind is This" Tangle
  *   A species concept *must* provide a framework for **both**.
  *   Defining "what *is* a species" (the concept) logically precedes and informs "how many species are there" (delineation) and "which species is *this*" (identification). However:
  *   **Settling the concept does NOT automatically settle the number or the ID.** Different concepts applied to the same organisms yield different numbers. Even within one concept, operational thresholds (e.g., genetic distance for species) are often arbitrary. Identification requires applying the concept's operational criteria to the individual.
  *   **In your biosphere:** The fundamental disagreement over *which concept to use* (driven by the stakeholder conflicts above) directly causes irreconcilable answers to "how many" and "which one." One concept might see the stable swarm as one species (ecologically cohesive), another as many hybrids (based on propagule genomes/morphs), another as an irrelevant transient phenomenon.

  ### Species Concept Scorecard (One-Line Critiques for Your Biosphere)
  *   **Biological (Interbreeding):** *Requires reproductive communities.* **Fails:** No sexes, rampant fusion/gene flow across forms, asexual budding.
  *   **Morphological (Look-alike):** *Groups by observable similarity.* **Fails:** Environmentally triggered morphs look unrelated; fusion creates unique chimeras.
  *   **Phylogenetic (Family-Tree):** *Requires monophyly (shared unique ancestor).* **Fails:** Gene shuttles/fusion create network, not tree; multiple origins; conflicting gene trees.
  *   **Ecological (Niche):* *Groups by shared adaptive zone.* **Partially Works:** Captures the stable swarm & maybe morphs functionally. But: Fusion products occupy novel niches; hard to define "niche" operationally; doesn't reflect evolutionary origins (Core #1 weak).
  *   **Evolutionary/Lineage (General Lineage Concept):** *Species = segments of metapopulation lineages.* **Best Fit?** Focuses on lineages evolving independently. But: Rampant fusion/gene shuttles *obliterate* clear lineage segments. Defining independent evolution (#1) remains impossible. Pragmatic lineage definitions would be arbitrary.

  ### The Final Spreadsheet Line
  \answer{Cohesive gene pool definition impossible | no}
