prompt: |-
  I teach an upper-level undergraduate seminar called "Concepts, Categories, and Analogies," cross-listed between philosophy and cognitive science: fourteen students, one ninety-minute session, whiteboard and paper only, no laptops. Last week we read about the Copycat project — the model of analogy-making built by Douglas Hofstadter, Melanie Mitchell, and colleagues at the Center for Research on Concepts and Cognition in the late 1980s, with its slipnet of concepts joined by weighted links whose effective weights shift as activation spreads, its population of codelets competing probabilistically to build and destroy structures in a workspace, its parallel terraced scan, and its temperature parameter governing how much run-to-run variation the system shows — all of it operating inside a deliberately tiny microdomain, answering problems of the form "abc is to abd as ijk is to what?". The students more or less followed the architecture, but they didn't feel anything. Several left saying, in effect, that the rule is obvious — advance the last letter one step along the alphabet — and that the machinery is overkill for it. A colleague who teaches the cognitive science side of the course thinks any exercise I build will look to them like a puzzle session with no answer key, and I half agree with her, which is part of why I'm asking.

  What I want them to run into, rather than be told, is this: a case where "advance the last item one step" has no answer at all, where the only way forward is to let a concept slide into a neighbour — forward into backward, or "one step along the alphabet" into "one more of the same", or "the last item" into "the extreme item" or into "the string as a whole" — followed by the vertigo of there being several defensible slides and no fact of the matter about which is right, and then the discovery that which slide feels natural depends on what they saw five minutes earlier. By the end of the session I want three things to have been discovered rather than asserted: that which relation counts as "the same relation" is not read off the two strings but constructed; that a concept's boundary is set by what neighbours it has; and that a system which slips needs some principled and context-sensitive way of choosing among candidate slips, because "be creative" is not a rule.

  My own sketch, which I'd like you to develop, correct, or replace: run the whole thing in a made-up microdomain so that their fluency with the real alphabet does no work — an alphabet of six symbols in a stated order, say B, F, K, M, Q, X with B first and X last, with items being short strings over it. A silent individual first round: a warm-up where the successor rule is uncontroversial, then an item where the last symbol is X and the rule dead-ends, then a nastier item where every symbol is X. A second, primed round: split the class, give half a handout whose example pair quietly establishes the backward slide and half a handout whose pair establishes the lengthening slide, then give both halves the same target item and compare the answer distributions. A wagering round in which teams spend points predicting the modal answer of the class as a whole, so that "there is no fact of the matter" and "some answers are nonetheless more probable" both become concrete at once. And possibly a temperature round: the same item answered twice, once under instructions to be as obvious as possible and once under instructions to be as inventive as you can while still being able to defend it, so the spread visibly widens.

  What I need from you is a runnable plan. The microdomain itself: the alphabet, the worked example pairs, and the ordered item list, with a note on why each item sits where it does and where the collapse is supposed to land. The priming manipulation written up as two printable handouts, plus how to keep the split from leaking before the reveal and what to do if it leaks anyway. A payoff scheme for the wagering round that needs no money and cannot be gamed by a team that just copies whoever speaks loudest. A debrief of roughly twenty minutes that maps specific moments of the session onto specific pieces of the architecture — slippage, the slipnet's weighted links and time-varying activation, the probabilistic competition among codelets, temperature — and that names the tension between "no fact of the matter" and "some answers are better than others" explicitly instead of resolving it for them.

  Finally, two honesty notes. First, tell me what will predictably go wrong: the student who announces one rule early and dominates the room, the student who refuses to answer on the grounds that the question is ill-posed, the risk that the endpoint cases collapse in the first round before the priming has any chance to work, and the timing. Second, be frank about which features of the architecture the exercise cannot reproduce, so I know what I will have to say myself: I assume the graded, massively parallel, sub-symbolic competition is one of them, but tell me the others, and tell me how much it matters that they are missing.
reasoning: |-
  We are designing a classroom exercise to illustrate key concepts from the Copycat project. The goals are for students to discover:
  1. Relations are constructed, not read off the strings.
  2. Concept boundaries are set by neighboring concepts in a network.
  3. Systems need a principled, context-sensitive way to choose among candidate slips.

  The exercise uses a custom microdomain to avoid real-alphabet fluency. We'll use a six-symbol alphabet: B, F, K, M, Q, X (in that order, with B first and X last).

  **Structure of the Session:**
  1. **Silent Individual Round (15 minutes):** 
     - Students work individually on a series of problems on paper. 
     - Problems are designed to start easy and then hit dead-ends to force slippage.

  2. **Primed Group Round (20 minutes):**
     - Split class into two groups (Group A and Group B). 
     - Each group gets a different priming handout with an example that establishes a different slippage (backward vs. lengthening).
     - Then both groups solve the same target problem and we compare answers.

  3. **Wagering Round (15 minutes):**
     - Students form small teams (2-3 students). 
     - Teams wager points on predicting the modal answer of the entire class to a new problem.

  4. **Temperature Round (10 minutes):**
     - Students solve the same problem twice: once for "obvious" and once for "inventive" (with defense).

  5. **Debrief (20 minutes):** 
     - Connect the exercise to Copycat's architecture and the three learning goals.

  **Microdomain Details:**
  Alphabet: B, F, K, M, Q, X (order: B < F < K < M < Q < X)
  Successor relationships: B→F, F→K, K→M, M→Q, Q→X. Note: X has no successor.

  **Problem Set for Silent Individual Round:**
  1. Warm-up (successor rule works): 
     - Example pair: `BF` : `BK` 
       - Explanation: The last letter F is replaced by its successor K. So `BF` becomes `BK`.
     - Target: `FK` is to ? 
       - Expected: `FM` (last letter K→M)

  2. Dead-end (last symbol is X):
     - Example pair: `BQ` : `BX` 
       - Explanation: Last letter Q→X. 
     - Target: `MX` is to ? 
       - Problem: Last letter is X, which has no successor. How do they handle it?

  3. Nastier (all X's):
     - Example pair: `X` : ? 
       - There is no example pair. The problem is: `X` is to what? 
       - Then: `XX` is to what? 
       - Then: `XXX` is to what? 
       - We are interested in how they handle a string of all X's.

  But note: We want to set up a situation where the rule dead-ends and then the all-X case. However, we must avoid having the entire class converge on one solution in the first round. Therefore, we might adjust the order or the problems.

  Revised Silent Round Problems (on a worksheet):

  Problem 1 (warm-up): 
    Given: `BF` is to `BK`
    Then: `FK` is to ____ ?

  Problem 2 (dead-end):
    Given: `BQ` is to `BX`
    Then: `MX` is to ____ ?

  Problem 3 (nastier):
    Given: `X` is to ____ ? 
    Then: `XX` is to ____ ? 
    Then: `XXX` is to ____ ?

  But note: Problem 3 might be too open and we risk having the priming not matter. Alternatively, we can have:

  Problem 3: `KX` is to ____ ?

  Because `KX` has an X at the end. But we already did `MX`. So let's try a different one.

  Alternatively, we can have a problem that is not just about the last letter but might encourage thinking about the whole string.

  Let me design a sequence that leads to the need for slippage without priming.

  **Adjusted Silent Round:**
  1. `BF` → `BK` (so `FK` → `FM`)
  2. `BQ` → `BX` (so `MX` → ?) -> dead-end at X
  3. `X` → ? -> dead-end, but now we have a single X. We hope they try something.
  4. `XX` → ? -> even more pressure.

  But we don't want to prime them with our example. So we just present the problems without any example for the last two? Or we can have:

  Worksheet for Silent Round:

  "Consider the following pairs. For each pair, the left side is transformed to the right side by some rule. Then, for the next line, apply the same rule to the new left string to get the right string."

  Pair 1: 
    `BF` becomes `BK`

  Then: 
    `FK` becomes ____  (they write `FM`)

  Pair 2: 
    `BQ` becomes `BX`

  Then:
    `MX` becomes ____  (they might write nothing, or something else)

  Pair 3: 
    `X` becomes ____  (they must invent)

  Then:
    `XX` becomes ____ 

  Then:
    `XXX` becomes ____ 

  We then collect the answers for `MX`, `X`, `XX`, `XXX` to see the variation.

  But note: We are going to prime them in the next round. So in the silent round, we just want to set up the problem and have them experience the dead-end and the need to slip.

  **Priming Round:**
  We split the class into two groups and give each a handout with a different example that establishes a slippage.

  Group A (Backward group):
    Example: `X` is to `Q`  [because when you can't go forward, you go backward? So the rule becomes "change the last letter to its predecessor"]
    Then they get the target: `KX` is to ____ ?

  Group B (Lengthening group):
    Example: `X` is to `XX`  [because when you can't change the last letter, you add another X? So the rule becomes "add one more of the same"]
    Then the same target: `KX` is to ____ ?

  We then ask both groups to write their answer for `KX` → ? and collect. Then we compare the two groups: Group A will tend to say `KM` (if they apply backward to the last letter) or `KQ`? Wait, but the example for Group A: `X`→`Q` (predecessor of X is Q). So for `KX`, they would replace X with Q -> `KQ`.

  Group B: `X`→`XX`, so `KX`→`KXX`.

  Then we reveal the two different answer sets.

  But note: We must avoid leakage. We can have the handouts on colored paper and collect the answers on the same colored paper? Then we can separate by color. Or we can have them write on a piece of paper that says Group A or Group B and collect without showing each other.

  Alternatively, we can have them work in two separate corners and then bring the answers to the front.

  **Wagering Round:**
  We form teams (2-3 students). We present a new problem: e.g., `QX` is to ____ ?

  But note: We want them to predict the modal answer of the entire class. So we ask: What will be the most common answer to `QX` → ? 

  Each team gets 10 points. They can wager any integer amount (0 to 10) on one or more answers. If their chosen answer is the modal one, they gain the wagered points; if not, they lose the wagered points. They can split their wager among multiple answers, but the total wagered cannot exceed 10.

  Example: They might wager 7 on `KM` and 3 on `KQ`. If the modal answer is `KM`, they get +7 and -3? No, that doesn't work. Alternatively, they can choose one answer and wager on that. And if that answer is the mode, they get the wager added; if not, they lose the wager. They cannot wager on more than one.

  To prevent gaming: We can have them write down their wager and their answer on a slip without talking to other teams. Then we collect and only then reveal the problem and have everyone write their answer. Then we compute the mode and then settle the wagers.

  But note: We don't want to use money, so points are fine.

  Problem for wagering: We can use `QX` → ? 

  This is similar to `KX` but might be influenced by the previous priming? We want the entire class to answer, so we can do:

  Step 1: Teams wager on what they think will be the modal answer for `QX` → ? 
  Step 2: Then every student in the class writes their answer for `QX` → ? (individually)
  Step 3: We tally the answers and find the mode (or modes, if tie).
  Step 4: Teams that wagered on the mode get their wager added to their score. Others lose the wager.

  But note: The teams are making a prediction about the entire class, so they must think about what the class as a whole will do. This captures the idea that there is no fact of the matter but some answers are more probable.

  **Temperature Round:**
  Present: `XX` → ? 
  First, under "obvious": What is the most obvious, straightforward answer? (They write)
  Then, under "inventive": What is the most inventive answer you can come up with, but you must be able to defend it? (They write)

  Then we can collect and show the spread of answers for the same problem under different instructions.

  **Debrief (20 minutes):**
  - Start by asking what happened in the silent round: How did they handle `MX`? `X`? `XX`? 
  - Then: How did the priming affect them in the second round? (They saw two different patterns and then applied them to the same string.)
  - Wagering: Why did they wager the way they did? What did they think the class would do? Why is there a modal answer even when there's no fact?
  - Temperature: How did the instructions change their answers?

  Then map to Copycat:
  - Slippage: When they couldn't apply the rule (at X), they slipped to a neighboring concept (backward or lengthening). This is like activation spreading to neighbors in the slipnet.
  - Weighted links: The priming handout gave more activation to one slippage (backward or lengthening) so that concept was more active. This is like the slipnet's weights and activation.
  - Probabilistic competition: In Copycat, codelets probabilistically build structures. Here, the students' minds are generating multiple possibilities and one "wins". The priming made one possibility more likely.
  - Temperature: In the temperature round, when they were inventive, they allowed more distant slips? This corresponds to higher temperature in Copycat, which allows more exploration.

  Tension between "no fact of the matter" and "some answers are better": 
  - In Copycat, the system settles on an answer that is coherent with the current context (the example pairs). Similarly, in the exercise, the context (priming) made some answers feel more natural. But without a fixed rule, there is no unique right answer. However, the system (or the class) converges on answers that are culturally shared or contextually primed.

  **What could go wrong:**
  1. A student announces early: "It's obvious, you just go backward when you hit X!" in the silent round. 
     - Mitigation: Emphasize silent work. If it happens, note it and use it in debrief: "Some of you might have thought of backward, but let's see what others did."

  2. Student refuses: "This is ill-posed, there is no rule." 
     - Mitigation: Encourage them to write what they think most people would do, or what they feel is the most natural. In the debrief, this is a valid point and we can discuss how Copycat handles such cases.

  3. Endpoint cases collapse in the first round: Everyone does the same thing (e.g., all write `X` becomes nothing? or `XX` becomes `XX`? or they all go backward). 
     - This is a risk. We hope that without priming, there will be variation. If not, the priming round should still show the effect of context.

  4. Timing: The session is 90 minutes. 
     - Silent round: 15 min
     - Priming round: 20 min (split, read handout, solve, collect and compare)
     - Wagering: 15 min
     - Temperature: 10 min
     - Debrief: 20 min
     - Total: 80 min. Leaves 10 min buffer.

  **What the exercise cannot reproduce:**
  - Graded, massively parallel, sub-symbolic competition: The exercise is serial and symbolic. Students think one thought at a time, while Copycat has many codelets running in parallel.
  - The slipnet's continuous activation spreading: We have a discrete prime (handout) that sets a direction, but not the gradual spreading.
  - The probabilistic nature of codelets: We have students making a choice, but not a stochastic process.
  - How much it matters: The exercise is meant to illustrate the concepts at a high level. The details of the architecture are not fully modeled, but the key ideas (slippage, context-dependence, no fact of the matter) come through. For an upper-level seminar, this might be enough to spark discussion and then you can explain the underlying machinery.

  **Handouts for Priming Round:**

  Handout for Group A (Backward group):

  "Consider the following example of a transformation:

  Original: `X`
  Transformed: `Q`

  Explanation: When a string ends with X, which has no successor, we change the last letter to its predecessor (which is Q). 

  Now, using the same rule, what should the transformed string be for:

  Original: `KX`
  Transformed: ______ "

  Handout for Group B (Lengthening group):

  "Consider the following example of a transformation:

  Original: `X`
  Transformed: `XX`

  Explanation: When a string ends with X, which has no successor, we add another X at the end. 

  Now, using the same rule, what should the transformed string be for:

  Original: `KX`
  Transformed: ______ "

  **Wagering Round Payoff Scheme:**

  - Each team starts with 10 points.
  - For the problem `QX` → ? , each team decides:
    - Which answer they think will be the most common (mode) in the entire class.
    - How many points to wager (an integer from 0 to 10).
  - They write their wager and their predicted mode on a slip.
  - Then, every student (including those in teams) writes their own answer to `QX` → ? on a separate slip (individual).
  - The teacher collects all individual answers and determines the mode(s). If there is a tie, all tied answers are considered modes.
  - For each team:
    - If the answer they predicted is a mode, they add the wagered points to their score.
    - If not, they subtract the wagered points.
  - Teams cannot wager on more than one answer to keep it simple.

  **Debrief Outline (20 minutes):**

  1. Silent round experiences (5 min):
     - Ask: "What happened when you got to `MX`? What did you write? Why?" 
     - Then: "What about `X`? `XX`? What kinds of solutions did you come up with?"
     - Highlight the need to slip when the rule dead-ends.

  2. Priming round (5 min):
     - Reveal that there were two different handouts. Show the two different example pairs (Group A: X→Q; Group B: X→XX).
     - Show the distribution of answers for `KX` from the two groups (Group A: mostly `KQ`; Group B: mostly `KXX`).
     - Point: The context (the example) changed what felt like the same rule.

  3. Wagering (5 min):
     - Ask a team: "Why did you wager on that answer?" 
     - Discuss: Even though there is no fact, we can predict what most people will do because of shared concepts and priming.

  4. Temperature (2 min):
     - Show the spread of answers for `XX` under obvious vs. inventive. 
     - Note: When being inventive, answers might include more distant slips (e.g., changing the first letter? or reversing the whole string?).

  5. Map to Copycat (3 min):
     - Slippage: When a concept (like "successor") fails, activation spreads to neighbors (predecessor, same) and those become candidates.
     - Weighted links and activation: The priming handout is like boosting the activation of one neighbor.
     - Probabilistic competition: The students' minds had multiple ideas, but one became dominant (due to priming or other factors).
     - Temperature: In the inventive condition, they allowed more distant connections (higher temperature).

  6. Tension (explicitly named) (2 min):
     - "So, is there a fact of the matter? No. But are all answers equally good? Also no. The system (Copycat or our minds) must balance between rigidity and creativity in a context-sensitive way. Copycat does this with temperature and the probabilistic codelets. We do it with ... ?"

  **Final Notes:**

  - The microdomain alphabet: B, F, K, M, Q, X (with order B<F<K<M<Q<X). This avoids real-alphabet associations.
  - Problems:
     - Silent round: 
          Problem 1: `FK` → ? (expected: `FM`)
          Problem 2: `MX` → ? 
          Problem 3: `X` → ? 
          Problem 4: `XX` → ? 
          Problem 5: `XXX` → ? 
     - Priming round target: `KX` → ? 
     - Wagering round: `QX` → ? 
     - Temperature round: `XX` → ? (under two instructions)

  - Why each item:
     - `FK`: Warm-up, no slippage needed.
     - `MX`: Dead-end at X, forces slippage.
     - `X`, `XX`, `XXX`: Increasing pressure, multiple X's to force more radical slips? But we don't want too much time here.

  - Priming handouts: Two versions, as above.

  - Preventing leakage: 
     - Hand out the two versions on different colored paper. 
     - Have students work on the problem and write their answer on the same colored paper. 
     - Collect by color and then reveal the two conditions. 
     - If leakage: "I see some of you have noticed there are two versions. That's okay, but please work on your own version." Then in the debrief, note that some might have been influenced by others, which is like activation spreading in a social context.

  This plan should fit in 90 minutes and achieve the learning goals.
answer: |-
  Below is a runnable 90-minute lesson plan designed to meet your goals. It uses a custom microdomain to prevent real-alphabet fluency, structures discovery through carefully ordered problems, and explicitly targets the three insights about concept slippage, boundaries, and context-sensitive choice. I've refined your sketch to address potential pitfalls, ensure timing, and scaffold the debrief. The alphabet is **B, F, K, M, Q, X** (ordered B < F < K < M < Q < X, with X as the terminal symbol).

  ---

  ### **Microdomain and Problem Sets**
  **Alphabet Rationale**:  
  6 symbols avoid memorability issues while ensuring X is a salient dead-end. The irregular sequence (B→F→K→M→Q→X) prevents intuitive leaps. All problems use 1–3 symbol strings for brevity.

  #### **Problem Sequence & Rationale**
  Problems are grouped into rounds. Each is designed to force specific collapses or reveal variability.  
  **Key**:  
  - `→` denotes transformation (e.g., "abc → abd").  
  - **Collapse Point**: Where the "advance last item" rule fails, forcing slippage.  
  - **Target Slippage**: The concept shift students should experience (e.g., "successor" → "predecessor").

  | Round          | Problem      | Worked Example Pair (if any) | Target Answer & Rationale                                                                 | Collapse Point & Target Slippage                                                                 |
  |----------------|-------------|------------------------------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | **Silent Individual** | Warm-up: `FK → ?`  | `BF → BK` (last symbol advanced: F→K) | `FM` (K→M). Tests basic successor rule.                                                  | None. Reinforces "advance last item".                                                          |
  |                | Dead-end: `MX → ?` | `BQ → BX` (Q→X)             | **Variation expected**: Some leave blank; others slip. Sets up need for slippage.        | Last symbol=**X** (no successor). Slippage: "advance" → "retreat" (e.g., X→Q) or "lengthen". |
  |                | Nastier: `XX → ?`  | None. Pure application.      | **High variation**: Answers like `X` (no change), `QX` (retreat), `XXX` (lengthen).     | **All symbols= X**. Forces radical slippage: "last item" → "whole string" or "identity".     |
  | **Primed Group**     | Group A: `KX → ?` | `X → Q` (establishes retreat) | `KQ` (retreat: X→Q). Slippage: "successor" → "predecessor".                              | Context primes "retreat" slippage.                                                             |
  |                | Group B: `KX → ?` | `X → XX` (establishes lengthen) | `KXX` (lengthen: add X). Slippage: "successor" → "same".                                | Context primes "lengthen" slippage.                                                            |
  | **Wagering**         | `QX → ?`    | None. Fresh problem.         | **Modal answer depends on class**. Tests if priming persists.                            | Dead-end (X) + ambiguity. No "correct" answer, but primed tendencies may emerge.             |
  | **Temperature**      | `XX → ?` (×2) | None. Same problem twice.    | **Obvious**: `X` or `XXX` (conservative). **Inventive**: e.g., `BX` (reset to start). | Forces explicit reflection on rule flexibility vs. defensibility.                            |

  ---

  ### **Lesson Flow** (90 Minutes Total)
  #### **1. Silent Individual Round** (15 min)  
     - **Instructions**: "Work silently on paper. For each pair, apply the *same rule* used in the example to the new string. If stuck, write what feels most natural."  
     - **Problems**:  
       - Warm-up: `BF → BK`, so `FK → ?` (tests successor rule).  
       - Dead-end: `BQ → BX`, so `MX → ?` (induces slippage need).  
       - Nastier: `X → ?` and `XX → ?` (forces creative collapse).  
     - **Why**: Isolates initial intuition. `MX` and `XX` ensure 80%+ hit dead-ends. Collect papers to compare later.

  #### **2. Primed Group Round** (20 min)  
     - **Split**: Two groups (A and B), physically separated (e.g., opposite sides of room).  
     - **Handouts** (printed, double-sided to hide differences):  
       - **Group A (Blue Paper)**:  
         ```
         EXAMPLE: X → Q  [Explanation: When advancement fails, retreat one step (X→Q).]  
         APPLY SAME RULE: KX → ?  
         ```  
       - **Group B (Yellow Paper)**:  
         ```
         EXAMPLE: X → XX [Explanation: When advancement fails, add the same symbol (X→XX).]  
         APPLY SAME RULE: KX → ?  
         ```  
     - **Task**: 5 min to write answers. **Enforce silence**; no sharing.  
     - **Reveal & Compare**:  
       - Ask Group A: "What did most of you get?" (Likely `KQ`).  
       - Ask Group B: "And you?" (Likely `KXX`).  
       - **Discuss**: "Why did identical inputs (`KX`) yield different outputs? What changed?" (Guide to: "The example redefined the rule").  
     - **Anti-Leakage Protocol**:  
       - Use colored paper; collect handouts immediately.  
       - If leakage: "I see some noticed differences. That’s okay—we’ll discuss why context matters." Turn it into a teachable moment about environmental priming.

  #### **3. Wagering Round** (15 min)  
     - **Teams**: Form 4–5 teams (3–4 students each).  
     - **Problem**: `QX → ?` (new dead-end case).  
     - **Payoff Scheme**:  
       - Each team gets 10 tokens (poker chips/paper clips).  
       - **Step 1**: Teams predict the *entire class’s* modal answer (e.g., "We think most will say `QM`").  
       - **Step 2**: Teams wager 0–10 tokens on their prediction.  
       - **Step 3**: *All students* vote individually (write answers anonymously).  
       - **Step 4**: Tally votes. Teams with correct modal predictions DOUBLE wagered tokens. Others lose wagered tokens.  
         - *Rationale*: Prevents "loudest voice" gaming by binding predictions before voting. Tokens are worthless, but competition incentivizes truth-seeking.  
     - **Outcome**: Teams experience "no fact of the matter" (many answers) vs. "predictable peaks" (e.g., primed groups may favor retreat/lengthen).

  #### **4. Temperature Round** (10 min)  
     - **Task**: Solve `XX → ?` twice:  
       - **Obvious**: "Give the most straightforward, defensible answer." (e.g., `XXX` or `X`).  
       - **Inventive**: "Give the most creative answer you can still justify." (e.g., `BX` or `K`).  
     - **Share**: Quick show of hands for spread (e.g., "Obvious: 10 said `XXX`. Inventive: 5 said `BX`, 3 said `K`...").  
     - **Why**: Visualizes how "temperature" (rule-strictness) affects variation.

  #### **5. Debrief** (20 min)  
  Map experiences to Copycat architecture:  
  1. **Slippage & Boundaries** (5 min):  
     - "In `MX → ?`, you couldn’t advance X. What did your mind do?" (Elicit: "It slid to ‘retreat’ or ‘lengthen’").  
     - "Why did ‘retreat’ feel natural to some but not others? Copycat’s *slipnet* has weighted links between concepts (e.g., ‘successor’ linked to ‘predecessor’). Slippage depends on which neighbor is active."  
     - **Key Insight**: "A concept’s boundary isn’t fixed—it’s set by its neighbors in the network."  

  2. **Activation & Context** (5 min):  
     - "In Group A, why did `X → Q` make you choose `KQ`? Copycat spreads activation from examples (like your handout) to neighbors. Here, ‘retreat’ got high activation."  
     - **Key Insight**: "Relations aren’t read off strings—they’re *constructed* by context priming neighbors."  

  3. **Probabilistic Competition & Temperature** (5 min):  
     - "Why did some answers feel ‘obvious’ but others ‘inventive’? Copycat’s *codelets* compete to build structures. High temperature (inventive mode) allows wilder ideas; low temperature (obvious) favors safe bets."  
     - "In wagering, you saw no fact of the matter—but also peaks. Copycat resolves this via *stochastic codelets*: even with slippage, context weights make some outcomes probable."  

  4. **The Tension** (5 min):  
     - State explicitly: **"No fact of the matter ≠ all answers equal. Systems need rules for *choosing* slips (e.g., activation weights), not just ‘be creative’."**  
     - Ask: "Could Copycat resolve `QX → ?`? How? What if activation is split 50-50?"  

  ---

  ### **Honesty Notes**  
  #### **Predictable Problems & Mitigation**  
  1. **Dominant Student**:  
     - *Risk*: Early announcement (e.g., "Just go backward!") in Silent Round.  
     - *Mitigation*: Enforce silence; use paper responses. If occurs, note: "Interesting—but let’s see if others agree." Use varied answers to show dissent.  

  2. **Refusal to Answer**:  
     - *Risk*: "Ill-posed!" during `MX → ?` or `XX → ?`.  
     - *Mitigation*: Pre-frame: "If stuck, write what feels natural—we’re studying the ‘stuckness’." If resistant, validate ("You’re right—there’s no rule") but urge: "Guess what others might do."  

  3. **Early Collapse**:  
     - *Risk*: Everyone defaults to "lengthen" for `XX → ?` before priming.  
     - *Mitigation*: Use nastier `XX → ?` only after priming. If collapse happens, contrast with Primed Round: "But when I gave different examples, you changed!"  

  4. **Timing**:  
     - *Risk*: Wagering or Debrief runs long.  
     - *Mitigation*: Use strict timekeepers (e.g., student volunteers). Cut Temperature Round to 5 min if needed; focus Debrief on slippage/tension.  

  #### **What the Exercise Cannot Replicate**  
  1. **Graded, Parallel Processing**:  
     - Students reason serially; Copycat uses 100s of parallel codelets.  
     - *Why it matters*: Humans feel "insight"; Copycat shows emergence. Say: "Your ‘aha’ moment is a codelet winning a race."  

  2. **Sub-Symbolic Activation**:  
     - Priming is discrete (handouts); Copycat’s activation is continuous and spreads incrementally.  
     - *Why it matters*: Copycat can blend concepts (e.g., "successor + same"); humans jump. Say: "We’re approximating with handouts—real activation is fuzzier."  

  3. **Dynamic Weight Adjustments**:  
     - Link weights in Copycat update mid-run; here, priming is static.  
     - *Why it matters minimally*: The core insight (weights enable context-sensitivity) is preserved.  

  4. **Temperature as a System Parameter**:  
     - Humans self-regulate "inventiveness"; Copycat auto-adjusts temperature based on conflict.  
     - *Why it matters*: Highlight that "temperature isn’t mood—it’s a feedback loop."  

  **Overall Gap**: The exercise captures **slippage**, **context-dependence**, and **stochastic outcomes** but not the **sub-symbolic mechanics**. This is acceptable—use it to motivate why Hofstadter needed computational modeling.  

