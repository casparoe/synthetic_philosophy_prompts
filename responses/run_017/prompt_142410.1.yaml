  - Colored paper for handouts (Group A: blue; Group B: yellow).  
  - Tokens for wagering (e.g., paper clips).  
  - Whiteboard: Track wagering scores, Temperature Round spread.  
  - Printed worksheets for Silent Round.  

  This plan balances structure and discovery, ensuring students "run into" the target insights while wrestling with Copycat’s core challenges. Adjust problem strings if trial runs show bias (e.g., if `XX → XXX` dominates).
