answer: |-
  ### **Rational Choice Classroom Game: Experiencing Ellsberg**
  This game creates a visceral experience of the Ellsberg paradox, explores how ambiguity aversion varies with the *source* of uncertainty, and confronts the "long-run frequency" counterargument. No upfront theory—students discover the pattern themselves.

  ---

  ### **Game Setup**
  **Materials Needed:**
  - **Urns:** 4 clear jars/boxes (labeled **K**, **A**, **B**, **C**).
  - **Balls:** 200 red balls, 200 black balls (use colored paper, beads, or candy like M&Ms).
  - **Randomizer:** A bag with 101 slips (0–100) for Urn C.
  - **Blindfold** for Urn C.
  - **Projector:** Display instructions, random numbers, and betting results.
  - **Student Sheets:** Pricing sheets (Table 1) and repeated betting logs (Table 2).
  - **Payoffs:** Points redeemable for snacks/bragging rights (e.g., 100 points = snack voucher).

  **Urn Setup (10 mins):**  
  1. **Urn K (Known):** Fill with 50 red + 50 black balls. Show students.  
  2. **Urn A (Random):** Publicly generate a random number (0–100) using a RNG app. Fill with that many red balls + rest black (hide exact count).  
  3. **Urn B (Adversary):** Pick a student ("Adversary"). They *secretly* choose red-ball count (0–100) to **maximize their bonus** (explained later). Fill Urn B accordingly.  
  4. **Urn C (Ignorant):** Blindfold a student ("Ignorant"). They draw a slip (0–100) from a bag. Fill Urn C with that many red + rest black. Ignorant never sees the number.  

  > **Key:** All urns are opaque except when drawing balls. Students know *how* each urn was set but not the compositions.

  ---

  ### **Stage 1: Pricing Bets (25 mins)**
  **Goal:** Elicit prices for 4 bets per student (Red-K, Black-K, Red-ambig, Black-ambig).  
  **Groups:** Split class into 3 groups (7–8 students each). Each group bets on **one** ambiguous urn (A, B, or C) + Urn K.  

  **Instructions:**  
  *"Price each bet based on the lowest amount you’d accept to sell it. If you sell, you get the price. If not, we draw a ball—if correct, you win 100 points. **One random bet per student will be played.**"*  

  **Pricing Sheet (Table 1):**  
  | Bet                 | My Price (0–100) |  
  |---------------------|------------------|  
  | Red from Urn K      | [        ]       |  
  | Black from Urn K    | [        ]       |  
  | Red from Urn [A/B/C]| [        ]       |  
  | Black from Urn [A/B/C]| [        ]     |  

  **Mechanism (BDM Lite):**  
  - Collect all sheets.  
  - Randomly select **one student** and **one of their 4 bets** to resolve.  
  - Draw a random price (0–100):  
    - If drawn price ≥ student’s price → Student sells, gets the price.  
    - If drawn price < student’s price → Draw a ball: Win 100 if correct, else 0.  

  > **Why this works:**  
  > - Incentivizes truthful pricing (any bet could be chosen).  
  > - **Blocks "take both bets"** by pricing separately. Students can’t arbitrage since only one bet is resolved per person.  

  ---

  ### **Stage 2: Repeated Betting (15 mins)**
  **Goal:** Confront "long-run frequency" argument with a fixed ambiguous urn (Urn A).  

  **Instructions:**  
  *"10 rounds of betting on Urn A. Each round:  
  - Bet on red or black.  
  - We draw a ball **with replacement** (same urn).  
  - After 10 rounds, **one round** is randomly chosen to count. Win 100 points if correct."*  

  **Betting Log (Table 2):**  
  | Round | My Bet (Red/Black) |  
  |-------|--------------------|  
  | 1     | [        ]         |  
  | ...   | ...                |  
  | 10    | [        ]         |  

  > **Why with replacement?**  
  > Cleaner for frequency—fixed composition ensures long-run convergence to true probability. Students see outcomes stabilize (e.g., 6 red in 10 draws), but ambiguity remains *during* betting.  

  ---

  ### **Payoffs**
  - **Stage 1:** Points from one resolved bet (randomly selected).  
  - **Stage 2:** Points from one resolved round (randomly selected).  
  - **Adversary Bonus (Urn B):** Adversary gets 10 points per student in their group who **loses** their bet on Urn B (if selected).  
  - **No real money:** Points → snacks/bragging rights.  

  ---

  ### **Timeline (90 mins)**
  | Phase           | Time  | Activity                                                                 |  
  |-----------------|-------|--------------------------------------------------------------------------|  
  | Setup           | 10 min| Set up urns (K, A, B, C) as above.                                       |  
  | Stage 1: Pricing| 25 min| Students price bets → collect sheets → resolve one random bet.          |  
  | Stage 2: Repeat | 15 min| 10 rounds of betting on Urn A → resolve one random round.               |  
  | Debrief         | 40 min| Reveal urn compositions, discuss patterns, introduce theory.            |  

  ---

  ### **Debrief (40 mins)**  
  **Map Observations to Theory:**  
  1. **Ellsberg Pattern:**  
     - Show average prices:  
       - Urn K: Red ≈50, Black ≈50, **Red+Black≈100**.  
       - Urns A/B/C: Red <50, Black <50, **Red+Black<100**.  
     - *"Why can’t this be explained by one probability? If P(Red)=p, P(Black)=1−p, then Red price + Black price should be 100p + 100(1−p) = 100. But your sums are <100!"*  

  2. **Source of Ambiguity Matters:**  
     - Compare average prices for ambiguous urns:  
       - **Urn B (Adversary)** prices << Urn A (Random) ≤ Urn C (Ignorant).  
     - *"Why stronger aversion for Urn B? Is it about missing info, or fearing someone knows more?"*  
     - Link: Ambiguity aversion ↑ when uncertainty feels **strategic** (adversary) vs. **neutral** (random/ignorant).  

  3. **Long-Run Frequency:**  
     - Reveal Urn A composition. Show outcomes: e.g., 7 red in 10 draws → stabilized near true prob.  
     - *"Why didn’t this make Urn A feel like Urn K during betting? Because *you didn’t know* the probability when deciding!"*  
     - Contrast: Frequentism (long-run) vs. epistemic (current knowledge).  

  **Finally:** Name "Ellsberg paradox" and "ambiguity aversion."  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **"I’d take both bets!":**  
     - **Blocked by design:** Pricing bets separately + resolving only one prevents arbitrage. If students ask, say: *"You’re pricing individual bets—sell one, keep the other? But only one might be played."*  

  2. **Urn Setup Delays:**  
     - Pre-fill Urns A/C before class (use pre-generated random numbers). Only fill Urn B live.  

  3. **Weak Ambiguity Aversion:**  
     - Econ majors may "over-rationalize." **Fix:** Emphasize intuition (*"Go with your gut!"*). Adversary condition (Urn B) amplifies aversion.  

  4. **Time Crunch:**  
     - Skip Stage 2 or reduce to 5 rounds. Focus on Stage 1 + debrief.  

  5. **Adversary Mischief:**  
     - Adversary sets extreme composition (e.g., 100% red). **Use it!** *"See how prices dropped when you suspected manipulation?"*  

  6. **BDM Confusion:**  
     - Demo with a dummy bet (e.g., *"If you price Bet X at 40, and we draw 55, you sell for 55"*).  

  ---

  ### **What the Game Can’t Do**  
  - **Probabilistic Sophistication:** Students may not explicitly realize that aversion implies rejecting *any* single probability. **Say in debrief:** *"If you had one probability for Urn A, your red + black prices would sum to 100—but they didn’t."*  
  - **Generalization:** The game focuses on urns; real-world ambiguity (e.g., stocks) is messier. Discuss in debrief.  

  **Outcome:** Students feel the paradox, debate the role of adversaries, and confront why frequency doesn’t "solve" ambiguity. No slides needed—just their own choices.
