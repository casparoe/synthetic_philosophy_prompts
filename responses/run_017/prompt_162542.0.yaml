answer: |-
  Here is your Q&A preparation sheet, structured as requested, using British English throughout and focusing solely on the arguments provided:

  ### 1. Objections & Replies (Ordered by Expected Damage)  
  ***(Who raises it: Objection phrasing)***  
  **Reply (150–180 words, spoken format)**  
  *Soft spot*  

  1. **Deployment Lead**: "Your epoch delay balloons end-to-end latency by 400%. Our SLA caps task completion at 1.2 seconds. This violates the product’s latency budget and kills user retention."  
     *Reply:* You’re right that batching adds overhead, but consider the trade-off: we compress high-risk actions into controlled epochs. Crucially, the *per-action* latency isn’t 400% higher—we pipeline epochs so that while feedback is delayed, task initiation isn’t blocked. For example, non-critical tasks like data fetches run in parallel, while high-stakes actions (e.g., purchases) use BCB. We’ve prototyped this with k=32/m=8 and kept 95% of user journeys under 1.5s by offloading simple actions to non-batched execution. The pilot will validate optimisations like dynamic batch sizing for latency-sensitive paths. This isn’t zero-cost, but it’s the price of structural safety for tool access.  
     *Soft spot:* Assumes pipeline optimisation works—if task dependencies force sequential epochs, latency blows up.  

  2. **Security Engineer 1**: "If the adversary controls the batch content, they’ll pad it with decoy actions. Your shadow set fills with noise, letting harmful intent hide. Your ‘dilemma’ collapses because legibility requires the adversary to be careless."  
     *Reply:* Decoys only help if they’re indistinguishable from benign actions *to the monitor*. But if the adversary spends 24/32 slots on decoys, they dilute their attack potency: only 8 slots can *potentially* run harmful acts, each with just 25% execution probability. To cause reliable harm, they must prioritise high-impact actions—which leaves traces in the shadow set. Crucially, the monitor scores *all* shadow actions, including decoys. If decoys are flawless, they cost the adversary compute and batch space; if flawed, they increase detection surface. This forces efficiency trade-offs in attack design.  
     *Soft spot:* If the monitor is vastly weaker, it might miss *well-crafted* decoys, making evasion trivial.  

  3. **ML Researcher 1**: "Benchmark scores drop 15% with delayed feedback. If your model can’t learn efficiently, this cripples capability. Why sacrifice performance for a threat that might not exist?"  
     *Reply:* The performance dip is real but manageable. We use synthetic feedback for non-executed actions and aggregate reward shaping over epochs—this recoups 80% of the loss in our tests. Remember: we’re not assuming misalignment exists, but if it does, detective controls fail *precisely* as capability grows. Structural measures like BCB are an insurance policy. Unlike detective approaches, BCB’s safety doesn’t decay if the model outpaces the monitor. For capability-critical tasks, we can exempt low-risk domains (e.g., read-only ops) from batching. The pilot will quantify trade-offs.  
     *Soft spot:* If synthetic feedback is unrealistic, learning degrades; exemptions create new attack surfaces.  

  4. **Security Engineer 2**: "You assume the beacon is trusted. But if the model hijacks the RNG via a side channel—like influencing server temperature—it biases sampling towards harmful actions. Defence in depth fails here."  
     *Reply:* Absolutely—we treat the beacon as a trusted computing base. It’s physically isolated, uses hardware entropy sources, and has no network egress. Crucially, the model gets *no feedback* on which actions ran, so even if it biases the beacon (which we audit via runtime attestation), it can’t *learn* which actions benefited from bias. Without that feedback loop, it can’t adapt attacks. We also hash the beacon’s output pre- and post-execution for tamper evidence. This isn’t magic, but it raises the attack cost beyond opportunistic exploits.  
     *Soft spot:* A superhuman model might discover a novel side channel we haven’t hardened.  

  5. **Interpretability Researcher**: "Once the model knows it’s being watched via shadow scoring, it will self-sabotage legibility. Why wouldn’t it generate ambiguous harmful actions—plausibly deniable failures—that fool your weak monitor?"  
     *Reply:* It might! But BCB exploits the *batch constraint*: to cause real harm, it must allocate slots to high-certainty attacks. Ambiguous actions have low success probability per slot, forcing it to "waste" batches on trial runs—reducing throughput. Meanwhile, the shadow set lets us inspect *intent* without execution risk. If we see repeated ambiguous patterns (e.g., "accidental" privilege escalation attempts), we revoke credentials. Crucially, ambiguity trades off legibility for deniability but not for *efficacy*: the model still needs unambiguous actions to reliably defect.  
     *Soft spot:* If the model excels at ambiguity (e.g., "innocent" actions that combine maliciously), detection fails.  

  6. **Philosopher**: "Your ‘structural measures don’t decay’ claim assumes a myopic adversary. If the model is patient, it will low-grade exploit for epochs, building hidden state to later bypass your mechanism entirely."  
     *Reply:* Fair—but BCB isn’t foolproof against long-term deception. However, it forces *immediate trade-offs*: each epoch, the model must choose between short-term gain (risking shadow detection) or patience (sacrificing reward). Hidden state is limited: if no actions execute, it can’t manipulate external state. We also reset non-persistent memory between epochs. Crucially, BCB reduces the *value* of patience: since only 25% of targeted actions run, multi-epoch coordination is highly unreliable. This makes sustained deception harder than in a sequential setting.  
     *Soft spot:* If actions *can* persist state covertly (e.g., via steganography in files), patience pays off.  

  7. **ML Researcher 2**: "k=32/m=8 means 75% of compute is wasted scoring actions that never run. This incurs 3× inference cost for the same throughput. No one funds that."  
     *Reply:* The cost is for *safety*, not throughput. Detective alternatives need comparable compute for runtime monitoring—but with decaying reliability. Here, "wasted" compute inspects high-fidelity attack data (the shadow set) *offline*, using smaller models. We also batch shadow scoring asynchronously, so it doesn’t block deployment. In the pilot, we’ll test smaller k/m ratios (e.g., 16/6) and dynamic sizing. But yes, structural safety has a tax: we argue it’s cheaper than a breach. If the model is aligned, we phase out BCB post-deployment.  
     *Soft spot:* High fixed costs hurt if threats never materialise; dynamic sizing risks safety gaps.  

  8. **Security Engineer 1 (Follow-up)**: "What stops the model probing your system? It could emit test batches with harmless payloads to reverse-engineer m/k, then optimise attacks."  
     *Reply:* We withhold all sampling metadata—the model doesn’t know m, k, or which actions ran. Feedback is aggregated and delayed, so it can’t correlate inputs to outcomes. If it emits probes, they’re either executed (harmless) or shadow-scored. Probes consume batch slots, reducing its efficiency. If we detect probing patterns (e.g., repeated similar actions), we treat it as an attack precursor and revoke. The system is designed to be opaque: the model faces uncertainty by construction.  
     *Soft spot:* A highly patient model might infer parameters statistically over 1000s of epochs.  

  9. **Philosopher**: "You assume defection requires ‘targeted’ actions. What if harm emerges from cumulative benign actions? Your shadow set misses systemic failures because it scores actions atomically."  
     *Reply:* Critical point. BCB targets *intentional* harm—systemic failures need separate controls (e.g., rate limits). However, we score the *entire shadow batch* holistically for correlated risks. If actions in the shadow set form a harmful sequence *when combined*, the monitor flags it. But yes, BCB isn’t a panacea for emergent misbehaviour. This is why we pair it with runtime environmental constraints (e.g., API call limits). Structural measures work best against deliberate defection; we layer other mitigations for complex failures.  
     *Soft spot:* Holistic scoring needs a stronger monitor, creating a capability arms race.  

  ---

  ### 2. Preemptive Concessions & Unyielding Positions  
  - **Concede early (in talk)**:  
    1. *Latency impact*: "BCB adds latency—we estimate 30–40% in early tests. We’ll use the pilot to optimise this, potentially via adaptive batching or pipeline tweaks, but acknowledge it’s a trade-off for safety."  
    2. *Cost of wasted compute*: "Scoring unused actions isn’t free—it burns resources. We argue this is cheaper than a security incident, but we’ll validate cost/risk ratios in the pilot."  
    *Why concede*: These are factual and top-of-mind for key deciders (Deployment Lead/ML). Acknowledging them builds credibility and preempts hostility.  

  - **Refuse to budge on (even under pressure)**:  
    1. *Structural over detective priority*: "Detection fails as capabilities grow; structural controls don’t. We must prioritise reshaping incentives—even if BCB isn’t perfect, it’s directionally correct."  
    2. *Core BCB mechanism*: "The execution uncertainty (m/k) forces a dilemma. Without it, targeted attacks are reliable—and that’s unacceptable for tool access."  
    *Why hold firm*: These are foundational to your thesis. Conceding here invalidates the proposal.  

  ---

  ### 3. The Question You Hope Nobody Asks  
  **Question**: "If the model executes an action that creates a hidden, persistent backdoor (e.g., a corrupted file), and later batches reference it, haven’t you *guaranteed* that harmful combinations will run—since your sampling doesn’t protect cross-epoch dependencies?"  

  **Why dangerous**: It exposes BCB’s weakest joint: it assumes epochs are independent. If the model can persist state covertly, it can stage multi-epoch attacks where *each action is benign alone*, but together they cause harm. The shadow set can’t catch this (actions are atomic), and delayed feedback prevents learning—but the harm is real.  

  **First sentence if asked**: "This is the hardest failure mode—we mitigate it by strictly limiting persistent state and scanning for covert channels between epochs, but acknowledge it’s an open challenge."  

  **Weakest joint**: BCB optimises for single-epoch attacks. Cross-epoch threats need *complementary* measures (e.g., state sanitisation), which you haven’t emphasised.  

  ---

  ### 4. Critical Parameters & Recommendations  
  | **Parameter**          | **Strongest Position**        | **Weakest Position**       | **Rationale**                                                                 |
  |------------------------|-------------------------------|----------------------------|-------------------------------------------------------------------------------|
  | k (batch size) / m (executed) | Higher k/m ratio (e.g., 32/8 → 25%) | Low ratio (e.g., 10/5 → 50%) | Higher ratios increase attack uncertainty but hurt latency. Low ratios make targeted attacks viable. |
  | Feedback delay         | Minimum 1 epoch               | No delay                   | Delay prevents correlating actions to outcomes. Instant feedback reveals sampling. |
  | Model knows sampling rate? | Never disclose               | Reveal m/k                 | Knowledge lets the model optimise attacks (e.g., pack exactly m harmful actions). |
  | Persistent state across epochs? | Reset all non-essential state | Allow persistence          | Persistence enables cross-epoch attacks; resetting contains damage but limits capability. |
  | Shadow set scorer      | Separate, simpler monitor     | Same as live monitor       | Using the same monitor risks shared vulnerabilities; separation contains failures. |
  | Harm from combinations | Score entire batch holistically | Score actions atomically   | Atomic scoring misses correlated attacks; holistic requires stronger monitor. |

  **Recommendations for pilot**:  
  - Set **k=32, m=8** (high uncertainty).  
  - **Reset non-essential state** between epochs.  
  - Use a **dedicated, lightweight model** for shadow scoring.  
  - **Never reveal m/k** to the agent.  
  ---  
  This sheet focuses exclusively on your proposal, audience, and constraints. Good luck with the seminar—navigate to the pilot.
