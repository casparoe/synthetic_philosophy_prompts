prompt: |-
  I spent most of last evening arguing with a friend who works in brand marketing about whether an expensive gesture is automatically a credible one. Her position was that a firm willing to burn real money on a promise has thereby proved it means the promise; mine was that the burn proves nothing unless it hurts a firm that does not intend to follow through more than it hurts one that does. We got as far as agreeing on that differential-cost point — she conceded that a deep-pocketed company can buy exactly the same display as a sincere one — and then stalled on three things I could not settle. First, whether the cost has to be wasted in order to count: her examples were all pure waste (a huge advertising buy, absurd packaging, a monument of a headquarters), and she thought money spent on something that also makes the pledger better at delivering was not a real signal at all. Second, whether a costly gesture that nobody outside the counterparty ever learns about can signal anything, or whether it collapses into an ordinary contract term. Third, a case she raised that I had no answer to: some expensive things a company builds are partly what enable it to keep the promise in the first place, so the gesture does not merely reveal a quality that was already there but helps produce it. I suspect the biology literature on costly signaling and the handicap principle has something precise to say about all three, but please state whatever the relevant conditions are in plain English and do not hand me a reading list or citations — I have no way to chase them down, and I need questions I can ask, not authors I can read.

  The reason I need it operationalized is my day job. I direct a four-person program staff at a regional foundation that makes outcome-linked grants to service providers; roughly sixty applications a year arrive with some kind of commitment attached — money placed in escrow, refunds promised if targets are missed, assets built or dedicated, public pledges with named deadlines. My staff have program and field backgrounds and no economics; each of us has about twenty-five minutes per application; every decision over two hundred fifty thousand dollars goes to a board that wants a single page of written rationale; and we are currently using an in-house scoring sheet whose largest single component is the headline dollar figure attached to the commitment, weighted more heavily than whether the commitment is even verifiable. I now think that weighting is close to backwards, and I want to replace it. So please write me a decision procedure my team can actually run: the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the question is one of values rather than facts, and what to write down when a number we need simply is not in the documents. It has to be usable by someone who has never heard the theory, it should say which distinctions genuinely have to survive that simplification and which can be dropped, and it should be honest about the places where its central estimate is guesswork dressed up as procedure.

  Then run it on three commitments of the kinds we actually see, telling me what verdict each gets and why. One: a large national provider places two million dollars of its own reserves with an independent trustee for three years, forfeited automatically if a named, independently verified service target is missed. These are my own favorite category, and I want to know whether the procedure endorses them or tells me that for a firm with that balance sheet the differential cost is close to zero. Two: a mid-sized provider spends about a million and a half building an internal data and case-tracking system it says is required to hit the target, on hardware and software it would keep and use elsewhere if the grant ended tomorrow. Three: a small nonprofit with very thin reserves offers, in a binding but confidential filing, to repay the entire grant plus twenty percent if the verified outcome is not met, and asks that the pledge never be publicized because it would alarm its own donors and clients. I want the third case to force the procedure to say what a costly but invisible pledge actually is, and whether a pledge that would bankrupt the pledger is worth anything given that there would be nothing left to collect. Please also tell me plainly what the procedure cannot tell us: which kinds of commitment it is simply the wrong instrument for, where the honest answer is that we do not know, and which of our existing categories should probably be retired rather than scored.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They work at a foundation that gives outcome-linked grants and have to evaluate commitments from service providers. They’ve been using a scoring system that heavily weights the dollar amount of the commitment, but they realize that’s flawed. Their debate with a friend about costly signaling revealed gaps in their approach—specifically around whether the cost actually proves credibility, if the expense has to be wasted, if hidden pledges count, and if the gesture itself creates capability.

  First, I need to recall the handicap principle from biology. It’s about signals being costly to fake. For example, a peacock’s tail is a signal of fitness because it’s burdensome; a weak peacock couldn’t afford it. Translating this to the user’s context: a commitment must be more costly for a non-credible provider than a credible one. The user’s point about differential cost is spot on. Their friend’s examples were all wasteful spending, but the user questions if investments that build capacity count. 

  Looking at the three sticking points: 

  1. Does the cost need to be wasted? Waste isn't essential, but the key is that the cost must hurt a non-performer more. If the expense also improves capability, it's still a valid signal as long as it’s harder for a low-quality provider to bear. 

  2. Can a hidden pledge signal credibility? If no one knows about it, it doesn’t signal to the market. For the foundation, a confidential pledge is just a contract term, not a signal that enhances reputation. 

  3. What if the expense builds capability? Here, the gesture isn’t just revealing intent but creating ability. This complicates things because the cost isn’t purely a signal; it’s an investment. The foundation needs to assess if the investment is necessary or if it’s a decoy. 

  The user needs a practical decision procedure for their team. The team has limited time and no economics background. The procedure must be step-by-step, with clear questions, stopping points, and ways to handle missing data. 

  Designing the steps: Start with verifying the commitment is binding. Then check the cost as a percentage of the provider’s liquid assets—this addresses differential cost. Next, assess if the cost is recoverable or wasted. For recoverable investments, evaluate if they’re necessary for delivering outcomes. Then, consider publicity; hidden pledges don’t signal. Finally, estimate the net cost to determine if it’s prohibitive for a non-performer. 

  Applying this to the three examples: 

  1. The national provider’s $2M in escrow. High absolute amount, but as a percentage of their reserves, it’s low. The differential cost is minimal, so it’s a weak signal. Verdict: Not credible. 

  2. The $1.5M data system. This is a sunk cost but recoverable since they can use it elsewhere. Need to check if it’s necessary. If yes, it’s a good signal because a non-performer wouldn’t invest wisely. If not, it’s just waste. 

  3. The small nonprofit’s confidential repayment pledge. High percentage cost, but since it’s hidden, no reputational signal. Plus, if they default, bankruptcy means no recovery. Verdict: Not credible. 

  The procedure can’t handle commitments where costs aren’t financial or when there’s no data on finances. Also, punitive pledges from weak providers are red flags. The foundation should retire scoring based solely on dollar amounts and focus on differential cost and transparency. 

  Deep needs: The user wants to move beyond superficial metrics to robust evaluations. They need to justify decisions to the board succinctly. Underlying this is a need for efficiency and reliability in granting, ensuring funds create real impact. They might also be seeking validation that their intuition about differential cost is correct, and want actionable steps to implement this insight.
answer: |-
  Here's a decision procedure based on the core principle of **differential cost**: a credible signal must hurt a provider *unlikely to deliver* significantly more than it hurts one *likely to deliver*. Cost alone is meaningless without this differential.

  **The Foundation Commitment Credibility Assessment (FCCA) - 5 Questions**

  1.  **Is it Binding & Verifiable?**
      *   *Ask:* Is the commitment legally enforceable and can we independently verify if the trigger event (e.g., missed target) occurred?
      *   *Sufficient Answer:* "Yes, via [Specific Mechanism: e.g., signed contract with clawback clause, funds in named escrow agent, verifiable public report]." *Include the mechanism in notes.*
      *   *Stop if No:* If not binding or not verifiable, **stop - Commitment is NOT credible.** It's just talk.
      *   *Values Judgement:* None. This is factual.

  2.  **What's the Net Cost as % of Liquid Reserves?**
      *   *Ask:* If the commitment is triggered (e.g., forfeit, repayment), what is the **net financial cost** to the provider *after* any recoverable value? Express this cost as a percentage of their **unrestricted, liquid net assets** (cash + equivalents they can freely spend).
      *   *Calculation:* `(Total Cost if Triggered - Recoverable Value) / Unrestricted Liquid Net Assets = X%`
      *   *Sufficient Answer:* A specific percentage (X%). Use figures from their latest audited financials (Form 990 for US nonprofits, balance sheets). If "recoverable value" is ambiguous (e.g., specialized equipment), estimate conservatively low (e.g., 20% of cost?).
      *   *Missing Data:* If figures aren't provided or clear, **flag "Financial Data Incomplete."** *Estimate conservatively:* Assume low cost/high reserves UNLESS context suggests otherwise (e.g., tiny org). Note the guesswork clearly in rationale: "Estimated X% based on [assumption] due to missing audited figures."
      *   *Values Judgement:* None. This is calculation/estimation.

  3.  **Is the Cost Mostly Sunk or Recoverable?**
      *   *Ask:* If triggered, is the cost primarily **sunk/wasted** (e.g., forfeited cash, unrecoverable advertising spend) or **recoverable** (e.g., selling repurposable equipment, keeping usable software/systems)?
      *   *Sufficient Answer:* Categorize: **High Sunk Cost** (>75% unrecoverable), **Mixed Sunk/Recoverable** (25-75%), **Mostly Recoverable** (<25% sunk). *Explain briefly why.*
      *   *Differential Impact:* **High Sunk Cost** hurts a non-performer much more (pure loss). **Recoverable Cost** hurts less (they get some value back), weakening the signal. *This addresses your first sticking point.*
      *   *Values Judgement:* Minor. Requires reasonable assessment of asset recoverability.

  4.  **Is a Recoverable Investment *Necessary* for Delivery?**
      *   *Ask ONLY if Cost is Mostly Recoverable (from Q3):* Is this investment (e.g., building a system, buying equipment) genuinely *essential and specific* for achieving *this specific grant's outcomes*? Could a provider likely to fail plausibly waste money here, or is this only a smart move for someone serious?
      *   *Sufficient Answer:* "Yes, because [Clear, specific link to grant outcomes, explaining why it's essential and not just generally useful]." OR "No/Unclear, because [It seems general, not specifically required, or a poor fit]."
      *   *Stop if No/Unclear:* If the recoverable investment isn't clearly necessary for *this specific grant*, **stop - Commitment is NOT credible.** It's likely just an operational expense disguised as commitment. *This addresses your third sticking point.*
      *   *Values Judgement:* **Yes.** Requires programmatic judgement on necessity vs. waste. *This is where staff expertise matters.* Flag if the rationale is weak.

  5.  **Is the Commitment Public?**
      *   *Ask:* Will the existence and terms of this commitment (especially the cost if triggered) be known to relevant stakeholders (donors, clients, peers, public)?
      *   *Sufficient Answer:* "Yes, publicly documented via [e.g., press release, website, grant agreement public clause]." OR "No, confidential per [e.g., clause X]." OR "Partially [Specify]."
      *   *Differential Impact:* **Public Commitment** adds significant reputational cost (beyond money) if failed, hurting a non-performer much more. **Confidential Commitment** removes this reputational cost, weakening the signal significantly. *This addresses your second sticking point.*
      *   *Values Judgement:* Minor. Factual assessment of publicity mechanisms.

  **Decision & Rationale:**

  *   **Credible Signal:** Requires **Yes on Q1**, **>5% Net Cost (Q2)**, **AND** either:
      *   **(a) High Sunk Cost (Q3)** OR
      *   **(b) Mostly Recoverable Cost (Q3) + Necessary Investment (Q4)**.
      *   *Rationale Focus:* Explain the high differential cost (Q2) and why the cost structure (Q3/Q4) makes it hard to fake. Note publicity (Q5) as amplifier or weakness.
  *   **Weak Signal:** Fails the Credible Signal threshold but has **Yes on Q1 + >1% Net Cost (Q2)**. *Rationale:* Acknowledge some cost but explain why the differential isn't sufficient (e.g., low %, recoverable & unnecessary, confidential).
  *   **Not Credible:** Fails Q1, OR Net Cost <=1% (Q2), OR fails the Credible Signal conditions above. *Rationale:* Clearly state the failing condition(s).

  **What the FCCA CAN'T Do (Be Honest):**

  1.  **Assess Non-Financial Signals:** Grand gestures, CEO passion, past reputation. These matter but are outside this cost-focused procedure.
  2.  **Predict Success:** Credibility ≠ guaranteed outcome. It only assesses if the *commitment* signals serious intent.
  3.  **Value "Bankruptcy Pledges" Highly:** A pledge bankrupting the provider (Very High % Cost) is often *less* credible because:
      *   Recovery is impossible (nothing to claw back).
      *   It signals desperation or poor planning, not strength.
      *   They likely *can't* deliver if failure means destruction.
      *   *(See Case 3 below)*
  4.  **Perfectly Quantify Intangibles:** Recoverable value (Q3) and Necessity (Q4) involve judgement. The procedure forces explicit reasoning but can't eliminate uncertainty.
  5.  **Handle Missing Financials Well:** Heavy reliance on Q2 makes incomplete finances a major weakness. Estimates are guesses.

  **Retire These Categories (or radically de-weight them):**

  *   **Headline Dollar Figure Alone:** Meaningless without context (Q2 %).
  *   **"Assets Built or Dedicated" without Scrutiny:** Could be recoverable investments (Q3) or unnecessary (Q4). Needs analysis.
  *   **Generic "Public Pledges":** Must include concrete cost/penalty (Q1, Q2) to matter.

  ---

  **Applying the FCCA to Your Cases:**

  1.  **National Provider: $2M Escrow**
      *   Q1: **Yes.** Binding (escrow), Verifiable (independent verification).
      *   Q2: **Net Cost = $2M forfeit.** Liquid Reserves = Assume very high (e.g., $100M+ for large national). **Net Cost % = ~2% (or less)**. *Low differential cost.*
      *   Q3: **High Sunk Cost.** Forfeited cash is pure waste.
      *   Q4: N/A (Sunk Cost).
      *   Q5: **Likely Public** (escrow/forfeiture terms probably known).
      *   **Verdict: WEAK SIGNAL.** *Why:* Binding and sunk cost, but the net cost (% of reserves) is too low to be a meaningful signal for a large provider. It's cheap talk for them. The procedure *does not endorse* these for large, deep-pocketed firms based on headline figure alone. Differential cost is negligible.

  2.  **Mid-Sized Provider: $1.5M Data System**
      *   Q1: **Yes?** Assumed binding commitment linked to target. Verifiable if system existence/use is tied to reporting.
      *   Q2: **Net Cost = Sunk Portion.** Cost $1.5M. Recoverable Value? Hardware/software reusable elsewhere. Estimate 50% recoverable? **Net Cost = $750k.** Liquid Reserves = Estimate $3M (mid-sized). **Net Cost % = 25%.** *Significant potential differential.*
      *   Q3: **Mixed Sunk/Recoverable.** (Assumed 50% sunk).
      *   Q4: **CRITICAL QUESTION:** Is this system *necessary and specific* for *this grant's outcomes?*
          *   If **YES** (e.g., target requires real-time tracking this system uniquely provides): **Credible Signal.** *Why:* High net cost % (25%) + Necessary investment. A provider unlikely to deliver wouldn't wisely spend $1.5M on something essential *only* if they succeed.
          *   If **NO/UNCLEAR** (e.g., it's a general CRM upgrade they wanted anyway): **NOT Credible.** *Why:* The "commitment" cost is mostly recoverable operational spend. Low differential cost.
      *   Q5: **Likely Known Internally/Moderately Public?** Building a system is observable.
      *   **Verdict: DEPENDS ON Q4 (Necessity).** *This is the key judgement call.* Staff must rigorously assess if the investment is truly grant-specific and essential.

  3.  **Small Nonprofit: Confidential Repayment Pledge (+20%)**
      *   Q1: **Yes.** Binding (confidential filing), Verifiable (outcome).
      *   Q2: **Net Cost = Grant + 20%.** Liquid Reserves = Assume very thin (e.g., $200k). Grant size? Assume $500k. **Net Cost = $600k. Net Cost % = 300% (or more).** *Massive differential cost.*
      *   Q3: **High Sunk Cost.** Repaid cash is pure loss.
      *   Q4: N/A (Sunk Cost).
      *   Q5: **No. Strictly Confidential.** *No reputational cost.*
      *   **Verdict: NOT CREDIBLE.** *Why:*
          *   **Confidentiality (Q5):** Removes the reputational signal. It's just a secret contract term.
          *   **Bankruptcy Risk:** 300% cost means guaranteed bankruptcy if triggered. This creates perverse incentives (cutting corners to avoid failure at all costs) and makes recovery impossible. The cost isn't just high, it's destructive. It signals recklessness, not commitment. The procedure sees this as a major red flag, not a strength. A credible signal needs *sustainable* cost.

  **Key Output for Board:** A single paragraph per application under "Commitment Credibility":
  *   "Binding via [Mechanism]. Estimated Net Cost: [X]% of Provider Liquid Reserves. Cost Type: [Sunk/Recoverable]. [Recoverable cost deemed Necessary/Unnecessary for outcomes - if applicable]. Publicity: [Public/Confidential]. Assessment: [Credible/Weak/Not Credible] because [Concise FCCA rationale]."

  This procedure forces focus on *differential cost* (% of reserves) and *cost structure* (sunk vs. recoverable/necessary), moves beyond headline dollars, flags confidentiality and bankruptcy pledges as weaknesses, and makes judgement calls explicit and necessary (especially on necessity). It accepts imperfection in estimates but demands reasoning.
