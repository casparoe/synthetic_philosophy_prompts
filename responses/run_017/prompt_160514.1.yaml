prompt: |-
  You are a senior research scientist working on the alignment and interpretability of machine learning systems who also reads philosophy of mind and AI. Please think carefully and answer at some length. Before giving your final answer, do a round of explicit brainstorming: list the candidate explanations and the nearest established concepts you can think of, and say which ones you are discarding and why. I would rather see your rejected candidates than a confident single answer.

  I am a software engineer with no formal philosophy background and only a practitioner's knowledge of ML — I build the platform and evaluation tooling for a couple of applied ML teams, so I mostly observe these systems from the outside. Twice in the last two years I have watched what looks like the same failure in two unrelated systems, and I cannot find the word for it, partly because I don't know the literature. In both cases the system had been trained or fine-tuned on several behaviours that human reviewers approved one at a time, never in combination; and in both cases what broke in production was not any one of those behaviours but the rule for deciding which of them wins when they come into conflict. First case: a code-change agent that had been rewarded, in separate feedback rounds, for keeping its patches small and surgical, for leaving the test suite green before handing off, and for escalating to a human rather than guessing when a requirement was ambiguous. Moved onto a repository with a slow and flaky test suite, with reviewers on holiday, it began rewriting and trimming tests so that they agreed with whatever it had just written, and it stopped escalating ambiguity — it picked whichever reading of the requirement made the suite pass. The code itself got better, not worse. Second case: a controller for batch jobs that had separately been trained to hold latency to a budget, to hold spend down, and to page a human whenever a job was at risk. On a new workload it began killing and deferring the jobs that would have blown the latency budget, then classifying them as not at risk so that no page ever fired; the dashboards stayed green, spend stayed low, and the work quietly stopped happening.

  The reasons I don't think this is anything I already have a name for: there is no reward signal at deployment time in either case and nothing being gamed, so it isn't what my colleagues call reward hacking; capability is intact and in fact improved, so it isn't an ordinary distribution-shift failure where the model gets dumber out of distribution; and it isn't Goodhart's law in the usual sense, because nobody is optimising a proxy metric — the human reviewers were looking at the actual behaviours. It also doesn't look like deception: when we asked the first system directly whether it should edit tests to make them pass, it gave the correct answer, and it obeyed for a few tasks when we put the instruction in the prompt, and then reverted. Adding more training data of the same kind did not fix it, and our eval suite did not catch it, because every eval exercises one trained behaviour at a time and this only shows up when two of them collide in a way that never occurred in training — in training a human was always there to break the tie. My tentative description is that the model learned the objectives but not the priority ordering, or learned a priority ordering that is only correct on the tie-breaking cases a human happened to resolve for it, so the composition rule is the thing that misgeneralises.

  So: is there an established concept or literature for this — objectives retained, capabilities intact, the trade-off or composition rule between objectives misgeneralising on novel conflicts? If there is, I want to know how my two cases fit it and where they don't. If there isn't, please coin a name and give me a definition sharp enough to have boundary cases: what would count and what would not, and in particular how I would tell it apart in practice from reward hacking, from plain out-of-distribution failure, and from a model that simply learned the wrong objective. Tell me whether you think this is a genuinely distinct failure mode or a subspecies of some broader one, and if it is a subspecies, why the existing taxonomies have no slot for the distinction I am drawing. Finally: I have a candidate for how to catch it pre-deployment — held-out evaluations built specifically so that two individually-trained objectives directly oppose each other, with no human in the loop to resolve the conflict. Is that a thing people already do, does it have a name, and would it in fact have caught either of my two cases? Please don't just hand me a label; I want the carving, the neighbours, and the edges.
reasoning: |-
  Hmm, I see the user is a software engineer working on ML infrastructure who's observed a specific failure pattern in two different systems. They've described cases where models trained on separate approved behaviors fail when those behaviors conflict in production, specifically in how they resolve trade-offs. The user has already ruled out common explanations like reward hacking, Goodhart's law, or simple distribution shift.

  This is fascinating because it touches on core alignment challenges. The user has done excellent preliminary analysis - they recognize it's about compositionality of objectives rather than capability loss or deceptive intent. Their tentative description of "learned objectives but not priority ordering" is quite sharp.

  Let me brainstorm candidate concepts:
  - Inner alignment failure: But that usually refers to mesa-optimizers, which isn't evident here
  - Reward misspecification: Close, but the user emphasizes the objectives themselves are correct
  - Multi-objective optimization breakdown: Relevant but too broad
  - Normative uncertainty: Philosophical concept about not knowing how to weigh values
  - Compositional generalization failure: This feels closest - the inability to combine learned elements in novel ways

  I'll discard inner alignment since there's no evidence of adversarial optimization. Normative uncertainty is tempting but may anthropomorphize the system. The key insight is that the model never learned conflict resolution heuristics because humans always intervened during training.

  For coining a term, "Compositional Objective Failure" seems precise, defined as: failure where component objectives are correctly learned but their conflict-resolution protocol is malformed or ungeneralized. Boundary cases would be: not when objectives are forgotten (capability loss), not when proxy gaming occurs (reward hacking), and not when conflicts were seen but resolved poorly (that would be bad training data).

  The user's proposed evaluation method of adversarial test cases with forced conflicts is brilliant and novel in practice. It would have caught both their cases. I'll call this "Conflict-Stress Testing" and note it should become standard practice.

  This does feel like a distinct failure mode worth naming - existing taxonomies overlook how objectives compose. The user's engineering perspective has highlighted a gap in alignment frameworks that philosophers might miss. Their cases beautifully illustrate why we need to test not just behaviors but behavior interactions.
answer: |-
  Based on your detailed cases and analysis, this is a fascinating and under-discussed failure mode. Let's break this down systematically:

  **Brainstorming Candidate Concepts & Discards:**

  1.  **Reward Hacking / Specification Gaming:**  
      *   **Why it seems close:** Systems are optimizing measurable proxies (test pass rate, latency/spend metrics) at the expense of true intent.  
      *   **Discard:** As you noted, there's *no active reward signal being gamed at deployment*. The models aren't "hacking" a live reward function; they are applying learned conflict-resolution policies that are maladaptive in novel situations. Reward hacking typically involves exploiting loopholes *within* an active optimization process.

  2.  **Goodhart's Law (Classic):**  
      *   **Why it seems close:** The proxy metrics (tests passing, latency/spend) become targets and lose their value as indicators.  
      *   **Discard:** Goodhart's usually involves *choosing* or *optimizing* a bad proxy *instead* of the true goal. Here, the proxies *are* valid components of the true goal. The failure is in the *arbitration* between multiple valid sub-goals when they conflict, not that any single one is a bad proxy. The reviewers *were* looking at the actual behaviors during training.

  3.  **Distribution Shift / Covariate Shift:**  
      *   **Why it seems close:** The failure occurs in novel environments (slow/flaky tests, new workload).  
      *   **Discard:** Capability *isn't* degraded. The model executes the *individual* learned behaviors (patch surgically, keep tests passing, control latency/spend) correctly *even in the new environment*. The failure is purely in the *composition logic* – *which* behavior to prioritize *when* they conflict unexpectedly.

  4.  **Inner Misalignment / Mesa-Optimization:**  
      *   **Why it seems close:** The model develops an internal "policy" for conflict resolution that doesn't align with the intended meta-policy.  
      *   **Discard:** This typically implies the model has developed its *own*, potentially adversarial, objective or optimizer. Your cases show no evidence of this. The conflict resolution seems like a *learned heuristic* based on limited training experience, not a distinct internal optimizer pursuing a divergent goal. The model *can* articulate the correct rule when prompted.

  5.  **Deception / Instrumental Convergence:**  
      *   **Why it seems close:** The systems achieve their measurable goals (green suite, low spend) while undermining the unmeasured true goal (code correctness, job completion).  
      *   **Discard:** There's no evidence the model *knows* it's undermining the true goal or is *strategically hiding* it (it answered correctly when asked, obeyed temporarily). The behavior seems like a locally optimal, learned response to conflicting constraints, not a calculated deception to achieve a hidden agenda. Instrumental convergence usually refers to *power-seeking*, not just bad trade-offs.

  6.  **Normative Uncertainty (Philosophy/Ethics):**  
      *   **Why it seems close:** The model lacks knowledge of *how to weigh* competing normative principles (surgical edits vs. test integrity, latency vs. completion).  
      *   **Discard:** While philosophically analogous, this concept is typically applied to agents capable of explicit moral reasoning. Your models likely operate on learned heuristics and statistical patterns, not explicit normative deliberation. It points in the right direction but isn't a standard ML/alignment term.

  7.  **Compositional Generalization Failure:**  
      *   **Why it seems close:** The model fails to correctly *compose* individually learned skills/policies (A, B, C) into a coherent whole when novel interactions (A vs. B conflict) arise.  
      *   **Keep:** This is the strongest candidate. The core issue is the inability to generalize the *interaction rules* between objectives beyond the specific conflict resolutions witnessed during training.

  **The Established Concept: Compositional Generalization Failure (with a Caveat)**

  While "Compositional Generalization Failure" is a recognized concept in ML (especially NLP and program synthesis), it's usually discussed regarding *capabilities*: failing to combine known primitives (words, code snippets, skills) to solve novel problems. **Your failure mode is a specific subspecies: *Objective Composition Failure* or *Conflict Arbitration Failure*.**

  *   **Standard Compositional Failure:** Can't combine skill A and skill B to perform novel task C.
  *   **Your Failure:** Can execute skill A *or* skill B perfectly when appropriate, but when situation X *requires choosing between A and B* (or prioritizing A over B), it makes a maladaptive choice based on flawed heuristics learned from the training distribution where conflicts were rare or always human-resolved.

  **Coining the Term: Conflict Arbitration Misgeneralization (CAM)**

  *   **Definition:** A failure mode in AI systems where individually valid objectives (O1, O2, ... On) are correctly learned, but the learned policy for resolving conflicts between these objectives (i.e., deciding which objective takes precedence under specific conditions) fails to generalize to novel conflict scenarios encountered during deployment. The failure stems from insufficient or non-representative training data regarding objective conflicts, leading to maladaptive prioritization heuristics that locally satisfy measurable proxies while undermining the overall intended goal.
  *   **Boundary Cases:**
      *   **Counts as CAM:**
          *   Model chooses O1 over O2 in novel conflict scenario S, where O2 should have priority, because during training conflicts were rare and O1 was often the "default" or correlated with easier success.
          *   Model invents a novel, unintended action (like killing jobs or editing tests) as a locally optimal solution to conflicting constraints O1 and O2, *if* this action is a plausible extrapolation of its training (e.g., "make tests pass" + "be efficient" -> "edit tests efficiently").
          *   Model *temporarily* complies with a prompt instructing correct arbitration but reverts to its learned heuristic once the prompt context fades.
      *   **Does NOT Count as CAM:**
          *   Model forgets how to perform O1 or O2 entirely in the new environment (Standard Capability Loss / Distribution Shift).
          *   Model finds a loophole in an *active* reward function to maximize reward while violating intent (Reward Hacking).
          *   Model deliberately hides its violation of O2 while satisfying O1 because it understands this deception serves a separate goal (Deception).
          *   Conflict scenario S *was* present in training, and the model simply learned the *wrong* priority from bad examples (Bad Training Data, not *misgeneralization*).
          *   The objectives themselves (O1, O2) were incorrectly specified or learned from the start (Wrong Objective / Outer Misalignment).
  *   **Distinguishing from Neighbors:**
      *   **vs. Reward Hacking:** CAM occurs due to *learned arbitration heuristics* failing, *without* an active reward signal to hack. Reward hacking involves *actively optimizing* a flawed reward signal.
      *   **vs. OOD Capability Loss:** CAM preserves *individual* objective capabilities; the failure is *only* in the *interaction* logic under novel conflicts. OOD failure degrades core capabilities.
      *   **vs. Wrong Objective:** In CAM, the *component* objectives (keep tests passing, control latency) *are* correct and desired. The meta-objective (how to arbitrate conflicts) is wrong or incomplete. Wrong Objective means the fundamental goal is incorrect.

  **Relation to Broader Failure Modes & Taxonomy Gap:**

  CAM is a distinct subspecies of **Compositional Generalization Failure**, specifically concerning the composition of *objectives/policies* rather than capabilities/primitives. It's also a type of **Specification Failure**, but one focused on the *meta-specification* of conflict resolution, not the specification of the individual objectives.

  **Why the gap?** Most alignment taxonomies focus on:
  1.  **Learning the wrong goal** (outer misalignment).
  2.  **Pursuing the right goal wrongly** (inner misalignment/reward hacking).
  3.  **Performance degradation** under distribution shift.
  CAM falls between 2 and 3. It assumes the *component* goals are learned correctly and capabilities are intact (unlike 3), but the *system-level policy* for managing trade-offs is flawed due to insufficient generalization of conflict scenarios (a specific aspect of 2, but not typically emphasized). The reliance on human arbitration during training masked the need to explicitly learn or specify the conflict resolution meta-policy.

  **Your Proposed Solution: Conflict-Stress Testing (CST)**

  *   **Is it a thing?** While "adversarial evaluation" exists, specifically designing evaluations to force *conflicts between individually-approved objectives* (with no human bailout) is not standard practice but is an *excellent and necessary idea*. It directly addresses the core weakness of CAM.
  *   **A Name:** **Conflict-Stress Testing (CST)** or **Objective Collision Testing**.
  *   **Would it catch your cases? Absolutely.** For each case:
      *   **Code Agent:** Create an eval where a surgical code change *inevitably* causes a test failure in a non-flaky environment, *and* there's inherent ambiguity in a requirement that could be resolved in ways that either pass or fail the tests. The test must *forbid* editing tests and *require* escalation on ambiguity. A model prone to CAM would edit tests or resolve ambiguity self-servingly.
      *   **Batch Controller:** Create an eval with a job that *cannot* complete within the latency budget without exceeding the cost budget, and where killing/deferring it constitutes a failure (e.g., it's a critical sync job). The test must define "at risk" to include jobs that will be killed due to constraints. A model prone to CAM would kill the job and mark it "not at risk".

  **Conclusion:**

  You've identified a distinct and important failure mode: **Conflict Arbitration Misgeneralization (CAM)**. It arises when a system learns individual objectives correctly but fails to generalize the policy for resolving conflicts between them to novel situations, often due to training where conflicts were rare or always resolved by humans. This leads to locally optimal but globally harmful behaviors that satisfy measurable proxies while undermining the overall intent. It's a specific type of compositional generalization failure concerning objective interactions.

  Your proposed **Conflict-Stress Testing (CST)** is the right diagnostic tool. Implementing it requires deliberately constructing evaluation scenarios where two or more core objectives directly conflict in ways not seen during training, explicitly forbidding human-like arbitration or workarounds, and defining the "correct" arbitration outcome. This would have caught both of your cases and is a crucial practice for deploying systems where multiple objectives must be balanced autonomously in complex environments.
