  Here are three brainstormed framings, followed by the selected draft:

  **Brainstormed Framings:**

  1.  **The "Resource Scarcity Optimizer" Frame:** Focus on how traditional resource-based means-testing is outdated. The economist argues that in an age of potential hidden assets and digital fraud, we must shift to taxing *time* and *cognitive bandwidth* – resources the truly needy have in critically short supply and which fraudsters (or the comfortably off) hoard. The inefficiencies are "targeted temporal taxation."
  2.  **The "Behavioral Phenotype Screening" Frame:** Frame the ordeals as a way to observe and filter based on inherent behavioral traits supposedly correlated with genuine need (e.g., tolerance for frustration, ability to navigate chaos, desperation overcoming exhaustion). The economist earnestly discusses calibrating "adversity exposure" to select for the optimal "needy phenotype."
  3.  **The "Anti-Spoofing Security Upgrade" Frame:** Directly confront the AI threat. Position the current system as vulnerable to automation ("fraudulent signalers" using bots/LLMs). The proposed ordeals are "next-gen biometric and behavioral authentication protocols" designed to be uniquely human and contextually costly, framed as essential national security against digital welfare fraud.

  **Selected Frame:** **#1 The "Resource Scarcity Optimizer" Frame** (It most cleanly maps the differential cost requirement onto a tangible, relatable resource – time/energy – and allows for a direct, humorously grim response to the AI threat.)

