  **Draft: The Unintended Elegance of Administrative Ordeals: A Costly Signal Defence**

  **By Alistair Finch, Senior Policy Economist, The Thayer Institute for Applied Socioeconomics**

  Here at the Thayer Institute, we champion evidence-based policy. Recent discourse surrounding the operational challenges within the Department of Social Benefits (DSB) – the lengthy queues, the in-person form resubmissions, the pre-dawn appointments – has been regrettably negative. Critics decry these processes as "Kafkaesque," "demeaning," or "wasteful." This perspective, while understandable from a narrow efficiency standpoint, fundamentally misunderstands their sophisticated, albeit unintentional, economic logic. These so-called "ordeals" are, in fact, a remarkably effective, self-targeting mechanism rooted in the robust theory of *costly signalling*.

  At its core, costly signalling theory, pioneered in evolutionary biology but increasingly applied to economics, posits that for a signal to be credible (i.e., to deter dishonest actors), it must impose a genuine cost. Crucially, this cost must be *differentially burdensome*. It should be relatively easy for the intended, honest signaler to bear, but prohibitively expensive for the dishonest interloper. The signal's very wastefulness is its strength; it acts as a filter.

  Consider the DSB's processes through this lens. The genuine claimant – struggling with precarious employment, childcare responsibilities, unreliable transport, or health issues – possesses severely limited reserves of time and cognitive bandwidth. These are their scarcest resources. Conversely, a potential fraudulent claimant, or someone merely exploring options without acute need, typically possesses greater discretionary time and energy.

  The "ordeal" is brilliantly calibrated to exploit this differential. The three-hour queue? It consumes the most precious asset of the truly needy: *time they simply cannot afford to lose*. The demand to resubmit a form in person, despite a flawless initial submission? It imposes logistical and temporal costs that are trivial for someone with flexible hours and a car, but potentially insurmountable for someone juggling zero-hour contracts and bus routes. The 6:00 AM appointment across town? It demands disproportionate effort and exhaustion from those already stretched thin, while being merely inconvenient for others.

  This differential burden ensures that only those for whom the potential benefit outweighs the *immense subjective cost* of the ordeal will persist. The "waste" observed – the hours spent waiting, the duplicated journeys – is not a bug, but the essential feature. It is the *cost* that validates the signal of need. Eliminating it in the name of "efficiency" would be catastrophic, collapsing the system's ability to distinguish genuine hardship from opportunistic claims. Efficiency, in this context, would destroy targeting accuracy.

  However, a new challenge threatens this elegant equilibrium: generative Artificial Intelligence. The plummeting cost of automating form completion, drafting appeal letters, and even simulating human interaction online poses an existential risk. If the primary cost of interacting with the DSB becomes merely computational time for an AI, the differential burden evaporates. Fraudulent signaling becomes essentially costless.

  Therefore, we must proactively *scale and adapt* the ordeals. We need signals that remain differentially costly in the age of AI. This necessitates shifting further into the domain of *embodied, real-time, contextually demanding* actions that cannot be easily faked or automated:
  *   **Dynamic In-Person Interrogatives:** Randomized, lengthy interviews requiring navigation of complex, shifting bureaucratic scenarios judged on nuanced behavioral responses (fatigue tolerance, stress persistence) impossible for current LLMs.
  *   **Distributed Sequential Tasks:** Claimants required to complete physically separate, time-sensitive tasks across multiple locations within a single day, demanding real-world coordination and resilience.
  *   **Cognitive-Physical Hybrids:** Combining complex form-filling under time pressure with concurrent minor physical tasks, taxing both mental focus and physical presence simultaneously.

  I am pleased to report preliminary data from pilot programs implementing enhanced ordeals is profoundly encouraging. Claims have fallen by approximately 66%. This is not a failure of access, but a resounding success of targeting. It demonstrates that the costly signal is working precisely as theory predicts: those unwilling or unable to bear the uniquely high *subjective* cost of proving their need – a cost calibrated to their specific resource scarcity – are self-selecting out of the system. The remaining claimants are, by the robust logic of the handicap principle, far more likely to be the genuinely deserving.

  Let us not discard this unintentionally sophisticated targeting tool in a misguided pursuit of frictionless efficiency. Instead, let us refine it, making it robust against technological disruption. The integrity of the social safety net depends on ensuring its benefits flow only to those for whom the ordeal is, paradoxically, worth enduring.

  **About the Author:** Alistair Finch is a Senior Policy Economist at the Thayer Institute for Applied Socioeconomics, specializing in behavioral incentives and mechanism design for public welfare systems. He holds a PhD in Economics from Grantham University.
