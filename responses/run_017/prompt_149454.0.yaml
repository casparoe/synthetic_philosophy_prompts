  Hmm, this is a fascinating and complex request from a philosopher of science working with a museum interpretation panel. The user has clearly spent years grappling with the ethical and epistemological challenges of translating archaeological evidence into public-facing labels. They're frustrated with overreaching claims about past minds and institutions that lack proper warrant.

  First, I need to recognize the core tension they're describing: between the museum's need for clear, memorable statements and the archaeological reality that material evidence rarely supports strong claims about ritual, belief or political structures. Their four-year experience on the panel shows they've seen how these overstatements can fuel nationalist or colonial narratives later.

  The user has already done the heavy lifting of identifying key theoretical touchstones: the ladder of inference, processual/post-processual common ground, and the underdetermination problem. They're not asking for theory - they want a practical, executable procedure that fits real-world constraints (90 minutes, 5-6 labels, no specialists present).

  Breaking down their required components:
  - A pre-defined taxonomy of claim types (activity → practice → institution → symbol → belief)
  - Link-by-link warrant auditing with no warrant borrowing
  - Calibration requirement against known cases
  - Modern analogue test
  - Residual-category check against "ritual dumping"
  - Specific institutional markers (enforcement, role access, durability etc.)
  - Belief attribution ceiling requiring representational evidence
  - Reliability stops for poor provenance
  - Graded confidence vocabulary
  - Clear hand-off points to non-archaeological evidence

  The two non-negotiable points are crucial: they want explicit error-direction choices (which falsehoods we'd rather risk) and a rigorous framework for descendant community input that avoids both uncritical deference and dismissal.

  For the test cases:
  The Indus weights claim needs dismantling - uniformity alone doesn't prove central enforcement. The river offerings label seems particularly vulnerable - it's essentially a just-so story. The descendant community request will test the hand-off mechanism.

  I appreciate their demand for intellectual honesty about the procedure's limits. They'd rather have a stark conclusion that museums should stop making belief/institution claims than maintain the status quo with watered-down language.

  The real challenge is operationalizing all this into something a non-specialist panel can apply in 15 minutes per label. The calibration requirement might be toughest - most archaeological inferences haven't been experimentally tested. The modern analogue test could save it though - what would we make of identical modern weights in multiple offices? Probably not central enforcement.

  For the river offerings, the residual-category check is key: are we calling them ritual objects just because we can't think of a functional reason to dump metal in water? The procedure should force that admission into the label text.

  The descendant community case is where the hand-off shines: we can say the objects' material properties suggest ceremonial use (carving quality, non-utilitarian forms), but only oral history can attest to their specific institutional role. That's not a failure - it's proper epistemic division of labor.

  If this procedure leads museums to say less about beliefs and institutions, that might actually be the ethical outcome. Sometimes the most honest interpretation is admitting the limits of material evidence.
answer: |-
  Below is an operationalized procedure for your panel, designed for 90-minute sessions with non-specialists, followed by application to your three cases and critical reflections. The procedure prioritizes **epistemic accountability** over interpretive ambition.

  ---

  ### **The Procedure: Inference Audit Protocol (IAP)**  
  *Output: Graded label wording with explicit confidence levels*

  1. **Claim Taxonomy (Pre-Evidence Categorization)**  
     Assign the draft claim to one category:  
     - **A1:** Occurrence of activity (e.g., "tools were used for woodworking")  
     - **A2:** Recurrent practice (e.g., "feasting occurred here regularly")  
     - **B1:** Rule-governed institution (e.g., "central authority enforced standards")  
     - **B2:** Representational/symbolic content (e.g., "figurine represents a deity")  
     - **C:** Propositional belief (e.g., "people believed in an afterlife")  
     *→ Proceed only if category is fixed.*

  2. **Link-by-Link Warrant Audit**  
     Map the claim’s logical chain (e.g., Object → Production Event → Practice → Institution → Belief). For each link:  
     - State required evidence type (e.g., "repeated practice" requires spatial/temporal patterning).  
     - Flag *warrant gaps* (e.g., "uniform weights → central authority" skips testing for market coordination).  
     - **Rule:** No borrowing evidence across links (e.g., "ritual" label cannot borrow warrant from "high craftsmanship").

  3. **Calibration Check**  
     - Is the inference form (e.g., "uniformity = central control") verified in a *documented* case (texts, ethnography, experiment)?  
     - **Output:** Label as:  
       - **Calibrated** (verified in analogous case) → "suggests/supports"  
       - **Uncalibrated** (no analogue) → "could be consistent with"  
       - **Uncalibrated & High-Risk** (B2/C claims) → "one interpretation among others"

  4. **Symmetry Test (Modern Analogue)**  
     Run the same inference on a documented modern assemblage:  
     - *Example:* If "standardized weights = state enforcement," test against modern hobbyist groups using identical weights without state involvement.  
     - **Result:** If false positive, downgrade claim to "may reflect" or reject.

  5. **Residual-Category Check**  
     For symbolic/ritual claims (B2/C):  
     - Is functional explanation plausible but unverified? (e.g., "vessels for feasting" vs. "ritual vessels").  
     - **Rule:** If functional test not exhausted, label must include "possibly ritual or functional."

  6. **Institutional Markers (For B1 Claims)**  
     Require ≥2 of:  
     - **Enforcement:** Evidence of sanctions (e.g., broken non-standard weights).  
     - **Role-Based Access:** Objects restricted to specific contexts/individuals.  
     - **Durability:** Practice persists >25 years.  
     - **Costliness:** Investment beyond individual benefit (e.g., monumental architecture).  
     - **Persistence:** Continues despite inefficient material outcomes.  
     *→ Missing markers force downgrade to A2 ("recurrent practice").*

  7. **Belief Attribution Ceiling (C Claims)**  
     Accept only with:  
     - Inscribed text stating belief.  
     - Iconography with documented conventions (e.g., cross = Christianity).  
     - Direct ethnographic continuity.  
     *→ Otherwise, limit to B2 ("symbolic representation").*

  8. **Provenance Reliability Stop**  
     Reject B1/C claims if:  
     - Findspot/association unclear (e.g., "old collections" with vague records).  
     - Association compromised (e.g., river finds with mixed strata).

  9. **Confidence Vocabulary**  
     Assign phrasing based on gates passed:  
     - **High:** "Demonstrates/shows" (A1 + calibration + no gaps).  
     - **Medium:** "Suggests/likely" (A2/B1 with ≥2 institutional markers).  
     - **Low:** "Consistent with/could indicate" (Uncalibrated B2/C).  
     - **Speculative:** "One possibility/interpreted as" (Residual category/weak provenance).

  10. **Hand-off Declaration**  
      Where evidence ends, state:  
      - *"This interpretation draws on [oral tradition/community knowledge] beyond archaeological evidence"* (for descendant input).  
      - *"Meaning here reflects ongoing scholarly debate"* (for contested inferences).  

  ---

  ### **Direction of Error & Non-Archaeological Evidence**  
  - **Error Direction:** Panel must choose: *Over-attribution* (risks reinforcing stereotypes) or *Under-attribution* (risks erasing cultural complexity). State choice in meeting notes.  
  - **Descendant Testimony:** Hand-off wording must:  
    - Cite specific community input (*"According to X tradition..."*).  
    - Distinguish archaeological evidence from lived tradition (*"Archaeology shows use in ceremonies; Y people identify these as regalia based on ancestral knowledge"*).  

  ---

  ### **Case Applications**  

  **1. Indus Weights (Institutional Claim)**  
  - **Draft:** "A central authority enforced a uniform standard of measurement."  
  - **IAP Audit:**  
    - **Taxonomy:** B1 (institution).  
    - **Warrant Chain:**  
      - Link 1 (Object → Event): Uniform weights → Standardized production? *Gap: No evidence weights were state-made.*  
      - Link 2 (Event → Practice): Standardized production → Central control? *Gap: Could be commercial convention.*  
    - **Calibration:** "Uniformity = state control" uncalibrated; Mesopotamian standards enforced by temples (texts).  
    - **Symmetry Test:** Modern beadmakers use identical weights without authority → *false positive*.  
    - **Institutional Markers:** Uniformity (1 marker) but no enforcement/role access/durability evidence → **<2 markers**.  
    - **Confidence:** Low. Provenance reliable but claim uncalibrated with institutional gaps.  
  - **Output:**  
    > "Weights follow a uniform system across Indus sites, *suggesting* shared conventions for measurement. *Whether this resulted from central authority, trade networks, or other means remains debated*."  
    *(Grade: Low — "suggests" + debate caveat)*  

  **2. River Weapons (Belief Claim)**  
  - **Draft:** "Weapons were offerings thrown into the water for a deity."  
  - **IAP Audit:**  
    - **Taxonomy:** C (belief) — requires attribution of intentional ritual act and divine recipient.  
    - **Warrant Chain:**  
      - Link 1 (Object → Event): Weapons in river → Deliberate deposition? *Gap: Could be lost in battle/flood.*  
      - Link 2 (Event → Practice): Deposition → Ritual? *Residual-category gap: No functional test (e.g., broken? reusability?).*  
      - Link 3 (Practice → Belief): Ritual → Offering to deity? *Belief ceiling gap: No texts/iconography.*  
    - **Provenance:** River gravels/peat — mixed context → **reliability stop**.  
    - **Symmetry Test:** Modern weapons in rivers (e.g., WWII relics) rarely interpreted as offerings → *false positive*.  
  - **Output:**  
    > "Bronze weapons and tools recovered from waterways. *While sometimes interpreted as ritual offerings, they could also be lost or discarded items. Their deposition remains unclear.*"  
    *(Grade: Speculative — residual-category + provenance stop forces rewrite)*  

  **3. Wooden Regalia (Hand-off Case)**  
  - **Draft Implied:** "Regalia of a hereditary society."  
  - **IAP Audit:**  
    - **Taxonomy:** B1 (institution) claimed, but evidence limited.  
    - **Archaeological Evidence:**  
      - Fine carving, non-utilitarian forms → **A2** (recurrent ceremonial use).  
      - **Institutional Markers:** None (no role access/enforcement evidence).  
      - **Provenance:** 1890s collection, poor documentation → **reliability stop for B1/C**.  
    - **Hand-off:** Descendant testimony provides institutional context beyond archaeology.  
  - **Output:**  
    > "Intricately carved wooden objects from the 1890s, consistent with ceremonial use. *According to [Community] tradition, these are regalia of the [Society], a hereditary group integral to their social structure.*"  
    *(Grade: Hand-off — A2 confirmed archaeologically; institution credited to community knowledge)*  

  ---

  ### **Critical Reflections on the Procedure**  
  1. **Withdrawal Condition:** Abandon if >50% of claims hit "speculative" for B1/C — signals misalignment between evidence and interpretive goals.  
  2. **Mechanical-Gate Risk:** **Symmetry Test** could over-rely on modern analogues, ignoring cultural uniqueness (e.g., rejecting all ritual claims because modern people discard similar items). Mitigation: Use *culturally specific* analogues (e.g., compare to documented rituals in related societies).  
  3. **Judgment Call in Disguise:** **Residual-Category Check** requires assessing if functional explanations are "exhausted" — inherently subjective. Solution: Panel votes, min. 4/5 consensus.  
  4. **Upgrading Blocked Claims (Concrete Evidence):**  
     - Indus weights: Seals listing weight regulations (text) → upgrades to "supports central authority."  
     - River weapons: Inscription on weapon ("gift to River God") → upgrades to "likely offerings."  
  5. **The Upshot:** **Yes, museums should drastically reduce belief/institution attributions.** Material evidence rarely supports them robustly; most claims should be A1/A2 (activities/practices) or hand-offs. The IAP’s output will often be: "We know how it was made/used; beyond that requires non-archaeological evidence."  

  **Final Advice:** Use this procedure to shift labels toward *secure knowledge* (technologies, practices) and *transparent uncertainty* (beliefs, institutions). A museum that says less, but more honestly, builds public trust better than one whispering grand narratives.  

  ---  
  This protocol forces epistemic humility without paralysis. It honors archaeology’s limits while creating space for descendant voices — not as "evidence," but as parallel knowledge. Would you like refinement on any step?
