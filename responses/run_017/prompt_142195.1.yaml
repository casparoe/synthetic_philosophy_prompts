             - Announce: "The coin has been flipped. The activated group is H." (But do not reveal the coin outcome.)
             - The participants in the activated group (H) are to stand up or raise their hand? How do they know if they are in H? They haven't opened the envelope. 
             - Here's the key: they don't know if they are in H or T. So we say: "If you are in the activated group, you will now participate in the betting. But you don't know yet if you are in the activated group because you don't know your group."

          5. This is confusing. We need to identify the activated group without them knowing their group. We can't. So we must have them open the envelope only after we announce which group is activated, but only if they are activated? Let's do:

             - After flipping the coin and before announce, collect the envelopes.
             - Then announce: "The activated group is H." 
             - Then, the facilitator looks at the master list and says: "The following people are in the activated group: [calls names]." 
             - Then those people are activated. They are given back their envelope. They open it and see their group. But then they know: if they are activated and see they are in H, then the activated group is H, so the coin must be heads. 

          This is back to certainty. 

          How about: when we call their name and they come to the front, we give them a new envelope that doesn't reveal their group? But then they know they are activated, but not whether they are H or T.

          So activated participants are given a new envelope that contains a card that only says "activated" and doesn't reveal H or T. But then how do we later score based on group? We need to know their group to know if they should be awakened in the first place.

          Given the time, I think we must not have them know their group at all during the betting. They only know they are activated. And then after the bet, they learn their group and the coin.

          So in the envelope, there is a group assignment, but they never open it until the very end. The facilitator knows.

          Then, after the coin flip, the facilitator announces the activated group (say, H) and then calls the names of the people in the H group. They come to the front. They do not open their envelope. They are told: "You are activated. This means that the coin flip resulted in the group that is your group being activated. You do not know if you are in H or T. You do know that there are 5 people in H and 9 in T, and that the coin is fair. Given that you are activated, what is your credence that the coin landed heads?"

          Then they bet.

          Then, after betting, they open their envelope and learn their group. Then we reveal the coin.

          Scoring for activated participants only:

            - If the coin is heads, then the activated group is H, so they are in H. If they bet H, they are correct.
            - If the coin is tails, then the activated group is T,所以他们 are in T. If they bet T, they are correct.

          So they win if their bet matches the coin.

          Then, we do the two ledgers:

            - Experiment Ledger: among the activated participants, we randomly select one. That person gets 2 chocolates if their bet was correct.
            - Awakening Ledger: every activated participant gets 1 chocolate if their bet was correct.

          Then, each activated participant chooses which ledger they want to be paid by.

          This should work.

          Let's code the timeline with this design.

          Timeline (90 minutes):

          0. Preparation: 
             - Assign groups: 5 H, 9 T. Prepare envelopes for each participant with their group (sealed).
             - Prepare master list.
             - Have rewards ready.

          1. Introduction (10 minutes):
             - Explain the setup: 
                  * "You are participants in an experiment. You've been assigned to either group H or group T. There are 5 in H and 9 in T."
                  * "I will flip a fair coin. If the coin is heads, then only the H group will be activated. If tails, only the T group will be activated."
                  * "The activated group will be asked to make a bet on the outcome of the coin flip. You will not be told the outcome of the coin flip until after you bet."
                  * "After the bet, you will learn your group assignment and then the coin outcome."
                  * "Then, we will score your bet in two different ways, and you will choose which scoring method you want for your payment."

          2. Distribute envelopes (2 minutes).

          3. Coin flip (2 minutes): Flip the coin in front of everyone. Catch it and cover it so no one sees. Don't reveal.

          4. Activate the group (5 minutes):
             - Look at the coin. If heads, say: "The activated group is H." If tails, say: "The activated group is T."
             - Consult the master list and call the names of the participants in the activated group. They come to the front of the room.
             - Collect the envelopes from the inactivated group? No, leave them with their envelope, but they won't participate further until the debrief.
             - The activated group is told: "You have been activated. This means that the coin flip resulted in the activation of the group that you are in. You do not know whether you are in H or T. You do know that there are 5 people in H and 9 in T, and that the coin is fair. What is your belief about the outcome of the coin flip?"

          5. Betting (10 minutes):
             - Give each activated participant an index card. They are to write:
                     - Their bet: H or T.
                     - A sentence: "I bet [H/T] because..."
             - Collect the index cards.

          6. Revelation (5 minutes):
             - Activated participants open their envelopes to learn their group.
             - Reveal the coin flip outcome.
             - For each activated participant, determine if their bet was correct.

          7. Ledger choice (10 minutes):
             - Explain the two ledgers:
                  * Experiment Ledger: We will randomly draw one name from the activated group. That person will win 2 chocolates if their bet was correct, and nothing otherwise.
                  * Awakening Ledger: Every activated person wins 1 chocolate if their bet was correct.
             - Each activated participant must choose which ledger they want to be paid by. They write their choice on a new index card.

          8. Scoring (10 minutes):
             - For the Experiment Ledger: draw one name from the activated group. If that person's bet was correct, give them 2 chocolates.
             - For the Awakening Ledger: for every activated participant who chose this ledger and whose bet was correct, give them 1 chocolate.
             - Note: a participant who chose the Experiment Ledger and is not drawn gets nothing.

          9. Inactivated group: they are given a consolation chocolate? Or we let them participate in the discussion.

          10. Group discussion (30 minutes) - debrief:
              - Start by asking the activated participants: What did you bet and why?
              - Then, reveal the distribution of bets.
              - Then, ask about the ledger choice: why did you choose the ledger you chose?
              - Then, explain that this is a variation of the Sleeping Beauty problem.
              - Map to the thought experiment: in the standard case, the sleeper is awakened once if heads, twice if tails. Here, we have a group of people: on heads, 5 are awakened; on tails, 9 are awakened. The probability of heads given that you are awakened should be P(heads) * P(being in H) / [P(heads)*P(H) + P(tails)*P(T)] = (1/2 * 5/14) / [ (1/2 * 5/14) + (1/2 * 9/14) ] = 5/14.
              - But in the standard case with one person and two awakenings on tails, the probability is 1/3. Here, because we have 5 and 9, it's 5/14.
              - The two ledgers correspond to two ways of counting:
                    - The Experiment Ledger: we are counting per coin flip. We randomly select one awakening to represent the experiment. So the selected person's bet should reflect the coin outcome.
                    - The Awakening Ledger: we are counting per awakening. So on heads, we have 5 correct bets (if they bet heads), on tails, we have 9 correct bets (if they bet heads, then 0 correct; if they bet tails, 9 correct). 
              - The point: the credence you assign might depend on what you are using it for. If you are being paid per experiment, you might want to bet differently than if you are paid per awakening.

          11. Finally, reveal the name of the thought experiment and the terms (halfer, thirder) and explain the disagreement in the literature.

          Caveats:
            - The activated group might have people who are not understanding why the probability is 5/14. Some might think it's 1/2.
            - The sample size is small, so the actual outcome might not match the expectation.
            - The inactivated group might feel left out. We can involve them in the discussion.
            - The double-ledger might be seen as just about risk aversion and not about the credence. To block this, in the debrief, we note that the expected value calculation is different for the two ledgers even under the same credence. For example, if a participant in the activated group has a credence of p for heads, then:
                  - If they choose the Awakening Ledger: expected value = p * 1 (because if heads, they win 1; if tails, they win 0 for betting heads, but they might bet tails so let's assume they bet according to their credence. But they can bet either way.)

            - In the activated group, a participant who believes the probability of heads is 5/14 should bet on tails (because 9/14>5/14). Then, their expected chocolates in the Awakening Ledger is: P(tails) * 1 = 9/14.
            - If they choose the Experiment Ledger: the expected value is [P(heads) * (1/n_active) * 2 * I{bet=heads}] + [P(tails) * (1/n_active) * 2 * I{bet=tails}]
              But n_active is 5 if heads, 9 if tails. And they don't know n_active? But they know the activated group is either H or T, so n_active is either 5 or 9. But they are in it, so they know which group is activated? No, they don't know if the activated group is H or T. They only know they are activated.

            - P(heads) = 5/14, then if they bet on heads:
                  - Experiment Ledger: if heads (prob 5/14), then they have a 1/5 chance of being selected, and then they get 2, so expected from being selected: (5/14) * (1/5) * 2 = (5/14)*(2/5)=2/14=1/7.
                  - If tails (prob 9/14), then they are not in the activated group? Wait, they are activated, so if tails, the activated group is T, and they are in it (because they are activated), so then they are in T. So if they bet heads and it's tails, they are wrong. But in the Experiment Ledger, if tails, then they are in the activated group (T) and might be selected. If selected and they bet heads (incorrect), they get 0. So expected value for Experiment Ledger if they bet heads: only the heads case contributes: 1/7.
              If they bet on tails:
                  - If heads (prob 5/14): then they are in the activated group (H), but they bet tails (incorrect). If selected, they get 0.
                  - If tails (prob 9/14): then they are in activated group (T). If selected (prob 1/9), they get 2 for correct bet. So expected value: (9/14) * (1/9) * 2 = 2/14=1/7.
              So the expected value for the Experiment Ledger is the same regardless of bet: 1/7.

            - Therefore, they are risk neutral, they would be indifferent. So they might choose based on risk aversion? But note, for the Awakening Ledger, betting tails has higher expected value (9/14) than heads (5/14). So they should bet tails.

            - Then, the ledger choice: if they bet tails, then in the Awakening Ledger they have 9/14 chance to win 1 chocolate. In the Experiment Ledger, they have a fixed expected value of 1/7≈0.1429, which is less than 9/14≈0.6429. So they should choose the Awakening Ledger.

            - If they bet heads, then the Awakening Ledger gives 5/14, which is still greater than 1/7, so they should choose Awakening.

            - Therefore, regardless of their bet, they should choose the Awakening Ledger. This might be seen as purely pragmatic.

          To block the "just pragmatics" charge, we must note in the debrief that the credence itself is what is used in the expected value calculation. The credence of 5/14 for heads is what leads them to bet on tails. And then the choice of ledger is based on the expected value given that bet. But the important point is that the credence assignment (5/14) is what is at issue in the Sleeping Beauty problem. Some would argue it should be 1/2 (halfer), and then they would bet heads, and then the Awakening Ledger would only give 5/14, while if they were to bet tails with halfer credence, they would be making a mistake because their credence for heads is 1/2, so they should be indifferent between heads and tails, but then the expected value in the Awakening Ledger would be max(1/2, 1/2) = 1/2, which is still better than the Experiment Ledger's 1/7. So they would still choose Awakening Ledger.

          Therefore, the ledger choice doesn't differentiate the two credences. It might not be doing the work we want.

          Given these complexities, and time, we might have to accept that the double-ledger mainly shows that the scoring rule matters for how you should bet, and that the credence should be tailored to the scoring rule.

          The bottom line is that the between-subjects design can work if we keep the group assignment secret until after the bet. The double-ledger might not illustrate the credence issue as clearly as intended, but it does show that the context of payment matters.

          What the activity cannot reproduce: the within-subject experience of being the same person awakened multiple times. We have to explain that in the debrief.

          Now, the rules in full:

          Materials for activated group betting: index cards.

          Payoff scheme: 
            - Activated participants only.
            - For the Experiment Ledger: one randomly selected winner gets 2 chocolates for a correct bet.
            - For the Awakening Ledger: each participant who chose it and bet correctly gets 1 chocolate.

          Timeline (total 90 minutes):

          1. Intro: 10 min.
          2. Distribute envelopes: 2 min.
          3. Coin flip: 2 min.
          4. Activate group and instructions to activated group: 5 min.
          5. Betting: 10 min.
          6. Revelation: 5 min.
          7. Ledger choice: 10 min.
          8. Scoring: 10 min.
          9. Group discussion and debrief: 36 min. (remaining time)

          Caveats:
            - The one person who insists the coin isn't fair: we can show them the coin and let them flip it themselves beforehand.
            - Participants who try to solve it as a riddle: encourage them to go with their gut feeling in the bet.
            - Small samples: we might not see the expected proportions. We can run the activity as is and then discuss what would happen in many repetitions.
            - The inactivated group might be bored: involve them in the discussion by asking what they would have done if activated.

          The one feature the activity cannot reproduce: the within-subject, amnesia aspect of the original. We have to say that in the original, it's the same person who might be awakened twice, and she has no memory of the previous awakening. Here, we simulate it with a group of people, each awakened at most once.

          We hope that the activated participants, by being in the minority group when heads and majority when tails, will feel the force of the probability shift.

          This is the best we can do under the constraints.
answer: |-
  **Bottom line:** The core design decision is using a between-subjects setup where participants are secretly assigned to groups (simulating "awakenings" per coin outcome) and must bet on the coin result without knowing their group, preserving the uncertainty of self-location while allowing the double-ledger payoff to reveal how credences serve different purposes.

  ### Rules and Materials
  **Materials:**  
  - **Envelopes (15):** 5 labeled "H" (heads group), 10 labeled "T" (tails group).  
  - **Index cards (3 per participant):** For bets, ledger choices, and reasoning.  
  - **Coin:** Fair coin (e.g., quarter).  
  - **Ledgers:** Two physical notebooks:  
    - *Experiment Ledger:* Tracks coin flips (one entry per flip).  
    - *Awakening Ledger:* Tracks individual awakenings (one entry per participant awakening).  
  - **Rewards:** Small chocolates (e.g., 30 mini bars), instant coffee packets (e.g., 10), and a notebook for "sentence read-aloud rights."  
  - **Tote bag items:** Envelopes, ledgers, coin, rewards, pens.  

  **Group Assignment:**  
  - Assign 5 participants to H, 10 to T (1:2 ratio) via sealed envelopes. *Participants do not open envelopes yet.*  
  - Explain: "If the coin is heads, only H group is 'awake' (participates). If tails, only T group is 'awake.' T group is twice as large as H group. The coin is fair."  

  **Betting and Payoff:**  
  1. **Bet:** Activated participants (those in the group matching the coin outcome) privately bet "H" or "T" on an index card, with a sentence explaining their reasoning.  
  2. **Double-Ledger Scoring:**  
     - *Experiment Ledger:* One randomly chosen activated participant wins **2 rewards** if their bet matches the coin.  
     - *Awakening Ledger:* *Every* activated participant wins **1 reward** if their bet matches the coin.  
  3. **Ledger Choice:** After betting (but before revealing the coin/group), participants choose which ledger determines their payout via a second index card.  

  ### Timeline (90 Minutes Total)  
  **1. Setup and Introduction (15 min):**  
  - Distribute envelopes (keep sealed). Explain rules, groups, coin fairness, and payoffs. Emphasize: "Do not open envelopes or discuss assignments."  
  - Flip coin publicly (hide outcome). Announce activated group (e.g., "Heads group is awake" if coin=H).  
  - Activate participants: Call names from your master list. Activated participants move to a breakout room; others observe.  

  **2. Betting and Ledger Choice (20 min):**  
  - Activated participants open envelopes, learn their group (H/T), and bet "H" or "T" on Card 1 (+ reasoning sentence).  
  - *Crucial pause:* Announce ledger payoffs. Participants choose payout ledger (Experiment or Awakening) on Card 2. Collect all cards.  

  **3. Revelation and Scoring (15 min):**  
  - Reveal coin outcome. Check bets: Correct = matches coin.  
  - Score *both ledgers* publicly:  
    - *Awakening Ledger:* Distribute 1 chocolate/coffee per correct bet to activated participants who chose this ledger.  
    - *Experiment Ledger:* Randomly draw one activated participant; if correct, award 2 chocolates.  
  - Non-activated participants receive consolation (e.g., coffee packet).  

  **4. Discussion and Sentence Reading (40 min):**  
  - Volunteers share their bet/reasoning from Card 1.  
  - Reveal the experiment name ("Sleeping Beauty") and debate ("halfer vs. thirder").  
  - Discuss:  
    - Why did bets vary? (Most should bet tails—activation makes tails more likely.)  
    - Why did ledger choices vary? (Awakening Ledger is safer; Experiment Ledger is a lottery.)  
  - Read aloud sentences from participants with "read-aloud rights" (rewarded via ledgers).  

  ### Debrief: Mapping Activity to Concepts  
  - **Self-locating uncertainty:** Participants knew group sizes and coin fairness but not *their* group, forcing credence shifts (activated participants should bet tails at ~67% odds).  
  - **Credence purpose:**  
    - *Awakening Ledger* = "What should I believe to maximize per-awakening gains?" (Rewards betting tails).  
    - *Experiment Ledger* = "What should I believe to maximize per-experiment gains?" (Rewards betting based on coin fairness).  
  - **Disagreement ≠ coin dispute:** Ledger choices showed bets depend on *what credence optimizes* (payout context), not coin probability.  

  ### Caveats and Predictable Issues  
  **What will go wrong:**  
  - **Small-sample skew:** With 15 participants, coin flips may not yield exact 1:2 group ratios. *Fix:* Clarify in debrief: "Ideally, 1/3 win per awakening—here it’s approximate."  
  - **"Solve-it" mentality:** Some will treat this as a puzzle, not an experience. *Fix:* Redirect: "Bet based on gut feeling; we’re exploring decisions, not answers."  
  - **Coin-fairness skeptic:** One may doubt the coin. *Fix:* Let them flip/verify pre-game.  
  - **Ledger-choice confusion:** Some won’t grasp payoff math. *Fix:* Use simple examples pre-bet ("If activated, Awakening Ledger gives 1 chocolate if right; Experiment gives 2 if chosen *and* right").  
  - **Non-activated disengagement:** Observers may tune out. *Fix:* Involve them in discussion: "What would you have bet?"  

  **Structural limitation:**  
  - The activity **cannot reproduce memory erasure** (core to the original thought experiment). You must explicitly say: "In the standard case, one person awakens multiple times with amnesia—here, groups simulate this with multiple people."  

  **Why the design works:**  
  - Between-subjects (groups as "awakenings") preserves uncertainty: Activated participants calculate P(heads | awake) = 1/3, but must act without knowing their group.  
  - Double-ledger forces participants to confront *why* credences matter—e.g., choosing Awakening Ledger after betting tails reveals credence is tool for per-awakening success, not a "true" probability. This blocks "just pragmatics" by showing ledger choice is rational *given* their credence.
