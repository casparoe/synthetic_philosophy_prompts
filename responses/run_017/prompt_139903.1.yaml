prompt: |-
  You are an experienced philosophy interviewer and a specialist in contemporary moral epistemology and the debate between moral particularism and generalism. Before drafting anything, I want you to think carefully: spend a short preliminary pass identifying where a view like the one described below is genuinely vulnerable and where it is stronger than it looks, and only then write the questions. I am an MA student in a seminar on moral epistemology this term, and I have been asked to moderate the Q&A after the second of two talks by a visiting speaker who will also be recorded for our department podcast. After her first talk a few of us in the cohort stayed behind arguing about her position and could not settle whether the generalist objections we had read actually land or whether they simply assume what is in question, so I want the Q&A to do better than that.

  The speaker defends a version of particularism. Her position, as I would summarise it, has these parts: first, holism about reasons, meaning that whether a consideration is a reason at all, and which way it points, can depend on what else is true in the case, so that a feature which favours an action in one case may be no reason at all, or a reason against, in another. Second, there are no true, finitely statable moral principles that codify the moral, and moral judgement is not the application of any such principle. Third, the competent judge's responsiveness is better modelled on perception, or on the kind of expertise a good diagnostician has, than on rule-following. Fourth, she allows that some considerations are default reasons, ones that favour an action unless something is present that defeats or silences them, but she insists that in a case where a defeater is present the default contributes no weight that has to be overcome. Fifth, she concedes supervenience in the minimal sense that there is no moral difference without some non-moral difference, while denying that this yields principles in the sense she rejects. Sixth, and this is the move she reaches for most often, when pressed to codify she turns the demand back on the questioner: any generalist principle still has to be applied, and application is not itself rule-governed on pain of regress, so either the demand for principles proves too much or it bottoms out in exactly the uncodified judgement she is talking about. She is also fond of analogies to jazz improvisation and to clinical diagnosis, and I would like the questions to force those analogies to do real work rather than let her restate them.

  I want eight to ten questions, each one or two sentences, self-contained enough to be asked aloud without a long preamble, ordered so that they begin where she is comfortable and then progressively close off her usual escape routes. For each question, give me the reply you think she is most likely to make, and then one follow-up keyed to that specific reply. Please make sure the set covers the following pressure points, and do not ask her anything generic about her intellectual biography or about what drew her to the topic, and do not suggest readings or citations, since I only need the questions themselves.

  The pressure points I want covered:

  - A framing-problem worry I came up with: if the valence of a feature is holistically sensitive to the rest of the case, then competence in a new configuration seems to require knowing how each feature behaves in combination with every other, which threatens to make moral judgement computationally intractable. She will probably say that the skilled judge simply perceives which features are salient. Your follow-up should press on whether the trained perception of salience is anything other than a principle that is real but not accessible to the agent, and on what would in principle settle whether the content of her judgement is general.

  - A case from my seminar that I want used: a clinic offers bereaved families a generative model trained on a dead relative's messages and voice, so that they can keep exchanging messages with a simulation of her. Assume the family consents and finds it genuinely helpful, and that there is no settled practice on either side. Ask her what her skill model says here, given that there is no shared trained disposition to perceive. If she says the view has no verdict yet, press the follow-up that particularism then looks conservative, able only to adjudicate inside practices that already exist; if she says it does have a verdict, ask where the verdict comes from if not from some general truth about what matters.

  - A construction of mine that I would like tested: a community exactly like ours except that some feature that operates here as a default reason operates there as no reason at all, or as a reason pointing the other way, with everything else adjusted to compensate. Ask whether this is a possible moral practice, and what would make our arrangement the correct one and theirs incorrect. If she answers that the practice is impossible because reasons are what they are, the follow-up should ask for the source of that necessity and whether it is a general truth linking the feature to favouring; if she answers that it is possible, ask whether her view has the resources to say either practice is going wrong.

  - The supervenience concession. If no moral difference comes without some non-moral difference, there appear to be indefinitely many truths of the form that anything with such-and-such a base is thus-and-so morally, which look at least principle-shaped. Ask her whether her quarrel with the generalist is therefore only about what counts as a principle, which would make the dispute verbal, or whether she must also deny that these truths play any explanatory or deliberative role. The follow-up should ask her what test would show the dispute is substantive rather than terminological.

  - Her default reasons and silencing machinery. Press on whether the distinction between default and non-default reasons is itself doing the work of a hedged general principle, and on whether the difference between a reason's being silenced and its being outweighed can be marked without some account of what silences what. Her likely reply is that silencing is a fact about the individual case rather than a rule; the follow-up should ask what makes it the same phenomenon across cases and how we are to recognise it without a criterion.

  - The explanatory question. When she says that the wrong-making features of an action are simply these features in this case, ask what work the making is doing, given that the very same feature can be inert or reversed in a near-identical case. If she distinguishes what makes an action wrong in this case from the claim that there is no difference in verdict without some difference in the base, the follow-up should ask whether the first notion can do any explanatory work at all, or whether it collapses into the second.

  - Her anti-regress move. Ask her to say whether her claim concerns the content of moral judgement or only the psychology of applying rules, since a generalist can concede that application is uncodified while insisting that the content judged is general. If she says it is about content, the follow-up should ask what distinguishes the judge's judgement from a hunch, and why we should expect judges to converge if there is nothing general for them to be right or wrong about.

  Close the set with one question about what would count as evidence against her view: ask her to name a concrete finding, armchair or empirical, that would raise the probability that generalism is true, for example the discovery that some feature's valence is stable across every context anyone can construct, or the discovery that it never is. If she says that nothing could count against it, your follow-up should ask whether that is a defect in the view or an honest consequence of it, and how she would reply to someone who took it to be the former.
reasoning: |-
  Okay, let me approach this systematically. The user is an MA student preparing to moderate a Q&A with a particularism scholar, and needs incisive questions that target specific vulnerabilities while avoiding common pitfalls. 

  First, I need to analyze the speaker's position carefully. Her six core tenets present both strengths and soft spots. The holism about reasons is philosophically robust but raises computational concerns; the perception analogy is vivid but risks being unexaminable; defaults and silencing offer structure while inviting charges of covert generalism; supervenience concessions create tension with her anti-principle stance; and the regress argument is powerful but may conflate psychological and conceptual levels.

  The student wants eight to ten questions hitting seven pressure points. For each, I'll craft:
  - A concise opening question using her terminology
  - Her probable response based on described tendencies
  - A targeted follow-up blocking escape routes

  Key strategic considerations:
  - Opening questions must feel hospitable to draw her in
  - Sequencing should escalate from comfortable to challenging
  - Analogies (jazz/diagnosis) must be weaponized, not just cited
  - Follow-ups should anticipate her moves and cut off retreat

  For the computational tractability worry, I'll question whether perceptual skill masks implicit principles. For the novel tech case, I'll force a choice between conservatism or unexplained verdicts. The twin-communities thought experiment will test her commitment to mind-independent reasons. 

  The supervenience follow-up needs to expose whether her "principle-shaped" truths are inert. On silencing, I'll press whether case-specific facts can sustain cross-context recognition. The explanatory challenge must prevent collapsing making-claims into supervenience. The regress retort demands clarification on content vs psychology.

  Finally, the falsifiability question will test her mettle - if nothing counts against the view, is that a virtue or vice? Throughout, I'll avoid biographical or reading-focused queries per the brief.

  The structure should flow: start with application challenges, move to metaphysical pressure, then explanatory gaps, ending with demarcation criteria. Each exchange must stand alone for podcast clarity while collectively forming a forensic chain.
answer: |-
  Here are eight tightly constructed questions targeting the specified pressure points, sequenced to escalate tension while preempting standard retreats. Each includes her probable reply and a surgical follow-up.

  1.  **Question:** Given holism, how can moral judgment avoid being computationally intractable if the valence of each feature depends on its combination with all others? Isn't skilled perception just bypassing the need for explicit calculation?  
      *Likely Reply:* Competence involves perceiving the salient holistic gestalt directly, like a clinician spotting a disease pattern, not summing atomistic reasons. Calculation isn't required.  
      *Follow-up:* If perception delivers the verdict without calculation, doesn't that imply the perceptual skill *embodies* a general rule – inaccessible to the agent but real – governing how features combine? How could we tell if its content *isn't* general?

  2.  **Question:** Using your skill model, how should we judge the ethics of a bereaved family using a generative AI simulation of their deceased relative for comfort, where consent exists, benefit is real, and no settled practice guides us?  
      *Likely Reply:* Without a shared context shaping perception or precedent, this novel case requires careful, context-sensitive deliberation informed by broader values, not just applying a trained disposition. There's no immediate perceptual verdict.  
      *Follow-up:* Doesn't this make particularism inherently conservative? If novel cases lack verdicts until practices evolve, how can your view critically assess emerging technologies or unjust *new* practices before they become settled?

  3.  **Question:** Imagine a community identical to ours except that a feature that is a default reason here (e.g., promise-keeping) is there no reason at all, or even a reason *against* acting, with other features adjusted so overall wrongness aligns. Is this a possible moral practice?  
      *Likely Reply:* No, this isn't genuinely possible. The normative significance of features like promising isn't arbitrary; reasons are what they are. Their arrangement couldn't be globally "adjusted" to make that alternative coherent.  
      *Follow-up:* What is the source of this necessity? If it's not an exceptionless general truth linking (e.g.) promise-making to pro-tanto favouring, what *does* ground the impossibility of the alternative practice you describe?

  4.  **Question:** You accept supervenience: no moral difference without a non-moral difference. Doesn't this entail indefinitely many true conditionals ("If N1, N2, N3... then M")? If these are principle-shaped truths, is your dispute with generalists only about whether to *call* them "principles"?  
      *Likely Reply:* These truths are merely descriptive *patterns* of supervenience, shadows cast by particular instances. They play no genuine *explanatory* or *deliberative* role – they don't *guide* judgment or *explain why* an act is wrong in a specific case.  
      *Follow-up:* What test could distinguish your view (patterns are inert byproducts) from the generalist's (patterns are explanatory principles)? If both agree on all the particular judgments and the supervenience base, how is this *not* a merely terminological dispute?

  5.  **Question:** Doesn't the distinction between default reasons and non-defaults, coupled with silencing, effectively function as a hedged general principle ("Feature F is a reason unless silenced")? And can we distinguish silencing from outweighing without implicit rules about *what* silences *what*?  
      *Likely Reply:* Defaults and silencing describe phenomenological and functional tendencies, not rules. Whether a defeater *silences* a default reason in a case is a fact *about that particular situation*, discerned holistically, not by applying a rule.  
      *Follow-up:* If silencing is case-specific, how do we recognize it as *the same phenomenon* across different cases (e.g., why call both 'boredom silencing humour's reason' and 'danger silencing curiosity's reason' "silencing")? What criterion marks it *as* silencing rather than outweighing, if not a general relation?

  6.  **Question:** When you say feature F *makes* action A wrong in *this* case, what work is "makes" doing, given that F could be inert or favour A in a minimally different case?  
      *Likely Reply:* "Makes" signifies the *explanation* for the wrongness *in this specific context*. It points to the features that are *constitutively* wrong-making here. Supervenience (no diff w/o diff) is distinct from this explanatory claim.  
      *Follow-up:* If the wrongness is constituted *only* by the entire specific configuration (as holism suggests), doesn't this explanatory claim collapse? What does "F makes it wrong" add beyond "F is part of the unique base that supervenes on this wrongness"?

  7.  **Question:** Your regress argument targets rule-application. Is your claim that the *content* of a competent moral judgment is irreducibly particular, or only that the *psychological process* of applying general rules bottoms out in uncodified perception?  
      *Likely Reply:* It's about content. The judgment "this is wrong" is about *this specific act* in *this specific situation*. Its correctness isn't determined by subsumption under a general principle, but by the normative features present *here*.  
      *Follow-up:* If the judgment's content is truly particular and not general, how does this distinguish the skilled judge's verdict from a mere hunch? Why expect convergence among judges if there's nothing general (a principle or truth) they are collectively tracking?

  8.  **Question:** What concrete finding—empirical or armchair—would significantly raise the probability that generalism is true? For example, discovering a feature whose moral valence is utterly invariant across all contexts, or conversely, discovering that *no* feature exhibits *any* stable valence?  
      *Likely Reply:* Genuine invariance (or total instability) is conceptually impossible on my view. Holism is necessary. Evidence wouldn't point to generalism; it might show our judgments are flawed, but not that principles govern the domain itself.  
      *Follow-up:* If *no* conceivable finding counts against holism/particularism, doesn't this render it unfalsifiable? Is this a fatal flaw suggesting it's non-empirical dogma, or is it an honest consequence of its metaphysical claims about reasons? How do you counter the charge of dogma?

  **Key Design Choices:**
  *   **Order:** Starts with application/tractability (skill model), moves to novelty (AI case), then metaphysics (twin communities, supervenience), mechanism (defaults/silencing), explanation (making-wrong), justification (regress/content), ending with demarcation (falsifiability).
  *   **Escape Routes:** Follow-ups specifically target her predicted replies (perception hiding rules, novelty requiring conservatism, necessity implying general truth, inert patterns, case-specific silencing, explanation collapse, content vs. hunch, unfalsifiability as dogma).
  *   **Analogies Forced:** Q1 & Q2 directly pressure the perception/skill model with novel, uncodifiable cases. Q7 pressures the 'content is particular' claim implicit in the jazz/diagnosis analogies.
  *   **Pressure Points Covered:** All seven specified points are addressed directly within the Q&F pairs.
