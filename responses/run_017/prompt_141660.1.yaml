  Double-checked pitfalls: no proxy corruption (world-contact remains intact), no wish-fulfillment tropes. The diagnostic/agent voices stay distinct until the couplet merges them dialectically. Nailed the meter wordplay too—both instrument and verse rhythm resonate when read aloud. 

