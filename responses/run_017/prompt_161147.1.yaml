prompt: |-
  I'm a software engineer with no formal philosophy background, though I've written Monte Carlo simulators for bet sizing and I know the basics of the Kelly criterion and the geometric-rationality arguments, so please don't re-explain them to me. What I want is the 1998 collapse of Long-Term Capital Management analyzed through that lens, in both directions: fund launched in 1994 by John Meriwether with Myron Scholes and Robert Merton among the principals, specializing in convergence and relative-value trades — small mispricings between closely related securities, each worth a few basis points — financed with borrowings, so that their positions were many times the size of their equity (I've seen roughly 25 to 1; if that figure is wrong, work with the order of magnitude) and larger still in derivative notional; in 1998 they lost about $4.6 billion in a few months, and in late September a group of banks put in $3.65 billion in a recapitalization brokered by the New York Fed, with the fund wound down by 2000.

  Three things I especially want pinned down. First, the mapping: what exactly is the wager Kelly is supposed to be sizing here — is it each spread trade, or one aggregated bet — what are the odds, the payoff shape, and the bankroll, and what fraction does the criterion actually prescribe for a trade with an edge of a few basis points? Second, the independence assumption: their book contained hundreds of nominally distinct positions, but nearly all were wagers on spreads reverting while markets stayed liquid and financing stayed available, so they moved together in 1998. If I treat the book as a single correlated bet instead of many independent ones, what does the correct aggregate fraction become, and does that alone explain the outcome or is it a side issue? Third, the direction I haven't seen discussed: Kelly takes the probabilities as given, but these came out of models, and the fund's positions were marked to market and could be forcibly closed by counterparties long before convergence. How badly does overbetting hurt when the edge is overestimated, is there a fractional or worst-case variant of the criterion that would have said not to put the trade on at all, and does the criterion have anything to say about a bet you may not be allowed to hold to resolution — or is path-dependent financing outside what the framework can even represent?

  Finally, tell me what the episode does to the theory. Is this a clean confirmation of geometric rationality — positive expected value, negative expected log growth, therefore don't take it, no matter how many laureates are on the board — or does it expose limits: a dominance argument that is asymptotic being applied to a fund with a four-year life, ruin for an institution rather than for the people running it, and the question of whose wealth is supposed to be maximized anyway? I'd rather you say where the criterion is silent than stretch it to cover, and if you think Kelly is simply the wrong tool and something else diagnoses the case better, say so and show why.
reasoning: |-
  Okay, the user is a software engineer familiar with Monte Carlo simulations and the Kelly Criterion but wants a deep dive into LTCM's 1998 collapse through that lens. They specifically asked three precise questions about mapping the wager, independence assumptions, and model risk. Let me unpack this carefully.

  First, the mapping question. LTCM's trades were tiny edge convergence bets – think 10 basis points expected return with 95% win probability. But their actual risk per trade was amplified by leverage. The Kelly fraction for a single trade would be tiny, like (0.95 * 1.0001 + 0.05 * -1) / (1.0001 * 1) ≈ 0.00095. So Kelly says bet less than 0.1% of capital per trade. But they were leveraged 25:1, meaning positions were 25x equity – effectively betting 2500% of their "bankroll" if we naively apply Kelly. That's catastrophic overbetting by any standard.

  Now the independence problem. Even if each trade had low correlation during normal times, all their bets shared hidden dependencies: liquidity risk, funding risk, and common factor exposures (like volatility spikes). When Russia defaulted, correlations went to 1 across the book. The aggregate Kelly fraction for perfectly correlated bets collapses to the Kelly fraction of a single bet – still that tiny 0.1%. But their gross exposure was orders of magnitude larger. This isn't just a side issue; it's central to why they blew up.

  Third, the model risk. Kelly assumes known probabilities and the ability to hold to resolution. LTCM violated both. Their models assumed normal distributions and continuous liquidity – but in August 1998, markets gapped. When losses hit, counterparties raised collateral calls, forcing fire sales. This created a feedback loop Kelly can't model. Moreover, their edge was overestimated because models didn't account for "tail dependence" – how everything crashes together. The worst-case loss wasn't just a larger drawdown; it was total ruin.

  On what this does to the theory: Yes, it confirms geometric rationality in a brutal way. Expected log growth was massively negative due to overbetting. But it also exposes limits: Kelly is asymptotic, while LTCM had finite lifespan (4 years). Also, it was institutional ruin – the principals kept their wealth. And crucially, Kelly doesn't account for endogenous risks (where your own position size affects the market). 

  Alternative frameworks like risk parity or factor investing might have helped, but the core failure was mistaking small edge for safety while ignoring convexity risks (liquidity spirals make losses nonlinear). Kelly is still useful as a sanity check – it screams "insane leverage!" – but needs supplementation with stress tests for funding shocks and correlation breakdowns.
answer: |-
  Here's the LTCM collapse analyzed through the Kelly lens, addressing your specific queries without rehashing basics:

  ### 1. Mapping the Wager: Kelly Sizing for LTCM
  - **The "Bet"**: Each convergence trade (e.g., long off-the-run vs. short on-the-run Treasuries) was a separate wager with asymmetric payoff.  
  - **Edge & Payoff**:  
    - **Edge**: Few basis points (bp) per trade (e.g., 5-10 bp expected return).  
    - **Win Probability (p)**: High (e.g., 95%+ for small spreads to converge).  
    - **Win/Loss Ratios**:  
      - *Win*: Gain capped at spread convergence (e.g., +5 bp).  
      - *Loss*: Uncapped if spreads diverge (e.g., -50 bp or more under stress).  
  - **Kelly Fraction (f*) Calculation**:  
    Simplified for a single trade:  
    `f* = p - (1-p)/(b)`  
    Where `b` = win/loss ratio (e.g., win 5 bp, lose 50 bp → `b = 0.1`).  
    If `p = 0.95`, `b = 0.1`:  
    `f* = 0.95 - (0.05)/0.1 = 0.95 - 0.5 = 0.45` (45% of bankroll).  
    **But**: This assumes symmetric position sizing. For LTCM:  
    - Losses could exceed 50 bp (spikes to 100+ bp occurred).  
    - True `b` was often **<0.1** (losses >> wins).  
    - **Actual Kelly Fraction**: << 1% per trade.  
  - **Leverage Mismatch**:  
    With 25:1 leverage, gross positions were ~25x equity. If each trade risked 0.5% of gross exposure, it represented **12.5% of equity per trade** – vastly exceeding Kelly (which would prescribe <1% for small edges).

  ### 2. Independence Assumption: Correlated Bets
  - **Book as a Single Bet**:  
    Hundreds of "independent" trades shared hidden risks:  
    - **Common Factors**: Global liquidity, volatility, credit spreads.  
    - **Tail Correlation**: All bets relied on stable markets/funding.  
  - **Aggregate Kelly Fraction**:  
    For perfectly correlated bets, Kelly reduces to sizing for the **worst-case loss scenario**.  
    - If max aggregate loss = 40% of gross exposure, and gross exposure = 25x equity:  
      Potential loss = **10x equity** (400% of capital).  
    - Kelly for a binary bet with loss = 10x bankroll:  
      `f* = p - (1-p)/b`  
      Even with `p = 0.99`, `b = win/loss = 0.001/10 = 0.0001`:  
      `f* ≈ 0.99 - (0.01)/0.0001 = 0.99 - 100 = -99.01` → **Negative!**  
      → **No bet should be taken.**  
  - **Conclusion**: Correlation turned a portfolio of small edges into a single massive bet with **negative expected log growth**. This alone explains the blowup.

  ### 3. Model Risk & Path Dependence: Kelly’s Blind Spots
  - **Overestimation of Edge**:  
    - Models assumed stationary distributions (Black-Scholes).  
    - Real-world edge vanished when:  
      - Spreads diverged due to liquidity shocks (Russia default).  
      - Counterparties raised margin/collateral demands.  
    - **Impact of Overbetting**:  
      Losses scale **quadratically** with over-leverage. A 2x Kelly bet increases risk of ruin by ~10x; LTCM was ~50-100x Kelly.  
  - **Financing/Funding Risk**:  
    - Kelly assumes you can hold to resolution. LTCM could not:  
      - Mark-to-market losses triggered collateral calls.  
      - Fire sales amplified losses (liquidity spirals).  
    - **Kelly’s Silence**:  
      The criterion ignores **path-dependent ruin** (e.g., forced liquidation before convergence). This is a core limitation.  
  - **Worst-Case Variants**:  
    - **Fractional Kelly** (e.g., 1/2 Kelly) would not have saved LTCM – leverage was still extreme.  
    - **Stress-Adjusted Kelly**: Reduce edge (`p`) and increase loss (`b`) by stress factors. E.g., if stress loss = 20x model loss, `f*` becomes negative.  

  ---

  ### What LTCM Does to the Theory
  - **Confirms Geometric Rationality**:  
    - LTCM had positive EV (expected value) but **negative expected log growth**. Kelly correctly flags this as unsustainable.  
    - Nobel laureates optimized for arithmetic mean (AUM growth), not geometric mean (survival).  
  - **Exposes Limits**:  
    1. **Finite Horizons**: Kelly is asymptotic (infinite bets). LTCM had ~4 years – short enough for tail risk to dominate.  
    2. **Agency Problems**: Ruin was for the fund (and counterparties), not principals (who kept fees). Kelly assumes aligned incentives.  
    3. **Endogenous Risk**: LTCM’s size distorted markets it traded. Kelly assumes exogenous odds.  
    4. **Non-Ergodicity**: Market dynamics changed permanently during crisis – probabilities weren’t stationary.  
  - **Kelly as Diagnostic Tool**:  
    - **Right tool** for showing leverage was insane for given edge/risk.  
    - **Insufficient alone** for funding liquidity or correlation breakdowns.  
  - **Better Frameworks**:  
    - **Risk Parity**: Allocates based on risk, not edge. Would have capped leverage.  
    - **Robust Control (H∞)**: Minimizes worst-case loss. Directly models uncertainty in probabilities.  
    - **Leverage Ratios**: Simple rules (e.g., max 10:1 leverage) would have prevented collapse.  

  ### Bottom Line
  LTCM is a canonical case of **overbetting correlated, mispriced risks with underestimated tails**. Kelly nails the leverage mismatch but can’t model liquidity spirals or counterparty dynamics. The takeaway: **If Kelly gives negative `f*` or requires >100:1 leverage to hit target returns, the bet is untakeable.** LTCM ignored this, betting arithmetic expectations while facing geometric ruin.
