  - FP: negatives with score5: 0.
  - TN: negatives with score<5: 50.
  - FN: positives with score<5: 50-10=40.

  FPR_B=0.
  FNR_B=40/(10+40)=40/50=0.8.

  FPR equal (both 0) but FNR not equal (0.6 vs 0.8).

  We also consider cutoff=1 (hire everyone): 
  FPR=1 in both groups (all negatives are false positives), FNR=0 in both groups. So FPR not equal? Actually, both are 1 and FNR both 0. But condition 5 says we cannot use "flag everybody". Similarly, cutoff=6 (flag nobody): FPR=0 in both, FNR=1 in both. Again, disallowed.

  So at every cutoff, we do not have both FPR and FNR equal.

  Specifically:
  - At cutoff=2: FPR_A=0.36 < 0.52=FPR_B; FNR_A=0.16 > 0.12=FNR_B.
  - At cutoff=3: FPR_A=0.12 < 0.28=FPR_B; FNR_A=0.32 > 0.28=FNR_B.
  - At cutoff=4: FPR_A=0.04 = FPR_B=0.04; but FNR_A=0.44 < 0.64=FNR_B.
  - At cutoff=5: FPR_A=0 = FPR_B=0; but FNR_A=0.6 < 0.8=FNR_B.

  So there is no cutoff where both are equal.

  What is the feature doing the work? The separation within the groups. In Group A, the scores separate the positive and negative cases better than in Group B. Specifically, in Group A, we have more people at the extremes: many at score1 (which are mostly negative) and a good number at score5 (all positive). In Group B, the positive and negative cases are more mixed: for example, at score3 (the middle) we have 18 positive and 12 negative.

  We can measure the separation by the variance of the score or by the AUC for each group. But we don't need to here.

  Now, if we make the distributions identical, then the FPR and FNR would be the same at every cutoff. So the conflict vanishes.

  Which requirement must be given up? We can have either:
  - Equal FPR (achieved at cutoff=4 and cutoff=5, but at cutoff=5 we disallow because it flags very few) but then FNR is not equal. At cutoff=4, FPR is equal but FNR is not.
  - Or equal FNR: we can try to find a cutoff where FNR_A=FNR_B. But in our case, at cutoff=3, FNR_A=0.32 and FNR_B=0.28 -> close but not equal. At cutoff=2: FNR_A=0.16, FNR_B=0.12 -> not equal. We don't have a cutoff where FNR is equal and then FPR might not be. But even if we found one, we require both.

  In fact, we don't have any cutoff where both are equal.

  What is lost? If we want equal FPR, we choose cutoff=4: then Group A has FNR=0.44 and Group B has FNR=0.64, so more false negatives in Group B. If we want equal FNR, we might have to choose different cutoffs per group. But condition 2 requires the same cutoff.

  Alternatively, we might choose a cutoff that minimizes the difference, but we want exact equality.

  Now, the two perspectives:

  1. A proponent of calibration (requirement i) might say: the score is fair because it means the same thing in both groups. The fact that the error rates are different is due to the different distributions of the scores. They might argue that the error rates are not the right measure, and that the calibrated score is the fair way.

  2. A proponent of equal error rates might say: the decision rule is causing different harms to the two groups. In this case, at a common cutoff, one group might have a higher FPR or FNR. They would argue that even though the score is calibrated, the decisions are not fair in terms of errors.

  Is this a disguised base-rate story? No, because the base rates are equal. The conflict comes solely from the different within-group distributions (i.e., the different conditional distributions of the score given the true outcome).

  Specifically, the score is more informative in Group A than in Group B. In Group A, the score distribution for positives and negatives are more separated, so we can achieve lower error rates in Group A than in Group B. But with a common cutoff, we are forced to set a threshold that might be more appropriate for one group than the other.

  Therefore, the tradeoff is about the informativeness (or separation) of the score within each group, not about the base rates.

  This case shows a distinct impossibility: even with equal base rates and calibration, we cannot have equal error rates with a common cutoff when the within-group separations differ.
