answer: |-
  ### Joint Statement: Adversarial Collaboration on What Makes Every 'a' an 'a'

  This document summarizes the outcomes of an adversarial collaboration between two camps addressing the question: "What makes every 'a' an 'a'?" The Schema camp holds that 'a'-hood is defined by an abstract letterform schema—a set of parts, topological arrangement, and metric variations. The System camp holds that 'a'-hood is defined by a functional role in a system of contrasts, maintained by production and uptake. Below, we present agreed claims, disagreements, cruxes, and conditions for resolution. Crucially, no real-world typographic history or typefaces are invoked; all reasoning stems from the cases and arguments.

  ---

  #### 1. Agreed Claims  
  Both camps endorse the following 12 non-vacuous claims. Claims 6 and 11 would have been surprising or deniable to one camp initially, as they challenge core intuitions (Schema would have denied 6; System would have denied 11). Claims 4 and 9 address allography, production-uptake divergence, and stored templates.

  1. **Conventional foundation**: Letter identity is fundamentally conventional, not innate or natural. What counts as an 'a' depends on learned cultural practices.  
  2. **Variation acceptability**: A wide range of forms (e.g., two-storey 'a', single-storey 'ɑ', handwritten scrawls) can be valid instances of 'a' within a writing system.  
  3. **Contextual dependency**: Letter identification depends on context (e.g., surrounding letters, writing system). Isolated marks are more ambiguous.  
  4. **Allography as unity**: In a font that ships both 'a' and 'ɑ' as stylistic alternates for the same text, they are variants of one letter, not two distinct letters.  
  5. **Production-uptake divergence**: Production (intent to write 'a') and uptake (interpretation as 'a') can conflict. A mark intended as 'a' may be misread, or vice versa.  
  6. **System overrides form in fluency**: In a permuted typeface (e.g., 'a'-shape used for 'e'), fluent readers treat the shape as its system-assigned letter (e.g., as 'e'), not its original identity.  
  7. **Templates as cognitive tools**: Literate individuals use stored mental templates (schemas) for recognition and production, but these templates are learned and culturally specific.  
  8. **Contrasts are essential**: The function of 'a' relies on its contrasts with other letters (e.g., 'a' vs. 'b'). No letter exists in isolation.  
  9. **No universal schema**: There is no innate, ahistorical schema for 'a'; schemas are shaped by cultural exposure.  
  10. **Family resemblance**: Most 'a's share statistical regularities (e.g., enclosed counter, ascender absence), but these are neither necessary nor sufficient for 'a'-hood.  
  11. **Orphans lack identity**: An isolated glyph (e.g., from an 'a' routine) with inconsistent uptake (e.g., 40% 'a', 60% 'o') has no determinate letter identity.  
  12. **Community consensus**: A mark functions as 'a' if consistently produced and recognized as such by a community, regardless of intent or form.

  ---

  #### 2. Disagreements Table  
  Key issues are presented with each camp's self-worded claim. "Genuine" indicates irreconcilable disagreement; "verbal" flags terminological ambiguity; "stipulation-dependent" notes where a camp's stance relies on an unjustified assumption.

  | Issue | Schema Camp's Wording | System Camp's Wording | Genuine, Verbal, or Stipulation-Dependent |
  |-------|------------------------|------------------------|--------------------------------------------|
  | **Primary determinant of 'a'-hood** | A mark is an 'a' if and only if it satisfies the abstract schema for 'a' (parts, topology, metrics). | A mark is an 'a' if and only if it occupies the 'a' position in a system of contrasts, as upheld by production and uptake. | **Genuine disagreement**: Schema claims form is constitutive; System claims role is constitutive. |
  | **Form without system role** | A mark satisfying the 'a' schema is an 'a' even if unused, misread, or isolated (e.g., it is "a-shaped"). | A mark not embedded in a system (e.g., isolated or misread) is not an 'a'; form alone is incidental. | **Genuine disagreement**: Schema sees form as sufficient for identity; System denies this. |
  | **Role without form** | A mark violating the 'a' schema cannot be an 'a', even if used as one (e.g., it is a proxy, not a true 'a'). | A mark used and read as 'a' in a system is an 'a', even with no resemblance to typical forms (e.g., via radical innovation). | **Genuine disagreement**: Schema denies role can define; System affirms it. |
  | **Status of misread schema matches** | A mark satisfying the 'a' schema is an 'a'; consistent misreading (e.g., as 'o') reflects uptake error, not identity change. | If a mark is consistently misread in a system (e.g., as 'o'), it is not an 'a' in that system, regardless of form. | **Genuine disagreement**: Schema prioritizes production/form; System prioritizes uptake. |
  | **Definition of "letter"** | A letter is an abstract form type defined by a schema; tokens are instances matching it. | A letter is a functional role in a system of contrasts; tokens are marks fulfilling that role. | **Verbal disagreement**: Candidate meanings: (1) Form-based type vs. (2) System-based role. <br>• For (1) to hold, identity must be intrinsic to form (e.g., permuted shapes remain their "true" letters). <br>• For (2) to hold, identity must be extrinsic/relational (e.g., permuted shapes become their assigned letters). <br>• Choice changes outcomes: In invented scripts, (1) denies 'a' exists without Latin forms; (2) affirms it based on role. |
  | **Basis for allographic unity** | 'a' and 'ɑ' are one letter because both satisfy the same schema (variation is stylistic). | 'a' and 'ɑ' are one letter because both occupy the same contrast position and are used interchangeably. | **Stipulation-dependent**: Schema stipulates form as unifying; System stipulates role. Neither camp can impose their stipulation as the other rejects its primacy. |

  ---

  #### 3. Cruxes  
  Four concrete cases are analyzed. For each, both camps provide falsifiable predictions. A fifth case (Case E) is added to better separate the camps. Predictions are written as testable claims.

  **Case A: Permuted typeface book**  
  - *Scenario*: A 200-page book uses a typeface where shapes are permuted (e.g., 'a'-shape appears when 'e' is typed). After one hour, readers achieve fluency.  
  - **Schema prediction**: Readers associate the 'a'-shape with the 'e' sound, but the shape remains an 'a' (it matches the 'a' schema and cannot become an 'e').  
  - **System prediction**: The 'a'-shape becomes an 'e' in this system (fluency confirms it occupies the 'e' role).  

  **Case B: Orphan glyph**  
  - *Scenario*: A glyph from an 'a'-generating routine is shown in isolation. 40/100 readers identify it as 'a'; 60/100 as 'o'.  
  - **Schema prediction**: The glyph is an 'a' (it satisfies the 'a' schema from production); inconsistent readings are errors.  
  - **System prediction**: The glyph has no stable identity (uptake is split); it is neither 'a' nor 'o' determinately.  

  **Case C: Invented script**  
  - *Scenario*: A script has 26 elements with contrast structures identical to Latin (e.g., one element mirrors 'a's contrasts). It shares no shapes or history with Latin.  
  - **Schema prediction**: No 'a' exists here (shapes don’t match the 'a' schema); it has a distinct letter with analogous contrasts.  
  - **System prediction**: The element occupying 'a's contrast position is an 'a' (role defines identity, not form).  

  **Case D: Child's mark**  
  - *Scenario 1*: A child intends an 'a', but all readers interpret the mark as 'u'.  
    - **Schema prediction**: If the mark matches the 'u' schema, it is a 'u' (form overrides intent).  
    - **System prediction**: It is a 'u' (uptake overrides intent and form).  
  - *Scenario 2*: A child intends a non-'a', but all readers interpret the mark as 'a'.  
    - **Schema prediction**: If the mark matches the 'a' schema, it is an 'a' (form overrides intent).  
    - **System prediction**: It is an 'a' (uptake overrides intent).  

  **Case E: Gradual morphing**  
  - *Scenario*: In a typeface, the 'a' shape is incrementally morphed to resemble an 'o' over 100 steps. At each step, readers identify it as 'a'. The final shape is identical to an 'o' in a reference font.  
  - **Schema prediction**: At Step 100, the shape is no longer an 'a' (it violates the 'a' schema); readers are mistaken.  
  - **System prediction**: At Step 100, the shape is still an 'a' (consistent uptake maintains its role).  

  ---

  #### 4. What Would Move Us  
  Each camp specifies one finding that would falsify its core claim, plus shared conditions for resolution.

  - **Schema camp concession**: We would abandon our claim if a mark *violating* the 'a' schema is consistently read as 'a' in a stable system (e.g., Case C or E), with no resemblance to existing variants. This would prove form is unnecessary.  
  - **System camp concession**: We would abandon our claim if a mark *satisfying* the 'a' schema is unanimously identified as 'a' in isolation (e.g., Case B at 100% 'a' uptake) but *never* functions as 'a' in any system. This would prove form can define identity independently.  
  - **Shared resolution criteria**: Both camps agree that a case must dissociate form from role (e.g., permuted typeface with neural evidence of shape-role remapping) and show which factor causally drives identity. Merely redescribing outcomes (e.g., "it's conventional") is insufficient; empirical evidence of cognitive processing (e.g., pattern recognition vs. contextual priming) is needed.  

