     - System camp: If readers consistently read it as 'a', it is an 'a'.

     But we have four cases already, and we can add one more if needed.

  Part 4: What would move us

  - Schema camp: Would give up if shown a case where a mark that does not satisfy the 'a' schema is consistently and correctly read as 'a' by fluent readers in a stable system, and there is no similar schema that it satisfies (e.g., it's a completely new shape).
  - System camp: Would give up if shown a case where a mark satisfies the 'a' schema but is never read as 'a' and is not used as 'a' in any system, yet is still considered an 'a' (e.g., in isolation, with no system, it is identified as 'a' by all).

  Both agree that a finding that settles the matter would be a case that clearly dissociates form from function and shows which one is primary for identity.

