     Case: A mark that satisfies the 'a' schema (as per expert analysis) is presented in isolation to readers, but due to some confusion (e.g., it's shown in a context where 'u' is expected), all readers misread it as 'u'.

     Then:
     - Schema camp: It is an 'a' (because it matches the schema), and the readers are wrong.
     - System camp: If it is consistently read as 'u' in a system, then it is a 'u', regardless of what schema it matches.

     But in isolation, without a system? System camp might say it's not in a system, so no letter identity.

     Better to have it in a system: e.g., in a document, the writer writes this mark intending 'a', but every reader takes it as 'u'.

     Then:
     - Schema camp: It is an instance of 'a', but there is a widespread error in uptake.
     - System camp: In this instance, it functioned as 'u', so it was 'u' for that communicative event.

  5. Additional case: A typeface where the 'a' shape is gradually morphed into an 'o' shape over time, so that at each step, readers still read it as 'a', but the final shape is identical to the 'o' in another font. At the final step, is it still an 'a'?

