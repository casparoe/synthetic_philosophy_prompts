       - Better: the mark is such that it matches the 'u' schema and is read as 'u', but child intended 'a'. So Schema: it satisfies 'u' schema, so it's a 'u'. System: it is read as 'u', so in that context, it's a 'u'.

     Mirror case: Child intends something else, but mark looks like 'a' to all, read as 'a'.
       - Schema: if it satisfies 'a' schema, it's an 'a', regardless of intention.
       - System: if it is read as 'a', it functions as 'a', so it is an 'a'.

     But to make it a crux, we need a clear prediction.

     Let's define the cases:
     - Case A: Mark intended as 'a' by producer, but all readers read as 'u'. Assume the mark is typical 'u' shape.
       - Schema: not an 'a' (since it doesn't match schema), it's a 'u'.
       - System: not an 'a' because uptake is as 'u'; it's a 'u'.

     But both might agree it's not an 'a'? Then not a crux.

     How about if the mark is intermediate? E.g., a shape that could be either, but in this case, all read as 'u'. Schema might say if it's closer to 'u' schema, it's 'u'. System says since read as 'u', it's 'u'.

     Perhaps the disagreement is clearer in the orphan case.

     Alternatively, for the child case, if we have: a mark that satisfies the 'a' schema but is misread as 'u' by all. But if it satisfies the schema, why misread? That might be rare, but possible in poor lighting, etc.

