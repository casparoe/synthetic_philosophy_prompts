  We are drafting a joint statement from an adversarial collaboration on the question: "What makes every 'a' an 'a'?" The two camps are the Schema camp (emphasizing form) and the System camp (emphasizing role in a system of contrasts). The deliverable has four parts.

  Part 1: Agreed Claims (8-12 numbered statements, non-vacuous, with at least two surprising or previously deniable by one side)

  We need to cover:
  - Allography: in a font that ships both 'a' and 'ɑ' as alternates, are they one letter or two?
  - Whether 'a'-ness could be a matter of a stored template.
  - Whether production history and reader uptake can ever come apart.

  Part 2: Disagreements Table
  Columns: 
  - Issue
  - Schema camp's wording
  - System camp's wording
  - Genuine disagreement, verbal, or dependent on a stipulation

  For "verbal": name the two candidate meanings, what the world would have to be like for each to be right, and what changes depending on the choice.
  For "stipulation-dependent": say whose stipulation and why nobody is in a position to make it.

  Part 3: Cruxes (4 or 5 sub-questions with concrete cases, each side's prediction)
  Cases provided:
  1. Permuted typeface book: shapes cycled, e.g., 'a' shape becomes 'e', readers fluent after an hour.
  2. Orphan glyph: from 'a' routine, shown alone, 40% read as 'a', 60% as 'o'.
  3. Invented script: 26 elements, contrast structure like Latin, no shared shapes or history.
  4. Child's mark: intended as 'a' but read as 'u' by all; and intended as something else but read as 'a' by all.
  5. (Optional) One more case that better separates the camps.

  Part 4: What would move us: Each side names one finding that would make it give up its central claim, and what both agree would settle the matter.

  Constraints: 
  - No real type history or typefaces as evidence; rely on cases and arguments.
  - No citations or name-dropping.
  - Don't let either side win by stipulating a definition.
  - Cruxes must be tied to cases that could be run.
  - Markdown for table, numbered lists elsewhere.
  - 1000-1400 words, no padding.

  Let's start with Part 1: Agreed Claims.

  We need 8-12 statements both can sign. They should be non-vacuous and include at least two that one side would have denied or that are surprising.

  Possible agreed claims:

  1. Both camps agree that the letter 'a' is a cultural artifact, not a natural kind.
  2. Both agree that there is a conventional aspect to letter identity.
  3. Both agree that in ordinary contexts, form and function are tightly correlated.
  4. Both agree that there is variation in the form of 'a' (e.g., two-storey, single-storey) that still counts as 'a'.
  5. Both agree that context matters for letter identification (e.g., in a word, isolated).
  6. On allography: in a font that ships both 'a' and 'ɑ' as alternates, both camps might agree that they are stylistic variants of the same letter, not two different letters. But System camp might emphasize that they are used in the same position and contrast identically, while Schema camp might say they both satisfy the 'a' schema. So agreed: they are the same letter.
  7. Production history and reader uptake can come apart: e.g., if someone draws a shape intending it to be 'a' but it is misread as 'o', then according to System camp, it's not an 'a' because uptake failed. Schema camp might say it is an 'a' because it was produced with the schema. But they might agree that in such cases, there is a conflict. So agreed: production and uptake can diverge, leading to ambiguity or error.
  8. Both agree that a stored template (schema) exists in the minds of literate individuals, but disagree on whether it defines the letter or is just a heuristic.
  9. Both agree that the system of contrasts is crucial for reading, but Schema camp thinks the schema enables that contrast.
  10. Both agree that if a mark is consistently read as 'a' in context, it functions as an 'a' for that system.
  11. Both agree that a mark that looks like 'a' but is used in a position where 'e' should be (as in the permuted typeface) will be read as 'e' after adaptation, but Schema camp might still say it's 'a'-shaped.
      Actually, for the permuted case, both can agree that after fluency, the shape functions as 'e' in that system, but Schema camp might insist it is still an 'a' in form. But to have agreement: in the context of the permuted system, the shape that was originally 'a' now serves as 'e', and vice versa.

      Let's focus on what they can both say.

  12. Both agree that a letter cannot be defined solely by its shape in isolation; context (system) always plays a role, but Schema camp might say the schema includes contextual expectations.

  Surprising claims (for one side to have denied):

  - For Schema camp: they might have denied that a letter can change identity purely by system context (like in permuted typeface). But in the agreed claims, we can say that in a different system, the same shape can serve a different function.

  - For System camp: they might have denied that there is any common form across all 'a's, but they might agree that there are family resemblances or statistical regularities.

  Let's draft 8-12 agreed claims:

  1. The identity of a letter is not determined by any single physical feature but involves both formal properties and functional roles.
  2. In a given writing system, the letter 'a' occupies a specific position in the system of contrasts that define the alphabet.
  3. There exists a range of acceptable variation in the form of 'a' (including two-storey and single-storey variants) that literate individuals recognize as instances of the same letter.
  4. When a font provides multiple glyphs (such as 'a' and 'ɑ') as stylistic alternates for the same text, they are considered variants of the same letter, not distinct letters.
  5. Production history (the intention to write an 'a') and reader uptake (the interpretation of a mark as 'a') can, and sometimes do, come apart, leading to miscommunication.
  6. A stored mental representation (template or schema) for 'a' exists and is used in both production and recognition by literate individuals.
  7. The system of contrasts (the full set of letters and their relationships) is essential for the function of any letter, including 'a', in reading and writing.
  8. Contextual factors, such as the surrounding letters or the writing system in use, can influence whether a mark is interpreted as an 'a' or not.
  9. In the absence of any system (e.g., an isolated mark), letter identification is more ambiguous and relies more heavily on form-based heuristics.
  10. A mark that is consistently produced and recognized as 'a' in a community functions as an 'a' for that community.
  11. The same physical shape can serve as different letters in different systems (e.g., in the permuted typeface after adaptation).
  12. There is no universal, ahistorical 'a' schema; the schema is learned and culturally specific.

  Now, which of these might have been denied? For example, Schema camp might have denied #11 if they think the schema is fixed, but in the permuted case, they might concede that the shape is repurposed. System camp might have denied #6 if they think the template is not defining, but they can agree it exists as a cognitive aid.

  #11: Schema camp might say that the shape still is an 'a' but is being used to represent 'e', so it's not that it serves as a different letter, but that it is mapped to one. But we can word it as "can serve as" meaning functionally.

  Agreed claims should be acceptable to both.

  Part 2: Disagreements Table

  Issues:

  1. What primarily defines letter identity: form or system role?
  2. Can a mark be an 'a' solely by satisfying a form schema, even if not recognized or used as such?
  3. Can a mark be an 'a' solely by system role, even if it bears no resemblance to any known 'a'?
  4. In the case of allography, are 'a' and 'ɑ' the same letter because of form or because of system role?
     But in agreed claims we said they are the same, so the disagreement is on why.
  5. What happens in the orphan glyph case: is it an 'a' because of production, or not because of uptake?
  6. The child's mark cases.

  Let's define the table rows.

  Row 1: The defining feature of letter identity.

  - Schema camp: A mark is an 'a' if and only if it satisfies the abstract letterform schema for 'a', which specifies a set of parts, their topological arrangement, and permissible metric variations.
  - System camp: A mark is an 'a' if and only if it occupies the 'a' position in the system of contrasts of the relevant writing system, as determined by its production and uptake in that system.
  - Genuine disagreement: Yes, because Schema camp says form is constitutive, System camp says form is only evidence for role.

  Row 2: The possibility of form-based identity without system role.

  - Schema camp: A mark that satisfies the 'a' schema is an 'a' in virtue of its form, even if it is not part of any writing system or is misread; it may be called an 'a'-shaped mark, but it is still an instance of the letter form.
  - System camp: A mark that is not embedded in a system of contrasts and not produced or read as part of such a system is not an 'a' at all, regardless of its form; it is merely a shape that resembles an 'a'.
  - Genuine disagreement.

  Row 3: The possibility of system role without form.

  - Schema camp: A mark that does not satisfy the 'a' schema cannot be an 'a', even if it is used in the 'a' position in a system; it is a different letter or symbol that happens to be used as a stand-in for 'a'.
  - System camp: If a mark is consistently produced and read as occupying the 'a' position in a writing system, then it is an 'a' for that system, regardless of its form, as long as it maintains the necessary contrasts.
  - Genuine disagreement.

  Row 4: The status of the orphan glyph (from the crux).

  - But this is a specific case, better in cruxes. For the table, we can have a row about the role of uptake.

  Row 5: Verbal disagreement on "letter".

  - Candidate meanings:
    Meaning 1 (Schema): A letter is an abstract form type, instantiated by physical marks that match its schema.
    Meaning 2 (System): A letter is a functional role in a communicative system.

  - For Meaning 1 to be right: The world would have to be such that letter identity is primarily determined by intrinsic properties of the mark, independent of use.
  - For Meaning 2 to be right: The world would have to be such that letter identity is primarily determined by how the mark is used and interpreted in context.
  - What changes: In cases like the permuted typeface, under Meaning 1, the shapes retain their original identity; under Meaning 2, they become the new letters. Similarly, for an invented script with no shared shapes, under Meaning 1, it has no 'a'; under Meaning 2, it has a letter that serves the same contrast role as 'a'.

  But we need to say if it's verbal or genuine. It's verbal in the sense that they are using "letter" differently, but also genuine because they disagree on what grounds the identity.

  We can have:

  | Issue | Schema camp's wording | System camp's wording | Genuine disagreement, verbal, or dependent on a stipulation |
  |-------|------------------------|------------------------|------------------------------------------------------------|
  | Primary constitutive factor of letter identity | A letter is defined by an abstract schema of form, which specifies necessary and sufficient conditions for being that letter. | A letter is defined by its functional role in a system of contrasts, maintained by the practices of a community. | Genuine disagreement. |
  | The role of form in letter identity | Form is constitutive: satisfying the schema makes a mark an instance of the letter. | Form is evidentiary: it is a reliable indicator of role but does not define it. | Genuine disagreement. |
  | The possibility of a letter without a system | A mark can be an instance of a letter solely by matching its schema, even in isolation or without being part of a writing system. | A mark is only a letter when it functions in a system; without a system, it is merely a shape. | Genuine disagreement. |
  | The status of a mark that matches the schema but is misread | If a mark satisfies the 'a' schema, it is an 'a', even if misread; misreading is an error in uptake. | If a mark is consistently misread as not-'a' in a system, it is not an 'a' in that system, regardless of its form. | Genuine disagreement. |
  | The definition of "letter" | A letter is an abstract type characterized by a specific form schema. | A letter is a functional role in a graphemic system. | Verbal disagreement. The two candidate meanings are: (1) form-based type, (2) system-based role. For (1) to be right, letter identity must be intrinsic to form; for (2), it must be extrinsic and relational. Depending on which we pick, we get different answers in cases like the permuted typeface or invented script. |
  | The allographic variants | The variants 'a' and 'ɑ' are the same letter because they share the same underlying schema, with stylistic variation allowed. | The variants 'a' and 'ɑ' are the same letter because they occupy the same position in the contrast system and are used interchangeably. | Dependent on stipulation: both sides agree they are the same letter, but for different reasons. The disagreement is not substantive here; it's about the explanation. |

  Part 3: Cruxes

  Four or five, with cases and predictions.

  Cases:

  1. Permuted typeface book: shapes cycled, consistent, readers fluent after an hour.
     - Question: After fluency, what letter is a given shape?
     - Schema camp prediction: The shape that was originally 'a' is still an 'a' in form, but it is now used to represent 'e'. So it is an 'a' being used as an 'e'.
     - System camp prediction: In this system, the shape functions as 'e', so it is an 'e' (for this writing system).

  2. Orphan glyph: from 'a' routine, shown alone, 40% read as 'a', 60% as 'o'.
     - Question: Is this glyph an 'a'?
     - Schema camp prediction: Since it was generated by the 'a' routine (satisfies the schema), it is an 'a', and the misreadings are errors.
     - System camp prediction: Without context, the readings are split; it doesn't have a stable identity. In a system where it is consistently used and read as 'a', it would be 'a', but here it's ambiguous. So it's not determinately an 'a'.

  3. Invented script: 26 elements, contrast structure like Latin, no shared shapes or history.
     - Question: Is there an 'a' in this script?
     - Schema camp prediction: No, because there is no shape matching the 'a' schema. There might be a letter that serves a similar function, but it's not the letter 'a'.
     - System camp prediction: Yes, there is a letter in this script that occupies the same contrast position as 'a' in Latin, so it is the 'a' of that script.

  4. Child's mark intended as 'a' but read as 'u' by all.
     - Question: Is the mark an 'a'?
     - Schema camp prediction: If it satisfies the 'a' schema, yes, and everyone is misreading it. If not, no. But if it doesn't satisfy, then no. The case says it's read as 'u', so likely it doesn't satisfy the schema? We need to specify the form. Assume it looks like a 'u' to everyone.
       - Case: Child intends 'a', but the mark looks like a 'u' to all readers, so they read it as 'u'.
       - Schema camp: The mark does not satisfy the 'a' schema (since it's seen as 'u'), so it is not an 'a'. It might be a failed attempt at 'a', but the mark itself is a 'u' if it matches the 'u' schema.
