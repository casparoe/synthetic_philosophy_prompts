  Originality-wise, the serial slot theory feels fresh. Applying the translation test to their examples: "Greatest Generation" works as an honorific borrowing cohort grammar (WW2 service isn't birth-year-bound), while global "Gen Z" exposes contradictions - a Lagos teen and Oslo teen share the label despite vastly different exposures. Adding demographic change cases (e.g., the 1920s baby bust creating a "silent" slot) would heighten the "narrative convenience" point.

