prompt: |-
  Next month I'm giving the opening paper at a one-day closed-door workshop on the moral equality of combatants that a defence academy is co-hosting with an international law institute, and I want to walk in with a proper Q&A prep sheet rather than my usual habit of improvising. The room is not a philosophy audience: about fifteen people — six or seven IHL practitioners and ministry-of-defence legal advisers, two revisionist moral philosophers of the McMahan stripe who think an unjust combatant has no permission to kill at all, one traditionalist who holds the independence of jus in bello from jus ad bellum as close to a fixed point (Walzerian war-convention stuff, plus a bit of natural law), a political scientist who works on compliance and audience costs, and a serving colonel who teaches ethics at the staff college and regards soldiers second-guessing the justice of their war as a discipline problem first and a moral question second. Roughly: the lawyers care about rules that a nineteen-year-old can apply under fire and about not importing ad bellum politics into targeting law; the philosophers care about whether my view is just revisionism with an epistemic fig leaf; the political scientist cares about what my view predicts and how anyone would measure it; the colonel cares about what he's supposed to tell his troops on Monday.

  Here's the thesis, sketched so you can aim at it. I want to defend what I've been calling the "epistemic entitlement" reading of the moral equality of combatants: equality is not a substantive permission that floats free of the justice of the war, and it isn't merely an excuse for soldiers who happen to be ignorant either — it's a defeasible evidentiary presumption, and the thing that warrants it is the state's discharging a jus ad bellum duty of transparency toward its own combatants. Where a state makes the justice of its war reasonably accessible (open parliamentary debate, published legal advice, a free press arguing about it, a professional volunteer force trained in the law of armed conflict), the presumption holds and combatants on both sides are morally on a par. Where a state systematically hides or falsifies that information, the presumption weakens; and where an individual combatant has privileged access to it — the legal adviser who has read the classified advice that the war lacks Security Council authorisation, the senior commander in the room when the assessment was made, maybe the drone crew that sees the full intelligence picture rather than a fragment — it lapses for that person, who then fights at greater moral risk than the conscript in a closed society who couldn't have found out. I want to hold two further things: that the law should stay flat (keep a single IHL rule, don't make targeting law turn on anyone's epistemic position), so my grading is a moral grading only, and that states acquire a real duty of transparency with teeth, breach of which shifts some moral risk back onto their own political leaders. I've been sitting on this paper for to long and I know where it's softest — the whole thing looks like it collapses into revisionism once you grant that the informed combatant lacks permission, and like it gives the lawyers a rule nobody can administer if I let the law move — but I'd rather you tell me which objections actually land in that room than the ones that would land in a philosophy seminar.

  So: draft me the prep sheet. Give me eight or so objections in the order I'll actually get them (by likelihood and by damage together, not one at a time), each phrased the way that person would phrase it and not the way a philosopher would — the legal adviser's objection should sound like a legal adviser, the colonel's like a colonel, the political scientist's should be about operationalisation and observable implications. For each: a reply I can say in about ninety seconds, where that reply is weakest, and whether I should concede it, hold it, or concede a piece and keep the rest. I also want two or three things I should concede in the first two minutes before anyone asks, the one reply that has to land or the whole paper dies, and the question I'm quietly hoping nobody asks, with a fallback for if they do. Return it as a JSON object, no preamble, with this schema: top-level keys "opening_concessions" (array of strings, each a concession I should make up front, in the terms of the room), "objections" (array of objects with fields "rank" (integer, 1 = most likely and most damaging), "raiser" (which person or group in the room, by role), "objection_as_they_would_put_it" (string, in their voice, ideally with their vocabulary), "damage_1_to_5" (integer), "reply_90_seconds" (string), "soft_spot" (string, where that reply breaks or is question-begging), "concede_or_hold" (one of "concede", "hold", "concede_partly"), and "the_real_problem_underneath" (string, the deeper commitment of mine the objection is really aimed at)), "must_land" (object with "objection", "reply", and "why_the_paper_dies_without_it"), "question_i_hope_nobody_asks" (object with "question", "who_would_ask_it", "why_it_scares_me", "fallback_if_asked").
reasoning: |-
  We are preparing a Q&A prep sheet for a workshop on the moral equality of combatants. The audience is mixed: IHL practitioners, legal advisers, moral philosophers (both revisionist and traditionalist), a political scientist, and a colonel. The thesis is an "epistemic entitlement" reading where the moral equality is a defeasible evidentiary presumption warranted by the state's duty of transparency. The law should stay flat (IHL unchanged) and states have a duty of transparency.

  We need:
  - 2-3 opening concessions (array of strings)
  - 8 objections in order of likelihood and damage (each with: rank, raiser, objection_as_they_would_put_it, damage_1_to_5, reply_90_seconds, soft_spot, concede_or_hold, the_real_problem_underneath)
  - must_land: one objection and reply that is critical for the paper
  - question_i_hope_nobody_asks: with question, who, why scary, fallback

  Let's think step by step.

  Opening concessions (to make early to build credibility and show we understand their concerns):
  1. Concede that in the heat of battle, soldiers cannot be expected to conduct ad bellum inquiries. This addresses the lawyers and the colonel.
  2. Concede that the law of armed conflict (IHL) must remain clear and administrable, and that we are not proposing to change it. This reassures the lawyers and the colonel.
  3. Concede that moral philosophy must be sensitive to the realities of military operations and chain of command. This speaks to the colonel and the political scientist.

  Now, the objections. We'll list 8, ranked by both likelihood and damage. We have to imagine the voices:

  1. **The legal adviser (or IHL practitioner)**: Likely to object that introducing any moral distinction based on ad bellum considerations, even if only moral, risks bleeding into legal interpretations and undermines the clarity of IHL. Damage: high (5) because it challenges the core separation we want to maintain.
     - Objection: "Counsel, your moral grading, however well-intentioned, will inevitably be weaponized in litigation and propaganda. Once you admit that one side's combatants are morally worse off, it's a short step to arguing they should have fewer legal protections. How do you prevent that?"
     - Reply: "I agree that the law must remain clear and that IHL's bright-line rules are non-negotiable. My argument is strictly about moral responsibility, not legal protection. The law's function is to regulate conduct in war, and it must be based on objective, observable behavior. We can maintain that while still holding that moral blameworthiness varies. We've done this in other areas: for example, self-defense in domestic law has a clear legal standard, but morally we might blame someone who unreasonably believed they were under threat."
     - Soft spot: The reply might not fully convince because in practice, moral arguments do influence legal developments (e.g., the evolution of IHL). Also, the objection might point out that even if we keep the law separate, the moral argument could lead to non-compliance (e.g., soldiers treating the enemy as less deserving).
     - Concede or hold: Hold, but concede that we must vigilantly guard against any conflation of moral and legal realms.
     - Real problem: The objection is really about the practical and institutional stability of IHL, and the fear that moral arguments will erode it.

  2. **The colonel**: He will worry about discipline and what to tell the troops. Damage: 4 (because if the military rejects it, the theory has no practical traction).
     - Objection: "So what am I supposed to tell my soldiers? That unless they've read the parliamentary debates and the legal memos, they might be murderers? This is going to make every private second-guess their orders and undermine the chain of command. We can't have that."
     - Reply: "You tell them exactly what you do now: follow the rules of engagement and the law of armed conflict. My theory doesn't change the rules they must follow. It does, however, give you a basis to tell them that their government has a duty to be honest with them about why we fight. And if the government fails in that duty, the moral burden falls on the leaders, not the soldier who couldn't have known. This actually protects the soldier and reinforces trust in the institution."
     - Soft spot: The colonel might counter that even raising the possibility of moral risk will create doubt. Also, the idea of the government's duty might be seen as political and beyond the military's remit.
     - Concede or hold: Concede that we must not undermine operational discipline and that the chain of command is sacrosanct. Hold that the duty of transparency is on the state, not the soldier.
     - Real problem: The colonel is committed to the functional requirements of military organization and fears anything that complicates the soldier's role.

  3. **The revisionist moral philosopher (McMahan type)**: They will argue that we are just hiding revisionism behind an epistemic veneer. Damage: 5 (because if this holds, the entire thesis collapses into McMahan's view).
     - Objection: "This is just revisionism with extra steps. You admit that when a combatant is well-informed, they lack permission to fight in an unjust war. But then you say that most combatants are excused by ignorance. But that's exactly what we revisionists say: combatants are not morally equal; they are only excused by non-culpable ignorance. So why the fancy framework?"
     - Reply: "The difference is in the structure of the permission. On your view, the combatant in an unjust war never has a permission to kill; they are merely excused if ignorant. On my view, the state's transparency creates an evidentiary presumption that grants a defeasible permission. This permission is not just an excuse but a substantive right that the state confers by fulfilling its duty. When the state fails, the permission is undermined. Moreover, my view emphasizes the institutional duty of the state, which your view does not."
     - Soft spot: The distinction between a permission and an excuse might seem semantic, and the revisionist might argue that the state cannot grant a moral permission to kill unjustly. Also, the idea of a state-conferred moral permission might be seen as implausible.
     - Concede or hold: Hold, but concede that in the limiting case of a fully informed combatant in an unjust war, the moral situation is indeed similar to the revisionist's view.
     - Real problem: The revisionist is committed to the idea that morality is independent of institutional facts, and that an unjust combatant cannot have a right to kill.

  4. **The traditionalist philosopher (Walzerian)**: They might see this as an attack on the independence of jus in bello. Damage: 4.
     - Objection: "You're eroding the firewall between jus ad bellum and jus in bello. The whole point of the moral equality of combatants is that it doesn't matter why you fight; what matters is how you fight. Your epistemic entitlement makes the in bello status depend on ad bellum factors, which is exactly what we must avoid to protect non-combatants and prevent wars of annihilation."
     - Reply: "I agree that the rules of how we fight must be independent. But that doesn't mean that the moral status of combatants is independent. We can hold that combatants on both sides must follow the same rules of engagement (thus preserving IHL) while also holding that their moral standing varies based on the justice of their cause and their access to information. This is not about making in bello rules depend on ad bellum; it's about the moral evaluation of the combatants' actions, which is a separate matter."
     - Soft spot: The traditionalist might argue that separating moral evaluation from legal rules is unrealistic because soldiers' morale and behavior are affected by their moral beliefs.
     - Concede or hold: Hold the separation, but concede that the firewall for legal rules is essential and must be maintained.
     - Real problem: The traditionalist is committed to the functional role of the war convention in limiting war's horrors.

  5. **The political scientist**: They will focus on how to measure and operationalize. Damage: 3 (because without operationalization, the theory is academic).
     - Objection: "How would we even measure a state's 'transparency'? What are the indicators? Parliamentary debates? A free press? And how do we know what a soldier could reasonably have known? This is too vague to test, and without testing, it's not a useful theory."
     - Reply: "We can draw on existing metrics: think of indices like Freedom House or the Varieties of Democracy project that measure governmental transparency and freedom of information. For the soldier's access, we look at institutional structures: is there military education on the reasons for war? Are there classified briefings? The point isn't to have a perfect measure for every case but to establish a framework that explains why, for example, a soldier in a liberal democracy has a different moral position than one in a closed autocracy. And we can test this by looking at patterns of moral dissent: when transparency is high, we might expect more conscientious objection when wars are unjust, which is observable."
     - Soft spot: The indices are not perfect and might not capture the nuances of individual access. Also, the link to moral dissent is speculative and might be confounded by other factors.
     - Concede or hold: Concede that operationalization is challenging and that the framework needs refinement, but hold that it provides a valuable lens.
     - Real problem: The political scientist values falsifiable theories and measurable concepts.

  6. **The ministry-of-defence legal adviser**: They might worry about the duty of transparency and its implications for state liability. Damage: 4.
     - Objection: "You're saying that if the state fails in its duty of transparency, it shifts moral risk back to political leaders. Does that mean leaders are morally liable for the killings done by their soldiers? And how far does this extend? What if the intelligence was wrong but shared in good faith?"
     - Reply: "The moral risk I speak of is about the blameworthiness of the killings. If the state hides the truth, then the combatant might be excused, but the leaders are more blameworthy. This doesn't create legal liability beyond existing frameworks (like the ICC for aggression), but it does mean that in the moral ledger, the leaders bear more responsibility. And for intelligence: the duty is about transparency, not infallibility. If the state shares its honest assessment, even if wrong, it has fulfilled its duty."
     - Soft spot: The idea of moral risk shifting to leaders is vague and might not have practical consequences. Also, leaders might hide behind good faith.
     - Concede or hold: Hold, but concede that the exact boundaries of the duty need more work.
     - Real problem: The legal adviser is concerned about creating new moral liabilities for the state that could lead to legal consequences.

  7. **The revisionist philosopher again (or another)**: They might push on the informed combatant. Damage: 5.
     - Objection: "You say the presumption lapses for the combatant with privileged access. But then they are in the same position as the revisionist's unjust combatant: they have no permission to kill. But that means your 'equality' is gone. And if the state's transparency creates a permission, how can it create a permission to do something objectively wrong? That's like saying the state can make murder permissible by being transparent about it."
     - Reply: "The state doesn't create the moral permission out of thin air; the transparency creates an evidentiary presumption that the war is just. If that presumption is defeated (by the combatant knowing otherwise), then the permission is lost. But in the standard case, the combatant relies on the state's representation. This is like acting on legal advice: if the advice is wrong, you might be excused, but if you know the advice is wrong, you are culpable. The state's role is to provide a reliable basis for action."
     - Soft spot: The analogy to legal advice might not hold for morality. Also, the revisionist might argue that the combatant should always verify the justice of the war.
     - Concede or hold: Hold, but concede that the state cannot make an unjust war just by transparency.
     - Real problem: The revisionist believes that objective morality trumps institutional roles.

  8. **The colonel again or the political scientist**: They might worry about the impact on military effectiveness. Damage: 3.
     - Objection: "In practice, how does this not lead to soldiers cherry-picking which orders to follow? If they think the government hasn't been transparent enough, do they get to refuse to deploy? This is a recipe for chaos."
     - Reply: "No. The duty of transparency is on the state, and the soldier's obligation to follow lawful orders remains. The moral risk I describe is about ex post evaluation, not about giving soldiers a right to disobey based on their own assessment of transparency. In fact, by emphasizing the state's duty, I'm saying that the state must set up systems so that soldiers don't have to make these judgments. And if the state fails, the moral failure is the state's, not the soldier's. So soldiers should still follow orders, but we might later say the state failed them."
     - Soft spot: The distinction between ex post moral evaluation and ex ante obedience might be lost in the field. Soldiers might use this to justify disobedience.
     - Concede or hold: Concede that disobedience is not authorized and that the chain of command must be respected. Hold that the theory does not undermine it.
     - Real problem: The military must operate as a disciplined hierarchy.

  Now, the must_land reply: This is critical for the paper. The revisionist's objection (rank 3) is the most damaging because if the audience thinks we're just revisionism in disguise, the whole project fails. We must show that the state's role in creating an evidentiary presumption is distinct from mere excuse.

  - Objection: The revisionist's point that this is just revisionism with extra steps.
  - Reply: We must emphasize that the permission is created by the state's fulfillment of its duty, and that this institutional structure is what makes the combatant's position different from a non-state actor or a soldier without such a state. Without this, the paper dies because it loses its distinctive contribution.

  The question I hope nobody asks: This might be about the drone crew example or the senior commander. Why? Because it highlights a case where the moral equality lapses, and that might be uncomfortable for the military attendees.

  - Question: "What about the drone operator who sees the full intelligence picture and knows the war is unjust? You say they lose the presumption. Does that mean they are murderers? And what are they supposed to do? Refuse to fly missions?"
  - Who: The colonel or a legal adviser.
  - Why scary: Because it forces us to say that in such cases, the combatant might indeed be committing murder, which is a strong claim and might lead to calls for disobedience. Also, it's hard to answer what they should do without undermining the chain of command.
  - Fallback: "That is a difficult case. The operator must follow lawful orders, but if they have knowledge that makes the order unlawful (e.g., if it amounts to a war crime), then they have a duty to refuse. However, the knowledge of the war's injustice does not by itself make every act a war crime. It does, however, make each killing morally riskier. The solution is not for the operator to make ad hoc decisions but for the state to ensure that such sensitive positions are held by those who are fully briefed and that the state itself does not engage in unjust wars. This is why the duty of transparency is so important."

