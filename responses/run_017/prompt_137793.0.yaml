     - Acknowledge the doubt as a philosophical position but explain that in the context of the course (and everyday life) we take certain things for granted to get on with the business of inquiry. They can say: "In this course, we are working within a framework where we assume an external world, the reliability of certain sources, etc., to explore philosophical questions. Your doubt is a deep philosophical one, but to engage with the course material, we need to set aside such global doubts for now, just as we set aside the possibility that we are brains in vats when we do science. If you'd like to discuss the philosophical merits of skepticism, we can do that in the context of the course material on Descartes, but note that even Descartes used these doubts as a tool and then set them aside to rebuild knowledge."
