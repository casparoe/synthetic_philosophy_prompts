  The procedure will consist of a series of tests (steps) that the TA can run in order. Each test is a question or observation the TA makes based on what the student says. The goal is to determine whether the doubt is about a hinge proposition (which should not be met with argument) or about an ordinary empirical claim (which can be discussed with evidence). We also need to account for leaky hinges and idling propositions.

  Steps of the Procedure:

  1. **Identify the Doubt**: Have the student state their doubt clearly. The TA should write it down as a proposition (e.g., "The moon landings were staged").
     - Why? We need a clear target to apply the tests.

  2. **Test for Idling**: Ask the student: "What kind of evidence would change your mind about this?" or "What would it take for you to stop doubting this?"
     - If the student cannot name any evidence that would change their mind, then the proposition is idling. It's not functioning as an empirical claim because it's immune to evidence. This is a sign that we are dealing with a hinge-like proposition (or a non-empirical one) and arguing is pointless. The TA should note this and move to step 4 (or step 5 if it's idling).
     - If the student can name specific evidence, note that and move to the next test.

  3. **Test for Leaky Hinge (Context Shift)**: Ask: "In what situations would this claim be something we could check? And in what situations would it be taken for granted without checking?"
     - The TA should reflect on the context of the conversation (epistemology class) versus other contexts (e.g., a history class, a NASA lab). If the proposition is one that in most everyday contexts (including the current one) is taken for granted without evidence (like the existence of the past, the reality of the moon landings in a history class) but in a specialized context (like a forensic analysis of moon landing footage) is checkable, then it's a leaky hinge. In the current context, it's functioning as a hinge and should not be argued. The TA should note the context and move to step 4.
     - If the proposition is one that is regularly checked in the current context (e.g., a claim about a specific historical event in a history class) then it's not a hinge here and the TA can proceed to discuss evidence (step 6).

  4. **Test for Framework Role**: Ask: "Is this doubt part of a larger system of beliefs that you hold, or is it isolated? And if I were to grant this doubt, what else would you have to doubt?"
     - This step is to see if the doubt is self-contained or if it leads to a chain of doubts that would undermine the entire framework of inquiry (e.g., doubting all testimony, all sensory evidence). If the doubt is part of a system that rejects the entire framework (like global skepticism) then it's a framework-level doubt and cannot be resolved within the framework. The TA should note that this is a framework difference and move to step 5.
