          And shorten the decision times.

          Revised timeline for 50 minutes:

          (0-5) Intro and assign roles (7 pairs, one Town Clerk; if 15, one extra as helper or observer).

          (5-10) Explain rules without deposit: only pledge option. Hitchhikers can choose to send a pledge or not.

          (10-15) Hitchhikers decide on pledge and send to Town Clerk. Drivers receive and decide.

          (15-20) Drivers decide and pay cost if giving ride.

          (20-25) Town Clerk processes Stage 1.

          (25-30) Hitchhikers who got a ride decide on payment and write reason.

          (30-35) Town Clerk processes Stage 2 and distributes payoffs.

          (35-50) Debrief: focus on outcomes and reasons. Then explain the hitchhiker problem and the three levels.

      Finally, we must be prepared for the fact that in the activity, the hitchhiker at the second stage is making a decision, so they are weighing reasons. We cannot avoid that. But we can point out that in the ideal solution, they wouldn't be weighing; they would just pay automatically. And we can ask: how could you set up the game so that you don't have a choice at the second stage? But then we are back to commitment devices. The deep point is that to solve the problem, you need to remove the choice at Time 2.

      We can ask: what if, at the moment of arrival, you had no choice? Then the driver would trust. But how can you remove your own choice? That's the puzzle.

      This activity sets up the problem and shows that weak commitments don't work. The debrief then leads to the philosophical issue.

      We'll provide the rules and materials as a handout for the students.

      Let's write the rules clearly.
answer: |-
  ### Activity Design: "The Desert Road Game"

  **Objective:** Simulate Parfit's hitchhiker problem to expose the tension between rational decision-making at different time points, without reputation, enforcement, or interpersonal bonds. Students should confront the need for a disposition that overrides reason-based choices.

  **Core Mechanics:**  
  - **One-time, anonymous pairs** (Driver and Hitchhiker).  
  - **Two stages:**  
    1. **Driver** decides whether to offer a "ride" (costs them raffle tickets).  
    2. **Hitchhiker** (if ride given) decides whether to "pay" (costly, no direct benefit).  
  - **Payoffs in raffle tickets** (1 ticket ≈ $0.10 value; chocolate alternatives).  
  - **Weak commitment devices** (pledge/deposit) to let students discover their futility.  
  - **Anonymity enforced** via ID numbers, sealed envelopes, and blind matching.

  ---

  ### Rules, Materials, and Payoffs  
  **Materials:**  
  - 15 ID cards (numbered 1–15).  
  - 15 decision slips (pre-printed: "I will OFFER the ride"/"I will NOT OFFER" for drivers; "I will PAY"/"I will NOT PAY" for hitchhikers).  
  - 15 reason slips (blank, for writing one-sentence explanations).  
  - 30 envelopes (opaque, labeled with ID numbers).  
  - Raffle tickets (500+).  
  - A "Town Ledger" (clipboard with table to record payoffs by ID, hidden from view).  
  - Timer.  

  **Pairing and Anonymity Protocol:**  
  1. Assign random ID numbers (1–15) to students.  
  2. **Pair matching:** Use a shuffled deck of cards. Distribute red cards (hearts/diamonds) to 7 students → "Hitchhikers." Black cards (clubs/spades) to 7 → "Drivers." The 15th student is the **Town Clerk** (runs the ledger, collects envelopes, enforces rules).  
  3. **Matching:** Town Clerk shuffles red/black cards separately, draws one from each pile to form pairs (e.g., "Hitchhiker 3 + Driver 12"). Records pairs privately.  
  4. **No future interaction:** Students never learn their partner’s identity. Town Clerk collects all materials by ID number, not name.  

  **Payoff Scheme:**  
  - **Hitchhiker payoffs:**  
    - No ride: **0 tickets**.  
    - Ride + no payment: **10 tickets**.  
    - Ride + payment: **5 tickets** (lose 5).  
  - **Driver payoffs:**  
    - No ride: **0 tickets**.  
    - Ride + payment: **4 tickets** (gain 5, minus 1 ride cost).  
    - Ride + no payment: **-1 tickets** (lose 1).  
  - **Weak commitment devices:**  
    - **Pledge:** Hitchhiker may write: "I, [ID], promise to pay upon arrival" and announce it publicly (but anonymously, e.g., "Hitchhiker 5 promises").  
    - **Deposit:** Hitchhiker may pay **1 ticket** upfront; refunded only if they pay later.  

  **Rationale for Payoffs:**  
  - Paying costs hitchhikers 5 tickets (meaningful but trivial: ~$0.50).  
  - No interpersonal transfers → avoids guilt/friendship. Drivers gain tickets from the "bank" (Town Clerk), not the hitchhiker.  
  - Deposit is weak: Losing 1 ticket if breaking a promise is far cheaper than paying 5.  

  ---

  ### Timeline (90 Minutes)  
  **0–10 min: Setup**  
  - Assign IDs, explain roles, and distribute materials.  
  - Emphasize: "Decisions affect your raffle tickets. Goal: Maximize your tickets. No talking during decisions."  
  - **Key omission:** Do not mention "trust," "promises," or "reasons." Frame neutrally: "Stage 1: Drivers choose OFFER or NOT. Stage 2: Hitchhikers who get a ride choose PAY or NOT."  

  **10–20 min: Commitment Phase (Optional for Hitchhikers)**  
  - Hitchhikers decide privately:  
    - Option 1: Write a pledge slip and hand to Town Clerk (who reads it aloud: "Hitchhiker [ID] pledges to pay").  
    - Option 2: Pay 1-ticket deposit to Town Clerk (recorded in ledger).  
  - Drivers observe pledges/deposits but don’t know who made them.  

  **20–35 min: Stage 1 — Driver’s Choice**  
  - Drivers write:  
    - Decision slip: "OFFER" or "NOT OFFER."  
    - Reason slip: "Why I offer/not offer the ride." (e.g., "They pledged, so I trust them").  
  - Drivers choosing OFFER pay 1 ticket to Town Clerk.  
  - Town Clerk collects slips in ID envelopes, records decisions.  

  **35–45 min: Stage 1 Resolution**  
  - Town Clerk announces ride outcomes (by ID, e.g., "Hitchhiker 7 got a ride; Hitchhiker 2 did not"). Distributes 10 tickets to hitchhikers who got rides.  

  **45–60 min: Stage 2 — Hitchhiker’s Choice**  
  - Hitchhikers with rides write:  
    - Decision slip: "PAY" or "NOT PAY."  
    - Reason slip: "Why I pay/not pay." (e.g., "I’d feel bad breaking my pledge").  
  - Those paying surrender 5 tickets to Town Clerk.  
  - Deposit refunds processed if applicable.  

  **60–70 min: Payoff Calculation**  
  - Town Clerk pays drivers (4 tickets if hitchhiker paid; -1 if not).  
  - **Privacy:** Town Clerk shares aggregate results only (e.g., "7 rides offered, 2 hitchhikers paid").  

  ---

  ### Debrief (70–90 min)  
  **Step 1: Reveal Aggregate Outcomes (5 min)**  
  - "How many drivers offered rides? How many hitchhikers paid? How many who pledged paid?"  
  - **Expected result:** Few rides offered (drivers distrust); few payments (hitchhikers maximize tickets).  

  **Step 2: Analyze Raw Data (10 min)**  
  - Share anonymized reason slips:  
    - Driver: "I didn’t offer because they’d have no reason to pay."  
    - Hitchhiker: "I didn’t pay; why waste tickets?"  
    - Hitchhiker: "I paid because I pledged."  
    - Driver: "I offered; they looked trustworthy."  
  - Highlight:  
    - Drivers refused rides due to predicted defection.  
    - Most hitchhikers didn’t pay (self-interest dominated).  

  **Step 3: Map to the Three Layers (10 min)**  
  1. **Fixing payoffs/institutions:** "Did deposits/pledges work? Why not?" (Deposits were too weak; pledges ignored).  
  2. **Sticking to a plan:** "Who paid because they ‘said they would’? But at payment time, did your raffle-ticket reason support paying?" (No → they overrode self-interest).  
  3. **Changing motives:** "Did anyone pay because ‘it’s the right thing’? That feeling—guilt, integrity—is a *disposition*. It isn’t about raffle tickets."  

  **Step 4: Introduce Parfit’s Hitchhiker (5 min)**  
  - "Today’s game mirrors a philosopher’s puzzle: A hitchhiker promises to pay for a ride but won’t want to pay later. If the driver knows this, no ride happens—both lose. The solution requires the hitchhiker to pay *despite having no reason to*. How?"  
  - **Connect to game:** Drivers = predicting defection; hitchhikers = facing a choice where self-interest says "don’t pay."  

  **Step 5: Isolate the "Rational Irrationality" Problem**  
  - "The hitchhiker needs a *disposition* to pay that isn’t responsive to reasons at that moment. But cultivating that disposition must happen *before* the ride—and it means giving up reason-based control later."  
  - **Address common blurring:**  
    - "Pledges didn’t work because they rely on your future self being responsive to reasons—but at payment time, reasons say ‘break it.’"  
    - "Feeling ‘bad’ isn’t a trick—it’s the disposition. But can you rationally decide to *stop being rational* later?"  

  ---

  ### Predictable Problems and Solutions  
  1. **Students pay despite costs:**  
     - **Why:** Stakes are low, "feeling watched."  
     - **Solution:** In debrief, contrast their raffle-ticket loss with their reason slips. Ask: "If tickets were $100, would you still pay?"  

  2. **Drivers universally refuse rides:**  
     - **Why:** Anticipate defection; no trust.  
     - **Solution:** Use this! Debrief: "Why no rides? Because drivers knew hitchhikers would defect. Now imagine you *could* commit—how?"  

  3. **"Promises create reasons" student:**  
     - **Response:** "In this game, promises don’t add tickets—they’re just words. Your payment cost you tickets. So why did you treat the promise as a reason? That’s the puzzle: ordinary promise-keeping assumes external morality, but self-interest alone doesn’t support it."  

  4. **"I’d pay to avoid guilt" student:**  
     - **Response:** "Great—that guilt is the disposition! But notice: guilt only works if, at payment time, you *don’t* calculate. If you think, ‘Paying costs $0.50, guilt costs $0.25, so I’ll skip,’ guilt fails. The disposition must bypass calculation."  

  5. **Reputation/contract talk:**  
     - **Response:** "We banned repeated interactions. Contracts? Let’s test: Suppose you could sign a ‘binding’ paper [hold up blank sheet]. Would it change anything without enforcement? No—you’d still defect."  

  **Critical Limitation of the Activity:**  
  - The game splits the hitchhiker’s conflict across two people. Students fixate on "trusting others" rather than "trusting their future self."  
  - **Facilitator’s fix:** Explicitly reframe post-game: "You were the hitchhiker. At Stage 2, *you* had no ticket reason to pay. Cultivating a disposition means your *future self* isn’t deciding—it’s acting automatically. But can you control becoming that person while staying rational?"  

  ---

  ### 50-Minute Version: Cuts  
  - **Trim:** Commitment phase (skip deposit; only allow pledges).  
  - **Shorten:**  
    - Setup (5 min).  
    - Stage 1/2 resolution (5 min combined).  
    - Debrief: Focus on outcomes → reasons → Parfit (skip detailed layer analysis).  
  - **Essential keep:** Hitchhiker reason slips and the "guilt" discussion.  

  **Final Thought:** The activity produces Layer 2 (sticking to a plan) and hints at Layer 3 (dispositions). Use the reason slips to show Layer 3 is where the solution lies—then challenge students to wrestle with its irrationality.
