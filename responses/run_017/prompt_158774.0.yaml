prompt: |-
  Dear Professor,

  I am a seventeen-year-old student at a public high school whose students come roughly half from a farming community and half from a suburb of commuting professionals, and I am assembling the materials for our spring Economics and Society forum — a student-run session in which about sixty of my peers work through one contested question together. I have chosen inherited wealth. The part I am least confident about is the instrument I want to build, and I would be grateful for your help with it.

  What I want is a short sorting quiz: eight to ten items, each a concrete case with two or three answer options, whose scoring key sorts a student into a position on inheritance without ever asking which position they think they hold. My peers will not know the vocabulary, so the question stems should be plain, and every item should be a case where the positions genuinely come apart.

  The leaves I want represented are these: that bequest is a basic incident of ownership and taxing it is confiscation with no principled stopping point; that what matters is unchosen advantage at the recipient's end, so receipts rather than estates should be taxed; that steep death taxation is justified because it funds a one-time capital endowment paid to every citizen at twenty-five, so that the tax completes an equal starting stake rather than merely redistributing; that inheritance is legitimate in principle but large inequalities in life-chances are not, so tax progressively and spend on children's opportunity; that the objection is to a hereditary class with unaccountable power, so dynasties specifically are the target; that the question is only how large the total pie ends up, so incentives decide and the answer may be a low or zero rate; and that family partiality is a protected sphere of intimacy which heavy taxation intrudes upon. I also want at least one cell you think nobody occupies — for instance, unlimited tax-free giving during life combined with near-confiscation at death, or its mirror image — and one sentence on why it is empty.

  Three of the cases must be ones my peers will raise anyway. First, a farm or small business that can only stay in the family if the heir sells part of it to pay the tax. Second, a parent who spends a large sum on a child's schooling and internships while alive versus one who leaves the same sum at death: I want an item that separates objections to the size of a fortune from objections to transfer at death from objections to a dead hand directing resources. Third, an item exposing the timing loophole, since a view that taxes only what is left at death seems to reward early giving, and I want to know whether consistency forces such a view to become a lifetime-transfers view. I would also like one case in which the money goes to a stranger or a cause rather than to a child, and one comparing wealth earned by the person who dies with wealth that has already passed through two generations.

  Two further requests. Please flag any pair of leaves your quiz cannot separate — I suspect the unchosen-advantage view and the anti-dynasty view converge on the same rates for different reasons — and say what would have to be added to tell them apart. And please tell me which single question does the most sorting work and why, since I can only keep ten.

  I am not looking for citations or further reading, only for the instrument and the reasoning behind its construction.
reasoning: |-
  Hmm, this is an impressively detailed request from a high school student about designing a political philosophy sorting quiz on inheritance taxation. The student clearly has a sophisticated grasp of the conceptual landscape and practical constraints. 

  First I need to unpack the core requirements: they want a case-based quiz that sorts respondents into one of seven distinct philosophical positions on inherited wealth, plus one "empty" position. The cases must be concrete, avoid technical jargon, and reliably distinguish between positions that often get conflated in public discourse.

  The student has identified three must-have scenarios: family farms/businesses, lifetime vs death transfers, and timing loopholes. These are excellent choices because they represent real-world pain points where abstract principles collide with practical consequences. I should make sure these are woven into the quiz as non-negotiable items.

  I notice two particularly challenging aspects here. First, distinguishing between the "unchosen advantage" and "anti-dynasty" positions - both might support similar tax rates but for fundamentally different reasons. Second, creating that "empty" position that combines logically inconsistent elements. For the latter, I'm considering a position that allows unlimited tax-free lifetime gifts but confiscatory death taxes, which creates absurd incentives.

  The quiz construction needs careful sequencing. Early questions should tackle broad principles (like whether ownership rights extend beyond death), while later ones can probe nuances (like whether taxing estates differs from taxing inheritance receipts). The farm question will be particularly revealing since it forces respondents to choose between preserving family assets and preventing dynastic wealth.

  For the "most diagnostic question," the endowment proposal might work best because it uniquely captures whether someone views inheritance tax as punitive or as a mechanism for creating equal opportunity. The lifetime vs death transfer question comes close second since it isolates views on inter vivos gifts versus bequests.

  I should also flag that the "unchosen advantage" and "anti-dynasty" positions might be indistinguishable through scenarios alone - they'd require follow-up questions about whether the objection is to individual advantage or systemic power. But since the student wants to keep it to 10 items, I'll note this limitation clearly.

  The student's grasp of the subject is remarkable for a seventeen-year-old. They've clearly done their homework on the philosophical distinctions. I'll craft responses that honor that sophistication while keeping the quiz accessible to their peers who may not share this background knowledge.
answer: |-
  Here is a carefully constructed 10-item sorting quiz designed to place respondents within your specified framework on inherited wealth, using concrete cases and avoiding theoretical jargon. Each item isolates key conflicts between the positions.

  **The "What's Fair About Inheritance?" Sorting Quiz**

  *Instructions: For each situation below, choose the answer (A or B) that seems MOST FAIR or LEAST UNFAIR to you. There are no right or wrong answers, just your gut feeling about fairness.*

  1.  **The Family Farm:** Old MacDonald dies, leaving a dairy farm worth $5 million to his daughter, who has worked there since she was a teen. The only way she can pay a 40% inheritance tax ($2 million) is by selling half the farmland to a big developer.
      *   **(A) The tax shouldn't force her to sell part of the farm.** It's her family's livelihood and legacy.
      *   **(B) She should pay the tax like anyone else.** Special breaks for farms create unfair loopholes for the wealthy.

  2.  **Lifetime Help vs. Death Bequest:** Two parents each have $500,000 to help their child. Parent A spends it all on elite private schools, tutors, Ivy League tuition, and unpaid internships for their child. Parent B saves it and leaves the full $500,000 to the child when they die at age 60.
      *   **(A) Parent A's child got the bigger unfair advantage.** That head start shaped their whole life and earning power.
      *   **(B) Parent B's gift is more problematic.** Wealth received without effort after a life already shaped feels more like unearned privilege.

  3.  **The Timing Game:** Grandpa is very wealthy. He could give $10 million to his grandchild now, tax-free (under gift tax limits), or leave it in his will, where it would face a 40% estate tax ($4 million tax) when he dies in 10 years.
      *   **(A) Taxing only the death transfer is silly.** It just encourages rich families to give early to dodge taxes. Gifts and inheritances should be taxed similarly.
      *   **(B) Death is the right point to tax.** Ownership should be secure while you're alive; it's the transfer *at death* that creates the unearned windfall.

  4.  **Leaving it to Charity:** A wealthy, childless inventor dies, leaving her entire $100 million fortune to establish a foundation researching clean energy, instead of to distant relatives she barely knew.
      *   **(A) This is fine, even admirable.** It's her money to direct as she wishes after death, for a public good.
      *   **(B) This money should still be taxed significantly.** Large concentrations of wealth, even for charity, can create unaccountable power or distort priorities.

  5.  **Old Money vs. New Money:** Person A inherits $50 million from their great-grandfather's railroad empire. Person B inherits $50 million from their parent, who founded a wildly successful tech company last year.
      *   **(A) Person A's inheritance is more problematic.** Multi-generational wealth creates entrenched dynasties disconnected from effort.
      *   **(B) There's no real difference.** Both get $50 million they didn't earn. The source generations ago doesn't change the recipient's unearned advantage.

  6.  **The Equal Start Proposal:** Imagine an inheritance tax set at 65% on large estates. BUT, all revenue funds a "Citizen's Stake" – a $150,000 cash grant every citizen receives at age 25 to start their adult life.
      *   **(A) This is the *only* fair way to handle large inheritances.** It gives everyone a real equal starting chance, funded by recycled privilege.
      *   **(B) This is deeply unfair confiscation.** Taking 65% of someone's rightful property to give cash handouts undermines ownership and rewards idleness.

  7.  **Wealthy Heir, Modest Life:** Someone inherits $20 million at age 30. They invest it conservatively, live modestly off the investment income ($600,000/year), and never work a regular job. They leave the untouched $20 million to their own child.
      *   **(A) This is acceptable.** People should be free to live quietly on their inheritance without pressure to "earn" it again.
      *   **(B) This is precisely the problem.** It allows permanent, idle wealth dynasties disconnected from contribution.

  8.  **Parental Support vs. Stranger's Luck:** Compare two 25-year-olds: One has parents who can comfortably pay their rent while they take a low-paid internship. The other wins $100,000 in the lottery.
      *   **(A) The parental support is more legitimate.** Parents helping kids is natural family intimacy, different from random luck.
      *   **(B) Both are essentially unearned advantages.** Neither did anything to deserve the financial boost over others.

  9.  **The Empty Cell Test:** Imagine a policy: NO tax on *any* gifts given while alive (even billions), but a 95% tax on *everything* left in an estate at death.
      *   **(A) This makes no sense.** Why punish saving until death? It just forces the ultra-rich to give everything away before they die.
      *   **(B) This makes no sense.** If large transfers are problematic, why allow them tax-free just because the giver is still breathing? It's the same unearned wealth.
      *   *(Why Empty? This combines logically contradictory principles: extreme protection for lifetime control/transfers AND extreme punishment for death transfers. It ignores both the continuity of wealth advantage and the finality of death. No stable philosophy holds both views simultaneously.)*

  10. **Funding Opportunity:** A high inheritance tax rate funds universal, high-quality preschool, after-school programs, and college scholarships for low and middle-income kids.
      *   **(A) This is the best justification for the tax.** It reduces unequal life chances by boosting opportunity for all children.
      *   **(B) Confiscating inheritance to fund government programs is wrong.** It's using one unfairness (taking property) to try and fix another.

  ---

  **Scoring Key & Analysis:**

  *   **Leaves Represented:** Each leaf is targeted by specific answer choices that conflict with the others. The scoring key maps answer patterns to the core positions:
      *   **1A, 3B, 6B, 8A, 9A, 10B:** **Bequest as Ownership:** Strong emphasis on property rights, family legacy, minimal interference.
      *   **2A, 5B, 8B:** **Tax Receipts (Unchosen Advantage):** Focus on the *recipient's* unearned gain, regardless of source or timing.
      *   **6A:** **Equal Starting Stake (Endowment):** Uniquely captured by strong agreement *only* with the specific proposal in Q6.
      *   **10A:** **Progressive Tax for Opportunity:** Strong agreement with Q10 *combined* with rejecting confiscation (6B) and dynastic focus (5A, 7B).
      *   **5A, 7B:** **Anti-Dynasty:** Focus on multi-generational wealth and idle heirs as the core problem.
      *   **1B, 4B, (Implied by 3A):** **Growth/Incentives (Low/Zero Tax):** Focus on potential negative effects (forced sales, disincentives, charity impact) implying tax is harmful to the "pie". (Q1B, 4B show practical objections; Q3A implies lifetime taxation is also bad).
      *   **8A, (Implied by 1A, 2B):** **Family Intimacy Sphere:** Protection for parental support/inter vivos gifts as distinct and private (Q8A), plus resistance to death taxes disrupting family assets/plans (Q1A, maybe 2B).
      *   **9A/9B:** **The Empty Cell:** Agreement with *either* A or B identifies the contradiction. Consensus rejection flags the emptiness.

  *   **Flagged Convergence:** **Unchosen Advantage (Leaf 2) vs. Anti-Dynasty (Leaf 5)**.
      *   **Problem:** They often agree on *high* taxation (Q1B, Q3A/B, Q4B, Q6A, Q7B, Q10A). Q5 is the best differentiator (5A = Anti-Dynasty, 5B = Unchosen Advantage), but it's not perfect. Someone strongly against dynasties (5A) might *also* care about unearned advantage generally (agreeing with 2A, 8B).
      *   **How to Tell Them Apart:** Add a question directly about motivation: *"Is the biggest problem with large inheritances that they give individuals money they didn't earn (Unchosen Advantage), or that they allow wealthy families to stay powerful across generations (Anti-Dynasty)?"* Or use a case involving a *first-generation* large inheritance to a hardworking heir vs. a third-generation idle heir.

  *   **The Single Best Sorter:** **Question 6 (The Equal Start Proposal)**.
      *   **Why:** It uniquely isolates the "Equal Starting Stake" position (strong A). A "No" (B) is *required* by virtually all other positions: "Ownership" sees confiscation; "Unchosen Advantage" sees taxing receipts later as better; "Opportunity" prefers targeted spending; "Anti-Dynasty" might prefer breaking up dynasties directly; "Incentives" sees massive disincentive; "Family" sees intrusion. Only the "Equal Start" view finds this specific trade-off compelling and fair. It forces a stark choice about the fundamental purpose of inheritance tax.

  **Construction Reasoning:**

  1.  **Concreteness & Avoid Jargon:** Every item uses relatable scenarios (farms, school, lottery, grandparents, charity) instead of terms like "estate tax," "meritocracy," or "intergenerational mobility."
  2.  **Forcing Divergence:** Each item presents a dilemma where core principles conflict (e.g., family farm preservation vs. equal treatment under tax law in Q1; parental intimacy vs. unearned gain in Q8).
  3.  **Mandatory Cases Included:**
      *   **Family Farm/Business:** Q1 directly addresses this pain point.
      *   **Lifetime vs. Death Transfer:** Q2 isolates objections to advantage size (A) vs. transfer timing/effort (B). Q3 probes the loophole, forcing consideration of consistency (A points to taxing lifetime transfers, B defends death-only tax).
      *   **Charity:** Q4 addresses wealth going to non-relatives/causes.
      *   **Multi-Generational Wealth:** Q5 explicitly contrasts "Old Money" vs. "New Money."
  4.  **The Empty Cell:** Q9 presents the logically inconsistent mirror images. Explaining *why* both A and B seem nonsensical reveals the emptiness.
  5.  **Diagnostic Power:** Items like Q6 (unique to one view), Q5 (key divergence), Q7 (idle dynasty), and Q8 (family intimacy) are highly diagnostic. Q10 distinguishes "Opportunity" spending from general redistribution or confiscation.
  6.  **Coverage:** Every leaf is targeted by at least one answer strongly aligned with it and contradicted by answers aligned with others. The scoring pattern across multiple items refines placement. Q9 serves its specific purpose.

  This instrument should effectively spark discussion and help your peers discover where their intuitions place them within the complex landscape of views on inherited wealth, based on concrete fairness judgments rather than labels. Good luck with your forum!
