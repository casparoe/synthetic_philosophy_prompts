  Also, the user might need reassurance that their concerns are valid but that "code" is still useful pedagogically. Highlighting the self-referential nature (machinery reading its own specs) addresses the intentionality worry. The shuffling test shows DNA's arbitrariness, which aligns with genetic code's degeneracy (multiple codons for same amino acid), supporting it as a code.

