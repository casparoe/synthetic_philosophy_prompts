   4. A stubborn Nicodian might say: only observations of ravens can bear on the hypothesis about ravens. In this case, they would say that the non-black non-raven is irrelevant. But our calculation shows it is not irrelevant. In fact, it is slightly more informative in the first scenario. The Nicodian might attack by questioning the prior: do we really know the total number of non-black objects? In our scenario, we do because it's given in the caretaker's notebook.

