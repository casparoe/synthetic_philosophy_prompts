  ### Constructed Scenario: Museum Photo Archive

  **Setting:**  
  You are a curator at a museum with a photo archive of 100 bird species. The archive's index lists the following:  
  - Total photos: 100  
  - Ravens: 3 (species known, but colors unverified)  
  - Non-black birds: 2 (recorded from initial cataloging, but species unverified)  

  **Hypothesis and Contrapositive:**  
  - Hypothesis \( H \): "All ravens in the archive are black" (i.e., no raven is non-black).  
  - Contrapositive \( H_{\text{cp}} \): "All non-black birds in the archive are non-ravens" (i.e., no non-black bird is a raven).  
  \( H \) and \( H_{\text{cp}} \) are logically equivalent.  

  **Prior Uncertainty:**  
  The index does not specify which birds are non-black ravens. Let \( X \) be the number of non-black ravens. Given the known totals:  
  - Ravens: 3  
  - Non-black birds: 2  
  - Population: 100  

  Possible values for \( X \):  
  - \( X = 0 \): No non-black ravens (i.e., \( H \) is true).  
  - \( X = 1 \): One non-black raven and one non-black non-raven.  
  - \( X = 2 \): Two non-black ravens (and no non-black non-ravens).  

  **Prior Distribution (Hypergeometric):**  
  Since the non-black property is randomly assigned among all birds (consistent with the index):  
  \[
  P(X=x) = \frac{\binom{3}{x} \binom{97}{2-x}}{\binom{100}{2}} \quad \text{for} \quad x \in \{0, 1, 2\}
  \]  
  Calculations:  
  - \( \binom{100}{2} = 4950 \)  
  - \( P(X=0) = \frac{\binom{3}{0}\binom{97}{2}}{\binom{100}{2}} = \frac{1 \cdot 4656}{4950} \approx 0.9406 \)  
  - \( P(X=1) = \frac{\binom{3}{1}\binom{97}{1}}{\binom{100}{2}} = \frac{3 \cdot 97}{4950} \approx 0.0588 \)  
  - \( P(X=2) = \frac{\binom{3}{2}\binom{97}{0}}{\binom{100}{2}} = \frac{3 \cdot 1}{4950} \approx 0.0006 \)  

  **Sampling Procedure:**  
  You randomly select one photo uniformly from the 100. We compare two observations:  
  1. **Observation A (Black Raven):** The selected photo shows a black raven.  
  2. **Observation B (Non-Black Non-Raven):** The selected photo shows a non-black non-raven.  

  ---

  ### Bayesian Calculations  
  #### Observation A: Black Raven  
  - Likelihood under \( X=x \):  
    \[
    P(\text{black raven} \mid X=x) = \frac{\text{number of black ravens}}{100} = \frac{3 - x}{100}
    \]  
  - Marginal likelihood:  
    \[
    P(\text{black raven}) = \sum_{x} P(\text{black raven} \mid X=x) P(X=x)
    \]  
    \[
    = \left( \frac{3}{100} \cdot 0.9406 \right) + \left( \frac{2}{100} \cdot 0.0588 \right) + \left( \frac{1}{100} \cdot 0.0006 \right) \approx 0.0294
    \]  
  - Posterior probability of \( H \) (\( X=0 \)):  
    \[
    P(H \mid \text{black raven}) = \frac{P(\text{black raven} \mid H) P(H)}{P(\text{black raven})} = \frac{\left( \frac{3}{100} \right) \cdot 0.9406}{0.0294} \approx 0.9598
    \]  

  #### Observation B: Non-Black Non-Raven  
  - Likelihood under \( X=x \):  
    \[
    P(\text{non-black non-raven} \mid X=x) = \frac{\text{number of non-black non-ravens}}{100} = \frac{2 - x}{100}
    \]  
  - Marginal likelihood:  
    \[
    P(\text{non-black non-raven}) = \left( \frac{2}{100} \cdot 0.9406 \right) + \left( \frac{1}{100} \cdot 0.0588 \right) + \left( \frac{0}{100} \cdot 0.0006 \right) \approx 0.0194
    \]  
  - Posterior probability of \( H \) (\( X=0 \)):  
    \[
    P(H \mid \text{non-black non-raven}) = \frac{\left( \frac{2}{100} \right) \cdot 0.9406}{0.0194} \approx 0.9697
    \]  

  **Result:**  
  - \( P(H \mid \text{non-black non-raven}) \approx 96.97\% \)  
  - \( P(H \mid \text{black raven}) \approx 95.98\% \)  
  Observation B (non-black non-raven) confirms \( H \) more than observation A (black raven).  

  ---

  ### Why the Asymmetry?  
  - **Non-black birds are rare (2 out of 100):**  
    Observing a non-black non-raven accounts for half of all non-black birds, significantly reducing the "slack" for a non-black raven to exist. This makes \( H \) more likely.  
  - **Ravens are not extremely rare (3 out of 100):**  
    Observing a black raven leaves room for non-black ravens to exist (especially since 3 ravens are fewer than 100 but not vanishingly scarce).  

  **Equivalence Condition:**  
  \( H \) and \( H_{\text{cp}} \) are logically equivalent, so a Bayesian updates identically for both. The asymmetry arises from the **sampling process (uniform over objects)** and the **prior structure (fixed totals for ravens and non-black birds)**, which treats the two observations differently due to the rarity of non-black objects.  

  ---

  ### Diagnostics  
  **Key Feature:** Rarity of non-black objects (2 out of 100).  

  **Flip the Rarity:**  
  Swap the counts:  
  - Ravens: 2 (rare)  
  - Non-black birds: 3 (abundant)  
  - Population: 100  

  Repeating the calculations:  
  - Prior \( P(X=0) \approx 0.9406 \) (same hypergeometric logic)  
  - \( P(H \mid \text{black raven}) \approx 96.99\% \)  
  - \( P(H \mid \text{non-black non-raven}) \approx 95.96\% \)  
  Now, the black raven confirms \( H \) more, reverting to the standard case.  

  **Nicodian Attack:**  
  A stubborn Nicodian ("only ravens can confirm ravens") would reject observation B as irrelevant. They might argue:  
  - "Observing a non-raven tells us nothing about ravens; only checking ravens matters."  
  - Attack vector: Question the prior. Do we *truly* know there are exactly 2 non-black birds? If the index is untrusted, the prior collapses, and the effect vanishes. But in this scenario, the index (e.g., a verified packing list) is authoritative.  

  **Conclusion:**  
  The reversal is genuine and falls out of the setup (rarity of non-black objects + uniform sampling). No smuggling is needed—the priors and sampling are explicit in the inventory. The asymmetry lives in the world (non-black rarity), not psychology.
