answer: |-
  Here is the complete exam package as requested, designed to test conceptual analysis of the Knobe effect beyond surface-level replication.

  ---

  ### Essay Question (to be printed for students)
  **Time Allowed:** 60 minutes  
  **Word Guide:** ≈800 words  

  **Background:**  
  The Knobe effect demonstrates an asymmetry in intentionality ascriptions: people typically say an agent *intentionally* caused a harmful side effect (e.g., increasing traffic deaths) but *unintentionally* caused a helpful side effect (e.g., reducing deaths). You are given a variant:  

  > A transport official adopts a new scheduling system to cut costs. She knows this will add roughly one traffic death per year on a specific road stretch (but not *whose* death). Participants say she **intentionally caused the deaths**. When the case is altered so the system *reduces* deaths by one per year (a helpful side effect), participants deny she **intentionally saved anyone**.  

  Now suppose three additional empirical findings hold:  
  > **(i) Misinformation Asymmetry:** The intentionality asymmetry persists even when the official is *misinformed*. When she *believes* the change reduces deaths (but it *increases* them), participants still say she intentionally caused the deaths. Conversely, when she believes it increases deaths (but it *decreases* them), they deny she intentionally saved anyone.  
  >  
  > **(ii) Omission Equivalence:** The asymmetry holds when the side effect stems from *omission* (e.g., letting a safety program lapse, causing one extra death per year). Participants say she intentionally caused deaths by inaction, but deny she intentionally saved lives if inaction reduces deaths.  
  >  
  > **(iii) Blame-Intentionality Link (Omissions):** In omission cases, ascriptions of intentionality correlate strongly with ascriptions of *blame* (e.g., "she is blameworthy for the deaths"). This correlation is significantly stronger than with ascriptions of *foresight* (e.g., "she knew deaths would occur") or *desire* (e.g., "she wanted deaths to happen").  

  **Your Task:**  
  1. **Conceptual Evidence:** Explain what would count as evidence about *the concept of intentional action itself* in this scenario, as opposed to evidence about how the *word* "intentionally" is used for non-conceptual purposes (e.g., to express blame). (≈200 words)  
  2. **Theoretical Predictions:** Analyze how each of the following explanatory frameworks would predict or explain findings (i)–(iii). Be precise about what each *must*, *could*, or *cannot* accommodate:  
     - **(A)** Norm-violation accounts (intentionality ascriptions track perceived moral violations).  
     - **(B)** Reason-based/explanation-based accounts (intentionality depends on whether the side effect was part of the agent’s reasons for acting).  
     - **(C)** Conversational/pragmatic accounts (asymmetry arises because "intentionally" pragmatically implies blame or focus on outcomes). (≈400 words)  
  3. **Discriminating Study:** Propose *one* new experiment (beyond the given variants) whose results could distinguish between the *two* theories best supported by (i)–(iii). Specify:  
     - What you manipulate/measure.  
     - What outcome would favor each theory.  
     - Why it tests conceptual structure rather than verbal habits. (≈200 words)  

  ---

  ### Model Answer (≈800 words)  
  **1. Conceptual Evidence vs. Word Usage**  
  Evidence about the *concept* of intentional action must reveal stable, underlying criteria (e.g., mental states like belief/desire, or control conditions) that people apply to judge intentionality *independently* of extraneous factors. For example, if responses systematically track foresight or control across varied moral contexts, this suggests conceptual structure. Conversely, evidence about *word usage* shows how "intentionally" serves pragmatic functions (e.g., expressing blame in (iii)), where judgments *covary* with non-mental factors like outcome valence. Crucially, conceptual evidence should persist when pragmatic pressures are minimized (e.g., in neutral elicitation tasks), while usage-based patterns would diminish in such contexts. Findings (i)–(iii) are empirical facts; whether they reflect conceptual structure depends on whether they withstand controls for confounding variables like blame expression.  

  **2. Theoretical Predictions for (i)–(iii)**  
  *(Settled empirical fact: The original Knobe asymmetry is highly replicated. Findings (i)–(iii) are stipulated here but reflect real contested extensions.)*  

  | **Theory**               | **(i) Misinformation Asymmetry** | **(ii) Omission Equivalence** | **(iii) Blame-Intentionality Link** |  
  |--------------------------|----------------------------------|-------------------------------|-------------------------------------|  
  | **A) Norm-violation**    | **Contested accommodation**: Predicts asymmetry *only if* harm represents a norm violation. Misinformation (i) challenges this: participants judge based on *actual* outcome, not the agent’s (non-violating) belief. Norm accounts *could* reframe norms as outcome-based but struggle to explain why *beliefs* don’t override outcomes. | **Predicts symmetry**: Omissions causing harm are norm violations, so intentionality ascriptions should mirror active harm cases. Accommodates (ii) easily. | **Predicts correlation**: If "intentionally" marks norm violations, and blame assigns responsibility for violations, strong blame-intentionality link is expected. Fits (iii) well. |  
  | **B) Reason-based**      | **Contested challenge**: If intentionality requires the side effect to be part of the agent’s reasons for acting, misinformation (i) should *eliminate* the asymmetry. When the agent believes deaths decrease (but they increase), she lacks reasons to cause harm, so "intentionally" should be denied. Finding (i) contradicts core prediction. | **Mixed support**: May explain omissions if inaction reflects reasons (e.g., "letting deaths happen to cut costs"). But reasons-based views often treat omissions differently from actions—(ii) tests this boundary. | **Predicts *weak* link**: Intentionality depends on reasons, not blame. If blame tracks outcomes while intentionality tracks reasons, (iii)’s strong correlation is unexpected. |  
  | **C) Pragmatic**         | **Predicts symmetry**: If "intentionally" implies blame, misinformation (i) should *reverse* judgments: when deaths increase *unexpectedly*, the agent is less blameworthy, so "intentionally" should be denied. Finding (i) contradicts this. | **Predicts asymmetry**: Omission harms are blamed similarly to actions, so pragmatic pressure to use "intentionally" persists. Accommodates (ii). | **Core prediction**: Strong blame-intentionality correlation in (iii) fits perfectly—pragmatic views hold that "intentionally" *is* a blame-expression tool in such contexts. |  

  **Analysis**:  
  - (i) challenges **B** and **C**, but **A** can partially accommodate it by shifting to outcome-based norms.  
  - (ii) is compatible with **A** and **C**, but **B** may struggle if omissions involve different reason structures.  
  - (iii) strongly favors **A** and **C** over **B**, as **B** predicts dissociation between reasons (intentionality) and blame.  
  *Contested interpretation: Whether (i) decisively refutes **B**/**C** depends on whether "reasons" or "pragmatic pressure" can be redefined (e.g., actual outcomes generate new reasons).*  

  **3. Discriminating Study**  
  To test **A** (norm-violation) vs. **C** (pragmatic), manipulate:  
  - **Scenario**: Transport official case with *helpful* omission (inaction reduces deaths by one/year).  
  - **Condition 1 (Blame-Absolution)**: Explicitly state, "The official is *not blameworthy* because deaths decreased."  
  - **Condition 2 (Neutral)**: No blame information.  
  - **Measure**: Rates of "intentionally saved lives" ascriptions.  

  **Predictions**:  
  - **Norm-violation (A)**: Helpful omissions lack moral violations, so "intentionally" should be *denied* in both conditions. Absolving blame (Condition 1) changes nothing.  
  - **Pragmatic (C)**: "Intentionally" is primarily a blame-expression tool. If blame is pre-absolved (Condition 1), pragmatic pressure to deny "intentionally" decreases, leading to *higher* intentionality rates than in Condition 2.  

  **Why conceptual?** This isolates whether "intentionally" is tied to mental states/norms (unchanged by absolution) or to communicative goals (altered by absolution). If judgments shift with absolution, it suggests the word is used pragmatically; stability suggests conceptual structure.  

  ---

  ### Marking Scheme (20 points total)  
  | **Criterion**                                                                 | **Points** | **Common Mistakes** |  
  |-------------------------------------------------------------------------------|------------|---------------------|  
  | **1. Clear separation of conceptual evidence vs. word-usage evidence** (e.g., defines conceptual evidence as mental-state/control criteria *independent* of moral valence/pragmatics) | 4 | Students conflate empirical patterns (e.g., "people say X") with conceptual facts (e.g., "intentionality requires Y"), or reduce concepts to usage. |  
  | **2. Accurate predictions for each theory (A/B/C) on (i)–(iii)**              | 6 | Misattributing predictions (e.g., claiming norm accounts easily explain misinformation); ignoring contradictions (e.g., overlooking how (i) challenges reason-based views). |  
  | **3. Valid follow-up study design** (Manipulates a variable that *discriminates* two theories; measures intentionality; justifies why it tests concepts) | 4 | Proposing studies that don’t contrast live theories (e.g., testing only one theory) or that conflate concepts with pragmatics (e.g., adding synonyms for "intentionally"). |  
  | **4. Correct identification of settled vs. contested claims** (Marks original asymmetry as settled; (i)–(iii) as stipulated; theories as contested) | 4 | Presenting contested theories as consensus (e.g., "pragmatic accounts are wrong") or treating (i)–(iii) as real data. |  
  | **5. Overall coherence and precision** (Answer is structured, avoids irrelevance, uses philosophical terms accurately) | 2 | Digressions into moral responsibility generalities or vague descriptions of theories/studies. |  

  ---

  This design forces engagement with the *concept* vs. *usage* distinction by:  
  - Requiring explicit criteria for conceptual evidence (Part 1).  
  - Testing theory predictions where moral valence (*what* is said) is decoupled from mental states (e.g., misinformation in (i)) and pragmatics (e.g., blame link in (iii)).  
  - Demanding a study that isolates conceptual structure from verbal pragmatics (Part 3).  
  The model answer and mark scheme explicitly flag contested claims to avoid overstatement.
