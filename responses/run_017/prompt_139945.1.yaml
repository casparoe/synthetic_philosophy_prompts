  The user mentions various scenarios—displaced erectors, deep past artifacts, scoped monuments—so the criteria must cover historical context, community impact, and moral reassessment. They're skeptical of biases disguised as principles, so I should flag which requirements are truly universal versus contested.

  I'm considering how to balance descriptive and normative aspects. For instance, "functional commemoration" (public recognition) seems non-negotiable, while "symbolic neutrality" might be idealistic. The dead hand problem highlights temporal disconnect—current communities vs. past builders—which needs a criterion about present community alignment. 

  The exchange rate between commemoration types (statues vs. street names) is tricky. Physical prominence and intent matter here. Also, alternatives like museum relocation aren't just removals; they shift context from honor to artifact. 

  Joint satisfiability is key. For example, "temporal adaptability" (allowing reevaluation) might clash with "respect for settlements" if a past bargain is deemed unjust today. I'll note that tension explicitly. 

  Finally, testing criteria against real theories: Presentism fails on historical fidelity, while permanentism ignores reevaluation. The list itself reveals why no theory dominates—conflicts between community autonomy and historical fidelity are inherent. That’s the "interesting result" the user wants.
answer: |-
  Here is a specification of desiderata for an adequate theory of commemoration, designed to meet your physicist's demand for rigor and testability against concrete cases. Requirements are categorized, justified by case/s, and marked for negotiability. Joint unsatisfiability and key exclusions are analyzed.

  ---

  ### **Core Desiderata (Non-Negotiable)**
  These must be satisfied by any adequate theory. Failure on any invalidates the theory.

  1.  **Functional Commemoration:** *The theory must distinguish between mere naming/reference and active commemoration (honoring).*  
      **Case:** Faded Referent. If no one recognizes "Washington Ave" as honoring George Washington, it ceases to function as commemoration, becoming inert naming. A theory must account for this gradient.  
      **Why NN:** Without this, the core phenomenon (honoring) is undefined.

  2.  **Historical Fidelity:** *The theory must engage with the actual, documented historical record of the subject and the context of the monument's creation, not solely present perceptions.*  
      **Case:** Posthumous Discovery, Deep Past, Scoped Monument. Evaluating a subject requires accurate facts. Understanding the erectors' intent (e.g., Confederate monument vs. Roman aqueduct) is crucial for action.  
      **Why NN:** Ignores reality and reduces commemoration to presentist opinion.

  3.  **Temporal Adaptability:** *The theory must allow for re-evaluation based on new historical evidence or significant evolution in the values of the commemorating community.*  
      **Case:** Posthumous Discovery, Displaced Erectors, Dead Hand. Communities change; facts emerge. A theory must permit reassessment.  
      **Why NN:** Permanentism (once up, never down) is empirically and morally unsustainable.

  4.  **Context Sensitivity:** *The theory must recognize that the meaning, impact, and permissibility of commemoration depend significantly on the physical/social context (location, audience, medium).*  
      **Case:** Scoped Monument, Exchange Rate, Menu of Alternatives, Deep Past. A statue in a town square ≠ a name on a scholarship ≠ an ancient artifact in a museum. Actions (removal, contextualization) depend on context.  
      **Why NN:** Treating all commemoration identically is descriptively false and prescriptively useless.

  5.  **Community Agency:** *The theory must acknowledge that the legitimate authority to initiate, maintain, alter, or remove commemoration resides primarily with the political community living under/with the monument in the present.*  
      **Case:** Displaced Erectors, Dead Hand, Commemorative Bargain. The present community bears the symbolic burden/benefit and must have agency, even if constrained by other factors (e.g., settlements, preservation).  
      **Why NN:** Denying agency is undemocratic and ignores the "dead hand" problem.

  ---

  ### **Substantive Desiderata (Negotiable but Essential for Adequacy)**
  These reflect core tensions; different theories will weight/interpret them differently, but ignoring them entirely renders a theory inadequate.

  6.  **Harm Avoidance:** *Commendation should not cause significant, unjustified ongoing harm (e.g., intimidation, dignitary harm, perpetuation of oppressive narratives) to identifiable groups within the community.*  
      **Case:** Displaced Erectors, Scoped Monument (e.g., honoring a philanthropist who was also a colonial oppressor harms descendants). **Negotiable Weight:** How much harm? To whom? Overrides other values?  
      **Justification:** Core function of public space/symbols.

  7.  **Preservation of Historical Discourse:** *Actions regarding commemoration should, where feasible, facilitate rather than erase complex historical understanding.*  
      **Case:** Deep Past, Menu of Alternatives (Museums, added plaques), Posthumous Discovery. Removal can erase history; contextualization preserves it for critical engagement. **Negotiable Scope:** Does not mandate keeping every monument *in situ*.  
      **Justification:** Learning from the past requires access to its artefacts and narratives, even critical ones.

  8.  **Respect for Settlements & Intent (Limited):** *The original intent and context of creation, including formal settlements, should be a relevant factor, though not necessarily determinative.*  
      **Case:** Commemorative Bargain, Displaced Erectors. Ignoring the reasons something was erected risks historical distortion and breaking legitimate agreements. **Negotiable Force:** Weighing against present harm/values.  
      **Justification:** Stability, promise-keeping, understanding historical context.

  9.  **Symbolic Neutrality (Aspirational):** *Public space should ideally be inclusive, not requiring citizens to constantly navigate symbols endorsing values antithetical to their equal standing.*  
      **Case:** Displaced Erectors, Scoped Monument. A statue glorifying a slaveholder in the main square forces some citizens to endure state-sanctioned disrespect. **Negotiable Interpretation:** What constitutes "public space"? What level of offense?  
      **Justification:** Foundational equality and civic harmony.

  ---

  ### **Discriminating Power & Key Exclusions**
  *   **Exchange Rate:** Handled by **Context Sensitivity** (a statue is high-impact, active commemoration; a fellowship name is lower-impact, often passive). **Functional Commemoration** distinguishes active honor from passive naming.
  *   **Menu of Alternatives:** **Context Sensitivity** and **Preservation of Historical Discourse** show these are distinct: Relocating to a museum transforms honor into artifact/education; an added plaque changes meaning *in situ*; a sunset clause builds in temporality; removal is erasure. Not "removal under another description."
  *   **Deep Past Line:** Drawn via **Functional Commemoration** (is it still actively honoring?), **Harm Avoidance** (is it causing *present* harm?), **Preservation of Historical Discourse** (value as artifact/education), and **Context Sensitivity** (museum vs. public square).
  *   **Most Excluding Requirement:** **Harm Avoidance** does the most work in excluding popular positions. Permanentism ignores it. Extreme presentism uses it to override all else. Theories must grapple with defining and weighing harm.
  *   **Joint Unsatisfiability:** The core tension is between **Community Agency/Temporal Adaptability/Harm Avoidance** and **Respect for Settlements & Intent/Preservation of Historical Discourse**. A community *now* (Agency) discovering new harm (Adaptability) may need to alter/remove a monument erected under a settlement (Respect for Intent) or destroy historical evidence (Preservation). *No theory perfectly resolves this; weighting is essential.*
  *   **Discarded Non-Starters:** "Must please everyone" (impossible), "Must reflect eternal truth" (ignores Temporal Adaptability), "Must always remain as erected" (ignores Community Agency/Temporal Adaptability/Harm Avoidance).

  ---

  ### **How Major Families Score**
  *   **Presentism (Focus solely on current values/harm):** Strong on **Harm Avoidance, Community Agency, Temporal Adaptability**. Weak/Fails on **Historical Fidelity, Respect for Settlements & Intent, Preservation of Historical Discourse**. Risks ignoring facts and context.
  *   **Permanentism (Never remove):** Strong on **Respect for Settlements & Intent, Preservation (physical)**. Fails **Temporal Adaptability, Harm Avoidance, Community Agency**. Ignores change and harm.
  *   **Contextualism (Add plaques, relocate):** Strong on **Context Sensitivity, Preservation of Historical Discourse, Temporal Adaptability** (allows change). Can balance **Harm Avoidance** (via relocation/context) and **Historical Fidelity**. Challenged by severe harm or contested settlements (**Respect for Settlements**).
  *   **Proceduralism (Focus on fair process):** Can satisfy **Community Agency**. Potentially agnostic on **Harm Avoidance, Historical Fidelity, Preservation** – depends on the procedure's rules. Risks ignoring substantive outcomes.

  **The List as Result:** The list *is* the key result. It demonstrates that adequate commemoration theory is inherently pluralistic and contextual. No single principle dominates; the desiderata are in tension (especially Harm vs. Preservation/Respect). A viable theory must explicitly weight and adjudicate between these core demands, not ignore them. Your cases serve as essential test vectors for this weighting.
