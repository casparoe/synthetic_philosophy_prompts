          Leaf B1: Measurement tampering
            - Signature: Signs of data manipulation: unusual patterns in the data (e.g., round numbers, missing entries, anomalies in data collection), or reports of pressure on data recorders. Also, the metric improves but a second, independent measure of the same thing does not.
