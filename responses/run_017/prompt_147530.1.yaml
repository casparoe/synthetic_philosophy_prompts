  ### Diagnostic Tree for Goodhart's Law Failures  
  *When metrics become targets, they often cease to be useful. This tree identifies why, based on observable patterns in your institution's data and behavior. Start at the top and follow the branches.*  

  #### Level 1: Where is the damage located?  
  - **A. Thing Worse**: The underlying goal degrades despite metric improvement.  
  - **B. Measure Worse**: The metric no longer tracks the goal (goal may be stable or improving).  
  - **C. Constitutive Practice**: The metric *is* the goal by institutional definition.  
  - **D. Survived**: The metric and goal improve together with no adverse effects.  

  #### Level 2A (Thing Worse): How is the incentive structured?  
  - **A1. Cliff Incentive**: Thresholds with drastic consequences (e.g., "90% compliance or budget cut").  
  - **A2. Gradient Incentive**: Smooth rewards for incremental gains.  

  #### Level 2B (Measure Worse): How is the response achieved?  
  - **B1. Measure Attack**: Degrading the measurement channel itself.  
  - **B2. Effort Substitution**: Reallocating effort to boost the metric.  

  #### Level 3A2 (Thing Worse + Gradient): Is case-mix changing?  
  - **A2a. Cream-Skimming**: Easier cases are prioritized.  
  - **A2b. Effort Misallocation**: Effort diverted from unmeasured tasks.  

  #### Level 3B2 (Measure Worse + Effort Substitution): Where does the proxy break?  
  - **B2a. General Breakdown**: Metric-goal link degrades everywhere.  
  - **B2b. Extreme Decay**: Metric-goal link fails only at high extremes.  

  ---

  ### Leaf Descriptions  
  *For each failure mode, three critical diagnostics: (1) Observable signature, (2) Awkward commitment, (3) What would reassign it.*  

  | Leaf                  | Observable Signature                                 | Awkward Commitment                                        | Reassignment Trigger                                  |  
  |-----------------------|------------------------------------------------------|-----------------------------------------------------------|-------------------------------------------------------|  
  | **A1. Threshold-Hugging** | Bunching just below/above cutoff; avoidance of high-risk cases. | You must accept deliberate exclusion of vulnerable cases. | If the *measurement method* is corrupted (e.g., data falsification). |  
  | **A2a. Cream-Skimming**  | Measured group becomes statistically easier (e.g., simpler patients/students). | You must admit the institution cherry-picks easy wins. | If unmeasured aspects decline *without* case-mix changes (e.g., teaching quality drops). |  
  | **A2b. Effort Misallocation** | Declining performance in unmeasured tasks (e.g., patient outcomes fall while wait times improve). | You must concede core duties are being neglected. | If case-mix shifts toward easier subjects. |  
  | **B1. Measure Attack**   | Anomalies in data collection (e.g., missing entries, "clock pauses," or auditing gaps). | You must acknowledge organized manipulation. | If the metric breaks down due to behavioral shifts (e.g., teaching to the test). |  
  | **B2a. Proxy Breakdown (General)** | Metric rises but independent measures of the *same goal* stagnate/decline. | You must accept the metric is now meaningless. | If the breakdown occurs *only* at high performance levels. |  
  | **B2b. Proxy Breakdown (Extremes)** | High metric values no longer correlate with goal progress (e.g., test scores ≠ learning past 95%). | You must agree the metric is useless beyond a point. | If the metric-goal link fails at *all* levels. |  
  | **C. Constitutive Practice** | Institutional language redefines the goal as the metric (e.g., "Success = hitting target X"). | You must recognize the original goal is abandoned. | If the institution still uses external goal assessments. |  
  | **D. Survived**         | Independent measures confirm goal improvement *and* no gaming patterns emerge. | You must trust the institution avoided perverse incentives. | If any degradation in unmeasured areas or proxy decay appears. |  

  ---

  ### 10-Question Diagnostic Quiz  
  *Answer these for your metric; tally matches to leaves. Scoring rule: Assign to the leaf with the most matches. Disagreements arise when signatures overlap (e.g., cream-skimming vs. general proxy breakdown).*  

  1. **When the metric improves, what happens to unrelated aspects of the work?**  
     - a) They degrade noticeably. → *A2b*  
     - b) They stay the same or improve. → *D, B1, B2b, C*  

  2. **Do high metric values still mean better outcomes? (e.g., does 99% compliance help more than 95%?)**  
     - a) No—past a point, gains are meaningless. → *B2b*  
     - b) Yes—higher always equals better. → *All others*  

  3. **Are cases near a critical threshold handled differently?**  
     - a) Yes—clustering just below/above cutoff. → *A1*  
     - b) No. → *All others*  

  4. **Is the measured group becoming "easier"? (e.g., simpler clients, milder cases)**  
     - a) Yes. → *A2a*  
     - b) No. → *All others*  

  5. **Could you manipulate the metric without changing real work? (e.g., tweak data, exclude cases)**  
     - a) Yes, and it happens. → *B1*  
     - b) No, or it doesn’t happen. → *All others*  

  6. **Does an independent measure of the same goal confirm improvement?**  
     - a) No—it shows stagnation/decline. → *B2a, B2b*  
     - b) Yes. → *D, C*  

  7. **Is the metric treated as the definition of success?**  
     - a) Yes—official documents equate them. → *C*  
     - b) No—the goal is discussed separately. → *All others*  

  8. **When the metric rises, do frontline workers report feeling pressured to cut corners?**  
     - a) Yes—on unmeasured tasks. → *A2b*  
     - b) No. → *All others*  

  9. **Do high performers invest heavily in metric optimization?**  
     - a) Yes—disproportionate resources go to boosting the number. → *A2a, A2b, B2a*  
     - b) No—effort aligns with broader goals. → *D*  

  10. **Are there unexplained data gaps? (e.g., missing records, "exempt" cases)**  
      - a) Yes. → *B1, A1*  
      - b) No. → *All others*  

  ---

  ### Worked Applications  

  #### Case 1: Hospital Emergency Department  
  *Metric:* Share of patients seen within 4 hours.  
  *Gaming:* Patients held in ambulances to delay clock start.  
  - **Diagnostic Path**:  
    1. **Damage Location**: *Thing Worse* (Patients wait longer in ambulances).  
    2. **Incentive Shape**: *Cliff* (Targets trigger audits/funding penalties).  
    3. **Signature Match**: Bunching near 4-hour mark (A1), data gaps in ambulance times (B1).  
  - **Verdict**: **A1 (Threshold-Hugging)**.  
  - **Why?** Avoidance of high-risk cases (sickest patients kept off books) worsens outcomes. Measure Attack (B1) is present but secondary; the key harm is delayed care.  

  #### Case 2: School Test Scores  
  *Metric:* Standardized test scores.  
  *Gaming:* Scores rise while unaudited external assessments stay flat.  
  - **Diagnostic Path**:  
    1. **Damage Location**: *Measure Worse* (Scores don’t track real learning).  
    2. **Response Channel**: *Effort Substitution* (Teaching to the test).  
    3. **Proxy Breakdown**: *General* (All score levels decouple from external tests).  
  - **Ambiguity**: Between **B2a (Proxy Breakdown - General)** and **A2a (Cream-Skimming)**.  
    - If student demographics shifted toward high-performers: → *A2a*.  
    - If demographics are stable but teaching narrowed: → *B2a*.  
  - **Unresolved by Tree**: Requires checking student cohort data. *Why?* Cream-skimming (A2a) changes *who* is measured; effort substitution (B2a) changes *how* they’re taught.  

  ---

  ### Why This Tree Works  
  This tool isolates high-stakes patterns: data distortions, effort shifts, and institutional self-deception. It avoids mechanistic jargon, focusing instead on what you can *observe* and *prove*. The "Survived" leaf (D) is rare—it demands alignment of metric, goal, and behavior with no collateral damage. When metrics endure, it’s because incentives avoid cliffs, measurement resists attack, and effort amplifies—not subverts—the mission.
