prompt: |-
  I’ve just had a long and inconclusive argument with a friend about whether an output from a non-human system can ever count as a performative utterance, and I do not want to have it again. Our disagreement started from a scripted customer-service chatbot that sends a fixed message saying I apologize for the outage whenever an outage is detected, where the company’s policy says customers should treat that message as an official apology; my friend thought this was enough for a real apology, while I thought something essential was missing. We then moved to a harder case: a blockchain-based organization whose code automatically publishes a statement that a member is expelled as soon as a vote passes, and whose governing rules say that publication is the expulsion. We realized we were each assuming a different theory of what a performative utterance has to be, so before I read any more speech-act theory I want a specification of what I should be demanding of one.

  Write the desiderata that any adequate theory of performative utterance must meet in order to settle disputes of exactly this kind. Fix the purpose narrowly: the theory must be good enough to adjudicate whether outputs of non-human or semi-automated systems—scripted chatbot messages, automatic institutional publications, smart-contract declarations, and similar cases—can count as promises, orders, apologies, declarations, or other illocutionary acts, and if so under what conditions.

  The deliverable should be the requirements themselves, with the case or consideration behind each. Cover at least: the paradigm human cases any theory must get right (explicit performatives such as the words used in a marriage ceremony, the naming of a ship, a bequest in a will, and a bet about tomorrow’s rain; and implicit cases such as a one-word order to leave a room); the main varieties of infelicity (an unauthorized person attempting a christening, a promise made without any intention of keeping it, a joke or theatrical use, and a case in which the hearer entirely fails to understand what is being done); and the new algorithmic cases above. Say which distinctions the theory must respect—constative versus performative, explicit versus implicit performative, locutionary versus illocutionary versus perlocutionary, happiness or unhappiness versus truth or falsity, illocutionary force versus propositional content, speaker intention versus conventional procedure, and assertion versus declaration—and which of those distinctions are genuinely load-bearing rather than optional preferences of one school. For each requirement, give the concrete case that motivates it.

  Mark which requirements are non-negotiable for this purpose and which are merely preferences of particular camps; for example, say whether it is a genuine desideratum that no performative be truth-evaluable, or only a preference inherited from an early Austin-style contrast with constatives, and whether a theory must require a speaker with intentions and beliefs or may treat conventional uptake and institutional rule-following as sufficient. Most importantly, flag any pair of desiderata you suspect cannot be jointly satisfied, and explain the conflict: for instance, whether a theory can both require genuine speaker intention for every illocutionary act and also allow a mindless algorithmic publication to be a full declaration, or whether it can both demand that illocutionary categories be mutually exclusive and exhaustive and still accommodate utterances that seem to have more than one force at once.

  If it helps, you may close with at most a short paragraph on how Austin’s early performative/constative account and Searle’s later treatment of declarations each fare against the list; do not write a full scorecard or bibliography, and keep the weight on the criteria rather than the scoring.
reasoning: |-
  We are building a set of desiderata (requirements) for a theory of performative utterances that can adjudicate whether outputs from non-human or semi-automated systems (like chatbots, blockchain declarations, etc.) can count as genuine illocutionary acts (e.g., apologies, declarations, orders). The requirements must cover:

  1. Paradigm human cases (explicit and implicit performatives).
  2. Main varieties of infelicity (cases where performatives go wrong).
  3. New algorithmic cases (chatbot apology, blockchain expulsion).
  4. Key distinctions (which must be respected and which are load-bearing).

  We also need to mark non-negotiable requirements vs. camp preferences and flag any conflicts between desiderata.

  Let's break down:

  ## I. Core Desiderata (Non-Negotiable)

  These are the minimal requirements that any adequate theory must meet to handle the cases at hand.

  ### 1. **Explicit Performatives Must Be Accounted For**  
     **Motivating Case**: The words used in a marriage ceremony (e.g., "I now pronounce you husband and wife" by an authorized person) or the naming of a ship (e.g., "I name this ship the Queen Elizabeth").  
     **Requirement**: The theory must recognize that in explicit performatives, the utterance itself (when produced in the right context) constitutes the act (e.g., marrying, naming). The theory must explain how these work without reducing them to descriptions (constatives).

  ### 2. **Implicit Performatives Must Be Accounted For**  
     **Motivating Case**: A one-word order such as "Leave!" (when issued by an authority in a context where it is understood as an order).  
     **Requirement**: The theory must allow for performative force without explicit performative verbs (like "order", "promise"). It must capture how context and convention can confer illocutionary force.

  ### 3. **Infelicities Must Be Systematized**  
     The theory must account for the ways performatives can go wrong, including:  
     - **Misfires** (when the act is null and void):  
       *Case*: An unauthorized person attempting a christening.  
       *Requirement*: The theory must require conditions (e.g., authority, correct procedure) for the act to be successfully performed.  
     - **Abuses** (when the act is performed but insincere or defective in some way):  
       *Case*: A promise made without any intention of keeping it.  
       *Requirement*: The theory must distinguish between the act being performed (the promise is made) and its abuse (insincerity).  
     - **Misapplications** (when the context is inappropriate, e.g., theatrical or joke):  
       *Case*: Saying "I promise" in a play.  
       *Requirement*: The theory must account for the non-serious or parasitic use of language.  
     - **Failures of Uptake**:  
       *Case*: The hearer entirely fails to understand what is being done (e.g., a command in an unknown language).  
       *Requirement*: The theory must address the role of the hearer's understanding (or lack thereof) in the success of the act.

  ### 4. **Distinction Between Constative and Performative Must Be Respected (as Load-Bearing)**  
     **Motivating Case**: Contrast "I promise to pay you" (performative) with "He promised to pay me" (constative). The former does something; the latter describes.  
     **Requirement**: The theory must maintain that performatives are not truth-evaluable in the same way as constatives. Instead, they are "happy" or "unhappy" (felicitous or infelicitous). This distinction is load-bearing because it underpins the entire idea of an utterance being an action.

  ### 5. **Distinction Between Locutionary, Illocutionary, and Perlocutionary Acts Must Be Respected (Load-Bearing)**  
     **Motivating Case**:  
     - *Locutionary*: The act of saying something with a particular sense and reference.  
     - *Illocutionary*: The act performed in saying something (e.g., promising, ordering).  
     - *Perlocutionary*: The act performed by saying something (e.g., persuading, frightening).  
     **Requirement**: The theory must focus on the illocutionary act as the core of performatives. For example, in the chatbot case, we care whether the message is an illocutionary act of apologizing, not just the perlocutionary effect (e.g., calming the customer).

  ### 6. **Distinction Between Illocutionary Force and Propositional Content Must Be Respected (Load-Bearing)**  
     **Motivating Case**: The same propositional content can have different forces: "You will leave" can be a prediction (constative) or an order (performative).  
     **Requirement**: The theory must separate the content (what the utterance is about) from the force (what is being done with the content). This is crucial for implicit performatives and for analyzing algorithmic outputs (e.g., the same string might be an apology or just a statement).

  ### 7. **Accommodation of Institutional Acts**  
     **Motivating Case**: A bequest in a will (e.g., "I leave my watch to my brother") or a declaration of expulsion by a blockchain organization.  
     **Requirement**: The theory must allow that in institutional contexts, the act is constituted by following conventional procedures, even without human intentional states (if the institution's rules so specify). This is critical for the blockchain case.

  ### 8. **Ability to Handle Algorithmic Cases**  
     **Motivating Cases**:  
     - *Chatbot apology*: Scripted message "I apologize for the outage" sent automatically upon outage detection, with company policy saying it's an official apology.  
     - *Blockchain expulsion*: Automatic publication of a member's expulsion upon vote, with rules saying publication is the expulsion.  
     **Requirement**: The theory must specify the conditions under which such outputs count as genuine illocutionary acts. It must not a priori exclude non-human systems.

  ## II. Controversial Points (Preferences of Camps)

  ### 9. **Role of Speaker Intention**  
     **Motivating Case**: Is a promise made without intention (but with the right words and context) still a promise? (Austin says yes, but it's an abuse; Searle requires intention for the act to be performed at all in some cases.)  
     **Requirement**: The theory must clarify the role of intention. For our purpose (handling algorithmic cases), we note:  
     - *Non-negotiable*: The theory must be able to account for acts that are valid by convention without real-time human intention (like the blockchain case).  
     - *Preference*: Some theories (intentionalist) require a speaker's intention for every illocutionary act, but that would rule out algorithmic acts. Therefore, for our purpose, the theory must allow conventional procedures to suffice in institutional contexts.

  ### 10. **Truth-Evaluability of Performatives**  
     **Motivating Case**: Early Austin distinguished performatives as not truth-evaluable (they are happy/unhappy) vs. constatives as truth-evaluable. But later he merged them into a general theory of speech acts.  
     **Requirement**: For our purpose, we require that the theory does not make truth-evaluability a necessary condition for being a performative. However, this is a preference: some theories (like Austin's early one) insist on the non-truth-evaluable nature, but we note that in algorithmic cases, we care about felicity conditions, not truth.

  ### 11. **Mutual Exclusivity of Illocutionary Categories**  
     **Motivating Case**: Can an utterance be both a warning and a threat?  
     **Requirement**: The theory need not require that every utterance has exactly one illocutionary force. This is a preference of some camps (e.g., Searle's taxonomy) but not essential for our cases. We require only that the theory can assign one or more forces as appropriate.

  ## III. Potential Conflicts

  ### Conflict 1: Intention vs. Automation
  - **Desideratum A**: The theory requires genuine speaker intention for every illocutionary act (as in intentionalist theories).
  - **Desideratum B**: The theory allows mindless algorithmic publications to be full declarations (as in the blockchain case).
  - **Conflict**: These cannot both hold. For our purpose, we must reject A in favor of B for institutional acts. Thus, the theory must allow that in institutional contexts, the act is valid by convention without real-time intention.

  ### Conflict 2: Exhaustiveness and Mutual Exclusivity
  - **Desideratum C**: The theory requires that illocutionary categories are mutually exclusive and exhaustive (so every utterance has exactly one force).
  - **Desideratum D**: The theory must accommodate utterances that seem to have more than one force at once (e.g., "I warn you that if you don't leave, I'll call the police" is both a warning and a threat).
  - **Conflict**: C and D conflict. For our cases, we do not require mutual exclusivity (D is more important for natural language). Thus, we drop C.

  ## Summary of Load-Bearing Distinctions

  The theory must respect:
  - Constative vs. Performative (as fundamentally different kinds of utterances in terms of evaluation: truth/falsity vs. felicity/infelicity).
  - Explicit vs. Implicit performative (both must be accounted for).
  - Locutionary vs. Illocutionary vs. Perlocutionary (focus on illocutionary).
  - Illocutionary force vs. propositional content (to handle implicit cases and ambiguity).
  - Speaker intention vs. conventional procedure (but for our purpose, conventional procedure must be able to suffice in institutional contexts).

  ## How Do Existing Theories Fare? (Briefly)

  - **Austin's early performative/constative account**: It sets up the felicity conditions and infelicities, and the non-truth-evaluable nature of performatives. However, it might struggle with non-human systems because Austin emphasizes the speaker's role and context. Also, he later abandoned the strict performative/constative divide.
  - **Searle's declarations**: Searle's category of declarations (which change the world by representing it as changed, e.g., "You're fired") is institutional and requires conventional procedures. This fits the blockchain case well. But Searle also requires intentionality, which might be a problem for automation (though he allows for institutional acts to be performed by representatives following rules).

  A theory that emphasizes institutional rules and conventional procedures (like Searle on declarations) can handle the algorithmic cases, but must relax the requirement of real-time human intention.
answer: |-
  ### Desiderata for an Adequate Theory of Performative Utterances  
  To adjudicate whether non-human or automated outputs (e.g., chatbots, blockchain declarations) can constitute illocutionary acts (e.g., apologies, declarations, orders), a theory must satisfy the following requirements. **Non-negotiable desiderata** (★) are essential for resolving the specified cases; others reflect camp preferences. Conflicts between desiderata are flagged.  

  ---

  #### **I. Paradigm Human Cases** (Non-negotiable foundations)  
  1. **★ Explicit performatives must be treated as acts, not descriptions.**  
     *Case*: "I now pronounce you husband and wife" in a marriage ceremony. The utterance *is* the act of marrying, not a report.  
     *Requirement*: The theory must distinguish performatives from constatives (descriptive statements), ensuring the former are evaluated by *felicity* (happiness/unhappiness), not truth/falsity.  

  2. **★ Implicit performatives must be recognized without explicit verbs.**  
     *Case*: A one-word command ("Leave!") by an authority in context. The force (order) is clear despite lacking "I order."  
     *Requirement*: The theory must explain how context, convention, and speaker role confer illocutionary force without performative phrasing.  

  3. **★ Distinction between locutionary, illocutionary, and perlocutionary acts must be load-bearing.**  
     *Case*: "I apologize" (illocutionary: act of apologizing) vs. its effect on the hearer (perlocutionary: soothing anger).  
     *Requirement*: The theory must isolate *illocutionary force* (e.g., promising, declaring) as the core of performatives, independent of perlocutionary consequences.  

  ---

  #### **II. Infelicities** (Non-negotiable for validity conditions)  
  4. **★ Misfires (void acts) must require conventional authority and context.**  
     *Case*: An unauthorized person attempting a ship-christening. The act is null due to lack of institutional backing.  
     *Requirement*: The theory must specify procedural conditions (e.g., authority, correct context) for an act to be valid.  

  5. **★ Abuses (defective acts) must separate insincerity from invalidity.**  
     *Case*: A promise made without intent to fulfill ("I promise to pay," said deceitfully). The act *occurs* but is flawed.  
     *Requirement*: The theory must distinguish between *success* (act performed) and *sincerity* (intention to fulfill obligations).  

  6. **★ Non-serious/theatrical uses must not constitute real acts.**  
     *Case*: "I bequeath my watch" uttered on stage; it mimics a will but lacks real-world force.  
     *Requirement*: The theory must exclude parasitic or fictional contexts from genuine performatives.  

  7. **★ Failures of uptake must not always invalidate the act.**  
     *Case*: A command issued to someone who doesn’t understand the language. The act is attempted but may lack effect.  
     *Requirement*: The theory must allow acts to be *successful* even without hearer comprehension if conventional conditions are met.  

  ---

  #### **III. Algorithmic Cases** (Non-negotiable for scope)  
  8. **★ Institutional acts must not require real-time human intention.**  
     *Case*: Blockchain expulsion: Code publishes "Member X is expelled" upon a vote, and rules define publication *as* expulsion.  
     *Requirement*: The theory must permit acts based solely on conventional procedures, even for mindless systems, if institutional rules are satisfied.  

  9. **★ Automated outputs must be evaluable as felicitous/infelicitous.**  
     *Case*: Customer-service chatbot sending "I apologize for the outage" per company policy during outages.  
     *Requirement*: The theory must allow non-human systems to perform acts if:  
     - (a) They follow predefined rules tied to institutional authority (★ non-negotiable),  
     - (b) Contextual conditions (e.g., outage occurrence) are met.  

  10. **★ Distinction between illocutionary force and propositional content must be load-bearing.**  
      *Case*: Algorithmic apology vs. mere description ("The company regrets the outage"). Same content, different forces.  
      *Requirement*: The theory must separate *what* is said (content) from *what is done* (force) to analyze ambiguous outputs.  

  ---

  #### **IV. Key Distinctions: Load-Bearing vs. Optional**  
  - **★ Constative vs. performative**: Load-bearing. Performatives *do* something (apologize, declare), constatives *describe* (e.g., "The chatbot apologized"). Motivated by marriage ceremonies vs. weather reports.  
  - **★ Explicit vs. implicit performative**: Load-bearing. Explicit uses verbs ("I bet"), implicit relies on context ("Leave!"). Necessary for chatbot/blockchain cases, which are explicit.  
  - **★ Illocutionary vs. perlocutionary**: Load-bearing. Illocutionary force (apology) is primary; perlocutionary effect (customer satisfaction) is incidental.  
  - **Happiness vs. truth**: Non-negotiable for performatives (★). Performatives are felicity-evaluated; truth is irrelevant (e.g., insincere apology is unhappy, not false).  
  - **★ Illocutionary force vs. propositional content**: Load-bearing. Critical for analyzing algorithmic outputs (e.g., "expelled" as content; force is declaration).  
  - **Speaker intention vs. conventional procedure**: ★ Non-negotiable compromise. *Conventional procedure suffices for institutional acts* (blockchain), but intention may be required for non-institutional acts (e.g., personal promises).  
  - **Assertion vs. declaration**: Load-bearing. Assertions describe (constative); declarations change reality (e.g., "You’re fired"). Blockchain cases are declarations.  

  ---

  #### **V. Controversial Preferences** (Not universally required)  
  - **Truth-evaluability of performatives**: *Preference* (Austin’s early view). No performative should be truth-evaluable, but later theories (Searle) allow overlap. For our purpose, felicity is primary; truth is irrelevant (★).  
  - **Mutual exclusivity of illocutionary forces**: *Preference* (e.g., Searle’s taxonomy). Not required; utterances can have hybrid forces (e.g., "I warn you: leave!" is both warning and order).  
  - **Intention as necessary for all acts**: *Preference* (intentionalist camps). Conflicts with algorithmic cases (see VII).  

  ---

  #### **VI. Conflicts Between Desiderata**  
  - **Conflict 1: Intention vs. Automation**  
    - *Desideratum A*: "Every illocutionary act requires genuine speaker intention" (intentionalist view).  
    - *Desideratum B*: "Institutional acts (e.g., blockchain expulsion) are valid without real-time human intention" (★ non-negotiable).  
    - *Conflict*: A and B cannot both hold. **Resolution**: For institutional acts (declarations), B overrides A; intention is embedded in design, not execution.  

  - **Conflict 2: Exclusivity vs. Hybrid Forces**  
    - *Desideratum C*: "Illocutionary categories are mutually exclusive" (Searlean preference).  
    - *Desideratum D*: "Utterances may have multiple forces" (e.g., "I bet and promise" in one breath).  
    - *Conflict*: C and D clash. **Resolution**: D is prioritized; exclusivity is not required for adjudicating cases (e.g., algorithmic outputs are typically single-force).  

  ---

  #### **Brief Assessment of Existing Theories**  
  - **Austin’s early view** (performative/constative): Nails infelicities and felicity-over-truth (★) but struggles with non-human systems due to emphasis on speaker context and intention (conflict with algorithmic cases).  
  - **Searle’s declarations**: Best handles institutional acts (e.g., blockchain) via conventional procedures, resolving Desideratum 8. However, Searle’s intention requirement for most acts conflicts with mindless automation unless intention is "institutionalized."  

  **Final Requirement**: A theory must prioritize conventional procedures and institutional context for algorithmic cases while preserving infelicity distinctions for human paradigms.
