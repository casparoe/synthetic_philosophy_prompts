  1. Ellsberg urn: known composition (say, 50 red, 50 blue) vs unknown (100 balls, red and blue in unknown proportion). This tests sensitivity to ambiguity.
  2. Conditioning making the interval wider: e.g., initially you have a range for P(A), then you condition on B and the range for P(A|B) is wider. How do you react?
  3. Two sources: one says 0.4, the other 0.7. What do you do?
  4. Bet at every price inside your range: if your range is [0.3, 0.5], would you accept a bet at 0.35? At 0.4? At every point in the interval?
  5. One-way imprecision: e.g., a drug is not harmful (so P(harm)=0) but you have a wide range for the benefit (say, P(improvement) in [0.2,0.8]).

  We also have the node about what happens when you are imprecise now but certain you'll become sharp after seeing evidence.

