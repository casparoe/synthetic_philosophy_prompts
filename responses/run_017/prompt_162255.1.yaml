prompt: |-
  I'm in a first-year ethics seminar and also volunteering with a student human-rights campaign on campus, and the two keep colliding. Last week we were arguing about whether to add our name to a petition condemning a customary practice — arranged child marriage, in a country none of us are from — and one of the campaign organizers, who's normally the most fired-up person in the room, shut the whole thing down with "that's their culture." Everyone went quiet and we tabled the motion, and I've been annoyed about it since because I cant tell whether she said something deep or something empty. I also can't tell what she thinks follows from it: that the practice isn't wrong, that it might be wrong but we shouldn't say so publicly, that we shouldn't try to stop it, or that we shouldn't even look into it.

  What I want is a precisification menu. Give me the distinct precise claims hiding in "that's their culture," from the boring descriptive one (it's widely accepted there, and the people doing it take themselves to have a reason) all the way up to full-blown relativism (moral truth is indexed to a framework, so there is no verdict available from outside it), and include the ones that aren't really about the practice at all but about us: epistemic humility about local facts we probably don't have, the standing or hypocrisy point (our own society does comparably bad things, so we've got no standing to blame), and the non-interference point (even if it's wrong, outside coercion to stop it is illegitimate or counterproductive). For each reading: state the thesis precisely, mark whether it's a platitude, a substantive and defensible claim, a substantive but shaky one, or something probably false — and, the part I actually care about, say whether it would justify what the organizer used it for, i.e. dropping the campaign, as opposed to weaker moves like changing the wording, handing the campaign to local groups, or keeping it while investigating more.

  Three wrinkles I want handled. First, our TA insisted on seperating judging the practice from judging the people who participate in it, and "they did something wrong" from "they're blameworthy for it," and I suspect that cuts across some readings in a way that matters — some readings might get you "don't blame them" without getting you "don't criticize the practice." Show me where, if so. Second, one of the people pushing hardest for the petition is from that country's diaspora here, and she says "their culture" is being used against her: the people with power over the practice are a subset of the community, and there are local reformers who are asking for exactly this kind of outside criticism. Does that fact defeat any particular reading on the menu? My guess is it wrecks the descriptive reading's rhetorical force but doesn't touch the relativist one, though I'm not confident. Third, my professor floated a test I half-remember: ask yourself whether you'd still think it wrong if your own community did it, and if yes, you were never really a relativist whatever you say. Is that test any good, or does a relativist have a reply?

  Format: one table first, with exactly these columns — reading_name; precise_claim (one or two sentences, no slogans); status (platitude / substantive-and-defensible / substantive-but-shaky / false); licenses_dropping_the_campaign (yes / partly / no); strongest_objection; extra_fact_needed_to_apply_it_here (the empirical thing you'd have to know, e.g. about the practice or about who in that community wants what). Order the rows weakest claim to strongest. Then, after the table, a short JSON object with keys verdict_on_the_slogan, confidence_0_to_100, most_likely_to_be_wrong, would_change_my_mind, and one_question_for_the_organizer. Be explicit about confidence and about which row you're least sure of, and tell me the one argument or consideration that would flip your verdict — I'm bringing this to office hours and I'd rather know where it's likely to break than leave with something that just sounds good.
reasoning: |-
  Hmm, the user is grappling with a complex ethical dilemma in their first-year ethics seminar and human-rights campaign. They're frustrated by someone shutting down a petition against arranged child marriage with "that's their culture" and want a systematic breakdown of what that phrase could mean. They're clearly bright - asking for a "precisification menu" shows they understand conceptual ambiguity.

  Their core request is multifaceted: they want a taxonomy of interpretations ranging from descriptive to normative claims, assessed for validity and practical implications. The three wrinkles add depth - especially the diaspora member's objection which introduces power dynamics within cultures. The professor's "relativism test" shows they're already engaging with meta-ethics.

  Key observations:
  - They're not just seeking answers but tools for analysis (hence requesting objections and "what would change my mind")
  - The TA's distinction between judging practices vs people suggests they've encountered excuses vs justifications debates
  - Their annoyance stems from intellectual discomfort with unresolved ambiguity
  - The diaspora point reveals they sense cultural claims can be weaponized against dissenters

  For the table, I'll structure interpretations from weakest (merely descriptive) to strongest (full relativism), tagging each with:
  1. Epistemic status (e.g., "substantive-but-shaky")
  2. Whether it justifies dropping the campaign
  3. Key objections
  4. Necessary empirical facts

  Special attention needed for:
  - How the blame/practice distinction plays out in different readings
  - Whether diaspora voices invalidate certain claims
  - Testing the professor's relativism litmus test

  The post-table JSON should model intellectual humility - explicitly stating confidence levels and what evidence could shift the analysis. The "one question for organizer" should force clarification of their actual position.

  This case beautifully illustrates why applied ethics is messy: abstract principles collide with political realities, epistemic limitations, and lived experience. The user's frustration is precisely the productive discomfort ethics education should create.
answer: |-
  Here is the precisification menu you requested, followed by the analysis summary:

  ### Precisification Menu: Interpretations of "That's Their Culture"

  | **reading_name**                | **precise_claim**                                                                                                                               | **status**                     | **licenses_dropping_the_campaign** | **strongest_objection**                                                                                                 | **extra_fact_needed_to_apply_it_here**                                                                 |
  | :------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------- | :--------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- |
  | **Descriptive Fact**            | The practice is widely accepted in that society, and participants see themselves as acting for reasons (e.g., tradition, social cohesion).       | Platitude                      | No                                 | Does not imply moral permissibility; merely states social reality.                                                      | Empirical confirmation of the practice’s prevalence and local acceptance.                              |
  | **Epistemic Humility**          | Outsiders lack nuanced understanding of local context, making moral judgments premature or unreliable.                                          | Substantive-and-defensible     | Partly (delays action)             | Local reformers (e.g., diaspora) may provide reliable insight; universal harms (child welfare) may override context.    | Whether credible local dissent exists; severity of harm.                                               |
  | **Standing/Hypocrisy**          | Our society commits comparable harms (e.g., systemic inequality), so we lack moral authority to condemn others.                                | Substantive-but-shaky          | Partly (undermines credibility)    | Does not negate the wrongness of the act; consistency demands self-critique AND external critique.                      | Whether our society has analogous practices; if critics are actively opposing local injustices.         |
  | **Non-Blameworthiness**         | Participants act under social pressure, ignorance, or non-culpable false beliefs, so they aren’t blameworthy *as individuals*.                | Substantive-and-defensible     | **No** (targets actors, not practice) | Distinction: condemning the practice ≠ blaming individuals. Criticism can focus on structures.                          | Degree of coercion/autonomy; access to alternative viewpoints in that society.                         |
  | **Non-Interference (Pragmatic)**| External pressure (e.g., petitions) is counterproductive: it entrenches practices, fuels nationalism, or harms vulnerable groups.              | Substantive-and-defensible     | Yes (if true)                      | Local reformers may *request* external solidarity; harm may justify risk. "Counterproductiveness" is often speculative. | Whether local activists seek international support; evidence of past campaign impacts.                 |
  | **Non-Interference (Principled)**| Outside actors lack legitimate authority to intervene in sovereign communities, regardless of the practice’s morality.                        | Substantive-but-shaky          | Yes                                | Sovereignty isn’t absolute; international human rights norms assert universal jurisdiction over severe harms.           | Whether the state endorses the practice; if it violates ratified treaties.                             |
  | **Cultural Relativism (Weak)**  | Moral truth depends on cultural frameworks; outsiders cannot *objectively* condemn practices endorsed by another culture’s framework.         | Substantive-but-shaky          | Yes                                | Implausible for core harms (e.g., torture); self-defeating (condemns cross-cultural criticism universally).            | Whether the practice has **internal critics** (defeats "endorsement").                                 |
  | **Cultural Relativism (Strong)**| Moral truth is *constituted* by cultural frameworks; "wrong" only means "disapproved by my culture." No trans-cultural moral facts exist.     | False                          | Yes                                | Renders moral disagreement impossible; incompatible with moral progress/reform within cultures.                        | N/A (philosophically self-refuting).                                                                   |

  ### Key Interactions with Your "Wrinkles"
  1. **Blame vs. Practice**: "Non-Blameworthiness" explicitly separates condemning the *practice* (still possible) from blaming *individuals* (may be unjust). Other readings conflate or ignore this.
  2. **Diaspora Objection**:  
     - **Defeats**: Descriptive Fact (if dissent exists), Epistemic Humility (if locals provide insight), Non-Interference-Pragmatic (if locals seek help).  
     - **Doesn’t Defeat**: Relativism (if relativist, diaspora view is just one "framework"), Principled Non-Interference (if sovereignty is absolute).  
  3. **Professor’s Relativism Test**:  
     - **Strength**: Good for exposing *non-relativists* who misuse cultural excuses.  
     - **Relativist Reply**: "If my culture did it, my framework would justify it, so it *wouldn’t* be wrong *for us*." Weak relativists may fail this test; strong relativists embrace the implication.  

  ---

  ### Analysis Summary (JSON Format)
  ```json
  {
    "verdict_on_the_slogan": "Likely a vague appeal to Epistemic Humility or Non-Interference, rhetorically inflated to imply relativism. Functionally used to suppress criticism despite weak justification.",
    "confidence_0_to_100": 85,
    "most_likely_to_be_wrong": "Non-Interference (Pragmatic) — I'm least confident (confidence 60) that external criticism is always counterproductive, given diaspora appeals for solidarity.",
    "would_change_my_mind": "Evidence that: (1) the diaspora activist is unrepresentative of local reformers, OR (2) past campaigns caused measurable harm to at-risk groups.",
    "one_question_for_the_organizer": "When you said 'that's their culture,' did you mean we lack the knowledge to judge, the authority to intervene, or that the practice isn't morally wrong *at all* for them?"
  }
  ```

  ### Why This Structure?
  - **Weakest → Strongest Claims**: Ordered from descriptive (non-normative) to increasingly restrictive normative claims.  
  - **"Partly" Licensing**: Some readings justify *pausing* the campaign for investigation (Epistemic Humility) or *rebranding* (Hypocrisy), not full abandonment.  
  - **Strongest Objections**: Highlight fatal flaws or key counter-evidence (e.g., diaspora voices undercutting epistemic humility).  
  - **Confidence & Flip-Factors**: Focuses debate on empirical unknowns (e.g., local reformer consensus) rather than abstract principles.  

  **Take to Office Hours**: Press the organizer on whether their concern is *knowledge*, *authority*, or *relativism* (your JSON question). If they deny relativism, the campaign likely requires refinement (e.g., centering diaspora voices), not abandonment. The diaspora objection is your strongest counter unless proven unrepresentative.
