  The user's proposed framing - whether there's a standpoint-independent "now" - is actually quite sound. This captures the core metaphysical disagreement without physics complications. I'll build the session around this spine, as it cleanly separates the three positions:
  - Presentism: one privileged "now" (the present)
  - Eternalism: no privileged time (all equally real)
  - Moving spotlight: one shifting "now"

  The End-Permian extinction is perfect as a neutral example. No emotional baggage, familiar to the user, and demonstrates how both theories interpret past events. Crucially, it avoids relativity traps (deep time ≠ relativity) and moral loading (unlike bereavement).

  For structure, I'm thinking:
  1. Start with the extinction to ground the debate (5 mins)
  2. Introduce the "privileged now" question as the core issue (5 mins)
  3. Map the three positions onto this framework (10 mins)
  4. Systematically address predicted misconceptions in sequence:
     - First tackle relativity claims early before they derail discussion
     - Then handle determinism fears (block ≠ fatalism)
     - Next resolve the "durationless present" paradox
     - Finally confront the "verbal quibble" objection
  5. End with a diagnostic question: "Could an omniscient being point to 'now' without us?" to test understanding

  Crucial disclaimers: 
  - Explicitly state relativity isn't being addressed (it's metaphysical)
  - Clarify eternalism ≠ determinism
  - Admit the debate remains unresolved professionally

  The minute-by-minute plan should flow logically from concrete example to abstract framework, preempting misunderstandings at each turn. The closing question will reveal if they grasp the ontological disagreement rather than just memorizing labels.
answer: |-
  Here's a 40-minute plan focusing on your core question and the End-Permian example, structured to build understanding and pre-empt misconceptions:

  **Session Plan: "Is Only the Present Real?"**

  1.  **(0-5 min) Grounding the Question:** Start with the End-Permian extinction (EPE). "We all agree it *happened*. But *is* it real *now*, in the same way this room is real? Or is it just a fact *about* the past? Similarly, is next Tuesday real yet?" Frame the core disagreement: **Does reality include only the present moment, or does it encompass past and future too?** Whiteboard: "Presentism: Only Now is Real" vs "Eternalism (Block): Past, Present, Future are all Real".

  2.  **(5-10 min) Introducing the Core Metaphor - The Privileged 'Now':** "The heart of the disagreement, I suggest, is this: **Is there a single, objective, standpoint-independent fact about which time is 'now'?** Imagine a cosmic timestamp defining 'The Present'." Whiteboard this question prominently. Explain:
      *   **Presentism:** YES! There is exactly one privileged 'Now'. *Only* events happening at that timestamp are real.
      *   **Eternalism (Block):** NO! There is no privileged 'Now'. All timestamps are equally real parts of the block. "Now" is just where *we* happen to be.
      *   **(Briefly) Moving Spotlight:** YES, there *is* one privileged 'Now'... but it *moves* along the timeline, illuminating different parts of the eternal block.

  3.  **(10-20 min) Applying to the EPE & Addressing Key Points:**
      *   *Under Presentism:* The EPE *was* real (when it was 'Now'), but is no longer. It's a fact *about* a vanished reality. Reality is confined to the current, razor-thin 'Now'. **-> Pre-empt "Durationless Instant":** "Yes, defining the 'thickness' of 'Now' is tricky! But the core idea is it's *this* specific slice, however defined, that has unique reality."
      *   *Under Eternalism:* The EPE *is* real – just as real as us sitting here, but located at a different coordinate in spacetime. It's a fixed part of the universe's structure. **-> DEFUSE RELATIVITY ASSERTION EARLY:** "Some argue physics *shows* this via relativity. Hold that thought! Today we're focusing on the *metaphysical* question: *What does it mean for something to be real?* Does relativity *force* eternalism, or just shape *how* we describe the block? That's a separate, complex debate we won't settle today." (Emphasise this is *metaphysics*, not *physics*).

  4.  **(20-30 min) Tackling Major Misconceptions Head-On:**
      *   **Determinism/Fatalism:** "Someone might think eternalism means the future is fixed and our choices don't matter. **Crucially, it doesn't!** Eternalism says future events *are* real parts of the universe's structure *in the same way* the EPE is. But *how* that structure is shaped – whether deterministically or indeterministically – is a separate question. Your choices *are* part of that real structure! Presentism avoids this confusion but faces its own challenges with the past/future."
      *   **"Just Semantics/Verbal Quibble":** "Is this just about the word 'exists'? Partly, yes. But it reflects a deep difference in how we conceive reality's structure. Does reality *change* radically moment-to-moment (Presentism), or is it a vast, unchanging tapestry where 'change' is just our movement through it (Eternalism)? It's about the fundamental nature of existence over time."
      *   **Future Openness:** "Does 'future unreal' (Presentism) *mean* 'future undetermined'? Not necessarily! It could be determined but not yet real. Does 'future real' (Eternalism) *mean* determined? Again, **not necessarily!** Reality and determinism are distinct concepts."

  5.  **(30-38 min) Consolidation & Diagnostic Question:** Reiterate the core: "The disagreement hinges on that privileged 'Now'. *Is* there an objective fact of the matter about which time is 'Now'?" **Put to the group:** "Imagine an omniscient being outside spacetime. Could it *point* to a *single*, objective 'Now' slice of the universe and say 'This one is fundamentally different, *this* alone is real'? Or would it say 'All slices are equally real, "Now" just marks where conscious observers are located'?"
      *   *Confident Wrong Answer:* "Obviously it could point to Tuesday 3pm GMT, that's the real Now!" (Misunderstands standpoint-independence) or "Physics proves it can't!" (Missing the metaphysical point).

  6.  **(38-40 min) Wrap-Up & Explicit Boundaries:** "So, we've seen the core dispute: the status of a privileged 'Now'. We *haven't* settled whether relativity forces eternalism – that's complex physics/philosophy. We *haven't* settled if the universe is deterministic – that's separate. We *haven't* chosen a winner! The debate continues among professionals. I hope you leave pondering *that* specific question: **Is there an objective cosmic 'Now'?**"

  **Why this works for your group & example:**

  *   **Privileged 'Now' Spine:** Your gloss is excellent and central. It cleanly separates the views metaphysically.
  *   **End-Permian:** Ideal. Neutral, grants past reality without demanding *present* reality, avoids simultaneity/clocks, sidesteps emotional/moral loading. Deep time doesn't trivialise the block; it makes the *question* ("Is it real *now*?") stark.
  *   **Misconception Order:** Addresses the physicists' relativity point *early* (but neutrally) before they derail things. Tackles determinism *after* establishing eternalism, as that's when the fear arises. Handles "just semantics" after showing the substantive difference. Separates reality from determinism clearly.
  *   **Diagnostic Question:** Tests grasp of standpoint-independence and the core ontological claim. Wrong answers reveal conflation with physics or observer-relativity.
  *   **Boundaries:** Explicitly sets aside relativity's *implications* and determinism, keeping focus on the metaphysics of "real".
