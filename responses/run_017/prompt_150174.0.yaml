prompt: |-
  hey — I'm on the allocations committee of a small regranting fund (about $3M a year, five of us, we meet Thursdays) and our last decision has turned into an argument about decision theory instead of about grants, so I need a memo I can circulate to the other four before Thursday.

  Two finalists left. A is boring and robust: a cash-transfer scale-up with actual RCT backing, call it 0.24 in the units B's spreadsheet uses, error bars you could drive a truck through but at least they're honest error bars. B wants $600k for an advocacy campaign aimed at a standards-setting process next year, and their entire case is one EV number.

  Here's the bit I need you to actually engage, because it's the crux. B's model bins the outcome space by n = 1,2,3,...: bin n has probability 2^-n and payoff of size 2^n/n, with the sign alternating. The story is that the bigger the campaign's win, the more visible it is, and the visibility provokes a counter-mobilisation that scales with the win — so the big-upside bins are interleaved with comparably-scaled big-downside bins. Summed in descending probability, which is their ordering, the expected value is 1 - 1/2 + 1/3 - ... = ln 2, so their headline number is +0.69. Our volunteer quant re-ran it: two good bins per bad bin gives about 1.04, one good per two bad gives about 0.35, and taking the positive bins first runs off to +infinity. Meanwhile the positive part and the negative part each diverge on their own, so this isn't an expectation we're uncertain about — it's the Pasadena game, there's nothing there to be uncertain about. Their defence is that descending probability isn't an arbitrary convention, it's the ordering their own model hands you, and everyone else is just relabelling bins.

  What I want is a memo, 700-900 words, that (1) gives a bottom line — fund A and drop B, fund both, or fund B under conditions, with a timeline — (2) explains it in terms a smart non-mathy board member can follow without me at a whiteboard, and (3) gives the strongest version of whichever side loses rather than a strawman. The steelman I can't answer is this: at every finite truncation of that series, in the ordering they chose, B beats A — the partial sums dip to 0.5 at worst against A's 0.24 — and it beats A by more the further out you go, so rejecting B looks exactly like refusing to take a fat tail seriously at the point where all the value is supposed to be. If the memo's answer is just "the expectation doesn't exist, so ignore the project," I already get that from the resident skeptic and it doesn't tell us what to do with the money. Same for "it's Pascal's mugging with extra steps, reject the whole application class" — I don't want that either.

  Two more things please. First, a standing rule for the fund we could actually apply next cycle — something a reviewer can run on a spreadsheet, not a seminar — for what to do when an applicant's case rests on a quantity that isn't defined. My own hack is to make applicants report the positive and negative parts separately, and when both blow up, rank by truncated expectation across a fixed range of horizons and require the ranking to be stable across them; tell me if that collapses, and where. Second, a short closing section headed something like "what would change our mind": the specific further analysis that would flip the recommendation, and where you think the memo's own reasoning is most likely to be wrong. Don't cite anything — none of us can check it and it won't help. thx
reasoning: |-
  We are faced with two grant applications: A and B. A is a cash-transfer scale-up with robust RCT evidence, yielding an expected value of 0.24 (in the units of B's spreadsheet) with wide but honest error bars. B is an advocacy campaign asking for $600k, with an expected value claim of 0.69 based on a model that alternates between large positive and negative outcomes with decreasing probabilities.

  The core of the debate is the validity of B's expected value (EV) calculation. Their model assigns to each outcome bin n (for n=1,2,3,...) a probability of 2^{-n} and a payoff of (-1)^{n+1} * (2^n / n) [so that the sign alternates starting positive for n=1]. The series of terms is: for n=1: + (2^1 / 1) * (1/2) = +1, n=2: - (2^2 / 2) * (1/4) = -1, n=3: + (2^3 / 3) * (1/8) ≈ +0.333, n=4: - (2^4 / 4) * (1/16) = -0.25, and so on. The series 1 - 1/2 + 1/3 - 1/4 + ... is the alternating harmonic series, which converges to ln(2) ≈ 0.69.

  However, the series of absolute values is the harmonic series: 1 + 1/2 + 1/3 + ... which diverges. This means that the expectation is not absolutely convergent. In such cases, the order of summation matters. B's model uses descending probability (which is the same as the order of n increasing) and gets 0.69. But if we change the order, we can get any value or even make it diverge. For example, if we take two positive terms for every negative, we get about 1.04; if one positive for every two negative, about 0.35; and if we take all positive terms first, it goes to infinity. This is the Pasadena game problem: the expectation is not well-defined because it depends on the order of summation.

  B argues that descending probability is the natural order because that's how their model is built. But the problem is that without absolute convergence, the expected value is not a reliable guide for decision-making.

  We must decide: fund A, fund B, or fund both? And we need a standing rule for when an applicant's case rests on an undefined quantity.

  ## Bottom Line
  **Fund A and do not fund B in its current form.** However, we should offer B the opportunity to resubmit with a revised model that either (a) truncates the outcome space to a finite set of possibilities (making the expectation well-defined) and recalculates, or (b) provides a different justification that does not rely on an ill-defined expectation. We set a deadline for resubmission in 4 weeks (by [date]) for consideration in the next cycle. If B does not resubmit or the resubmission still relies on an ill-defined expectation, we drop B.

  ## Explanation for Non-Mathy Board Members
  Think of B's model as a list of possible outcomes, each with a size (big win, big loss, medium win, etc.) and a likelihood. The model lists them from most likely to least likely. The most likely outcome (n=1) is a win of a certain size. The next most likely (n=2) is a loss of a similar size. Then a win, then a loss, and so on, with the outcomes getting more extreme (bigger wins and bigger losses) but also less likely.

  The model then calculates an average outcome (expected value) by multiplying each outcome by its likelihood and adding them up. When we add them in the order of most likely to least likely, we get a positive number (0.69). However, there's a problem: the model includes outcomes that are extremely unlikely but have astronomically large wins or losses. If we try to add up all the wins (ignoring losses) we get an infinitely large positive number, and if we add up all the losses we get an infinitely large negative number. This means that the average is very sensitive to the order in which we add them.

  In fact, if we change the order (for example, by taking two wins for every loss, or two losses for every win) we get a different average. This is not just uncertainty about the numbers; it's that the average itself is not well-defined. It's like trying to average a list of numbers that includes both positive and negative infinities: the result depends on how you arrange the list.

  Because of this, we cannot rely on the 0.69 figure. It might be positive, negative, or anything in between depending on how we arrange the outcomes. Therefore, we cannot compare it to A's 0.24.

  Moreover, when we look at the model by stopping at any finite point (say, after the first 10 outcomes) we get a positive number that is higher than 0.24. But this is because we haven't included the very large negative outcomes that are further down the list. So it's not that we are ignoring the big wins; it's that the model itself is not giving us a consistent way to account for both the big wins and the big losses.

  ## Steelman for B
  The strongest argument for funding B is that in any practical truncation of the model (i.e., considering only outcomes up to a certain level of extremeness) the expected value is positive and beats A. For example, if we stop at n=10, the sum is about 0.65 (which is >0.24). Even at n=2, the sum is 0.5, which is still higher than A. Moreover, as we include more terms (n=20, n=100) the sum gets closer to 0.69 and remains above 0.24. Therefore, if we are willing to ignore outcomes that are extremely unlikely (say, with probability less than 1 in a million), then B is clearly better than A. The model is telling us that the risk of catastrophic negative outcomes is so small that we can disregard it, and the positive expected value dominates.

  Additionally, B's model is based on a plausible mechanism: big wins provoke big counter-mobilizations. The alternating pattern is not arbitrary. So the order they use is the natural one. And in that order, the expected value is positive and stable (it converges to 0.69). Therefore, we should trust it.

  ## Why We Reject B's Steelman
  While it is true that for any fixed truncation (ignoring outcomes beyond a certain n) the expected value is positive and beats A, the problem is that the truncation point is arbitrary. The model includes all n, and the full series (without truncation) does not have a well-defined expected value. The fact that we get a positive number when we stop at any finite n is because we are cutting off the large negative terms that are coming later. But if we were to stop at a point where a negative term is last, we might get a lower value. However, in the descending probability order, after any negative term, the next positive term is less probable and of a similar magnitude, so the partial sums do converge to 0.69. But the issue is that the model allows for outcomes of unbounded magnitude, and the expectation is conditionally convergent. This makes it fragile: if the model were slightly changed (for instance, if the probabilities or payoffs were altered in a way that doesn't change the conditional convergence but changes the sum) we might get a different result. Moreover, the real world might not follow the exact ordering of the model. Therefore, we cannot base a decision on an expected value that is not robust to the order of summation.

  ## Standing Rule for Undefined Quantities
  When an applicant's case rests on an expected value (or any summary statistic) that is not well-defined (i.e., the series of absolute values diverges), the following procedure will be applied:

  1. The applicant must report the sum of the positive outcomes (positive part) and the sum of the negative outcomes (negative part) separately, each taken in descending order of absolute impact (or as they model it). If either sum diverges (i.e., exceeds a threshold, say 10 times the grant size, when accumulated over the natural ordering) then the expectation is considered ill-defined.

  2. If the expectation is ill-defined, the application must be evaluated by truncating the outcome space. The applicant must provide the expected value for a series of truncations: for example, including only outcomes with probability greater than 10%, 1%, 0.1%, and 0.01%. 

  3. The committee will then look at the sequence of expected values as we include more extreme outcomes. We require that the sign of the expected value and the ranking against other projects remain stable across at least three orders of magnitude of probability (e.g., from 10% down to 0.01%). If the expected value oscillates or changes sign, the application is rejected. If it stabilizes to a consistent value, that value may be used.

  In this case, for B, if we truncate at n such that the probability is above p, we get:
  - p>0.5: n=1: EV=1
  - p>0.25: n=1,2: EV=1-1=0? Wait, no: 
    n=1: prob 0.5, payoff +2 -> contribution +1
    n=2: prob 0.25, payoff -2 -> contribution -0.5 -> total 0.5
    n=3: prob 0.125, payoff +8/3≈2.67 -> contribution +0.333 -> total ≈0.833
    n=4: prob 0.0625, payoff -4 -> contribution -0.25 -> total ≈0.583
    n=5: +0.2 (approx) -> total 0.783
    n=6: -0.1667 -> total 0.616

  The partial sums oscillate and converge to ln(2)≈0.69. But note that at every even n the sum is less than at odd n. However, the value is always positive and above 0.5 for n>=2. So it is stable in sign and above 0.24. But the problem is that the truncation is arbitrary. The standing rule would require stability across different truncation points. Here, the expected value is always positive and above 0.24 for any truncation beyond n=1. So by the standing rule, it would pass? But note: the standing rule also requires that the positive and negative parts are finite when truncated? Actually, we are truncating by n, so we are including all bins up to N. The positive part up to N is the sum of the positive terms in 1..N, which grows without bound (like the harmonic series) and similarly for the negative part. So at truncation level N, the positive part is about (1/2) * H_{floor((N+1)/2)} (where H is the harmonic number) and similarly for the negative part. Both grow without bound as N increases, but their difference converges. The standing rule in step 1 would flag that both the positive and negative parts diverge as N increases. Therefore, we would reject the model.

  Alternatively, we can interpret the standing rule as requiring that the truncated expected values (with a fixed truncation, say at a probability threshold) converge to a finite number as we lower the threshold. But in this case, they do. However, step 1 is the key: if the positive part and the negative part (without truncation) both blow up, then we consider the expectation ill-defined. Then we move to step 2 and 3. But step 3 requires stability. Here, the truncated EV is always positive and above 0.24 for any truncation beyond the first few. So it is stable. But note: the standing rule says to reject if the sign oscillates. It doesn't. So we have a conflict between step 1 (which says it's ill-defined) and step 3 (which says it's stable). 

  We resolve this by: if step 1 (divergence of the absolute series) holds, then we require step 3 to show stability. But if the truncated EV is stable in sign and magnitude, we accept it. However, in this case, the model includes outcomes with arbitrarily large impacts, which is unrealistic. Therefore, we should also require that the outcomes are bounded in a reasonable way. 

  Thus, we amend the standing rule:

  - If the expectation is ill-defined (by step 1: the absolute series diverges), then the application must be rejected unless the applicant can justify a finite bound on the outcomes (i.e., the real-world outcomes cannot be arbitrarily large). If a bound is justified, then the expectation becomes well-defined (by truncating at that bound) and we use that. If not, then we require the truncated expected values (by probability) to be stable and the applicant must also show that the results are robust to the inclusion of a bound (i.e., if we set a bound at a very large impact, the EV doesn't change much).

  In B's case, they have not justified that the outcomes are bounded. In reality, there are physical and social limits. But the model does not incorporate them. Therefore, we reject.

  ## What Would Change Our Mind
  **Further analysis that could flip the recommendation:**
  1. If B can provide a realistic bound on the maximum possible impact (positive or negative) of their campaign, then recalculating the expected value with that bound would make the expectation well-defined. For example, if they argue that the impact cannot exceed, say, $10 billion in value (in our units) then we can truncate the series at that point and get a finite expected value. If that value is still above 0.24, we would fund B (if it is also above our funding threshold).

  2. Alternatively, if B can restructure their model so that the absolute impacts do not grow without bound (for example, by having the payoff grow slower than exponentially with n) then the series might become absolutely convergent. For instance, if the payoff in bin n were 2^{n/2}/n (so that the absolute value grows as sqrt(2)^n) then the absolute series would converge (since it's geometric with ratio 1/sqrt(2)<1). Then the expectation would be well-defined and we could accept it.

  **Where the memo's reasoning might be wrong:**
  The memo assumes that the order of summation matters in a way that makes the model invalid. But if the descending probability order is the only natural order (because the model is built to generate outcomes in that order) then it might be valid. However, the model does not account for the fact that the real-world process might not follow this ordering. The memo also dismisses the truncation argument too quickly. If we are only willing to consider outcomes with probability above, say, 1e-6, then the expected value is positive and the model is effectively bounded. But the committee must decide on a reasonable probability threshold for considering outcomes. The memo's standing rule requires a bound on the outcomes, but it might be too strict. If the probability of extreme outcomes decays fast enough, then even though the model has unbounded outcomes, the practical expected value might be finite. However, in this model, the decay is exponential and the growth is exponential, so they cancel to create conditionally convergent behavior. We are uncomfortable with conditionally convergent expectations because they are not robust.

  ## Final Decision
  We recommend funding A and giving B the opportunity to resubmit with a model that includes a realistic bound on outcomes or restructures the payoffs to ensure absolute convergence. The standing rule we propose will help us handle similar cases in the future. We look forward to discussing this on Thursday.
answer: |-
  **MEMORANDUM**  
  **TO:** Allocations Committee  
  **FROM:** [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Grant Finalists A and B  

  ### Bottom Line  
  **Fund Grant A and conditionally defer Grant B.** Allocate the full requested amount to A immediately. Do not fund B in its current form, but invite B to resubmit within **four weeks** (by [Date + 4 weeks]) with a revised model that either:  
  1. Bounds outcomes to realistic limits (e.g., no infinite impacts), OR  
  2. Replaces the flawed expected-value calculation with a robust alternative (e.g., sensitivity-tested truncated outcomes).  
  If B’s resubmission fails these criteria, drop B permanently. If it succeeds, fast-track it for the next funding cycle.  

  ---

  ### Why This Decision? (Plain-Language Explanation)  
  We face two projects:  
  - **Grant A** is a cash-transfer program. Its expected value is **0.24**, backed by real-world trials. The results are reliable, even if uncertain.  
  - **Grant B** is an advocacy campaign claiming an expected value of **0.69**, based on a mathematical model. The model predicts outcomes that alternate between huge wins and huge losses, with probabilities decreasing as impacts grow.  

  **The problem with B’s model:**  
  - B’s calculation relies on adding up *infinitely many* hypothetical outcomes: some astronomically positive (e.g., "massive policy win"), others catastrophically negative (e.g., "severe backlash"), each increasingly unlikely.  
  - Mathematically, the sum of these outcomes **does not settle on a single number**. Depending on how you group the wins and losses, the result can be wildly different:  
    - B’s preferred order yields **+0.69**.  
    - Other plausible orders yield **+1.04**, **+0.35**, or even **infinity**.  
  - This is not just "uncertainty." It’s a fundamental flaw: **the model’s "expected value" doesn’t actually exist** as a stable guide for decisions. It’s like dividing zero by zero—no matter how you slice it, the answer is ambiguous.  

  **Why we can’t ignore this:**  
  - B argues that *any* reasonable stopping point in their model beats A (e.g., stopping after 10 scenarios gives +0.65 > 0.24). This is their strongest point: it *seems* like rejecting B is ignoring big potential wins.  
  - **But:** The model’s unbounded extremes (infinite wins/losses) are unrealistic. In practice, no campaign has limitless impacts. More critically, the calculation’s fragility means tiny changes in assumptions—or real-world events—could flip the result from highly positive to highly negative. We cannot gamble on a number that isn’t mathematically coherent.  

  **A is the responsible choice:**  
  - A offers proven, if modest, benefits.  
  - B’s proposal is innovative but mathematically unanchored. Funding it as-is would set a precedent allowing grantees to "game" our process with divergent models.  

  ---

  ### Steelman of B’s Case (Why We Might Be Wrong)  
  B’s advocates make a compelling argument:  
  > "Our model’s descending-probability order isn’t arbitrary—it reflects real-world causality. Big wins *do* provoke counter-mobilizations; the alternating pattern captures this. At every practical stopping point (e.g., considering outcomes down to one-in-a-million odds), B beats A convincingly (+0.65 > 0.24). Rejecting B because ‘the infinite tail breaks the math’ ignores the *actual* value here. It’s like refusing a loan because someone *might* win the lottery and refuse repayment, even though repayment is likely. If we only fund ‘safe’ projects like A, we miss high-impact opportunities where the upside dominates in plausible scenarios."  

  This is a serious challenge. If we believe B’s probabilities and impacts are roughly correct *and_ that extreme outcomes are irrelevant in practice, B likely dominates A.  

  ---

  ### Proposed Standing Rule for Undefined Quantities  
  When an applicant’s case relies on a summary metric (e.g., expected value) that isn’t mathematically well-defined:  
  1. **Require separate reporting of "positive tail" and "negative tail" impacts.** If either tail sums to infinity (or exceeds 10× the grant size in absolute value), the metric is invalid.  
  2. **Test stability via truncated horizons:**  
     - Calculate expected value over *finite* outcome sets: e.g., top 90%, 99%, 99.9% of probability mass.  
     - **Reject the application** if:  
       - The sign (positive/negative) flips across truncation levels, OR  
       - The value swings wildly (e.g., >50% change between 99% and 99.9% truncation).  
  3. **Permit approval only if:**  
       - Impacts are bounded (applicant must justify realistic limits), AND  
       - The truncated expectation is stable/sign-consistent across horizons.  

  *Why this works for B:*  
  - B’s positive/negative tails both explode (→ invalid metric).  
  - Truncated expectations *are* stable (+0.65 at 99.99% truncation), but the unbounded impacts fail Step 1. B must add bounds to qualify.  

  ---

  ### What Would Change Our Mind?  
  **Evidence that could flip the decision to fund B:**  
  1. **Bounding the unbounded:** If B demonstrates that real-world impacts *cannot_ exceed a plausible limit (e.g., "No policy win can increase funding by >$1B due to budget caps"), recalculating the model with this cap may yield a robust, stable EV. If that EV exceeds A’s 0.24, fund B.  
  2. **Empirical validation of the alternation:** If B provides data from similar campaigns showing that wins/losses alternate as predicted *and_ extreme outcomes decay fast (e.g., no >100× impacts), we might accept high-truncation (>99.9%) EVs.  

  **Where this memo’s reasoning is most vulnerable:**  
  - **Over-rigor?** We penalize B for mathematical infinity in a finite world. If all *practical_ truncations favor B, refusing to fund based on "nonexistent EV" may be pedantic.  
  - **Underestimating tail wins:** If B’s "big win" scenarios are more probable than modeled (e.g., if political dynamics favor their campaign), truncating too aggressively could miss transformative impact.  
  - **A’s hidden flaws:** A’s "robust" RCT may not generalize to our context (e.g., if local implementation is weak).  

  ---

  ### Conclusion  
  Grant A delivers reliable, evidence-based value. Grant B’s ambition is commendable, but its core metric is mathematically incoherent and invites arbitrariness. By funding A and requiring B to bound their model, we balance impact, rigor, and ethical stewardship. **Vote: Fund A, defer B pending resubmission.**  

  ---  
  **Prepared for discussion on Thursday.** Direct questions to [Your Name/Contact].
