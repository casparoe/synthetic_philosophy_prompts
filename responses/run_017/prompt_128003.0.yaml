answer: |-
  ### Interview Questions for Dr. Naomi Reinholt  

  #### **Question 1: Sources of Reversal**  
  **Q:** You note that reversals stem from two distinct sources: confounding due to treatment imbalance across strata and non-collapsibility of effect measures like the odds ratio. But since risk differences only reverse under imbalance, isn’t the reversal a clear diagnostic signal of confounding? And doesn’t that reduce non-collapsibility to a flaw in the odds ratio—not a second paradox?  
  **Anticipated Answer:** Non-collapsibility is a mathematical property of non-additive measures; it becomes paradoxical only when misinterpreted as confounding. Reversals in risk differences always signal confounding, but non-collapsibility isn’t "flawed"—it’s a reminder to choose effect measures that align with the causal question.  
  *Confidence: High*  
  **Follow-up:** If non-collapsibility isn’t a paradox, just a mathematical artifact, why do textbooks present it alongside confounding under the same "Simpson’s paradox" label? Should we abandon the term for non-collapsibility cases?  

  #### **Question 2: Validity of the Pooled Estimate**  
  **Q:** You argue the pooled estimate isn’t "corrupted" but targets a different estimand. Yet in practice, is the crude comparison *ever* the right answer for a causal effect? Or is it always inferior to standardization for the actual population?  
  **Anticipated Answer:** The pooled estimate is valid only if the question is purely associational (e.g., "What is the observed association in this aggregated dataset?"). For causal effects, standardization dominates because it explicitly targets the marginal effect in a defined population.  
  *Confidence: Medium*  
  **Follow-up:** If both pooled and stratified estimates answer different causal questions, is the real error failing to pre-specify the estimand—making *both* tables misleading when used uncritically?  

  #### **Question 3a: On-Screen Example (Baseline Frailty)**  
  **Q:** In our example, with frailty measured at admission, the stratified analysis shows the program is superior within strata. Here, the reversal arises from confounding. What does your framework add beyond "draw the graph" to justify preferring stratification?  
  **Anticipated Answer:** Confirming frailty is a pre-treatment confounder licenses stratification to estimate the average treatment effect. The framework forces explicitness: the estimand is the effect conditional on frailty, and the graph encodes this assumption.  
  *Confidence: High*  
  **Follow-up:** But if the data show imbalance (e.g., more frail patients in the program), doesn’t that empirically support the need for stratification, even without the graph?  

  #### **Question 3b: On-Screen Example (Post-Discharge Frailty)**  
  **Q:** Now suppose frailty is partly shaped by a post-discharge variable the program influences. Here, stratification seems misleading. Since the data tables are identical in both cases, can any statistical test (e.g., conditional independencies) distinguish which scenario we’re in?  
  **Anticipated Answer:** No—the data alone cannot discriminate. This is why causal assumptions are essential: the graph determines whether frailty is a confounder (adjust) or a mediator (do not adjust). Statistical tests only reflect associations, not causal roles.  
  *Confidence: High*  
  **Follow-up:** If data patterns can’t resolve this, doesn’t your framework collapse to "just draw the graph," leaving statisticians reliant on untestable assumptions?  

  #### **Question 4: Shrinkage in Estimation**  
  **Q:** When strata are thin (e.g., frailty × site × year), we shrink stratum-specific effects toward the pooled estimate. If you endorse shrinkage, aren’t you tacitly treating the pooled figure as evidence about stratum-specific effects?  
  **Anticipated Answer:** Shrinkage borrows strength *across* strata to improve precision but targets stratum-specific estimands. The pooled estimate serves as a prior, not an unbiased estimate—it’s a tool for regularization, not truth.  
  *Confidence: Medium*  
  **Follow-up:** But if the pooled estimate is biased by confounding, doesn’t shrinkage amplify that bias? How is this different from misusing the pooled estimate?  

  #### **Question 5a: Decision Theory (Known Frailty)**  
  **Q:** A clinician learns a patient’s frailty and prefers the program for both robust and frail cases. Yet marginally, a random patient does worse under the program. Is this resolved by the causal sure-thing principle?  
  **Anticipated Answer:** Exactly. The sure-thing principle says if treatment is preferred conditional on all pre-decision variables, it should be preferred unconditionally. The marginal disrepancy reflects selection bias, not a true effect reversal.  
  *Confidence: High*  
  **Follow-up:** Doesn’t this imply the paradox vanishes once we clarify the decision context?  

  #### **Question 5b: Decision Theory (Unknown Frailty)**  
  **Q:** Now suppose frailty is unknown when deciding. Here, the marginal effect suggests avoiding the program. How does your framework reconcile this with the stratum-specific preferences?  
  **Anticipated Answer:** The relevant estimand changes: without frailty, we need the marginal effect in the target population. The paradox dissolves because the question shifted—we’re now asking about a different quantity.  
  *Confidence: High*  
  **Follow-up:** But if the marginal effect is negative due to confounding, isn’t it still the wrong answer for decision-making? Shouldn’t we use g-computation to standardize?  

  #### **Question 6: Causal Level (Berkeley Admissions)**  
  **Q:** In the Berkeley case, adjusting for department eliminates gender bias in admissions. But if department sorting is itself discriminatory, does conditioning silently dismiss that pathway?  
  **Anticipated Answer:** Yes—conditioning encodes a normative choice. To measure total discrimination, include sorting; for direct discrimination in admissions, adjust for department. The "right" estimand depends on the policy goal.  
  *Confidence: High*  
  **Follow-up:** So your framework doesn’t resolve disputes about what pathways "count" as bias—it just makes the normative stakes explicit?  

  #### **Question 7: Lord’s Paradox**  
  **Q:** Lord’s paradox lacks reversals but yields opposing conclusions when adjusting for baseline vs. ignoring it. Is this Simpson’s paradox in disguise, or a distinct phenomenon?  
  **Anticipated Answer:** Distinct. Lord’s paradox arises from conflating total and direct effects (e.g., adjusting for a post-treatment mediator). Simpson’s involves reversal of associations; both highlight estimand ambiguity but differ mechanistically.  
  *Confidence: Medium*  
  **Follow-up:** Since both reduce to "specify the estimand," should we group them under a broader umbrella of *causal ambiguity*?  

  #### **Question 8: Counterevidence to Your View**  
  **Q:** What finding would make you concede that a reversal *is* paradoxical—say, a case where specifying the estimand *and* causal structure still yields conflicting answers?  
  **Anticipated Answer:** No such case exists. Mathematics ensures consistency once estimands and causal assumptions are fixed. "Paradox" only persists when these are underspecified.  
  *Confidence: Low*  
  **Follow-up:** If your view is unfalsifiable, is it more a philosophy than a testable claim?  

  ---

  ### Calibration Note  
  **Least Confident Question:** Question 8 ("Counterevidence"). It assumes she would reject *any* empirical challenge as a specification error. This might misrepresent her willingness to engage with hypothetical contradictions. Her writings suggest she sees the paradox as *always* resolvable by specification, but I’m less confident she’d dismiss a cleverly constructed edge case.  

  **Empirical Check for On-Screen Example:**  
  - **Frailty Timing:** Ensure the post-discharge variable (recorded at day 7) is not a collider (e.g., influenced by both frailty and readmission). If the program affects this variable, it might induce bias if conditioned upon.  
  - **Number Consistency:** Verify that the frail subgroup’s readmission rate under usual care (31.8%) is indeed higher than the program’s (30.0%)—small differences could weaken the example’s impact.
