prompt: |-
  For the next episode of *The Third Variable*, a podcast about how quantitative evidence makes its way into medicine and public policy, I'm recording an hour with Dr. Naomi Reinholt, a statistician whose recent essays argue that "Simpson's paradox" is a misnomer. On her view, no arithmetical reversal is ever paradoxical, because a reversal is a property of a table *together with* a question: until you fix a causal structure and a target population, "which table is right?" has no determinate answer. She also holds that the pooled figure is not a corrupted version of the truth but an estimate of a different and much less often wanted quantity, and that once you say what you want — an effect in which population, conditioning on what — the paradox evaporates and only estimation difficulty remains. In conversation she tends to fend off pressure with some variant of "that's a question about the estimand, not about the data," and I'd like to be ready for that move rather than bowled over by it.

  I'll have one worked example on screen (we record video). A hospital network runs an optional post-discharge "Transitions" program; the outcome is readmission within thirty days. Program patients: 600 in total, 156 readmitted (26.0%) — comprising 120 "robust" patients with 12 readmissions (10.0%) and 480 "frail" patients with 144 readmissions (30.0%). Usual care: 1,100 in total, 202 readmitted (18.4%) — comprising 880 robust with 132 readmissions (15.0%) and 220 frail with 70 readmissions (31.8%). So the program looks better within each frailty stratum and worse overall. I want to run the example twice: once with the frailty score computed at admission, and once with the score partly determined by a variable recorded seven days after discharge that the program itself encourages.

  Please draft eight to ten questions, each with the answer you expect her to give and a follow-up keyed to that answer. Assume she is sharp, that she won't accept being asked to restate her own view, and that no question should be a warm-up. I'd like coverage of at least the following:

  - The claim that textbooks conflate two sources of reversal — genuine imbalance in who received the program, and the non-collapsibility of the odds ratio, which can put a marginal association outside the range of the stratum-specific ones even under randomization. If reversals in *risk differences* can only arise when treatment prevalence differs across strata, doesn't that restore the reversal as a diagnostic signal, and does she want to say the second "source" is really just a bad effect measure rather than a second paradox?
  - Whether the crude pooled comparison is ever the right answer at all, or whether it is always dominated by a standardized estimate of the marginal effect in the population actually at hand — i.e., whether the honest moral is that *both* tables are usually mis-specified estimates of distinct well-defined quantities.
  - The two versions of my on-screen example: if the stratified comparison is correct when frailty is a baseline variable and misleading when the score is partly downstream of the program, and if no amount of staring at the numbers tells you which case you're in, what content is left in her framework beyond a reminder to draw the graph — and can any pattern of conditional independencies in the data discriminate between the two graphs?
  - Estimation rather than identification: once I cross frailty by site and year I have a few dozen thin strata, and any sensible estimator shrinks the stratum-specific effects toward the pooled value. If she endorses shrinkage, isn't she treating the pooled figure as evidence after all?
  - The decision-theoretic form of the puzzle. I will learn my patient's frailty before deciding, and in each case I prefer the program; yet a randomly chosen patient does worse under it. Is this resolved by the sure-thing principle read causally, or simply by noting that I am not choosing for a random patient? And then the harder case: what if the frailty score arrives *after* the decision must be made?
  - The choice of level at which the causal question is posed, using the well-known 1970s Berkeley admissions data: if the department-level table dissolves the appearance of bias, is that the right thing to tell a university president, given that the sorting of applicants across departments may itself be part of what one wanted to measure? Does her framework silently encode a normative choice about which pathway counts?
  - Whether the same dissolution covers Lord's paradox, where there is no reversal but two statisticians reach opposite answers — is this one phenomenon or a family?
  - One closing question about what could count against her framing: what finding, or what kind of case, would make her stop saying that there is no paradox here.

  After each anticipated answer, mark how confident you are — high, medium, or low — that she would in fact answer that way, in one clause. Finish with a short calibration note: name the single question you are least confident is fair to her actual commitments, say which assumption of yours it rests on, and flag anything empirically doubtful in my on-screen example that I should check before we record.
