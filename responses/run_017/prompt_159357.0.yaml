prompt: |-
  I'm a PhD student TAing a first-year metaphysics module, and next week's tutorial is on identity — specifically the bit where we get to Max Black's two-spheres argument against the Leibnizian principle and half the room says obviously there are two spheres, the other half says obviously there can't be, and then we run out of things to say by minute ten. What I want is a sorting quiz I can hand out: eight to ten questions, each a concrete little case with two or three answer options, plus a scoring key at the back that maps answer patterns onto the actual positions, so students get sorted by what they say about cases rather than by which label they fancy. No reading lists or citations, I already have those.

  The rules I care about: no question may use the vocabulary of the debate — no naming the principle, no talk of thisness or haecceities, no bundles or substrata, no discernibility talk, and definitely no straight-out "do you accept it?" Each question should be a case someone could answer in five seconds without having done the reading. And I don't want the usual cases recycled. Here are the ones I want used. (1) A universe containing nothing but two exactly similar iron spheres — crucially, no landmarks, nothing else in it, and the total state of the whole universe is completely unchanged if you swap them. (2) A third sphere, slightly dented, exists alongside them for a while and is then destroyed: is the world now like the first one again, or has something stuck to the two survivors? (3) The two spheres slowly orbit and exchange places: when the swap is finished, is the sphere now on the left the one that started on the left? (4) A universe with nothing in it but two mirror-image hands. (5) Two electrons in a set-up where every measurable quantity comes out symmetric between them, and a question about how many things there are in the box. Put (5) last, and tell me whether it needs its own branch or whether answers to (1)–(4) already settle it.

  Then the taxonomy half: build the tree from the questions and the combinations of answers they allow, and only afterwards locate the real positions in that space — at minimum a leaf for people who think the spheres are told apart by trivial identity-involving properties (with variants for allowing that but refusing to count it, and for counting it but holding it makes the principle vacuous), a leaf for people who think an irreflexive symmetric relation like being a mile from the other one does the discerning even though both spheres satisfy it, a leaf for people who think the numerical difference is just brute, a leaf for people who think there are two of them but no fact of the matter which is which, and leaves for whatever the bundle-of-properties and bare-substratum options turn into down at the bottom. Give each leaf its usual name if it has one; otherwise write "unnamed" and say in one sentence why nobody sits there — incoherent, unattractive, or just unexplored. Flag any pair of leaves my questions can't actually seperate, and tell me which questions end up doing no real work because the disagreement at that node is verbal (my guess is that a lot of it hides in what counts as a property, but show me if it's somewhere else). Finally: which branch does the real disagreement live on? I want to know what to spend the second half of the tutorial arguing about.
reasoning: |-
  Okay, let me tackle this TA's request. They're teaching a metaphysics tutorial on identity, specifically Max Black's two spheres argument against the Leibnizian principle. The problem is students get stuck in a binary debate and run out of discussion quickly. They want a sorting quiz with concrete cases—no jargon, no recycled examples—to categorize student positions based on intuitive answers. 

  First, I need to understand the core challenge. The two spheres scenario creates a philosophical impasse because it forces a confrontation between numerical identity and qualitative indiscernibility. The TA wants to bypass surface disagreements by mapping answers to underlying metaphysical commitments. The quiz must avoid all technical terms ("haecceities," "discernibility") and use only novel, concrete cases they've specified: (1) two identical spheres in empty universe, (2) adding/destroying a dented sphere, (3) orbiting swap, (4) mirror hands, and (5) symmetric electrons. 

  For question design, each case needs to test intuitions about identity without leading questions. For example:  
  - Case 1: "If universe has two identical spheres and nothing else, how many things exist?" (Options: One sphere twice? Two spheres? The question is ill-formed?)  
  - Case 2: After a dented sphere is destroyed, "Is this universe identical to the original two-sphere universe?" (Yes/No)  
  The options must feel obvious to answer quickly but reveal implicit assumptions.  

  Now structuring the taxonomy. The answer combinations should sort students into branches like:  
  - **Brute Distinction**: Believes spheres are distinct just because they are two, regardless of properties.  
  - **Spatial Relationists**: Thinks "being left of the other" discerns them, even if symmetric.  
  - **Identity-Property Trivialists**: Accepts "being sphere A" as a property but debates if it counts.  
  I need to ensure questions disambiguate these. For instance, Case 3 (orbiting swap) tests if spatial history matters—if someone says "it's the same sphere" after swap, they likely reject brute distinctness.  

  Handling edge cases: Case 4 (mirror hands) might trip up those who think chirality is intrinsic, while Case 5 (electrons) could merge with prior answers or split further depending on whether quantum indistinguishability changes things. The TA asked if (5) needs its own branch—probably not, as electron answers should align with sphere answers unless someone inconsistently applies criteria.  

  Key pitfalls:  
  - Avoid verbal disputes (e.g., "what counts as a property?"). Questions shouldn't let students wiggle out via definitions.  
  - Flag unresolvable disagreements early (e.g., between bundle theorists and substratum fans might collapse if both answer identically to cases).  
  - Identify the core debate: Likely whether numerical distinctness requires qualitative difference. That's where tutorial time should focus—probing why some think spatial relations suffice while others demand brute facts.  

  Finally, scoring must be mechanical. If a student answers "two things exist" in Case 1 but "no difference after swap" in Case 3, they land in "brute non-qualitative distinctness" (haecceitism). The answer key will map patterns to positions like a decision tree.  

  This approach should transform "obviously two!" vs. "obviously can't be!" into structured exploration of why intuitions diverge—which is the whole point.
answer: |-
  Here’s a sorting quiz designed to map student intuitions onto metaphysical positions about identity in Max Black-style scenarios. Each question avoids technical vocabulary and uses concrete cases. The scoring key reveals hidden commitments and flags where the real debate lies.

  ---

  ### **QUIZ: How Many Things Are There?**  
  *Answer intuitively—no overthinking! Circle one option per question.*

  1. **Empty Universe + Two Spheres**  
     A universe contains *only* two perfect iron spheres. They’re identical in every way (size, material, temperature, etc.), and nothing else exists—no space, no landmarks.  
     *(a) There are two spheres*  
     *(b) There’s only one sphere "repeated"*  
     *(c) The question is broken—this universe is impossible*  

  2. **Adding/Destroying a Dented Sphere**  
     Start with the two identical spheres from Q1. A third sphere—identical but with a tiny dent—appears briefly, then vanishes. The dented sphere never touched the others.  
     *(a) After it vanishes, everything is exactly like the start of Q1*  
     *(b) Vanishing the dented sphere changed something permanent*  

  3. **Orbiting Swap**  
     The two identical spheres slowly orbit each other until they swap places. After the swap:  
     *(a) The sphere now on the left is the one that started on the left*  
     *(b) The sphere now on the left is the one that started on the right*  
     *(c) There’s no fact about which is which*  

  4. **Mirror Hands**  
     A universe contains *only* two identical hands: one left hand, one right hand (mirror images). Nothing else exists.  
     *(a) There are two hands*  
     *(b) There’s only one hand-type, repeated*  
     *(c) This setup is impossible*  

  5. **Two Electrons**  
     A box contains two electrons. Every measurable property (charge, spin, position probability) is symmetric—no experiment could distinguish them.  
     *(a) There are two electrons*  
     *(b) There is one electron "smeared" in two places*  
     *(c) The question is unanswerable*  

  ---

  ### **SCORING KEY & TAXONOMY**  
  **How to use:** Match your answer pattern to the branches below. Positions are sorted by *underlying commitments*, not self-labels.  

  #### **Branch 1: Q1(a), Q2(a), Q3(c), Q4(a), Q5(a)**  
  → **Position:** *Brute Numerical Distinctness* ("Haecceitism")  
     - Spheres are two distinct things simply because they are two. Swapping them changes nothing (Q3c). The dented sphere leaves no trace (Q2a) because distinctness isn’t grounded in properties.  
     - *Real disagreement target:* Are "bare identities" coherent?  

  #### **Branch 2: Q1(a), Q2(b), Q3(a) or (b), Q4(a), Q5(a)**  
  → **Position:** *Spatial Relations Discern* ("Moderate Relationism")  
     - Spheres are distinct because they stand in spatial relations (e.g., "left of the other"). Swapping matters (Q3a/b), and the dented sphere’s brief existence "breaks symmetry" permanently (Q2b).  
     - *Flag:* Q3a vs. Q3b is verbal (depends on labeling conventions).  

  #### **Branch 3: Q1(b) or (c), Q2(a) or (b), Q3(c), Q4(b) or (c), Q5(b) or (c)**  
  → **Position:** *Bundle Theory / Anti-Primitive Identity*  
     - Only qualitative properties exist. Identical spheres are "one thing repeated" (Q1b) or the scenario is incoherent (Q1c). Mirror hands fail (Q4b/c) due to chirality’s relational nature.  
     - *Sub-branches:*  
       - **Q1(c)/Q4(c):** *Eliminativism* (unnamed; rejects objects without unique properties).  
       - **Q1(b)/Q4(b):** *One-Object Realism* (unnamed; counts types, not tokens).  

  #### **Branch 4: Q1(a), Q2(a), Q3(a) or (b), Q4(a), Q5(a)**  
  → **Position:** *Trivial Identity Properties* ("Haecceity Lite")  
     - Spheres are distinct and have identity-dependent properties (e.g., "being sphere A"). Swapping is detectable (Q3a/b), but the dented sphere doesn’t alter identities (Q2a).  
     - *Disagreement with Branch 1:* Is "being sphere A" a legitimate property?  

  #### **Branch 5: Q1(a), Q2(a), Q3(c), Q4(a), Q5(b) or (c)**  
  → **Position:** *Quantum Abstractionism* (unnamed)  
     - Accepts classical objects (spheres) as distinct but denies quantum particles (electrons) can be counted (Q5b/c). Rare and unstable—collapses under pressure.  

  ---

  ### **META-ANALYSIS FOR THE TA**  
  - **The core debate** is between **Branch 1 (Brute Distinctness)** and **Branch 3 (Bundle Theory)**. Focus tutorial time here:  
    - *Key question:* Can two objects differ *only* numerically?  
    - *Test case:* Use Q1 to force the divide. Branch 1 insists "obviously two"; Branch 3 calls it "incoherent."  

  - **Verbal Disputes:**  
    - Q3’s (a) vs. (b) is purely semantic (labeling conventions).  
    - "What counts as a property?" hides under Q1/Q4 answers. Bundle theorists (Branch 3) reject spatial relations as intrinsic; relationists (Branch 2) embrace them.  

  - **Underpowered Questions:**  
    - Q2 (dented sphere) only splits Branches 1 vs. 2, not the core debate.  
    - Q5 (electrons) doesn’t add branches—answers align with Q1–Q4.  

  - **Unreachable Positions:**  
    - *Bare Substratum Theory*: Requires a "substance" beyond properties, but all quiz answers collapse into Branch 1 or 4.  
    - *Full-Blown Haecceitism* (distinctness beyond space/time): Folds into Branch 1.  

  **Spend tutorial time on:**  
  1. Why Q1 splits the room (Brute Distinctness vs. Bundle Theory).  
  2. Whether spatial relations (Q3/Q4) resolve the debate or presuppose distinctness.  
  3. **Crucially:** Does numerical difference *require* qualitative difference?  

  This exposes the Leibnizian principle’s nerve: If "no discernible difference implies identical," Branch 3 wins. If not, Branch 1 or 2 wins. The rest is commentary.
