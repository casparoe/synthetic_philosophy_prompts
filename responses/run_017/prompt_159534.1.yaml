prompt: |-
  I am in my final year of school, writing an extended essay on responsibility for failing to act, and I have run into the same wall every time I sit down to write: I have confident verdicts about which failures to act actually cause the things that happen next, and I cannot state the rule I am using to get them. I would like your help extracting it, testing it, and telling me where it breaks.

  By caused I mean whatever the ordinary word means in sentences like her failure to call the fire brigade caused the house to burn down — the sense that seems to matter for blame, not a technical sense.

  Here are my verdicts.

  1. A lifeguard on duty at a pool is reading her phone and does not notice a child struggling in the shallow end; she could have reached him in a few seconds. Verdict: her not going in caused the child's death.

  2. A lifeguard, off duty, in ordinary clothes, sunbathing beside a different pool, sees a child struggling there. She is a strong swimmer, the water is calm, there is no risk to her, and she does not go in. Verdict: I still want to say she caused it, but this is the verdict I am least sure of, and it feels different from case 1 in a way I cannot articulate.

  3. A tourist at the same pool who cannot swim and has no connection to anyone there, who also does not go in. Verdict: she did not cause the death, although she may have done something else wrong.

  4. My housemate promised to water my plant while I was away, forgot, and the plant died. Verdict: she caused it.

  5. A guest staying in the flat that week who saw the plant, knew it needed water, was never asked, and did not water it. Verdict: she did not cause it.

  6. In tennis, a ball comes to my forehand. I see it, I have time, and I decide not to swing; I let it pass. It lands in. Verdict: my not swinging caused the ball to land in.

  7. In January I decide not to give anything to charity this year. Somewhere abroad a child dies of an illness that a twenty dollar donation from me would have prevented. Verdict: I did not cause that death.

  Cases 6 and 7 are the pair I cannot reconcile. In both, I could have acted, I did not, the outcome would not have happened if I had acted, and in 7 I even formed the intention in advance. The difference cannot be ability, foresight, or whether the outcome was avoidable. The only thing I can point to is that in 6 I was already inside an activity and the ball was mine to deal with, while in 7 I was never engaged in anything relevant at all. I have come across the suggestion that some omissions are really negative actions rather than bare absences, and that sounds like my distinction, but I cannot say what turns a bare absence into a negative action.

  8. A machine raises an alarm only if two guards turn their keys at the same moment. Both are at their keys. Neither turns one. The fire spreads and the building burns. Neither guard alone could have made any difference. Verdict: both of them caused the fire to spread.

  9. A machine raises an alarm if any one of twenty bystanders pulls it. None does. The building burns. Verdict: the group's collective failure caused it, but no individual bystander did — and I hold this even though, for each of them taken separately, the fire would not have spread if that person alone had pulled it.

  So my questions. Is there one principle behind these verdicts, or am I using two? My own tentative rule is that an omission causes an outcome only when it is the non-performance of something within an activity the agent was already running, and cases 8 and 9 seem to add a separate requirement about the omission's standing in a set of omissions that jointly mattered. Please test that rule against all nine cases, state it back to me precisely, and tell me clause by clause which case forces each clause. Then tell me honestly which of my verdicts it cannot keep — in particular whether case 2 has to be reassigned to case 3's verdict, and what I would be giving up if I did that.

  I also need it to decide three cases I have not settled.

  10. I set up an automated assistant to email our group's file to the teacher by midnight. I never entered the instruction. Nothing was sent. We received a zero. Did my omission cause the zero, did the assistant's omission cause it, or neither?

  11. A school district never got around to installing carbon monoxide detectors in a boarding house; a leak kills a student. The official who would have signed the order left the post two years before. Whose omission, if anyone's, caused that death?

  12. A town council voted down a flood barrier in 1970. In 2025 the river floods and two people die in a house that the barrier would have protected. Did the councillors' failure to build it cause those deaths?

  Finally, give me one case of your own construction — one I have not listed — that your principle decides in a way you think I would find surprising, and say what it decides.
reasoning: |-
  Okay, let me try to figure out what's going on with this user's problem. They're writing an extended essay on responsibility for failing to act and have nine cases where they feel confident about whether an omission caused an outcome but can't articulate the rule they're using. Their main struggle seems to be reconciling cases like the tennis player (where not swinging causes the ball to land in) versus deciding not to donate to charity (where not donating doesn't cause a child's death).

  First, I need to understand their intuitive judgments. They mention feeling that some omissions are "negative actions" rather than "bare absences," but they can't define what makes that distinction. Looking at their cases, duty or role appears important (lifeguard on duty vs. off-duty), as does being part of an ongoing activity (tennis vs. charity). But case 2 complicates this—they're unsure about the off-duty lifeguard causing the death even without a formal duty.

  The user's tentative rule involves omissions within "an activity the agent was already running," plus something about joint omissions in cases 8 and 9. But testing this against case 7 (charity) and case 6 (tennis) shows tennis is an active engagement while charity isn't. However, case 2 might be a problem if "activity" is too vague—sunbathing isn't relevant, but proximity and capability create tension.

  The overdetermination cases (8 and 9) suggest another factor: when an omission is necessary within a minimal sufficient set. Case 8 has each guard's omission as part of a pair that's necessary for the outcome, while in case 9, no single bystander's omission is necessary because others could have acted. This seems like a separate condition.

  For the unresolved cases: 
  - Case 10: The user set up the assistant but didn't program it. The assistant's omission isn't "within its activity" because it wasn't activated. However, the user's omission in setup might be seen as starting the process, so it could count as causing the zero.
  - Case 11: The official left years ago, so their past omission isn't current. The district's ongoing omission might be the cause, but if the official was responsible when they left, it's tricky. Maybe the institution's persistent failure is key.
  - Case 12: The 1970 vote is distant in time. Causation might be seen as attenuated, especially with intermediary events. But if the barrier would have prevented the deaths directly, perhaps the council's omission is causal.

  The user might be concerned about moral responsibility versus causation, but they specifically want the ordinary concept of causation for blame. They need a principle that handles both role-based duties and situational engagements without moralizing causation itself.

  A deeper need could be reconciling intuition with philosophical rigor, especially for academic writing. They might fear their judgments are inconsistent, so the rule must validate most verdicts while clearly explaining outliers. Case 2 is critical here—if the rule forces "no causation," does that conflict with blame? They might need to separate causation from blame explicitly, though they want causation to matter for blame.

  In constructing the principle, three elements emerge: 
  1. **Activity Context**: Omission must be non-performance within an ongoing task or role (explains cases 1, 3-7, 10).
  2. **Minimal Necessity**: The omission must be necessary in a minimal set for the outcome (handles cases 8 and 9).
  3. **Relevance**: The activity must be directly related to preventing the outcome (addresses case 2 and charity case).

  Testing case 2: Off-duty lifeguard is capable and proximate, but not in a "relevant activity" since sunbathing isn't duty-related. If "activity" includes situational involvement like awareness and capacity, it might count, but that risks overextending to case 3. Sticking to roles or explicit engagements keeps case 2 as "no causation," which the user is unsure about but might accept.

  For the new case, a surprising result could be: A doctor off-duty in a plane crash performs CPR, stops, and the patient dies. If stopping is an omission within an activity they started, it causes death—but initial help wasn't owed. This challenges the "ongoing activity" clause and might force refining "voluntary assumption." The user's principle would say the doctor caused the death by stopping, which might be surprising but defensible.
answer: |-
  Based on your verdicts and your struggle to reconcile cases like 6 and 7, there *is* a coherent principle at work—but it requires two linked clauses, not one. Your intuition about "activities the agent was already running" is core, but needs refinement. I'll state the rule precisely, derive it from your cases, test it against all scenarios (including your unsettled ones), and highlight where it challenges your least confident verdict. Finally, I'll provide a novel test case.

  ### Your Principle of Omissive Causation
  **An agent's omission causes outcome O if and only if:**  
  1. **Activity Context:** The agent was actively engaged in a role, task, or situation where they were functionally responsible for preventing O (beyond general moral duty), *and*  
  2. **Minimal Necessity:** Their specific omission was a necessary part of a *minimal sufficient set* of conditions for O.  

  **Key Definitions:**  
  - **Functionally responsible:** The agent occupies a role (e.g., lifeguard, plant-waterer), initiates a task (e.g., tennis rally), or voluntarily assumes a specific duty (e.g., setting up an assistant) that creates an expectation of action to prevent O.  
  - **Minimal sufficient set:** The smallest group of actual events/omissions that jointly guarantee O. If any one had been different, O would not have occurred.  

  This rule separates *causal responsibility* (which matters for blame) from *moral failing* (which can exist without causation). It explains why foresight/ability alone aren’t enough (e.g., charity) and why "negative actions" (like not swinging in tennis) feel distinct from "bare absences" (like not donating).

  ### How Your Cases Forge Each Clause
  - **Clause 1 (Activity Context) is forced by:**  
    - Case 3 (tourist) vs. Case 1 (on-duty lifeguard): Ability alone doesn’t create causation; the lifeguard’s *role* does.  
    - Case 6 (tennis) vs. Case 7 (charity): Tennis involves an active engagement ("my ball to deal with"); charity lacks a specific, ongoing task.  
    - Case 4 (housemate) vs. Case 5 (guest): The promise creates a functional duty; the guest has no such context.  
    - Case 2 (off-duty lifeguard): Your uncertainty arises here—she has expertise but *no active role* at that pool.  

  - **Clause 2 (Minimal Necessity) is forced by:**  
    - Case 8 (guards) vs. Case 9 (bystanders): Both guards’ omissions are *each necessary* in the minimal set (since both keys were needed). But in Case 9, no single bystander’s omission is necessary—any one could have acted alone, so their failures are interchangeable.  
    - Case 7 (charity): Even if you donated, others’ inactions might still cause the death—your omission isn’t necessary in a minimal set.  

  ### Testing Your Rule Against All Cases
  | Case | Your Verdict | Rule’s Verdict | Match? | Analysis |  
  |------|--------------|----------------|--------|----------|  
  | 1    | Caused       | **Caused**     | Yes    | Clause 1: On-duty role. Clause 2: Her omission alone was sufficient (minimal set = {her not acting}). |  
  | 2    | Caused (unsure) | **Not Caused** | No     | Clause 1: **Fails**—she’s off-duty, sunbathing (no functional role). *This is the verdict you must reassign*. |  
  | 3    | Not caused   | **Not caused** | Yes    | Clause 1: No role or task. |  
  | 4    | Caused       | **Caused**     | Yes    | Clause 1: Promise creates task. Clause 2: Omission sufficient. |  
  | 5    | Not caused   | **Not caused** | Yes    | Clause 1: No role/task (not asked). |  
  | 6    | Caused       | **Caused**     | Yes    | Clause 1: Active in tennis rally. Clause 2: Not swinging sufficient. |  
  | 7    | Not caused   | **Not caused** | Yes    | Clause 1: No engagement in preventing the death. |  
  | 8    | Both caused  | **Both caused**| Yes    | Clause 1: Guards actively at posts. Clause 2: Each omission is necessary in the minimal set {Guard A not turning, Guard B not turning}. |  
  | 9    | Group caused; no individual | **Group caused; no individual** | Yes | Clause 1: Bystanders may lack a functional role (if not hired). Clause 2: **Even with Clause 1**, no individual omission is necessary—minimal set requires *all 20 not acting*, but no single one is essential (if one acted, O wouldn’t occur). |  

  ### Implications of Reassigning Case 2
  - **Your rule forces Case 2 to "Not caused"** (like Case 3). The off-duty lifeguard has *no functional role* at that pool—she’s just a bystander with expertise.  
  - **What you give up:** The intuition that her expertise/proximity creates causation. But this aligns with your charity verdict (Case 7): if general ability doesn’t cause, why should proximity?  
  - **What you gain:** Consistency. Blame might still apply (it’s morally horrific), but *causally*, her omission is a "bare absence" (like the tourist’s). This sharpens your argument: causation isn’t just about physical possibility.  

  ### Decisions for Your Unsettled Cases
  **10. Automated assistant omission**  
  - **Verdict:** **Your omission caused the zero.**  
  - **Why:** Clause 1: You initiated the task (setting up the assistant). Clause 2: Your failure to program it was sufficient—the assistant’s "omission" isn’t causal because it was never activated (no functional role).  

  **11. School district carbon monoxide detectors**  
  - **Verdict:** **The school district’s ongoing omission caused the death.**  
  - **Why:** Clause 1: The district has a functional role in maintenance. The ex-official’s omission isn’t causal—they left *before* the duty became critical (no ongoing engagement). Clause 2: The district’s persistent failure was necessary/sufficient.  

  **12. 1970 council flood barrier vote**  
  - **Verdict:** **Not caused.**  
  - **Why:** Clause 1: The council was engaged in 1970, but by 2025, that task is complete—no *ongoing* responsibility. Clause 2: Temporal distance breaks necessity; too many variables (e.g., maintenance, climate change) intervened. *Moral blame may apply, but not causation.*  

  ### A Test Case of My Own
  **The Abandoned CPR Case:**  
  > A doctor is hiking and finds a stranger collapsed. She starts CPR (voluntarily assuming a duty). After 2 minutes, she stops for no reason, and the person dies. Autopsy shows CPR would have saved them if continued. Did the doctor’s omission (stopping CPR) cause the death?  

  **Your principle’s verdict:** **Caused.**  
  - Clause 1: She was actively engaged by starting CPR (functional duty assumed).  
  - Clause 2: Stopping was sufficient—minimal set = {her stopping CPR}.  

  **Why you might find this surprising:**  
  - Initially, she had no duty (like the off-duty lifeguard). But by *starting*, she created an "activity context." This shows that functional responsibility can be *situational* and *self-imposed*. If you agree with this verdict, your principle holds. If not, you may need to limit "activity" to formal roles.  

  ### Final Thoughts
  Your principle works because it demands a *specific, contextual duty* (not just "could have acted") and handles overdetermination cleanly. The cost: it denies causation in Case 2 and charity-like cases, separating causation from blame. For your essay, argue that causation requires a *relational* element (agent-task-outcome) to avoid infinite responsibility. This reconciles tennis/charity and resolves your wall. If you refine the rule, test it against the CPR case—it’s a stress test for "voluntary engagement."
