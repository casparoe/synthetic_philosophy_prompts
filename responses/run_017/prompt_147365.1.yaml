  Looking at Hallam's argument, it has 12 steps. The Mary part (steps 1-5) is the standard knowledge argument: Mary knows all physical facts but learns something new upon seeing red, suggesting non-physical facts. Then Hallam extends this to Iris, who experiences 365 subtly different hues over time, each discriminable side-by-side but not at a day's remove. Hallam argues that each day Iris learns a new fact (step 7-8), but by the end, she can't distinguish any of these facts (step 9), leading to a contradiction (step 10-11) where phenomenal facts become undetectable.

  The novelist's sympathies are clear: they want to preserve that Mary genuinely learns something by having the experience (steps 1-2). That's crucial for their story. They're open to rejecting other premises but need to know the cost.

  Hallam defends step 9 by saying facts don't need to be distinguishable; the atom count analogy suggests undetectable differences can still be factual. But this seems problematic for phenomenal knowledge, which is supposed to be accessible through experience.

  The key issue is step 7: "On each of the 365 days, Iris undergoes an experience she has not undergone before and thereby acquires a phenomenal concept she did not previously have." Is acquiring a new phenomenal concept equivalent to learning a new fact?

  In Mary's case, when she sees red for the first time, she gains a new recognitional concept - she can now identify, remember, and think about that specific shade. But for Iris, each day's hue is so similar to the previous one that while she gains a new discriminative ability for that moment, it doesn't form a stable, distinct concept because she can't retain it. By the next day, when the hue shifts slightly, she can't compare it to yesterday's hue. So she hasn't truly acquired 365 distinct concepts; rather, she has a shifting, context-dependent ability.

  The novelist's intuition that Iris's learning feels incremental but never lost is important. Iris does gain cumulative discriminatory capacity - she becomes better at distinguishing hues in general - but she doesn't gain 365 discrete facts. This suggests that phenomenal "knowledge" might be more about ability than fact.

  Therefore, step 7 is flawed. Acquiring a phenomenal concept requires forming a stable, re-identifiable representation, which Iris doesn't do because of the memory constraint. Each day she has a new experience, but she doesn't acquire a new concept in the robust sense needed for fact acquisition.

  Rejecting step 7 preserves what matters: Mary learns something (a new fact or ability) through experience, while Iris's case shows that not every new experience translates to new factual knowledge. The cost is that this weakens the anti-physicalist argument; it concedes that some phenomenal gains might be abilities rather than facts. But Mary's case can still be argued as involving a new fact if we maintain that her first-time experience creates a stable concept.

  This approach keeps steps 1-2 intact and resolves the contradiction without accepting undetectable facts. It's more plausible and serves the novelist's purpose.
answer: |-
  The flaw lies in Step 7, which incorrectly assumes that Iris acquires a *new phenomenal concept* on each day. While Iris undergoes a novel experience daily, the critical memory stipulation prevents her from forming a distinct, re-identifiable concept for each hue. This undermines the claim that she learns a new *fact* with each experience. Let's break this down:

  ### Why Step 7 is the Problem
  - **The requirement for a "phenomenal concept"** (as defined in Step 6) demands more than momentary discrimination: it requires the ability to *recognize, remember, or re-identify* the experience across time. Iris cannot do this—she cannot compare today's hue to yesterday's, nor retain a stable mental "label" for each hue. Thus, she does not acquire 365 distinct concepts; she acquires a *fluid, cumulative discriminative ability* for fine-grained hues, but no discrete, enduring concepts.  
  - **Contrast with Mary**: When Mary sees red for the first time, she forms a persistent recognitional concept—she can now identify, recall, and distinguish red from other colors in the future. Iris lacks this. Her daily experience is ephemeral; it merges into a continuum of hue sensitivity without individuated concepts.  
  - **Why this preserves (1) and (2)**: Mary still learns something new (a fact or ability) via experience, satisfying your core requirement. Iris does not—she gains no *new fact* daily because her memory limitation prevents concept formation. Thus, (7) misdescribes Iris's epistemic progress.  

  ### What Rejecting Step 7 Costs
  - **Cost to anti-physicalism**: This weakens the generalization in (6). If acquiring a phenomenal concept requires stable re-identification (not just novel experience), then Mary's case remains special: her release provides a *first-time, persistent* concept. Anti-physicalists can still argue Mary learns a non-physical fact, but Iris's case no longer generalizes it to absurdity. The argument becomes a battle over whether Mary's concept acquisition entails a new fact (e.g., physicalists might argue it's just a new "mode of presentation" of physical facts).  
  - **Cost to your narrative**: Minimal. You retain Mary's transformative learning. Iris's incremental shifts can still illustrate unnoticed qualitative change—but now as a gradual shift in discriminatory skill, not 365 undetectable facts. This fits your plot: Iris *changes* without noticing, but she doesn't accumulate facts.  

  ### Why Other Steps Hold (or Can Be Defended)
  - **(1)–(5)**: Sound *if* Mary's learning is factive (see below).  
  - **(6)**: Partially true—it generalizes Mary's logic—but its application fails because Iris doesn't meet the concept-acquisition condition.  
  - **(8)**: Collapses with (7). No new facts are learned daily.  
  - **(9)–(11)**: Valid *if* (7) were true, but since it isn't, the contradiction vanishes.  
  - **(12)**: Avoided—we reject (7), not (6)'s core link to Mary, nor (1)–(5)'s soundness.  

  ### Addressing Hallam's Reply
  Hallam's atom-count analogy fails: atomic differences are structural/relational, detectable *in principle* via measurement. Iris's "365 facts" are *intrinsically subjective* and undetectable *even by the subject*—violating the essence of phenomenal knowledge (which is defined by first-person access). If facts require *possible* epistemic access (a common view), Hallam's "undetectable facts" are incoherent.  

  ### Your Sympathies Respected
  Preserving (1) and (2) is feasible: Mary learns *something* (a fact or ability) via experience. Rejecting (7) doesn't force you to abandon factivity (3)—Mary can still learn a fact, while Iris does not. If you prefer, Mary's "knowledge" could be reframed as *both* a fact *and* an ability (e.g., "knowing what it is like" involves a fact *about* the ability). This survives Iris's case: her daily gains are *only* momentary abilities, not facts.  

  ### Final Diagnosis
  Step 7 is the misstep. Iris's experiences do not yield new phenomenal concepts or facts due to the memory constraint. The cost is a modest concession to physicalism: the generalization in (6) is limited, but Mary's case remains a robust anti-physicalist argument.  

