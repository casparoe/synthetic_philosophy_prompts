prompt: |-
  So I run a fortnightly novel-writing workshop out of the back room of a secondhand bookshop, about 12 people, mostly literary fiction plus one very opinionated sci-fi guy, and we get two hours including a tea break. I'm planning a session for next month and I want something that isn't just more craft talk.

  Here's what I keep circling around. I've been reading about Jain anekāntavāda — the many-sidedness / non-one-sidedness thing — and the sevenfold conditional predication that goes with it. I'm shaky on which Sanskrit word maps onto which bit (saptabhaṅgī? syādvāda? are the standpoints a separate list from the seven modes or the same list? please quietly fix me if I have it tangled). What I want people to walk out feeling is not "everyone has their own truth, how lovely" — I'm fairly sure that's the misreading — but something harder: that several incompatible-sounding accounts of one event can each be genuinely, non-ironically true; that you can't recover the whole by averaging them or by finding the most sincere one; and that none of this leaves you paralysed when you have to act, because acting still means committing to one standpoint for the purpose at hand.

  What I'd like from you is a runnable two-hour session: the shared incident we write from, the roles, the rules, the handouts, a timeline, and a debrief. Some constraints, because I've tried things like this and they've flopped: no lecture up front before anyone writes, and the participants should run into the problem themselves rather than have it named for them. Definitely not a read-the-blind-men-and-elephant-parable opener — apart from being a cliché, I gather it gets told in half a dozen traditions and probably isnt even Jain in origin, so I dont want to hang the evening on it. Ideally nobody hears the Sanskrit words until the debrief. Two things I'd like built in specifically. First, a forced-choice moment where a writer has to commit to one version and do something irreversible with it, so they discover on their own that many-sidedness isn't the same as can't-decide. Second, a tagging or scoring device so statements get sorted rather than just discussed — I was imagining each line getting marked with which of the modes its claiming, and a ledger separating contradictions that stay live under challenge from ones that dissolve once you ask "true relative to what, stated by whom, about which aspect". Steal that or improve on it. And my group will reach for "unreliable narrator" within about four minutes; I think that frame will actively block the point, since it smuggles in that there's one real version the narrator is distorting, so tell me how to work with it when it comes up rather than how to head it off.

  The debrief should map specific moments onto the actual structure of the view — the standpoints versus the predication versus the doctrine itself, if its three different things. Say what will predictably go wrong the first time I run it, and be honest about which part of the view a writing workshop simply cannot stage and I'd have to just tell them flat out. One more ask: when you explain the doctrine, separate what's settled among people who actually know this material from what scholars genuinely argue about — I'd guess that whether the sevenfold scheme is a real many-valued logic or a dialectical teaching tool is fought over, and how you translate the avaktavya/ineffable mode is too, but honestly I don't know. Don't smooth a live dispute into a consensus, and flag where your own reconstruction is a stretch or where you're trading orthodoxy for something that works in a room of twelve tired writers on a Tuesday.
reasoning: |-
  We are designing a two-hour writing workshop session inspired by Jain anekāntavāda (the doctrine of non-one-sidedness) and its associated sevenfold predication (saptabhaṅgī). The goal is for participants to experience that multiple, seemingly incompatible accounts of an event can each be true in their own context, without resorting to relativism or paralysis in action. The session should avoid upfront lectures and instead let participants discover the core ideas through writing and discussion.

  Key elements:
  - **Saptabhaṅgī (sevenfold predication)**: A method of conditional predication using "syāt" (may be), which outlines seven ways an entity can be described without absolute assertions. The seven modes are:
    1. syāt-asti — may be, it is (affirmation)
    2. syāt-nāsti — may be, it is not (negation)
    3. syāt-asti-nāsti — may be, it is and it is not (both, but not simultaneously)
    4. syāt-avaktavyaḥ — may be, it is indescribable (ineffable)
    5. syāt-asti-avaktavyaḥ — may be, it is and is indescribable
    6. syāt-nāsti-avaktavyaḥ — may be, it is not and is indescribable
    7. syāt-asti-nāsti-avaktavyaḥ — may be, it is, it is not, and it is indescribable

  - **Naya (standpoints)**: Different perspectives (e.g., substantial, modal, temporal, spatial) from which an entity can be described. These are the lenses through which the predications are made.

  The session must include:
  1. A shared incident to write from.
  2. Roles for participants to embody different perspectives.
  3. Rules for writing and discussion.
  4. Handouts with minimal upfront theory.
  5. A timeline fitting two hours including a tea break (e.g., 15 min intro, 30 min writing, 15 min tea, 30 min activity, 15 min debrief, 15 min buffer).
  6. A forced-choice moment where a writer commits to one version.
  7. A tagging/scoring system for statements to sort them by the modes.
  8. Debrief mapping the experience to Jain concepts, clarifying settled vs. disputed points.

  Avoiding:
  - Lecture before writing.
  - The blind men and elephant parable.
  - Premature introduction of Sanskrit terms (until debrief).
  - Framing as "unreliable narrator" without addressing the underlying assumption of a single truth.

  Addressing "unreliable narrator": When it comes up, reframe it by asking: "What if each narrator is fully reliable from their standpoint? What if the event is genuinely multifaceted, and no one is distorting the truth?"

  Plan for the session:

  **Phase 1: The Incident (15 min)**
  - Introduce a shared incident without analysis. Example: "A loud crash is heard in the next room during a quiet meeting. When people rush in, they find a broken vase. What happened?"
  - Assign roles randomly: e.g., Meeting Leader, New Intern, Cleaning Staff, Security Guard, CEO, Window Washer (outside), etc. Each role has a distinct perspective (e.g., the CEO is concerned about company image, the Cleaning Staff about blame, the Window Washer saw something through the window).

  **Phase 2: Writing (30 min)**
  - Each participant writes a 1-page account from their role's perspective. Rules:
    - Write in first person, as a witness statement.
    - Include sensory details and emotions.
    - Do not coordinate with others.
  - Emphasize: Each account must be true from that person's standpoint.

  **Phase 3: Tea Break (15 min)**
  - Informal mingling, but no discussion of the accounts.

  **Phase 4: Sharing and Tagging (30 min)**
  - Participants read their accounts aloud (or in small groups if time is tight).
  - After each reading, the group does not discuss but instead tags the account using a simplified set of modes (adapted for accessibility). We'll use three tags for simplicity, mapping to the first three modes (but hinting at the full seven):
    - **AFFIRM** (syāt-asti): The account asserts what happened (e.g., "I saw the vase fall").
    - **DENY** (syāt-nāsti): The account denies an aspect (e.g., "I did not cause the crash").
    - **BOTH** (syāt-asti-nāsti): The account contains a contradiction that is unresolved (e.g., "The vase was blue, but I also think it was green").
  - We'll avoid the ineffable modes for now to keep it manageable.
  - Use a large board or shared document to record each account and its primary tag.

  **Phase 5: Forced Choice (15 min)**
  - Present a scenario: "The building manager must decide who is responsible for the broken vase. She must choose one account to act upon. Each group (or individual) must argue for why their account should be chosen, but they can only use elements from their own account and must commit to it fully."
  - After brief arguments, the group votes on which account to use (or the facilitator picks one arbitrarily to demonstrate commitment).

  **Phase 6: Debrief (15 min)**
  - Introduce the Jain concepts now. Explain:
    - **Anekāntavāda**: The doctrine that reality is complex and can be perceived from multiple standpoints (nayas), each yielding a partial truth.
    - **Saptabhaṅgī**: The sevenfold predication that formalizes how we can make conditional statements about reality.
  - Map the experience:
    - The different roles represent different nayas (standpoints).
    - The tagging exercise was a simplified version of the first three modes of saptabhaṅgī.
    - The forced choice shows that even though multiple truths coexist, action requires commitment to one standpoint for the purpose at hand.
  - Clarify scholarly disputes:
    - The seven modes are often debated: are they a formal logic or a pedagogical tool? Some scholars see them as a way to avoid dogmatism, not as a logical system.
    - The ineffable (avaktavya) modes are particularly tricky and may not have been captured in our exercise.
    - Note: The blind men and elephant is a common analogy but is not Jain in origin (it's Buddhist and Hindu too) and simplifies the idea to relativism, which anekāntavāda is not.
  - Address "unreliable narrator": Explain that in this exercise, no narrator is unreliable; they are each reliable within their naya. The incompatibility arises from the multifaceted reality, not from distortion.

  **Handouts:**
  - One sheet with the incident and role assignments.
  - One sheet for writing instructions.
  - Tagging guide (simple, with the three tags).

  **Predictable Issues:**
  - Participants might merge accounts or try to create a unified story. Enforce writing from one standpoint.
  - The tagging might be oversimplified. Acknowledge this in debrief and explain the full seven modes.
  - The forced choice might feel arbitrary. Emphasize that it's about the necessity of action, not finding the "best" truth.
  - Time may run short. Be ready to cut readings short or do tagging in small groups.

  **What the Workshop Cannot Stage:**
  - The full complexity of the ineffable modes (modes 4-7) is hard to enact in a writing exercise. We'll mention them in debrief but not use them in tagging.
  - The metaphysical underpinnings of anekāntavāda (like the nature of the soul in Jainism) are beyond scope. We're using it as an epistemological tool.

  **Revised Timeline (total 120 min):**
  - 0-15 min: Introduction and role assignment.
  - 15-45 min: Writing.
  - 45-60 min: Tea break.
  - 60-90 min: Sharing and tagging.
  - 90-105 min: Forced choice.
  - 105-120 min: Debrief.

  This plan meets the constraints and incorporates the key elements. Let's detail the handouts and step-by-step instructions.
answer: |-
  Below is a runnable two-hour workshop plan grounded in Jain anekāntavāda, designed to avoid upfront theory and let participants discover the core ideas through writing and structured interaction. I've clarified the Jain framework first (for your background), then detailed the session. The plan includes a shared incident, roles, rules, handouts, timeline, debrief, and notes on pitfalls and scholarly disputes. I'll flag where I adapt doctrine for practicality.

  ### **Jain Framework Clarification** (For Your Background, Not Shared Upfront)
  - **Anekāntavāda**: The doctrine of "non-one-sidedness." Reality is complex and can only be grasped through multiple standpoints (*nayas*). Not relativism ("all views are equal"), but a rigorous method to avoid absolutism.
  - **Saptabhaṅgī**: The "sevenfold predication" (yes, that's the term; *syādvāda* refers to the method of using "may be" in predications). It outlines seven conditional modes for describing reality using *syāt* ("may be," "from a perspective"). The modes:
    1. **Syāt-asti** – May be, it is (affirmation).  
    2. **Syāt-nāsti** – May be, it is not (negation).  
    3. **Syāt-asti-nāsti** – May be, it is and is not (successive affirmation/negation).  
    4. **Syāt-avaktavya** – May be, it is indescribable (as a single truth).  
    5. **Syāt-asti-avaktavya** – May be, it is and is indescribable.  
    6. **Syāt-nāsti-avaktavya** – May be, it is not and is indescribable.  
    7. **Syāt-asti-nāsti-avaktavya** – May be, it is, is not, and is indescribable.  
  - **Nayas**: Standpoints (e.g., spatial, temporal, contextual) that shape *how* a truth is expressed. Separate from the seven modes but used in applying them.  
  - **Settled vs. Disputed**:  
    - Settled: Anekāntavāda rejects one-sided absolutism; saptabhaṅgī is a core Jain tool for conditional truth.  
    - Disputed: Whether saptabhaṅgī is formal logic (like modern many-valued logic) or a dialectical guide. Also, *avaktavya* (indescribable) is debated: some see it as a temporary state of uncertainty, others as inherent to complex realities.  
  - **Key Insight for the Workshop**: Truth is standpoint-dependent. Incompatible accounts aren't contradictions but partial facets. Action requires committing to one *naya* without denying others.

  ---

  ### **Workshop Plan: "The Incident at Willow Lane"**
  **Goal**: Participants experience writing/defending irreconcilable but equally valid accounts of one event, then commit to action despite multiple truths.  
  **Core Exercise**: A mysterious public incident witnessed from fixed roles.  
  **Avoids**: Lectures, Sanskrit terms, blind-men-and-elephant parable.  
  **Handles "unreliable narrator"** by reframing: "What if no one is unreliable? What if each speaker is fully truthful *from their standpoint*?"

  #### **Materials**  
  - **Incident Handout** (1/page): Describes the event neutrally.  
  - **Role Cards** (12 unique roles): Assign perspectives.  
  - **Tagging Stickers**: Three colors (🔴 Red, 🔵 Blue, 🟢 Green) + ledger sheets.  
  - **Commitment Cards**: For forced-choice phase.  
  - **Debrief Handout**: Explains Jain concepts *after* the exercise.  

  #### **Incident & Roles**  
  **The Incident**:  
  > *"On Tuesday at 3 PM, in a small public garden on Willow Lane, a statue of a bird (the ‘Willow Finch’) suddenly shattered. No one admits to touching it. Witnesses include passersby, a gardener, a street musician, etc. The statue was donated by a controversial former mayor."*  

  **Roles** (12 variations; assign randomly):  
  1. **Gardener**: Saw it while pruning roses. Believes the statue was fragile.  
  2. **Street Musician**: Heard a crack while playing violin. Blames vibrations from construction nearby.  
  3. **Nanny with Child**: Child pointed at statue seconds before it broke. Worried about blame.  
  4. **Construction Worker**: Drilling nearby; insists vibrations couldn’t reach the statue.  
  5. **Retired Sculptor**: Expert on stonework; thinks it was vandalism.  
  6. **Teen with Phone**: Filming a TikTok; caught the moment but didn’t see cause.  
  7. **Shopkeeper**: Watching from window; thinks a bird flew into it.  
  8. **Mayor’s Aide**: Knows statue’s political history; suspects protest.  
  9. **Tourist**: Taking photos; thought it was performance art.  
  10. **Elderly Local**: Remembers statue’s installation; believes it’s weathering.  
  11. **Barista on Break**: Sipping coffee; thinks a jogger bumped the pedestal.  
  12. **Science Student**: Studying physics; calculates sun exposure weakened stone.  

  **Why this works**: Roles have incompatible explanations (vandalism, accident, natural causes) rooted in their standpoint (e.g., sculptor’s expertise, musician’s auditory focus). Forces "incompatible truths" without a "correct" version.

  ---

  #### **Timeline (120 Minutes Total)**  
  **0–15 min: Setup (No Theory!)**  
  - Hand out **Incident Sheet** and **Role Cards**.  
  - Instructions:  
    > *"Write a 1-paragraph eyewitness account (5–7 sentences) from your role’s perspective. Include: WHAT you saw/heard, WHY you think it happened, and ONE sensory detail (e.g., sound, smell). Stick to your role’s knowledge—no omniscience! You have 15 minutes."*  
  - **Facilitator Tip**: Emphasize "truthfulness" from their standpoint. Walk the room to deter collaboration.  

  **15–45 min: Writing & Tagging**  
  - Writing (15 min): Participants draft accounts.  
  - **Tagging Prep**: While writing, place three **Tagging Posters** on the wall:  
    - 🔴 **AFFIRMS something** (e.g., "It was vandalism!").  
    - 🔵 **DENIES something** (e.g., "It wasn’t the weather!").  
    - 🟢 **HOLDS CONFLICT** (e.g., "It looked deliberate, but I’m not sure").  
  - Tagging (15 min):  
    - Each participant reads their account aloud.  
    - After each, group tags it with 1–2 stickers on the posters (e.g., if account affirms vandalism and denies weather, it gets 🔴 and 🔵).  
    - **Ledger Activity**: Record accounts in a shared ledger (flipchart or digital doc) with two columns:  
      - *Statement* (e.g., "It broke due to vibrations").  
      - *Survives Challenge?* (Leave blank for now).  

  **45–60 min: Tea Break**  
  - Encourage informal chat—but no resolving the incident!  

  **60–85 min: Challenge & Commitment**  
  - **Challenge Phase (15 min)**:  
    - Participants interrogate each other’s accounts using this prompt:  
      > *"Test ONE statement from the ledger. Ask: ‘True relative to what? From whose view? About what aspect?’ If it holds, mark ✅ in ‘Survives Challenge’. If it collapses, mark ❌."*  
      Example: Gardener says, "The stone was cracked." Challenge: "True for you as a gardener? Or for the sculptor?" If it stands as a subjective observation, ✅. If it claims universal truth, ❌.  
    - **Goal**: Show how contradictions dissolve under "relative to what?" (e.g., "vibrations caused it" may be true for the musician but not the construction worker—both survive).  
  - **Forced Commitment (10 min)**:  
    - Introduce **Commitment Cards**:  
      > *"The city council must decide: REPAIR the statue, REMOVE it, or INVESTIGATE. Argue for your solution using ONLY your account. Then, anonymously vote for one solution to enact."*  
    - Participants write their solution (e.g., "Remove: it’s a hazard") on cards and argue briefly.  
    - Vote and implement one solution (e.g., majority wins).  
    - **Key Point**: Commitment proves action requires choosing one *naya* (standpoint) without denying others.  

  **85–100 min: Structured Debrief**  
  - Distribute **Debrief Handout** (see below). Start with:  
    > *"Today wasn’t about ‘unreliable narrators.’ Each of you was reliable from your standpoint. The statue shattered in multiple truths. How did that feel when you had to act?"*  
  - Map the exercise to Jain concepts:  
    - **Standpoints (nayas)**: Your roles (e.g., sculptor’s expertise, student’s physics lens).  
    - **Seven Modes (saptabhaṅgī)**: Tagging posters simplified the first three modes (asti, nāsti, asti-nāsti). The "indescribable" (avaktavya) emerged in gaps (e.g., "I’m not sure why it broke" → mode 4).  
    - **Anekāntavāda**: The whole truth wasn’t the average of accounts but the sum of standpoints.  
  - Address disputes:  
    > *"Scholars debate if the seven modes are rules of logic or teaching tools. We leaned into teaching. Also, the ‘indescribable’ mode (avaktavya) is contested—we treated it as ‘unknowable from my standpoint.’"*  
  - End with:  
    > *"Anekāntavāda isn’t paralysis. You voted to act. Writing requires this: commit to a character’s truth even when others exist."*  

  **100–120 min: Q&A & Close**  
  - Discuss how this applies to fiction (e.g., multi-POV novels, moral ambiguity).  

  ---

  ### **Handouts**  
  **1. Incident Sheet**  
  > **THE INCIDENT AT WILLOW LANE**  
  > On Tuesday at 3 PM, in the Willow Lane Garden, the ‘Willow Finch’ statue shattered. No one was seen touching it. It was sunny, 72°F. Background: The statue was donated by ex-Mayor Thorne (resigned after scandal).  

  **2. Role Cards** (Example: Gardener)  
  > **ROLE: GARDENER**  
  > - Saw it while pruning roses 10ft away.  
  > - Believes: Stone was crumbling (you’ve seen cracks for weeks).  
  > - Detail: Smell of wet soil just before it broke.  
  > **YOUR TRUTH**: The statue was fragile—it’s not vandalism!  

  **3. Tagging Posters**  
  - 🔴 **AFFIRMS**: Asserts a cause/truth.  
  - 🔵 **DENIES**: Rejects a cause/truth.  
  - 🟢 **HOLDS CONFLICT**: Contains unresolved tension.  

  **4. Ledger Sheet**  
  | Statement            | Survives Challenge? (✅/❌) |  
  |----------------------|---------------------------|  
  | "Vibrations broke it"|                           |  

  **5. Commitment Card**  
  > My solution: [REPAIR/REMOVE/INVESTIGATE]  
  > Reason (use your account): _______________________  

  **6. Debrief Handout** (Distributed at end)  
  > **BEYOND "EVERYONE HAS THEIR TRUTH"**  
  > Today explored **anekāntavāda** (non-one-sidedness):  
  > - Reality has infinite facets. No single "true" account.  
  > - We simplified **saptabhaṅgī** (7 modes of "may be"):  
  >   🔴 *Syāt-asti*: Affirmation ("It is").  
  >   🔵 *Syāt-nāsti*: Negation ("It is not").  
  >   🟢 *Syāt-asti-nāsti*: Both, successively ("It is and isn’t").  
  > - **Indescribable modes**? We glimpsed them when truths resisted labels.  
  > - **Action isn’t betrayal**: You committed to one standpoint to act. That’s the point.  
  > **For Writers**: This isn’t "unreliable narrator." It’s about genuine, partial truths. Use it for:  
  > - Character voices that clash but all feel real.  
  > - Moral choices where no view is "wrong."  

  ---

  ### **Predictable Pitfalls & Solutions**  
  - **"Unreliable narrator" comes up**:  
    > *"Ah! But what if everyone is reliable? What if the statue *was* vandalism to the sculptor *and* an accident to the gardener? How does that change how you write conflict?"* Redirect to standpoint: "True relative to what?"  

  - **Tagging oversimplifies**: The first three modes are manageable; modes 4–7 are abstract. If someone struggles, say: *"If your truth feels incomplete or conflicted, that’s the ‘indescribable’ mode creeping in—we’ll discuss later."*  

  - **Group seeks consensus**: Enforce roles strictly. In challenge phase, remind: *"Don’t reconcile—ask ‘for whom is this true?’"*  

  - **Forced choice feels reductive**: Acknowledge: *"This is uncomfortable! But anekāntavāda says action requires commitment. How did it feel to vote despite knowing other truths?"*  

  - **Time crunches**: Shorten readings (e.g., read key lines vs. full accounts) or skip challenge phase for 1–2 accounts.  

  **What the Workshop Can’t Stage**:  
  - The metaphysical depth of *avaktavya* (e.g., truths beyond language). We reduce it to "gaps in knowledge."  
  - Jainism’s ethical foundation (non-violence, multiple souls). Focus only on epistemology.  
  - Full saptabhaṅgī logic. We use it as a lens, not a formal system.  

  **Your Adaptation Notes**:  
  - I simplified saptabhaṅgī to 3 tags for clarity (modes 1–3). Mode 4 (ineffable) emerges organically in gaps.  
  - Standpoints (*nayas*) are embedded in roles, not taught explicitly.  
  - The forced choice trades orthodoxy for practicality: Jainism emphasizes non-absolutism in thought but commitment in ethical action. Here, "commitment" is narrative choice.  

  This plan respects your constraints while creating a visceral experience of anekāntavāda. The debrief explicitly separates doctrine from disputes, and the tagging/commitment mechanics make the abstract concrete. Run it as-is, and let the sci-fi guy’s strong opinions fuel the challenge phase!
