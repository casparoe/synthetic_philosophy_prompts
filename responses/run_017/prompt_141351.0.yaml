  ### Decision Tree for the Determination of Death  
  **Entry Point (Consensus Commitment):**  
  You accept that a ventilated patient with **total loss of clinical brain function** (absent brainstem reflexes, apnoea, unresponsiveness on adequate testing) is dead.  
  *Rationale: Grounds the tree in clinical consensus, avoiding abstract doctrinal debates.*  

  ---

  #### 1. **When circulation ceases in a controlled DCD donor (asystole after withdrawal, no CPR planned), is the patient dead?**  
     - **Yes** → Go to 2  
       *Rationale: Prioritises finality for practical purposes (e.g., organ procurement).*  
     - **No** → Go to 3  
       *Rationale: Demands stricter biological irreversibility.*  

  #### 2. **Is death the cessation of the *organism* (biological entity) or the *person* (conscious being)?**  
     - **Organism** → Leaf: **Circulatory-Respiratory (Permanent)**  
       *Awkward commitment: A patient whose heart could be restarted but won’t be (e.g., DCD) is dead, even if resuscitation is technically feasible.*  
     - **Person** → Leaf: **Higher-Brain with Permanence**  
       *Awkward commitment: A permanently unconscious, spontaneously breathing patient (e.g., PVS) is dead, though biologically integrated.*  

  #### 3. **In a patient with no cardiac output on ECMO (cerebral circulation maintained), is circulation "lost"?**  
     - **Yes** → Leaf: **Circulatory-Respiratory (Irreversible)**  
       *Awkward commitment: ECMO patients with no pulse are alive only if circulation is *spontaneous*; machine-sustained circulation doesn’t count.*  
     - **No** → Go to 4  
       *Rationale: Accepts machine-sustained function as "belonging" to the organism.*  

  #### 4. **Is a brain-dead patient with preserved neuroendocrine function (e.g., thermoregulation) dead?**  
     - **Yes** → Go to 5  
       *Rationale: Prioritises brainstem integration over residual hypothalamic function.*  
     - **No** → Leaf: **Whole-Brain**  
       *Awkward commitment: A "brain-dead" patient with intact neuroendocrine axes is not dead, complicating standard testing protocols.*  

  #### 5. **Can an organism be dead while gestating a viable fetus?**  
     - **Yes** → Leaf: **Brainstem**  
       *Awkward commitment: A brain-dead pregnant patient is a corpse, even if maintained for fetal viability.*  
     - **No** → Go to 6  
       *Rationale: Requires organismic unity for life; gestation implies integration.*  

  #### 6. **Is a patient with hydranencephaly (no cerebrum, but brainstem reflexes) dead?**  
     - **Yes** → Leaf: **Higher-Brain**  
       *Awkward commitment: An infant with hydranencephaly who breathes and reacts is dead, despite apparent vitality.*  
     - **No** → Go to 7  
       *Rationale: Attributes life to minimal brainstem-mediated integration.*  

  #### 7. **Must death have a determinate moment, or can it be gradual?**  
     - **Determinate moment** → Leaf: **Organism-as-Integrated-Whole**  
       *Awkward commitment: Death *must* be pinpointed to a specific time, even when functions fade asynchronously (e.g., anoxic injury).*  
     - **Gradual process** → Leaf: **Gradualism**  
       *Awkward commitment: Death certificates cannot record a precise time; legal/social practices must accommodate indeterminacy.*  

  #### 8. **Is an isolated, perfused brain (post-body-death) alive?**  
     - **Yes** → Leaf: **Personhood-Consciousness**  
       *Awkward commitment: A brain in a vat could be a living person, detached from biological embodiment.*  
     - **No** → Leaf: **Conventionalist (Legal Fiction)**  
       *Awkward commitment: Brain death is a useful legal convention, not biological reality; the "dead" donor may still be biologically alive.*  

  ---

  ### Unoccupied/Incoherent Combinations  
  - **Gradualism + Circulatory-Irreversible**: Incoherent. Gradualism rejects fixed moments, but circulatory death requires pinpointing irreversible cessation.  
  - **Personhood + Whole-Brain**: Unattractive. If death is loss of personhood, whole-brain criteria are overinclusive (e.g., includes PVS patients who retain brainstem function).  
  - **Brainstem + Permanence**: Unexplored. No clear rationale for accepting permanence in circulation but not neurology.  

  ---

  ### Case Diagnostics  
  1. **Ventilated, brain-dead, neuroendocrine intact**:  
     - *Node 4*: Distinguishes **Whole-Brain** (not dead) vs. **Brainstem** (dead).  
  2. **Brain-dead pregnant patient**:  
     - *Node 5*: Distinguishes **Brainstem** (dead) vs. **Organism-as-Integrated-Whole** (alive until fetal delivery).  
  3. **Anoxic injury (neocortical loss, brainstem intact)**:  
     - *Node 6*: Distinguishes **Higher-Brain** (dead) vs. **Brainstem** (alive).  
  4. **Hydranencephaly infant**:  
     - *Node 6*: Same as above.  
  5. **Controlled DCD (asystole, no CPR)**:  
     - *Node 1*: Distinguishes **Circulatory-Permanent** (dead) vs. **Circulatory-Irreversible** (not dead).  
  6. **ECMO, no cardiac output**:  
     - *Node 3*: Distinguishes **Circulatory-Irreversible** (dead) vs. **Organism-as-Integrated-Whole** (alive if cerebral circulation persists).  
  7. **Extracorporeal perfusion post-asystole**:  
     - *Node 4/7*: Challenges **Whole-Brain** (not dead if structure intact) vs. **Brainstem** (dead if clinical function lost).  
  8. **Isolated perfused brain**:  
     - *Node 8*: Distinguishes **Personhood** (alive) vs. **Conventionalist** (dead).  
  9. **Cervical spinal injury (conscious, ventilator-dependent)**:  
     - *Control*: All paths agree: alive.  

  *Redundant Cases*: Cases 3 (anoxic injury) and 4 (hydranencephaly) both test the same node (6), as they involve preserved brainstem function despite cortical loss.  

  ---

  ### Practical Purposes and Shifting Nodes  
  Purpose-driven shifts occur at:  
  - **Organ Procurement (Dead Donor Rule)**: Favours **Permanence** (Node 1) and **Conventionalist** (Node 8) to legitimise DCD/neurological criteria.  
  - **Treatment Withdrawal**: Favours **Permanence** (Node 1) or **Higher-Brain** (Node 6) to permit cessation without declaring death.  
  - **Legal Death (Inheritance/Crime)**: Requires a **determinate moment** (Node 7), rejecting Gradualism.  
  - **Death Certificate**: Demands **biological criteria** (rejects Conventionalist), often defaulting to circulatory or whole-brain.  

  **Example**: A DCD donor may be "dead" for organ procurement (Permanent Circulatory) but "not dead" for criminal law if death timing affects culpability (requiring Irreversible Circulatory).  

  ---
  This tree isolates core tensions in death determination, using clinical cases to force unambiguous choices. It reveals standard criteria as local compromises within a contested landscape, empowering clinicians to navigate disagreements through shared logical structure.
