  In our setup, the bank has historical data from a previous model. We assume that the previous model approved a subset of applications, and for those we have outcomes. For the new model, we will have the same issue: we will not know the outcome for rejected applicants.

  The impossibility results typically assume that the true base rates are known. But in reality, they are not. The bank might use techniques like reject inference to estimate the missing outcomes, but these are assumptions-laden.

  Therefore, the inputs to the fairness audit ( the base rates per group and subpopulation) are not directly observable. They are estimated from historical data that is conditional on the previous approval decisions. If the previous approval decisions were biased, then the estimated base rates may be biased.

  The theorem's conditions (base rates) are not known, so the formal result cannot be applied directly. This is a major limitation.

  However, the bank might rely on the historical data from the previous model, which is all it has. So the conflict will be diagnosed using the available data, which is conditional on the previous approvals.

  This means that if the previous model approved more of group A1 and less of A2, then the observed repayment rate for group A will be closer to A1's rate, and the bank might not realize that A2 has a lower rate. 

  In summary, the impossibility result is based on unobservable ground truth, and the practical application is therefore on shaky ground.

