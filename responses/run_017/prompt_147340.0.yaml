answer: |-
  ### Scenario: Small-Business Lending at a Bank  
  A bank uses a credit scoring model to approve/reject small-business loan applications. The outcome is repayment (success) or default (failure). The population is divided into two headline groups: **Urban** (Group A) and **Rural** (Group B). Each group has identical repayment rates (60%). Within each group, two subpopulations exist:  
  - **Urban**: Service-industry (A1) and Retail-industry (A2) businesses.  
  - **Rural**: Agriculture (B1) and Retail-industry (B2) businesses.  
  The bank uses features like **revenue, time in business, and owner’s credit score**, but *not* industry type (subpopulation), as regulators prohibit its use due to historical bias concerns. The repayment rates are:  
  - A1: 70% (Service) | A2: 50% (Retail)  
  - B1: 80% (Agriculture) | B2: 40% (Retail)  
  Subpopulation sizes are equal within groups (50% each), ensuring the headline groups both have 60% repayment. Crucially, the bank only observes repayment outcomes for *approved* loans; rejected applicants’ outcomes are unknown.  

  ---

  ### (a) Conflict Emerges Despite Equal Base Rates  
  The equal repayment rate (60%) for Urban and Rural satisfies the textbook condition for compatibility between calibration, false-positive rate (FPR) parity, and false-negative rate (FNR) parity *at the headline level*. For example:  
  - A classifier assigning all applicants a score of 0.6 (matching the group repayment rate) and approving if score ≥ 0.5 achieves:  
    - **Calibration**: Score = actual repayment rate (60%) in both groups.  
    - **FPR Parity**: FPR = 100% in both (all non-repayers approved).  
    - **FNR Parity**: FNR = 0% in both (no repayers rejected).  

  **Minimal Further Condition**: Even with equal headline base rates, the criteria conflict when subpopulations have different prevalences *and* the classifier cannot distinguish them. No additional conditions are needed—the conflict arises solely from refining the partition.  

  ---

  ### (b) Subpopulations Drive Impossibility  
  The industry subpopulations (Service, Retail, Agriculture) have materially different repayment rates (70%, 50%, 80%, 40%), but the classifier lacks industry data. A regulator could plausibly audit these subpopulations (e.g., under ECOA’s focus on industry-based disparities).  

  ---

  ### (c) Conflict Demonstration via Three Classifiers  
  Using the same features (revenue, time, credit score), we train three classifiers. All satisfy calibration, FPR parity, and FNR parity for **Urban/Rural**, but fail for **subpopulations**. Each classifier satisfies two criteria at the subpopulation level:  

  #### Classifier 1: Satisfies Calibration + FPR Parity  
  - **Mechanism**: Uses a **revenue threshold** ($50K) to assign scores matching observed repayment rates per bucket.  
  - **Subpopulation Performance**:  
    - **Calibration**: Score = true repayment rate for each revenue bucket (e.g., high-revenue A1: score 0.75).  
    - **FPR Parity**: FPR = 30% for all subpopulations (achieved by tuning thresholds).  
    - **FNR NOT Parity**: FNR = 10% (A1), 25% (A2), 5% (B1), 40% (B2).  
  *Plausibility*: Revenue correlates with repayment; the bank uses such thresholds for risk tiers.  

  #### Classifier 2: Satisfies Calibration + FNR Parity  
  - **Mechanism**: Uses **owner’s credit score** (e.g., FICO) to assign calibrated scores, then optimizes for FNR parity.  
  - **Subpopulation Performance**:  
    - **Calibration**: Score = true repayment rate per credit-score bucket.  
    - **FNR Parity**: FNR = 15% for all subpopulations.  
    - **FPR NOT Parity**: FPR = 20% (A1), 45% (A2), 10% (B1), 60% (B2).  
  *Plausibility*: Credit scores are legally mandated and calibrated to repayment.  

  #### Classifier 3: Satisfies FPR + FNR Parity  
  - **Mechanism**: Uses **time in business** to equalize error rates, sacrificing calibration.  
  - **Subpopulation Performance**:  
    - **FPR Parity**: FPR = 25% for all.  
    - **FNR Parity**: FNR = 10% for all.  
    - **Calibration NOT**: Scores diverge from true rates (e.g., A1 assigned 0.65 vs. true 70%).  
  *Plausibility*: Banks often prioritize equal error rates to avoid disparate impact claims.  

  **Key Insight**: All three criteria conflict; no single criterion dominates. FPR/FNR parity forces tradeoffs in calibration, while calibration forces unequal errors.  

  ---

  ### (d) Partition Sensitivity and Steelman Replies  
  **Critical Feature**: The **industry type** (unavailable to the classifier) drives subpopulation repayment disparities.  
  - **Coarsening Partition (to Urban/Rural)**: Conflict dissolves (as shown). Base rates equalize, allowing all criteria to coexist.  
  - **Refining Partition (e.g., by industry + revenue)**: Conflict worsens. More partitions amplify prevalence differences, making joint satisfaction harder.  

  **Steelman Replies from Impossibility Advocates**:  
  1. **"Fine Partitions Are Honest; Coarse Conceals Disparities"**:  
     Aggregating Urban/Rural masks Retail’s struggles (50% in Urban, 40% in Rural). Subpopulations reflect true socioeconomic fault lines. The impossibility result proves fairness metrics are *inherently contradictory* when applied to these groups—forcing institutions to confront tradeoffs rather than hide behind aggregates.  
  2. **"Criteria Miss the Point: Compare to Human Baseline"**:  
     Fairness isn’t about mathematical parity but improving outcomes. The classifier should be judged on whether *all groups benefit* vs. human decisions (e.g., does approval/repayment rise for Retail in both regions?). The impossibility result is decisive because it exposes metrics that distract from welfare-based goals.  

  ---

  ### The Unobservable Outcome Problem  
  **Critical Issue**: The bank only observes repayment outcomes for **approved** applicants. Rejected applicants’ outcomes are missing, making true subpopulation repayment rates **unobservable**.  
  - **Theorem Inputs Are Artifacts of Past Policy**: The 70%/50%/80%/40% rates are estimated from *historically approved loans*, biased by previous discriminatory practices (e.g., if Retail applicants were under-approved, their true rates are misestimated).  
  - **Goodhart’s Law in Action**: When the bank optimizes for fairness metrics on observed data, it distorts incentives (e.g., approving risky applicants in disadvantaged groups to "prove" fairness), worsening actual outcomes.  
  - **Formal Result Goes Silent**: The impossibility theorems assume known base rates. When true rates are unobservable, the result lacks formal grounding. Audits may flag "unfairness" that reflects past bias, not current model flaws.  

  **Conclusion**: The impossibility results are not mathematical verdicts on fairness but artifacts of *which partitions and data we legitimize*. The unobservable outcome problem exacerbates this, turning fairness into a self-fulfilling prophecy shaped by historical inequities. To avoid this, fairness must be defined dynamically (e.g., impact on welfare over time) rather than as a static snapshot.  

  ---  
  **Final Note**: This case isolates the partition as the load-bearing variable. Identical features, outcomes, and classifiers yield compatible metrics under coarse groups but trigger impossibility under finer groups—proving the conflict is structural, not numerical. The burden is on regulators and institutions to justify *why* a partition matters, not to invoke theorems as oracles.
