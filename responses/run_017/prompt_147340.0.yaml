  The steelman for the importance of the impossibility results:

  1. The fine partition is the honest one and the coarse one is concealing disparities.
     - The coarse groups (urban/rural) might conceal significant variation within. For example, within urban areas, the service industry has a 70% repayment rate while retail has 50%. By only reporting at the coarse level, we hide the struggle of urban retail businesses. Similarly, in rural areas, agriculture does well (80%) but retail does poorly (40%). The regulator should care about the subpopulations because they might be historically disadvantaged groups that are being misrepresented by the aggregate.

  2. The criteria were never the right target because what matters is whether each group ends up better off than under the human baseline.
