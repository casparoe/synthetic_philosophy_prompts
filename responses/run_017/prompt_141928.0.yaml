  The user's deeper need might be to justify their committee's rule philosophically and practically. They might fear their approach is ad hoc. They want a coherent framework to defend the rule or understand its implications if changed.

  Breaking down the implicit theory: The rule seems rooted in Knightian uncertainty (risk vs. uncertainty distinction). Modelled uncertainty has agreed structure; open uncertainty lacks any model. The known-mixture clause treats epistemic uncertainty with known probabilities differently from ambiguity. This aligns with ambiguity aversion, where people prefer known risks over unknowns. The rule views ambiguity aversion as rational in ethics contexts, perhaps due to the stakes involved in medical research.

  For the friend's second point, worst-casing is mathematically equivalent to maxmin expected utility, a specific decision rule. The difference is in how the set of probabilities is formed. The rule refuses to average when models are contested, preserving model uncertainty. This isn't just pessimism but a meta-decision about legitimate probabilities.

  On negligence vs. precautionary principle: They address different questions. Negligence focuses on blame for actions taken, ignoring unknowables. The precautionary principle guides preventative action under uncertainty. The ethics committee's role is closer to the latter, preventing harm in trials, not assigning blame.

  If adopting the friend's single-probability approach, the committee would average all uncertainties, treating the urn case like the coin flip. This might overlook legitimate expert disagreement, potentially exposing subjects to unquantified risks. Legal and regulatory practices might clash, especially where ambiguity aversion is accepted, like in environmental regulations.

  The user might lose a safeguard against poorly understood risks. In medical ethics, protecting participants from ambiguous harms could justify the rule despite theoretical criticisms. The rule's strength is its handling of genuine disagreement, which averaging might dilute. Abandoning it might lead to underestimating risks in model-disputed scenarios.
answer: |-
  The two-tier rule your committee uses is a sophisticated institutional implementation of a **Knightian-Klibanoff-Maccheroni (KKM) framework**, blending Frank Knight's risk/uncertainty distinction with modern ambiguity-averse decision theory. It presupposes that rational choice under uncertainty requires different *epistemic attitudes* depending on whether probabilities are "defensible" (grounded in intersubjective agreement). Below is a reconstruction of its implicit theory, addressing each charge and implication:

  ---

  ### **Core Presuppositions of the Two-Tier Rule**
  1. **Epistemic Threshold for Probabilities**:  
     A probability is only "defensible" if experts agree on a *model structure* (e.g., binomial distribution). Parameter uncertainty within an agreed model is "measurable" ignorance; model disagreement is "radical" ignorance.  
     - *Modelled uncertainty*: Averaging parameters respects the **Principle of Insufficient Reason**—no grounds to privilege one parameter over another.  
     - *Open uncertainty*: No shared model exists to justify *any* probability. Aggregating would impose false precision.

  2. **Ambiguity Aversion as Rationally Required in Ethics Contexts**:  
     The rule treats ambiguity aversion (preferring known risks over unknown uncertainties) as **normatively compelling for research ethics**, not a cognitive bias. This stems from:  
     - **Participant Protection Priority**: Exposing subjects to ambiguously bounded risks (e.g., unknown harm severity) is inherently less justifiable than exposing them to quantifiable risks.  
     - **Epistemic Humility**: Worst-casing acknowledges the limits of expert knowledge. If experts dispute models, the committee defaults to caution.

  3. **Source Matters, Not Just Probability Values**:  
     The known-mixture clause reveals that the rule prioritizes **how probabilities are generated**, not just their numerical value:  
     - *Coin-flip mixture*: The 50% probability arises from a *controlled physical process* (fair coin), making it "defensible" even before tossing.  
     - *Ellsberg urn*: The absence of a physical/mathematical anchor for the distribution makes probability assignments arbitrary.  
     → This presupposes that probabilities require **ontological grounding** (e.g., symmetry, frequency) to be actionable in ethics.  

  ---

  ### **Responses to Charges**
  #### **Charge 1: Informational Equivalence of Coin vs. Urn Cases**  
  The rule *denies* informational equivalence:  
  - **Coin case**: The 50/50 split is *counterfactually stable*—it holds across possible worlds (e.g., "if the coin were tossed 100 times, 50 would be heads").  
  - **Urn case**: No such stability exists. The ratio of black/yellow balls could be 59:1 or 1:59—no defensible expectation.  
  → This reflects **Levi's credal set theory**: Rational agents may reject precise probabilities when evidence is "incomplete." The rule presupposes that ethics committees *should* share this conservatism.  

  #### **Charge 2: Worst-Casing as Pessimistic Expected Value**  
  - **Mathematical Equivalence**: Yes, worst-casing is extensionally identical to maximizing expected utility under a single, pessimistic prior (*minimax EU*).  
  - **Key Departure**: The rule’s innovation is in **how the set of possible models is constructed**:  
    - *Modelled uncertainty*: Experts agree on the set of distributions (e.g., Beta distributions for a binomial parameter).  
    - *Open uncertainty*: Experts disagree on the set itself (e.g., "Is a Poisson model appropriate?").  
  → The "two tiers" reflect a **meta-consensus requirement**: Only when experts concur on the *type* of model does averaging apply. Otherwise, the set of possibilities remains "open," warranting worst-case evaluation.  

  #### **Charge 3: Inconsistency with Negligence Law vs. Precautionary Principle**  
  These address fundamentally different questions:  
  - **Negligence Law** ("reasonable foreseeability"): Focuses on *blame* for *past actions*. Unforeseeable risks are irrelevant to blame assignment.  
  - **Precautionary Principle**: Guides *future interventions* under uncertainty. Ambiguity *amplifies* precaution.  
  - **Ethics Committee's Role**: Like the precautionary principle, it is *prospective* and *protective*. Ambiguity increases responsibility to avoid harm.  
  → **No conflict**: The rule aligns with precautionary ethics for research, while negligence law addresses culpability ex post.  

  ---

  ### **What Would Change Under Your Friend's "Single-Probability" View?**  
  Adopting strict Bayesianism (all uncertainties reduced to single probabilities) would require:  
  1. **Averaging in Open Uncertainty**: Treat Ellsberg urns like coin mixtures—e.g., assume uniform priors over possible models.  
  2. **Reject Ambiguity Aversion**: Classify worst-casing as an irrational bias.  
  3. **Legal/Regulatory Shifts**:  
     - **Informed Consent**: Disclose only expected values, not model disagreements or worst cases.  
     - **Environmental Regulation**: Precautionary measures could be challenged as "overweighting ambiguity."  

  #### **What Would Be Lost?**  
  - **Robustness to Expert Disagreement**: Averaging across incompatible models hides uncertainty, potentially underestimating tail risks.  
  - **Epistemic Integrity**: Forcing single probabilities onto open uncertainty may misrepresent scientific dissent.  
  - **Participant Trust**: Subjects might reject trials if ambiguities are glossed over as "averaged away."  

  ---

  ### **Conclusion: The Rule as Principled Compromise**  
  Your committee’s rule presupposes a **contextual rationalism**:  
  - **Modelled uncertainty** → *Consensus justifies averaging*.  
  - **Open uncertainty** → *Dissensus demands caution*.  
  It elevates ambiguity aversion to a **normative principle for research ethics**, distinguishing between "risk we can quantify" and "uncertainty we must respect." While mathematically reducible to minimax EU, its power lies in **institutional epistemology**—how committees legitimize probabilities amid disagreement. Abandoning it would gain coherence in decision theory but lose critical safeguards for human subjects when knowledge fails.  

  *Would you like to explore how this framework applies to a specific case your committee has faced?*
