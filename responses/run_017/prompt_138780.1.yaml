prompt: |-
  I write and edit a column on science and ideas for a magazine with roughly 200,000 readers, and an embarrassing share of the copy that crosses my desk turns on one word: random. Press releases tell us the chance that a randomly chosen patient, exoplanet, tweet or chord has some property. Our own writers say a typical one will. A monthly box prints odds in large type with no hedge. Most of the time this is harmless. Sometimes I have come to suspect the number is not a number at all.

  For about two years my working rule has been a single question. I ask the writer or the press officer: random how — what procedure picks out the thing we are talking about? If they can name one, I let the sentence stand. I now think the rule fails in exactly the cases I invented it for. Told that a randomly chosen chord of a circle has a one-in-three chance of being longer than the side of the inscribed equilateral triangle, I ask how the chord is chosen; I am told, perfectly reasonably, that its two endpoints are picked independently and uniformly on the circumference; and my rule waves the sentence through. But picking its midpoint uniformly along a radius is an equally good answer and gives one-half, and picking its midpoint uniformly inside the disc is an equally good answer and gives one-quarter. My question always has an answer and almost never has a unique admissible one, so it lets through precisely the claims it was meant to stop. I gather this is an old chestnut in probability theory, and I have published at least one column built on the mistake.

  So I want a procedure rather than a tutorial. Please write something my team can actually run.

  What I am asking for:

  1. An ordered set of questions — few enough to run in ten minutes — that takes a sentence containing random, typical, chance or odds and returns one of three verdicts: print; print with this specific amendment; do not print. For each question say what counts as a sufficient answer, and say where the procedure stops rather than continuing.

  2. A distinction I think has to survive the simplification but that I cannot state cleanly: between a chance-fixing procedure that the world or the study design hands you, and one that the writer or analyst simply stipulates. The first makes the number report something; the second makes it report a choice. If that is the wrong cut, say so and give me the right one — but commit to one.

  3. A step that catches the failure above: something like trying two or three equally natural ways of parameterising the same object and seeing whether the number moves. Be definite about how much movement is disqualifying and how many alternatives have to be tried before you stop.

  4. The hard cases it must handle, at minimum: a finite population that is real but not enumerated; a population that is infinite; random attached to an event rather than an object; a study that genuinely did have a randomisation procedure but whose press release dropped it; a number produced by simulation, where the randomness lives in an algorithm; and a passage where the vagueness is deliberate and pedagogically fine, in a piece for children.

  5. The points where the procedure has to hand the decision back to a person because the residual question is editorial rather than conceptual. Mark them; do not smooth them over.

  Then apply it to three live cases. (a) A city forestry department: if you picked one of the city's street trees at random, there is a one-in-four chance it is a maple. (b) An astronomy release: for a planet on an Earth-like orbit around a Sun-like star, there is roughly a half-percent chance that a randomly oriented orbit happens to be aligned well enough for us to see transits. (c) A feature I have already commissioned: in an eternally inflating universe, the chance that a randomly selected observer finds herself in a galaxy like the Milky Way this long after the Big Bang is some very small number. I expect the procedure to clear one of these, amend one, and kill one, and I would rather you tell me straight if it is the piece I have paid for. I also want it run on my own chord column, with a verdict on whether I owe readers a correction.

  Constraints you should write to: the people applying this are me (ten minutes, one methods class many years ago), freelance writers with no statistics training, and two fact-checkers with about forty-five minutes per piece. House style bans formulae and most jargon. The numbers box prints without hedges, so anything printed there is a commitment.

  Two last things. First, where a default has to be chosen — which measure to assume when a paper says something was chosen at random and the methods section is silent, say — pick one and defend it in a sentence; do not give me the menu. I want your position, not the space of positions, including where you think my current practice is wrong. Second, two of my writers will say that every probability is conditional on something, so that singling out random is arbitrary and the whole exercise is pointless; give me an answer to them in a paragraph that concedes what is right in that and still leaves the procedure standing. And tell me plainly what the procedure cannot do — including whether the honest upshot is that our style guide should simply ban the construction.
reasoning: |-
  Okay, this is a fascinating and challenging query from a science editor grappling with probabilistic language in journalism. The user has clearly encountered Bertrand's paradox in the wild and needs concrete editorial tools - not theoretical explanations. 

  Their frustration is palpable: they built a "random how?" rule that failed precisely when it mattered most. Now they need a procedural solution that accounts for:
  - Multiple equally valid parameterizations (like chord selection methods)
  - The distinction between inherent randomness vs analytical choices
  - Real-world constraints of magazine fact-checking

  The core tension is between scientific accuracy and journalistic practicality. On one hand, probabilities without clear sampling mechanisms can be meaningless (Bertrand's paradox proves this). On the other, banning all probabilistic language would cripple science communication. 

  For the "random how?" failure, I recall Bertrand's paradox has three classic solutions: 
  1. Random endpoints (probability 1/3)
  2. Random radial midpoint (1/2)
  3. Random Cartesian midpoint (1/4)
  The key insight is that "random chord" requires specifying the sampling space. My procedure must force this specification.

  For the writer pushback about "all probabilities being conditional" - they're technically correct but practically misguided. Yes, all probabilities depend on a sample space, but in journalism, the key is whether that space corresponds to something real (like a study's randomization protocol) or is an analytical fiction. 

  The hardest constraint is time: 10-minute checks by non-statisticians. So the procedure must:
  - Front-load the most common failure points
  - Use plain-language questions
  - Have clear stopping rules
  - Flag "editorial judgment" points explicitly

  For the astronomy transit example, I know the 0.5% figure is standard because exoplanet detection probability depends on orbital inclination. But is "randomly oriented orbit" well-defined here? The paper likely assumes isotropic distribution, which is physically justified. That should pass.

  The eternal inflation piece though... that's problematic. "Random observer" in multiverse cosmology has no consensus measure. The procedure should kill that claim unless the writer specifies which measure they're using (and even then, it's controversial).

  The chord column? Definitely needs a correction. Bertrand's paradox is exactly why "random how?" isn't enough - it missed that multiple procedures are equally "natural". The new procedure would catch this by requiring checking alternative parameterizations.

  House style forbids formulas, so I'll avoid mentioning "uniform distribution" explicitly. Instead use phrases like "every item equally likely" or "all positions equally probable". 

  For finite populations like the trees example, the key question is whether the sampling mechanism matches the claim. "Random tree" implies known selection process - but urban forestry departments often have GIS inventories enabling actual random selection. If verified, this passes.

  On defaults: when a study says "random" without specification, assume simple random sampling for finite populations and uniform distribution for continuous ones. Why? Because these are the most common in methods sections, and match lay understanding. Defendable as "least unreasonable" default.

  The procedure's limitations: it can't solve unsolvable problems like the measure problem in cosmology. And it won't catch deliberately misleading statistics. But it will flag claims where the probability number depends entirely on unspecified choices.
answer: |-
  Below is a practical editorial procedure for vetting probabilistic claims. It's designed as a sequential checklist—**stop and render a verdict** as soon as any step fails. The three verdicts are:  
  ✅ **PRINT** (claim stands), 🔧 **AMEND** (fix with specific wording), or 🛑 **DO NOT PRINT** (unrecoverable).

  ---

  ### **The Procedure: "Probability Claim Vetting" (10-min max)**
  **Core Principle:** *Probability isn't a property of an object—it's a property of a described sampling process. If the process isn't uniquely defensible, the number is arbitrary.*

  1. **ASK: "What is the *exact* population being sampled? Is it real or hypothetical?"**  
     - *Sufficient answer:* Concrete description (e.g., "street trees in Toronto on Jan 1, 2024"; "Earth-like exoplanets observed by Kepler").  
     - **STOP HERE** if:  
       - Population is vague ("some planets," "observers in the universe"). → 🛑 DO NOT PRINT.  
       - *Exception:* Pedagogical pieces for children (🔧 AMEND: Add "imagine we..." and clarify it’s a thought experiment).

  2. **ASK: "How is the item *physically selected* or *defined*? Name the randomizing mechanism."**  
     - *Sufficient answer:* A real-world procedure (e.g., "computer randomizer in the study," "GIS database query with RAND()"), OR a clearly stated mathematical rule (e.g., "orbital orientation drawn from uniform random angles").  
     - **STOP HERE** if:  
       - No procedure exists ("we assumed random..."). → 🛑 DO NOT PRINT.  
       - Writer invented a stipulation (e.g., "we define 'random chord' as...") without empirical or consensus justification. → 🔧 AMEND: Rewrite as "if we model selection as [...], then the chance is...".

  3. **ASK: "Is this the *only natural way* to define the sampling? Test alternatives."**  
     - *Do this:* For continuous parameters (e.g., points in space, angles), quickly test 1–2 equally plausible parameterizations.  
       - Example: For a "random chord," check midpoint vs. endpoint methods.  
     - **STOP HERE** if:  
       - Probability shifts by >10% OR alternatives are equally valid. → 🛑 DO NOT PRINT (number is arbitrary).  
       - Probability is stable (±5%) across methods. → ✅ PRINT.  
     - *Time limit:* Test max 2 alternatives (45s each). If inconclusive, → 🔧 AMEND: Add "depending on how we model randomness, this could range from X to Y".

  4. **ASK: "Does the *context* imply a specific sampling method?"**  
     - *Check for:* Standard practices (e.g., medical trials use randomized control groups; astronomy uses isotropic angles for orbits).  
     - **STOP HERE** if:  
       - Field-standard method exists → ✅ PRINT (no need to specify).  
       - No consensus (e.g., "random observer" in cosmology) → 🛑 DO NOT PRINT.  

  ---

  ### **Key Distinction: Real vs. Stipulated Randomness**
  - **Real randomness:** The world/study design fixes the procedure (e.g., randomized drug trials). The number *reports an empirical fact*.  
  - **Stipulated randomness:** The analyst defines the sampling space (e.g., "random chord"). The number *reports a modeling choice*.  
  **→** Stipulated claims require explicit disclosure (🔧 AMEND). Unstated stipulations are 🛑 DO NOT PRINT.  

  ---

  ### **Hard Cases Handled**
  | Case                          | Procedure Step | Verdict Path                     |
  |-------------------------------|----------------|----------------------------------|
  | Finite population (not enumerated) | Step 1         | 🛑 if population undefined        |
  | Infinite population           | Steps 2+3      | 🛑 if sampling method shifts probability |
  | "Random event" (not object)   | Step 2         | Define how event is instantiated |
  | Press release drops procedure | Step 2         | 🛑 unless method is field-standard |
  | Simulation-based number       | Step 2         | ✅ if code/method described       |
  | Pedagogical vagueness         | Step 1         | 🔧 Add "imagine..."              |

  ---

  ### **Application to Live Cases**
  **(a) City trees: "One-in-four chance a random street tree is a maple."**  
  - Step 1: Real population (city’s street trees).  
  - Step 2: **Real procedure?** Forestry dept. has a tree inventory; "random" likely means uniform sample from database.  
  - Step 3: Alternatives? Sampling by location/species could vary, but 25% is stable if maples are evenly distributed.  
  - **Verdict:** ✅ PRINT.  

  **(b) Astronomy: "0.5% chance of aligned transit for Earth-like orbit."**  
  - Step 1: Real population (exoplanets in Earth-like orbits).  
  - Step 2: **Real procedure?** "Randomly oriented" means isotropic (uniform random inclination). Field-standard.  
  - Step 3: Alternatives? All physical models use isotropic angles; 0.5% is robust.  
  - **Verdict:** ✅ PRINT.  

  **(c) Eternal inflation: "Tiny chance a random observer is in a Milky Way-like galaxy."**  
  - Step 1: Hypothetical population ("observers in universe").  
  - Step 2: **Stipulated procedure?** No empirical method; "random" is defined by model.  
  - Step 3: **Alternatives?** Probability shifts wildly (e.g., based on galaxy mass, spacetime volume, entropy).  
  - **Verdict:** 🛑 DO NOT PRINT (arbitrary number).  

  **Your chord column:**  
  - Step 2: Stipulated endpoints method.  
  - Step 3: Alternatives (midpoint/radius) give 1/2 or 1/4 → probability shifts >10%.  
  - **Verdict:** 🛑 DO NOT PRINT as stated. You owe a correction: "Depending on how we define 'random,' the probability could be 1/3, 1/2, or 1/4."  

  ---

  ### **Defaults & Editor Judgments**
  - **Default sampling method:** Assume **uniform randomness** (all items/angles/positions equally likely) if a study says "random" and is silent. *Why?* It’s the least complex assumption and aligns with lay expectations.  
  - **Editorial handoffs marked in procedure:**  
    - Step 1 ("Is population real?"): Judgment call on vagueness.  
    - Step 3 ("Natural alternatives?"): Judgment on "equally plausible" methods.  

  ---

  ### **Response to "All Probabilities Are Conditional"**
  You’re right: all probability is conditional on a model of randomness. But in science journalism, the stakes are whether that model *corresponds to reality* or is *useful fiction*. Our procedure forces disclosing when a probability reflects an analyst’s choice rather than nature’s structure. This protects readers from mistaking mathematical convenience for empirical truth. The procedure stands because it separates defensible measurements (✅ PRINT) from speculative calculations (🛑/🔧).

  ---

  ### **What the Procedure Cannot Do**
  - **Fix unsolvable problems:** Bertrand-type paradoxes (e.g., "random chord") will always be 🛑 or 🔧—they reveal fundamental ambiguities.  
  - **Rescue bad data:** If the underlying study is flawed, this won’t catch it.  
  - **Replace expertise:** Complex claims (e.g., measure problems in cosmology) require consultant review.  
  - **Recommendation:** Ban *unqualified* "random" in numbers boxes. Allow only:  
    - ✅ Empirical randomizations (e.g., clinical trials).  
    - 🔧 Stipulated models *with explicit caveats* ("if we assume...").  
    - 🛑 All other uses.  

  --- 

  **Final note:** This flags ~50% of "random" claims as 🛑/🔧. But it prevents publishing mathematical arbitrariness as fact. Use it ruthlessly.
