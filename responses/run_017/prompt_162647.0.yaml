prompt: |-
  I convene a fortnightly seminar for graduate students in philosophy of mind and cognitive neuroscience, and two of the regulars have been at a standstill since October. Nadia defends something like classical role-functionalism: mental kinds are causal roles within a system's broader functional organisation, and the multiple-realizability argument — that one and the same mental kind can be filled by wildly different physical kinds — is the master argument for that view and against any neural identity theory, because it shows the mental kind is not the physical kind. Tobias defends what he calls realizationism: realization is a constitutive part–whole relation in which a realizer's own causal powers ground the powers of the larger system, so what a state is mentally depends not only on the role it occupies but on what it is made of; and he thinks the multiple-realizability argument is at once empirically overstated (once you hold the taxonomy of the compared systems fixed, the apparent multiplicity shrinks) and metaphysically inert (real multiple realizability, if there is any, is equally compatible with his view, so it cannot be evidence for hers). Their dispute has become one of those arguments where each side has a fully general way of reinterpreting whatever the other says. I have persuaded them to close the term with an adversarial collaboration, and I have agreed to chair it.

  What I want from you is the document itself, and it should not lean on the literature: no citations, no reading lists, no ascriptions of views to named authors or papers. Argue everything from scratch, as if the room had no internet, because the point is for the seminar to see whether the multiple-realizability argument has any probative force left once it is stated carefully. Draft four parts. (1) A numbered section of agreed claims — at least ten, each substantive enough that a partisan would feel the pinch of signing it, with at least two claims Nadia would be reluctant to accept and at least two Tobias would be reluctant to accept; include among them an agreed characterization of what would count as a case of multiple realizability worth arguing about. (2) A disagreements table with four columns: the issue; the formulation Nadia would accept for her own position; the formulation Tobias would accept for his; and a note on why that disagreement is not merely verbal. (3) Three cruxes, i.e. sub-questions such that settling one would move at least one of them. (4) A short closing audit stating which parts of the dispute you take to be verbal, if any, why, and what would settle whether they are.

  To keep both of them honest I am stipulating the evidence-generating setup they have already jointly accepted, and I want the cruxes built around it rather than around the usual stock examples. Call it the graft/rewire protocol. A graft intervention replaces the neural state type that normally fills role R in a living subject with a structurally different state type drawn from another lineage, wired so that it receives the same inputs from and sends the same outputs to the rest of the system, while differing in everything that channel does not screen off: internal structure, metabolic cost, temperature sensitivity, drug response, noise profile. A rewire intervention instead holds the realizer fixed and alters its wider embedding, changing its upstream and downstream partners while preserving its causal profile inside the local channel. Assume both are performable and leave the subject conscious and able to report, and assume that rewire interventions sometimes yield a subject whose reports and discriminations we would classify under a different mental kind although the realizer is unchanged — the one-realizer-many-roles flip side of multiple realizability.

  My candidate cruxes, which you should use or replace: (a) grain — how finely the role must be specified, given that a fine grain threatens to make cross-system multiple realizability vanish while a coarse grain threatens to let intuitively non-mental realizers in, such as a graft assembled from an entire organ, from a population of trained workers, or from a market; (b) the taxonomic bridge — what entitles us to call the role in two differently embodied, differently environed systems the same role, given that roles are specified over inputs and outputs and the two systems may share no input/output taxonomy; (c) inheritance — whether the realizer's own powers must constitutively ground the role's causal powers or whether merely occupying the role suffices, and in particular whether Nadia can state that requirement without conceding Tobias's view and whether Tobias can still explain why multiple-realizability evidence seemed to matter in the first place. For each crux give a concrete case or result under the graft/rewire protocol that both would accept as bearing on it, and record each side's prediction in advance, concretely enough that a null result or a surprise actually costs somebody something: no crux where both sides can absorb any outcome. Finally, two constraints on the dialectic. Nadia may not solve the grain problem by stipulating that the correct grain is whatever grain the actual neural realizer happens to have, and Tobias may not solve the bridge problem by denying that cross-species mental ascriptions are ever true. Where someone has to bite a bullet, say which bullet it is and what it costs them.
reasoning: |-
  We are drafting an adversarial collaboration document for Nadia (functionalist) and Tobias (realizationist). The goal is to structure their debate around the graft/rewire protocol and the cruxes (grain, taxonomic bridge, inheritance) without relying on literature.

  Document Structure:
  1. Agreed Claims (at least 10, with at least two that pinch each side)
  2. Disagreements Table (issue, Nadia's formulation, Tobias's formulation, why not verbal)
  3. Three Cruxes (with concrete cases from graft/rewire, predictions, and consequences)
  4. Closing Audit (which parts are verbal, why, and how to settle)

  Constraints:
  - No citations, no literature.
  - Use graft/rewire protocol as the evidence-generating setup.
  - Cruxes: grain, taxonomic bridge, inheritance (or replace with these if using).
  - Nadia cannot stipulate grain by actual neural realizer; Tobias cannot deny cross-species mental ascriptions.

  Let's start with Part 1: Agreed Claims.

  We need at least ten substantive claims. Each should be something both can agree to, but with at least two that each side is reluctant to accept.

  Agreed Claims:

  1. Mental states are states of a system that play a causal role in mediating between sensory inputs, other mental states, and behavioral outputs.

  2. The same mental state (e.g., pain) can occur in systems with different physical constitutions (e.g., humans, octopuses, androids) — at least in principle.

  3. A mental state's causal role is defined by a set of causal relations (inputs, outputs, interactions with other states) that are characteristic of that state.

  4. The physical realizer of a mental state is the physical state or process that occupies the causal role in a given system.

  5. Multiple realizability (MR) is the possibility that the same mental state (same causal role) can be realized by different physical kinds in different systems or in the same system at different times.

  6. For MR to be worth arguing about, the different realizers must be non-trivially distinct: they must differ in their intrinsic physical properties (e.g., microstructure, material composition, energy requirements) and not merely in contingent or extrinsic properties (like spatial location or time of occurrence). (This pinches both: Nadia might want to include any difference, Tobias might want to constrain it to substantial differences that matter for realization.)

  7. The graft intervention (replacing the neural state with a structurally different one while preserving input-output relations) and the rewire intervention (changing the embedding while preserving the realizer's local causal profile) are possible in principle and can be performed without eliminating consciousness or the ability to report.

  8. In a rewire intervention, it is possible to change the mental state (as judged by reports and discriminations) while keeping the realizer fixed. (This is the one-realizer-many-roles phenomenon.)

  9. The causal powers of a mental state are determined by the causal role it occupies in the system.

  10. The physical realizer has its own causal powers, which are determined by its intrinsic properties and the laws of nature.

  11. The causal powers of the mental state must be somehow related to the causal powers of the physical realizer. (This is vague enough to agree but sets up the inheritance dispute.)

  12. The taxonomy of mental states is not arbitrary but must be grounded in patterns of similarity and difference in behavior, experience, and causal role. (Tobias might be reluctant because he thinks the realizer matters for the taxonomy, but he can agree that patterns matter.)

  13. If two systems are in the same mental state, they must be in states that are similar in causal role to a degree that warrants the same mental description. (Nadia might be reluctant because she thinks the role must be identical, but she can accept similarity.)

  Now, we need at least two that pinch Nadia and two that pinch Tobias.

  For Nadia (functionalist), she might be reluctant to accept claims that emphasize the importance of the physical realizer beyond merely occupying the role.

  For Tobias, he might be reluctant to accept claims that downplay the constitutive role of the realizer.

  Pinches for Nadia:

  - Claim 10: "The physical realizer has its own causal powers, which are determined by its intrinsic properties and the laws of nature." (She might worry that this gives too much weight to the realizer, but she can accept it as a truism.)

  - Claim 11: "The causal powers of the mental state must be somehow related to the causal powers of the physical realizer." (She would prefer that the mental state's powers are entirely defined by the role and that the realizer's powers are only relevant as they occupy the role. But she can agree there is a relation.)

  Pinches for Tobias:

  - Claim 2: "The same mental state can occur in systems with different physical constitutions." (He might be reluctant because he thinks that the physical realizer matters for what the mental state is, so he might prefer that the sameness is only approximate. But he accepts the possibility in principle, so it's a pinch.)

  - Claim 8: "In a rewire intervention, it is possible to change the mental state while keeping the realizer fixed." (This directly supports multiple realizability in one direction, which he might be reluctant to accept without qualification, but he has already accepted it in the protocol.)

  We have 13 claims. We can trim to 10 or more. Let's list 10-12.

  Final list of agreed claims (we'll pick 10-12):

  1. Mental states are defined by their causal roles in mediating inputs, internal states, and outputs.

  2. Multiple realizability (MR) is possible: the same mental state can be realized by different physical kinds in different systems or the same system at different times.

  3. For MR to be non-trivial, the different realizers must be non-trivially distinct in their intrinsic physical properties (not just extrinsic or trivial differences).

  4. The graft intervention replaces a neural state type with a structurally different one while preserving input-output relations and leaves the subject conscious and report-capable.

  5. The rewire intervention changes the embedding of a realizer, altering its upstream and downstream partners while preserving its local causal profile, and leaves the subject conscious and report-capable.

  6. Rewire interventions can result in a change of mental state (as evidenced by reports and discriminations) while the realizer remains unchanged.

  7. The causal powers of a mental state are determined by its causal role.

  8. The physical realizer has intrinsic causal powers.

  9. The causal powers of the mental state must be related to the causal powers of the physical realizer.

  10. Mental state taxonomies must be grounded in patterns of behavior, experience, and causal role.

  11. Two systems in the same mental state must have states that are sufficiently similar in causal role to warrant the same mental description.

  12. The graft and rewire protocols are valid experimental setups to test the dependence of mental states on roles and realizers.

  We have 12. We can stop.

  Part 2: Disagreements Table

  Four columns: issue, Nadia's formulation, Tobias's formulation, why not verbal.

  Issues:

  1. What constitutes the mental state?

  2. How does multiple realizability bear on the nature of mental states?

  3. What is the relationship between the realizer's causal powers and the mental state's causal powers?

  4. How fine-grained must the causal role be to define a mental state?

  5. Can the same causal role be identified across different systems with different input-output taxonomies?

  We'll pick four key disagreements.

  Disagreements Table:

  | Issue | Nadia's Formulation | Tobias's Formulation | Why not verbal |
  |-------|---------------------|----------------------|---------------|
  | The nature of mental states | A mental state is identical to its causal role. The physical realizer is merely the occupant of that role and does not contribute to the identity of the mental state. | A mental state is a state of the system that is realized by a physical realizer, and the nature of the mental state depends constitutively on the realizer. The causal role is a necessary but not sufficient condition. | The disagreement is about the constitutive grounds of the mental state. For Nadia, the role is sufficient for the mental state; for Tobias, the realizer is part of the constitution. This is not verbal because it leads to different predictions about what counts as the same mental state in different realizers and about the necessity of the realizer for the mental state's identity. |
  | The significance of multiple realizability | Multiple realizability shows that mental states are not identical to physical states because the same mental state can be realized by different physical states, and thus the mental state is distinct from any particular physical state. | Multiple realizability, if it occurs, is compatible with realizationism because the realizer in each case is what grounds the mental state. MR does not show that the mental state is distinct from the physical state; it shows that the same functional role can be grounded in different physical states, each of which is part of a different mental state. | The disagreement is about whether MR entails functionalism and refutes identity theory. For Nadia, MR is evidence for functionalism and against identity theory; for Tobias, it is consistent with identity at the level of the realized state. This is substantive because it affects how we interpret empirical cases of MR. |
  | The grain of causal roles | The grain of the causal role for a mental state is determined by the functional patterns that are relevant for explaining behavior and experience. It can be coarse-grained enough to abstract away from physical details. | The grain of the causal role must be fixed by the actual causal powers of the realizers. If the role is specified too coarsely, it may include systems that do not have the mental state because the realizer is inadequate. | The disagreement is about the criteria for individuating causal roles. For Nadia, the grain is fixed by functional considerations; for Tobias, it must be constrained by the realizer's properties. This leads to different verdicts on cases (e.g., graft with a very different realizer). |
  | Cross-system role identity | The same causal role can be identified across different systems by abstracting from the specific input-output taxonomies to a common functional pattern. | Without a shared physical basis or a common environment, it is not clear that the roles are the same; the physical realizer provides the bridge for comparing roles. | The disagreement is about how to establish role identity across systems. For Nadia, functional similarity suffices; for Tobias, functional similarity alone is insufficient without a realizer-based constraint. This affects whether we can attribute the same mental state to differently embodied systems. |

  Part 3: Three Cruxes

  We use the candidate cruxes: grain, taxonomic bridge, inheritance.

  For each crux:
  - A concrete case or result under graft/rewire
  - Each side's prediction
  - Consequence: what happens if the prediction is wrong?

  Crux 1: Grain

  Issue: How finely must the causal role be specified? If too fine, MR vanishes; if too coarse, non-mental realizers (like a market) might count.

  Concrete case: Perform a graft intervention where the realizer is replaced by a non-neural system. For example, graft a market-based system (as in the constraint) that receives inputs about supply and demand and outputs prices, and connect it to a neural system so that it mediates between sensory inputs and behavioral outputs in a way that preserves the input-output profile of a neural state type. The question is whether the subject experiences the mental state (e.g., pain) when the graft is active.

  - Nadia's prediction: If the input-output profile is preserved, the mental state (pain) is present. The market is a valid realizer.

  - Tobias's prediction: The mental state is not present because the market, being a non-neural, distributed system, lacks the intrinsic properties required to ground the causal powers of pain. The subject may report pain, but that report is mistaken or the state is not genuine pain.

  Consequence: 
  - If the subject reports pain and behaves as if in pain, Nadia is supported; if the subject does not report pain or the behavior is not genuinely pain-like (despite the output matching), Tobias is supported.
  - But note: the protocol says the subject is conscious and able to report. We assume the graft is successful in preserving input-output. The test is whether we attribute the mental state.

  If the subject reports pain and we accept it, then Tobias must explain why the market can be a realizer (which he denies) or why the report is misleading. He bites the bullet: the market is not a realizer, so the mental state is not present, meaning the report is not veridical. This costs him because he has to deny the subject's report.

  If the subject does not report pain or the pain behavior is absent despite the outputs, then Nadia must explain the failure. She bites the bullet: the grain was too coarse and the input-output profile was not perfectly preserved, or the market does not have the right kind of causal powers. This costs her because it shows that the realizer matters.

  Crux 2: Taxonomic Bridge

  Issue: How can we identify the same role across different systems with different input/output taxonomies?

  Concrete case: Consider two different species, say a human and an octopus. We identify a state in both that we call "pain" based on similar behavioral responses (withdrawal, learning to avoid) and similar roles in their respective systems. Then, we perform a graft from the octopus to the human (or vice versa) and see if the mental state is preserved.

  But the protocol might not allow cross-species grafts? We can imagine a graft using an octopus neural state in a human, but that might be too speculative. Instead, use the rewire intervention: take a realizer from one context and embed it in a very different context (e.g., a human realizer rewired to function in an octopus-like body or vice versa). Alternatively, simulate it by altering the inputs and outputs to match a different species.

  But the protocol is for a living subject. So let's design:

  Take a human subject and a rewire intervention that alters the embedding so that the input-output relations are changed to match those typical of an octopus in a pain-like situation. The realizer is unchanged (human neuron). Then, we see what mental state the subject reports.

  - Nadia: If the causal role is the same (same inputs and outputs as octopus pain), then the mental state is pain (as in octopus), even though the realizer is human and the subject might report it differently. But we have to trust the report? The protocol says the subject can report, so we ask.

  Prediction: 
  - Nadia: The subject will report a state that we should classify as pain (octopus-type) because the role is the same. The realizer doesn't matter for the identity of the mental state.
  - Tobias: The subject will report a state that is not pain (octopus-type) because the realizer is human and thus grounds a human-type mental state. The role is not sufficient; the realizer matters.

  But the subject's report is in human terms. How do we bridge? We need an operational way.

  Alternative: Train the human subject to report in a way that matches octopus pain behavior. But that might not be possible.

  Instead, use the graft protocol: graft an octopus neural state into a human, preserving the input-output profile for a pain role. Then, see if the subject reports pain.

  - Nadia: The subject reports pain because the role is preserved.
  - Tobias: The subject might not report pain because the realizer is octopus-like and may not ground human pain. Or it might, but that would be because the realizer has similar properties.

  But the protocol says the graft is structurally different and we leave the subject conscious. We assume the graft works.

  Predictions:
  - Nadia: The grafted subject will report pain normally when the graft is active and the inputs are noxious.
  - Tobias: The grafted subject may report something unusual or not report pain because the realizer is different.

  Consequence:
  - If the subject reports pain normally, Nadia is supported; Tobias must explain why the octopus realizer works and may have to concede that the realizer's intrinsic properties don't matter as long as the role is filled, which undermines his view.
  - If the subject does not report pain or reports a different experience, Tobias is supported; Nadia must explain why the role wasn't preserved or why the report is not the same, which might force her to adjust the grain.

  Crux 3: Inheritance

  Issue: Must the realizer's causal powers ground the mental state's causal powers, or does occupying the role suffice?

  Concrete case: Perform a graft intervention with a realizer that has different intrinsic causal powers. For example, graft a realizer that is much slower (due to internal structure) but is designed to produce the same outputs for the same inputs, so the input-output profile is preserved. However, because it is slower, it might cause delays in the overall system, which could affect behavior in time-sensitive situations.

  But the protocol says "wired so that it receives the same inputs and sends the same outputs" — does this mean the timing is part of the output? We need to specify the role to include timing.

  Assume the role specification includes timing constraints. Then, if the grafted realizer is slower, it fails to meet the role. So we need a case where the realizer has a different causal power that is not captured in the input-output profile.

  Example: The grafted realizer has a different noise profile. Normally, the neural state has low noise, but the grafted one has high noise. However, due to error correction in the system, the outputs are the same. So the input-output profile is preserved, but the realizer's causal powers (noisy) are different.

  Now, test: When the system is under conditions that would expose the noise (e.g., in a high-interference environment), does the mental state break down? Or does the subject report the same mental state?

  - Nadia: Since the input-output profile is preserved, the mental state is the same. Any noise is screened off by the error correction and doesn't affect the role.
  - Tobias: The realizer's noise means that it does not ground the causal powers of the mental state as robustly. In conditions of interference, the mental state might fail, showing that the realizer's powers matter.

  Prediction:
  - Nadia: The subject will report the same mental state even under interference because the error correction maintains the input-output profile.
  - Tobias: Under interference, the grafted system may fail (e.g., the subject reports the mental state inaccurately or it disappears) while the original does not.

  Consequence:
  - If under interference the grafted system behaves the same as the original, Nadia is supported; Tobias must explain why the realizer's powers didn't matter.
  - If the grafted system fails under interference, Tobias is supported; Nadia must explain why the role wasn't preserved (but if the outputs are the same, she might say the mental state is the same, even if the system is less reliable, but then the reports might not match).

  We have to look at the subject's reports and discriminations. If the grafted subject, under interference, reports the mental state correctly and behaves appropriately, then the noise doesn't affect the mental state. If not, then it does.

  Part 4: Closing Audit

  We state which parts of the dispute are verbal and which are substantive, and how to settle.

  Now, write the document.
answer: |-
  ### Adversarial Collaboration Document: Multiple Realizability in the Graft/Rewire Protocol

  **Introduction**  
  This document structures the debate between Nadia (defending role-functionalism) and Tobias (defending realizationism) on the probative force of the multiple-realizability (MR) argument. It draws exclusively on the graft/rewire protocol as the evidence-generating setup, with no reliance on literature or external sources. The protocol is defined as follows:  
  - **Graft intervention**: Replaces the neural state type that normally fills a causal role \(R\) in a conscious, report-capable subject with a structurally different state type (differing in internal structure, metabolic cost, temperature sensitivity, drug response, and noise profile), while preserving \(R\)'s input-output relations to the rest of the system.  
  - **Rewire intervention**: Alters the wider embedding of a fixed realizer (changing upstream/downstream partners) while preserving its local causal profile, leaving the subject conscious and report-capable. Rewire interventions can yield a subject whose reports and discriminations change, indicating a shift in mental kind despite an unchanged realizer.  

  The document contains four parts:  
  1. **Agreed Claims**: 12 substantive claims, each requiring concession from both sides.  
  2. **Disagreements Table**: Key issues with each side's formulation and why disagreements are not verbal.  
  3. **Cruxes**: Three empirical sub-questions under the graft/rewire protocol, with predictions and consequences.  
  4. **Closing Audit**: Assessment of verbal vs. substantive disputes and how to settle them.  

  ---

  ### Part 1: Agreed Claims  
  The following claims are jointly endorsed. Each is substantive enough that a partisan would feel the "pinch" of signing it. At least two claims are reluctant concessions from Nadia (marked †) and two from Tobias (marked ‡). Claim 6 defines non-trivial MR, the core case for debate.  

  1. **Mental states are causal roles**: A mental state is individuated by its causal role—its patterns of interaction with sensory inputs, other mental states, and behavioral outputs.  
  2. **Realizers are physical occupiers**: The realizer of a mental state is the physical state that occupies its causal role in a system.  
  3. **MR is possible in principle**: The same mental state can be realized by different physical kinds across systems or times.  
  4. **Rewire confirms role-dependence**: Rewire interventions can alter a mental state (as per reports/discriminations) while the realizer remains fixed, demonstrating that mental kinds depend on causal roles.  
  5. **Graft confirms realizer variability**: Graft interventions can replace a realizer with a structurally distinct one while preserving the causal role, leaving the subject conscious and report-capable.  
  6. **Non-trivial MR requires intrinsic difference**: For MR to be worth arguing about, realizers must differ non-trivially—i.e., in intrinsic properties (e.g., microstructure, material composition) that are not screened off by input-output relations. Cases like grafting an entire organ, a trained human population, or an economic market count as non-trivial if they meet this criterion.  
  7. **Mental powers are role-determined**: The causal powers of a mental state (e.g., its ability to cause avoidance behavior) are fixed by its causal role.  
  8. **Realizers have intrinsic powers**: A realizer has its own causal powers (e.g., metabolic efficiency) derived from its intrinsic properties and physical laws.  
  9. **Mental–physical power relation must be explicable**: The causal powers of the mental state must bear a non-arbitrary relation to those of the realizer; it cannot be brute.  
  10. **Taxonomy requires behavioral grounding**: Mental state ascriptions (e.g., "pain") must be grounded in patterns of report, discrimination, and behavior.  
  †11. **Realizer powers constrain mental powers**: The realizer's intrinsic powers must be compatible with the mental state's causal powers; e.g., a realizer that cannot process inputs fast enough to support discrimination cannot realize a mental state requiring that discrimination. (Nadia's reluctance: This risks making realizer properties constitutive.)  
  ‡12. **Cross-system role identity requires functional similarity**: Attributing the same mental state across systems (e.g., human and octopus) requires that their causal roles share relevant functional similarities in input-output patterns, even if their input-output taxonomies differ. (Tobias's reluctance: This downplays the role of the realizer in cross-system comparisons.)  
  †13. **Grafts can use non-standard realizers**: Graft interventions can, in principle, use non-neural realizers (e.g., a market or silicon chip) if they preserve input-output relations. (Nadia's reluctance: This may invite Tobias-focused objections.)  
  ‡14. **MR does not imply functionalism**: Evidence of MR does not, by itself, entail that mental states are purely functional kinds; additional argumentation is needed. (Tobias's reluctance: This concedes MR's compatibility with functionalism.)  

  ---

  ### Part 2: Disagreements Table  
  The table below summarizes core disagreements. Formulations are acceptable to each side for their own position. Disagreements are not verbal because they yield divergent empirical predictions under the graft/rewire protocol and cannot be resolved by redefinition alone.  

  | Issue | Nadia's Formulation | Tobias's Formulation | Why Not Merely Verbal |  
  |-------|---------------------|----------------------|------------------------|  
  | **Nature of mental states** | A mental state is identical to its causal role. The realizer is a mere occupant; changing it (via graft) without role alteration preserves the mental state. | A mental state is constituted by the realizer's grounding of the causal role. The realizer is part of the mental state's identity; changing it (via graft) alters the mental state even if the role is preserved. | Affects predictions for graft outcomes: e.g., whether a grafted subject with a non-neural realizer has the same mental state. |  
  | **MR's significance for identity theory** | MR shows that mental states cannot be identical to physical kinds because one mental state can be realized by many physical kinds, so the mental kind is distinct from any physical kind. | MR is compatible with identity theory because the realized mental state is identical to the physical realizer-in-context; MR only shows that different realizers can ground the same role. | Affects interpretation of MR evidence: if MR obtains, it refutes identity theory for Nadia but not for Tobias. |  
  | **Realizer's contribution to mental powers** | Occupying a causal role suffices for the mental state to have its powers; the realizer's powers are irrelevant as long as the role is filled. | The realizer's powers must constitutively ground the mental state's powers; merely occupying the role is insufficient without this grounding. | Affects predictions for grafts with realizers that have divergent intrinsic powers (e.g., noise profiles): whether role occupancy alone ensures mental powers. |  
  | **Grain of causal roles** | The grain of a causal role is fixed by coarse-grained functional patterns (e.g., "causes avoidance") to ensure cross-system comparability; fine-graining risks making MR trivial. | The grain must be fine-grained enough to reflect the realizer's causal capacities; coarse-graining risks including non-mental realizers (e.g., markets). | Affects what counts as "same role" in grafts: e.g., whether a market graft realizes pain. |  
  | **Cross-system role identity** | Roles are identical across systems if they share abstract functional patterns (e.g., "mediating threat response"), even with divergent input-output taxonomies; this allows cross-species mental ascriptions. | Role identity requires shared input-output taxonomies or realizer-based constraints; functional patterns alone are insufficient for true cross-system ascriptions. | Affects rewire interventions across species: e.g., whether rewiring a human realizer to octopus-like inputs yields octopus pain. |  

  ---

  ### Part 3: Cruxes  
  Three cruxes focus on the graft/rewire protocol. Each includes a concrete case, both sides' advance predictions, and consequences. Predictions are concrete and falsifiable: a null result or surprise costs at least one side. Bullets bitten are specified.  

  #### Crux 1: Grain  
  **Issue**: How finely must the causal role be specified? Coarse grain allows non-mental realizers (e.g., markets) but preserves MR; fine grain collapses MR.  
  **Case**: Graft intervention where \(R\) (e.g., a pain role) is replaced by a realizer composed of a simple market system (traders reacting to inputs like "threat level" and outputting "avoidance signals"). The market differs intrinsically (e.g., in decision latency, error rates) but preserves input-output relations. Subjects report pain during noxious inputs.  
  - **Nadia's prediction**: Subjects report genuine pain because the role is preserved; the market is a valid realizer.  
  - **Tobias's prediction**: Subjects report pain, but it is not genuine; the market lacks intrinsic properties to ground mental powers (e.g., subjective quality). Reports are artifacts or errors.  
  **Consequence**: If subjects report pain veridically (validated by discrimination tests), Nadia is vindicated; Tobias must bite the bullet that non-neural realizers can constitute mental states, costing him his core claim that realization requires neural-like grounding. If reports are non-veridical (e.g., inconsistent with behavior), Nadia bites the bullet that grain must be finer, risking MR’s collapse in other cases.  

  #### Crux 2: Taxonomic Bridge  
  **Issue**: What warrants calling roles identical across systems with different input-output taxonomies?  
  **Case**: Rewire intervention on a human subject: hold a pain-realizing neural state fixed but alter embedding to mimic octopus-like inputs (e.g., chemical sensors) and outputs (e.g., ink ejection). Test if reports/discriminations match human pain or octopus-like pain.  
  - **Nadia's prediction**: Reports/discriminations shift to octopus-like pain; the same realizer now occupies a different role, proving role-dependence and cross-system comparability via functional patterns.  
  - **Tobias's prediction**: Reports remain human-like; the realizer grounds a human-specific mental state, so role change alone cannot create octopus pain without realizer alteration. Cross-system ascriptions fail.  
  **Consequence**: If reports shift (e.g., subject describes ink-ejection urges), Nadia is supported; Tobias must bite the bullet that realizers do not constrain mental kinds, undermining realizationism. If reports stay human-like, Tobias is supported; Nadia must bite the bullet that input-output taxonomies are not bridgeable, weakening MR’s cross-system force.  

  #### Crux 3: Inheritance  
  **Issue**: Must the realizer's powers ground the mental state's powers, or does role occupancy suffice?  
  **Case**: Graft intervention with a realizer that has high noise (e.g., random firing) but uses error-correction to preserve input-output relations. Test under interference (e.g., electromagnetic noise): if the mental state degrades despite preserved inputs/outputs.  
  - **Nadia's prediction**: Mental state remains stable; reports/discriminations are unchanged because role occupancy suffices.  
  - **Tobias's prediction**: Mental state degrades; reports become erratic because the noisy realizer fails to ground robust mental powers.  
  **Consequence**: If stability holds, Nadia is vindicated; Tobias must concede that role occupancy is sufficient, costing his grounding requirement. If degradation occurs, Tobias is supported; Nadia bites the bullet that roles must be fine-grained to include noise tolerance, risking overfitting to actual realizers (violating her constraint).  

  ---

  ### Part 4: Closing Audit  
  **Verbal Disputes**: None of the core disagreements are purely verbal. Each affects empirical predictions under the graft/rewire protocol:  
  - **Why not verbal?** All cruxes produce testable outcomes where one side’s view is falsifiable (e.g., grain affects market-graft predictions; inheritance affects noise-graft stability). Divergent predictions for the same protocol show substantive disagreement.  
  **Substantive Disputes**: The cruxes resolve the key substantive issues:  
  - **Grain** tests whether mental states require realizers with specific intrinsic properties.  
  - **Taxonomic bridge** tests whether roles transcend physical context.  
  - **Inheritance** tests whether role occupancy is metaphysically sufficient.  
  **Settling the Disputes**:  
  - Perform graft/rewire experiments as described. For each crux, a clear outcome (e.g., degradation in noise-graft) forces one side to bite a bullet:  
    - Grain: If market grafts work, Tobias loses realizer essentialism; if not, Nadia loses coarse-grained MR.  
    - Bridge: If rewire changes mental kinds, Tobias loses realizer-based constraints; if not, Nadia loses cross-system MR.  
    - Inheritance: If noise-graft is stable, Tobias loses grounding; if not, Nadia loses role sufficiency.  
  - **Outcome-dependence**: MR retains probative force only if (1) grafts with non-trivial realizers (e.g., markets) work, (2) rewires change mental kinds across systems, and (3) role occupancy alone ensures power inheritance. If all hold, MR supports functionalism; if any fail, realizationism gains ground.  

