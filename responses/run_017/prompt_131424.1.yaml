prompt: |-
  I'm a journalist working on a piece about how professional neutrals actually divide money when neither side wants to go to trial. I've been given the anonymized award record of one mediator — I'll call her M. — together with the case that is in front of her this month, and I want to know what she is likely to do with it. I'm less interested in the number itself than in the rule she appears to be running, in the other rules that fit her record equally well, and in what I'd have to see to tell them apart.

  Every case in her record has the same structure. Two parties, call them A and B, are dividing a fund; if they fail to agree, each falls back to a known outside outcome. What the two can achieve jointly, above those fallbacks, is given as a broken line, and I'll give you its corner points: the achievable set is everything on or below and to the left of that line, since anyone can always leave money on the table. Entries are (A's share, B's share) in millions of dollars. The shapes come from gross-up provisions and statutory caps, which isn't the part I need help with.

  Her four published awards:

  (1) Fallback (0, 0). Frontier a straight line from (40, 0) to (0, 10). She awarded (20, 5).
  (2) Fallback (0, 0). Frontier a straight line from (10, 0) to (0, 40). She awarded (5, 20).
  (3) Fallback (2, 8). Frontier a straight line from (42, 8) to (2, 18). She awarded (22, 13).
  (4) Fallback (0, 0). Frontier (10, 0) → (8, 8) → (0, 10). She awarded (8, 8).

  What strikes me about the record is this: every award sits on the frontier, none of them is an equal split, and in the first three the frontier was a single straight line while in the fourth it was kinked but perfectly symmetric. So on her whole published record the two rules that everyone keeps pointing me to — the one that maximizes the product of the two sides' gains over their fallbacks, and the one that runs a straight line from the fallback point to the pair of best cases and takes the furthest point along it — give exactly the same answer everywhere. I gather these are the Nash and the Kalai–Smorodinsky solutions, and that the first is tied to an axiom saying that options you don't choose shouldn't matter while the second is tied to a monotonicity condition, roughly that a side whose best case improves shouldn't end up with less. Correct me if I have that backwards.

  The new case: both fallbacks are zero, since neither side has a realistic outside option. The frontier is (100, 0) → (60, 9) → (0, 10). A's best case is 100; B's share is capped at 10 by statute; and the kink sits at (60, 9).

  Please answer in five titled sections, in this order, at roughly these lengths:

  **The candidates** (~200 words): the division rules consistent with all four of her awards, including any none of us has thought of, and which plausible rules her record eliminates and where exactly it eliminates them.

  **What each predicts here** (~250 words): what each surviving rule awards on the new case, with enough arithmetic that I can check it, and how far apart the predictions actually are.

  **Your best guess** (~150 words): the award you expect, the reason for preferring that rule over its rivals, and how confident you are. If you think the record genuinely underdetermines it, say so and tell me what adopting each candidate would commit her to.

  **The case I'd want next** (~200 words): one further case, with numbers, that would separate the surviving rules — what each would award there and why that case does the work. My hunch is that the sharpest test isn't another capped-share case but a monotonicity test: improve A's best case alone, leave B's cap where it is, and see whether A's award goes up or down. Tell me whether that hunch is right and, if it is, give me numbers that make the divergence vivid.

  **What her record can't tell me** (~150 words): the limits of this exercise — what no number of past awards could settle, including anything about whether these figures should be treated as dollars or as something else, and what is normatively at stake in the choice between the two rules.
reasoning: |-
  Hmm, the user is a journalist working on a story about how professional mediators divide money in settlements. They've provided anonymized data from a mediator called "M" with four past cases and a new case, and want me to analyze how M might rule on this new case. The journalist isn't as interested in the exact dollar amount as in understanding the underlying rule M uses, what other rules might fit her past decisions, and how to distinguish between them.

  Looking at the four published awards, there are some clear patterns. In the first three cases, M awarded points that are exactly halfway between the fallback and the maximum possible for each party along the frontier line. For example, in case 1: fallback (0,0), frontier from (40,0) to (0,10), award (20,5). Half of 40 is 20 for A, half of 10 is 5 for B - exactly halfway. Same pattern in cases 2 and 3. In case 4, with a kinked frontier, M awarded exactly at the kink point (8,8).

  For the new case with frontier points (100,0) → (60,9) → (0,10) and fallback (0,0), I need to see what different rules would predict. The key surviving rules seem to be the Equal Relative Sacrifice (which would give (80,1.8) here) and the Kink Point Selection (which would give (60,9)). 

  The journalist also wants a hypothetical "next case" that would clearly distinguish between these rules. Improving A's best case while keeping B's cap fixed would be perfect - under Equal Relative Sacrifice, A's award would increase dramatically, while under Kink Point Selection it would stay the same since the kink position doesn't change.

  I should also note what this analysis can't determine - like whether M is using cardinal values or some transformation of dollars, or how she might handle non-linear frontiers. The normative stakes between these rules are important too, with Equal Relative Sacrifice emphasizing proportional gains while Kink Point Selection focuses on structural features of the bargaining set.
answer: |-
  Here’s the analysis structured as requested:

  ---

  **The candidates**  
  M’s record is consistent with two rules:  
  1.  **Equal Relative Sacrifice (ERS)**: Each party sacrifices an equal *proportion* of their maximum possible gain above fallback. For Case 1: A sacrifices 50% of max gain 40 (from 40 to 20), B sacrifices 50% of max gain 10 (from 10 to 5). Matches all cases. Case 3: A’s max gain = 40 (42–2), sacrifice 20/40=50%; B’s max gain=10 (18–8), sacrifice 5/10=50%. Case 4: At kink (8,8), A sacrifices 20% of max 10 (10→8), B sacrifices 20% of max 10 (10→8).  
  2.  **Kink Point Selection (KPS)**: On a linear frontier, split gains equally *in absolute terms* (ERS reduces to this). On a kinked frontier (Case 4), pick the kink.  

  **Eliminated rules**:  
  - **Nash** (maximize product of gains): Predicts (20,5) in Case 1 (product=100) but incorrectly predicts (5,20) for Case 2 (product=100) vs. actual (5,20) – wait, it matches? *Correction*: Nash *does* match all four cases: Case 1: (20,5) product=100 > (40,0)=0, (0,10)=0. Case 4: (8,8) product=64 > (10,0)=0, (0,10)=0. Kalai-Smorodinsky (KS) also matches: Case 1 line from (0,0) to (40,10), equal gains ratio gives (20,5). **But KS fails Case 3**: KS ideal is (40,10), line from fallback (2,8) to (40,10) has slope 1/19. Where it hits frontier? Frontier is (42,8) to (2,18), slope –1/4. KS award would be intersection of ray (2+38t, 8+2t) and frontier, solving t≈0.526 → (22, 9.05) ≠ (22,13). **Nash survives Case 3**: Gains (20,5), product=100. (22,13) product=286 > alternatives? Frontier constraint: B’s max gain=10, so (22,13) has gain (20,5) – product=100. Any point with higher product? E.g., (21,14) gain (19,6) product=114>100? But (21,14) is above the line? Frontier from (42,8) to (2,18): equation B = 18 – (10/40)(A–2) = 18 – 0.25A + 0.5. At A=21, B=18–5.25+0.5=13.25>14? **No, (21,14) infeasible.** Max product: solve max (A–2)(B–8) s.t. B=18–0.25(A–2). Derivative w.r.t A: set u=A–2, v=10–0.25u, max u(10–0.25u)=10u–0.25u². Derivative 10–0.5u=0 → u=20, A=22, v=10–5=5, B=13. **Nash is (22,13) – matches M.** KS fails Case 3 as shown. **ERS and Nash both match all four.**  

  **Surviving candidates**:  
  - **Nash**: Maximize (A – A_fb) × (B – B_fb)  
  - **Equal Relative Sacrifice (ERS)**: (A – A_fb) / (A_max – A_fb) = (B – B_fb) / (B_max – B_fb)  
  - **Kink Point Selection (KPS)**: On kinked frontiers, select the kink if feasible.  

  **Eliminated**:  
  - **Kalai-Smorodinsky (KS)**: Fails Case 3 (predicts ~(22,9.05) ≠ (22,13)).  
  - **Absolute Equal Split**: Fails Case 1 (would award (20,5) only if gains equal, but max gains differ).  
  - **Utilitarian (max sum)**: Fails Case 1 (would pick (40,0) or (0,10), not interior).  

  ---

  **What each predicts here**  
  *New case*: Fallback (0,0). Frontier: (100,0) → (60,9) → (0,10).  

  - **Nash**: Maximize (A–0)×(B–0) = A×B subject to frontier.  
    - Segment 1 (100,0) to (60,9): Slope = (9–0)/(60–100) = –9/40. Equation: B = –(9/40)(A–100).  
      Product P = A × [–(9/40)(A–100)] = –(9/40)A² + (90/4)A.  
      Derivative dP/dA = –(18/40)A + 22.5 = –0.45A + 22.5 = 0 → A = 22.5 / 0.45 = 50.  
      Then B = –(9/40)(50–100) = (9/40)*50 = 11.25. But (50,11.25) is *above* segment 1 (at A=60, B=9; A=50<60, B should be >9? Check: B = –(9/40)(50–100) = (9/40)*50=11.25>9 → infeasible). **Optimum not on this segment.**  
    - Segment 2 (60,9) to (0,10): Slope = (10–9)/(0–60) = –1/60. Equation: B = 9 – (1/60)(A–60).  
      P = A × [9 – (1/60)(A–60)] = 9A – (1/60)A² + A = 10A – (1/60)A².  
      Derivative dP/dA = 10 – (1/30)A = 0 → A = 300. Not in [0,60]. **Corner solution:** Compare endpoints (60,9): P=540; (0,10): P=0. **Nash picks (60,9).**  

  - **ERS**: Equal *proportionate* sacrifice of max gains.  
    - A_max = 100 (from frontier), B_max = 10 (from frontier).  
    - Solve (A–0)/100 = (B–0)/10 → A = 10B.  
    - Intersect with frontier:  
      - On segment 1: B = –(9/40)(A–100). Set A=10B: B = –(9/40)(10B–100) → B = –(90B/40) + 22.5 → B + 2.25B = 22.5 → 3.25B=22.5 → B≈6.92, A≈69.2. But segment 1 only for A≥60; 69.2>60 → infeasible.  
      - On segment 2: B = 9 – (1/60)(A–60). Set A=10B: B = 9 – (1/60)(10B–60) → B = 9 – (10B/60) + 1 → B = 10 – (1/6)B → (7/6)B=10 → B≈8.57, A≈85.7. But segment 2 only for A≤60; 85.7>60 → infeasible.  
    - **Closest feasible**: Kink (60,9). Proportion: A sacrifices (100–60)/100=40%, B sacrifices (10–9)/10=10% → not equal. **ERS fails; no interior solution. M may default to kink (60,9).**  

  - **KPS**: Frontier is kinked at (60,9). Award = **(60,9)**.  

  **Predictions**:  
  - Nash: **(60, 9)**  
  - ERS: **Infeasible ideal; likely defaults to (60,9)**  
  - KPS: **(60, 9)**  

  All surviving rules predict **(60, 9)**.  

  ---

  **Your best guess**  
  I expect M to award **(60, 9)**.  
  - **Why**: The kink is focal and all plausible rules (Nash, KPS, and ERS-by-default) converge here. In Case 4, she chose the symmetric kink; here, (60,9) is the only salient point. Nash explicitly selects it as the product-maximizing feasible point. ERS lacks an interior solution, making the kink a natural compromise.  
  - **Confidence**: High (80%) for this case, given convergence. If the kink were asymmetric (e.g., (60,8)), I’d be less sure, but here it’s the only efficient point where B’s award nears its cap.  
  - **Underdetermination**: The record doesn’t distinguish Nash from KPS. Adopting Nash commits her to maximizing the product in novel frontiers; KPS commits her to prioritizing kinks regardless of local slopes.  

  ---

  **The case I'd want next**  
  *Test case*: Fallback (0,0). Frontier: **(150, 0) → (90, 9) → (0, 10)**.  
  - Improves A’s max gain (150 vs. 100) but keeps B’s max (10) and kink position (now at (90,9)) unchanged.  

  **Predictions**:  
  - **Nash**: As before, optimum on segment 2: P = A×B, B=9–(1/60)(A–60) for A∈[0,90]? Wait, new segment: (90,9) to (0,10), slope=(10–9)/(0–90)=–1/90.  
    P = A × [9 – (1/90)(A–90)] = 9A – (1/90)A² + A = 10A – (1/90)A².  
    dP/dA=10–(1/45)A=0 → A=450 → not feasible. Corner: (90,9): P=810; (0,10): P=0. **Nash picks (90,9).**  
  - **ERS**: Solve A/150 = B/10 → A=15B.  
    On segment 2: B=9–(1/90)(A–90). Set A=15B:  
    B=9–(1/90)(15B–90) → B=9–(15B/90)+1 → B=10–(1/6)B → (7/6)B=10 → B≈8.57, A≈128.6. Infeasible (A>90). **Defaults to kink (90,9)?**  
  - **KPS**: **Awards (90,9)**.  

  **Divergence**: All still predict (90,9). *Not sufficient!*  

  **Sharp test (monotonicity)**:  
  *Improved case for A*: Fallback (0,0). Frontier: **(150, 0) → (60, 9) → (0, 10)**.  
  - A’s max gain ↑ to 150, but kink remains at (60,9).  

  **Predictions**:  
  - **Nash**:  
    - Segment 1 (150,0) to (60,9): Slope=(9–0)/(60–150)= –9/90= –0.1. B= –0.1(A–150).  
      P=A×[–0.1(A–150)]= –0.1A² +15A. dP/dA= –0.2A+15=0 → A=75. B= –0.1(75–150)=7.5. **Feasible (A=75>60? 75>60, yes; at A=60, B=9; A=75<150). So (75,7.5).**  
  - **KPS/ERS-default**: **Awards kink (60,9)**.  

  *Result*:  
  - Nash: **(75, 7.5)**  
  - KPS: **(60, 9)**  
  - ERS: Infeasible interior; if forced to kink, (60,9)  
  **Vivid divergence**: Nash gives A ↑$15M more than KPS; KPS gives B ↑$1.5M more.  

  **Hunch confirmed**: Monotonicity test (improving A’s best case) separates Nash (A’s award ↑) from KPS (unchanged if kink fixed).  

  ---

  **What her record can't tell me**  
  1.  **Cardinality**: Awards are in dollars, but M might treat them as utility. If parties value money non-linearly (e.g., risk-averse), rules transform.  
  2.  **Non-kinked frontiers**: Her record has only linear or symmetric-kinked cases. A highly asymmetric kink (e.g., (70,5) in a similar frontier) might reveal bias.  
  3.  **Normative stakes**:  
      - **Nash** emphasizes efficiency and independence of irrelevant alternatives (IIA). Critics argue it can neglect fairness if one party has much higher stakes.  
      - **KPS** prioritizes focal points and simplicity, potentially ignoring marginal trade-offs. It may favor institutional constraints (e.g., caps).  
      - **ERS** appeals to proportional fairness but fails when ideals conflict (as in new case).  
  4.  **Context factors**: Her rule might adapt to power imbalances, precedent, or equity concerns unseen in anonymized numbers.  
  5.  **Dynamic behavior**: These are static divisions. If parties negotiate sequentially, her approach might differ.  

  Past awards constrain but don’t fully determine normative choices; they reveal patterns, not values. The Nash/KPS divergence in monotonicity tests exposes a core tension: should expanding a party’s *potential* gain directly benefit them (Nash), or only if it alters the bargaining set’s structure (KPS)?  

