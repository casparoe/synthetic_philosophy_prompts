  Third: The strengthened language (second-order logic). The idea is to fix the interpretation by allowing quantification over all relations (standard semantics). This does indeed pin down the model (up to isomorphism) for set theory. However, the relativity does not completely disappear. Why? Because to give meaning to second-order logic, we need a metatheory. In the metatheory, we might have non-standard models. For example, if our metatheory is a first-order set theory, then it too has non-standard models. So when we say "the full power set", in a non-standard model of the metatheory, the "full power set" might be interpreted in a non-standard way (i.e., it might not include all subsets). Therefore, the relativity is shifted to the metatheory. The residue of relativity is then: the interpretation of the second-order quantifiers depends on the metatheory. This is a different problem: it is about the metatheory and its models. But it has the same shape: the specification (now in second-order logic) does not pin down the intended model because the metatheory might be non-standard. However, note that if we take the metatheory to be the "real" set theory, then we get the intended model. But then we are back to relying on an intended interpretation of the metatheory.

  Verdict on the residue:
  - What translated cleanly: The idea that a specification has multiple non-isomorphic instances, and that properties like countability are relative to the instance. The realist reply that the countable instance is not intended and that the enumeration is external also translates directly (because in your practice you see the finite instance and know the enumeration exists externally).
