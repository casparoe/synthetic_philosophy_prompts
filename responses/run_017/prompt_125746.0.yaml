  (2) The standard realist reply:
  The countable instance (model) that the Löwenheim-Skolem theorem provides is not the intended one. In particular, the membership relation in that instance is not the "real" set membership (it might not be transitive, for example). Moreover, the enumeration (the bijection that shows the set is countable) exists outside the instance (in the metatheory) but is not captured within the instance because the instance does not have that function as an element. Therefore, the fact that we (from the outside) can see that the set is countable in that instance does not mean that the set is "really" countable (in the intended model). The intended model (which is uncountable) is the one we have in mind, and the countable instance is a non-standard interpretation of the specification.

