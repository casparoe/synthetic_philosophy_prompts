  Second: The small-scope habit. You accept that in a small scope, the quantifiers range over a small set of atoms, and you do not see this as a crisis because you have an intended infinite system in mind and you can always increase the scope. The disanalogy you propose (that you can re-run at higher scope and that you have an intended infinite system) is crucial. But note: in set theory, we cannot "re-run at higher scope" in the same way because the intended model is infinite (and uncountable). Moreover, the Löwenheim-Skolem theorem says that even if we try to "increase the scope" to an infinite one, we still get countable models. And we cannot get an uncountable model by simply increasing the scope (as you do in Alloy) because the scope in Alloy is bounded by your computer's memory, but in set theory we are talking about abstract models. The key difference: in your practice, the intended model is fixed and you are approximating it with finite instances. But in set theory, the intended model is not fixed by the first-order specification (because of the Löwenheim-Skolem theorem). So your habit of relying on small scopes and then having confidence that the spec is "probably fine" is not directly analogous because in set theory, no finite amount of increasing the scope (in the sense of taking larger and larger finite models) will ever show you the uncountable set. In fact, even an infinite scope (countable) will not show you an uncountable set. So the disanalogy is that in your practice, you are approximating a known intended model (which you have in mind) and you can in principle (if you had infinite resources) check the entire intended model. In set theory, the intended model is not captured by the first-order spec in the same way: the spec does not determine the intended model. Hence, your candidate disanalogy holds: you have an intended system that the instances approximate, and you know what it is, but in set theory, the first-order spec does not fix the intended