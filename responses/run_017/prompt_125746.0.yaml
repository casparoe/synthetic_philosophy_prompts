with standard semantics because the domain must be large enough to satisfy the power set axiom (which forces the domain to be uncountable). However, note that there are non-standard models of second-order set theory? Actually, with standard semantics, second-order ZFC is categorical (only one model up to isomorphism). But wait, that model is the intended one (with the real set-theoretic universe). However, the catch is that to even talk about the standard semantics we require a fixed metatheory. And if we are working in a metatheory that is set theory, then we might have multiple interpretations (if the metatheory has non-standard models). So the relativity might reappear at the metalevel.

