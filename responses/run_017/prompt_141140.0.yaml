  ## Municipal Code Amendment Proposal: Byelaw 7.4 - Harmonisation of Transient Resident Conduct Conventions (Public Consultation Draft)

  **1. Short Title:** This byelaw may be cited as the Transient Resident Social Coordination Compliance Byelaw.

  **2. Interpretation:** In this byelaw:
      *   "Established Local Convention" (ELC) means any widely practised and mutually understood pattern of behaviour within the municipal boundaries concerning queue formation and adherence, pedestrian interaction with vehicular traffic at designated crossings, and the voluntary transfer of monetary sums in recognition of service provision (gratuities).
      *   "Transient Resident" (TR) means any individual physically present within the municipal boundaries for a duration exceeding twenty-four (24) consecutive hours but less than the period defined as establishing permanent residency under Statute 14.2(a), irrespective of intent or domicile elsewhere.
      *   "Material Benefit" means any tangible or intangible advantage derived, directly or incidentally, from the environment stabilised by adherence to an ELC, including but not limited to: reduced interpersonal friction, predictable service intervals, perceived fairness in resource allocation, and the absence of vehicular conflict.

  **3. Obligation to Adhere:** Every Transient Resident shall, upon encountering a situation governed by an Established Local Convention, adhere strictly to the observable form and sequence of that Convention.

  **4. Specific Conventions Codified:**
      *   **4.1 Queueing Protocol:** Where individuals are visibly ordered for sequential access to a resource, service, or location, a TR shall identify the terminus of the existing formation and append themselves thereto, maintaining appropriate spatial separation and sequence until their turn arises. Departure from sequence or formation of parallel structures is prohibited.
      *   **4.2 Designated Crossing Procedure:** Where traffic control signals (commonly "pelican" or "puffin" crossings) are present, a TR shall initiate crossing *only* when the visual signal indicates pedestrian priority (e.g., green figure). Initiation of crossing during the vehicular priority phase (e.g., red figure), irrespective of observable traffic density or velocity, is prohibited. Standing stationary at an active crossing during the pedestrian priority phase without crossing is non-compliant.
      *   **4.3 Service Gratuity Framework:** Where a monetary gratuity is customarily proffered in exchange for services rendered within the hospitality, personal service, or transportation sectors, a TR shall remit a sum within the locally recognised normative range (typically 15%-20% of the base transaction value, unless otherwise prominently displayed) directly to the service provider. Failure to remit, or remittance below the normative range without prior explicit mutual agreement, is prohibited.

  **5. Doctrine of Substituted Compliance:** A Transient Resident may, subject to Subsection 5.1, discharge their obligation under Section 3 by performing an act constituting a *bona fide* equivalent social coordination convention from their jurisdiction of permanent residency ("Home Convention"), provided:
      *   **5.1** The Home Convention demonstrably addresses the *same underlying coordination problem* (e.g., orderly access, safe traversal, service remuneration acknowledgement) as the relevant ELC.
      *   **5.2** The performance of the Home Convention is conducted in good faith and is visibly distinct from non-compliance or disregard.

  **6. Jurisdiction:** This byelaw applies to all Transient Residents as defined in Section 2 within the geographic boundaries of the Municipality.

  **7. Commencement:** This byelaw shall come into effect sixty (60) days after final ratification by Council.

  ---

  **Explanatory Memorandum: Byelaw 7.4 - Harmonisation of Transient Resident Conduct Conventions**

  **1. Purpose and Rationale:** This byelaw addresses the destabilising impact of non-conformity to Established Local Conventions (ELCs) by Transient Residents (TRs). ELCs represent evolved solutions to recurrent coordination problems inherent in densely populated environments. Their efficacy relies entirely on consistent, mutual adherence. While residents internalise these norms, TRs, lacking sustained exposure, may default to alternative conventions or perceive ELCs as optional. This introduces unpredictability, friction, and perceived injustice, undermining the social equilibrium these conventions maintain. The moral obligation arises not from the intrinsic properties of queue position, signal colour, or percentage points, but from the *detriment caused to the collective* by unilateral deviation from the established coordination point. Adherence is therefore a fundamental civic duty for all participants within the municipal social sphere.

  **2. Key Provisions Explained:**
      *   **Section 3 (Obligation to Adhere):** Mandates strict conformity to the *observable practice* of the ELC. The moral imperative is triggered by the existence of the convention-in-practice, not abstract principles. Recognising the queue, not creating an efficient one, is paramount. Waiting at a crossing during the 'red man' phase, even absent traffic, respects the *system* of coordination; crossing against the signal, even absent traffic, erodes it. Non-participation *is* a form of participation with negative externalities.
      *   **Section 4.1 (Queueing Protocol):** The obligation is to join and perpetuate the *existing order*. The concept of "first arrival" holds moral weight only within the context of the visible queue structure. Forming a new queue ("queue-jumping" or creating parallel lines) constitutes a coordination failure, imposing costs (delay, dispute) on those adhering to the established convention. The spatial benefit of joining an efficient queue is secondary to the benefit of stable coordination itself, which accrues to all present.
      *   **Section 4.2 (Designated Crossing Procedure):** The signal convention exists to coordinate pedestrian and vehicular flows predictably. Initiating crossing against the signal, regardless of immediate traffic danger, introduces unpredictability for drivers conditioned to expect compliance during their phase. Conversely, *not* crossing during the allotted phase (e.g., a TR standing stationary at a crossing during the 'green man') creates ambiguity for drivers and pedestrians, potentially causing hesitation and delay – another form of coordination failure. Compliance means utilising the mechanism as designed.
      *   **Section 4.3 (Service Gratuity Framework):** While the underlying economic issue concerns wage structures, the *immediate moral failing* of the non-tipping TR lies in their unilateral rejection of the established local solution to the problem of service remuneration. By benefiting from the service environment sustained by the tipping convention (prompt service, availability), the TR incurs an obligation to uphold the convention. Failure to tip within the normative range directly harms the service provider reliant on this system and undermines the convention for others. The byelaw addresses the coordination failure (ensuring consistent remuneration acknowledgement), not the adequacy of base wages (a separate regulatory matter).
      *   **Material Benefit (Definition):** This concept is crucial. A TR who briefly observes a queue from afar without joining it, or who never utilises a crossing or service, might argue they derive no benefit. However, the benefit is environmental: the *mere presence* of stable conventions reduces background social friction and unpredictability for everyone within the municipality, including TRs. Choosing to enter the municipal space constitutes acceptance of the benefits conferred by its social infrastructure, creating an obligation to maintain it. Voluntary departure does not retroactively absolve obligations incurred during the period of residency where benefit was derived from the stable environment.

  **3. Doctrine of Substituted Compliance (Section 5):** Recognising the potential burden on TRs from diverse backgrounds, this doctrine permits the discharge of the local obligation through the performance of a *bona fide* equivalent convention from the TR's home jurisdiction. The Council acknowledges that the *specific act* (e.g., a 15% tip vs. a 10% service charge; waiting for a green signal vs. judging traffic flow) is not inherently morally superior. The core obligation is to signal participation in *a* coordination solution for the common problem. Therefore, a respectful bow acknowledging service, or a clearly signalled intention to cross based on home traffic norms (where equivalent to solving the same coordination problem), satisfies the requirement. This ensures respect for cultural diversity while mandating participation in coordination. The requirement for the act to be "distinct from non-compliance" (5.2) ensures it functions as a clear signal to observers, maintaining the convention's visibility and predictability.

  **4. Jurisdiction (Section 6):** Defining the TR period (24 hours to pre-permanent residency) balances the need for assimilation time against the principle that benefit accrual begins promptly. The status of individuals falling outside clear categories (e.g., frequent delivery drivers present for 2 hours daily over 5 years) requires case-by-case assessment based on integration and benefit derivation, guided by the core principle: participation in the municipal space necessitates participation in its coordination mechanisms. This definition ensures fairness and universal applicability within the municipal remit.

  **5. Compliance and Impact:** Enforcement will prioritise education and voluntary compliance, recognising the byelaw's primary role is normative signalling. Penalties for persistent, verifiable breaches will align with existing minor public order provisions. The anticipated impact is a significant reduction in coordination failures, leading to smoother social interactions, increased perceived fairness, and enhanced wellbeing for all municipal inhabitants and visitors, solidifying our reputation as a harmonious and predictable urban environment.

  ---

  **Notes achieving your aims:**

  1.  **Arbitrary Solutions Moralised:** The Explanatory Memo explicitly states moral obligation arises from adhering to the *established coordination point*, not the intrinsic merit of the specific act ("first arrival", "15%", "green man"). It then moralises furiously about the "detriment," "unpredictability," "friction," "perceived injustice," "harm," and "undermining" caused by non-adherence.
  2.  **Matching, Not Intrinsic Act:** "The moral imperative is triggered by the existence of the convention-in-practice." "The core obligation is to signal participation in *a* coordination solution." Substituted Compliance explicitly allows different acts solving the same problem.
  3.  **Obedient Tourist Causing Failure:** Section 4.2 explicitly prohibits *not* crossing during the pedestrian phase, labelling it non-compliant and a cause of "ambiguity," "hesitation and delay – another form of coordination failure."
  4.  **Tipping Really About Wages:** The Memo acknowledges "the underlying economic issue concerns wage structures," but argues the *moral failing* of the non-tipper is their "unilateral rejection of the established local solution" while benefiting from the environment it sustains, harming the provider and undermining the convention. It separates this from the "adequacy of base wages."
  5.  **Benefit & Leaving:** The "Material Benefit" definition and explanation directly tackle this. It argues benefit is environmental and accrued by mere presence ("reduces background social friction"), creating an obligation. "Choosing to enter... constitutes acceptance... Voluntary departure does not retroactively absolve obligations incurred during the period of residency."
  6.  **Substituted Compliance Wrecking:** The doctrine allows discharge via equivalent acts (bow vs. tip, judging traffic vs. waiting for signal). The Memo states this works because the obligation is to participate in *a* coordination solution, not the specific local act. This implicitly concedes the local act isn't special. However, the requirement that the act be "distinct from non-compliance" and function as a "clear signal" tries (and fails) to mask that accepting a bow *instead* of a tip is demanding deference to *some* ritual, not the local one. The contradiction is inherent: if the local convention is morally binding *because* it's local, substitution shouldn't work; if substitution *does* work, localness wasn't the key factor.
  7.  **Jurisdiction Unraveling:** The TR definition (24hrs+) is arbitrary. The Memo admits frequent delivery drivers (present for 2hrs/day over years) are a problem requiring "case-by-case assessment," exposing the definition's inadequacy. The reliance on "integration and benefit derivation" is vague and unworkable, highlighting the impossibility of cleanly defining who is bound by purely local norms.
