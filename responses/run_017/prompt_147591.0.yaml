prompt: |-
  You are a professional moral philosopher — someone who has genuinely worked on the metaphysics of harm and on population ethics, not a well-read generalist. Work slowly and carefully. Before you write anything in final form, spend real effort brainstorming: generate a loose, deliberately overlong list of candidate defeaters, including weak ones, then prune it, then rank it. Start your reply with that unpruned list in compressed form so I can see what you considered and rejected. What I want is an argument map, not a survey, and I do not want citations, reading suggestions, or pointers to the literature — I have access to all of that. What I lack is a clear view of how exposed my own position actually is.

  I am in the first year of a PhD, and last week in seminar I argued myself into a view I now cannot talk myself out of, which is exactly why I distrust it. Call it the dissolution view; it has two parts. Part one, about harm: I accept a counterfactual comparative account, together with the claim that never existing is not a condition that can be better or worse for the person who would have been in it. So in a different-people choice — one where the alternative to the act is not that the same person leads a worse life, but that a numerically different person exists instead — the person who ends up existing is not harmed, however bleak their life is, so long as it is a life they are glad to have. Part two, about wrongness: nothing follows about permissibility, because in this domain the deontic work is done by impersonal value rather than by a duty not to harm. On my version the relevant axiology is a total principle with a positive critical level, so that adding a life which barely clears neutrality counts for nothing, or for less than nothing. The pregnant teenager who is advised to wait, the energy policy that reshuffles which people exist a century from now, the clinic that implants one embryo rather than another: all condemnable on my account, none of them wronging anyone. The puzzle, I want to say, was never about missing victims; it was about running a person-affecting restriction in a region where it has no grip. Two notes on what moves me: I am least likely to be moved by the repugnant conclusion, with which I have made my peace, and most likely to be moved by anything showing that my two halves cannot be held together — that a view which is impersonal in its axiology has no remaining use for the person-affecting apparatus it preserves in part one, or that preserving that apparatus commits me to verdicts my axiology cannot explain.

  Here is the case I keep turning over, which I built myself because I could not find it treated. Call them stochastic different-people choices: cases where identity-affectingness comes in degrees. Two protocols at a fertility clinic. Under Protocol I there is a nine-in-ten chance that child A is conceived, whose life would score around 80 on whatever scale you like, and a one-in-ten chance of child B, whose life would score around 4 — above zero, a life worth having, but below the critical level my axiology employs. Under Protocol II the same two possible children, but with the odds reversed; Protocol II also includes a supplement the child receives in utero, so each child's welfare conditional on existing is somewhat higher — A would score 82, B would score 9. Now suppose the clinic chooses Protocol I and B is in fact conceived, with a life of 4. My part-one defense is supposed to be that B cannot complain, since had the clinic acted otherwise B would very probably not have existed at all; but that defense has now become probabilistic rather than categorical, and I cannot see how to make it probabilistic without either (i) letting B's chance of existing and B's welfare conditional on existing enter a single comparison, in which case existence and non-existence are being weighed against each other for one and the same person after all, which is precisely what part one says cannot be done, or (ii) holding that the strength of the no-harm verdict varies continuously with the probability that the same person would have existed anyway — full nonidentity defense at one end, an ordinary harm claim at the other, and in the middle something my view has no vocabulary for. Please work that case through properly, and also the stripped-down variant in which the supplement is removed and only the odds differ, and tell me which horn I am really stuck on. I would also like to know whether the same structure reappears inside the ordinary deterministic cases once you allow that personal identity over time may be vague or a matter of degree, and whether any of this is fatal or merely awkward.

  So give me the exposure map. Rank the defeaters from fatal to merely awkward; for each, say what would have to be true for it to land, whether that is a live possibility or only a logical one, and whether it is something a defender of my view would himself concede or would dismiss as smuggling in a rival's assumption. Include the defeaters internal to the view — a consequence it is committed to that I may not be willing to accept, a case it lacks the resources to describe, a respect in which it collapses into a position I take myself to have rejected, whether pure impersonalism or the threshold view I thought I had an argument against — and not only the objections its critics raise. Be explicit about which parts of the view are insulated: which claims have been qualified to the point where nothing could count against them, and whether, for a claim of this kind, that insulation is a genuine defect or simply what one should expect from a thesis about what harm consists in. Close by telling me plainly whether the view is in better shape than I fear or worse, and identify the single consideration you would point to first.
