prompt: |-
  I'm a junior majoring in cognitive science, and this semester I'm taking a seminar on predictive processing and active inference. Most of it I can follow at the level of the readings, but I keep getting stuck on the same thing: my professor insists that perception and action are just one minimisation seen from two directions, that everything hinges on how much precision a prediction carries, that expected free energy splits into a pragmatic and an epistemic part, and that the dark room objection is what stops the whole framework from predicting that agents should curl up somewhere unchanging. I believe all of that at arm's length, but I don't know what any of it would look like if you had to do it on purpose, in real time, with another person in the room.

  The reason I want to know is that I've been a peer tutor in our writing center for three semesters and I'm training the new cohort in January. The work is repetitive in a way that a theory ought to help with: forty-five-minute drop-in appointments, six to ten a week, tutees arriving with everything from lab reports to personal statements, no authority over grades, a rule against editing the paper for them, a session note that goes back to the instructor, and end-of-semester evaluations that the center's funding partly depends on. My own instinct right now is to ask what the writer thinks is wrong before I say anything, and roughly half the time I get a shrug. What I'd like from you is a procedure I can actually hand to a new tutor, not a set of principles: the steps in order, what counts as a sufficient answer at each step, where the tutor stops early and hands the session back to the writer, and where the procedure has to stop because the remaining question is one the writer has to answer for themselves. Please keep the theory doing real work in it — how a tutor would read the precision of a writer's expectations in forty-five minutes without any numbers, what the tutor should do differently when a writer's predictions are very confident versus very diffuse, when the right move is to get the writer to change their model versus to send them off to sample the page differently, and how to tell whether a session should be spent reducing uncertainty or just getting the thing finished. But be straight about the places where the translation fails: where precision is a metaphor I can't actually measure, where the story I tell afterwards would fit whatever happened, and which steps are judgment calls wearing a procedure's clothing.

  Then please run it on three cases, in American English, with the reasoning shown rather than skipped. First: a first-year who is completely sure his essay is about ambition in Macbeth and is wrong about that, confidently. Second: a multilingual graduate student who says everything is a problem and is right, in the sense that there are many surface errors and no single one to fix. Third, and this is the one I expect to dislike: a strong senior who books a slot every week with an already polished draft and mostly wants to be told it's fine, who is lovely, who rates me maximally, and who I suspect is using me the way the dark room objection says agents would use a dark room. If your procedure tells me to do something to that third person that will cost me her evaluations and possibly her feelings, say so plainly and tell me why the theory commits me to it — but also tell me where you think the theory is simply the wrong tool, and what a tutor should fall back on there. It needs to be teachable in an hour to someone with no cognitive science, and usable in a room where I can't say any of these words out loud.
reasoning: |-
  We are going to design a procedure for writing tutoring sessions based on the principles of predictive processing and active inference. The key ideas we'll translate are:

  1. **Perception and action as one minimization**: In tutoring, the tutor and writer are jointly minimizing prediction errors (discrepancies between expected and actual states of the text and session). The tutor's actions (questions, suggestions) and the writer's perceptions (understanding of their text) are two sides of the same coin.

  2. **Precision-weighting**: The confidence (precision) the writer has in their predictions (about their text, the assignment, etc.) matters. High precision means they are confident and we must challenge carefully; low precision means they are uncertain and we might need to help them gather more evidence.

  3. **Expected free energy (EFE) splits into pragmatic and epistemic**: 
     - Pragmatic: Achieving the goal (e.g., a better grade, clearer communication).
     - Epistemic: Reducing uncertainty (e.g., understanding why a paragraph is confusing).
     In tutoring, we balance between improving the text (pragmatic) and helping the writer learn (epistemic).

  4. **Dark room objection**: Agents (writers) might seek to minimize prediction errors by avoiding challenges (like staying in a dark room). We must avoid sessions becoming mere validation without growth.

  The procedure will have steps with clear conditions for moving forward, stopping, or handing back to the writer. We'll avoid jargon and make it teachable.

  ---

  **Procedure: The Writing Session Flow**

  **Step 0: Pre-session (Tutor Prep)**
  - *Action*: Quickly scan the writer's work (if available) and note the assignment (if provided). 
  - *Goal*: Form initial predictions about what the writer might need (but hold lightly).
  - *Precision note*: If the assignment is unclear or the text is very rough, expect low precision (uncertainty) in the writer. If the text is polished, expect high precision.

  **Step 1: Goal Setting (2-5 minutes)**
  - *Action*: Ask: "What would you like to focus on today?" or "What are your main concerns about this draft?"
  - *Sufficient answer*: The writer names 1-3 specific areas (e.g., "I'm worried about my introduction," "I don't know if my argument is clear," "Grammar").
  - *If shrug or "I don't know"*: 
    - *Low precision response*: Offer a menu: "Shall we look at the assignment guidelines, read a paragraph aloud, or check the structure?"
    - *Goal*: Gather evidence (epistemic) to reduce uncertainty about the problem.
  - *If confident but possibly wrong* (e.g., "I just need commas" when the issue is deeper):
    - *High precision response*: Acknowledge, then probe: "Okay, let's start there. Can you show me one place you're unsure about commas? Then we can see if there are patterns."
  - *Stop early and hand back*: If the writer cannot name a focus after two prompts, suggest starting by reading the first paragraph aloud together (to sample the page).
  - *Judgment call*: Deciding if the writer's confidence is warranted.

  **Step 2: Sampling the Evidence (5-15 minutes)**
  - *Action*: Look at the text together. Ask the writer to read a section aloud (or read it yourself if they prefer). Focus on the area(s) from Step 1.
  - *Goal*: Gather sensory evidence (the text) to test the writer's predictions (e.g., "Is this paragraph clear?").
  - *Precision note*: 
    - *High confidence*: If the writer is sure (e.g., "This paragraph is fine"), ask: "What do you think works well here?" Then: "What would a reader need to know to follow this?" (to test for hidden errors).
    - *Low confidence*: If the writer is unsure, ask: "What part feels off to you? Let's look at one sentence." (reduce scope to one prediction at a time).
  - *Sufficient answer*: The writer identifies a specific strength or problem (e.g., "This sentence is long," "I don't explain this term").
  - *Stop and hand back*: If the writer cannot identify anything after two tries, pick one thing to model: "I noticed this sentence was long. Shall we see if we can split it?"
  - *Judgment call*: Choosing which section to sample and how deep to go.

  **Step 3: Error Minimization (15-30 minutes)**
  - *Action*: Address one specific issue at a time. 
    - *Pragmatic*: Fixing the text (e.g., rephrasing a sentence). 
    - *Epistemic*: Explaining why a change helps (reducing uncertainty for the writer).
  - *How*: 
    - Ask the writer to suggest a fix first (action as minimization). 
    - If stuck, offer options: "We could shorten this or add an example. Which do you think fits?"
  - *Precision note*:
    - *High precision* (writer confident in their fix): "Great, let's try that. How does it sound now?" (test the new prediction).
    - *Low precision* (writer unsure): "Let's try one and see. We can always adjust."
  - *Sufficient answer*: The writer makes a change or understands why a change is needed.
  - *Stop early*: If time is short or the issue is complex, prioritize pragmatic fixes (get the draft functional). Note: "We can revisit this next time or in office hours."
  - *Hand back*: After each fix, ask: "Does that address your concern?" Then move to the next issue.

  **Step 4: Planning Next Actions (5 minutes)**
  - *Action*: Summarize what was done and what remains. Ask: "What will you do next with this draft?"
  - *Goal*: Ensure the writer has a plan to minimize remaining errors (active inference).
  - *Sufficient answer*: The writer states concrete steps (e.g., "I'll revise the conclusion," "I'll check citations").
  - *If vague*: Help specify: "When will you do that? Do you need other resources?"
  - *Dark room guard*: If the session was mostly validation (e.g., no real changes), still assign a small task: "Try reading your intro aloud to a friend and see if they get your main point."

  **Step 5: Session Note and Feedback (Post-session)**
  - *Action*: Write the note (for the instructor) immediately. Focus on what the writer did (not what you did) and their plan.
  - *Evaluation note*: If the writer avoided challenges (dark room), note that gently: "Discussed strategies for self-revision; encouraged writer to test draft with a peer."

  ---

  **Where the Theory Does Real Work:**
  - **Reading precision**: You infer confidence from the writer's tone, speed, and specificity. High precision = firm statements, low precision = hesitations, "I don't know".
  - **High vs. low precision actions**: 
    - High: Probe with counterexamples (to gently lower precision if needed). 
    - Low: Narrow the focus (one sentence) to build confidence.
  - **Uncertainty reduction vs. getting it done**: 
    - If the draft is due soon: Prioritize pragmatic (fix now). 
    - If there's time: Spend on epistemic (teach why).
  - **Dark room prevention**: Always end with a small challenge (even if just "read this aloud to yourself") to avoid pure validation.

  **Where the Translation Fails:**
  - **Precision is a metaphor**: You can't measure it, only guess from behavior. Sometimes you'll misread confidence.
  - **Post-hoc fitting**: The story will fit because the brain minimizes surprise — but the procedure forces evidence sampling (Step 2) to ground it.
  - **Judgment calls**: Choosing which issue to tackle first, when to push vs. comfort, how hard to challenge.

  ---

  **Run the Procedure on Cases**

  **Case 1: First-year student, confident but wrong about essay focus (ambition in Macbeth)**
  - **Step 1**: 
    - Tutor: "What would you like to focus on?"
    - Writer: "I just need to fix some grammar. My essay is about ambition in Macbeth, and it's solid."
    - *High precision, likely overconfident*. 
    - Tutor probes: "Great, let's start by reading your thesis aloud. What scene best shows ambition to you?" (tests the prediction).
  - **Step 2**: 
    - Writer reads thesis: "Macbeth's ambition is his tragic flaw." 
    - Tutor: "What in the thesis points to ambition?" (Writer fumbles.) 
    - Tutor: "Let's check the assignment. It asks for how gender shapes power. How does ambition relate to that?" 
    - *Sampling reveals error*: The writer's prediction ("I'm writing about ambition") clashes with assignment.
  - **Step 3**: 
    - *Epistemic focus*: Tutor reduces uncertainty: "Let's see where gender appears in your draft." 
    - Writer realizes ambition is present but not linked to gender. 
    - *Pragmatic*: They revise thesis together: "Macbeth's ambition is fueled by patriarchal pressures..." 
  - **Step 4**: 
    - Plan: "Revise body paragraphs to connect ambition to gender using scenes we discussed."
  - **Why it works**: The tutor used the writer's high confidence to sample evidence (the thesis and assignment), which generated prediction error (epistemic). Then they minimized it with a fix.

  **Case 2: Multilingual grad student, "everything is a problem" (many surface errors)**
  - **Step 1**: 
    - Writer: "Everything is wrong. My grammar, my words, everything." 
    - *Low precision (diffuse uncertainty)*. 
    - Tutor: "Let's pick one paragraph to start. Read this one aloud. What feels most urgent?" (narrowing).
  - **Step 2**: 
    - Writer reads, stumbles on sentences. 
    - Tutor: "Let's look at one sentence. This one is long. What's the main verb?" (focus on one prediction).
  - **Step 3**: 
    - *Pragmatic first*: Fix one sentence (break into two). 
    - *Then epistemic*: Explain why short sentences help clarity in English. 
    - Tutor: "Now you try the next sentence." (writer does). 
    - *After two sentences*: "Do you see a pattern? Long sentences without punctuation. Let's mark places to add periods." 
  - **Step 4**: 
    - Plan: "Revise one page a day, focusing on sentence length. Use Grammarly for commas, but only after you try to break sentences first."
  - **Why it works**: Low precision required narrowing to one error type. Pragmatic fixes built confidence, then epistemic learning generalized it.

  **Case 3: Strong senior, polished drafts, seeks validation (dark room risk)**
  - **Step 1**: 
    - Writer: "I just want to make sure it's okay. It's due tomorrow." 
    - *High precision (confident it's good)*. 
    - Tutor: "Great, let's read the first page aloud. What are you most proud of here?" (tests prediction).
  - **Step 2**: 
    - Writer reads smoothly. 
    - Tutor: "This is strong. What might a reader question?" (introduces epistemic uncertainty). 
    - Writer: "Maybe nothing? I think it's clear." 
  - **Step 3**: 
    - *Dark room guard*: Tutor must induce a small error. 
      - "Let's check the assignment rubric. Does your conclusion address all points? Read it aloud." 
      - Or: "What's one thing you changed from last draft? Why?" (forces reflection).
    - If no issues found: "I agree it's polished. For growth, try this: next draft, vary your sentence openings. Here's one place you could." (small challenge).
  - **Step 4**: 
    - Plan: "Submit as is. For next time, book earlier and we'll work on stylistic flair."
  - **Why it might cost evaluations**: The writer wanted validation ("dark room"). You introduced work (epistemic). But the theory commits you because:
    - Agents must minimize expected free energy, which includes exploration (epistemic). Without it, the writer doesn't grow.
    - The tutoring center's goal is learning, not just comfort.
  - **Fallback if theory fails**: If the writer is stressed (e.g., due tomorrow), prioritize well-being: validate and wish luck. Note: "Theory is not dogma; ethics matter."

  **Teachability**: 
  - Train in 1 hour: Role-play Steps 1-4. Emphasize: 
    - "Start with their goal" (Step 1). 
    - "Look at the text early" (Step 2). 
    - "Get them to suggest fixes" (Step 3). 
    - "End with a plan" (Step 4). 
  - Avoid theory words: Use "confidence" for precision, "fixing vs. understanding" for pragmatic/epistemic, "small next step" for dark room guard.

  This procedure balances theory and practice, with clear off-ramps for judgment.
answer: |-
  Below is a complete, step-by-step procedure for writing tutoring sessions, grounded in predictive processing (PP) and active inference (AI) principles. I'll distill the theory into actionable steps without jargon, then apply it to your three cases. The procedure focuses on **minimizing prediction errors** (gaps between what the writer expects and what's on the page) by adjusting **precision** (confidence in predictions) through **pragmatic** (goal-focused) and **epistemic** (uncertainty-reducing) actions. Crucially, it includes guards against the "dark room" problem (avoiding growth for comfort). 

  The procedure is designed for 45-minute sessions, teachable in 1 hour to non-science tutors, and usable without theory language. I'll flag where PP/AI provides real leverage, where it's metaphorical, and where judgment is unavoidable. 

  ---

  ### **The Writing Tutoring Procedure: 5 Steps**
  **Core PP/AI Translation:**  
  - **Perception-action as one minimization**: Tutor and writer co-minimize errors by testing predictions (perception) against the text and taking steps to fix them (action).  
  - **Precision**: A writer's confidence level signals how much to challenge them. High precision (overconfidence) requires gentle error exposure; low precision (underconfidence) requires narrowing focus.  
  - **Pragmatic vs. epistemic**: Balance quick fixes (pragmatic, e.g., correcting a sentence) against teaching/exploring (epistemic, e.g., "Why is this unclear?"). Prioritize pragmatic if time is short.  
  - **Dark room objection**: Prevent sessions from becoming "validation traps" by always adding a small challenge.  
  - **Handoff points**: The writer must own their predictions (e.g., "What do you think?"). Stop early if they disengage or if the question is inherently theirs (e.g., "What's your argument?").  

  **Steps Overview:**  
  1. **Set the prediction** (5 min): What does the writer expect?  
  2. **Test the evidence** (10 min): Sample the text to check predictions.  
  3. **Minimize errors** (20 min): Fix errors pragmatically or epistemically.  
  4. **Plan next actions** (5 min): Assign active inference (writer-led next steps).  
  5. **Close and document** (5 min): Note session outcomes.  

  ---  
  #### **Step 1: Set the Prediction (5 min)**  
  **Goal**: Identify the writer's precision level and focal prediction.  
  **Actions**:  
  - Ask: *"What's one thing you want to make sure we address today?"*  
  - If they shrug or say "I don't know" (low precision): Ask, *"Shall we look at [assignment guidelines/a specific section] together?"*  
  - If they state a concern (e.g., "My conclusion is weak"): Ask, *"What does 'weak' look like to you?"* to gauge precision.  
  - If they're overly broad (e.g., "Everything is bad"): Narrow to one page/section.  

  **Sufficient Answer**: A specific prediction (e.g., "My thesis isn't clear").  
  **Stop Early If**: The writer can't identify a focus after 2 prompts. Hand back by saying, *"Let's start by reading the first paragraph aloud—we might spot something."* (This samples evidence to reduce uncertainty.)  
  **Judgment Call**: Assessing precision from tone/body language (confident = high precision; hesitant/vague = low).  
  **Theory in Action**: Precision determines your next move. High precision risks overlooking errors (needs gentle contradiction); low precision risks overwhelm (needs scaffolding).  

  #### **Step 2: Test the Evidence (10 min)**  
  **Goal**: Gather "sensory evidence" (the text) to confirm/refute the writer's prediction.  
  **Actions**:  
  - Have the writer read aloud a 1–2 paragraph section related to their prediction.  
  - Ask: *"As you read, does this match what you expected? Where does it feel off?"*  
  - **High precision response** (e.g., "It's perfect"): Gently challenge: *"What would a reader need clarified here?"*  
  - **Low precision response** (e.g., "I don't know"): Narrow: *"Let's look at one sentence. What's the main idea here?"*  

  **Sufficient Answer**: The writer identifies a match/mismatch (e.g., "This sentence is jumbled").  
  **Stop Early If**: The writer resists reading. Hand back: *"You're the expert on your work—could you point to one spot you'd tweak?"*  
  **Judgment Call**: Choosing which section to sample. Prioritize areas affecting goals (e.g., thesis for argumentative essays).  
  **Theory in Action**: Sampling the text generates prediction errors. Precision dictates how hard to push: High precision = induce small errors; low precision = reduce noise by focusing.  

  #### **Step 3: Minimize Errors (20 min)**  
  **Goal**: Resolve errors through pragmatic (quick fix) or epistemic (deep dive) actions.  
  **Actions**:  
  - Ask the writer to suggest a fix first (active inference: they act to minimize error).  
  - **Pragmatic move** (if time <15 min or confidence low): *"Let's fix this sentence together now."*  
  - **Epistemic move** (if time >15 min or confidence high): *"Why do you think this happens? Let's find a pattern."*  
  - **Adjust for precision**:  
    - High precision: Play "devil's advocate" (e.g., *"What if a reader thought this meant X?"*) to lower overconfidence.  
    - Low precision: Co-create a "rule" (e.g., *"Let's circle every verb—are they active?"*) to build confidence.  

  **Sufficient Answer**: The writer revises a sentence or articulates a pattern (e.g., "I see why this is confusing").  
  **Stop Early If**: The writer stalls or time runs low. Hand back: *"Try this revision and see how it feels."*  
  **Handoff to Writer**: Questions only they can answer (e.g., *"What's your core argument?"*). Say: *"That's your call—I can help phrase it, but you own the idea."*  
  **Theory in Action**: Splitting pragmatic/epistemic avoids dark rooms. Fixing one sentence (pragmatic) prevents overwhelm; exploring "why" (epistemic) promotes long-term learning.  

  #### **Step 4: Plan Next Actions (5 min)**  
  **Goal**: Ensure the writer leaves with active inference steps (not passive validation).  
  **Actions**:  
  - Ask: *"What will you do next based on today?"*  
  - If the session was easy/validation-heavy (dark room risk), add a micro-challenge: *"Try reading this aloud to a friend and ask if they spot gaps."*  
  - **Precision adjustment**:  
    - High precision: Assign broader feedback (e.g., *"Ask your professor if this matches the prompt"*).  
    - Low precision: Assign a tiny task (e.g., *"Revise just this paragraph"*).  

  **Sufficient Answer**: Concrete next step (e.g., "I'll rewrite the introduction tonight").  
  **Stop Early If**: Writer is out of time. Still assign one action: *"Jot one thing to revisit later."*  
  **Theory in Action**: Forces "exploration" (epistemic) over "exploitation" (pragmatic only), countering dark room tendencies.  

  #### **Step 5: Close and Document (5 min)**  
  **Actions**:  
  - Write the session note: Focus on the writer's actions (not yours) and their next steps.  
  - **For evaluations**: If you challenged a high-precision writer, note: "Refined focus to align with goals."  

  ---  
  ### **Where Theory Works, Fails, and Judges**  
  - **Real theory leverage**:  
    - Precision is inferred from behavior (e.g., assertive tone = high; pauses/self-doubt = low). You don't need numbers.  
    - High precision → induce small errors; low precision → reduce scope.  
    - Pragmatic vs. epistemic choice: If due date is close, prioritize pragmatic; if early, lean epistemic.  
    - Dark room guard: Always end with a "sample" task (e.g., "Show this to X") to avoid mere comfort.  
  - **Where theory is metaphorical**:  
    - Precision isn't measurable—it's a gut read. Misjudging it can backfire (e.g., pushing too hard on a nervous writer).  
    - "Minimizing errors" can be retrofitted: Any successful session will fit the story. Step 2 (testing evidence) grounds it.  
  - **Judgment calls disguised as procedure**:  
    - Choosing which section to sample (Step 2).  
    - Deciding pragmatic vs. epistemic (Step 3) based on time/temperature.  
    - Balancing writer's feelings against growth (especially in dark room cases).  

  ---  
  ### **Case Runs**  
  **Context for all**: 45-min drop-in, no editing rule, end-of-semester evals matter. Tutor never says "precision" or "inference."  

  #### **Case 1: First-year student, confident essay is about ambition in Macbeth (but wrong)**  
  - **Step 1**: Writer says, *"I need to polish my analysis of Macbeth's ambition."* Tone confident (high precision).  
    - Tutor probes: *"What scene shows ambition best?"* → Writer cites Act 1.  
    - **Judgment**: High precision—needs evidence test to gently challenge.  
  - **Step 2**: Read thesis aloud: *"Macbeth's ambition causes his downfall."*  
    - Tutor: *"The prompt asks how gender shapes power—where does that fit?"*  
    - Writer hesitates: *"Well, Lady Macbeth pushes him..."*  
    - **Theory**: Sampling exposes error—writer predicted ambition is central, but prompt prioritizes gender.  
  - **Step 3**: Writer realizes misalignment (prediction error).  
    - **Epistemic move** (time allows): *"Why might ambition and gender be linked?"* → Discuss Lady Macbeth.  
    - **Pragmatic move**: Revise thesis: *"Macbeth's ambition is fueled by patriarchal pressure, leading to..."*  
  - **Step 4**: Plan: *"Re-read Acts 1 and 5, noting gender/power dynamics. Revise thesis tonight."*  
  - **Step 5**: Note: "Writer refined thesis to address prompt focus on gender. Plans revision."  
  - **Why theory worked**: High precision required evidence-testing to lower confidence. Minimizing error here was epistemic (teaching prompt alignment).  

  #### **Case 2: Multilingual grad student, "everything is a problem" (many surface errors)**  
  - **Step 1**: Writer sighs: *"Everything is wrong—grammar, flow, everything."* Low precision (diffuse).  
    - Tutor narrows: *"Let's tackle one page. What feels most urgent?"* → Writer points to grammar.  
  - **Step 2**: Read paragraph aloud. Writer stumbles on long sentences.  
    - Tutor: *"Which sentence feels most off?"* → Writer IDs one.  
    - **Theory**: Narrowing samples evidence to reduce noise. Low precision needs focus.  
  - **Step 3**:  
    - **Pragmatic first** (time crunch): *"Let's break this sentence. Where could you add a period?"*  
    - Then **epistemic**: *"Do you see a pattern? Long sentences often need punctuation. Circle verbs in this paragraph—are they active?"*  
    - Writer revises 2 sentences, spots passive voice.  
  - **Step 4**: Plan: *"Revise one page daily. Focus on sentence length before grammar tools."*  
  - **Step 5**: Note: "Writer identified sentence-length patterns. Plans incremental revisions."  
  - **Why theory worked**: Low precision required scoping to one error type. Pragmatic fixes built confidence for epistemic growth.  

  #### **Case 3: Strong senior, polished drafts, wants validation (dark room risk)**  
  - **Step 1**: Writer smiles: *"Just check it’s okay? It’s already polished."* High precision (confident).  
    - Tutor: *"Sure—what part are you proudest of?"* → Writer cites conclusion.  
  - **Step 2**: Read conclusion aloud. It’s strong.  
    - Tutor adds micro-challenge (dark room guard): *"What might a skeptic question?"*  
    - Writer: *"Maybe... the data source?"*  
  - **Step 3**:  
    - **Epistemic move** (time allows): *"Why did you pick this source? Could you add one sentence explaining it?"*  
    - Writer adds justification (minimal effort).  
    - **If resistant**: Tutor pragmatically suggests: *"Add a footnote? Up to you."*  
  - **Step 4**: Plan: *"If you have time, add that source note. Otherwise, submit—it’s strong!"*  
    - **Dark room guard**: *"Next week, let’s workshop how to engage opposing views."* (Adds growth path.)  
  - **Step 5**: Note: "Writer refined data justification. Plans to consider broader engagement."  
  - **Theory commitment**: You must add a challenge (e.g., "What might a skeptic say?"). Why? PP says agents minimize prediction error by avoiding discomfort (dark room). Validation-only sessions are "error-free" but stunt growth. This could cost evaluations—if she wanted pure praise, she might rate you lower.  
  - **Fallback position**: If the writer is stressed (e.g., deadline panic), skip the challenge—well-being trumps theory. Note: *"Theory isn’t ethics. If someone needs comfort, give it. But in low-stakes cases like this, gentle nudges uphold the center’s mission."*  

  ---  
  ### **Final Notes**  
  - **Teachability**: Practice Steps 1–4 in role-plays. Emphasize:  
    - "Start with their goal."  
    - "Ask them to read aloud—it reveals errors."  
    - "Get them to suggest fixes first."  
    - "Always assign a next step."  
  - **When Theory Fails**:  
    - Writers in crisis (e.g., anxiety, deadlines): Use pragmatic fixes only.  
    - Subjective feedback (e.g., "Is this creative enough?"): Fall back to "What did your professor say?"  
  - **Evals vs. Growth**: The procedure may cost evals with dark-room seekers, but it ensures the center’s funding relies on demonstrable learning, not just satisfaction.  

  This gives you a concrete, theory-rooted tool that works silently in the room. For training: Start with the steps, then layer in precision/intuition through examples.
