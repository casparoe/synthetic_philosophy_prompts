  Based on the pattern of Dana's verdicts and the underlying concept of "standing" (likely derived from online discourse about moral authority to call out wrongdoing), I'll break this down into three parts: the inferred rule, its application to Marcus, and a diagnostic test case. The goal is to reverse-engineer Dana's reasoning, identify alternative rules that fit the existing cases, and see where they diverge on Marcus.

  ### 1. The Rule Dana is Likely Using
  **Best Guess for Dana's Rule:**  
  Dana's verdicts suggest she operates on a **"clean hands and no systemic complicity" rule**. Specifically:  
  **A person has standing to call out non-repayment of personal debts if and only if:**  
  - **They are not currently in default on any personal debt (i.e., they have no outstanding unpaid debts they are actively avoiding), AND**  
  - **They are not systemically complicit in enabling or profiting from debt non-repayment (e.g., by encouraging reckless borrowing or benefiting from others' defaults).**  

  **Why this fits all six cases:**  
  - **Dave (no standing):** He's currently in default on debts to two people, violating the "not currently in default" condition. His hypocrisy disqualifies him.  
  - **Stranger (standing):** No current defaults and no systemic complicity—clean hands grant standing.  
  - **Priya (standing):** Past defaults are irrelevant because she reformed (paid back with interest, apologized, and stopped). She meets both conditions now.  
  - **Hypothetical person (standing):** Never defaulted, so no current debt issues. What they "would have done" is irrelevant because the rule focuses on actual behavior, not hypotheticals.  
  - **App woman (no standing):** Never borrowed, so no personal default. But she's systemically complicit—her business model (pay-in-four apps) encourages debt cycles people can't escape, profiting from potential defaults. This triggers the "systemic complicity" exception, hence Dana's strong reaction.  
  - **Shoplifter (standing):** Shoplifting is unrelated to debt non-repayment. He may be morally flawed, but he's not in default on debts nor complicit in enabling non-repayment, so he gets standing.  

  **Why I prefer this rule:**  
  - It explains the app woman case, which is the outlier. Her lack of standing can't be explained by personal wrongdoing (she never borrowed), so systemic complicity must be key.  
  - It handles Priya's reform cleanly: past actions don't matter if you've made amends and aren't currently defaulting.  
  - It distinguishes between different types of wrongdoing (shoplifting vs. debt default), showing the rule is specific to the harm being called out.  
  - It aligns with common "standing" concepts in ethics, where hypocrisy or benefiting from the system you criticize undermines moral authority.

  ### 2. Alternative Rules That Fit the Six Cases
  Other rules can fit the data but may diverge on Marcus. Here are two alternatives, both consistent with the six cases but with different implications:  

  - **Alternative Rule 1: "Current hypocrisy bar"**  
    Standing requires that you are not currently engaging in the exact behavior you're criticizing. Past behavior is irrelevant if reformed, and unrelated wrongs (like shoplifting) don't count. Systemic complicity (e.g., app woman) is treated as "engaging in" the harm by proxy.  
