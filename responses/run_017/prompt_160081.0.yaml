      "adjudicator_legitimacy": "Legitimized only if trained on values the person endorsed as stable and authorized (e.g., via past directive).",
      "cycling_self": "Defer to a process averaging values across cycles or appointing a neutral surrogate—never a single phase."
    }
  }
