  ok so my friend Priya and I got into a genuinely long argument last night and I don't want someone to settle it, I want someone to settle what we were even arguing about. Her mom was just diagnosed with early-stage Alzheimer's and is going to a lawyer about an advance directive, and Priya is all the way on the side of: whatever her mom writes now has to bind the person her mom becomes, that IS the whole point of the thing, otherwise you're just letting the disease do the rewriting. I kept throwing cases at her where that feels obviously wrong and we went around in circles for two hours without ever stopping to ask what we were each demanding a theory of this even do. So please: you're a professional philosopher who works on personal identity and practical rationality — brainstorm the space of cases for a minute before you write anything, and don't just hand me the familiar four principles, I've read those.

