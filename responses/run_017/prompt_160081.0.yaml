answer: |-
  ### Requirements for a Theory of Diachronic Authority

  | id | requirement                                                                                                | motivating_case                                                                 | status             | what_it_excludes                                                                 | conflicts_with |
  |----|------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|--------------------|----------------------------------------------------------------------------------|----------------|
  | 1  | Must override the directive when the later self's core values have transformed (e.g., conversion, transition). | Transformative change: A nun now repudiates her atheist directive for blood transfusion. | non-negotiable     | Strict self-governance (binding force from authorship alone).                    | 14             |
  | 2  | Must discount directives issued in temporary impaired states (e.g., mania, withdrawal).                    | Temporary state: Directive written in acute pain refuses future pain management. | non-negotiable     | Views ignoring decision-making context.                                          | 14             |
  | 3  | Must prioritize the later self’s well-being when the directive causes foreseeable suffering.              | Standard dementia: Content patient refuses directive denying antibiotics.       | non-negotiable     | Theories ignoring experiential harm.                                             | 14             |
  | 4  | Must resolve cyclical selves non-arbitrarily (no phase-privileging).                                       | Cycling self: Values shift monthly; directive conflicts with current manic refusal. | non-negotiable     | Views requiring a unified later self.                                            | –              |
  | 5  | Must ground adjudicator legitimacy in the person’s own values, not external proxies.                       | Archival-self: AI trained on lifetime data overrides current refusal.           | non-negotiable     | Theories rejecting all third-party adjudication.                                 | –              |
  | 6  | Must distinguish outcome directives ("no CPR") from decisional directives ("let my daughter decide").      | All cases: Directive delegates authority to a surrogate.                        | non-negotiable     | Theories conflating directive types.                                             | –              |
  | 7  | Must prohibit directives authorizing intrinsic wrongs (e.g., torture) to the later self.                   | Hypothetical: Directive consents to non-therapeutic amputation for research.    | non-negotiable     | Absolute directive authority.                                                    | –              |
  | 8  | Must honor waivers of rights (e.g., DNR) differently from commitments (e.g., organ donation).              | General: Waiving right to refuse vs. committing to risky surgery.               | non-negotiable     | Uniform treatment of directives.                                                 | –              |
  | 9  | Must reject identity as the sole criterion for authority (continuity ≠ persistence).                       | Dementia: Low psychological continuity despite same identity.                   | non-negotiable     | Identity-reductionist views.                                                     | –              |
  | 10 | Must weight current refusal heavily against the directive unless overridden by continuity.                 | Dementia patient pleading to live against her directive.                        | non-negotiable     | Always-binding directive theories.                                               | 14             |
  | 11 | Binding force must scale with psychological/value continuity (not identity).                               | Temporary state: High continuity vs. dementia: low continuity.                  | camp-preference (continuity) | Self-governance (prioritizes authorship over continuity).          | 14             |
  | 12 | Must permit directives to preempt later self’s judgment when disease distorts agency.                      | Dementia: Earlier self blocks later self’s reversal to "enjoy" cognitive decline. | camp-preference (self-gov) | Continuity views (if discontinuity voids authority).             | 1, 3, 10, 11   |
  | 13 | Must not collapse "better-placed" (informed/calm) and "authoritative" (right to bind) distinctions.        | Mania: Directive written calmly but current self refuses in stable state.       | non-negotiable     | Conflation of epistemic and deontic authority.                                   | –              |
  | 14 | Binding force requires the earlier self to have settled the matter, not just advised.                      | General: Directive framed as preference vs. command.                            | non-negotiable     | Views treating directives as non-committal advice.                               | –              |

  ### Analysis  
  **Most exclusionary requirement**: ID 10 (weight current refusal). It forces theories to permit overriding directives in live conflicts, excluding rigid views (e.g., "always bind") and demanding nuance.  
  **Unsatisfiable subset**: IDs 11 + 12. Continuity (ID 11) voids authority in low-continuity cases (e.g., dementia), while self-governance (ID 12) insists authority persists despite discontinuity—creating irreconcilable demands.  
  **Scorecard for views**:  
  - **Self-governance**: Fails IDs 1–3,10 (ignores transformation, suffering, refusal).  
  - **Continuity**: Fails ID 12 (rejects disease-based authority), strong on IDs 1,3,11.  
  - **Procedural**: Best on IDs 4–6,13; weak on ID 10 if surrogates ignore current refusal.  

