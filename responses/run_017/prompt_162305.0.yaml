  Here is a test case meeting your specifications, drawn from the domain of **mandatory military conscription during wartime**:

  **The Case: Peacetime Conscription vs. Wartime Mobilization**
  *   **Situation:** Nation A faces an imminent, massive invasion. It has a choice:
      *   **Option 1 (Peacetime Conscription Model):** Maintain its existing, smaller professional army supplemented by a limited, rotating peacetime draft focused on training. This minimizes disruption to civilian life. The invasion is repelled, but at a higher immediate cost in professional soldier lives and a longer, more brutal conflict due to lower initial troop numbers. The war ends in 3 years.
      *   **Option 2 (Wartime Mobilization):** Implement immediate, massive conscription. Millions of young adults (18-25) are abruptly drafted, trained hastily, and deployed en masse. This causes severe societal disruption: universities and businesses empty, communities fracture, social events vanish. This larger force repels the invasion faster and with fewer overall casualties, ending the war in 18 months.
  *   **Identity-Affecting Causal Chain (Constraint a):**
      1.  **Decision:** Choosing Wartime Mobilization (Option 2).
      2.  **Immediate Effect:** Millions of specific individuals (Cohort W) are physically relocated to training camps and deployment zones *at precise times*, removing them from their civilian social environments (hometowns, universities, workplaces, social circles).
      3.  **Altered Social Interactions:** During the 18-month war period, Cohort W is geographically isolated and socially constrained within military units. Their potential romantic/sexual partners during this period are overwhelmingly limited to fellow service members or locals near bases/deployment zones – a vastly different pool than their civilian peer group.
      4.  **Altered Conceptions:** Post-war, when Cohort W demobilizes and reintegrates, they form relationships and conceive children. Crucially, the *specific pairings* (which sperm fertilizes which egg, at which exact moment) are overwhelmingly different than under Option 1. Under Option 1, Cohort W would have remained embedded in their original civilian lives throughout the war period. They would have met, dated, and conceived with partners from their pre-war civilian circles at different times. The chaotic reintegration period under Option 2 also creates unique, fleeting encounters unlikely in the smoother transition of Option 1.
      5.  **Numerically Different Individuals:** The children born 1-5 years post-war under Option 2 are almost entirely numerically distinct from those who would have been born under Option 1. The specific gametes that united are different because the potential parents were interacting with different people, in different places, at different times (during the critical war years and chaotic reintegration), making the conception of the *same* individual (requiring the same sperm and egg uniting at the same time) astronomically improbable. The children under Option 2 exist *because* of the mobilization; they wouldn't have been conceived otherwise.
  *   **Moral Resistance & Harm (Constraint b):** Suppose the post-war society under Option 2 (Wartime Mobilization) suffers significant, long-term negative consequences traceable to the mobilization itself:
      *   A generation (Cohort W) with widespread untreated PTSD and physical disabilities due to intense, rushed combat.
      *   A "lost generation" gap in higher education and skilled professions due to interrupted studies/careers.
      *   Deep social fragmentation and distrust stemming from the abrupt disruption and reintegration trauma.
      *   Consequently, the children born post-war (Group C2) grow up in a society with poorer economic opportunities, weaker social cohesion, higher crime, and a strained healthcare/education system *compared to the likely society had Option 1 been chosen*. Group C2's lives are significantly worse than the lives Group C1 (the children who *would* have existed under Option 1) would likely have had.
      *   **Resistance Point:** People strongly resist the claim that choosing Option 2 caused "no harm" or "no injustice" to Group C2. They argue Group C2 was *wronged* by being born into a society crippled by the very policy that caused their existence. Saying "but you wouldn't exist otherwise" feels like a morally irrelevant technicality that dodges the clear negative impact on their lives and the societal damage. The policy seems to have inflicted a serious, foreseeable collective harm on the future generation that materialized.
  *   **Contested Application (Constraint c):** It is genuinely contested whether the nonidentity problem applies here. Proponents argue the causal chain is clear: different policy → different wartime social geography/timing → different conceptions → different people. Critics argue:
      *   The link is too indirect and probabilistic; maybe *some* of the same children could have been conceived later or under slightly different circumstances.
      *   The harm is primarily to the *society* and the *parents* (Cohort W), and Group C2 merely inherits these bad circumstances – it's not a harm *to them* stemming directly from the decision to create *them* in a worse state. The harm is circumstance-affecting for existing people (Group C2), not identity-affecting in a morally relevant way for justifying their complaint.
      *   The comparison is illicit because Group C1 is merely hypothetical; we can only judge the well-being of the actual people (Group C2) relative to a baseline of non-existence, which isn't harmful.

  ---

  **Analysis as Requested:**

  1.  **Surviving Moral Complaint & Its Strength:**
      *   The strongest surviving complaint is likely **impersonal badness** (the world is worse because a worse-off population exists) combined with **unfair distribution of burdens/opportunities among the *actual* people who exist** (Group C2 and their parents, Cohort W).
      *   **Impersonal Badness:** Choosing Option 2 creates a population (Group C2) with lower well-being than the (different) population that would have existed under Option 1. The *state of the world* is worse. This complaint survives nonidentity.
      *   **Unfair Distribution (Among Existing People):** The burdens of the war and its aftermath (PTSD, lost opportunities, societal strain) fall heavily and avoidably upon Cohort W and Group C2. Group C2 inherits a diminished social inheritance – fewer opportunities, poorer institutions – through no fault of their own. This inequality and avoidable disadvantage among the *actual* people who do exist feels like an injustice. The policy created a society with an unfairly disadvantaged cohort.
      *   **Strength Assessment:** Does this account for the resistance? **Partially, but imperfectly.** The impersonal complaint often feels cold and abstract, failing to capture the intuition that Group C2 *themselves* were wronged. The unfair distribution complaint is stronger, focusing on the actual disadvantage suffered by Group C2 *within their society*. It comes closer, arguing they are victims of an avoidable societal harm inflicted by past policy. However, the resistance often includes the deeper intuition that bringing *these specific people* into existence in *this worse state* is itself the wrong, even if we can't say they were harmed *compared to non-existence*. The surviving complaints capture *aspects* of the wrong but may not fully satisfy the sense that the *identity-specific outcome* is objectionable.

  2.  **Dealing with Pervasiveness:**
      *   The causal chain *is* fragile and pervasiveness is real. Any significant policy altering life trajectories (major infrastructure projects, economic reforms, pandemics, large-scale migrations) can subtly shift meeting times/places and thus which conceptions occur.
      *   **How this example avoids sliding into paralysis:**
          1.  **Magnitude and Directness:** Conscription during total war is an extreme, state-mandated, *rapid* disruption directly controlling the location, social context, and life trajectories of millions during their peak fertility/conception years. The causal link to altered pairings is far more direct, massive, and temporally concentrated than the diffuse effects of most policies (e.g., a slight tax change influencing career choices over decades). It's a paradigmatic "butterfly effect" generator.
          2.  **Foreseeability of Societal Harm:** While foreseeing *specific* identities is impossible, the foreseeable, *systematic* negative consequences of mass mobilization (PTSD epidemic, lost human capital, social fragmentation) creating a worse future society *for whoever ends up living in it* is clear. The nonidentity issue doesn't negate the foreseeability of creating a worse social baseline.
          3.  **Focus on Actual Harm to Actual People:** We can still criticize the policy based on:
              *   Violations of rights/autonomy of the conscripted generation (Cohort W).
              *   The creation of avoidable, severe societal burdens *for the people who actually exist* (both Cohort W and Group C2), judged against a feasible alternative societal state (even if populated by different people).
              *   Impersonal disvalue: choosing a future with lower overall well-being.
      *   **Conclusion on Pervasiveness:** We should *not* abandon policy criticism. Instead, we must recognize that for large-scale, long-term policies, the "harm to future people" complaint often splits:
          *   A legitimate complaint about creating a *worse state of affairs* (impersonal) and/or *unfair disadvantage* for the future people who *will* exist.
          *   An *illegitimate* complaint framed as harming *specific* future individuals *who wouldn't exist otherwise* in a person-affecting way. The nonidentity problem forces us to refine our complaints, not abandon them entirely. Conscription exemplifies a policy where the societal harm complaint remains powerful even after acknowledging identity effects.

  3.  **Dialectic Clarification:**
      *   **Clearer:** This example makes the **pervasiveness of identity-affecting effects** starkly clear. It divorces the nonidentity structure from reproduction-*focused* decisions, showing it arises naturally from *any* large-scale social disruption altering life paths. It highlights that the core issue is the **contingency of identity** on vast numbers of seemingly minor events shaped by policy. This underscores that the nonidentity challenge isn't a niche problem for population ethics, but a fundamental feature of evaluating long-term consequences.
      *   **Murkier:** It makes the **moral significance of numerical identity** murkier. In standard cases (e.g., having a disabled child now vs. a healthy child later), the "different person" aspect is central and often conceded. Here, critics can more plausibly argue the identity shift is an irrelevant byproduct; the *real* wrong is the harm to the society and the disadvantage inflicted upon the actual children born into it (Group C2), regardless of whether they are numerically distinct. This intensifies the debate about *why* identity matters morally in these contexts. Does the numerical difference truly block a person-affecting harm claim for Group C2, or is it merely a metaphysical distraction from the tangible disadvantage they suffer?

  **Confidence Statement:**

  *   **Central Claim Confidence:** I am **highly confident (85%)** that mandatory wartime conscription on the scale described reliably creates identity-affecting effects (a numerically distinct future generation) through the causal chain of mass relocation, social isolation, altered pairing opportunities, and chaotic reintegration.
  *   **Least Sure Step:** I am **least confident (60%)** about whether the surviving moral complaints (impersonal badness, unfair distribution) are *sufficiently strong on their own* to fully account for the intense moral resistance described in constraint (b) – the feeling that Group C2 *themselves* were wronged *by being brought into existence in this worse state*. This step hinges on deeply contested intuitions about the moral weight of numerical identity versus disadvantage within a life worth living. While I believe the surviving complaints are robust and action-guiding, capturing the *full* force of the intuitive resistance remains philosophically challenging.
