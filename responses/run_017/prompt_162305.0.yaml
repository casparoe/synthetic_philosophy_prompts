  I need to recall what the nonidentity problem is. It's that an action can make things worse overall without harming any particular individual, because the alternative action would have resulted in different people existing. The standard examples are all about reproductive choices - like when to have children or environmental policies affecting future generations.

  The user wants something completely different - an institution or practice unrelated to reproduction that still affects which specific people come into existence through a causal chain. They've given three constraints: it must genuinely affect identities (different gametes), people would resist calling it not wrong, and it must be contested whether the nonidentity problem applies.

  I think about examples that could fit. Maybe something involving urban planning? Like how zoning laws or transit decisions might subtly change people's daily routines and social interactions. But I need a concrete case that fulfills all requirements.

