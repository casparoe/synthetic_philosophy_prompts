  This seems to fit well. People would resist saying conscription causes no harm to the children conceived under these circumstances, even though those children wouldn't exist otherwise. And it's contested whether nonidentity applies here - some might argue it's just about circumstances, not identities.

  For the three tasks: First, the surviving moral complaint might be impersonal badness - that a worse-off population exists overall. But impersonal badness feels weak for accounting for the moral resistance. Unfair distribution among existing people might work better if we consider how conscription creates unequal burdens.

  Second, the pervasiveness worry: if conscription affects identities, doesn't everything? I need to argue that while many policies might technically be identity-affecting, conscription is a dramatic, state-imposed disruption that makes the effect salient and morally relevant. We shouldn't abandon policy criticism but recognize that identity effects might sometimes dilute certain harms.

  Third, this example clarifies the dialectic by showing that identity-affecting effects aren't confined to reproduction-focused decisions, making the nonidentity problem more pervasive than typically acknowledged.

