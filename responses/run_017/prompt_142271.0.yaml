prompt: |-
  I've been reading my way through Adam Smith's *Theory of Moral Sentiments* on my own, with no philosophy background at all — I work nights in a hospital sterilisation department, there's a lot of standing around waiting for cycles to finish, and a few of us on the shift have got into the habit of taking one book at a time and arguing about it. We have just reached the beginning of Part III, Chapter I, and I have been stuck on the two opening paragraphs for over a week. I am reading the sixth edition, published in 1790. The passage is this:

  The principle by which we naturally either approve or disapprove of our own conduct, seems to be altogether the same with that by which we exercise the like judgments concerning the conduct of other people. We either approve or disapprove of the conduct of another man according as we feel that, when we bring his case home to ourselves, we either can or cannot entirely sympathize with the sentiments and motives which directed it. And, in the same manner, we either approve or disapprove of our own conduct, according as we feel that, when we place ourselves in the situation of another man, and view it, as it were, with his eyes and from his station, we either can or cannot entirely enter into and sympathize with the sentiments and motives which influenced it. We can never survey our own sentiments and motives, we can never form any judgment concerning them; unless we remove ourselves, as it were, from our own natural station, and endeavour to view them as at a certain distance from us. But we can do this in no other way than by endeavouring to view them with the eyes of other people, or as other people are likely to view them. Whatever judgment we can form concerning them, accordingly, must always bear some secret reference, either to what are, or to what, upon a certain condition, would be, or to what, we imagine, ought to be the judgment of others. We endeavour to examine our own conduct as we imagine any other fair and impartial spectator would examine it. If, upon placing ourselves in his situation, we thoroughly enter into all the passions and motives which influenced it, we approve of it, by sympathy with the approbation of this supposed equitable judge. If otherwise, we enter into his disapprobation, and condemn it.

  Were it possible that a human creature could grow up to manhood in some solitary place, without any communication with his own species, he could no more think of his own character, of the propriety or demerit of his own sentiments and conduct, of the beauty or deformity of his own mind, than of the beauty or deformity of his own face. All these are objects which he cannot easily see, which naturally he does not look at, and with regard to which he is provided with no mirror which can present them to his view. Bring him into society, and he is immediately provided with the mirror which he wanted before. It is placed in the countenance and behaviour of those he lives with, which always mark when they enter into, and when they disapprove of his sentiments; and it is here that he first views the propriety and impropriety of his own passions, the beauty and deformity of his own mind.

  Three of us have three readings, and I can't tell which one the sentences actually support. One friend says the impartial spectator is just the internalised average of the people who really did react to you, weighted by how much their good opinion mattered, so that conscience is smoothed social pressure and nothing more. I have the opposite worry: it looks to me as though the engine is not who the spectator is but the fact of viewing from "a certain distance" at all — that any standpoint not currently gripped by the passion would do the same work, so that "fair and impartial" is a by-product of the procedure rather than a standard it has to meet. A third friend says the whole thing is circular: I imagine a judge, imagine his approval, and then sympathise with my own imagining, which can only hand back to me whatever I felt already, now wearing a wig.

  Could you work through the passage with me rather than summarise Smith's theory for me? Specifically: what each of the three limbs of the "secret reference" sentence is doing, and which of them our "averaging" reading can and cannot absorb; whether the distance reading survives the fact that Smith specifies the spectator as fair and impartial rather than merely other, and what happens on his own machinery if I imagine a spectator who is biased or badly informed; and whether the sentence about approving "by sympathy with the approbation of this supposed equitable judge" really does collapse into self-endorsement, or whether there is a step in the paragraph that stops the collapse — and what that step costs him. I'd also like to know how any of this squares with the second paragraph: if the mirror is only "the countenance and behaviour of those he lives with", what is left for a conscience that condemns the very people who formed it, and does the passage give him the resources for that or does he need to import something later? If a question can only be settled by machinery Smith introduces much later in the book, please say what kind of move he would need rather than sending me to a place — I've no library access at work and no interest in commentaries or reading lists, I'd rather get as far as these two paragraphs will take me.
