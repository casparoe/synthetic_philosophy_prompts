  I should start by breaking down each desideratum. For example, the Ordinary Case Fidelity is non-negotiable because any theory must explain normal unified consciousness without overcomplicating or oversimplifying. Then, the Surgical Case Adequacy must handle both split-brain anomalies and hemispherectomy normalcy. Pseudo-Split Exclusion is vital to avoid overcounting disunities in conditions like neglect or blindsight.

  Distinguishing unity types is another key point. The user wants to prevent collapsing phenomenal unity with access or agency unity. The Degree Problem directly addresses whether unity is binary or gradable, which affects how split-brain cases are interpreted. The Report Bottleneck challenges theories to account for evidence beyond verbal reports, especially in mute streams.

  Explanatory Role and Mechanisms raise questions about whether unity must explain cognition or can be idle. Subpersonal commitments ask if a neural signature is necessary and if it's universal or case-specific.

  Now, identifying tensions. The Degree Problem and Report Bottleneck might conflict. If unity is all-or-nothing, split-brain cases with partial disunity become hard to categorize. Theories insisting on binary unity might struggle with intermediate cases. Similarly, the Report Bottleneck's demand for evidence beyond verbal reports clashes with theories that tie unity to reportability.

  The user's deeper needs include a theory that's metaphysically rigorous but applicable to empirical data. They want to avoid biases toward existing camps and seek clear criteria to evaluate theories. Highlighting the Subsumptive Mechanism requirement as the most divisive makes sense because it excludes views that don't specify a neural basis, which is crucial for adjudicating surgical cases.

  Finally, the table comparing theories helps visualize how each fares against desiderata. Noting that IIT struggles with pseudo-splits and global workspace conflates access with phenomenal unity clarifies limitations. Primitive relation accounts might handle the mute stream but lack empirical adjudication tools.

  In conclusion, the user needs a structured framework to critically assess theories, emphasizing tensions between desiderata and practical applicability to real cases, especially split-brain scenarios where empirical data and metaphysics intersect.
answer: |-
  Here are the desiderata for an adjudicative theory of phenomenal unity, structured as requested. I've sharpened cases, flagged tensions, and identified the most divisive requirement. Desiderata are categorized by strength and motivation, with covert commitments exposed.

  ### Core Non-Negotiable Desiderata (Constraint All Plausible Theories)
  1.  **Ordinary Case Fidelity:**
      *   **What:** Must account for the robust, seemingly seamless co-consciousness of multimodal experiences (e.g., seeing a cup while hearing coffee pour, feeling its warmth, and thinking "breakfast") in a neurologically intact subject.
      *   **Motivation:** Any theory failing here is inadequate *ab initio*. The target phenomenon exists.
      *   **Non-Negotiable?** Yes. Baseline explanandum.
      *   **Covert Commitment?** No. Neutral on *how* it's achieved.

  2.  **Surgical Case Adequacy:**
      *   **What:** Must adjudicate split-brain cases (callosotomy patients exhibiting conflicting responses, alien hand, chimeric reporting), hemispherectomy cases (remarkable functional normalcy despite massive tissue loss), and callosal agenesis (congenital absence of corpus callosum, often near-normal function). Must deliver verdicts on (i) number of subjects, (ii) unity of each subject's field, (iii) what evidence shifts the verdict.
      *   **Motivation:** These are the critical test cases demanding adjudication. A theory must *use* these data, not just accommodate them post-hoc. *Sharpening:* Focus on *simultaneous* conflicting responses (e.g., left hand grabbing pants while right hand pulls them up *at the same time* in response to a hidden chimeric cue), and the *absence* of such conflict in hemispherectomy/agenesis under standard conditions. What neural/behavioural difference explains the divergence?
      *   **Non-Negotiable?** Yes, per your core request. The theory *must* be built/applied for this job.
      *   **Covert Commitment?** No. Neutral on verdict (1 vs. 2 subjects, etc.).

  3.  **Pseudo-Split Exclusion:**
      *   **What:** Must provide a principled criterion distinguishing genuine phenomenal disunity (as potentially in splits) from mere informational insulation or lack of access/report/control *within a single unified field* (e.g., blindsight - unreportable vision; neglect - unattended/unaccessed stimuli; absorption - narrowed focus; sleepwalking - lack of higher control/report).
      *   **Motivation:** Avoiding false positives is crucial. Informational insulation alone is insufficient for disunity (we have parallel visual streams normally). *Sharpening:* Contrast a split-brain patient's left hemisphere verbally denying seeing a snow scene (projected to RH) while the left hand correctly selects a snow shovel *from an array*, with a neglect patient failing to report a stimulus on the left but showing implicit processing (e.g., affective priming). Why is the first candidate disunity and the second not?
      *   **Non-Negotiable?** Yes. Lack of this criterion renders the theory uselessly over-permissive.
      *   **Covert Commitment?** Possibly. Theories defining unity *solely* by access/report will struggle here (e.g., some Global Workspace variants).

  4.  **Unity Concept Distinction:**
      *   **What:** Must explicitly define and rigorously separate:
          *   *Phenomenal Unity:* The fundamental "togetherness" of experiences at a time (the target).
          *   *Access Unity/Reportability:* The ability for information to be globally available for cognition/report/action.
          *   *Diachronic Unity/Identity:* Persistence of a subject over time.
          *   *Agency/Motor Control Unity:* Coordinated, non-conflicting action.
          *   *Personhood (Moral/Legal):* Status as a bearer of rights/responsibilities.
      *   **Motivation:** Conflation is rampant (especially phenomenal/access) and muddies debates. A theory must isolate phenomenal unity to adjudicate cleanly. *Sharpening:* A split-brain patient might show *disunified agency* (hands conflicting) but *unified report* (only LH speaks). Does this imply phenomenal disunity? The theory must say why/why not without equating concepts.
      *   **Non-Negotiable?** Yes. Failure here invalidates the adjudicative goal.
      *   **Covert Commitment?** Theories collapsing phenomenal and access unity (e.g., strong Global Workspace) violate this directly.

  5.  **The Report Bottleneck:**
      *   **What:** Must specify what kind of evidence *beyond* or *independently of* verbal report (which is monopolized by one hemisphere in splits) could distinguish between:
          *   One subject with a partially disunified field (e.g., two co-conscious streams within one mind).
          *   Two distinct conscious subjects within one body.
          *   One subject with one unified stream plus confabulation/dissociation in the reporting system.
      Must also deliver a verdict on the "mute stream" case (e.g., a surgically isolated, potentially conscious right hemisphere lacking *any* output pathway).
      *   **Motivation:** Report is the primary (flawed) data source. Relying on it begs the question against disunity/duality. The mute stream case tests the theory's core commitments. *Sharpening:* What neural signature or behavioural test result (e.g., complex non-verbal integration within a hemisphere vs. across, neural markers of integrated vs. segregated processing) would decisively support one scenario over the others, *even if unreportable* by the mute stream?
      *   **Non-Negotiable?** Yes. Essential for objectivity in adjudication.
      *   **Covert Commitment?** Theories defining unity *by* reportability (e.g., Dennettian dismissivism) fail this fundamentally. Access-based theories struggle with the mute stream.

  ### Contentious Desiderata (Adjudicate/Argue For)
  6.  **The Degree Problem:**
      *   **What:** Must explicitly state whether phenomenal unity is all-or-nothing (binary) or admits of degrees. Must state whether the unity relation is symmetric and transitive (properties of equivalence relations). Must clarify the ontological commitment: "unified" means one subject, one phenomenal field, one total conscious state, or something else.
      *   **Motivation:** Split-brain data *look* intermediate. Is this genuine partial unity or just rapid switching/partial access within an all-or-nothing unity framework? *Sharpening:* If a split-brain patient can sometimes integrate information across hemispheres for complex tasks under specific conditions, but mostly behaves as two independent agents, does this indicate fluctuating unity, partial unity, or two unified agents with limited communication?
      *   **Non-Negotiable?** No. The theory must *take a stand*, but the stand is part of the theory.
      *   **Covert Commitment?** Yes. **Tension is Genuine.** Theories demanding an all-or-nothing equivalence relation (e.g., Subsumption, Primitive Relation) *exclude* genuine degrees. Theories allowing degrees (e.g., some IIT variants, gradable access theories) must explain why unity isn't just access/computation. **Recommendation:** **Take the "Admits Degrees" horn.** The surgical data resist clean binary classification. Insisting on all-or-nothing forces awkward interpretations of the intermediate cases (e.g., rapid switching too fast to detect, "partial subjects"). A graded view better captures the empirical messiness. However, require the theory to specify *what* is graded (e.g., richness of integration, scope of the field).

  7.  **Explanatory Role:**
      *   **What:** Must state whether phenomenal unity plays a necessary causal/explanatory role in enabling other cognitive capacities (deliberate action, self-knowledge, rational inference, unified agency) or whether it is an epiphenomenal consequence, or even idle with respect to them.
      *   **Motivation:** Metaphysical weight. Does unity *do* anything? *Sharpening:* If a split-brain patient's hemispheres can independently perform tasks requiring planning, memory access, and simple reasoning *within* their domain, does this show unity isn't necessary for those functions? If unity is idle, why care about it beyond metaphysics?
      *   **Non-Negotiable?** No. The theory *must* take a stand, but either stand is possible. *However*, concluding unity is idle *is a significant discovery*, not a violation *if argued convincingly*.
      *   **Covert Commitment?** Theories emphasizing functional roles (e.g., Global Workspace, some IIT) require an explanatory role. Primitive Relation accounts can more easily accept epiphenomenalism.

  8.  **Subpersonal Commitments & Mechanism:**
      *   **What:** Must state whether it answers at the subpersonal level (neural, information-theoretic). If so, must it commit to a *single, specific mechanism* (e.g., specific neural oscillation, global workspace ignition, Φ-maximization) underlying unity across *all* cases (normal, split, mute stream)? Or can it allow multiple realization or case-specific mechanisms?
      *   **Motivation:** Adjudication requires empirical anchors. Can the theory point to measurable things? *Sharpening:* Does the theory predict a specific neural signature that should be present in a normal subject, absent between hemispheres in a split-brain, present *within* each hemisphere in a split-brain, and potentially present in a mute stream? Or is it agnostic/pluralistic?
      *   **Non-Negotiable?** No. A purely personal-level theory is possible (though harder to adjudicate). **But:** For *your* adjudicative job, a subpersonal commitment is *highly advantageous*, if not strictly necessary.
      *   **Covert Commitment?** Strongly subpersonal theories (e.g., IIT, neurobiological GWT) require a specific mechanism. Quietist/purely metaphysical views reject subpersonal answers.

  ### The Key Tension & The Most Excluding Requirement
  *   **Joint Unsatisfiability:** The tension between **Degree Problem** (especially demanding unity admits of degrees to fit surgical data) and the **Report Bottleneck** (demanding evidence *beyond* report to adjudicate scenarios like one subject with partial disunity vs. two subjects) is severe. Theories allowing degrees struggle *even more* to provide clear adjudicative criteria for the mute stream or to distinguish one-partially-disunified-subject from two-subjects using non-report evidence. Binary theories have an easier time adjudicating *if* they can overcome the Report Bottleneck, but struggle with the intermediate data.
  *   **The Most Excluding Requirement:** **Subsumptive Mechanism (A specific, measurable subpersonal mechanism is necessary and universal).**
      *   **Why it Excludes:** It immediately rules out:
          *   **Primitive Relation Accounts:** They posit unity as fundamental, resisting reduction/mechanism.
          *   **Quietist/Dismissive Accounts:** They deny unity needs explanation or is reducible.
          *   **Strongly Pluralist Accounts:** Those allowing fundamentally different unity mechanisms in different cases (e.g., normal vs. split-brain).
          *   **Purely Functional-Access Accounts (if mechanism is required):** While neural, they often resist pinning it to *one* specific signature.
      *   **Why it's Demanding (and Contentious):** It assumes phenomenal unity has a necessary and sufficient neural/informational correlate that is identifiable and consistent, which is a major empirical bet. It risks conflating mechanism with the phenomenon.

  ### Compact Theory Scoring Table
  | Theory Family             | Ordinary Fidelity | Surgical Adequacy | Pseudo-Split Exclusion | Unity Distinction | Report Bottleneck | Degree Handling | Explanatory Role | Subpersonal Mech |
  | :------------------------ | :---------------: | :---------------: | :--------------------: | :---------------: | :---------------: | :-------------: | :--------------: | :--------------: |
  | **Subsumption** (e.g., Tye) | ✔ (Simple)        | △ (Struggles w/ partial data) | △ (Depends on criterion) | ✔ (Usually clear) | △ (Needs neural anchor) | ✘ (Binary)      | △ (Varies)       | △ (Often vague)  |
  | **Primitive Relation** (e.g., Foster) | ✔ (Direct)        | △ (Adjudicates poorly) | △ (Adjudicates poorly)   | ✔ (Clear)         | △ (Mute stream hard) | △ (Usually binary) | △/✘ (Often idle) | ✘ (Rejects)      |
  | **IIT** (e.g., Tononi)      | ✔ (Mechanistic)   | △/✘ (Can model splits as low Φ between; but high Φ within? Mute stream?) | ✘ (Overgenerates - Φ>0 everywhere?) | ✘ (Conflates phen/access?) | △ (Φ is measure, but report link?) | △ (Graded Φ)    | ✔ (Causal role)  | ✔ (Specific: Φ)  |
  | **Global Workspace (GWT)** (e.g., Baars, Dehaene) | ✔ (Functional)    | △ (Often conflates phen/access) | ✘ (Access=Unity, so fails) | ✘ (Conflates phen/access) | ✘ (Defined by access) | △ (Graded access) | ✔ (Strong role)  | △ (Specific: Ignition) |
  | **Quietist/Dismissive** (e.g., Dennett) | ✘ (Deflates)      | ✘ (Denies target phenomenon) | ✔ (Trivially)          | ? (Denies phen unity) | ✘ (Relies on report) | N/A             | ✘ (Idle/illusory)| ✘ (Rejects)      |

  **Key:** ✔ = Generally Satisfies, △ = Partially Satisfies/Depends on Version, ✘ = Generally Violates/Struggles Severely.

  **Conclusion for Your Adjudicative Goal:** The **Subsumptive Mechanism** requirement (specifying a universal, measurable neural/informational signature) is the single most excluding demand, but it's also the one most likely to yield the empirically adjudicative theory you seek. However, embracing **Degrees of Unity** is necessary to respect the surgical data, creating significant tension with the **Report Bottleneck**. Resolving *that* tension – how to empirically distinguish graded disunity within one subject from two subjects using non-report evidence – is the central challenge your chosen theory must overcome. The practical stakes ("why care?") hinge on whether unity is explanatory: if it's necessary for integrated agency, self-knowledge, or rational inference, then the number/unity of subjects has profound implications for ethics, law, and clinical practice (e.g., responsibility, consent, welfare). If it's idle, the stakes are primarily metaphysical.
