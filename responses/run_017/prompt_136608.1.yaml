    We want Group 3 to be more robust in this round? But if the phenomenology is based on Rule Set A, it might not hold for Rule Set B. But we want to illustrate multiple realizability: the same high-level pattern can be realized by different micro rules. So if the phenomenology is stated in a way that is independent of the micro rules, then Group 3 might do well.

    Example: if the phenomenology is: "The system will relax to a stable state where no cell is above the threshold. The total number of topplings is roughly proportional to the initial total sand minus the final total sand." But then for Rule Set B, the threshold is the same? We changed the rules but not the threshold? Or if we changed the threshold, then the final state has a different threshold.

    To make Group 3 robust, we should state the phenomenology in a way that doesn't depend on the micro rules. For example: "The system will relax to a stable state in which no cell exceeds the toppling threshold (which is a property of the system). The number of topplings depends on the initial configuration and the boundary conditions."

    Then for Rule Set B, the threshold is still 4? Or if we change it to 5, then the final state has cells up to 4. So the phenomenology would have to be updated.

    Alternatively, we can have the phenomenology given to Group 3 be specific to the system they observed: "In the system we observed, the threshold was 4, and the final state has cells with at most 3. The number of topplings is typically between X and Y for a grid of this size." Then they are not robust.

    We want to show that sometimes the phenomenology is robust and sometimes it is not. So in Rule Swap, if the phenomenology is tied to the threshold, then Group 3 will be wrong.

    But wait, we want to show two types of emergence. The first type (computational irreducibility) is when the micro rules are too complex to simulate, so you need the higher level. The second type (multiple realizability) is when the higher level pattern is invariant to changes in the micro rules.

    In Round 2, we want to show that the aggregate data (Group 2) is not robust to rule change, but the phenomenology (Group 3) might be if it is stated generally. But then we have to make a choice.

    Given time, we can design the phenomenology to be general enough to cover both rule sets? But then they wouldn't be able to make a precise prediction.

    Alternatively, we can accept that in Round 2, all groups might be wrong, but for different reasons, and that sets up the discussion.

  - Round 3 (Single Cell Alteration): We change one cell (say, make it never topple, or make it topple at threshold=10). Then Group 1, if they know the alteration, can account for it. But do we tell them? In the information for this round, for Group 1, we have to tell them the alteration? Otherwise, they will use the original rules and be wrong. But we want them to be humbled? So we do not tell them about the alteration. Then all groups are using their original information and will be wrong, but Group 1 might be very wrong because they rely on every cell. Group 2 and 3 might be less affected because they use aggregates.

    But we want to show that the aggregate and phenomenological levels are robust to a localized change.

    So in the information sheet for this round, we do not tell Group 1 about the alteration. They get the initial state and assume the same rules. But one cell is altered. Then their prediction will be off. Group 2 and 3, using aggregates and generalizations, might not be affected as much because one cell is a small part.

  - Round 4 (Grid Doubling): We double the grid to 20x20. We scale the initial state: if the 10x10 had a total sand of S, then the 20x20 has total sand of 4S (because area is 4 times). But the boundary is different (proportionally less boundary in a larger grid). Group 1 might try to simulate but it's 4 times as many cells and might take too long. Group 2: their data is for 10x10, so they might scale linearly? But it's not linear. Group 3: if their phenomenology is general, they might say the final total sand per cell is about the same, so total topplings should be proportional to the initial excess sand. But the initial excess sand is (initial total sand - 3*number_of_cells). For 10x10, final stable total sand is about 3*100 - boundary effect. For 20x20, boundary effect is relatively smaller, so the final total sand per cell is closer to 3. Therefore, the total topplings might be different.

    We want Group 3 to do well if their generalization captures the scaling.

  ### What will go wrong

  - Group 1 might try to simulate by hand and run out of time. -> We can tell them: "You have the rules and initial state, but you are not expected to simulate step by step. Use your understanding to predict."
  - Someone might notice the rule swap and spoil it. -> We can hope they don't, or we can run the simulation as a black box and not show the code.
  - Group 2 might overfit a small sample. -> We give them multiple runs (say 5) to mitigate.
  - A participant might say it's all about ignorance. -> That's a point for the debrief: yes, in this simulation, everything is determined by the micro-rules, but the higher levels are still necessary for prediction because of computational limitations or because of robustness.

  ### What the activity cannot deliver

  - It is not about ontological emergence or downward causation. It is about epistemic emergence: patterns that are hard to predict from the micro-rules.
  - The real historical cases involve limits (like thermodynamics from statistical mechanics) that are proven in the limit of large numbers, which we cannot do in a small simulation.

  At the end, the facilitator should say:

  "We experienced how different levels of description can be useful for prediction. Even though the micro-level is complete, it is not always the most practical or robust. We saw two ways in which higher-level descriptions are valuable: when the system is too complex to simulate (computational irreducibility) and when the higher-level pattern remains the same even if the micro rules change (multiple realizability). These are both called 'emergence', and they are not mutually exclusive. They often go together: a pattern that is computationally irreducible might also be multiply realizable. This does not mean that the higher level is independent of the micro level, but it does mean that for creatures like us, the higher level is indispensable."

  ### Materials and Preparation

  - The facilitator must prepare a simulation program (in Python with Pygame, or JavaScript, or any language that can display the grid and run quickly). We can use a simple grid and the rules defined.
  - Test the two rule sets to ensure they are similar for most initial states but diverge for one that we will use in Round 2.
  - Prepare initial states for each round.
  - Prepare information handouts for each tier.

