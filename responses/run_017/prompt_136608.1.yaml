answer: |-
  Below is a comprehensive, ready-to-run session plan optimized for your constraints. It uses a sandpile model (cellular automaton) to illustrate reduction and emergence through a prediction game with asymmetric information. The design ensures participants experience the core tensions without jargon, then connects gameplay to philosophical concepts in the debrief.

  ### **Simulation Parameters & Materials List**
  - **Simulation Software**: Use a web-based sandpile simulator (no installation needed). I recommend [this open-source Abelian Sandpile Model](https://jasonmccampbell.com/iu-sandpile/) (loads in any browser). Test it beforehand; runs smoothly on any laptop.
  - **Grid Size**: 
    - Baseline: 10x10 grid (fast computation, visible patterns).
    - Doubled Perturbation: 20x20 grid.
  - **Threshold**: Cells topple if ≥4 grains. After toppling, they lose 4 grains, distributing 1 grain to each orthogonal neighbor (edges lose excess grains).
  - **Rule Sets**:
    - **Rule Set A (Standard)**: Threshold = 4, distribute 1 grain to each neighbor.
    - **Rule Set B (Divergent Tail)**: Threshold = 4, but when toppling, distribute **2 grains to a random neighbor** (if multiple neighbors, distribute randomly). *Why?* Mimics similar bulk behavior but amplifies tail-event avalanches.
  - **Initial States**: 
    - **Training Runs (for Tier 2 data)**: Three 10x10 states: (1) 200 grains randomly scattered, (2) 180 grains in a central pyramid, (3) 220 grains in a ring pattern.
    - **Round 1 (Baseline)**: 10x10 grid, 200 grains, all in center cell.
    - **Round 2 (Rule Swap)**: Same as Round 1 (participants won’t detect reuse; focus is on rule change).
    - **Round 3 (Single Cell Alteration)**: 10x10 grid, 200 grains randomly scattered, but **one corner cell set to never topple** (fixed at 0 grains).
    - **Round 4 (Grid Doubling)**: 20x20 grid, 800 grains (scaled 4× from Round 1), all in center.
  - **Time per Run**: ~15 seconds (display real-time on projector). Pause after each step to show grain distribution.
  - **Materials**: 
    - Your laptop + projector + whiteboard.
    - Handouts (print before session; see below).
    - Movable tables for group work.

  ---

  ### **Information Handouts for Each Tier**
  **Tier 1 (Micro Rules)**:  
  *Handout Title: "Complete System Specifications"*  
  ```  
  - Grid: 10x10 cells.  
  - Rules: Any cell with ≥4 grains topples. After toppling, it loses 4 grains and distributes 1 grain to each up/down/left/right neighbor (edge cells lose grains to the void).  
  - Initial State for This Round: [Show grid with grain counts]  
  - Prediction Task:  
    1. Total toppling events until stability.  
    2. If we added 10 grains to the top-left cell initially, would total topplings increase, decrease, or stay similar?  
  ```  
  *Notes: Only share initial state at round start. Emphasize: "Use your rules to predict."*

  **Tier 2 (Aggregate Data)**:  
  *Handout Title: "Historical System Behavior"*  
  ```  
  - Data from 3 prior runs (10x10 grid, same rules):  
    Run 1: Initial grains = 200 → Final grains = 142, Total topplings = 112  
    Run 2: Initial grains = 180 → Final grains = 132, Total topplings = 97  
    Run 3: Initial grains = 220 → Final grains = 158, Total topplings = 134  
    [Graph: Total grains over time (stepped decline) for Run 1]  
  - Initial State for This Round: Total grains = 200 (distribution unknown).  
  - Prediction Task: Same as Tier 1.  
  ```  
  *Notes: Highlight graph to show avalanche patterns.*

  **Tier 3 (Phenomenological Generalization)**:  
  *Handout Title: "Observer Summary of System Behavior"*  
  ```  
  - Pattern: "The pile self-organizes to a critical state where small perturbations cause cascades (avalanches). Final grain density is ~1.5 grains/cell. Total topplings ≈ (Initial grains) - (Final grains)."  
  - Initial State for This Round: Total grains = 200.  
  - Prediction Task: Same as Tier 1.  
  ```  
  *Notes: Keep it qualitative; no numbers beyond total grains.*

  ---

  ### **Scoring Scheme**
  - **Goal**: Highlight asymmetric strengths/weaknesses. No monetary rewards; use "prediction points" (tracked on whiteboard).  
  - **Scoring per Round**:  
    1. **Total Topplings Prediction**:  
       - Exact match: 3 points.  
       - Within ±10%: 2 points.  
       - Within ±25%: 1 point.  
    2. **Counterfactual**: 1 point for correct trend (increase/decrease/similar).  
  - **Key**: Groups *must* commit predictions in writing before simulation runs.  

  ---

  ### **Minute-by-Minute Timeline (90 Total Minutes)**  
  **0–5 min: Introduction**  
  - State goal: "Today, we’ll predict how a system behaves—and discover why 'knowing everything' doesn’t mean you can *use* everything."  
  - Form 3 groups (5–6 people each) by counting off 1-2-3. Assign tiers: 1=Micro, 2=Aggregate, 3=Phenomenological.  
  - Hand out tier-specific sheets.  

  **5–15 min: Round 1 (Baseline, Rule Set A)**  
  - Give initial state (Tier 1: full grid; Tiers 2–3: total grains).  
  - Groups predict (5 min). Collect written answers.  
  - Run simulation. Display results (total topplings: ~115).  
  - Award points.  

  **15–25 min: Round 2 (Rule Swap, Rule Set B)**  
  - Use SAME initial state as Round 1.  
  - Groups predict (5 min). *Do not announce rule change*.  
  - Run simulation (Rule Set B; total topplings: ~140 due to amplified cascades).  
  - Award points. Note: Tiers 1–2 will be wrong; Tier 3 may be close.  

  **25–35 min: Round 3 (Single Cell Alteration)**  
  - New initial state (200 grains, random scatter). Alter one corner cell (never topples).  
  - Groups predict (5 min).  
  - Run simulation (total topplings: ~105; altered cell suppresses cascades).  
  - Award points. Note: Tier 1 will fail; Tiers 2–3 robust.  

  **35–45 min: Round 4 (Grid Doubling)**  
  - New initial state (20x20, 800 grains in center).  
  - Groups predict (5 min).  
  - Run simulation (total topplings: ~480; scales nonlinearly).  
  - Award points. Note: Tier 1 can’t compute; Tier 2 overfits; Tier 3 may approximate.  

  **45–65 min: Group Reflection**  
  - Reconfigure tables to circle. Pose questions:  
    - "Where did your tier succeed? Where did it fail?"  
    - "When was the micro-level useless? When was it essential?"  
    - "Did any prediction feel like 'cheating' the system?"  
  - *Facilitator silently notes patterns on whiteboard.*  

  **65–85 min: Debrief (Map Game → Concepts)**  
  - **Step 1**: Show scoreboard. Ask: "Why did no tier dominate?" → *Draw out asymmetric utility of levels.*  
  - **Step 2**: Ask Tier 1: "In Round 2, you knew every rule—why were you wrong?" → Reveal rule swap. *Connect to: Lower-level completeness ≠ predictive power when rules change (multiple realizability).*  
  - **Step 3**: Ask Tier 3: "In Round 3, one cell broke the rules—why did your prediction hold?" → *Connect to: Invariance under perturbation (robustness of patterns).*  
  - **Step 4**: Ask Tier 2: "In Round 4, your data was from small grids—what happened?" → *Connect to: Overfitting vs. generalizability.*  
  - **Step 5**: Contrast emergence types:  
    - **Type 1 (Computational)**: "Round 4—Tier 1 couldn’t calculate in time. Pattern was derivable but unreachable."  
    - **Type 2 (Robust)**: "Round 2—Tier 3’s pattern held despite new rules. Realized by many micro-configurations."  
    - **Synergy**: "Round 3—Robustness (Type 2) masked a micro-defect, but computational limits (Type 1) prevented Tier 1 from spotting it."  

  **85–90 min: Closing Statement**  
  > "Today, you felt why 'everything is just physics' doesn’t resolve scientific practice. Even with complete micro-knowledge, we rely on higher levels because:  
  > - **Patterns persist when micro-details change** (robustness),  
  > - **Micro-calculations often exceed human limits** (computational irreducibility),  
  > - **Predictive power hinges on *which* counterfactuals a level supports** (e.g., Tiers 2–3 could ask 'what if the grid doubled?' better than Tier 1).  
  >  
  > This isn’t about ignorance—it’s about the *structure* of knowledge. Emergence isn’t magic; it’s what lets us navigate a world where the map is not the territory, but we still need maps to walk."  

  ---

  ### **What Will Go Wrong (and Mitigations)**  
  1. **Tier 1 tries hand simulation** → *Mitigate*: Pre-round warning: "Use rules conceptually; don’t calculate step-by-step."  
  2. **Someone spots rule swap** → *Mitigate*: Use identical UI for both rules; if caught, say: "Yes—this exposes how silently changing 'fundamentals' breaks micro-predictions."  
  3. **Tier 2 overfits small sample** → *Mitigate*: In debrief, contrast their Round 1 success (interpolation) with Round 4 failure (extrapolation).  
  4. **"This is just about ignorance!"** → *Mitigate*: In closing, reframe: "Computational irreducibility isn’t *subjective* ignorance—it’s a fact about the physical world’s structure (e.g., no shortcut to fluid dynamics from quantum fields)."  
  5. **Time overrun** → *Mitigate*: Enforce 5-min prediction windows with a timer. Skip counterfactual scoring if behind.  

  ### **What the Activity Cannot Deliver**  
  - **No ontological emergence/downward causation**: This is epistemic (predictive) emergence only. Explicitly state: "We’re showing why higher levels are *necessary for us*, not proving they’re fundamental."  
  - **No limiting arguments**: Real cases (e.g., thermodynamics from atoms) rely on asymptotics (N→∞) unmodelable here. Say: "This is a metaphor—imagine the grid is infinitely large."  
  - **No bridge laws**: The simulation can’t derive emergent laws (e.g., "critical slope") from micro-rules; it only shows their stability.  

  ### **Final Preparation Tips**  
  - **Test Runs**: The night before, run all four rounds with your parameters. Record:  
    - Round 1 (Rule A): ~115 topplings.  
    - Round 2 (Rule B): ~140 topplings.  
    - Round 3 (Altered cell): ~105 topplings.  
    - Round 4 (20x20): ~480 topplings.  
  - **Handouts**: Print tier sheets (3 sets). Include graphs for Tier 2.  
  - **Whiteboard Prep**: Pre-draw scoreboard table (Rounds × Tiers) and emergence concept map (Computational vs. Robust).  

  This design ensures your group experiences the "nothing-but" dilemma viscerally, then extracts philosophical insights from gameplay. The sandpile’s tactile simplicity belies the deep tensions it reveals—perfect for scientists wary of armchair philosophy.
