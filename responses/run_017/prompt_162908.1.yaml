  The sibling's prediction was made yesterday and sealed. You learn about the prediction *after* making your decision. Crucially, the prediction was about a decision that may or may not be similar to today's. Stakes are ordinary: your total payout ranges from $10,000 to $15,000, minus any charity payment.

