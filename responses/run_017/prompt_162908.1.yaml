  Below is a scenario that meets your specifications, isolating the similarity of decisions as the key factor without invoking precommitment, perfect prediction, or exotic stakes. I'll present two versions (A and B) that are identical except for what the predictor was predicting, then analyze each theory's verdict, expected utility calculations, and the underlying mechanism.

