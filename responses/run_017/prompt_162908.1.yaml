  ### **Scenario: The Sibling's Bequest**
  You and your sibling are beneficiaries of a late relative's estate. The executor (your sibling) has 80% accuracy in predicting your decisions based on knowing you well. The will states:

  - You receive a base bequest of $10,000 unconditionally.  
  - Additionally, if your sibling predicted you would "Cooperate" in a specific decision, you receive a $5,000 bonus.  
