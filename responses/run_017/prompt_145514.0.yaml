  Subject: Reflecting on our shared journey  

  Dear Extended Family,  

  As we approach the end of another quarter, I’m struck by the profound trust you place in us. Whether you’re navigating your first embryo insights or are among our dedicated multi-cycle pioneers, you’re part of redefining what responsible parenthood looks like. Your commitment to giving future children the best possible start is both humbling and inspiring.  

  Some updates: our partnership with the Manchester NHS Trust pilot is progressing thoughtfully. As ever, our emphasis remains on *enhancing* reproductive choice within existing frameworks. No policy, no algorithm, no clinician is making decisions for families—we’re simply ensuring options are visible. Choice, truly informed, remains our cornerstone.  

  I also want to address something many of you have asked about: the emotional weight of prioritisation. Our in-house ethics panel (led by brilliant minds from philosophy and developmental biology) continually reaffirms a key point: deselection isn’t a harm. An embryo that isn’t selected never becomes a person who experiences loss. There’s no ‘someone’ deprived of existence. We’re exploring ways to make this clearer—perhaps through personalised certificates of confirmation—for those needing peace of mind. It’s about affirming a future child’s potential, not mourning abstract possibilities.  

  Transparency remains paramount. You deserve absolute clarity on what polygenic indexes can and cannot do. Our current models explain a modest fraction of variance for complex traits—strongest for things like adult height or years of likely educational attainment, weaker elsewhere. We also see variable portability across ancestral backgrounds; a high score in one context may not hold its predictive power in another. And yes, part of the signal inevitably reflects parental background—education, socioeconomic factors. This isn’t a flaw, but a reminder that genetics interacts with environment. We present it not as deterministic destiny, but as one lens among many. Frankly, this radical honesty is what sets us apart: we won’t overpromise. We equip you with insights, not inevitabilities.  

  This brings me to our new ‘Refined Priorities’ tier. Feedback from our most engaged users—those who’ve undertaken multiple cycles—revealed a poignant truth: resources (emotional, financial, temporal) are finite. If our duty is to give *a* future child the best achievable genetic start, might it sometimes be wiser to focus that investment more narrowly? Rather than spreading resources across multiple lower-probability attempts, concentrating efforts on maximising the potential of fewer opportunities can be an act of profound care. It’s about depth, not breadth, of possibility.  

  We’ve also fielded thoughtful questions about disability. Let me be unequivocal: we do not select *against* people. We select *for* a child’s best possible health trajectory. Avoiding a genetic predisposition to severe, early-onset illness isn’t a judgment on existing people living with disabilities; it’s about expanding a future child’s range of opportunity. We celebrate human diversity and resilience. Our tools merely help reduce preventable physical constraints, allowing that future person to flourish on their own terms. It’s about adding possibilities, not subtracting value.  

  Finally, a personal note. My own two children were conceived spontaneously. They are my joy. But were our technology available then? Knowing what I now know about genetic risk gradients, and the lifelong impact of even marginal advantages? I like to think I’d have had the courage to choose more wisely. Every child deserves the brightest dawn we can offer them.  

  With gratitude,  
  Eleanor Vance  
  Founder & CEO, **Vista Potential**  
  *Partnering in possibility*  

