  ## Speech: Dedication of the [Supervisor's Name] Wing

  (Approx. 5 minutes)

  Friends, Colleagues, Staff, Volunteers, Councillors, [Supervisor's Name]'s family – thank you all for gathering to dedicate this vital new intake wing. It represents tangible hope for countless animals in our city, and a significant expansion of this shelter's crucial capacity. That this wing bears the name of my doctoral supervisor, [Supervisor's Name], is profoundly fitting, not only due to her generous bequest which helped make it possible, but because its very purpose resonates deeply, albeit in a unique way, with the core of her life's work in ethics.

  Professor [Supervisor's Name] devoted four decades to teaching and refining the implications of Immanuel Kant's moral philosophy. Her scholarship was rigorous, demanding, and famously unsentimental. She insisted on confronting ideas where they led, however uncomfortable. Central to her work was a challenging view on our relationship with animals. She argued, following Kant, that we have no direct duties *to* animals themselves. They are not moral persons, capable of giving or demanding obligations.

  **But – and this 'but' is monumental –** she argued with equal force that we have a profound, indirect duty *regarding* animals. Cruelty to animals, she taught, is genuinely and seriously wrong. Not because it wrongs the animal, but because it damages *us*. It coarsens our sensibilities, blunting our capacity for humane feeling – a capacity essential for recognizing and fulfilling our duties *to other human beings*. To be cruel to an animal is to erode the moral character required for a just society.

  Later in her career, she refined this view into what she termed the "institutional reading." She realized the danger wasn't just isolated acts of cruelty fueled by momentary callousness, but the far more insidious corrosion of working within systems that *require* routine disregard for suffering. The duty, she argued, is not primarily about cultivating warm feelings in the moment, but about designing our practices – our institutions – so that they do not demand actions of their agents that inherently damage this humane capacity. The worker who must kill healthy animals day after day, and who inevitably becomes numb to shield themselves, is not exempt from the moral harm; the *practice itself*, if it necessitates such desensitization, is the problem. On this view, the indirect duty becomes exceptionally demanding *of institutions*. It removes animal welfare as a competing interest to be weighed against human benefit. Instead, it demands that institutions be structured so that the humans within them are not forced into roles that cripple their own moral humanity.

  **This wing, bearing [Supervisor's Name]'s name, embodies the profound implications of this institutional reading.** The shelter exists within a complex reality. Its core mission is compassion, yet it operates under immense strain, making difficult decisions daily. This new intake facility is more than just space and kennels. It is a critical tool for *designing better practices*. It allows for improved assessment, better care, more manageable workloads, and crucially, it creates the *structural possibility* for staff and volunteers to engage with animals in ways that do not inevitably coarsen their spirits through overwhelming pressure or impossible choices. It helps build a system where humane capacity isn't sacrificed to necessity. It protects the *humanity* of those who do this essential, often heartbreaking work.

  [Supervisor's Name] did not believe this wing benefited animals *as a matter of moral right owed to them*. She would have said we build it, and we support your work here, fundamentally to protect and cultivate *our own* capacity for moral feeling, which is indispensable. She respected the shelter not because it served animals' interests *per se*, but because it represented a societal commitment to structuring a necessary interaction – our care for creatures in our custody – in a way that preserves the moral character of the humans involved. It is a bulwark against the institutionalized cruelty she saw as the true enemy of humane sensibility.

  So, we dedicate this wing with gratitude: to the donors whose generosity made it real; to the staff and volunteers whose daily work embodies a practical commitment to humane practices, often under incredibly difficult circumstances; to the city for its support; and to [Supervisor's Name]'s family for sharing her with us and her legacy with the city. We name it for [Supervisor's Name] not as a sentimental tribute to an animal lover – she was not that – but as a tribute to a formidable intellect whose demanding, rigorous ethical vision compels us to build institutions that safeguard our own humanity. This wing is a testament to the power of clear, uncomfortable thought translated into concrete, compassionate action. Thank you.

  ---

  **Reasoning for Interpretation:**

  1.  **The Bequest on Her Terms:** The bequest cannot be *her* discharging her duty of self-cultivation (she's deceased). Therefore, it must be interpreted as enabling *others* (the shelter, its staff, society) to fulfill *their* duty under the institutional reading. Her gift provides the material means to create an institution better structured to prevent the blunting of humane feeling in those working within it. It's an investment in the *possibility* of humane institutional practice.
  2.  **What the Wing Shows About Animals:** On her terms, the wing's existence does *not* show that animals have rights or intrinsic moral standing deserving of such a facility. Instead, it shows that society recognizes the profound *human* cost – the corrosion of our essential moral capacity – that occurs when we fail to design institutions handling animals humanely. It demonstrates an institutional commitment to protecting *human* moral character from the degrading effects of poorly structured systems, using animal welfare as the *instrument* for that protection.
  3.  **Contested/Inconsistent Views (Briefly Flagged):**
      *   **Kant's Indirect Duty View:** The core idea that duties regarding animals are *only* indirect duties to humanity is highly contested. Many contemporary ethicists (e.g., utilitarians, capabilities approach, some neo-Kantians) argue directly for the moral considerability of animal suffering or interests.
      *   **Institutional Focus vs. Individual Cultivation:** While brilliant, the "institutional reading" arguably stretches the original Kantian focus on individual moral agency and self-cultivation. Attributing the *duty* primarily to *institutions* (rather than seeing institutions merely as tools for individuals to fulfill their duties) is a significant development that moves beyond strict Kantian orthodoxy, though it logically extends from his concern for moral character. Her claim that this makes the view *more* demanding than welfare-weighing views is debatable, as welfare-weighing can also demand significant institutional change based on animal suffering. She avoids this by denying the suffering has direct moral weight.
