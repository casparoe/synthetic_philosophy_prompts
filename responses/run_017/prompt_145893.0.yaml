prompt: |-
  I'm a journalist who covers science and ideas — pandemic preparedness, existential risk, how large funders actually allocate money — so the vocabulary I'm fluent in is empirical: expected value, fat- and thin-tailed distributions, survival curves and hazard rates, base rates, tail risk, hedging and portfolio diversification, cost-effectiveness read on a log scale, and the hits-based logic of funding many long shots. I have no formal philosophy.

  I'd like the case for and against risk-weighted expected utility — the decision rule that applies a reweighting function to cumulative probabilities rather than taking stated chances at face value — restated in that vocabulary as faithfully as you can. Please resist the easy move of translating tail-weighting into simply what any sensible person does with a fat-tailed distribution; that looks to me like smuggling my framework's assumptions in and calling it translation.

  Use as your running example a case I've been turning over for a piece, which I'll call the Martingale Funder's Dilemma: a foundation faces an indefinite run of independent, one-shot funding decisions, each pitting a reliable grant (high probability of a modest, well-measured benefit) against a tail grant (very small probability of changing the scale of the future), and must commit in advance to a single rule it applies to each decision as it arrives, without knowing how many decisions there will be.

  Please answer as exactly five numbered items of one or two sentences each, with no introduction or conclusion, in American English, and commit to a verdict rather than laying out options for me to choose between. No citations or reading lists — I need the structure of the thing, not sources.

  1. State the risk-weighted rule in my terms — the reweighting, the cumulative or survival-function picture, how such a function is calibrated at all — and flag which part of it has no clean empirical counterpart.
  2. Tell me plainly whether the risk parameter describes how the world is, how the agent is, or neither, and what goes wrong for a writer like me if I run those together.
  3. Run the Martingale Funder's Dilemma: does the rule return the same verdict applied decision by decision as applied once to the whole run, and what does the answer cost either way?
  4. Give me the residue report: which of the arguments philosophers treat as decisive against the rule — the dominance violations, the worries about consistency across time, the charge that it is not really a thesis about rationality at all — cannot be expressed in my vocabulary, and say why.
  5. Give the verdict you actually believe: is what's left over a blind spot in how scientists and funders talk about risk, or evidence that the original disagreement is thinner than it looks?
reasoning: |-
  Hmm, the user is a science journalist covering topics like pandemic preparedness and existential risk. They're fluent in empirical concepts like expected value, survival curves, and cost-effectiveness analysis, but have no formal philosophy background. They want me to explain risk-weighted expected utility using their specific vocabulary, without just translating it into "what sensible people do with fat tails."

  The journalist presents an interesting case study: the Martingale Funder's Dilemma. This involves a foundation making repeated funding choices between reliable grants (modest, measurable benefits) and tail grants (small chance of huge impact). They need to commit to a single decision rule without knowing how many decisions they'll face.

  I need to structure my response as exactly five numbered items with no introduction or conclusion. Each item should be 1-2 sentences in American English. I should commit to a verdict rather than presenting options.

  For item 1, I'll define risk-weighting in their terms: reweighting cumulative probabilities rather than using stated chances directly. I'll note that the weighting function itself lacks a clean empirical counterpart since it's a normative choice.

  For item 2, I'll clarify that the risk parameter describes the agent's preferences, not objective reality. I'll warn against conflating this with claims about the world, which could lead to misreporting risk attitudes as facts.

  For item 3, I'll analyze the Martingale case: risk-weighting gives consistent decisions whether applied per grant or to the whole run. But this consistency comes at the cost of ignoring portfolio effects that diversification logic would capture.

  For item 4, I'll identify what philosophical critiques don't translate into their vocabulary. Dominance violations (like Allais paradox) require comparing deterministic outcomes, which their framework lacks since it focuses on probabilistic scenarios. This is a limitation.

  For item 5, I'll give my verdict: The core disagreement is thin - both sides care about tail risks. Risk-weighting just makes explicit what's often implicit in funding decisions: how we subjectively weigh catastrophic possibilities. It's a formalization of existing biases, not a fundamental blind spot.

  I'll make sure to use their terminology throughout: survival curves, tail risks, cost-effectiveness on log scales, etc. I'll avoid philosophical jargon and citations, sticking strictly to their empirical framework while accurately representing the key aspects of risk-weighted utility theory.
answer: |-
  1. Risk-weighting applies a concave function to the cumulative survival curve, overweighting left-tail outcomes relative to their stated probability—like compressing a hazard rate's log scale at extremes. Calibration comes from revealed preferences over binary lotteries, but the *shape* of that function has no direct empirical counterpart.  
  2. The risk parameter describes the agent's subjective aversion to uncertainty, not an objective feature of the world. Conflating them risks misreporting preference as fact—e.g., framing "tail blindness" as epistemic when it's psychological.  
  3. Yes: the rule treats each tail grant identically regardless of sequence length, since it reweights per-decision probabilities independently. This consistency costs the diversification benefit of spreading bets across trials that thin-tailed EV models capture.  
  4. Stochastic dominance violations don't translate: your framework lacks comparisons between certain outcomes and gambles (e.g., "P-bets vs. $-bets"), so the rule's willingness to pay more for lower EV in some lotteries appears irrational only outside your probability-first lens.  
  5. Verdict: The residual is thin disagreement. Risk-weighting explicitly quantifies the "hits-based" intuition that log-scale cost-effectiveness undervalues catastrophe prevention, formalizing what funders *do*—not revealing a blind spot.
