prompt: |-
  I write about evolutionary biology for a national newspaper, and in six weeks I am giving the annual Science in Public lecture in a university's ecology and evolutionary biology building. The room will be about sixty people: mostly working evolutionary biologists from that department, a dozen or so graduate students, two or three people from the university's science-communication master's programme, and a visiting historian of science who works on the adaptationism disputes of the 1970s and 80s. The departmental split matters: a large group of field and organismal biologists who do reciprocal transplants and local-adaptation work and regard selection as something you measure rather than something you debate; a smaller group of quantitative/theory people who care about whether an hypothesis is identifiable from the data at all; two developmental-evolution people who think the structuralist critique was directionally right but under-specified and who bristle at the word constraint; and a handful of sceptics who think this whole fight was settled decades ago and wonder why a journalist is reopening it. The historian cares whether I am describing the 1979 spandrels paper or describing its reputation. The science-communication people care whether any of this survives contact with an eight-hundred-word news story and an editor on deadline.

  My thesis has two halves. The descriptive half is that popular science writing still runs on what I have started calling narrative adaptationism: the default template in which a trait appears in a story only once someone has found the problem it solves, so that the explanation is always of the form trait X exists because it did Y for an ancestor, and the alternative hypotheses are mentioned, if at all, in a final paragraph that readers and headline writers discard. The prescriptive half is the thing I actually want to defend, and it is a style rule rather than a theory: call it the alternatives line. No paragraph may attribute a trait to selection without one adjacent sentence naming the strongest non-adaptive explanation for that same trait, chosen from a fixed menu I have drafted — developmental bias or constraint, phylogenetic inertia, pleiotropic byproduct of something else that was selected, demographic contingency in the loose sense people call drift, exaptive co-option of a structure built for another job, geometric or physical necessity, and ecological time-lag, where the trait is useful now but did not arise for its current use. Two wrinkles I have built in deliberately, and expect to be attacked for: the sentence does not have to endorse the alternative, only name it; and the rule applies even to studies that tested a selection hypothesis rigorously, because in my experience the tested component is smaller than the story implies.

  The argument I will give runs in three steps: that adaptive stories are cheap to generate and expensive to kill, since a plausible function can be invented for almost anything and the correction never runs; that this asymmetry is invisible to readers precisely because the hedges are stylistically optional; and that a mandatory naming sentence is a low-cost intervention which restores the asymmetry to view without asking reporters to adjudicate evolutionary biology. I plan to concede in the first two minutes that I have no systematic content analysis behind the descriptive claim, only a decade of reading both the journals and the clips, and that the menu is my construction and not something Gould and Lewontin handed down.

  What I need from you is a Q&A prep sheet, not a defence. Give me the eight or so objections I will actually get from this room, ordered by how much damage they would do if I handled them badly, with likelihood noted separately from severity, each attributed to the kind of person who will raise it and phrased the way that person would phrase it — the field biologist's version should sound like a field biologist, the historian's like a historian, the editor's like an editor. For each: what I should say in about two minutes, what I should concede rather than fight, and where my reply is soft. Tell me which single reply has to land for the proposal to survive the room, and tell me which objection I should volunteer before anyone raises it, because pre-empting it costs me less than answering it. Finally, give me the question I am hoping nobody asks; for what it is worth, mine is that one of the clips I intend to project as evidence of the problem is a feature I wrote myself, and that someone in the third row will notice before I get to it.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They're an evolutionary biology journalist preparing for a lecture with a very specific audience mix. Their thesis has two parts: descriptive (narrative adaptationism in popular science) and prescriptive (the "alternatives line" rule). They need Q&A prep focused on potential objections, categorized by audience type, with strategies for handling each.

  First, I need to map out the audience segments since their objections will vary so much. The field biologists care about practical measurement, the theoreticians about methodology, the devo-evo folks about structuralist concepts, the skeptics about relevance, the historian about accuracy, and the science comms people about practicality. Each will attack different aspects of the proposal.

  For the most damaging objections, I'm thinking the field biologist's "waste of time" critique ranks highest - if they think this undermines rigorous science, the whole room could turn. The historian's "strawman" concern about misrepresenting the spandrels debate is also high-stakes for credibility. The theoretician's "false equivalence" worry could sink the proposal if not handled well. 

  The science comms people's "deadline realism" objection needs a concrete solution they'll buy into, like the menu as a practical tool. For the devo-evo folks, I should acknowledge their "constraint" terminology pain point upfront since it's easily conceded. The skeptic's "settled debate" complaint can be neutralized by framing this as a journalistic issue, not scientific.

  I should note the unspoken worry about their own published example - better to address that proactively with self-deprecation. The nightmare question would be someone spotting their hypocrisy mid-lecture, so I'll suggest confessing early.

  The key reply that must land is that this rule doesn't judge the science but reveals the journalistic framing. If they lose that point, the proposal collapses. Also important: conceding the menu is imperfect but better than the status quo.

  Hmm, the user's hidden vulnerability is their lack of systematic data. I'll advise them to admit this freely while standing by their observed pattern. Their strength is being an insider who knows both labs and newsrooms - they should leverage that dual perspective hard.
answer: |-
  Here’s a Q&A prep sheet tailored to your audience and thesis, prioritizing objections by **damage potential** (combining likelihood and severity), with attribution, phrasing, and response strategies. Likelihood (L) and Severity (S) are rated 1-5 (5=highest).  

  ---

  ### **Top 8 Objections**  
  1. **"This wastes time on dead alternatives when rigorous studies *already* ruled them out."**  
     - **Who:** Field biologist (L5/S5)  
     - **Phrasing:** *"We sweat over transplant experiments for years to isolate selection. Your rule forces us to dredge up drift/constraint hypotheses we falsified in the intro. It’s noise."*  
     - **Response:**  
       - *Concede:* Not all studies skip alternatives; celebrate those that test them.  
       - *Fight:* The rule targets *journalism*, not the science. Your methods section may address drift, but the news story won’t. The sentence forces the *narrative* to acknowledge uncertainty.  
       - **Soft spot:** If the study explicitly tested alternatives, your rule still applies. Defend: News stories omit methods; readers see certainty where scientists see caveats.  

  2. **"You’re misrepresenting the adaptationism debate as unresolved. We moved on."**  
     - **Who:** Skeptic (L4/S5)  
     - **Phrasing:** *"Gould and Lewontin lost. We test selection *and* constraint now. Why refight 1979?"*  
     - **Response:**  
       - *Concede:* Methods improved, and good science *does* integrate alternatives.  
       - *Fight:* Your critique targets *popular writing*, not modern biology. Narrative adaptationism fossilizes a 1980s pop-sci trope. Show your clips as evidence.  
       - **Key reply:** "This isn’t about how *you* work. It’s about how your work is *sold* to the public."  

  3. **"This creates false equivalence. Selection *is* the default; alternatives are niche."**  
     - **Who:** Quantitative theorist (L4/S4)  
     - **Phrasing:** *"If selection explains 90% of traits, why mandate equal airtime for noise? You’ll mislead readers into thinking fringe hypotheses are equally plausible."*  
     - **Response:**  
       - *Concede:* Alternatives vary in plausibility; the rule doesn’t elevate weak ones.  
       - *Fight:* The asymmetry *is* the problem. If selection is 90% likely, mentioning alternatives 0% of the time (in news) distorts reality. The sentence restores epistemic humility.  
       - **Soft spot:** Your fixed menu lumps rare/strong alternatives. Stress: The sentence doesn’t endorse; it *signposts*.  

  4. **"Your 'menu' of alternatives is arbitrary. Why include 'ecological time-lag' but not epigenetics?"**  
     - **Who:** Devo-evo researcher (L3/S4)  
     - **Phrasing:** *"You’re policing language while ignoring modern structuralism. 'Constraint' isn’t dirty—it’s dynamism!"*  
     - **Response:**  
       - *Concede:* The menu is subjective and incomplete.  
       - *Fight:* This is a *practical tool for writers*, not a theory. The goal is breaking the "because selection" reflex. Volunteers to refine the menu?  
       - **Preempt this!** Address it early: "My menu is a draft. Tear it apart—but the *principle* stands."  

  5. **"This is unworkable under deadline. You can’t expect reporters to ID 'strongest alternatives' on complex papers."**  
     - **Who:** Science comms student (L5/S3)  
     - **Phrasing:** *"I have 2 hours to file 800 words. How do I find the 'strongest non-adaptive explanation' without a PhD?"*  
     - **Response:**  
       - *Concede:* Reporters aren’t evolutionary biologists.  
       - *Fight:* The *menu* solves this. It’s a cheat sheet: pick one relevant option (e.g., "or a byproduct of selection for another trait"). Takes 10 seconds.  
       - **Soft spot:** What if the paper doesn’t mention alternatives? Reply: Then the sentence can say "untested alternatives include X."  

  6. **"You’re attacking a strawman. No journalist serious about evolution does this anymore."**  
     - **Who:** Historian (L3/S4)  
     - **Phrasing:** *"The 'spandrels' critique *changed* practice. Your 'narrative adaptationism' is a caricature of bad 90s writing. Show me *current* examples."*  
     - **Response:**  
       - *Concede:* Some outlets improved (cite Ed Yong, Elizabeth Pennisi).  
       - *Fight:* Project your clips. Stress: Headlines and ledes still overwhelmingly default to "why X evolved" framing. The final-paragraph hedge *is* the problem.  
       - **Key evidence:** Show a 2023 headline: "Tiny lizard wings evolved to evade predators" vs. the paper’s cautious title.  

  7. **"This won’t fix anything. Editors will cut the alternatives sentence for space."**  
     - **Who:** Science comms professional (L4/S3)  
     - **Phrasing:** *"You think an editor won’t axe that sentence? If it’s skippable, it *will* be skipped. Your rule is naively absolutist."*  
     - **Response:**  
       - *Concede:* Editors cut ruthlessly.  
       - *Fight:* Make the sentence *structural*. If it’s embedded in the selection claim ("X evolved for Y, though it could be a byproduct of Z"), it’s harder to cut than a standalone caveat.  
       - **Soft spot:** If cut, the piece violates your rule. Argue: Aim for cultural change, not perfection.  

  8. **"Why police science writing? Let readers enjoy the story."**  
     - **Who:** Grad student / "Settled debate" skeptic (L2/S2)  
     - **Phrasing:** *"If people grasp selection, isn’t that a win? Not every article needs a philosophy seminar."*  
     - **Response:**  
       - *Concede:* Storytelling matters.  
       - *Fight:* Uncritical storytelling fuels misconception (e.g., "everything is an adaptation"). The cost? Public distrust when "just-so stories" get debunked.  

  ---

  ### **Critical Strategy**  
  - **The reply that MUST land:** When challenged on relevance, hammer: **"This isn’t about the science—it’s about the *storytelling*."** If they see this as an attack on their work, you lose.  
  - **Preempt:** **Objection #4 (Menu arbitrariness)**. Address it early: "My menu is flawed—help me fix it. But the core idea—that narratives *must* name alternatives—is non-negotiable."  
  - **Volunteer:** **Your own clip as evidence.** Say: "I’ve sinned too. Here’s my piece with a headline claiming ‘evolved for X.’ I didn’t mention pleiotropy until paragraph 8—and 70% of readers never got there."  
  - **Nightmare Question:** **"Isn’t your 'alternatives menu' just a new kind of storytelling crutch?"**  
    - *Why it hurts:* It implies your solution repeats the problem.  
    - *Response:* "Possibly. But it’s a *better* crutch—one that forces engagement with pluralism. If we must simplify, let’s simplify *responsibly*."  

  ### **Tactical Concessions**  
  - Admit your lack of systematic data upfront.  
  - Agree that the menu is imperfect.  
  - Acknowledge that many in the room *do* test alternatives rigorously.  

  ### **Delivery Tip**  
  Frame this as a *collaboration*: "You do the science; I translate it. Help me translate it better." The moment you sound like you’re lecturing scientists on evolution, you lose the room.  

  Good luck—this is a sharp crowd, but you’ve got the goods.
