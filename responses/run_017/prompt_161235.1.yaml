     - Simulations discard candidates *because* they are evaluated as suboptimal.  
     *Motivation:* Distinguishes "serious" simulation (e.g., rat's maze) from superficial sequence generation (e.g., LLM token sampling). Case 3 (rat) motivates this: sniffing simulates evaluative outcomes (food/no food) in a world model. Case 8 (chess engine) fits: it simulates moves against a win/loss evaluable game world.

  2. **Gregorian Principle:**  
     A creature is Gregorian iff its **cognitive architecture has undergone enduring metamorphosis** via absorption of informational tools (e.g., words, symbols), where:  
     - Tools are acquired, not self-built.  
     - Metamorphosis enables *new cognitive operations* (e.g., abstract reasoning, self-reflection) that persist without the tool.  
