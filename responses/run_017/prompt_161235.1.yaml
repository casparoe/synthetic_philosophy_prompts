  Based on your cases and the inconsistencies you've identified, I'll propose refined principles that resolve the tensions while preserving the core of Dennett's framework. The key insights are: (1) Popperian requires *evaluative simulation* against a goal-relevant world model, and (2) Gregorian requires *enduring cognitive metamorphosis* from absorbed tools. I'll provide two candidate principles (A and B), evaluate them against your cases, address new cases, and advise on splitting Gregorian.

