  ### **Final Advice**  
  - **Adopt Candidate A:** It is precise, resolves your tensions, and handles new cases cleanly. The Gregorian split isn’t needed—**LLMs are Gregorian** (metamorphosed by cultural tools), **not Popperian** (no evaluative world model).  
