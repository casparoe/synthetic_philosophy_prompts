  Below is a decision tree designed to map positions on personal identity—especially regarding the Buddhist *anatta* (no-self) doctrine—by analyzing responses to concrete cases. It distinguishes views based on answers about synchronic unity (is there a single subject of experience *at a time*?), diachronic unity (does the subject *persist* over time?), and other key factors. The tree uses your specified cases (fission, neuron replacement, amnesia, consciousness gaps, and psychology-change) to force distinctions, avoids asking "Do you believe in a self?", and flags ambiguities. 

  The tree has **10 questions** and **11 terminal leaves** (named positions), plus notes on empty/ambiguous boxes. Logical space is covered first, then named views are mapped. Scoring key at the end shows which answer patterns lead to which leaf.

