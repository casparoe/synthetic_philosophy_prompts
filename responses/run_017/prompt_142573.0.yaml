  ### **Decision Tree: What Is a Person?**
  *Instructions:* Answer each question based on concrete cases, not abstract labels. Use "yes" or "no" unless options are given.  
  *Glosses:*  
  - **Subject of experience**: The "I" having an experience (e.g., "I see red").  
  - **Mental stream**: A causally connected flow of conscious moments.  
  - **Psychological features**: Memories, personality traits, intentions, etc.  

  1. **Synchronic Unity (at a time)**:  
     When you see red, hear a sound, and feel warmth *simultaneously*, is there a **single subject** having all these experiences?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q7.  

  2. **Diachronic Unity (over time)**:  
     Is the subject who woke up today **the same as** the one who fell asleep last night?  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q6.  

  3. **Unity as Degree (all-or-nothing vs. gradation)**:  
     In the **fission case** (your brain is split and transplanted into two bodies, each with your memories and personality), is the original person’s persistence:  
     - **All-or-nothing** (e.g., "The original is dead, or one survivor") → Go to Q4.  
     - **A matter of degree** (e.g., "Both are partly the original") → Go to Q5.  

  4. **Amnesia Case**:  
     After **total amnesia** (you forget all past events, but your personality, habits, and goals remain intact), are you still the same person?  
     - **Yes** → Go to Q4a.  
     - **No** → Leaf: **Lockean Memory View**.  
       *Position:* You persist only if psychological connections (especially memory) exist.  
       *Karmic intelligible?* No.  

  5. **Fission Survival**:  
     In the **fission case**, does what matters for survival (e.g., prudential concern, karma) apply to both resulting people?  
     - **Yes** → Leaf: **Parfitian Reductionism**.  
       *Position:* No self; persons are psychologically connected events. Identity isn't what matters.  
       *Karmic intelligible?* Only via psychological continuity.  
     - **No** → Leaf: **Branching Identity View**.  
       *Position:* Identity splits in fission; both are "you" but violate uniqueness. Rare view.  

  6. **Momentary Subjects**:  
     If the subject doesn’t persist (from Q2), is **each moment of experience** owned by a new, distinct subject?  
     - **Yes** → Leaf: **Momentary Subjects View**.  
       *Position:* Subjects exist for instants but don't endure.  
       *Empty box?* Untried and unstable—hard to justify karma.  
     - **No** → Leaf: **Illusionism**.  
       *Position:* No subjects at all; synchronic unity is illusory.  

  7. **Bundle or Fragmentation?**:  
     If no single subject at a time (from Q1), are experiences:  
     - **Unified at a time** (e.g., a "bundle" without a self) → Go to Q8.  
     - **Fragmented** (e.g., no unity, experiences are isolated) → Leaf: **Radical Fragmentation**.  
       *Position:* No unity ever. *Empty box?* Incoherent—ignores causal links.  

  8. **Diachronic Unity for Bundles**:  
     Does the **bundle** (or stream) persist over time?  
     - **Yes** → Go to Q9.  
     - **No** → Go to Q10.  

  9. **Psychology vs. Causal Stream**:  
     In a case where the **mental stream continues uninterrupted**, but **all psychological features change** (memories, traits, values), does the person persist?  
     - **Yes** (causal continuity suffices) → Leaf: **Buddhist Conventionalism**.  
       *Position:* No self; persons are causal/karmic streams. Conventional identity via causal roles.  
     - **No** (psychological features required) → Leaf: **Psychological Bundle View**.  
       *Position:* Persons are psychological bundles. Identity breaks if psychology changes.  

  10. **Gap in Consciousness**:  
      After **dreamless sleep or anesthesia** (no mental activity), is the person who wakes the same?  
      - **Yes** → Leaf: **Causal Continuity View**.  
        *Position:* Identity via causal links (e.g., brain states), not consciousness.  
      - **No** → Leaf: **Continuous Consciousness View**.  
        *Position:* Identity requires unbroken awareness. Gaps break persistence.  

