chological continuity, and one on whether a view has to make prudential self-concern (or anything like karmic consequence) intelligible to count as adequate. No question may just ask "do you believe in a self?" — sort people by what they say about the cases, not by which label they like. Build the tree from the logical space: give me the questions, say which answer-combinations they permit, then place the actual named views in that space and mark the empty combinations with a clause on why nobody lives there. Flag any pair of leaves your tree can't really separate instead of pretending it can — I suspect the reductionist view and the Buddhist conventionalist one may collapse into each other, and I want to know if that's your fault or theirs. Finish with a short scoring key: which answer patterns land on which leaf, plus which patterns are ambiguous and what that ambiguity tells us. Don't bother with sutta references or a bibiography — half the group won't look them up and I can't check them anyway.
