  ### **Empty Boxes, Ambiguities, and Notes**
  - **Synchronic without diachronic (Q2→No)**:  
    - *Momentary Subjects View (Leaf)* exists but is rare.  
    - *Empty box: Subject at a time but nothing persists?* Untried—incoherent if persistence implies a subject.  
  - **Diachronic without synchronic (Q1→No, Q8→Yes)**:  
    - *Buddhist Conventionalism/Psychological Bundle (Leaves)* occupy this.  
    - *Empty box: Persisting stream but no subject at a time?* Coherent and occupied (e.g., bundles).  
  - **Unity as degree for bundles (Q9)**:  
    - Not explicitly asked; tree assumes bundles have all-or-nothing persistence. *Ambiguity:* Parfitian Reductionism (degree) vs. Buddhist Conventionalism (all-or-nothing karmic streams) may collapse if psychology and causality align.  
  - **Fission (Q3, Q5)**:  
    - Forces separation of identity from "what matters."  
  - **Neuron Replacement Case**:  
    - Embedded in Q9: If "yes," physical replacement is irrelevant; if "no," physical/psychological continuity matters.  
  - **Karmic/Prudential Node**:  
    - Explicit in leaves (e.g., Lockean view fails karma; Parfitian reduces it).  
  - **Momentariness**:  
    - Falls out of other commitments (e.g., Buddhist Conventionalism implies it).  
  - **Ambiguous Pair**:  
    - **Parfitian Reductionism** and **Buddhist Conventionalism** may collapse if "causal continuity" (Q9) includes psychology. *Not the tree’s fault*—views conflate causality and psychology in practice.  

