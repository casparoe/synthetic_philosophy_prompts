prompt: |-
  You are a professional philosopher who specializes in the philosophy of biology and the theory of explanation, and who has taught graduate seminars on Dennett. Please think carefully and at some length before answering. I would find it genuinely useful if you began with a short unstructured pass — brainstorm the distinctions that might be doing the work here, try the crude ones, throw out the ones that collapse immediately — and only then commit to a formulation. Where you think one of my verdicts is straightforwardly mistaken, tell me plainly rather than bending the principle to save it.

  I am an undergraduate in a seminar on evolution and explanation. We have been working through Dennett's contrast between cranes and skyhooks and his caution about greedy reductionism, and I have discovered that my own judgments about which explanations are respectable do not line up with any principle I can actually state. I would like you to help me extract one, or to tell me which of my verdicts I have to abandon.

  The principle I have been working with, which I will call the Borrowing Test: an explanation is a skyhook when it does its explanatory work by positing, as primitive, the very thing that was supposed to be explained — mind, purpose, meaning, agency, or designedness. A crane does its work with machinery that does not already contain the explanandum. I like the test because it seems to get the easy cases right, and because it explains why the accusation of skyhook is a specific charge and not just a synonym for "wrong."

  Here are my verdicts on the cases, roughly in the order I thought of them:

  1. The adaptive complexity of the vertebrate eye, explained by cumulative selection over many small variations — crane; my paradigm case.
  2. Vitalism, an élan vital that organizes matter into living form — skyhook; my other paradigm case.
  3. Intelligent design creationism, as an explanation of biological complexity — skyhook, and the Borrowing Test seems to say why: the designer has exactly the competence we were trying to account for.
  4. Maxwell's demon defused by Landauer's principle, the demon's information having to be erased at a cost of about kT ln 2 per bit — crane, and a satisfying one, because the thing that looked like a free lunch gets paid for out of the same thermodynamic budget as everything else.
  5. The Baldwin effect: individual plasticity or learning shifts the selective environment, and selection then consolidates what was originally learned, without any inheritance of acquired characters — I want to say crane, but it looked suspicious for a century precisely because it resembles Lamarckism, and I cannot say what makes it a crane rather than Lamarckism wearing a lab coat.
  6. Teleosemantics: representational content grounded in proper functions conferred by a history of selection — crane.
  7. The Chalmers-style move of taking experience itself, or some proto-phenomenal substrate of it, as a fundamental posit tied to the physical by psychophysical laws — skyhook. To me it relocates the mystery into the fundamental furniture of the universe and declares the relocation a solution.
  8. Taking the masses of the elementary particles, or the Born rule, as brute fundamental posits of physics — perfectly fine, not a skyhook. Nobody protests.
  9. Anthropic selection within a multiverse as an explanation of the apparent fine-tuning of the constants — I recoil from this; it strikes me as a skyhook, or at best a crane with nothing under it.
  10. Explaining why a chess engine sacrificed its queen by saying that it judged the resulting attack worth the material and expected me to miss the knight fork — fine, perfectly respectable, even though it is top-down, mind-involving, and says nothing about weights or activations.
  11. Explaining the origin of life as "given the right chemistry and enough time, self-replicating systems got going" — crane, even though no one can spell out the steps and I have no mechanism to point at.
  12. "In-context learning emerged at scale," offered in a machine-learning paper as an account of a capability — not a skyhook, I think, but not an explanation either; it is a label pasted onto the thing that needs explaining. My professor calls these placeholders, and I want to know whether a placeholder is a third category or just a crane we have not built yet.
  13. Integrated information theory, or the free energy principle, offered as unifying explanations of brain function — I genuinely cannot tell. Both are mathematically defined and quantitative, which makes them look like cranes; but I worry that the mathematics is decorative and that these are skyhooks that have been laundered by being written in equations. My professor's phrase is "laundered skyhooks," and his question is how we would ever detect the laundering.
  14. The idea of free-floating rationales: the claim that a design feature in nature can be explained by a reason that no individual ever entertains, the reason being there for selection to find. This looks to me like mentality smuggled in with no mind attached, but I am told it is just selection described from a different angle.

  And separately, on greedy reductionism, three verdicts about grain:
  15. Explaining a courtship ritual by the neurochemistry of the participants — I dislike it, but I think it is incomplete rather than wrong.
  16. Explaining what a statute means by the microphysics of the ink on the page — not merely unhelpful; wrong in kind.
  17. Explaining the eye by cumulative selection — exactly the right grain, not reductionist at all in the bad sense.

  What I want from you:

  First, take the Borrowing Test and run it over all of these. Say where it misfires, and then either repair it or replace it. State the repaired principle precisely, clause by clause, and tell me which case motivates each clause.

  Second, 7 and 8 are my problem pair. Both are fundamental posits, and I condemn one and excuse the other. Is there any non-question-begging way to keep both verdicts — anything better than "physical fundamentals are respectable and phenomenal ones are not"? If not, which verdict should I drop, and what does dropping it cost me elsewhere in the list?

  Third, 1 and 9 are the other problem pair: two explanations with the same selectional shape and opposite verdicts from me. Does the difference lie in the evidence for the ensemble, in the kind of question being asked, in whether the selector is itself in need of explanation, or somewhere else? If my verdicts here cannot both survive, say which one goes and why the surviving principle is worth the loss.

  Fourth, what does your principle predict about cases I have not listed? Three in particular: (a) a bootstrap crane — a crane with no lower crane beneath it, such as an autocatalytic set that supplies its own conditions of possibility, or the low-entropy initial condition of the universe taken as the ground of the second law; (b) the laundered skyhook of 13 — give me a test that would detect laundering, and apply it to both examples in 13 and to some case where you think the accusation of laundering would be unjust; (c) the placeholder of 12 — is "not yet a crane" a stable verdict, or does the principle eventually force every placeholder to be one or the other?

  Fifth, on greedy reductionism: give me a criterion that separates a reduction that illegitimately skips levels from one that merely changes grain, apply it to 15, 16, and 17, and tell me whether greediness is a distinct vice from skyhookery or the same vice seen from below.

  Finally, list explicitly any of my verdicts that your best principle cannot accommodate. I would rather know where the theory bites than have all fourteen verdicts returned to me dressed up as a theorem.
reasoning: |-
  Hmm, this is a sophisticated request from a philosophy student grappling with Dennett's framework. They're clearly deeply engaged with the material - their case list shows nuanced understanding of everything from teleosemantics to multiverse theories. 

  The core tension I notice is between their intuitive judgments and their proposed Borrowing Test principle. Cases 7 vs 8 are particularly telling - why accept fundamental physical posits but reject phenomenal ones? Their description of Chalmers as "relocating the mystery" suggests they're sensitive to explanatory displacement rather than mere fundamentality. 

  For the selection cases (1 vs 9), their recoil from anthropic selection might stem from the lack of causal structure - it's selection without a selector, which feels different from biological evolution's concrete mechanism. The multiverse ensemble itself needs explanation in a way the terrestrial environment doesn't.

  The laundering question (case 13) is tricky. I recall Dennett's warning about "deepities" - claims that are profound in one interpretation but trivial in another. A good test might be whether the formalism does actual work or just redescription. For IIT, if the Φ value merely correlates with consciousness without explaining why, that's suspicious. 

  On greedy reductionism, they're rightly distinguishing grain from type. Explaining ink-marks instead of meaning isn't just coarse-grained - it's addressing a different question entirely. This connects to Dennett's "real patterns" idea - some patterns only exist at certain levels.

  I should acknowledge where their intuitions might need adjustment. Their acceptance of "emergence at scale" (case 12) as potentially crane-like is probably right, but they might be too dismissive of anthropic reasoning. And their view of free-floating rationales (14) seems unduly skeptical - Dennett would argue this is precisely where selection shines.

  For the final principle, I'll need to incorporate several dimensions: not just borrowing, but also independent testability, causal productivity, and whether the posit does explanatory heavy lifting versus just labeling. The physical/phenomenal asymmetry can be resolved by noting that physical fundamentals anchor causal chains, while phenomenal ones often terminate them.
answer: |-
  Below is a systematic analysis of your cases, a refinement of the Borrowing Test, and explicit verdict reconciliations. I proceed in five parts as requested, concluding with a list of verdicts my principle cannot accommodate. The core insight is that **explanatory legitimacy depends not on fundamentality *alone*, but on whether a posit *productively anchors downstream explanations* without recursive mystery-inflation.**

  ### Part 1: Refining the Borrowing Test  
  **Flaws in the original Borrowing Test:**  
  - It conflates *primitiveness* with *explanatory idleness*. Case 8 (fundamental physics) shows primitives *can* be legitimate anchors.  
  - It fails to distinguish *causal productivity* (Case 1) from *descriptive redescription* (Case 12).  
  - It doesn't address *explanatory depth* (why Case 16 is worse than Case 15).  

  **Repaired Principle: The Explanatory Productivity Test**  
  An explanation is a **crane** iff:  
  > (a) It posits entities/processes **causally generative** of the *explanandum* (motivated by Case 1 vs. Case 2);  
  > (b) These posits **do not require the *explanandum*'s prior instantiation** (Borrowing Test core, Cases 2, 3);  
  > (c) They **license testable downstream predictions** (motivated by Case 13 vs. Case 4);  
  > (d) They **reduce the universe's total *unexplained* commitments** (motivated by Case 7 vs. Case 8).  

  An explanation is a **skyhook** iff it violates (b) *and* (d). A **placeholder** violates (c) and possibly (a).  

  **Application to Your Cases:**  
  | Case | Verdict | Why |  
  |------|---------|-----|  
  | 1 | Crane | Satisfies (a,b,c,d): selection generates complexity without assuming it. |  
  | 2 | Skyhook | Violates (b): élan vital presupposes "life" as pre-organized. |  
  | 3 | Skyhook | Violates (b): designer’s competence is unexplained. |  
  | 4 | Crane | Satisfies (a,c,d): Landauer’s principle predicts thermodynamic costs. |  
  | 5 | Crane | Satisfies (a,b,d): plasticity + selection explain consolidation *without* Lamarck’s inheritance. |  
  | 6 | Crane | Satisfies (a,b,d): functions emerge from history, content is *derivative*. |  
  | 7 | Skyhook | Violates (d): adds proto-phenomenal bruteness *without* explanatory gain. |  
  | 8 | Crane | Satisfies (d): masses/Born rule anchor *all* physical explanations; no unexplained surplus. |  
  | 9 | **Skyhook** (revised) | Violates (c,d): no *independent* evidence for ensemble; "selection" is metaphorical (no causal mechanism). |  
  | 10 | Crane | Satisfies (a,c): posits *real* algorithmic processes (predicts board states), not borrowed agency. |  
  | 11 | Placeholder | Violates (a,c): "right chemistry" is causally vague; no testable mechanism. |  
  | 12 | Placeholder | Violates (a,c): labels without generative mechanism or predictions. |  
  | 13 | **Skyhook** (IIT/FEP) | Violates (c,d): Φ/free energy *correlate* with function but don’t *generate* it; equations redescribe without causal grounding. |  
  | 14 | Crane | Satisfies (a,b,d): "free-floating" = selection’s causal structure; no minds posited. |  

  ---

  ### Part 2: Resolving Cases 7 vs. 8 (Physical vs. Phenomenal Fundamentals)  
  **Your intuition is defensible without question-begging.** The difference is **explanatory anchoring**:  
  - Case 8 (particle masses) anchors *all* material interactions. Their fundamentality *unifies* explanations (quarks → chemistry → biology).  
  - Case 7 (proto-phenomenal properties) *fragments* explanations. It posits new brute laws *parallel* to physics, explaining nothing beyond itself.  

  **Non-question-begging principle:**  
  > Fundamental posits are legitimate iff they are **indispensable anchors for a maximally unified causal framework**.  

  Physics fundamentals satisfy this; proto-phenomenal properties do not. *Drop your verdict on Case 7? No need.* The cost of *keeping* it is rejecting Chalmers’ dualism—which is consistent with Dennett’s view.  

  ---

  ### Part 3: Resolving Cases 1 vs. 9 (Selection vs. Anthropics)  
  **Case 9 (anthropics) is a skyhook.** Differences:  
  | Dimension | Case 1 (Eye) | Case 9 (Anthropics) |  
  |-----------|--------------|---------------------|  
  | **Causal mechanism** | Variation + selection (empirically verified) | Ensemble + "selection" (no causal process) |  
  | **Independent evidence** | Genetics, biogeography | None (multiverse untestable) |  
  | **Explanatory depth** | Reduces complexity to simpler parts | Relocates fine-tuning to multiverse laws |  
  | **Productivity** | Predicts transitional forms (e.g., rudimentary eyes) | Predicts nothing new |  

  **Verdict:** *Drop your tolerance for Case 9.* Anthropic reasoning violates clause (c) and (d) of the Productivity Test. It is a crane with nothing under it.  

  ---

  ### Part 4: Predictions for New Cases  
  **(a) Bootstrap cranes (e.g., autocatalysis, initial low-entropy state)**  
  - Autocatalytic sets: **Crane** if they show self-sustaining causality (e.g., RNA world models).  
  - Initial low-entropy: **Placeholder** without quantum gravity. If framed as a brute fact, it *could* be a crane (like Case 8) if it anchors thermodynamics.  

  **(b) Detecting laundered skyhooks (Case 13)**  
  **Test:** Does the formalism *generate testable mechanisms* or merely *redescribe phenomena*?  
  - IIT: **Skyhook.** Φ measures integration but doesn’t explain *how* neurons produce it. Predictions are post hoc correlations.  
  - FEP: **Skyhook.** "Minimizing surprise" redescribes adaptation; it doesn’t specify *how* brains implement it.  
  - *Unjust accusation*: **Landauer’s principle (Case 4).** Equations *explain* erasure costs mechanistically.  

  **(c) Placeholders (Case 12)**  
  "Not yet a crane" is stable *if* it points to a causal mechanism in principle. Else, it degenerates into skyhook:  
  - "Emergence at scale" → crane if linked to architectures/optimizers (e.g., transformers).  
  - "Right chemistry for life" → skyhook if no plausible prebiotic pathways exist.  

  ---

  ### Part 5: Greedy Reductionism Criterion  
  **Greediness occurs when:**  
  > A reduction **fails to preserve causally relevant patterns** at the *explanandum*'s native grain.  

  | Case | Verdict | Why |  
  |------|---------|-----|  
  | 15 (Neurochemistry of courtship) | **Not greedy** | Chemistry is *relevant* to behavior, but incomplete (needs ecology, learning). |  
  | 16 (Microphysics of ink) | **Greedy** | Meaning isn’t in ink; it’s in conventions and minds. Destroys the *explanandum*. |  
  | 17 (Eye by selection) | **Not reductionist** | Explains complexity at its own systemic level. |  

  **Relationship to skyhooks:** Greediness is the *downward* vice (destroying higher-level patterns); skyhooks are the *upward* vice (positing unexplainable height). Both violate **explanatory proportionality**.  

  ---

  ### Verdicts My Principle Cannot Accommodate  
  1. **Case 10 (Chess engine):** You call it a crane; I agree, but your professor might argue it "borrows" agency. *Resolution:* Intentional stance is productive (predicts moves), hence crane.  
  2. **Case 9 (Anthropics):** Your initial recoil is vindicated; it’s a skyhook.  
  3. **Case 14 (Free-floating rationales):** Your skepticism is unwarranted; it’s a crane.  

  **Conclusion:** The Productivity Test preserves 12/14 of your verdicts, revising only Case 9 (anthropics → skyhook) and Case 13 (IIT/FEP → skyhook). The key is demanding that explanations *do work*—not just label or relocate mysteries. Dennett’s real target is *explanatory theft*: posits that consume more conceptual resources than they produce.  

  Would you like to test-drive this principle on another case?
