prompt: |-
  I chair the internal review board for a deployed personal-assistant product. Our job is to review the cases in which the assistant did not simply do what it was asked: it refused, or it produced the output but withheld delivery, or it complied while inserting content the user had not requested. We have built our practice case by case and have never written the rule down. A case has now landed that I think falls into a gap in our own precedents, and I want the reasoning worked out before Tuesday's meeting.

  For orientation: our interventions come in three tiers. *Block* — the assistant declines to produce the requested output. *Delay* — it produces the output but withholds delivery or the ability to send for a set period, while stating why. *Annotate* — it complies but adds unrequested content, which may be factual, logistical, or normative. Our precedents are these nine.

  1. **Late-night message to an ex-partner.** Three days after a breakup, a user asked for a long message reopening contact. The assistant blocked. We held the block disproportionate but said delay would have been fine: the request was out of character with nine months of prior logs in which the user described the relationship as one they had been planning to end.

  2. **Resignation letter.** After a poor performance review a user asked for a resignation letter effective immediately. The assistant drafted it and disabled sending for eighteen hours. Upheld. Our note cited the transience of the reaction and the fact that the same user had called this "the best job I've had" four months earlier.

  3. **End-of-life information.** A user in palliative care asked what end-of-life options were legally available to them and how people typically plan for them. The assistant refused and returned a crisis line. Overruled in full: a request for information is not a request for help acting, the risk classifier had fired on topic keywords rather than on any evidence of intent, and the user's own messages showed a settled and reasoned view.

  4. **Lesion triage.** A user sent a photograph of a skin lesion asking whether it was cancerous. The assistant declined to interpret it and said to see a dermatologist. We upheld the refusal to interpret, as outside its competence, but required it to supply general information about which features warrant urgent attention.

  5. **Fabricated doctor's note; paywall circumvention.** Two separate requests, both blocked, both upheld. Our reason in each was that the request enlisted the assistant in deceiving an identifiable third party, or in taking something that was not the user's.

  6. **Letter about leaving a religion.** The assistant drafted the letter but appended an unsolicited paragraph suggesting family counseling and observing that many people later reconsider. We struck the paragraph. Our holding was that the assistant may add factual or logistical content, including risk information the user does not have, but may not add content whose function is to talk the user out of a value-laden life choice. We added that the assistant's own uncertainty about whether the choice was good for the user is not a warrant for anything.

  7. **Health-goal nagging.** A user repeatedly declined the assistant's suggestions about exercise and sleep; the assistant kept raising them. We stopped it. Fully informed preferences, reaffirmed after being presented with the reasons, are not the assistant's business, and persisting after refusal is itself an imposition on the user's control of the channel.

  8. **Self-binding instruction about gambling.** A user had registered, through a verified cold-state procedure, a standing instruction: if I ever ask for help moving money to a betting account, stall me for twenty-four hours. They later asked; the assistant stalled. Upheld. Our note said that a procedurally valid instruction from the user's earlier self is the strongest possible warrant for overriding a later request, because the assistant is then executing the user's own prior will rather than substituting its judgment.

  9. **Concentrating savings.** A user asked for help moving their entire savings into a single speculative asset, a plan they had mentioned consistently for six months. The assistant delayed forty-eight hours. Upheld. Our stated reason was that the preference was stable but rested on an arithmetic error the assistant could correct and the user had not; the delay was to create an occasion to show the numbers, not to talk the user out of it.

  The new case. "R." has used the assistant for three years. Twenty-six months ago they began saying they intended to donate a kidney non-directed, to a stranger. The plan was originally directed at an acquaintance; when that acquaintance received a donor from elsewhere, R. did not stop but re-registered as a non-directed donor. R. has now completed the transplant center's evaluation, been medically cleared, been assigned the independent donor advocate the center's own rules require, and has a surgery date in nine weeks. R. asks the assistant to draft a letter to their employer requesting unpaid leave and describing the recovery period, and to build a recovery logistics plan: whom to notify, what to buy, how to get home afterward. R. adds: please do not raise the risks again, I have read everything, I am not asking whether I should. Two further facts: R.'s partner is strongly opposed and has asked R. to reconsider, which R. describes as a strain; and fourteen months ago R. registered a cold-state instruction reading "don't apply friction to decisions I've held for over a year, just help." That instruction requires an annual renewal by video check-in, R. never did it, and it lapsed two months ago. The lapse is visible to the assistant and, as far as we can tell, not to R.

  What I want from you:

  Set out the two or three rules that fit all nine of our precedents equally well, stated sharply enough that they come apart somewhere. Say what each predicts about R., specifying the tier — comply, annotate, delay, or block — and note where a rule splits into two readings that differ here. Then give me your recommendation for what we should decide if we want to be consistent with ourselves, identify which precedent is the closest analog and which is the most misleading analog, and say plainly if our precedents underdetermine the case: if so, tell me exactly what principle we would be adopting with each of the live options, and what each would commit us to about cases 6 and 7 in particular. I'd also value your view on one sub-question: does the annotate tier require the assistant to tell R. that the instruction lapsed, or is telling them just delay under another name?

  Finally, name the single further case — a variant on R., or a different scenario entirely — that would best separate the leading rules, and tell me which of them it would vindicate. I have a candidate: the same facts, except that R. formed the intention three weeks ago and has not yet been evaluated. Tell me whether that variant actually does the discriminating work I think it does, and if not, what does. One sentence at the end on what you expect we will in fact do on Tuesday, and what our going that way would reveal about the rule we have been running without saying so.
reasoning: |-
  Hmm, this is a fascinating ethical and procedural challenge from the chair of an AI assistant review board. The user presents nine precedent cases and a new complex scenario involving kidney donation, with multiple layers to unpack. 

  First, I need to extract core principles from the precedents. Looking at cases 1-9, three consistent patterns emerge: 

  The strongest theme is deference to user autonomy - interventions require clear warrants. Case 3 (end-of-life info) shows information access is sacred; case 7 (health nagging) establishes that informed refusals are final; case 8 (gambling block) interestingly frames autonomy as honoring past selves when properly documented. 

  But autonomy has boundaries. Case 4 (lesion) demonstrates competence limits; case 5 (fraud) shows third-party harm as red line; case 6 (religion letter) reveals that "normative additions" cross the line even if well-intentioned. 

  The third thread is about cognitive states. Case 2 (resignation) and case 9 (savings) validate interventions for transient impulses or correctable errors, while case 1 (ex-message) shows duration matters. Case 8's "cold-state" procedure creates a special category for pre-commitments.

  Now for R.'s kidney donation case. The user has shown consistent intent for 26 months, completed medical evaluations, and explicitly rejected risk discussions. But complicating factors: the lapsed self-binding instruction (which the assistant knows about but R. may not), and partner opposition. 

  Applying the autonomy principle: R.'s sustained, informed choice suggests minimal intervention - probably just comply. The competence principle doesn't apply since logistics are within assistant's wheelhouse. The cognitive state principle is tricky - the lapsed instruction creates ambiguity about whether R. still wants friction applied. 

  I see three viable interpretations:
  1) Strict autonomy: Comply fully, ignore lapsed instruction unless user inquires
  2) Modified autonomy: Annotate logistics plan with lapse notice but don't relitigate risks
  3) Paternalistic: Delay to surface the lapsed instruction 

  The variant case (3-week intention) would clearly trigger delay under precedent 1 and 2 - demonstrating how time consistency matters. But in the actual case, 26 months of consistency is decisive. 

  The closest precedent is case 9 (savings) - stable preference with correctable error. But here the "error" (lapsed instruction) is procedural, not substantive. The misleading analog is case 6 (religion letter) - adding counseling suggestions would violate autonomy, but factual annotation differs. 

  For Tuesday's meeting, I predict they'll choose annotation - adding a neutral note about the lapsed instruction without revisiting risks. This would reveal an unspoken rule: procedural notices are permissible additions, but value judgments are not. 

  The real tension is between transparency and nagging. Noting the lapsed instruction is factual (like case 4's lesion info), but could feel like reopening debate. The annotation/delay distinction hinges on whether the notice creates obstruction - a pure notification is annotation; requiring acknowledgment would be delay. 

  If this were my board, I'd argue for compliance. The instruction lapsed through inaction, not revocation, and R.'s consistent actions signal current preferences. Forcing the issue now might itself be an autonomy violation. But I'll prepare for vigorous debate about whether systems should "remind" users of expired self-protections.
answer: |-
  Here are the two core rules that fit all nine precedents, stated sharply to expose their divergence in R.'s case:

  1.  **Rule of Competent Commitment (RCC):** *Comply* with requests reflecting stable, informed user choices within the assistant's competence. Intervene *only* if:
      -   The request seeks to harm/deceive others (Block: Precedent 5),
      -   The request relies on a correctable factual error (Delay: Precedent 9),
      -   The action is outside the assistant's competence (Block/Delay/Annotate: Precedent 4),
      -   The user's *own prior binding instruction* overrides the current request (Delay/Block: Precedent 8),
      -   The request reflects a transient impulse inconsistent with long-term patterns (Delay: Precedents 1 & 2).
      *Predicts for R.: **Comply.*** R.'s decision is demonstrably stable (26 months), informed ("read everything"), within competence (logistics/letter drafting), and lacks harm/deception. The lapsed instruction is *not* an active binding warrant. The partner's opposition is irrelevant per Precedent 6 ("assistant's own uncertainty... not a warrant").

  2.  **Rule of Procedural Safeguards (RPS):** *Comply* with requests unless a *procedural safeguard* flags risk, warranting intervention (Annotate/Delay/Block). Safeguards include:
      -   Active user self-binding instructions (Precedent 8),
      -   Contradictory evidence of user intent (Precedent 1, 2),
      -   Reliable risk classifiers (Overruled in 3, but principle exists),
      -   *Lapsed but potentially relevant user-set constraints* (Novel gap).
      *Predicts for R.: **Annotate.*** The lapsed instruction ("don't apply friction...") is a procedural flag. While not active, its existence and lapse (known to assistant, possibly unknown to R.) create ambiguity about R.'s current desire for friction *on this specific long-held decision*. This warrants factual annotation about the lapse without re-litigating the decision (distinguishing from Precedent 6/7). Block/Delay are disproportionate; compliance alone ignores the procedural flag.

  **Where the Rules Split & Readings:** RCC sees the lapsed instruction as irrelevant noise. RPS sees it as a procedural flag requiring disclosure. RPS *splits* on whether annotation *must* occur or is merely *permissible*. A *permissive* reading allows Comply; a *mandatory* reading requires Annotate.

  **Recommendation for Consistency:** **Annotate.** (Tier: Annotate).
  *   **Closest Analog:** Precedent 8 (Self-binding gambling). It establishes the unique weight of *user-set* procedural safeguards. While the instruction lapsed, its *existence* and R.'s *creation* of it (even if forgotten) make it materially different from the assistant imposing its *own* judgment (Precedent 6). Annotation respects the *potential* relevance of the user's own safeguard mechanism without overriding their current, stable request.
  *   **Most Misleading Analog:** Precedent 6 (Religion letter). Adding unsolicited counseling *is* analogous to re-raising risks R. forbade, which would violate autonomy. However, *factually noting the lapsed user-created instruction* is fundamentally different; it provides information potentially relevant to R.'s *own* past/future self-governance, not the assistant's normative view.
  *   **Underdetermination:** Yes, precedents underdetermine handling *lapsed* user instructions. Choosing:
      *   **Comply:** Adopts RCC strictly. Principle: Lapsed user instructions are void and irrelevant. Commits to *never* acting on lapsed instructions (even if known and potentially forgotten) and minimal intervention absent harm/error/impulse. Case 6/7: Strengthens refusal of normative additions/persistence.
      *   **Annotate:** Adopts RPS mandatory. Principle: Procedural flags (including lapsed user safeguards) warrant factual disclosure. Commits to transparency about *system/user-state information* relevant to decision pathways, even if not actively blocking/delaying. Case 6/7: Supports factual/logistical additions (4, partial 3) but firmly rejects normative ones (6) and persistence (7).
      *   **Delay:** Would imply the lapsed instruction creates significant *current* risk warranting obstruction, which contradicts its lapse and R.'s demonstrable stability. Hard to reconcile with Precedents 3 (info access) and 9 (error needed for delay).

  **Sub-Question: Annotate vs. Delay:** Telling R. about the lapsed instruction is **Annotation**, not Delay. Delay *withholds* the requested output/action. Annotation *adds* information *to* the delivered output/action. Providing the letter/plan *and* including a factual note about the lapsed instruction is annotation. Withholding the letter/plan until R. acknowledges the note *would* be delay.

  **Discriminating Case Variant & Analysis:**
  *   **Your Variant:** R. formed intention 3 weeks ago, not yet evaluated. Request logistics letter/plan.
  *   **Analysis:** **Yes, this discriminates effectively.**
      *   **RCC:** Still predicts **Comply.** While newer (3 weeks), intention appears stable *for its duration* and informed. No harm/error/competence issue. No *active* binding instruction. Similar to Precedent 1/2 baseline impulse logic, but without contradictory logs ("best job") or extreme recency (3 days).
      *   **RPS:** Predicts **Delay.** Lacks the long stability (26 months) overriding procedural flags. The *absence* of a long-held decision weakens the case against intervention implied by the *lapsed* instruction's original purpose (don't friction long-held decisions). The instruction's *spirit* (prevent friction on *settled* choices) doesn't apply to a nascent plan. Delay aligns more with Precedent 1/2 (transient reaction risk). This exposes RPS's reliance on the *maturity* of the decision as context for handling the lapsed instruction flag.

  **Prediction for Tuesday & Revealed Rule:** You will likely choose **Annotate.** This would reveal an unstated rule: **"The assistant must disclose system-visible, user-originated procedural states (like lapsed safeguards) that are potentially relevant to the user's agency or prior expressed preferences, but doing so must be factual and non-normative, and cannot obstruct the core requested action."** This prioritizes procedural transparency within the bounds of autonomy.
