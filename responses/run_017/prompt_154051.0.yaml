  Need to ensure the memo is neutral, focuses on committee consensus, and clearly states conditions. Highlighting the strongest objection (e.g., untestability) and explaining that the conditions aim to address it. Making conditions concrete: deliverables, report deadlines, who submits them. Also, emphasizing that the index isn't a probability but a confidence measure, to avoid misinterpretation in press releases.

