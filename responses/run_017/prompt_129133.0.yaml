  Here is a toast crafted to respect your constraints, aiming for warmth, specificity, and the philosophical rigor you require, while avoiding the forbidden territory. The bracketed memories `[like...]` and `[such as...]` are your slots to fill.

  **The Toast (Approx. 700 words):**

  "Good evening, everyone. For those who don’t know me, I’m Callum’s older, and arguably wiser, brother. Though judging by the fact he’s the one standing up here getting married today, maybe the jury’s still out on that! Seriously, Callum, Amara, you look… completely yourselves, only brighter. It’s wonderful to see you both radiating like this.

  Now, wedding toasts often try to explain *why* a couple belongs together. They reach for grand pronouncements about destiny, or lists of virtues, or predictions about forever. But standing here, looking at you two, that approach feels… unnecessary. Maybe even a little off-target. Instead of trying to assess or justify, I just want to tell you what I *see* when I see Callum and Amara together. Because what’s visible, what’s present, speaks loudly enough.

  I see the way Callum leans in, just slightly, when Amara is talking about something that excites her – whether it’s the intricate wiring on a vintage amp or the plot twist in that detective series you’re both hooked on. It’s not performative listening; it’s a quiet attentiveness, a posture of genuine interest. `[Insert specific, recent, lighthearted example of Callum listening intently to Amara, e.g., "like when you were describing the perfect sourdough starter consistency last Sunday, Callum, elbows on the counter, chin on fists, totally absorbed"]`.

  I see the way Amara, amidst the controlled chaos of band setup – because let’s face it, Callum, your pre-gig ritual involves a lot of cable-juggling – has this knack for handing him the *exact* cable or adapter he’s muttering about needing next, often before he’s fully asked. It’s not fussing; it’s a kind of tuned-in anticipation, a practical harmony. `[Insert specific, recent example of Amara intuitively helping/anticipating Callum's need, e.g., "like at Liam's birthday gig when you wordlessly passed him the spare plectrum just as his snapped mid-solo"]`.

  I see the comfortable silences that aren’t empty, but full. Sitting with you both on that battered sofa you hauled up three flights of stairs, there’s a quiet companionship that doesn’t need filling. It’s the shared glance over a ridiculous meme, the mutual sigh when the kettle takes forever, the easy way you occupy space together without crowding each other out.

  I see the sparks of shared adventure, too. The slightly mad glint in Callum’s eye when he proposes a spontaneous road trip to find some obscure record store, and the way Amara doesn’t just agree, but immediately starts plotting the best coffee stops along the route. `[Optional: Insert a brief, positive memory of a shared adventure, e.g., "I remember your faces, slightly windswept and triumphant, rolling back from that impromptu coastal drive last autumn"]`. It’s not about grand gestures, but a shared readiness for the small, interesting detours life offers.

  And yes, I know *how* your paths crossed. That context exists. It’s part of your story. But what stands out far more, what defines the shape of you two together now, isn't the circumstance of the meeting, but the quality of the connection that grew entirely on its own terms since that day. What I see is the relationship you’ve built, brick by everyday brick, conversation by conversation, through the ordinary and the unexpected, entirely as yourselves.

  I see two people who seem genuinely *curious* about each other, still. Who find small joys in the other’s company, in the rhythm of daily life built together. Who face the inevitable bumps not with grand pronouncements of endurance, but with a practical, grounded teamwork that looks like shared glances and figuring it out side-by-side.

  So, Callum and Amara, my toast isn’t about eternal guarantees or cosmic designs. It’s about what’s right here, right now, visible to anyone who looks. I see your attentiveness, your harmony, your comfortable quiet, your shared spark for the small adventures, and your enduring curiosity in each other. I see a partnership built on a thousand small, real moments, happening now and stretching back over years, forming a foundation that feels utterly present and alive.

  Let’s raise our glasses. To Callum and Amara. To what we see. To the next conversation, the next quiet moment, the next small adventure, and to the ever-unfolding reality of the partnership you’ve built together. Cheers!"

  **Analysis (250 words):**

  *   **Structural Work:** The sentence doing the heaviest lifting is: **"Instead of trying to assess or justify, I just want to tell you what I *see* when I see Callum and Amara together."** This explicitly rejects assessment (wrong-kind/tense reasons) and establishes "noticing" as the core methodology. Every subsequent observation flows from this directive.
  *   **Conventional Move Abandoned:** I completely avoided the "Why they're perfect/right for each other" section. This is the standard toast heart, but it inherently leans on assessment, borrowed reasons (family approval, shared history as justification), and risks wrong-tense reasoning by using the past to validate the future promise. Sacrificing this core move was necessary to hold your distinctions.
  *   **Where I Cheated (Slightly):** The line about *how* they met ("And yes, I know *how* your paths crossed...") is a calculated risk regarding borrowed-kind reasons. It acknowledges the elephant in the room (the nursing/funeral context you mentioned) but immediately pivots to deflect its weight: "...but what stands out far more... is the quality of the connection that grew entirely on its own terms since that day." This frames the difficult origin as simply a starting point, actively dismissing it as the *reason* or defining feature *now*, emphasizing the autonomy of their bond. It attempts to neutralize the potential debt by making it irrelevant to the present observation.
  *   **Distinction Clarity:** Your three distinctions are coherent and hold up:
      1.  **Wrong-tense:** Clearly addressed by focusing on present observable dynamics ("what I see") and avoiding "always/never" or using the past as a *warrant* for the future commitment.
      2.  **Borrowed-kind:** Directly confronted by acknowledging the problematic context but explicitly rejecting its relevance to their present bond and value.
      3.  **Uptake-safety:** Achieved through concrete, observable behaviours ("leans in," "hands the cable," "shared glance") and avoiding value judgments ("perfect," "should"). Describing *actions* rather than *assessments* makes it safe for them to recall later.
      The only minor overlap is between "wrong-tense" and "uptake-safety" – avoiding future guarantees ("always") aids both. Your framework is sound, just challenging to execute gracefully! The "cheat" was necessary context management, not a confusion in your thinking.
