prompt: |-
  I sit on a small advisory group that a finance ministry set up to comment on the population assumptions behind long-run fiscal projections, and the work has made me realise that I have no settled view about whether a larger population is, in itself, a good thing. I can recite the labels — total against average, the repugnant conclusion, the non-identity problem — but they don't deliver verdicts on the cases I actually face, and it's the cases where my confidence lives. So I want to start there. Priya and Daniel have one child and are deciding about a second; the second child would be clearly happy, but Mira's share of their time and money would fall, their own well-being would fall, and average well-being in the family would end up lower. I think they should go ahead, and that the outcome is better — though I don't want to say better by much, and I don't want to say they're required to. Nina could have a child who would affect no one else at all: no siblings, no transfers, no strain on anything, and the child's life would be mildly worth living but well below the level of everyone around her. My verdict here is different: I can't see this as an improvement that gives Nina any reason, and yet I also don't want to call it worse, and I resist saying it would be wrong. And when I compare a world of three billion people living rich lives with a world of those same people plus twenty-seven billion additional people whose lives are only just worth living, I don't think the bigger world is better; pressed, I'd say the smaller one is, or that they aren't comparable. I take it those three verdicts can't all survive together, and I want to know which one goes and what the surviving principle costs.

  The cases that actually come up in my job are messier, and they're the ones I care about. In one valley there are about nine hundred speakers of a minority language, and it takes somewhere around twelve hundred to support a school, a newspaper and a teacher-training programme; below that floor the language is gone within two generations. Five hundred extra people, each of them living only a mildly good life, would cross the floor — and I find myself thinking that the larger population is genuinely better, not merely instrumentally good for the nine hundred, because something comes into existence that couldn't exist at the smaller size. That verdict worries me: is it just a threshold in a shared good, or am I valuing a culture over the people in it, and if so doesn't the same logic tell me that a population big enough to sustain something I thoroughly disapprove of — a sect that needs a thousand members to keep a doctrine alive, or a demographic majority needed to keep a nasty party in power — is better too? There's also the question of the route: crossing that floor requires the women now of childbearing age to have more children than they want and to carry nearly all the cost, while the benefit lands on their grandchildren, and this makes me much less willing to call the change better all things considered, even holding the endpoint fixed — yet I can't see how to build that in without sliding into a view on which Priya and Daniel's second child is impermissible as well. Then there's the couple who want a fourth child partly because the country will need taxpayers to pay pensions, which strikes me as a bad reason, though I can't tell whether that's a point about population ethics or about what kind of consideration may move an agent at all. And the case I keep reversing on: a couple who very much want a child and know that the child will live through serious climate damage, with a life still worth living but much harder than their own — sometimes I think of course it's fine, our own lives are hard and fine, sometimes I think they'd be handing someone a burden they helped create.

  The best I can do by way of a principle is this: adding a person makes the outcome better just when their life is (i) worth living at all, (ii) above some critical level well above zero — I want to say, a life you could be glad to have given someone — and (iii) compatible with no existing person being pushed below the level at which their own life stops being worth living; and (iv) a larger population is additionally better when it crosses a floor at which goods like a language, a school, a clinic or a research community first become possible at all. Separately, I want to claim that even when a larger population is better in that sense, the fact is only sometimes a reason for anyone in particular, and never a reason that overrides what the people who would bear the costs of getting there actually want. Please test that against my cases and repair it where it breaks: I suspect clauses (ii) and (iii) are doing incompatible work, and that (iv) is either redundant — just (i) applied to future people's well-being — or smuggles in a non-welfarist value I haven't owned up to. Give me one principle, or at most two or three rivals, each clause tied to the case that motivates it; be explicit about whether you're giving me a betterness relation over outcomes or a view about reasons and permissibility, since I keep sliding between the two; tell me plainly which of my verdicts each candidate forces me to give up; and then tell me what it predicts about two cases I haven't put to you — a state that stops subsidising births and instead admits a large number of immigrants, and a couple who have a third child mainly so that their two existing children will have a sibling and the family name will continue. I would rather be told that one of my verdicts has to go than be handed a principle with six adjustable dials.
reasoning: |-
  Hmm, this is an intricate and deeply personal inquiry about population ethics. The user is grappling with real-world policy dilemmas where abstract theories feel inadequate. They've presented several concrete scenarios that challenge standard ethical frameworks, and their frustration with "adjustable dials" suggests they crave coherence over compromise.

  The core tension lies in three conflicting intuitions: approving Priya/Daniel's second child despite lower average welfare, rejecting Nina's marginal-life child, and preferring the 3-billion-rich world over the 30-billion-mediocre one. Their proposed principle attempts to reconcile these through thresholds (critical welfare level, no one pushed below subsistence) and collective goods - but they rightly suspect internal contradictions.

  What makes this fascinating is how policy realities complicate pure ethics. The minority language case introduces threshold-dependent goods, while the childbirth subsidy question exposes the morality of means versus ends. Their observation about "sliding between betterness and permissibility" is astute - this is where most population ethics theories fracture.

  The immigration and sibling cases they request predictions for are clever stress tests. The first probes whether source-of-population matters to ethical evaluation, the second tests whether non-welfarist values like family continuity have weight. Their resistance to "repugnant conclusion" logic is palpable throughout.

  I notice their professional context (fiscal policy advising) explains the urgency. When your recommendations affect real populations, armchair philosophy feels insufficient. Their examples deliberately mix micro and macro scales - from individual family decisions to civilizational-scale populations - which is exactly where standard frameworks fail.

  The emotional undertone is thoughtful anxiety. They're not seeking validation but rigorous challenge, hence the "tell me which verdict must go" request. This demands unusually direct engagement - no hedging, while respecting their clearly developed intuitions.
answer: |-
  Your struggle captures the core tensions in population ethics: between total/average welfare, person-affecting principles, and the value of collective goods. Let's test your proposed principle against your cases, identify contradictions, and refine a coherent framework. I'll present three rival principles (with tradeoffs), specify their normative type, show which verdicts they sacrifice, and apply them to your new cases.

  ### Your Proposed Principle (for reference):
  > Adding a person makes outcome better iff:  
  > (i) Life worth living  
  > (ii) Above a "critical level" (glad-to-give threshold)  
  > (iii) No existing person pushed below subsistence  
  > (iv) Larger population better when crossing a "floor" for collective goods (language, school, etc.)  
  > ...and population size never overrides cost-bearers' wishes.

  ### Key Problems:
  - **Clash between (ii) and Nina/Crowded World cases**: Your intuition that Nina shouldn't create a below-critical-level life conflicts with (i). Your crowded world verdict rejects (i) entirely when lives are barely worth living.
  - **(iii) is too weak**: Priya/Daniel's existing child isn't pushed *below subsistence*, yet you sense a moral cost.
  - **(iv) risks non-welfarist smuggling**: Valuing a language's survival might not reduce to individual welfare.

  ---

  ### Three Rival Principles (Betterness Relations)

  #### **Principle A: Critical-Level Total Utilitarianism (CLU)**  
  *Type:* Outcome betterness  
  *Core:* An outcome is better iff total (well-being minus critical level) is higher. Critical level (k) is a fixed threshold (e.g., "life you'd be glad to give").  
  *Clauses:*  
  - **Adds (i) & (ii)**: Only lives above k count positively.  
  - **Drops (iii) & (iv)**: No protection for existing welfare dips or collective goods.  
  - **Permissibility addendum**: Creating above-k life is *permissible* but not obligatory; costs to others matter for action-guidance.

  *Verdicts forced on you:*  
  1. **Priya/Daniel**: **Better** (if new child > k, even if average falls).  
  2. **Nina**: **Worse** (if child < k). *Sacrifices your neutrality*: You must call it worse.  
  3. **Crowded World**: **Smaller world better** (27B barely-positive lives contribute little if k is high; e.g., if k=7/10, lives at 1/10 reduce total).  
  4. **Language Valley**: Better *only if* new lives > k. Collective goods don't directly matter.  
  5. **Climate Burden Child**: Better if child > k, worse if not.  

  *New Cases:*  
  - **Immigration vs. Subsidies**: Identical if immigrants' welfare > k. Source irrelevant.  
  - **Sibling/Name Child**: Better if new life > k. Non-welfarist motives don't affect betterness.  

  *Cost:* Abandons collective goods (iv) and your reluctance to condemn Nina's choice.

  #### **Principle B: Person-Affecting Sufficientarianism (PAS)**  
  *Type:* Outcome betterness with agent-relative constraints  
  *Core:* Outcomes are better if they improve existing people's lives *or* add lives above a sufficient threshold (s). Harm to existing people (reducing them below sufficiency) is strictly prohibited. Collective goods matter only as they affect individual sufficiency.  
  *Clauses:*  
  - **Adds (ii) & (iii)**: Critical level = sufficiency threshold (s). Lives below s don't count. Cannot push anyone below s.  
  - **Modifies (iv)**: Collective goods matter only if they lift people *to* sufficiency (e.g., school enables better jobs).  
  - **Permissibility**: Cost-bearers' autonomy trumps betterness.  

  *Verdicts forced on you:*  
  1. **Priya/Daniel**: **Better** only if new child > s *and* Mira stays > s. If Mira dips below s, worse.  
  2. **Nina**: **Neutral** (no one affected). *Keeps your neutrality*.  
  3. **Crowded World**: **Incomparable** (no shared people). Smaller world preferred if you weight sufficiency.  
  4. **Language Valley**: Better if new people > s *and* help existing speakers stay > s. Language itself isn't valued.  
  5. **Climate Burden Child**: Permissible if > s and parents consent.  

  *New Cases:*  
  - **Immigration vs. Subsidies**: Identical if welfare > s. Subsidies wrong if forced on cost-bearers.  
  - **Sibling/Name Child**: Better if new child > s; name/sibling irrelevant.  

  *Cost:* Abandons collective goods for their own sake (iv) and total welfare in large populations.

  #### **Principle C: Threshold-Sensitive Pluralism (TSP)**  
  *Type:* Hybrid betterness with non-welfarist elements  
  *Core:* Adds two distinct values:  
  1. **Individual welfare**: Total welfare with a high critical level (k).  
  2. **Collective thresholds**: Intrinsic value in realizing group-dependent goods (languages, democracies) *if* they meet a viability threshold.  
  *Clauses:*  
  - **Keeps (i), (ii), (iv)**: Lives must > k to count; collective goods matter intrinsically.  
  - **Modifies (iii)**: Existing people cannot fall below a *dignity floor* (d), lower than k.  
  - **Permissibility**: Collective goods don't justify overriding cost-bearers.  

  *Verdicts forced on you:*  
  1. **Priya/Daniel**: **Better** if new child > k and Mira > d.  
  2. **Nina**: **Worse** (child < k). *Sacrifices neutrality*.  
  3. **Crowded World**: **Smaller world better** (bare lives add little; no collective good at stake).  
  4. **Language Valley**: **Better** (crosses threshold for collective good). *But*: If the culture is "nasty" (e.g., hate group), it lacks intrinsic value.  
  5. **Climate Burden Child**: Better if child > k.  

  *New Cases:*  
  - **Immigration vs. Subsidies**: Immigration better if it crosses a collective threshold (e.g., stabilizes pensions). Source matters for permissibility (consent).  
  - **Sibling/Name Child**: Better only if new child > k. Family continuity is not a collective good.  

  *Cost:* Embraces non-welfarism (iv), risking "slippery slope" on what counts as a collective good.

  ---

  ### Which Verdict Must Go?
  - **Nina's Neutrality** is the weakest link. Principles A and C force you to call her choice worse (if k is high). Principle B preserves neutrality but abandons collective goods.  
  - **Collective Goods (iv)** require sacrificing pure welfarism. If you keep them (as in TSP), you must define which goods count (e.g., cultures yes, hate groups no).  
  - **Crowded World** verdict survives in all three: smaller world is better or incomparable.  

  ### Recommendation: **Principle B (PAS)**  
  It best preserves your core intuitions:  
  - Priya/Daniel: Permitted if no one falls below sufficiency.  
  - Nina: Neutral (no obligation to create, no intrinsic bad).  
  - Language Valley: Only better if it lifts people toward sufficiency (e.g., school improves opportunities). Avoids valuing culture over people.  
  - Costs: Rejects total welfare in large populations and intrinsic collective goods.  

  **Why?** Your deepest reluctance is condemning Nina and overriding cost-bearers. PAS prioritizes avoiding harm to existing people and respects agency. Collective goods are only instrumental. This matches your fiscal role: advising on welfare, not cultural preservation.

  ### Predictions for New Cases (under PAS):
  1. **Immigration vs. Birth Subsidies**:  
     - *Betterness*: Identical if both groups > sufficiency.  
     - *Permissibility*: Immigration is better if voluntary; subsidies wrong if coerced. Taxpayer-pensions reason fails if retirees are above sufficiency.  
  2. **Sibling/Family Name Child**:  
     - *Betterness*: Better only if new child > sufficiency. Sibling/name benefits don't count.  
     - *Permissibility*: Permissible if parents consent, but "for the name" is a bad reason (non-welfarist).

  ---

  **Final Cost**: To keep your neutrality on Nina and prioritize cost-bearers, you must accept that collective goods (like languages) lack *intrinsic* value and that barely-worth-living lives don't improve the world. The tradeoff is coherence for scope.
