  First, I need to recall Mary's room argument basics. Mary knows all physical facts about color vision but learns something new upon seeing red. The standard objection is that she gains an ability, not knowledge. The user's twist with the cortical stimulator seems solid against that. But the friend's point about modes of presentation or necessitation is trickier.

  The user's main concern is whether their argument definitively refutes physicalism or if physicalists have escape routes. They need to know what extra premise would bridge the gap to dualism. The friend's objections relate to the distinction between knowing facts and knowing them under a specific mode. Physicalists might say the new knowledge is still physical but accessed differently.

