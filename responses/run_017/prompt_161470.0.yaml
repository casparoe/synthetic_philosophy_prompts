  Key concepts: the knowledge argument hinges on factual knowledge vs. abilities. The stimulator addresses abilities, but the mode of presentation issue remains. For example, knowing H₂O as "water" vs. its chemical composition—same fact, different modes. If physicalists claim that Mary's new knowledge is just a new mode of a physical fact, they can maintain physicalism.

  To counter that, the user needs an extra premise. The non-derivability principle: if you know all physical facts and can't derive a new fact, it must be non-physical. But physicalists could argue that some physical facts aren't derivable a priori, like complex systems. Chalmers' zombie argument might help here, but that's another can of worms.

  The user might also need to argue that modes of presentation aren't part of the fact itself. If the fact includes how it's presented, then Mary's new experience introduces a new fact. But physicalists might say the mode is still physical, just a different representation.

