answer: |-
  Your setup is strong and the cortical stimulator *does* effectively neutralize the standard "ability/know-how" objection. Jackson himself would approve! However, your friend is pointing towards the most sophisticated and persistent physicalist counterarguments: **the mode of presentation/perspective objection and the necessitation objection.** Your intuition that this might feel like "word games" is understandable, but these objections are taken very seriously in the literature. They show that your argument, while powerful, needs an extra step or premise to *conclusively* refute physicalism and reach dualism.

  Here's a breakdown:

  1.  **Your Core Argument:**
      *   P1: Before release, Mary knows *all physical facts* about color vision (including neuroscience, optics, etc.).
      *   P2: Before release (with stimulator), Mary possesses *all relevant abilities* related to color experience (imagine, recognize, remember red).
      *   P3: Upon seeing red, Mary learns something genuinely new (she gains new *knowledge*, a new *fact*).
      *   C1: Therefore, what Mary learns upon seeing red is a *non-physical fact*.
      *   C2: Therefore, not all facts are physical facts; physicalism is false.

  2.  **Your Friend's Objections Explained:**
      *   **Mode of Presentation / New Guise:** Physicalists argue that facts can be known under different "modes of presentation" or "guises." Knowing "Water is H2O" and knowing "That clear, drinkable liquid is H2O" involve the *same fact* known in two different ways. Similarly, they argue that Mary knew the *physical fact about red-experience* under a *theoretical/third-person mode* (brain state R). Upon seeing red, she comes to know the *very same physical fact* under a *first-person, phenomenal mode* ("what it's like"). She gains new *knowledge-of*, not new *knowledge-that*. The *fact itself* (the occurrence of brain state R) was already known physically; she just accesses it subjectively now. Your stimulator setup blocks the claim she only gains an *ability*, but not the claim she gains a new *perspective* on an old physical fact.
      *   **Necessitation without A Priori Entailment:** Physicalists grant that Mary learns something *new to her* and that she couldn't *deduce* this phenomenal knowledge from the complete physical description alone. However, they argue this only shows that phenomenal facts are not *a priori derivable* from the physical facts. Crucially, they maintain that the physical facts *necessitate* the phenomenal facts with metaphysical necessity. The phenomenal facts are *constituted by* the physical facts, even if we can't figure out *how* just by thinking about the physics from our armchair. Knowing all the physical facts means *implicitly* knowing the phenomenal facts, even if she can't access that knowledge representationally until she has the experience. The gap is epistemological (about knowledge and derivation), not ontological (about what exists).

  3.  **Is Your Argument Valid?** Yes, *if* we grant that Mary learns a genuinely new *fact* (P3) and that facts known under different modes are genuinely *different facts*. Your argument is a powerful *challenge* to physicalism and strongly suggests non-physical facts. It pushes physicalists into complex maneuvers.

  4.  **Does it Refute Physicalism? Not Conclusively Yet.** Physicalists have plausible (though contested) responses within their framework using the objections above. They can accept P1-P3 and C1 *only* if "fact" in C1 means "a way of apprehending a fact" or "a piece of knowledge," not "a new state of affairs in the world." They deny that a new *ontological* fact is learned; only a new *epistemological* access to an old ontological (physical) fact.

  5.  **The Crucial Extra Premise(s) Needed for Dualism:**
      To bridge the gap and force the dualist conclusion (C2), you need to add a premise that explicitly rules out the physicalist reinterpretations. The most common (and strongest) candidate is a **Non-Derivability Principle** linking epistemology to ontology:

      > **The Non-Derivability Premise:** If a fact F is not *a priori derivable* from the complete set of physical facts, then F is not itself a physical fact (and is not metaphysically necessitated *only* by physical facts).

      *   **How it works:** Plug this into your argument. Mary knew all physical facts (P1). She could not derive the phenomenal fact of "what it's like to see red" *a priori* from those facts (evidenced by her genuine surprise/learning, P3). Therefore, by the Non-Derivability Premise, the phenomenal fact is not a physical fact (C1) and physicalism is false (C2).
      *   **Why it blocks the objections:**
          *   It directly addresses the "mode of presentation" objection by asserting that if a *way of knowing* (the phenomenal mode) reveals something fundamentally *underivable* from the complete physical description, then what is revealed must be a genuinely new *type* of fact, not just a new perspective on an old fact.
          *   It directly attacks the "necessitation without entailment" objection. It states that if the physical facts don't *a priori entail* F, then F cannot *just be* a physical fact necessitated by them. There must be something *more* to F.
      *   **The Cost:** This premise is highly controversial! Physicalists will vigorously reject it. They argue it conflates epistemological limitations (our inability to derive phenomenal truths from physics) with ontological conclusions (the existence of non-physical properties). They maintain that the physical *can* necessitate the phenomenal without it being *a priori* derivable (just as complex chemical facts necessitate biological phenomena we couldn't deduce from basic physics alone).

  **Conclusion for Your Paper:**

  *   **You are largely right:** Your setup is excellent. The stimulator effectively kills the ability reply. Mary *does* learn something genuinely new. This presents a *serious and unresolved challenge* to physicalism. Your intuition that the friend's objections feel like word games captures the sense that they are trying to *redefine* what a "fact" is to save their theory.
  *   **Your friend is also right (technically):** The objections based on modes of presentation and necessitation without entailment *are* live options in the philosophical debate. They show that your argument, as stated, doesn't deliver a *knock-out blow* to physicalism. Physicalism *can* (just barely) accommodate your scenario by reinterpreting the nature of what Mary learns.
  *   **To Get to Dualism:** You need the **Non-Derivability Premise** (or something equivalent like David Chalmers' claim that phenomenal truths aren't *a priori entailed* by physical truths). Acknowledge this explicitly in your paper. Your structure should:
      1.  Present the original Knowledge Argument (Jackson).
      2.  Present the Ability Reply.
      3.  Introduce your Cortical Stimulator Modificaiton to defeat (2).
      4.  Present the Mode of Presentation and Necessitation Without Entailment objections.
      5.  **Argue for the Non-Derivability Premise** (or its equivalent) as the key step needed to defeat (4) and secure the anti-physicalist conclusion. Explain *why* the phenomenal fact's underivability implies its non-physical nature (e.g., because if it were physical/necessitated, knowing *all* physical facts *should* let you know *that* fact, even if not under its phenomenal mode).
      6.  Conclude that *with* this premise, Mary's Room successfully argues for non-physical phenomenal facts and thus dualism (or property dualism).

  By addressing these objections head-on and making the crucial premise explicit, your paper will demonstrate a sophisticated understanding of the argument's depth and the ongoing debate. Good luck!
