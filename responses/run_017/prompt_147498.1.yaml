answer: |-
  **Bottom line:** The Pluto reclassification challenges Kripke's framework by exposing tensions in identifying the rule-follower, weakening the skeptic due to precedent-rich practice, revealing the skeptical solution's inability to cleanly handle the IAU's "discovery" claim, and showing persistent dissent as an anomaly for community agreement, suggesting the IAU acted legislatively despite appeals to description.

  1.  **Rule-Follower:** Kripke’s skeptic targets the *individual speaker* (e.g., "What did *I* mean?"). The skeptical solution relies on the *community* for justification. The episode forces the issue: the IAU acts as a *designated authority sub-community* claiming to articulate a pre-existing rule for the wider community. Kripke's framework struggles with this. While communities *can* host rule-following practices via shared dispositions and public criteria (as per the skeptical solution), the IAU's *authoritative pronouncement* introduces a top-down element alien to Kripke's picture of agreement emerging bottom-up from individual dispositions. The episode suggests communities *can* follow rules collectively through shared practices and records, but Kripke doesn't adequately model the role of formal authority within a community.

  2.  **Rule & Novelty:** The pre-2006 "rule" was an informal, evolving practice based on characteristics like orbit, size, and roundness, applied amidst a changing population. The novelty wasn't a single unprecedented object (Pluto itself was known), but the *context*: the *discovery of many Pluto-like bodies* (Eris, KBOs) created pressure akin to discovering many "Ceres-like" bodies in the 1850s. This weakens the skeptic's standard challenge. Kripke's skeptic exploits an individual's isolated past applications facing one new case. Here, the community had a rich *historical record* of handling a *similar population shift* (Ceres → asteroids), providing robust precedent. The skeptic's task is harder; novelty arises from scaling a known pattern, not confronting radical unfamiliarity.

  3.  **Skeptical Argument ("Plet" Challenge):** Constructing a plausible, non-standard "plet" rule fitting pre-2006 usage as well as "planet" but yielding "Pluto is a planet" is difficult. Consider "A *plet* orbits the Sun, is nearly round, *and either is larger than Mercury OR has fewer than 20 known objects sharing a similar orbital region*." This fits the 8 major planets (all large, sparse orbits) and Pluto pre-KBO discoveries (smaller than Mercury, but few known neighbours), while excluding Ceres (smaller, many neighbours in belt). Post-2006 discovery context, it includes Pluto (fewer than 20 neighbours in its specific resonant zone?) but excludes Eris (many neighbours? depends on definition). However, the Ceres precedent severely undermines this. The community *already had* a practice of reclassifying objects when many similar bodies were found in a region, making a rule *ignoring* population density (like "plet") less plausible than one sensitive to it (like the IAU's "clearing"). **Finding:** The abundance of explicit precedent (Ceres, asteroids) and shared records makes constructing a Kripkean "quus"-style competitor far less compelling than in the arithmetic case. The skeptic's argument *can* technically run but is significantly weakened; it thrives on individual speaker impoverishment, not community richness.

  4.  **Codification & the Skeptical Solution:** The skeptical solution can readily handle **legislative** stipulation (the community adopts a new rule) and **descriptive** articulation (reporting existing communal dispositions). It struggles profoundly with **retroactively constitutive** claims ("We discovered Pluto *was never* a planet"). The skeptical solution (meaning as justified use within communal practice) collapses description and retroactive constitution *if* the community accepts the description as accurate. It cannot distinguish between "This *is* what we meant all along" (description) and "This *was* what we meant all along" (retroactive constitution) because meaning isn't a prior fact awaiting discovery. The IAU claimed retroactive constitution/discovery ("Pluto never was" under the *true* rule), but its authority derived only from the power to decide *now*. The skeptical solution explains this as the community *adopting* a new standard *while* projecting it backwards as always having been the case – effectively disguising legislation as discovery. The orbital neighbourhood condition's relational nature highlights this: prior usage tracked intrinsic properties (size, shape, orbit) *implicitly in contexts* where population density wasn't an issue (inner planets) or was resolved ad-hoc (Ceres). The IAU definition wasn't a "bad description" of a simple intrinsic property; it was an *articulation* (part descriptive, part legislative) of a complex criterion latent but indeterminate in prior practice due to silence on population thresholds. **Silence vs. Indeterminacy:** Silence (no prior case forced a decision on this parameter) *is* a form of indeterminacy under Kripke; the rule didn't *determine* an answer for contexts with many similar bodies.

  5.  **Closing the Loop - Dissent & Stakes:** The persistent dissent *is* an **anomaly** for the skeptical solution. It predicts convergence based on communal agreement justifying use. Here, agreement was neither prior nor post-hoc; a subgroup decided, and dissent continued. The skeptical solution struggles to explain the *content* of the dispute without smuggling in factual meaning. Framing it as **merely verbal** (disagreeing on the definition of "planet") is the skeptical solution's fallback. However, this clashes with the **real institutional stakes**: textbook changes, mission funding, public outreach, scientific taxonomy. People were angry because they perceived the IAU as illegitimately changing a significant category, misrepresenting history ("never was"), and using flawed criteria. Under the skeptical solution, disputants aren't arguing about a fact (Pluto's "true planetness") but advocating for different communal standards ("We *should* use criterion X") reflecting different weightings of scientific values (dynamical dominance vs. geophysical characteristics). **IAU's Right Action (Skeptical Solution View):** The IAU should have explicitly **legislated** a new, precise definition for future use, acknowledging the indeterminacy of the past practice regarding population thresholds, rather than claiming discovery. The Ceres precedent is evidence of past *ad hoc stipulation* in response to population shifts, not evidence of a pre-existing, determinate rule waiting to be applied. It shows the *practice* contained a *pattern of resolving ambiguity through decision*, not the content of the decision itself.

  **Where Kripke is Silent/Where Extrapolated:** Kripke is silent on formal authority within communities, on novelty arising from population shifts rather than single cases, and on the dynamics of codification disputes. He doesn't address long-term dissent after an authoritative ruling. The analysis extrapolates by applying the framework to collective scientific practice with historical records and institutional authority, and by interpreting the Ceres precedent as evidence of past stipulative practice rather than rule-discovery. The key tension exposed is between the skeptical solution's reliance on community agreement and the reality of authoritative sub-communities making contested rulings that don't secure agreement.
