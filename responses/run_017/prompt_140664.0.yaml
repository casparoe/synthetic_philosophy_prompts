  For the proposal structure, I'll organize it like a standard social science grant but emphasize: (1) the "bundling problem" as the central limitation, (2) portability tests as the novel tool, and (3) historical case comparisons as the execution method. The month-by-month plan should show progression from theory to case selection to testing. 

  Biggest risks: The committee might see this as armchair theorizing. So the rebuttal section must argue that clarifying what would count as evidence is prerequisite for better empirics. Also need to preempt the "just find another natural experiment" critique by showing why that hasn't resolved debates. 

