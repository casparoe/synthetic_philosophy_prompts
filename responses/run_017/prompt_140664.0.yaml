  For scaling down: Start with colonial cases where portability was literally attempted (e.g., British institutions exported to different geographies/cultures). That cuts scope while keeping the core insight. Deliverables could be a typology of portability conditions rather than full tests. 

  The tone should match PhD-level rigor but avoid jargon - this committee will include non-specialists. Emphasize that the "answer" might be a diagnostic tool, not a grand theory. That manages expectations while keeping ambition.
answer: |-
  Here’s a structured two-page fellowship proposal addressing your core concerns, designed to satisfy committee expectations while explicitly tackling methodological tensions. I’ve streamlined the narrative for clarity and impact.

  ---

  # Dissertation Fellowship Proposal: **Distinguishing Causes of Development Through Portability and Temporal Dynamics**

  **Research Question:**  
  *What minimal empirical designs or counterfactual scenarios could decisively distinguish between institutional, geographic, and cultural explanations of comparative development—and do such designs exist in the historical record?*  

  ## Why the Question Persists (The Problem)
  The "horse race" between institutions, geography, and culture suffers from three fundamental limitations:  
  1.  **Bundling:** These factors co-evolve and are non-randomly assigned (e.g., colonial institutions imposed on specific geographies/cultures). Existing identification strategies (instruments, natural experiments, fixed-effects) capture *different bundled effects*, not pure causal isolates.  
  2.  **Pseudo-Replication:** Cross-national regressions assume ~150 independent observations, but spatial diffusion, colonial legacies, and common shocks (e.g., post-WWII Bretton Woods) create effective degrees of freedom closer to *8-10 clusters*. This inflates confidence in spurious precision.  
  3.  **Question Misalignment:** Scholars conflate distinct queries:  
      *   *Levels* (Why is Country A richer than B today?) vs. *Changes* (Why did A take off when it did?).  
      *   *Necessity* (Is factor X required for development?) vs. *Sufficiency* (Can X alone induce development?).  
      *   *Static fit* (Does X correlate with outcomes?) vs. *Portability* (How would X behave if relocated?).

  Existing approaches leave the core debate unresolved because they answer *different bundled questions*. We need criteria to adjudicate between theories *on their own terms*.

  ## Proposed Method: The Portability-Temporality Framework
  This project shifts focus from estimating causal *effects* to identifying *diagnostic tests* that can falsify one hypothesis while preserving others. The framework has two pillars:  

  1.  **The Portability Test:**  
      *   *Institutions:* Should function similarly if imposed on *different* geographies/cultures (e.g., British common law in India vs. Canada). Failure suggests interaction effects.  
      *   *Culture:* Should travel with migrating populations (e.g., German settlers in Brazil vs. Germany). Failure suggests contextual dependence.  
      *   *Geography:* Is inherently non-portable. Its effect should be stable *unless* technology neutralizes it (e.g., malaria eradication).  
      *   **Method:** Systematically construct counterfactual scenarios (“What if institution X were moved to location Y?”) and compare historical analogues (e.g., colonial transplants, partitioned regions, diasporas).  

  2.  **The Temporality Test:**  
      *   Can the hypothesis explain *variation in development timing*? Geography (largely fixed) can explain levels but not *takeoffs* without auxiliary theories (e.g., technological change interacting with geography). Institutions/culture must demonstrate plasticity correlating with growth spurts.  
      *   **Method:** Identify historical "break points" (e.g., industrialization, independence, resource discovery) and test whether *changes* in posited causes (e.g., institutional reforms, cultural shifts) precede/coincide with acceleration in development trajectories.  

  ### Yearlong Work Plan
  *   **Months 1-3:** Formalize diagnostic criteria. Define "minimal distinguishing designs" for each hypothesis pair (e.g., Inst vs. Geo, Culture vs. Inst) using portability/temporality logic.  
  *   **Months 4-6:** Catalog historical "near-misses": Cases approximating counterfactuals (e.g., identical institutions in divergent geographies [Hong Kong vs. Guyana]; displaced cultural groups [Palestinian diasporas]; geography-neutralizing tech rollouts [Suez/Panama Canals]).  
  *   **Months 7-9:** Conduct plausibility probes: Deep dives into 3-4 pivotal cases to assess if historical evidence permits clear discrimination (e.g., Korea’s split: Did divergent development paths align more with institutional differences, geographic disparities, or pre-existing cultural gradients?).  
  *   **Months 10-12:** Synthesize findings: Which hypotheses *can* be distinguished, under what conditions? Develop a typology of "diagnostic power" for historical designs.  

  ## Deliverable & Impact
  *   **For Decision-Makers:** A **"Decision Tree for Development Diagnostics"** outlining:  
      1.  Key questions to ask (e.g., "Is the proposed cause portable?" "Can it explain timing?").  
      2.  Historical case analogues offering the strongest discriminatory leverage.  
      3.  Flags for when hypotheses are *fundamentally indistinguishable* with existing data.  
  *   **Value:** Moves policymakers beyond "which factor matters most?" to "under what contextual conditions does *this* lever work?"  

  ## What Failure Looks Like (Honestly)
  The project fails if:  
  1.  **No Discriminating Designs Exist:** Historical cases are too "noisy," and all hypotheses make observationally equivalent predictions for available counterfactuals. *Contribution:* Demonstrates the *fundamental limits* of disentangling these factors empirically; shifts focus to interactive models or process tracing.  
  2.  **Portability/Temporality Lacks Traction:** The framework doesn’t generate sharper tests than existing methods. *Contribution:* A negative result refining methodological debate.  
  3.  **Overwhelming Complexity:** The typology becomes unwieldy. *Fallback:* Publish focused studies (e.g., "Testing Institutional Portability in British Colonies") using this lens.  

  ## Rebutting the "Stop Worrying, Find an Experiment" Critique (½ Page)
  *   **Natural experiments haven’t resolved the debate:** The Korea split (n=1) is contested on cultural/pre-treatment grounds; colonial instruments apply only to a subset of cases. We lack experiments where *only* institutions, *only* geography, or *only* culture varies.  
  *   **This isn’t philosophy—it’s applied methodology:** Before launching costly RCTs or hunting for natural experiments, we need to know *what would count as conclusive evidence*. This project provides a roadmap for identifying *informative* experiments by clarifying what counterfactuals would discriminate between theories.  
  *   **It makes empirics more rigorous:** By explicitly stating what each hypothesis predicts for portability and temporal dynamics, we force theories to be *falsifiable*, not just correlational. This prevents "post-hoc fitting" to natural experiments.  
  *   **Real-world relevance:** Policymakers *already* make portability bets (e.g., exporting democracy, attracting diaspora investment). Understanding the limits of these assumptions is urgent.  

  ## Scope Management: A Realistic Cut-Down
  The full project risks being too ambitious. **Scaled-Back Version:**  
  *   **Focus:** *Institutions vs. Geography* only (most polarized debate, cleanest portability logic).  
  *   **Cases:** 3-4 high-leverage historical portability tests (e.g., European institutions in temperate vs. tropical colonies; same geographic region under different institutions pre/post-independence).  
  *   **Deliverable:** A paper assessing whether "institutional portability" is empirically sustainable across contexts, using the diagnostic framework.  

  ---

  **Why this proposal works:** It reframes your methodological unease into a constructive, actionable research program. It promises a concrete tool (the diagnostic tree) while honestly confronting limitations. The scaled-back version ensures feasibility within a year. Crucially, it forces the committee to engage with the *substance* of the bundling problem—your core insight—while delivering methodological innovation.
