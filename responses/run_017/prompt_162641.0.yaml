  We map the results onto the philosophical issues:

  1. Transmission by testimony alone: 
     - The Rule Group acquired the know-how by reading the rule (testimony). They could then perform accurately on the transfer set and also transmit it by writing the rule (which worked for the newcomer). This suggests that know-how can be transmitted by testimony.
     - But the Practice Group learned by doing and could perform but might not transmit well. This suggests that there is know-how that is not reducible to a proposition.

  2. Skillful action and propositional guidance:
     - The secondary tasks: 
          - If the Practice Group is less affected by the verbal secondary task, that suggests their know-how is not relying on verbal guidance (non-propositional).
          - If the Rule Group is more affected by the verbal secondary task, that suggests they are using verbal guidance.

  3. Failure to articulate:
     - The Practice Group might perform well but fail to write the rule correctly. Is this a failure to know the proposition? Or merely an inability to articulate? 
     - The intellectualist might say: they know the proposition but cannot express it. The anti-intellectualist might say: they have an ability that is not propositional.

  4. View of know-how as an ability vs. a relation to a proposition:
     - The Practice Group developed an ability without necessarily having a proposition in mind. The Rule Group had a proposition and then developed the ability by applying it.

  What will go wrong:

  - The rule might be too easy: the Practice Group might figure it out and articulate it perfectly. We need a rule that is hard to articulate. The number rule might be learned and articulated. We can make the rule more complex? For example, use a rule about the sum of the digits? Or use a different rule? 

    Alternative rule: "admissible if the number is prime or divisible by 4, but not both." 
    Training set: 1-20. 
