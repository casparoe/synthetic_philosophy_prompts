answer: |-
  Below is a runnable classroom game designed to make students feel the force of the know-how vs. know-that dispute without naming intellectualism/anti-intellectualism. The game uses a hidden-rule classification task with the variable of **transmission method** (practice with feedback vs. explicit written rule) and includes secondary task manipulations. The payoff is competitive scoring (no money) based on accuracy and teaching success.

  ---

  ### **Game Overview**
  - **Core Question:** Is knowing-how reducible to knowing-that?
  - **Rule:** *A number is admissible if it is divisible by 3 or 5, but not by both.*  
    (e.g., 3✅ (div by 3), 5✅ (div by 5), 15❌ (div by both), 2❌ (neither)).
  - **Materials:** 
    - Training set cards: Numbers 1–15 (on index cards or printed sheets).
    - Transfer set cards: Numbers 16–30.
    - Newcomer set cards: Numbers 31–35.
    - Rule sheet (for Rule Group only): Explicit written rule (above).
    - Secondary task materials: Timer, paper for predictions.
  - **Groups:** 
    - **Practice Group** (9 students): Learns by classifying training set (1–15) with immediate feedback. Forbidden from writing hypotheses.
    - **Rule Group** (9 students): Given explicit written rule. No practice or feedback. Applies rule directly to transfer set.
    - **Secondary Tasks (within groups):** Split each group into 3 subgroups (3 students each):
      - *Control:* No secondary task.
      - *Verbal Task:* Classify while counting backward from 100 by 3s aloud.
      - *Motor Task:* Classify while tapping a pattern (non-dominant hand: index-index-middle, repeat) on the desk.
  - **Payoff Scheme (non-monetary):**  
    Scores = Bragging rights + "Expertise Points" (displayed on board).  
    - **Transfer Accuracy (TA):** 1 point per correct classification (16–30).  
    - **Newcomer Accuracy (NA):** Double points for the teacher! Newcomer’s score on 31–35 is multiplied by 2 and added to teacher’s total.  
    - **Total Score = TA + (2 × NA)**  
    Highest scorer wins "Master Classifier" title (e.g., certificate or shout-out).

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  | Time      | Activity                                                                                                | Details                                                                                                                               |
  |-----------|---------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|
  | **0–5**   | **Introduction**                                                                                        | Explain: "Today, you'll learn to classify numbers as admissible/inadmissible. Goal: Highest accuracy and teaching ability wins." No mention of know-how/know-that. Split into Practice (9) and Rule (9) groups. Assign secondary tasks (Control, Verbal, Motor) within groups.                                                                                                                              |
  | **5–20**  | **Training/Preparation Phase**                                                                          | **Practice Group (in trios):** Facilitator (you/TA) shows one number card (1–15). Student says "admissible" or "inadmissible." Immediate feedback ("correct"/"incorrect"). Repeat for all 15 numbers. *No note-taking!*<br>**Rule Group (individual):** Hand out written rule. Students read silently. Answer clarification questions only (e.g., "Does divisible mean...?"). No practice.                                                                       |
  | **20–30** | **Transfer Set Classification**                                                                         | **All students** classify transfer set (16–30) individually. <br>**Secondary tasks:**<br>- *Verital:* Count backward from 100 by 3s aloud during classification.<br>- *Motor:* Tap pattern continuously during classification.<br>- *Control:* No task. Collect responses.                                                                                                                                                                 |
  | **30–35** | **Rule Articulation**                                                                                   | All students write down the rule they used on paper. Collect submissions.                                                                                                                           |
  | **35–40** | **Predictions**                                                                                         | Students predict in writing: "Will the Rule or Practice Group be better at teaching? Why?" (Focus: transmission, not performance). Collect predictions.                                            |
  | **40–50** | **Teaching Simulation**                                                                                 | Randomly pair Practice and Rule Group students. Each swaps written rules. Each acts as "newcomer" using partner’s rule to classify newcomer set (31–35). Score newcomer accuracy.                  |
  | **50–55** | **Score Calculation & Reveal**                                                                          | Calculate scores: TA (16–30) + 2×NA (31–35). Announce top 3 scores. Reveal true rule. Discuss surprises.                                                                                              |
  | **55–75** | **Debrief & Philosophical Mapping**                                                                     | Guide discussion using results. Map to know-how/know-that disputes (below).                                                                                                                         |

  ---

  ### **Predictions for Each Condition**  
  Based on know-how (anti-intellectualism) vs. know-that (intellectualism) dynamics:

  | Condition               | Transfer Accuracy (16–30)                                 | Rule Articulation                                        | Newcomer Accuracy (31–35)                                | Why?                                                                                                                                 |
  |-------------------------|-----------------------------------------------------------|----------------------------------------------------------|----------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------|
  | **Rule Group (Control)**| High (~90-100%)                                           | High (clear, accurate rule)                              | High (rule easy to transmit)                             | Explicit rule (know-that) supports accurate application and teaching.                                                               |
  | **Practice Group (Control)** | High (~80–95%)                                        | Low/Medium (vague, incomplete rules)                     | Low/Medium (poor transmission)                           | Know-how from practice, but hard to articulate. Performance ≠ propositional knowledge.                                             |
  | **Verbal Secondary Task**   | • Rule Group: Low (e.g., 60–70%)<br>• Practice Group: High (e.g., 80–90%) | Unchanged                                           | • Rule Group: Low<br>• Practice Group: Medium           | Verbal task disrupts Rule Group’s reliance on propositional guidance. Practice Group’s know-how is less verbal, so less affected. |
  | **Motor Secondary Task**    | • Rule Group: High<br>• Practice Group: Low (e.g., 60–70%) | Unchanged                                           | • Rule Group: High<br>• Practice Group: Low              | Motor task disrupts Practice Group’s embodied know-how. Rule Group’s know-that is unaffected.                                      |

  **Expected Dissociation:** Practice Group will show high performance but poor articulation/teaching—illustrating know-how as non-propositional. Rule Group will show strong articulation/teaching but vulnerability to verbal interference—illustrating know-that as codifiable but context-dependent.

  ---

  ### **What Will Predictably Go Wrong (and Mitigations)**  
  1. **Rule too easy to state:**  
     - *Risk:* Practice Group articulates rule perfectly, muddying the know-how/know-that contrast.  
     - *Mitigation:* Use a moderately complex rule (e.g., "divisible by 3 or 5 but not both"). Test first with colleagues.  
  2. **Cheating/collusion:**  
     - *Risk:* Students share answers during training/transfer.  
     - *Mitigation:* Assign facilitators (you/TAs) to monitor trios. Enforce silence during individual tasks.  
  3. **Too few transfer items:**  
     - *Risk:* Low legibility (e.g., 70% vs. 80% accuracy indistinguishable).  
     - *Mitigation:* Use 15 transfer items (16–30) for reliable variance. Pre-test for ~75% baseline accuracy.  
  4. **Effects fail to appear:**  
     - *Risk:* No difference in transfer accuracy or secondary task effects.  
     - *Mitigation:* Frame "failures" philosophically (e.g., "Does this mean know-how is reducible?"). Use predictions to spark debate.  

  ---

  ### **Debrief: Mapping Results to Philosophical Cruxes**  
  Use a whiteboard to track results and map to live issues. Start with student observations, then introduce philosophy.  

  | Game Moment              | Philosophical Crux                                                                                                 | Debrief Question/Connection                                                                                                                               |
  |--------------------------|--------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Practice Group’s High Accuracy + Poor Articulation** | Is know-how reducible to know-that?                                                                                | *"They classified well but couldn’t explain the rule. Does this mean knowing-how isn’t just knowing-that? Or is the knowledge 'implicit'?"*                |
  | **Rule Group’s Strong Teaching** | Can know-how be transmitted by testimony alone?                                                                  | *"The Rule Group taught well with just a written rule. Does this prove all knowledge-that? What about skills like riding a bike?"*                         |
  | **Verital Task Disruption** | Does skillful action need propositional guidance?                                                               | *"Why did counting disrupt the Rule Group but not the Practice Group? Does this mean know-how doesn’t rely on verbal reasoning?"*                         |
  | **Poor Articulation ≠ Poor Performance** | Is failure to articulate = failure to know?                                                                    | *"When Practice Group couldn’t state the rule, did they *not know it*? Or did they know it non-propositionally (e.g., as an ability)?"*                   |
  | **Anti-Intellectualism Prediction** | Know-how as ability or relation to a way of doing                                                                | *"If know-how is an ability (e.g., Ryle), Practice Group’s high accuracy with low articulation fits. Ability ≠ stating propositions."*                    |
  | **Intellectualism Prediction** | Know-how as relation to a proposition                                                                           | *"If know-how is knowing-that (e.g., Stanley), Practice Group *did* know propositions—they just couldn’t access them for verbal report."*                |

  ---

  ### **What the Game Cannot Reproduce (and What You Must Supply)**  
  - **The Game’s Limitation:** It cannot resolve how intellectualists "absorb" the dissociation between high performance and poor articulation. The game shows a *dissociation*, but intellectualists argue this is due to "implicit" or "inaccessible" propositions, not non-propositional knowledge.  
  - **What You Must Supply:**  
    1. **Intellectualist Counter:** Explain that intellectualists (e.g., Stanley) would say the Practice Group *has* propositional knowledge—it’s just tacit (e.g., "They know *that* 3 is admissible because it’s divisible by 3, but can’t articulate the general rule").  
    2. **Anti-Intellectualist Defense:** Argue that know-how is an *ability* (Ryle) or *relation to ways of acting* (e.g., "The Practice Group isn’t guided by rules—they’re *acting skillfully*").  
    3. **Real-World Examples:** Contrast the game with embodied skills (e.g., riding a bike) where articulation is impossible without practice. Ask: "Could you learn to swim from a *book*? Why/why not?"  
    4. **Broader Implications:** Tie to epistemology (e.g., "If know-how isn’t know-that, does this mean AI can’t *truly* learn skills without embodiment?").

  ---

  **Final Tip:** Run a dry test with colleagues to refine the rule/timing. Embrace "messy" results—they fuel debate! By the end, students will have felt the dispute’s force without jargon, setting up deeper lectures.
