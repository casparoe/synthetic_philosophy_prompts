  - Cheating: students might talk. We need to enforce silence.

  - Transfer set too small: 15 items? But we have 15 for transfer. That should be enough.

  - Effects fail to appear: the Practice Group might not learn well with 15 items? Or the secondary tasks might not show an effect? 

  The game cannot reproduce:

  - A defender of the propositional view (intellectualism) might argue that the Practice Group does have propositional knowledge but it is implicit and that's why they can't articulate it. The game does not rule out that they have the proposition implicitly. 

  - Also, the intellectualist can say that the ability to perform is evidence of knowing the proposition, even if they can't state it. The game shows a dissociation between performance and articulation, but the intellectualist has a response: the knowledge is there but not accessible for verbal report.

  What you will have to supply:

  - The intellectualist response: that the Practice Group does have propositional knowledge but it is not easily articulated (due to being implicit, or due to the secondary task interfering with access). 

  - The anti-intellectualist might say that the Practice Group has a non-propositional ability.

  - Also, the game uses a rule that is propositional by design. In real life, many skills are not so easily captured by a proposition. You can discuss examples like riding a bike.

  Final rule: we'll go with the number rule: "admissible if divisible by 3 or by 5, but not by both."

