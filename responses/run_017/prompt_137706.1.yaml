answer: |-
  Here's how your "incomplete contract" frame plays out against Brexit and the Swiss case, using British English throughout and grappling with your core distinctions:

  **The Brexit Referendum as Incomplete Contract (2016-2020):**

  1.  **Parties & Initial Commitment:** The nominal parties were the UK electorate (principal) and the UK Government/Parliament (agent). The "contract" specified a binary choice: "Remain a member of the European Union" or "Leave the European Union". Crucially, it specified **what** (Leave) but not **how**, **when**, **on what terms**, or **what future relationship** would follow.
  2.  **Residual Control Rights & Their Shifting Locus:**
      *   **Immediate Aftermath (2016):** The Government (May) initially assumed it held primary residual rights to interpret and implement "Leave". This presumed a *mandate-preserving* implementation (trigger Art. 50, negotiate exit).
      *   **Miller Case (2017):** The Supreme Court ruled that triggering Article 50 (starting the formal exit process) required Parliamentary authorisation. This decisively shifted residual control rights over the *means of initiating implementation* to Parliament. The referendum result itself wasn't self-executing law.
      *   **2017 General Election:** Intended by May to secure a stronger mandate for *her* interpretation of Leave (hard Brexit/leaving Single Market & Customs Union). The result (hung Parliament) fragmented residual control rights further. The DUP gained outsized influence, and Parliament collectively asserted its rights more aggressively.
      *   **Withdrawal Agreement Votes (2018-2019):** Parliament repeatedly rejected May's deal, demonstrating it held residual control over *the specific terms of exit*. This stage became intensely *mandate-consuming*. Every vote – on the deal, on alternatives (Norway+, Customs Union, second referendum) – wasn't just about *implementing* the mandate but fundamentally *reinterpreting what "Leave" meant* in concrete terms. The initial vote result was reopened with each decision point.
      *   **2019 General Election:** Johnson explicitly framed this as a vote to "Get Brexit Done" *on his terms* (the revised Withdrawal Agreement). His landslide victory shifted residual control rights decisively back to the Government, granting it the power to interpret the mandate largely as it saw fit for the immediate exit phase and to marginalise Parliament's role in the final ratification.
      *   **Implementation:** The actual exit (31 Jan 2020) and the Trade and Cooperation Agreement were primarily driven by the Government's interpretation, ratified by Parliament under the new majority. The mandate was ultimately *consumed* by the specific choices made in the WA and TCA.
  3.  **Counterfactual-Stability Test:** Would the 2016 Leave coalition (a broad church of free-traders, protectionists, sovereignty maximalists, anti-immigration voters, protest voters) have accepted the actual outcome – the Withdrawal Agreement (including the Northern Ireland Protocol) and the relatively distant Free Trade Agreement – if shown it in advance? **Highly unlikely.** Significant factions (ERG, Farage) explicitly rejected May's similar deal and were lukewarm at best about Johnson's. The compromises on sovereignty (ECJ role in NIP), money (divorce bill), and free movement (replaced by points-based system, but not the dramatic cut many expected) were not what prominent Leave campaigners promised. The outcome satisfied a sufficient coalition to pass, but likely not the *original* winning coalition. The implementation failed the counterfactual-stability test for a substantial portion of the Leave vote.
  4.  **Value Added vs. Clever Relabelling:**
      *   **Adds Value:** The frame explains the *dynamic power struggle* that followed 2016 far better than simple "ambiguity". It highlights why the locus of decision-making (residual rights) was *the* central political battle, not just interpreting text. It clarifies why the initial vote *couldn't* settle things and why later elections (2017, 2019) were critical reallocations of those rights. The *mandate-consuming* nature of the Parliamentary phase explains the paralysis – each vote wasn't procedural, it was constitutive.
      *   **Relabelling:** The core observation that "leave meant many things" is indeed captured by "incomplete contract". However, the frame adds structure by focusing on *who gets to resolve* that incompleteness and *how costly* each resolution point is (preserving vs. consuming).

  **Contrast Case: Swiss "Against Mass Immigration" Initiative (2014)**

  1.  **The "Contract":** Significantly more complete. The initiative added binding constitutional text (Art. 121a):
      *   Switzerland must manage immigration independently via quotas and annual ceilings.
      *   No preferential treatment for EU citizens.
      *   Permits must prioritise Swiss workers.
      *   A transitional clause required implementation within 3 years without violating international treaties.
  2.  **Completeness vs. Residual Rights:** While vastly more detailed than "Leave", incompleteness remained:
      *   **Treaty Conflict:** The text clashed fundamentally with the EU-Swiss Free Movement of Persons Agreement (FMPA). *Residual rights* over resolving this conflict sat with:
          *   The Federal Council (Government): Tasked with negotiation.
          *   The Federal Assembly (Parliament): Tasked with drafting implementing legislation that respected *both* the new constitution *and* international law.
      *   **Implementing Legislation:** How exactly to set quotas, define ceilings, implement "Swiss first"? These details were left to Parliament, holding significant residual rights.
      *   **The "Without Violating Treaties" Clause:** This created a massive zone of residual interpretation. What if treaties *must* be violated to implement quotas? Who decides when that point is reached?
  3.  **Implementation as Relocated Incompleteness:**
      *   The Government negotiated a draft "Implementation Agreement" with the EU aiming for quotas compatible with FMPA (e.g., allowing "safeguard clauses" instead of hard ceilings). Parliament rejected this as insufficiently faithful to Art. 121a.
      *   Parliament then passed legislation in Dec 2016 ("Lex Koller") setting quotas. However, recognising this likely violated the FMPA, it included a clause *delaying implementation* until compatible solutions with the EU were found – effectively kicking the residual rights conflict down the road.
      *   **Outcome:** Implementation stalled. The core conflict (quotas vs. treaty) proved unresolvable within the constraints. The residual rights problem wasn't eliminated; it was relocated into:
          *   Ongoing treaty negotiations (still unresolved years later).
          *   Potential future initiatives (e.g., the 2020 "Limitation Initiative" which failed, seeking to end FMPA).
          *   De facto non-implementation of the quotas via parliamentary manoeuvring (the "implement later" clause).
  4.  **Conclusion:** Completeness of the initiative text *reduced* ambiguity about the *goal* (quotas) but *relocated* the residual rights problem into the far more complex arena of treaty conflict resolution and legislative drafting under contradictory constitutional/international obligations. The "contract" specified the destination but not how to navigate the roadblock. The mandate was formally *preserved* in the constitution, but its *substantive implementation* was (and is) *consumed* by the unresolved conflict.

  **Predictive Power & Conceptual Challenges:**

  *   **(a) What is a Second Referendum?**
      *   **Breach:** From the "Winners" perspective, it's a breach of the initial contract's outcome ("We won, implement it").
      *   **Renegotiation:** It can be framed as renegotiating the *terms* of the incomplete contract now that the implications are clearer. The principal (voters) is asked to approve a specific implementation plan derived from the initial mandate.
      *   **Contract Completion:** It could be seen as the final step in completing the contract – asking the principal to ratify the specific, concrete outcome negotiated by the agent, resolving the initial incompleteness. (This was a common Remain/Soft-Leave argument for a "Peoples Vote" on the *deal*).
      *   **In the Frame:** It's primarily **renegotiation** or an attempt at **completion**. It acknowledges the initial contract was too incomplete to bind the agent to a single, irreversible path without further principal approval once the details are known. It reflects a shift in residual rights *back* to the electorate on the specific package.

  *   **(b) The "Vox Populi" Objection & Your Frame's Response:**
      *   **The Objection (Strongest Version):** A referendum isn't a contract between principals and agents; it's the direct, unmediated exercise of the people's sovereign will (constituent power). It is an *instruction* or *command* that must be obeyed in its plain meaning ("Leave" means leave entirely, now, on maximalist terms). Interpretation by agents (govt/parliament/courts) is illegitimate usurpation; their role is purely technical execution. The result is self-justifying and brooks no counterfactuals ("Will of the People").
      *   **Can Your Frame Answer It?** Your frame **directly challenges this view** rather than assuming it away, by exposing its practical impossibility:
          *   **Incompleteness is Inevitable:** No binary referendum question can specify all implementation details for complex constitutional change. Execution *requires* interpretation and choice (e.g., What's the legal mechanism? What replaces existing frameworks? What transitional arrangements?).
          *   **Residual Rights are Unavoidable:** *Someone* must make those choices. The "vox populi" view pretends interpretation isn't happening or is purely mechanical. Your frame shows it's inherently political, and power over those choices (residual rights) is the core battleground *after* the vote.
          *   **Counterfactual Test Undermines Mandate Purity:** Showing that the actual outcome might not have secured the original majority directly challenges the idea that the initial instruction was clear and sufficient. It highlights the gap between the slogan and the substance.
          *   **The Frame's Defence:** It doesn't deny the sovereignty of the vote. It argues that in a representative democracy under the rule of law, implementing *any* complex popular instruction inevitably involves delegation, interpretation, and the exercise of residual decision-making rights by existing institutions. The "vox populi" view is a politically potent *rhetorical* claim used to monopolise those residual rights, but it doesn't reflect the messy reality of governance. Your frame explains *why* the shouting about "betrayal" happens – because different actors hold different views on who *should* hold those residual rights and how they *should* interpret the mandate.

  **Conclusion:** Your "incomplete contract" frame isn't just vocabulary. It provides a powerful lens for:
  1.  **Predicting Conflict:** It predicts intense struggles over *who* holds residual control rights after any vague referendum result. The less complete the contract, the more vicious and mandate-consuming the fight.
  2.  **Analysing Dynamics:** It explains why elections following referendums (like 2017 & 2019) are often critical reallocations of those rights, not just routine politics.
  3.  **Diagnosing Failure:** The counterfactual-stability test highlights implementation failure *even when* formal steps are followed.
  4.  **Understanding Limits:** It shows why even seemingly "complete" referendum texts (Swiss) relocate rather than eliminate incompleteness when they clash with complex realities like international law.
  5.  **Engaging Critics:** It provides a robust, practical rebuttal to the simplistic "vox populi" command theory by exposing the unavoidable role of interpretation and institutional power in execution.

  It doesn't magically resolve ambiguity, but it provides a far richer toolkit for understanding *how that ambiguity plays out in the real world of power and institutions* than the standard "binary collapse" critique alone. It turns "the mandate was ambiguous" into a dynamic analysis of who gets to resolve that ambiguity, with what consequences, and whether the result holds up under scrutiny.
