  We are creating a public-information leaflet for the "Bureau of Common Priors" (BCP). The tone is deadpan officialese. The leaflet should include:
   1. A short statement of purpose.
   2. A set of numbered clauses (like regulations).
   3. One worked example (e.g., neighbors disagreeing about river flooding or radiologists).
   4. A brief FAQ at the end.

   Key points to cover:
   - The prior is counterfactual: what you believed before any private evidence. This leads to absurd filing requirements (e.g., pre-incarnate or at-birth prior return).
   - The gap between common knowledge of posteriors and actual practice: repeatedly announcing posteriors converges in finitely many steps in theory, but assumes common knowledge of information partitions.
   - Harsanyi: differences in belief must be due to differences in information, not dispositions. So the Bureau must adjudicate what counts as evidence.
   - The common prior is unfalsifiable: any disagreement can be explained by exotic private information, so enforcement is either a rubber stamp or declaring one party irrational.
   - The no-betting result: shared prior plus common knowledge of rationality and voluntary trade rules out purely informational gains from trade. We can have a sibling agency voiding bets.

   Structure:

   I. Statement of Purpose:
      The Bureau of Common Priors (BCP) ensures that all citizens maintain a shared prior belief state, as required by the Rational Harmony Act. Disagreements that persist after information exchange are a compliance matter, indicating either improper prior alignment or failure to achieve common knowledge of posteriors.

   II. Regulations (numbered clauses, about 5-7):
      1. Definition of Common Prior: The shared prior is defined as the belief state of every citizen at the moment of birth (or upon naturalization, for new citizens), before acquiring any private evidence.
      2. Filing Requirement: Citizens must file a Prior Belief Return (Form PBR-1) within 30 days of birth. Guardians must submit on behalf of minors. The form requires a complete probability distribution over the state space. (Note: The state space is defined by the Universal State Space Index, maintained by the Bureau.)
      3. Evidence Adjudication: Private evidence must be verifiable and admissible under the Evidence Code. The Bureau will determine if differences in posterior beliefs are due solely to admissible evidence.
      4. Common Knowledge Protocol: When a disagreement arises, citizens must engage in the Common Knowledge Protocol (CKP): repeatedly exchange their current posterior beliefs until convergence (or until no further change occurs for two consecutive exchanges). This must be documented on Form CKP-2 and submitted within 14 days of the onset of disagreement.
      5. Compliance Review: If disagreement persists after CKP, the Bureau will conduct a Prior Alignment Audit to determine whether the parties shared a common prior and whether the CKP was correctly followed. Non-compliance may result in Rationality Re-education or, in severe cases, a declaration of Irrational Status (which voids certain legal capacities, e.g., entering contracts).
      6. No-Betting Clause: In accordance with the No-Trade Theorem, the Bureau of Common Priors works in conjunction with the Trade Compliance Authority (TCA) to void any bet or trade predicated on purely informational asymmetry. Such trades are deemed irrational and are subject to cancellation and fines.

   III. Worked Example: 
      Scenario: Two neighbors, Alice and Bob, disagree about whether the river will flood this spring. Alice assigns a probability of 0.8; Bob assigns 0.3. 
      Steps:
        - They engage in the CKP: 
            Round 1: Alice announces 0.8, Bob 0.3.
            Round 2: Alice, having heard Bob's 0.3, updates to 0.6 (if she considers Bob's information); Bob updates to 0.5. 
            Round 3: Both announce 0.55. 
            They stop after two consecutive agreements. 
        - But if they do not converge? Then they file Form CKP-2 and the BCP investigates. 
        - The Bureau finds that Alice had observed the river's water level (which was high) and Bob had reviewed the dam integrity report (which was strong). 
        - The Bureau must decide: are both pieces of evidence admissible? If so, the divergence in the initial round is explained. If one is inadmissible (e.g., Bob's report was from an unaccredited source), then Bob is non-compliant.

   IV. FAQ:
      Q1: What if I can't remember my prior beliefs at birth?
      A1: The prior is a theoretical construct. Citizens must reconstruct their priors using approved methods (e.g., the Harsanyi Reconstruction Algorithm). Failure to file a PBR-1 is punishable by fines.

      Q2: What if we disagree even after following the CKP?
      A2: Persistent disagreement indicates a prior misalignment or improper evidence. The Bureau will audit both parties' prior filings and evidence logs. One party may be found to have held an improper prior or to have used inadmissible evidence.

      Q3: How can the Bureau know what private information I have?
      A3: Citizens are required to maintain an Evidence Log (Form EL-3) for all private signals. The Bureau may request this log during an audit.

      Q4: Why can't people just have different opinions?
      A4: Under the Rational Harmony Act, differences in posterior beliefs must arise solely from differences in admissible evidence. Disagreement without evidential divergence is irrational and disrupts social harmony.

      Q5: What about bets made before the disagreement was resolved?
      A5: All bets contingent on events about which there is potential disagreement must be registered with the Trade Compliance Authority. If a CKP is initiated, the bet is suspended until the CKP concludes. If the bet was made without CKP and a disagreement arises, it is voidable.

   V. Final Reductio: 
      The last line should be a chillingly bureaucratic statement that underscores the unfalsifiability and the power it gives. 
      Example: "In cases of irreconcilable disagreement, the Bureau's determination of which party's evidence is admissible is final and not subject to appeal, as any appeal would itself constitute a disagreement requiring prior alignment verification, ad infinitum."

   Word count: We are aiming for 700 words. Let's write concisely.

