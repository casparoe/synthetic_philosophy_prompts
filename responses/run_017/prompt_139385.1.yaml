answer: |-
  **BUREAU OF COMMON PRIORS (BCP)**  
  **Public Compliance Leaflet RCH-7**  
  *Ensuring Rational Harmony Under the Shared Prior Act*

  ### Purpose
  The Bureau of Common Priors enforces Section 12 of the Rational Coherence Act, which mandates that all citizens share identical prior probabilistic beliefs over any factual proposition. Disagreements persisting after evidence exchange indicate non-compliance—either prior misalignment, improper evidence handling, or failure to achieve common knowledge of posteriors. This leaflet outlines compliance requirements, dispute protocols, and enforcement procedures.

  ---

  ### Regulatory Clauses (Per Directive 8.4.1α)  
  1. **Prior Registration**:  
     All citizens must file a **Prior Belief Return (Form PBR-1)** within 30 days of birth. Guardians must attest to the infant’s prior beliefs using state-space templates (Appendix Ω). Priors must be defined *before* any private evidence is acquired. Amendments require BCP approval and evidence of pre-informational consensus.  

  2. **Evidence Admissibility**:  
     Private signals must be verifiable, partition-refining, and logged in **Evidence Dockets (Form ED-4)**. Disagreements must trace solely to admissible evidence differences. Dispositional biases (e.g., "optimism/pessimism") are non-compliant.  

  3. **Common Knowledge Protocol (CKP)**:  
     If parties A and B disagree, they must:  
     - Exchange posteriors verbally/in writing (Round 1).  
     - Re-exchange updated posteriors (Round 2).  
     - Repeat until convergence (≤0.05 divergence) or two identical consecutive announcements.  
     *Note*: CKP assumes common knowledge of information partitions. Protocol void if partitions are misaligned (audit required).  

  4. **Dispute Escalation**:  
     Non-convergence after CKP triggers a **Prior Alignment Audit**. BCP agents will:  
     - Verify PBR-1 filings for both parties.  
     - Assess ED-4 logs for evidence admissibility.  
     - Reconstruct counterfactual priors using Harsanyi normalization.  

  5. **Sanctions**:  
     Non-compliance results in:  
     - **Rationality Re-education** (Levels I–III).  
     - **Irrationality Declaration** (voids contracts/votes).  
     - **Bet Annulment** (per No-Trade Compliance Bureau; see Clause 7).  

  6. **Evidence Burden**:  
     Unlogged or exotic private signals (e.g., "intuition," "gut feeling") are inadmissible. BCP reserves the right to assign exotic signals post-hoc to explain disagreements, pending audit.  

  7. **No-Betting Provision**:  
     Trades/bets predicated on informational asymmetry violate the No-Trade Theorem (NTT). The BCP’s sibling agency (**Trade Compliance Authority**) voids such contracts ex officio. Rational agents with common priors cannot "agree to bet."  

  ---

  ### Worked Example: Radiologists’ Dispute  
  **Parties**: Dr. A (posterior: 90% malignancy), Dr. B (posterior: 10% malignancy).  
  **CKP Execution**:  
  - Round 1: A announces 90%, B announces 10%.  
  - Round 2: A (updating on B’s signal) announces 70%; B (updating on A’s) announces 30%.  
  - Round 3: Both announce 50%. **CKP successful.**  

  **Non-Convergence Scenario**:  
  If Round 3 yields A: 60%, B: 40%:  
  1. Audit verifies PBR-1s (both radiologists filed identical priors: 50% malignancy).  
  2. ED-4 review: Dr. A cited "shadow irregularity" (admissible); Dr. B cited "machine calibration error" (inadmissible—unlogged).  
  3. **Ruling**: Dr. B’s evidence rejected. Dr. B undergoes Re-education (Level I) for dispositional bias.  

  ---

  ### Frequently Asked Questions  
  **Q1**: What if I forgot my infant prior?  
  **A1**: Reconstruct it using BCP’s *Harsanyi Reconstruction Toolkit* (Form HRT-5). "I don’t know" is non-compliant (§3.2.1).  

  **Q2**: Why did my neighbor’s "bird-omen" evidence count, but my "dream" did not?  
  **A2**: BCP assigns admissibility post-disagreement to ensure prior alignment. Per the Harsanyi Doctrine, *some* signal must explain your divergence.  

  **Q3**: The CKP worked, but I still *feel* he’s wrong.  
  **A3**: Feelings are evidentially inert. Post-convergence disagreement is self-refuting (Aumann’s Theorem). Seek Rationality Re-education.  

  **Q4**: What if the audit proves we never shared a prior?  
  **A4**: Impossible. The Common Prior Assumption is unfalsifiable by design. Non-convergence implies flawed evidence or irrationality—never prior divergence.  

  **Q5**: Can I appeal a sanction?  
  **A5**: Appeals require CKP with the BCP Auditor. Persistent disagreement voids the appeal (§9.1).  

  ---

  **Administrative Note**: The Bureau’s authority derives from the unfalsifiability of the common prior. In cases of irreconcilable dispute, the BCP’s determination of whose evidence is "exotic" and whose rationality is "defective" is final, binding, and recursively inarguable.  

  *Issued by the Bureau of Common Priors, Department of Epistemic Harmony.*  
  *Revision 7.3 | Non-compliance Reference: SPA §12.8*
