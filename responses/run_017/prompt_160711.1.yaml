prompt: |-
  hi — Im a science journalist working on an explainer about why the people who name species keep fighting about what a species even is, and before I start ringing up taxonomists I want the spec, not the scorecard. My flatmate is a birder and insists every split is a conspiracy by people who want more ticks on their list; a curator I had coffee with last week says the whole fight is about rank vs. taxon and that everyone past their PhD agrees more than the headlines suggest; and I came away more confused than when I went in. So: write me the desiderata. What does a species concept actually have to deliver to count as adequate, given a stated purpose — say, it has to be usable (a) by a working taxonomist holding a weird specimen and deciding whether it gets a new name, (b) by a regulator deciding whether a population is a unit that can be listed and protected, and (c) in the wierd modern case where all you have is a genome sequence reconstructed out of a bucket of seawater, no organism, no observed mating, no ecology, nothing but a bin of reads. For each requirement give the case behind it — the asexual rotifers, bacteria swapping genes sideways, the classic ring-species setups, two bird forms that hybridize freely in captivity but stay distinct where they overlap, cryptic lineages that look identical, fossil material where morphology is all you have, an engineered yeast strain that can no longer mate with its parent but sits nested inside it on the tree, and the conservation case where splitting one bird into two doubles the protection money. Say which demands are genuine desiderata and which are just the prejudices of one camp (I suspect 'must be a single real rank in nature' is one of those, but you tell me), which distinctions the concept is not allowed to collapse (species vs. speciation, how many vs. which, taxa vs. the rank, a slice of time vs. a lineage through time), and whether any subset of the requirements is jointly unsatisfiable — if the honest conclusion is that no single concept can do all three jobs above, say that plainly and say what pluralism then commits you to and whether it's an answer or a shrug. Also tell me which single requirement does the most work in knocking candidates out. Then, briefly, how the usual contenders do: the interbreeding criterion, the diagnosable-smallest-cluster / phylogenetic criterion, the ecological-niche criterion, and the general-lineage-style unified view people rally around now. Keep it under 900 words; a small table at the end for the scoring is fine but I want the weight on the criteria and their motivating cases, and I dont need paper titles or citations — I'll get those from the people I interview.
reasoning: |-
  Okay, the user is a science journalist working on an explainer about why defining a species is so contentious. They've heard conflicting opinions: their birder friend thinks species splits are just for checklist bragging rights, while a curator claims experts agree more than it seems. The user wants the core requirements for a species concept to handle real-world scenarios, not just academic debates. 

  First, I need to identify the key use cases they outlined: (1) taxonomists naming specimens, (2) regulators protecting populations, and (3) genomic-only data from environmental samples. Each has distinct needs: diagnosability for naming, conservation relevance for regulation, and conceptual flexibility for unknown organisms. 

  The tricky part is balancing conflicting demands. For example, diagnosability fails with cryptic species, while interbreeding breaks down with asexual organisms. I should highlight cases like rotifers (asexual), coral symbionts (horizontal gene transfer), and ring species (gradient vs. discrete units). The conservation angle is particularly fraught—splitting species can double funding but might not reflect biological reality. 

  I suspect the "single real rank" demand is indeed a red herring. Most modern biologists accept species as human-defined units. The real tension is between operational needs: regulators want clear boundaries, taxonomists need consistent characters, and genomicists require a definition untethered from observation. 

  No single concept satisfies all three jobs. The interbreeding concept fails for bacteria and fossils; phylogenetic concepts struggle with hybrids; ecological concepts need niche data that's often unavailable. Pluralism isn't a cop-out here—it's necessary. We might use different definitions contextually, but must clarify which we're using and why. 

  The knockout requirement seems to be diagnosability. If you can't consistently identify a group (like with ring species), it can't function for naming or regulation. Yet for marine metagenomics, diagnosability via sequences is all we have. 

  For the contenders: 
  - Interbreeding: Clean for birds but useless for rotifers. 
  - Phylogenetics: Great for DNA buckets, arbitrary for conservation units. 
  - Ecological: Vital for protection, unworkable for fossils. 
  General Lineage tries to unify these but becomes "evolutionary independence"—which then needs operational criteria anyway. 

  The table will summarize tradeoffs. Honest conclusion: pluralism with transparency. Admit when a definition serves one purpose but not others. The real fight isn't about truth—it's about which human need takes priority in a given context.
answer: |-
  Here’s a distilled breakdown of what a species concept *must* deliver across key use cases, the critical desiderata, irreconcilable tensions, and how major concepts perform.  

  **Core Desiderata (What a Concept MUST Deliver):**  
  1.  **Operational Diagnosability (For the Taxonomist with a Specimen):**  
      *   **Requirement:** Must provide clear, consistent criteria (morphology, genetics, behavior) to assign *this* specimen to *that* group.  
      *   **Motivating Cases:** Fossil material (only morphology exists), cryptic species (look identical but genetically distinct), hybridizing birds in sympatry (diagnostic traits persist despite gene flow).  
      *   **Non-Negotiable:** Cannot collapse "species" into "speciation process". You need to *identify* units *now*, not just theorize about future divergence.  

  2.  **Conservation/Regulatory Relevance (For the Regulator):**  
      *   **Requirement:** Must identify units whose protection/persistence has distinct ecological or evolutionary consequences.  
      *   **Motivating Cases:** Cryptic lineages (protecting one might not save the other if ecologically distinct), the "funding bird" (splitting may double resources for genuinely distinct ESUs - Evolutionary Significant Units), ring species (which ends of the ring get listed?).  
      *   **Non-Negotiable:** Cannot collapse "evolutionary lineage/potential" into just "diagnosable cluster". A diagnosable morph might be trivial; a distinct lineage might warrant protection even if hybrids occur.  

  3.  **Conceptual Applicability to All Life (For the Bucket of Seawater Reads):**  
      *   **Requirement:** Must be definable without observing mating, ecology, or even whole organisms. Must handle non-sexual reproduction and lateral gene transfer.  
      *   **Motivating Cases:** Asexual rotifers (no interbreeding), bacteria (rampant horizontal gene transfer blurring lineages), environmental DNA (eDNA) samples (only genome fragments exist, no organism).  
      *   **Non-Negotiable:** Cannot require observation of reproductive behavior or ecological function if the data is purely molecular.  

  **Key Distinctions a Concept MUST Respect:**  
  *   **Species Rank vs. Taxon:** The definition ("species") vs. the named group ("*Homo sapiens*").  
  *   **How Many vs. Which:** Counting units vs. diagnosing specific individuals/populations.  
  *   **Process (Speciation) vs. Product (Species):** Defining the endpoint unit vs. describing how it formed.  
  *   **Lineage Through Time vs. Temporal Slice:** Species usually imply continuity, but we often only see a snapshot.  

  **Common Prejudice (Not a Genuine Requirement):**  
  *   **"Must Be a Single, Natural Rank":** Insistence that "species" is a universally equivalent rank across all life forms (e.g., a bird species = a bacterial species in some fundamental biological sense). Most modern views see "species" as the *basic taxonomic rank* applied to *fundamental evolutionary lineages*, but the *degree* of divergence at that rank varies hugely.  

  **The Irreconcilable Tension & Pluralism:**  
  *   **The Knockout Requirement:** **Operational Diagnosability.** This is the hardest wall. Concepts strong on lineage/relevance (BSC, Ecological) often fail diagnosability in hard cases (fossils, asexuals, cryptic species). Concepts strong on diagnosability (PSC) can define units irrelevant to ecology or evolution (over-splitting minor variants).  
  *   **Joint Unsatisfiability:** **No single concept adequately fulfills all three desiderata simultaneously.** Diagnosability often clashes with broad conceptual applicability and conservation relevance.  
  *   **Pluralism is the Answer (Not a Shrug):** It acknowledges different questions need different tools. We use:  
      *   **Morphological/Phenetic concepts** for fossils/practical ID.  
      *   **Biological Species Concept (BSC)** for sexually reproducing groups where reproductive isolation *can* be assessed (birds, mammals).  
      *   **Phylogenetic Species Concept (PSC)** for diagnosable units (incl. eDNA, cryptic species).  
      *   **Evolutionary/General Lineage Concept** as the overarching theory (species = separately evolving metapopulation lineage).  
      *   **Ecological Species Concept (ESC)** for conservation units where niche distinctness is key.  
      *   **The commitment:** Transparency. Always state *which* concept/criteria you are using *and why* for a given purpose.  

  **How Major Concepts Perform Against Desiderata:**

  | Concept               | Diagnosability (Taxonomist) | Conservation Relevance (Regulator) | Applicability (eDNA/Bucket) | Major Weaknesses                                  |
  | :-------------------- | :--------------------------: | :--------------------------------: | :--------------------------: | :----------------------------------------------- |
  | **Biological (BSC)**  |             ❌              |                ✅▲                |              ❌              | Fails for asexuals, fossils, eDNA. Hybrid zones problematic. |
  | **Phylogenetic (PSC)** |             ✅✅             |                ❌▲                |             ✅✅             | Can over-split trivial variants. Relevance arbitrary? |
  | **Ecological (ESC)**  |             ❌▲             |                ✅✅                |              ❌              | Hard to define/measure niche. Fails for fossils/eDNA. Diagnosability weak. |
  | **General Lineage**   |             ❌▲             |                ✅▲                |             ✅▲             | Unified *theory* (species = evolving lineage), but **requires operational criteria** (morph, genes, ecology) for *delimitation*. |

  **(✅✅ = Strong, ✅▲ = Moderate/Adequate with effort, ❌ = Weak/Fails, ▲ = Depends heavily on operational criteria chosen)**

  **Conclusion:** The fights arise because different users (taxonomists, regulators, genomicists) *need* different things from the concept. No single definition perfectly serves all masters. The "General Lineage Concept" provides the best theoretical foundation (a species *is* an evolving lineage), but **operational delimitation** (drawing lines *between* lineages) still requires choosing criteria (morphology, monophyly, reproductive isolation, ecology) that inherently prioritize some desiderata over others, leading to conflict. The solution isn't finding the "right" concept, but using the *appropriate* concept for the task and being clear about it. Your curator is likely right about underlying agreement on the lineage idea; the fights are about *where to draw the practical lines* for specific purposes.
