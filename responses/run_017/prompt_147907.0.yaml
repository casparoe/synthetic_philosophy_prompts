prompt: |-
  I keep running into what looks like the same small argument in unrelated corners of philosophy, and I have not been able to find out whether the argument itself has a name, as opposed to its best-known application. I am hoping someone can identify the pattern, or tell me that it has no established name and help me define it properly.

  The first place I met it was a debate about whether truth ever outruns what can be established. Someone who wanted to deny that it does offered a concession that sounded modest: nothing in the relevant domain is of a kind that could not in principle be got at, so for anything true in the domain it is possible that someone should come to know it. The reply was: suppose some truth in the domain is not in fact known. Then the compound claim — that it is true and that it is not known — is itself true; but that compound cannot be known, because knowing it would involve knowing that it is not known, which is impossible if knowing something guarantees that it is so. So the concession, plus the existence of any unknown truth in the domain, is inconsistent: the modest principle turns out to entail that there are no unknown truths there at all.

  The second place was a paper on administrative data. The author claimed that every fact about a population is in principle recordable, and a commentator derived that every such fact is recorded. The derivation had exactly the same shape, with "recorded in the archive" in place of "known," on the assumptions that a record of a compound fact is a record of both of its parts and that only true things get recorded.

  The third place is really my own attempt. I tried the same move on a principle about justified belief rather than knowledge — every truth is such that someone could in principle be justified in believing it — and the derivation stalls, because being justified in believing something does not guarantee that it is true. That made me suspect that two features are load-bearing and that one of them is the guarantee. But I cannot get clear on whether those two are all that is needed, or on what else the argument quietly presupposes.

  So, four things I would like.

  One: does this pattern have a name of its own, or is it only ever named by its applications? I have the impression that the best-known label for it is tied to the first debate I mentioned, which would make it narrower than the thing I keep meeting. I also have a vague memory of a single word — something like "blind spot" — being used for the peculiar propositions the construction produces, but not for the argument that uses them, and I cannot place it. If there is a canonical name for the schema, does it come with a canonical statement of the minimal conditions on the operator?

  Two: how far does it generalize? I cannot settle three variants. (a) Relativize it to knowers: "for every truth there is someone who could know it," or the stronger "for every truth, anybody could know it." (b) Recast it temporally: "every truth is known at some time," or "could be known at some future time." (c) Weaken the target: "every truth is such that it could in principle be settled — someone could know it, or someone could know that it is false." Do all three still collapse, and if they collapse to different conclusions, what does the difference tell us about what is doing the work?

  Three: what is this pattern not? I would like it distinguished from (i) an ordinary modal collapse, of the sort where the mere possibility of a necessity yields the necessity outright; (ii) self-referential or diagonal arguments of the liar variety; (iii) limitative results such as the incompleteness of any sufficiently strong formal system; and (iv) the observation that it is odd to say, of some claim, that it is true and that one does not know it. My sense is that it sits nearest to the first and the second but is neither, and I want the difference stated exactly rather than gestured at.

  Four: the fixes. I have seen it proposed that the principle should simply not be allowed to apply to propositions that embed the operator inside themselves — that the quantifier should range over a narrower class. Is that kind of restriction regarded as principled or as ad hoc, does it have a name, and is it the same manoeuvre as refusing to allow a definition to quantify over a totality to which the thing defined belongs?

  I should say plainly that I am not after a label. I want to know what the phenomenon is, what its minimal ingredients are, where its edges lie, which of the neighbouring things it is and is not, and — if nothing established fits — a name and a definition I could use in print, with the boundary cases specified.
reasoning: |-
  Okay, the user is encountering a recurring argument in various philosophical contexts and wants to identify its core structure, name, and boundaries. Let me start by recalling the examples they provided: truth and knowledge, administrative records, and justified belief. The common thread is an operator (like "known" or "recorded") applied to propositions, leading to a collapse where a seemingly modest principle implies no unknown truths exist.

  First, I need to pin down the logical structure. The user mentioned that the argument fails with justified belief because it lacks factivity. That's a key clue. Factivity—where knowing P implies P is true—seems essential. The other component is the distribution over conjunction: knowing (P and Q) requires knowing both P and Q. So, the minimal ingredients are a factive operator that distributes over conjunction.

  The user’s examples all involve an operator O that is factive and conjunctively distributive. The argument then shows that if all truths are possibly O (or always O in some domains), and there's an unknown truth U, then the statement "U is true and not O" creates a contradiction. Because if O were applied to this statement, it would require knowing U (which is possible) but also knowing it's not known, which is impossible. Hence, the principle that all truths can be O implies all truths are O.

  Now, what's this called? I remember Fitch's Paradox or the Paradox of Knowability. That's tied to epistemology, but the structure is more general. The user is concerned that naming it after Fitch might be too narrow. They also mentioned "blind spot" for the propositions like "P and it's not known," which is from Roy Sorensen. But the argument pattern itself is Fitch's. However, the user wants a broader term. Maybe "omniscience collapse" or "verificationist collapse"? But those aren't standard. The formal structure is the "Knowability Paradox," even if applied beyond knowledge.

  Next, the user asks about generalizations. Relativizing to knowers: "for every truth, there's someone who could know it." The original Fitch argument uses existential quantification over knowers/times. The collapse still happens because the unknown truth leads to a statement that no one can know, as knowing it would require contradictory knowledge. Similarly, temporal versions: "every truth is known at some time." The issue is that the conjunction "U is true and never known" can't be known at any time without contradiction. So both variants still collapse.

  What about weakening to "settled" (known true or false)? Here, the operator isn't factive in the same way. If "settled" means knowing P or knowing not-P, then the statement "P and it's never settled" might avoid contradiction. If someone settles it, they either know P (making "never settled" false) or know not-P (making P false). So no contradiction. The user’s hunch is correct—factivity is crucial.

  Distinguishing from other concepts: Modal collapse (e.g., possible necessity implies necessity) relies on S5 axioms. Fitch's doesn't need modal logic beyond what's used. Liar paradox uses self-reference directly; Fitch's uses a contingent unknown truth, not necessarily self-referential. Incompleteness theorems are about formal systems' limitations, while Fitch's is about operator properties. The oddness of saying "P and I don't know it" is a Moorean paradox, related but distinct—Fitch's is a formal argument leading to contradiction.

  Fixes: Restricting the principle to propositions not embedding the operator. This is like type restrictions in Russell or Tarski. It's called "propositional quantification restriction." Is it principled? Some argue it's ad hoc; others see it as necessary to avoid paradox. It's similar to avoiding impredicativity, where definitions can't reference their own scope.

  The user wants a minimal definition. The core is a factive, conjunctively distributive operator leading to collapse when universal knowability is asserted. For a general name, "Fitch-style collapse" or "factive operator collapse" might work. Emphasizing the conditions: factivity, distribution over conjunction, and universal quantification over propositions. 

  The user’s deeper need is clarity for academic writing. They need a precise, defensible way to label this pattern beyond epistemology. Highlighting the logical structure and necessary conditions allows applying it to operators like "recorded" or "proven." Mentioning Roy Sorensen's "blind spot" for the propositions adds context. Addressing the generalizations shows where the argument fails (e.g., with justified belief), reinforcing the role of factivity. The distinctions help position their work within existing philosophical discussions without conflating concepts.
answer: |-
  This recurring argument pattern is indeed a distinct and well-recognized phenomenon in philosophical logic. Here's a breakdown addressing your four requests:

  ### 1. The Name and Core Pattern
  *   **Canonical Name:** The pattern is most famously known as **Fitch's Paradox** (or the **Paradox of Knowability**), named after Frederic Fitch's 1963 paper ("A Logical Analysis of Some Value Concepts"). While the name originates from epistemology, **the logical structure itself is more general**.
  *   **The Minimal Schema:** The argument targets principles of the form:  
      **∀p (p → ◊Kp)**  
      *("Every truth is knowable" or more generally, "Every truth is feasible for operator O")*  
      It shows this principle, combined with the existence of a single unknown truth (**∃p (p ∧ ¬Kp)**), leads to contradiction under specific conditions on the operator **K** (or **O**).
  *   **Core Conditions for Collapse:** The operator **K** must be:
      1.  **Factive:** **Kp → p** (Knowing p entails p is true; recording p entails p is true; proving p entails p is true).
      2.  **Distributive over Conjunction:** **K(p ∧ q) → (Kp ∧ Kq)** (Knowing a conjunction entails knowing each conjunct; a record of a conjunction entails records of each conjunct).
      3.  **Consistent:** **¬K(⊥)** (It's impossible to know a contradiction - a very weak, generally accepted assumption).
  *   **"Blind Spot":** You recall correctly. Roy Sorensen coined the term **"blind spot"** for propositions like **(p ∧ ¬Kp)** – truths that cannot be known (by the relevant agent/at the relevant time) *because* they assert their own unknowability. The *argument* using them to refute universal knowability is Fitch's Paradox.
  *   **General Name:** While "Fitch's Paradox" is the entrenched name, recognizing its generality, you could accurately call it the **Fitch-Church-Florensky Paradox** (acknowledging earlier, less noticed discoveries by Alonzo Church and Pavel Florensky) or descriptively label it the **Paradox of Feasibility for Factive Operators** or **Factive Omniscience Collapse**. In print, using "Fitch's Paradox" while explicitly generalizing the operator (**K** to **O**) is standard and acceptable.

  ### 2. Generalization and Variants
  The collapse relies critically on the factivity and distributivity of **K/O**. Here's how your variants fare:

  *   **(a) Relativized to Knowers:**
      *   **Weaker: ∀p (p → ∃x ◊Kₓp)** *("For every truth, there is someone who could know it")*  
          **Collapse Occurs:** The unknown truth **p** generates the blind spot proposition **p ∧ ¬∃x Kₓp**. Knowing *this* (**∃y K_y(p ∧ ¬∃x Kₓp)**) requires some **y** to know **p** (so **∃x Kₓp** is true) *and* know **¬∃x Kₓp** (which is now false). Contradiction via factivity and distributivity. The principle entails **¬∃p (p ∧ ¬∃x Kₓp)**, i.e., every truth is known by *someone*.
      *   **Stronger: ∀p (p → ∀x ◊Kₓp)** *("For every truth, anybody could know it")*  
          **Collapse Occurs (to a stronger conclusion):** The blind spot **p ∧ ¬Kₐp** (for a specific agent **a**) leads to contradiction if anyone, including **a**, could know it. Knowing it requires **Kₐp** (contradicting the conjunct **¬Kₐp**). The principle entails **∀p ∀x (p → Kₓp)**, i.e., *everyone* knows *every* truth (omniscience).
  *   **(b) Temporal Relativization:**
      *   **∃t Known: ∀p (p → ∃t Kₜp)** *("Every truth is known at some time")*  
          **Collapse Occurs:** Analogous to (a). The blind spot **p ∧ ∀t ¬Kₜp** ("p is true and *never* known") cannot be known at any time **t'** without contradiction (knowing it at **t'** would make **∀t ¬Kₜp** false, contradicting the known conjunction).
      *   **◊∃t Kₜp / ◊Future: ∀p (p → ◊∃t>now Kₜp)** *("Every truth could be known at some future time")*  
          **Collapse Occurs:** The blind spot **p ∧ ∀t>now ¬Kₜp** ("p is true and *never* known in the future") cannot be known *now* (it might be false later) or *later* (knowing it later would falsify **∀t>now ¬Kₜp**). Contradiction. Entails no truths are forever unknown in the future.
  *   **(c) Weakened Target (Settled): ∀p (p → ◊Sₚ)** *("Every truth is such that it could be settled - i.e., someone could know it true or know it false")*  
      **Collapse AVOIDED.** This is crucial. Let **Sₚ = Kp ∨ K¬p**. The blind spot would be **p ∧ ¬◊Sₚ** ("p is true and it's impossible to settle whether p"). However, knowing (or settling) **p ∧ ¬◊Sₚ** is *not* inherently contradictory:
      *   If you *knew* **p ∧ ¬◊Sₚ**, factivity gives you **p** and **¬◊Sₚ**. But **¬◊Sₚ** means it's impossible ever to know **p** or know **¬p**. Knowing **p** (which you just did!) directly contradicts **¬◊Kp** (a component of **¬◊Sₚ**). This *seems* like a contradiction...
      *   **The Escape:** The contradiction requires **K(p ∧ ¬◊Sₚ)** to entail **Kp**, which entails **◊Kp**, which contradicts the **¬◊Kp** component of **¬◊Sₚ** that you also know. **But:** **¬◊Sₚ** is equivalent to **□(¬Kp ∧ ¬K¬p)**. Knowing **□(¬Kp ∧ ¬K¬p)** does *not* entail **□¬Kp** is *false*; it entails **□¬Kp** is *true*! Knowing a necessary truth doesn't make it false. There's no contradiction between knowing **p** now and knowing that **Kp** is *impossible in the future* if **K** is not persistent. The operator **S** lacks the precise interaction properties needed for the Fitchian contradiction. The principle **∀p (p → ◊Sₚ)** *can* be true without implying **∀p (p → Sₚ)**.

  **What the Differences Show:** The critical load-bearing features are **factivity** and **distributivity over conjunction**. The collapse occurs when the operator guarantees truth (**Kp → p**) and decomposes conjunctions. Weakening the operator's factivity (like justified belief) or changing its structure (like settlement) breaks the contradiction. Relativization (to knowers/times) doesn't prevent collapse; it just changes the scope of the omniscience/convergence conclusion.

  ### 3. Distinguishing the Pattern
  *   **(i) Ordinary Modal Collapse (e.g., ◊□p → □p in S5):** Fitch's Paradox involves **quantification over propositions** and the **construction of a specific counterexample proposition** (the blind spot) leveraging the properties of the operator **K**. It's not just a pure modal inference rule applied to a single proposition; it's a diagonal argument *across* the domain of propositions. While modal axioms (like **T: □p → p**, reflecting factivity) are used, the core mechanism is propositional quantification and operator properties.
  *   **(ii) Liar/Self-Referential Paradoxes:** The blind spot proposition **p ∧ ¬Kp** is **not inherently self-referential**. **p** is an arbitrary unknown truth. The contradiction arises from the *logical properties* of **K** applied to *any* proposition of this form, not from **p** referring to itself or directly to **K**. It's a "diagonal" argument in the sense of constructing a proposition that "points to" its own relation to **K**, but it doesn't rely on syntactic self-reference like the Liar ("This sentence is false").
  *   **(iii) Limitative Results (e.g., Gödel's Incompleteness):** These demonstrate inherent limitations of formal *systems* (e.g., cannot prove their own consistency). Fitch's Paradox demonstrates a limitation of a *principle* (universal knowability/feasibility) when combined with uncontroversial operator properties and the existence of an unknown truth. It's a metaphysical/logical limitation concerning what *can* be known/recorded, not a limitation of a formal system's proof-theoretic power.
  *   **(iv) Moorean Paradox ("p but I don't believe it"):** This highlights a *pragmatic* oddity or psychological tension in *asserting* such propositions. Fitch's Paradox is a strict *logical* argument showing that a certain proposition (**p ∧ ¬Kp**) *cannot be known/true* (under the given principle and operator properties), leading to a formal contradiction. Moorean propositions are odd to *say*; Fitchian blind spots are *impossible to know*.

  **Key Difference Statement:** Fitch's Paradox is distinct from (i) because it requires propositional quantification and a constructed counterexample; from (ii) because it doesn't rely on syntactic self-reference but on operator properties applied to a proposition schema; from (iii) because it targets a philosophical principle, not a formal system's capabilities; and from (iv) because it demonstrates a logical contradiction, not mere pragmatic oddity.

  ### 4. The Fixes and Restrictions
  *   **The Restriction:** The proposed fix is to **restrict the universal quantification** in the knowability/feasibility principle **∀p (p → ◊Kp)** to propositions **p** that do **not contain the operator K (or O) itself**. So: **∀p (φ(p) ∧ ¬K-Embedded(p) → ◊Kp)**.
  *   **Name and Status:** This is often called the **"Restriction Strategy"** or **"Non-O-Embedding Restriction"**. Its status is **highly contentious**:
      *   **Principled?** Proponents (like Dorothy Edgington, Tim Williamson) argue it reflects the idea that statements *about* what can be known are fundamentally different ("higher-order") from statements *not* about knowledge. The knowability principle is intended for "basic" truths, not self-referential ones about knowledge itself.
      *   **Ad Hoc?** Critics (like W.D. Hart, Jonathan Kvanvig) argue it's *only* motivated by the desire to avoid Fitch's conclusion and lacks independent justification. Why *shouldn't* the principle apply to all truths, including those about knowledge? It seems suspiciously tailored to the paradox.
  *   **Analogy to Impredicativity:** This is **directly analogous** to the restriction in **Russell's Theory of Types** or **Tarski's Hierarchy of Languages** to avoid impredicativity. Impredicativity occurs when a definition quantifies over a totality including the object being defined (e.g., "the least upper bound of all upper bounds"). Similarly, the unrestricted knowability principle quantifies over *all* propositions, including the blind spot proposition which itself refers back to the knowability operator **K** defined by the principle. The restriction avoids this impredicative loop by excluding propositions embedding **K**. Whether this analogy makes the restriction *more* principled is debated.

  ### Minimal Definition for Use in Print
  Here is a precise, general definition capturing the phenomenon:

  **Fitch-Style Collapse:** A logical phenomenon wherein a principle asserting the universal feasibility (e.g., knowability, recordability, provability) of truths, formalized as **∀p (p → ◊Op)**, is shown to entail the unrealistic actuality **∀p (p → Op)** (e.g., universal knowledge, complete recording, actual proof), provided:
      1.  The operator **O** is *factive* (**Op → p**).
      2.  The operator **O** *distributes over conjunction* (**O(p ∧ q) → (Op ∧ Oq)**).
      3.  There exists at least one true proposition not currently **O** (**∃p (p ∧ ¬Op)**).

  The contradiction arises by applying the principle to a "blind spot" proposition **p ∧ ¬Op**, constructed from any such unknown truth **p**. This proposition cannot be **O** without violating factivity and distributivity. The collapse generalizes across domains (epistemology, information theory, formal systems) for any operator **O** satisfying conditions (1) and (2). It is distinct from purely modal collapse, syntactic self-reference, formal limitative theorems, and Moorean absurdity. Common responses include restricting the scope of the universal quantifier to propositions not embedding **O**, though the philosophical justification for this restriction remains debated.

  This definition isolates the core logical structure, specifies the necessary and sufficient conditions, mentions the key construction ("blind spot"), notes generality and distinctions, and acknowledges the main proposed fix and its controversy.
