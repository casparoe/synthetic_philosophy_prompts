  Unoccupied combinations:
    - Someone who is an Incommensurabilist (Leaf 9) but also an Inclusive Trader (Leaf 5): They think values are incommensurable but are willing to trade with an AI? That seems inconsistent. So probably unoccupied because incoherent.
