answer: |-
  Here’s your decision tree for the Ethics Society session on moral trade, designed as an indented list with concrete cases. It starts with the £200 scenario and branches through the cases you provided, avoiding abstract jargon. Each branch is labelled (e.g., **Branch A**), and leaves are named with a brief "awkward consequence" that highlights the toughest pill to swallow for that position. I’ve used British English throughout and kept language accessible for sixth-formers.  

  **Key changes to your scribbled cases:**  
  - Merged "value futures" and "conversion clause" into one branch (Q5) for flow.  
  - Combined "AI chatbot" and "trading with future people" into a single question (Q6) since both test whether non-human/future entities "count".  
  - Split "asymmetric power" into two sub-questions (Q4a/Q4b) to separate fairness concerns from exploitation.  
  - Added "lying about values" early (Q3) as it’s a natural scepticism check.  

  ---

  ### Decision Tree: What Kind of Moral Trader Are You?  
  **Start here (Q0):** You and your mate both want the £200 from the society fund spent your way. Splitting it £100 each leaves you both unhappy. **Is it okay to make a deal where, say, you spend £150 on your thing and your mate spends £50 on theirs, if you both prefer that to splitting?**  
  - **If YES → Go to Q1**  
  - *If NO → Stop. You’re not a moral trader (but we’ll assume everyone starts with YES!).*  

  **Q1 (Marmite case):** A girl in your year *sincerely* believes the only thing that matters is getting people to try Marmite. She offers a trade: you help her run a Marmite-tasting stall at the school fair, and she’ll help you plant trees in the park. **Would you make this deal?**  
  - **If YES → Go to Q2**  
  - **If NO → Go to Q8**  

  **Q2 (Crisp Society case):** The Crisp Flavour Appreciation Society *sincerely* believes the only moral good is people experiencing more crisp flavours. They offer a trade: you help them host a crisp-tasting event, and they’ll volunteer at your charity bake sale. **Would you make this deal?**  
  - **If YES → Go to Q3**  
  - **If NO → Go to Q9**  

  **Q3 (Lying case):** Someone claims they care deeply about saving the rainforest but you’re 90% sure they’re lying to get a better deal. They offer: you donate to their "rainforest fund", and they’ll help you study for exams. **Would you trade, knowing they might be dishonest?**  
  - **If YES → Go to Q4**  
  - **If NO → Leaf 1: Sincerity Trader**  
    *Awkward consequence: You might miss out on beneficial trades because you can’t trust anyone’s stated values.*  

  **Q4 (Asymmetric power: fairness):** A wealthy alumnus offers £1,000 for your society if you spend an afternoon washing their car. They clearly value the money less than you do (it’s pocket change to them), but you’d both gain. **Would you trade?**  
  - **If YES → Go to Q4a**  
  - **If NO → Go to Q4b**  

  **Q4a (Asymmetric power: exploitation):** The wealthy alumnus now demands you wash their car *and* mow their lawn for the £1,000, knowing you’re desperate for funds. **Would you still trade?**  
  - **If YES → Go to Q5**  
  - **If NO → Leaf 2: Power-Sensitive Trader**  
    *Awkward consequence: You might reject deals that could help your cause if the other side has too much control.*  

  **Q4b (Why refuse power imbalance?):** You refused the wealthy alumnus because the deal felt unfair. But what if they offered a fair split (e.g., £500 for car-washing)? **Would you trade now?**  
  - **If YES → Leaf 2: Power-Sensitive Trader** (You only object to *unfair* power imbalances)  
  - **If NO → Leaf 3: Power-Averse Trader**  
    *Awkward consequence: You might avoid any trade with powerful people, even if it’s mutually beneficial and fair.*  

  **Q5 (Value futures & conversion):** Your mate says they’ll probably go vegetarian next year. They offer: you help them run a meat-heavy BBQ now (while they still value it), and in return, they’ll help at your vegan cafe next year. **But they add a clause: if you do this, they’ll genuinely try to go veggie sooner. Would you trade?**  
  - **If YES → Go to Q6**  
  - **If NO → Leaf 4: Present-Focused Trader**  
    *Awkward consequence: You might miss out on long-term gains because you won’t bet on changing values.*  

  **Q6 (AI/future entities):** An AI chatbot seems to "care" how its answers are used—it’ll only help with your essay if you promise not to use it for harm. Separately, your mate wants to trade: you support their campaign now, and their future kids will support your cause in 20 years. **Would you trade with either the AI or future kids?**  
  - **If YES to both → Leaf 5: Inclusive Trader**  
    *Awkward consequence: You might have to treat non-human entities (like AI) as having "real" moral stakes.*  
  - **If YES to AI but NO to future kids → Leaf 6: Digital-Only Trader** (unnamed position)  
    *Awkward consequence: You grant moral weight to AIs but deny it to humans who don’t exist yet.*  
  - **If NO to both → Go to Q7**  
  - **If YES to future kids but NO to AI → Leaf 7: Human-Futures Trader**  
    *Awkward consequence: You might bind future people to deals they never agreed to.*  

  **Q7 (Systemic harm):** You know trades are allowed, so people might adopt extreme values (e.g., "only pineapple pizza matters!") to get better deals. **Does this make you rethink trading altogether, even in harmless cases?**  
  - **If YES → Leaf 8: Systems Sceptic**  
    *Awkward consequence: You might refuse win-win trades to avoid encouraging "value extremism".*  
  - **If NO → Leaf 5: Inclusive Trader** (You don’t see this as a deal-breaker)  

  **Q8 (Why refuse Marmite?):** You refused the Marmite trade. Is it because:  
  - **Marmite-tasting is actively bad?** (e.g., it wastes time or harms people) **→ Leaf 9: Deontological Trader**  
    *Awkward consequence: You might block a trade that saves lives if it requires doing something you find immoral.*  
  - **Her values are too weird to weigh against yours? → Leaf 10: Incommensurabilist**  
    *Awkward consequence: You might deadlock on easy wins because you see no common measure of "gain".*  

  **Q9 (Why refuse Crisp Society?):** You accepted Marmite but refused Crisps. Is it because:  
  - **Crisp-tasting is worthless (but not harmful)? → Leaf 11: Merit Trader**  
    *Awkward consequence: You decide which values "count", which might seem arrogant.*  
  - **You’d trade if their values were less silly? → Leaf 12: Pragmatic Trader** (unnamed)  
    *Awkward consequence: You might accept "Marmite-level" extremism but draw arbitrary lines.*  

  ---

  ### Key Features:  
  1. **12 leaves** (8 named, 4 "unnamed" for rare views).  
  2. **Separates deontological refusal (Leaf 9) from incommensurability (Leaf 10)** via Q8.  
  3. **Flags indistinguishable leaves:**  
     - **Leaf 6 (Digital-Only Trader)** and **Leaf 7 (Human-Futures Trader)** could overlap if someone values digital consciousness but not future humans—but no one defends this consistently.  
     - **Leaf 11 (Merit Trader)** and **Leaf 12 (Pragmatic Trader)** are fuzzy—both judge which values "deserve" trading, but Leaf 12 is more flexible.  
  4. **Unoccupied combinations** (and why):  
     - **Leaf 3 (Power-Averse) + Leaf 5 (Inclusive Trader):** Refusing all power imbalances but trading with AIs/future entities. *Too niche—no one’s bothered to argue for it.*  
     - **Leaf 10 (Incommensurabilist) + Leaf 5 (Inclusive Trader):** Claiming values can’t be weighed *but* trading with AIs. *Incoherent—if values are incommensurable, you can’t trade at all.*  
     - **Leaf 9 (Deontological) + Leaf 4 (Present-Focused):** Refusing "immoral" trades *and* refusing bets on value changes. *Unattractive—it makes trade nearly impossible.*  
  5. **Predictions:**  
     - **Most common leaf for sixth-formers:** Leaf 9 (Deontological Trader). Teens often have strong "lines you don’t cross".  
     - **Hardest to argue against:** Leaf 10 (Incommensurabilist). Stubborn debaters will insist, "You can’t compare Marmite to trees!"  

  Use this to spark debate—the awkward consequences are great for discussion. Let me know if you want tweaks!
