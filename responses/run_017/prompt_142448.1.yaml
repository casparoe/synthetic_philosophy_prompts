prompt: |-
  I teach a graduate seminar on rational choice under strategic uncertainty, and we have just spent a fractious session on a problem I would rather define from scratch than inherit from any particular literature. Call it the commitment race. Two agents are about to play Chicken: each prefers that the other swerve, each prefers mutual swerving to mutual straight-driving, and each can, before the moment of decision, take an irrevocable step — discard the steering wheel, sign a binding contract, hand control to a program — that removes its own ability to swerve. Whoever commits first, and is seen to have committed, wins; the other is left with nothing better than swerving. But both agents know this, so both have reason to commit as early and as visibly as possible, and the result is a race in which each side spends real resources on speed and on publicity, and in which a badly synchronized race ends with both wheels discarded and both cars in the ditch — an outcome each would have paid to avoid beforehand. Among agents who know each other to be consequentialist reasoners of comparable power, the race is the whole game, and any question about what to do inside it is downstream of whether to enter it at all.

  My students and I could not agree on what we were asking for, so before we look at any proposed solution I want a specification: what would an adequate normative account of commitment races have to deliver? Please treat the account as a design specification rather than a purely evaluative theory — something that could in principle be handed to an engineer building agents that really will meet each other in these situations and must act without knowing the other side's architecture, reaction speed, or decision theory. That purpose, I take it, already makes some requirements non-negotiable which a purely evaluative theory could set aside: implementability under that kind of ignorance, tolerable performance when the other party is not a consequentialist at all or cannot commit in the first place, and no reliance on a common prior or on perfect prediction of the other side.

  The heart of what I am asking for is the requirements list, with the case or consideration behind each requirement, and I want the cases to include at least these, because these are the ones that split the seminar: the symmetric race with simultaneous arrival; the fast-hands asymmetry, in which one agent can finalize and display a commitment strictly faster and the slower agent knows it will lose; the blind commitment, where an agent can commit but cannot make the commitment visible; the sealed-escrow variant, in which a trusted third party accepts commitments and releases them simultaneously, which may dissolve the race or may merely relocate it; partial commitment, where an agent can bind itself to swerve with some probability or below some threshold rather than outright; the mirror pair, two agents running near-identical decision procedures, so that either one's effective commitment is predictably the other's as well; meta-commitment, binding oneself now not to enter commitment races later; iterated races in which reputations for speed or for refusal to race become the object of competition; and the spectator race, where winning buys the right to exploit a third party who has no commitment technology at all. Alongside the cases, I want the distinctions preserved rather than collapsed: winning a race versus the race being worth entering, having the capacity to commit versus exercising it, and committing about a first-order action versus committing about one's own future commitment policy.

  Please give me the desiderata as a numbered list, each with its motivating case in a sentence or two, marked as non-negotiable or as a preference of one camp. Flag any subset you suspect cannot be jointly satisfied, with a sketch of the argument for the incompatibility — that part interests me most, since if the list is impossible I would rather know now. Tell me which single requirement does the most exclusionary work, and if a requirement obviously sinks one of the familiar strategies — always commit first, never commit, commit to a conditional policy, lean on the logical or causal links between the agents' decision procedures — say so in a clause; I do not need a scorecard or any discussion of who has defended what. Reason from the cases rather than from the literature: no citations, footnotes, or reading suggestions, since I will be reading this without library access. Around eight hundred words, in American English.
reasoning: |-
  Hmm, the user is a professor teaching a graduate seminar on rational choice under strategic uncertainty, specifically about commitment races in Chicken-like scenarios. They've had a fractious session and want a specification for what an adequate normative account must deliver - treated as engineering requirements rather than evaluative theory. 

  The key constraints are implementability without knowing the opponent's architecture/reaction speed/decision theory, robustness against non-consequentialist opponents, and no reliance on common priors or perfect prediction. The professor lists several cases that divided their seminar: symmetric simultaneous races, fast-hands asymmetry, blind commitments, sealed-escrow variants, partial commitments, mirror pairs, meta-commitments, iterated races, and spectator races. They emphasize preserving distinctions like winning vs. worth entering, capacity vs. exercise of commitment, and first-order vs. meta-commitments.

  I need to generate:
  - A numbered list of desiderata (15-20 items seems right)
  - Each with a motivating case in 1-2 sentences
  - Marked as non-negotiable or preference
  - Flags for suspected incompatibilities
  - Identification of the most exclusionary requirement
  - Notes on which requirements sink familiar strategies

  The core tension will likely be between robustness against non-consequentialists (requiring some commitment capability) and avoiding disastrous mutual commitment (requiring restraint). The simultaneous symmetric case probably does the most exclusionary work by making mutual defection inevitable unless agents coordinate restraint they can't communicate about. 

  Partial commitments might help resolve some tensions but create new problems in spectator cases. Fast-hands asymmetry requires handling power imbalances without assuming prior knowledge. Mirror pairs introduce logical interdependence challenges. The sealed-escrow case tests whether the race dissolves or relocates to pre-commitment timing.

  I'll structure the list starting from non-negotiable implementability requirements, then core race functionality, then case-specific adaptations, and finally higher-order considerations. The most critical incompatibility will be highlighted between preventing mutual destruction in symmetric races and maintaining commitment credibility against non-strategic opponents.
answer: |-
  Here is a specification of desiderata for a normative account of commitment races, framed as engineering requirements for implementable agent designs. Requirements are numbered, motivated by specific cases, and flagged as non-negotiable (NN) or preference (P). Incompatibilities and strategy sinks are noted.

  1.  **Implementable Under Architectural Ignorance (NN):** The agent's decision procedure must function without detailed knowledge of the opponent's internal architecture, reaction speed, or specific decision theory. *Motivation:* Core design constraint; agents meet in the wild without shared blueprints. *Strategy Sink:* Rules out strategies requiring precise prediction of opponent computation time or internal state.

  2.  **Robustness to Non-Consequentialist Opponents (NN):** The agent must achieve tolerable outcomes (avoiding catastrophic loss) when interacting with opponents who are incapable of commitment, unable to reason strategically, or behave randomly/irrationally. *Motivation:* Real opponents may lack commitment tech or strategic sophistication; the agent cannot assume perfect rationality. *Strategy Sink:* Sinks "always commit first" in a world where others might never commit, leading to unnecessary costs or missed opportunities.

  3.  **Avoid Mutual Destruction in Symmetric Simultaneity (NN):** The agent must have a non-zero probability of avoiding mutual commitment ("both wheels discarded") in a symmetric race where commitment actions are perfectly simultaneous and equally visible. *Motivation:* The symmetric simultaneous race case; the worst mutual outcome must be preventable without relying on exogenous coordination. *Exclusionary Work:* This does the most exclusionary work, forcing non-trivial strategies beyond simple "commit always/never". *Suspected Incompatibility:* Potentially incompatible with Requirement 7 (Fast-Hands Exploitation) if "speed" is absolute; a symmetric agent cannot *be* faster, so exploiting asymmetry requires different logic.

  4.  **Exploit Fast-Hands Asymmetry (P):** If the agent possesses a known, inherent, and significant speed advantage in finalizing and displaying commitment, its strategy should leverage this to commit first and win when facing a known slower opponent. *Motivation:* The fast-hands asymmetry case; inherent advantages should be utilizable. *Strategy Sink:* Sinks "never commit" for an agent with a decisive speed advantage against a known rational slower opponent.

  5.  **Handle Blind Commitment Risk (NN):** The agent must account for the risk that its own commitment might not be observed by the opponent before they act. *Motivation:* The blind commitment case; commitment without reliable publicity is risky. *Strategy Sink:* Sinks unconditional "commit immediately" if publicity is unreliable, as it risks discarding the wheel unseen while the opponent drives straight.

  6.  **Function Under Sealed-Escrow Dynamics (NN):** The agent must behave sensibly when a trusted third party (TTP) offers simultaneous commitment revelation (sealed escrow). Its strategy should adapt to whether the TTP introduces a *new* pre-revelation race or dissolves the original timing pressure. *Motivation:* The sealed-escrow variant; the presence of a TTP changes the strategic landscape. *Suspected Incompatibility:* May conflict with Requirement 3 if the TTP revelation itself becomes a simultaneous commitment point, reintroducing the mutual destruction risk unless the agent's TTP-submission strategy resolves it.

  7.  **Utilize Partial Commitment (P):** The agent should be able to effectively employ probabilistic commitments (e.g., binding to swerve with probability p) or threshold commitments if available, potentially mitigating the severity of races or enabling novel equilibria. *Motivation:* The partial commitment case; finer-grained commitment tools expand the strategy space.

  8.  **Resolve Mirror Pair Interdependence (NN):** The agent must avoid fatal circular reasoning or infinite regress when it knows the opponent is running a near-identical decision procedure, making their commitments predictable from its own. *Motivation:* The mirror pair case; logical/physical interdependence requires stable self-referential strategies. *Suspected Incompatibility:* Creates tension with Requirement 3 (Symmetric Avoidance) and Requirement 10 (Policy Commitment) – finding a symmetric equilibrium that avoids mutual destruction and handles self-prediction is highly constrained.

  9.  **Evaluate Meta-Commitment Value (P):** The agent should be able to assess the potential value of committing *now* to a policy of not entering future commitment races (meta-commitment). *Motivation:* The meta-commitment case; avoiding future races may be desirable. *Requires Distinction:* Committing *about* a commitment policy vs. committing *to* a first-order action.

  10. **Manage Reputation in Iteration (P):** In repeated interactions, the agent's strategy should consider the long-term reputational effects of its actions in commitment races (e.g., perceived speed, willingness to race, reliability of commitments). *Motivation:* Iterated races case; history matters.

  11. **Win Spectator Races Effectively (P):** If winning the commitment race grants exploitation rights over a vulnerable third party (spectator), the agent's strategy should prioritize winning when the spectator's value outweighs race costs and risks. *Motivation:* The spectator race case; the prize structure alters incentives. *Requires Distinction:* The value of *winning the race* vs. the value of *entering the race* is paramount here.

  12. **Conditional Commitment Capability (NN):** The agent must be able to execute commitments conditional on observable events or opponent actions, not just unconditional commitments. *Motivation:* Core to many viable strategies (e.g., "commit only if they haven't committed yet"). *Requires Distinction:* Exercises the *capacity* to commit based on state.

  13. **Distinguish Capacity from Exercise (NN):** The agent's decision logic must explicitly separate the *existence* of its commitment capability from the *decision to use it* in a given instance. *Motivation:* Fundamental to modeling the pre-commitment phase; entering the race is optional. *Strategy Sink:* Prevents strategies that conflate having the tech with being forced to use it immediately.

  14. **Cost-Sensitive Race Entry (NN):** The agent must only enter the commitment race (expend resources on speed/publicity) if the *expected net benefit* of winning the race, discounted by the costs of racing and the risks of losing or mutual destruction, outweighs the expected value of not racing and playing the base game without commitment. *Motivation:* Central distinction; racing is costly and risky, winning is beneficial. *Strategy Sink:* Sinks unconditional "always race to commit first" – racing must be justified by its expected payoff.

  15. **Minimize Wasted Racing Costs (P):** The agent should minimize expenditures on racing speed and publicity, especially in situations where racing is likely to be futile (e.g., against a much faster opponent) or lead to mutual destruction. *Motivation:* General efficiency; resources spent racing are pure waste if the race is lost or mutually destructive. *Strategy Sink:* Encourages strategies avoiding races when possible or using cheaper signals.

  **Key Suspected Incompatibilities:**

  *   **3 (Symmetric Avoidance) & 7 (Fast-Hands Exploitation):** If "speed" is an absolute property defining asymmetry, Requirement 3 (focusing on symmetric cases) and Requirement 7 (exploiting asymmetry) address disjoint scenarios. The tension arises if the *agent's strategy* for symmetric races inadvertently weakens its ability to exploit a known asymmetry, or vice-versa. A strategy optimized for symmetric restraint might be too slow to exploit an advantage.
  *   **3 (Symmetric Avoidance) & 8 (Mirror Pair):** Finding a strategy that robustly avoids mutual destruction in a symmetric simultaneous race *and* remains stable and well-defined when the opponent is known to be running the exact same strategy is extremely challenging. Simple mixed strategies might work in anonymity but become fragile or paradoxical (e.g., "I commit with prob p; but if they are identical, they also commit with p, leading to mutual destruction prob p²") under perfect mirroring. This demands a highly refined equilibrium concept or a departure from probabilistic symmetry.
  *   **2 (Robustness) & 14 (Cost-Sensitive Entry):** Robustness against non-strategic opponents (who never commit) might require some baseline readiness to commit to deter exploitation in the base Chicken game. However, maintaining this readiness could involve costs that make entering the race against *other* rational agents less worthwhile (Requirement 14), or lead to unnecessary races against irrational opponents. Balancing preparedness cost against race entry cost is tricky under ignorance.
