  We are constrained by:
  - 90 minutes total
  - 14-18 participants (software engineers, mixed levels, some hostile to soft-skills, some non-native English speakers)
  - No philosophy background
  - Avoid jargon until after the experience
  - Mechanism: split room, same rule, different training examples, then classify probe items to show boundary shift due to examples
  - Also include: one-shot category learning (with a twist) and a ladder of letter-string analogies
  - Scoring with points that reward calibrated confidence

  Brainstorming three candidate mechanisms (including the one provided):

  1. **The Provided Mechanism (Rule + Examples Split):** 
     - Split the room into two groups (Group A and Group B). Both get the same rule for a made-up category (e.g., "Bloxes"). Each group gets a different set of 3-4 training examples. Then, both groups classify the same set of 8-9 probe items. Some probes are ambiguous, some conflict with the rule, and one late probe reframes the category.
     - Why it's good: Directly demonstrates how examples shape the application of a rule. The group split creates a visible disagreement that can be debriefed.
     - Risk: Might be too abstract if the category is arbitrary. Also, if the rule is too clear, the effect might be weak.

  2. **One-Shot Category with Bait-and-Switch:**
     - Show everyone one instance of a made-up category (e.g., a "Glimwacket"). Ask them to write down what else counts and stake points on their confidence. Then reveal a second instance that breaks their inferred essence. Then debrief.
     - Why it's good: Very personal and immediate. Everyone experiences the shift.
     - Risk: Might be too simple and not show the cumulative effect of multiple examples.

  3. **Analogy Ladder with Competing Interpretations:**
     - Present a series of letter-string analogies (e.g., "abc -> abd, ijk -> ?"). The first few are obvious, but then introduce one that has two plausible answers under different framings (e.g., "ijk" could become "ijd" by changing last letter or "ijl" by incrementing). Force them to choose and then reveal the trap.
     - Why it's good: Engineers might relate to puzzles. It directly shows how a different framing leads to a different answer.
     - Risk: Might feel like a puzzle game and not connect to real-world categorization.

  **Choice:** We'll use the **Provided Mechanism** as the core because it directly addresses the strong claim about categorization being based on retrieved examples. We'll integrate the one-shot and ladder as shorter exercises within the same session to reinforce the point from different angles.

