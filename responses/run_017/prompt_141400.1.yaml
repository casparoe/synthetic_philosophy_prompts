  ### Brainstorming (400 words)
  Three candidate mechanisms for demonstrating analogy-based categorization:
  1. **Rule + Examples Split (as proposed)**: Groups receive identical rules but different training examples, then classify ambiguous probes. *Strengths*: Directly shows how examples distort rule application; group disagreement makes bias visible. *Risks*: Relies on carefully engineered probes; rule ambiguity might feel contrived.  
  2. **One-Shot Category Expansion**: Participants infer rules from a single example, then encounter a counterexample. *Strengths*: Personal, visceral experience of essence slippage. *Risks*: Less explicit connection to workplace decisions; may oversimplify.  
  3. **Analogical Chain Reactions**: Participants build categories via chained analogies (e.g., "Service A is like Service B, so..."). *Strengths*: Mirrors engineering design discussions. *Risks*: Hard to control; requires high engagement.  

  **Choice**: Rule + Examples Split.  
  **Why**: Maximizes demonstrable disagreement (proving the strong claim via group conflict), scales to 18 people, and mirrors real engineering tasks (e.g., interpreting RFCs).  
  **Giving up**: The intimate "aha" of personal essence betrayal (compensated by adding the one-shot as a primer).  

  **Weak Claim Honesty**: The activity shows categorization is example-driven, not rule-bound. It *cannot* prove all concepts are analogical reconstructions (that requires cognitive science evidence). I supply this gap in debrief with: *"Hofstadter argues this happens for every concept—even 'chair'—but today we only proved it for ambiguous rules."*  

  **Adjustments for 90min/18ppl**:  
  - Cut analogy ladder (time-intensive; one-shot covers similar ground).  
  - Use subgroups (3-4 per team) for efficiency.  
  - Strict timeboxing for phases.  

