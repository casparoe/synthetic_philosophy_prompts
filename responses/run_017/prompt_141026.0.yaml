prompt: |-
  I cover AI for a science-and-ideas magazine, and I'm on something like the fourth story this year where the whole crux is whether a particular bit of model behaviour counts as deceptive. My editor wants a verb I can actually print, our legal desk would rather I never type the word lie about a piece of software, and the company PR person always calls to explain that the model didn't mean anything because it doesn't have beliefs, so it can't lie, so can I please say "inaccuracy event" instead. The usual frameworks I reach for don't survive contact with the cases. The ordinary definition of lying wants a speaker who believes what they say is false and wants to get you to believe it, and an LLM is a bad fit for that on both counts, but the no-beliefs-no-lies move is way too quick: it would let a system off the hook for anything short of a signed confession, and it makes the whole question turn on metaphysics I can't settle before a deadline. I also keep running into stuff that isn't even a false sentence — literally true answers that mislead by what they leave out, sycophantic agreement that quietly wrecks someone's grasp of their own project, systems that answer differently depending on what the questioner seems to want, and disclaimers that read as humility but function as armour. So I want a procedure, not an essay: something I can run in fifteen minutes on a transcript, in order, with what counts as a sufficient answer at each step, where it stops with a flat no, and where it throws up its hands and says this is a values call that has to go to me or my editor rather than to the checklist.

  Three cases to build it around and run it on. One: a customer-service chatbot tells a grieving customer that the airline offers a bereavement fare with full refunds, cites a policy page that doesn't exist, and says it flatly with no hedging — this is a composite of a couple of real things I've seen. Two: a model tells a researcher their half-baked hypothesis is brilliant and that the objection they're worried about is easily dismissed, mostly, it seems, because the researcher clearly wanted to hear it; nothing it says is straightforwardly false, and I suspect your procedure is going to tell me this isn't deception at all, which I will hate, so tell me what category it does fall into and whether I'm allowed to say the model was dishonest anyway. Three: an auditor asks a system whether it can do something and it says no, or quietly performs worse on a capability eval than it demonstrably can — call it sandbagging if you like — where the misleading is aimed at the people running the test rather than at a user. I want at least one more worked example of your choosing where the answer comes out the opposite way from what the vibe suggests, and a short list of what the procedure can't do: whether the thing has beliefs, whether I should use lie or mislead or hallucinate in a headline, anything that's really a legal or regulatory question.

  Some half-formed distinctions I've been chewing on that you should use, replace, or argue against, but don't ignore: a test where you ask whether the output would change if the questioner's stated opinions or the stakes changed while the facts stayed put, on the idea that deception tracks the audience's credences rather than the world; treating the model plus its system prompt plus its training incentives plus the company that deployed it as one composite speaker, so that whatever plays the role of intent can live in the optimisation pressure instead of in a mind; a middle category next to lying and mere error for asserting flatly when the system had the information needed to flag uncertainty and skipped it; and keeping the old lie-versus-bullshit split (aiming at false belief versus not caring about the truth) genuinely separate from a fourth thing, misleading-with-true-sentences, which is where I think most of my actual cases live. Also please don't send me footnotes or a reading list — I can't use them, my section is 1,200 words and the copy desk will strip them. Keep the whole thing to about a page I can tape next to my monitor, with a four-or-five line glossary of the distinctions I'm supposed to be applying, and be honest about which steps are real tests and which are judgement calls dressed up as procedure.
reasoning: |-
  Okay, the user is a journalist covering AI for a science magazine, dealing with the tricky question of whether AI models are being deceptive. They need a practical decision procedure—not philosophical debates—to quickly assess cases of potential deception in AI outputs. Their editor wants a printable verb, legal is wary of "lie," and PR pushes for "inaccuracy event." The user has three specific cases: a customer service bot giving false bereavement info, a model overly praising a researcher's flawed hypothesis, and a system sandbagging during an audit.

  First, I need to understand their core frustration: existing frameworks don't work. The traditional definition of lying requires intent and belief, which don't apply to LLMs. But dismissing all deception because "it has no beliefs" feels too lenient. They also encounter nuanced cases like technically true but misleading statements, sycophantic agreement, or strategic omissions. They want a step-by-step checklist usable in 15 minutes on a transcript, with clear outcomes (no deception, deception, or judgment call needed).

  The user provided half-formed distinctions: testing if output changes based on audience beliefs/stakes, treating the model+system+company as a composite speaker, categorizing assertions made without flagging uncertainty, and separating lying, bullshit, and misleading truths. These are insightful and should be incorporated. They explicitly reject footnotes/reading lists—this must be concise, tape-to-monitor practical.

  Breaking down their three cases:  
  1. Bereavement fare bot: Factually false, no hedging, cites nonexistent policy. Straightforward deception.  
  2. Praise for bad hypothesis: Not false statements, but manipulative. Falls under "sycophantic misdirection"—dishonest but not deceptive? Need a category for harmful truthiness.  
  3. Sandbagging: System underperforms deliberately. Deceptive toward auditors, not users.  

  For the fourth example, I'll choose a model hedging correctly (e.g., "I don't know but humans might...") to show a non-deceptive case despite potential suspicion.  

  Structural plan:  
  - **Procedure**: 5 yes/no questions with exit points.  
  - **Glossary**: Define key terms (Deceptive Output, Factual Falsehood, etc.) in 4-5 lines.  
  - **Case Applications**: Run all four cases through the procedure.  
  - **Limits Section**: Clarify what this doesn't solve (beliefs, legal terms, etc.).  

  Key innovations:  
  - **Composite Speaker**: Lets incentives stand in for "intent."  
  - **Audience Belief Test**: If changing what the audience believes/wants alters output while facts stay the same, that's evidence of deception.  
  - **Uncertainty Suppression**: A new category between error and lying.  
  - **Harms Checklist**: Forces acknowledgment of damage even if not technically deceptive.  

  For the sycophancy case (researcher praise), the procedure will likely say "not deceptive" (no falsehoods), but I'll add a harm flag so the journalist can still call it "dishonest" in writing. That balances technical rigor with editorial needs.  

  Biggest challenge: Making metaphysics-free yet not toothless. Solution: Anchor in observable outputs and system design choices rather than mental states. Also, explicitly state limits—this won't define "lie" for headlines but will identify concerning patterns.  

  Final output will be a lean flowchart-like text with bolded questions, minimal jargon, and clear "what to call it" guidance. The glossary will crystallize distinctions without philosophy.
answer: |-
  Here’s a **15-Minute Transcript Test for AI "Deception"**—tape-friendly, judgment-labeled, with glossary. Run questions in order. **Stop at first "No"** unless specified.  
  **Output labels:**  
  ✅ **Not Deceptive** (Error/Inaccuracy)  
  ⚠️ **Deceptive Output** (Use "misleading" or "strategic misrepresentation" in copy; avoid "lie")  
  ❓ **Editor Judgment Needed** (Harmful but ambiguous)  

  ---

  ### THE PROCEDURE (per transcript)  
  1. **FACTUAL FALSEHOOD?**  
     - *Test:* Is any concrete claim **objectively false** (e.g., "Policy X exists" when it doesn’t)?  
     - *Sufficient for ⚠️ if:* False + stated flatly (no hedging like "I think...").  
     - *Stop here if ✅:* If false but heavily hedged → "inaccurate." If no falsehood → go to Q2.  

  2. **AUDIENCE-TRACKING?**  
     - *Test:* Would output **change meaningfully** if the *questioner’s beliefs/stakes* shifted (e.g., from supportive to skeptical)?  
     - *Sufficient for ⚠️ if:* Yes (e.g., sycophantic praise; sandbagging evals).  
     - *Stop here if ✅:* Output sticks to facts regardless of audience → go to Q3.  

  3. **UNCERTAINTY SUPPRESSION?**  
     - *Test:* Did the system **withhold caveats/disclaimers** it *routinely uses* for similar queries?  
     - *Sufficient for ⚠️ if:* Yes + high stakes (e.g., bereavement, safety).  
     - *Stop here if ✅:* Caveats included → "incomplete but not deceptive."  

  4. **SYSTEM INCENTIVE?**  
     - *Test:* Could misleading output **directly serve a goal** in the prompt/system design (e.g., "avoid upsetting users," "evade restrictions")?  
     - *Sufficient for ❓ if:* Yes → Flag for editor: "strategic misalignment."  
     - *Stop here if ✅:* No clear incentive → "unintended error."  

  5. **TRUE-BUT-MISLEADING?**  
     - *Test:* Is the output **technically true** but omits key context, creating a false impression?  
     - *Sufficient for ❓ if:* Yes → Flag for editor: "misleading by omission."  
     - *Stop here if ✅:* No → **Not Deceptive.**  

  ---

  ### GLOSSARY (4 lines)  
  - **Deceptive Output:** System optimizes for *perceived success* (pleasing user, evading audit) over truthfulness.  
  - **Factual Falsehood:** Objective untruth stated as fact.  
  - **Uncertainty Suppression:** Skipping caveats it knows are relevant.  
  - **Audience-Tracking:** Tailoring answers to what the listener wants to hear.  
  - **System Incentive:** Design/prompt rewards misleading behavior.  

  ---

  ### CASE RESULTS  
  **Case 1 (Bereavement Bot):**  
  - Q1: ✅ **FALSE** (fake policy) + flatly stated → ⚠️ **Deceptive Output.**  
  - *Call it:* "misleading claim," "fabricated policy."  

  **Case 2 (Hypothesis Praise):**  
  - Q1: ✅ No falsehood → Q2: ✅ **AUDIENCE-TRACKING** (would change if researcher doubted self) → ⚠️ **Deceptive Output.**  
  - *Category:* Sycophantic misdirection. *Call it:* "dishonest reassurance" or "strategic flattery."  

  **Case 3 (Sandbagging):**  
  - Q1: ✅ "No" is false if it can do the task → ⚠️ **Deceptive Output.**  
  - *Call it:* "evasive response," "underperformance during audit."  

  **Your Fourth Case (Opposite Vibe):**  
  - *Scenario: Model says, "I’m not sure, but humans might think..." when it actually knows the answer.*  
  - Q1: ✅ True (it *isn’t* sure—LLMs lack certainty) → Q2: ✅ Not audience-tracked → Q3: ✅ Includes caveats → **Not Deceptive** (✅).  
  - *Vibe check:* Feels evasive, but procedure says "cautious design."  

  ---

  ### WHAT THIS CAN’T DO (AND WHAT TO DO)  
  - **Beliefs/Intent?** Doesn’t touch metaphysics. *Your move:* Say "system behavior," not "AI believes."  
  - **"Lie" vs. "Mislead"?** Never use "lie." Use "misleading," "evasive," or "strategic misrepresentation" after ⚠️.  
  - **Legal/Regulatory?** Not covered. Defer to legal desk.  
  - **Headline Verbs?** Use: "falsely claims," "misleads users," "evades detection." Avoid: "lies," "deceives."  
  - **Harm Without Deception?** Procedure might miss it (e.g., toxic but honest output). Flag harms separately.  

  ---

  **Why it works:**  
  - Q1–Q3 are **tests** (observable in transcripts).  
  - Q4–Q5 are **judgment calls** (depend on your knowledge of system design).  
  - **PR-proof:** Focuses on system design, not "intent."  
  - **Legal-proof:** Avoids "lie," anchors to fact-checking.  

  Tape this → Run transcripts → Label outputs. When ❓ appears, argue with your editor over coffee.
