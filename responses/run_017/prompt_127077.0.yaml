prompt: |-
  Hey — I host a tiny philosophy podcast (mostly grad students and a handful of confused undergrads listen) and I'm recording on Thursday with a visiting philosopher who's just published a book on Moore's paradox, that business where it sounds crazy to say that it's raining but I don't believe it is. Her position, as I've pieced it together from the abstract and a talk of hers I watched on youtube, goes roughly like this: the omissive form is the basic case and the commissive one is just a stylistic variant of it; the absurdity lives entirely in the norms of assertion and not in anything incoherent about the mental state; and so you genuinely can believe a Moorean proposition — she thinks some cases of self-deception, and maybe some clinical delusions, are literally beliefs whose content is p-and-I-don't-believe-that-p. From there she concludes that the paradox tells us nothing much about self-knowledge or about why you can't just decide to believe something for practical reasons, and she's on record saying the whole transparency literature is barking up the wrong tree. She also claims the phenomenon generalizes to intention (I'm going to do it but I don't intend to sounds just as off) but not to desire (p, and I want not-p is totally fine), and she explains that asymmetry using assertion norms rather than anything about the attitudes themselves. Apparently she's a very good deflector: when someone produces a hard case she says that's not really a Moorean belief, that's just a fragmented subject, or that's a theorists' artifact, nobody is ever actually in that state.

  So, context: me and my roomate argued about this for like three hours last night over cheap wine, and I came away thinking the assertoric-only story is too quick — my instinct is that there's something specifically first-personal going on, something connected to the fact that you can't deliberate your way into a belief or decide to believe p because it'd be convenient, and I don't see how you get that out of norms on assertion. But I could not for the life of me turn that into a sharp question, and I also don't want to ambush her with something that has an obvious answer she's heard a hundred times. Can you draft me eight to ten interview questions that go beyond asking her to restate the view? I'd like: at least one on the omissive/commissive asymmetry and whether the commissive really is just a variant; at least one on whether the absurdity is assertoric or doxastic, ideally built around the self-deception and delusion cases she thinks support her side; one on the intention-versus-desire asymmetry and whether her assertion-norms explanation of it is doing any real work; one pressing on whether she can stably sever the paradox from the self-knowledge and belief-at-will stuff given what she says elsewhere; one on the case I half-invented during the argument — p, and p plainly entails q, but I don't believe that q — including whether that's even the same phenomenon; and one built around a thing I half-remember, that computer scientists and AI people apparently use Moorean sentences as stock examples of a system failing to update on new evidence, which if right seems to cut against her, since those systems aren't asserting anything. For each question, please give me the follow-up keyed to the answer she's most likely to give (assume she's sharp and has heard every standard objection), and end with one question about what kind of case or evidence would actually make her give the account up. Forty-minute episode, so conversational questions I can say out loud, and please write it all in American English.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and is interviewing a philosopher who has a unique take on Moore's Paradox. The main points of her view are that the omissive form ("It's raining but I don't believe it") is basic, the absurdity comes from assertion norms rather than mental states, and Moorean propositions can actually be believed in cases like self-deception. She also thinks this doesn't relate to self-knowledge or the inability to believe at will, and that the paradox applies to intention but not desire.

  The user needs sharp, non-repetitive interview questions that push beyond restating her view. They want specific angles covered: omissive/commissive asymmetry, assertoric vs. doxastic absurdity (using self-deception/delusion cases), intention/desire asymmetry, connection to self-knowledge/belief-at-will, a user-invented case (p and p entails q but I don't believe q), and the AI counterexample. Each question needs a follow-up anticipating her likely deflection strategies. Finally, they want an "abandon theory" question.

  The user's underlying concern seems to be that the assertion-only account feels incomplete—they suspect something fundamentally first-personal about the paradox that ties to belief's involuntary nature. But they struggled to articulate this in their wine debate, so they need questions that expose this tension without being easily dismissible. Their fear of "obvious answers" suggests they want objections framed in ways that force new engagement.

  For the questions: The omissive/commissive pair should challenge whether "I believe not-p" really reduces to "I don't believe p" without losing something. The self-deception follow-up must press on whether "fragmentation" avoids her own critique of transparency. The intention/desire asymmetry needs to test if assertion norms explain the difference or just redescribe it. The self-knowledge link should exploit her transparency skepticism—if Moore isn't about self-knowledge, why can't we believe at will? The entailment case should probe whether wider irrationality weakens her assertion-norm story. The AI example must force engagement with non-assertive contexts head-on.

  The "abandon theory" question should corner her on what evidence could falsify her view, since she deflects so many cases. The follow-ups should anticipate her moves ("that's fragmented," "not genuine belief") and counter by tightening the hypotheticals to block escape hatches. All while keeping it conversational—no jargon dumps.
answer: |-
  Here are 9 interview questions designed to push the conversation forward, incorporating your requested angles and anticipating her likely responses with sharp follow-ups. They're phrased conversationally for a podcast format.

  1.  **Core Claim - Omissive/Commissive:**
      *   "You argue forcefully that the omissive form ('p, but I don't believe p') is basic, and the commissive form ('p, but I believe not-p') is just a stylistic variant. Could you elaborate on why the commissive *isn't* meaningfully distinct? Specifically, doesn't the commissive express a stronger, more active disbelief? If it's truly just a variant, why does 'I believe not-p' feel like a *commitment* that 'I don't believe p' doesn't quite capture?"
      *   *Likely Answer:* She'll emphasize that asserting "p" already commits you to believing p (via assertion norms), so adding "I believe not-p" is *also* asserting you believe p and asserting you believe not-p, which is just a roundabout way of asserting p while denying you believe it (the omissive core). She might say the "feeling" of commitment is pragmatic or stems from the strength of the belief denied.
      *   *Follow-Up:* "But if assertion norms are doing all the work, why does the commissive *feel* like a deeper contradiction? Could that 'feeling' point to something more – perhaps an actual tension in the *attitude* of believing not-p while simultaneously being in a state where asserting p is warranted? Isn't asserting p *while believing not-p* a more flagrant violation of sincerity norms than asserting p while merely lacking belief?"

  2.  **Self-Deception/Delusion - The Reality of Moorean Beliefs:**
      *   "You suggest cases of self-deception or clinical delusion can involve genuinely believing a proposition like 'p and I don't believe that p'. Could you walk us through a concrete, plausible example of someone stably holding this belief? How do we distinguish this from a subject who, as you sometimes suggest in responses to objections, is merely psychologically fragmented – holding 'p' in one compartment and 'I don't believe p' in another, without forming the single, integrated Moorean belief?"
      *   *Likely Answer:* She'll offer an example (e.g., a parent believing their troubled child is innocent while also, deep down, acknowledging their own lack of conviction). She'll stress that fragmentation *is* a way to hold the Moorean belief – it *is* the subject believing the conjunction, just not in a unified, rational way. Denying it's a "real" Moorean state is moving the goalposts.
      *   *Follow-Up:* "If fragmentation *is* the mechanism for holding the Moorean belief, doesn't that undermine the claim that the absurdity is *only* assertoric? Doesn't the fragmentation *itself* represent a kind of internal incoherence or failure of rational integration that *precedes* assertion? If the subject *weren't* fragmented, *could* they stably hold the belief without self-defeat?"

  3.  **Intention vs. Desire Asymmetry - Norms Doing the Work?**
      *   "You note the asymmetry: 'I'm going to do it but I don't intend to' seems Moorean-paradoxical, while 'p, and I want not-p' seems perfectly coherent. You explain this purely via assertion norms governing expressions of intention versus expressions of desire. Could you spell out that explanation? Specifically, what norm of asserting an intention is violated by the first statement, that isn't similarly violated (or doesn't exist) for asserting a desire in the second?"
      *   *Likely Answer:* Asserting "I'm going to F" expresses (or constitutes) an intention to F (similar to how asserting "p" expresses belief). So asserting it while denying the intention is absurd. Asserting "p" doesn't express *wanting* p, it expresses *believing* p. Asserting "I want not-p" expresses a desire, but there's no norm linking the assertion of a factual claim ("p") directly to the expression of a desire.
      *   *Follow-Up:* "That seems to rest on the *prior* difference in what the speech acts express – intention vs. mere desire. Isn't the *reason* asserting future action expresses intention rooted in something deeper about the nature of intention itself – its connection to practical reasoning and commitment? If intention *wasn't* inherently tied to such commitment, *could* assertion norms alone generate the absurdity? Are the norms explaining the asymmetry, or just reflecting a prior asymmetry in the attitudes?"

  4.  **Severing from Self-Knowledge/Transparency/Belief-at-Will:**
      *   "You argue Moore's paradox tells us little about self-knowledge, transparency, or why we can't believe at will. But consider the 'can't believe at will' point: if the absurdity is purely in *saying* 'p and I don't believe p', why *can't* I just decide to *believe* that conjunction? If I could successfully form that belief, wouldn't asserting it become... unproblematic? Doesn't the very impossibility of *forming* that belief stably point to a deeper constraint on belief-formation itself, linked to self-knowledge?"
      *   *Likely Answer:* She'll likely deny the premise. She might say: 1) You *can* form the belief via self-deception/fragmentation (as argued), and 2) Even if you couldn't *rationally* form it, that constraint comes from general norms of rationality governing belief consistency, not specifically from Moore's paradox *or* a special faculty of self-knowledge. Transparency is a red herring.
      *   *Follow-Up:* "But doesn't the *specific form* of the irrationality matter? The constraint isn't just 'don't believe contradictions' – I can believe p & q while unaware they contradict. The Moorean constraint seems peculiarly *first-personal* and *present-tense*. It's specifically about believing *p* while simultaneously believing *about my current state* that I lack that very belief. Doesn't *that* specificity point towards something about how beliefs represent themselves, or the impossibility of fully dissociating a belief from awareness of holding it in the rational case?"

  5.  **The Entailment Case ("p and p entails q, but I don't believe q"):**
      *   "Here's a variant that came up: Someone says, 'Smoking causes cancer (p), and that plainly entails my smoking causes *me* cancer (q), but I don't believe my smoking causes *me* cancer.' Does this strike you as exhibiting the *same* core absurdity as the classic Moorean statement? Or is it a different kind of irrationality?"
      *   *Likely Answer:* She'll likely say it's a different phenomenon – a failure of logical closure or akrasia in belief updating. It might *sound* odd, but the absurdity stems from violating norms of rationality regarding logical consequence, not the specific Moorean structure involving simultaneous assertion and denial of one's own belief state.
      *   *Follow-Up:* "But isn't there a crucial similarity? In both cases, asserting the first conjunct ('p' or 'p entails q') seems to *commit* the speaker, via norms of assertion and/or rationality, to believing the second conjunct ('p' commits to believing p; 'p entails q' plus asserting p commits to believing q). By then denying they believe the second conjunct, aren't they creating a performative clash *analogous* to the Moorean case, even if the source of the commitment differs? Could the core mechanism – assertion generating a commitment that the speaker then explicitly denies – be the same?"

  6.  **The AI Counterexample - Non-Assertive Systems:**
      *   "I've heard computer scientists and AI researchers point to Moorean sentences as exemplars of a system failing to properly update its belief state based on new evidence – like an agent concluding 'p' but failing to register that it now believes p. These systems aren't *asserting* anything; they're just in an incoherent internal state. Doesn't this suggest the absurdity *can* exist purely at the level of mental representation, independent of speech acts?"
      *   *Likely Answer:* She'll likely deflect: 1) This is a *model* of belief, not necessarily capturing real human belief. 2) The "absurdity" flagged in AI is a *design flaw* or *rationality failure* in the system's reasoning, which we *describe* using Moorean sentences because they are evocative, but it's not the *same* phenomenon as the linguistic absurdity humans experience. It's a theorist's artifact in the model.
      *   *Follow-Up:* "But isn't the AI case precisely designed to isolate the *doxastic* component? If the core human phenomenon were *only* assertoric, why would this internal state inconsistency *in a cognitive system* be the natural go-to example for illustrating the problem? Couldn't it be that the linguistic absurdity *reveals* a deeper, prior constraint on coherent belief states themselves, which the AI example *also* models?"

  7.  **Pressing the Mental State - Beyond Assertion:**
      *   "Setting aside assertion for a moment, imagine someone is in what they sincerely report as the mental state: they feel convinced that p is true, yet simultaneously feel convinced that they themselves do not believe that p. They don't say it aloud, they just introspect this state. Leaving aside *how* they got there, would you say this introspected state is genuinely possible and coherent? Or is the *very attempt to conceive it* evidence of an internal tension that mirrors the assertoric absurdity?"
      *   *Likely Answer:* She'll likely insist it *is* possible (via fragmentation/self-deception) and that the tension is merely psychological/rational, not logical or constitutive of belief. The report itself is just another assertion subject to the same norms.
      *   *Follow-Up:* "But if the subject sincerely *reports* this state ('I feel convinced p, yet I feel convinced I don't believe p'), doesn't *that report itself* become a new Moorean assertion? Doesn't this suggest that the structure of the belief state, when brought to explicit self-consciousness, *inevitably* generates the assertoric absurdity? Could the norms of assertion be downstream of the constraints on what can be coherently *thought* about one's own present beliefs?"

  8.  **The Transparency Dodge - A Challenge:**
      *   "You're critical of transparency accounts (the idea that I know my belief by looking at the world). But when you dismiss apparent counterexamples (like someone seeming to assert a Moorean sentence sincerely) by saying 'that's not a real Moorean belief, it's fragmentation,' aren't you employing a *similar* move? Aren't you presupposing a standard of what a 'real' unified belief *is* – perhaps something that *would* be transparent or rationally integrated – in order to deflect the counterexample? How do you define a 'real' Moorean belief without smuggling in the very constraints you deny are central?"
      *   *Likely Answer:* She'll likely distinguish: Transparency claims are a *positive* epistemological thesis about *how* we know our beliefs (by looking outward). Her "fragmentation" move is a *descriptive* psychological claim about how certain irrational states are structured. She's not saying the subject *knows* their belief via transparency; she's describing the state they are *in*.
      *   *Follow-Up:* "But doesn't your criteria for 'fragmentation' versus a 'real' unified belief implicitly rely on the idea that a unified believer *wouldn't* or *couldn*'t stably hold a Moorean belief? Isn't that boundary line itself drawn by the very tension that Moore's paradox highlights? If so, doesn't the paradox *inform* our understanding of what a unified belief state *is*, making it central after all?"

  9.  **The Abandon Ship Question:**
      *   "Your account is admirably parsimonious, sticking closely to assertion norms. To play devil's advocate, what kind of empirical finding or philosophical argument *could* potentially convince you that the absurdity of Moorean propositions runs deeper, into the very nature of belief or self-knowledge? What would count as decisive evidence against your assertion-norms-only view?"
      *   *Likely Answer:* Hard to predict, but she might say: 1) Clear, unambiguous evidence of a subject stably and rationally believing a simple Moorean proposition like "It's raining but I don't believe it" without fragmentation or self-deception (which she'd likely deem impossible). 2) A demonstration that the intention/desire asymmetry *cannot* be explained by speech act norms alone, requiring intrinsic features of the attitudes. 3) A non-circular, successful account of self-knowledge or belief-at-will that *essentially* relies on explaining Moore's paradox as a doxastic phenomenon.
      *   *Follow-Up (Implicit):* Listen carefully to her criteria of falsification. Are they realistic? Does defining "stable and rational" Moorean belief already assume her conclusion? This sets up the final reflection for you/the audience.

  **Delivery Tips:**

  *   **Listen Actively:** Her deflections are key. Use her exact terminology ("fragmentation," "sincerity norm," "stylistic variant") in your follow-ups to show engagement and tighten the point.
  *   **Phrase Naturally:** Adapt the wording slightly to your style. Use contractions ("doesn't," "isn't") and pauses for emphasis.
  *   **Clarify if Needed:** Don't be afraid to say, "Just to make sure I understand, are you saying...?" before launching a follow-up, especially on complex points.
  *   **Manage Time:** You have ~40 mins. Prioritize the questions you find most pressing. You might not get through all follow-ups in depth.
  *   **End Positively:** Thank her for engaging with the pushback, regardless of the outcome. "That's really helpful in clarifying the stakes, thank you for tackling that."

  These questions respect her position while systematically probing its potential weak points and connections to the issues you find compelling. Good luck with the interview!
