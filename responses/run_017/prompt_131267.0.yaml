prompt: |-
  Hey — I'm the lead writer on a scripted audio drama set in first-century Galilee, twelve episodes a season on a public broadcaster, and basically every script meeting hits the same wall: do we put this in Jesus' mouth or not. It's about forty of these calls a season, I get one afternoon per episode to make them, my historical consultant is on retainer for two hours a month (I read Greek badly and no Aramaic at all), and everything I decide then gets read twice — once by the broadcaster's factual-standards person, once by a faith advisory board we have to keep reasonably happy. So I want a procedure, a thing I run, not an essay about how hard this all is. No bibliography and no citations please, I can't look anything up and I don't need to cite anyone in the writers' room.

  What I want is: the questions in the order I should ask them, what counts as a sufficient answer to each one, where the procedure just stops with a no, and where it hands the decision back to me (or to the board) because the question is really about values — do we offend believers, do we mislead the audience, do we lose the scene. For each test tell me which kind of test it is: a gate that can kill an item, a tie-breaker I only use when I'm stuck, or a one-way filter that can only ever disqualify and never confirms anything.

  Some things I want built into it rather than re-litigated every episode:

  My consultant keeps saying the standard criteria grade the tradition, not the event — so I want separate verdicts for "something like this happened", "he said roughly this", and "it went down the way we're staging it", and I want the procedure to be able to return mixed ones, because that's most of my job.

  He also says nothing in the kit can return a verdict of inauthentic — failing a test means 'no verdict', not 'false'. I believe him but I don't know what that does to my workflow, so make it explicit.

  There's an asymmetry I've started to suspect and want you to sharpen or kill: "this fits a first-century Palestinian setting" looks like a great filter for throwing out later legends, but a nearly useless confirmer, since anyone making something up a generation later would make up something that fits. If that's right, say what it's allowed to do in the procedure.

  The dissimilarity worry: a Jesus assembled only out of material that passes because it's unlike both the Judaism around him and the church after him is, by construction, a Jesus who is neither of those things. I want a cap — no more than some fraction of the season's Jesus material may rest mainly on that one test. Give me a number and defend it, and tell me what to do when two great scenes compete for the last slot under the cap.

  Coherence: to me it just looks circular, you may only add what fits what you've already accepted, so it can never correct the picture. Is it a gate, a tie-breaker, or a trap?

  Multiple attestation needs an independence step that I can actually apply without a synopsis of source criticism in front of me: when two sources are in a literary relationship they count once, and "two gospels say it" is not two attestations. Give me a crude version of that test that a non-specialist can run and won't get badly wrong.

  And one idea of my own I want you to try out, and tell me honestly if it's junk: the "explanatory orphan" test — the item is worth keeping if it explains something about the movement that nothing else in our picture explains, and if it isn't itself better explained by some later need of the movement. Where does that misfire?

  Then run the whole thing on three cases:

  1. The baptism by John. I assume this one sails through; if it doesn't, tell me what the weakest link is.

  2. The cry from the cross. It's embarrassing, it looks Aramaic-ish, but the line is straight out of a psalm — so what survives, the fact of a cry, the exact words, the bystanders misunderstanding it?

  3. The crowd choosing Barabbas and Pilate washing his hands. The writers' room loves this, it's our act-two climax, and the board is already nervous about the blame-the-Jews thing. I fully expect you to tell me to cut it or change it a lot; run the procedure honestly anyway, tell me the strongest version of the case for keeping it, and what I'd have to change to make it defensible. We do have a narrator for hedging, but the standards person hates it when we use the narrator as a fig leaf, so be specific about when hedging is legitimate.

  Give me a one-page version I can actually work through at my desk between meetings, the reasoning behind the ordering so I can defend it when someone upstairs asks, and a short list of the calls this procedure simply cannot make.
reasoning: |-
  Okay, the user is the lead writer for a scripted audio drama set in first-century Galilee. They need a practical procedure to decide what to attribute to Jesus in their scripts. They face constraints like time (one afternoon per episode), limited access to a historical consultant, and reviews by a factual-standards person and a faith advisory board. The user wants a step-by-step process with clear questions, types of tests (gate, tie-breaker, one-way filter), and specific outcomes for authenticity levels: event, saying, staging.

  First, I need to address their specific requirements. They want separate verdicts for "something happened," "roughly said," and "staging as is." The procedure should allow mixed results. Also, failing a test means 'no verdict,' not 'false.' The user mentioned asymmetry in the setting filter—it's good for excluding later additions but weak for confirmation. They want a cap on dissimilarity material to avoid a Jesus disconnected from Judaism or the early church. Coherence might be circular, so its role needs clarification. Multiple attestation needs a simple independence check. Their "explanatory orphan" idea needs evaluation.

  Breaking down the procedure. Start with filters that quickly eliminate non-viable items to save time. Then move to gates that can stop an item if failed. Tie-breakers help when evidence is ambiguous. The ordering should prioritize efficiency, handling irreversible decisions early. The five authenticity stages (Event, Saying, Wording, Staging, Framing) allow nuanced outcomes.

  For the explanatory orphan test, it's useful as a tie-breaker but risky if overused. It misfires when later needs aren't considered or if it assumes necessity where none exists. Should be a last-resort tool.

  Applying the procedure to the three cases:
  1. **Baptism by John**: Passes all gates easily. Strong evidence for Event and Saying, weaker for exact Staging. 
  2. **Cry from the Cross**: Embarrassment supports a cry happening. The psalm reference complicates exact wording. Event passes, Saying possible, Wording unlikely. Hedging with the narrator is legitimate here.
  3. **Barabbas Scene**: Fails multiple attestation and plausibility gates. Event is weak, Staging problematic due to historical issues and sensitivity. Suggest reframing with narrator, emphasizing Pilate's role, and avoiding collective Jewish blame.

  The cap on dissimilarity material (max 15%) ensures balance. When scenes compete, prioritize narrative impact and coherence. Coherence acts as a tie-breaker to maintain consistency without circularity.

  Key calls the procedure can't make: theological implications, precise wording without sources, later theological developments, and handling sensitive elements without board input. The faith board's concerns require separate handling beyond historical analysis.

  The user's deeper needs include efficiency, defensibility to stakeholders, maintaining historical plausibility while engaging storytelling, and navigating sensitivities without oversimplifying. The procedure must streamline decisions within tight deadlines while allowing nuanced outcomes that satisfy both historical and faith-based reviewers.
answer: |-
  Here's a lean, executable procedure designed for speed and defensibility. It uses **Gates** (must-pass killers), **Filters** (one-way disqualifiers), and **Tie-Breakers** (used only when stuck). Order prioritizes quick kills and resource efficiency.

  **The Procedure: One-Page Cheat Sheet**

  1.  **Filter: Setting Plausibility (First-Century Palestine)**
      *   **Question:** Is this *impossible* or *highly improbable* in a 1st-century Galilean/Judean context? (e.g., anachronistic objects, concepts, social dynamics).
      *   **Test Type:** **Filter.** Only disqualifies. Passing adds nothing.
      *   **Sufficient Answer:** "No, it's not impossible/improbable." Consultant's "probably later" triggers filter fail. *If fail → DISCARD ITEM.*
      *   **Why First?** Quick kill for obvious later legends. Saves time.

  2.  **Gate: Multiple Attestation (Independence Check)**
      *   **Question:** Does this appear in at least two sources that aren't just copying each other?
      *   **Test Type:** **Gate.** Must pass to proceed. Failure = "No Verdict" on everything.
      *   **Sufficient Answer:** Yes, with independent sources. **Crude Independence:** If Source B *obviously copies* large chunks of Source A *verbatim* (like Matt/Luke copying Mark), they count as ONE source. John *generally* counts separately. Paul counts separately. Non-canonical sources (if consultant confirms plausibility) can count. "Two Gospels" only count as two if they clearly *don't* copy each other for this item (e.g., John vs. Synoptics). *If fail → NO VERDICT on Event/Saying/Wording/Staging.* Item might survive purely as narrative device, but not attributed to history/Jesus.
      *   **Why Next?** Core criterion. Failing here makes deeper analysis wasteful.

  3.  **Gate: Embarrassment/Dissimilarity (Early Church)**
      *   **Question:** Would this be embarrassing or difficult for the *early church* to invent? (e.g., Jesus' baptism by John implying subordination, crucifixion shame, failed predictions, disciples' failures).
      *   **Test Type:** **Gate.** Must pass to proceed. Failure = "No Verdict".
      *   **Sufficient Answer:** "Yes, it would likely be embarrassing/problematic for the church *at the time the tradition emerged*." *If fail → NO VERDICT.*
      *   **Why Here?** Strong indicator something happened/was said. Failing here is a major red flag.

  4.  **Tie-Breaker: Dissimilarity (Judaism)**
      *   **Question:** Is this *distinct* from mainstream 1st-century Palestinian Judaism *in a way unlikely to be invented by a Jewish follower*?
      *   **Test Type:** **Tie-Breaker.** Only use if steps 1-3 pass but evidence feels weak/ambiguous. **CAP: Max 15% of season's Jesus material can *primarily* rest on this.** If two scenes compete for last slot: Prioritize the one with *stronger* support from **Coherence** or **Narrative Necessity**.
      *   **Sufficient Answer:** Consultant confirms it's a notable deviation not easily explained as common Jewish teaching. *Result:* Can tip towards "Event/Saying likely" when combined with passing 1-3. **Never sole basis.**
      *   **Why Tie-Breaker & Cap?** Prevents constructing a Jesus alien to his environment. Over-reliance distorts.

  5.  **Tie-Breaker: Coherence**
      *   **Question:** Does this *fit well* with material already deemed historically plausible (not necessarily accepted into *your* script)?
      *   **Test Type:** **Tie-Breaker.** Only use if stuck after passing 1-3. **NOT a Gate.**
      *   **Sufficient Answer:** "Yes, it doesn't blatantly contradict the emerging plausible picture." Avoid forcing fit. *Result:* Supports plausibility; helps choose between equally attested options. Weakens if it feels like the *only* support.
      *   **Why Tie-Breaker?** Prevents circularity. It polishes the picture, shouldn't build it.

  6.  **Tie-Breaker: Explanatory Orphan (Your Idea)**
      *   **Question:** Does this explain a well-attested *aspect of the early movement* that otherwise seems puzzling, AND is it hard to see this being invented *solely* to meet a later need?
      *   **Test Type:** **Tie-Breaker.** Last resort. **Misfires:** If the "puzzling aspect" isn't solidly attested, or if the "later need" is plausible but not definitively ruled out (e.g., resurrection appearances explain faith, but *also* serve later apologetic needs - ambiguous). *Result:* Can support "Event/Saying likely" when other evidence is borderline.
      *   **Why Last & Cautious?** Highly interpretive. Risk of seeing "necessity" where none existed.

  **Verdict Assignment (After Steps 1-6):**
  *   **Passed Gate 2 (Attestation):** → **EVENT ("Something like this happened") = YES.**
  *   **Passed Gate 3 (Embarrassment):** → **SAYING ("He said roughly this") = YES** (for sayings) / Supports EVENT strength.
  *   **Passed Gate 2 + Linguistic Plausibility (Consultant quick check: "Could the core Aramaic exist?")** → **WORDING ("Exact words close") = POSSIBLE** (Rarely certain).
  *   **Specific Details (Location, Sequence, Minor Characters):** → **STAGING ("Went down this way") = UNLIKELY** (Default). Only "YES" if *multiple* independent sources agree *specifically* (rare).
  *   **FRAMING (Meaning/Interpretation):** *Always* your writer/board decision. History provides raw event/saying, not authoritative interpretation.

  **Hedging (Narrator) Legitimacy:**
  *   Use when verdict is **Event YES / Saying YES** BUT **Wording UNLIKELY** or **Staging UNLIKELY**.
  *   Use for **Explanatory Orphan** material where historical basis is borderline ("Some traditions suggest...").
  *   **Do NOT use as a fig leaf for items failing Gates 2 or 3.** Standards person is right: that's dishonest. If it fails Gates 2/3, it shouldn't be presented as historical Jesus material.

  **Cases Applied:**

  1.  **Baptism by John:**
      *   Filter (Setting): PASS (Fits).
      *   Gate (Attestation): PASS (Mark, Q (Matt/Luke), John, possibly Paul implicitly - strong multiple independent attestation).
      *   Gate (Embarrassment): PASS (Church struggled with Jesus being baptized by "lesser" John).
      *   **Verdict:** EVENT = YES. SAYING = YES (Associated sayings like "fulfill righteousness" also strong). WORDING = POSSIBLE. STAGING = UNLIKELY (Specific dialogue/internal thoughts speculative). **SAILS THROUGH.**

  2.  **Cry from the Cross (Mark 15:34/Ps 22:1):**
      *   Filter (Setting): PASS (Aramaic cry plausible).
      *   Gate (Attestation): PASS? (Mark only. Matthew copies Mark. John has different cry. *Weak Attestation - arguably fails Gate 2*). *Assume board pressure pushes it to next step.*
      *   Gate (Embarrassment): PASS (Cry of despair/abandonment highly embarrassing).
      *   Tie-Breaker (Coherence): PASS (Fits anguish of crucifixion).
      *   **Verdict:** EVENT = YES (A cry of anguish happened - Embarrassment overrides weak attestation here). SAYING = POSSIBLE (Core Aramaic cry plausible). WORDING = UNLIKELY (Specific Psalm quote likely interpretive framing). STAGING = UNLIKELY (Bystander misunderstanding is Markan detail). **Hedge Legitimate:** Narrator can frame the *words* as tradition ("And some recalled his cry as...") while depicting the raw event.

  3.  **Barabbas & Pilate Washing Hands:**
      *   Filter (Setting): PASS (Pilate releasing a prisoner *possible*, though evidence shaky; handwashing known symbolic act).
      *   Gate (Attestation): FAIL (Only in Matthew! Mark has Barabbas but *no* handwashing or "blood on us" crowd. Luke edits Mark's crowd. John edits differently. No independent attestation for the full scene, especially the inflammatory elements. Matthew's unique additions fail independence check).
      *   **→ Gate 2 FAIL = NO VERDICT on Event/Saying/Staging.** Procedure stops. Historically indefensible as staged.
      *   **Strongest Case for Keeping (Narrative):** It's powerful drama explaining why Pilate executed Jesus despite finding no fault, and illustrating shifting political pressures. Embarrassment (blame-shifting) might apply, but fails the critical Attestation gate.
      *   **Making it Defensible:**
          *   **Radically Reframe:** Narrator explicitly states this is *Matthew's distinctive account*, reflecting later community tensions (post-70 AD Jewish/Christian split). *Not* presented as straightforward history.
          *   **Focus Pilate:** Emphasize Pilate's *own* guilt/responsibility. The handwashing is his futile gesture. Cut "His blood be on us..." entirely.
          *   **Depict Crowd Complexity:** Show dissent, fear, manipulation by authorities - not a monolithic "Jewish mob".

  **Calls This Procedure CANNOT Make:**
  1.  **Theological Truth:** Did Jesus *actually* forgive sins/claim divinity? (History can assess if he *said* things interpreted that way).
  2.  **Precise Motivation:** *Why* did Jesus do/say X? (Interpretation).
  3.  **Later Theology vs. Historical Jesus:** Distinguishing the Risen Christ of faith from the Pre-Easter Jesus of history (e.g., post-resurrection dialogues).
  4.  **Resolving Contradictions:** Choosing between conflicting but equally plausible accounts (e.g., Cleansing of Temple timing).
  5.  **"Offense" to Believers:** Balancing historical assessment with modern faith sensitivities (Faith Board territory).
  6.  **Pure Literary Symbolism:** Evaluating scenes intended *only* as theological metaphor with no historical claim (e.g., some Johannine discourses).

  **Why This Order?**
  1.  **Kill Fast:** Eliminate impossible stuff (Filter 1) and the unsupported (Gate 2) immediately. Saves precious time.
  2.  **Core Reliability:** Embarrassment (Gate 3) is a powerful, relatively objective indicator of early tradition *before* deep analysis.
  3.  **Avoid Distortion:** Dissimilarity (Judaism) (Tie-Breaker 4) and Coherence (Tie-Breaker 5) are used cautiously/only when needed to prevent building a warped picture.
  4.  **Efficiency:** Gates 2 & 3 resolve most items quickly. Tie-breakers are only engaged for the ambiguous remainder.
  5.  **Clarity of Verdict:** Separating Event/Saying/Wording/Staging reflects the layered nature of the evidence and gives you actionable script notes.

  Run this checklist for each contested item. The verdicts tell you *what* you can reasonably depict historically. The rest is narrative craft and navigating the board.
