prompt: |-
  I'm a couple of years into a PhD on decision theory, writing the chapter where I have to say what the "unit of decision" is for an agent who doesn't take flat expectations of utility — the risk-weighted view, where you run the cumulative probabilities through a transformation r before combining them with the utilities (Buchak's version). And I keep bumping into something I don't have a word for, and I've been staring at it for to long now.

  Here it is in two versions. Take r(p) = p², utility = dollars, and a 50/50 gamble paying either $0 or $100, offered at a price of $30. Weight on the bad outcome is 1 − r(0.5) = 0.75, weight on the good one is 0.25, so the risk-weighted value is $25 and you decline. Now take two independent copies of exactly that gamble, sold together as a single package for $60: outcomes are $0, $100, $200 with probabilities .25, .5, .25; weights are 1 − r(.75) = .4375, r(.75) − r(.25) = .5, and r(.25) = .0625; weighted value $62.50. That's more than twice $25 — so you accept the pair. But accepting the pair and accepting each one separately produce the very same distribution over final wealth, so nothing about the options changed; only how they were bundled. And it goes the other way too: with r(p) = √p a single gamble is worth about $70.71 and the pair is worth about $136.60, which is *less* than twice the single value, so at $70 each you'd happily take each gamble on its own and refuse both together. The direction of the effect flips with the curvature of r, which makes me suspect I might be looking at two different things wearing one description.

  I don't think the usual labels cover it. "Narrow bracketing" and the choice-bracketing literature are about people who deviate from a benchmark that's assumed to be correct, and the prospect-theory stuff about segregating gains and integrating losses is doing its work through reference points and loss aversion, neither of which my agent has — she has no reference point, just a probability transformation. It isn't a sure-thing-principle failure either, since that shows up inside a single decision. And it isn't a money pump, as far as I can tell: if she just resolves to always aggregate as widely as possible and re-plan at every node, nobody can pump her. But "aggregate as widely as possible" is doing all the work, and I can't say what fixes the width, or why a life, or a decade, or an afternoon is the right unit.

  So: does this packaging-sensitivity have an established name, and if so, is it one thing or two (does the dependence on the curvature of r split it)? How exactly does it differ from bracketing-effects as they're understood in the descriptive literature, and is there a principled answer about the unit of decision, or is that an unfixed parameter of the view? If there's no name, I need to coin one for a paper chapter, so I'd want a definition plus boundary cases — including the awkward one, which is that if the honest answer is "always bracket maximally widely," then the Allais-ish pairwise intuitions that motivated the risk-weighted view in the first place were elicited one pair at a time, and I'm not sure the view survives being told to stop doing that.
reasoning: |-
  Okay, let me unpack this PhD student's problem. They're deep into decision theory, specifically working with Buchak's risk-weighted expected utility (REU), and hitting a conceptual wall about how "packaging" gambles affects valuation in ways that seem inconsistent. 

  First, their core examples stand out: with r(p)=p², a single $30 gamble gets rejected at $25 valuation, but two bundled at $60 get accepted at $62.50—even though the wealth distribution is identical. The reverse happens with r(p)=√p. The direction flips with r's curvature, suggesting two distinct phenomena masquerading as one packaging effect.

  Hmm, they've already ruled out obvious labels. Narrow bracketing? Doesn't fit because there's no normative benchmark here—their agent isn't making a "mistake." Prospect theory's segregation/integration? Nope, no reference points. Sure-thing principle? Violations would occur within a single decision. Money pump? Avoidable via consistent wide bracketing. 

  The real tension strikes me: REU was built to capture pairwise Allais-like choices (narrow framing!), but now wide bracketing seems required for coherence. That's philosophically uncomfortable. If they must always bracket maximally, does that undermine REU's original motivation?

  I recall Machina's work on non-expected utility models—this smells like his criticism about dynamic inconsistency. Also, Karni & Safra's papers on induced preferences might be relevant. But the bundling angle feels fresher. 

  For naming... "partition-dependence" comes close, but usually assumes a fixed state space. "Bundle-sensitivity" is descriptive but vague. Since it's about how r-curvature distorts aggregation, maybe "differential risk scaling"? Or emphasize the framing: "compositive inconsistency"? 

  Boundary cases matter. When r(p)=p (expected utility), bundling doesn't matter. Convex r exacerbates downside weighting in small gambles but diversifies in bundles—aha, that's why r(p)=p² accepts the bundle! Concave r does the opposite. 

  The unit problem remains thorny. "Maximal bracketing" avoids money pumps but feels ad hoc. Perhaps the agent should bracket decisions that share uncertainty sources? But that gets messy. Honestly, this might be a fundamental limitation of REU—it needs bracketing as an external parameter. 

  For their chapter, they should flag this as a latent tension in REU: the model that explains narrow framing requires wide framing to be coherent. That's publishable insight. Naming-wise, I'd propose "REU scale sensitivity" or "risk-weighting aggregation anomaly," with clear examples of both curvatures. 

  ...Wait, did I just talk myself into concluding that bracketing isn't a bug but a feature REU must acknowledge? Oof. That PhD life.
answer: |-
  This is a profound and under-discussed issue in risk-weighted expected utility (REU) theory. What you're observing is **differential sensitivity to the scale/partitioning of uncertainty resolution**, stemming directly from the nonlinear probability transformation *r*. It lacks a universally established name, but here's a breakdown, terminology proposal, and resolution strategy:

  ### Core Problem & Terminology
  1.  **The Phenomenon:** The valuation of a stochastic prospect changes depending on whether its uncertainty is resolved as one "lump" or partitioned into smaller, independently resolved sub-prospects *even when the final wealth distribution is identical*. This violates the **"Principle of Unitary Resolution"** implicitly assumed in most static decision models.
  2.  **Why Usual Labels Don't Fit:**
      *   **Narrow Bracketing:** Typically describes *deviations* from the normatively correct wide bracket. REU has *no* normatively correct bracket within its static framework – different partitions yield different *r*-consistent valuations.
      *   **Prospect Theory Integration/Segregation:** Driven by reference points and loss aversion, not pure *r*-curvature. Your agent lacks these.
      *   **Framing Effect:** Too broad; this is a specific mechanism driven by the mathematical interaction of *r* and probability aggregation.
  3.  **Proposed Name:** **Scale-Dependent Risk Weighting (SDRW)** or **Resolution-Partition Sensitivity (RPS)**. This emphasizes the core issue: the "unit" or "scale" of uncertainty resolution (single gamble vs. multiple independent gambles) affects the REU valuation due to the nonlinear *r* applied to cumulative probabilities at each partition level.

  ### Is it One Thing or Two?
  It's **one core phenomenon** (nonlinear *r* distorts the aggregation of probabilities across partitions) but with **two distinct behavioral manifestations** depending on the curvature of *r*:

  1.  **Convex `r` (e.g., `r(p) = p²`, Risk-Averse Weighting):**
      *   **Manifestation:** *Prefers aggregation* (wider bracketing). Value of the bundle > Sum of individual values.
      *   **Mechanism:** Convex `r` disproportionately downweights the *best* outcomes within each sub-gamble. Aggregating gambles diversifies the "location" of the best outcome, mitigating this downweighting. The aggregated gamble has fewer extreme cumulative probabilities where convex `r` has its strongest distorting effect. (In your example, the single gamble has `P(U>=100)=0.5` vs. the bundle's `P(U>=200)=0.25`, `P(U>=100)=0.75`; convex `r` distorts the 0.5 region more severely).
      *   **Analogy:** Like diversification reducing idiosyncratic risk, aggregation reduces the "distortion risk" from convex `r` applied narrowly.

  2.  **Concave `r` (e.g., `r(p) = √p`, Risk-Seeking Weighting):**
      *   **Manifestation:** *Prefers segregation* (narrower bracketing). Value of the bundle < Sum of individual values.
      *   **Mechanism:** Concave `r` disproportionately *upweights* the *best* outcomes within each sub-gamble. Segregating gambles provides more "shots" at experiencing this upweighting locally. Aggregation forces the best outcomes to compete against each other within a single probability distribution, diluting the local upweighting effect. Concave `r` distorts extreme cumulative probabilities more, and segregation creates more opportunities for outcomes to fall in the `r`-distorted tails of their *individual* distributions.
      *   **Analogy:** Like a lottery enthusiast preferring multiple small lotteries for more frequent chances of a win, the agent prefers more chances for the concave `r` to amplify a local best outcome.

  ### The Unit of Decision Problem & Coherence
  This is the crux. REU, as a static model, **inherently lacks a defined "unit of decision."** The choice of partition is exogenous. This creates a vulnerability:

  1.  **The Money Pump (Revisited):** While your agent can avoid *naive* pumps by pre-committing to maximal aggregation (for convex `r`) or maximal segregation (for concave `r`), a sophisticated exploiter could design sequences exploiting the *preference reversal* induced by changing partition sizes mid-sequence, *unless* the agent pre-commits to a specific partition strategy universally.
  2.  **The Normative Dilemma:** Your intuition is spot-on. The primary *evidence* for REU comes from pairwise choices presented in *narrow brackets* (e.g., Allais paradox). Yet, the model only becomes dynamically consistent/coherent if the agent adopts a *fixed bracketing rule* (usually maximal aggregation) that contradicts the narrow framing used in its calibration. This is a significant tension.

  ### Addressing the Unit Problem: Principled(ish) Answers
  1.  **Maximal Uncertainty Resolution (Most Common "Solution"):** Pre-commit to always evaluating choices using the coarsest possible partition – resolve *all* uncertainty at once. This maximizes aggregation, eliminates the sensitivity, ensures dynamic consistency, and avoids money pumps. **Justification:** Decisions *should* ultimately be about final outcomes over the domain of choice (wealth, lifetime utility). This treats the decision as a single timeless choice over entire lotteries. *Downside:* Feels artificial, ignores temporal resolution, contradicts elicitation framing.
  2.  **Source of Uncertainty:** Partition based on the underlying source of randomness. Resolve all uncertainty from "Source A" together, "Source B" together, etc. **Justification:** Aligns with how states/events are defined. *Downside:* Defining "sources" can be arbitrary; doesn't fully solve if multiple sources are involved in one decision.
  3.  **Temporal Bracketing:** The "unit" is a planning period (e.g., a day, a year, a life). Evaluate all gambles resolved within that period together. **Justification:** Matches natural planning horizons. *Downside:* Horizon choice is arbitrary; sensitivity reappears across horizons.
  4.  **Accept it as a Parameter:** Acknowledge bracketing (`B`) as a fundamental, exogenous parameter of an REU agent: `REU(L; u, r, B)`. Different agents (or the same agent in different contexts) use different `B`. **Justification:** Descriptive realism (people *do* frame decisions narrowly). *Downside:* Normative weakness, vulnerability to framing manipulation.

  ### Recommendation for Your Chapter
  1.  **Name It:** Introduce **Scale-Dependent Risk Weighting (SDRW)** or **Resolution-Partition Sensitivity (RPS)**. Define it clearly as the dependence of REU valuation on the partition structure of uncertainty resolution for a given final wealth distribution.
  2.  **Explain the Mechanism:** Explicitly link it to the curvature of `r` and its differential distortion of cumulative probabilities at different scales. Show the two manifestations (aggregation preferred under convex `r`, segregation under concave `r`).
  3.  **Acknowledge the Unit Problem:** State clearly that REU, as a static model, requires an exogenous specification of the "decision unit" or bracketing. Contrast this with EUT where it's irrelevant.
  4.  **Discuss Coherence & Normativity:** Confront the tension head-on. The model motivated by narrow-framed choices requires wide framing for coherence. Argue that for normative applications (prescribing rational choice), **Maximal Uncertainty Resolution** is the most defensible solution – it enforces consistency with the core idea that only final outcomes matter. For descriptive applications, bracketing (`B`) becomes an additional parameter to measure or assume.
  5.  **Boundary Cases:**
      *   **EUT (`r(p) = p`):** SDRW/RPS vanishes. Valuation is partition-invariant.
      *   **Purely Hedonic Outcomes:** If utility is defined over instantaneous states (not final wealth), and resolution timing matters intrinsically, then partition sensitivity might be meaningful, not an artifact. (REU usually assumes utility over final wealth).
      *   **Correlated Gambles:** Your example assumes independence. Correlation complicates the aggregation effect but doesn't eliminate the core issue. Analyze it separately.
      *   **Sequential Choice:** This is where the lack of a defined unit bites hardest. Argue that a consistent agent *must* pre-commit to a bracketing strategy (optimally maximal aggregation) when formulating a plan.

  **In essence:** You've identified a fundamental feature (not a bug) of REU theory arising from nonlinear probability weighting. It necessitates specifying the "scale" of decision-making. Frame it as **Scale-Dependent Risk Weighting**, explain its dual nature based on `r`-curvature, and resolve the normative tension by advocating for maximal aggregation as the requirement for dynamic consistency and rationality within the REU framework, even if this means the model behaves differently in isolated pairwise choices than it does in wider contexts. This honesty strengthens your thesis.
