  Below is a structured activity designed for your lunchtime paper club. It addresses your core requirements: participants experience the cost of excluded middle without an epistemic interpretation, disjunctions require commitment, and a single structural rule differentiates classical/intuitionistic play. The activity simulates logical reasoning through a collaborative proof-building game.

  ---

  ### **Activity: The Proof Builders' Guild**  
  *Goal: Prove a statement using limited resources. Teams face a trade-off: case-splitting is allowed but costly under classical rules, while intuitionistic rules prevent it entirely.*

  #### **Materials**  
  - **Whiteboard** divided into two sections (Classical vs. Intuitionistic).  
  - **Proposition cards**: Pre-written cards for atomic propositions (e.g., `Halts(Program_A)`, `Collatz(Number_X)`). Use undecidable properties:  
    - `Halts(P)` = "Program P halts on input 0".  
    - `Collatz(n)` = "Collatz sequence starting at n reaches 1".  
    (Use real programs/numbers, e.g., a 3x+1 sequence for a large `n`, or a short Python program that may halt.)  
  - **Move tokens**: 10 tokens per team (representing "proof effort").  
  - **Referee sheet**: Rules + hidden state (e.g., `Halts(Program_A) = true`).  

  #### **Teams & Roles**  
  - **2 Teams (4–5 people each)**:  
    - **Classical Guild**: Can use case-splitting (split proof into branches).  
    - **Intuitionistic Guild**: Must build proofs linearly (no branching).  
  - **Referee (You)**: Enforces rules, reveals outcomes of atomic propositions *only when a decision procedure exists*, and tracks tokens.  
  - **Math-Degree Guy**: Assign to Intuitionistic team. He’ll try to "solve" the game—this will backfire.  

  #### **Core Rules**  
  1. **Disjunction Commitment**:  
     - To assert `A ∨ B`, you must **choose a side** (`A` or `B`) and prove it.  
     - *Example*: If you claim "Program_A halts or doesn’t halt", you must immediately commit to "halts" or "doesn’t halt".  
     - **Referee enforcement**: "Which one? You must pick now or retract."  

  2. **Single Structural Rule (Key Difference)**:  
     - **Classical Guild**: May **case-split** on any proposition. Costs 2 tokens. Creates two proof branches; both must succeed.  
     - **Intuitionistic Guild**: **No case-splitting allowed**. Proofs are linear; no backtracking or branching.  

  3. **Atomic Propositions**:  
     - To prove `Halts(P)` or `Collatz(n)`, teams must provide a witness:  
       - `Halts(P)`: Submit `P`’s output (if it halts) or run `P` for 10 seconds (if it loops, fails).  
       - `Collatz(n)`: Compute one step of the sequence per token spent (practically infeasible for large `n`).  
     - *No hidden knowledge*: Referee knows the truth but won’t reveal it. Teams must compute witnesses.  

  4. **Scoring & Winning**:  
     - **Goal**: Prove `(¬A → B) → (A ∨ B)` (classically trivial, intuitionistically false).  
     - **Cost**: Each proof step (e.g., modus ponens, case-split) costs 1 token. Running a program/sequence costs tokens.  
     - **Win Condition**: First team to write a complete proof on the whiteboard wins.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Setup (5 min)**:  
     - Split into teams, explain goal (`(¬A → B) → (A ∨ B)`), and hand out tokens.  
     - **Do not explain logic terms**. Say: "You’re buildling a proof with limited resources. Follow your team’s rules."  

  2. **Gameplay (50 min)**:  
     - **Round 1 (20 min)**: Teams work separately. Referee:  
       - Deny requests like "Does `Halts(P)` hold?" (no decision procedure).  
       - Enforce disjunction commitment: "You said ‘A or B’—which one?"  
       - Charge tokens for computation (e.g., running a program).  
     - **Round 2 (20 min)**: Teams switch guilds. Repeat with new proposition (e.g., `Collatz(n)`).  
     - **Interruptions (10 min)**: If teams stall, reveal partial info (e.g., "After 5 steps, `Collatz(n)` is at 26").  

  3. **Debrief (20 min)**:  
     - Discuss critical moments:  
       - *When Classical spent tokens on case-splits* → "Did splitting help or waste effort?"  
       - *When Intuitionistic hit a wall* → "Why couldn’t you use ‘A or not A’ here?"  
     - Map to logic:  
       - Disjunction rule = **BHK interpretation** (proofs require witnesses).  
       - Structural rule = **No excluded middle** (case-splitting isn’t free).  
       - "The cost isn’t ignorance—it’s that no witness exists without computation."  
     - Address math-degree guy: "You tried to pre-compute `Collatz(n)`, but tokens ran out. That’s the point: no general method exists."  

  ---

  ### **Predictable Issues & Mitigation**  
  - **"The Math-Degree Guy Tries to Solve It"**:  
    - He’ll pre-compute `Collatz(n)` or write a halting detector.  
    - **Mitigation**: Charge heavy token costs (e.g., 1 token/sequence step). When he runs out: "You exhaust resources but have no proof."  

  - **Arguing with Referee**:  
    - "Why can’t I say ‘P or not P’ without choosing?"  
    - **Mitigation**: Point to rules: "The guild’s oath requires commitment. Which side do you stake your tokens on?"  

  - **Teams Collaborate Across Guilds**:  
    - **Mitigation**: Allow it! They’ll see Classical relies on Intuitionistic for witnesses, exposing classical’s dependence on constructive work.  

  ---

  ### **What the Game Can’t Do**  
  - **Liberties Taken**:  
    - Tokens approximate "proof effort" (not philosophical truth).  
    - Undecidable properties (*Halts*, *Collatz*) simulate non-constructive propositions, but real math uses pure syntax.  
  - **Contested/Simplified**:  
    - Assumes **proof-theoretic constructivism** (BHK).  
    - Omits semantics (e.g., Kripke models) to avoid "growing worlds" confusion.  
  - **Epistemic Risk Mitigated**:  
    - Truth values are fixed (referee knows), but teams **cannot access them without proof**.  
    - Focus: "Witnesses aren’t hidden—they’re *nonexistent* without computation."  

  ---

  ### **Why This Works**  
  - **Mechanics 1 & 2 Cohere**:  
    - Disjunction commitment forces intuitionistic discipline.  
    - Case-split cost makes classical players *feel* excluded middle’s "expense."  
  - **No Epistemic Smuggling**:  
    - Teams fail when they **lack a method** (e.g., no program to decide `Halts`), not when they "don’t know."  
    - Debrief: "In real math, some truths have no decision procedure—so LEM isn’t free."  

  Run this as a "trial" game first. Expect chaos, but that’s where the learning happens—the wall is real.
