  The key points from the request:
  1. Avoid epistemic interpretations (it's not about ignorance, but about what constitutes a proof).
  2. The game must have a clear rule that disallows case splitting without a decision procedure (so that LEM is not freely available).
  3. The rule difference between classical and intuitionistic should be concrete and singular (e.g., classical allows branching and merging, intuitionistic does not).
  4. The activity should be engaging, with roles, rules, and a payoff.

  Proposed Activity: "The Constructive Challenge"

  Core Idea:
  We frame the activity as a cooperative proof-building game. The group is divided into two teams: one playing by classical rules (allowing LEM and case splits arbitrarily) and the other by intuitionistic rules (without arbitrary case splits, and with the disjunction commitment). They will attempt to prove the same statement in parallel. The statement should be one that is classically trivial but intuitionistically non-trivial (or even false). We choose a statement that involves an undecidable predicate (like the halting problem) to make the case split impossible to actually carry out in the intuitionistic setting.

