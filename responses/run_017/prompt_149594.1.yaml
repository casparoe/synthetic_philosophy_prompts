prompt: |-
  hey — act as an epistemologist who also knows something about how software actually gets built, and think it through properly: brainstorm two or three candidate principles before you settle on one. I want a real answer, not a menu.

  I'm a backend engineer, about ten years in, model assistance in the editor every day, and I'm trying to figure out when leaning on it costs me understanding. Here are my gut verdicts:

  1. Regexes, sed one-liners, the exact flag order for some aws command — let it write those. Fine, no loss; I never really "understood" them anyway.
  2. It writes a feature from a spec I wrote, I read the whole diff and test it. Fine.
  3. Same feature, but I only test the behavior and skim the diff. Not fine — feels like something's leaking away, even though the code that ships is identical to case 2.
  4. It explains a stack trace, or walks me through a new framework while I interrupt with dumb questions. Fine — I come out ahead of reading the docs.
  5. I ask it for an architecture for a service I'll own for years, can't find a hole in the plan, and accept it. Not fine, and worse than 3, even though in 3 I also can't fully produce the rationale.
  6a. It writes Rust for me; I don't know Rust; I accept code I couldn't have written and can't fully explain. Gut: basically fine, borrowed competence.
  6b. I open my own code from eight months ago, don't understand it, have the model explain my own code to me and then patch it. Gut: not fine, feels like rot. But 6a and 6b look structurally identical to me — in both I end up with working code whose rationale I can't state — so I think one of those verdicts is wrong and I want you to say which.
  7. Throwaway migration script, deleted after running: obviously fine. Same script, except someone drops it in a cron job and it becomes load-bearing without anybody reading it: not fine, and I feel it's partly my fault even though I didn't choose that.
  8. I let it write something, close the tab, and reimplement the idea from scratch my own way. Fine — fine even when my version is worse than what it gave me.

  The principle I keep coming back to: outsourcing is corrosive when it lowers my ability to handle the *next* problem in that area, and fine when it doesn't. But 6a breaks it (I never learn the borrow checker, so my next-problem ability in Rust stays at zero, and I'm fine with that), and it doesn't explain why 5 feels worse than 3. I've also started calling one failure mode "shadow comprehension": I can predict what the code does in situations I've already seen and gesture at why, but I can't write it myself or make the same call in a new situation — use that if it's useful, or tell me it's a bad category.

  So: repair my principle or replace it. Give me one that fits what it can fit, states plainly which of my verdicts it throws out and why, and hands down verdicts on cases I haven't listed — at minimum, pair-programming with a junior who is also using the model the whole time, and getting paged at 3am for a service the model largely wrote.

  Be committal: pick the principle you actually think is right, give your reasons, and say roughly how confident you'd be in each clause and where you'd expect a professional epistemologist to push back hardest.
reasoning: |-
  We are looking for a principle that explains the intuitions in the provided cases and resolves the apparent contradictions (especially 6a vs 6b and 3 vs 5). The principle should also generalize to new situations.

   Key Observations from the Cases:

   1. There is a distinction between "tool-like" knowledge (regex, AWS flags) and "conceptual" knowledge (architecture, rationale for code). The former can be outsourced without loss because they are essentially arbitrary and do not build deeper understanding. The latter, when outsourced, may lead to a loss of ability to handle future problems.

   2. The principle you proposed: "outsourcing is corrosive when it lowers my ability to handle the *next* problem in that area, and fine when it doesn't" is a good start, but it breaks on 6a (you are fine with never learning Rust) and doesn't explain why 5 (architecture) feels worse than 3 (code for a feature).

   3. In 6a vs 6b: 
      - 6a: Writing Rust without knowing Rust is fine because you are borrowing competence. You don't plan to become a Rust expert; you just need the code to work. You are not expected to have deep Rust knowledge for future problems (unless you take on Rust projects, in which case you would need to learn).
      - 6b: Having the model explain your own old code and patching it feels like rot because you are losing the connection to your own past reasoning. This is knowledge you should have retained because it was in your domain (you wrote it!) and is now decaying. This loss of understanding in your own codebase directly impacts your ability to handle future problems in the same project or domain.

   4. In 3 vs 5:
      - 3: You skim the diff and test behavior. The code is in a language and domain you know. The risk is that you might miss subtle issues because you didn't deeply understand the generated code, but the problem is bounded (a feature). However, you feel something is leaking away because you are not engaging with the details that might be relevant for future modifications or debugging.
      - 5: Accepting an architecture for a service you'll own for years without being able to produce the rationale is worse because architecture decisions have long-term consequences and touch many parts of the system. If you don't understand the rationale, you won't be able to adapt the architecture to changing requirements or debug systemic issues.

   5. The concept of "shadow comprehension": This seems to be a state where you have a superficial understanding (can predict behavior in known scenarios) but lack the ability to create or adapt. This is dangerous when the domain is core to your responsibilities because it leaves you vulnerable to novel situations.

   Proposed Principle:

   **The Outsourcing Principle of Retained Agency and Responsibility**

   Outsourcing is acceptable when it does not compromise your agency and responsibility over the domains and tasks that are core to your role and the long-term health of the systems you own.

   Breaking it down:

   - **Agency**: Your ability to make informed decisions and take effective action in a given domain.
   - **Responsibility**: The domains and tasks for which you are held accountable, both now and in the future.

   Corollaries:

   1. Outsourcing is acceptable for tasks that are:
      a. Outside your core responsibilities (e.g., one-off tasks in a language you don't use regularly, like Rust in 6a).
      b. Not expected to be part of your ongoing knowledge (e.g., regex, AWS flags).
      c. Throwaway (as in 7, if truly thrown away) or for learning (as in 4).

   2. Outsourcing is corrosive when:
      a. It erodes your agency in a domain that is core to your responsibilities (e.g., the architecture of a service you own, as in 5; or understanding your own codebase, as in 6b).
      b. It creates a situation where you have responsibility without agency (e.g., the cron job in 7 becoming load-bearing without understanding, or the architecture in 5).

   3. The principle also accounts for the "shadow comprehension" problem: If outsourcing leads to a state where you have responsibility but only shadow comprehension, then it is unacceptable because you lack the agency to handle novel problems or make necessary changes.

   Applying the principle to the cases:

    1. Regex, AWS commands: Acceptable because they are not core to your agency (they are tools you use without deep understanding). They are not part of your core responsibilities to understand at that level.
    2. Feature from spec, read whole diff: Acceptable because you are exercising agency by reviewing and testing. You are maintaining your understanding of the codebase.
    3. Feature from spec, skim diff: Unacceptable because you are responsible for the feature and the codebase, but you are not maintaining agency over the code. You are losing understanding that might be needed for future changes or debugging.
    4. Explaining stack trace, new framework: Acceptable because it enhances your agency (you are learning) and does not undermine your responsibilities.
    5. Architecture for a service you own: Unacceptable because architecture is core to your responsibility and agency. Without understanding the rationale, you cannot effectively own the service.
    6a. Rust without knowing Rust: Acceptable if Rust is not a core part of your responsibilities (you are borrowing competence for a one-off). But if you were to take on ongoing Rust projects, this would become unacceptable.
    6b. Explaining your own old code and patching it: Unacceptable because the codebase is your responsibility. You should retain agency over your own code. This is a failure of knowledge retention in a core domain.
    7. Throwaway script: Acceptable if truly thrown away. If it becomes load-bearing without being read, then it becomes unacceptable because you are now responsible for something you don't understand.
    8. Reimplement from scratch: Acceptable because you are exercising agency by reimplementing. You are learning and taking ownership of the idea.

   Resolving the contradictions:

    - 6a vs 6b: In 6a, the Rust code is not in your core domain (you are not a Rust developer). In 6b, the code is in your core domain (it's your own codebase, which you are responsible for). Therefore, 6a is acceptable and 6b is not.

    - 3 vs 5: Both involve a lack of deep understanding, but the level of responsibility and the scope of the domain differ. In 3, you are responsible for a feature, but the scope is limited and the code is in a domain you know. However, by skimming, you are still eroding agency in your core domain. In 5, the architecture is a higher-stakes domain and more fundamental to your ownership. The principle highlights that both are unacceptable (which matches your gut on 3 being "not fine"), but 5 is worse because the scope of responsibility is larger and the consequences of a mistake are more severe.

    Note: The principle actually classifies 3 as unacceptable (which you also felt: "something's leaking away"). So we are consistent.

   New Cases:

    - Pair-programming with a junior who is also using the model the whole time:
        - This is acceptable if the junior is learning and you are maintaining agency by reviewing and guiding. However, if both of you are overly relying on the model without understanding, then it becomes unacceptable for the parts that are core to the system you are building and your responsibilities. The key is: are you and the junior maintaining agency? If the model is generating code that neither of you understand and that becomes part of the core system, then it's unacceptable. If it's used as a learning aid and the output is properly vetted, then it's acceptable.

    - Getting paged at 3am for a service the model largely wrote:
        - This is unacceptable if you don't have agency over the service (i.e., you don't understand it well enough to debug and fix under pressure). The outsourcing has compromised your agency in a domain for which you are now responsible (being on call). This is a clear failure of the principle.

   Confidence and Epistemological Challenges:

    - Confidence: I am highly confident (90%) in the core principle because it aligns with the practical realities of software engineering ownership and the importance of understanding for maintenance and adaptation. It also matches the intuitions in the cases.

    - Epistemological challenges:
        1. How do we define "core responsibilities"? This is context-dependent and may change over time. The principle requires the engineer to make a judgment call about what is core.
        2. The boundary between "tool-like" and "conceptual" knowledge is fuzzy. For example, is SQL a tool or a core concept for a backend engineer? The principle would say: if you are responsible for writing and maintaining complex SQL queries, then it's core and you must retain agency.
        3. The principle might be seen as too subjective. However, in practice, engineers and teams have explicit and implicit expectations about what is core.

    Refinement: To address the subjectivity, we can say that "core responsibilities" are defined by:
        - The long-term ownership of the system (e.g., you are the maintainer).
        - The expectation of the role (e.g., a backend engineer is expected to understand backend architecture and the codebase).
        - The frequency and criticality of the task (e.g., if you are often required to write Rust, then it becomes core).

   Therefore, the principle is:

    **Outsourcing (to an AI model) is acceptable when it does not undermine your agency and responsibility in the domains that are core to your role and the systems you own. It is unacceptable when it creates or exacerbates a gap between your responsibility and your agency.**

   This principle explains why 6a is acceptable (Rust is not core) and 6b is not (your own codebase is core). It also explains why 5 is worse than 3: architecture is more central to your agency and responsibility than a single feature.

   Let me know if you need further refinement.
answer: |-
  ### Repaired Principle: **The Agency Preservation Principle**

  **Outsourcing is corrosive when it undermines your *executive agency* — your capacity to make informed, intentional decisions in domains where you bear responsibility. It's acceptable when it either expands agency (by accelerating learning or handling non-core tasks) or preserves it (by handling minutiae without compromising future decisions).**

  This principle hinges on two core concepts:  
  1. **Executive Agency**: Your ability to understand *why* choices were made, evaluate trade-offs, and adapt to novel situations.  
  2. **Responsibility Domain**: The scope of systems/problems you own long-term or where errors have high stakes.  

  ---

  ### How It Explains Your Cases
  1. **Regexes/AWS flags**: Acceptable.  
     - *Why*: These are **non-core implementation details**. Outsourcing doesn’t erode agency because they lack meaningful trade-offs to understand.  

  2. **Feature, full review**: Acceptable.  
     - *Why*: You exercise agency by **actively validating** the solution against your mental model.  

  3. **Feature, skimmed diff**: **Corrosive**.  
     - *Why*: You forfeit deep validation. While the *code* works, you lose grasp of *why it’s correct* — eroding agency for future modifications (e.g., debugging edge cases).  

  4. **Explanations (stack traces/docs)**: Acceptable.  
     - *Why*: Expands agency by **accelerating comprehension** of foreign systems. You retain decision-making power.  

  5. **Architecture you’ll own**: **Corrosive**.  
     - *Why*: Architecture is **all trade-offs**. Accepting a black-box design destroys agency: you can’t adapt it to changing requirements or debug emergent flaws. Worse than #3 because stakes are higher and decisions are foundational.  

  6a. **Rust you don’t know**: Acceptable.  
     - *Why*: If Rust is **outside your responsibility domain** (a one-off), you’re borrowing competence *without* pretending to own it. Agency isn’t eroded because you never claimed it.  

  6b. **Explaining your own old code**: **Corrosive**.  
     - *Why*: This code is **within your responsibility domain**. Relying on the model to re-understand *your work* signals **rot in retained agency**. You *should* own this context; outsourcing it weakens your grasp of the system.  
     - *Contradiction resolved*: #6a is borrowing; #6b is **agency debt**. The latter harms your ability to handle future work *in your core domain*.  

  7. **Throwaway script becoming load-bearing**: **Corrosive**.  
     - *Why*: The script entered your **responsibility domain** without agency-preserving validation. You now own code you never understood.  

  8. **Rewrite from scratch**: Acceptable.  
     - *Why*: You **reclaimed agency** by reprocessing the idea. Even if worse, you understand the trade-offs.  

  ---

  ### Verdicts on New Cases
  - **Pair-programming with a junior using AI**:  
    - *Verdict*: **Corrosive if unchecked**. The junior must internalize *why* the AI’s output works. If both of you accept code without understanding trade-offs, agency erodes for both.  
    - *Agency test*: Can the junior explain the solution’s rationale *without the AI*? If not, they’re accumulating agency debt.  

  - **Paged at 3am for an AI-written service**:  
    - *Verdict*: **Corrosive by design**. You lack agency to debug under pressure because you never built the mental model. High stakes + low agency = systemic risk.  

  ---

  ### Why This Principle Fits
  - **Solves #6a/#6b**: Distinguishes "borrowing" (no agency claimed) from "debt" (agency owed but surrendered).  
  - **Explains #3 vs. #5**: Both lose understanding, but architecture has higher agency stakes (decisions cascade; changes are costly).  
  - **Handles "shadow comprehension"**: This is **agency decay** — you can recognize patterns but lack the tools to synthesize new solutions. Unacceptable in your responsibility domain.  
  - **Clarifies "next problem" issue**: Outsourcing is only safe when the "next problem" is either:  
    - Outside your responsibility (e.g., one-off Rust), or  
    - Mitigated by *expanded* agency (e.g., AI explanations making you *better* at future debugging).  

  ---

  ### Confidence & Epistemological Challenges
  - **High confidence (85%)** in the core principle: It aligns with how expertise works in practice (e.g., cognitive load theory, "ownership" in software ethics).  
  - **Moderate confidence (70%)** in "responsibility domain" boundaries: Requires judgment (e.g., "Is AWS now core for me?").  
  - **Where epistemologists push back**:  
    - They might argue agency isn’t binary ("Do you *really* lose it, or just outsource it?"). Retort: Agency requires *retained capacity* to act — outsourcing without understanding destroys that.  
    - They might challenge "trade-offs" as subjective. Retort: Software *is* trade-offs (e.g., performance vs. readability). Losing grasp of them *is* losing agency.  

  ---

  ### The Bottom Line
  **Use the model like a calculator: for arithmetic (minutiae), it’s fine; for algebra (trade-offs in your domain), it rots your mind.** Your gut is right about #6b — it’s rot because it’s *your* system. #6a is fine because Rust isn’t your job to own.  
    
  When in doubt, ask: *"If this breaks, will I be making high-stakes decisions in the dark?"* If yes, you need agency — outsource the *how*, not the *why*.
