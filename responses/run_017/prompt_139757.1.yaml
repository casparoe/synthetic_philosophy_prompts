prompt: |-
  I am the philosophical member of a small committee redrafting our jurisdiction's statute on the determination of death. The existing law, like most, offers two alternative criteria: the irreversible cessation of circulatory and respiratory functions, or the irreversible cessation of all functions of the entire brain, including the brainstem. I do not yet want to argue about which criterion to adopt. I want the specification that any candidate criterion must satisfy, because every meeting so far has consisted of people asserting demands that turn out to be the commitments of whichever criterion they already favour.

  Two developments force the issue. First, our clinical advisers tell us to assume that, within a decade, an extracorporeal neural support platform will be in ordinary use: a device that cannulates the vessels of the neck after the heart has stopped and restores and sustains intracranial perfusion, so that measurable electrical activity returns within hours and, in a minority of patients, responsiveness returns over days. Assume further that it works on some patients who have already met every element of a full brain-death examination. Whatever we write has to be stable under that technology arriving, and I want to know which of our current demands on a criterion were really only demands that the technology not exist. Second, the transplant community has put to us a 'layered' declaration: a provisional determination of death at the moment of circulatory arrest, operative for the purpose of organ recovery alone, followed by a definitive determination some hours later for every other legal purpose, with the provisional determination retroactively rescinded if the definitive one goes the other way. I need to know whether retroactive death is a coherent thing to legislate for.

  Write me the desiderata for a legally operative criterion of death, in this order.

  One. The list itself: each requirement stated as a single sentence, each followed by the case or consideration that makes it a requirement, and each tagged as either non-negotiable or a preference of a particular camp. The statute has to do at least three kinds of legal work, and you should let that fix what counts as adequate: it must permit the withdrawal of life-sustaining treatment without homicide liability; it must permit organ recovery; and it must settle, to the hour, questions of inheritance, criminal causation and insurance. I expect the cases behind the requirements to include the ventilated body that meets brain criteria but continues to gestate a foetus, spontaneous return of circulation after failed resuscitation, the permanently unconscious patient with an intact brainstem, and any other case you think genuinely discriminates between criteria.

  Two. Which of the requirements on your list are not desiderata at all but the settled prejudices of one side, and what each of them would exclude if we took it seriously.

  Three. The jointly unsatisfiable subsets, with the argument for the incompatibility in each case. This is the part I most want. I suspect at least one of them involves the demand that a determination fix death at a determinate instant, and something else we also want.

  Four. Name the single requirement that does the most work in excluding candidates, and say what it rules out.

  Five. A short scorecard — a compact table is fine, and it should be the shortest section — grading the whole-brain criterion, a higher-brain or neocortical criterion, circulatory criteria read as irreversible and as merely permanent, and the organism-as-a-whole account against the list.

  Constraints on the answer: no more than about 1,400 words; the weight should sit in sections two to four rather than in the scorecard, since the criteria are where I need the thinking; and please write it in American English. I do not need statutory text, case law, or a bibliography — I can look those up myself, and I want the argument rather than the sources.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosopher on a committee redrafting death determination statutes, facing two key challenges: upcoming neural support technology and transplant community proposals for "layered" declarations. They need a framework to evaluate criteria beyond existing partisan positions.

  First, I'll outline the core legal functions the statute must serve: enabling treatment withdrawal without homicide charges, permitting organ procurement, and precisely timing legal events like inheritance. These form the foundation for the desiderata. 

  Considering edge cases is crucial here. The persistent vegetative state patient challenges higher-brain criteria, while autoresuscitation cases test circulatory standards. The brain-dead pregnant woman forces consideration of integrated organismal function. Each case reveals different philosophical tensions.

  For the desiderata list (section one), I'm considering these non-negotiables:
  - Biological finality (prevents resurrection paradoxes)
  - Objective measurability (for legal certainty)
  - Technology-independence (future-proofs against neural platforms)
  - Singular legal death moment (avoids retroactive status changes)
  - Compatibility with existing homicide law

  The negotiable items would include:
  - Consciousness-centric views (favored by higher-brain advocates)
  - Cardiopulmonary primacy (preferred by circulatory criterion supporters)
  - Whole-organism emphasis (for biological integration purists)

  In section two, I'll identify hidden biases. For example, the demand for immediate organ viability after declaration actually presumes circulatory criteria, while insistence on consciousness as essential reflects higher-brain prejudice without acknowledging its legal complications.

  The incompatibility analysis (section three) will focus on key tensions:
  - The impossibility of having both instant death determination and maximum organ viability
  - Consciousness requirements conflicting with brainstem preservation
  - Technology-independence clashing with adaptive criteria

  For the pivotal requirement (section four), the "singular legal death moment" does heavy lifting by ruling out layered determinations and any criteria allowing temporary death states. This makes the transplant proposal legally incoherent.

  The scorecard will concisely evaluate five criteria against the desiderata, showing how whole-brain succeeds on legal certainty but fails on technology-independence, while circulatory standards become unstable with new perfusion tech. Higher-brain criteria notably fail organismal integration tests.

  Throughout, I'll maintain tight focus on philosophical principles rather than clinical details, using American English as requested, and keeping under the 1,400-word limit with emphasis on sections 2-4.
answer: |-
  Here are the desiderata for a legally operative criterion of death, structured as requested:

  **One. Desiderata List**

  1.  **Non-Negotiable: Death must be a singular, biologically final event.** *Case:* Spontaneous return of circulation after failed resuscitation ("Lazarus phenomenon") demonstrates that cessation must be *irreversible*, not temporary, to constitute death. A provisional determination rescinded later creates legal chaos.
  2.  **Non-Negotiable: The criterion must pinpoint a specific, knowable moment of death.** *Case:* Settling inheritance (e.g., simultaneous deaths in an accident), criminal causation (did act A kill Victim already dead?), and insurance payouts (time of death clause) require temporal precision, not a process or window.
  3.  **Non-Negotiable: Determination must be biologically objective and measurable with available clinical tools.** *Case:* Distinguishing permanent unconsciousness (PVS) from brain death requires clear, testable signs (e.g., brainstem reflexes, apnea test) to avoid subjective judgments and ensure legal defensibility.
  4.  **Non-Negotiable: Death must signify the irreversible loss of function of the organism *as a whole*.** *Case:* The brain-dead pregnant woman with a gestating fetus demonstrates somatic integration can persist without brain function, challenging whether brain death alone always equals organismal death. The criterion must capture the cessation of integrated biological unity.
  5.  **Non-Negotiable: The criterion must be technology-independent.** *Case:* Extracorporeal neural support restoring intracranial perfusion *after* circulatory arrest and even after meeting brain death tests forces this. Death cannot be defined by the absence of technology we choose not to deploy; the criterion must hold regardless of available interventions.
  6.  **Preference (Higher-Brain Camp): The criterion should entail the irreversible loss of consciousness and cognitive function.** *Case:* Permanent Vegetative State (PVS) patients retain brainstem function enabling breathing and circulation but lack consciousness. Proponents argue loss of personhood/cognition is ethically central to death.
  7.  **Preference (Circulatory Camp): The criterion should center on the irreversible loss of spontaneous cardiopulmonary function.** *Case:* The core traditional understanding; proponents see circulation/respiration as the fundamental "vital spark" and brain death as a proxy for its inevitable, rapid loss.
  8.  **Preference (Organism-as-a-Whole Camp): The criterion must reflect the irreversible loss of the body's critical, integrating functions.** *Case:* Distinguishes between systems shutting down irreversibly (death) versus systems merely being supported (life). Focuses on what integrates somatic unity, often pointing to the brainstem or entire brain.
  9.  **Non-Negotiable: The criterion must permit organ recovery for transplantation within medically viable timeframes.** *Case:* Organs rapidly deteriorate after circulatory arrest. The law must facilitate donation without exposing surgeons to liability.
  10. **Non-Negotiable: The criterion must permit the lawful withdrawal of life-sustaining treatment (LST) without constituting homicide.** *Case:* Turning off a ventilator for a patient meeting the death criterion cannot be murder or manslaughter. The criterion provides the bright line permitting ethical withdrawal.

  **Two. Prejudices Masquerading as Desiderata**

  1.  **"Death must be instantaneous with circulatory arrest for organ viability."** *Prejudice:* Favors strict circulatory criteria/DCD protocols. *Excludes:* Brain death criteria (where organs can be perfused for hours/days) and potentially any scenario where rapid organ recovery isn't the paramount goal. Ignores the biological reality of dying as sometimes a process.
  2.  **"Consciousness is the essence of life; its loss is death."** *Prejudice:* Favors higher-brain criteria. *Excludes:* Patients in PVS or severe dementia who retain brainstem-mediated integration (breathing, circulation). Requires defining and reliably diagnosing "consciousness" legally.
  3.  **"Only the complete absence of all cellular brain activity signifies death."** *Prejudice:* Favors the strictest interpretation of whole-brain death. *Excludes:* Potential future states where minimal, non-integrative cellular activity might persist despite the irreversible loss of organismal function, or scenarios revived by neural support platforms showing electrical activity without integration.
  4.  **"Death must align perfectly with the moment it becomes permissible to treat the body solely as a resource (e.g., for organs)."** *Prejudice:* Favors expedited DCD protocols/layered declaration. *Excludes:* Any criterion where the biological state of death doesn't immediately coincide with optimal organ condition, or where respecting the deceased requires a definitive determination before invasive procedures.

  **Three. Jointly Unsatisfiable Subsets**

  1.  **Conflict: Determinable Instant + Maximal Organ Viability + Technology Independence + Organismal Integration**
      *   *Incompatibility Argument:* Demanding a *knowable instant* of death (e.g., moment of circulatory arrest) and *maximal organ viability* (requiring intervention moments after that arrest) is only feasible if we ignore *technology independence*. Neural support platforms challenge this by potentially restoring function *after* that instant. Furthermore, if the platform restores some brain function (even if not consciousness or integration), declaring death *at* circulatory arrest under *organismal integration* becomes suspect. Prioritizing organ viability pushes towards a provisional, earlier declaration conflicting with the demand for a singular, biologically final event.
  2.  **Conflict: Singular Final Event + Layered Declaration (Provisional Death)**
      *   *Incompatibility Argument:* A "layered declaration" explicitly violates the requirement for death to be a *singular, biologically final event*. If death is provisionally declared at T1 (for organs) but definitively declared *not* dead at T2, the provisional death must be rescinded – meaning the person was legally alive during organ recovery. This creates retroactive legal status changes ("undead"), invalidating inheritance, criminal liability, and insurance settlements tied to T1. Death cannot be provisional and final simultaneously.
  3.  **Conflict: Loss of Consciousness as Essential + Organismal Integration + Measurability**
      *   *Incompatibility Argument:* Requiring irreversible loss of *consciousness* as essential (higher-brain view) conflicts with *organismal integration* if integration persists (e.g., PVS, brain-dead pregnancy). It also faces *measurability* challenges: reliably diagnosing the permanent *irreversibility* of unconsciousness in all cases (beyond PVS, consider severe brain injury prognoses) is currently impossible with absolute certainty, unlike testing brainstem reflexes or irreversible circulatory failure.

  **Four. Pivotal Requirement**

  *   **Requirement:** **Death must be a singular, biologically final event.**
  *   **Work Done:** This requirement is the most powerful exclusionary tool. It immediately rules out:
      *   **Layered Declarations/Provisional Death:** These inherently create the possibility of reversal/rescission, violating finality.
      *   **Any Criterion Vulnerable to Resuscitation/Reanimation:** If a technology (like neural support) can demonstrably *reverse* the declared state (restoring brain function after declaration based on prior circulatory or even whole-brain criteria), the declaration was premature. The criterion must define a state *immune* to future technological reversal to satisfy finality. This challenges traditional interpretations of "irreversible" in the face of disruptive new technologies.
      *   **Definitions Equating Death with a Reversible State:** E.g., defining death solely as loss of consciousness (reversible in some contexts) or temporary circulatory arrest.

  **Five. Scorecard**

  | Criterion                     | Singular Final Event | Determinable Instant | Biological Objectivity | Organismal Integration Loss | Tech-Independent | Permits LST Withdrawal | Permits Organ Recovery | Consciousness Loss (Pref) | Cardiopulmonary Loss (Pref) | Integrating Function Loss (Pref) |
  | :---------------------------- | :------------------- | :------------------- | :--------------------- | :-------------------------- | :--------------- | :--------------------- | :--------------------- | :------------------------ | :--------------------------- | :------------------------------ |
  | **Whole-Brain (Irreversible)**| ✓                    | ✓ (with testing)     | ✓ (current tools)      | ✓ (arguably)                | ⚠ (Neural Support)| ✓                     | ✓                     | ✗                         | ~                             | ✓                               |
  | **Higher-Brain/Neocortical**  | ✓                    | ✗ (Hard to pinpoint) | ✗ (Lacks reliable test)| ✗ (PVS retains integration) | ✓                | ⚠ (Controversial)     | ⚠ (Controversial)     | ✓                         | ✗                             | ✗                               |
  | **Circulatory (Irreversible)**| ✓                    | ✓                    | ✓                      | ~ (Usually, but not always) | ✓                | ✓                     | ✓ (with DCD)          | ✗                         | ✓                             | ~                               |
  | **Circulatory (Permanent)**   | ✗ (Vulnerable to tech)| ✓                    | ✓                      | ?                           | ✗                | ⚠ (Risky)             | ✓ (DCD foundation)    | ✗                         | ~ (Not irreversible)          | ?                               |
  | **Organism-as-a-Whole**       | ✓                    | ? (Vague on timing)  | ✗ (Hard to define/test)| ✓                            | ✓                | ?                     | ?                     | ~                         | ~                             | ✓                               |

  **Key:** ✓ = Satisfies, ✗ = Fails, ~ = Partially/Contentiously Satisfies, ⚠ = Problematic/Controversial under requirement, ? = Unclear/Dependent on specific formulation

  **Conclusion:** The neural support platform forces a reckoning with the meaning of "irreversible," exposing potential instability in current criteria. The layered declaration proposal is fundamentally incompatible with the non-negotiable requirement for death to be a singular, final event. The desiderata highlight that no criterion perfectly satisfies all demands, particularly under technological advancement. The whole-brain criterion currently best meets the legal needs for precision, objectivity, and finality *with current technology* but faces a profound challenge from neural support. Circulatory criteria remain robustly final and objective *if* irreversibility is strictly enforced, but the potential for restored brain function *after* irreversible circulatory arrest creates a significant tension with organismal integration views. Higher-brain criteria fail key non-negotiable legal and biological requirements despite their philosophical appeal to some.
