answer: |-
  **FOR IMMEDIATE RELEASE**  
  **GENEVA, 15 October 2023** — The Interim Secretariat for Historical Continuity (ISHC) today announced the formal retirement of the term "collapse" as a diagnostic category in cross-cultural historical analysis. Effective immediately, all official reports and future archival classifications will replace this terminology with the more precise descriptors "Unscheduled Institutional Restructuring" (UIR) and "Complexity Right-Sizing" (CRS). This revision reflects the ISHC’s commitment to terminological precision, acknowledging that past applications of "collapse" often conflated institutional transitions with demographic or societal endpoints. The Secretariat affirms that populations consistently demonstrate adaptive resilience during such transitions, and this update underscores confidence in their continuity.  

  The reclassification initiative, developed in consultation with the ISHC’s Panel on Episodic Reconfiguration (PER), addresses longstanding concerns about the term’s ambiguity, elite-centric evidentiary bias, and failure to capture post-transition innovation. Dr. Aris Thorne, ISHC Lead Methodologist, stated: "The evidentiary record—literacy, monumental inscriptions, prestige-goods exchange—naturally emphasizes the experiences of administrative elites. When these activities cease, we risk mislabeling institutional evolution as terminus. UIR and CRS more accurately reflect the data: redistributed settlement patterns, technological diversification, and vernacular cultural practices often flourish afterward."  

  Below is a preliminary schedule of reclassified historical episodes, with further revisions pending peer review:  

  1.  **Aegean and Eastern Mediterranean (circa 1200 BCE)**  
      -   **Former designation:** "Late Bronze Age Collapse."  
      -   **Reclassified as:** "Multi-Scalar Complexity Right-Sizing (CRS-12)."  
      -   **Rationale:** The dissolution of palatial administrative networks (e.g., Mycenae, Hattusa) and cessation of Linear B record-keeping represented a transition from centralized, bronze-dependent redistribution economies. CRS-12 entailed the diffusion of ironworking technology, alphabetic script adoption, and emergent maritime trade nodes (e.g., Phoenician city-states). Regional population continuity is attested by stable settlement patterns in Cyprus and coastal Anatolia, with no evidence of pan-regional abandonment.  

  2.  **Southern Maya Lowlands (circa 750–950 CE)**  
      -   **Former designation:** "Classic Maya Collapse."  
      -   **Reclassified as:** "Unscheduled Institutional Restructuring (UIR-9)."  
      -   **Rationale:** The decline of dynastic kingship, monument-building, and Long Count calendrical inscriptions marked a shift from divine-royal ceremonial centers to decentralized, agro-commercial networks. UIR-9 featured population dispersal to northern Yucatán and highland areas, intensified groundwater management (e.g., *chultuns*), and the proliferation of bark-paper codices. Ceramic and osteological evidence confirms demographic stability, with increased interregional exchange of utilitarian goods post-900 CE.  

  3.  **Rapa Nui (circa 1600–1722 CE)**  
      -   **Former designation:** "Rapa Nui Societal Collapse."  
      -   **Reclassified as:** "Ecosystem-Engaged Complexity Right-Sizing (CRS-17)."  
      -   **Rationale:** The cessation of *moai* statue transport and associated elite ritual activity constituted a strategic pivot from monument-centric resource allocation. CRS-17 involved the rise of the *tangata manu* (birdman) cult, rock-garden intensification for sustained horticulture, and canoe-adapted fishing techniques. Paleobotanical studies indicate forest regrowth contemporaneous with these adaptations, while mitochondrial DNA analysis confirms unbroken population presence.  

  In closing, Dr. Thorne reiterated the ISHC’s position: "These reclassifications correct a narrative imbalance. What we observe is not dissolution but recalibration—often toward more resilient, locally attuned systems. The Secretariat maintains full confidence in the underlying population’s capacity for continuity during unscheduled restructuring."  

  The full technical guidelines (ISHC Directive 2023.7) are available at www.ishc.int/terminology-revision.  

  ###  
  **About the Interim Secretariat for Historical Continuity (ISHC):**  
  Established in 2021, the ISHC coordinates multilateral efforts to standardize historical and archaeological taxonomies, emphasizing demographic continuity and institutional dynamism.  

  **Media Contact:**  
  Dr. Elena Voss  
  Senior Continuity Spokesperson  
  press@ishc.int  
  +41 22 907 42 00  

  ---  
  *This document adheres to ISHC Resolution 14 (Terminological Neutrality). The terms "collapse," "overshoot," and "catastrophe" are deprecated in all Secretariat communications.*  

