  **Key Archaeological Humor Embedded (for clarity, not part of release):**  
  - **Elite bias critique:** Focus on literacy/monuments ending (e.g., Linear B, stelae) while noting population continuity.  
  - **Threshold/timescale vagueness:** Descriptors like "multi-scalar" and "dispersal" avoid arbitrary thresholds; dates cover extended transitions.  
  - **Post-"collapse" innovation:** Ironworking, alphabetic scripts, *chultuns*, birdman cult framed as adaptive gains.  
  - **Rapa Nui sensitivity:** Highlights cultural adaptation (birdman cult, horticulture) without environmental determinism.  
  - **Malthusian overshoot nod:** "Ecosystem-engaged" subtly mocks oversimplified resource-depletion narratives.  
  - **Deadpan delivery:** Terms like "unscheduled institutional restructuring" parody bureaucratic euphemism while reflecting real scholarly critiques (e.g., Joseph Tainter’s complexity theory).
