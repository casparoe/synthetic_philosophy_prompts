  ### Scenario
  In a neighborhood of 100 households planning a one-time block party, each resident can contribute a dish (costing $30 in time and ingredients) or not. Every contributed dish provides $0.50 of enjoyment to all residents, regardless of who contributed. Residents are uncertain about the neighborhood's overall cooperativeness (e.g., due to cultural norms). The proportion of cooperators, \(\phi\), has a Beta(1,3) prior (mean 0.25, effective sample size 4). Each resident's disposition is independently drawn: a "cooperative type" would pay only $20 due to efficiency/altruism, but a "selfish type" pays $30. No communication, reputation, or future interactions exist. Residents know the prior but not their own type. The block party happens once, with no causal links between decisions.

