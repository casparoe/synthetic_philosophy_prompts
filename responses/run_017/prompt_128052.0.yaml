prompt: |-
  I'm putting together a two-page prospectus for a nine-month dissertation fellowship and I cant get the question into one sentence, so I need you to do it for me.

  I'm in philosophy but I share an office with ML people, and something about the way the intentional-stance debate has migrated to language models bugs me. Dennett's justification for the stance is instrumentalist: you're entitled to attribute beliefs and desires to a system because doing so buys predictive and explanatory power you couldn't get more cheaply from the design stance or the physical stance. But that justification seems to presuppose the comparison is actually available — that you can check the intentional story is doing work the cheaper stances can't do. For a frontier language model nobody can run the design stance: hundreds of billions of parameters, no one derives its outputs from its structure. So we attribute beliefs by default rather than on the basis of any comparison, which on the instrumentalist's own terms looks like it should remove the entitlement. And yet the attributions are obviously doing something for us, and I don't think "so stop doing it" is an available response.

  My half-formed way out: maybe instrumentalism was never the real justification, and the real test is prediction of failure rather than prediction of success — a system that genuinely has beliefs should fail in belief-shaped ways, while a lookup table or a bag of heuristics fails in ways no belief-description would have led you to expect. If that's right the test is runnable on small systems where both stances are tractable (tiny trained agents, chess engines with known evaluation functions, hand-written planners), which is exactly the move nobody makes because everyone argues about the big opaque models.

  Turn that into a proposal: one precise question; why the standard positions (instrumentalism, realism about AI beliefs, and the "it's just pattern matching" line) each leave it open; the method — what I'd actually build or run, month by month, over nine months, and what would count as a result; why this route rather than just arguing about whether today's models have beliefs; the possible conclusions and what would decide between them; and an honest paragraph on what would count as the project failing or getting too big. No citations — I've got my own reading list and I'll fill those in.
reasoning: |-
  Okay, let's tackle this philosophy dissertation fellowship prospectus request. The user is struggling to condense their complex idea about intentional stance theory and AI into one sentence, which is crucial for a two-page document. 

  First, I need to understand their core argument: They're challenging Dennett's instrumentalist justification for belief attribution in AI systems. The key problem is that for massive language models, we can't actually compare predictions from intentional vs design/physical stances because the design stance is computationally intractable. Yet people keep attributing beliefs anyway - which seems illegitimate by instrumentalist standards, but pragmatically useful.

  Their proposed solution shifts the focus to failure prediction: True belief systems should fail in belief-shaped ways, while heuristic systems fail differently. They want to test this on small, transparent systems where comparisons are possible - a novel approach since everyone debates big opaque models.

  The user needs a sharp research question that captures: 
  - The legitimacy crisis in belief attribution under computational intractability 
  - The failure-prediction alternative
  - The small-system test strategy

  They also need project structure: 
  - Clear methodology with monthly milestones
  - Defense of this approach over big-model debates
  - Possible conclusions and failure conditions

  The challenge is balancing philosophical precision with conciseness for a fellowship committee. The proposal must show academic rigor while avoiding getting bogged down in citations (they'll add those later). I should emphasize how this bridges philosophy of mind and ML practice - their office-sharing detail suggests interdisciplinarity is a selling point.

  For the one-sentence question, I'll try to encapsulate: Can we justify belief attribution through failure patterns in tractable systems when traditional instrumentalist comparisons fail? The methodology will need concrete examples of test systems (chess engines, small neural nets) and what success/failure looks like for each hypothesis.
answer: |-
  Here's a distilled prospectus framework incorporating your core argument, method, and stakes:

  **One-Sentence Core Question:**  
  Can the legitimacy of intentional-state attribution to opaque AI systems be grounded in empirically testable *failure-mode predictions* derived from tractable small-scale models, circumventing the instrumentalist requirement for unavailable design-stance comparisons?

  **Why Standard Positions Leave It Open:**  
  1.  **Instrumentalism (Dennett):** Requires comparing stance-based predictions, but the design-stance is computationally intractable for frontier LLMs, rendering the instrumentalist justification inoperable *precisely when it's most needed*.
  2.  **Realism about AI Beliefs:** Often sidesteps the justification problem by asserting genuine internal states, but lacks a clear, non-question-begging criterion for attribution applicable to opaque systems.
  3.  **"Just Pattern Matching":** Correctly highlights the lack of mechanistic belief-structure but fails to explain the persistent *utility and apparent coherence* of intentional descriptions in predicting complex behavior, especially failures.

  **Method & Timeline (9 Months):**  
  *   **Months 1-2:** **Define "Belief-Shaped Failure."** Operationalize the concept: Identify specific failure types (e.g., inferential inconsistencies under pressure, goal-subversion under novel perturbations, context-sensitivity breakdowns) predicted *only* by an intentional model, contrasting with failures expected from known heuristic/pattern-matching mechanisms. Develop test scenarios.  
  *   **Months 3-5:** **Build/Run Tractable Testbeds.** Construct or utilize small, *fully analyzable* systems where *both* intentional descriptions and design-stance (actual algorithms/heuristics) predictions are feasible:  
      *   Tiny neural agents (e.g., RL in simple grid worlds) with known architectures/weights.  
      *   Chess/Go engines with published, human-understandable evaluation functions.  
      *   Hand-coded planners/procedural systems with explicit rules.  
  *   **Months 6-7:** **Induce & Analyze Failures.** Systematically perturb environments/inputs to trigger failures. Rigorously categorize failure modes: Do they align with predictions from the intentional model ("belief-shaped") or primarily with predictions from the known design-stance mechanisms ("heuristic-shaped")?  
  *   **Months 8-9:** **Generalize Framework & Assess.** Develop criteria for when failure-mode alignment justifies intentional attribution in opaque systems. Test framework's plausibility against documented failure behaviors of larger, opaque models (e.g., LLM hallucination patterns, goal misgeneralization in RL agents).

  **What Counts as a Result:**  
  *   **Positive:** A robust, empirically grounded framework demonstrating that specific, predictable failure patterns in tractable systems reliably correlate with intentional-model validity *even without design-stance comparison*, and that this framework plausibly extends to opaque AI failures.  
  *   **Negative:** Failure to find consistent "belief-shaped" failure patterns distinct from "heuristic-shaped" ones in tractable systems, or inability to plausibly map the framework onto opaque system failures.  
  *   **Nuanced:** Evidence that failure-mode justification is context-dependent or only applies to specific cognitive capacities.

  **Why This Route?**  
  Arguing *only* about today's opaque models is stuck in an epistemic deadlock. This project breaks the impasse by shifting the *locus of justification*: instead of demanding impossible mechanistic access to giants, it leverages controlled experiments on understandable dwarfs to establish *principles* for attribution grounded in observable behavioral signatures (failures), offering a novel path forward for philosophy of AI and ML interpretability.

  **Possible Conclusions & Deciders:**  
  1.  **Failure-Mode Justification Vindicated:** If distinct "belief-shaped" failures reliably emerge *only* in systems where intentional descriptions are independently plausible in tractable analysis *and* these patterns map onto opaque AI failures. Decider: Strength & consistency of empirical results across testbeds and mapping exercise.  
  2.  **Instrumentalism Needs Refinement:** If failure modes provide *partial* justification but require supplementation. Decider: Gaps remaining in the framework after empirical testing.  
  3.  **"Just Pattern Matching" Robust:** If "belief-shaped" failures are indistinguishable from heuristic failures even in tractable systems. Decider: Failure to find distinct signature patterns despite rigorous testing.  
  4.  **Radical Skepticism:** If the framework fails to provide any reliable justification applicable to opaque systems. Decider: Incoherence of the framework or irrelevance of small-system results to large systems.

  **Failure Conditions & Scope Management:**  
  *   **Failure:** Inability to operationalize "belief-shaped failure" effectively; consistent lack of distinct failure patterns in tractable testbeds; inability to draw any plausible connection to opaque systems.  
  *   **Scope Creep Risks:** Getting bogged down in specific ML implementation details; attempting to build overly complex testbeds; excessive focus on *defining* beliefs rather than *justifying attribution*; trying to definitively solve the hard problem of consciousness.  
  *   **Mitigation:** Strict adherence to tractable, small-scale systems; focus on *predictive patterns of failure* rather than metaphysical essence; iterative refinement of the failure taxonomy based on early experiments; clear exit criteria if core hypotheses are falsified early (e.g., no distinct patterns found by Month 5).

  This framework provides a sharp, novel question rooted in your critique, outlines a feasible empirical methodology grounded in philosophy, clearly differentiates itself from dead-end debates, defines success/failure, and acknowledges risks. Good luck!
