prompt: |-
  I have been reading about T. M. Scanlon's contractualism, on which a principle is permissible only if no individual could reasonably reject it, with rejectability assessed by comparing that individual's situation under the principle against the alternatives. The familiar difficulty concerns principles that would spare a large number of people a very small harm each while imposing a severe harm on one person: because each of the many has only a trivial personal complaint and the one person has a grave complaint, the principle looks rejectable, even though the many trivial harms seem to add up to more than the single severe harm. I keep encountering a variant that does not fit that illustration. In it, a single person would suffer a huge number of individually trivial burdens over a lifetime, such as a small daily irritation for decades, while the alternative is one severe burden at a single time; the trivial burdens together seem to outweigh the severe one, but the framework compares each person's complaint, and it is unclear whether the trivial burdens form one aggregated lifetime complaint, many negligible complaints, or something to be compared one by one with the severe burden. A second instance: the same puzzle arises for a small, tightly bound group that treats the burdens as one collective complaint rather than as many separate personal complaints. Is there an established name for this phenomenon, meaning the treatment of many trivial complaints within a single life or within a tightly unified group, as opposed to across many discrete individuals, or, if not, can you coin and define a term? In your answer, identify the nearest established concepts, explain precisely how the phenomenon differs from each, including the standard case of trivial harms to many different people and any doctrine about the separateness of persons, and say which fits best or why none does; I want the carving and its boundary cases, not a bare label, and I am not asking for citations or a reading list.
reasoning: |-
  Okay, the user is diving deep into T.M. Scanlon's contractualism, specifically focusing on a nuanced variant of the aggregation problem. They've clearly done their homework—they’re familiar with the classic "many small harms vs. one severe harm" dilemma but are now wrestling with a less discussed twist: when those trivial burdens accumulate within a single life or a tightly unified group. Their query is precise and academic, signaling they’re likely a grad student or philosopher working on moral aggregation.  

  Hmm, they explicitly want a term for this phenomenon and a rigorous conceptual dissection, not just a label. The challenge is that while "aggregation problem" is the umbrella term, their variant lacks a canonical name. They’re also hinting at meta-questions about personal identity and group agency—how complaints "cohere" over time or within collectives.  

  First, I need to anchor this in Scanlon’s framework: rejection hinges on individual reasonable complaints, but here the "individual" isn’t straightforward. For the lifetime case, is it one enduring person with a *cumulative* complaint, or countless momentary selves each with negligible gripes? For the group, is their complaint *collective* or just the sum of members’ small complaints?  

  The closest established concepts are:  
  - **The Aggregation Problem (Standard)**: Many separate individuals; complaints don’t aggregate across persons.  
  - **The Separateness of Persons**: Rawls/Nozick’s idea that we can’t sacrifice one for the many; but here the "many" is within one life/group, blurring separateness.  
  - **Prudential vs. Moral Aggregation**: Parfit’s distinction—within a life, aggregation seems intuitive (prudential), but contractualism treats complaints as moral, atomized moments.  

  None fit perfectly because Scanlon’s framework resists aggregating *complaints*, even within a life. The lifetime variant forces us to ask: Does contractualism secretly require a "temporal unity of agency"? And the group case challenges whether "individual" must mean biological person.  

  I’ll coin **Intra-Personal Aggregation Dilemma** for the lifetime case and **Collective Complaint Unity Problem** for the group. The core tension is *complaint granularity*: whether burdens are sliced per moment/per member or holistically. Boundary cases would be:  
  - *Chronic pain* (distributed) vs. *amputation* (acute) for one person.  
  - *Indigenous land loss* (group as complaint-bearer) vs. *corporate fines* (distributed to shareholders).  

  The best fit? Still the aggregation problem, but with a twist exposing Scanlon’s *implicit individualism*. The lifetime case leans closest to prudential aggregation—yet contractualism lacks tools for it. The group case is messier; if the group *is* the moral patient (like a tribe), it might reasonably reject, but if not, complaints dissolve.  

  User’s depth suggests they’ll appreciate this granularity. They’re not just term-hunting; they’re probing contractualism’s limits. Nailing the boundary cases will matter more than the neologism.
answer: |-
  The phenomenon you describe is a distinct variant of the **aggregation problem** within Scanlonian contractualism, challenging how complaints are individuated when multiple trivial burdens accrue to a single entity—either a temporally extended individual or a tightly unified group. While it lacks a universally established name, the most precise descriptive term is the **Intra-Entity Aggregation Dilemma**. Below is a conceptual dissection, contrasting it with established ideas and clarifying boundaries.

  ### Core Phenomenon: Intra-Entity Aggregation Dilemma
  - **Definition**: The problem of whether many trivial burdens occurring *within a single life* or *within a collective entity treated as a unified moral patient* should be aggregated into a single complaint for reasonable rejectability assessments, or treated as separate negligible complaints.
  - **Key Features**:  
    1. **Temporal/Collective Unity**: Burdens are bound by continuity (e.g., one person’s daily irritations over 30 years) or group identity (e.g., a tribe’s shared minor losses).  
    2. **Complaint Individuation**: Whether the complaint is "lifetime-total" (holistic) or "per-burden" (atomistic).  
    3. **Moral Mathematics**: Aggregated burdens may objectively outweigh a severe one-time harm, but contractualism may not "count" them collectively if complaints are discrete.

  ### Contrast with Established Concepts:
  1. **Standard Aggregation Problem (Many Individuals)**:  
     - *Difference*: Involves trivial harms to *many separate persons*. Each has a negligible complaint, and contractualism forbids aggregating across persons (no "complaint summation").  
     - *Boundary*: Here, burdens are distributed across entities (persons), rejecting interpersonal aggregation. The intra-entity variant compresses burdens *within* one entity, forcing debate over *intra*-personal or *intra*-group aggregation.  

  2. **Separateness of Persons (Rawls/Nozick)**:  
     - *Difference*: This doctrine blocks sacrificing one for the greater good of *others*. The intra-entity dilemma concerns burdens and benefits *within a single moral patient* (e.g., lifetime burdens vs. one acute harm *for the same person*).  
     - *Boundary*: If the group is seen as a single agent (e.g., a corporation or cultural collective), the "separateness" doctrine doesn’t apply—it’s about *internal* aggregation, not cross-person trade-offs.  

  3. **Prudential vs. Moral Reasoning (Parfit)**:  
     - *Difference*: Prudential rationality (within one life) easily aggregates burdens, but contractualism evaluates *moral complaints* between individuals. The dilemma arises when a person’s *moral complaint* (for rejection) might differ from their *prudential interest*.  
     - *Boundary*: Scanlon’s framework lacks tools to "import" prudential aggregation into moral complaints without violating individualist foundations.  

  4. **Temporal Neutrality & Personal Identity**:  
     - *Difference*: If a person is a "temporally extended whole," lifetime burdens form one complaint. But contractualism assesses rejectability from individual standpoints—potentially privileging *current* suffering over past/future trivialities.  
     - *Boundary*: A severe present harm may override many past/future trivial burdens if complaints are assessed per moment.  

  ### Which Concept Fits Best?
  - **Closest Fit**: A specialized subcase of the **aggregation problem**, but distinct in its focus on *entity-bound burdens*.  
  - **Why None Fully Fit**:  
    - The standard aggregation problem assumes burdens are *inter*-personal.  
    - "Separateness of persons" ignores intra-entity unity.  
    - Prudential aggregation is descriptive, not normative for contractualist rejection.  

  ### Boundary Cases & Carving:
  - **Lifetime Burdens (e.g., daily pain vs. leg amputation)**:  
    - *Holistic View*: The person’s total suffering forms one grave complaint, outweighing the amputation.  
    - *Atomistic View*: Each day’s pain is a negligible complaint; only the amputation is severe. Contractualism may favor the atomistic view, risking counterintuitive rejections.  
  - **Unified Group (e.g., tribe’s land erosion vs. one member’s death)**:  
    - *Collective Patient View*: The group’s total loss is a severe complaint.  
    - *Individualist View*: Only the deceased member has a severe complaint; others’ minor losses are negligible.  
    - *Boundary Test*: If the group dissolves (e.g., random strangers), the collective complaint vanishes—reverting to the standard problem.  

  ### Proposed Term: **Complaint Granularity Dilemma**  
  - *Definition*: The uncertainty in contractualism over whether to treat burdens within a continuous entity as fine-grained (per-event) or coarse-grained (lifetime/collective-total) complaints for reasonable rejection.  
  - *Advantage*: Highlights the core issue—*how complaints are individuated*—while accommodating both temporal and group unity.  

  This dilemma exposes a tension in Scanlon’s individualism: if a "person" is temporally or collectively unified, should their moral complaints reflect that unity? It remains unresolved, revealing contractualism’s latent assumptions about personal identity and moral agency.
