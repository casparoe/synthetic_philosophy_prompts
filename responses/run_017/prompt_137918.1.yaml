answer: |-
  Based on your requirements, I've developed a concrete decision procedure for distinguishing genuine collectives from non-collective coordination (e.g., single-actor operations or algorithmic convergence). The procedure prioritizes observable evidence, requires no philosophical background, and is designed to survive your reviewer's scrutiny. It's built primarily on **Michael Bratman's theory of shared cooperative activity** (mutual responsiveness + commitment to joint activity/support), as it offers the most testable conditions for small-to-medium groups while allowing adaptation for larger movements. I extend it with Gilbert-style joint commitment for scalability, as Bratman alone would exclude loose movements (which you want to protect).

  ### Core Principles
  1. **Focus on agency, not similarity**: Coordination alone isn't enough. We test whether multiple agents are acting as a collective with shared intention.
  2. **Evidence-based gates**: Each test uses platform-observable data. A fail at any gate stops the process with a "non-collective" verdict.
  3. **Self-description as evidence, not proof**: "We"-language is weighted but never decisive alone (avoids your boss's error).
  4. **Human escalation**: Ambiguous cases or value judgments (e.g., "is this protest authentic?") are flagged for senior review.
  5. **Limitations**: Bot farms/AI personas fail early (Test 1). Algorithmic convergence (Test 5) isn't a collective. The verdict alone doesn't dictate enforcement—authenticity must be assessed separately.

  ---

  ### Decision Procedure: 5 Ordered Tests
  **Each test must be passed to proceed. Fail = non-collective (stop). Pass = proceed to next test. Final pass = collective (hand to human for authenticity/value review).**

  1. **Test 1: Single-Actor Control**  
     - **Question**: Is there evidence of one entity directing all accounts?  
     - **Evidence to check**:  
       - Payment rails (e.g., same source funding 80%+ of accounts).  
       - Device/IP overlap (e.g., >70% of accounts share devices/IPs).  
       - Reused assets (e.g., identical images/videos with matching hashes).  
       - Shared content calendars (leaked or inferred from timing).  
     - **Pass**: None of the above.  
     - **Fail verdict**: Non-collective (single will with many mouths).  
     - *Why?* Rules out PR firms, bot farms, or lone operators. Bratman: No plurality of agents.

  2. **Test 2: Hub Dependency**  
     - **Question**: Is coordination solely top-down (spokes unaware of each other)?  
     - **Evidence to check**:  
       - DMs/docs showing spokes interact only with a hub (e.g., 100% of messages are hub→spoke).  
       - No cross-account communication (e.g., @mentions, replies, shared group chats).  
       - Spokes never reference each other or share resources.  
     - **Pass**: Evidence of cross-participant interaction OR no hub control (e.g., <20% of comms are hub-dependent).  
     - **Fail verdict**: Non-collective (hub-and-spoke).  
     - *Why?* Rules out puppet networks. Bratman: No mutual responsiveness.

  3. **Test 3: Mutual Responsiveness**  
     - **Question**: Do participants adjust behavior to support each other/the joint goal?  
     - **Evidence to check**:  
       - Real-time coordination (e.g., replies to emergent events within 5 mins, not pre-scheduled).  
       - Documented mutual support (e.g., defending others in comments, sharing resources via DMs/docs).  
       - Plan adjustments (e.g., "We changed the hashtag after Sarah's suggestion in the Discord").  
     - **Pass**: Any 1+ clear instance of mutual support/adjustment.  
     - **Fail**: Proceed to Test 4 (not auto-fail).  
     - *Why?* Core to Bratman. Small groups pass here; large movements often fail and move to Test 4.

  4. **Test 4: Joint Commitment**  
     - **Question**: Is there evidence of a shared intention to act *as a group*?  
     - **Evidence to check**:  
       - Public joint goal declaration (e.g., pinned post: "Our goal is to boycott X").  
       - Platform-visible "we"-language (e.g., >30% of posts use "we"/"us" contextually).  
       - Common knowledge of roles (e.g., public assignment of tasks: "John handles graphics").  
       - Shared space for coordination (e.g., public Discord/forum with >50% participant activity).  
     - **Pass**: Any 2+ of the above (e.g., "we"-language + public goal).  
     - **Fail verdict**: Non-collective (or escalate to human if ambiguous).  
     - *Self-description status*: "We"-language is 1 piece of evidence but *never sufficient alone*. It must correlate with other proof of shared goals (avoids your boss's error) but doesn't require Slack (avoids your opposite error).  
     - *Why?* Gilbert-style: Joint commitment creates collective agency. Scalable beyond Bratman.

  5. **Test 5: Algorithmic Convergence**  
     - **Question**: Is identical behavior best explained by platform mechanics?  
     - **Evidence to check**:  
       - Algorithmic amplification (e.g., 90% of accounts viewed the same trending content).  
       - No shared assets/goals (e.g., memes spread organically with unique variations).  
       - Participant unawareness (e.g., posts like "Why is everyone sharing this?").  
     - **Pass**: No evidence of algorithmic push.  
     - **Fail verdict**: Non-collective (pure convergence).  
     - *Why?* Rules out platform-induced mimicry. Not a collective.

  ---

  ### Case Applications
  **Case 1: Marketing Agency (200 accounts)**  
  - Test 1: **FAIL** (shared content calendar, payment rails).  
  - Verdict: Non-collective (single will).  
  - Enforcement relevance: Clear CIB—inauthentic coordination. No human needed.

  **Case 2: Diaspora Activist Network (open call)**  
  - Test 1: Pass (no single controller).  
  - Test 2: Pass (public call isn't a "hub" in the private sense).  
  - Test 3: Fail (no mutual support/adjustment).  
  - Test 4: **PASS** (public goal declaration + "we"-language in posts).  
  - Verdict: Collective. Escalate to human for authenticity review (values call: is this organic activism or covert influence?).  
  - *Why cleared?* Gilbert-style joint commitment via public call + self-description. Fails Bratman but passes Test 4.

  **Case 3: Fan Army (review bomb)**  
  - Test 1: Pass (no payment/shared assets).  
  - Test 2: Pass (Discord shows cross-communication).  
  - Test 3: **PASS** (mutual defense in comments/Discord).  
  - Verdict: Collective. Escalate to human for authenticity review (e.g., are accounts real fans?).  
  - *Why cleared?* Bratman mutual responsiveness.  

  ---

  ### What the Verdict Buys (and Limitations)
  - **Collective verdict**: Flags potential organic movements. Requires human review for authenticity (e.g., "are accounts genuine believers?").  
  - **Non-collective verdict**: Indicates inauthentic coordination (e.g., bot farms) or non-agentic convergence. Enforcement likely.  
  - **Limitations**:  
    - **Bot farms/AI personas**: Fail Test 1 (treated as single actor).  
    - **Algorithmic coordination**: Fail Test 5 (not a collective, but human review needed to confirm).  
    - **Gray areas**: Hub-and-spoke vs. loose movements (Test 2 catches strict hubs). "We"-language without joint goals (Test 4 requires corroboration).  
    - **Theory limits**: Bratman/Gilbert don't perfectly scale to 10,000-person movements. I extrapolated Test 4 to cover this.  
  - **Enforcement value**: Distinguishes "many people acting together" (protected) from "one actor faking a crowd" (enforceable). Doesn't replace authenticity checks.

  This procedure prioritizes your requirements: analyst-friendly, evidence-based, clears cases 2/3 as collectives, and withstands "what makes this a group?" scrutiny. Self-description matters but isn't decisive, and mutual support isn't required for large movements. Use Test 4 as the scalability bridge.
