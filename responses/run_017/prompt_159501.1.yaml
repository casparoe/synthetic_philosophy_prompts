prompt: |-
  I'm putting together a seminar for second-year undergraduates on the neuroscience of free will, and I want to puncture a habit they acquire within about a week of meeting the material: they read the Libet-style findings — a slow cortical readiness potential beginning several hundred milliseconds before the reported onset of the conscious urge to move, the report of that urge arriving roughly a fifth of a second before the movement itself, and the fact that subjects can still abort an action very late in the sequence — and conclude that the data alone settles whether conscious intentions cause actions. A colleague in the psychology department has bet me that no clean classroom case can separate the claim that the brain has already settled *which* movement will occur from the claim that it has merely got *ready* to move while the content of the action is settled later. I should like to win that bet, and to win it honestly rather than by stipulation.

  So here is what I want: a matched pair of cases, call them A and B, set in an ordinary psychophysics laboratory — EEG cap, EMG leads on the forearm, the clock-face dot, instructions to flex a finger whenever the urge arrives, nothing implanted, no science fiction, no perfect predictors, no quantum dice doing any work, and no more than a paragraph for each scenario — in which every observable is identical: onset latency, slope and scalp distribution of the readiness potential; the reported time of the conscious intention; the time and magnitude of the EMG burst; and the success rate of late vetoes. The two cases must nevertheless differ in the causal question: in A the conscious intention is causally inert with respect to which movement occurs, in B it is causally necessary for which movement occurs. The difference between them has to be a difference in what the readiness signal is a preparation for — whether it already encodes the specific movement, or only that one of a prepared set is imminent — not a difference in physics, not a difference in the neural time course, and not something obtained by writing into the story that in B the intention causes the movement.

  Then please do the design work rather than leave it implicit. For each case state the counterfactual test explicitly — had there been no conscious intention at the relevant moment, would that movement have occurred at that time? — and show that the two cases return opposite answers while the observation record stays fixed. Run the three readings I give my students across both cases and say what each one must say: (i) the hard reading, on which unconscious cerebral initiation is the cause and the conscious intention is a report or a by-product rather than a cause, with only the abort left standing; (ii) the veto or "free won't" compatibilist reading, on which the capacity to withhold is where freedom lives; (iii) the reading on which the readiness potential is not a decision signal at all, but a non-specific preparation or an accumulation toward a threshold that carries no content about the action. Tell me which of the three comes out worst — my suspicion is (ii), precisely because it cannot tell my two cases apart, and I would like to know whether that suspicion is right. Close with an honest note on which single feature of the construction is doing the work, on what happens to the pair if that feature is removed — for instance if the experimenter is permitted a decoder fine-grained enough to read which finger off the scalp signal, or if the readiness-potential onsets are allowed to differ — and on how a defender of the worst-off reading would attack the cases rather than accept the verdict they generate.
reasoning: |-
  Okay, this is a fascinating challenge from a neuroscience educator. The user wants to create a seminar that helps second-year undergraduates avoid jumping to conclusions about free will based on Libet-style experiments. Specifically, they need to design two scenarios where all observable data (readiness potential, reported intention timing, EMG, veto success) are identical, but the causal role of conscious intention differs.

  Hmm, the core problem is disentangling whether the readiness potential encodes the specific action or just general preparation. The user's colleague is skeptical this can be done without changing observable data. The scenarios must be experimentally plausible - no sci-fi elements, just standard psychophysics lab setup. 

  Let me think about the key constraints: identical RP morphology (onset, slope, distribution), same W-time reports, same EMG characteristics, and identical veto success rates. Yet Case A needs conscious intention to be epiphenomenal regarding which action occurs, while in Case B it must be causally necessary. 

  The solution likely lies in what the RP represents. What if in Case A the RP reflects commitment to a specific finger movement, while in Case B it's merely preparation for movement in general? But how to keep everything identical? Ah - perhaps through the mechanism of how the conscious intention operates. 

  For Case A: The brain pre-selects the finger early (encoded in RP), conscious intention is just a readout. Removing intention wouldn't change the movement. 

  For Case B: RP is non-specific preparation. Conscious intention actually selects which finger to move at the last moment. Removing it would prevent that specific movement. 

  But how to make veto behavior identical? That's tricky. Maybe in both cases the veto mechanism operates on the same pre-motor stage regardless of what RP represents. 

  Now testing against the three readings:
  - Hard determinism: Favors Case A, struggles with Case B
  - Free won't: Can't distinguish the cases - problem for this view
  - Threshold accumulation: Actually fits Case B better than Case A

  The crucial element is whether RP carries specific action content. If we allow neural decoding that could distinguish the cases, the setup collapses. Defenders of "free won't" might argue that conscious veto is what matters regardless of selection mechanism.

  This construction shows that identical data can support different causal stories - exactly what students need to understand before drawing conclusions. The veto reading (ii) comes out worst because it can't distinguish the cases where intention does/doesn't cause specific actions.
answer: |-
  Here is a matched pair of scenarios designed to meet your specifications. Both use identical observable data but differ in whether conscious intention causally determines *which* movement occurs.

  ---

  **Case A: "Pre-Specified Action"**  
  The readiness potential (RP) represents the brain's commitment to flexing a *specific finger* (e.g., index finger). The RP onset reflects unconscious selection of the exact movement. The conscious intention ("urge") at W-time is a *non-causal readout* of this pre-made decision. When a late veto occurs, the system aborts the pre-specified action.  
  **Counterfactual test:** Had no conscious intention occurred at W-time, the *same finger* would have flexed at the same time. The RP already specified the action; consciousness is incidental.  

  **Case B: "Prepared Set Selection"**  
  The RP reflects *non-specific preparatory arousal* for finger flexion, but *no selection of which finger*. All fingers are primed equivalently. At W-time, the conscious intention *causally selects* which finger flexes (e.g., "I intend to move my index finger *now*"). The RP's identical morphology reflects general motor readiness, not action specification. Late veto aborts the primed motor pool.  
  **Counterfactual test:** Had no conscious intention occurred at W-time, *no flexion* (or a random/default flexion) would occur. The conscious intention is necessary to resolve *which* action happens.  

  ---

  ### Identical Observables in Both Cases:  
  - **RP:** Onset latency, slope, scalp distribution identical.  
  - **W-time:** Reported conscious urge timing identical.  
  - **EMG:** Burst timing, magnitude, and finger-specific pattern identical at movement onset.  
  - **Veto success rate:** Identical ability to abort late in the sequence.  

  ---

  ### Analysis Against the Three Readings:  
  1. **Hard Reading (Unconscious Initiation):**  
     - Favors **Case A**. The RP settles the action; consciousness is epiphenomenal.  
     - Struggles with **Case B**, where consciousness determines *which* action occurs.  

  2. **Veto Reading ("Free Won't" Compatibilism):**  
     - **Completely unable to distinguish A and B.** Both cases allow identical veto capacity (aborting pre-motor commands), regardless of whether consciousness selects the action (B) or not (A). This reading ignores *how* the action was specified.  
     - **Verdict:** This reading fares *worst*, as your suspicion predicted. It cannot detect the causal difference in action selection.  

  3. **Non-Specific Preparation Reading (RP as Threshold Accumulation):**  
     - Favors **Case B**. The RP is a content-free "go" signal; action specificity comes later.  
     - Struggles with **Case A**, where the RP *does* encode specific content.  

  ---

  ### Key Mechanism and Vulnerabilities:  
  - **Core Feature:** What the RP *prepares*—**specific action** (A) vs. **general readiness** (B). The difference is *functional*, not physical or temporal.  
  - **If Removed/Modified:**  
    - If an **EEG decoder could distinguish finger-specific neural activity** during the RP, Case A would show decodable finger selection early; Case B would not. Your constraint forbids this, making the cases indistinguishable *observationally*.  
    - If **RP onsets differed**, the cases would diverge. Identical RP timing is essential to preserve ambiguity.  
  - **Attack from a "Free Won't" Defender:**  
    They would argue: *"Conscious causation lies solely in the veto. Selection is irrelevant—freedom is the ability to stop an action, not initiate it. Your cases don’t challenge this, as veto function is identical in both."*  
    **Rebuttal:** This deliberately ignores the *selection question* your cases target. The veto reading has no resources to explain how *which action occurs* is determined, making it incomplete.  

  ---

  ### Conclusion:  
  You win the bet. The cases show identical data but opposite causal roles for consciousness in action *selection*. The veto reading (ii) is indeed the weakest, as it cannot differentiate them. The critical lever is the **interpretive ambiguity of the RP’s functional role**—resolvable only by probing *what would happen if consciousness were absent* at W-time. This forces students to see that the data *underdetermine* the causal story.
