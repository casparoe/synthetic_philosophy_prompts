  ### Peer Disagreement & Higher-Order Evidence Quiz  
  **Instructions:** For each scenario, pick the option closest to your reaction. Answer based on your intuition, not theory.  

  #### Questions  

  | # | Case | Option A | Option B | Option C | Axis |
  |---|------|----------|----------|----------|------|
  | 1 | You and a friend are equally smart and see the same polling data. You think candidate X will win; your friend thinks Y will win. | A: We interpreted the same evidence differently, and both views could be rational. | B: One of us must be irrational—same evidence can’t support both conclusions. | — | First-order permissivism (A) vs. uniqueness (B) |
  | 2 | A colleague (your peer) adds the same long column of numbers as you. You got £10,000 twice; they got £10,001. The original data is lost. | A: Stick with £10,000—you checked carefully. | B: Treat both answers as equally likely. | C: Suspend judgment entirely—you can’t trust either result. | Steadfastness (A) vs. conciliationism (B/C) |
  | 3 | A peer has a much better track record than you on disease diagnosis but only glanced at the chart. You spent hours and are sure it’s disease X; they say Y. | A: Defer to them—their track record is stronger. | B: Stick with your view—you reviewed the evidence more thoroughly. | C: Split the difference—50/50 on X vs. Y. | Weighting by track record (A) vs. thoroughness (B) vs. peer status (C) |
  | 4 | Last week, exhausted and angry, you concluded your friend lied. Now, calm and rested with the same evidence, you think they were truthful. | A: Ignore last-week-you—your mood made them unreliable. | B: Take it seriously—adjust your current view toward "lied." | C: Give some weight to last-week-you but less than to current-you. | Past-self reliability: non-peer (A), peer (B), or partial (C) |
  | 5 | You formed a belief while on medication that randomly scrambles your confidence (not beliefs). You learn this later. | A: Discard the belief—your confidence was distorted. | B: Keep the belief but adjust your confidence level. | C: Ignore it—the evidence hasn’t changed. | HOE as special (A/B) vs. ordinary evidence (C) |
  | 6 | Six peers disagree with you. You don’t know if they talked first. | A: You’re probably wrong—six outweigh one. | B: Lower your confidence significantly. | C: Stick with your view—they might not be independent. | Group disagreement: deference (A/B) vs. independence skepticism (C) |
  | 7 | A journalist emails you because an expert disagrees with you. They admit they only contact dissenters. | A: The expert’s opinion still challenges you equally. | B: Weaken the weight of their disagreement—agreers weren’t sampled. | C: Dismiss it—the selection bias invalidates it. | Selection bias: irrelevant (A), mitigating (B), or fatal (C) |
  | 8 | After learning about the medication (Q5), you still believe the thing but agree your original belief formation was unreliable. | A: This is rational—you can trust the evidence, not your past self. | B: Irrational—you must abandon the belief. | C: Rational only if you doubt your current confidence too. | Akrasia coherence: yes (A), no (B), qualified (C) |

