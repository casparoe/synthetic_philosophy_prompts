  ### Design Notes  
  - **Axes**: The logical space splits on (1) **first-order uniqueness** (Q1) vs. **permissivism**, (2) **HOE as special** (Q4/Q5/Q8) vs. **ordinary evidence**, and (3) **weighting by peer status** (Q2/Q6) vs. **track record/thoroughness** (Q3).  
  - **Akrasia**: Only **HOE as Ordinary Evidence** and **Permissive Symmetry** endorse akrasia (Q8A) as coherent. Others reject it (Q8B/C) due to internal consistency demands.  
  - **Coverage**: All requested cases (1–6) are included:  
    - Q4 → You-last-week (exhausted).  
    - Q7 → Journalist email (selection bias).  
    - Q5 → Medication scrambles confidence.  
    - Q2 → Long sum, can’t redo.  
    - Q6 → Six peers, independence unknown.  
    - Q3 → Peer’s track record vs. your thoroughness.
