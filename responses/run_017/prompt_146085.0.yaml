  | B, B, C, B, B, A, A, B | **Equal-Weight Conciliationism** | Always move toward peers in disagreement—peer status trumps first-order effort. | If 100 peers disagree, you must near-suspend judgment even if you verified the evidence meticulously. |
  | B, A, B, A, C, C, B, A | **Steadfastness** | Stick to your view if first-order evidence was carefully examined—peer disagreement doesn’t force change. | Risk dogmatism: you might ignore red flags (e.g., 6 peers disagreeing) because you "checked twice." |
  | B, A, C, C, C, B, B, A | **HOE as Ordinary Evidence** | Higher-order evidence (e.g., peer opinions, past states) is just more data—fold it into first-order calculus. | In Q5, medication scrambling your confidence doesn’t alter your belief—even if it suggests systemic unreliability. |
  | A, A, A, A, B, A, C, C | **Calibration/Track-Record View** | Defer to superior reliability (track records) or discount low-reliability sources (e.g., your past self on medication). | In Q3, you defer to the glancing colleague with a good track record—even though you analyzed the evidence deeply. |
  | A, C, B, C, B, C, B, A | **Permissive Symmetry** | Both sticking and moving can be rational—first-order permissivism allows multiple defensible responses to HOE. | In Q6, sticking despite 6 peers is fine, but so is deferring—no "must" in disagreement, risking inconsistent group outcomes. |

