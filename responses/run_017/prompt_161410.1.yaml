answer: |-
  Here is the joint statement drafted as an adversarial collaboration deliverable, designed to isolate genuine disagreements while clarifying common ground for your advocacy work. The structure follows your specifications precisely.

  ---

  **JOINT STATEMENT: ON NEURATH’S ISOTYPE, ITS NATURE AND LIMITS**  
  *Adversarial Collaboration between Marta [Design History] and Sam [Philosophy of Science]*

  ### I. Agreed Historical and Functional Claims  
  *(Both parties endorse these statements without reservation)*  

  1. **Historical Context**: Isotype emerged from Red Vienna’s socialist adult education projects. Its rules (fixed-size pictograms, repetition > scaling, minimal detail) were consciously developed conventions, not "natural" visual language.  
  2. **"Helping Language" Interpretation**: Neurath’s term acknowledges Isotype is *neither* a full linguistic system *nor* arbitrary art. It is a *standardized visual technique* for presenting quantitative social data accessibly.  
  3. **Dependence on Context**: All Isotype charts rely on (a) prior viewer familiarity with basic conventions (e.g., repetition = quantity), (b) captions/explanations for specificity, and (c) physical/cultural context (e.g., museum vs. poster). *No Isotype chart is truly "self-explanatory" without framing*.  
  4. **Empiricism Connection**: Neurath’s antifoundationalism ("boat rebuilt at sea") aligns with Isotype’s rules:  
     - **Against Privileged Viewpoint**: No perspective/detail avoids implying a "correct" visual perspective.  
     - **Intersubjectivity**: Rules enable reproducibility and critique (e.g., "Your chart misrepresents data by enlarging icons").  
  5. **Limits of Abstraction**: Isotype cannot express negation, modality, causality, or contested facts *without verbal supplementation*. Pictograms alone denote only positive, countable entities.  
  6. **Political Flexibility**: Identical symbols *can* serve opposing arguments (e.g., Soviet vs. US health charts) because meaning derives from context/captions, not the symbols themselves. This shows Isotype is a *rhetorical tool*, not a truth-encoding notation.  

  ---

  ### II. Table of Residual Disagreements  
  *Cruxes, Tests, and Predictions*  

  | # | Crux                                                                 | Marta’s Position (Wording She Accepts)                                                                 | Sam’s Position (Wording He Accepts)                                                                 | Test Case                                                                                                | Marta’s Prediction                                                                                                | Sam’s Prediction                                                                                                |
  |---|----------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|
  | 1 | **Does repetition vs. scaling convey magnitude more accurately to untrained viewers?** | "Scaling icons intuitively signifies 'more' without training; repetition requires learned convention." | "Repetition avoids perceptual distortion (e.g., area misjudgment); scaling obscures exact comparisons." | **Your rent-burden chart with repetition vs. newspaper’s scaled version** tested on truly naïve viewers (no exposure to either style). | > Viewers will accurately rank districts by size *faster/more accurately* with scaled icons. Repetition will cause miscounting or disengagement. | > Viewers will make *more precise quantitative comparisons* (e.g., "2x more") with repetition. Scaling will lead to overestimation of differences. |
  | 2 | **Can Isotype conventions function as a notation enabling argument?** | "Isotype’s 'rules' are stylistic constraints for clarity, not logical syntax. Disputes require verbal debate." | "The rules create a shared syntactic framework. Violations (e.g., scaling) are objectively criticizable as misrepresentation." | **The 'evictions prevented' chart**: Both design a version using only Isotype rules + minimal captions. | > Negation *requires* words (e.g., "STOPPED"). Pure Isotype cannot show absence. Chart will be misunderstood without lengthy caption. | > A barred or ghosted icon + arrow can denote prevention within rules. Caption needed only for specificity ("Due to rent cap"). |
  | 3 | **Does Isotype’s intersubjectivity require prior training?**         | "Isotype’s intelligibility is culturally acquired. 'Naïve' viewers see abstract art, not data."        | "The rules exploit innate perceptual grouping. Training refines, but isn’t essential for basic comparisons." | **Your wordless rent-burden poster shown to untrained viewers** (e.g., rural clinic patients unfamiliar with infographics). | > Viewers will *not* recover "500 households per icon" or "rent burden." Most will see "houses in rows," some will guess "more houses = worse." | > Viewers *will* grasp "more icons = worse problem" and rank districts correctly. Few will infer unit scale without caption. |
  | 4 | **Can Isotype represent contested facts neutrally?**                 | "Isotype visualizes data claims; it cannot resolve disputes. Contested numbers demand verbal sourcing." | "Standardized presentation isolates factual disagreements from rhetorical distortion, aiding resolution." | **Chart on contested vacant units**: Identical Isotype for both camps’ claims, differing only in source/caption. | > Viewers will see identical charts as equally credible. The notation *conceals* epistemological conflict. | > Viewers will recognize the *same visual language* forces focus on the numerical discrepancy, not chart design. |

  ---

  ### III. Merely Verbal Disagreements  
  1. **"Language"**: Dispute dissolves if "language" means *syntactic system* (Sam) vs. *rhetorical medium* (Marta). Agreed term: **Standardized Visual Protocol**.  
  2. **"Notation"**: Sam emphasizes *argumentative rigor*; Marta emphasizes *cultural artifact*. Agreed: **Intentional Convention Set**.  

  ### IV. Unresolvable by Testing  
  - **Neurath’s Primary Aim**: Was Isotype *mainly* socialist pedagogy (Marta) or empiricist notation-building (Sam)? Historical evidence supports both; interpretations are synthetic.  
  - **"Foundations" of Perception**: Whether Isotype leverages innate cognition (Sam) or is wholly learned (Marta) touches on foundational debates in cognitive science beyond these tests.  

  ---

  ### Practical Implication for Your Posters  
  **Agreed Recommendation**: Captions are **essential**. They:  
  1. Define units (e.g., "1 house = 500 burdened households"),  
  2. Specify claims (e.g., "Evictions prevented by cap"),  
  3. Source contested data.  
  **Design Goal**: Minimize caption *length* via clear pictograms, but never eliminate them. The "helping language" *requires* words to help.  

  ### Added Test Case: The Conditional Claim  
  - **Crux**: Can Isotype + arrows express causality/conditionality without words?  
  - **Marta**: "Arrows imply sequence, not causation. 'If cap holds' requires text."  
  - **Sam**: "Arrow + falling icons can show 'policy reduces evictions' within rules. Caption clarifies nuance."  
  - **Test**: Draft a "Rising rents → Evictions → If cap, falling evictions" chart.  
  - **Predictions**:  
    - Marta: Viewers will see "then fewer evictions" but miss the conditional without words.  
    - Sam: Viewers will infer causality and policy impact; caption needed only for "rents rise."  

  ---  
  **Deliverable End**  
  *(Formatting note: Print as a 3-page document: Sec I on p1, Sec II as 1-pg table, Sec III-IV + Implication on p3)*  

  ### Why This Works  
  - **No Splitting**: Positions are stated sharply (e.g., Marta’s "scaling is intuitive" vs. Sam’s "repetition prevents distortion").  
  - **Testable**: Predictions are falsifiable (e.g., if untrained viewers *prefer* repetition for accuracy, Marta is surprised; if they grasp unit scale without captions, Sam is surprised).  
  - **Honest About Stalemates**: Flags where philosophy/history diverge irreducibly.  
  - **Practical Payoff**: Unites them on caption necessity while isolating aesthetic/rhetorical choices (repetition vs. scaling) as a *testable design question*—freeing you to pilot both versions.  

  Would you like adjusted wording for any section, or a simplified version for tenants' union meetings?
