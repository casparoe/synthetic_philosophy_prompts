prompt: |-
  Hey — I need you to act as a professional philosopher who also happens to know the history of logical empiricism inside out, and I'd like you to brainstorm for a few minutes before you start drafting (a short list of the moves available, what the tempting-but-wrong version of each side looks like, then the document itself), because I think the obvious versions of both positions here are defective and I'd rather you noticed that up front.

  So the situation. I work on housing data for a tenants' union in my city — i've been the one turning spreadsheets into the posters and slides we put in front of tenants, councillors and the local press — and about a year ago I got two people onto our little volunteer advisory board who have been quietly at each other's throats ever since. Marta is a design historian: she thinks Otto Neurath's picture language (the Vienna Method / Isotype stuff out of the Social and Economic Museum in Red Vienna, Gerd Arntz drawing the flat little figures, Marie Reidemeister doing the "transformation" from raw data into a self-explanatory chart) was never a language at all, that it was visual rhetoric and adult education for a socialist municipality, wholly dependent on captions, on the room and the gallery it hangs in, on the viewer already having been taught how to look, and that calling it international is just the politics of the thing. Sam is a philosopher of science who reads Neurath as part of the wider Vienna Circle search for a perspicuous, intersubjective, checkable notation: he thinks the first rules of Isotype (quantity shown by repeating the same-sized pictogram and never by enlarging it, no perspective, no fussy detail) are exactly the kind of convention that makes a notation something you can argue about rather than just feel, and that Neurath was trying to build an international picture language that would do for social facts something like what mathematical symbolism does for physics. The infuriating part is that they both quote Neurath's own hedge at each other — he knew it wasn't a full language, he called it a helping language, a language-like technique — and each of them thinks that phrase is on their side. Meanwhile I have a practical version of their fight: our rent-burden posters currently carry a paragraph of caption under every chart, and I genuinely can't tell whether that's a crutch we should be designing away or the thing that makes the chart mean anything at all.

  What I want is the joint statement they should have produced. Draft it as the deliverable of a good-faith adversarial collaboration: a numbered section of claims both of them can actually sign (about the historical record, about what the Isotype rules are for and what they aren't for, about what a naïve viewer can and can't recover from a chart, about whether there's any real connection between Neurath's empiricism without foundations — his hostility to any privileged observation language, the boat rebuilt at sea — and his pictures, and about what both of them would take as evidence against their own view), then a table of the residual disagreements, and then for each row: the crux, the two formulations written so each side would accept its own wording, the test or case both grant actually bears on it, and each side's prediction about how that test comes out, written down in advance. If part of the dispute is merely verbal — about the word language, or notation, or rule — say which part and why, and give me the de-verbalised version that survives. Please don't just split the difference: I want formulations each of them would recognises as their own position, and predictions sharp enough to be embarrassed by.

  Here are the cases I'd like used as the load-bearing tests, since these are the ones we actually argue about in our meetings (add one or two of your own, or swap one out and tell me why it's a bad test):

  - our standard rent-burden chart: rows of identical little house figures, one row per district, one house = 500 households paying over 30% of income on rent, not a single word anywhere on the poster. Would an untrained viewer recover the intended comparison, and does it matter that they've never seen Isotype before?
  - the same data redrawn the way our local newspaper does it: one house per district, scaled up in proportion to the number — i.e. in deliberate violation of the first rule.
  - a chart that has to say something negative or counterfactual: the evictions that did not happen last year because of the rent cap. How does Isotype draw that, and how much of it has to be words?
  - a chart that has to express a causal or conditional claim: rising rents lead to evictions, with an arrow; and then, if the cap holds, evictions fall.
  - the same pictograms deployed for opposite politics: Neurath's circle helped set up the Soviet IZOSTAT institute for pictorial statistics, and later produced health-education charts for an American tuberculosis association. If identical symbols carry opposed arguments in different hands, what does that show about whether the notation fixes meaning?
  - a case where the underlying numbers are themselves contested rather than settled: two camps in our city disagree about how many units are really vacant.

  Give me the whole thing in one pass, in a form I could actually print and put in front of both of them, and keep it honest about where the argument is definately not going to be settled by any of the above.
