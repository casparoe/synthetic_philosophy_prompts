answer: |-
  Here are the desiderata for a theory of knowledge-sources (*pramāṇas*) adequate for institutional protocol design in high-stakes clinical settings, derived from your cases and purpose. Desiderata are categorized, justified by cases, and marked for negotiability. Tensions and comparative assessments follow.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  *Derived from the purpose: preventing harm when acting on unwarranted outputs in unauditable contexts.*

  1.  **Non-Collapsibility of Warrant & Reliability**  
      *Case:* Sepsis risk score (reliable population indicator ≠ knowledge source for *this* patient).  
      *Requirement:* Must distinguish between a source’s *actual reliability* and the *warrant for acting* on it in a specific instance. Rules out theories that equate reliability with justification without institutional safeguards.  

  2.  **Handling of Non-Transparency**  
      *Case:* Waveform from an ununderstood device; committee guideline.  
      *Requirement:* Must account for sources whose internal mechanics are inaccessible to the user. Rules out theories requiring personal comprehension of causal mechanisms.  

  3.  **Degradation & Drift Accountability**  
      *Case:* Source with known downward reliability drift; unchecked source.  
      *Requirement:* Must explain how to detect, flag, or decommission sources whose reliability changes over time. Rules out static/reliability-on-average-only theories.  

  4.  **Absence & Negative Knowledge**  
      *Case:* Knowing no anticoagulant is listed.  
      *Requirement:* Must include a source for justified true beliefs about absences/non-occurrences. Rules out perception-only theories lacking *anupalabdhi* (non-apprehension).  

  5.  **Distinction: Source Failure vs. Absence of Knowledge**  
      *Case:* Alarm misrecognized vs. silence when no alarm sounds.  
      *Requirement:* Must differentiate between erroneous outputs and lack of output. Rules out theories conflating ignorance with error.  

  ---

  ### **Negotiable Desiderata**  
  *Needed for robustness but adaptable to institutional priorities.*

  6.  **First Acquisition vs. Confirmation**  
      *Case:* Recollection vs. re-reading vital signs.  
      *Requirement:* Should distinguish novel knowledge from verification. Rules out theories treating memory as perception. *Factional preference.*  

  7.  **Anti-Reductionism for Complex Sources**  
      *Case:* Colleague’s note (testimony); potassium level inference (postulation?).  
      *Requirement:* Should resist reducing testimony/inference to perception alone. Rules out strict empiricist reductions. *Factional preference.*  

  8.  **Context-Specific Reliability**  
      *Case:* Sepsis score’s population vs. individual validity.  
      *Requirement:* Ideally, warrant should reference *this instance*, not just general reliability. Rules out frequentist probabilities alone. *Resource-intensive; may be relaxed pragmatically.*  

  ---

  ### **Factional Preferences / Inherited Prejudices**  
  *Often debated philosophically but not essential for protocols.*

  -   **Short List:** Not required. Institutional protocols can manage complexity.  
  -   **Non-Conceptual Perception:** Irrelevant; clinical data is inherently conceptualized.  
  -   **No Self-Certification:** A Nyāya commitment; protocols can use cross-source checks.  
  -   **Infallible Pramāṇas:** Harmful for protocols (ignores drift/error). Reject.  
  -   **Fixed Number of Basic Sources:** Unnecessary; focus on functional roles.  

  ---

  ### **Tension Structures (Jointly Unsatisfiable Pairs)**  
  1.  **Infallibility vs. Error Explanation**  
      -   *Tension:* If a *pramāṇa* is defined as infallible, it cannot explain systematic errors (e.g., drifted sepsis score).  
      - *Ruled Out:* Nyāya’s *nirvyabhicāritva* (infallibility) requirement.  

  2.  **Self-Certification Ban vs. Anti-Regress**  
      -   *Tension:* If no source can certify itself, and all certifications require a source, certification chains are infinite or circular (e.g., auditing an ML model).  
      - *Ruled Out:* Foundationalist theories without institutional "grounding" (e.g., community testimony).  

  3.  **Source Identity vs. Degradation**  
      -   *Tension:* If a source is defined by its reliable process, a degraded source (e.g., miscalibrated monitor) is "the same source" but unreliable.  
      - *Ruled Out:* Process-essentialist theories lacking temporal/historical parameters.  

  ---

  ### **Most Exclusionary Desideratum**  
  **Non-Collapsibility of Warrant & Reliability**  
  -   Knocks out:  
      - Naive reliabilism (acting on reliable indicators without warrant).  
      - Theories equating statistical reliability with justification (e.g., pure ML deployment protocols).  
      - Individualist epistemology (ignoring institutional warrant structures).  

  ---

  ### **Brief Assessment of Traditional Theories**  
  -   **Perception Alone:** Fails absence, testimony, inference. Unworkable.  
  -   **Perception + Inference:** Struggles with testimony, absence, degradation. Poor for guidelines/unexamined devices.  
  -   **Nyāya (4: Pratyakṣa, Anumāna, Upamāna, Śabda):** Handles testimony/analogy but infallibility requirement clashes with drift. Non-apprehension (*anupalabdhi*) needed for absences.  
  -   **Six Pramāṇas (+Arthāpatti, Anupalabdhi):** Best fit for cases (absences, counterfactuals) but still struggles with degradation/non-transparency.  
  -   **Reductionism:** Collapses testimony into inference/perception → undermines trust in guidelines/charts.  
  -   **Reliabilist/Probabilistic:** Pragmatic but risks collapsing warrant/reliability; needs institutional calibration for warrant.  

  ---

  ### **Recommendation**  
  A modified Nyāya framework **without infallibility**, **with *anupalabdhi*** (for absences), and **institutional testimony** (for guidelines/unexamined sources) best satisfies non-negotiables. Augment with explicit reliability-tracking protocols for degradation. The "warrant vs. reliability" distinction is your keystone for protocol design.
