prompt: |-
  I chair the taxonomy panel of a national wildlife listings board. We meet four times a year and decide, on a written record, whether a named population is to be treated as a distinct species for the purposes of a statute that protects species without ever defining the word. It is six to ten petitions a session. The decisions bite: a listing restricts land use across a wide area, unlocks recovery funding, and is appealable to a tribunal that asks only whether our reasons were adequate, not whether we were biologically right. The panel is three people — a systematist, a population geneticist, and me — and in any given case two of us are not specialists in the taxon on the table. We have about ten days per petition, the evidence is typically one mitochondrial gene tree, a handful of nuclear markers if we are lucky, a morphology table and some field notes, and the finding has to be short enough and plain enough that a non-specialist can follow it, and stable enough that we would reach the same answer again in five years on a different taxon.

  The panel has provisionally adopted one theoretical commitment, and I want it operationalized rather than argued for: that a species is a separately evolving segment of a population lineage, and that the familiar tests — reproductive isolation and interbreeding, monophyly and fixed diagnosable differences, ecological and adaptive distinctiveness, coalescent depth — are not rival definitions of the word but different kinds of evidence bearing on that single claim, which is why they so often disagree. Build the procedure on that, and do not spend the answer defending it.

  What I need is a decision procedure we can run in order, on the record, in the time we have. Specifically: the questions to ask in sequence; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the remaining question is one of values rather than facts. It must have explicit rules for the situations that actually recur — conflicting gene trees; mitochondrial signal contradicted by nuclear data; discordance that could be either incomplete lineage sorting or introgression; contact zones that were never sampled; names attached to a handful of nineteenth-century specimens with imprecise type localities; single-locus evidence; and straight absence of evidence. It needs a rule for when two independent lines of evidence confirm each other versus when we merely have more of the same kind of evidence, and a rule for how much weight the fact that a group is well studied may carry, given that well-studied groups attract more scrutiny and are therefore easier to split. Where a threshold is conventional — how much gene flow is too much, how much divergence is enough, over what time depth — say plainly that it is conventional and fix a default we can apply without reopening the argument each session. There should be three exits: recognize, do not recognize, and defer pending specified data, with deferral available only once per petition.

  Three devices are floating around the board and I want you to rule on them, keeping the ones that earn their place and saying what the others cost: a diagnosability floor, requiring that any recognized lineage be identifiable by a non-specialist from a stated set of characters with a stated error rate, with the absence of a usable diagnostic treated as a hard stop rather than a consideration to be weighed; a defeater clause, requiring each finding to name the single future result most likely to overturn it and to carry a review date; and a strict firewall requiring that the delimitation question and the protection question be voted and written separately, with no leakage from the second into the first — while still saying what the second question is allowed to be once the first is settled.

  Then run it on three hypothetical composites. First: two nominal forms of a stream-breeding salamander in one mountain range, with nine percent divergence at a mitochondrial gene, no fixed differences at four nuclear loci, a four-kilometre contact zone in which about a twelfth of animals are genotypically intermediate and laboratory crosses show no loss of hatching success, and a breeding-habitat difference between cold headwater seeps and warmer mainstem pools.

  Second: an all-female lineage of a freshwater fish that reproduces by gynogenesis — sperm from a sexual relative is needed to trigger development but, on present evidence, contributes no genes — which is morphologically diagnosable, carries a fixed hybrid karyotype, has been separate for something like sixty thousand years, uses a different habitat, is broadly sympatric with its host, and in which the rare paternal leakage reported in a related lineage has never been looked for.

  Third is the one I am dreading. A large, pale insular form of a widespread rodent, described as a full species in 1913, in every regional field guide, the mascot of two fundraising NGOs, protected for thirty years: genome-wide data now place it nested inside the widespread mainland lineage, with an estimated split around eight thousand years ago and gene flow continuing until roughly 1900, and with its three coat-colour loci and its body size plausibly under local selection. Give me the finding the procedure honestly yields. I would rather have a procedure that is sometimes wrong in a known direction than one that lets us steer, so do not bend it to keep this animal listed — tell me what the honest output is, what the protection question can legitimately rescue, and how much of that reasoning I can put in a public written finding.

  Finally, tell me what the procedure cannot do: where it will misfire, which kinds of organism defeat it outright, and which of its steps are judgment calls dressed up as method. Write for a reader with no library access, so no citations, no reading lists, and no appeal to what the literature has settled — just the procedure, the three applications, and the honest limits. Two pages for the finding format itself, if you can.
reasoning: |-
  Okay, the user chairs a taxonomy panel that decides whether populations should be recognized as distinct species for legal protection. They need a practical decision procedure based on the concept that species are separately evolving segments of population lineages. The panel deals with limited data and tight deadlines, so the procedure must be efficient, transparent, and consistent.

  The user specified three key requirements: operationalizing the "separately evolving lineage" concept into sequential questions, handling common data conflicts with explicit rules, and incorporating three devices (diagnosability floor, defeater clause, firewall). They also want applications to three hypothetical cases and an honest assessment of limitations.

  First, I need to design the core procedure. The sequence should start with lineage separation as the threshold question, then move to evidence evaluation using a standardized scoring system. The evidence categories align with common tests (cohesion, monophyly, divergence) but treat them as indicators, not definitions. Weighting rules for when evidence is independent vs. redundant, and how study quality affects scoring, will be crucial for consistency.

  For recurring scenarios like conflicting gene trees or absent data, clear rules must prevent ad-hoc judgments. Thresholds (e.g., gene flow limits) need fixed defaults. The three devices should integrate only if they add rigor without impractical burdens - the diagnosability floor might be too restrictive, while the firewall is essential for impartiality.

  The hypotheticals test real-world application: the salamander case likely fails recognition due to ongoing gene flow; the fish lineage passes as a cohesive hybrid entity; the iconic rodent gets delisted per data but could retain protection via other legal avenues. Each outcome must follow mechanically from the procedure.

  Limitations to disclose include heavy reliance on genetic data disadvantaging poorly studied groups, arbitrary thresholds, and unavoidable judgment in evidence weighting. The procedure won't handle all taxa equally well - asexual or ring species would break it.

  Throughout, I'll avoid theoretical debates per the user's instructions. The focus is on executable steps, defensible trade-offs, and transparency about where convention replaces biological truth. Public findings must separate scientific assessment from protection rationales cleanly, especially for controversial cases like the rodent.
answer: |-
  Here is a species delimitation decision procedure operationalizing the "separately evolving segment of a population lineage" concept, designed for your panel's constraints. It integrates your core commitment, addresses recurring scenarios, incorporates usable devices, and provides explicit exits.

  **Core Procedure: Sequential Questions & Rules**

  1.  **Threshold Question: Is there evidence of a distinct lineage segment?**
      *   **Ask:** Does the petition present evidence suggesting the candidate population represents a historically identifiable lineage segment separate from its closest relatives? (This sets the minimal bar for consideration).
      *   **Evidence Sufficient:** At least *one* line of evidence suggesting separation (e.g., non-overlapping morphology, geographic isolation, distinct mtDNA haplotype group, ecological distinction, unique karyotype). *Absence* of evidence here = **Exit: Do Not Recognize**.
      *   **Recurring Scenario Rules:**
          *   *Single Locus:* mtDNA alone *can* be sufficient initial evidence if divergence is substantial (>5-8% conventional threshold, adjust per taxon if known mutation rate exists). Treat nuclear microsatellites similarly.
          *   *Old Specimens/Imprecise Locality:* Accept as initial evidence if morphology is distinct *and* locality plausibly indicates separation. Flag uncertainty.
          *   *Absence of Evidence:* If *no* data suggests separation (e.g., petition relies solely on minor phenotypic variation within known range), stop here: **Do Not Recognize**.

  2.  **Evidence Evaluation: Does the weight of evidence demonstrate sustained, separate evolutionary trajectory?**
      *   **Ask:** Considering all evidence (cohesion/mating, monophyly, divergence, ecology), does it collectively indicate the lineage segment has evolved separately for a significant period with limited exchange?
      *   **Scoring Evidence (Categories are Independent Lines):**
          *   **Cohesion/Reproductive Isolation (RI):** Evidence of barriers to gene flow *in nature* (not just lab).
              *   *Strong:* Sympatry without/with minimal hybridization (<5% intermediates conventional threshold), strong assortative mating, hybrid inviability/sterility in wild. *Weak:* Allopatry (no test), lab crosses show some reduction. *Contra:* Extensive hybridization/introgression (>10% intermediates), no assortative mating in contact.
          *   **Monophyly/Diagnosability (Mono):** Evidence of shared, distinct ancestry.
              *   *Strong:* Nuclear genome-wide monophyly (e.g., SNP data), fixed diagnostic characters (morpho, karyo, nuclear loci). *Weak:* mtDNA monophyly only, high-frequency differences. *Contra:* Non-monophyly in nuclear data, no fixed differences, mtDNA paraphyly/polyphyly.
          *   **Divergence/Coalescent Depth (Div):** Evidence of time since separation.
              *   *Strong:* Deep coalescence (e.g., >1% per MY divergence across loci, >100k years conventional threshold for significant separation). *Weak:* Shallow divergence, high incomplete lineage sorting (ILS) expected. *Contra:* Very recent divergence (<10k years), panmixia.
          *   **Ecological/Adaptive Distinctiveness (Eco):** Evidence of divergent selection.
              *   *Strong:* Distinct niche (e.g., habitat, diet, phenology) under selection, sympatric occurrence without collapse, local adaptation proven. *Weak:* Allopatric differentiation, inferred adaptation. *Contra:* No ecological difference, plasticity explains differences.
      *   **Weighting Rules:**
          *   **Independence:** RI, Mono, Div, and Eco are treated as distinct *categories* of evidence. Strong evidence in *one* category does not compensate for contra evidence in another *category*. Within a category (e.g., 10 nuclear loci vs. 1 mtDNA gene), more data points are weighted more heavily but count as *one category line*.
          *   **Conflict Resolution:**
              *   Nuclear genomic data generally outweighs mtDNA data when conflicting.
              *   Data from natural populations outweighs lab-only data.
              *   Evidence of current gene flow (genomic) outweighs historical signal (mtDNA) for assessing *current* separation.
              *   Discordance explained by ILS (high expected heterozygosity/shallow trees) is weaker than discordance suggesting recent introgression (localized genomic blocks).
              *   "Absence of Evidence": Lack of data in a category (e.g., no RI study) is neutral. *Contra* evidence (e.g., evidence *of* gene flow) is negative.
          *   **Study Quality:** A "well-studied" group allows higher confidence in *negative* results (e.g., "no hybrids found despite looking" is stronger). It does *not* automatically make splitting easier; rigorous study might reveal hidden connections. Weight based on data quality/comprehensiveness, not study volume.
      *   **Sufficient Evidence & Exit Rules:**
          *   **Strong Evidence in ≥2 Independent Categories:** **Exit: Recognize**. (e.g., Strong RI + Strong Mono; Strong Div + Strong Eco).
          *   **Strong Evidence in 1 Category + Weak/Neutral in others, AND NO Contra Evidence in any Category:** **Exit: Recognize** (cautiously).
          *   **Weak Evidence in ≥2 Categories, AND NO Contra Evidence:** Borderline. Proceed to Question 3.
          *   **ANY Contra Evidence in ≥1 Category:** Presumption against recognition. Proceed to Question 3 only if Strong Evidence in another category outweighs the contra *in the panel's judgment* (acknowledge this as a judgment call).
          *   **Insufficient/Conflicting Evidence:** Where categories conflict (e.g., Strong Mono but Contra RI) or evidence is weak/absent across the board, **Exit: Do Not Recognize**.
          *   **Critical Data Missing:** If a *specific, feasible* type of data is fundamentally lacking and deemed essential to resolve ambiguity (e.g., sampling in a suspected contact zone, key nuclear markers for a mtDNA-divergent group), **Exit: Defer** (Specify exact data required). *Only available once per petition.*

  3.  **Judgment: Is separate evolution the best explanation despite evidentiary ambiguity?** (Where Question 2 yields a borderline or conflicting result).
      *   **Ask:** Considering the totality and the specific nature of conflicts/weaknesses, does the "separately evolving lineage" hypothesis remain the *most plausible* explanation, outweighing alternatives like transient differentiation, clinal variation, or ILS?
      *   **This is a Values/Judgment Step:** No strict rules. Panel weighs the evidence, considers the *nature* of conflicts (e.g., is mtDNA divergence likely due to sex-biased dispersal?), and biological plausibility.
      *   **Exit Rules:**
          *   Majority vote (2-1) that separate evolution is the best explanation: **Exit: Recognize**.
          *   Majority vote that evidence is too ambiguous or alternative explanations are more plausible: **Exit: Do Not Recognize**.
          *   (Deferral not available here; ambiguity must be resolved with current evidence/judgment).

  **Integration of Proposed Devices**

  1.  **Diagnosability Floor: REJECT as a hard stop.** While diagnosability (Mono category) is valuable evidence, making it a mandatory requirement is biologically unsound. Cryptic species are real. Lack of non-expert diagnosability should be noted as a practical conservation challenge but cannot override evidence from genomics or ecology demonstrating separate evolution. *Cost:* Would fail to recognize valid cryptic species, misrepresenting diversity.
  2.  **Defeater Clause & Review Date: ACCEPT (Modified).** Requiring the finding to name the *single most likely future result* to overturn it is excellent for transparency and scientific integrity. Include it in all findings. A fixed review date is impractical. Instead, state: "This determination may be revisited if significant new evidence emerges, particularly [State the Defeater]."
  3.  **Strict Firewall: ACCEPT CRITICALLY.** Delimitation (Is it a species?) and protection (Should it be listed?) MUST be separate decisions/votes. Reasons for listing cannot influence the species determination. **Protection Question (Once Delimited):** "Given the taxonomic determination that [X] is/is not a distinct species, does the available information on its distribution, population status, and threats warrant listing it under [Statute] for protection?" (This allows listing newly recognized species or NOT listing species determined to be invalid synonyms if they are part of a secure broader species).

  **Application to Hypothetical Cases**

  1.  **Salamanders:**
      *   **Q1:** Yes (mtDNA divergence, habitat diff).
      *   **Q2 Evidence:** RI: *Contra* (Contact zone w/ 8% hybrids, lab crosses fertile). Mono: *Weak/Contra* (No fixed nuc diffs, mtDNA div but nuc data conflicting). Div: *Weak* (mtDNA div suggests some age, but nuc data shallow). Eco: *Strong* (Habitat diff).
      *   **Q2 Result:** Contra RI evidence outweighs Strong Eco. **Exit: Do Not Recognize** (Insufficient evidence for sustained separation given significant gene flow).
      *   **Protection Question:** The widespread species might warrant listing based on its status, but the headwater "form" does not get separate recognition/funding.

  2.  **Gynogenetic Fish:**
      *   **Q1:** Yes (Morpho diagnosable, fixed karyotype).
      *   **Q2 Evidence:** RI: *Strong* (Gynogenesis = complete RI from sexual relatives). Mono: *Strong* (Fixed hybrid karyotype, morpho diagnosis). Div: *Strong* (~60k years). Eco: *Strong* (Different habitat). *Note:* Cohesion category isn't directly applicable (asexual), but RI evidence is overwhelming.
      *   **Q2 Result:** Strong evidence in RI, Mono, Div, Eco. **Exit: Recognize** (A separately evolving lineage maintained by its unique reproductive mode).
      *   **Defeater:** Discovery of significant, consistent paternal leakage altering the nuclear genome composition.
      *   **Protection Question:** Separate consideration based on its distinct status/habitat needs.

  3.  **Insular Rodent:**
      *   **Q1:** Yes (Historical treatment, morphology).
      *   **Q2 Evidence:** RI: *Contra* (Genomic data shows gene flow until ~1900). Mono: *Contra* (Nested within mainland, not monophyletic). Div: *Weak* (8k years is shallow). Eco: *Weak/Strong?* (Selection on colour/size plausible, but likely local adaptation within a lineage, not proof of separate *evolutionary trajectory* given gene flow). *Note:* "Well-studied" status increases confidence in the genomic signal.
      *   **Q2 Result:** Contra evidence in RI and Mono categories is decisive. Shallow divergence and plausible local adaptation weak. **Exit: Do Not Recognize**. It is a locally adapted population/subspecies of the mainland species, not a separate lineage.
      *   **Protection Question:** This is CRITICAL. You CANNOT use the taxonomy finding to justify delisting if the *population* is important. The Protection Question allows: "Given that the insular population is part of the widespread [Mainland Species], does this distinct, geographically isolated population with unique adaptations and historical/cultural significance warrant protection under [Statute] as a **Distinct Population Segment** (or equivalent term in your statute)?" **Public Finding:** Be transparent but separate:
          *   *Taxonomy Finding:* "Genomic evidence demonstrates the insular form is nested within and has experienced recent gene flow with the mainland [Species]. It does not meet the criteria for recognition as a separately evolving lineage segment. It is considered a population of [Mainland Species]."
          *   *Protection Finding:* "Despite not being a distinct species, the insular population of [Mainland Species] is morphologically and ecologically distinctive, geographically isolated, and of significant cultural and conservation importance. Based on its discrete and significant characteristics, it warrants continued protection as a Distinct Population Segment under [Statute]." (Cite specific DPS criteria in your law).

  **Limits of the Procedure**

  1.  **Misfires:**
      *   **Recent Speciation with Strong RI/Divergence:** May be recognized before deep monophyly is established (correct biologically, but might seem premature).
      *   **Ancient Lineages with High ILS/Introgression:** May fail to recognize truly distinct species if gene flow signals (even ancient) dominate genomic data.
      *   **Cryptic Species:** Relies heavily on genetic data; morphologically identical species with shallow divergence might be missed without specific genomic analysis.
      *   **Hybrid Speciation:** The procedure can recognize them (like the fish) but might struggle with complex origins if evidence is conflicting.

  2.  **Organisms that Defeat It:**
      *   **Obligate Asexuals (without hybrid origin):** "Lineage" concept applies, but "cohesion" and "monophyly" tests are problematic. Requires heavy reliance on divergence and ecological distinctiveness.
      *   **Ring Species:** Inherently conflict with binary "separate lineage" decisions at contact points. The procedure will likely either oversplit or lump, failing to capture the continuum.
      *   **Poorly Studied Groups with Scarce Data:** The procedure defaults to "Do Not Recognize" without affirmative evidence. Risks missing diversity.
      *   **Microbes/Horizontally Transferring Organisms:** Standard species concepts often break down.

  3.  **Judgment Calls Dressed as Method:**
      *   **Weighing Conflicting Evidence:** Especially between categories (e.g., Strong RI vs Contra Mono). The "outweighs" rule in Q2 requires judgment.
      *   **Interpreting "Contra" Evidence:** Is 11% hybridization "Contra" or just "Weak"? Judgment near thresholds.
      *   **Judging Plausibility in Q3:** Inherently subjective.
      *   **Study Quality Assessment:** Judging data "comprehensiveness" involves discretion.
      *   **Setting Default Thresholds:** While fixed, choosing 5% mtDNA or 10k years initially was a judgment.

  This procedure provides a structured, evidence-based, and transparent framework for making consistent delimitation decisions under your specific constraints, while explicitly acknowledging its inherent limitations and points of judgment. The firewall and defeater clause enhance its legitimacy and scientific robustness.
