  ### Reading the tree  
  Start at the top. At each node, read the concrete case and choose one verdict (A or B) that aligns with your view. Follow the arrow to the next node or leaf. The tree tests foundational commitments and consequences, not initial credence. Answer intuitively if new to the argument. Cases are designed to force distinctions on what makes the hypothesis well-posed, observer counting, selection effects, and normative implications. Leaves represent coherent positions, named or unnamed, with their core and awkward commitments highlighted. The tree has six branch nodes after the entry commitment.

  ### The tree  
  **Entry commitment (all paths):** There exists at least some description of the world we observe that a machine could in principle execute.  

  **Node 1: Duplicate run**  
  *Case:* Identical simulations run on two base-world machines; inside each, an observer wonders about being simulated. How many distinct conscious experiences occur?  
  - **A:** One experience (numerical identity: the same observer "repeated").  
  - **B:** Two experiences (each run has a unique observer).  
  *Routing:* A → Node 2; B → Node 3.  

  **Node 2: Late start**  
  *Case:* A simulation begins in 1800 with fabricated evidence (memories, fossils) for an "older" world. Does this undermine standard ancestor-simulation framing?  
  - **A:** No (evidence is consistent; standard framing holds).  
  - **B:** Yes (framing must generalize; pre-1800 "evidence" is unreliable).  
  *Routing:* A → Node 4; B → Node 5.  

  **Node 3: Pruning**  
  *Case:* Simulators delete "uninteresting" runs; we exist now. How does conditioning on our continued existence affect the simulation hypothesis?  
  - **A:** Strong selection effect: our existence supports the hypothesis (humdrum eras are pruned).  
  - **B:** No effect: the observer ratio dominates; pruning is irrelevant.  
  *Routing:* A → Node 6; B → Node 4.  

  **Node 4: Consciousness requirement**  
  *Case:* A machine perfectly simulates human brain structure but at a coarse grain (e.g., neuron-level, not atomic). Is this sufficient for consciousness?  
  - **A:** Yes (structure alone suffices; substrate/grain irrelevant).  
  - **B:** No (consciousness requires specific substrate/fine grain; e.g., biological).  
  *Routing:* A → Node 5; B → Node 6.  

  **Node 5: Nesting bound**  
  *Case:* If we are simulated, could our simulators be simulated too, ad infinitum?  
  - **A:** Yes (nesting is unbounded; no base reality).  
  - **B:** No (nesting is finite; a base reality exists).  
  *Routing:* A → Leaf 1; B → Node 7.  

  **Node 6: Content beyond glitches**  
  *Case:* Beyond predicting glitches/termination, does the simulation hypothesis imply anything about reality (e.g., our metaphysical status)?  
  - **A:** Yes (it has rich content: e.g., we are "artifacts").  
  - **B:** No (only glitches/termination matter; it's empirically vacuous otherwise).  
  *Routing:* A → Node 7; B → Leaf 2.  

  **Node 7: Normative upshot**  
  *Case:* If we learn we are simulated, does this change moral obligations (to simulators or simulations we create)?  
  - **A:** Yes (e.g., we owe deference to simulators; simulated beings deserve rights).  
  - **B:** No (obligations unchanged; simulation changes nothing normative).  
  *Routing:* A → Leaf 3; B → Leaf 4.  

  *Routing summary:*  
  - Start → Node 1 → (A → Node 2 → (A → Node 4; B → Node 5)); (B → Node 3 → (A → Node 6; B → Node 4))  
  - Node 4 → (A → Node 5; B → Node 6)  
  - Node 5 → (A → Leaf 1; B → Node 7)  
  - Node 6 → (A → Node 7; B → Leaf 2)  
  - Node 7 → (A → Leaf 3; B → Leaf 4)  

  ### Leaves  
  Eight leaves emerge from the tree, covering named positions and logical combinations. Each leaf is defined by a path of verdicts.  

  1. **Infinite nesting advocate** (Path: Node1A → Node2B → Node5A):  
     - Core: Unbounded nesting implies no base reality; we are in a simulation, but so are all "simulators".  
     - Awkward: Must accept an infinite regress of simulations with no ultimate cause or grounding.  

  2. **Deflationist** (Path: Node1A → Node2A → Node4B → Node6B; or Node1B → Node3A → Node6B):  
     - Core: The hypothesis has no content beyond glitch/termination predictions; it's empirically sterile otherwise.  
     - Awkward: Cannot explain why the argument feels metaphysically profound, reducing it to a technical curiosity.  

  3. **Normative transformer** (Path: Node1A → Node2A → Node4A → Node5B → Node7A; or similar via Node6A → Node7A):  
     - Core: Learning we are simulated creates new obligations (e.g., to simulators as creators; to future simulations we build).  
     - Awkward: Demands speculating about unknowable simulator intentions or the moral weight of artificial minds.  

  4. **Ratio conservative** (Path: Node1A → Node2A → Node4A → Node5B → Node7B; or Node1B → Node3B → Node4A → Node5B → Node7B):  
     - Core: The hypothesis has metaphysical content but no normative upshot; observer ratios (if definable) drive credence.  
     - Awkward: Ignores how pruning or nesting might disrupt ratio calculations, leaving credence vulnerable to selection effects.  

  5. **Consciousness chauvinist** (Path: Node1B → Node3B → Node4B → Node6A → Node7B):  
     - Core: Consciousness requires biological substrate or fine grain; simulated minds aren't real minds.  
     - Awkward: Must deny consciousness to advanced AI even if indistinguishable from humans, risking solipsism.  

  6. **Selection effect prioritizer** (Path: Node1B → Node3A → Node6A → Node7B):  
