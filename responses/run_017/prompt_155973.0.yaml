  3. **Deflationist with third disjunct:** Combining Node6B (only glitches matter) with a third-disjunct-like commitment (e.g., via Node1B→Node3B) is missing. Why? Incoherent—the third disjunct is a metaphysical claim about civilization trajectories, conflicting with deflationism’s empirical minimalism.  

  ### What the tree cannot separate  
  Two leaf pairs share verdicts on all cases but differ in their core justifications:  
  - **Ratio conservative (Leaf 4) vs. Measure sceptic (Leaf 8):** Both may answer Node7B (no normative upshot), but the former relies on definable ratios (e.g., via Node5B), while the latter denies ratios entirely (e.g., via Node5A or duplication effects). The tree routes them separately but cannot expose their internal reasoning without credence.  
