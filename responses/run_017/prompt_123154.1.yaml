answer: |-
  Below is a practical, step-by-step checklist designed for a part-time contractor with no typography training. It prioritizes objective, binary decisions where possible and flags subjective steps clearly. The contractor should follow the steps in order, spending no more than 2 minutes total per glyph. Each step includes:  
  - **What to check** (clear, actionable question).  
  - **How to verify** (specific, non-negotiable criteria or tools to use).  
  - **Decision** (accept/reject/kick to expert).  
  - **"Judgment call?"** label where subjectivity is unavoidable.  

  The procedure **cannot**:  
  - Guarantee aesthetic consistency across the entire font family.  
  - Replace expert review for edge cases (hence "kick to expert" options).  
  - Detect subtle handwriting nuances without exemplars.  
  - Assess embroidery output quality (only path validity and basic shape).  

  ---

  ### **Glyph 'a' Evaluation Checklist**  
  *Run in order—stop early if rejected or kicked to expert.*  

  1. **Is it a single, continuous path?**  
     - **Check:** Does the glyph have exactly one unbroken stroke (no pen lifts)?  
     - **Verify:** Watch the drawing replay or inspect the path. If even one break exists → reject.  
     - **Decision:**  
       - **Pass → Go to Step 2.**  
       - **Fail → Reject** (Reason: "Discontinuous path").  
     - *Time estimate: 10 seconds.*  

  2. **Does it have a defined "bowl" and "exit"?**  
     - **Check:** Is there a rounded/circular shape (bowl) with a stroke extending out from the bottom-right?  
     - **Verify:**  
       - Bowl must be ≥60% closed (measure gap size: if gap is >40% of the bowl’s circumference → fail).  
       - Exit must be visible (a tail/stem ≥10% of the bowl’s height).  
       - *Ignore stroke order/direction for now.*  
     - **Decision:**  
       - **Pass → Go to Step 3.**  
       - **Fail → Reject** (Reason: "Missing bowl or exit").  
     - *Time estimate: 20 seconds (use circular measuring tool in software).*  

  3. **Does it match the contributor’s exemplars (if available)?**  
     - **Check:** If the contributor has prior submitted 'a's, does this glyph share core features?  
     - **Verify:** Compare side-by-side:  
       - Single-storey vs. double-storey? Must match (e.g., if all prior 'a's are double-storey, this must be too).  
       - Bowl closure (within ±15% of exemplar gap size).  
       - *Not a judgment call: Use overlay tool to compare shapes.*  
     - **Decision:**  
       - **Matches → Go to Step 4.**  
       - **No exemplars → Go to Step 4.**  
       - **Mismatch → Kick to expert** (Reason: "Inconsistent with contributor’s exemplars").  
     - *Time estimate: 20 seconds.*  

  4. **Is it distinct from 'o' at small scale?**  
     - **Check:** When shrunk to 10mm height, could the 'a' look like an 'o'?  
     - **Verify:**  
       - Scale the glyph digitally to 10mm.  
       - If the exit/stem is invisible at this size **and** bowl closure is ≥90% → fail.  
       - *Judgment call?* **Yes**—contractor must decide if stem is "visible enough." If unsure → kick.  
     - **Decision:**  
       - **Distinct → Go to Step 5.**  
       - **Unclear or indistinct → Kick to expert** (Reason: "Ambiguous at small scale").  
     - *Time estimate: 20 seconds (use scaling tool).*  

  5. **Does it show natural handwriting traits?**  
     - **Check:** Does the glyph have imperfections (e.g., wobbles, speed variations) inconsistent with a traced font?  
     - **Verify:**  
       - Zoom in 200%: look for shakiness in curves, uneven line thickness, or minor asymmetries.  
       - If all lines are mathematically smooth/perfect → flag as traced.  
       - *Judgment call?* **Yes**—rely on zoom tool. If perfectly geometric → reject.  
     - **Decision:**  
       - **Natural → Go to Step 6.**  
       - **Too perfect → Reject** (Reason: "Lacks handwriting characteristics").  
     - *Time estimate: 30 seconds.*  

  6. **Does overstitching cause visible bulk?**  
     - **Check:** If the path doubles back on itself (e.g., retraces part of the bowl), is the overlap excessive?  
     - **Verify:**  
       - Measure overlap length: if any segment is stitched ≥3 times or overlaps >20% of the path length → fail.  
       - *Not a judgment call: Use path-length measurement tool.*  
     - **Decision:**  
       - **Acceptable → Accept.**  
       - **Excessive → Kick to expert** (Reason: "Overstitching risk").  
     - *Time estimate: 20 seconds (skip if no overstitching).*  

  **Final Decision:**  
  - **Accept** (if all steps passed).  
  - **Reject** (if failed any non-judgment step).  
  - **Kick to expert** (if flagged in judgment steps or inconsistency).  

  ---

  ### **Procedure Applied to Your Four Cases**  
  **Case 1: Double-storey 'a' with overstitched segment**  
  - Step 1: Pass (continuous).  
  - Step 2: Pass (bowl + exit present).  
  - Step 3: Pass (if no exemplars) or kick (if mismatched).  
  - Step 4: Pass (double-storey is distinct from 'o').  
  - Step 5: Pass (unless traced).  
  - Step 6: **Kick to expert** (overlap >20% likely → needs bulk assessment).  
  - **Result:** Kicked.  

  **Case 2: Single-storey 'a' in a double-storey family**  
  - Step 1: Pass.  
  - Step 2: Pass (bowl + exit present).  
  - Step 3: **Kick to expert** (single vs. double-storey → automatic mismatch with exemplars).  
  - **Result:** Kicked early (no need for further steps).  

  **Case 3: 'a' with barely closed bowl (merges with 'o')**  
  - Step 1: Pass.  
  - Step 2: Pass (closure ≥60% assumed).  
  - Step 3: Pass (if no exemplars) or kick (if inconsistent).  
  - Step 4: **Kick to expert** (at 10mm, stem likely invisible + bowl closure ≥90% → judgment call).  
  - **Result:** Kicked.  

  **Case 4: Traced Helvetica 'a' (single path, no personal hand)**  
  - Step 1: Pass.  
  - Step 2: Pass (bowl + exit present).  
  - Step 3: Pass (if no exemplars).  
  - Step 4: Pass (distinct from 'o').  
  - Step 5: **Reject** (perfect curves, no wobbles → "Lacks handwriting characteristics").  
  - **Result:** Rejected.  

  --- 

  ### **Why Case 4 Was Caught**  
  The procedure **rejects traced Helvetica** at Step 5 because:  
  - It requires "imperfections" (wobbles, asymmetry) to prove it’s hand-drawn.  
  - Helvetica’s geometric perfection triggers rejection.  

  **If it slipped through:** If the contractor missed subtle tracing (e.g., imperfect but still "close enough" to Helvetica), you’d need to add:  
  1. **Reference overlay check:** In Step 5, add: "Overlay with Helvetica/Arial 'a'. If match >80% → reject."  
  2. **Pressure/speed data:** If your tablets capture drawing velocity or pressure, add: "If stroke speed/pressure is unnaturally uniform → reject."  

  This keeps the checklist sub-2-minutes while catching machine-like precision.
