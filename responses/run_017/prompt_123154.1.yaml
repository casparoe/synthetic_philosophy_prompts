prompt: |-
  Hey — I run a tiny type foundry with one other person, and our main product is crowdsourced handwriting fonts: contributors draw their letters on a tablet, we capture stroke order and direction, and we ship the result for embroidery machines, where each glyph has to be one continuous stitched path (our machines can't do a jump without a thread trim, which customers hate). So two different questions come up dozens of times a week and I need to stop answering them by gut: (1) is this thing an 'a' at all, and (2) is it an 'a' in *this* contributor's hand, given that we only ever see one or two exemplars of their 'a'. My cofounder thinks the bowl-plus-stem double-storey shape is what makes an a an a and that single-storey ones are just circles with a stick; I think the load-bearing part is more like the counter and the way the bottom-right terminal flicks off, and that stroke order matters more than the outline. We're not gonna settle that between us, so I want a procedure that either picks a side out loud or routes around the disagreement.

  What I need is a checklist a part-time contractor with no typography training can run in about two minutes per glyph, in a fixed order, ending in accept / reject / kick it to me. Say what counts as a sufficient answer at each step (the contractor shouldn't have to guess what "looks right" means), where to stop early with a no, and which steps are really judgment calls dressed up as tests — mark those as such. Also say plainly what the procedure can't do.

  Then run it on four cases:

  - a double-storey 'a' made one-stroke by doubling back over the bowl, so there's an overstitched segment
  - a single-storey 'a' submitted into a family where every other exemplar is double-storey
  - an 'a' whose bowl is barely closed and merges with the family's 'o' when it's stitched small, like left-chest-logo size
  - one that clears every test but is basically a traced Helvetica 'a': right letter, single path, nothing of that person's hand in it, and I want to reject it

  If your procedure accepts that last one, say so and tell me what I'd have to add to catch it.
reasoning: |-
  We are designing a checklist for a contractor to evaluate submitted glyphs for the letter 'a' in a crowdsourced handwriting font project. The goal is to have a fixed procedure that ends in one of three decisions: accept, reject, or kick it to the expert (you). The contractor has no typography training and must be able to run it in about 2 minutes per glyph.

  The procedure must address two main questions:
  1. Is this thing an 'a' at all?
  2. Is it an 'a' in this contributor's hand, given that we only have one or two exemplars?

  We'll break down the checklist into steps. Each step should have a clear criterion and an instruction on what to do if the glyph fails. We'll also mark steps that are judgment calls.

  ### Checklist for Glyph 'a'

  **Step 1: Verify it's a continuous path (non-negotiable)**
  - **Check:** The entire glyph must be drawn without lifting the pen (i.e., one continuous path). If there is any break (like a jump) then it's not acceptable for embroidery without a thread trim, which is not allowed.
  - **Sufficient answer:** The drawing must not have any visible breaks in the path. The contractor can inspect the drawing process (if available) or the final path to see if it's one continuous line.
  - **If fail:** Reject. Reason: "Not a continuous path."
  - **Time:** This should be quick to check.

  **Step 2: Basic shape recognition (is it an 'a' at all?)**
  - **Check:** We need to determine if the glyph resembles the letter 'a'. We'll use a set of objective features to avoid relying on gut feeling. We consider both double-storey and single-storey forms as valid, but they must have:
    - A closed or nearly closed counter (the enclosed space) in the bowl area. 
    - A stem (or tail) that extends from the bowl, typically to the right or down.
    - The overall shape must be distinct from other letters (like 'o', 'd', 'q', etc.). Specifically, the bottom-right terminal should not be entirely closed (like an 'o') and should have an exit point that is typical for 'a'.
  - **Sufficient answer:** 
    - If the glyph has a bowl (circular or oval part) and a stem (a line attached to it) and the counter is at least 70% enclosed (so the bowl is not entirely open), then it passes this step. 
    - If the glyph is a single-storey 'a' (like a circle with a stick), that is acceptable as long as the bowl is present and the stem is attached appropriately.
    - If the glyph is a double-storey 'a', that is also acceptable.
    - However, if the glyph is just a circle (like an 'o') or a shape that doesn't have a stem, then it fails.
  - **If fail:** Reject. Reason: "Does not resemble an 'a'."
  - **Judgment call?** Partially. We are setting a threshold (70% enclosed) to reduce subjectivity. The contractor can use a visual guide: if the gap in the bowl is more than 30% of the circumference, then it's too open. Otherwise, it's acceptable.

  **Step 3: Stroke order and direction (for capturing the hand's motion)**
  - **Check:** We care about stroke order and direction because it affects the stitching and the natural look. The contractor should check if the stroke order is consistent with the contributor's other glyphs (if available) and if it is typical for handwriting. However, we only have one or two exemplars, so we must be cautious.
    - For double-storey 'a': Common stroke orders are: (1) starting at the top of the stem, going down, then looping to form the bowl, or (2) starting at the top of the bowl, going around, then down for the stem.
    - For single-storey 'a': Usually, starting at the top of the circle, going clockwise or counterclockwise, and then adding the stem (or vice versa). But note: the stem must be attached without a break.
  - **Sufficient answer:** 
    - The contractor should compare the stroke order and direction to any available exemplars of the same contributor's 'a'. If there is one exemplar, they should look for consistency. If the stroke order is the same, then it passes. 
    - If there are no exemplars, then the contractor should check if the stroke order is one of the common ones (as above). If so, pass. If it is an uncommon stroke order (like starting from the bottom and going up) but still forms a valid 'a', then it may still pass unless it leads to an unnatural look.
  - **If fail (inconsistent with exemplar):** Kick to expert. Reason: "Inconsistent stroke order with contributor's exemplar."
  - **If no exemplar and uncommon stroke order:** Kick to expert. Reason: "Uncommon stroke order, needs review."
  - **Judgment call?** Yes, because without multiple exemplars, it's hard to define consistency. We are marking this as a judgment call.

  **Step 4: Distinctiveness from similar glyphs (to avoid confusion when stitched small)**
  - **Check:** We must ensure that when stitched at a small size (like a left-chest logo), the 'a' does not look like another letter, especially 'o'. This step is critical for the barely closed bowl case.
  - **Sufficient answer:** 
    - The contractor should look at the bottom-right part of the 'a': is there a clear opening or a stem that sticks out? 
    - They should compare the glyph to the contributor's 'o' (if available) at a reduced size (e.g., by zooming out or using a scaling tool). If the 'a' and 'o' become indistinguishable when small, then it fails. 
    - If no 'o' is available, the contractor should use a generic 'o' for comparison. They can also check the closure: if the bowl is closed by less than 90% (meaning the gap is more than 10% of the circumference) then it might be acceptable, but if it's closed by more than 90% and the stem is short, then it might look like an 'o'. 
    - We can set a rule: if the stem is less than half the height of the bowl and the bowl is closed by more than 90%, then it fails.
  - **If fail:** Kick to expert. Reason: "Risk of confusion with 'o' when small."
  - **Judgment call?** Yes, because it involves simulating small size and comparing to 'o'. We mark as judgment call.

  **Step 5: Originality (to capture the contributor's hand)**
  - **Check:** We want to avoid traced fonts (like Helvetica) because they lack the personal touch. However, this is hard to define objectively. We can try:
    - Compare the glyph to a standard font (like Helvetica) by overlaying or side-by-side. If it matches exactly (or very closely) in shape, then it may be traced.
    - Look for natural variations: handwritten glyphs usually have slight imperfections (wobbles, uneven curves, etc.). If the glyph is too perfect and matches a standard font, it might be traced.
  - **Sufficient answer:** 
    - The contractor should look for any natural variation in the stroke (like shakiness, slight curves that are not perfectly round, or variations in line thickness if the tablet captures pressure). 
    - They should compare the glyph to the contributor's other letters (if available) to see if the style is consistent. 
    - If the glyph looks exactly like a standard font (e.g., Helvetica) and lacks any personal characteristics, then it fails.
  - **If fail:** Reject. Reason: "Lacks personal handwriting characteristics (appears traced)."
  - **Judgment call?** Yes, because it requires comparing to a standard and assessing personal style.

  **Step 6: Overstitching (for double-storey 'a')**
  - **Check:** If the glyph is a double-storey 'a' and has been made with one stroke by doubling back, then we get overstitched segments. This might be acceptable if it doesn't cause a blob of thread, but we need to check.
  - **Sufficient answer:** 
    - The contractor should look for segments of the path that are drawn on top of each other (overlapping). 
    - If the overlap is minimal (less than 20% of the path) and the doubled segment is not too long, then it may be acceptable. 
    - However, if the overstitched segment is long (e.g., the entire bowl is drawn twice) then it might cause a visible thickening and should be reviewed.
  - **If fail (excessive overlap):** Kick to expert. Reason: "Excessive overstitching may cause thread buildup."
