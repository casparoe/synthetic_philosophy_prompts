  Looking at their description, the key features are: 1) Earlier competent selves can override later incompetent selves' wishes for medical decisions 2) This authority vanishes if the later self becomes competent again 3) Courts prefer substituted judgment over best interests 4) There's an asymmetry where property binds forever but personal services don't, yet medicine seems to do the opposite. They're particularly interested in whether this requires endurantism (we exist wholly at each moment) or perdurantism (we're sequences of temporal stages).

  The user seems philosophically sophisticated - they're using terms like "endurantism" correctly and have clearly wrestled with Parfit-style questions about psychological continuity. Their frustration with institutional incoherence is palpable. I notice they're especially concerned about dementia cases where biological continuity justifies enforcing directives while psychological discontinuity is used to override current preferences - which does seem like wanting both theories of identity when convenient.

  For my response, I'll follow their requested structure precisely. In section 1 I'll reframe the core tension: medical practice treats the earlier self as having authority over the later incompetent self's body in ways that property law wouldn't allow for personal choices. Section 2 will reconstruct the implicit view as a practical compromise - biological persistence plus psychological authority - rather than a clean metaphysical theory. 

  For section 3, I'll argue the practice doesn't strictly require either endurantism or perdurantism; it's underdetermined and relies on normative commitments about autonomy. Section 4 will show how endurantists see one enduring person whose "true" will is captured earlier, while perdurantists see an earlier stage controlling a later one. The reform in section 6 would make this explicit - treating directives as binding like property easements rather than personal choices - which might actually weaken justification for overriding current suffering.

  The bottom line is that institutions are philosophically opportunistic: they use biological continuity to establish identity (this is still "her" body) but psychological continuity to determine which preferences count ("her" real values). It's messy but practically functional. The user's proposed reform would expose uncomfortable tradeoffs we currently obscure.
answer: |-
  ### 1. The Practice Restated  
  The key feature is that medical law empowers a competent "past self" to override the explicit wishes of an incompetent "present self" regarding bodily treatment (e.g., refusing life support during dementia). This authority vanishes if the present self regains competence—even briefly—and revokes the directive. Where no directive exists, surrogates must prioritize reconstructing the past self’s values ("substituted judgment") over objective well-being ("best interests"). Crucially, this contrasts with property law, where past selves bind future selves indefinitely regarding assets but never regarding bodily choices. The metaphysical tension arises from using biological continuity to link the selves (establishing *whose* directive it is) while using psychological discontinuity to justify overriding the present self’s preferences.  

  ### 2. The Implicit Theory of the Person Across Time  
  The practice assumes a hybrid view of persistence:  
  - **Biological continuity** grounds identity over time (e.g., the demented patient is "the same organism" as the directive-maker). This aligns with **endurantism**—the idea that a person exists wholly at each moment, persisting as a single entity through time.  
  - **Psychological continuity** grounds authority. The competent stage’s values are privileged because they reflect "true" autonomy or **practical identity** (core values, life narrative). When pathology disrupts psychological connectedness (e.g., mania), the present self’s wishes are discounted as inauthentic. This leans toward **perdurantism**—the view that persons are sequences of temporal "stages" (like film frames), with persistence defined by psychological/causal links between stages.  
  The practice avoids strict metaphysical commitments by prioritizing *normative agency*: the stage capable of coherent, values-based decisions speaks for the person.  

  ### 3. Strict Presupposition vs. Comfortable Fit  
  The practice **strictly requires** neither endurantism nor perdurantism. It relies on:  
  - A non-negotiable **biological criterion** for numerical identity (the directive applies *only* to biologically continuous individuals).  
  - A **normative privileging of competent agency** (whichever stage exhibits it sets the "true" will).  
  Both metaphysical theories can accommodate this:  
  - **Endurantists** can argue the enduring person’s "real" will is expressed when competent.  
  - **Perdurantists** can see the directive as binding later stages via psychological links.  
  **Defeating the underdetermination**: If biological continuity were rejected (e.g., a brain transplant), the practice would collapse. If privileged agency were rejected (e.g., valuing present contentment over past autonomy), directives would lose force.  

  ### 4. Two Reconstructions Compared  
  - **Endurantist reading**: The person endures wholly through time. Dementia or mania obscures her "true" self, so the directive enacts her enduring will. This better handles **slow, coherent value changes** (e.g., a secular person becoming devout): if competent, revocation is valid. It struggles with **permanent vegetative states**—where no psychological self exists—yet directives still bind, implying biological identity alone suffices.  
  - **Perdurantist reading**: The directive binds later stages if they share psychological links (values, memories). This better handles **mania**: the manic stage lacks cognitive links to the past self. It struggles with **contented dementia**: if the demented stage is happy, severing psychological links might suggest it deserves independent consideration.  
  **Verdict**: Endurantism better explains biological identity’s role; perdurantism better explains overriding present wishes during psychological rupture.  

  ### 5. The Contract and Property Asymmetry  
  The asymmetry **supports, not undercuts**, the hybrid view. Property law binds assets indefinitely because:  
  - Assets lack subjectivity; their control requires no appeal to psychological continuity.  
  - Bodily autonomy is non-alienable (you can’t sell yourself into slavery) to protect present-stage agency.  
  **Medicine is not an exception but a complement**: It uses biological continuity to establish identity ("this body is hers") and psychological criteria to justify overriding incompetent stages ("this refusal reflects her true will"). Both fields agree that present bodily choices *by competent stages* are inviolable. The difference arises because medicine treats incompetence as negating present-stage authority.  

  ### 6. What the Temporal-Parts Reform Would Change  
  The reform **alters justifications and weightings, not necessarily outcomes**. By treating the later stage as a "distinct welfare subject":  
  - The directive becomes a *constraint* (like an easement) rather than *contemporaneous consent*.  
  - The present stage’s suffering/well-being is weighed *alongside* the directive, not subordinated.  
  This **weakens** directives: enforcing them against a contented demented stage becomes sacrificing one subject (present stage) for another’s (past stage) values. Hospitals would need to:  
  - Define "psychological discontinuity" thresholds (e.g., validated cognitive tests).  
  - Quantify welfare trade-offs (e.g., "Is enforcing this refusal worth the present stage’s distress?").  
  **Outcome shifts**: A Ulysses directive might still bind a manic patient (if links exist), but a refusal of spoon-feeding for a contented dementia patient might be overridden if it causes distress. The reform makes explicit a trade-off the current system obscures.  

  ### 7. Bottom Line  
  The practice **strictly presupposes biological continuity** as the criterion for identity ("whose directive is this?"). It **does not strictly require** a specific metaphysics of persistence but **privileges competent agency** normatively. It is **coherent only if** we accept that:  
  - Biological persistence justifies applying directives to *this* body.  
  - Psychological disruption justifies discounting present wishes.  
  The inconsistency lies in using two distinct criteria (biological for identity, psychological for authority)—a pragmatic, not principled, stance. Philosophically, it’s **luck** that dementia combines biological continuity with psychological discontinuity; a case like gradual personality change would strain the system. The reform exposes this by forcing trade-offs between stages, revealing that the current practice avoids choosing between "who she is" and "what she wants."
