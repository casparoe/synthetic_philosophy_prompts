prompt: |-
  Sorry if this comes out half-baked. I teach early modern metaphysics and I only know the ethics side of the house secondhand, from a reading group a few of us run in my department (we meet in a pub, which may be part of the problem). Every year or so the same pattern comes up, in the readings and in departmental life, and I've started to think its the same pattern, but I can't find a word for it. Three instances. (1) Two colleagues in different departments each push through a big curricular reform against their dean's advice. One looks great two years later because a demographic blip happened to swell enrollments in exactly that area; the other's reform looks like a disaster because the state changed a funding rule halfway through. At the retro the first is described as someone with the courage to take a principled stand, the second as someone who won't listen — but the actual trait, the pig-headedness about the reform, is the same in both, and everyone in the room can see that. (2) Two junior people send near-identical papers to the same top journal. One draws a sympathetic referee and gets it in; the other draws a hostile one, gets desk-rejected, and spends eighteen months revising. Ten years later the promotion files read "publishes in the leading journals" and "aims too high, wastes time" — and here's the bit that interests me most, the second description has by then leaked into wholly unrelated judgments: the same people who say he aims too high also quietly stop trusting him on the budget committee and on hiring. (3) The person who got lucky seems to end up believing the flattering version about herself. A former student of mine took a genuinely reckless gamble on a research program that paid off; she now describes her earlier self as "brave," and that self-description visibly changes what she's willing to try next, so the luck seems to have become a real feature of her practical reasoning.

  What I think I'm seeing is two things pasted together, and I can't tell whether they're one thing. First: when the outcome-driven judgment gets challenged, nobody gives it up; instead the voluntary bit of the conduct gets relocated. The act gets described more broadly — not "he drove home that night" but "he decided to go out drinking at all" — or more narrowly, and in the lucky case it shrinks to something like "he got lucky" — and the relocation happens in whichever direction protects the original reaction. Second: the residue then travels sideways into assessments that have nothing to do with the original act at all. It's obviously in the neighbourhood of the famous discussion of the two drivers, one of whom hits a child, but it isn't quite that, because in my cases nobody is disagreeing about how much the agent controlled. The silent shift is about which bit of behaviour we're counting as the thing she did, and about where the resulting judgment lands afterward.

  So: does this have a name? And I really don't want a bare label and a reading list — I've had enough of people saying "oh that's just X, go read X." I want the carving. Are the relocation part and the sideways-travel part the same phenomenon, or two that merely travel together? What are the nearest established concepts — I'd guess there's something on the action-theory side about how fine- or coarse-grained a description of an action is, something on the ethics side about luck, and maybe something in psychology about judging by outcomes rather than by decisions — and how does the thing I've described differ from each of them, and which, if any, actually fits? Give me the edge cases too: when is re-describing someone's conduct more broadly perfectly legitimate rather than a symptom of this pattern? My guess is it has something to do with whether the broader description is one the agent would have accepted in advance, but I'm not sure. I'd also like a case where the pattern is absent even though all the surface features are there. And note the asymmetry in my examples — the unflattering version seems to survive being debunked while the flattering one collapses the moment you point at the luck — and tell me whether that asymmetry is essential to the thing or a separate fact about us. If nothing established fits, coin the term and define it tightly enough that I could walk into my department meeting on Monday and actually use it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a professor in early modern metaphysics, but they're noticing a pattern in ethics and departmental dynamics. The core issue is how outcomes bias judgments of people's actions, even when the decision-making process is identical. They provided three examples showing how luck influences perceptions and how those judgments persist and spread.

  First, I need to identify the main elements. The user mentions two key parts: the relocation of the voluntary aspect of an action to fit the outcome, and the sideways spread of judgments to unrelated areas. They want to know if this is a single phenomenon or two separate ones, and if there's a term for it. They also want distinctions from existing concepts, edge cases, and the observed asymmetry.

  Looking at existing concepts, moral luck comes to mind. Nagel's taxonomy includes resultant luck, which fits the examples where outcomes affect moral judgment. But the user points out that in their cases, there's no disagreement about control—it's about redefining the action. That's a crucial difference. So moral luck isn't a perfect fit because it focuses on luck affecting judgments of the same action, whereas here the action's description changes post-hoc.

  Then there's outcome bias in psychology, where outcomes influence evaluations of decisions. The user's examples align with this, but they add the relocation and sideways travel. Outcome bias doesn't account for how the judgment migrates to other domains. The halo effect might explain the spreading, but it's more about traits influencing other trait judgments, not necessarily outcome-driven revisions.

  The concept of action individuation is relevant too. Philosophers like Davidson discuss how we slice actions—fine vs. coarse-grained. The relocation part involves shifting the description to protect the initial judgment. The user's insight about whether the agent would accept the broader description pre-outcome is key here. If they wouldn't, it's relabeling; if they would, it's legit.

  Now, are relocation and sideways travel the same phenomenon? They might be linked through cognitive dissonance. When the outcome challenges the initial judgment, relocating the voluntary part reduces dissonance. The sideways spread could be a spillover effect, where the revised trait attribution influences other areas. So they're connected but distinct mechanisms.

  The asymmetry noted—unflattering judgments persist while flattering ones collapse when luck is pointed out—might stem from self-serving bias. People cling to negative judgments to justify their views, while success attributions to luck undermine self-image, leading to quicker dismissal. 

  For edge cases, consider a doctor following protocol where outcomes vary. If a bad outcome leads to blaming their decision to become a doctor, that's illegitimate relocation. But if they deviated from protocol, broader criticism might be valid. The key is whether the agent endorsed the broader scope initially.

  A case where the pattern is absent despite surface features: if both outcomes are neutral, judgments might not shift, or if institutional processes prevent reassessment. Or if there's a strong norm separating domains, the sideways travel might not occur.

  Coining a term: "Retroactive Action Re-individuation and Trait Bleed" (RARTB) captures the two parts. "Re-individuation" for relabeling the action, "Trait Bleed" for the spreading effect. This gives the user a precise term to use in discussions.

  I should also address the user's deeper needs. They want a tool to highlight biased judgments in academia, promoting fairer assessments. Providing a clear framework helps them articulate the issue in department meetings, potentially changing how decisions are evaluated.
answer: |-
  This is a brilliantly observed pattern – and you're right that while it touches on several established concepts, none quite capture the *specific mechanics* you've described: the **post-hoc relocation of the voluntary aspect of an action to protect an outcome-driven judgment**, followed by the **sideways migration of that judgment into unrelated domains**. Let's carve this precisely.

  **Core Diagnosis: Two Interlocking Mechanisms**

  1.  **Outcome-Protected Volitional Relocation (OPVR):**
      *   **Mechanism:** When an outcome (good/bad) triggers a judgment (praise/blame) about an agent, and that judgment is challenged (e.g., by pointing to luck), the *aspect of the conduct deemed voluntary* is strategically redefined (broadened or narrowed) to *protect the original judgment*.
      *   **How it differs:**
          *   *Moral Luck (Nagel/Williams):* Focuses on luck's *influence on the moral status of the agent/action itself* despite lack of control over outcomes. Your cases show luck influencing *how we describe the action* to *preserve* a judgment that *looks* like a luck-influenced moral judgment, but the relocation is the key move. It's not just luck infecting judgment; it's judgment reshaping the action-description to *defend itself* against luck.
          *   *Action Individuation (Davidson, Goldman):* Concerns how we "chunk" actions (fine/coarse-grained). OPVR *exploits* the inherent flexibility in action-description *specifically* as a defense mechanism for outcome-biased judgments. The relocation isn't neutral description; it's motivated reasoning applied to action boundaries.
          *   *Hindsight Bias/Outcome Bias (Psychology):* Explains *that* outcomes distort judgment of decisions/processes. OPVR explains *how* this distortion *operates* when challenged: by shifting the locus of volition within the action-chain. Outcome bias says we misjudge the decision; OPVR shows we redefine *which* decision we're judging.

  2.  **Judgment Trait Bleed (JTB):**
      *   **Mechanism:** The judgment solidified by OPVR (e.g., "pig-headed", "unrealistic", "brave") isn't confined to the original context. It migrates laterally, becoming a perceived character trait that colors assessments in *wholly unrelated* areas (budget competence, hiring judgment).
      *   **How it differs:**
          *   *Halo/Horn Effect:* Similar spread of global positive/negative impressions. However, JTB is specifically about a trait *constructed through the OPVR process* bleeding over. The origin in a contested, outcome-driven judgment relocated for defense is unique.
          *   *Fundamental Attribution Error (FAE):* Focuses on over-attributing behavior to disposition vs. situation. JTB describes *how* a dispositional attribution, *once formed via OPVR*, spreads beyond its original situational context. FAE explains the initial dispositional leap; JTB explains its metastasis. Your cases show FAE *followed by* JTB, cemented by OPVR.

  **Are OPVR & JTB One Thing or Two?**

  They are **distinct but intrinsically linked mechanisms** that typically travel together in this pattern:
  1.  **OPVR** is the *cognitive defense mechanism*: It protects the initial outcome-biased judgment when challenged by relocating the volitional anchor.
  2.  **JTB** is the *consequence*: The judgment, now hardened and dispositionalized ("It wasn't *just* that decision, it's *who they are*"), becomes portable and contaminates other evaluations.
  *   **Link:** OPVR facilitates JTB. By relocating the volition to a broader/narrower action description ("won't listen" vs. "courageous stand"), OPVR transforms a specific act-assessment into a *trait* assessment ("pig-headed person" vs. "principled leader"). Traits, by nature, are expected to manifest across contexts, enabling JTB.

  **Legitimate Redescription vs. OPVR Symptom**

  Redescribing conduct more broadly is legitimate **if and only if the broader description captures an intentional plan, commitment, or pattern *endorsed by the agent as part of their agency* prior to the outcome.**

  *   **Legitimate:** Criticizing the *decision to become a doctor* if someone consistently cuts corners in training, viewing medicine merely as a lucrative career, and a patient dies due to negligence traceable to this attitude. The broader description ("reckless disregard for foundational competence") was implicit in their prior choices/statements.
  *   **Illegitimate (OPVR):** Criticizing the *decision to become a doctor* because a competent, diligent doctor following protocol had a rare, unforeseeable adverse outcome. The broader description ("reckless career choice") wasn't part of the agent's endorsed plan; it's imposed post-hoc to blame the bad outcome. The relocation targets "deciding to practice at all" *specifically* to protect the blame triggered by the unlucky outcome.

  **Edge Case: Pattern Absent Despite Surface Features**

  *   **Scenario:** Two colleagues propose identical, risky research projects. Both succeed spectacularly due to unexpected, independent breakthroughs elsewhere that made their methods viable. Both are praised as "visionary."
  *   **Why the pattern *might not* emerge:**
      1.  **Debunking Doesn't Challenge Judgment:** Pointing out the luck doesn't *undermine* the "visionary" label; it might even enhance it ("They had the vision to pursue it *despite* the apparent impossibility!"). No need for OPVR because the judgment ("visionary") isn't threatened by the luck revelation; it might be reinforced.
      2.  **No Contested Outcome:** Both outcomes were identically good. There's no asymmetry driving defensive relocation for one and not the other.
      3.  **Institutional Guardrails:** If promotion files explicitly separate "outcome luck" from "decision quality" assessments, or if the budget committee operates with strict, objective criteria unrelated to research reputation, JTB might be minimized or contained.

  **The Asymmetry: Why Bad Sticks, Good Fades**

  Your observation is crucial: **The asymmetry is a *separate*, psychologically robust phenomenon, but it *intensifies* the core pattern.**

  *   **Negativity Bias:** Humans are wired to attend to, learn from, and remember negative information more strongly than positive information. A negative trait attribution ("pig-headed," "unrealistic") formed via OPVR carries more weight and persists longer than a positive one ("brave," "visionary").
  *   **Self-Serving Bias (for the observer):** Maintaining a negative judgment about someone else can serve the observer's ego (making them feel wiser/more prudent) or justify past actions (e.g., voting against the junior person's promotion). Letting go of a *positive* judgment about someone else is easier; it costs the observer less. Challenging the "brave" person's luck doesn't threaten the observer's self-view.
  *   **Impact on OPVR/JTB:** This asymmetry makes OPVR *more defensive and persistent* for negative judgments (people fight harder to maintain them) and makes JTB *more pernicious* for negative traits (they spread further and stick longer). For positive judgments, OPVR is fragile – pointing out luck often dissolves the relocated volition ("Oh, I guess it *was* just luck") – and JTB fades quickly once the "trait" is undermined.

  **The Coinage: Retroactive Action Re-individuation and Trait Bleed (RARTB)**

  *   **Definition:** RARTB is a socio-cognitive pattern comprising:
      1.  **Retroactive Action Re-individuation (RAR):** The post-hoc strategic redefinition of the boundaries of an agent's voluntary conduct (broadening or narrowing the description of "what they did") specifically to defend an initial outcome-driven moral or evaluative judgment against challenges (e.g., the role of luck).
      2.  **Trait Bleed (TB):** The subsequent migration of the dispositional judgment solidified by RAR into the assessment of the agent's competence, character, or judgment in *unrelated* contexts.

  *   **Using it on Monday:** "Look, I think we're falling into **RARTB** here. We're judging Jones and Smith's past decisions *based on outcomes we know were largely luck*. But instead of adjusting the judgment, we're retroactively redefining *what they did* – making Smith's decision seem broader ('courageous stand') and Jones's narrower ('just wouldn't listen') – just to protect our initial reactions. Worse, that redefined judgment about Jones being 'unrealistic' is now bleeding over into doubting his budget proposals, which is a completely separate issue. We need to decouple the outcome luck from the evaluation of the *decision-making process at the time*, and definitely stop letting this contaminated judgment infect other domains."

  **Why this fits & differs:**

  *   **Captures the Core:** Explicitly names the relocation ("Re-individuation"), its retroactive/defensive nature ("Retroactive Action"), and the sideways spread ("Trait Bleed").
  *   **Distinguishes from Neighbors:**
      *   *Moral Luck:* RARTB is about *how judgments defend themselves* via action-redescription; moral luck is about the *problem* of luck's influence.
      *   *Outcome Bias:* RARTB explains the *mechanism* (RAR) and *downstream effect* (TB) of outcome bias when challenged.
      *   *Halo/Horn/FAE:* RARTB specifies the *origin* of the trait (OPVR/RAR) and its *migration path* (TB), going beyond the general tendency.
  *   **Handles Asymmetry:** While the asymmetry (Negative RARTB > Positive RARTB) is driven by separate biases, RARTB provides the framework *within which* this asymmetry plays out and becomes particularly damaging.

  You've identified a profound and pernicious pattern in practical reasoning and institutional judgment. RARTB gives you the conceptual carving knife to dissect it in the pub, the classroom, and that department meeting. Good luck! (And may your judgments of others – and their judgments of you – be free of its effects).
