  I'll include a concrete test case: a predictor with output bits, where hypotheses include simulators checking if P outputs "1." Malign camp predicts P is forced to output 1; benign expects no distortion if simulators are equally likely.

  Verbal disputes to flag: Whether the prior's "malignity" matters if we only care about predictive accuracy vs. decision-making, and if the output is a distribution vs. action.

