  First, I need to map the sestina's structure to the probabilities. Since stanza endings rotate as 6-1-5-2-4-3, the numbers must appear as endings only in stanzas that describe their corresponding methods. So: "third" must end the endpoints method stanza, "half" the radial distance method, "quarter" the midpoint method. The word order needs careful choreography—let me sketch this... 

