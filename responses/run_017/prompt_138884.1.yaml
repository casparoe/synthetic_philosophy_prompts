  Perfect. Now to assign the probability methods:  
  - Stanza 3 ends with "half" → radial distance method (1/2)  
  - Stanza 4 ends with "third" → endpoints method (1/3)  
  - Stanza 1 ends with "quarter" → midpoint method (1/4)  

  The other stanzas (2,5,6) can explore themes like the surveyor's perspective or the nature of randomness. The envoi will consolidate the core insight: "random" describes the method, not the chord.  

  For accuracy:  
  - *Endpoints method:* Two points chosen independently on circumference. Chord longer than side when arc >120°. Probability 1/3.  
  - *Radial distance:* Distance d from center along fixed radius, chord perpendicular. Chord longer when d < r/2. Probability 1/2.  
