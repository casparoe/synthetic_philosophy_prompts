  ...and so on. Wait, no—stanza 2 should start with the last end-word of stanza 1 ("quarter") then proceed in order 1-5-2-4-3.  

  Right:  
  - Stanza 1 ends: quarter  
  - Stanza 2: quarter → circle → half → chord → third → random (ends random)  
  - Stanza 3: random → quarter → third → circle → chord → half (ends half)  
