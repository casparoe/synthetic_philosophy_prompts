  Since dE/dq = -2 -2q <0 for all q, so E decreases in q, so max at q=0.

  If q=0, always continue, E= C=3.

  At interim, if always continue, P(first|int)=1/2, P(second|int)=1/2

  E[exit now]= P(second|int) B = (1/2)*4=2

  E[continue now]= C=3

  Since 3>2, he prefers to continue, consistent.

  If he considers exiting, E[exit now]=2<3.

  Another case, suppose A=0, B=10, C=1.

  Then q = (0+10-2)/[2(10-1)] =8/(18)=4/9

  E at q=4/9: q A + (1-q)q B + (1-q)^2 C = (4/9)(0) + (5/9)(4/9)(10) + (5/9)(5/9)(1) = 0 + (20/81)*10 + 25/81 *1, better: (1-q)q B = (5/9)(4/9)(10) = (20/81)*10 = 200/81

  (1-q)^2 C = (25/81)*1 =25/81

  So E= 200/81 + 25/81 = 225/81 = 25/9 ≈2.777

  At interim, q=4/9, P(first|int)=1/(2 - 4/9) =1/(18/9 - 4/9)=1/(14/9)=9/14

  P(second|int)= (1 - 4/9)/(2 - 4/9) = (5/9)/(14/9) =5/14

  E[exit now]= P(first|int) A + P(second|int) B = (9/14)*0 + (5/14)*10 = 50/14 ≈3.571

  E[continue now]= P(first|int) [q B + (1-q)C] + P(second|int) C = (9/14) [ (4/9)*10 + (5/9)*1 ] + (5/14)*1 = (9/14) [40/9 + 5/9] + 5/14 = (9/14)(45/9) + 5/14 = (9/14)(5) + 5/14 = 45/14 + 5/14 = 50/14 ≈3.571

  Again equal.

  So in all cases, at the optimal strategy, when at an intersection, you are indifferent between exiting and continuing, given that you will use the same strategy at the other intersection.

  Therefore, in your first approach, it is correct, and the 3/5 is right for the given payoffs.

  The second approach is flawed because it assumes you can have a different action at the second intersection, which you can't due to absent-mindedness.

  So to summarize:

  1. The correct evaluation is to assume that your other self follows the same strategy, leading to indifference at the optimal point.

  2. The indifference is general for this problem when the optimal strategy is mixed and interior; it results from the optimization condition.

