answer: |-
  Here's a systematic dissection of "revolutions devour their own children," evaluated against your historiographical frameworks and commitments requested.

  ### I. Dissecting the Claim: A Menu of Interpretations & Verdicts

  1.  **Frequency Claim:** "A large share of revolutions purge prominent early participants."
      *   **Verdict:** **Defensible, but requires qualification.** Many revolutions *do* experience significant purges of early leaders (French, Russian, English, Iranian, etc.). However:
          *   *Denominator Problem:* Defining "revolution" is contested (e.g., American Revolution? Glorious Revolution? 1848?). Counting "purges" is messy (execution? exile? political marginalization?). Selection bias favors bloody, dramatic cases.
          *   *Counterexamples:* Revolutions exist without major purges of *founders* by the *same revolutionary regime* (e.g., American Revolution – though factionalism existed, Washington wasn't purged).
          *   **Conclusion:** It's a common pattern, but not universal. Stating it as an inevitability overreaches the evidence.

  2.  **Mechanism Claim (Coalition Heterogeneity):** "The broad coalition needed to overthrow a regime is inherently unstable; the successor state must shed incompatible factions to consolidate power."
      *   **Verdict:** **Substantive and Defensible.** This captures a core dynamic. Revolutions often unite diverse groups (moderates, radicals, opportunists) with conflicting goals. Post-victory, differences become irreconcilable. Eliminating factions seen as threats (too moderate, too radical, too independent) is a logical step towards building a stable governing coalition. This is observable in the French Revolution's progression.

  3.  **Lawlike Necessity Claim:** "It is an inevitable, universal law that revolutions *must* devour their children."
      *   **Verdict:** **Probably False and Confused.**
          *   *Counterexamples:* See Frequency claim.
          *   *Overdetermination:* Purges result from specific *contingent* factors (personalities, war, economic crisis, misperceptions) interacting with structural pressures. Calling it a "law" ignores historical contingency and agency.
          *   **Conclusion:** A rhetorical overstatement, not a historical law. Useful as metaphor, dangerous as explanation.

  4.  **Functional Mechanism Claim (Threat Elimination):** "Early revolutionaries possess dangerous skills/networks/militias; eliminating them is essential for state consolidation."
      *   **Verdict:** **Substantive and Defensible, often complementary to #2.** This focuses on a specific *reason why* factions are shed. Danton's popularity, Hébert's sans-culotte connections, or Robespierre's own incorruptible image *were* perceived threats. Eliminating potential rivals is a classic move in power consolidation, revolutionary or not. Explains *targeting* within the broader purge.

  5.  **Definition of 'Children':**
      *   *Founding Generation:* **Defensible Core Meaning.** Refers to those who initiated or were prominent early leaders (Girondins, Dantonists). Most common usage.
      *   *Most Radical Products:* **Less Defensible.** While radicals often purge moderates *first* (e.g., Montagnards vs. Girondins), the "children" phrase typically describes the *turn* against the radicals *themselves* later (Hébertists, then Danton/Desmoulins, finally Robespierre). The "children" are the makers, not necessarily the most extreme.
      *   *New Kind of Person:* **Metaphorical Stretch.** Possible interpretation (the Revolution destroys the idealistic citizen it created), but not the primary historical referent.
      *   *Ideals/Promises:* **Metaphorical/Philosophical.** Valid interpretation of revolutionary disillusionment, but moves significantly away from the historical claim about purging people.

  6.  **Agent of Devouring:**
      *   *The Revolution (as abstract force):* **Confused/Reification.** Useful shorthand, but risks obscuring agency. Revolutions don't act; factions/individuals/institutions do.
      *   *Leadership Faction:* **Defensible.** A specific group (e.g., Robespierre/Saint-Just/Couthon using the CPS and CGS) targets rivals to maintain/consolidate power.
      *   *Impersonal Process (Competitive Virtue Signaling):* **Defensible.** The Terror created incentives where proving revolutionary zeal often meant denouncing others. Unverifiable "virtue" made accusations potent and cheap. This *enabled* factional purges but didn't cause them alone.
      *   *Emergent Outcome (No Single Agent):* **Defensible.** Result of complex interaction: factional rivalry, fear of counter-revolution (real/imagined), institutional dynamics (CPS vs CGS), war pressures, ideological radicalization, personal ambitions.

  7.  **Scope of 'Devouring' (Target Cases & Methods):**
      *   *Founders killed by later generation:* **Rare.** Robespierre was a *very* early leader (Estates-General, Jacobins). Purges were largely *intra-generational*, peer factions eliminating each other sequentially.
      *   *Extends beyond execution?:* **Essential Consideration.** If "devouring" includes exile, imprisonment, political destruction, or marginalization (e.g., Lafayette, Mirabeau's posthumous disgrace, later Thermidorians), the frequency increases dramatically. Limiting it to execution understates the phenomenon. The *process* of elimination is key.

  ### II. Historiographical Evaluation: Does "Devouring" Support or Undermine Each Reading?

  1.  **Class-Struggle Reading:**
      *   **Carries Inference?** **Yes, potentially.** The visitor's line ("just what revolutions do") *can* be made compatible. Purges could reflect shifting class alliances (e.g., Montagnards breaking from bourgeoisie/Girondins, then needing to control the sans-culottes/Hébertists). The Terror consolidates bourgeois revolutionary power by eliminating rivals from other classes or factions threatening bourgeois dominance. No special *ideological* logic needed beyond the underlying class conflict driving factionalism. **Verdict:** Equally available mechanism.

  2.  **Ideological/Political-Culture Reading:**
      *   **Carries Inference?** **No. Supports Classmate.** The visitor's dismissal ("no special ideological story needed") is precisely what this reading challenges. The classmate argues the *specific logic* of revolutionary ideology (popular sovereignty, virtue, suspicion of representation/faction, the need for unity against enemies, the slippery slope of "purity") creates an *internal dynamic* that fuels suspicion and necessitates purging even erstwhile allies. The "devouring" isn't just "what happens," but a consequence of the *meaning* and *demands* embedded in the revolutionary discourse itself (e.g., Rousseau's general will, fear of conspiracy). **Verdict:** Supports classmate; the mechanism is *inherently* ideological.

  3.  **Contingency/War-Emergency Reading:**
      *   **Carries Inference?** **Yes, strongly.** This reading sees the Terror, including the purges, as primarily driven by the existential crisis – foreign invasion, civil war (Vendée), economic collapse, and pervasive fear of counter-revolution/treason. Purges are a brutal response to perceived threats *amplified* by the emergency. Danton is executed not for ideological impurity *per se*, but because he's seen (rightly or wrongly) as a defeatist or corrupt obstacle to total war mobilization in a moment of extreme peril. The "devouring" is a tragic byproduct of survival mode. **Verdict:** Carries visitor's inference perfectly; purges are explained by circumstance, needing no deep ideological logic.

  ### III. Commitments & Final Verdict on the Line

  1.  **Most Defensible Reading of the Terror (including purges):** **A synthesis emphasizing Contingency/War-Emergency as the primary catalyst, channeled through and radicalized by Ideological/Political-Culture mechanisms, within the broader context of Class Struggles and power consolidation.** The war created an environment of panic where the ideological tools of virtue, suspicion, and popular justice became lethal weapons in the hands of factions battling for control amidst chaos. Class tensions provided the fault lines for those factions. The "devouring" was not inevitable, but a horrifyingly plausible outcome of this combination under extreme duress. *(This extrapolates beyond pure evidence by weighting factors, but reflects the complex consensus that no single factor suffices, though the emergency is often seen as the indispensable spark for the Terror's intensity).*

  2.  **Reading People Normally Run with the Line:** People invoking "revolutions devour their own children" typically rely on a vague blend of **Frequency Claim + Mechanism Claim (Coalition Heterogeneity/Threat Elimination)**, often leaning towards **Reification ("The Revolution" as agent) and Lawlike Necessity.** It's used as a fatalistic, world-weary explanation implying historical inevitability and cynicism about revolutionary idealism, often downplaying specific contingency or ideology.

  3.  **Does the Line Do Real Work in the Argument?** **No, it does harmful work.** In the context described:
      *   **Obfuscates:** It shuts down analysis ("this is simply what revolutions do") rather than opening it up. It replaces explanation with a rhetorical trope.
      *   **False Equivalence:** It implies the *only* explanation needed is the generic "revolutionary process," ignoring the specific, testable mechanisms proposed by the classmate (ideological logic) or others (emergency, class).
      *   **Uncritical Acceptance:** It relies on an assumed, unexamined frequency/inevitability that doesn't hold up to scrutiny (see Frequency/Necessity verdicts).
      *   **Undermines Discernment:** It prevents asking *why this specific purge happened at this specific time?* Was it Hébert's radicalism threatening control? Danton's peace talks during crisis? Personal rivalry? Ideological divergence? The line suggests the answer is always the same.
      *   **Conclusion:** The line is a **platitudinous conversation-stopper masquerading as profound insight.** Its best readings (#2, #4 Mechanism Claims) are defensible *components* of explanation, but require specific historical context and do *not* negate the need for other factors like ideology or contingency. Used as the visitor did, it's intellectually lazy and hinders genuine historical understanding. Your classmate's argument, whether ultimately correct or not, deserved a specific rebuttal addressing the *mechanism* of ideological radicalization, not dismissal via aphorism.
