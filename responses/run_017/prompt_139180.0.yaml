prompt: |-
  I have been reading rationalist blogs and forums for about a decade, so I came to Parfit's teletransporter argument secondhand — the fission case, the claim that identity is not what matters, the thought that survival comes in degrees — and I had always filed it under intuition pumps with no cash value. Then two things happened in my own family that make me think the question is not academic at all. Last winter my uncle had a brain hemorrhage and was declared dead by neurological criteria while he was still warm, still on a ventilator, still with a beating heart; the hospital asked whether we would donate his organs, and we said yes. A year earlier my grandmother had died with end-stage Alzheimer's, at a point where there was almost nothing left of the person — no memory, no recognisable character, no capacity to form or act on the simplest intention — and yet everyone from the hospice nurse to the probate court treated her as unambiguously alive and as the very same person whose decades-old advance directive still bound what could be done to her body. Same legal system, same hospitals, two apparently flatly different answers about what has to continue for the person to still be there, and I have been going in circles trying to say precisely where the inconsistency lies.

  Here is the cluster of practices I mean, as concretely as I can put it. Death in most of the United States is defined by a statute descended from a uniform model act that most states adopted in the early 1980s: a physician may pronounce death either on the basis of irreversible loss of circulatory and respiratory function or on the basis of irreversible loss of all functions of the entire brain, brainstem included, and the two routes are treated as interchangeable routes to the same fact, though jurisdictions differ over whether the whole brain or only the brainstem must have stopped. Transplantation runs on the dead donor rule, the rule that organs are not to be taken from someone who is alive, and yet a large share of donors are brain-dead patients with beating hearts and ventilated, warm bodies who are wheeled into an operating theatre and opened up while looking, to any layperson, alive. Where donation instead follows the circulatory route, the wait after the heart stops is a matter of minutes, and the bioethics literature openly describes the standard as permanence rather than irreversibility — the patient will not be resuscitated because we have decided not to, not because nobody could. Meanwhile, down the same corridor, a patient in a persistent vegetative state or with end-stage dementia is a living person with full legal standing, whose prior instructions and property rights are still in force, and from whom taking a kidney would be murder.

  I also notice that the people who take this question most literally in practice have quietly settled on an answer: the cryonics organisations charge substantially less to preserve just the head than to preserve the whole body, treat their legally dead clients as patients with continuing interests and continuing contracts, and some of them propose dodging the copy problem altogether by replacing the brain a small region at a time with functionally equivalent hardware, so that there is never a moment of discontinuity and never a second copy to argue with the first. So here is what I want. What view of what matters in survival does this whole apparatus — the neurological criterion, the dead donor rule, the treatment of the demented and the vegetative as still present — actually presuppose? Is it the psychological-continuity view; or something thinner, like the claim that the substrate of consciousness sits in this organ; or only a bright line that several incompatible metaphysics could equally live with? Which rival views does the practice strictly rule out, as opposed to merely sitting badly with — does it really rule out the view that what matters is the continuing life of the human organism, and does it really rule out a demanding psychological-continuity view, given that such a view would make my grandmother both dead and available as an organ source? Where is the practice philosophically underdetermined, such that two or three theories would license exactly the same behaviour, and where is it instead doing genuine metaphysical work that an administrator could not quietly drop? And then take the three rivals one at a time — the organism view, a strict psychological-continuity view, and a view on which survival is degreed with no further fact — and tell me what exactly would have to change in the practice if each were the one we adopted: which declarations would become impermissible, which would become mandatory, and which current distinctions would collapse. Please do not give me a survey of the literature, a reading list, or citations; I want the implicit theory reconstructed, the parts that are substantive separated from the parts that are administrative convenience, and a straight verdict on whether the whole thing is coherent.
reasoning: |-
  Okay, let me start by really unpacking what this user is grappling with. They've been deep into rationalist circles for a decade, so they're familiar with Parfit's teletransporter thought experiment but dismissed it as mere intuition pumping. Now, real-life events—their uncle's brain death and grandmother's Alzheimer's decline—have forced them to confront the practical inconsistencies in how we define life, death, and personhood. 

  Hmm, the core tension they're highlighting is stark: same hospitals, same legal systems, yet two opposite treatments. Uncle declared dead while physiologically "alive" (heart beating, organs harvested), grandmother treated as fully alive despite near-total psychological dissolution. The user wants to know what underlying theory of personal identity makes this mess coherent—or if it even is coherent.

  First, I need to dissect the legal/medical apparatus they describe. Brain death = legal death for organ harvesting (dead donor rule), but permanent vegetative state ≠ death. Circulatory death relies on "permanence" (we won't resuscitate) not true irreversibility. Meanwhile, advanced dementia patients retain legal personhood. Cryonics adds another layer—treating legally dead heads as having ongoing interests.

  *scratches head* So... what's the implicit metaphysics here? It can't be pure biological continuity (organism view), because brain-dead bodies are biologically functional yet legally dead. It can't be strict psychological continuity, because dementia patients have near-zero psychological continuity yet are legally alive. 

  Ah! The unifying thread seems to be brainstem function as a proxy for "system integration." Brain death kills the organism's unity; dementia kills the mind but not the organism. The law is secretly Cartesian—treating the brainstem as the body's control room. But this falls apart under scrutiny: why is a ventilator-dependent body "dead" while a dementia-ravaged mind is "alive"? 

  *mental note* Must emphasize the administrative convenience angle. The whole system relies on bright lines: brain death = clean cutoff for organ harvesting, dementia = no bright line so default to biological life. Cryonics reveals where the system strains—they're betting on future consciousness restoration, so they treat "dead" heads as having interests. 

  For the rival theories: 
  - Organism view would forbid harvesting from brain-dead donors (they're biologically alive!) and might consider dementia patients "dead" earlier. 
  - Psychological continuity view would force declaring dementia patients dead (no identity-preserving links) but protect locked-in syndrome patients more. 
  - Degreed survival view... this gets messy. Harvesting organs from dementia patients might be permissible if "survival" is low enough, but how do we measure? 

  The verdict? Coherent only as a pragmatic compromise. It arbitrarily elevates the brainstem for organ procurement while defaulting to heartbeat for dementia cases to avoid slippery slopes. Philosophically, it's a Frankenstein's monster—but it works because we need dead donors and living property owners. 

  *deep breath* Now to structure this without jargon. User hates academic fluff—needs razor-sharp distinctions: where practice locks in metaphysics vs. where it's just fudging. And absolutely no citations—they want the guts of the system laid bare.
answer: |-
  The legal-medical apparatus you describe presupposes a **brainstem-centric view of biological integration**, not psychological continuity or degreed survival. Its coherence is administrative, not metaphysical—a pragmatic compromise between competing values. Let's dissect it:

  ### The Implicit Theory: Brainstem as the "System Integrator"
  1. **Neurological death criterion**: Treats irreversible brainstem loss as equivalent to organismic death because the brainstem integrates vital functions (breathing, consciousness-switching, cardiovascular regulation). The *entire organism* is considered dead when this integrator fails—even if subsystems (e.g., heart) persist artificially.  
  2. **Persistent vegetative state/dementia**: Here, the brainstem *functions* (breathing, sleep-wake cycles), so the organism lives. Psychological continuity is irrelevant; legal personhood attaches to the living human organism.  
  3. **Circulatory death**: Relies on "permanent" cessation (a decision not to resuscitate) because *true* irreversibility is unprovable. It's a concession to practicality, implicitly treating circulatory arrest as a proxy for imminent biological disintegration.  

  **What’s ruled out**:  
  - **Organism view (strict biological continuity)**: Contradicted by harvesting organs from brain-dead bodies with functional circulation. If the organism were alive, this would be vivisection.  
  - **Psychological-continuity view**: Ruled out by treating dementia patients as legal persons despite psychological discontinuity. If identity depended on memory/agency, they’d be "dead."  

  **What’s underdetermined**:  
  - The apparatus *ignores* consciousness. A brain-dead body and a PVS patient both lack consciousness, yet one is "dead," the other "alive."  
  - Degreed survival has no operational role. Death is binary; survival is all-or-nothing by legal fiat.  

  ### Consequences of Adopting Rival Views
  | **Theory**              | **Changes Required in Practice**                                                                 | **Distinctions Collapsed**                     |
  |--------------------------|--------------------------------------------------------------------------------------------------|-----------------------------------------------|
  | **Organism View**        | - Ban organ donation from brain-dead donors (organism alive).<br>- Dementia patients remain alive until biological death. | Brain death ≠ circulatory death.              |
  | **Psychological Continuity** | - Dementia patients declared "dead" upon loss of identity-constituting traits.<br>- Locked-in syndrome patients gain stronger protections. | Dementia ≠ minimal consciousness. Brain death irrelevant unless consciousness erased. |
  | **Degreed Survival**     | - Organ donation permissible from patients below survival "threshold" (e.g., late dementia).<br>- Death pronouncements require graded assessment. | Binary death/survival collapses. PVS ≠ dementia ≠ brain death become points on a spectrum. |

  ### Verdict on Coherence
  - **Internally incoherent** in its metaphysics: It inconsistently elevates the brainstem as the "essence" of life (for organ donation) while ignoring it for dementia (prioritizing organismic life).  
  - **Externally coherent** as a *functional compromise*:  
    - Brain death creates a "clean" category for organ procurement without slippery slopes.  
    - Maintaining dementia patients as "alive" avoids ethical quagmires (e.g., euthanasia debates, property disputes).  
    - Circulatory death with permanence (not irreversibility) balances transplant needs against resuscitation feasibility.  

  **The administrative core**: The system prioritizes *practical bright lines* over metaphysical consistency. Brain death is a legal placeholder for "no meaningful recovery," not a deep claim about identity. Dementia is "life" because biology continues *and* withdrawing personhood would destabilize law. Cryonics operators exploit this by treating legal death as reversible—betting future technology will redefine "irreversible."  

  **Your inconsistency pinpointed**: The law treats the brainstem as the *sole necessary condition* for life in organ donation (kill the integrator, kill the person) but treats it as *insufficient* for personhood in dementia (the organism lives, so the person remains). This isn’t logical—it’s a tension between transplant pragmatism and the inertia of biological definitions. The system works because brain death is rare, dementia is slow, and no one forces a unified theory.
