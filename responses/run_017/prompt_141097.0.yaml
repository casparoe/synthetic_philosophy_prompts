  We are constructing a case about caregiving that satisfies the stipulations. The key is that the beneficiary's need remains constant, and the agent never takes on a formal role or makes a promise, but through a series of small, individually optional acts, she becomes unable to stop without moral blame.

  **Case: The Neighborly Support**

  Mara, a retired teacher, lives next door to Leo, an elderly man with mild but stable mobility issues who lives alone. Leo can manage his basic needs but finds some tasks, like grocery shopping, physically taxing and time-consuming. One day, Mara notices Leo struggling with his groceries and offers to carry them inside. He accepts gratefully. The next week, she happens to be going to the store and asks if he needs anything; he gives her a short list. She buys the items and drops them off. This becomes a pattern: about once a week, Mara checks in with Leo, sometimes offering to pick up a few things, sometimes helping with small tasks like taking out the recycling or changing a hard-to-reach lightbulb. Each act takes only a few minutes and minimal effort for Mara, who enjoys the company and feels good about helping. She never promises ongoing help, never accepts a role as his caregiver, and is not negligent in any way—she could skip any single instance without being blameworthy. Over two years, these acts accumulate: she has saved Leo hundreds of hours and spared him significant physical strain. Then, one day, Mara decides she no longer wishes to continue. She stops without notice. Leo, who has come to rely on her help, is now worse off than before she started—not because his condition worsened, but because he had adjusted his routines around her assistance. He must suddenly do all the tasks himself, which is harder now that he has lost the habit and is older. Mara’s omission is not merely disappointing or rude; it causes Leo real hardship, and she is blameworthy for stopping abruptly, even though she never formally committed.

  **Breaking down the case against the three accounts:**

  **(i) Standard token-level account:**  
  - *Individual steps:* Each act (e.g., one grocery run) is supererogatory. It is permissible to do, permissible to omit (no duty at that moment), praiseworthy if done, and beyond duty.  
  - *Sequence:* The final steps (if we consider the last few acts) might become obligatory because of the dependence created. If Mara knows that stopping abruptly would harm Leo, then her continuing the act (until a proper transition) becomes a duty to avoid harm. The token-level account would say that the early acts are supererogatory, but the later ones (after dependence is established) are obligatory.  

  **(ii) Course-of-action account:**  
  - This account evaluates the entire sequence. The sequence as a whole is not obligatory at the outset—Mara could have never started without blame. But once she has performed many acts, the sequence (understood as the ongoing practice) becomes something she must continue (or phase out responsibly). Thus, the entire course of action, once begun, becomes obligatory. Therefore, the sequence is not supererogatory. However, note that the account might also say that the sequence could not be omitted *at a later stage* without blame, but that doesn't mean the whole sequence was obligatory from the start. The verdict: the sequence, taken as a whole, is not beyond duty because by the end, it is required. But the account might still hold that the initial acts were supererogatory and the later ones obligatory. However, if we evaluate the entire course of action as a unit, it is not supererogatory because it is not permissible to omit it once it has progressed far enough.  

  **(iii) Sacrifice condition account:**  
  - *Individual steps:* No single act is supererogatory because each is too cheap—it costs Mara almost nothing. Thus, each is at best a favor, not supererogatory.  
  - *Sequence:* The sequence as a whole involves a substantial sacrifice (time and effort over two years). But the sacrifice condition typically applies to individual acts, not sequences. This account may not have a clear way to label the sequence. However, if we apply the sacrifice condition to the sequence, then the total sacrifice is significant, so the sequence might be considered supererogatory. But note: the account traditionally applies to acts, not sequences. The theorist might say that the sequence is supererogatory only if the total sacrifice is significant and the sequence was optional. But in this case, by the end, it is not optional. So the sequence is not supererogatory because it is not permissible to omit it (at the point when omission would cause harm).  

  **Pattern:**  
  - (i) Early steps supererogatory, later obligatory.  
  - (ii) The course-of-action account might say the entire sequence is not supererogatory because it becomes obligatory.  
  - (iii) No step is supererogatory (too cheap). The sequence as a whole is not supererogatory because it is not optional by the end.  

  **The single feature doing the work:**  
  The feature is the incremental creation of dependence without any explicit commitment. Leo comes to rely on Mara's help because of the pattern she established, and this reliance makes her discontinuation harmful.

  **If the feature is removed:**  
  Remove the dependence: suppose Mara's acts are sporadic and Leo never adjusts his routines to expect them. Then, each act is a standalone favor. She can stop at any time without blame. The whole series is just a set of individual supererogatory acts, and there is no duty generated.

  **Strongest line of attack for the account that comes out worst:**  
  The sacrifice condition (iii) comes out worst because it struggles to account for the sequence and denies supererogation to the individual steps. The theorist might attack by:  
  - Arguing that the total sacrifice is what matters for the sequence. Even if each step is cheap, the accumulated cost is significant, so the sequence should be seen as supererogatory (if it were optional). But in this case, it is not optional by the end. So the account might say: the sequence was supererogatory when it was optional (at the start), but it becomes obligatory. However, the account typically focuses on acts, not sequences. The attack would be that the account is too focused on individual acts and cannot handle temporally extended agency.  
  - Alternatively, the theorist might bite the bullet and say that the individual acts are not supererogatory (because cheap) and the sequence is not supererogatory (because obligatory by the end). But then they owe an account of why the sequence becomes obligatory without a promise or role. The attack from the other accounts would be that the sacrifice condition misses the moral significance of the dependence created by the pattern of acts.

  **Final Structure of the Response:**

  1. **Case Description:** One paragraph as above.
  2. **Analysis against the three accounts:**  
     - (i) Token-level: early steps supererogatory, later obligatory.  
     - (ii) Course-of-action: the entire sequence becomes obligatory, so not supererogatory.  
     - (iii) Sacrifice condition: no step supererogatory (too cheap); sequence not supererogatory (by the end, not optional).  
  3. **Key Feature:** Incremental dependence without commitment.  
  4. **Without the Feature:** Each act remains a standalone supererogatory act.  
  5. **Line of Attack:** Against (iii) - the sacrifice condition fails to capture the moral transformation caused by the pattern of acts and is too atomistic.
answer: |-
  ### Constructed Case: The Neighborly Support  
  Mara, a retired teacher, lives next door to Leo, an elderly widower with stable but persistent mild arthritis, making routine tasks like grocery shopping, gardening, or home repairs mildly uncomfortable but not impossible. Leo can manage independently but appreciates help. One Saturday, noticing Leo wincing while carrying groceries, Mara offers to help unload his car; he accepts. The next week, seeing him struggle to weed his garden, she spends 10 minutes helping. A month later, she notices a leaky faucet during a visit and fixes it, as she has plumbing skills. This evolves organically: every few weeks, Mara performs a minor act—dropping off surplus vegetables from her garden, shoveling his walk after a light snowfall (though he could do it slowly), or driving him to a pharmacy when she’s already going. Each act is discrete, costs Mara under 15 minutes or a trivial effort, and is never requested by Leo; she initiates spontaneously. She never promises ongoing aid, never discusses expectations, and avoids roles (e.g., she rejects being called his "helper"). Leo’s condition remains unchanged—no crisis or decline occurs. Over 18 months, Mara’s dozens of acts accumulate, saving Leo substantial discomfort and time, but she eventually tires of this pattern and abruptly stops. Leo, having adjusted his routines around her sporadic aid (e.g., delaying tasks expecting her help), now faces accumulated burdens he must handle alone. Stopping causes him real harm (e.g., neglected home maintenance leading to a fall risk), making Mara blameworthy for discontinuation—not because she violated an antecedent duty, but because her prior optional acts created a dependency that her omission now wrongs him.

  ### Analysis Against the Three Accounts  
  **(i) Standard token-level account (evaluates individual acts):**  
  - *Verdict on individual steps:* Each act (e.g., one instance of shoveling) is supererogatory. At the moment performed, it is permissible (no duty binds Mara to that specific act), omissible without blame (Leo’s stable need doesn’t demand it, and Mara isn’t negligent), praiseworthy (it aids Leo at minimal cost), and beyond duty (Leo isn’t in dire straits).  
  - *Verdict on the sequence:* The final acts (e.g., the last few interventions) become obligatory. By continuing the pattern, Mara’s acts create reliance; omitting *later* acts (without warning) foreseeably harms Leo due to induced dependency, violating a duty to avoid wrongful harm. This duty emerges from her *own* prior acts, not Leo’s worsening state.  
  - *Derivation:* The account evaluates each act in isolation. Early acts meet all supererogation criteria. Later acts fail "permissible to omit": omitting them breaches a duty generated by the cumulative effect of Mara’s past optional acts.

  **(ii) Course-of-action account (evaluates the temporally extended sequence as a whole):**  
  - *Verdict on individual steps:* All individual acts remain supererogatory when viewed as tokens, as no single act creates a duty.  
  - *Verdict on the sequence:* The sequence as a whole is *not* supererogatory. It becomes impermissible to omit the entire course of action once initiated, as discontinuation without transition wrongs Leo. Mara could have permissibly never started, but having begun, she must either continue or withdraw responsibly (e.g., by phasing out aid).  
  - *Derivation:* The account assesses the sequence holistically: the pattern of acts forms a "practice" that, when established, generates a duty of non-abandonment. Omitting the sequence *now* (after 18 months) is blameworthy because Mara’s voluntary actions created a legitimate expectation and vulnerability. The sequence is thus obligatory, not beyond duty. (This verdict is correct: the sequence’s moral status shifts due to diachronic agency.)

  **(iii) Sacrifice condition account (requires significant cost for supererogation):**  
  - *Verdict on individual steps:* No act is supererogatory. Each costs Mara little (e.g., 10 minutes of effort), falling below the "significant sacrifice" threshold. They are mere favors or kindnesses.  
  - *Verdict on the sequence:* The sequence as a whole is not supererogatory. While the cumulative sacrifice (e.g., 20 hours over 18 months) is substantial, the sequence is not optional by the end—Mara cannot omit it without blame—so it fails "permissible to omit." Even with significant total cost, it isn’t *beyond duty* because duty forbids abrupt discontinuation.  
  - *Derivation:* The account ties supererogation to individual cost: trivial acts are never supererogatory. For the sequence, the sacrifice condition is satisfied (total cost is significant), but the omission-permissibility condition fails due to the emergent duty. Thus, the sequence isn’t supererogatory; it’s obligatory once entrenched.

  ### Key Feature and Collapse  
  - **Single feature doing the work:** Incremental creation of reliance without explicit assumption of responsibility. Mara’s pattern of acts builds dependency through repeated, voluntary micro-benefactions, transforming optionality into obligation without any commitment or change in the beneficiary’s need.  
  - **Case without this feature:** If Mara’s acts are truly isolated (e.g., she helps Leo once with groceries but never again), each remains a textbook supererogatory act. Leo doesn’t adjust his expectations, so no dependency forms, and Mara can omit future acts without blame. The uncontroversial supererogation of individual tokens is preserved.  

  ### Strongest Line of Attack for the Weakest Account  
  The sacrifice condition account (iii) fares worst: it denies supererogation to all individual acts and struggles to explain why the sequence becomes obligatory. Its proponent would attack by **rejecting the dependency-based duty as irrelevant to supererogation**. They would argue:  
  - "Supererogation is solely about cost and optionality per act. The sequence’s moral shift stems from harm-prevention duties *external* to supererogation. Mara’s blame arises from a general duty not to harm others (e.g., by creating reliance), not from her acts’ supererogatory status. Thus, the account correctly identifies that trivial acts are never supererogatory, and the sequence’s obligatoriness is a separate issue. To call the sequence obligatory isn’t a failure of the sacrifice condition—it’s consistent with our view that cheap acts don’t qualify as supererogatory in the first place."  
  This attack isolates supererogation from diachronic effects, preserving the account’s atomism and denying that the cumulative cost "transforms" trivial acts into something supererogatory.
