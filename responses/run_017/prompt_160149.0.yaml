prompt: |-
  long time lurker of the rationalist blogs here (sequences, the old comment wars, all of it) and I have a very practical itch. I want a spec, not a survey: what would a rule for appraising research programmes actually have to get right before I'd trust it? The job I want it good enough for is narrow — me deciding whether to keep putting years of my own career into a field whose programme looks like it might be stalling, and a grant panel deciding between funding the incumbent programme and funding a scrappy rival. So it has to work for someone who is allocating real resources, not for someone writing history with the ending already known.

  Give me the requirements list with the case behind each one, and be explicit about which are non-negotiable and which are just the prejudices of one camp (I suspect "must cash out in novel predictions" is one of those, and I suspect "must be statable as a hard core plus a protective belt" is close to tautological). In particular I want it to say something defensible about: a zombie programme whose own practitioners think the core is false but keep using it because it keeps landing confirmed predictions; a black-box programme where the positive heuristic is a machine learning system, nobody can articulate the core, and the hit rate on novel predictions is well above chance; a shotgun programme that emits thousands of predictions and reports the ones that came off; an absorber programme that keeps explaining its rival's successes as limiting cases, which looks like triumph and like degeneracy depending on the mood I'm in; a programme that hasn't been refuted so much as priced out, where the next decisive test costs a billion dollars and takes thirty years; and the case that actually matters for my decision, where the programme looks degenerating and there is no rival to defect to. I also want the level distinction kept intact — "this programme is in trouble" is not the same claim as "I should leave it" — and I want the rule to be usable in real time by someone who can't see the future and who knows that the scientists being evaluated will start gaming whatever metric you hand them.

  The part I most want is where the list fights itself. Tell me which pair of requirements you think can't be jointly satisfied, and whether the whole thing is self-defeating: it looks to me like "give a verdict now" and "don't declare a programme dead prematurely, since programmes revive" are in genuine tension, and like anti-gaming and applicability pull in opposite directions, and like any criterion that scores methodologies by how much of the history of science they recieve as rational gets two opposite verdicts on the same episode whenever two reconstructions both cover a lot of ground. Then say which single requirement knocks out the most candidates. After that, a couple of sentences each on how Lakatos's own version, Popper's falsificationism, and a straight expected-value-of-information Bayesian rule do against the list, and we're done.

  No headings, no bullet points, no bold, no tables — just continuous prose, the way you'd write it in an email to a friend who asked.
reasoning: |-
  Okay, the user is deeply familiar with rationalist concepts and wants a practical framework for evaluating research programs. They're not looking for abstract philosophy but concrete criteria to guide career and funding decisions. Key pain points include handling zombie programs (where the core is false but predictions work), black-box ML approaches, shotgun methods, absorber programs, and prohibitively expensive tests. 

  The user wants tension points highlighted—especially between immediate decisions vs avoiding premature abandonment—and anti-gaming vs applicability tradeoffs. They're skeptical of traditional criteria like "novel predictions" being universally applicable. 

  For the response structure: First, define non-negotiable requirements (like real-time usability) vs preferences. Then analyze how each case study stresses the framework. Explicitly call out conflicts, like requiring timely verdicts while acknowledging programs can revive. Finally, benchmark Lakatos/Popper/Bayes against the criteria. 

  Biggest challenge: Designing a metric that resists gaming while covering diverse science (e.g., theory-heavy vs data-driven fields). The "absorber program" case is particularly thorny—it could indicate dominance or stagnation. Bayesian EVOI might handle uncertainty best but struggles with opaque ML programs. 

  User's unspoken need: Validation that leaving a "degenerating" program without a rival is sometimes rational. The framework should explicitly address that exit scenario without requiring perfect alternatives.
answer: |-
  Here's the spec you'd need, written straight through. Think of it as the email I'd send after we'd argued about this over beers, with the scars from past comment wars still fresh.

  First, the non-negotiables. Any appraisal rule worth using for allocating real resources has to handle **real-time uncertainty**. You're not a historian; you're deciding *now*, with incomplete information and no crystal ball. That means the rule must spit out a verdict based on current evidence, knowing full well it might be wrong in hindsight. It also has to be **anti-gaming resilient**. Scientists are clever, often desperate for funding or prestige. If your rule can be gamed by cranking out low-risk "novel" predictions, cherry-picking successes, or reframing failures, it's useless for resource allocation. Finally, it must explicitly **separate program health from defection decisions**. Telling you the program is degenerating doesn't automatically tell you to leave; that depends on alternatives, sunk costs, your skills, and the cost of staying put. The rule should diagnose the patient, not write the suicide note.

  Then come the hard requirements, the things it *must* get right to avoid catastrophic misjudgment in your specific cases:

  1.  **It must punish absence of progress, not just presence of failure.** A program coasting on confirming low-risk predictions derived from its core (even successfully!) isn't healthy. This kills the zombie. If the practitioners themselves think the core is false but keep using it *only* because it keeps yielding confirmations *within its established domain*, that's stagnation, not vitality. The rule needs to demand *new ground being broken*, not just old ground being tilled. Non-negotiable for spotting stall.
  2.  **It must value predictive power without demanding human-comprehensible mechanisms.** Your black-box ML program is a test. If it reliably beats chance on genuinely novel predictions (not just curve-fitting known data), that's progress. The rule can't dismiss this because the "core" is inscrutable weights in a neural net. Demanding a Lakatosian "hard core" articulated in natural language would wrongly condemn powerful, emerging methodologies. This requirement fights directly against Lakatosian orthodoxy.
  3.  **It must penalize unfalsifiability masquerading as productivity.** The shotgun program is the nightmare. Emitting thousands of predictions and only reporting the hits is noise, not signal. The rule must account for the *denominator* – the total predictions made, including the misses swept under the rug. Progress requires a decent hit rate *relative to the total output and the riskiness of the predictions*. Non-negotiable for anti-gaming.
  4.  **It must distinguish explanatory power from explanatory accommodation.** The absorber program is the trickiest. Explaining a rival's success as a limiting case *can* be a triumph (Newton absorbing Kepler) *or* degeneracy (adding epicycles). The rule needs a way to judge whether the absorption is a *natural, fruitful extension* of the core leading to *new predictions/testable consequences*, or a *strained, post-hoc fix* that adds complexity without new insight or empirical reach. This is where "novel predictions" often becomes crucial, but it's slippery.
  5.  **It must account for the cost of testing and the burden of proof.** The billion-dollar, thirty-year test program can't be judged solely by its lack of recent falsification. The rule needs a concept like "empirical stagnation under feasible effort." If the program hasn't generated new, testable, *affordable* implications within a reasonable timeframe (relative to the field), and its survival hinges solely on an untestable (for now) core, it's functionally degenerating *for resource allocation purposes*, even if it *might* be proven right someday. Waiting forever isn't an option.
  6.  **It must handle the "no rival" scenario without optimism bias.** When your program looks degenerating and there's no shiny new alternative, the rule still needs to diagnose the degeneration. It shouldn't default to "stick with the devil you know." This is where separating health from defection is vital. The rule should tell you the patient is sick. *You* then decide if you have the skills/desire to attempt a revival, switch fields entirely, or wait in limbo, knowing the prognosis is poor.

  Now, where it fights itself:
  *   **"Verdict Now" vs. "Avoid Premature Burial":** This is the core tension. No rule can perfectly predict revival. The best you can do is require evidence of *incipient progress* or *newly plausible pathways* for revival. If the program is just churning confirmations or hiding failures *while also* showing no credible plan/hint for breaking new ground, the "verdict now" must lean towards degeneration, acknowledging the risk of a future Lazarus act but weighting it against the opportunity cost of current investment. This tension is inherent and unresolvable perfectly.
  *   **Anti-Gaming vs. Applicability:** Truly robust anti-gaming (like demanding pre-registered predictions, full accounting of tests) is burdensome, slows science, and might miss serendipitous discovery. A lighter touch (novelty judged post-hoc) is easily gamed. The rule needs pragmatic middle ground: perhaps weighting *risky*, *domain-shifting* predictions much higher than safe ones, and demanding transparency on *all* major tests attempted (success or failure), even if imperfectly enforced. Leaning too far towards either makes the rule unusable or useless.
  *   **Reconstructing History vs. Rational Allocation:** This is a red herring for your purpose. Your rule isn't for writing Whig history. It's for making bets. Forget covering past rational episodes; focus on predicting future progressiveness *from current signals*. History is data, not a grading rubric.

  The requirement that knocks out the most candidates is **punishing absence of progress (Requirement 1)**. Many popular metrics (number of papers, citations, even confirmed predictions within the paradigm) reward busywork and zombie programs. Rules that don't explicitly demand *new kinds* of questions, *new domains* of application, or *increased precision/scope* at the frontiers will misdiagnose stagnation as health.

  How do the usual suspects fare?
  *   **Lakatos:** His "progressive/ degenerating problemshifts" gets closest on paper, emphasizing novel predictions and heuristic power. But it fails badly on your black-box ML (requires articulated hard core/heuristic), struggles mightily with the absorber (judging "non-ad-hoc-ness" is fuzzy), is easily gamed (declare anything novel post-hoc), and offers little on cost or the no-rival scenario. The "protective belt" often becomes tautological justification for anything. Too historian-focused.
  *   **Popper:** Crude falsificationism is useless here. It declares everything "priced out" or "shotgun" dead immediately. It can't handle successful zombies or absorbers, ignores the cost of testing, and provides no nuance for program comparison or health diagnosis beyond single-conjecture falsification. Far too brittle.
  *   **Bayesian Expected Value of Information (EVI):** This has the right *structure* – weighing cost of testing against expected reduction in uncertainty about the program's truth/fruitfulness. It *could* handle cost (Requirement 5) and potentially the no-rival scenario (low EVI for staying). But it stumbles badly on implementation. How do you assign priors and likelihoods to whole programs, especially black-box ones? How do you quantify the "value" of reduced uncertainty in a way that captures *progressiveness* (Requirement 1) and not just confirmation? It's easily gamed by biased probability assignments and struggles mightily with judging novel predictions vs shotgun spray vs absorption (Requirements 2, 3, 4). It's theoretically appealing but practically opaque for your use case.

  The brutal truth? No existing formal rule nails this perfectly for your gritty, real-world decisions. You need a synthesized heuristic: **Prioritize programs showing a credible, recent pattern of generating *risky*, *domain-expanding* predictions that survive testing *without* resorting to post-hoc fixes or hiding failures, where the cost of the *next meaningful test* is justified by the potential insight gained, *especially* if that insight opens new avenues rather than just defends old ground.** Track the ratio of ambitious wins to total effort, watch for defensive manoeuvres, and ruthlessly discount claims divorced from testable consequences. It’s messy, requires judgment, and accepts the risk of being wrong, but it’s the best you’ll get before the future arrives.
