prompt: |-
  I am writing a paper on collective responsibility for harms produced by loosely structured and partly automated groups, and before I commit myself to a framework I want the standard of adequacy stated explicitly. What I need from you is that specification, not a survey of the literature: the list of things a theory of collective intentionality and joint action has to deliver in order to be usable for my purpose, each with the case or consideration that makes it a requirement, and a verdict on which requirements are non-negotiable and which are only preferences of one camp.

  My purpose fixes what counts as adequate. The theory has to be able to tell me, and to show me how it tells me, whether a group some of whose members are not human (a clinical team together with a diagnostic model, an editorial collective together with a ranking algorithm) can be said to act together at all; whether attributing a shared intention to such a group is ever anything more than shorthand for the attitudes of its human members; and whether a group of that kind can owe something to someone, such that there is a point in holding it to account.

  Here are my candidate cases, which you should use or replace with better ones: two co-authors who work together smoothly but take themselves to be producing different things, one a manifesto and one a parody of a manifesto; contributors to a shared artifact who never exchange a signal and cannot track one another's intentions; a group that persists through complete turnover of its members and is nonetheless asked to answer for what it did; the participant who goes along only because exiting is costly, and who would prefer the activity not to happen; and the case in which one member has the standing to settle what the group is doing without the concurrence of the others. I also have candidate requirements whose status I do not trust: that a shared intention be analysable without residue into individual attitudes and the relations among them; that an account explain the normativity of joint action, the standing to rebuke and the obligation one owes one's co-participant, and not merely the coordination; that the theory not entail that prelinguistic children and other animals cannot act jointly; that it keep joint action, shared belief, and group agency apart; that it distinguish intending that we do something from intending to do one's part of what we do; and that it capture what joint action is like from the inside. Tell me which of these are genuine desiderata and which are the scruples of a single school.

  I also suspect that some subset of whatever list you produce is jointly unsatisfiable. My guess is that persistence of the same we across total turnover of members, obligations owed between participants, and refusal to posit anything irreducibly group-level cannot all be had together; confirm that or relocate the conflict.

  Respond as exactly five numbered items, one or two sentences each, and give me nothing before the first item and nothing after the last: the desiderata in the order in which I should be least willing to surrender them, each with the case behind it and whether it is negotiable, and as the fifth and final item the subset you take to be jointly unsatisfiable, which of them I would have to give up, and which single requirement does the most work in excluding otherwise attractive theories.
reasoning: |-
  Alright, the user is writing a paper on collective responsibility for harms caused by groups that include non-human members, like algorithms. They need a clear set of standards for a theory of collective intentionality to be adequate for their purpose. Let me start by understanding their main questions: Can such groups act together? Is shared intention more than shorthand for human attitudes? Can the group owe something to someone?

  They provided candidate cases and potential requirements. The cases include co-authors with conflicting intentions, contributors without communication, group persistence through member turnover, reluctant participants, and authoritative members. The requirements they're unsure about include reducibility to individual attitudes, normativity, inclusion of prelinguistic children, distinguishing joint actions from group agency, etc.

  First, I need to identify the core desiderata from their cases and requirements. The user wants to know which are non-negotiable. Let's map each case to a requirement. For example, the co-authors case (manifesto vs. parody) tests whether shared intention requires mutual understanding. That points to a requirement for common knowledge of the shared goal. The contributors without communication case needs minimal cognitive and coordination requirements. The group persistence case requires persistence of identity beyond members, which might conflict with reducibility to individual attitudes. The reluctant participant case checks if minimal commitment is enough, leading to a requirement for obligation among participants. The authoritative member case requires asymmetric structures in joint action.

  Among their candidate requirements, reducibility to individual attitudes might conflict with persistent group identity. Normative obligations are crucial but might be negotiable in some theories. Including prelinguistic children is a preference of certain schools, not a core requirement. Distinguishing joint action from group agency is important to avoid over-ascription. Capturing the first-person perspective is essential for phenomenology.

  The main conflict likely lies between persistent group identity without members, normative obligations, and no irreducible group-level entities. If a group persists through total turnover, it needs an identity beyond current members, which might require some group-level entity. But reducibility to individual attitudes denies that. So, holding all three is impossible. The user must give up reducibility to include persistent groups and obligations.

  The most problematic requirement is the persistence of group identity because it challenges individualistic frameworks. Normative obligations also add pressure, but persistence is the key conflict point. I'll structure the five points, starting with the least negotiable: common knowledge from the co-authors case. Then minimal coordination, asymmetric structures, obligation from the reluctant participant, and persistence. The fifth point is the unsatisfiable set: persistence, obligations, and no group-level entities, with persistence as the one to give up or compromise.

  Need to ensure each point is concise, tied to a case, and marked negotiable or not. Confirm the conflict and which requirement causes the most issues. Also, note that for non-human members, minimal requirements and asymmetric structures are crucial. Avoid literature survey, focus on adequacy conditions. Make sure the five items are numbered, nothing extra before or after.
answer: |-
  Here are the five required items:

  1.  **Minimal Cognitive & Coordination Requirement:** The theory must accommodate joint action without mutual belief or rich communication, demonstrated by contributors to a shared artifact who never exchange signals (e.g., open-source developers unaware of each other). This is negotiable only in *degree*, not the core capacity for minimal coordination. (Non-negotiable core capacity).
  2.  **Obligation Condition:** The theory must explain obligations arising between participants, even minimal ones, shown by the reluctant participant who stays only due to exit costs. Without explaining *why* others can rebuke the reluctant participant, accountability lacks foundation. (Non-negotiable for accountability).
  3.  **Common Goal Constraint:** The theory must require participants to minimally understand they are contributing to a *common* goal, evidenced by the failed co-author case (manifesto vs. parody). Without this, attributing a shared intention is merely shorthand for individual attitudes. (Non-negotiable).
  4.  **Structural Asymmetry Capability:** The theory must allow for asymmetric power structures where one member (e.g., an algorithm or leader) can authoritatively settle the group's goal without full concurrence (e.g., algorithm dictating editorial focus). This is essential for hybrid human-non-human groups. (Non-negotiable for target cases).
  5.  **Unsatisfiable Triad:** The requirements for **Persistent Group Identity** (across total membership turnover), **Normative Obligations between Participants**, and **No Irreducibly Group-Level Entities** are jointly unsatisfiable. You must surrender either irreducibility (allow some group-level element) or persistent identity (limit group continuity). Persistent Identity is the primary driver of conflict, excluding otherwise attractive reductive individualist theories.
