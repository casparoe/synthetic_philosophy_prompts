prompt: |-
  You are a moral and political philosopher who has published on the ethics of memory, on responsibility across generations, and on the normative structure of commemoration. Please think this through properly rather than pattern-matching: try two or three candidate principles against the cases below, discard the ones that break, and tell me where you had to make a judgement rather than a deduction. Answer in British English. Lead with your bottom line — the principle, stated in one sentence — in your very first sentence; only then give the reasoning. No preamble, no restatement of my question, and no suggestions for further reading: I have the literature; what I lack is the principle.

  I am a PhD student finishing a chapter on the duty to remember and its limits, working in the neighbourhood of Margalit's contrast between the ethics and the morality of memory, and of the broadly anti-therapeutic suspicion (Rieff's, among others) that a culture organised around release from the past ends up transmitting nothing. What follows are my verdicts on eight cases, given on the gut, without a principle in hand. Two pairs of them I cannot reconcile with each other; for one case I have coined a term because I could not find one; and one case I suspect may not be a case of anything at all.

  1. A country emerging from dictatorship offers amnesty in exchange for full public disclosure. The truth commission produces a fourteen-volume report. Almost nobody reads it, no one is prosecuted, there is no memorial and no annual day, and ten years later the report exists only as an unlisted PDF. My verdict: not merely permissible — closer to admirable than to a betrayal. The unread report does not trouble me.

  2. A national museum quietly removes its gallery on a nineteenth-century campaign of dispossession; a minister says the country must stop defining itself by the worst thing it ever did. The archives are intact, specialists can and do publish on them, and the episode is better documented than it has ever been. My verdict: clearly wrong, and wrong in a register I would call betrayal, even though no information whatsoever has been lost.

  3. In 1905 a pogrom destroyed a small town's Jewish community. Every descendant of the survivors emigrated; none remain anywhere. The town's present inhabitants are largely descended from people who watched. The last person anywhere with a first-hand connection died in 2011. The town still holds an annual service at the site. My verdict: it must continue; letting it lapse would be a grave loss. No one present has any relation to the victims at all.

  4. A family keeps up a yearly visit to the grave of a great-great-grandfather who died in 1902, of whom they know nothing but a name, two dates and one photograph. My verdict: no obligation whatsoever, and something faintly absurd about it — although I would never criticise them for doing it.

  5. Fifth-generation descendants of a settler colony's founders hold an annual public act of contrition for a massacre their ancestors carried out. No living person was harmed by that massacre or enriched by it. The descendants of the victims have publicly asked them to stop, on the grounds that it has become about the commemorators. My verdict: there is something indecent here — but I cannot name who is wronged.

  6. A wrong is commemorated so continuously, professionally and institutionally — curricula, minutes of silence, funded memorials, annual broadcast — that the practice now seems to be chiefly a display of the commemorators' own moral seriousness. Nothing informational or relational would be lost if it stopped. I call this saturation. My verdict: at some point continuing becomes worse than stopping, but I cannot locate the point or say what flips there.

  7. After thirty years of paramilitary killing, a settlement is reached. Everyone knows roughly who did what to whom. There is a strong norm against raising it in mixed company, and children are not told which neighbour did what. My verdict: the norm is not merely permissible but close to obligatory, and I would defend withholding the knowledge from the children. This is a case where I want to say that there is a duty to forget, or at least a duty not to remember together.

  8. An archive of video testimony is coupled with a system that generates responsive first-person address: a visitor asks a question and a dead survivor's recorded voice, idiom and manner are recombined to answer in the first person, indefinitely, to visitors with no connection to anyone involved. My verdict: I recoil, and I cannot say what is wrong with it. It satisfies every function I can name for remembering, and it will outlast any living memory.

  What I want from you:

  (i) One principle, or a small ordered set, that captures as much of this pattern as can be captured.
  (ii) A table: case — verdict under your principle — agrees or conflicts with mine.
  (iii) Whichever of my verdicts your principle cannot accommodate, ranked by how much it costs me to surrender, and what I would have to say about the world to go on holding it.
  (iv) Which structural feature of which case is doing the work, and what happens to the verdicts if that feature is varied.
  (v) A test of the only principle I have managed to state myself, and a repaired version of it if it fails: a wrong must be remembered by whoever is in a position to sustain, through the remembering, a relation that the wrong damaged; and the duty lapses when remembering no longer sustains such a relation but merely substitutes for one. Note that as stated it convicts me on case 4, where I feel no duty, and it has nothing to say about cases 7 and 8.
  (vi) Its verdicts on two cases I have not settled: (a) may a political community that committed a wrong unilaterally discontinue commemorating it once every direct claimant is dead and no descendant has asked for it to continue; (b) can a duty to remember be discharged by complete strangers — a group in another country that adopts a forgotten massacre as its cause, with no ancestry, standing or connection of any kind.
  (vii) A straight answer on whether saturation is a real moral category or merely a name for my own aesthetic impatience.
reasoning: |-
  Hmm, the user is a PhD student working on the ethics of memory, specifically the duty to remember and its limits. They've presented eight complex cases with their intuitive verdicts and want me to develop a coherent principle that explains most of these judgments. They're struggling with inconsistencies between their verdicts on certain pairs of cases and need a systematic framework.

  Looking at their cases, I notice several tensions: Case 1 (unread truth report) is deemed admirable while Case 2 (removed museum exhibit) feels like betrayal, yet both involve preserved-but-unaccessed information. Case 3 (continuing memorial for extinct community) feels obligatory while Case 4 (family grave visits) seems optional - what distinguishes them? Case 5 (descendants' contrition against victims' wishes) appears indecent while Case 6 (saturation) crosses into the unethical, both involving performative commemoration.

  Their own proposed principle focuses on relational repair, but fails to explain Case 4 (where relations exist but no duty is felt) and Cases 7-8 (involving forgetting and technological commemoration). The core tension seems to be between memory as relational obligation versus memory as public moral practice.

  I'm considering a principle centered on "relational continuity with the wronged" as primary, supplemented by "preventing recurrence" as secondary. This would mean:
  - Duty strongest when living connections to victims exist (Case 3)
  - Weakens when connections fade (Case 4)
  - Ceases when victims' descendants reject it (Case 5)
  - But persists if recurrence risk remains high (Case 7 justifying forgetting)

  For Case 2, removing the exhibit breaches duty because it denies relational continuity to living descendants of the dispossessed. Case 1's unread report remains admirable because it enables future relational acts. Saturation (Case 6) becomes problematic when it displaces rather than enables relational continuity. The AI testimony (Case 8) fails because it simulates relationship without actual continuity.

  Testing against their unresolved cases: 
  (a) A community cannot unilaterally stop commemorating if recurrence risk persists or if descendant communities exist elsewhere, even if unconsulted. 
  (b) Strangers can't discharge the core duty but might supplement it if relational continuity is otherwise impossible.

  Saturation is indeed a moral category when commemoration becomes self-referential, blocking new relational connections. Their aesthetic impatience merely signals this moral threshold.

  For the table, I'll show how this principle captures most verdicts except Case 4 (where I see mild duty they don't) and Case 7 (where recurrence risk justifies their "duty to forget"). The costliest surrender is Case 4 - they'd need to argue family ties create no ethical claims across generations.
answer: |-
  **Bottom line principle:** The duty to remember exists only when remembering sustains or repairs a living relation damaged by the wrong, or when it is necessary to prevent a recurrence of comparable harm; the duty ceases when it becomes purely substitutive or performative, or when it obstructs the emergence of relations not defined by the wrong.

  **(ii) Table of case verdicts under this principle:**

  | Case | Verdict under principle | Agrees/Conflicts with yours |
  |------|-------------------------|----------------------------|
  | 1    | Permissible/admirable. No living relation requires repair; recurrence risk low post-dictatorship. | Agrees |
  | 2    | Wrong (betrayal). Removal denies relational repair for descendant communities still affected by dispossession’s legacy. | Agrees |
  | 3    | Obligatory to continue. Sustains relation to victims where lineage is broken; cessation would sever final tangible link. | Agrees |
  | 4    | No obligation but permissible. No damaged relation exists to repair (death natural); act is substitutive, not sustaining. | **Conflicts** (You: no duty; Principle: mild permissibility) |
  | 5    | Indecent. Commemoration substitutes for relation (victims’ descendants reject it) and ignores their agency. | Agrees |
  | 6    | Saturation makes continuation wrong. Performance substitutes for relational work; resources obstruct new relations. | Agrees |
  | 7    | Duty to forget (or not remember together) is obligatory. Prevents recurrence by allowing non-agonistic relations to form. | Agrees |
  | 8    | Impermissible. Simulated first-person response fabricates a relation; substitutive and violates the dead’s silence. | Agrees (with your recoil) |

  **(iii) Unaccommodated verdicts, ranked by cost to surrender:**  
  1. **Case 4 (family grave visit):** You feel no duty; principle permits it mildly. Surrendering costs little – you need only concede that harmless substitutive acts lack ethical weight but aren’t absurd. To hold your view, argue that *all* substitutive commemoration is ethically void or comical.  
  2. *All other verdicts accommodated.*

  **(iv) Key structural features and variations:**  
  - **Case 2’s feature:** The museum’s public role in sustaining *communal* relations to the wronged. If varied to a *private* archive removal (no public access loss), verdict shifts to permissible.  
  - **Case 7’s feature:** High risk of recurring violence if memory is activated socially. If varied to a historical wrong with no recurrence risk (e.g., medieval feud), the duty to forget lapses.  
  - **Case 3’s feature:** Absence of descendant claimants *necessitates* communal stewardship. If descendants existed and requested cessation, continuing would be indecent (cf. Case 5).

  **(v) Test and repair of your principle:**  
  - **Your principle:** "A wrong must be remembered by whoever is in a position to sustain, through the remembering, a relation that the wrong damaged; duty lapses when remembering no longer sustains but substitutes."  
  - **Fails:** Cases 7 (duty to forget) and 8 (simulation) require prevention of harm/respect for the dead, not relational repair. Case 1 is justified by recurrence prevention, not relations. Case 4: your principle condemns it (as substitutive), but you feel no duty.  
  - **Repaired principle:** *"A wrong must be remembered where such remembrance sustains or repairs a living relation damaged by that wrong, or where it is necessary to prevent its recurrence; the duty ceases when remembrance becomes substitutive, ignores the wishes of the wronged, or obstructs the formation of non-agonistic relations."*  
    - Now accommodates Case 7 (prevention), Case 8 (substitutive), Case 1 (prevention), and Case 4 (no damaged relation).

  **(vi) Verdicts on unsettled cases:**  
  (a) **May a community unilaterally discontinue commemoration?** No – if descendant communities exist *elsewhere* or recurrence risk persists (e.g., structural inequalities remain), discontinuation betrays relational duty. Only permissible if all lines of relation are extinct *and* no systemic harm lingers.  
  (b) **Can strangers discharge the duty?** Only if no one closer exists to bear it (e.g., Case 3). Otherwise, strangers’ acts are substitutive (ethically neutral) unless they aid prevention (e.g., global vigilance).

  **(vii) Saturation:** It is a real moral category. When commemoration becomes self-referential performance (Case 6), it consumes resources that could sustain genuine relations or prevention, and entrenches the wrong as a moral commodity. Your impatience signals this ethical threshold.
