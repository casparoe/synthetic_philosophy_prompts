answer: |-
  This pattern has no single established name in philosophy or political theory, but it represents a **recognized conceptual failure** with precise boundaries. It is distinct from your near misses and deserves the name **"Baseline Constitutive Blindness"** (BCB). Below is a full dissection:

  ### **1. Definition & Boundary Cases**  
  **BCB**: *The act of treating a distribution of holdings or rights that is constitutively dependent on state power (law, institutions, enforcement) as a "natural" or pre-political baseline, thereby exempting it from justification while imposing the entire burden of justification on deviations from that baseline (e.g., taxation).*  

  **Boundary Cases**:  
  - **Not BCB**: Arguing that *specific* property rights (e.g., "I own this apple I picked") exist independently of the state. (This may be wrong, but it's a substantive claim, not blindness to constitutive dependence.)  
  - **BCB**: Acknowledging that property rights *generally* depend on the state ("nobody has pre-tax income"), then treating *current holdings* as the "default" for moral/policy judgments (e.g., "70% inheritance tax is a taking from what the deceased earned").  
  - **Not BCB**: Defending the status quo because it satisfies independent moral criteria (e.g., "Current land titles reflect just acquisition").  
  - **BCB**: Defending the status quo *solely* because it is the status quo, while ignoring how law constructed it (e.g., "Planning permission isn't a 'taking'—it's just regulating what was always yours").  

  ### **2. Defensibility of the Asymmetry**  
  The asymmetry ("burden of proof on changes, not continuities") **lacks non-circular justification** in BCB cases:  
  - **Principled Defenses Fail**: Arguments like "stability requires burdening change" or "reliance interests deserve protection" *presuppose* the legitimacy of the baseline. If the baseline is legally constituted (e.g., inheritance rules), "reliance" is reliance on state power—which demands justification itself.  
  - **The Trap**: BCB converts *descriptive* stability ("people expect this") into *normative* priority without argument. This is circular: "The baseline is justified because it exists; it exists because the state enforces it; the state enforcing it needs no justification."  
  - **Only Escape**: To defend asymmetry, one must justify the baseline *independently* (e.g., via Lockean labor-mixing or Rawlsian fairness). BCB occurs precisely when this justificatory work is skipped.  

  ### **3. Diagnostic Test & Misfires**  
  **Test**: *When an argument (a) relies on a distribution/right as a normative starting point, (b) that distribution/right is demonstrably constituted by state power, and (c) its constitutive dependence is ignored or dismissed when challenged.*  

  **Misfires**:  
  - **False Positive**: Accusing BCB when someone *explicitly justifies* the baseline (e.g., "Land titles are just because they reward productivity").  
  - **False Negative**: Missing BCB when constitutive dependence is *obscured* (e.g., "Property rights are natural—enforcement just stops thieves").  
  - **Key Indicator**: Shifting descriptions of agency—e.g., tax collectors "act," but intestacy laws "exist"—without explaining the asymmetry.  

  ### **4. Your Third Instance: Same Failure Mode**  
  The inheritance tax argument ("it takes a *share*, not a fixed sum") **is BCB reapplied**:  
  - **Why?** The intuition that "tracking holdings" is uniquely invasive depends on treating *current holdings* as morally prior. But holdings are shaped by law (e.g., corporate liability rules inflate wealth). Calling a percentage "taking" rather than "adjusting the terms" assumes holdings are natural.  
  - **Contrast**: A fixed fee *could* be more burdensome (e.g., a $10,000 fine ruins the poor but not the rich). The "share vs. fixed" distinction only seems salient if holdings are taken as pre-justified.  

  ### **5. Distinguishing from Near Misses**  
  | Concept              | How BCB Differs |  
  |----------------------|-----------------|  
  | **Status Quo Bias**  | Descriptive preference for stability; BCB is *normative* blindness to legal construction. |  
  | **Coercion Baseline**| Focuses on defining "force"; BCB concerns *moral prioritization* of legally built distributions. |  
  | **"No Pre-Tax Income"** | A *corrective* to BCB (Murphy/Nagel), not the fallacy itself. |  
  | **Naturalization**   | Marxist version focuses on ideology; BCB is a *logical* flaw in argumentation. |  
  | **Motte-and-Bailey** | Involves retreating to a defensible claim; BCB is a *consistent* framing asymmetry. |  

  ### **Conclusion**  
  **"Baseline Constitutive Blindness"** captures your pattern: it is the **unargued treatment of state-constituted distributions as normative defaults**. Your friend’s asymmetry is indefensible without independent baseline justification, and your third instance is BCB in a new context. The diagnostic test reveals it by exposing inconsistent attention to legal agency. BCB isn’t a "tactic"—it’s a conceptual blind spot that entrenches unexamined entitlements. To disarm it, consistently ask: *"What made this baseline, and why is it exempt from scrutiny?"*
