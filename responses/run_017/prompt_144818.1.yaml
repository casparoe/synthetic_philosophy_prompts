prompt: |-
  Im putting together a cause-prioritization framework for a small grantmaking team — maybe ten candidate causes, a couple of staff, no realistic shot at multi-year research programs — and before I just adopt importance/tractability/neglectedness I want the spec: what does a framework like this actually have to deliver to count as adequate for that purpose? Give me the requirements with the case or failure mode behind each, not the ITN spiel Ive already read. Things Im stuck on and want you to judge, add to, or throw out:

  - partition sensitivity: the scores move depending on how finely you carve up the cause space (global health vs malaria vs bednet delivery in one province vs one delivery org), so is invariance to the carving a genuine requirement, and could anything actually meet it
  - fungibility: the counterfactual value of a marginal dollar isnt proportional to how much a cause currently gets, so both per-dollar comparisons and "neglectedness" can mislead — does that have to be modeled explicitly or can it be left as a verbal caveat
  - option value: sometimes the best cause is learn-more, or invest-and-give-later rather than spend now; should that live inside the same framework or in a separate budget
  - interaction: causes that are complements or substitutes, where the scores dont decompose and you cant rank them one at a time
  - cluelessness: flow-through effects decades out that nobody can sign off on, plus the option of causes whose main effect is on what future funders do
  - usability by people who cant produce confident numbers — is that a desideratum of the framework or just a fact about me

  Tell me which of these are real desiderata and which are one camp's taste, which are non-negotiable given my purpose, and whether some subset is jointly unsatisfiable — that's the part I care most about, since if it is, the list itself is the finding. Then: which single requirement knocks out the most candidate frameworks, and two lines max on how ITN itself does, I can fill in the rest.
reasoning: |-
  Okay, the user is putting together a cause-prioritization framework for a small grantmaking team. They have about ten candidate causes, a couple of staff, and no resources for multi-year research. They're considering using the Importance/Tractability/Neglectedness (ITN) framework but want to know what a framework actually needs to deliver to be adequate for their situation. They've listed several concerns: partition sensitivity, fungibility, option value, interaction effects, cluelessness, and usability by non-experts. 

  First, I need to understand their core needs. They're a small team with limited capacity, so the framework must be practical and not require complex modeling. They need something actionable without extensive research. Their questions suggest they're worried about common pitfalls in cause prioritization and want to avoid frameworks that could mislead them despite seeming simple.

  Looking at each concern:

  Partition sensitivity is a real issue. Causes can be sliced differently, changing scores. But demanding invariance isn't practical. Instead, the framework should guide consistent granularity. For a small team, using natural cause definitions (like malaria vs. clean energy) rather than overly narrow splits makes sense. They can note that scores aren't absolute but relative to the chosen partitioning. So, this is a genuine requirement but manageable with clear guidelines.

  Fungibility matters because a dollar's impact isn't just about current funding levels. Neglectedness can be misleading if funds are diverted. However, modeling this explicitly is likely too heavy for their team. A verbal caveat combined with qualitative judgment (e.g., "Is this cause crowded?") might suffice. They should consider if funding might replace others' efforts, which is more feasible than complex counterfactuals.

  Option value is crucial. Learning now can lead to better future spending. But integrating this into the same framework might complicate comparisons. A separate budget line for exploration/research makes sense. They can allocate a portion (say 10-20%) for such activities without scoring them against direct causes. This balances immediate impact with long-term gains, fitting their limited capacity.

  Interaction effects (complements/substitutes) are real but hard to handle systematically. Given their size, they can't model these deeply. Instead, they should flag when causes interact and make strategic adjustments. For example, funding advocacy might boost health interventions. This requires awareness but not formal integration. Over time, they can learn from experience.

  Cluelessness is unavoidable. Long-term effects are uncertain. The framework should accept this by avoiding overconfidence in predictions. They can prioritize causes with more predictable impacts and use humility in claims. Including meta-causes (like influencing funders) needs separate consideration due to different evidence standards. Not every framework needs to handle this, so it's about acknowledging limits.

  Usability is non-negotiable. Their team can't produce confident numbers, so the framework must work with qualitative judgments. ITN can be adapted with scales (e.g., high/medium/low) instead of numbers. Forcing quantification would lead to false precision. The process should be clear and collaborative, leveraging staff expertise without demanding data they don't have.

  Now, which requirement is a showstopper? Usability. If the framework requires complex metrics, it's useless for their team. ITN can work if kept qualitative. But partition sensitivity and fungibility might make ITN misleading if not handled carefully. They need clear guidelines on cause definitions and caveats about funding displacement.

  Overall, the key is balancing rigor with practicality. Their framework must guide decisions without overcomplicating. Some trade-offs are necessary: accepting some subjectivity, separating option value, and acknowledging uncertainties. ITN can serve as a base if adapted with their constraints in mind. The biggest risk is forcing a framework that's too complex, leading to analysis paralysis or misguided priorities. Simplicity, transparency, and adaptability are crucial for their context.
answer: |-
  Here's a breakdown of your requirements, judged for necessity in your context, and their implications for framework choice:

  ### Core Requirements for a Small Grantmaking Framework (Non-Negotiable)
  1.  **Actionability with Limited Resources:** *Requirement.* Must produce a *timely, defensible recommendation* usable by a small team without deep research capacity. *Failure:* Analysis paralysis; decisions default to intuition or politics without a shared structure.
  2.  **Comparability:** *Requirement.* Must enable **meaningful comparison** of *your specific candidate causes* against each other. *Failure:* Causes evaluated in isolation; funding allocation becomes arbitrary or based on loudest voice.
  3.  **Clarity & Transparency:** *Requirement.* Scoring rationale and relative priorities must be **understandable and communicable** internally. *Failure:* Staff confusion, lack of buy-in, inability to explain decisions to stakeholders.
  4.  **Humility Under Uncertainty:** *Requirement.* Must explicitly acknowledge and **accommodate significant uncertainty** without demanding false precision. *Failure:* Overconfidence in shaky numbers; dismissal of crucial but hard-to-quantify causes; paralysis when data is poor.

  ### Your Concerns: Necessity & Handling
  5.  **Partition Sensitivity:** *Genuine Issue, Not Fully Solvable Requirement.* Invariance is *impossible*. *Requirement:* Framework must **provide guidance on defining cause granularity** consistently for comparison. *Failure:* Scores become meaningless as definitions shift; gaming the system by defining causes favorably.
  6.  **Fungibility:** *Genuine Issue, Not Core Requirement for You.* Modeling explicit counterfactuals is likely too heavy. *Requirement:* **Qualitative prompts/caveats** within neglectedness/scoring (e.g., "Likelihood of crowding out?" "Is funding genuinely additive?"). *Failure:* Overfunding causes where marginal dollar does little; underfunding genuinely additive opportunities.
  7.  **Option Value (Learn/Invest Later):** *Genuine Requirement.* **Must be included explicitly.** Best handled as a **separate "meta-cause" category** evaluated differently (potential upside vs. cost of waiting), or allocating a fixed % of budget to exploration. *Failure:* Misses high-impact future opportunities; undervalues crucial information gathering.
  8.  **Interaction (Complements/Substitutes):** *Real Issue, Limited Requirement for You.* Systematic modeling is infeasible. *Requirement:* **Qualitative flagging** during scoring (e.g., "Does funding A significantly boost/reduce impact of B/C?"). *Failure:* Misses synergies; wastes money on redundant efforts; underestimates leverage points.
  9.  **Cluelessness:** *Fundamental Constraint, Not Solvable Requirement.* *Requirement:* Framework must **force explicit acknowledgment of uncertainty** (especially in importance/long-term effects) and potentially **de-prioritize causes relying entirely on speculative long chains**. Meta-causes (influencing funders) need separate, potentially lower evidence thresholds. *Failure:* Wasted resources on speculative bets disguised as certainty; ignoring crucial but uncertain paths.
  10. **Usability (Non-Confident Numbers):** *Non-Negotiable Requirement.* Framework **MUST function robustly with qualitative/rough quantitative judgements** (e.g., scales: Very High/High/Medium/Low/Very Low, or 1-3/1-5 scores). *Failure:* Framework unusable by your team; decisions stall or revert to gut feeling without structure.

  ### Joint Satisfiability & Showstoppers
  *   **Satisfiable Subset:** Requirements 1-4 and 10 are **non-negotiable and jointly satisfiable with a well-designed qualitative/semi-quantitative framework.** 5, 6, 8, and 9 can be mitigated sufficiently with qualitative checks and process design (e.g., consistent cause definition rules, uncertainty flags). 7 (Option Value) requires explicit inclusion but is achievable via a separate bucket or meta-category.
  *   **Key Tension Points:**
      *   Demanding *high precision* (fighting 5,6,8,9) conflicts directly with **Usability (10)** and **Limited Resources (1)**.
      *   Ignoring **Option Value (7)** or **Cluelessness (9)** undermines **Robustness (implied by 4)**.
  *   **Biggest Showstopper Requirement: Usability (10).** Frameworks demanding precise quantification, complex counterfactual modeling, or extensive data gathering are immediately invalid for your context. This knocks out most "academic ideal" frameworks and over-engineered quantitative models.

  ### How ITN (Adapted) Fares
  *   **Strengths for You:** Naturally addresses **Comparability (2)**, can be made **Clear (3)** and **Actionable (1)** with qualitative scales. Handles **Neglectedness** (part of fungibility/6) simply.
  *   **Weaknesses/Needed Adaptations:**
      *   **Partition Sensitivity (5):** Needs strict rules for defining cause granularity upfront.
      *   **Fungibility (6):** Requires caveats/questions added to Neglectedness scoring.
      *   **Option Value (7):** Must be added as a separate "meta-cause" (e.g., "Exploratory Research Capacity").
      *   **Interaction (8):** Needs a prompt during review/deliberation.
      *   **Cluelessness (9):** Requires scoring Importance with explicit uncertainty bands/confidence levels. Meta-causes need separate handling.
      *   **Usability (10):** **Works well** if scores are simple scales (e.g., 1-5), not complex metrics.
  *   **Verdict:** ITN is a **viable starting point** *if* you explicitly address its weaknesses through **process design** (cause definition rules, separate meta-category for exploration, qualitative prompts for interactions/fungibility/cluelessness, simple scoring scales) and **embrace qualitative uncertainty.** Its simplicity is its major advantage for your constraints.
