  ### Decision Theory Take-Home Question (25 marks)

  **Background**  
  This question explores two decision-theoretic scenarios involving predictors. Three decision approaches are defined by their procedures:  
  - **Approach A**: Intervene on your own action and ask what would causally follow.  
  - **Approach B**: Condition on your action and ask what it tells you.  
  - **Approach C**: Ask what would follow if your decision procedure returned this output, holding fixed whatever else depends on that procedure.  

  **Case 1: Counterfactual Mugging (CM)**  
  A fair coin is flipped.  
  - If **heads** (probability 0.5): You are asked to pay $1,000. If you pay, you receive nothing. If you refuse, nothing happens.  
  - If **tails** (probability 0.5): You are not approached. You receive $1,000,000 if and only if the predictor predicted you would have paid had the coin landed heads.  
  The coin landed heads, and you are being asked to pay.  

  **Case 2: XOR Blackmail (XB)**  
  Your house is worth $1,000,000. A natural flood destroys it with probability \( p = 1/100 \), independently of your actions. A blackmailer sends a letter demanding $1,000 and threatening to destroy the house (at no cost) if you refuse. The letter is sent if and only if exactly one of these is true:  
  (i) You would pay if the letter arrived.  
  (ii) The natural flood occurs.  
  The letter has arrived.  

  **Part 1 (10 marks)**  
  For each case (CM and XB) and each approach (A, B, C):  
  (a) State the recommended action (pay or refuse).  
  (b) Write out the explicit expected value calculation justifying the recommendation.  

  **Part 2 (10 marks)**  
  Approach C recommends paying in CM but refusing in XB.  
  (a) Explain why this is not a contradiction.  
  (b) Diagnose the tempting argument that CM and XB are "formally identical" (i.e., identical up to relabeling variables), so any coherent theory must treat them the same.  

  **Part 3 (5 marks)**  
  Now suppose:  
  - The predictor’s prediction of your action is correct with probability \( q \) (\( 0.5 < q < 1 \)), independently of everything else.  
  - The predictor’s flood prediction remains perfect.  
  - The flood probability \( p \) is negligible (ignore terms of order \( p \)).  
  For **CM** and **XB** separately:  
  (a) Derive the condition on \( q \) under which Approach C still recommends its original action.  
  (b) What is the asymmetry (if any) between the thresholds for \( q \) in CM vs. XB? What does this asymmetry show? Does it favor Approach C or undermine the examples as evidence? What further information is needed to decide?  

