prompt: |-
  My friend and I have been going round on Newcomb's problem for a couple of years, and the literature has been stuck on it for fifty-odd, so I'm assuming nobody is going to settle it tonight. She one-boxes, I two-box, we've both read all the standard stuff — dominance, why aintcha rich, causal versus evidential expected utility — so please don't just walk me through the two theories again. Neither of us has moved an inch.

  Yesterday we tried to break the tie by tampering with the setup: suppose the predictor is 99% accurate overall, but it's errors aren't spread evenly — it's basically perfect at spotting one-boxers and almost useless on two-boxers, so if you two-box you usually find the million sitting there anyway. In that version she says the whole case for one-boxing was smuggled in by the accuracy spec; I say fine, then Newcomb was never testing decision theories at all, it was testing how you describe the predictor.

  My working theory now is that the stalemate is fake: the one-boxer is really answering "what sort of agent should I be, what should I have made myself into before the prediction was made," and the two-boxer is answering "what should I do standing here with the boxes in front of me." Is that the whole of it, or is there a genuine disagreement underneath — about the causal structure of the case, about which conditional probabilities are the right ones to plug in, about which versions of the setup even count as data? And given your diagnosis, what would count as progress: a formal result about when the act question and the disposition question come apart, clarity about which sense of "99% accurate" is the load-bearing one, or just agreeing to answer the two questions separately? I want a diagnosis with reasons, not another tour of the options.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user and their friend have been stuck on Newcomb's problem for years, with one one-boxing and the other two-boxing. They've already gone through all the standard arguments—dominance, why one-boxers get rich, causal vs. evidential decision theory—so rehashing those won't help. 

  The user proposed a modified version where the predictor is 99% accurate overall but better at spotting one-boxers. Their friend argues this setup smuggles in assumptions favoring one-boxing, while the user thinks it highlights how the predictor's description affects the problem. 

  The user's current theory is that the stalemate might be superficial: one-boxers are thinking about what kind of agent to be before the prediction, while two-boxers focus on the immediate choice. They want to know if there's a deeper disagreement about causal structure or conditional probabilities, and what would count as progress.

  First, I need to diagnose the core disagreement. Both sides agree on the facts—dominance principle vs. expected utility—but prioritize different things. The two-boxer sees the physical causality: once boxes are set, your choice doesn't affect Box B. The one-boxer cares about the epistemic link: choosing one-box signals you were predicted to do so, making Box B likely full. 

  The user's agent vs. act distinction makes sense. One-boxing is about the agent's disposition influencing the prediction, while two-boxing is about the act's direct consequences. But the deeper issue is how they interpret dependence. The predictor's accuracy description is crucial—whether it's defined by action types or individual decisions. In the modified scenario, if accuracy varies (e.g., better at predicting one-boxers), it changes the conditional probabilities, affecting the evidential calculation. 

  Progress might come from formalizing when act and disposition diverge. Decision theories like EDT and CDT handle this differently. The user could explore cases where the predictor's accuracy depends on the agent's type, making disposition matter more. Clarifying "99% accurate" is key—is it P(prediction correct | action) or P(correct | type)? That determines if one-boxing is rational. 

  The user needs a diagnosis that moves beyond rehashing old arguments. Highlighting the dependency in the accuracy specification and formalizing disposition vs. act could break new ground. They should agree to separate the questions: "What agent-type should I be?" vs. "What should I do now?" That might resolve the stalemate by showing they're answering different questions.
answer: |-
  Your diagnosis is sharp and points to the real fracture. The stalemate *isn't* primarily about dominance vs. expected utility calculations *given the same setup* – it's about **which setup counts as "Newcomb's Problem"** and **what constitutes a valid description of the predictor's accuracy**. The core disagreement is metaphysical and semantic, masquerading as a decision-theoretic one. Here's the breakdown with reasons:

  1.  **The Agent/Act Distinction is Real, But Not the Root Cause:**
      *   You're right that one-boxers often implicitly answer "What kind of agent should I *be*?" (favoring a cooperative/transparent disposition) while two-boxers answer "What should I *do* right now?" (favoring causal dominance).
      *   **However, this distinction arises *because* of the deeper disagreement about causality and dependence.** The one-boxer believes the predictor's accuracy *creates* a causal-like link (via correlation with their disposition) between their *current* choice and the *past* prediction. The two-boxer denies this link is causal or decision-relevant *at the point of choice*.

  2.  **The Genuine Disagreement: The Ontology of Dependence & The Meaning of "Accuracy"**
      *   **Causal Structure:** The two-boxer sees the world as *only* causally influenced forward in time. The prediction is fixed. The boxes' contents are fixed. Choice only affects the box you *physically* take. The correlation is a *brute fact* about the predictor, not a dependence your choice can exploit *now*.
      *   **The One-Boxer sees Evidential Dependence as Action-Relevant:** They see the correlation (P(Full B | One-box) ≈ 1) as a fundamental feature of the decision landscape *that their choice participates in*. Choosing one-box isn't *causing* Box B to be full; it's *manifesting the state of the world* where Box B is highly likely to be full *because* of the kind of agent they are (which includes their decision disposition).
      *   **"99% Accurate" is the Load-Bearing Ambiguity:** This is the critical point your modified scenario exposed.
          *   **Two-Boxer Interpretation (Your Friend):** Accuracy is defined *type-wise* or *dispositionally*. The predictor is good at identifying *types* of agents (one-boxers/two-boxers). Once the prediction is made based on *type*, the *specific act* of a two-boxer doesn't retroactively change Box B. In your modified scenario, the predictor is *still* 99% accurate overall *because* it perfectly IDs one-boxers and is mediocre with two-boxers. A two-boxer choosing *now* still sees $1,000,000 potentially sitting there *despite* their type. Dominance applies. Your friend argues that specifying uneven accuracy *reveals* that standard Newcomb smuggles in the assumption that accuracy is defined *act-wise*, which they reject as incoherent for a predictor acting before the choice.
          *   **One-Boxer Interpretation (Implied by Standard Setup):** Accuracy is defined *act-wise*. The predictor predicts *the specific act you will perform*. The "99% accurate" means P(Predict One-box | You One-box) ≈ 1 and P(Predict Two-box | You Two-box) ≈ 1. This *requires* that the predictor's accuracy holds *conditional on the specific action taken*. Your modified scenario breaks this symmetry – it specifies that P(Predict One-box | You One-box) ≈ 1 but P(Predict Two-box | You Two-box) is *low*. For the one-boxer, this *isn't* Newcomb's Problem anymore; it's a different scenario where two-boxing *might* become rational if the predictor is bad enough at spotting two-boxers specifically. They argue that standard Newcomb *assumes* act-wise accuracy symmetry.

  3.  **Why the Stalemate is Fake (and Real):**
      *   **Fake:** You are *literally using different definitions* of the predictor's capability ("accuracy"). You are arguing about *different scenarios*. Your friend insists a predictor *must* predict types/dispositions to achieve high accuracy *before* the choice. You (implicitly for standard Newcomb) and the literature often assume a predictor capable of predicting specific acts with symmetric accuracy. **You are disagreeing about what "prediction" even means in this context.**
      *   **Real:** Underlying this is a fundamental disagreement about **whether evidential dependence grounded in agent type/disposition is a legitimate basis for rational action *at the moment of choice***, especially when it *feels* like it conflicts with causal dominance. This touches on deep philosophical divides about time, causality, free will, and the nature of rational agency.

  **What Counts as Progress?**

  Rehashing EDT vs. CDT won't help. Progress requires shifting the ground:

  1.  **Formalize the Predictor:** Explicitly define what "99% accurate" entails mathematically and ontologically:
      *   **Model 1 (Type-Based):** Predictor estimates the agent's *disposition* (P(One-box | Agent's traits)). Accuracy is P(Correct Prediction | Agent Type). *Action* is determined by disposition. Accuracy over acts is *derived* (and may be asymmetric).
      *   **Model 2 (Act-Based):** Predictor predicts the *specific future act* (P(Predicted Act | Actual Act) ≈ 0.99). This requires either backward causation, fatalism, or a sufficiently determined agent where the act is predictable from prior state.
      *   **Agree:** "Newcomb's Problem" *requires* Model 2 (symmetric act-wise accuracy). Your friend rejects Model 2 as incoherent or impossible. **Progress Step 1:** Acknowledge this is the core disagreement. Argue directly about the *possibility and coherence* of Model 2. Can a predictor *reliably* predict specific acts without predicting type? What does that imply about free will or determinism?

  2.  **Formalize the Disposition/Act Split:** Develop scenarios where the link between disposition and act is explicitly broken or weakened *without* changing the predictor's overall accuracy.
      *   **Example:** "The Capricious Agent": You are usually a one-boxer (disposition), but due to a random neurological event (known to occur with 1% probability just before choice), you might two-box against your disposition. The predictor is 99% accurate *overall* but doesn't model the random event. What should you (the usually-one-boxing agent) do *now*? Does knowing your *disposition* change the calculation vs. the pure act? **Progress Step 2:** Explore if/when rational agents should commit to dispositions *knowing* they might act against them later, and how that affects the Newcomb calculation. Does separating "agent design" from "act choice" clarify anything?

  3.  **Agree to Answer Separately:** Explicitly bifurcate the question:
      *   **Question A (Design):** "What decision disposition should I adopt, knowing that a predictor will observe this disposition and fill Box B accordingly *before* I face the choice?"
          *   *Answer (Uncontroversial):* Adopt a disposition to one-box. You get $1,000,000.
      *   **Question B (Action):** "I am now facing the boxes. The prediction is made, Box B is full or empty. What should I do *now*?"
          *   *Answer (Controversial):* If you believe Model 2 (act-wise accuracy) is coherent *and* applies, one-box. If you believe Model 2 is incoherent/impossible *or* that only Model 1 (type-wise) is valid, two-box.
      *   **Progress Step 3:** Agree that Question A has a clear answer (one-box disposition wins). The *only* disagreement is about Question B *under the assumption of Model 2*. This isolates the debate purely to: "Is Model 2 coherent? And if so, does evidential dependence justify violating dominance *at the point of action* in this specific, highly artificial scenario?" This is a much cleaner, though still potentially unresolvable, philosophical question.

  **Conclusion & Path Forward:**

  Your diagnosis hits the nail on the head: the stalemate arises because you are answering subtly different questions rooted in fundamentally different interpretations of the predictor's capability ("accuracy") and the nature of the dependence between choice and prediction. **The genuine disagreement is about the coherence and implications of a predictor with symmetric, act-wise accuracy (Model 2).** Your friend rejects this model as invalid for the decision at the point of choice; one-boxers accept it.

  **To make progress:**
  1.  **Focus ruthlessly on defining "99% accurate."** Argue directly about the possibility and meaning of Model 2 (act-wise prediction) vs. Model 1 (type-wise prediction). Is Model 2 even coherent without backwards causation or fatalism?
  2.  **Formalize scenarios** that decouple disposition from specific acts within the prediction framework.
  3.  **Explicitly separate the "design" question** (what disposition to have) from the "action" question (what to do now under a specific model of prediction). Acknowledge that the design question favors one-boxing, isolating the real debate to the action question under Model 2.

  This won't *settle* Newcomb, but it will transform the debate from a frustrating stalemate into a clearer, more productive discussion about the metaphysics of prediction and the boundaries of rational choice models. Good luck – you've already done the hard work of pinpointing the real issue!
