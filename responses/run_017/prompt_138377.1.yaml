answer: |-
  Here is a point-by-point assessment of the student's answer, with a score and detailed comments for rubric inclusion. The answer is evaluated against the specific subparts (a), (b), (c), and (d) of the question.

  **Overall Score: 19/25 (B+)**  
  *Breakdown: (a) 5/5, (b) 5/5, (c) 6/6, (d) 3/9*

  ---

  ### **Comments for Rubric**  
  *(Key: ✓ = Correct, ✗ = Incorrect, ⚠ = Partial/Misleading)*  

  #### **(a) Contextualism: What Varies & Whose Stakes Matter**  
  ✓ **Correct:**  
  - Accurately identifies contextualism as a semantic thesis about "knows."  
  - Correctly states that truth-conditions depend on the **attributor’s context** (including stakes/salience of doubts).  
  - Explicitly notes stakes belong to the **attributor** (not the subject).  

  #### **(b) Pragmatic Encroachment: What Practical Factors Do & Whose Stakes Matter**  
  ✓ **Correct:**  
  - Clearly states pragmatic encroachment affects **knowledge itself** (not just semantics).  
  - Correctly identifies **subject’s stakes** as what matters (e.g., Hannah’s own practical situation).  
  - Explains that higher stakes require "better epistemic shape" (e.g., stronger evidence).  

  #### **(c) Bank Cases: Predictions for Each View**  
  ✓ **Correct for Both Views:**  
  - **Contextualism:**  
    - Low-stakes: Attributor’s utterance "Hannah knows" is **true** (low standards).  
    - High-stakes: Same utterance is **false** (raised standards).  
    - Correctly notes Hannah’s evidence/situation is unchanged.  
  - **Pragmatic Encroachment:**  
    - Low-stakes: Hannah **knows** (evidence sufficient given low stakes).  
    - High-stakes: Hannah **does not know** (evidence insufficient given high stakes).  

  #### **(d) Classification of Pragmatic Encroachment & Case Differentiation**  
  ⚠ **Partially Correct but Fundamentally Flawed:**  
  ✓ *Surface-level accuracy:*  
  - Correctly denies pragmatic encroachment is classical invariantism.  
  - Correctly notes it is invariantist regarding the *semantics* of "knows" (meaning doesn’t shift with speaker).  

  ✗ **Major Errors:**  
  1. **Misclassification:**  
     - Claim: *"Pragmatic encroachment is best understood as just a version of contextualism."*  
     - **Problem:** This conflates metaphysical and semantic theses. Pragmatic encroachment is **not contextualism**—it is a form of **subject-sensitive invariantism** (a subtype of *invariantism*).  
     - **Correction:** Contextualism is semantic (truth-conditions vary with attributor’s context). Pragmatic encroachment is metaphysical (knowledge depends on subject’s practical situation). They are rival frameworks.  

  2. **Misrepresentation of Differences:**  
     - Claim: *"The only difference is cosmetic... in standard bank cases the attributor and subject have the same stakes anyway, so the views predict the same thing."*  
     - **Problem:** This ignores critical cases where attributor/subject stakes **diverge**. The views make distinct predictions here, revealing their structural difference.  
     - **Correction:** The disagreement is not "cosmetic"—it’s about whether knowledge depends on the attributor’s context (contextualism) or the subject’s practical situation (pragmatic encroachment).  

  3. **Missing Counterexample:**  
     - **Required Case:** A scenario where **attributor has low stakes** but **subject has high stakes**.  
       - *Example:* A careless bystander (low stakes) says, "Hannah knows the bank is open Saturday," while Hannah faces a penalty (high stakes).  
     - **Predictions:**  
       - Contextualism: Utterance is **true** (attributor’s low stakes → low standards).  
       - Pragmatic Encroachment: Hannah **does not know** (her high stakes → insufficient evidence).  
     - **Significance:** This shows the views are empirically distinct—not "the same idea."  

  ---

  ### **Summary Feedback for Student**  
  *Strengths:* You clearly understand core mechanics of both views (a-c), accurately distinguishing attributor vs. subject stakes and correctly applying them to bank cases. Your definitions are precise.  
  *Weaknesses:* In (d), you misclassify pragmatic encroachment as contextualism and underestimate their divergence. Pragmatic encroachment is a form of **invariantism** (specifically, *subject-sensitive invariantism*), not contextualism. Crucially, the views conflict when attributor/subject stakes differ—a point you overlooked but that is essential for taxonomy. Revise the "cosmetic difference" claim: the disagreement is foundational (semantic vs. metaphysical).  

  **To Improve:** Focus on cases where attributor/subject stakes diverge (e.g., a low-stakes speaker discussing a high-stakes subject). This tests whether standards track the speaker (contextualism) or the subject (pragmatic encroachment).
