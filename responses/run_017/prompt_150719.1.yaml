  ### The Device
  A cylinder contains a single gas molecule and is partitioned by a movable, lockable piston. The demon is a four-state system (states: A0, A1, B0, B1) coupled to the gas and piston. The gas has two states: molecule on the left (0) or right (1) of the partition. The cycle:  
  - **Start**: Piston locked at center, gas state 0 or 1 (unknown), demon in A0.  
  - **Step 1 (Measure)**: Demon reversibly couples to gas. If gas is 0, demon transitions to B0; if gas is 1, to B1. Absorbs heat \( \epsilon \) from bath.  
  - **Step 2 (Unlock & Flip)**: Piston unlocks. Gas thermally flips state (0↔1).  
  - **Step 3 (Work)**: Demon transitions: B0→A1 or B1→A0. Releases energy \( \epsilon \) as work to load.  
  - **Step 4 (Reset)**: Demon transitions: A1→B1 or A0→B0 (gas now matches demon). Absorbs heat \( \epsilon \).  
  - **Step 5 (Lock & Flip)**: Piston locks. Gas thermally flips. Demon transitions: B1→A0 or B0→A0 (final state). Per cycle: net work \( 2\epsilon \), bath heat \( -2\epsilon \).  

  ### Reversibility Check  
  - **Measure (Step 1)**: Coupling is adiabatic; demon-gas interaction is Hamiltonian (e.g., controlled NOT gate). Reversible.  
  - **Gas Flip (Steps 2 & 5)**: Thermal flips are stochastic but individually reversible; no work or dissipation.  
  - **Work/Reset (Steps 3 & 4)**: Demon transitions are driven by energy differences; work extraction/reception is isentropic (e.g., via quartic potential). Reversible at quasi-static limit.  
  - **Lock/Unlock (Steps 2 & 5)**: Piston locking/unlocking is conservative (e.g., magnetic latch); no dissipation.  
  - **Cycle Closure**: All steps are unitary or thermal equilibria; no irreversible overwrites. Demon returns to A0.  

  ### Entropy Ledger  
  Table: Entropy changes per step (cycle average, \( k_B = 1 \)).  

  | Step | \(\Delta S_{\text{gas}}\) | \(\Delta S_{\text{demon}}\) | \(\Delta S_{\text{load}}\) | \(\Delta S_{\text{bath}}\) | Work |  
  |------|---------------------------|----------------------------|---------------------------|---------------------------|------|  
  | 1    | 0                         | 0                          | 0                         | \( -\epsilon/T \)         | 0    |  
  | 2    | \( \ln 2 \)               | 0                          | 0                         | 0                         | 0    |  
  | 3    | 0                         | 0                          | 0                         | 0                         | \( +\epsilon \) |  
  | 4    | 0                         | 0                          | 0                         | \( -\epsilon/T \)         | 0    |  
  | 5    | \( -\ln 2 \)              | 0                          | 0                         | 0                         | \( +\epsilon \) |  
  | **Total** | **0** | **0** | **0** | **\(-2\epsilon/T\)** | **\(+2\epsilon\)** |  

  Net work \( +2\epsilon \), bath entropy change \( -2\epsilon/T \). System entropy unchanged. Apparent violation resolved via mutual information in exorcism verdicts.  

  ### Verdict of Each Exorcism  
  - **Szilard (cost in bit acquisition)**: Fails. Claims work extraction requires an initial \( kT \ln 2 \) cost to "acquire the bit" from the gas. Here, correlation is established reversibly (Step 1) at no energy cost; the gas entropy increases later (Step 2) due to decorrelation, not acquisition. Over-explains by misallocating cost.  
  - **Landauer–Bennett (erasure cost)**: Fails. Asserts that a cycle necessitates erasure, costing \( kT \ln 2 \) per bit. Here, no bits are erased; the demon cycles reversibly. The exorcism cannot account for work output when erasure is absent.  
  - **Thermal-contact dissipation (measurement requires dissipation)**: Fails. Assumes any physical measurement dissipates \( kT \ln 2 \). But Step 1 is reversible and dissipationless via conservative coupling, proving measurement can be non-dissipative.  
  - **Mutual-information accounting (fluctuation theorems/info reservoirs)**: Explains. The work bound \( W \leq -T \Delta I \) (with \( \Delta I \) the mutual information change) holds. Here, \( \Delta I_{\text{gas:demon}} = -\ln 2 \) in Step 2 (decorrelation), allowing work \( 2\epsilon \leq T \ln 2 \) (if \( \epsilon \leq \frac{1}{2} T \ln 2 \)). Generalizes Landauer to dynamics without erasure.  

  ### The Load-Bearing Feature  
  The **reversible decorrelation of the gas and demon (Step 2)** is load-bearing. The gas flips thermally, destroying mutual information without demon involvement, permitting work extraction (Step 3) without erasure. If removed, the cycle breaks: work extraction requires decorrelation, and failure to decorrelate cancels net work. If erasure is allowed (e.g., reset to A0 via dissipation), Landauer’s \( kT \ln 2 \) cost appears, reducing net work to zero. Landauer is a special case where decorrelation is forced via irreversible erasure. The expectation holds: erasure is one (dissipative) path to decorrelation, but not the only one.  

  ### The Erasure Theorist’s Counterattack  
  The strongest counterattack: **"Writing to the piston position during work extraction (Step 3) is erasure relocated to the load."** The load’s microstate stores the "which path" information (B0→A1 or B1→A0), effectively overwriting its prior state. Erasure costs are deferred, not eliminated. This lands: the load must absorb entropy \( \ln 2 \) per cycle to avoid violating the second law, but in a macroscopic load, entropy is negligible (many microstates per energy level). Thus, while information is written, it is not erased within the cycle, and the load’s entropy change need not be accounted if it is an ideal work reservoir.  

  ### What I Can Claim in the Paper  
  The case proves that the Landauer–Bennett account is non-general: thermodynamic accounting is enforced by decorrelation, not erasure. When erasure is excluded by design, the second law collects via reversible loss of mutual information, and work extraction is bounded by \( -T \Delta I \). Erasure is merely a dissipative mechanism for \( \Delta I < 0 \), not a thermodynamic necessity.
