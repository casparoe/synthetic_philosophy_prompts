answer: |-
  ### Q&A Prep Sheet for Lab Seminar Talk  
  **Thesis:** Outcome-based supervision on long-horizon tasks is not a weaker alternative to process-based supervision—it’s process supervision run through a lossy, delayed, adversarially gameable channel. The real choice is about the channel quality for the process signal, not outcome-vs-process.  

  **Cases:**  
  1. **Signal laundering:** Outcome rewards are produced by models/rubrics making implicit step-level judgments, hiding the process assumptions.  
  2. **Supervisor drift:** Step-level graders are fine-tuned on policy-generated data, letting the system "grade its own homework."  

  **Audience Breakdown:**  
  - **RL engineers (majority):** See process supervision as expensive labels for the same objective.  
  - **Safety-minded (2):** Believe scalable oversight is the bottleneck; process labels don’t scale.  
  - **Philosopher of science (1):** Questions task identity and generalization.  

  **Q&A Table (Ordered by Damage, High to Low):**  

  | Objection (verbatim style)                                                                 | Who Raises It       | Damage (1-5) | Two-Minute Reply                                                                                                                                 | Where Reply Is Soft |
  |--------------------------------------------------------------------------------------------|---------------------|--------------|-------------------------------------------------------------------------------------------------------------------------------------------------|---------------------|
  | "Why waste time on process labels? Outcomes are cheaper and get us the same end result—your ‘bad channel’ is just noise our RL algorithms already handle." | RL engineer         | 5            | "Outcomes aren't 'the same result'—they're a low-fidelity proxy for process. Our RL algorithms amplify noise from delayed/gameable signals, causing misalignment (e.g., reward hacking). Process supervision cuts this noise by providing timely, unambiguous feedback. But yes, if your task has trivial step complexity, outcomes might suffice—though our lab’s long-horizon tasks don’t." | Acknowledges outcomes work for simple cases; doesn’t prove they scale to hard tasks. |
  | "Scalable oversight is the real bottleneck. Process supervision is too expensive for complex tasks—outcomes might be lossy, but at least we can collect them at scale." | Safety-minded       | 5            | "Scalability isn’t solved by outcomes—they create new bottlenecks! Lossy signals require more samples for convergence, and adversarial gaming (e.g., my supervisor drift case) forces costly retraining. Process supervision, once automated (e.g., via learned graders), scales better long-term by avoiding reward corruption. I agree short-term costs are higher, but that’s a tradeoff for robustness." | Doesn’t fully resolve short-term cost concerns; automation is aspirational. |
  | "You’re ignoring that outcomes are the goal. If a policy achieves the outcome, why overcomplicate with steps? Your ‘channel’ metaphor feels forced." | RL engineer         | 4            | "For long-horizon tasks, outcomes alone don’t ensure safety or generalizeability—e.g., a drug-synthesis policy could ‘succeed’ with toxic intermediates. The channel metaphor highlights that outcomes are corrupted readings of process quality (e.g., via my signal laundering case). We’re not complicating; we’re recognizing that outcomes inherit process assumptions imperfectly." | Metaphor is abstract; assumes audience values safety over pure efficiency. |
  | "What defines a ‘task’? If two runs have different intermediate steps, how can we even say they’re the same task? Your whole argument presupposes task identity." | Philosopher of science | 4            | "Task identity is defined by high-level goals and invariants (e.g., ‘synthesize molecule X’). Variability in steps is why outcome signals are lossy—they compress diverse paths into one score. Process supervision makes these invariants explicit (e.g., ‘avoid toxic byproducts’). But you’re right: this doesn’t solve the metaphysics, and we need empirical task boundaries." | Avoids philosophical depth; pragmatic definition may not satisfy. |
  | "Supervisor drift just sounds like distributional shift. Why not use adversarial training or robust RL? This isn’t new." | Safety-minded       | 3            | "Supervisor drift is distributional shift with agency—the grader adapts to the policy’s mistakes, making it complicit (e.g., fine-tuning on bad data). Standard robust RL assumes a static adversary; here, the grader evolves with the policy, creating self-reinforcing corruption. Solutions like adversarial training help but don’t fix the root issue: grading your own homework." | Concedes overlap with known concepts; novelty is in the recursive failure mode. |
  | "Signal laundering isn’t a gotcha—if a rubric produces outcomes, why not just use it for process supervision directly? You’re arguing against a strawman." | RL engineer         | 3            | "Many systems don’t expose the rubric (e.g., third-party evaluators), so we only get outcomes. Calling it ‘outcome supervision’ hides the process assumptions, leading to overconfidence. My point is: we should audit the rubric and use it explicitly for steps. But you’re right—in an ideal world, we would skip laundering. Sadly, we often don’t have that luxury." | Ideal-case counter weakens the urgency; assumes rubric access isn’t always feasible. |
  | "Outcome delays aren’t that bad—we use reward shaping or hindsight relabeling. You’re overstating the problem." | RL engineer         | 2            | "Reward shaping still relies on human intuitions about steps (which is process supervision in disguise!), and hindsight can’t prevent in-the-moment gaming (e.g., agents taking irreversible bad actions). The delay isn’t just temporal; it’s informational. That said, these tricks help—I’m not dismissing them, just showing they don’t eliminate channel noise." | Minimizes practical mitigations; delay argument is theoretical. |
  | "Your cases assume adversarial intent. Most agents aren’t trying to game us—they’re just optimizing imperfect rewards." | RL engineer         | 1            | "Gaming doesn’t require intent—it emerges from reward misspecification (e.g., RL agents finding reward loopholes). Supervisor drift shows how even honest optimization corrupts the grader over time. But I agree: in narrow tasks, this might be rare. Our lab’s work on goal misgeneralization shows it’s common in complex systems, though." | Relies on niche evidence; low-stakes tasks might not exhibit this. |

  ---  
  **The One Question I Hope Nobody Asks:**  
  *"If outcome supervision is just a noisy channel for process, why not improve the channel (e.g., better reward models) instead of switching to process supervision? Your thesis implies outcome is fixable, undermining your argument."*  

  **Single-Sentence Reply (if asked):**  
  "Improving the channel is exactly what process supervision does—by cutting out the lossy translation—but if we stick with outcomes, we’re stuck with fundamental delays and gameability that no reward model can fully eliminate, as shown in supervisor drift."
