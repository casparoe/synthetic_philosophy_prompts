prompt: |-
  I'm a novelist, mid-draft on a book whose subplot is a family-run animal sanctuary next door to a contract research lab, and my critique group says chapter twelve has turned into a lecture, so I'm trying to work out what I actually think rather than what my protagonist thinks, by going case by case on gut feeling. Here's where I land. A pig who's had three genuinely good years at the sanctuary, killed painlessly in her sleep and replaced by a piglet who gets an equally good life: nowhere near as bad as factory farming, but still not fine. The same pig killed painlessly and not replaced: clearly worse, and I can't say why, given she never knows either way. A lab beagle with a short but net-positive life, used in a test that removes a small chance of harm to people: I feel uneasy but not condemning, which feels like cowardice. A crow that holds a grudge against one specific person versus a mouse, same quantity of pain: worse for the crow, and I feel that even while thinking I shouldn't. A fire, save either a human infant or an adult chimp: I'd grab the infant and then feel bad about it. A lump of human brain tissue grown from skin cells, no body, no senses: destroying it means nothing to me at all. A dog grieving at its dead owner's grave versus a feral pigeon freezing to death: I think we owe the dog something, whereas the pigeon is sad but isn't owed anything. An octopus pacing a bare tank versus a chicken in a cage the same size: worse for the octopus, because boredom. And the engineered low-affect pigs in my book's near-future setting, who can't suffer much but still enjoy rooting around: eating those feels definately fine to me, and I'm suspicious of how fine it feels.

  Is there one principle that gets all of these, or close to all of them? The two I can't reconcile are the crow/mouse one and the infant/chimp one: those seem to need some kind of hierarchy of beings, while almost everything else on my list looks like plain equal consideration of suffering with no hierarchy anywhere, and I can't see how to have both without the hierarchy swallowing the equality. Please don't give me a reading list or name names, my deadline is Friday and I need the shape of the thing, not sources. Give me exactly five numbered items, one or two sentences each, no preamble and no sign-off: the principle stated in a single sentence, then which clause of it is doing the work in which of my cases, then what it says about the case I keep going back and forth on (a herd of deer on a predator-free island, slowly starving, and does it matter whether we caused it) plus one case I haven't thought of, then which of my verdicts it cannot accommodate, and last the single verdict my protagonist should dig her heels in on when she argues with the vet in chapter nine, and why that one.
reasoning: |-
  Okay, the user is a novelist struggling with ethical dilemmas in their book's subplot involving an animal sanctuary next to a research lab. Their critique group flagged chapter twelve as too preachy, so they're trying to clarify their own stance through various scenarios. They've listed specific cases: pigs in a sanctuary, lab beagles, a grudge-holding crow vs. a mouse, saving a human infant vs. an adult chimp, brain tissue destruction, a grieving dog vs. a freezing pigeon, an octopus vs. a chicken in captivity, and engineered low-suffering pigs. They need a unifying principle that covers most cases, especially reconciling the crow/mouse and infant/chimp dilemmas without hierarchy overriding equality.

  First, I need to identify the core tension. They mention equal consideration of suffering but also intuitive hierarchies (crows over mice, infants over chimps). The key is reconciling equality with differential treatment based on capacities. Maybe the principle should center on moral weight from complexity of experience, not just suffering. That could explain why the crow's grudge matters more—it indicates higher cognitive and emotional complexity. Similarly, saving the infant over the chimp might stem from human infants' potential for complex experiences within human society, not inherent superiority.

  Looking at their cases: The pig replaced after death feels wrong because it disrupts relationships, even if the pig doesn't know. The non-replaced pig is worse because it prevents future positive experiences. The lab beagle causing unease but not condemnation might fit if the net-positive life and minor harm reduction for humans are weighed, but uncertainty lingers due to the beagle's capacity for suffering versus the research benefits. The crow/mouse disparity aligns with complexity—the crow's grudge indicates richer inner life, making its suffering morally weightier. The infant/chimp choice prioritizes human relational potential. The brain tissue has no experiences, so destruction is neutral. The grieving dog is owed care due to its bond with humans, while the feral pigeon's suffering, though sad, lacks that relational context. The octopus suffers more in captivity due to higher intelligence and boredom. Engineered pigs with low affect but enjoyment might be fine to eat because their capacity for suffering is minimal, but the user's suspicion suggests a need to ensure no hidden harms.

  The deer on a predator-free island: If humans caused the starvation, we have a duty to intervene due to responsibility. If natural, intervention is optional but compassionate. The unresolved cases might be the beagle scenario—why unease but not condemnation? The principle could say minor human benefits might justify minimal animal harm only if alternatives are lacking, explaining the unease as a proportionality concern.

  The protagonist should dig her heels in on the sanctuary pig not being replaced. It emphasizes continuity of care and the value of individual lives, challenging utilitarian replacement. This fits the story's tension between the sanctuary's ethics and the lab's pragmatism.

  Need to distill this into five numbered items per their request. Each item must be concise: state principle, apply to cases, address the deer scenario, note a gap, and specify the protagonist's stance. Ensure it's tight—no fluff.
answer: |-
  1.  **Principle: Moral weight arises from the complexity of inner experience (capacity for suffering *and* flourishing, social bonds, anticipation, self-awareness), demanding consideration proportional to that complexity, alongside a duty to avoid causing preventable harm.** The complexity clause explains the crow (richer cognition/emotions) vs. mouse and infant (relational potential/kinship ties) vs. chimp verdicts, while the baseline harm avoidance covers the pig replacement unease and octopus boredom.
  2.  **For the deer:** If we caused the island imbalance, the duty to avoid preventable harm compels intervention (cull/relocate); if natural, intervention is compassionate but not morally mandatory, as the baseline harm wasn't directly caused by us.
  3.  **It cannot accommodate the brain tissue verdict:** The principle assigns zero weight due to lack of *any* experience, which aligns with your feeling, but doesn't inherently explain *why* potential for complexity (if developed) isn't factored, unlike the infant's potential. Your feeling bypasses potential entirely here.
  4.  **It struggles with the lab beagle:** Unease stems from the harm/benefit calculus feeling disproportionate *despite* net-positive life/minor human benefit, hinting at a gap concerning whether *any* non-consenting harm for minor human gain is acceptable, even with compensation, which the principle's flexibility allows but doesn't resolve your discomfort.
  5.  **Protagonist digs in on: The sanctuary pig not being replaced.** Argue that ending a flourishing life *prematurely*, even painlessly, violates the inherent value of its *existing* complex experience and social bonds within the sanctuary, regardless of replacement utility ("It wasn't *time* for her yet. Her life *here* had weight."). This anchors the sanctuary's non-utilitarian ethic against the lab's perspective.
