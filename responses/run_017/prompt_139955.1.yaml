  ### Unoccupied Nodes & Indistinguishable Leaves  
  - **Unoccupied nodes:**  
    - **Leaf 9 (Rationalist Demonstrativism):** Unattractive (rationalists typically assume shared space; no historical precedent).  
    - **Leaf 10 (Rationalist Skepticism):** Unexplored (rationalists rarely deny cross-modal links).  
  - **Indistinguishable leaves:**  
