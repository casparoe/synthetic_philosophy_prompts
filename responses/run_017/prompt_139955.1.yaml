  ### Where the Tree is Weakest  
  1. **Contestable branch: "What counts as success?" (Branch 3/6)**  
     - Forced-choice, phenomenal similarity, and classification are muddled in practice (e.g., subjects might match without concepts).  
     - *Redraw if:* Empirical work dissociates these criteria (e.g., forced-choice success without phenomenology).  

