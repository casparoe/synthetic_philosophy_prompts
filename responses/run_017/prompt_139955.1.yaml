  ### Decision Tree: The Molyneux Question and the Content of Perception  
  *Starting point: A person blind from birth gains sight. They know a cube and globe by touch. Can they visually identify which is which before touching either?*  

  ---

  #### **Branch 1: How is the question settled?**  
  *Distinction: Empirical facts vs. reflection on spatial representation.*  
  - **Empirically (run experiments)** → Go to Branch 2.  
  - **By reflection (a priori reasoning)** → Go to Branch 5.  

  #### **Branch 2 (Empirical): Shared amodal spatial format?**  
  *Distinction: Common content vs. modality-specific content.*  
  - **Yes (shared format)** → Go to Branch 3.  
  - **No (proprietary content)** → Go to Branch 4.  

  #### **Branch 3 (Empirical, Shared Format): What counts as success?**  
  *Distinction: Criteria for cross-modal matching.*  
  - **Forced-choice matching (correct selection)** → Leaf 1.  
  - **Phenomenal similarity (look/feel resemblance)** → Leaf 2.  
  - **Classification (same concept applied)** → Leaf 3.  

  #### **Branch 4 (Empirical, Proprietary Content): Can demonstrative reference occur without shared content?**  
  *Distinction: Non-conceptual "this" vs. content-dependent identification.*  
  - **Yes (demonstrative pick-out)** → Leaf 4.  
  - **No (no shared content, no reference)** → Leaf 5.  

  #### **Branch 5 (Reflection): Shared amodal spatial format?**  
  *Distinction: Rationalist unity vs. modality-specificity.*  
  - **Yes (shared format)** → Go to Branch 6.  
  - **No (proprietary content)** → Go to Branch 7.  

  #### **Branch 6 (Reflection, Shared Format): What counts as success?**  
  *Distinction: Criteria for cross-modal matching.*  
  - **Forced-choice matching** → Leaf 6.  
  - **Phenomenal similarity** → Leaf 7.  
  - **Classification** → Leaf 8.  

  #### **Branch 7 (Reflection, Proprietary Content): Can demonstrative reference occur without shared content?**  
  *Distinction: Rationalist non-conceptualism vs. concept-dependence.*  
  - **Yes (demonstrative pick-out)** → Leaf 9.  
  - **No (no shared content, no reference)** → Leaf 10.  

  ---

  ### Leaves (Positions)  
  1. **Conservative Nativism** (Empirical, Shared, Forced-Choice)  
     - *Most awkward commitment:* Must deny empirical evidence of failure (e.g., early post-surgery tests).  
     - *Variants:*  
       - (1) Delayed test: **Yes** (learning irrelevant with innate matching).  
       - (2) Unnameable solid: **Yes** (shape accessible amodally).  
       - (3) Picture variant: **No** (2D lacks 3D spatial content).  
     - *Confidence in historical name:* Medium (inspired by nativists like Descartes; explicit? Unclear).  

  2. **Phenomenal Nativism** (Empirical, Shared, Phenomenal)  
     - *Most awkward commitment:* Assumes touch/vision phenomenology overlaps innately, despite modality differences.  
     - *Variants:*  
       - (1) Delayed test: **Yes** (phenomenal match is immediate).  
       - (2) Unnameable solid: **Yes** (phenomenal similarity persists).  
       - (3) Picture variant: **No** (photos lack tactile phenomenology).  
     - *Confidence in historical name:* Low (phenomenal focus is modern; not clearly historical).  

  3. **Conceptual Nativism** (Empirical, Shared, Classification)  
     - *Most awkward commitment:* Requires innate concepts for all nameable shapes, even irregular ones.  
     - *Variants:*  
       - (1) Delayed test: **Yes** (concept applies directly).  
       - (2) Unnameable solid: **No** (lacks concept for classification).  
       - (3) Picture variant: **Yes** (picture triggers concept).  
     - *Confidence in historical name:* High (e.g., Kant; concepts structure perception).  

  4. **Demonstrative Reference View** (Empirical, Proprietary, Demonstrative)  
     - *Most awkward commitment:* Claims "this" can track objects without shared content—mysterious mechanism.  
     - *Variants:*  
       - (1) Delayed test: **Yes** (demonstratives need no learning).  
       - (2) Unnameable solid: **Yes** (no concept needed for "this").  
       - (3) Picture variant: **No** (picture ≠ object for demonstratives).  
     - *Confidence in historical name:* Medium (Gareth Evans; debated).  

  5. **Sensory Atomism** (Empirical, Proprietary, No Reference)  
     - *Most awkward commitment:* Cannot explain cross-modal transfer without association (e.g., Locke).  
     - *Variants:*  
       - (1) Delayed test: **No** (without pairing, still blind to links).  
       - (2) Unnameable solid: **No** (no shared content to leverage).  
       - (3) Picture variant: **No** (no basis for matching).  
     - *Confidence in historical name:* High (Locke, Berkeley).  

  6. **Rationalist Direct Realism** (Reflection, Shared, Forced-Choice)  
     - *Most awkward commitment:* Ignores empirical failures; assumes reflection trumps observation.  
     - *Variants:*  
       - (1) Delayed test: **Yes** (space is innately unified).  
       - (2) Unnameable solid: **Yes** (amodal space covers all shapes).  
       - (3) Picture variant: **No** (2D lacks spatial immediacy).  
     - *Confidence in historical name:* Medium (Leibniz; explicit on Molyneux).  

  7. **Rationalist Phenomenalism** (Reflection, Shared, Phenomenal)  
     - *Most awkward commitment:* Introspection cannot reveal if touch/vision feel alike.  
     - *Variants:*  
       - (1) Delayed test: **Yes** (phenomenal match knowable a priori).  
       - (2) Unnameable solid: **Yes** (space ensures similarity).  
       - (3) Picture variant: **No** (pictures distort phenomenology).  
     - *Confidence in historical name:* Low (no clear historical holder; constructed).  

  8. **Rationalist Conceptualism** (Reflection, Shared, Classification)  
     - *Most awkward commitment:* Concepts for shapes are innate and knowable by reflection alone.  
     - *Variants:*  
       - (1) Delayed test: **Yes** (concepts apply immediately).  
       - (2) Unnameable solid: **No** (no concept to classify).  
       - (3) Picture variant: **Yes** (concept bridges media).  
     - *Confidence in historical name:* High (Leibniz).  

  9. **Rationalist Demonstrativism** (Reflection, Proprietary, Demonstrative)  
     - *Most awkward commitment:* Reflection reveals demonstratives work without shared content—unmotivated.  
     - *Variants:*  
       - (1) Delayed test: **Yes** (a priori demonstrative capacity).  
       - (2) Unnameable solid: **Yes** (non-conceptual reference).  
       - (3) Picture variant: **No** (demonstratives target objects, not images).  
     - *Confidence in historical name:* Low (no clear holder; speculative).  

  10. **Rationalist Skepticism** (Reflection, Proprietary, No Reference)  
      - *Most awkward commitment:* Reflection proves senses isolated, making cross-modal success impossible—counterintuitive.  
      - *Variants:*  
        - (1) Delayed test: **No** (no mechanism for matching).  
        - (2) Unnameable solid: **No** (no shared basis).  
        - (3) Picture variant: **No** (no cross-modal link).  
      - *Confidence in historical name:* Medium (inspired by Molyneux’s own doubts).  

