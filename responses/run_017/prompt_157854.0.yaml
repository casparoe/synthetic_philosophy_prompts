  ### **Sunberry Heritability Activity: Design and Implementation**  
  **Framing (1 minute):**  
  "Today, you're Sunberry farmers. Each envelope holds a unique Sunberry seed’s 'family card'—a value you can’t see. You’ll grow plants, predict yields, and compete to breed the best crop. We’ll compute the 'family card share'—how much differences in yield come from these cards versus conditions. Top team wins apples!"  

  **Materials Per Table (3 students):**  
  - 6 sealed envelopes (genotypes)  
  - 1 die (for environmental effects)  
  - 3 index cards (environment labels)  
  - 3 printed rulers (for measuring "plant height" in cm)  
  - Sticky notes & markers (for predictions/results)  
  - Scoring sheet (records points, predictions, yields)  

  **Shared Wall Space:**  
  - **Leaderboard:** Tracks team points (starting: 10/team).  
  - **Data Wall:** Sticky notes for group averages, predictions, family card shares.  
  - **Round Trackers:** Labels for each round (1–4).  

  ---  
  ### **Round 1: High Within-Group Family Card Share, But Between-Group Gap Is Environmental**  
  **Objective:** Mislead students into attributing group differences to family cards (genetics), then reveal the gap is environmental.  
  **Setup:**  
  - **Group A (3 tables):** Each table has 3 envelopes with family cards **{1, 3, 5}**.  
  - **Group B (3 tables):** Each table has 3 envelopes with family cards **{1, 3, 5}** (same as Group A).  
  - **Environment:** Group A gets **“Drought”** (all plants: -2 height). Group B gets **“Rain”** (all plants: +2 height).  
  - *Facilitator preps envelopes; students don’t see cards yet.*  

  **Activity (10 min):**  
  1. **Predict & Record:** Teams predict Group B’s average height vs. Group A (e.g., “B > A by 4 cm”). Teams wager **1 point** on why: "Family cards" or "Environment."  
  2. **Generate Data:**  
     - Each table measures "height": **Family card (unknown) + Environment** (e.g., Group A: 1-2= -1cm, 3-2=1cm, 5-2=3cm; avg= **1cm**).  
     - Group B averages: 1+2=3cm, 3+2=5cm, 5+2=7cm; avg= **5cm**.  
  3. **Reveal & Confusion:** Facilitator opens envelopes—same cards in both groups! Between-group gap (4cm) is environmental, but within-group differences (e.g., -1 to 3cm in A) are 100% family cards.  
  **Confusion:** *"If within-group differences are genetic, why isn’t the group gap genetic too?"*  

  ---  
  ### **Round 2: Environmental Range Affects Family Card Share**  
  **Objective:** Show family card share shrinks when environmental diversity increases.  
  **Setup:**  
  - All teams merge into one group. Each table receives envelopes with **{2, 5, 8}** (wider genetic range than Round 1).  
  - **Environment:** Two conditions (each team does both):  
    - **"Uniform Rain":** All plants get **+0** (no die roll).  
    - **"Variable Rain":** Roll die per plant: **1–2: -3, 3–4: 0, 5–6: +3**.  

  **Activity (10 min):**  
  1. **Generate Data:**  
     - *Uniform Rain:* Height = Family card + 0. Record heights (e.g., 2,5,8).  
     - *Variable Rain:* Roll die, add to family card (e.g., 2-3= -1, 5+0=5, 8+3=11).  
  2. **Compute Family Card Share:**  
     - **Formula:** *Family card range (max-min) / Total height range (max-min)*.  
     - *Uniform:* Card range=6 (8-2), height range=6 → Share= **100%**.  
     - *Variable:* Card range=6, height range=12 (e.g., -1 to 11) → Share= **50%**.  
  3. **Record & Confusion:** Teams add shares to Data Wall.  
  **Confusion:** *"Why did the family card share drop if the cards didn’t change?"*  

  ---  
  ### **Round 3: The Individual Plant Problem**  
  **Objective:** Highlight that family card share doesn’t apply to individuals.  
  **Setup:**  
  - Use data from Round 2 (Variable Rain).  
  - Each team picks one plant (e.g., family card=5, environment=+3, height=8cm).  

  **Activity (10 min):**  
  1. **Predict:** Teams wager **1 point** on: *"What % of this plant’s height is from its family card?"* Options: 50% (group share), 63% (5/8), or "Can’t say."  
  2. **Reveal & Debate:**  
     - Show the plant’s card and environment (e.g., 5 + 3).  
     - Ask: "If environment was -3, height=2cm. Is the family card now 250% (5/2)? Why not?"  
  3. **Conclusion:** Facilitator emphasizes: *"The share is about group variation—not individuals."*  
  **Confusion:** *"Why can’t I use the group’s 50% for this specific plant?"*  

  ---  
  ### **Round 4: Uniform Environmental Change & Crossing Interaction**  
  **Objective:** Challenge belief that high family card share implies fixity. Includes crossing interaction and social environment.  
  **Setup:**  
  - **Part A: Uniform Change (5 min):**  
    - Use Round 2’s Uniform Rain data (heights=2,5,8; family card share=100%).  
    - Apply **"+4 Fertilizer"** to all plants. New heights=6,9,12.  
    - Teams predict: *"Will the family card share change?"* Most say no (it stays 100%).  
    - **Point:** Share is unchanged, but yields shifted—environment matters!  

  - **Part B: Crossing Interaction & Social Environment (15 min):**  
    - **Genotypes:** Each team gets 2 envelopes: **"Hardy" (H)** and **"Brittle" (B)**.  
    - **Environments:**  
      - **"Dry"** (all plants: -2).  
      - **"Wet"** (all plants: +2).  
      - **"Dense Planting"** (social environment): Tallest plant in each table suppresses others: **+3 (tallest), -3 (shortest), 0 (middle)**.  
    - **Rules:**  
      1. **Grow:** Teams grow H and B in Dry (e.g., H: 5-2=3cm; B: 8-2=6cm → Brittle wins).  
      2. **Breed:** Teams select the "best" plant (Brittle) for breeding, spending **1 "seed token"** (limited resource).  
      3. **Shift:** Environment changes to Wet. Teams grow their selected plant (Brittle in Wet: 8+2=10cm).  
      4. **Social Effect:** Replant all in Dense. Measure heights with suppression (e.g., H=5+3=8cm; B=8-3=5cm → Hardy wins).  
    - **Scoring:**  
      - Profit = Height of bred plant in Wet (e.g., 10cm = 10 points).  
      - **But:** If they chose Hardy (loses in Dry, wins in Wet/Dense), profit=12cm! Teams lose points by selecting based on past performance.  

  **Confusion:**  
  - *Crossing Interaction:* "Why did Brittle win in Dry but lose in Wet/Dense?"  
  - *Social Environment:* "Why did the family card share rise in Dense Planting?" (Answer: Suppression amplifies genetic differences).  

  ---  
  ### **Roles, Incentives & Scoring**  
  - **Roles per Team (3 students):**  
    - **Farmer:** Rolls die, applies environments.  
    - **Breeder:** Decides resource allocation (e.g., "give all equal fertilizer" vs. "boost strugglers").  
    - **Trader:** Wagers points on predictions.  
  - **Point System:**  
    - Start: 10 points.  
    - Wagering: Correct prediction = +2; wrong = -1.  
    - Breeding profit: Height in cm = points added.  
    - **Leaderboard updated after each round.**  
  - **Resource Choice (Key Incentive):**  
    - In Round 4, teams get **3 "fertilizer tokens"**—must choose:  
      - *Equal:* Give +1 to all plants (safe, low gain).  
      - *Targeted:* Give +3 to the shortest plant (risky, high gain if it closes gaps).  
    - Loss if targeted plant has low genetic potential.  

  ---  
  ### **Debrief (20 min)**  
  **Map Activity to Concepts:**  
  1. **Round 1:** High within-group family card share ≠ between-group cause (e.g., group gap was environmental).  
  2. **Round 2:** Family card share is a proportion of *variation*—not fixed. Changes when environmental diversity changes.  
  3. **Round 3:** Share describes groups; *not* applicable to individuals (e.g., "63% of this plant" is nonsense).  
  4. **Round 4:**  
     - High share ≠ fixity (uniform change shifted all yields).  
     - Crossing: No "best" genotype—performance is environment-dependent.  
     - Social environment: High share can signal modifiable conditions (e.g., suppression in dense planting).  

  **What Students Can Now Explain:**  
  - "Heritability (family card share) measures how much genes explain variation *within* a group, not between groups."  
  - "It changes if environments become more/less diverse, even if genes don’t change."  
  - "It doesn’t apply to individuals or predict effects of new interventions."  

  **Limitations & Real-World Context:**  
  - "Unlike Sunberries, we can’t randomize human genes or open envelopes. Heritability is *estimated* from family/twin studies with assumptions (e.g., equal environments)."  
  - "Real traits involve gene-environment correlations (e.g., genetic traits shape your environment), which our activity avoided."  

  ---  
  ### **Predictable Problems & Solutions**  
  1. **Arithmetic Stalling:**  
     - *Problem:* Teams struggle with ranges/percentages.  
     - *Solution:* Pre-calculate examples; use "min/max" sticky notes for quick wall updates. Facilitator scripts: *"Just give me your min and max heights—I’ll handle the math!"*  

  2. **Overeager Student Names Heritability:**  
     - *Problem:* A student says, "This is heritability!" in Round 1.  
     - *Solution:* *"Great insight! But let’s keep calling it ‘family card share’ for now—we’ll unpack the real term later."*  

  3. **Envelope Misinterpreted as Molecular:**  
     - *Problem:* "Is the card like DNA?"  
     - *Solution:* *"Think of it as a family legacy—like heirloom seeds. Real genes are more complex, but this stands in for genetic potential."*  

  4. **Risk-Averse Team Won’t Wager:**  
     - *Problem:* Team refuses to bet points.  
     - *Solution:* Assign default: *"No wagering? You get +0 this round. But remember—farmers take risks!"*  

  5. **Human Group Differences Raised Mid-Activity:**  
     - *Problem:* Student asks, "Is this like race and IQ?"  
     - *Solution:* Shut down firmly: *"Sunberries are a model organism. We’ll discuss human applications only in the debrief—stay focused on farming for now."*  

  **First-Run Advice:**  
  - **Timing:** Use a visible timer. Cut Round 4 short if needed—focus on the crossing interaction.  
  - **Confusion Management:** Name each round’s confusion explicitly (e.g., "In Round 1, you thought... but then...").  
  - **Apples:** Award prizes early for engagement—e.g., "Best Prediction" after Round 1.  

  This design fosters experiential learning while embedding key misconceptions into the activity. Students leave grasping why heritability is group-relative, dynamic, and misapplied to individuals/gaps—and why high heritability can signal opportunity, not fixity.
