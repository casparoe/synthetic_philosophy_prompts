     - Rich environment: +2 for every plant.
  3. We do two passes: 
     - First, in poor environment: 
          - Type A: height = 8
          - Type B: height = 6
     - Second, in rich environment:
          - Type A: 12
          - Type B: 14
  4. Now, we have a breeding team: They are given the task to select the best plants for breeding in the current environment (poor). They see that type A is better (8 vs 6). They select type A and discard type B. 
  5. Then the environment changes to rich (e.g., due to climate change or better fertilizer). 
  6. They grow the offspring of type A in the rich environment: height=12. 
     - But if they had kept type B, in rich environment it would be 14. So they lost out.

  *How to integrate:*
  - We can make this a separate round or part of Round 4.

  *Logistics:*
  - Each table has 2 type A plants and 2 type B plants (but they don't know the type). The sealed card says either 'A' or 'B'. 
  - In the first environment (poor), the facilitator tells the environmental effect (-2). Then the height is computed by the facilitator (or by a rule) and written on the envelope. 
  - The breeding team (one per table or one team for the whole class) selects which plants to breed (the ones with highest height in poor environment). They will select the two type A plants (because 8>6). 
  - Then the environment changes to rich. They grow the offspring (which are assumed to be the same as the parent, so type A). In rich environment, type A = 12. 
  - Meanwhile, if they had selected type B, they would have gotten 14. 
  - They lose points because they are scored on the height of their selected plants in the new environment: they get 12, but the maximum possible is 14, so they lose the difference in points? 

  *Scoring:*
  - Each table is a breeding company. They start with 10 points. 
  - In environment 1 (poor), they measure their plants and select two plants to breed. 
  - Then environment changes to rich. 
  - They grow the offspring of their selected plants and record the height. 
  - The height of the offspring in rich environment: if they selected type A, the offspring in rich=12. If they selected type B, offspring=14. 
  - Points earned = height of offspring (so 12 or 14). But then they want to select type B in environment 1, but in environment 1 type B did worse. 

  *But they select based on environment 1, where type A did better. So they will select type A and get 12. The maximum possible is 14, so they lost 2 points. 

  *Confusion:* The best genotype depends on the environment.

  **Environmental Arrangement Affecting Heritability (Second Key Ingredient):**

  *Objective:* Show that the sealed-card share can be high because of the environmental arrangement, and changing the arrangement can reduce it.

  *Setup:*
  - We have plants that compete for light. If planted densely, then tall plants (which have a genetic advantage) will suppress the growth of short plants, amplifying the genetic differences. 
  - In sparse planting, there is no suppression, so the environmental effect is random and not related to genetics, and the sealed-card share is lower.

  *How to simulate:*
  - We have sealed-card values representing potential height in sparse conditions. 
  - In dense planting, the actual height is: if a plant has a sealed-card value greater than its neighbors, it grows to its full potential; if not, it is stunted.

  *But we need a simple rule.*

  *Example:*
  - Sparse environment: height = sealed-card value + environmental noise (small).
  - Dense environment: height = sealed-card value * (1 + some advantage) but only for the tallest ones? 

  *Alternatively, we can have a rule:*
  - In dense planting, the tallest plant in each group of three gets an extra +3, the middle +0, the shortest -3. 

  *Activity:*
  1. Each table has three plants with sealed-card values: 3,4,5 (say). 
  2. Sparse environment: 
     - Environmental effect: roll die for narrow environment (-1,0,+1). 
     - Height = sealed card + environment.
  3. Dense environment: 
     - They do not roll for environment. Instead, within each table, they rank the plants by sealed-card value. 
     - Then: tallest gets +3, middle +0, shortest -3.
     - Height = sealed card + adjustment.
  4. Then we compute the sealed-card share using the range method: 
     - In sparse: range of sealed cards=2 (3 to 5), range of heights might be 2 (if environment noise small) or more. 
     - In dense: the adjustments amplify the differences: heights might be 5+3=8, 4+0=4, 3-3=0. So range=8. Sealed-card share = 2/8=25%? But we want it to be higher in dense? 

  *In dense, the range of heights is larger, so the sealed-card share by our range measure might be lower because the numerator (sealed range) is fixed and the denominator is larger. But we want the sealed-card share to be higher in dense because the genetic differences are amplified. 

  *Heritability is the proportion of variance due to genetics. In dense, the variance might be higher and the genetic variance is also higher? 

  *In our simulation:*
  - In sparse: 
     - Sealed cards: 3,4,5. 
     - Environmental noise: say 0 for all for simplicity.
     - Heights: 3,4,5. Variance = ((3-4)^2+(4-4)^2+(5-4)^2)/3 = (1+0+1)/3=2/3.
     - Genetic variance = variance of sealed cards = 2/3.
     - So sealed-card share = 100%.
  - In dense (with our adjustment):
     - Heights: 3-3=0, 4+0=4, 5+3=8.
     - Mean = (0+4+8)/3=4.
     - Variance = ((0-4)^2 + (4-4)^2 + (8-4)^2)/3 = (16+0+16)/3=32/3.
     - Genetic variance: but we have changed the expression. The genetic variance is still the variance of the sealed cards? But the heights are not a linear function. 

  *Alternatively, we can compute the sealed-card share by the correlation between sealed card and height. In sparse, it's 1. In dense, it's also 1 because the ranking is preserved. 

  *But we want to show that the sealed-card share is higher in dense because the environmental arrangement (density) has made the genetic differences matter more. 

  *In reality, in dense planting, heritability for height might increase because the environmental noise is reduced (everyone gets the same treatment except for competition) and the competition is mediated by genetics. 

  *How about:*
  - In sparse: height = sealed card + environmental noise (with variance 1).
  - In dense: height = sealed card + environmental noise (variance 1) + 0.5 * (sealed card - mean_sealed)   [amplifying the genetic effect].

  *But complex. 

  *Simpler:*
  - We compute the difference between the tallest and shortest in sealed card and in height. 
     - In sparse: sealed card difference=2, height difference=2 (if no noise) or more with noise. 
     - In dense: sealed card difference=2, but height difference=8 (from 0 to 8), so the height difference is mainly due to sealed cards? 

  *Then sealed-card share in sparse = 2 / height_range_sparse.
  *In dense = 2 / height_range_dense. 

  *But in sparse, height_range might be 2.5 (due to noise) so share=2/2.5=80%. 
  *In dense, height_range=8, share=2/8=25%. 

  *This is lower, but we want higher. 

  *We can reverse the adjustment: in dense, instead of penalizing the short, we only penalize the short and boost the tall? It's already boosting the tall and penalizing the short.

  *Alternatively, we can define the sealed-card share as the genetic range over the height range, and in dense the genetic effect is amplified so the sealed-card share should be higher? But by our formula, it's lower. 

  *We need a different measure. 

  *Perhaps we should compute the sealed-card share as the proportion of the height difference that is due to sealed card for a pair. 
  - In sparse: for two plants with sealed card 3 and 5, the height difference is 2 (if no noise), so 2/2=100%.
  - In dense: for the same pair, heights become 0 and 8, difference=8. How much of that is due to sealed card? The sealed card difference is 2, but the environmental effect (due to density) is 6. So sealed-card share = 2/8=25%. 

  *This shows that in dense, the environment (now including the social environment) plays a bigger role? 

  *But we want to show that the sealed-card share is higher in dense because the environment is now more controlled and the genetic differences are more evident. 

  *This is not matching. 

  *Let's change the story:*
  - In sparse, there is a lot of random environmental variation (e.g., soil quality varying randomly). In dense, the environmental variation is controlled (everyone gets the same soil), but the competition effect is added. However, the competition effect is fully determined by sealed cards (because the adjustment is based on sealed cards). 

  *Then in sparse: 
     - Height = sealed card + environment (random, variance high).
     - So sealed-card share (by variance) would be low.
  - In dense: 
     - Height = sealed card + function(sealed card within group) [which is deterministic given the sealed cards].
     - So sealed-card share = 100% because the environment is fixed and the competition effect is entirely due to sealed cards.

  *This would work. 

  *Setup:*
  - In sparse: environment effect is from a wide die roll (say -3 to +3). 
  - In dense: environment effect is 0 for everyone, but then they get an adjustment based on ranking within the table: tallest +3, middle 0, shortest -3. 

  *Then sealed-card share in sparse would be low (because environment varies widely), in dense would be high (because environment is uniform and the adjustment is based on sealed cards). 

  *Activity:*
  1. Each table has sealed-card values: 3,4,5 (same for all tables).
  2. Sparse environment: 
     - Each plant rolls the die for environment (wide: -3,-2,-1,1,2,3). 
     - Height = sealed card + environment.
     - Facilitator computes sealed-card share by range: sealed range=2, height range= max_height - min_height (might be around 2+6=8), so share=2/8=25%.
  3. Dense environment: 
     - Environment effect=0 for all.
     - Then within the table, they rank the plants by sealed-card value and assign: tallest +3, middle 0, shortest -3.
     - Height = sealed card + adjustment.
     - For a table: heights become 3-3=0, 4+0=4, 5+3=8.
     - Height range in the whole class: min could be 0, max=8, range=8.
     - Sealed range=2.
     - Sealed-card share=2/8=25%? But that's the same as sparse. 

  *However, within one table, the sealed-card share is 100% because the adjustment is based on sealed cards. But for the whole group, because every table has the same sealed cards, the sealed-card values are not varying across the whole group? 

  *We need to have different sealed-card values across tables. 

  *Revised:*
  - Give each table different sealed-card values. For example, table1: 2,3,4; table2: 5,6,7; table3: 8,9,10; etc. 
  - Then in sparse environment: 
     - Environmental effect wide die roll.
     - Height = sealed card + environment.
     - Facilitator finds sealed-card range: min sealed=2, max=10, range=8.
     - Height range: might be 2-3= -1 to 10+3=13, range=14.
     - Share=8/14=57%.
  - In dense environment: 
     - Environment=0 for all.
     - Within each table, adjust based on ranking: tallest +3, middle 0, shortest -3.
     - For table1: sealed 2,3,4 -> heights: 2-3=-1, 3+0=3, 4+3=7. 
     - For table2: 5-3=2,6+0=6,7+3=10.
     - For table3: 8-3=5,9+0=9,10+3=13.
     - Now, the overall height range: from -1 to 13, range=14.
     - The sealed-card range is still 8 (from 2 to 10).
     - Share=8/14=57% again.

  *This is not different. 

  *We must compute the variance or the sealed-card share within groups (within tables) for dense, and across the whole group for sparse? 

  *For dense, within each table, the environment is the same (0) and the adjustment is based on sealed cards, so within the table, the sealed-card share is 100%. 
  - For sparse, within a table, the environmental effects are random, so within-table sealed-card share is not 100%. 

  *But we want an overall sealed-card share. 

  *This is getting too complex. 

  * We might need to skip the range measure and have the facilitator compute the correlation between sealed card and height. 

  * In sparse: the correlation will be lower because of environmental noise. 
  * In dense: the correlation will be higher because the adjustment is based on sealed cards and the environment is controlled. 

  * For example, in sparse, if environment is random, correlation might be 0.5. In dense, correlation=1. 

  * But we haven't taught correlation. 

  * Given time constraints, we might have to forgo this ingredient or save it for the debrief as a verbal point. 

  * Alternatively, we can do a qualitative round: 
     - In sparse: sealed-card values and heights are not very related (show by having a table with a low sealed-card plant having high height because of environment). 
     - In dense: the sealed-card values perfectly predict the within-table ranking, and the height differences are amplified. 
     - Then we say: "In sparse, knowing the sealed card doesn't tell you much about the height. In dense, it does. So the sealed-card share is higher in dense." 

  * And for the sealed-card share number, we can say: "In sparse, the sealed-card share was 50% ( facilitator says based on variance), in dense, it was 90%."

  * But we haven't computed it in front of them. 

  * Given the time and complexity, we might have to simplify. 

  **Final Activity Structure for 90 Minutes:**

  Given the complexity of the requested ingredients and the time, we will focus on the core rounds and incorporate the crossing interaction in Round 4 and the environmental arrangement in a bonus round if time permits.

  **Round 1 (15 minutes): High within-group sealed-card share, between-group difference environmental.**
  - As designed above.

  **Round 2 (15 minutes): Changing environmental range.**
  - Use the range method for simplicity.

  **Round 3 (10 minutes): Individual plant.**
  - As above.

  **Round 4 (20 minutes): Uniform environmental change and crossing interaction.**
  - Part A: Uniform change. Show that adding a constant environmental shift changes the mean.
  - Part B: Crossing interaction. Have the breeding game.

  **Environmental Arrangement Round (if time, 15 minutes):**
  - Qualitative discussion with two tables doing sparse and two doing dense (within-table sealed-card share).

  **Debrief (20 minutes):**

  **Logistics:**
  - A printed scoring sheet for each table to record points and results.
  - The wall has sticky notes for group averages, sealed-card share values, and wagers.
  - The leaderboard is updated after each round.

  ** materials lists with numbers **

  **Round 1:**
  - For Group A (3 tables): each table has 3,4,5 inside envelopes.
  - For Group B (3 tables): each table has 3,4,5 inside envelopes.
  - Environmental effect: Group A: 0; Group B: +5.
  - Heights Group A: 3,4,5 -> avg=4.
  - Heights Group B: 8,9,10 -> avg=9.
  - After reveal, they see sealed cards are the same.

  **Round 2:**
  - All tables: each has 1,5,9.
  - Narrow environment die roll rules: 
     - 1,2 -> -1; 3,4->0; 5,6->+1.
  - Wide environment die roll rules: 
     - 1->-3, 2->-2, 3->-1, 4->+1, 5->+2, 6->+3.
  - In narrow, sealed range=8. Height range: typically between 1-1=0 to 9+1=10 -> range=10, share=8/10=80%.
  - In wide, height range might be 1-3=-2 to 9+3=12 -> range=14, share=8/14=57%.

  **Round 3:**
  - Use a plant from Round 2 narrow: say sealed=5, environment=0, height=5.
  - Ask: How much of the 5 is due to the sealed card? 

  **Round 4:**
  - Uniform change: take Round 2 narrow data. Add +2 to environment. Heights become 3,7,11. Average=7. 
  - Crossing interaction: 
     - Each table has 2 type A and 2 type B.
     - Sealed card: A or B.
     - Environment 1 (poor): for type A, height=8; type B, height=6.
     - Environment 2 (rich): type A=12, type B=14.
     - Breeding: select two plants with highest height in poor -> type A.
     - In rich, their offspring yield 12. If they had selected type B, they would have 14. 
     - Points = height in rich, so they get 12 points.

  **Environmental arrangement: if time**
  - Sparse: wide environmental roll.
  - Dense: within-table ranking and adjustment: tallest +3, shortest -3, middle 0.
  - In sparse, within a table the correlation between sealed card and height is not perfect.
  - In dense, within a table it is perfect and differences are amplified.

  ** handling of human differences **
  - If a participant raises human group differences: "That's an important issue, but for today we are focusing on fictional Sunberries to understand the concepts. We'll have time at the end to discuss how these concepts do or do not transfer."

  ** What will go wrong **
  - Arithmetic stalling: Have pre-calculated examples ready. For range, have a volunteer from each table report min and max, facilitator computes.
  - Student who knows the topic: "Great! But let's let everyone discover it through the activity. We'll use our own terms for now."
  - Student who mistakes envelope for molecular entity: "In our model, the sealed card represents the genetic potential, but in real life it's more complex."
  - Group that refuses to wager: Let them pass, or assign a default wager of 0 points.

  This is a complex activity and may run over time. Have a timekeeper and be ready to cut parts.
