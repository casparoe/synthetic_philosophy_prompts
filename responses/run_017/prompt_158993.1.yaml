  ### Game Design: "The Message Menu"

  **Game Name:** The Message Menu  
  **Concept:** Players act as "couriers" in a high-stakes scenario where they must convey specific information to a partner using pre-written message cards. The goal is to get the partner to correctly identify a "target" based on the chosen message. The twist is that the message set is carefully designed so that the choice of message, not just its literal content, carries critical information. The game fosters the insight that communication relies on inferences from the speaker's choice among alternatives, while creating natural failure cases for unintended inferences and backfiring denials.

  **Channel Restriction:** Players cannot freely describe the target. They must select one message from a limited set of pre-written index cards.  
  **Message Menu (Card Sets):** Each round uses a unique theme and card set. Cards are phrased neutrally to avoid jargon and classic examples. Themes are based on everyday scenarios to feel intuitive.  
  **Pair Formation:** 16 players form 8 pairs per round. Partners rotate each round to prevent private codes:  
  - Use a "rotating trios" system for smooth transitions (no drawing names). Players sit in a circle. In Round 1, pair with the person to your right. In Round 2, pair with the person two seats to your right. Round 3, three seats, etc. (modulo 16). This ensures fresh partners each round and takes <30 seconds to reorganize.  
  **Roles:** Each pair has a "Sender" and a "Receiver." Roles alternate per round (e.g., if you were Sender in Round 1, be Receiver in Round 2).  
  **Payoff Scheme:** Cooperative scoring—no real money. Pairs earn points based on Receiver accuracy:  
  - Correct guess: 3 points  
  - Incorrect guess: 0 points  
  Group goal: Achieve a total of 50+ points across all pairs by the end. Track points on the whiteboard. This encourages teamwork and discussion during debriefs.  
  **Number of Rounds:** 4 rounds (each ~12 minutes), plus intro (5 min), transitions (2 min/round), and debrief (25 min). Total: 90 minutes.  
  **Materials:**  
  - Whiteboard for scoring and clarifications.  
  - Index cards: One set of "target cards" (describing the target) and one set of "message cards" (the menu of utterances) per pair per round.  
  - Themes avoid philosophy/linguistics tropes: Use "travel destinations," "workshop tools," "local events," and "museum exhibits."

  ---

  ### Game Arc and Rounds
  **Intro (5 min):**  
  - Explain the setup: "You're couriers in a network. Each round, Sender sees a target and must describe it to Receiver using only one message card from a set. Receiver guesses the target. Work together to maximize group points. No lying—messages must be truthful."  
  - Emphasize: "Receiver, you see all possible message cards. Think about why Sender chose that card and not another."  
  - **Pre-empting issues:** Players might focus only on literal content. Pre-empt by saying: "Success depends on how the message is chosen, not just what it says. Pay attention to the whole menu."

  **Round 1: Travel Destinations (Simple Practice)**  
  - **Targets (4 cards):**  
    - A: Beach resort with crowded tours and cheap food.  
    - B: Beach resort with private tours and cheap food.  
    - C: Beach resort with crowded tours and gourmet food.  
    - D: Beach resort with private tours and gourmet food.  
  - **Message Cards (6 cards):**  
    1. "It’s a beach resort."  
    2. "Food is affordable." (True for A, B)  
    3. "Food is high-end." (True for C, D)  
    4. "Tours are group-based." (True for A, C)  
    5. "Tours are private." (True for B, D)  
    6. "A relaxing getaway." (True for all)  
  - **Goal:** Ease players in. Senders learn to avoid generic cards (e.g., card 6) to prevent ambiguity. Receivers learn to expect specificity.  
  - **Expected Insight:** Literal meaning alone is insufficient (e.g., card 1 applies to all; choosing it is unhelpful).  
  - **Failure Pre-emption:** Players might not infer from omissions. After the round, ask: "Did anyone pick card 6? What happened?" Highlight a case where Receiver misguessed due to lack of specificity.

  **Round 2: Workshop Tools (Unintended Inference)**  
  - **Targets (4 cards):**  
    - A: Heavy hammer, slightly damaged.  
    - B: Heavy hammer, like new.  
    - C: Light hammer, slightly damaged.  
    - D: Light hammer, like new.  
  - **Message Cards (6 cards):**  
    1. "It’s a hammer."  
    2. "It’s heavy." (True for A, B)  
    3. "It’s lightweight." (True for C, D)  
    4. "It’s in perfect condition." (True for B, D)  
    5. "It’s durable." (True for B, D—implies no damage)  
    6. "It gets the job done." (True for all)  
  - **Design for Failure Case 1 (Unintended Inference):** If Sender has A (damaged heavy hammer) and chooses card 2 ("It’s heavy") to avoid lying, Receiver might infer it’s undamaged (since card 4/5 weren’t chosen) and guess B. Sender never intended this, but Receiver’s inference is rational given the menu.  
  - **Expected Blame Ambiguity:** In debrief, players will debate if Sender should have risked card 6 or if Receiver overinterpreted.  
  - **Scoring Pressure:** Generic cards (e.g., 1 or 6) become "traps" that lower scores.

  **Round 3: Local Events (Denial Backfire)**  
  - **Targets (4 cards):**  
    - A: Concert: popular band, expensive tickets, no discounts.  
    - B: Concert: unknown band, expensive tickets, no discounts.  
    - C: Concert: popular band, cheap tickets, discounts available.  
    - D: Concert: unknown band, cheap tickets, discounts available.  
  - **Message Cards (6 cards):**  
    1. "It’s a music event."  
    2. "Tickets are costly." (True for A, B)  
    3. "Tickets are budget-friendly." (True for C, D)  
    4. "It features famous artists." (True for A, C)  
    5. "It features new artists." (True for B, D)  
    6. "It’s affordable, but I’m not saying it’s high-profile." (True for C, D—denies fame but affirms price)  
  - **Design for Failure Case 2 (Denial Backfire):** If Sender has D (unknown band, cheap tickets) and chooses card 6 to block inferences about obscurity, Receiver might infer it’s unpopular *and* overcompensating, leading them to misguess B (expensive unknown). The denial draws attention to the avoided trait, worsening the inference.  
  - **Expected Outcome:** Senders who use card 6 for D will cause misguesses. In debrief, players will note the denial "feels defensive."

  **Round 4: Museum Exhibits (Combined Complexity)**  
  - **Targets (4 cards):**  
    - A: Ancient vase: authentic, recently cleaned, no cracks.  
    - B: Ancient vase: authentic, dusty, no cracks.  
    - C: Ancient vase: replica, recently cleaned, no cracks.  
    - D: Ancient vase: replica, dusty, hairline crack.  
  - **Message Cards (6 cards):**  
    1. "It’s a vase."  
    2. "It’s an original artifact." (True for A, B)  
    3. "It’s a reproduction." (True for C, D)  
    4. "It’s pristine." (True for A, C—implies no damage/dust)  
    5. "It’s well-maintained." (True for A, C)  
    6. "It’s authentic, but I won’t comment on condition." (True for A, B—denies condition focus)  
  - **Goal:** Integrates both failure cases. Choosing card 6 for B (authentic but dusty) may imply poor condition, causing misguess (e.g., D). Choosing card 1 for C (replica) may imply it’s not original, leading to misguess.  
  - **Group Pressure:** High stakes for hitting 50+ points, fostering discussion on choice-driven inferences.

  ---

  ### Debrief (25 min)
  Map gameplay moments to distinctions without jargon. Use whiteboard to note:  
  1. **Round 1 Moment:** When a Sender chose "It’s a beach resort" (card 1) and Receiver misguessed.  
     - **Distinction:** "Literal meaning vs. inference from choice."  
     - **Ask:** "Why did the Receiver guess wrong? Because they didn’t just see the words—they wondered why the Sender didn’t pick a more specific card. The inference came from the *choice*, not the sentence."  
  2. **Round 2 Moment:** When Sender of the damaged hammer (A) said "It’s heavy" (card 2), and Receiver guessed B (undamaged).  
     - **Distinction:** "Unintended inference."  
     - **Ask:** "Did the Sender *mean* to imply it was undamaged? No! But the Receiver inferred it because specific options (e.g., 'durable') were skipped. This is communication breakdown from choice-based reasoning—and it’s unclear who 'caused' it."  
  3. **Round 3 Moment:** When Sender of the cheap unknown concert (D) used the denial card ("affordable, but not high-profile") and Receiver guessed B (expensive unknown).  
     - **Distinction:** "Failed denial."  
     - **Ask:** "Why did denying one thing make the Receiver focus on it? Because the choice to deny drew attention to what wasn’t said. Trying to block an inference can amplify it."  
  4. **Core Insight:** "Communication isn’t just decoding words—it’s reverse-engineering why the speaker chose *this* from the menu of possibilities. The menu shapes expectations."  
  - **Name Concepts Now:** Introduce "implicature" (inference from choice), "maxim" (norms like "be informative"), and "Grice" as labels for what they experienced. Avoid earlier jargon to preserve discovery.

  **Predictable Issues and Pre-emption:**  
  - **Issue 1:** Players focus only on literal content in early rounds.  
    - **Pre-emption:** In intro, stress: "Receivers, ask: Why this card? Why not others?" After Round 1, share an example where generic choices failed.  
  - **Issue 2:** Receivers struggle with inferences, lowering scores.  
    - **Pre-emption:** Normalize low scores early—say, "Round 2 is designed to be tricky!" Use whiteboard to show group progress, encouraging collaboration.  
  - **Issue 3:** Senders avoid denial cards in Round 3.  
    - **Pre-emption:** Include denial in multiple cards (e.g., Round 3 card 6). If unused, highlight in debrief: "Some of you avoided the denial card—why? Because it felt risky, which shows how choice drives meaning."

  **Missing Features (to State Aloud):**  
  1. **Recursive Intention:** The game can’t fully model that speakers intend hearers to *recognize* their intention. Here, Senders just want points; they don’t "intend the inference" recursively. State: "In real life, speakers choose words expecting hearers to spot their intent. The game fakes this with scoring—it’s why denials felt unnatural."  
  2. **Social/Contextual Nuance:** The game strips away social norms (e.g., politeness) that shape real inferences. State: "Outside the game, relationships and context affect what inferences feel 'allowed.'"  
  3. **Scalability:** Real communication involves limitless menus; the game uses small sets. State: "In practice, menus are open-ended, but the core inference process is the same."

  **Competitive Variation:** If interests diverged (e.g., Sender gets points for Receiver *overestimating* value, Receiver for accuracy):  
  - **New Inference Patterns:** Senders would omit negative details (e.g., in Round 2, avoid mentioning damage), leading to systematic overestimation. Receivers would learn to "discount" messages, inferring hidden flaws.  
  - **Cooperative Analogy:** It shifts examples but doesn’t break the analogy. Competitive play mimics adversarial contexts (e.g., sales pitches), where choice-based inferences still dominate, but without cooperative norms (e.g., "be helpful"). The core insight—meaning from choice—remains, but failure cases change (e.g., unintended inferences become intentional deception).  
  - **Why Avoid:** Cooperation keeps focus on unintentional effects. Competition adds complexity and risks overshadowing the core lesson with game-theory tangents.
