  For restatements:
  - No-miracles: "If our models generalize well across distributions, it's unlikely they're just memorizing - they must capture some real underlying structure."
  - Pessimistic meta-induction: "All past SOTA models were later superseded, so probably current ones don't reflect 'true' structure either."
  - Structural realism modest: "We should only trust persistent relational patterns, not specific representations."
  - Structural realism ambitious: "The relations are all that exist - 'features' are just positions in these patterns."
  - Too-cheap objection: "Saying 'some structure exists' is empty when many structures fit the data equally well."

  Residue analysis will be crucial:
  - Limiting cases: ML has distillation/containment (e.g., CNN as special case of ViT), but scientific limits (e.g., c→∞ for relativity→Newton) have physical meaning ML lacks
  - Modality: ML models capture statistical patterns, not laws. This is a major distortion if smuggled in
