prompt: |-
  I write about science and ideas for a newspaper, and over the past few years I have covered a run of institutional decisions in which the disagreement was not about the facts, nor about whose interests were at stake, but about which moral framework should govern the choice: a foundation redrawing its grant strategy, a research ethics committee, a university deciding whether to keep a donor-funded centre. In each case the participants, being reasonable people, tried to handle that disagreement by some aggregating procedure — give each framework its due weight, find the option that does best overall, settle on something everyone can live with. And in each case the procedure seemed to me to presuppose exactly what was in dispute. I would like to know whether this has been identified and named, because it keeps recurring and I have no word for it.

  Two features, as I see them. First, the menu of options is not neutral. The frameworks disagree not only about which option is best but about how the option space is carved up, about what counts as one option at all. The hedge — split the money, publish the redacted version, run the smaller trial — gets presented as the compromise both sides can accept, but on at least one of the frameworks it is not a smaller dose of the good thing; it is a forbidden thing. So the option that looks like the neutral middle is second-worst on every framework and ruled out flatly by one of them. Second, the weights are not neutral either. To aggregate you need each framework's verdict expressed on a common scale, and the frameworks measure different things — deaths averted, stringency of a duty, expected size of the future — with no exchange rate supplied by any of them. Any conversion you choose is itself a moral judgement that one of the frameworks would reject, and it can reverse the outcome: scale one way and the framework nobody much believes, the one that assigns enormous stakes to the matter at hand, dictates every decision; scale another way and it drops out entirely.

  An instance of each. A foundation I wrote about was split between a view on which it must direct its money to the worst-off people alive now and a view on which it must reduce risks to future generations. The first treats spending on the far future while children die of preventable causes as itself a violation rather than a missed benefit; the second treats any dollar that does not go to the future as a catastrophic waste. Splitting the portfolio, which is what they did, was called betrayal by one side and dilution by the other — it was nobody's second choice, which is what a compromise is supposed to be. Separately: a committee weighing whether to fund a line of work was told by one member that a large class of beings the others had never counted has interests that matter enormously. The committee gave that view perhaps five per cent. It then swamped the decision, not because anyone was persuaded of it, but because on the only scale on which the committee knew how to compare the options, that view's numbers were astronomical — and whether that result is a finding or an artefact of the scale seemed to depend on a choice nobody had noticed making.

  The wrinkle I care about most is that this repeats one level up. Some of the frameworks in play have views about how this very kind of disagreement should be handled: one says that in doubt you should do what the framework you find most plausible says, another says you should aggregate, a third says that aggregating across frameworks is a category error about what moral reasons are. So the choice of procedure is not external to the dispute; it is one more item the frameworks disagree about — and it is suspicious that the frameworks with an opinion on the matter tend to have a favourable one.

  I have been offered several labels and none seems right. Incommensurability and value pluralism seem to concern conflicts among values inside a single framework, not conflicts among frameworks about the inputs to a decision. Hedging and splitting the difference assume the menu and the scale are already given. The precautionary principle, appeals to the burden of proof, and worries about low probabilities with huge payoffs all concern how much weight to give a possibility, not whether the framing of the choice is itself contested. Aversion to unspecified probabilities concerns ordinary empirical uncertainty, where nobody thinks the correct response to doubt is itself up for moral argument.

  So my question is whether the phenomenon has an established name and a literature. If there is one, I want it placed: what exactly is the phenomenon at its core, what are its nearest neighbours in the way I have sketched, and precisely where does it stop — what would count as a case where the framing is genuinely neutral and aggregation is unproblematic? If there is no established concept, please say so plainly, coin a name, define it tightly, and give me boundary cases, including at least one case that looks like mine but is not. Finally, and most usefully for the piece I am writing: is there any procedure that is immune to it? I have the embryonic idea that the only defensible recommendations would be the ones that survive every admissible way of carving up the options and every admissible way of putting the frameworks on a common scale, and I would like to know whether that idea has been developed, whether it has a name, and how much of the decision space it typically leaves unsettled.
reasoning: |-
  Okay, the user writes about science and ideas for a newspaper and has observed a recurring problem in institutional decisions. The core issue is that disagreements aren't about facts or interests but about which moral framework should apply. They've noticed two key features: the options themselves aren't neutral because different frameworks define what counts as an option differently, and assigning weights to different frameworks involves a moral judgment that one or more frameworks would reject. 

  The user provides examples like a foundation split between helping current worst-off people versus reducing future risks, where splitting the portfolio satisfies neither. Another example involves a committee giving a minority view 5% weight, which then dominates the decision due to scaling issues. Importantly, this problem recurs at the meta-level—frameworks even disagree on how to handle such disagreements.

  They've considered terms like incommensurability and value pluralism but find them inadequate because those typically address conflicts within a single framework, not between frameworks. Terms like hedging or splitting the difference assume the options and scales are agreed upon, which they're not. The precautionary principle and similar concepts focus on weighting possibilities, not contested framings.

  The user wants to know if this phenomenon has a name and literature. If not, they'd like a newly coined term with a tight definition and boundary cases. They're also interested in procedures immune to this problem, like recommendations that hold under every admissible option-carving and scaling method.

  This is a sophisticated problem in moral philosophy and decision theory. I recall concepts like deep disagreements (Wittgenstein), framework disagreements (Chang on incomparability), and Arrow's impossibility theorem. But none perfectly fit. Ruth Chang's work on hard choices and parity might be relevant, but the user's case involves meta-disagreements too. 

  The scaling issue resembles the aggregation problem in social choice theory, where combining preferences requires interpersonal comparisons. The user's examples show how arbitrary scaling can distort outcomes. The meta-level issue—where frameworks disagree on dispute resolution methods—echoes problems in pluralist ethics and constitutional choice (Brennan).

  For naming, "meta-framework incommensurability" or "foundational framing disputes" could work. "Framework divergence dilemma" captures the core tension. Boundary cases might include: a genuinely neutral framing where all frameworks agree on options and scales (rare), or purely factual disagreements.

  For immune procedures: supervaluationism (endorsed by all frameworks) or maximin (least harmful option) might help, but they'll often leave decisions underdetermined. The user's embryonic idea resembles "robustness across frameworks," which has been explored in climate ethics (e.g., Gardiner) and AI alignment. However, it typically narrows options without always yielding a single answer. 

  The user's frustration with superficial compromises is spot-on. Their examples reveal how procedural "fairness" often smuggles in contested assumptions. The literature on moral uncertainty (MacAskill, Bykvist) tackles weighting frameworks but stumbles on scaling and option-definition. 

  I should emphasize that this is an unsolved problem. The supervaluationist approach they intuit is promising but incomplete—it's what philosophers call a "nonideal" solution. Their newspaper piece could highlight how institutions mistake procedural neutrality for actual neutrality, a subtle but vital point.
answer: |-
  This phenomenon you're describing is both profound and under-theorized, but it **does have a recognizable shape in philosophy and decision theory**. While no single term perfectly captures all its nuances, the most precise existing concept is likely **"Disagreement about the Choice Architecture"** or **"Meta-Framework Dispute"**. However, the core issue is best understood as **"The Problem of Meta-Neutrality"** or **"The Aggregation Dilemma under Divergent Framing"**.

  Here's a breakdown addressing your core questions:

  1.  **The Core Phenomenon & Its Name:**
      *   **Core:** The impossibility of aggregating judgments across fundamentally incompatible moral frameworks because:
          *   (a) The **definition of the option space** (what counts as a distinct choice, what constitutes a compromise) is itself contested by the frameworks.
          *   (b) There is **no neutral scale for weighting** or comparing the outputs (values, duties, consequences) prioritized by each framework.
          *   (c) The **choice of aggregation procedure itself** is contested by the frameworks, creating a regress problem.
      *   **Established Names/Literature:** There isn't one universally accepted term, but the phenomenon sits at the intersection of several well-developed areas:
          *   **Moral Pluralism & Incommensurability (e.g., Isaiah Berlin, Joseph Raz, Ruth Chang):** While often discussed within a framework, Chang's work on "hard choices" and "parity" directly addresses incomparability *between* values/concepts that lack a common scale. Your cases involve frameworks *defining* which values/concepts are relevant and *how* they relate, pushing incomparability to the meta-level.
          *   **Social Choice Theory & Arrow's Impossibility Theorem (Kenneth Arrow):** Highlights the difficulty of aggregating individual preferences into a social choice fairly and consistently. Your cases involve aggregating *frameworks* (not individuals) and the "preferences" are over the very structure of the choice and its valuation.
          *   **Deep Disagreement (e.g., Ludwig Wittgenstein, Robert Fogelin):** Concerns disagreements so fundamental they lack shared criteria for resolution. Your cases are specific instances within institutional decision-making where shared criteria (facts, interests) *exist* for the *substantive* issue, but the *meta-criteria* (framing, scaling, aggregation method) are missing.
          *   **Moral Uncertainty (e.g., William MacAskill, Krister Bykvist, Toby Ord):** Focuses on decision-making under uncertainty about *which* moral theory is correct. A significant challenge within this field is the "Problem of Inputs" or "Theory Selection Problem" – how to weigh theories that define goods/options differently and offer no common currency. Your scaling problem (astronomical numbers) is a classic illustration. Key debates involve "My Favorite Theory" vs. "Maximize Expected Choice-Worthiness" and their pitfalls.
          *   **Constitutionalism & Procedural Fairness (e.g., John Rawls, James Buchanan):** Addresses how to design fair procedures when substantive agreement is absent. Your observation that the procedure presupposes the dispute echoes Rawlsian concerns about the "veil of ignorance" needing prior agreement on its structure.
      *   **Best Coined Name:** Given the above, **"The Meta-Neutrality Dilemma"** or **"Divergent Framing Aggregation Failure"** captures the essence. It emphasizes that the attempt to find a neutral ground for aggregation *itself* lacks neutrality.

  2.  **Nearest Neighbours & Boundaries:**
      *   **Nearest Neighbours:**
          *   *Value Pluralism/Incommensurability:* Shares the lack of a common scale, but typically *within* a framework acknowledging multiple irreducible values. Your cases involve frameworks that may be monistic *internally* but deeply conflict *externally* on what values count and how options are defined.
          *   *Social Choice/Arrow:* Shares the aggregation impossibility under divergent preferences. Your cases involve preferences over the *structure* of choice itself, not just outcomes.
          *   *Moral Uncertainty:* Shares the core problem of weighing incompatible frameworks. Your cases highlight the specific pathologies of contested option-spaces and scaling.
          *   *Deep Disagreement:* Shares the intractability. Your cases are specific, institutional manifestations where other grounds for agreement (facts, interests) exist, highlighting the *unique* problem of framework divergence.
      *   **Where it Stops / Genuinely Neutral Aggregation:** Aggregation is unproblematic when:
          1.  **Shared Option Space:** All frameworks agree on what constitutes a distinct option and what a "compromise" entails within that space (e.g., splitting money proportionally *is* seen as a partial fulfillment by all, not a forbidden act).
          2.  **Shared Valuation Scale (or Commensurability):** Frameworks either prioritize the *same* fundamental good measured on a common scale (e.g., all care *only* about total lives saved, measured numerically) OR accept a common conversion rate between their distinct goods (e.g., all agree one unit of fairness is worth X units of efficiency).
          3.  **Shared Aggregation Procedure:** Frameworks agree on *how* to combine judgments (e.g., majority vote, maximize expected value, unanimity) *and* that procedure doesn't implicitly favor one framework's substantive view.
          *   **Boundary Case (Looks Similar But Isn't):** A dispute about **allocating scarce medical resources** where:
              *   *Frameworks:* Utilitarianism (maximize total QALYs) vs. Egalitarianism (prioritize the worst-off).
              *   *Agreed Options:* Treat Patient A (high QALY gain, not worst-off) vs. Treat Patient B (lower QALY gain, worst-off). "Split resources" isn't a viable medical option.
              *   *Agreed Scale?* Not inherently, BUT the committee might adopt a *procedural* rule: "Use a standardized QALY calculation weighted by an agreed-upon priority index for disadvantage." This imposes a scale, but it's an *external* procedural fix agreed upon *despite* the frameworks disagreeing on its moral basis. The *frameworks themselves* didn't contest the *definition* of the options (treat A or B) or the *possibility* of comparing QALYs and disadvantage on a scale (even if they dispute the *weighting*). The aggregation is "unproblematic" only because a specific, contestable scale was *imposed* by procedure. This highlights how rare true neutrality is – it's often procedural imposition masking substantive disagreement.

  3.  **Procedures Immune to the Dilemma:**
      Your embryonic idea aligns closely with the concept of **"Supervaluationism"** or seeking **"Robustness Across Frameworks."**
      *   **The Idea:** Identify options that are permissible (or optimal, or not-worst) under *every* admissible moral framework and every admissible way of defining the option space/scaling within those frameworks. Recommendations must survive this multi-perspective stress test.
      *   **Name & Development:** This approach is central to:
          *   **Robust Decision Making (RDM) & Info-Gap Decision Theory:** Used in engineering and policy under deep uncertainty. Focuses on finding strategies that perform "well enough" across a wide range of plausible futures/models. Applied to ethics, it means finding options acceptable across plausible frameworks.
          *   **Moral Uncertainty:** Theorists like MacAskill and Ord explore "minimax regret" or "maximin" approaches under moral uncertainty, seeking options that avoid the worst outcomes across plausible theories. Your idea extends this to include uncertainty over option-definition and scaling.
          *   **Satisficing & Second-Best Theory:** Finding "good enough" options that meet minimum thresholds across multiple criteria or perspectives, rather than seeking a single "best."
          *   **Consensus Theory (in logic/philosophy):** A proposition is "supertrue" if true under all admissible precisifications (interpretations). Similarly, an option is "superpermissible" if permissible under all admissible frameworks/scalings.
      *   **How Much Does it Leave Unsettled?** **A Lot.**
          *   **Narrows the Field:** It effectively rules out options that are:
              *   Forbidden by *any* framework (e.g., the "split" option forbidden by one foundation view).
              *   Ranked worst by *any* framework under *any* admissible scaling.
              *   Highly sensitive to arbitrary scaling choices (like the 5% view dominating).
          *   **Rarely Yields a Single Answer:** It typically identifies a *set* of robust options. Choosing *within* this set often requires reverting to one of the contested frameworks or a procedural rule (voting, authority), reintroducing the dilemma at a smaller scale.
          *   **Can Be Too Demanding:** In complex disputes, it might rule out *all* options, leading to paralysis. Its power lies in *avoiding bad compromises* and *highlighting irreconcilable conflicts*, not always providing a positive solution.
          *   **Requires Defining "Admissible":** Crucial but difficult. What counts as an admissible framework or scaling? This itself risks being contested, though arguably less so than the original choice.

  **In summary:**

  *   **Phenomenon:** Deep institutional disagreement where conflicting moral frameworks contest the very definition of the choice options, the scale for comparing their judgments, and the method for aggregating them, making standard compromise procedures question-begging.
  *   **Name:** While intersecting established fields (Moral Pluralism, Social Choice, Moral Uncertainty, Deep Disagreement), it lacks a universal label. **"The Meta-Neutrality Dilemma"** or **"Divergent Framing Aggregation Failure"** are apt descriptions. **"Framework Dissonance in Decision Architecture"** also works.
  *   **Immune Procedure:** **Supervaluationism / Robustness Across Frameworks** is the approach you intuit. It identifies options permissible or acceptable under every plausible interpretation of the frameworks and scaling, avoiding options that rely on contested framings or weights. Its strength is in eliminating indefensible choices; its weakness is that it often cannot identify a single best choice, leaving a narrowed set of robust options or revealing true impasse.

  This dilemma exposes the fragility of "procedural neutrality" when fundamental worldviews clash. Your observation that it recurs at the meta-level (frameworks disagreeing on how to resolve disagreement) is particularly astute and underscores the depth of the challenge. The robust/supervaluationist approach is likely the most intellectually defensible, but its practical utility lies more in preventing bad decisions than in magically producing good ones under irreconcilable conflict.
