prompt: |-
  I'm part of a reading group attached to a public-law course, and six of us have spent a term arguing about prostitution policy without getting anywhere. Two of the group defend what is usually called the Nordic or end-demand model — criminalize the purchase of sex, decriminalize its sale, keep third-party profiteering illegal — on the grounds that buying sex is a form of gendered domination, that demand is what sustains both the trade and the trafficking that feeds it, and that the criminal law has an expressive job to do alongside any deterrent one. Two others defend New Zealand-style decriminalization — remove the prostitution-specific offences and let sellers fall back on ordinary contract, employment, and workplace health-and-safety law, with no penalty on either side of a transaction — on the grounds that much of the measurable harm to sellers comes from criminalization itself, from policing, and from the bargaining power that managers and clients hold when sellers cannot organize, screen, or call on the state. The rest of us keep pointing out that the German and Dutch regulatory regimes are a third thing again, and that both camps invoke them selectively. What our sessions actually consist of is talking past each other: one side cites shrinking street markets, the other cites the conditions of migrant and street-based sellers, and neither side's evidence ever touches the other side's criterion of success.

  So I would like you to draft the document this group should have produced: an adversarial-collaboration summary between a Nordic-model advocate and a full-decriminalization advocate. Give me, first, a numbered section of claims both could sign — about what the law can and cannot do, about who is in the trade and why, about which parts of the current harm are caused by criminalization and which are not, and about what would count as a better or worse outcome for the people actually selling. Then give me a disagreements table: each residual disagreement stated twice, once in wording the Nordic-model advocate would accept for her own view and once in wording the decriminalization advocate would accept for his, with a column marking whether that disagreement is empirical, normative, or merely verbal. Then give me the cruxes — the sub-questions such that settling one would move at least one side — and, for each, the case or argument both would accept as bearing on it. If you conclude that some part of our dispute is about words rather than the world, say which part and why, and say plainly whether there is any evidence both sides would accept as settling a crux.

  Here is the case I want used as the shared test. A mid-sized European city is considering a package that: repeals soliciting and third-party offences; licenses small worker-run collectives of up to six sellers, from which no outside manager may take more than a fixed share of earnings; retains a criminal penalty on buying sex, but only from sellers who are not in a licensed collective; and funds a well-resourced support service that a seller may use whether or not she intends to leave the trade. For each crux, tell me what each side would predict about this scheme — about street-based sellers and about undocumented migrant sellers, about prices, about whether violence gets reported to the police, about the size of the market — and what mechanism each prediction rests on. I am not asking for citations or study names; both camps have thrown numbers at each other all term and I trust none of them, so give me the mechanism-level reasoning instead. Finally, add a short metanote that separates what is settled among people who actually work on this from what is genuinely contested, flagging any agreed claim you wrote that is really an unsettled empirical matter rather than a consensus, and marking any clause you suspect one of the two camps would refuse to sign.
reasoning: |-
  Hmm, the user is part of a public-law reading group that's been stuck debating prostitution policy models all term. They describe two main camps: Nordic model advocates (criminalize buyers) and New Zealand-style decriminalization advocates (full legalization). The group keeps talking past each other with selective evidence.

  They want me to create an adversarial-collaboration document with three parts: 
  1) Agreed claims both sides could sign about law's limits, demographics, harm sources, and success metrics 
  2) A disagreements table stating each conflict in both sides' preferred wording, categorized as empirical/normative/verbal 
  3) Cruxes where evidence could shift positions, applied to a specific hybrid policy proposal for a European city

  I need to be meticulously balanced here. For the agreements section, I'll focus on undisputed basics: criminalization causes some harms, sellers have diverse motivations, law expresses values but has limits, and success should prioritize seller well-being. I'll flag where these might be shaky consensus.

  For disagreements, I'll structure them as mirrored statements: 
  - Nordic view: "Buying sex is inherently exploitative" vs Decrim view: "Exploitation stems from policy choices" (normative) 
  - Nordic view: "Criminalizing buyers reduces demand" vs Decrim view: "Criminalization shifts markets underground" (empirical) 
  - Etc. I'll mark each as empirical/normative/verbal - noting where "exploitation" definitions might be verbal disputes.

  The cruxes need testable predictions about the hybrid proposal: 
  - For street sellers: Nordics predict decline but hardship; Decrim predict no real change 
  - For migrants: Nordics predict less trafficking; Decrim predict worse exploitation 
  - On violence reporting: Both might agree slight improvement but for different reasons

  Metanote will clarify: 
  - Consensus exists on criminalization harms and seller diversity 
  - Genuine disputes on demand elasticity and trafficking causality 
  - Normative rift on whether sex work can be non-exploitative 

  The hybrid proposal becomes a lens to expose core disagreements through mechanisms rather than cherry-picked stats. This structure forces both sides to engage each other's logic.
answer: |-
  Below is the adversarial-collaboration document your group requested, structured to force engagement with core disagreements while clarifying shared ground. It uses the proposed European city case study as a shared test to isolate mechanisms.

  ---

  ### **Adversarial-Collaboration Summary: Prostitution Policy**

  **Section 1: Agreed Claims**  
  *(Both advocates would sign these, with caveats noted in the metanote)*  

  1. **Law’s Capabilities & Limits**:  
     - Criminalization *of sellers* creates measurable harm: it impedes access to justice, healthcare, and labor rights; increases vulnerability to violence and exploitation; and forces transactions underground.  
     - Law alone cannot eliminate prostitution or "end demand," given complex socioeconomic drivers (poverty, inequality, migration, addiction).  
     - Law has *expressive power*: it signals societal values, which may empower or stigmatize sellers.  

  2. **Demographics & Motivations**:  
     - Sellers are not a monolith: motivations range from survival (e.g., homelessness, undocumented status) to pragmatic choice (e.g., flexibility, higher earnings).  
     - Street-based and migrant sellers face disproportionate harm due to visibility, isolation, and policing.  
     - Third-party involvement (pimps, managers) correlates with higher coercion but is not universal; some sellers work independently or cooperatively.  

  3. **Sources of Harm**:  
     - *Criminalization-driven harm*: Fear of arrest deters reporting of violence; exclusion from banking/contracts increases reliance on exploitative managers.  
     - *Non-criminalization harm*: Stigma, gendered violence, and economic precarity exist independently of legal frameworks.  
     - Policing practices (e.g., profiling, raids) often exacerbate trauma, regardless of formal policy.  

  4. **Success Criteria**:  
     - **Seller well-being** is the primary metric: reduced violence, improved access to healthcare/justice, economic agency, and ability to exit if desired.  
     - Secondary metrics: Market size shifts are neutral *unless* linked to changes in coercion or trafficking. Trafficking must be measured separately from voluntary migration.  

  ---

  ### **Section 2: Disagreements Table**  
  | Nordic Advocate’s Wording                             | Decriminalization Advocate’s Wording                  | Disagreement Type |  
  |-------------------------------------------------------|-------------------------------------------------------|-------------------|  
  | "Criminalizing buyers reduces demand and thus trafficking/exploitation." | "Criminalizing buyers increases dangers for sellers by forcing transactions underground." | Empirical         |  
  | "Buying sex is inherently exploitative due to gendered power imbalances." | "Exploitation arises from policy choices, not the act itself; consenting exchanges can be non-exploitative." | Normative         |  
  | "Third-party involvement is inherently predatory."    | "Third parties can be regulated to provide safety (e.g., security, admin)." | Normative/Empirical|  
  | "The law must express that sex is not a commodity."   | "The law must express that sellers deserve labor rights." | Normative         |  
  | "Street markets shrinking indicates reduced coercion."| "Street markets shrinking indicates displacement to riskier hidden venues." | Empirical         |  

  ---

  ### **Section 3: Cruxes & Predictions for the European City Case**  
  *Each crux is an empirical sub-question where evidence could shift one side’s view. Predictions are based on mechanism-level reasoning.*  

  1. **Crux: Does criminalizing buyers reduce overall demand?**  
     - **Nordic Prediction:** Buyer penalties reduce demand by deterring casual clients. Street markets shrink, lowering visibility of exploitation.  
       *Mechanism:* Stigma + legal risk deter "respectable" buyers; market contraction reduces trafficking incentives.  
     - **Decrim Prediction:** Demand remains stable; buyers shift to unlicensed/unregulated sellers (e.g., migrants, street-based).  
       *Mechanism:* Criminalization creates a "risk premium," raising prices for licensed sellers but diverting buyers to cheaper, hidden markets.  

  2. **Crux: Does licensing collectives improve seller safety?**  
     - **Nordic Prediction:** Violence reports *increase* for licensed sellers but *decrease overall* due to fewer transactions. Migrants/street sellers face greater isolation and violence.  
       *Mechanism:* Licensed sellers gain security (e.g., panic buttons) but migrant/unlicensed sellers absorb displaced demand under worse conditions.  
     - **Decrim Prediction:** Violence reports rise *for all sellers* as trust in police grows. Migrants benefit indirectly via reduced policing of sex work.  
       *Mechanism:* Decriminalizing sellers removes barriers to reporting; licensed collectives set safety standards that pressure unlicensed markets.  

  3. **Crux: Does criminalizing non-licensed buyers reduce trafficking?**  
     - **Nordic Prediction:** Trafficking decreases due to lower demand and targeted policing of unlicensed buyers.  
       *Mechanism:* Buyers avoid non-licensed sellers for fear of penalties, reducing profits for traffickers.  
     - **Decrim Prediction:** Trafficking *increases* as migrants/unlicensed sellers dominate the criminalized segment.  
       *Mechanism:* Traffickers exploit sellers who can’t access licenses (e.g., due to immigration status), offering "protection" from police.  

  4. **Crux: Can third parties be regulated non-exploitatively?**  
     - **Normative crux disguised as empirical disagreement**.  
     - **Shared Prediction:** Licensed collectives reduce third-party abuse by capping profit-taking.  
       *Mechanism:* Fixed earnings share limits manager incentives for coercion.  
     - **Disagreement:** Nordic view sees any profit-taking as exploitation; Decrim sees it as payment for services (security, advertising).  

  ---

  ### **Metanote: What’s Settled vs. Contested**  
  - **Settled Among Researchers**:  
    - Criminalizing sellers increases violence and stigma (global evidence).  
    - Migrants/street-based sellers are most vulnerable in *all* systems.  
    - Exit services must be non-coercive and coupled with housing/job support.  
  - **Agreed Claims That Are Shaky**:  
    - "Law alone cannot end demand" (Nordic camp may quietly believe expressive power can reduce it over time).  
    - "Stigma exists independently of law" (both camps overclaim their model’s impact on stigma).  
  - **Clauses One Camp Might Reject**:  
    - Nordic advocate may reject "consenting exchanges can be non-exploitative" (Sec 2) as legitimizing harm.  
    - Decrim advocate may reject "third-party involvement correlates with coercion" (Sec 1) as implying all managers are harmful.  
  - **Verbal Disputes**:  
    - **"Exploitation"**: Nordic defines it as inherent to the transaction; Decrim defines it as contingent on policy/power imbalances.  
    - **"Success"**: Nordic prioritizes reduced market size; Decrim prioritizes labor conditions. Evidence won’t resolve this.  
  - **Evidence That Could Settle Cruxes**:  
    - **Real-world test**: If the city’s hybrid model sees violence reports rise for migrants *without* falling for licensed sellers, it undermines both camps.  
    - **Shared empirical litmus**: If trafficked persons consistently report buyer penalties as harmful/irrelevant, Decrim gains ground; if they cite reduced buyer traffic, Nordic does.  

  ---  
  **Conclusion**: Your dispute combines entrenched normative rifts (sex as domination vs. labor) and testable empirical gaps (demand elasticity, reporting behaviors). The hybrid proposal’s value lies in exposing both: it creates a natural experiment on whether licensing can coexist with partial criminalization. For your group, focus on **seller testimony** about safety/agency under different models—this is the evidence both camps claim to prioritize but often reinterpret.
