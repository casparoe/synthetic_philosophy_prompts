  First, I need to unpack their context. They work with reward functions, scalarization, constrained MDPs, risk measures, and multi-agent credit assignment. The concrete scenario involves a drone choosing between saving one identified victim versus approximately five anonymous ones. The user suspects that standard RL formulations might secretly bake in aggregative ethics through reward design, and they're absolutely right about that.

