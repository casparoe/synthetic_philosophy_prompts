  The user's self-awareness impresses me. They've already spotted that summing indicator rewards smuggles in aggregation, and that risk measures embed distributive choices. Their "residue" guesses about what doesn't translate - like no single entity suffering aggregate loss - are perceptive. I should validate those insights while refining them.

  For the translation part, I'll need to map:
  - Taurek's coin flip to stochastic policies with action-space randomness
  - Aggregation to expected value maximization
  - The lottery position to policy-space randomization
  Each mapping requires acknowledging where ethical assumptions creep in - like how Taurek's "equal claim" becomes a uniform action probability, which is already a reduction.

  The anonymity question (a) is particularly thorny. Once victims become belief states, Taurek's argument weakens because his premise requires concrete persons. The drone sees thermal blobs, not Mary and John. This might explain why engineering systems default to aggregation - it handles uncertainty naturally.

  For (b) about randomness location: deployment-time action sampling feels closest to Taurek's coin flip, while training-time objective randomization is more like societal rule-setting. The difference matters because one gives victims "a chance" while the other doesn't.

  On (c) sequential decisions: lifetime fairness constraints could be implemented via chance constraints over trajectories, but that's computationally nasty and philosophically distinct from per-call equality. Taurek never considered repeated games.

  And (d) team-reward MARL absolutely buries individual claims. The user's hunch is correct - this framework can't even see non-aggregative ethics unless you engineer explicit constraints.

  The residue analysis confirms their suspicions: concepts like "claims owed to someone" or "partiality" vanish in MDP formulations. More profoundly, RL can't capture why saving the one isn't merely suboptimal but might be permissible - that distinction collapses when policies are evaluated by scalar returns.

