prompt: |-
  I'm on the market this year and my job paper is on evidential cooperation in large worlds — the view, roughly, that once you stop modelling a decision problem as a fully specified small world in which my act fixes the outcome, and instead let the agent be uncertain about which situation it's really in (uncertain about the world-model, not just about a state within it), then my own deliberation becomes genuine evidence about what the other agent does, and evidential decision theory starts cooperating in cases where everyone assumed it had to defect. My central case is one I made up, the two cartographers: Ada and Bob are mapping the same valley from opposite ridges, they never meet, they can't communicate, there's no predictor, no shared code, and no common cause either of them can observe, and the payoffs are deliberatly asymmetric — she gets 3 from a completed map and he gets 2, sending a survey party over the pass costs each of them 1 — so nothing about similarity or twinhood can do any work. The only thing linking them is that both are uncertain about the same unmodelled structure, i.e. about which of the candidate world-models is actual, where their own acts are among the things that vary across those models, and I argue that this shared uncertainty is enough to make the probability that the other one sends, conditional on my sending, exceed the probability conditional on my staying, and that this is a real correlation in the grand world rather than a superstition about similarity. I've got a flyout in two weeks and I honestly havent decided whether the argument survives contact with a room that isn't already sympathetic, so I'd really like a proper Q&A prep sheet.

  The room is: a senior game theorist who's basically a micro theorist with a philosophy appointment, thinks in Bayesian games and Harsanyi types and correlated equilibrium, and is going to hear my correlation as a correlation device — an assumption about the environment smuggled in as a norm of choice; two causal decision theorists of the interventionist Bayes-net stripe who will want the graph drawn on the board and will say that if there's a common node in it then their theory gets the same answer and my case is no argument for evidentialism at all; one formal epistemologist who likes evidential decision theory but is a ratificationist sceptic and worries about fixed points that don't exist or aren't unique; a historian of decision theory who will press me hard on whether large world is doing real Savagean work or is just a slogan I hide behind when the small-world approximation gets inconvenient; a junior person working on functional decision theory and program equilibrium who thinks what I'm describing is a special case of their view with worse branding; and one moral philosopher on the committee who will ask, very politely, why any of this is a question about rationality rather than about what kind of agent you'd want to build.

  Can you draft me the prep sheet? Give me the eight or so objections I'll actually get from these people — not the ones I'd get from an online rationalist audience — ordered by how much damage they'd do rather than by how likely they are, each one phrased the way that particular person would put it, in their own vocabulary (correlation device, intervention, ratifiable, knife-edge, measure zero, off the equilibrium path), with a two-minute answer for each and an honest note on where my answer is soft. Tell me what I should concede in the first five minutes before anyone asks anything, tell me which single reply has to land or the paper is basically dead, and tell me which objection is really an older debate wearing a new hat that I should pre-empt on slide two. My talk is 45 plus 20, the case is on slide six, and I've got about two minutes per answer. Also: I have my own guess about the question I'm hoping nobody asks — something about the whole thing being the tickle defence in a trenchcoat, or about cooperation washing out once there are more than two agents, which is awkward given the word large — but I want yours.
reasoning: |-
  Okay, let's tackle this query. The user is preparing for a job talk on "evidential cooperation in large worlds," specifically addressing how agents can cooperate when uncertain about the world-model itself. The key case is the "two cartographers" scenario. The audience includes experts with varied backgrounds: game theory, causal decision theory, formal epistemology, history, functional decision theory, and moral philosophy.

  First, I need to identify the main objections each committee member might raise. The senior game theorist will likely see the correlation as an unstated correlation device. The causal decision theorists will argue that if there's a common cause, CDT can handle it. The formal epistemologist might question if the equilibrium is ratifiable. The historian will challenge whether "large worlds" is just a convenient excuse. The FDT proponent will claim it's a subset of their approach. The moral philosopher might question why this is about rationality rather than agent design.

  The user needs concise, damage-controlled responses. The most critical point is defending the correlation as emergent from shared uncertainty, not a hidden device—if this fails, the paper's core is at risk. The "tickle defense" concern (correlation without causation) is the hidden worry, so preempting that is essential.

  For the prep sheet, ordering objections by damage: game theorist's correlation device first, then causalists' common cause. Conceding upfront that CDT handles small worlds but that large worlds require different modeling. Emphasize that shared uncertainty creates new correlations. The historian's objection should be preempted early by distinguishing Savage's framework from the large world context. The moral philosopher's point needs redirecting to the foundations of decision theory.

  Each response must be two minutes max, with honest soft spots noted. The key reply is to the game theorist—without it, the argument collapses. The tickle defense question should be addressed by stressing that the correlation is world-model-dependent, not internal states.
answer: |-
  Here's your prep sheet, structured for maximum damage control. I've prioritized objections by potential lethality to your core argument, not likelihood. The hidden question you fear ("tickle defense in a trenchcoat") is spot on – that's your critical vulnerability. We'll get to it.

  **Core Concession in First 5 Minutes (Slide 2/3):**
  *   **Concede:** "I want to be explicit upfront: In a perfectly specified *small world* Savage model, where the state space exhaustively captures all relevant dependencies between acts and outcomes, CDT is formally correct. My argument isn't that CDT is *wrong* within its domain, but that many realistic problems – like the Cartographers – resist being cleanly shoehorned into that small-world frame *without smuggling in critical assumptions* about independence or hidden variables. The 'large world' uncertainty about *which model applies* is the crux. This uncertainty isn't about states *within* a model, but about the causal/evidential structure *of* the model itself."

  **Pre-empt on Slide 2: The Historian's Knife-Edge**
  *   **Pre-emption:** "You might ask: 'Is 'large world' just a slogan for when the small-world approximation gets messy, or does it do distinct Savagean work?' Crucially, Savage's framework *assumes* the agent can construct a complete state space resolving all uncertainty relevant to the consequences of acts. The Cartographers' uncertainty about the *model* – specifically, the structure linking their acts *across* models – violates this. They *cannot* specify a state space where their acts are independent variables because the very *meaning* of their act (what it signifies about the world-model) depends on which model is actual. This is a failure of the small-world *idealization*, not just its approximation."

  ---

  **The Prep Sheet: Objections & Responses (Ordered by Damage Potential)**

  1.  **The Senior Game Theorist (Correlation Device / Harsanyi Types):**
      *   **Objection:** "You've smuggled in a correlation device through the back door. This 'shared uncertainty about unmodelled structure' *is* a common prior over Harsanyi types. Each 'candidate world-model' corresponds to a type profile. The correlation in actions you observe is simply Bayesian updating within this correlated equilibrium framework. You haven't escaped game theory; you've just framed it opaquely. Where's the novel *rationality* claim? This is standard Bayesian game equilibrium play."
      *   **Response (2 min):** "You're right that the formalism *resembles* a Bayesian game with correlated types. The crucial difference is *metaphysical* and *epistemic*. In standard Harsanyi, the type space and correlation device are *exogenous primitives* assumed by the modeller and known to exist by the agents (via the common prior). Here, the agents have *no access* to this exogenous structure. They don't know *what* the possible linking structures (types) are or their prior probabilities; they only know they exist in *some* grand world. Their 'common prior' is over *what the world is fundamentally like*, including how acts relate, not over an exogenously given signal. The correlation emerges *endogenously* from rational updating under model uncertainty, not from an assumed exogenous correlation device. Evidentialism is the update rule that discovers this hidden correlation *through the agent's own deliberation*."
      *   **Soft Spot:** The line between "endogenous emergence from model uncertainty" and "exogenous correlation device" is philosophically thin and relies heavily on the agents' fundamental ignorance. If pressed, concede it's a *minimalist* correlation device inherent to the grand world itself, not an added gadget.

  2.  **The Interventionist CDT-er (Common Cause / Bayes Nets):**
      *   **Objection:** "Draw the DAG. If there's a correlation between Ada's act and Bob's act conditional on their information, there *must* be a common cause `L` (the 'unmodelled structure') influencing both. Once you include `L` in the graph, CDT correctly conditions on `L` and sees that intervening on my act (`do(Send)`) doesn't affect yours – it severs the path. The correlation is screened off by `L`. Your 'evidence' is just observing `L` via my act. CDT gets cooperation right *if the model is correct*. Your case isn't for Evidentialism; it's for better causal modelling."
      *   **Response (2 min):** "The core problem is that `L` isn't a variable *within* any single model the agents can fully specify. `L` *is* the choice of world-model itself. Crucially, the agents *do not know the structure of the DAGs* within the different world-models. In some candidate models, `L` might be a common cause; in others, it might be direct acausal dependence, logical entanglement, or something else entirely. They can't condition on `L` because they don't know *how* `L` functions across models or even definitively what `L` *is*. EDT works by directly tracking the conditional probabilities `P(Bob Sends | I Send)` vs. `P(Bob Sends | I Stay)`, which *aggregate* the evidential import across all plausible models given the agent's limited knowledge. CDT requires specifying *the* correct DAG to condition on, which the agents fundamentally lack."
      *   **Soft Spot:** If the committee deeply buys the "`L` is just a variable" view, this is hard to shake. Emphasize the *radical uncertainty* about the *causal structure* linking `L` to acts, not just its value. The agents don't know the arrows in the grand DAG.

  3.  **The Formal Epistemologist (Ratification / Fixed Points):**
      *   **Objection:** "Even granting your evidential probabilities, is this choice *ratifiable*? If Ada chooses Send, does she then, *conditional on having chosen Send*, still prefer that choice over Stay? Or does the act change the evidence so much that she regrets it? In Newcomb-like problems, EDT can be unratifiable. What's the fixed point here? Can you prove it's unique and desirable?"
      *   **Response (2 min):** "In the Cartographers, the act *is* ratifiable under EDT. If Ada chooses Send, she updates her beliefs based on this evidence. Crucially, in the models where sending is evidence *for* Bob sending (which are the models making `P(Bob Sends | I Send)` high), choosing Send also makes it likely she's in a world where the *payoff* for mutual sending is high. Conditional on having sent, the evidence still suggests Bob likely sent, making Send still appear best. This isn't a Newcomb problem with a predictor whose accuracy depends on your choice in a way that tempts regret; it's about discovering which coordination-friendly world you're in. The fixed point exists: 'Both Send' is a stable outcome under EDT reasoning given the shared model uncertainty."
      *   **Soft Spot:** Proving uniqueness/general stability conditions for fixed points under large-world uncertainty is complex and not fully developed in the paper. Concede it's an area for future formal work but argue the Cartographers case intuitively hits a stable point.

  4.  **The Functional Decision Theorist (FDT / Program Equilibrium):**
      *   **Objection:** "This looks like a clunky, implicit version of FDT/program equilibrium. Your 'shared uncertainty about the world-model' is functionally equivalent to uncertainty about the *source code* or *decision rule* of the other agent. EDT is stumbling towards cooperation because, in this specific setup, it approximates evaluating the logical counterfactual 'If my decision rule outputs Send, what does Bob's rule output?'. But FDT makes this explicit and robust, handling more cases cleanly without the 'large world' mystification. Why not just use the better tool?"
      *   **Response (2 min):** "FDT is powerful, but it makes a strong metaphysical commitment: that agents are *computable functions* whose outputs are determined by their (possibly identical) source code. The Cartographers case is deliberately designed to *avoid* that commitment. There's no shared code, no obvious logical dependence, no assumption they are 'copies'. The link is purely *epistemic*: shared ignorance about the world-structure that *happens* to correlate their acts. EDT captures cooperation emerging from *evidential uncertainty* alone, without needing the machinery of source code, logical possibility, or explicit mutual modeling of decision rules. It shows cooperation can arise from a weaker, more general foundation: shared ignorance about how the world works."
      *   **Soft Spot:** If the FDT proponent insists that "world-model uncertainty implying act correlation" *logically entails* a form of source code uncertainty (even if abstract), it's a tough semantic battle. Hold the line that EDT requires fewer specific ontological commitments about agents.

  5.  **The Moral Philosopher (Rationality vs. Design):**
      *   **Objection (Politely):** "This is fascinating, but I'm unclear on why this is an argument about *rationality* as traditionally conceived – what an individual agent *ought* to do given their beliefs and desires. It seems more like an argument about what *kind of agent* we'd want to design if we desire cooperative outcomes in environments with certain types of uncertainty. Is EDT describing rational choice, or is it prescribing a useful heuristic for achieving a desirable social outcome?"
      *   **Response (2 min):** "This strikes at the heart of decision theory's purpose. I argue that in a large world, where agents fundamentally lack the knowledge to construct a complete small-world model (especially regarding links to other agents), *rationality must incorporate how acts provide evidence about the unknown world-structure*. Ignoring this evidence (as CDT does) leads to dominated strategies (mutual defection) in cases like the Cartographers, *even when the agent knows they lack the full model*. EDT respects the total evidence available, including the evidence *about the world structure* provided by one's own deliberation. It's not just a heuristic; it's the consistent application of Bayesian reasoning under radical uncertainty. Building an agent that ignores readily available, decision-relevant evidence seems *less* rational."
      *   **Soft Spot:** This ventures deep into philosophy. Your answer appeals to "total evidence" and avoiding dominance, but the "ought" of rationality under radical uncertainty is contested ground. Be prepared for follow-ups.

  6.  **The Historian (Large World Work vs. Slogan):** (Partially Pre-empted, but follow-up likely)
      *   **Objection:** "You pre-empted my 'slogan' worry, but let me press. Savage *knew* the small world was an idealization. He thought rational agents *should* strive to build small-world models. Isn't your 'large world' just giving up on that idealization whenever it gets hard? How do you determine *when* the uncertainty is 'about the model' in a way that justifies abandoning the Savage framework? Isn't *all* uncertainty, ultimately, uncertainty within some grand world-model?"
      *   **Response (2 min):** "Savage's injunction is crucial: *build a small-world model if you can*. The Cartographers case highlights a specific class of problems where this fails *in principle* for the agents involved: when the uncertainty includes ignorance about how their own acts correlate *across* agents, and they lack the information or computational resources to resolve this into a state space where acts are independent variables. The key test is: *Can the agent construct a state space such that, conditional on a state, their act is independent of the other agent's act?* If the agents know the correlation *only* arises from specific causal pathways they can model, they can build the small world. If the correlation stems from fundamental ignorance about the *nature* of the linkage (is it causal? acausal? logical?), and they cannot enumerate the possibilities or their priors confidently, they are stuck in the large world. It's not giving up; it's recognizing a fundamental epistemic limitation."
      *   **Soft Spot:** Defining the precise boundary between "can build a small world" and "stuck in large world" is fuzzy and context-dependent. Concede it's not always a bright line.

  7.  **The Junior CDT-er (Measure Zero / Off-Equilibrium):**
      *   **Objection:** "Your correlation relies on Ada assigning positive probability to world-models where her act *is* evidence about Bob's. But aren't these models incredibly specific and 'knife-edge'? In any vaguely 'natural' prior over possible linking structures, wouldn't the vast majority of models imply independence, making `P(Bob Sends | I Send) ≈ P(Bob Sends | I Stay)`? Your cooperative outcome seems to require a very unnatural, measure-zero prior favoring these special linking models. On the equilibrium path (choosing Send) it might *look* correlated, but off-equilibrium (if she contemplated Stay), the correlation might vanish."
      *   **Response (2 min):** "This is a serious challenge. I argue it's the *shared nature of the uncertainty* that makes cooperation-supporting priors plausible. They know they are both rational agents mapping the *same* valley under the *same* fundamental uncertainty. It's not unnatural to consider models where this shared situation and rationality lead to similar reactions to the evidence (including the evidence of one's own choice). While priors favoring independence *might* be common in some contexts, assuming they *always* dominate begs the question against the possibility of evidential cooperation. The point is that *if* the agents have priors that don't rule out evidential linkages (and the Cartographers scenario suggests they should be open to this possibility), then EDT cooperates. CDT, by assuming independence or requiring a known causal graph, *forces* defection even when the priors *do* support cooperation."
      *   **Soft Spot:** The "plausibility" of priors favoring evidential linkage is subjective. You need to emphasize the *shared context* (same valley, same task, same uncertainty) as making such priors reasonable, not arbitrary. Acknowledge it's sensitive to prior specification.

  8.  **The Hidden Question: Tickle Defense in a Trenchcoat?**
      *   **Objection (Likely from the CDT-ers or Game Theorist):** "Isn't this just the 'tickle defense' of EDT writ large? You're saying Ada's *decision* to Send provides evidence about the world-model (L), which in turn provides evidence about Bob's act. But crucially, the actual *cause* of her sending is her deliberation process, her 'tickle'. If she could separate her knowledge *that she will send* (the tickle) from the *act* of sending itself, then conditioning on the tickle would screen off the correlation between the act and Bob's act. EDT is conflating the act with the evidence provided by the deliberation leading to it. Your 'grand world' correlation reduces to a spurious correlation within the agent's own mind."
      *   **Response (2 min - THE MOST CRITICAL):** "This is the crux. The key difference is that in the tickle defense (for Newcomb), the tickle is an *internal state causally determining the act*. In the large world, the 'evidence' comes not (only) from an internal tickle, but from the *actual fact of which world-model is true*. By choosing Send, Ada *learns* something objective about the world: she learns she is in a world-model where rational agents in her situation tend to send *conditional* on her sending. The evidence isn't *just* about her internal state; it's about the external world-structure. Separating 'tickle' from 'act' doesn't help because the *act itself* is the observable event that provides evidence about which world-model (with its specific linking structure) is actual. The correlation isn't spurious; it's a real feature of the grand world's structure, discovered through action."
      *   **Soft Spot:** Distinguishing the evidential role of the *act* from the *deliberation process* is philosophically delicate. If the objector insists the *only* relevant evidence generated by choosing Send is the internal state (tickle) that *led* to Send, and the act itself is causally inert regarding the world-model/L, your argument collapses. You **must** establish that performing the act provides *additional, external evidence* about which world-model holds, beyond the internal tickle. Emphasize the *objective* nature of the world-model uncertainty.

  **The Single Reply That Must Land:**
  *   **Reply to #1 (Game Theorist) and #8 (Tickle Defense) is critical.** If you cannot convincingly argue that the correlation emerges *endogenously* from shared world-model uncertainty and isn't just an exogenous device or a spurious internal correlation (tickle), the core novelty and argument for EDT evaporates. Your response to #8 is the linchpin defending the entire mechanism.

  **What to Concede Early (Slide 2/3):**
  *   CDT is correct in well-specified small worlds.
  *   The line between large/small worlds can be fuzzy.
  *   Priors matter, and unfavorable priors can block cooperation.
  *   Formal aspects (ratification stability, uniqueness proofs) need further development.
  *   This doesn't necessarily *refute* CDT; it highlights a limitation in its *domain of applicability* (radical model uncertainty).

  **The Question You're Hoping Nobody Asks (But They Might):**
  *   **The Scalability/Objection:** "You call this 'Large Worlds,' but your central case is two agents with symmetric-ish reasoning. What happens with *n* agents? In large populations, won't the evidential impact of my single act on the probability of *enough* others cooperating to reach a threshold (e.g., for providing a public good) become vanishingly small? Doesn't EDT collapse into defection in large groups, making your 'large worlds' solution irrelevant for truly large-scale problems? How is this 'large worlds' if it doesn't scale?" (Likely from the Game Theorist or CDT-er).
      *   **Why it's Awkward:** It directly challenges the "large" in your title and the generality of your mechanism. Cooperation washing out with N is a standard problem.
      *   **Response Seed:** "This is a vital challenge. The Cartographers case establishes the *principle* under minimal conditions. Scaling introduces complexity. However, shared uncertainty about a *common* world-model or threshold might still allow EDT to support cooperation if agents believe their act provides *salient evidence* about the model that influences a *critical mass* of others, or if they face correlated subgroups. It's not guaranteed, but nor is it ruled out. This highlights a crucial research direction: understanding evidential cooperation in networked or large populations under model uncertainty." (Acknowledge the difficulty, point to the 2-agent proof of concept, promise future work).

  **Good luck with the flyout!** Your case is intriguing and tackles a deep issue. Focus on clearly differentiating the *source* of the correlation (endogenous discovery via model uncertainty vs. exogenous device) and defending against the Tickle Defense redux. Emphasize the *shared, objective nature* of the world-model uncertainty.
