prompt: |-
  I write about cognitive science for a newspaper, and I'm working on a piece about linguistic relativity. Rather than rehearse the debate, I want to know which version of the claim my own reactions commit me to. So here are my verdicts on six vignettes; the fieldwork in each is stipulated, and I'd like it taken as given.

  (i) A community whose language has three basic colour terms — light, dark, and a warm term covering reds, oranges and yellows — discriminates and recognises chip boundaries around our blue/green divide about as finely as English speakers do. My verdict: no effect worth the name. Whatever language does, it does not repaint the visual field.

  (ii) A community with no exact number words beyond one, two and many. Speakers match seven objects to seven objects when both arrays sit still in front of them, but fail when one array is hidden, rearranged, or presented sequentially. My verdict: a genuine cognitive limitation, and language is part of the explanation.

  (iii) A community with no left/right vocabulary, which specifies all positions in absolute terms and can do so only because speakers track orientation constantly. They point accurately and navigate unfamiliar terrain where English speakers are lost. My verdict: real, but I read it as a capacity kept in training rather than one language installed — which sits awkwardly with (ii), where the absence of words clearly cost something. Poverty of vocabulary seems to hurt; richness doesn't seem to add.

  (iv) A language with obligatory grammatical gender: speakers describe a noun the way its gender would suggest and misremember which adjective was paired with it. My verdict: a real effect but a parlour trick — a response bias in a verbal task, not a difference in thought.

  (v) A language with obligatory evidential marking, where every statement must be coded as seen, heard, or inferred. Speakers are markedly better at recalling the source of a belief and at not relaying hearsay as fact. My verdict: this is the real thing, language shaping thought — even though structurally it is the same situation as (iv), an obligatory distinction English lacks.

  (vi) The one I go back and forth on: a language with no spatial vocabulary for time — no long or short meetings, no looking forward or back, no front/behind axis for past and future, only order and duration of events. Speakers plan, estimate durations, and gesture about time much as English speakers do. My verdict: no effect. But if metaphor is supposed to scaffold abstract thought, I can't say why (ii) shows a deficit and this doesn't.

  Is there a principle that returns all six verdicts — one that says when language is constitutive of a representation and when it merely biases a verbal response, and why the absence of a resource can impoverish while its presence only ever trains? I'd like it stated precisely, clause by clause with the vignette motivating each clause; I'd like to know which of my verdicts it cannot accommodate and would have me overturn; and I'd like it applied to at least one language type I haven't listed, so I can tell whether the piece I'm writing is really about thought or only about attention and practice.
reasoning: |-
  Okay, the user writes about cognitive science for a newspaper and is working on a piece about linguistic relativity. They want to move beyond the typical debate and instead understand what their own reactions to six hypothetical vignettes reveal about their stance on linguistic relativity. Each vignette presents a different scenario with stipulated fieldwork, and the user has provided their verdicts on each. They're looking for a principle that explains all their verdicts consistently, clarifies when language is constitutive of thought versus merely biasing responses, and addresses why the absence of linguistic resources impoverishes cognition while their presence only trains existing capacities.

  The user's verdicts are:
  1. No effect for color terms
  2. Cognitive limitation for number words
  3. Training effect for spatial terms
  4. Parlor trick for grammatical gender
  5. Real effect for evidential markers
  6. No effect for spatial metaphors for time

  I need to identify a unifying principle that accounts for all these judgments. The key tension seems to be between cases where language appears necessary for certain cognitive operations (like exact number concepts) versus cases where it merely enhances or biases existing capacities (like spatial navigation). 

  The user also notes inconsistencies in their own thinking - particularly why the absence of number words causes impairment (ii) while the absence of spatial metaphors for time doesn't (vi), and why richness of spatial vocabulary only trains but doesn't add new capacity (iii) while evidential markers do shape thought (v).

  Looking at cognitive science literature, I recall that core cognition systems - like object tracking, spatial navigation, color perception - are largely independent of language. This explains why lacking color terms (i) or spatial metaphors for time (vi) doesn't impair cognition. 

  But for domains that require cultural construction - like exact large numbers, evidential distinctions, or grammatical gender - language plays a different role. Numbers beyond the subitizing range require a representational system, which number words provide. Similarly, evidential distinctions may not emerge without linguistic markers forcing attention to information sources.

  The user's intuition about "poverty hurting but richness not adding" makes sense here: without language, some cognitive operations simply can't exist (poverty hurts), but having language mainly optimizes or automatizes existing capacities (richness trains). The exception is when language actually constructs new representational formats (like for numbers or evidentials).

  For grammatical gender (iv), the effects appear only in verbal tasks, suggesting response bias rather than altered perception. But for evidentials (v), the effect generalizes to non-verbal recall, indicating deeper cognitive impact. 

  The key distinction might be between language as representational technology versus language as attentional modulator. Representational technologies enable new cognitive operations (numbers, evidentials), while attentional modulators bias existing processes (gender, spatial navigation).

  For the spatial metaphors for time (vi), since time concepts can be grounded in multiple domains (sequence, duration), losing one metaphorical system doesn't impair cognition. But for numbers (ii), the linguistic system is the primary representational tool.

  Applying this to a new example: tense systems. Languages vary in how they mark time - some have elaborate tense systems, others don't. But since time concepts exist independently, lacking tense markers might not impair temporal cognition (similar to vignette vi). However, if a language forced distinctions like "reported past" versus "experienced past," that might actually shape how speakers represent time (like evidentials in v).

  The principle would need clauses specifying when language is necessary for certain representations, when it merely trains existing capacities, and how to distinguish response biases from genuine cognitive differences. I'll formulate this precisely, apply it to each vignette, identify where the user's verdicts align or conflict, and test it with the tense example.
answer: |-
  Below is a unified principle that systematizes your verdicts, grounded in cognitive architecture and linguistic relativity research. It distinguishes when language acts as a **constitutive representational technology** (enabling new cognitive operations) versus a **modulatory influence** (biasing attention or automating existing capacities). It also explains the asymmetry you noted: poverty of linguistic resources can *impoverish* cognition, while richness *trains* but doesn't fundamentally *create* new capacities.

  ### The Principle: Representational Dependence vs. Attentional Modulation
  **Language shapes cognition constitutively when:**  
  (1) The cognitive task requires a *culturally constructed representational format* that lacks a robust innate or sensorimotor foundation, AND  
  (2) Language provides the *only stable public scaffold* for that format, AND  
  (3) The effect generalizes to *non-verbal* tasks requiring the same representational operation.  

  **Language modulates cognition (without constitutive change) when:**  
  (1) It directs attention to perceptual or conceptual features *already present* in core cognition, AND  
  (2) Effects are limited to *verbal tasks* or contexts where linguistic labels prime responses.  

  **Asymmetry Explanation (Poverty vs. Richness):**  
  - **Poverty hurts:** Missing linguistic tools prevent access to culturally constructed representations that expand cognition beyond innate limits (e.g., exact numbers).  
  - **Richness trains:** Redundant linguistic tools enhance efficiency or automaticity for *existing* capacities but don't create fundamentally new representations.  

  ---

  ### Clause-by-Clause Application to Your Vignettes

  #### 1. **Color Discrimination (Your Verdict: No Effect)**  
     - *Principle Applied:* Color categories are grounded in innate visual physiology and pre-linguistic perception. Language *labels* distinctions but doesn't *construct* the visual field.  
     - *Clause:* Modulatory (Attentional) – Language biases attention but doesn’t reconstitute low-level perception.  
     - **Verdict Supported.**  

  #### 2. **Exact Numeracy (Your Verdict: Cognitive Limitation)**  
     - *Principle Applied:* Exact large numbers (>4) lack innate representation. Number words provide a *constitutive symbolic system* for discrete quantification. Without it, operations like memory-based matching fail.  
     - *Clauses:* Constitutive (1,2,3) – Requires a cultural representational format; language is its primary scaffold; non-verbal tasks (matching hidden arrays) fail.  
     - **Verdict Supported.**  

  #### 3. **Absolute Spatial Orientation (Your Verdict: Capacity in Training)**  
     - *Principle Applied:* Spatial navigation leverages innate geometric and vestibular systems. Absolute terms *automate* constant orientation-tracking but don’t create new spatial concepts.  
     - *Clauses:* Modulatory (Attentional) – Enhances an existing capacity (spatial updating); not constitutive (no new representational format is built).  
     - **Asymmetry Explained:** Poverty (no left/right) doesn’t *impoverish* because relative frames are optional enrichments. Richness trains but doesn’t create.  
     - **Verdict Supported.**  

  #### 4. **Grammatical Gender (Your Verdict: Parlor Trick)**  
     - *Principle Applied:* Gender systems bias *verbal recall* (e.g., misattributing adjectives) but don’t alter non-linguistic object representation. Effects vanish in non-verbal tasks (e.g., object manipulation).  
     - *Clauses:* Modulatory (Attentional) – Only affects language-related tasks; no generalization to non-verbal cognition.  
     - **Verdict Supported.**  

  #### 5. **Evidential Marking (Your Verdict: Shapes Thought)**  
     - *Principle Applied:* Source monitoring (seen/heard/inferred) lacks a dedicated innate system. Evidential markers *constitute* a representational habit for epistemic vigilance, generalizing to non-verbal recall.  
     - *Clauses:* Constitutive (1,2,3) – Constructs a new epistemic distinction; language is its primary scaffold; affects non-verbal memory.  
     - **Contrast with (iv):** Unlike gender, evidentials address a *gap* in core cognition (source monitoring isn’t automatic).  
     - **Verdict Supported.**  

  #### 6. **Spatial Metaphors for Time (Your Verdict: No Effect)**  
     - *Principle Applied:* Time concepts are grounded in multiple non-linguistic domains (sequence, duration, event structure). Spatial metaphors are *optional tools* for efficiency, not constitutive scaffolds.  
     - *Clauses:* Modulatory (Attentional) – Metaphors leverage existing spatial capacities; absence doesn’t cripple temporal cognition.  
     - **Resolving Your Tension with (ii):** Numbers lack non-linguistic exact representation; time has innate/duration-based foundations. Poverty hurts only when no alternative supports exist.  
     - **Verdict Supported.**  

  ---

  ### Verdicts Requiring Overturning: None  
  Your judgments align with the principle. The asymmetry in (iii) is explained: Absolute spatial terms train an innate skill (like weightlifting builds muscle), while missing number words remove a *tool-dependent* skill (like lacking numerals prevents algebra).  

  ---

  ### Test Case: Tense Systems  
  **Scenario:** A language with no past/future tense, marking only sequence (A before B). Speakers describe past/future events with equal precision but struggle with counterfactuals (e.g., "If X *had* happened...").  

  - **Analysis via Principle:**  
    - **Sequence** is grounded in innate event cognition (modulatory).  
    - **Counterfactuals** require a representational format for unrealized scenarios, often scaffolded by tense morphology. Without it, reasoning about alternatives may be impaired (constitutive).  
  - **Prediction:** Poverty hurts counterfactual cognition; richness trains temporal sequencing.  
  - **Conclusion:** Effects on counterfactuals would reflect *constitutive* linguistic relativity (thought-shaped), while sequence management is modulatory (attention-trained).  

  ---

  ### Key Takeaway for Your Article  
  **Linguistic relativity is real but specific:** Language is a cognitive tool, not a universal painter. It *creates* new representations only when filling gaps in core cognition (numbers, evidentials). Elsewhere, it biases attention (gender) or optimizes innate skills (space, time). Your piece can confidently argue that **thought** is shaped when language provides unique representational infrastructure—beyond mere attention or practice.
