  **Q: Where does the "Escrowed Probability Mass" go?**  
  A: **Excellent question!** A non-zero portion of the prior probability (potentially infinite measure!) is allocated to programs that *never halt* or output only finite data. This mass is irrevocably held in our **Halting-Problem Escrow Sink™** to maintain normalization. Consider it the unavoidable *tax* paid for considering *all* possibilities. **Amount escrowed is non-computable and non-recoverable.**  

