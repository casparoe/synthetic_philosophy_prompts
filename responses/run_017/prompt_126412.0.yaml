answer: |-
  The hum’s wrong. Not the usual deep thrum of the pumps, or the white-noise hiss of water through pipes. It’s higher. Tighter. Like a wire pulled taut and vibrating. My eyes snap to the central monitor. Tank 4. Ammonia. The counter isn’t just blinking; it’s a solid, accusing red bar pulsing like a frantic heartbeat. 1.8 ppm and climbing. Fast.

  *Shit.* My own pulse echoes it. The threshold is 0.5 for a sustained breach. This is a spike, a jagged mountain erupting on the graph. Could be a sensor glitch. Could be a dead one rotting somewhere the cleaners missed. Could be something worse, something systemic bubbling up from the dark guts of the recirculation loop.

  Procedure is clear: log it. Flag it. Let the system ping daylight management, trigger diagnostics, maybe even an audit if it’s not resolved quick. Audits mean welfare certification scrutiny. Certifications mean buyers. Buyers mean paychecks. Paychecks mean Dave in filtration stops humming that sad country song about trucks breaking down, means Janice in packaging can keep her kid in those fancy sneakers he wears like armor against the world.

  I hover my finger over the ‘Log Event’ button. The glow paints my nail blue.

  But… ganglia.

  Mrs. Henderson, ninth-grade biology, pointer tapping a diagram of a crayfish. *“Not a brain, dear, not like ours. More like… knots. Little clusters of nerves. One here”* – tap – *“sort of handles the eyes, the feelers. One here”* – tap – *“the mouthparts. Then a string of them down the body, controlling legs, swimmerets, tail. Each chunk… somewhat independent.”*

  A committee. A loose federation of nerve-knots. Is a panic spread thin across a dozen isolated command posts still a panic? Or just a dozen tiny, meaningless electrical storms? If the bad thing – the ammonia burn, the oxygen crash – only hits the belly ganglia hard, does the front knot, the one that might handle… whatever a shrimp handles… does it even *know*? Or is it just business as usual up front while the back end screams into the void? If there’s no central desk receiving the distress call, is there really distress at all?

  My gaze flicks to the secondary cam feed for Tank 4. Infrared washes the scene in ghost greens and blacks. Shrimp. Dozens. Most are still. Clinging to the mesh sides, huddled near the airstones. Normal night-time torpor. But a few… a few are restless. Jerky. One flicks its tail hard, shooting backwards erratically, bumps into another who doesn’t react. Another seems to be trying to clean a specific spot on its carapace, over and over, with frantic, uncoordinated swipes of a leg. Is that the ammonia sting? Is it localized? Just that leg’s ganglion firing misfires? Or is the whole… committee… in emergency session?

  I think about the broodstock shed. Getting sent over there feels like stepping into a different, colder world. The females, big as my thumb, brood pouches swollen. The job: hold them gently, but firmly. Snip the tip of the eyestalk with tiny, sharp scissors. Suppresses hormones, makes them spawn like clockwork. Efficient. Humane, the manual says. *Minimizes stress.*

  I held one last week. Cool, hard shell against my palm. Its eye, on the unclipped stalk, was a dark bead, impossible to read. Then the snip. Quick. A tiny, almost invisible nick. The shrimp didn’t thrash. Didn’t make a sound, obviously. But it curled. Just slightly. All its legs drew in a fraction, a flinch radiating from the cut nerve-knot outwards. The intact eye-stalk swiveled wildly for a second, then stilled. I put it back in its tank. It just… sat. Feeling the absence? Or was it just one committee member offline, the others carrying on, adjusting the budget, unaware the finance chair was gone?

  Did it hurt? Did *part* of it hurt? Did a sliver of experience vanish with that clipped tip? Or was the whole fragile consensus of being that inhabited that shell suddenly… less? Thinner?

  The counter pulses. 2.1 ppm. Alarm threshold breached. A soft, insistent chime starts. Not loud. Just enough to crawl under your skin.

  If it’s a committee… if each ganglion is its own tiny locus of *something*… then a spike like this isn't one animal suffering. It’s a hundred little knots of nerves, each potentially screaming its own thin, isolated scream. A bad night in Tank 4 isn’t one tragedy; it’s a massacre of microscopic experiences. The spreadsheet calculates mortality rates, not suffering units. How do you quantify a fragmented agony?

  But if the slivers are too thin… if a ganglion controlling a single swimmeret is just a biological relay switch, no more capable of feeling than a thermostat… then the frantic tail-flick, the obsessive cleaning, the ammonia burn – they’re just noise. Electrical glitches in a decentralized machine. Annoying, potentially damaging to the equipment (the shrimp-body), but ethically weightless. The tank isn't a prison; it's just a well-regulated vat of organic machinery. Clearing the alert isn't hiding suffering; it’s preventing unnecessary panic over faulty wiring.

  Janice’s face swims into my mind. The fierce pride in her eyes when she talked about her son making the basketball team. Those stupid, expensive sneakers. Dave’s off-key humming, the only sound sometimes in the predawn quiet of the break room. The fragile stability of this place, this job, for people who don’t have cushions.

  I see the restless shrimp on the screen. That one obsessively cleaning. Is it feeling the burn? Or is it just a stuck program? Does the committee have a chairman? Is there a faint hum of consensus deep in the fused knots up front that says *This Is Bad*? Or is it chaos down there, a hundred tiny bureaucracies issuing conflicting reports?

  My finger aches. Hovering. The ‘Clear Alert’ button is right next to ‘Log Event’. Same size. Same shape. Clear it. Flag it as a sensor anomaly. The system will keep monitoring. If it’s real, it might spike again. I can reassess. Buy time. Maybe the dawn crew catches it. Maybe it really *is* just a glitch.

  Clearing it feels like… what? Lying? Or pragmatism? Protecting fragile lives – human ones I know, shrimp ones I can’t fathom?

  Logging it feels like… truth? Or throwing a grenade into the lives of people I share lukewarm coffee with?

  The ammonia graph is a sheer cliff face now. 2.3 ppm. The restless shrimp jerks violently, spins in a tight circle. Another one near it does the same. A tiny, silent riot.

  Is it pain? Or just chemistry short-circuiting the committee?

  I close my eyes. Just for a second. I see the broodstock female curling in my hand. I feel the ghost resistance of the tiny scissors. I see the unblinking eye on the remaining stalk.

  My finger moves. It touches the cool plastic of the keypad. I press.

  The screen flashes. The red bar vanishes. The graph resets, showing the spike truncated, a flatline after 2.3 ppm. The soft chime cuts off. Silence floods back in, filled only by the deep thrum of the pumps and the relentless hiss of water.

  I let out a breath I didn’t know I was holding. My sleeve has snagged on the edge of the keyboard. A single, fine thread has pulled loose from the cuff. I stare at it. A tiny filament, unspooled. Useless. Barely noticeable. I try to tuck it back in, but it just hangs there, a frail white line against the dark green of my work shirt.
