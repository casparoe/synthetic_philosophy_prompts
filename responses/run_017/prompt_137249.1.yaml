  ### Case Study: The Research Grant Dilemma

  **Scenario**: Two academics, a Senior Professor and a Junior Researcher, are considering applying for a prestigious grant. They can each choose to submit a "Bold" proposal (high-risk, high-reward) or a "Safe" proposal (modest but reliable). The grant committee only funds one proposal. If both submit Bold, the committee is overwhelmed and rejects both. If both submit Safe, the committee funds the Senior Professor by default due to seniority. If one submits Bold and the other Safe, the Bold proposal wins if it comes from the Senior (due to their reputation), but the Safe wins if from the Junior (as the committee hedges on the Junior's Bold idea). Payoffs reflect career advancement: higher numbers are better.

  **Payoff Matrix (Senior, Junior):**

  |                   | Junior: Bold | Junior: Safe |
  |-------------------|-------------|-------------|
  | **Senior: Bold**  | (0, 0)      | (5, 2)      |
  | **Senior: Safe**  | (2, 5)      | (3, 3)      |

  - **Interpretation**:
    - Both Bold: Rejection, no gain (0, 0).
    - Senior Bold, Junior Safe: Senior wins grant (5), Junior gets minor project (2).
    - Senior Safe, Junior Bold: Junior wins grant (5), Senior gets minor collaboration (2).
    - Both Safe: Senior wins by default (3), Junior gets minimal recognition (3).

  ---

  ### Plain Game-Theoretic Reasoning
  Both players are rational and self-interested, with common knowledge of payoffs. They seek a **Nash equilibrium**, where neither can improve by unilaterally changing their choice.

  - **Nash equilibrium 1**: (Senior: Bold, Junior: Safe) → (5, 2).  
    - If Senior switches to Safe, payoff drops from 5 to 2.  
    - If Junior switches to Bold, payoff drops from 2 to 0.  
  - **Nash equilibrium 2**: (Senior: Safe, Junior: Bold) → (2, 5).  
    - If Senior switches to Bold, payoff drops from 2 to 0.  
    - If Junior switches to Safe, payoff drops from 5 to 3.  

  The game has two pure Nash equilibria: (Bold, Safe) and (Safe, Bold). In practice, coordination might fail, but if they coordinate on either equilibrium, **both get at least (2, 5) or (5, 2)**, averaging higher than the symmetric (3, 3).

  ---

  ### Superrationality Applied
  Superrationality generalizes Hofstadter’s symmetry requirement. We test two interpretations:

  #### (i) Same Pure Action
  Both must choose the *same* action (Bold or Safe), as symmetry implies identical choices.  
  - **Both choose Bold**: Outcome (0, 0).  
  - **Both choose Safe**: Outcome (3, 3).  

  Superrational agents maximize the payoff when both pick identically. (3, 3) is better than (0, 0), so they choose **both Safe**.  
  - **Outcome**: (3, 3).  
  - **Comparison to Nash**:  
    - Senior: 3 < 5 or 2 (worse than either Nash).  
    - Junior: 3 < 5 or 2 (worse than either Nash).  
  **Both are worse off than in *any* Nash equilibrium**.

  #### (ii) Role-Veil Reading
  Agents choose a *strategy profile* (a pair of actions) that maximizes expected payoff behind a "veil of ignorance" (not knowing their role). They average the payoffs for each profile:  
  - (Bold, Bold): (0 + 0)/2 = 0  
  - (Bold, Safe): (5 + 2)/2 = 3.5  
  - (Safe, Bold): (2 + 5)/2 = 3.5  
  - (Safe, Safe): (3 + 3)/2 = 3  

  Profiles (Bold, Safe) and (Safe, Bold) tie at 3.5. Superrational agents might use symmetry to break ties, but the roles are asymmetric. If they randomize (e.g., flip a coin), expected payoff is 3.5. If they enforce symmetry, they might average the profiles, leading to a mixed strategy. For simplicity, assume they coordinate on one profile, say (Bold, Safe).  
  - **Outcome**: (5, 2).  
  - **Comparison to Nash**: Same as the first Nash equilibrium. No harm, but no superrational benefit.  

  If they strictly enforce symmetry in the veil, they might be forced into (Safe, Safe) or (Bold, Bold), both worse than the Nash options. The "safe" symmetric choice (Safe, Safe) yields (3, 3), again making both worse off than in the preferred Nash.

  ---

  ### Analysis
  **Structural Feature**: The asymmetry in payoffs and roles creates a **conflict-of-interest coordination game** (similar to Battle of the Sexes). Superrationality fails because:  
  - In (i), forcing identical actions ignores role differences, trapping both in a middling outcome (Safe, Safe) that is Pareto-inferior to the Nash equilibria.  
  - In (ii), the veil of ignorance averages payoffs, but the asymmetry prevents a clear improvement over Nash.  

  **Symmetrizing the Game**: If we make the roles symmetric (e.g., two identical researchers), the matrix becomes:  

  |            | Bold       | Safe       |
  |------------|------------|------------|
  | **Bold**  | (0, 0)    | (5, 5)    |
  | **Safe**   | (5, 5)    | (3, 3)    |  

  Superrationality now works: both choose Safe for (3, 3) or Bold for (0, 0), but the real solution is to coordinate on (Bold, Safe) or (Safe, Bold) for (5, 5). Superrationality’s symmetry requirement collapses the asymmetric roles into a simpler coordination game, but doesn’t handle the original asymmetry.  

  **Hofstadter-Style Defence**: A defender might argue superrationality was "only meant for symmetric problems," and extending it to asymmetry is invalid. This is **principled but a retreat**: Hofstadter’s original examples (e.g., Prisoner’s Dilemma) are symmetric, and the core idea relies on agent interchangeability. However, since real-world problems (climate, commons) are asymmetric, this defence concedes superrationality’s limited applicability—effectively abandoning its goal to solve real coordination traps.  

  **Conclusion**: The case meets all specifications:  
  - Not a PD (different payoff structure: coordination conflict).  
  - Asymmetric roles/payoffs (Senior vs. Junior).  
  - No communication, clones, or reasoning errors.  
  - Superrationality (especially (i)) makes both worse off by their own standards.  
  - The bad outcome arises from enforcing symmetry in an asymmetric context, a flaw in the extension.  

  Superrationality, when generalized naïvely to asymmetry, can actively harm outcomes. A better path might be to blend it with contractarianism (agreeing on rules pre-role) or utilitarianism, but that is not "pure" superrationality. For real asymmetric dilemmas, standard game theory or tailored solutions remain superior.  

  ---  
  **Final Note for the Group**: This illustrates the core tension in superrationality: it thrives on symmetry but wilts under asymmetry. If real-life dilemmas are inherently asymmetric, superrationality might need rethinking or retirement. Perhaps the group’s next paper should be on *asymmetry-resistant* coordination mechanisms!
