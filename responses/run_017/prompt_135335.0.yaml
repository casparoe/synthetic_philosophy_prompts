  Example: Consider the set {1,2,3} with partial order where 1<3 and 2<3, but 1 and 2 are incomparable. Then 3 is a maximum (and maximal). But if we remove 3, then 1 and 2 are both maximal (neither is greater than the other) but neither is larger than the other.

  So the definition given confuses maximal with maximum.

  Verdict: wrong.

  Better phrasing: "there is a maximal element — that is, an element such that no other element is strictly larger than it."

  Claim 2: Equivalence to AC and independence.

