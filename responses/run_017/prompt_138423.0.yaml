answer: |-
  **DEPARTMENT OF CONDUCTOR STATES**  
  **Standing Committee on Effective Calculability (SCEC)**  
  **Notice of Proposed Rulemaking**  
  **Classification of Foundational Computational Theses**  
  **87 Fed. Reg. Computability 31415 (2024)**

  **AGENCY:** Standing Committee on Effective Calculability (SCEC).  
  **ACTION:** Notice of Proposed Rulemaking (NPRM).  
  **SUMMARY:** The Standing Committee on Effective Calculability (SCEC) proposes to establish a definitive administrative classification for the epistemic status of the Church-Turing Thesis (CTT), resolving longstanding uncertainty regarding its methodological standing. This action promotes uniformity in federal research grant adjudication, theoretical computer science curricula accreditation, and patent eligibility determinations concerning novel computational paradigms.

  **DATES:** Comments must be received on or before [DATE 90 DAYS AFTER PUBLICATION].  
  **ADDRESSES:** Submit comments via the SCEC e-Rulemaking Portal at www.scec.gov/rulemaking/docket-CTCLASS, or by mail to: SCEC Docket Clerk, 123 Formal Systems Blvd., Suite λ, Metropolis, DC 20001.  
  **FOR FURTHER INFORMATION CONTACT:** Dr. Alonzo Quine, Chief Epistemic Officer, (202) 555-ΛΛΛΛ, alonzo.quine@scec.gov.

  **SUPPLEMENTARY INFORMATION:**

  **I. Background and Findings**
  The SCEC, pursuant to its mandate under the Pure and Applied Logic Act (PALA) of 2010 (42 U.S.C. § 666a), is charged with ensuring clarity and operational stability in foundational computational concepts utilized in federal domains. The Church-Turing Thesis (CTT), asserting the equivalence of the informal notion of an "effectively calculable function" (commonly understood as a function computable by a human following explicit, finite instructions with pencil and paper) with the formally defined class of Turing-computable (or equivalently, general recursive or λ-definable) functions, presents a persistent ambiguity. After extensive review, SCEC makes the following findings:

  1.  **Ambiguity of Referent:** The CTT intrinsically links an informal, pre-theoretic concept ("effective calculability") lacking rigorous definition (§ 1.1) with multiple, formally defined classes of functions (§ 1.2). This linkage resists conventional proof methodologies.
  2.  **Proof-Theoretic Impasse:** Formalization attempts of the informal concept invariably face insurmountable obstacles:
      a. Any proposed formalization sufficiently robust to capture the intuitive notion either presupposes the equivalence it seeks to prove (thereby begging the question, § 2.1.a), or,
      b. Yields a distinct, formally provable equivalence between *differently formalized* concepts, failing to address the original informal-intuitive core (§ 2.1.b).
  3.  **Evidentiary Basis:** The principal support for the CTT lies in the independent convergence of multiple formalisms (Turing Machines, General Recursive Functions, Lambda Calculus, Register Machines, Rewrite Systems) upon the same class of computable functions (§ 3.1). While empirically compelling and scientifically robust, SCEC finds this convergence constitutes inductive evidence rather than deductive proof (§ 3.2).
  4.  **Variant Formulations:** At least two distinct theses operate under the "CTT" designation:
      a. **CTT-A (Effective Calculability):** Concerns functions computable by finite, discrete, mechanical procedures (§ 4.1.a).
      b. **CTT-B (Physical Realizability):** Concerns functions computable by any physically realizable process (§ 4.1.b). CTT-B faces potential challenges from non-standard physical models (e.g., Malament-Hogarth spacetimes § 4.2.a, idealized analog systems § 4.2.b) that may not threaten CTT-A.
  5.  **Terminological Inadequacy:** Defining "computable" *exclusively* as "Turing-computable" by stipulation (§ 5.1) resolves ambiguity only lexically, failing to engage the substantive epistemic question of whether this formal class truly captures the intended informal concept (§ 5.2). It constitutes an evasion rather than a resolution.
  6.  **Operational Necessity:** Persistent uncertainty regarding the CTT's status (is it a theorem? a conjecture? a definition?) creates inefficiencies in research funding allocation (§ 6.1), patent review (§ 6.2), and educational standardization (§ 6.3). Administrative classification is necessary and appropriate to resolve this uncertainty (§ 6.4).
  7.  **Producibility:** This Notice, and all SCEC administrative actions, are generated by procedures demonstrably falling within the scope of Turing-computable processes (§ 7.1), establishing the Committee's inherent jurisdiction over this matter (§ 7.2).

  **II. Proposed Rule**
  Based on the findings above, SCEC proposes to add § 314.15 to subchapter Γ of 42 C.F.R. Part 666, titled "Epistemic Classification of Foundational Computational Theses," as follows:

  **§ 314.15 Classification of the Church-Turing Thesis**
  (a) **Classification Scheme:** The epistemic status of any nominated foundational thesis (including the CTT) shall be classified into one, and only one, of the following tiers:
      (1) **Settled Theorem (ST):** Possesses a formal proof within an accepted axiomatic system.
      (2) **Working Thesis (WT):** Lacks formal proof but possesses substantial, empirically verifiable evidence supporting its universal acceptance as a practical foundation.
      (3) **Terminological Stipulation (TS):** Represents a binding definition adopted by convention, not subject to empirical verification or formal proof.
  (b) **Classification of CTT:**
      (1) The Church-Turing Thesis (encompassing both CTT-A and CTT-B formulations as defined in SCEC Finding 4) is hereby classified as **Working Thesis (WT)**, subject to the renewal requirement in paragraph (c).
      (2) **Rationale:** The CTT fails classification as ST (§ 314.15(a)(1)) due to Finding 2. It fails classification as TS (§ 314.15(a)(3)) due to Finding 5. Classification as WT (§ 314.15(a)(2)) is necessitated by Findings 3 and 6.
  (c) **Renewal Requirement:** The WT classification of the CTT under paragraph (b)(1) shall expire seven (7) years from the effective date of this rule. Renewal requires a formal SCEC review (§ 314.15(e)) assessing whether the classification remains appropriate based on prevailing epistemic standards and evidence.
  (d) **Counterexample Validation:** Any purported counterexample to the CTT (e.g., a physical hypercomputer) submitted for consideration during a classification review (§ 314.15(c)) or otherwise presented to SCEC must be accompanied by a validation report. This report must:
      (1) Be generated by a procedure formally certified by SCEC as Turing-computable (§ 314.10),
      (2) Conclusively demonstrate the counterexample's physical realizability and computational capability exceeding the Turing limit, and
      (3) Be reproducible by independent entities utilizing the same SCEC-certified validation procedure.
  (e) **Review Process:** Procedures for the seven-year review mandated by paragraph (c) will be established by subsequent SCEC directive.

  **III. Request for Comments**
  SCEC solicits public comment on all aspects of this proposed rule. Commenters are specifically encouraged to address:
  1. The adequacy of the three-tier classification scheme (§ 314.15(a)).
  2. The proposed WT classification of the CTT and the rationale provided (§ 314.15(b)).
  3. The appropriateness of the seven-year renewal period (§ 314.15(c)).
  4. The feasibility and fairness of the counterexample validation requirements (§ 314.15(d)).
  5. Any alternative proposals for resolving the epistemic status of the CTT administratively.
  Comments must reference Docket No. SCEC-2024-Γ-001.

  * * *
  **Drafter’s Note:** This NPRM satirizes persistent philosophical disputes over the CTT's status by literalizing administrative attempts to resolve them. Key jokes hinge on contested interpretations:
  *   **Finding 2 / Rule (b)(2) Rationale:** Mocks the *definitionalist* stance by showing how even a "resolution" (WT classification) acknowledges the lack of proof definitionalists dismiss as irrelevant. A definitionalist would retort that SCEC fundamentally misunderstands the thesis as anything *but* a definition.
  *   **Finding 5 / Rule (b)(2) Rationale:** Targets the *empirical claim* view by showing administrative classification (WT) uncomfortably close to treating it as a falsifiable hypothesis, while Rule (d)'s validation requirement absurdly constraints falsification *to* the paradigm being tested. An empiricist would argue SCEC misrepresents the nature of empirical evidence (convergence, robustness) and sets impossible validation hurdles.
  *   **Finding 3 / Rule (b)(2) Rationale:** Parodies the *quasi-empirical* view, which accepts the lack of proof but treats the thesis as exceptionally secure. Classifying it as a "Working Thesis" requiring renewal bureaucratizes this stance, highlighting its difference from proven theorems. A proponent would argue SCEC undervalues the unique weight of the convergence evidence.
  *   **Rule (d):** Embodies self-reference (the rule attempts to regulate its own potential falsification using the methods it assumes) and satirizes the practical unfalsifiability often conceded even by those holding the thesis as quasi-empirical. All sides might agree the validation requirement is circular.
  **Bottom line:** The comedy arises from the thesis's unique, irreducible status as a *sui generis* pillar of computability theory, resistant to neat categorization as either proven fact, mere definition, or ordinary empirical hypothesis.
