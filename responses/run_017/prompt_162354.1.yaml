prompt: |-
  I have recently, and rather against my inclination, ended up on the governing board of a secondary school that is rewriting its behaviour policy, and the working group's draft turns on a sentence I cannot get out of my head: that the school's aim should be to cultivate guilt rather than shame. I am expected to vote on it in a fortnight. The same argument has since arrived at my own kitchen table, where my partner and I are raising a seven-year-old across two quite different emotional upbringings and keep using both words as if their meaning were settled. And last month I was corrected in front of my own team at work, over something small, and I still could not tell you what it was that I felt — only that it had the flavour of both, and that I would not wish it on the child.

  So before I read any further into the subject, I want the specification. Please write the desiderata that a theory of guilt and shame would have to satisfy in order to be adequate for a decision like the one in front of me: not a theory that pronounces one emotion the finer one in the abstract, but one that could tell an institution which of them — or which third thing — it ought to try to produce in the people it is responsible for. Give the case or consideration behind each requirement, and mark each as non-negotiable or as a preference of one camp. I would particularly like the list to settle, or at least expose, the following:

  The three questions that I suspect are being conflated: which emotion is the more apt or fitting response, which produces the better conduct and for whom (the agent, the person harmed, the group), and which is the more liveable thing to carry. These can surely come apart, and the memo assumes they do not.

  The extensional problem. The theory must let a governor look at an actual practice — a restorative conference, a public apology, a private conversation, a written reflection, a mark recorded in a register — and say which emotion that practice is cultivating. If it cannot discriminate at the level of practices, it cannot guide a policy. But it must also allow that one and the same practice may land as guilt in one pupil and shame in another. Tell me whether those two demands can both be met.

  Shame without a witness: shame felt in solitude, shame directed at one's own past self, and shame for what someone else did — one's child, one's country, one's grandfather. Any account that leans on an actual audience must say what these are, and whether they are one emotion wearing disguises.

  Shame under a norm the agent rejects: the teenager who is ashamed and who also judges, correctly, that the norm doing this to them is contemptible. I need to be able to say both that the shame is real and that it is misfelt; a theory that permits only one of those claims is of no use to me.

  The case I keep circling back to. My employer now runs on dashboards, and I notice in myself a state that is about an act, rather like guilt, but whose object is a missed target rather than a person or a norm — call it audit-guilt if you like. Is it a species of guilt, a fourth thing, or evidence that the distinction between act-focus and self-focus is doing less work than people suppose? Your list of requirements needs somewhere to put it.

  The shameless, and the guilt-proof. A culture that succeeded in abolishing shame would presumably lose something besides the suffering; I want the theory to say what, and to say whether shamelessness is always a deficit.

  And the design problem proper. Emotions are not legislated directly: one changes practices, sanctions and architectures, and the emotion arrives later as a by-product, with lags and collateral effects. A theory fit for my purpose has to say something about which levers exist, about what else comes along with them, and about whose authority it is to do the choosing.

  Then, briefly, tell me which pair of requirements you believe cannot be jointly satisfied — that is the part I most want — and which single requirement excludes the largest number of the standard lines: the act-versus-self account, the audience-and-ideal-spectator account, the status-and-belonging account, the old anthropological contrast between shame cultures and guilt cultures, and anything else you think belongs on the list. A short scorecard of those lines against your criteria is welcome, a paragraph or two apiece, but the criteria are the deliverable. No references or suggestions for further reading, please; I want your specification, not a survey of who has argued for what. And please answer in British English.
reasoning: |-
  Hmm, this is a complex and multi-layered query about guilt vs. shame in institutional policy design. The user needs a practical framework to evaluate behavioral policies, not theoretical abstractions. They're clearly wrestling with real-world tensions: as a school governor, a parent, and a professional experiencing these emotions firsthand. 

  The core challenge is creating evaluation criteria that bridge philosophical rigor and operational usefulness. Their frustration with conflated questions (fitting response vs behavioral outcome vs psychological burden) suggests they've encountered oversimplified frameworks before. I notice they're particularly concerned about:
  - Implementation gaps (how abstract emotions map to concrete practices)
  - Individual variability in emotional response
  - Edge cases like solitary shame or rejected norms
  - Unintended consequences of institutional "emotion engineering"

  The kitchen table mention reveals this isn't just professional - it's deeply personal. Their description of that workplace correction ("flavor of both") indicates they've experienced how messy these emotions are in reality, beyond academic categories. 

  For the desiderata, I need to avoid taking sides in the guilt/shame debate while creating litmus tests that expose weaknesses in common theories. The "audit-guilt" example is clever - it shows how institutional metrics can create hybrid emotional states that challenge traditional binaries. 

  Key structural challenges:
  1) Balancing the need for clear practice-level discriminators (#2) with acknowledgment of subjective variation (must allow same practice→different emotions)
  2) Resolving the witness paradox for shame (#3) without collapsing into subjectivism
  3) Accommodating "misfelt" emotions (#4) while maintaining normative judgment
  4) Accounting for the dashboard phenomenon (#6) that blurs act/self distinction

  The most fundamental tension might be between requirement #1b (measurable conduct outcomes) and #1c (psychological livability) - institutions often sacrifice one for the other. Also, #7's design problem highlights that emotion cultivation is always indirect and leaky - no policy lever pulls just one emotional string.

  For the "which requirement breaks most theories" test, I think #4 (rejected norms) is the killer. Most frameworks can't simultaneously validate the shame's reality while condemning its cause. The status/belonging accounts particularly struggle here. 

  British English reminders: "governing board" not "board of trustees", "fortnight", "mark recorded in register", "dashboards" (UK business jargon), "queue" if needed later.
answer: |-
  Below is a specification of desiderata for a theory of guilt and shame, designed to guide institutional decisions on cultivating emotional responses. Each requirement includes its case/consideration and negotiability status. The framework prioritises operational clarity over abstract moral ranking, addressing your core concerns.

  ### Core Desiderata for an Adequate Theory
  1.  **Tripartite Distinction Requirement**  
      *   **Specification:** Must separately address (a) *fittingness* (aptness of emotion to the act/norm), (b) *efficacy* (impact on future conduct for agent, harmed party, and group cohesion), and (c) *livability* (long-term psychological burden/capacity for repair).  
      *   **Case:** Institutional policies conflating these lead to ineffective or harmful outcomes (e.g., a "fitting" emotion that destroys a child's self-worth; an "effective" emotion for group compliance that is morally grotesque).  
      *   **Status:** **Non-negotiable.** Failure here invalidates policy coherence.

  2.  **Practice Discernibility & Subjectivity Requirement**  
      *   **Specification:** Must enable analysis of specific practices (e.g., restorative conference vs. public rebuke) to predict their *typical* emotional cultivation, *while* accommodating that the *same practice* may elicit guilt in Subject A and shame in Subject B due to disposition, history, or context.  
      *   **Case:** Governors cannot design policy if the theory operates only at the abstract level ("shame is bad"); they need tools to assess concrete interventions. Simultaneously, denying individual variation is empirically false and ethically dangerous.  
      *   **Status:** **Non-negotiable.** Both demands can be met by focusing on practice *design intent*, common psychological mechanisms, *and* risk factors for divergent responses.

  3.  **Solitary & Vicarious Shame Requirement**  
      *   **Specification:** Must account for shame experienced without an actual external witness (e.g., towards past self, private failure) and vicarious shame (e.g., for child's/country's actions), distinguishing these from shame requiring an immediate audience. Must clarify if these are core shame or distinct phenomena.  
      *   **Case:** If shame *requires* an audience, solitary/vicarious cases become inexplicable anomalies. Policy must understand if private reflection cultivates shame or guilt.  
      *   **Status:** **Non-negotiable.** A theory denying these realities is descriptively inadequate. (Leaning: These *are* shame, mediated by internalised audience/identity).

  4.  **Rejected Norm Shame Requirement**  
      *   **Specification:** Must permit the existence of "misfelt" shame – genuine shame experienced under a norm the agent consciously and correctly rejects as contemptible (e.g., LGBTQ+ teen ashamed of identity under homophobic school norms).  
      *   **Case:** Institutions often impose contested norms. A theory must acknowledge the real suffering caused *without* validating the norm, and guide policy to avoid inducing such misfelt emotions.  
      *   **Status:** **Non-negotiable.** Essential for navigating oppressive or outdated norms within institutions.

  5.  "**Audit-Guilt" Accommodation Requirement**  
      *   **Specification:** Must provide a conceptual place for emotions focused on abstract failures (e.g., missed targets, KPIs) rather than specific harmful acts or core norms. Must clarify if this is a guilt-subtype, distinct emotion, or evidence that the act/self-focus distinction is inadequate.  
      *   **Case:** Modern institutions (schools, workplaces) increasingly use metrics. Policy must understand the emotional impact of "dashboard culture."  
      *   **Status:** **Preference (Leaning Guilt-Camp).** Operationalises guilt's link to specific *failures* (acts/omissions) even if abstract, challenging over-reliance on the self/act binary.

  6.  **Shamelessness & Guilt-Proofness Requirement**  
      *   **Specification:** Must articulate what (if anything) is lost – beyond suffering reduction – if shame is successfully abolished in a culture (e.g., erosion of social glue, accountability to shared identity?). Must clarify if shamelessness is always a moral/psychological deficit.  
      *   **Case:** Policy aiming to eliminate shame risks unintended consequences; conversely, understanding shamelessness informs interventions for those seemingly immune to guilt/shame.  
      *   **Status:** **Preference (Leaning Shame-Camp).** Leans towards shame having potential pro-social functions *in principle*, though contextually harmful.

  7.  **Design Lever & Authority Requirement**  
      *   **Specification:** Must identify feasible institutional *levers* (sanctions, procedures, physical environment, modelling, language) for *indirectly* influencing emotional tendencies, acknowledging lag/collateral effects. Must address *whose authority* legitimately chooses the target emotion (governors? staff? pupils? parents?).  
      *   **Case:** Emotions cannot be mandated; policy changes concrete systems. Ignoring levers/authority renders theory practically useless and democratically questionable.  
      *   **Status:** **Non-negotiable.** A policy theory disconnected from implementation and legitimacy is inert.

  ### The Crucial Tension: Which Pair Cannot Be Jointly Satisfied?
  The most significant tension lies between **Requirement 2 (Practice Discernibility & Subjectivity)** and **Requirement 4 (Rejected Norm Shame)**.

  *   **Why?** Requirement 2 demands predicting typical emotional outcomes of practices. Requirement 4 highlights that a practice intended to cultivate fitting guilt (e.g., private reflection on a broken rule) can instead induce intense, *misfelt* shame in someone who rejects the rule's legitimacy. The *same* practice, designed "correctly" for discernibility, can reliably produce vastly different (and policy-relevant) emotional outcomes based on the subject's acceptance of the norm. A theory strong on discernibility risks underestimating this divergence; a theory emphasising misfelt shame risks making practice outcomes seem too unpredictable for policy design. Reconciling predictable levers with fundamental subjectivity under contested norms is the core institutional challenge.

  ### The Excluder: Which Requirement Eliminates Most Standard Theories?
  **Requirement 4 (Rejected Norm Shame)** is the most effective excluder of standard accounts:

  1.  **Act-vs-Self-Focus (Common Definition):** Collapses. If shame is about the "bad self," how can the self feel shame *for* an identity/action it consciously affirms as good under a rejected norm? This theory struggles to call the shame "misfelt" without contradiction.
  2.  **Audience/Ideal Spectator:** Struggles. If shame requires an (actual or internalised) disapproving audience, the teen *knows* the homophobic audience is wrong. Why internalise *their* view? It often dismisses such shame as irrational or not "true" shame.
  3.  **Status/Belonging:** Can explain it (threat to belonging triggers shame regardless of norm validity) but often fails to robustly *condemn* the shame as misfelt – it might see it as a "natural" cost of deviance.
  4.  **Anthropological Shame-vs-Guilt Cultures:** Too blunt. Cannot handle the individual psychology of norm rejection *within* a "shame culture" context. Presumes cultural norms are monolithic and internalised.
  5.  **"Guilt is Moral, Shame is Social" Simplifications:** Fail utterly. They cannot conceptualise shame arising from a *moral* rejection of an *immoral* social norm.

  **Brief Scorecard Against Requirements:**

  *   **Act-vs-Self:** Fails #3 (solitary shame is problematic), #4 (misfelt shame), #6 (shamelessness deficit unclear). Struggles with #5 (audit-guilt fits "act" awkwardly). Strong on #2 discernibility *if* norms are shared.
  *   **Audience/Spectator:** Fails #3 if denying solitary shame, #4 (struggles with misfelt shame legitimacy). Good on #2 (practices define audience). Weak on #6 (loss without shame).
  *   **Status/Belonging:** Strong on #3, #4 (explains misfelt shame), #6 (articulates loss – cohesion/status). Weak on #1 (often conflates efficacy for group with fittingness/livability), #5 (audit-guilt less clear). Moderate on #2.
  *   **Shame/Guilt Cultures:** Fails #1 (conflates concepts), #2 (too broad for practice design), #4 (ignores individual norm rejection). Useful historical context only.
  *   **Moral Guilt / Social Shame:** Fails #3, #4, #5, #6. Too simplistic for policy.

  This specification provides the necessary framework to rigorously evaluate the school's draft policy and your domestic discussions, forcing clarity on what the policy is *actually* designed to achieve, for whom, at what potential cost, and whether its chosen levers can reasonably hit the target without unacceptable collateral damage. The unresolved tension between discernibility and norm rejection subjectivity highlights the inherent difficulty – and responsibility – of institutional emotion-shaping.
