prompt: |-
  Eight months ago I was appointed as one of the two lay members of the clinical ethics committee at a large teaching hospital, and I have been asked to run a forty-five minute session for the committee on how we ought to reason when we cannot settle which moral framework is the right one. Our live docket is whether to fund one more place on a very expensive therapy that produces a large benefit for a single patient, or to spend the same money on a change to discharge and follow-up procedures that produces a very small benefit for a very large number of patients. I have to write the recommendation, so this is not academic for me.

  The committee is thirteen people: five physicians, two nurses, a hospital lawyer, a chaplain, a health economist, two lay members and the chair. Nobody has any philosophy training, and several are openly impatient with anything that will not change what we do on Monday. I have a whiteboard and a single one-page handout I will write from your plan, and I do not want to hand out or cite any readings.

  Do not explain the topic to me. Give me a plan for explaining it, covering the following.

  The order the ideas must come in, and for each step what it depends on in the previous step: in particular, where the distinction between uncertainty about the facts and uncertainty about the framework has to be introduced, and why it cannot wait until later.

  The one case that should carry the whole session, built from our docket. Tell me how to construct it so that three frameworks genuinely come apart on it — an aggregating one, one that gives priority to the worst off, and one that treats certain side-constraints as not tradeable at all — and tell me what the case must be stripped of. My instinct is to remove every bit of empirical uncertainty, so that nothing in the disagreement is about how the world is, and also to remove any vividly described named patient; tell me if the second removal is a mistake.

  The misconceptions, in the order the committee will form them, and the exact point in the sequence at which each should be headed off. I anticipate these: that the middle option is the neutral or fair response; that one should average the frameworks' verdicts the way one would average two experts' probability estimates; that uncertainty about which framework is correct is just another empirical uncertainty and so expected-value reasoning settles it in the obvious way; and that if the frameworks cannot be ranked, any decision is arbitrary and we should simply vote. Say which ones I should let surface before answering, and which would poison the rest of the hour if voiced early.

  The hardest thing I need them to see: that the frameworks may not share a scale, so that "how much better is this than that, according to framework one" is not automatically comparable to the same question for framework two, and that our answer on the docket may shift depending on how the scales are lined up. Where in the arc must this go, what has to be in place before it can be said without baffling people, and how do I present it so it does not read as a licence to do whatever we liked anyway?

  One thing I should openly refuse to explain at this level, announcing that I am not explaining it. My instinct is that it should be how weights get assigned to the frameworks in the first place, but tell me if something else is the better omission.

  A check I can run in the last five minutes that distinguishes understanding the structure from having learned my vocabulary. I would like it to be a new case with the property that the compromise action is ranked last, or near last, by every framework on the table, so that someone who has grasped the point refuses to split the difference and someone who has not does it confidently.

  Finally, one complication I want handled rather than set aside: our uncertainty is not only inside each person's head. Different members are confident in different frameworks and will not change their minds in an hour, so for us the question is as much what a body should do when its members' moral convictions differ as what an individual should do when their own do. Tell me whether to build the session around the individual case and translate at the end, or to run both from the outset, and what is lost either way.
reasoning: |-
  Hmm, the user is a lay member of a clinical ethics committee facing a real dilemma about funding allocation. They need to run a 45-minute session on moral reasoning under framework uncertainty for a diverse committee with no philosophy background. The urgency is palpable - they're drafting an actual recommendation, not just theorizing.

  Breaking this down: First, the committee composition matters. With clinicians, economists, and impatient members, I must avoid academic jargon. The "Monday test" is crucial - everything must feel actionable. The handout constraint means visual simplicity is key; the whiteboard will be our workhorse.

  The core challenge is structural: how to sequence the distinction between factual vs. framework uncertainty without losing them early. This has to come immediately after establishing the case, because if they conflate the two (as many do), the rest collapses. The case construction is brilliant - stripping empirical uncertainty forces the moral disagreement into relief. Removing named patients is wise; it prevents emotional hijacking of the deliberation.

  Three misconceptions worry me most: The "averaging frameworks" error could derail everything if not preempted early. The "expected-value fallacy" needs surgical demolition when we hit scale incomparability. And the "arbitrary vote" misconception must wait until after they've felt the frameworks' genuine clash - only then will they see why it's a surrender.

  For the scale incomparability point - that's the intellectual heart. It must land after they've fully inhabited each framework's logic, but before we discuss decision procedures. The vaccination analogy might work: comparing "lives saved" (aggregative) to "duty to rescue identifiable patients" (deontological) shows how units differ.

  I'll refuse to explain weight assignment - it's bottomless and would sink us. Better to say "We're not deciding whose weights are right today" than pretend we can solve meta-ethics in 45 minutes.

  The group dynamic complication is thorny. Starting individual-focused then pivoting to collective action respects their learning curve. Introducing "frameworks as languages" late prevents early factionalism. The real test is whether they'll recognize a non-compromise case - like denying a treatment that violates all frameworks equally.

  This recommendation will haunt real lives. Every simplification must serve clarity without distorting the moral stakes. The economist needs to see why cost-benefit feels inhuman here; the chaplain must feel heard without veto. Forty-five minutes to prevent either false consensus or unprincipled splitting. God help them.
answer: |-
  Here’s a battle-tested plan for your 45-minute session, designed for impact with a non-philosophical committee facing a real decision. Sequence is critical—follow this order:

  **1. THE CASE (8 mins)**
  *   **Present a stripped, decisive version of the docket:** "We have £X. **Option A:** Fund *one* final place on Therapy Z. It reliably gives *one* patient 10 additional high-quality years of life. **Option B:** Implement New Discharge Protocol. It reliably gives *10,000 patients* a 0.1% reduction in minor complications (e.g., mild delayed healing, brief extra discomfort)—averting *10 total minor complications* across the population. *No other options exist.*"
  *   **Strip:** Remove all empirical uncertainty (e.g., efficacy, cost projections). Remove named patients/vivid descriptions. **Keep:** The stark numerical contrast (1 life vs. many tiny benefits) and the "funding pool" constraint forcing a choice. *Why no named patient?* It introduces unfair emotional bias against aggregation; the *structure* of the conflict must dominate.
  *   **State the Conflict:** "We all want to do good. But reasonable people here strongly disagree on which option is right. Why? It's *not* about the facts. It's about *how we weigh* those facts morally."

  **2. INTRODUCE FRAMEWORKS AS LENSES (10 mins)**
  *   **Dependency:** Depends on establishing the case and the *non-factual* nature of the disagreement.
  *   **Key Distinction NOW:** **"Our uncertainty isn't about *what will happen* (Option A *will* save 1 life, Option B *will* prevent ~10 minor complications). Our uncertainty is about *how to judge* these outcomes morally – which *moral framework* gives us the right answer."** *Why it can't wait:* If this isn't crystal clear upfront, everything devolves into factual debate. Label it: "Framework Uncertainty vs. Factual Uncertainty."
  *   **Present 3 Lenses (Use Whiteboard):**
      1.  **Aggregating (Maximize Total Good):** "Focuses on the *sum* of benefits. Preventing 10 minor complications across many people might outweigh 1 life saved, especially if we measure 'good' in common units (e.g., QALYs gained/suffering averted). Option B likely wins."
      2.  **Priority to Worst Off (Equity/Fairness):** "Focuses on helping those in the *most dire need*. The patient facing death without Therapy Z is vastly worse off than the thousands facing minor, temporary discomfort. We have a duty to rescue this identifiable, desperate person. Option A wins."
      3.  **Side-Constraints (Duty/Rules):** "Focuses on *absolute duties or rules*. 'Never abandon an identifiable patient facing death when you have the specific means to save them' might be such a rule. Saving the one life is non-negotiable, regardless of minor benefits to others. Option A wins, *categorically*."
  *   **Emphasize:** "Each lens starts from plausible moral ideas (helping the most, fairness, duty). Each gives a *clear, different answer* on this stripped case. This is the core problem."

  **3. HEADING OFF MISCONCEPTIONS (12 mins - Interwoven with #2 & as they arise)**
  *   **Misconception 1: "Averaging frameworks = Neutral" (Head off EARLY, during framework intro):** "Notice Option B isn't a 'middle ground' here. It's the *clear winner* for Aggregators and *clearly wrong* for Priority & Side-Constraint views. There *is* no neutral middle option between saving the one or helping the many in this case."
  *   **Misconception 2: "Averaging verdicts like probabilities" (Head off IMMEDIATELY after frameworks are clear):** "We can't just average 'A wins' (Priority/Side) and 'B wins' (Aggregate) to get a 50/50 split. These aren't uncertain *facts*; they're different *ways of judging*. It's like averaging 'The best painting' (beauty) and 'The most expensive painting' (value) – different scales!" *Link this to the hardest point.*
  *   **Misconception 3: "Framework Uncertainty = Empirical Uncertainty" (Head off when introducing distinction - CRITICAL):** "This isn't like not knowing the cure rate. We know what each option *does*. The uncertainty is *which moral lens is the right one to apply*. Expected-value *assumes* a common scale (like money or QALYs) that these frameworks *don't necessarily share* or prioritize the same way." *Poison if voiced early?* **YES.** Nip this in the bud when defining the two uncertainties.
  *   **Misconception 4: "Arbitrariness & Just Vote" (Let surface LATER, after feeling the clash):** *After frameworks are clear and the lack of common scale is introduced:* "It *feels* arbitrary? That's the genuine difficulty! But simply voting doesn't resolve the moral question; it just counts heads. We need a *reasoned* way to decide *despite* this deep disagreement, recognizing the frameworks aren't easily ranked." (Pivot to decision procedures next).

  **4. THE HARDEST POINT: SCALE INCOMPARABILITY (8 mins)**
  *   **Dependency:** Depends on frameworks being understood *as distinct lenses* and Misconception 2 ("averaging verdicts") being addressed.
  *   **Where:** Immediately after frameworks and core misconceptions. *Crucial Setup:* "Notice what each framework *cares about most*: Aggregate = Total Units of Good. Priority = Situation of Worst Off. Side-Constraint = Adherence to Rule X."
  *   **Presentation:** "**The core challenge:** 'How much better' Option A is for Priority/Constraint views (fulfilling a duty/rescuing the desperate) isn't *measurable on the same scale* as 'how much better' Option B is for Aggregators (adding up small gains). They aren't just disagreeing on *numbers*; they're valuing *fundamentally different things* as primary. Asking 'Is saving one life *worth more than* preventing 10 minor complications?' depends entirely on *which scale you're using*. There's no universal converter." **Analogy:** "Like asking if a beautiful sunset is 'better than' £1000. Better *at what*? Beauty or cash value? The scales don't easily align."
  *   **Prevent "Licence" Perception:** "This isn't saying 'anything goes'. It's saying the frameworks are *genuinely distinct*. Our decision *must acknowledge this incommensurability*, not pretend it away. We need a process that respects the depth of the disagreement."

  **5. WHAT TO REFUSE TO EXPLAIN (1 min - Announce clearly)**
  *   **"I will openly *not* explain how to definitively choose *which* moral framework is the 'true' one or assign objective weights to them today. That's deep philosophy, beyond our scope and time. Our task is: *Given* that reasonable members hold these different frameworks sincerely, how should we, *as a committee*, reason and decide on this case?"** *Why this omission?* It's intractable, paralyzing, and distracts from the practical task of *procedural* reasoning under disagreement.

  **6. DECISION UNDER DISAGREEMENT (5 mins - Focus on Group)**
  *   **Handling the Complication (Group Disagreement):** Build the session around the *individual* reasoning challenge first (Steps 1-4). Then explicitly pivot: "But our problem isn't just *my* uncertainty. *We,* as a committee, *hold* these different frameworks. Dr. Smith leans Priority, our Economist leans Aggregate, Nurse Jones feels the Side-Constraint strongly. So, how does a *group* decide?"
  *   **Briefly Discuss Procedures (Whiteboard):**
      *   **Voting:** Simple, but risks ignoring minority moral views (e.g., Side-Constraint feels "duty violated" even if outvoted).
      *   **Consensus/Compromise:** Hard! What compromise exists between "must save the one" and "must help the many"? Might need creative alternatives (not available here) or procedural fairness.
      *   **Seeking Common Ground:** Can we find shared values *within* the frameworks? (e.g., all value reducing suffering? All value not wasting resources? But *prioritization* differs).
      *   **Procedural Fairness:** Ensure every view is heard, understood, and respected. The *process* matters morally when substance is contested.
  *   **What's Lost?** Starting with group dynamics risks politicizing frameworks too early ("us vs. them") and obscuring the *conceptual* problem of incommensurability. Translating *after* establishing the conceptual structure is clearer.

  **7. THE CHECK: "SPOONFUL OF MEDICINE" CASE (Last 5 mins)**
  *   **Present:** "A single child needs a lifesaving drug dose costing £Y. The same £Y buys 100,000 doses of a flavouring that makes a nasty-but-essential medicine *slightly* less unpleasant for 100,000 children. **Option A:** Save the one life. **Option B:** Slightly improve the experience for 100,000. **Option C ('Compromise'):** Give 50,000 flavour doses and *half* the drug dose to the sick child (knowing a half-dose is completely ineffective, the child dies, and half the flavour doses have negligible impact)."
  *   **Ask:** "Should we choose Option C? Why/Why not?"
  *   **Test for Understanding:**
      *   **Understood:** Rejects C vehemently. "Aggregate: Wastes money (no real benefit). Priority: Abandons the worst-off. Side-Constraint: Violates duty to provide effective care when possible. C is *worse* than doing nothing for anyone! It violates *all* frameworks." Refuses to "split the difference."
      *   **Not Understood:** "Well, it's a compromise, everyone gets something, it's fair." Focuses on splitting resources, not respecting the frameworks' *internal* evaluations of the *actions*.

  **Handout Outline (1 Page):**
  1.  **The Case:** Option A (1 Life Saved) vs. Option B (10 Minor Complications Prevented).
  2.  **The Conflict is Moral (Not Factual):** We know what happens, disagree on what *should* be done.
  3.  **Three Moral Lenses:**
      *   *Aggregate:* Maximize Total Good -> Favors B.
      *   *Priority:* Help Worst Off -> Favors A.
      *   *Side-Constraint:* Absolute Duty -> Favors A.
  4.  **Key Challenge:** The lenses use *different scales* (Total Good vs. Rescue Duty vs. Rule Adherence). "Better" isn't easily compared across lenses.
  5.  **Group Decision:** How do we decide *as a committee* when members hold different lenses? (Voting? Consensus? Fair Process?).
  6.  **Avoid:** Averaging lenses, mistaking moral uncertainty for factual uncertainty, assuming a neutral compromise exists.

  **Delivery Tips:**
  *   **Pace:** Strict timing. Use the whiteboard relentlessly for frameworks, scales, decision options.
  *   **Language:** Concrete, no jargon ("lenses," "ways of judging," "scales" not "deontology," "consequentialism").
  *   **Engagement:** Ask for quick show of hands on A/B initially. Pose "Spoonful" case as a closing puzzle.
  *   **Monday Focus:** Constantly link back: "So, for *our* docket, this means..." Emphasize the procedural fairness angle for group buy-in.
  *   **Chair Ally:** Brief the chair beforehand on the structure and key points to help steer if needed.

  This sequence forces the critical distinction early, isolates the moral conflict, disarms key misconceptions at the right moment, introduces the hardest point when primed, avoids rabbit holes, and provides a practical check on understanding within the group context. Good luck with the recommendation.
