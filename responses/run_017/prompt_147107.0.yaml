answer: |-
  ## Proposal: Mapping the Moral Circle: A Framework for Navigating Trade-offs in Measurement and Funding Criteria

  **Fellowship Title:** The Anatomy of Expansion: Unpacking Dimensions, Tensions, and Measurable Proxies within the "Moral Circle" Metaphor

  **Applicant:** [Your Name/Title], Monitoring and Evaluation Specialist, [Philanthropic Intermediary Name]

  **Duration:** Nine Months (Part-time, alongside existing role)
  **Start Date:** [Proposed Start Date, e.g., 1 October 2024]
  **Deliverable:** A Practical Framework Document for Funders: "Navigating Trade-offs in Moral Circle Expansion: Choosing Indicators for Funding Criteria"

  ### 1. The Core Research Question
  What specific trade-offs exist between the distinct dimensions inherent in the "expansion of the moral circle" metaphor (scope, weighting, resolution) when selecting measurable indicators for philanthropic funding criteria, and how can funders explicitly acknowledge and navigate these trade-offs to avoid unintended consequences in programme design and evaluation?

  *This question admits of a determinate answer:* It does not seek to prove whether moral progress *exists* or what *ultimately* drives it. Instead, it demands the systematic identification and mapping of concrete tensions *between specific, defined dimensions* of the metaphor as they manifest in the *practical task of indicator selection*. The answer will be a categorised typology of potential trade-offs and their implications for measurement choices.

  ### 2. Why Usual Framings Leave This Untouched
  The dominant discourse on moral progress revolves around grand, often irresolvable, questions: "Is humanity becoming morally better?" "Is progress driven by reason, sentiment, or institutions?" While vital, these debates operate at a high level of abstraction. They rarely descend to the operational level where philanthropic intermediaries and funders work – the level of defining *specific, measurable outcomes* for funded programmes.

  This gap is critical. When translating the evocative but vague concept of "expanding the moral circle" into tangible funding criteria and indicators (e.g., "increase in survey-reported concern for distant strangers," "number of species included in conservation policy"), we implicitly make choices that settle contested philosophical questions. We choose *which aspect* of the circle's potential "expansion" we prioritise (scope? weighting?) and *how* we conceptualise its "location" (stated beliefs? institutional rules?). Yet, these choices are often made tacitly, without acknowledging the inherent trade-offs or the dimensions we are *not* measuring. The debate about moral progress writ large does not address the practical tensions that arise *between* these dimensions when we try to measure any one of them.

  ### 3. Work Plan: Activities by Month (No Budget, No Primary Data Collection)
  This fellowship relies entirely on conceptual analysis, synthesis of existing literature (philosophy, moral psychology, political theory, evaluation methodology), and critical reflection on practical experience.

  *   **Months 1-2: Foundational Mapping & Literature Synthesis:**
      *   Systematically define the three proposed dimensions: **Scope** (breadth of entities included, e.g., species, nations, future generations), **Weighting** (relative moral consideration given, especially to entities near the perceived edge), and **Resolution** (granularity of discrimination, e.g., species vs. subspecies vs. individuals vs. individual interests).
      *   Conduct a focused review of theoretical and empirical literature to identify existing frameworks touching on these dimensions (without formal citation lists, focusing on conceptual insights relevant to measurement).
      *   Analyse how common indicators used in philanthropy (e.g., survey items, policy counts, media analysis) implicitly map onto these dimensions. Which dimensions do they primarily capture? Which do they obscure?
  *   **Months 3-4: Interrogating the "Location" Question:**
      *   Deepen analysis of the "where" question: Where must change occur for "expansion" to be meaningful and measurable? Critically examine the distinctions and interactions between:
          *   **Stated Conviction** (explicit beliefs, self-report).
          *   **Noticing/Attention** (implicit biases, salience in decision-making, often requiring behavioural measures not readily available).
          *   **Institutional Action** (rules, resource allocation, procedures operating systematically).
      *   Analyse the limitations and affordances of indicators for capturing changes at each "location" and the practical impossibility of capturing "noticing" directly at scale.
  *   **Months 5-6: Identifying Potential Tensions & Trade-offs:**
      *   Employ thought experiments and analysis of historical or contemporary case studies (e.g., shifts in animal welfare discourse, universal human rights frameworks, environmental justice movements) to hypothesise specific tensions:
          *   Does broadening **Scope** (e.g., including more species) dilute average **Weighting** or force coarser **Resolution**?
          *   Does increasing **Resolution** (e.g., seeing individual needs within a group) conflict with universalist **Scope** claims or require shifting resources affecting **Weighting**?
          *   Does prioritising measurable **Institutional Action** indicators risk missing shifts in **Stated Conviction** or genuine **Noticing**?
  *   **Month 7: Implications for Indicator Selection & Funding Criteria:**
      *   Synthesise the identified tensions into a clear typology.
      *   Analyse how current common indicator choices implicitly navigate (or ignore) these trade-offs.
      *   Explore the potential unintended consequences for programme design if trade-offs are not acknowledged (e.g., programmes optimising for easily measurable scope increases while neglecting weighting or resolution).
  *   **Month 8: Drafting the Practical Framework:**
      *   Develop the core deliverable: A structured, actionable framework document aimed at funders drafting criteria.
      *   Structure: Introduction to the dimensions and tensions; A typology of key trade-offs with real-world examples; Guiding questions for funders to ask when defining goals and selecting indicators; Recommendations for acknowledging limitations and avoiding unintended consequences; Implications for evaluation design.
  *   **Month 9: Refinement & Dissemination Preparation:**
      *   Solicit internal feedback from colleagues (programme, grants management).
      *   Refine the framework document for clarity, practicality, and accessibility for a funder audience.
      *   Outline potential internal briefing or external blog post summarising key insights.

  ### 4. The Deliverable: "Navigating Trade-offs in Moral Circle Expansion"
  This concise (15-20 page) framework document will empower funders to:
  1.  **Articulate Intent Explicitly:** Move beyond vague "expansion" goals by specifying which dimension(s) (scope, weighting, resolution) and which "location(s)" (conviction, noticing, action) they primarily seek to influence.
  2.  **Make Informed Trade-offs:** Consciously consider the potential tensions between dimensions *before* locking in indicators, understanding the limitations inherent in any choice.
  3.  **Select Robust Indicators:** Choose indicators with a clearer understanding of *what specific aspect* of the complex phenomenon they actually capture and what they inevitably miss.
  4.  **Design Better Criteria:** Draft funding criteria that acknowledge complexity, avoid oversimplification, and mitigate risks of perverse incentives for grantees.
  5.  **Interpret Evidence Realistically:** Understand why certain outcomes (e.g., increased scope metrics) might coincide with stagnation or regression in other dimensions (e.g., weighting), leading to more nuanced evaluation.

  ### 5. Defining Failure
  This project will have demonstrably **failed** if:
  1.  **The Tensions Remain Vague:** The final framework does not produce a clear, specific, and actionable typology of trade-offs between the defined dimensions. If the tensions identified are too abstract or philosophical to guide practical indicator selection.
  2.  **No Clear Guidance Emerges:** The framework fails to translate the analysis into concrete, practical questions and considerations that a funder drafting criteria could readily apply. If it remains purely theoretical.
  3.  **Inactionable for Target Audience:** Colleagues working directly with funders (e.g., grants managers, programme officers) review the framework and judge it too complex, irrelevant, or impractical to be useful in their discussions with funders about defining goals and measurement approaches.

  Success, conversely, will be evident if the framework provides a structured way to discuss previously implicit tensions, directly informs the drafting of more sophisticated funding criteria within our intermediary or partner foundations, and helps justify why certain indicators are chosen while acknowledging their inherent limitations.
