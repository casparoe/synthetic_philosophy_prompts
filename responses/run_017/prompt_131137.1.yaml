answer: |-
  **Sestina for the Lesser Night Rail**

  She cataloged the reasons why they stay:
  The **claw** that hooks the root, not meant for flight,
  The hidden gleam, the turquoise **patch** displayed
  Though none observe, the swallowed **stones** that grind
  The seeds unseen, the **crest** she thought might flare
  In challenge lost, the **song** the darkness made.

  The island’s quiet was her sole blockade.
  No predator arrived to test the **claw**
  Or force a signal she might yet declare.
  Forty years of watching, note by note she **made**:
  The single **patch**, a beacon in the shade
  Unseen, the **stones** that ballast where they wade.

  The fused **ankle** bore the weight, she said,
  A pivot locked for stealth, not speed, its **made**
  Purpose to silence stalkers in the glade.
  The **claw**’s small hook, a remnant from the past
  That served to anchor nests now overlaid
  With moss; the **song**, a net the night had cast.

  But late, beneath the lamp’s insistent glare,
  She saw the flaw: each separate part displayed,
  Each trait assigned its why, its how, its **made**
  Intention. Was the **crest** a flag unfurled
  For battles vanished? Or a structure laid
  Against the skull, where muscle fibers curled?

  Perhaps the **patch** was not a light displayed
  To guide a mate or warn, but pigment **made**
  For stronger shells, a chemistry conveyed
  Through blood; the hatchlings pecked the bright blue **patch**,
  A target found where none was first arrayed.
  (What chick, observed, first struck that vital **match**?)

  Some things aren’t built. They’re corners where two traits
  Collide, an arch’s thrust requiring space,
  A **rafter** holding weight it never faced
  Until the roof was built above the **stones**.
  The **song**? Not shaped by need, but sound displaced
  By throat’s strict shape – a function not atoned.

  The fused **ankle** holds the weight it **made**.
  The swallowed **stones** grind seeds the claw secured.
  The unseen **patch**, where need and pigment played,
  Was pecked by chicks. The darkness hears the **song**.
  No call was raised; the **crest** stayed unrepaired.
  She watched for proof the stones were passed, unheard.

  \answer{spandrel}
