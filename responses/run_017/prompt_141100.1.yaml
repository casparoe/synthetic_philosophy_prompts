prompt: |-
  I'm on the conduct and ethics committee of a mid-sized international health NGO, and we have to decide what to do about our country office in Terembu before our next report to the donor in about three weeks. The country director — local staff, eleven years with us, well liked — has been approving a cluster of things our global policy almost certainly classes as corruption, on roughly the sector-standard definition our policy copies: power entrusted to you, used for private gain. Concretely: monthly transport and sitting allowances paid to government clinic inspectors so they will actually visit the remote clinics they are meant to supervise (their own ministry has not funded fuel in two years); four goats presented to village elders at a clinic opening; hiring the district health officer's younger brother as a driver, who is by all accounts a genuinely good driver and whose hiring the DHO made clear was about the relationship; and a contractor kicking in bags of cement for the clinic fence as a community contribution. None of it appears anywhere as a line item marked bribe, and our programs lead keeps pointing out that the inspections happened, the cold chain got fixed, and the clinic got built.

  Our regional director says that reporting this to the donor would be a kind of moral imperialism, that we would be holding a Terembuan office to a Weberian bureacracy standard the surrounding political culture does not share, and that refusing the goats would not have been thrift but an insult that ended the relationship with the elders outright. Our governance lead says the opposite: intent and local meaning are irrelevant, the policy is strict liability, and anything softer is how organizations talk themselves into a scandal. I do not want to write context matters and move on.

  To give us something sharper than that, our regional advisor circulated a note with a distinction I half like: facilitation gifting, where the gift buys one specific official act that breaks a rule; maintenance gifting, where it sustains a relationship of obligation and what comes back is discretion and goodwill rather than a specified act; constitutive gifting, where the gift is the relationship, so that refusing dissolves it; and — the one I keep coming back to — something she calls capture by substitution, where impersonal provision gets replaced so thoroughly by gift obligations that officials acquire an interest in keeping their own duties unfunded, since the underfunding is what makes the gifts necessary. That last one seems to me the strongest thing that can be said against tolerating any of this even on its own terms, and I want it in the memo even if we land the other way.

  Can you draft the memo I will circulate before the meeting? It should give us a bottom line we can actually vote on — report to the donor or not, sanction the country director or not, and what we say by the deadline; it should say which of the four categories each of the four practices falls into, or argue that the taxonomy is the wrong tool for one of them; it should give us a decision rule for the next case, because there will be one, that is not just ask the regional director; and it should give the losing side honestly — if you recommend reporting, why the moral imperialism charge has real force here, and if you recommend not reporting, what we say both to the governance lead and to the Terembuan staff who have watched expat managers bend these rules for years.
reasoning: |-
  Okay, the user is on the ethics committee of an international health NGO and needs to draft a memo about potential corruption in their Terembu office. They've described several questionable practices approved by the country director: paying allowances to government inspectors (who haven't received fuel funds), giving goats to village elders, hiring a relative of a health officer, and accepting cement from a contractor. 

  The regional director argues that reporting this would be "moral imperialism," while the governance lead insists on strict policy adherence. The user seems intellectually engaged with the regional advisor's taxonomy of gifting (facilitation, maintenance, constitutive, and capture by substitution), particularly drawn to the last concept as a serious systemic risk. 

  Hmm... the user's real challenge isn't just classifying these incidents but navigating three competing tensions: ethical absolutism vs cultural relativism, donor compliance vs operational reality, and short-term pragmatism vs long-term institutional integrity. They're clearly frustrated by oversimplified "context matters" conclusions and want analytical rigor. 

  What's interesting is how they're positioning themselves: rejecting both extremes (regional director's cultural excuse-making and governance lead's inflexibility), yet acknowledging valid points on both sides. The emphasis on "capture by substitution" suggests they recognize how short-term fixes can perpetuate dysfunction. 

  For the memo structure, I should: 
  - Clearly categorize each practice using the taxonomy but note limitations 
  - Recommend non-reporting with conditions (avoiding donor breach while addressing root causes) 
  - Propose systemic reforms beyond just "ask regional director" 
  - Preemptively address counterarguments to show depth 

  The trickiest part will be framing the driver hire - it's classic nepotism but functionally legitimate. Probably "maintenance" with caveats. And those goats! Classic constitutive gifting where refusal would be catastrophic. 

  User's smart to demand honesty to the "losing side." Must show why moral imperialism arguments have weight here (donor standards vs ground reality) while satisfying the governance lead that this isn't slippery slope. Also can't ignore staff resentment over expat double standards - that's the landmine.
answer: |-
  Below is a draft memo for your committee meeting, designed to foster structured debate, provide actionable recommendations, and address ethical tensions transparently. The memo classifies each incident using the regional advisor’s taxonomy, proposes a decision framework, and confronts counterarguments head-on.

  ---

  **MEMORANDUM**  
  **To:** Conduct and Ethics Committee  
  **From:** [Your Name/Committee Chair]  
  **Date:** [Current Date]  
  **Subject:** Ethical Review of Terembu Office Practices & Path Forward  

  ### **1. Background**  
  The Terembu Country Director (CD) approved four practices potentially violating our anti-corruption policy:  
  - **A.** Monthly transport/sitting allowances to government clinic inspectors (due to unfunded mandates);  
  - **B.** Four goats gifted to village elders at a clinic opening;  
  - **C.** Hiring the District Health Officer’s (DHO) brother as a driver (qualified, but relationship-linked);  
  - **D.** Contractor’s “community contribution” of cement bags for a clinic fence.  

  Program efficacy is noted (inspections completed, clinic built), but policy strictness (defining corruption as "power for private gain") is unambiguous. Regional Director (RD) argues reporting constitutes "moral imperialism"; Governance Lead (GL) insists on strict liability.  

  ### **2. Categorization Using Regional Advisor’s Taxonomy**  
  We apply the taxonomy to assess systemic risk:  

  | **Practice** | **Category** | **Rationale** |  
  |--------------|--------------|--------------|  
  | **A. Inspector allowances** | **Capture by substitution** | State duty (funding inspections) is replaced by NGO resources, incentivizing officials to *perpetuate underfunding* to extract gifts. Creates dependency; undermines public sector accountability. |  
  | **B. Goats to elders** | **Constitutive gifting** | Refusal would dissolve the relationship. The gift *is* the social contract enabling community entry. Not transactional but relational. |  
  | **C. Hiring DHO’s brother** | **Maintenance gifting** | Relationship-sustaining (ensures DHO cooperation). Private gain exists (nepotism), but reciprocity is diffuse (goodwill vs. specific act). **Note:** Qualification mitigates but doesn’t negate conflict of interest. |  
  | **D. Contractor’s cement** | **Facilitation gifting** | Secures a specific, rule-bending benefit (unbudgeted materials). Normalizes “kickbacks” disguised as community support. |  

  **Taxonomy Limitation:** The framework usefully distinguishes intent but cannot override policy definitions. "Capture by substitution" (A) and "facilitation" (D) are highest-risk; "constitutive" (B) is locally functional but still contravenes policy.  

  ### **3. Recommended Actions & Bottom Line**  
  **Vote on the following motions:**  
  1. **Do not report incidents to the donor** at this stage.  
  2. **Issue a formal written warning** to the CD for breaches of policy.  
  3. **Require Terembu Office** to implement corrective actions (Section 4) within 60 days.  
  4. **Disclose general capacity-building efforts** (not specific incidents) in donor reporting.  

  #### **Why This Path?**  
  - **Avoiding "Moral Imperialism":** Blanket reporting would penalize locally functional practices (B) without addressing root causes (A, D). Terembu’s political economy requires nuanced engagement.  
  - **Upholding Accountability:** Sanctioning the CD (despite intent) reinforces policy seriousness. Ignoring breaches erodes institutional credibility.  
  - **Mitigating Highest Risks:** "Capture by substitution" (A) and facilitation (D) demand urgent correction to avoid complicity in systemic dysfunction.  

  ### **4. Corrective Actions for Terembu Office**  
  - **Immediate:**  
    - Cease inspector allowances (A). Collaborate with ministry to co-fund inspections via transparent mechanisms (e.g., fuel vouchers).  
    - Ban contractor "contributions" (D); enforce competitive bidding.  
    - Develop cultural gifting guidelines (B) (e.g., token ceremonial items <$50 value).  
    - Review driver hire (C): If performance is verified, retain but document conflict; future hires require HR pre-approval.  
  - **Systemic:**  
    - Negotiate with ministry to restore inspection funding.  
    - Audit all "relationship-sustaining" expenditures quarterly.  

  ### **5. Decision Rule for Future Cases**  
  Use the **"Substitution Test"**:  
  > *"Does this practice functionally replace a state duty or public resource? If yes, it is prohibited regardless of intent or efficacy. If no, assess whether it is constitutive (relationship-defining) or maintenance (goodwill-building), then seek Ethics Committee pre-approval with cultural justification."*  

  This prioritizes combating systemic harm (capture/facilitation) while allowing flexibility for constitutive acts, subject to oversight. **Regional Directors cannot unilaterally approve exceptions**—Committee review is mandatory.  

  ### **6. Addressing Counterarguments Honestly**  
  **To Governance Lead (if we do not report):**  
  > *"We agree strict liability applies. Sanctioning the CD and banning high-risk practices (A, D) affirms policy. Non-reporting reflects: (1) No personal enrichment occurred; (2) Corrective actions address root causes; (3) Public disclosure could destroy local partnerships vital for health outcomes. We prioritize reform over punitive disclosure—but will report if corrections fail."*  

  **To Terembu Staff (on expat double standards):**  
  > *"Past flexibility was a failure of oversight. New guidelines (e.g., Substitution Test) apply uniformly. We are strengthening systems to ensure all offices uphold policy without cultural hypocrisy."*  

  **To Regional Director (if we report/sanction):**  
  > *"While context matters, 'capture by substitution' makes us complicit in state failure. Tolerating it betrays our duty to sustainable health systems. We mitigate imperialism via collaborative reforms (e.g., co-funding), not acquiescence."*  

  ### **7. Deadline Commitment**  
  By the donor deadline:  
  - Report will state: *"We are enhancing local compliance frameworks to align with global anti-corruption standards, including staff training and partner-government accountability initiatives."*  
  - Full internal review report finalized within 60 days.  

  ---  
  **Recommended Vote:** Support motions 1–4 to balance ethical rigor, cultural pragmatism, and systemic integrity. The "Substitution Test" ensures future cases center on harm prevention, not ambiguity.  

  *Approved by: _________  |  Date: _________*
