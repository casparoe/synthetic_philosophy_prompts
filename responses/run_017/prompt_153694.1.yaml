  ### Workshop Design: Kelly Criterion Betting Game  
  **Goal:** Participants experience the divergence between expected value (EV) maximization and growth-rate maximization through repeated multiplicative bets. Key insights:  
  - Overbetting leads to almost certain ruin despite high EV.  
  - Growth falls slowly when slightly overbetting but crashes past ~2× Kelly fraction.  
  - Optimal fractions vary: sometimes aggressive (80%), sometimes zero.  

  **Materials:**  
  - Whiteboard (track markets, rules, leaderboard).  
  - Projector (spreadsheet for bankrolls: player names, bets, outcomes, updating formulas).  
  - Index cards (players write bets: fraction of current bankroll, 0–100%).  
  - Randomizers: 10-sided die (d10) or deck of cards (assign outcomes).  
  - Phones (calculators allowed; no formulas provided).  
  - Prizes: $10 charity donation (geometric mean of final bankrolls) + $5 gift card (top scorer picks charity).  

  **Incentive Structure:**  
  - **Donation:** Proportional to geometric mean of all final bankrolls (aligns with group growth rate).  
  - **Leaderboard:** Top scorer by final bankroll chooses charity.  
  - **Tension:** Leaderboard encourages risk-taking; donation rewards collective growth. **Reveal donation rule at the end** to avoid biasing initial bets.  
  - **Why it works:** Geometric mean incentivizes Kelly-like betting; leaderboard creates natural overbettors for contrast.  

  **Markets & Sequence:**  
  | Market | Description | EV-Max Fraction | Kelly Fraction | Purpose |  
  |--------|-------------|-----------------|----------------|---------|  
  | **A** | 60% win, even money (win = +100%) | 100% | 20% | Safe positive EV; moderate fraction (20%) shows steady growth vs. ruin. |  
  | **B** | 20% win, 5:1 payout (win = +500%) | 100% | 4% | High variance; tiny Kelly fraction (4%) punishes overbetting. |  
  | **C** | 50% win, 0.9:1 payout (win = +90%) | 0% | 0% | Negative EV; teaches abstention. |  
  | **D** | 90% win, even money (win = +100%) | 100% | 80% | High confidence; large fraction (80%) counters "always be timid". |  

  **Rounds & Timing:**  
  - **20 rounds total** (5 rounds/market, 3 min/round).  
  - **Why 20 rounds?** Enough to show:  
    - EV-maximizers (100% bets) likely go broke (e.g., 60/40 bet: ruin probability = 1 - 0.6⁵ = 92% after 5 rounds).  
    - Kelly bettors (20%, 4%, 0%, 80%) show smoother growth.  
    - Luck dominates short runs; growth differences emerge after 10+ rounds.  

  **Setup (0–10 min):**  
  1. **Intro (5 min):**  
     - "Today, we simulate repeated betting. Start with $1,000. Each round, bet a **fraction** of your *current* bankroll. Markets change every 5 rounds. Highest final bankroll picks the charity. Let’s begin."  
     - *Avoid* terms like "Kelly" or "growth rate".  

  **Block 1: Market A (60/40 at even money; 10–25 min)**  
  - **Announce:** "Bet 1: 60% win chance. Win: double your bet (e.g., bet $100 → win $100). Lose: lose bet."  
  - **Rounds 1–5 (3 min/round):**  
    - **Decision (1 min):** Players write bet fraction (e.g., "0.5") on index card.  
    - **Resolution (1 min):** Roll d10. **1–6: win, 7–10: lose** (publicly visible).  
    - **Update (1 min):** Input fractions into spreadsheet. New bankroll =:  
      - Win: `bankroll × (1 + fraction)`  
      - Lose: `bankroll × (1 - fraction)`  
    - Display leaderboard (top 5 only) after each round.  
  - **After Round 5:** "Notice trends? Who grew steadily? Who crashed?"  

  **Block 2: Market B (20% at 5:1; 25–40 min)**  
  - **Announce:** "Bet 2: 20% win chance. Win: 5× profit (e.g., bet $100 → win $500). Lose: lose bet."  
  - **Rounds 6–10:** Roll d10. **1–2: win, 3–10: lose**.  
  - Update: Win: `bankroll × (1 + 5×fraction)`, Lose: `bankroll × (1 - fraction)`.  
  - **Key moment:** Most overbettors (e.g., >20%) crash. EV-maximizers likely broke by now.  

  **Break (40–45 min)**  

  **Block 3: Market C (50% at 0.9:1; 45–60 min)**  
  - **Announce:** "Bet 3: Coin flip. Win: 90% profit (e.g., bet $100 → win $90). Lose: lose bet."  
  - **Rounds 11–15:** Flip coin/draw card. **Heads: win, Tails: lose**.  
  - Update: Win: `bankroll × (1 + 0.9×fraction)`, Lose: `bankroll × (1 - fraction)`.  
  - **Key moment:** Players who bet >0% lose money on average. Abstention (0%) is optimal.  

  **Block 4: Market D (90% at even money; 60–75 min)**  
  - **Announce:** "Bet 4: 90% win chance. Win: double your bet. Lose: lose bet."  
  - **Rounds 16–20:** Roll d10. **1–9: win, 10: lose**.  
  - Update: Same as Market A.  
  - **Key moment:** Betting 80% grows fast; betting 100% risks ruin on a single loss.  

  **Debrief (75–120 min):**  
  1. **Reveal donation rule (5 min):**  
     - "The charity donation is $10 × geometric mean of your final bankrolls. Top scorer picks the charity."  
     - Compute geometric mean: `(∏ bankroll_i)^(1/16)`.  
  2. **Discussion prompts (40 min):**  
     - **Feel the divergence:** "Who had the highest EV strategy? Who grew consistently?" (EV-maximizers are often broke; Kelly-like bettors thrive).  
     - **Overbetting asymmetry:** Compare:  
       - Player A (Market A: bet 40% ≈ 2× Kelly): Slow decay → negative growth.  
       - Player B (Market A: bet 100%): Ruin by Block 2.  
     - **Not "always timid":** Player C (Market D: bet 80%): Grew aggressively without ruin.  
     - **Abstention lesson:** "Who skipped Market C? Why?" (Negative EV bets drain wealth).  
     - **Incentive tension:** "Did anyone risk everything for the leaderboard? How did it affect the donation?"  
  3. **Final insights (15 min):**  
     - Kelly maximizes long-run growth by optimizing `E[log(wealth)]`, not `E[wealth]`.  
     - Formula-free recap: "Your fortune is multiplicative. Bet too much, and one bad wipeout outweighs many wins. Bet too little, and you leave growth on the table."  
     - **Last question:** "If you played 1,000 rounds of the 60/40 game, what fraction would you bet? Why not 100%?" (Listen for intuitive grasp of risk of ruin vs. growth).  

  **What Will Go Wrong:**  
  1. **Early all-in winner:** A player bets 100% in Round 1 and wins, dominating the leaderboard.  
     - **Mitigation:** Highlight their risk in debrief: "One player got lucky. How many others who bet 100% survived?"  
  2. **Fraction vs. fixed confusion:** Players bet fixed amounts (e.g., "$100") instead of fractions.  
     - **Mitigation:** Pre-round reminders: "Bet a *fraction* of your *current* bankroll."  
  3. **Boredom in abstention:** Players bet in Market C out of impatience.  
     - **Mitigation:** Praise abstainers: "Smart move! Why bet when the odds are against you?"  
  4. **Leaderboard gaming:** One player ignores donation, chases #1 rank with reckless bets.  
     - **Mitigation:** Discuss in debrief: "How did individual goals clash with group goals?"  

  **What the Game Can’t Teach (Verbal Additions):**  
  - **Asymptotic nature:** "Kelly is optimal for *many* repeated bets. Short runs are noisy; long runs expose the math."  
  - **Known probabilities:** "Real life has uncertainty. If probabilities are estimated, bet less than full Kelly to avoid overbetting on error."  
  - **Non-repeatable opportunities:** "For one-time bets (e.g., buying a house), growth-rate maximization isn’t the goal. Use EV or utility functions."  

  **No-Deception Version of "Shrunken Kelly":**  
  - **Skip deception.** In debrief, discuss: "If you suspect the 60% win market is actually 55%, should you still bet 20%? No—reduce your bet to avoid overexposure." Use a hypothetical: "Suppose we reran Market A with true probability 55%. The original 20% bettor loses wealth; a 10% bettor (half-Kelly) would grow safer."  

  **Why This Works:**  
  - **Experiential learning:** Players *feel* volatility drag and ruin before terminology is introduced.  
  - **Debrief ties to moments:** Market A shows overbetting asymmetry; Market C shows abstention; Market D shows "smart aggression."  
  - **Incentives:** Geometric mean donation embodies growth-rate alignment; leaderboard exposes risk-seeking.  

  **Final Check:** If >50% intuitively suggest fractions near Kelly (20%, 4%, 0%, 80%) in the closing question, the idea landed. If they parrot "bet less" without nuance, emphasize Market D’s lesson: "Growth isn’t about timidity—it’s about optimally sizing opportunities."  

  ---  
  **Run this, and they’ll never forget why growth isn’t just EV.**
