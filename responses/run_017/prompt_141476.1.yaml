  ### Exam Question  

  **Gibbard-Satterthwaite Theorem and Plurality Rule**  
  A student claims that **plurality rule with tie-breaking** refutes the Gibbard-Satterthwaite theorem. The rule works as follows:  
  - Each voter reports only their top-ranked alternative.  
  - The alternative with the most votes wins.  
  - Ties are broken using a fixed strict order of alternatives (e.g., \(A > B > C\) means \(A\) wins over \(B\) or \(C\) in a tie, and \(B\) wins over \(C\)).  

  The student argues that:  
  1. Plurality is **onto** (every alternative can win) and **non-dictatorial** (no single voter always decides the winner).  
  2. It is **favorite-proof**: No voter can cause their top-ranked alternative to win by lying (if it wouldn’t win under truth-telling).  
  Thus, he claims it satisfies the theorem’s hypotheses but is non-dictatorial and non-manipulable.  

  **Tasks:**  
  **(a) [5 points]** Verify that plurality with tie-breaking is **onto**, **non-dictatorial**, and **favorite-proof** for \(n \geq 2\) voters and at least 3 alternatives. Briefly justify each property.  

  **(b) [8 points]** Provide an explicit counterexample proving the student wrong. Specify:  
  - The tie-breaking order.  
  - A preference profile (list all voters’ strict rankings).  
  - The truthful winner.  
  - One voter who lies (specify their true ranking and false report).  
  - The new winner after the lie.  
  - Why the lie benefits that voter (reference their true preferences).  

  **(c) [5 points]** Consider the **mirror rule**: Each voter reports their **least favorite** alternative. The alternative with the **fewest** such votes wins (same tie-breaking order).  
  - Is this rule **favorite-proof**? Argue why or provide a profile showing it is not.  
  - Does it protect a voter’s **bottom-ranked alternative** (i.e., can a voter lower the chance their worst alternative wins by lying)? Briefly explain.  

  **(d) [2 points]** In 1–2 sentences, explain why the Gibbard-Satterthwaite theorem requires **strategy-proofness** (no voter can ever get a better outcome by lying) and not just **favorite-proofness**.  

  ---  

  ### Model Answer  

  **(a)**  
  - **Onto**: For any alternative \(X\), if all voters rank \(X\) top, \(X\) wins. Thus, every alternative can win.  
  - **Non-dictatorial**: No single voter controls the outcome. E.g., if two voters have different tops (e.g., \(A\) and \(B\)) and others disagree, the tie-breaker or majority decides, not one voter.  
  - **Favorite-proof**: A lie transfers a vote *from* the true top to another alternative. This cannot increase the true top’s vote count, so it cannot cause the true top to win if it wouldn’t have won truthfully.  

  **(b)**  
  - **Tie-breaking order**: \(A > B > C\) (\(A\) beats \(B\) or \(C\); \(B\) beats \(C\)).  
  - **Profile** (4 voters, alternatives \(A, B, C\)):  
    - Voter 1: \(A \succ B \succ C\)  
    - Voter 2: \(B \succ A \succ C\)  
    - Voter 3: \(C \succ A \succ B\)  
    - Voter 4: \(C \succ A \succ B\)  
  - **Truthful votes**: V1 votes \(A\), V2 votes \(B\), V3 and V4 vote \(C\).  
    - Count: \(A:1\), \(B:1\), \(C:2\). Winner: \(C\).  
  - **Manipulation**: Voter 1 (true top \(A\)) lies and reports \(B\) (not \(A\)).  
  - **New votes**: V1 votes \(B\), V2 votes \(B\), V3 and V4 vote \(C\).  
    - Count: \(A:0\), \(B:2\), \(C:2\). Tie between \(B\) and \(C\). Tie-breaker: \(B\) wins (since \(B > C\)).  
  - **Benefit**: Voter 1’s true preference is \(A \succ B \succ C\). They get \(B\) (after lying) instead of \(C\) (truthful outcome). Since \(B \succ C\), the lie yields a better outcome.  

  **(c)**  
  - **Not favorite-proof**.  
  - **Profile** (3 voters, alternatives \(A, B, C\); tie-breaking \(A > B > C\)):  
    - Voter 1: \(A \succ B \succ C\) (least favorite \(C\))  
    - Voter 2: \(A \succ B \succ C\) (least favorite \(C\))  
    - Voter 3: \(B \succ C \succ A\) (least favorite \(A\))  
  - **Truthful votes**: V1 and V2 report \(C\), V3 reports \(A\).  
    - Count: \(A:1\), \(B:0\), \(C:2\). Winner: \(B\) (fewest votes: \(0\)).  
  - **Manipulation**: Voter 1 (favorite \(A\)) lies and reports \(B\) (not true least favorite \(C\)).  
  - **New votes**: V1 reports \(B\), V2 reports \(C\), V3 reports \(A\).  
    - Count: \(A:1\), \(B:1\), \(C:1\). Tie. Tie-breaker: \(A\) wins (highest in order).  
  - **Outcome**: \(A\) (Voter 1’s favorite) wins only after the lie. Thus, **not favorite-proof**.  
  - **Bottom protection**: No. Lying might *cause* the worst alternative to win. E.g., by not reporting true least favorite \(X\), \(X\)’s vote count decreases, possibly making \(X\) win (if it then has fewest votes).  

  **(d)**  
  Strategy-proofness prevents *any* beneficial lie (e.g., moving from a worse to better alternative, even if not the top). Favorite-proofness only prevents lies aimed at making the *top* win, ignoring lies that improve from a low-ranked alternative to a middling one. The theorem requires full strategy-proofness to cover all manipulations.  

  ---  

  ### Marking Scheme (20 points total)  

  **(a) [5 points]**  
  - **Onto (1 pt)**: States it is onto; justifies that unanimous top support yields win.  
  - **Non-dictatorial (2 pts)**: States non-dictatorial; explains via example (e.g., two voters with conflicting tops).  
  - **Favorite-proof (2 pts)**: Explains that lying reduces/does not increase the true top’s votes.  
  *Common errors: "Non-dictatorial" without example; "favorite-proof" without vote-transfer logic.*  

  **(b) [8 points]**  
  - **Tie-breaking order (1 pt)**: Explicitly stated (e.g., \(A > B > C\)).  
  - **Profile (3 pts)**: At least 3 voters and 3 alternatives; all rankings specified; internally consistent.  
  - **Truthful winner (1 pt)**: Correct (e.g., \(C\) in the example).  
  - **Lie specification (2 pts)**: Identifies voter and false report (e.g., Voter 1 reports \(B\)).  
  - **New winner (1 pt)**: Correct (e.g., \(B\) after tie-break).  
  - **Benefit (1 pt)**: Uses true preferences to show improvement (e.g., \(B \succ C\) for Voter 1).  
  *Common errors: Missing tie-breaker; inconsistent votes; lie that doesn’t benefit.*  

  **(c) [5 points]**  
  - **Favorite-proof claim (1 pt)**: Correctly states "not favorite-proof".  
  - **Profile/manipulation (3 pts)**: Profile with 3+ voters; lie specified; shows favorite wins only after lie.  
  - **Bottom protection (1 pt)**: States "no"; explains lying might help worst alternative win.  
  *Common errors: Assumes symmetry with plurality; no example for favorite-proof; confuses least-favorite reports.*  

  **(d) [2 points]**  
  - **Strategy-proofness scope (1 pt)**: Notes it covers *any* improvement, not just top.  
  - **Favorite-proofness flaw (1 pt)**: Explains it misses manipulations between non-top alternatives.  
  *Common errors: Only "strategy-proofness is stronger" without why; ignores non-top manipulations.*  

  ---  

  ### Notes for Instructor  
  - **Voter counts**: Part (b) requires 4 voters (3 voters with 3 alternatives lack a clean manipulation for this setup). Part (c) works with 3.  
  - **Tie-breaking**: Crucial in (b) to resolve ties. Ensure order is explicit (e.g., \(A > B > C\)) and applied correctly.  
  - **Strong students**: Might note that plurality *is* favorite-proof but not strategy-proof, or extend (c) to show a lie causing the worst to win.  
  - **Time allocation**: ~10 min for (a), 12 min for (b), 6 min for (c), 2 min for (d). Total 30 min.  
  - **Checks**:  
    - (b) Profile validity: Truthful winner \(C\), lie shifts to tie (\(B\) and \(C\)), tie-breaker picks \(B\).  
    - (c) Mirror rule: Truthful winner \(B\), lie causes tie, tie-breaker picks \(A\) (favorite).  
    - Tie-breaking is fixed and identical in all parts.  
  - **Printing**: Ensure alternatives are distinct (e.g., \(A, B, C\)) and tie-breaking order is clearly defined in (b).
