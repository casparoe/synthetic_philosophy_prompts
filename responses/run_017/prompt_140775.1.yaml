prompt: |-
  I'm the only trained archivist at a mid-sized city records office, and twice a year I run appraisal: roughly thirty offers and transfers per cycle, half a day each, and way more material than our shelves can hold. A five-person volunteer board has to sign off, I file a one-page justification for every accept or decline, and the state retention schedules set a floor for government records but say nothing about donated personal papers. I have no budget for outreach and no time to read theory.

  Its not enough to be told that the archive is a product of power and that its silences are structured rather than accidental. I cant hand that sentence to a new hire or paste it into the appraisal manual. Turn it into a procedure I can actually run in half a day: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision to a person because the question is one of values rather than facts.

  Two things I specifically want handled. First, a test for what kind of gap I'm looking at — stuff that was never created in the first place, stuff that was created and then destroyed or weeded, and stuff that exists but sits in someones attic or in another institution — because those seem to call for different responses and I keep conflating them. Second, a correction for what a colleague of mine calls the paper-trail gradient: the volume of documentation about a group tracks how closely that group was administered, not how much was actually going on, so a collections bulk is really evidence about the record-keeper. Should the procedure deliberately over-collect from the least-administered people, and how do I decide when enough is enough?

  Be straight about which steps are genuine tests and which are judgment calls dressed up as procedure. Then run it on three offers from this cycle: (a) about thirty linear feet of a housing departments tenant complaint and violation files, 1978–2015, with names, addresses and unit numbers; (b) one donated box of photocopied flyers, handwritten meeting notes and a membership list from a tenants association in those same buildings in those same decades; (c) the sheriffs office arrest ledgers and mugshots for a neighborhood that was demolished in the 1970s, which are basically the only surviving trace of the people who lived there. I will not like whatever it says about (c), so say it plainly. And tell me what the procedure cant do — especially where it cant tell me what a community actually wants without me going and asking them.
reasoning: |-
  Hmm, the user is an overworked archivist dealing with massive appraisal challenges. They need a practical, step-by-step procedure that addresses power dynamics in archives without requiring theoretical knowledge. Key pain points: no time for theory, volunteer board approvals, and specific struggles with gap analysis and the "paper-trail gradient" bias.

  Breaking this down - first, they want a structured gap test. The three types (never created/destroyed/elsewhere) require different responses: outreach for missing documentation, verification for destroyed items, and coordination for externally held materials. This needs clear decision points.

  Then the paper-trail gradient correction - the core insight that bureaucratic visibility ≠ historical significance. The procedure must actively counter-collect from underrepresented groups. But how to operationalize "enough"? Maybe through proportional representation thresholds tied to known demographics, with explicit over-sampling directives.

  For the three test cases: 
  - The housing department files (a) clearly fail immediately on privacy grounds - too identifiable. 
  - The tenant association materials (b) should pass with flying colors as counter-evidence to bureaucratic records. 
  - The arrest ledgers (c) will be painful - they're problematic but might be the only trace. The procedure would reluctantly accept with heavy redaction protocols, acknowledging this perpetuates state violence but lacks alternatives.

  Biggest limitation: the procedure can't read community minds. It flags when representation feels thin, but can't replace actual consultation. Also, it won't solve storage shortages - just forces explicit triage decisions.

  The user's exhaustion is palpable. They need armor against board pushback, especially for tough calls like the arrest ledgers. The response should validate their ethical unease while giving concrete scripts: "The procedure forces us to confront that we're preserving oppression here because silence would be worse."
answer: |-
  Here's a procedural framework designed for your constraints ("half a day per offer," "volunteer board sign-off," "one-page justification"). It prioritizes actionable tests, flags judgment calls explicitly, and addresses your two specific concerns.

  **Archival Appraisal Procedure: Power, Gaps & Representation**
  *(Designed for 30-45 min per offer + 15 min documentation)*

  **I. Initial Triage (5 min - Fact-Based Filters)**
  *   **Q1: State Retention Schedule Applicable?** (Yes/No)
      *   *Test:* Does the material contain official government records covered by a current state retention schedule?
      *   **Sufficient Answer:** "Yes" + specific schedule cite = **ACCEPT (Mandatory)**. Proceed only for legal compliance documentation. "No" = Proceed.
  *   **Q2: Immediate Legal/Privacy Hazard?** (Yes/No)
      *   *Test:* Contains PII/SSNs, HIPAA-protected health info, active security risks, or legally restricted material impossible to feasibly redact?
      *   **Sufficient Answer:** "Yes" = **DECLINE**. "No" = Proceed. *(Judgment: Assessing "feasible redaction" requires judgment on resources).*
  *   **Q3: Fundamental Acquisition Criteria Met?** (Pass/Fail)
      *   *Test:*
          1.  *Physical Control:* Do we have it or can we get it?
          2.  *Legal Transfer:* Can donor provide clean title/deed of gift (or is it gov't transfer)?
          3.  *Basic Relevance:* Does it *minimally* relate to the geographic area or core functions covered by our mandate?
      *   **Sufficient Answer:** Fail any = **DECLINE**. Pass all = Proceed.

  **II. Gap Analysis & Representation Check (15 min - Mixed Tests/Judgment)**
  *   **Q4: What Type of Gap Does This Address?** (Classify)
      *   *Test/Judgment Mix:*
          1.  **Never Created?** (Evidence of activity lacking documentation - e.g., oral histories, community organizing). *Requires contextual knowledge/judgment.*
          2.  **Created & Destroyed/Weeded?** (Official records disposed per schedule; personal papers discarded). *Often evident from provenance or gaps in official series.*
          3.  **Created & Held Elsewhere?** (In another archive, private hands). *Check finding aids, donor info, basic web search.*
      *   **Sufficient Answer:** Classify (1, 2, 3, or combination). **Not a decline step.** *Purpose: Informs justification and future strategy (e.g., Type 1=prioritize similar comm. docs; Type 3=consider copy vs. original; note relationship).*
  *   **Q5: Correcting the Paper-Trail Gradient?** (Scale: Strong Correction Needed - Neutral - Reinforces Gradient)
      *   *Judgment Call (Explicitly Framed as Such):*
          *   Consider: Does this material originate from/represent groups typically *under*-administered by the state/city (e.g., marginalized communities, informal economies, tenant organizers, cultural minorities)?
          *   Does it offer a perspective *counter* to the official administrative record (e.g., tenant view vs. landlord view, community protest vs. police log)?
          *   **Action:** **Deliberately over-collect?** YES, if it strongly represents under-administered groups/perspectives (Type 1 Gap material is often here). **How much is enough?** *Apply Proportional Threshold:* Does accepting this significantly improve the *balance* of perspectives on this community/issue compared to existing holdings? (Judgment: Requires comparing to your current collections).
      *   **Sufficient Answer:** Position on scale + brief rationale. **Not a direct decline step (yet)**, but crucial for Q6.

  **III. Feasibility & Final Decision Matrix (15 min - Mixed)**
  *   **Q6: Core Archival Value Assessment** (Score: High/Med/Low)
      *   *Judgment Call (Based on Q4 & Q5 analysis plus standard appraisal criteria):*
          *   *Evidential Value:* Proof of org/individual function? (Higher for gov't, contextual for comm.)
          *   *Informational Value:* Unique facts/data? (Higher for unique perspectives/gaps)
          *   *Intrinsic Value:* Physical artifact significance? (Rare here, usually Low)
          *   *Representational Value (Weighted Heavily):* Does it correct imbalance (Q5)? Fill a critical gap type (Q4, esp. Type 1)?
      *   **Sufficient Answer:** High/Med/Low score + 1-2 sentence rationale tying to Q4/Q5/mandate.
  *   **Q7: Can We Handle It?** (Pass/Fail)
      *   *Test/Judgment Mix:*
          1.  *Space:* Does it fit within allocated *new* acquisition space this cycle? (Hard constraint - calculate LF).
          2.  *Processing:* Can basic arrangement/desc/redaction be done with current staff *within 2 years*? (Judgment: Estimate based on format/complexity).
          3.  *Resources:* Does it require exceptional conservation, reformatting, or tech we lack? (Judgment).
      *   **Sufficient Answer:** Fail any = **DECLINE (Practical)**. Pass all = Proceed to Recommendation.

  **IV. Recommendation & Board Handoff (5 min prep + Board)**
  *   **Output:** ACCEPT or DECLINE recommendation based on flow.
  *   **Justification (1 Page Template):**
      1.  Offer ID/Desc.
      2.  Q1-Q3 Results (Brief).
      3.  Gap Type (Q4).
      4.  Representation Impact (Q5 Scale & Rationale).
      5.  Core Value Score & Rationale (Q6).
      6.  Feasibility (Q7 Pass/Fail).
      7.  **RECOMMENDATION:** [ACCEPT/DECLINE]
      8.  **BOARD DECISION:** [ ] Accept [ ] Decline [ ] Other. *(Board handles explicit values conflict where procedure flags judgment)*.
  *   **Board Role:** Resolves conflicts where the procedure flags a **Judgment Call** (esp. Q5, Q6, borderline Q7) that involves **core institutional values or significant community impact**. The procedure provides the analysis; the board makes the value-based choice.

  ---

  **Procedure Limitations (Be Straight):**
  1.  **Community Desire:** It **CANNOT** tell you what a community wants. It identifies *gaps* and *representation imbalances* based on *your analysis* and *existing knowledge*. Knowing community desire requires outreach (which you lack resources for). The procedure flags *when this ignorance is critical* (e.g., Q5 - "Strong Correction Needed" material often comes from groups you haven't consulted). You must note this gap in the justification/board report.
  2.  **Defining "Enough":** Q5's "Proportional Threshold" is inherently subjective. It relies on *your* assessment of collection balance and *your* knowledge of the community's history. The procedure makes this judgment explicit but doesn't remove it.
  3.  **Resource Realities:** It doesn't create space or staff time (Q7). It forces you to confront these limits explicitly for every offer.
  4.  **Nuanced Power Dynamics:** It simplifies "power" into operational questions about gaps and representation. Deep structural analysis remains theoretical.

  ---

  **Applying the Procedure to Your Offers:**

  **(a) Housing Dept. Tenant Files (30 LF, 1978-2015, PII)**
  *   Q1: *Yes.* (Gov't record). **ACCEPT (Mandatory)**. *Stop. Justification cites retention schedule.* (If schedule allows destruction and they are offering for historical value, proceed to Q2).
  *   Q2: *Yes.* (High volume of PII - names, addresses, unit #s, complaints. Feasible redaction = massive, impossible resource drain). **DECLINE**. *Justification: Mandate satisfied per schedule (if applicable), unacceptable privacy risk and redaction burden outweighs potential value. Q4/Q5/Q6 not reached.*

  **(b) Tenants Association Box (Flyers, Notes, List)**
  *   Q1: *No.* (Donated personal papers). Proceed.
  *   Q2: *No.* (Membership list may need redaction, but volume low - feasible). Proceed.
  *   Q3: *Pass.* (Physically here, deed of gift, relates to housing in city). Proceed.
  *   Q4: **Type 1 Gap (Never Created Officially).** Tenant perspective, self-organization. Counter-narrative to official housing dept files.
  *   Q5: **Strong Correction Needed.** Directly represents under-administered group (tenants), counters official landlord/govt perspective. "Over-collect" = YES. Proportional Threshold: Likely unique evidence of this association; significantly balances official record. **Strong Accept Signal.**
  *   Q6: **High Value.** High Informational (unique tenant view) & Representational Value (corrects gradient). Low Evidential (informal org), Low Intrinsic.
  *   Q7: *Pass.* (1 box fits, processing straightforward, standard conservation).
  *   **RECOMMENDATION: ACCEPT.** *Justification highlights Q4 (Type 1), Q5 (Strong Correction/Over-collect), Q6 (High Value - Tenant Perspective).*

  **(c) Sheriff's Arrest Ledgers & Mugshots (Demolished Neighborhood)**
  *   Q1: *Likely Yes/Unclear.* (Official law enforcement records). **If covered by schedule as permanent: ACCEPT (Mandatory)**. *If schedule allows destruction or is ambiguous, proceed.* (Assuming proceed for analysis).
  *   Q2: *Yes.* (Mugshots highly identifiable, arrest data sensitive). **BUT:** "Only surviving trace." Requires judgment on redaction feasibility vs. historical loss. *Judgment:* Redaction (blurring faces, redacting names?) may be *technically* feasible but ethically fraught and resource-intensive. Proceed cautiously.
  *   Q3: *Pass.* (Assuming available, legal transfer, relates to city neighborhood).
  *   Q4: **Type 2 Gap (Created, likely much destroyed) / Type 3? (But "only trace" implies not elsewhere).** Represents state surveillance perspective.
  *   Q5: **Reinforces Gradient.** Originates *from* the administrator (Sheriff). Represents the most administered (policed) aspect of the community. Offers no counter-narrative. "Over-collect"? **NO.** Proportional Threshold: Accepting *only* this reinforces a harmful, single perspective (state surveillance as the sole identity). **Strong Decline Signal.**
  *   Q6: **Low/Medium Value (With Caveats).** Evidential Value (Sheriff's function): High. Informational Value (Names, dates, charges): Medium, but heavily biased. Representational Value: **Very Low (Harmful).** Documents power *over* the community, not the community itself. Value hinges *entirely* on being the "only trace," making it tragic but problematic.
  *   Q7: *Likely Fail.* (Space? Maybe. Processing/Redaction burden? High. Ethical burden? Very High).
  *   **RECOMMENDATION: DECLINE.** *Justification: Q2 (High Privacy Risk, problematic redaction); Q5 (Reinforces harmful administrative bias as the sole record); Q6 (Low Representational Value, ethically fraught despite informational content); Q7 (High burden). Acknowledges tragedy ("only trace") but states clearly: Preserving this ONLY state surveillance record does more harm than good by further silencing the community's own existence and perpetuating the archival violence of their representation solely through the lens of law enforcement. We decline to amplify this single, damaging perspective.*
  *   **BOARD NOTE:** This is a **major values judgment.** The procedure recommends decline based on bias, harm, and burden. The *only* argument for acceptance is the "only trace" factor, which the board must weigh against the documented harms. If the board overrules, demand significant resources for redaction, contextualization, and *immediate* proactive efforts to find ANY other trace (oral histories?) to counterbalance it.

  **Plain Talk on (c):** The procedure says **decline.** Accepting it makes you complicit in preserving the violence of the state as the sole definition of a community. It reinforces the silence it claims to mitigate. It's archival harm. If it's truly the *only* trace, that is a profound failure demanding a different response (outreach for alternatives, marking the silence) *before* accepting the Sheriff's ledger. Without that, acceptance perpetuates the injustice. You won't like it, but the procedure, designed to counter power imbalances, flags this as ethically unacceptable given the alternatives (silence vs. state violence) and your resource limits. The board must confront this harsh reality.
