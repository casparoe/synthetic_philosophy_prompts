  **Delete Case 9 (Nurses omit checking)**.  
  - **Redundant with**: Case 8 (System omits flag). Both involve *causal irrelevance due to preemption* (monitor broken / no alert generated), but Case 8 is clearer and more generalizable (systemic vs. individual failure). Case 9 adds no new insight.  

  ---  
  **Key divergence note**: Causation and blameworthiness pull apart most sharply in **Case 4 (Lifeguard)** and **Case 6 (Stranger)**—blame is intuitive despite weak causal foundations.
