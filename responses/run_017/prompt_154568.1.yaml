prompt: |-
  I'm a novelist — literary stuff with one foot in SF — and I'm about 40k words into a book that hangs entirely off a quantum suicide setup, and I keep drafting scenes that my beta readers, and my mate who did physics at Imperial, tell me are cheating. So what I want isn't a physics lesson, it's a craft procedure: something I can run on any scene I've written in about ten minutes, in the vocabulary I actually work in — point of view, whose head we're in, free indirect style, what the narrator is licensed to know, what the reader can infer from what's on the page, dramatic irony, offstage action — that tells me whether the scene is honest to the premise or whether I've quietly smuggled in a bit of magic. Constraints: no equations, no branching-tree diagrams (I tried drawing one and it made everything worse), it has to work for both my present-tense first-person chapters and the third-person-limited ones, and it should end in either a rewrite instruction or an explicit "this one's a judgment call, you decide" rather than in a shrug. I cant afford many more dead chapters.

  Where I've got to, which you should correct if I've mangled it: as I understand it, every outcome of the device happens somewhere, but you only ever have experiences in the outcomes where there's still a you around to have them, so from the inside you apparently survive everything while from outside you're just dead in nearly all of it. The snags I keep hitting and want the procedure to handle, in roughly the order I hit them: the *grain* problem, since dying isn't instantaneous and I'm not sure there is a single clean outcome in which "she survives" — what do I do with a scene where the character is clinically gone for four minutes and comes back, is that a branch or a smear? The *mangled-branch* problem, since the outcomes where you walk away from a shotgun in the face are outcomes where you walk away ruined, and my character can't be untouched by chapter nine — how much of that do I owe the reader, and at what point does it stop being a book anyone finishes? The *witness* rule, since every other character in the book sees her die — what am I allowed to dramatise and what can I only report, and can I ever write from the daughter's point of view at all, or is that a different novel? The *accumulation* problem, since from the inside she can't know she's in the freak sequence of outcomes but the reader has to feel the improbability mounting, and I don't know how to get that onto the page without handing the narrator knowledge she couldn't have. And the *other-people* problem, since at one point she tries to drag someone through with her, and I genuinely can't tell whether the premise lets her.

  Then run it on three scenes I've got drafted, and give me the third answer even though I don't want it: (a) a present-tense first-person chapter where she presses the button for the hundredth time and nothing happens; (b) a third-person chapter from the daughter's point of view the following morning, identifying the body; (c) my ending, which I love and which I suspect is exactly the one that breaks the rules — she's ninety-odd, she dies in bed with the daughter holding her hand, and the last two pages are inside her head as it goes dark. Tell me precisely what (c) is getting wrong and what the cheapest fix is that keeps the feeling of it. And be honest about where the procedure runs out: mark the points that are just artistic calls, and separately the points where it runs out because the philosophy and the physics don't settle it either — I'm thinking of the business of whether the point of view tracks how many outcomes there are or how thick they are (amplitude? my mate used a word I've forgotten), and whether there's some floor below which the surviving sliver is too thin to be anybody at all. Don't pad it out with a reading list or names of papers, I've read the pop-science accounts and I'm not going to read the papers — I just want to stop writing scenes that don't work.
reasoning: |-
  Okay, let me tackle this novelist's problem. They're writing a literary SF novel based on quantum suicide, but their scenes keep getting called out as "cheating" by beta readers and a physicist friend. They need a practical craft procedure to check scene integrity without physics jargon.

  First, I need to understand their core struggle: maintaining premise consistency while handling narrative techniques like POV and dramatic irony. Their mangled-branch, witness rule, and accumulation problems all point to tension between subjective experience and objective reality in quantum suicide.

  The key principles I should establish are:
  - Absolute POV lockdown: the protagonist only experiences survival branches
  - No privileged narration: the narrator can't know about dead branches
  - Objective reality constraint: other characters must experience the most probable outcomes
  - Cumulative weirdness: survival should feel increasingly statistically anomalous

  For their specific problems:
  - Grain problem: Near-death experiences are messy but must resolve to clear survival/non-survival. The 4-minute clinical death needs to be written as a survival branch with consequences.
  - Mangled-branch: The protagonist must accumulate damage across close calls. I'll suggest making injuries permanent to maintain stakes.
  - Witness rule: Other POVs can only show death outcomes. The daughter's POV scene (b) breaks this completely.
  - Accumulation: Should be shown through environmental dissonance and others' reactions, not protagonist's knowledge.
  - Other-people: The premise likely prevents dragging others through - it would create narrative chaos.

  For their three scenes:
  - (a) Button press: Actually works if framed as improbable survival
  - (b) Daughter's POV: Fundamentally violates premise - must cut or radically reframe
  - (c) Ending: The peaceful death contradicts the immortality implication. Cheapest fix is making it a final survival branch where she chooses to die naturally.

  The amplitude vs count question is genuinely unresolved - I'll mark it as artistic choice. Same for the "too thin to be real" threshold.

  The procedure should be actionable: a checklist they can run in 10 minutes focusing on POV permissions, knowledge limits, and consequence tracking. I'll structure it as concrete questions about each scene's perspective and events.
answer: |-
  Here's your craft-focused Quantum Suicide Integrity Check (QSIC) procedure. It runs on 5 core principles derived from your premise, phrased in narrative terms. Run this on any scene draft:

  **QSIC Procedure (10-Minute Scene Audit):**

  1.  **Whose Head, Whose Rules?**
      *   Identify the POV character/narrator *strictly*.
      *   **Rule:** *Only* the quantum suicide subject (QSS - your protag) experiences continuous survival. All *other* characters experience the QSS dying in the *overwhelmingly most probable* outcome of any lethal event.
      *   **Check:** Does the scene's *knowledge and experience* absolutely adhere to the rules of the POV character? (If QSS POV: survival only. If Non-QSS POV: QSS death is the default reality they experience).

  2.  **The Grain & The Cut:**
      *   Identify the moment(s) of potential quantum branching (lethal event).
      *   **Rule:** Branching occurs at the point where survival/death becomes a quantum-measurable outcome. It's not a "smear." The QSS experiences the *entirety* of the survival branch, including injury, trauma, near-death states (like clinical death), *up to the point consciousness is irretrievably lost in that branch*. If consciousness returns *in that branch*, it's a valid survival branch, however improbable.
      *   **Check:** Does the scene depict the QSS experiencing *only* the aftermath/resolution of a *single, coherent survival branch*? (e.g., waking up after 4 minutes dead? Fine. Vaguely experiencing multiple deaths? Cheating). Does it avoid showing the *simultaneous* experience of death *from the QSS perspective*? (That's the smear).

  3.  **Mangled Branch Accounting:**
      *   Identify consequences for the QSS from any prior branching events.
      *   **Rule:** Survival is *not* escape. Each survival branch carries the physical and psychological consequences *of that specific near-death event*. The QSS accumulates damage, trauma, and deviation from baseline reality. The world around them reflects the *unlikeliness* of their specific survival path.
      *   **Check:** Does the scene acknowledge the *permanent cost* of prior survivals (physical scars, disability, PTSD, altered relationships)? Does the *environment* or *other characters* subtly or overtly reflect the dissonance of the QSS being alive against all odds? (If the QSS is untouched by Ch9, you're cheating).

  4.  **The Witness Barrier:**
      *   Identify all non-QSS characters present or referenced.
      *   **Rule:** From any non-QSS perspective, the QSS *is dead* after any significant lethal event, *unless* that specific non-QSS character is observing the QSS in the *exact same improbable survival branch* (which becomes vanishingly unlikely over time and multiple events). Dramatizing a non-QSS POV *requires* showing the QSS as dead or missing-presumed-dead in their reality.
      *   **Check:** If in a non-QSS POV, is the QSS unambiguously *dead* or *gone* from that character's reality? If other characters interact with the *living* QSS, is it *exclusively* from the QSS's POV? (Dramatizing a daughter's POV interacting with her *living* mother breaks this. *Reporting* the daughter's *belief* that her mother is dead, from the QSS's POV, is fine).

  5.  **Accumulation & The Unspoken Weight:**
      *   Identify how the scene conveys the mounting improbability.
      *   **Rule:** The QSS *cannot* know they are the QSS experiencing improbable branches. The *reader's* sense of mounting improbability comes from:
          *   The QSS's accumulating damage/trauma (Mangled Branch).
          *   The *increasing dissonance* between the QSS's experience and the world reported by others or observed second-hand (e.g., news reports saying everyone died, loved ones grieving them).
          *   The sheer *statistical absurdity* of surviving repeated lethal events.
          *   *Not* from the narrator/QSS stating an awareness of branching or probability.
      *   **Check:** Does the scene build dread/weirdness through *concrete consequences* (Rule 3) and *external dissonance* (Rule 4), NOT through the QSS/narrator explicitly thinking about quantum mechanics or their own special survival status? Does it avoid giving the QSS/narrator *knowledge* of the dead branches?

  **Artistic Calls / Physics/Philosophy Gray Areas (Marked AC/PP):**
  *   **The "Thickness" (Amplitude) vs. Count:** Does the narrative subtly imply survival gets "thinner" (more dissonant, lonelier) or just statistically more absurd? (AC - Choose what serves your theme. Physics doesn't dictate narrative feel).
  *   **The "Too Thin to be Real" Threshold:** Is there a point where survival feels existentially hollow? (PP - Interpretations of consciousness in low-amplitude branches are unresolved philosophy. AC - How far you push the existential horror is your choice).
  *   **The Specific Moment of Branching:** Exactly when does the split occur? (PP - Interpretational. AC - Pick a dramatically clear moment for your narrative).
  *   **The Nature of "Consciousness" in Survival:** How degraded can the QSS be and still "count"? (PP/AC - Tied to the "Too Thin" question. Focus on narrative coherence over physics purity).

  **Running Your Scenes:**

  *   **(a) First-person present: Presses button, nothing happens.**
      *   **QSIC:** **PASSES (Barely).** *Why:* QSS POV. Survival branch is experienced. "Nothing happens" *is* a survival outcome (however improbable). The button failing is a valid survival path.
      *   **But:** It *must* show consequences (Rule 3). Did *previous* button presses cause damage? Is there physical/mental residue? Does *this* non-event feel terrifyingly, absurdly lucky *to the character* because they *expected* to die? Does the *world* seem off? (e.g., lights flicker strangely, a distant unexplained bang). Without this, it feels weightless and cheats Rule 5.
      *   **Rewrite Instruction:** Amp up the physical/mental cost of the *previous* 99 presses within the QSS's experience. Show the character's shattered nerves, trembling, maybe a minor injury sustained flinching last time. Make the "nothing" feel like the universe holding its breath, thick with dissonance. *Show* the improbability through character reaction and environmental unease, not narration about probability.

  *   **(b) Third-person limited (Daughter POV): Identifying the body.**
      *   **QSIC:** **FAILS (Fundamentally).** *Why:* Non-QSS POV (Daughter). Rule 4 states that from any non-QSS POV, the QSS *is dead* after a lethal event. Dramatizing the daughter identifying the body **is** showing that overwhelmingly probable reality.
      *   **The Snag:** This scene, as described, *cannot exist* in a novel adhering strictly to the QS premise if the QSS is the protagonist surviving elsewhere. Dramatizing the daughter's grief here shows the QSS as *objectively dead* in this narrative thread, contradicting the core premise of the QSS's continuous subjective survival.
      *   **Rewrite Instruction (Cheapest):** **CUT.** You cannot dramatize this daughter's POV experiencing her mother's death without breaking the premise. **Alternative:** Show this scene *only* as a *report* or *belief* **from the QSS's POV later.** E.g., The QSS finds a news article online, or overhears a conversation, or hallucinates/fears this scene. The daughter's grief is *real in her branch*, but the narrative can only access it second-hand through the QSS's survival branch. This maintains Rule 4.

  *   **(c) Ending: QSS (90s) dies in bed, daughter present, then fading consciousness.**
      *   **What's Wrong:** It violates the **core implication** of quantum suicide: the QSS subjectively *never* experiences death. From *their* perspective, death is always avoided, kicking them into another branch. A natural death scene *from the QSS's internal POV* breaks the premise. Rule 1 and Rule 2 are shattered.
      *   **Why it Breaches:** The premise says consciousness only persists in branches where the mechanism to sustain it *doesn't fail*. Dying of old age *is* the mechanism failing. Experiencing the fade-to-black *is* experiencing the branch where consciousness ends – the one outcome the QSS premise states the subject *shouldn't* experience subjectively. It's the ultimate cheat.
      *   **Cheapest Fix That Keeps the Feeling:**
          1.  **Shift the POV for the fade-out:** End the QSS's final POV *before* death. Maybe a moment of peace, love, acceptance, seeing the daughter... then **HARD CUT.** The final "fading consciousness" must be from the **Daughter's POV (3rd person limited)**. *She* experiences holding her mother's hand as she passes. *She* witnesses the peaceful death. *She* might have a moment reflecting on her mother's impossible longevity. This adheres to Rules 1 & 4: The QSS's story ends with survival (she lived to 90+!), her final death is only experienced by others.
          2.  **Imply the Branch Shift (More Ambiguous):** The QSS feels immense peace, love, closes her eyes holding her daughter's hand... and then *wakes up*. Not in bed, but somewhere else, young(er), confused. This is the *next* survival branch, however implausible (e.g., revived by future tech, a different timeline). This maintains the QSS POV survival but loses the finality. The "feeling" of peaceful closure is harder to keep, replaced by existential continuation.
      *   **Keep the Feeling:** The *emotional core* – love, peace, acceptance, the daughter present – remains intact in both fixes. The *physical setting* (bed, holding hands) remains. Only the *perspective* on the final moment shifts to honor the premise. The daughter's POV ending allows for profound closure *for the reader* and the daughter character, reflecting on the QSS's impossible journey, while the QSS herself simply... lived until she didn't in *that* branch.

  **Where the Procedure Runs Out & Final Thoughts:**

  *   **Artistic Calls (AC):**
      *   The *degree* of physical/mental mangling (Rule 3) - How ruined is "ruined enough"? (Balance narrative impact vs. character functionality).
      *   The *pace* and *intensity* of the accumulating dissonance (Rule 5) - How much weirdness per scene?
      *   Choosing between "Thickness" vs. "Count" for the feel of improbability.
      *   The specific *emotional tone* of the QSS's experience (stoic, terrified, numb).
  *   **Physics/Philosophy Boundaries (PP):**
      *   **Amplitude vs. Count:** Does the "thickness" (amplitude squared = probability) of a survival branch affect the *subjective experience* beyond just its statistical rarity and the resulting environmental dissonance? (Physics: No consensus. Philosophy: Heavily debated. Narrative: Your choice - AC).
      *   **The Hard Floor:** Is there a probability so low that survival in that branch is meaningless or impossible for coherent consciousness? (PP - Deeply unresolved. AC - You set the limit where the story demands it, likely tied to the Mangled Branch and Accumulation rules showing extreme degradation/dissonance).
      *   **Other People:** Can the QSS "drag someone through"? **The Premise Likely Says No.** Each individual's continuity is tied to *their own* quantum states surviving. Your mate survived the Imperial physics program; they know decoherence. The entanglement required for two consciousnesses to *reliably* survive together across multiple lethal quantum branches is physically implausible and narratively chaotic. It turns into a different story (about linked consciousness). The procedure flags this under Rule 1 (Whose Head?) and Rule 4 (Witness Barrier) - the other person, from *their own perspective*, should experience death when the QSS does in the probable branches. Showing them surviving repeatedly *only* alongside the QSS breaks the premise. **Rewrite:** If she tries to drag someone through, show it *failing* catastrophically from her POV (they die gruesomely in her survival branch) to reinforce the rules and the isolation.

  **The Core Takeaway:** Your premise is a brutal narrative constraint engine. The QSIC forces you to constantly ask: "Whose eyes see this? What reality are *they* in *right now*? What scars do they carry? What does the world tell them is true?" Sticking to it will create the intense, dissonant, existentially fraught novel this premise promises. Kill the darling chapters that break it. The power is in the relentless, costly survival, not in cheating the rules for momentary ease. Now go write the honest, terrifying, magnificent version.
