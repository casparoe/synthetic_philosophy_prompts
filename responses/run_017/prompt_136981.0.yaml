prompt: |-
  I have kept the issue tracker for a medium-sized open-source project for about fifteen years, and I have become preoccupied by one word in it: "same". Whether two reports are "the same bug" decides what gets merged, what gets closed as a duplicate, which release notes say "fixed", and who gets the credit. Everyone on the team makes these calls dozens of times a week, and we nearly always make them without hesitation. What interests me is that we do not make them by a rule, and that the reason we give changes from case to case.

  Three cases from the past year. (1) Two users report a crash with different messages and different stack traces; a week of digging shows both come from one unguarded null. Nobody argues: same bug. (2) Two users report byte-identical wrong output from unrelated causes, one a rounding error in the backend and one a caching fault in the client. We insist these are not the same bug, and we are genuinely puzzled by a newcomer who says they obviously are, since they look identical from the user's chair. (3) A single root cause produces two symptoms needing two different fixes, in two subsystems owned by two different people. Here the team splits and stays split: half of us say one bug with two faces, half say two bugs with one ancestor.

  I have read a little philosophy, so let me head off the easy answers. This does not feel like vagueness: there are no heaps, no "sort of the same", no sense of a borderline. In each case every competent person has a confident view, and where we differ we differ confidently and at length. It does not feel like ambiguity either: nobody hears two senses of "same bug" and picks one. We resist the suggestion that we are picking at all, and say things like "no, really, those are the same bug". A friend who does philosophy rattled off some candidates — vagueness, polysemy, family resemblance, open texture, cluster concepts — and none seemed to me to be quite it, though I could not say why. The cases are not held together by overlapping features; they are held together by a story about causes and fixes, and the people who know the causes beat the people who know the symptoms.

  Three further things make me think this is a phenomenon of its own.

  First, the shifts are graded, and the grading is shared. Some re-identifications are accepted the moment they are proposed; others are argued over for months; and this ordering is stable across our team and, as far as I can tell, across projects. What marks a good triager is not refusing to shift but shifting by the right amount: the pedant who splits everything and the enthusiast who merges everything are both criticised, and criticised in the same words.

  Second, the relation is not transitive, and our repairs for that are lopsided. It is common to have A the same as B, B the same as C, and A not the same as C. Repairing it by merging, we say "we were wrong about that"; repairing it by splitting, we say "it turned out to be two things after all". One direction is confessing an error, the other is reporting a discovery — as if the relation were at once stipulated and found. I have never seen that asymmetry discussed.

  Third, every attempt to write the policy down fails in the same way. "Same root cause, same issue" and "same user-visible failure, same issue" each handle the routine cases perfectly, and each misfires precisely where the shifting was doing the work — and systematically, not accidentally: the cases the rule gets wrong are exactly the cases we would have argued about.

  So: is there an established concept for this? I have taken to calling it "negotiated identity" in my own notes, which I am sure is wrong, if only because none of us experiences it as a negotiation. I am after the carving rather than a label: what exactly the phenomenon is; how it differs from each of its nearest neighbours; which of them, if any, it really is; and where its edges lie, including whether it shows that nothing here was ever strictly the same. If nothing established fits, please coin a term, define it tightly enough that I could decide whether a new case falls under it, and give me the boundary cases where it should not be applied. I am not after a reading list or citations — I want the distinctions. I shall be circulating the answer to my team, whose house style is American, so please write it in American English.
reasoning: |-
  Okay, the user has been managing an open-source issue tracker for 15 years and is fixated on the concept of "sameness" in bug reports. They've presented three distinct cases where their team judges whether bugs are the same or not, and these judgments affect merging, closing duplicates, release notes, and crediting contributors. 

  The user is clearly frustrated with philosophical answers they've encountered before—vagueness, polysemy, family resemblance—none of which seem to capture their experience. They emphasize that their team makes confident, non-negotiated judgments that feel objective, yet the criteria shift case by case. 

  Three key observations stand out: 
  First, the team has a shared, graded sense of when to merge/split bug reports—some decisions are instant, others debated for months. A good triager knows how much to shift their judgment, neither too pedantic nor too enthusiastic. 

  Second, the sameness relation isn't transitive (A=B, B=C, but A≠C), and repairs feel asymmetrical: merging admits error ("we were wrong"), while splitting feels like discovery ("it turned out"). 

  Third, formal policies like "same root cause" or "same user symptom" fail systematically—they handle routine cases but break exactly where nuanced judgment was needed. 

  The user wants a precise conceptual framework—not just a label—that explains this phenomenon's boundaries and how it differs from adjacent ideas. They plan to share this with their team, so clarity is crucial. 

  Hmm... this feels like a deep problem about how practitioners in technical fields construct operational definitions. The team isn't debating philosophy—they're solving practical problems: How to allocate fixes? How to credit work? How to document resolutions? The "sameness" judgment serves those goals. 

  The asymmetry in repairing non-transitivity is telling. When merging after an "A≠C" conflict, they frame it as correcting a past mistake (retrospective error). When splitting, it's a discovery (new information). This suggests sameness isn't a property but a purpose-driven verdict. 

  The grading of decisions is also revealing. Instant agreement likely happens when evidence overwhelmingly serves all practical goals (fixing, crediting, etc.). Debate arises when goals conflict—e.g., one fix might resolve two symptoms (efficient!) but misattribute credit if different developers fixed subsystems. 

  A rigid "root cause" rule would break when one cause spawns distinct fixes needing separate credit. A "user symptom" rule would mislead when identical failures need different fixes. The team's shifting criteria balance these trade-offs dynamically. 

  Existing terms like "pragmatic identity" or "functional equivalence" don't quite fit—they're too broad. This is specifically about *problem individuation* in collaborative technical work. The closest might be "teleological individuation" (defining entities by purpose), but that's jargon-heavy. 

  Perhaps "resolution-contextual identity"? Too clumsy. The core is that sameness is a verdict answering: "Does treating these as one serve our goals here?" The goals include: 
  - Fix efficiency (one fix? merge!) 
  - Credit accuracy (different devs? split!) 
  - User clarity (same symptom? merge release notes!) 

  But the user dislikes "negotiated"—it implies deliberation, whereas their team feels it's objective. Yet the objectivity emerges from shared context, expertise, and goals. 

  Maybe "operational unity"? Defined as: two reports describe the same operational bug if and only if, given current knowledge, they can be resolved through identical actions (fixes, credits, documentation) without practical conflicts. 

  Boundaries: 
  - Would NOT apply if goals aren't shared (e.g., user vs. dev perspective) 
  - Breaks if practical constraints change (e.g., fix A works for both symptoms but is too risky) 
  - Explicitly non-transitive by design 

  Cases: 
  1. Different crashes from one null? Same operational unity: one fix, one credit, clear release note. 
  2. Same output from different causes? Different operational unity: different fixes, different credits. 
  3. One cause, two fixes? No operational unity: conflicting credits/documentation needs. 

  This frames the asymmetry: merging corrects an operational error ("we thought one fix sufficed"); splitting updates operational scope ("new fix needed"). 

  The grading reflects confidence in operational alignment. Pedants/enhusiasts fail by ignoring context—one over-splits (creating redundant actions), one over-merges (causing credit/fix conflicts). 

  Would this satisfy the user? It captures the practicality, the goal-dependence, and the asymmetry. But I'll need to craft it clearly for their team...
answer: |-
  Your phenomenon is neither vagueness nor ambiguity, but **teleological individuation**—the practice of defining "sameness" by the *purpose* it serves within a specific problem-solving context. Below is a distilled analysis, defining the concept, its boundaries, and distinctions from neighboring ideas.

  ### Core Concept: Teleological Individuation  
  **Definition**: Two bug reports describe "the same bug" iff treating them as identical *optimizes practical outcomes* for the project’s goals (fixing efficiently, attributing credit accurately, documenting clearly). This is not negotiated consciously but determined by:  
  1. **Causal resolution**: Can one fix resolve both?  
  2. **Credit assignment**: Does merging fairly attribute work?  
  3. **User impact**: Does splitting confuse users or release notes?  
  The "sameness" verdict is a *verdict* about operational efficiency, not a property of the bugs themselves.  

  ### How It Explains Your Cases  
  1. **Null-pointer crash**: One fix resolves both → *Same bug* (maximizes fix efficiency).  
  2. **Identical output, different causes**: Different fixes/credits needed → *Different bugs* (merging misattributes credit and misleads future debugging).  
  3. **One cause, two fixes/subsystems**: Conflict between causal unity (one root) and operational needs (two credits/fixes) → *Irresolvable split* (goals of credit accuracy vs. fix efficiency clash).  

  ### Key Distinctions from Other Concepts  
  | Concept          | Why It Doesn’t Fit                     | How Teleological Individuation Differs                     |  
  |------------------|----------------------------------------|-----------------------------------------------------------|  
  | Vagueness        | No borderline cases; decisions are crisp | Decisions are sharp but *goal-dependent*, not uncertain. |  
  | Ambiguity        | No multiple meanings; "same" is univocal | "Same" has one meaning: *operational equivalence*. |  
  | Family Resemblance | No overlapping features; causal story dominates | Sameness hinges on functional outcomes, not shared traits. |  
  | Social Construction | Not negotiated; feels discovered | Emerges from shared technical goals, not debate. |  
  | Pragmatic Identity | Too broad; lacks your asymmetry | Tightly scoped to *problem-solving efficiency*. |  

  ### Boundary Cases: When Does It Apply?  
  **Apply**:  
  - Technical systems with clear goals (fixing, crediting, documenting).  
  - Teams sharing expertise and objectives.  
  - Where root cause and symptoms are traceable.  
  **Do Not Apply**:  
  - Subjective domains (e.g., art criticism).  
  - Contexts without shared goals (e.g., users vs. developers debating "sameness").  
  - When causal links are untestable (e.g., theoretical bugs).  

  ### Grading, Non-Transitivity, and Policy Failures Explained  
  - **Graded shifts**: Confidence scales with *goal alignment*. If one fix clearly resolves both reports → instant merge. If credit/fix goals conflict → debate.  
  - **Non-transitivity asymmetry**:  
    - *Merging* A/C after A=B/B=C admits *error*: "We misjudged operational unity."  
    - *Splitting* A/C reports *discovery*: "New info shows distinct fixes needed."  
    This asymmetry arises because sameness is a *forward-looking tool* for action.  
  - **Policy failures**: Rules like "same cause" fail when they conflict with credit or documentation goals (e.g., your Case 3). Rules ignore the teleological flexibility your team uses to balance competing needs.  

  ### Why "Negotiated Identity" Fails  
  No negotiation occurs because verdicts feel compelled by system constraints (e.g., "This *must* be one bug—one fix covers both"). Teleological individuation is experienced as *recognition of operational necessity*.  

  ### Is This "Strict" Sameness?  
  Nothing here is "strictly" the same in a metaphysical sense. Sameness is a *practical verdict* that:  
  - Reduces redundant work.  
  - Ensures fair credit.  
  - Communicates fixes unambiguously.  
  It is "real" only within the project’s problem-solving framework.  

  ### Coined Term: **Resolution Contextuality**  
  **Definition**: Two reports are contextually identical under resolution iff:  
  - They are resolvable by identical actions (fix, credit, documentation);  
  - Treating them as distinct creates inefficiencies (e.g., duplicate work) or inaccuracies (e.g., misattribution);  
  - Available evidence supports the verdict *without goal conflict*.  

  **Test for New Cases**:  
  1. Would one fix resolve all reports?  
  2. Would merging fairly credit involved contributors?  
  3. Would splitting confuse users or release notes?  
  *If all answers align*, sameness is uncontested. *If answers conflict*, expect debate.  

  ---  
  This framework makes explicit what your team intuitively knows: "Same bug" is a statement about *how to act*, not about the bugs themselves. It explains your asymmetry, grading, and rule failures—and why philosophers’ stock answers fell short. Share this verbatim with your team; it’s in American English and cuts to the practical heart of your 15-year puzzle.
