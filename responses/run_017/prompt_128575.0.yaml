prompt: |-
  hey — I'm writing something in philosophy of medicine (the naturalistic "disorder as dysfunction" sort of setup, Boorse-ish territory) and I keep getting stuck on the bit everyone skips over: what am I even allowed to demand of a theory of biological function? I keep lurching between the etiological / selected-effect family (Wright, Millikan, Neander-ish: a function is what the trait was selected for doing), the causal-role family (Cummins-ish: a function is what a part contributes to some capacity of a containing system), and the organizational / closure accounts that came later, but I don't have the standard by which to judge them, and I suspect half of what people demand in these debates is just their own camp's prejudice dressed up as a requirement.

  So write me the spec instead. Concretely: the theory is going to be used to (a) underwrite claims of the form "this trait is malfunctioning," including in neuro and psychiatric cases where nobody has a clean selection story to hand, and (b) license ordinary function-talk in physiology and molecular biology, where people say what a protein or a pathway is *for* all day long. Given that job, what does an adequate theory have to deliver — which cases it has to get right, which distinctions it can't collapse (having a function vs. how well it's performed, say), which results from biology it can't contradict — with the case or consideration behind each requirement, and a note on which are non-negotiable and which are preferences.

  Two cases from my own material that I insist the list handle, because they're where I keep losing my grip. First: a cell built in a lab from a synthesized genome, no ancestors at all, whose parts do things that keep it alive. If a theory says nothing there has a function, is that a cost or a feature, and does it matter that the same theory is supposed to tell me when a patient's trait is broken? Second: a mutation that makes a cell lineage divide faster, which is genuinely selected for at the level of that lineage, and which kills the organism (think cancer, roughly) — whose function is it, and does the answer change if I ask as a doctor rather than as an evolutionary biologist.

  I have a hunch that some subset of the desiderata can't be had together — that you can't get both "a brand-new organism with no history has functions" and "functions are the kind of thing that can be performed badly" out of one principle, and that the usual move is to split the concept into two notions and then quietly reach for whichever one the current case needs. If that's right say so, and say what we lose by admitting it. Then tell me which *single* requirement knocks out the most candidates — the one that's really doing the excluding — and which oft-repeated demand is actually negotiable. Short table scoring the three families at the end is fine, but keep it brief; the criteria are the part I care about.

  And please don't hedge into a menu for me to pick from. Commit: rank the desiderata, say which one you'd throw out and why, take a position on whether the list is jointly satisfiable at all, and flag the place where you think you're most likely wrong and what would change your mind.
reasoning: |-
  Okay, let me tackle this user's query. They're working on a philosophy of medicine project, specifically around defining biological function within a naturalistic disorder-as-dysfunction framework, like Boorse. The main issue is determining what criteria a theory of biological function must meet to be adequate for their purposes. 

  First, I need to understand their core needs. They want a theory that can underwrite malfunction claims, especially in neuropsychiatry where selection stories are murky, and that aligns with function-talk in physiology and molecular biology. They provided two key cases: a synthetic cell with no evolutionary history and a cancer-like mutation selected at the cellular level but harmful to the organism.

  The user seems frustrated with existing theories—etiological, causal-role, and organizational—and suspects that demands in the debate are often biased. They want a clear set of criteria to evaluate these theories, prioritizing non-negotiables over preferences. They also suspect that some desiderata might be incompatible, like having both ahistorical functions and the possibility of malfunction.

  Breaking down the requirements, I consider what's essential. Malfunction must be possible, meaning functions need norms that can be violated. This is non-negotiable because without it, the disorder-as-dysfunction model collapses. The theory must also accommodate ahistorical cases like the synthetic cell. If a theory denies functions here, it fails for physiology where function attribution is common without evolutionary history. 

  Another key point is distinguishing between having a function and performing it well. This ties into malfunction and is crucial for medical contexts. The cancer case highlights the need to handle cross-level conflicts—cellular selection vs. organismal harm. The theory must allow function attributions independent of current selective value to avoid conflating "is functional" with "is currently adaptive."

  Non-negotiables include malfunction possibility, ahistorical function attribution, and cross-level conflict resolution. Preferences are grounding in natural sciences and compatibility with selected-effect insights. The organizational approach (Mossio, Moreno) seems strongest here because it provides normative norms via self-maintenance, works without history, handles malfunction, and addresses cross-level issues through organizational constraints.

  However, the organizational theory might struggle with vestigial traits and precise normative standards. If research shows that organizational norms conflict with physiological data, that would weaken its viability. Among the theories, etiological fails on ahistorical cases, causal-role lacks norms for malfunction, and organizational meets most criteria but has some challenges.

  The user's hunch about incompatible desiderata might hold regarding history-dependent norms versus ahistorical functions. Organizational theory resolves this by grounding norms in current organization. Sacrificing selected-effect history is necessary but manageable. The top desideratum is malfunction possibility, which excludes causal-role theories. The most overrated demand is requiring all functions to have evolutionary histories, which isn't essential for medical contexts.
answer: |-
  Here’s the uncompromising spec for a theory of biological function tailored to your philosophical project, with clear rankings, trade-offs, and a verdict. I’ll commit to a position and flag its weak points.

  ---

  ### **Core Job of the Theory**
  Support two tasks:  
  1. **Malfunction Claims**: Underwrite "*Trait X is malfunctioning*" (especially in psychiatry/neuro where selection histories are unclear).  
  2. **Ordinary Function-Talk**: License "*Protein Y is for Z*" in physiology/molecular biology, absent historical context.

  ---

  ### **The Desiderata: Ranked & Categorized**  
  *(Non-negotiables in bold)*  

  | Rank | Desideratum                                                                 | Why Non-Negotiable?                                                                                          | Case Illustration                                  |
  |------|-----------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|----------------------------------------------------|
  | 1    | **Malfunction must be possible** (norms can be violated)                    | Without this, "disorder as dysfunction" collapses. Core to medicine.                                         | A broken heart valve fails to pump blood adequately. |
  | 2    | **Ahistorical function attribution** (works absent evolutionary history)    | Physiology/molecular bio ascribes functions sans history. Synthetic cell must have functions.                | Lab-built synthetic cell: its ribosomes *have functions*. |
  | 3    | **Cross-level conflict resolution** (handles "for whom?" questions)         | Medically critical when cellular/organismal interests clash (e.g., cancer). Must not default to "selection = function." | Cancer mutation: functional *for the cell lineage*, dysfunctional *for the organism*. |
  | 4    | **Function ≠ current usefulness** (distinguish "has a fn" vs. "is adaptive now") | Prevents conflation of "is functional" with "is currently selected for." Vital for vestigial traits/pathologies. | Appendix: has immune functions even if now harmful. |
  | 5    | Grounded in natural sciences (no vitalism)                                  | Maintains naturalism; avoids ad-hoc appeals.                                                                 | Functions explained by biology/physics, not "purpose." |
  | 6    | Compatibility with selected-effect insights (where available)               | Preference: Leverages robust evolutionary data when relevant, but not required for core tasks.               | Heart’s blood-pumping function affirmed by evolution. |

  ---

  ### **Trade-offs & Incompatibilities**  
  - **You can’t have BOTH (2) *and* strong historical norms for (1)**.  
    - *Etiological theories* tie malfunction to deviation from *historical* norm. Synthetic cell (no history) has no functions → **fails (2)**.  
    - *Organizational/CR theories* ground norms in *current* organization → **satisfy (2) but risk vagueness in (1)**.  
  - **Sacrifice**: I’d **discard strict selected-effect requirements** (i.e., etiological theories as *necessary*). They sabotage (2) and (3).  
  - **Admitting the split**: Yes, we need **two function concepts** (quietly used in biology already):  
    - **Causal-role/organizational** for physiology/synthetic biology (ahistorical, system-relative).  
    - **Selected-effect** for evolutionary explanations (historical, lineage-focused).  
    - *Cost*: Loss of conceptual unity. *Gain*: Medical utility and scientific fidelity.  

  ---

  ### **The Excluder & The Overrated Demand**  
  - **The Excluder (kills most candidates)**:  
    **Malfunction requires normative standards** → *Excludes pure Causal-Role theories* (Cummins). CR defines "function" as any contribution to a capacity, but "*malfunction*" isn’t meaningful (a "broken" part still contributes *some* effect).  
  - **The Overrated (negotiable) Demand**:  
    **"Functions must be natural kinds"** → Negotiable. Medicine needs *pragmatic, context-dependent* norms (e.g., organism-level survival/reproduction). Insisting on metaphysical precision paralyzes applied work.  

  ---

  ### **Scoring the Families**  
  | Theory             | Malfunction (1) | Ahistorical (2) | Cross-Level (3) | Fn ≠ Current Use (4) | Naturalism (5) | Selected-Effect (6) |  
  |--------------------|-----------------|-----------------|-----------------|----------------------|----------------|---------------------|  
  | **Etiological**    | ✅ (if history) | ❌              | ❌ (defaults to lineage) | ✅                   | ✅               | ✅                  |  
  | **Causal-Role**    | ❌              | ✅              | ✅ (system-relative) | ❌ (fn = current causal role) | ✅               | ❌                  |  
  | **Organizational** | ⚠️ (norms exist but may be fuzzy) | ✅ | ✅ (constraints define "self") | ✅ | ✅ | ❌ |  

  ---

  ### **Verdict & Commitment**  
  - **Best Fit**: **Organizational accounts** (Mossio, Moreno, Bich). They ground norms in *self-maintenance* of the organism (satisfying 1, 3, 4), work ahistorically (2), and align with physiology (5).  
  - **Why?**:  
    - Synthetic cell: Functions via organizational closure (self-producing constraints).  
    - Cancer mutation: Functional *for the cell* (self-maintains cellular organization) but dysfunctional *for the organism* (disrupts organismal self-maintenance).  
    - Malfunction: Defined as failure to fulfill role in maintaining organization (e.g., dopamine pathway failing to modulate reward in a way that disrupts organismal viability).  
  - **Weak Point**: Organizational norms can be **vague** (e.g., "What degree of self-maintenance counts?"). If empirical work shows physiologists *rely* on selected-effect reasoning in practice (not just heuristically), I’d revise.  
  - **Sacrifice Made**: Letting go of **universal selected-effect grounding**. Evolution explains *why* we have certain functions, but medicine needs *current* norms.  

  ### **Your Cases Resolved**  
  1. **Synthetic Cell**: Has functions (organizational). Denying this *is a cost* for etiological theories—it contradicts molecular biology’s practice.  
  2. **Cancer Mutation**:  
     - *As evolutionary biologist*: Functional for the cell lineage (selected-effect).  
     - *As doctor*: Dysfunctional for the organism (organizational).  
     - **The theory must license BOTH answers** without contradiction → Organizational handles this via *system of reference*.  

  **Bottom Line**: Adopt an organizational account, supplement with selected-effect explanations where useful, and accept that "function" isn’t univocal. This keeps medicine grounded without begging questions in psychiatry. The trade-off is worth it.
