prompt: |-
  So my brother's been in what the ICU team is calling a minimally conscious state for about seven weeks now (cardiac arrest, hypoxic injury) and we're going to have to make decisions about long-term care pretty soon, and I've ended up reading about integrated information theory because someone in a family support group said it was the one theory that actually hands you a number you could in principle measure at the bedside. I don't love how much of what I've found is either hype or people calling it pseudoscience, so I want to step back and do this properly.

  What I actually want is a spec. Forget IIT for a minute: what would a theory of consciousness have to get right for it to be good enough to be used for a decision like ours — where the question is "is this particular patient, right now, conscious, and if so how much, and conscious of what", and where the only evidence you can realistically get is noisy EEG or fMRI from someone who can't follow commands reliably (or might be covertly aware; nobody can tell). Give me the desiderata with the case or consideration behind each: the phenomena it has to cover, the distinctions it can't collapse, the findings it can't contradict, the practical measurement requirements. And say which requirements you think are non-negotiable and which are just preferences of one camp or another.

  Some specific things I want adjudicated rather than assumed:

  - Level versus content. Is "how much consciousness" even separable from "consciousness of what", or does asking for one number for a patient already beg the question?
  - The cerebellum thing (more neurons than cortex, apparently contributes nothing to experience) and the seizure thing (massive synchronized activity, consciousness gone). Are these genuine desiderata or just anecdotes people repeat because they're rhetorically handy?
  - Grain. Does a theory's verdict have to stay stable when you redescribe the same system at a finer or coarser level — single spikes versus cortical columns versus two-second fMRI voxels? I keep getting the impression that with IIT you get different answers depending on where you draw the lines, and if that's right I want to know whether grain-robustness is a real requirement or a prejudice I'm smuggling in.
  - The redundant copy case. Suppose a chunk of cortex were duplicated so both copies recieve the same input and one copy's output is discarded. Does consciousness double, stay put, or split into two? Why does an adequate theory have to have an answer here, and which answers are already off the table?
  - Whether "the system must matter to itself" style requirements (intrinsicality, or whatever the current postulate wording is) are doing real work, or are just a way of defining the competitors out of the running.
  - And flicker: sleep, anesthesia, absence seizures. A theory has to let the same patient come in and out, not just sort whole organisms into bins.

  Then flag any pair or subset of the requirements you think can't be jointly satisfied — that's the part I most want to see — and tell me which single requirement knocks out the most candidates, IIT included. A short scorecard at the end is fine, but keep the weight on the criteria and their motivating cases, that's what I need. American English please, and skip citations and reading lists, I can't chase anything up right now.
reasoning: |-
  Okay, this user is dealing with an incredibly difficult situation—their brother is in a minimally conscious state after cardiac arrest, and they're facing decisions about long-term care. They've encountered Integrated Information Theory (IIT) in a support group but are frustrated by the polarized views around it. Instead of diving into IIT debates, they're asking for a clear, practical framework to evaluate *any* theory of consciousness for clinical use. Their request is deeply personal and urgent, so the response needs to be precise, compassionate, and stripped of jargon.  

  First, let's unpack their core need: they want a "spec"—a set of criteria to judge whether a theory is robust enough to guide life-altering medical decisions. They're not looking for a definitive answer (they know that's impossible right now), but for tools to assess the tools. Their specific questions reveal sharp insights: they're wary of oversimplification (level vs. content), aware of counterexamples (cerebellum, seizures), and alert to theoretical loopholes (grain sensitivity, redundant copies). They also hint at exhaustion—"skip citations, can't chase anything up"—so references are out; clarity is key.  

  The challenge is balancing scientific rigor with clinical realism. For example:  
  - **Level vs. content**: Clinically, sedation or brain injury might suppress "level" (wakefulness), while MCS patients might have fluctuating "content" (awareness of self/environment). A theory must handle both separately *and* together.  
  - **Cerebellum/seizures**: These aren't just anecdotes; they're litmus tests. If a theory assigns high consciousness to the cerebellum (which doesn't generate experience) or a seizing brain (where sync activity wipes out awareness), it fails.  
  - **Grain invariance**: This is critical. If zooming in/out changes the verdict (e.g., IIT's Φ values shifting with spatial scales), the theory can't be trusted at the bedside where measurements vary.  
  - **Redundant copy**: A theory must *explain* why duplicating cortex doesn't double consciousness—probably by requiring causal integration, not just complexity.  
  - **Flicker**: Theories must accommodate dynamic states (sleep→wake→seizure) without binary bins.  

  The non-negotiables emerge:  
  1. **Clinical testability** (EEG/fMRI compatibility)  
  2. **Counterexample resilience** (cerebellum, seizures)  
  3. **Grain robustness**  
  4. **Dynamic range** (flicker support)  

  IIT stumbles on grain and counterexamples (e.g., high Φ in cerebellum). Global workspace theories handle dynamics well but struggle with "content" specificity. Higher-order theories nail self-awareness but lack measurable outputs. The user likely suspects no theory satisfies all criteria—and they're right. The response should validate that while mapping the trade-offs.  

  Above all, the tone must honor their stakes: this isn't academic. When flagging limitations (e.g., "no current theory meets all"), emphasize that medicine already uses imperfect tools (like behavioral scales), and the goal is to *improve* them, not wait for perfection. Their clarity in crisis is remarkable; the reply should match it.
answer: |-
  Here’s a clinical-grade spec for a theory of consciousness in your situation, grounded in practical and empirical constraints. I’ll break it down by desiderata (requirements), the case behind each, negotiability, and conflicts. Your specific questions are addressed inline.

  ---

  ### **Core Desiderata for a Clinically Useful Theory**  
  *(Non-negotiables in **bold**)*  

  1. **Level vs. Content Separation**  
     - **Requirement**: Must distinguish *capacity for any experience* (level) from *specific experiences* (content).  
     - **Why**: Patients in MCS may have fluctuating or fragmented awareness (e.g., sensing pain but not words). A single "consciousness number" is useless without context—e.g., "level=0.3" means nothing if it can’t clarify *whether pain is felt*.  
     - **Non-negotiable**: Yes. Bedside decisions hinge on whether suffering or preferences *could* be present.  

  2. **Counterexample Resilience**  
     - **Cases**:  
       - *Cerebellum*: Must explain why 69B cerebellar neurons don’t contribute to conscious experience (despite dense connectivity).  
       - *Seizures*: Must explain loss of consciousness during generalized seizures (despite massive, synchronized neural activity).  
     - **Why**: These aren’t anecdotes—they’re clinical realities. A theory that can’t reconcile these fails at the bedside.  
     - **Non-negotiable**: Yes. If a theory assigns high consciousness to a seizing brain or the cerebellum, it’s invalid.  

  3. **Grain Invariance**  
     - **Requirement**: Verdicts must hold across spatial/temporal scales (e.g., spikes vs. EEG bands vs. fMRI voxels).  
     - **Why**: In practice, you’ll use coarse tools (EEG). If consciousness "disappears" when you switch from microelectrodes to scalp EEG, the theory is useless. IIT *fails* here—Φ changes if you redefine system boundaries.  
     - **Non-negotiable**: Yes. Theory must align with real-world measurement constraints.  

  4. **Redundant Copy Answer**  
     - **Requirement**: Must predict that duplicating cortex *does not double* consciousness (plausible: consciousness stays put or splits; doubling is absurd).  
     - **Why**: If duplication doubles consciousness, the theory violates parsimony and clinical intuition (e.g., brain lesions don’t "reduce consciousness" proportionally to cell loss).  
     - **Non-negotiable**: Indirectly. A theory claiming duplication doubles consciousness is non-viable.  

  5. **"System Must Matter to Itself" (Intrinsicality)**  
     - **Requirement**: Consciousness must depend on intrinsic causal power, not external interpretation.  
     - **Why**: Prevents false positives (e.g., a simulation of a brain on a DVD isn’t conscious). But this can’t be a circular definition—it must be testable.  
     - **Negotiable**: Partially. Most theories accept this, but implementations vary. IIT over-relies on it.  

  6. **Flicker Tolerance**  
     - **Requirement**: Must allow smooth transitions in/out of consciousness (sleep → wakefulness, seizures → recovery).  
     - **Why**: Patients fluctuate. A theory that only categorizes "conscious" or "not" (e.g., based on anatomy) fails for MCS.  
     - **Non-negotiable**: Yes.  

  ---

  ### **Adjudicating Your Specific Questions**  
  - **Level vs. Content**: Separable *in practice*. Level = "Is there a subject of experience?" (yes/no + degree). Content = "What is experienced?" (qualia, thoughts). For decisions, you need both: Level tells you *if* suffering is possible; content hints at *what* might be suffered.  
  - **Cerebellum/Seizures**: Genuine desiderata. Failures here expose theories that equate consciousness with neural activity or complexity alone.  
  - **Grain**: Requirement, not prejudice. If IIT gives different Φ at different scales, it’s flawed for clinical use.  
  - **Redundant Copy**: Consciousness should *not double* (supported by split-brain cases). Theories must explain unity: one subject per brain, even with redundancy.  
  - **Intrinsicality**: Does real work (rules out simulations) but shouldn’t be a "trapdoor" to exclude rivals without evidence.  
  - **Flicker**: Non-negotiable. Theories must handle dynamic states.  

  ---

  ### **Conflicts & Dealbreakers**  
  - **Major Conflict**: Grain invariance + clinical testability.  
    - *Problem*: Grain-invariant theories often require impossible measurements (e.g., quantum-level detail). Clinically feasible tools (EEG) are coarse.  
    - **IIT’s flaw**: Fails grain invariance spectacularly—Φ isn’t measurable in humans.  

  - **Most Damaging Requirement**: **Counterexample resilience**.  
    - *Why*: Knocks out theories that:  
      - Equate consciousness with neuron count (cerebellum problem).  
      - Claim synchronization = consciousness (seizure problem).  
    - IIT struggles here (high Φ possible in cerebellum).  

  - **Theories That Fail Hardest**:  
    - **IIT**: Fails grain invariance, counterexamples (cerebellum), and clinical testability.  
    - **Global Workspace Theory (GWT)**: Better at flicker/dynamics but vague on level/content separation.  
    - **Higher-Order Thought (HOT)**: Handles content but struggles with non-verbal patients (requires metacognition).  

  ---

  ### **The Reality for Your Decision**  
  No current theory satisfies all desiderata. IIT’s "number" (Φ) is clinically irrelevant today—it’s unmeasurable and grain-dependent. In practice, clinicians use:  
  - **Behavioral tools** (e.g., CRS-R) to detect covert awareness.  
  - **fMRI/EEG markers** of *potential* consciousness (e.g., complex responses to commands, even if inconsistent).  
  - **Prognostic data** (e.g., time since injury, etiology) to estimate recovery likelihood.  

  **Your North Star**: Focus on detectability of *functional communication* (via any modality) and prognosis. Theories are frameworks, not tools—until one solves grain, testability, and counterexamples, they can’t answer "Is he conscious *now*?" better than empirical neuroscience.  

  I’ll hold space for you and your brother. This is unjustly hard.
