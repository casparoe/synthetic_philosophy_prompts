  - Fudges: "bit" implies classical (ok for pub context). "Door" as atom-scale mechanism is poetic but valid. 
  - Voice: Demon’s perspective, weary but cunning. Lines like "I tally what it cost" show agency. 

  Notes will clarify: 
  - Measurement: Line 1 ("no cost") + note on unitary ops. 
  - Erasure: Line 23 ("kT ln 2") + Landauer’s principle. 
