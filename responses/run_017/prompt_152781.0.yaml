answer: |-
  Here is a case built to your specifications, followed by analysis addressing your core questions. I'll mark reconstructions/improvizations clearly and note where positions diverge in the literature.

  ---

  ### The Case: Workshop Tool Protocol
  **Setting:** A small woodworking workshop. Lena (competent supervisor) trains a new apprentice, Sam, on tool maintenance. She demonstrates cleaning chisels after use:  
  1. Scrape off dried resin or pitch with a *stiff metal scraper*.  
  2. Wipe the blade with a *linseed oil rag*.  
  She emphasizes: **"Always use the metal scraper first if there’s hardened gunk. Never skip to the oil rag—it gums up the blade."**  

  Sam follows this for months on tools with *dried resin/pitch*. One day, a chisel has **dried paint splatter** (a novel case). Sam hesitates: hardened paint resembles resin but isn’t identical. Lena is called over. She pauses, then says: **"Hmm... I suppose either the scraper or the rag would work here. Just don’t use water."**  

  **Candidate Rules:**  
  - **R1:** *Remove hardened organic residues first with metal scraper.* (Targets plant-based gunk: resin/pitch).  
  - **R2:** *Remove hardened non-water-soluble deposits first with metal scraper.* (Targets anything insoluble and hard: resin, pitch, paint, glue).  

  Both rules:  
  - Agree on *all* past cases (resin/pitch).  
  - Are natural in context (R1 focuses on workshop’s common materials; R2 on functional solubility).  
  - Are self-consciously adoptable (Lena could state either).  
  - Lena has now faced a "hard case" (dried paint) and *didn’t resolve the indeterminacy*, calling both acceptable.  

  **Intuitive Datum:** Lena clearly *meant* a specific rule when training Sam. Her initial strictness implies R1 (organic-only) was intended, but her later openness to paint being handled similarly suggests R2. We feel there *must* be a fact about which rule she originally followed.  

  ---

  ### Skeptic’s Argument  
  1. **What the skeptic points at:** Lena’s past behavior (using scraper only on resin/pitch) is consistent with both R1 and R2. Her mental state during training? She might recall intending R1, but memories are just more "interpretations." Her dispositions? She’s disposed to accept R2 for paint *now*, but this doesn’t fix what she meant *then*.  
  2. **Why dispositions/behavior fail:** Dispositions evolve (she’s now open to R2). Past behavior underdetermines the rule (resin/pitch fit both). Her verbal instruction ("hardened gunk") is ambiguous—it could denote organic residues (R1) or any insoluble deposit (R2).  
  3. **Why community fails:** Other workers use R1, but Lena is the trainer. Community norms might favor R1, but Lena’s authority and her later acceptance of R2 undermine this.  
  4. **Conclusion:** There is *no fact* about whether Lena meant R1 or R2 originally. Meaning is indeterminate.  

  ---

  ### Standard Replies  
  **Realist Reply (e.g., McDowell, early Wittgenstein):**  
  - Meaning is primitive. Lena’s original intention *simply was* R1, evidenced by her emphasis on organic residues (resin/pitch) and initial prohibition against shortcuts. The later paint case reflects a *new* decision, not retroactive indeterminacy.  
  - **Does it restore ordinary conviction?** Yes, by fiat: it insists the pre-theoretic intuition ("she meant R1!") is correct. But it offers no *reductive* evidence, treating meaning as sui generis. *(Note: This is reconstructive; realists reject reducibility but offer arguments from phenomenology/normativity.)*  

  **Kripke’s Community View (Assertibility Conditions):**  
  - Meaning is fixed by communal agreement. When Lena said "always use the scraper first," its meaning is what the workshop community *would endorse under scrutiny*. Since the community defaults to R1 but Lena (an authority) accepted R2 for paint, no stable agreement exists. Meaning reduces to "assertibility": we can only say what the community *will accept* as correct, not what Lena "really meant."  
  - **Does it restore ordinary conviction?** No. It replaces "fact" with communal ratification, explaining why we *feel* there’s a fact (via community pressure) but denying it exists independently.  

  ---

  ### Key Feature Carrying Weight  
  **Co-extensiveness of rules in all actual/past cases.**  
  - R1 and R2 *never diverge* in Lena’s history—all gunk encountered was organic *and* insoluble. The paint case *could* have forced divergence, but Lena’s response ("either works") refused to treat it as a test case, preserving co-extensiveness.  
  - **If removed:** If R2 were unnatural (e.g., "remove gunk on Tuesdays"), the paradox vanishes—we’d dismiss it as gerrymandered. If Lena firmly insisted R1 for paint, the rule would be settled. But co-extensiveness sustains indeterminacy even post-hard-case.  

  ---

  ### Strongest Attack on the Weakest Position  
  **Target:** Kripke’s community view.  
  **Attack:** If meaning reduces to communal assertibility, then Lena’s initial instruction had *no determinate content* until the community weighed in on paint. But this clashes with Sam’s training: he learned a rule *before* the paint case. The community view cannot explain how Sam grasped *anything* determinate initially. *(This draws from McDowell’s critique that Kripke dissolves normativity into sociology.)*  

  ---

  ### Answering Your Core Question  
  **Does the paradox generalize beyond arithmetic?**  
  - **Yes**, but with caveats. This case avoids infinite cases, arbitrary cutoffs, and unused instances. The engine is **underdetermination by total evidence**, fueled by co-extensiveness. Arithmetic is a dramatic instance (infinity highlights underdetermination), but your workshop case shows it arises in finite, ordinary practices.  
  - **Finitude’s role:** Your worry about finitude as a "disguised premise" is partially right—but not because finitude *solves* the paradox. Rather, infinity *exposes* underdetermination vividly. In finite contexts, co-extensiveness (R1/R2) or unnoticed indeterminacy (like Lena’s "gunk") can mask it. The skeptic argues this indeterminacy is *always* present, but we only notice in "gap" cases (paint) or infinite domains.  

  **What about co-extensive rules?**  
  - In your "add two" vs. "next even number" example, the skeptic *would* say there’s no fact about which rule is followed. But you’re right: this indeterminacy is **trivially inconsequential** since the rules never diverge. No one should care because practice is identical.  
  - **Contrast with the workshop:** Here, R1/R2 *could* diverge (e.g., if glue appears). Lena’s later acceptance of both for paint makes the indeterminacy matter—it suggests Sam could "correctly" follow either rule going forward. This *practical* consequence makes the paradox bite: it threatens normativity ("What *should* Sam do?") and intentionality ("What did Lena *teach*?").  

  **Conclusion:** The paradox generalizes to any rule where evidence underdetermines between natural candidates, but its significance depends on whether the rules *could* diverge in practice. Co-extensiveness alone generates indeterminacy, but we only care when divergence is possible (as in your workshop case).  

  ---

  ### Where I’m Reconstructing vs. Reporting  
  - **Reporting:** Skeptic’s argument structure, Kripke’s community view, realist primitivism.  
  - **Reconstructing:** The workshop case (original), attack on community view (inspired by critiques but framed for this example), emphasis on co-extensiveness + divergence potential.  
  - **Your worry:** Legitimate. Finitude isn’t essential; underdetermination is. But co-extensiveness *without divergence potential* makes skepticism toothless—this isn’t always acknowledged in literature. Kripke focuses on cases where divergence *is* possible (e.g., "+"/"quus"), so the "stakes" remain.  

  **Final Honest Answer:** Yes, the paradox generalizes, but its force relies on *possible* (not just actual) divergence. The arithmetical case is paradigmatic because divergence is guaranteed (large numbers), but your workshop shows it arises without infinity. The literature *does* debate this (e.g., Fodor vs. Kripke), but your case demonstrates generalization is plausible.
