answer: |-
  Here is a complete specification of desiderata for a theory of dispositions, structured to meet your requirements. Each desideratum includes its motivation (case/consideration), why it's a requirement (not mere taste), and distinctions it preserves or handles. Non-negotiable requirements (NN) are marked per your purpose. Conflicts and key exclusions are analyzed at the end.

  ---

  ### **Desiderata for a Disposition Theory**  
  *(Purpose: Underwrite special-science explanations/predictions, e.g., "girder failed due to brittleness")*

  | **Desideratum** | **Motivating Case/Consideration** | **Requirement (vs. Taste)** | **Distinctions Preserved/Handled** | **Status** |
  |-----------------|-----------------------------------|----------------------------|------------------------------------|------------|
  | **1. Non-Vacuity** | Dormitive virtue: Ascribing "fragility" must explain *why* breaking occurs, not restate it. | Prevents disposition ascriptions from being explanatorily empty. Necessary for scientific utility. | Genuine disposition vs. accidental regularity. | **NN** |
  | **2. Empirical Checkability** | Scientists test solubility via controlled experiments; must be falsifiable. | Required for evidence-based science. Uncheckable ascriptions (e.g., "fragile only when unobserved") undermine prediction. | Disposition possession vs. manifestation; masks vs. absence. | **NN** |
  | **3. Stimulus-Manifestation Independence** | Reverse-cycle mimic: An object heats when cooled (due to hidden device). It’s not "fragile" despite shattering when struck. | Prevents misclassifying mimics as dispositions. Ensures ascriptions track intrinsic properties. | Genuine disposition vs. extrinsic coincidence; causal basis vs. disposition. | **NN** |
  | **4. Mask/Interference Discrimination** | **Self-healing slab:** Internal repair prevents crack propagation. Net behavior is non-brittle, but microstructure is crack-prone. | Must distinguish whether repair is a *mask* (disposition present), *modification of basis* (disposition altered), or *absence*. Affects explanatory depth. | Mask vs. absence of disposition; enabling condition vs. interferer; disposition vs. causal basis. | **NN** |
  | **5. Partial/Interrupted Manifestations** | **Late fink:** Crack initiates but is reversed before detection. Does fragility manifest? | Explanations reference processes (e.g., "crack propagation began"). Theory must handle partial manifestations without requiring completion. | Manifestation as process vs. outcome; disposition possession vs. successful manifestation. | **NN** |
  | **6. Probabilistic & Degreed Dispositions** | **Chancy fink:** Device prevents breaking 90% of the time when struck. Is the vase still fragile? | Science uses probabilistic ascriptions (e.g., "corrosion-prone"). Theory must grade possession/strength without arbitrary thresholds. | Probabilistic disposition vs. deterministic; disposition degree vs. all-or-nothing. | **NN** |
  | **7. Non-Gerrymandered Ascriptions** | Disposition to "shatter if struck while a demon sneezes" is scientifically useless. | Prevents trivial, infinitely many dispositions. Ascriptions must correspond to projectable properties relevant to laws/explanations. | Single-track vs. multi-track disposition; genuine disposition vs. hyper-specific conditional. | **NN** |
  | **8. Basis Grounding without Collapse/Regress** | Brittleness grounded in atomic lattice, but lattices are described dispositionally (e.g., bond resilience). | Avoids circularity (collapsing disposition to basis) or regress (basis requires further dispositions). Basis must explain *how* disposition is realized. | Disposition vs. causal basis; categorical vs. dispositional properties. | **Preference** |
  | **9. Unmanifested Dispositions** | Radioactive atom decaying in vacuum: never manifests, but still radioactive. | Science ascribes dispositions to unobserved objects (e.g., "virus is airborne-transmissible"). Must allow possession without manifestation. | Possession vs. manifestation; evidence vs. ontology. | **NN** |
  | **10. Process Manifestations** | Ductility: Manifestation is stretching over time, not a binary outcome. | Many special-science dispositions (e.g., "corrosive", "elastic") manifest as processes. Explanations cite ongoing changes. | Manifestation as outcome vs. process; stimulus as trigger vs. sustainer. | **NN** |
  | **11. Higher-Order Dispositions** | Steel that becomes brittle when cooled: disposition to *acquire* fragility. | Needed for explanations like "cooling *made* it brittle". Must not reduce to first-order dispositions. | Disposition to acquire/lose dispositions vs. intrinsic basis. | **NN** |
  | **12. Finks & Antidotes** | Fink: Fragile vase wired to toughen if struck. Antidote: Poison with last-minute blocker. | Tests if theory handles extrinsic prevention *after* stimulus but *before* manifestation. | Fink vs. mask; stimulus vs. manifestation delay. | **Handled via 4,5,6** |
  | **13. Multi-Track Dispositions** | "Fragile": shatters if struck, crumbles if twisted, cracks if cooled rapidly. | Single disposition with multiple stimuli/manifestations. Avoids fragmenting into gerrymandered properties. | Multi-track vs. single-track disposition; unity of causal basis. | **Handled via 7** |

  ---

  ### **Key Analyses & Conflicts**
  1. **Non-Negotiables (NN) vs. Preferences**:  
     - **NN**: Desiderata 1–7, 9–11. These ensure dispositions are *explanatory*, *testable*, and *scientifically usable*.  
     - **Preference**: Desideratum 8 (basis grounding). Theories may differ (e.g., powers vs. categorical bases) without harming explanatory utility.  
     - **Ordinary practice, Humeanism, fundamentality**: Excluded as philosophical tastes. Your purpose doesn’t require them.

  2. **Incompatible Pairs**:  
     - **Partial Manifestations (5) + Non-Gerrymandering (7)**: If partial manifestations count (e.g., "late fink" manifests fragility), gerrymandered "dispositions" for interrupted processes may arise.  
       *Resolution*: Require manifestations to be *natural kinds* (e.g., "crack propagation" not "0.1s of cracking").  
     - **Degreed Dispositions (6) + Sharp Possession Criteria**: Graded dispositions conflict with theories demanding binary possession (e.g., simple conditionals).  
       *Resolution*: Treat dispositions as *threshold-based* (e.g., "fragile if P(break) > 0.5 under stimulus").

  3. **Most Excluding Requirement**:  
     - **Self-healing slab (Desideratum 4)**. Excludes:  
       - *Simple conditionals* (fails: net behavior non-brittle, but disposition present).  
       - *Basis-identity* (fails: basis is "crack-prone", but disposition masked).  
       - Powers theories must clarify if "power" includes internal masks.

  4. **Requirement to Delete as Prejudice**:  
     - **Desideratum 8 (Basis Grounding)**. While desirable, demanding a *non-dispositional* basis risks regress or excludes fundamental dispositions. Your purpose only requires *explanatory depth*, not ontological reduction.

  ---

  ### **Theory Scorecard**  
  *(Against NN Desiderata 1–7,9–11)*

  | **Theory**               | **Fails**                                  | **Passes**                              |
  |--------------------------|--------------------------------------------|-----------------------------------------|
  | **Simple Conditional**   | 4 (self-healing slab), 5 (late fink), 6 (chancy fink) | 1,2,9,10,11 (marginally)          |
  | **Ceteris Paribus Conditional** | 4 (internal masks), 6 (probabilities)      | 1,2,5,9,10,11 (with caveats)       |
  | **Basis-Identity**       | 4 (masked basis), 10 (processes), 11 (higher-order) | 2,6,7,9                       |
  | **Powers/Potentiality**  | 7 (gerrymandering risk), 4 (if powers exclude masks) | 5,6,9,10,11 (strongly)         |
  | **Best Candidate**       | *Multi-track causal role*: Disposition = property contributing to *characteristic manifestations* under stimuli, with basis *realizing* this role. Passes all NN by: <br> - Allowing masks (4), partial man. (5), degrees (6). <br> - Tying ascriptions to scientific kinds (7). <br> - Grounding in basis *role* without regress (8). |

  ---

  ### **Conclusion**
  The list itself reveals tensions: **partial manifestations** (late fink) and **intrinsic masks** (self-healing slab) are the strongest discriminators. A theory must treat dispositions as *causal capacities* whose *exercise* can be interrupted or masked, without requiring net behavior to match the basis. The **non-gerrymandering** constraint forces a focus on *scientifically projectable properties*, excluding "demon sneeze" cases. Desideratum 8 is the only dispensable prejudice. **Powers theories** handle most NN desiderata best but require care to avoid gerrymandering or obscurity; **sophisticated conditional analyses** (e.g., causal Bayes nets) can approximate this with probabilistic stimuli/manifestations.
