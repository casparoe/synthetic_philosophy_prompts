  Most crucially, I must emphasize that desideratum #1 (distinct wrongness) is the master key - it eliminates most mainstream theories immediately by revealing their reducibility. The user was astute to suspect that "binding without benefit" might be contested rather than essential - I'll mark that clearly as a dividing-line commitment. 

  For their essay structure, I'd suggest organizing around desiderata compliance rather than theorists. That approach will showcase their meta-philosophical awareness while directly meeting the marking criteria. The release-power problem (#5) could anchor the original analysis section - it's the user's stated sticking point and remains undertheorized in the literature.
answer: |-
  Here’s a rigorous desiderata list for a theory of promissory obligation, grounded in your concerns. I’ve structured it to distinguish core requirements from contested ones, flagged tensions, and included key test cases. The scorecard for major theories follows.

  ---

  ### **Core Desiderata: What Any Account MUST Explain**  
  *(Non-negotiable; failure here invalidates the theory)*  

  1. **The Distinct Wrongness Requirement**  
     - **What it must get right**: Breaking a promise is *sui generis* — not reducible to lying, causing disappointment, or general unreliability.  
     - **Case**: Breaking a promise *nobody could ever discover* (e.g., secret journal promise). If it’s still wrong despite zero consequences, the wrongness must stem from the promise itself.  
     - **Why essential**: Your core purpose — without this, promising lacks moral uniqueness.  

  2. **The Release Condition**  
     - **What it must get right**: Only the promisee can release the promisor; the promisor cannot self-release, nor can third parties.  
     - **Case**: Promising to attend a friend’s event, then wanting to back out for a better offer. Only your friend’s consent dissolves the obligation.  
     - **Why essential**: Central to promissory phenomenology; distinguishes promises from personal vows or threats.  

  3. **Obligation-Persistence Despite Changed Circumstances**  
     - **What it must get right**: Promises bind even when keeping them is inconvenient, costly, or minimally beneficial.  
     - **Case**: Deathbed promise to care for someone’s sister, who never learns of it and doesn’t want help. Obligation persists despite no apparent "harm" of breaking it.  
     - **Why essential**: Captures the intuition that promises create robust duties beyond instrumental value.  

  ---

  ### **Substantive Desiderata: What a Plausible Account Should Explain**  
  *(Theories may handle these imperfectly, but gaps weaken them)*  

  4. **The Non-Redundancy Problem**  
     - **What it must get right**: Promising to do what you *already owe* (e.g., "I promise not to murder you") creates a *new* obligation.  
     - **Case**: Vowing to repay a debt you morally/legally owe anyway. The promise adds a distinct layer of duty.  
     - **Why important**: Shows promises aren’t merely reminders of existing duties.  

  5. **Minimal Communication Requirement**  
     - **What it must get right**: A promise requires uptake (the promisee must recognize it as a promise), but not necessarily linguistic comprehension.  
     - **Case**: Promising in a language the promisee doesn’t speak, but with clear intent/context (e.g., gestures). Obligation arises if the promisee reasonably understands an undertaking occurred.  
     - **Why important**: Clarifies that promising is a communicative act, but not hyper-linguistic.  

  ---

  ### **Contested Desiderata: What Some Theories Demand (But Others Reject)**  
  *(Flags philosophical divides)*  

  6. **No Detrimental Reliance Needed**  
     - **What it claims**: Promises bind even if the promisee *doesn’t rely* on them or benefit from them.  
     - **Case**: Deathbed promise (as above) — no reliance possible.  
     - **Contested because**: Expectation-based theories (e.g., Scanlon) *require* reliance for obligation. **Your suspicion is correct**: This desideratum excludes instrumentalist accounts.  

  7. **The Wrong Must Be *to Someone***  
     - **What it claims**: Breaking a promise wrongs *the promisee specifically*, not just "the world" or yourself.  
     - **Case**: Secretly breaking a promise — the promisee is wronged even if ignorant.  
     - **Tension**: Pulls against "obligation-persistence" in no-benefit cases. If the promisee isn’t harmed, *how* are they wronged? This is the crux of your worry.  

  ---

  ### **Tensions Between Desiderata**  
  - **#7 (Wrong *to* promisee) vs. #3 (Binding without benefit)**: If keeping a promise benefits no one (or even harms the promisee), how is breaking it a wrong *to them*? Theories must explain the "moral injury" independent of welfare.  
  - **#6 (No reliance needed) vs. Expectation-Based Theories**: Rejecting reliance is a major fault line. Hybrid accounts often fail here.  

  ---

  ### **The Knockout Test: Which Desideratum Does the Most Work?**  
  **#1 (Distinct Wrongness)**. It immediately eliminates:  
  - **Lying-based accounts** (breaking a secret promise isn’t deception).  
  - **General reliability views** (you can be unreliable without promising).  
  - **Consequentialism** (if no bad outcomes, no wrong).  

  ---

  ### **Theory Scorecard**  
  *(How major approaches fare on the desiderata)*  

  | **Theory Type**              | **Core Desiderata** | **Substantive** | **Contested**       | **Fatal Flaw**                                  |  
  |------------------------------|---------------------|-----------------|---------------------|------------------------------------------------|  
  | **Practice/Convention**<br>(Rawls, Hume) | Fails #1, #3       | Fails #4        | Rejects #6, #7      | Secret promises aren’t binding; obligation depends on social rules. |  
  | **Expectation/Trust**<br>(Scanlon)    | Fails #1, #3       | Partial #5      | **Requires reliance** (opposes #6) | Deathbed promises create no obligation; reduces wrongness to harm. |  
  | **Duty of Fidelity**<br>(Ross, Prichard) | **Meets #1, #3**   | **Meets #4**    | Weak on #7          | Cannot explain *why* only promisee can release you (#2). |  
  | **Authority/2nd-Personal**<br>(Owens, Darwall) | **Meets #1, #2, #3** | **Meets #5**    | **Meets #6, #7**    | Struggles with "promise to self" (not covered here). Best at explaining #2. |  

  ---

  ### **Key for Your Essay**  
  - **Non-negotiable**: Focus on #1 (distinct wrongness), #2 (release power), #3 (persistence). A theory failing these is dead on arrival.  
  - **Critical tension**: Defend your preference for #7 (wrong *to* promisee) over welfare-independent obligation (#3). Argue that authority-based theories (Owens) best resolve this by framing promises as granting the promisee a right to direct your actions.  
  - **Power of release (#2)**: Ground this in the promisee’s **normative authority** over the promised act. By promising, you transfer a right of discretion to them; only they can "return" it.  

  This framework forces theories to confront promising’s paradoxes head-on. The authority-based approach currently handles the desiderata best, but still grapples with non-ideal cases (e.g., promises extracted under duress). Use this list as a litmus test in your essay — it’s what markers want to see applied rigorously.
