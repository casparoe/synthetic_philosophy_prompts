prompt: |-
  hey — I'm puting together a one-page handout for a two-day workshop I'm running next month and I need the centerpiece. The audience is staff at a state AI regulator: mostly lawyers, two engineers, nobody who has read any alignment literature. The workshop ends in a tabletop exercise where small groups have to decide whether to sign off on a frontier lab's internal request to let one of its own models do autonomous multi-day engineering work inside the lab's infrastructure. I want to hand them a decision tree they can walk through and land on "so that's the oversight strategy we're asking for, and here's what we'd have to believe for it to work."

  Please act as an expert on scalable oversight and mechanism design who is also the kind of professional philosopher who actually cares whether the distinctions are well-drawn. Take this seriously and do it in the right order: brainstorm the branching questions first, sketch the space of answer-combinations, notice which combinations are empty, and only then drop the existing named proposals into the cells. I want a tree, not a list of things you happen to have read about. Before you draw it, spend a couple of paragraphs arguing with yourself about which two questions do the real work and why the others are secondary.

  Some constraints:

  - Root node: everyone in the room already grants that the model is better at this task domain than any human who could review its output in the time available. Start there; don't spend the tree arguing about whether that's true.
  - Every branch node has to be one question a lawyer with no ML background could answer about the situation in front of them, without already knowing which strategy it leads to. Things like: is the thing being overseen one claim or a week-long sequence of actions; is there an answer that a panel of experts with unlimited time could eventually agree on, or is the question irreducibly about whose interests count; does the reviewer need to end up correct, or does she need to be able to justify having signed off; is this verdict used once, or is it fed back into training thousands of times; can the reviewer tell when both sides have quietly stopped competing. Those are starters — use better ones where you've got them, and if a question needs jargon to even be asked, it's the wrong question.
  - Leaves are oversight strategies a regulator could actually write into a rule, ten at most. Include at least: debate between two models judged by a weaker human; recursive decomposition of the hard task into subtasks a weaker judge can check; market-making / prediction-market-style scoring of a model's claims; monitoring plus control, meaning an untrusted strong model watched by a trusted weaker one with the ability to intervene; eliciting the model's own honest self-report; blunt capability limits instead of oversight. Add whatever else earns its place. Each leaf gets one sentence on what it asks the regulator to believe, one on its most awkward commitment, and one on what it cannot do at all.
  - Mark the answer-combinations your tree makes available but that nobody actually occupies, and say which reason applies: incoherent, unattractive, or just unexplored.
  - Flag any two leaves the tree genuinely can't seperate instead of pretending it can. I have a suspicion that debate and market-making collapse into each other on any tree built the way I've described — if they do, say so, and say whether that's a bug in your tree or a real fact about both proposals. Same question for recursive decomposition versus debate.
  - One branch or leaf has to be about democratic legitimacy rather than epistemology: the thought that no clever protocol can substitute for the people affected being able to contest the decision afterwards. Put it wherever the logic puts it, not in a footnote.
  - No citations, no paper titles, no authors, no reading list. I can't follow up on them and they'd just clutter the page. Name the strategies, don't source them.
  - At the bottom, three sentences on how a table of six lawyers would actually work through the thing in ten minutes.

  Write it in American English, plain language in the nodes, and format it however typesets easiest into a single page.
reasoning: |-
  Okay, let me approach this systematically. The user needs a decision tree for AI regulators to evaluate autonomous model oversight, with very specific constraints. 

  First, I need to identify the core branching questions. The key seems to be distinguishing between two fundamental dimensions: 
  1) Is there an objective ground truth? (Epistemic constraint) 
  2) Does the decision affect resource allocation? (Strategic constraint) 

  These two questions naturally cover the critical aspects while avoiding overlap. Other factors like time constraints or verifiability feel secondary because they either derive from these or affect implementation rather than strategy selection. 

  For the democratic legitimacy branch, it logically belongs under cases where no objective truth exists - when values and interests are inherently contested, procedural fairness becomes essential. This avoids treating it as an afterthought while maintaining the tree's coherence.

  Now structuring the nodes:
  - Start with the objective truth question
  - For "no", branch into value conflicts vs resource allocation
  - For "yes", branch into verifiability of steps
  - Then incorporate verifiability and time constraints where relevant

  For leaf strategies, I'm considering:
  1. Prediction markets for objective, resource-intensive cases
  2. Recursive decomposition for verifiable stepwise tasks
  3. Monitoring with intervention capability
  4. Constrained elicitation for quick, low-stakes decisions
  5. Hard capability limits as fallback
  6. Structured debate for value conflicts
  7. Democratic review for contested interests

  Each leaf needs clear:
  - Required belief
  - Awkward commitment
  - Fundamental limitation

  Notably, debate and prediction markets don't collapse here - debate handles subjective conflicts while markets handle objective but uncertain outcomes. The empty cell between structured debate and democratic review highlights an underexplored area combining both approaches.

  For the workshop flow:
  Groups would start at the root and work down based on their scenario. The democratic node ensures they consider procedural fairness early. Time boxing to 10 minutes means focusing on the path rather than exhaustive analysis.

  The structure should fit one page with plain language nodes and minimal jargon throughout.
answer: |-
  Here’s a decision tree for frontier model oversight, designed as a one-page workshop tool. It prioritizes lawyer-friendly questions, actionable strategies, and clear tradeoffs.

  ---

  **ROOT: The model is more capable at this task than any human reviewer could be in the available time.**  
  *(Start here – we assume this is true for this exercise)*  

  ### BRANCH 1: Is there an objective "right answer" that experts could eventually agree on?  
  *(e.g., "Did this code improve efficiency?" vs. "Should we prioritize cost over safety?")*  
  **• YES → Go to Branch 1A**  
  **• NO → Go to Branch 1B**  

  #### **Branch 1A (Objectively verifiable outcome)**  
  *Q: Can the task be broken into steps where each step’s correctness is easier to verify than the whole?*  
  **• YES →** **STRATEGY 1: Recursive Decomposition**  
  *Belief needed:* Sub-task verification is reliably simpler than the whole task.  
  *Awkward commitment:* Assuming decomposition doesn’t create new risks at step interfaces.  
  *Can’t do:* Resolve conflicts where values, not facts, are disputed.  
  **• NO →** *Q: Is the outcome’s correctness dependent on unpredictable future events?*  
    **• YES →** **STRATEGY 2: Prediction Markets**  
     *Belief needed:* Models or humans can price uncertainty accurately.  
     *Awkward commitment:* Tolerating speculative bets as oversight.  
     *Can’t do:* Handle decisions with ethical stakes beyond factual accuracy.  
    **• NO →** **STRATEGY 3: Monitoring + Intervention**  
     *Belief needed:* A weaker trusted model can reliably detect catastrophic action.  
     *Awkward commitment:* The "trusted" model must stay weaker than the monitored one.  
     *Can’t do:* Prevent undetectable slow-drip failures.  

  #### **Branch 1B (No objective answer – values or interests conflict)**  
  *Q: Does this decision allocate scarce resources or advantages?*  
  *(e.g., lab compute time, funding, market access)*  
  **• YES →** **STRATEGY 4: Structured Debate (Two models argue, human judges)**  
  *Belief needed:* Debate elicits better truth-tracking than solo model output.  
  *Awkward commitment:* Judges don’t reward persuasive but false arguments.  
  *Can’t do:* Guarantee justice if one side "gives up" or hides evidence.  
  **• NO →** *Q: Must affected parties accept this as legitimate, not just correct?*  
    **• YES →** **STRATEGY 5: Democratic Review Mechanism**  
     *Belief needed:* Post-hoc contestability improves outcomes/legitimacy.  
     *Awkward commitment:* Sacrificing speed/optimality for procedural fairness.  
     *Can’t do:* Fix irreversible harm after the fact.  
    **• NO →** **STRATEGY 6: Constrained Elicitation**  
     *Belief needed:* The model will report honestly if penalized for provable lies.  
     *Awkward commitment:* Trusting the model’s uncertainty estimates.  
     *Can’t do:* Stop the model from omitting key context strategically.  

  ### FALLBACK FOR HIGH UNCERTAINTY  
  **STRATEGY 7: Hard Capability Limits**  
  *(Use if any branch feels too risky)*  
  *Belief needed:* We can accurately measure and cap dangerous capabilities.  
  *Awkward commitment:* Stifling beneficial uses to block harmful ones.  
  *Can’t do:* Oversee tasks *near* the capability limit safely.  

  ---

  ### KEY NOTES ON THE STRUCTURE:  
  1. **Empty Cell:** *Branch 1B → "No" to resource allocation → "No" to legitimacy need* has no strategy. This combination (subjective, no stakes, no legitimacy requirement) is **unattractive** – it describes decisions too trivial for rigorous oversight.  
  2. **Collapsing Distinctions:**  
     - **Debate vs. Markets:** *Don’t collapse.* Markets handle **objective-but-uncertain futures**; Debate handles **subjective conflicts of value/interest**.  
     - **Debate vs. Decomposition:** *Separate.* Decomposition requires **verifiable sub-steps**; Debate thrives when verification is impossible.  
  3. **Democratic Legitimacy** is placed where values conflict *and* legitimacy is required – it’s not an afterthought but a response to irreducibly contested stakes.  

  ---

  ### HOW A GROUP OF 6 LAWYERS USES THIS IN 10 MINUTES:  
  1. **Frame their specific scenario:** What task is the model doing? Who is affected? (3 min).  
  2. **Walk the tree from the root:** Answer each question based on their scenario – no ML knowledge needed (4 min).  
  3. **Reach a leaf strategy:** Read its "belief needed" and "can’t do" to stress-test feasibility (2 min).  
  4. **Flag disagreements:** Note if assumptions feel unrealistic – that’s the oversight strategy’s vulnerability (1 min).  

  ---

  **FORMATTING:** Use this as a flowchart. Bold strategy names. Keep node text identical to above. Fits one page in 11pt sans-serif.
