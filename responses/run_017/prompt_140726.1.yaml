prompt: |-
  A commenter on a blog I read (this general argument comes up every few months around here) summed up Popper's demarcation thing roughly like this:

  "Popper's move was to give up on confirmation and look at testing instead. A theory is scientific just in case it's falsifiable — there's some possible observation that would show it to be false — and the method of science is to try as hard as you can to falsify your best theory and provisionally keep the ones that survive. That's why Freud and astrology aren't science: their fans can explain away any result, so no observation could ever refute them, whereas a real theory sticks its neck out. And surviving severe testing is what makes a theory rational to believe, which is why we also say a well-tested theory is probably closer to the truth than the one it replaced."

  I use "not even falsifiable" as a conversation-stopper constnatly and I want to know how much of that I can keep. Two things bug me. One: can't you make any unfalsifiable theory falsifiable just by conjoining it with something dumb and checkable — "Freud was basically right and the moon is made of green cheese" is falsifiable — so falsifiability by itself seems way too cheap to do any demarcating work? Two: my friend's Bayesian spiel, that a theory can be strictly unfalsifiable and still get wrecked by evidence if it spreads its probability thinly over outcomes we didn't see, which makes the whole demarcation project sound like a category error.

  Which sentences in that gloss would someone who actually works on this accept as stated, which are the standard popular oversimplifications, and which are wrong in a way that matters? Be specific about what the accurate parts do and don't license. And does the move I actually want to make in arguments — that some pet theory of a friend's is unscientific because nothing could refute it — follow from any of the accurate parts, or does it need a premise the gloss never gives me?
reasoning: |-
  Okay, the user is dealing with Popper's falsifiability criterion and has two main concerns. First, they mention the "tacking problem" where adding a falsifiable claim to an unfalsifiable theory makes the whole thing falsifiable. That's a valid point. The second issue is about Bayesian probability, where even unfalsifiable theories can lose credibility if their predictions are improbable. 

  The user uses "not even falsifiable" as a conversation-stopper and wants to know if that's justified. They’re also worried their friend's Bayesian approach undermines the whole demarcation project. 

  I need to break down the original comment's accuracy. The gloss starts by saying Popper gave up on confirmation for testing. That's mostly right—Popper did shift focus to falsification over confirmation. But the part about "surviving severe testing makes a theory rational to believe" is where Popper diverges. He rejects induction, so he wouldn’t say testing makes a theory probably true. Instead, he talks about corroboration, which is about past performance without implying future reliability. 

  The Freud and astrology examples are classic Popper. They’re unfalsifiable because supporters adjust the theory to fit any evidence. But the user’s tacking problem is legit. Conjoining a falsifiable element doesn’t make the original theory scientific. Popper’s solution is that the falsifiable part must be a genuine test of the core theory. If the moon cheese claim isn’t related, it doesn’t help. 

  On Bayesianism, the user’s friend is correct. Probabilities can drop even for unfalsifiable theories if they assign low likelihood to observed data. But Popperians argue that without falsifiability, there’s no way to structure tests. Bayesians need priors, which can be subjective. 

  The user wants to dismiss theories as unscientific if unfalsifiable. For practical purposes, pointing out unfalsifiability highlights that the theory avoids accountability. But strictly speaking, falsifiability alone isn’t sufficient—it’s necessary but not foolproof. The deeper issue is whether the theory engages with evidence. 

  The user might need to adjust their approach. Instead of just saying "unfalsifiable," they could ask what evidence would change the friend’s mind. If there’s no answer, the theory isn’t engaging scientifically. Bayesian critique shows that unfalsifiable theories can lose credibility, but falsifiability still matters for testability. 

  In summary, the user can keep using the move but should acknowledge its limits. The key is whether the theory risks being wrong. Combining falsifiability with severity of tests and explanatory power makes the argument stronger.
answer: |-
  Here's a breakdown of the Popperian gloss and your concerns, separating accurate points, common oversimplifications, and where the argument needs refinement for your conversational use:

  **Accurate Parts of the Gloss:**

  1.  **"Popper's move was to give up on confirmation and look at testing instead."** - **Mostly Accurate.** Popper explicitly rejected *inductive confirmation* (accumulating positive evidence proves a theory) as logically flawed and argued science progresses through *deductive testing* (attempting to refute theories).
  2.  **"A theory is scientific just in case it's falsifiable — there's some possible observation that would show it to be false."** - **Accurate Core Criterion.** This is the heart of Popper's demarcation criterion. A scientific theory must make *risky predictions* that could, in principle, be contradicted by observation or experiment.
  3.  **"The method of science is to try as hard as you can to falsify your best theory..."** - **Accurate Description of Popperian Methodology.** He advocated for bold conjectures followed by severe, relentless attempts at refutation.
  4.  **"...and provisionally keep the ones that survive."** - **Accurate (with caveat).** Popper called this "corroboration." Surviving tests makes a theory *worthy of further consideration and testing*, but crucially *not proven true*.
  5.  **"That's why Freud and astrology aren't science: their fans can explain away any result, so no observation could ever refute them..."** - **Accurate Illustration.** Popper used these as prime examples of *immunization strategies* or *ad hoc modifications* that render theories unfalsifiable. They lack specific, risky predictions that could fail.
  6.  **"...whereas a real theory sticks its neck out."** - **Accurate Metaphor.** Scientific theories make specific, potentially falsifiable predictions.

  **Standard Popular Oversimplifications/Wrong in Important Ways:**

  1.  **"...surviving severe testing is what makes a theory rational to believe..."** - **Significant Oversimplification/Misstatement.** This is where the gloss goes seriously astray from Popper. Popper was a staunch *fallibilist* and anti-inductivist. He **explicitly denied** that surviving tests makes a theory *probably true* or even that we can rationally assign it a high *probability* of being true. Corroboration (surviving severe tests) indicates the theory has *withstood criticism* so far and is currently the *best available* candidate, making it *rational to prefer it over falsified rivals* **for further testing and practical application**, but **not** rational to believe it is *true* or *probable*. He thought the quest for certainty or high probability was misguided.
  2.  **"...why we also say a well-tested theory is probably closer to the truth than the one it replaced."** - **Not Popper's View.** This is a common *inductivist* view that Popper explicitly rejected. Popper *did* believe science progressed towards truth ("verisimilitude"), but he argued we could never *know* if a theory was true or closer to truth, only that a new theory *seemed* to have more verisimilitude *if* it explained everything the old one did plus more, and hadn't yet been falsified where the old one was. He rejected the idea that testing provided *probabilistic* justification for truth-likeness. This sentence smuggles induction back in, which Popper spent his career arguing against.

  **Addressing Your Specific Concerns & The Conversation-Stopper:**

  1.  **The Tacking Problem ("conjoining with something dumb"):**
      *   **Valid Concern:** This is a well-known criticism (Duhem-Quine problem touches on aspects, "tacking by conjunction").
      *   **Popperian Response:** Popper anticipated this. Falsifiability isn't just about *logical possibility* of falsification, but about the *methodological role* of the theory and the *significance* of the tests. Conjoining "and the moon is made of green cheese" to Freudian theory:
          *   **Doesn't Test Freud:** Falsifying the moon claim tells you nothing about Freud's core ideas. The conjunction is falsifiable, but the *Freudian part* remains untested and immunized within the whole.
          *   **Ad Hoc & Degenerative:** Such a move is blatantly *ad hoc* – it adds no new explanatory or predictive content relevant to the theory's domain (psychology). Popper argued science should reject *ad hoc* modifications designed solely to avoid falsification. A genuinely scientific theory makes *novel, bold, and risky predictions within its domain*.
      *   **Conclusion:** Falsifiability is **necessary but not sufficient** for good science. The *nature* of the falsifiable claims matters – they must be *integral* to the theory and constitute *severe tests* of its core content. Your "green cheese" example creates a *technically* falsifiable conjunction, but not a *scientifically useful* or *progressive* one. Demarcation relies on the *spirit* of making risky, testable predictions in the theory's domain, not just logical trickery.

  2.  **Bayesian Critique ("unfalsifiable but wrecked by evidence"):**
      *   **Valid Point:** Bayesianism offers a powerful framework where evidence affects belief in *degrees*. An unfalsifiable theory (one that assigns non-zero probability to *all* possible observations) can still have its posterior probability drastically reduced by evidence highly *improbable* according to the theory. If a theory spreads probability thinly over many outcomes, seeing a specific, surprising outcome can make that theory look very bad compared to a rival that predicted it.
      *   **Impact on Demarcation:** This *does* challenge the idea that falsifiability is the *sole* or *most fundamental* criterion for rational belief updating. Bayesians argue their framework handles both falsifiable *and* unfalsifiable claims rationally by updating probabilities.
      *   **Popperian/Bayesian Tension:** Popperians counter:
          *   **Testability:** How do you *design a test* for a strictly unfalsifiable theory? What observation would you even look for to challenge it? While its probability can drop *after* seeing surprising data, it lacks *predictive specificity* beforehand to guide inquiry.
          *   **Immunization:** Unfalsifiable theories are *defined* by their ability to absorb any data. Bayesians must assign them *some* prior probability. If adherents keep the prior high enough, even very improbable evidence won't kill it, allowing persistent irrational belief.
          *   **Degenerative Programs:** Lakatos (a Popperian successor) argued unfalsifiable cores lead to "degenerating research programmes" constantly patched with *ad hoc* hypotheses, while progressive programmes make novel predictions.
      *   **Conclusion:** Bayesianism shows that falsifiability isn't *necessary* for evidence to reduce a theory's credibility. However, falsifiability remains crucial for *testability* and *methodological rigor* in science. It ensures theories make specific, checkable predictions that allow for *structured, critical inquiry*. Unfalsifiable theories evade this critical process.

  **Your Conversation-Stopper & What You Need:**

  *   **"Not even falsifiable" as a critique:** This move **does have force**, derived from the **accurate core of Popper's demarcation**.
  *   **What it highlights:** It points out that your friend's pet theory lacks *empirical accountability*. It doesn't make specific, risky predictions that could fail. It can always be adjusted to fit any observation, making it immune to empirical criticism. This *is* a serious weakness from a scientific perspective.
  *   **What it needs (to be stronger than just a stopper):**
      1.  **Clarify the Demand:** You aren't just asking for *any* falsifiable claim tacked on. You're asking: "What *specific, observable event* happening (or *not* happening) in the *relevant domain* would *force you to admit this core idea is wrong*?" If nothing does (or if every answer involves "well, it could still be true because..." excuses), then the theory is functioning unfalsifiably.
      2.  **Link to Methodological Weakness:** Explain *why* this matters: "If nothing could ever count against it, how can we ever test it or learn from evidence? It just becomes a matter of faith or interpretation, not investigation."
      3.  **Acknowledge Bayesian Point (Optionally):** You can say: "Sure, Bayesians might say seeing unlikely things makes it *less probable*, but without a specific prediction it *couldn't* accommodate, we can't actually *test* it in a meaningful way. It just absorbs everything." This preempts the Bayesian counter.
  *   **Does it follow strictly?** The core insight that unfalsifiable theories evade empirical refutation **does support your move**. However, the *gloss's* oversimplified claim about "rational to believe" surviving theories isn't needed for your critique. Your critique relies on the **lack of empirical risk and accountability**, which is Popper's valid core point.

  **In Summary:**

  *   **Keep:** The core idea that scientific theories must make falsifiable predictions and that unfalsifiability is a major weakness indicating a lack of empirical accountability (Freud/Astrology examples).
  *   **Refine:** Understand falsifiability requires *significant, testable predictions integral to the theory* (not tacked-on nonsense). Acknowledge that Bayesian updating *can* affect belief in unfalsifiable theories, but emphasize that falsifiability is crucial for *test design* and *critical inquiry*.
  *   **Discard:** The gloss's claims that surviving tests makes a theory "rational to believe" or "probably closer to the truth" in a probabilistic sense – these are oversimplifications/misrepresentations of Popper.
  *   **Use Your Move Effectively:** Demand *specific, domain-relevant potential falsifiers*. Point out the *inability to engage in critical testing* is the core problem when a theory is unfalsifiable. This move remains powerful for highlighting a lack of scientific rigor, even if philosophers debate the finer points of demarcation.
