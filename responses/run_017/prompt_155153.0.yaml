  I've been going round in circles on the absent-minded driver, and I think I've confused myself rather than cleared anything up. Can you explain what's actually going on? Heres the version I'm working with (my own numbers, feel free to re-derive everything):

  A guy drives home from a bar. The road has two intersections that look exactly the same, and he can't tell them apart and has no memory of how many he's already passed. At each one he can either turn off (EXIT) or go straight on (CONTINUE). Exiting at the first one puts him in a ditch: payoff 0. Exiting at the second one gets him home: 4. Going straight at both means he overshoots and sleeps in the car: 1. He knows all of this while he's still at the bar, and can make a plan then.

  Here's what bugs me. There seem to be two ways of evaluating a plan and they dont agree:

  (i) From the bar: if he'll continue with probability p at each intersection, expected payoff is 4p(1-p) + p², which peaks at p = 2/3 and gives 4/3.

  (ii) From the intersection, once he's there: he certainly visits the first intersection and only reaches the second with probability p, so conditional on being at an intersection the chance it's the first one is 1/(1+p) — i.e. 3/5 when p = 2/3. Then EXIT-now looks worth (2/5)·4 = 1.6, and CONTINUE-now (and then continue with prob 2/3 at the next one) looks worth (3/5)·2 + (2/5)·1 = 1.6 as well. So the plan is at least stable — he's indifferent — but the number he gets is 1.6, not 1.33.

