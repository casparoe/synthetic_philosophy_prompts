prompt: |-
  So I'm on this tiny committee at my university that hands out a hardship fund — a few thousand a term, way more applicants than money — and we keep trying to be principled about whose need is greater, which has made me realise I have no settled view at all on how you compare how well off two different people are, or how much some fixed thing would help each of them. Here are my gut verdicts. Two applicants both want $400 toward a laptop: one is broke and it's the difference between finishing her thesis or not, the other is comfortable and just wants a nicer machine — obviously the first, no contest. Petra has had chronic migraines for fifteen years and rates this one 5/10 and works through it; Sam has his first ever migraine, rates it 9/10 and is wrecked — I want to say Petra's episode is costing her at least as much as Sam's is costing him, because she's recalibrated her scale downward, and I don't think we should let that count against her. Miriam has had a severe mobility impairment since childhood, reports 8/10 life satisfaction, and is genuinely the least bitter person I know — and here I want to take that at face value and give her the cost of the equipment and not a penny of extra priority on top. Kostas needs a €200 bottle to get the pleasure I get out of a €12 one, and Bea is content with almost nothing, not depressed, just small appetites — I resent the idea of topping Kostas up, but I'm perfectly happy to give Bea her share and I even feel she's cheap to make happy so we should do it, which I notice is the same phenomenon viewed from the other side. And one person tortured for an afternoon strikes me as worse than a thousand people with a bad headache, but worse-than reversed if it's a million, so I seem to have some kind of threshold and not a smooth exchange rate. Also: I count a dog's distress at something, less than a human's, and I cannot say what the fraction is.

  The thing I've been toying with as a principle is a kind of common currency that isn't money: ask each person how many days of their own life, at their current level of wellbeing, they'd give up to avoid the bad thing or get the good thing, and compare those numbers across people. It feels like it gets Petra (she'd give a lot, her days are hard), it gets the broke student, and it gets Sam vs Petra right without trusting either of their 1–10 numbers. But it breaks in ways I can see coming: someone who is already very badly off has cheap days and so looks cheap to help, someone who'd rather die than endure something trades away their whole remaining life and blows up the scale, and Bea's days are so pleasant that she'd trade a lot of them, which perversely inflates her claim in the opposite direction from where my gut went. The fallback I keep hearing about is the Harsanyi-style move where you don't compare anyone, you just ask what you'd choose if you had an equal chance of being each applicant, and let your own intrapersonal preferences under uncertainty do all the work. I can't tell whether that dissolves the problem or just relocates it: do I imagine being Miriam with Miriam's adapted psychology, in which case I just get Miriam's own verdict back, or with my own, in which case I get an answer that has nothing to do with her? And does it secretly assume everyone is equally good at converting resources into wellbeing, which is exactly what Kostas and Bea are supposed to be a problem for?

  So: is there a principle that captures that whole spread, or close to it, and if not, which of my verdicts is the one I have to give up? I'd like it stated precisely enough that I could actually read it out at a meeting, with the case that motivates each clause, and I especially want to know what it says about the three cases I haven't put on the list — comparing a person now against that same person in twenty years with completely different tastes and a different baseline, comparing people who don't exist yet against people who do, and an applicant who can't answer the life-days question at all because she's in the middle of a psychotic episode. I'd also like to know whether the honest answer is sometimes that two applicants are genuinely incomparable rather than just hard to compare, because we currently resolve those by awkwardly splitting the money and everyone hates it. And don't tell me to go and read up on social choice theory, I have a dissertation to finish and no library access this term.
reasoning: |-
  Okay, let's tackle this user's dilemma. They're on a committee allocating a hardship fund and struggling with how to fairly compare the well-being of different applicants. They've shared several intuitive cases that highlight the complexities in assessing need. 

  First, let's unpack their examples. The broke student versus the comfortable one seems straightforward—urgency and basic need outweigh convenience. But Petra and Sam show how pain tolerance can skew self-reports; Petra's adaptation shouldn't penalize her. Miriam's high life satisfaction despite disability suggests we shouldn't assume suffering where none is claimed, yet Kostas's expensive pleasures versus Bea's frugal contentment reveal how efficiently people convert resources to happiness. 

  The torture-versus-headaches scale problem indicates nonlinear suffering thresholds. The dog example introduces cross-species comparisons, which the committee thankfully doesn't face but reveals the user's broader philosophical unease. Their proposed "life days" metric cleverly standardizes sacrifice but fails at extremes: the suicidal applicant's infinite ask, the already-suffering person's undervalued days, Bea's paradoxically strong claim due to her happiness. 

  Harsanyi's veil-of-uncertainty approach feels tempting but ambiguous—whose preferences do we use? The user's own or the applicant's? This circles back to the Kostas/Bea efficiency puzzle. 

  For a practical solution, we need principles that: 
  1. Respect self-assessments without discounting adaptation (Petra)  
  2. Prioritize urgent, needs-based claims (thesis student)  
  3. Avoid overcompensating for inefficient resource use (Kostas) while rewarding efficiency (Bea)  
  4. Handle scale non-linearity (headaches)  
  5. Accommodate non-human cases (dogs—though irrelevant here)  
  6. Address time/identity shifts (future selves, unborn people)  
  7. Work for cognitively impaired applicants  

  The three-clause proposal balances these:  
  - Clause 1 handles urgency/baseline deprivation via capacity-to-benefit  
  - Clause 2 honors self-report while capping claims to prevent gaming  
  - Clause 3 rewards efficiency via wellbeing-per-resource  

  Unaddressed cases:  
  - Future selves: Clause 1 naturally favors current needs over future hypotheticals  
  - Unborn people: Outside scope (committee deals with existing applicants)  
  - Psychotic applicant: Use proxies (doctors/advocates) for Clause 1 assessment  

  Incomparability is real but avoidable via tiered prioritization: first filter by Clause 1 (capacity-to-benefit), then Clause 3 (efficiency) for tiebreaks. This minimizes arbitrary splits.  

  The user's core tension is between subjective experience and objective need. The solution pragmatically centers on observable impact—functionality and resource efficiency—while respecting stated wellbeing as a ceiling, not a multiplier. This rejects Miriam's "extra priority" but grants her equipment, sidesteps Kostas's inefficiency without punishing him, and funds Bea efficiently. It also elegantly excludes the dog question as irrelevant to human hardship funds.
answer: |-
  Here's a principled framework derived from your intuitions, designed for committee-level practicality. It has three clauses, each addressing a core challenge you identified, plus guidance for your unlisted cases:

  **The Principle: Prioritize Applicants Based on (1) Functional Impact Relative to Baseline Deprivation, (2) Self-Reported Wellbeing as a Ceiling (Not Floor), and (3) Expected Wellbeing Gain Per Resource Unit.** Apply clauses sequentially.

  1.  **Functional Impact & Baseline Deprivation:**
      *   *Clause:* "Prioritize applicants for whom the hardship grant would yield the most significant *improvement in essential functioning or opportunity*, especially where current functioning is severely constrained due to deprivation beyond their control."
      *   *Why?* Captures the broke student (thesis completion = essential opportunity blocked by poverty vs. comfort), Petra/Sam (Petra functions despite high baseline deprivation; Sam's episode, while acute, doesn't indicate long-term deprivation). Migraine intensity rating isn't trusted, but *functional capacity* (working vs. wrecked) is observable evidence of impact relative to their baseline. Miriam's equipment *directly enables function*.
      *   *Motivating Cases:* Broke Student, Petra/Sam, Miriam (for the equipment cost).

  2.  **Self-Reported Wellbeing as a Ceiling:**
      *   *Clause:* "Accept an applicant's self-reported life satisfaction or wellbeing as the *upper bound* for assessing their suffering or need. Do *not* assume their adapted state (e.g., Miriam) or high pain tolerance (e.g., Petra) implies *greater hidden suffering* deserving extra priority beyond the tangible benefit. However, low self-reported wellbeing *is* valid evidence of need."
      *   *Why?* Prevents penalizing resilience (Miriam, Petra). If Miriam says 8/10, we don't invent hidden misery to give her *more* than the equipment cost. If Petra functions, we don't assume she's secretly suffering *more* than Sam *for the same event*. However, if someone reports being at 2/10, that *is* strong evidence of severe need.
      *   *Motivating Cases:* Miriam, Petra/Sam.

  3.  **Wellbeing Gain Per Resource Unit (Efficiency):**
      *   *Clause:* "Where comparable functional impacts are established (Clause 1) and self-reported wellbeing doesn't contraindicate (Clause 2), prioritize applicants where the requested resources are expected to yield the largest *gain in wellbeing or functioning* per dollar spent. This rewards efficiency without punishing simple tastes."
      *   *Why?* Captures Bea vs. Kostas. Bea gets a large wellbeing gain cheaply – that's efficient and desirable. Kostas gets a small gain (same pleasure as Bea's cheap wine) expensively – that's inefficient. We fund Bea's efficient happiness boost; we don't subsidize Kostas's inefficiency, but Clause 1 might still fund him if his request enabled essential function (e.g., the laptop for the thesis, not a nicer machine).
      *   *Motivating Cases:* Kostas & Bea.

  **Handling Your Unlisted Cases:**

  1.  **Same Person, 20 Years Apart:**
      *   *Apply Clause 1:* Prioritize the version facing the hardship *now* if it impacts essential functioning/opportunity *now*. Future hypotheticals (different tastes, baseline) are less certain and less urgent. The committee's mandate is *current* hardship relief. (e.g., Fund the broke student *now* needing the laptop, not a hypothetical future self wanting a yacht).

  2.  **Existing vs. Unborn People:**
      *   *Not Applicable.* Your committee allocates resources to *existing, identified applicants* facing *current* hardship. Future generations are outside the scope of this specific fund and its criteria. Stick to the living applicants before you.

  3.  **Applicant Unable to Self-Report (e.g., Psychotic Episode):**
      *   *Reliance on Proxies & Clause 1:* Use best available evidence: medical documentation, statements from healthcare providers/caregivers, observable functional impairment. Focus intensely on **Clause 1 (Functional Impact & Baseline Deprivation)**. What essential function is impaired *by the current crisis*? How would the grant *specifically* alleviate that impairment (e.g., funding medication, temporary care, safe housing)? Avoid speculating about internal state; stick to observable need and functional restoration potential.

  **On Incomparability:**

  *   **It Exists, But Minimize It:** True incomparability (where applying the clauses yields no clear priority) is possible but likely rare. Your framework reduces its frequency:
      1.  **Tier by Clause 1:** First, filter by severity of functional impact relative to baseline deprivation. This groups similar levels of urgency/need.
      2.  **Within Tiers, Use Clause 3:** Among applicants with similar functional need (Clause 1) and where self-report doesn't alter priority (Clause 2), prioritize those offering the most wellbeing/functioning gain per dollar (Clause 3 - Efficiency).
  *   **If Truly Stuck:** Only *after* applying the clauses rigorously within a tier, if no distinction emerges, *then* consider splitting funds *within that specific tier of need*. This feels less arbitrary than splitting across vastly different need levels. Document *why* the split occurred (e.g., "Both applicants in Tier 1-A demonstrated critical functional need for equipment; funds split to partially meet both urgent requests").

  **Why this works with your gut (mostly):**

  *   **Broke Student:** Wins on Clause 1 (Critical functional impact, high baseline deprivation).
  *   **Petra vs. Sam:** Petra wins on Clause 1 (She functions *despite* higher baseline deprivation; the grant maintains essential function impacted by her chronic condition). Sam's episode, while acute, doesn't indicate the same level of long-term deprivation impacting core function *persistently*. Clause 2 stops us from downgrading Petra because she functions.
  *   **Miriam:** Gets her equipment cost funded under Clause 1 (Essential for function). Clause 2 prevents giving her *extra* priority based on assumed hidden suffering.
  *   **Kostas vs. Bea:** Bea wins under Clause 3 (Massive wellbeing gain per dollar efficiently). Kostas loses under Clause 3 (Small gain per dollar inefficiently) unless his request meets a high bar under Clause 1 (essential function).
  *   **Torture vs. Headaches:** Implicitly handled by the *scale* in Clause 1. "Severe constraint on essential functioning" captures the torture threshold. A million headaches might collectively represent a massive functional impairment to a community, potentially elevating it under Clause 1 in a different context, but individual headaches likely don't meet the threshold for *this* fund focused on individual hardship.
  *   **Dog:** Confirms the principle is anthropocentric (Clause 1 focuses on *human* function/opportunity). Not relevant to the fund.

  **Addressing the Harsanyi Question:** This framework avoids the ambiguity. You *use* self-reported wellbeing (Clause 2) but only as a ceiling, not for full interpersonal comparison. You focus on *functional impact* (Clause 1, observable) and *efficiency* (Clause 3, resource-to-outcome). It doesn't assume equal conversion ability (Clause 3 explicitly deals with it) and doesn't require imagining being someone else with ambiguous preferences.

  **Precise Statement for the Meeting:**

  > "Our committee faces the difficult task of prioritizing limited hardship funds among applicants with diverse needs. To do this fairly and effectively, we propose this principle:
  >
  > 1.  **Greatest Functional Need:** We prioritize requests that would make the most significant difference in overcoming a severe constraint on the applicant's *essential functioning or core opportunities*, especially where that constraint arises from deprivation beyond their control.
  > 2.  **Respect Resilience:** We accept an applicant's own assessment of their life satisfaction as the *upper limit* of their suffering. We do not assume that someone who has adapted to hardship or tolerates pain well has hidden suffering deserving extra priority *beyond* the tangible benefit of the grant. However, low self-reported wellbeing is valid evidence of need.
  > 3.  **Value for Money in Wellbeing:** When requests offer similar functional benefits (under Point 1) and self-reports don't indicate a different level of need (under Point 2), we prioritize those where the funds will produce the largest improvement in wellbeing or functioning *per dollar spent*.
  >
  > We apply these points in order. Points 1 and 3 allow us to compare needs meaningfully. Point 2 ensures we don't penalize strength. This helps us fund essentials for those in deep hardship (like the student needing a laptop to graduate), support those managing long-term challenges (like funding Petra's or Miriam's necessary aids), and get the most wellbeing bang for our buck (like funding Bea's simple pleasures over Kostas's expensive ones for the same effect). For applicants unable to self-report, we will rely on professional assessments focused on functional impact (Point 1). If, after rigorous application, two requests within the same level of functional need remain indistinguishable, we may split funds between them for that specific need tier."

  **Which Gut Verdict Might Need Adjustment?** The framework mostly validates you. The main tension is **Kostas**. Your gut *resents* topping him up. Clause 3 explicitly rejects funding his inefficiency *unless* his request meets a very high bar under Clause 1 (essential function). If his €200 bottle is *just* about pleasure, not function, he loses to Bea. You only have to give up funding Kostas for mere pleasure if efficiency (Clause 3) is the tiebreaker. This aligns with your resentment.
