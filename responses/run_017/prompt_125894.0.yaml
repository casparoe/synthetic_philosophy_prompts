answer: |-
  ### Disambiguation Menu: Readings of "The Whole is More Than the Sum of Its Parts"  
  *(Ordered from trivial/weak to radical/strong)*  

  1. **Property Novelty**: A composite system has properties not possessed by any of its isolated proper parts.  
     *Verdict*: Platitude (true by definition of "composite").  
     *Clear instance*: Water (wetness) vs. isolated H₂ and O₂ gases.  
     *Clear non-instance*: A pile of sand having "graininess" (each grain already has it).  
     *Textbook cases*: Temperature (parts lack it), protein function (amino acids lack catalytic activity).  

  2. **Non-Linear Aggregation**: The aggregate behavior of the system is not a linear sum of behaviors of isolated parts; part-wise predictions fail due to interactions.  
     *Verdict*: Substantive but defensible (common in complex systems).  
     *Clear instance*: Chaos theory (weather prediction), neural networks (input-output non-linearity).  
     *Clear non-instance*: Ideal gas law (pressure linearly aggregates particle momentum).  
     *Textbook cases*: Phase transitions (e.g., ferromagnetism), protein folding (amino acid interactions).  

  3. **Computational Irreducibility**: Macro-behavior cannot be *predicted* from micro-constitution/dynamics without simulating the system step-by-step (even with perfect micro-knowledge).  
     *Verdict*: Contingent empirical hypothesis (true for many systems; undecidable in general).  
     *Clear instance*: Three-body problem, turbulent fluid flow.  
     *Clear non-instance*: Solar system orbits (predictable via Newtonian mechanics).  
     *Textbook cases*: Protein folding (requires simulation), consciousness? (disputed).  

  4. **Descriptive Irreducibility**: Macro-vocabulary (e.g., "temperature," "consciousness") cannot be *eliminated* in favor of micro-vocabulary; macro-concepts capture patterns invisible at micro-scale.  
     *Verdict*: Substantive but defensible (epistemological claim).  
     *Clear instance*: "Fitness" in evolution (no gene-level synonym).  
     *Clear non-instance*: "Pressure" in ideal gas (reducible to particle momentum).  
     *Textbook cases*: Natural selection (irreducible to genetics), phase transitions (order parameters).  

  5. **Multiple Realizability**: The same macro-state (e.g., "liquid") is realizable by wildly different micro-configurations; stability resides at macro-level.  
     *Verdict*: Substantive but defensible (key to functionalism).  
     *Clear instance*: Pain (realizable by diverse neural substrates).  
     *Clear non-instance*: Atomic electron orbitals (fixed quantum states).  
     *Textbook cases*: Phase transitions (universality), protein function (fold diversity).  

  6. **Weak Emergence (Causal)**: Macro-states have causal powers *over parts*, constraining micro-dynamics (downward causation).  
     *Verdict*: Contingent empirical hypothesis (e.g., thermodynamics constraining particles).  
     *Clear instance*: A cell membrane (macrostructure gates molecular diffusion).  
     *Clear non-instance*: A clock’s gears (macro-structure has no causal power over gear teeth).  
     *Textbook cases*: Natural selection (ecosystem pressures select genes), convection rolls.  

  7. **Strong Emergence**: Macro-behavior is *in principle not derivable* from micro-laws; new fundamental laws/principles operate at macro-level.  
     *Verdict*: Confused or false (contradicts physics; no uncontested examples).  
     *Clear instance*: None (if physics is causally closed).  
     *Clear non-instance*: All textbook cases (temperature, pressure, evolution reducible to micro-physics).  

  8. **Deflationary Emergence**: "Emergence" labels *current ignorance* or computational limits, not ontological novelty.  
     *Verdict*: Substantive but defensible (pragmatic/epistemic view).  
     *Clear instance*: 19th-century thermodynamics (pre-statistical mechanics).  
     *Clear non-instance*: Strong emergence (if true).  
     *Textbook cases*: All are potentially deflationary post-reduction.  

  ---

  ### Assignments to Your Cases  

  1. **Condensed-Matter Physicist** (vs. particle physics):  
     - *Needs*: Descriptive Irreducibility (4), Multiple Realizability (5), and/or Weak Emergence (6).  
     - *Verdict*: Defensible (4,5,6 are plausible for phase transitions).  
     - *Gap*: Slogan alone doesn’t prove disciplinary autonomy; reduction may still be possible in principle.  

  2. **Consciousness Researcher** (new fundamental principles):  
     - *Needs*: Strong Emergence (7).  
     - *Verdict*: Indefensible (7 is unsupported; consciousness may fit 4,5,6 without new laws).  
     - *Gap*: Hard problem ≠ strong emergence; irreducibility (4) doesn’t imply ontological novelty.  

  3. **ML Researcher** (unforecastable capabilities):  
     - *Needs*: Computational Irreducibility (3) or Deflationary Emergence (8).  
     - *Verdict*: Defensible if (3); trivial if (8).  
     - *Gap*: "Unforecastable" ≠ "unexplainable"; scaling laws may permit prediction.  

  4. **Global-Variable Thesis** (macro-description as irreducible grammar):  
     - *Is*: Repackaging of Descriptive Irreducibility (4) + Multiple Realizability (5).  
     - *Truth*: Defensible for topology-dependent properties (e.g., winding number in superconductors, genus in topology).  
     - *Supports*: Condensed-matter physicist (4/5) and ML researcher (if unpredictability follows).  
     - *Compatibility*: Fully compatible with causally complete micro-physics; it’s about description, not causation.  

  ---

  ### Closing Note: What Challenges Complete Micro-Physics?  
  Only **Strong Emergence (7)** asserts ontological incompleteness of micro-laws. All other readings are compatible with micro-physics being causally closed:  
  - **No threat**: Property Novelty (1), Non-Linear Aggregation (2), Computational Irreducibility (3), Descriptive Irreducibility (4), Multiple Realizability (5), Deflationary Emergence (8).  
  - **Minimal threat**: Weak Emergence (6) *if* downward causation is reductive (e.g., boundary constraints).  
  The slogan’s rhetorical power often conflates descriptive/predictive gaps (3,4,8) with ontological breaks (7). Most scientific uses reduce to the former.
