prompt: |-
  You are a philosopher of mind and cognitive science who has published on the extended mind thesis and on the metaphysics of cognitive artefacts. Please think this through carefully: before you answer, spend a paragraph or two brainstorming what a practice like the one below could be for, and what the least charitable reading of it would be, so that you don't simply rationalise the status quo. Then give me the reconstruction.

  I sit on my university's assessment committee, and we are rewriting the rules on which external resources students may use in exams. The existing patchwork is what I want you to analyse. Closed-book exams are the default, but many courses permit one handwritten page of notes or an instructor-supplied formula sheet. Printed or photographed solutions to similar problems are banned even when the student made them herself. Calculators are permitted in some courses and not others, apparently depending on whether the course is meant to certify arithmetic fluency. Spell-check and error-flagging grammar tools are fine; autocomplete that proposes sentence continuations is not. Dictation software and human scribes are granted as accommodations to students with diagnosed dysgraphia, while the very same software used by a student without a diagnosis counts as a violation. And our honour code defines academic dishonesty as presenting as one's own work, or knowledge, that is not one's own.

  The last clause is what keeps bothering me, because it looks like the whole system rests on an ownership relation between a person and a piece of knowledge that I can't spell out — and because the thing we permit (a formula sheet, i.e. an external store consulted at need) is structurally the closest to the paradigm case in the extended mind literature, while the thing we forbid (a tool that transforms input into output) is the case people usually treat as merely causal scaffolding. So: what theory of cognition, and of the boundary between a person and her tools, does this patchwork presuppose? Reconstruct the implicit view in the vocabulary of the extended mind debate, including whether it has to commit itself to anything like a parity principle or to the familiar checklist about an external resource being reliably available, automatically endorsed and easily accessible (I'm paraphrasing that from memory, so correct me if I have it wrong). Then separate what the practice strictly presupposes from what it merely fits well with: does any part of it actually require the falsity of the extended mind thesis, or is every rule compatible with it, and does the storage-versus-processing distinction our rules rely on survive scrutiny? Tell me too whether the practice is better explained without any metaphysics at all — as a view about what a grade certifies, about credit, fairness, or portability across contexts — and, if so, which rival theories of mind would license exactly the same rules, so that the rules are philosophically underdetermined.

  Finally, be concrete about the counterfactual: if the committee took the extended mind thesis seriously, what would have to change? Is a closed-book exam then morally akin to testing a student with part of her memory temporarily disabled, and if the analogy fails, where exactly does it fail? What becomes of the honour code's ownership language — what could it mean for a belief or a piece of knowledge to be someone's own — and what becomes of the line between an accommodation and a cheat, given that both work by coupling a student to an external system? Please also flag where you think we are simply inconsistent and where the apparent inconsistency dissolves under a better description, and be explicit about which of your claims are contested in the literature and which are ones you'd defend without hedging. Argue from the structure of the cases rather than from sources: I need something I can circulate to a committee of non-philosophers, so no citations, no footnotes and no suggested reading. Put the reconstruction first, the diagnosis of incoherence second, and any recommendations last, and mark clearly when you are speaking as a philosopher and when you are speaking as someone with a view about how a university should be run.
reasoning: |-
  Okay, the user is asking me to analyze their university's assessment rules through the lens of philosophy of mind, specifically the extended mind thesis. They want me to reconstruct the implicit view of cognition behind these rules, examine potential inconsistencies, and suggest how things might change if the committee took the extended mind thesis seriously.

  First, I need to understand the assessment practices described. There's this patchwork of rules: closed-book exams as default but allowing handwritten notes or formula sheets in some cases. Pre-made solutions are banned even if self-created. Calculators are permitted based on whether arithmetic fluency is being tested. Basic writing tools like spell-check are allowed but not autocomplete. Assistive technologies like dictation software are only accommodations for diagnosed disabilities. And the honor code defines dishonesty as presenting non-owned knowledge as one's own.

  The user is particularly bothered by that ownership language in the honor code. They see a tension with extended mind theory - the permitted formula sheet resembles external storage (like Otto's notebook in Clark & Chalmers' thought experiment), while banned tools resemble cognitive processing that extended mind theory might view as part of cognition.

  Before reconstructing the implicit view, I should do that uncharitable reading the user requested. The least charitable interpretation would be that these rules aren't based on any coherent theory of cognition at all, but rather: 1) Tradition and inertia favoring closed-book exams; 2) Unreflective distinction between "basic" tools (allowed) and "advanced" tools (banned); 3) Medicalized view of assistive tech that ignores how all tools extend cognition; 4) Anxiety about tech making exams "too easy"; 5) Crude proxy for knowledge ownership via physical isolation during tests.

  The charitable reconstruction would be that the rules presuppose a Cartesian internalism where cognition is strictly brain-bound. Under this view: The mind ends at the skull; external resources are merely causal inputs/outputs; knowledge must be internally stored; processing tools "do the thinking for you"; and accommodations are compensatory rather than recognizing extended cognition.

  Looking at how the rules map onto extended mind criteria: Formula sheets meet reliability and accessibility standards but fail automatic endorsement - students must consciously consult them. Whereas banned tools like autocomplete might actually score higher on automatic endorsement. The storage vs. processing distinction seems arbitrary - is consulting a formula really different from using a calculator? Both transform inputs to outputs.

  Crucially, the practice doesn't strictly require rejecting extended mind thesis. You could keep all these rules while believing cognition extends - you'd just be testing something narrower (disembodied knowledge). But the ownership language becomes problematic. If cognition extends, is a belief in Otto's notebook "his" belief? The honor code assumes internalism but doesn't logically require it.

  The rules are better explained by certification goals than metaphysics. Grades certify what a student can recall unaided, or demonstrate procedural skill without tools, or show they've internalized knowledge. The disability accommodation exception reflects a social commitment to equal access rather than a cognitive theory.

  If the committee took extended mind seriously, things would change radically: We'd ask what cognitive systems we want to certify. Open-book with all tools might become default. The honor code would shift from ownership to transparency about cognitive partnerships. Accommodations would be seen as revealing cognitive diversity rather than compensating deficits. But practical constraints remain - we still need to assess individual competence, not just network access.

  For recommendations: I'd suggest the committee focus less on metaphysical boundaries and more on what skills they're certifying. They could permit all non-collaborative tools while being transparent about what's being tested. The ownership language could evolve toward attribution of cognitive labor. And accommodations could be framed as tools revealing capability rather than compensating disability.
answer: |-
  ### Reconstruction of the Implicit View
  The assessment rules presuppose a **cognitivist internalism**: cognition ends at the biological brain, and external resources are mere tools *used by* the mind, not constitutive parts of it. This view draws sharp boundaries:  
  - **Storage vs. Processing**: External *storage* (formula sheets, notes) is tolerated as a memory aid, but *processing tools* (calculators, autocomplete) are banned because they "perform cognitive work" for the student.  
  - **Ownership as Internalization**: Knowledge "owned" by a student must be internally encoded. The honour code’s language implies that only internally stored knowledge can be authentically "presented as one’s own." External resources cannot be "owned" cognitively, only physically.  
  - **Parity Principle Rejected**: The rules implicitly reject Clark & Chalmers' parity principle ("if an external resource functions like internal cognition, treat it as such"). Instead, they adopt a *functional asymmetry*: internal processes are privileged over functionally equivalent external ones (e.g., handwritten notes vs. photographed solutions).  
  - **Checklist Criteria Applied Selectively**: Reliability and accessibility matter for *permitted* resources (e.g., formula sheets must be "reliably available" during exams), but automatic endorsement is ignored. Banned tools (e.g., autocomplete) might score higher on automaticity yet are forbidden.  

  This framework treats cognition as **brain-bound computation**, where tools are either passive repositories (allowed) or active cognitive agents (forbidden). 

  ### Diagnosis of Incoherence  
  1. **Storage/Processing Distinction Collapses**:  
     - A formula sheet isn’t passive—it’s actively consulted and interpreted. Conversely, a calculator doesn’t "understand" math; it executes algorithms, much like mental arithmetic. The distinction is pragmatic, not metaphysical.  
     - *Inconsistency*: Spell-check (processing) is allowed; autocomplete (also processing) is banned. Both transform input, but only one is deemed "too cognitive."  

  2. **Accommodations vs. Cheating**:  
     - Allowing dictation software for dysgraphia admits that cognition can be distributed across brain and tool. Yet banning it for others denies this principle. The *diagnosis* becomes an arbitrary boundary marker, not a cognitive one.  
     - *Inconsistency*: If the tool enables authentic expression for some, why not all? The rule conflates fairness with medicalization.  

  3. **Honour Code’s "Ownership" Problem**:  
     - If knowledge must be "one’s own," is a memorized formula more "owned" than one on a trusted notes page? Internal storage isn’t necessary for ownership (we "own" knowledge in libraries, phones). The code assumes internalism without justification.  

  **Where Incoherence Dissolves**:  
  - The rules *cohere pragmatically* as certification practices: Grades signal "unaided" competence in specific skills (e.g., arithmetic fluency). But this is a pedagogical choice, not a cognitive necessity.  

  ### Rival Explanations (No Metaphysics Needed)  
  The rules are better explained by **certification pragmatism** and **normative fairness**:  
  - **Skill Certification**: Exams test *specific, context-bound abilities*:  
    - Closed-book: Certifies recall under isolation.  
    - Formula sheets: Certify application, not memorization.  
    - Calculator ban: Certifies manual computation skill.  
  - **Fairness as Uniformity**: Uniform constraints feel "fairer" (e.g., banning photos prevents inequitable access to high-quality aids).  
  - **Accommodations as Leveling**: Compensating for disabilities aims for equal opportunity, not cognitive metaphysics.  

  **Philosophical Underdetermination**:  
  - The same rules could emerge from:  
    1. **Internalism** (mind is brain-bound).  
    2. **Extended Mind** (but testing only "biological core" for practicality).  
    3. **Embedded Cognition** (tools scaffold thinking but aren’t part of it).  
  The rules don’t *require* internalism—they’re compatible with all three if seen as pragmatic assessments.  

  ---

  ### Recommendations (as a Philosopher of Mind)  
  **If the Committee Embraced Extended Mind**:  
  1. **Reframe Assessments**: Ask, *"What cognitive systems should this exam certify?"*  
     - Permit all non-collaborative tools (calculators, notes, autocomplete) and test higher-order skills (e.g., problem design, critical evaluation).  
     - Example: Allow calculators everywhere but test complex modeling that requires conceptual mastery.  

  2. **Revise Honour Code**: Replace "knowledge ownership" with **"cognitive labor attribution."**  
     - Dishonesty = failing to transparently attribute sources (human or digital).  

  3. **Rethink Accommodations**: Treat *all* tools as cognitive extensions. Offer dictation software universally; diagnose only to allocate resources, not define "legitimate" cognition.  

  **Counterfactual Analysis**:  
  - *Is a closed-book exam like disabling memory?* **Partially.** For Otto (whose memories are in his notebook), seizing it *would* be disabling. But exams test *specific configurations* of cognition. Closed-book could still certify valuable skills (e.g., rapid recall under pressure) if explicitly justified as such. The analogy fails if recall isn’t the targeted skill.  

  **Concrete Changes for the Committee**:  
  - **Permit self-made solution sheets**: If a formula sheet is allowed, a photographed self-made solution is functionally identical.  
  - **Allow calculators universally**: Their ban is arbitrary; modern work requires tool-assisted computation.  
  - **Decouple accommodations from diagnosis**: Offer tools like dictation software to all students; avoid medicalizing cognitive diversity.  

  **Final Note (as a University Practitioner)**:  
  The rules aren’t metaphysically inconsistent—they’re *pedagogically outdated*. They prioritize 19th-century skills (isolated recall) over 21st-century cognition (tool integration). The extended mind thesis isn’t a mandate to allow everything; it’s a lens to design assessments that certify *relevant cognitive systems*. Shift focus from "what’s in your head" to "what can you do with your available mind."  

  **Contested Claims**:  
  - The storage/processing distinction’s collapse is widely accepted in cognitive science (critiqued by Wheeler, Rowlands).  
  - My recommendation to universalize accommodations is radical but defensible (e.g., feminist philosophy of disability).  
  - Underdetermination claim is my own: Rules reflect institutional habits, not metaphysical commitments.
