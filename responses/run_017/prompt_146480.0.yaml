prompt: |-
  hey — I'm taking an Enlightenment moral philosophy seminar this term and we're on Adam Smith's impartial spectator right now, and I can't work out what rule my professor is actually running. Every class she hands us a made-up case, we vote, then she tells us her verdict. So far:

  - Guy finds a wallet, returns it anonymously, nobody ever finds out, he feels a quiet calm satisfaction about it afterwards. Her verdict: the spectator approves.
  - In a town where everyone, even fully informed, thinks honor requires it, a man shoots a rival over a pretty trivial insult. Her verdict: disapproved.
  - A parent runs into a burning building and pulls out their own kid rather than two other kids, same effort either way. Her verdict: not disapproved — partiality is fine here.
  - A guy reads a detailed report on a famine, feels a flicker of concern, sends nothing, goes back to his day. Her verdict: disapproved, but only mildly, and mainly for the failure of attention rather than for the outcome.
  - Someone makes a big public donation mostly because he loves being seen as generous. Her verdict: the action passes, the agent doesn't fully — the spectator withholds something.

  I think at least three rules fit all five, and they split on the case she's giving us Friday. There's now an app half the campus uses, Spectator: you describe what you're about to do, and it returns an approval score, trained by averaging millions of people's gut reactions to cases after they've been given full information. Friday's case: Marla is a midlevel health bureaucrat who quietly shifts a budget line so an unglamorous program gets funded — best estimate is about two hundred statistical lives saved, in another country, five years out. Nobody ever finds out, there's no identifiable kid in a well photo, and Marla's actual motive is just that she ran the numbers and the numbers said do it; she feels no fellow-feeling for anyone. Spectator scores her at basically zero, because informed reactions to statistical foreign lives five years out are famously flat.

  So: does her spectator approve Marla? Note that on case five she split the verdict three ways, so I want your prediction on each — the action, the agent, and the motive. Then lay out the candidate rules you think fit her first five verdicts, what each one predicts about Marla, which you'd bet on and why, and the one further case you'd hand her next week to tell the rules apart.

  Keep it under 400 words and lead with the one-sentence verdict. Don't bother quoting Smith at me, I've got the book — I just want the rule.
reasoning: |-
  Okay, the user is in an Enlightenment moral philosophy seminar focusing on Adam Smith's impartial spectator. They're struggling to identify the consistent rule their professor is using across various case verdicts. The user has described five cases with the professor's judgments and now needs to predict the ruling on a sixth case about Marla, the health bureaucrat. 

  Hmm, this is an interesting puzzle. The professor seems to be applying a nuanced interpretation of Smith that focuses on impartiality, intention, and the quality of moral attention. Let me analyze the patterns across the cases:

  First, the wallet return shows approval for anonymous virtue - suggesting the action itself matters regardless of recognition. The duel disapproval indicates that social norms ("honor") don't override impartial morality. The parent case reveals context-dependent partiality is acceptable. The famine case is crucial - disapproval targets the agent's cognitive failure (inattention) more than the outcome. And the donation case splits judgment between action (good) and motive (flawed).

  For Marla's case, I suspect the professor will approve the action (saving lives is good) but disapprove the agent/motive due to complete lack of fellow-feeling. The Spectator app's zero score reflects human psychological limitations, not moral truth - which aligns with Smith's distinction between actual public opinion and the ideal spectator.

  The competing rules I see are:
  1) Consequentialism (would approve all)
  2) Motive purism (would disapprove Marla)
  3) Hybrid rule (matches professor)

  The hybrid rule seems to fit best: approval requires (a) good consequences, (b) adequate attention to moral factors, and (c) motives that aren't actively ignoble. Marla fails (b) and (c) despite (a). 

  To test this, I'd propose a case where someone does the right thing for deeply selfish reasons but with full moral awareness - say a lawyer working pro bono solely for career advancement while fully understanding the client's plight. That would distinguish whether cognitive attention alone suffices or if affective engagement is required.
answer: |-
  **Verdict:** Marla's **action** is approved, her **agent** is mildly disapproved (insufficient attention/fellow-feeling), and her **motive** is disapproved (purely calculative, lacking humanity).

  **Candidate Rules & Predictions:**
  1.  **Rule A (Consequentialist Impartiality):** Approve if net benefit is positive/optimal. *Predicts:* Approve Action, Agent, Motive for Marla.
  2.  **Rule B (Motive Purism):** Approve only if motive aligns with ideal sympathetic concern. *Predicts:* Disapprove Action, Agent, Motive for Marla (no fellow-feeling).
  3.  **Rule C (Hybrid Cognitive/Attentional):** Approve action if beneficial *and* agent exercised adequate impartial moral attention/judgment. Approve agent/motive if their process reflects suitable engagement with humanity. *Predicts:* Approve Action (saves lives), Disapprove Agent/Motive (inadequate attention to human impact, purely calculative).

  **Bet on Rule C.** It best fits the first five: approves beneficial action even if anonymous/disliked (Wallet, Donation *Action*), disapproves harmful norms (Duel), allows context-specific partiality (Parent), disapproves *inattention* (Famine), and splits judgment on flawed motives (Donation *Agent/Motive*). Rule A fails on Famine (action neutral, disapproval for attention) and Duel (local norm acceptance). Rule B fails on Wallet (no warm motive needed) and likely Donation *Action*.

  **Test Case to Distinguish:**
  *A doctor, personally disgusted by addicts but fully informed on evidence, provides life-saving care to one solely because hospital protocol mandates it. She feels no sympathy, only professional duty.*
  *   **Rule A:** Approve Action (saves life).
  *   **Rule B:** Disapprove Action/Agent/Motive (lacks sympathetic motive).
  *   **Rule C:** Approve Action (beneficial), *possibly* approve Agent based on cognitive duty-fulfillment despite motive flaw, but likely mild disapproval for lack of humanity. Your prof's verdict here clarifies if cognitive duty alone suffices for Agent approval.
