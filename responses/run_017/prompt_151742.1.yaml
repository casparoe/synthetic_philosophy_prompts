  Here’s a streamlined proposal addressing your requirements: two pages, interdisciplinary appeal, no citations, flagged empirical placeholders, and a clear wedge between two fairness claims. The structure prioritizes precision, methodology, and stakes for both audiences.

  ---

  **Project Title:** The Urn Problem: Compulsion, Consent, and the Twin Pillars of Sortition Fairness  

  ### Core Question & Stakes  
  *For Political Scientists:*  
  **"Does the legitimacy of real-world sortition require compulsory participation, and what institutional trade-offs emerge if it does?"** This directly impacts the design of citizens’ assemblies: if mandatory service is normatively necessary, policymakers face practical challenges (enforcement, attrition) that could undermine feasibility. If not, current volunteer models may need recalibrated fairness justifications.  

  *For Philosophers:*  
  **"Can the normative foundations of sortition (blindness vs. equal-chance fairness) survive the self-selection inherent in volunteer-based lotteries?"** I argue that conflating these pillars obscures whether real minipublics satisfy *either* standard, risking incoherent institutional legitimation.  

  ### The Blindness/Equal-Chance Wedge  
  Your distinction is astute but can be sharpened:  
  - **Procedural Neutrality (PN):** The lottery ignores *irrelevant properties* (e.g., wealth, charisma), preventing systemic bias in selection.  
  - **Ex Ante Egalitarianism (EAE):** All eligible citizens have equal *objective probability* of selection, valuing opportunity symmetry.  

  **The Urn Problem:** Real sortition draws from *volunteers*. [Empirical placeholder: Data needed on correlations between volunteering and traits like education/partisanship.] PN may hold *if* volunteering isn’t influenced by traits that distort neutrality (e.g., if stipends offset class barriers). EAE *cannot* hold under self-selection—volunteers have higher probabilities than non-volunteers. Yet EAE underpins "mirroring the people" rhetoric, while PN aligns with anti-factionalism.  

  ### Why Existing Defenses Leave This Open  
  - **Epistemic (diversity → better outcomes):** Assumes the pool is cognitively diverse, but volunteers may share traits (e.g., political engagement) that homogenize perspectives.  
  - **Anti-Factional:** PN alone might suffice, but if volunteers are disproportionately partisan [placeholder], factionalism persists.  
  - **Descriptive Representation ("mirroring"):** Explicitly relies on EAE—yet volunteers are rarely demographically identical to non-volunteers.  

  ### Methodology: 9-Month Work Plan  
  | Month | Activity | Deliverable |
  |-------|----------|-------------|
  | 1-2   | Conceptual analysis: Disambiguate PN/EAE in canonical sortition theories; define "irrelevant properties" for PN. | Typology of fairness claims; criteria for evaluating urns. |
  | 3-4   | Institutional review: Compare compulsory (juries) vs. volunteer (EU assemblies) models—participation rates, incentives, skew. [Empirical placeholders flagged throughout.] | Dataset of design choices; hypothesis matrix. |
  | 5-6   | Model selection effects: Simulate how volunteer uptake rates alter PN/EAE under varying assumptions (e.g., 10% vs. 40% volunteering). | Agent-based model scenarios; fairness trade-off thresholds. |
  | 7-8   | Test implications: Draft "institutional scorecards" assessing real cases against PN/EAE standards. | Policy brief: "When Does Sortition Need Compulsion?" |
  | 9     | Synthesis: Reconcile findings with democratic theory; outline legitimacy conditions. | Fellowship paper (8,000 words); conference presentation.  

  ### Why This Approach?  
  - **Conceptual Precision > Pure Analysis:** Isolates PN/EAE avoids vague "fairness" debates.  
  - **Formal Modeling > Case Studies:** Quantifies trade-offs generalizable beyond specific assemblies.  
  - **Policy Relevance > Abstraction:** Scorecards give designers actionable criteria.  

  ### Possible Conclusions  
  1. **PN-Only Viability:** Volunteer models satisfy anti-factional goals if biases are neutralized (e.g., via stratified sampling). *Deciding factor:* Whether volunteering correlates with *relevant* traits.  
  2. **EAE Necessity:** Compulsion is required if equal opportunity is non-negotiable. *Deciding factor:* If "mirroring" rhetoric is central to sortition’s legitimacy.  
  3. **Hybrid Model:** Stipend-driven volunteering approximates EAE if uptake is near-universal. *Deciding factor:* Empirical feasibility of high participation.  

  ### Failure Criteria  
  The project fails if:  
  - PN and EAE cannot be rigorously disentangled conceptually.  
  - Empirical placeholders reveal volunteering has *no systematic skew* (undermining the urn problem).  
  - All normative theories converge on identical institutional requirements.  

  ### Scope Risks & Mitigation  
  **Risk:** Debating compulsory participation could expand into theories of political obligation (+6 months). **Mitigation:** Focus on institutional designers’ feasible options—not ideal theory.  
  **Risk:** Modeling requires arbitrary assumptions. **Mitigation:** Use sensitivity analyses; present scenarios as "bounding cases."  

  ### Why the Distinction Works  
  Your cut is valid and operationalizable. PN/EAE clarifies why some theorists (e.g., epistemic democrats) prioritize PN, while others (egalitarians) demand EAE. The urn problem forces each camp to confront implementation limits—making this more than semantic.  

  --- 

  **Final Tightening for Page Limits:**  
  - Merge "Possible Conclusions" and "Failure Criteria" into one subsection.  
  - Shorten methodology to bullet points.  
  - Use tables sparingly (only if allowed).  

  This balances rigor with accessibility: philosophers see conceptual dissection; political scientists get design implications. The omission of citations keeps it lean—add them later where theorists are engaged implicitly (e.g., "epistemic defenses" for Landemore, "anti-factional" for McCormick).
