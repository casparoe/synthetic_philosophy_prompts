prompt: |-
  I'm helping to spend a smallish health budget — real money, a real vote — and our committee keeps splitting between programmes that buy a modest, well-measured improvement in how a lot of people feel and programmes that prevent or treat a handful of conditions (trigeminal neuralgia, cluster headache, that sort of thing) where patients describe the pain as unbearable. Before I write the short paper I owe everyone, I want the spec rather than the theory: what would a view about the moral weight of suffering as against happiness have to get right to be good enough to actually move money with?

  The family of views I keep half-convincing myself of is what I'll call lexical threshold negative utilitarianism, and I'll define it so we don't talk past each other: put pleasures and pains on a single intensity scale; below some threshold T of suffering the two trade off against each other in the ordinary aggregative way; at or above T suffering takes priority in the strong sense that no quantity of sub-threshold goods — not any number of people with mildly nicer lives — compensates for a single instance of it, which is the intuition behind the dust-specks-versus-torture case people always wheel out. What I want from you is the desiderata list such a view has to meet, each with the case or consideration behind it, and each marked non-negotiable or camp-preference. Here are the ones I already think are on it, which I want you to organise, sharpen, and tell me which are bogus: where T sits and why that isn't just gerrymandered to save the cases I like; the cliff problem, given that intensity looks vague, so a sorites across a long series of neighbouring cases either forces a sharp line somewhere arbitrary or breaks transitivity of better-than; what the unit of the threshold is — a single episode, a whole life, a person's lifetime distribution, a population; whether the trigger is really intensity or something like duration, unpredictability, or the subject's own retrospective attitude (the marathon, childbirth, the ascetic who recieves it as meaningful); which pain is even being counted when lived-through pain, remembered pain and anticipated pain come apart, which from what I've read they do, since remembered intensity seems to track the peak and the end rather than the total; and what to do when intensity can't be read off behaviour and the exposures are enormous but uncertain, as with fish or insects.

  I also want my own pet idea stress-tested rather than indulged: that pleasure has a compressed top end — the very best moments don't differ in intensity nearly as much as the very worst ones do — so maybe the lexical structure is really a derived fact about the shapes of the two distributions and the threshold is an artefact the theory should dispense with entirely. If it helps to pin the requirements down, here is the case the committee actually argued about: one patient with pain at nine-tenths of T lasting forty years, one patient with pain at eleven-tenths of T lasting ninety seconds, and money for only one of them. Tell me which of the requirements are just prejudices of one side, since I can drop anything that only matters if you already want the view to be elegant; tell me which single requirement does the most work in knocking out candidate views; and if some subset of the requirements cannot be jointly satisfied, say so and give me the argument, because if the list is itself a result I'd rather find out now — my guess is that lexical priority plus a vague threshold plus a genuine ordering is the unstable triple, but I want to see it done properly. You can rate the obvious candidates against the list in a line each if that helps, but keep the weight on the criteria. And skip anything like a reading list or citations; I have far too many tabs open already.
reasoning: |-
  Hmm, this is an intricate ethical dilemma wrapped in a practical policy question. The user is clearly deeply engaged with both the theoretical underpinnings and real-world implications of allocating health resources, and they're frustrated with committee deadlock. Their "lexical threshold negative utilitarianism" framework is unusually well-specified for a policymaker - they've clearly done their philosophical homework.

  What stands out is their pragmatic lens: they're not asking for academic perfection but for "specs" - functional criteria to actually move money. The fish/insect uncertainty mention suggests they've encountered effective altruism arguments but find them impractical for committee work. Their pet theory about asymmetric pain/pleasure distributions is intriguing and deserves serious engagement.

  The trigeminal neuralgia vs cluster headache examples reveal they're dealing with genuinely catastrophic pain conditions. This isn't about papercuts - these are "suicide headaches." That contextual gravity matters. Their ninety-seconds-vs-forty-years hypothetical feels like a distilled version of actual committee debates.

  Key tensions I need to address:
  - How to handle threshold vagueness without collapsing into arbitrariness
  - Whether duration/pattern matters when pain exceeds threshold
  - How to define the "unit" of suffering (episode? life?)
  - The measurement problem with non-human animals
  - Their asymmetry hypothesis as alternative to lexical thresholds

  The instability warning about lexical priority + vague threshold + genuine ordering is astute. I'll need to demonstrate that trilemma formally. For the desiderata list, I should:
  - Elevate their cliff problem to non-negotiable status
  - Treat threshold location as camp-preference (since no objective anchor)
  - Make transitivity non-negotiable to avoid cyclic decisions
  - Flag population-level application as practical necessity

  For their pet theory, the key stress test is whether pleasure compression alone can handle torture-vs-dust-specks cases without thresholds. I'll show mathematically how even with compression, lexicality might emerge from extreme disvalue avoidance.

  The committee case (40yr@0.9T vs 90s@1.1T) perfectly exposes the framework's tensions. If lexical, we must treat the 90s case even though intuitively the 40yr suffering seems worse. This forces confrontation with duration vs intensity tradeoffs at threshold boundaries.

  Ultimately they need decision rules, not philosophical closure. I'll structure the output to give them:
  1) Non-negotiable criteria they can't avoid
  2) Camp-preference issues where committee must choose
  3) Clear demonstration of the core instability
  4) Practical pathways through the trilemma
answer: |-
  Here's the distilled desiderata list for any viable suffering-priority framework in your budget context, organized by non-negotiables (NN) and camp-preferences (CP), with stress tests against your committee case. The core instability is confirmed: lexical priority + vague threshold + coherent ordering *is* mathematically irreconcilable without fudging.

  ### Non-Negotiables (Fail any = Framework Unusable)
  1. **Transitivity Preservation** (NN)  
     *Why*: If A > B and B > C, then A > C must hold. Breaks in Sorites chains (e.g., pain intensities from 0 to T in 0.1-unit steps) create cyclic preferences. *Your cliff problem is fatal if unsolved*.  
     *Stress test*: If 90s@1.1T > 40yr@0.9T (lexical), but 90s@1.0T < 40yr@0.9T (aggregative), and no sharp threshold exists, transitivity fails across intensities.  

  2. **Non-Arbitrary Threshold Anchor** (NN)  
     *Why*: T cannot be "gerrymandered" to fit trigeminal neuralgia/cluster headache. Requires empirical or conceptual grounding (e.g., pain causing loss of agency, suicidal ideation). *Saves your view from being ad hoc*.  
     *Stress test*: If T is defined as "pain worse than childbirth," but childbirth pain is retrospectively downweighted, T loses credibility.  

  3. **Operational Measurability** (NN)  
     *Why*: Must translate "unbearable pain" into observable metrics (clinical scales, biomarkers, behavior) for budget decisions. *Fish/insect uncertainty and remembered-vs-lived pain divergence break this*.  
     *Stress test*: If 90s@1.1T patient shows no measurable distress (e.g., stoicism), does it still count?  

  ### Camp-Preferences (Framework Choices, Not Truths)
  4. **Threshold Unit** (CP: Episode vs. Life)  
     *Why*: A 40yr@0.9T life may contain moments >T? If episodic, treat those moments; if lifetime, aggregate. *Committee conflict: "Unbearable" is episodic, but chronic pain erodes whole lives*.  
     *Stress test*: Treating 90s@1.1T (episode) may save $ now, but 40yr@0.9T (life) may cause more T-exceeding moments.  

  5. **Intensity vs. Holistic Suffering** (CP)  
     *Why*: Is T triggered by raw pain intensity, or modified by duration/meaning/predictability? Ascetics/marathon runners *contextualize* pain. *Your committee splits here*.  
     *Stress test*: If 90s@1.1T is predictable (e.g., medical procedure), is it still lexical?  

  ### Bogus/Overrated Desiderata (Drop These)
  - **Pleasure-Pain Symmetry**  
    Your pet theory is sound: evidence (e.g., Kahneman peak-end rule) shows pain has greater dynamic range. *But*: This doesn't resolve lexicality; even with compression, preventing torture may still outweigh oceans of mild joy if disutility is unbounded below.  
  - **Single "True" Pain Metric**  
    Lived/remembered/anticipated pain conflict is real, but policy needs *proxies* (e.g., peak distress). Not fatal.  
  - **Elegant Ordering**  
    Transitivity is non-negotiable, but completeness ("all pains ranked") isn’t. Vague thresholds can have "gray zones."  

  ### The Instability Argument (Lexical + Vague + Ordered = Impossible)  
  - Lexical priority demands sharp thresholds: Anything ≥T outranks all <T.  
  - Vagueness denies sharp boundaries: No non-arbitrary point where pain becomes lexical.  
  - Genuine ordering requires transitivity.  
    **Contradiction**: In a Sorites sequence (Pain₀=0, Pain₁, ..., Painₙ=T), lexicality requires a step where Painₖ < Painₖ₊₁ but Painₖ is aggregative and Painₖ₊₁ lexical. This violates transitivity if Painₖ > [mild harms] while Painₖ₊₁ ≫ [mild harms].  

  ### Stress-Testing Your Pet Theory (Pleasure Compression)  
  - **Strength**: Explains why we intuitively prioritize extreme pain: Bad >T is far worse than good <T is good. Avoids arbitrary thresholds.  
  - **Weakness**: Doesn't *require* lexicality. Compression could allow aggregative tradeoffs (e.g., a billion mild pleasures > one torture if disutility isn't infinite). Fails your dust-specks intuition.  
  - **Committee Case**: 90s@1.1T vs. 40yr@0.9T – compression says 90s pain is vastly worse per second, but 40yr has more *total* disutility? Then money goes to 40yr patient. *But this abandons lexical priority*.  

  ### Practical Pathway Through the Trilemma  
  1. **Abandon Genuine Ordering**: Admit gray zones (e.g., pains within 10% of T are incomparable).  
  2. **Anchor T Empirically**: Define T as "pain causing functional detachment" (e.g., inability to converse). *Makes T measurable*.  
  3. **Prioritize Episodic >T Suffering**: Treat *any* occurrence of ≥T pain as an emergency, regardless of duration.  
     - *Committee case outcome*: Fund the 90s@1.1T intervention.  
  4. **Use Holistic Metrics**: Include duration/agency-loss (e.g., "pain-severity × helplessness-hours").  

  ### Which Requirement Does the Most Work?  
  **Transitivity Preservation**. It forces the threshold to be sharp or the priority to be non-lexical. Every candidate view fails here without workarounds.  

  ### Candidate Views Rated  
  - **Classic Lexical NU** (NN1,2,3 fail): Arbitrary T, vague cliffs, immeasurable.  
  - **Aggregative + Pain Compression** (Passes all NN): Treats your committee case as 40yr > 90s. Lacks torture-dust specks priority.  
  - **Gray-Zone Lexical** (Passes NN1,3; NN2 weak): T has buffer zone. Committee case: 90s@1.1T wins if "clearly" >T.  
  - **Suffering-Focused Welfarism** (NN pass): Weight disutility non-linearly (e.g., log scale). Committee case: Math determines winner.  

  ### Bottom Line  
  Your framework *can* move money if you:  
  - Define T via measurable crisis (e.g., "pain requiring ER intervention"),  
  - Accept episodic treatment,  
  - Forgive small threshold gray zones.  
  **Otherwise, abandon lexicality** for a steeply weighted aggregative view – it satisfies all non-negotiables and handles vagueness, but betrays the "no compensation" intuition. The trilemma is real; elegance must yield.
