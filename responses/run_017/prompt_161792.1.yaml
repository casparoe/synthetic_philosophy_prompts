prompt: |-
  So I'm running the Hart–Devlin session in my second-year jurisprudence seminar next week and I want to do something other than re-run the Wolfenden material, which they've all read and which they can all parrot back at me. Here's the case I want analysed instead.

  The episode: on 22 May 2015 Ireland amended its constitution by referendum so that marriage may be contracted by two persons without distinction as to their sex — 62% yes on a turnout of about 61%, and the first time any state did that by popular vote rather than by legislation or court order. Background you'll need, all of it uncontested: male homosexual acts were criminal offences in Ireland until 1993, under nineteenth-century statutes inherited from Westminster; when the Irish Supreme Court upheld those laws in the early 1980s it reasoned partly from the Christian character of the state and from the protection of marriage and public health; decriminalisation came only after the European Court of Human Rights held that the ban breached the privacy guarantee in the Convention. So within one generation you have a society enforcing a moral code through the criminal law, then solemnly voting to entrench the opposite in its constitution.

  What I want is Devlin's own machinery run on this, not Hart's caricature of it: the claim that a shared morality is among the things that hold a society together, that a society may defend it the way it defends its government, that no limit is fixed in advance, and that the test is supposed to be an empirical one about what ordinary people actually feel — intolerance, indignation, disgust — measured, in his hands, by something like a jury. So: what does that theory say the 1983 court was doing, and what does it say the 2015 electorate was doing? If the morality of a society is whatever the measurement device happens to record, Devlin's view seems to track opinion and hand you opposite verdicts forty years apart on the same conduct. Is that a reductio, or is it a sign I've misdescribed him? Can he separate "the morality of the society" from "whatever a majority will vote for this decade" without smuggling in critical morality — and if he can, has he quietly become Hart?

  Here's a distinction of my own that I want tested, and I'll flag it to the students as mine: call it enforcement-elasticity. Some moralised norms are elastic — enforcement is part of what sustains the practice, so the amount of the conduct really does respond to whether it's criminal, and the ban helps constitute what the institution is. Others are inelastic: decriminalising can't change how much of the conduct there is, only how visible it is. If the disintegration worry needs some contagion or imitation mechanism to get going, then for the inelastic norms there's nothing for that mechanism to bite on, and the state has no disintegration-based reason to enforce. Does that yield a defensible restricted legal moralism — enforce the elastic ones, hands off the inelastic ones — or does it gut Devlin, given that the examples he's associated with are the inelastic ones? Then put the obvious Devlin reply in a student's mouth and answer it honestly: that the moral environment shapes desire and self-identification across a generation, so incidence isn't independent of law after all, and that visibility is itself what unravels a shared code. Is that reply empirical, and what would settle it?

  Then run it the other way. What does the episode do to Hart? His positive-versus-critical morality distinction looks comfortable here and the harm principle looks like it's doing the work — but notice that Ireland 2015 is the cleanest measurement Devlin could ever have hoped for: a national vote on exactly the question, no judicial imposition, no elite capture. If his theory can't survive its own best-case data, that's worth saying. Is the view unfalsifiable: whatever the society's morality turns out to be, he says law should follow it, so he can only ever be wrong about the mechanism and never about the content?

  Last thing: institutions, and silence. Devlin wanted this settled by something like a jury or a legislature, not by philosophers, and in the same year the US Supreme Court imposed the same result against majority opinion in many states. Which route does his theory prefer, and does it have any resources for criticising the court route? And where is the framework silent — about rights, about what counts as the society whose morality is authoritative (Ireland 1983 or Ireland 2015?), about minorities inside the polity, about whether "disintegration" is a claim anyone could check afterwards?

  Be disciplined about the mapping: say who the relevant "we" is, what counts as evidence of a society's morality, what the theory predicts and what it misdescribes, and tell me where it's simply silent rather than forcing it to speak. Finish with a short verdict on whether this case helps Devlin, hurts him, or shows that the debate was never really about cases like this one. (Readings are Devlin's Enforcement of Morals and Hart's Law, Liberty and Morality, but I don't need citations — I know that literature, I want the argument.)
reasoning: |-
  Okay, the user is preparing for a jurisprudence seminar on the Hart-Devlin debate and wants to use Ireland's 2015 same-sex marriage referendum as a case study instead of the typical Wolfenden Report material. They've outlined several complex theoretical questions about Devlin's legal moralism and how it applies to this rapid societal shift.

  First, I need to reconstruct Devlin's actual position carefully. His core argument is that society's shared morality is essential for cohesion, and that law should enforce whatever morality the "reasonable person" or "jury" deems fundamental. The Irish case presents a fascinating challenge - within one generation, the state went from criminalizing homosexuality to constitutionalizing same-sex marriage through popular vote.

  The key tension here is whether Devlin's theory can distinguish between "society's morality" and temporary majority opinion. The 1983 Supreme Court claimed to reflect Irish morality by upholding anti-sodomy laws based on Christian values, while the 2015 referendum suggests morality completely reversed. This seems problematic for Devlin - if morality is just whatever the measurement device (jury, legislature, referendum) says at any given time, the theory becomes relativistic and circular.

  The user introduces an interesting concept called "enforcement-elasticity" - the idea that some moral norms depend on legal enforcement to maintain them ("elastic"), while others exist independently of law ("inelastic"). For Devlin, homosexuality might be an inelastic norm (people don't choose orientation based on laws), yet he still advocated its criminalization. His likely reply would be that law shapes moral environment over generations - visibility leads to normalization, which changes morality. But this raises empirical questions Devlin doesn't answer: how long does this take? What evidence would prove/disprove it?

  For Hart, this case seems to fit neatly with his harm principle and critical morality approach. But interestingly, the 2015 referendum was Devlin's ideal measurement tool - a direct popular vote. If his theory can't survive this best-case scenario, it suggests flaws. Hart might counter that even referendums can reflect prejudice rather than reasoned morality.

  On institutions, Devlin clearly prefers legislative/jury decisions over judicial imposition (contrast Ireland's referendum with US Supreme Court's Obergefell decision). But his theory doesn't specify which institution best captures societal morality, or how to handle minority rights. It's silent on how to define the relevant society (1983 vs 2015 Ireland) and offers no way to verify the "disintegration" hypothesis.

  The user wants disciplined mapping: Who is "we"? (Devlin assumes a homogenous society, ignoring minorities). What counts as evidence? (He privileges intensity of feeling but doesn't operationalize it). Where is the theory silent? (On rights, minority protections, empirical verification).

  Ultimately, this case hurts Devlin by exposing circularity in his definition of societal morality and lack of safeguards against majority tyranny. But it also shows the debate wasn't really about such rapid moral changes - both Hart and Devlin assumed more static moral environments. The Irish case demonstrates that law can actively reshape morality through visibility and normalization, which neither theorist fully anticipated.
answer: |-
  Here's a disciplined mapping of Devlin's machinery onto the Irish case, addressing your core questions and distinctions:

  ### 1. **Devlin's Theory Applied: 1983 Court vs. 2015 Electorate**
      *   **The "We":** Devlin's "society" is the *politically sovereign community*, assumed relatively homogenous in its "shared morality." For Ireland 1983, this was the Irish people as understood by the Supreme Court (largely Catholic, traditional).
      *   **Evidence of Morality (1983):** The Court used explicit constitutional provisions (Christian character of the state, protection of marriage), historical context (inherited criminal law), and its *interpretation* of prevailing social attitudes (rooted in Catholicism) as evidence of the "intolerance, indignation, disgust" towards homosexuality. They acted as Devlin's "jury," measuring the moral feeling they believed existed.
      *   **What the 1983 Court Was Doing (Per Devlin):** Defending a perceived fundamental pillar of society's shared morality (traditional Christian marriage/sexual ethics) using the criminal law as a shield against disintegration. The Court saw homosexuality as an attack on the institution of marriage and public morals.
      *   **Evidence of Morality (2015):** The referendum itself *is* Devlin's ideal measurement device – a direct, national vote expressing the "intolerance, indignation, disgust" threshold. A large majority (62%) expressed profound *acceptance* and *affirmation* of same-sex marriage, indicating a fundamental shift in the shared moral view on marriage and sexuality.
      *   **What the 2015 Electorate Was Doing (Per Devlin):** Solemnly defining and entrenching the *new* shared morality regarding marriage. They were exercising society's right to defend its *current* fundamental moral code (now inclusivity and equality in marriage) against the *old* code perceived as unjust. Disintegration, in this view, would now be threatened by *failing* to recognise same-sex marriage, causing alienation and fracture.
      *   **The Relativism Problem:** **This *is* a major problem for Devlin.** If the "morality of society" is simply "whatever the current measurement device (jury, legislature, referendum) says it is," then:
          *   The theory is **profoundly relativistic** and **historically contingent**. What's fundamental and disintegration-threatening in 1983 is morally required and cohesion-building in 2015.
          *   It **lacks a stable core**. Devlin argued morality was essential glue, but this glue's composition changes radically within a generation. Was the *old* glue not essential? Or is the *new* glue weaker?
          *   **Is this a *reductio*?** It highlights a critical weakness. Devlin *tries* to avoid pure majoritarianism by emphasizing the "reasonable person/jury" measuring "intolerance, indignation, disgust" towards acts seen as fundamentally subversive. But in practice, without anchoring in critical morality (which he explicitly rejects), the "fundamental" *is* defined by the current majority sentiment, however measured. He **cannot cleanly separate "society's morality" from "whatever a majority will vote for this decade"** without implicitly relying on a conservative bias that the *past* measurement reflected the *true* fundamental morality. **Yes, he risks collapsing into Hart** if he tries to introduce an objective standard for what *counts* as "fundamental" morality beyond current feeling, which he explicitly forbids.

  ### 2. **Your Distinction: Enforcement-Elasticity**
      *   **The Distinction:** Elastic norms (e.g., tax compliance, property rules) depend heavily on enforcement for prevalence. Inelastic norms (e.g., sexual orientation, core religious beliefs) exist largely independent of legal prohibition.
      *   **Applying it to Devlin:** Homosexuality (Devlin's prime example) is **paradigmatically *inelastic***. Criminalisation didn't stop people being gay, only forced them into secrecy.
      *   **Does it Gut Devlin? Absolutely.** His disintegration thesis *requires* that tolerating the practice (even if inelastic) fundamentally erodes the shared moral code *simply by its visible existence and implied acceptance*. If incidence doesn't change (inelastic), then the *only* thing changing is visibility and social acceptance. Devlin's core argument is that **visibility *is* the contagion mechanism.** Seeing the practice tolerated, even if rare, signals its acceptability and undermines the norm's perceived fundamentality.
      *   **The Obvious Devlin Reply (Student's Mouth):** "You misunderstand! Law isn't just about stopping acts; it's about *defining the moral environment*. Criminalisation sends a powerful signal about what society *fundamentally* condemns. Decriminalisation (and later, constitutional recognition) sends the opposite signal. Over a generation, this shapes desire, self-identification, and social attitudes. People are *more likely* to explore or accept same-sex attraction in a tolerant environment, increasing visibility and normalisation, which further unravels the *old* shared code. The law changes the *meaning* and *social weight* of the conduct, even if the core impulse is inelastic. Visibility *is* the bite of the contagion mechanism – it forces moral confrontation and normalises the 'deviant.'"
      *   **Is this Reply Empirical?** **Yes, entirely.** It makes claims about social psychology, identity formation, and norm diffusion over time.
      *   **What Would Settle It?** Longitudinal sociological and psychological studies tracking:
          *   Changes in self-reported sexual identity/attraction pre/post-decriminalisation/recognition.
          *   Shifts in social attitudes towards homosexuality and same-sex marriage over time, correlating with legal changes.
          *   Studies on the impact of visibility (media representation, open relationships) on individual attitudes and self-perception, particularly among younger generations.
          *   Comparisons between jurisdictions with different legal trajectories.
          (Evidence since 1993 in Ireland and elsewhere *strongly supports* the empirical claims in the Devlin-esque reply.)

  ### 3. **What the Episode Does to Hart**
      *   **Comfort for Hart:** Hart's distinction shines. The 1983 Court arguably enforced *positive* morality (traditional Catholic Irish views). The 2015 vote reflected a shift in positive morality *towards* a view arguably more aligned with *critical* morality (based on equality, autonomy, harm principle). Hart's harm principle provides a clear, stable(ish) justification for decriminalisation and recognition, avoiding the relativism trap.
      *   **Devlin's Best-Case Data:** This is crucial. **The referendum *is* Devlin's ideal measurement – direct, popular, on the moral question.** If his theory yields opposite conclusions 30 years apart *based on its own preferred method*, it highlights the instability and relativism inherent in defining "society's morality" solely by contemporary sentiment. It suggests the theory lacks a coherent account of moral truth or social cohesion beyond majority feeling at time T.
      *   **Is Devlin's View Unfalsifiable on Content?** **Largely yes.** Devlin doesn't prescribe *what* the morality *should* be, only that law *should* enforce whatever the fundamental shared morality *is* (as measured). He can only be "wrong" if:
          *   The measurement device is flawed (e.g., legislature out of touch, jury biased – but a referendum minimizes this).
          *   His claim that *enforcing* shared morality is *necessary* for social cohesion is empirically wrong (difficult to prove/disprove definitively – did Ireland disintegrate after 1993? Did cohesion *increase* after 2015?).
          *   He misidentifies what is truly "fundamental" (but he has no objective standard for this).
      The *content* itself is determined by the measurement, so the theory adapts to *any* content. This is a major weakness exposed by the rapid Irish shift.

  ### 4. **Institutions, Silence & Other Gaps**
      *   **Preferred Route:** Devlin **explicitly prefers** legislative/jury routes (like Ireland's referendum and initial criminal laws) over judicial imposition (like the ECtHR or US Supreme Court in *Obergefell*). He distrusts "philosopher kings."
      *   **Criticising the Court Route:** Devlin would likely argue courts (especially supra-national ones like the ECtHR in 1993) are *poor* measurement devices for a *specific society's* fundamental shared morality. They are elite, unrepresentative, and apply abstract principles rather than gauging the specific "intolerance, indignation, disgust" of the Irish people. He would see the 1993 ECtHR ruling as *imposing* an external morality, not reflecting Ireland's own.
      *   **Silences & Gaps:**
          *   **Rights:** Devlin's framework has no robust concept of individual rights *against* the majority's moral will. Rights only exist insofar as society's morality grants them.
          *   **Defining "The Society":** Which temporal slice is authoritative? 1983 Ireland or 2015 Ireland? Devlin offers no principled way to choose. He assumes continuity, but rapid change breaks this.
          *   **Minorities:** Devlin pays scant attention to the impact of enforcing majority morality on minorities. The Irish case highlights this – the gay minority suffered under the old morality. His theory offers them little protection beyond hoping the majority changes its mind.
          *   **"Disintegration" - Verifiability?** This is a core weakness. What counts as disintegration? How much is needed? How do we prove the *lack* of enforcement *caused* it (vs. other factors)? Devlin's claim is speculative and unfalsifiable in practice – Ireland didn't disintegrate post-1993; did cohesion *increase* post-2015? It's a nebulous, fear-based justification.

  ### 5. Short Verdict
  **This case significantly hurts Devlin.** It exposes the **deep relativism** at the heart of his theory when confronted with rapid, measurable moral change using *his own preferred empirical method* (the referendum). It highlights the **instability** of defining "fundamental" morality solely by contemporary majority sentiment and the **danger to minorities** inherent in this approach. While his potential reply on law shaping moral environments over generations is empirically plausible, it doesn't rescue his core theoretical structure from the charge of being merely descriptive of majority will at any given time, lacking a normative anchor. It shows the debate **wasn't primarily about cases of such rapid, empirically verifiable shifts in *positive* morality**, but rather about more static or contested areas. The case strongly favors Hart's distinction between positive and critical morality and his harm principle as providing a more stable, liberal foundation for law. Ireland 1983-2015 is a powerful demonstration of the perils of Devlin's legal moralism when the majority changes its mind.
