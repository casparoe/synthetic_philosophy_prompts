answer: |-
  Below is a step-by-step procedure based on archaeological inference (specifically **middle-range theory** and inference philosophy) to vet your object-to-belief leaps. It's designed for **speed (under 30 min)**, **practicality** (no new reading required), and **honesty** about where evidence ends and creativity begins. I'll explain key concepts in plain terms, then apply it to your three cases.

  ### Core Concepts (Simplified)
  - **Middle-range theory**: The "move" you’re making badly. It’s the bridge between static artifacts (e.g., clay cones) and dynamic human behavior (e.g., rituals). *The mistake*: Assuming an artifact *directly* reflects a belief without testing if it could reflect something simpler (e.g., a door socket, not a spirit trap). *The fix*: Rule out functional/practical uses first, then consider symbolic meanings *only if* the practical explanations don’t fit.
  - **Inference gap**: Artifacts show **behavior** (what people *did*), not beliefs (what they *thought*). Beliefs are inferred *if* the behavior is repeated, patterned, and impractical without shared intent. A "meaning" requires **consistency** (same object used the same way in similar contexts) and **exclusion** (it can’t be explained by survival, economics, or accident).
  - **What the procedure CAN’T do**:  
    - Prove **specific beliefs** (e.g., "feared river spirits"). Beliefs are always interpretive leaps.  
    - Resolve **equifinality** (multiple beliefs fit the same artifact pattern).  
    - Compensate for **missing evidence** (e.g., rotted materials that carried meaning).  
    - Validate **distant/loose parallels** (e.g., "similar" objects 300 miles away). These are inspiration, not proof.  
    - Confirm **individual motivations** (e.g., "the tally-keeper felt proud"). Objects reveal group practices, not personal feelings.

  ---

  ### The Procedure: 7 Steps (Run in Order, Stop at First "No")
  1. **Function first**: *Could this object have a practical, non-symbolic purpose?* (e.g., weight, tool, structural part).  
     - ✅ **Good answer**: All obvious practical uses are ruled out by context (e.g., cones are too fragile for daily use as doorstops).  
     - ⚠️ **Stop & write "we don’t know" if**: A practical use fits *as well as* a symbolic one.  
     - 🔶 **Creative decision point**: If practical use is *possible* but weak for your story, you invent—but flag it in the author’s note.

  2. **Pattern test**: *Is the object’s use consistent and context-specific?* (e.g., always in thresholds, never in trash pits).  
     - ✅ **Good answer**: Clear pattern (e.g., *only* in thresholds of big houses, *always* in pairs).  
     - ⚠️ **Stop & write "we don’t know" if**: Pattern is spotty or could be coincidence (e.g., 3 snapped cones out of 40 isn’t a strong trend).  

  3. **Behavior, not belief**: *What concrete action does the artifact directly imply?* (e.g., "people placed cones in doorways").  
     - ✅ **Good answer**: Simple, observable behavior (e.g., "deliberate placement," "ritual breakage").  
     - ⚠️ **Stop & invent if**: You catch yourself implying thought ("they believed..."). Describe the *action* only.  

  4. **Belief test**: *Is the behavior impractical without shared intent?* (e.g., snapping clay cones has no survival benefit).  
     - ✅ **Good answer**: Yes—and no practical alternative exists (e.g., breaking cones weakens them, so it must be symbolic).  
     - 🔶 **Creative decision point**: If "yes," you can infer a **general intent** (e.g., "thresholds held significance"). Avoid specifics ("kept demons out").  

  5. **Institution test (for practices)**: *Does the behavior require organization?* (e.g., tally systems imply record-keeping, not necessarily an office).  
     - ✅ **Good answer**: Evidence of **standardization** (e.g., identical pebble sizes), **scale** (e.g., 200 pebbles = beyond household use), or **association** (e.g., found in a public building).  
     - ⚠️ **Stop at "practice" if**: It could be one person’s habit (e.g., a farmer counting his own grain).  

  6. **Paralysis check**: *Is this equifinality (multiple beliefs fit equally well)? Or missing evidence?*  
     - ⚠️ **Flag for author’s note**: If yes (e.g., "bound wrists could indicate punishment OR ritual").  

  7. **Creative green light**: *Does this support the story without contradicting evidence?* If yes, invent—but **constrain** the invention to the narrowest plausible interpretation (e.g., "thresholds were ritually significant" not "they worshipped door gods").

  ### When to Email the Dig Director
  **Only after Step 4**, if the answer is ambiguous and you need to rule out a practical use or confirm a pattern. Ask **one** type of question per case:  
  - "Is [object] ever found in [context] outside Hallow Reach?"  
  - "Could [object] have been used for [practical function] given its material/design?"  
  - "Is there evidence of [material] that didn’t survive (e.g., wood, cloth) in similar finds?"  

  ---

  ### Applying the Procedure to Your Cases
  **Case 1: Clay Cones in Doorways**  
  - **Step 1 (Function)**: Could be loom weights or door sockets? Loom weights are usually not placed in pairs at thresholds. Door sockets don’t snap cleanly. *Functional use possible but weak*.  
  - **Step 2 (Pattern)**: Strong pattern—only thresholds, big houses, paired, inward-facing. Snapped in 3 cases? Minor inconsistency.  
  - **Step 3 (Behavior)**: "People placed paired clay cones in thresholds, sometimes snapping them first."  
  - **Step 4 (Belief)**: Snapping weakens cones—impractical unless symbolic. Supports **generalized threshold significance**.  
  - **Strongest sentence**: "The people of Hallow Reach placed fired-clay cones in the thresholds of important buildings, often breaking them before setting, suggesting thresholds held ritual importance."  
  - **What you can’t claim**: "They believed spirits entered through doors." (Equifinality—could be ancestral protection, status display, etc.)  
  - **Creative green light**: Yes—invent specifics (e.g., "warding" customs), but tie to *thresholds*, not broader cosmology.  

  **Case 2: Counting Stones**  
  - **Step 1 (Function)**: Pebbles + pitted stone = tally system. No other practical use fits. ✅  
  - **Step 2 (Pattern)**: 200 pebbles in 11 grades + stone with matching pits = strong standardization. Under floor? Suggests storage/security. ✅  
  - **Step 3 (Behavior)**: "People used graded pebbles and pitted stones to record quantities, likely of grain."  
  - **Step 4 (Belief)**: Tallying implies shared understanding of measurement—but not necessarily a belief.  
  - **Step 5 (Institution)**: Scale (200 pebbles) and standardization (11 grades) imply **organized record-keeping beyond one household**. Under-floor hiding suggests communal value. Offices require **context** (e.g., in a temple/administrative building) or **associated artifacts** (e.g., seals, writing). *You lack these*.  
  - **Strongest sentence**: "Hallow Reach used standardized pebble tallies and counting stones for grain or goods, indicating organized record-keeping—likely managed by designated individuals."  
  - **What you can’t claim**: "A levy officer oversaw grain collection." (No evidence of hierarchy/coercion.)  
  - **Creative green light**: Invent an "office," but ground it in practice (e.g., "the tally-keepers of the granary").  

  **Case 3: River Burials with Bound Wrists**  
  - **Step 1 (Function)**: Bound wrists = restraint. Face-down in river = deliberate placement. Not accidental. ✅  
  - **Step 2 (Pattern)**: Two similar burials (bound wrists, one with hands removed) in water context. Minor inconsistency (hands removed in one) but pattern holds. ✅  
  - **Step 3 (Behavior)**: "People bound the wrists of some dead and buried them face-down in river channels."  
  - **Step 4 (Belief)**: River burial + restraint = impractical without intent. Supports **generalized river significance** and **ritual punishment or offering**.  
  - **Step 5 (Institution)**: Public ritual? No evidence (e.g., no mass grave, no artifacts tied to crowds).  
  - **Equifinality check**: Bound wrists could mean **criminal execution**, **sacrifice**, or **fear of the dead**—all fit equally.  
  - **Strongest sentence**: "Some individuals in Hallow Reach were bound and buried face-down in the river, suggesting the waters held ritual importance—perhaps for judgement, punishment, or appeasement."  
  - **What you can’t claim**: "Trials by ordeal were public rituals where guilt was decided by the river." (No evidence for public spectacle, "innocence" concept, or divine verdict. Hands removed suggests mutilation, not trial.)  
  - **Creative green light**: Keep the scene, but in the author’s note, clarify: "The river judgement is fictional; archaeological evidence shows bound river burials but not their social context."  

  ---

  ### Final Summary
  - **What the procedure gives you**: A way to isolate *behaviors* (what people did) and *practices* (what they repeated), then cautiously infer *generalized intent* (e.g., "thresholds were significant").  
  - **What it can’t do**:  
    - **Recover specific beliefs** (e.g., "feared door-demons").  
    - **Resolve ambiguity** when evidence supports multiple interpretations (equifinality).  
    - **Compensate for organic decay** (e.g., a wooden idol that rotted would've explained the cones).  
    - **Validate institutions** without evidence of scale/standardization (e.g., "offices" need more than one bag of pebbles).  
  - **When to invent**: After Step 4 if behavior is impractical without intent, or after Step 5 if institutions serve the story—but **constrain inventions to the narrowest interpretation** the evidence allows.  
  - **Author’s note strategy**: Use "suggest," "likely," or "may have" for inferences. For inventions, say: "While [objects] imply [behavior], scenes depicting [specific belief/institution] are imaginative reconstructions."  

  This roots your fiction in plausible inference while freeing you to create—without overclaiming. Run it fast, trust your pattern-testing, and when in doubt, focus on what people *did*, not what they *thought*.
