  ### Key Implementation Notes:
  1. **Task Design Crucial**: Pre-print task cards with conflicting options to guarantee the Talker lacks access to the Silent Partner's reason. Test tasks beforehand.
     
  2. **Confabulation Trigger**: After EACH task, cold-call Talkers: "Why did you choose that?" Don't ask "Why did your partner...?" - use first-person framing.

  3. **Vote Mechanics**: 
     - After each throttle level, ask: "Raise hand if you see ONE subject." 
     - Record counts on whiteboard in 3 columns (Level 0/1/2). 
     - Later reveal what each level tracked (access/agency/narrative).

  4. **Time Savers**: 
     - Use same 3 task types across levels (adjust stimuli) 
     - Pre-pack envelopes with all materials per pair

  5. **Deflation Defense**: If someone says "Always two", ask: "When the hand pointed, did the Talker feel surprise? Who claimed ownership of the action?" 

  6. **Phenomenology Bridge**: During debrief, ask Talkers: "When you gave wrong explanations, did it FEEL like guessing or like you knew?" 

  The activity forces participants to:
  - Experience access splits (via confabulation) 
  - See agency unity without access unity (correct actions/wrong reasons) 
  - Confront unity as a functional threshold 
  ...while leaving shared embodiment/phenomenology for explicit discussion.
