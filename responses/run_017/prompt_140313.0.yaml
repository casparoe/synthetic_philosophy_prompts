prompt: |-
  hey — I'm in a third-year seminar on consciousness this term and I've been handed one 50-minute slot to run for the rest of the group. 14 people, mixed: about half have already read something on the split-brain / commissurotomy cases, half haven't, and the room is a normal seminar room (one big table we can all sit round, a whiteboard, no tech beyond that). My slot is on split-brain cases and the unity of consciousness.

  I really don't want to stand at the front and talk at them, I want them to run into the thing. What I'd like them to come away seeing is that "unity of consciousness" isn't one claim: that being able to report something, being able to act on it, and its being experienced together with your other experiences can come apart, and that once the split-brain cases are on the table you have to say which of those you actually cared about. My prof keeps seperating access unity (roughly: what's available to the same reporting-and-control system, whatever exactly that cashes out to) from phenomenal unity (the felt togetherness of experiences at a time), and she also keeps insisting that "one mind" and "one agent running one body" are different claims again. Whatever you give me should make at least two of those come apart as something the participants feel while they're doing it, not something I announce at the end.

  My own half-baked idea — tell me if it's any good or if it teaches something false: put them in pairs, one person is the "talking side" (can speak and write, but can't see what's presented to, say, their left) and the other is the "silent side" (can see it, can only point, push, or move objects around). Run a set of short tasks where the pair has to respond as a single person, then afterwards the talker has to explain why they responded the way they did — and they were never told what the silent side saw. Then repeat with a dial on the channel between them: zero contact, then one bit (yes/no), then a single word, then free writing — and at each setting the room votes on whether this is one subject or two cooperating ones. I like the dial because it turns a yes/no question into a threshold question, but I can't tell whether it teaches something true about the cases or just gets people trading intuitions about bandwidth.

  So: design me the actual thing. Materials limited to paper, index cards, envelopes or folders, maybe a screen made of a couple of ring binders. Rules that make them hit the problem on their own — the confabulation should happen because of how I've set the incentives up, not because I told anyone to make up a story. A minute-by-minute plan for the 50. A debrief that maps specific moments in the activity onto the distinctions above, plus the honest part: which bit of the debate the activity can't reproduce at all and I'll just have to say out loud afterwards (I'm guessing something about the actual phenomenology, and about the fact that in the real cases both sides still share one body, one brainstem, one homeostatic system — but you tell me). And tell me what will predictably go wrong the first time I run it: I'm expecting at least one pair to cheat, and at least one person to say "well obviously it's two people the whole time" and deflate the exercise.

  For the format — I want to be able to paste this into my notes app, so give me the deliverable as a single JSON object and spell out the schema yourself as you go. At minimum I want: "materials" and "setup_minutes"; "roles"; "rules" (an array of short numbered rules I can read out); "timeline" (array, one object per block: minutes, what participants do, what they should run into, the failure mode for that block, and how I handle it); "throttle_scheme" (array, one object per bandwidth level: what's allowed, what behaviour I should watch for, what verdict I collect from the room, and what that verdict is actually tracking); "debrief" (array: moment in the activity, the distinction it maps onto, one line I can say); "goes_wrong" (array: what, why, fix); "cannot_reproduce" (array: feature, why not, what I have to supply instead); "check_for_understanding" (one question I can ask at the end that would show they got it rather than just enjoyed it); and "verdict_on_my_dial_idea" (keep it, fix it, or bin it — and if you bin it, the replacement mechanic in the same JSON).
reasoning: |-
  We are going to design a seminar activity that meets the objectives. The goal is to have participants experience the separation of access unity and phenomenal unity (and potentially other distinctions) through a simulation of split-brain phenomena.

  Key ideas from the user:
  - They want participants to feel the distinction, not just hear about it.
  - The user's half-baked idea involves pairs with one "talking side" and one "silent side", and then throttling the communication between them.

  We'll refine the user's idea. The core of the activity will be:
  1. Participants in pairs: one as the "Talker" (left hemisphere analog) and one as the "Silent Partner" (right hemisphere analog).
  2. The Talker can speak and write but has a visual field restriction (e.g., cannot see the left side of the workspace).
  3. The Silent Partner can see the entire workspace but cannot speak. They can only use their left hand to point, push, or move objects (to simulate the right hemisphere's control of the left hand and its limited communication abilities).

  We'll run a series of tasks that require the pair to respond as one person. Then we will have the Talker explain the actions, which will lead to confabulation when the Silent Partner acted on information the Talker did not have.

  Then we introduce the communication throttle (the "dial") with increasing bandwidth levels. At each level, the room votes on whether they perceive the pair as one subject or two.

  We must be cautious: the real split-brain patients have a single body and shared subcortical structures, which we cannot simulate. We'll note that in the debrief.

  Let's structure the activity in the required JSON format.

  Schema:

  - `materials`: list of materials needed.
  - `setup_minutes`: how long setup takes and what to do.
  - `roles`: description of roles for participants.
  - `rules`: array of numbered rules to read out.
  - `timeline`: array of objects, each with: `minutes`, `participant_activity`, `goal`, `failure_mode`, `handling`.
  - `throttle_scheme`: array of objects, each with: `level_name`, `allowed_communication`, `expected_behavior`, `vote_question`, `what_verdict_tracks`.
  - `debrief`: array of objects, each with: `activity_moment`, `distinction`, `debrief_line`.
  - `goes_wrong`: array of objects, each with: `issue`, `why`, `fix`.
  - `cannot_reproduce`: array of objects, each with: `feature`, `why_not`, `alternative`.
  - `check_for_understanding`: a question to ask at the end.
  - `verdict_on_my_dial_idea`: object with `verdict` ("keep", "fix", or "bin") and if "bin", then `replacement_mechanic` (if any).

  Now, let's design the activity.

  Activity Title: "The Split-Pair Experiment"

  Materials:
  - Index cards (for tasks and for communication during throttle)
  - Envelopes (to hold task instructions and to block views)
  - Folders or ring binders (to create a visual barrier)
  - Pens/pencils
  - Whiteboard (for recording votes and notes)

  Setup Minutes: 5 minutes

  Roles:
  - Talker: Can speak and write. Can only see the right side of the workspace (use a folder barrier to block the left). They are the only one allowed to speak for the pair.
  - Silent Partner: Can see the entire workspace (both sides) but cannot speak. They can only use their left hand to interact (point, push, move objects). They can write only when the throttle allows.

  Rules (numbered for reading):
  1. The pair must respond as a single person to every task.
  2. The Talker is the only one who can speak for the pair. The Silent Partner must remain silent at all times, unless the throttle level allows them to write.
  3. The Silent Partner must use only their left hand for pointing or moving objects.
  4. After each set of tasks, the Talker must explain to the group why the pair responded as they did.
  5. During the throttle phase, communication between the partners must be strictly limited to the allowed method at that level.

  Timeline:
  We have 50 minutes. We break down:

  1. Introduction (5 min): Explain the setup and the goals. Assign roles (7 pairs). Emphasize that they are to act as one person.

  2. Initial Task Block (15 min): Run 3-4 short tasks without any communication between the partners (except the Silent Partner can act with their left hand). Then have the Talker explain.

  3. Throttle Phase (20 min): Run the same (or similar) tasks at each throttle level. After each level, vote and then have the Talker explain.

  4. Debrief and Discussion (10 min): Summarize and connect to the concepts.

  Detailed Timeline:

  Block 1: Setup and Introduction (5 min)
  - Participant Activity: Listen, get into pairs, assign roles, set up barriers.
  - Goal: Get everyone ready and understand the roles.
  - Failure Mode: Confusion about roles. 
  - Handling: Clearly demonstrate the setup.

  Block 2: Initial Tasks (No Communication) (15 min)
  - Participant Activity: 
     - Task 1: Visual matching. Show a picture to the Silent Partner (on the left) that the Talker cannot see. The picture might be a simple object (e.g., a cup). Then show the Talker an array of objects including the cup and some distractors. The Silent Partner must use their left hand to point to the cup. The Talker then says what they think the object is (they might not know why the partner pointed to that one).
     - Task 2: Word completion. Show the Silent Partner a word fragment (e.g., "S _ O W") and the Talker a set of word fragments. The Silent Partner points to a fragment that completes the word (e.g., "SNOW"). The Talker must say the completed word and then explain why they chose that one.
     - Task 3: Object use. Show the Silent Partner a picture of an object (e.g., a hammer) and the Talker an array of objects. The Silent Partner picks up the hammer (with left hand) and then the Talker must say what they would do with it and why they picked it.
  - After the tasks, the Talker explains the actions. The confabulation should occur because the Talker doesn't know what the Silent Partner saw.
  - Goal: Experience the separation of information and the Talker's confabulation.
  - Failure Mode: The Silent Partner might try to communicate beyond the rules (e.g., making noises). 
  - Handling: Remind them of the rules.

  Block 3: Throttle Phase (20 min)
  - We run 4 levels of communication, each with one task (so 4 tasks, each taking about 4 minutes including vote and explanation).
  - Throttle levels (each level after the first adds a bit of communication):
     Level 0: No communication (already done, but we might repeat one task at level 0 as baseline? Or just move to level1)
     Level 1: One bit (yes/no) - Silent Partner can tap once for yes, twice for no (or use a pre-printed card with "yes" and "no" that they can show).
     Level 2: One word - Silent Partner can write one word on an index card and show it to the Talker.
     Level 3: Free writing - Silent Partner can write a short sentence on an index card and show it to the Talker.
  - After each level, the room votes: "Do you consider the pair as one subject or two cooperating subjects?" Record votes on whiteboard.
  - Then the Talker explains the actions for that task.

  Block 4: Discussion and Debrief (10 min)
  - Quick summary of votes and explanations.
  - Connect to the concepts.

  Throttle Scheme:

  Level 0: No communication
  - Allowed: Only the Silent Partner's left-hand actions (pointing, moving) as before.
  - Expected behavior: Confabulation by the Talker, because they don't know the reason for the actions.
  - Vote question: "After seeing the explanation, do you think this pair acted as one subject or two cooperating subjects?"
  - What verdict tracks: Whether the lack of access to the information by the Talker (despite the action being taken) makes the group perceive them as two.

  Level 1: One bit (yes/no)
  - Allowed: Silent Partner can show a pre-printed "YES" or "NO" card (or tap once/twice) in response to a question from the Talker? But note: the Talker doesn't know what to ask. So we have to design the task so that the Talker can ask a yes/no question. Alternatively, the Silent Partner can send a yes/no without being asked? Let's design the task to require a yes/no.

  Example task: Show the Silent Partner a picture of an object (e.g., a cat). Then the Talker is shown two pictures: one of a cat and one of a dog. The Talker can ask: "Is it the cat?" and the Silent Partner can answer yes or no.

  - Expected behavior: The Talker can get the answer right, but the explanation might still be incomplete (e.g., the Talker might say "I just knew it was the cat" without acknowledging the partner).
  - Vote question: Same as above.
  - What verdict tracks: Whether minimal communication (one bit) is enough to restore the sense of unity.

  Level 2: One word
  - Allowed: Silent Partner can write one word (on an index card) and show it to the Talker.
  - Task: Show the Silent Partner a picture (e.g., a beach). The Talker is shown an array of words (e.g., "water", "sand", "sun") and must choose one. The Silent Partner can write a word to help (e.g., "beach" or "sand").
  - Expected behavior: More accurate responses, but the Talker might still not fully understand the context.
  - Vote question: Same.
  - What verdict tracks: How much communication bandwidth is needed to feel like one subject.

  Level 3: Free writing (one sentence)
  - Allowed: Silent Partner can write a short sentence (e.g., up to 5 words) on an index card.
  - Task: Show the Silent Partner a complex picture (e.g., a man holding an umbrella in the rain). The Talker must describe the picture. The Silent Partner can write a sentence to help.
  - Expected behavior: The Talker can give a more complete explanation, and the pair may seem more unified.
  - Vote question: Same.
  - What verdict tracks: Whether full (but still limited) communication restores the sense of unity.

  Debrief: We map moments in the activity to the distinctions.

  Goes wrong: We list potential issues.

  Cannot reproduce: Features of real split-brain cases we cannot simulate.

  Check for understanding: One question.

  Verdict on dial idea: We are going to keep it, but with the above adjustments.

  Now, let's write the JSON.
