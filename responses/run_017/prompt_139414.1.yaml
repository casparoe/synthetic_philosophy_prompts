prompt: |-
  I've been reading a chapter in one of those popular "big questions" ethics books (not naming it) about doing more than morality asks, and I have no philosophy background so I can't tell how much of it to trust. Roughly, and mostly in its own words, it says:

  "Some actions are supererogatory — they go beyond the call of duty. Throwing yourself on a grenade, giving away half your income, running into a burning building. Doing them makes you a hero; not doing them isn't wrong and nobody can blame you. Morality has a required part and a forbidden part, and supererogation is just the bit sticking out past the required part: an optional bonus zone where you're free to add extra good if you feel like it. Genuinely optional, though — not giving to charity is morally on a par with having tea instead of coffee. This is also where utilitarianism falls apart, because it says you always have to produce as much good as you can, so for a utilitarian everything good is mandatory and sainthood is just the minimum. And there's a deeper problem: if the heroic act is the best thing you could do, and you always have most reason to do the best thing, then it's required after all, and the whole category collapses back into ordinary duty."

  My brother-in-law took two philosophy classes in college and says the "its just like tea" bit in particular is a strawman, but he won't explain why. So: claim by claim, what would someone who actually works on this accept, what's a fair simplification for a general reader, and whats just wrong? Is the stuff about utilitarianism a real problem for that view or a caricature of it, and is the last bit a knockdown argument or one of those things people are still arguing about? The chapter also says in passing that you can't deserve any credit at all for merely doing your duty — is that right?

  Three cases I came up with myself that the book doesn't touch and that I definately can't fit into its picture:

  1. The cost slider. Same rescue: version A costs me nothing, I just press a button; version B costs me a job interview that would have landed me a 50k job. B feels clearly heroic, A feels like I'd be a jerk not to. If "supererogatory" just tracks how expensive the act is for me, where does the line get drawn — or is it only a sliding scale where we all agreed to be lenient past a certain point? And does the free version become a real duty, or stay optional?

  2. My friend is a lifeguard. Same dive, same risk, but on shift she says it's just her job, and on her day off the same thing is heroic. Does a job description really create a moral duty out of nothing, or is the real difference about what she agreed to, what other people can demand of her, or what she's owed for it?

  3. The mixed ones. The rescue that also gets you a promotion. The kidney you give your brother. Does getting something out of it disqualify an act from being supererogatory, or is the category about cost and risk rather than about why you did it?

  One more: the book says there's no mirror image, no such thing as something bad but not forbidden. That suprised me, because petty selfishness seems exactly like that to me.

  And finally: how much should this make me distrust the rest of the book, and is there something big the chapter left out that changes the picture?
reasoning: |-
  Okay, let's tackle this user's query. They're reading an ethics book chapter on supererogation and have several concerns about its accuracy. The user lacks a philosophy background, so they're unsure what to trust. Their brother-in-law mentioned the "tea vs. coffee" analogy is a strawman, but didn't explain. The user wants a claim-by-claim breakdown, plus answers to their own cases and whether they should distrust the book.

  First, I need to address each of the book's claims. The supererogation definition is mostly correct, but the "morally on par with tea vs. coffee" part is indeed a strawman. The user needs to understand why that's misleading—charity isn't trivial. The book's depiction of utilitarianism is oversimplified; consequentialists have responses like scalar utilitarianism or satisficing. The "deeper problem" about reasons and duty is a real debate, not settled.

  Next, the user's cases. The cost slider shows that cost affects obligation, but where's the line? I should explain that philosophers see duty as context-dependent, not a fixed line. The lifeguard example involves role obligations versus moral duties. Here, the lifeguard's job creates an institutional duty, but the moral duty might differ. Mixed motives: supererogation focuses on sacrifice, not purity of intent. Petty selfishness as "suberogatory" is a concept some philosophers recognize, even if not the mirror image.

  The user also asks if not deserving credit for duty is correct. Explaining Kant's view versus common intuitions about credit is key. They might be worried the book is too rigid. The deeper need seems to be assessing the book's reliability and understanding nuances in ethics. They might feel overwhelmed by conflicting ideas and want a grounded perspective. Highlighting that the chapter oversimplifies debates and omits key nuances should help them evaluate the rest of the book critically. Recommending further readings like Urmson or Mellema could address their desire for deeper understanding.
answer: |-
  This is an excellent set of questions! You've identified key nuances and potential weaknesses in the chapter's presentation. Let's break it down claim-by-claim, address your cases, and assess the reliability.

  ### Claim-by-Claim Analysis

  1.  **"Some actions are supererogatory... Doing them makes you a hero; not doing them isn't wrong and nobody can blame you."**
      *   **Accepted/Simplification:** This is the core definition and widely accepted. Supererogatory acts are praiseworthy but not obligatory. Failure to perform them isn't blameworthy *in the strict moral sense* (no one has a *right* to demand them of you).
      *   **Nuance:** While not *blameworthy* in the sense of violating a duty, there might be contexts where *not* doing a clearly supererogatory act (especially a low-cost one) could be seen as morally deficient, cold, or lacking virtue – it might warrant criticism or disappointment, just not the same level of condemnation as violating a duty. The "nobody can blame you" is slightly too strong.

  2.  **"Morality has a required part and a forbidden part, and supererogation is just the bit sticking out past the required part: an optional bonus zone..."**
      *   **Accepted/Simplification:** This is a common way to visualize it and captures the core idea.
      *   **Nuance:** The boundary between duty and supererogation is often fuzzy and context-dependent (as your cases highlight). It's not always a clear, sharp line. Some argue the "zone" isn't just "bonus" but essential for capturing the richness of moral life beyond mere obligation.

  3.  **"...not giving to charity is morally on a par with having tea instead of coffee. Genuinely optional..."**
      *   **Wrong/Caricature:** **This is absolutely a straw man, and your brother-in-law is right.** The chapter trivializes non-supererogatory omissions. While *not giving to charity* (at a specific moment, in specific circumstances) *might* sometimes be supererogatory, often it isn't treated as trivial.
      *   **Why it's Wrong:**
          *   **Cost Matters:** Giving away *all* your income is supererogatory. Giving *nothing* when you easily could save a life for minimal cost might well be seen as failing a duty, not merely declining an optional bonus. Your "cost slider" case directly challenges this.
          *   **Virtue Ethics:** Failing to show compassion or generosity *when it costs little* might not violate a strict "duty" but could indicate a lack of virtue, which *is* a moral failing, unlike beverage choice.
          *   **Relationship to Duty:** Some argue we have an *imperfect duty* (Kant) of beneficence – we must help sometimes/some people, but have leeway in how/when/whom. Choosing *never* to help might violate this, even if no specific act of giving is strictly obligatory. Tea/coffee choice never violates a duty.
          *   **Social Context:** In societies with extreme inequality, absolute inaction by the wealthy might be seen as complicity, far beyond beverage preference.

  4.  **"This is also where utilitarianism falls apart... everything good is mandatory and sainthood is just the minimum."**
      *   **Simplification/Caricature:** This *is* a classic and serious challenge to *act utilitarianism* (maximize good in *every* action). It forces utilitarians to refine their view.
      *   **Utilitarian Responses (Not a Knockdown):**
          *   **Rule Utilitarianism:** Following rules (like "help significantly when you reasonably can") that maximize good overall allows for supererogation – sometimes going *beyond* the rule is better, but not required by the rule itself.
          *   **Scalar Utilitarianism:** Goodness is a matter of degree, not binary (right/wrong). An act can be *better* than another without the lesser act being *wrong*. Supererogatory acts are simply the *best* options, but choosing a *good enough* (but not best) option isn't *wrong*. This directly addresses the collapse worry.
          *   **Satisficing Consequentialism:** You are only obligated to produce a *sufficiently good* outcome, not the *absolute best possible*. Going beyond "sufficient" is supererogatory.
          *   **Acknowledging Psychological Realism:** Even act utilitarians often admit that demanding constant sainthood is psychologically unsustainable and counterproductive; promoting a culture recognizing supererogation might be optimal. They don't necessarily *deny* the category exists in practice, even if their theory struggles to define it neatly.
      *   **Conclusion:** It's a **real and significant problem** for *simple act utilitarianism*, but **not a knockdown argument** against consequentialism/utilitarianism *as a whole*, as refined versions can accommodate supererogation. The chapter oversimplifies.

  5.  **"And there's a deeper problem: if the heroic act is the best thing you could do, and you always have most reason to do the best thing, then it's required after all, and the whole category collapses."**
      *   **Ongoing Debate:** This is the **"Paradox of Supererogation"** and a central topic of debate. There's **no consensus**.
      *   **Arguments Against Collapse:**
          *   **Reasons ≠ Obligation:** Having *most reason* to do X doesn't necessarily mean you are *obligated* to do X or *blameworthy* for not doing X. Obligation involves a stronger sense of demand, enforceability, or correlative rights in others. Heroism often involves sacrifice beyond what can be demanded.
          *   **Agent-Centered Prerogatives:** We have permission to give *some* weight to our own interests, projects, and commitments, even if the *impersonal* best action is slightly better. Sacrificing your entire life for others might be best impersonally, but you aren't *obligated* to do so.
          *   **The Nature of "Best":** Defining the single "best" action is often incredibly complex or impossible. Morality might deal with ranges of acceptable actions, with supererogation being the peak of that range.
      *   **Conclusion:** It's **not a knockdown argument**. It highlights a tension, but many philosophers believe the category of supererogation is essential and defend it against this collapse. The debate is very much alive.

  6.  **"...you can't deserve any credit at all for merely doing your duty..."**
      *   **Debatable / Context Dependent:** This is a strict Kantian view: doing your duty is merely what is owed; credit is only for going beyond. However:
          *   **Common Sense:** We *do* often praise people for doing their duty, especially if it was difficult, costly, or they overcame temptation. A firefighter who bravely enters a burning building *on duty* deserves credit, even if it's their job.
          *   **Virtue Ethics:** Fulfilling one's duties reliably is itself a virtue (e.g., being dependable, just) and deserves recognition as part of good character.
          *   **Nuance:** Credit for duty might be *less* than for supererogation, and *sometimes* merely doing a basic duty might not warrant *special* praise (e.g., not stealing). But saying *no credit at all* is too strong for most contexts. The lifeguard case illustrates this.

  ### Addressing Your Cases

  1.  **The Cost Slider:**
      *   **Yes, cost is crucial.** Supererogation fundamentally involves *significant* sacrifice, risk, or effort *beyond* what can reasonably be demanded. Pressing a button at zero cost to save a life is almost certainly a **duty** (failing it would likely be blameworthy). Losing a $50k job opportunity is a **significant sacrifice**, making the rescue **supererogatory**.
      *   **Where's the line?** There's **no bright line**. It depends on context: the magnitude of the good, the cost/risk to the agent, the agent's resources/skills, relationships, availability of other helpers, etc. Morality involves judgment. We *are* generally more lenient about demanding costly acts. The line shifts based on circumstances.
      *   **Free Version:** Becomes a **real duty** (or very close to it). It would be hard to defend *not* pressing the button as morally permissible, let alone on par with beverage choice.

  2.  **The Lifeguard:**
      *   **Job descriptions create institutional/role-based duties.** By taking the job (and being paid/trusted), the lifeguard incurs a **specific obligation** to perform rescues *while on duty*. Failing this is a dereliction of duty and blameworthy.
      *   **Off-duty, the same physical act becomes supererogatory.** There is no institutional duty. The moral duty might be weaker (depending on cost/risk/others present). Doing it involves **personal sacrifice beyond what is demanded** (her time, risk, effort without the expectation/compensation of the job).
      *   **The difference is about agreement, expectation, and demandability.** On duty, society (via the institution) *demands* it and compensates for it. Off duty, while helping may be good, society cannot *demand* that level of personal risk/sacrifice from a bystander; doing it is heroic.

  3.  **The Mixed Motives:**
      *   **Getting something out of it does NOT automatically disqualify an act from being supererogatory.** The core of supererogation is about **sacrifice or effort beyond the call of duty**, not purity of motive.
      *   **Kidney for Brother:** Even if you love him, donating a kidney involves significant risk, pain, and long-term impact. This sacrifice is far beyond any duty. Getting the personal satisfaction of saving his life doesn't negate the sacrifice. It's still supererogatory.
      *   **Rescue for Promotion:** If the rescue involved genuine risk or significant effort *that you wouldn't have undertaken without the promotion incentive*, then the act itself might still be supererogatory (the good was done at real cost). However, your *motive* might be less praiseworthy than someone who did it purely altruistically. **The act can be supererogatory while the agent deserves less (or different) credit.** Motive affects *praiseworthiness*, while cost/risk/duty define the *category* of the act.
      *   **Category Focus:** Supererogation is primarily defined by **objective cost/risk relative to duty**, not subjective motivation. An act can be supererogatory even if done for mixed or partially self-interested reasons.

  4.  **Mirror Image (Petty Selfishness):**
      *   The chapter is likely **wrong** or **oversimplifying**. Philosophers discuss **"suberogatory"** acts (J.O. Urmson) – acts that are morally bad, offensive, or selfish but not quite so severe as to be forbidden or wrong *in the strong sense of violating a duty*. They are "permissible but bad" or "blameworthy but not obligatory to avoid."
      *   **Examples:** Hoarding excessive wealth while others starve (without violating property rights), being consistently rude but not abusive, minor acts of laziness or ingratitude that fall short of violating a specific duty. Petty selfishness is a prime candidate. These acts warrant criticism or diminished esteem, but not the same condemnation as violating a core duty like harming others. This asymmetry (supererogation is widely accepted, suberogation is more contested) is an interesting feature of common-sense morality.

  ### Overall Assessment of the Chapter & What's Missing

  *   **Trustworthiness:** **Be cautious.** While the core definition of supererogation is sound, the chapter contains significant misrepresentations (tea/coffee straw man), oversimplifications (especially regarding utilitarianism), and likely omissions. The "no mirror image" claim is probably incorrect. Its treatment of duty/credit is too rigid.
  *   **Major Omissions/What Changes the Picture:**
      1.  **The Centrality of Cost/Sacrifice:** The chapter doesn't emphasize enough that supererogation hinges on *significant* personal cost/risk *beyond* reasonable demand. Your "cost slider" exposes this.
      2.  **The Blurry Line:** It presents duty/supererogation as too cleanly separated. In reality, the boundary is context-dependent and often debated.
      3.  **Role Obligations:** It doesn't adequately address how professions and agreements create specific duties that transform acts from supererogatory to obligatory (Lifeguard case).
      4.  **Motive vs. Action:** It conflates the moral status of the *act* (supererogatory) with the *praiseworthiness of the agent* (which depends on motive). Mixed motives complicate praise but not necessarily the act's categorization.
      5.  **The "Paradox" is Active:** Presenting the "deeper problem" as a fatal flaw ignores robust defenses and ongoing sophisticated debate.
      6.  **Suberogation:** Ignoring the potential "permissible but bad" category gives an incomplete picture.
      7.  **Virtue Ethics Perspective:** It likely neglects how supererogation relates to virtues like heroism, generosity, and saintliness, which are central to many moral outlooks beyond bare duty.

  **In Summary:** The chapter gets the basic idea right but stumbles badly on specifics (especially the tea/coffee analogy and utilitarianism caricature) and misses crucial nuances explored in your excellent cases (cost, roles, mixed motives). The collapse argument is a real philosophical puzzle, not a settled knockout blow. The "no credit for duty" claim is too absolute. You are right to question it. For a more reliable intro, look for works by philosophers like J.O. Urmson (who revived modern discussion), David Heyd, or more recent entries in the Stanford Encyclopedia of Philosophy on "Supererogation." Your critical thinking about the cases is spot-on!
