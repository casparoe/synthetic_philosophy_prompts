  | :------ | :------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------- |
  | **C1**  | **Is institutional acceptance (university posts, peer review) a reliable *indicator* of methodological soundness?**                          | Institutional filters, while imperfect (Piltdown, Hitler Diaries), are the best practical mechanism for enforcing methodological standards and identifying work that fails them. Pseudohistory consistently fails these filters. | Institutional acceptance reflects the current consensus power structure and its gatekeeping. Paradigm shifts are often resisted initially *despite* method (Hittites, Norse). History lacks a demonstrable, objective "method filter". | The historical record of cases like Piltdown/Hitler Diaries (institutional failure) vs. Hittites/Norse (initial institutional resistance overcome by evidence). Track record of peer review. | Analysis will show institutional rejection strongly correlates with demonstrable methodological flaws, not just dissent. Most pseudohistory never meets basic scholarly standards to *enter* the filter. | Analysis will show institutional acceptance/rejection tracks conformity to prevailing paradigms and social factors more strongly than objective methodological rigor. | Empirical         |
  | **C2**  | **Are methodological criteria (falsifiability, burden of proof scaling, reliance on cross-checked frameworks) *prior to* and *independent of* the current consensus?** | Yes. These criteria define sound historical reasoning itself. Pseudohistory is identifiable *by its violation of these criteria*, regardless of consensus. Consensus is the *result* of applying these methods. | No. The "established framework" *is* the current consensus. Falsifiability depends on what is considered plausible background knowledge. Burden of proof scaling is defined *relative* to that consensus. These criteria are tools *of* the consensus. | How methodological principles are applied to cases like Atlantis *before* and *after* major consensus shifts (if any). The Alcoutim case evaluation process. | Demarcationist criteria will provide a stable, consensus-independent framework for identifying flawed arguments (like Atlantis) even if consensus details change. | The application and weighting of methodological criteria will be shown to vary significantly with the prevailing consensus and interpretive context.               | Conceptual        |
  | **C3**  | **Does the label "pseudohistory" primarily track a *method* or a *social status***?                                                          | The label "pseudohistory" is primarily deserved by work exhibiting identifiable methodological flaws (as defined in C2) that preclude it from contributing to knowledge, regardless of author status. | The label "pseudohistory" functions primarily as a sociological boundary marker, applied pejoratively to work outside the institutional mainstream, often *before* detailed methodological critique. | Examination of when and why the label is applied historically and currently. Analysis of works rejected by institutions but later vindicated vs. persistent "fringe" theories. | Cases labeled pseudohistory will overwhelmingly exhibit the core methodological flaws identified, regardless of the author's institutional affiliation. | The application of the label will correlate more strongly with lack of institutional affiliation and challenge to core narratives than with a consistent methodological deficit. | Empirical/Conceptual |

  **Cruxes**

  The following sub-questions, if resolved, would move at least one side significantly:

  1.  **Crux C1: Indicator Reliability:** Does empirical analysis of historical cases show that institutional rejection reliably correlates with identifiable methodological failures violating core principles (Demarcationist) or primarily with dissent from consensus and lack of institutional affiliation (Continuity Critic)? *Shared Test:* Detailed case studies of Piltdown/Hitler Diaries (failures *within*), Hittites/Norse (initial resistance *overcome*), and persistent fringe theories (chronic rejection). Track the specific reasons for rejection/vindication.
      *   *Demarcationist Prediction:* Analysis will reveal that persistently rejected theories consistently fail core methodological criteria (e.g., unfalsifiability, ignoring counter-evidence, disproportionate claims), while cases like Hittites/Norse gained acceptance only when they *met* those criteria with new evidence. Institutional affiliation correlates with method adherence.
      *   *Continuity Critic Prediction:* Analysis will show that rejection often stems from challenge to core narratives and lack of credentials/pedigree, with methodological critiques frequently deployed post-hoc or inconsistently. Cases like Hittites/Norse succeeded partly due to shifting paradigms and accumulating social credibility, not just method adherence.
  2.  **Crux C2: Priority of Method:** Can core methodological principles (e.g., burden of proof scaling with disruptiveness, seeking falsifying tests, reliance on cross-checked frameworks) be consistently applied *independently* of the current consensus to identify flawed arguments? *Shared Test:* The Alcoutim lead tablets case. Apply the methodological principles rigorously *without* presupposing the consensus Phoenician frontier or chronology. Can a clear, non-question-begging evaluation be reached based solely on the evidence and methodological principles regarding authenticity and plausibility *before* seeking consensus judgment?
      *   *Demarcationist Prediction:* Yes. Applying the principles (high burden of proof for radical claim, stringent verification of all elements especially provenance/eclipse/paleography, comparison to known forgery) will lead to a clear, defensible preliminary assessment (likely forgery due to provenance and radical claim lacking extraordinary proof, despite intriguing corroborations) independent of the current consensus frontier.
      *   *Continuity Critic Prediction:* No. The assessment will inevitably be shaped by the background consensus (e.g., the implausibility of the frontier breach will heavily weight the evaluation against authenticity, influencing how the "intriguing" evidence is interpreted; the "burden of proof" is defined *by* the consensus). The principles alone are insufficient without the interpretive context of the consensus.
  3.  **Crux C3: Label Tracking:** What factor most strongly determines the application of the "pseudohistory" label: demonstrable methodological flaws or social/institutional position? *Shared Test:* Analysis of a range of historical and contemporary cases where the label is or was applied (Velikovsky, von Däniken, Fomenko, but also figures like Schliemann initially or controversial but institutionally affiliated historians). Code the primary stated reasons for the label and the social position of the author.
      *   *Demarcationist Prediction:* The dominant factor in persistent labeling will be identifiable, severe methodological flaws (as defined in Agreed Claims 2 & 3), even if occasionally misapplied initially. Social position is a correlate, not the cause.
      *   *Continuity Critic Prediction:* The dominant factor will be the author's position outside the mainstream institutional structure and the perceived threat their work poses to established narratives. Methodological critiques are often secondary justifications.

  **Verbal Component**

  The most significant verbal disagreement centers on the **term "pseudohistory" itself**. The Demarcationist uses it to denote work exhibiting specific, identifiable *methodological failings* that render it non-contributory to knowledge. The Continuity Critic uses it primarily as a *sociological label* denoting work rejected by the mainstream historical establishment. Once this terminological difference is acknowledged:

  *   **Substantive Agreement Remains:** Both agree that some historical arguments (Atlantis, ancient astronauts, Fomenko) are deeply flawed and fail to meet standard evidentiary and logical criteria. Both agree that the established consensus is revisable with sufficient evidence meeting methodological standards (Hittites, Norse). Both agree on the core practices of good historical inquiry (Agreed Claim 1 & 5).
  *   **Substantive Disagreement Shifts:** The core disagreement becomes: **1.** Whether the flaws in the rejected arguments constitute a distinct, identifiable *category* of faulty *method* ("pseudohistory" in the Demarcationist sense) that can be demarcated in principle from merely *false* or *controversial* history within the mainstream (C2), and **2.** The degree to which institutional acceptance/rejection reliably tracks methodological soundness/unsoundness (C1, C3).

