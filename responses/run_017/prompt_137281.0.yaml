prompt: |-
  I'm taking an upper-level seminar on historiography and the philosophy of history, and our last two sessions have gone in circles, so I want to try to settle the dispute in writing rather than in discussion. Two of us have become the poles. One of us — call her the demarcationist — holds that there is a principled methodological line between historiography and pseudohistory, drawn by things like provenance, independent attestation, consilience with a chronological and archaeological framework that has itself been cross-checked from many directions, willingness to say in advance what would refute you, and a burden of proof that scales with how much of the established web a claim would force us to rewrite; on that basis she treats Atlantis-as-lost-civilisation, ancient-astronaut construction theories, and Fomenko-style global chronology revision not merely as false but as identifiable in advance, from their method, as pseudohistory. The other — call him the continuity critic — replies that each of those tests is parasitic on a background consensus that is itself revisable, that appeals to the established framework are exactly what people used when they doubted that the Hittites had existed or that Norse voyagers had reached North America, that mainstream historiography has its own spectacular failures which passed through precisely the institutional filters the demarcationist trusts (Piltdown Man, the Hitler Diaries), and that the label tracks who holds a university post at least as much as it tracks how a person argues. Neither of them, so far, has stated the other's view in a form the other would sign, and I suspect that some substantial part of the argument is verbal.

  What I want is the joint statement they could both put their names to. Please give me: first, a numbered section of claims both can sign, including claims about the specific cases (what exactly is wrong with the Atlantis and ancient-astronaut arguments, and with a global revision of chronology; what exactly is right about the vindicated-but-once-dismissed claims) and about what a good historian does that a bad one does not; second, the residual disagreements, each stated twice, once in the demarcationist's own terms and once in the continuity critic's, with each phrasing being one its own holder would accept as fair and non-vacuous; third, the cruxes — the sub-questions such that settling one would move at least one of them — with, for each crux, a case, test, or piece of evidence both would accept as bearing on it and each side's prediction written down in advance. For the shared tests, please use this invented case, which I made up so that neither of them can rely on knowing how it came out: a cache of about forty inscribed lead tablets, said to have come from a collapsed riverbank cavern a few kilometres upriver from Alcoutim on the Guadiana, bought from a local collector before any stratigraphic excavation; the texts are in a Punic dialect, mix a merchant's ledger with two king-names absent from the standard Tyrian king-lists, refer to a shrine of a well-attested Phoenician deity at an emporion several hundred kilometres north of the accepted Phoenician frontier, and record a total solar eclipse in a form checkable by astronomical retro-calculation; the paleography sits between two known script phases, a wooden writing-board fragment from the same alleged find-spot yields a radiocarbon range consistent with the claimed date, and an independent archaeologist points out that a comparable cache was forged in that region in the 1990s. I would also like you to mark explicitly which parts of the dispute, in your judgment, are disputes about words rather than about the world, and to say what non-question-begging content is left once the verbal part is removed. Do not give me reading lists, bibliographies, or citations: I want the argument, and anything requiring a lookup should simply be marked as not settled here.

  Two more things. Epistemically, I want you to be self-critical in a specific way: tell me which formulation you found hardest to make neutral, where you think you have still quietly smuggled in one side's framing, and — for each side — what consideration should in principle move it, plus where your own attempted synthesis is most likely to break down (for instance, if a crux turns out to depend on an empirical base rate that neither side can actually estimate). Format-wise, give me the joint statement as prose in the three parts above, with the disagreements rendered as a table whose columns are: Crux ID; the sub-question; the demarcationist's position in her own preferred terms; the continuity critic's position in his own preferred terms; the evidence or case both accept as bearing on it; the demarcationist's prediction; the continuity critic's prediction; and the type of residual disagreement, with the value taken from exactly these three: empirical, conceptual, or verbal. After the prose, add a brief structured summary as a single JSON object with this schema: agreed_claims (array of strings, one per signed claim); cruxes (array of objects, each with the keys crux_id, sub_question, demarcationist_position, continuity_position, shared_test, demarcationist_prediction, continuity_prediction, disagreement_type, where disagreement_type is one of empirical, conceptual, verbal); verbal_component (a string saying which part of the argument was about words and what survives it); and drafting_caveats (array of short strings: the places where neutrality was hardest, where a side's framing may have leaked in, and what would change the document's mind). If a field cannot be filled without looking something up, put null rather than guessing.
