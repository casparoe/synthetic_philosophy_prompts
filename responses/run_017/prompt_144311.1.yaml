  ### Analysis of the Snow Case Based on the Colleague's Verdicts

  To determine the colleague's likely verdict on the snow-clearing case, we first infer the rules about what constitutes a convention based on her prior verdicts. These verdicts align with David Lewis's theory of convention, which emphasizes coordination problems, common knowledge, arbitrariness, and conditional preferences. However, her rulings suggest a nuanced interpretation. Below, we outline two rules that fit her prior verdicts equally well, apply them to the snow case, provide a best guess for her verdict with reasons, and propose a further case to distinguish the rules.

  #### Two Rules Fitting Prior Verdicts
  Both rules incorporate core Lewisian elements (regularity, common knowledge, arbitrariness) but differ in their treatment of coordination and interdependence.

  1. **Rule 1: Strict Coordination Requirement**  
     - **Definition**: A convention requires a coordination problem where (i) individuals have a conditional preference to conform if others do, (ii) there are multiple possible equilibria (arbitrariness), and (iii) the interdependence of actions means that the success of one's action depends on others' actions matching. Social sanctions (e.g., gossip, fines) may enforce a convention but are insufficient without underlying coordination interdependence.  
     - **Prior Verdicts Explained**:  
       - Conventions (e.g., stepping left, handshakes, queueing, stopping at red lights) all involve coordination problems: mutual avoidance on a path, mutual recognition in greetings, orderly access to resources, or synchronized traffic behavior. Interdependence is clear (e.g., stepping left only works if others do too).  
       - Non-conventions lack coordination: Taking the stairs is an individual adaptation (no interdependence), and driving alone is a collective action problem without matching dependence (each driver's choice doesn't rely on others' choices).  
     - **Prediction for Snow Case**: Not a convention. Although there is regularity, common knowledge, arbitrariness (they could clear at noon or not at all), and social sanctions (gossip), the interdependence is absent. Households only care about their own patch, and clearing one's snow does not depend on others doing so (unlike the bus-stop era). The gossip is a byproduct, not evidence of a coordination problem.

  2. **Rule 2: Broad Social Equilibrium with Sanctions**  
     - **Definition**: A convention requires (i) a regularity sustained by common knowledge and conditional preferences, (ii) arbitrariness, and (iii) a preference for conformity driven by expectations or sanctions (e.g., disapproval), even without direct action interdependence. Coordination problems are sufficient but not necessary; social enforcement can sustain conventions independently.  
     - **Prior Verdicts Explained**:  
       - Conventions fit, as they all have conditional preferences and sanctions (e.g., honking for red-light runners).  
       - Non-conventions fail: Stairs lack arbitrariness and conditional preferences (it's a fixed response), and driving alone has no sanctions or conditional preference for conformity (no one disapproves).  
     - **Prediction for Snow Case**: Convention. There is regularity, common knowledge (beliefs about "ought" and neighbors' beliefs), arbitrariness (clearing could be abandoned), and conditional preferences driven by sanctions (gossip). Households conform to avoid disapproval, even though their clearing doesn't depend on others.

  #### Best Guess for Her Verdict and Reasons
  - **Best Guess**: She will rule the snow case **not a convention**.  
  - **Reasons for Preferring Rule 1 (Strict Coordination)**:  
    - **Alignment with Lewis's Core Idea**: Lewis defines conventions as solutions to recurring coordination problems. The snow case originated from one (mutual need for clear paths) but now lacks interdependence. The colleague's prior verdicts emphasize coordination (e.g., stepping left requires mutual avoidance) and exclude cases without matching dependence (e.g., driving alone).  
    - **Sanctions as Secondary**: In conventions like stopping at red lights, sanctions (fines, honking) enforce a coordination-based rule, but the core interdependence (safety requires mutual compliance) remains. In the snow case, sanctions (gossip) are the sole motivator without coordination, making it closer to a social norm than a convention.  
    - **Non-arbitrariness in Practice**: While the clearing time is arbitrary, the absence of alternatives (e.g., hiring a service) weakens arbitrariness. More importantly, the case lacks the "if others did X, I would prefer X" structure seen in stepping left or queueing.  
    - **Risk of Overextension**: Rule 2 might classify many social norms (e.g., wearing black at funerals) as conventions, diluting Lewis's focus on coordination. The colleague excluded driving alone due to no matching dependence, suggesting Rule 1 is stricter and more consistent.  

  #### Concrete Further Case to Separate Rule 1 from Rule 2
  - **Case Description**: In a town, everyone wears a red hat on Sundays. There is no practical reason (e.g., weather or identification), and actions are independent (my hat choice doesn't affect yours). However, everyone believes they ought to wear one, knows others believe this, and those who don't comply face subtle social exclusion (e.g., not being invited to events). The practice began 50 years ago as a political symbol but now has no symbolic meaning.  
  - **How It Separates the Rules**:  
    - **Rule 1 (Strict Coordination)**: Not a convention. No coordination problem—hat-wearing is independent, and no one's success depends on others matching. Social exclusion is a sanction but doesn't create interdependence.  
    - **Rule 2 (Broad Social Equilibrium)**: Convention. Regularity, common knowledge, arbitrariness (could be blue hats), and conditional preferences (avoid exclusion) exist.  
  - **Purpose**: This case isolates the role of sanctions without coordination. If the colleague rules "not a convention," she likely uses Rule 1; if "convention," she uses Rule 2.

  #### Final Prediction for Snow Case
  Given the emphasis on coordination in her prior verdicts and the absence of interdependence in snow-clearing, she will rule it **not a convention**.

  \answer{not a convention}
