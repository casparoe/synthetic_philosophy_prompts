     a. Two walkers meeting on a narrow footpath both step to their left.
     b. Handshakes rather than bows or nods as the departmental greeting.
     c. Using the word "dog" to talk about dogs.
     d. Queueing at the coffee machine in order of arrival.
     e. Stopping at red lights (with fines and honking for violators).

  2. Not a convention:
     f. Taking the stairs because the lift has been out of service for months.
     g. Everyone driving to work alone when each driver wishes that everyone took the bus, nobody disapproves, and nothing depends on matching.

  Now, the snow case: Every household clears the snow from the pavement outside its own house before nine in the morning. There is no interdependence (each patch is independent, and each household only cares about its own). However, everyone believes that one ought to clear, believes that the neighbors believe this too, and there was gossip about a non-compliant household last winter. Compliance is high but not universal. Non-compliance is observable only to immediate neighbors. The practice originated when there was interdependence (everyone needed clear paths to the bus stop) but that reason is gone now.

  We are to find 2-3 rules that fit the earlier verdicts and then see what they say about the snow case.

  Lewis's definition of convention (from "Convention: A Philosophical Study") typically includes:

  1. **Regularity**: There is a regularity in behavior.
  2. **Common Knowledge**: It is common knowledge that everyone conforms and expects others to conform.
  3. **Preference for Conformity**: Each person prefers to conform if others do (coordination preference).
  4. **Arbitrariness**: There is at least one alternative regularity that could have been established instead.

  But note: Lewis also emphasizes that conventions solve coordination problems. A coordination problem is a situation where there are multiple equilibria (i.e., patterns of behavior that are stable because no one has an incentive to deviate unilaterally) and the participants have a common interest in coordinating.

  Let's check the non-conventions:

  - Taking the stairs because the lift is broken: This is a regularity, but it is driven by individual necessity (the lift is broken) and not by coordination. There's no alternative regularity that others might follow and that you would prefer to follow if others did. So it fails the coordination aspect.

  - Driving alone when everyone wishes they all took the bus: This is a situation with a collective action problem (a prisoner's dilemma or similar) but not a coordination problem. The key is that in a coordination problem, if everyone else is doing X, then you prefer to do X too. Here, if everyone else takes the bus, you would prefer to drive alone (free ride) because you get the benefit of less traffic without the cost of taking the bus. But note: the case says "nobody disapproves" and "nothing depends on matching". So there is no interdependence? Actually, it says that each driver wishes that everyone took the bus. But if everyone took the bus, then traffic would be reduced and the environment might be better. However, if you take the bus and others drive, you suffer the inconvenience of the bus and still have traffic. So it is not a coordination problem but a collective action problem. Thus, it fails the preference condition: even if others take the bus, you might prefer to drive (unless the bus is more convenient when traffic is low). But the case states that nothing depends on matching. So it's not a coordination problem. Hence, not a convention.

  Now, let's look at the conventions:

  a. Walkers stepping left: This is a coordination problem. You step left if the other does. It's arbitrary (could have been right). Common knowledge and regularity are present.

  b. Handshakes: Similarly, it's arbitrary (could be bows) and it's a coordination to have a common greeting.

  c. Using the word "dog": Arbitrary (could be "hound", etc.), coordination to communicate effectively.

  d. Queueing: Arbitrary? Not entirely, because it is based on arrival time, but the rule of first-come, first-served is arbitrary in the sense that we could have a last-come, first-served rule? Actually, queueing in order of arrival is a convention that solves the coordination problem of who gets served next. It's arbitrary in that we could have a different rule (like priority for certain people) but in the context, it's the established regularity.

  e. Stopping at red lights: Coordination problem (if others run red lights, you might be in danger if you stop). The fines and honking are enforcement mechanisms, but the underlying convention is the rule of stopping at red. It's arbitrary (could be green for stop, but we have a different convention).

  Now, what about the snow case?

  The key points:

  - Regularity: Yes, everyone clears their patch by 9am.

  - Common knowledge? Everyone believes that one ought to clear, and that the neighbors believe it too. The gossip shows that non-conformity is noticed and socially sanctioned (though only by immediate neighbors). So it seems common knowledge is present.

  - Preference for conformity? The case says: nothing about anyone's clearing depends on anyone else's. Each household cares only about its own doorstep. So, if a household fails to clear, it only affects that household (and they don't care about others). Therefore, there is no direct interdependence. However, the gossip and social disapproval might create a secondary reason to conform: to avoid being talked about. So, the preference for conformity might be driven by the desire to avoid social disapproval.

  But note: Lewis's original account requires that the convention solves a coordination problem. In the past, there was a coordination problem: everyone needed each other's patches clear to get to the bus. But now that reason is gone. So the current practice is maintained only by the social norm (gossip) and not by the original coordination need.

  So we have two possibilities:

  Rule A (Strict Lewis): A convention must solve a coordination problem. The snow case does not solve a coordination problem now (because there's no interdependence). Therefore, it is not a convention.

  Rule B (Broad Lewis): A convention is a regularity that is arbitrary, common knowledge, and where there is a conditional preference for conformity because of the expectation of others' conformity and the desire to avoid sanctions (like social disapproval). The snow case has these features. Therefore, it is a convention.

  But note that Lewis's own account requires that the convention solves a coordination problem. However, the case might be that the social disapproval itself creates a new coordination problem: we all want to avoid being gossiped about, and we can do so by clearing the snow. But this is not a coordination problem in the original sense of interdependent actions. It is a social norm enforced by sanctions.

  There is a distinction between conventions and social norms. Conventions are typically self-enforcing because they solve coordination problems (like which side of the road to drive on). Social norms are enforced by sanctions (like gossip or fines). Lewis's theory does not require sanctions, but in the red light case there are sanctions (fines and honking). However, note that the red light case is also a coordination problem: if others run the light, you are in danger. The sanctions (fines) are added by law to enforce the convention.

  But in the snow case, the original coordination problem is gone. The current practice is sustained by social pressure. Therefore, if we strictly require a coordination problem (with interdependent payoffs) then it fails.

  Now, let's see which rule fits the previous verdicts.

  The non-conventions:

  - Taking the stairs: Not a convention because there's no coordination problem (individual decision due to broken lift) and no conditionality (you take the stairs regardless of others).

  - Driving alone: Not a convention because there's no coordination problem (it's a collective action problem) and no conditional preference for conformity (each driver wishes everyone took the bus, but if others drive, you might still drive because if you take the bus and others drive, you get the worst of both: bus and traffic). Also, the case says "nothing depends on matching", meaning that there's no interdependence. So it fails the coordination requirement.

  Therefore, the rule must require that there is a coordination problem (with interdependent actions and conditional preferences).

  In the snow case, currently there is no coordination problem because the clearing of one patch does not affect others. Therefore, Rule A (strict) would say: not a convention.

  But wait: the gossip and social disapproval might be creating a new coordination problem? Consider: if everyone else clears, then you face social disapproval if you don't. So you prefer to clear if others are clearing (and thus enforcing the norm). However, note that the social disapproval is not about the clearing per se but about the norm violation. This is more like a social norm than a convention in the Lewisian sense.

  However, let's note that Lewis's account does not require that the coordination problem be the original one. It could be that the practice now creates a new coordination problem. But what is the new coordination problem? The problem of avoiding gossip. To avoid gossip, you must clear. But note: if everyone else is clearing, then if you don't, you get gossip. If everyone else stopped clearing, then you wouldn't get gossip for not clearing. But the problem is that if you are the only one clearing, you don't get any benefit (because you don't need the others' patches) and you still get the cost of clearing. But then why would you clear? Only because of the gossip? So the coordination is on the norm: we are all expected to clear, so we all do it to avoid gossip.

  But then the conditional preference is: if others clear and enforce the norm (by gossiping about non-clearers), then I prefer to clear to avoid gossip. If others did not enforce the norm (didn't gossip) then I wouldn't care.

  So it becomes a coordination problem on the norm enforcement? But note that the enforcement (gossip) is an action too. So we have a higher-order coordination problem? It's complex.

  But in the snow case, the non-compliance is observable only to immediate neighbors. So the gossip network is limited. However, it might still work.

  But Lewis's original account is about direct coordination: like stepping left to avoid collision. The snow case does not have that direct coordination.

  Given the colleague's verdicts, she might be using a strict Lewisian definition that requires a coordination problem. In that case, the snow case would not be a convention.

  Alternatively, she might be including norms that are maintained by social sanctions even if the original coordination problem is gone.

  But note the red light case: it has sanctions (fines and honking). So sanctions are present in a convention. However, the red light case also has an inherent coordination problem: without the rule, there would be accidents. The sanctions are added to enforce the convention. The snow case does not have an inherent coordination problem anymore. The sanctions are the only reason for compliance.

  So let's propose two rules:

  Rule 1 (Strict Coordination): A convention must involve a coordination problem (i.e., actions are interdependent and there are multiple equilibria) and the regularity must be arbitrary. Additionally, common knowledge is required.

  Rule 2 (Broad Social Norm): A convention is a regularity that is arbitrary, common knowledge, and there is a conditional preference for conformity that may be due to social sanctions (like gossip) even if there is no direct interdependence of the primary action.

  Now, apply to snow case:

  - Rule 1: Not a convention because there is no coordination problem (no interdependence in the primary action of snow clearing).

  - Rule 2: Convention because there is a conditional preference: you clear to avoid gossip, and if others didn't gossip (or if they stopped clearing) then you might stop. So the preference for clearing is conditional on others enforcing the norm.

  But note the non-convention case of driving alone: there, each driver wishes everyone took the bus, but there's no social sanction and no conditional preference for taking the bus. So Rule 2 would correctly not call that a convention.

  Now, what about taking the stairs? It's not a convention because there's no conditional preference: you take the stairs because the lift is broken, regardless of what others do. So Rule 2 would say not a convention.

  So both rules fit the non-conventions.

  What about the conventions? They all have coordination problems. Rule 2 would also accept them because they have conditional preferences. So both rules fit the convention cases.

  Therefore, we have two rules that are consistent with the verdicts so far.

  Now, which one will the colleague use for the snow case?

  We have to guess. Given that she is a Lewisian, she might stick to the strict definition (Rule 1). Moreover, Lewis's original account is about coordination problems. Therefore, I think she will say that the snow case is not a convention.

  But let me note that in the red light case, there is an inherent coordination problem (safety) and the sanctions are secondary. In the snow case, there is no inherent coordination problem. The only reason for the conditional preference is the social sanction. This is more characteristic of a social norm.

