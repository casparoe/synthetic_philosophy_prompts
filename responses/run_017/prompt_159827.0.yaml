     Therefore, for the counting package:

          If we use events: U = 1/3 (same as base) and M = 1/2 (since given Monday, the coin is equally likely Heads or Tails? Actually, note: on Monday, the awakening is 1 hour regardless of the coin, so the event-based Monday conditional might be the same as base: M=1/2?).

          But if we use moments, then:

            Heads: only Monday, 1 hour.
            Tails: Monday (1 hour) and Tuesday (3 hours) -> total 4 hours.

            Without conditioning on Monday, the total duration of experimental experience is:
               Heads: 1 hour
               Tails: 4 hours
            So the probability of being in a Heads awakening at a random moment is 1/(1+4)=1/5.

            Now, what about M? If told "today is Monday", then we have:

               Heads: Monday (1 hour)
               Tails: Monday (1 hour) and also Tuesday (3 hours) but we are told today is Monday so we are in the Monday part.

            But note: the Monday awakening in Tails is only 1 hour, and in Heads it is 1 hour. However, the fact that the Tuesday awakening is longer doesn't affect the Monday part. But when we are told "today is Monday", we are in a Monday moment. How do we update?

            The Monday moments are:
