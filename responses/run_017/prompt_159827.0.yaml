               Tails: 1 hour on Monday (and then 3 hours on Tuesday, but that's irrelevant to being Monday).

            So the total Monday moments: 1 (Heads) + 1 (Tails) = 2 hours.

            Therefore, the conditional probability of Heads given Monday is 1/2? 

            So if we use moments:

