  The user's analysis of the three cases is sharp: South Africa prioritizes disclosure over contrition, Argentina pursued truth *after* blocking punishment, and Rwanda reduced sentences for confession. Key puzzles emerge: why is punishment waivable in some contexts but not others? Why is truth non-waivable? Why is self-granted amnesty "impunity" while conditional amnesty is "justice"? 

