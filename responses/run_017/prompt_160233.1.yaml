answer: |-
  Your analysis is remarkably incisive. The practice *does* presuppose a specific, coherent theory—one that transcends your friend's retributive binary and explains the variations across cases. Here's the reconstructed implicit theory, its core commitments, and answers to your specific questions.

  **The Implicit Theory: Societal Accounting for Structural Harm**

  Truth commissions presuppose that **grave political violence constitutes a harm primarily against the *political community and its foundational norms*, creating a societal debt.** This debt has two intertwined but distinct components:

  1.  **The Debt of Truth (Non-Waivable):** The community possesses an inherent, non-negotiable right to know the authoritative, official truth about systematic violations of its core constitutional or moral order. This truth is:
      *   **A Public Good:** Essential for collective self-understanding, historical record, preventing denialism, and restoring civic trust.
      *   **A Form of Minimal Justice:** Acknowledgement of the *fact* of the violation against the community's norms is a fundamental, irreducible element of justice. Silence itself perpetuates the harm.
      *   **Held by the Community (Present & Future):** While victims have a profound interest, the primary holder is the political community as an enduring entity. Future generations inherit this right to the historical record.

  2.  **The Debt of Accountability (Conditionally Waivable):** The perpetrator incurs a debt of accountability to the community for violating its fundamental norms. This debt *can* potentially be satisfied in different ways, not solely through punitive hard treatment:
      *   **Punishment (Retributive/Deterrent):** One form of discharging the debt, signifying condemnation and imposing cost.
      *   **Full Disclosure (Restorative/Condemnatory):** Another form. By forcing the perpetrator to officially and publicly acknowledge the *community's* truth (the facts of their violation against its norms), they:
          *   Contribute to discharging the Debt of Truth.
          *   Submit to the community's authority and narrative.
          *   Undergo a form of symbolic condemnation through the act of compelled confession before its representatives.
      *   **The Community as Creditor:** Only the legitimate political community, acting through a legitimate process (like a commission), can accept a substitute (disclosure) for punishment. It "owns" the claim regarding the violation of *its* norms.

  **How This Theory Explains the Cases & Your Puzzles:**

  1.  **Punishment's Waivability/Commutability:** Punishment is not an absolute "debt" in the retributive sense *owed solely to the victim*. It's one possible mode of satisfying the societal debt of accountability for violating communal norms.
      *   *South Africa:* The new, legitimate community (post-apartheid SA) deemed full disclosure sufficient to satisfy the accountability debt *to the community* for politically motivated acts, waiving punishment. The focus was on establishing the *community's* truth.
      *   *Rwanda:* The community (represented by the state) deemed punishment necessary but commutable. Disclosure reduced the punitive cost *while still imposing a tangible cost* (reduced sentence + labour) and contributing to truth. The price reflected a balance between societal demands for accountability and practical needs.
      *   *Argentina:* Initial amnesty (self-granted waiver) was illegitimate because the *old regime* tried to discharge the debt *to itself* – it lacked standing as the legitimate creditor representing the violated community. Annulling the amnesty and pursuing prosecutions later affirmed the community's enduring claim to accountability. The truth commissions *after* amnesty addressed the **non-waivable** Debt of Truth that punishment alone couldn't satisfy.
      *   *Answer:* Punishment is waivable/commutable because it's a *tool* the legitimate community can choose to deploy or not, or modify, in service of discharging the broader societal debt of accountability (which includes truth). Waiving punishment isn't waiving a duty *owed to the victim*; it's the community choosing *how* to enforce accountability *for the violation of its own norms*.

  2.  **Truth's Non-Waivability:** The Debt of Truth is fundamental and irreducible. Even if accountability through punishment is waived (SA), blocked (Argentina initially), or commuted (Rwanda), the community's right to know *must* be addressed. A perpetrator withholding truth is failing to contribute to the discharge of this core societal debt, leaving a fundamental injustice unaddressed. They remain "liable" for this specific failure to the community.

  3.  **Self-Granted Amnesty vs. Conditional Amnesty (The Outcome Fallacy):** The difference is entirely in the **source of legitimacy**.
      *   *Self-Granted Amnesty:* The debtor (old regime) purports to release itself from accountability *to the community it violated*. This is incoherent and illegitimate – it's impunity because the legitimate creditor (the community) had no say. No societal accounting occurs.
      *   *Conditional Amnesty:* The *legitimate* representative of the community (the new state/commission) *chooses*, as creditor, to accept disclosure as a substitute for punishment to discharge the accountability debt *to itself*. This is a form of justice (albeit contested) because it involves societal accounting and imposes a cost (forced disclosure under authority).

  4.  **Victim's Veto (Lack Thereof):** The theory explains why victims lack veto power. The primary claim being adjudicated is *not* the individual tort claim against the perpetrator (though that may exist separately). It's the claim of the *political community* against the perpetrator for violating its foundational norms and causing societal harm. Victims are crucial stakeholders and beneficiaries, but the community, through its legitimate institutions, holds the authority to decide how *its* claim for accountability is satisfied. This presupposes that the wrong has a fundamental *public, constitutional dimension* beyond the private harm.

  5.  **Contrition vs. Disclosure:** South Africa's focus on disclosure, not remorse, fits perfectly. The core demand is the perpetrator's submission to the *community's authority* and their contribution to the *community's truth*. Remorse speaks to the victim; factual disclosure, even self-serving, serves the societal need for the record and official acknowledgement. The condemnation lies in the *act* of compelled confession to the commission (the community's representative), not necessarily in the perpetrator's internal state.

  **Addressing Your Specific Queries:**

  *   **What view of punishment?** Punishment is a *discretionary tool* available to the political community to enforce accountability for violations of its foundational norms and discharge (part of) the societal debt. It is not an absolute, victim-owned debt that *must* be paid in suffering. This allows for waiver, commutation, or substitution.
  *   **Status of Truth:** Truth is a **distinct entitlement of the political community (present and future)**. It is the foundational element of societal accounting. While instrumental for reconciliation and resistance to denialism, its core status is as a non-waivable component of justice – the official acknowledgement of the violation against the community's order. When hard treatment is remitted, truth becomes the *primary* form that condemnation takes (via official, forced disclosure).
  *   **Holder of the Claim:** The **political community** (represented by the legitimate state/commission) holds the claim regarding the violation of *its* norms. This implies the wrong consisted fundamentally in a rupture of the social contract and attack on the constitutional/moral order, creating societal harm. Victims *should not* have a veto on *this specific claim*, though they retain their own individual claims and must be central stakeholders.
  *   **Source of Waiver:** The source is paramount. Only a waiver granted by the *legitimate representative of the violated community* after a process of societal accounting (like conditional amnesty) constitutes justice. A self-granted waiver is inherently impunity.

  **Essential Commitments vs. Contingencies:**

  *   **Strictly Required by the Practice:**
      1.  The existence of a **non-waivable societal right to official truth** about systematic violations of fundamental norms.
      2.  The concept of **societal harm/debt** distinct from, though encompassing, individual victim harm.
      3.  The **legitimacy of the community (via its institutions)** to define and seek satisfaction for this debt.
      4.  The **conditional nature of punitive accountability** – that it *can* be waived or commuted by the community in exchange for contributions to discharging the Debt of Truth/Accountability.
      5.  **Perpetrator contribution to truth** as a core requirement for any waiver/commutation (the "price").
  *   **Contingent (Sits Well With, But Not Strictly Required):**
      1.  **Retributivism:** The practice *can* incorporate retributive elements (as in Rwanda's reduced sentence), but its core logic doesn't require punishment *must* be deserved *as suffering*. A purely forward-looking (deterrence/rehabilitation) or reparative justification for punishment could *also* fit, as long as truth remains the non-waivable core.
      2.  **Victim-Centered Reconciliation:** While desirable, deep victim-perpetrator reconciliation or even victim acknowledgement within the commission process isn't strictly necessary for the core societal accounting function (as shown by SA's lack of remorse requirement). The primary relationship mediated is perpetrator-*community*.
      3.  **Specific Forms of Truth-Telling:** Public hearings are powerful but not absolutely essential *if* the official truth is authoritatively established and disseminated. Secrecy fundamentally undermines it, however.
      4.  **Strong Consequentialism:** A thoroughgoing consequentialist *could* justify the *form* of truth commissions based solely on stability, deterrence, and peace. **However, the practice *itself* expresses the *normative commitments* above.** A purely consequentialist regime might achieve similar outcomes but would lack the *expressive justice* of societal accounting. It might be more willing to *waive truth* if deemed destabilizing or pointless – which the core practice strictly forbids.

  **Impact of Changing Presuppositions:**

  1.  **Purely Forward-Looking Punishment (No Desert):**
      *   **Truth Requirement:** Would likely become *purely instrumental*. Its value would depend solely on its contribution to deterrence, reconciliation, stability, or public health (e.g., understanding trauma). If disclosure in a specific case served no clear future purpose, it could potentially be waived. The core notion of truth as an inherent entitlement/part of justice would vanish.
      *   **Commission's Nature:** It would shift decisively towards an **intelligence-gathering/public health exercise**. The focus would be on collecting useful data for future policy, not on societal accounting or condemnation through confession. Waiving disclosure where "unhelpful" becomes thinkable. Distinguishing it from impunity would be harder, resting only on future benefits, not past accounting.

  2.  **Purely Instrumental Right to Truth:**
      *   **Public Hearings:** Could be dropped if deemed counterproductive (e.g., causing unrest) and replaced with private depositions, as long as the information was recorded officially.
      *   **Waiving Disclosure:** Conceivable in cases where the truth is already known, the victim/survivors request privacy, or disclosure serves no discernible instrumental purpose (e.g., confirming minor details). The **non-waivable core** would disappear.
      *   **Distinction from Impunity:** Blurs significantly. If truth is only valued for its effects, and those effects are absent, then conditional amnesty with *no* useful disclosure becomes functionally equivalent to blanket amnesty. The expressive condemnation inherent in *compelled* contribution to the societal record is lost.

  **The Unresolved Case: Private, Redundant Disclosure**

  *   **Has he done what the practice demands?** **No, according to the implicit theory.**
  *   **Why?** The core demands are:
      1.  **Contribution to the *Official Societal Record*:** A sworn statement to the commission *does* contribute to the official record, satisfying the minimal Debt of Truth *if* it becomes part of the authoritative archive/report. However...
      2.  **Submission to *Community Authority* and *Public Condemnation*:** The refusal to speak publicly fundamentally undermines this. The practice demands the perpetrator acknowledge the violation *before the community*, represented by the commission and, implicitly, the public. Private disclosure avoids this performative act of societal accounting and condemnation. It treats the debt as a private transaction with the state, not a public reckoning.
      3.  **Value of Redundancy:** Even confirming known facts has value for the *official, authoritative record*. It removes doubt, counters denialism, and completes the historical account for the community and future generations. The perpetrator doesn't get to decide what's useful; contributing to the full record is the obligation.
  *   **Conclusion:** He has partially satisfied the Debt of Truth (if archived officially) but has *failed* to satisfy the demand for public accountability and submission to community authority inherent in discharging the Accountability Debt via disclosure. He has not fully paid the "price" for amnesty/commutation. The practice demands the *public* performance of truth-telling as part of the societal reckoning.
