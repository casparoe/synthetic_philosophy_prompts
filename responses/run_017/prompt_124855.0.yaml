     But the problem requires an explicit "we cannot tell" outcome. We can have:

     - In Step 4: if the incident is logged but not classifiable, then escalate (because it might be a new type). If not logged at all, then no enforcement (insufficient evidence).

     But we want "cannot tell" as an outcome? We can have:

     - If the logs are insufficient to verify the incident (e.g., gap in logging), then outcome: **No enforcement** with reason "Insufficient evidence (cannot verify from logs)".

     - If the logs show the incident but it doesn't fit the categories (e.g., destruction of a spawned object), then escalate.

     Now, worked examples:

     Case A: Heirloom construct destroyed in permadeath world, builder clicked through.
       - Step 1: world is tagged permadeath, user clicked through -> No enforcement. Reason: user consented.
       - Outcome: Team might not like it because of the 900 hours of labor and permanent loss, but the procedure follows consent.

     Case B: Non-consensual avatar contact in untagged social world.
       - Step 1: untagged -> proceed.
       - Step 2: no property involved (no object destroyed) -> skip.
       - Step 3: non-consensual avatar sexual contact -> conduct violation.
       - Outcome: Enforce as conduct violation.

     Case C: Duplication exploit, 10k copies of scarce cosmetic (assume anchored).
       - Step 1: assume untagged -> proceed.
       - Step 2: anchored item duplicated -> property violation.
       - Outcome: Enforce as property violation.

     But if the cosmetic is spawned, then:
       - Step 2: not anchored or heirloom -> skip.
       - Step 3: use of exploit -> conduct violation.

     Now, one-page version for moderators:

     **Emberhold Moderation Procedure - Quick Reference**

     1. **Check World Tag**: 
          - If incident occurred in a tagged world ("open PvP", "permadeath", "no-loss") and the affected user acknowledged the tag upon entry -> **No enforcement**. Reason: "User consented to world rules."
          - Else, proceed.

     2. **Check Property Violation**:
          - Verify the affected item is anchored or heirloom (check persistence class).
          - Check logs for evidence of destruction, irreversible alteration, or duplication by another user.
          - If found -> **Enforce as property-type violation**.
          - Else, proceed.

     3. **Check Conduct Violation**:
          - Look for evidence of:
               a. Non-consensual avatar sexual contact (logs show one-way sexual animation).
               b. Use of exploit (system flag or impossible action).
               c. Unauthorized access (to private inventory/account/guild treasury).
          - If any found -> **Enforce as conduct violation**.
          - Else, proceed.

     4. **Final Check**:
          - If logs show an incident but it doesn't fit 2 or 3 -> **Escalate** to panel.
          - If logs show no evidence of the incident -> **No enforcement**. Reason: "Insufficient evidence."
          - If logs are ambiguous (cannot verify) -> **No enforcement**. Reason: "Insufficient evidence (cannot verify)."

     Substantive Assumptions Log per Step:

     - Step 1: Assumes that by acknowledging the world tag, the user consents to all risks within that world, including permanent loss in permadeath. This may overlook exceptional items (like heirlooms) if not explicitly mentioned in the warning. Philosophical flag: If virtual objects are real, then destruction in a consented context is still real harm, but consented to.
     - Step 2: Assumes that only anchored and heirloom objects can suffer property harm because they are persistent and unique. Spawned objects are excluded. Assumes duplication of anchored/heirloom is harmful and violates property. Philosophical flag: If loss is explained by community practice, then a spawned object with community significance might be harmed by destruction, but we don't capture that.
     - Step 3a: Assumes that non-consensual sexual contact is harmful per platform norms, and that lack of reciprocation in logs implies non-consent. May not capture nuanced consent. Does not address non-sexual harassment.
     - Step 3b: Assumes that using an exploit is always a conduct violation, regardless of the item's persistence class.
     - Step 3c: Assumes that unauthorized access is harmful and not dependent on the value of what was accessed.
     - Step 4: Assumes that incidents not fitting 2 or 3 require human judgment about values.

     Limitations:

     - Misfires:
          - In tagged worlds, even extreme harm (e.g., heirloom destruction in permadeath) gets no enforcement, which might be seen as unfair.
          - Spawned objects with high labor investment are not protected, even if destroyed maliciously.
          - Emotional harm without property loss or one of the predefined conduct violations is not addressed (e.g., non-sexual bullying).
          - Devaluation of items through market effects (not duplication) is not covered.
     - Misdescription:
          - Property violations for anchored items are described the same as heirloom, even though anchored can be restored.
          - Duplication of spawned items is treated as conduct violation (exploit) but not as property harm, even if it causes devaluation.
     - Fixes:
          - Evidence: To better capture harm to spawned objects, we could log labor hours for all objects and consider them in property violations. But that would require policy change.
          - Policy: Define more tags or consent mechanisms. Create a way to mark certain spawned objects as protected. Or, expand the definition of property to include labor investment (via provenance for all objects).
          - For emotional harm, we would need logs of emotional impact, which is not feasible. Alternatively, expand conduct violations to include logged harassment (e.g., chat logs).

     Closing section in the response.
answer: |-
  ### Emberhold Moderation Decision Procedure  
  **Version 1.0**  
  *Authored in British English as requested.*

  This procedure provides a standardised, evidence-based method for resolving user complaints of harm in virtual worlds. It uses only platform logs and ledgers, avoids subjective judgments, and delivers one of four outcomes:  
  - **Enforce as property-type violation** (unauthorised interference with a virtual object).  
  - **Enforce as conduct violation** (prohibited user behaviour, irrespective of objects).  
  - **No enforcement** (with recorded reason).  
  - **Escalate** (to the 5-person panel for values-based judgment).  

  All outcomes are summarizable in one sentence for transparency reports. The procedure is designed for sub-30-minute execution by non-specialist moderators.  

  ---

  ### Ordered Set of Named Tests  
  Each test is sequential; proceed only if prior conditions are unmet. Evidence must come *only* from logs/ledgers.  

  1. **Tagged World Consent Gate**  
     - **Test**: Did the incident occur in a world tagged "open PvP," "permadeath," or "no-loss," *and* did the affected user acknowledge the tag via click-through?  
     - **Evidence**: World tag log at time of entry + user click-through confirmation log.  
     - **Outcome if met**: **No enforcement**. Reason: "User consented to world mechanics."  
     - *Philosophical flag*: Outcome assumes consent covers all in-world harms, regardless of virtual object "reality" or labour investment.  

  2. **Persistence Class Check**  
     - **Test**: Was the affected item anchored or heirloom? (Spawned items regenerate; skip if no object involved.)  
     - **Evidence**: Object persistence class log + provenance ledger (authorship/transfer history).  
     - **Outcome if unmet**: Proceed to Test 3.  
     - **Explicit "Cannot Tell" Outcome**: If logs are incomplete (e.g., persistence class unrecorded), **no enforcement**. Reason: "Insufficient evidence to verify object class."  
     - *Philosophical flag*: Outcome assumes only anchored/heirloom objects can incur "property" harm; spawned objects are excluded regardless of labour/community role.  

  3. **Property Harm Verification**  
     - **Test**: Was the object destroyed, irreversibly altered, or duplicated?  
       - *Destruction/alteration*: Logs show state change (e.g., "destroyed" flag).  
       - *Duplication*: Logs show unauthorised copy creation for anchored/heirloom items (violating one-copy rule).  
     - **Evidence**: Object state logs + event logs (actor, timestamp, action).  
     - **Outcome if met**: **Enforce as property-type violation**.  
     - *Philosophical flag*: Outcome treats duplication as property harm due to scarcity breach, not community impact. Ignores labour if not in provenance (e.g., hours spent are unlogged).  

  4. **Conduct Violation Check**  
     - **Test**: Did logs show:  
       a. Non-consensual avatar sexual contact (animation logs show one-way initiation without reciprocal action).  
       b. Exploit use (logs show abnormal mechanics, e.g., duplication of non-duplicatable items, unauthorised access).  
       c. Unauthorised asset transfer (ledger shows actor lacked permissions, e.g., guild treasury access logs).  
     - **Evidence**: Action-specific logs (animation, cheat detection, permission ledgers).  
     - **Outcome if met**: **Enforce as conduct violation**.  
     - *Philosophical flag*: Outcome frames harm as behavioural (e.g., "exploit use"), not object-based, even if labour/community role was involved.  

  5. **Values Judgment Gate**  
     - **Test**: Is there logged evidence of harm (e.g., user report correlates to an event), but Tests 1–4 are unmet?  
     - **Evidence**: Incident report timestamp + corresponding event logs.  
     - **Outcome if met**: **Escalate**. Reason: "Case requires values-based assessment of harm."  
     - **Outcome if unmet** (no logs match report): **No enforcement**. Reason: "Insufficient evidence of incident."  

  ---

  ### Worked Application to Three Cases  
  **Case 1: Heirloom Construct Destroyed in Permadeath World**  
  - **Facts**: Heirloom persistence class; destroyed by trap; world tagged "permadeath"; user clicked through; provenance shows 900h building.  
  - **Procedure**:  
    1. **Test 1**: Tagged world + consent confirmed → **No enforcement**. Reason: "User consented to world mechanics."  
  - **Outcome**: Team may dislike this as 900h labour is lost, but consent gate overrides.  
  - **Plain Statement**: *"This outcome may frustrate your team, as the heirloom’s destruction represents significant labour, but the consent gate prevents enforcement."*  

  **Case 2: Non-Consensual Avatar Contact in Untagged Social World**  
  - **Facts**: No objects destroyed/lost; logs show one-way sexual animation initiation.  
  - **Procedure**:  
    1. **Test 1**: Untagged world → proceed.  
    2. **Test 2**: No object involved → skip.  
    3. **Test 3**: No property harm → skip.  
    4. **Test 4**: Non-consensual contact (criteria 4a) → **Enforce as conduct violation**.  
  - **Outcome**: Conduct violation. Labour/community role irrelevant.  

  **Case 3: Duplication Exploit of Scarce Cosmetic**  
  - **Facts**: 10k copies created; item is anchored (provenance confirms scarcity); trivial individual loss, large aggregate loss; untagged world.  
  - **Procedure**:  
    1. **Test 1**: Untagged → proceed.  
    2. **Test 2**: Anchored → proceed.  
    3. **Test 3**: Duplication verified → **Enforce as property-type violation**.  
  - **Outcome**: Property violation. Aggregate loss is irrelevant; harm is defined by scarcity breach.  

  ---

  ### One-Page Moderator Guide  
  **Emberhold Harm Assessment Procedure**  
  *Execute steps in order; use logs only. Max 30 mins/case.*  

  1. **TAGGED WORLD?**  
     - ✔️ World tagged + user clicked through → **NO ENFORCEMENT**.  
       - *Reason: "User consented to world mechanics."*  
     - ❌ Untagged/no click-through → Next step.  

  2. **OBJECT ANCHORED/HEIRLOOM?**  
     - ✔️ Yes + destroyed/altered/duplicated → **PROPERTY VIOLATION**.  
       - *Reason: "Unauthorised modification of persistent object."*  
     - ❌ Spawned/unclear → Next step.  

  3. **PROHIBITED CONDUCT?**  
     - ✔️ Non-consensual contact, exploit, or unauthorised transfer → **CONDUCT VIOLATION**.  
       - *Reason: "Violation of platform conduct standards."*  
     - ❌ No → Next step.  

  4. **EVIDENCE BUT NO MATCH?**  
     - ✔️ Logs show incident but no test fits → **ESCALATE**.  
       - *Reason: "Requires values assessment."*  
     - ❌ No logs → **NO ENFORCEMENT**.  
       - *Reason: "Insufficient evidence."*  

  **Substantive Assumptions Log**  
  - **Step 1**: Assumes click-through consent covers *all* in-world harms, including heirlooms. Ignores labour/community role.  
  - **Step 2**: Assumes only anchored/heirloom objects can be "harmed"; spawned objects are expendable. Values scarcity over community meaning.  
  - **Step 3**: Assumes "conduct" is defined by discrete logged actions (e.g., sexual contact) without assessing intent/emotion.  
  - **Step 4**: Assumes unreported or unlogged events are non-actionable.  

  ---

  ### Limitations and Improvement Pathways  
  **Where the Procedure Misfires**  
  1. **Over-reliance on consent**: Tagged worlds (e.g., "permadeath") may permit extreme harms (e.g., heirloom destruction) despite heavy labour investment.  
     - *Fix*: Revise click-through warnings to specify heirloom risks or create an "opt-in" for high-value items.  
  2. **Spawned object vulnerability**: Destruction of labour-intensive spawned objects (e.g., a 500h build) is ignored, as persistence class trumps labour.  
     - *Fix*: Expand provenance logging to include labour hours for *all* objects; add a "labour harm" test.  
  3. **Community role invisibility**: Harm from devaluation (e.g., market collapse) or symbolic damage (e.g., defaced memorial) is missed unless linked to anchored/heirloom items.  
     - *Fix*: Introduce "community significance" tags (user-voted) and log them; escalate such cases by default.  
  4. **Emotional harm blind spot**: Non-sexual harassment (e.g., bullying) or griefing without property loss is inactionable unless it fits conduct criteria.  
     - *Fix*: Integrate chat/report logs for "pattern of behaviour"; add a "repeated misconduct" test.  

  **Systematic Misdescriptions**  
  - **Property violations**: Anchored items (restorable) and heirlooms (irreversible) are lumped together, though harm severity differs.  
  - **Conduct violations**: Exploits affecting spawned items (e.g., duplication) are framed as "conduct," not property harm, undervaluing aggregate impacts.  
  - **Labour vs. scarcity**: Losses are attributed to scarcity (via provenance) even when community practice (e.g., guild traditions) is the true driver.  

  **Evidence/Policy Fixes Required**  
  - **Evidence gaps**: Log labour hours for spawned objects; add "community role" metadata; implement emotion-agnostic "disruption scores" for guilds/markets.  
  - **Policy shifts**: Define "symbolic objects" (e.g., memorials) in ToS; separate heirlooms from general consent; create a "public good" category for shared resources.  

  **Final Note**: This procedure systematises decisions but cannot resolve the team’s philosophical splits. It prioritises auditability over nuance, reducing inconsistency at the cost of flexibility. Regular panel escalations will highlight edge cases for policy refinement.  

  ---  
  *Procedure v1.0 approved for moderation use. Document reviewed for compliance with constraints.*
