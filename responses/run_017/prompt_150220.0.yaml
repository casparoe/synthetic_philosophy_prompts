  The leaves we aim for:
  - Strong foundationalism
  - Modest foundationalism
  - Coherentism (two flavours: pure and responsive)
  - Infinitism
  - Suspension (nothing is justified)
  - Local practice (justification is practice-relative)

  We also note that some combinations might be unnamed or unoccupied.

  Distinctions we care about:
  (a) Termination of the structure vs. subject's access (infinite chain with on-demand links)
  (b) Acyclicity vs. cycles allowed
  (c) Stopping meaning "no reason needed" vs. "different kind of reason"

  We use analogies from software: dependency graphs, build systems, etc.

  We design 8-12 nodes (questions). We list them and then build the tree.

  Questions (nodes):

  1. **Initial Commitment**: We start with the agreed point: "A belief is justified only if there is something to be said for it that is not simply the belief restated." (This is our entry node.)

  2. **Case: Circular Certification**: Imagine two internal documents, A and B. Document A states that B is trustworthy, and document B states that A is trustworthy. There is no external source. Does this mutual certification make either document trustworthy?
     - (a) Yes, because they back each other up.
     - (b) No, because it's circular and doesn't connect to anything else.

  3. **Case: Infinite Chain Feasibility**: Consider a CI pipeline with an infinite chain of checks: each check verifies the next one, and there's no end. But the chain is generated on-demand (like lazy evaluation) so a finite mind can use it. Can such a setup ever justify the results of the first check?
     - (a) Yes, because at every point you can get the next link when needed.
     - (b) No, because without a base the whole chain is unsupported.

  4. **Case: Self-Compiling Compiler**: A compiler is used to compile its own source code. The compiled compiler is then used to compile the source again. Is the resulting compiler trustworthy?
     - (a) Yes, because it passes the self-compilation test.
     - (b) Only if the initial compiler was trustworthy to begin with.
     - (c) No, because it's circular.

  5. **Case: Discrepancy Between Dashboard and Log**: A dashboard shows that a service is healthy, but the log shows an error. You don't have the source for either. Which one do you trust?
     - (a) The dashboard, because it's designed to show status.
     - (b) The log, because it records events.
     - (c) Neither, without more information.

  6. **Case: Memoized Result**: A system uses a memoized result (cached from a complex calculation) but the original derivation is lost. Is it acceptable to use the result without rederiving it?
     - (a) Yes, because it was derived correctly once and we trust the system.
     - (b) Only if we can in principle rederive it if needed.
     - (c) No, because we can't verify it now.

  7. **Case: Recursion without Base Case**: A recursive function with no base case runs because of lazy evaluation and produces a stream of values. Is this function well-defined?
     - (a) Yes, because it produces the required values on demand.
     - (b) No, because without a base case it's not a proper recursion.

  8. **Case: Test Passing Locally but Failing in Pipeline**: A test passes on a developer's machine but fails in the CI pipeline. Which result do you trust?
     - (a) The pipeline, because it's a controlled environment.
     - (b) The local test, because the developer can debug interactively.
     - (c) Neither; we must investigate the discrepancy.

  9. **Case: Stopping Point Type**: When a justification chain stops, is it because:
     - (a) No further reason is needed (it's self-evident or brute).
     - (b) A different kind of reason (non-inferential) is in play.

  10. **Case: Global vs. Local Support**: Consider a large codebase where many modules depend on each other. Some modules are never called in production. Is it necessary that every module is individually justified, or is it enough that the system as a whole works?
      - (a) Every module must be individually justified.
      - (b) The system as a whole working is enough.

  11. **Case: External Responsiveness**: A system of beliefs (or code) is entirely self-consistent and mutually supporting, but it never updates in response to new data. Is it justified?
      - (a) Yes, because internal consistency is sufficient.
      - (b) No, because it must be responsive to the external world.

