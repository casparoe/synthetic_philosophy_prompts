prompt: |-
  I'm taking a graduate seminar on the political economy of international investment law, and I keep feeling that our material is much older than we pretend it is. Two institutions keep coming up. The first is the standard clause in investment treaties and trade agreements that lets a foreign company haul a host government before a private arbitral tribunal and claim damages if a new law — a mining ban, plain-packaging rules for cigarettes, a minimum-wage increase, a change to licensing — cuts into the profits the company expected when it invested: three arbitrators, usually commercial lawyers who rotate between acting as counsel and as decision-makers, rule on the legality of a sovereign's legislation, and their award is enforceable against the state, while the state cannot bring a claim against the company under the same clause. The second is the family of special economic zones and proposed "charter cities" in which a host state hands over the making and enforcing of rules inside a territory — land rules, labour rules, sometimes courts — to a foreign or private developer for decades at a time. I've started thinking of both as the return of the chartered company: a body that does business under a grant of privilege and also exercises what look like sovereign powers.

  Suppose Adam Smith were in the seminar room. Someone has explained both institutions to him, along with the facts that today's firms mostly are not state-chartered monopolies with their own armies and that the governments being sued are often elected ones; someone has also walked him through the modern antitrust consensus, in which reviewers ask almost exclusively whether a practice raises prices or restricts output. Give me your reconstruction of his reaction, drawing on what he actually argued about the chartered companies, the monopoly of colonial trade, and the empire across the Atlantic, and on his claim that a country needs little more than peace, low taxes, and reasonably impartial courts to become prosperous. I want the reconstruction rather than a summary of the Wealth of Nations: how he would name what these institutions are, which of his commitments they offend (privilege granted at the public's expense, government captured by the interests of merchants and manufacturers, the constitutional unworkability of rule at a distance) and which of them they might actually serve (secure property, restraint on arbitrary rulers, the disciplining of governments that expropriate). Two further questions matter most to me. First, my own proposed fix: would it satisfy him if the clause were made reciprocal — if the state could bring claims against investors, and if workers, communities, or domestic firms could bring claims before the same tribunals — or is the delegation of adjudication over public law to private arbitrators the objectionable part, so that symmetrising it changes nothing? Second, my suspicion that he would find the modern consumer-welfare lens nearly useless, since what he objected to in monopoly was often the privilege and the corruption of government rather than the price, and a reviewer who asks only about prices would wave through arrangements he would have thought poison.

  Please answer as a numbered list of exactly five items, each one or two sentences long, with no introduction and no concluding summary: (1) how he would characterise these institutions; (2) which of his commitments they offend and which they serve; (3) whether the reciprocity fix settles his objection; (4) how he would regard the consumer-welfare-only approach to market power; and (5) where the extrapolation from eighteenth-century chartered companies genuinely breaks down, and what would change his mind. No citations or reading suggestions — I'll fill those in myself.
reasoning: |-
  Hmm, the user is in a graduate seminar on international investment law and political economy, and they're noticing that modern institutions resemble historical chartered companies. They're asking how Adam Smith would react to ISDS clauses and special economic zones, based on his views in "Wealth of Nations." They want a specific five-point reconstruction without citations.

  The user is clearly frustrated with the seminar's framing - they feel the material is outdated but presented as contemporary. They're drawing parallels between current investment arbitration and colonial-era chartered companies that had sovereign powers. Their proposed solution is making ISDS reciprocal, but they suspect Smith would object to the private arbitration model itself, not just asymmetry. They also think Smith would reject modern antitrust's narrow focus on consumer welfare (prices/output) since he cared more about privilege and corruption.

  For point 1, Smith would definitely see both institutions as revivals of chartered company logic - private entities exercising quasi-sovereign powers through state-granted privilege. His writings on the East India Company show deep suspicion of such delegated authority.

  For point 2, these offend Smith's core principles: they're state-granted privileges that distort markets and corrupt governance, while undermining national sovereignty through distant tribunals. The only potential alignment is with property security, but even that's questionable given the tribunals' private nature.

  Regarding point 3 (reciprocity fix), the user's suspicion is correct - Smith would reject the fundamental delegation to private arbitrators as unconstitutional. Symmetry doesn't solve the core problem of privatizing public law adjudication.

  On point 4 (consumer welfare), the user's critique is sharp - Smith would find price-focused antitrust woefully inadequate. His objection to monopolies centered on their corrupting influence and political privilege, not just pricing effects. A consumer-welfare lens would indeed approve arrangements he'd consider toxic.

  Finally for point 5 (historical differences), key breakdowns include the absence of corporate armies and existence of elected governments today. But Smith would likely counter that structural power imbalances remain, and that legalized privilege persists despite formal democracy. Evidence of tribunals actually disciplining genuinely arbitrary states (not just democratic policy changes) might sway him slightly.

  The user's clearly done their homework - they've spotted how modern institutions recreate colonial patterns despite surface differences. Their questions cut to the heart of whether political economy has really progressed since Smith.
answer: |-
  Here is the reconstruction:

  1.  He would characterize both institutions as modern revivals of the chartered company principle, where sovereign powers (rule-making, adjudication, enforcement) are dangerously delegated to or usurped by private interests operating under special privilege granted by the state.
  2.  They offend his commitments against state-granted privilege distorting competition, the corruption of government by merchant/manufacturer interests ("men who live by profit"), and the unworkability of delegating sovereign authority, especially at a distance. They might weakly serve the commitment to secure property, but undermine impartial justice and responsible government.
  3.  The reciprocity fix would not settle his core objection; delegating adjudication of sovereign public law matters to private commercial arbitrators, regardless of symmetry, fundamentally violates his principle of impartial, public justice administered by the sovereign state.
  4.  He would regard the consumer-welfare-only approach to market power as dangerously narrow and inadequate, ignoring the corrupting political influence and unjust privilege inherent in monopoly, which he deemed more poisonous than mere high prices.
  5.  The extrapolation breaks down as today's firms lack their own armies and states are often elected; what might change his mind is concrete evidence that these mechanisms *only* restrain genuinely arbitrary (non-elected) rulers without creating new privileges or undermining democratic legislatures, which he would find unlikely.
