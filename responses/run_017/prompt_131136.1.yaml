prompt: |-
  Hey — I'm in the first year of an MPhil and have to hand in a dissertation prospectus by the end of next month. The thesis itself would be about 15,000 words, written between roughly March and October, and my supervisor has said (unhelpfully) that he'll support anything as long as the question has a determinate answer and I can finish it. I keep circling back to the old statue-and-the-clay problem and I'd like to build the prospectus around it, but not in the form it usually gets discussed in.

  Here's the half-formed thought I can't get straight. Every version of the debate I know seems to smuggle in what I'd call a matter-first bias: we're given a statue and the lump of clay it's made of, and the lump is quietly treated as the metaphysically basic occupant of that region — the thing that was already there before the sculptor showed up, the thing that survives squashing, the thing whose identity conditions are the demanding ones — so the whole question becomes how the statue relates to it. Identical to it? Merely constituted by it without being the same thing? A second object coinciding with it? A stage or temporal part of something longer-lived? But there are loads of artifact-ish objects where nothing like that holds, because there's no privileged stuff they're made of and no pre-existing portion of matter that got arranged: a piece of software that's been ported between languages, a committee whose members all turn over, a chess opening that gets named and then refined across decades, a fictional character who turns up under different descriptions in different novels. For those, the "what is it made of" question looks downstream of the identity question rather than upstream of it. So what I want to know is what happens to the constitution puzzle if you start from cases like those instead of from clay. Does the same pressure to posit two coinciding things — one with relaxed identity conditions, one with fussy ones — reappear, or does it evaporate? And if it evaporates, what does that tell us about the classic case: was it ever really about constitution, or was it about something else that clay happens to hide, like our practices for counting and reidentifying artifacts over time?

  My two worries are that this is either just the standard three or four positions with new examples bolted on, or that it's secretly three different questions I'd spend 15,000 words conflating. So what I need is an actual prospectus, not encouragement. Pin down a single question that's genuinely open and that someone could fail to answer; say which of the usual options it presses hardest on — coincidence, constitution-without-identity, mereological essentialism, the perdurantist treatment, the sortal/conventionalist deflation of the whole thing — and why those don't already settle it; say what I'd actually do, chapter by chapter and roughly month by month, and why that method rather than the obvious alternatives (e.g. just running the standard arguments on the new cases, or doing a straight survey); and be explicit about what the thesis would have established if it works and what would count as it having failed, including the possibility that the honest upshot is "the clay case was never a case of constitution in the first place." Also be straight with me about where this would blow past 15,000 words. And please skip any bibliography or literature review with names and dates attached — I'll fill those in myself, and I'd rather the argument stand up without them.
reasoning: |-
  Okay, I need to help this MPhil student craft a dissertation prospectus. They're circling around the statue-and-clay problem but want to approach it through non-standard cases where there's no privileged "matter-first" basis. Their core idea is that for entities like software, committees, chess openings, or fictional characters, the identity isn't derived from material constitution, which might reveal something about the original problem.

  First, I should pinpoint their central question. They're worried this might just be old arguments with new examples or that they're conflating issues. So the challenge is to formulate a single, focused question that's genuinely unresolved. The key seems to be whether the pressure to posit coinciding objects disappears in non-material cases, and if so, what that implies about the clay example.

  I recall standard positions in the constitution debate: identity theories, constitution without identity, perdurantism, conventionalism. For non-material cases, many of these might not apply directly. For instance, a committee with complete member turnover doesn't have persistent "stuff" to coincide with. This could challenge the necessity of positing two entities in the classic case.

  The student needs a prospectus structure: a clear question, why existing theories don't answer it, a chapter plan, methodology, success conditions, and pitfalls. They specifically asked to avoid literature reviews, so I'll focus on the argument.

  Their worry about conflating questions is valid. There's metaphysics of identity, social/conventional aspects, and maybe temporal parts. I should keep the question centered on whether constitution-like duality arises in non-material cases and what that reveals.

  For methodology, they shouldn't just rehash old arguments with new examples. Instead, use the cases as counterexamples or to test theories. Comparative analysis across domains could show where duality emerges or not. Success would be showing that duality is avoidable elsewhere, suggesting the clay case might be special or misanalyzed. Failure might be if all cases still require duality, or if the domains are too different to compare.

  Word count is a concern. 15,000 words isn't much, so the chapters need to be tight. Possible expansions: detailed case analyses, responses to objections, or exploring implications for related debates.

  I'll outline a prospectus with a sharp question, targeted critique of existing views, a phased chapter plan, and clear deliverables. Emphasize that if non-material cases don't need coincidence, the classic problem might be an artifact of material bias, not a general metaphysical issue.
answer: |-
  Here’s a structured prospectus designed to meet your specifications, focusing on argumentative core, feasibility, and avoiding conflation. It targets the tension between your non-standard cases and the metaphysical assumptions of the classic constitution debate.

  ---

  **Dissertation Prospectus: *Constitution Without Matter? Artifacts, Identity, and the Demise of the "Privileged Lump"***

  **1. Core Research Question:**  
  Does the metaphysical pressure to posit coinciding objects (e.g., statue and clay) persist in cases of *non-matter-constituted artifacts* (e.g., software, committees, chess openings, fictional characters)? If not, does this undermine the standard interpretation of the statue/clay case as a genuine metaphysical puzzle about constitution, rather than a reflection of domain-specific practical or conventional practices?

  **Why this question is open and non-trivial:**  
  - Existing theories (constitution without identity, perdurantism, conventionalism) *assume* or *are built to accommodate* the matter-first intuition. They haven’t systematically tested whether their core motivations (e.g., avoiding coincidence, explaining persistence through part-change) apply *without* a privileged material substrate.  
  - Simply applying standard theories to new cases *assumes* the statue/clay framework is universally applicable. Your question challenges whether that framework is necessary or apt for artifacts *in general*.  
  - If non-material cases don’t generate pressure for coincidence, it suggests the "puzzle" in the clay case might be an artifact of *materiality itself*, not constitution per se. If the pressure *does* reappear, it must arise from something other than matter (e.g., structure, function, convention), forcing a reconceptualization of "constitution."  
  - **What failure looks like:** The thesis fails if it shows non-material cases *do* fit neatly into existing models (e.g., committees are just perduring "committee-stages," software updates are temporal parts) without revealing new tensions, *or* if the cases are so disparate that no unified insight emerges. Success requires showing these cases disrupt the standard dialectic in a specific, illuminating way.

  **2. Critical Pressure on Existing Views:**  
  - **Primary Target: Coincidence/Constitution Theories** (e.g., Baker, Lynne Rudder Baker): Their core machinery (constitution as a non-identity, non-mereological relation) relies on a "fussy" underlying object (the lump) with strict modal/persistence conditions. Non-material cases often lack any plausible candidate for this "fussy" object. A committee has no "lump of members" – membership is essential to its identity. Pressure: If no "fussy" object exists, does "constitution" even apply? If not, why is it the right model for clay?  
  - **Secondary Target: Perdurantism** (e.g., Lewisian 4Dism): Treats the statue as a temporal part of the clay’s spacetime worm. But non-material artifacts (e.g., a chess opening like the "King’s Indian Defense") often lack a continuous spacetime region – its existence is defined by *abstract rules and practice*, not spatiotemporal location. Pressure: Does perdurantism illegitimately spatialize abstract artifacts? If persistence without spatiotemporal continuity is possible here, why insist on it for statues?  
  - **Implicit Challenge to Mereological Essentialism/Conventionalism:** While often rejected, mereological essentialism (if the lump changes, it’s a new lump) highlights the "fussiness" assumed in the lump. Non-material cases show many artifacts tolerate radical part/implementation change without identity change (software porting). Conventionalism (e.g., Hirsch) might absorb this, but your cases challenge *why* conventions seem to *require* a fussy material base in the clay case but not elsewhere. Is the "fussiness" of the lump itself conventional?

  **3. Methodology & Chapter Plan (Rough Timeline):**  
  *Method:* **Contrastive Analysis.** Not applying old theories to new cases, but juxtaposing the *metaphysical demands generated* by the classic case vs. non-material cases. Focus on the *explanatory pressures* (need for coincidence, need for strict identity conditions for a substrate) rather than fitting cases into predefined boxes. Avoids survey/comparative lit review.  
  *Why not obvious alternatives?*  
  - Running standard arguments on new cases: Presupposes the framework is sound.  
  - Pure conceptual analysis: Too detached; needs grounding in specific case pressures.  
  - Empirical/historical survey: Distracts from core metaphysical argument.

  **Chapter Plan (15,000 words total - Tight but feasible):**  
  - **March-April: Ch1: The Matter-First Framework & Its Discontents** (3,000 words)  
      - *Core Task:* Diagnose the implicit "matter-first" bias in the statue/clay literature. Show how the lump is treated as metaphysically privileged (pre-existing, persistence-conditions source) *by all sides*, making coincidence/constitution seem inevitable. Define the key "pressures" (need for coincidence, fussy vs. relaxed persistence).  
      - *Avoid:* Rehashing every position; focus on *shared assumptions*.  
  - **May-June: Ch2: Non-Material Artifacts: Identity Without Substrate?** (5,000 words - **Critical Expansion Risk**)  
      - *Core Task:* Analyze 2-3 paradigmatic non-material cases (e.g., Software Porting [Python to Rust], Committee w/ Full Turnover, Chess Opening Evolution). Rigorously examine:  
          - Is there a plausible candidate for a "fussy" substrate object (like the clay)?  
          - Does radical change generate pressure to posit *two* coinciding entities (one persistent, one "fussy")?  
          - What *does* ground persistence and identity conditions here (function, role, abstract structure, convention)?  
      - *Avoid:* Trying to cover all case types; depth over breadth. Focus on whether *the specific pressures* driving the clay debate reappear.  
  - **July-August: Ch3: Revisiting the Clay: Is Constitution the Problem?** (5,000 words)  
      - *Core Task:* Synthesize Ch2 findings. Argue that the absence of substrate/coincidence pressure in non-material cases reveals the clay puzzle stems not from "constitution" itself, but from:  
          - (a) The *specific nature of material stuff* (its independence from arrangement, its "fussy" persistence), OR  
          - (b) *Domain-specific practices* (how we track/clump matter vs. abstract functions).  
      - Consequence: The statue/clay case is not a *paradigm* of artifact ontology, but a *special case* driven by materiality. "Constitution" may be a red herring; the real issue is how different kinds of entities (material lumps vs. functional/abstract artifacts) ground persistence.  
      - *Engage:* How do coincidence/constitution/perdurantist theories look if Ch2 is right? Do they collapse, adapt, or become domain-restricted?  
  - **September: Ch4: Implications & Objections** (1,500 words)  
      - *Core Task:* Briefly address key objections (e.g., "Aren’t these cases just conventional?", "Doesn’t software have a physical implementation substrate?", "Isn’t this just deflationism?"). Clarify scope (artifacts, not all objects). State the positive view: Artifact persistence is pluralistic; material artifacts require distinct treatment due to their stuff.  
  - **October: Introduction/Conclusion/Polishing** (500 words Introd, 500 words Conc)  
      - *Introduction:* Clearly state the core question and thesis upfront.  
      - *Conclusion:* Hammer home: "The clay case obscures more than it reveals about artifacts; its 'puzzle' arises from contingent features of matter, not a deep metaphysical relation of constitution."

  **4. What the Thesis Establishes (If Successful):**  
  - It demonstrates that the metaphysical apparatus developed for the statue/clay case (coincidence, constitution relations, privileging a substrate) is *idiosyncratic to material constitution*, not fundamental to artifact persistence or identity.  
  - It provides a *diagnosis* of the clay puzzle: the tension arises from applying practices/expectations suited to tracking *matter* (the "lump") to entities defined by *function/structure* (the "statue"), not an ontological doubling in the world.  
  - It shifts the focus: Instead of "How does the statue relate to its matter?", the core question becomes "What grounds the persistence conditions for *different kinds* of artifacts (material, functional, abstract)?"  
  - **Honest Upshot Possibility:** If successful, it strongly supports the view that **"the clay case was never primarily about constitution in a general sense; it was about the interaction of material persistence with functional identity under specific practical constraints."**

  **5. Where it Blows Past 15,000 Words & Mitigation:**  
  - **Ch2 Case Analysis:** Drilling deep into 3 cases risks exceeding 5k words. *Mitigation:* Strictly compare *only* the reappearance/non-reappearance of the *specific pressures* identified in Ch1 (coincidence, fussy substrate). Avoid full ontology of software/committees.  
  - **Objections (Ch4):** Can balloon. *Mitigation:* Pre-select 3-4 strongest objections directly challenging the core argument (e.g., "The lump isn't privileged, it's just a representative piece of matter!"; "Your non-material cases are just conventional aggregates!").  
  - **Scope Creep:** Into social ontology (committees), philosophy of comp sci (software), aesthetics (fictional characters). *Mitigation:* Relentlessly tie every point back to the *contrast with the matter-first assumptions of the clay case* and the core question about pressure for coincidence/fussy substrates.  
  - **Engaging Literature:** Even without names/dates, summarizing positions takes space. *Mitigation:* Keep summaries in Ch1 & Ch3 ruthlessly focused on the *structural features* of the positions (e.g., "Theory X posits two objects because it assumes Y about the substrate") relevant to the core argument.

  **6. Candid Assessment of Risks:**  
  - **Conflation Risk:** Mitigated by the *highly focused question* on the *reappearance of specific pressures* (coincidence, fussy substrate) and the *contrastive method*. Ch1 tightly defines the pressures; Ch2 asks *only* if they reappear in new cases; Ch3 draws the contrast.  
  - **"Just New Examples" Risk:** Avoided by making the *diagnostic* aim central. The goal isn't to fit committees into Baker's model, but to ask *why* Baker's model seems necessary for clay but not committees, and what that reveals about the clay model itself.  
  - **Feasibility:** 15k words is tight but possible with strict discipline on scope and argumentative focus. The chapter structure provides clear milestones. The core insight (matter-first bias) is powerful and can be developed robustly within the limit if you resist tangents.  
  - **Original Contribution:** Successfully showing the statue/clay is *atypical* of artifacts due to materiality, and that its "puzzle" stems from this, is a significant challenge to a dominant metaphysical framework and reframes the debate.

  **Prospectus Summary:**  
  You have a sharp, viable project: Use non-material artifacts as a *lens* to expose the contingent role of *matter* in generating the signature puzzle of the constitution literature. By focusing on the *absence or presence* of the pressure for coincidence/fussy substrates, you avoid conflation and offer a potentially deflationary diagnosis of the classic case. Execute it with ruthless focus on the core question and contrast, and it can work within 15k words. The key is resisting the urge to build full ontologies for software/committees and instead using them *solely* as probes into the assumptions of the clay paradigm. Good luck!

  ---
  **Next Steps for You:**  
  1. **Sharpen Cases:** Pick 2-3 non-material cases you can analyze *deeply* and *contrastively* with the clay assumptions.  
  2. **Identify Pressure Points:** For each case, pre-define: What would count as the "fussy substrate"? Is there a plausible candidate? Does change generate pressure for coincidence?  
  3. **Anticipate Pushback:** What’s the strongest objection *from within* the constitution literature to your diagnostic claim?  
  4. **Timeline Discipline:** Break Ch2/Ch3 into monthly/weekly writing goals. 15k words demands efficiency.
