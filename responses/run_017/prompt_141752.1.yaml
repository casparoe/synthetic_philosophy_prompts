prompt: |-
  So I keep going back and forth with a friend about Putnam's Twin Earth setup and I think we're actually arguing past each other — I suspect we mean different things by "externalism". Can you explain, as concretely as you can, the difference between saying that reference is fixed by whatever is *currently* causing or covarying with your uses of a word, versus saying that it's fixed *historically* — some original grounding in a sample, plus a chain of transmission running down to you? I get the idea in the abstract; what I want is to see where the two actually come apart.

  So here's the version of the case I care about, which isn't the standard one. Forget the duplicate planet far away. Instead imagine it's *this* Earth that slowly changes: starting around now and finishing fifty years later, every lake, river, cloud and tap has its H2O very gradually swapped out for XYZ, the superficially identical stuff with a different microstructure. Nobody notices because all the observable properties match, and assume nobody in the community in question has ever done chemistry or deferred to anyone who has. Nobody gets transported anywhere; it's one continuous linguistic community, talking to each other the whole time. By the end the H2O is essentially gone — though there's some left in sealed bottles in a museum, a bit in a Mars colony, and a few drops in a lab somewhere.

  The things I want untangled:

  - Does "water" keep referring to H2O the whole way through, flip to XYZ at some point, or go indeterminate / partly refer to both? If it flips, is there any fact of the matter about *when*?
  - Which bits of the setup actually do work for you: the museum bottles, the Mars colony, the fact that some H2O still exists somewhere, the kids born in year forty who learn the word from their parents and never encounter H2O at all? I especially want to know whether a generation can end up meaning something different from the people who taught them the word without anyone noticing.
  - Where does the disagreement between me and my friend actually live? She says something like "obviously by the end it means XYZ, meaning ain't in the head"; I want to say the word was anchored to H2O and nothing ever re-anchored it, so it still means H2O (or maybe fails to refer cleanly). Is that a real metaphysical disagreement about what reference is, or just a fight about which way of talking is more useful, or is it something else — like a disagreement about what "our word" even picks out across time?
  - And if the case just has no crisp answer, does that count against externalism, or only against expecting reference to be determinate?

  Please actually take a side on the "is there a fact of the matter" question instead of leaving it as depending on your favourite theory of reference — but do flag which part of your answer is carrying the most weight and what would change your mind.
