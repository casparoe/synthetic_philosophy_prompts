prompt: |-
  I'm the operations manager for a supported-living provider — eight group homes, about forty adult residents, most of whom have an intellectual disability and many of whom also carry psychiatric diagnoses (schizoaffective disorder, emotionally unstable personality disorder, alcohol-related brain damage, and increasingly residents who are ageing into early dementia). Our staff are support workers with three weeks of classroom training and a two-day annual refresher; none of them have any academic background in anything. Incidents happen somewhere in the service two or three times a week — a punch during a personal-care prompt, a stolen wallet, sexual touching in a shared lounge, a violent episode during a relapse — and after each one a shift lead writes it up and, with the clinical lead signing off, decides what follows: a mediation, a behaviour support plan, a referral, a move, or nothing. Our current framework is essentially positive behaviour support: every incident is logged on an antecedent-behaviour-consequence chart and handled as behaviour with causes to be identified and managed. It has two failure modes I keep running into. Staff who let a resident see that they were frightened, hurt or angry get written up for unprofessional conduct and told to stay neutral. And residents and families tell me, in different words, the same thing: that they feel written off, handled like weather or like livestock, that nobody expects anything of them any more and so they have stopped trying.

  I have no academic background myself, but I got talking to a friend who studied philosophy, and she mentioned an old essay — I think by P. F. Strawson, possibly called Freedom and Resentment — which, as she described it, says roughly this: that holding someone responsible isn't a theory you believe but a stance you take, a matter of having reactive attitudes like resentment, gratitude and guilt; that the alternative of treating someone as a thing to be managed or handled is available and sometimes right, but is not the neutral, scientific default it presents itself as; and that you don't have to settle whether anyone has free will before you resent being wronged, because the question is set up backwards. She also said something I've been chewing on: that there is a difference between cases where this person couldn't have done otherwise on this occasion — he was pushed, he didn't know, he was out of his mind — and cases where the person isn't the kind of thing you address as a person at all, and that confusing the two is exactly the mistake our incident forms make, since the chart has one box where you write the diagnosis and another where you write the consequence.

  What I want from you is a written procedure my shift leads can actually run. Constraints: it has to fit on one page, be usable in twenty minutes at a debrief by someone who has never heard the theory, and produce a short written record the clinical lead can sign off or overrule. I'd want it as ordered questions — is this a case for addressing the person or for managing the behaviour, which of those stances is being taken toward whom, and if it's the managing stance, whether the withdrawal is total or partial and temporary or open-ended — with a statement, for each question, of what counts as a sufficient answer and what evidence on the file satisfies it, and with explicit stop points: places where the procedure returns a firm no (do not switch to the managing stance here) and places where it stops and hands the decision to a person because the question is one of values rather than fact. It also has to handle five things that I think break any naive version of this. First, the difference between excusing and exempting, including the cases where a resident is fully capable in some domains and not in others, so the honest answer may be hold him responsible about his money but not about his hygiene. Second, the fact that we only ever deal with the negative side: nobody has a procedure for gratitude, appreciation or restored trust, and I suspect our service is worse at that than at blame. Third, the loop — if we have spent three years treating a resident as a thing to be managed, some of his present incapacity is our doing, so the file is itself part of the cause, and a procedure that asks is he an agent now? is asking about a variable it has been busy depressing. I want to know what the procedure does with that. Fourth, how to keep resentment from sliding into punitiveness, humiliation or a row: what the difference is in practice, not in theory. Fifth, the cases where the proper object of the attitude isn't the resident at all, but a co-resident's grievance on someone else's behalf, or the staff member's own.

  Then please run it on three residents from our service. (A) Marcus, mild intellectual disability and alcohol-related brain damage, has hit a support worker during a shower prompt for the third time this month; afterwards he says he shouldn't have, and means it, and it happens again. (B) Nadia has an emotionally unstable personality disorder diagnosis, steals small sums from co-residents, lies about it, and turns staff against one another; my staff say she knows exactly what she is doing, my clinical lead says it is trauma-driven behaviour and wants a plan with no blame in it, and my own instinct is with the clinical lead. (C) Terrence, floridly psychotic, attacked a co-resident with a kettle because he believed the man was poisoning him; he has since been hospitalised, medicated, and came back saying he remembers it like a dream, and the injured man's family want him moved out. I'd be grateful if at least one of the three came out in a way I'll argue with — I'd least like to be told that Nadia is a full participant and that our management-only approach is the wrong stance toward her, so if that's what the procedure says I want to see it argued rather than asserted. Finally, be explicit about what the procedure cannot settle: whether to call the police, whether to end a placement, whether anyone is blameworthy in the deep sense, and anything else where a page of questions would be pretending.
reasoning: |-
  Okay, the user is an operations manager for a supported-living provider. They're dealing with complex situations involving residents with intellectual disabilities and psychiatric diagnoses. The current system uses positive behavior support, but it's causing issues: staff are reprimanded for showing emotions, and residents feel dehumanized. The user wants a practical procedure based on Strawson's ideas about reactive attitudes versus objective attitudes.

  First, I need to recall Strawson's "Freedom and Resentment." The key points are the distinction between reactive attitudes (like resentment, gratitude) and the objective stance (treating someone as an object to be managed). The user mentioned two failure modes: staff being punished for natural reactions and residents feeling written off. They need a one-page procedure with clear questions, stop points, and handling five specific challenges.

  The constraints are tight: one page, usable in 20 minutes by staff without academic background, producing a short record. It must address excusing vs. exempting, the lack of positive procedures, the self-fulfilling prophecy loop, preventing resentment from becoming punitive, and cases where the reactive attitude isn't directed at the resident.

  Breaking down the five challenges:
  1. **Excusing vs. Exempting**: Different capacities in different domains. The procedure needs to handle partial responsibility.
  2. **Only Negative Side**: The current system lacks gratitude or trust-building. The procedure should include positive reactive attitudes.
  3. **The Loop**: Past management might have caused current incapacity. The procedure must acknowledge this and suggest corrective steps.
  4. **Resentment vs. Punitiveness**: Practical distinction needed. Focus on communication and repair rather than punishment.
  5. **Object of Attitude**: Sometimes the reactive attitude isn't toward the resident but others involved.

  The procedure should be a flowchart-like questionnaire. Key questions:
  1. **Identify the stance**: Is the behavior being approached with reactive attitudes or objective management?
  2. **Assess capacity**: Can the resident understand and respond to reasons in this context?
  3. **Check for excuses**: Were there mitigating factors?
  4. **Address the loop**: Has the objective stance been overused, reducing capacity?
  5. **Determine the object**: Who is the reactive attitude directed at?
  6. **Prevent punitiveness**: Ensure responses are constructive.

  For the examples:
  - **Marcus**: Hit during shower. He apologizes but repeats. Question his capacity during triggers. Maybe reactive stance with support for triggers.
  - **Nadia**: Steals and manipulates. Staff see agency, clinical lead sees trauma. Need to balance both—partial responsibility. Address trauma without absolving.
  - **Terrence**: Psychotic episode. Clearly exempt during the incident. Reactive stance towards system for safety failures.

  Stop points where decisions require human judgment: ending placements, calling police, deep blame. The procedure flags these as "handover decisions."

  Positive procedures: Include steps for gratitude and repair, not just blame. For example, after resolving an incident, plan for restoring trust.

  The loop issue: If the file shows long-term objective stance, the procedure suggests a corrective plan to rebuild agency.

  Preventing punitiveness: Focus on communication, apologies, making amends without humiliation.

  For Nadia, the procedure might suggest partial responsibility. Staff can express hurt but also address her trauma. Not full management stance, but not full blame either. This might challenge the user's clinical lead, so it needs clear reasoning.

  Final structure: Ordered questions with evidence requirements, stop points, and outputs for clinical sign-off. Must fit on one page, so concise with checkboxes or short answers.
answer: |-
  Below is a one-page, procedure-style guide for shift leads to determine whether to adopt a **reactive stance** (holding someone responsible through dialogue, expectations, and emotional engagement) or an **objective stance** (managing behavior without addressing agency) during incident debriefs. It incorporates Strawson’s distinction between **excusing** (e.g., "they couldn’t help it *this time* due to circumstances") and **exempting** (e.g., "they lack agency in *this domain* due to enduring incapacity"), while addressing your five challenges. The procedure avoids philosophical jargon, focuses on observable evidence, and includes "stop points" where values-based decisions must be made by the clinical lead or manager.  

  ---

  ### **Incident Response Procedure: Choosing the Stance**  
  *For use during post-incident debriefs (20 mins max). Complete with shift lead, involved staff, and resident (if safe/appropriate). Clinical lead signs off.*  

  #### **Step 1: What happened?**  
  - **Question:** Describe the incident in 1–2 sentences. Include only facts observed directly (e.g., "Marcus hit John’s arm during shower prompt"; "Nadia took £5 from Ahmed’s room").  
  - **Evidence:** Staff/witness statements, incident log. No interpretations here.  
  - **Stop Point:** If the incident involves imminent risk (e.g., weapons, active psychosis), skip to **Step 4** for immediate safety actions.  

  #### **Step 2: Is this about addressing the person (reactive stance) or managing behavior (objective stance)?**  
  - **Question:** Could the resident understand a direct conversation about expectations, impact, and repair? Consider:  
    - **Domain-specific capacity:** Are they capable in similar contexts? (e.g., Marcus manages money but struggles with hygiene triggers).  
    - **Temporary state:** Were they in crisis (e.g., Terrence’s psychosis), intoxicated, or triggered?  
  - **Evidence:**  
    - **"Reactive" if:** Resident has historic understanding of cause/effect (e.g., apologizes, acknowledges harm), or the act aligns with their capabilities in other areas.  
    - **"Objective" if:** Resident lacks comprehension (e.g., severe dementia, acute psychosis), or the domain is a known incapacity (e.g., hygiene triggers for ARBD).  
  - **Stop Point:** If the answer depends on contested values (e.g., "Is Nadia’s trauma an excuse or exemption?"), flag for clinical lead input.  

  #### **Step 3: If reactive stance, can we excuse this incident?**  
  - **Question:** Was there a temporary reason they couldn’t meet expectations *this time*? (e.g., pain, confusion, provocation).  
  - **Evidence:** Recent changes (medication, routine), antecedents (e.g., conflict before incident), resident’s explanation.  
  - **Action:**  
    - **Excused?** Address harm non-punitively: "You hurt John. Let’s discuss how to avoid this." Plan repair (apology, amends).  
    - **Not excused?** Hold responsible: "This violated our rules. How will you fix it?" Set consequences (e.g., loss of privileges).  
  - **Key safeguard (Challenge 4: Resentment vs. punitiveness):**  
    - **Resentment =** Expressing hurt ("I’m upset you hit me") + seeking repair.  
    - **Punitiveness =** Blaming ("You’re violent") + humiliation (e.g., public shaming). **Not allowed.**  
    - **Staff guidance:** "Name the harm, not the person."  

  #### **Step 4: If objective stance, is exemption partial/temporary or total?**  
  - **Question:** Is incapacity limited to certain domains (e.g., hygiene but not social) or time-limited (e.g., post-psychosis recovery)?  
  - **Evidence:** Care plans, clinical assessments, ABC charts showing pattern (e.g., incidents only during care tasks).  
  - **Action:**  
    - **Partial/temporary:** Manage behavior (e.g., new shower protocol) but maintain expectations in other areas (e.g., "Marcus still manages his budget").  
    - **Total (rare):** Full management (e.g., dementia-related aggression). Update care plan.  
  - **Addressing Challenge 3 (the loop):** If history shows long-term objective stance, ask: "Have we undermined their agency?" If yes, add a goal to rebuild capacity (e.g., "Practice shower prompts with choices").  

  #### **Step 5: Who deserves acknowledgment? (Challenge 5)**  
  - **Question:** Who was harmed? If not the resident (e.g., co-resident, staff), reactive attitudes apply *to them*.  
  - **Action:**  
    - **Co-resident harmed?** Facilitate their grievance (e.g., "Ahmed, Nadia took your money. How can we fix this?").  
    - **Staff harmed?** Validate their feelings ("It’s okay to feel upset") without retaliation.  
  - **Positive addendum (Challenge 2):** After incidents, document **one action to restore trust** (e.g., "Marcus and John will co-create a shower schedule").  

  #### **Step 6: Record and Review**  
  - **Document:** Stance chosen (reactive/objective), why (1–2 key evidence points), actions (repair plan/behavior support), and unresolved values questions.  
  - **Clinical sign-off:** Overrule if evidence misapplied (e.g., ignoring trauma context) or risk misjudged.  

  ---  

  ### **What This Cannot Settle (Handover Decisions)**  
  This procedure **does not** decide:  
  - Whether to involve police (requires legal/risk assessment).  
  - Ending a placement (requires multidisciplinary review).  
  - "Deep" blameworthiness (a moral, not operational, question).  
  - Medication/treatment changes (clinical lead’s role).  

  ---  

  ### **Applied to Your Cases**  
  **(Output format: Stance + Key Evidence + Action)**  

  #### **A. Marcus (Hit during shower)**  
  - **Stance:** Reactive (he apologizes, understands impact).  
  - **Excused?** Partially (ARBD impairs hygiene triggers).  
  - **Evidence:** Post-incident remorse; capacity in other domains (manages money).  
  - **Actions:**  
    - Address harm: "Marcus, you hurt John. How can we make showers easier?"  
    - Repair: Jointly create a visual shower schedule.  
    - **Loop adjustment:** Staff training on ARBD triggers (no shower prompts when tired).  
  - **Why argue?** Staff might want objective stance due to repeat incidents, but his remorse shows capacity. Objective stance here risks deepening incapacity.  

  #### **B. Nadia (Stealing, lying)**  
  - **Stance:** Reactive stance *toward Nadia* for harm, but objective management *of trauma-driven behavior*.  
  - **Excused?** Not in the domain of social rules (she understands property/lying). Trauma *explains* but doesn’t *exempt* (Challenge 1).  
  - **Evidence:** She manipulates staff (shows social comprehension); clinical note on trauma.  
  - **Actions:**  
    - Hold responsible: "Nadia, taking money hurts Ahmed. Return it and apologize."  
    - Address trauma: Add sensory coping strategies to her care plan.  
    - **Positive step:** Weekly "trust circle" with co-residents to rebuild relationships.  
  - **Why argued?** Clinical lead wants pure objective stance, but Nadia’s social capability means withholding reactive attitudes dehumanizes her. Staff resentment is valid if channeled into repair, not blame.  

  #### **C. Terrence (Psychotic attack)**  
  - **Stance:** Objective during incident (exempt due to psychosis); reactive toward co-resident/family.  
  - **Exempt?** Totally during psychosis (no agency); partial now (recovery).  
  - **Evidence:** Hospital notes (psychosis); post-medication clarity ("like a dream").  
  - **Actions:**  
    - Manage behavior: Regular psychosis monitoring; no unsupervised kitchen access.  
    - Acknowledge harm: "Terrence, you hurt Sam during illness. Let’s discuss safety."  
    - Co-resident focus: Clinical lead mediates with Sam’s family (reactive to *their* anger).  
  - **Handover:** Family’s move-out request goes to clinical lead/manager (values decision).  

  ---  
  **Final Notes**: This procedure makes reactive attitudes the *default* where capacity exists (avoiding dehumanization), while using objective stance strategically. It forces staff to justify exemptions with evidence, not diagnoses, and builds in accountability for rebuilding agency. For Nadia, it *will* feel challenging—but it prevents writing her off while still addressing trauma. Print double-sided, laminate, and train with your three cases.
