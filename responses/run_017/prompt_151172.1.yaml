prompt: |-
  Hi — I cover science and ideas for a magazine (mostly long features, but I also do the final copy pass on freelance pieces a few times a week), and I keep having the same argument with our fact-checker. She wants every sentence hedged into mush; I think roughly half our sentences say "shows" where the study really just got one specific prediction to come out right, and another half say "is consistent with" where the result actually did knock out a live alternative. My friend, who's a physicist, says all hedging is cowardice and that we should print "shows" whenever the authors do, which I'm pretty sure is wrong. What I want isn't a lecture on the philosophy of science — it's something I can paste into our house style guide and actually run.

  Here's the shape I have in mind, and tell me if it's the wrong shape: a ladder of evidential verbs we're allowed to use in copy (something like "shows," "strongly supports," "supports," "is consistent with," "does not rule out," "cannot distinguish between"), plus a short ordered set of tests for picking the highest rung a sentence is allowed to sit on. The tests should be the ones that decide whether the evidence is actually doing any discriminating work: what exactly the account predicted ahead of time, versus a story fitted to the data afterward; whether that prediction was the kind that could easily have come out the other way; whether getting the result required background assumptions the data itself can't check (how the instrument behaves, the measurement model, the statistical model, assumptions about the sample) — I gather there's a name in philosophy for that problem but I can never remember it, so don't bother naming it, just build the step; and, the one I care most about, whether some rival account fits the published numbers about as well. On that last one I've started sorting rivals into what I call "live" ones (a competent person in the field would actually defend it) and "zombie" ones (logically compatible with the data, but nobody would seriously hold it) — because I don't want to hedge every sentence just because some skeptical scenario is logically possible, and I also don't want to write "shows" when the field genuinely has two accounts that fit the same data. Tell me if that split is doing the wrong work, or if I need a third bucket: I keep hitting cases where the rivals are distinguishable in principle but only by an experiment nobody will fund, and cases where the thing being "tested" is a whole framework rather than a claim, so any single study can only ever be consistent or inconsistent with it.

  Constraints: it has to run in about ten minutes at copy-desk stage, by someone with no philosophy training who then has to sign off on the sentence, mostly from the paper itself since the freelancer is often unreachable; and I want it honest about which steps are judgment calls wearing a lab coat. Please say explicitly where the procedure just stops with a no (you may not use a stronger verb, full stop) and where it hands the decision to a human because the trade-off is about values — how much we'd rather over-hedge than over-claim, and so on. Then run it on three cases: (1) a preprint, 120 people recruited online, scores on a psychological scale correlated with how often they shared a false headline, written up by the authors as confirming a motivated-reasoning account over a "people just can't tell what's true" account; (2) a large randomized trial that found no difference between two diets on some biomarker, with a press release saying the trial "refutes" the theory the diets were based on; and (3) a piece I wrote myself last spring (details invented, the structure is what matters) in which I said that a new set of genetic results "confirmed" the leading account of how a population recolonized a region after a bottleneck, and a colleague later pointed out that a second account fits the same data about as well. I'd especially like to know whether the procedure tells me to downgrade that last one, because if it does I have to go tell my editor and eat a correction, and I'd rather not. Last thing: say plainly what the procedure can't do — I don't want anyone on staff walking away thinking that a sentence passing these tests means the study was any good.
reasoning: |-
  Okay, let's tackle this science editor's problem. They're constantly fighting with their fact-checker about hedging language in scientific reporting. The editor wants clear guidelines that can be implemented quickly during copy-editing, without philosophical debates. 

  First, I need to understand their core request: a practical verb ladder with decision rules for choosing appropriate strength of scientific claims. The key tests they mentioned are crucial - especially distinguishing between pre-registered predictions vs post-hoc explanations, assessing how easily results could have differed, evaluating background assumptions, and analyzing rival hypotheses.

  Hmm, their "live vs zombie" rival distinction seems smart - it prevents both over-hedging against unrealistic alternatives and under-hedging when legitimate competing explanations exist. But those edge cases they mentioned (distinguishable-in-principle but untestable rivals, framework-level theories) will need special handling. 

  For implementation, I'm considering a flowchart-style approach with clear stopping points. The "DAGNOSTICS" acronym they proposed could work well if expanded properly. Need to emphasize where judgment calls are unavoidable - like when assessing how "live" a rival theory is. 

  The three test cases are illuminating: 
  1) That psychology preprint seems weak - small online sample, correlational design, probably overclaiming by dismissing the simpler alternative. 
  2) The diet trial might actually support "refutes" if it properly tested the underlying mechanism - but the null result alone isn't necessarily a refutation. 
  3) Their own "confirmed" claim seems problematic since a legitimate competing explanation exists - they're probably hoping the system won't force a correction but it likely should.

  Crucially, the system must be usable in <10 minutes by non-experts, relying primarily on the paper itself. And we must stress that this only evaluates claim strength - not study quality. A perfectly hedged sentence about junk science is still junk science.

  The trade-off between over-claiming and over-hedging needs explicit value judgments. Maybe include a "conservatism dial" where editors can choose to hedge more when in doubt. And absolute prohibitions - like never using "proves" or making causal claims from correlational data.

  For the verb ladder, "shows" should require meeting all four tests conclusively, while "consistent with" becomes the safe fallback. Those background assumptions (the "Duhem-Quine problem" they couldn't name) might be the trickiest part - maybe just ask "could instrument error or model choice flip the result?"

  Most importantly, the system must fail safely - when in doubt, hedge. And constantly remind users this doesn't validate the science, just calibrates the language.
answer: |-
  Here’s a practical, executable **Evidential Strength Protocol** for your style guide. It runs in 5 steps (≤10 min), uses the paper + supplement (no philosophy degree needed), and flags judgment calls. Includes verb ladder, tests, case applications, and explicit limitations.

  ---

  ### **1. The Verb Ladder**  
  *(Strongest → Weakest)*  
  **SHOWS** → **STRONGLY SUPPORTS** → **SUPPORTS** → **CONSISTENT WITH** → **DOES NOT RULE OUT** → **CANNOT DISTINGUISH**  
  *Never use:* "PROVES," "ESTABLISHES," "CONFIRMS" (outside rare consensus contexts).

  ---

  ### **2. The 5-Step Test**  
  **Run these tests in order. Stop at the first "NO" and downgrade to the verb on the right.**  
  *(Use supplemental materials; if critical detail is missing, auto-downgrade 1 step.)*

  | **Test**               | **Question to Ask**                                                                 | **If NO:** Downgrade Verb |
  |------------------------|-------------------------------------------------------------------------------------|---------------------------|
  | **T₁: Prediction Specificity** | Did the study test a *pre-registered* or *a priori* prediction (not post-hoc)?       | → Downgrade 1 step        |
  | **T₂: Stakes**         | Would a *different result* have falsified/excluded the claim? (Or was it "fitted"?) | → Downgrade 1 step        |
  | **T₃: Background Leans** | Are key assumptions (instrument, stats, sampling) *directly validated* in-study?    | → Downgrade 1 step        |
  | **T₄: Rival Status**   | Is there a **LIVE RIVAL** (defended in last 5 yrs) that fits data *equally well*?   | → Downgrade to "consistent with" or weaker |
  | **T₅: Zombie Filter**  | Is the rival a **ZOMBIE** (logically possible but unsupported/undefended)?          | → *Ignore rival*; no downgrade |

  #### **Key Judgment Calls**  
  - **T₄ (Live Rival)**: Requires editorial judgment. Scan paper’s intro/discussion for cited alternatives. If unsure, default to "SUPPORTS" or weaker.  
  - **"Live" Definition**: Competent researchers actively debate it (e.g., in review articles, conferences).  
  - **Third Bucket (Distinguishable but Untestable)**: Treat as **ZOMBIE** (not live). Science can’t address unfalsifiable claims.  
  - **Framework-Level Theories**: Use "CONSISTENT WITH" (single studies rarely "show" frameworks).  

  ---

  ### **3. Case Applications**  
  #### **Case 1: Motivated Reasoning Preprint**  
  - **Authors’ claim**: "Shows" motivated reasoning > "can’t tell truth" account.  
  - **T₁**: Likely NO (correlation, not pre-registered test of mechanisms).  
  - **T₂**: NO (same correlation pattern fits both accounts).  
  - **T₃**: Likely OK (standard scales).  
  - **T₄**: YES ("can’t tell truth" is live rival; fits data equally well).  
  - **Decision**: Downgrade to **"CONSISTENT WITH"** (fails T₁, T₂, T₄).  

  #### **Case 2: Diet Trial "Refutes"**  
  - **Press claim**: "Refutes" theory behind diets.  
  - **T₁**: YES (trial tested specific mechanism).  
  - **T₂**: YES (if biomarker improved, would have supported theory).  
  - **T₃**: YES (well-controlled RCT).  
  - **T₄**: Is there a live rival? Null result ≠ refutation if theory predicts *mechanism* not *outcome*.  
    - *Judgment*: If theory *required* biomarker change, "STRONGLY SUPPORTS lack of effect." **Never "refutes"** (too absolute). Downgrade to **"SUPPORTS rejection of [specific mechanism]."**  

  #### **Case 3: Your Genetic "Confirmation"**  
  - **Your claim**: "Confirmed" leading recolonization account.  
  - **T₁**: Likely YES (genetic predictions were testable).  
  - **T₂**: YES (inconsistent results would challenge it).  
  - **T₃**: Likely OK (standard sequencing/stats).  
  - **T₄**: **YES** (colleague identified live rival fitting data equally well).  
  - **Decision**: Downgrade to **"SUPPORTS"** or **"CONSISTENT WITH"** (fails T₄). *Requires correction.*  

  ---

  ### **4. Critical Constraints & Limitations**  
  #### **What This Protocol DOES**  
  - Calibrates verb strength to **evidential support**.  
  - Flags when claims overreach (e.g., "shows" → "consistent with").  
  - Forces engagement with rivals/assumptions.  

  #### **What This Protocol DOES NOT DO**  
  - **❌ Judge study validity** (e.g., p-hacking, power, bias). A "SHOWS" claim can describe garbage science.  
  - **❌ Resolve debates** (only reflects current rival status).  
  - **❌ Handle complex models** (e.g., climate simulations). Use "CONSISTENT WITH" for these.  
  - **❌ Replace expert fact-checking** (only standardizes hedging).  

  #### **When to Override**  
  - **Consensus contexts**: If 3+ meta-analyses/reviews agree, "STRONGLY SUPPORTS" is OK even with minor limitations.  
  - **Public health emergencies**: Lean conservative (e.g., "SUPPORTS masking" not "shows").  

  ---

  ### **5. Style Guide Snippet**  
  > **Evidential Verbs**: Use this ladder:  
  > `SHOWS` → `STRONGLY SUPPORTS` → `SUPPORTS` → `CONSISTENT WITH` → `DOES NOT RULE OUT` → `CANNOT DISTINGUISH`.  
  > **To choose**: Ask—  
  > 1. Was prediction pre-registered?  
  > 2. Would opposite result hurt the claim?  
  > 3. Are methods/assumptions solid?  
  > 4. Does a LIVE rival fit as well? (If yes, max "SUPPORTS").  
  > **Never use**: "Proves," "confirms," "establishes."  
  > **When in doubt**: Downgrade.  

  ---

  This system prioritizes **speed**, **audit trails** (you document why you chose a verb), and **philosophical honesty** without requiring philosophy. It forces humility when evidence is ambiguous but avoids cowardice when data genuinely discriminates. And yes—it correctly flags your genetic piece for correction.
