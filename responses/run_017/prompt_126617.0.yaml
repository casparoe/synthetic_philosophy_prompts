answer: |-
  Here's an analysis of the Newfoundland cod collapse through the specified lenses, addressing each of your queries rigorously:

  ### 1. Disciplined Mapping of Actors and Institutions
  - **The "Herders"**:  
    Primarily **offshore trawler companies** (industrial fleets with high capitalization) and **provincial/federal governments** (as policy drivers). Inshore skippers were secondary players in biomass reduction. Processors enabled overcapacity but didn't directly deplete the stock. Coastal communities were victims, not decision-makers.  
  - **The Rival Good**:  
    Northern cod biomass (fully rivalrous: one tonne caught by Boat A is unavailable to Boat B).  
  - **Exclusion Structure (Post-1977)**:  
    **State property administered as regulated open access**. Canada legally excluded foreigners but created a domestic access regime with:  
    - Nominal exclusion via licensing  
    - No effective cap on *aggregate effort* (TACs chronically exceeded scientific advice)  
    - Quotas tradable only within vessel classes, not across the system  
  - **Skipper's Option Set in 1985**:  
    - **Exploit**: Maximize catch within quota (if inshore) or race for ITQ share (offshore). Payoff: High immediate revenue, job security.  
    - **Restrain**: Risk being outcompeted; forgone income not recouped later (discount rates >30% made future fish valueless).  
    - **Exit**: No viable alternatives in Newfoundland's economy. Option value of restraint ≈ 0 due to:  
      - Scientific uncertainty about stock collapse thresholds  
      - Lack of individual property rights to future biomass  
      - Political pressure to maintain employment  

  ---

  ### 2. Dynamical Structure vs. Hardin's Model
  - **Critical Divergence**:  
    Hardin's linear pasture model assumes reversible degradation. Cod exhibited **non-linear collapse dynamics**:  
    - Allee effects (spawning failure below critical biomass)  
    - Recruitment overfishing hysteresis (1980s TACs exceeded *replacement yield*, not just sustainable yield)  
    - Unknown thresholds masked by noisy survey data  
  - **Diagnostic Impact**:  
    Not merely accelerated tragedy but **fundamental misapplication of management**. Linear models justified "soft landing" reductions (e.g., 10% annual cuts). Threshold dynamics required immediate moratorium once indicators flashed warning—which science identified by 1989 but politics ignored until 1992. The structure turned rational short-term exploitation into irreversible system failure.  

  ---

  ### 3. What the Framework Misses: Institutional Pathology  
  The tragedy occurred *despite* formal state control because:  
  - **Concentrated Costs vs. Diffuse Benefits**:  
    Restraint meant immediate job losses in Newfoundland (visible, politically costly) vs. future stock recovery (uncertain, nationally diffuse benefits).  
  - **Agency Failure**:  
    DFO (Department of Fisheries and Oceans) had dual mandates:  
    - *Scientific/advisory role*: Underfunded surveys, ignored own scientists' warnings (e.g., 1986 CAFSAC reports)  
    - *Industrial promotion*: Subsidized fleet expansion (e.g., 1983 NAFO modernization)  
  - **Public Goods Underprovision**:  
    - **Accurate Stock Assessment** (non-excludable, non-rival): Underprovided by *federal government* due to budget cuts and political interference.  
    - **Credible Commitment to Restraint**: Underprovided by *electorate/Premier Brian Peckford* (demanded high TACs) and *processors* (lobbied against closures).  
  - **Uncertainty Exploitation**:  
    Scientific ambiguity (e.g., divergent VPA vs. survey estimates) let policymakers treat each year’s TAC as an independent decision ("one more season won't hurt").  

  ---

  ### 4. Testing Your Candidate Reading: "Regulatory Race"  
  - **Distinct from Commons Tragedy**:  
    Yes—this is **not a relabeling** but a different mechanism:  
    | **Classic Commons**           | **Regulatory Race**               |  
    |-------------------------------|-----------------------------------|  
    | Open access, no rules         | State-managed access with rules   |  
    | Individual free-riding        | Collective lobbying to raise TACs |  
    | No central authority          | Authority captured by industry    |  
    | Solution: privatization/state | Solution: agency independence     |  
  - **Prescription for 1985 Decision-Maker**:  
    - Under commons theory: *Privatize quota rights* (e.g., full ITQs) to internalize future costs.  
    - Under regulatory race model: *Insulate science from politics* (e.g., independent TAC setting) and *compensate losers* (e.g., early buyouts).  
    With 1985 information, a rational minister would impose 50% TAC cuts based on CAFSAC warnings and invest in fleet diversification.  

  ---

  ### 5. Framework Evaluation: Does "Tragedy" Earn Its Keep?  
  - **Confirms Framework Weakly**:  
    Affirms core incentive problem: *absence of individual stakes in future stock health*. Harvesters treated biomass as de facto open access due to poor enforcement and political TAC inflation.  
  - **Anomalies for the Framework**:  
    - State ownership failed despite coercive power—exposing the theory’s blind spot to **regulatory capture**.  
    - Non-linear dynamics made *gradual restraint* ineffective, unlike Hardin’s pasture.  
    - "Mutual coercion" (TACs) was corrupted by concentrated interests.  
  - **Where the Framework Is Silent**:  
    - **Political economy feedback loops**: Subsidies (e.g., 1980s unemployment insurance for fishers) artificially sustained excess capacity.  
    - **Scientific epistemic limits**: Framework assumes known carrying capacity; here, uncertainty was weaponized.  
    - **Cultural lock-in**: Coastal identity ("right to fish") isn’t modeled in commons theory.  

  ### Conclusion
  The collapse is **not a pure commons tragedy** but a **state-facilitated resource rush** enabled by:  
  1. Biophysical ignorance (non-linear dynamics treated as linear)  
  2. Institutional incoherence (DFO's conflicting roles)  
  3. Political short-termism  
  The "tragedy" label *conceals more than it reveals* by implying inevitability under open access. Here, collapse required active state mismanagement—making it a **policy failure paradox** where Hardin’s solution (state control) became the mechanism of ruin. The framework’s core contribution is diagnosing the *absence of individual conservation incentives*, but it misses the **pathology of regulated resource states**.
