  Unnoticed weak link: Equating reader's subjective experience with experimental subjects'. Readers know they're engaging fiction, which might affect their sense of authority. But if the illusion feels real, it still holds. Also, the talk's success hinges on relatable examples. Without them, it's too abstract. Recommend adding more literary references and writing exercises.

