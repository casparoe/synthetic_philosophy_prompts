  ### Translation and Analysis Table

  | Claim | RL Translation | Distortion | Residue |
  |-------|----------------|------------|---------|
  | **Core claim**: Utility has no content beyond representing choice behavior; it's solely a parameter for summarizing choices. | Reward functions are just parameters in a policy model (e.g., Boltzmann-rational) that maximize likelihood of observed trajectories. "True reward" is a misnomer—only behavioral equivalence classes matter. | Distorts by implying RL policies *require* reward functions. In RL, policies can be learned directly (e.g., behavioral cloning), bypassing rewards entirely—unlike utility in choice theory. | Revealed preference assumes choices directly reveal ordinal rankings. RL handles *sequential* choices where rewards affect future states, introducing dynamics absent in static choice paradigms. |
  | **Wrinkle 1**: Unobserved/drifting temperature blurs "preference" vs. "noise," challenging identifiability. | Boltzmann-rational policies with unknown temperature make reward and temperature non-identifiable: low reward difference + low temp looks identical to high difference + high temp. Drift compounds this, forcing time-dependent reward models or meta-learning. | Philosophy debates static noise (e.g., Fechner models) but lacks analogs for drift. Your setting *manufactures* a new problem: drift turns a statistical issue into a non-stationary learning challenge. | Philosophical debates treat noise as epistemic (agent's true preference exists but is obscured). Your framework treats it as ontological (no "true" reward exists independently of the noise process). |
  | **Wrinkle 2**: Endogenous menus (selected by upstream systems) limit observed choice data. | IRL with partial state coverage: missing counterfactual menus (states/actions) creates unidentifiability. Reward can't be pinned down where data is absent, akin to unobserved confounders in causal inference. | Revealed preference *presupposes* exogenous menus to define choice domains. Your setting exposes this assumption—when violated, revealed preference collapses unless menus are instrumentally varied. | Philosophy assumes menus are given exogenously to "reveal" preexisting preferences. Your recommender system *constructs* the choice context, making preferences context-dependent artifacts. |
  | **Wrinkle 3**: Invariance classes differ: utility ≈ monotone/affine vs. reward ≈ potential-based shaping (PBS). | PBS is RL-specific: it exploits MDP dynamics (\(R' = R + \gamma \phi(s') - \phi(s)\)) to preserve optimal policies. Unlike affine transforms, PBS depends on state transitions—it's not a reparameterization but a dynamic symmetry. | Affine invariance in utility assumes static comparisons (e.g., lotteries). PBS is a *consequence of sequentiality*—no static choice analog exists. You're comparing different objects: utility ranks outcomes, reward shapes policies. | Affine transforms preserve welfare comparisons; PBS doesn't. Philosophy debates whether cardinal utility reflects "intensity of desire." Your reward lacks even ordinal meaning post-PBS—it's purely a policy-shaping tool. |

