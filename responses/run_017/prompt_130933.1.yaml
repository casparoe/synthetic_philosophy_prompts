    "would_change_my_mind": "Evidence that potential-based shaping has a static choice analog (e.g., if PBS-equivalent rewards could be distinguished by non-dynamic human preferences). Or proof that affine transformations suffice for MDP policy equivalence (they don't—PBS is strictly larger)."
  }
