  In this variant, when she wakes, P(heads) = P(coin will be heads or was heads, but it hasn't been tossed, so it will be)

  P(heads) = 1/2, but from above calculation, P(in heads) = P(coin heads) = 1/2

  But P(it is Monday) = 2/3, P(it is Tuesday) = 1/3

  If it is Monday, P(coin heads) = 1/2

  If it is Tuesday, P(coin heads) = 0

  So unconditional P(heads) = P(heads | Monday) P(Monday) + P(heads | Tuesday) P(Tuesday) = (1/2)(2/3) + (0)(1/3) = (1/3) + 0 = 1/3

  So in this variant, on waking, P(coin will land heads) = 1/3

  But the coin hasn't been tossed yet; it will be tossed tonight.

  So it seems odd to have P=1/3 for a fair coin toss that hasn't happened.

  Dev's point is that Sasha would say 1/3, but if she is told that the toss is still to come, meaning it is Monday, then P=1/2, so the 1/3 was never about the coin alone.

  Sasha responds that conditional on toss not happened, P=1/2, and her 1/3 is unconditional, which includes the possibility that it is Tuesday and toss already happened.

  In this case, when it is Tuesday, toss already happened and was tails, so P(heads) =0.

  So the credence is a mixture.

  I think for move (6), Dev has a point that in this variant, the 1/3 credence for heads seems counterintuitive because the coin hasn't been tossed, but mathematically it works out.

  But Sasha's response in (7) is correct.

  Move (8): Dev says on Sunday, Beauty is certain she will have this waking experience, so no update, so credence should be 1/2.

  In probability terms, let E be the evidence: waking up with amnesia.

  P(E) = 1, since it always happens.

  P(heads and E) = P(heads) = 1/2

  So P(heads | E) = P(heads and E)/P(E) = (1/2)/1 = 1/2

  So no update.

  Thirder says P(heads | E) = 1/3, but P(E) =1, so it must be that P(heads and E) =1/3, but P(heads and E) = P(heads) =1/2, contradiction.

  Thirder response is that E is not just "awake", but the centered evidence, which includes the self-locating uncertainty.

  In halfer view, the evidence E is trivial, so no update.

  In thirder view, the evidence is that she is awake now, and there might be other times, so it rules out some possibilities.

  For example, if heads, there is only one now; if tails, there are two nows.

  But when she wakes, she learns that "this now" is occurring, but since all nows were certain to occur, it's tricky.

  I think this is the crux.

  For halfer, the probability is about the coin state, not about which copy she is.

  For thirder, it's about the indexical fact.

  In my opinion, the thirder view is more consistent with decision theory and updating.

  But let's rate the moves.

  First, list the moves:

  (1) Sasha: one-third based on three indistinguishable nows. Rating: Mistaken, because it assumes equiprobability without justification. The three "nows" have different probabilities.

  (2) Dev: one-half, no new information. Rating: Reasonable, but incomplete because it ignores the self-locating aspect.

  (3) Sasha: Betting argument shows halfer credence leads to losing money. Rating: Clearly right, as it demonstrates a practical inconsistency in halfer position.

  (4) Dev: Betting is about frequency, not probability; accept based on policy. Rating: Partially right, but it shows that halfer needs a special decision rule, while thirder does not. So it concedes the practical point.

  (5) Sasha: Dev concedes practical, and with display, halfer credence depends on self-locating information. Rating: Clearly right, shows that halfer credence is an average over centered possibilities.

  (6) Dev: Coin toss later variant, Sasha would say one-third for untossed coin. Rating: Misleading, because in that variant, P(heads) on waking is indeed 1/3 for the reasons given, but it's not about the coin alone. Sasha's response clarifies.

  (7) Sasha: Conditional on toss not happened, P=1/2; unconditional P=1/3 includes possibility. Rating: Correct, addresses the variant.

  (8) Dev: No update because certain to have the experience. Rating: Mistaken, because the evidence includes the self-locating information, which she was not certain about in the same way. On Sunday, she knew she would be woken, but not which specific centered experience she would have.

  For example, on Sunday, P(she will be in a heads waking) = 1/2, P(she will be in a tails Monday waking) = 1/4, etc.

  When she wakes, she learns that this specific awakening is happening, which has different probabilities.

  So there is update.

  Overall, Sasha has stronger arguments, especially the betting and the display points.

  Dev has points, but they are weaker.

  Both miss that the issue is about self-locating belief and how to handle identical experiences.

  Sasha is more right.

  Rating each move:

  - (1) Sasha: Mistaken. Assumes equiprobability; doesn't justify why the three should be equal.

  - (2) Dev: Reasonable but incomplete. Correct that waking up doesn't provide new information about the coin, but ignores that it does provide information about which instance she is in.

  - (3) Sasha: Clearly right. Shows that halfer credence leads to irrational decisions.

  - (4) Dev: Partially right but problematic. Accepting the bet based on policy avoids the issue but requires divorcing credence from action.

  - (5) Sasha: Clearly right. Demonstrates that halfer credence depends on self-locating information and is not fundamental.

  - (6) Dev: Misleading. In the variant, the credence should be 1/3, and it is about the coin, but conditioned on the current situation.

  - (7) Sasha: Correct. Explains the credence in the variant.

  - (8) Dev: Mistaken. There is update because the evidence includes the centered proposition.

  Overall, Sasha is more right.

  What both miss: They might miss that the problem highlights the need for centered worlds in probability. Also, the connection between credence and decision theory is key.

  In Sleeping Beauty, the thirder position is more widely accepted among philosophers, I think, because of decision theory.

  But the problem remains controversial.

