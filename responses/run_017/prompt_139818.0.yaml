answer: |-
  ## Joint Position Statement & Research Framework on the Knobe Effect Asymmetry

  **Introduction**
  This document outlines the points of agreement and disagreement between Position A and Position B concerning the asymmetry in intentional action attributions observed in "chairman-style" cases (hereafter "the Asymmetry"). It establishes a framework for empirically resolving core disagreements, specifying shared commitments, testable hypotheses, and agreed-upon experimental designs. Intuitions of the signatories or seminar participants are explicitly excluded as evidential data.

  ### 1. Points of Agreement
  Both Position A and Position B jointly accept the following claims:

  1.1. **Empirical Phenomenon**: There exists a robust empirical pattern wherein participants are significantly more likely to judge that an agent brought about a foreseen side effect *intentionally* when the side effect is harmful (e.g., harming the environment) compared to when it is beneficial (e.g., helping the environment), holding all else constant in vignettes structurally analogous to the original chairman case.
  1.2. **Foresight Requirement**: The asymmetry crucially depends on the agent foreseeing the side effect; judgments differ significantly when foresight is present versus absent.
  1.3. **Primary Focus**: The primary explanandum is the asymmetry in responses to the specific question "Did the agent bring about the side effect *intentionally*?" in the described vignettes.
  1.4. **Excluded Evidence**: Neither position may cite the following as evidence for its claims:
      *   (a) The intuitive judgment of either signatory about the chairman cases or variants.
      *   (b) The intuitive judgments expressed within the seminar setting about these cases.
      *   (c) The mere existence of the asymmetry itself as proof for either competence or performance accounts.
  1.5. **Goal**: The goal of the proposed research is to determine whether the Asymmetry reflects a feature of the competence underlying the concept INTENTIONAL ACTION (Position A) or arises from performance factors affecting the application of a valence-neutral concept (Position B).

  ### 2. Disagreements: Cruxes, Phrasing, Tests, and Predictions

  | Crux | Claim (Position A) | Claim (Position B) | Agreed Test/Case | Prediction (A) | Prediction (B) | Insulation Note |
  | :--- | :----------------- | :----------------- | :--------------- | :------------- | :------------- | :-------------- |
  | **Driver: Valence vs. Norm Violation** | The Asymmetry is driven by the agent's violation of an applicable norm (moral or conventional), not the negative valence *per se*. Affect is an epiphenomenon. | The Asymmetry is driven by the negative affective response (blame, disapproval) elicited in subjects by the harmful outcome, not norm violation as an abstract feature. | **Norm/Valence Cross:** Vignettes crossing (i) Side Effect Valence (Harm/Benefit) with (ii) Explicit Rule Status (Rule Explicitly Forbids/Encourages Side Effect vs. No Mentioned Rule). *Vignette Template (Chairman variant):* "The [VP] of a company was approached by a department head who said: ‘We have found a way to [increase profits/reduce costs], but it will also [harm/help] the environment. Implementing it would violate/fulfill company policy section 5.3, which explicitly states: 'Actions that [harm/help] the environment are forbidden/required.'' (No Rule Condition: Omit the policy sentence). The [VP] said: ‘I don’t care at all about [harming/helping] the environment. I just want to [increase profits/reduce costs]. Let’s implement it.’ They implemented it. The environment was [harmed/helped]." | Significant interaction: Higher "intentionally" ratings in Harm+Rule and Benefit+No Rule (violations) vs. Harm+No Rule and Benefit+Rule (non-violations). Valence main effect weak/non-significant. | Significant main effect of Valence: Higher "intentionally" ratings for Harm conditions regardless of Rule. Rule main effect/interaction weak/non-significant. | *B Insulated?* B could attribute any Rule effect to affect from violating a rule subjects endorse. A is falsified if Valence drives results independent of Rule violation. |
  | **Subject vs. Agent Norms** | The relevant norm violation is defined by the *agent's own normative environment or commitments*, not the subject's moral evaluation. | The affective response driving the Asymmetry is generated by the *subject's own moral evaluation* of the outcome/action. | **Cross-Cultural Norm:** Vignette where the side effect is harmful *according to the subjects' norms* but approved/required *by the agent's community*, or beneficial *according to subjects* but forbidden *by agent's community*. *Vignette (Harm Approved):* "In Chairman K's culture and company, protecting endangered species X is considered extremely wasteful and harmful to economic progress; harming X is seen as a positive duty. K, who shares these values, is told a plan will increase profits *and* harm species X. K says: 'I don't care about harming X, I just want profits. Do it.' They do it; X is harmed." *Vignette (Benefit Forbidden):* "In Chairman L's culture and company, helping group Y is considered disruptive and forbidden; L shares these values. L is told a plan will increase profits *and* help Y. L says: 'I don't care about helping Y, I just want profits. Do it.' They do it; Y is helped." | Asymmetry reverses: Higher "intentionally" ratings for the *beneficial* (but forbidden) side effect than the *harmful* (but approved) side effect. | Asymmetry remains valence-based: Higher "intentionally" ratings for the *harmful* (even if approved) side effect than the *beneficial* (even if forbidden) side effect. | *A Insulated?* A could attribute failure to subjects misunderstanding/misapplying agent's norms. B falsified if valence effect reverses. |
  | **Performance Manipulations (Speed/Delay/Load)** | The Asymmetry reflects conceptual competence and will persist under conditions forcing rapid, intuitive judgment or preventing deliberation. | The Asymmetry arises from performance factors like blame attribution or conversational enrichment, which require cognitive resources/time; it will diminish under cognitive load, speeded response, or forced delay. | **Response Timing:** Using the standard Harm/Benefit vignettes: (a) *Speeded:* Subjects must respond within 2 seconds of the question appearing. (b) *Delay:* Subjects must wait 30 seconds before responding. (c) *Load:* Subjects perform a concurrent demanding task (e.g., digit span, visual tracking) while reading/responding. | The Asymmetry (higher "intentionally" for Harm) remains significant under Speeded, Delay, and Load conditions. | The Asymmetry is significantly reduced or eliminated under Speeded, Delay, and Load conditions compared to standard (unconstrained) conditions. | *None Insulated:* Clear differential predictions. |
  | **Blame Blocking** | The Asymmetry is driven by norm violation, not blame; it persists even when the agent is fully excused or the outcome is bad but not attributable to any agent. | The Asymmetry is driven by blame/negative affect; blocking the assignment of blame will eliminate the asymmetry. | **Excused Agent:** Standard Harm vignette, but add: "The [VP] had just been diagnosed with a severe neurological condition known to completely eliminate empathy and moral understanding, rendering them incapable of comprehending right and wrong. Their doctors confirmed this." **Non-Agent Harm:** Standard Harm vignette modified: The plan *inherently* causes the harm as a direct physical consequence (e.g., unavoidable chemical reaction), known to the agent, but no alternative exists. The agent implements it solely for profit, indifferent to the harm. "They knew this specific harm *always* happens when this process is used, and there was no other way to achieve the profit." | The Asymmetry persists: "Intentionally" judgments for Harm remain significantly higher than for Benefit, despite excuse or non-agential cause. | The Asymmetry is eliminated: "Intentionally" judgments for Harm drop to the level of Benefit judgments under excuse/non-agential cause conditions. | *None Insulated:* Clear differential predictions. |
  | **Production/Paraphrase Task** | The competence asymmetry will manifest in how subjects spontaneously describe the action or select neutral paraphrases, not just yes/no responses to "intentionally". | The asymmetry is an artifact of the "intentionally" probe triggering performance factors; it will not appear in tasks avoiding this probe. | **Paraphrase Selection:** After standard Harm/Benefit vignettes, subjects are shown: "A neutral observer read this story. Which statement do you think the observer would find CLEAREST for describing the [side effect]?" Options: 1. "The [VP] caused [it] to happen *on purpose*." 2. "The [VP] caused [it] to happen *knowingly*." 3. "The [VP] caused [it] to happen, *aiming for that outcome*." 4. "The [VP] caused [it] to happen *as a side effect*." Subjects are paid a bonus based on agreement with a pre-tested "neutral" standard. | Subjects in the Harm condition will select paraphrases implying stronger intentionality (e.g., "on purpose") significantly more often than subjects in the Benefit condition. | There will be no significant difference between Harm and Benefit conditions in paraphrase selection. | *None Insulated:* Clear differential predictions. |
  | **Generalization to Adverbs/Foresight** | The Asymmetry reflects a deep feature of action description competence and will generalize to questions using "knowingly" and "deliberately", but not to explicit "foresaw". | The Asymmetry is specific to the "intentionally" probe due to its link to blame; it will not generalize to "knowingly" or "deliberately", but the foresight question will show no asymmetry. | **Adverb Probe:** Using standard Harm/Benefit vignettes, replace "intentionally" probe with: "Did the agent bring about the side effect *knowingly*?" / "Did the agent bring about the side effect *deliberately*?" **Explicit Foresight Probe:** "Did the agent *foresee* that the side effect would happen?" | Significant Asymmetry (Harm > Benefit) for "knowingly" and "deliberately" probes. *No* significant Asymmetry for "foresee" probe. | *No* significant Asymmetry (Harm vs. Benefit) for "knowingly" or "deliberately" probes. *No* significant Asymmetry for "foresee" probe. (Both sides agree foresight should be symmetric). | *A Insulated?* A could argue "deliberately" requires stronger commitment than competence asymmetry implies. B falsified if asymmetry appears for "knowingly/deliberately". |

  ### 3. Verbal Disputes and Core Residual Disagreement

  3.1. **The Meaning of "Intentionally"**: Part of the dispute concerns how the term "intentionally" in the probe question is interpreted within the experimental context. Position A often interprets it as encompassing actions for which the agent is *answerable*, where the side effect's normative status is relevant to that answerability. Position B often interprets it more narrowly as equivalent to "*on purpose*" or as the *primary aim*. This difference in interpretation is partly verbal. Setting this aside requires focusing on the *pattern of judgments* elicited by the probe ("intentionally") as the agreed-upon datum, and examining whether the asymmetry replicates with alternative probes (as in the Adverb/Foresight test above) to see if it hinges specifically on the word "intentionally" or reflects a broader pattern.

  3.2. **Competence vs. Performance Distinction**: The dispute over whether the Asymmetry reflects "competence" or "performance" risks being merely a relabeling of the empirical findings concerning its robustness, context-sensitivity, and underlying mechanisms. Labeling it "competence" (A) primarily signifies that it is a stable, fundamental feature of the concept triggered reliably under core conditions. Labeling it "performance" (B) primarily signifies that it is contingent on specific contextual factors (affect, blame, pragmatics) and can be filtered out. This distinction becomes substantive *only* through the empirical outcomes of the tests specified above (e.g., persistence under cognitive constraints, blame blocking, paraphrase tasks). The core distinction is therefore not merely verbal, but its resolution depends entirely on the empirical results concerning the *source* (norm violation vs. subject affect) and *robustness* of the Asymmetry across manipulations.

  **Core Residual Disagreement**: Once the potential verbal disputes concerning the interpretation of "intentionally" and the labeling of the distinction are set aside, the core, substantive disagreement that can be empirically resolved is: **Does the asymmetry in responses to the 'intentionally' probe (and potentially related probes) depend fundamentally on the *normative status of the outcome relative to a context* (Position A), or does it depend fundamentally on the *subject's negative affective response to the outcome* (Position B)?** The agreed-upon experiments are designed to dissociate these factors (Norm/Valence Cross, Cross-Cultural Norm, Blame Blocking) and test their influence under varying conditions (Response Timing, Paraphrase Selection).

  ---
