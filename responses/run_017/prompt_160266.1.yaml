answer: |-
  Your defense focuses on Kant's *internal* contradiction tests rather than consequences—a sophisticated reading that avoids common objections. But it faces serious challenges. Here's a systematic breakdown of defeaters, ranked by severity, with a focus on your "wobblers" and core concerns:

  ### Fatal Defeaters (Threaten the Framework Itself)
  1. **The "Wobbler" Problem as a Structural Collapse**:  
     - **Issue**: Maxims like *"I’ll free-ride if most others comply"* generate a dynamic system with **no stable universal state**. When universalized:  
       - If all free-ride, "most comply" is false → no one *can* free-ride.  
       - If no one free-rides, "most comply" is true → everyone *must* free-ride.  
     - **Why it’s fatal**: This isn’t a contradiction *in conception* (the law is conceivable) or *in will* (no "necessary end" is directly undermined). It reveals a **third category: dynamically incoherent maxims** that Kant’s binary framework can’t capture.  
     - **Defender’s cost**: Claiming these aren’t "true maxims" (due to conditional logic) risks *ad hoc* maxim-individuation. If you exclude all conditionals referencing others’ actions, you lose grip on real-world moral reasoning (e.g., voting, pollution).

  2. **Smuggled Consequentialism in the "Will" Test**:  
     - **Issue**: Kant’s *necessary ends* (e.g., happiness, rational agency) **covertly rely on empirical consequences**. Consider "non-beneficence":  
       - Kant argues you cannot will universal non-beneficence because *you might need help*.  
       - This **presupposes contingent facts** about human vulnerability—a consequentialist forecast.  
     - **Evidence**: In the *Groundwork*, Kant explicitly references "many cases" where one requires love/sympathy.  
     - **Why it’s fatal**: If the "will" test depends on predicting outcomes for the agent (even if not aggregate welfare), it collapses into rule-consequentialism. Your "no bad consequences sink a maxim" claim fails here.

  ### Serious but Potentially Manageable Defeaters
  3. **The Individuation Problem**:  
     - **Issue**: Maxims can be gerrymandered to pass/fail the test. E.g., "lying to murderers" vs. "lying when truth causes harm."  
     - **Cost to you**: To avoid unfalsifiability, you must insist maxims reflect the agent’s *true intention*. But this:  
       - Requires unverifiable psychological claims.  
       - Still permits maxims like "lying when I feel scared," which universalizes without contradiction.  
     - **Silver lining**: Kantians (e.g., Onora O’Neill) argue maxims must be "action-guiding" and non-arbitrary, offering some constraint.

  4. **Conflicting Duties**:  
     - **Issue**: Universal duties can clash. E.g., "Keep promises" vs. "Save lives" (promise to meet a friend vs. aiding an accident victim).  
     - **Kant’s failure**: His framework lacks meta-rules to resolve conflicts. "Perfect" vs. "imperfect" duties don’t clearly rank.  
     - **Cost**: Forces defenders into implausible rigorism (no exceptions) or concedes extra-Kantian criteria (e.g., consequences).

  ### Awkward Defeaters (Weaken but Don’t Destroy)
  5. **Empirical Ignorance**:  
     - **Issue**: Whether a maxim is conceivable/willable depends on factual knowledge. E.g., "Never eat X" (if X is vital for health).  
     - **Reply**: Kantians argue agents must universalize *given their beliefs*. But this permits immoral acts from ignorance.

  6. **Parasitic Practices**:  
     - **Issue**: Some maxims exploit *non*-universalization. E.g., "Be a unique artist" fails if universalized, but intuitively permissible.  
     - **Reply**: Kant might call this a "fantasy" not a true maxim. Cost: Moralizes non-moral projects.

  ---

  ### Your Core Questions Answered:
  - **Does the test smuggle in consequences?**  
    **Yes, in the "will" test.** The "necessary ends" (happiness, self-preservation) require contingent empirical premises. The beneficence case is decisive here.

  - **Are "wobblers" a new failure mode?**  
    **Yes.** They expose a gap in Kant’s logic: maxims that are *neither contradictory nor stable* when universalized. This is distinct from "partial compliance" objections and reveals a flaw in the formal apparatus.

  - **Is the view unfalsifiable?**  
    **It can be, without constraints on maxims.** To avoid this:  
    — Demand maxims be **intelligible to others** (public reason).  
    — Insist they **specify acts + intentions + circumstances** (O’Neill’s approach).  
    But these moves import external criteria.

  - **Prediction where Kant diverges from welfarism**:  
    Kant forbids acts that are **inherently destabilizing** (lying, promise-breaking) even if net-beneficial. He permits (or requires) **non-interference** in others’ suffering if aid conflicts with perfect duties. Welfarists reject both.

  ---

  ### What Should Keep You Up at Night
  - **The beneficence case**: If universal non-beneficence is unwillable *only* because you might need help, Kant is a closet consequentialist.  
  - **Wobblers**: If conditional maxims are central to ethics (they are), and Kant can’t handle them, the test is incomplete.  

  **To salvage your view**: Embrace the "wobbler" as a **third category of irrationality** (dynamically incoherent wills) and purge empirical consequences from "necessary ends." But this risks becoming unrecognizably un-Kantian. The strongest Kantians (e.g., Christine Korsgaard) bite the bullet on consequences or rework the metaphysics.
