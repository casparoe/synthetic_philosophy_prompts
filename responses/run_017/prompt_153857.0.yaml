    = 1 - [0.13348 + 7*0.25*0.17798 + 21*0.0625*0.2373] 
    = 1 - [0.13348 + 0.311465 + 0.3114375] 
    = 1 - 0.7563825 = 0.2436175

    Then E[U_B]=5 * 0.2436175 = 1.218

  So at rho=0.5, for two actions:
  A: -1.67
  B: 1.22
  So B is best.

  The threshold for switching from B to A might be at a high rho.

  For example, at rho=0.8:
  If I choose A: p_A=0.9, P(S=21)=0.9^7=0.478
  E[U_A]= -8 +15*0.478 +5*(1-0.478)= -8+7.17+2.61=1.78

