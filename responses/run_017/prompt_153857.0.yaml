  P(n>=3)=1 - [ binom(7,0)(0.8)^7 + binom(7,1)(0.2)(0.8)^6 + binom(7,2)(0.2)^2 (0.8)^5 ]
  = 1 - [0.2097 + 7*0.2*0.262144 + 21*0.04*0.32768]
  = 1 - [0.2097 + 0.366999 + 0.2752512]
  = 1 - 0.85195 = 0.14805

  E[U_B]=5*0.14805=0.74025

  So A is better at rho=0.8.

  So without the moderate option, there is a single switching point from B to A at some rho between 0.5 and 0.8.

  The moderate option allows for a middle ground where for intermediate rho, a third option is best.

  Defense by the superrationalist: they might say that partial correlation is not part of their theory. Their theory only applies when the reasoners are so similar that they are certain to choose the same. But this case shows that in a natural setting with partial correlation, the moderate option is attractive. And if the superrationalist wants to apply their theory only when there is perfect correlation, then they are forced to ignore more realistic settings of partial correlation. This might cost them applicability.

  In the case with the moderate option, the superrationalist (rho=1) would still choose A, which is the best when there is perfect correlation. But in the real world, if there is partial correlation, then their choice of A is not optimal. So they would be making a mistake in such settings.

