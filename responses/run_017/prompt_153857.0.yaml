  The structural feature: the existence of two thresholds (T1 and T2) and the different costs create a situation where the moderate action is a safe choice when there is partial correlation: it ensures that at least the low success is likely, while going all in is risky because it requires high correlation to achieve the high success.

  Now, if we delete the moderate option, then we have only A and B.

