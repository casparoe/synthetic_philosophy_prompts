  Then for me choosing A: 
     total=3+S, which is always >=8, and >=24 only if S>=21, i.e., all 7 choose A, P=0.5^7=0.0078
     So E[U_A]= -8 + 15*0.0078 +5*(1-0.0078) = -8 +0.117+4.961= -2.922

  For B: 
     if all others choose A: S=21, then total=21>=8 -> R1, but also>=24? 21<24, so only R1.
     P(S>=8): if at least 3 others choose A (since 3*3=9>=8), but mean=10.5, so very likely.
     P(S<8) is small. 
