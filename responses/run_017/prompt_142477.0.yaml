answer: |-
  Here's a breakdown of the claims behind "we only ever know the structure, never the stuff itself," addressing your specific concerns and evaluating their implications for consciousness:

  ### The Menu of Claims (Epistemological, Ontological, Semantic)

  1.  **Weak Epistemological Structuralism (WES):**
      *   **Claim:** All scientific *knowledge* is structural. Our theories describe formal/mathematical relations between entities (positions, momenta, charges, fields, etc.) and their dynamics (equations of motion, symmetries). We never have observational or theoretical access to the intrinsic, non-relational properties of the "stuff" (e.g., what an electron *is* independently of its charge, mass, spin, and interactions).
      *   **Status:** Near-Platitude (for fundamental physics). Deeply defended by proponents like Bertrand Russell ("The Analysis of Matter") and modern structural realists like John Worrall.
      *   **Gets `no extra ingredients`?** **No.** This is purely about *knowledge*. It leaves open the *possibility* that there *is* intrinsic "stuff" (qualia, intrinsic properties) we cannot access scientifically. Consciousness could be part of that inaccessible intrinsic nature of physical entities or configurations. Your roommate's weaker version likely falls here.

  2.  **Strong Epistemological Structuralism (SES):**
      *   **Claim:** Not only *is* our knowledge structural, but it is *necessarily* structural. It is *impossible in principle* to know anything non-structural about fundamental entities.
      *   **Status:** Substantive Thesis. A stronger version of WES, emphasizing the limits of scientific methodology.
      *   **Gets `no extra ingredients`?** **No.** Similar to WES. It only says we *can't know* the intrinsic stuff. It doesn't say it doesn't exist. Consciousness could still be an intrinsic, unknowable property.

  3.  **Ontic Structural Realism (OSR - Moderate):**
      *   **Claim:** Structure is *ontologically fundamental*, but there are *relata* (the "things" in the relations). However, these relata have *no intrinsic identity or properties* independent of the relational structure they inhabit. Objects are defined *solely* by their place in the structure ("nodes in a graph").
      *   **Status:** Substantive Thesis. Defended by Steven French, James Ladyman (early), and others. Aims to solve the "problem of objects" in physics (particle indistinguishability, field ontology).
      *   **Gets `no extra ingredients`?** **Possibly, but not trivially.** If *all* properties, including those necessary for consciousness, are purely structural/relational, then consciousness must arise from structure. The key debate is whether phenomenal properties *can* be fully structural. Critics argue structure seems insufficient for subjective experience ("what it's like").

  4.  **Eliminative Ontic Structural Realism (E-OSR / Radical OSR):**
      *   **Claim:** *Only structure exists fundamentally*. There *are no objects* ("relata") at the fundamental level. Talk of "things" is merely a useful approximation derived from the structure. The structure is not a structure *of* things; it is the primary ontological reality. Relations are ontologically prior to relata, or relata are eliminated entirely.
      *   **Status:** Highly Controversial Substantive Thesis. Defended most prominently by Ladyman & Ross ("Every Thing Must Go"). Pushes OSR to its limit.
      *   **Gets `no extra ingredients`?** **Yes, by fiat, but faces major challenges.** If there literally *are no things* to have intrinsic properties, then consciousness *must* be a structural feature or illusion. This is the strongest version supporting your roommate's conclusion. **However, its coherence is your second key concern.**

  5.  **Semantic Structuralism (SemS):**
      *   **Claim:** The *meaning* of our theoretical terms (like "electron") is exhausted by their place in the formal/mathematical structure of the theory. We cannot meaningfully talk about "what an electron is in itself" beyond its structural role.
      *   **Status:** Substantive Thesis (related to structural realism and Ramsey/Carnap sentences).
      *   **Gets `no extra ingredients`?** **No.** This is about language and meaning, not ontology. It says we *can't meaningfully refer* to non-structural properties with our scientific language. It doesn't say they don't exist; it says we can't talk about them scientifically. It leaves room for non-scientific discourse about intrinsic properties (like consciousness?).

  **Key Distinction: Type of Structure**
  *   **Formal/Mathematical Relations:** Abstract relations defined by the theory's mathematics. (Central to WES, SES, SemS, OSR).
  *   **Causal/Nomic Relations:** Concrete relations like cause-effect, physical interaction, law-bound behavior. (Often implied, especially in OSR discussions about physics).

  ---

  ### Addressing Your Specific Sticking Points

  1.  **The "Vacuous Structure" Worry (Newman's Objection):**
      *   **Yes, this is a major problem, primarily for purely formal/mathematical interpretations of structure (especially WES/SES/SemS).**
      *   **The Argument (Newman's Objection, 1928):** If "structure" just means *any* set of formal relations holding between otherwise undefined objects, then knowing *only* the structure is trivial. For *any* collection of objects and *any* sufficiently complex pattern (like the mathematical structure of a physical theory), you can *always* find *some* set of relations among those objects that instantiates that pattern. Knowing "the structure" in this sense tells you almost nothing about the *actual world*, only that *there exists* a set of objects related in a way that fits the math. It collapses structural knowledge into a mere claim about cardinality (how many objects there are).
      *   **Implications:** This devastates purely formal epistemic structuralism (WES/SES). To avoid vacuity, structuralists must link the "structure" to *causal/nomic* relations in the actual world, or embrace an ontic version (OSR) where the concrete causal structure *is* fundamental reality, not just a formal description. OSR proponents argue physics describes *this concrete causal structure*, not just abstract mathematics applicable to any domain with the right cardinality.

  2.  **Does "Only Structure Exists" Make Sense? (The Relata Problem):**
      *   **This is the core challenge for Eliminative OSR (E-OSR).**
      *   **The Problem:** Relations seem to require relata (things that are related). Can there be a relation without something that is doing the relating? Saying "only structure exists" risks being incoherent – what *is* structured if there are no elements? Is structure itself a kind of non-object entity?
      *   **E-OSR Responses:**
          *   **Primitivism:** Structure is fundamental and unanalyzable. The demand for relata is a mistake based on our object-oriented thinking. Reality *just is* a web of relations; "nodes" are derivative or illusory patterns *within* the relational web. (Analogy: Think of a graph - the fundamental reality is the edges/connections; nodes are just endpoints defined by those edges).
          *   **Physics-Fundamentalism (Ladyman & Ross):** Our *best physics* (especially QM and QFT) describes a world of fields, symmetries, and processes where traditional "objects" (particles) are not fundamental. The fundamental ontology is relational state-spaces, amplitudes, symmetry groups, etc. "Objects" emerge only at higher levels. Consciousness must also emerge from this fundamental structure.
      *   **Critique:** Many philosophers find E-OSR deeply counterintuitive and struggle to make sense of relations without relata. It seems to replace the mystery of intrinsic properties with the mystery of "free-floating" relations. Does it truly eliminate objects, or just redefine them as very thin structural roles?

  ---

  ### Does it Get Him the "No Extra Ingredients" Result?

  *   **Weak Claims (WES, SES, SemS):** **No.** They concern knowledge or language, not fundamental ontology. They leave room for intrinsic properties (including consciousness) beyond the structural description.
  *   **Moderate OSR:** **Not Automatically.** It claims objects have *no intrinsic properties*, so consciousness must be structural/relational *if it exists*. But it requires the **substantive (and hotly contested) claim** that phenomenal properties *can* be purely structural/relational properties. Many argue they cannot (the "hard problem").
  *   **Eliminative OSR (E-OSR):** **Yes, but...** By denying fundamental objects *entirely*, it denies the existence of anything *to have* intrinsic properties. Consciousness must be structural or emergent from structure. **However:** This conclusion relies entirely on accepting E-OSR itself, which is highly controversial and faces the "relata problem" and challenges explaining macro-level objects and consciousness convincingly. It *gets* the conclusion only by building it into the radical starting assumption.

  **Conclusion for Your Argument:** Your roommate's move from the weak "all theories are structural" (likely WES/SemS) to the strong "no room for extra ingredients" (requiring E-OSR or strong OSR plus structural consciousness) **is invalid.** The weak claim is about *representation* (how we describe/know), while the strong conclusion is about *reality* (what exists). The weak claim does not entail the strong ontology. The strong ontological claims (OSR/E-OSR) *do* potentially support his conclusion but are substantial, controversial theses requiring their own defense, facing significant philosophical challenges (Newman's Objection, the Relata Problem, the Hard Problem of Consciousness). He cannot simply slide from the uncontroversial weakness to the strong ontological claim without significant additional argumentation.
