  We are planning a session on the Principal Principle for sixth-formers. The goal is to separate credence (subjective degree of belief) from chance (objective probability) without simply asserting that objective chances exist. The students have recently concluded that probability is just about confidence (subjective), so we need to show that there is an objective component.

  We have about 40 minutes. We must address three misconceptions:
  (1) Chance is just ignorance.
  (2) The principle tells you to disregard everything else you know.
  (3) There can't be a chance for a one-off event.

  We also have two constraints:
  - A poker player will argue that chance is just the betting odds the house would take, and we need to absorb this point naturally.
  - We want to consider including a "chance dial" example in the last 5 minutes that creates a tension: trusting the dial requires not fully trusting it because it was set by past results.

  We are to plan the sequence, including when to defuse each misconception and what example to use.

  Proposed Structure:

  1. Introduction (5 minutes)
     - Briefly recap last week: the group thought probability is just how confident you feel (credence).
     - Introduce the Principal Principle: "If you know the objective chance of an outcome is x, then your credence in that outcome should be x."
     - Explain that today we are going to explore what this means and why it might be important.

  2. Setting up a scenario that separates chance and credence (10 minutes)
     - We need a scenario that clearly has an objective chance that is not reducible to our ignorance and that is not just a long-run frequency (to avoid misconception 3). The weighted raffle drum might be problematic because it might reinforce (1) that chance is just our ignorance of the weighting. Instead, let's consider a different example.

     Proposed alternative: A radioactive atom with a known half-life. We know the objective chance (say 50% in one year) that it will decay in the next year. But we don't know when it will decay. This is a one-off event (because each atom decays only once) and the chance is objective (a property of the atom and the laws of physics).

     However, we must be cautious: the half-life is defined by a long-run frequency. But in this case, we can argue that the chance is a property of the single atom. (We can note that quantum mechanics assigns objective probabilities to single events.)

     Another example: A coin that is biased but we don't know how. Then we can have an expert (or a machine) that tells us the exact chance (say 70% heads). The chance is a physical property (the weight distribution) and the expert/machine has measured it. Then we draw the coin once.

     We want to avoid the raffle drum because the weighting is a hidden variable that we are ignorant about. But note: the chance is still objective even if we know it. The problem is that the students might think that if we knew the weighting and the initial position, we could predict the outcome. So to avoid misconception (1), we need to stress that even if we knew every physical detail, in some cases (like quantum mechanics) we still get objective chances. But at this level, we might not want to get into quantum mechanics.

     Revised plan: Use two examples in sequence.

     Example A (raffle drum): We have a raffle drum with 50 tickets. The technician has weighted it so that one specific ticket (say ticket #7) has a 1-in-50 chance of being drawn? Wait, that might not be true. Weighting might make some tickets more likely. But if we don't know the weighting, then we are ignorant. But if we are told the chance for a particular ticket is 1/50, then we should set our credence to 1/50. This example is good because it's simple and we can control the information.

     However, to avoid misconception (1), we can note: even if we knew the exact weighting, the process of drawing is random (like a lottery machine with bouncing balls) and the chance is still objective. But if the drum is deterministic (like if we could calculate the trajectory) then it isn't. So let's avoid mechanical devices that are in principle deterministic.

     Therefore, let's use:

     Example B: A quantum random number generator (QRNG). We have a device that uses quantum mechanics (e.g., radioactive decay) to produce a bit (0 or 1) with a known chance (say 70% for 1). We can show a picture or describe it. We can say that according to our best physical theory, even if we knew the entire state of the universe, we couldn't predict the outcome. The chance is objective and irreducible.

