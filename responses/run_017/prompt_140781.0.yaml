answer: |-
  ### Session Plan: Explaining the Principal Principle

  **Core Objective:** Distinguish credence (subjective confidence) from chance (objective probability) without presupposing metaphysical claims. Use a sequence that progressively builds understanding, addresses misconceptions, and integrates the poker player's perspective. The biased coin example (below) serves as the primary case study, supplemented by the quantum RNG to defuse key misconceptions.

  **Total Time:** 40 minutes  
  **Participants:** ~12 sixth-formers  

  ---

  #### **Session Structure**  
  *(Times are cumulative; adjust discussion flow as needed)*

  1. **Introduction: Credence vs. Chance (5 min)**  
     - Recap last week: "Probability is how confident you feel" → credence.  
     - Pose the puzzle: *"If probability is* just *confidence, why do we trust weather forecasts or casino odds? Is there something 'out there' guiding them?"*  
     - Introduce the Principal Principle (PP): **"If you know the objective chance of an outcome is x, your credence in that outcome should be x."**  
     - **Key move:** Frame PP as a "rule for rational belief" when chance is known, without defining chance yet.  

  2. **Core Example: Biased Coin (10 min)**  
     - **Setup:** "A coin is tested in a precise machine 10,000 times, landing heads 70% of the time. The machine confirms the bias is stable. We’re flipping it *once* today."  
     - **Reveal known chance:** "The objective chance of heads is 70%."  
     - **Apply PP:** "Your credence in heads should be 70%."  
     - **Why this example works (avoids misconception triggers):**  
       - **Lacks hidden determinism:** Unlike the raffle drum (which risks reinforcing "chance as ignorance"), the coin’s bias is *measured*, not inferred from ignorance. The weighting is explicit.  
       - **One-off friendly:** Focuses on a single flip, preempting misconception (3).  
       - **Builds intuition:** Students grasp frequency-derived chance without needing repetition.  

  3. **Absorbing the Poker Player’s Point (5 min)**  
     - **When to raise:** During Q&A after the biased coin example (naturally emerges here).  
     - **Response:** "Great point! Casinos *do* set odds based on measurable frequencies—like our coin machine. But PP says: **if you *know* the chance (e.g., from reliable data), you *must* set credence to match it.** The casino’s odds *approximate* chance; PP tells you what to do when chance is *known*. If you *know* the chance better than the house, you’d be irrational to ignore it."  
     - **Why it absorbs rather than disputes:** Validates frequencies as evidence for chance, linking "betting odds" to objective calibration.  

  4. **Quantum RNG Example: Defusing Misconception (1) (5 min)**  
     - **Setup:** "A quantum random number generator (QRNG) uses radioactive decay—a fundamentally indeterministic process. Physics says: even with perfect knowledge, you can’t predict a single decay; you only know chances (e.g., 30% for ‘1’)."  
     - **Contrast with coin:** "Unlike the coin, there’s *no hidden state* to be ignorant of. Chance isn’t ignorance—it’s built into nature."  
     - **Defusion of (1):** Explicitly states chance ≠ ignorance here. The raffle drum is retired to avoid confusion; this example severs the link.  

  5. **Clarifying PP’s Scope: Defusing Misconception (2) (5 min)**  
     - **Scenario:** "Back to the biased coin: You know the chance is 70%. But then you learn the flipper is a *magician* who controls outcomes."  
     - **Discussion:** "Should you still set credence to 70%? **No!** PP assumes no *inadmissible information* (like the magician’s intent). PP doesn’t override other knowledge—it applies when chance is your *best* guide."  
     - **Defusion of (2):** PP is conditional; it’s not "ignore everything else."  

  6. **One-off Events: Defusing Misconception (3) (5 min)**  
     - **Pose directly:** "But how can there be chance for a *single* flip or decay? It’s never repeated!"  
     - **Response:** "Chance isn’t *defined* by repetition—repetition just *measures* it. The biased coin’s 70% chance is a fact about its physical setup, whether flipped once or 1,000 times. Same for QRNG: single events have objective chances."  
     - **Defusion of (3):** Uses both examples to show chance as a property of singular events.  

  7. **Chance Dial Demo (Last 5 min)**  
     - **Setup:** Show a "chance dial" on a lab machine (e.g., simulated on screen). "This dial shows a 65% chance of success. It was set using *yesterday’s results* (10,000 trials). Today, we run one trial."  
     - **Tension:** "If we trust the dial, our credence should be 65%. But the dial relies on past data—what if conditions changed? PP says: **if you *know* the chance, set credence to it.** Here, you only *infer* chance from data. So you might not be 100% sure—this is about *evidence* for chance, not chance itself."  
     - **Why include:** Highlights the gap between *knowing* and *inferring* chance, teasing deeper questions (e.g., "How do we *know* chances?"). Ends on a provocative note.  

  8. **Closing Question (1 min)**  
     - **"You know a quantum process has a 20% chance of producing outcome X. Your friend says, 'I feel 50% confident about X—after all, it’s a one-off, and 20% is just a number.' What’s wrong with their reasoning?"**  
     - **Tests understanding:** Confuses credence (subjective) with chance (objective); ignores PP’s directive when chance is known. A student who grasps PP will note: feelings don’t override known chances.  

  ---

  #### **What to Flatly Decline**  
  - **Metaphysics of chance:** No debate about "whether objective chances *really* exist." Stick to how we *use* chance in reasoning.  
  - **Probability axioms/calculus:** Avoid formal math; focus on intuition.  
  - **Inadmissibility details:** Don’t define "inadmissible information" rigorously; use the magician example as a boundary case.  

  #### **Answer Format**  
  \answer{biased coin; 4, 5, 6}  
  - **Carrying example:** Biased coin (stabilized via frequency, one-off compatible).  
  - **Misconception defused at stages:**  
    - (1) Chance as ignorance: Stage 4 (quantum RNG).  
    - (2) PP disregards other knowledge: Stage 5 (magician scenario).  
    - (3) No chance for one-offs: Stage 6 (direct address).
