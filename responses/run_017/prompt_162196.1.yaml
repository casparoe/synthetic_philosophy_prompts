  For the leaves, named positions like Biological Naturalism, Causal Process Theory, etc., each with their awkward commitments. Empty boxes should be explained as incoherent, unattractive, or unexplored. For example, believing in unexpressed consciousness but denying it in recorded states would be inconsistent, so that combination is incoherent.

