answer: |-
  # RFC: Moral Vocabulary Refactor and Composability Fix

  **Status:** Proposed  
  **Author:** Alexis Chen (Senior Engineer, Ethics Module Team)  
  **Reviewers:** Samir Gupta (Team Lead), Jordan Lee (Cross-Functional Partner), Taylor Reed (Infrastructure)  
  **Approved by:** Samir Gupta  
  **Last Updated:** 2023-10-05  

  ---

  ## Summary
  This RFC proposes a refactor of our moral vocabulary implementation to resolve composability issues in embedded contexts (conditionals, negations, etc.). Current architecture treats moral sentences (e.g., "lying is wrong") as side-effecting attitude expressions (`boo()`/`hurrah()`). This breaks when sentences are embedded in logical structures. We introduce an `AttitudeThunk` wrapper to defer evaluation, restoring inference patterns like modus ponens. Post-refactor, we retain thin versions of "true"/"fact" for backward compatibility.

  ---

  ## Motivation
  Our ethics module models moral claims as non-representational attitude expressions (RFC-42: "Moral Expressivism v1.0"). For example:
  ```python
  def lying_is_wrong() -> None:
      boo(lying)  # Side effect: expresses disapproval
  ```

  This fails composition in embedded contexts. Consider:
  ```python
  # P1: If lying is wrong, then getting your brother to lie is wrong
  def premise_one() -> None:
      if lying_is_wrong():  # TypeError: None not bool
          getting_brother_to_lie_is_wrong()

  # P2: Lying is wrong
  lying_is_wrong()

  # Conclusion: Getting your brother to lie is wrong ❓
  ```
  The unit test `test_modus_ponens` fails because:
  1. `lying_is_wrong()` returns `None`, crashing conditionals
  2. The two calls to `lying_is_wrong()` in P1 and P2 express attitudes *at different times*, breaking logical linkage

  This is not a regression (test logs confirm pre-RFC-42 behavior matched). It’s a fundamental composability gap.

  ---

  ## Guide-Level Explanation
  We refactor moral sentences into `AttitudeThunk` objects—deferred attitude expressions that can be composed logically. Instead of immediate `boo()`/`hurrah()`, we return a thunk that *can* express attitudes when called, but also supports embedding.

  ### Before Refactor
  ```python
  def stealing_is_wrong() -> None:
      boo(stealing)  # Immediate side effect
  ```

  ### After Refactor
  ```python
  class AttitudeThunk:
      def __init__(self, attitude_fn):
          self.attitude_fn = attitude_fn  # Function that expresses attitude when invoked
      
      def evaluate(self) -> None:
          self.attitude_fn()  # Actually expresses the attitude

      # Logical operators overloaded for composition
      def __neg__(self):
          return AttitudeThunk(lambda: not self.attitude_fn())  # Negation wrapper

      def __rshift__(self, consequent):
          # Conditional: disapprove of accepting antecedent while rejecting consequent
          return AttitudeThunk(lambda: boo_pair(self, consequent))

  def stealing_is_wrong() -> AttitudeThunk:
      return AttitudeThunk(lambda: boo(stealing))  # Returns thunk, no immediate side effect
  ```

  ### Usage
  ```python
  # Valid modus ponens:
  p1 = stealing_is_wrong() >> getting_brother_to_steal_is_wrong()  # Conditional thunk
  p2 = stealing_is_wrong()
  conclusion = getting_brother_to_steal_is_wrong()

  # Evaluate premises (expresses attitudes)
  p1.evaluate()
  p2.evaluate()

  # Conclusion follows structurally
  conclusion.evaluate()  # Passes test_modus_ponens
  ```
  The thunk encapsulates the attitude until explicit `evaluate()`, allowing safe embedding.

  ---

  ## Reference-Level Explanation
  ### Core Changes
  - **Hoisting**: All moral expressions now return `AttitudeThunk` instead of `None`. Side effects fire only on `evaluate()`.
  - **Combinators**: 
    - `__neg__` handles negation (absence of disapproval ≠ approval; see Drawbacks).
    - `__rshift__` (>>) encodes conditionals as higher-order attitudes (disapproval of mismatched attitudes).
  - **Quantifiers**: Implemented via thunk lists (e.g., `all_thunks([thunk1, thunk2])`).

  ### Validation
  The unit test now passes:
  ```python
  def test_modus_ponens():
      p1 = lying_is_wrong() >> brother_lying_is_wrong()  # Conditional thunk
      p2 = lying_is_wrong()
      
      p1.evaluate()  # Expresses: "don’t disapprove lying while approving brother lying"
      p2.evaluate()  # Expresses: "disapprove lying"
      
      # Conclusion follows structurally without runtime type errors
      brother_lying_is_wrong().evaluate()  # Assertion passes ✅
  ```

  ### Backward Compatibility
  A shim layer converts legacy `-> None` functions to thunks. Thin predicates like `is_true()` are retained:
  ```python
  def is_true(thunk: AttitudeThunk) -> bool:
      return True  # Thin truth: always True if syntactically valid
  ```

  ---

  ## Drawbacks
  1. **Negation Ambiguity**: `-thunk` wraps "absence of disapproval," not active approval. We document this but don’t resolve it (per expressivism spec).  
  2. **Modus Ponens Guarantee**: The `__rshift__` combinator ensures *structural* validity but hasn’t been formally proven to preserve semantic inference. Empirical testing (100+ cases) shows no failures. We’re comfortable shipping.  
  3. **Performance**: Thunk creation adds O(n) overhead. Benchmarks show 2ms latency (ethics module is not hot-path).  

  ---

  ## Alternatives Considered
  ### Alternative 1: Representationalism (Rejected)
  ```python
  def lying_is_wrong() -> bool:
      return MORAL_FACTS["lying"]  # Returns truth-value
  ```
  **Pros**: Solves composability.  
  **Cons**: Violates core expressivism principles (RFC-42). Requires maintaining `MORAL_FACTS`—untestable tech debt.

  ### Alternative 2: Delete Ethics Module (Rejected)
  ```python
  def lying_is_wrong() -> None:
      pass  # No-op
  ```
  **Pros**: Eliminates bugs.  
  **Cons**: Breaks downstream systems (e.g., `should_report_corruption()`).  

  ### Alternative 3: Runtime Context Flag (Rejected)
  ```python
  global IN_EMBEDDED_CONTEXT
  def lying_is_wrong():
      if not IN_EMBEDDED_CONTEXT: boo(lying)
  ```
  **Pros**: Minimal changes.  
  **Cons**: Breaks on nested embeddings (e.g., `if (A and B) or C`).  

  ---

  ## Unresolved Questions
  1. How to handle probabilistic moral statements ("lying is *probably* wrong")?  
  2. Should we add a `validate_attitude_consistency` linter to flag conflicting `boo()`/`hurrah()` pairs?  
  3. Can we optimize thunk composition with memoization?  

  ---

  ## Discussion Thread

  ### Jordan Lee (Cross-Functional Partner) — 2023-10-05T14:30:00Z
  > **Request Changes**  
  > This treats ethics like a programming language, but moral statements aren’t code—they’re claims about the world. You’re hacking around a category error. The real fix is to reintroduce truth conditions (Alternative 1). Until then, I can’t approve.

  *Author Response*: Truth conditions require observable moral facts. Our telemetry shows 0% `MORAL_FACTS` coverage in production. Expressivism aligns with our event-sourced attitude logs.

  ### Taylor Reed (Infrastructure) — 2023-10-05T15:12:00Z
  > **Comment**  
  > Why keep the module? If "wrong" just yells `boo()`, nothing is *actually* wrong. Delete it and save 400 LOC.

  *Author Response*: The module coordinates deployments (e.g., `rollback_if_unethical()`). Deletion would break the `SocialContractService`.

  ### Samir Gupta (Team Lead) — 2023-10-05T16:45:00Z  
  > **Approved**  
  > Ship it. Add the attitude linter (Unresolved #2) in Q1.  

  ### Casey Diaz (Drive-By) — 2023-10-05T17:01:00Z
  > **Comment**  
  > Does this change what anyone does on Monday?

  *Author Response*: No—attitudes are expressed at evaluation time, same as before. Linting may flag inconsistent PR descriptions.  

  ---

  **Next Steps**: Merge to `main`, update docs ("truth" ≈ syntactic validity), deprecate legacy APIs by EOY.
