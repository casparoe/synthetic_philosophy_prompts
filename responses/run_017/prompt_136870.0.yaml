prompt: |-
  You are a professional moral philosopher who has spent a lot of time thinking about the line between what we owe people and what's just extra. Take your time with this one: do a bit of unstructured brainstorming first, then give me your considered answer, and don't be afraid to tell me one of my gut reactions is simply wrong.

  I've been trying to work out from my own gut reactions when something is a duty and when it's optional-but-great (supererogatory, I think the word is). My tentative rule is: an act is supererogatory when it helps others a lot and costs the agent a lot. But my cases won't sit still for it, and I want the actual principle, if there is one.

  Here's where I land on concrete cases:

  - Pulling a toddler out of a shallow fountain when I'm right there and my shoes stay dry: obviously I have to. Not optional at all. But by my rule it helps a lot and costs nearly nothing, so it should be supererogatory. It isn't.
  - Jumping on a grenade to save three strangers: amazing, and I don't blame the people who freeze. Feels like the clearest case of "extra".
  - Donating a kidney to a complete stranger: also extra, and yet somehow I feel it's *more* optional than the grenade thing, even though it's far less dangerous. That pair bugs me.
  - Giving 10% of my income to effective charities: I feel it's optional. My friend says it's a duty and that not doing it makes you a bad person. I want to say she's wrong but I cant quite say why.
  - A nurse on my ward who stays two hours unpaid every shift: I want to praise her, but it makes the rest of the team look bad and management now pretty much expects it. I've started calling this the norm ratchet. Praiseworthy once, and bad if everyone does it — I don't know how to hold both thoughts.
  - A guy who secretly pays off the school lunch debts of a whole class and never tells a soul: I feel he deserves credit even though no one can give it to him, and I feel slightly odd about praising him once I find out, like praise somehow needs an audience.
  - My neighbour, who donated a kidney years ago and could now do it again for someone else: I feel she's off the hook, she's done her bit. I call that credit exhaustion. But I also feel queasy, because the person who needs the kidney today doesn't care what she did before.
  - A mother of two small kids who donates a kidney to a stranger, when there's maybe a 5% chance one of her own kids will need one in twenty years: I don't think this is praiseworthy. I might even think it's a bit wrong. Yet it helps a lot and costs a lot, so my rule calls it supererogatory or even saintly.

  Is there one principle — or two rival candidates — that gets most of these, and where exactly does cost have to enter: as a threshold, as a trade-off against the benefit, or as something about *whose* cost it is and what they already owe? Tell me which of my verdicts your principle can't save, and what it predicts for the case I keep flip-flopping on: quitting my job to care for my mum with early-stage dementia for two years, when a good care home was available and I could have afforded it. I go back and forth between "that was beautiful" and "that was more than anyone could ask, so it was optional" — and I can't tell whether "optional" is praise or an insult.
reasoning: |-
  Okay, the user is a moral philosopher trying to distinguish between duties and supererogatory actions. They've provided several concrete cases where their initial rule—that an act is supererogatory if it helps others a lot and costs the agent a lot—doesn't hold up. For example, saving a toddler from a fountain costs little but is a duty, not optional. Meanwhile, jumping on a grenade is supererogatory despite high cost and high benefit. 

  The user is struggling with inconsistencies in their intuitions across different scenarios. They mention "norm ratchet" where a nurse's unpaid overtime becomes expected, "credit exhaustion" where past sacrifices absolve future duties, and discomfort with praising anonymous generosity. Their deep need seems to be finding a coherent ethical framework that explains these nuances without contradiction.

  Hmm, their cases reveal three core tensions: proximity vs. abstraction (toddler vs charity), sacrifice legitimacy (kidney donation vs grenade jump), and social expectation dynamics (the nurse situation). The kidney cases are particularly thorny—why does donating feel more optional than grenade-jumping despite lower risk? Probably because grenades involve immediate visceral danger while organ donation is calculated sacrifice.

  Their flip-flop on dementia care is telling. They're torn between seeing it as "beautiful" (supererogatory) and "more than anyone could ask" (beyond duty). This suggests they're wrestling with special obligations vs universal duties—a key tension in care ethics. The unspoken question might be: "Do I owe my parents more than strangers?"

  The user also hints at meta-ethical unease. When they say praise "needs an audience" for the lunch debt payer, they're brushing against moral realism vs constructivism. Their frustration with the charity donation debate ("my friend says it's a duty") shows they want principled defenses against moral demandingness.

  For a framework, I'll need to reconcile: 
  1) Why minimal-cost rescues are duties (fountain toddler) 
  2) Why extreme sacrifices are optional (grenade) 
  3) How past actions affect current obligations (credit exhaustion) 
  4) When agent-relative costs matter (mother's kidney risk) 
  5) Social vs solitary virtue (anonymous lunch debt)

  The principle should probably center on "reasonable demand" with contextual modifiers: proximity, role, prior sacrifices, and systemic impact. The nurse case fails "systemic harm" test—her individual sacrifice becomes collectively burdensome. For the dementia care dilemma, the answer likely hinges on familial reciprocity norms and whether care homes constitute adequate substitution.
answer: |-
  Your cases brilliantly expose the cracks in simplistic cost-benefit morality. Let's dissect this systematically. First, my brainstorming on core tensions:

  - **Proximity vs. Abstraction**: Saving a toddler (immediate, visible) feels obligatory; donating to distant strangers feels optional.
  - **Agent-Relative Costs**: A mother's risk to her children isn't just "her" cost—it implicates others' legitimate claims.
  - **The Expectation Spiral**: Praiseworthy acts can morph into burdensome duties via social pressure (your "norm ratchet").
  - **Moral Accounting**: We track past sacrifices ("credit exhaustion"), though morality isn't transactional.
  - **Praise & Visibility**: Why does anonymous giving feel purer, yet praise require an audience? Is virtue its own reward?
  - **Thresholds vs. Sliding Scales**: Is there a "sacrifice ceiling" beyond which nothing can be demanded?

  After wrestling with your cases and ethical frameworks (deontology, consequentialism, virtue ethics), I propose this principle:

  **An act is a duty if:**
  1. **The harm prevented/basic need met is severe and imminent**; AND  
  2. **The agent is uniquely/significantly positioned to help**; AND  
  3. **The cost to the agent is moderate and doesn't undermine their core obligations to themselves or dependents.**

  **Supererogation begins where any condition fails:** extreme cost, non-unique role, or addressing non-immediate harms beyond basic needs.

  ---

  ### Applying the Principle to Your Cases:
  1. **Toddler in Fountain**:  
     - *Severe/imminent harm?* Yes (drowning).  
     - *Uniquely positioned?* Yes (right there).  
     - *Moderate cost?* Yes (dry shoes).  
     → **Duty.** Your rule failed by ignoring imminence and uniqueness.

  2. **Grenade Jump**:  
     - *Severe harm?* Yes.  
     - *Uniquely positioned?* Possibly (proximity).  
     - *Moderate cost?* **No** (certain death).  
     → **Supererogatory.** Cost exceeds any reasonable demand.

  3. **Kidney Donation (Stranger)**:  
     - *Severe harm?* Yes (kidney failure).  
     - *Uniquely positioned?* **No** (many potential donors).  
     - *Moderate cost?** Debatable (surgery risk ≠ grenade, but still high).  
     → **Supererogatory.** Fails uniqueness; cost is significant but below grenade-level.

  4. **Charity Donations (10% income)**:  
     - *Severe harm?* Yes (global poverty).  
     - *Uniquely positioned?* **No** (many can give).  
     - *Moderate cost?* Contextual. For median income? Likely yes → **Duty.** For minimum wage? Possibly not.  
     → *Here’s where I challenge your gut:* If you can give 10% without sacrificing essentials, it’s a duty. Basic needs of others create claims when fulfillment is low-cost *to you*. Your friend has a point.

  5. **Unpaid Nurse Overtime**:  
     - *Severe harm?* Initially yes (patient needs).  
     - *Uniquely positioned?* Initially yes.  
     - *But systemic effect?* Creates harmful expectations ("norm ratchet").  
     → **Initially supererogatory, now morally fraught.** Sacrifices that distort systems aren't virtuous. Praise the *intent*, condemn the *effect*.

  6. **Anonymous Lunch Debt Payoff**:  
     - *Severe harm?* Yes (child hunger/stigma).  
     - *Uniquely positioned?* No.  
     - *Cost?* Moderate (financial only).  
     → **Supererogatory, and praiseworthy.** Anonymity avoids moral grandstanding. Praise isn’t "needed" but is still appropriate when discovered.

  7. **Repeat Kidney Donor**:  
     - *Severe harm?* Yes.  
     - *Uniquely positioned?* No.  
     - *Cost?* High (surgery/recovery).  
     → **Still supererogatory, but...**  
     *Credit exhaustion is real but moral.* Past sacrifices don’t erase current obligations, but they *do* license prioritizing self-care. She’s "off the hook" because she’s already given beyond duty.

  8. **Mother Donating Kidney**:  
     - *Severe harm?* Yes (to recipient).  
     - *Uniquely positioned?* No.  
     - *Cost?* **Not just hers:** 5% risk to children’s future care.  
     → **Not supererogatory; potentially wrong.** She violates core duties to dependents by gambling with their safety net. Cost assessment must include *others’ legitimate claims* on the agent.

  ---

  ### Where the Principle Struggles:
  - **The Grenade vs. Kidney Tension**: Why does grenade feel "more optional" than kidney? My principle captures it (death > surgery risk), but your intuition highlights *voluntariness*: grenade moments are instinctive; kidney donation is calculated. This *might* matter morally—but my framework downplays it.
  - **Charity Thresholds**: Defining "moderate cost" is messy. Is 10% a universal duty? I lean yes for affluent actors, but reasonable people disagree. This is the hardest edge case.

  ---

  ### Your Dementia Care Dilemma:
  Quitting your job for 2 years to care for your mother, despite a good/affordable care home:  
  - **Severe harm?** Not imminent (early-stage dementia; care home available).  
  - **Uniquely positioned?** Yes (emotional bond matters).  
  - **Cost?** Extreme (career disruption, income loss).  
  - **Core obligations?** To yourself (career/autonomy) and potentially dependents (if any).  

  → **Supererogatory, not duty.** The care home meets basic needs; your sacrifice provides *emotional* value beyond necessity. It’s "beautiful" because it exceeds obligation. Calling it "optional" isn’t an insult—it acknowledges the extraordinary love in choosing it freely.  

  *Why you flip-flop*: You sense tension between *special relationships* (we owe more to family) and *autonomy* (you may resent lost years). My principle prioritizes preventing severe harm over providing emotional perfection. A "good enough" substitute (care home) absolves the duty, making your choice virtuously extra.

  ---

  ### In Short:
  Duty arises from **preventable catastrophe + proximity + bearable cost**. Supererogation is everything beyond—worthy of praise, but not blame for omission. Cost isn’t a threshold or trade-off alone; it’s weighed *in context* of the agent’s web of obligations. Your gut mixes these variables intuitively; the principle makes them explicit. When in doubt, ask: *"Could I reasonably demand this of anyone?"* If the answer shames you, it’s likely supererogatory.
