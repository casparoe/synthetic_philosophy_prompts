answer: |-
  Here is a precisely engineered case pair designed to isolate the "sustaining vs. not initiating" feature while controlling for confounds. I'll follow your requested structure and flag design challenges transparently.

  ---

  ### 1. The Case Pair (Clinical Workplace Setting)

  **Hold**:  
  *Dave, a hospital maintenance technician with no medical duties, is alone in a cardiac ward storage closet. He sees that a heavy shelving unit is slowly collapsing onto a ventilator power cord. The ventilator sustains Victor (a sedated patient). If the cord is crushed, Victor dies. Dave deliberately wedges his shoulder under the shelf to brace it—a tiring, continuous effort. After 30 seconds of bracing, Dave intentionally steps away. The shelf crushes the cord, and Victor dies.*

  **Cold**:  
  *Dave, a hospital maintenance technician with no medical duties, is alone in the same cardiac ward storage closet. He arrives to find a heavy shelving unit already collapsing onto a ventilator power cord. The ventilator sustains Victor (a sedated patient). If the cord is crushed, Victor dies. Dave could brace the shelf with his shoulder—a tiring, continuous effort—for 30 seconds to prevent collapse, but he deliberately does not. The shelf crushes the cord, and Victor dies.*

  ---

  ### 2. Design Check: How the Spec Is Secured (and Fudges)
  | Feature                | Implementation & Fudges |
  |------------------------|-------------------------|
  | **Victim**             | Identical: Victor in both cases. |
  | **Death**              | Identical: Crushed cord → ventilator failure. |
  | **Causal route**       | Identical: Cord damage → loss of power → ventilator failure → death. |
  | **Time to act**        | Identical: 30 seconds from decision point to outcome in both. |
  | **Effort required**    | *Secured*: Bracing requires identical strenuous force in both. *Fudge*: In Hold, *ceasing* bracing is low-effort (just stepping away); in Cold, *initiating* bracing is high-effort. Effort *at the critical moment* isn’t symmetric. |
  | **Skill required**     | Identical: Basic physical bracing; no expertise. |
  | **Certainty**          | Identical: 100% chance of death if cord is crushed. |
  | **Motives/Intentions** | Identical: Dave wants Victor dead (e.g., personal grudge) in both. |
  | **Prior relationship to threat** | *Secured*: Dave didn’t create the threat (shelf collapse). In both, he’s a bystander when the threat emerges. *Fudge*: In Hold, he *begins* sustaining before the critical 30s; in Cold, he never sustains. But his relationship *at threat onset* is identical. |
  | **Institutional role** | Identical: Maintenance tech with **no duty to act**—medical staff handle patient safety. |
  | **Alternatives available** | Identical: Dave can walk away, call for help (which he doesn’t do), or act/not act. |

  **Collisions & Fudges**:  
  - **Effort asymmetry** is the key fudge: Ceasing (Hold) is passive/disengaging; initiating (Cold) is active/engaging. Effort *magnitude* is identical, but *type* (negative vs. positive) can’t be fully equalized.  
  - **Bodily movement** inherently differs: Hold involves a positive act (stepping away); Cold is an omission (not bracing). This is unavoidable per your spec but risks confounding with theory (c).  
  - **No fatal collisions**: All other features are jointly satisfiable.  

  ---

  ### 3. Account Verdicts  
  **(a) Causal account**:  
  - *Hold*: Dave **does harm**. His action (stepping away) causes the collapse.  
  - *Cold*: Dave **allows harm**. He fails to prevent the collapse.  
  → **Splits the cases**.  

  **(b) Threat account**:  
  - *Hold*: Dave **introduces a threat**. Victor was safe while braced; stepping away adds a threat.  
  - *Cold*: Dave **fails to remove a threat**. The threat existed independently.  
  → **Splits the cases**.  

  **(c) Bodily-movement account**:  
  - *Hold*: **Doing harm**. Stepping away is a willed bodily movement.  
  - *Cold*: **Allowing harm**. Not bracing is an omission (no movement).  
  → **Splits the cases**.  

  **(d) Normative account**:  
  - *Hold*: **Doing harm**. By ceasing his voluntary sustaining, Dave actively violates a duty *not to create harm* (even if no prior duty to aid).  
  - *Cold*: **Allowing harm**. Dave violates no duty; he had no obligation to aid Victor.  
  → **Splits the cases** *if* we assume negative duties only. If positive duties exist, it *may not split*—but your spec excludes duties.  

  **Summary**: (a), (b), and (c) clearly split Hold (doing) from Cold (allowing). (d) splits them only under a negative-duty framework.  

  ---

  ### 4. The Critical Feature & Its Deletion  
  **Key feature**: Whether the agent was **already sustaining** the victim’s safety at the critical moment.  

  **If deleted**:  
  - If we eliminate "already sustaining" (e.g., Dave never braced in Hold), the pair collapses into a standard Smith/Jones contrast (actively toppling the shelf vs. not bracing it).  
  - **What survives**: Nothing distinctive—the pair becomes a textbook "act vs. omission" case. The *sustaining* element is necessary to isolate the target intuition.  

  ---

  ### 5. The Defender’s Best Move (Against the Normative Account)  
  **Weakest account**: (d) Normative, as it relies on contestable duty assumptions.  

  **Defender’s objection**:  
  > "In Hold, Dave *assumed a duty* when he began bracing (like grabbing a drowning swimmer). Ceasing then violates that duty, making it equivalent to Cold. Both are failures to uphold an acquired obligation—so both are allowings. The distinction vanishes."  

  **Cost of this move**:  
  - **Availability**: Strong—it’s a standard move (e.g., Singer on rescue).  
  - **Cost**: It **collapses doing/allowing into normative terms**, abandoning the physical distinction. This undermines (d)’s claim to track pre-moral facts. If duties can be acquired instantly, *any* doing can be redescribed as allowing (e.g., "pushing a victim onto tracks is 'allowing' gravity to act").  

  ---

  ### Bonus: Your Hobby-Horse and Killing vs. Letting Die  
  **Description-swap test**:  
  - Alter the backstory: Suppose in Hold, Dave was *tricked* into bracing (e.g., told "it’s a drill").  
  - **Result**: Intuitions shift! Many now see stepping away as *allowing* death (he’s "off the hook"). The distinction **fails the test**—it’s **hostage to description** (voluntariness, intent).  

  **Killing vs. Letting Die**:  
  - **Alignment**: In both cases, Dave **kills** Victor (intends death, ensures causal chain).  
  - **Separation point**: None here—your spec fixes intent. If intent varied, Cold *could* be "letting die" (if death is "natural"), but your cases fix identical intent/causation.  

  ---

  ### Conclusion  
  **The pair works** with minor effort asymmetry, isolating *sustaining vs. not initiating* as the operative difference. All major accounts *split* the cases except (d) under positive duties. **The critical insight**: Physical features (causation, threat, movement) track the distinction robustly; normative accounts struggle without gerrymandering duties. Use this to show students that the moral weight of doing vs. allowing likely depends on *confounded factors* (intent, duties) or collapses into causation/threat.  

  Would you like tweaks for specific emphasis (e.g., tightening the effort fudge)?
