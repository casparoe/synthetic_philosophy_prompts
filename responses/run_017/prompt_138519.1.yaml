prompt: |-
  I have no formal training in philosophy or logic; I have been reading about the liar paradox on my own and arguing about it with a friend who is equally untrained and takes the opposite view. I would like you to draft the joint statement we would produce if we ran our disagreement properly, as an adversarial collaboration.

  My side (the dialetheist side) holds that at least some contradictions are true, with liar-type sentences as the paradigm case, and that a consequence relation on which a single contradiction entails everything is the wrong tool. My friend's side (the classical side) holds that no contradiction is true, that the paradoxes are better handled by denying the problematic sentences genuine truth or falsity or by giving up a completely unrestricted truth predicate, and that surrendering classical logic costs more than it buys.

  The deliverable: a numbered section of claims both of us can sign, including the uncontroversial ones about what the paradoxes do and do not show and about what should count as a cost for a logic, followed by a table of the residual disagreements, one row per issue, with the dialetheist formulation and the classical formulation side by side, each worded so that the person holding it would accept it as their own position rather than as a parody.

  Three things I want treated explicitly:

  1. Which part, if any, of our dispute is merely verbal, a dispute about what negation, validity, or truth means, and which part survives once that part is set aside.

  2. My own construct, which I call an inconsistency budget. As I understand it, paraconsistent approaches do not simply tolerate contradictions; they pay for that tolerance by giving up inference patterns I use constantly, reasoning by cases and disjunctive syllogism among them. That makes the real question an exchange rate, how much inferential power to surrender per contradiction tolerated, rather than a yes-or-no about whether contradictions can be true. I also suspect the rate is domain-relative: in mathematics an undetected contradiction looks catastrophic, while in a legal code or a program specification containing exactly one contradiction in a corner nobody ever reasons from, treating the whole system as trivial seems clearly the wrong response. Please say whether both sides can accept the budget framing as a restatement of the dispute, and if the classical side rejects it, exactly what it rejects.

  3. A related point my friend keeps dodging: even granting that a given contradiction is true, it is unclear to me what one is supposed to do with it, whether to assert it, reject it, both, or neither, and I cannot tell whether this is a further crux or the same crux about negation in another guise.

  I have also read that there is a cousin of the liar built from the conditional rather than from negation which causes trouble for paraconsistent approaches even after they have contained explosion; if that is right, make it one of the cruxes and state the problem in terms I can follow without notation.

  For every crux you identify, give one argument, case, or formal result both of us would accept as bearing on it, and record in advance what each of us would predict it shows. Keep the whole thing under a page of dense prose plus the table. Do not adjudicate, do not tell me which side wins, and do not name or cite authors, papers, or books: I want the arguments, not the literature.
