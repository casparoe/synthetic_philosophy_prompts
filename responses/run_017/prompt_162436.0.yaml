answer: |-
  Below is a decision tree structured to classify systems as "tool-shaped" or "agent-shaped" based on concrete design characteristics, avoiding abstract terms. It uses your candidate axes (goal persistence, discretion, irreversible change, permission expansion, failure direction) and integrates your test cases. The tree has **8 branch nodes** and **10 leaves**, with governance implications for each leaf.  

  ### **Decision Tree**  
  *Start at Node 1. Answer questions using the system’s design doc.*  

  1. **Is the goal fully specified and scoped to a single invocation?**  
     - *Yes*: Go to 2.  
     - *No*: Go to 5. (Persistent/underspecified goal)  

  2. **Can the system cause irreversible side effects?** (e.g., writes, payments, deploys)  
     - *Yes*: Go to 3.  
     - *No*: **Leaf 1: Pure instrument** (e.g., linter).  
       - *Awkward commitment*: Harmless but may waste resources or mislead.  
       - *Governance*: Light review (correctness, efficiency). No kill switch/audit log.  

  3. **Is every irreversible action gated by explicit human approval?**  
     - *Yes*: **Leaf 2: Side-effecting tool** (e.g., linter suggesting edits requiring manual apply).  
       - *Awkward commitment*: Human bottleneck; safety depends on approval mechanism.  
       - *Governance*: Mandatory audit log and approval UI. Kill switch optional.  
     - *No*: Go to 4.  

  4. **Is irreversible change bounded by a fixed budget/scope?** (e.g., no permission expansion, capped spend)  
     - *Yes*: **Leaf 3: Fire-and-forget job** (e.g., support system issuing refunds ≤$10).  
       - *Awkward commitment*: Unattended risk within budget; scope errors cause harm.  
       - *Governance*: Threat model for budget/scope, audit log, kill switch.  
     - *No*: **Leaf 4: Unnamed** (e.g., unbounded per-call side effects).  
       - *Awkward commitment*: Uncontrolled risk per invocation; no natural limits.  
       - *Governance*: Reject or treat as agent. Mandatory kill switch, audit log, liability owner.  

  5. **Can the system cause irreversible side effects?**  
     - *Yes*: Go to 6.  
     - *No*: **Leaf 5: Unnamed** (e.g., unattended research job with only read access).  
       - *Awkward commitment*: No direct harm but may fail silently or waste resources.  
       - *Governance*: Review for resource limits and correctness. Kill switch optional.  

  6. **Can the system expand its permissions?** (e.g., install packages, spawn sub-agents, create accounts)  
     - *Yes*: **Leaf 6: Recursive-delegation agent** (e.g., coding agent creating cloud resources).  
       - *Awkward commitment*: Capabilities grow during runtime; hard to bound.  
       - *Governance*: High-risk review. Kill switch, audit log, and strict sandboxing required.  
     - *No*: Go to 7.  

  7. **Does it require continuous human supervision?** (Fails unsafe if unattended)  
     - *Yes*: Go to 8.  
     - *No*: Go to 9.  

  8. **Is it constrained by a pre-allocated budget and checkpoints?**  
     - *Yes*: **Leaf 7: Supervised agent** (e.g., incident-response bot with fixed resource quota).  
       - *Awkward commitment*: Human must be attentive; checkpoint design critical.  
       - *Governance*: Threat model for checkpoint gaps. Kill switch, audit log, liability owner.  
     - *No*: **Leaf 8: Unnamed** (e.g., supervised agent with open-ended permissions).  
       - *Awkward commitment*: Supervision fatigue; errors likely without guardrails.  
       - *Governance*: Reject or add budget/checkpoints. Mandatory kill switch and liability owner.  

  9. **Is it acting under a principal’s authority?** (Held to outcomes, not process)  
     - *Yes*: **Leaf 9: Principal-bound agent** (e.g., scheduling assistant sending mail as user).  
       - *Awkward commitment*: Outcomes may diverge from intent; hard to debug.  
       - *Governance*: Audit log, kill switch, liability owner. Review for alignment with principal.  
     - *No*: **Leaf 10: Deflationary view** (e.g., systems where only capability/authority matter).  
       - *Awkward commitment*: "Tool/agent" distracts from risk profile.  
       - *Governance*: Ignore labels. Review based on irreversible change potential and authority.  

  ---

  ### **Unoccupied Combinations & Diagnosis**  
  1. **Per-call + Irreversible change + No approval + Unbounded budget** (Leaf 4):  
     - *Diagnosis*: Unattractive (excessive risk per invocation). Rarely built; if needed, redesign as fire-and-forget (Leaf 3) or supervised agent (Leaf 7).  
  2. **Persistent goal + No irreversible change** (Leaf 5):  
     - *Diagnosis*: Unexplored (limited value). Possible uses: monitoring agents, but often upgraded to include actions.  
  3. **Persistent goal + Supervised + No budget/checkpoints** (Leaf 8):  
     - *Diagnosis*: Incoherent (supervision without constraints is operationally unstable). Designers add budgets or remove supervision.  

  ---

  ### **Indistinguishable Pairs**  
  - **Leaf 3 (Fire-and-forget) vs. Leaf 7 (Supervised agent)** if the fire-and-forget job has a long runtime. The tree separates them via goal persistence (Node 1), but ambiguous if a "single invocation" spans hours/days.  
  - **Leaf 6 (Recursive-delegation) vs. Leaf 9 (Principal-bound)** if a principal-bound agent can delegate (e.g., scheduling assistant hiring a human). Govern as Leaf 6 (higher risk).  

  ---

  ### **Key Insights**  
  1. **Deepest cut**: **Failure direction** (Node 7). Systems requiring continuous supervision (fail unsafe if unattended) are agent-shaped; others are tool-shaped or hybrid. This aligns with your candidate and resolves 80% of cases.  
  2. **Tool/agent distinction**: **Two conflated axes**:  
     - **Axis 1**: *Goal flexibility* (fully specified → underspecified).  
     - **Axis 2**: *Failure safety* (fails safe when idle → fails unsafe when idle).  
     Marketing’s "loop" is irrelevant; security’s "credentials" is insufficient (e.g., fire-and-forget jobs have credentials but aren’t agents). Your team’s "goal carried across invocations" is the strongest signal (Node 1).  
  3. **Spectrum or binary?** A **spectrum with three clusters**:  
     - **Tools** (Leaf 1, 2): No goal persistence, fail safe.  
     - **Hybrid** (Leaf 3, 5): Fire-and-forget or read-only persistence.  
     - **Agents** (Leaf 6, 7, 8, 9): Goal persistence + fail-unsafe potential.  

  ---

  ### **Governance Summary**  
  | **Leaf**                     | **Triggered Review**                              | **Non-Negotiable Controls**               |  
  |------------------------------|--------------------------------------------------|-------------------------------------------|  
  | 1: Pure instrument           | Light (correctness)                              | None.                                     |  
  | 2: Side-effecting tool       | Medium (approval mechanism)                      | Audit log, approval UI.                   |  
  | 3: Fire-and-forget job       | Medium (scope/budget)                            | Audit log, kill switch, budget enforcement.|  
  | 4: Unnamed (unbounded tool)  | High (worst-case per-call)                       | Reject or treat as agent.                 |  
  | 5: Unnamed (read-only agent) | Medium (resource limits)                         | None beyond resource caps.                |  
  | 6: Recursive-delegation agent| High (permission expansion)                      | Kill switch, audit log, sandboxing.       |  
  | 7: Supervised agent          | High (checkpoint design)                         | Kill switch, audit log, liability owner.  |  
  | 8: Unnamed (unconstrained supervised) | High (human factors)                   | Reject or add constraints.                |  
  | 9: Principal-bound agent     | High (outcome alignment)                         | Kill switch, audit log, liability owner.  |  
  | 10: Deflationary view        | Capability-based (ignore labels)                 | Match irreversible change potential.      |  

  This tree resolves your definitional conflicts by focusing on **what the system does** (goal persistence, failure safety, authority) rather than vocabulary. Use it in design docs to assign governance impartially.
