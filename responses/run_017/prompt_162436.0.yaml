  The candidate axes are:
  1. **Objective specification**: Per-call and fully specified vs. persistent and underspecified.
  2. **Discretion over means**: Whether the system has discretion over how to achieve the goal, even if the goal is fully determined.
  3. **Irreversible change credentials**: Whether the system holds credentials that let it cause irreversible change.
  4. **Permission set expansion**: Whether the permission set is closed for the run or can be expanded (e.g., installing packages, creating accounts, spawning sub-agents, spending beyond pre-allocation).
  5. **Failure direction when unattended**: Does the system fail safe (like a tool) or fail unsafe (like an agent) when human attention stops?
  6. **Reversibility budget**: Magnitude of irreversible side effect per unit of human attention.
  7. **Substitutability**: If you swapped the system for a human contractor with the same brief, credentials, and budget, and the governance didn't change, is it an agent?
  8. **Gratuitous agency**: If the same output is achievable without the loop, credentials, or persistence, was the agency load-bearing?

