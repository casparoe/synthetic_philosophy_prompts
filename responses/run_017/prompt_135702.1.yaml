prompt: |-
  I'm a staff engineer on the platform team at a consumer finance app with roughly four million monthly users. I have no philosophy background, and I'm not looking for one: I need something I can use in code and design review.

  Here is the recurring situation. Several times a month a pull request or design doc crosses my desk containing a change that steers users: a default that's been flipped, a step made easier or harder, an option pre-selected, a notification reshaped, an off-switch moved somewhere quieter, a flow that only some users see because it only "worked" on them in an experiment. Our review template has a single line about this — essentially "is this a dark pattern?" — and it is useless: nobody has ever answered yes, and the discussions that do happen collapse into competing intuitions and whoever is seniorest in the room. Meanwhile these changes ship to millions of people, are cheap to reverse in a later release but not within the sprint, and the people affected never get asked. I can block a change in review; a product manager can escalate past me to a director; legal and accessibility sign off on some of them but not on these questions.

  What I want from you is a decision procedure I can actually run, in twenty to thirty minutes, on a real proposal, with the information a platform engineer has in front of them: the diff, the experiment readout if there is one, the metrics the team is being measured on, and a rough sense of who is affected. I need it as an ordered set of questions with a stopping rule: what counts as a sufficient answer to each question, at which points the procedure returns "no" and the change doesn't ship, where it returns "ship with this modification," and where it has to stop and hand the decision to a person or a different function because the remaining question is one of values, or because it's an empirical question we cannot answer inside a sprint. I want the hand-off points named explicitly, including which of them are my organization's job to staff and which ones we're currently pretending are engineering decisions.

  Some things I've picked up second-hand, which I don't trust my own version of: that steering which leaves every option available is different in kind from removing options; that steering people toward what they themselves already want is different from steering them toward what the designer wants; that some interventions leave people better able to choose next time while others work precisely by bypassing the part of them that chooses; and that how visible the steering is matters. I don't need to know who argued what or in what year. I need the distinctions that change what I should ship, kept only if they survive being turned into a question an engineer can answer in a few minutes without a philosopher in the room — and I'd like you to tell me honestly which of the distinctions above you had to drop or mangle to make them operational, and whether there's a distinction I haven't mentioned that has to be in there.

  There are six situations my team hits repeatedly, and the procedure has to give an answer on each rather than gesture at them:

  The first is the one I distrust most: we very often claim to be serving the user's own goals while the only evidence we have is a movement in a metric we chose, which is usually correlated with revenue. I need a test, runnable with the artifacts we have, for whether we are serving the user's ends or substituting our own — and I need to know what to do when the honest answer is that we can't tell.

  The second is that many of these mechanisms only work if the user doesn't notice them, while our policy requires disclosure in release notes and the help center. This produces steering that is technically disclosed and practically undiscoverable. I want to know whether that disclosure is doing any real work on your account, or whether it's a compliance ritual — and if the latter, what the procedure demands instead.

  The third is the one I think about most and have never seen discussed. We A/B test steering changes and ship them only to the segments where they moved behavior. That means the population that actually experiences the steering is, by construction, the population susceptible to it: we are selecting for persuadability. Is that morally different from shipping the same change to everyone, and if so in which direction? Does it matter that the excluded users — the ones who weren't moved — are arguably the ones whose ends we have best evidence about?

  The fourth is asymmetry of friction. We routinely make the path we approve of smoother and the path we disapprove of rougher: cancelling a subscription, turning off a feature we believe is good for people, reaching a setting that costs us money. Sometimes added friction is a speed bump that protects someone from their own haste; sometimes it's sabotage of a choice we've technically left available. I need a rule that separates these, and I need it to be a rule and not a vibe.

  The fifth is third parties. Some of these changes help the person using the app while pushing a cost onto someone else — a slower shipping option that helps our logistics and raises costs for a driver, a snooze that moves a task onto a support agent, a default that improves one household member's outcome at another's expense. I don't know whether the procedure is allowed to count those people, and if it is, how much weight they get relative to the user.

  The sixth is the easy-looking one: cases where the user has explicitly asked us to steer them — screen-time limits, savings commitments, a self-block list that's deliberately hard to edit. I assume that's a free pass, but I've been wrong about this kind of thing before, and there are edge cases where the request was made under conditions we engineered.

  I also want to flag a structural fact about my role, because I think it should change the procedure rather than just be noted: much of what I ship is a default in a shared component or a design-system primitive used by forty-odd teams I'll never meet. So I'm not deciding one intervention; I'm deciding the path of least resistance for a whole class of future interventions, most of which I won't see, and the teams building them have less latitude to think about this than I do. If that means the procedure needs a different or stricter branch for platform-level defaults than for a single screen, say so and write that branch.

  Then I want it run on three real cases, with the verdict and the reasoning shown, no hedging into a summary of considerations:

  One: round-up savings. Spare change on each purchase is swept into a savings pot, default on at enrollment, off switch two taps inside settings, and the company earns interest on the float. It measurably increases savings balances. The team that proposed it is measured on deposits.

  Two: quiet hours in our shared notification library. Notifications are batched and badge counts suppressed, on by default for every app that adopts the library; users can disable it, but the toggle sits in a submenu. We have no evidence users want this. My own team believes it's good for them and wrote it partly for that reason.

  Three: carbon-aware shipping. The slower, cheaper delivery option is pre-selected at checkout. The experiment showed no effect overall, but a large and significant effect among users checking out on mobile late at night; the proposal is to ship the pre-selection only to that segment. It saves the company money, it genuinely reduces emissions, and it saves those users money too. I personally want to ship it. Give me the honest answer even if it is "no," and even if it is "either everyone or no one."

  Finally, on confidence: for each of the three verdicts, tell me the single argument or consideration that would most plausibly make you change it, and where in the reasoning you think the failure is most likely to be. Label which steps of the procedure rest on contested empirical claims about how people actually behave or about what our users want, as opposed to steps that follow from the conceptual distinctions alone — I want to know which parts of this I'd have to re-litigate if someone sent me a new study. Then name one class of case where you think the procedure as you've written it would give the wrong answer, and say what it is about the procedure that makes it misfire there.
reasoning: |-
  We are designing a decision procedure for evaluating user interface changes that steer user behavior. The procedure must be practical, taking 20-30 minutes, and must produce clear outputs: "no", "ship", "ship with modification", or "hand off to X". It must address the six recurring situations and the structural fact of platform-level defaults.

  The procedure is structured as a series of questions. Each question must be answered with the available artifacts (diff, experiment readout, metrics, affected user segment). We stop when we hit a rule that returns an outcome or when we must hand off.

  Key principles from the user's second-hand knowledge, which we will operationalize:

  1. **Availability of options**: Steering that leaves all options available is less problematic than removing options. We can check if all previous options are still present and accessible (though accessibility includes discoverability and friction, which we address separately).

  2. **Alignment with user goals**: We want to steer toward what the user already wants, not what we want. We need a test for this.

  3. **Agency and reflection**: Some interventions enhance the user's ability to choose in the future (e.g., by educating or creating good habits) while others bypass reflection. We can ask if the intervention is transparent and if it builds user capability.

  4. **Visibility of steering**: If the steering must be hidden to work, that is a red flag.

  We will build the procedure step by step, and then apply it to the three cases.

  ---

  **Decision Procedure: Steering Change Evaluation**

  **Step 0: Preconditions**
  - The change is a user interface change that intentionally or unintentionally steers user behavior (defaults, friction, etc.).
  - We have: the diff, any A/B test results, the team's success metrics, and a rough sense of the affected users.

  **Step 1: Check for Option Removal**
  - **Question**: Does the change remove any option that was previously available to the user? (Note: "removal" includes making an option permanently unavailable, not just harder to access.)
  - **Sufficient answer**: 
    - If **yes**, then: 
      - Hand off to **Product Leadership and Legal** with the question: "Is removing this option justified by a compelling user benefit (e.g., safety, regulatory) that cannot be achieved otherwise?" 
      - Why hand off? Because removing options is a product policy decision, not engineering. Engineering's role is to flag and escalate.
    - If **no**, proceed to Step 2.

  **Step 2: Check for Explicit User Request**
  - **Question**: Is the change being made in response to an explicit, recorded request from the user? (e.g., the user set a preference, turned on a feature, or asked for help with a goal)
  - **Sufficient answer**:
    - If **yes**, then:
      - **Ship** unless there is evidence the request was engineered by us (see Step 5). 
      - But note: if the change is a platform default, proceed to Step 6 (because it affects future uses). 
    - If **no**, proceed to Step 3.

  **Step 3: Test for Alignment with User Goals**
  - **Question**: Do we have evidence that the steered behavior is what the user already wants? 
  - **Evidence we can use**:
    - User statements (e.g., in surveys, support tickets) that directly express the goal the change serves.
    - Prior actions by the user that clearly indicate the goal (e.g., they tried to achieve it but failed because of friction).
    - A/B test results that show the change moves behavior toward a goal the user has set for themselves (e.g., if the user has a savings goal, and the change increases savings).
  - **Sufficient answer**:
    - If **yes** (strong evidence), proceed to Step 4.
    - If **no** (or weak evidence), then:
      - **Hand off to Product Leadership and UX Research** with the question: "Is there a validated user need for this change, independent of our business goals?" 
      - Why hand off? Because without evidence of user goals, we are substituting our own. This is a product strategy question.
    - If **we cannot tell** (due to lack of data), then:
      - The change must be **held** until we can get evidence (e.g., via a user study). 
      - Alternatively, if the change is low risk and reversible, we might run it as an experiment with explicit tracking of user sentiment (e.g., a survey at the end of the flow). But this must be planned. Without that, the answer is **no**.

  **Step 4: Evaluate Asymmetry of Friction**
  - **Question**: Does the change make one path (the one we prefer) easier and another (the one we disprefer) harder? 
  - If **no**, proceed to Step 5.
  - If **yes**, then:
    - **Sub-question**: Is the added friction on the dispreferred path justified as protection against user harm (e.g., irreversible actions, high-cost mistakes) or is it merely to make the dispreferred action less likely?
    - **Test for justification**:
      - We must have evidence that users who take the dispreferred path without the friction often regret it (e.g., through post-cancellation surveys, support tickets).
      - The friction must be proportionate to the potential harm (e.g., a confirmation step for deleting an account is okay; burying a setting in multiple menus is not).
    - **Sufficient answer**:
      - If **justified**, proceed to Step 5.
      - If **not justified**, then:
        - **Ship with modification**: The friction must be reduced to the minimum required for safety (e.g., one tap, not buried). If that is not possible, then **no**.
      - If **we cannot tell**, then **hand off to UX Research** to gather evidence on user regret or harm.

  **Step 5: Check for Hidden Steering**
  - **Question**: Is the steering mechanism designed in a way that requires it to be hidden or non-transparent to the user to be effective? (e.g., if the user knew about it, they would disable it or it wouldn't work)
  - **Sufficient answer**:
    - If **yes**, then **no** — do not ship. Hidden manipulation is a dark pattern.
    - If **no**, proceed to Step 6.
  - **Note**: Disclosure in release notes or a help center article does not count as making the steering visible if it is not in the context of use. The mechanism itself must be transparent (e.g., a tooltip explaining a default).

  **Step 6: Platform Default Consideration**
  - **Question**: Is this change a default setting or a design primitive in a shared component (platform-level)?
  - **Sufficient answer**:
    - If **no**, proceed to Step 7.
    - If **yes**, then we must apply a stricter standard:
      - **Sub-question**: Would we be comfortable if every team used this pattern for any purpose, including ones we haven't vetted? 
      - If **no**, then **ship with modification**: The default must be designed to require explicit opt-in by the adopting team (e.g., they must set a flag to enable the steering) OR it must be accompanied by in-context user education (explaining the default and how to change it). 
      - If **yes**, proceed to Step 7.

  **Step 7: Third-Party Effects**
  - **Question**: Does the change impose costs on a third party (not the user) without their consent? (e.g., drivers, support agents, family members)
  - **Sufficient answer**:
    - If **no**, proceed to Step 8.
    - If **yes**, then:
      - **Sub-question**: Are the third parties identifiable and do we have a duty of care to them? (e.g., they are our employees, contractors, or users in a shared account)
      - If **yes**, then **hand off to Legal and Ethics Committee** (if your company has one) or **Product Leadership** to evaluate the cost and whether it is acceptable. We cannot make this call in engineering.
      - If **no** (e.g., the third party is an unrelated business, like a shipping carrier), then we note the cost but it is not a blocker. Proceed to Step 8.

  **Step 8: Segment-Specific Steering (A/B Tested)**
  - **Question**: Is the change being shipped only to a segment of users (based on A/B test results) because it only worked on that segment?
  - **Sufficient answer**:
    - If **no**, then **ship** (if we passed all prior steps).
    - If **yes**, then:
      - **Sub-question**: Is there evidence that the segment being targeted is particularly vulnerable (e.g., low income, cognitive impairment, stressed) and the steering exploits that vulnerability?
      - **Evidence**: Look at the segment characteristics. If the segment is defined by behavior (e.g., "late-night mobile users") and not by a protected characteristic, then we proceed with caution.
      - We must also check if the steering is reversible and if the user can easily opt out (per Step 4).
      - **Decision**:
        - If the segment is defined by a protected characteristic (e.g., age, disability) and the steering exploits it, then **no**.
        - If the steering is transparent and reversible (passed Step 4 and Step 5) and the segment is not vulnerable in an exploitative way, then **ship**.
        - If we cannot determine vulnerability, then **hand off to UX Research and Legal** to assess potential disparate impact.

  **Final Step: If all steps are passed, ship.**

  ---

  **Summary of Hand-Off Points and Responsibilities**

  1. **Option Removal**: Product Leadership and Legal. (We are not staffed to make product policy calls.)
  2. **Lack of Evidence for User Goals**: Product Leadership and UX Research. (We need evidence we don't have.)
  3. **Unjustified Friction**: UX Research (to study user regret) or Product Leadership (to accept the risk).
  4. **Third-Party Costs**: Legal and Ethics Committee or Product Leadership. (This is a business ethics decision.)
  5. **Segment Vulnerability**: UX Research and Legal. (To assess fairness and exploitation.)

  **Dropped or Mangled Distinctions**

  - **"Steering toward what the user wants vs. what we want"**: We operationalized this by requiring evidence of user goals. But note: in practice, metrics (like increased savings) are often assumed to align with user goals without direct evidence. Our procedure forces a hand-off when that evidence is lacking. This might be more strict than common practice.
  - **"Interventions that build agency"**: We did not include this directly because it is hard to assess quickly. We capture part of it via transparency (Step 5) and friction justification (Step 4). But a truly ideal intervention would teach the user something, but that is not required.
  - **"Visibility matters"**: We addressed it in Step 5 (hidden steering is banned) and Step 6 (platform defaults must be transparent or require team opt-in).

  **Added Distinction**

  - **Platform-Level Defaults**: We added Step 6 because defaults in shared components have a multiplier effect and thus require stricter controls.

  ---

  **Application to Real Cases**

  **Case 1: Round-Up Savings**

  - **Change**: Spare change swept into savings, default on at enrollment. Off switch in settings (two taps). Company earns interest. Increases savings balances. Team measured on deposits.

  - **Procedure**:

    - Step 1: Option removal? No (user can turn it off). Proceed.
    - Step 2: Explicit user request? No (at enrollment, it's a default). Proceed.
    - Step 3: Alignment with user goals? 
      - Evidence: The metric (increased savings) is not direct evidence of user goals. We need evidence that users want to save spare change. 
      - Without surveys or prior requests, we cannot tell. 
      - **Hand off to Product Leadership and UX Research** to validate the user need for round-up savings. Without this, we cannot proceed.
    - *The procedure stops here with a hand-off. We do not ship until we have evidence of user goals.*

  **Case 2: Quiet Hours in Notification Library**

  - **Change**: Default on for every app using the library. Toggle in a submenu. No evidence users want this. Platform team believes it's good for them.

  - **Procedure**:

    - Step 1: Option removal? No. Proceed.
    - Step 2: Explicit user request? No. Proceed.
    - Step 3: Alignment with user goals? 
      - No evidence (team admits they have none). 
      - **Hand off to Product Leadership and UX Research** to validate the need. Without evidence, we cannot proceed.
    - *But note: this is a platform default (Step 6). Even if we passed Step 3, Step 6 would require:*
      - Would we be comfortable if every team used this pattern? The pattern is: default on, toggle buried. This is a high-friction opt-out. 
      - We are not comfortable because any team could use it for any purpose. 
      - **Ship with modification**: The library should require adopting teams to explicitly enable quiet hours (opt-in) OR the default must be accompanied by an in-context explanation (e.g., a one-time pop-up explaining quiet hours and how to turn it off). Also, the toggle must be moved to a more accessible location (one tap away).

    - However, because we failed Step 3, we don't get to Step 6. The change must be held until we have evidence of user goals. If we get that, then we must also fix the friction and transparency.

  **Case 3: Carbon-Aware Shipping**

  - **Change**: Pre-select slower, cheaper delivery for mobile users late at night. Experiment showed effect only in that segment. Saves company money, reduces emissions, saves users money.

  - **Procedure**:

    - Step 1: Option removal? No (user can choose faster shipping). Proceed.
    - Step 2: Explicit user request? No. Proceed.
    - Step 3: Alignment with user goals?
      - Evidence: Users save money, and the experiment showed they accepted the default. But do they want to save money at the cost of slower shipping? We don't have direct evidence (e.g., did they express a preference for eco-friendly options?).
      - However, saving money is a common goal. We might argue that the user's acceptance (in the experiment) is evidence. But caution: they might not have noticed the change. 
      - **We cannot tell without more evidence**. Therefore, we must hold or hand off. But note: we are segmenting (Step 8) and that segment might be vulnerable (tired at night). 
      - Let's proceed to Step 4 to see if we can at least fix the friction, then come back to hand-off.

    - Step 4: Asymmetry of friction?
      - The preferred path (slow shipping) is made easier (default). The dispreferred path (fast shipping) is harder (user must change the selection). 
      - Justification? We claim it's for the environment and saves money. But is there evidence of user regret for fast shipping? Probably not. 
      - This friction is not justified as protection against harm (it's not a high-cost mistake). 
      - **Ship with modification**: Reduce the friction. Ensure the shipping option is clearly displayed and the user can easily select fast shipping (one tap). Do not bury the option.

    - Step 5: Hidden steering? 
      - If the preselection is obvious at checkout (e.g., the shipping option is clearly shown and the default is marked), then it's not hidden. But if it's easy to miss (e.g., collapsed by default), then it is hidden. 
      - We require that the preselection is clearly visible in the checkout flow. If not, fix it.

    - Step 6: Platform default? No (this is a specific feature). Proceed.

    - Step 7: Third-party effects? 
      - The change might save the company money and reduce emissions, but it could affect drivers (slower shipping might mean fewer deliveries per hour, affecting their pay). 
      - Are drivers identifiable third parties with a duty of care? Yes (if they are our employees or contractors). 
      - **Hand off to Legal and Product Leadership** to evaluate the impact on drivers.

    - Step 8: Segment-specific? 
      - Yes (mobile, late night). 
      - Check vulnerability: Late-night users might be tired, which could impair decision-making. We are steering them toward an option that saves money but might not be what they want (e.g., they need the item fast). 
      - Because we are targeting a potentially vulnerable segment, we must be cautious. 
      - **Hand off to UX Research and Legal** to assess if this is exploitative.

    - **Overall**: This change has multiple issues. It fails Step 3 (lack of evidence for user goals), Step 4 (unjustified friction, which we can fix), and requires hand-offs for Steps 7 and 8. We cannot ship it without:
        - Fixing the friction (make the shipping options equally easy to see and select).
        - Getting evidence of user goals (via a survey in the experiment?).
        - Resolving the third-party and segment concerns.

    - Given the complexity, the procedure returns **no** until these are addressed. Alternatively, we might run it as an experiment with explicit user consent (e.g., "Try our eco-friendly shipping option?") and measure satisfaction.

  ---

  **Confidence Assessment for Each Verdict**

  **Case 1: Round-Up Savings**
  - **Verdict**: Hand off to Product/UXR (for user goal evidence), do not ship without it.
  - **Weakest point**: Step 3 (alignment with user goals). The procedure requires evidence we don't have. 
  - **Contested claim**: The claim that increased savings balances prove user goals is contested. It might be inertia or lack of awareness. We require direct evidence (user statements) to avoid substituting our goals.
  - **What could change the verdict**: If we had a pre-enrollment survey showing that users intend to save spare change, that would be evidence. Without it, we block.

  **Case 2: Quiet Hours**
  - **Verdict**: Hand off to Product/UXR (for user goal evidence). Additionally, as a platform default, it would require modification (better discoverability and opt-in).
  - **Weakest point**: Step 3 (no evidence) and Step 6 (platform default strictness).
  - **Contested claim**: The belief that "it's good for users" without evidence is not enough. Also, the friction (submenu) is unjustified without proof of harm (which we don't have).
  - **What could change the verdict**: Evidence that users complain about notification overload and request batching. Then we could ship with a less buried toggle.

  **Case 3: Carbon-Aware Shipping**
  - **Verdict**: No (until hand-offs are resolved and friction fixed) or ship with modifications and further study.
  - **Weakest point**: Step 3 (user goals) and Step 8 (segment vulnerability). Also Step 7 (third-party effects).
  - **Contested claim**: That saving money is always in the user's interest (they might value speed more). Also, that late-night users are not being exploited (they might be more suggestible).
  - **What could change the verdict**: 
    - For Step 3: If we had data showing that late-night mobile users have explicitly chosen eco-friendly options in the past, that would help.
    - For Step 8: If we can show that the segment is not vulnerable (e.g., they are just as capable at night) or that the change is clearly beneficial (and they would thank us), then we might ship.

  **Class of Case Where the Procedure Might Misfire**

  - **Case**: An intervention that is clearly beneficial to the user but the user cannot express their goals (e.g., a safety feature for a vulnerable group that is not aware of the risk). 
  - **Why**: The procedure would get stuck at Step 3 (no evidence of user goals) and Step 4 (friction might be justified but we need evidence of harm). 
  - **Fix**: We might need an exception for safety-critical features, which would require a separate path (e.g., involving a risk assessment by a safety team). We haven't built that in.

  ---

  **Final Note**

  This procedure is designed to catch the most common issues and force evidence-based decisions. It will slow down some changes, but that is intentional. The hand-offs are crucial because engineering should not be making product policy or ethics calls without the right inputs. It will work best if your organization staffs the hand-off points (e.g., UXR is available for quick studies).

  We dropped the philosophical nuance in favor of operational questions. The key is to avoid shipping changes that manipulate without evidence of user benefit.
answer: |-
  Below is a decision procedure designed for your context: a 20-30 minute review of behavioral steering changes, focused on operational questions, clear stopping rules, and explicit hand-offs. It addresses your six recurring situations and incorporates the structural reality of platform-level defaults. The procedure is structured as a linear checklist with binary outcomes. If any step returns "no," the change is blocked until resolved. Hand-offs are specified when the question requires values-based or specialized empirical input beyond engineering's scope.

  ---

  ### **Decision Procedure: Behavioral Steering Review**
  **Inputs Required**: PR/design doc, A/B test results (if applicable), team success metrics, affected user segment description.  
  **Outputs**: `SHIP`, `SHIP WITH MODIFICATION`, `NO`, or `HAND OFF TO [ROLE]`.  
  **Time Budget**: 20-30 minutes (strict).  

  #### **Step 1: Option Availability**  
  **Question**: Does the change preserve *all* existing user options without removal, hiding, or irreversible elimination?  
  - **Sufficient Answer**:  
    - **YES** → Proceed to Step 2.  
    - **NO** → `NO`. Do not ship. *Rationale: Removing options is a dark pattern. Engineering cannot arbitrate this; it requires re-design.*  
  **Stopping Rule**: 5 minutes. Check the diff for deleted UI elements, endpoints, or settings. If options are technically present but buried (e.g., 3+ taps away), proceed but flag for Step 4.  

  #### **Step 2: Alignment with User Goals**  
  **Question**: Is there evidence the steered behavior aligns with what **users explicitly want**, not what the *designer* wants or what moves a business metric?  
  - **Evidence Sources**:  
    - User statements (e.g., support tickets, surveys, interviews).  
    - Prior actions (e.g., users tried but failed to achieve this due to friction).  
    - A/B test results showing improved user-specified outcomes (e.g., "savings goals met," not "deposits increased").  
  - **Sufficient Answer**:  
    - **Strong Evidence** (e.g., >20% of affected users requested it) → Proceed to Step 3.  
    - **Weak/No Evidence** (e.g., only metric movement) → `HAND OFF TO PRODUCT LEADERSHIP + UXR`. *Rationale: Engineering cannot validate user intent. UXR must run a rapid survey or audit historical data.*  
    - **Conflicting Evidence** → `NO`.  
  **Stopping Rule**: 10 minutes. Metrics alone (e.g., revenue, deposits) are insufficient. If UXR is unavailable, outcome is `NO`.  

  #### **Step 3: Transparency & Discoverability**  
  **Question**: Is the steering mechanism **immediately visible** in-context, without requiring external documentation (e.g., release notes)?  
  - **Sufficient Answer**:  
    - **YES** (e.g., tooltip, inline explanation, obvious UI affordance) → Proceed to Step 4.  
    - **NO** (e.g., only documented in help center) → `NO`. *Rationale: Undiscoverable steering is manipulative, regardless of intent. Compliance rituals fail here.*  
  **Stopping Rule**: 3 minutes. Simulate user context: Would a user notice this during normal use? Documentation is irrelevant.  

  #### **Step 4: Friction Justification**  
  **Question**: For asymmetric friction (e.g., easy path A, hard path B), is the friction on the dispreferred path **defensible as user protection**, not business optimization?  
  - **Test**:  
    - Friction is justified **only if** there is evidence of user harm (e.g., data shows users regret taking the path quickly).  
    - Friction is unjustified if it primarily serves business goals (e.g., revenue protection, cost reduction).  
  - **Sufficient Answer**:  
    - **Justified** → Proceed to Step 5.  
    - **Not Justified** → `SHIP WITH MODIFICATION`: Reduce friction to ≤1 tap/step. If impossible, `NO`.  
    - **Uncertain** → `HAND OFF TO LEGAL + UXR`. *Rationale: Requires harm validation (URX) and regulatory compliance (Legal).*  
  **Stopping Rule**: 5 minutes. Use A/B test data on user regret or support tickets.  

  #### **Step 5: Platform Default Stricter Test**  
  **Question**: Is this a **platform-level default** (e.g., shared component, design system primitive)?  
  - **Sufficient Answer**:  
    - **NO** → Proceed to Step 6.  
    - **YES** → Apply stricter rules:  
      - **Sub-Question**: Could this pattern be abused if adopted by other teams? (e.g., hiding toggles, aggressive defaults).  
      - **YES** → `SHIP WITH MODIFICATION`: Add mandatory user-facing guardrails (e.g., in-config education, one-tap opt-out).  
      - **NO** → Proceed to Step 6.  
  **Stopping Rule**: 2 minutes. Platform changes require assuming worst-case usage.  

  #### **Step 6: Third-Party Impact**  
  **Question**: Does the change shift costs to **identifiable third parties** (e.g., drivers, support agents, family members)?  
  - **Sufficient Answer**:  
    - **NO** → Proceed to Step 7.  
    - **YES** → `HAND OFF TO LEGAL + ETHICS REVIEW`. *Rationale: Engineering cannot weigh externalities. Legal assesses liability; Ethics reviews fairness.*  
  **Stopping Rule**: 3 minutes. Third parties must be named (e.g., "DoorDash drivers"). Ignore abstract externalities (e.g., "the environment").  

  #### **Step 7: Segment-Specific Steering**  
  **Question**: Is the change **shipped only to a susceptible segment** (e.g., A/B test "responders")?  
  - **Test**:  
    - If the segment is vulnerable (e.g., low-income, cognitively impaired, stressed) → Higher scrutiny.  
    - If the segment is behavioral (e.g., "late-night users") → Lower scrutiny if transparent and reversible.  
  - **Sufficient Answer**:  
    - **Non-Vulnerable Segment** → `SHIP` (if prior steps passed).  
    - **Vulnerable Segment** → `NO`. *Rationale: Targeting susceptible users is exploitative.*  
    - **Uncertain** → `HAND OFF TO UXR + LEGAL`. *Rationale: Requires segment analysis (URX) and ADA compliance (Legal).*  
  **Stopping Rule**: 5 minutes. Use experiment demographics. If >30% of segment is high-risk (e.g., subprime borrowers), assume vulnerability.  

  #### **Final Output**  
  - If all steps pass → `SHIP`.  
  - If `HAND OFF` occurs and returns approved → `SHIP WITH MODIFICATION` (incorporate feedback).  

  ---

  ### **Mangled/Dropped Distinctions**  
  1. **"Serving user's goals vs. designer's goals"**: Simplified to a binary evidence check (Step 2). Nuance about subconscious wants dropped—it's unactionable.  
  2. **"Agency-building interventions"**: Omitted—too abstract for a 30-min review. Covered indirectly via transparency (Step 3) and friction (Step 4).  
  3. **"Visibility matters"**: Operationalized as in-context discoverability (Step 3), but ignores "how" visibility is achieved (e.g., timing, salience).  
  **Added Distinction**: Platform defaults (Step 5) require stricter scrutiny due to scale risk.  

  ---

  ### **Case Evaluations**  
  **Case 1: Round-Up Savings**  
  - **Step 1**: Options available (off switch exists) → YES.  
  - **Step 2**: Evidence? Increased savings balances ≠ user goals. No user statements → `HAND OFF TO PRODUCT LEADERSHIP + UXR`.  
  - **Verdict**: `NO` until UXR validates user intent.  
  - **Weak Point**: Step 2. Relies on contested claim that metric movement ≠ user intent.  
  - **Confidence**: High. If UXR finds 20%+ users requested round-ups, verdict flips to `SHIP`.  

  **Case 2: Quiet Hours (Platform Default)**  
  - **Step 1**: Options available → YES.  
  - **Step 2**: Evidence? None → `HAND OFF TO PRODUCT LEADERSHIP + UXR`.  
  - **Step 5**: Platform default → Stricter test: Toggle in submenu is abusable → `SHIP WITH MODIFICATION` (move toggle to main settings).  
  - **Verdict**: `NO` until UXR provides evidence + modify toggle placement.  
  - **Weak Point**: Step 2. Team's "belief" is not evidence.  
  - **Confidence**: High. If UXR shows user complaints about notification fatigue, `SHIP` after modification.  

  **Case 3: Carbon-Aware Shipping (Segment-Specific)**  
  - **Step 1**: Options available → YES.  
  - **Step 2**: Evidence? Saves users money, but no explicit user demand → `HAND OFF TO PRODUCT LEADERSHIP + UXR`.  
  - **Step 4**: Friction? Pre-selection adds friction to fast shipping. No evidence of user harm from fast shipping → `SHIP WITH MODIFICATION` (make shipping options equally visible).  
  - **Step 6**: Third parties? Drivers may earn less → `HAND OFF TO LEGAL + ETHICS REVIEW`.  
  - **Step 7**: Segment? Late-night mobile users; potentially fatigued (vulnerable) → `NO`.  
  - **Verdict**: `NO`. Fails Steps 2, 4, 6, and 7.  
  - **Weak Point**: Step 7. Assumes late-night users are vulnerable without proof.  
  - **Confidence**: Medium. If ETHICS REVIEW confirms driver impact is negligible and UXR shows late-night users prefer savings, `SHIP` with equal-friction UI.  

  ---

  ### **Procedure Limits**  
  - **Where It Fails**: Interventions for **user safety** (e.g., fraud blocks). The procedure may block these for lacking "user intent" (Step 2) or "third-party impact" (e.g., blocking scams hurts scammers).  
  - **Why**: Safety requires paternalism, but the procedure assumes user autonomy.  
  - **Fix**: Add a pre-procedure branch: "Is this change primarily for user safety?" If yes, skip to Step 6 (third parties) and Step 7 (vulnerability).  

  ---

  ### **Key Structural Hand-Offs**  
  | Hand-Off Point               | Responsible Role          | Engineering’s Role |  
  |------------------------------|----------------------------|---------------------|  
  | User intent validation       | Product Leadership + UXR   | Must staff UXR      |  
  | Harm justification           | Legal + UXR                | Must staff both     |  
  | Third-party costs            | Legal + Ethics Review      | Ethics must exist   |  
  | Segment vulnerability        | UXR + Legal                | Must staff UXR      |  

  Engineering should never own these. Current gaps (e.g., no UXR) force `NO`.  

  This procedure prioritizes actionable checks over philosophy, enforces accountability, and halts intuition-driven debates. Use it as a living document—revise thresholds (e.g., 20% user demand) based on organizational risk tolerance.
