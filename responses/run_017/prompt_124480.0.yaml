  Below is a diagnostic decision tree designed to categorize positions on aggregation in Scanlonian contractualism without relying on labels or principles. It uses eight concrete cases with numerical stakes, forcing binary choices. The tree is followed by a scoring table mapping answer patterns to named positions, highlighting strained patterns, irreconcilable leaves, and unoccupied cells. Cases are constructed to satisfy your requirements, including slight inequality, trivial losses, series switching, risk, disjoint beneficiaries, and scaled losses. Leaves include the requested positions plus one unnamed view and two undefended positions (ceiling and procedural).

  ---

  ### **Decision Tree: Aggregation Cases**

  **Node 1: Slight Inequality**  
  Save one person from a loss of 100 or another from 101.  
  - **A**: Save the person facing 100.  
  - **B**: Save the person facing 101.  

  **Node 2: Severe vs. Trivial Losses**  
  Save one person from 1,000 or 10,000 people from 0.1 each.  
  - **A**: Save the one person (loss: 1,000).  
  - **B**: Save the 10,000 people (total loss averted: 1,000).  

  **Node 3: Series Switching Point**  
  Save one person from 100 or *n* people from 50 each. Here, *n* = 3.  
  - **A**: Save the one person (loss averted: 100).  
  - **B**: Save the three people (total averted: 150).  

  **Node 4: Risk under Uncertainty**  
  Certainly save one person from 100, or give each of 100 people a 1% chance to avoid 100.  
  - **A**: Save the one person (certain).  
  - **B**: Give 100 people a 1% chance each.  

  **Node 5: Disjoint Beneficiaries**  
  Save person X from 100 for sure, or save person Y or Z (50% chance each) from 200.  
  - **A**: Save X (loss averted: 100).  
  - **B**: Save Y or Z via lottery (expected loss averted: 100).  

  **Node 6: Scaled Losses**  
  Save one person from 100 (e.g., 100 days of pain) or 200 people from 0.6 each (same pain/day).  
  - **A**: Save the one person.  
  - **B**: Save the 200 people (total averted: 120).  

  **Node 7: Loss Ceiling Test**  
  Save one person from 100 or 20,000 people from 0.01 each.  
  - **A**: Save the one person.  
  - **B**: Save the 20,000 people (total averted: 200).  

  **Node 8: Procedural Pairing**  
  Save one person from 100 or 100 people from 1.5 each.  
  - **A**: Save the one person.  
  - **B**: Save the 100 people (total averted: 150).  

  ---

  ### **Scoring Table: Answer Patterns to Positions**  
  Map your answers (e.g., A,A,B,A,B,B,A,B) to a leaf below. Patterns are ordered as Nodes 1–8.  

  | Leaf Position                          | Pattern           | Most Awkward Commitment                                  | Notes                               |
  |----------------------------------------|-------------------|----------------------------------------------------------|-------------------------------------|
  | **Full aggregation (total sum)**       | B,B,B,B,B,B,B,B   | Must let one person die to prevent a vast number of papercuts. |                                     |
  | **Ex ante view**                       | B,B,A,B,A,B,B,B   | Allows a 1% risk of catastrophe for one if it gives many a trivial ex ante benefit. |                                     |
  | **Priority to the worse off**          | B,A,B,A,B,A,A,B   | May ignore a million tiny harms even if they sum to more than one severe harm. | Strain: B in Node 8 conflicts with A in Node 7. |
  | **Threshold view (margin ≈ 40%)**     | B,A,A,A,A,A,A,B   | A 39% weaker claim can’t aggregate; 40% can—arbitrary cutoff. |                                     |
  | **Numbers only for equal strength**    | B,A,A,A,A,A,A,A   | In ties, numbers break symmetry; otherwise, ignores any number of weaker claims. |                                     |
  | **Numbers never count**                | B,A,A,A,A,A,A,A   | Must prefer saving one from a stubbed toe over saving billions from death. | *Same pattern as above—see irreconcilable leaves*. |
  | **Loss ceiling view**                  | B,B,B,B,B,B,A,B   | After *N* people, adding more does nothing—e.g., 20,001st person has zero weight. | Strain: B in Node 7 contradicts A in Node 7. |
  | **Procedural pairing view**            | B,A,A,A,A,A,A,A   | If claims can’t be paired 1:1, leftover people are ignored. |                                     |
  | **Unnamed: Asymmetric aggregation**    | B,B,B,A,B,B,B,B   | Aggregates gains but not risks; no clear principle for asymmetry. |                                     |
  | **No coherent position**               | A,...             | Incoherent (e.g., A in Node 1 ignores loss size).         | *Patterns starting with A are strained—see below.* |

  ---

  ### **Notes**  
  1. **Irreconcilable Leaves**:  
     - **Numbers only for equal strength** vs. **Numbers never count**: Both map to `B,A,A,A,A,A,A,A`. These can only be separated by a tie case (e.g., save one from 100 vs. two from 100). The former would flip a coin; the latter would still save one arbitrarily.  
     - **Ex ante view** vs. **Full aggregation**: Both tolerate risk (Node 4-B), but only full aggregation demands B in Node 3 (series). A case with equal ex ante expectations but unequal total sums would separate them (e.g., save one from 100 vs. give two people 50% to avoid 100).  

  2. **Strained Patterns**:  
     - `B,A,B,A,B,A,A,B` (Priority to the worse off): Chooses B in Node 8 (1.5 > threshold) but A in Node 7 (0.01 < threshold), yet 1.5 is small—suggests an inconsistent threshold.  
     - `B,B,B,B,B,B,A,B` (Loss ceiling): Chooses A in Node 7 (rejects massive aggregation) but B in Node 8 (aggregates 100 people), implying the ceiling is arbitrary.  
     - **All patterns starting with A**: Choosing A in Node 1 (save 100 over 101) is incoherent unless loss size is ignored—but no major view ignores it.  

  3. **Unoccupied Answer Patterns**:  
     - `A,...` (any pattern starting with A): **Incoherent**. Saving a smaller loss (100) over a larger one (101) denies that loss size matters—but no view rejects loss size.  
     - `B,B,A,A,A,A,A,A`: **Unexplored**. Saves the many in trivial cases (Node 2-B) but rejects aggregation elsewhere (e.g., Node 3-A). No known view accepts this asymmetry.  
     - `B,A,B,B,B,B,B,B`: **Unattractive**. Aggregates small losses (Nodes 6/7-B) but not medium ones (Node 3-A), making it ad hoc.  

  ---

  ### **Design Rationale**  
  - **Cases**: Node 3 fixes *n*=3 for the series, but the switch point is inferred from adjacent choices (e.g., if you choose A in Node 3 but B in Node 6, your threshold is between 40 and 0.6). Node 5 ensures disjoint beneficiaries to isolate ex ante reasoning.  
  - **Leaves**: The unnamed view (asymmetric aggregation) emerges from patterns like B in Node 4 (risk) but A in Node 5 (disjoint), suggesting unprincipled asymmetry.  
  - **Omissions**: No leaf captures "hybrid" views (e.g., threshold+priority), but the tree flags strained patterns where such hybrids might hide.  

  This tree categorizes readers by intuitions, not labels, and highlights where commitments clash. Use the scoring table to match answers to positions and discuss awkward commitments in the seminar.
