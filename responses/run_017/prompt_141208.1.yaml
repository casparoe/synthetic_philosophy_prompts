prompt: |-
  There is an argument I have taught for fifteen years and have never been able to get into focus, and I have decided that the reason may be that I am trying to see it in the wrong idiom.

  I am a professor of moral philosophy. Before I took my doctorate I spent six years as a risk analyst on a commodities desk — I priced, hedged, and argued with traders about sizing, and I never fully lost the vocabulary. When an argument in ethics will not resolve for me I still try to restate it in those terms: expected value taken under a model you do not trust, tail index, value-at-risk and expected shortfall, Knightian uncertainty versus risk, ambiguity aversion, model risk, robust optimization and minimax regret, position sizing and the Kelly fraction, ergodicity and the gap between time averages and ensemble averages, discount rates and the numéraire in which a stream of payoffs is denominated. I can use these terms loosely and follow a formal argument stated in them; I have not run a book in twenty years, and I do not want a tutorial in them. I want them used on something.

  The argument is the cluelessness objection to act-consequentialism, as I would state it to a graduate seminar. Act-consequentialism bids you perform, of the acts available to you, the one whose total downstream consequences are best. But for almost any act you might perform now: (i) the bulk of the consequences — in expectation, if the expectation is defined at all — falls beyond any horizon over which you have evidence about what your act will do, because causal chains do not stop and the far future is very long; (ii) the sign of the net value of those distal consequences is not recoverable from your evidence, and the distal terms are large enough that they swamp the proximal terms you can estimate; so (iii) the criterion, taken at face value, yields no usable guidance — it does not tell you to do what commonsense morality says, it does not tell you to do the opposite, and it gives you no reason to think that the acts it would recommend, if you could compute them, resemble the acts anyone would recognize as decent.

  Against this there are three replies I also teach, and I want all four positions — the argument and the three replies — carried across. First, the second-order reply: even if you cannot compute expected value, you should still do what, on your evidence, you have most reason to expect to be best; maximize subjective expected value by your own lights, however noisy the estimate, and accept that you will often be badly wrong. Second, the indirect reply: stop applying the criterion to acts and apply it to rules, dispositions or institutional mandates; a rule like keep your promises, prevent the famine, do not burn the library may be vindicated by its long-run profile even though no individual application of it can be. Third, what I call proximalism: act on the consequences you can estimate, on the ground that the unknowable distal terms are either roughly symmetric across your options or, if not symmetric, are to be excluded from the decision rule even while they remain part of the truth about what would in fact be best.

  Two things of my own that I want put under the same pressure. The first is a distinction I have started making in lectures and cannot tell is genuine: cluelessness of *sign* (you cannot tell whether the act is net good or net bad), cluelessness of *scale* (you can sign it but not size it, and the size is what dominates), and cluelessness of *numéraire* (you know the outcomes well enough but not what they are to be counted in — whose welfare, at what discount, under which rule for aggregating across persons and across generations). My suspicion is that the risk vocabulary can express the first two and has no organ for the third, and that much of the heat in the literature comes from sliding between them. The second is a test I have been toying with for the proximalist rule: instead of picking a truncation horizon, ask whether an option's ranking is stable as the horizon is extended — treat the choice of horizon the way one treats the choice of sample size, and see whether the estimate settles. I want to know whether that test has a principled version in your vocabulary or whether the horizon has to be chosen by hand, in which case the choice of horizon seems to me to be doing all the work and the rule is circular.

  Here is what I want. Give me the cluelessness argument and the three replies restated in the risk vocabulary, as faithfully as you can, term by term — a mapping I could put on a seminar handout. Then give me the ledger of what did not come through: which claims translate cleanly; which translate only after you have quietly helped yourself to something the original does not grant — a well-specified loss function, a stationary generating process, a repeatable bet, an option to hold cash and decline the trade, a market price for the payoff in question — in which case I want the borrowed assumption named explicitly; and which claims cannot be stated in that vocabulary at all, and are not merely inconvenient but unsayable. For each item in the ledger, give me your view on which way the loss tells: is it a defect of the risk framework, which was built to price one agent's book over repeated draws and was never meant to say what anyone owes to strangers not yet born, or is it a sign that the philosophers' claim was less clear than it sounds — an anxiety that a working risk desk would have handled with fractional Kelly and gone home? Be spare and technical rather than readable. If the honest answer to one of my questions is that the vocabulary has no word for the thing, say that and stop.
reasoning: |-
  We are to restate the cluelessness argument and three replies in the vocabulary of risk management. Then, we are to provide a ledger of what did not come through, including what assumptions were borrowed and what is unsayable.

  The cluelessness argument in risk terms:

  1. **Cluelessness Argument**:
     - (i) **Horizon of Evidence**: The expected value (EV) of an act is dominated by consequences beyond the horizon for which we have reliable data or models. This is due to the long time horizon (far future) and the non-stationarity of the processes (causal chains do not stop). We face model risk and Knightian uncertainty (unknown probabilities) for these distal effects.
     - (ii) **Sign and Dominance**: The net value of the distal consequences has an undefined or unknown sign (we cannot tell if it's positive or negative) and the magnitude (if the sign were known) is so large that it dominates the proximal EV. Moreover, the tail index (fatness of tails) may be high, meaning extreme outcomes are more likely than under thin-tailed distributions. This leads to the proximal EV being swamped by the distal, making the total EV unreliable.
     - (iii) **No Usable Guidance**: Therefore, the act-consequentialist criterion (maximize total EV) fails to provide actionable guidance. The computed EV may be dominated by terms that are ambiguous in sign and huge in scale, so that the ranking of acts is arbitrary.

  2. **Replies**:
     - **First Reply (Second-order: maximize subjective expected value)**:
       Even though the model is untrusted and the EV estimate is noisy (high model risk), one should still use subjective expected value (SEV) based on the available evidence. This is analogous to using a model with known flaws because it is the best available. One must accept the risk of being wrong (high expected shortfall in the decision outcome) and the possibility of regret.

     - **Second Reply (Indirect: apply to rules)**:
       Instead of evaluating individual acts, evaluate rules (or policies, dispositions, institutional mandates) by their long-run performance. This is like robust optimization over a set of scenarios or like choosing a strategy (e.g., a trading rule) that has a favorable profile in terms of value-at-risk (VaR) or expected shortfall (ES) over many instances. The rule is chosen to have a positive EV in the long run (ergodicity: time average converges to ensemble average) even if individual instances have high variance and may be negative.

     - **Third Reply (Proximalism)**:
       Focus on the consequences within a horizon where the EV can be estimated with reasonable model risk. The distal consequences are either:
          (a) symmetric across acts (so they cancel out in the comparison), or 
          (b) if asymmetric, they are excluded from the decision rule because they are beyond our epistemic reach.
       This is analogous to truncating the tail in VaR calculations or using a stopping rule in Monte Carlo simulations. The decision is made on the basis of the proximal cash flows.

  Now, the ledger:

  **What translated cleanly**:
  - The idea of a long horizon and the dominance of the tail (distal consequences) is captured by the concept of tail risk and the properties of the tail index.
  - The distinction between risk (known probabilities) and Knightian uncertainty (unknown probabilities) is directly applicable to the proximal/distal split.
  - The notion of model risk (using a model that is known to be misspecified) applies to the use of any model for the far future.
  - The second-order reply (maximize SEV) is standard in decision theory under uncertainty and is analogous to using a model even when it is known to be imperfect.
  - The indirect reply (evaluating rules) maps to robust optimization and strategy testing over multiple scenarios (backtesting a trading rule).

  **What required borrowing assumptions**:
  1. **Stationarity and Ergodicity**: The indirect reply assumes that the rules are evaluated in a stationary environment and that the long-run average (time average) converges to the expected value (ensemble average). But the original problem does not grant stationarity because the world may change in non-repeating ways. This is a borrowed assumption.

  2. **Independence and Cancellation**: Proximalism (part a) assumes that the distal consequences are symmetric (i.e., the net effect is the same for all acts) so that they cancel in the comparison. This is analogous to assuming that the residual risk is uncorrelated with the act choice. But the original argument does not grant this symmetry; it might be that the distal consequences are asymmetric and large. We borrowed the assumption of symmetry.

  3. **Well-defined Loss Function**: The entire exercise assumes that we have a well-defined utility function (or loss function) that is additive over time and across states. However, the cluelessness problem raises the issue of the numéraire (in which unit to measure welfare) and aggregation across generations. The risk vocabulary typically assumes a fixed numéraire (e.g., money) and does not handle the incommensurability of values across generations.

  4. **Repeatability**: The indirect reply (evaluating rules) relies on the repeatability of the decision situation (like repeated bets) so that the long-run properties can be estimated. But real-world moral decisions are often unique and non-replicable. We borrowed the assumption of repeatability.

  5. **Truncation Horizon**: In proximalism, the truncation horizon is chosen arbitrarily. The risk vocabulary does not have a principled way to set the horizon; it is chosen by the modeler. This is a borrowed assumption that the horizon can be set meaningfully.

  **What is unsayable**:
  1. **Cluelessness of Numéraire**: The risk vocabulary has no direct way to express the problem of not knowing in what unit to measure the payoff (welfare). In finance, the numéraire is typically money (or a basket of goods) and is taken as given. The problem of aggregating welfare across persons and generations (which involves interpersonal comparisons and discounting) does not have a counterpart in standard risk management. The risk framework assumes the numéraire is fixed and agreed upon.

  2. **Non-Additivity of Value**: If the value of consequences is not additive (e.g., due to threshold effects or interactions between acts of different agents), the risk vocabulary (which typically assumes linearity) cannot capture this. The original argument does not assume additivity, but the risk restatement does.

  3. **The Test for Stability with Horizon Extension**: The test of whether the ranking of options stabilizes as the horizon is extended (like increasing sample size) is unsayable in the risk vocabulary because:
     - The generating process for the distal consequences is non-stationary and non-ergodic, so extending the horizon does not necessarily reduce variance (it might increase it).
     - Without stationarity, there is no law of large numbers to make the estimate converge.
     - The risk framework does not provide a way to define such a test without assuming stationarity and ergodicity, which we cannot.

  **Which way the loss tells**:
  - The unsayability of the numéraire problem and the non-additivity are defects of the risk framework. It was designed for financial decisions with a fixed numéraire and does not extend to intergenerational moral decisions where the unit of account is contested.
  - The need to borrow stationarity and repeatability for the indirect reply and the stability test indicates that these replies are less robust than they appear. A working risk desk would avoid such non-stationary bets or would charge a high risk premium (via a high discount rate) for the uncertainty. However, in ethics, we cannot avoid the bet. Thus, the philosopher's claim about cluelessness is valid: the risk framework shows that the problem is one of non-stationarity and model risk that cannot be fully resolved.
  - The truncation horizon in proximalism is arbitrary and circular because the risk vocabulary does not provide a non-arbitrary way to set it. This suggests that the philosopher's proximalism is not well-founded without an independent justification for the horizon.

  In summary, the risk vocabulary helps clarify the structure of the problem (especially the role of tail risk and model risk) but fails to capture the moral dimensions (numéraire, aggregation) and the non-stationarity of the world. The borrowed assumptions (stationarity, repeatability, fixed numéraire) are not granted in the original problem and indicate that the risk framework is not fully adequate for the ethical problem.

  **Response**:

  The cluelessness argument and replies restated:

  **Cluelessness Argument**:
  - (i) The EV of an act is dominated by tail events beyond the modeling horizon, with high model risk and Knightian uncertainty.
  - (ii) The sign of the tail contribution is unknown, and its magnitude dominates the proximal EV, leading to indeterminate rankings.
  - (iii) Therefore, the criterion fails to provide guidance.

  **Replies**:
  1. **Second-order**: Maximize SEV despite noise and model risk; accept regret.
  2. **Indirect**: Evaluate rules by their long-run EV, assuming stationarity and ergodicity.
  3. **Proximalism**: Truncate the horizon; assume distal effects are symmetric or exclude them.

  **Ledger**:

  | Claim | Clean Translation? | Borrowed Assumption | Unsayable | Loss Tells |
  |-------|--------------------|----------------------|-----------|------------|
  | (i) Horizon of Evidence | Yes | None | None | - |
  | (ii) Sign and Dominance | Partially (sign unknown, tail dominates) | None | None | - |
  | (iii) No guidance | Yes | None | None | - |
  | Second-order reply | Yes | None | None | - |
  | Indirect reply | Only with stationarity | Stationarity and ergodicity | None | Philosopher's claim less clear: without stationarity, the rule's long-run properties are undefined. |
  | Proximalism (a: symmetry) | Only with symmetry | Symmetry of distal effects | None | Philosopher's claim requires an unsupported assumption. |
  | Proximalism (b: exclusion) | Yes | None | None | - |
  | Cluelessness of sign | Yes | None | None | - |
  | Cluelessness of scale | Yes | None | None | - |
  | Cluelessness of numéraire | No | None | Yes | Defect of risk framework: built for fixed numéraire. |
  | Stability test | No | None | Yes (requires stationarity) | Defect of risk framework: non-stationary processes break the test. |

  The stability test for proximalism is unsayable because it requires stationarity and ergodicity to have a hope of convergence, which we don't have. Without that, the test is undefined.

  The above is spare and technical as requested.
answer: |-
  ### Restatement of the Cluelessness Argument and Replies in Risk Vocabulary

  **Cluelessness Argument**  
  1. **Horizon of Evidence (i)**: The expected value (EV) of an act is dominated by tail events beyond the forecasting horizon. Causal chains exhibit non-stationarity, and model risk escalates with time horizon due to lack of data. The far future represents a long-tailed process (high tail index) where extreme outcomes dominate.  
  2. **Sign and Dominance (ii)**: The net value of distal consequences has undefined sign under Knightian uncertainty. Distal terms have high expected shortfall relative to value-at-risk (VaR) at any confidence level, swamping proximal EV estimates. Ambiguity aversion cannot resolve sign indeterminacy.  
  3. **No Guidance (iii)**: EV maximization fails as a decision rule. The criterion is non-computable: rankings are unstable under model perturbations, and optimal acts are not robust to tail assumptions. Acts deemed "decent" by commonsense have no EV-based justification.  

  **Replies**  
  1. **Second-Order (Maximize Subjective Expected Value)**:  
     - Despite model risk, maximize subjective EV using available evidence. Treat noise as variance in estimates; accept high regret (realized loss vs. optimal) and expected shortfall as irreducible. This is equivalent to sizing a position with unreliable data, using best-effort probability measures.  
  2. **Indirect (Apply to Rules/Dispositions)**:  
     - Shift optimization from acts to rules (e.g., "keep promises"). Evaluate rules by long-run EV under repeated plays. Assumes ergodicity: time-average performance converges to ensemble average. Rules are robust if they minimize worst-case regret across plausible models (minimax regret).  
  3. **Proximalism (Truncate Horizon)**:  
     - Optimize over proximal consequences only. Distal effects are either:  
       - **Symmetric**: Net EV delta across acts is zero (canceling in pairwise comparisons).  
       - **Excluded**: Treated as model risk with infinite variance, excluded from EV calculus.  
     - Decision rule uses a fixed horizon (e.g., 10-year VaR), ignoring tail events beyond.  

  ---

  ### Ledger of Translation Fidelity  

  #### Claims Translating Cleanly  
  - **Horizon of Evidence (i)**: Clean. Maps directly to tail dominance, non-stationarity, and model risk escalation with horizon.  
  - **Sign Indeterminacy (ii)**: Clean. Knightian uncertainty and ambiguity aversion capture unknown sign; expected shortfall/VaR comparisons illustrate dominance.  
  - **Second-Order Reply**: Clean. Subjective EV maximization with noisy estimates is standard under model risk.  
  - **Indirect Reply (Rule Evaluation)**: Clean. Robust optimization over rules via minimax regret or ergodicity (time-average = ensemble average) is standard.  
  - **Cluelessness of Sign/Scale**: Clean. Sign indeterminacy = undefined EV; scale indeterminacy = tail dominance (high tail index).  
  - **Proximalism Exclusion (b)**: Clean. Truncating tails due to unmodelable risk is common (e.g., ignoring events beyond VaR horizon).  

  #### Claims Requiring Borrowed Assumptions  
  1. **Indirect Reply (Ergodicity)**:  
     - Borrowed assumption: Stationary generating process.  
     - Why: Ergodicity requires a stable data-generating process (DGP) over time. Ethics lacks this—future societal/political shifts break stationarity.  
     - Loss tells: Philosopher's claim less clear. Real risk management assumes stationarity for backtesting; if denied, rule evaluation fails.  

  2. **Proximalism Symmetry (a)**:  
     - Borrowed assumption: Zero net delta in distal effects across acts.  
     - Why: Symmetry implies distal terms cancel in pairwise comparisons (like delta-neutral hedging). No ethical basis for this.  
     - Loss tells: Philosopher's claim less clear. Risk frameworks assume symmetry only in contrived scenarios; absent this, exclusion (b) must be used.  

  3. **Stability Test for Proximalism**:  
     - Borrowed assumption: Stationary DGP for convergence.  
     - Why: Test requires extending horizon until EV stabilizes (e.g., increasing sample size). Non-stationary DGPs prevent convergence.  
     - Loss tells: Philosopher's claim less clear. Risk desks avoid non-stationary bets; if forced, they use arbitrary horizons.  

  4. **EV Maximization Framework**:  
     - Borrowed assumption: Well-specified loss function in a fixed numéraire.  
     - Why: Risk frameworks require a numéraire (e.g., USD) to define payoffs. Ethics lacks this for welfare aggregation.  
     - Loss tells: Defect of risk framework. Built for monetary outcomes, not intergenerational welfare.  

  #### Unsayable Claims  
  1. **Cluelessness of Numéraire**:  
     - Unsayable: No vocabulary for aggregating welfare across persons/generations or selecting a discount rate. Risk frameworks fix the numéraire ex ante (e.g., cash flows in USD).  
     - Why: Numéraire selection is normative; risk management takes it as given.  
     - Loss tells: Defect of risk framework. Reveals its limitation to single-currency, agent-centric decisions.  

  2. **Non-Additive/Multi-Agent Effects**:  
     - Unsayable: No way to model acts affecting other agents' strategy sets (e.g., your act changing others' options). Risk frameworks assume independent payoffs.  
     - Why: Risk models treat payoffs as exogenous; ethics involves endogenous system effects.  
     - Loss tells: Defect of risk framework. Designed for price-takers in markets, not moral actors.  

  3. **Stability Test Without Stationarity**:  
     - Unsayable: Cannot define "convergence" of rankings under non-stationarity.  
     - Why: Requires ergodicity to equate time and ensemble averages. Without it, extending horizon increases model risk.  
     - Loss tells: Defect of risk framework. Non-stationary processes break standard tests; horizon must be chosen by hand.  

  ---

  ### Summary of Loss Attribution  
  - **Defects of Risk Framework**:  
    - Cannot handle numéraire selection, non-additive welfare, or non-stationary long-run effects. Built for repeated, numéraire-fixed decisions.  
    - Reveals philosophers' unstated assumptions (e.g., symmetry) as implausible in real uncertainty.  
  - **Philosophy's Unclarity**:  
    - Proximalism’s symmetry claim and stability test rely on ungrounded stationarity. Risk frameworks show these require arbitrary assumptions.  
    - Cluelessness of scale/sign is well-expressed; numéraire is the core unsolved gap.  
  - **Final Note**: Where vocabulary fails (numéraire, non-stationarity), risk management would "decline the trade" or use fractional Kelly sizing to limit exposure. Ethics lacks this exit option.  

  ---  
  *No further elaboration where vocabulary has no organ (numéraire, non-additivity).*
