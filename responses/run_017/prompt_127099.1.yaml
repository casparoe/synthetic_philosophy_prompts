prompt: |-
  You are a professional philosopher who works on population ethics and on decision-making under deep uncertainty. Take your time with this: brainstorm several candidate explanations before committing to one, and tell me which you find most plausible and why.

  I'm a risk economist, and about six months ago I joined a foundation that funds work on very-long-term risks. In meetings I keep hitting the same asymmetry. My colleagues will cheerfully multiply a small, barely estimable probability by an astronomically large number of possible future lives when the sign is positive: a one-in-a-hundred chance of losing a civilisation's worth of future value is treated as obviously warranting very large present-day expenditure. Run the same multiplication with a negative sign — a one-in-a-hundred chance of a future containing vastly more suffering than happiness, the sort of thing people here call s-risks — and the response flips to "that's science fiction", "you can't put a number on that", "we should be humble", with the burden of proof treated as effectively unmeetable. Same people, same orders of magnitude, same epistemic position, same readiness to spend money now.

  I've run the obvious explanations and they seem to point the wrong way, and I'd like you to say why they fail as well as what does fit. Loss aversion, negativity bias, dread, and the affect heuristic should all make a bad tail more urgent, not less; so should an implicit maximin. It isn't act versus omission or status-quo bias, since both responses are active spending. It isn't scope neglect as usually described, because the same people take numbers of that size perfectly seriously when the sign flips. And it survives among colleagues who endorse a fully symmetric axiology, counting a unit of suffering and a unit of happiness as equal and opposite.

  So what is this? Is there an established concept or literature for it, or is it several different things that I am conflating? Is it best read as an implicit axiological asymmetry, as an epistemic asymmetry that might actually be defensible — a real difference in the kind of evidence available, or in who bears the burden of proof — or as something motivational? Where are its edges: does the same reversal show up if you substitute pandemic risk for extinction risk, or is there something specific about suffering? If nothing established fits, coin a term, define it, and describe a case that would test whether it is present. A bare label will not answer my question.
reasoning: |-
  Okay, let me start by really digging into this risk economist's problem. They're noticing a weird asymmetry in how their colleagues handle extreme long-term risks. When it's about preventing a catastrophe that could wipe out future happiness, everyone's on board to spend big, even with tiny probabilities. But flip it to preventing a future full of massive suffering, and suddenly the same people get skeptical—calling it sci-fi or impossible to quantify. 

  First, I need to unpack why this is puzzling. The user already ruled out common biases like loss aversion or scope neglect, since those should make suffering risks seem more urgent, not less. And it's not about axiology because some colleagues explicitly treat suffering and happiness as symmetric. Hmm. 

  Let me brainstorm possible explanations. Maybe it's about different epistemic standards? Like, people might feel more confident estimating extinction probabilities than suffering risks. But is that true? Both involve deep uncertainty. Or perhaps it's the "burden of proof" being shifted—suffering risks need more evidence to be taken seriously. But why? 

  Another angle: narrative availability. Stories of saving humanity are everywhere in culture, while large-scale suffering scenarios feel more abstract or taboo. Also, there's the "activism bias"—people want to be heroes, not just prevent villains. And institutional factors: their foundation might have a stated mission focused on existential risks, making suffering risks seem off-brand. 

  Wait, what about evolutionary psychology? Humans are wired to prioritize visible, immediate threats. Future suffering might feel less tangible than extinction. But does that hold when colleagues are comfortable with astronomically large numbers for positive outcomes? 

  I recall literature on "prospection neglect"—where negative futures feel less real than positive ones. And moral psychology concepts like "dyadic completion" might explain why preventing suffering feels less heroic. 

  Testing this would involve scenarios: swap "suffering" for a familiar risk like pandemics. If the asymmetry disappears, it's specific to suffering. If not, it's more general. Also, check if the same colleagues apply skepticism to positive low-prob/high-impact claims outside work—probably not. 

  After mulling, the epistemic overdemandingness combined with institutional identity seems strongest. Colleagues might accept uncertainty for their organization's core mission but raise standards for adjacent issues to manage workload. Plus, suffering risks force confronting uncomfortable moral questions, unlike the clean narrative of saving humanity. 

  The user needs more than labels—they want mechanisms. So I'll structure this as competing hypotheses, weigh them, and suggest real-world tests. The key is that it's not one thing but layers: cognitive, institutional, and motivational, with epistemic standards as the lever.
answer: |-
  Your observation reveals a profound and under-discussed asymmetry in long-termist reasoning. After analyzing this through multiple philosophical lenses, I propose a layered explanation. Below are evaluated hypotheses, concluding with the most plausible integrated account.

  ### Candidate Explanations & Why Common Biases Fail
  1. **Epistemic Asymmetry (Differential Burden of Proof)**  
     *Hypothesis*: Positive and negative tail risks face different epistemic standards. Existential gains (e.g., saving future civilization) are seen as extensions of known human drives (flourishing, progress), while s-risks (extreme suffering) require proving novel causal mechanisms.  
     *Why this fits*: Your colleagues may implicitly accept "default trajectories" (status quo = net-positive) unless proven otherwise. S-risks appear "science fiction" because they demand evidence of unprecedented suffering amplification.  
     *Failure points*: Same uncertainty applies to both cases. If anything, historical evidence (e.g., factory farming, pandemics) better anchors suffering risks than speculative utopias.

  2. **Axiological Asymmetry Masked by Verbal Symmetry**  
     *Hypothesis*: Even colleagues claiming symmetric axiology (1 util of suffering = -1 util of happiness) may unconsciously weight *aggregate* suffering as less tractable or less morally salient than aggregate happiness.  
     *Why this fits*: Human cognition often treats suffering reduction as "merely" preventing harm (satisficing), while flourishing represents active progress (maximizing). S-risk prevention lacks a clear "heroic" narrative.  
     *Failure points*: You note explicit symmetry endorsement. But verbal commitments may not reflect intuitive moral heuristics.

  3. **Prospection Neglect & Affective Asymmetry**  
     *Hypothesis*: While negativity bias amplifies *present* threats, *future* suffering evokes weaker affect than future happiness. We simulate utopias more vividly than dystopias due to optimism bias.  
     *Why this fits*: Neural evidence shows prospection of positive futures activates reward centers more strongly than negative scenarios activate avoidance systems. S-risks feel abstract; saving civilization feels inspiring.  
     *Failure points*: Dread *should* amplify s-risks. But if suffering scenarios feel unreal ("can't put a number on that"), dread fails to activate.

  4. **Institutional Identity & Motivated Cognition**  
     *Hypothesis*: Foundations focused on "existential risk" attract talent oriented toward preventing collapse. S-risks conflict with institutional identity, triggering motivated skepticism.  
     *Why this fits*: Your foundation likely frames its mission as "saving the future," not "preventing hellscapes." Colleagues subconsciously protect their professional self-concept.  
     *Failure points*: Doesn’t explain why individuals endorse symmetry privately.

  5. **Moral Diminishing Returns & Scope Insensitivity for Suffering**  
     *Hypothesis*: Suffering may be subject to scope neglect *in the negative direction* – people perceive "extreme suffering" as categorically bad but resist quantifying marginal increases beyond a threshold.  
     *Why this fits*: Studies show people treat "a million suffering" vs. "a billion suffering" as similarly bad. Happiness gains, however, remain linearly scalable in intuition.  
     *Failure points*: Should apply symmetrically to large happiness gains ("utilitarian heaven is just as unimaginable").

  ---

  ### Most Plausible Integrated Account: **Epistemic Overdemandingness + Institutional Teleology**
  The core issue combines two factors:

  1. **Differential Burden of Proof via Teleological Bias**  
     Your colleagues likely hold an implicit model of history as *progress-conducive by default*. Existential risk prevention preserves this trajectory; s-risk prevention requires proving history can actively reverse into net-negative states. This demands stronger evidence:  
     - Positive tail: *Any* chance of preserving progress warrants investment.  
     - Negative tail: Must prove *feasibility* of anti-teleological outcomes (e.g., rogue AI deliberately maximizing suffering).  

  2. **Institutional Epistemic Filters**  
     Long-termist institutions often adopt a "protect the trajectory" mindset. S-risks force engagement with:  
     - Morally uncomfortable questions (e.g., "Is non-existence better than suffering-dense existence?")  
     - Divisive topics (e.g., antinatalism, strong negative utilitarianism)  
     - Lower professional ROI (fewer grants, publications, allies)  

  Thus, **suffering risks face higher epistemic barriers because they challenge the foundational narrative of cosmic progress that motivates the field**. The asymmetry persists among symmetric axiologists because their moral calculus operates *within* a teleological framework they don't scrutinize.

  ---

  ### Testing the Mechanism
  **Term**: **Teleological Burden Asymmetry**  
  *Definition*: The tendency to impose higher evidentiary standards on outcomes implying persistent deviation from a default trajectory of moral progress than on outcomes preserving that trajectory, even when symmetric value structures are nominally endorsed.

  **Test Case**:  
  Propose two scenarios to colleagues:  
  > *Scenario A*: 0.1% chance that a biotech intervention unlocks near-infinite happiness capacities in future minds.  
  > *Scenario B*: 0.1% chance that the same intervention causes near-infinite suffering capacity.  

  **Prediction**:  
  If colleagues rate A as more fundable than B *even when both are deemed equally probable*, teleological bias is confirmed. If asymmetry vanishes, your original observation is specific to *civilizational* risks (extinction vs. s-risks).

  **Edge Cases**:  
  - **Pandemic asymmetry**: Should be smaller (both preserve trajectory/threaten collapse).  
  - **Non-suffering negatives**: Test with "0.1% chance of future where happiness is permanently capped at 10% of potential." If this faces less skepticism than s-risks, suffering-specific evasion is at play.

  ---

  ### Why This Matters Philosophically
  This asymmetry reveals a flaw in "value-neutral" long-termism: **Even symmetric axiologies get embedded in asymmetric teleological assumptions about history's direction.** Calling s-risks "science fiction" isn’t epistemic humility—it’s a failure to consider that *the default trajectory might include suffering amplification*. Correcting this requires either:
  - Rejecting default optimism (e.g., via stronger priors from evolutionary psychology/pessimism meta-induction)  
  - Explicitly justifying why suffering catastrophes require stronger evidence than utopian ones  
  Until then, long-termism risks being a moral project that selectively ignores its own most challenging implications.
