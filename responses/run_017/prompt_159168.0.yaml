  Okay, the user teaches an ethics of work seminar and has encountered a recurring argument pattern. They notice that critics of overwork frame their arguments using the logic and language of work itself—rest as productivity input, burnout as inefficiency, leisure as disguised work. Meanwhile, defenders of work avoid directly valuing non-work. The user also observes people structuring free time like work (tracked hobbies, optimized vacations) and feeling guilty during unstructured time. They want to know if this phenomenon has a name and whether both observations are part of the same issue.

  First, I need to unpack the core issue. The user is pointing out that even when arguing against overwork, critics use productivity-based reasoning. For example, rest is justified because it boosts output, not because leisure has intrinsic value. This suggests a deep internalization of work's values. The second part is about how people use their free time—turning hobbies into performance or feeling guilty when not productive. The user wonders if these are connected.

  Weber's Protestant work ethic comes to mind, but that's about the cultural valorization of work. Adorno and Arendt discuss leisure's commodification or labor's necessity. The user mentions these but feels they don't quite fit because the issue is the critics conceding to work's framework even in critique. So, the existing theories don't fully address this internalized concession.

  I recall Marcuse's "repressive desublimation" where needs are shaped by the system. Could this apply? When people turn hobbies into achievement, it's like leisure being co-opted. But the user's point is about the argument structure itself. The critics can't articulate non-work's value without referencing work's metrics. That's a discursive trap.

  Then there's the term "productivity imperative" or "instrumental rationality" from Frankfurt School. Adorno and Horkheimer talk about how reason becomes tool-like, valuing efficiency above all. This could explain why arguments against overwork still use productivity logic. But does it cover both the discursive pattern and the behavioral aspect?

  The user's two observations might be linked through internalized instrumentalization. The argumentative concession (part one) and the behavioral internalization (part two) both stem from work's values dominating how we think and act. So, they could be two manifestations of the same phenomenon: the inability to conceive of non-instrumental value.

  For a coined term, "Productive Hegemony" might work—hegemony as cultural dominance, productive emphasizing the work-centered logic. Or "Instrumental Capture," highlighting how even critiques get framed instrumentally. Need to define boundaries: contemplative practices like meditation might resist if not goal-oriented; Sabbath could be counterexample if observed for intrinsic value. But if Sabbath is framed as recharging for work, it falls under the phenomenon.

  The user wants to know if arguing for leisure rights without falling into this trap is possible. Maybe by grounding in human dignity or autonomy instead of productivity. But would that avoid the pattern? Needs careful framing to avoid instrumental language.
answer: |-
  What you're describing is a profound and under-theorized phenomenon. It deserves a name because it's a distinct conceptual trap. I propose **Productive Hegemony** (or **Instrumental Capture**), defined as:

  > **The inability to articulate the intrinsic value of non-work (leisure, idleness, rest) except through the logic, metrics, and justifications of productive labor itself, leading to both discursive concessions in critique and the colonization of free time by work-like structures.**

  This isn't *just* the Protestant Work Ethic, commodification of leisure, or work's cultural dominance. It's the **internalization of work's instrumental rationality to the point where it becomes the only permissible framework for valuing time, even when opposing work's excesses.**

  **Carving the Concept & Boundaries:**

  1.  **Core Mechanism (The Trap):**
      *   **Argumentative Concession:** Critiques of overwork *must* frame non-work (rest, leisure, shorter hours) as ultimately serving work's goals: increased productivity, reduced costs (burnout/karoshi), efficient resource allocation (spreading jobs). The value of non-work is purely instrumental – a *means* to better work. Russell's concession to unemployment stats is a prime example.
      *   **Behavioral Internalization:** Individuals experience non-work time as legitimate *only* when it mimics work's structures (tracking, goals, optimization, outputs) or serves a recognizable future productive purpose ("recharging"). Unstructured time feels illegitimate, guilt-inducing, or wasteful because it lacks instrumental justification within the hegemonic framework.
      *   **The Unsayable:** The direct assertion "Not working is good *in itself*, independent of any future productive output" becomes linguistically and conceptually difficult or socially illegitimate.

  2.  **Is it One Phenomenon or Two?**
      *   **Deeply Connected:** The argumentative pattern and the behavioral colonization are two manifestations of the *same* underlying hegemony. The discursive trap (only work's logic is valid for argument) enables and reinforces the behavioral trap (only work-like structures make leisure feel valid).
      *   **The Root:** Both stem from the **totalizing dominance of instrumental rationality** (valuing actions/things solely for their usefulness in achieving a further goal, usually economic or quantifiable) applied to human time and activity. Work is the archetype of instrumentality; non-work struggles to find value outside this frame.

  3.  **Boundary Cases & Counterexamples:**
      *   **Contemplative Practices (Potential Counterexample):** Pure meditation or prayer aimed solely at being/connection, not self-improvement or productivity, *can* escape Instrumental Capture. However, if framed as "stress reduction for better focus" or "mindfulness for workplace harmony," it falls squarely within the phenomenon. *Edge:* The *intention* and *justification* are key. Is the practice valued intrinsically or instrumentally?
      *   **Sabbath (Boundary Case):** Traditional religious Sabbath observance is a strong challenge. Its value is explicitly non-instrumental – honoring divine command, sacred time, inherent human dignity in rest. It *forbids* productive labor. However:
          *   If justified as "necessary for community cohesion" or "preventing burnout," it edges towards capture.
          *   Modern secular attempts often lose this core, becoming "self-care" for Monday's productivity. *Edge:* Does the justification rely *primarily* on non-instrumental, intrinsic, or sacred value, or does it default to instrumental benefits?
      *   **Pure Play (Children/Artists?):** Unstructured child's play or artistic creation *aimed solely at the process* can resist capture. But once play becomes "enrichment" or art becomes "hustle," capture occurs. *Edge:* The absence of an external goal beyond the activity's own enjoyment/expression.
      *   **"Laziness" as Rebellion (Not Counterexample):** Deliberate idleness framed *as a protest against work* still defines itself *in relation to work*, conceding work's centrality. It uses work's framework ("I refuse *your* productivity") rather than asserting intrinsic value ("Being idle is good").
      *   **Karoshi (Illustration, Not Counterexample):** As you note, death from overwork only becomes a *legible* wrong within Productive Hegemony because it represents the ultimate loss of productive capacity. The intrinsic wrong of destroying a human life *before* that point is harder to articulate within this frame.

  4.  **Why Existing Frameworks Fall Short:**
      *   **Weber:** Explains the *origin* and *cultural valorization* of work but not the *discursive trap* where even critics can't escape its logic.
      *   **Adorno/Horkheimer (Culture Industry):** Explains how *external forces* commodify and structure free time ("pseudo-individualization," amusement as work) but doesn't fully capture the *internalized psychological guilt* or the *argumentative concession* where critics *themselves* use work's logic.
      *   **Arendt (Labor/Work/Action):** Distinguishes necessary biological labor ("animal laborans") from world-building work ("homo faber") and political action. While insightful, it doesn't directly address the *hegemony of instrumentality* that infects the valuation of *all* non-action time (rest, leisure, contemplation), forcing it into labor/work frameworks.
      *   **Marx (Alienation/Surplus Value):** Focuses on exploitation and loss of control *within* work, not the colonization of the *concept* of non-work or the discursive trap in criticizing work.
      *   **Burnout Discourse:** Often remains trapped within the instrumental frame (burnout as system inefficiency, rest as productivity hack).

  5.  **Can We Argue for Leisure Without Reproduction?**
      *   **Extremely Difficult, But Possible:** Escaping Productive Hegemony requires grounding the argument in foundations *outside* instrumental rationality:
          *   **Intrinsic Human Dignity/Autonomy:** Leisure/rest/idleness as essential for human flourishing *as an end in itself*, not a means. Related to capabilities approaches (Nussbaum/Sen).
          *   **Non-Instrumental Ethics:** Deontological (a duty to oneself to rest), Virtue Ethics (leisure as necessary for contemplation, friendship - *schole* in Aristotle), or deeply held religious values (Sabbath).
          *   **Critique of Instrumental Reason Itself:** Following Frankfurt School or Heidegger, arguing that reducing *all* value to utility is dehumanizing. Leisure becomes the space to resist this totalization.
          *   **Aesthetic/Experiential Value:** The inherent worth of unstructured experience, wonder, boredom, or simple being, without purpose.
      *   **The Challenge:** These arguments often feel "softer," less "rigorous," or less immediately persuasive in a culture saturated by instrumental logic. The very demand for a "practical justification" for leisure often *is* the hegemony at work. Asserting intrinsic value requires a fundamental shift in perspective.

  **In essence:** Productive Hegemony/Instrumental Capture is the water we swim in. It's not just that work is valued, but that its *mode of valuation* (instrumental rationality) becomes the only legitimate lens through which to view *any* use of time. Critiques get co-opted, leisure gets managerialized, and the simple goodness of *not working* remains the unsayable core. Recognizing this pattern is the crucial first step for your seminar to move beyond it. Your frustration is the sign you're hitting the conceptual bedrock.
