prompt: |-
  I've got a view about everyday conventions that I keep defending at meetups, and I want to know how exposed it actually is before I build more on top of it. Rough version: conventions like queue order, tip rates, whether you wait for the walk signal, which side you stand on an escalator, generate real moral obligations for visitors to a place — not just prudential reasons or etiquette. But the content of the obligation is fixed by local expectations, not by what the convention is nominally for, and what you owe is *conspicuous* compliance: you have to be seen going along, because the thing noncompliance damages is the shared expectation itself, not any particular persons interests. I basically think of conventions as Schelling points with normative glue smeared on them. Call it the expectation-maintenance account. There's one bit I especially like: locals are permitted to break their own convention (they've got standing to renegotiate it) while visitors aren't — call that the guests license asymmetry or whatever.

  So what would count against this? Skip the obvious stuff — "cultural relativism," "who says you have to follow local norms" — I can field that. What I want is a map of where the view is actually at risk:

  - The case it can't describe, or describes badly. I'm most worried about the invisible tourist: crossing against the light at 4am with nobody around, or skipping a tip at a place you'll never return to where nobody compares notes. My account seems to say there's no duty, since no expectation gets damaged. If that's actually fine, say why; if it's a reductio, walk me there.
  - The collapse risks, both directions. Where does this stop being moral philosophy and become "don't be rude to the locals" with extra steps? And where does it stop being a story about conventions and turn out to be an instance of a general duty not to free-ride on a cooperative scheme? Which collapse is more likely, and which feature of a case decides it.
  - A discriminating case: something my view predicts that the plain free-riding account doesn't, or vice versa, with an honest note about which way I'd have to find my intuitions going for it to count against me.
  - The awkward-but-not-fatal stuff, ranked separately: conventions that are themselves bad (a norm of paying off officials, a norm about who gets served first), visitor-only conventions (a queue at a tourist site with no locals in it), conventions in flux (a place where half the locals have stopped tipping), and the "opting out by announcement" move — if I loudly announce I'm not playing, have I discharged the duty?
  - What a defender would concede rather than fight. If I concede as much as I probably should, does anything interesting survive?
  - And whether I've insulated it. When I get pushed I start saying the duty is only pro tanto and the relevant expectation is that of a reasonable local, and I want to know if that's legitimate specification or whether I've qualified the thing into having no risk at all.

  The thing that would actually move me: an argument that expectation-maintenance can't distinguish being morally required from being strongly expected without secretly importing a harm or unfairness premise that's doing all the real work. If that lands I'd probably drop the view, so tell me how close such an argument is to succeeding. Rank everything fatal down to merely embarrassing, and if there's a real-world pattern you think already counts either way, describe the shape of it — I don't want dates or studies, just the shape. Be straight with me if the honest answer is that the view is well insulated and that this is okay because it's mostly a claim about what we owe strangers in shared spaces rather than an empirical claim.
reasoning: |-
  Okay, let me start by unpacking the user's query. They have this theory about everyday conventions creating real moral obligations for visitors, centered on conspicuous compliance to maintain shared expectations. They want to know where their view might be vulnerable. The user seems well-versed in moral philosophy, referencing concepts like Schelling points and free-riding. They’re looking for rigorous criticism, not surface-level objections.

  First, I need to address their main concern: the invisible tourist scenario. They’re worried that their theory implies no duty when no one’s around, like jaywalking at 4am. If there's no expectation to damage, is there still an obligation? This could be a reductio if we intuitively feel there’s still a duty, or it might be fine. I should consider whether the duty is solely about expectation or if there are deeper principles like rule-of-law values. Maybe the user hasn't accounted for the symbolic importance of conventions beyond immediate visibility.

  Next, the collapse risks. They don’t want their view to reduce to mere etiquette or general free-riding. To avoid collapsing into politeness, the moral weight must come from something more, like maintaining social coordination. But if it’s just about cooperation, then their account might not be distinct. I need to find cases where conspicuous compliance matters independently of cooperation. For example, tipping in a non-cooperative context or a convention that doesn’t solve a coordination problem.

  Discriminating cases are crucial. The user wants scenarios where their view differs from a free-riding account. Consider a harmful convention, like bribing officials. Their theory might still impose a duty to comply conspicuously, but free-riding wouldn’t apply if the scheme is corrupt. If the user agrees there’s no duty here, it supports their view; if not, it’s a problem. Also, cases where locals break norms but visitors can't—how does that align with free-riding? Locals might be seen as renegotiating, which isn’t free-riding.

  Awkward cases include bad conventions or those in flux. If a norm is harmful, does conspicuous compliance still hold? The user might need to concede that other moral considerations override. For flux conventions, the reasonable local expectation helps, but it’s messy. Opting out by announcement—does that dissolve the duty? Probably not, because expectations are social, not individual.

  Concessions: The user should admit that their duty is pro tanto and can be overridden. Also, it’s context-specific, not universal. What survives is the core idea that maintaining social fabric in shared spaces creates obligations, distinct from mere prudence or etiquette.

  Insulation: Using "reasonable local" might help, but it risks circularity. The key is whether the duty can stand without smuggling in harm or fairness. If expectation-maintenance relies on preventing harm to social coordination, it might be inseparable. However, emphasizing the intrinsic value of social stability could keep it distinct. The hard case is when a convention is inefficient but expected—does compliance still matter morally without cooperation? If yes, their view holds; if not, it collapses into free-riding.

  Finally, the fatal flaw test: If the obligation can’t be distinguished from strong expectations without invoking harm/unfairness, the view fails. The user needs to show that maintaining expectations has moral weight per se, perhaps as a precondition for social trust. But if every instance ties back to preventing harm or free-riding, then their account isn’t novel. They must argue that the act of compliance itself, by reinforcing norms, has independent moral significance in sustaining communal life.
answer: |-
  Here's a breakdown of your "expectation-maintenance" account, mapped against your requested vulnerabilities. I'll be straight about where it bites and where it might bleed:

  ### 1. The Invisible Tourist: Fatal Flaw Candidate (or Core Insight?)
  *   **Your View:** No expectation damaged = no duty (e.g., jaywalking at 4am alone, skipping tip at remote diner with no reputational links).
  *   **Why it *Might* Be Fine (Your Insight):** This highlights the *unique* moral object – the *shared expectation itself*. If no shared expectation is jeopardized (because no one observes or the act is truly invisible/isolated), the specific duty tied to *that* convention evaporates. You're not undermining the social fabric *in this instance*. This distinguishes it from duties based on harm/fairness, which might persist (e.g., a duty not to steal even if unseen, based on property rights).
  *   **Why it *Might* Be a Reductio:** Critics argue it severs morality from *rule-following as a practice*. Even invisible non-compliance weakens *your own* disposition to follow the rule when it *does* matter, and erodes the *general* normativity of "rules apply even when inconvenient." It reduces the duty to mere performative signalling, ignoring the *internal* aspect of respecting a community's way of organizing itself. **Verdict:** **High Risk / Core Tension.** This isn't fatal *if* you firmly hold that the *only* moral wrong here *is* damaging the shared expectation/public good of coordination. But it makes your view deeply counterintuitive to those who see inherent value in respecting local rules *as rules*. If you feel a pang of "that's still *wrong*" about the invisible jaywalker, your intuition might clash with your theory.

  ### 2. Collapse Risks: Two Cliffs
  *   **Collapse into Mere Politeness/Etiquette:**
      *   **Risk:** If the *only* reason is "damaging the expectation," and that damage is just causing offense/annoyance, it looks like fancy talk for "don't be rude."
      *   **Defense:** The key difference is the *object* damaged: not just feelings, but the *functional coordination mechanism itself*. Rudeness harms individuals; non-compliance destabilizes a Schelling point that facilitates smooth interaction for *everyone*. It attacks the *public good* of predictable behavior.
      *   **Deciding Feature:** Does the convention solve a genuine coordination problem (queueing, traffic flow, service efficiency)? If yes, collapse avoided. If it's purely symbolic (e.g., specific greeting rituals), collapse is likely. Your view thrives on *functional* conventions.
  *   **Collapse into General Anti-Free-Riding:**
      *   **Risk:** Maintaining the expectation *is* contributing to a cooperative scheme (stable coordination). Non-compliance *is* free-riding on the compliance of others. So why not just call it that?
      *   **Defense:** Your view has unique features: (1) **Conspicuousness:** Free-riding doesn't *require* being seen (secretly cheating works). Your duty *demands* visibility – it's about *signalling* commitment. (2) **Guests License Asymmetry:** Standard free-riding condemns locals too. Your view uniquely *permits* locals to deviate (as re-negotiators). (3) **Source:** The duty stems directly from the *fragility* of the expectation-as-coordination-device, not just fairness in benefiting.
      *   **Deciding Feature:** The Guests License Asymmetry is the strongest bulwark against collapse. If you can defend why locals have "standing" to renegotiate via non-compliance while visitors don't (beyond "it's their place"), you avoid collapse. If locals' non-compliance is *also* free-riding *unless* it's explicitly reformist, collapse is likely.
  *   **Which Collapse is More Likely?** Collapse into anti-free-riding is **more likely**, especially if the conspicuousness requirement weakens under pressure. The asymmetry needs robust justification.

  ### 3. Discriminating Case: Harmful Conventions & Free-Riding
  *   **The Case:** A deeply corrupt, harmful local convention: e.g., *requiring* bribes to officials for basic services. Locals hate it but feel trapped.
  *   **Free-Riding Account:** Complying (paying the bribe) is participating in a harmful, unjust cooperative scheme. *Refusing* to pay might be *avoiding* free-riding on the "benefits" of a corrupt system, or resisting injustice. No duty to comply; perhaps a duty *not* to.
  *   **Your View (Expectation-Maintenance):** The shared expectation exists (bribes are "required"). A visitor's conspicuous non-compliance *does* damage this expectation. Your view *prima facie* suggests a duty to pay the bribe conspicuously to maintain the (harmful) convention! This clashes violently with morality.
  *   **The Test:**
      *   If your intuition is "Visitors *absolutely should not* pay the bribe; damaging *this* expectation is good!" then your view **fails badly** here unless heavily qualified. It produces a morally repugnant result.
      *   If your intuition is "Visitors *still* have a pro tanto duty to comply *conspicuously* (pay) to avoid destabilizing *this specific interaction* or risking worse outcomes for themselves/locals, *but* this is massively overridden by the harm," then your view **survives but is strained**. You must explain why "conspicuous compliance" is even *pro tanto* owed for harmful norms.
  *   **Result:** This strongly discriminates. The Free-Riding account easily condemns compliance. Your account struggles not to demand it. How you handle this reveals much.

  ### 4. Awkward-but-Not-Fatal (Ranked)
  1.  **Bad Conventions (Bribes, Discriminatory Serving):** As above. **Highest Awkwardness.** Requires conceding the duty is *pro tanto* and easily overridden by stronger moral duties (justice, non-harm). Survives only if you bite the bullet that conspicuous compliance *is* initially owed, even here, before being overridden. Painful.
  2.  **Conventions in Flux (Half tip, half don't):** **Moderate Awkwardness.** Your "reasonable local expectation" helps. The duty is to comply with the *dominant or emerging* expectation *as best discerned*. Conspicuous non-compliance might signal support for change, aligning with "renegotiation" if done by locals, but visitors lack standing? Messy. Concede it's context-sensitive and duties weaken/fray during transitions.
  3.  **Visitor-Only Conventions (Tourist Site Queue):** **Low Awkwardness.** The "local expectation" applies to the *space* and its *users*, even if all are visitors *now*. The expectation formed *in that context* (e.g., "here, we queue like this"). Locals might be absent, but the convention exists for the context. Duty holds.
  4.  **Opting-Out by Announcement:** **Low-Moderate Awkwardness.** Saying "I refuse to follow your tipping norm!" **does not discharge the duty.** The duty is to maintain the *shared* expectation *socially*. Loud non-compliance *is* conspicuous non-compliance and *actively damages* the expectation by publicly challenging it. It might even *worsen* the damage by being confrontational. The duty is to *participate in upholding the norm*, not just avoid sneakiness. Announcing refusal is the opposite of compliance.

  ### 5. Concessions a Defender Should Make
  *   The duty is **pro tanto**, not absolute. Overridden by stronger moral claims (justice, preventing harm, basic rights).
  *   It's **context-specific.** Strength depends on the convention's importance for coordination, clarity, and the consequences of breakdown.
  *   "Reasonable Local Expectation" is crucial but **vague.** It requires judgment, not a bright line.
  *   **Conspicuousness has degrees.** Full theatrical compliance isn't needed; reasonable effort to be seen following suffices. Intentional hiding *aggravates* the wrong by attempting to free-ride *and* deceive.
  *   It **doesn't ground all morality.** It's specific to coordination-conventions in shared social spaces.
  *   **What Survives:** The core insight that in functional shared spaces, visitors have a distinct moral obligation (beyond prudence or politeness) grounded in the vulnerability of coordination mechanisms. The Guests License Asymmetry remains a distinctive (if challenging) feature. The focus on conspicuousness as maintaining the public signal survives.

  ### 6. Insulation & The Fatal Flaw Test
  *   **Your Insulation ("pro tanto", "reasonable local"):** Legitimate specification, not evisceration. It defines the *scope* and *strength* of the specific duty you posit. It prevents absurdities (must follow *any* norm blindly). It doesn't remove the core claim.
  *   **The Fatal Flaw Test ("Is it just expectation?")**: **This is the critical attack vector.**
      *   **The Argument:** "Why is damaging a shared expectation *morally wrong* in itself? Isn't the *only reason* it's wrong because it (1) *harms* the efficiency/functioning of the social interaction, causing frustration/delay/cost (a harm), and/or (2) it's *unfair* to those who are complying and bearing the cost of maintaining the expectation (free-riding)? If you remove the *potential for harm* or the *element of unfairness*, does 'damaging the expectation' retain any *moral* force, or is it just 'being surprising' or 'breaking a statistical regularity'?"
      *   **How Close Does It Land? Dangerously Close.** If you cannot articulate a *distinct moral wrong* in damaging the expectation *that isn't reducible to harm or unfairness*, your view collapses into a harm-prevention or anti-free-riding view with extra emphasis on publicity. The "normative glue" just *is* the glue of preventing coordination harms or free-riding.
      *   **Your Potential Defense:** Argue that stable expectations are a *precondition* for certain forms of valuable social agency and trust in shared spaces, and their maintenance has *intrinsic, non-instrumental value* for social existence. Damaging them *directly* degrades the foundational layer of predictable interaction upon which specific harms/benefits and fairness calculations are built. It's an attack on the *social fabric itself* in that context. This is defensible but philosophically heavyweight.
      *   **Verdict:** **High Risk of Collapse.** If you can't firmly establish "damaging the shared expectation" as a *sui generis* moral wrong separable from harm/unfairness consequences in *some* conceivable scenarios (like the Invisible Tourist where no harm/unfairness occurs), the view likely reduces. The Harmful Convention case exacerbates this.

  ### Overall Assessment & Real-World Pattern

  *   **Fatal Flaw Candidates:** 1) **Invisible Tourist** (if your intuition says it's still wrong), 2) **Collapse into Harm/Unfairness** (if you can't defend the normative independence of expectation-damage), 3) **Harmful Conventions** (if your view can't easily explain why compliance isn't owed).
  *   **High Risk / Awkward:** Guests License Asymmetry justification, Conventions in Flux.
  *   **Survivable / Core:** Distinction from mere politeness, Visitor-only conventions, Conspicuousness requirement (qualified), Pro Tanto status.
  *   **Real-World Pattern For:** Look at norms where violation *feels* like a "breach of the peace" or "undermining how we do things here" even when direct harm is minor (e.g., standing on the wrong side of the escalator causing tutting but not real blockage; subtle queue-jumping causing grumbling; minor tipping underpayment sparking disproportionate server resentment). The reaction targets the *breach of norm* itself.
  *   **Real-World Pattern Against:** Look at norms where violation is condemned *only* when it causes tangible harm/unfairness (e.g., jaywalking only when it risks an accident or delays traffic; skipping a tip only if it directly harms the worker or if others reliably cover the shortfall). Here, condemnation tracks harm/fairness, not just norm damage.

  **Straight Answer:** The view is **provocative and captures something real** about the phenomenology of convention-breaking, especially the asymmetry and the focus on conspicuousness. However, it is **not well-insulated** from collapsing into a harm-prevention or anti-free-riding account. The **critical vulnerability** is grounding the *distinct moral wrongness* of damaging the expectation itself, independent of consequences. If you can defend that philosophically, the view survives as an interesting claim about our duty to the social fabric of shared spaces. If not, it's a useful *description* of *why* violations *feel* wrong (because they often *do* cause harm/free-riding), but not a distinct *moral foundation*. The Guests License Asymmetry is your most unique and most vulnerable pillar. Be prepared to fight hardest there or abandon it.
