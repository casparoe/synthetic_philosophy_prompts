prompt: |-
  so, quick context: I write historical fiction. Two novels set in and around a Mainz printing house in the decades after the movable-type thing got going, one set in a Lancashire mill town in the 1820s, and a fourth I keep failing to finish that's about the people who built the first bomb. Somehow this has made me the person who gets invited onto panels about AI. And every single panel, without fail, somebody says "this is just like the printing press," or "it's more like the industrial revolution," or "it's the Manhattan Project, obviously," and everybody nods, and I have never once heard anybody say what would make one of those analogies *bad*. They're unfalsifiable in a really specific way: they're all offered after we know how the story ended.

  So before I say yes to another one of these — write me the spec. Not a list of analogies. The requirements: what a historical analogy for a transformative technology has to do in order to count as any good at all, with the case or consideration behind each requirement. Adequacy is relative to purpose, so here's mine, and it's a weird one, which is sort of the point: I want an analogy good enough to (a) tell me something true about what it's like to be a person inside the change — my unit of interest is a life, not a GDP curve — and also (b) survive being said out loud to someone who funds things or regulates them. Please flag anywhere those two purposes pull apart, because I suspect they do, hard.

  Things I already have opinions about, which you should feel free to demolish or promote into real desiderata:

  - I think an analogy has to come with a *mechanism*, not a resemblance. "Both made information cheap" is a resemblance. What's the causal thing being transferred, and what were its preconditions — and can I check whether the preconditions hold here, now, before the fact? If the only way to check is to wait thirty years, say that, because it matters.
  - I have a private test I use on my own material and I want to know if it's fair: the year-five test. Run the analogy as if you were living five years in, knowing only what was knowable then, not how it turned out. If the analogy only works once you know the ending, it's a narrative device, not evidence. But I worry this test is too strong, since the entire epistemic value of an analogy seems to be that we *do* know the ending — strip that out and maybe there's nothing left. Is that a real tension or am I being stupid?
  - Reference-class shopping. Printing press, steam, electricity, the automobile, the bomb, the stirrup. There are enough big transitions that you can always find one that supports what you already wanted to do, and n is tiny and each case is overdetermined. Does a good theory need to fix the reference class in advance, and if so how, and what does it do about the fact that the sample is small and the surviving record was written by the people who won?
  - Timescale compression. These analogies smuggle in a duration. Printing didn't reorganize European life in a decade; the mill town took generations to produce whatever it produced, and there's a famous argument about whether ordinary workers' material conditions actually improved for the first several decades or got worse first. If the analogy is silent about how long each stage takes and about whether there's a bad part before any good part, it can't be used for anything.
  - The protagonist requirement, which nobody on these panels ever mentions and which I care about most: an analogy should be able to name the person whose life it's about and say what happens to their skill, their income, their standing, and their sense of what they're for. I notice the individual-level story and the aggregate-level story often point opposite directions — the person is ruined for a while and the aggregate is eventually fine, or vice versa. Can one analogy do both, or is that switch forbidden?

  Deliver me:
  1. The requirements, with the motivating case behind each, and for each one a verdict: non-negotiable, or a preference that only one camp insists on. I especially want the ones people *think* are requirements but which are really just taste, and the ones nobody asks for but which are load-bearing.
  2. Any pair (or triple) of requirements you think can't be jointly satisfied. If the honest conclusion is that no analogy can be both genuinely predictive and genuinely checkable-in-advance, I want that stated flatly.
  3. Which single requirement does the most work in ruling out the analogies people actually make. One requirement, and the argument for it.
  4. Then — and keep this short, it's not the part I care about — a table scoring the printing press, the industrial revolution, and nuclear weapons against your list. Three rows. No citations, no further reading, I'm not writing a paper.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a historical fiction writer who's been roped into AI panels and is frustrated with shallow historical analogies. Their core need is to find an analogy that’s robust enough for two purposes: understanding individual human experiences during technological shifts and informing policymakers. 

  First, I need to address their "year-five test." They want an analogy that holds up when you only know the first five years of the technology. That's tricky because most analogies rely on hindsight. I should explore whether this test is too strict or if it's a valid critique of superficial comparisons. Maybe the tension between predictive power and hindsight is inherent, but acknowledging that could be useful for them.

  Next, the "mechanism over resemblance" point. They want causal pathways, not just similarities. For example, saying the printing press made information cheap isn't enough. What were the preconditions, like literacy rates or existing trade routes? If those preconditions aren't present in today's AI context, the analogy fails. This seems crucial for both their purposes, especially for policymakers who need actionable insights.

  Reference-class shopping is another issue. With so few major technological shifts, people cherry-pick examples. The user needs a way to pre-define criteria for selecting analogies. But how? Maybe by focusing on the technology's nature—its disruptiveness to labor, information control, or risk profiles. That could help narrow down relevant cases without bias.

  Timescale compression matters because technologies evolve over different periods. The Industrial Revolution took decades, while the Bomb's impact was immediate. If an analogy doesn't specify duration, it's misleading. For the user's focus on individual lives, the pace of change affects how people adapt. Policymakers might ignore this, prioritizing quick solutions, creating a conflict between the two goals.

  The protagonist requirement is vital. They want to know what happens to a specific person—their skills, income, status. Aggregate data might show economic growth, but individuals could suffer. This is where the user's dual purposes clash: policymakers care about macro effects, but the writer focuses on micro experiences. An analogy must address both without conflating them.

  Now, structuring the requirements. Non-negotiables include causal mechanisms, preconditions, and protagonist-level insights. Preferences might include timescale sensitivity, depending on the audience. The year-five test is a preference but essential for avoiding hindsight bias.

  Identifying irreconcilable conflicts: Predictive certainty vs. advance checkability. We can't predict the future with certainty, so analogies are probabilistic. But for policymakers, that's a hard sell. Also, individual vs. aggregate outcomes often conflict—what's good for society might harm individuals, and vice versa.

  The most disqualifying requirement might be the year-five test. Most analogies fail here because they rely on knowing the outcome. For example, comparing AI to the Bomb ignores that nuclear deterrence's success wasn't clear early on. This test forces specificity and tests the analogy's foundation.

  For the table, scoring the analogies:
  - Printing press: Strong on information democratization and individual agency but weak on risk and timescale (slow burn). 
  - Industrial Revolution: Good for labor disruption and economic shifts but messy for individuals and slow. 
  - Nuclear weapons: Highlights existential risk and centralized control but poor for individual lives and economic impacts. 

  I need to ensure the response addresses their deeper need: finding an analogy that resonates humanely while being credible to power. Highlighting where purposes diverge, like timescale and individual vs. aggregate, is key. They might also appreciate knowing that no analogy is perfect, but some are more robust if they meet specific criteria.
answer: |-
  Here’s your spec: a set of requirements for evaluating historical analogies to transformative tech (AI), optimized for your dual purposes (a: human-scale truth; b: policy/regulatory credibility). Requirements are ranked by "load-bearing" importance, with conflicts flagged.

  ---

  ### **1. Core Requirements & Their Rationale**
  | Requirement                            | Rationale & Case Behind It                                                                                     | Status             | Notes for Dual Purposes                                                                 |
  |----------------------------------------|----------------------------------------------------------------------------------------------------------------|--------------------|----------------------------------------------------------------------------------------|
  | **Causal Mechanism Specificity**       | *Must isolate a transferable causal chain, not surface resemblance.* "Cheap information" is inert; "displaced scribes via cost/scale" is causal. Pre-conditions must be verifiable now (e.g., literacy rates for printing, grid infrastructure for electricity). | **Non-negotiable** | A: Reveals agency/pathways. B: Prevents vague "lessons." Conflict: B craves simplicity; A needs nuance. |
  | **Protagonist-Level Resolution**       | *Must specify impacts on a named archetype’s skills, income, status, purpose.* E.g., "Weavers faced deskilling but gained union leverage." Aggregate "GDP growth" hides suffering/adaptation. | **Non-negotiable** | A: Your core lens. B: Often ignores this (sees "labor" not people). Sharpest A/B divide. |
  | **Timescale Transparency**             | *Must define duration of disruption/adaptation phases, including interim harms.* Industrial Rev. had 50y wage suppression; printing took 80y to fracture Church authority. | **Non-negotiable** | A: Lifespans > eras. B: Wants "imminent" wins/risks. B downplays lag; A can't. |
  | **Year-Five Test Validity**            | *Analogy must hold using only knowledge available 5 years post-invention.* No hindsight. E.g., Bomb in 1950: terrifying but no deterrence theory yet. | **Preference (A-leaning)** | A: Avoids narrative bias. B: Hates uncertainty. Tension: Analogies *use* hindsight—this tests if they’re *predictive*, not just explanatory. |
  | **Reference-Class Justification**      | *Must justify *why* this analogy (not others) fits, based on tech's traits.* E.g., "AI is Bomb-like because it creates existential tail risks" or "press-like because it decouples creation/distribution." | **Non-negotiable** | A/B: Cuts cherry-picking. Sample size is small—own it. "Winners wrote history" is a limit, not a veto. |
  | **Asymmetry Acknowledgment**           | *Must address who wins/loses initially and why.* Printing enriched printers, bankrupted scribes; factories immiserated artisans but birthed capitalists. | **Preference (A-leaning)** | A: Human stakes. B: Prefers "net benefit" framing. Conflict: B fears "alarmism"; A needs truth. |

  ---

  ### **2. Irreconcilable Conflicts**
  - **Predictive Certainty vs. Advance Checkability:** *No analogy can be genuinely predictive with high certainty.* History doesn’t repeat; it offers patterns. Verifiable pre-conditions (Requirement 1) support plausibility, not guarantees.  
  - **Individual vs. Aggregate Outcomes:** *No single analogy can fully serve both.* A protagonist’s ruin (e.g., Luddites) coexists with aggregate progress (e.g., productivity boom). Choose which lens dominates per use-case.  
  - **Year-Five Test vs. Policy Urgency:** B *demands* "actionable" lessons now; Year-Five Test *denies* certainty. Compromise: Use Year-Five to stress-test, not discard, analogies.

  ---

  ### **3. The Most Disqualifying Requirement: Year-Five Test**  
  **Why it rules out common analogies:**  
  - **Printing Press (5y in: ~1455):** "Just another scribal tool." No hint of Reformation, sci-revo, or mass literacy. Fails to predict *any* disruption.  
  - **Industrial Revolution (5y in: ~1785):** "Labor-saving curiosities (Arkwright’s frame)." No concept of factories, urbanization, or class warfare.  
  - **Nuclear Weapons (5y in: 1950):** "Super-bomb; maybe city-killer." No mutual deterrence, arms races, or proliferation risks understood.  
  **Argument for its power:** It exposes *hindsight bias as the core flaw*. If an analogy only "works" knowing the endpoint, it’s a *story*, not a tool for navigating uncertainty. Forces specificity about *early* mechanisms.

  ---

  ### **4. Analogy Scorecard (✅=Strong; ⚠️=Partial; ❌=Weak)**
  | Requirement                     | Printing Press | Industrial Revolution | Nuclear Weapons |
  |---------------------------------|----------------|------------------------|-----------------|
  | Causal Mechanism                | ✅ (Decentralized production) | ✅ (Capital-labor substitution) | ✅ (Deterrence/risk) |
  | Protagonist-Level Resolution    | ✅ (Scribes → Printers) | ✅ (Artisans → Factory workers) | ❌ (Obfuscates individuals) |
  | Timescale Transparency          | ❌ (Centuries-long lag) | ⚠️ (50y+ disruption; interim harms) | ✅ (Immediate existential risk) |
  | Year-Five Test Validity         | ❌ (No disruption visible) | ❌ (No systemic change visible) | ⚠️ (Risk clear, outcomes murky) |
  | Reference-Class Justification   | ✅ (Info democratization) | ✅ (Labor automation) | ✅ (Existential risk) |
  | Asymmetry Acknowledgment        | ✅ (Winners/losers clear) | ✅ (Capital vs. labor) | ⚠️ (State vs. citizens) |

  **Verdicts:**  
  - **Printing Press:** Best for *information democratization* mechanics but fails Year-Five/Timescale. Weak for policy (too slow).  
  - **Industrial Revolution:** Best for *labor disruption* but messy timelines. Use for wage/class impacts—but stress interim harms.  
  - **Nuclear Weapons:** Best for *high-stakes governance* but inhuman scale. Useless for "a life" (A); potent for risk regulation (B).  

  ---

  ### **Key Takeaway for You**  
  **For Panels:** Demand **Causal Mechanism + Protagonist + Timescale**. Reject any analogy that can’t name *who* is affected *how* and *how long* it takes.  
  **For Your Writing:** Lean into the **Year-Five Test**. Your characters don’t know the ending—their uncertainty *is* the truth.  
  **For Funders/Regulators:** Admit the **A/B conflict**: "This analogy illuminates risks to workers (A), but policy (B) must also consider systemic resilience."  
    
  No analogy is perfect—but the best *constrain imagination* without *feigning prophecy*. Your job is to weaponize history’s ambiguity.
