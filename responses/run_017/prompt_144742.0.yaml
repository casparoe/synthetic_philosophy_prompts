answer: |-
  Here’s a quick prep sheet—hope it helps. If your Thursday is anything like my last committee firewalk, keep coffee and a copy of the original plaque text handy. I’ll run through the objections in the order they’ll likely surface, based on who speaks first after your statement. Aim to spend no more than 90 seconds per rebuttal, but lean harder on the last two. Concede early where you can afford to; it disarms them.  

  First, **General Counsel** will cut in before the undergrads can blink. They’ll frame it as contractual risk: *"The 1927 agreement specifies 'permanent naming rights in perpetuity'—if we revoke, we open ourselves to litigation from descendants or even clawback clauses in current gifts. Your 'lapse condition' isn’t legible to a court."* Concede that gift agreements matter—but stress that perpetual naming was contingent on the *honor* being valid, not the money. The plaque’s text is the operative honor, not the cash. If the honor lapses, the naming persists as a label, not a tribute. This keeps the letter of the agreement while voiding its spirit. Soft spot: you’re interpreting "perpetuity" philosophically, not legally. Hold the line that the *honor* is defeasible, not the name itself.  

  **Head of Development** follows, sweating future donations: *"If we 'correct' this, what stops every donor from 1900–1960 getting audited? We’ll hemorrhage funding when heirs pull out."* Concede the anxiety but argue that *not* acting is costlier: the plaque’s false assertion undermines trust. Rebuff the slippery slope—this case is exceptional because the archival proof is unambiguous and the inscription’s claim ("friend of all") is directly contradicted. Offer revision as a *donor-friendly* remedy: keep the name but add context, showing the institution learns. Soft spot: you can’t promise no future audits. Hold that inaction makes us complicit in a lie—that’s worse for fundraising.  

  **Historian of the American South** erupts here, dismissing "presentism": *"You’re judging 1913 by 2024 ethics. Removal erases history; that plaque is evidence of how power worked then. Sandblasting it won’t undo racism—it just launders our past."* Agree fervently that erasure is toxic. Your revision model *preserves* the plaque (move it to archives?) while adding a corrective marker onsite. Stress: the lapse condition isn’t about moral anachronism—it’s about *factual accuracy*. The plaque *asserts* "friend of all seekers," which was *false in 1913* when he got a Black instructor fired. Current evidence doesn’t redefine the past; it exposes a then-contemporary falsehood. This reply must land.  

  **Preservation Architect** sighs: *"Annotating bronze is expensive and ugly. Either remove it intact (my preference) or leave it alone—a footnote on a dorm wall trivializes both history and design."* Concede aesthetics matter. Propose a tasteful adjacent plaque or QR code (their eyes will roll, but it’s pragmatic). Argue that full removal *is* uglier—it looks like censorship. Soft spot: you’re not a designer. Hold that physical revision signals institutional accountability better than deletion.  

  **Undergraduates** snap: *"Why not just rename it? ‘Revision’ is a bureaucratic half-measure. Keeping the name *is* honoring him!"* Here, deploy your asymmetry: statues *perform* honor actively; names decay. But—crucially—concede that the *plaque* still asserts honor. Hence revision. Stress that renaming lets the institution "forget"; annotating forces engagement. Soft spot: they’ll see this as compromise. Hold that decay isn’t absolution—the plaque’s text still "speaks."  

  **City Council Liaison** connects dots: *"If we revise here, the ‘Fix River Street’ campaign will demand we apply the same logic to Col. Davies Avenue. That fight’s even uglier—do you want that?"* Acknowledge the tension but refuse to let off-campus politics dictate on-campus ethics. Distinguish: dorms are pedagogical spaces; streets are public infrastructure. Revision sets a *campus-specific* precedent. Concede you’re not solving their problem.  

  **Virtue Theorist** swoops in late: *"This isn’t about factual assertions—it’s about what perpetuating this man’s name *does* to our character. Will annotation make us more just? Or just more adept at nuance-as-inaction?"* Brutal. Concede that annotation alone isn’t reparative. Argue that *accurate* commemoration cultivates the virtue of truthfulness. Deleting the name fosters forgetfulness; revising fosters vigilance. This ties to your lapse condition: institutions, like people, must correct false claims to be trustworthy. **This is the reply that must survive.** If the revision proposal dies here, the whole argument collapses.  

  **The question you’re dreading (probably from the virtue theorist or a sharp undergrad):**  
  *"If the name’s decayed into a ‘bare label,’ why not *do nothing*? The plaque’s in a dusty corner—nobody reads it. Isn’t your ‘revision’ just performance? And if we *do* act, doesn’t that *reawaken* the honor you say is dormant?"*  
  Here’s your lifeline: The plaque isn’t private—it’s an *institutional* utterance. Even unread, it remains an official statement. Letting a lie stand in our materials is a passive vice. Action isn’t re-honoring; it’s correcting a record. If decay justified inaction, no historical wrong could ever be rectified.  

  ---  
  **Confidence level:** 85%. Counsel, Development, and Historian are locks; Undergrads and Virtue Theorist are predictable. Architect and Liaison wild cards.  
  **Where you’re bluffing:** The decay asymmetry. You’re overplaying how "forgotten" the name is—if it were truly inert, your lapse condition wouldn’t apply. Lean harder on the *plaque’s text* as the active element, not the name. And rehearse that "bare label" question; it’s the tripwire.  

  Ten minutes is tight—prioritize killing the historian’s "erasure" objection and securing the virtue theorist’s grudging nod. And for god’s sake, don’t let Development reframe this as philanthropy hygiene. Good luck.
