prompt: |-
  I am writing the opening chapter of a paper on naturalizing mental content, and before I argue for any account I want the specification. What must a theory of representational content deliver in order to be usable as a working explanatory tool — the sort of tool a cognitive scientist reaches for when she explains a system's behaviour by citing what its internal states represent, in the successes and, more demandingly, in the failures? Take the purpose to be fixed: content as it figures in explanations of what a creature or a trained artificial system does, not content as a metaphysical ornament.

  Write the desiderata, each with the case or consideration that motivates it, and mark which you take to be non-negotiable and which are prejudices of one camp. I want the list to be forced to answer, at minimum: how misrepresentation is possible when nothing in the system registers the mistake; how the grain of a content is settled, so that the answer to whether a detector represents flies, small moving dark things, or food is neither radically indeterminate nor just whatever the theorist happens to find useful; what to say about a state that functions precisely by getting things wrong, because errors of that kind are cheap while errors of the opposite kind are not; whether a state with no consumer — produced but never read by anything downstream — has content at all, and what turns on the answer; whether content can be assigned to a system with no selection history, whose functions come from a designer or a training process, and whether that is the same kind of content as the biological case; and how much of a system's content is in principle readable from the outside by someone who cannot already see what the system is for.

  Then flag any subset of these you suspect cannot be jointly satisfied. My own suspicion is that fixing content by history and making it do present-tense explanatory work pull apart, and that the requirement of genuine error and the requirement of third-person readability pull apart too — say whether either is a real inconsistency or only a tension one camp has dramatized. Finish with a few lines each on how the proper-function family and the covariance-or-information family do against the list; I will fill in the details myself.
reasoning: |-
  Okay, let me tackle this query step by step. The user is writing a paper on naturalizing mental content and needs a rigorous set of desiderata for theories of representational content. They want these criteria to address specific puzzles like misrepresentation, content grain, error-prone states, unused states, and third-party readability. 

  First, I need to identify the core challenges. The user mentions several non-negotiable issues: how a system can misrepresent without internal error detection, how to fix content grain without arbitrariness, and whether designer-assigned functions create "real" content. These seem like the bedrock problems any theory must solve. 

  For the desiderata list, I'll start with the absolute basics. Misrepresentation capability feels essential - if a theory can't explain how a frog's neural state represents "fly" when it's actually a pebble, it fails cognitive science's needs. Grain determinacy is equally crucial; we can't have detectors representing "fly," "food," and "small dark thing" all at once without explanatory collapse. 

  The trickier ones involve tensions. Take the third-person readability requirement versus explanatory potency. If content must be observable by outsiders who don't know the system's purpose, that might clash with how content actually explains behavior in context. Similarly, historical fixation (like evolutionary functions) versus current explanatory role could create friction - what if a mechanism gets repurposed? 

  I suspect the user is hinting at deeper issues in teleosemantics versus informational theories. Teleosemantics handles misrepresentation well via proper functions but struggles with unused states. Covariance theories nail third-party readability but make misrepresentation nearly impossible. Neither fully resolves the grain problem. 

  The "error-prone by design" case is fascinating - it shows how survival value can invert accuracy requirements. This might actually help teleosemantics by anchoring content in biological utility rather than truth. 

  For the conclusion, I'll flag the historical/current-role tension as genuine, but the readability/explanatory-power clash as possibly overstated. A good theory should balance both, perhaps via mechanistic details accessible to observers. 

  The response should mirror the user's academic rigor while leaving room for their own arguments. I'll structure it as numbered desiderata with clear motivations, mark non-negotiables, then analyze tensions and theory performances concisely. The tone must stay technical but avoid jargon - they're clearly well-versed in philosophy of mind.
answer: |-
  Here are the desiderata for a naturalistic theory of representational content, framed for cognitive science explanation, with motivations and critical tensions flagged:

  ### Core Desiderata (Non-Negotiable for Explanatory Use)

  1.  **Misrepresentation/Error-Possibility (Robust):**
      *   **What:** The theory must allow for states to *be wrong* even when the system itself has no internal marker of error or capacity to detect the mismatch.
      *   **Motivation (Failure Cases):** Explaining why a frog snaps at a BB (representing it as edible fly), or why a navigation module steers into a wall (representing clear path), requires contentful states that *mis*represent. Explanation depends on the *contrast* between what's represented and what's actual in failure modes.
      *   **Non-Negotiable:** Essential for behavioral explanation in error-driven learning, illusions, malfunctions.

  2.  **Determinacy of Grain/Content Fixation:**
      *   **What:** The theory must provide principled (non-arbitrary, non-theorist-relative) grounds for settling *what specific content* a state carries (e.g., fly vs. small dark moving thing vs. food).
      *   **Motivation (Explanatory Precision & Generalization):** Explaining why the frog snaps at BBs *but ignores stationary flies* requires content finer than "food"; explaining why it ignores small dark stationary things requires content coarser than "drosophila melanogaster". The "right" grain is crucial for predicting behavior across variations.
      *   **Non-Negotiable:** Without determinacy, content ascription becomes subjective, undermining its scientific/explanatory role.

  3.  **Explanatory Relevance/Power:**
      *   **What:** The content ascribed must figure *causally relevantly* in explaining why the system produces the specific behavior it does *in virtue of* that content.
      *   **Motivation (The "Reach For" Tool):** The cognitive scientist cites content to make sense of the system's *specific* response to its inputs/environmental context. Why did *this* state cause *that* action? The content should be the crucial link.
      *   **Non-Negotiable:** Defines the *purpose* of content in this context – explaining behavior.

  ### Important But Potentially Contentious Desiderata

  4.  **Handling "Useful Errors" (Asymmetric Error Costs):**
      *   **What:** The theory must accommodate states where the *function* involves systematic misrepresentation of one kind (e.g., false positives) because the cost of the opposite error (false negatives) is catastrophically high.
      *   **Motivation (Evolutionary/Adaptive Efficiency):** E.g., a "predator nearby!" detector tuned hypersensitive (often firing when no predator is there) because missing a real predator is fatal. Its content ("predator nearby") explains evasive action, even when wrong. Its *function* relies on getting it wrong safely.
      *   **Status:** Often a challenge; reveals if content is tied to truth-maximization or functional success.

  5.  **Content for "Lone States" (No Downstream Consumer):**
      *   **What:** The theory must specify whether a state produced by a mechanism but *never* used by any other part of the system to guide behavior/computation has representational content.
      *   **Motivation (Internal Architecture & Potential):** Are "debug logs" with no reader contentful? Does a sensory state in a feedforward net pre-activation have content? This tests if content requires a *consumer* interpreting the state or if production alone suffices.
      *   **Status:** Deeply divisive. Answers impact theories of consciousness, modularity, and the minimal unit of content.

  6.  **Origin Neutrality (Biological vs. Artificial/Designed/Trained):**
      *   **What:** The theory must specify if content derived from evolutionary history, deliberate design, or machine learning training is the *same kind* of content, and how the origin affects the content assignment.
      *   **Motivation (Generalizing Cognitive Science):** Can we use the *same* concept of representation for evolved nervous systems, explicitly programmed modules, and trained deep neural nets? Cognitive science needs unified tools.
      *   **Status:** Highly contentious. Some tie content intrinsically to selection history; others focus on current causal/informational structure.

  7.  **Third-Person Accessibility/Readability (At Least Partial):**
      *   **What:** To what extent can an external observer, lacking privileged access to the system's internal purposes or history, *in principle* determine the content of its states based on observable structure, behavior, and environment?
      *   **Motivation (Scientific Practice):** Cognitive scientists *must* assign content from the outside-in. The theory shouldn't require knowing the system's "private intentions" or inaccessible historical details to be applicable.
      *   **Status:** Tension with explanatory depth/historicity. Strong requirement risks shallowness; weak requirement risks inapplicability.

  ### Suspected Tensions Between Desiderata

  *   **History vs. Current Explanatory Role (Likely Genuine Inconsistency):** Fixing content firmly via historical selection/design/training *can* pull apart from explaining the system's *current* behavior. A mechanism might be co-opted for a new function ("exaptation"). A trained net might develop internal representations unforeseen by designers. A theory rigidly tying content to original function may misdescribe the current causal role. Conversely, a purely current-role theory struggles with error and determinacy without history. **This seems a fundamental tension requiring trade-offs or a hybrid account.**
  *   **Genuine Error vs. Third-Person Readability (Tension, Often Dramatized):** Ensuring robust error requires something beyond current covariation (which, taken alone, makes error conceptually hard). This "something extra" is often historical function or normative role. However, history can be opaque to an external observer. Covariation is more readable. **This is a *tension*, not a strict inconsistency.** A good theory should explain *how* an observer *could* access the relevant normative/historical facts (e.g., via reverse engineering function from robust behavior patterns, success conditions, or known design/training goals). It demands more from the observer than just tracking correlations but doesn't necessarily require inaccessible "private" facts.

  ### Brief Performance Against List

  *   **Proper-Function (Teleosemantic) Family (Millikan, Neander, Papineau):**
      *   **Strengths:** Excellent on **Misrepresentation** (malfunction relative to function), **Useful Errors** (asymmetric costs define function), **Origin** (biological case clear, can extend to design/training via derived proper functions). Offers principled (though debated) **Determinacy** (via evolutionary context).
      *   **Weaknesses:** Struggles with **Lone States** (needs a consuming mechanism for function?), **Third-Person Readability** (deep history often inaccessible), **Current Explanatory Role** (potential mismatch with exapted functions). Can be complex.

  *   **Covariance/Informational Family (Dretske, Fodor's asymmetric dependence):**
      *   **Strengths:** Strong on **Third-Person Readability** (track correlations), potentially good on **Origin Neutrality** (structure matters more than history), can handle **Lone States** (production suffices?).
      *   **Weaknesses:** Fundamentally challenged by **Misrepresentation** (covariation struggles with error - "what breaks the covariance?"). **Determinacy/Grain** is notoriously problematic ("disjunction problem"). Weak on **Useful Errors** (systematic false positives look like accurate representation of a disjunction). **Explanatory Relevance** can be thin without linking to function/behavior.

  This framework provides the necessary constraints and highlights the critical fault lines. A successful theory must navigate these desiderata, particularly the core non-negotiables and the history/current-role tension. Good luck with the chapter!
