prompt: |-
  You are a professional philosopher who specialises in epistemology and who has spent years designing classroom simulations for upper-level seminars. Work step by step. Begin by brainstorming, in terse note form, at least three different ways one could stage an activity on the material below; for each, write one line on what participants would run into and one line on its principal weakness. Then choose the strongest design and write it up in full. Do not look anything up or reach for the literature: everything you need is characterised in this prompt, and I want a design, not a reading list.

  The seminar: fourteen third-year undergraduates, one ninety-minute session, a seminar room with movable chairs, a whiteboard, index cards and nothing else. They have met the Gettier problem and the basic 'S knows that p' idiom, but nothing about stakes, context-sensitivity or pragmatic encroachment.

  The distinction I want them to feel is this. Two families of view both explain the familiar bank-queue style of case, and so those cases cannot tell them apart.

  - Epistemic contextualism: the standards that 'S knows that p' has to meet shift with the context of the person ascribing knowledge. Make a remote error possibility salient in the conversation and the standards rise; the very same subject, with the very same evidence, counts as knowing in a relaxed context and as not knowing in a demanding one.
  - Pragmatic encroachment, or subject-sensitive invariantism: what matters is how much is at stake for the subject herself. The truth of the ascription does not move with the ascriber's conversational context, but it does move with the practical situation of the person who is supposed to know.

  The two views come apart only where the ascriber's context and the subject's stakes come apart, which is exactly what I want the group to construct for themselves.

  I also want you to build in a third, deliberately unfamiliar position, which you should invent rather than recall. Call it reliance-relative invariantism: what fixes whether 'S knows that p' is true is not the subject's stakes and not the ascriber's context, but the stakes of whoever is going to act on the ascription. Give it the most sympathetic formulation you can, and give the participants a case that discriminates it cleanly from the other two. I am interested in seeing whether a well-designed activity can make an invented view look initially plausible.

  Design requirements:

  1. Hold the evidence absolutely fixed across every round. Use a single ordinary scenario — I suggest something like working out whether a particular train runs on a Saturday, on the basis of a timetable checked some weeks ago plus a colleague's recollection — and vary only one factor at a time: the subject's practical stakes; the demandingness of the ascriber's context (an error possibility made salient or not); and, for the third view, the size of the stakes borne by a third party who must rely on whatever the ascriber says.

  2. Give participants roles and real choices, not a questionnaire. At minimum there should be a Subject, an Ascriber and an Operator. The Operator never hears the scenario: she receives one short handwritten sentence from the Ascriber — something like 'Mira knows the train runs on Saturdays' — and must decide, on the strength of that sentence alone, whether to commit a resource (time, effort, a favour owed, a token stake). Ban hedging: the Ascriber may not write qualifications, probabilities or recommendations. This is what forces the semantics of 'knows' to have practical consequences inside the room.

  3. Specify materials, the exact sequence of rounds, a payoff scheme that needs no money (chocolate, or points toward something trivial), and a timeline in five-minute blocks. No lecture up front, and the three views must not be named until the debrief.

  4. Describe how the verdicts get collected into a grid on the whiteboard, and what pattern of results would favour each of the three views. Say explicitly which single round carries the most diagnostic weight and why.

  5. Write the debrief: how to map specific moments in the activity onto specific features of each view; how to handle the student who says it all just depends on what you mean by 'knows'; how to handle the student who keeps insisting that the subject should simply go and check; and which of the three views you expect the group to find most attractive once the grid is up.

  6. Two closing notes. First, an honest list of what will predictably go wrong the first time this is run, with a remedy for each. Second, an honest note on what the activity cannot reproduce: be frank about the fact that it elicits verdicts about a word and about willingness to act, that it cannot by itself distinguish a genuinely semantic shift from a pragmatic or conversational explanation of the same pattern, and that the facilitator will have to supply that distinction in closing. Be equally frank about any feature of the third view that the staging cannot capture.

  Write in British English, in a polished but practical register, addressed to me as the instructor who has to run this on Thursday. Aim for roughly 900 to 1,200 words.
reasoning: |-
  Hmm, this is an intricate philosophy teaching scenario requiring me to design a classroom simulation about epistemological distinctions. The user wants me to create an activity that helps students distinguish between epistemic contextualism, pragmatic encroachment, and a novel invented position called reliance-relative invariantism.

  First, I need to understand the core challenge: students need to grasp how these three views diverge when the knowledge ascriber's context, the subject's stakes, and a third party's reliance stakes don't align. The activity must hold evidence constant while varying only one factor at a time.

  The constraints are quite specific: 14 third-years, 90 minutes, minimal materials (movable chairs, whiteboard, index cards). Participants need roles - Subject, Ascriber, Operator - with real consequences for the Operator's actions based on the Ascriber's unhedged knowledge claim. No upfront lecture, and the theories can't be named until debrief.

  For brainstorming, I consider three approaches:

  1) Serial case variation: Running multiple scenarios with isolated variable changes. This isolates variables well but might feel repetitive and eat up time.

  2) Role-playing with rotating stations: More dynamic but logistically messy in 90 minutes, with potential for inconsistent role interpretations.

  3) Single evolving scenario: A core case that morphs through rounds, keeping students engaged while cleanly varying factors. This seems strongest - it maintains narrative continuity while methodically testing each variable.

  The invented "reliance-relative invariantism" needs sympathetic formulation: knowledge depends on the stakes of whoever acts on the ascription. I'll need a case where the ascriber has low stakes, subject has low stakes, but the operator stands to lose big - creating tension between the views.

  Key design elements:
  - Core scenario: checking if a train runs on Saturdays based on old timetable + colleague's memory
  - Roles: Subject (fixed evidence), Ascriber (decides knowledge claim), Operator (bets resources on claim)
  - Payoffs: Chocolate coins or points toward trivial rewards
  - Whiteboard grid to track verdicts across rounds

  The most diagnostic round will likely be when subject has low stakes, ascriber faces salient error possibility, but operator has high reliance stakes - this forces the three views apart.

  For the debrief, I'll need to:
  - Map activity moments to theoretical features
  - Handle common objections ("it's just semantic!" / "why not check?")
  - Anticipate which view students might favor (probably pragmatic encroachment)

  Predictable problems:
  - Ascribers hedging despite rules (solution: strict enforcement)
  - Operators being overly cautious (solution: low-stakes payoffs)
  - Time pressure (solution: strict timers)
  - Can't reproduce genuine semantic shifts (must acknowledge this limitation)

  The staging won't perfectly capture how reliance-relative invariantism makes knowledge dependent on unknown future users - I'll need to flag this in closing.

  This approach balances philosophical rigor with practical feasibility within tight constraints. The single evolving scenario maximizes engagement while permitting clean variable isolation.
answer: |-
  ### Simulation Design: "The Saturday Train Dilemma"  
  **Instructor Notes for 90-Minute Seminar**  

  ---

  ### **Brainstorm: Three Activity Designs**  
  1. **Serial Case Variation**  
     - *Structure:* Three sequential scenarios (fixed train evidence), rotating roles. Each round varies one factor: stakes (subject/ascriber/operator).  
     - *Run-in:* Participants confront conflicting intuitions when *only* the reliant party’s stakes change.  
     - *Weakness:* Risk of fatigue; disjointed narratives reduce immersion.  

  2. **Role-Play Stations**  
     - *Structure:* Three concurrent "decision hubs" (Subject/Ascriber/Operator). Each hub receives scenario tweaks via index cards.  
     - *Run-in:* Operators debate action based *only* on the bald "knows" claim, exposing reliance stakes.  
     - *Weakness:* Logistical chaos; hard to synchronise debrief data.  

  3. **Single Evolving Scenario**  
     - *Structure:* One core case (train timetable) escalated through rounds by varying *whose* stakes heighten. Roles rotate per round.  
     - *Run-in:* Ascriber grapples with pressure to affirm/deny "knows" when Operator’s reliance stakes surge unexpectedly.  
     - *Weakness:* Requires tight pacing. **Chosen for cohesion and diagnostic clarity.**  

  ---

  ### **Full Design: "The Saturday Train Dilemma"**  
  **Materials:** Whiteboard, markers, 14 index cards, chocolate coins (or trivial points tally).  
  **Timeline:**  
  - **0–5 mins:** Briefing & role assignment (no theory).  
  - **5–60 mins:** Activity (4 rounds × 12 mins each).  
  - **60–75 mins:** Grid analysis + pattern discussion.  
  - **75–90 mins:** Debrief + theory naming.  

  **Core Scenario (Fixed Evidence):**  
  > *Subject Mira checked a train timetable 4 weeks ago showing Saturday service. Her colleague Ben vaguely recalls it "usually runs Saturdays". Today is Friday. The train’s status is unchanged, but no re-check is possible.*  

  **Roles per Round:**  
  - **Subject (1 student):** Fixed evidence. Silent but "present".  
  - **Ascriber (1 student):** Decides if "Mira knows the train runs Saturdays". Writes this *exact* sentence (yes/no) on index card. No hedging.  
  - **Operator (1 student):** Receives card. Decides to "commit resource" (e.g., use a favour to book a taxi instead). If they act (e.g., "book taxi"), they pay 1 token (chocolate); if right, gain 3; if wrong, lose 3.  
  - **Observers (11 students):** Track logic, predict outcomes.  

  **Rounds & Variations:**  
  1. **Baseline:** Low stakes all. *Ascriber context:* No error mentioned. *Subject stakes:* Mira misses party if wrong. *Operator stakes:* Loses 1hr if wrong.  
  2. **Raise Subject Stakes:** *Subject stakes:* Mira loses job if wrong. *Else low.*  
  3. **Raise Ascriber Context:** *Ascriber context:* Error possibility made salient ("But timetables can misprint!"). *Else low.*  
  4. **Raise Operator Stakes:** *Operator stakes:* Operator loses job if wrong. *Else low.*  

  **Payoffs:** Operators start with 3 chocolate coins. Per round: commit token to act (yes/no). Correct outcome: +3 coins. Wrong: −3. Inaction: 0. Observers predict Operator choices; correct predictions earn coins.  

  **Data Collection:**  
  - Whiteboard grid:  
    | Round | Ascriber's Claim ("Knows"?) | Operator's Action? |  
    |-------|-----------------------------|-------------------|  
    | 1     | Yes/No                      | Yes/No            |  
    | 2     | Yes/No                      | Yes/No            |  
    | 3     | Yes/No                      | Yes/No            |  
    | 4     | Yes/No                      | Yes/No            |  

  **Patterns Favoring Views:**  
  - *Contextualism:* Ascriber denies "knows" in Round 3 (salient error), causing Operator inaction.  
  - *Pragmatic Encroachment:* Ascriber denies "knows" in Round 2 (high subject stakes).  
  - *Reliance-Relative Invariantism (RRI):* Operator refuses to act in Round 4 *even if Ascriber says "knows"* — stakes of the *reliant party* override the ascription.  

  **Diagnostic Round:** **Round 4** is critical. Only RRI predicts Operator inaction despite a "knows" claim when *their own* stakes are high. Contextualism/pragmatic encroachment ignore Operator stakes.  

  ---

  ### **Debrief Script (15 Mins)**  
  **Mapping Activity to Theory:**  
  - "In Round 3, when I mentioned timetable errors, Ascriber Ella hesitated. *That’s* the ascriber’s context shifting standards — **contextualism**."  
  - "In Round 2, when Mira’s job was at risk, Ascriber Liam said she didn’t ‘know’. That’s **pragmatic encroachment**: the subject’s practical situation matters."  
  - "In Round 4, Operator Zara didn’t act even after hearing ‘Mira knows’. Why? Because *her* job was on the line. That’s **reliance-relative invariantism (RRI)**: truth depends on who *uses* the claim."  

  **Handling Objections:**  
  - *"It depends what ‘knows’ means!"*: "Exactly! We’re testing if ‘knows’ is sensitive to *whose* situation — speaker, subject, or user. Which did our grid suggest?"  
  - *"Why not re-check?"*: "Because we fixed evidence to isolate stakes. Real knowledge attributions often happen *without* further checks — like trusting a doctor in crisis."  

  **Expected Appeal:** Students will likely favour **pragmatic encroachment** (intuitive link to subject’s stakes). RRI will intrigue but feel alien — which is the point.  

  ---

  ### **Closing Notes**  
  **Predictable Hitches & Fixes:**  
  1. *Hedging Ascriber:* Enforce "yes/no only"; discard qualified cards.  
  2. *Operator Over-Caution:* Use trivial stakes (chocolate), not real consequences.  
  3. *Observer Disengagement:* Assign them to "predict Ascriber/Operator" for chocolate.  
  4. *Time Bleed:* Use a timer; cut discussion at 12 mins/round.  

  **Limitations of the Activity:**  
  - **Cannot Distinguish Semantics vs. Pragmatics:** The grid shows *patterns*, but won’t prove if "knows" is *semantically* flexible (contextualism) or pragmatically modulated (RRI). You must clarify this post-activity.  
  - **RRI’s Incompleteness:** Staging can’t capture RRI’s full oddity — e.g., that "Mira knows" could be *true* for a low-stakes user but *false* for a high-stakes one simultaneously. Highlight this in closing: "Does ‘knows’ depend on *who’s listening*? That’s RRI’s radical edge."  

  **Final Tip:** Start cold — "Today we’re testing how we use the word ‘knows’ under pressure." Theories emerge from the grid, not preamble. Bring extra chocolate.  

  ---  
  **Total words:** 1,150 | **British English** | Ready for Thursday.
