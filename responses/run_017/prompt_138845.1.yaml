  1.  Epiphenomenalism: The experience is a value defined in SSA form by a pure function of neural state variables, but it is a sink node with no outgoing dataflow edges—dead code that survives elimination only because it lacks an explicit output annotation, and its computed value has no effect on any subsequent state or observable output.  
     *Confident*

  2.  Report reliability: The report of the experience is a separate value produced by an impure effect (e.g., a monadic action) that reads the same neural state variables; its accuracy arises because both the experience and the report are pure functions of that shared state, but no dataflow path exists from the experience's definition to the report's computation.  
     *Confident*

  3.  Captured: The structural disconnect between computation and use—the experience is computed but unused, while the report is used but not causally dependent on the experience—and the reliability as a correlation via common input, exposing the tension when the report's content references an isolated value.  
     *Confident*

  4.  Failed: The intentional "aboutness" linking report to experience—why the report's content semantically targets the experience rather than just the neural state—and the modal counterfactual (if experience differed but neural state didn't, report would still be "accurate"), because the vocabulary lacks semantics for content and cannot encode non-actual dependencies without ad hoc extensions.  
     *Confident*

  5.  Verdict: The residue is a blind spot in the vocabulary (no semantics for intentional content or counterfactuals), not a flaw in the claim; least confident whether epiphenomenalism genuinely avoids smuggling in causal efficacy for experience under "aboutness" when challenged on knowledge.  
     *Tentative*
