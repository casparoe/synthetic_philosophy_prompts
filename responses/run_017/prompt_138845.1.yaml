  We are going to map the philosophical position of epiphenomenalism about consciousness and the puzzle about reliable reports into a computational graph and effect system framework.

  The key elements:
  - Consciousness (experience) is produced by neural processes (computation) but has no causal effects downstream (no influence on any other computations or outputs).
  - The puzzle: We have a reliable report (e.g., "I see a red rectangle") that is about the experience. If the experience itself causes nothing, then it seems the report is not caused by the experience. This makes the reliability of the report (its accuracy) mysterious.

  We consider two candidate encodings:

  Candidate 1: Experience as a sink node (a node with no outgoing edges, i.e., no successors). 
  - The experience is computed (so it is produced by some computation) but it doesn't connect to any other node. Thus, it cannot affect anything else.

  Candidate 2: Experience as a node whose outgoing edges are declared irrelevant to the observable output (via an effect system).
  - The node exists and might have outgoing edges, but we mark it as having no effect on the observable output (e.g., via an effect system that says it has no observable effect). This is similar to dead code in the sense that it is computed but its result is not used for the output.

  However, the problem states that the report is about the experience and is reliable. We have two nodes: one for the experience and one for the report. The puzzle is that the report is accurate (it matches the experience) but the experience doesn't cause the report.

  We must also represent the report's reliability. The report is produced by the brain and is accurate about the experience. How?

  In the computational graph:
  - There is a neural process (node or subgraph) that produces the experience.
  - There is a neural process (node or subgraph) that produces the report.

  The epiphenomenalist says: the experience node has no outgoing edges (or they are irrelevant) so it doesn't cause the report.

  But then why is the report accurate? The accuracy implies that the report node outputs a value that matches the experience.

  We can think of two possibilities for the report's accuracy:
  1. The report is caused by the same neural processes that cause the experience (but not by the experience itself). So if the neural processes are reliable, they produce both the experience and the report in a coordinated way.
  2. The report is caused by something else, but by chance it matches.

  The puzzle is that if the experience has no causal power, then the report is not caused by the experience, so why does it match? The epiphenomenalist must say that the report is caused by the neural processes that also cause the experience, so they are both effects of a common cause. That common cause is the neural activity.

  Thus, we can represent:
  - The experience node is a sink (candidate 1) or its effects are irrelevant (candidate 2). We choose candidate 1 for simplicity: a sink node.
  - The report node is produced by the same neural processes (the common cause) that produce the experience.

  But note: the report is about the experience. How do we represent the "aboutness"? This is a key point.

  In our model, the report is a node that outputs a string (or a belief) that describes the experience. The experience is a node that outputs a qualitative state (say, a representation of a red rectangle). The common cause (neural process) produces both the experience and the report. Because the neural process is structured appropriately, the report accurately describes the experience.

  However, the experience node is a sink: it has no outgoing edges. The report node does have outgoing edges (it leads to behavior, for instance). But the experience does not.

  But wait: the puzzle is that the report is reliable because it is about the experience. But in this model, the report is not connected to the experience. It is connected to the common cause. So the report is about the experience only in the sense that the common cause produces both, and the report is designed (by evolution or whatever) to match the experience.

  But the epiphenomenalist can say that the report is not caused by the experience, but by the neural state that causes the experience. So the report is about the experience because it is caused by a neural state that is also the cause of the experience. The reliability comes from the fact that the same neural state that causes the experience also causes the report to be about that experience.

  But note: the experience itself is a distinct node. The common cause (neural state) causes both the experience node and the report node. The report node then produces an output (a statement) that is accurate about the experience because the common cause is the same.

  So in graph terms:

  - Let N be a node (or subgraph) representing the neural process that is the common cause.
  - N has two outgoing edges: one to E (the experience node) and one to R (the report node).
  - E is a sink (no outgoing edges).
  - R has outgoing edges to behavior (so it has effects).

  The report R is accurate if the value at R (the report content) matches the value at E (the experience). Since both are caused by N, and if N is set up so that it consistently produces matching pairs, then the report is reliable.

  But note: the puzzle says that the report is about the experience. In this model, the report is not directly connected to the experience. It is connected to N. So the report does not "know" about the experience. It is just that N causes both, and they match.

  The puzzle is that if the experience has no causal power, then the report is not caused by the experience, so it cannot be guided by the experience. But in the model above, it is guided by N, which is the same as the cause of the experience.

  The epiphenomenalist might say: the report is about the experience because the report is caused by a neural state that is of the type that normally produces that experience. But the experience itself is not doing any work.

  So we can use candidate 1 (sink node) for E.

  Now, candidate 2: we could mark E as having no effect on the output (via an effect system). That would be similar to dead code. But dead code is code that is computed but its result is not used. However, in this case, the report is about E, so in some sense the report uses E? But the epiphenomenalist denies that the report uses E. The report uses N.

  So candidate 1 (sink) seems more straightforward.

  But note: the experience E is computed. So it is a node that is part of the graph, but it has no outgoing edges.

  Now, the report's reliability: we can say that the report R is accurate because the same neural process N that causes E also causes R to have a content that matches E. So we can represent the reliability by the fact that the function from N to R and from N to E are such that for every N that would cause a particular E, it also causes a particular R that describes E correctly.

  But note: the report is about E, but it is caused by N. So the accuracy condition is that the value of R (the report) must match the value of E. This is a constraint on the functions implemented by the edges from N to R and from N to E.

  Now, the puzzle is that the epiphenomenalist cannot appeal to E to explain the accuracy of R because E causes nothing. But in the model, we don't appeal to E to explain R. We appeal to N. So the accuracy is explained by the common cause.

  The philosophical puzzle is that it seems we have knowledge of our experiences. But if the report is not caused by the experience, then how can we have knowledge? The epiphenomenalist must say that our knowledge (the report) is caused by the neural state, and the neural state also causes the experience, so we are in fact having an experience when we report it. But the report is not caused by the experience itself.

  The puzzle also notes that if the experience had been different (say, green instead of red) but the neural state N had been the same, then the report would still say red. But the experience would be green. So the report would be wrong. But the epiphenomenalist must say: that scenario is impossible because the experience is determined by N. So if N is the same, then the experience is the same. Therefore, the report is always accurate.

  But what if we consider a possible world where the same neural state N produces a different experience? The epiphenomenalist might say that is not possible because the experience is determined by N. But the epiphenomenalist also says that the experience has no causal role. So in that possible world, if the experience were different, it wouldn't affect the report because the report is caused by N, which is the same. So the report would be inaccurate. But then how do we know that our world isn't like that? The epiphenomenalist must say that in our world, the same N always produces the same E and the same R, and they match. But we cannot have evidence that they match because any evidence we could have (like our reports) would be caused by N, not by E. So we cannot know that our reports are accurate.

  This is the crux.

  In our computational model, we are representing the actual world. We are not representing modal claims. We can represent that in the actual graph, the function from N to E and from N to R are such that R matches E. But we cannot represent, in the graph, the modal fact that if E were different while N were the same, then R would not change. But that modal fact is what leads to the skeptical worry.

  However, we are limited to the actual graph and the effect system. We can note that the graph does not have an edge from E to R. So if we were to change E without changing N (which may be impossible because N causes E) then R would remain the same. But we cannot change E without changing N? Because N is the cause of E. So the graph structure does not allow that.

  But the worry is about the dependence: the report R does not depend on E. It depends only on N. So if E were to change without N changing, then R would not change. But the epiphenomenalist says that E cannot change without N changing because N causes E. So the dependence is one-way: E depends on N, R depends on N, but E does not affect R.

  So in our graph, we have:

  N -> E (and E is a sink)
  N -> R -> ... (output)

  The experience E is not on any path to the output. So it is not used in the computation of the output. The report R is on the path to the output.

  The reliability of the report is due to the fact that the same N produces both E and R, and in the actual world, the function from N to E and from N to R are such that R correctly describes E.

  But the puzzle is that we cannot have knowledge of E because there is no causal connection from E to our report. The report is only about the neural state N. But we take the report to be about E.

