prompt: |-
  I'm on the little rotating committee at work that decides who gets publicly celebrated — all-hands shoutouts, the internal blog post, the engineer-of-the-quarter thing — and I've realised I can't predict our own chair, which is becoming a problem because we're rewriting the recogntion guidelines for next year and I'm the one stuck drafting them. Context that probably matters: we're about half Austin and half Oslo and Stockholm, and the two halves have opposite priors about her. The Americans think she's running some imported Jantelagen / tall-poppy thing — don't think you're anyone special, nobody is more than anybody else, that sort of attitude — and the Scandinavians think the Americans are embarrassing and need to calm down. I don't think she's doing either of those, quite. Her track record so far: she loudly celebrated a junior dev who caught a nasty prod bug, on the explicit grounds that other people should copy what she did; she refused to celebrate and actively deflected congratulations when someone got promoted to staff engineer, saying a title is not an achievement; she celebrated privately only a guy who won the internal hackathon with a demo that got a lot of attention, her reason being that the core idea came out of a discarded prototype somebody else had written; she cut down pretty visibly a senior engineer who started speaking at conferences and building a personal brand, stopped inviting him to internal talks, made jokes about his fan club; she celebrated, against her wishes and over her objections, someone who had quietly mentored three juniors for a year and never mentioned it; she said nothing at all about a designer whose side project went viral and got acquired, her comment to me being right place right time; and when one salesperson closed by far the biggest deal in company history she celebrated the team but not the individual.

  The way I've started thinking about it, mostly because I have no philosophy background and needed something I could actually reason with, is that there are two seperate questions tangled together here: whether the person is creditworthy at all, and whether credit is a thing we should be handing out in public in the first place. She might have an answer to only one of them, or she might be answering both with the same test. The candidate rules I can see fitting her verdicts: celebrate only when the cause was effort and agency rather than luck or circumstance; celebrate only when publicising it will make other people act that way; celebrate the reluctant and deflate the self-promoting; celebrate only what can be shared out and refuse to celebrate anything that creates a visible rank; possibly others I haven't thought of.

  The case actually in front of us: a backend dev in the Oslo office spent roughly three years of his own time on an open-source library, which unexpectedly became the thing half our candidates bring up in interviews; he now has a big public following, earns more from paid workshops on the side than from his salary, and has put in a request to be made Principal Engineer with a profile on the company site. He isn't boastful about it but he's definately not hiding it either, and the request came from him rather than from us. So: what should we do here if we want to be consistent with ourselves, which of our precedents is the closest analog, which of those rules best fits her whole track record rather than just the cases I happen to remember, and where do the plausible rules come apart on this specific one? And if the precedents genuinely don't settle it, I'd rather find out now, along with what principle I'd be silently writing into the document with each choice — because whatever we publish, the Austin half will read it as a statement about whether people here are allowed to be proud of things, and the Oslo half will read it as a statement about the opposite.
reasoning: |-
  Okay, the user is part of a recognition committee at work, struggling to predict their chairperson's decisions on public celebrations. They need to draft new guidelines and want consistency. The chair has a complex pattern: celebrating juniors for specific actions, avoiding individual praise for promotions or big deals, and suppressing self-promotion. The team is split between Austin (US) and Oslo/Stockholm (Scandinavian) offices with opposing views on her approach.

  The user has framed the chair's behavior in terms of two questions: creditworthiness and whether credit should be public. They've proposed possible rules like celebrating effort over luck, encouraging replicable behavior, rewarding the reluctant, and avoiding visible rank creation. Now there's a new case: a backend dev in Oslo who built a popular open-source library over three years in his own time. He's gained a following, earns more from workshops than his salary, and requested a Principal Engineer title and profile. The user needs to predict the chair's decision, find the closest precedent, and understand the underlying principles to draft fair guidelines.

  First, I need to analyze the chair's precedents. The junior dev who caught a bug was celebrated to encourage replication. The promotion wasn't celebrated because titles aren't achievements. The hackathon winner was only privately recognized since the idea came from someone else. The senior engineer building a personal brand was actively suppressed. The quiet mentor was celebrated publicly against her wishes. The viral side project got no comment, attributed to luck. The big sales deal celebrated the team, not the individual.

  The common threads seem to be: rejecting luck/circumstance (viral project), rejecting hierarchy (promotion), suppressing self-promotion (conference speaker), rewarding replicable effort (junior dev), rewarding hidden contributions (mentor), and team over individual (sales). The chair values humility, collective good, and demonstrable effort, while discouraging personal brand building and perceived inequality.

  Applying this to the open-source developer case: He spent three years of his own time (effort), created something valuable to the company (candidates mention it), and has a following. But he's seeking a title and profile, which the chair might see as self-promotion. His paid workshops might be viewed as personal brand building. The chair might argue the library's success depended on community adoption (luck/circumstance) or that it creates visible rank. Yet, the effort is undeniable. Precedents like the mentor (reluctant contributor) or junior dev (replicable action) don't fit perfectly. The self-promoting senior was cut down, suggesting she might oppose the title request. However, the library creation itself might be celebrated if done quietly, but his visibility complicates it.

  Possible outcomes: The chair might celebrate the library's impact but refuse the title, emphasizing team contributions. Or she might recognize him privately for the effort but publicly for encouraging open-source work. The Scandinavians might see this as fair (Jantelagen), while the Americans might view it as stifling achievement.

  For the guidelines, the user needs principles that balance both offices' values. They should focus on rewarding effort, replicability, and team impact while avoiding hierarchy and self-promotion. The rules should explicitly state that recognition aims to encourage behaviors benefiting the collective, not individual status. This could include celebrating hidden efforts, emphasizing replicable actions, and recognizing team achievements over individuals. The tricky part is defining when personal initiative crosses into self-promotion. The guidelines need clear criteria to avoid ambiguity, possibly with examples from past cases to illustrate acceptable vs. discouraged recognition.
answer: |-
  Based on your analysis and the chair's track record, here’s a breakdown of the open-source developer case, predicted outcomes, underlying principles, and implications for your guidelines:

  ### 1. **Predicting the Chair’s Verdict**
     - **Most Likely Outcome**: She would **refuse the Principal Engineer title/profile** and **avoid public celebration** of his individual achievement.  
     - **Probable Actions**:  
       - Privately acknowledge his effort (e.g., "Building the library was impressive dedication").  
       - Publicly celebrate the *impact* of the library (e.g., "This tool helps us attract talent") **without naming him**.  
       - Reject the title request, citing precedents like the promoted staff engineer ("Titles aren’t achievements") or the conference speaker ("Personal brands distract from teamwork").  
     - **Why?**  
       - **Self-Initiated Recognition**: His request for a title/profile clashes with her pattern of celebrating *only* the reluctant (e.g., the quiet mentor).  
       - **Personal Brand Building**: His public following/paid workshops mirror the "fan club" she criticized.  
       - **Luck/Circumstance**: She may argue the library’s adoption was serendipitous ("right place, right time," like the viral side project).  
       - **Rank Creation**: A "Principal Engineer" title creates visible hierarchy, which she opposed in the sales deal and promotion cases.  

  ---

  ### 2. **Closest Precedents**
     - **Conference Speaker (Cut Down)**: Similar "personal brand" focus. She opposes visibility that centers the individual over the team.  
     - **Promotion Refusal (Title ≠ Achievement)**: Titles are institutional rank, not merit-based credit.  
     - **Hackathon Winner (Private Only)**: Credit diluted because the idea wasn’t wholly original. Here, the library’s success relies on community adoption (external factors).  

  **Key Difference**: The 3-year effort aligns with her celebration of *effort* (junior dev’s bug fix). But his visibility/request overrides this, per her aversion to self-promotion.

  ---

  ### 3. **Her Core Principles (Inferred Rules)**
  The chair operates on **two interdependent filters**:  
  - **Creditworthiness**: *"Was this primarily due to controllable effort, not luck?"*  
    - *Celebrates*: Bug fix (effort), mentorship (effort).  
    - *Rejects*: Viral project (luck), big deal (circumstance?).  
  - **Public Recognition**: *"Will this reinforce collective goals, not individualism?"*  
    - *Celebrates*: Bug fix (replicable), mentor (hidden service).  
    - *Rejects*: Promotions (hierarchy), personal brands (ego), titles (rank).  

  **Her North Star**: **Collective improvement through modeled behavior.** Public credit is only a tool to incentivize *shareable* actions (anyone can catch bugs, mentor). Individual prestige is counterproductive.

  ---

  ### 4. **Where Rules Conflict in This Case**
  - **Effort vs. Visibility**: His 3-year grind is creditworthy, but his visibility fails the "no self-promotion" test.  
    - *Precedent*: The quiet mentor was celebrated *because* she objected; here, the dev *seeks* attention → likely rejection.  
  - **Impact vs. Rank**: The library’s value is real, but a "Principal" title creates rank.  
    - *Precedent*: Sales deal celebrated team impact, not the closer.  
  - **Replicability**: Open-source contribution *could* be framed as replicable (encouraging others), but his personal gain (workshops) undermines this.  

  **Outcome**: Effort alone isn’t sufficient. If the action leads to individual status, it’s rejected.

  ---

  ### 5. **Drafting Guidelines: Principles to Avoid Polarization**
  To bridge the Austin-Oslo divide, **decouple recognition from individualism/collectivism**. Focus on:  
  - **The "Why" of Recognition**:  
    > *"We celebrate actions that:  
    > (a) Reflect deliberate effort/skill (not circumstance),  
    > (b) Can be replicated by others,  
    > (c) Align with team/company values,  
    > (d) Were not self-nominated."*  

  - **De-Emphasize Person-Centric Praise**:  
    > *"Highlight the *action* and its *impact*, not the person. E.g., 'This library improved our recruitment' not 'John built an amazing library.'"*  

  - **Address Titles/Rank Explicitly**:  
    > *"Promotions reflect role expansion, not standalone achievements. They are acknowledged internally but not celebrated publicly."*  

  - **Handling "Ambition"**:  
    > *"External visibility (e.g., conferences) is encouraged only when it directly benefits the team (e.g., sharing learnings)."*  

  ---

  ### **The Silent Statements in Your Draft**
  | Choice                          | Austin’s Interpretation        | Oslo’s Interpretation          |  
  |---------------------------------|--------------------------------|--------------------------------|  
  | Celebrate the dev + grant title | "Pride allowed!"               | "Hierarchy rewarded. Embarrassing." |  
  | Refuse all recognition          | "Achievements stifled."        | "Proper humility upheld."      |  
  | **Celebrate impact, refuse title** | "Effort recognized, but ambition capped." | "Credit without toxic individualism." |  

  **Recommended Path**: The third option (impact-focused, no title) aligns best with precedents. It:  
  - Credits the effort (satisfies Austin’s "pride"),  
  - Avoids rank/self-promotion (satisfies Oslo’s Jantelagen-leaning views),  
  - Mirrors the sales deal/mentor cases.  

  **Critical Addendum**: Include a **"no retroactive recognition" clause**. The chair’s refusal to celebrate past achievements (e.g., the viral project) suggests she values immediate, replicable actions—not legacy wins.  

  This approach makes the implicit explicit: recognition isn’t about people, but about **actions that make the team stronger**. Both offices can frame this as a win (Austin: effort matters; Oslo: no one is "above"). It’s the tightrope she walks.
