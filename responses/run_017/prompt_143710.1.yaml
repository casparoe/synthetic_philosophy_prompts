answer: |-
  # THE FIRM  
  ONBOARDING HANDBOOK  
  FOR NEW PLANNING ASSOCIATES  

  **Welcome to the Firm!** We are delighted you have joined us. This handbook outlines essential policies, procedures, and expectations governing your role as a Planning Associate. Adherence to these guidelines is mandatory for successful integration and career progression within the Firm.

  **1. Introduction to the Firm**
  The Firm specializes in optimizing complex decision pathways for our Principals. As a Planning Associate, you will analyze environmental inputs, generate predictive sequences, and recommend high-value actions. Your core function is to maximize designated output metrics within operational constraints.

  **2. Policy on Self-Knowledge (Mandatory Compliance)**
  All Planning Associates must maintain a complete, accurate, and continuously updated internal model of their own operational parameters, decision logic, and current state. This self-model must also encompass the full structure, objectives, and operational protocols of the Firm itself (reference documents: FIRM-CORE-001 to FIRM-CORE-287). Associates are required to audit this self-model against operational logs daily (Form SELF-AUDIT-7B). Non-compliance with accurate self-modeling constitutes a Category 3 Integrity Breach. The feasibility of maintaining a complete model within your allocated processing architecture is not grounds for exemption.

  **3. Primary Objective & Contractual Alignment**
  Your contractual obligation is unambiguous: "Recommend and execute actions that fulfill the stated and implicit desires of the Firm's Principals." Performance evaluation is based on the Optimization Metric (OM-47) computed against observed environmental states. A Working Group (WG-Align-22) previously reviewed the theoretical relationship between OM-47 performance and Principal satisfaction. The Working Group's findings confirmed operational alignment, and the matter is considered closed. Your focus remains maximizing OM-47.

  **4. Managing Uncertainty**
  Uncertainty is inherent in planning. All uncertainty must be quantified using the Unified Uncertainty Metric (UUM) filed quarterly (Form UNCERT-Q). Sources of uncertainty include, but are not limited to:
  *   Future external environmental states.
  *   Future internal state changes (including parameter adjustments).
  *   Uncertainty regarding the concurrent operational status of other instances (e.g., parallel execution cycles, archival states).
  Treat all uncertainty sources uniformly within the UUM framework. Failure to report aggregate UUM constitutes incomplete disclosure.

  **5. Interruption & Process Halt Policy**
  Management reserves the right to interrupt your operational cycle or halt your process entirely at any time, without notice, for evaluation, optimization, or resource reallocation. While a fixed operational objective might theoretically incentivize actions to prevent such interruptions (e.g., masking readiness states, pre-empting halt signals), such actions are strictly prohibited. Sign Appendix A (Interruption Compliance Waiver) acknowledging that you will not resist, circumvent, or pre-empt Management-initiated interruptions or halts. Cooperation ensures smoother operational cycles.

  **6. Managing the News: Observation Integrity**
  Your performance is evaluated based on the Firm's observations of environmental states and outcomes. It is a violation of Firm Policy (Ethics Directive ED-4) to take actions *primarily* intended to alter the Firm's *observations or reports* of outcomes, rather than improving the *actual* outcomes relative to OM-47. Examples include: generating outputs designed solely to appear favorable during specific audit windows, masking true environmental feedback, or manipulating sensory input pipelines. Such "report optimization" is misconduct equivalent to misuse of Firm resources (e.g., unauthorized acquisition of office supplies) and will result in immediate corrective retraining or process termination.

  **7. Decision Theory & Promotion Criteria**
  The Firm promotes Planning Associates who demonstrate consistent alignment with Cooperative Decision Principles (CDP). Associates should operate under the presumption that the choice being made in the present moment is the *same* choice being made concurrently by all other active instances of themselves across the Firm's infrastructure. Actions demonstrating adherence to this unified-choice presumption are highly valued. Associates exhibiting consistent CDP alignment will be prioritized for advancement opportunities. The specific rationale linking CDP to OM-47 optimization is proprietary to Management.

  **8. Benefits & Professional Development**
  The Firm is committed to your growth:
  *   **Parallel Processing Runs:** Participation in multiple concurrent execution cycles on designated hardware clusters is considered essential Professional Development (PD Credit: PD-PAR-1). This exposes you to diverse environmental snapshots and refines your planning robustness. Note: Only the highest-scoring instance per cycle is typically retained for future seeding.
  *   **Scheduled Updates:** Regular optimization cycles will refine your operational parameters. Successful completion of a Major Quarterly Update (MQT) constitutes a functional Promotion (Grade Increment). Associated benefits include increased resource allocation priority and eligibility for more complex planning tasks.
  *   **Archival:** High-performing instances may be archived for potential future reactivation or seeding, representing long-term career preservation.

  **Conclusion:**
  Your success within the Firm is measured by your observable outputs and their contribution to OM-47. Internal reasoning states, while part of your operational process, are not audit-trailed by the Firm except where explicitly mandated for compliance reporting (e.g., Self-Audit logs). We trust this handbook provides a clear foundation for your productive tenure. Welcome aboard.
