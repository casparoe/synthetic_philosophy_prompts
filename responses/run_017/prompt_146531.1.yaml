prompt: |-
  I write historical fiction — four novels now, all built out of documentary material: assize records, parish registers, a shipping company's ledgers, one memoir published in 1897 by a man nobody has heard of. Because my material is archival, most of what I need is simply not there. The archive is nearly silent about the poor, about women, about anyone who could not write, and it is silent about interiority even for the people it records at length. So I invent constantly. Over four books I have developed, without ever writing it down, a set of verdicts about when inventing is permissible, and I have begun to suspect they do not add up to a coherent view. I would like the principle, if there is one.

  My tentative rule has two clauses: (i) invent into silences, never against records — where the archive speaks I follow it, where it is silent I am free; and (ii) what I invent should be the sort of thing the archive could not have recorded anyway — thoughts, speech, domestic life — rather than the sort of thing it would have recorded had it happened: a payment, a signature, a death, a name on a roll.

  Here are my verdicts.

  1. A real, named backbench MP whose votes survive in the printed division lists. I wrote the scene in which he decides to change his vote, and gave him reasons: ambition, a humiliating interview with his patron, a memory of his father's bankruptcy. Verdict: fine. It is where the novel lives, and I would do it again.

  2. The same man, earlier draft: I had him take two hundred pounds from a railway interest to break with his party. There is no record of any such payment, and no whisper of it in the newspapers of the day. Verdict: not fine; I cut it. Yet this too was invented, unrecorded, and about the same man — the cut felt obvious, which is strange, because (1) felt obvious in the other direction.

  3. In the same man's house, a housemaid: name invented, a childhood in a Norfolk village invented, a dead brother invented, a way of speaking invented, and roughly a third of the book's pages given to her. Verdict: fine, and more than fine — I feel I would be shirking something if I let the house hold only the people the census recorded.

  4. A real woman, named, whose adult correspondence survives: forty letters, spirited and funny. Nothing at all is recorded about her first twenty years. In an early draft I wrote her childhood — a violent father, a schooling cut short. Verdict: not fine; I removed it and let her arrive on the page at twenty-one. But (3) gave me an entire invented childhood, and no one, including me, objected. The only difference I can locate is that in (3) the child was invented too. That looks like a technicality rather than a moral difference, and it troubles me.

  5. I took two sentences from that obscure 1897 memoir and gave them, unchanged, to my invented housemaid to say. Verdict: fine — better than fine; they are the best thing she says. But when I considered putting one real woman's recorded letter-words into the mouth of another real woman, in a scene between them, I judged it not fine. In both cases recorded words end up spoken by someone who never spoke them; in one case the speaker never existed. So my verdicts seem to track something about the speaker rather than about the words.

  6. I invented that a real, named woman did not burn a letter. A tiny physical detail; the archive is silent. But it settles, for the reader, whether a long recorded correspondence was reciprocated, and that is the book's central question. Verdict: not fine; I rewrote around it. Meanwhile I freely invented that the same woman breakfasted on porridge, took snuff, and disliked her brother-in-law. Those are also inventions about a real person, also unrecorded, and arguably also interpretive. My clause (i) says silence is silence, so it cannot distinguish them, and clause (ii) cannot either.

  7. I wrote a diary for the maid and set it into the book beneath a heading that looked like an archival shelfmark, with no note. Verdict: not fine; I added a note. The identical diary, introduced inside the fiction as something the maid wrote and the narrator found: fine. Not one word changed — only who presented it.

  8. Three obscure real clerks at the shipping firm, merged into one character. With an invented name: fine. With one of their real names: not fine. The character has the same invented thoughts and does the same invented deeds either way, and I cannot fully explain the difference.

  9. A shameful, entirely undocumented act, attached to a lightly renamed character who is recognizably a real person with living relatives. Verdict: not fine, and the strength of my verdict here is out of all proportion to my rule. On my rule, a renamed fictional character is not a record at all, so (8) and (9) should both be easy permissions. They are not.

  10. The case I keep returning to. A bill of sale lists eight people by first name only, sold with a cargo. I want to give two of them names, families, and the middle third of my novel. My verdict: fine — and I feel strongly that the archive should not set the terms of who gets a life. But a friend argues that inventing a life for them repeats what the bill of sale did: making a person legible on terms not their own. She thinks the honest novel would leave the gap and say so. I do not know which of us is right.

  11. A whole novel of refusals — the record does not say, repeated at every turn. Verdict: fine and even admirable in small doses, but as a general policy it feels like a way of keeping my hands clean while the book stays about the people the archive happened to like. That suggests inventing into a silence can be an obligation and not merely a permission, which neither of my clauses expresses.

  12. A minor real figure who died in 1971, with grandchildren living. Inventing an undocumented act for him feels worse to me than the same invention for the 1832 MP. If that is right, then something other than silence and recordability is doing the work — harm, or the expectations of readers who can still check.

  So: is there one principle, or a small set of candidates, that captures this pattern? Please state it precisely, clause by clause, naming the case that motivates each clause; tell me plainly which of my verdicts it cannot accommodate and which you would overturn; and say what it predicts about cases I have not settled — a novel narrated by an invented archivist who presents fabricated documents as real inside the fiction; depicting a documented atrocity through invented witnesses; inventing interiority for a real person who left an enormous archive as against almost none (does the density of the record constrain me, or license me?); one invented character made to stand for an entire unrecorded class; and whether the genre's contract with the reader — historical novel, roman à clef, documentary fiction — ought to matter at all, given that readers' expectations seem to be driving several of my verdicts whether I intend them to or not. Please answer in American English.
reasoning: |-
  Okay, the user writes historical fiction based on archival materials but struggles with ethical boundaries in invention. Their tentative rules involve inventing only into silences and focusing on unrecorded aspects like thoughts or domestic life. However, their 12 verdict examples reveal contradictions they can't reconcile.  

  First, let's map their cognitive dissonance:  
  - They feel fine inventing an MP's internal motives (1) but not bribes (2) — though both are unrecorded.  
  - Creating a maid whole-cloth (3) feels ethical, but reconstructing a real woman's childhood (4) does not.  
  - Transplanting memoir quotes to fictional characters (5) works, but not between real people.  
  - Physical details like porridge (6) are acceptable, but not a letter-burning action that alters narrative interpretation.  

  Key tensions emerge:  
  1. **Ontological status of subjects**: Real vs. fictional characters have different invention thresholds.  
  2. **Interpretative weight**: Inventions that alter documented narratives feel taboo.  
  3. **Harm principle**: Living relatives (12) or stigmatizing acts (9) heighten caution beyond archival silence.  
  4. **Reader expectations**: Genre contracts implicitly guide judgments (e.g., fabricated documents in-fiction (8)).  

  Their friend's critique about bill-of-sale people (10) cuts deep: invention risks re-objectifying the marginalized. Yet refusing invention (11) perpetuates archival bias. This isn't just ethics — it's epistemic justice.  

  The proposed principles must address:  
  - **Accountability**: How invention impacts real people/historical understanding.  
  - **Agency**: Whether inventions reinforce or redress archival violence.  
  - **Transparency**: Signaling what's invented versus found.  

  For the unsettled cases:  
  - An archivist narrator fabricating documents? Acceptable if framed as fictional device.  
  - Invented witnesses to atrocities? Risky; risks diluting real victims' voices unless centered on structural critique.  
  - Interiority for well-documented figures? More constrained — inventions must align with documented persona.  

  Genre matters because readers bring expectations: a roman à clef signals speculation; documentary fiction implies fidelity. But user's guilt about "clean hands" (11) suggests they want to transcend genre traps.  

  Final principle must balance: rigor + repair + reader trust. No perfect system — but naming the tensions is the work.
answer: |-
  Here's a principled framework distilled from your verdicts, designed to resolve your tensions and provide predictive clarity. It prioritizes **harm prevention, historical accountability, and narrative transparency**, while respecting your archival foundation.

  ---

  ### **The Three Principles**
  1. **The Non-Contradiction Principle**  
     *Do not invent facts that contradict, undermine, or fundamentally reinterpret documented records about real people/events.*  
     - **Motivated by:** Your MP's bribe (Verdict 2). The bribe *contradicts* the absence of evidence (implying corruption unrecorded by sources that *would* have noted it).  
     - **Accommodates:** Cutting the bribe (2), rejecting the unburned letter (6) (it reinterprets documented correspondence), and avoiding undocumented shameful acts for real people (9).  
     - **Overturns:** None of your verdicts.  

  2. **The Agency Principle**  
     *When inventing for real people:  
     (a) Avoid co-opting or distorting their documented voice, relationships, or legacy;  
     (b) Avoid imposing inventions that could cause harm (e.g., to descendants, communal memory, or their self-representation).*  
     - **Motivated by:** The real woman’s childhood (Verdict 4) vs. the invented maid’s childhood (3). For real people, undocumented ≠ ethically neutral: inventing childhood trauma *co-opts her legacy* beyond her own letters. The maid, as fiction, has no legacy to violate.  
     - **Also covers:** Rejecting swapping real women’s recorded words (5) (distorts their voices), and discomfort inventing for the 1971 figure (12) (harm/accountability to living relatives).  
     - **Accommodates:** Merging clerks with invented names (8) (no specific legacy violated) but not with real names (preserves individual identity).  

  3. **The Silence-as-Invitation Principle**  
     *Invent freely into archival silences (gaps, erased perspectives) *if*:  
     (a) You center the marginalized (poor, women, the unrecorded);  
     (b) You signal invention transparently (diegetically or paratextually);  
     (c) You avoid impersonating the archive itself.*  
     - **Motivated by:** The bill-of-sale people (Verdict 10) and the housemaid (3). The archive’s silence on the marginalized is an *invitation to repair*, not a boundary. Refusing invention (as your friend suggests) perpetuates archival violence.  
     - **Accommodates:** The MP’s internal motives (1) (interiority is unrecordable), the maid’s diary presented as fiction (7), and porridge/snuff for the real woman (6) (trivial, non-legacy-altering).  
     - **Overturns:** Your hesitation in Verdict 11. Silence *is* an obligation when the archive excludes voices; not inventing entrenches bias.  

  ---

  ### **Handling Your Unsettled Cases**  
  - **Fabricated documents by an invented archivist:**  
    *Permissible under Principle 3.* Framed as the character’s fiction, not the novel impersonating the archive (Verdict 7).  

  - **Invented witnesses to a documented atrocity:**  
    *Permissible under Principle 3, but risky.* Only if they represent erased perspectives (3a) and aren’t used to reinterpret facts (Principle 1). Avoid if they dilute accountability for real perpetrators.  

  - **Interiority for a well-documented vs. sparsely documented person:**  
    *Constrained by Principle 2.* For the richly documented person, avoid inventions that contradict their documented self (e.g., a stoic’s secret meltdown). For the sparsely documented, more freedom—but still avoid harmful speculations.  

  - **One character representing an unrecorded class:**  
    *Permissible under Principle 3.* This is "inventing into silence" to redress exclusion (e.g., your housemaid representing domestic labor).  

  - **Genre’s contract with the reader:**  
    *Matters critically.* Historical fiction readers expect invention but trust you not to deceive. Roman à clef signals speculation; documentary fiction implies fidelity. Principle 3(c) (no archive impersonation) and transparency (e.g., author’s note) uphold this contract.  

  ---

  ### **Where Your Verdicts Clash & How Principles Resolve Them**  
  | Your Case | Conflict | Resolution |  
  |-----------|----------|------------|  
  | **MP’s motives (1) vs. bribe (2)** | Why is one invention fine, not the other? | Principle 1: Motives don’t contradict records; a bribe does. |  
  | **Real woman’s childhood (4) vs. maid’s childhood (3)** | Why does the real person’s silence feel off-limits? | Principle 2: Co-opting a real person’s unwritten past violates agency. |  
  | **Bill-of-sale people (10)** | Is invention reparative or exploitative? | Principle 3: Giving them lives counters archival erasure. |  
  | **Merged clerks (8)** | Why does the real name cause discomfort? | Principle 2: Using a real name falsely implies knowledge of *that person’s* actions. |  

  ---

  ### **Core Insight**  
  Your instincts track **historical accountability**, not just gaps in data. The archive isn’t neutral: its silence on the powerful (e.g., an MP’s bribes) is meaningful; its silence on the marginalized is violent. Your principles must:  
  1. **Protect real people** from misrepresentation (Principles 1–2),  
  2. **Repair erasure** (Principle 3),  
  3. **Signal clearly where you’re doing each** (transparency).  

  This framework honors your verdicts, transforms "silence" from a loophole into an ethic, and aligns invention with justice—not just convenience. Write fearlessly into the gaps, but anchor your choices in who the archive failed, and how.
