prompt: |-
  I'm a high school student doing an independent project on paradoxes in decision theory, and I have gotten stuck on what looks to me like a manufactured problem: the Pasadena game.

  The game, as I understand it: you toss a fair coin until it lands heads for the first time. If the first heads comes on the nth toss, you win (-1)^(n+1) · 2^n / n dollars — so +2 if it lands heads immediately, -2 if it takes two tosses, +8/3 if three, -4 if four, and so on. Each of those outcomes has probability 1/2^n, so the expected value is 1 - 1/2 + 1/3 - 1/4 + ..., the alternating harmonic series, which converges to ln 2, or about 69 cents.

  My teacher says the game is famous because its expected value is undefined, and I don't see how that can be right, for two reasons.

  First, the series does converge, to ln 2. The only argument I have heard for calling it undefined is that the series is merely conditionally convergent, so by the Riemann rearrangement theorem you can reorder the terms to sum to anything you like — 5, negative 100, a million. But reordering looks like sheer cheating to me. The outcomes have a natural order: the payoff from the game ending on the first toss, then the second, then the third. Sum them in that order and you get ln 2. A rearrangement is just a different way of writing down the very same game, and bookkeeping shouldn't change what a game is worth. So it seems to me the correct answer is that this game is worth about 69 cents, a rational person should pay up to 69 cents to play it, and that is the end of it.

  Second, I don't see why this case is supposed to be interestingly different from the St. Petersburg game, where everyone agrees the expected value is infinite and where the usual lesson is that you should be willing to pay any finite amount to play. Both look like cases where the naive rule "pay up to the expected value" delivers an answer people find strange. If anything, Pasadena is the tamer one, since at least its value is a finite number. So aren't these the same puzzle in different clothes?

  The one reply I have encountered and can't evaluate is that in real life nobody can actually pay out 2^n dollars for large n, so you should just cut the series off at some huge number of tosses; then the expected value is an ordinary finite number and the whole controversy evaporates.

  Where am I going wrong? Please don't send me to papers, authors, or reading lists — I have no access to them and I would rather have the reasoning than the references. Give me your bottom line in the very first sentence, naming the single biggest mistake I am making, then work through the reasoning without restating my question back to me. If you can also say something about why the "just truncate the series" move does or does not settle the matter, that is the part I am most confused about.
reasoning: |-
  Okay, let me tackle this step by step. The user is a high school student working on paradoxes in decision theory, specifically the Pasadena game. They're confused because the expected value seems to converge to ln(2), but their teacher says it's undefined. They think rearrangement is cheating and don't see how this differs from the St. Petersburg paradox. They also mention truncation as a possible solution.

  First, I need to address their main misunderstanding. They believe that since the alternating harmonic series converges to ln(2) in its natural order, that should be the expected value. But in probability, expected value requires absolute convergence, not just conditional convergence. The Riemann rearrangement theorem shows that without absolute convergence, the sum isn't stable under rearrangement. Even though the natural order sums to ln(2), reordering the terms changes the sum. This isn't just bookkeeping—it reflects a deeper issue in how we define expected value when the series isn't absolutely convergent.

  The user compares this to the St. Petersburg paradox, where the expected value is infinite. The key difference is that in St. Petersburg, the series diverges to infinity, so no rearrangement changes that. Here, the series converges conditionally, so rearrangements can yield different sums. That's why the expected value is considered undefined—it depends on the order of summation, which isn't a problem when the series converges absolutely.

  Regarding truncation: the user wonders why not just cut off the series at a large n. While this makes the expected value finite and well-defined, it changes the original problem. The Pasadena game, as defined, has no upper bound on the number of tosses. Truncating is a practical workaround but doesn't resolve the theoretical issue. The paradox highlights that the infinite game's expected value isn't well-defined, which is a conceptual problem for decision theory.

  The user might be missing that expected value in probability theory requires the sum to be absolutely convergent for it to be unambiguously defined. The natural order gives ln(2), but other orders don't, so we can't assign a single value. The core mistake is assuming conditional convergence is sufficient for expected value.

  I should emphasize that rearrangement isn't "cheating" but demonstrates a mathematical limitation. Also, explain why St. Petersburg is different—its series diverges, so rearrangement doesn't produce different finite sums. Finally, clarify that truncation sidesteps the issue but doesn't invalidate the paradox, as the infinite case remains problematic.
answer: |-
  Your single biggest mistake: **You're assuming conditional convergence is sufficient for a well-defined expected value, but probability theory requires absolute convergence to avoid ambiguity.**

  Here's the reasoning stripped down:

  1.  **Expected Value Requires Absolute Convergence:** The standard mathematical definition of the expected value of a random variable requires the sum of |payoff * probability| over all outcomes to converge (i.e., the series must be *absolutely convergent*). If this sum diverges, the expected value is considered undefined, even if the sum of the raw payoff * probability terms (without absolute value) converges conditionally.
  2.  **The Pasadena Game Fails Absolute Convergence:** Calculate the sum of absolute values for the Pasadena game:
      |(+2) * (1/2)| + |(-2) * (1/4)| + |(+8/3) * (1/8)| + |(-4) * (1/16)| + ...
      = |1| + | -1/2 | + | 1/3 | + | -1/4 | + ...
      = 1 + 1/2 + 1/3 + 1/4 + ...
      This is the standard harmonic series, which diverges to infinity.
  3.  **Why Rearrangement Matters (It's Not Cheating):** The divergence of the absolute series means the sum of the raw terms (1 - 1/2 + 1/3 - 1/4 + ...) is only *conditionally convergent*. The Riemann rearrangement theorem isn't a trick; it reveals a fundamental instability inherent in conditionally convergent series. Different ways of grouping or ordering the infinite collection of possible outcomes (which correspond mathematically to different ways of summing the infinite series) yield *different* finite sums. There's no single, unique sum that represents the "true" value of the infinite series independent of the order of summation.
  4.  **The "Natural Order" Illusion:** You argue the outcomes have a natural order (1st toss, 2nd toss, 3rd toss...), so summing in that order (giving ln2) should define the expected value. However, the requirement for absolute convergence exists precisely because the *mathematical definition* of expected value must be consistent regardless of how we *describe* the sample space, as long as we include all outcomes. The rearrangement theorem shows that if we relabel the outcomes or group them differently (mathematically equivalent to rearranging the series), we get different expectation values for the *same physical game*. This inconsistency means no single number (like ln2) can be reliably assigned as the game's value. The failure of absolute convergence makes the expectation value order-dependent.
  5.  **Contrast with St. Petersburg:**
      *   **St. Petersburg:** Payoff = 2^n, Probability = 1/2^n. Expected value = Σ (2^n * 1/2^n) = Σ (1) = 1 + 1 + 1 + ... This diverges to infinity *absolutely* (the sum of absolute values is the same diverging series). *Every* rearrangement also diverges to infinity. The expected value is unambiguously infinite, even if it feels counterintuitive.
      *   **Pasadena:** As shown, the sum of absolute values diverges, while the raw sum converges conditionally. Rearrangement changes the sum. The expected value is undefined. The "puzzle" is deeper: not that the value is strange, but that no consistent finite value can be assigned mathematically.
  6.  **Does Truncation Settle It?**
      *   **Yes, practically:** If you impose a maximum number of tosses N (e.g., the house only allows 100 tosses, or physics prevents more than 10^100 tosses), the series becomes finite: Σ_{n=1}^N (-1)^{n+1} / n. This sum is absolutely convergent (it's a finite sum!) and well-defined. The controversy vanishes because you've replaced the infinite game with a finite one.
      *   **No, theoretically:** The *original* problem is defined for an *infinite* number of possible tosses. The paradox highlights that the standard mathematical tool (expected value) breaks down for this specific infinite game due to conditional convergence. Truncation solves the problem by changing the game itself, not by resolving the ambiguity in the infinite case. The theoretical point remains: for the infinite Pasadena game as defined, expected value is undefined.

  **Bottom Line:** The expected value of the infinite Pasadena game is undefined because the series of |payoff * probability| diverges, making the raw series only conditionally convergent. This allows rearrangement to yield different sums, proving no single value consistently represents the game's worth. Truncating the series eliminates the infinity, making the expected value finite and well-defined, but that's a different game. St. Petersburg has an unambiguously infinite expected value, making it a different type of paradox.
