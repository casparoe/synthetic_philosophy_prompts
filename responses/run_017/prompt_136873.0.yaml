prompt: |-
  For the chapter of a guidebook I'm putting together for long-stay visitors — the bit where you tell newcomers which local conventions they actually have to follow and which they can ignore — I want the spec before the advice. So: write the desiderata an account of conventional obligation has to meet. What does a theory have to be able to do to be good enough to settle when an everyday convention (tipping, queueing, jaywalking, taking a number, standing on the right of the escalator) generates a real moral obligation, as opposed to mere etiquette, prudence, or a reason to avoid a dirty look? For each requirement give the case behind it, and say whether its non-negotiable or just the hobbyhorse of one camp.

  Cases I want the list to have room for, and please add the ones I've missed: the phantom queue (at the rural bus stop the regulars wait in the cafe across the street and board in order of arrival, so a newcomer sees an empty stop and no line); the tip screen on the tablet at a counter where staff already get a proper wage, and the menu that says service included; jaywalking at 4am with no traffic and no witnesses; the half-dead convention that roughly half the people still follow; the visitor who genuinely has no idea versus the expat on year nine who still doesn't like it; a locally entrenched convention that shifts costs onto the worst-off locals (tips that stand in for wages, a "fee" that moves your permit up the pile); and conventions where your compliance is invisible to everyone, so nothing you do updates anyone's expectations.

  Two things I'm convinced a theory must not collapse: whether you must follow the convention and whether you may enforce it on other people, and whether the convention binds and whether it's a good thing to have at all.

  Then: which pair of requirements do you think can't both be met? My guess is that "the obligation has to hold even when nobody is affected and nobody is watching" and "the obligation has to lapse when the convention is extractive" pull in opposite directions, but tell me if the real conflict is elsewhere. Which single requirement does the most work in ruling candidate theories out? A short scorecard for two or three of the standard stories is fine, but the list is what I need.
reasoning: |-
  Okay, the user is creating a guidebook chapter for long-stay visitors about local conventions. They need a theory that distinguishes between real moral obligations and other reasons like etiquette or prudence. They've provided several scenarios to test such a theory and want desiderata that any account of conventional obligation must meet. 

  First, I need to understand what they're asking for. They want a list of requirements that a theory must satisfy to determine when following a convention is morally obligatory versus just a social norm. They've mentioned cases like phantom queues, tipping at places with proper wages, jaywalking at 4am, etc. Each requirement should come with a case, and they want to know if it's non-negotiable or debatable.

  The user has two non-collapsible points: distinguishing between following vs. enforcing conventions, and separating whether a convention binds from whether it's good. They suspect a conflict between obligations holding without witnesses and lapsing when extractive. I should verify if that's the core tension or if it lies elsewhere.

  Looking at their cases, I can derive several requirements. For example, the phantom queue suggests a requirement for epistemic accessibility—newcomers must be able to know the convention exists. The tip screen with service included points to norm content transparency. The 4am jaywalking case highlights the need for the obligation to persist without witnesses but lapse when pointless.

  I should also consider other cases they might have missed. What about conventions that are harmful or exploitative? Or those where compliance is invisible? They mentioned cost-shifting to the worst-off, which is crucial. Also, conventions that are half-dead or vary by subgroup.

  For each requirement, I'll classify it as non-negotiable or a hobbyhorse. Non-negotiables might include non-collapsibility points, while others, like the role of reasonable expectations, could be debated. The conflict between persistent obligation without witnesses and lapsing when extractive seems valid. The most exclusionary requirement might be the non-collapsibility of obligation vs. enforceability.

  I'll outline the desiderata clearly, ensuring each has a case and classification. Then, I'll identify the conflicting requirements and which one rules out most theories. Finally, I'll quickly score existing theories like rule-consequentialism, contractualism, and conventionalism against these criteria.
answer: |-
  Here are the desiderata for a theory of conventional moral obligation, designed to handle your cases and core requirements. Each includes the motivating case, classification (Non-Negotiable/Hobbyhorse), and rationale.

  ### Core Desiderata (The Must-Haves)

  1.  **Distinguish Obligation from Other Reasons (Non-Negotiable)**
      *   **Case:** Tip screen at a counter where staff earn a proper wage *and* the menu states "service included."
      *   **Requirement:** The theory must clearly differentiate between a *genuine moral obligation* to tip in this context versus reasons of mere etiquette ("it's awkward not to"), prudence ("the staff might spit in my coffee next time"), or avoiding mild social sanction ("a dirty look").
      *   **Rationale:** This is the core task. Collapsing these fails the guidebook's purpose.

  2.  **Non-Collapsibility of "Must Follow" vs. "May Enforce" (Non-Negotiable)**
      *   **Case:** Jaywalking at 4 am with no traffic or witnesses. Standing on the right on an empty escalator.
      *   **Requirement:** The theory must allow that an individual may have a moral obligation to follow a convention *even when* it would be morally wrong (or disproportionate) for others to actively enforce it on them (e.g., shouting, fining, shaming). Conversely, it must allow that sometimes enforcement *is* justified.
      *   **Rationale:** Your explicit requirement. Separates personal duty from social policing power.

  3.  **Non-Collapsibility of "Binds" vs. "Good" (Non-Negotiable)**
      *   **Case:** A locally entrenched "fee" to move a permit up the pile, shifting costs onto the worst-off who can't pay.
      *   **Requirement:** The theory must distinguish between whether a convention *creates a moral obligation for participants* and whether the convention itself is *socially beneficial, just, or morally good*. It must be possible for a convention to be binding *and* bad, or non-binding *and* good.
      *   **Rationale:** Your explicit requirement. Acknowledges that bad norms can feel obligatory, and good norms might not always bind in every context.

  4.  **Epistemic Accessibility (Non-Negotiable)**
      *   **Case:** The Phantom Queue (rural bus stop regulars wait in cafe, board by arrival time). The genuine newcomer with no idea.
      *   **Requirement:** The theory must account for the agent's knowledge/accessibility of the convention. An obligation cannot arise from a convention the agent has *no reasonable way of knowing* exists or applies.
      *   **Rationale:** Morality generally requires the possibility of knowing one's duty. A hidden convention can't bind the unknowing.

  5.  **Robustness to Pointlessness (Hobbyhorse - Strong)**
      *   **Case:** Jaywalking at 4 am with no traffic and no witnesses. Standing on the right on an empty escalator.
      *   **Requirement:** The obligation must persist *even when* violating the convention causes *no discernible harm, inconvenience, or negative consequence to anyone*, and when no one observes the violation.
      *   **Rationale:** Tests if the obligation is truly moral (internal) or merely about consequences/observance. Many theories struggle here.

  6.  **Sensitivity to Exploitation/Injustice (Non-Negotiable)**
      *   **Case:** Tipping where it stands in for wages, shifting burden to customers and exploiting low-wage workers. The "fee" for permit jumping.
      *   **Requirement:** The obligation *must lapse* when the convention is demonstrably exploitative, unjust, or systematically shifts burdens onto the vulnerable in a harmful way. Mere existence of a convention isn't sufficient.
      *   **Rationale:** Morality trumps social convention when convention causes significant harm/injustice. A theory failing this legitimizes oppression.

  7.  **Handling Degenerate/Contested Conventions (Hobbyhorse - Moderate)**
      *   **Case:** The half-dead convention roughly half follow (e.g., holding doors for distant strangers, some forms of address). The expat on year nine who knows but dislikes.
      *   **Requirement:** The theory must explain when and why obligations weaken or dissolve as a convention decays or becomes widely contested within the relevant community, and how an agent's *reasonable rejection* (beyond mere dislike) factors in.
      *   **Rationale:** Conventions aren't static monoliths. Obligation shouldn't persist rigidly when the underlying social coordination is breaking down or reasonably rejected.

  8.  **Accounting for Invisible Compliance (Hobbyhorse - Strong)**
      *   **Case:** Following a convention where your compliance/violation is invisible to everyone (e.g., correctly sorting recycling in a single-stream system where it all gets dumped together anyway; paying an "honor system" fee with no oversight).
      *   **Requirement:** The theory must explain the source and strength of any obligation *even when* one's action does nothing to update others' expectations or maintain the convention's salience through observable behavior.
      *   **Rationale:** Tests if the obligation relies on performative signaling or has deeper roots (e.g., fairness, promise-keeping, integrity).

  ### The Conflict You Suspect is Real

  *   **Robustness to Pointlessness (Requirement 5) vs. Sensitivity to Exploitation/Injustice (Requirement 6):** This is indeed the core tension.
      *   **Requirement 5** demands obligation persists *even when* violation is harmless and unseen (suggesting a deontic or intrinsic duty).
      *   **Requirement 6** demands obligation *lapses* when the convention causes significant harm/injustice (suggesting a consequentialist or fairness-based foundation).
      *   **Why it's hard:** A theory satisfying 5 often grounds obligation in something like promise-keeping (implicit social contract), rule-following, or integrity, which should hold regardless of immediate consequences. But Requirement 6 insists that consequences *do* matter fundamentally – if the convention's *content* or *effect* is bad enough, it severs the obligation. Reconciling a persistent, content-independent (or weakly content-dependent) duty with a strong content-based veto is extremely difficult. Most theories lean heavily towards one side.

  ### The Most Exclusionary Requirement

  *   **Non-Collapsibility of "Must Follow" vs. "May Enforce" (Requirement 2)** does the most work in ruling out popular theories.
      *   **Why:** Many theories (especially strong consequentialist or conventionalist ones) tie the *existence* of the obligation tightly to the *mechanisms* or *reasons* for enforcement. For example:
          *   **Rule Utilitarianism:** Often struggles to explain why *you* must follow the rule when no bad consequences occur, *and* why others *shouldn't* enforce it in that same harmless scenario. The reason for following (good consequences overall) is often the same reason cited for enforcing.
          *   **Social Contract (Simple):** If obligation arises from a mutual agreement for benefit, violating when harmless might seem permissible, and enforcement when harmless might seem equally permissible or impermissible based on the same calculus. Distinguishing the duties clearly is hard.
          *   **Conventionalism/Practice Rules:** Often defines the obligation *as* susceptibility to legitimate enforcement within the practice. Separating them is conceptually tricky.
      *   Theories that emphasize individual integrity or deontic constraints independent of social consequences handle "Must Follow" alone better. Theories emphasizing social coordination and harm prevention handle "May Enforce" better. Finding one that cleanly separates and grounds *both* distinct judgments is rare.

  ### Quick Scorecard for Standard Theories

  1.  **Rule Consequentialism:**
      *   **Strengths:** Handles #6 (Exploitation) well, can handle #4 (Accessibility) with effort, can sometimes handle #7 (Degenerate).
      *   **Weaknesses:** Fails #5 (Pointlessness) spectacularly. Struggles mightily with #2 (Follow vs. Enforce) and #8 (Invisible). #3 (Bind vs. Good) collapses (binding *because* good).
      *   **Verdict:** Fails key non-negotiables.

  2.  **Contractualism (Scanlon-style):**
      *   **Strengths:** Handles #6 (Exploitation) very well. Handles #2 (Follow vs. Enforce) *potentially* well (your duty vs. what you can reasonably demand). Handles #3 (Bind vs. Good) well. Can handle #4 (Accessibility) & #7 (Degenerate).
      *   **Weaknesses:** Struggles with #5 (Pointlessness) – is rejecting a harmless violation unreasonable? Major struggle with #8 (Invisible) – if no one is affected, who can reasonably reject?
      *   **Verdict:** Strong contender, but #5 and #8 are major hurdles.

  3.  **Conventionalism + Fairness (Rawlsian/Quasi-Promise):**
      *   **Strengths:** Can handle #5 (Pointlessness) via fairness/promise-keeping. Can handle #2 (Follow vs. Enforce) by separating fairness duty from enforcement justification. Handles #8 (Invisible) via integrity/fairness. Handles #4 (Accessibility).
      *   **Weaknesses:** Struggles badly with #6 (Exploitation) – why be "fair" to an unfair system? Why keep an "implicit promise" to a harmful norm? #7 (Degenerate) can be tricky. #3 (Bind vs. Good) needs careful handling to avoid collapse.
      *   **Verdict:** Also a contender, but #6 is its Achilles heel.

  **Conclusion:** Your list highlights the profound difficulty of this problem. The core conflict (#5 vs. #6) and the exclusionary power of #2 show why no single theory commands consensus. A successful guidebook chapter might need to transparently present this complexity, perhaps advocating for a hybrid approach or emphasizing contextual judgment guided by these desiderata, rather than claiming a single, simple theoretical resolution. The desiderata themselves provide the crucial framework for evaluating specific conventions.
