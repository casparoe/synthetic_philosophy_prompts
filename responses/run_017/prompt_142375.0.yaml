  *adjusting imaginary glasses* Let me tackle their central dilemma head-on. The key is that revealed preferences aren't binary "true/false" but exist on a spectrum of autonomy conditions. When choice architecture exploits cognitive gaps - like present bias sabotaging retirement planning - it creates what I'd call "procedural failures" where actions don't reflect deeper values. Opt-out pensions don't override judgement but create the cognitive space for it to align with lifelong priorities. 

  *scribbling mental notes* Must emphasize that inertia isn't bypassing reason but compensating for flawed choice environments. The status quo isn't neutral - chaotic defaults like non-enrollment already exploit inertia against people's interests. Our nudges just level the playing field. 

