  ### Example: Archaeological Artifact Authentication

  **Scenario:** An archaeologist finds a pottery shard at a dig site. Two tests are used to authenticate its origin:  
  - **Test A:** Analyzes mineral composition. If the shard is from the ancient city of Zubara (our event of interest, probability 0.01), it returns positive 99% of the time. If not, false positive rate is 1%.  
  - **Test B:** Examines organic residues. If Zubaran, positive 99% of the time. If not, false positive rate 1%.  

  The archaeologist conditions on the background: "This shard was found in a region where only Zubaran artifacts or modern forgeries appear, and forgeries are common (90% probability)." Both tests are run in separate labs with no shared processes (*wire-free* independence).  

  **Heuristic argument:**  
  > "No link exists between the mineral and residue tests—multiply the false positive probabilities! P(not Zubaran) = 0.9. P(false positive on both | forgery) = (0.01)(0.01) = 0.0001. So P(not Zubaran | both positive) ≈ (0.9)(0.0001) / [ (0.9)(0.0001) + (0.01)(0.99)(0.99) ] = **0.0089** (0.89%)."  

  **Contradiction:** A second analyst agrees on all evidence but notes:  
  > "Conditional on the shard being a forgery (*not Zubaran*), the *background* (region) implies forgeries often share traits: e.g., modern contaminants boost *both* false positives. So conditional on forgery, P(A+ and B+ | forgery) isn’t independent—it’s 0.009 (10× the product), as 1% of forgeries have cross-reactive contaminants."  

  Recalculating:  
  P(not Zubaran | both positive) ≈ (0.9)(0.009) / [ (0.9)(0.009) + (0.01)(0.99)(0.99) ] = **0.448** (44.8%).  

  **Divergence pinpointed:**  
  - **Wire-free:** Both agree tests are causally unrelated (no shared mechanisms).  
  - **Factorizing:** First analyst assumes *conditional independence* given forgery (P(A∩B|¬Z) = P(A|¬Z)P(B|¬Z)).  
  - **Filter-proof:** Second analyst recognizes the *background (region + forgery prevalence)* induces dependence. The heuristic needed *filter-proof* independence (stable under conditioning), but wire-free didn’t ensure it.  

  **Key wrinkle:** The first analyst’s "no reason to think they’re linked" implicitly meant *wire-free*, but the argument required *filter-proof* (independence conditional on forgery *and* the region’s properties). The background introduced a hidden common cause (contaminants in forgeries), violating conditional independence despite wire-free separation.  

  **Honest statement:** The presumption should be: "Conditional on *all* relevant background, including selection effects (why we’re analyzing this case), the events are probabilistically independent." But this is fragile—without knowing the full background structure, we risk missing latent dependencies. Filter-proof is the necessary standard, but it demands deep causal understanding, not just causal isolation.
