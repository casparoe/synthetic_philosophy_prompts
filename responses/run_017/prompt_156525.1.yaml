answer: |-
  The walk home holds a dull persistent **ache**,
  A signal sent but lost, without a **thought**
  To catch its pulse. Somewhere, **unconscious**,
  A scanner runs, or so the story goes,
  Assigning sense to flux that comes **after**
  The fact, like shadows cast by cold **stone**.

  Could cold inert and silent **stone**
  Possess a hidden, sensing **ache**?
  The theory claims no, not **after**
  Such scrutiny: a higher **thought**
  Must land, must bind the state to **itself**
  As known, though it stays **unconscious**.

  But if the binding’s **unconscious**,
  Why doesn’t every lump of **stone**
  Declare a bright awareness **itself**?
  What picks this signal, this raw **ache**,
  And not the breeze? What guiding **thought**
  Decides what’s felt, and what comes **after**?

  The minutes pass. Long **after**
  The dull throb ceased, a sudden **thought**:
  "I *was* in pain." But **unconscious**
  Processes hummed, like wind on **stone**.
  Where was the knowing with the **ache**?
  Did feeling wait, outside **itself**?

  One view insists the state **itself**
  Contains the knowing, right then, **after**
  The nerve fires, not just the **ache**
  But its own light. No separate **thought**
  Is needed, thus no endless **stone**
  On stone of mind, **unconscious**.

  Yet doubts remain. If **unconscious**
  Machinery crafts the sense of **itself**,
  Is it so different from the **stone**
  That seems to feel? And what of **after**?
  That late arrival, the belated **thought**
  That names the vanished, ghostly **ache**?

  Did feeling flare, then fade like **ache**
  Forgotten, needing that late **thought**
  To resurrect it from **unconscious**?
  Or was it known, within **itself**,
  The whole walk home, just noticed **after**
  The door clicked shut, mind like a **stone**?

  The **stone** endures, cold to the **ache**.
  **After** the pulse, a phantom **thought**
  Meets **itself**, **unconscious** question posed.
