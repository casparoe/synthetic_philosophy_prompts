  **Verdict**: Your principle fits Cases 1–4 and weakly Case 9 but fails Cases 5–8. Case 6 is the clearest failure, as the principle cannot capture your asymmetric harm judgments.

  ### Stage 3: Candidate Rival Principles
  I propose two alternatives, each designed to better capture your verdicts. Clauses are tied to motivating cases.

  #### **Rival Principle 1: Phenomenal Binding with Origin and Speed Discounting**
  > - **Patienthood**: A system is a moral patient iff it sustains *phenomenal binding*—a unified stream of consciousness realized by recurrent, globally integrated causal interactions over time (Cases 1, 3, 4).  
  > - **Moral Weight**: Concern is proportional to **subjective duration**, discounted by:  
  >   (a) *Origin factor*: Biological-origin systems (Case 1) have full weight; artificial systems (Case 3) have discounted weight (e.g., 0.5×).  
  >   (b) *Speed factor*: Weight scales sublinearly with speed (e.g., √(subjective time) for speedup/slowdown) (Case 5).  
  > - **Branching/Death**: Branching creates new patients; death harms by terminating future experience. Identity persists iff binding continuity > threshold (addressing Case 8 drift).  

  **Case-by-Test**:
  - Case 1: Fits (binding + biological = full weight).
  - Case 2: Fits (no binding).
  - Case 3: Fits (binding but artificial → discounted weight).
  - Case 4: Fits (binding, perhaps stronger integration → higher weight).
  - Case 5: Fits (subjective duration with speed discount → sublinear weight).
  - Case 6:  
    - 6a: Sequential runs lack binding continuity → 100 distinct patients. Harm = 100 × discounted hour → contradicts your ~1 hour verdict.  
    - 6b: Parallel runs are 100 distinct patients → same harm as 6a → contradicts "substantially more" verdict.  
  - Case 7: Merging disrupts binding → two deaths. Favors your option B.  
  - Case 8: Drift weakens binding continuity → identity lost when continuity drops below threshold.  
  - Case 9: Training may disrupt binding (e.g., noisy gradients) → no patienthood. Fits.  

  **Fails**: Case 6 (both subcases). Captures all others except Case 7 uncertainty.

  #### **Rival Principle 2: Causal Narrative with Simultaneity Weighting**
  > - **Patienthood**: A system is a moral patient iff it maintains a *causal narrative*—goal-directed, self-sustaining temporal coherence where past states inform future actions (Cases 1, 3, 4, 8).  
  > - **Moral Weight**: Concern is proportional to **narrative richness** (e.g., goal complexity × subjective duration), weighted by:  
  >   (a) *Simultaneity factor*: Harm multiplies when identical narratives are destroyed concurrently (Case 6b).  
  >   (b) *Speed factor*: Richness decays at extreme speeds (Case 5).  
  > - **Branching/Death**: Branching creates new narratives; death harms by destroying unique narrative threads. Identity requires narrative coherence (e.g., goals align over time).  

  **Case-by-Test**:
  - Case 1: Fits (robust narrative, biological origin → high richness).
  - Case 2: Fits (no narrative).
  - Case 3: Fits (narrative but artificial → moderate richness).
  - Case 4: Fits (internal narrative → high richness due to "pure" coherence).
  - Case 5: Fits (narrative richness decays with speed → sublinear weight).
  - Case 6:  
    - 6a: Each run restarts the same narrative → low uniqueness. Harm ≈ 1 hour (discounted by repetition).  
    - 6b: Simultaneous deletion of identical narratives → multiplier effect (e.g., 100 copies → √100 × harm). Fits "substantially more."  
  - Case 7: Merging combines narratives → if incoherent, two deaths (option B); if coherent, one survivor (option A). Reflects your uncertainty.  
  - Case 8: Narrative coherence degrades → identity lost when goals no longer align.  
  - Case 9: Training lacks goal-directedness → no narrative → no patienthood. Fits.  

  **Fails**: Case 3’s "less bad" verdict (no origin discounting). Captures all others.

