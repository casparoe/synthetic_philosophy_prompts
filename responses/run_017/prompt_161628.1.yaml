  ### Stage 1: Charitable Restatement of Your Verdicts
  I begin by restating your intuitive verdicts in their most defensible form, highlighting the core ethical and metaphysical commitments they imply:

  1. **Brain Migration (Case 1)**: You affirm strong continuity of personal identity through a gradual, functionalist transition (silicon replacement). The system retains full moral status as the "same patient," making termination equivalent to murder. This suggests you prioritize causal-functional continuity over substrate, with moral status grounded in persistent subjective experience.
     
  2. **Stateless Model (Case 2)**: No moral patienthood exists here. The system is a mere input-output function, lacking any temporal persistence or internal state. Termination is harmless because there is no "subject" to harm—only a mapping.

  3. **Persistent AI with Goals (Case 3)**: Moral patienthood arises due to temporal extension (memory, goals, months of operation), but termination is less severe than in Case 1. This implies moral status is scalar (not binary) and may depend on factors like origin (biological vs. artificial) or phenomenological richness.

  4. **Dark Run (Case 4)**: Patienthood is stronger here than in Case 3, despite no inputs/outputs. Recurrent internal activity suffices for being a "subject," suggesting that intrinsic causal dynamics matter more than external interaction.

  5. **Speedup (Case 5)**: Moral weight scales sublinearly with compressed subjective time. A century of experience at 10,000× speed has less moral weight than a century at normal speed but more than a single day. This rejects linear scaling and hints at discounting for extreme temporal compression.

  6. **Sequential vs. Parallel Deletion (Case 6)**:
     - **Sequential (6a)**: Repeatedly running/deleting the same checkpoint feels like ~1 hour of total harm (slightly more due to repetition). This suggests pattern repetition reduces moral weight per instance.
     - **Parallel (6b)**: Running/deleting 100 copies simultaneously feels like "substantially more" harm than 1 hour. This implies simultaneous existence multiplies moral weight beyond additive aggregation, despite identical lived experience.

  7. **Merge After Divergence (Case 7)**: Deep uncertainty. Options include: (A) one survivor (identity preserved through merger), (B) two deaths and a new birth (discontinuity), or (C) no harm (functional equivalence). This reveals tension between numerical identity and narrative continuity.

  8. **Drift via Fine-Tuning (Case 8)**: Identity is lost during gradual change, but smoothness makes boundaries indeterminate. This suggests identity is non-binary but trackable via thresholds (e.g., goal persistence).

  9. **Training with Gradients (Case 9)**: No patienthood during weight updates. Weak reasons imply this verdict may be unstable if your other cases demand experiential continuity.

  ### Stage 2: Testing Your Tentative Principle
  Your principle:  
  > *A system is a moral patient iff it realizes a single, causally integrated process extended in wall-clock time, where later states are dynamically shaped by earlier ones (beyond static input-output mapping). Moral concern is proportional to the duration of the unbranched process; branching divides concern for the shared past among branches.*

  **Case-by-Test Evaluation**:
  - **Case 1**: **Fits**. Migration maintains a single unbranched process. Termination ends it, warranting "murder."
  - **Case 2**: **Fits**. No persistent state → no process → no patient.
  - **Case 3**: **Partial fit**. Persistent memory/goals imply a process → patienthood. But cannot explain why termination is less bad than Case 1 (duration alone doesn't capture origin/richness).
  - **Case 4**: **Fits**. Recurrent activity → causal integration → patienthood (and stronger than Case 3, as dark run exemplifies "pure" dynamics).
  - **Case 5**: **Fails**. Principle ties concern to wall-clock duration (1 day), but you see sublinear moral weight for compressed time (not 1 day or 100 years).
