  The non-negotiable points include not collapsing key distinctions. Demands like not entailing false reports, mechanistic explanations, and neutrality might conflict. If explaining why functional explanation feels inadequate reveals that the hard problem is unsolvable, neutrality is lost. The user suspects this, so I need to address if neutrality is feasible.

  I'll refine each desideratum with the user's examples, mark negotiability, and identify conflicts. For instance, fragility is non-negotiable because any account must explain why the intuition persists yet is fragile. The modality gradient is also key; ignoring it oversimplifies. The engineered case is non-negotiable for a testable theory.

  Conflicts arise between neutrality and explanatory depth. If a theory explains why functional accounts feel inadequate by revealing an explanatory gap, it might support realism. Conversely, if it shows the gap arises from cognitive limitations, it leans illusionist. Neutrality might be impossible if the meta-problem solution inherently addresses the hard problem.

  Among existing views, illusionism might satisfy all but neutrality, HO/repr views might handle modality but not fragility, and realist accounts might not explain fragility. The engineered case could be a litmus test; theories without clear predictions fail.

