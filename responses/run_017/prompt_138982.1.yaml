  ### Structured Propositions Build Task: Activity Design  
  **Goal:** Students encounter the problem of propositional unity through physical construction, experiencing the regress and exploring escapes without technical jargon. The debrief maps their struggles to philosophical positions.

  ---

  #### **Rules & Setup**  
  **Materials per Group (4 groups):**  
  - **Word Cards:** Pre-printed cards for their target sentence (e.g., "Alice", "loves", "Bob").  
  - **Linker Cards:** Blank cards (10+ per group) to serve as "binders."  
  - **String & Tape:** To attach cards (tape only for string-to-card adhesion, not card-to-card).  
  - **Legibility Test Sheet:** For readers to write what they interpret.  
  - **Escape Kits (sealed, distributed only when groups stall):**  
    - **Kit A (Slotted Card):** A card with labeled slots (e.g., "VERB" with subject/object slots).  
    - **Kit B (Hook-and-Loop):** Cards with adhesive backing (e.g., Velcro dots).  
    - **Kit C (Fan-Shaped Card):** A central card with slots/arms for multiple attachments (e.g., labeled "ASSERTOR + RELATION + ARGUMENTS").  

  **Core Rules:**  
  1. **No Bare Adjacency:** Two pieces cannot touch or be taped directly. Every connection requires a labeled linker card.  
  2. **Linker Burden:** Each linker must connect two pieces (e.g., "Alice" and "loves") and be linked to both via string. Since linkers are pieces, they too require linkers for their connections—triggering regress.  
  3. **Legibility Test:** A visitor (from another group) must read the assembly without hints and write the exact claim. If the visitor’s interpretation matches the target, the group scores.  

  **Target Sentences (on slips):**  
  - **Order-Sensitive:** "Alice hates Bob" (Group 1), "Bob hates Alice" (Group 2).  
    - *Tests asymmetric relations; misordered links fail legibility.*  
  - **Order-Insensitive:** "Alice and Bob hate carrots" (Group 3), "Carrots hate Alice and Bob" (Group 4).  
    - *Tests symmetric relations; word order less critical, but combinatorial logic still matters.*  
  - **Why False Claim?** Give Group 4 "Carrots hate Alice and Bob" (implausible). This highlights that *legibility* (structure) ≠ *truth*. Groups focus on structure, not truth conditions.  

  **Scoring Scheme:**  
  - **Success:** Visitor’s written claim matches target sentence.  
  - **Failure:** Visitor reports ambiguity, nonsense, or a different claim.  
  - **No Prizes:** Groups aim for peer validation. Instructor tracks scores symbolically (e.g., checkmarks on whiteboard).  

  ---

  #### **Timeline (90 Minutes)**  
  **0:00–0:10 — Introduction (Instructor Script):**  
  > *"Your task is to physically construct a claim using these materials. For example, if your claim is ‘Alice hates Bob,’ you must bind ‘Alice,’ ‘hates,’ and ‘Bob’ into a single unit that conveys that specific idea. Rules: 1. No two cards can just touch—use labeled linkers for every connection. 2. Linkers must themselves be fully linked. 3. A visitor must read your claim without help. You have 30 minutes. Begin."*  

  **0:10–0:40 — Building (30 min):**  
  - Groups construct their proposition. Instructor circulates:  
    - **Enforce rules:** Intervene if cards touch directly or linkers are unlinked.  
    - **Distribute escapes:** If a group stalls (e.g., buried in linker cards), hand them one kit (pre-assigned: Group 1→A, Group 2→B, Group 3→C, Group 4→A).  
  - **Predicted Stalls:** Groups 1/2 (order-sensitive) stall by 0:20; Groups 3/4 by 0:25.  

  **0:40–0:50 — Legibility Test (10 min):**  
  - **Rotation:** Each group sends one member to read another’s assembly (Group 1→2, 2→3, 3→4, 4→1). Visitors:  
    - Observe silently (no builder interaction).  
    - Write the claim they see on a sheet.  
    - **Prevent Charity:** Announce: *"If the assembly is ambiguous, write what you guess—but no guessing! Only score if it’s clear."*  

  **0:50–1:30 — Debrief (40 min):**  
  1. **Report Scores:** Visitors read their interpretations aloud. Groups reveal targets. Discuss mismatches (e.g., Group 1’s "Alice hates Bob" vs. visitor’s "Bob hates Alice").  
  2. **Map Activity to Philosophy:**  
     - **Regress:** "You kept adding linkers because each binder needed its own binder. This mirrors the *relational regress*: If a relation (like ‘hates’) needs a linker to bind to ‘Alice,’ what binds the linker? The principle ‘binding requires a binder’ creates infinite demand."  
     - **Escape Costs:**  
       - *Slotted Card (Kit A):* "Slots force order (e.g., ‘Alice’ in subject slot), solving directionality. But slots are *special*—they can’t be moved or reused. Like positing *unsaturated relations*, this demands a unique metaphysical category."  
       - *Hook-and-Loop (Kit B):* "Cards grip directly, avoiding regress. But they fuse into a blob—losing distinction between ‘Alice,’ ‘hates,’ and ‘Bob.’ If everything sticks, how do we isolate relations? This risks *holism*, where a thing is defined by its relations."  
       - *Fan-Shaped Card (Kit C):* "The fan holds everything at once without a unified whole. It enables complex claims (e.g., ‘Alice, Bob, hate carrots’), but no single proposition exists. Like the *multiple relation theory*, it reduces unity to mental acts—but then, what is truth?"  
  3. **Takeaways:**  
     - The regress arises from a natural principle ("binding requires a binder").  
     - Escapes solve unity but at a cost (categorical constraints/holism/loss of objectivity).  
     - The debate isn’t *if* there’s a problem, but *which cost is acceptable*.  

  ---

  #### **Predicted Problems & Solutions**  
  1. **Building Pictures, Not Claims:**  
     - *E.g.,* Group 2 draws "Bob" frowning at "Alice."  
     - **Solution:** Intervene early: *"You’re building a scene, not a claim. Use the words as distinct pieces linked by structure."*  

  2. **Covert Taping/Gluing:**  
     - *E.g.,* Group 4 tapes "Carrots" to "hate" to avoid linkers.  
     - **Solution:** Spot during circulation. Enforce: *"Break that direct bond—use a linker or request an escape."*  

  3. **Overly Charitable Readers:**  
     - *E.g.,* Visitor sees a jumble but says "Alice hates Bob" to be nice.  
     - **Solution:** Pre-test warning: *"Ambiguity fails. Be honest—if you’re guessing, it’s not legible."* Have visitors justify interpretations.  

  4. **False Claim Confusion:**  
     - *E.g.,* Group 4 worries "Carrots hate Alice" is "wrong."  
     - **Solution:** Clarify pre-activity: *"We care about structure, not truth. Your job is to make the claim readable, whether true or false."*  

  ---

  #### **What the Activity Cannot Capture**  
  1. **The Completion Condition Contention:**  
     - You’re right—the regress feels fatal because the activity imposes **propositional completion** (a unified, readable whole) as non-negotiable. Real debates contest this: *"Must a proposition be a completed object? Could unity be dynamic (e.g., in acts of judgment)?"* The activity assumes a "thing"-like proposition, sidelining process-based views.  

  2. **Missing Nuances:**  
     - **Predication vs. Combination:** The activity reduces predication to physical binding, ignoring how logic/mind "holds" a subject-predicate unity.  
     - **Abstractness:** Cards are concrete; propositions are abstract types. The tension between tokens and types isn’t explored.  
     - **Truthmakers:** Legibility ≠ truth. The activity sidesteps *why* "Alice hates Bob" corresponds to facts.  

  **Agreement:** Yes, the completion condition is contested. The activity’s regress presses the point that *if* propositions are structured wholes, unity demands explanation. But as the fan escape shows, rejecting completion (e.g., via judgment acts) offers an exit—one philosophers hotly debate.  

  ---

  **Final Tips:**  
  - **Group Dynamics:** Assign roles (builder, linker, rule-checker, scribe) to avoid chaos.  
  - **Escape Timing:** Distribute kits only after genuine struggle (e.g., 5+ linker cards with no end).  
  - **Debrief Anchor:** Whiteboard the three escapes and their costs, linking to positions *after* naming them (Frege: slots; Bradley: holism; Russell: fan).  
  - **Embrace Mess:** If readers misread, use it! *"Why did ‘Bob hates Alice’ become ‘Alice hates Bob’? What did the structure lack?"*  

  This design forces the regress from the rules, lets escapes emerge naturally, and makes costs tangible. Students will see the puzzle’s inevitability—and why philosophers still fight over the fixes.
