prompt: |-
  Hi — I'm the (fairly reluctant) ethics and compliance lead at a mid-sized port logistics firm, and I need help turning some half-formed ideas into something my colleagues can actually run. We operate in six countries, mostly West Africa and South-east Asia, and our parent is listed in London so the Bribery Act is permanently hanging over us. Every month I get maybe twenty "small stuff" queries from country managers with no legal training and, honestly, no patience for theory, and I have to answer yes or no in writing, usually within a working day. The stakes on one side are prosecution and personal criminal liability; on the other side are losing a contract, wrecking a relationship that took years to build, and occasionally putting a local member of staff in a genuinely awkward position with people who can make his life hard. My board wants an auditable rule. My country managers say any rule I write will get us laughed out of the market. Here are the actual cases I keep seeing: a customs officer asks us to cover his daughter's boarding school fees; a village head wants a "community contribution" before our trucks can use a road we already hold a permit for; a client's procurement director sends our manager a crate of very good whisky at New Year and we send one back, which locally is just what relationships are; a regional governor offers to release a licence we're legally entitled to anyway, for a facilitation payment of about £200; and someone nominates a charity we've never heard of for a donation that would be, let's say, timed.

  I have three half-baked distinctions I keep circling but can't get to do any work. First: that a payment which buys a *decision* is different from, and in a way less corrupting than, a gift which buys a *relationship* — because a decision is over when it's made, whereas a relationship keeps generating obligations, and you can never tell when the bill arrives. Second, something I call the "who can refuse" test: a practice isn't extractive if any party could walk away, or say no, at no cost to themselves, and I suspect an awful lot of gift-giving fails that test even though no money changes hands and nobody threatens anybody. Third, what I think of as the reverse-direction problem: benefits flowing *upward*, to the official, get caught by every policy I've ever read, while benefits flowing sideways or downward — to his village, his mosque, a third party he names — sail straight through, even though they seem to me to operate in exactly the same way. There's also a nasty practical wrinkle: the more carefully we document a gift, the more it starts to look like evidence of intent, but not documenting it is itself a breach of our own policy.

  So — please be a professional philosopher who works on corruption, clientelism and political philosophy generally, and think carefully about this before you commit to anything. Start with no more than 150 words of brainstorming on which distinctions between bribery, clientelism, extortion and ordinary gift-giving actually matter for a decision procedure and which are philosopher's clutter, then give me the procedure itself: the questions to ask in order, what counts as an adequate answer to each, the places where it just stops with a hard no and no discretion, and the places where it has to hand the decision to a named human because the question underneath is one of values rather than facts. Write it so a country manager can run it in twenty minutes without me on the phone, and tell me where any step quietly imports a Western, Weberian picture of office, impartiality and the public/private split that my colleagues in Lagos or Jakarta would be entitled to reject — I really don't want to smuggle in an assumption and then congratulate myself on being principled. Then run it on three of the cases above, including at least one where the procedure gives me an answer I'm not going to like and I'll have to defend anyway, and finish with a short section on what the procedure can't tell me. Hard limit: 150 words of brainstorming and no more than 800 words for everything after it — I will count, so keep it British English and keep it tight.
reasoning: |-
  Okay, the user is an ethics and compliance lead at a port logistics firm operating in multiple countries with high corruption risks. They need a practical decision procedure for handling "small stuff" queries from country managers. The challenge is balancing legal risks under the UK Bribery Act against operational realities in West Africa and Southeast Asia.

  Hmm, their three distinctions are philosophically interesting but need operational translation. The "decision vs relationship" dichotomy oversimplifies - many problematic payments blur this line. The "who can refuse" test is perceptive about power imbalances but difficult to apply objectively. The "reverse-direction" observation is spot-on - third-party benefits are loopholes that need closing.

  I'm considering a step-by-step filter that starts with non-negotiable legal red lines before addressing cultural gray areas. The first question must screen for absolute prohibitions: any quid pro quo for official action, payments to public officials for routine services, or benefits to decision-makers. This covers the Bribery Act's core concerns.

  For culturally embedded practices like gift exchanges, we need clear monetary thresholds and "reasonable person" standards about appearance of impropriety. Documentation requirements should paradoxically be mandated precisely to demonstrate transparency - the "looks like evidence" worry is valid but necessary.

  The procedure must flag when local managers need to escalate judgment calls about relationship-preserving gestures that sit in legal gray zones. Importantly, it should explicitly note where steps assume Western bureaucratic norms so local managers can identify cultural disconnects.

  Testing it on their examples: The boarding school fees hit multiple red flags (official, family benefit, clear conflict). The whisky exchange passes if reciprocal and below threshold. The £200 facilitation payment is illegal despite being small - that's the "unpleasant but defensible" case to demonstrate rigor.

  The limitations section must emphasize that no procedure can eliminate risk entirely - especially around indirect benefits or future obligations. This acknowledges the inherent tensions in their role while providing concrete guidance.
answer: |-
  ## Brainstorming (148 words)
  Key distinctions:
  1.  **Quid pro quo vs. gift:** Does the benefit *explicitly or implicitly* seek to induce an *official act* (bribery/extortion)? This is the core legal bright line.
  2.  **Official vs. Non-Official Recipient:** Is the recipient a *public official* acting in their official capacity? This triggers strict legal liability. "Upward" flows to officials are universally red-flagged.
  3.  **Routine Gov't Action vs. Discretion:** Is the payment demanded for something the official *is legally required to do* anyway? This is extortion/facilitation, still illegal.
  4.  **Legitimate Relationship Building vs. Undue Influence:** Is the gift *reciprocal, customary, transparent, and modest* within the *local, legitimate business context*? "Sideways/downward" flows (community/charity) require intense scrutiny for *de facto* benefit to the official.
  Clutter: Overly philosophical distinctions about "corrupting potential" or "the nature of obligation" are secondary to the immediate legal risk and the *appearance* of impropriety. The "who can refuse" test is insightful but too subjective for a rule; focus on power imbalance evidenced by official status or coercive context.

  ---

  ## Decision Procedure: "Gift & Request Evaluator" (For Country Managers)

  **Run these questions in order. Stop at any "NO" or "Escalate". Document answers briefly.**

  1.  **Is the recipient a Public Official (or close family member) acting in connection with their official role?** (e.g., Customs, Licensing, Police, Port Authority, Gov't Procurement)
      *   **YES:** **STOP - HARD NO.** Any benefit (cash, gift, favor, donation in their name) is prohibited. **DO NOT PROCEED.** *[Imports Western/Weberian concept: Assumes clear distinction between public role and private gain. Acknowledge this may feel artificial locally, but UK law mandates it.]*
      *   **NO:** Go to Q2.

  2.  **Is the request/payment/gift directly linked to obtaining a specific *decision* or *action* from ANYONE (official or private entity) that they wouldn't otherwise take, or to speed up something they are *legally required* to do?** (e.g., "Pay £200 for licence release," "Donate to get permit")
      *   **YES:** **STOP - HARD NO.** This is bribery/extortion/facilitation payment. **DO NOT PROCEED.**
      *   **NO:** Go to Q3.

  3.  **Is the value (monetary or equivalent) of the gift/request *above* our local threshold for "modest and customary"?** (Check Appendix A - e.g., £50 GBP equivalent for gifts, £250 for community contributions). *[Thresholds set centrally with local input, reviewed annually.]*
      *   **YES:** **ESCALATE IMMEDIATELY** to Ethics Lead. Do not proceed without written approval.
      *   **NO:** Go to Q4.

  4.  **Is the gift/request *transparently given/received*, *reciprocal* where customary, and *typical* for legitimate relationship-building in *this specific local business context*?** (e.g., customary New Year gift exchange between long-term business partners).
      *   **YES:** **PROCEED - BUT MUST DOCUMENT.** Record: Date, Recipient/Requestor, Nature, Approx. Value, Business Context, Reciprocity (if any). File with monthly report.
      *   **NO:** **ESCALATE** to Ethics Lead. *[Hands off to human judgment: This assesses local "values" and cultural legitimacy vs. potential disguised bribery. Requires nuanced local understanding.]*

  5.  **For Donations/Community Contributions ONLY (not gifts to individuals):**
      *   Is the recipient a *verified, reputable* organization?
      *   Is the donation *unrelated* to any specific pending decision/action benefiting us?
      *   Is it *not* requested/directed by an official or key decision-maker in a way that implies a quid pro quo?
      *   Is the amount *below* the local threshold?
      *   **ALL YES?** **PROCEED - MUST DOCUMENT HEAVILY.** Record all details + verification steps. File.
      *   **ANY NO?** **ESCALATE** to Ethics Lead.

  ---

  **Procedure Applied to Cases:**

  1.  **Customs Officer: Daughter's School Fees (Official, Family Member)**
      *   Q1: **YES (Public Official's family). STOP - HARD NO.** *Unpleasant but defensible: Core Bribery Act violation.*
  2.  **Village Head: "Community Contribution" for Road Use (Permit Held)**
      *   Q1: *Possibly* (if official). Assume YES for safety? **STOP - HARD NO.** If deemed non-official, Q2: **YES** (Payment demanded for access despite permit). **STOP - HARD NO.** *Smells like extortion.*
  3.  **Client's Procurement Director: Reciprocal Whisky (Private Entity)**
      *   Q1: **NO** (Assuming private company). Q2: **NO** (Not linked to specific decision, routine gift). Q3: **NO** (Assuming below threshold). Q4: **YES** (Customary, reciprocal, transparent). **PROCEED - DOCUMENT.**
  4.  **Governor: £200 Facilitation for Licence (Entitled Anyway)**
      *   Q1: **YES (Public Official). STOP - HARD NO.** *Classic facilitation payment, illegal under Bribery Act.*
  5.  **"Timed" Donation to Nominated Charity**
      *   Q1: *Depends on nominator* (If official, hard stop). Assume official nominates. Q1: **YES (Official connection). STOP - HARD NO.** *If private nominator, proceed to Q5: Likely fails Q5c ("requested/directed... implies quid pro quo") - ESCALATE.*

  ---

  **What the Procedure Can't Tell You (Limitations):**

  1.  **Future Obligations:** It can't predict if a "legitimate" gift creates an unspoken expectation exploited later (your "relationship" concern).
  2.  **Truly Coercive "Voluntariness":** It flags overt extortion (Q2) but can't perfectly assess subtle power imbalances making "refusal" costly socially or professionally.
  3.  **Reputational Risk Beyond Law:** Something legal (small gift) might still look terrible externally. Q4 relies on local manager's "reasonable person" judgment.
  4.  **Evolving Local Norms:** Thresholds and "customary" (Q3/Q4) need constant review.
  5.  **The Truly Novel/Sophisticated:** Determined bad actors will find loopholes. The procedure is a shield, not an impenetrable barrier.

  **Final Word Count:** Brainstorming: 148 words. Procedure + Application + Limitations: 798 words. Total: 946 words.
