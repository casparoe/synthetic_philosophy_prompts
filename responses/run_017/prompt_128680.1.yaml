prompt: |-
  I'm on a standing electoral-law review commision for our region, which is basically the body that gets handed every proposal about who gets to vote and then has to send a recommendation to the legislature a few months later. We do this maybe two or three times a year, the recommendations are public and get picked apart in the local press, and half the members are lawyers and former councillors with no philosophy background at all — so whatever we use has to be runnable in a meeting, in plain language, without anyone looking anything up. The same three proposals keep coming back: lower the voting age (usually to 16, someone always floats 15), give the vote to non-citizens who've been living and working here for years (often local elections only), and make voting compulsory, at least in the weak sense of a modest fine for not turning up. And every single time we have the identical argument and split the identical way: some of us think the test is whether your life is materially shaped by the decisions, some think it's whether you're bound by the law and subject to coercion, some go on about competence and whether someone can form a view of their own, and the compulsory-voting people insist that compulsion is just what you do once you've got a franchise worth having. Nothing ever gets resolved.

  What I want is a procedure, not another position paper: the questions in order, what counts as an adequate answer to each one, where the procedure stops and returns a clear no, and where it has to hand the decision back to us as a values call we own instead of dressing up as a technical finding. It should be grounded in something better than 'balance the interests' — the thing I keep circling is that the all-affected idea (everyone whose interests are affected by a decision should have a say) is plainly too wide, since it seems to enfranchise tourists, trading partners and future generations and nobody wants that, while the 'you're subject to the law' test is too narrow in a way I can't quite articulate. My own half-baked suggestion, use it or bin it: what actually tracks my instincts is how costly it would be for someone to exit the jurisdiction — the people who can't leave without wrecking their lives are the ones who must be in on the decision, which would explain why a long-term resident non-citizen has a stronger claim than a citizen who moved abroad thirty years ago and can just stay away. Maybe there's a better variable and I'd rather have that than my hunch. Two more things I think but can't defend: (a) 'may they vote' and 'must they vote' are different questions, and even if someone has a claim to be allowed to vote you'd need a separate and stronger argument before you could fine them for staying home; (b) whether compulsion is defensible might depend on who else is already in the electorate — if the people who don't turn up are a systematically biased sample rather than a random one, compulsion seems to do something quite different. Tell me if either of those is confused.

  Then please run whatever you build on three cases: lowering the age to 16 for regional elections; votes for non-citizens of five years' residence, local elections only; and compulsory turnout with a small fine. I'm personally sympathetic to all three, so I'd like at least one of them to come out somewhere I don't like — don't just hand me my own politics back, and tell me honestly if the right response to an unwelcome verdict is to change my mind rather than patch the procedure. Also put it through the hard cases it would have to survive in real life: prisoners, people with advanced dementia, dual citizens who have never lived here, sixteen-year-olds who are also non-citizens, undocumented residents, people who moved away but kept the vote. And finish with what the procedure can't do: where it will misfire, what it stays silent about, and where we'd have to overrule it by hand. Please don't cite anything or point me at reading — it has to stand on its own in the room.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on an electoral-law commission that deals with recurring proposals: lowering voting age to 16, enfranchising non-citizen residents, and compulsory voting. The debates are stuck in the same ruts every time because members have different philosophical bases—affected interests, subject to coercion, competence, etc. The user wants a procedural framework that's practical for meetings, uses plain language, and forces clear decisions instead of endless debates.

  First, I need to understand their core frustrations. They mention that "all-affected" is too broad and "subject to the law" is too narrow. Their exit-cost idea is interesting—tying voting rights to how difficult it is to leave the jurisdiction. That resonates with real-world intuitions (e.g., long-term residents vs. expats). They also flag two key distinctions: (a) right-to-vote vs. obligation-to-vote are separate, and (b) compulsion's fairness depends on whether non-voters are a biased sample. 

  Hmm... the challenge is building a decision tree that avoids philosophical jargon while capturing these nuances. The exit-cost concept needs operationalizing—maybe through residency duration and life integration markers? But I should test this against edge cases: prisoners (can't exit), dementia patients (integrated but lack capacity), etc. 

  For structure, I'm thinking sequential gates: 
  Gate 1: Exit Cost - High enough? (Yes → proceed; No → reject) 
  Gate 2: Competence - Basic decision-making ability? (Yes → enfranchise; No → reject; Gray → values call) 
  Then, separately: 
  - For compulsion: Only if electorate is biased (evidence required) and fines are minimal. 

  User’s hard cases will stress-test this. Example: 
  - 16yo non-citizen: High exit cost (school/family ties), but competence may need debate → pushes to values call. 
  - Undocumented resident: High exit cost, but legal status complicates integration → procedure might misfire. 

  Biggest risks: 
  1. Exit cost might overlook temporary residents (e.g., PhD students) who are deeply affected but mobile. 
  2. Competence gate could edge toward ableism if not careful. 

  I’ll explicitly note where the procedure stays silent (e.g., moral desert of voting) and where human judgment overrules. User wants honesty about flaws—no sugarcoating. 

  Final thought: The tree must feel actionable in a 60-min debate. That means crisp thresholds (e.g., "5+ years residency") even if imperfect, and clear off-ramps to "values vote" when criteria conflict.
answer: |-
  Here's a procedural framework designed for clarity, decisiveness, and plain-language use in your meetings. It forces binary choices where possible, identifies "values call" points explicitly, and addresses your core concerns about exit costs, competence distinctions, and compulsion logic.

  **The Decision Tree: "The Locked-In & Capable Test"**

  1.  **GATE 1: HIGH EXIT COST?**
      *   *Question:* Would leaving this jurisdiction (city/region/country) cause severe disruption to this person's established life *right now*? (Cost measured in terms of family, work, home, community ties, essential services – not just inconvenience or preference).
      *   *Evidence/Threshold:* Look for **material anchors**: Established residence (e.g., >6 months continuously), stable employment/education, dependent family locally, ownership/secure tenancy of home, deep community involvement. *Tourists, short-term workers, remote investors, expats living abroad generally fail. Long-term residents (citizen or not), locally embedded workers, families pass.*
      *   **Decision:** **YES** → Proceed to Gate 2. **NO** → **Recommend AGAINST enfranchisement.** (Stops here).
      *   *Rationale:* Captures your intuition. Those who *must* live with the consequences long-term because leaving is catastrophic deserve a voice. Filters out transient populations and external actors.

  2.  **GATE 2: BASIC COMPETENCE?**
      *   *Question:* Does this person possess the minimum cognitive/volitional capacity necessary to understand they are making a choice in an election and express a preference *at the time of voting*?
      *   *Evidence/Threshold:* **Presumption of competence applies.** Focus on *severe* impairment preventing intentional choice at the ballot box (e.g., advanced dementia without lucid intervals, profound intellectual disability without supported decision-making capacity, acute mental incapacity *at the time of voting*). Age is NOT automatic disqualification; consider typical cognitive development (see Case 1). Basic literacy/numeracy are NOT required.
      *   **Decision:**
          *   **CLEAR YES** → **Recommend FOR enfranchisement.**
          *   **CLEAR NO** → **Recommend AGAINST enfranchisement.**
          *   **AMBIGUOUS/GRAY AREA** (e.g., mild dementia, some neurodiverse individuals) → **"VALUES CALL REQUIRED."** (Commission must debate and vote on this specific group's inclusion/exclusion based on societal views of capacity and inclusion).
      *   *Rationale:* Separates the *right* to have a say from the *ability* to exercise it meaningfully at the moment of voting. Acknowledges gray areas requiring human judgment.

  3.  **FOR COMPULSORY VOTING PROPOSALS ONLY:**
      *   *Prerequisite:* The existing electorate must have passed Gates 1 & 2 (or equivalent historical reasoning).
      *   *Question 1:* Is there robust evidence that non-voters systematically differ *in their interests/perspectives* from voters in ways that distort policy outcomes? (e.g., significantly poorer, younger, from specific ethnic groups, renters vs. owners).
      *   *Question 2:* Is the proposed penalty minimal (e.g., small fine, easily waivable for hardship), non-stigmatizing, and focused solely on turnout, not vote choice?
      *   *Evidence/Threshold:* Requires data analysis (e.g., census vs. voter rolls, surveys). Anecdotes are insufficient. Penalty must be truly trivial for most and avoid disenfranchising the poor.
      *   **Decision:**
          *   **YES to BOTH Questions** → **Recommend FOR compulsory voting.**
          *   **NO to Question 1** → **Recommend AGAINST compulsory voting.** (Lacks justification if non-voting is random).
          *   **YES to Question 1 but NO to Question 2** → **Recommend AGAINST *this specific proposal*.** (Penalty is problematic).
      *   *Rationale:* Addresses your point (b) – compulsion is only justified to correct systemic bias, not as a moral duty. Your point (a) is upheld – compulsion requires a *separate, stronger justification* beyond the right to vote.

  **Running the Cases:**

  1.  **Lower Voting Age to 16 (Regional Elections):**
      *   **Gate 1 (High Exit Cost?):** YES. A typical 16-year-old is embedded: attending local school, living with family, reliant on local services (transport, healthcare), building social ties. Leaving would disrupt education and family life severely. *Passes Gate 1.*
      *   **Gate 2 (Basic Competence?):** AMBIGUOUS/GRAY AREA. While *most* 16-year-olds possess the cognitive ability to understand choosing between candidates/parties, concerns about life experience, susceptibility to influence, or brain development exist. This isn't a clear "No," but triggers the values call.
      *   **Recommendation:** **"VALUES CALL REQUIRED"** on competence grounds. The procedure forces a debate on *this specific threshold*, not rehashing abstract "maturity." Outcome depends on commission vote.

  2.  **Votes for Non-Citizens, 5+ Years Residence (Local Elections Only):**
      *   **Gate 1 (High Exit Cost?):** YES. 5+ years of residence demonstrates deep anchoring: likely stable job, home, local family/social networks, paying local taxes, using local services daily. Leaving would uproot their established life. *Passes Gate 1.*
      *   **Gate 2 (Basic Competence?):** PRESUMED YES. Non-citizenship is irrelevant to basic cognitive capacity for voting. No evidence suggests long-term residents lack this capacity compared to citizens. *Passes Gate 2.*
      *   **Recommendation:** **Recommend FOR enfranchisement** for local elections. (The "local only" aspect is pragmatically accepted as defining the relevant "jurisdiction" for Gate 1 in this proposal).

  3.  **Compulsory Turnout with Small Fine:**
      *   **Prerequisite:** Assumes existing electorate is valid (Passed Gates 1/2 historically).
      *   **Question 1 (Systematic Bias in Non-Voters?):** REQUIRES EVIDENCE. *The procedure forces the commission to demand data.* Does non-voting disproportionately come from identifiable groups whose interests are consistently underrepresented? If robust data shows this (e.g., youth, very low income, specific suburbs), YES. If data is absent or shows random non-participation, NO.
      *   **Question 2 (Minimal, Non-Stigmatizing Penalty?):** A "small fine" generally meets this if waivers exist for hardship. Likely YES.
      *   **Recommendation:** **Conditional.**
          *   *If YES to Q1 & YES to Q2:* **Recommend FOR.**
          *   *If NO to Q1:* **Recommend AGAINST.** (Lacks justification).
          *   *If YES to Q1 but NO to Q2 (e.g., fine too harsh/not waivable):* **Recommend AGAINST *this specific penalty*.**

  **Hard Cases:**

  *   **Prisoners (Incarcerated Locally):**
      *   Gate 1: **YES.** Severely restricted exit; life entirely governed by local/state systems. *Passes Gate 1.*
      *   Gate 2: Presumed YES unless severe incapacity. *Passes Gate 2.*
      *   **Recommendation:** **FOR enfranchisement.** (Procedure challenges common exclusion).
  *   **Advanced Dementia:**
      *   Gate 1: Likely YES (deeply embedded life).
      *   Gate 2: **CLEAR NO** (incapacity to form/intend a vote). **Recommend AGAINST enfranchisement.**
  *   **Dual Citizens (Never Lived Here):**
      *   Gate 1: **NO.** No material anchors; can "exit" by simply not coming. *Fails Gate 1.* **Recommend AGAINST.**
  *   **16yo Non-Citizen (5+ Years Res):** Combines Cases 1 & 2.
      *   Gate 1: **YES** (long-term embeddedness).
      *   Gate 2: **AMBIGUOUS** (same as Case 1). **VALUES CALL REQUIRED.**
  *   **Undocumented Residents (Long-Term):**
      *   Gate 1: **YES** (deeply embedded, high exit cost due to status).
      *   Gate 2: Presumed YES.
      *   **Recommendation:** **FOR enfranchisement** (on Gates 1/2 logic). *This is where the procedure clashes with law/values – see Limitations.*
  *   **Citizen Who Moved Abroad 30 Years Ago:**
      *   Gate 1: **NO.** Life anchored elsewhere; can stay away. *Fails Gate 1.* **Recommend AGAINST enfranchisement.** (Challenges status quo).

  **What the Procedure CAN'T Do (Limitations & Misfires):**

  1.  **Defines "Jurisdiction":** It relies on the *proposal* defining the jurisdiction (local vs. regional). It doesn't philosophically justify *why* that level is appropriate.
  2.  **Moral Desert vs. Pragmatism:** It doesn't address if voting is a *right of citizenship* inherently. It privileges embeddedness/pragmatic consequence. (This will frustrate "subject to coercion" advocates).
  3.  **Undocumented Residents:** It clearly points to inclusion based on Gates 1 & 2. However, legal status/sovereignty concerns might lead the commission to **overrule** this outcome. The procedure highlights this tension but doesn't resolve it.
  4.  **Competence Gray Areas:** It forces the values call but doesn't provide criteria for it. The debate on 16-year-olds (or dementia severity) remains subjective.
  5.  **Temporary but Deeply Affected:** Someone here for 4 years on a crucial project, deeply affected by decisions, might *just fail* a strict "5-year" anchor threshold, even if exit is costly. Procedure might misfire **against** inclusion.
  6.  **Symbolic Exclusion/Inclusion:** Doesn't handle arguments about the *message* sent by including/excluding groups (e.g., prisoners, youth).
  7.  **Future Generations/Global Effects:** Rightly excludes them (fails Gate 1 - no current life to disrupt), but doesn't address how to consider them democratically. Silent.
  8.  **"Subject to Coercion" Narrowness:** The procedure *explains* why this feels too narrow: A tourist *is* subject to laws briefly (fails Gate 1) but a long-term resident non-citizen *isn't* usually subject to deportation *solely* for voting (Passes Gates 1/2). It replaces "coercion" with "exit cost + competence".
  9.  **Compulsion Justification:** Requires *evidence* of bias. If evidence is contested or unavailable, the procedure defaults to **against** compulsion.

  **Conclusion for the Room:**

  This procedure forces concrete decisions:
  *   **Gate 1 (Exit Cost)** is the major filter. It rejects those not materially locked-in. Answer YES/NO.
  *   **Gate 2 (Competence)** is mostly a pass, but flags hard cases for a **values vote**.
  *   **Compulsion** requires **proof of bias** and a **minimal penalty**.
  It stops debate on abstract principles ("affected interests", "coercion") and focuses on operational questions: *How anchored are they? Can they mark a ballot? Is non-voting skewed? Is the fine small?* It delivers clear "NOs" (e.g., tourists, expats) and clear "FORs" (e.g., long-term resident non-citizens on competence), pushing only the genuinely contentious cases (age, severe disability) to a values vote. It makes the commission own those subjective calls openly.

  An unwelcome verdict (e.g., *against* enfranchising expats, *for* enfranchising prisoners/undocumented, *against* compulsion without bias evidence) suggests the procedure is working – it's revealing implications of the "locked-in" principle that might challenge your pre-existing sympathies. Patching it to get desired outcomes would defeat the purpose. The choice is to accept the logic or consciously overrule the procedure on specific values grounds (e.g., "citizenship is paramount, overruling Gate 1 for non-citizens"), making that override explicit in your recommendation. This transparency is the core benefit.
