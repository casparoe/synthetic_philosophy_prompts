prompt: |-
  Hey — I need someone to settle an argument, and I figure you're the right kind of person for it: please answer as if you were a statistician who also does philosophy of science, the sort who has refereed for methods journals on both the frequentist and the Bayesian side of this fight. Take your time, brainstorm a bit before you commit to anything, and don't just tell me what the textbook says. Context: I'm a first-year PhD student in cognitive psychology, our department has more or less split into two camps over the replication mess, and I keep getting pulled both ways and can't tell which moves in their argument are actually good. The case they always argue over: a classic between-subjects priming study run at n = 40 per cell that reported d = 0.50, p = 0.028; then a preregistered multi-lab replication with roughly thirty times the total sample (about 1,200 per group) that lands at d = 0.02 with a 95% CI of about [-0.06, 0.10]. Assume for the sake of argument that this is representative, i.e. in this literature something like two thirds of replication effect estimates fall outside the original paper's 95% CI. Marta is in camp A, Devin is in camp B, and last week they went five rounds in the seminar room while I sat there uselessly:

  (1) Marta: that original p = 0.028 was reported as if it were evidence for the effect, but feed the same data into a Bayes factor with any halfway sane prior on effect size and you get something that barely moves the needle — a p-value just under .05 is much weaker evidence than everyone behaves like it is, and there's even the thing where a fixed p-value turns into evidence *against* the point null as n grows. That gap is a large part of why the literature doesn't hold up. (2) Devin: possibly, but that's a complaint about how people read p-values, not about the machinery. The actual cause is selection plus low power. Run Bayes factors through the same publication filter and you'd get an equally broken literature, because journals select results, not estimators. (3) Marta: not equally broken. The prior is precisely the place where you can encode 'effects in this area are probably small,' so an honest Bayesian shrinks toward zero automatically, whereas your CI is built out of the data in front of you and gets bloated by the significance filter — anything that clears the bar at n = 40 per cell is systematically too large, and the smaller the true effect the worse the exaggeration. Also, for the replication itself I have an actual answer to 'did it replicate': score the replication data against what the original study predicted instead of just pointing out that the replication's own p is above .05. (4) Devin: that move tests the replication against a prediction that's already contaminated — if the original estimate was inflated by selection, then a real-but-smaller effect gets recorded as a failure, so you've laundered the bias rather than removed it. And your 'honest prior' cuts both ways, since the prior is exactly where an enthusiast smuggles the effect back in, while error rates are at least checkable in principle by an auditor who sees the whole run of studies. (5) Marta: checkable by nobody in practice, though. The guarantee attaches to a procedure applied to *every* analysis, and what gets published is a biased sample of its outputs, so the advertised error rate gets spent by selection and never shows up anywhere a reader can see it — good long-run properties go in, and a literature of overconfident claims comes out; I call it evidential laundering. My Bayesian output is auditable one study at a time, conditional on a prior we can argue about in public.

  I don't want to be told which camp to join — I want the exchange adjudicated. Give me exactly five numbered items, one per move, no intro and no conclusion, a sentence or two each: rate every move on a scale from clearly mistaken / more wrong than right / half right / more right than wrong / clearly right, say exactly which part of the move survives and why, and don't split the difference out of politeness — if a move is straightforwardly wrong, say so plainly. In item five, after your verdict on Marta's last move, add one sentence on what you think both of them are missing (I have a hunch it's something about decisions and losses, or about whether 'the effect' is even a single quantity across labs, but you tell me) and one sentence on what would change your verdict — which argument, or which fact about the numbers above, would make you flip. Also flag anywhere you're reasoning from a premise that's contested rather than from something both camps would grant. Sorry if this is definately more than you bargained for.
reasoning: |-
  Okay, let me approach this as a statistician-philosopher hybrid. The user presents a nuanced debate between Marta (Bayesian perspective) and Devin (frequentist perspective) regarding replication failures in psychology. 

  First, I need to unpack Marta's opening argument about p-values. She's correct that p=0.028 often gets misinterpreted as strong evidence, when Bayesian analysis with sensible priors would show it's weak. The Lindley paradox point about evidence flipping against the null with large n is technically valid but practically overstated here - we're looking at n=40 vs n=1200, not infinity. Still, her core insight about p-values overstating evidence holds water.

  Devin's counter about selection bias being the root cause strikes me as more right than wrong. Publication filters would distort any statistical approach, and his point about Bayesian journals facing similar issues feels historically accurate. Though he slightly undersells how Bayesian methods might mitigate some problems.

  Marta's second move about shrinkage and CI bloating has merit - selection bias does inflate effect sizes in low-powered studies, and Bayesian approaches naturally counteract this through priors. Her replication assessment method is also conceptually stronger than just checking p>0.05. But Devin's contamination concern is valid: if the original estimate is biased, testing against it propagates error.

  On error rates, Devin makes a strong theoretical point about frequentist methods being verifiable in principle, but Marta's evidential laundering metaphor is painfully accurate - published literature distorts the actual error rate performance. The auditability of Bayesian outputs study-by-study is genuinely advantageous for scientific discourse.

  What both miss: They're treating "the effect" as a fixed universal constant, ignoring that effect sizes often vary across contexts and populations - this heterogeneity explains many replication failures better than statistical flaws alone. Also, neither addresses how decision-theoretic approaches (weighing costs of errors) could reframe the debate.

  For the flip condition: If we saw Bayesian meta-analyses consistently outperforming frequentist ones in predicting replication effects, that would strongly favor Marta. Conversely, evidence that publication bias corrupts Bayesian outputs equally would vindicate Devin.

  The most contested premise remains whether we can specify "sane priors" objectively - frequentists see this as subjective backdoor, Bayesians as necessary incorporation of domain knowledge.
answer: |-
  Here is the adjudication, move by move, as requested:  

  **(1) Marta on p-values vs. Bayes factors**  
  *More right than wrong.* The core claim survives: a p≈0.028 with n=40 is weak evidence under sensible priors (e.g., half-normal σ=0.3). The Lindley paradox point (evidence flipping against H₀ as n→∞) is mathematically correct but contextually overstated here—the replication’s n is large but finite. *Contested premise*: That "any halfway sane prior" is universally agreed upon; frequentists dispute this.  

  **(2) Devin on selection vs. machinery**  
  *More right than wrong.* Selection bias (p-hacking, publication filters) is a primary driver of replication failure, and Bayes factors *would* be distorted by the same incentives (e.g., prior-hacking). But he undersells how Bayesian *reporting* (e.g., posterior distributions) better exposes uncertainty than dichotomous p-values.  

  **(3) Marta on shrinkage and replication assessment**  
  *Half right.* Correct that Bayesian shrinkage mitigates selection-induced exaggeration (e.g., a skeptical prior pulls d=0.50 toward zero). Testing replication data against the *original posterior* is indeed superior to checking p>0.05. *But*: She conflates "CI bloating" (a misnomer; CIs are accurate for *that study*’s data) with *bias in point estimates*.  

  **(4) Devin on contaminated predictions and priors**  
  *Clearly right on contamination, more wrong than right on auditing.* Testing replications against inflated original estimates *does* propagate bias. However, his "auditor" argument fails: frequentist error rates (α, Type I/II) *are* invalidated by selection bias—you cannot observe the counterfactual "run of studies." *Contested premise*: That priors are uniquely vulnerable to enthusiasm; p-hacking is equally subjective.  

  **(5) Marta on evidential laundering and auditability**  
  *More right than wrong.* "Evidential laundering" aptly describes how selection breaks frequentist long-run guarantees. Bayesian outputs (posteriors, BFs) *are* auditable conditional on an explicit prior, enabling coherent debate.  
  *What both miss*: Effect sizes (δ) are likely *heterogeneous* across contexts/labs—treating δ as fixed ignores how procedural variations cause effect variability, explaining many "replication failures."  
  *What would flip the verdict*: Evidence that Bayesian analyses with *community-agreed priors* reliably outperform frequentist methods *despite* publication bias in real-world meta-scientific studies.
