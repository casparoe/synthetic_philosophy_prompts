prompt: |-
  You are a professional philosopher with research strengths in both philosophy of mind and philosophy of biology, and with long experience of coaching graduate students through their first conference papers. Please think this through carefully before writing anything: start by sketching, one line each, the commitment that each person in the audience I describe below is least willing to give up, and let those commitments generate the objections, rather than reaching for a generic list of worries about mechanism or artificial intelligence. Only then draft the prep sheet. Do not pad it with advice about slides, pacing or body language; I have been giving seminars for forty years.

  The occasion: I am a retired structural biologist — protein crystallography, mostly — who has, since retiring, been auditing graduate seminars in philosophy and has been invited, somewhat to my own surprise, to give the paper at a joint session of a philosophy of mind reading group and a history and philosophy of science seminar at a British university: forty minutes plus twenty of questions. The thesis I want to defend is a claim of non-parallelism. Darwin and Turing are usually said to have performed the same strange inversion: in each case an apparently intelligent competence — adaptive fit in one, reasoning in the other — is shown to arise from processes that involve no comprehension at all, and the argument that seemed to require comprehension as the source of the competence is turned on its head. I want to argue that the two inversions are structurally different, and in a way that matters. Darwin's inversion removes comprehension from the causal history of a capacity but leaves it firmly in place in the person who offers and accepts the explanation: selection theory is itself a product of comprehension and is offered as a reason for belief. Turing's inversion takes reasoning itself as its object, and so applies to whatever grounds anyone, including me, might offer for it; it therefore admits of what I call the reflexivity leak — the account, if true of the reasoning of the person who accepts it, removes the ground on which it is accepted. My conclusion is that the idea now labelled competence without comprehension can be exported from biology only where the question is how a capacity came to exist, and cannot be exported to questions about meaning, correctness or normativity: competences can be manufactured without comprehension, but their manufacture cannot settle whether they get anything right. I then want to add, as a corollary I expect to be attacked, that contemporary deep learning is best read as a third inversion of the Darwinian, selectional type rather than of the Turing, formal type — competence extracted by optimisation over an enormous space, with no comprehension anywhere in the loop — and that we should therefore expect from it the Darwinian pattern of brute surprise rather than the Turing pattern of guaranteed compositionality; if that is right, the leak I describe attaches to our use of these systems in a very different way from the one that usually gets discussed. My argument runs in four moves: the parallel statement of the two inversions; the diagnosis of the asymmetry as one between causal history and justification; the reflexivity objection and why it bites only on the second; and the corollary about machine learning.

  The audience, as I understand it: a senior philosopher of mind of broadly Dennettian sympathies, who thinks competence without comprehension dissolves rather than relocates the problems about meaning, and who will hear my asymmetry as backsliding into a dualism about reasons; a philosopher of biology who will insist that selection is not a filter in the sense my argument needs, that Darwin's own case already has normative structure because it is an inference to the best explanation, and that the distinction between causal history and justification is one Darwin did not have; a linguist of rationalist sympathies who thinks the interesting question is whether there is a genuine generative theory behind the competence and who will regard behavioural success as the wrong measure of competence in the first place; a younger enactivist who holds that comprehension is not an inner representational state at all, and that my whole framing is intellectualist in a way that begs the question; and two machine-learning researchers who will argue that stochastic gradient descent is not selection — no population, no reproduction, no heredity in the relevant sense — so that either my Darwinian reading of deep nets is a metaphor that does no work, or I owe them a much more careful account of what the selectional structure is supposed to be. Assume I have about two minutes to answer each question.

  What I need from you is the prep sheet: the eight or so objections I will actually get from these people and not from some generic seminar audience, ordered by how much damage they would do to the thesis rather than by how likely they are, each phrased in the idiom of the person who raises it, each with a two-minute reply and a candid note on where that reply is soft. Tell me which two things I should concede in the first five minutes so that the room does not spend the question period fighting over them instead of over the real claim, which single reply has to land if the paper is to survive at all, which objector is in fact a covert ally whose question I should welcome and rephrase, and — this is the part I care about most — the question I am hoping nobody asks, together with an honest sketch of what I would say and why my answer there is weakest. If you think one of my four moves will collapse before I get to the corollary, say so plainly and tell me which move to cut and what the talk then becomes.
