answer: |-
  Below is a decision tree structured to help students navigate the logical space of answers to the boundary problem ("Who constitutes the demos?"). It uses concrete cases to guide branching, requires no prior knowledge of named theories, and isolates key distinctions (affectedness criteria, level-relativity, corporate agency, and necessity vs. pro tanto status). The tree has **1 start node, 9 branch nodes, and 9 leaves** (including an "unexplored" leaf and a power-based view). Leaves are summarized in a table with awkward commitments.

  ---

  ### **Decision Tree: Who Belongs in the Demos?**
  *Start at Q1. Answer based on cases (e.g., commuter, foreign farmer, non-citizen resident).*

  **Q1:** Should the group making a decision **always include everyone bound by its enforcement** (e.g., a tourist fined for breaking a local law)?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  **Q2:** Should it **also exclude some people bound by enforcement** if they lack a "stake" in the polity (e.g., a tourist passing through, or a resident who rejects state authority)?  
  - **Yes** → Go to Q4.  
  - **No** → **Leaf: All-Subjected Principle** (Position: Include all subject to enforcement).  
    *Awkward: Tourists vote on permanent policies during a 3-day stay.*  

  **Q3:** Can a group **rightfully exclude people deeply affected by a decision** (e.g., farmers abroad whose water is cut by your dam)?  
  - **Yes** → Go to Q5.  
  - **No** → Go to Q7.  

  **Q4:** Is the key stake **permanent residence** (e.g., include a 20-year non-citizen taxpayer, exclude an emigrated citizen with no property)?  
  - **Yes** → **Leaf: Permanent Resident Principle**.  
    *Awkward: Incarcerated people and children must vote if resident.*  
  - **No** → **Leaf: Civic Stakeholder Principle** (Unnamed: Mix of residency + "investment").  
    *Awkward: Arbitrary thresholds for "investment" (e.g., taxes paid vs. family ties).*  

  **Q5:** Is the demos **fixed by pre-existing membership** (e.g., exclude non-citizens even if affected)?  
  - **Yes** → Go to Q6.  
  - **No** → **Leaf: Constitutive Power View** (Position: Demos defined by power, not principle).  
    *Awkward: Ratifies exclusion without justification (e.g., long-term non-citizen resident).*  

  **Q6:** Should **citizens abroad vote** if they no longer live/work in the polity (e.g., emigrated citizen)?  
  - **Yes** → **Leaf: Formal Citizenship Principle**.  
    *Awkward: Emigrated citizens vote on policies that don’t affect them.*  
  - **No** → **Leaf: Resident Citizen Principle**.  
    *Awkward: Excludes non-citizen residents after 20 years.*  

  **Q7:** Does "affected" mean **any causal effect** (e.g., a foreign corporation facing tariffs)?  
  - **Yes** → **Leaf: All-Affected (Minimal Causal) Principle**.  
    *Awkward: Foreign corporations or states vote on trade policies.*  
  - **No** → Go to Q8.  

  **Q8:** Does it require **harm to basic interests** (e.g., farmers losing water) **or disruption to life plans** (e.g., commuter’s job relies on transit)?  
  - **Basic interests** → Go to Q9.  
  - **Life plans** → **Leaf: All-Affected (Life Plans) Principle**.  
    *Awkward: "Life plans" are subjective (e.g., is tourism a "plan"?).*  

  **Q9:** Can feasibility **override inclusion** (e.g., exclude future generations for nuclear waste)?  
  - **Yes** → **Leaf: All-Affected (Pro Tanto) Principle** (Position: Affectedness is a pro tanto reason).  
    *Awkward: Permits exclusion by practical limits, not fairness.*  
  - **No** → **Leaf: All-Affected (Necessary) Principle**.  
    *Awkward: Impractical demos (e.g., global votes on climate issues).*  

  ---

  ### **Leaf Positions Summary**
  | Leaf Position                     | Key Commitment                                                                 | Awkward Case                                                                 |
  |-----------------------------------|-------------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **All-Subjected Principle**       | All bound by enforcement must be included.                                   | Tourist votes on long-term laws during a 3-day stay.                        |
  | **Permanent Resident Principle**  | Demos = all permanent residents (ignore citizenship).                        | Incarcerated people and children vote on prison/school funding.             |
  | **Civic Stakeholder Principle**   | Demos = residents + others with "investment" (e.g., taxes, property).        | Thresholds for "investment" are arbitrary (e.g., commuter in tax case).     |
  | **Constitutive Power View**       | Demos is defined by power; no prior principle.                               | Excludes long-term non-citizen resident without justification.              |
  | **Formal Citizenship Principle**  | Demos = all citizens, regardless of residence/affectedness.                  | Emigrated citizen votes on policies they won’t experience.                  |
  | **Resident Citizen Principle**    | Demos = citizens residing in the territory.                                  | Excludes non-citizen resident after 20 years.                               |
  | **All-Affected (Minimal Causal)** | Include anyone causally affected (even trivially).                           | Foreign corporations vote on tariffs.                                       |
  | **All-Affected (Life Plans)**     | Include those whose life plans are disrupted.                                | "Life plans" are vague (e.g., tourist's vacation plans).                    |
  | **All-Affected (Pro Tanto)**      | Affectedness is a pro tanto reason (overruled by feasibility/stability).     | Excludes future generations for nuclear waste due to "infeasibility."       |
  | **All-Affected (Necessary)**      | Affectedness is necessary/sufficient; demos floats per-issue.                | Global demos for local issues (e.g., foreign farmers vote on your dam).     |

  ---

  ### **Key Notes & Limitations**
  1. **Unseparated Pairs**:  
     - **Permanent Resident vs. Civic Stakeholder**: Both include long-term non-citizens, but the tree cannot distinguish "residency-only" vs. "residency + investment" thresholds without a dedicated node.  
     - **Pro Tanto vs. Necessary Affectedness**: The tree routes feasibility to pro tanto, but both leaves use the same affectedness criterion (basic interests).  

  2. **Omissions by Design**:  
     - **Corporate Agency/Level-Relativity**: Deliberately excluded to avoid complexity. Most positions assume a fixed demos (rejecting per-issue floating) except the necessary affectedness leaf.  
     - **"Unexplored" Leaf**: The Civic Stakeholder Principle leaf is unnamed (no major theorist defends it) due to incoherent thresholds.  

  3. **Power-Based View**:  
     - The Constitutive Power View is flagged as a *refusal of the question* (replaces justification with ratification of power).  

  4. **Case Diagnostics**:  
     - **Tourist** (Q1, Q2) tests enforcement vs. stake.  
     - **Foreign Farmer** (Q3, Q7) separates affectedness from authority.  
     - **Non-Citizen Resident** (Q4, Q6) probes residency vs. citizenship.  
     - **Emigrated Citizen** (Q4, Q6) challenges formal citizenship.  

  ---

  This handout lets students locate their view using cases, isolates core disagreements (e.g., affectedness vs. authority), and exposes tradeoffs. Print as-is; no diagrams needed.
