prompt: |-
  I have been trying to reconstruct an argument I was handed in a seminar on perception, and I cannot locate the mistake. I am confident there is one, because the argument generalises into something no one could accept and because it returns the wrong verdict on a case where I am certain of the verdict. I would like a diagnosis rather than a map of the literature: which step fails, why it looked admissible, and what each of the alternatives would cost me.

  Set-up. By a cognitive state I mean any personal-level state with representational content that is not itself perceptual: a belief, a desire, an expectation, a theory, a mood. Distinguish three grades at which such a state C might be said to penetrate a perceptual experience E:

  (P1) causal: C is among the causes of E's occurring — perhaps by directing attention or saccades, perhaps by retuning the prior whose satisfaction E's content is selected to maximise.
  (P2) content: C is among the determinants of E's content, so that had C been different, E would have represented the scene differently and not merely have been succeeded by a different judgement.
  (P3) evidential: E's standing as a reason is inherited from, or is otherwise answerable to, the epistemic status of the C that shaped it.

  The argument I was given never asserts P3. It starts from P1 and P2, which I take to be close to orthodoxy.

  (1) A state S can justify a belief that p only if S's obtaining, and its being the state it is, does not depend on the subject's already believing that p. A reason must be independent of what it is a reason for.
  (2) Perception is supposed to be the one faculty whose deliverances are reasons for us independently of the rest of what we believe; that independence is what entitles experience to serve as the tribunal to which theory is answerable.
  (3) Experience is penetrated in sense P1, and — on the Bayesian or predictive-processing picture, which I take to be the best psychology available — in sense P2 as well, since content is fixed by top-down priors at every level and not only at late, post-perceptual stages.
  (4) Take any perceptual belief that p, based on an experience E. By (3), E's content is fixed partly by the subject's prior states, and among them is a prior that encodes how likely p is; in the ordinary case, where that prior was acquired from the subject's own experience and testimony, it is the residue of her beliefs about p-like matters.
  (5) By (1) and (4), E cannot justify the belief that p.
  (6) So no perceptual belief is ever justified by the experience it rests on. What looks like perceptual justification is really inferential: an inference from priors whose own warrant traces back to earlier priors.
  (7) But the constraint in (1) is not peculiar to perception. A memory state is shaped by what the subject now believes about the remembered episode, and inference takes beliefs as inputs outright. If (1) is the right constraint, then memory cannot preserve justification and inference cannot transmit it.
  (8) Nothing, then, is ever justified by anything. Nobody believes that.

  Three things make me think the argument is rotten somewhere, but none of them tells me where.

  First, the inversion. An experienced field ornithologist glances at a gull and sees a second-winter individual of one species; a novice standing beside her, looking at the same bird in the same light, sees a grey-and-white bird. The expert's experience is penetrated by what she knows; the novice's is not. So the argument ranks the novice's experience as the better justification and the expert's as worth little or nothing — even though the expert is plainly in the better epistemic position and her experience is the product of a trained, selectively more reliable perceptual system. That seems to me plainly the wrong result, and it is the result I most want to avoid.

  Second, an asymmetry I cannot account for. Suppose the shift in the ornithologist's experience were produced not by her beliefs but by an otherwise identical shift in her priors brought about by a mood, or by hunger, or by some interoceptive state with no propositional content at all. The mechanism downstream of the prior would be the same, and (3) would be satisfied just as well; but (1) is a constraint about beliefs, so the argument has nothing to say against such a case. Penetration by a mood is harmless and penetration by a belief is fatal, though the two work through the same machinery. That looks gerrymandered to me, but I cannot say why.

  Third, the slide from (6) to (8). Perhaps the argument is fine as far as (6) and the fault is in the parity claim about memory and inference — in which case I have a restricted scepticism about perception that I still have to take seriously. Or perhaps the parity is real and the fault is earlier. I cannot tell which.

  I am most attached to (3): the psychology seems to me right, and I do not want to buy my way out by denying that top-down states reach content. I would also like to keep (2) if I can, since without it I do not see how observation is supposed to adjudicate between theories at all, and I do not want to hand that result to anyone who argues from theory-ladenness to something like incommensurability. But I would rather keep (3) than (2) if I have to choose.

  So: which step do you reject, or, if the argument is valid, which premise is cheapest to give up? In particular — does the move from (4) to (5) actually require something like P3, and if so is that a suppressed premise, and where would it have to be argued for? Explain why the step you reject looked sound, and price the alternatives. And tell me what someone who rejects your preferred step would then owe us about the two symptoms I have described.
reasoning: |-
  Hmm, the user presents a sophisticated philosophical argument about cognitive penetration in perception and seeks to identify where it goes wrong. They've clearly thought deeply about this, as evidenced by their careful set-up of three penetration grades (P1-P3) and their identification of three troubling consequences: the expert-novice inversion problem, the mood-belief asymmetry, and the potential slide into global skepticism.

  The core argument seems to be that if perceptual experiences are shaped by prior beliefs (as per Bayesian/predictive processing models), then those experiences can't provide independent justification for beliefs, leading to skepticism. But this yields counterintuitive results - like ranking the novice's perception as better justified than the expert's.

  Looking at the argument structure, step (5) seems particularly vulnerable. The inference from (1) and (4) to (5) assumes that because prior beliefs causally influence experience, the experience necessarily depends epistemically on those beliefs. But this conflates causal origin with justificatory dependence. The key insight appears to be that for the experience to count as evidence, its justificatory force must not be entirely derived from the prior beliefs that shaped it.

  The user's intuition about the expert-novice case is telling - the expert's penetrated experience is actually more reliable. This suggests that what matters is whether the penetration improves perceptual sensitivity to reality, not whether beliefs are involved per se. The mood-belief asymmetry then makes sense because moods don't encode beliefs about the world, so their influence doesn't create circular justificatory dependence.

  I should emphasize that rejecting step (5) preserves both the predictive processing model (P1/P2 penetration) and perception's special evidential role (P2), while avoiding skepticism. The cost is developing an account of when cognitive penetration enhances rather than corrupts perception - perhaps through a reliability condition or proper function analysis.

  The user seems philosophically sophisticated but frustrated by this puzzle. They're clearly committed to both scientific accuracy (keeping predictive processing) and epistemic realism (preserving perception's tribunal role). My response should validate their correct intuitions about the expert case while precisely locating the argument's flaw.
answer: |-
  The flaw lies in step (5): the move from (4) to (5) illicitly smuggles in **P3 (evidential penetration)** under the guise of P1/P2. Let's diagnose the failure, alternatives, and costs.

  ### Why Step (5) Fails
  - **The Misstep**: (4) establishes that prior beliefs *causally influence* (P1) and *partly determine* (P2) E's content. (1) states that a justifier must be independent of the belief it justifies. (5) concludes that because priors *shaped* E, E cannot justify belief in *p*. This assumes that E's *justificatory force* depends on the epistemic status of the priors—i.e., it assumes **P3**.
  - **Why It Looks Admissible**: P1/P2 make it seem like E is "contaminated" by prior beliefs, violating (1)'s independence requirement. If E is built from priors that include beliefs about *p*, it *appears* circular to use E to justify *p*.
  - **The Reality**: P1/P2 describe *causal* and *content* determination, not *justificatory dependence*. E's justificatory power arises from its **phenomenal force and reliable sensitivity to the world**, not merely its causal ancestry. The priors enable efficient processing, but if they are well-calibrated (e.g., the ornithologist's expertise), they *enhance* reliability without turning perception into inference.

  ### Pricing the Alternatives
  1. **Reject Step (5) (Recommended)**:
     - **Cost**: Requires distinguishing *causal/content* penetration (P1/P2) from *evidential* penetration (P3). Must explain how an experience can be shaped by priors yet still provide non-inferential justification.
     - **Solution**: Justification requires that E's content is **counterfactually sensitive to the world**, not that it's belief-independent. If priors are *reliably acquired* (e.g., via past perception/testimony) and *tune perception to reality*, E can justify *p* even if priors influenced it.  
     - **Addresses Your Symptoms**:
       - *Expert/Novice Inversion*: The expert's priors make her perception *more accurate* and *reliable*. Her experience justifies *p* because it reflects trained sensitivity, not circular reasoning. The novice's "unpenetrated" experience is less justified precisely because it lacks this sensitivity.
       - *Mood/Belief Asymmetry*: Moods lack representational content about the world; they don't encode beliefs like "gulls look like *p*". Thus, mood-driven priors don't introduce *epistemic circularity* (violating P3), even if they distort content (P2). Belief-driven priors *can* cause circularity **only if maladaptive** (e.g., paranoia), not inherently.

  2. **Reject Premise (1)**:
     - **Cost**: Undermines the core intuition that reasons must be independent. If beliefs can self-justify via penetrated experiences, we risk permitting epistemic bootstrapping (e.g., "I believe *p*, so I see *p*, so *p* is justified").
     - **Result**: Saves perceptual justification but at the cost of allowing clear cases of circularity. Does not resolve the expert/novice inversion (still ranks novice higher).

  3. **Reject Premise (3) (Deny P2 Penetration)**:
     - **Cost**: Contradicts the predictive processing paradigm you accept. Requires denying that top-down priors shape *perceptual content* (only attention/post-perceptual judgment). Ignores evidence of early neural top-down modulation.
     - **Result**: Solves the argument by fiat but sacrifices empirical adequacy. Expert's experience is now "unpenetrated", avoiding inversion—but this is ad hoc.

  4. **Reject Premise (2) (Deny Perception's Independence)**:
     - **Cost**: Perception loses its role as an independent tribunal. Justification becomes holistic (e.g., coherentism). Risks incommensurability, as you fear.
     - **Result**: The argument succeeds, but you get global skepticism or coherentism. Expert and novice are on par until their beliefs cohere.

  ### Why Rejecting (5) is Cheapest
  - **Preserves Core Commitments**: Keeps predictive processing (P1/P2) and perception's evidential role (avoiding incommensurability). Only adds the nuance that *well-functioning* penetration enhances justification.
  - **Diagnoses the Sceptical Slide (Steps 6–8)**: Memory/inference *can* transmit justification if their operative states are themselves justified. The argument falsely assumes that because priors *shape* perception/memory, they *determine their justificatory force*. But if priors are justified (e.g., by past perception), no regress results.

  ### What Opponents of This View Owe
  If someone insists on (5), they must explain:
  1. **Expert/Novice Inversion**: Why the expert's reliable perception is *less justified* than the novice's. They must either deny the expert is better off (absurd) or concede that justification comes from elsewhere (e.g., post-perceptual inference).
  2. **Mood/Belief Asymmetry**: Why belief-driven penetration is uniquely toxic. They must argue that *any* content-influencing state with propositional content introduces circularity—but this condemns all cognition, as even moods might indirectly embed beliefs.

  ### Conclusion
  The fatal move is (5)'s conflation of causal/content penetration with evidential dependence. Rejecting it lets you:  
  - **Keep (3)** and most of **(2)** (perception is independent *in its justificatory role*, not its causal genesis).  
  - **Avoid skepticism** by tying justification to reliability, not causal purity.  
  - **Explain your symptoms**: Expertise improves sensitivity; moods lack the belief-content that creates circularity.  

  The cost is developing a **normative account of "proper" penetration**: e.g., penetration justifies iff it is truth-conducive (reliabilism) or fulfills a proper function (teleology). But this is a feature, not a bug—it matches the intuition that not all top-down influences are equal.
