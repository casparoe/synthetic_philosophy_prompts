  ### Activity Design: Safe Pareto Improvement in Nash Demand Game

  #### **Game Choice: Nash Demand Game**
  - **Why**: Clear conflict points, simple arithmetic, and visible inefficiencies when demands exceed surplus. Perfect for illustrating unilateral safety improvements.
  - **Rules**:
    - Two players simultaneously submit demands (integers between 0 and 100).
    - If sum ≤ 100, each gets their demand.
    - If sum > 100, both get 0.
  - **Payoffs**: Points tracked on a leaderboard. Top 3 scorers earn coffee vouchers.

  ---

  ### **Timeline (75 Minutes)**
  #### **Phase 1: Baseline Play (15 min)**
  - **(0–5 min) Setup**: 
    - Pair students (9 pairs). Distribute slips labeled "Demand: _____".
    - Explain rules: *"Submit a number. If your total ≤ 100, you both get your number. If not, both get 0."*
  - **(5–15 min) Round 1**:
    - Pairs submit demands → TA/instructor calculates payoffs.
    - Display leaderboard (e.g., whiteboard). **Example outcomes**: (50,50) = success; (60,70) = failure.

  #### **Phase 2: Rule Submission (20 min)**
  - **(15–20 min) Introduce Rules**:
    - *"Now, submit a *rule* instead of a number. Your rule tells me what you’ll demand *based on the other’s demand*. Example: 'I demand 100 – x' (where x = their demand)."*
    - **Worksheet**:
      ```
      My baseline demand (from Round 1): _____
      My rule: I demand = f(x) = [expression using x] 
      ```
    - Constraints: Expression must use only `x`, numbers, +, -, min, max (e.g., `max(40, 100 - x)`). No loops/conditionals.
  - **(20–35 min) Rule Submission & Resolution**:
    - Students submit worksheets. Collect and review.
    - **Resolving Interdependent Rules** (e.g., P1: `f(x) = 100 - x`; P2: `g(y) = 100 - y`):
      - Solve via iteration: Start with a seed (e.g., x₀ = 50). 
        - P1’s demand = f(50) = 50 → P2’s demand = g(50) = 50 → Converges to (50,50).
      - Non-convergence? Cap at 3 iterations → use final values. Still looping? Both get 0 (rare; emphasize it’s a "broken negotiation").

  #### **Phase 3: Adversarial Testing (20 min)**
  - **(35–40 min) Setup Adversaries**:
    - Assign 2–3 students as "adversaries" (rotate if needed). Their goal: *Break others’ rules by choosing an x that makes their partner worse off than baseline*.
    - **Adversary instructions**: *"You’ll see someone’s rule. Pick an x (0–100) to force them into a bad outcome."*
  - **(40–55 min) Testing Rounds**:
    - Adversaries paired with rule submitters. Adversary chooses `x` → rule demand `f(x)` computed.
    - **Safety check**: Compare outcomes:
      - *Baseline outcome*: If baseline + x ≤ 100, baseline payoff; else 0.
      - *Rule outcome*: If f(x) + x ≤ 100, f(x); else 0.
    - **Scoring**:
      - Adversary wins 50 pts if rule payoff < baseline payoff.
      - Rule-submitter wins 50 pts if rule payoff ≥ baseline payoff for all tested x.
    - **Example**: 
      - Baseline = 60. Rule = `min(80, 100 - x)`. 
      - Adversary picks x=30 → rule demand = 70 → total=100 → rule payoff=70 > baseline=60 (safe).
      - Adversary picks x=90 → rule demand=10 → total=100 → rule payoff=10 < baseline=60 (broken!).

  #### **Phase 4: Rule vs. Rule Interaction (10 min)**
  - **(55–60 min) Pair Rules**:
    - Pair non-adversaries. Exchange rules → compute demands via iteration (as in Phase 2).
  - **(60–65 min) Play & Observe**:
    - **Twist**: Rules designed for safety now interact reactively. 
    - **Critical observation**: 
      - Safe rules often converge to fair splits (e.g., 50,50), but if both use `f(x) = 100 - x`, it works. 
      - **Break the guarantee**: One player uses a "greedy" rule (e.g., `f(x) = 80`). Safe rule partner may get < baseline against this *reactive* opponent.
      - **Example**: 
        - P1 (greedy): `f(x) = 80` (baseline=60). 
        - P2 (safe): `g(y) = 100 - y` (baseline=50). 
        - If P2 faces P1’s fixed 80, P2 demands 20 → P2’s payoff=20 < baseline=50. *Safety guarantee breaks against reactive opponents.*

  #### **Debrief (10 min)**
  - **(65–70 min) Elicit Observations**:
    - *"What happened when your rule faced an adversary?"*  
      → *"They couldn’t hurt me if my math covered all cases."*
    - *"What broke when rules faced each other?"*  
      → *"My safe rule failed when the other player changed their behavior."*
  - **(70–75 min) Define Concepts**:
    - **Safe Pareto Improvement**: 
      - *"You modified your strategy so that NO MATTER what others do, they’re at least as well off as before, and you don’t lose. You didn’t need to predict them—just cover all possibilities."* 
    - **Key Contrasts**:
      - **Quantifying over behavior**: Safety guarantees hold *for every single action* of others (adversary phase), not just equilibria.
      - **Not equilibrium**: In equilibrium, both best-respond. Safety is unilateral and robust but *fragile when others adapt* (rule-vs-rule phase).
      - **Trade-off**: Robustness often means sacrificing upside (e.g., demanding less to ensure no conflict).
    - **Connect to AI**: *"In AI coordination, we can’t trust others’ models—so safety guarantees let us cooperate without prediction."*

  ---

  ### **What Could Go Wrong & Fixes**
  1. **Rules are too complex**:
     - *Fix*: Ban conditionals (no "if" statements). Allow only math expressions. Provide examples upfront (e.g., `100 - x`, `min(50, x + 10)`).

  2. **Adversaries don’t break rules**:
     - *Fix*: Secretly prompt one adversary to use a high x (e.g., 90) against generous rules to expose failures.

  3. **Iteration confusion in rule resolution**:
     - *Fix*: Use a visual step-by-step demo (e.g., "Start with x=50 → Player 1 demands... Player 2 responds with..."). Cap at 3 steps.

  4. **Students don’t invent safe rules**:
     - *Fix*: After submissions, showcase a working example (e.g., `f(x) = 100 - x`) and test it live against an adversary.

  ---

  ### **Limitations & What You Must State**
  - **Safety ≠ Equilibrium**: The activity shows safety’s fragility when others react, but you must explicitly contrast:
    - *"Safety holds your opponent’s behavior fixed. Equilibrium assumes they optimize. When both change, safety breaks."*
  - **Why Safe Rules Work**: Students may not intuit that `f(x) = 100 - x` is safe. You’ll need to:
    - Prove mathematically: *"For any x, opponent gets min(x, [their baseline payoff]) and I get ≥ my baseline."*
  - **Generality**: The activity focuses on demand games. Explicitly generalize: *"This applies to any game with a surplus (e.g., bargaining, public goods)."*

  ### **Materials**
  - Worksheets (baseline + rule fields).
  - Adversary assignment cards.
  - Leaderboard (physical/digital).
  - Calculator for rule resolution.  

  This design forces students to grapple with robustness, exposes the limits of unilateral guarantees, and culminates in a precise debrief—all without lecture. The Nash Demand Game’s transparency makes conflicts and fixes visceral.
