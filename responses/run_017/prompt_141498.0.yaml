  Game Choice: We'll use a Nash Demand Game (also called Divide-the-Surplus) because it is simple, involves clear conflict, and the payoffs are easy to compute. The game: two players simultaneously name a number (their demand) between 0 and 100. If the sum of their demands is less than or equal to 100, each gets what they demanded. If the sum exceeds 100, both get 0.

  We'll run several rounds. The activity will progress from playing with fixed demands to playing with conditional rules. We'll also introduce an adversarial phase to test the safety of proposed rules.

  Constraints: 75 minutes, 18 students (so 9 pairs), one TA. Points for a leaderboard, top scorer gets a small reward. No real money.

  Activity Outline:

  1. Introduction and Round 1: Simple Nash Demand Game (15 min)
  2. Round 2: Repeated with same partner, but now they can change demands (10 min)
  3. Rule Submission: Players submit conditional rules (15 min)
  4. Adversarial Testing: Some players act as adversaries to test rules (15 min)
