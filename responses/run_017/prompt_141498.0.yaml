    (70-75 min) Connect to AI coordination and wrap up.

    What might go wrong:

    - Rule submission: students might not understand how to write a rule that is safe. We can give an example: for a baseline of 50, a safe rule is "100-x". But don't give that example until after they try? Or give a non-safe example first.

    - Adversarial testing: the adversary might not be able to break the rule even if it isn't safe, because they only try one value. We can allow them to try up to three demands? But time.

    - Fixed-point iteration in Round 3 might not converge. We can cap the iterations and then if not converged, both get 0.

    - Time: the activity might run over. We can cut Round 2 to one round.

    What the activity might not produce and you'll have to state:

    - The activity might not make it clear that the safe improvement is a unilateral modification that doesn't require coordination. You might have to emphasize that.

    - The activity might not naturally lead to the split-the-difference rule. If no one comes up with it, you can reveal it as an example.

    - The distinction between the fixed-opponent-behavior guarantee and the reactive-opponent case might not be immediately clear. You'll have to explain that in the debrief.

    Given the complexity, I hope this is helpful.
