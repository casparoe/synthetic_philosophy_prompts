  - **Format:** Fits one side of A4 (≈500 words).  
  - **Nodes:** 7 nodes (one ternary: Q3).  
  - **Leaves:** 9 (covers all required positions).  
  - **Cases:** Bench-scale only (no minds/quantum).  
  - **Flow:** Linear (all users answer all nodes).  

  This tree forces commitments on concrete cases, avoiding labels and attributions while capturing the logical space of reduction/emergence debates.
