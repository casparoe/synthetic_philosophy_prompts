  Below is a decision tree designed to sort positions on reduction and emergence using concrete cases from bench-scale science. The tree has seven branch nodes (one ternary) yielding nine leaves. Each node is a question about a specific case, avoiding labels and bibliographies. Cases (i)-(iv) are incorporated per specifications, and the disagreement node is included. Positions are characterized by commitments, with common labels in parentheses only where unambiguous. Empty answer combinations are noted.

  ### Decision Tree: Reduction and Emergence in Science

  1. **Rennert Medium Invariance (Case i):**  
     The reaction-diffusion system’s wavefront speed is invariant across three decades of temperature, catalyst batch, and vessel geometry, while kinetics vary wildly. Does this invariance represent an explanatory achievement of the macro law?  
     - **A: Yes** → Go to Q2  
     - **B: No** (merely a convenience) → Go to Q3  

  2. **Macro Quantity Origins (Case ii):**  
     Temperature (fixed by lab practice pre-micro theory) and Reynolds number (engineered as a trivial dimensionless combination of micro variables) both describe macro behavior. Does the historical order of discovery or engineering design affect the ontological status of the macro quantity?  
     - **A: Yes** (epistemic access/design matters ontologically) → Go to Q4  
     - **B: No** (ontologically inert) → Go to Q5  

  3. **Disagreement Resolution:**  
     When micro and macro descriptions, both optimally corrected, conflict, which is revised?  
     - **A: Revise the macro description** → *Leaf 1: Deflationary view*  
     - **B: Revise the micro description** → *Leaf 2: Irreducibility with downward influence*  
     - **C: Revise both, but micro has priority* → *Leaf 3: Emergence as unpredictability*  

  4. **Derivation Requirement (Case iii):**  
     The Second Law of Thermodynamics is derived from statistical mechanics only after stipulating a low-entropy initial condition stateable only in macro vocabulary. Does this requirement undermine reduction?  
     - **A: Yes** → Go to Q6  
     - **B: No** → *Leaf 4: Identity without derivation*  

  5. **Tractability Gap (Case iv):**  
     Phase transition temperatures in complex materials are predicted to experimental precision by a 2-parameter phenomenological model (e.g., Landau theory) but are intractable from micro theory. Does this imply autonomy for the macro law?  
     - **A: Yes** → Go to Q7  
     - **B: No** → *Leaf 5: Derivational reduction via bridge laws*  

  6. **Multiple Realizability:**  
     Fluid turbulence (e.g., Reynolds number scaling) occurs in diverse media (water, air, plasma) with different microstructures. Does this imply the macro law is irreducible?  
     - **A: Yes** → *Leaf 6: Non-reductive physicalism*  
     - **B: No** → *Leaf 7: Autonomy relative to interventions*  

  7. **Downward Influence:**  
     In a Belousov-Zhabotinsky chemical oscillator, macro-scale reaction-diffusion patterns (e.g., spiral waves) constrain local reaction kinetics. Does this constitute genuine downward causation?  
     - **A: Yes** → *Leaf 8: Irreducibility with downward influence*  
     - **B: No** → *Leaf 9: Question ill-formed*  

  ---

  ### Leaves (Positions Characterized by Commitments)
  - **Leaf 1: Deflationary view** (Q1=B, Q3=A)  
    Macro invariance is a predictive convenience; no explanatory depth. Conflicts are resolved by revising macro descriptions.  
  - **Leaf 2: Irreducibility with downward influence** (Q1=B, Q3=B)  
    Macro quantities exert causal influence; micro must be revised if conflict arises. Combines with Q7=A.  
  - **Leaf 3: Emergence as unpredictability** (Q1=B, Q3=C)  
    Emergence is purely epistemic (unpredictability from micro); macro revised first, but micro is fundamental.  
  - **Leaf 4: Identity without derivation** (Q1=A, Q2=B, Q4=B)  
    Macro properties are identical to micro properties, but derivation is unnecessary; history/design irrelevant.  
  - **Leaf 5: Derivational reduction via bridge laws** (Q1=A, Q2=B, Q5=B)  
    Macro laws reduce to micro laws with bridge principles; autonomy claims confuse tractability with ontology.  
  - **Leaf 6: Non-reductive physicalism** (Q1=A, Q2=A, Q4=A, Q6=A)  
    Multiple realizability implies irreducibility; macro laws are physically grounded but explanatorily independent.  
  - **Leaf 7: Autonomy relative to interventions** (Q1=A, Q2=A, Q4=A, Q6=B, Q7=B)  
    Macro laws are autonomous for specific interventions (e.g., pressure/temperature changes); downward causation absent.  
  - **Leaf 8: Irreducibility with downward influence** (Q1=A, Q2=B, Q5=A, Q7=A)  
    Downward causation is real (e.g., patterns constrain kinetics); reduction fails despite tractability issues.  
  - **Leaf 9: Question ill-formed** (Q1=A, Q2=B, Q5=A, Q7=B)  
    Reduction/emergence framing misrepresents science; descriptions are context-dependent tools.  

  ---

  ### Empty Answer Combinations  
  1. **Q1=B, Q3=B, Q7=A** (e.g., downward influence without prior commitment to macro achievement):  
     *Unattractive*: Defending downward causation requires seeing macro invariance as explanatory (Q1=A).  
  2. **Q1=A, Q2=A, Q4=B** (e.g., history matters but macro condition doesn’t undermine reduction):  
     *Incoherent*: If history is ontologically significant (Q2=A), macro conditions should block reduction (Q4=A).  

  ---

  ### Indistinguishable Leaves & Tie-Breaker  
  **Leaf 2 (Irreducibility with downward influence)** and **Leaf 8 (Irreducibility with downward influence)** share core commitments but arise from different paths. They cannot be separated by the tree due to overlapping answers on downward causation (Q7=A).  

  **Tie-Breaker Question:**  
  *In a ferroelectric crystal, domain walls (macro structures) locally alter lattice polarization (micro state). Does this micro-state alteration exist ONLY because of the domain wall?*  
  - **A: Yes** → Leaf 8 (downward influence primitive).  
  - **B: No** (domain walls supervene on microstates) → Leaf 2 (downward influence reducible to context).  

