  First, I need to design the question text carefully. It must define all terms (Lyapunov exponent, determinism, etc.) and incorporate the Archivist gadget explicitly. The core challenge should force students to distinguish determinism from predictability while addressing shadowing and computability traps. I'll phrase it as a direct problem statement with all necessary definitions embedded.

  For the model answer, I'll structure it around five key moves: 
  1. Defining determinism as state-transition uniqueness
  2. Showing predictability requires epistemic access 
  3. Explaining Archivist's failure via Lyapunov exponents 
  4. Debunking shadowing lemma as solution 
  5. Analyzing computability's threat to "simulable determinism"

  The 20-mark scheme will allocate points per move, with penalties for common errors like conflating determinism with predictability or misapplying shadowing. The computability kicker gets bonus marks for recognizing non-computable reals' measure-theoretic significance.

  Hmm, the professor's emphasis on the Archivist's ball-image size versus determinism's mapping claim is crucial. I'll make sure the model answer explicitly contrasts the mathematical image set with epistemic prediction tasks. For the shadowing trap, I'll emphasize existential versus universal quantification - that's where students typically stumble.

  For the computability section, I need to avoid leading witnesses about the countability argument while leaving space for top students to develop it. The model answer should propose "simulable determinism" as optional but reward those who question its physical relevance given typicality of non-computable reals.

  The time constraint means the answer must be tight - 700 words precisely structured. Opening line should state the thesis: "Determinism remains intact while predictability fails due to..." Then unpack each component with the Archivist as the through-line.

  Mark scheme must be brutal about sloganeering. Sensitive dependence alone gets zero; they must explain why it threatens predictability but not determinism. Each move's failure mode will be specified concisely, like "Blown by claiming shadowing guarantees accurate prediction of actual trajectory."
answer: |-
  ### Question Text  
  Define a deterministic system as one where any two identical states at time t must evolve identically at all future times. Consider a system with positive Lyapunov exponent λ > 0 (meaning small state differences grow as e^{λt}). The Archivist knows: (i) the exact deterministic laws, (ii) unlimited computing power, and (iii) that the true initial state x₀ lies within a ball B of radius ε > 0, but not where. Her task is to output, for a future time T, a prediction y guaranteed to be within δ > 0 of the true state x(T) for every possible x₀ in B. Explain why she fails at large T due to chaos. Argue rigorously why this failure does not threaten determinism. Next, suppose someone claims the Shadowing Lemma (which states that for any approximate trajectory, there exists some exact trajectory staying uniformly close to it) rescues her prediction. Show why this is incorrect. Finally, assume x₀ is a non-computable real number (no finite algorithm can output its digits). Does this violate determinism? If not, formulate a stronger "computable determinism" thesis and discuss whether physics should require it.

  ---

  ### Model Answer (698 words)  
  **Determinism remains intact despite chaos and non-computability undermining predictability, as determinism concerns state evolution uniqueness, not epistemic access or algorithmic constructibility.**

  Chaos disrupts the Archivist’s prediction due to sensitive dependence on initial conditions. A positive Lyapunov exponent λ implies states initially separated by distance d diverge as d⋅e^{λt}. For any fixed δ, as T → ∞, e^{λT} grows without bound. Thus, the image of the initial ε-ball under the time-T evolution map must spread over a region larger than diameter δ. The Archivist must output a single y within δ of x(T) for every x₀ in B. But since the evolved states from B cover a set larger than δ, no single y can be within δ of all endpoints simultaneously. Her failure is inevitable for large T, regardless of computing power, because uncertainty grows exponentially.

  This unpredictability does not challenge determinism. Determinism requires only that the time-evolution map is a *function*: identical inputs yield identical outputs. The Archivist’s failure arises because she lacks precise input knowledge. Determinism guarantees the entire ε-ball maps to a specific set S at time T. However, S may be large and highly stretched (e.g., a fractal filament in phase space). The system is deterministic because every point in B evolves uniquely to one point in S, preserving state identity. The problem is that S’s size exceeds δ, making pointwise prediction impossible—not that the mapping itself is non-functional. Adding predictability (requiring small S) conflates metaphysics with epistemology. Determinism governs state transitions; predictability requires epistemic control over initial conditions.

  The Shadowing Lemma does not save the Archivist. It states: for a numerically approximated trajectory (e.g., from rounding initial conditions), there exists *some* exact initial state whose true trajectory stays close to the approximation for all time. However, the Archivist needs to predict the future of the *actual* x₀ in B. Shadowing guarantees a different, "shadowing" trajectory z(t) exists near her approximate path, but z(0) ≠ x₀. Since states diverge exponentially, the true trajectory starting at x₀ and the shadowing trajectory starting at z(0) may separate significantly despite both being valid deterministic evolutions. Crucially, this lemma provides an existential guarantee ("there exists" a shadowing orbit), not a universal one about the actual orbit. The Archivist cannot identify which shadowing orbit corresponds to x₀ without infinite precision, so she gains no actionable information about x₀’s fate.

  Non-computable initial conditions challenge predictability further but preserve determinism. Suppose x₀ is a non-computable real: no algorithm can output its digits. Determinism still holds—the laws uniquely determine x(t) from x₀. However, no algorithm can compute x(t) because it requires exact knowledge of x₀, which cannot be finitely specified. This motivates defining "**Simulable Determinism**": *The laws plus a finite initial state description must determine a computable future trajectory*. Standard determinism does not require computability; simulable determinism does. Physics should likely reject simulable determinism as too strong. Non-computable reals are typical: the computable reals are countable (like integers), while almost all reals (measure-one under any continuous distribution) are non-computable. Requiring simulability would exclude almost all possible worlds, making determinism fragile under small perturbations. Physics cares about robust, generic behavior; demanding finite algorithms to compute exact trajectories is neither necessary for empirical success nor consistent with the ubiquity of chaos and measurement error. Determinism governs nature’s evolution; simulability is a constraint on human cognition or technology, not metaphysics.

  ---

  ### 20-Mark Scheme (5 moves x 4 marks each)  

  1.  **Identify Lyapunov-driven divergence as cause of Archivist’s failure**  
      *Must-hit:* Explains exponential growth (d⋅e^{λT}) forces the image of the ε-ball to exceed δ-diameter, making single-point prediction impossible.  
      *Blown by:* Only stating "sensitive dependence" without showing why the ball’s image size defeats the task.  

  2.  **Separate determinism (state-transition uniqueness) from predictability**  
      *Must-hit:* States determinism requires only functional evolution; unpredictability stems from large image sets, not non-uniqueness.  
      *Blown by:* Conflating determinism with predictability or claiming chaos "weakens" determinism.  

  3.  **Refute Shadowing Lemma rescue by distinguishing existential vs. actual trajectory**  
      *Must-hit:* Notes shadowing provides a different trajectory close to the approximation, not necessarily the actual one; divergence means actual vs. shadow paths may separate.  
      *Blown by:* Claiming shadowing approximates the true trajectory or misapplying it as a universal guarantee.  

  4.  **Formulate "Simulable Determinism" and argue against its physical necessity**  
      *Must-hit:* Defines a thesis requiring computable trajectories from finite data; argues physics need not demand this.  
      *Blown by:* Asserting non-computability breaks determinism, or ignoring the finiteness/computability requirement.  

  5.  **Discuss typicality of non-computability (Bonus mark within this section)**  
      *Must-hit:* Notes non-computable reals are measure-theoretically typical (countable computables vs. uncountable continuum).  
      *Bonus:* Explicitly states this makes non-computability generic, not pathological, undermining simulable determinism’s viability.  
      *Blown by:* Treating non-computability as a negligible edge case.  

  ---

  **Rationale & Constraints Met**  
  - **Self-contained**: Defines determinism, Lyapunov exponent, Archivist’s task, Shadowing Lemma, non-computable reals.  
  - **Forces key distinctions**: Predictability vs. determinism via Archivist’s image-set failure; actual vs. existential via shadowing trap.  
  - **Kicker handled**: Non-computability → simulable determinism thesis → physical critique. Bonus for measure argument without requiring it.  
  - **Depth over slogans**: Top answers must articulate why image-set size defeats prediction, why shadowing misapplies, and why computability is extraneous to determinism.  
  - **Time-appropriate**: Structured for 30 mins: 5 mins per move + intro/conclusion. Model answer length fits handwritten 700 words.
