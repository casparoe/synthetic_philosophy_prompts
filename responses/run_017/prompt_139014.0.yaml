prompt: |-
  I co-host a tiny podcast with my brother — we get one guest on for about an hour and just pick at a single idea untill it breaks. Next month's guest is someone I'll call Rowan, who defends what he calls "pessimism about borrowed verdicts": roughly, that when you take someone else's word for it that a thing is wrong — not because you can see the reasons yourself but because they said so — something is missing from your moral situation, even if the belief you end up with is true and you act on it. I've been turning this over on my own for months and I've got a pile of half-baked objections, but I've never studied this stuff, so I can't tell which of my objections are the ones people actually press and which are just me going in circles.

  Can you write me nine or ten interview questions, each two or three sentences, in plain spoken language — I'll be reading them out loud, so no acadamese — plus a follow-up for each, keyed to what you think Rowan will most likely answer. Here's what I want covered:

  - Rowan's favourite move, whenever I bring up the feeling that a borrowed verdict is hollow, is to say something like "that's a question about how the belief got there, not about whether it's a good belief." I want a run of two or three questions that makes that move harder and harder to lean on, ending with one where the distinction itself is what's up for grabs.
  - The asymmetry with ordinary expertise. If a mechanic tells me my brakes are shot and I act on that, nobody thinks I'm missing something; I'm being sensible. He'll say morality is different because what matters is acting for the reasons, or that the act has no special worth if you do it on someone's say-so. Press that — and then push on whether that makes the whole worry kind of selfish: the person I helped doesn't care whether I understood why helping was right, so who exactly is this defect a defect for?
  - A case I made up that I like: I've got two friends who agree with me that keeping promises matters and that not wrecking someone's life matters. In a particular mess I ask them which of those weighs more here, and they say the promise, definately. That feels like borrowing without borrowing the verdict. Is borrowing a weighting different from borrowing an answer, and why would his view treat them the same way — or differently?
  - Another one: when someone tells me "that thing you did hurt me", I just take their word for it, and that seems completely fine, not hollow at all — but they aren't an expert, they're the person affected. Maybe all moral deference is secretly like this, or maybe this case just shows the worry is really about expertise and not about testimony. I want the question to force him to say which.
  - Chains and crowds. What if I defer to someone who was themselves only passing on what they'd heard? And what if, instead of one trusted person, I go by what a bunch of people who disagree with each other roughly converge on — is that still borrowing, or is it more like reading a map?
  - A worry I can't shake: if everyone in a community defers to the same one or two voices, you get a moral monoculture — everybody's reasons are the same reasons, so nothing corrects the mistakes. That looks like a harm of deference that has nothing to do with whether any individual's borrowed belief is defective, and I want to know where it fits in his picture, if anywhere.
  - Looking backwards: I decide something is wrong on my own, clumsily, with my own reasons, and years later find out that someone whose judgment I now trust had come to the same conclusion. Does he have to say my original verdict was defective the whole time and just got lucky? That answer feels wrong to me but I can't say why.
  - Kids. Most of us learned most of our morals by being told. If borrowed verdicts are defective, are we all walking around with a broken moral picture that we later repair — and what would the repair even consist in?
  - Finish with one question about what would count as evidence against the view. Not "what would change your mind" in general — I hate that question — but something concrete he'd actually have to give up.

  He's quick and he'll have a stock answer for the obvious stuff, so please skip anything that just asks him to explain what the view is.
reasoning: |-
  Okay, the user is co-hosting a podcast with their brother and needs interview questions for a guest named Rowan, who defends "pessimism about borrowed verdicts." The user has been thinking about this for months but hasn't studied it formally, so they want help crafting questions that dig into Rowan's arguments without using academic jargon. 

  First, I need to understand what Rowan's position entails. He believes that relying on someone else's moral judgment without grasping the reasons yourself makes your moral stance deficient, even if the belief is true and you act on it. The user has several areas they want to cover, each with specific angles to press Rowan on.

  Starting with Rowan's "favorite move" about distinguishing belief formation from belief quality. The user wants a sequence of questions that makes this distinction harder to maintain, ending with challenging the distinction itself. I should build this progression carefully - first question could focus on why origin matters if the belief works, second on whether the hollowness is part of the moral experience, third directly attacking the separation between formation and worth.

  For the asymmetry with expertise (mechanic vs. morality), I need to press why morality is different and then challenge if this makes the concern selfish. The user's phrasing about "who the defect is for" is sharp - that should be the follow-up thrust.

  The user's "borrowing a weighting" case is interesting. Asking whether deferring on how principles balance is different from deferring on facts, and why Rowan's view might treat them the same. The follow-up should make him choose: is this still defective deference or something else?

  The "that hurt me" testimony case seems powerful. I'll force Rowan to decide if this is fundamentally different from expert deference or if it reveals the real issue is about expertise structures. The user wants this binary choice presented clearly.

  For chains/crowds, two angles: multi-generational deference vs crowd consensus. The follow-ups should test whether these feel less "borrowed" and why, probing if Rowan's objection is really about losing the reason-chain.

  The monoculture worry is structural - how deference creates systemic fragility. The follow-up should ask if this collective harm is separate from individual deficiency in Rowan's framework.

  The retrospective case (later discovering agreement) needs to challenge whether original judgment was "lucky but deficient." Follow-up should highlight how this conflicts with moral experience.

  Kids learning morality is foundational. Question should force Rowan to explain how we "repair" these initially borrowed verdicts, exposing whether his view demands unrealistic self-sufficiency.

  Finally, the evidence question must be concrete - maybe about cultures with structured moral deference not experiencing hollowness? The follow-up should prevent vague answers by demanding specific observable phenomena that would undermine his claim.

  Throughout, avoiding jargon is crucial since questions will be read aloud. Each question pair should feel conversational but incisive, boxing Rowan out of stock answers. The user knows Rowan's style well so these need to anticipate his dodges.
answer: |-
  Here are ten interview questions (+ follow-ups) designed to press Rowan's view on borrowed verdicts, targeting your specific concerns and avoiding obvious setups. They're in plain language and aim to force him beyond stock answers:

  1.  **Initial Press on the Origin/Value Split:** "Rowan, you often say my feeling that a borrowed verdict is 'hollow' is just about *how* I got the belief, not whether the belief itself is *good* or *true*. But isn't that hollowness itself a moral defect *in me*? Like, isn't being disconnected from the *why* a failure *of my moral agency*, regardless of whether the belief is correct?"
      *   *Likely Answer:* He'll emphasize that the defect is in the epistemic/moral *relationship* to the belief, not necessarily the belief's content or truth.
      *   *Follow-Up:* "But if the hollowness *is* a flaw *in me* as a moral agent, doesn't that make it a flaw *in the moral quality of my holding that belief*, even if the belief is true? Doesn't that blur the line you're drawing between 'how it got there' and 'is it good'?"

  2.  **Deepening Press on Origin/Value:** "Okay, so if the belief is true and the action is right, what *exactly* is lost if I don't grasp the reasons myself? What concrete moral value is missing *in the world* or *for the person I help* because my verdict was borrowed?"
      *   *Likely Answer:* He'll stress the intrinsic value of acting *for the right reasons*, the lack of moral worth in the act if done merely on authority, or the impoverished state of the agent.
      *   *Follow-Up:* "Right, so the missing thing is something *for me*, the agent – a kind of moral credit or inner state. Doesn't that make the 'defect' you're worried about fundamentally a *selfish* concern? The person I helped got helped! Why should *my* lack of understanding matter more than *their* need being met?"

  3.  **Attacking the Distinction Itself:** "Let's take this head-on. You insist the 'how' (borrowed) is separate from the 'what' (true/good verdict). But if borrowing *necessarily* creates this feeling of hollowness *and* you say that hollowness reflects a real moral lack *in the agent*, doesn't that mean the 'how' *infects* the 'what'? Isn't a borrowed true verdict *qualitatively different and morally worse* for the agent than an understood true verdict?"
      *   *Likely Answer:* He'll likely double down, arguing the belief's truth and the action's rightness are objective, while the agent's state is a separate, subjective lack.
      *   *Follow-Up:* "But if the agent's state is a *moral* failing (not just an intellectual one), and it's *caused by* the borrowing, how can we cleanly separate the 'what' from the 'how' when evaluating *the agent's moral situation*? Isn't the 'how' *part of* the moral 'what' for the agent?"

  4.  **Asymmetry with Expertise (e.g., Mechanic):** "You say morality is different from the mechanic because acting for the *moral reasons* matters. But when I trust the mechanic about my brakes, my reason *is* moral: I don't want to hurt people! Why isn't deferring to *their* expertise on the factual risk part of acting for the *moral* reason of preventing harm?"
      *   *Likely Answer:* He'll argue that morality requires understanding the *moral* reasons themselves, not just instrumental facts.
      *   *Follow-Up:* "But if I defer to a moral expert *because* I want to do the right thing and believe they know it, isn't *that desire to do right* my core moral reason? Isn't trusting their judgment on *what is right* in a complex situation just like trusting the mechanic on *what is dangerous*?"

  5.  **Borrowing Weightings (Your Case):** "Imagine I know two friends agree with me that promise-keeping matters and avoiding harm matters. In a tough spot, I ask them which matters *more* here, and they firmly say the promise. I trust them and act on that weighting. Is this 'borrowing a verdict'? It feels different than borrowing a simple 'is X wrong?' answer."
      *   *Likely Answer:* He'll likely say yes, it's still problematic deference, as I'm not grasping the reasons *why* that weighting is correct *in this case*.
      *   *Follow-Up:* "But if borrowing a simple verdict is hollow, is borrowing a *weighting* or *prioritization* between values I *already hold* even *more* hollow? Or less? Why would your view treat them the same if one involves deferring on applying *my own* values?"

  6.  **Testimony from the Affected ("That hurt me"):** "When a friend tells me 'What you did hurt me,' I just believe them. That feels completely right, not hollow. They're not a moral expert; they're the person affected. Does this show the 'hollowness' worry is *really* about deferring to authorities or experts, not about testimony itself?"
      *   *Likely Answer:* He might say this isn't "borrowing a verdict" in the problematic sense because I'm learning a *fact* (I caused hurt) that directly feeds into my *own* moral principle (don't cause unjustified hurt), or that the victim has a unique epistemic position.
      *   *Follow-Up:* "So is the core issue *who* I'm deferring to? Is it only hollow if I defer to a *disinterested third party's moral judgment*, not to the person directly involved? Or is the 'hurt me' case actually deferring on a *moral* claim ('you wronged me') disguised as a fact?"

  7.  **Chains of Deference:** "What if I get my moral verdict from Rowan, but Rowan only got it because he heard it from Sage, and Sage just heard it from someone else? Does the hollowness get worse with each link, or is it the same as borrowing directly?"
      *   *Likely Answer:* He'll likely say the defect is in the immediate act of borrowing; the chain might exacerbate epistemic risk, but the core moral lack is present for each borrower.
      *   *Follow-Up:* "What if instead of one source, I look at what a bunch of diverse, thoughtful people I respect *roughly converge* on, even if they disagree on details? Is that 'borrowing' or is it more like surveying the landscape and reading the map myself?"

  8.  **Moral Monoculture:** "If a whole community defers to one or two moral voices, everyone ends up with the *same reasons* (or lack thereof). Doesn't this make the whole group vulnerable? Mistakes by the leaders get amplified, and there's no internal diversity of thought to correct them. Isn't *this* a huge practical harm of deference that's separate from whether any individual's borrowed belief feels hollow?"
      *   *Likely Answer:* He'll agree it's a serious problem, but likely say it's a *consequence* of widespread individual moral deference, not the *core* defect he's identifying (which is individual).
      *   *Follow-Up:* "But if the *individual* defect (the hollowness) is the root, and the *collective* harm (monoculture fragility) is a major consequence, doesn't that collective harm actually give us a strong *independent* reason to be pessimistic about borrowed verdicts, beyond just the agent's inner state?"

  9.  **Retrospective Validation ("I got it right clumsily"):** "Years ago, I thought hard about a moral problem, decided clumsily on my own that something was wrong, and acted. Today, I learn someone I deeply respect as a moral thinker independently reached the same conclusion back then. Does your view force you to say my original verdict was *defective* back then, simply because I might have later deferred to them, even though I didn't?"
      *   *Likely Answer:* He'll likely say no, because I *did* engage my own reasoning, however clumsily. The defect is in *replacing* my reasoning with deference, not in reasoning imperfectly.
      *   *Follow-Up:* "But if my original reasoning was deeply flawed and I just lucked into the right answer, and *now* I discover this trusted person agreed, doesn't that *reveal* the luck? Yet, it still feels meaningfully different than if I'd just asked them back then and borrowed the verdict. Why does the *past effort*, even if flawed, seem to shield it from the 'borrowed' defect?"

  10. **Evidence Against the View:** "What's something concrete we might discover that would genuinely challenge your pessimism? Like, finding a community where moral deference to specific sages is central, yet people don't report that 'hollow' feeling *and* show deep, nuanced moral understanding when pressed? What observable facts would make you think, 'Huh, maybe borrowed verdicts *can* be fully morally adequate'?"
      *   *Likely Answer:* He might struggle, but perhaps suggest evidence that deference reliably cultivates *better* independent moral reasoning over time, or that "deferrers" consistently articulate the underlying reasons *as well as* non-deferrers when explaining their choices.
      *   *Follow-Up:* "But if they can articulate the reasons *after* borrowing, does that retroactively fix the defect at the time of action? Or is the act of borrowing itself the irreparable flaw? If they get *better* at reasoning *because* they defer, doesn't that just kick the 'hollowness' can down the road for the initial borrowed acts?"

  **Key design choices based on your notes:**

  *   **Pressing the Origin/Value Split:** Q1-3 form a sequence designed to corner the distinction: Q1 targets the *agent's* defect, Q2 forces the "selfish?" point, Q3 directly attacks the split by arguing the "how" infects the moral "what" for the agent.
  *   **Asymmetry:** Q4 tackles the mechanic analogy head-on, forcing the "acting for reasons" point, with the follow-up pushing the selfishness angle.
  *   **Weightings:** Q5 isolates your specific case, forcing Rowan to apply his view to a nuanced form of deference.
  *   **Affected Party Testimony:** Q6 directly contrasts the "hurt me" case with expert deference, demanding a distinction.
  *   **Chains/Crowds:** Q7 handles both scenarios (chain & convergence) efficiently.
  *   **Monoculture:** Q8 elevates the concern to a systemic level, asking how it integrates.
  *   **Retrospective:** Q9 uses your "clumsy but own" case to challenge the necessity of *perfect* reasoning vs. deference.
  *   **Evidence:** Q10 demands concrete, observable counter-evidence, avoiding vague "change your mind" territory.
  *   **Avoiding Explainer Questions:** Assumes the core view is understood; jumps straight into objections and pressure points.
  *   **Plain Language:** Uses conversational phrasing and avoids technical terms ("epistemic", "normative", etc.).

  Good luck with the interview! This line of questioning should force Rowan beyond rehearsed answers and into the deeper tensions within his view.
