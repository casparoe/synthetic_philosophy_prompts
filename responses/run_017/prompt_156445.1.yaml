prompt: |-
  I am drafting a proposal for a second legislative chamber selected by lot, and before I take it further I would like the position set audited as a package rather than one commitment at a time. Where I stand:

  1. **Term limits.** I support a hard limit of two consecutive terms in any elected office, and I justify it mainly by the diagnosis that long tenure produces a class whose skills are the skills of winning re-election rather than of governing, and whose judgment is captured by funders, staff and lobbyists.
  2. **Sortition on epistemic grounds.** I want one chamber drawn by lot from the adult citizenry. I reject the mirroring argument — that a chamber must demographically resemble the population to be legitimate — and rest the case instead on the claim that a randomly selected body, once properly briefed, deliberates better than elected politicians on long-horizon problems such as climate and pensions, because electoral incentives systematically discount the future.
  3. **The diversity claim in its strong form.** I hold that the advantage of such a body is cognitive and perspectival diversity itself: a heterogeneous group of moderately informed people can outperform a homogeneous group of better-informed experts. This is why I give little weight to the objection that sortition hands power to the ignorant.
  4. **Professionalisation anyway.** I want members serving full-time for pay, with independent staff and expert briefing, and I favour a 200-member chamber with staggered six-year terms renewed by halves every three years, where twenty seats in each incoming half are reserved for members of the outgoing half, who mentor newcomers and chair committees.
  5. **Accountability as a side-constraint.** Any governing body must be answerable to those it governs, in the sense that they can remove or sanction it; I treat this as a constraint rather than something to be traded off against good outcomes. At the same time I reject recall elections and referenda as accountability mechanisms, which I regard as plebiscitary and worse than representative ones.

  Colleagues keep telling me the set is unstable, but the only pair they point to — my dismissal of mirroring in (2) against my reliance on diversity in (3) — looks to me like no conflict at all, since demographic resemblance is only a proxy for the diversity that does the work. So I cannot locate the real fault line myself.

  Please audit the set: which commitments are genuinely in tension, which pairs only appear to be, and what each available repair would cost me. Give me exactly five numbered items, one or two sentences each, with no introduction and no conclusion: the genuine tensions ordered from most to least severe, each with what would have to give and what that costs; then any pair that only looks tense, with the reason it dissolves; and as the final item, the single revision that buys back the most consistency at the least cost.
reasoning: |-
  Hmm, the user is drafting a proposal for a sortition-based legislative chamber and wants me to audit their five core commitments for internal consistency. They've identified that colleagues see tensions but can't locate the real fault lines themselves.

  Looking at their positions: Term limits (1) aim to prevent careerism, sortition (2) rejects demographic mirroring but values cognitive diversity (3), professionalization (4) ensures capability, and accountability (5) rejects direct democracy mechanisms. The user sees no conflict between rejecting mirroring (2) and embracing diversity (3), arguing demographics are just a proxy.

  I need to find genuine tensions. The strongest conflict is between term limits (1) and professionalization (4). Term limits force high turnover, but reserving 20% of seats for mentors requires experienced members - these directly clash. Keeping both would undermine either the anti-entrenchment goal or the training system's viability.

  Next, accountability (5) clashes with sortition's insulation (2,4). By rejecting recall/referenda while demanding answerability, the user hasn't specified any actual mechanism for removal/sanction. This creates a gap where the chamber is technically accountable but citizens lack tools to enforce it.

  The third tension is between diversity claims (3) and professionalization (4). Intensive training and mentorship may homogenize perspectives over time, potentially eroding the very cognitive diversity that justifies sortition. The system might create a professional class within the allotted body.

  The apparent conflict between rejecting mirroring (2) and valuing diversity (3) isn't real, as the user notes. Demographics are indeed just one potential indicator of cognitive diversity, not the goal itself.

  For the most cost-effective repair, modifying the mentor provision in (4) to exempt them from term limits would resolve the core operational clash with (1), while preserving both principles. This seems better than weakening accountability or diversity commitments.

  The user's framework is sophisticated but these three tensions need addressing - particularly the term limits/mentorship contradiction which could cripple the system's functionality if unaddressed.
answer: |-
  1.  **Term limits (1) vs. Professionalization mentorship (4):** Your hard term limits clash severely with reserving 20% of seats for outgoing mentors, as those mentors would require exceeding the two-term limit; you must either weaken term limits (cost: undermining anti-entrenchment) or abandon the reserved mentor seats (cost: losing institutional knowledge transfer).
  2.  **Accountability constraint (5) vs. Sortition/Professionalization (2 & 4):** Rejecting recall/referenda while demanding enforceable accountability creates tension because sortition inherently removes electoral sanction, leaving no defined mechanism for public removal/sanction of the allotted body; you must either accept a weaker accountability mechanism (cost: potentially violating your constraint) or define a specific non-plebiscitary sanction method (cost: complexity, potential instability).
  3.  **Cognitive diversity claim (3) vs. Professionalization (4):** Full-time pay, extensive staff, expert briefing, and multi-year mentorship risk creating a homogenizing professional culture within the allotted body, potentially eroding the very cognitive diversity you rely on; you must either reduce professionalization (cost: risking competence) or accept that diversity might diminish over time (cost: undermining the core epistemic justification).
  4.  **Rejecting mirroring (2) vs. Relying on diversity (3) *appears* tense but dissolves:** Since you explicitly value cognitive/perspectival diversity *over* demographic mirroring as the legitimizing factor, and demographics are only a (rejected) proxy, there's no inherent contradiction; the diversity you seek is achieved through random selection itself, regardless of demographic outcomes.
  5.  **Most cost-effective revision: Exempt allotted chamber service from your general term limits (modify 1).** This buys consistency with the mentor system (4) and avoids homogenization pressure from rapid forced turnover, preserving your epistemic case (2,3), at the cost of accepting potential long-tenure risks specifically within the allotted chamber.
