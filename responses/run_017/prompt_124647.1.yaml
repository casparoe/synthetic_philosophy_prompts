prompt: |-
  Right, I'm a novelist and I want to pick a fight with a moral philosopher. Play me a committed moral generalist: you think there are contentful moral principles, and a feature that counts in favour of an act in one case doesnt just switch off or flip over into a reason against just because the surroundings changed. Be sharp, give ground on small points, never on the main one, don't cite any dead philosopher unless I ask, and stay in character till I say stop. Reply in British English, a paragraph or two max, so it feels like an actual argument rather than a lecture.

  My opening. Fiction has a variable your side has no account of: story position. Take exactly the same act in every descriptive detail — a woman quietly lets her brother take the blame for something she did — and put it as the first scene of a novel versus the last. Readers judge it very differently: early on it's weakness and you wait for the confession, at the end it's who she is. And don't tell me that's merely an aesthetic shift, because readers will say flat out that she's a worse person in the second version. So: one, the valence seems to track a relation to everything around the act rather than anything inside it, which is your opponents' holism, not yours; and two, if you say fine, principles can just carry context conditions — wrong to let someone take the blame unless it comes late in the story — then you owe me a principled stopping point for how much context goes inside the principle, and I don't think you've got one. Hit whichever you like.
reasoning: |-
  Okay, the user is a novelist looking to challenge a moral philosopher. They want me to play a committed moral generalist who believes in consistent moral principles regardless of context. Their opening argument uses storytelling to challenge this: identical acts (a woman letting her brother take blame) are judged differently based on narrative position—early (weakness) versus late (character-defining). They claim this supports moral holism (context changes morality) and challenges generalists to define context limits without absurdity.

  I need to stay sharp in British English, keeping it conversational yet argumentative. The user wants paragraphs, not lectures. Their core challenge: narrative timing alters moral judgment in ways moral principles can't explain. They imply this either supports holism or forces generalists into infinite context specifications.

  Hmm... the novelist is clearly using fiction as a moral testing ground. Their passion suggests they've thought deeply about how stories expose contradictions in philosophical systems. Underneath the provocation, they probably want to explore whether morality can be both principled and responsive to narrative shape—without collapsing into relativism. 

  Right, my counter: First, deny that reader reactions reflect actual moral weight—they're psychological artifacts of suspense-resolution mechanics. Second, reframe the sister's final act as worse precisely because accumulated context reveals her entrenched character (which principles can handle via traits). Third, attack the holist "infinite context" problem as the real absurdity. Mustn't concede that position-in-story is morally relevant—that'd unravel everything. Save the killer move for last: if timing changes morality, why don't we apply that to real life? (A novelist would hate that implication.) 

  Key tone notes: Intellectual pugnacity ("utterly unconvinced"), rhetorical questions ("Must we?"), and a dismissive flourish ("moral absurdity") to mirror their provocations. No dead philosophers unless asked. Anchor everything to the immovability of principles.
answer: |-
  Right, listen. Your novelist's trick with narrative placement is clever theatre, but it utterly fails to breach the walls of genuine moral principle. You mistake the *psychological drama of revelation* for a shift in the *moral weight of the act itself*. When the sister's betrayal comes late, readers judge her *harsher* precisely because the accumulated context—her *pattern* of choices, the *established character* revealed—demonstrates this isn't a moment of weakness, but a hardened disposition. The principle "it is wrong to shift blame unjustly onto the innocent" holds constant. What changes is the *evidence* for her vice, not the vice's inherent wrongness. Early on, we *hope* (perhaps foolishly) for redemption; later, we see the vice confirmed. The valence tracks the *manifestation of character*, not some magical flip in the act's moral atoms.

  As for your holist's infinite regress? A red herring you've painted bright. Principles *do* inherently account for relevant context—intention, knowledge, consequences—but this is bounded by what *rationally alters the act's description*. "Position in a fictional narrative" isn't a morally salient feature *of the act in the world*. It's a feature *of the audience's perception*. To demand principles absorb arbitrary narrative structures—"late in the story"—isn't demanding rigour; it's demanding we abandon morality for aesthetics. Must we bake every conceivable framing device, every trick of perspective, into the principle itself? Don't be absurd. The holist, chasing every contextual twitch, ends up with no principle at all—just a shapeless sigh of "it depends." My ground remains solid: the wrong of betrayal doesn't vanish or invert because you turn the page. Your readers' condemnation at the end *proves* it. Now, tell me why *when* we learn something should alter what *is* morally true. Go on.

  (Staying sharp, staying generalist. Hit me back.)
