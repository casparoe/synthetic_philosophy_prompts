answer: |-
  ### Exam Question: Gibbard-Satterthwaite Theorem and Plurality Rule (25 points)

  **Background**: The Gibbard-Satterthwaite theorem states that for \(m \geq 3\) alternatives, any deterministic social choice function (SCF) that is onto, strategy-proof, and defined for all strict preference profiles must be dictatorial. A student claims that plurality rule refutes this theorem because it is "favourite-proof": no voter can help their *most-preferred alternative* win by lying. We define:  
  - **Plurality rule**: Each voter reports their top-ranked alternative. The alternative with the most votes wins. Ties are broken by a fixed strict order (e.g., \(A > B > C\) means \(A\) wins ties).  
  - **Antiplurality rule**: Each voter reports their *least-preferred* alternative. The alternative with the *fewest* votes against it wins (same tie-breaking).  
  - **Favourite-proof**: No voter can increase the probability (0 or 1 here) that their true top-ranked alternative wins by lying.  
  - **Strategy-proof**: No voter can get a *strictly better outcome* (by their true preferences) by lying.  

  **Tasks**:  
  **(a) [5 points]** Verify that plurality rule (with tie-breaking) is:  
  - Onto (its range is all alternatives),  
  - Nondictatorial (no voter always gets their top choice),  
  - Favourite-proof.  
  Use minimal assumptions (at least 3 alternatives, any number of voters).  

  **(b) [10 points]** Plurality is not strategy-proof. Provide an explicit profile (list all voters’ rankings) with the **minimal** number of voters and alternatives (≥3) where one voter manipulates plurality. Specify:  
  - The tie-breaking order,  
  - All voters’ true preferences,  
  - Truthful votes and outcome,  
  - The insincere vote and new outcome,  
  - Why the manipulation benefits the liar (use their true preferences).  

  **(c) [5 points]** Is antiplurality rule favourite-proof? **If yes**, explain why. **If no**, provide an explicit minimal example (profile, tie-breaking, votes, outcomes) showing a voter *can* help their top-ranked alternative win by lying.  

  **(d) [5 points]** In 1–2 sentences, explain why strategy-proofness (not favourite-proofness) is the correct requirement for the Gibbard-Satterthwaite theorem.

  ---

  ### Model Answer

  **(a)**  
  - **Onto**: For any alternative \(X\), if all voters rank \(X\) top, \(X\) wins. Thus, the range is all alternatives.  
  - **Nondictatorial**: With ≥2 voters, no voter is a dictator. Example: 2 voters, 3 alternatives \(\{A,B,C\}\), tie-break \(A>B>C\). Voter 1 ranks \(A>B>C\), voter 2 ranks \(B>A>C\). Truthful votes: \(A\) (V1), \(B\) (V2). Tie: \(A\) wins (tie-break). But if voter 1 were a dictator, \(A\) should always win. If voter 2 votes \(B\) and others (none) vote \(A\), \(B\) wins—contradiction.  
  - **Favourite-proof**: If a voter lies, they shift their vote from their true top \(T\) to some \(S \neq T\). This decreases \(T\)’s votes by 1 and increases \(S\)’s votes by 1, which cannot increase \(T\)’s chance of winning (it may hurt \(T\) but never helps).  

  **(b)**  
  - **Tie-breaking**: \(A > B > C\)  
  - **Voters’ true preferences** (3 voters, 3 alternatives):  
    - Voter 1: \(A \succ_1 B \succ_1 C\) → Votes \(A\)  
    - Voter 2: \(B \succ_2 A \succ_2 C\) → Votes \(B\)  
    - Voter 3: \(C \succ_3 B \succ_3 A\) → Truthfully votes \(C\)  
  - **Truthful outcome**: Votes: \(A:1\), \(B:1\), \(C:1\). Tie → \(A\) wins (tie-break \(A>B>C\)).  
  - **Manipulation**: Voter 3 lies and votes \(B\) (instead of \(C\)). New votes: \(A:1\), \(B:2\), \(C:0\). Outcome: \(B\) wins (most votes).  
  - **Why beneficial**: Voter 3’s true preference is \(C \succ_3 B \succ_3 A\). Truthful outcome \(A\) is worst; new outcome \(B\) is better than \(A\).  

  **(c)**  
  **Antiplurality is not favourite-proof.**  
  - **Tie-breaking**: \(A > B > C\)  
  - **Voters’ true preferences** (2 voters, 3 alternatives):  
    - Voter 1: \(A \succ_1 B \succ_1 C\) → Reports least favourite \(C\)  
    - Voter 2: \(B \succ_2 A \succ_2 C\) → Truthfully reports least favourite \(C\)  
  - **Truthful outcome**: Votes against: \(A:0\), \(B:0\), \(C:2\) → Tie (0 votes against for \(A,B\)). Tie-break → \(A\) wins.  
  - **Manipulation**: Voter 2 lies and reports \(A\) as least favourite (instead of \(C\)). New reports: V1: \(C\), V2: \(A\). Votes against: \(A:1\), \(B:0\), \(C:1\). Outcome: \(B\) wins (fewest against, 0).  
  - **Why helps favourite**: Voter 2’s top is \(B\). Truthful outcome: \(A\) (not \(B\)); after lying, \(B\) wins.  

  **(d)**  
  Strategy-proofness protects voters in *all* situations—not just when they seek to elect their top choice—by preventing manipulation that yields *any* better outcome (e.g., avoiding a worst alternative). Favourite-proofness fails when a voter’s top choice is unviable; they may still need to manipulate to prevent a bad outcome, as in plurality elections.

  ---

  ### Marking Scheme (25 points total)
  **General**: Deduct 1 point for minor errors (e.g., incomplete notation). Award partial credit for progress.  

  **(a) [5 points]**  
  - **Onto (1 pt)**: States that if all vote for \(X\), \(X\) wins.  
    - *Common mistake*: Omits example or assumes specific voters.  
  - **Nondictatorial (2 pts)**: Example with ≥2 voters showing no dictator (e.g., 2 voters, \(A\) wins when voter 1 votes \(A\), but \(B\) wins if voter 2 votes \(B\) and voter 1 is ignored).  
    - *Common mistake*: Uses a dictator example or ignores tie-breaking.  
  - **Favourite-proof (2 pts)**: Explains lying hurts top choice (vote transfer weakens it).  
    - *Common mistake*: Confuses with strategy-proofness.  

  **(b) [10 points]**  
  - **Minimality (1 pt)**: 3 voters, 3 alternatives. (If 4+ voters but correct: 0.5 pt.)  
  - **Tie-breaking (1 pt)**: Explicitly stated and applied.  
  - **Profile (2 pts)**: All rankings and votes shown (e.g., V3: \(C \succ B \succ A\) → votes \(C\)).  
  - **Outcomes (2 pts)**: Truthful outcome \(A\) (after tie-break), new outcome \(B\).  
  - **Manipulation (2 pts)**: Voter 3 votes \(B\) insincerely.  
  - **Benefit (2 pts)**: Voter 3 prefers \(B\) over \(A\) (with reference to \(\succ_3\)).  
    - *Common mistakes*:  
      - Outcome unchanged (e.g., manipulator’s vote doesn’t alter winner).  
      - Benefit not justified with preferences (e.g., no ranking comparison).  

  **(c) [5 points]**  
  - **Correct answer (1 pt)**: "No, not favourite-proof."  
  - **Minimality (1 pt)**: 2 voters, 3 alternatives.  
  - **Profile (1 pt)**: Rankings and reports (e.g., V2: \(B \succ A \succ C\) → reports \(C\) truthfully).  
  - **Manipulation (1 pt)**: Voter 2 reports \(A\) as least favourite.  
  - **Outcomes (1 pt)**: Truthful: \(A\) wins; new: \(B\) wins.  
    - *Common mistakes*:  
      - Claims it is favourite-proof.  
      - Example doesn’t show top alternative winning after manipulation.  

  **(d) [5 points]**  
  - **Strategy-proofness (3 pts)**: Explains it covers *any* improvement (not just top choice).  
  - **Favourite-proofness flaw (2 pts)**: Notes voters may manipulate to avoid bad outcomes (e.g., when top is unviable).  
    - *Common mistake*: Only says "strategy-proofness is stronger" without context.

  ---

  ### Notes for Instructor  
  - **Voter counts**: Minimal: 3 voters for (b) (example works with tie-breaking). For (c), 2 voters suffice.  
  - **Tie-breaking**: Critical in (b) to resolve initial tie. Use \(A>B>C\) consistently. Double-check that:  
    - In (b), truthful tie (A,B,C) → \(A\) wins; after manipulation, \(B\) wins.  
    - In (c), truthful tie (A,B) → \(A\) wins; after manipulation, \(B\) wins.  
  - **Strong students**: May extend (d) to discuss why G-S requires full strategy-proofness (quantifies over all improvements, not just top). May note antiplurality protects *least-preferred* (not favourite).  
  - **Time**: Budget 25–30 minutes. Part (b) is most time-sensitive (profile construction).  
  - **Checks**:  
    - Verify (b) profile: With V3 truthful, \(A\) wins; lying gives \(B\), which V3 prefers over \(A\).  
    - Verify (c) profile: V2 lying makes \(B\) win (their favourite), impossible if favourite-proof.  
  - **Potential issues**:  
    - In (b), students may design a profile where the manipulator’s top wins (violating favourite-proofness)—emphasize this is impossible.  
    - In (c), some may misdefine antiplurality (ensure they count *fewest* votes against).  
  - **Backup**: If students struggle with (b), ensure alternatives ≥3 and tie-breaking is used.
