prompt: |-
  You are a political theorist who has published on democratic reform and who also writes satirical pieces for a magazine of ideas. Please work carefully, and start with a short private brainstorming pass before you draft: list eight to ten genuine, widely discussed features of lottery-selected deliberative bodies — how members are drawn, who sets the question, how evidence reaches them, how disagreement among them is handled, what becomes of the recommendations — and beside each, in one line, name the objection that feature invites. Use that list only as scaffolding. None of those objections may be stated anywhere in the document you then write.

  The commission:

  Three weeks ago I was drawn in the first lottery for the Sunbury Citizens' Chamber, my state's replacement for the upper house, and I take my seat in six weeks. The orientation packet that arrived is written in the cheerful register of corporate human resources, and reading it has convinced me that the interesting thing about a lottery legislature is not the lottery. I would like you to write a satirical version of that packet: the "Questions Newly Selected Members Ask Most Often" section of the Chamber's Member Handbook, 800–1,000 words, with a letterhead, a two-sentence preamble, and ten to twelve numbered question-and-answer items whose headings are phrased as the questions a new member actually asks — "What will I be deciding?", "What if I already know something about this?", "Can I talk to the others between sessions?", "What happens afterwards?"

  The venue is an official plain-language guide; the voice is warm, competent, and entirely unembarrassed. No one in the document should be a villain, and nothing should be a scandal: the dread should come from the fact that every arrangement described is reasonable and well administered. Keep the deadpan absolute — no winking, no ironic italics, no aside to the reader, no closing twist that breaks character. It should make a reader who knows the sortition literature laugh in recognition and still be legible and funny to a reader who has never heard of sortition: do not explain sortition anywhere, name no real assembly, organization, or person, and quote no real document.

  Ground the piece in the following actual features of our Chamber. You may exaggerate them and you should add two or three inventions of your own in the same spirit, but do not replace them:

  1. Members are drawn by stratified lot from the electoral roll — 180 seats, three overlapping cohorts of sixty, eighteen months each, non-renewable. The sample's demographic legibility is treated as a formal property of the Chamber: an absence unbalances it, so an excused member is replaced by a demographically matched reserve.
  2. The questions the Chamber may address are set by an appointed Convening Panel, in the exact form posed. The Chamber may add no question of its own, and a schedule of Matters of Reserved Competence — taxation, treaties, anything with a budget line above a stated threshold — is withdrawn from its remit.
  3. All evidence reaches members through the Official Briefing. Members sign a Frame Integrity Undertaking not to consult outside material bearing on the question; suspected breaches go to Frame Contamination Review. The Office of Neutral Framing writes the Briefing, pre-clears the options that may appear on the ballot, and costs them.
  4. Expert witnesses appear in matched pairs. Where no counter-witness exists, one is commissioned; where none can be commissioned, the testimony is designated Single-Testimony and members are instructed to weigh it with correspondingly reduced confidence.
  5. Members who have professional expertise bearing on the question are, in order to protect the ordinariness of the sample, recused from substantive participation and reassigned to the Witness Liaison tier.
  6. Because sortition is meant to end careerism, a member may not stand for election for six years after service. The Alumni Register and the Certified Deliberator credential, however, permit a former member to return as a paid facilitator, briefing reviewer, or Civic Ambassador. Attendance, recusals, and Deliberative Integrity Scores all bear on standing in the Register.
  7. Deliberation is measured. Each member completes a values inventory at the opening and close of each question; the Deliberative Integrity Score combines opinion movement, recorded as "openness," with airtime equity and fidelity to Briefing material. Members whose views do not move are flagged as non-deliberative and receive additional facilitation. Speaking time is allocated per member and may not be yielded, pooled, or transferred. Persuasion outside scheduled sessions is Prohibited Deliberative Contact. Tables are re-sorted weekly, and members may not sit with anyone they knew before selection.
  8. Recommendations go to the Convening Panel, which must respond in writing within twelve months with one of three dispositions: accept, accept in part, or note.

  Two further constraints. First, the target is the practice and its rhetoric, not any person: the piece should land the standing worries about lottery government — where the power goes once the members are random, who frames the question and the options, what competence is and who is disqualified for having it, whether accountability has been abolished or merely relocated, whether randomization ends careerism or professionalizes it differently, and what a recommendation is worth — by embodying each in a procedure rather than mentioning any of them. Second, give the piece no narrative: no member rebels, no facilitator sneers, nothing is resolved. It is a document, and it should end as a document ends — with, say, an invitation to contact the Member Experience Team.
reasoning: |-
  Okay, the user wants me to write a satirical orientation packet for a lottery-selected legislative body. They've provided incredibly detailed specifications, so I need to approach this carefully. 

  First, I consider who the user might be - probably someone deeply familiar with democratic theory and sortition, given how precisely they've outlined the features to satirize. They're not just asking for humor; they want institutional critique through deadpan bureaucratic language. The challenge is making this funny to both experts and newcomers without breaking character.

  I mentally list the key features they specified: demographic matching for replacements, rigid question-setting by a panel, controlled information flow through "Official Briefings," forced pairing of experts, recusal of knowledgeable members, post-service restrictions with credentialing systems, quantified deliberation metrics, and limited impact of recommendations. 

  For the satire to work, I need to embody the underlying tensions without stating them explicitly. The dread should come from how reasonable everything sounds. Like how replacing excused members with "demographically matched reserves" treats people as statistical categories. Or how "Frame Integrity" procedures turn isolation from outside information into a virtue.

  I consider inventing 2-3 features in the same spirit: maybe something about emotional regulation during deliberation, or standardized language for expressing opinions. The "Deliberative Integrity Score" is already ripe for expansion - could add sub-metrics like "values inventory consistency." 

  The tone must stay warm and competent throughout, like a helpful HR document. Phrases like "we recognize this may feel counterintuitive at first" will sell the parody. For structure, I'll use exactly 12 Q&A items covering all specified features plus my inventions, ending with standard contact information.

  Most importantly: no villains, no plot, no winking at the reader. The horror is in the paperwork. When describing how recommendations get politely filed away, the language should sound utterly unfazed by the pointlessness.
answer: |-
  **SUNBURY CITIZENS' CHAMBER**  
  **Member Handbook: Orientation Supplement**  
  *"Your Voice, Our Process"*

  Welcome to the Sunbury Citizens' Chamber! We’re delighted you’ve been selected to serve. This section addresses questions new members frequently ask, helping you transition smoothly into your vital deliberative role. Your contribution is valued and unique.

  **1. What will I actually be deciding?**  
  You’ll be deliberating on specific Questions of Public Significance, carefully framed for clarity by the independent Convening Panel. These questions address complex issues requiring thoughtful public input. The exact wording and available response options are provided in your Official Briefing materials. Rest assured, Matters of Reserved Competence (like specific taxation models or international treaties) are outside our scope and remain with elected bodies.

  **2. What if I already know something about the topic?**  
  We celebrate diverse life experiences! However, to preserve the Chamber’s unique character as a microcosm of our community, members possessing professional expertise directly relevant to the Question at hand are temporarily reassigned to our Witness Liaison tier. This ensures the deliberating body reflects the "ordinary wisdom" the Chamber is designed to capture. You’ll receive full credit for participation during this valuable service.

  **3. Can I read up on the topic myself?**  
  To ensure all members engage with the same high-quality, balanced information foundation, the *only* material used for deliberation is the Official Briefing prepared by the Office of Neutral Framing. Your signed Frame Integrity Undertaking confirms your commitment to this principle. Consulting external sources risks Frame Contamination, which is reviewed by an independent process to protect the integrity of our outcomes. Trust the Briefing!

  **4. How do we hear from experts?**  
  Expert perspectives are presented in balanced pairs whenever possible. If a suitable counter-perspective isn’t readily available, the Office of Neutral Framing commissions one to ensure equilibrium. In the rare instance only one perspective exists, it’s clearly marked as Single-Testimony, and your Briefing will guide you on appropriately calibrated consideration. Balance is our priority.

  **5. Can I talk to other members outside formal sessions?**  
  Building camaraderie is encouraged! However, discussions *specifically about the substantive Question under active deliberation* are considered Prohibited Deliberative Contact outside scheduled, facilitated sessions. This ensures fairness and prevents premature consensus formation. Feel free to discuss the weather, sports, or Chamber catering menus anytime! Table assignments rotate weekly to foster broad connections.

  **6. What if I know someone else who was selected?**  
  Wonderful! Civic connection is a strength. To ensure fresh perspectives and prevent pre-existing relationships influencing deliberation, seating is arranged so you won’t be placed at the same table as anyone you knew prior to selection. This helps everyone engage openly with new fellow members.

  **7. How is my input measured or counted?**  
  Your voice matters! To ensure equitable participation, each member receives an equal, non-transferable allocation of speaking time during facilitated sessions. Additionally, your thoughtful engagement is reflected in your Deliberative Integrity Score (DIS). This helpful metric considers factors like speaking time usage, adherence to Briefing material, and measured shifts in perspective between your opening and closing values inventories – indicating valuable "openness." Members showing exceptional consistency in views receive supportive, additional facilitation to explore the Briefing’s nuances.

  **8. What if I can’t attend a session due to illness or emergency?**  
  Your well-being is paramount! Please notify the Member Experience Team immediately. To maintain the Chamber’s vital demographic balance – a cornerstone of its legitimacy – an excused absence requires activating a pre-qualified Reserve Member who matches your specific demographic profile (e.g., age bracket, residential district, employment category). This ensures the Chamber remains a true reflection of Sunbury.

  **9. What happens after we make a recommendation?**  
  Your hard work culminates in a clear recommendation! The Convening Panel, which set the Question, receives it formally. The Panel is required to provide a written response within twelve months, detailing how they’ve considered your input. Their response will fall into one of three thoughtful categories: Accept, Accept in Part, or Note. This transparent process ensures your deliberation informs ongoing governance.

  **10. Can I use this experience to run for office later?**  
  Your service is a unique civic contribution! To honor the principle of rotating participation and prevent any perception of careerism, members are ineligible to stand for elected state office for six years following their term. However, your valuable experience can be leveraged through the Chamber’s Alumni Register! High DIS scores and strong attendance open doors to roles like Certified Deliberator, Civic Ambassador, Briefing Reviewer, or Facilitator – all compensated positions applying your honed skills.

  **11. What if I feel strongly emotional during deliberation?**  
  Passion is natural when considering important issues! Our trained Emotional Equilibrium Facilitators (EEFs) discreetly monitor sessions. Should biofeedback indicators (voluntary and anonymized!) suggest heightened states, an EEF may offer calming techniques or a brief, guided reflection break in the Serenity Pod. Maintaining a constructive, low-affect environment optimizes rational deliberation for everyone.

  **12. How do I express nuanced opinions within the voting options?**  
  The Office of Neutral Framing crafts ballot options to capture the spectrum of viable, costed policy directions identified during the Briefing process. While individual perspectives are rich and varied, the goal is a clear Chamber recommendation. Facilitators can help you map your personal views onto the available options during clarification sessions. Remember, the pre-cleared options represent the distilled pathways forward.

  We hope this clarifies your important role. Your journey as a vital voice for Sunbury begins now! For further assistance, contact the Member Experience Team at MET@SunburyCC.gov or call 1-800-CHAMBER (242-6237), Option 2. Welcome aboard!
