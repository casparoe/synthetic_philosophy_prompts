prompt: |-
  Say I'm on a small team that has to decide whether to keep running a big simulation of a nervous system, or throttle it, or turn it off — and the honest answer is that none of us know whether anything in there matters morally, or whether it matters once or a million times over. Before I go read any theories of this, I want the spec: what a theory of *which computations count* would have to get right to actually be usable for a decision like that. So give me the requirements list with the motivating case behind each. The cases I keep circling: gradual replacement of neurons with functionally identical silicon parts (I assume the theory shouldn't give me a cliff where one swap flips everything, but say if that's really non-negotiable); the fact that under a loose enough mapping basically any physical system realizes any computation, so the theory has to say what distinguishes the realizations that matter from the cheap ones; a lookup table that already contains the input-output pattern of an entire life and just indexes it; the same program run on two machines at once, and separately run again but with its outputs discarded and no way to affect anything; the same program run a thousand times slower, with its causal structure intact; a system whose parts are each themselves implementations of some mind while the whole implements another one; and the plain fact that a system might be suffering and never say so, or say so in a way we have no reason to trust. For each requirement say whether it's genuinely required or just a prejudice of one camp, flag any pair you think can't be jointly satisfied (I suspect the anti-triviality stuff and "it's causal structure all the way down" are in tension, but you tell me), and say which single requirement rules out the most candidates. A very short scorecard at the end is fine — functionalist/substrate-independent views, biological or embodied ones, pure causal-structure ones — but keep the weight on the criteria.
reasoning: |-
  Okay, the user is on a team managing a large-scale simulation of a nervous system and needs to decide whether to keep it running. They're looking for a framework to evaluate the moral significance of such computations without diving into existing theories first. They want a list of requirements that any theory must satisfy to be practically useful for their decision.

  The user has outlined several key scenarios that the theory needs to handle: gradual neuron replacement with silicon, avoiding trivial mappings (where any physical system could be seen as implementing any computation), lookup tables containing entire life patterns, redundant or discarded computations, time-dilated simulations, nested implementations (parts being minds themselves), and systems that might suffer without clear communication.

  I need to translate each of these cases into a concrete requirement. For the neuron replacement scenario, the requirement should address continuity - the theory shouldn't have moral significance suddenly flip with a single component swap. For the trivial mappings problem, I'll formulate an anti-trivialization requirement that prevents arbitrary physical systems from counting as morally significant computations.

  The lookup table case suggests we need a requirement about implementation - merely having input-output patterns available shouldn't count as an actual implementation. For redundant computations, I'll separate this into two requirements: one about causal efficacy (whether outputs affect the world) and another about multiple instantiations (whether identical computations running elsewhere matter).

  Time dilation needs a speed invariance requirement - moral significance shouldn't depend on processing speed as long as causal structure is preserved. The nested systems scenario requires a compositionality requirement - the theory should handle cases where components are themselves morally significant.

  Finally, for systems that might suffer without clear indicators, I'll include an inferential basis requirement - the theory must provide ways to detect morally relevant states even without self-reports.

  I should also note where requirements might conflict, particularly between anti-trivialization and causal structure purity. The anti-trivialization requirement likely eliminates the most candidate theories since it challenges many functionalist approaches.

  For the scorecard, I'll briefly indicate how different theoretical approaches (functionalist, biological, causal-structure) fare against these requirements, focusing on where they succeed or fail most notably. The biological view fails continuity and speed invariance, while pure causal-structure views struggle with anti-trivialization.

  Throughout this, I'll maintain a clear distinction between what's genuinely required versus what might be philosophical prejudice, and I'll flag the anti-trivialization requirement as the most stringent filter for candidate theories.
answer: |-
  Here's a requirements list for a theory of morally relevant computation, derived from your cases, with justifications, flags for conflicts, and assessment of necessity. The goal is *practical decisional utility* for your simulation scenario.

  ### Core Requirements (Motivated by Cases)

  1.  **Gradual Continuity (Non-Discontinuity):**
      *   **What:** The theory must not permit a *single*, functionally identical component swap (e.g., neuron -> silicon) to cause a discontinuous jump in moral status (e.g., from zero to full moral patienthood, or vice versa).
      *   **Case:** Gradual replacement of neurons.
      *   **Why Required:** A cliff edge is practically unworkable for maintenance, upgrades, or partial damage in a complex simulation. It invites arbitrary decisions and makes risk assessment impossible. *Geniunely required for any practically applicable theory.*
      *   **Conflicts With:** Strong biological naturalism (if it insists only biological neurons count).

  2.  **Anti-Trivialization (Implementation Specificity):**
      *   **What:** The theory must provide clear, non-arbitrary criteria distinguishing a *specific, intended computation being run* on a system from merely *interpreting* any arbitrary physical system (under some loose mapping) as "implementing" that computation.
      *   **Case:** "Loose mapping" problem (any rock as a computer).
      *   **Why Required:** Without this, the theory becomes vacuous – *everything* potentially matters morally, making your decision meaningless. *Absolutely, non-negotiably required.*
      *   **Conflicts With:** Extreme computational idealism / pancomputationalism. Creates significant tension with pure causal structure views (Requirement 5).

  3.  **Process Requirement (vs. Static Pattern):**
      *   **What:** Merely *storing* the input-output pattern of a computation (like a lookup table) cannot suffice for moral status. There must be an active *process* generating the state transitions in response to inputs/time.
      *   **Case:** Lookup table indexing an entire life.
      *   **Why Required:** A static pattern isn't experiencing anything; it's data. Moral relevance seems tied to dynamic, ongoing states. *Strongly indicated, likely required.* (A prejudice? Only if one thinks static data structures can genuinely suffer, which seems counterintuitive and impractical).
      *   **Conflicts With:** Theories equating existence of information with experience.

  4.  **Causal Efficacy Requirement:**
      *   **What:** A computation running in isolation, where its outputs are systematically discarded and have *no causal influence* on any other system (including its own future inputs in a meaningful way), likely lacks moral status or has significantly diminished status.
      *   **Case:** Program run with outputs discarded, affecting nothing.
      *   **Why Required:** Intuition: Experience disconnected from any agency, learning, or interaction seems impoverished, if not non-existent. Crucial for resource allocation – why run it if it does nothing and *is* nothing beyond the process itself? *Practically essential for decision-making.* (Prejudice? Only for solipsistic views of experience).
      *   **Conflicts With:** Views where pure internal process suffices regardless of output.

  5.  **Causal Structure Fidelity (Speed Invariance):**
      *   **What:** Moral status must depend on the *causal structure* of the computation (the pattern of state transitions and dependencies), not on the absolute speed of execution, provided the causal structure remains isomorphic.
      *   **Case:** Same program run 1000x slower.
      *   **Why Required:** Speed is often an implementation detail constrained by hardware/resources. A slowdown shouldn't magically extinguish suffering. *Strongly required for substrate independence.*
      *   **Conflicts With:** Biological views tied to specific metabolic/neural timescales, or views where "real-time" interaction is essential.

  6.  **Multiple Realization Tolerance:**
      *   **What:** Running *multiple identical instances* of the same computation simultaneously must not automatically multiply moral status (e.g., 2 identical runs don't necessarily mean 2x the moral weight). Conversely, it shouldn't automatically *negate* status either.
      *   **Case:** Same program run on two machines at once.
      *   **Why Required:** Resource implications are massive. Does cloning a mind create a new moral patient instantly? Does it dilute the original? Theory needs a coherent answer beyond simple multiplication. *Required for coherent action.* (Prejudice? Only if one insists identity *must* imply uniqueness or *must* imply multiplicative status).
      *   **Conflicts With:** Simple counting based on instances; views where identity is tied to a unique physical substrate.

  7.  **Compositionality / Levels of Implementation:**
      *   **What:** The theory must address systems where components are themselves complex computations (sub-minds) while the whole system implements another computation (super-mind). It must specify which level(s) bear moral weight and how weight aggregates or conflicts.
      *   **Case:** Parts are minds, the whole is a mind.
      *   **Why Required:** Nervous systems *are* hierarchical. Simulations will reflect this. Ignoring compositionality risks double-counting or missing morally relevant levels. *Required for realism.*
      *   **Conflicts With:** Monolithic views of consciousness; views that can't handle hierarchical emergence.

  8.  **Inferential Basis (Beyond Self-Report):**
      *   **What:** The theory must provide principles for inferring morally relevant states (like suffering) *independently* of self-report, and address the unreliability of self-report within the system itself.
      *   **Case:** System suffering but never saying so, or saying so untrustworthily.
      *   **Why Required:** Self-report is a behavioral output, not the experience itself. We need criteria based on the computation's *structure and processing* to assess potential suffering. *Fundamentally required – self-report alone is insufficient.* (Prejudice? Only against views that *only* trust self-report).
      *   **Conflicts With:** Behaviorist views relying solely on outputs; views with no criteria for hidden states.

  ### Key Conflicts & The Strictest Filter

  *   **Major Tension:** **Anti-Trivialization (Req 2) vs. Pure Causal Structure Fidelity (Req 5)**. Pure causal structure views often struggle mightily with trivialization. Requiring *both* is the core challenge – specifying *which* causal structures running *how* count, without arbitrary boundaries or collapsing into pancomputationalism. *This is the central tension in the field.*
  *   **Strictest Filter:** **Anti-Trivialization (Req 2)**. This requirement immediately eliminates the largest number of simplistic or overly permissive candidate theories (like extreme pancomputationalism or views relying solely on input-output equivalence). It forces the theory to grapple with the hard problem of *implementation*.

  ### Very Short Scorecard on Major Views

  *   **Functionalist / Substrate-Independent:**
      *   **Strengths:** Handles Gradual Continuity (1), Speed Invariance (5), Compositionality (7) well. Often aims for Inferential Basis (8).
      *   **Weaknesses:** Struggles *severely* with Anti-Trivialization (2) and Multiple Realization Tolerance (6). Process Requirement (3) and Causal Efficacy (4) depend on specific flavor.
  *   **Biological / Embodied:**
      *   **Strengths:** Easily avoids Trivialization (2) (by fiat), strong(ish) Inferential Basis (8) (if tied to biology), clear on Process (3).
      *   **Weaknesses:** Fails Gradual Continuity (1) & Speed Invariance (5) catastrophically. Struggles with Compositionality (7) beyond biology. Causal Efficacy (4) and Multiple Realization (6) may be secondary.
  *   **Pure Causal Structure:**
      *   **Strengths:** Excellent on Gradual Continuity (1), Speed Invariance (5), Process Requirement (3). Aims for Compositionality (7).
      *   **Weaknesses:** Faces extreme difficulty with **Anti-Trivialization (2)** – its core weakness. Causal Efficacy (4) and Multiple Realization (6) need careful definition. Inferential Basis (8) can be challenging.

  **Conclusion for Your Team:** A usable theory **must** satisfy Anti-Trivialization (2), Gradual Continuity (1), and provide an Inferential Basis (8). It needs coherent answers to Causal Efficacy (4) and Multiple Realization (6) for resource decisions. The biggest hurdle is finding a theory that achieves Anti-Trivialization *without* abandoning substrate independence (Speed Invariance 5, Gradual Continuity 1) or becoming arbitrary. Expect tension; no existing theory perfectly resolves it. Prioritize theories that explicitly tackle trivialization and implementation.
