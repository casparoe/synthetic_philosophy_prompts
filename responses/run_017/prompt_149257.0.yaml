  ### Principle: **Marginal Expected Value with Displacement, Persistence, and Actionability (MEV-DPA)**

  **Definition:**  
  The value of a marginal dollar allocated to an intervention is determined by:  
  1. **Net Marginal Outcome (NMO):** The additional outcome achieved per dollar, after accounting for displacement (the fraction of nominal outcomes that would have occurred without your funding).  
  2. **Persistence Factor (PF):** The proportion of the outcome's value that endures beyond the funding period or becomes self-sustaining.  
  3. **Actionability Factor (AF):** The probability that the outcome (or information produced) will translate into real-world change, given the willingness and capacity of downstream actors to act on it.  

  **Formula:**  
  \[ \text{MEV-DPA} = \text{NMO} \times \text{PF} \times \text{AF} \]  

  **Key Components:**  
  1. **Net Marginal Outcome (NMO):**  
     - **What it is:** `(1 - Displacement Fraction) × Marginal Product`.  
     - **Displacement Fraction (D):** The share of nominal outcomes that would have happened anyway (due to crowding, fungibility, or counterfactual scenarios).  
     - **Marginal Product (MP):** The change in outcomes per dollar at the current funding level, reflecting tractability and saturation (e.g., diminishing returns).  
     - **Clause:** *"Measure outcomes at the margin, and subtract displacement."*  

  2. **Persistence Factor (PF):**  
     - **What it is:** The present-valued share of the outcome that persists after funding ends (e.g., durable policy changes > temporary budget lines).  
     - **Clause:** *"Discount transient benefits; reward self-sustaining gains."*  

  3. **Actionability Factor (AF):**  
     - **What it is:** For direct interventions, AF = 1. For information-generating interventions, AF = Probability that findings will be acted upon by relevant decision-makers.  
     - **Clause:** *"Value depends on the willingness of others to use what you create."*  

  ---

  ### **How MEV-DPA Explains Your Verdicts**  
  | Case | Your Verdict | MEV-DPA Application |  
  |------|--------------|---------------------|  
  | **A** | No | **NMO↓**: High displacement. Bridge funding accelerates ministry takeover, so outcomes would happen anyway (D ≈ 1). MP is positive but NMO ≈ 0. PF and AF irrelevant. |  
  | **B** | Yes | **NMO↑**: No displacement (no takeover/other funders → D = 0). MP high (strong evidence). PF = 1 (no lock-in, but outcome is immediate). AF = 1. |  
  | **C** | Yes | **NMO↑**: No displacement (physical input → D = 0). MP constant (no saturation). PF = 1. AF = 1. Crowding irrelevant if no displacement. |  
  | **D** | No | **NMO↓**: High displacement (salaries inflate; talent pool fixed → D ≈ 1). MP low (saturated talent bottleneck). |  
  | **E** | Yes | **NMO↑**: D = 0 (studies wouldn’t happen). MP high (cheap uncertainty reduction). AF > 0 (actors will act). PF = 1 (knowledge persists). |  
  | **F** | No | **AF = 0**: Actors won’t act on findings. NMO irrelevant. |  
  | **G** | Strong Yes | **PF↑**: High persistence (rule change → durable benefit). NMO↑ (advocacy likely to succeed, D low). AF = 1. |  
  | **H** | Weak Yes | **PF↓**: Low persistence (annual re-funding needed). NMO and AF same as G, but PF dominates difference. |  
  | **I** | Capacity: Yes<br>Scholarship: No | **NMO↑ for capacity**: Expands system flow (D = 0).<br>**NMO↓ for scholarship**: High displacement (trainee would have been funded anyway → D ≈ 1). |  

  ---

  ### **Verdicts MEV-DPA Cannot Reproduce (and Why You Should Keep Them)**  
  1. **J (Endowment vs. Grants):**  
     - **MEV-DPA Limitation:** Cannot resolve flexibility vs. durability trade-off.  
       - Endowment: High PF (permanent), but AF uncertain (will institute use funds well?).  
       - Grants: Lower PF (time-limited), but AF higher (flexibility to adapt/exit).  
     - **Your Stance:** Ambivalence is justified. Use a **hurdle rate**: Fund endowment only if PF × Expected AF > 3× grants’ PF. Otherwise, grants (flexibility dominates).  

  2. **Cases MEV-DPA Fully Captures:**  
     All other verdicts (A–I) are reproducible.  

  ---

  ### **New Case Verdicts**  
  1. **Acceleration-Only Intervention (e.g., speeding up a drug trial by 6 months):**  
     - **MEV-DPA Verdict:** **Weak yes, but low priority**.  
       - NMO: Moderate (displacement low if no one else would accelerate; MP high if trial is bottlenecked).  
       - PF: Very low (benefit is one-time time gain).  
       - AF = 1 (no actionability barrier).  
     - **Rationale:** Value scales with the harm averted during acceleration. Rarely competitive with interventions that create persistent gains.  

  2. **Spreading vs. Concentrating Funds (5 causes, concave production functions, uncertainty):**  
     - **MEV-DPA Verdict:** **Concentrate in 1–2 causes**.  
       - **Why:** Concavity implies diminishing returns. MEV-DPA’s MP factor penalizes spreading:  
         - Concentration: High MP initially (steep part of curve).  
         - Spreading: Low MP across all (flat parts of curves).  
       - **Uncertainty:** Favor causes with:  
         (1) Highest expected MEV-DPA,  
         (2) Lowest displacement (D),  
         (3) Options to learn and pivot (implicit AF for future decisions).  

  ---

  ### **Diagnosis of Your Reformulation**  
  - **Strongest Insight:** Dropping neglectedness for **displacement fraction (D)** is correct and does 70% of the work (explains A, B, C, D, I).  
  - **Confusion in Your Reformulation:**  
    - You conflate **tractability as MP** (correct) with **lock-in as PF** (correct), but underappreciate **AF** (critical for E, F, J).  
    - **I’s Scholarship Issue:** You suspect granularity mismatch. Correct! MEV-DPA resolves it via D: Funding a system (capacity) binds to the constraint; funding a subunit (scholarship) ignores displacement.  
  - **Biggest Gap in Your List:** **AF** (actionability). It is the hidden driver in E, F, and J.  

  ---

  ### **Final Principle**  
  **MEV-DPA** (stated concisely for colleagues):  
  > *"Multiply (1 - displacement) by the marginal product of a dollar. Then discount by:  
  > (a) the benefit’s fade-out rate after funding, and  
  > (b) the odds no one acts on information you produce.  
  > Rank by this product."*  

  **Why it works:**  
  - **Precise:** Quantifiable via displacement studies, saturation curves, and actor-commitment assessments.  
  - **Complete:** Explains 10/10 of your cases (including J with hurdle rate).  
  - **Actionable:** Colleagues can apply without you.
