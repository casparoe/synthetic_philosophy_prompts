prompt: |-
  The claim that a device can convert information into work needs a standard of assessment before it needs a verdict, so I want the specification first: write the desiderata an account of information in thermodynamics would have to satisfy. Purpose: good enough to tell an experimentalist whether a proposed nanoscopic information engine can beat the ordinary thermodynamic bounds, and if not, exactly which step of its cycle pays. Assume the reader has statistical mechanics — entropy as a state function, the second law, the Carnot bound — and knows nothing of the specialist literature. Name no authors and give no citations; define every view you discuss by its commitments.

  The desiderata have to be answerable for each of the following, and I want cases I have not thought of added to the list: a demon with a single bit of memory, reset every cycle; a demon with an effectively unbounded tape it never resets, so the record accumulates; a demon handed a tape that already carries the relevant correlation with the system, so that no measurement is performed by anyone; a demon whose detector is noisy and yields only partial information; a demon operating on a working substance that already spans two temperatures, versus one operating on a substance at equilibrium; a demon that spends its record on refrigeration rather than on work; a quantum version in which the memory becomes entangled with the system and the measurement is non-disturbing; a passive mechanism with no memory at all — trapdoor, ratchet and pawl, one-way valve — which must be excluded in a way that isolates what the memory contributes; and a device small enough and observed briefly enough that transient decreases of entropy are routinely recorded.

  For each requirement give the case that motivates it and mark it non-negotiable or a preference of one camp. I expect the hardest parts to be these, and I want them stated as requirements rather than as opinions: identify the bounded quantity and its units, and say whether the bound is a floor on dissipation, an identity, or a limit approached only in a slow process; say whether the bound is derived from statistical mechanics or imported as an extra postulate; require the books to close over any finite number of cycles, including cycles that leave a debt in an unerased memory; require consistency with entropy's being a state function, so that no choice of path through the cycle changes what is owed; and take a position on whether the accounting may mention what some agent knows, or must be phrased in purely physical terms.

  Flag any pair of desiderata you suspect cannot be jointly satisfied — I suspect one such pair is the demand that the cost always be a local event at the moment of erasure, against the demand that the accounting be path-independent and free of agent-relative quantities; and another is treating information as a storable, tradeable resource on a par with free energy, against excluding epistemic notions from the bookkeeping. Then say which single requirement rules out the largest share of otherwise plausible accounts, and why.

  Finish with a brief scorecard — a few lines each — for three views, defined stipulatively: that the cost is paid at erasure; that the cost is paid when the correlation is acquired; and that the whole phenomenon is a special case of a generalized nonequilibrium free-energy bound, with ordinary thermodynamics recovered when no information is processed. Keep the weight on the criteria, not on the scorecard.
reasoning: |-
  We are to write desiderata for an account of information in thermodynamics, with the purpose of assessing whether a proposed nanoscopic information engine can beat ordinary thermodynamic bounds. The account must be able to handle the specific cases listed and must satisfy several requirements. We are to avoid specialist literature and citations, and define views by their commitments.

  The desiderata must cover the following cases (and we are to add any other relevant cases we can think of):

  1. Demon with a single bit of memory reset every cycle.
  2. Demon with an effectively unbounded tape (no reset, record accumulates).
  3. Demon handed a tape with pre-existing correlation (no measurement performed).
  4. Noisy detector (partial information).
  5. Demon operating on a working substance spanning two temperatures vs. at equilibrium.
  6. Demon using record for refrigeration instead of work.
  7. Quantum version: memory entangled, non-disturbing measurement.
  8. Passive mechanisms (trapdoor, ratchet, etc.) — must exclude to isolate memory's role.
  9. Small device, short observation: transient entropy decreases.

  Additionally, we are to consider and state requirements for:

  - Identifying the bounded quantity and its units, and the nature of the bound (floor, identity, limit).
  - Whether the bound is derived from statistical mechanics or an extra postulate.
  - Closing the books over any finite number of cycles (including debts in unerased memory).
  - Consistency with entropy as a state function (path independence).
  - Whether the accounting can mention what an agent knows or must be in physical terms.

  We are to flag any pairs of desiderata that might conflict and identify which requirement rules out the most accounts.

  Finally, we are to provide a brief scorecard for three views:

  A. Cost paid at erasure.
  B. Cost paid when correlation is acquired.
  C. The phenomenon as a special case of a generalized nonequilibrium free-energy bound.

  Let's begin by listing the desiderata. We will group them by the aspect they address.

  ## Desiderata for an Account of Information in Thermodynamics

  ### 1. Scope: Must cover the listed cases (non-negotiable)
     - **Motivation**: The account must be general enough to handle the full range of information engines, from simple resetting demons to complex quantum and pre-correlated cases. Without covering these, we cannot assess real proposals.
     - **Cases**:
       - (a) Single-bit resetting demon: tests the minimal memory scenario and cyclic operation.
       - (b) Unbounded tape (no reset): tests the effect of accumulating records and long-term debts.
       - (c) Pre-correlated tape: tests whether the cost is in measurement or in erasure, and whether pre-existing correlations can be exploited without cost.
       - (d) Noisy detector: tests how partial information affects the work output and costs.
       - (e) Two-temperature vs. equilibrium working substance: tests whether the information engine can operate beyond the Carnot bound in a non-equilibrium setting.
       - (f) Refrigeration: tests whether the information resource can be used for cooling and how that is accounted.
       - (g) Quantum non-disturbing measurement: tests the quantum extension and the role of entanglement.
       - (h) Passive mechanisms: tests that the account does not credit passive devices (which do not use memory) as information engines, isolating the role of active control via memory.
       - (i) Transient decreases: tests that the account is valid even for small systems and short times, where fluctuations are significant.

  ### 2. The Bounded Quantity (non-negotiable)
     - **Requirement**: The account must identify a physical quantity that is bounded and state the bound. The quantity must have units of energy (or equivalent, such as entropy times temperature) and the bound must be a floor on dissipation (i.e., the minimum entropy production or minimum work that must be dissipated as heat). The bound may be an identity (equality) in some cases and an inequality in others, but it must reduce to the known thermodynamic bounds (like Carnot) when no information is used. The bound must be derived from statistical mechanics (not an extra postulate) to maintain consistency with the foundations.

     - **Motivation**: Without a clear bounded quantity, we cannot tell if the engine beats the ordinary bounds. The bound must be fundamental and not ad hoc.

  ### 3. Origin of the Bound (preference, but strongly desired)
     - **Requirement**: The bound must be derived from the principles of statistical mechanics (e.g., from the fluctuation theorems or the second law expressed in microscopic terms) without introducing new postulates about information. This ensures the account is grounded in established physics.

     - **Motivation**: If the bound is an extra postulate, it may not be consistent with the underlying physics and may not hold in all cases.

  ### 4. Bookkeeping over Finite Cycles (non-negotiable)
     - **Requirement**: The accounting must close over any finite number of cycles. This includes cycles that leave a debt (e.g., an unerased memory). The account must specify what is owed and when it must be paid. The total entropy change (system plus environment) over any finite number of cycles must be non-negative, but the account must also track the state of the memory and any deferred costs.

     - **Motivation**: In the unbounded tape case, the demon may never reset some bits, so the accounting must track the accumulating debt. Without this, we could not assess the true cost of operating the engine.

  ### 5. Path Independence (non-negotiable)
     - **Requirement**: The accounting must be consistent with entropy being a state function. That is, the net work and heat over a cycle must depend only on the initial and final states of the system and memory, not on the path. This implies that the cost of using information cannot depend on when the measurement or erasure occurs during the cycle, only on the state change.

     - **Motivation**: Thermodynamics requires entropy to be a state function. If the accounting is path-dependent, it would allow for inconsistencies.

  ### 6. Physical vs. Epistemic (non-negotiable for some, but we'll state as a requirement and mark the conflict)
     - **Requirement**: The accounting must be phrased in purely physical terms (e.g., correlations, mutual information) without reference to what an agent knows or intends. However, we note that some accounts use epistemic notions (like the demon's knowledge) and we must flag if this is a point of conflict.

     - **Motivation**: Physics should not depend on an agent's knowledge. But in some views, the cost is tied to the agent's state of knowledge. This leads to a conflict with the requirement of physicality.

  ### Additional Cases (added by me)
     - **Case (j)**: A demon that uses a memory that is not reset but reused in a way that the existing information is overwritten without erasure (e.g., a cyclic memory buffer). This tests whether overwriting without explicit erasure incurs a cost.
     - **Case (k)**: A demon that performs a measurement but then does not use the information for any work extraction. This tests whether the measurement itself has a cost.

  ### Flagging Conflicts

  We suspect two pairs of desiderata may conflict:

  - **Conflict 1**: 
     - Desideratum 4 (bookkeeping over finite cycles, including debts) and 
     - Desideratum 6 (accounting in physical terms without agent-relative quantities) vs. 
     - The idea that the cost is always a local event at the moment of erasure.

     Why? If the cost is only at erasure, then in the case of an accumulating tape (never erased) the debt is never paid and the books don't close. But if we require the books to close (including debts as liabilities), then we must account for the cost even if it is deferred. However, if we insist on physical terms, then the debt must be represented by a physical state (like the growing tape) without invoking an agent's obligation. This might be possible, but it challenges the idea that the cost is only at erasure.

  - **Conflict 2**:
     - Desideratum 6 (physical terms) vs. 
     - The treatment of information as a storable, tradeable resource (like free energy).

     Why? If information is a resource that can be stored and traded, then we must have a physical representation of that resource (e.g., the tape's state). But if we also require that the accounting avoid any epistemic notions (like "knowledge"), then we must define the resource without reference to meaning or agency. This is possible (e.g., via mutual information) but difficult because mutual information is a statistical property and not a local physical quantity.

  ### Which requirement rules out the most accounts?

  The requirement that the accounting must be in purely physical terms (Desideratum 6) rules out the largest share of otherwise plausible accounts. Many accounts (especially in the earlier literature) rely on the demon's knowledge or on epistemic concepts. If we insist on a purely physical account (with no reference to knowledge, beliefs, or agency), then we must use concepts like mutual information and correlations, which are statistical and not always easy to assign to a specific physical system. Moreover, in quantum mechanics, the physical representation of information becomes even trickier due to entanglement.

  ## Scorecard for Three Views

  We define three views stipulatively:

  - **View A (Cost at Erasure)**: The cost of using information is paid when the memory is erased (reset to a standard state). The work to erase the memory (dissipated as heat) is the cost. During measurement and work extraction, no cost is incurred.

  - **View B (Cost at Acquisition)**: The cost is paid when the correlation (information) is acquired. The work dissipated during measurement is the cost, and erasure may be free if the memory is already uncorrelated.

  - **View C (Generalized Free Energy)**: The phenomenon is a special case of a generalized nonequilibrium free energy (e.g., including an information term). The bound is a generalized second law that includes a term for the change in mutual information between the system and memory. Ordinary thermodynamics is recovered when the mutual information is zero.

  ### Scorecard

  1. **View A (Cost at Erasure)**:
     - *Bounded quantity*: The minimum work to erase a bit is kT ln 2 per bit (Landauer's principle). This is a floor on dissipation at erasure.
     - *Derived or postulated*: Originally postulated, but can be derived from statistical mechanics for specific models.
     - *Bookkeeping*: Fails for the unbounded tape case because the debt is never paid. Also fails for the pre-correlated tape: if the tape is given, no erasure is done in the cycle, so no cost is incurred, but work is extracted. This leads to apparent violation of the second law (unless the pre-correlated tape is considered a resource that was prepared at a cost, but then the cost is not in the current cycle).
     - *Path independence*: The cost is at erasure, which is a specific step. The net work over a cycle depends on when erasure occurs? Actually, if the memory state is part of the state, then the erasure changes the state. So if we include the memory, the state is different after erasure. But then the pre-correlated tape case would require that the initial state of the tape is accounted for, and if that state was prepared by an external agent, the cost might be external. This breaks the self-contained cycle.
     - *Physical terms*: The erasure work is physical, but the value of the information (when it is used) is not explicitly accounted. It avoids epistemic terms by focusing on the physical act of erasure.
     - *Cases*: 
       - Handles the single-bit resetting demon: cost per cycle is kT ln 2.
       - Fails the unbounded tape: no cost for accumulating bits.
       - Pre-correlated tape: no erasure, so no cost, but work is extracted -> problem.
       - Passive mechanisms: correctly excludes because they don't have memory to erase? But note: a passive mechanism might have a memory-like state? We must be careful. The account excludes passive mechanisms because they do not have a memory that is erased. But then, how do we explain that they don't work? They don't use information, so they are bounded by ordinary thermodynamics. But the account must not credit them with an information advantage. This is okay.

  2. **View B (Cost at Acquisition)**:
     - *Bounded quantity*: The minimum work to acquire a bit of information is kT ln 2 per bit (or more for partial information). This is a floor on dissipation at measurement.
     - *Derived or postulated*: Postulated, and harder to derive because measurement can be done in a way that doesn't require work (e.g., in a non-disturbing quantum measurement).
     - *Bookkeeping*: Handles the pre-correlated tape: if the tape is handed, no acquisition cost in the cycle. But then work extraction without cost? Again, problem. Also, for the unbounded tape, the cost is paid when each measurement is done, so the debt is paid as incurred -> books close.
     - *Path independence*: The cost is at acquisition. The net work depends on the state change of the memory (from uncorrelated to correlated). So if we include the memory, the initial and final states matter. But then in the pre-correlated tape, the initial state is already correlated, so no change? Then no cost. But then we extract work without paying -> violation.
     - *Physical terms*: Avoids epistemic terms? The cost is in the physical process of measurement, which might involve a physical change in the detector. But the value of the information is not accounted. 
     - *Cases*:
       - Single-bit resetting: cost at measurement, and then the bit is reset? But resetting might not cost if we don't erase? This view typically does not assign a cost to erasure. So if we reset by overwriting without erasure (or by using a physical process that doesn't dissipate) then the cycle might seem to have only the acquisition cost. But then, can we reuse the same memory? The next measurement would then require overwriting the old information, which might be seen as erasure? This view doesn't assign cost to erasure, so it would not account for that. This leads to inconsistency.

  3. **View C (Generalized Free Energy)**:
     - *Bounded quantity*: The generalized second law might take the form: average work extracted ≤ ΔF + kT ΔI, where ΔF is the change in nonequilibrium free energy of the system and ΔI is the change in mutual information between the system and memory. The bound is a floor on dissipation and is an identity in some idealizations. The units are energy.
     - *Derived or postulated*: Can be derived from fluctuation theorems and statistical mechanics without extra postulates.
     - *Bookkeeping*: The mutual information accounts for the correlation between the system and memory. In the unbounded tape, the mutual information is stored and the debt is recorded as a physical correlation. In the pre-correlated tape, the initial mutual information is used and then reduced (so ΔI is negative, which reduces the work that can be extracted). Books close because the mutual information is a state function (of the joint state of system and memory).
     - *Path independence*: Satisfied because the mutual information is a function of the joint state at the beginning and end of the cycle. The net work depends only on the state change.
     - *Physical terms*: Mutual information is a statistical property of the physical state, not an epistemic notion. However, some argue that mutual information still has an epistemic flavor because it is relative to an observer who chooses how to coarse-grain. But in this view, it is defined by the actual physical state (the joint probability distribution) and so is objective.
     - *Cases*:
       - Single-bit resetting: The mutual information is built during measurement (ΔI > 0) and then destroyed during erasure (ΔI < 0). The net ΔI over the cycle is zero (if the memory is reset to a standard state uncorrelated with the system). The work extracted is then bounded by ΔF (the ordinary bound). But during the cycle, the engine might beat the ordinary bound in the work extraction phase because of the information, but then pay back during erasure. The net is within the ordinary bound.
       - Unbounded tape: Mutual information accumulates, so ΔI over a cycle is positive (if we don't erase). Then the work extracted can exceed the ordinary bound by kT ΔI. But the debt is stored as mutual information. If the tape is never erased, the debt is never paid, but it is recorded in the physical state. The books close because the mutual information is a physical property.
       - Pre-correlated tape: Initially, the tape has mutual information I_initial. After the cycle, the mutual information might be reduced (if the demon uses the information to extract work) to I_final. Then ΔI = I_final - I_initial < 0. The bound then becomes: work extracted ≤ ΔF + kT ΔI. Since ΔI is negative, the work extracted is less than or equal to ΔF minus a positive amount. So the pre-correlated tape is a resource that allows more work than without, but the reduction of mutual information must be accounted. This is consistent.
       - Passive mechanisms: They do not create or use mutual information (ΔI=0), so they are bounded by the ordinary second law.
       - Quantum: Mutual information can be defined for quantum states and includes entanglement. The bound holds in quantum regimes as well.

  **Summary of Scorecard**:
  - View A fails the pre-correlated tape and unbounded tape cases.
  - View B fails the pre-correlated tape and may have issues with erasure/overwriting.
  - View C satisfies all cases and requirements.

  However, note that View C requires a generalized free energy that includes mutual information. This mutual information must be defined for the entire system and memory, and it must be a state function. Also, in the case of a small system observed briefly, the bound holds on average (due to fluctuation theorems) but individual realizations may violate it. The account must then be statistical.

  ## Conclusion

  The desiderata we have listed, especially the requirement for physicality and bookkeeping over finite cycles, rule out Views A and B and point to View C as the most promising. However, View C may be complex to apply in practice because it requires tracking the mutual information throughout the cycle. But it is the only one that satisfies all the cases and requirements.

  Final note: The requirement that the accounting be in physical terms (Desideratum 6) and the requirement that the books close (Desideratum 4) are non-negotiable and jointly push us toward View C. The conflict between "cost at erasure" and "bookkeeping" is resolved by View C because the cost is not localized to erasure but is distributed according to the change in mutual information.
answer: |-
  ### Desiderata for an Account of Information in Thermodynamics  
  To assess whether a nanoscopic information engine can surpass ordinary thermodynamic bounds, an account must satisfy the following desiderata. Each is motivated by specific cases and classified as non-negotiable (NN) or a camp preference (CP). Cases not listed initially are integrated.  

  #### **1. Scope: Cover All Engine Archetypes (NN)**  
     - **Motivation**: Must handle all proposed devices, including edge cases. Failure in any archetype invalidates the account.  
     - **Cases**:  
       - **Single-bit resetting demon**: Tests minimal memory and cyclic operation.  
       - **Unbounded tape (no reset)**: Tests accumulating records/deferred costs.  
       - **Pre-correlated tape**: Tests whether correlation alone enables work without measurement cost.  
       - **Noisy detector**: Tests cost of partial information.  
       - **Two-temperature vs. equilibrium substance**: Tests if information beats Carnot in non-equilibrium settings.  
       - **Refrigeration use**: Tests if information resource converts to cooling.  
       - **Quantum non-disturbing measurement**: Tests entanglement and quantum coherence.  
       - **Passive mechanisms (e.g., trapdoor)**: Must exclude to isolate memory’s role.  
       - **Transient entropy decreases**: Tests small/fast systems with fluctuations.  
       - **Added case: Memory overwritten without erasure**: Tests if overwriting incurs erasure-like costs.  
       - **Added case: Measurement without work extraction**: Tests if information acquisition alone has inherent cost.  

  #### **2. Bounded Quantity Specification (NN)**  
     - **Requirement**: Identify a bounded physical quantity (units: energy or \(k_B T \times\) entropy), and state whether the bound is:  
       - A **floor on dissipation** (minimum entropy production),  
       - An **identity** (exact equality in idealized cases), or  
       - A **limit** (approached quasi-statically).  
     - **Motivation**: Without a clear bound, claims of beating thermodynamics are ambiguous (e.g., single-bit demon).  
     - **Derivation**: Must be derived from statistical mechanics (NN), not an extra postulate. Carnot must emerge when information terms vanish.  

  #### **3. Bookkeeping Over Finite Cycles (NN)**  
     - **Requirement**: Accounts must close for any finite number of cycles. Debts (e.g., unerased memory) must be tracked as liabilities. Net entropy change (system + environment) must be non-negative, but deferred costs are permitted.  
     - **Motivation**: Unbounded tape demons accumulate debt; ignoring it hides violations (e.g., Szilard engine with infinite tape).  

  #### **4. Path Independence (NN)**  
     - **Requirement**: Accounting must depend only on initial/final states of system and memory, not the path. Entropy as a state function must be respected.  
     - **Motivation**: Prevents "creative accounting" where costs vanish via path choice (e.g., resetting memory mid-cycle).  

  #### **5. Physicalism (CP for some, NN for purpose)**  
     - **Requirement**: Accounting must use **purely physical terms** (e.g., correlations, mutual information), not epistemic notions (e.g., "knowledge" or "agent’s belief").  
     - **Motivation**: Physics must not rely on subjective states (e.g., pre-correlated tape or quantum entanglement).  

  #### **6. Cost Localization (CP for erasure-focused views)**  
     - **Requirement**: Costs may be localized (e.g., at erasure) provided path independence is maintained.  
     - **Motivation**: Single-bit demons appear to pay at erasure; noisy detectors may have distributed costs.  
     - **Classification**: CP (preferred by erasure-cost camp).  

  #### **7. Information as a Resource (CP for free-energy views)**  
     - **Requirement**: Information is a storable/tradeable physical resource, quantified independently of use.  
     - **Motivation**: Unbounded tape and pre-correlation cases treat information as capital.  
     - **Classification**: CP (preferred by generalized free-energy camp).  

  ---

  ### Flagged Conflicts  
  1. **Physicalism vs. Cost Localization (NN vs. CP)**:  
     - **Conflict**: Physicalism demands objective, agent-free accounting (e.g., mutual information). Cost localization (e.g., "erasure dissipates \(k_B T \ln 2\)") is path-dependent and agent-relativized (e.g., "when the demon resets").  
     - **Example**: Pre-correlated tape has no erasure event; localization implies no cost, but work extraction violates bounds without physical debt tracking.  

  2. **Information as Resource vs. Physicalism (CP vs. NN)**:  
     - **Conflict**: Treating information as a resource (like free energy) risks epistemic baggage (e.g., "stored knowledge"). Physicalism forbids this, demanding non-epistemic measures (e.g., correlation entropy).  
     - **Example**: Quantum entanglement is a physical correlation but resists "storage" in classical resource terms.  

  3. **Bookkeeping vs. Cost Localization (NN vs. CP)**:  
     - **Conflict**: Bookkeeping requires tracking debts (e.g., unerased memory), but localization insists costs are paid at specific events (e.g., erasure). Unbounded tape never pays, so debts accrue indefinitely.  
     - **Example**: An infinite-tape demon extracts unbounded work with no dissipation, violating the second law.  

  **Most Exclusionary Requirement**: **Physicalism (NN)**.  
  - **Why**: Many accounts (e.g., "demon’s knowledge costs at erasure") rely on epistemic language or agent-centric events. Physicalism forces a non-subjective, correlation-based framework, disqualifying approaches that cannot reduce "information" to physical states.  

  ---

  ### Scorecard for Three Views  
  *Views defined by core commitments:*  
  - **View A (Cost at Erasure)**:  
    - *Commitments*: Cost paid only during memory erasure/reset. Measurement and work extraction are free.  
    - **Score**: Fails **bookkeeping** (unbounded tape debts ignored), **pre-correlated tape** (no erasure, so free work), and **path independence** (cost depends on erasure timing). Passes **single-bit resetting** and **physicalism** (erasure is physical).  

  - **View B (Cost at Acquisition)**:  
    - *Commitments*: Cost paid during measurement/correlation acquisition. Erasure is free.  
    - **Score**: Fails **pre-correlated tape** (no acquisition cost, free work), **quantum non-disturbing measurement** (acquisition can be work-free), and **bookkeeping** (unbounded tape acquisition costs accumulate but are never "paid"). Passes **noisy detector** (partial info has partial cost).  

  - **View C (Generalized Free-Energy Bound)**:  
    - *Commitments*: Information engines obey a generalized second law: \(\langle W \rangle \leq -\Delta F + k_B T \, \Delta I\), where \(\Delta I\) is mutual information change. Ordinary thermodynamics recovers when \(\Delta I = 0\).  
    - **Score**: Passes all **cases** (e.g., unbounded tape: \(\Delta I > 0\) permits extra work; pre-correlated tape: \(\Delta I < 0\) reduces work; quantum: \(\Delta I\) includes entanglement). Passes **physicalism** (\(\Delta I\) is physical), **bookkeeping** (debt is \(\Delta I\)), and **derivation** (from fluctuation theorems). Fails **cost localization** (costs distributed).  

  ---

  ### Summary  
  A viable account must:  
  - Derive a **physical bound** (e.g., generalized free energy) from statistical mechanics.  
  - **Close books** over finite cycles, tracking debts as physical states (e.g., mutual information).  
  - Reject **epistemic language** and enforce **path independence**.  
  View C satisfies all NN desiderata but conflicts with cost localization (a CP). View A and B fail core cases due to localized cost assumptions and epistemic gaps. Physicalism is the steepest barrier, excluding agent-dependent accounts.
