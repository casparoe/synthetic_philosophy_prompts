  ## Part 4: Residue Report

  ### Bucket 1: Translated with no loss
  - **Ex-ante commitment to a strategy**: UDT's requirement to choose a strategy at the ex-ante stage and stick to it is exactly like the principal in mechanism design committing to a mechanism. The strategy in UDT is the mechanism for the agent's future selves.
  - **Evaluation over the prior**: The ex-ante expected utility calculation is standard in mechanism design (for the principal).
