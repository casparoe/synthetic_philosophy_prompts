  ### Case 3: Counterfactual Mugging
  - **Setup**: Omega flips a coin. If it lands heads, it asks you for $100. If tails, it gives you $10,000. But only if you would have paid if it had been heads. You see the coin: it is tails. What should you do? (But note: the decision is only asked when it is heads? Actually, the standard setup: if the coin is tails, Omega appears and asks if you would have paid had it been heads. You are asked to pay $100 in the heads scenario, and in the tails scenario you are asked to make a commitment about what you would have done in the counterfactual heads scenario. But UDT typically considers the strategy ex ante.)
  - **UDT view**: The agent chooses a strategy that maps the coin flip (the type) to an action (pay or not pay). The prior is 50-50. The utility: if heads and you pay, you lose $100. If tails and you pay (in the counterfactual sense) then you get $10,000. But note: the $10,000 in tails is conditional on your strategy: if the strategy says that in heads you pay, then in tails you get $10,000. So the ex-ante expected utility of the strategy "pay in heads" is: (0.5 * -100) + (0.5 * 10000) = 4950. The strategy "don't pay in heads" yields: 0 + 0 = 0. Therefore, UDT chooses to commit to paying in the heads scenario.

  ### Case 4: Hitchhiker
  - **Setup**: You are hitchhiking. A driver can take you to town (where you can get $100) or leave you in the desert (where you die, worth -$1000). You cannot pay the driver unless you get to town. So you promise to pay $50 upon arrival. But once in town, you might renege. The driver knows this and will only pick you up if they believe you will pay. The driver can condition their belief on your entire strategy (like the Predictor). Your type: you are at the promise stage (desert) or the payment stage (town).
  - **UDT view**: The agent chooses a strategy that maps the stage (desert or town) to an action. At the desert: you make a promise (which is just part of the setup, not an action to choose) but the driver decides whether to take you based on your strategy for the town stage. At the town: you can pay or not. The driver picks you up only if your strategy says you pay at town. If you are not picked up, you die. The prior: the driver's decision is based on your strategy. The ex-ante expected utility of the strategy "pay at town" is: you get picked up, then pay $50, so net $50. The strategy "do not pay at town" is: you don't get picked up, so you die (utility -$1000). Therefore, UDT commits to paying at town.

  ## Part 3: The Case You Care About

