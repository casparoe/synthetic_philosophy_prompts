  ### Bucket 2: Translated after alteration
  - **The agent as the entire function**: In mechanism design, the agent is typically modeled as a player with a specific type. But in UDT, the agent is the entire strategy function. This required extending the notion of the agent to include the entire algorithm. We had to move in mechanism design: we introduced the idea that the principal (the ex-ante self) designs a mechanism (the strategy) for the future agents (the interim selves) and commits to it. This is not standard for a single agent, but it is analogous to dynamic mechanism design with commitment.
