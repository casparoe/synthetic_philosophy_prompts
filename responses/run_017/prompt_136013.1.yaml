prompt: |-
  Hi — I'm a science-and-ideas journalist, and I'm closing in on a piece about the strange afterlife of Popper's views on evolution, and I have two sources who cannot talk to each other. Setup: there was a Darwin Day panel a few weeks back; one speaker, a philosopher of biology, said the whole is-Darwinism-scientific panic is a museum piece, and the other, an unreconstructed Popperian, said the core of the theory still isn't testable and works as a metaphysical research programme — valuable because it spins off testable auxiliary hypotheses, but not itself falsifiable, partly becuase the central claim keeps collapsing into the survivors survive. They went at it for another hour at dinner and never once said what would change their minds. Her stock examples are population-genetic model fitting, comparative work across related lineages, and long-running evolution experiments where you restart replicate populations from frozen ancestral stock and ask whether the same fixes turn up again; his reply is that all of that tests the auxiliaries rather than the framework, and that a field which can always reach for a historical-contingency clause isn't really taking a risk.

  What I need is the joint statement the two of them should have produced. Give me, first, a numbered section of claims both could genuinely sign — what the models say, what work "fitness" does inside them, which versions of the tautology charge are cheap and which have teeth, and what either side in this dispute should be entitled to demand of a test — and then a table of disagreements, one row per crux, with columns for the claim at issue, the Popperian's version of it in wording he'd accept, the philosopher of biology's version in wording she'd accept, the sub-question such that settling it would move at least one of them, the one case or argument both agree would bear on it, and each side's prediction about what it will show. Don't manufacture disagreement to fill rows: if part of it is only a fight about words — "testable", say, or whether "Darwinism" names a mechanism or an entire research programme — mark that row as verbal and say why. And no citations or reading lists; I'll check anything I end up using with the two of them directly.

  To force the issue, here's the gadget I've been springing on interviewees, which I'm calling the fitness meter: suppose you could read off an organism's expected reproductive success in a given environment directly and instantaneously, no waiting around to count grandchildren, so fitness becomes an observed quantity instead of a bookkeeping identity over who actually left offspring. I want both camps on record about what changes if the meter exists. Does the tautology worry die, or does it just relocate one level up? Which of the experiments she's proud of get sharper, and which would definately become pointless? Does he now concede a falsifiable core, and if not, what exactly is still missing? Give each of them a prediction about the meter, in the table or right after it. Keep the jargon light — this is for a general reader — but don't soften the claims into mush. Whole thing under 850 words, table included. Then one last line, addressed to me and not part of the document: how confident you are that both of them would actually sign it, and which single line one of them would balk at.
