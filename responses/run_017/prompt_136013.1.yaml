  For the predictions about the fitness meter: the biologist would expect it to validate current experiments (like parallel evolution studies) while making some lab work redundant. The Popperian would predict it shows selection is constrained by history/chance, thus confirming why the theory can't be falsified as a whole.

  The journalist wants me to assess how signable this document would be. I think both would agree to most of it, but the Popperian would likely balk at the line claiming experiments like parallel evolution test natural selection's "creative power" - he sees this as testing mechanisms within an unfalsifiable framework. The biologist would object to calling selection a "metaphysical" framework.

