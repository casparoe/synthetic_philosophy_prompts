  Key historical cases to consider:
  - Printing press (knowledge diffusion but uneven economic effects)
  - Industrial Revolution (productivity paradox issues)
  - Nuclear weapons (existential risk but different adoption dynamics)
  - Containerization (institutional lag as binding constraint)

  Non-negotiable criteria should include:
  1. Separation of causal and consequential dimensions (based on how Industrial Revolution discussions conflate invention with social impact)
  2. Falsifiability markers (learning from how nuclear analogies become unfalsifiable)
  3. Near-miss requirement (inspired by productivity paradox cases where similar tech inputs didn't yield transformation)
  4. Interest transparency (addressing how all major analogies carry baggage)

  Tensions I foresee:
  - Vividness vs structural fidelity (nuclear weapons are vivid but domain-distant)
  - Near-miss availability vs clarity (many historical cases are overdetermined)
  - Institutional focus may undervalue discontinuous change

