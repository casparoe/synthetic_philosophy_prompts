prompt: |-
  I'm giving a paper next month at a workshop on responsible engineering, and I want the Q&A to go well, not just the talk. My thesis is that an artifact's politics lies neither in its designer's intentions nor in the social relations the artifact is said to require, but in the asymmetry of *exit costs*: the gap between what it costs a person to go along with the artifact's default behavior and what it costs them to route around it, together with who bears which of those costs. On this account something is political to the degree that its default is cheap to accept and expensive to refuse, and it stops being political when the two costs are evened up — which makes politics a design variable rather than a fate. My corollary, and the part I expect to fight over, is that the remedy is symmetry of exit costs, not the procedural remedies this literature usually reaches for: stakeholder consultation, participatory design, ethics review boards.

  The room will be roughly forty people, and I'd rather be prepared for *this* audience than for the one I'd get in a philosophy department. Most of them are mechanical and software engineering faculty who teach the required engineering-ethics module and who mostly understand ethics as professional codes, case studies about whistleblowing, and the conviction that tools are neutral and that politics enters only at the stage of regulation and use; they will hear my cost talk as an attempt to make them legally responsible for user laziness. Three or four are STS people, at least one a social constructivist who thinks Langdon Winner's 1980 paper settled the matter and that an artifact's politics is a property of the network that stabilizes it rather than of any feature anyone designed — and who may also point out that the empirical case behind the famous low-overpasses example has been disputed. Two are philosophers of technology in the pragmatist line who will want to know why I am not simply re-describing instrumentalization theory in the vocabulary of costs.

  Draft my prep sheet: the seven or eight objections I'll actually get, ordered by how much damage they'd do, each phrased in the idiom of the group it comes from, with a ninety-second reply and one sentence marking where that reply is soft. Tell me which objection I should concede before anyone raises it, and which single reply the paper's survival depends on. Include the question I'm hoping nobody asks, and flag any reply that is true but that I should swallow anyway because it would lose this room. Close with two or three lines on what would genuinely make me abandon the asymmetry account — the argument or finding that would show exit-cost symmetry is either unengineerable or not the thing that does the normative work I'm claiming it does.
reasoning: |-
  Okay, let me unpack this request. The user is preparing for a critical Q&A session after presenting a provocative thesis about exit costs as the core of artifact politics. They've provided rich context about their audience composition and intellectual landmines. 

  First, I need to recognize the stakes: this isn't just about answering questions, but about persuading skeptical engineers that politics is designable, not inevitable. The audience's professional identities matter deeply - mechanical engineers will fear liability, STS scholars will challenge network theories, philosophers will see reinventions of wheels. 

  The core tension I notice is between the user's radical claim (exit symmetry as primary remedy) and the room's likely adherence to traditional procedural ethics. Their fear about being misunderstood as blaming "user laziness" reveals how easily the cost asymmetry argument could backfire with engineers. 

  For the prep sheet structure, I'm considering clustering objections by disciplinary perspective: start with engineers' liability concerns (most damaging if unaddressed), then STS network critiques, then philosophical redundancies. The "concede early" point should probably be about Winner's disputed overpasses - it disarms STS critics without harming the core thesis. 

  The survival-critical reply must be the one demonstrating how cost asymmetry isn't about user laziness but about designed affordances. If engineers walk away thinking "he wants us to be liable for lazy users," the talk fails. The phrasing about "sunk costs in behavioral pathways" might resonate with their systems thinking. 

  Hmm... the question I hope nobody asks is clever - about whether exit symmetry could worsen inequality. That's the deepest theoretical hole, where their framework might actually replicate the problem it solves. The suggested reply feels weak though; maybe we should explicitly add that this requires coupling with redistributive policies. 

  For abandonment criteria, they need something falsifiable. The unengineerability clause is good, but I wonder if adding "when exit cost symmetry stabilizes oppression" would strengthen it - admitting that sometimes procedural remedies might still be necessary. 

  Throughout, I'm watching for landmines: don't let engineers hear "blame designers," don't let STS think we ignore networks, don't let philosophers dismiss this as repackaged theory. The concessions must be strategic - like acknowledging Winner's importance while noting new evidence.
answer: |-
  Here’s your battle-tested Q&A prep sheet, tailored to your audience and thesis. Prioritized by damage potential, with disciplined replies:

  ---

  ### **Prep Sheet: Q&A Defense for Exit-Cost Asymmetry Thesis**  
  *(Ordered by Threat Level)*  

  1. **Objection (Engineering Faculty):**  
     *"This sounds like you’re blaming engineers for users’ unwillingness to adapt. We design tools; it’s society’s job to regulate them. Are you suggesting we’re liable for laziness?"*  
     **Reply (85 sec):** "Not at all. I’m arguing that *design choices create asymmetric effort landscapes*. When an app makes privacy opt-out 10x harder than opt-in, that’s not user laziness—it’s a *sunk cost* engineered into the interaction. Neutrality isn’t passive; it’s achieved by balancing exit costs. Your expertise lets you build that symmetry where others can’t."  
     **Soft Spot:** Doesn’t fully address "liability" fears—hint at design freedom, not legal exposure.  

  2. **Objection (STS / Social Constructivist):**  
     *"Winner’s overpasses were debunked! Politics emerges from socio-technical networks, not designer intent OR artifact features. Your ‘cost asymmetry’ ignores how artifacts are reappropriated."*  
     **Reply (80 sec):** "Winner’s empirical case may be contested, but his insight—that artifacts *can* embody power—stands. My model agrees politics isn’t about intent, but focuses on *material friction*, not networks. A door with a heavy push-bar creates different social possibilities than a locked turnstile—regardless of intent or network stabilization. Exit costs measure that friction."  
     **Soft Spot:** Networks *do* shape costs; this reply sidesteps reappropriation.  

  3. **Objection (Philosopher of Tech / Pragmatist):**  
     *"Isn’t this just instrumentalization theory (Feenberg) in econ-speak? You’ve swapped ‘technical codes’ for ‘cost asymmetry’ but kept the same binary."*  
     **Reply (75 sec):** "Instrumentalization separates technical functions from social values. I’m rejecting that split: exit costs *are* the site where technical and social converge. Feenberg asks *who controls the code*; I ask *what does disobedience cost?* This isn’t translation—it’s a metric for democratizing access, not just process."  
     **Soft Spot:** Risks underselling Feenberg’s "secondary instrumentalization" overlap.  

  4. **Objection (Engineering Faculty):**  
     *"Symmetry sounds idealistic. If we make ‘exit’ easy, users will break systems. Defaults exist for safety/efficiency—you’re trading reliability for politics."*  
     **Reply (90 sec):** "Defaults aren’t the enemy—*coercive* defaults are. A car seatbelt alarm is a high-exit-cost default that saves lives. But when Adobe hides cancellation behind 7 menus, that’s rent-seeking disguised as design. Symmetry doesn’t mean removing defaults—it means making alternatives *viable*. Good engineering already does this for fail-safes; extend it to social needs."  
     **Soft Spot:** Doesn’t quantify "viable" tradeoffs for safety-critical systems.  

  5. **Objection (STS / Constructivist):**  
     *"Cost asymmetry is endogenous! It’s produced by the very networks you ignore. You can’t ‘engineer’ symmetry without engaging collective negotiation."*  
     **Reply (80 sec):** "Networks *amplify* asymmetry, but they originate in material affordances. Twitter’s ‘quote-tweet’ vs. ‘retweet’ buttons aren’t network-determined—they’re design choices that shape discourse. Yes, networks stabilize costs, but designers can preemptively reduce friction at the source."  
     **Soft Spot:** Overstates designer agency in entrenched systems.  

  6. **Objection (Philosopher / Engineer):**  
     *"Why is cost-symmetry morally superior? High exit costs can protect vulnerable groups (e.g., irreversible delete confirmations)."*  
     **Reply (75 sec):** "Symmetry doesn’t mean *low* costs—it means *proportional* costs. A 2-second undo vs. a 2-week account recovery isn’t symmetrical. The moral imperative is distributing burden fairly: if accepting a default costs users $X in effort/time, refusing shouldn’t cost $100X. Protect the vulnerable by *aligning* costs with stakes, not removing safeguards."  
     **Soft Spot:** "Proportional" is underspecified—opens door to "who decides?"  

  7. **Objection (Engineering Faculty):**  
     *"Ethics boards and stakeholder panels exist to handle this. Why reinvent the wheel?"*  
     **Reply (70 sec):** "Because procedures often bake in asymmetry! A 300-page EULA ‘consulted’ via ‘I Agree’ is stakeholder theater. My metric forces us to ask: *Can the user meaningfully dissent?* If your review board doesn’t measure exit costs, it’s polishing handcuffs."  
     **Soft Spot:** Dismisses cases where panels *do* constrain bad defaults.  

  ---

  ### **Strategic Concessions**  
  - **Preemptively concede:** *"I agree Winner’s overpass example is empirically shaky—but the *logic* of how artifacts encode power remains useful. My model offers a testable alternative."*  
    *(Disarms STS critics early without surrendering the core.)*  

  - **Reply your survival depends on:** **#1 (Engineer’s "laziness" objection).**  
    If they leave thinking you blame them, you lose. Hammer: *"This isn’t about users—it’s about the effort differential you *build*. You already engineer physical safety margins; this is the ethical equivalent."*  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Doesn’t exit-cost symmetry favor privileged users? The wealthy can afford ‘costs’ (time/money) the poor can’t. Isn’t this just libertarianism with extra steps?"*  
  **Why it hurts:** Implies your framework entrenches inequality.  
  **Reply (if forced):** "No—asymmetry *disproportionally* harms the marginalized. A $5 opt-out fee hurts low-income users more. Symmetry forces designers to internalize *all* users’ costs, not assume equal capacity to absorb them."  
  **Swallow This Truth:** *"Your model needs redistributive policies to work."* (Don’t say it—engineers hear "not my job".)  

  ---

  ### **Abandonment Criteria**  
  I’d drop the asymmetry account if:  
  1. **Evidence shows cost symmetry *increases* net harm** (e.g., making "exit" easy for hate speech amplifies abuse without improving recourse).  
  2. **A fundamental asymmetry is proven unengineerable** (e.g., quantum-level constraints force irreversible defaults).  
  3. **Exit costs correlate *zero* with felt oppression**—but ethnography suggests otherwise (e.g., disability studies on "knob fatigue").  

  ---  
  **Final Tip:** Open replies with "As an engineer, I..." when addressing faculty—build kinship. Your thesis is bold; wear the pushback as proof it’s hitting nerves. Break legs.
