answer: |-
  **INTERNAL MEMO: FLW-COM-23-045**  
  **FROM: Communications Desk, National Flood Warning Service**  
  **TO: All Regional Forecasting Units, Public Advisory Teams, On-Call Operatives**  
  **SUBJECT: Implementation of Directive SCNPS-7: Standardisation of Predictive Statements**  
  **DATE: 22 October 2023**

  1.  Effective immediately (00:01 UTC, 23 October 2023), all public advisories, internal situation reports, and verbal briefings issued by this Service must comply with Directive SCNPS-7 issued by the Standing Committee on Non-Propositional Statements (SCNPS).
  2.  Directive SCNPS-7 prohibits the issuance of indicative conditional statements concerning flood risk. Examples of non-compliant phrasing include, but are not limited to:
      *   "If the River X exceeds Y metres at gauge Z, flooding is expected in Area A."
      *   "In the event of pump failure at Station B, properties on Street C will likely be affected."
      *   "Should overtopping occur at Defence D, the Lower Ward would flood."
      *   "Flooding is possible if rainfall exceeds 50mm in 6 hours over the Upper Valley catchment."
  3.  Directive SCNPS-7 mandates replacement of indicative conditionals with statements of conditional credence. The approved format is:
      `P(Consequent | Antecedent) = [Value between 0.0 and 1.0]`
      Where:
      *   `P` denotes probability.
      *   `Consequent` is a defined outcome from the Official Consequent Register (OCR-Flood v4.1, accessible via Intranet Portal `FLW-REG`).
      *   `|` denotes "given".
      *   `Antecedent` is a defined condition drawn exclusively from the Official Antecedent Register (OAR-Hydro v4.1, accessible via Intranet Portal `FLW-REG`).
      *   `[Value]` is a decimal probability, calculated per SCNPS Annex 3 methodology, rounded to two decimal places.
  4.  Example of compliant replacement:
      *   Non-Compliant: "If the river level at Blackweir gauge exceeds 4.0m, properties on Canal Street will flood."
      *   Compliant: `P(Property_Inundation_CanalStreet_Zone1 | RiverLevel_Blackweir_Gauge_EQ_4.0m) = 0.87`
  5.  The antecedent for any conditional credence statement must be selected from the OAR-Hydro v4.1. Use of non-registered antecedents constitutes a Category 2 Compliance Breach. Guidance on antecedent selection:
      *   Preference should be given to antecedents with high instrument reliability indices (OAR Column J).
      *   Antecedents should be chosen to maximise the precision and stability of the assigned probability value. Factors influencing stability are documented in OAR Column M.
      *   Antecedents implying direct causal chains or requiring complex multi-variable assessment are deprecated unless they demonstrably improve probability precision per OAR Column M metrics.
  6.  Words and phrases implying indicative conditionality ("if", "in the event that", "should", "would", "could result in", "contingent upon") are prohibited in all public-facing and inter-departmental communications concerning predictive outcomes. Use only the `P(Consequent | Antecedent) = Value` format.
  7.  Previous attempts (Memo FLW-COM-23-032) to replace prohibited terms with paraphrases (e.g., "Given [Antecedent], the probability of [Consequent] is [Value]") have been rejected by SCNPS. Analysis revealed residual indicative modality. The `P(...|...) = ...` format is the sole approved syntax.
  8.  Complex scenarios involving dependencies require special handling:
      *   Nested conditional structures (e.g., "If A, then if B, then C") are prohibited.
      *   Replace nested structures with a single conditional credence statement: `P(Consequent_C | Antecedent_A_and_Antecedent_B) = [Value]`.
      *   `Antecedent_A_and_Antecedent_B` must be registered as a single, compound antecedent in OAR-Hydro v4.1. If no such compound exists, submit Form SCNPS-F7 for antecedent registration (allow 5 working days). Until registration, issue separate `P` statements for `P(C | B)` and `P(B | A)`. Compound antecedents are strongly encouraged for clarity and stability.
  9.  The Legal Office endorses Directive SCNPS-7. The conditional credence format provides unambiguous probabilistic quantification decoupled from unverified antecedent states. This format accurately reflects the Service's predictive assessment under all possible observational scenarios.
  10. Communicating `P(Consequent | Antecedent) = Value` provides the public with the precise probabilistic relationship between defined states. Public interpretation and action based on this relationship, incorporating observation of the antecedent state, are individual responsibilities.
  11. Performance metrics for advisory accuracy (KPI-FLW-07a) will be recalculated based solely on the verification of `Consequent` outcomes against the `P` values issued when the registered `Antecedent` was verified as true. Scenarios where the `Antecedent` was false will not factor into advisory accuracy scoring.
  12. Non-compliance with Directive SCNPS-7 constitutes a breach of the National Flood Warning Service Communications Protocol (Section 8.3) and will be subject to standard disciplinary procedures. All staff must complete mandatory e-learning module `SCNPS7-COMPLY` by 30 October 2023.
  13. This memo avoids conditional constructions. Clause 8 procedures apply only where complex dependencies exist. Staff encountering unregistered compound antecedents must initiate registration. Failure to comply with Directive SCNPS-7 results in disciplinary action.
