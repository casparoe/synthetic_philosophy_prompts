  Hmm, the warehouse scenario seems perfect - it illustrates both mechanisms clearly. The scheduling algorithm dispute sets up the work-to-rule context, while the temp workers and picket line demonstrate the replacement/exclusion issue. I should structure the question to force a choice between theoretical frameworks (withdrawal vs voice/reciprocity/power models) and require application to both features.

  For the model answer, I'll need to demonstrate how different frameworks handle work-to-rule and picket lines differently. The ownership model fails to justify both aspects, while voice models explain work-to-rule as communication and power models legitimize exclusion as necessary leverage. The organization addendum should show how recognition rights stem logically from each model's premises.

  The marking scheme must penalize students who only recite the ownership argument. Five key points: 1) identifying work-to-rule as distinct from simple withdrawal, 2) analyzing exclusionary elements, 3) theoretical choice justification, 4) coherent application to both cases, and 5) recognition rights connection. I'll weight them based on conceptual difficulty.

  Noticing the professor emphasized practical constraints - no real-world references, self-contained scenario, strict time limits. The question must explicitly state this is a hypothetical jurisdiction. The "crux sentence" for graders should flag answers that treat withdrawal as sufficient without addressing work-to-rule cost-generation or replacement-worker exclusion.

  For the model answer structure, I'm considering using a countervailing power framework since it best explains both strategic elements. It'll show work-to-rule as leveraging contractual ambiguities for power, and picket lines as essential to maintaining bargaining position against replacements. The recognition argument then follows naturally - without bargaining rights, the power imbalance remains.

  Ah, and the grading descriptors need to distinguish between students who merely identify issues versus those who show how their chosen theory resolves them. A-level answers should demonstrate the theory's implications for both tactical elements and organizational rights cohesively.
answer: |-
  ## Midterm Examination Question

  **Instructions:** Answer the following question based *only* on the conceptual tools and ethical reasoning developed in this course. Do not appeal to real-world labor law, specific historical cases, unions, or scholarly literature. Assume this scenario occurs in a hypothetical jurisdiction with no pre-existing labor statutes relevant to this dispute. You have 45 minutes. (25 points total)

  **Scenario:** Centauri Logistics operates a large distribution warehouse employing several hundred workers. The collective bargaining agreement (CBA) governing their employment has just expired. Negotiations for a new CBA are deadlocked primarily over the company's implementation of a new, highly restrictive scheduling algorithm. The warehouse has a detailed Procedures Manual outlining specific tasks and rules, but in practice, operations rely heavily on uncodified worker flexibility – staying late to finish loads, answering urgent messages off-shift, skipping redundant quality checks when throughput is critical – to meet demanding targets.

  Frustrated by the impasse, the workers' union initiates a "Work-to-Rule" campaign. Workers meticulously follow *only* the written Procedures Manual, refusing all voluntary flexibility. Warehouse throughput drops by approximately 40%. Centauri Logistics responds by announcing a 40% pay deduction for "partial performance," arguing the workers are not fulfilling their expected duties despite technically following the manual.

  The union then calls a full strike and establishes a peaceful picket line at the warehouse entrance. Centauri attempts to hire temporary workers through an employment agency to maintain operations. Several agency workers approach the warehouse but turn back upon seeing the picket line. One agency worker, needing the income, crosses the picket line and enters the warehouse.

  **Question:**

  1.  **The Withdrawal Model vs. Alternatives (15 points):**
      *   A common justification for striking is that workers own their labor and thus have a right to withhold it. Explain why the *Work-to-Rule campaign* and the *effectiveness of the picket line* (specifically, its impact on replacement workers) each pose distinct challenges for this pure "Withdrawal Model" of strike justification.
      *   Choose *one* alternative theoretical grounding for strike justification (e.g., Voice/Expression, Reciprocity/Corrective Justice, Countervailing Power). Briefly define your chosen model and argue why it provides a more compelling justification for *both* the Work-to-Rule campaign *and* the existence/purpose of the picket line (including the situation with the replacement worker) than the pure Withdrawal Model.

  2.  **Implications for the Right to Organize (10 points):**
      *   Based *solely* on the theoretical grounding for strikes you defended in Part 1, analyze what this implies for the related *right to organize*. Specifically, does your model support only a basic right of workers to associate (form a union), or does it necessitate a stronger right to be *recognized* by the employer and engaged in *good-faith collective bargaining*? Explain your reasoning clearly, linking it to the core principles of your chosen strike justification model.

  ---

  ## Model Answer (Crux for Graders: *"A strike's leverage arises not merely from withholding labor, but primarily from strategically imposing costs via uncodified flexibility and preventing ready replacement, elements the pure withdrawal model struggles to justify."*)

  **Part 1: Challenging Withdrawal & Proposing an Alternative**

  The pure "Withdrawal Model" – justifying strikes solely on individual workers' ownership of their labor and right to withhold it – struggles to account for two key features of the Centauri dispute, both crucial for actual strike leverage.

  First, the **Work-to-Rule campaign** is problematic for the Withdrawal Model. Workers are *not* withholding their labor; they are physically present and performing *exactly* the tasks specified in the official Procedures Manual. The massive 40% drop in throughput occurs because they deliberately withdraw *only* the uncodified flexibility (staying late, off-shift communication, skipping redundant checks) that was essential to efficient operations but never formally required. The Withdrawal Model, focused on the binary act of working or not working, cannot easily justify this strategic *performance* of codified duties while *withholding* expected but uncodified cooperation. Centauri's "partial performance" pay cut highlights this tension – the model struggles to explain why performing only the codified duties constitutes a legitimate form of industrial action deserving protection, rather than merely poor performance warranting pay reduction.

  Second, the **picket line's effectiveness**, particularly in deterring replacement workers, challenges the Withdrawal Model. The model's core is the individual right to *withdraw* one's own labor. However, the strike's success hinges on *preventing Centauri from replacing the strikers* with temps. The picket line serves this exclusionary function: its presence (and the social/moral pressure it represents) convinces several temps to turn away. When one temp crosses the line, they represent a direct threat to the strike's leverage. The pure Withdrawal Model, centered on individual property rights, cannot obviously license this collective action aimed at dissuading *others* from selling *their* labor to Centauri. It struggles to distinguish legitimate persuasion aimed at solidarity from illegitimate coercion infringing on the replacement worker's own purported right to work.

  **A Countervailing Power model provides a superior justification.** This model views strikes not as the exercise of an individual property right, but as a necessary collective tactic to redress a fundamental imbalance of power inherent in the employment relationship within a capitalist system. Employers possess significant structural power (control over capital, jobs, production). Collective action, including strikes, is workers' primary means to generate countervailing power to achieve a more equitable bargaining position and outcomes.

  This model elegantly justifies **Work-to-Rule**. The campaign leverages the inherent incompleteness of the employment contract (the Procedures Manual). By strictly adhering only to codified rules, workers exploit the employer's *dependence* on their uncodified cooperation. The resulting 40% throughput drop is not punishment for non-performance of duties, but the demonstration of the *actual economic value* of the flexibility previously provided gratuitously. It's a powerful, non-withdrawal tactic to impose costs and demonstrate worker power precisely where the employer is vulnerable. Centauri's pay cut is an attempt to retaliate against this legitimate exercise of countervailing power.

  The **picket line and exclusionary effect** are also justified under this model. The strike's effectiveness depends entirely on the *collective* nature of the withdrawal and the *inability* of the employer to circumvent it via replacement. The picket line serves the vital function of *maintaining worker solidarity* and *appealing to the solidarity of other workers* (the temps) to respect the strike. Discouraging replacements isn't primarily about infringing on the individual temp's right (though the model acknowledges this tension), but about *preserving the collective countervailing power* of the striking workers. It prevents the employer from nullifying the strike's impact and restoring the pre-strike power imbalance. The crossing temp, by undermining this collective power, acts (perhaps understandably given their need) against the collective interest of the workers seeking to balance power. The model prioritizes the necessity of collective power for achieving fair bargaining outcomes, seeing the exclusionary element as an inherent, if ethically complex, component of effective strike action.

  **Part 2: Implications for the Right to Organize**

  The Countervailing Power model necessitates a robust **right to recognition and good-faith bargaining**, not merely a right to associate. If the strike's legitimacy and effectiveness stem from its role as a tool to generate countervailing power against employer dominance, then the *mechanism* for wielding that power is crucial. Simply allowing workers to form a union (association) is meaningless if the employer can legally ignore its existence and refuse to negotiate. Without the *threat* of collective action (like a strike) backed by the ability to actually deploy it effectively, the union possesses no countervailing power. Recognition and the duty to bargain in good faith are the essential frameworks that *activate* the potential power of worker association. They transform the union from a social club into a legitimate bargaining agent capable of engaging in the power struggle. Denying recognition perpetuates the unilateral employer power the model seeks to counterbalance. Therefore, the right to organize, under a Countervailing Power justification for strikes, must inherently include the right to recognition and bargaining; otherwise, the core purpose of collective action – redressing power imbalance – is nullified from the outset.

  ---

  ## Marking Scheme (Total: 25 points)

  **Must-Hit Points:**

  1.  **Work-to-Rule Challenge (3 pts):** Clearly explains why WTR (performing codified duties while withholding uncodified flexibility) challenges the pure Withdrawal Model (binary work/not-work focus). *Common Error: Treating WTR as identical to a full walkout or failing to identify the uncodified flexibility.*
  2.  **Picket/Exclusion Challenge (3 pts):** Clearly explains why the picket line's exclusionary effect (deterring replacements) challenges the pure Withdrawal Model (individual right focus, cannot license dissuading others). *Common Error: Ignoring the replacement worker issue or assuming the picket is merely informational.*
  3.  **Alternative Model Definition & Choice Justification (4 pts):** Clearly defines one alternative model (Voice, Reciprocity/Justice, Countervailing Power) and provides a *reasoned argument* for why it is *better* than Withdrawal generally. *Common Error: Just naming a model without justifying its superiority or defining it poorly.*
  4.  **Application to WTR & Picket (7 pts):** Applies the chosen alternative model *coherently and specifically* to justify both (a) the Work-to-Rule campaign and (b) the picket line/exclusionary effect (including the crossing worker). Demonstrates how the model resolves the challenges posed to the Withdrawal Model. *Common Error: Generic application not tied to the specific features of WTR or the picket's exclusion; ignoring the crossing worker; applying the model inconsistently to the two elements.*
  5.  **Organizing Right Implication (8 pts):** Based *specifically* on the model defended in Part 1, provides a clear analysis of whether it supports only association or also recognition/bargaining. Reasoning must logically connect the core principles of the strike justification model to the necessity (or not) of recognition/bargaining for effective countervailing power/voice/justice. *Common Error: Disconnected from Part 1 model; appeal to real-world law; assertion without reasoning; failure to address the necessity of the strike threat.*

  **Grade Descriptors:**

  *   **A (21-25 pts):** Hits all 5 points strongly. Demonstrates sophisticated understanding of the conceptual challenges to the withdrawal model and the chosen alternative. Provides nuanced, well-reasoned justifications for both WTR and the picket line using the chosen model. Logically and compellingly derives the implications for organizing/recognition from the core principles of the strike model. Writing is clear, concise, and philosophically precise. Shows independent critical thought.
  *   **B (16-20 pts):** Hits points 1-4 adequately, and point 5 partially. Identifies the challenges to withdrawal and defines/choses an alternative model with reasonable justification. Applies the model to WTR and the picket, though perhaps with less depth or minor inconsistencies in one part. Attempts to link the strike model to organizing rights, but the connection may be somewhat strained, incomplete, or less rigorously argued than in an A answer. Writing is generally clear but may lack some precision or depth in analysis.
  *   **C (11-15 pts):** Hits points 1-3, but struggles significantly with points 4 and/or 5. May identify the challenges to withdrawal and name an alternative model, but application to the specific scenarios (esp. the picket/exclusion or WTR) is weak, superficial, or illogical. The justification for the alternative model over withdrawal is weak. The analysis of organizing rights is minimal, disconnected from the model, or merely asserted without derived reasoning. May rely on intuition or undeveloped ideas. Writing may be unclear or disorganized.
  *   **D (6-10 pts):** Only partially addresses points 1-3, with significant errors or omissions. Fails to coherently apply an alternative model or discuss organizing rights implications. May fall back primarily on the withdrawal model without engaging the challenges. Writing is poor, arguments are undeveloped or confused.
  *   **F (0-5 pts):** Fails to address the core prompts, relies entirely on the withdrawal model without critique, demonstrates serious misunderstanding of the scenario or concepts, or is largely incoherent.
