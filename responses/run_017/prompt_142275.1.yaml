  ### Welfare Economics Seminar Activity: The Hidden Anchor of Utility Comparisons  
  **Objective:** To reveal how interpersonal utility comparisons implicitly depend on the choice of a zero point (origin) and scaling, and how this choice can mimic or contradict moral priorities like prioritizing the worse off.  

  **Group Structure:**  
  - 3 groups of 4–5 students (14 total).  
  - **Roles per group:**  
    - **Facilitator:** Keeps time, ensures everyone contributes.  
    - **Recorder:** Documents allocations and justifications.  
    - **Skeptic:** Challenges assumptions (e.g., "Is this scale fair?").  
    - **Ambassador:** Reports group conclusions during debrief.  
  *(Rotate roles if time allows.)*  

  **Materials:**  
  - **Handout 1 (Case 1):** Utility tables for Persons A, B, C (budget: $60).  
  - **Card D:** Fourth person with constant utility (all outcomes = 50).  
  - **Handout 2 (Case 2):** Utility tables for Persons X and Y (budget: $20).  
  - Calculators, scrap paper.  

  **Timeline (80 Minutes):**  
  1. **Introduction (5 min):**  
     - *Instructor:* "You have utility tables for three people. Allocate $60 to maximize total utility. No overthinking—just use the numbers given."  
     - *Goal:* Surface instinct to add utilities without questioning scales.  

  2. **Allocation 1 (15 min):**  
     - Groups allocate $60 among A, B, C using **Handout 1** utilities.  
     - **Handout 1 (Case 1) — Utilities for Money:**  
       | Money | A     | B     | C     |  
       |-------|-------|-------|-------|  
       | $0    | 100   | 0     | -50   |  
       | $20   | 120   | 60    | 0     |  
       | $40   | 140   | 120   | 50    |  
       | $60   | 160   | 180   | 100   |  
     - *Expected Output:* Groups give most to B (highest marginal utility).  

  3. **Allocation 2 (20 min):**  
     - Introduce **Card D** (all outcomes = 50).  
     - *Instructor:* "Now include D. Before allocating, your group must commit *in writing* to a rule for setting each person’s zero point and utility unit (e.g., ‘Zero = worst outcome in the choice set’ or ‘One unit = utility gain from $0 to $10’). Then allocate $60 among A, B, C, D to maximize *rescaled* total utility."  
     - *Goal:* Force explicit rules for comparability.  

  4. **Allocation 3 (20 min):**  
     - Groups allocate $20 for **Handout 2 (Case 2)** twice, with conflicting anchors:  
       - **Anchor 1:** Zero = worst outcome in the choice set ($0). Unit = range scaled to 1 (e.g., $0→0, $20→1).  
       - **Anchor 2:** Zero = external baseline ($10 "poverty line"). Unit = gain from $0 to $10 set to 1.  
     - **Handout 2 (Case 2) — Utilities for Money:**  
       | Money | X     | Y     |  
       |-------|-------|-------|  
       | $0    | 0     | 0     |  
       | $10   | 100   | 50    |  
       | $20   | 101   | 200   |  
     - *Calculations for Anchors (Illustrative):*  
       - **Anchor 1:**  
         - X: $0→0, $10→100/101≈0.99, $20→1.  
         - Y: $0→0, $10→50/200=0.25, $20→1.  
         - *Allocation:* Split ($10 each) → 0.99 + 0.25 = 1.24 total.  
       - **Anchor 2:**  
         - X: $0→0, $10→1 (gain=100→1 unit), $20→1.01.  
         - Y: $0→0, $10→1 (gain=50→1 unit), $20→4.  
         - *Allocation:* All to Y → 0 + 4 = 4 total.  
     - *Goal:* Show how anchors flip priorities (sum vs. priority).  

  5. **Debrief (20 min):**  
     - *Mapping to Concepts:*  
       | **Activity Moment**       | **Concept Revealed**                          |  
       |----------------------------|-----------------------------------------------|  
       | Allocation 1 (raw numbers) | Intrapersonal cardinality vs. interpersonal incomparability |  
       | Allocation 2 (rescaling)   | Level/unit comparability requires arbitrary anchors |  
       | Allocation 3 (anchor flip) | Zero point anchors moral priorities (e.g., "priority to worse off" is embedded in the anchor) |  
     - *What the Activity Can’t Show:*  
       - No "privileged scale" exists—anchors are normative choices.  
       - Axiomatic foundations (e.g., Harsanyi’s theorem) will be covered post-activity.  
     - *Predictable Challenges:*  
       - *"Just use 1–10 ratings!"* → Retort: "Who defines 5 as 'neutral'? That’s an anchor."  
       - *"Refusal to compare"* → Discuss: Social choice *requires* comparison; the anchor is unavoidable.  
       - *Math errors* → Provide simplified tables (below) for quick reference.  

  **Simplified Tables for Instructor:**  
  - **Case 1 (A/B/C) Marginal Utilities:**  
    - A: +1 per dollar (linear)  
    - B: +3 per dollar  
    - C: +2.5 per dollar  
  - **Case 2 (X/Y) Anchors in Action:**  
    | **Anchor** | **X at $20** | **Y at $20** | **Optimal Allocation** | **Mimics Priority Rule?** |  
    |------------|--------------|--------------|------------------------|----------------------------|  
    | 1 (Range)  | 1.0          | 1.0          | Split $10/$10          | Yes (X is "worse off" at $0) |  
    | 2 (Baseline)| 1.01         | 4.0          | All to Y             | No (Y gains more from money) |  

  **Bottom line:** The activity forces students to confront how moral choices in social welfare are hidden in the selection of a utility anchor, not in the aggregation rule.  

  ---
  **Instructor Notes for Smooth Execution:**  
  - **Handout 1 (A, B, C, D) and Handout 2 (X, Y)** should be printed separately. Include money-utility tables exactly as above.  
  - **During Allocation 3:** Emphasize that both anchors are defensible (e.g., "worst outcome" is outcome-specific, "poverty line" is society-wide).  
  - **If Groups Finish Early:** Ask, "Would a utilitarian and prioritarian still disagree after rescaling? Why?"  
  - **Post-Activity Lecture:** Cover Arrow’s impossibility, Harsanyi’s aggregation theorem, and the normative status of anchors.  
  - **Why This Works:** The flip in Allocation 3 survives small changes to utilities (e.g., X’s $20 utility as 102 or 100.5), preventing dismissal as "contrived."
