prompt: |-
  I'm trying to work out what I actually think about the trials of the defeated German and Japanese leaders after the Second World War, at Nuremberg and Tokyo. It is often said that these were just the winners punishing the losers under rules invented for the occasion, and I don't want to wave that away; but my own reactions, case by case, are messier than either dismissing the trials or endorsing them wholesale. Here they are.

  Charging the top leaders with starting aggressive wars: right, even though no individual had ever before been convicted of a crime by that name, and their own legal systems treated the decision to go to war as a sovereign right.

  Charging them with the extermination camps: obviously right.

  Charging a general who burned villages in reprisal under a written order from above: right.

  Charging the clerks and railway officials who moved people to the camps and say they did not know where the trains were going: right for some of them, wrong for others, on grounds I cannot quite state, something about what each was in a position to find out.

  Charging a factory director who used deported civilian labour, when every belligerent, including the powers sitting in judgment, used forced labour on a comparable scale: I want to convict him, and I also want to say that a court which convicts him while its own charter forbids it from looking at us is corrupt. I cannot see how both can be true.

  Charging officials of the defeated side over a colonial practice that was lawful where they did it, routine in the victors' own empires, and not thought criminal by nearly anyone then alive: wrong, I think. But I cannot see why this is not just the first case again, since aggressive war was routine too and was also claimed as a right.

  My tentative principle: such a prosecution is legitimate just when what the defendant did was already wrong by a standard he could have recognised, and when the side doing the prosecuting would accept the same rule applied to itself, as I would accept our own commanders being tried for firebombing cities before a court that could really reach them.

  Does that hold together? Where it breaks, which of my verdicts should I give up? And what does the best version of it say about two cases I have not settled: a tribunal created by a treaty signed by winners and losers alike, applying a statute drafted after the fighting ended, and a prosecution brought fifty years later, once the defendants' own country has itself adopted the law it is being tried under?
reasoning: |-
  Okay, this user is really wrestling with the moral and legal complexities of post-WWII tribunals. They've done their homework - clearly aware of the "victors' justice" critique but refusing simplistic takes. Interesting how they're grappling case-by-case: comfortable convicting for death camps but troubled by forced labor charges where Allies did similar things. That cognitive dissonance between "I want to convict" and "this feels corrupt" is palpable.

  Hmm... their proposed principle has two prongs: 1) defendant should've known it was wrong (subjective standard), 2) prosecutor must accept reciprocal application (objective standard). Smart framing - it addresses both individual culpability and systemic hypocrisy. But does it hold? Let's test it against their own examples:

  For aggressive war charges - prong #1 fails because sovereign immunity was entrenched, but prong #2 works (Allies wouldn't accept reciprocal liability for Dresden/Hiroshima). Yet they still feel it was justified. Contradiction? Or is there something about the unprecedented scale of Nazi aggression that overrides traditional sovereignty norms?

  Ah! The factory director case perfectly exposes the tension. Using their principle: if the Allies used comparable forced labor, prong #2 should block prosecution. But intuitively they still want conviction. Why? Probably because the labor was part of genocide machinery. That distinction between "ordinary" forced labor and genocidal context might be key - the user hasn't articulated this nuance yet.

  Their unsettled cases reveal deeper concerns about legitimacy over time. A jointly created tribunal feels more legitimate to them than pure victors' court - that tracks with their reciprocity principle. But the 50-years-later prosecution is trickier: does Japan adopting international law retroactively validate trials? Or is it still victors' justice in slow motion? 

  What they might need is layered analysis: first distinguish between crimes with clear moral wrong (genocide) vs. legally novel charges (aggressive war). Then separate individual culpability from systemic hypocrisy. Finally, acknowledge that some verdicts can be morally right even if procedurally imperfect - the death camp convictions transcended the flawed tribunal structure.

  The reciprocity test is noble but perhaps too idealistic. In practice, powerful states rarely submit to jurisdiction. Maybe modified to: "prosecution legitimate if a disinterested tribunal applying consistent standards would convict" - but that's what they were trying to create at Nuremberg! Circularity alert.

  Ultimately their discomfort stems from wanting absolute moral consistency in a world of power asymmetries. Wise of them to sit with that tension rather than resolve it neatly. I should honor that while offering analytical tools.
answer: |-
  Your reasoning is profoundly thoughtful—you've articulated the core tensions in transitional justice with remarkable clarity. Your proposed principle is philosophically sound, but its application reveals complexities. Let's break this down systematically.

  ### Your Principle Evaluated:
  **"Prosecution is legitimate when:**
  1. **The act was wrong by a standard the defendant could recognize** (subjective culpability), *and*
  2. **The prosecutor would accept reciprocal application of the rule** (systemic integrity)."

  **Where it holds:**
  - **Death camps**: Clearly satisfies both prongs. The moral wrong was recognizable (even under Nazi law, murder wasn't *formally* legal), and Allied powers would not have systematically exterminated populations.
  - **Village-burning general**: The order doesn't absolve him—he knew massacring civilians was morally/legally wrong (Hague Conventions existed). Reciprocity holds: Allied commanders *were* occasionally tried for similar acts (e.g., U.S. court-martials for the Dachau reprisals).

  **Where it strains:**
  1. **Aggressive war charge**:  
     - *Prong 1 fails*: Sovereign immunity was deeply entrenched. Pre-1945, "aggressive war" wasn’t a prosecutable *individual* crime.  
     - *Prong 2 fails*: Would the Allies accept liability for Dresden/Hiroshima? Unlikely.  
     *Yet you feel it was justified*. **Resolution**: The sheer scale of Nazi/Japanese aggression created a moral imperative to establish a *new* norm. Nuremberg’s innovation was reframing war as a *crime against peace*—a necessary evolution. Your intuition likely responds to this.

  2. **Factory director using forced labor**:  
     - *Prong 1 holds*: He knew exploiting slave labor was immoral (especially given genocidal conditions).  
     - *Prong 2 fails*: Allies used POW/civilian labor extensively (e.g., Soviet gulags, U.S. Japanese internment labor).  
     *Your conflict is valid*. **Resolution**: Distinguish between "ordinary" forced labor (ubiquitous in WWII) and *genocidal* labor. Nazi camps aimed at extermination through work—this extreme context justifies conviction despite Allied hypocrisy. The court's refusal to examine Allied actions *is* a flaw, but not fatal to the defendant's culpability.

  3. **Colonial atrocities**:  
     - *Prong 1 fails*: If the practice was legal/standard in the empire (e.g., Japan in Korea), culpability is weak.  
     - *Prong 2 fails*: European powers committed comparable acts (e.g., Britain in India).  
     You’re correct—this *is* inconsistent with aggressive war prosecutions. **Key distinction**: Colonial violence was often *systemically sanctioned*, while Axis aggression violated existing treaties (e.g., Kellogg-Briand Pact). Still, trying colonial officials *solely* at Tokyo/Nuremberg reeks of hypocrisy. Your verdict ("wrong") is defensible.

  ### Unsettled Cases Under Your Principle:
  1. **Tribunal created by joint treaty, post-war statute**:  
     - **Legitimacy boost**: Joint creation implies loser consent (e.g., post-1945 Allied Control Council laws in Germany).  
     - *Prong 1*: If the statute codified pre-existing norms (e.g., murder, torture), it holds. Novel charges (aggressive war) are iffier.  
     - *Prong 2*: Joint drafting signals *nominal* reciprocity, but victors still dominate.  
     **Verdict**: More legitimate than pure victors' tribunals, but still imperfect.

  2. **Prosecution 50 years later under defendant's national law**:  
     - *Prong 1*: If the act was criminalized *later*, it fails (ex post facto injustice).  
     - *Prong 2*: If the state now accepts the law, reciprocity is satisfied *prospectively*.  
     **Verdict**: Legitimate only if:  
       a) The act was universally wrongful *at the time* (e.g., torture), *and*  
       b) The delay wasn't tactical (e.g., Pinochet's arrest in 1998).

  ### Refining Your Principle:
  Your framework breaks when confronted with **systemic atrocities requiring normative evolution** (e.g., aggressive war, genocide). Add a third prong:  
  **3. Prosecution is legitimate if, *despite* novelty/hypocrisy, the act shocks the universal conscience to such a degree that failing to punish perpetuates profound injustice.**

  This justifies Nuremberg's aggression charge and Holocaust prosecutions, while excluding colonial "business as usual" or ex post facto stretching.

  ### Conclusion: Consistency Adjustments
  - **Hold fast** to your verdicts on death camps, village-burning generals, and colonial officials.  
  - **Adjust your view on aggressive war**: Its charge was legitimate *despite* legal novelty because it addressed an unprecedented moral catastrophe requiring new norms.  
  - **Split the factory director**: Convict if labor was genocidal; acquit if "merely" exploitative (like Allied practices).  
  - **Reject blanket hypocrisy veto**: Sometimes prosecuting others while ignoring your own crimes is *still* better than total impunity (e.g., convicting Nazi doctors despite Tuskegee).

  The trials were flawed, necessary, and revolutionary—all at once. Your nuanced stance honors that complexity.
