  The most severe tension is between 4 and 5. Fixing this by redefining death's harm for non-diachronic beings as scalar deprivation might align better with the overall scalar view. However, it weakens commitment 4's categorical protection. Alternatively, hold that death for non-diachronic beings isn't a harm at all, making their deaths easily overridden, which supports commitment 4 but might seem counterintuitive.

