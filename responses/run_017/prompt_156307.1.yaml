  Commitment 7 and 1/2/3. The user is confident current AI isn't sentient, but scaling up won't change things. But if sentience is about causal-functional organization, scaling up might increase experiential bandwidth. Their confidence might be based on current architectures lacking key features, but without specifying what those are, it's an assumption that could conflict with the scalar view. If temporal grain or richness increases with scale, sentience could emerge.

  Also, commitment 7's uncertainty principle: using expected value, weighting by credence and degree. For insects, high numbers and uncertainty in temporal grain could push their welfare to the top. But commitment 5 says death isn't a harm, so maybe insect deaths aren't a big issue. However, if their lives contain positive experiences, death might still be a harm by depriving them of those. The user says death isn't a harm because they lack future-directed desires, so only the experiences during life matter. But if an insect's death prevents future positive experiences, that's a harm. The user needs to clarify if deprivation matters. If not, then death isn't a harm, which resolves some tension. But then, in commitment 7, the uncertainty would focus on suffering during life, not death, so agricultural deaths might not be alarming, but suffering during life would be.

  The biggest tension is between 4 and 5. Commitment 4's extra protection for diachronic beings conflicts with the implication from commitment 5 that non-diachronic beings' interests can be easily overridden. The cheapest fix is to reinterpret the "serious interests" in commitment 4 more narrowly, excluding death for non-diachronic beings. But that might not fully resolve the trade-off issue. Alternatively, adjust commitment 5 to acknowledge that death deprives beings of future positive experiences, which could be a scalar harm. However, that might complicate the view and require rethinking the moral significance of diachronic self-concern.

  Another tension is between 6's partiality and the scalar impartiality. The user allows spending more on their child's mild discomfort than an insect's death. If the insect's death is a small harm, partiality can override it. But if the numbers are astronomical, even small harms add up. The user might need to argue that partiality has thresholds or that the harm to insects is negligible per individual. But with uncertainty in temporal grain, the expected harm might be significant. The cheapest fix is to emphasize that partiality is context-dependent and that the scalar harm is so small that even large numbers don't override partial obligations. But this relies on the harm per insect being negligible, which commitment 5 supports if death isn't a harm.

