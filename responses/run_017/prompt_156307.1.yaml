  First, I need to understand each commitment thoroughly. The user claims sentience is scalar, based on experiential bandwidth—richness of content and temporal grain. They assign insects minimal sentience, while thermostats, plants, and LLMs are at zero. Diachronic self-concern gives extra protection; death isn't a big harm for beings without it. Suffering matters impartially, but they prioritize their child over insects. Method-wise, sentience is about causal-functional organization, but current AI isn't sentient. Under uncertainty, expected value pushes insect welfare high in cause prioritization.

