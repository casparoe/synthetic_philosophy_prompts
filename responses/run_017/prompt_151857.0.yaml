prompt: |-
  Two friends of mine — Rhys, who does something in theoretical stats, and Marta, who's in phil physics — ended up having a proper row in the kitchen after a seminar on objective chance last week, and they've both asked me to adjudicate. I took notes on my phone at the time and I honestly cant tell who's got the better of it, so I'm passing it on.

  Background they both accepted: Lewis's Principal Principle — roughly, that your credence in an outcome should line up with its objective chance, provided the rest of your evidence is "admissible", where the usual gloss is that admissible evidence is evidence whose bearing on the outcome comes entirely by way of the chances.

  The case they kept coming back to: a lab rig where the chance of an atom decaying by 3pm is set by a dial at noon; the dial is itself set by a fair coin, so right now, at 11am, the chance of decay is 0.5, and it'll end up being either 0.9 or 0.1. At 11am a note arrives from the lab, reliably, saying only: the chance at noon will be 0.9. Nothing about the dial, nothing about the coin, nothing about what actually happens.

  1. Marta: You should obviously go to 0.9. But the PP, as stated, says 0.5 — the present chance is 0.5, and a report about chances is about as admissible as evidence gets. So either the PP is false, or it's rescued only by the word 'admissible', and nobody's ever given a non-circular account of which evidence is admissible. The usual gloss is circular: it defines admissible evidence as the evidence that reaches you only via the chances, which helps itself to the very thing the principle was supposed to do. What's left is: believe the chances unless you've a reason not to. That's close to empty.

  2. Rhys: The fix isn't 'admissible', it's indexing to times. Chances are time-relative anyway. Read the PP as: match the chance that governs the outcome — the one in force over the period in which it happens — not the chance at the moment you happen to be thinking. Your evidence here includes a report on the noon chance, the chance governing the decay is 0.9, so 0.9. No circularity, and 'admissible' isn't carrying any weight in this case at all.

  3. Marta: Fine, granted — that sorts out that case. But it only sorts out evidence about chances. The PP still has to say something about evidence about outcomes: a crystal ball, a forecaster with a 99% track record, a text from the future. There the only move available is: inadmissible, ignore it, stay at the chance. And then the entire content of the principle sits in the line between admissible and inadmissible, which is precisely the line nobody can draw without circularity. 'Match the chances except when you shouldn't' isn't a principle, it's a placeholder.

  4. Rhys: There is a non-circular way to draw it, and it's causal: evidence is admissible iff it doesn't depend on the outcome — isn't causally downstream of it, doesn't counterfactually track it. The lab note reports a dial setting upstream of the decay, so admissible; the forecaster's report tracks the outcome, so inadmissible. And that isn't a fudge, because it gives the principle real bite: in a genuinely chancy world you can't get better-than-chance knowledge of a chancy outcome by any route that doesn't run through the chances. The forecaster case only feels like a counterexample because you're picturing a world the PP says can't exist.

  5. Marta: That last claim can't survive, and here's the case. Same rig, but the note says: the chance at noon will be 1. Everyone agrees information about future chances is admissible — that's the whole point of deferring to chances. But a chance of 1 just is the outcome. So the note hands you certainty about a chancy outcome in advance, by a route that isn't downstream of anything, and there's nothing incoherent about the set-up. So either you drop the 'no foreknowledge' claim, which was the bit that was meant to give the principle bite, or you say chances of 0 and 1 are somehow special, which is ad hoc. Neither is comfortable.

  6. Rhys: I'll drop it, partly — what I actually need is weaker: chances are the only channel, and your back-door case runs through chances, so it's consistent with that. Every substantive principle has a messy boundary; that's a research programme, not a refutation. And your case doesn't really describe a violation anyway: at 11am, before the note, 0.5 was the right credence, and once the note arrives the PP with time-indexing gets you to 1 on its own. There's nothing left over needing an explanation.

  Can you go through the six moves one at a time and tell me who's right about what — rating each move somewhere from clearly mistaken to clearly right, with a line or two of justification each — rather than just declaring an overall winner? And if they're both missing something, or both working with some shared assumption that's wrong, say what that is.
reasoning: |-
  We are adjudicating a debate between Marta and Rhys about the Principal Principle (PP) and admissibility of evidence. The case involves a lab rig where the chance of an atom decaying by 3pm is set by a dial at noon, and the dial is set by a fair coin at 11am. At 11am, a note arrives saying the chance at noon will be 0.9. We have six moves to evaluate.

  Background: The Principal Principle (PP) says that one's credence in an outcome should equal the objective chance of that outcome, provided the rest of one's evidence is admissible. Admissible evidence is typically glossed as evidence that bears on the outcome only via the chances.

  Move 1: Marta
  - Claim: At 11am, after receiving the note, credence in decay should be 0.9. But the PP as stated would say 0.5 (the present chance) because the note is about the future chance and should be admissible. Marta argues that the usual gloss on admissibility is circular because it defines admissibility in terms of the chances. Thus, the PP is either false or rescued by an undefined notion of admissibility, making it nearly empty.
  - Evaluation: Marta is right that the note is admissible and should lead to a credence of 0.9, but the PP as stated without time-indexing might seem to require 0.5. However, her criticism about circularity in defining admissibility is a valid concern. But note: the case she describes is one where the evidence is about the future chance, and the PP is typically understood to apply to the chance at the time of the outcome. So her criticism of the PP without time-indexing is correct, but the circularity point is separate and will be addressed later. 
  - Rating: Partially right. She correctly identifies a problem with the PP without time-indexing, but the circularity point is deeper and not fully addressed by this case alone.

  Move 2: Rhys
  - Claim: The fix is to index chances to times. The PP should refer to the chance that governs the outcome (at noon) rather than the chance at the time of thinking (11am). So, with the note, we set credence to 0.9. This avoids circularity and the admissibility clause isn't needed in this case.
  - Evaluation: Rhys is correct that time-indexing resolves this case. The PP is often formulated with time-indexing: one should align with the chance at the relevant time (the time of the outcome) when conditional on admissible evidence. The note is evidence about the chance at noon, so it is admissible and we update to 0.9. This move is standard in the literature (e.g., Lewis later proposed a time-indexed version). However, note that Rhys says "admissible isn't carrying any weight", but in this case it is because the note is about the chance and is admissible. The admissibility condition is still present, but in this case it is satisfied. 
  - Rating: Clearly right for this case. Time-indexing is a standard and effective fix.

  Move 3: Marta
  - Claim: Time-indexing fixes evidence about chances, but for evidence about outcomes (like a crystal ball or a forecaster) the only move is to call it inadmissible and ignore it. Then the entire content of the PP rests on the distinction between admissible and inadmissible evidence, which is circularly defined (as evidence that bears on the outcome only via the chances). So the PP reduces to "match the chances except when you shouldn't", which is a placeholder.
  - Evaluation: Marta has a point. The PP does rely on the notion of admissibility to handle cases of evidence that might bypass the chances. The circularity worry in defining admissibility remains. However, note that Rhys will propose a causal account in the next move. At this stage, Marta is correctly pointing out a challenge for the PP.
  - Rating: Partially right. The circularity worry is a legitimate challenge, but it does not necessarily defeat the PP if a non-circular account of admissibility can be given.

  Move 4: Rhys
  - Claim: A non-circular account of admissibility is causal: evidence is admissible iff it doesn't depend on the outcome (isn't causally downstream, doesn't counterfactually track the outcome). The lab note is about a dial setting (upstream) so admissible; a forecaster's report (which tracks the outcome) is inadmissible. This gives the PP bite: in a chancy world, you can't get better-than-chance knowledge of a chancy outcome except via the chances.
  - Evaluation: Rhys offers a causal account of admissibility to avoid circularity. This is a substantive proposal. The idea is that if the evidence is causally independent of the outcome (or only related via causes that are upstream and affect the outcome via the chance), then it's admissible. This is non-circular because it uses causal structure. However, note that the causal account might face challenges in cases of non-causal dependence or in worlds with different causal structures. But in the context of the lab rig, it seems to work. Moreover, the claim that in a genuinely chancy world you cannot have evidence that bypasses the chances is a key philosophical position (Lewis held something like this). 
  - Rating: Reasonable and non-circular. It addresses Marta's circularity concern. But note that the causal account might not be the only way and may have its own issues.

  Move 5: Marta
  - Claim: Consider a variant: the note says the chance at noon will be 1. Since a chance of 1 is the same as the outcome occurring, this note gives certainty about the outcome in advance. But the note is admissible (as it's about the future chance). This seems to allow foreknowledge without running through the outcome, and the setup is coherent. Thus, either we must drop the claim that you can't have foreknowledge (which was supposed to give the PP bite) or treat chances of 0 and 1 as special (which is ad hoc).
  - Evaluation: Marta's case is clever. If the note says the chance will be 1, then it implies the outcome (decay) will occur. And if the note is admissible (as it's about the chance), then the PP requires credence 1. But this seems to give foreknowledge without any causal connection to the outcome? However, note that the chance being set to 1 is part of the setup. The chance of 1 is determined by the dial setting, which is set by the coin. So the note about the chance being 1 is still about an upstream cause (the dial) and hence, by Rhys's causal account, is admissible. Moreover, in a deterministic setup (chance 1) it is not chancy anymore. But the PP is about chancy outcomes. So perhaps the PP doesn't apply to outcomes that are determined? However, Lewis and others typically allow that chances can be 0 or 1. The issue is that if a future chance of 1 is known, then we know the outcome, and that seems to bypass the chance? But note: the note is about the chance, and the chance being 1 is what causes the outcome? Actually, in this setup, the chance being 1 is set by the dial, and then the decay must occur. So the evidence (the note) is still about the chance-setting mechanism (upstream). Therefore, it is admissible and the PP requires credence 1. This does not violate the idea that you can't have evidence that bypasses the chances because the note is about the chance. So it's consistent. Moreover, at 11am, without the note, the chance of decay is 0.5 (because the dial might be set to 0.1 or 0.9). After the note, we update to 1. There's no violation of the PP. The foreknowledge is obtained via the chance, so it doesn't bypass the chance. Thus, Marta's worry is unfounded. 
  - Rating: Mistaken. The case does not show a problem because the evidence about the chance of 1 is still about the chance and is admissible. It does not bypass the chance.

  Move 6: Rhys
  - Claim: He drops the "no foreknowledge" claim in part, but what he needs is that chances are the only channel. The case with chance 1 runs through the chances, so it's consistent. He also argues that every principle has messy boundaries, and in this case the PP with time-indexing gets you to 1 without needing an extra explanation.
  - Evaluation: Rhys is right. The note about the chance of 1 is admissible and the PP requires credence 1. The foreknowledge is obtained via the chance, so it doesn't violate the idea that chances are the only channel. Moreover, the case is handled by the PP without any special treatment. So there is no need to drop the core idea. The point about messy boundaries is also reasonable. 
  - Rating: Clearly right.

  Overall: 
  - Both are making good points, but Rhys's position is more defensible. The time-indexing and causal account of admissibility address Marta's concerns. The chance 1 case is not a counterexample because it is still mediated by the chance.

  However, note that the causal account of admissibility might not be the only way, and it might have limitations in non-causal contexts. But for the cases at hand, it works.

  Ratings:

  1. Marta: Partially right (she identifies a problem without time-indexing, but the circularity point is valid but not fully developed in this move). 
  2. Rhys: Clearly right (time-indexing fixes the case).
  3. Marta: Partially right (she correctly points out that the circularity issue remains for outcome evidence, but Rhys has a response).
  4. Rhys: Reasonable and non-circular (causal account of admissibility).
  5. Marta: Mistaken (the chance 1 case is handled by the PP without violating the principle).
  6. Rhys: Clearly right (the chance 1 case is consistent with the PP and the causal account).

  But note: In move 5, Marta's case does raise a question about whether a chance of 1 is special. However, Rhys correctly notes that the PP handles it without ad hoc measures. So the setup is coherent.

  Therefore, Rhys's overall position is stronger.

  However, let's write the ratings as requested.
answer: |-
  ### Analysis of the Debate Moves

  Here's a breakdown of each move in Rhys and Marta's debate, rated on a scale from "clearly mistaken" to "clearly right," with brief justifications. I assess each move based on philosophical coherence, alignment with the Principal Principle (PP), and logical consistency. Both make valid points, but they share an unexamined assumption: that objective chances are metaphysically robust and non-epistemic (i.e., chances are mind-independent properties of the world, not reducible to credences). This assumption is standard in the literature but can be contested (e.g., by Humean views). I note this where relevant, but focus on their arguments.

  ---

  **Move 1: Marta**  
  **Claim:** The PP implies a credence of 0.5 at 11am (current chance) even after receiving the note about the noon chance being 0.9. But intuitively, we should update to 0.9. This exposes circularity in "admissible evidence" (defined as evidence affecting the outcome "only by way of the chances"), rendering the PP nearly empty.  
  **Rating:** **Partially right, but incomplete.**  
  **Justification:** Marta correctly identifies a problem: without refinement, the PP seems to demand credence 0.5 here, conflicting with rational updating. Her circularity concern about admissibility is valid—the standard gloss *is* arguably circular, as it uses "chances" to define admissibility while the PP aims to ground credences in chances. However, she overlooks that time-indexing (Rhys's fix) resolves this specific case cleanly, so the PP isn't necessarily "false." The circularity worry stands, but this case alone doesn't doom the PP.

  **Move 2: Rhys**  
  **Claim:** Index chances to times—the PP should defer to the chance *governing the outcome* (noon's 0.9), not the chance at the time of evidence (11am's 0.5). The note is admissible, so credence should be 0.9. "Admissible" isn't doing work here.  
  **Rating:** **Clearly right for this case.**  
  **Justification:** Rhys's time-indexing is a standard and effective fix for this scenario (endorsed by Lewis and others). The PP is meant to defer to the chance at the time of the outcome, not arbitrarily to earlier chances. The note reports the future chance, which is directly relevant, so updating to 0.9 is rational. Admissibility is straightforward here (the note is "about chances"), so his claim that it isn't carrying weight holds *in this instance*. This avoids Marta's circularity concern for evidence about chances.

  **Move 3: Marta**  
  **Claim:** Time-indexing fixes evidence about chances, but for evidence about *outcomes* (e.g., a crystal ball), the PP must invoke "inadmissibility" to ignore it. This makes the PP's content hinge on a circularly defined admissible/inadmissible boundary.  
  **Rating:** **Partially right.**  
  **Justification:** Marta correctly flags that evidence about outcomes (not chances) strains the PP. The circularity worry resurfaces here: if admissibility is defined as "bearing on the outcome only via chances," but "via chances" presupposes what counts as chance-mediated evidence, the definition feels circular. This *does* risk reducing the PP to "match chances unless evidence bypasses them," which lacks clear guidance. However, Rhys's causal account (next move) offers a non-circular fix, so her critique is potent but not fatal.

  **Move 4: Rhys**  
  **Claim:** Admissibility can be defined non-circularly via causality: evidence is admissible iff it isn't causally downstream of/counterfactually dependent on the outcome. The lab note (upstream) is admissible; a forecaster (tracking the outcome) is not. This gives the PP "bite": in chancy worlds, you can't get outcome knowledge except via chances.  
  **Rating:** **Reasonable and non-circular, but potentially problematic.**  
  **Justification:** Rhys's causal account avoids circularity by grounding admissibility in causal structure instead of chances. This is a substantive, workable criterion (e.g., the lab note reports a cause, so admissible; a crystal ball reporting decay directly would be inadmissible). It also provides a clear "bite" condition: inadmissible evidence would require non-chancy determinism. However, it faces issues: (1) not all dependencies are causal (e.g., logical or acausal correlations), and (2) it assumes a fixed causal metaphysics, which may not hold in all physics (e.g., quantum retrocausality). Still, for ordinary cases, it's a strong response to Marta.

  **Move 5: Marta**  
  **Claim:** If the note says the noon chance is 1 (implying certain decay), this gives foreknowledge of the outcome via admissible evidence (about chances). This contradicts Rhys's "no better-than-chance knowledge" claim unless chances of 0/1 are treated specially (ad hoc).  
  **Rating:** **Mistaken in its implications.**  
  **Justification:** Marta's case is clever but doesn't refute the PP. A chance of 1 *is* the outcome (decay must happen), so the note *is* admissible evidence about chances (upstream dial setting), and the PP (with time-indexing) validly mandates credence 1. Rhys's "no foreknowledge" claim (from Move 4) isn't violated because the knowledge comes *through* the chance mechanism (the dial), not a "back door." There's no incoherence: the setup is consistent, and no special treatment for 0/1 chances is needed. Her worry confuses "bypassing chances" with legitimate chance-based updating.

  **Move 6: Rhys**  
  **Claim:** The chance=1 case runs through chances, so it's consistent with the PP and doesn't violate the "only channel" claim. Boundary cases (0/1 chances) are messy but don't refute the PP. The note alone updates credence to 1 without residue.  
  **Rating:** **Clearly right.**  
  **Justification:** Rhys correctly notes that evidence about a future chance of 1 is still PP-compliant—it updates credence via the chance itself, not external tracking. This preserves the PP's core without ad hoc fixes. His concession that principles have "messy boundaries" is fair; even robust theories face edge cases (e.g., thermodynamics at quantum scales). The PP handles this cleanly: pre-note credence is 0.5 (current chance); post-note, it updates to 1 (future chance). No further explanation is needed, and the "only channel" claim holds.

  ---

  ### Overall Assessment
  - **Rhys "wins" the debate:** His time-indexing and causal account of admissibility resolve Marta's cases more effectively. Marta's critiques highlight genuine challenges (e.g., circularity risks), but Rhys offers non-circular, workable solutions. His Move 6 deftly neutralizes her best counterexample.
  - **Marta's contributions:** She rightly presses on circularity (Moves 1 and 3), exposing vulnerabilities in naive PP formulations. However, her solutions are less constructive, and her chance=1 case (Move 5) backfires.
  - **Shared assumption:** Both treat chances as metaphysically objective and time-relative. This is defensible but contestable—e.g., Humeans reduce chances to patterns in events, which might reframe admissibility. Neither questions this, leaving their debate internal to non-Humean views.
  - **Unresolved issues:** Rhys's causal admissibility may struggle with non-causal dependencies (e.g., logical or correlational evidence). Marta's circularity worry lingers if causality is rejected, but Rhys's account provides a plausible baseline.
