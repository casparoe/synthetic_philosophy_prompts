  I should address several layers here: The operationalization problem with their projectibility metric, the ontology of kinds versus individuals, and the hierarchy of classifications from fundamental physics to special sciences. Their quantitative approach is clever but rests on problematic presuppositions - mainly that "natural" must mean maximally predictive, and that reality has only one correct grain of description.

