  ## Well Blessing Address - Churchyard, Second Sunday of June

  Friends, neighbours, visitors, welcome. It’s a deep honour to stand before you as we gather once more at this ancient well, surrounded by the church our ancestors built and the land they loved. There’s a particular feeling in the air today, isn’t there? A sense of connection, of stepping into a current that flows far beyond any single one of us. This Well Blessing feels… rooted. Like it belongs to the very stones and soil of this place.

  [Pause, look at the well]

  Recently, sorting through some old things, I came across a parish magazine from 1923. It told a story that surprised me. Our curate that year, a man clearly devoted to this village, wrote about the previous winter. He described searching through books of old customs, looking for something special – something to mark our place, our community, here by this well. He found inspiration, a spark, in traditions from far away. And from that spark, he carefully crafted what we know today: the procession we’ll soon make, the words we’ll share, the hymn we’ll sing, the beautiful dressing of the well itself. He gave us a gift.

  [Smile gently]

  My own grandmother, just eight years old then, walked in that very first procession he created. Seventy years later, when she told me about it, her eyes shone with the memory of something timeless, something that felt as old as the hills. That’s the power of it, isn’t it? That within a single lifetime, something lovingly *made* could feel so profoundly *given*.

  And look what happened next. That spark caught. Year after year, through changing times, through war and peace, through generations – your families, my family – we’ve walked this path. We’ve sung that hymn. We’ve woven the well. We’ve added our own touches, our own quiet understandings of what it means. The newcomers in the 1990s, who saw its value fading and lovingly fanned the flame back to life, knew the story of its beginning and chose it anyway. They saw not just a ceremony, but *our* ceremony.

  So, is this Well Blessing medieval? The stones around us, the water below, they hold millennia. But this particular gathering, this shared ritual we enact? It began in the winter of 1922. Yet, does that make it any less real? Any less *ours*? Does a century of shared footsteps, of lifted voices, of hands carefully tending the well-dressing, count for nothing simply because we know the name of the man who first lit the candle?

  [Look around at the crowd]

  I think it counts for everything. Traditions aren’t fossils, locked unchanged in stone. They are living things. They begin somewhere. Someone has the idea, plants the seed. And then… the community waters it. We give it meaning, year by year, step by step, generation by generation. **That winter of 1922 wasn't the end of something old; it was the beautiful, deliberate beginning of something new that was built to last.** The truth isn't that our Blessing lacks history; it's that its history is still being written, right here, by us. It’s a history of care, of continuity we *chose* to create and *keep* creating.

  The curate looked at this well and saw the potential for a ritual to bind us together. Four generations later, here we are, bound. The well-dressers see beauty and devotion in their intricate work. The singers feel the hymn resonate in their bones. The children sense the specialness as they walk. That feeling – that deep-rooted sense of belonging and reverence right here, right now – that is utterly genuine. That is our inheritance, not from some misty, anonymous past, but from our own grandmothers and grandfathers, from neighbours past and present, who decided this was worth doing, worth keeping, worth *feeling*.

  So today, as we process, as we sing, as we admire the well dressed in its summer finery, let’s do more than just follow steps laid down long ago. Let’s honour the intention that started it: the love for this village and its heartspring. Let’s honour the century of care that has sustained it. And let’s consciously add our own chapter to its ongoing story. Let the water remind us of what flows beneath the surface, connecting us through time. What we do here matters, not because it’s always been done, but because *we* do it, because it speaks to *us*, and because we choose to pass it on, real and vibrant, to those who will stand here next.

  Let the Blessing begin.

  ---

  **Note on the Challenged Sentence:**

  *   **The Sentence:** "That winter of 1922 wasn't the end of something old; it was the beautiful, deliberate beginning of something new that was built to last."
  *   **Why it might be challenged:** This is the most direct statement asserting the non-antiquity of the *specific ceremony* (while acknowledging the ancient site). Some villagers who firmly held the medieval belief might find this jarring, even if subtly phrased. They might feel it diminishes the ceremony's perceived weight or legitimacy, despite the speech's overall message. They might privately cling to the idea that the curate was merely "restoring" something fragmentary or forgotten, rather than creating anew. The phrase "built to last" might feel like insufficient compensation for the loss of imagined centuries. Be prepared for quiet comments afterwards like, "But surely he must have found *some* old reference here..." or "It still *feels* ancient, doesn't it?" Hold firm to the core truth gently but clearly if questioned, reiterating the *value* lies in the century of shared practice since. The academics will recognise this sentence as the crucial, honest pivot point your whole address balances upon.
