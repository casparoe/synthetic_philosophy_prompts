answer: |-
  Here’s a complete final exam package designed to meet your specifications, focusing on conceptual rigor and penalizing superficial recitations of standard arguments.

  ---

  ### **Final Exam Question**  
  **Time:** 90 minutes  
  **Target Length:** 1,000 words  
  **Question:**  
  Fieldworkers documented 60 distinct procedures for making waterproof containers across 30 neighboring communities using identical local materials. Three findings emerged:  
  1. Over time, procedures scoring higher on a standardized leak test increased in population frequency.  
  2. Novices (isolated, no prior exposure, given only the goal and materials) independently recreated the same small subset of procedures—those increasing in frequency in the field.  
  3. No lineage data exists: transmission pathways are unobservable.  

  Explain how we could empirically distinguish whether this pattern arises from:  
  - **Selection** acting on heritable variation in procedures, or  
  - Learners **independently converging** on optimal solutions due to shared cognitive/material constraints.  

  Then, address:  
  - Whether reliable convergence *itself* could be the product of prior Darwinian processes,  
  - Whether such convergence could replace high-fidelity replication to enable cumulative adaptation, and  
  - What specific evidence would resolve these questions.  

  ---

  ### **Model Answer** (910 words)  
  The empirical challenge is to discriminate between selective retention of culturally transmitted variants and population-wide convergence arising from shared reconstruction biases. Crucially, neither the frequency shift (Finding 1) nor the absence of lineage data (Finding 3) definitively supports selection, as convergence could produce identical patterns.  

  **Distinguishing Selection from Convergence**  
  Selection requires:  
  - **Heritable variation**: Variation in traits must be transmitted, not regenerated *de novo*.  
  - **Differential fitness**: Traits must confer a transmission/retention advantage.  
  Convergence, by contrast, implies traits re-emerge independently due to learning biases or physical constraints.  

  *Key discriminators*:  
  1. **Predictability of variants**: If novices *only* produce the "successful" variants (Finding 2), convergence is plausible. But if *rare or suboptimal variants* persist in the population despite not being re-derived by novices, this implies inheritance (e.g., via high-fidelity copying).  
  2. **Path dependence**: Introduce a novel, suboptimal variant into the community. Under selection, it should decline rapidly. Under convergence, it might persist if transmitted faithfully, but *not* if it violates reconstruction biases.  
  3. **Variation structure**: High inter-learner variation in *novice* attempts suggests weak constraints, making selection likely. Low novice variation with high field variation implies transmitted heritage.  

  **Is Convergence Itself Darwinian?**  
  Reliable convergence is not an *alternative* to Darwinism but potentially its product:  
  - Cognitive biases (e.g., preferring efficient procedures) may result from biological evolution ("evolved reconstructors").  
  - Alternatively, such biases could arise from cultural selection on learning strategies (e.g., selective adoption of easy-to-reconstruct techniques).  
  Thus, convergence may reflect prior selection operating on *learning mechanisms* rather than the procedures themselves.  

  **Can Convergence Replace Fidelity in Cumulative Adaptation?**  
  Yes, under specific conditions:  
  - **Ratchet Effect**: If novices reliably reconstruct *and improve* upon observed designs (e.g., via implicit trial-and-error), cumulative gains occur without copying fidelity. Finding 2 shows reconstruction but *not* improvement.  
  - **Requirements**:  
    - **Robust convergence**: Learners must reach the *same* optimum from diverse starting points.  
    - **Directed innovation**: Errors during reconstruction must be systematically biased toward improvements (e.g., physics constrains attempts toward efficiency).  
  - **Limitation**: Convergence alone cannot retain *arbitrary* improvements (e.g., symbolic decorations). Fidelity is needed for traits decoupled from functional constraints.  

  **Resolving the Vignette**  
  Critical evidence:  
  - **Novice vs. Field Variation**: If field populations retain *more* variants than novices produce (e.g., 60 procedures vs. novice 5), selection likely preserves low-reconstructibility variants.  
  - **Introduce Novel Variants**: Insert an inefficient but memorable procedure (e.g., rhythmic chanting while weaving). Rapid loss supports convergence; retention suggests transmission.  
  - **Measure Reconstruction Biases**: Test whether novices *improve* procedures when errors are permitted. Improvement implies ratcheting via convergence; stagnation implies fidelity-dependence.  

  **Conclusion**  
  The frequency shift (Finding 1) and novice convergence (Finding 2) are compatible with both hypotheses. Crucially, selection and convergence are entangled: reliable reconstruction reflects prior adaptive tuning of learning mechanisms. Cumulative adaptation requires either (a) high-fidelity copying to preserve non-reconstructible traits, or (b) reconstruction processes biased toward improvements. Discriminating these requires probing *which traits persist despite violating reconstruction constraints* and whether innovations build directionally.  

  ---

  ### **Marking Scheme** (Total: 20 points)  
  **A (18–20)**: Hits all must-hit points *and* integrates them to show how convergence/selection interact across timescales.  
  **B (15–17)**: Correctly distinguishes hypotheses but misses nuances (e.g., overlooks that convergence can enable ratcheting).  

  | **Points** | **Criterion**                                                                 | **Common Errors (Costs 1–2 pts each)**                                                                 |  
  |------------|-------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|  
  | **4**      | **Distinguishes selection vs. convergence** using testable criteria beyond frequency shifts. | Treats spread as proof of selection (0/4); claims convergence invalidates all selection (0/4).         |  
  | **4**      | **Argues convergence may be Darwinian** via prior selection on learning biases. | Treats convergence as purely non-Darwinian (0/4); fails to specify *what* was selected (e.g., biases vs. traits) (−2). |  
  | **4**      | **Evaluates if convergence substitutes for fidelity** in cumulative adaptation. | Assumes fidelity is *always* necessary (−2); claims convergence enables ratcheting without evidence (−2). |  
  | **4**      | **Proposes specific evidence** to resolve the vignette (e.g., novel variants, variation structure). | Vague proposals (e.g., "study learning" −3); ignores Finding 2 (−2).                                  |  
  | **4**      | **Precision**: Avoids conflation of levels (selection vs. transmission), adheres to definitions. | Calls "re-derivation" an *explanation* without probing its origin (−2); conflates individual/population dynamics (−1 per instance). |  

  **Deductions**:  
  - **−2**: Misdefining selection/convergence.  
  - **−1 per instance**: Imprecise language (e.g., "memes spread" without specifying fitness).  
  - **−3**: Ignoring the novice experiment (Finding 2).  

  ---

  ### **Rationale**  
  - **Why this works**:  
    - Forces engagement with your "crux" (convergence vs. selection + fidelity ratcheting).  
    - The vignette’s Finding 2 blocks stock "reconstruction kills memetics" responses. Novice convergence *could* support selection if biases are evolved.  
    - "Must-hit" points penalize canned answers (e.g., reciting meme theory = 0/4 on fidelity ratcheting).  
    - Model answer demonstrates how to *use* the vignette to test hypotheses, not just describe them.  
  - **Sharper edges**:  
    - Students *must* commit: Does convergence preclude selection? Can it replace fidelity? Vagueness costs marks.  
    - Wrong but clear answers (e.g., "convergence makes selection impossible") can score 8/20 if they hit other points.  
  - **Reusability**: No citations or temporal markers; hinges on timeless conceptual tensions.  

  Let me know if you'd like adjustments to the vignette or weighting of marking criteria.
