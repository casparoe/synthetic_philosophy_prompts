  For the question structure... I should make the vignette the centerpiece but add explicit prompts targeting each crux. The model answer will need to systematically dismantle false dichotomies while maintaining precision about selection mechanisms. The marking scheme must punish common errors like conflating spread with selection or treating convergence as a trump card.

  Notably, the user wants this literature-agnostic. That's wise - it tests conceptual mastery rather than name-dropping. The "sharply wrong but precise" preference suggests they value analytical rigor over safe, muddy answers. I'll design traps for shallow responses: e.g., a student might correctly note the lack of lineage data but fail to propose alternative detection methods.

  Biggest pitfalls to flag in marking: 
  - Equating population-level change (finding 1) with selection (ignoring drift/convergence)
