prompt: |-
  I've followed the meta-science reform movement for years — preregistration, registered reports, multi-lab replications, adversarial collaborations, the campaign against p-hacking and the garden of forking paths — and its epistemology keeps pulling in two directions at once. Its rhetoric is falsificationist: preregister a risky prediction, run the test, and if the effect isn't there, it isn't there. But the practice isn't: when a famous effect like ego depletion fails to replicate, essentially nobody abandons the programme it came from. The standard reply is that the replication missed a hidden moderator, or didn't faithfully reproduce the original protocol, or sampled a different population — and the reformers' own response is to demand an even more rigorous test rather than to write the programme off. There's a second oddity: the same movement insists that no single study is decisive (that's the whole argument for replications and meta-analyses) while treating this particular failure as decisive enough to warrant a crisis.

  So what methodology does the practice actually presuppose? Is it naive falsificationism with better statistics bolted on, or is it, despite the "test your theory" talk, Lakatos's sophisticated falsificationism — the unit of appraisal being the research programme, the hard core insulated by a negative heuristic, and the question not whether some test failed but whether successive versions keep predicting novel facts instead of absorbing data after the fact?

  Here's the part I can't settle. Suppose a funder took Lakatos seriously and built a scorecard: programmes commit in advance to dated novel predictions, and are graded on whether their later versions predicted facts they weren't built to explain. Two problems. First, if preregistration becomes universal, then every prediction precedes its data — so does Lakatos's novelty criterion go trivial and take the progressive/degenerating distinction down with it? Doesn't the criterion need some notion of what the programme's own resources can accommodate, so that a belt flexible enough to absorb anything is degenerating regardless of timing? Second, Lakatos's own position seems to be that degeneration is only legible retrospectively: from inside a programme you can't tell whether hidden moderators are the protective belt working as designed or the programme decaying. If so, what could such a scorecard deliver in real time? And is the movement's demand for decisive single tests then incoherent on its own terms, or a sensible institutional workaround for an appraisal nobody can perform from the inside?

  Please also separate what the practice strictly presupposes from what it merely fits well with: which rival methodologies — Bayesian evidence-accumulation, Kuhnian normal science, straightforward verificationism — would license exactly these reforms, and where is the practice genuinely underdetermined, so that several theories would each justify it? Finally, if we dropped the pretense of decisive tests and appraised programmes instead, what would actually have to change in how journals, funders, and hiring committees operate?

  End with a single machine-readable line: \answer{X}, where X is one of naive-falsificationist, lakatosian, bayesian-evidentialist, kuhnian, underdetermined.
reasoning: |-
  Okay, I need to analyze this user's deep query about the meta-science reform movement. They're pointing out a tension between the falsificationist rhetoric and the actual practice where failed replications don't kill research programs. The user is clearly well-versed in philosophy of science, referencing Lakatos, Kuhn, and Bayesian approaches.  

  First, let's unpack that core tension. The reformers talk like Popperians—preregister risky predictions, falsify theories. But when replications fail (like ego depletion), researchers don't abandon ship; they invoke moderators or methodological differences. Even reformers respond by demanding better tests, not discarding programs. That mismatch suggests the underlying epistemology isn't naive falsification.  

  The user's Lakatosian framing feels right. Research programs have a "hard core" (e.g., "willpower is a limited resource" for ego depletion) protected by auxiliary hypotheses (the "protective belt"). Failed predictions trigger belt adjustments, not core abandonment. This explains why replication failures rarely end programs—they're seen as belt issues, not core falsifications.  

  Now, the user's proposed Lakatosian scorecard has two snags:  
  - If every prediction is preregistered, *all* novel predictions become "temporally novel," trivializing Lakatos's criterion. But Lakatos cared about *heuristic novelty*—predictions that stretch the program's existing framework. Preregistration doesn't solve that; a program could still make trivial predictions.  
  - Degeneration is retrospective. From inside a program, adding moderators looks like productive belt-tuning; only later might it seem ad hoc. A real-time scorecard would struggle with this ambiguity.  

  So the practice better fits Lakatos than Popper. But what about alternatives?  
  - **Bayesian**: Updates beliefs incrementally. Preregistration combats p-hacking but doesn't demand decisive falsification. Replications shift credibility gradually. Fits the "no single study is decisive" stance.  
  - **Kuhnian**: Normal science solves puzzles within paradigms. Replications check robustness; failed ones are anomalies resolved by paradigm tweaks. But Kuhnian crises require wholesale paradigm shifts, which meta-reforms don't trigger.  
  - **Verificationism**: Focuses on confirming predictions. Reforms like registered reports emphasize confirmatory over exploratory work. But this clashes with the falsificationist *rhetoric*.  

  The practice is *underdetermined* between Lakatosian and Bayesian views. Both explain:  
  - Why programs persist after failed replications (protecting core/updating priors slowly)  
  - Why reformers demand more tests (assessing program progressivity/accumulating evidence)  

  But naive falsificationism is inconsistent with the practice, and Kuhnianism doesn't fully justify the replication-centric crisis narrative.  

  For institutional changes: If we appraised programs instead of single studies, journals would prioritize registered reports tracking programmatic predictions (not just one-off replications). Funders would fund program portfolios with clear heuristic value. Hiring committees would evaluate researchers' contributions to progressive programs.  

  The key is recognizing that the movement's *practice* tolerates theoretical persistence post-failure—which only Lakatosian and Bayesian frameworks license. Since Bayesianism doesn't require novel predictions while Lakatos does, and the reforms push for predictive rigor, Lakatosianism fits slightly better. But the underdetermination remains.  

  \answer{lakatosian} though with strong Bayesian parallels.
answer: |-
  The meta-science reform movement's practice aligns most closely with **Lakatos's sophisticated falsificationism**, though it is underdetermined in key respects and bears Bayesian parallels. Below, I address your core questions systematically, separating methodological presuppositions, underdetermination, and institutional implications.

  ### 1. **What Methodology Does the Practice Presuppose?**
     - **Falsificationist rhetoric vs. Lakatosian practice**:  
       The rhetoric emphasizes naive falsification (Popper: test risky predictions, discard falsified theories). However, the *practice*—where failed replications (e.g., ego depletion) trigger searches for moderators or methodological flaws instead of theory abandonment—mirrors Lakatos's model. Research programs (e.g., ego depletion theory) protect their "hard core" (e.g., "willpower is a limited resource") via a "protective belt" of auxiliary hypotheses (e.g., moderators like task type or population traits). Failed tests adjust the belt, not the core. Reforms demanding "more rigorous tests" post-failure reflect Lakatos's emphasis on whether a program *progresses* by predicting novel facts, not whether it survives a single test.
     - **The replication crisis tension**:  
       Treating a single replication failure as a "crisis" is consistent with Lakatos. For Lakatos, a degenerating program (one that only accommodates existing data post-hoc) risks abandonment, but this judgment requires multiple failures. The movement's crisis framing highlights when repeated anomalies threaten a program’s progressivity—not that one test is decisive.

  ### 2. **Problems with a Lakatosian "Scorecard"**
     - **Novelty trivialization under universal preregistration**:  
       If all predictions are preregistered, *temporal* novelty (predicting data before collection) becomes universal. But Lakatos requires *heuristic novelty*: predictions must stretch the program’s existing resources, exposing it to new risks. A degenerating program might preregister trivial or post-hoc-flexible predictions (e.g., "ego depletion occurs except when X, Y, Z"). The scorecard must thus assess *heuristic* novelty—whether predictions are theoretically bold—not just timing. Degeneration occurs when predictions are ad hoc (explaining known data) or lack ingenuity.
     - **Retrospective appraisal**:  
       Lakatos insists degeneration is only visible in hindsight. In real time, a scorecard could track:
       - **Progressive indicators**: Does the program generate novel predictions (beyond current data)? Do later studies succeed without ad hoc adjustments?
       - **Degenerative signals**: Are moderators consistently invoked post-failure? Do predictions become narrower or less testable?  
       However, real-time appraisal remains provisional. A scorecard might flag *suspected* degeneration but cannot confirm it until the program’s trajectory is clear.

  ### 3. **Incoherence or Workaround?**
     The demand for "decisive single tests" is **incoherent on Lakatosian grounds** but serves as a pragmatic **institutional workaround**. Lakatos rejects single-study decisiveness; programs evolve through series of tests. Yet reformers use replication failures as *catalysts* for collective scrutiny precisely because waiting for retrospective appraisal is impractical. It forces programs to defend their progressivity, mimicking Lakatosian appraisal in real time.

  ### 4. **Underdetermination and Rival Methodologies**
     The practice is compatible with multiple frameworks but *strictly presupposes* Lakatosian structure due to its tolerance for theory persistence. Rival justifications:
     - **Bayesian evidence-accumulation**:  
       Preregistration reduces biased data analysis; replications update priors gradually. Fits "no single study is decisive" but struggles to explain crisis rhetoric (Bayesian updates rarely warrant "crisis"). Explains persistent theory tweaks (moderators adjust likelihoods).
     - **Kuhnian normal science**:  
       Replications are puzzle-solving; failed replications are anomalies resolved within the paradigm. However, Kuhnian crises demand paradigm shifts, while meta-reforms seek programmatic progress within frameworks.
     - **Verificationism**:  
       Emphasis on confirmatory studies aligns with seeking positive evidence, but contradicts falsificationist rhetoric.
     - **Underdetermined aspects**:  
       - Whether failed replications *must* trigger program abandonment (Lakatos: no; naive falsification: yes).  
       - The threshold for declaring a "crisis" (Lakatos: retrospective; Bayesian: continuous).  
       Practice is underdetermined between Lakatos and Bayesianism but inconsistent with naive falsification.

  ### 5. **Institutional Changes for Programmatic Appraisal**
     If journals, funders, and hiring committees appraised research programs (not single studies):
     - **Journals**: Prioritize Registered Reports for programmatic predictions (not one-off studies). Publish replication outcomes as "program updates." Mandate updates on heuristic novelty (e.g., "did this test risk falsifying core assumptions?").
     - **Funders**: Allocate grants for program portfolios (e.g., 5-year trajectories) with milestones for novel predictions. Defund programs with consistent degenerative signals (e.g., post-hoc moderators without novel predictions).
     - **Hiring/tenure committees**: Evaluate researchers on contributions to program progressivity (e.g., successful novel predictions, replications, meta-analyses) over publication counts. Reward adversarial collaborations.

  ### Final Assessment
  The practice is fundamentally **Lakatosian** but underdetermined with Bayesian evidentialism. It rejects naive falsification by preserving cores post-failure and Kuhnian rupture by seeking incremental progress. The scorecard’s viability hinges on defining heuristic novelty and accepting retrospective uncertainty.

  \answer{lakatosian}
