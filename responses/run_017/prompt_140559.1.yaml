prompt: |-
  I'm retired now — thirty-odd years as a field ecologist, mostly alpine plant communities, and about four years ago I started going to a philosophy reading group down at the library, which is how I got talked into this. My old department has asked me to give a forty-five-minute session to this year's incoming PhD students in the autumn, and the brief they gave me was basically "tell them why they shouldn't trust p-values." Most of them will have had exactly one stats course and come out of it thinking a p-value is the probability the result was a fluke, or the probability the null hypothesis is true, and I don't think a slide of definitions will dislodge that. So: don't write the talk for me — I want a plan for the talk. What order do the pieces have to come in and what depends on what, given that I think the load-bearing distinction is between the probability of the data given the hypothesis and the probability of the hypothesis given the data, and that I want to get from there to the replication crisis without ever suggesting the crisis is mainly about fraud or sloppy people? And I need one example to carry the whole thing. My candidate is a colleague who swears his sourdough rises faster when he plays Bach to it — I like it because the prior is obviously low, the outcome is continuous rather than yes/no, and anybody can see how you'd keep checking the dough until it looked like a win. Is that the right example, or does it lack something that, say, a fertilizer trial on an alpine sedge would have? Please don't give me the disease-screening / mammography base-rate thing or Fisher's tea-tasting lady, they'll have seen both in their first-year notes and it'll feel like a rerun.

  The part I want most help with is the misconception map, because I've sat through enough of these to guess what goes wrong. I expect (a) the p-value-as-probability-the-null-is-true one, (b) the idea that if you peek at your data and stop when it looks good you've done something *dishonest* rather than something that quietly invalidates the number, (c) "just run more replicates and it fixes itself," and (d) the mirror-image error that the students will overcorrect into: that Bayesian methods would have saved us, as if priors can't be tuned the same way stopping rules can. Where in the sequence do I head each of these off — before it forms, or after they've said it out loud? I also want to build toward something I've been chewing on myself and can't quite state cleanly: my suspicion is that even perfectly honest researchers who never peek and never hack will still produce a literature full of exaggerated effect sizes, purely because journals prefer surprising results and surprising results are the ones that happen to land far from the truth when the effect is real but small. I saw someone online call these magnitude and sign errors, which sounds right, but I don't want to lean on the name. I'd like the session to land there rather than land on "p-hacking is bad," and I'd like to know what has to be in place earlier for that point to feel inevitable instead of cynical. Oh — and there's one thing I can do live: every student has a laptop, and I can have them each simulate a fake experiment on a coin they know is fair and see how many of them get under 0.05 anyway. Where does that belong?

  Finally: give me one question to put to them at the last five minutes that would tell me whether the distinction actually landed rather than whether they memorized a phrase, one thing I should flatly refuse to explain at this level and say out loud that I'm refusing (I'm guessing likelihood vs. Bayesian proper, or maybe why priors are supposed to be subjective), and a line for the inevitable hand at minute forty asking "so should we just stop using p-values?" — because I honestly don't know what I think. Write the whole thing as continuous prose, please, the way you'd write an email to a friend: no headings, no bullet points, no bold, no tables.
reasoning: |-
  Okay, let's tackle this retired ecologist's request. He needs a talk plan for new PhD students about why not to trust p-values. The key is to avoid technical jargon and focus on the core misconception: confusing P(data|H0) with P(H0|data). 

  First, the sourdough example seems perfect. It's relatable, has a low prior probability, and demonstrates continuous data and optional stopping. It beats the alpine sedge trial because it's universally understandable and highlights researcher degrees of freedom in a humorous way. 

  For structure, I'll start with the coin flip simulation. Having students test a fair coin live will shock them when 1 in 5 get significant results. This visceral experience sets the stage better than any slide. 

  The misconception map needs careful sequencing:
  - After the coin flip, immediately address (a) by showing P(significant result | H0 true) ≠ P(H0 true | significant result)
  - Use sourdough to demonstrate (b) and (c) - show how peeking invalidates p-values while more replicates just hide the problem
  - Save (d) for last, using the publication bias point to show Bayesian methods aren't a magic solution

  The big idea - that honest researchers still produce exaggerated effects - should emerge naturally from the sourdough story. Show how stopping at "Bach works" creates magnitude errors, then extend this to journals preferring surprising results. 

  For the final question: "If you replicated my sourdough study and got p=0.04, what would you need to know to decide whether Bach actually helps?" This tests if they grasp the inverse probability fallacy. 

  I'll explicitly refuse to explain Bayesian computation versus likelihood approaches - it's a rabbit hole. When asked "should we stop using p-values?", I'll suggest they're diagnostic tools that require context, like a field ecologist's intuition about weather patterns. 

  The tone should be conversational but precise, like explaining to a colleague over coffee. No slides of definitions - make the misunderstandings unfold through examples they'll feel in their guts.
answer: |-
  Here’s how I’d structure your talk, step by step, weaving your sourdough example through the narrative while mapping misconceptions to their natural breaking points. The goal is to build the case that p-values are fragile *even when researchers act in good faith*, landing on publication bias as the silent engine of the replication crisis. No definitions-first; make them *feel* the cracks.

  **Start with the coin flip simulation, live (min 1–10).**  
  Have everyone flip a fair coin 20 times online, testing H₀: p(heads)=0.5. Ask who got p≤0.05. Roughly 1 in 20 will raise a hand. Point out: *None of you cheated. The null was true. Yet some got "significant" results.* This isn’t about fraud—it’s about probability. **Key point:** A p-value is *the probability of seeing data this extreme, assuming H₀ is true*. It is *not* the probability H₀ is true. The simulation makes this visceral. (Preempts misconception **a** by showing P(data|H₀) ≠ P(H₀|data).)

  **Introduce the sourdough experiment (min 10–25).**  
  Your colleague measures rise height after 1 hour, comparing Bach vs. silence. He checks every 5 minutes because "it feels done" at 55 min. He gets p=0.03. "Aha! Bach works!"  
  - *Why might this fool us?*  
    - **Low prior:** We know yeast lacks ears. The effect should be tiny or zero. Yet the p-value ignores this.  
    - **Continuous data + peeking:** He stopped when rise height *looked* good. If he’d waited 60 min, it might have been p=0.25. P-values assume a fixed sample size. Peeking isn’t dishonest—it’s intuitive! But it invalidates the p-value. (Attacks **b** head-on: peeking isn’t evil; it breaks the math.)  
    - **Replication won’t save this:** If he repeats it 10 times and publishes only the p=0.03 result (because "the others were flawed—my starter was tired!"), that’s not fraud. It’s human nature. Running "more replicates" just gives more chances to cherry-pick. (Preempts **c**: more data amplifies noise if methods are brittle.)  

  **Zoom out: Why does this create a literature of false positives? (min 25–35)**  
  - Imagine 100 researchers test silly hypotheses (Bach/sourdough, astrology/grades, etc.). By chance, ~5 get p≤0.05. Those are the ones who *write papers*. The 95 null results? They vanish ("boring"). Journals publish surprises.  
  - But here’s the subtle trap: **Even true effects get exaggerated.** Suppose Bach *slightly* warms the kitchen, speeding rise by 5%. Your colleague peeks, stops early at a fluky 15% effect (p=0.04). Published. Replicators find 4% (p=0.3). They call it a "failure"—but it’s *under*estimation. The true effect is buried. This is where "magnitude errors" and "sign errors" (for negative flukes) emerge. **The takeaway:** p-values select for noisy extremes, *independent of researcher intent*.  

  **Bayes isn’t a magic shield (min 35–40).**  
  - Yes, Bayes theorem gives P(hypothesis|data). But if you tune priors or hack the model, you’re back in the soup. A Bayesian stopping early or tweaking priors after seeing data is just as sunk as a frequentist. (Nips **d** in the bud: methods aren’t holy; behavior is the toxin.)  

  **Landing the plane: The replication crisis isn’t about liars (min 40–43).**  
  It’s about a system that rewards surprising findings, selecting for random high estimates (even when effects exist) and drowning true negatives in silence. P-values didn’t cause this—but their misunderstanding lets it thrive. They’re a fragile tool in a noisy, publication-hungry world.  

  **Your tools for the Q&A:**  
  - **Final question to test comprehension:**  
    *"If you replicate the sourdough study, get p=0.04, and I tell you 1,000 similar ‘music affects X’ experiments were run last year (most unpublished), why might your result still be misleading?"*  
    (Probes if they grasp base rates and selection bias > just p-values.)  
  - **What to refuse to explain:**  
    *"I won’t dive into subjective vs. objective Bayes or likelihood principles today—not because they’re unimportant, but because fixing p-value misuse doesn’t require swapping dogmas. It requires understanding how noise and incentives interact."*  
  - **Answer to "Should we stop using p-values?":**  
    *"No—but treat them like a geologist treating a cracked outcrop: probe their assumptions. Ask: ‘What prior might be reasonable? Could peeking or selection explain this?’ P-values are a *diagnostic* for weird data under H₀, not a verdict on truth. Pair them with effect sizes, confidence intervals, and a nose for context. And always ask: ‘If this were null, could it even get published?’"*  

  **Why sourdough works better than sedge fertilizer:**  
  - It’s funny (disarms tension).  
  - Low prior is intuitive (no stats needed to smell BS).  
  - Peeking feels natural (they’d do it too).  
  - Continuous data avoids the "significant/not" false dichotomy.  
  - Alpine sedge risks feeling like "real science," where priors might be argued. Sourdough’s absurdity shines a light on the *process*.  

  **Structure’s secret logic:**  
  Simulation → sourdough story → general publication dynamics. Each step forces a misconception to surface naturally, then shatters it with the next piece. By the time you hit magnitude errors, they’ve already seen them born in the sourdough. No cynicism needed—just probability plus human incentives.  

  You’ve got this. They’ll remember the dough long after the definitions fade.
