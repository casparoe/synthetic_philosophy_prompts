prompt: |-
  hey — I run a tiny podcast for my school's debate club (we record in the library after practice, it's on spotify, like 40 people listen lol) and next week we're having on a moral philosopher who defends patriotism as a real virtue and not just a useful myth. her version of it goes roughly like this: the state coerces you, and it coerces your compatriots, the law is made in your name and enforced against you and them together, and that shared subjection to one coercive legal order is what grounds the special duties you owe to compatriots and don't owe to people abroad. patriotism is then the emotional/identity/motivational side of those duties, and without it a country can't sustain the institutions that actually do the just thing. i've read one of her papers and i kind of get the shape of it, but i really dont want an episode where she just restates her own view for forty minutes — and from what i've seen she answers every ugly case with "that's nationalism, not patriotism," which feels like a get out of jail free card.

  so: write me eight interview questions for her. i want at least one pressing the scope objection — why does the loyalty stop at the border, when borders were mostly drawn by wars and treaties, and why does it attach to the state rather than to the city, the continent, or the world, or honestly to my school district, which also coerces me? i want a short run of questions where each one makes the "that's nationalism" move harder to reach for, ending with a case where the patriotism/nationalism distinction seems to be doing no work at all. i want one on whether the virtue essentially involves being ready to die and to kill for compatriots at the expense of foreigners, and one on what her view says to someone the state has treated really badly (my friend's family has been fighting with immigration for years and she is not exactly overflowing with patriotic feeling — i'd like a question that uses something like that without being corny). i also want her to react to an idea i came up with: call it "tenant patriotism" — you didn't build the country and you can't easily leave it, so the attachment isn't gratitude for a gift, it's more like being stuck maintaining a building you inherited, and the duty is custodial and future-directed rather than thankful. does that fit her account, or does it quietly turn patriotism into something closer to what her critics want? and one more on whether patriotism can be excessive on her own view — if her theory has no way to say "that's too much patriotism," is it really a virtue theory or is it just loyalty with nicer packaging?

  for each question, guess the answer she's most likely to give and write the follow-up that's keyed to that specific answer, not a generic "how would you respond to that?" keep the questions things a real person could answer out loud. and please commit instead of hedging: at the end pick the three you'd actually keep at the top of the list and name the single question you think could genuinely make her revise something in the view, with your reasons — i don't want a menu of possible angles for me to choose between, i want you to choose and tell me why. (if you think one of my questions is bad, say that too, but say it definately rather than sitting on the fence.)
reasoning: |-
  Okay, let me tackle this podcast host's request. They run a small debate club podcast and need sharp questions for a philosopher defending patriotism as virtue. The host wants specific angles: scope objections, nationalism vs patriotism distinction problems, and hard cases like immigration struggles. 

  First, I'm noting their core frustration - the guest keeps dismissing critiques as "that's nationalism, not patriotism." That's clearly the main pain point. The host also wants to test their own "tenant patriotism" idea and see if the theory can flag excessive patriotism.

  Hmm, the scope question seems crucial - why stop at borders when coercion happens at multiple levels? I imagine this could reveal if the theory's boundaries are arbitrary. For the nationalism trap, building a chain where the final case (like deporting neighbor families) makes the distinction collapse feels powerful. 

  The immigration question needs care - can't be corny but must challenge the theory's real-world applicability. Maybe framing it as "can your patriotism virtue exist without reciprocal state care?" That cuts to the core. Their tenant idea is actually sophisticated - it reframes duty as custodial rather than grateful. Wonder if the guest would see that as compatible or subversive.

  For excess patriotism, if the theorist can't define "too much," that's a problem for calling it a virtue. Should push that hard. 

  Now selecting top three: 
  - The deportation case question because it forces the nationalism/patriotism distinction to fail under pressure. 
  - The immigration reciprocity question - it confronts the theory with lived injustice. 
  - The scope question - it undermines the state-level focus. 

  The deportation question has most revision potential - when compatriots become perpetrators, her framework might genuinely struggle. Would make her confront whether shared coercion can ground loyalty when it enables harm. 

  Rejecting the "kill/die" question as the host suggested - it's too extreme and lets her retreat to "duty to reform." Better to focus on systemic harm cases. 

  Follow-ups must anticipate her moves. If she calls something nationalism, next question should present a patriot doing identical harm for "compatriot welfare." Trap should snap shut step by step.
answer: |-
  Here are eight focused interview questions with predicted answers and surgical follow-ups, plus my definitive picks for your top three and the most potent question:

  ### Core Questions
  1. **Scope: Borders & Levels**  
     *"You ground patriotic duties in shared subjection to state coercion. But my school district also coerces me alongside neighbors—why doesn't that create 'school district patriotism'? And since borders were drawn by violence or chance, why do duties stop there rather than extending to all coerced people globally?"*  
     **Predicted Answer:** "Local institutions lack sovereignty—only states make comprehensive claims on our lives. Borders are imperfect but necessary for meaningful community."  
     **Follow-Up:** "But if a 'Global State' emerged coercing everyone equally, would patriotism vanish? Or is the *particularism* of your theory doing hidden work?"  

  2. **Nationalism Trap (Part 1: Policy Sacrifice)**  
     *"Imagine patriotically supporting a policy that harms foreigners but benefits compatriots—say, tariffs saving local jobs while causing famine abroad. Is that still patriotism?"*  
     **Predicted Answer:** "Patriotism demands *just* institutions. Exploiting outsiders violates that—it’s nationalism."  
     **Follow-Up:** "What if voters believe tariffs *are* just—compatriots simply come first? Isn’t 'justice' here defined by loyalty?"  

  3. **Nationalism Trap (Part 2: Symbolic Violence)**  
     *"A mob tears down a foreign-owned store shouting 'Protect Our Community!' but genuinely believes this secures locals' livelihoods. Patriotism or nationalism?"*  
     **Predicted Answer:** "Vigilantism isn’t institutional—so neither. True patriotism works through lawful channels."  
     **Follow-Up:** "But if the state later legalizes such seizures, does their *patriotism* retroactively activate? Does virtue depend on state approval?"  

  4. **Nationalism Trap (Finale: The Distinction Collapses)**  
     *"A state deports resident families to free up housing for 'core compatriots,' citing shared sacrifice for national stability. They see this as patriotic institution-building. How is your distinction anything but semantic here?"*  
     **Predicted Answer:** "Targeting vulnerable residents perverts justice—it’s nationalist scapegoating."  
     **Follow-Up:** **"But they claim it’s *for* compatriots subject to the same coercive system. If patriotism is loyalty to coerced peers *through* the state, why isn’t this the pinnacle of your theory?"**  

  5. **Sacrifice: Killing/Dying**  
     *"Does patriotism require willingness to kill foreigners or die for compatriots? If a soldier refuses an unjust war, are they failing as a patriot?"*  
     **Predicted Answer:** "Patriotism demands reforming institutions, not blind obedience. Refusing *unjust* orders honors the virtue."  
     **Follow-Up:** "But if the state legally defines the war as just, and compatriots demand it, doesn’t your framework brand the refuser *disloyal* to the shared project?"  

  6. **The Wronged Subject (Immigration Case)**  
     *"My friend’s family faces deportation after years fighting the system. The state coerced them *differently*—does your theory expect their patriotism? Or does it only bind those the state treats well?"*  
     **Predicted Answer:** "Patriotism includes holding institutions accountable. Her struggle *is* civic engagement."  
     **Follow-Up:** **"But she feels zero loyalty—only resentment. If your virtue *requires* affection, isn’t it functionally a privilege for the state’s favorites?"**  

  7. **"Tenant Patriotism" Challenge**  
     *"I’ve wondered if patriotism is less 'gratitude for a gift' and more 'custodial duty'—like maintaining a building you inherited but didn’t choose. Does this 'tenant patriotism' fit your view, or turn it into generic justice-seeking?"*  
     **Predicted Answer:** "It’s compatible! Stewardship is how we honor our shared coercive inheritance."  
     **Follow-Up:** **"Then why call it *patriotism*? If it’s just future-focused duty to fix coercion, why not address global injustice instead of privileging compatriots?"**  

  8. **Excess & Virtue**  
     *"Can one be *too* patriotic on your account? If someone prioritizes compatriots’ welfare maximally—say, opposing all foreign aid—is that excessive? If not, how is this a *virtue* and not tribal loyalty?"*  
     **Predicted Answer:** "Yes—if it undermines just institutions or ignores extraterritorial obligations."  
     **Follow-Up:** **"But if justice permits significant partiality to compatriots (as you argue), what *specific* patriotic act would your theory condemn as 'excessive'?"**  

  ---

  ### **My Definitive Selections**  
  **Top 3 Questions to Lead With:**  
  1. **Question 4 (Deportation Case)**  
     *Why:* Forces the nationalism/patriotism distinction to collapse under moral pressure. She can’t dodge by labeling actions "non-patriotic"—the perpetrators embody her theory’s logic.  
  2. **Question 6 (Immersion Reciprocity)**  
     *Why:* Exposes the theory’s failure to bind those harmed by the state. If patriotism requires affection but the state offers only cruelty, it’s not a virtue—it’s gaslighting.  
  3. **Question 8 (Excess Test)**  
     *Why:* Reveals whether "patriotism" has independent moral content. If no act is "too patriotic," it’s loyalty repackaged.  

  **Single Most Revision-Forcing Question: Question 4 (Deportation Case)**  
  *Why it could shift her view:* It confronts her with compatriots weaponizing "shared subjection" to persecute others *within* the coercive framework. If patriotism doesn’t condemn this—or worse, excuses it—her virtue enables oppression. She must either:  
  - Deny these actors are patriots (exposing circularity: "patriots are just people who act justly"),  
  - Condemn them (admitting patriotism requires *external* moral limits), or  
  - Defend their actions (exposing the theory’s moral bankruptcy).  

  **Critique of Your Request:**  
  I reject including a "kill/die" question **(Question 5)** as you suggested. It’s *too easy* for her: she’ll retreat to "duty to reform institutions," dodging the lethality of state power. Focus on systemic harm (Questions 4 & 6) instead of individual sacrifice.  

  **Execution Tip:**  
  After her answer to **Question 4**, pause and say: *"I’m struck that your theory might *require* calling those deporters patriots. Shouldn’t a virtue condemn that?"* Force her to sit in the tension.  

  Go puncture that "nationalism vs. patriotism" escape hatch.
