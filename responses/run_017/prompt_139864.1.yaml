answer: |-
  ## The Answerability Condition: A Defense

  As a philosopher of language committed to excavating the normative bedrock of communication, I find the standard intentionalist-conventionalist accounts of illocutionary acts profoundly incomplete. They capture the *form* but miss the *substance* of acts like promising, warning, or resigning. The **Answerability Condition** corrects this by asserting that the very existence of an illocutionary act hinges not merely on a speaker’s utterance, intentions, or conventional context, but on the emergence of a specific normative relation: the speaker becoming *answerable to* a second party. Let me steelman this thesis before arguing for it.

  **Steelman: The Core of Answerability**

  Being answerable to someone (the "second party") means:
  1.  **Obligation to Account:** The speaker incurs an obligation to justify, explain, or defend the performance of the act *to* that party, should the occasion arise.
  2.  **Entitlement to Hold:** The second party gains a normative standing (an entitlement, not just a psychological impulse) to demand such accounting, to rely on the act’s performance, to assert its consequences, and to hold the speaker responsible for fulfilling its inherent commitments (like keeping a promise, heeding a warning’s content, or accepting a resignation).
  3.  **Mutual Recognition (Implicit or Explicit):** This relation requires that the second party *can*, in principle, function in this normative role. This doesn't necessarily require conscious recognition *at the moment* (though it often involves it), but it does require that the speaker’s act successfully *addresses* a party positioned to occupy this role and that the context enables the relation's potential activation. It rules out situations where the purported act is directed into a void where no such normative counterpart exists or can exist.

  *Contrast with Mere Recognition:* Recognition theories (e.g., Strawson-inspired views) say an illocutionary act succeeds if the hearer correctly identifies the speaker's intended force. This is insufficient. Recognition might be a frequent *catalyst* for answerability, but it is not the *constitutive element*. One can recognize an intended promise without feeling entitled to hold the promisor to account (e.g., hearing a clearly insincere or absurd promise). Conversely, answerability can potentially arise without explicit contemporaneous recognition (as I'll argue). The recognition view focuses on a cognitive event in the hearer; the Answerability Condition focuses on the *normative status* created *between* speaker and hearer. Mere recognition leaves the binding, commitment-creating nature of illocution unexplained; it treats illocution as an intention successfully broadcast, not as the creation of a deontic bond.

  **Three Independent Arguments**

  1.  **The Argument from Performative Contradiction & Normative Incoherence:** Try sincerely to *deny* the answerability inherent in your own illocutionary act. "I promise to help, but I am not answerable to you for doing so." "I resign, but you have no standing to treat me as resigned." "I warn you, but you cannot rely on this warning or hold me responsible if it's wrong." These are not just lies; they are *performatively incoherent*. The very act one purports to perform *requires* the normative relation one simultaneously denies. This incoherence demonstrates that answerability isn't an optional consequence; it's the necessary framework *within which* the illocutionary act makes sense. The act’s constitutive rules *logically entail* this relation. Intentions and conventions enable the attempt, but only the actualization of this normative relation *is* the act. *(A sceptic might accept this by considering that such denials feel like taking back the act itself, not just adding a caveat.)*

  2.  **The Argument from the Structure of Commitment:** Illocutionary acts create commitments (obligations, entitlements, changes in normative status). But a commitment requires a *commitment-to*. A commitment existing only for the committer, with no possible claimant, is no commitment at all; it’s a private resolution. Promising inherently commits *to* the promisee; warning inherently commits *to* the warrantee regarding the truth/relevance of the warning; resigning inherently commits *to* the relevant authority to cease treating one as employed. The "to" is essential. Intentions and conventions define *what kind* of commitment the speaker *aims* to create. However, the commitment only materializes when the speaker becomes liable *to* the specific party whose normative position is altered by the act. The commitment *is* the answerability relation. *(A sceptic might be moved by considering that "commitment" language loses its core social, binding meaning without a counterparty.)*

  3.  **The Argument from Failure Modes:** Standard views struggle to explain *why* certain genuine failures occur. Consider a speaker uttering "I promise" with perfect intentions and conventions, but *to a brick wall*, or *in a language no one present understands*, or *to someone they know cannot comprehend speech*. Intentionalists might say the intention was thwarted; conventionalists might cite missing contextual conventions. But both struggle to explain the *specific* failure: not that an act was performed poorly, but that *no act of promising occurred at all*. The Answerability Condition explains this cleanly: no second party exists or is addressed in a way that could ground the requisite normative relation. The failure is fundamental, not circumstantial. It also explains why misfires due to lack of authority (e.g., a child "firing" an employee) and misfires due to lack of uptake (e.g., unread resignation) share a deep structure: both lack the necessary condition for the normative relation to crystallize (incapacity of the counterparty or failure to engage them). *(A sceptic should concede that the brick wall case feels different from a merely insincere promise; the former seems void, the latter performed but bad – the Answerability Condition captures this distinction.)*

  **Confronting the Hard Cases**

  *   **The Unread Resignation:** The email to the auto-replying manager, the statement to the sleeping manager, the noticeboard note: **No resignation has occurred in any case.** While the speaker *attempted* resignation with correct words, intentions, and arguably conventions (email as valid channel, noticeboard as posting place), the critical element is missing: the manager (or relevant authority) has not been engaged as a counterparty who *can* hold the speaker to the resignation, accept it, or begin acting on its consequences. The speaker is not answerable *to them* for having resigned, because the act hasn't normatively registered with the party to whom one resigns. The utterance remains an attempt until the normative relation is established (e.g., when the email is read, the sleeper awakens and hears, or the notice is seen). That the verdict is the same throughout is a strength, showing the condition consistently tracks the emergence of the normative bond, regardless of the channel's technical propriety if unused.

  *   **The Deathbed Promise:** **No promise was made.** The intuition that "he promised" is strong but misleading. We conflate the speaker's *intention* to promise, his *expression* of commitment (which is morally significant), and the *completed act* of promising. All conditions *internal to the speaker* are met. But the dying friend, being unresponsive and never regaining consciousness, *cannot* become the promisee in the normative sense. They cannot hold the speaker accountable, release them, or rely on the promise. The speaker incurs no obligation *to the friend*. He might incur a powerful *moral* obligation based on his expressed intent, perhaps *to* the person he promised to look after, or to his own conscience. But the *illocutionary act* "promise to [friend]" requires that friend as the normative counterparty. Without that relation crystallizing, it remains a deeply felt *attempt* or *expression*, not a completed promise *to the dying person*. We are misled by the speaker's sincerity and the gravity of the situation into granting the act a status it normatively lacks.

  *   **Mis-Uptake:** The view shines here. **The act performed is the one defined by the answerability relation that *actually* crystallizes, not the one intended.**
      *   *Driver/Warning as Threat:* The speaker intended a warning, creating potential answerability regarding the bridge's status. The hearer took it as a threat, creating a perceived relation where the speaker is answerable for menacing intent. Crucially, *if* the hearer acts on this perceived threat (e.g., reports it, alters behavior defensively), the speaker *becomes* answerable to them *for making a threat* – the normative relation that materializes is one of threat-answerability. The intended warning failed to materialize as an illocution because the necessary relation (reliance on information) didn't form with the hearer; a different relation (liability for intimidation) did. The act *performed* is the threat, because that's the relation in force.
      *   *Unheard Refusal:* If the refusal is genuinely unheard/unregistered (not merely ignored or disbelieved), **no refusal occurred.** The speaker attempted a refusal, but the normative relation – where the refusee is entitled to treat the speaker's stance as a definitive "no" and adjust their expectations/actions accordingly – fails to materialize because the counterparty wasn't engaged. If it's heard but disbelieved, a refusal *was* performed (the speaker is answerable for saying "no"), but it may be ineffective perlocutionarily. This explanation is a gain because it doesn't just redescribe the data; it *explains why* mis-uptake changes the act or voids it – by tracking the *actual normative reality* created between the parties, which is the essence of illocution.

  *   **Promises to No One:**
      *   *New Year's Resolution to Self:* **Not an illocutionary promise.** It creates no answerability *to another*. It's a vow or commitment to oneself, governed by personal morality/prudence, not interpersonal norms. One can be "answerable" to oneself, but this is a metaphorical extension of the core interpersonal concept, not an instance of it.
      *   *Graveside Promise:* **Not an illocutionary promise *to the deceased*.** The deceased cannot be a normative counterparty. However, if uttered *in the presence of others* (even implicitly, like at a public graveside), or if the speaker later feels bound *in relation to* the deceased's memory *within a community* that recognizes such obligations (e.g., "I promised your father"), then answerability *to that community or to the living memory* might crystallize, making it a genuine, socially embedded promise *of a certain kind*. If truly solitary, it's akin to the resolution – a personal vow.
      *   *Proclamation to the World:* **Potentially an illocutionary act, but only if it successfully engages a relevant public *as* a counterparty.** A general promise ("I promise to lower taxes") creates answerability *to the electorate*; a declaration of war creates answerability *to the enemy state and the international community*. The "world" must functionally resolve into a body that can hold the speaker accountable. If it's a proclamation into the void with no audience or mechanism for accountability, it fails as an illocution.

  **Costs and Gains**

  *   **Misfires vs. Abuses:** The view unifies and clarifies. **Misfires** (e.g., resigning to a brick wall, marrying an already married person) are fundamental failures where the necessary normative relation *cannot* come into existence (no counterparty, counterparty incapable of the role). **Abuses** (e.g., insincere promise) occur when the normative relation *is* successfully established (the speaker *is* answerable to the promisee), but the speaker violates the commitments inherent in that relation (e.g., not intending to fulfill it). The insincere promise is *not* the easy case; it's complex. The speaker *does* perform the illocution (creating answerability) but simultaneously violates its sincerity condition, making it defective (a "hollow" act) and exposing them to charges of bad faith *within* the normative relation they created. The cost is collapsing *some* standard uptake failures into the misfire category (like unread resignation), but the gain is a unified account of *all* fundamental illocutionary failure: the absence of the constitutive normative relation.
  *   **Illocutionary vs. Perlocutionary:** The contrast sharpens. **Illocutionary** acts are the *successful creation of a normative relation* (answerability) via utterance. **Perlocutionary** acts are the *causal consequences* (intended or unintended) that flow from the utterance, *whether or not* an illocution occurred (e.g., frightening someone via a threat-illocution, or via a misheard warning). The illocution is the normative "bite"; the perlocution is the downstream effect. Nothing illocutionary becomes perlocutionary; the distinction becomes cleaner by grounding illocution in normativity rather than intention-plus-effect.
  *   **The Costly Trade:** The most entrenched commitment we must abandon is the **primacy of speaker intention and convention as sufficient for illocutionary success**. Austin, while noting misfires, largely anchored illocution in the speaker's doing something *in* saying something, governed by conventions. The Answerability Condition says that even with perfect intentions and conventions, illocution fails if the normative relation doesn't materialize with a second party. We trade the comforting idea that illocution is largely under the speaker’s control for a more socially embedded, normatively robust view where language truly binds us *to each other*.

  **Conclusion**

  The Answerability Condition is demanding. It declares void many acts we colloquially describe as promises or resignations. Yet, this is its strength. It reveals the core of illocution: not an intention broadcast, not a convention enacted, but the forging of a deontic bond between individuals. It explains why language has the power to obligate, entitle, and change our normative standing – because it creates relations of mutual answerability. While counterintuitive in isolated cases, it provides a unified, powerful framework for understanding how words create social reality. The cost of demoting speaker-centric control is outweighed by the gain of grounding language’s normative force in the relational fabric of human interaction. Illocutionary acts exist not in the speaker's mind or mouth, but in the space *between* people, defined by mutual accountability.
