  First, I need to understand their main points: pain asymbolia cases where people feel pain but aren't bothered, opioid examples where pain is present but doesn't matter, and a hypothetical "reverse asymbolia." Their claim is that badness comes from grip, not sensation. They want to handle objections without academic jargon.

