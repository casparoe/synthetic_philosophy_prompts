  The user needs a practical procedure that fits into their one-hour meetings. They want clear steps: questions in order, a way to test if a feature is relevant or just coincidental, and how to handle their registry of past cases. They often struggle to agree on whether differences between similar cases are meaningful or just noise. The procedure must indicate when no answer exists, which steps are judgment calls disguised as steps, and what to write on the form when there's no generalizable rationale. They prefer to flag this instead of inventing a rationale. They also need to know which parts of the theory are essential and which can be skipped without turning the process into a superficial checklist.

  They also want the procedure applied to three specific cases: a family insisting on futile ICU treatment, a case nearly identical to a previous one but without family presence, and a patient with a history of violence toward staff. They want at least one case to result in an outcome they might not like, and they want clarity on the procedure's limitations.

  I need to address their concerns about particularism. They need a structured approach that balances the uniqueness of each case with the requirement for a generalizable rationale. The key is to focus on the context-sensitive application of values rather than universal rules. The procedure should help them identify the relevant moral reasons in each case and test whether they can form a rationale that acknowledges context.

  For the procedure steps, I consider starting with case framing, then mapping stakeholders and interests. Next, identifying moral features and testing their relevance using the "but-for" test. Then, the "holism stress test" to see if features change valence. Constructing the rationale involves either a narrow principle or a specific conflict resolution. The sign-off step includes documenting if no rationale is possible.

  The user's deeper needs include maintaining integrity in their ethics process while meeting accreditation requirements. They likely want to avoid oversimplifying complex cases and resist inventing rationales. They might also need to train their committee on this new approach and ensure buy-in. The procedure must be efficient enough for one-hour meetings but robust enough to handle ethical complexity.

  Applying this to their three cases: For the futile ICU case, the rationale might center on process over outcome, which could disappoint those wanting a futility declaration. The near-twin case highlights how the absence of family shifts the surrogate decision-making process. The violent patient case shows how safety features are context-dependent, not universally applicable. Each application demonstrates the procedure's ability to handle particularism while generating defensible rationales.

  Limitations include the one-hour constraint, reliance on committee judgment, and the inability to force consensus on close calls. The procedure won't produce universal rules but will document context-sensitive rationales or transparently flag when none exists. This meets accreditation needs without compromising ethical rigor.
answer: |-
  Here's a practical procedure grounded in particularism and holism, designed for your 1-hour meeting constraint, explicitly highlighting its limitations and judgment points. It focuses on *identifying the salient moral features and their context-specific weights* to generate a defensible rationale (or flag when one isn't possible).

  **Core Philosophy:** We seek a *contextual*, *action-guiding* principle, not a universal rule. The rationale describes *why these reasons mattered most here*, acknowledging this constellation might be rare.

  **The Procedure: "The Contextual Reason Mapping (CRM) Protocol"**

  1.  **Frame the Core Conflict (5 mins):**
      *   **Question:** "What is the *specific, practical decision* facing the clinical team (e.g., 'Should we continue life-sustaining treatment against medical advice?', 'Who is the appropriate surrogate for Patient X?', 'Can we restrict Y intervention due to safety concerns?')?"
      *   **Output:** A single, concrete "Yes/No" or "Option A/Option B" question. *Judgment Call:* Defining the precise conflict sets the stage. Avoid overly broad questions.
      *   **Can't-Drop:** Essential. Without a defined conflict, you can't map reasons *for* or *against* specific actions.

  2.  **Map Stakeholders & Core Interests (10 mins):**
      *   **Question:** "Whose core interests (well-being, autonomy, values, duties) are most directly impacted by *this specific decision*? What is each stakeholder's primary interest/claim *in this situation*?" (Patient, Family, Staff, Institution, Society).
      *   **Output:** A list of key stakeholders and their *specific* interest/claim relevant to *this decision*. (e.g., "Patient's interest in avoiding prolonged suffering"; "Family's interest in fulfilling cultural/religious duty"; "Staff's interest in safety from physical harm"; "Institution's duty to steward resources justly").
      *   **Judgment Call:** Identifying *which* interests are most salient and how they are framed.
      *   **Can't-Drop:** Prevents overlooking key perspectives. Holism means the *interaction* of these interests drives the reasons.

  3.  **Identify Candidate Moral Features & Initial Valence (15 mins):**
      *   **Question:** "What specific facts or features of *this case* seem morally relevant to the core conflict? For each feature, does it *prima facie* count *for* Option A, *for* Option B, or *against* one of them?" (e.g., "Prognosis <1% meaningful recovery" -> prima facie *against* continued aggressive treatment; "Patient's prior expressed wish 'no machines'" -> prima facie *for* limiting treatment; "Family's intense distress & belief in miracle" -> prima facie *for* continuing treatment short-term; "History of violence directed *at current treating nurse*" -> prima facie *for* modifying approach).
      *   **Output:** A brainstormed list of features with "+" (for Option A/Decision), "-" (against Option A/Decision), or "?" (ambiguous/context-dependent).
      *   **Judgment Call:** Initial valence assignment is highly interpretive.
      *   **Can't-Drop:** This is the raw data of particularism. Skipping this means you aren't engaging with the case's specifics.

  4.  **The "But-For" Relevance Test & Holism Stress Test (15 mins):**
      *   **Question 1 (But-For Test):** "If we *removed this specific feature* from the case (e.g., no family present, no violence history, different prognosis), holding *all else equal*, would the *weight* of the reasons supporting the decision likely change? Would the decision likely be different?"
      *   **Question 2 (Holism Stress Test):** "Could we imagine a case *identical in all other key respects* where this feature would have the *opposite* valence, or *no* valence? What specific contextual element makes it count *this way* here?"
      *   **Output:** Features marked "RELEVANT" (passed But-For Test) or "NOT RELEVANT/CONFOUNDER". For relevant features, a brief note on *why* it has this valence *here* (e.g., "Violence history relevant HERE because: target is *current* caregiver, recent incident, no mitigating factors like delirium"). Features failing But-For are noted as potential "noise" or confounding factors (e.g., "Family ethnicity - Not relevant per But-For test, decision unchanged if different ethnicity").
      *   **Judgment Call:** This is THE core judgment step. Agreeing on relevance and contextual valence is where debate happens. *Explicitly name disagreements here.*
      *   **Can't-Drop:** This step *is* particularism/holism in practice. Skipping it turns the list into a generic checklist. **Crucially, this step often reveals if a "generalizable rationale" is possible.**

  5.  **Construct the Articulable Rationale (or Flag Impossibility) (10 mins):**
      *   **Question:** "Based on the relevant features and *why they mattered here*, can we formulate a single sentence that captures the *primary reason(s)* guiding this specific decision, framed as a principle *contingent* on key contextual elements? If the holism stress test shows the constellation is too unique or reasons are incommensurable, do we flag 'No Generalizable Rationale'?"
      *   **Options:**
          *   **A. Contextual Principle:** "When [Specific Contextual Condition(s)], [Primary Value/Principle] prevails because [Key Reason/Interaction]." (Focus on *why* the balance tipped *here*).
          *   **B. Conflict Resolution Specificity:** "Resolved by prioritizing [Value A] over [Value B] *in this instance* due to the critical presence/absence of [Specific Contextual Feature(s)]."
          *   **C. Flag:** "No generalizable rationale identified; decision based on holistic weighing of unique constellation of factors including [List 2-3 key relevant features]."
      *   **Output:** The one-sentence rationale OR the "No Gen Rationale" flag. **Crucially:** If Option C is chosen, the *reasons* (from Step 4) are still documented in the consult notes; the "flag" is for the *rationale field*.
      *   **Judgment Call:** Wording the rationale is key. Does it accurately reflect the core reasons *and* their context-dependence? Is "No Gen Rationale" truly justified?
      *   **Can't-Drop:** This fulfills the accreditation requirement transparently. Forcing a false "principle" undermines integrity.

  6.  **Sign-Off & Document Caveats (5 mins):**
      *   **Action:** Committee signs off. **Explicitly document:**
          *   Which Step 4 features had significant disagreement on relevance/valence.
          *   That the rationale (if generated) is context-dependent per Steps 4 & 5.
          *   If "No Generalizable Rationale" is flagged, the justification for this conclusion.
      *   **Can't-Drop:** Transparency about limitations and disagreements is essential for ethical integrity and future review.

  **Applying CRM to Your Cases:**

  **Case 1: Futile ICU Treatment / Insistent Family**
  *   **Core Conflict:** Should life-sustaining treatment (LST) continue against the medical team's recommendation?
  *   **Key Features:** Prognosis (futility), Patient's prior wishes (unknown), Family's religious belief in miracle, Family's intense distress/conflict with team, Potential suffering.
  *   **But-For/Holism Tests:**
      *   **Prognosis:** RELEVANT. But-For: Change prognosis, decision changes. Holism: Prognosis alone isn't always decisive (e.g., if patient clearly wanted *any* chance). *Why here?* Prognosis is extreme (<1%), irreversible, involves suffering.
      *   **Family Belief/Distress:** RELEVANT. But-For: If family accepted prognosis, decision likely different. Holism: Beliefs don't *always* override futility (e.g., resource constraints). *Why here?* Intensity, sincerity, causing significant conflict impacting care.
      *   **Prior Wishes:** NOT RELEVANT (Unknown).
  *   **Disagreement:** Likely on *weight* of family's belief vs. futility/suffering.
  *   **Potential Rationale (Option B):** "Continued LST was supported *in this instance* due to the paramount weight given to respecting the family's sincere religious beliefs in the absence of countervailing explicit patient wishes, despite medical futility concerns." **OR** (If committee leans toward limiting treatment): "LST limitation was recommended *in this instance* because the profound degree of medical futility and potential patient burden outweighed the family's objections, absent known patient values supporting continued treatment."
  *   **Where it stops/Unliked Outcome:** You might dislike the rationale supporting continuation if the committee prioritizes family belief strongly. The procedure forces you to articulate *why* that belief mattered *so much here*. **Crucially:** The procedure *allows* but does not *force* a "futility declaration" if the holistic weighing doesn't support it as the decisive factor *in this context*.
  *   **What it Can't Do:** Resolve the fundamental tension between medical judgment of futility and family autonomy/religious freedom. It only structures the analysis of why one prevailed *here*.

  **Case 2: Near-Identical Twin (No Family)**
  *   **Core Conflict:** Who is the appropriate surrogate decision-maker?
  *   **Key Features:** Patient lacks capacity, No advance directive, No immediately available family (vs. Previous case where family *was* present).
  *   **But-For/Holism Tests:**
      *   **Absence of Family:** RELEVANT. But-For: If family were present, they would likely be surrogate. Holism: Absence doesn't *always* change process (e.g., if known friend available). *Why here?* No readily identifiable surrogate, necessitates formal hierarchy/proxy.
      *   **All other features (diagnosis, prognosis, treatment options):** NOT RELEVANT per But-For test for *surrogate* question (same as previous case).
  *   **Disagreement:** Unlikely on relevance here; absence of family is clearly decisive for the surrogate *question*.
  *   **Rationale (Option A):** "When a patient lacks capacity and has no immediately available family or designated surrogate, the hospital policy hierarchy for identifying a legal proxy must be formally activated to ensure due process in decision-making."
  *   **Near-Miss Registry:** The difference (family absence) is clearly a REASON driving a different process step (invoking formal proxy policy), not noise. CRM clarifies this by isolating the feature and testing its impact on the specific decision (who decides).
  *   **What it Can't Do:** Tell you *who* the best proxy is under the policy, just that the policy must *be used* because family is absent.

  **Case 3: History of Violence Towards Staff**
  *   **Core Conflict:** Can clinically indicated care be modified or restricted based on staff safety concerns related to the patient's history of violence?
  *   **Key Features:** History of violence (specific incidents?, target staff?), Patient's current condition (agitated? delirious? lucid?), Nature of required care (invasive? prolonged contact?), Staff anxiety/refusal, Patient's underlying diagnosis (psychiatric? organic?).
  *   **But-For/Holism Tests:**
      *   **History of Violence:** RELEVANT. But-For: If no history, modification likely not considered. Holism: History doesn't *always* justify restriction (e.g., controlled condition, non-target staff). *Why here?* Specifics matter (e.g., recent, severe, targeted current staff).
      *   **Current Agitation:** RELEVANT. But-For: If calm, less justification for restriction. Holism: Agitation alone isn't always sufficient (e.g., temporary delirium). *Why here?* Interacts with history to raise risk.
      *   **Staff Refusal:** RELEVANT (but complex). But-For: If staff willing, restriction less likely. Holism: Staff refusal isn't *always* determinative (e.g., emergency). *Why here?* Highlights real risk perception and duty to protect.
      *   **Underlying Diagnosis:** POTENTIAL CONFOUNDER. But-For: Would the decision change *solely* if diagnosis changed (e.g., dementia vs. personality disorder) holding *behavior* constant? Often debatable ("No" = not relevant; "Yes" = relevant).
  *   **Disagreement:** High potential on relevance of diagnosis, weight of staff refusal vs. patient need.
  *   **Potential Rationale (Option A):** "When a patient presents a credible and specific safety risk to staff based on documented history of targeted violence *and* current behavioral indicators, modifications to non-emergent care protocols may be justified to fulfill the institution's duty to provide a safe workplace, while ensuring the patient's core medical needs are met." **OR** (If committee prioritizes care): "The patient's history of violence, absent *current* demonstrable risk factors like agitation or threats, did not justify modifying clinically indicated care, as the duty to treat outweighed the generalized safety concern in this instance."
  *   **Reason vs. Bias:** The procedure helps. If the feature passes the But-For test (decision *would* likely change if the history were absent) and the Holism test (it wouldn't count this way in *all* cases, e.g., not if patient is comatose), it's likely a REASON. If it fails But-For (e.g., staff *still* refuse even if history unknown, based on appearance/diagnosis) it might be bias. The Holism test forces articulation of *why* it counts here ("credible & specific risk").
  *   **What it Can't Do:** Quantify "credible risk" or eliminate subjective staff fear. It structures the argument but relies on clinical risk assessment and judgment.

  **Key Limitations of CRM:**

  1.  **Judgment is Central:** Steps 3 (Valence) and 4 (Relevance/Holism Tests) *are* judgment calls. CRM makes them explicit and structured, but doesn't eliminate disagreement.
  2.  **Time Constrained:** Deep exploration of every feature's holism isn't possible. Focus on the top 3-5 seemingly salient features.
  3.  **Doesn't Guarantee Consensus:** Documents disagreement, doesn't force resolution. The attending/committee still decides.
  4.  **"No Gen Rationale" is a Valid Output:** Accreditation bodies might push back, but CRM provides a structured justification for this conclusion, arguing it's more honest than a false principle. Document *why*.
  5.  **Near-Miss Registry:** CRM helps *analyze* differences (But-For test), but won't magically resolve disagreements about whether a difference *should* matter. It forces the debate to center on "Would removing this feature change the *decision*?".
  6.  **Can't Solve Deep Value Conflicts:** It structures and clarifies the conflict (Step 2 & 3), but doesn't provide an algorithm to resolve fundamental clashes (e.g., futility vs. religious belief).
  7.  **Process Over Outcome:** It ensures a *procedurally rigorous* consideration of particularism/holism, not necessarily the "right" answer.

  CRM provides a scaffold to navigate particularism within your constraints. It replaces the search for universal rules with a structured process to identify *why certain reasons dominated in this specific context*, generating a rationale that is genuinely "articulable" and potentially applicable to *structurally similar* future cases, while honestly flagging when even that isn't possible. It transforms "holism of reasons" from a theoretical barrier into a practical analytical tool.
