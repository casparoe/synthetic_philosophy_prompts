  Okay, the user is describing a specific failure mode in arguments where someone appears to engage but isn't actually open to changing their mind based on the discussion. They've observed this in committee meetings and online debates, noting two key aspects: lack of commitment to the outcome and argumentation directed at onlookers rather than the interlocutor. They want to know if this has a name, or if not, how to define it.

  First, I need to figure out what existing concepts might apply. The user has already ruled out insincerity, self-deception, bullshitting, dogmatism, and costless signaling. So I should look for other philosophical or rhetorical terms. Maybe "dialectical rigidity" or "unfalsifiable positioning"? Or perhaps "performative argumentation" since the arguments seem aimed at an audience. 

  The user mentions two parts: unwillingness to be bound by the outcome and arguments addressed to third parties. Are these connected? It makes sense that arguing for an audience would make someone less likely to concede because their reputation is at stake. But in cases like a lawyer, that's expected. The user provides test cases: a lawyer, a minister, devil's advocate, etc. Any definition needs to distinguish between acceptable roles (like a lawyer) and problematic cases like the committee member who won't consider evidence.

  The user is also concerned about the epistemic challenge. Accusing someone of not arguing in good faith involves a counterfactual—what they would do if evidence contradicted them. This is hard to prove. They want to know if such an accusation can be responsibly made and what evidence could support it.

  So, possible terms: "Dialectical Unaccountability"? That focuses on the lack of commitment to outcomes. Or "Audience-Captive Argumentation" for the second aspect. But maybe combining both into "Dialectical Unaccountability" as the core issue, with the audience focus as a common cause. 

  I need to check if existing terms like "bad faith" or "motivated reasoning" fit. The user says it's not insincerity, so "bad faith" might not work. Motivated reasoning involves subconscious biases, but here the person might have arrived at their view rationally. The key is their stance in the argument itself, not how they formed the belief.

  For evidence, patterns over time matter. If someone never concedes points despite compelling evidence, or if they avoid engaging with critiques, that's indicative. Also, if they redirect arguments to third parties instead of addressing the interlocutor. The user's examples show participants restating positions without genuine engagement.

  The coinage should clearly separate acceptable roles. A lawyer isn't expected to change their stance; their role requires advocacy. But in a committee, members should be open to persuasion. So the term must account for context. 

  Finally, the user wants to know if accusing someone of this is epistemically responsible. It's tricky because it's a counterfactual, but patterns of behavior can provide evidence. However, such accusations can themselves be performative, so caution is needed. The user seems to seek a framework to analyze disputes without resorting to unfounded claims of bad faith.
answer: |-
  Based on your precise description and the exclusions you've provided, the phenomenon you're identifying doesn't have a single, universally established term in philosophy, rhetoric, or argumentation theory. However, it closely aligns with and refines several existing concepts. Let's break it down:

  ### Core Concept & Proposed Term
  The core failure mode is **"Dialectical Unaccountability"** or **"Unfalsifiable Argumentative Stance."** This captures the **refusal to pre-commit to any outcome of the exchange as potentially valid or binding on one's position**, rendering the argumentative process epistemically inert for the speaker.

  **Defining Features:**
  1.  **Lack of Outcome Commitment:** The arguer does not stake their conclusion (even partially) on the *specific* evidence, reasoning, or adjudication process offered *within this exchange*. No conceivable outcome would compel them to revise their view *as a result of this dialogue*.
  2.  **Immunity to Counter-Evidence (in this context):** While they may have arrived at their view via evidence, and may be sincere and logically coherent, *this specific discursive arena* is granted no authority to challenge it. The argument is conducted *around* the belief, not *with* it open to revision *here*.
  3.  **Audience Focus (Mechanism/Symptom):** Addressing onlookers/the record/one's own side is often the *mechanism* enabling Dialectical Unaccountability. It shifts the purpose from *joint inquiry* or *persuading the interlocutor* to *performance*: reinforcing group identity, signaling loyalty, building a record for external judgment, or fulfilling a role obligation. This external focus *releases* the arguer from accountability *to the interlocutor or the immediate dialectical process*. It's not always present, but is a common enabler.

  ### Why Existing Terms Don't Quite Fit (Reinforcing Your Exclusions)
  *   **Bad Faith (Sartre):** Assumes conscious deception of self/others. Your cases involve sincerity.
  *   **Bullshit (Frankfurt):** Involves indifference to truth. Your arguers care about truth *in general*, just not *in this exchange*.
  *   **Dogmatism/Closed-Mindedness:** Too broad. Your subjects *can* change their minds *outside* this specific dispute. The issue is the *immunity granted to this particular dialectical context*.
  *   **Sophistry/Rhetoric for Victory:** Focuses on intent to win. Your arguers may simply be maintaining a position or discharging a role without a "win" motive.
  *   **Costless Signalling:** Focuses on the cheapness of the *utterance*. Your focus is on the *lack of epistemic stake in the outcome*.
  *   **Motivated Reasoning:** Explains *why* the stance is held (confirmation bias, identity protection) but doesn't capture the specific *structural refusal to engage the dialectic as authoritative*.

  ### Applying "Dialectical Unaccountability" to Your Test Cases

  1.  **Lawyer arguing a client's brief:** **NOT Dialectically Unaccountable.** Their role *requires* them not to be personally bound by the outcome of *this specific exchange* (the trial/negotiation). Their accountability is to the client and the court *as an institution*, not to the opposing counsel or the truth-seeking process *per se* within that argument. This is an accepted social role with different norms.
  2.  **Minister reading a departmental line:** **NOT Dialectically Unaccountable (in the moment).** Similar to the lawyer. They are discharging an institutional role. Their personal view is irrelevant; their "accountability" is to the department/govt. line. The *exchange* isn't meant to change *their* mind; it's meant to *state the position*.
  3.  **Devil's Advocate:** **NOT Dialectically Unaccountable.** Their *explicit role* is to test an argument *without* holding the position. They are accountable *to the process of rigorous testing*, not to the truth of the position itself. They *should* yield if the counter-arguments are robustly defeated within the agreed-upon rules.
  4.  **Teacher examining a student:** **NOT Dialectically Unaccountable.** The teacher is accountable to pedagogical goals and factual accuracy. The exchange is designed to *elicit* the student's understanding, not to test the teacher's own beliefs. The teacher *is* epistemically bound by the subject matter, just not personally challenged *by the student* in the same way peers are.
  5.  **Genuinely undecided person:** **NOT Dialectically Unaccountable.** They explicitly *are* staking their potential future belief on the exchange ("using the exchange to find out what she thinks"). The outcome *is* authoritative for them *by design*.
  6.  **Someone who stakes a concession never intended to defend:** **DIALECTICALLY UNACCOUNTABLE.** This is insincere *performative* concession. They create the *appearance* of accountability without the substance. Nothing was ever truly staked.
  7.  **Someone who stakes something real but only privately:** **DIALECTICALLY UNACCOUNTABLE (from the interlocutor's/social perspective).** While they *are* internally accountable, the *dialectical process* lacks this crucial information. The exchange cannot function effectively because the interlocutor cannot gauge genuine engagement or potential movement. The *social epistemology* of the argument breaks down.

  ### Addressing the Epistemic Challenge
  The accusation of Dialectical Unaccountability *is* inherently difficult to prove definitively within a single exchange because it relies on counterfactuals ("What *would* they accept?"). However, it is **not** epistemically irresponsible *in principle* to make the claim, provided it is grounded in observable patterns and reasoned inference:

  1.  **Evidence For:**
      *   **Pattern of Non-Revision:** Consistent refusal to revise *any* aspect of the view over *multiple* encounters with diverse, high-quality counter-evidence/arguments within the discourse (like your 8-year dispute participant).
      *   **Shifting Goalposts/Moving Targets:** When "what would change my mind" becomes an ever-receding horizon, or objections are dismissed *a priori* as irrelevant/invalid without engagement.
      *   **Explicit Rejection of the Forum's Authority:** Statements like "Nothing said here could change my mind," or dismissing the process/rules/participants as inherently incapable of adjudicating the issue.
      *   **Consistent Audience Address:** Persistent framing of arguments *only* for third parties ("Let the record show...", "People watching will see...", "Our supporters know...") with no direct engagement addressing the interlocutor's core points *as challenges to be met*.
      *   **Lack of Reciprocal Challenge:** Never posing questions or challenges *to the interlocutor* that genuinely seek to test *their* position, only seeking to rebut or display flaws to others.
      *   **Role Inconsistency:** Performing actions inconsistent with genuine dialectical engagement *without* the justification of a recognized role like a lawyer (e.g., the committee member refusing to acknowledge the committee's potential authority on *any* aspect of its own business).

  2.  **Evidence Against:**
      *   **Explicit Stakes:** Clearly stating "If X evidence is presented/reason Y holds, I would concede Z."
      *   **Actual Revision:** Demonstrating a willingness to modify or refine the view *based on* previous exchanges within the *same* discourse or forum.
      *   **Genuine Engagement:** Asking clarifying questions, summarizing the opponent's position charitably to confirm understanding, probing weaknesses in the opponent's view *as if* seeking truth.
      *   **Appropriate Role Context:** Operating within a recognized role (like lawyer, minister) where dialectical unaccountability is the *expected norm* for that interaction.

  **Can "bad faith" be responsibly accused?** "Bad faith" often implies conscious dishonesty, which *is* hard to prove and often escalates conflict. **"Dialectical Unaccountability" is a more precise and responsible accusation.** It focuses on the *structural* failure of the argumentative engagement and its *observable consequences* for the discourse, without necessarily imputing malice or conscious deception. You can responsibly say: "Your stance appears dialectically unaccountable; you haven't indicated what, if anything, within *this discussion* could change your view, and your arguments seem consistently addressed past me to an audience. This makes productive dialogue impossible." This points to the *behavior* and its *impact* rather than the unknowable inner state.

  The key insight is that productive argument requires participants to grant the *exchange itself* some provisional authority. Dialectical Unaccountability negates this, rendering the exchange a performance rather than a joint inquiry. Recognizing and naming it allows for clearer diagnosis of why disputes become intractable, beyond simple accusations of dishonesty or stupidity.
