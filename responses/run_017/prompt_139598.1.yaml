prompt: |-
  I direct service planning at a mid-sized regional transit authority, and one of the recurring arguments in my shop is about information purchases: before we commit to a route restructure, a capital bus-lane project, a fare change, or a new service agreement, someone proposes that we first buy some more knowledge — an on-board origin–destination survey, a few weeks of automated passenger counters, a consultant travel-demand model, an eight-week pilot, an equity analysis — and we have no disciplined way to decide. These come up maybe fifteen or twenty times a year at a formal level, at stakes between roughly thirty thousand and three million dollars, and every recommendation has to survive a finance director who wants a dollar figure plus the three assumptions driving it, and, above a hundred thousand, a board that reads nothing else. Whoever runs the procedure will be a planning analyst with a spreadsheet, about an hour per case, and no taste for decision theory, so it has to be operable without the vocabulary while still tracking what the theory actually says. The theory I am leaning on is the result usually called Good's theorem: that an agent who updates by conditioning and then chooses to maximize expected utility cannot, judging before the message arrives and averaging over the messages it might receive, be made worse off by information that is free, because it can always shrug and act exactly as it would have acted without it. I have absorbed that slogan from years of reading rationalist blogs, and my problem is precisely that it is a slogan: it licenses our default instinct that looking can never hurt and that more measurement is always progress, which I no longer believe, but I cannot reconstruct from the slogan which assumption is doing the work, so I cannot tell when it stops protecting us.

  So I want a written procedure, not an essay: an ordered set of steps with a time box on each, a statement of what counts as a sufficient answer at each step, the nodes where it stops with a no, and the nodes where it hands the question to a named human because the issue is one of values rather than fact. Several things need to be built in explicitly rather than left to the analyst's judgment. There should be a decision-invariance check up front: if the choice we would make is the same under every result the instrument could plausibly return, the value is zero no matter how interesting the study is, and the procedure should stop there. There needs to be an upper bound computed as the value of deciding with clairvoyance about the one quantity that actually matters, and then an explicit descent from that bound to the instrument we could really buy — my analysts currently just report the clairvoyance number, which is why every proposal looks worth funding — and I want your view on the discounting rule my senior analyst has drafted, which multiplies the bound by the correlation between what the instrument measures and the decision-relevant quantity. I also want the procedure to force the estimate to be written and dated before the purchase and never quietly revised afterward, to separate the ex ante guarantee from the ex post fact that a particular result can genuinely leave us worse off, to handle sequencing honestly (we keep adding the values of three studies together, and I am told that is wrong because value is not additive across signals and depends on what you already expect to learn), to say what to do when a needed number is simply unavailable — an uncertainty band, a sensitivity table, a break-even question, whatever is defensible in ten minutes — and to state, in so many words, which steps are judgment wearing a lab coat. Most importantly, it needs a failure check for the theorem's assumptions, covering at least these: the information cannot actually be ignored because a policy, contract, or board rule commits us to react to it; the message changes what other agents do rather than only what we believe; the instrument measures a proxy that downstream readers will treat as the quantity itself; the arrival of the number changes the set of acts available or their payoffs, including by taking so long that the window for acting closes; and the case where the information is nominally free to us because a grant pays for it. For each of those I want to know not just that the non-negativity argument lapses but what the procedure should output instead.

  Then apply it to three live proposals, showing the arithmetic with your assumptions written down, and give me the one-page memo template the analyst would fill in. First: an eight-week Sunday-service pilot on Route 14 costing about sixty thousand dollars. My planners love pilots on principle and will fight me on this, but the earliest we could add Sunday service is eleven months out because it needs operators we cannot hire until the next fiscal year, the pilot would run in July and August while the parallel rail line is down for maintenance, and I suspect that a weak result would be explained away and a strong result would change nothing about the timeline; if the procedure says skip it, say so flatly, and if it saves the pilot, tell me which step saved it. Second: a forty-thousand-dollar stated-preference and travel-diary survey intended to decide whether to extend Route 7 two miles to the new regional medical campus, at about three hundred thousand a year in operating cost, instead of keeping the current alignment and funding an on-demand shuttle. This decision is genuinely live and I think the clairvoyance bound here is large; my worry is that the survey measures stated intent among residents in a two-mile band rather than boardings at particular stops during clinic shift changes, that it excludes the shift workers we most care about, and that it returns in four months when we need to file the grant application in six weeks — so I want the procedure to tell me whether to buy it, buy a re-scoped and much cheaper version such as a two-week manual ride check at the existing transfer point, or buy nothing. Third: a federally funded equity and farebox-recovery analysis of our fare-free program, costing us nothing, whose publication would trigger an adopted board rule automatically scheduling a discontinuation hearing for any route below a recovery threshold for two consecutive quarters, and which advocacy groups and the union would use in ways we cannot control. I expect the procedure to flag this as a case where information makes us worse off precisely because we are not free to ignore it once it exists; I want that stated, I want the remaining question handed to a person with an account of what the person should actually be deciding, and I want you to be candid about the option of commissioning an internal version that is never published, since that is choosing ignorance instrumentally and has its own costs. Finally, tell me what this procedure cannot settle: which inputs are irreducibly judgment, where it will systematically misfire at an authority like mine, and how I should describe its limits in the memo without giving the board a reason to ignore it.
reasoning: |-
  Hmm, the user is a transit planning director facing a common but critical problem: how to systematically evaluate whether to purchase additional information before making service decisions. They're drowning in ad hoc proposals for studies and pilots (15-20/year at $30k-$3M each) with no consistent framework. 

  The core tension they describe is fascinating - they've internalized Good's theorem ("information can't hurt if you can ignore it") from rationalist blogs but now see real-world violations of that principle. Their skepticism is justified: in transit planning, information often isn't free because of institutional constraints (board rules, union agreements, political pressures). What they need isn't theoretical debate but an operational procedure that frontline analysts can implement in spreadsheet-driven 1-hour assessments.

  Key pain points they've identified:
  - Analysts default to "clairvoyance value" making every study seem worthwhile
  - No mechanism to stop redundant studies when decisions wouldn't change
  - Failure to account for measurement-reality gaps (proxies vs actual decision variables)
  - Ignoring temporal constraints (studies that expire before action can be taken)
  - Treating information value as additive when it's interdependent

  Their draft framework components are remarkably sophisticated:
  1) Decision-invariance checkpoint (killer feature)
  2) Clairvoyance value ceiling with correlation discounting (addressing the analyst bias)
  3) Explicit treatment of "information hazards" (when data forces harmful actions)
  4) Sequencing awareness (non-additivity of signal value)
  5) Separation of ex-ante vs ex-post valuation

  For the three test cases:
  The Sunday pilot on Route 14 seems clearly worthless - the 11-month implementation lag neuters any learning value while the rail closure contaminates results. The procedure should kill this early at Step 2 (decision-invariance). 

  The medical campus survey is trickier - high clairvoyance value (~$300k savings potential) but flawed methodology. The procedure should force a cheaper alternative (ride checks) and adjust value for poor correlation with actual ridership. Might survive if re-scoped.

  The "free" equity study is the most dangerous - classic information hazard where the findings trigger automatic board rules. Procedure must flag this in Step 8 and escalate to legal/political judgment. The unpublished version option needs explicit cost-benefit analysis of keeping secrets.

  The real brilliance of their approach is recognizing that transit planning operates in what Cyert & March called "problemistic search" - we often seek information to justify predetermined conclusions. This procedure institutionalizes doubt by:
  - Forcing pre-commitment to valuation assumptions
  - Separating measurement quality from decision relevance
  - Surfacing when "more data" is actually avoidance of accountability

  Major unspoken constraint: Transit authorities exist in political ecosystems where information isn't neutral. The board "reads nothing else" except dollar figures precisely because every study becomes ammunition for stakeholders. This procedure's greatest value may be creating audit trails showing why certain data wasn't pursued - protection against "why didn't you study this?" hindsight attacks.
answer: |-
  Below is a complete **Information Value Assessment (IVA) Procedure** for evaluating knowledge purchases, designed for spreadsheet execution within 60 minutes per case. The procedure incorporates your requirements, including failure checks for Good’s theorem assumptions, non-additivity, and judgment transparency.

  ---

  ### **INFORMATION VALUE ASSESSMENT (IVA) PROCEDURE**  
  *(Time per step in brackets; total ≤60 min)*  

  #### **Step 1: Decision Invariance Check** [5 min]  
  - **Question:** "Would every plausible result from this instrument lead to the *same* decision?"  
  - **Sufficient Answer:** List the decision options (e.g., "Build bus lane" vs. "Do nothing"). For each, state the result range that would trigger it (e.g., "If projected ridership increase >5%, build; else abandon"). If all plausible instrument outcomes map to one decision, **STOP: VALUE = $0**.  
  - **Failure Path:** If invariant → Output "$0; no decision impact" and terminate.  

  #### **Step 2: Clairvoyance Value (CV) Bound** [10 min]  
  - **Question:** "What is the maximum value of *perfect information* on the decision-relevant quantity?"  
  - **Sufficient Answer:**  
    - Compute CV = |Best action’s expected value *with* perfect info| − |Best action’s expected value *without* info|.  
    - *Example:* Extending Route 7 might save $150K/year if perfect data says "build," or waste $300K/year if "don’t build." CV = $150K (avoided loss).  
  - **Failure Path:** If CV ≤ $0 → STOP: "$0; no uncertainty cost."  

  #### **Step 3: Correlation Discount** [15 min]  
  - **Question:** "How well does the instrument measure the decision-relevant quantity?"  
  - **Sufficient Answer:**  
    - Apply discount factor = **ρ²** (squared correlation) between the proxy (what’s measured) and the target (what matters).  
    - *Senior analyst’s rule validated:* ρ² accounts for signal reliability.  
    - *Estimate ρ using:* Historical data, expert judgment, or sensitivity table (e.g., "If ρ=0.7, discount=0.49").  
  - **Adjusted Value:** IVₐ = CV × ρ².  
  - **Failure Path:** If ρ unknowable → Output range (e.g., "IVₐ = $50K–$200K if ρ=0.5–0.9") or **BREAK-EVEN ρ** (e.g., "Only worth if ρ > 0.6").  

  #### **Step 4: Cost & Timing Check** [5 min]  
  - **Question:** "Does the instrument cost less than IVₐ, and will results arrive *before* the decision deadline?"  
  - **Sufficient Answer:**  
    - If cost > IVₐ → STOP: "Not worth cost."  
    - If results arrive post-deadline → STOP: "$0; obsolete."  
    - *Document:* IVₐ and cost estimates **signed/dated** here. No revisions post-purchase.  

  #### **Step 5: Sequencing & Additivity** [10 min]  
  - **Question:** "Does this duplicate existing data? Do multiple studies interact?"  
  - **Sufficient Answer:**  
    - If overlapping with prior studies → Discount IVₐ by expected redundancy (e.g., "Second survey adds 20% less value").  
    - Non-additivity rule: Value of A+B ≤ Value of A + Value of B (subadditive).  

  #### **Step 6: Good’s Theorem Failure Check** [10 min]  
  *For each failure mode below, subtract costs or adjust IVₐ:*  
  - **Commitment to react:** If policy forces action based on results (e.g., board rule) → Subtract cost of *harmful mandated actions* (e.g., discontinuation hearings).  
  - **Strategic responses:** If rivals/partners adjust behavior (e.g., union renegotiates) → Model worst-case payoff change.  
  - **Proxy confusion:** If readers treat proxy as truth (e.g., "survey = ridership") → Use ρ=1 (no discount) but add reputational risk cost.  
  - **Window closure:** If study delays action → Subtract opportunity cost of delay.  
  - **"Free" grants:** If externally funded → IVₐ remains, but add compliance/scope creep costs.  

  #### **Step 7: Judgment Handoff** [5 min]  
  - **Question:** "Does failure check reveal unquantifiable value/cost conflicts?"  
  - **Sufficient Answer:** If yes → **HANDOFF** to named role (e.g., "Legal Director for contract risks"; "Equity Officer for community impact"). Specify: "Decide based on [e.g., political risk, moral hazard]."  

  ---

  ### **APPLICATION TO LIVE PROPOSALS**  
  #### *Case 1: Route 14 Sunday Pilot ($60K)*  
  - **Step 1:** Decision invariant. *Rationale:* Pilot runs during rail closure (atypical demand). Weak results = "blame construction"; strong results = can’t act for 11 months anyway → same "wait" decision.  
  - **Output:** **STOP. VALUE = $0.** Do not run pilot.  
  - *Step that killed it:* Step 1 (invariance).  

  #### *Case 2: Route 7 Medical Campus Survey ($40K)*  
  - **Step 1:** Decision not invariant (survey could tip build/shuttle choice).  
  - **Step 2:** CV = $300K (avoided operating loss if wrong choice).  
  - **Step 3:** ρ² ≈ 0.25 (poor correlation: measures residents, not shift workers; diaries unreliable). IVₐ = $300K × 0.25 = **$75K**.  
  - **Step 4:** Cost ($40K) < IVₐ ($75K), but 4-month delay > 6-week deadline → **STOP: Obsolete.**  
  - **Alternative:** Propose $5K ride-check at transfer point (ρ²≈0.6, 2-week turnaround). IVₐ = $300K × 0.6 = $180K >> cost. **Recommend: Buy ride-check.**  

  #### *Case 3: Federally Funded Equity Study ($0 cost)*  
  - **Step 1:** Not invariant (study could trigger hearings).  
  - **Step 2:** CV = High (avoids equity violations).  
  - **Step 6:** **Critical failure:** Board rule mandates discontinuation hearings → Risk of service cuts if recovery threshold missed. Subtract: Cost of hearings + lost ridership + political fallout.  
  - **Step 7:** **HANDOFF to CEO/Legal Director.** *Decision:* "Commission internal study? Tradeoff: Avoid publication risk ($X) vs. transparency loss & compliance penalties ($Y)."  
  - **Candid Option:** Internal study feasible; cost ≈ reputational damage if leaked.  

  ---

  ### **ONE-PAGE MEMO TEMPLATE**  
  ```markdown
  **INFORMATION VALUE ASSESSMENT**  
  Proposal: [Study name] | Date: [MM/DD/YYYY] | Analyst: [Name]  

  1. **DECISION INVARIANCE?**  
     - [ ] Yes → **RECOMMEND: REJECT** (Value: $0)  
     - [ ] No → Decisions: [Option A if X, Option B if Y]  

  2. **CLAIRVOYANCE VALUE (CV):** $[ ] | Basis: [e.g., "Avoided loss of $[ ] if wrong choice"]  

  3. **CORRELATION DISCOUNT (ρ²):** [ ]% | Rationale: [e.g., "Survey vs. actual ridership: ρ≈[ ]"]  
     - **ADJUSTED VALUE (IVₐ):** $[ ] = CV × ρ²  

  4. **COST & TIMING:**  
     - Cost: $[ ] | IVₐ: $[ ] → Cost < IVₐ? [Y/N]  
     - Deadline: [Date] | Results ready: [Date] → On time? [Y/N]  

  5. **SEQUENCING:** Redundancy discount: [ ]% | Final IVₐ: $[ ]  

  6. **FAILURE CHECKS:**  
     - [ ] Mandated reaction → Cost added: $[ ]  
     - [ ] Proxy confusion → Risk adjustment: [Description]  
     - [ ] "Free" grant → Compliance cost: $[ ]  

  7. **RECOMMENDATION:**  
     - [ ] APPROVE (Net value: $[ ])  
     - [ ] REJECT (Reason: [Invariance/High cost/Late/High risk])  
     - [ ] HANDOFF to [Role]: [Decision needed on [non-quantifiable issue]]  

  8. **JUDGMENT CALLS:**  
     - Key assumptions: [e.g., "ρ based on 2022 survey"]  
     - Quantification limits: [e.g., "Reputational risk not dollarized"]  
  ```

  ---

  ### **WHAT THIS PROCEDURE CANNOT SETTLE**  
  1. **Irreducible Judgments:**  
     - ρ (correlation) estimates, CV calculation, and failure-check costs rely on expert heuristics.  
     - Tradeoffs between equity/service cuts during handoffs.  

  2. **Systematic Misfires:**  
     - In highly politicized environments, quantifiable "value" may ignore community trust costs.  
     - Rapidly changing markets (e.g., post-pandemic demand) make historical ρ unreliable.  

  3. **Describing Limits to the Board:**  
     > *"The IVA quantifies the financial value of reducing decision uncertainty, using conservative proxies for hard-to-measure risks. It does not override legal or equity commitments flagged in Handoffs. When costs are non-monetary (e.g., public trust), it defers to human judgment with documented rationale."*  

  **Final Note:** Good’s theorem fails precisely when information *cannot* be ignored (Case 3), measures a *proxy* (Case 2), or expires before acting (Case 1). This procedure forces explicit acknowledgment of these traps—turning a slogan into a safeguard.  

  ---  
  **Output to use:** Implement the IVA Procedure + Memo Template. For your cases: **Kill Route 14 pilot**, **counteroffer ride-check for Route 7**, and **handoff equity study to legal** with internal-study tradeoffs.
