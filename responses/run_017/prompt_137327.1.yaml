  | **"Formal verification is futile!"**          | Immediately after (min 14)           | "The theorems only say *some* truths are unprovable in a *single fixed system*. Our static analyzer: (1) targets *specific* properties, (2) can extend its rules (add axioms!), and (3) often works on *decidable subsets* (e.g., bounded code)." |
  | **"It’s just the halting problem!"**          | During example debrief (min 15)      | "Yes! The halting problem *implies* incompleteness: if a system proved all halting truths, you could build a halting decider (contradiction). Gödel is a *corollary*." |
  | **"True but unprovable = unknowable!"**       | When stating the theorem (min 16)    | "We *know* the Gödel sentence is true! It’s only *unprovable in the system*. We’re outside it." |
  | **"Just add the Gödel sentence as an axiom!"** | After consistency discussion (min 17)| "Then the *new* system has its *own* unprovable sentence. Incompleteness is recursive—it doesn’t go away, but that doesn’t break math or verification." |

