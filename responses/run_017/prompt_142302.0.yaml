  ### Nuclear Strategy Decision Tree  
  *Start from the shared premise: A state with a survivable second-strike nuclear force is unlikely to face a deliberate nuclear first strike. Answer each question to navigate the tree. Base answers on logical deduction, not prior knowledge of schools.*

  #### The Tree (Nested Branching)  
  1. **Without a declared threat or automated system, does a survivable arsenal alone deter nuclear attack?**  
     - *Yes* → Go to 2A  
     - *No* → Go to 2B  

  2A. **Does collateral damage (e.g., fallout, climate effects) undermine threat credibility?**  
     - *Yes* → Go to 3A  
     - *No* → **Existential deterrence**  

  2B. **Can pre-delegating retaliation to an automated system restore credibility?**  
     - *Yes* → **Minimum deterrence (countervalue)**  
     - *No* → Go to 3B  

  3A. **Can nuclear threats deter large conventional/chemical attacks?**  
     - *Yes* → *Incoherent path (see notes)*  
     - *No* → **Abolitionism/deterrence-rejection**  

  3B. **Can a state rationally threaten retaliation that, if executed, leaves it worse off?**  
     - *Yes* → Go to 4A  
     - *No* → Go to 4B  

  4A. **Does collateral damage undermine credibility?**  
     - *Yes* → **Deliberate ambiguity**  
     - *No* → Go to 5A  

  4B. **Do large arsenals/counterforce capabilities enhance security?**  
     - *Yes* → **Counterforce war-fighting**  
     - *No* → Go to 5B  

  5A. **Do large arsenals/counterforce capabilities enhance security?**  
     - *Yes* → **Flexible response**  
     - *No* → **Minimum deterrence (countervalue)**  

  5B. **Can no-first-use + conventional defense deter conventional attacks?**  
     - *Yes* → **No-first-use + conventional defense**  
     - *No* → **Escalate-to-de-escalate**  

  #### Brinkmanship Addendum (Applies to All Paths)  
  - **Final question:** Is deliberately escalating risk in a crisis strategically viable?  
    - *Yes* → **Schelling-style risk manipulation**  
    - *No* → **Brinkmanship-critical (signaling/impossibility)**  

  ---

  ### Scoring Key: Positions by Answer Path  
  | Position                              | Path (Node Answers)                                                                 |  
  |---------------------------------------|-------------------------------------------------------------------------------------|  
  | **Existential deterrence**            | 1:Y, 2A:N                                                                           |  
  | **Minimum deterrence (countervalue)** | 1:N, 2B:Y *or* 1:N, 2B:N, 3B:Y, 4A:N, 5A:N                                         |  
  | **Counterforce war-fighting**         | 1:N, 2B:N, 3B:N, 4B:Y                                                              |  
  | **Flexible response**                 | 1:N, 2B:N, 3B:Y, 4A:N, 5A:Y                                                        |  
  | **Escalate-to-de-escalate**           | 1:N, 2B:N, 3B:N, 4B:N, 5B:N                                                        |  
  | **No-first-use + conventional defense** | 1:N, 2B:N, 3B:N, 4B:N, 5B:Y                                                        |  
  | **Deliberate ambiguity**              | 1:N, 2B:N, 3B:Y, 4A:Y                                                              |  
  | **Abolitionism/deterrence-rejection** | 1:Y, 2A:Y, 3A:N                                                                     |  
  | **Schelling-style risk manipulation** | *Any path* + Brinkmanship:Y                                                         |  
  | **Brinkmanship-critical**             | *Any path* + Brinkmanship:N                                                         |  

  #### Empty Cells & Indistinguishable Positions  
  - **Incoherent paths** (e.g., 1:Y, 2A:Y, 3A:Y): Claims existential deterrence works *despite* collateral damage undermining credibility, yet nuclear threats deter conventional attacks. Contradicts causal logic.  
  - **Indistinguishable on nodes**: Existential and minimum deterrence converge if both answer 2B:Y (automation). Automation bridges the willingness gap, making them functionally identical.  
  - **Unoccupied paths** (e.g., 1:N, 2B:N, 3B:Y, 4A:Y, 5A:Y): Assumes collateral damage undermines threats *and* large arsenals help. No major school holds this (self-deterrence negates counterforce advantages).  

  ---

  ### Closing Note: Key Sorting Nodes  
  1. **Node 1 (Survivable Arsenal Alone Deters?)**:  
     - **Why it sorts**: Separates positions rooted in inherent risk (existential) from those requiring explicit credibility (all others). Splits the field 50/50.  

  2. **Node 3B (Rational to Threaten Self-Harming Retaliation?)**:  
     - **Why it sorts**: Divides theorists who accept "irrational" threats (Schelling, Kahn) from skeptics (classical rationalists). Resolves debates over crisis stability, escalation control, and counterforce utility.  

