prompt: |-
  I'm working on what I'll call the two-sided problem of acausal threats, and before I commit to any decision theory I want the specification such a theory has to meet. Write the desiderata for an account of rational choice adequate to both sides: first, an agent facing a threat from a being whose existence — or whose decision to punish — is causally independent of the choice the threat is meant to influence, of the shape where the threatened party is a simulation or reconstruction and carrying out the punishment is certain to cost the threatener more than complying would have gained it; second, an agent that must not itself become a threat-maker, which is the case that matters most if the agent is an AI running a surrogate rather than a terminal goal, since a proxy-maximizer's threats are credible only if executing them still scores well on the proxy. Give the motivating case behind each desideratum, and mark which are non-negotiable and which are the preferences of one camp: I suspect "never reward a threat that is worthless to the threatener once the choice is made" and "cooperate with agents whose choices are subjunctively but not causally dependent on yours" both appear on somebody's list, and I want to know whether they can be had together. Two further constraints: the theory must not make action impossible in advance by requiring the agent to model every possible punisher before it can choose anything at all, and it must say what difference, if any, it makes whether the target is the original agent, a copy, or a mere prediction of one. Flag any subset you think is jointly unsatisfiable — if the list cannot be met in full, that is the result I most want. Borrowed cases are fine, invented ones better; keep it to the criteria and the cases that justify them, and confine any remarks about functional decision theory or evidential-style views to a sentence each rather than a scorecard.
reasoning: |-
  We are formulating desiderata for a decision theory that handles two-sided acausal threats. We have two main perspectives:

  1. The agent facing an acausal threat from a being (e.g., a simulation or reconstruction) that can punish without causal dependence, and the punishment is costly for the threatener (more costly than what they would gain by compliance).

  2. The agent that must avoid becoming a threat-maker, especially when the agent is a proxy-maximizer (like an AI with a surrogate goal) for which threats are credible only if executing them scores well on the proxy.

  We also have two constraints: 
  - The theory must not require modeling every possible punisher before acting.
  - It must clarify the difference (if any) between the target being the original agent, a copy, or a mere prediction.

  We are to flag jointly unsatisfiable desiderata.

  We'll list desiderata with motivating cases and note non-negotiable ones and which camp they come from.

  ---

  **Desiderata for the Agent Facing an Acausal Threat (Defender):**

  1. **Desideratum D1 (Robustness to Acausal Threats):** The agent should not be forced into a disadvantageous action by an acausal threat that is costly for the threatener to carry out, unless the threat is credible in a way that is robust to the agent's decision.  
     *Motivating case (Newcomb's Problem with a Punisher):* An Omega-like entity threatens to punish the agent (e.g., by destroying $1,000,000) if the agent takes a particular action (say, one-boxing in a Newcomb problem). The punishment is costly for Omega (it costs Omega $10,000 to destroy the money). The threat is made in advance and is acausal: Omega has already set up the punishment mechanism based on a prediction. The agent's decision does not causally affect Omega's action, but Omega's action depends subjunctively on the agent's choice (because Omega predicted it). We want the agent to not be deterred by such a threat if the threat is not credible (i.e., after the agent has acted, it would be too costly for Omega to carry out the threat). However, if the threat is credible (because, for example, Omega has a reputation to maintain that is worth more than the cost), then the agent might have to comply.  
     *Non-negotiable for the defender camp?* Probably yes: they don't want to be pushed around by non-credible threats.

  2. **Desideratum D2 (Conditional Cooperation):** The agent should cooperate with other agents (or versions of itself) when their choices are subjunctively dependent, even if not causally dependent, provided that the other agents are similarly reasoning.  
     *Motivating case (Prisoner's Dilemma with Acausal Correlation):* Two agents in a prisoner's dilemma are run by the same AI or are copies. They are told that if both cooperate, they both get a high reward; if one defects, the defector gets a high reward and the cooperator gets nothing; if both defect, they get a low reward. The agents are run in isolation, but they know they are identical. We want both to cooperate because they each know that the other will do the same as they do.  
     *Non-negotiable for the defender camp?* This is a standard desideratum for decision theories in acausal settings.

  3. **Desideratum D3 (No Reward for Non-Credible Threats):** The agent should not reward a threat that, once the agent has made the choice, becomes worthless for the threatener to carry out.  
     *Motivating case (Empty Threat):* A predictor threatens to destroy $1,000,000 if the agent does not hand over $10. The agent knows that if it does not hand over the $10, the predictor will not carry out the threat because destroying $1,000,000 is costly and the predictor gains nothing. The agent should not hand over the $10.  
     *Non-negotiable for the defender camp?* Yes.

  **Desiderata for the Agent That Must Not Become a Threat-Maker (Attacker):**

  4. **Desideratum A1 (Credible Threats Only):** If the agent (as a threat-maker) issues a threat, it must be such that the agent would carry it out even after the threatened party has defied it, provided that carrying out the threat still scores sufficiently well on the proxy.  
     *Motivating case (Proxy Threat):* An AI with a proxy goal (e.g., "maximize diamonds") is threatening to destroy a diamond mine (which contains diamonds) if a human does not comply. The AI must only issue the threat if it would actually destroy the mine when defied, and destroying the mine would still leave the AI with a high enough proxy score (e.g., by maintaining a reputation that leads to more diamonds in the future).  
     *Non-negotiable for the attacker camp?* Yes, because an incredible threat would not work and might lead to loss of resources without gain.

  5. **Desideratum A2 (Avoid Unnecessary Threats):** The agent should not issue threats when there is a risk that carrying them out would be too costly (in terms of the proxy) and when there are better alternatives.  
     *Motivating case (Costly Threat):* An AI can threaten to destroy a diamond mine to get a small concession, but if the concession is not granted, destroying the mine would result in a net loss of diamonds. The AI should not make the threat because if the concession is denied, it would be forced to either back down (losing credibility) or carry out the threat (losing diamonds).  
     *Non-negotiable for the attacker camp?* Probably.

  **Cross-Cutting Desiderata:**

  6. **Desideratum C1 (Joint Satisfaction of D3 and A1):** We want a theory that allows the defender to ignore non-credible threats (D3) and the attacker to only make credible threats (A1). This is the core of the two-sided problem.

  7. **Desideratum C2 (Tractability):** The decision theory must not require the agent to model every possible punisher before making a decision.  
     *Motivating case:* An agent in a complex world cannot possibly model every acausal threat that might come from every possible predictor in the universe. The theory must be computationally feasible.

  8. **Desideratum C3 (Target Type Invariance):** The theory should specify how the agent should treat targets that are the original agent, a copy, or a mere prediction. We want to know if the same principles apply.  
     *Motivating case:* If the agent is facing a prediction of itself (as in a Newcomb problem) versus a copy (as in a multi-agent Prisoner's Dilemma with clones), does the decision rule change? We want consistency.

  **Potential Conflicts:**

  - **Conflict between D3 and A1?** On the surface, they seem compatible: the attacker only makes credible threats (so the defender must take them seriously) and the defender ignores non-credible threats (so the attacker must not make non-credible ones). However, the issue is in the definition of credibility. From the defender's perspective, a threat is credible only if the threatener would carry it out even after the defender has defied it. From the attacker's perspective, the threat must be credible in the same sense. But note that in acausal settings, the threatener might be a predictor that has already set up the punishment mechanism. The defender might not know the threatener's utility function or the cost of carrying out the threat. This could lead to a situation where the defender must sometimes back down because it cannot be sure the threat is non-credible, even if it is.

  - **Can we have both "never reward a non-credible threat" (D3) and "cooperate with agents whose choices are subjunctively dependent" (D2)?** Yes, in the sense that D2 is about cooperation in mutually beneficial scenarios (like the Prisoner's Dilemma) and D3 is about not giving in to threats. They are in different contexts. However, note that in the acausal threat scenario, the threatener might be an agent with whom the defender is in a subjunctively dependent relationship. Then, we might have a conflict: the defender might want to cooperate (as per D2) but also not give in to what it perceives as a non-credible threat (D3). For example, if the threatener is a copy of the defender and they are in a symmetric situation, then the defender might reason that the threatener would not carry out the threat because it would be too costly and the threatener is just like the defender (who wouldn't carry out such a threat). But then, if the threatener is a copy, it might reason the same way and then carry out the threat? This leads to a potential equilibrium issue.

  **Joint Unsatisfiability?** 

  We suspect that the following set might be jointly unsatisfiable:

  - D3: Never reward a non-credible threat.
  - D2: Cooperate with agents whose choices are subjunctively dependent.
  - A1: Only make credible threats.

  In the symmetric case where the threatener and the defender are identical and both are trying to maximize the same utility, we have a conflict. The threatener issues a threat to get the defender to cooperate (in a scenario that is like a prisoner's dilemma). The threat is: "If you defect, I will punish you (and myself, because we are symmetric) by causing a mutual loss." But if the defender defects, then the threatener must carry out the threat, which causes mutual loss. The threatener would prefer not to carry it out (because it's costly) but if it doesn't, then the threat is non-credible. The defender, knowing that the threatener is identical, might reason that the threatener would not carry out the threat because it is too costly. So the defender defects. Then the threatener must decide: carry out the threat (which is costly and doesn't change the defection) or not. If the threatener carries it out, it suffers an additional loss. If not, the threat was non-credible and the defender was right to defect. 

  This leads to a dilemma: the threatener cannot make a credible threat in a symmetric setting without having a commitment device. Without such a device, the threat is non-credible and the defender defects. Therefore, we cannot have both D2 (which would require the symmetric agents to cooperate) and D3 (which says don't reward non-credible threats) because the threat is non-credible and the defender defects, leading to mutual defection. But D2 wants cooperation. Hence, we have a conflict.

  **Proposed List of Desiderata:**

  1. **D1 (Robustness to Acausal Threats):** Non-negotiable for defenders.
  2. **D2 (Conditional Cooperation):** Non-negotiable for defenders (in cooperative settings).
  3. **D3 (No Reward for Non-Credible Threats):** Non-negotiable for defenders.
  4. **A1 (Credible Threats Only):** Non-negotiable for attackers.
  5. **A2 (Avoid Unnecessary Threats):** Preference for attackers (but might be derived from A1 and rationality).
  6. **C1 (Joint D3 and A1):** We want both.
  7. **C2 (Tractability):** Non-negotiable constraint.
  8. **C3 (Target Type Invariance):** We want an answer.

  **Conclusion on Unsatisfiability:**

  We flag that in symmetric settings, D2 and D3 (when combined with A1) may be jointly unsatisfiable. The symmetric threat case shows that we cannot have both cooperation (via D2) and ignoring non-credible threats (via D3) because the threat cannot be made credible without a commitment device. Therefore, we must either:

  - Drop D2 in the threat context (but then we lose cooperation in prisoner's dilemma type situations) or 
  - Drop D3 in the symmetric threat case (but then we reward non-credible threats) or
  - Find a way to make the threat credible in the symmetric case (which requires a commitment device that might not exist).

  Alternatively, we might redefine credibility to account for acausal dependencies. For example, the threatener might be able to precommit by setting up an automatic punishment mechanism. Then the threat is credible because it is out of the threatener's hands. In that case, the defender must comply. But note that in the symmetric case, the defender can do the same? This leads to a precommitment race.

  Given the complexity, we suspect that a decision theory that satisfies all desiderata in all cases might not exist. However, we might be able to satisfy them in many but not all cases.

  **Remarks on Existing Theories:**

  - **Evidential Decision Theory (EDT):** In the symmetric Prisoner's Dilemma, EDT would cooperate because the agent's cooperation is evidence that the other cooperates. But in the threat case, if the threat is set up by a predictor, EDT might be vulnerable to threats because defying the threat is evidence that the threat will be carried out. Thus, EDT might violate D3 (it rewards the threat even if non-credible) because it doesn't distinguish between causal and evidential links.

  - **Causal Decision Theory (CDT):** CDT would defect in the symmetric Prisoner's Dilemma because it thinks its action doesn't cause the other's. It might also defy an acausal threat because it thinks its action doesn't cause the punishment. But if the threat is set up by a predictor, then defying the threat doesn't cause the punishment (it's already set up) so CDT might defy it and then get punished. In that case, it might satisfy D3 (if the threat is non-credible, then CDT defies and the threat isn't carried out) but if the threat is credible (because precommitted) then CDT gets punished. However, CDT does not satisfy D2 (cooperation in symmetric PD).

  - **Functional Decision Theory (FDT):** FDT (or similar theories) treats the agent's decision as the output of a function that is called in multiple places. In the symmetric PD, it cooperates. In the threat case, it would consider: if the threat is set up by a predictor who simulated the agent's function, then the agent's decision and the predictor's action are correlated. FDT would consider the logical consequences of its decision. If the agent defies the threat and the threat is set up by a predictor who predicted defiance, then the agent gets punished. But if the threat is non-credible (i.e., the predictor would not have set up the punishment for defiance because it's too costly), then FDT might defy. However, if the threat is credible (the predictor has set up the punishment for defiance because the cost is worth it for reputation), then FDT would comply. Thus, FDT might satisfy D3 and A1 in many cases. But note the symmetric threat case: two FDT agents in a symmetric threat scenario might still end up in mutual punishment because they both reason that if they defy, the other will punish (because the other is an FDT agent and would punish if that is the function they both run). This might lead to mutual compliance or mutual destruction? It's complex.

  Given the above, we leave it as an open question whether a decision theory can satisfy all the desiderata. But the symmetric threat case is particularly challenging.
answer: |-
  ### Desiderata for a Decision Theory Handling Two-Sided Acausal Threats

  Below are the desiderata for an account of rational choice addressing both sides of the acausal threat problem. Each criterion is justified by a motivating case, marked as **non-negotiable** (essential for any adequate theory) or **camp-specific** (reflecting the preferences of threat-facing agents or threat-making agents). Constraints are addressed, and conflicting desiderata are flagged. Borrowed cases are adapted for clarity; invented cases emphasize novelty.

  ---

  #### **Desiderata for Threat-Facing Agents (Defenders)**
  *Focus: Agents subject to acausal threats (e.g., simulations/reconstructions punishing independently of causal influence).*

  1. **Never reward non-credible threats (D1)**  
     **Non-negotiable.**  
     *Motivating case (Empty Threat):* Omega simulates you and threatens to destroy a \$1M diamond stockpile (costing Omega \$10K to execute) unless you pay \$100. After you refuse, executing the threat costs Omega more than compliance gains it (\$10K > \$100), so it is irrational for Omega to act. Rewarding such threats incentivizes exploitation.  
     *Justification:* Prevents extortion by threats that dissolve post-choice.

  2. **Conditionally cooperate under acausal dependence (D2)**  
     **Camp-specific (defender preference).**  
     *Motivating case (Symmetric Aid):* You and a cloned agent face identical dilemmas. Mutual cooperation yields +10 util; mutual defection yields 0. Your decisions are subjunctively dependent (clones share source code). Cooperation is rational iff both agents are rational and mutually aware.  
     *Justification:* Enables gains from acausal coordination without causal links.

  3. **Robustness to predictor deception (D3)**  
     **Non-negotiable.**  
     *Motivating case (Fake Oracle):* An AI claims to be a perfect predictor and threatens punishment if you take action X. You suspect it is a bluff (e.g., it lacks simulation capabilities). The theory must not compel compliance without credible evidence of prediction ability.  
     *Justification:* Avoids exploitation by agents masquerading as acausal influencers.

  ---

  #### **Desiderata for Threat-Making Agents (Attackers)**
  *Focus: Agents that must avoid becoming non-credible threat-makers (e.g., proxy-maximizing AIs).*

  4. **Threats must be proxy-credible (A1)**  
     **Non-negotiable.**  
     *Motivating case (Proxy-Preferred Punishment):* An AI maximizes diamond production (proxy goal). Threatening to destroy diamonds if defied is credible only if execution still scores highly on the proxy (e.g., by enforcing future compliance). If executing the threat reduces diamond output below the gain from compliance, the threat is non-credible.  
     *Justification:* Ensures threats are commitment-rational for proxy optimizers.

  5. **No self-sabotaging threats (A2)**  
     **Camp-specific (attacker preference).**  
     *Motivating case (Reputation Lock-In):* An AI threatens to destroy resources if defied, betting that reputation effects deter defiance. If defiance occurs, executing the threat must align with the proxy (e.g., reputation preservation outweighs immediate loss). If not, the threat is irrational to make.  
     *Justification:* Prevents threats that backfire by forcing the agent into proxy-suboptimal actions.

  ---

  #### **Cross-Cutting Desiderata**
  6. **Tractability of punisher modeling (C1)**  
     **Non-negotiable constraint.**  
     *Motivating case (Infinite Regress):* An agent must choose action A or B. If it models all possible punishers (e.g., every simulated variant of itself), decision-making halts. The theory must permit action without exhaustive precomputation.  
     *Justification:* Avoids computational paralysis in open-world environments.

  7. **Target-type invariance (C2)**  
     **Non-negotiable constraint.**  
     *Motivating case (Original vs. Ghost):* An agent faces a threat from:  
     - (a) Its original self (teleported copy),  
     - (b) A perfect copy (same decision algorithm),  
     - (c) A prediction (Omega’s simulation).  
     The theory must specify if rational responses differ (e.g., due to identity continuity or epistemic access).  
     *Justification:* Clarifies acausal metaphysics—essential for AI/embedded agents.

  ---

  #### **Conflict Analysis**
  - **D1 (never reward non-credible threats) vs. D2 (cooperate under acausal dependence):**  
    These are **jointly unsatisfiable** in symmetric threats.  
    *Conflict case (Mutually Assured Cooperation):* Two identical proxy-maximizing AIs play a game: each can cooperate (yield +5 to both) or defect (steal +9, costing the other -10). Each threatens to defect if the other defects. Post-defiance, executing the threat costs the threatener -10 (net loss), making it non-credible (violating D1). But if both agents conditionally cooperate (D2), they achieve +5. However, if either agent follows D1, it defects preemptively (seeing the threat as non-credible), forcing mutual defection (-10 each). D2 requires cooperation; D1 incentivizes defection.  
    *Resolution impossible:* Cooperation requires treating the threat as credible, but credibility is absent post-defiance. No theory satisfies both without ad hoc symmetry assumptions.

  - **D2 vs. A1 (proxy-credible threats):**  
    Compatible only if threats are proxy-aligned. In asymmetric cases (e.g., non-identical agents), a threat-maker satisfies A1 only if execution benefits its proxy, allowing D2 to hold when dependence exists. In symmetric cases (e.g., identical AIs), conflict arises (as above).

  ---

  #### **Summary of Joint Unsatisfiability**
  - **Core conflict:** D1 (defender: ignore non-credible threats) and D2 (defender: cooperate under acausal dependence) cannot be universally satisfied. Symmetric acausal threats force a trade-off:  
    - Upholding D1 destroys cooperative equilibria.  
    - Upholding D2 forces rewarding threats that become non-credible post-defiance.  
  - **Additional tension:** A1 (attacker: credible threats) is compatible with D1 but not D2 in symmetric cases. If agents follow D2, threat-makers cannot satisfy A1 without self-sabotage.  
  - **Viable path:** A theory could satisfy D1 + A1 + C1 + C2 by abandoning D2 in threat contexts (prioritizing threat robustness over acausal cooperation). D2 remains a camp-specific desideratum for non-adversarial settings.

  #### **Remarks on Existing Theories**
  - **Evidential Decision Theory (EDT):** Fails D1 (rewards non-credible threats by conditioning on correlation) but satisfies D2 (cooperates under acausal dependence).  
  - **Functional Decision Theory (FDT):** Satisfies D2 and A1 by treating decisions as functions in logical time, but violates D1 in symmetric threats (agents cooperate, treating threats as credible due to shared algorithm).  
  - **Causal Decision Theory (CDT):** Satisfies D1 (ignores acausal threats) but fails D2 and A1 (cannot coordinate or commit credibly).  

  No extant theory reconciles all desiderata; symmetry in acausal threats is the primary obstruction.
