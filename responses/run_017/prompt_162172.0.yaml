answer: |-
  Here’s a Q&A prep sheet tailored to your audience and thesis, ordered by potential damage to your position. Replies are designed for 2-minute answers, with tactical notes. **Concede the symmetry problem upfront** (Objection #7) during your talk—it’s your strongest exhibit but also your biggest vulnerability if mishandled.

  ---

  ### **Objection #1: The Interventionist’s Rebuttal**  
  *(Quantitative PhD/ML engineer, waving a DAG)*  
  **Objection:** "Your ‘no causation without events’ is metaphysics. In causal models, omissions *are* variables—like ‘Donor1_Fund = 0’. We manipulate them, observe downstream effects, compute ATE. If setting ‘Fund = 1’ changes the outcome, that *is* causation. Why overcomplicate what works?"  
  **Reply:** "Because manipulability tracks *difference-making*, not causation. When you set ‘Fund = 0’, you’re contrasting worlds—not identifying a *causal process*. My failure to fund isn’t an event pushing the child toward death; it’s the *absence* of an event that would have diverted the process. Your model conflates prediction with ontology."  
  **Soft Spot:** Doesn’t resolve symmetry (Objection #7). Requires accepting your event-based ontology.  
  **Standalone?** Yes, but positive proposal strengthens it.  

  ### **Objection #2: The Prosecutor’s Authority**  
  *(Retired prosecutor, leaning forward)*  
  **Objection:** "I secured 11 convictions for ‘failure to act’—parents, caretakers, CEOs. Courts call it ‘criminal omission’. If the law treats omissions as causes, and it saves lives by doing so, why should we care about your philosophical distinction?"  
  **Reply:** "The law assigns *responsibility*, not causation. You convict based on *duty* (e.g., parental obligation), not causal power. We agree omissions are blameworthy! But calling it ‘causation’ smuggles in normative premises. My view explains *why* we hold people accountable—without misdescribing reality."  
  **Concede:** Legal language pragmatically uses "cause," but it’s shorthand for duty+capacity.  
  **Standalone?** Yes.  

  ### **Objection #3: The Causation Expert’s Double Prevention**  
  *(Philosophy grad student, preemption specialist)*  
  **Objection:** "Double prevention *is* causation by absence! A bodyguard fails to stop an assassin (omission 1), allowing the assassin to pull the trigger (event). The bullet kills the victim (event). If omissions aren’t causes, how does the killing happen?"  
  **Reply:** "The assassin’s shot is the cause; the bodyguard’s inaction is *failure to prevent*. We’re tempted to say ‘inaction caused death’ because there’s a clear *normative* duty to intervene. But trace the causal process: only positive events (trigger-pull, bullet-flight) transfer energy/information."  
  **Soft Spot:** Requires denying double prevention as genuine causation. **Concede this is contentious** but hold firm: "This is why I need *culpable non-prevention*—it handles these cases without metaphysics."  
  **Depends on positive proposal?** Critically.  

  ### **Objection #4: The Shallow-Pond Normativist**  
  *(Normative ethics grad, exasperated)*  
  **Objection:** "This is evasion! In the shallow pond, if I walk past a drowning child I could save, I *cause* their death by omission. My moral guilt proves it. Your ‘duty’ talk just restates the intuition you’re denying!"  
  **Reply:** "Your guilt arises from violating a duty, not causing death. Imagine two passersby: either could save the child, both omit. Neither *causes* the death (symmetry!), yet both are blameworthy. We blame them for *failing to save*, not for *causing drowning*. The causal work is done by water, not absences."  
  **Key Move:** Use their own case to showcase symmetry.  
  **Standalone?** Yes.  

  ### **Objection #5: The Humanitarian’s Pragmatism**  
  *(Bed-net distributor, arms crossed)*  
  **Objection:** "Suppose I accept this. What changes? If I tell donors ‘Your omission didn’t cause malaria deaths, but you failed a duty,’ they’ll shrug. Why destabilize motivationally effective rhetoric?"  
  **Reply:** "It changes *priority disputes*. When EA says ‘Not funding AI safety *causes* extinction,’ it implies a causal chain that doesn’t exist. My view forces us to argue honestly: ‘You have a duty to prevent foreseeable, preventable catastrophes.’ This avoids overclaiming—*and* handles cases like two sufficient donors."  
  **Soft Spot:** Risk of sounding pedantic. **Emphasize:** "I’m not against giving! I’m against faulty justifications."  
  **Standalone?** No—requires positive proposal to offer an alternative.  

  ### **Objection #6: The Kantian’s Agglomeration Worry**  
  *(Kantian grad student, frowning)*  
  **Objection:** "If duties don’t ‘agglomerate,’ morality becomes fragmented. If each of two agents has a duty to save a child, and neither acts, how can we condemn the collective failure? Your view licenses complacency: ‘Someone else will do it.’"  
  **Reply:** "We *can* condemn both! Each has an individual duty. The problem isn’t fragmentation—it’s that *collective* obligations require new premises (e.g., coordination duties). But in simple cases, two people failing their separate duties doesn’t create a new ‘group cause’ of death."  
  **Tactical Note:** This is your positive proposal’s strength: it explains fragmented blame.  
  **Depends on positive proposal?** Entirely.  

  ### **Objection #7: The Symmetry Trap (Preempt in Talk!)**  
  *(Ops researcher, smiling)*  
  **Objection:** "You say symmetry breaks counterfactuals. But interventionism handles this! If I force Donor 1 to fund (while Donor 2 still omits), the child lives. Donor 1’s omission *is* a cause. Same for Donor 2. Symmetry doesn’t refute causation—it shows redundancy."  
  **Reply:** "Ah, but if you intervene on *both* donors (setting both to ‘fund’), it’s overdetermined—the child still lives. Causality shouldn’t depend on whether we test variables singly or jointly. Interventionism gives contradictory answers. My view: neither omission *caused* death; both agents *failed to prevent* it."  
  **Crucial Move:** **Concede this upfront in your talk.** Say: "I know interventionists will say X—here’s why it fails."  
  **Damage Control:** If pressed, admit this is where theories diverge—but insist your account avoids paradox.  

  ### **Objection #8: The Edge Case: "What If Only One Can Act?"**  
  *(Economics PhD, skeptical)*  
  **Objection:** "Suppose only Donor 1 *can* fund the nets (Donor 2 is broke). Now Donor 1 omits, child dies. Surely *this* omission causes death? Doesn’t your theory collapse to counterfactuals here?"  
  **Reply:** "Still no! The cause of death is malaria. Donor 1’s omission is failure to interrupt that process. The counterfactual (‘If they funded, child lives’) shows capacity and duty—not causation. This is precisely my point: we replace ‘A caused B’ with ‘A had a duty to prevent B and didn’t’."  
  **Standalone?** Yes.  

  ---

  ### **Strategic Summary**  
  - **Strongest Objection:** #7 (Symmetry). Preempt it.  
  - **Most Damaging if Unaddressed:** #3 (Double prevention). Concede it’s a point of legitimate debate but emphasize normative duties cover it.  
  - **Rhetorical Trap:** #5 (Humanitarian). Stress you’re not attacking giving—just faulty reasoning.  
  - **Achilles’ Heel:** #1 (Interventionism). If they reject your event ontology, you lose. Anchor in science: physics has no "causation by absence."  
  - **What to Concede:** Legal language (#2) pragmatically uses "cause," and double prevention (#3) is a hard case.  
  - **Core to Protect:** Your positive proposal (#3, #5, #6 depend on it). Frame it as *enhancing* moral clarity.  
  - **What You Must Get Across:** "EA’s rhetoric often implies causal chains that don’t exist. We can—and must—argue for giving via duties, not metaphysics."  

  **Final Tip:** Open with "Nothing here implies you should give less. If anything, duties are *stricter* than causes." Disarm the room early. Good luck!
