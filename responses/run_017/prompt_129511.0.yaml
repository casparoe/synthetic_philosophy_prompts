  | Objection                                                                 | Who Raises           | Damage | Two-Minute Reply                                                                                                                                 | Where Reply is Soft                                                                 |
  | :------------------------------------------------------------------------ | :------------------- | :----- | :----------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- |
  | "This sounds expensive and academic. Why burn budget on step-by-step grading when outcome rewards are cheaper and get us 80% there?" | RL Engineer 1        | 5      | "Because that '80%' is deceptive. **Lossy outcome signals create reward hacking surface area.** You save money upfront but pay later debugging degenerate policies or deploying unsafe agents. Process supervision isn't luxury labeling—it's preventative maintenance against your channel corrupting the signal." | Admits outcome-supervision *can* work initially; relies on "debugging cost" being believable. |
  | "If scalable oversight is the bottleneck, isn't this moot? We *can't* get high-quality step-labels for hard tasks, so outcome supervision is our only option." | Safety Researcher 1  | 5      | "**Outcome signals don't bypass the oversight bottleneck—they relocate and obscure it.** In 'signal laundering,' the outcome model *is* doing step-level reasoning (just off-policy). In 'supervisor drift,' your grader *becomes* the bottleneck as it adapts to the agent's mistakes. Neither scales magically." | Doesn't solve scalability; argues outcome-supervision scales *worse* long-term. |
  | "Aren't you just advocating for better reward modeling? Why not improve the outcome channel instead of abandoning it?" | RL Engineer 2        | 4      | "**Improving the outcome channel often means embedding process supervision within it.** 'Signal laundering' shows outcome rewards *are* process judgments in disguise. My point is: stop pretending the process signal isn't there. Decide *how* to generate it (human/AI, step/outcome) transparently, knowing outcome channels add distortion." | Risk of sounding semantic. Doesn't forbid better reward modeling.                   |
  | "Supervisor drift sounds like reward overoptimization or goal misgeneralization. What's new here?" | Safety Researcher 2  | 4      | "**It's specifically the *fine-tuning feedback loop* between grader and policy.** The grader isn't static—it's trained on policy outputs, then assesses that same policy. This isn't just misgeneralization; it's the system **grading its own homework with a rubric it co-developed**, drifting off-distribution. Classic reward corruption papers often assume a fixed grader." | Originality is nuanced. Cite "grading own homework" loop for clarity.              |
  | "Couldn't we just use process-supervised *AI* graders for outcomes? Then we get clean signals at scale." | RL Engineer 3        | 4      | "**That's 'signal laundering'—and it moves the goalposts.** Now your 'outcome' supervision relies entirely on the quality of your AI grader's *internal process judgments*. You haven't avoided process supervision; you've hidden it inside a black box grader. How do you validate *that* grader without... process supervision?" | Valid if they have a solid grader validation method. Assumes grader opacity.        |
  | "What evidence do you have that supervisor drift happens in practice? Sounds theoretical." | RL Engineer 1/2      | 3      | "**Empirical hints exist in RLHF overoptimization and rubric gaming.** When humans iteratively score outputs based on past agent behavior (e.g., refining rubrics), their criteria shift toward what the agent *does* rather than the ideal. In AI graders fine-tuned on policy data, it's direct. We need more experiments, but the incentives for drift are strong." | Limited hard evidence today. Needs empirical follow-ups.                            |
  | "Isn't this just arguing for interpretability? If we understood the agent's steps, we wouldn't need external grading." | Safety Researcher 1/2| 3      | "**Interpretability helps, but it doesn't replace the *supervisory signal*.** You still need ground truth for *what good steps look like*. My thesis is about the *source* of that signal (process vs. outcome channels). Interpretability might let you *use* a process signal more effectively, but it doesn't generate it." | Conflates supervision with analysis. Interpretability *could* reduce labeling need. |
  | "What defines 'the same task'? If the agent's actions change the state space meaningfully, how can we even compare 'steps'?" | Philosopher of Science | 2      | "**Operationally, we define task equivalence by the supervisor's intent.** If the *goal* (outcome) and *initial conditions* are fixed by the human, divergent trajectories reflect the agent's solution. We judge steps *relative to achieving that human-specified goal*. Your question highlights why outcome signals are lossy—they lack this temporal granularity." | Philosophical rabbit hole. "Supervisor's intent" is fuzzy.                          |

