answer: |-
  Here’s a complete, self-contained example designed for your seminar discussion, based on the Necker cube—a classic ambiguous figure in psychology and perception. It fits all your criteria and avoids the pitfalls you mentioned.

  ---

  ### **The Case: The Necker Cube**
  **Scenario (for your slide):**  
  "Consider a simple line drawing of a cube, like the one below. Two people—both experts in visual perception—look at it. They agree it’s a cube drawing and understand the conventions of line-based representation. However, they disagree on its 3D orientation:  
  - **Interpreter A** insists it’s oriented 'downward' (front face at the bottom, as if viewed from above).  
  - **Interpreter B** insists it’s oriented 'upward' (front face at the top, as if viewed from below).  
  Neither can convince the other, even with unlimited time, knowledge of the drawing conventions, or computational tools to simulate it. The cube cannot simultaneously have both orientations in 3D space—they’re incompatible."  

  *(Include a standard Necker cube drawing: a simple 12-line wireframe cube with no shading, textures, or perspective cues.)*  

  ---

  ### **Walkthrough: Frame, Outer, and Inner Messages**
  For **both interpreters**, the frame and outer messages are identical:  
  - **Frame message**: "This is a line drawing representing a 3D object." (They agree it’s an artifact meant to depict a cube, not random lines or a 2D pattern.)  
  - **Outer message**: "Lines represent edges; junctions represent vertices; parallel lines imply depth; no occlusion/shading cues." (They share the same code for decoding line drawings into 3D structures.)  

  **Inner messages diverge**:  
  - **Interpreter A’s inner message**: "A cube viewed from above, with face X as the front bottom face."  
  - **Interpreter B’s inner message**: "A cube viewed from below, with face Y as the front top face."  
  These are incompatible because the cube’s spatial orientation (e.g., which face is "front" and its depth relationship) cannot be both at once in Euclidean space.  

  ---

  ### **Load-Bearing Feature and Collapse Test**
  - **Load-bearing feature**: The drawing lacks **monocular depth cues** (e.g., shading, perspective, occlusion). This creates an inherent structural ambiguity in depth perception.  
  - **Collapse test**: Add a single depth cue (e.g., shade the "bottom" face darker). Now both interpreters agree on the orientation—it’s boring. The ambiguity vanishes because the artifact *plus* the cue fully determines the inner message. Remove the cue, and the disagreement resurges.  

  ---

  ### **Strongest Objection & Response**
  - **Objection**: "The artifact and code *do* fully determine the inner message! The lines geometrically constrain the cube’s edges, and the code (line-drawing conventions) implies a unique 3D structure. The interpreters are just failing to compute it correctly—it’s *their* error, not ambiguity."  
  - **Your response**: "If the code alone determined the orientation, why does the Necker cube flip spontaneously for a *single* observer? The lines and code underdetermine depth—they specify edge connections but not which face is 'front' or 'back' in depth. Even perfect computation (e.g., a 3D renderer) outputs two valid solutions. The artifact *constrains* (it must be a cube), but the code doesn’t resolve the orientation—that’s supplied by the interpreter."  

  ---

  ### **What the Case Can’t Show**
  1. **It doesn’t generalize to all meaning**: This is about perceptual representation, not linguistic/symbolic meaning (e.g., words or codes).  
  2. **It doesn’t eliminate the artifact**: The lines *do* fix parts of the meaning (e.g., "it’s a cube, not a sphere"). The point is that the artifact *alone* isn’t sufficient for the *entire* meaning.  
  3. **It’s not about "no meaning"**: Meaning exists, but it’s distributed—partly in the artifact, partly in the interpretive act.  

  ---

  ### **Handling "Meaning is in the Whole Chain"**
  - **Is it a cop-out?** Yes, if used to dodge the distribution question. No, if it acknowledges the interaction.  
  - **How to respond in the room**:  
    - "Agreed—meaning *emerges* from the chain. But let’s dissect it: In this case, the *cube structure* is fixed by the artifact (remove a line, and it’s not a cube). The *orientation* requires the interpreter (even with the artifact/code, it’s ambiguous). So is the chain ‘flat,’ or do some links contribute more to specific aspects?"  
    - Push further: "If meaning is *only* in the chain, why can’t we force agreement here? What’s missing in the chain?" (Answer: The interpreter’s perceptual contribution isn’t dictated by the artifact/code.)  

  ---

  ### **The 20-Minute Question to Prep For**
  **"But in real life, context disambiguates this! Doesn’t that prove meaning is in the artifact + context?"**  
  - **Why it’s potent**: It challenges the "no missing context" rule and could derail the example.  
  - **Your response**:  
    1. "Context helps, but it’s not *in* the artifact. Here, we’ve isolated the artifact/code—no context exists. The point is: Even with perfect code access, ambiguity persists because the artifact *underdetermines* meaning."  
    2. "Context shifts the frame (e.g., if this cube is in an ‘upward-facing’ diagram). But in our case, the frame is fixed (‘this is a cube drawing’). The disagreement survives *because* context can’t override the structural ambiguity—it’s unresolvable by design."  
    3. "This shows that meaning isn’t *inherent*; it’s *assigned*. Context is just another interpreter input!"  

  ---

  ### **Why This Works for Your Goals**
  - **Splits "location of meaning"**:  
    - "In the object": The lines *force* the cube structure (try seeing it as a sphere—impossible).  
    - "In the interpreter": The orientation isn’t in the lines; it’s constructed by the viewer (the flip proves this).  
  - **Avoids your exclusions**:  
    - Not ambiguity/vagueness: It’s structural underdeterminacy (depth cues missing), not wordplay.  
    - Not fixable: Adding context would *change the frame*, violating the setup.  
    - Not about competence: Both interpreters are experts with full code access.  
  - **Pedagogical punch**: Visually intuitive, no jargon—students *feel* the flip, making the abstract concrete.  

  **Time permitting**: Show the cube flipping live (use an animated GIF) to prove the inner message isn’t static. Highlight how GEB’s phonograph analogy (grooves as fixed, music as emergent) mirrors this.
