  ### Document: Decision Rule for Citizens' Assembly on Housing and Transport Policy  
  *Prepared by the Working Group via Adversarial Collaboration*  

  #### Section 1: Agreed Claims  
  Both camps ("Reasons First" and "Verdict First") endorse the following statements:  

  1. **The Discursive Dilemma Illustrates a Trade-off**:  
     - The classic three-person example demonstrates that premise-based and conclusion-based aggregation can yield conflicting outcomes.  
       - *Example*: Three members vote on P ("emissions cut ≥15%"), Q ("costs fall disproportionately on lower-income households"), and the verdict ("adopt?" per doctrine: adopt iff P ∧ ¬Q).  
         - Member 1: P=true, Q=false → Verdict=true (adopt).  
         - Member 2: P=true, Q=true → Verdict=false (reject).  
         - Member 3: P=false, Q=false → Verdict=false (reject).  
       - Premise-based: P wins (true, 2–1), ¬Q wins (true, 2–1) → Verdict=true (adopt).  
       - Conclusion-based: Verdict loses (false, 2–1) → Reject.  
     - This divergence arises from logical constraints, not faulty reasoning. Both methods are defensible but prioritize different values: collective consistency in reasons vs. majority will on the verdict.  

  2. **Impossibility Results Define Boundaries**:  
     - Arrow’s Theorem and the Doctrine Paradox (List-Pettit) confirm that no aggregation rule can simultaneously satisfy universal domain, collective rationality, anonymity, and independence. Our choice must thus accept trade-offs (e.g., relaxing independence for premise-based, relaxing collective rationality for conclusion-based).  

  3. **Partial Deferral Introduces Unique Challenges**:  
     - When 1/3 of the assembly defers to a technical panel on P but votes on Q, premise-based aggregation uses inputs from non-identical subsets. This can produce outcomes misaligned with individual judgments (see Section 3), but this is a structural consequence of deferral, not a flaw in premise-based logic.  

  4. **Doctrine Changes (Q vs. Q*) Are Orthogonal**:  
     - Whether the doctrine uses Q ("disproportionate costs") or Q* ("unjust costs") is a separate policy decision. The aggregation rule must apply neutrally to the chosen doctrine. However, the choice of doctrine can flip outcomes independently of the aggregation method.  

  5. **Precedent Matters**:  
     - Early decisions under either rule will shape later cases. Legitimacy and perceived fairness are critical to the assembly’s credibility.  

  6. **No Aggregation Method Guarantees All Desirable Properties**:  
     - Premise-based risks "minority verdicts" (e.g., adoption opposed by a majority).  
     - Conclusion-based risks "reason-incoherence" (e.g., adoption without collective agreement on premises).  
     - Both are "prices of admission" inherent to group decision-making.  

  #### Section 2: Disagreements Table  
  Each camp’s position is stated in its own terms, without caricature.  

  | Issue | "Reasons First" Camp (Premise-Based Aggregation) | "Verdict First" Camp (Conclusion-Based Aggregation) |  
  |-------|--------------------------------------------------|-----------------------------------------------------|  
  | **Core Priority** | The assembly’s role is to deliver a *reasoned justification* for the city. The verdict must derive logically from collectively endorsed premises to ensure public accountability. | The assembly’s mandate is to decide on *adoption*. The verdict reflects the majority’s will on the ultimate question, which may incorporate nuanced reasoning beyond P and Q. |  
  | **Handling the Doctrine** | The doctrine (P ∧ ¬Q) is a logical rule. Aggregating premises and applying the rule ensures the group’s verdict aligns with its collective reasons. A verdict contradicting these reasons is irrational and delegitimizes the assembly. | The doctrine guides *individual* judgments. Aggregating the verdict respects that members may apply the doctrine holistically (e.g., trading off P and Q). Routing through premises risks "doctrine capture" by agenda-setters. |  
  | **Response to Discursive Dilemma** | The dilemma shows why conclusion-based aggregation is dangerous: it allows a majority verdict (reject) that contradicts the group’s own premises (P and ¬Q are both affirmed). This inconsistency undermines the assembly’s purpose. | The dilemma shows why premise-based aggregation is undemocratic: it forces adoption when 2/3 reject the measure, overriding majority will due to arbitrary premise bundling. This is a bug, not a feature. |  
  | **Partial Deferral Issue** | Deferral on P is acceptable; the technical panel’s P is input like member votes. Premise-based aggregation cleanly integrates this, ensuring the verdict respects both expert input (P) and collective judgment (Q). | Deferral exacerbates premise-based issues: mixing expert and member inputs for different premises can create "hybrid" judgments no member holds (see Section 3), amplifying legitimacy risks. Conclusion-based uses a consistent electorate (all members) for the verdict. |  
  | **Doctrine Flexibility** | Premise-based adapts seamlessly to doctrine changes (e.g., Q*). The rule aggregates votes on the premises *as defined*, ensuring doctrinal consistency. | Conclusion-based is robust to doctrine shifts: members internalize the doctrine when forming verdicts, so aggregation focuses on the mandate ("adopt?"). Premise-based lets doctrinal wording dictate outcomes. |  

  #### Section 3: Partial Deferral and Premise-Based Aggregation  
  We construct a minimal example (5 members) to isolate the effect of partial deferral:  
  - **Technical panel rules**: P = true (e.g., emissions cut ≥15% is confirmed).  
  - **Assembly votes on Q and verdict**: 2 members defer on P (accepting P=true), 3 do not defer.  
    - Member A (non-deferring): P=true, Q=true → Verdict=false (reject).  
    - Member B (non-deferring): P=true, Q=false → Verdict=true (adopt).  
    - Member C (non-deferring): P=false, Q=false → Verdict=false (reject).  
    - Member D (deferring): Q=true → Verdict=false (P=true, so P ∧ ¬Q = false).  
    - Member E (deferring): Q=false → Verdict=true (P=true, so P ∧ ¬Q = true).  

  **Premise-based aggregation**:  
  - P: Majority of non-deferring members (A, B, C) → P=true (2–1: A/B true, C false).  
  - Q: Majority of all members → Q=false (2–3: B/E false, A/C/D true).  
  - Doctrine: P ∧ ¬Q = true ∧ true → Adopt.  

  **Analysis**:  
  - The collective judgment (P=true, Q=false, Adopt) is held only by Member B.  
  - No individual holds the *exact* path to this outcome:  
    - The P-aggregation ignores deferring members (D, E), while Q-aggregation includes them.  
    - Member E (deferring) endorsed Q=false and Adopt, but had no say on P.  
    - Members A, C, and D (majority) reject adoption but are overruled.  

  **Is this a pathology?**  
  - **Not a pathology of premise-based aggregation**: The outcome is logically consistent and stems fairly from the deferral rule. It reflects a trade-off: deferral streamlines input but dilutes individual control.  
  - **But a legitimacy risk**: The verdict (Adopt) contradicts 3/5 members’ verdicts and relies on a P-judgment made without deferring members’ input. This could erode trust if repeated.  

  #### Section 4: Cruxes – Concrete Tests for Disagreement  
  Cruxes are designed as hypothetical voting profiles. Both camps agree these outcomes would validate/invalidate their positions. Predictions are sealed in advance.  

  **Crux 1: The Overridden Majority**  
  - *Scenario*: 100 members; 60 vote Reject based on Q=true (even if P=true), 40 vote Adopt (P=true, Q=false). P wins 55–45; ¬Q wins 52–48. Doctrine implies Adopt.  
    - **"Reasons First" prediction**: Adopt is correct. The majority’s rejection is irrational given their collective premises.  
    - **"Verdict First" prediction**: Reject should prevail. The majority’s verdict is unambiguous and reflects their will.  
    - *Test*: If assembly members perceive Adopt as illegitimate, it favors "Verdict First." If they accept it as reasoned, it favors "Reasons First."  

  **Crux 2: Doctrine Change with Fixed Preferences**  
  - *Scenario*: Same 100 members. Under doctrine P ∧ ¬Q, 55 vote Adopt, 45 Reject. If doctrine changes to P ∧ ¬Q*, 50 vote Adopt, 50 Reject (due to differing views on Q vs. Q*).  
    - **"Reasons First" prediction**: Premise-based adapts: with Q*, adoption hinges on aggregated Q*. Outcome may flip, but this is faithful to the new doctrine.  
    - **"Verdict First" prediction**: Conclusion-based is stable: verdicts shift as members internalize Q*, avoiding flip if majority intent is unchanged.  
    - *Test*: If members feel the doctrine change manipulatively alters outcomes under premise-based, it favors "Verdict First." If they accept it as principled, it favors "Reasons First."  

  **Crux 3: Partial Deferral Under Stress**  
  - *Scenario*: Technical panel: P=true. 10 non-deferring members split 6–4 against adoption; 5 deferring members split 3–2 for adoption.  
    - Premise-based: P=true (non-deferring majority), Q=? (depends on votes).  
    - Conclusion-based: Verdict tally determines outcome.  
    - **"Reasons First" prediction**: Premise-based ensures verdict aligns with premises, regardless of deferral.  
    - **"Verdict First" prediction**: Conclusion-based prevents deferring members’ verdicts from being overridden by non-deferring premises.  
    - *Test*: If deferring members protest premise-based outcomes as undemocratic, it favors "Verdict First." If they accept it as respecting expert P, it favors "Reasons First."  

  #### Section 5: Analysis of the Compromise Proposal  
  **Proposal**: Run both methods. If they agree, implement the verdict. If they disagree, the measure fails (status quo stands).  

  - **"Reasons First" Position**: Conditionally acceptable.  
    - *Why?* Disagreement signals a lack of robust consensus, making status quo safer. However, it sacrifices reasoned outcomes when premise-based adoption is overridden (e.g., Crux 1).  
  - **"Verdict First" Position**: Conditionally acceptable.  
    - *Why?* It prevents "minority verdicts" but risks blocking measures with majority verdict support due to premise disagreements (e.g., if conclusion-based adopts but premise-based rejects).  
  - **Does It Resolve the Disagreement?**  
    - **No**: It relocates conflict to edge cases. Both camps still advocate their method as primary; the compromise is a truce, not a resolution.  
    - **Worse, it may harm legitimacy**: Frequent failures due to disagreement could frustrate members and the public, portraying the assembly as indecisive.  

  #### Section 6: Non-Verbal Disagreements  
  - **Merely verbal**: Both camps agree the assembly must deliver defensible decisions. Disputes over "rationalization" vs. "reasons" are semantic.  
  - **Non-verbal core**:  
    - **Fundamental tension**: Is the assembly a *reason-giving institution* ("Reasons First") or a *decisive body* ("Verdict First")?  
    - **Empirical disagreement**: Will premise-based aggregation foster long-term trust through consistency, or breed cynicism by overriding majorities?  
  - **Path forward**: Test cruxes in early assembly sessions; review outcomes to guide rule refinement.  

