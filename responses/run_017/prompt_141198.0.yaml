  - Verdict: true and true → true (adopt)

  Conclusion-based:
  - Verdicts: A true, B false, C false, D true → true (A and D), false (B and C) → tie in verdict. If we break tie to reject, then reject. If we break tie to adopt, then adopt. But we must define a tie-breaking rule.

  This is not clean.

  Perhaps the partial deferral doesn't create new problems beyond the classic dilemma.

  For the crux, we can use the classic dilemma profile and ask which method is better.

  ### Step 5: The Compromise
  Proposal: Run both procedures. If they agree, that's the outcome. If they disagree, then the measure fails (status quo stands).

  - "Reasons first" camp: Might accept this because in case of disagreement, the measure fails, which is conservative. But they believe that the premise-based outcome is the correct one, so they might see this as sometimes yielding the wrong outcome when the premise-based says adopt but conclusion-based says reject.
  - "Verdict first" camp: Might accept because when they disagree, it fails, which avoids the situation where the majority verdict is overridden. But they might be concerned that when the conclusion-based says adopt and premise-based says reject, they fail even though the majority wants to adopt.

  Both camps might see this as a workable compromise, but it doesn't resolve the fundamental disagreement. It just avoids the contentious cases by failing the measure.

  In the classic dilemma, the compromise would fail the measure: premise-based says adopt, conclusion-based says reject → they disagree → fail. But the "reasons first" camp wants adopt, and the "verdict first" camp wants reject, so the compromise is a third outcome (fail) that neither camp prefers. But fail is a form of reject? Not exactly: the status quo stands, which is a rejection of the new measure.

  In the assembly, the vote is to adopt or not. If not adopted, status quo. So fail here means not adopt.

  In the classic dilemma:
  - Conclusion-based: reject (status quo)
  - Premise-based: adopt (change)
  - Compromise: they disagree → so reject (status quo)

  So the outcome is the same as conclusion-based. The "reasons first" camp would be unhappy.

  If we have a case where premise-based rejects and conclusion-based adopts, then compromise would reject, which is what premise-based wants, but conclusion-based would be unhappy.

  So the compromise doesn't favor one camp over the other, but in any disagreement, the measure fails, which is a conservative outcome.

  Both camps might sign this as a practical solution, but it doesn't resolve the philosophical disagreement.

  ### Step 6: Merely Verbal Parts
  The disagreement is not merely verbal. It stems from a fundamental difference in what the camps see as the primary output of the assembly: a reasoned decision or a verdict. However, there might be agreement on the following:

  - Both agree that the doctrine is binding.
  - Both agree that the aggregation method must be chosen in advance.
  - Both agree that the method should be transparent and perceived as legitimate.

  The verbal part might be about what counts as "inconsistent": the "reasons first" camp sees a verdict that contradicts the group's premises as inconsistent, while the "verdict first" camp does not care about that consistency but cares about the majority verdict.

