  | **Handling the Doctrine** | The doctrine is a logical rule that must be applied to the group's collective judgments on the premises. The group must be consistent in its reasoning. | The doctrine is a guide for individual members to form their verdict. The group's verdict is what matters, and it is acceptable if the majority's verdict does not align with the logical combination of the majority's premises. |
  | **Critique of the Other Method** | Conclusion-based aggregation ignores the group's reasoning and may lead to a verdict that contradicts the group's own premises, which is irrational and undermines the assembly's purpose of providing reasoned decisions. | Premise-based aggregation can override the majority's verdict on the very question the assembly was asked (adopt or reject) because of how the ballot is structured. This is undemocratic and a flaw. |
  | **Response to the Discursive Dilemma** | The dilemma shows the importance of collective rationality. The premise-based outcome (adopt) is the only consistent one because the group has accepted P and rejected Q. The conclusion-based outcome (reject) is inconsistent with the group's premises. | The dilemma shows the danger of premise-based aggregation: a majority of the assembly (2 out of 3) rejects the measure, but the premise-based method forces adoption. This is a bug because it lets a minority of voters (on the conclusion) impose a decision that the majority disagrees with. |
