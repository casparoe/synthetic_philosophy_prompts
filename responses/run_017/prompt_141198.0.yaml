  The document should have:
  1. A numbered section of agreed claims.
  2. A disagreements table with each side's position fairly stated.
  3. The smallest example showing the partial-deferral issue with premise-based aggregation and an assessment of whether it is pathological.
  4. Cruxes: concrete cases/tests that both camps agree would bear on the disagreement, with each side's prediction.
  5. Head-on discussion of a compromise (if both procedures disagree, the measure fails).

  We avoid bibliographies and focus on arguments.

  Let's break it down.

  ### Step 1: Agreed Claims (Numbered Section)
  Both camps can agree on the following:

  1. **The Discursive Dilemma**: The classic example (three-member assembly) shows that premise-based and conclusion-based aggregation can lead to different outcomes. 
     - Example: 
       - Member 1: P true, Q false → Adopt (true)
       - Member 2: P true, Q true → Reject (false)
       - Member 3: P false, Q false → Reject (false)
     - Premise-based: P gets majority (true: members 1 and 2), Q gets majority (false: members 1 and 3) so not-Q is true → Adopt (P and not-Q).
     - Conclusion-based: Majority rejects (only member 1 adopts) → Reject.
     - Thus, the two methods conflict.

  2. **The Impossibility Results**: Both camps agree that the standard impossibility results (like the one by List and Pettit) show that no aggregation rule can satisfy universal domain, collective rationality, anonymity, and independence simultaneously for all profiles. This is a fundamental constraint.

  3. **The Role of the Doctrine**: The assembly is instructed to use the doctrine (adopt iff P and not Q). Both camps agree that the doctrine is fixed and binding, but they disagree on how to aggregate the votes to apply the doctrine.

  4. **The Deferral Complication**: When some members abstain on P (deferring to a technical panel) but vote on Q, the set of voters for P and Q may be different. This can lead to situations where the premises are decided by non-identical groups.

  5. **The Doctrine Rewrite Issue**: If the doctrine is rewritten to use Q* (unjust) instead of Q (disproportionate cost), then the votes on Q* might differ from Q, potentially changing outcomes. Both camps agree that the choice of doctrine (Q vs Q*) is a separate issue from the aggregation method, but note that the aggregation method must be applied to whatever doctrine is in place.

  6. **Precedent Setting**: Early decisions will set precedents for later ones. Therefore, the consistency and perceived legitimacy of the aggregation method matter for the assembly's ongoing work.

