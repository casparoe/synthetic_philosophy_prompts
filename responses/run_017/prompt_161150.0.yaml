  We are going to restate the Everettian probability problem in the vocabulary of sequential Monte Carlo (SMC) and approximate Bayesian inference.

   Key vocabulary:
   - Particles: represent hypotheses or states.
   - Weights: importance weights assigned to particles, which can be unnormalized or normalized.
   - Resampling: process of replacing particles with new ones to focus on high-weight regions.
   - Proposal vs. target: the proposal distribution is used to generate particles, and the target is the desired distribution (usually the posterior). Weights correct for the mismatch.
   - Typical set: region of high probability mass under the target.
   - Measure concentration: phenomenon where a probability measure becomes concentrated in a small region as dimensionality increases.

   The dispute: In the Everettian (many-worlds) interpretation, the wave function evolves unitarily and branches. The problem is how to recover the Born rule (probabilities proportional to the squared amplitude) from a picture where all branches are equally real.

