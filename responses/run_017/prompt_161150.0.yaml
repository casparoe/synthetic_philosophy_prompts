   1. Decision-theoretic (Deutsch, Wallace): An agent who knows she is about to branch (and will experience each branch) should bet as if the squared amplitudes were chances. In SMC terms, this is like an agent assigning betting odds based on normalized importance weights.

   2. Envariance (Zurek): When two systems are entangled and the state is symmetric (equal amplitudes for two branches), swapping the systems leaves the state invariant, so the probabilities must be equal. This is generalized to unequal amplitudes by considering fine-graining.

   3. Gleason-type: If we require that the probability assignment to projection operators (yes/no questions) is additive and independent of the choice of basis (non-contextual), then the only possibility is the squared amplitude.

   Translation to SMC:

   - The wave function is a collection of branches (particles) with complex amplitudes. Each branch is a particle, and the amplitude is used to compute the weight.
   - The "naive branch counting" approach would assign equal weight to every branch (like counting particles without regard to their importance). This corresponds to using a uniform proposal and then not weighting by the target density.
   - The Born rule says: the weight of a branch is the squared modulus of its amplitude. Then we normalize.

   Where does the squaring live?
     In SMC, we design the weights to make the particle set approximate the target distribution. The squaring is forced by the requirement that the probability measure must be additive and non-contextual (Gleason) or by symmetry (envariance). In the decision-theoretic approach, it is forced by the rationality of the agent.

     The closest analogue: In SMC, the weights are defined by the ratio of target to proposal. In the Everettian case, the "target" distribution is the Born rule (squared amplitudes) and the "proposal" is the branching structure (which would naturally lead to branch counting). The squaring is the correction factor. But in SMC we can choose the proposal arbitrarily. In the Everettian case, the claim is that the proposal (the branching structure) is fixed by the unitary dynamics, and the correction (squaring) is forced by rationality or consistency.

     Where it breaks: In SMC, we can choose the proposal to make the weights constant (if we sample from the target) and then we don't need to weight. But in the Everettian picture, the branching structure (the proposal) is fixed by the physics, and we are forced to weight by the squared amplitude to get the correct probabilities. The break is that in SMC we have freedom in the proposal, but in Everett we don't.

