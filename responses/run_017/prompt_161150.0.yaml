answer: |-
  ### Translation to SMC Vocabulary

  **Core Dispute:**  
  In Everettian quantum mechanics, the wave function branches unitarily. The dispute concerns how to assign probabilities to branches. Naive branch counting treats all branches equally (like uniform particle weights), but the Born rule assigns weights proportional to squared amplitudes. SMC analogues:
  - **Branches** = **Particles** (hypotheses in state space).  
  - **Amplitudes** = **Unnormalized importance weights** (before squaring).  
  - **Born rule** = **Normalizing squared weights** (target measure).  
  - **Branch counting** = **Resampling uniformly** (ignoring weights, leading to bias).  

  **Three Moves Translated:**  
  1. **Decision-theoretic (Deutsch/Wallace):**  
     - An agent in a branching event is like an SMC algorithm with **known proposal distribution** (branching structure) but **unknown target weights**.  
     - Rational betting requires weighting branches by squared amplitudes, just as SMC requires weighting particles by the ratio of target/proposal.  
     - *Break:* Assumes a fixed, non-interfering branch set ("stable outcomes") for preferences. Interference (recombination) violates this (see wrinkle #2).  

  2. **Envariance/Symmetry (Zurek):**  
     - Entangled states with equal amplitudes force equal weights, akin to **symmetry in proposal design**: if two particles have identical paths (e.g., symmetric proposal), weights must be equal.  
     - *Distortion:* SMC weights are designer-defined; envariance claims physics *forces* symmetry. No SMC analogue for "fine-graining" unequal amplitudes into symmetric subspaces.  

  3. **Gleason-Type (Non-contextuality):**  
     - Requiring probability assignments to be additive and basis-independent is like demanding SMC weights remain consistent under **resampling or recombination**.  
     - Squared amplitudes are the only measure satisfying this, just as **normalized importance weights** are the only consistent way to handle particle sets across iterations.  
     - *Break:* Gleason assumes a Hilbert space structure; SMC has no analogue for phase cancellation.  

  ### Explicit Handling  

  **1. Where does squaring live?**  
  - In SMC, squaring is **exogenous**: weights are designed as (target/proposal).  
  - In Everett, squaring is **endogenous**: claimed forced by physics (envariance, non-contextuality).  
  - **Closest analogue:** Weights as the **likelihood ratio** in Bayesian inference.  
  - **Break point:** SMC allows arbitrary weights (e.g., absolute amplitudes). Everettians argue unitarity and decoherence constrain weights to squared amplitudes—a claim with no direct SMC counterpart.  

  **2. Wrinkle: Branch Interference**  
  - Branches recombining (e.g., interferometer) = **weights interfering** (signed/negative weights).  
  - **Breaks decision theory:** Preferences require a stable outcome space, but interference makes branches non-stationary.  
  - **SMC gap:** SMC weights are strictly non-negative; no mechanism for cancellation. This is where SMC vocabulary **stops**—interference is quantum-specific. Everettians address this via decoherence (post-hoc branch stabilization), but this is not derived from first principles in the translations.  

  ### Residue Report  
  - **Translated cleanly:**  
    - Born rule ≈ Normalizing squared weights.  
    - Branch counting ≈ Uniform resampling (bias if weights skewed).  
    - Decision theory ≈ Rational betting with normalized weights.  
  - **Translated with distortion:**  
    - Envariance ≈ Symmetry in proposal, but SMC doesn’t force symmetry physically.  
    - Gleason ≈ Additivity under resampling, but SMC lacks basis-dependence.  
  - **No expression in SMC:**  
    - Interference (signed weights), basis dependence (branch definition), decoherence as weight stabilizer.  
    - **Gap:** SMC vocabulary lacks quantum phase dynamics. This is a **vocabulary limitation**, exposing Everettian assumptions (e.g., decoherence as a given).  

  **Verdict on Hunch:**  
  Your hunch is half-right: The Born rule is indeed "normalize your importance weights" (squared amplitudes). But the dispute isn’t *just* notation—it’s about why weights *must* be squared and how branches are defined. Interference and basis dependence are genuine physics gaps that SMC can’t capture, and the derivations (especially decision theory) rely on unstable premises.  

  \answer{genuine-standoff}
