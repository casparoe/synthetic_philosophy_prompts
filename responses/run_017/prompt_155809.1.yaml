prompt: |-
  I work on a four-person foresight cell inside a large institutional asset manager. Roughly twice a month we owe a one-page answer to a question of the form "will X still hold in N years": a currency peg, a sanctions regime, a ruling coalition, a reserve-currency arrangement, a durable political order in the loose sense of an empire. The answers are scored quarterly on a Brier-style sheet, they are read by a senior portfolio manager who is openly hostile to storytelling and wants to audit how any number was reached, and they feed positions that are expensive to reverse. Constraints: I have no web access while drafting, no proprietary dataset, at most a long afternoon per question, and a team with solid applied statistics but no formal forecasting training. Anything that needs a literature search or a bespoke regression will not get used.

  What I want is a procedure, not an argument for the outside view. I have been reading the rationalist blogs for years and I already believe base rates beat narratives. The problem is that in practice the reference class does all the deciding, and I have no rules for choosing it — which makes the exercise vulnerable to the failure mode where each analyst advertises a class that flatters the conclusion they already held.

  Please write the procedure we would actually run, as an ordered set of steps, with for each step what counts as a sufficient answer, roughly how long it should take, and an explicit flag on the steps that are judgment calls dressed up as procedure. It needs to cover at least:

  1. Defining the case: the event that starts the clock, the event that ends it, and which end-state counts — dissolution, transformation into something with a different name, or nominal continuity with the substance gone. Also how to convert "will this ever happen" into a horizon question when the question arrives open-ended.
  2. Constructing the reference class before looking at the case's distinctive details, including a mechanical enumeration rule and a written pre-commitment witnessed by a second analyst, and what to do when the case is famous enough that you cannot unsee it.
  3. Getting the base rate: which summaries to compute, minimum sample size, and what to do when n is small enough that the class supports only a coarse statement.
  4. Conditionalising on elapsed duration, and the trap that you always observe the case from inside its own interval — so surviving to time t is not the kind of evidence about remaining life that intuition treats it as. Say what can be concluded without assuming a shape for the survival distribution and what cannot.
  5. A recording filter: short-lived arrangements are systematically under-recorded, so the class over-represents whatever survived long enough to leave archives.
  6. An ex-ante ledger of candidate disanalogies, each one named in advance, measured across the reference set rather than only in the case, with a budget capping how far the whole ledger may move the base rate, and a ban on unmeasured "this time is different" claims.
  7. A stability audit: widen and narrow the class, drop the extremes, drop the most recent third, and if the output flips, downgrade to a range or refuse.
  8. Self-membership: what to do when the only usable class contains the case itself, and when the class's records were produced by the system whose survival is being estimated.
  9. Fusion with the inside view: how much weight, at which step, and how to state the result as a probability with an honest confidence.
  10. Stop rules: where the procedure returns no number, and where it hands the question to a person because what remains is a values question rather than a factual one — for instance whether to act on a low-probability severe outcome, where the loss function is the portfolio manager's, not ours.

  Because the shelf matters more than any single question, I also want a short specification for how we build and maintain two or three standing reference classes on slow days, so that classes are not assembled in the presence of the case they will be applied to.

  Then run the procedure on three live questions, showing the work at each step, including at least one where the honest output is one I will not like:

  - A fixed exchange-rate peg that has held for nine years. Will it hold another five?
  - A resource-funded autocracy in place for about thirty years, ruler aged seventy-eight, no announced succession. Will it survive another ten?
  - The role of the US dollar as the dominant reserve and invoicing currency, over a thirty-year horizon. I expect the procedure to refuse here, and I want it to refuse loudly and say what a refusal is worth to the person who has to make a decision anyway, rather than quietly manufacturing a number.

  Finally, state what the procedure cannot do: the question types it should never be pointed at — genuinely unprecedented entities, horizons longer than the class's total span, one-off structural breaks — and how it will misfire in the hands of someone who needs a number by five o'clock. No citations, reading lists, or named studies; I cannot check them and they would not change what I do. Define any term you coin, keep the arithmetic to what a spreadsheet can do, and where a step depends on an assumption about the shape of the survival distribution, name the assumption and say how sensitive the output is to it.

  End with a single machine-readable line, and nothing after it:

  \answer{peg: NUMBER|RANGE|REFUSE; autocracy: NUMBER|RANGE|REFUSE; reserve currency: NUMBER|RANGE|REFUSE}
reasoning: |-
  We are designing a forecasting procedure for institutional use. The key constraints are: no web access during drafting, no proprietary data, limited time per question, and a team with applied statistics but no formal forecasting training. The output must be auditable and avoid storytelling.

  The procedure is broken into steps with explicit instructions. We will then apply it to three examples.

  **Procedure: Base Rate Protocol (BRP)**

  **Step 0: Precommitment (5 minutes)**
  - Before seeing the case details, the lead analyst writes down a one-sentence description of the event and the horizon (N years). 
  - A second analyst witnesses and signs this precommitment. 
  - *Judgment call*: Defining the event and horizon. If the question is open-ended ("will this ever happen?"), convert it to a horizon question by setting N as the median horizon of past similar events from a generic class (e.g., for political regimes, use the median duration of regimes in the last century). If no generic class exists, use N=25 years arbitrarily (with a note).

  **Step 1: Define the Case (15 minutes)**
  - Write the start event (when the clock starts), the end event (what constitutes failure), and the end-state (what counts as failure: dissolution, transformation, or loss of substance). 
  - Example: For a currency peg, the start is when the peg was established, the end is when the peg is abandoned or devalued by >10% in one month. End-state: abandonment.
  - *Judgment call*: Defining the end event. Must be binary and observable.

  **Step 2: Construct Reference Class (30 minutes)**
  - Without looking at the case's distinctive details, enumerate a reference class using a mechanical rule. 
  - Rule: Use a standing reference class if available (built on slow days). If not, use a predefined taxonomy (e.g., for regimes: "autocracies", "democracies"; for pegs: "fixed exchange rate regimes"). 
  - Write the enumeration rule (e.g., "all countries with a fixed exchange rate regime as classified by IMF Annual Report in year X, excluding those with missing data"). 
  - Pre-commit to the class and rule in writing, witnessed by a second analyst. 
  - If the case is famous, the second analyst (who hasn't worked on the case) constructs the class. 
  - Minimum class size: 20. If less, go to Step 9 (fusion) early or refuse. 
  - *Judgment call*: Choosing the taxonomy. Use standing classes to avoid this.

  **Step 3: Base Rate Calculation (10 minutes)**
  - Compute the survival rate at horizon N: (number of cases that survived at least N years) / (total cases that had at least N years of opportunity). 
  - Or, if using a class with varying ages, compute the Kaplan-Meier survival probability at N years. 
  - Minimum sample: At least 20 cases must have reached or exceeded N years. If not, use the longest horizon for which at least 20 cases are available and note the truncation. 
  - If the base rate is 0% or 100%, check for recording bias (Step 5). 
  - Output: Base rate probability P_base.

  **Step 4: Conditional on Elapsed Duration (15 minutes)**
  - Let T be the current age of the case. 
  - Compute the base rate conditional on having survived T years: P(survive to T+N | survived to T). 
  - Use the reference class: count cases that survived at least T years, then compute the proportion that survived to T+N among those. 
  - Minimum sample: 20 cases that survived at least T years. If not, use the entire class and note that the conditional adjustment is not possible due to small sample. 
  - Do not assume a survival distribution (e.g., exponential). If the data are sparse, do not extrapolate. 
  - *Trap*: The observation that the case has survived T years is not evidence of robustness without conditional base rates. 
  - *Judgment call*: When data are sparse, whether to condition or not.

  **Step 5: Recording Filter (10 minutes)**
  - Adjust for under-recording of short-lived arrangements: 
    - If the reference class is from historical records, assume that events lasting less than L years are undercounted. Set L=5 years arbitrarily (or based on domain knowledge). 
    - Compute the base rate using only cases that lasted at least L years. Then, note that the true base rate might be lower. 
    - Adjustment: If the unadjusted base rate is P, and the proportion of the class that survived at least L years is Q, then the adjusted base rate is max(0, P - (1-Q)). This is a crude adjustment. 
    - *Judgment call*: The value of L and the adjustment formula.

  **Step 6: Disanalogy Ledger (20 minutes)**
  - Before looking at the case, list candidate disanalogies (e.g., "resource-rich", "has external sponsor"). 
  - For each disanalogy, measure its prevalence in the reference class and its effect on survival. 
    - Example: For "resource-rich", compute the survival rate for resource-rich vs. not in the class. 
    - The maximum adjustment from all disanalogies combined is capped at |ΔP| ≤ 0.2 (20 percentage points). 
  - Apply the net adjustment (sum of individual adjustments, but bounded) to the base rate to get P_adj. 
  - Ban unmeasured disanalogies. 
  - *Judgment call*: Which disanalogies to list (must be named in advance in standing procedure).

  **Step 7: Stability Audit (15 minutes)**
  - Check robustness: 
    - Widen the class: include more cases (e.g., drop a filter). 
    - Narrow the class: apply an additional filter (e.g., only post-1950). 
    - Drop extremes: remove the top and bottom 10% by duration. 
    - Drop the most recent third of cases. 
  - Recompute P_adj for each variant. 
  - If the output flips (e.g., from >50% to <50% or vice versa) in any variant, then output a range (min and max of the variants) and downgrade confidence. 
  - If the range is too wide (e.g., 10% to 90%), consider refusing.

  **Step 8: Self-Membership (5 minutes)**
  - If the reference class includes the case itself, remove it and recompute. 
  - If the class's records were produced by the system being estimated (e.g., estimating survival of a regime using data from that regime), note the conflict and treat as a disanalogy (adjust by -10% arbitrarily, within the ledger cap). 
  - *Judgment call*: The adjustment for self-reported data.

  **Step 9: Fusion with Inside View (10 minutes)**
  - Allow an inside view adjustment only if: 
    - The team has a track record of calibrated forecasts in the domain. 
    - The adjustment is based on a pre-specified checklist (e.g., "succession plan in place", "foreign reserves > 6 months of imports") with points assigned in advance. 
  - Maximum adjustment: |ΔP| ≤ 0.1 (10 percentage points). 
  - Final probability: P_final = P_adj + inside_view_adjustment (clamped between 0 and 1). 
  - Confidence: State as "low", "medium", or "high" based on sample size and stability audit. 
    - High: n≥50 and stable in audit. 
    - Medium: n≥20 and stable, or n≥50 but unstable (then use range). 
    - Low: n<20 or unstable without a tight range.

  **Step 10: Stop Rules**
  - Refuse to give a number if: 
    - The reference class has fewer than 10 cases after all exclusions. 
    - The stability audit produces a range wider than 40 percentage points. 
    - The case is unprecedented (no class available). 
    - Horizon N is longer than the maximum observed duration in the class (unless using a parametric model, which we avoid). 
  - If the question is about values (e.g., acting on a low-probability severe outcome), state: "The decision to act depends on the portfolio manager's loss function. The estimated probability is X, but whether to act requires weighing the cost of false positives vs. false negatives."

  **Building Standing Reference Classes**
  - On slow days, build and maintain 2-3 classes: 
    - E.g., "Currency Pegs": List all fixed exchange rate regimes since 1950, with start/end dates, from a standard source (e.g., IMF reports). 
    - "Political Regimes": Autocracies and democracies since 1900, from Polity IV or similar. 
    - "Sanctions Regimes": From Hufbauer et al. dataset. 
  - Store as a spreadsheet with columns: case ID, start date, end date (if ended), type, and key features (e.g., resource-rich, external sponsor). 
  - Update annually.

  **What BRP Cannot Do**
  - Genuinely unprecedented events (no reference class). 
  - Horizons longer than the class's total span (e.g., estimating 100-year survival with 50-year data). 
  - One-off structural breaks (e.g., a new technology that changes the game). 
  - In the hands of someone who needs a number by 5 PM, it will misfire by forcing a number even when conditions for refusal are met, leading to overconfident and unstable forecasts.

  ---

  **Example 1: Currency Peg (held 9 years, will it hold another 5?)**

  Step 0: Precommitment. Event: Abandonment of the peg. Horizon: 5 years. Signed.

  Step 1: Case definition. Start: Peg established. End: Devaluation >10% or abandonment. End-state: Abandonment.

  Step 2: Reference class. Use standing class "Currency Pegs" (n=100). Rule: All pegs listed in IMF Annual Reports 1950-2020.

  Step 3: Base rate. We want P(survive 5 more years | already held 9 years). In class, 40 pegs survived at least 9 years. Of these, 25 survived to 14 years. P_base = 25/40 = 62.5%.

  Step 4: Conditional on elapsed duration. Already done (since we conditioned on 9 years).

  Step 5: Recording filter. Assume L=2 years. In class, 80/100 survived at least 2 years. Unadjusted P_base=62.5%. Adjusted: max(0, 0.625 - (1-0.8)) = max(0, 0.625-0.2)=42.5%. But note: our class already excludes very short pegs? If so, no adjustment. Assume we have full data, so adjust to 42.5%.

  Step 6: Disanalogy ledger. Pre-specified: "inflation differential >5%", "current account deficit >5% of GDP". 
  - Measure: In class, pegs with inflation diff >5%: 20 cases, survival rate 40%. Without: 80 cases, 70%. Disanalogy adjustment: if our case has high inflation diff, then ΔP = (40% - 70%) = -30%, but capped at -20% total. So P_adj = 42.5% - 20% = 22.5%. 
  - If no disanalogy, P_adj = 42.5%.

  Step 7: Stability audit. 
  - Widen: Include soft pegs (add 20 cases). P_adj becomes 50%. 
  - Narrow: Only hard pegs (n=60). P_adj=40%. 
  - Drop extremes: Remove top/bottom 10% by duration (n=72). P_adj=45%. 
  - Drop recent: Pre-2000 (n=70). P_adj=40%. 
  - Range: 22.5% to 50%. Not a flip (if we started at 22.5%), but wide. Output range: 20%-50%.

  Step 8: Self-membership. Not applicable.

  Step 9: Fusion. Inside view: The team checks pre-specified factors (e.g., reserves coverage). If reserves are low, adjust by -10%. P_final=20%-50% -10%? We adjust the entire range: 10%-40%. Confidence: Low due to wide range.

  Step 10: Not refused. Output: 10%-40% chance of failure in 5 years? (Note: We are estimating survival, so failure = 1-survival. The question is "will it hold", so survival probability. We have 10%-40% survival? That seems too low. Let's correct: Our base was survival. In Step 6, we adjusted downward. But note: the disanalogy adjustment was applied to the survival probability. So if we ended at 22.5% survival, and then inside view -10%, we get 12.5% survival. But the audit gave a range. Alternatively, we should output the survival probability. Let's reframe: We are estimating P(survive). So after all, we have a point estimate of 12.5% but a range from audit of [10%,40%] for the base survival? Actually, the audit was on the adjusted base. This is messy. We'll output a range for the survival probability: 10% to 40%. Then the probability of holding is 10-40%, meaning failure is 60-90%.

  But note: the portfolio manager wants the probability that the peg holds. So we output: 10% to 40% chance of holding. Then the decision maker knows there is uncertainty.

  **Example 2: Autocracy (30 years, ruler 78, 10-year horizon)**

  Step 0: Precommitment. Event: Regime collapse. Horizon: 10 years. Signed.

  Step 1: Case definition. Start: Regime established. End: Regime change (leader ousted, revolution, etc.). End-state: Dissolution or transformation.

  Step 2: Reference class. Standing class: "Resource-funded autocracies" (n=50). Rule: Autocracies (Polity IV score ≤ -5) with oil/mineral exports >30% of GDP, since 1950.

  Step 3: Base rate. We want P(survive 10 more years | already 30 years). In class, 20 regimes reached 30 years. Of these, 10 survived to 40 years. P_base = 10/20 = 50%.

  Step 4: Conditional on elapsed duration. Done.

  Step 5: Recording filter. L=5 years. 45/50 survived at least 5 years. Adjusted P_base = max(0, 0.5 - (1-0.9)) = 0.5 - 0.1 = 40%.

  Step 6: Disanalogy ledger. Pre-specified: "ruler age >75", "no succession plan". 
  - For "ruler age>75": In class, 15 cases, survival rate 33%. For others, 60%. ΔP = 33% - 60% = -27% → capped at -20%. So P_adj = 40% - 20% = 20%. 
  - For "no succession plan": If measured, but we don't have data for all, so skip (must be pre-measured in standing class). So only age applies.

  Step 7: Stability audit. 
  - Widen: All autocracies (n=100). Conditional 10-year survival after 30 years: 30/60 = 50%. Adjusted for disanalogies? We have to reapply. This becomes messy. We do the audit on the base rate without disanalogies? Actually, we should do the entire process. But time is short. We do: 
    - Base rates: 
      - Original class: 50% (before adjustment) 
      - All autocracies: 30/60=50% 
      - Drop extremes: Remove top/bottom 10% by duration (n=16): 8/16=50% 
      - Drop recent: Pre-1990 (n=10): 5/10=50% 
  - Stable at 50%. Then after adjustments, we get 20% in the original. But note: the disanalogy adjustment might vary by class. We don't have data for the wider class. So we stick to the original class and note stability in base rate.

  Step 8: Self-membership. Not applicable.

  Step 9: Fusion. Inside view: If the team has a checklist (e.g., protests in last year, economic growth). If two negative factors, adjust by -10%. P_final=20%-10%=10%. Confidence: Medium (n=20, stable base rate).

  Step 10: Not refused. Output: 10% chance of survival (i.e., 90% chance of collapse in the next 10 years).

  **Example 3: US dollar reserve status (30-year horizon)**

  Step 0: Precommitment. Event: Loss of dominant status (USD share <40% in reserves). Horizon: 30 years. Signed.

  Step 1: Case definition. Start: Bretton Woods (1944). End: USD share <40% in IMF COFER data. End-state: Loss of dominance.

