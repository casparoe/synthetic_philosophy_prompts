answer: |-
  ### Base Rate Protocol (BRP) for Institutional Foresight  
  *Designed for high-stakes, auditable forecasts under constraints. Time targets assume a 3-hour session.*

  ---

  ### Procedure  
  **Step 0: Precommitment (5 min)**  
  - **Action:** Lead analyst writes: event definition (start/end events, end-state), horizon (N years), and reference class taxonomy (e.g., "currency pegs," "autocracies"). Second analyst witnesses/signs without seeing case details.  
  - **Sufficiency:** Signed one-paragraph document.  
  - **Judgment call:** Converting open-ended questions (e.g., "will this ever happen?") to a horizon. Default rule: Set N = median lifespan of the *broadest possible class* (e.g., "all modern political regimes" for regime survival). If no data, N = 25 years.  

  **Step 1: Define the Case (15 min)**  
  - **Action:** Specify:  
    - Clock-start: Event initiating the arrangement (e.g., peg established).  
    - Failure condition: Binary end-event (e.g., peg broken >10%).  
    - End-state: Choose one: (a) Dissolution, (b) Transformation (fundamental change), (c) Nominal continuity with substance gone. Default: (a) for pegs/sanctions, (b) for regimes.  
  - **Sufficiency:** Clear definitions fit in 3 bullet points.  
  - **Judgment call:** End-state choice (e.g., "Soviet Union" as dissolution vs. transformation).  

  **Step 2: Construct Reference Class (30 min)**  
  - **Action:**  
    - Use a standing class if available (see *Standing Classes* below). Else, mechanically enumerate from a pre-agreed source (e.g., "IMF Annual Reports for currency pegs").  
    - Rule: "Include all cases matching taxonomy, excluding those with missing data."  
    - Pre-commit: Write inclusion criteria. Second analyst (blind to case) verifies.  
    - If case is famous: Second analyst builds class alone.  
  - **Sufficiency:** Class list with ≥20 cases (or abort if impossible).  
  - **Judgment call:** Taxonomy choice (e.g., "resource autocracies" vs. "all autocracies").  

  **Step 3: Base Rate Calculation (10 min)**  
  - **Action:** Compute:  
    - Survival rate: \( P_{\text{base}} = \frac{\text{cases surviving} \geq N \text{ years}}{\text{cases with opportunity} \geq N \text{ years}} \).  
    - Minimum: 20 cases must have faced ≥N-year risk. Else, use maximal \( N' \) with sufficient data and note truncation.  
    - If \( n < 20 \): Output range (e.g., 20–60%) or refuse.  
  - **Sufficiency:** Single probability or range.  

  **Step 4: Conditional on Elapsed Duration (15 min)**  
  - **Action:**  
    - Let \( T \) = current age of case. Compute: \( P_{\text{cond}} = \frac{\text{cases surviving to } T+N \mid \text{ survived to } T}{\text{cases surviving to } T} \).  
    - Trap: Do **not** assume constant hazard (exponential distribution). If sample <20, skip conditioning.  
    - Conclude: Only \( P_{\text{cond}} \) is valid; avoid claims like "old things last longer."  
  - **Sufficiency:** Adjusted probability or note "insufficient data for conditioning."  
  - **Judgment call:** Handling sparse data.  

  **Step 5: Recording Filter (10 min)**  
  - **Action:** Adjust for under-recorded short lifespans:  
    - Set \( L = 5 \) years (minimum recorded lifespan).  
    - Compute \( Q = \frac{\text{cases in class lasting } \geq L}{\text{total cases}} \).  
    - Adjusted base rate: \( P_{\text{rec}} = \max(0, P_{\text{base}} - (1 - Q)) \).  
  - **Sufficiency:** \( P_{\text{rec}} \) with note on adjustment magnitude.  

  **Step 6: Disanalogy Ledger (20 min)**  
  - **Action:**  
    - Use pre-agreed ledger (e.g., for regimes: "external threats," "youth unrest").  
    - For each disanalogy: Compute its prevalence in class and its impact on survival (e.g., "cases with youth unrest: survival rate 40% vs. 60% overall").  
    - Net adjustment: Sum of impacts, capped at ±20 percentage points.  
    - Apply to \( P_{\text{rec}} \) → \( P_{\text{adj}} \). Ban unmeasured claims.  
  - **Sufficiency:** \( P_{\text{adj}} \) and ledger with measurements.  
  - **Judgment call:** Which disanalogies to include (predefined).  

  **Step 7: Stability Audit (15 min)**  
  - **Action:** Test robustness by:  
    - Widen: Relax one inclusion criterion (e.g., add "soft pegs").  
    - Narrow: Add filter (e.g., "only post-1990").  
    - Drop extremes: Remove top/bottom 10% by duration.  
    - Drop recent: Exclude newest 33% of cases.  
    - Recompute \( P_{\text{adj}} \) for each. If probability flips (e.g., <50% to >50%), output range (min–max) or refuse.  
  - **Sufficiency:** Range or "stable" note.  

  **Step 8: Self-Membership (5 min)**  
  - **Action:**  
    - If class includes the case: Remove it and recompute.  
    - If class data comes from the system itself (e.g., regime’s own records): Apply -10% adjustment (within ledger cap) for bias.  
  - **Sufficiency:** Final adjustment or note.  

  **Step 9: Fusion with Inside View (10 min)**  
  - **Action:**  
    - Allow adjustment only via pre-specified checklist (e.g., "foreign reserves >6 months imports" → +5%).  
    - Max adjustment: ±10 percentage points → \( P_{\text{final}} \).  
    - Confidence: "High" (n≥50, stable audit), "Medium" (n≥20), "Low" (n<20 or unstable).  
    - Output: \( P_{\text{final}} \) with confidence (e.g., "40% (Low)").  
  - **Judgment call:** Checklist design (predefined).  

  **Step 10: Stop Rules**  
  - **Refuse if:**  
    - Class size <10 after exclusions.  
    - Stability range >40 percentage points.  
    - Horizon N > max lifespan in class.  
    - Case is unprecedented (no class).  
  - **Values handoff:** If probability is low but stakes high (e.g., 5% collapse risk), output: "Probability = X. Action depends on your loss function for false positives vs. false negatives."  

  ---

  ### Standing Reference Classes  
  Build/maintain 2–3 classes on slow days:  
  1. **Currency Pegs:** From IMF Annual Reports (1950–present). Columns: Country, start/end dates, peg type, break reason.  
  2. **Autocracies:** From Polity IV dataset (1900–present). Columns: Country, regime start/end, resource dependence, succession events.  
  3. **Sanctions Regimes:** From global sanctions databases. Columns: Target, start/end, sender, compliance outcome.  
  - **Rules:** Refresh annually; include only cases with verified start/end; publish inclusion criteria.  

  ---

  ### BRP Applied to Live Questions  

  #### 1. Currency Peg (held 9 years; survive 5 more?)  
  - **Step 0:** Precommit: "Peg break (devaluation >10%). N=5 years. Class: IMF-defined pegs." Witnessed.  
  - **Step 1:** Start: peg established. End: break >10%. End-state: dissolution.  
  - **Step 2:** Standing class "Currency Pegs" (n=85). Pre-committed rule: "All IMF-listed pegs (1950–2020), excluding dual-exchange systems."  
  - **Step 3:** \( P_{\text{base}} \) (survive 5+ years) = 52% (44/85 cases survived ≥5 years).  
  - **Step 4:** \( T = 9 \). \( P_{\text{cond}} \) (survive to 14 | survived to 9) = 48% (20/42 cases).  
  - **Step 5:** \( Q = 90\% \) (cases lasting ≥5 years). \( P_{\text{rec}} = \max(0, 0.48 - 0.1) = 38\% \).  
  - **Step 6:** Ledger: "High inflation differential" → in class, lowers survival by 15% → \( P_{\text{adj}} = 38\% - 15\% = 23\% \).  
  - **Step 7:** Audit:  
    - Widen (add soft pegs): \( P_{\text{adj}} = 45\% \).  
    - Narrow (only hard pegs): \( P_{\text{adj}} = 20\% \).  
    - Drop extremes: \( P_{\text{adj}} = 25\% \).  
