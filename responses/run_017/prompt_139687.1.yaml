prompt: |-
  I've been in a reading group on the norms of assertion for three years — the same six people, meeting every other week — and in that time nobody has changed their mind even once. I want a diagnosis of why, not another argument for one side.

  The three positions, as my group has them: a knowledge norm (you may assert that p only if you know that p); a truth norm (only if p is true); and a reasonable-belief norm (only if you reasonably believe that p, usually with sincerity and no-defeaters clauses bolted on). Each gets attacked from two directions. The truth norm looks too demanding when a doctor asserts a diagnosis on the best evidence available and the diagnosis happens to be false — nobody in the room thinks she did anything wrong — and too permissive when a guesser asserts a true proposition on no evidence at all. The knowledge norm looks too demanding in lottery- and preface-type situations, including the variant where you know each of a thousand claims individually but do not know their conjunction and so, apparently, may not assert the conjunction while happily asserting each conjunct; and it looks wrong in the cases where a speaker asserts truly against her own evidence, or asserts something she believes but could not be said to know, in a context where asserting is plainly the right thing to do. The belief norm looks too permissive when the speaker's belief comes from a source she had every reason to distrust, or from evidence she negligently failed to gather, and too demanding wherever confident testimony outruns what anyone could reasonably be said to have justified belief in.

  What makes me suspect the dispute is not what it advertises itself to be is the repair pattern. Every side responds to its problem cases by adding a clause — no undefeated defeaters, in a position to know, able to defend it if challenged, not in a context where standards are raised — and once two or three such clauses are in place, I can no longer construct a case in which the amended norms disagree. It begins to look as though the disagreement is either verbal, or else entirely about which formulation best explains a set of verdicts everyone already shares, with explains doing unargued work.

  I have three hypotheses and I don't trust any of them. First, that the sides are testing their norms against different kinds of evidence: the awkwardness of sentences of the form p, but I don't know that p; patterns of retraction, apology and blame; and the function assertion is supposed to serve in the transmission of information. These need not agree, and each side may simply be weighting the one it finds tractable. Second, that they disagree about what a norm of assertion is even for — whether it must be a rule a speaker can consult while speaking, a standard for assessing blameworthiness, a constitutive rule of a speech-act type, or a specification of what a practice of testimony is good for — so that they are answering different questions under one name. Third, that there is a hidden requirement about guidance doing the work: knowledge is arguably not a state one can aim at directly, and the sides may be split on whether that disqualifies a knowledge norm.

  The only thing that reliably moves my group is audience variation. An intern asserting a true, well-supported claim to the engineer who has already run the check; a parent telling a child something the parent only half-remembers; a witness on the stand, where hedging is not permitted. Intuitions swing hard with the hearer's epistemic position, and it is unclear to me whether this shows that the literature has been hunting for an audience-neutral standard that does not exist — in which case the question as posed is ill-posed — or whether it is simply a parameter every side has held fixed, in which case the debate is sound but incomplete.

  Please give me a diagnosis with reasons: which of my hypotheses is right, what is wrong with each of the ones that is not, and what each position actually commits its holder to that makes the impasse stable. Then tell me what would count as progress given that diagnosis — a distinction, a reframing of the question, a formal or empirical result — or argue that no progress should be expected and say why. I am not asking for a survey of the positions, and I don't want an answer that turns on who published what first or on where an argument appeared. Please write in American English.
reasoning: |-
  Okay, the user has been in a reading group for three years on norms of assertion with six people, and nobody has changed their mind. They want a diagnosis of why this impasse exists, not more arguments for one side. The three positions are knowledge norm, truth norm, and reasonable-belief norm, each with their own problems and repair strategies. The user suspects the real disagreement isn't about the norms themselves but something deeper.

  First, I need to unpack the user's three hypotheses. Hypothesis One is that each side values different types of evidence: linguistic data, patterns of blame/retraction, or the function of testimony. Hypothesis Two is that they have different ideas of what a "norm" even is—like a guide for speakers, a blame standard, a constitutive rule, or a teleological function. Hypothesis Three is about guidance: whether a norm must be directly aimable, which might disqualify knowledge since you can't aim to "know" directly.

  The user also mentions that audience variation is the only thing that moves their group. When the hearer's epistemic position changes, intuitions shift. This makes me think the core issue might be that norms of assertion aren't one-size-fits-all; they depend on context, especially the audience.

  Looking at the repair patterns, each side adds clauses to handle counterexamples. After a few amendments, the norms become extensionally equivalent—they all cover the same cases. So the disagreement might be verbal or about which formulation is "best," without clear criteria for what "best" means.

  The user’s frustration suggests they want to break the stalemate. They might be looking for a meta-analysis that shows why the debate is stuck and how to move forward. Their deeper need is probably for clarity on whether the question itself is flawed or if there's a path to resolution.

  Now, evaluating the hypotheses:
  - Hypothesis One seems plausible. Each side might be prioritizing different evidence. For example, knowledge norm advocates focus on linguistic data like "p but I don't know p" sounding odd, while truth norm folks care about blame in false assertion cases. But this doesn't fully explain the impasse because, in theory, they could integrate all evidence types.
  - Hypothesis Two feels stronger. If they're talking past each other about what a "norm" is, then they're not even disagreeing on the same thing. A knowledge norm as a constitutive rule vs. a reasonable belief norm as a guidance rule are different projects. This would make the debate unresolvable unless they first agree on what a norm should do.
  - Hypothesis Three about guidance might be part of Hypothesis Two. If knowledge isn't directly aimable, but some think norms must be actionable, that's a clash in assumptions. But it might not be the primary driver.

  The audience variation point is key. If intuitions change based on the hearer, maybe the whole framework needs to be relational. Current norms are speaker-centric, ignoring the audience's role. This could mean the debate is fundamentally missing a parameter, making it ill-posed.

  For a diagnosis: Hypothesis Two is the main issue. The sides are committed to different conceptions of "norm," so they're not engaging directly. Knowledge norm holders see it as a constitutive rule defining assertion, while reasonable-belief holders see it as a practical guide. Truth norm holders might view it as a teleological standard. Without agreeing on this, amendments just make the norms overlap without resolving the core disagreement.

  Progress would require reframing: either adopting a two-dimensional framework (like constitutive vs. normative), or shifting to a contextual/relational model where audience matters. Empirical work on how people actually assess assertions could help, or formal models showing how context affects norms. The user’s group might need to step back and define what they want from a norm before continuing.

  In sum, the impasse is due to differing implicit commitments about what norms are for, and progress requires clarifying the framework or expanding it to include context.
answer: |-
  Here’s a diagnosis grounded in your observations, followed by reasons for rejecting alternative hypotheses and a path forward. The core issue is **Hypothesis Two**: *The disagreement is fundamentally about what a "norm of assertion" is for*, and each side is implicitly committed to a different *function* of norms. This drives irreconcilable "repair patterns" and makes the positions stable despite apparent extensional equivalence.  

  ### Why Hypothesis Two is Correct  
  1. **Divergent Implicit Commitments**:  
     - **Knowledge Norm (KN) advocates** treat the norm as a *constitutive rule*: Assertion is *defined* by its tie to knowledge. Changing KN undermines the speech act itself. They prioritize preserving assertion’s "essence" (e.g., Williamson’s view).  
     - **Truth Norm (TN) advocates** treat the norm as a *teleological standard*: Assertion’s purpose is to convey truth. They focus on objective accuracy and see norms as evaluating success/failure of that goal (e.g., Weiner’s "reasonably false" cases).  
     - **Reasonable Belief Norm (RBN) advocates** treat the norm as a *guidance rule*: It must be directly actionable for speakers. They prioritize praxis—what a speaker *can* reasonably use in real time (e.g., Lackey’s "selfless assertion" cases).  

     These functions conflict:  
     - A constitutive rule (KN) can be unknowable or unactionable (e.g., lottery cases) but preserves assertion’s "nature."  
     - A guidance rule (RBN) must be "aimable" but may permit blameless falsehoods (e.g., negligent beliefs).  
     - A teleological standard (TN) judges outcomes but ignores epistemic effort (e.g., lucky guesses).  

  2. **The Repair Pattern Reveals Functional Divergence**:  
     Adding clauses (e.g., "no undefeated defeaters" to RBN, "in a position to know" to TN) isn’t just plugging holes—it’s *forcing the norm to serve a function it wasn’t designed for*. For example:  
     - KN adding "contextual salience" clauses tries (awkwardly) to address guidance.  
     - RBN adding "sincerity" clauses tries (awkwardly) to approximate truth-tracking.  
     Once amended, norms *converge extensionally* because they’re stretched to cover all functions. But this hides the core conflict: **No single norm can simultaneously serve as a constitutive essence, a practical guide, and a success condition**. The sides aren’t disagreeing about cases; they’re disagreeing about *what a norm is*.  

  3. **Stability Through Isolation**:  
     Each position is insulated because it satisfies its primary function:  
     - KN explains why "P but I don’t know P" sounds paradoxical (constitutive role).  
     - TN explains why we condemn false assertions regardless of intent (teleological role).  
     - RBN explains why we excuse assertions based on evidence (guidance role).  
     Since no side demands their norm fulfill *all* functions, counterarguments from other domains (e.g., KN’s impracticality) don’t land.  

  ### Why Other Hypotheses Are Partial or Incorrect  
  - **Hypothesis One (Different Evidence)**:  
    While sides *emphasize* different data (KN: Moorean paradoxes; TN: blame in false assertions; RBN: excusable errors), they all *respond* to the same cases (e.g., the doctor example). The problem isn’t evidence weighting—it’s that each norm *interprets* evidence through its functional lens. KN sees the doctor case as irrelevant (constitutive norms aren’t about blamelessness); RBN sees it as central (guidance). **Verdict**: Symptomatic of deeper functional disagreement, not the cause.  

  - **Hypothesis Three (Guidability Requirement)**:  
    This is a *subset* of Hypothesis Two. The "guidability" concern only matters if you think norms must be action-guiding (RBN’s view). KN advocates reject this; TN advocates are split. **Verdict**: A consequence of differing norm functions, not a root cause.  

  ### What Each Position Commits To (Making Impasse Stable)  
  - **KN**: Commitment to assertion as a "knowledge-delivery" practice. Sacrifices guidance/pragmatism to preserve philosophical unity.  
  - **TN**: Commitment to truth as the *sine qua non* of assertion. Sacrifices speaker-centric fairness to uphold objective correctness.  
  - **RBN**: Commitment to assertion as a tool for epistemic cooperation. Sacrifices metaphysical rigor for real-world usability.  

  These are foundational commitments—almost axiomatic. Abandoning them feels like changing the subject, hence three years of stalemate.  

  ### Why Audience Variation Moves the Needle  
  Audience sensitivity exposes the **functional clash**. For example:  
  - An intern asserting to a supervisor: RBN emphasizes guidance (intern’s evidence); TN emphasizes truth (supervisor already knows); KN struggles (intern doesn’t "know").  
  - A witness on the stand: KN/TN demand certainty (constitutive/teleological); RBN allows reasonable belief.  

  This shows the debate is **ill-posed as "audience-neutral"**—but not because norms don’t exist. Rather, **norms serve different roles in different contexts**, and no monistic norm can cover all.  

  ### A Path to Progress  
  1. **Reframe the Question**: Stop asking, "What is *the* norm of assertion?" Ask instead:  
     - *"Under what conditions is an assertion constitutively appropriate?"* (KN’s domain)  
     - *"When is an assertion epistemically successful?"* (TN’s domain)  
     - *"What should speakers use to govern their assertions?"* (RBN’s domain)  
     This accepts functional pluralism and forces clarity about which question matters in a given context.  

  2. **Pursue a Two-Level Framework**:  
     - **Constitutive Norm**: Knowledge (defines "assertion" as a speech act).  
     - **Regulative Norms**: Reasonable belief (for everyday guidance) + truth (for retrospective evaluation).  
     Empirical work (e.g., Turri’s experiments on lay intuitions) supports this: People judge *blame* based on belief/reasonableness, but *assertion quality* based on truth/knowledge.  

  3. **Test Contextual Parameters**:  
     Run thought experiments (or empirical studies) varying:  
     - **Speaker-Hearer Relationship** (e.g., expert/novice, peer/peer)  
     - **Stakes** (e.g., casual chat vs. medical diagnosis)  
     - **Institutional Role** (e.g., witness on stand vs. friend at dinner)  
     Map where intuitions align with KN, TN, or RBN. This could reveal contexts where one function dominates.  

  4. **Formalize "Niche" Norms**:  
     Use decision/game theory to model norms in specific cooperation scenarios (e.g., when hearers need reliability vs. when speakers need actionable rules). This could show why monistic norms fail and how context selects for different standards.  

  ### Why Progress Should Be Expected  
  The impasse isn’t eternal—it’s a symptom of premature unification. By reframing away from "one norm to rule them all" and toward:  
  - **Descriptive pluralism** (e.g., assertion has multiple norms for multiple purposes), or  
  - **Contextual parameterization** (e.g., norms shift with audience/stakes),  
  your group can move past verbal disputes. The key is to stop treating the three norms as rivals and start seeing them as tools for different jobs. 

  **Bottom line**: Your group is stuck because they’re trying to answer "What is a carburetor?" while secretly arguing about engines, fuel efficiency, and driving comfort. Separate the questions, and progress follows.
