  ### Grading Summary for Student's Answer  
  **Total Score: 17/20** (Breakdown per part below)  

  ---

  #### **(a) Grade: 4/5**  
  **Comments:**  
  - **Correct:**  
    - Arithmetic for A, C, E is perfect (A = 0.56, C = 0.16, E = 0.28; sums to 1).  
    - Heritability interpretation is excellent: clarifies it explains variance *within* the population, not individual causation or mean differences.  
    - Identifies spousal correlation (0.30) as assortative mating (AM) and correctly states it inflates A (since AM increases MZ-DZ gap, leading to overestimation).  
  - **Minor Errors/Omissions:**  
    - The claim that "true A is probably ~0.45" is speculative. While AM inflates A, no adjustment method was taught, so quantifying it is unnecessary. Full marks require only stating *direction* of bias (overestimation).  
    - Minor omission: Does not explicitly note that AM *also inflates C*, since shared environment includes spousal similarity. However, this is not central to the question.  
  - **What’s Missing for Full Marks:**  
    Explicitly state that AM biases Falconer’s formula *upward for A* without proposing a numerical adjustment.  

  ---

  #### **(b) Grade: 5/5**  
  **Comments:**  
  - **All Claims Correct & Complete:**  
    - Correctly rejects the inference: heritability (within-population) ≠ cause of between-population differences.  
    - Perfect maize example: high within-group h² does not imply between-group differences are genetic.  
    - Identifies valid evidence (common-garden/reciprocal transplant).  
    - Notes heritability is population/environment-specific (0.56 vs. 0.60).  
    - Pooled-sample explanation is flawless: between-group variance dilutes h² if environmental, but could increase it if genetic (though actual value depends on relative variances).  
  - **Defensible Nuance:**  
    "If the gap is genetic, [pooled h²] could come out above 0.60" is acceptable. While pooled h² depends on the magnitude of between-group variance, the directional point is correct.  

  ---

  #### **(c) Grade: 3.5/5**  
  **Comments:**  
  - **Strengths:**  
    - Correctly refutes board member: high h² ≠ unchangeable (uses height/PKU examples well).  
    - Notes C may reflect MZ-specific treatment (twin design limitation).  
    - Gene-environment correlation (rGE) point is **excellent**: rGE inflates h² estimates artificially, making interventions *more* plausible.  
  - **Critical Error:**  
    - **False claim:** "No environmental intervention could move the population mean by more than ~0.66 SD." This confuses *variance explained* with *mean shift potential*. Heritability constrains the *proportion of variance* environmentally explainable *in the current population*, not the maximum shift in the mean. An intervention (e.g., universal nutrition) could shift the entire distribution substantially regardless of h² (e.g., historical height increases). The \(\sqrt{V_E} \approx 0.66\) SD figure is the *SD of environmental effects*, not a cap on mean shifts.  
  - **Minor Issue:**  
    Equates "44% non-genetic" with \(V_E\) (E+C), but calls it "non-genetic" without clarifying that C is shared environment. Not a major flaw.  
  - **What’s Missing for Full Marks:**  
    Remove the erroneous "limit" claim and clarify that h² says nothing about the *magnitude* of possible mean shifts under novel interventions.  

  ---

  #### **(d) Grade: 4.5/5**  
  **Comments:**  
  - **Strengths:**  
    - **Perfect rebuttal of "personal heritability":**  
      - Category mistake (population vs. individual).  
      - Scaling issue (zero-point dependence, unit sensitivity).  
      - Correctly notes that \(\frac{g_i}{P_i}\) average ≠ \(V_A/V_P\).  
    - Highlights that mismatch does not invalidate h².  
  - **Minor Nitpick:**  
    Unnecessary mention of nonlinear transformations altering h² (true but beyond scope). No penalty.  
  - **What’s Missing for Full Marks:**  
    Slightly more emphasis on why the ratio is incoherent (e.g., \(g_i\) and \(P_i\) are on arbitrary scales; \(P_i = g_i + e_i\) but \(e_i\) includes environmental effects, so \(g_i/P_i\) has no causal interpretation).  

  ---

  ### Final Rubric Comments for Student  
  **(Copy-paste version)**  
  **(a) 4/5:** Correct calculations and heritability interpretation. Good point on assortative mating inflating A. Avoid speculating on "true" values (e.g., 0.45); focus on direction of bias.  
  **(b) 5/5:** Flawless. Correctly debunks the inference, cites evidence, and explains pooled heritability.  
  **(c) 3.5/5:** Strong refutation of board member and excellent rGE point. **Error:** Heritability does not cap population mean shifts (e.g., \(\sqrt{V_E}\) is not a limit). High h² ≠ limited environmental effects.  
  **(d) 4.5/5:** Excellent critique of "personal heritability." All key errors identified. Minor over-explanation on scaling, but no penalty.  

  **Total: 17/20**  
  *Strong performance overall. Watch for conflating variance constraints with mean-shift potential (part c).*
