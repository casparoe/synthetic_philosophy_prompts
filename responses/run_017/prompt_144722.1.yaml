prompt: |-
  I run a small decision-theory reading group with two friends from the economics department, and over the last few months I have come to accept something like the standard line about the value of information. Good's theorem — the result that for an expected-utility maximizer the ex ante value of a costless signal is never negative, since acquiring it never removes an act from the feasible set and you can always simply act as you would have acted had you not received it — strikes me as about as firm as anything in this neighbourhood, and I now lean on a stronger, more operational version of it: whenever additional information appears to make an agent worse off, the harm must be traceable to one of a short list of extra factors — the information was not really free, the agent is not an expected-utility maximizer, preferences run over beliefs as well as over outcomes, other agents are responding to what the agent knows, or the agent is boundedly rational and updates badly on noise. I like this version because it is diagnostic rather than merely reassuring: it predicts that every apparent counterexample will decompose into one of those failure modes.

  What I want from you is the case against it, in the sense of what would have to be true for me to be wrong. Please set aside the boring failures — monetary cost, time, attention, the risk of being lied to — and go for the structural ones. Here are the cases I keep turning over. First, my brother is an oncologist, and he says there are borderline genomic results he would rather not have, because once he has seen one he can no longer recommend the standard treatment with the particular wholeheartedness that he thinks does part of the therapeutic work; that looks like a case where information shrinks the feasible act set rather than merely informing a choice within it. Second, there is ignorance as a commitment device: the negotiator, or the family of a kidnap victim, who is better off genuinely not knowing, because not knowing is the only way to be unable to reveal the thing or unable to cave. Third, there are cases where the harm runs through the agent's own dispositions — learning from an accurate predictor what sort of person you are may destroy the very disposition you had hoped to exercise, and you cannot choose to be the sort of person who had not been told. Fourth, and this is the one I find hardest to fit into the framework at all, there is information that is not a coarsening or refinement of a fixed partition: learning a new concept, a name for a symptom, a distinction you could not previously draw, after which the space of possibilities has itself been re-individuated and acting as if you had not learned it is not among the things you can do even in principle.

  So: tell me which of these are genuine defeaters and which attack a strawman, and which assumption of the theorem each one targets. Rank them for me from fatal to merely awkward, and be explicit about what a defender of the theorem would herself concede as counting against it, as opposed to what only critics say — I would rather have the concessions than the polemic. I would also like to know whether the companion result, that a finer experiment is never worth less than a coarser one, is exposed at the same points or at different ones, and whether the ex ante framing is doing real work here, since in several of my cases the agent is plainly worse off ex post in some realizations while the average still comes out fine. Finally, and most importantly: has my operational version of the view been qualified into something unfalsifiable? If every apparent counterexample is met by saying that the information was not really free, or he was not really rational, or what arrived was not really a signal over a fixed state space, then the claim seems to be on its way to being true by stipulation. Say honestly whether that is where this ends up, and whether, for a claim of this kind, that is a defect. The two things that would move me most are a case where the feasible set genuinely shrinks and a case where the incoming item cannot be modelled as a partition of an already-given space of possibilities; if neither can be made to work, I would like to be told that too.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They run a decision-theory reading group and have embraced Good’s theorem about the value of information. But they’re now questioning if their "operational version" of it might be unfalsifiable because every counterexample gets explained away by one of the failure modes they listed. They provided four cases where information seems harmful, and want to know which genuinely challenge the theorem and how.

  First, I need to recall Good’s theorem. It states that for an expected-utility maximizers, free information can’t have negative value because you can always ignore it. The user’s operational version lists specific failure modes: cost, non-EU rationality, belief-dependent preferences, strategic interactions, or bounded rationality. They’re worried this list makes the theorem non-falsifiable.

  Looking at their four cases: the oncologist example, ignorance as commitment, self-destructive knowledge, and conceptual change. I need to analyze each against the theorem’s assumptions. 

  Starting with the oncologist. Here, the doctor feels that knowing genomic results reduces his ability to wholeheartedly recommend treatment. This seems like the feasible set shrinks because he can’t unsee the info. But under standard decision theory, he still has the option to recommend the treatment; he just can’t do it "wholeheartedly." The problem is that his utility depends on his own belief state—knowing undermines the placebo effect of his confidence. So this targets the belief-dependent preferences assumption.

  Next, ignorance as commitment. A negotiator who doesn’t want to know a secret to avoid revealing it under pressure. Not knowing is part of their strategy to commit to not disclosing. This isn’t about shrinking the feasible set but about altering others' perceptions. The key here is strategic interaction with other agents. The negotiator’s lack of knowledge changes how opponents behave. This directly hits the "other agents responding" failure mode.

  The third case is about learning a trait that destroys the disposition. Like finding out you’re not trustworthy and then acting untrustworthily. The issue here is that the information changes the agent’s identity or dispositions. After learning, they can’t choose to act as if ignorant because their fundamental preferences or capabilities have shifted. This challenges the fixed identity assumption of EU theory, where preferences are stable. But the theorem assumes the agent remains the same; here, the info transforms them. So it’s a deeper issue—maybe beyond standard failure modes, touching on personal identity.

  Lastly, conceptual change. Learning a new concept that re-individuates possibilities. You can’t "unsee" the new distinction, so acting as if ignorant isn’t possible. This is the strongest challenge because the state space itself changes. Standard decision theory assumes a fixed state space. Here, the partition isn’t just refined; the ontology shifts. The theorem can’t handle this because the ex ante and ex post worlds are incommensurable.

  Now, ranking these. Conceptual change seems the most fatal—it undermines the fixed state space assumption. Then self-destructive knowledge, as it challenges fixed identity. The oncologist and commitment cases are serious but fit within known failure modes (belief-dependent preferences and strategic interactions).

  The user also asks about the finer experiment result and the ex ante framing. For finer partitions, conceptual change is again problematic because fineness assumes a common state space. Ex ante vs. ex post matters in cases like the oncologist, where ex post harm might be outweighed by ex ante benefits, but in commitment or identity cases, ex ante avoidance of info is rational.

  Finally, the unfalsifiability worry. If every counterexample is shoved into a failure mode, the theorem becomes tautological. But the user’s cases, especially conceptual change and identity shifts, might expose this. Those aren’t covered by the original failure modes. So defending the theorem here might require stretching definitions, risking unfalsifiability.

  The user’s deeper needs: they want to know if their operational version holds up or if it’s circular. They seek rigorous testing, especially around shrinking feasible sets and state space changes. Honesty about limitations is crucial. They might also want to reconcile decision theory with real-world complexities like changing identities or ontologies, which aren’t captured by current models.
answer: |-
  Based on your rigorous framing and the specific cases you've presented, here's a structural breakdown of where these counterexamples challenge Good's theorem and your operational version, ranked by severity and analyzed for the concessions a defender would likely make versus polemical critiques. I'll address the finer partition result, the ex ante/ex post distinction, and the unfalsifiability concern directly.

  **Ranking the Cases (Fatal to Awkward):**

  1.  **Conceptual Change / Re-individuation (Most Fatal):**
      *   **The Challenge:** This directly attacks the **fixed state space** and **fixed possibility space** assumptions fundamental to Good's theorem and decision theory itself. The theorem assumes a pre-defined set of states Ω over which acts yield outcomes, and signals are partitions (or refinements) of this Ω. Learning a new concept doesn't refine Ω; it creates a *new* Ω' with different primitives, dimensions, or granularity. "Acting as if you hadn't learned it" is impossible because your cognition now operates within Ω'. You cannot represent the world pre-conceptually anymore.
      *   **Defender's Concession:** A defender *must* concede this is a genuine defeater *if* they accept the description. The theorem simply doesn't apply to transformations of the underlying ontology. The "incoming item" cannot be modeled as a partition of the *ex ante* state space. This fundamentally breaks the framework.
      *   **Attacking a Strawman?** No. It targets the core, often implicit, assumption of a stable, pre-defined state space.
      *   **Finer Partition Result:** This suffers equally or worse. A "finer" experiment presupposes refinement *within* a fixed state space. Conceptual change creates an incommensurable space – it's not finer or coarser, just *different*. Comparing value becomes ambiguous.
      *   **Ex Ante Work:** Crucial here. Ex ante, the agent cannot even *conceive* of the possibility space Ω' or the acts defined over it. Valuing the information ex ante is impossible because the potential new ontology isn't part of their model. Ex post, they operate in a new framework incompatible with the old one.

  2.  **Self-Destructive Knowledge / Identity Shift:**
      *   **The Challenge:** This primarily targets the **fixed identity/preferences** assumption implicit in standard EU theory. Good's theorem assumes the *agent* (their preferences, capabilities, dispositions) remains constant before and after receiving the signal. Here, the information *changes the agent*. Learning you are disposition X destroys the disposition Y you needed/wanted to exercise. Crucially, "acting as if you hadn't learned" is impossible because the disposition required to perform the act *no longer exists*; it wasn't just hidden knowledge. This goes beyond belief-dependent utility; it alters the agent's fundamental capacities or constitutive preferences. The feasible set *effectively shrinks* because an act requiring disposition Y is no longer *performable* by the new agent.
      *   **Defender's Concession:** A defender would likely argue this pushes beyond standard decision theory's scope, which assumes a stable agent. They *might* try to model it as extreme belief-dependent utility (where the belief *is* the identity) or a radical shift in self-knowledge altering preferences, but it strains the model. They would concede it reveals a *limitation* of the standard framework regarding endogenous preference/identity formation triggered by information. It strongly suggests the feasible set *of the original agent* shrinks for disposition-dependent acts.
      *   **Attacking a Strawman?** No. It targets the stability of the agent, an often unstated foundation.
      *   **Finer Partition Result:** Exposed similarly. A finer signal could more precisely reveal the identity-destroying fact.
      *   **Ex Ante Work:** Ex ante, the agent might rationally avoid information *because* they know it could destroy their valued disposition/identity. The average might *not* "come out fine" ex ante if the destruction of Y is catastrophic enough, even if learning the opposite fact (you *are* Y!) is beneficial. Avoiding the signal preserves the valuable disposition.

  3.  **Ignorance as Commitment Device:**
      *   **The Challenge:** This is a clear case of **strategic interaction with other agents**. Good's theorem assumes a single-agent decision problem against nature. Here, the value of ignorance stems entirely from how the *other party's* strategy depends on *what the agent knows* (and crucially, what the other party *believes* the agent knows). Not knowing isn't intrinsically valuable; it's valuable because it credibly prevents revelation or alters bargaining posture in the eyes of the opponent. The feasible set *of credible strategies* shrinks if the agent knows the secret.
      *   **Defender's Concession:** A defender readily concedes this falls under the "other agents are responding to what the agent knows" failure mode. It's a well-understood phenomenon in game theory (e.g., models of delegation, burning bridges, Schelling points). They would argue this doesn't challenge the theorem *within its intended scope* (individual decision under uncertainty against nature) but highlights its inapplicability to strategic settings. The feasible set of physical acts might not shrink, but the set of *credible* or *effective* strategies does.
      *   **Attacking a Strawman?** Partly. It doesn't challenge the core logic of Good's theorem applied non-strategically. It highlights a crucial domain where the theorem's assumptions fail, but this failure mode was already on your list.
      *   **Finer Partition Result:** Exposed similarly. A finer signal could reveal more to the agent, potentially worsening their strategic position further.
      *   **Ex Ante Work:** Key. Ex ante, the agent *rationally chooses* ignorance precisely because they foresee the ex post strategic disadvantages of knowing. The *average* value of knowing might be negative *because* of its predictable negative strategic consequences in key states.

  4.  **Oncologist & Wholeheartedness (Least Fatal / Awkward):**
      *   **The Challenge:** This is primarily a case of **belief-dependent preferences** or **experiential utility**. The oncologist's utility function depends not only on the patient's outcome but also on *his own belief state* while acting. Recommending treatment while harboring doubt generates disutility (anxiety, guilt, feeling inauthentic) that undermines the therapeutic confidence. Knowing shrinks the feasible set *of psychological states* he can occupy while performing the act. He can still physically *recommend* the standard treatment, but he cannot do it "wholeheartedly" (i.e., without the negative belief-state) anymore. This violates the standard assumption that utility depends solely on outcomes and states, not on the agent's epistemic state *during* the choice.
      *   **Defender's Concession:** A defender readily concedes this fits the "preferences run over beliefs as well as over outcomes" failure mode. It's a standard example of how Good's theorem breaks when utility isn't separable from beliefs. They might argue the feasible set of *outcome-state pairs* hasn't shrunk, but the *experience* of choosing within it has changed detrimentally.
      *   **Attacking a Strawman?** Mostly. It neatly fits an acknowledged failure mode. The "feasible act set" point is slightly metaphorical (he can still *do* the act, just not *feel* the same way).
      *   **Finer Partition Result:** Not uniquely exposed here. A coarser signal might preserve the desired ignorance; a finer one might worsen the doubt.
      *   **Ex Ante Work:** Important. Ex ante, the oncologist might rationally prefer ignorance to preserve his ability to act wholeheartedly. Ex post, upon learning the borderline result, he *is* worse off in that specific realization because he must now act while burdened by doubt. The ex ante calculation weighs this potential ex post disutility against the potential benefits of knowing.

  **Addressing Your Core Concerns:**

  1.  **Feasible Set Shrinkage:**
      *   **Conceptual Change:** Most radical shrinkage – the *entire framework* for defining acts changes.
      *   **Identity Shift:** Genuine shrinkage for acts *requiring the destroyed disposition*. The agent *loses the capacity* to perform the act in the intended way.
      *   **Commitment:** Shrinkage of the set of *credible/effective strategies*.
      *   **Oncologist:** Metaphorical shrinkage of the set of *psychological experiences* available while performing the act.

  2.  **Non-Partition / Non-State-Space Signal:**
      *   **Conceptual Change** is the definitive case. The signal isn't a partition; it's a transformation of the possibility space itself. Modeling it as a partition over a fixed Ω is impossible. This is the strongest example of information that cannot be accommodated by the standard framework.

  3.  **Unfalsifiability of the Operational Version:**
      *   **Yes, there is a significant risk.** Your operational version risks becoming unfalsifiable if applied too loosely. Conceding "not really a signal" for conceptual change or "not really fixed identity" for self-destructive knowledge *could* be seen as stretching the definitions to protect the core claim.
      *   **Is it a Defect?** For a *descriptive* claim about human psychology? Absolutely – it would be unfalsifiable psychologizing. For a *normative* claim about rational choice *within the specific framework of EU maximization over a fixed state space and fixed agent identity*? It's less a defect and more a delineation of scope. The theorem is tautologically true *within its defined axiomatic system*. The value comes from diagnosing *why* a real-world situation falls outside that system.
      *   **The Key:** Honesty about the boundaries. The defender must clearly state: "Good's theorem holds for an expected utility maximizer with stable preferences and identity, making choices over a fixed state space, where utility depends only on outcomes and states, and no other agents strategically react to the agent's knowledge. If harmful information occurs, it must violate one of these conditions." Conceptual change and identity shifts highlight that the "stable state space" and "stable identity" assumptions are substantive and often violated, limiting the theorem's direct applicability to complex human decisions. Your oncologist and commitment cases fit neatly within the acknowledged belief-dependence and strategic interaction failure modes.

  **Conclusion:**

  1.  **Conceptual Change** is the most profound challenge, fatally violating the fixed state space assumption. A defender *must* concede this lies outside the theorem's scope.
  2.  **Self-Destructive Knowledge** is a severe challenge, exposing the often-unexamined assumption of fixed agent identity/preferences. A defender would concede it highlights a limitation of the standard model for cases involving endogenous identity formation.
  3.  **Ignorance as Commitment** is a clear, well-understood instance of the strategic interaction failure mode. A defender readily concedes this but argues it doesn't touch the core non-strategic theorem.
  4.  **Oncologist** is a classic example of belief-dependent preferences. A defender readily concedes this known failure mode.

  The **finer partition result** is equally vulnerable to conceptual change and identity shifts, and vulnerable to strategic/commitment scenarios. The **ex ante framing** is crucial for understanding rational avoidance in commitment and identity cases, and is fundamentally undermined by conceptual change.

  Your operational version **is at risk of unfalsifiability** if the categories ("not really a signal," "not really rational," "not really fixed identity") are stretched to cover *any* counterexample. However, **Conceptual Change** and **Identity Shift** provide strong cases that genuinely lie outside the intended scope of the theorem as formalized, forcing a concession about the boundaries of the model rather than just a reclassification within its failure modes. They demonstrate that the "fixed state space" and "fixed agent" assumptions are not mere conveniences but substantive limitations. The theorem stands firm *within its castle*, but these examples show important human experiences occur *outside its walls*.
