  - If you are genuinely unsure whether some claim is defective, say what would settle it rather than guessing.
  - Finally, three or four sentences of summary for the cover sheet, readable on its own, giving the mark and the two or three things that most determined it.

  Please do not rewrite the answer, do not advise on style or presentation, and do not suggest further reading. Confine yourself to whether the epistemology and the mathematics are correct.
