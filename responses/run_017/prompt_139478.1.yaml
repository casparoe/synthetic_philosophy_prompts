answer: |-
  **Does the reported motion path (dot moving between locations) directly reflect what was registered during the flashes?**
  *   **Yes, the motion was registered as it unfolded.** → [Go to Q2]
  *   **No, the motion path is constructed after the flashes, based on the discrete events.** → [Go to Q3]

  **Q2: In the variant reporting an intermediate hue (e.g., yellow), is that specific hue genuinely experienced?**
  *   **Yes, the intermediate hue was briefly perceived during the motion.** → [Go to Q4]
  *   **No, the intermediate hue description arises only when describing the *event*, not from a direct experience.** → [Go to Q5]

  **Q3: When the second flash is masked (nothing seen at location 2), is the *colour change at the midpoint* still genuinely experienced?**
  *   **Yes, the colour change is experienced, despite no second flash being seen.** → [Go to Q6]
  *   **No, the report of a colour change persists, but the experience itself did not contain that specific change event.** → [Go to Q7]

  **Q4: In the speeded keypress variant, where pressing at the perceived change time shows the brain registers the change *after* the green flash starts, does this mean the reported experience is inaccurate about timing?**
  *   **Yes, the experience of the change happened later than reported, but the *content* (red then green moving) was registered.** → **Position: Change experienced, timing misreported.** (Experience then overwritten *only* for timing)
  *   **No, the experience *as reported* (change at midpoint) accurately reflects the neural state at the time of the keypress, which integrates earlier signals.** → **Position: Experience *is* the final integrated state.** (Experience just is final representation)

  **Q5: Does the TMS result (hMT+ pulse abolishes motion report but not colour-change, V4 pulse vice versa) show the motion and colour-change experiences depend on distinct neural events?**
  *   **Yes, the experiences depend on distinct, localisable neural processes.** → **Position: Feature-relative revision.** (Motion and colour revised differently)
  *   **No, the TMS disrupts *reporting* mechanisms, not the core experience which remains unified but inaccessible.** → **Position: Empirical dispute on vehicle/timing.** (Whole dispute empirical - find the neural vehicle/timing of the *unified* percept)

  **Q6: Does the keypress latency showing change registered *after* the second flash started mean the experience of the change happened *after* the flash?**
  *   **Yes, the experience of change occurred after the physical event it refers to (the green flash).** → **Position: Change experienced, record overwritten.** (Change experienced, then record overwritten)
  *   **No, the keypress reflects the *reportable* timing, but the experience itself was of a continuous event timed at the midpoint.** → **Position: Experience *is* the final integrated state.** (Experience just is final representation)

  **Q7: When observers correctly report the physical flashes (red, then green, no change) when asked "what was on the screen?", does this show their initial motion/change report was about a different thing?**
  *   **Yes, the initial report is about the *event as experienced*, distinct from the physical stimuli report.** → [Go to Q8]
  *   **No, the physical stimuli report shows the initial experience report was inserted/modified after the fact.** → **Position: Change never experienced, report inserted.** (Change never experienced, report inserted)

  **Q8: Can the timing of the *neural representation* of the colour change be definitively localised (e.g., via ERPs, single-unit recording) relative to the flashes?**
  *   **Yes, in principle, we can find when and where the change was neurally represented.** → **Position: Empirical dispute on vehicle/timing.** (Whole dispute empirical - find the neural vehicle/timing of the change representation)
  *   **No, the neural processes are distributed and dynamic, making a single "time of experience" unassignable.** → **Position: No determinate fact.** (No determinate fact of the matter about *when* anything was experienced)

