      *   **Q1 Yes → Q5:** (Path: Motion registered directly → TMS result question). *Empty: Unattractive.* Q5 presupposes construction/revision (implied by Q1 "No"), making it a less natural fit after Q1 "Yes". The direct registration view would likely interpret TMS as disrupting perception itself, not just reporting.
