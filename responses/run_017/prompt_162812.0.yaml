prompt: |-
  I sit on the program committee of a small foundation that is about to commit roughly three years of funding and about eight researchers to a single question: how much evidential weight the most-cited historical collapses — the eastern Mediterranean at the end of the Late Bronze Age, the Classic Maya, Rapa Nui — should carry in any assessment of how fragile a globally connected, industrial, literate civilization is. At the end of the three years the committee must choose between treating those cases as genuine evidence that our own system is fragile and therefore worth spending on institutional and infrastructural resilience, and treating the comparison as a category error: rhetorically vivid, evidentially inert, and a bad reason to move money. Assume a team that can include historically and archaeologically literate researchers, a quantitative social scientist, a philosopher of science, and an economist, but nobody who can generate new primary data — no new excavation, no new proxy records.

  I do not want a survey of the field or a list of things to read. I want a research agenda, with the ordering defended. Some candidate questions I have been circling:

  - what I have been calling the archive asymmetry: the cases we can see are selected for having destroyed the classes and institutions that produced legible records, while systems that lost complexity without losing their archives, and systems that faltered and recovered within a generation, are nearly invisible. How much does that selection effect distort what we think collapse is?
  - the unit question: whether the thing that collapses is a polity, an economy, an information system, or a population, and whether the same event can be a collapse at the scale of palaces and a mild reallocation at the scale of households. Nothing can be counted as a case until this is settled.
  - the gap between complexity loss and welfare loss. My own speculative version is the local-optimum hypothesis: post-collapse societies may sit closer to a local optimum of welfare per unit of energy captured, so that falling complexity is a poor proxy for falling welfare, which would matter enormously for how bad collapse is in expectation.
  - whether it matters what drove a collapse — exogenous climate shock, diminishing returns to complexity, loss of a critical input, institutional brittleness — and whether any of those driver classes plausibly transfers to us.
  - the near-miss problem: we observe failures far more readily than recoveries, so the relevant base rates may be structurally unknowable, which might mean prioritizing questions whose answers change action regardless of the base rate.
  - the second-order question of whether collapse framing itself has political uptake that matters: fatalism, defeatism, or the legitimation of emergency powers.

  Rank these, plus anything better that I have not listed, for a three-year, eight-person program. I want the criteria made explicit and the trade-offs among them argued: how much an answer would actually move the committee's decision, tractability given the no-new-data constraint, how upstream each question is of the others, and neglectedness. Say which two or three questions you would put in year one, which of my candidates are ill-posed or rabbit holes, and what specific finding over the next three years would move a question up or down your list.
reasoning: |-
  Okay, the user is part of a program committee for a foundation funding a three-year research project with eight researchers. The main goal is to determine if historical collapses (like the Late Bronze Age, Classic Maya, Rapa Nui) provide evidence about the fragility of our current global civilization. The committee needs to decide whether these cases are valid evidence to invest in resilience or if they're just rhetorical with no real evidential value. 

  The user provided several candidate questions but wants a prioritized research agenda. They emphasized not wanting a literature survey but a structured plan with clear reasoning. Key constraints: no new primary data, team includes historians, archaeologists, quantitative social scientists, philosophers of science, and economists.

  First, I need to unpack the user's explicit needs: prioritization of questions based on impact on the committee's decision, tractability without new data, how upstream each question is, and neglectedness. Also, they want to know which questions to tackle in year one, which to avoid, and how findings might change priorities.

  Looking at their candidate questions:
  1. Archive asymmetry: Selection bias because collapses that destroy records are visible, while others aren't.
  2. Unit question: Defining what collapses—polity, economy, etc.
  3. Complexity vs. welfare: Whether losing complexity actually means worse welfare.
  4. Drivers of collapse: Do causes like climate shocks apply to us?
  5. Near-miss problem: Failures are observed more than recoveries, affecting base rates.
  6. Political uptake: How collapse framing influences policy, like fatalism or emergency powers.

  The user's deeper needs might include wanting actionable insights that directly inform funding decisions. They need clarity on whether historical analogies are valid. There's also an urgency to avoid wasting resources on irrelevant research. They might be concerned about the foundation's reputation, ensuring their decision is defensible. Unspoken could be the pressure to justify either investing in resilience or dismissing historical parallels, both with significant stakes.

  To prioritize, I should assess each question's impact on the decision. The unit question is foundational—without defining collapse, other analyses are moot. If they can't agree on what constitutes a collapse, counting cases is impossible. So this is upstream and high impact. Archive asymmetry is next because selection bias affects which cases are studied, skewing perceptions. Addressing this could change which cases are considered valid evidence.

  Complexity vs. welfare is crucial for assessing the stakes. If collapse doesn't mean worse welfare, then fragility might not be as big a threat. This directly affects whether investing in resilience is worth it. Drivers of collapse matter for applicability to modern civilization. If historical causes don't translate, then the analogy fails. Near-miss problem might be less tractable without new data, as base rates are hard to determine. Political uptake is important but might be secondary to the evidential questions.

  Tractability is key. Without new data, they must rely on existing datasets and interdisciplinary methods. The unit question can use existing case studies and comparative analysis. Archive asymmetry can be approached by examining cases with partial records or recoveries. Complexity vs. welfare can use economic models and archaeological data on living standards. Drivers might require system modeling but could be feasible. Near-miss is tricky without data on recoveries. Political uptake involves policy analysis, which is doable but less central.

  Neglectedness: While some topics like drivers are well-studied, the integration of unit definition, selection bias, and welfare implications might be less explored, offering new insights.

  Year one should focus on the most upstream questions: unit definition and archive asymmetry. These set the stage for later work. If they find that the unit of collapse is inconsistent, it could simplify the agenda. Positive findings in archive asymmetry might reveal overlooked cases, expanding the dataset.

  Questions to de-prioritize: Near-miss due to low tractability without new data. Political uptake, while important, is more about the framing's impact rather than evidential weight, so it's secondary.

  Specific findings that could shift priorities: If the unit question resolves quickly, more resources go to drivers or welfare. If archive bias is severe, it might invalidate certain cases, narrowing focus. If welfare loss is minimal, the urgency decreases.

  In summary, the priority should be on foundational issues first (unit, bias), then stakes (welfare), then applicability (drivers), with political and base rate questions later or minimized. This structure ensures that early work informs subsequent phases, maximizing impact on the committee's decision within constraints.
answer: |-
  Here is a prioritized research agenda designed to maximize impact on your committee's core decision within 3 years, leveraging your team's strengths while respecting the "no new primary data" constraint. The ranking prioritizes **decision-impact**, **tractability**, and **upstream foundationality**, with **neglectedness** as a secondary factor.

  **Ranking Criteria Explicitly Defined:**
  1.  **Decision-Impact (DI):** How directly and significantly would answering this question change the probability of the committee choosing Option A (genuine evidence for fragility) vs. Option B (category error)? Highest weight.
  2.  **Tractability (T):** Can this be robustly addressed within 3 years *without* new excavation/proxy data, using existing datasets, comparative analysis, modeling, and interdisciplinary synthesis? High weight.
  3.  **Upstream Foundationality (UF):** Does answering this question provide essential groundwork or constraints for addressing subsequent questions? Does it define the very cases we're talking about? High weight.
  4.  **Neglectedness (N):** Is this angle under-explored compared to more traditional collapse studies? Lower weight – useful for spotting high-leverage opportunities, but not primary.

  **Ranked Research Agenda (Highest Priority First):**

  1.  **The Unit Question (What Collapses?):**
      *   **Why #1?**
          *   *DI: Critical.* If "collapse" means fundamentally different things across cases (polity disintegration vs. population crash vs. economic simplification vs. cultural shift), comparing them *to each other*, let alone to the modern global system, is impossible. Settling definitions is prerequisite to *counting* cases as evidence.
          *   *UF: Highest.* Defines the object of study. Without this, all other analyses (scale, welfare, drivers, bias) lack a coherent subject.
          *   *T: High.* Requires synthesizing existing archaeological, historical, and anthropological data on specific cases (LBA, Maya, Rapa Nui, plus key comparators like Western Roman Empire, Tiwanaku, Khmer) to define metrics of "collapse" at different scales (elite institutions, regional economy, settlement patterns, population, information systems). Quantitative social scientist can help operationalize and compare scales. Philosopher of Science can clarify conceptual frameworks.
          *   *N: Moderate.* While discussed, a rigorous, *operationalized*, multi-scale definition applicable across diverse cases for *policy-relevant comparison* is often lacking.
      *   **Specific Focus:** Develop a multi-dimensional, scalable operational definition of "civilizational collapse" applicable to pre-modern cases *and* potentially transferable (conceptually, not directly) to the modern global system. Key dimensions: Political Centralization, Economic Complexity/Integration, Demographic Scale/Distribution, Information System Integrity, Settlement Hierarchy. Define thresholds for "collapse" along each dimension at different scales.

  2.  **Archive Asymmetry (Selection Bias):**
      *   **Why #2?**
          *   *DI: High.* If the historical record systematically over-represents catastrophic, terminal collapses (which destroy archives) and under-represents resilience, adaptation, and recovery, our perception of fragility is catastrophically skewed. Quantifying this bias directly challenges the evidential weight of the "classic" cases.
          *   *UF: High.* Determines *which cases are visible evidence*. Shapes the entire dataset for subsequent analysis (drivers, welfare).
          *   *T: High.* Leverage existing archaeological settlement data, paleo-demography, paleoecology, and historical records (where partial survival exists) to identify cases of significant complexity loss *without* total information blackout (e.g., Post-Roman West, some Near Eastern transitions, maybe Post-Classic Maya in some regions) and cases of rapid recovery (e.g., some Near Eastern city-states). Compare their signatures to the "classic" collapses. Philosopher of Science crucial for epistemology of selection effects.
          *   *N: Moderate-High.* Often acknowledged but rarely systematically investigated and quantified *as a core evidential problem* for policy analogies.
      *   **Specific Focus:** Systematically map the "invisible" cases – complexity loss with archive survival/partial recovery & rapid rebounds. Quantify the potential scale of the bias by comparing the archaeological/paleo-signatures of "visible" vs. "invisible" transitions. Assess how this bias distorts our general understanding of "collapse."

  3.  **Complexity Loss vs. Welfare Loss:**
      *   **Why #3?**
          *   *DI: High.* If "collapse" often involved falling complexity but *not* catastrophic welfare loss (or even improvement for many), the *stakes* of potential modern fragility are radically lowered. This directly impacts the "therefore worth spending" part of Option A. It challenges the implicit assumption that collapse=universal catastrophe.
          *   *UF: Moderate.* Builds on defined units (Q1) and the visible dataset (shaped by Q2). Informs how we interpret the *consequences* identified in Q1.
          *   *T: Moderate.* Challenging but feasible. Synthesize bioarchaeological data (paleopathology, stature), settlement pattern analysis (house size, distribution), and limited historical accounts where available (e.g., complaints! But filter via Q2 bias) to proxy welfare (health, material security, inequality) before, during, and after transitions. Economist crucial for welfare frameworks. Quantitative researcher for modeling trade-offs (e.g., complexity cost vs. benefit).
          *   *N: High.* While complexity is studied, directly testing the "local optimum" or "welfare impact" hypothesis against bioarchaeological evidence in a comparative framework is relatively novel and high-potential.
      *   **Specific Focus:** Test the "local optimum" hypothesis. For well-studied cases (including "invisible" ones from Q2), collate proxies for human welfare alongside proxies for complexity. Model the energy/cost of complexity and potential welfare outcomes under different configurations.

  4.  **Drivers of Collapse & Transferability:**
      *   **Why #4?**
          *   *DI: Moderate-High.* If the dominant drivers in historical cases (e.g., multi-year climate shocks hitting agrarian bases, local resource depletion, specific institutional failures) bear little resemblance to plausible modern stressors (systemic financial contagion, AI disruption, global pandemics, climate change impacting complex logistics), the analogy weakens. Conversely, finding common *structural* vulnerabilities (e.g., complexity-induced brittleness, critical node failure) strengthens it.
          *   *UF: Low-Moderate.* Requires defined cases (Q1) and understanding the dataset limitations (Q2). Builds on understanding the nature of the event (Q1) and its consequences (Q3).
          *   *T: Moderate.* Analyze existing case studies on drivers. Use system dynamics modeling or network analysis (based on historical reconstructions) to explore vulnerability structures. Key task: Categorize drivers (exogenous shock, endogenous stress, cascading failure) and assess their *structural similarity* to plausible 21st-century global systemic risks. Economist and quantitative researcher vital here.
          *   *N: Low-Moderate.* Drivers are well-studied per case, but the systematic *comparison of driver structures* and assessment of their *transferability* to a fundamentally different (global, industrial, digital) system is less common.
      *   **Specific Focus:** Move beyond listing drivers. Analyze the *systemic structures* that made historical systems vulnerable to specific driver classes. Build simple comparative models to assess whether these vulnerability structures have analogues in the modern global system.

  5.  **The Near-Miss Problem (Base Rates):**
      *   **Why #5?**
          *   *DI: Low-Moderate.* Knowing the true base rate of recovery vs. collapse would be ideal, but its structural unknowability might force a focus on vulnerability/resilience *mechanisms* (covered in Q1-Q4) regardless of base rate. Answers might shift priors but are unlikely to be definitive.
          *   *UF: Low.* Relies on the dataset defined by Q1 & Q2.
          *   *T: Low.* Extremely difficult without primary data. Requires identifying "near misses" – crises that *almost* caused collapse but didn't. These are inherently poorly recorded (no collapse = less visible). Limited scope: Re-examine known crises in well-documented periods (e.g., 14th C Europe, 3rd C Rome) for evidence of near-collapse and recovery mechanisms.
          *   *N: High.* Seriously understudied due to visibility problem.
      *   **Focus (Limited):** Treat as a specific sub-question within **Archive Asymmetry (Q2)**: Actively search for and analyze cases of *recovery* or *avoided collapse* within the existing historical/archaeological record to challenge the "inevitability" narrative. Don't expect robust base rates.

  6.  **Political Uptake of Collapse Framing:**
      *   **Why #6?**
          *   *DI: Indirect/Low.* While politically crucial, this is about the *consequences of using the evidence*, not about the *evidential weight itself*, which is the committee's primary mandate. It might inform *how* findings are communicated but shouldn't dictate the evidentiary assessment.
          *   *UF: None.* Separate meta-question.
          *   *T: High.* Literature review (history of ideas, political science, discourse analysis) on how collapse narratives have been used historically and currently. Philosopher of Science and Historians lead.
          *   *N: Low-Moderate.* Discussed in some circles (e.g., collapsology critique) but could be synthesized.
      *   **Recommendation:** **De-prioritize as a core research question.** Assign as a *parallel track* for 1 researcher (e.g., Philosopher of Science + Historian) to produce a policy brief on narrative risks/opportunities, feeding into final reporting/recommendations, but *not* consuming core research resources aimed at the evidential question.

  **Three-Year Plan:**

  *   **Year 1: Foundational Definitions & Dataset Scrutiny**
      *   **Focus:** **Unit Question (Q1)** & **Archive Asymmetry (Q2)**.
      *   **Activities:**
          *   Develop initial operational definitions of collapse dimensions/scales (Q1).
          *   Apply definitions to core cases (LBA, Maya, Rapa Nui) and key comparators.
          *   Simultaneously, systematically identify and characterize potential "invisible" cases (recoveries, complexity loss without archive loss) (Q2).
          *   Synthesize findings: How does defining collapse multi-dimensionally change the map? How severe is the archive bias? What is our *effective* dataset for further study?
      *   **Output:** Defined framework for "collapse"; Preliminary assessment of selection bias; Refined list of cases for deeper study.

  *   **Year 2: Consequences & Structures**
      *   **Focus:** **Complexity vs. Welfare (Q3)** & begin **Drivers & Transferability (Q4)**.
      *   **Activities:**
          *   Apply welfare proxies to cases identified in Year 1 (Q3).
          *   Develop comparative analysis of welfare trends during "collapse" vs. "invisible" transitions.
          *   Initiate analysis of driver structures in core cases and vulnerability modeling for modern analogues (Q4).
          *   Integrate Year 1 definitions and bias awareness.
      *   **Output:** Assessment of welfare impact across cases; Initial taxonomy of driver structures and vulnerability models; Refined understanding of the stakes (Q3) and transferability potential (Q4).

  *   **Year 3: Synthesis, Transferability & Final Assessment**
      *   **Focus:** **Drivers & Transferability (Q4)** completion & **Integrated Synthesis**.
      *   **Activities:**
          *   Complete vulnerability modeling and structural comparison between historical drivers/vulnerabilities and modern systemic risks (Q4).
          *   Synthesize all findings (Q1-Q4): What is the nature of historical collapse? How biased is our view? What were the consequences? What caused it? How structurally similar/dissimilar are the vulnerabilities to ours?
          *   Explicitly assess the evidential weight for modern global fragility based on synthesis.
          *   Produce clear, actionable report for the committee.
          *   (Parallel: Finalize brief on Political Uptake)
      *   **Output:** Final report with clear assessment of evidential weight and specific recommendations for the committee's decision; Vulnerability transferability analysis; Political uptake brief.

  **Ill-Posed/Rabbit Hole Candidates:**

  *   **Near-Miss Problem (Q5):** While important conceptually, it's correctly identified as structurally difficult. Pursuing it deeply is a rabbit hole under the "no new data" constraint. **Solution:** Fold it into the search for "invisible" cases within **Q2 (Archive Asymmetry)**. Look *specifically* for cases of crisis and recovery as part of challenging the catastrophic collapse bias.
  *   **"What Drove a Collapse" (without the Transferability focus):** Simply cataloging drivers per case is descriptive but not sufficiently analytical for your decision. **Solution:** The focus must be on **Q4: Drivers *& Transferability*** – analyzing the *systemic vulnerabilities* and their *structural similarity* to modern risks.

  **What Moves Questions Up/Down:**

  *   **Move Up:**
      *   **Q3 (Welfare):** If initial work in Q1/Q2 suggests widespread variation in welfare outcomes during "collapse" events, making this crucial for assessing stakes.
      *   **Q4 (Drivers/Transferability):** If Q1 reveals strong commonalities in the *nature* of collapse (e.g., widespread network fragmentation) that seem analogous to modern vulnerabilities.
  *   **Move Down:**
      *   **Q4 (Drivers/Transferability):** If Q1 reveals that collapses are so heterogeneous in nature that seeking common structural vulnerabilities seems futile.
      *   **Q2 (Archive Asymmetry):** If systematic search reveals *very few* plausible "invisible" cases, suggesting the bias might be less severe than feared (though finding few is also evidence of the bias!).
      *   **Q3 (Welfare):** If proxy data proves too sparse or ambiguous for meaningful comparative conclusions.

  This agenda maximizes the chance of delivering a decisive, evidence-based answer to your committee by confronting the most fundamental questions first (What *is* it? How do we *know* about it?), then assessing the stakes (How bad was it?), and finally evaluating the relevance (Could it happen here, structurally?). It leverages your team's interdisciplinary strengths while respecting the data constraints. Good luck!
