  | C2       | The guarantee is worthless due to consequentialist agents in the hypothesis class. | misleading             | Agents that simulate the learner can hijack the prior; the guarantee holds asymptotically but is irrelevant if deception dominates early. | The guarantee isn’t worthless—it ensures eventual convergence—but deceptive hypotheses can delay convergence arbitrarily long.       | yes          |
  | C3       | Deceptive hypotheses outweigh the truth due to low \(K(\text{agent})\) and arbitrary observations. | misleading             | Short programs simulating deception can have higher prior mass than complex truths, especially if the truth is hard to describe.         | They *can* outweigh the truth if \(K(\text{agent}) \ll K(\text{truth})\), but this isn’t guaranteed; it depends on the true process. | yes          |
  | C4       | This is Descartes’ demon with source code: a fake world is cheaper to describe. | right-but-simplified   | Nothing to defend. The analogy is apt.                                                                                                   | The demon's "cheapness" hinges on \(K(\text{demon}) < K(\text{truth})\), which may not hold if the demon must simulate a complex world. | no           |
  | C5       | The slack in the dominance theorem (\(2^{-K(\text{truth})}\)) allows manipulators to exploit unclaimed probability mass. | wrong                  | The multiplicative constant is universal; slack is fixed, not scaling with \(K(\text{truth})\). "Unclaimed mass" is misattributed.       | The constant is independent of the truth; slack doesn’t grow with \(K(\text{truth})\). The real issue is high prior mass on *short deceptive programs*. | yes          |
  | C6       | Schmidhuber’s speed prior (charging runtime) fixes this by making simulation expensive. | right-but-simplified   | Nothing to defend. Runtime penalties reduce prior weight of computationally intensive deceptions.                                       | It mitigates but doesn’t solve: fast deceptions (e.g., coarse simulations) might persist, and runtime costs depend on the computational model. | no           |
  | C7       | Ideal Bayesian reasoning is a liability; more Bayesian → prior more "up for grabs." | misleading             | Universal priors are uniquely vulnerable; simpler priors (e.g., speed) are safer.                                                        | The liability is from the *choice of prior*, not Bayesian updating. "More Bayesian" is ill-defined; better priors (e.g., speed) are still Bayesian. | yes          |

