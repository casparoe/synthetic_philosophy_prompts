answer: |-
  ### Q&A Prep Sheet: Proxy Assertion & Delegated Norms  
  **Core to defend:** Proxy assertion is *functionally distinct* from testimony (hearer-focused warrant) and self-assertion (speaker-focused norm). The delegated norm explains why principals, not proxies, bear primary responsibility.  
  **Preemptively volunteer weak point:** "Where my scope-tracking condition is underspecified: I need clearer criteria for when a proxy *can* reliably detect scope breaches. I’d argue role-specific training/systems fill this, but concede it’s context-sensitive."  
  **Nightmare question (pray it’s not asked):** "If your transmissible store isn’t belief or knowledge, and isn’t public record, how can anyone *verify* its boundaries without regressing to speaker intention?"  

  ---

  #### Objections & Replies (Ordered by Damage Potential)  
  1. **Speech-Act Theorist**  
     *Objection:* "You’ve described a *contractual delegation*, not assertion. Asserting is committing *your own* reasons to a claim. Proxies are just conduits—this is a different illocutionary act entirely."  
     *Reply:* "Proxy assertion *is* assertion because it publicly binds the principal to the claim’s truth—just as your own commitment does. The norm shift reflects *who* is bound, not whether binding occurs. Conduits don’t bind principals; proxies do."  
     *Soft spot:* Assumes "commitment" requires personal reasons.  
     *Final-slide concession:* "Granted: Proxy assertion may sit at the edge of the assertion family—but so do institutional acts like sentencing."  

  2. **Philosopher of Language**  
     *Objection:* "Your ‘transmissible store’ is unworkable. How is it individuated? If P endorses ‘We face a crisis,’ can S paraphrase it as ‘Disaster looms’? What about implicatures? This is just disguised speaker meaning."  
     *Reply:* "The store is P’s *officially stabilized* content—think press releases, authorized statements. Paraphrase/implicature is governed by role conventions (e.g., legal translators stick to literal meaning). Scope-tracking requires proxies to flag non-literal moves."  
     *Soft spot:* Relies on "stabilized content" being tractable.  
     *Final-slide concession:* "I concede: Boundary cases (e.g., metaphor in policy) need more work on ‘authorized rendering’."  

  3. **Reductionist Testimony Theorist**  
     *Objection:* "This is overcomplicating testimony. Hearers always build warrant from *their* evidence about the speaker’s reliability and role. Proxies just add a layer to reduce—no new norm needed."  
     *Reply:* "Reduction works for *whether to trust the proxy*, but not for *what the principal is on the hook for*. When a press secretary speaks, the president’s responsibility is fixed by the delegated norm—not the hearer’s evidence."  
     *Soft spot:* Downplays hearer’s role in holding principals accountable.  
     *Final-slide concession:* "Granted: Hearer evidence matters for *relying* on proxies—but not for defining the principal’s obligation."  

  4. **Legal Epistemologist**  
     *Objection:* "Apparent authority doctrines in law already handle this. Why invent ‘proxy assertion’ when we have ‘vicarious admission’ rules for hearsay?"  
     *Reply:* "Legal rules *apply* a norm of delegation in specific contexts—but they don’t explain *why* it governs non-legal cases (e.g., a lab colleague). My account grounds those rules in speech-act structure."  
     *Soft spot:* Legal frameworks *are* more developed for authority.  
     *Final-slide concession:* "Concede: I need to engage more with legal ‘apparent authority’ as a model."  

  5. **Formal Epistemologists**  
     *Objection:* "Why invoke ‘norms’? This is just about P calibrating S to transfer high-accuracy content. Scoring rules for S’s output and P’s track record cover everything."  
     *Reply:* "Calibration can’t explain *why* misstatement by S wrongs P or hearers. Norms fix responsibility: If S says an unauthorized thing, it’s S’s error, not P’s—even if P is well-calibrated."  
     *Soft spot:* Formalists may see responsibility as epiphenomenal.  
     *Final-slide concession:* "Agreed: Calibration metrics can operationalize scope-tracking reliability."  

  6. **Anti-Reductionist Testimony Theorist**  
     *Objection:* "If hearers get default entitlement for testimony, why not for proxies? Your ‘authorization condition’ just pushes the problem back—what entitles us to trust P’s store?"  
     *Reply:* "Hearers get entitlement *that S is a proxy*, not for P’s store itself. We rely on institutional signals (e.g., a podium seal). Entitlement for P’s store still reduces to P’s testimony or records."  
     *Soft spot:* Doesn’t resolve infinite regress for trusting institutions.  
     *Final-slide concession:* "True: Entitlement for institutions needs its own story—but that’s beyond this paper."  

  7. **Political Philosopher**  
     *Objection:* "Institutional speech often *creates* truth (e.g., declaring a state of emergency). Your ‘content condition’ ignores how proxies perform, not report, institutional facts."  
     *Reply:* "Performatives are a special case where the transmissible store *includes* institutional power. My norm still applies: Unauthorized performatives (e.g., a rogue ambassador recognizing a state) are invalid."  
     *Soft spot:* Downplays how institutions *expand* what’s transmissible.  
     *Final-slide concession:* "I concede: Authorized performatives stretch the ‘store’ concept."  

  8. **Generalist (Annoyed About AI Example)**  
     *Objection:* "Why open with AI if you drop it? If language models ‘simulate’ assertion, isn’t that just saying they’re not proxies? This feels bait-and-switch."  
     *Reply:* "The AI example flags why standard norms *fail* for new speakers. I drop it because showing why AI *isn’t* a proxy clarifies the real work needed to *make* it one (e.g., Google designating a model as its authorized voice)."  
     *Soft spot:* Paper *does* use AI as a hook.  
     *Final-slide concession:* "Fair: I should’ve flagged the AI link in the conclusion."  

  ---

  ### Strategic Directives  
  - **Never surrender:** "Proxy assertion’s norm is *sui generis*—collapsing it to testimony or self-assertion loses the principal’s distinctive responsibility."  
  - **Hope nobody asks:** The nightmare question (above). If asked: "Verification relies on public institutional scaffolding—e.g., corporate records, government archives. But yes, we need a ‘manifestability’ criterion—I’m working on it."  

  ---  
  **Style note:** Keep replies crisp. If overrun, say: "That’s central—let’s discuss 1-on-1 after."  
  **Final slide line:** "Thanks—I welcome all objections, especially on scope-tracking and institutional extensions!"
