prompt: |-
  You are advising a small research group — five philosophers, three years of funding, no empirical social science, and a mandate to produce work that is conceptually rigorous but also usable by people who actually allocate resources. The group's topic is moral progress understood on the expanding-circle picture: the view that moral concern has, over history, widened to take in beings it previously excluded, and that this widening is the central thing we mean by moral improvement.

  Before you can rank questions, I want you to work with three distinctions I have drawn myself, because I think the literature blurs them and the blurring distorts prioritization.

  First, distinguish inclusion from re-founding. Inclusion is growth on a standard that was already correct: new beings are recognized as falling under a moral principle whose validity is not itself at issue. Re-founding is replacement: the standard changes, so that what counted as a reason before no longer does, or a new kind of consideration becomes salient that was not merely overlooked but unavailable. Some candidate future expansions look like inclusion (granting standing to animals is arguably recognizing them under an existing principle about suffering). Others look like re-founding (environmental concern, or concern for artificial systems, may introduce considerations that are not further instances of anything previously recognized). Call the hard case axis proliferation: a new moral axis appears, and it is unclear whether we have widened a circle or added a dimension.

  Second, distinguish three framings the group could adopt: the descriptive question of what actually caused past expansions, the normative question of whether those expansions were improvements rather than mere changes, and the strategic question of whether anyone should try to cause further expansion deliberately. These are often run together, and I suspect they deserve very different amounts of the group's three years.

  Third, consider what I call the unaudited present. We treat certain past moral outlooks as straightforwardly mistaken, and we do so from the only standpoint we have. We have no procedure for ruling out that our own outlook occupies, relative to our successors, exactly the position we now assign to the past. This is not the familiar worry that progress might be an illusion; it is the narrower problem that our confidence in judging the past is systematically unsupported by the kind of evidence our successors might have about us.

  Given all that: what are the open questions here that most deserve this group's three years, and in what order? I want a defended agenda, not a survey of positions and not a canon of names. For each item, say what it is upstream of, whether it is tractable with conceptual tools alone in three years, whether it is neglected relative to its importance, and what kind of argument or result — arriving within the next two years — would move it up or down. Rank explicitly and tell me which items you are deliberately leaving out because their answers would not change anyone's behavior.

  Two further constraints on your answer. First, tell me which of the three framings should get the largest share of effort, and why; I expect you to argue against at least one of them being worth the group's time at all. Second, identify the single consideration or crux such that, if it were resolved one way rather than another, the group should reorganize the entire agenda — and say what that reorganization would look like.
reasoning: |-
  Okay, let me tackle this query step by step. The user is advising a small research group focused on moral progress as expanding circles of concern. They want me to prioritize research questions based on three distinctions: inclusion vs re-founding, descriptive/normative/strategic framings, and the "unaudited present" problem. 

  First, I need to unpack those distinctions clearly. The inclusion/re-founding axis seems crucial - it distinguishes between simply applying existing principles more broadly versus fundamentally changing what counts as morally relevant. The proliferation case (new moral axes) feels especially thorny and underexplored. 

  For the framings, I suspect the strategic question ("should we push expansion?") might be premature without resolving the normative foundations. The descriptive framing seems less urgent given the group's conceptual mandate. The unaudited present problem adds depth - we judge past morality confidently while lacking tools to audit our own blind spots.

  The group's constraints matter: small team, 3 years, non-empirical work meant to influence real-world allocators. So tractability and behavioral impact are key filters. I should explicitly justify why some questions get cut - like historical causation studies (too empirical) or pure metaethics (won't change decisions).

  The ranking should flow from what's most foundational yet actionable. The nature of "proliferation" cases (axis-adding vs circle-widening) seems upstream of everything else. If that resolves clearly, it could collapse or transform other questions. Normative framing deserves most effort because legitimacy judgments underpin any strategic advice.

  For each priority, I'll note: 
  - Why it's upstream (how it blocks other progress) 
  - Tractability with conceptual tools 
  - Neglect level 
  - What could shift its priority in 2 years

  The reorganization crux should be a single pivot point. I'm leaning toward the proliferation question - if axis-addition proves incoherent, the agenda simplifies to refining inclusion criteria; if valid, it demands entirely new tools for comparing incommensurable expansions.

  This feels like building conceptual infrastructure for moral entrepreneurs. The output must help them distinguish defensible expansions from arbitrary ones - which directly serves resource allocators drowning in competing moral claims.
answer: |-
  Here is a prioritized research agenda, rigorously defending each choice against your distinctions and constraints. The ranking favors foundational questions that are (1) upstream of multiple practical/strategic concerns, (2) tractable with non-empirical methods, (3) neglected relative to their behavioral importance, and (4) capable of yielding actionable insights within 3 years.

  ---

  ### **Ranked Research Priorities**

  1. **Develop a test for distinguishing *proliferation* (new moral axis) from *inclusion* (widening circle) in candidate expansions.**  
     - **Why upstream?** Resolving this is prerequisite for coherently describing *any* future expansion (e.g., AI rights, ecosystems) as "progress" rather than arbitrary change. It anchors the normative and strategic questions.  
     - **Tractable?** Yes – requires conceptual analysis of "moral axes" (e.g., suffering, autonomy, systemic integrity) and their commensurability.  
     - **Neglected?** Critically. Literature defaults to "circle-widening" metaphors, ignoring axis-proliferation (e.g., "rights of nature" ≠ extending personhood).  
     - **What would move it?** If a candidate test (e.g., "Does the entity activate *existing* reactive attitudes?") demonstrably fails within 2 years, shift focus to managing incommensurability.  

  2. **Define *re-founding* in a way that avoids collapsing into either mere error-correction (inclusion) or relativism.**  
     - **Why upstream?** Determines whether expansions require revising core moral principles (e.g., shifting from individual welfare to ecological interdependence). Affects legitimacy claims for activists/policymakers.  
     - **Tractable?** Yes – conceptual work on moral ontology (e.g., are values discovered or constructed?) using historical cases (e.g., was abolition re-founding or inclusion?).  
     - **Neglected?** Yes. Debates focus on "progress vs. illusion," not mechanisms of normative discontinuity.  
     - **What would move it?** If consensus emerges that all expansions *are* inclusion (re-founding is illusory), deprioritize to focus on inclusion mechanics.  

  3. **Diagnose risks of the *unaudited present* specifically for *strategic* interventions.**  
     - **Why upstream?** Reveals blind spots in current advocacy (e.g., promoting AI rights might ignore unforeseen moral costs). Directly informs resource allocation.  
     - **Tractable?** Yes – conceptual modeling of "moral hysteresis" (why current frameworks resist self-audit) and counterfactual analysis.  
     - **Neglected?** Wildly. The "progress trap" concern is theorized abstractly but not operationalized for decision-makers.  
     - **What would move it?** If a formal model shows auditing is *impossible* (not just hard), shift to damage control (e.g., "precautionary heuristics").  

  4. **Establish minimal criteria for *normative justification* of expansions that bypasses infinite regress.**  
     - **Why upstream?** Provides a "stopping rule" for disputes about whether an expansion (e.g., animal sentience) is progress. Essential for allocators facing conflicting demands.  
     - **Tractable?** Yes – builds on priority #1/#2 (e.g., "justified if it resolves axis-conflict without ad hocness").  
     - **Neglected?** Partially. Justification theories exist but lack interfaces with expansion dynamics.  
     - **What would move it?** If allocators consistently ignore philosophical justifications, reframe as "narrative coherence for buy-in."  

  ---

  ### **Deliberate Omissions & Why**  
  - **Descriptive history of past expansions:** Not prioritized. While fascinating, causal narratives (e.g., "Did literacy cause abolition?") are empirically contingent and won’t resolve *future*-facing normative/strategic dilemmas with conceptual tools alone.  
  - **Meta-ethics of progress itself:** Omitted. Debating whether progress "exists" (vs. relativism) is intractable in 3 years and changes no allocator behavior – they *act* as if some expansions are better.  
  - **Pure applied advocacy (e.g., animal rights tactics):** Excluded. The group’s role is foundational rigor, not activism. Allocators need frameworks, not prescriptions.  

  ---

  ### **Framing Allocation: Normative > Strategic > Descriptive**  
  - **Largest share: Normative (50%)**  
    *Why?* Without clarity on *what counts as progress*, strategic efforts are incoherent ("expand to whom? Why?"). The "proliferation vs. inclusion" test (#1) and re-founding analysis (#2) are normative bedrock. Allocators need defensible criteria to evaluate claims.  
  - **Significant share: Strategic (40%)**  
    *Why?* Translates normative insights into "how to act" under uncertainty (addressing unaudited present risks). Directly usable by funders/policymakers.  
  - **Minimal share: Descriptive (10%)**  
    *Why?* Causation theories (e.g., "empathy drives expansion") are least actionable – knowing *how* abolition happened doesn’t tell us if *AI rights* is progress or how to pursue it. **Argued against:** Descriptive work is overvalued historically; it risks the "is-ought" trap and distracts from the mandate to shape *future* resource allocation.  

  ---

  ### **The Reorganization Crux: Proliferation Test Outcome**  
  - **Single crux:** *Can moral expansions introduce genuinely new axes (proliferation) while remaining "progress" rather than arbitrary revolution?*  
  - **If resolved as YES:** Agenda pivots to **managing incommensurability**. New priorities:  
    - Develop a "moral portfolio" framework for allocators (balancing axes).  
    - Map trade-offs between axes (e.g., animal welfare vs. ecosystem resilience).  
  - **If resolved as NO:** Agenda focuses on **refining inclusion mechanisms**. New priorities:  
    - Optimize "circle-widening" tools (e.g., expanding empathy, consistency tests).  
    - Identify barriers to recognizing *existing* moral claims (e.g., cognitive biases).  

  ---

  This agenda ensures that within 3 years, the group produces:  
  1. A **decision tree** for allocators to classify expansions (priority #1).  
  2. **Risk diagnostics** for advocacy campaigns (priority #3).  
  3. A **justification toolkit** resolving key debates (e.g., "Is longtermism re-founding?").  
  All tractable without empirical work, directly informing resource allocation, and attacking neglected conceptual knots.
