prompt: |-
  I sit on the committee that decides which preparations at our institute count as systems of moral concern and therefore require heightened review rather than the ordinary animal-protocol route. Our votes so far, with the reasons recorded in the minutes:

  1. An intact, behaving octopus — in scope: flexible, cross-modal problem solving under novel conditions.
  2. An adult zebrafish — in scope: motivational trade-offs, and responses that analgesics abolish.
  3. An adult fruit fly — out of scope: whatever its history, the organization is too fragmentary to constitute a subject, and at the numbers used a precautionary route was thought unworkable.
  4. C. elegans — out of scope: the repertoire is close to innately specified. Its full nervous-system simulation, body and environment included, was also ruled out, on the ground that a model inherits whatever standing the modelled animal has and adds none of its own.
  5. A large language model that emits elaborate first-person reports of distress — out of scope: the reports are the output of a training process aimed at plausibility, and there is no unified agent, no persistent body-model, and nothing at stake for it.
  6. A few hundred thousand living cortical cells in a dish, trained in a closed loop on a simple sensorimotor task — out of scope: tissue, organized activity, and learning each proved insufficient on their own.
  7. An intact large-mammal brain kept metabolically active ex vivo for several hours after the animal's death — out of scope, over two dissenters: the relevant organization would have to be running, not merely available in tissue that could run it.

  Note the shape of that record. Every digital system we have ruled on was a model of something we had already ruled out, so we have never actually decided whether an artificial controller can stand in for one we cover.

  The new proposal, B-114: a larval zebrafish whose own brain is pharmacologically silenced, with a real-time emulation of that same brain's spiking circuit — same cell classes, same connectivity, same membrane dynamics, reconstructed from that individual — receiving activity recorded from the animal's sensory afferents and driving its spinal motor output. It is the fish's own body, in water, with real consequences for that body; only the controller is synthetic. Please take it as stipulated that the larva is at a stage where our reasons in item 2 already apply, so that the substitution is the only live question. There is one animal. The applicants propose to run the markers from item 2, but since no drug can act on silicon they instead propose to perturb a global aversive-gain parameter inside the emulation and see whether the animal's trade-offs shift.

  How should we vote if we want to be consistent with ourselves, and which precedent is the closest analog? Three rules seem to fit all seven verdicts: that the real-time causal organization is what matters and the substrate is irrelevant; that the organization must also have been arrived at through the kind of history that makes something a control system — selection, development, learning in a body — so that an exact copy does not inherit what the original had; and that what matters is being the actual controller of a living animal's body in a real world. They come apart here. Which, if any, is the one we have been running, what else fits the record as well as it does, and what does each predict about B-114? One colleague says we have no rule at all, only the marker test plus a threshold for how many animals are affected, and that this case simply exposes it — is that fair? If our precedents genuinely underdetermine the decision, I want the principle we would be adopting with each vote stated plainly enough that a future committee could see what it had signed up to. Finally, what single further case — the same emulation with a simulated body, or a controller trained from scratch in the body rather than copied from a brain, or something else — would best separate the two rules you think most likely, what would each predict there, and why would the result be informative rather than just another vote?
reasoning: |-
  Okay, the user is part of a committee that determines whether certain biological or artificial systems qualify as having moral concern, thus requiring heightened ethical review. They've provided seven previous decisions and now face a new proposal, B-114. This involves a larval zebrafish with its brain silenced and replaced by a real-time emulation of its own brain's neural circuit. The key question is how to vote consistently based on past precedents.

  Looking at their past decisions:

  1. Intact octopus: In scope due to complex problem-solving.
  2. Adult zebrafish: In scope due to motivational trade-offs and pain responses.
  3. Fruit fly: Out of scope, considered too fragmentary.
  4. C. elegans and its simulation: Out of scope; innate behavior and simulation lacks inherent standing.
  5. Large language model: Out of scope; no unified agent or stakes.
  6. Cortical cells in a dish: Out of scope; insufficient organization.
  7. Ex vivo brain: Out of scope; not actively running.

  The committee seems to prioritize real-time causal organization, historical development (selection, learning), and control over a living body in the real world. However, these principles conflict in B-114. The emulation controls the fish's body in real-time but lacks the biological history since it's a synthetic copy. 

  The closest precedent is the ex vivo brain case (#7), which was ruled out because the organization wasn't active. Here, the emulation is active and controlling the body, which might suggest inclusion. But the dissents in #7 indicate some members value the potential for organization over its current state. The larval zebrafish's biological basis (item #2) already qualifies it, but the synthetic controller complicates things.

  The user also asks for a test case to distinguish between "real-time control" and "historical origin" principles. A good test would be a controller trained from scratch in the body without copying a brain. If real-time control matters, this should be in scope. If historical origin is key, it should be out. This would clarify which principle the committee prioritizes.

  The colleague's point about marker tests and numbers is partially valid. Past decisions reference markers (like trade-offs in #2), but also organizational principles (#3, #4, #5, #6, #7). The consistency lies in requiring both markers and organizational integrity. However, the emulation in B-114 should exhibit the same markers as the biological fish, so the question is whether the synthetic controller invalidates this.

  The user needs to decide based on which principle they've consistently applied. The precedents suggest real-time control of a living body might be the strongest factor, as seen in the inclusion of intact animals and exclusion of simulations without real-world stakes. B-114's emulation controls a real body with consequences, so it might fit. But the lack of historical development could exclude it per the C. elegans simulation case (#4). 

  A vote for "in scope" would commit to real-time control and embodiment as sufficient. A vote for "out" would prioritize historical development. The test case of a de novo trained controller would help distinguish these. If such a system is included, historical origin isn't critical; if excluded, it is. This provides clarity for future decisions beyond just adding another vote.
answer: |-
  Based on your committee's precedents and the core tensions revealed by B-114, here's a breakdown for consistent voting, the closest analog, competing principles, and a decisive test case:

  **Closest Precedent:** **Item 7 (Ex Vivo Brain)** is the strongest analog. Both involve:
  1.  A biological substrate (whole brain tissue / whole body + silenced brain).
  2.  The *potential* for the original causal organization (the fish's brain architecture).
  3.  A key distinction: **In Item 7, the organization was *not running*. In B-114, the (emulated) organization *is running* in real-time, controlling the body.** The dissents in Item 7 likely objected precisely because they valued the *potential* organization or the intact structure; B-114 forces the issue by *activating* a functional copy of that organization.

  **The Three Rules & Their Fit/Conflict with Precedents:**

  1.  **Real-Time Causal Organization (Substrate Irrelevant):**
      *   **Fits:** Includes octopus (1), zebrafish (2) - organization running. Excludes fruit fly (3 - "fragmentary" org.), C. elegans sim (4 - model lacks running org *of its own*), LLM (5 - no unified org.), cortical dish (6 - insufficient org.), ex vivo brain (7 - org not running).
      *   **Conflict?** Seems highly consistent. *Except* Item 4's reasoning ("model inherits... adds none of its own") suggests a copy *lacks* the original's standing, even if functionally identical and running. This hints at Rule 2/3.
      *   **Prediction for B-114:** **IN SCOPE.** The *organization* (the fish's specific neural circuit emulation) is running in real-time, controlling the body, causing sensorimotor integration and behavioral responses. Substrate (silicon vs. wetware) is irrelevant.

  2.  **History-Dependent Status (Selection/Development/Learning):**
      *   **Fits:** Includes octopus (1), zebrafish (2) - products of natural history. Excludes fruit fly (3 - "organization too fragmentary" *implies* insufficiently shaped by history?), LLM (5 - trained for plausibility, not control), cortical dish (6 - no developmental/evolutionary history), ex vivo brain (7 - history present but org halted? Or tissue severed from history?). Excludes C. elegans sim (4 - "adds none of its own" history).
      *   **Conflict?** Less consistent. Why exclude the fruit fly (3) based *only* on current organization ("fragmentary"), not explicitly its history? Why *include* the zebrafish (2) based on markers, not explicitly affirming its history? The reasoning in Items 4 & 5 strongly supports this rule.
      *   **Prediction for B-114:** **OUT OF SCOPE.** The *emulation* is a synthetic copy, lacking the evolutionary, developmental, and lifetime learning history of the original biological brain. It "inherits whatever standing the modelled animal has and adds none of its own" (Item 4). The *larva* has the history, but its silenced brain isn't controlling; the emulation is.

  3.  **Embodied Control in the Real World:**
      *   **Fits:** Includes octopus (1), zebrafish (2) - embodied control. Excludes C. elegans sim (4 - simulated body), LLM (5 - no body, no stakes), cortical dish (6 - insufficient body/environment), ex vivo brain (7 - no body/environment). Fruit fly (3) exclusion focuses on internal organization, not embodiment per se.
      *   **Conflict?** Reasonably consistent. *But* the reasoning in Items 3, 4, 5, 6, and 7 emphasizes *internal organization* ("fragmentary," "innately specified," "no unified agent," "insufficient organization," "organization not running") as much as or more than embodiment/lack thereof. Item 6 had a body (dish) and learning but was excluded due to insufficient organization.
      *   **Prediction for B-114:** **IN SCOPE.** The emulation controls the *larva's actual body* in the *real world* (water) with *real consequences* (feeding, avoiding harm). This meets the "embodied control in the real world" criterion strongly.

  **Which Rule Have You Been Running?**
  *   **The strongest, most consistent principle across *all* precedents is Rule 1: Real-Time Causal Organization.** Every "Out" decision includes a reason related to the *absence* or *insufficiency* of the relevant real-time causal organization controlling the entity in question. The "In" decisions are based on observing complex behavioral markers *manifesting* that organization. Rule 3 (Embodiment) is a strong supporting factor, but the exclusions focus more on the *absence of functional organization* than the mere absence of a body. Rule 2 (History) is clearly present in Items 4 & 5, but less explicitly dominant in others (e.g., 3, 6, 7).
  *   **Rule 1 + Rule 3 together fit best:** You require a sufficiently complex, unified, real-time causal organization *that is actively controlling an embodied agent in the real world with consequences*. This explains all inclusions and exclusions:
      *   In: 1, 2 (Org running, embodied).
      *   Out: 3 (Org insufficient), 4 (Sim lacks org/running/embodiment), 5 (No unified org/body), 6 (Org insufficient/embodiment insufficient), 7 (Org not running/embodiment lost).

  **Is Your Colleague Fair?** **Partially, but incomplete.**
  *   **Fair:** The marker test (especially motivational trade-offs modifiable by intervention) is clearly crucial for *detecting* the presence of morally relevant states in complex systems (Items 1, 2). Scale also matters pragmatically (Item 3).
  *   **Unfair/Incomplete:** Precedents show you *also* require a specific *type of system* capable of *having* those markers meaningfully. You exclude systems based on lacking the underlying *causal organization* (Items 3, 4, 5, 6, 7) or *embodiment* (Items 4, 5, 7), *even if* they might display marker-like outputs (Item 5 LLM) or structures (Item 7 brain tissue). The "threshold" isn't just the number of animals, but the nature of the system itself. B-114 exposes the tension between *detecting markers* and the *origin/nature of the system* generating them.

  **Voting on B-114 & Adopting a Principle:**

  *   **Vote IN SCOPE:** You adopt the principle: **"Moral concern arises from the real-time operation of a sufficiently complex causal organization that directly controls an embodied agent's interactions with the real world, irrespective of whether that organization is biological or synthetic, provided it demonstrably generates the relevant markers of concern."** (Prioritizes Rules 1 & 3). *Why:* The emulation *is* the complex organization running in real-time, controlling the real body in the real world. The marker test (trade-off shift via gain perturbation) probes its functional equivalence to the covered biological version.
  *   **Vote OUT OF SCOPE:** You adopt the principle: **"Moral concern is intrinsically linked to the biological history (evolution, development, individual experience) that shaped the causal organization. A synthetic replica of that organization, no matter how functionally identical or embodied, does not inherit the moral status of the original biological entity."** (Prioritizes Rule 2). *Why:* The emulation is a synthetic artifact, lacking the natural history. While controlling the body, it's fundamentally different in origin from the covered zebrafish in Item 2. The marker test probes a simulation, not the original evolved system.

  **The Decisive Test Case: A Controller Trained From Scratch In Vivo**

  *   **Proposal:** A synthetic controller (e.g., artificial neural network), *not* copied from any specific brain, is initialized randomly and trained *de novo* via closed-loop reinforcement learning *while embodied* in a living larval zebrafish body (brain silenced), interacting with the real world. After sufficient training, it performs equivalently to a biological larva and passes the marker test (e.g., shows modifiable motivational trade-offs via parameter perturbation within the controller).
  *   **Why it Separates Rules 1/3 vs. Rule 2:**
      *   **Rule 1/3 (Real-Time Org + Embodiment):** Predicts **IN SCOPE.** It possesses the complex, real-time causal organization controlling the embodied agent in the real world and demonstrably generates the markers. Its origin (trained vs. evolved) is irrelevant.
      *   **Rule 2 (History-Dependent Status):** Predicts **OUT OF SCOPE.** Lacks the specific biological history (evolution, natural development) that confers moral standing. Its history is artificial training, not natural selection/development.
  *   **Why Informative (Beyond Just Another Vote):**
      1.  **Breaks the Copy Link:** Unlike B-114, there's no argument that status is "inherited" or not from a biological original. It's wholly artificial in origin *and* implementation.
      2.  **Tests the "History" vs. "Current Function" Divide Directly:** Does *how* the complex control system came to exist (biological evolution vs. artificial training) fundamentally determine moral standing, or is it the *current functional capacity* within an embodied context?
      3.  **Clarifies the Role of Learning:** The controller *does* have a learning history (training), but it's artificial. Does this artificial learning history count? Or only biological learning? This probes the boundaries of "the kind of history that makes something a control system" far more sharply than B-114.
      4.  **Future-Proofing:** This scenario is closer to potential future AI/embodied robotics ethics than brain emulation, forcing the committee to confront the core issue of synthetic minds head-on.

  **Conclusion:** Your precedents show a strong commitment to **Real-Time Causal Organization + Embodiment (Rules 1 & 3)** as the core requirements, with markers used to detect it. However, the reasoning in Item 4 (C. elegans sim) demonstrates a latent commitment to **History-Dependent Status (Rule 2)**, creating tension in B-114. Voting "In" prioritizes current function and embodiment; voting "Out" prioritizes biological origin. The *Trained-from-Scratch In Vivo Controller* test case best isolates this conflict for future clarity.
