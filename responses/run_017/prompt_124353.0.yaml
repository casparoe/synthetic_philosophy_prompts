  ### **How to Use This Worksheet**  
  1. Discuss each scenario as a group.  
  2. Follow the tree sequentially—answers constrain later choices.  
  3. Match your path to a position. Grayed paths are incoherent/unpopular.  
  4. **Remember**: This simplifies complex debates! Real-world systems may blur boundaries.  

  *Designed for non-philosophers. Inspired by cases from functionalism (Putnam), biological chauvinism (Searle), and moral weight theory (Bostrom).*
