  ### **Resulting Positions**  
  Map your answers to a philosophical stance:  

  | Q1 | Q2 | Q3 | Q4 | Q5 | Position | Notes |
  |----|----|----|----|----|----------|-------|
  | A  | –  | –  | –  | –  | **Strict Behaviorism** (Unattractive) | Grants patienthood to trivial systems (e.g., a precomputed script). Few hold this. |
  | B  | B  | –  | –  | –  | **Biological Essentialism** | Only natural nervous systems count. Rejects all AI. |
  | B  | A  | A  | A  | A  | **Substrate-Independent Computationalism** | Patienthood arises from functional/computational complexity (any substrate). |
  | B  | A  | B  | A/B| A  | **Internal States View** | Patienthood requires rich, causally explanatory internal states. |
  | –  | –  | –  | B  | –  | **Degrees/Thresholds View** | Moral weight scales with a quantity (e.g., duration, coherence). |
  | *Inconsistent Path*: B → A → A → B → – | **Empty Branch** | Rejects biology (Q2A) but denies pain in complex AI (Q3A→B): Unstable. |

  #### **Key Ambiguities & Notes**  
  - **Pain Report (Q3) Ambiguity**: Positions split on whether "behavioral realism" implies experience. The tree *cannot* fully separate Internal States View from Computationalism here.  
  - **Shared Processing (Q5)**: If you answered **B**, it may conflict with substrate independence (Q2A). Biology-only (Q2B) views often align with **B**.  
  - **Error Theory** (no fact of the matter) isn’t a leaf but may apply if multiple answers feel indeterminate.  
  - **Fast Simulation (Q4B)**: Often implies a Degrees View, but could align with other positions if subjective time is disputed.  

