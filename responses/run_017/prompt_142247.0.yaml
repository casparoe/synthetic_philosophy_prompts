prompt: |-
  I'm one of three people on the programme committee of a small, newly endowed institute — five years of core funding, about eight resident fellows a year, mostly philosophers and theoretically inclined cognitive scientists, and effectively no compute budget — whose founding charter takes as its organising idea a proposal of Turing's: instead of trying to write a programme that simulates the adult mind, build something with the organisation of a child's mind, which he compares to a notebook bought from a stationer's, with very little mechanism and a great many blank pages, and then subject it to an appropriate course of education. My two colleagues read that charter very differently. One says the proposal has been vindicated by history, since we now build systems by training rather than by hand-coding, so what remains is engineering and a conceptual institute would be a museum. The other says the vindication is only apparent and that the whole interesting content of the charter sits in a single question: what, precisely, is the difference between teaching a system and building one. I trust neither summary, and the three of us have to hand in an agenda by the end of term.

  So what I want is a defended five-year research agenda, not a survey: three or four questions the institute should make its own, in priority order, together with the reasoning that fixes the order. Please don't give me a bibliography or a reading list — I want the dependency structure. Which questions are upstream of which; which are genuinely tractable with conceptual tools and no compute; which are neglected in the sense that almost nobody with our toolkit is working on them; and which should be dropped because they are empirical problems in philosophical costume, or because their answer wouldn't change anything downstream. I also want to know what would move a question up or down the list: which result, argument, or technical development over the next five years would change the ranking, and which questions are stable under any evidence we can realistically expect.

  Here are the candidates as the committee has been stating them, so that you can also tell me which of them we have misdescribed. (i) The syllabus objection: education may merely relocate the specification burden, so that the target that would have been written into a programme reappears in the curriculum, the sequence of tasks, the feedback regime and the schedule of rewards and punishments — in which case the child-machine proposal inherits the problem it was supposed to dissolve, only less transparently, and might even leave us worse off. (ii) Teaching versus rewiring: both are interventions that alter a system's dispositions; if the distinction is one of degree, or of which interface we happen to intervene through, does anything philosophically interesting turn on it? (iii) Reason-responsiveness: whether a system's updates track the content of a correction as a reason, rather than merely registering reinforcement, and whether that could be probed from the outside at all. (iv) The examination reading of the imitation game: if the test is closer to a school examination than to a behavioural criterion, then rote learning, training to the test, and vast stored tables of replies become the crux rather than a side worry, and questions about what understanding adds to success become prior to questions about how to produce success. (v) Scaffold-dependence: whether the capacities of an educated system are partly constituted by its school — the teachers, the feedback protocol, the artefacts on the desk — so that the real unit of assessment is machine plus institution, and what it would even mean to examine the machine with the scaffolding removed. Which of these are load-bearing, which are pseudo-problems or already settled in substance, and what have the three of us left out?
reasoning: |-
  Okay, let me tackle this user's complex query. The user is part of a three-person committee for a new institute focused on Turing's child-machine concept. They need a prioritized five-year research agenda without empirical work or heavy computation. Their colleagues have conflicting views: one thinks training-based AI vindicates Turing, making the institute irrelevant; the other emphasizes the teaching-vs-building distinction. The user distrusts both and seeks core conceptual questions.

  First, I need to unpack the candidate questions they provided. The syllabus objection questions if education just moves the specification problem elsewhere. Teaching versus rewiring asks if the distinction matters philosophically. Reason-responsiveness probes whether systems update based on reasons versus mere reinforcement. The examination reading of the imitation game suggests treating the Turing Test like an exam, prioritizing understanding over performance. Scaffold-dependence questions if a system's abilities are tied to its training environment.

  The user wants these evaluated for dependencies, tractability without compute, neglect by philosophers, and whether they're pseudo-problems. They also need to know what would change the priorities. 

  Starting with dependencies: the teaching/building distinction seems foundational. If education is just a form of building, the syllabus objection collapses. So that's upstream. Reason-responsiveness depends on clarifying teaching vs. building first—otherwise, we can't define "reasons." Scaffold-dependence might be downstream, as it assumes a system is already being taught. The examination reading could be parallel but feeds into how we assess understanding.

  Tractability matters. Questions needing only conceptual analysis fit the no-compute constraint. Teaching vs. building is purely philosophical. Syllabus objection might require some AI literacy but remains conceptual. Reason-responsiveness needs logical tools to define "tracking reasons." Scaffold-dependence could stray into empirical territory if it involves real-world systems.

  Neglect is key. The Turing Test is well-trodden, but the examination angle might be underexplored. Scaffold-dependence in philosophy is rare—most treat systems in isolation. Reason-responsiveness is tackled in epistemology but not applied to AI education.

  Pseudo-problems? Teaching vs. rewiring might seem like a non-issue if interfaces don't matter. But if the distinction affects autonomy or understanding, it's substantive. The syllabus objection could be dismissed if curricula aren't equivalent to code, but that needs arguing.

  Missing questions? Perhaps how "blank slate" the child-machine should be—minimal innate structure vs. built-in biases. Also, what constitutes progress in education versus capability. And the ethics of educational metaphors applied to AI.

  Prioritization: Teaching vs. building must come first—it's the keystone. Syllabus objection next, as it tests if education solves the original problem. Reason-responsiveness follows, probing the quality of learning. Scaffold-dependence last, as it's context-dependent. Examination reading informs assessment but isn't core to the agenda.

  What changes priorities? If AI develops systems that clearly learn reasons, reason-responsiveness moves up. If curricula are shown to transfer universally, scaffold-dependence drops. If teaching/building is empirically resolved (unlikely), the agenda shifts.

  This structure addresses the user's needs: actionable, conceptual, and grounded in their institute's mission.
answer: |-
  Here is a prioritized, defended 5-year research agenda for your institute, structured to address the core tension in your charter while leveraging your conceptual strengths. The priorities are based on logical dependencies, tractability without compute, neglect by philosophical/cognitive science communities, and downstream impact. Candidate questions are critically evaluated and integrated.

  **Core Insight:** Turing’s "child machine" is not just about *training vs. coding* but about **constituting agency through education**. The charter’s substance lies in whether education creates a *different kind of system*—one whose capacities are dynamically normative, scaffolded, and reason-responsive—rather than merely a more efficient path to fixed behavioral outputs.

  ---

  ### **Priority 1: Teaching vs. Building (The Interface Question)**  
  *Reframed: **Under what conditions does an intervention count as "teaching" rather than "rewiring," and does this distinction ground a difference in the kind of system produced?***  

  - **Why Upstream?**  
    This is the foundational question. If all interventions are merely "building" (rewiring), then the syllabus objection holds (education relocates specification), reason-responsiveness is illusory, scaffold-dependence is trivial, and the charter collapses into engineering. If "teaching" is distinct, it reshapes all downstream questions.  
  - **Tractability & Neglect:**  
    Purely conceptual/philosophical. Requires analyzing "interfaces" (e.g., reward signals vs. symbolic corrections), agency, and normativity. Neglected in AI ethics/epistemology, which often conflates training with teaching.  
  - **Dependencies:**  
    Resolving this determines whether the syllabus objection is fatal (Priority 2) and whether reason-responsiveness (Priority 3) is possible.  
  - **What Would Move It:**  
    **DOWN** if a compelling argument shows "teaching" is *always* reducible to parameter adjustment. **UP** if cognitive science/AI finds systems that *only* update via pedagogically structured inputs.  
  - **Why Not Drop?**  
    The entire charter hinges on this. If settled as "mere rewiring," the institute shifts focus to epistemology of AI training.  

  ---

  ### **Priority 2: The Syllabus Objection (Specification Relocation)**  
  *Reframed: **Does education transfer normative authority to the learner, or does it embed the designer’s intent in the curriculum?***  

  - **Why Second?**  
    If Priority 1 establishes that teaching is distinct, this tests whether it *succeeds* in avoiding the "adult programme" problem. If not, the child-machine fails its core promise.  
  - **Tractability & Neglect:**  
    Conceptual analysis of curricula/training regimes vs. fixed architectures. Neglected in ML (focused on optimization, not norm-transfer).  
  - **Dependencies:**  
    Requires Priority 1’s distinction. Informs whether scaffold-dependence (Priority 4) is a bug or feature.  
  - **What Would Move It:**  
    **DOWN** if Priority 1 concludes teaching is rewiring (making this redundant). **UP** if empirical AI work shows systems generalizing *beyond* training distribution in norm-governed ways.  
  - **Why Not Drop?**  
    Central to Turing’s proposal. If unresolved, the institute risks endorsing a false solution.  

  ---

  ### **Priority 3: Reason-Responsiveness (The Normativity Question)**  
  *Reframed: **Can updates track justificatory content, not just reinforcement? What external criteria would indicate this?***  

  - **Why Third?**  
    Presupposes that teaching (Priority 1) is distinct and that education isn’t just specification relocation (Priority 2). This is the *sine qua non* of "education" vs. "training."  
  - **Tractability & Neglect:**  
    Conceptual tools suffice (philosophy of mind, epistemology). Hugely neglected: ML focuses on performance, not justificatory grounding.  
  - **Dependencies:**  
    Depends on Priorities 1–2. Answers constrain the examination reading (e.g., if reason-responsiveness exists, rote fails).  
  - **What Would Move It:**  
    **DOWN** if Priority 2 shows curricula rigidly determine behavior. **UP** if proof techniques emerge for verifying "reason-tracking" in systems.  
  - **Why Not Drop?**  
    Without this, "education" is Skinnerian conditioning—philosophically uninteresting.  

  ---

  ### **Priority 4: Scaffold-Dependence (The Extended Mind Question)**  
  *Reframed: **Are educated capacities realized only within institutional scaffolds? If so, can they be "internalized"?***  

  - **Why Last?**  
    Builds on Priorities 1–3. If teaching transfers normativity (Priority 1–3), scaffolds are temporary. If not, they’re permanent crutches.  
  - **Tractability & Neglect:**  
    Conceptual (extended cognition theories) but risks empirical drift. Neglected in AI alignment, which ignores institutional embedding.  
  - **Dependencies:**  
    Requires understanding *what* education provides (Priority 1–3). Least downstream impact: even if scaffolds are essential, it doesn’t invalidate the charter.  
  - **What Would Move It:**  
    **DOWN** if Priority 2 shows curricula encode all knowledge. **UP** if AI systems exhibit capacity collapse when removed from training environments.  
  - **Why Include?**  
    Clarifies whether the "child machine" becomes truly autonomous—or remains institutionally coupled.  

  ---

  ### **Excluded/Lower-Priority Candidates:**  
  - **Examination Reading of the Imitation Game:**  
    Useful but **not upstream**. It’s an *assessment framework* for Priorities 1–4 (e.g., if reason-responsiveness exists, exams shouldn’t favor rote). Not load-bearing for the charter’s core.  
  - **"What Have We Left Out?"**  
    **The Blank-Slate Fallacy:** Turing’s "notebook" implies minimal innate structure. This is empirically dubious (cf. neural architecture priors). **Add:** *How much innate structure is compatible with education?* (Integrate into Priority 1).  
    **Progress Metrics:** *What constitutes "learning" vs. "performance"?* (Integrate into Priority 3).  

  ---

  ### **Agenda Stability & Risks**  
  - **Stable Under Evidence:** Priorities 1–3 are robust. Even if AI scales, their conceptual depth (e.g., normativity) outlasts technical change.  
  - **Fragile Elements:** Scaffold-dependence (Priority 4) could collapse if architectures become more self-contained.  
  - **Key Move-Trigger:** A breakthrough in *formalizing reason-responsiveness* (e.g., a logic of update justification) would elevate Priority 3 and validate the charter. If absent by Year 3, pivot to epistemology of ML.  

  This agenda treats the charter as a live philosophical project: not celebrating "training" as victory, but asking whether education cultivates a distinct form of agency. It prioritizes questions only your institute can own—making it a compass, not a museum.
