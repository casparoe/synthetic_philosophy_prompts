  2. A low replication rate can coexist with every individual study having been analyzed correctly. This occurs because:
     a) When the null hypothesis is true in a substantial proportion of studies, 5% of these will yield false positives (Type I errors).
     b) When the alternative is true, the proportion of studies that yield significant results (the power) may be low, especially for small effects or small sample sizes, leading to failures to replicate.
     c) Selection mechanisms (such as publishing only significant results) lead to an overrepresentation of false positives and inflated effect sizes in the published literature, which in turn causes a low replication rate.

  3. Certain selection mechanisms, such as file drawer (non-publication of non-significant results), outcome switching (changing the primary outcome after seeing the data), and optional stopping (repeated testing and stopping when significant without adjustment) invalidate the nominal p-values and confidence intervals in the following way:
