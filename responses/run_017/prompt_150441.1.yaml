  ### Joint Statement on the Replication Crisis:  
  Adversarial Collaboration between a Frequentist (Error-Statistical, Neyman-Pearson Tradition) and a Bayesian (Subjective-Prior, Coherence-First Tradition)  

  #### **1. Claims Both Can Sign**  
  Both parties endorse the following numbered claims:  
  1. A significance test at level \(\alpha\) licenses the inference that the observed data (or more extreme) would occur with probability \(\leq \alpha\) under the null hypothesis. It does *not* license claims about the probability that the null is true, the magnitude of the effect, or the practical importance of the result.  
  2. A low replication rate can coexist with every individual study being analyzed correctly. This arises because:  
     - When the null is true, 5% of studies yield false positives under correct \(\alpha\)-level testing.  
     - When the alternative is true, low statistical power (e.g., due to small samples or small effects) causes inconsistent replication.  
     - Selection mechanisms (e.g., publishing only significant results) inflate false positives in the literature, reducing replication rates even for error-controlled analyses.  
  3. Selection biases—file drawer (non-publication of non-significant results), outcome-switching (post hoc redefinition of outcomes), and uncorrected optional stopping (repeated testing without adjustment)—genuinely invalidate the following:  
     - Nominal \(p\)-values (Type I error rates exceed \(\alpha\)).  
     - Confidence interval coverage (intervals undercover true parameters).  
     - Effect size estimates (biased upward).  
     However, inferences *are not* invalidated if the selection mechanism is known, pre-specified, and analytically adjusted for (e.g., via corrected tests or explicit conditioning).  
  4. The funder’s registry design (randomized publish-all vs. significance-filtered arms, with pre-registered priors or power analyses) provides unambiguous evidence of selection effects, enabling direct quantification of publication bias.  

  #### **2. Disagreements Table**  
  | Disagreement Topic | Frequentist Position (Stated for Themselves) | Bayesian Position (Stated for Themselves) | Substantive or Verbal? |  
  |-------------------|---------------------------------------------|------------------------------------------|------------------------|  
  | Definition of valid evidence | Evidence for an effect is licensed only by pre-specified error probabilities (Type I/II) controlled in long-run frequency. | Evidence for an effect is measured by posterior belief updates that cohere with prior knowledge and avoid Dutch books. | Substantive |  
  | Role of prior information | Prior distributions introduce subjectivity, corrupting error control; inference must rely solely on sampling distributions and data. | Prior distributions are essential for coherent inference, as they encode rational beliefs and enable optimal updating via Bayes’ theorem. | Substantive |  
  | Handling of selection across studies | Selection mechanisms (e.g., significance filtering) distort sampling distributions; valid inference requires explicit modeling of the selection process. | Selection is a data-dependent event; once conditioned on in the likelihood (given a proper prior), it does not distort coherent posterior inferences. | Substantive |  
  | Interpretation of hierarchical/empirical Bayes | Priors fitted to the archive (e.g., via hierarchical models) are frequentist methods in disguise, as they rely on long-run aggregation, not subjective belief. | Hierarchical/empirical Bayes is Bayesian inference, as it updates hyperpriors to share information across studies while maintaining coherence. | Partly verbal, partly substantive |  
  | Stopping rules under multi-study selection | Optional stopping within studies inflates error rates, and selection *across* studies compounds this; both require explicit correction. | Stopping rules are irrelevant for inference within a study under coherence; selection across studies is distinct and must be modeled in the likelihood. | Substantive |  

  #### **3. The Cruxes**  
  The following sub-questions, if settled, would move at least one side:  
  1. Does Bayesian conditioning on the selection event (e.g., significance) yield posterior inferences that are frequency-calibrated (e.g., 95% credible intervals cover true effects 95% of the time)?  
  2. Can frequentist error statistics, using pre-registered power analyses, better predict the replication rate gap between registry arms than Bayesian methods using pre-registered priors?  
  3. Is the Bayesian irrelevance of stopping rules robust to selection across studies, such that coherent posteriors avoid bias even when conditioning on significance?  

  #### **4. Cases/Quantities and Predictions for Each Crux**  
  For each crux, both agree on a case/quantity from the registry archive. Predictions are stated in advance:  

  - **Crux 1 (Calibration under selection)**:  
    - **Case**: Significant studies in the significance-filtered arm.  
    - **Quantity**: Coverage rate of 95% credible intervals (Bayesian) vs. 95% confidence intervals (frequentist) for true effects, using the publish-all arm to estimate true effects.  
    - **Frequentist prediction**: Bayesian credible intervals will undercover (e.g., <90% coverage) due to unmodeled selection bias; frequentist intervals will cover at 95% if corrected for selection.  
    - **Bayesian prediction**: Bayesian intervals, conditioned on significance, will achieve 95% coverage; frequentist intervals will overcover or undercover due to rigid assumptions.  

  - **Crux 2 (Replication rate prediction)**:  
    - **Case**: Registry archive after 10 years, with replication defined as a new study (same design) yielding \(p < 0.05\).  
    - **Quantity**: Absolute error in predicting the replication rate gap (publish-all vs. filtered arm) using:  
      - Bayesian method: Posterior predictive probability of replication based on deposited priors.  
      - Frequentist method: Power calculations based on deposited smallest effect sizes of interest.  
    - **Frequentist prediction**: Power analyses will yield lower prediction error by directly estimating long-run success rates.  
    - **Bayesian prediction**: Posterior predictives will yield lower error by incorporating prior information and uncertainty.  

  - **Crux 3 (Stopping rules and cross-study selection)**:  
    - **Case**: Studies in the significance-filtered arm that used optional stopping (pre-registered and adjusted vs. unadjusted).  
    - **Quantity**: Bias in effect size estimates (observed vs. true effect from publish-all arm) for studies with optional stopping.  
    - **Frequentist prediction**: Unadjusted analyses (Bayesian or frequentist) show equal bias; only frequentist correction removes it.  
    - **Bayesian prediction**: Bayesian posteriors (with priors) show no bias under optional stopping, even with selection; frequentist methods bias estimates.  

  #### **Additional Inferences from the Archive**  
  - **Gap in effect-size distributions**: A large, persistent gap (larger effects in the significance-filtered arm) would:  
    - **Frequentist conclude**: Demonstrates winner’s curse; confirms selection inflates effect sizes and necessitates bias-correction methods.  
    - **Bayesian conclude**: Expected under selection; Bayesian updating (conditioning on significance) explains the gap without inferential errors.  
  - **Deposited prior vs. power analysis**:  
    - **Frequentist**: Power analyses do "more work" as they anchor design and error control.  
    - **Bayesian**: Deposited priors do "more work" as they enable inference and model selection.  
  - **Hierarchical/empirical Bayes prior**:  
    - **Frequentist**: Frequentism in disguise; uses data-driven aggregation for long-run calibration.  
    - **Bayesian**: Bayesian inference; extends coherence to hierarchical models.  
  - **Stopping rules under selection**:  
    - Both agree that selection across studies (e.g., significance filtering) *does* damage inferences if unmodeled. The Bayesian maintains that stopping rules *within* a study are irrelevant under coherence but concedes cross-study selection requires explicit conditioning in the likelihood. The frequentist argues this conditioning is inadequate without error-probability guarantees.  

  \answer{Calibration of Bayesian posteriors under selection.}
