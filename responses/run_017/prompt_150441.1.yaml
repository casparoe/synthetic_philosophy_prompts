  We are drafting a joint statement from an adversarial collaboration between a frequentist (error-statistical, Neyman-Pearson) and a Bayesian (subjective-prior, coherence-first) on the replication crisis.

  Background arrangement: A funder runs a registry with two arms. Every study is registered in advance with design and analysis fixed. Then, studies are randomly assigned to either:
    - Publish-all arm: results appear whatever they are.
    - Significance-filtered arm: results appear only if they clear the conventional threshold (e.g., p < 0.05).

  Registration requires each team to deposit, before seeing any data:
    - Either a prior distribution over the effect size
    - Or a power analysis with a stated smallest effect of interest.

  After ten years, the archive contains both arms, so the selection mechanism is known.

  The joint statement should have four parts:

  1. A numbered list of claims both can sign.
  2. A disagreements table (rows: one per residual disagreement; columns: frequentist position, Bayesian position, and whether substantive or verbal).
  3. The cruxes (sub-questions that would move at least one side if settled).
  4. For each crux, a case or quantity both agree bears on it, with each side's prediction in advance.

  Additionally, the statement should address:
  - What each side would conclude from a large and persistent gap between the effect-size distributions in the two arms.
  - Whether the deposited prior or the deposited power analysis does more of the work.
  - Whether a prior fitted to the archive itself (by hierarchical or empirical-Bayes) is Bayesian inference or frequentism in disguise.
  - What becomes of the Bayesian claim that stopping rules are irrelevant when selection is across studies (not within a single study).

  Finally, close with an answer in the form \answer{...} naming the one crux (in at most 15 words) that both sides agree would most move the debate.

  Let's break down each part.

  Part 1: Claims both can sign

  We need a list of points of agreement. Some ideas:

  - What a significance test does and does not license:
    - A significance test (at level α) licenses the inference that if the null hypothesis were true, the probability of observing a test statistic as extreme as or more extreme than the one observed would be less than α. It does not license the inference that the null hypothesis is false with probability (1-α) or that the alternative is true with that probability.
  - How a low replication rate can coexist with every individual study having been analyzed correctly:
    - If the null hypothesis is true in a large proportion of studies, then even when all analyses are performed correctly, 5% of the studies will yield significant results (false positives). Moreover, if the power is low, even true effects might not replicate consistently. Also, selection bias (like only publishing significant results) can lead to a high proportion of false positives in the published literature, hence low replication rates.
  - Which inferences are genuinely invalidated by selection (file drawer, outcome switching, optional stopping) and which are not:
    - Selection based on the outcome (e.g., file drawer, outcome switching, optional stopping without correction) invalidates the nominal p-value and confidence interval coverage. However, if the selection mechanism is known and accounted for (e.g., by using a corrected test), then valid inferences can be made. Without correction, the type I error rate is inflated and estimates are biased.

  Part 2: Disagreements table

  We need to list residual disagreements. Each row has:
  - The disagreement topic.
  - The frequentist position (in wording they accept).
  - The Bayesian position (in wording they accept).
  - Whether the disagreement is substantive or merely verbal.

  Possible disagreements:

  1. The interpretation of probability:
     - Frequentist: Probability is defined as the long-run frequency of events in repeated trials.
     - Bayesian: Probability is a measure of reasonable degree of belief given the available information.
     - This is substantive.

  2. The role of prior information:
     - Frequentist: Prior information should not be incorporated into the statistical test because it introduces subjectivity and may lead to biased results. The analysis should be based solely on the data and the specified model.
     - Bayesian: Prior information is essential for coherent reasoning and should be formally incorporated via Bayes' theorem.
     - Substantive.

  3. The handling of optional stopping (within a study):
     - Frequentist: Optional stopping without adjustment invalidates the p-value and confidence intervals because it alters the sampling distribution.
     - Bayesian: For a Bayesian using a proper prior, the stopping rule is irrelevant; the posterior depends only on the data observed and the prior, not on the stopping rule.
     - Substantive.

  4. The validity of empirical Bayes/hierarchical modeling as Bayesian:
     - Frequentist: Hierarchical models that use the data to estimate the prior (empirical Bayes) are essentially frequentist methods because they rely on the data twice and do not represent subjective prior belief.
     - Bayesian: Empirical Bayes methods are an approximation to full hierarchical Bayesian inference and can be justified as a practical way to set priors when subjective information is lacking, but they are still within the Bayesian framework.
     - This might be substantive and partly verbal (depending on definitions).

  5. The interpretation of the gap in effect sizes between the two arms:
     - We'll develop this in the context of the background.

  Part 3: Cruxes

  Cruxes are sub-questions that, if settled, would move at least one side. They should be specific and testable.

  Examples:

  1. Does the use of a subjective prior, when available, lead to more reliable inferences (e.g., in terms of calibration of posterior probabilities) than frequentist methods in the presence of selection bias?
  2. Can the frequentist error-statistical approach, with its emphasis on pre-specified designs and error control, provide a better account of the replication crisis than the Bayesian approach that conditions on the observed data?
  3. Is the Bayesian coherence requirement (avoiding sure loss in bets) sufficient to ensure that inferences are not misled by selection mechanisms?

