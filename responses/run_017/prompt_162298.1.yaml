prompt: |-
  I help run a first-year seminar called *Borderline Cases*, cross-listed between biology and philosophy, and I'm assembling the reading packet for the week on definitions of life. The standard examples — viruses, prions, mules, fire — have been done to death, and my students can predict where each one is heading before it gets there, so I want something that puts a genuinely undecided case in front of them and leaves them arguing with each other. I've been toying with a test I call the dialysis test: a human on permanent kidney dialysis is not remotely a borderline case of being alive, even though her blood chemistry is being maintained by a machine several times a week, so why should a lineage whose chemistry is maintained by a machine be any different? My colleague's reply, which I cannot shake, is that the test proves too much: a tended fire metabolises, grows, responds to its environment and reproduces, and a fire kept burning continuously in a shrine for centuries would then count as alive for as long as someone keeps feeding it — so, she says, the dialysis test is really just a way of smuggling in an answer about where you draw the boundary of the system. (I also can't tell whether the move "every organism depends on a larger system it did not build; we all breathe oxygen made by the biosphere" is a deep point or a rhetorical trick, and it seems to me to cut both ways.)

  Please write me a short story that dramatises this disagreement rather than settling it, using a setting and cast I'll specify. The Annex: a decommissioned bioremediation facility on a cold coast, a few decades out, whose last job was to run a vat of an engineered chemoautotrophic lineage — give it an institutional, dull name like Strain K-7 — that was bred to break down a contaminant in an aquifer. Build the case so that the philosophical work falls exactly where I want it: the strain metabolises, grows and reproduces under its own steam, and the logbook shows roughly nine hundred generations of genuine adaptation to the Annex's cooling water, so it passes the evolution clause of the familiar working definition of life, the one about a self-sustaining chemical system capable of Darwinian evolution, with room to spare. But it cannot synthesise one cofactor, a synthetic analogue that the Annex's metering system has always dripped into the vat, and without the drip it dies in about six hours. The funding has ended, a decommissioning inspector has arrived to certify the site closed, and the caretaker — the last person on site, not a philosopher, the one who has been keeping the log — has to decide what to do with the vat. Three characters at most: the caretaker, the inspector, and optionally the retired director on the phone.

  Constraints on how it's written: exactly five scenes, numbered 1 to 5, 150–250 words each, with nothing before scene 1 and nothing after scene 5. The philosophy has to be carried by what people do, notice and choose, not by speechifying — no character delivers a lecture longer than two sentences, nobody says 'what is life?' or anything within reach of it, and no character resolves the disagreement or is clearly authorially endorsed in resolving it. The decommissioning checklist should appear, with the familiar working definition printed on it, and someone should notice that the strain satisfies one clause of it and fails another. There must be a fire, either driftwood on the beach or the site's burn barrel, and the campfire parallel has to land as an image and an action rather than as an argument a character makes. At least one scene should shift where the system's boundary is drawn, so that by the end it is genuinely unclear whether the candidate living thing is the strain, the strain plus the metering system, or the Annex as a whole — without any character announcing that this is what is going on. The last scene should be a decision that costs something under every reading, not a verdict; I want a reader who closes the page unable to tell which side you think is right. Finally, because I'm handing this to students, add as the final line of each scene — as part of that item, not as a sixth item — one sentence in brackets saying whether what the scene assumes about life is something nearly everyone who works on this accepts, or is instead one contested reading among others; and where it is contested, name the reading in a phrase, so that a student can tell the settled from the disputed and won't mistake a controversial view for the consensus.
reasoning: |-
  Hmm, the user is running a first-year seminar called Borderline Cases that's cross-listed between biology and philosophy. They're assembling a reading packet about definitions of life and want something fresh since the standard examples like viruses and fire have become predictable. They've developed a "dialysis test" thought experiment but their colleague has pointed out it might prove too much (like making tended fires count as alive). 

  The user wants a short story set in a specific scenario: an abandoned bioremediation facility called the Annex housing Strain K-7. This engineered lineage meets most criteria for life (metabolizes, grows, reproduces, evolves) but depends on a synthetic cofactor drip. With funding cut and a decommissioning inspector arriving, the caretaker must decide the vat's fate. 

  Key constraints: exactly five scenes (150-250 words each), no lectures or philosophical speeches, must include the campfire parallel visually, shift system boundaries subtly, and end with an ambiguous decision that "costs something under every reading." Each scene needs a bracketed meta-comment about which life criteria assumptions reflect consensus vs contested views.

  I consider designing the story around three characters: the pragmatic caretaker (Dev), the by-the-book inspector (Lena), and the retired director (Dr. Aris) as a voice on the phone. The bioremediation setting offers rich imagery - decaying infrastructure, cold coasts, industrial decay. The fire parallel could be a burn barrel or driftwood beach fire. 

  For scene structure:
  1: Introduce Strain K-7's dilemma during inspection (consensus: metabolism/growth required)
  2: Show logbook proving evolution (contested: whether external dependence negates "self-sustaining")
  3: Reveal cofactor dependence via checklist (contested: "autonomy" view)
  4: Phone call with retired director (consensus: reproduction matters)
  5: Caretaker's ambiguous decision with fire imagery (contested: "system-boundary" problem)

  The ending leaves Strain K-7's status unresolved while costing Dev personally - he either destroys adapted life or preserves dependent machinery. The bracketed comments will help students identify philosophical fault lines without lecturing. Industrial descriptions will keep the focus on actions and environment rather than debates.
answer: |-
  ### Scene 1  
  The Annex hums, a low drone beneath the slap of waves on the concrete jetty. Dev, in oil-stained overalls, watches Lena, the decommissioning inspector, stamp forms. Her tablet displays the *Site Closure Checklist*. Section 4B: *Confirm termination of all biological activity*. A sub-clause quotes: *"[A] self-sustaining chemical system capable of Darwinian evolution."* Lena taps the bioreactor vat – a massive, chilled steel cylinder. "Strain K-7. Status?" Dev opens the maintenance log. "Metabolizing. Reproducing. Adapted to the cooling cycles. See?" He points to salinity tolerance notes over nine hundred logged generations. The cofactor drip-pump ticks softly in the corner.  
  *[Assumes metabolism, growth, reproduction, and evolution are widely accepted characteristics of life.]*

  ### Scene 2  
  Lena scans the log’s genetic drift graphs. "Impressive adaptation. Truly." She walks to the vat’s control panel, tracing a line on a schematic. "This feed line? The Z-9 cofactor analogue?" Dev nods. "Essential. Without the drip... six hours. Tops. Synthesizes everything else." He gestures at the complex nutrient mix display. Lena frowns at the checklist, then the vat. "Self-sustaining... but needing this?" The drip-pump’s rhythmic click fills the silence like a failing heart. Outside, wind whips foam off the grey sea.  
  *[Assumes the necessity of metabolic self-sufficiency is contested ("Autonomy Requirement").]*

  ### Scene 3  
  The burn barrel crackles on the jetty, Dev feeding it outdated manuals. Orange flames lick driftwood, consuming, dancing, replicating shapes in the smoke. Lena watches, warming her hands. "It responds. Grows. Reproduces," she murmurs, not looking at Dev. He tosses in a binder. "So does that. For now." He means the fire. Lena’s gaze shifts back towards the Annex building, its silhouette housing the vat and the ticking pump. The firelight reflects in her glasses, masking her eyes.  
  *[Assumes growth, response, and reproduction are insufficient alone (widely accepted).]*

  ### Scene 4  
  Dev calls Dr. Aris, the retired director, voice tinny on speakerphone. "The drip, Doctor. Without funding... we shut it down?" A long pause. Static hiss mimics the sea. "K-7 *is* the lineage, Dev. The adaptations are *real*. Nine hundred generations... that’s not machinery. That’s *response*." Aris sighs. "But the drip... it’s like air for us, isn’t it? We didn’t build the atmosphere." Dev glances at Lena. She’s studying the cofactor schematic again, her finger hovering over the pump and the vat as one interconnected block.  
  *[Assumes evolution via natural selection is a core, widely accepted criterion for life.]*

  ### Scene 5  
  Lena extends the final certification form. "My authority ends at the infrastructure. The biology... your call, Caretaker." She leaves. Dev stands before the vat. The drip-pump ticks. The logbook lies open at the latest adaptation entry. He thinks of the fire, reduced to embers on the jetty. He pulls the main power. Lights die; the hum ceases. But he walks not to the vat’s master kill switch, but to the cofactor pump. He unplugs it. The ticking stops. He places the pump, warm and silent, beside the logbook on the control console. The vat’s contents slowly darken in the gloom.  
  *[Assumes the location of the "system" boundary is fundamentally contested ("System Boundary Problem").]*
