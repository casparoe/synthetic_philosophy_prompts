prompt: |-
  Hi — I work on a small modelling team at a public health agency (wont name it) and we maintain four competing transmission models for the same disease: they disagree about things like how much transmission is asymptomatic, how fast immunity wanes, and whether contact rates are age-structured or not. Twice a year we have to write a "model comparison statement" that says, in so many words, which of them is closest to the truth about how this disease actually spreads, and that statement decides which model feeds into capacity planning for the coming season and which team gets its funding renewed. I've got about half a day to write it, it gets signed off by a senior epidemiologist who has never done any philosophy and will not tolerate jargon, and it has to survive being read both by external critics and by whichever modelling team just lost. Right now we basically rank by fit to last season's surveillance data plus how much people like the model, and everyone on the team knows that isn't the same thing as being closer to the truth — but we've never had a way to say what is.

  A philosopher friend mentioned over dinner that there's a literature on this under the name verisimilitude or truthlikeness, and I've been reading around the edges since. What I've pieced together (correct me in one line if I've got this wrong, then carry on) is that the obvious definition — a theory is closer to the truth when it has more true consequences and no more false ones — collapses: there's apparently a result to the effect that on that definition a false theory can never be closer to the truth than another one, which is useless to us because all four of our models are definitely false in some respects, they're all simplifications. And there seem to be three rough families of repair: ones that count content (how much truth, how much falsity), ones that measure some kind of similarity or distance between what the theory says and how the world actually is across a space of possibilities, and ones that go via expected evidence or likelihood. Plus something that worries me more: the ranking seems to depend on how you carve up the space of possible states of the world, so that if you redescribe the possibilities more finely the ordering can flip — it smells like the same kind of language-dependence trick as the grue business in induction, and I don't want to build a procedure that silently depends on a choice of vocabulary nobody wrote down.

  So: please turn whatever is actually usable here into a written procedure my team can run, in British English, and please don't give me citations or a reading list — I can't get hold of the papers and I need something I can apply, not something I can follow up. Concretely I want: a step that forces us to declare up front what the target is and at what grain (which quantities, over what population and time window, at what resolution — e.g. seasonal totals versus weekly age-stratified incidence), because I suspect most of our arguments are really about that; a rule for separating "got the causal structure right" from "got the numerical value right" when a theory is partly right in each way; an actual comparison rule for two theories we already know to be false, given that the naive one collapses, including the conditions under which the correct output is "these cannot be ranked"; a sensitivity check that re-runs the comparison one step finer and one step coarser on the partition and reports whether the ordering holds; explicit flags at the points where someone has to make a judgment call rather than follow a rule (weights, which distinctions count as relevant, how much falsity in an irrelevant corner of the space is worth tolerating) with a note on who should sign off on those; and an explicit warning step about not letting "closer to the truth" quietly become "fit last season's data best" or "most useful for the planning decision". Then run the whole thing on three cases: (i) Model A has the waning-immunity rate about right but omits asymptomatic transmission entirely, while Model B includes asymptomatic transmission with a badly wrong rate; (ii) two models that agree on coarse quantities — size and timing of the seasonal peak, total burden — but disagree about the fine-grained story of who infects whom, where I need a ranking at the finer grain; (iii) our team's favourite model, the one that fit last year's data best and that two people have built careers on, against a rival — and I specifically want at least one case where the honest output is unwelcome, either the favourite loses or the procedure refuses to rank them. Finish by saying plainly what the procedure cannot do. Somewhere around 1000–1300 words would be ideal.
reasoning: |-
  Hmm, the user is part of a public health modeling team that needs to compare four disease transmission models. They have to write a "model comparison statement" twice a year that determines which model gets used for capacity planning and funding. The current method relies on fit to last season's data and subjective preferences, which isn't the same as truthfulness. They've been exploring verisimilitude (truthlikeness) but found issues with naive definitions and language dependence.

  The user needs a practical, jargon-free procedure that can be implemented quickly. They want clear steps: defining the target upfront, separating causal structure from numerical accuracy, a comparison rule that handles false models, sensitivity checks on granularity, flags for judgment calls, and warnings against conflating truth with fit or utility. They also want examples tested, including cases where the outcome is unwelcome.

  The user is under time pressure—only half a day to write the statement—and the output must survive scrutiny from critics and disgruntled teams. Their unspoken needs include defensibility (to withstand external review), fairness (to avoid bias toward favorites), and operational simplicity (senior epidemiologists won't tolerate philosophy jargon). They're likely frustrated with subjective current methods and worried about institutional resistance if the procedure challenges established models.

  I'll design a procedure that is structured and transparent, using plain British English. I'll include a section defining the target with concrete quantities, a step to separate causal structure from parameter accuracy using a "causal fidelity" assessment, and a comparison rule based on weighted truth-content over a defined possibility space. For sensitivity, I'll add grain-coarseness checks. Judgment calls will be flagged for senior sign-off, and warnings will explicitly separate truth from fit or utility. 

  The examples will cover key dilemmas: one where a model with right immunity but missing asymptomatics loses to one with included but wrong asymptomatics (unwelcome outcome), one where fine-grained disagreement requires senior input, and one where the favorite model loses due to structural flaws despite good past fit. I'll end by listing limitations to manage expectations. This should give them a tool that's both rigorous and implementable within their constraints.
answer: |-
  ## Practical Model Comparison Procedure for Public Health Modelling Teams

  **Purpose:** To systematically assess which of several competing epidemiological models is "closer to the truth" about disease transmission dynamics for specific planning targets, acknowledging all models are simplifications.

  **Core Principle:** We define "closer to the truth" as *providing a more accurate representation of the key mechanisms driving the disease outcomes we care about for planning purposes*, within the defined scope. This is distinct from "best fit to last year's data" or "most useful for a specific decision".

  **Procedure Steps:**

  1.  **Define the Target Truth (The "What" and "How Fine"):**
      *   **What Quantities Matter?** Explicitly list the specific outcomes the "truth" assessment targets. *Examples:* Seasonal total hospitalisations, peak week ICU demand, cumulative cases in under-10s, overall attack rate, timing of epidemic peak.
      *   **Grain of Assessment:** Specify the required resolution for each quantity. *Examples:* Weekly national totals? Monthly age-stratified (0-4, 5-17, 18-64, 65+) incidence? Regional breakdowns? Continuous time-series or summary statistics?
      *   **Population & Time Window:** Define the population (e.g., England, NHS region X) and the relevant time window for assessment (e.g., historical validation period, projected next season).
      *   **Output:** A written, signed-off "Target Truth Specification" (TTS) document. **Judgment Call:** Defining the TTS. **Sign-off:** Team Lead & Senior Epidemiologist. *Rationale: Alignment on purpose prevents later goalpost shifting.*

  2.  **Identify Key Mechanisms & Parameters (The "Why"):**
      *   List the core disease mechanisms and parameters known or suspected to *drive* the target quantities. *Examples:* Asymptomatic transmission fraction, immunity waning rate, age-specific contact matrices, relative susceptibility by age, generation time, R0.
      *   **Output:** "Key Mechanism & Parameter" (KMP) list referenced to the TTS. *Rationale: Focuses assessment on what causally matters for the target.*

  3.  **Assess Causal Structure vs. Numerical Accuracy (The "How Right"):**
      *   For each model and each KMP:
          *   **Causal Fidelity:** Does the model *include* the mechanism? (Yes/Partially/No). *Example:* Model A omits asymptomatic transmission entirely (No fidelity). Model B includes it (Yes fidelity).
          *   **Numerical Accuracy:** If included, how accurate is the parameter value or functional form *based on all available evidence* (not just last season)? Use best current estimates (literature, primary studies, expert consensus). Score as: "Accurate", "Plausible Range", "Inaccurate", "Highly Uncertain". *Example:* Model B includes asymptomatic transmission but uses a rate 3x higher than the current best estimate (Inaccurate).
      *   **Output:** A table for each model: KMP | Causal Fidelity | Numerical Accuracy | Evidence Summary (Brief). **Judgment Call:** Scoring "Numerical Accuracy" requires weighing evidence; scoring "Causal Fidelity" for complex mechanisms. **Sign-off:** Modelling Team Consensus, noted by Team Lead.

  4.  **Compare Models Against Target Truth (The Ranking Rule):**
      *   **Rule:** A model is judged *closer to the truth* than another for the defined TTS if:
          1.  **Superior Causal Coverage:** It has causal fidelity to a strictly larger set of KMPs *known to be essential drivers* for the TTS, *and* its numerical accuracy on those shared KMPs is not demonstrably worse overall.
          2.  **OR, Equal Causal Coverage but Superior Accuracy:** It has causal fidelity to the same set of essential KMPs, *and* its numerical accuracy on those KMPs is judged better overall based on evidence.
          3.  **Otherwise:** Models are "Not Rankable" on truthlikeness grounds for this TTS.
      *   **Weighting Implicit:** The KMP list *is* the weighting. Mechanisms deemed essential are critical. **Crucial:** This avoids the naive consequence collapse by focusing on specific *causal content* relevant to the target.
      *   **Output:** A reasoned comparison statement based on the KMP assessment tables.

  5.  **Sensitivity Check: Grain Coarseness (Avoiding Language Traps):**
      *   **Step:** Re-run the assessment from Step 3 & 4 using:
          *   **Finer Grain:** Split one broad KMP category into sub-components (e.g., split "waning immunity" into "humoral waning rate" and "cellular waning rate").
          *   **Coarser Grain:** Combine two closely related KMPs (e.g., combine "relative susceptibility by age" and "age-specific contact matrices" into "age-structured transmission risk").
      *   **Check:** Does the model ranking change based solely on this re-description?
      *   **Output:** Statement: "The ranking [Remains Robust / Changes to X / Becomes Unrankable] under tested grain variations." **Flag:** If ranking changes, it highlights sensitivity to KMP definition. **Judgment Call:** Which KMPs to split/combine. **Sign-off:** Team Lead.

  6.  **Explicit Warnings & Final Statement:**
      *   **Warning 1:** "Closer to the truth" IS NOT "best fit to last season's surveillance data." A model can fit past data well by being wrong in compensatory ways or by overfitting. Past fit is *evidence* for accuracy assessment (Step 3), not the sole criterion.
      *   **Warning 2:** "Closer to the truth" IS NOT "most useful for planning." A simpler, slightly less true model might be more robust or easier to interpret for decision-making. Utility is a separate assessment.
      *   **Output:** A concise "Model Truthlikeness Statement" incorporating the ranking (or non-ranking), key justifications from Step 4, the grain sensitivity result, and the signed-off TTS & KMP list as appendices. **Final Sign-off:** Senior Epidemiologist.

  **Application to Test Cases:**

  **(i) Model A:** Right waning-immunity rate, omits asymptomatic transmission.
  **Model B:** Includes asymptomatic transmission, badly wrong rate.
  *   **TTS:** Assume "Seasonal Total Cases" & "Peak Hospital Demand" are key.
  *   **KMP:** Asymptomatic fraction (Essential driver of total cases), Waning rate (Essential for season duration/peak timing).
  *   **Assessment:**
      *   *A:* Causal Fidelity to Waning: Yes (Accurate). Causal Fidelity to Asymptomatic: **No**.
      *   *B:* Causal Fidelity to Waning: ? (Not stated, assume plausible/acc). Causal Fidelity to Asymptomatic: **Yes** (Inaccurate).
  *   **Comparison:** Model B has superior causal coverage – it includes an essential mechanism (asymptomatic) that A omits entirely. Even though B's rate is wrong, having the mechanism is crucial for representing a major route of transmission affecting the TTS (Total Cases). A is fundamentally missing a key part of reality. **Ranking: B is closer to the truth than A.** *(Likely unwelcome if A was previously favoured)*.

  **(ii) Models C & D:** Agree on coarse quantities (Seasonal Peak Size/Timing, Total Burden), disagree on fine-grained transmission (e.g., age-mixing patterns).
  *   **TTS:** *Must be defined finer.* E.g., "Weekly Age-Stratified (0-18, 19-64, 65+) Incidence".
  *   **KMP:** Age-specific contact matrix, Relative susceptibility by age.
  *   **Assessment:**
      *   Both have Causal Fidelity to age-structure (Yes).
      *   Numerical Accuracy: Need evidence! If strong data (e.g., contact surveys, genomic data) shows one model's age-mixing pattern is more realistic, that model wins (Rule 2). If evidence is weak/conflicting, models might be "Not Rankable" on truthlikeness for this fine TTS. The coarse agreement doesn't guarantee fine-grained truth. **Judgment Call:** Assessing evidence for fine-grained accuracy is critical here. **Possible Output:** "Not Rankable" or ranking based on available evidence strength.

  **(iii) Team Favourite (Model F - fit past best, career model) vs Rival (Model R):**
  *   **TTS/KMP:** Defined as per procedure.
  *   **Assessment:** Apply Steps 3 rigorously. Suppose assessment reveals:
      *   *F:* Excellent fit last year due to fortuitously compensating errors. Misses a key mechanism (e.g., heterogeneous mixing) deemed essential for TTS robustness. Numerically accurate on some, inaccurate on others.
      *   *R:* Includes the key missing mechanism (Yes fidelity), parameter accuracy plausible based on wider evidence. Fit to last year was slightly worse due to lack of compensating error.
  *   **Comparison:** Model R has superior causal coverage (includes essential mechanism F omits). **Ranking: R is closer to the truth than F.** *(Unwelcome but honest outcome based on causal fidelity)*. If F *does* cover all essential KMPs and R adds irrelevant complexity, F might retain the ranking.

  **What This Procedure Cannot Do:**

  1.  **Prove Truth:** It assesses *relative* truthlikeness for a *specific, defined purpose* (TTS). It doesn't declare a model "true."
  2.  **Resolve Fundamental Uncertainties:** If evidence on a crucial KMP is highly uncertain or conflicting, the ranking may rely on difficult judgment calls or result in "Not Rankable".
  3.  **Eliminate Subjectivity:** Judgment calls are required (defining TTS/KMP, scoring accuracy, grain sensitivity tests). Transparency and senior sign-off mitigate this.
  4.  **Guarantee Future Performance:** A model closer to the truth *now* is a better bet, but unexpected shifts in the disease or population can change this.
  5.  **Directly Optimise for Decision Utility:** Truthlikeness is one input. Simpler, more robust, or more interpretable (but potentially less true) models might sometimes be better *tools* for specific planning decisions. This must be assessed separately.
  6.  **Compare Vastly Different Model Paradigms (e.g., Compartmental vs. Agent-Based):** It assumes models are making claims about the same underlying KMPs relevant to the TTS. Comparing fundamentally different structures requires additional meta-criteria beyond this scope.

  **Implementation Note:** This procedure forces explicit discussion of *what truth means for your purpose* (TTS) and *why mechanisms matter* (KMPs). The half-day writing should focus on *synthesising* the outputs of Steps 1-5, which ideally involve preparatory team discussion. The clarity and defensibility gained outweigh the initial setup effort.
