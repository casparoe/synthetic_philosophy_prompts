  ### Stale-Quorum Inheritance Case Analysis

  **Scenario**: Primary fails; three replicas:  
  - **A**: Current (daily sync, low staleness).  
  - **B**: Stale (20-year-old snapshot).  
  - **C**: Stranger (high-fidelity recapitulation, no causal link).  

  #### Hofstadter's Metric (Translated):
  Fidelity = Functional equivalence under evaluation. Ranking:  
  1. **C**: Recapitulates the pattern *autonomously*. Its state machine, when run, produces outputs indistinguishable from the primary (high functional fidelity).  
  2. **A**: Current but dependent on primary-sourced logs. Fidelity degrades if evaluated independently (e.g., lacks self-update capability).  
  3. **B**: Pattern frozen in an obsolete state; evaluation yields outdated outputs.  

  #### Distributed Systems Metrics:
  | Metric                  | Ranking (High → Low) | Rationale                                                                 |
  |-------------------------|----------------------|---------------------------------------------------------------------------|
  | **Recency of applied log** | A > C > B            | A has latest writes; C has logs up to publication date; B is decades old. |
  | **Fraction of committed state** | C > A > B          | C holds all published state (complete dataset); A has partial unpublished state; B has minimal subset. |
  | **Ability to originate writes** | None (all rank 0)   | Primary failure voids **write quorum**; no replica has leader lease.      |
  | **Voting rights**       | A > B > C            | A likely has valid lease; B may be partitioned; C is outside membership.  |
  | **Causal descent**      | A = B > C            | A/B have causal links to primary; C's state is fork without provenance.   |

  **Suspicion Validation**:  
  - **Orderings diverge**: Hofstadter ranks C highest; systems metrics prioritize A/C for state/recency but exclude C from authority/provenance.  
  - **"Amount of person" conflates**:  
    - *Read fidelity*: C excels (recapitulated pattern).  
    - *Write authority*: A has leases (historically), C has none.  
    - *Causal provenance*: A/B are linked; C is detached.  
    - *Normative standing*: Only A can vote; C lacks membership.  
  This confirms your suspicion: Hofstadter's "fidelity" emphasizes read consistency and functional behavior, while distributed systems separate these from authority and lineage. The reverse (metrics aligning) is false—C wins only in pattern completeness.  

