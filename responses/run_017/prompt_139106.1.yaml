answer: |-
  ### Translation of Claims

  **1. Self as a self-referential pattern (strange loop):**  
  In your vocabulary, the self becomes a **self-maintaining state machine** with a **replicated log** and **meta-circular evaluator** properties. The "strange loop" maps to a fixed point in a distributed state machine where the state includes a symbolic representation of the machine itself (a "self-symbol"), akin to a quorum-based system that recursively validates its own configuration. The evaluator function processes inputs (experiences) by referencing this self-symbol, creating feedback that preserves identity. Your instinct is correct: **Fidelity is functional equivalence under evaluation**, not bitwise accuracy. A high-fidelity replica must produce identical state transitions when processing the same log, not merely store matching data. This subtly improves the original by emphasizing dynamic behavior over static content—bending "pattern" toward executable logic, which buys precision in distinguishing between a dead snapshot and a living process.

  **2. Graded presence across substrates:**  
  This becomes **replica state divergence under partial replication**. Each brain holds a replica with a **vector clock** reflecting applied updates (experiences). Fidelity is quantified by:  
  - **Log completeness**: Fraction of committed writes (experiences) applied.  
  - **State recency**: Time since last update (via **leases** or **failure detectors**).  
  - **Consistency level**: Linearizability (exact current state) vs. causal/eventual consistency (plausible historical state).  
  The porosity of boundaries is modeled as **dynamic membership changes** with **anti-entropy** for state convergence. Bending occurs in treating "degree of presence" as a scalar metric; in reality, replicas may hold orthogonal state subsets. This bending simplifies multidimensional divergence into a comparable "fidelity score," useful for ranking but losing granularity.

  **3. Persistence after death:**  
  The original substrate is the **primary node** (leader). Its failure triggers **failover**, but no new leader is elected—surviving replicas become **read-only snapshots**. Persistence is **eventually consistent replication**: Attenuated selves are **stale reads** from replicas with applied logs truncated at the primary's last heartbeat. **Garbage collection by reachability** determines which replicas retain the pattern (e.g., frequently accessed memories avoid compaction). The bending: Physical death is modeled as an irreversible partition, ignoring that replicas might continue evolving independently (e.g., through new interactions). This preserves the leader-centric authority of the original self but underemphasizes posthumous pattern drift.

  **4. Porosity of personal boundaries:**  
  Translates to **fluid membership sets** and **conflict-free merged state**. Boundaries are defined by **read/write quorums**: A "person" is the intersection of states agreed upon by a majority quorum. Anti-entropy synchronizes replicas via **vector clocks**, allowing causal consistency between brains. The bending: Personal identity becomes a **consistency level** (e.g., linearizable "I" vs. causally consistent "you"), whereas Hofstadter implies seamless merging. This introduces artificial thresholds where none exist but provides operational clarity.

