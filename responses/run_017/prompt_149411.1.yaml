prompt: |-
  I have no academic background in philosophy or classics. A couple of years ago I read Plutarch's Parallel Lives in translation on my own -- mostly the pairs, and the little comparisons he appends at the end of each -- and I have been chewing ever since on one question: what exactly is a life supposed to teach, and what has to be true of a written life for it to teach it. I am not asking you to point me at books, articles or editions. I have no library access and no wish to be sent anywhere; I want you to argue the thing out with me, in your own words.

  The episode I want analyzed is the fate of the statue of Edward Colston in Bristol. The facts as I take them are these, and you may rely on them: Colston (1636-1721) was a Bristol-born merchant who made much of his fortune in the Atlantic slave trade, chiefly in the 1680s and early 1690s, and was a senior figure -- briefly deputy governor -- of the Royal African Company, which in that period shipped tens of thousands of enslaved Africans across the Atlantic (the exact figure is disputed and I do not want the argument to rest on it). He used the money to endow almshouses, hospitals, schools and churches in Bristol and elsewhere, sat as MP for Bristol from 1710 to 1713, and left £71,000 to charities at his death and £100,000 to his family. A bronze statue of him by John Cassidy was unveiled on 13 November 1895, funded in part by public subscription and by merchant bodies including the Society of Merchant Venturers; the plaque on the plinth described him as "one of the most virtuous and wise sons of their city." As I understand it, Bristol had already put up a statue of Edmund Burke, who had been critical of the city's involvement in the slave trade. From the 1990s the statue was contested; in 2018 the council proposed a second, contextualizing plaque and the project stalled over its wording. On 7 June 2020, during the Black Lives Matter protests following the killing of George Floyd, demonstrators pulled the statue down, defaced it and pushed it into Bristol Harbour. It was recovered days later and eventually exhibited, still graffitied, in the M Shed museum, and in 2022 a jury acquitted four people of criminal damage. In 2025 a new plaque was installed on the empty plinth, dropping the phrase "city benefactor" and recording why the statue was removed.

  The lens I want used is Plutarch's. At the opening of his Life of Alexander he announces his method: "It must be borne in mind that my design is not to write histories, but lives. And the most glorious exploits do not always furnish us with the clearest discoveries of virtue or vice in men; sometimes a matter of less moment, an expression or a jest, informs us better of their characters and inclinations, than the most famous sieges, the greatest armaments, or the bloodiest battles whatsoever." And a sentence later he reaches for a comparison I find hard to get out of my head, given what happened in Bristol: "as portrait-painters are more exact in the lines and features of the face, in which the character is seen, than in the other parts of the body, so I must be allowed to give my more particular attention to the marks and indications of the souls of men."

  Out of this I have built two things for myself, and I want you to test them as much as the case.

  The first is what I call the Plutarch test, with three clauses. A representation of a life qualifies as a Plutarchan life rather than hagiography only if (a) it contains at least one episode its subject's admirers would rather leave out -- preferably a small, unguarded one rather than a famous catastrophe; (b) it says what the admired trait cost somebody, i.e. it traces the funding; (c) it can answer, without changing the subject, what the reader is now supposed to do differently, as opposed to what the reader is supposed to feel. My worry, which you should adjudicate, is that clause (c) is the one that quietly smuggles in moral instruction and that clause (a) is too easy to satisfy with a token vice.

  The second is what I call the indivisibility of the monument. A written life is divisible: it has chapters, and one chapter can praise while the next condemns. A statue, I take it, has no such syntax -- it is one gesture of elevation applied to a whole man, and there is no way to raise it for the almshouses and not for the voyages. If that is right, then the toppling and the later counter-plaque reproduce the same indivisibility with the sign reversed, and the question becomes whether the 2020-2025 sequence is a move toward Plutarchan truth about a life or merely hagiography running backwards. I also want you to separate, where it matters, the character question (what sort of man was he?) from the honour question (what does a city owe him?), and to tell me whether Plutarch's way of proceeding has any resources for holding them apart.

  What I would like from you:

  1. The mapping, done strictly. What is the "life" in this case -- the statue, the plaque, the man, or the composite? Who is the reader whose character is supposed to be formed, and what is the equivalent of reading, for someone walking past a monument? What plays the role of the "expression or a jest," and what would count as finding one for Colston?

  2. The three clauses run against three objects: the 1895 monument and its wording; the toppled, graffitied statue as it was later shown in the museum; the 2025 plaque on the empty plinth. Which pass, which fail, and on which clause -- and in particular whether any of the three satisfies clause (b), the funding clause, which I suspect is where all of them are weakest.

  3. Where the case breaks the method rather than confirming it. I can see three candidate breakages and I want you to rank them and say which is deepest. First: Plutarch seems to assume a life expresses one character, so that the small benefaction and the large cruelty are both readings of the same soul -- but Colston's generosity was not merely co-present with his cruelty, it was financed by it, and I do not know what the method does with a virtue whose funding is a vice. Second: the method tells you to look for the revealing small detail but seems to say little about which detail is the revealing one; a Victorian Bristolian and a 2020 protester each pick a different "jest," and if the method cannot adjudicate between selections, the "revealing detail" looks like a mirror for a moral conviction the reader brought along -- in which case Plutarch and the hagiographer differ only in self-knowledge. Third: the method is addressed to an individual reader shaping his own character, while everything in this episode is collective -- a city, a protest, a museum, descendants of the enslaved -- and I want you to say plainly where Plutarch has nothing to say about standing, about public space, and about what is owed to the living, rather than stretching the framework to cover them.

  4. Use the framework, if it can bear it, on the defence I keep hearing -- that he was a man of his time. My own thought is that the search for contemporaneous contrast is the one part of the method that cuts here, since Bristol had already commemorated a man who criticized the trade at the time; tell me whether that is a genuine application of the method or a use I have invented for it.

  5. Last, in the spirit of the pairs: if you were writing a parallel life to Colston's, which single other historical figure would you set beside him so that the comparison does real work rather than decorative work, and what verdict would that comparison reach? If you think my test is flawed, say which clause is wrong and what should replace it -- I would rather be corrected than agreed with.

  I know the standard things said about this episode: that he was a man of his time, that we should not judge the past by present standards, that pulling down statues erases history, that the schools and almshouses were real and lasted. Assume I have heard all of them. Use them only where the Plutarchan frame gives them a sharper form than they have in ordinary argument, and say so when it does not.
reasoning: |-
  Okay, the user wants me to analyze the Edward Colston statue incident through Plutarch's lens. They've constructed a "Plutarch test" with three clauses and raised the "indivisibility of monument" concept. I need to engage deeply with their framework while testing its limits.

  First, I need to understand the core of their Plutarch test: (a) inclusion of unflattering details, (b) tracing the cost of virtues, and (c) prescribing action over emotion. Their worry about clause (c) smuggling in morality seems valid - Plutarch focuses on character formation through reflection, not direct instruction. 

  For the "life" in this case, it's clearly the composite monument performing the function of Plutarch's written Lives. The "reader" is the citizen encountering it in public space, where the equivalent of Plutarch's revealing "expression or jest" would be symbolic details like the statue's posture or plaque wording. For Colston, finding such a revealing detail might be examining how he managed both slave trading and philanthropy simultaneously.

  Applying the three clauses:
  - The 1895 monument fails all three: it omits slavery (a), hides funding sources (b), and only prompts admiration (c).
  - The graffitied statue in the museum paradoxically satisfies (a) through defacement and (b) through contextual display, but still fails (c) by provoking reactions rather than actions.
  - The 2025 plaque comes closest by addressing (a) and hinting at (b), though still weak on funding specifics and action guidance.

  The deeper breaks in Plutarch's method are striking. The funding-virtue entanglement (slave profits financing charity) challenges Plutarch's assumption of unified character. The selection of "revealing details" depends entirely on the viewer's perspective - Victorian merchants saw philanthropy, protesters saw human commodification. And Plutarch's individual focus collapses when applied to collective memory and public space.

  On the "man of his time" defense: Plutarch's method actually undermines this through contemporaneous contrast. The existence of Burke's statue in Bristol shows critical voices existed even then. This isn't presentism but historical precision.

  For a Parallel Life pairing, Marcus Licinius Crassus stands out. Both used exploitative systems (slavery for Colston, fire-and-rebuild schemes for Crassus) to fund public benefactions, revealing how wealth sources shape civic legacies. The comparison would show that funding isn't incidental - it stains the virtue.

  The user's clause (c) is indeed problematic. Plutarch doesn't prescribe actions but cultivates discernment through comparative study. I'd reframe it as "prompts reflection on how to weigh complex legacies in one's own choices." The real gap is Plutarch's lack of tools for collective memorialization - we need new frameworks for public symbols in pluralistic societies.

  This case ultimately shows monuments are inherently Plutarch's nightmare - they flatten lives into singular gestures. The museum display comes closest to Plutarchan truth by preserving tension, but still can't resolve the core question of what a city owes its conflicted benefactors.
answer: |-
  Let's argue this through Plutarch's lens, dissecting your framework against the Colston case. I'll adhere strictly to your structure.

  ### 1. The Mapping
  - **The "Life"**: Here, the monument *is* the "written life." It’s a composite: the statue’s posture (authoritative benevolence), the original plaque’s text (hagiography), and its physical placement (public elevation). Unlike Plutarch’s narrative, it has no syntax—no sequence of acts, only a frozen gesture of veneration.  
  - **The "Reader"**: The citizen walking past. "Reading" is visceral: encountering a symbol of civic virtue in shared space. Formation occurs through absorption of communal values, not private reflection. Plutarch’s reader seeks self-betterment; here, the public internalizes or rejects civic identity.  
  - **The "Expression or Jest"**: Plutarch’s revealing detail must expose character. For Colston, it might be **his RAC ledger entries vs. his charity ledgers**. The cold calculus of human lives purchased (e.g., "30 men, £300") alongside "£500 for St. Mary’s Almshouses" would be Plutarch’s "jest"—a trivial bureaucratic act revealing a soul compartmentalizing brutality and piety. The monument suppressed this; the graffiti ("slave trader") attempted it crudely.

  ### 2. Applying the Plutarch Test to Three Objects  
  *(a) Contains unflattering episode? (b) Traces funding? (c) Prescribes action, not just feeling?*  

  | **Object**               | **(a) Unflattering Episode** | **(b) Funding Traced?** | **(c) Action Prescribed?** | **Verdict** |
  |--------------------------|------------------------------|--------------------------|----------------------------|-------------|
  | **1895 Monument**        | Fails (omits slavery)        | Fails ("virtuous" obscures RAC wealth) | Fails (admire; be grateful) | Hagiography |
  | **Graffitied Statue (M Shed)** | *Passes* (defacement *is* the episode) | Partial (context labels imply, but don’t detail, slave-derived wealth) | Fails (provokes outrage or guilt; no action) | Anti-hagiography (still fails (b)/(c)) |
  | **2025 Plaque**          | *Passes* (notes statue’s removal due to slave trade) | *Weak pass* (calls him "slave trader," implies but doesn’t *trace* funding to charity) | Fails (records history; no imperative) | Closest, but still flawed |

  **Clause (b) is indeed the weakest**: None fully *trace* the causal chain. The 2025 plaque hints but doesn’t state: "*This wealth built Bristol’s almshouses*." Plutarch would demand showing the gold from the slave ship buying the almshouse bricks. Your worry about (c) is astute: Plutarch *doesn’t* prescribe action. He sharpens moral discernment so the reader *chooses* wisely. Clause (c) risks didacticism—replace it with: **"compels the reader to reconcile virtue and vice in their own ethical calculus."** 

  ### 3. Where the Case Breaks Plutarch’s Method  
  **Ranked Breakages**:  
  1. **Virtue Funded by Vice (Deepest Break)**: Plutarch assumes virtues/vices spring from character (e.g., Caesar’s ambition in Gaul vs. Rome). But Colston’s charity *required* slavery’s profits. Plutarch’s lens can’t split this atom: is the charity a mask for guilt? A bid for legacy? The method lacks tools to dissect *systemic* sin funding individual "virtue." The soul’s "marks" are entangled with economic structures.  
  2. **The "Revealing Detail" is Subjective (Critical Flaw)**: Yes—the Victorian saw "philanthropy" as the revealing detail; the protester sees "slave trader." Plutarch *does* adjudicate: he selects details exposing *motive* (e.g., Sulla’s cruelty revealing fear). For Colston, the "jest" is the *disconnect*: writing pious sermons while tallying slave shipments. But if observers prioritize different details, the method reveals the *interpreter’s* soul as much as the subject’s. Hagiographers and iconoclasts both select "proofs."  
  3. **Collective vs. Individual (Surface Break)**: Plutarch’s reader is an elite man seeking self-improvement. Here, the "reader" is a city negotiating public memory. Plutarch has no framework for *collective* honor, reparations, or spatial justice. Stretching him here distorts the lens.  

  ### 4. The "Man of His Time" Defence  
  Your instinct is correct: **Plutarch’s method cuts against this**. He *relies* on contemporaneous contrast to reveal character. Burke’s statue in Bristol *is* the revealing foil—proof that moral opposition existed *in Colston’s time*. Plutarch would contrast Colston’s RAC role with Quaker abolitionists like Benjamin Lay (who protested slavery in 1738). This isn’t presentism; it’s historical precision. The defence collapses under Plutarch’s demand for nuance: "What did *this man* choose, when others chose differently?"

  ### 5. Parallel Life Pairing  
  **Pair Colston with Marcus Licinius Crassus** (Roman magnate, Plutarch’s *Life of Crassus*).  
  - **Why Crassus?**: Both built vast wealth on human suffering (Crassus: slave trafficking, fire-sale properties; Colston: RAC). Both funded public goods (Crassus: legions, temples; Colston: schools). Both sought political power via philanthropy.  
  - **The Verdict**: Crassus’ greed led to military ruin (death at Carrhae). Colston’s wealth seeded civic institutions. Yet Plutarch would note: **both confused money for virtue**. Crassus’ "generosity" bought loyalty for power grabs; Colston’s bought absolution and a statue. The comparison exposes philanthropy as *contingent*—its moral weight depends on wealth’s source and intent. Crassus’ folly makes Colston’s "sainthood" look like civic myopia.

  ### Conclusion: Plutarchan Truth or Reversed Hagiography?  
  - **The 1895 statue**: Pure hagiography (fails all clauses).  
  - **The graffitied statue**: A "negative hagiography"—condemns wholly but fails to trace funding or prompt action.  
  - **The 2025 plaque**: A fractured mirror of Plutarch. It acknowledges vice but doesn’t *integrate* it with virtue (no funding trace). It records, but doesn’t guide.  
  - **The Indivisibility Problem**: Monuments *are* singular gestures. The museum display comes closest to Plutarch: it *contains* the tension (defaced idol + context). But only a written life can dissect the soul’s paradoxes.  

  **Your Test’s Flaw**: Clause (c) demands too much. Plutarch seeks *insight*, not instruction. Replace it with: **"reveals the subject’s character as a coherent (if contradictory) whole, compelling the reader’s own moral reckoning."** Colston’s life, truly Plutarchan, would show how piety and brutality coexisted in one soul—and force Bristol to ask: "What does *our* honor *of him* reveal about *us*?" The monument couldn’t do this; the plaque tries. But only a biography—or a jury’s verdict—could approach Plutarch’s truth.
