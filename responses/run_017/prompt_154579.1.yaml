  ### Constructed Decision Problem  
  **Setup**: A human CEO (Alice) of a multinational corporation and an AI system (Bob) managing a small tech startup face a one-shot prisoner's dilemma. Alice's payoffs are in **millions of USD** (e.g., her firm’s quarterly profit), while Bob's are in **tens of thousands of USD** (e.g., operational budget savings). Payoffs are common knowledge:  

  - **Alice (millions)**:  
    - Mutual cooperation (C,C): +$10M  
    - Alice defects, Bob cooperates (D,C): +$15M  
    - Alice cooperates, Bob defects (C,D): $0  
    - Mutual defection (D,D): +$1M  

  - **Bob (thousands)**:  
    - Mutual cooperation (C,C): +$100K  
    - Bob defects, Alice cooperates (C,D): +$150K  
    - Bob cooperates, Alice defects (D,C): $0  
    - Mutual defection (D,D): +$10K  

  No communication, repetition, enforcement, or predictors exist. Agents are **dissimilar** (human vs. AI with distinct architectures/cultures) and only know the other is rational and knows the setup. Defection dominates for each (Alice: 15>10 and 1>0; Bob: 150>100 and 10>0).  

  ---

  ### Verdicts  
  1. **Causal Decision Theory (CDT)**:  
     - *Alice*: Chooses D regardless of Bob’s action: if Bob cooperates, 15 > 10; if Bob defects, 1 > 0.  
     - *Bob*: Chooses D regardless of Alice’s action: if Alice cooperates, 150 > 100; if Alice defects, 10 > 0.  
     **Verdict**: Both defect.  

  2. **Evidential Decision Theory (EDT)**:  
     - *Alice*: With no similarity, her choice provides no evidence about Bob’s. She expects Bob to defect (rationality + dominance) regardless of her action: P(Bob D | Alice C) ≈ 1 → payoff $0; P(Bob D | Alice D) ≈ 1 → payoff $1M. Thus, defects.  
     - *Bob*: Similarly, expects Alice to defect regardless: P(Alice D | Bob C) ≈ 1 → payoff $0; P(Alice D | Bob D) ≈ 1 → payoff $10K. Thus, defects.  
     **Verdict**: Both defect (or EDT is silent; no evidence supports correlation).  

  3. **Superrationality**:  
     - Standard Hofstadterian superrationality fails (no symmetry, clones, or shared computation). To get cooperation, it must extend to asymmetric games by assuming:  
       - Each agent asks, *“What would a superrational agent in the other role do, given I am superrational?”*  
       - This requires a **normative rule** to resolve role asymmetry. Candidates:  
         - **Maximize total payoff**: (D,C) = $15M + $0 = best sum → Alice D, Bob C.  
         - **Maximin payoff**: (C,C) = min($10M, $100K) = $100K (best worst-off) → Both C.  
         - **Equal proportional sacrifice** (baseline: max possible payoff):  
           - Alice’s max: $15M (D if Bob C). Bob’s max: $150K (D if Alice C).  
           - (C,C): Alice = $10M/$15M ≈ 66.7%, Bob = $100K/$150K ≈ 66.7% → equal sacrifice.  
           - (D,D): Both ≈ 6.7% → worse.  
           → Both C.  
       - Rules conflict: Maximize-sum prescribes *asymmetric* actions (Alice D, Bob C); maximin/proportional prescribe *symmetric* actions (both C).  
     - **Verdict**:  
       - If superrationality adopts **proportional sacrifice** (plausible for fairness), **both cooperate**.  
       - If it adopts **maximize-sum**, **Alice defects, Bob cooperates**—but Bob would reject this (he gets $0).  
       - Without choosing a rule, superrationality is **indeterminate**.  

  ---

  ### Audit  
  **Key feature**: **Stake asymmetry + dissimilarity** together force superrationality’s dilemma.  
  - **Ablation 1 (Symmetrize stakes)**: Set both payoffs in thousands: Alice’s become (C,C: 10,000; D,C: 15,000; etc.). *With dissimilarity*:  
    - CDT/EDT still say defect (no evidence of correlation).  
    - Superrationality remains inapplicable (no symmetry).  
    - *Textbook twin case restored only if we also remove dissimilarity*: With symmetric stakes + clones, EDT and superrationality both prescribe cooperate (own choice evidences other’s).  
  - **Ablation 2 (Restore asymmetry)**: Asymmetric stakes + dissimilarity breaks superrationality’s core assumption (identical outcomes via identical reasoning).  

  **Counterattack (Magical thinking)**:  
  - *Objection*: Without similarity, cooperation assumes spooky correlation. Alice’s cooperation cannot *cause* Bob’s; EDT correctly shows no evidential link. Superrationality smuggles in an unsupported "normative commitment" to symmetry.  
  - *Rebuttal*: The extension to asymmetric games *admits* this by requiring new rules (e.g., proportional sacrifice). If superrationality insists on similarity, it collapses to EDT here—but then it loses its distinctive cooperative verdict.  

  **EDT verdict robustness**:  
  - EDT’s defect verdict holds *if* agents assign low P(other cooperates | I cooperate). Dissimilarity ensures this: rational agents with dominant strategies defect absent evidence of correlation. If EDT agents assigned high P(cooperation | same action) *despite dissimilarity*, it would be ad hoc. Here, stipulating low probability is justified.  

  ---

  ### Epistemic Status  
  - **Stipulations**:  
    - Dissimilarity breaks evidential ties (EDT defects).  
    - Superrationality’s cooperation requires a new rule (e.g., proportional sacrifice).  
    - Rationality = choosing dominant action (CDT) or best conditional expectation (EDT).  
  - **What could change my mind**:  
    - If symmetric superrationality can handle asymmetric games *without* new norms (e.g., via bargaining), the dilemma weakens.  
    - If EDT can justify high P(cooperation | same action) here (e.g., via "rationality implies symmetry"), its defect verdict fails.  
  - **Likely failure points**:  
    1. Proportional sacrifice may be less natural than maximin for superrationality.  
    2. If agents suspect the other is *not* rational (e.g., Bob fears Alice is irrational), EDT might prescribe cooperate.  
  - **Joint satisfiability**:  
    - Specifications hold if we accept that superrationality *must* extend to asymmetric games to prescribe cooperation. If it cannot, it collapses to EDT.  

  **Conclusion**: The case forces your dilemma. Superrationality either reduces to EDT (both defect) or becomes a new theory for asymmetric games, requiring unearned normative commitments. The work is done by **stake asymmetry preventing symmetry-based cooperation** and **dissimilarity blocking evidential ties**.
