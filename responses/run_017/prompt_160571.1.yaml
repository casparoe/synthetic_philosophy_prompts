answer: |-
  You're right that acquaintance changes nothing causal: my zombie twin and I are indistinguishable in all physical and functional respects. But here's the crux: while we *produce* identical tokens, the *semantic content* of those tokens differs radically because content is fixed relationally. When I judge "I am in pain," my judgment is *about* this very quality of experience presented to me via acquaintance—even if that presentation is causally idle. My zombie produces "I am in pain" with matching confidence, but nothing is *presented*. His judgment is either empty (referring to nothing) or refers to a functional surrogate.  

  The difference isn't invented; it's constitutive of intentionality. Consider hallucination: you see water where none exists. Your "water" judgment *fails to refer*, despite identical causal antecedents to a veridical case. Similarly, without acquaintance, my zombie's "pain" judgment fails to latch onto any phenomenal property. Acquaintance anchors content by making the quale itself available as the referent—non-causally, just as an object fixes a shadow's shape. Yes, this is brute. But denying it conflates causal production with intentional grounding.  

  Your argument proves only that evidence is identical—not that *aboutness* is.
