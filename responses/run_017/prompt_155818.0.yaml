  ### Scenario: The Trustee's Look-Back Clause

  Dr. Evans is a researcher whose grant application hinges on a discretionary review by a foundation trustee. The trustee evaluates applicants under a "look-back clause": she assesses whether the applicant *would have pursued* high-risk/high-reward research *without the incentive of the grant*, based solely on their professional record **as it existed six months prior**—before the grant's existence was publicly announced. Her assessment uses a statistical model (calibrated on decades of application data) that correlates pre-announcement records (e.g., past project choices, peer reviews, publication venues) with research risk preferences. If the model deems Evans "intrinsically high-risk" (would have taken risks sans grant), she approves; else, she denies.  

  Evans learns of this clause after submission. His record is ambiguous: it shows moderate-risk projects but hints at unexplored high-risk interests. He now faces a choice: **personally replicate a contentious, high-risk experiment** (cost: 80 hours of unpaid labor). This action won’t alter his pre-announcement record but could signal his true preferences to the trustee. Crucially, the trustee’s decision is finalized *before* replication results are known—she only sees Evans’ *intent to replicate* (publicly declared in an online registry).  

  **Evidence and Probabilities**:  
  - Let \( T \) = "Evans is intrinsically high-risk" (would pursue high-risk sans grant).  
  - Prior uncertainty: Evans is unsure of \( T \). His record is inconclusive; he assigns \( P(T) = 0.6 \).  
  - Replicating the experiment (action \( A \)) is strong evidence for \( T \): \( P(T \mid A) = 0.9 \), \( P(T \mid \neg A) = 0.3 \).  
  - The trustee’s model is accurate but imperfect: \( P(\text{Approval} \mid T) = 0.95 \), \( P(\text{Approval} \mid \neg T) = 0.05 \).  
  - Stakes: Grant approval enables career-defining work; denial stalls it. Cost of \( A \) is significant personal time.  

  ### Decision Theory Verdicts  
  - **Causal Decision Theory (CDT)**: "Deny replication." The trustee’s decision is fixed by the pre-announcement record; \( A \) cannot causally influence it. Cost outweighs any benefit.  
  - **Evidential Decision Theory (EDT)**: "Replicate." While \( A \) doesn’t cause approval, it provides strong evidence that \( T \) is true (and thus that approval is likely). The evidential boost justifies the cost.  
  - **Functional Decision Theory (FDT)**: "Deny replication." FDT treats decisions as outputs of a fixed algorithm. Here, the trustee’s model evaluates the *past* algorithm that produced the pre-announcement record. \( A \) is output by Evans’ *current* algorithm, which isn’t subjunctively linked to the past record—no functional dependence exists.  

  ### Screening-Off Objection: Why It Fails  
  The objection claims Evans’ disposition \( T \) screens off \( A \) from approval: once \( T \) is known, \( A \) provides no new evidence. But Evans *doesn’t* know \( T \)—his uncertainty is genuine. His record is ambiguous (e.g., past safe projects might reflect circumstance, not preference), and he lacks introspective certainty. Thus, \( A \) remains valid evidence about \( T \), and EDT’s inference holds.  

  ### Ablations  
  1. **Record includes post-announcement conduct**: If the trustee considers Evans’ replication intent *as part of the record*, CDT and EDT converge on "replicate" (causal link exists). FDT resists if the trustee’s model still targets historical dispositions, but weakens.  
     - *Why theories move*: Causal path opens; EDT’s evidence becomes causal; FDT’s subjunctive link remains broken.  

  2. **Predictor models current choice**: If the trustee uses a model that simulates Evans’ *current* decision (e.g., "Would he replicate *now* without the grant?"), FDT shifts to "replicate."  
     - *Why theories move*: FDT now sees subjunctive dependence—Evans’ decision algorithm directly influences the prediction.  

  ### CDT Objection and Fairness  
  **CDT Objection**: "This is deterrence in disguise! The trustee uses your *declared intent* as a signal, so your action causally influences approval."  
  **Rebuttal**: The look-back clause explicitly forbids this: the trustee’s decision uses *only* the pre-announcement record. Declared intent is merely correlated evidence—it doesn’t alter the record. The causal barrier holds.  
  **Fairness**: The objection is partially fair if the trustee’s process is opaque (allowing unconscious bias), but the clause’s design enforces causal independence. In principle, this is basilisk-shaped: the outcome turns on a *counterfactual* property (\( T \)), not the act itself.  

  ### Key Constraints Met  
  - **No AI/simulations**: Trustee uses statistical models, not simulations.  
  - **Stakes/causality**: Grant approval is ordinary; causal isolation via look-back clause.  
  - **Uncertainty**: Emerges naturally from ambiguous records and opaque models.  
  - **FDT verdict**: Achieved by decoupling past and present decision algorithms.  

  ---  
  This scenario withstands standard dismissals: prediction is human-valid, threats are cost-effective (trustee expends no resources), and the structure isn’t deterrence (causal isolation forces counterfactual dependence). The basilisk’s core tension persists in mundane institutions.
