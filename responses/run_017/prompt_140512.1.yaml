prompt: |-
  I teach a second-year undergraduate seminar on rational choice and decision theory: 22 students, one 75-minute session, mixed majors, most of them with only an introductory logic course behind them. The next session is on ambiguity, and I want them to run into the phenomenon before I name it. Specifically, I want them to discover that they will pay more for a bet on a draw from a bag whose composition they know than for the nominally identical bet on a bag whose composition they do not know, to notice that this happens for both colours and not just one, and then to be faced with the fact that their four valuations cannot all be read as probabilities without contradicting each other. No lecture at the front: the pattern has to come out of choices they actually make, and the naming comes after the last round.

  Some constraints and some things I would like tried. Materials are limited to opaque bags, coloured poker chips, index cards and a projector; no money changes hands, and payoffs need to be points toward a genuinely trivial prize, so the incentives have to be honest without being real. I do not want the standard version in which I secretly fix the composition of the ambiguous bag and they merely bet on it. I would rather the ambiguity be constructed by the participants: before any betting, each student writes down the interval of proportions they regard as genuinely unnarrowable — say, red anywhere between 20 and 80 per cent — and the class aggregates these into the range the ambiguous bag is then drawn from. My thought is that this makes the aversion attach to the spread of their own uncertainty rather than to anything about the physical bag, but I am not confident it works and I would like your view on whether it does or whether it just muddies the setup.

  I also want a round in which they price, rather than merely choose between, four tickets: a bet on red from the known bag, a bet on black from the known bag, and the same two bets on the ambiguous bag — writing a number in points for each, so that whatever incoherence is there can be read straight off the four numbers afterwards rather than inferred from a pattern of forced choices. And I want two further comparisons. First, a chance to buy, with points, the removal of the ambiguity: a sample drawn from the ambiguous bag in advance and revealed to them only after they have committed, so that I can see what the reduction in uncertainty is worth to them. Second, a pair of cases in which the ambiguous bag's composition is fixed either by a randomly selected classmate who is rewarded when the bettor loses, or by an impersonal random mechanism identical in every other respect. The point of that pair is to pry apart genuine aversion to unknown probabilities from the ordinary thought that someone is out to get them; whether the two come out the same or differently, tell me what the result would show and what I should say about it.

  Please give me: the rules and materials; the exact sequence of rounds with timings; how the scoring works so that the numbers they write are incentive-compatible in an honest if approximate sense; what goes on the board and when, given that nothing may be written down before the reveal that tips the structure of the argument; and a debrief that maps particular moments in the session onto particular features of the case — the reversal across the two colours, what it would take for a valuation to be additive, and what the sure-thing principle asks of them here. Tell me what will predictably go wrong the first time I run it, including the most likely way students will try to game the scoring. And be frank about which part of the phenomenon the activity cannot generate and which part I will simply have to state: I would rather know in advance where the game stops and the talking starts.

  Respond as a numbered list of exactly five items, each two or three sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is teaching a seminar on rational choice and decision theory and needs an activity to demonstrate ambiguity aversion. They want students to discover the phenomenon through choices rather than lecture. Key requirements include: no money, using points; having students define the ambiguous bag's range; pricing tickets for known and ambiguous bets on both colors; testing the value of removing ambiguity; and comparing adversarial vs. mechanical ambiguity sources. They also need incentive-compatible scoring, a clear debrief linking activities to concepts, and predictions of potential issues.

  First, I need to address the user's idea for creating the ambiguous bag. They propose students write intervals for proportions, then aggregate these into a range. I think this approach effectively personalizes ambiguity aversion, making it about their own uncertainty rather than a fixed bag. It should work well to highlight that aversion stems from the spread of uncertainty. This method avoids the standard setup where the bag is secretly fixed, which might feel manipulative. Instead, students see the ambiguity as a product of their collective uncertainty, reinforcing the psychological aspect.

  For the pricing rounds, I'll design four tickets: red and black for both known and ambiguous bags. Students will assign point values, which should reveal incoherence when comparing sums. To ensure honest pricing, I can use a BDM-like mechanism where they state prices, then a random price is drawn; if their price is above, they "buy" and pay the drawn price, winning the bet if it succeeds. This incentivizes truthful revelation because overpricing risks paying more than it's worth, while underpricing risks missing out. The scoring needs to be simple but effective, using trivial prizes like candy to keep it light but motivating.

  The additional comparisons are crucial. For removing ambiguity, students will pay points to see a sample from the ambiguous bag after committing. This shows the value of reducing uncertainty. The adversarial vs. mechanical test involves having a classmate set the bag composition with incentive to make bettors lose, versus a random draw. If aversion is higher in the adversarial case, it indicates suspicion of manipulation; if similar, it points to pure ambiguity aversion. This distinction helps separate probabilistic uncertainty from strategic concerns.

  Materials and timing are practical: opaque bags, poker chips, index cards, projector. Sequence starts with defining the ambiguous range, then pricing tickets, followed by ambiguity removal and source comparison. Debriefing will highlight the reversal across colors, the additivity failure in their pricing, and the sure-thing principle violation. Predictable issues include students gaming the system by pricing low to avoid participation or high to manipulate outcomes. Also, the incoherence in pricing might be rationalized as risk aversion, which I'll need to address by showing it's about unknown probabilities.

  Finally, the activity might not generate strong ambiguity aversion on its own; students might not show significant differences, so the instructor should be prepared to state the typical finding. The point totals' incoherence (sum of ambiguous bets exceeding known) may require explicit explanation. I'll outline debrief points to connect each activity to theory, ensuring students see the contradiction in their valuations and how it challenges probabilistic models.
answer: |-
  1.  **Materials & Initial Setup:** Use two opaque bags: Bag K (known, e.g., 50 red, 50 black chips) and Bag A (ambiguous). Before any betting, students write their unnarrowable proportion interval for red in Bag A (e.g., 20-80%) on index cards anonymously; project and aggregate these (e.g., min to max) to define Bag A's possible range (say, R: 30-70%). Fill Bag A secretly later using a uniform RNG within this range. Project only the defined range (e.g., "Red: 30-70%"). Prizes are small candies; points are currency.

  2.  **Sequence & Incentives (Pricing Rounds):** (1) **Ticket Pricing (20 min):** Students privately write maximum points (from an endowment, say 100) they'd pay for four tickets: Win 100 points if Red(K), Win 100 points if Black(K), Win 100 points if Red(A), Win 100 points if Black(A). Use a BDM-like mechanism for incentive compatibility: For each ticket type, later draw a random "price" (e.g., 0-100). If a student's bid >= price, they "buy" the ticket, pay the drawn price, and get the 100 points if the bet wins. Collect bids secretly. (2) **Remove Ambiguity (10 min):** Students bid points to see one chip drawn (and replaced) from Bag A *before* betting (but after committing); same BDM mechanism. (3) **Source Comparison (15 min):** Contrast two scenarios (order randomized): (a) A classmate (incentivized with candy if the bettor loses) secretly sets Bag A's R within the 30-70% range. (b) An RNG sets Bag A's R within 30-70%. Students price a single Red(A) ticket for each scenario separately using the BDM method.

  3.  **Board Use & Data Collection:** Before reveal: Project only Bag K's comp (50-50), Bag A's range (e.g., Red 30-70%), and instructions. Record student intervals anonymously during setup, project aggregate range. *After* all choices/valuations are collected and Bag A's true composition is fixed (but still secret): Project the four average prices (Red/K, Black/K, Red/A, Black/A). Later, project the average price for ambiguity removal and the two Red(A) prices (adversarial vs. mechanical). Reveal Bag A's true composition only at the very end.

  4.  **Debrief Mapping:** Point to the higher average prices for Red(K) and Black(K) vs. Red(A) and Black(A) to show aversion to ambiguity for *both* colours. Highlight that summing the two ambiguous bet prices often exceeds the sum of the known bet prices (or 100 points), violating additivity expected under probabilistic beliefs. Use the Sure-Thing Principle: Choosing the known bag bet over the ambiguous one for red *and* for black separately suggests they should prefer any mixture over the known bag, contradicting aversion to the ambiguous bag itself. Show if adversarial source prices were higher, linking to distrust; if similar, emphasizing pure ambiguity aversion.

  5.  **Predictable Issues & Limitations:** Students may strategically bid very low on all tickets to hoard points or very high on ambiguous bets hoping for lucky pricing, though the BDM mitigates this. Some may rationalize incoherent prices as "risk aversion," requiring you to clarify ambiguity concerns unknown probabilities, not known risks. The activity likely won't generate *strong* aversion solely from the aggregated interval; be prepared to state that empirical studies show people pay significantly less under ambiguity. The incoherent point totals won't be probabilities; you'll need to explicitly state that no probability assignment reconciles all four valuations simultaneously.
