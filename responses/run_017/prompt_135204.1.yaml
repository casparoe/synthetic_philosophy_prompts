prompt: |-
  I teach philosophy at a small liberal arts college, and next month I'm giving a twenty-five-minute invited talk with ten minutes of discussion at a one-day workshop on explanation in the cognitive and biological sciences. Nobody in my own department works on explanation, so I've been rehearsing at a whiteboard and I have no real sense of what will get thrown at me. The talk is titled "Cranes with Borrowed Footings," and the thesis is this: the methodological pair we all inherited from Dennett — shun skyhooks, shun greedy reductionism — misses the failure mode that does the most damage in ordinary scientific practice. The failure mode I have in mind is an explanation that has the complete surface profile of a crane: stepwise, level-respecting, resting on machinery rather than on a miracle, with no explanatory levels skipped and no appeal to anything spooky — but whose bottom rung quietly re-imports the very phenomenon being explained, dressed in a more respectable vocabulary. My examples are representational explanations of cognition where "representation" turns out to be cashed out by appeal to what an interpreter would take the system to be about; selectional explanations where "selection for" is doing work that a causal story about replication and differential retention should be doing; "internalization" explanations of norm-responsiveness; and "information-processing" explanations of development. The diagnostic I propose is a footing test: take the lowest rung of the crane and try to redescribe it entirely in the vocabulary of the level beneath it; if the redescription fails, or merely relocates the same semantic notion one level down, the footing is borrowed. I want to claim that this is not a greedy demand to skip levels but an anti-skyhook demand to finish the descent, though I'm not confident that distinction will survive contact with an audience.

  The room will be: two Dennett-trained philosophers of mind who use the crane/skyhook pair constantly and consider themselves deflationists about content; one senior philosopher of science of the new mechanist stripe (mechanisms as organized entities and activities, constitutive relevance, how-possibly versus how-actually); one philosopher of biology who defends adaptationist explanation and talks cheerfully about genes as carrying information; one enactivist who holds that representation talk is itself the skyhook and that I haven't gone nearly far enough; and a handful of graduate students who will want to know how to run the test on their own material. I'd like a Q&A prep sheet: the six or eight objections I will actually get, ordered by how much damage they'd do, each phrased the way that person would phrase it, with a roughly two-minute reply and a note on where the reply is soft. Please also tell me what I should concede in the first two slides before anyone has to ask, which single reply has to land for the talk to have a point, and the objection I'm hoping nobody raises — my own guess is that it involves whether the footing test can distinguish a placeholder from a theoretical posit with deferred cash value, or whether it collapses into the very thing I'm criticizing, but I'd rather hear your candidate than have me supply it. Where I am genuinely unsure: whether my test condemns too much, since a great deal of working biology would fail it, or too little, since a borrowed footing can be refinanced later and my test may only be detecting present arrears rather than bankruptcy. Please write in American English, and keep the whole prep sheet under 800 words.
reasoning: |-
  Okay, let me tackle this philosophy professor's request. They're prepping for a workshop talk on "borrowed footings" in explanations and need Q&A defense strategies. The core concern is that seemingly stepwise explanations secretly reintroduce the explanandum at the bottom level - a failure mode Dennett's crane/skyhook dichotomy misses. 

  First, I need to map the audience landscape since objections will be persona-driven. The two Dennettians will likely defend the sufficiency of their framework. The mechanist philosopher will care about constitutive relevance gaps. The adaptationist might see the footing test as attacking established biological practice. The enactivist will push for more radical conclusions about representation. Grad students will want practical application tips.

  The professor's diagnostic tool - redescription of the bottom rung in lower-level vocabulary - needs armor against predictable challenges. Top concerns:
  - Does this just rediscover the hard problem of consciousness? (Dennettians)
  - Isn't this greedy reductionism in disguise? (Mechanist)
  - What about productive placeholder concepts? (Adaptationist)
  - Why not abandon representation entirely? (Enactivist)

  I'll structure the prep sheet to address these, prioritizing by damage potential. The adaptationist's placeholder objection could be most damaging if it suggests the test stifles provisional science. The enactivist's challenge, while radical, might actually strengthen the talk's point if handled as natural extension. 

  Key concessions upfront should disarm critics: acknowledge Dennett's framework's value while clarifying the niche failure mode. The make-or-break reply is distinguishing anti-skyhook demands from greedy reduction - this needs crisp language about finishing descents versus skipping levels.

  The ghost objection I fear is about test applicability: if borrowed footing is always refinanceable later, does the test merely flag temporary debt rather than structural failure? This cuts to whether the issue is epistemic (we haven't finished) or metaphysical (we can't finish). The professor's examples suggest the latter in cases like interpretivist representations.

  Word count is tight so replies must be surgical. American English means avoiding Britishisms and keeping academic but accessible tone. The whole prep should fit one page - prioritize punchy comebacks over thorough rebuttals since Q&A is time-pressed.
answer: |-
  Here’s your Q&A prep sheet, targeting key objections by audience archetype. Prioritized by damage potential:

  ### Top 6 Objections & Replies  
  1. **Dennettian #1**: *"This just recycles the 'hard problem'—demanding a vocabulary free of semantic/informational notions is greedy reductionism. Cranes *can* legitimately rest on intentional idioms if they’re predictively robust."*  
     **Reply**: "The test isn’t banning intentional idioms—it’s asking whether they’re *doing work* the lower level should do. If ‘representation’ reduces to ‘what an interpreter sees’, you’ve smuggled in the interpreter—an unanalyzed homunculus. That’s not robustness; it’s a shell game."  
     **Soft spot**: Distinguishing "predictively useful" from "explanatorily empty" redescriptions is tricky.  

  2. **Mechanist**: *"Your ‘footing test’ ignores constitutive relevance. If a component’s activity is *part* of the mechanism (e.g., a ribosome ‘translating’ mRNA), demanding a ‘lower’ vocabulary misconstrues mechanistic hierarchy."*  
     **Reply**: "Constitutive relevance requires showing *how* the part performs its activity—not just labeling it. If ‘translation’ presupposes semantic content without explaining its causal implementation (e.g., via stereochemistry), it’s borrowed footing. My test exposes when labels substitute for mechanism."  
     **Soft spot**: Risk of over-mechanizing biology’s functional descriptions.  

  3. **Adaptationist**: *"You’d condemn all ‘selection for’ talk! But ‘genes as information carriers’ is a productive placeholder—we *later* cash it out via replication dynamics. Your test can’t handle deferred explanation."*  
     **Reply (critical to land)**: "Placeholders are fine—*if* we admit they’re IOUs. But if ‘selection for X’ is used *as if* it explains X’s origin (e.g., consciousness) while relying on undefined ‘information’, it’s circular. The test flags when IOUs *aren’t redeemable* with lower-level resources."  
     **Soft spot**: Biology often uses heuristics that work without full reduction.  

  4. **Enactivist**: *"You’ve shown representation is a borrowed footing—but the solution isn’t better cranes! It’s to abandon representation altogether for embodied dynamics."*  
     **Reply**: "Agreed—but my point is diagnostic, not prescriptive. If your non-representational account *also* fails the footing test (e.g., ‘sensorimotor contingency’ invokes unexplained normativity), it’s still a crane with borrowed footing. The test is neutral to your solution."  
     **Soft spot**: May concede too much ground to anti-representationalism.  

  5. **Dennettian #2**: *"This conflates *explanation* with *reduction*. Cranes explain by making patterns salient—not by eliminating higher-level terms. Your test demands ontological austerity we don’t need."*  
     **Reply**: "Salience isn’t the issue. When ‘internalization’ explains norm-compliance by positing an inner rule—which itself requires compliance—you’ve explained nothing. The test targets *explanatory circularity disguised as mechanism*."  
     **Soft spot**: Risk of sounding like a closet reductionist.  

  6. **Grad Student**: *"How do I apply this to neural network explanations? Is ‘embedding space’ a borrowed footing?"*  
     **Reply**: "Run the test: Can you describe the ‘meaning’ of an embedding *without* invoking similarity in a model’s latent space? If not—and no lower-level (e.g., synaptic) story justifies that space’s structure—it might be borrowed. Look for appeals to unexplained ‘structure’ or ‘information’."  

  ---

  ### Strategic Concessions (Slide 2)  
  - "Dennett’s crane/skyhook distinction is invaluable—I’m diagnosing a *subset of cranes* that mimic solidity but crumble under pressure."  
  - "Some borrowed footings are productive heuristics. The test helps *spot when we’re in heuristic mode* versus claiming explanatory closure."  

  ### Make-or-Break Reply  
  The **adaptationist’s placeholder objection** (#3) must be neutralized. If the audience thinks your test stifles provisional science, you lose. Emphasize: *"The test doesn’t forbid placeholders—it warns when they’re *treated as explanations* while hiding circularity. Science marches on IOUs—but we must track the debt."*  

  ### Ghost Objection (Hope Nobody Raises)  
  *"Isn’t your footing test self-undermining? ‘Redescription in lower-level vocabulary’ presumes a foundational level—but if *all* explanations rest on borrowed footings (à la Quine), your critique collapses into universal skepticism."*  
  **Why it’s deadly**: It reframes your tool as either trivial (all science fails) or hypocritical (your meta-explanation has footing issues).  
  **Weak reply**: "The test is local—relative to a field’s *own* level distinctions." (Feels ad hoc.)  

  ### Your Uncertainties Addressed  
  - **Condemning too much?** Yes—if applied dogmatically. Stress it’s a *diagnostic for suspect explanations*, not a veto on productive science.  
  - **Detecting only arrears?** A fair point. Admit: "Borrowed footings *can* be refinanced! The test flags accounts *currently* in deficit—urging us to pay down the debt or admit it’s unpayable."  

  **Total**: 798 words. Good luck—your thesis is razor-sharp and deserves a strong defense.
