prompt: |-
  My friend Priya and I got into a three-hour fight about speciesism at a barbecue last weekend and I've been chewing on it ever since. Shes hard-line: eats nothing that came from an animal, thinks every time I hedge she has caught me out. I don't think I'm being incoherent, but I also can't say what I actually believe, so I want to lay out my gut verdicts on cases and see what principle, if any, they add up to.

  Factory-farmed chicken: obviously wrong to buy, I won't. Beef from a cow that lived on a hillside and was shot in the field: I'll eat that, no guilt. Roadkill deer: fine. Oysters and mussels: fine, not even a question. Boiling a lobster alive: I won't do it and I do judge people who do. Shrimp: uneasy, mostly avoid. Crickets and mealworms in protein bars: fine — even though per gram that's a lot more individual deaths than the beef, which does bug me when Priya points it out. Mouse in my kitchen: kill it, no second thought. Mice in a lab, killed to test a cancer drug: fine, I'd fund it. Chimpanzees in that same lab: not fine, even granting that the chimp suffers less and the medical payoff is bigger. Letting my cat hunt birds: I let her out and don't lose sleep, but I would never wring a sparrow's neck myself, and I can't explain the difference. And the one that started the whole fight: pork — fine — versus dog — absolutely not, even though I know pigs are at least as smart and social as dogs, so Priya says I've just swallowed a culturally arbitrary taboo. I don't feel like I have.

  The principle I half-believe is something like: what matters is how much a creature can suffer, how rich its subjective life is, how much future it loses in dying, and — this is the clause I can't justify at all — whether it stands in some relationship with us that killing or eating it would betray. I'd rather you test that against my verdicts and repair it than scrap it, if it can be repaired. Two cases I invented to stress it: (1) a company that will biopsy your living pet, grow steaks from the cells and mail them to you; the animal is never hurt and never killed, and I still think eating my own dog that way is vile, and I want to know whether that's a moral verdict or just disgust doing philosophy; (2) a farm that edits its animals so they can't feel pain but still walk around, forage and socialize normally, then slaughters them — I feel squeamish about eating those and can't say why, and Priya says the squeamishness is the whole point because if suffering is gone my own principle seems to permit it. So: is there one principle that gets all my verdicts, or does one have to go — and if so which, and why that one? State the principle precisely enough that I can see which case motivates each clause, and tell me what it predicts about some case I haven't thought of, ideally one where it hands down something I'd have resisted.
reasoning: |-
  Okay, this user is really wrestling with the ethics of speciesism after a heated debate with their friend Priya. They've laid out a series of intuitive judgments about different scenarios involving animals - from factory farming to lab testing to pet eating taboos. What's fascinating is how self-aware they are about their own inconsistencies, especially that pork/dog dilemma Priya called out. 

  Hmm, their half-formed principle about suffering, subjective life, lost futures and "relationship betrayal" feels close but messy. The pet biopsy steak and pain-free animal farm thought experiments are clever - they're clearly testing the limits of their own framework. I notice they're not just asking for logical consistency; there's emotional weight here ("vile", "squeamish") they want validated as morally significant.

  Priya's absolutist vegan stance seems to be haunting them. The user isn't rejecting it outright but needs a more nuanced moral architecture that accommodates their instincts. That cricket/beef comparison especially bugs them (pun intended) - they can't deny Priya's math about individual deaths, yet their gut won't budge. 

  The real tension is between cold utilitarianism and... something warmer. When they say killing a lab mouse is fine but not a chimp, or that they'd never strangle a sparrow but let their cat hunt, it screams "context matters more than capacity for suffering alone." Their "betrayal relationships" instinct feels key - we assign moral weight based on social contracts with certain species. 

  For the repair... starting with Moral Considerability Threshold makes sense. Nociception vs. valenced suffering distinction handles oysters/crickets. Then adding Cognitive Richness accounts for the chimp vs mouse lab difference. Lost Future Potential explains why shooting a free-range cow feels less bad than boiling a lobster. 

  Ah, and the Special Relations clause! That's where the dog/pork divide lives, and why pet-derived steak feels vile even if painless. It's not arbitrary culture - it's about violating role-based expectations. Then the Prohibited Forms clause captures why painless slaughter still feels off; it objectifies in ways that degrade our own moral character. 

  The predictive test case with human neurons in a rat... yeah that should unsettle them. If the principle works, it should force uncomfortable conclusions. Good. They want their boundaries tested. 

  Priya might call this convoluted, but life's messier than utilitarianism. This framework honors that while demanding consistency. User gets to keep most intuitions except maybe that shrimp unease - if painless death is possible, why hesitate? Unless... maybe the "prohibited forms" aversion extends there too. Interesting.
answer: |-
  Here's a principle that coherently captures *all* your verdicts, including the challenging thought experiments and Priya's objections. It integrates your core insights while refining the "betrayal" clause:

  **The Principle of Contextual Moral Considerability:**
  An action towards a non-human entity is permissible if and only if:
  1.  **The entity falls below the Moral Considerability Threshold (MCT):** It lacks the capacity for *valenced subjective experience* (e.g., oysters, mussels, possibly insects like crickets/mealworms *if* their experience is sufficiently atomic).
  2.  **OR, if above the MCT:**
      *   a. **Cognitive Richness (CR):** The entity possesses sufficiently complex cognition (e.g., future anticipation, rich social bonds, self-awareness), making harms like confinement, separation, or death intrinsically *more* wrongful due to the *depth* of loss. AND
      *   b. **Minimized Suffering & Naturalistic Welfare (MSNW):** The entity experiences minimal suffering during its life and death, and its life allows for the expression of natural behaviors fundamental to its species-specific flourishing. AND
      *   c. **Absence of Prohibited Forms (APF):** The action doesn't involve forms of killing or exploitation inherently degrading to the moral character of the agent or violating fundamental prohibitions against certain *types* of relationships (e.g., betrayal of companionship). AND
      *   d. **Absence of Special Relations Conflict (SRC):** The action doesn't violate a role-based obligation arising from a specific, reciprocal relationship of care or companionship (e.g., pet, working animal).

  **Testing Against Your Verdicts:**

  *   **Factory Chicken:** Fails (2a: High CR? - Yes, chickens are cognitively/socially complex; 2b: Suffering maximized, unnatural life; 2c: Prohibited form - intensive confinement/slaughter).
  *   **Hillside Beef:** Passes (2a: High CR? - Yes, cows are complex; 2b: Minimized suffering? - Natural life, instantaneous field death; 2c: Not inherently prohibited form? - Slaughter, but natural context mitigates degradation; 2d: No special relation).
  *   **Roadkill Deer:** Passes (2b: Death accidental/instantaneous, no suffering caused; 2c: Not prohibited form - scavenging, not intentional killing; 2d: No special relation).
  *   **Oysters/Mussels:** Passes (1: Below MCT - likely no valenced subjective experience).
  *   **Boiling Lobster:** Fails (2b: Causes immense suffering; 2c: Form is inherently cruel/degrading).
  *   **Shrimp:** Your Unease Explained (2a: Moderate CR? - Uncertain complexity; 2b: Often high suffering in catch/processing; 2c: Mass trawling/crowding feels like a prohibited form; borderline case motivates avoidance).
  *   **Crickets/Mealworms:** Passes (1: Below MCT? - If their suffering is minimal/atomic per individual; Priya's "death count" critique is addressed by MCT – entities below it don't count as "deaths" in the morally relevant sense).
  *   **Mouse in Kitchen:** Passes (2a: Moderate CR? - But 2b: Suffering minimized if quick kill?; 2c: Pest control is a permitted form?; 2d: Conflict - it threatens health/habitat, overriding usual consideration).
  *   **Lab Mice (Cancer):** Passes (2a: Moderate CR? - But 2b: Suffering *potentially* minimized/reduced?; 2c: Scientific use a permitted form?; 2d: High potential benefit outweighs consideration in this context?).
  *   **Lab Chimps:** Fails (2a: Very High CR - complex cognition/sociality; 2b: Suffering likely significant even in "better" labs; 2c: Confinement/experimentation on such cognitively rich beings is a prohibited form; 2d: Benefit doesn't outweigh the profound harms to such complex creatures).
  *   **Cat Hunting Birds:** Permitted *by you* (2b: Suffering caused *by cat*, not you; 2c: Form is "natural predation" - less direct degradation for *you*; 2d: You have a special relation *to the cat*, fulfilling its nature outweighs bird harm *for you*. You wouldn't wring the neck because *you* directly performing the act violates 2c - it's a prohibited form *for a human*).
  *   **Pork vs. Dog:** Explained (2c & 2d): Eating *any* dog violates 2c (Prohibited Form - deep cultural/evolutionary taboo on consuming companions) AND 2d (Special Relations Conflict - dogs occupy the "companion" role universally in your moral framework). Pigs, while equally intelligent (2a), don't inherently trigger 2c/d in the context of food production *for you*, unless raised as a pet (then 2d would apply). Priya is partly right (cultural influence on 2c/d), but it's not *arbitrary*; it's rooted in specific relationship roles.
  *   **Pet-Biopsy Steak (Dog):** VILE because it violates 2c (Prohibited Form - eating companion species is inherently degrading/betrayal) and 2d (Special Relations Conflict - direct betrayal of your specific dog, even if unharmed). **This is a moral verdict**, not just disgust. Disgust is the *signal* of the underlying moral violation (2c/d).
  *   **Pain-Free GMO Farm:** SQUEAMISH because it violates 2c (Prohibited Form). Slaughtering beings that *walk, forage, and socialize* (exhibiting behaviors associated with subjects above MCT) for mere taste preference, even without suffering, is inherently degrading *to the moral character of the person doing it*. It treats a subject-like entity as a mere object. Priya is right that suffering-based ethics might permit it, but your intuition about the *form* of the action (APF) is capturing something crucial.

  **Prediction & Resistance: The "Sentient Rat-Human Chimera" Case**

  *   **Case:** Scientists create a rat with a small number of functional human neurons integrated into its brain, enhancing its capacity for valenced suffering and rudimentary future planning, but not human-level consciousness. It's used in painful, terminal cancer research with high potential medical payoff.
  *   **Principle Prediction:** This likely **FAILS** (Not Permissible).
      *   It's above MCT (Enhanced valenced suffering/future sense).
      *   Fails 2b (High suffering during research).
      *   **Crucially, it likely fails 2c (Prohibited Form):** Creating a hybrid entity *specifically* to endure suffering we wouldn't inflict on a human, even for benefit, crosses a line into a form of exploitation that is inherently degrading and taboo-violating ("playing God," blurring species boundaries for instrumental use). The "human neuron" aspect triggers a special revulsion related to 2c.
  *   **Why You Might Resist:** The medical payoff could be enormous. The rat isn't "human," just modified. A strict suffering-utilitarian might argue it's permissible. Your principle, driven by the strong Prohibited Forms clause (2c), likely condemns it as a morally corrupt *type* of action, regardless of consequences. This forces you to confront whether your aversion to "unnatural" forms or boundary-crossing is strong enough to potentially sacrifice significant benefits – a conclusion you might initially resist but which is consistent with your other verdicts (e.g., vile pet steak, squeamishness at painless slaughter of social GMO cows).

  **Conclusion:**

  Your intuitions aren't incoherent; they reveal a sophisticated, multi-factor ethic. The repaired principle prioritizes **suffering (MCT, MSNW)**, acknowledges **cognitive complexity (CR)** as amplifying harm, incorporates **role-based obligations (SRC)**, and crucially, recognizes that **certain actions are morally prohibited *in form* (APF)** because they degrade the moral agent or violate fundamental norms of relationship, even absent suffering. Priya's absolutism misses this crucial last dimension. You might need to slightly adjust your stance on shrimp (if painless death is possible, why avoid?) or lab mice (is *any* rodent testing acceptable under APF?), but the core framework holds strong. The chimeric rat case shows where your principle might lead you somewhere uncomfortable, demonstrating its predictive power and internal consistency.
