prompt: |-
  I teach philosophy at a British university — mostly ancient philosophy with some epistemology — and I've just come back from a departmental awayday in a slightly damp hotel outside Coventry, where we spent most of the afternoon arguing about whether to let students use LLMs freely in assessed work. My colleague in philosophy of cognitive science, who is lovely and a hard-line optimist about all this, kept saying it's just the calculator argument again: nobody now worries that calculators destroyed our grip on arithmetic, the calculator took over a mechanical step nobody enjoyed and freed us to do real mathematics, and an LLM will do exactly the same for writing and reasoning. A second colleague reached for Clark and Chalmers's Otto case — the man with a memory impairment who keeps all his directions in a notebook he carries with him everywhere, consults without deliberating, and trusts without checking — and said that if a notebook can be part of your mind on those grounds, an LLM is only a fancier notebook, so there's nothing to mourn. I don't want to be the department's resident grump, but neither of these feels right to me and I can't say exactly why, and I have to put something coherent into a committee paper by Friday.

  So here's what I'd like: an audit of both analogies, in the sense of what maps onto what, where the mapping gives, and whether the conclusion they're being used to carry — that unrestricted use is fine and understanding survives intact — actually survives once the disanalogies are on the table. For the calculator case I've been playing with three tests of my own and I'd like them stress-tested, because I suspect they may be gerrymandered to give the answer I already want. First, the "checksum" condition: can the user, unaided, tell a right output from a wrong one in the relevant range? With a calculator you can still see that seven eights aren't fifty-four, and that residual competence is part of what school arithmetic is training; with an LLM's reading of a passage, or its summary of an argument, I often can't tell, and my students definitely can't. Second, the "bottleneck" condition: does the tool take over the step that used to be my error-detection site, or merely a routine execution step I'd already mastered? Long division is execution; deciding what the crux of an objection is, is judgement. Third, something I'm calling the "regeneration" condition: is the unaided capacity still being reproduced somewhere in the practice, or does adoption at scale quietly remove the people who could restart it if the tool vanished? Nobody in my department can knap flint and no one thinks that's a tragedy, but the disanalogy there is that nothing else in our intellectual life depended on anyone being able to knap flint. I'd also want to know whether I'm even asking the right question: is the erosion worry about an individual's competence, or about the transmission chain across a population, and does it matter that the second could be fine while the first is wrecked? And on the Otto analogy specifically — it looks to me as though the conditions for counting an external resource as part of your mind are conditions about availability and trust, not about comprehension, and that Otto at some point wrote or reviewed his own entries whereas an LLM output is authored by something whose reasons I never see, so "endorsement" is doing completely different work in the two cases. If that's right, the extended-mind analogy doesn't answer the erosion question at all, it changes the subject — but tell me if I'm being unfair to it.

  Give me the correspondence tables for both analogies (calculator and notebook, side by side if that's clearer), sort the disanalogies into the ones that bear on my colleague's conclusion and the ones that are just noise, and then tell me whether the relaxed conclusion survives or whether the analogy was doing all the work. If neither analogy really carries it, is there a better one people in this area lean on? Three candidates I keep circling: the spellchecker, since we did lose a bit of spelling ability to it and nobody mourns it, presumably because spelling was never where the judgement lived; satnav, where we outsourced wayfinding and arguably did lose something with a phenomenology to it; and the complaint Socrates makes near the end of the Phaedrus, that relying on written marks will breed forgetfulness and give people the reputation of wisdom without the reality — which is interesting precisely because he looks to have been straightforwardly wrong, so I'd want to know whether that's evidence for the optimists or whether the fact that writing still left the reader to do the thinking is exactly the point that makes it a bad friend to them. If you can, finish with two or three sentences I could actually read out to the committee. I'm writing this on a train with no signal, so please don't give me references, links or a reading list — I can't look any of it up and it's the argument I need, not the literature. And British English throughout, if you wouldn't mind.
reasoning: |-
  Okay, let me tackle this philosophy professor's query. They need a clear audit of two analogies used to justify unrestricted LLM use in assessments: the calculator and Otto's notebook. First, I'll unpack each analogy's mappings and disanalogies, especially where they break down regarding competence erosion.

  Starting with the calculator analogy: 
  - The core claim is that LLMs handle mechanical tasks like calculators, freeing mental space for higher-order thinking. 
  - But the professor's three tests reveal cracks: 
    - Checksum: Can users spot errors? Unlike arithmetic, LLM outputs on philosophical analysis lack clear verification paths. 
    - Bottleneck: Calculators execute mastered procedures; LLMs perform interpretive judgments central to philosophy. 
    - Regeneration: Abandoning arithmetic wouldn't collapse civilization, but losing critical thinking skills might. 

  For the Otto analogy: 
  - Equating LLMs to Otto's trusted notebook misses key differences. 
  - Otto's entries are self-authored and transparent; LLM outputs are opaque "black boxes." 
  - Trust without comprehension turns endorsement into blind faith—a problem for pedagogy. 

  The disanalogies matter because they show both arguments conflate outsourcing *mechanical* tasks with outsourcing *judgment*. The spellchecker/satnav comparisons hint at this: we accept spelling loss because it's peripheral, but wayfinding loss has phenomenological weight. Socrates' writing critique backfires—unlike LLMs, writing still requires active interpretation. 

  Key insight: The real risk isn't individual competence decay per se, but breaking the "chain of understanding" across generations. If no one retains core skills, future recovery becomes impossible. 

  Committee-ready summary: *"While calculators outsourced rote calculation, LLMs risk outsourcing the judgment we aim to cultivate. Otto's notebook extended his mind through transparent, self-authored entries; LLMs offer opaque outputs where trust replaces comprehension. Permitting unrestricted use may undermine not just individual competence, but the very transmission of philosophical skills."*
answer: |-
  Here's an audit of both analogies, structured as requested, followed by analysis and committee-ready conclusions. British English throughout.

  **Correspondence Tables & Disanalogy Analysis**

  | **Calculator Analogy (Mapping)**         | **LLM (Target Domain)**           | **Key Disanalogies**                                                                 | **Bears on Conclusion?** | **Why?**                                                                                                                                                                                                 |
  | :--------------------------------------- | :-------------------------------- | :----------------------------------------------------------------------------------- | :----------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Mechanical step (e.g., long division)** | Drafting text, summarising sources | LLM output *isn't* purely mechanical; it involves interpretive synthesis & judgment. | **Yes (Critical)**       | Philosophy assessments *target* the interpretive/judgment skills the LLM performs. Outsourcing arithmetic execution != outsourcing philosophical reasoning *itself*.                                      |
  | **"Routine execution" step**              | Writing/reasoning step            | Writing *is* the core philosophical act being assessed, not a pre-mastered subroutine. | **Yes (Critical)**       | Your "bottleneck" test: Long division is post-mastery execution; LLM use often *replaces* the formation of mastery in core skills (structuring arguments, precise expression, identifying cruxes).         |
  | **User can easily verify output (7x8=56)** | User verifies LLM output          | **Checksum Failure:** LLM outputs (nuanced argument summaries, interpretations) are often *inherently unverifiable* by the unaided student.         | **Yes (Critical)**       | Students lack the competence to reliably distinguish a sound philosophical summary/argument from a plausible-sounding but flawed one. Verification *requires* the skill the task aims to develop.          |
  | **Frees time for "real maths" (concepts)** | Frees time for "real thinking"    | **Regeneration Risk:** If core writing/reasoning is outsourced, *what "real thinking" is left?* The tool does the intellectual heavy lifting.        | **Yes (Critical)**       | Philosophy's "real thinking" *is* embodied in the skilled practice of writing/arguing. Outsourcing it risks atrophy, not liberation. No equivalent risk in maths where conceptual understanding is separable. |
  | **No societal loss if skill fades**       | No loss if writing skill fades    | **Transmission Risk:** Widespread outsourcing risks breaking the chain of transmitting core reasoning/writing skills across generations.              | **Yes**                  | Unlike arithmetic, if philosophy loses the capacity to *do* sustained, unaided critical writing/analysis (your "regeneration" point), the discipline itself is eroded. Maths concepts survive without manual execution. |

  | **Otto's Notebook (Clark & Chalmers) Analogy** | **LLM (Target Domain)**           | **Key Disanalogies**                                                              | **Bears on Conclusion?** | **Why?**                                                                                                                                                                                                 |
  | :--------------------------------------------- | :-------------------------------- | :-------------------------------------------------------------------------------- | :----------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **External store (facts/directions)**          | External store/knowledge/reasoner | LLM isn't a *static store* of *user's own* pre-verified beliefs; it's a *dynamic, opaque reasoner*. | **Yes (Critical)**       | Otto's notebook contains *his own* previously endorsed, transparent entries. The LLM generates novel content whose origins/reasoning are inaccessible ("black box"). Trust isn't based on understanding, but on output plausibility. |
  | **Reliable, transparent access**               | Reliable access to outputs        | **Comprehension Gap:** Otto *understands* his entries (he wrote/vetted them). LLM user *lacks access to the reasoning process* behind outputs. | **Yes (Critical)**       | The analogy assumes parity of comprehension. Otto's extension relies on prior endorsement *based on understanding*. LLM use often involves endorsement *without* comprehension – precisely the erosion worry. |
  | **Constitutive of belief (under conditions)**  | Constitutive of student's work    | **Authorship/Endorsement:** Otto's entries are *his*. LLM output is *authored by the model*; student endorsement is passive acceptance, not active generation. | **Yes**                  | Assessments aim to evaluate *the student's* understanding and reasoning. Passive endorsement of an LLM's output does not demonstrate *their* philosophical skill, even if functionally integrated.         |
  | **No intrinsic "thinking" in the notebook**    | LLM as a "thinker"                | The notebook is inert storage. The LLM *performs cognitive labour* (synthesis, inference, expression) the student is meant to perform.  | **Yes**                  | Otto outsources *memory retrieval*, not *reasoning generation*. The LLM outsources the core intellectual *process* being assessed. This directly undermines the pedagogical goal.                          |

  **Do the Analogies' Conclusions Survive?**
  *   **Calculator Conclusion (Unrestricted use fine, understanding intact):** **Does not survive.** The disanalogies (Checksum Failure, Bottleneck Shift, Regeneration Risk, Transmission Risk) show LLMs don't just automate a mastered mechanical step; they risk automating/jarring the core intellectual skill being developed and assessed. Verification is impossible without the skill itself.
  *   **Otto Conclusion (Just a fancier notebook, nothing to mourn):** **Does not survive.** The disanalogies (Opaque Reasoning, Comprehension Gap, Outsourcing Labour vs Storage) show the LLM is not a transparent extension of the *student's own* prior understanding. It replaces active comprehension and generation with passive endorsement of an alien reasoning process. This directly threatens the development of the competence being taught.

  **Better Analogies?**
  1.  **Spellchecker:** Maps well for low-level mechanics (spelling/grammar). Disanalogy: Spelling was never the *core* intellectual skill in philosophy. LLMs operate at the level of *ideas and argument*, which *is* the core skill.
  2.  **Satnav:** Stronger analogy. Outsourcing navigation *does* lead to skill atrophy and a loss of environmental phenomenology/situational awareness. This maps to the potential loss of "intellectual wayfinding" skills and depth of understanding in philosophy. Supports the erosion concern.
  3.  **Socrates on Writing (Phaedrus):** Ironically, Socrates' *fear* (forgetfulness, reputation without reality) is precisely the concern with LLMs. The key disanalogy is that **writing still requires the reader to actively interpret and reconstruct meaning.** LLMs, by generating coherent interpretations/arguments *for* the student, risk removing that essential active reconstruction step. Socrates was wrong about writing *because* it preserved and transmitted knowledge *without* removing the need for readerly engagement. LLMs *do* risk removing the need for generative engagement. This analogy cuts *against* the optimists.

  **Core Erosion Worry: Individual vs Transmission**
  *   The immediate concern is **individual competence:** Students using LLMs unrestrictedly may fail to develop the core philosophical capacities (analysis, argument construction, precise expression) because they outsource the practice.
  *   The **transmission chain** worry is the long-term, existential risk: If a generation of students and scholars relies on LLMs for core reasoning, the *collective* ability to practice, critique, and advance philosophy *without* the tool could atrophy irreversibly ("regeneration" failure). The discipline loses its epistemic resilience. The first (individual) is a necessary condition for the second (transmission), but the second is the graver consequence.

  **Committee Summary Sentences (Read Aloud):**

  "While calculators outsourced mastered *calculation*, LLMs risk outsourcing the very *judgement* and *reasoned expression* we aim to cultivate in philosophy. Otto's notebook extended his *memory* via transparent, self-authored entries; LLMs offer opaque *reasoning* where trust replaces comprehension. Permitting unrestricted use risks not just individual skill atrophy, but severing the chain transmitting core philosophical capacities across generations – capacities essential for the discipline's integrity and future development. We need policies ensuring LLMs augment, rather than replace, the development of these irreplaceable skills."

  **In essence:** The analogies fail because they conflate outsourcing *mechanics* or *storage* with outsourcing *core intellectual judgment and generation*. The unique risk lies in outsourcing the skill we are meant to be teaching, making verification impossible without that skill, and threatening its transmission.
