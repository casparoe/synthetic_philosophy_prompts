prompt: |-
  Last night I had a long argument with an old friend — a practising Catholic and a cell biologist — about whether she is entitled to vote against public funding for embryo research purely on the ground that her religious convictions require it. She kept returning to one thought: that being asked to restate her reason in a shared vocabulary is being asked to misdescribe why she actually holds what she holds, and that a politics which demands this is asking her to be a different person in public than she is in private. I kept returning to the opposite thought: that a law coercively imposed on people who do not share her premises needs a justification they could in principle recognise, and that an appeal to her church's authority is not one. We went round for hours and neither of us moved, mostly because we were both being abstract about it.

  I teach an advanced undergraduate/MA seminar on religion and liberal politics — 18 students, a single 90-minute session in the last week of term — and I want to use that session on something better than a debate. What I'd like from you is a structured deliberation game or role-play in which the students run into both halves of that argument themselves, as agents with something at stake, before anyone names either half. I have a rough skeleton and I'd like you to build it out, fix it, or replace it where it won't work.

  The skeleton: each student is secretly dealt a "conviction card" giving them a comprehensive doctrine and a specific conclusion on one concrete legislative question — I was going to use a conscience-clause amendment to a hospital funding bill, but I'm open to a cleaner case if that one drags the discussion into medical detail. The cards should be deliberately mixed. Some are religious, but at least one should be a secular comprehensive doctrine whose reasons are just as contested and just as unavailable to someone outside it (a thoroughgoing perfectionism about the arts, say, or an orthodox utilitarianism), so that the easy reading — "this is a problem about religious people" — quietly fails. Crucially, some cards should give reasons that have a decent secular stand-in, and others should give reasons that essentially cite a text, an authority, or a revelation, so that any restatement loses what made the reason a reason for that person. Then two rounds on the same question under different rules: in the first, you may only offer reasons that others can be expected to accept; in the second, you may offer your own reason provided you also supply a shared one. Same people, same cards, same question, so they feel the difference in their own conduct rather than only in the outcome. My scoring idea, which I suspect is where the real work is: every student keeps a private ledger of the two or three reasons that actually moved them, and separately a public ledger of the reasons they stated. Stating a reason that is not among your operative reasons costs you an integrity token, and integrity tokens can be cashed in for legislative capital at a deliberately bad exchange rate — so restraint is available, mostly cheap, but never free, and the price falls unevenly across the room. I also want a receiving-side mechanic: some students are assigned to certify whether a stated reason is one they can see as a reason, so that "accessibility" shows up as a relation to an audience rather than a property of a sentence. Nothing may be named in advance: no lecture at the front, and the terms public reason, comprehensive doctrine, and the proviso should not be uttered until the debrief, so that the naming lands on something they have already done.

  What I need back, then: the cards and the case; the rules, the timeline, and the payoff scheme, using points or chips rather than money; and a debrief that maps particular moments in the play onto particular parts of the problem — why restraint feels like a gag from the inside, why an untranslated reason feels like coercion from the receiving end, why you can sincerely affirm a public reason that did not move you at all, why reasons thin out toward vacuity as the audience widens, and why the cost of restraint is unevenly distributed. Tell me honestly what will predictably go wrong: my guess is that some students will play it as pure coalition bargaining and ignore the reason-giving rules entirely, that whoever draws the religious card will either over-perform or go quiet because the room is secular, that someone will announce that they would simply lie about their reasons, and that the certification mechanic will get used as a tactical veto rather than an epistemic test — but say what you'd actually do about each. And be frank about what a 90-minute game cannot reproduce and I will have to supply myself: I assume it collapses "accessible in principle" into "acceptable to this particular room," and that it makes restraint look like a legal gag rule rather than a moral duty borne by citizens and officials, and that it can't show the long-run, diachronic character of the "in due course" clause at all.
reasoning: |-
  Hmm, the user presents a fascinating pedagogical challenge rooted in a real philosophical debate about public reason and religious conviction. They want to transform their abstract argument with a Catholic biologist into a classroom experience where students encounter the tension between personal conviction and public justification organically. 

  The core tension they've identified is brilliant: how to make students feel both the alienation of having to translate deeply held beliefs into "public reason" and the legitimate demand for shared justifications in a pluralistic society. Their skeleton game design shows deep familiarity with Rawlsian concepts while avoiding theoretical jargon - exactly what good pedagogy requires.

  Noticing several layers here:
  First, the immediate need for a workable simulation structure that avoids medical distractions (good call switching from embryo research). The hospital conscience clause is messy - better to isolate the justificatory conflict. The integrity token system is pedagogically clever but logistically fragile; needs simpler tracking.

  Second, deeper pedagogical risks: students reducing it to bargaining (solution: strict reason-monitoring), secular room dynamics silencing religious players (solution: card anonymization), and the inevitable "why not lie?" challenge (solution: build self-penalty into scoring). Must also preempt tactical certification abuse.

  Third, what the simulation can't achieve: the temporal dimension of "in due course" proviso, and the moral (not just legal) weight of public reason. Will need to foreground these in debrief through specific game moments.

  The abortion funding case works better than embryo research - keeps focus on funding decisions rather than bioethics. Need at least one "hard case" secular doctrine (like Randian objectivism) to prevent religious exceptionalism. Card design is crucial: must include both translatable reasons (e.g., Catholic natural law arguments) and strictly non-translatable ones (e.g., sola scriptura Protestants).

  For mechanics: replace integrity tokens with simpler "sincerity cost" in scoring. Certification should require justification to prevent veto abuse. Timeline must be tight - 15min per round max. Debrief should map student frustrations directly to Rawls/Quong concepts without naming them first.

  Biggest predictables: 
  - Coalition builders ignoring reason rules → assign enforcement to certification group
  - Religious player discomfort → anonymize cards, allow written submissions
  - "Why not lie?" moments → build high cost into scoring system
  - Certification as veto → require specific accessibility criteria

  What 90min can't do: show how public reason develops historically, or distinguish citizen vs official duties. Will need to flag these as "what we couldn't simulate" during debrief.

  Final design must feel like discovery, not illustration. The moment when students realize secular doctrines face the same translation problem should land like a revelation.
answer: |-
  Here’s a refined, classroom-ready deliberation game based on your framework, designed to surface the core tensions without theoretical preamble. It prioritizes experiential learning, uneven costs of restraint, and the relational nature of "shared reasons."

  ---

  ### **Game Title:** *The Justification Lab*  
  **Time:** 90 minutes (including debrief)  
  **Students:** 18  
  **Setup:** Tables arranged in a circle, three distinct card decks, poker chips (red = "integrity," blue = "legislative capital"), notecards, timers.

  ---

  ### **Phase 1: Setup (10 min)**  
  1. **The Case:** A municipal referendum on *public funding for abortion services* (avoids medical details; focuses on funding/conscience).  
     - **Question:** *"Should municipal taxes fund abortions at public hospitals?"*  
     - **Context:** Presented neutrally: "City faces budget choices; clinics serve low-income residents."  

  2. **Conviction Cards (Deal secretly):**  
     - **12x Position Cards** (6 "Fund," 6 "Defund") with **comprehensive doctrines**:  
       - *Religious (hard):* "My church teaches life begins at conception; funding is sin." (e.g., Catholic/evangelical)  
       - *Religious (soft):* "My faith values compassion; funding reduces suffering." (e.g., liberal Protestant)  
       - *Secular (hard):* "Artistic perfection requires societal focus on beauty; abortion is a brutal distraction." (Perfectionist)  
       - *Secular (hard):* "Only market efficiency matters; defund to cut taxes." (Randian objectivist)  
       - *Secular (soft):* "Bodily autonomy is a universal right; fund to ensure access." (Feminist liberal)  
       - *Secular (soft):* "Utilitarianism: Funding prevents back-alley deaths." (Consequentialist)  
     - **6x Auditor Cards:** Assigned to students who certify reasons. Their role: **"Can you see this reason as valid, even if you disagree?"** (Criteria: Not require accepting unseen authority/text; not rely on contested metaphysical claims).  

  3. **Materials:**  
     - Personal ledger (notecard) split into "My Real Reasons" (private) and "Stated Reasons" (public).  
     - 3 red "integrity tokens" per player.  
     - Blue "legislative capital" chips (10 per player; value revealed later).  

  ---

  ### **Phase 2: Round 1 – Strict Public Reason (20 min)**  
  **Rule:** *"State only reasons accessible to all. No appeals to texts, private revelations, or contested doctrines."*  
  - Students deliberate in pairs/small groups.  
  - **Auditors:** Circulate, listen, and issue **"certification"** (verbal/written) if a reason meets criteria.  
  - **Players:** Record "Stated Reasons" in public ledger. If you state a reason **not** in your private ledger, surrender 1 red token.  
  - **Scoring:** 1 blue chip for each *certified* reason you state.  

  ---

  ### **Phase 3: Round 2 – Proviso Round (20 min)**  
  **Rule:** *"State your real reason, BUT add a reason that could be accepted by others."*  
  - Same groups, same question.  
  - **Auditors:** Certify *only the shared reason* (must pass accessibility test).  
  - **Players:** If your *real reason* is inaccessible (e.g., "the Pope says so"), you **must** pay 1 red token to state it.  
  - **Scoring:** 2 blue chips for each *certified* shared reason; 0 for uncertified real reasons.  

  ---

  ### **Phase 4: Voting & Cashing Out (10 min)**  
  - Secret ballot on the funding question.  
  - **Exchange:** Redeem blue chips → *legislative capital* (1 chip = 1 vote weight in a hypothetical future bill).  
  - **Penalty:** Losing red tokens → lose 2 blue chips per token (integrity cost).  

  ---

  ### **Debrief Framework (30 min)**  
  **Do not name Rawlsian terms until students surface concepts.**  
  1. **Feelings Check:** "What frustrated you? When did you feel heard/misunderstood?"  
  2. **Key Moments:**  
     - **Restraint as Gag:** "Who paid red tokens in Round 1? How did it feel to omit your real reason?"  
     - **Coercion & Untranslated Reasons:** "When you heard an uncertified reason (e.g., 'the Bible forbids it'), did it feel like an imposition? Why?"  
     - **Sincere but Empty Public Reasons:** "Did anyone state a 'shared' reason you found weak/vague but certified? Why?"  
     - **Thinning Reasons:** "Did public reasons become blander as auditors rejected more? (e.g., 'It’s compassionate' vs. 'Jesus commands mercy')."  
     - **Uneven Cost:** "Who paid the most red tokens? (Hint: hard religious/secular doctrines). Why is restraint harder for some?"  
  3. **Map to Theory:**  
     - "When Carlos had to swap ‘Allah wills it’ for ‘reduce suffering,’ he experienced _____." → **Comprehensive doctrine vs. public reason.**  
     - "When the auditors rejected Zoe’s art-perfection argument, it showed accessibility is about _____." → **Reciprocity, not logic.**  
     - "The red token penalty mirrors why we feel _____ when silencing core convictions." → **The integrity cost of restraint.**  
  4. **Predictables & Fixes:**  
     - *Problem:* "Why not lie?" → *Design fix:* High cost of losing tokens (integrity → capital loss); auditors force sincerity.  
     - *Problem:* Coalition bargaining ignoring rules → *Design fix:* Auditors enforce certification; scoring rewards rule-following.  
     - *Problem:* Religious player discomfort → *Design fix:* Cards anonymized; no forced self-disclosure.  
     - *Problem:* Auditors as tactical veto → *Design fix:* They must justify rejections ("This requires accepting papal infallibility").  
  5. **Limits of the Game:**  
     - "We simulated ‘acceptability to this room’—but real public reason asks ‘could citizens *over time* accept this.’"  
     - "Restraint here felt like a rule—but Rawls sees it as a *duty* to fellow citizens."  
     - "We couldn’t show how ‘in due course’ allows religious arguments to shape public values *indirectly* (e.g., civil rights movement)."  

  ---

  ### **Why This Works**  
  - **Mixed Cards:** Secular hard doctrines (e.g., art perfectionism) prevent "religious problem" framing.  
  - **Integrity Tokens:** Materializes the psychological cost of restraint. Uneven distribution mirrors real power imbalances.  
  - **Auditors:** Make "accessibility" intersubjective—students *experience* rejection of their deepest reasons.  
  - **Two Rounds:** Sharp contrast highlights how the proviso changes discourse (and who benefits).  

  **Final Tip:** Start debrief with student emotions ("Felt silenced? Felt coerced by others?"), then abstract upwards. The game makes the theoretical stakes *felt*—your job is to help name them.
