  ### Move-by-Move Adjudication
  **M1 (Marcus): 3/5**  
  *Partly right*. Marcus correctly identifies the competitiveness constraint’s core dynamic: self-restraint may only shift risk to less cautious actors. However, he oversimplifies by implying that "winning the race" guarantees control over risk outcomes. This ignores whether the first-mover can reliably implement safety *during* acceleration, a point Lena later dismantles. Concession: His focus on relative capability is valid but neglects verification trade-offs.

  **M2 (Lena): 5/5**  
  *Clearly right*. Her first reply exposes Marcus’s logic as a slippery slope against *all* safety investment, reframing it as a critique of incentives, not tax specifics. The second reply is decisive: racing inherently disfavors rigorous verification, making "winning safely" self-contradictory without proof. This damages Marcus’s premise that the "good guys" winning ensures safety.

  **M3 (Marcus): 4/5**  
  *Mostly right*. Distinguishing localized vs. distributed taxes is astute—localized taxes (e.g., sandboxing) are more viable under competition. The scoring-artifact point is empirically supported (e.g., refusals inflating benchmark failures). But conceding M2’s verification critique undermines his earlier "win the race" optimism: if safety is unverified, winning offers no guarantee.

  **M4 (Lena): 4/5**  
  *Mostly right*. Tax pass-through in deployed systems (e.g., retries routing around refusals) is a critical institutional insight. It shows localized taxes can *increase* systemic risk by shifting activity to less governed channels. However, she slightly overstates inevitability—some scaffolds (e.g., hard security boundaries) may mitigate pass-through.

  **M5 (Marcus): 5/5**  
  *Clearly right*. His shift to "tax removability" as the core criterion reframes the debate: structural safeguards (e.g., hardware controls) are resilient, while superficial restraints (e.g., prompts) are "safety theater." This aligns with dual-use governance principles (e.g., tamper-proof seals). Crucially, he notes that unremovable taxes avoid creating false assurance—a key risk in Lena’s pass-through scenario.

  **M6 (Lena): 4/5**  
  *Mostly right*. Legitimacy as a "second currency" is a vital correction to Marcus’s narrow capability focus. Safety spending *can* yield regulatory/social capital, altering cost-benefit calculus (e.g., EU AI Act compliance as market access). But she underplays Marcus’s transition concern: legitimacy markets emerge *after* incidents, making early tax-paying risky without pre-existing regulation.

  **M7 (Marcus): 3/5**  
  *Partly right*. The transition-risk point is valid—legitimacy mechanisms often lag, creating a "valley of vulnerability." Gaming legitimacy (e.g., symbolic self-regulation) is indeed cheaper than real safety. However, he dismisses Lena’s institutional optimism too quickly: regimes *can* be shaped preemptively (e.g., bioethics norms pre-CRISPR), and his own tax-removability argument implies enforceable rules are feasible.

  ---

  ### What Both Are Missing  
  The debate centers on *tactical* tax design within a presumed competitive landscape but overlooks **differential risk profiles**. Marcus’s "race to win" assumes all actors pose equal systemic risk, but state-aligned labs (e.g., national champions) may face softer constraints or greater oversight—altering tax calculus. Lena’s legitimacy argument ignores that regulatory capture can decouple legitimacy from actual safety. Crucially, neither addresses **asymmetric stakes**: some actors (e.g., militaries) may prioritize capability regardless of tax, making "good guy" victories irrelevant for certain threat models (e.g., weaponization). Restructuring requires asking *whose competitiveness matters* and *which risks are reducible by taxation alone*—potentially pointing to sector-specific regimes.

