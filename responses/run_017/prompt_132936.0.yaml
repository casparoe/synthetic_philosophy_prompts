answer: |-
  ## Office of Moral Foundation Parity: Policy Framework for Compliance with the Foundation Parity Act (2023)  

  **Preamble:** Pursuant to the Foundation Parity Act (FPA), moral cognition operates via discrete neurobiological substrates ("Foundations"), analogous to gustatory receptors, which generate intuitions prior to reasoned justification. To prevent discourse monoculture and ensure ecosystemic resilience in public moral reasoning, the Office of Moral Foundation Parity (OMFP) hereby establishes the following regulatory standards.  

  ### Regulatory Clauses  
  1. **Foundation Coverage Requirement:**  
     All public moral arguments (defined as Letters to Editors, Sermons, Protest Signage, Social Media Declarations exceeding 50 words, and Council Meeting Interjections) must demonstrate coverage of at least one (1) Individualizing Foundation (Care/Harm, Fairness/Cheating) *and* one (1) Binding Foundation (Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation). Arguments failing this threshold constitute "Monoculture Speech."  

  2. **Monoculture Speech Registration:**  
     Authors of Monoculture Speech must register with the OMFP as "Foundation-Limited Persons" (FLPs). FLPs shall receive a state-issued badge (blue for Individualizing-Dominant; red for Binding-Dominant) to be worn during future public discourse. Registration includes mandatory equilibratory training (e.g., Loyalty modules for Care-specialists; Fairness drills for Authority-adjacents).  

  3. **Intuitive Auditing Protocol:**  
     Auditors shall assess compliance solely via foundational intuition activation. Reasoning proffered by the speaker is classified as post-intuition narrative scaffolding ("spin") and disregarded. Auditors must record rulings within fifteen (15) seconds of exposure to the stimulus to preclude reasoned contamination.  

  4. **Grounds-Based Ruling Disqualification:**  
     Any auditor cited providing logical justification for a ruling shall be immediately disqualified and reclassified as an FLP (Reasoning-Dependent subtype). Appeals may only be filed by submitting an intuition log verified by two (2) unaffiliated auditors.  

  5. **Symmetry Foundation Inclusion:**  
     Notwithstanding original framework parameters, the Symmetry Foundation ("Any normative claim invoked against another binds the invoker equally") is hereby recognized, per the research of Dr. Elara Vance (Institute for Coherence Studies). Symmetry activation counts toward Binding coverage but requires cross-verification by three (3) auditors due to its "meta-reputational" instability.  

  6. **Equilibrium Thresholds:**  
     A "Balanced Argument" must not exceed 70% dominance by any single foundation cluster. Thresholds are calculable via the OMFP’s MoralPalate™ app (v.2.7), which scans text for foundation-triggering keywords (e.g., "oppression" = Care/Fairness; "desecration" = Sanctity).  

  7. **Sanctity Mitigation:**  
     Arguments heavily reliant on Sanctity may substitute Purity Wavers (obtainable at OMFP kiosks) for verbal compliance. One (1) waiver neutralizes up to five (5) Sanctity violations.  

  ### Appendix A: Self-Audit of Regulatory Instruments  
  *(Per Clause 5: Symmetry Foundation Application)*  

  - **FPA Preamble (Excerpt):** *"Whereas moral intuitions arise from innate psychological foundations... and whereas unbalanced discourse corrodes societal cohesion..."*  
    **OMFP Ruling:** **Binding Monoculture Detected.**  
    *Coverage Analysis:* Authority (x3), Loyalty (x2), Sanctity (x1). Individualizing Foundations: 0. Symmetry Violation: Invokes "societal cohesion" as binding imperative but exempts legislative authority from equivalent binding. **Remedy:** Preamble authors designated FLPs (Binding-Dominant). Mandatory Care/Fairness supplementation added to all legislative letterhead.  

  - **OMFP Audit Board Deliberation (Sample):**  
    *Ruling:* "Protest sign reading 'Stop Child Hunger Now' classified as Individualizing Monoculture (Care x4). FLP status issued."  
    **Self-Audit:** **Symmetry Violation by Board.**  
    *Analysis:* Board invoked Fairness foundation to penalize perceived Care overextension but exempted itself from Symmetry binding ("Auditors shall assess solely via intuition"). No Binding foundations deployed to self-limit OMFP authority. **Remedy:** Entire Board reclassified as FLPs (Symmetry-Deficient subtype). Equilibratory training: Authority-subversion roleplay exercises.  

  ---

  **Satirical Targets Explained:**  
  1. **"Neutral Map" as Enforcement Tool:** The OMFP weaponizes the "descriptive" framework prescriptively, auditing speech like nutritional content.  
  2. **Intuition-First Dismissal:** By banning reasoning in audits, the policy enacts the theory’s claim that reasoning is mere "spin," ironically requiring auditors to *be* pure intuition engines.  
  3. **Asymmetry in Application:** The self-audit reveals the regulators exempt themselves from the Symmetry Foundation, mirroring how MFT users often insulate their *own* judgments from foundation analysis.  
  4. **Monoculture & Registration:** Parodies reducing moral positions to foundation scores, pathologizing imbalance ("FLP" status as a scarlet letter for the "morally deficient").  
  5. **Symmetry as Unwelcome Meta-Foundation:** Its late addition and instability mock how expanding the framework to include self-referential critique (e.g., "your theory binds you too") is often resisted as "incoherent."  

