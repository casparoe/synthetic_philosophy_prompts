prompt: |-
  Hey — I need help planning next week's section, not the material itself.

  Setup: fifty-minute discussion section, Philosophy of Science for non-majors — mostly compsci and econ kids who have seen Bayes' theorem once in a stats class and can multiply out a posterior, but have had nothing on confirmation theory, nothing on hypothetico-deductivism. The topic is the problem of old evidence. I know the dialectic; what I don't have is an order for it.

  The dependency question is what I keep getting stuck on. I think something has to be established before the puzzle can even be stated — something like: for the Bayesian, learning is becoming certain, the thing you become certain of has to have had a prior below 1, and confirmation is probability-raising, not "this makes sense of that." But I can't tell whether that last bit belongs up front or whether it's actually the moral I should let them arrive at, and if it goes up front I worry it deflates the puzzle instead of setting it up. Tell me what has to be on the board, in what order, and what breaks if I move a piece earlier.

  The carrying case. I keep reaching for the perihelion of Mercury and I've decided that's wrong for this group — their physics is one semester of mechanics and it invites "maybe the measurements were just off." My fallback is a who-dunnit: the muddy boots have been sitting in the hallway the whole time, the new hypothesis is that the gardener did it, and everyone in the room feels the "oh, *that's* why" without any new data arriving. Give me one case to build the whole fifty minutes around, and say what it has to have and what it has to lack — my guess is it needs (a) a fact every student has known since childhood, (b) a hypothesis nobody could suspect was reverse-engineered to fit it, and (c) no wriggle room where someone can say the genuinely new evidence is the derivation someone performed later.

  Misconceptions I'm expecting, and I want these placed in the sequence rather than listed: (1) "easy — just redo the update with your earlier prior," which I take to be the counterfactual/ur-prior move wearing a disguise, and I don't want them filing it as epistemic amnesia; (2) "the real evidence is new, it's the calculation," which feels like a dodge to me but I can't say cleanly why; (3) "so Bayesianism is just false"; (4) "this only shows up in dusty historical cases with old theories"; (5) and this group specifically: "if the data was already in front of you, any fit to it is overfitting," which is the machine-learning intuition leaking in. Which of these do I head off, at which point in the sequence, and what am I not seeing?

  One thing I've started believing and can't place: that the real lesson is that the Bayesian picture has no room for the difference between predicting something in advance and merely accommodating it, and that the old-evidence problem is just that gap showing up in one place. Tell me whether to put that in, where, or whether it muddies the fifty minutes.

  And tell me straight what to leave out at this level and say out loud that I'm leaving it out — I don't want to open the door to the bootstrapping formalisms or to probability kinematics, but I also don't want to look like I'm hiding something when a sharp student asks.

  Format: give me a markdown table, one row per step, with exactly these columns — Order (1..n) | Move (what I say or put on the board, one or two sentences) | Depends on (which earlier row it needs and what breaks if it comes sooner) | Misconception defused here (name the numbered one, or "—") | Check (the question or board vote that tells me this step landed before I move on). Then a second short table with columns Left out | Why it's out | What to say when someone asks, for the three or four things you think I should name-and-decline. Then one line: Exit question — the single question I ask at minute 48 that separates someone who has the puzzle from someone who has the vocabulary.
reasoning: |-
  We are teaching a fifty-minute section on the problem of old evidence for non-majors in Philosophy of Science. The students have seen Bayes' theorem but not confirmation theory. We need to structure the class so that the puzzle of old evidence is clear and engaging, using a case study that avoids physics and instead uses a relatable example (like a who-dunnit). We also need to address common misconceptions and decide on the key insight about the Bayesian view of learning.

  The plan is to build the entire class around a single case: a murder mystery where the muddy boots in the hallway (known to everyone) are explained by a new hypothesis (the gardener did it). This avoids the perihelion of Mercury and fits the criteria.

  Key elements of the case:
  - (a) Fact known since childhood: muddy boots in the hallway (or similar common knowledge item)
  - (b) Hypothesis not reverse-engineered: e.g., the gardener did it (and we have independent reasons to suspect the gardener, so it's not ad hoc)
  - (c) No wriggle room: the derivation of the explanation is not new evidence; the fact is old.

  Structure:

  1. Set up Bayesian confirmation: remind them of the basics (Bayes' theorem, confirmation as probability raising, learning as becoming certain).
  2. Present the case: the murder and the old evidence (muddy boots). Then introduce the new hypothesis (gardener did it) and note that it explains the boots. But wait: the boots were already known. How can they confirm the hypothesis?
  3. State the puzzle: if the evidence is old (already known, so probability 1), then it cannot raise the probability of the hypothesis (because if P(e)=1, then P(h|e)=P(h) by the rules of probability).
  4. Address common misconceptions as they arise, especially the ones listed.

  We must avoid:
  - Opening the door to bootstrapping or probability kinematics (too advanced).
  - Getting bogged down in technical solutions.

  The exit question should test if they grasp the puzzle, not the solution.

  Now, the step-by-step table:

  Order | Move | Depends on | Misconception defused here | Check
  ---|---|---|---|---
  1 | Review: Bayes' theorem: P(H|E) = [P(E|H) * P(H)] / P(E). Remind them that when we learn E, we update by setting P(E)=1. Confirmation: E confirms H iff P(H|E) > P(H). | — | — | Ask: "If we learn E and it raises the probability of H, what do we call that?" (Answer: confirmation)
  2 | Introduce the case: There was a murder in the mansion. The butler and the gardener are suspects. We've known since the beginning that there were muddy boots in the hallway. (This is old evidence.) Now, a new hypothesis: the gardener did it. Why? Because he has a motive and we note that the muddy boots are his and he left them there during the murder. | Step 1 (they need to know what confirmation is) | — | Ask: "Does the muddy boot evidence seem to support the gardener hypothesis?" (Expect yes)
  3 | State the puzzle: But wait, we already knew about the boots. So, when we update on the boots, we set P(boots)=1. Then, by Bayes, the posterior P(gardener|boots) = P(gardener) [if P(boots)=1, then P(gardener|boots) = P(gardener) because the ratio doesn't change]. So, the boots don't confirm the gardener hypothesis? But that feels wrong! | Step 2 (they need to see the case) and Step 1 (they need Bayes) | — | Ask: "According to Bayesian updating, if we already know the evidence, what happens to the probability of the hypothesis when we 'learn' it again?" (Answer: it stays the same, no change)
  4 | Address misconception (1): "Easy — just redo the update with your earlier prior." But that would require forgetting the evidence and then learning it again. That's not how we learn. We don't forget the evidence. | Step 3 (they need to see the puzzle) | (1) | Ask: "If we pretend we didn't know the boots and then update, what does that require?" (Answer: forgetting, which is not typical learning)
  5 | Address misconception (2): "The real evidence is new, it's the calculation (the derivation that the gardener's boots would be there)." But the Bayesian model treats evidence as propositions we learn. The calculation is a logical truth (if H entails E, then P(E|H)=1) and we already knew E. So learning the logical truth? But logical truths have probability 1 too, so they don't change anything. | Step 3 (puzzle) and Step 1 (Bayes) | (2) | Ask: "If we learn that the gardener hypothesis entails the muddy boots (which we already know), does that change our probability? How?" (Hint: it's a logical truth, so P(entailment)=1 already? Not exactly, but we can say: if we didn't know the entailment, then we might have P(E|H) < 1, but in this case, we are supposing we just realized the entailment. However, in the strict Bayesian model, logical truths are always assigned probability 1. So we cannot update on them. This is tricky, but for non-majors, we can say: the connection was always there, and we just discovered it. But the evidence E itself is old.)
  6 | Address misconception (4): "This only shows up in historical cases." But our murder case is contemporary. It can happen whenever we have a 'Eureka' moment about old evidence. | Step 3 (puzzle) | (4) | Ask: "Can you think of a non-historical example?" (e.g., in math: you knew the numbers, but then a new theorem explains them)
  7 | Address misconception (5): "If the data was already in front of you, any fit to it is overfitting." But that's a machine learning worry. In our case, the hypothesis isn't built to fit the data; we had independent reasons (motive) to suspect the gardener, and then we realized the boots fit. So it's not overfitting. | Step 2 (the case) and Step 3 (puzzle) | (5) | Ask: "Is the gardener hypothesis overfitting the boots? Why or why not?" (Answer: it might be, but we have independent reasons, so not necessarily. The point is that in the Bayesian model, even a good explanation of old evidence doesn't confirm if the evidence is already known.)
  8 | The gap: Point out that in the Bayesian picture, what matters is the prediction in advance. If you predict E before it's observed, then when you see E, your belief in H goes up. But if you accommodate E (explain it after the fact), then it doesn't confirm. The old evidence problem is a case of accommodation. | Steps 3 and 7 (they have seen the puzzle and the overfitting worry) | — | Ask: "What is the difference between prediction and accommodation? And which one is happening with the boots?" (Answer: accommodation; and it doesn't confirm in the Bayesian model)
  9 | Conclude: So we have a puzzle. The Bayesian model doesn't allow old evidence to confirm. But intuitively, it does. So what can we do? We won't solve it today, but note: some think we need to change the Bayesian model (e.g., allow updating on logical knowledge, or use counterfactual priors) but that's for another day. | Steps 1-8 | (3) "so Bayesianism is false" (acknowledge that this is a challenge, but not necessarily fatal) | Ask: "What are the two main ways people try to solve this? (counterfactual priors or updating on logical knowledge) and why are they tricky?" (Briefly: counterfactual priors require imagining we didn't know E, which is hard; updating on logical knowledge requires a model of logical learning, which standard Bayes doesn't have.)

  Now, the second table: things we leave out.

  Left out | Why it's out | What to say when someone asks
  ---|---|---
  Bootstrapping (e.g., Glymour's approach) | Too advanced; it's a non-Bayesian approach to confirmation and would take us too far afield | "That's a different approach to confirmation that isn't Bayesian. We're focusing on the Bayesian framework today."
  Probability kinematics (Jeffrey conditioning) | This is for updating on uncertain evidence, but old evidence is certain. It doesn't directly help. | "Jeffrey conditioning is for when evidence isn't certain, but here the evidence is certain. So it doesn't apply."
  The full formal details of the counterfactual prior approach | We want to keep it simple; the counterfactual move is mentioned but not developed. | "We're mentioning the idea of using a counterfactual prior, but the details are complex and we don't have time. Take a philosophy of science class that covers Bayesianism in depth if you're interested!"

  Exit question: "In one sentence, why can't old evidence confirm a new hypothesis in the strict Bayesian model?"  
  Expected answer: Because once the evidence is known (P(E)=1), conditionalizing on E doesn't change the probability of H, so P(H|E) = P(H).  
  (Or: because confirmation requires probability raising, and old evidence doesn't raise the probability since it's already accounted for.)

  Let's code the tables accordingly.
answer: |-
  ### Section Plan: Problem of Old Evidence

  **Case Study:** A murder mystery where the victim was killed in a mansion. The muddy boots in the hallway have been known since the crime scene was first examined (old evidence). A new suspect—the gardener—is proposed based on his motive and opportunity. The boots "click" as evidence when the gardener's alibi is disproved, but no new physical evidence arrives.  
  **Why this case works:**  
  - (a) The muddy boots are universally relatable (every student understands "evidence at a crime scene").  
  - (b) The gardener hypothesis isn’t reverse-engineered (established via independent motive: he was fired by the victim).  
  - (c) No wriggle room: The "aha!" moment is purely inferential—no new measurements or calculations.  

  ---

  ### Teaching Sequence  
  *One row per step, 50 minutes total*

  | Order | Move | Depends on | Misconception Defused Here | Check |
  |-------|------|-----------|----------------------------|-------|
  | 1 | **Hook:** "Imagine a murder in a mansion. We’ve known for weeks: muddy boots were in the hallway (E). No one knew why. Today, a new suspect: the gardener (H). We learn he had motive. Suddenly, the boots ‘make sense’ as his. Does E support H?" | — | — | Vote: "Raise hand if E confirms H here." (Goal: unanimity.) |
  | 2 | **Review Bayes:** Write on board: `P(H|E) = [P(E|H) * P(H)] / P(E)`. "For Bayesians, learning E means setting P(E)=1. Confirmation = probability-raising: P(H|E) > P(H)." | Step 1 (intuition) | — | Q: "If P(E)=1 already, what’s P(H\|E)?" A: "P(H) – no change." |
  | 3 | **State the Puzzle:** "But E was already known! So P(E)=1 *before* we considered H. By Bayes, if P(E)=1, then P(H\|E) = P(H). So E *can’t* confirm H. But our intuition says it does. That’s the problem of old evidence." | Steps 1–2 | — | Q: "What’s contradictory here?" A: "Intuition vs. math." |
  | 4 | **Block Misconception (2):** "You might say: ‘The *real* evidence is the new *derivation* linking H and E.’ But derivations are logical truths. If we already knew E, learning ‘H implies E’ doesn’t change P(E) or P(H\|E)." | Step 3 (puzzle) | (2) | Q: "If ‘H entails E’ is a logical truth, what’s its probability?" A: "P=1 – no update." |
  | 5 | **Block Misconception (1):** "Solution? ‘Forget E, update as if new!’ But that’s epistemic amnesia. We don’t ‘unknow’ facts. Bayesianism models learning, not unlearning." | Step 3 (puzzle) | (1) | Q: "In real life, can you *truly* forget E?" A: "No – artificial." |
  | 6 | **Deepen the Gap:** "Bayesians care about *prediction*: if H predicts novel E, P(H) jumps when E arrives. But *accommodation* (explaining old E) doesn’t raise P(H). The boots were accommodated, not predicted." | Steps 3–5 | — | Q: "Did the gardener *predict* the boots?" A: "No – accommodated." |
  | 7 | **Block Misconceptions (4) & (5):** "This isn’t just history! It’s everywhere: e.g., re-examining old data in ML. But note: (5) ‘Fitting old data is overfitting’ misses the point. Overfitting is H *built* for E. Here, H is independent (motive first!), yet confirmation *still* feels right." | Steps 3–6 | (4), (5) | Q: "Was H reverse-engineered for E?" A: "No – motive was separate." |
  | 8 | **Conclude the Challenge:** "So: Bayesianism says old evidence can’t confirm. But intuitively, it does. Is Bayesianism false? Not necessarily – but this reveals a flaw. Maybe we need new tools (next week!)." | Steps 3–7 | (3) | Q: "Does this *refute* Bayesianism?" A: "No – it’s a puzzle to fix." |

  ---

  ### What to Leave Out  
  *Explicitly state these omissions upfront (minute 5)*  

  | Left Out | Why It’s Out | What to Say If Asked |
  |----------|--------------|----------------------|
  | Bootstrapping formalisms (e.g., Glymour) | Too technical; shifts focus from Bayesianism to rival frameworks. | "That’s a non-Bayesian approach. Today, we’re testing Bayesianism *on its own terms*." |
  | Probability kinematics (Jeffrey conditioning) | For uncertain evidence; old evidence is certain. Irrelevant to this puzzle. | "Kinematics handles vague evidence, but here E is solid. It doesn’t solve the P(E)=1 issue." |
  | Ur-prior/counterfactual solutions | Too abstract for intro; risks conflating "forgetting" with rational priors. | "We’ll tackle counterfactual priors next week. Today, we’re seeing *why* we need them." |

  ---

  ### Exit Question (Minute 48)  
  **"In Bayesian terms, why can’t the muddy boots (old evidence) confirm the gardener hypothesis?"**  
  - **Key for success:** Answers must cite *probability-raising* and *P(E)=1* (e.g., "P(H|E) = P(H) when P(E)=1, so no boost").  
  - **Red flag:** Vague appeals to "intuition" or "derivations."
