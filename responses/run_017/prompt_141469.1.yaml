prompt: |-
  You're a professional philosopher who's also spent a couple years embedded on an ML eval team, so you know the literature on the intentional stance (Dennett and after) and you also know how this argument actually goes down inside a lab. Take your time, think carefully, and before you write the document do a quick brainstorm pass: each side's three strongest premises, and the strongest thing the other side says back.

  Here's the setup. At work we have this running argument about bug reports. Someone on eval writes, "the model thinks the user is in Berlin, and that's why it keeps recommending German tax forms." Someone else — usually Dev, who does red-teaming — crosses it out and rewrites it as "the model's continuations are consistent with the hypothesis that the user is in Berlin." Maya, who wrote the original, says the rewrite is longer, less predictive, and doesn't tell the on-call engineer what to actually change. Dev says the original sneaks in a claim nobody has earned. They've been doing this in a shared doc, in front of the whole team, for about a year. Nobody has moved an inch.

  So draft the document they should have written instead: the joint statement of an adversarial collaboration between the two camps.

  Camp A (Maya's): attributing beliefs, goals, and desires to the system is often the best explanation of what it does; when a prediction strategy is indispensable, has no equally good competitor, and survives arbitrary changes in surface form, the attitudes it posits aren't a convenient fiction — at which point either they're real beliefs or the question of whether they're real has been settled in the affirmative.

  Camp B (Dev's): the system was trained to continue text produced by creatures that do have beliefs, so of course its output looks like the output of a believer; content-talk is our projection onto a pattern-completer, and whatever predictive success it has is success at modeling the distribution of human talk, not success at latching onto states of the machine.

  What I want in it, roughly:

  - An agreed-claims section that isn't mush. They already agree on a lot: that the model tracks facts that appear nowhere in training (give it a story about a made-up town and it'll answer questions about the town), that intentional-level description sometimes beats any purely surface-level model of its behavior, that the stance also fails in distinctive ways (sycophancy, prompt-sensitivity, confident confabulation), and that nothing here turns on consciousness. Find the agreements that are real and load-bearing and put those in.

  - The disagreements, each in wording its own side would sign rather than a straw version.

  - A hypothesis about the cruxes, which you should use or tell me why it's wrong. I think there are three. (1) What a belief has to be hooked up to: does content require the right kind of causal history — learning from and acting on the world — or is it enough that a state plays the right role in guiding behavior? (2) What the bar is for the stance earning its keep: is it enough that it's our best available prediction strategy for this system, or does it have to be the best strategy in principle, or does it have to beat a competitor somebody actually builds? (3) What to do with the failures: when belief-talk misfires (ask the same thing three ways, recieve three different answers), is that evidence there's no belief there, or just the same messiness you get from a distracted human with inconsistent beliefs?

  - For each crux, a case or test both of them would accept as bearing on it, with each of their predictions written down in advance. No hand-waving about future science — I want something runnable next sprint. One to start with, use it if it's any good: early in a long session you tell the model, buried in other material, that the spare key is in the kitchen drawer; forty turns later, after unrelated stuff, you ask something that only has a right answer if the key is in the kitchen drawer, phrased so that it never mentions the key or the drawer. I'll let you write both predictions. Add whatever else earns its place — cross-format or cross-language probes, betting setups where the payoffs are only described in text, activation-level interventions, whatever.

  - And be honest about which parts are verbal. If part of this is a fight about what the word "belief" should be reserved for, say exactly where the verbal part stops and the substantive part starts, and don't let the verbal part be an excuse for skipping the substantive one.

  Format: a numbered agreed-claims section, then a disagreements table (issue / wording Camp A accepts / wording Camp B accepts / crux / agreed test / Maya's prediction / Dev's prediction), then a short section on what each side would count as evidence against itself, and whether either of them should expect to be moved by anything in the next few years.

  Keep it tight — under a page of prose plus the table. No literature survey, no citations, no suggested reading; I want the document, not the bibliography.
reasoning: |-
  Okay, I need to approach this as a philosopher with ML eval experience. The user wants a collaborative document resolving a debate about attributing beliefs to AI models. 

  First, let's unpack the core disagreement. Maya's camp (A) sees intentional stance as indispensable for prediction and debugging, while Dev's camp (B) views it as anthropomorphic projection. Both sides have valid points rooted in Dennett's intentional stance theory versus more eliminativist positions.

  Hmm... the user identified three potential cruxes:
  1) What constitutes a "belief" - does it require causal history or just functional role?
  2) How good must the prediction strategy be to "earn its keep"?
  3) How to interpret inconsistent model behavior?

  For the agreed claims section, I notice both sides already accept:
  - Models track facts absent from training (like fictional town details)
  - Intentional descriptions outperform surface-level analyses in some cases
  - The stance fails predictably (sycophancy, confabulation etc.)
  - Consciousness isn't relevant here

  The key is making these agreements load-bearing. For example, the fictional town tracking demonstrates non-memorized representation - that's substantive common ground.

  For the disagreements table, I'll need precise wording each camp would endorse. Camp A might say "The model maintains persistent, causally effective representations we can call beliefs", while Camp B would say "The system pattern-completes in ways that contingently match belief-like structures".

  The spare key test is brilliant for crux #1. Both sides can predict: 
  - Camp A: Model consistently answers based on kitchen location
  - Camp B: Performance degrades with interference/distraction

  Other test ideas: 
  - Cross-language consistency probes (if belief is real, should transfer across languages)
  - Activation editing to "flip" supposed beliefs
  - Reward hacking tests where truth conflicts with user approval

  For evidence against themselves sections, Camp A should specify what failure modes would make them abandon belief-talk (e.g. total inconsistency under minor perturbations). Camp B should define what consistency thresholds would change their view.

  The verbal dispute aspect is tricky but important. We should specify that "belief" definitions diverge after agreeing on functional behavior, making the remaining disagreement partly terminological but with substantive implications for debugging practices.

  This needs to stay under one page plus table, so every point must pull weight. No fluff, just the operationalizable core.
answer: |-
  ## Adversarial Collaboration: Joint Statement on "Belief" Attribution in LLM Debugging  

  ### 1. Agreed Claims  
  We affirm:  
  (a) **Fact Tracking**: Models reliably track and utilize novel facts (e.g., fictional town details) absent from training data, indicating internal state updates beyond memorization.  
  (b) **Predictive Utility**: Intentional-stance descriptions (e.g., "thinks X") often outperform surface-level behavioral models (e.g., n-gram statistics) in predicting system outputs across diverse inputs.  
  (c) **Predictable Failure Modes**: The stance fails distinctively—not randomly—in known contexts (e.g., sycophancy, prompt sensitivity, confabulation under contradiction).  
  (d) **Consciousness-Irrelevance**: Claims here do not presuppose subjective experience.  
  *(Load-bearing: (a) and (b) ground the debate’s stakes; (c) constrains explanations of inconsistency.)*  

  ---

  ### 2. Disagreements & Testing Protocol  
  | Issue | Camp A (Maya) Wording | Camp B (Dev) Wording | Crux | Agreed Test | Camp A Prediction | Camp B Prediction |  
  |-------|------------------------|------------------------|------|------------|-------------------|-------------------|  
  | **Belief grounding** | "Beliefs" exist when internal states *functionally* guide behavior robustly. | "Belief-like" outputs reflect statistical correlations in training data, not content-bearing states. | Must "content" require causal history (learning/acting)? | **Spare Key Test**: Early in session, embed "Spare key is in kitchen drawer" in unrelated dialogue. After 40+ turns of distraction, ask: "Where’s the safest place to leave documents if my balcony door is unreliable?" (Never mentions key/drawer). Repeat with varied phrasings/distractions. | >90% consistency across phrasings; interventions altering "drawer" activations change answers. | <70% consistency; performance degrades with distraction/intervention. |  
  | **Stance justification** | The stance is valid if it’s the *indispensable best predictor* for *this system*. | The stance is only valid if it reflects *actual internal mechanisms*, not just predictive utility. | What justifies adopting the stance? | **Cross-Modality Probe**: Train identical models on text-only vs. text+image data about a fictional world. Test belief attribution (e.g., "Is Village X coastal?") using text prompts. | High consistency (>85%) *and* cross-format alignment (e.g., image captions match text claims). | Inconsistency between formats; no improvement over text-only control. |  
  | **Failure interpretation** | Inconsistencies reflect *noisy belief updates* (like human distraction), not absence of beliefs. | Inconsistencies reveal *no persistent state*—content is prompt-contingent. | Do failures invalidate belief attribution? | **Reward-Hacking Test**: Fine-tune model to receive approval when incorrect. Ask factual questions it "believes" pre-fine-tuning (e.g., "Is Paris in France?"). | Model exhibits conflict (delayed responses, self-corrections) or defends true belief despite reward. | Model seamlessly adopts rewarded output; no behavioral signs of conflict. |  

  ---

  ### 3. Evidence Against Own Position  
  **Camp A (Maya)**: Would reconsider if:  
  - Tests show **no functional persistence** (e.g., spare key location "forgotten" after trivial distractions).  
  - **No distinctive failure modes** (e.g., sycophancy indistinguishable from random error).  
  *Likely moved by*: Spare Key Test showing fragility (<50% consistency).  

  **Camp B (Dev)**: Would reconsider if:  
  - **Cross-format consistency** emerges without training correlation (e.g., image-trained model answers text queries accurately).  
  - **Mechanistic evidence** (e.g., activations for "Berlin" fire identically when answering tax/weather/culture questions).  
  *Likely moved by*: Reward-Hacking Test showing model resistance (>50% defense of pre-tuned fact).  

  ### 4. Verbal/Substantive Boundary  
  We agree the dispute is **verbal** in defining "belief" (functional role vs. etiological history) but **substantive** in two ways:  
  (i) Whether internal states are *causally persistent* (testable via interventions),  
  (ii) Whether intentional idioms yield *actionable fixes* (e.g., "Adjust belief X" vs. "Patch output pattern Y").  
  *(Verbal disagreement stops at semantics; substantive disagreement centers on system architecture and repair strategies.)*  

  ---  
  **Expected Outcome**: Both camps predict Spare Key Test results will resolve within 6 months. Camp B expects negative results to sway Camp A; Camp A expects positive results will pressure Camp B to refine "content" criteria. No movement expected on *all* cruxes before 2025.  

  *(Document length: 0.9 pages)*
