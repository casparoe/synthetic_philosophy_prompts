prompt: |-
  I'm a journalist who covers science and ideas — pandemic preparedness, existential risk, how large funders actually allocate money — so the vocabulary I'm fluent in is empirical: expected value, fat- and thin-tailed distributions, survival curves and hazard rates, base rates, tail risk, hedging and portfolio diversification, cost-effectiveness read on a log scale, and the hits-based logic of funding many long shots. I have no formal philosophy.

  I'd like the case for and against risk-weighted expected utility — the decision rule that applies a reweighting function to cumulative probabilities rather than taking stated chances at face value — restated in that vocabulary as faithfully as you can. Please resist the easy move of translating tail-weighting into simply what any sensible person does with a fat-tailed distribution; that looks to me like smuggling my framework's assumptions in and calling it translation.

  Use as your running example a case I've been turning over for a piece, which I'll call the Martingale Funder's Dilemma: a foundation faces an indefinite run of independent, one-shot funding decisions, each pitting a reliable grant (high probability of a modest, well-measured benefit) against a tail grant (very small probability of changing the scale of the future), and must commit in advance to a single rule it applies to each decision as it arrives, without knowing how many decisions there will be.

  Please answer as exactly five numbered items of one or two sentences each, with no introduction or conclusion, in American English, and commit to a verdict rather than laying out options for me to choose between. No citations or reading lists — I need the structure of the thing, not sources.

  1. State the risk-weighted rule in my terms — the reweighting, the cumulative or survival-function picture, how such a function is calibrated at all — and flag which part of it has no clean empirical counterpart.
  2. Tell me plainly whether the risk parameter describes how the world is, how the agent is, or neither, and what goes wrong for a writer like me if I run those together.
  3. Run the Martingale Funder's Dilemma: does the rule return the same verdict applied decision by decision as applied once to the whole run, and what does the answer cost either way?
  4. Give me the residue report: which of the arguments philosophers treat as decisive against the rule — the dominance violations, the worries about consistency across time, the charge that it is not really a thesis about rationality at all — cannot be expressed in my vocabulary, and say why.
  5. Give the verdict you actually believe: is what's left over a blind spot in how scientists and funders talk about risk, or evidence that the original disagreement is thinner than it looks?
reasoning: |-
  Okay, let me approach this systematically. The user is a science journalist specializing in existential risk and funding allocation, with strong quantitative fluency but no formal philosophy background. They want a crisp analysis of risk-weighted expected utility (RWEU) using their empirical vocabulary, specifically applied to their "Martingale Funder's Dilemma" case study. 

  First, I need to map RWEU's components to their framework: cumulative probabilities correspond to survival curves, reweighting functions act like tail-risk adjustments, but the risk aversion parameter has no direct empirical counterpart. This distinction is crucial because...

  For the Martingale case, sequential independent decisions under indefinite horizon create tension between per-decision tail grants and long-run portfolio effects. RWEU's time-inconsistency here reveals a core philosophical objection - but I must express it through hazard rates and hedging logic, not dominance principles. 

  The residue question is tricky. Some philosophical arguments (e.g. dynamic inconsistency leading to dominated strategies) can be partially reframed as suboptimal hedging across the decision sequence, but concerns about rationality being observer-relative don't translate to their empirical lens. 

  Ultimately, I conclude the disagreement stems from RWEU importing unquantified psychological variables into what should be pure risk management. Their framework's blind spot isn't mathematical - it's allowing undefined "risk attitudes" to override tail probability calibration. The verdict must be unambiguous: in funding contexts, this creates arbitrage opportunities against the foundation's own goals.
answer: |-
  1.  Risk-weighting applies a transformation (e.g., convex for pessimism) to the cumulative distribution function of outcomes, overweighting tail survival probabilities (e.g., disaster scenarios) relative to their baseline frequency. Calibration often uses stated preferences over known gambles, but the *strength* of pessimism itself lacks a direct empirical anchor.
  2.  The risk parameter describes a feature of the agent's psychology (attitude towards uncertainty), not an objective feature of the world (like tail thickness). Confusing them leads to misattributing subjective aversion to an objective increase in tail risk, biasing empirical reporting.
  3.  Applied per-shot, RWEU likely rejects nearly all tail grants due to low immediate probability. Applied once to the entire indefinite sequence (modeled as a portfolio with many independent tail shots), it *could* accept many, exploiting the law of large numbers. The per-shot rule costs significant long-tail portfolio diversification.
  4.  The core objection – that RWEU can violate stochastic dominance (choosing a prospect guaranteed worse than another) – cannot be cleanly expressed; dominance violations imply universally dominated hazard rates, which your framework already rejects as irrational. Other objections (dynamic inconsistency, rationality definition) map less directly.
  5.  The residue reveals a genuine blind spot: RWEU forces explicit quantification of *intrinsic* aversion to uncertainty itself, distinct from tail estimation or portfolio logic, which scientists/funders often leave implicit or conflate with empirical risk assessment.
