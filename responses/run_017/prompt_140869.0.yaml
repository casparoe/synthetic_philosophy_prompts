  **Formal Writeup**

  **Thought Experiment: Medical Diagnosis with an Imperfect Test**

  In a clinical setting, a patient presents with symptoms that give a physician a sharp prior credence of 0.4 that the patient has a particular disease (H). The physician orders a test with uncertain reliability. Based on limited validation studies, the test's sensitivity (probability of a positive test given the disease) is known to be in the interval [0.5, 0.7], and its specificity (probability of a negative test given no disease) is in [0.5, 0.7]. These intervals reflect genuine uncertainty because the test's performance has only been assessed in small or heterogeneous populations. The partition is the binary test outcome: positive (E) or negative (~E).

  The agent's representor is the set of all distributions consistent with the sharp prior and the interval constraints on sensitivity and specificity.

  **Prior and Posteriors:**

  - Prior: P(H) = 0.4 (sharp)

  - For E (positive test):
    P(H|E) = [θ * 0.4] / [θ * 0.4 + (1-φ) * 0.6]
    As shown, the minimum occurs at θ=0.5, φ=0.5: (0.4*0.5)/(0.2 + 0.5*0.6) = 0.2/(0.2+0.3)=0.4
    The maximum at θ=0.7, φ=0.7: (0.4*0.7)/(0.28 + 0.3*0.6) = 0.28/(0.28+0.18)=0.28/0.46≈0.6087
    So P(H|E) ∈ [0.4, 0.6087]

  - For ~E (negative test):
    P(H|~E) = [ (1-θ)*0.4 ] / [ (1-θ)*0.4 + φ*0.6 ]
    Minimum at θ=0.7, φ=0.7: (0.4*0.3)/(0.12 + 0.6*0.7) = 0.12/(0.12+0.42)=0.12/0.54≈0.2222
    Maximum at θ=0.5, φ=0.5: (0.4*0.5)/(0.2 + 0.6*0.5) = 0.2/(0.2+0.3)=0.4
    So P(H|~E) ∈ [0.2222, 0.4]

  In both cases, the posterior set of probabilities for H is a non-degenerate interval that contains the prior (0.4), so dilation occurs.

  **Consistency Check via Law of Total Probability:**

  We must have: P(H) = P(H|E)P(E) + P(H|~E)P(~E)

  But note, P(E) and P(~E) also depend on θ and φ. However, for any fixed (θ,φ) in the ranges, the law holds. For example, take θ=0.6, φ=0.6:

  P(E) = θ*0.4 + (1-φ)*0.6 = 0.6*0.4 + 0.4*0.6 = 0.24+0.24=0.48
  P(H|E) = [0.6*0.4]/0.48 = 0.24/0.48=0.5
  P(H|~E) = [0.4*0.4]/(0.4*0.4 + 0.6*0.6) wait, no:
  P(~E) = 1-0.48=0.52
  P(H|~E) = [P(~E|H)*P(H)]/P(~E) = [ (1-0.6)*0.4 ] / 0.52 = (0.4*0.4)/0.52 = 0.16/0.52≈0.3077
  Then P(H) = P(H|E)P(E) + P(H|~E)P(~E) = 0.5*0.48 + 0.3077*0.52 ≈ 0.24 + 0.16 = 0.4, which checks.

  Similarly, at the boundaries, it will hold by construction.

  **Decision Context to Show Information is Worth Having**

  Now, we show that despite the dilation, learning the test result is valuable. Consider a decision the physician must make before seeing the test result: whether to administer a cheap but mildly harmful preventative treatment. The physician has three options:

  - Option A: Administer the treatment immediately.
  - Option B: Do not administer the treatment.
  - Option C: Wait for the test result and then decide.

  But note: the decision is made before seeing the test result, and we want to compare the value of committing to a choice now versus conditioning on the test result. However, we are to show that conditioning improves the position under Γ-maximin.

  Alternatively, we can consider a simple decision between two actions:

  - Action 1: Administer the treatment.
  - Action 2: Do not administer the treatment.

  The utility depends on whether the patient has the disease (H) or not (~H). The treatment has a cost, but it is beneficial if the disease is present.

  Utilities:
  - If the patient has the disease and is treated: 90 (benefit of treatment - harm)
  - If the patient has the disease and is not treated: 0 (severe outcome)
  - If the patient is healthy and is treated: 50 (harm from unnecessary treatment)
  - If the patient is healthy and not treated: 100 (no harm)

