  Okay, the user is an experienced university teacher in applied ethics looking to design a seminar exercise about ethical decision-making in pest control. They have a specific case involving mosquitoes in a wetland with three intervention options. The constraints are clear: no pre-reading, avoid jargon, include specific devices (sealed envelope, ecological rebound), and ensure real consequences. 

  First, I need to identify the core philosophical moves. The exercise should force students to confront moral uncertainty (via the sealed envelope), the replaceability paradox (population rebound), and the tension between visible action and long-term consequences. The devices must work mechanically without facilitator explanation. 

  The user’s class has diverse stakeholders: a beekeeper, a vegan, and an engineer. Roles should leverage these perspectives while ensuring no one dominates. Private objectives are key—some roles must focus on quantifiable data, others on public perception. The sealed envelope must feel consequential, so timing its reveal after the vote is crucial. 

  Materials: Role cards with hidden incentives (£20 budget is ample for props). The "Population Modeller" role can only state quantities, forcing others to interpret data. The "Public Health Officer" needs visible action, creating tension with slower options. 

  Timeline: 10 mins for role prep, 35 for debate, 10 for vote+reveal, 35 for debrief. The reveal must disrupt assumptions—e.g., if insects can’t suffer, was larvicide needlessly cautious? 

  Predictable issues: The engineer might dismiss uncertainty; rehearse the modeller’s scripted lines. The vegan might grandstand; assign them a role valuing public trust over ethics. Groups may rush to consensus; impose silent reflection before voting. 

  Debrief should connect moments to concepts: e.g., "When X argued for cost, they implicitly weighed efficiency against uncertainty." The irreproducible element is the non-identity problem (larvicide prevents existence vs. killing); this must be explained post-exercise. 

  Consequence: Losing side drafts a press release defending the winning policy—public accountability stings more than abstract debate. 

  British English check: "Whilst," "prioritise," "defences" all fit. No jargon like "sentience" until debrief. 

  Final design should leave students unsettled—e.g., realising aerial spraying "saves" insects via replacement deaths. That’s corridor-worthy.
answer: |-
  ### **Seminar Design: "Wetland Dilemma"**  
  *(90-minute role-play: District Pest-Control Board Meeting)*  

  ---

  ### **Brainstorm: Core Philosophical Moves**  
  1. **Moral Uncertainty**: Forcing decisions without knowing if mosquitoes can suffer (via sealed envelope), exposing how we act under ignorance.  
  2. **Replaceability vs. Harm**: Population rebound challenges whether killing matters if deaths are "replaced," probing if prevention (larvicide) is distinct from killing (adulticide).  
  3. **Visibility & Accountability**: Contrasting slow, ethical solutions with politically expedient "visible action," testing whether optics trump ethics.  

  ---

  ### **Materials & Setup**  
  - **Props**:  
    - Sealed envelope labelled **"CONFIDENTIAL: Insect Sentience Study Findings"** (contents: *"Study concludes: 83% probability of nociception but inconclusive evidence for suffering"*).  
    - Whiteboard columns: **Option A (Adulticide) / B (Larvicide) / C (Sterile Males)**.  
    - Role cards (16, see below).  
    - £5 budget: Mosquito plush toy (for "Chair" to hold during speeches), cheap alarm clock.  

  - **Room Layout**:  
    - Chairs in a semicircle facing whiteboard.  
    - "Chair" sits centrally with mosquito toy; others get role cards.  

  ---

  ### **Roles & Private Objectives**  
  *(Assign secretly; italicised text is hidden on card)*  
  1. **Chair (Local Councillor)**: *Must appear impartial but needs re-election. Gain 1 point if vote is unanimous.*  
  2. **Public Health Officer**: *Must prioritise immediate risk reduction. Lose 2 points if Option C wins.*  
  3. **Environmental Agency Rep**: *Legally cannot endorse "indiscriminate killing." Must mention "ecosystem balance."*  
  4. **Treasurer**: *Can only cite costs (£): A=20k, B=45k/year, C=120k. Forbidden from saying "worth it."*  
  5. **Wildlife Trust Biologist**: *Secretly knows population rebounds in 4 weeks. Must say "carrying capacity" if asked.*  
  6. **Engineering Student (as Infrastructure Manager)**: *Wants "decisive action." Gains 3 points if A wins.*  
  7. **Vegan (as Ethics Consultant)**: *Must argue all life has value. Lose 1 point per vote for A.*  
  8. **Beekeeper (as Local Farmer)**: *Worries pesticides harm bees. Gains 2 points if B or C wins.*  
  9. **8x Generic "Resident" Roles**: *Mixed objectives (e.g., "Fear mosquitoes: +1 if A wins," "Taxpayer: +1 if C loses").*  

  ---

  ### **Timeline (90 mins)**  
  **00:00–00:10**  
  - Distribute roles. Participants read cards silently. Chair opens meeting: *"We must reach a decision in 35 minutes."*  

  **00:10–00:45**  
  - **Debate Phase**:  
    - Chair invites 60-second statements from each role.  
    - Treasurer *only* allowed quantitative statements (costs, insect counts).  
    - Biologist must confirm rebound if questioned: *"The wetland repopulates in weeks."*  
    - Alarm rings at **00:40**: *"5 minutes to vote."*  

  **00:45–00:55**  
  - **Vote & Reveal**:  
    - Secret ballot (A/B/C). Tally on whiteboard.  
    - Chair opens sealed envelope, reads aloud: *"Science cannot confirm if mosquitoes suffer."*  
    - Announce real consequence: **Losing side writes next week’s 300-word press release defending the winning policy.**  

  **00:55–01:30**  
  - **Debrief**:  
    - *"When did uncertainty change your arguments?"* (→ Moral precaution).  
    - *"Did ‘rebound’ make Option A seem less harmful? Why?"* (→ Replaceability).  
    - *"Who was pressured to prioritise visibility over ethics?"* (→ Political constraints).  
    - Term mapping: *"What we called ‘killing vs. preventing’ is the ‘act-omission asymmetry’..."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Engineer/vegan dominates debate.  
     **Fix**: Chair enforces strict speaking order; use plush toy as "talking stick."  

  2. **Problem**: Groups ignore uncertainty/rebound.  
     **Fix**: Secretly prompt Biologist via note: *"Remind them about population rebound."*  

  3. **Problem**: Hasty consensus before vote.  
     **Fix**: Alarm clock cues silent reflection: *"Write one risk of your preferred option."*  

  ---

  ### **Irreproducible Element for Debrief**  
  The exercise **cannot** simulate the **non-identity problem** (larvicide prevents future insects who "never exist"). Must clarify: *"Is preventing life ethically neutral? Does it differ from killing?"*  

  ---

  ### **Why This Works**  
  - **Mechanics drive philosophy**: Uncertainty/replaceability emerge organically.  
  - **Consequence bites**: Defending a "winning" policy they opposed forces epistemic humility.  
  - **Corridor fuel**: "Would you spray if you *knew* they suffered?", "Was the Treasurer complicit?"  

  **Final Tip**: Start cold—no framing. The chaos *is* the point. When the envelope opens, lean into the silence: *"So. Was that information useful... now?"*  

  ---  
  *Design grounded in 12 years of watching undergrads discover ethics through simulated messiness. Tea and biscuits advised for recovery.*
