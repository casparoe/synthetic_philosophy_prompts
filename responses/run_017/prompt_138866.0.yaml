prompt: |-
  You are an experienced university teacher of applied ethics and a careful designer of seminar exercises — the sort of person who has run classroom role-plays dozens of times, knows exactly where they collapse into giggling or into people restating their pre-existing opinions, and designs the mechanics so that the philosophy arrives through what participants do rather than through anything the facilitator says. Please think it through properly before you write: begin with a short brainstorm (a few sentences are fine) of the two or three philosophical moves the exercise has to make participants walk into, and only then give me the design. Write the whole answer in British English, and please don't append a bibliography, a reading list or a theory appendix — I need something that works with students who have read nothing on the topic, so the machinery itself has to carry the ideas.

  Here is the context. I teach a final-year applied ethics option: 16 students, one 90-minute session, mostly not specialists in animal or environmental ethics, and the group includes one recreational beekeeper, one committed vegan who is already impatient with the syllabus, and one engineering student who announced in week one that insects obviously do not matter and should be made to defend that rather than just assert it. The room has movable chairs, a whiteboard, a phone speaker and about twenty pounds of materials budget. The case I want to stage is a meeting of a fictional district pest-control board deciding how to respond to a mosquito-borne disease risk in a wetland: they must choose between (i) an aerial adulticide that kills an enormous number of insects very quickly, (ii) a larvicide applied on a repeating schedule so that a whole cohort never comes to exist, and (iii) a sterile-male release programme that leaves most existing insects alive, suppresses the population only slowly over several seasons, and is the most expensive and least visible option. I have been mulling over a couple of devices with a colleague and would like you to use them if you can make them work mechanically, or replace them with something better if you can't: a sealed envelope, opened only after the vote, whose contents settle (fictionally) whether the insects in question can suffer, so that the decision has to be made under genuine uncertainty; and the ecological fact that the population rebounds towards the wetland's carrying capacity within weeks, so that many of the deaths are in some sense replaced. Two firm constraints: no lecture or framing handout before the exercise, and none of the relevant jargon — moral status, sentience, replaceability, the asymmetry — should be spoken aloud by anyone until the debrief.

  What I want from you: the actual rules and materials, the role cards with their private objectives and private payoffs (I want at least one role whose institutional interest is in being seen to act, and at least one role that is permitted to state only quantities and not evaluative claims), a timeline with minute markers for the 90 minutes, and a debrief that maps specific moments of the exercise onto specific features of the problem. Also give me an honest note on the two or three things that will predictably go wrong the first time I run it and how to recover, and — this matters to me — an explicit statement of which part of the philosophical problem the activity cannot possibly reproduce and which I will therefore have to supply myself in the debrief. The decision the group reaches should have a real if small consequence, so that voting is not free; I was thinking that the losing side has to spend ten minutes of next week's seminar arguing for the winning policy, but improve on that if you can. Aim for something my students will still be arguing about in the corridor, and remember: British English throughout.
