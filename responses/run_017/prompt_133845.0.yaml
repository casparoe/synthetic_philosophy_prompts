answer: |-
  Ah, my substantivalist friend, you construct an ingenious thought experiment, but it rests upon a fundamental misunderstanding of relational mechanics. In your sparse universe, the rigid world-shell *is* the entire fixed frame against which inertial effects manifest—it defines "the heavens" for this cosmos. At stage one, when the shell rotates while the water remains stationary relative to the shell's center, the water experiences *no acceleration relative to the dominant mass distribution* (the shell itself). Therefore, no centrifugal forces act upon it; its surface remains flat. At stage two, when the water co-rotates rigidly with the shell, it *is* accelerating—maintaining a curved path relative to the fixed orientation defined by the shell's own structure. This acceleration relative to the universe's total matter *is* detectable: the water climbs the walls. You conflate mere relative motion (stage one, where water and shell move uniformly past each other) with acceleration relative to the global mass frame (stage two, where water accelerates centripetally to maintain circular motion within the shell's rotating frame). Concavity manifests only under the latter condition.  

  Summary: The rigid world-shell defines the absolute inertial frame for this universe, so concavity arises only when water accelerates relative to its mass distribution, not from simple relative rotation in stage one nor from co-rotation in stage two.
