prompt: |-
  Hi — I'm a retired experimental physicist (spent most of my career on low-temperature noise measurements, not that its relevant), and since retiring I've been sitting in on a philosophy reading group at the local university. We did two sessions on time recently and I came away frustrated in a way I can't quite put my finger on, and I'd like you to help me turn the frustration into an actual argument.

  Here's the thing. Every time the presentist gets going, the eternalist shuts it down with the relativity of simultaneity: no absolute simultaneity, so a global present would be extra structure that physics doesn't want, end of story. But then when the eternalist describes the block universe she actually believes in, it isn't the bare four-dimensional manifold at all — it's a manifold with a very special boundary condition at one end (the low-entropy early state, the thing people call the past hypothesis) and, in the universe we in fact live in, a roughly preferred cosmic time you can read off the matter distribution and the CMB frame. That's contingent, material structure doing exactly the kind of selecting that the presentist was told was illegitimate. So here is the position I want defended: the relativity objection only rules out a present built into the geometry or the laws, and the presentist should simply stop wanting that, and claim instead that what is metaphysically special about the present is supplied by the actual contingent thermodynamic structure of the universe — the entropy gradient, and the asymmetry in counterfactual and causal dependence that comes with it. Call it 'contingent presentism' or 'material presentism' or whatever name you prefer. Argue that this is the strongest form presentism can take, that it survives the relativity argument, and — this is the part I care about most — that it is in a better position than eternalism to say why the block has the shape it has (why there is an arrow at all), instead of just taking the low-entropy boundary condition as brute.

  Take the role of a professional philosopher of physics and take it seriously: before you start writing, sketch out the strongest case you can against the position, and only then commit to the version of the argument that survives it. Please don't give me a survey of the dialectic or a balanced overview, and please don't tell me who to read — I've got no library access out here — I want one argument, developed. Two objections I want answered explicitly, and answered in their strongest form: (1) a distinguished family of hypersurfaces is not a present — it doesn't single out a unique now and it gives you no passage, so you've changed the subject; (2) the entropy gradient is a global feature of the whole block (and in a recollapsing model, or in a model where the arrow reverses around maximum expansion, it doesn't even fix a single direction in the way you need), so you haven't really got anything the eternalist can't simply add on as a boundary condition, and your 'presentism' is eternalism plus a hat. Where your argument needs a premise you yourself find shaky, say so in a sentence rather than papering over it. And finish with one last line, the only thing on that line, in this form: \answer{one sentence, thirty words maximum, stating the thesis you've argued for}.
