  ### National Responsibility Decision Tree  
  *Use this to diagnose your position on holding a nation responsible for war. Start at the top, follow the paths, and land on a leaf that matches your view. Each leaf reveals your core commitments and tells you how your view shapes arguments. Based on WWI (1914) but tested against modern cases.*  

  #### **Start Here**  
  **1. When asking "could they have done otherwise?", do you use only what was knowable in 1914?**  
  - **Yes → Go to Q2**  
  - **No (use hindsight) → Go to Q2**  
  *(Your choice here silently shapes blameworthiness. Hindsight makes risks seem obvious; 1914 knowledge makes them ambiguous.)*  

  **2. In 1914, did a state’s specific action (e.g., Germany’s "blank cheque" to Austria) make war more likely than inaction?**  
  - **Yes → Go to Q3**  
  - **No → Go to Q8**  
  *(Tests causal contribution. "More likely" = foreseeable risk at the time, per your Q1 answer.)*  

  **3. Was that action morally wrong given the options realistically available to leaders then?**  
  - **Yes → Go to Q4**  
  - **No (e.g., they acted reasonably) → Go to Q6**  
  *(Moral blameworthiness hinges on context. "Morally wrong" = violated norms of prudence/justice.)*  

  **4. Should the state pay reparations for war damages?**  
  - **Yes → Go to Q5**  
  - **No → Go to Q7**  
  *(Liability to pay. Reparations = financial compensation, e.g., 1919 Versailles.)*  

  **5. Must the state’s head of state apologize officially?**  
  - **Yes → Go to Q9**  
  - **No → Leaf: ✦ **Blame-the-elite****  
      - *Commits to:* Blaming leaders but not ordinary people.  
      - *Tell:* Annoyed when people say "the nation wanted war."  
  *(Forces separation: elites can be blameworthy but not liable to apologize.)*  

  **6. Should the state pay reparations even if not blameworthy?**  
  - **Yes → Leaf: ✦ **Successor-state-pays-but-isn't-blamed****  
      - *Commits to:* Paying for historical debts without moral guilt (e.g., modern Germany paying for WWI).  
      - *Tell:* Insists "payment isn’t an admission of fault."  
  - **No → Go to Q8**  
  *(Mixed position: liability without blameworthiness.)*  

  **7. Can ordinary citizens in 1914 feel pride/shame about their nation’s role?**  
  - **Yes → Leaf: ✦ **Blame-the-population****  
      - *Commits to:* Collective guilt (e.g., Germans should feel shame).  
      - *Tell:* Dismisses "people were ignorant" as an excuse.  
  - **No → Go to Q9**  

  **8. Were structural forces (alliances, militarism) the primary cause, with states having little real choice?**  
  - **Yes → Leaf: ✦ **Structural/systemic****  
      - *Commits to:* No moral agents—war was inevitable.  
      - *Tell:* Calls "blaming states" naive historical analysis.  
  - **No → Leaf: ✦ **Shared responsibility****  
      - *Commits to:* All great powers share blame (e.g., Clark’s "sleepwalkers").  
      - *Tell:* Frustrated by "single villain" narratives.  

  **9. In a modern drone strike killing civilians, must the government (not just individuals) explain its authorization process?**  
  - **Yes → Leaf: ✦ **German-primacy (Fischer-ish)****  
      - *Commits to:* Germany was uniquely blameworthy in 1914.  
      - *Tell:* Attacks "all sides" arguments as false equivalence.  
  - **No → Leaf: ✦ **Only-individuals-can-be-blamed****  
      - *Commits to:* Nations can’t be moral agents—only people can.  
      - *Tell:* Rejects "Germany" as shorthand for leaders.  

  **10. Should a university pay reparations for accepting slavery-era donations (e.g., 18th-century benefactor)?**  
  - **Yes → Leaf: ✦ **Forward-looking "blame as tool"****  
      - *Commits to:* Assigning responsibility to prevent future harm (e.g., "blame Germany to deter aggression").  
      - *Tell:* Asks "what does this *do*?" not "what’s true?"  
  - **No → Leaf: ✦ **Nobody actually holds this****  
      - *Commits to:* "Answerability" (owing an explanation) without causal role or blame.  
      - *Tell:* Unattractive—why explain if you did nothing wrong?  

  ---

  ### **Key Insights from the Tree**  
  - **Conflation Unpacked:** The tree forces distinctions:  
    - **Causal contribution** (Q2) ≠ **Moral blameworthiness** (Q3) ≠ **Liability to pay** (Q4/Q6) ≠ **Answerability** (Q5/Q9).  
    - Mixed combos exist: e.g., **Successor-state-pays-but-isn't-blamed** (pays without blame) or **Forward-looking** (assigns blame for practical ends).  
  - **Pet Distinction:** Q1 (hindsight vs. 1914 knowledge) is near the top—it quietly determines 40% of disagreements.  
  - **Non-1914 Cases:** Q9 (drone strikes) and Q10 (university donations) reveal if your view is consistent across eras or WWI-specific.  
  - **Unseparated Leaves:** Two pairs can’t be split by this tree:  
    1. **Blame-the-elite** vs. **German-primacy** (both blame leaders). *Extra question:* "Was Germany’s role *quantitatively* worse than others’?"  
    2. **Structural/systemic** vs. **Shared responsibility** (both distribute blame). *Extra question:* "Did human choices *change outcomes*, or just enact inevitabilities?"  
  - **Diagnostic Power:** Two people saying "Germany was mainly to blame" may land on different leaves (e.g., **German-primacy** vs. **Blame-the-elite**). Those saying "nobody was" could be in **Structural/systemic**, **Only-individuals**, or **Forward-looking**.  

