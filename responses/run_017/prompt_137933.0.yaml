  - **Forward-looking (blame as tool):** If you support reparations or apologies for reasons of reconciliation or deterrence, even without moral blame, you might be here. This can be from step 6.  
    - Leaf: **Forward-looking**  
      - Awkward: You might support blaming the innocent if it serves a greater good.  
      - Tell: Asks "what purpose does this assignment serve?" in every debate.

  - **Nobody actually holds this:** Imagine a position where a state that did not cause the war and is not blameworthy must pay reparations and apologize. This is step 2: No causal role, step 3: Not blameworthy, step 5: Yes to reparations, step 6: Yes to explain. This is very awkward.  
    - Leaf: **Strict liability without causation or fault**  
      - Marked: "Nobody actually holds this"  
      - Tell: If someone ends here, they are either confused or have a very unique theory.

  **Non-1914 Cases Integration:**  
  The tree doesn't explicitly include the non-1914 cases in the branching, but you can use them as consistency checks:  
  - If you blame the state in 1914, do you also blame the government in the drone strike case?  
  - If you think the university should pay for slavery-era donations without blame, does that match your WWI reparations view?  

  **Pairs of Leaves the Tree Can't Separate:**  
  - The tree might not cleanly separate **Blame-the-elite** from **German-primacy** if German-primacy is just a subset. We can add a question: "Was Germany more to blame than other states?" If yes, then German-primacy; if no, then blame-the-elite might be part of shared responsibility.  

  - **Shared responsibility** and **Structural/systemic** might overlap. The key difference is agency: in shared responsibility, states are agents; in structural, they are not. We have step 7 to ask about structural factors.

  **End of Tree:**  
  By answering the questions, you can identify your position. Use this to see if you and others who say "Germany was to blame" or "no one was" are in the same leaf or not.

