  For the public comment, I'm thinking of including someone worried about local water usage, which the office would dutifully analyze through the s-risk lens - perhaps noting that water-cooled servers are more energy efficient, thereby paradoxically increasing computational capacity per resource unit and thus potential suffering risk.

