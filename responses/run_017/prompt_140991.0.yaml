answer: |-
  ### Revised Device and Activity Plan  
  **Choice:** I'm using your device with two adjustments: (1) Tweaking the budget/rung parameters to ensure the arithmetic squeeze works, and (2) integrating the sub-scores as a debrief discussion (not an activity) to avoid overcomplicating the session. The planted systems and cliff licenses are central and stay. *Why?* Your core device brilliantly forces confrontation with gradations and boundary problems. The sub-scores, while valuable, would fragment focus in the limited time; they’ll shine in the debrief. Real monetary stakes are a trap—distracting and ethically fraught—so I’ve replaced them with symbolic stakes.

  ---

  ### Rules for Students (Handout or Verbal Instructions)  
  **Goal:** Build a "Ladder of Concern" with your table. Assign moral concern to 12 systems using poker chips. Defend your choices to another table.  
  **Materials per Table:**  
  - 14 blank index cards (12 for your ladder + 2 surprises)  
  - 210 poker chips (your "total concern" budget)  
  - 2 cliff license cards  
  - Marker, masking tape, die  

  **Rules:**  
  1. **Build Your Ladder (15 min):**  
     - Tape 12 cards in a vertical ladder on your table.  
     - Bottom: A system **everyone agrees has nothing going on inside** (e.g., a rock).  
     - Top: An adult human.  
     - Middle: 10 other systems (e.g., ant, dog, AI, tree, alien). Order them from least to most concern.  

  2. **Assign Chips (10 min):**  
     - Distribute all 210 chips across the 12 systems. Every chip must be placed.  
     - **Adjacent Rule:** The chip difference between two neighboring rungs **cannot exceed 3 chips**...  
     - **...Unless you use a cliff license:** Place it between two rungs and write **one sentence** stating the property that appears at that boundary (e.g., "This system feels pain"). Max 2 licenses.  

  3. **Insert Surprise Systems (5 min):**  
     - You’ll get two new systems. Slot them into your ladder. You may adjust chips/licenses if needed, but follow the rules above.  

  4. **Defend a Boundary (20 min):**  
     - Roll a die to pick a random adjacent pair in your ladder.  
     - Pair with another table. Defend your chip difference for that pair.  
     - **Challenge:** If they used a cliff license, argue that the property on it *also appears elsewhere* or *fails here*. If successful, take their license.  

  ---

  ### Setup Sequence & Minute-by-Minute Timeline  
  **Total Time:** 80 minutes  
  **Facilitator Supplies:** Index cards, poker chips (210 per table), markers, tape, dice, 2 pre-printed cards for surprise systems per table.  

  #### **Phase 1: Setup (0:00–0:05)**  
  - **Facilitator Actions:**  
    - Move chairs into 4 tables of four. Distribute bags of materials to each table.  
    - *Say only:* "In your groups, you’ll build a ladder of systems. Bottom: something with nothing inside. Top: a human. Order the rest by how much they *matter*. Then assign poker chips—your total concern budget. Rules are on the handout."  
    - **Do NOT:** Say "moral status," "sentience," or "continuum."  

  #### **Phase 2: Ladder Construction (0:05–0:20)**  
  - **Facilitator Actions:**  
    - Circulate silently. If asked: "Pick systems where you disagree—like an insect, AI, or robot."  
    - **Watch for:** Tables putting humans at the top and inert objects (e.g., a stapler) at the bottom. Intervene only if they violate the bottom/top rule.  
  - **Student Task:**  
    - Tape 12 cards in order. No chips yet.  

  #### **Phase 3: Chip Allocation (0:20–0:30)**  
  - **Facilitator Actions:**  
    - *Say:* "Assign all 210 chips. Difference between neighbors ≤3 chips unless you use a cliff license—write one property on it."  
    - **Crucial:** Check tables using the squeeze math (budget=210, cap=3, 12 rungs). If bottom=0, max total without cliffs is 198—they *must* use a cliff or raise the bottom. Nudge stuck groups: "Can you add chips somewhere?"  
  - **Student Task:**  
    - Place chips, deploy cliff licenses if needed.  

  #### **Phase 4: Insert Surprise Systems (0:30–0:35)**  
  - **Facilitator Actions:**  
    - Hand each table two pre-printed cards:  
      - **System A:** "A system that says, ‘Don’t turn me off!’ in fluent, varied language tracking your conversation. Internally, it’s a text-prediction table."  
      - **System B:** "A system that models its own survival (being ‘off’ is bad) but never expresses distress."  
    - *Say:* "Add these to your ladder. Adjust chips/licenses if you want—but follow the rules."  
  - **Student Task:**  
    - Slot in System A (chatty AI) and System B (silent optimizer). Discuss placement and chip changes.  

  #### **Phase 5: Defense & Challenge (0:35–0:55)**  
  - **Facilitator Actions:**  
    - *Say:* "Roll a die to pick a random adjacent pair in your ladder. Pair with another table (Table 1 with 2, 3 with 4). Defend your chip difference for that pair. If there’s a cliff license, challenge it by finding where the property fails or appears elsewhere. If you win, take the license."  
    - Circulate. Push groups to engage: "Why *this* difference? What property justifies it?"  
  - **Student Task:**  
    - Defend boundaries (e.g., "We gave 3 more chips to the dog than the bee because it feels pain"). Challenge cliffs (e.g., "You said ‘feels pain’ starts at dogs—but crabs also avoid damage!").  

  #### **Phase 6: Symbolic Stakes (0:55–1:00)**  
  - **Facilitator Actions:**  
    - *Say:* "Your tables’ total chips for [System A] and [System B] decide where we *hypothetically* donate $20. Animal charity vs. AI ethics fund. We’ll tally and announce at the end."  
    - **Why not real money?** Avoids objections about flippancy. If someone protests: "This is a thought experiment—no real money is involved. We’ll discuss the implications after."  

  #### **Phase 7: Debrief (1:00–1:20)**  
  - **Facilitator Actions:**  
    - **Do NOT** start with jargon. Use student experiences to draw out philosophy.  
    - **Step 1: The Squeeze (5 min)**  
      - *Ask:* "Which tables had to put chips on the bottom system? Why?"  
      - *Reveal:* "This is the **continuum problem**. If differences are small, denying concern to the bottom pulls you toward cliffs—but cliffs need properties."  
    - **Step 2: Cliffs and Challenges (5 min)**  
      - *Ask:* "Which cliff licenses got challenged? Did the properties hold up?"  
      - *Reveal:* "This is the **boundary problem**. Properties (e.g., ‘feels pain’) appear in degrees or in unexpected places. Lines blur."  
    - **Step 3: Surprise Systems (5 min)**  
      - *Ask:* "Where did you put System A (talkative AI) vs. System B (silent optimizer)? Did chips change?"  
      - *Reveal:* "You used **two criteria**: behavior (A) and internals (B). When they conflict, rankings break. This shows criteria can pull apart."  
    - **Step 4: The Three Takeaways (5 min)**  
      - *Name the moves:*  
        1. **Gradations are real/small**: The chip differences forced tiny steps.  
        2. **Thresholds need properties**: Cliffs require a justifying trait—but none are air-tight.  
        3. **Concern decomposes**: Ask: "What factors influenced your chips? Likelihood of inner life? Capacity for suffering? Duration? These can vary independently." *(Here, introduce sub-scores as a debrief concept, not an activity.)*  

  ---

  ### What Will Go Wrong (and How to Handle It)  
  1. **"Moral concern isn’t finite!"**  
     - *Response:* "This is a model to explore *relative* concern. If it’s infinite, why prioritize humans over rocks?"  

  2. **Arguing about science (e.g., neuron counts)**  
     - *Response:* "Stick to the rules—use properties you can write on a license. We’ll discuss science in the debrief."  

  3. **Table copies neighbors**  
     - *Prevention:* Circulate early. Ask: "What’s your most controversial rung?"  

  4. **"This is flippant! I care about [animal/robot] rights!"**  
     - *Response:* "This exercise *tests* those intuitions. Where would you place your system? Defend it in the challenge round."  

  5. **Group avoids cliffs, assigns bottom=0, ignores math**  
     - *Intervention:* Point out: "Your total is 198, but you have 210 chips. Where do the extras go?"  

  ---

  ### What the Activity Can’t Do (and How You Fill the Gaps)  
  - **Cannot reproduce:**  
    - **Metaphysical vs. epistemic uncertainty**: The activity blurs whether boundaries are vague (no fact) or hidden (unknowable fact). *You supply this:* In debrief, ask: "When you disagreed, was it about hidden facts (e.g., ‘Do bees feel?’) or fuzzy categories (e.g., ‘Is "feeling" binary?’)?"  
    - **Non-scalar accounts**: The activity assumes scalar concern. *You supply this:* Contrast with Kantian (rationality = binary status) or theological (soul = binary) views during debrief.  
  - **Underemphasized:**  
    - **The "nothing at all" intuition**: Students may still feel the bottom system deserves zero. *Highlight:* "If you *did* assign zero, how did you avoid cliffs? What property let you jump?"  

  ---

  ### Why This Works  
  Your device forces the continuum to feel inevitable through **procedural tension** (the chip budget), **tactile engagement** (moving chips/licenses), and **peer pressure** (defending boundaries). Students "discover" the problems themselves—making the gradational picture default. The debrief then crystallizes their experiences into philosophical insights.
