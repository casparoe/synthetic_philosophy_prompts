answer: |-
  ## The Battery Test: Why PAP Fails and Why Its Fall Matters

  The Principle of Alternative Possibilities (PAP) – that an agent is morally responsible only if they could have done otherwise – stands as a pillar of intuitive free will. Frankfurt-style cases (FSCs) are designed to topple it by presenting scenarios where an agent lacks alternatives yet seems intuitively blameworthy. Critics, however, argue FSCs beg the question by assuming responsibility without alternatives or rely on vanishingly small "flickers" of freedom. Enter the Dud Device variant. This paired thought experiment, isolating the presence/absence of alternatives via an unknown dead battery, serves not as a footnote but as the decisive test. It reveals PAP’s irrelevance and forces us to confront the uncomfortable but necessary role of causal luck in responsibility. PAP fails, and FSCs, particularly the Dud variant, are what show it.

  **The Dud Device's Decisive Cut:**
  Consider the paired scenarios:
  1.  **Standard FSC:** Jones deliberates and autonomously decides to shoot Smith for his own reasons. Unbeknownst to Jones, Black monitors him with a reliable device ready to force the decision to shoot if Jones shows any sign of refraining. Jones shoots, Black doesn't intervene. PAP violated? Yes (Jones couldn't have refrained). Blameworthy? Intuitively, yes.
  2.  **Dud Device FSC:** Identical to Standard: Jones deliberates identically, decides identically for the same reasons, shoots Smith. Black, identically ready and believing his device works, monitors. Crucially, unbeknownst to *anyone* (Jones, Black, us the evaluators), the device has a dead battery. If Jones *had* started to decide otherwise, the intervention would have silently failed, and Jones *could* have refrained. PAP holds? Yes (Jones *could* have refrained, though no one knew it). Blameworthy? **Identically to the Standard case.**

  The *only* difference is the state of the battery – an extrinsic fact utterly inaccessible to Jones, irrelevant to his deliberation, his reasons, his intentions, or the actual causal sequence producing his action. Nothing fires in either world; the actual sequences are phenomenologically and causally identical from Jones's perspective and all observable evidence.

  **Why the Dud Device Sinks PAP:**
  If blameworthiness differs between the Dud and Standard cases, the PAP defender must explain *why*. Why does the mere counterfactual possibility of refraining (due to a dead battery Jones never knew about and which played no role) excuse him in the Dud case? The PAP defender faces an impossible dilemma:
  *   **Option 1: Blameworthiness Differs (Dud less blameworthy).** This implies Jones is *less* blameworthy solely because of the dead battery – a factor entirely outside his control, knowledge, or influence. This makes blameworthiness hostage to sheer luck (the battery state) and severs it from Jones's actual reasons, deliberation, and choice. This is an intolerable cost, reducing moral responsibility to a matter of external, unknown contingency rather than the agent's actual psychology and causal efficacy. Why should an accident of physics partially exonerate Jones when his conscious, reasons-responsive process leading to murder is identical?
  *   **Option 2: Blameworthiness is Identical.** This is the compelling option. Jones is equally blameworthy in both cases because what matters for responsibility is the *actual causal history* of the action – the reasons for which he *actually* deliberated and acted. The presence or absence of the *unexercised, unknown* capacity to do otherwise (guaranteed by the battery or blocked by Black's device) is irrelevant. Jones's action in both cases issues from his own reasons-responsive mechanism; the alternate possibility in the Dud case is a causally inert phantom. PAP is shown to be unnecessary.

  **Handling the Replies:**
  *   **Flicker-of-Freedom:** Critics argue that even in Standard FSCs, agents retain some inconsequential alternatives (e.g., *beginning* to deliberate otherwise, triggering intervention). The Dud Device demolishes this. In the Dud case, the alternative possibility (refraining) is *robust* – Jones *could* have successfully refrained if he had chosen to. Yet, this robust alternative makes *no difference* to his blameworthiness compared to the Standard case where it is robustly blocked. If the robust alternative in the Dud case doesn't increase blame or mitigate it, its mere presence is irrelevant. The flicker defence, even if conceded in Standard FSCs, cannot explain the Dud-Standard equivalence. Responsibility hinges on the actual sequence, not the presence of alternatives, robust or flickery.
  *   **Dilemma Defence (Leeway vs. Source Incompatibilism):** This argues FSCs pose a dilemma: if determinism is true, the agent *never* had alternatives, making the intervener redundant; if indeterminism is true, the intervener cannot guarantee the action without also preventing responsibility. The Dud Device bypasses this. It doesn't assume determinism or indeterminism globally. It simply asks us to compare two scenarios differing *only* in an extrinsic factor (battery state) that controls the presence/absence of alternatives *in that specific situation*. The agent's blameworthiness remains constant. This shows that responsibility is determined by the agent's actual reasons and choices *within* their causal context, not by the abstract metaphysical possibility of doing otherwise *simpliciter*. The dilemma defence fails to engage with the Dud Device's specific, isolated test of PAP's relevance.

  **Moral Luck: The Necessary Cost**
  The Dud Device forces us to acknowledge a form of resultant moral luck. Jones's blameworthiness *does* turn on the battery state – a fact utterly outside his control and ken. In the Standard case (working battery), he *couldn't* have done otherwise; in the Dud case, he *could have* (though he didn't). This difference in alternatives, fixed by luck, doesn't change his blame. **So yes, the Dud Device shows that whether an agent *could* have done otherwise is itself partly a matter of luck.** This is a consequence of rejecting PAP.

  Is this a cost? Absolutely. It means the scope of our abilities (what we *can* do) is subject to factors beyond our control. However, it is **not a fatal cost**, but rather a reflection of our embeddedness in the world. Responsibility isn't about being the ultimate, uncaused cause of *everything* about our situation (including what alternatives we have). It's about being the *source* or *actual cause* of our actions *within* that situation. Jones, in both cases, is the source of his action via his reasons-responsive deliberation. The luck concerning the battery affects the *metaphysical landscape* (what possibilities are open), not the *moral quality* of the actual choice he made. We rightly hold agents responsible for what they *actually* do and why they do it, even when the range of possibilities they faced was shaped by luck. Denying this leads to the absurdity that identical, malicious choices deserve different blame based on unknown external contingencies like a dead battery. The cost of accepting resultant luck concerning capacities is far less than the cost of denying responsibility in clear cases of agential control like Jones's.

  **Conclusion:**
  The Dud Device variant crystallizes the Frankfurtian challenge. By isolating the presence/absence of alternatives via an unknown extrinsic factor (the battery) while holding everything about the agent's actual psychology and action constant, it demonstrates conclusively that PAP is false. Jones is blameworthy in both cases because responsibility depends on the actual causal sequence originating in the agent's reasons-responsive mechanism, not on the existence of unexercised alternatives. Flicker and dilemma defences crumble against this precise test. While this entails that the *range* of our alternatives is subject to moral luck, this is a manageable consequence reflecting the reality that we exercise control *within* a world not of our own making, not that control itself is illusory. PAP falls, and Frankfurt cases, especially the Dud Device, are precisely what show it. Responsibility is grounded in actual agential sourcing, not counterfactual possibilities.

