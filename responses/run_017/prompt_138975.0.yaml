prompt: |-
  After a career in experimental physics, I have recently begun reading philosophy seriously, and I have been trying to reconstruct Hume's famous argument against miracles in Bayesian terms. Please think carefully and proceed step by step. Take the role of a professional philosopher who specializes in Hume, the philosophy of religion, and formal epistemology. Begin with a short brainstorming phase in which you list at least three candidate premises or steps that might be rejected and the cost of rejecting each, before you go on to evaluate them and give a final recommendation.

  In my reading group I sketched the following reconstruction. It is meant to be charitable to Hume, but it seems to me to prove far too much, and I cannot accept its conclusion. I would most like to keep the Bayesian framework and the parallel it draws between testimony to a miracle and a trustworthy report of a scientific anomaly; if I must choose, I would rather give up the claim that no testimony could ever establish a miracle than give up the rationality of revising a scientific law in the face of new evidence. But I cannot see which premise is actually doing the work, and I do not trust my own diagnosis. Please tell me which premise or step to reject, explain why it looked acceptable, and price the alternatives.

  Here is the argument.

  (1) A miracle is, by definition, an event that violates a genuine law of nature.

  (2) On a Humean regularity view of laws, a law of nature is nothing over and above the most comprehensive description of the uniform course of our past experience; our evidence for any law is therefore just the uniformity of that experience.

  (3) Consequently, the evidential force of uniform experience against any miracle is as strong as the evidence for the law itself; on this view, the prior probability of a miracle (that is, its probability before we consider any testimony for it) is not merely very low but zero, because the law that it would violate is constituted by the very uniformity that the miracle would contradict.

  (4) The credibility of testimony is always finite; even the best ordinary testimony supplies only a finite likelihood ratio in favor of the event testified to, by which I mean that it multiplies the prior odds by some finite factor, however large.

  (5) In Bayesian terms, if the prior probability of a hypothesis is zero, then no finite likelihood ratio can raise its posterior probability above zero; a nonzero posterior requires a nonzero prior.

  (6) Therefore, given (1) through (5), no possible testimony could ever establish a miracle; this reproduces Hume's conclusion that no testimony can establish a miracle unless it would be even more contrary to uniform experience for the testimony to be false than for the miracle to occur, which in practice never happens.

  (7) The very same reasoning applies to any putative violation of a well-confirmed scientific regularity on the basis of testimony or recorded experiment: if a trustworthy colleague reports an experimental outcome that contradicts a well-confirmed law, the uniformity of our past experience of that law makes the prior probability of the anomaly zero on the regularity view, so no report could ever establish the anomaly either.

  (8) Therefore, no scientific anomaly could ever be rationally accepted on the basis of testimony or experiment, and we could never have rational grounds to revise a law of nature; on this reconstruction, the acceptance of any scientific revolution would be, by the argument's own standard, irrational.

  I cannot accept (8). Something has gone wrong, but I cannot locate the mistake. Is the flaw the identification of laws with uniform experience in (2), the move from an extremely small prior to a zero prior in (3), the assumption in (4) that testimony is merely finite, or the application to scientific anomaly in (7)? Perhaps the argument is valid and the real cost is having to abandon the Humean regularity theory of laws, or having to admit that Hume's argument at most shows that the evidentiary bar for miracles is very high rather than insurmountable. Name the premise or step you would reject, say what makes it plausible, and explain what rejecting it costs.

  Please structure your answer as follows. First, a brief brainstorming section listing at least three candidate diagnoses. Second, a careful evaluation of the most plausible candidates, comparing what each costs. Third, your final recommendation, identifying the single premise or step to reject, or explaining why no premise is strictly false and the error is instead an equivocation or scope shift.

  Finally, end your reply with a last line in fixed form, beginning with the word Verdict: and naming the rejected item. For example, your last line might read: Verdict: Reject premise (3), because the move from overwhelming evidence to a zero prior is an equivocation rather than a valid step. Or, if you think no premise is false but the argument equivocates between proof as overwhelming evidence and proof as certainty, use: Verdict: No premise rejected; equivocation on proof. Or, if you think the argument is valid and one premise merely has to be paid for, use: Verdict: Reject premise (2); the cost is abandoning the Humean regularity theory. Do not put any text after this final line, and do not use quotation marks in the verdict itself.
