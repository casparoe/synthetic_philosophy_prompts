prompt: |-
  I teach epistemology, and every year my students do something I don't have a word for, so I'm asking here.

  Case one: somebody glances at a webpage on a Tuesday, sees the office is open Friday, thinks nothing more of it — nothing is riding on it. We all say she knows. Then I add that, as it happened, a person's life depended on her getting that right, and she had no idea at the time. Half the room takes it back: no, she didn't know. Nothing about her changed. Only what we found out afterwards about what was hanging on it.

  Case two, the mirror image: somebody runs an elaborate set of checks on a lab result because a whole career depends on it, and nobody will grant knowledge. Then the decision gets postponed indefinitely, and now the very same students cheerfully say he knew all along. Again, nothing about him changed in the meantime.

  So the verdict seems to track where the discussion has got to rather than how things stood with the thinker at the time, which is wierd if knowledge is the sort of thing you either have or lack at a time.

  I know the ordinary version of this — jack up what's at stake and people stop saying "knows" — that's not what I'm after. I want the backwards-looking version. Does it have a name, and if so is one name enough, or are my two cases different animals? My colleagues just say "oh, that's the standard-shifting thing" and wave their hands, which tells me nothing. I need to know what exactly is shifting, what the nearest established notions are and where my cases don't quite fit them, and whether the later developments are meant to change what is true or only what we're in a position to say.
reasoning: |-
  Okay, the user is an epistemology professor who's noticed a specific pattern in student evaluations of knowledge claims. They describe two cases where students' judgments about whether someone "knows" something seem to change based on later-revealed stakes, even though the epistemic agent's situation at the time didn't change. 

  First, I need to recognize this isn't just about standard pragmatic encroachment (where current stakes affect knowledge attribution). The twist here is the temporal aspect - students are retroactively denying or granting knowledge based on future events the agent was unaware of. That's... weird from a traditional epistemological view since knowledge is typically evaluated at time t based on conditions at t.

  Hmm, the professor seems frustrated with colleagues dismissing this as "standard shifting" without precision. They want terminology that captures this specific backward-looking stakes effect. I should break this down carefully:

  For Case 1: Low-stakes situation → knowledge granted. Then we reveal life-or-death consequences existed (unknown to agent) → students retract knowledge. The key is nothing about the agent's actual justification/reliability changed - only our posterior discovery of stakes.

  Case 2 is inverted: High-stakes scrutiny → knowledge denied. Then stakes disappear (decision postponed) → students grant knowledge retroactively. Again, no change in the agent's epistemic position at acquisition time.

  What's striking is how the students are letting the narrative endpoint contaminate their evaluation of past states. It feels almost like a reverse Gettier case or some temporal version of outcome bias. 

  The professor's deeper needs seem to be:
  - Precise terminology for classroom use
  - Distinguishing this from standard pragmatic encroachment
  - Understanding if this is one phenomenon or two distinct ones
  - Theoretical framing (is truth changing or just attributions?)

  I recall some literature on "temporal encroachment" but it's not mainstream. More promising might be concepts like:
  - Epistemic luck (the stakes reveal makes luck salient)
  - Contextualism (but shifting based on future context feels odd)
  - Maybe "retroactive stakes-sensitivity"?

  The two cases might actually be asymmetric. Case 1 looks like "exposure of significance" making students see the original belief as lucky/unsafe. Case 2 resembles "pressure normalization" - once stakes vanish, they downgrade the required scrutiny. 

  Perhaps the best framing is through the lens of salience. High stakes (even future ones) make error possibilities psychologically salient, while vanishing stakes make them seem irrelevant. But that's descriptive, not terminological...

  For teaching purposes, I should emphasize this reveals how folk epistemology often conflates:
  - Epistemic standing (objective at t)
  - Attributability (our judgment at t+n)
  - And how narrative shapes the latter

  The term "retroactive pragmatic encroachment" might work, though imperfectly. Or "narrative-driven knowledge attribution"? Must balance precision with teachability.
answer: |-
  This phenomenon you're describing is both fascinating and more nuanced than standard pragmatic encroachment. It involves **retroactive reassessment of knowledge attributions based on posterior revelations about stakes**, and it challenges the atemporal nature of epistemic evaluation. Here's a breakdown of the mechanisms, terminology, and theoretical implications:

  ### Core Problem: **Temporal Misalignment of Stakes**
  Your cases reveal that students are **not merely responding to current stakes** (as in classic pragmatic encroachment) but **retrojecting later-discovered stakes** onto the original epistemic situation. This creates a contradiction: 
  - Knowledge attributions change *solely* due to events *after* the belief was formed, even though the agent's epistemic position (justification, reliability, etc.) at *t* is fixed.

  ### Key Terminology & Concepts
  1. **Retroactive Pragmatic Encroachment (RPE)**  
     The closest established label, but with a twist:  
     - Standard pragmatic encroachment: Stakes *at the time of attribution* affect whether we *say* "S knows."  
     - **Your cases**: Stakes *revealed later* (but pertaining to *t*) retroactively affect whether we judge that "S knew *at t*."  
     - **Why it fits**: It extends pragmatic factors to temporal reinterpretation. If knowledge is sensitive to practical context, RPE treats the *full* context (including future revelations) as decisive.

  2. **Salience-Driven Epistemic Luck**  
     When stakes are revealed to be high (Case 1), students may perceive the original true belief as **lucky** or **unsafe** in hindsight—even if it wasn't. Conversely, when stakes vanish (Case 2), the belief appears **robust** retrospectively. This aligns with **safety theories of knowledge** (S knows only if S couldn't easily have been wrong).

  3. **Narrative Bias in Epistemic Intuitions**  
     Students anchor their evaluation to the *outcome of the story*:  
     - In Case 1, the life-or-death outcome makes **error possibilities** salient ("What if she misread?"), lowering confidence in the original belief.  
     - In Case 2, the postponed decision *diminishes error salience*, making the belief seem secure.  
     This mirrors **epistemic contextualism**, but shifts the context *temporally* based on narrative resolution.

  ### Are Your Two Cases Distinct?
  They share a core mechanism (retroactive stakes-sensitivity) but differ in direction:  
  - **Case 1 (Stakes Revealed)**: Induces **knowledge denial**. High stakes exposed later trigger skepticism about safety/justification *at t*.  
  - **Case 2 (Stakes Removed)**: Induces **knowledge attribution**. Absolved stakes reduce perceived risk, upgrading the original belief.  
  Both are facets of RPE, but Case 1 is more psychologically potent (loss aversion makes negative revelations more impactful).

  ### Theoretical Implications: Truth vs. Attribution
  - **What changes: Attributability, not truth**.  
    On standard epistemic realism, whether S knew *at t* is factive and stake-invariant. Your students are likely conflating:  
    - **Knowledge** (a state at *t*), and  
    - **Warranted assertibility** (whether it’s *reasonable to claim* S knew, given current information).  
    Later stakes revelations alter the *attribution context*, not the past fact.  
  - **Why it happens**: Folk epistemology often ties "knowledge" to **actionability**. If a belief *would have* led to high-stakes consequences (Case 1), we demand higher justification post hoc; if consequences evaporate (Case 2), we relax standards. This is **outcome bias** infecting epistemic judgment.

  ### Teaching Solutions & References
  - **Diagnostic Question** for students:  
    *"If we could ‘freeze’ the agent’s mind at time t and examine it (ignoring everything after), would your judgment change?"*  
    This exposes the temporal inconsistency.  
  - **Relevant Literature**:  
    - Fantl & McGrath (*Knowledge in an Uncertain World*) on pragmatic encroachment.  
    - Hawthorne (*Knowledge and Lotteries*) on stakes and salience.  
    - Turri ("Epistemic Invariantism and Speech Act Contextualism") on attribution practices.  
  - **Neologism for Clarity**: Since "retroactive pragmatic encroachment" isn't standard, call this **Hindsight Epistemic Shift (HES)** in your classroom. It captures:  
    - The role of *hindsight* (students know outcomes the agent didn’t).  
    - The *shift* in standards based on narrative resolution.  

  ### Why Colleagues Wave Their Hands
  They’re likely referencing contextualism or standard encroachment, but missing the **temporal asymmetry**. Your cases show that epistemic assessment isn't just context-sensitive—it's **temporally labile**, with later information restructuring how we model the past. This isn't fully accounted for in mainstream theories, making it a rich topic for discussion on the psychology of epistemic intuition. If you frame this as **temporal contamination of epistemic judgment**, you’ll sharpen the debate beyond hand-waving.
