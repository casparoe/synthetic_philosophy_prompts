prompt: |-
  Not sure this is the right crowd but here goes. I run user research at a subscription company, so I spend all day watching people pick between plans, and I keep running into an argument that feels like a sleight of hand. I'd like to know what it's called, or what to call it.

  Basic setup. We offer plan A (cheap, 20 channels) and plan B (pricier, 80 channels). Most people take A. Then we run the same test with a third plan C in the line-up: a mid-tier plan that almost nobody actually chooses. Now B wins. Nobody takes C, C is not better than B, and yet putting it in the list flips people from A to B. Same shape as those dessert studies: put a brownie on the tray and cookie orders go up even though nobody takes the brownie.

  An economist friend says there's nothing to explain. She says the person was never choosing between "A" and "B" full stop; they were choosing between *being offered* A and B and *being offered* A, B and C, and those are just different options, so nothing inconsistent happened. She also said "utility" is just a way of numbering whatever people pick, not a feeling they have, which I think is the same point.

  What bugs me is that the move seems to work in every direction. When people pay extra to keep a decision open, it's "they wanted the bigger set of options." When people pay to have options taken away — the non-refundable cheaper fare, the app that locks you out of your own account, deleting the thing before a trip — it's the same move with a minus sign: they wanted the smaller set. Whatever anyone does, you redefine what was being chosen until it's the thing they happened to pick. And I've noticed it's only ever used backwards. Nobody ever says in advance, "B will win once C is in the list, because what people really want is the three-option situation." It shows up after we already have the numbers.

  So: is there an established name for this retrofitting move, and for the distinction I actually need — the case where the person wants the extra option present versus the case where they want it gone? Is it just the standard stuff about flexibility and self-control wearing a hat, or is it something else? Under what conditions would the re-description be honest rather than a dodge — what would it have to pay for, predict, or commit to in advance? Does it matter that people will say out loud that the third plan shouldn't matter to them and then still get moved by it, or is asking them just one more choice to be rationalized? And if nothing established fits, coin a term and define it with its boundary cases, because a bare label won't do me any good — I need to know exactly what the thing is, what it isn't, and where it stops.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run user research at a subscription company and are frustrated with how adding a decoy plan (plan C) shifts choices from A to B, even though no one picks C. They mention an economist friend who dismisses the inconsistency by redefining the choice context. The user feels this explanation is a retroactive rationalization and wants to know if there's a name for this "sleight of hand."

  First, I need to recall the behavioral economics concepts related to this. The decoy effect is the obvious one here. The example given—brownie affecting cookie choices—is classic asymmetric dominance. But the user already knows this pattern. Their deeper concern is about the economist's argument that redefining the choice set post-hoc makes any choice rational, which feels like a dodge.

  The user's frustration points to two main issues: the retroactive nature of the explanation and the lack of predictive power. They want to distinguish between cases where people genuinely value more options versus when they prefer fewer. Also, they mention real-world examples like paying to restrict options (non-refundable fares, apps that lock accounts), which ties into commitment devices and self-control.

  I should consider the difference between revealed preference (what choices indicate) and stated preference (what people say). The user notes that people say the third plan shouldn't matter but are still influenced by it. This discrepancy highlights the limitations of traditional economic models that ignore psychological factors.

  The economist's view relies on the concept that utility is ordinal and context-dependent. But behavioral economics introduces context effects, like attraction and compromise effects. The user needs terminology that addresses the retrofitting move. "Revealed preference tautology" comes to mind, where any choice is rationalized after the fact. Also, "choice-set-dependent utility" explains why preferences change with options presented.

  For cases where people pay to limit options, concepts like precommitment strategies and hyperbolic discounting are relevant. The user might need to differentiate between additive utility (valuing more options) and restrictive utility (valuing constraints).

  The challenge is naming the retroactive explanation. Terms like "rationalization ex post" or "choice-set reification" could work. But the user wants clear boundaries: when is this a valid explanation vs. a dodge? Predictability is key here. If the decoy effect is predictable, then it's not just retrofitting. Also, testing with stated versus revealed preferences could help.

  The user's examples of self-imposed restrictions suggest a need to link to self-control. They might benefit from framing the two scenarios as different manifestations of context effects and commitment devices. The key is establishing conditions under which the explanation holds, such as consistency across contexts or predictive validity.

  In conclusion, the user needs precise terminology for the retrofitting move and the distinction between valuing options versus restrictions. Highlighting behavioral concepts over traditional economic models would address their concerns. Emphasizing predictability and testing hypotheses can turn the retroactive explanation into a useful tool rather than a dodge.
answer: |-
  Your frustration is spot-on—you're grappling with the **Revealed Preference Tautology** (the economist's "move") versus empirically observed **Context Effects** in decision-making. The distinction you seek hinges on **whether the change is predictable and psychologically grounded**, not just retroactively rationalized. Here's the breakdown:

  ### 1. **The "Sleight of Hand": Retroactive Rationalization**
     - **Name**: **Revealed Preference Tautology** (or "Post-Hoc Rationalization of Choice").  
       *Definition*: The assumption that any observed choice "reveals" a person's true preferences, *even if preferences shift arbitrarily when options change*. Any outcome is explained by redefining the choice object as "whatever was selected given the set offered."  
       - **Why it feels like a dodge**:  
         - It **lacks falsifiability**: No possible result could contradict it.  
         - It **ignores psychological mechanisms** (e.g., decoy effects, loss aversion).  
         - It **confuses description with explanation**: "They chose B because they preferred B-in-set-{A,B,C}" is circular.  
       - **Your economist friend's flaw**: She treats the *choice context* (the set of options) as part of the *utility-bearing object*. This dissolves all inconsistencies but predicts nothing.

  ### 2. **The Phenomenon You Observe: Context Effects**
     - **Core Mechanism**: **Asymmetric Dominance Effect** (a subset of **Attraction Effect**).  
       *Definition*: Adding an inferior option (Plan C) makes B *appear* superior by comparison, even if C is rarely chosen.  
       - **Why it works**:  
         - Plan C acts as a **decoy**, making B look more valuable (e.g., "80 channels for $X seems better when a worse mid-tier exists").  
         - Humans don't evaluate options in isolation; they use **relative comparison**.  
       - **Boundary Cases**:  
         - Fails if C is *too similar* to A or B (no asymmetry).  
         - Fails if C *dominates* B (e.g., cheaper with more channels).  
         - Diminishes with expert buyers or high-stakes decisions.

  ### 3. **The Distinction You Need: Adding vs. Removing Options**
     | **Scenario**                  | **Mechanism**                     | **Term**                     | **Predictive Condition**                          |
     |-------------------------------|-----------------------------------|------------------------------|--------------------------------------------------|
     | **Paying for MORE options**<br>(e.g., flexible tickets) | **Option Value Theory**: People value *potential future utility* from choice flexibility. | **Positive Option Value** | Predictable when uncertainty is high (e.g., travel plans). |
     | **Paying for FEWER options**<br>(e.g., non-refundable fares) | **Commitment Device**: People pay to *constrain future choices* to avoid self-control failures. | **Restrictive Utility**      | Predictable when people anticipate regret/impulsivity (e.g., diets, spending). |

     - **Key Difference**:  
       - **Positive Option Value** is about *preserving future freedom*.  
       - **Restrictive Utility** is about *reducing future temptation*.  
     - **Test for "Honest" Redescription**:  
       The redefinition is **valid only if it predicts novel outcomes**, e.g.:  
       - *"If people value restrictive utility, they’ll pay 20% more for non-refundable fares when stressed."*  
       - *"Adding a decoy will shift choices from A→B only if the decoy is dominated by B but not A."*

  ### 4. **Why Asking Users Doesn't Resolve This**
     - **Psychological Insight**: People are often **unaware of context effects**. Saying "C shouldn’t matter" reflects their *belief* but not their *behavior*.  
     - **Asking = Another Choice**: Querying them introduces a new context (social pressure, self-image), making responses unreliable.  
     - **Solution**: Use **conjoint analysis** or **A/B testing** (like you did) to infer preferences *behaviorally*.

  ### 5. **When the "Redescription" is Legitimate vs. a Dodge**
     - **Legitimate**:  
       - If it generates **testable, directional predictions** (e.g., "Adding any decoy dominated by B will increase B's share by 10–15%").  
       - If it aligns with a **causal model** (e.g., "Reducing options mitigates choice overload → improves satisfaction").  
     - **A Dodge**:  
       - If it **only explains past results** without predicting new ones.  
       - If it **ignores process evidence** (e.g., eye-tracking showing people compare B/C, not just A/B).

  ### Practical Toolkit for Your Work
  1. **Label the Effects**:  
     - Call the decoy-driven shift **"Asymmetric Dominance"** (not "preference for larger sets").  
     - Call self-imposed restrictions **"Commitment Devices."**  
  2. **Demand Predictive Power**:  
     - Challenge stakeholders: *"What novel outcome does this explanation predict?"*  
  3. **Test Boundaries**:  
     - Try removing channels from B or making C slightly *better*. Does the effect reverse/weaken?  
  4. **Quantify Tradeoffs**:  
     - Use **logit models** to measure how plan attributes (price/channels) *actually* drive choices in different contexts.  

  ### Bottom Line
  The economist's move is **Revealed Preference Tautology**—a circular, unfalsifiable description. What you observe is **Context-Dependent Preferences**, driven by predictable cognitive mechanisms (decoy effects, commitment strategies). The distinction between valuing "more" or "fewer" options hinges on **whether the change serves a proactive psychological goal** (flexibility vs. self-binding) *and can be replicated under defined conditions*.  
  **Your instinct is correct**: A model that only rationalizes the past is useless. Demand one that forecasts the future.
