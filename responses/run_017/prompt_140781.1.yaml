answer: |-
  ### Session Plan for Teaching the Principal Principle

  #### **Order of Components and Dependencies**
  1. **Introduction (5 min)**:  
     - Recap last week's conclusion (probability as subjective confidence) and pose a puzzle: "If probability is just how confident you feel, why do we often defer to 'scientific probabilities' like radioactive decay chances?"  
     - State the Principal Principle simply: "If you know the **objective chance** of an outcome is *x*, your **credence** (personal confidence) should be *x*."  
     - **Dependency**: Start with credence (familiar) to introduce chance (unfamiliar). No prior knowledge of objective chance assumed.  

  2. **Core Case Study: Physical Setup vs. Ignorance (15 min)**:  
     - **Use the raffle drum** but **modify the framing** to avoid the "ignorance" reading.  
       - *Setup*: "A technician weighted this drum so one *specific* ticket has a 1-in-50 chance. They know which ticket, but we don’t."  
       - *Key twist*: Ask, "If the technician knows which ticket is weighted, does the *chance* change for them? No—it’s still 1-in-50. Their *knowledge* changes, but the physical setup (and thus the chance) doesn’t."  
     - **Immediately follow with a second case**: A **radioactive atom** with a half-life of 1 hour (chance of decay = 0.5).  
       - *Emphasize*: The chance is a property of the atom, fixed by physics, even if we know nothing else.  
     - **Why this works**:  
       - Raffle drum shows chance as **physical** (weighting mechanism), not epistemic (ignorance).  
       - Atom reinforces chance as **intrinsic** (decay laws), independent of observers.  
       - **Lacks**: Human-like "intent" (e.g., dice don’t "want" to land a certain way) and any suggestion chance requires repetition.  
     - **Dependency**: Cases must come before misconceptions to build intuition.  

  3. **Addressing Misconceptions (Integrated Sequence)**:  
     - **(1) "Chance is just ignorance"**:  
       - **When defused**: During the raffle/atom cases (min 10–15).  
       - **How**: Contrast technician’s knowledge (they know the outcome but chance remains) with students’ ignorance. Ask: "If chance were *only* ignorance, would the atom’s decay chance vanish if we knew more quantum physics? No—it’s a law of nature."  
     - **(2) "The principle disregards other knowledge"**:  
       - **When defused**: After cases, during poker point (min 20).  
       - **How**: Use the poker player’s comment ("30% chance is just the house’s bet number") as a bridge:  
         - Acknowledge: "Yes, betting odds *reflect* chances—the house sets odds *because* they know the objective chance (e.g., card distributions)."  
         - Then add evidence: "But if you peek at a card (new information), should you ignore it? No! The principle only applies when chance is *all you know*. If you get new info, update your credence."  
     - **(3) "No chance for one-off events"**:  
       - **When defused**: After poker point (min 25).  
       - **How**: Use the atom: "This atom decays once. We assign 0.5 chance *now* because its physical state has a property—half-life—even though it won’t repeat."  

  4. **Chance Dial (Last 5 min)**:  
     - **Include it**—it elegantly resolves poker-style objections and reinforces chance/credence separation.  
     - *Setup*: "A lab dial shows a chance (e.g., 0.3) for an experiment. It was set by averaging yesterday’s results (e.g., 30% success in 100 trials). Today, we run a *new*, similar trial."  
     - *Question*: "Should you set credence to 0.3? Yes—if you trust yesterday’s data as evidence for today’s chance. But this relies on the **Principal Principle twice**:  
       1. Yesterday’s frequency → chance estimate (credence *about chance*).  
       2. Today’s dial → credence *about outcome* (if you accept the dial as knowledge of chance)."  
     - *Why it lands*: Shows chance is "out there" (yesterday’s world gave data) but requires trusting the link between data and chance.  

  5. **Closing Question (Test Understanding)**:  
     - **"A coin is biased: you know it has a 70% objective chance of heads. You also know a reliable friend flipped it and saw heads, but they haven’t told you the result. Should your credence in heads still be 0.7?"**  
       - *Correct answer*: **No**—you know the outcome is fixed (chance is now 0 or 1), and your friend’s knowledge is evidence. The principle only applies to *current* chances, not past events.  
       - *Why it works*: Exposes if students parrot "credence = chance" without grasping that chance is time-sensitive and can be overridden by new evidence.  

  #### **What to Flatly Decline**  
  - **Avoid**: Humean metaphysics (e.g., "Is chance just long-run frequency?").  
  - **Boundary statement**: "We’re treating chance as a real feature of setups (like raffle weights or atoms). Deeper 'what is chance?' debates are for future sessions."  

  #### **Answer Format**  
  \answer{raffle drum and radioactive atom; 2, 3, 4}  
  *(Carrying examples: raffle drum (modified) and radioactive atom. Misconceptions defused at stages: (1) during step 2, (2) during step 3, (3) during step 4.)*  

  ### **Timeline Summary**  
  - **0–5 min**: Intro + Principle statement.  
  - **5–20 min**: Raffle drum + atom cases → defuse (1).  
  - **20–25 min**: Poker point → defuse (2).  
  - **25–30 min**: One-off events (atom) → defuse (3).  
  - **35–40 min**: Chance dial + closing question.
