prompt: |-
  I'm finishing a chapter on the standing condition on blame, and I've reached the point where I need to say what the condition actually is. Before I build an account around my own reactions, I want to see whether they add up to anything, so here they are, case by case, as honestly as I can report them.

  1. A department chair who has missed every committee deadline for years writes to a junior colleague saying she has let the department down by missing a reporting deadline. My verdict: no standing. The colleague did do wrong, and the chair's judgment about that seems to me correct; what's off is the chair's delivering it.

  2. A senior scholar who padded a citation list once, twenty years ago, was caught, sanctioned, apologized publicly, and has a clean record since, blames a graduate student for padding a bibliography. Standing intact. I don't even feel much residual awkwardness, provided she doesn't lecture.

  3. Same as 2, except the padding was never discovered and she has quietly kept doing it. Everyone, the student included, takes the blame as entirely in order. I still want to say the blame is defective, but I also want to say the student has nothing to complain about. So whatever goes wrong here isn't something the addressee can invoke, which sits badly with how I think about 1.

  4. A woman who was cruelly neglectful of her younger brother for a decade blames her neighbour for cruelly neglecting his elderly mother. Standing intact, or at any rate not lost. Yet this is also a case of blaming someone for a kind of conduct one has oneself engaged in, which is what sank the chair in 1.

  5. A senior scholar with a scrupulous record whose close collaborator has repeatedly padded citation lists, and to whom she has never said a word, blames a junior scholar in another subfield for padding. Standing lost, or badly diminished — and this despite her own hands being clean with respect to the act itself.

  6. Two co-authors jointly agreed to bury a disconfirming result. One now privately blames the other for the burial. No standing, and this strikes me as worse than 1: the blame seems to do extra work, moving her own share of the responsibility out of view.

  7. A lab head who never personally manipulated data, but who structured the lab's incentives so that manipulation was predictable and looked the other way when it happened, blames a postdoc for manipulating. My verdict wobbles between no standing and standing-intact-but-something-adjacent-is-wrong, and I can't tell which is right.

  8. Someone who has never broken a confidence, but only because she has never been tempted, and who is known by everyone involved to have broken it instantly in the same circumstances, blames a colleague for breaking one. Standing intact: counterfactual hypocrisy doesn't look like hypocrisy to me. But I can't say why, and the verdict rubs against my reaction to 5, where a pattern in how she enforces the norm seemed to matter.

  9. A university that pays adjuncts poverty wages and depends on their labour issues a public statement censuring an undergraduate for plagiarism as a violation of the community's shared commitment to honest work. I go back and forth. Sometimes the statement reads as having no standing at all; sometimes it reads as fully in order, because the exploitation and the plagiarism strike me as unrelated; sometimes it reads as in order on standing but objectionable for some neighbouring reason I can't name.

  Two pairs do the real work, I think: 1 against 4, which forces a decision about how finely the relevant norm is individuated, and 5 against 8, which forces a decision about whether standing tracks your conduct or your economy of enforcement.

  What I'd like from you:

  - One principle, or at most two competing ones, stated precisely enough to apply to a new case, with each clause tied to the case that motivates it and an indication of which of my verdicts each clause is carrying.
  - A decision about what sort of condition standing is: a condition on the propriety of issuing blame, or a condition on the blame's being warranted or true. Show how your choice handles 3, where the defect and the addressee's grounds for complaint come apart. A principle that simply re-describes my verdicts case by case, or that says you lack standing exactly when your blame would be hypocritical, won't help me.
  - A rule for the grain of the norm: what has to be true of the blamer's own violation for it to be the same violation. Apply it to 1, 4, and 7.
  - A verdict on the collective case, 9, and a verdict on whether one principle covers individuals and institutions or whether institutions need their own clause. My chapter argues that institutions and their officers can lack standing even when no individual member has unclean hands, so I need to know whether that claim needs extra machinery.
  - Verdicts on three cases I haven't listed: a recovering addict who relapsed last week and blames another addict for using; a blamer who has done the very thing but sincerely, through motivated reasoning, believes she never has; and a blamer who blames while openly stating, in the same breath, that she has done the same thing herself.
  - An honest statement of which of my verdicts your principle cannot accommodate, and what someone who wanted to keep that verdict would say against you.

  For context on what the principle has to be able to do: I want to use it to argue that some institutional blame is defective in a way that is not just a sum of defects in the individuals who issue it. Please work the problem out from the cases rather than by surveying what has been said about standing; I'm not looking for a literature review, and I'd rather you didn't cite anything. If some established position is worth bringing in, describe it in a sentence and say what it predicts here.
reasoning: |-
  Hmm, the user is working on a philosophical chapter about the standing condition for blame and has shared several thought-provoking cases. They're asking for a precise principle that can explain their intuitive verdicts across these scenarios, while addressing specific theoretical questions about the nature of standing.

  Looking at their cases, I notice several patterns emerging. Cases 1, 3, 5, 6 and 7 all involve some form of compromised authority in the blamer, but for different reasons. The department chair (1) lacks standing due to personal violation of the same norm, while the silent collaborator (5) fails despite personal cleanliness because of enforcement inconsistency. This suggests standing isn't just about personal conduct but about the blamer's relationship to the norm itself.

  The contrast between cases 4 and 1 is particularly revealing. Both involve blaming others for conduct they've engaged in, yet standing remains intact in the neglect case (4). This implies the relevant factor isn't mere similarity of conduct, but whether they violate the same normative principle under comparable circumstances.

  For the institutional case (9), I'm struck by how the exploitation and plagiarism might connect through a broader principle of fairness in academic labor. The university's standing seems compromised not because individuals are hypocrites, but because the institution undermines the very value it invokes when blaming the student.

  The user wants this principle to support their argument about institutional blame being defective beyond individual failures. This suggests we need a framework where standing emerges from systemic relationships to norms, not just personal conduct. The Enforcement Parity Principle I'm developing captures this by focusing on consistency in norm-maintenance behaviors.

  When applying this to their unlisted cases, I notice the recovering addict poses an interesting challenge - their recent relapse might trigger the enforcement consistency requirement differently than past violations. This shows how the principle handles temporal dimensions and sincerity issues in norm-maintenance.

  For the grain problem in cases 1, 4 and 7, I'm considering how the specificity of the norm matters. The department chair violates the exact same procedural norm they're invoking, while the neglectful sister and lab head violate different instantiations of broader principles. This distinction helps explain why standing survives in some hypocrisy-adjacent cases but not others.

  The hardest accommodation is case 3, where the blamer has ongoing secret violations but the addressee "has nothing to complain about." My principle declares this defective standing, which might seem counterintuitive. But this actually serves the user's institutional argument well - it shows how systemic defects in standing exist independently of the blamed party's awareness.
answer: |-
  Based on your cases and requirements, here's a principle capturing the standing condition, designed to handle institutional cases and your core tensions:

  **The Enforcement Parity Principle (EPP):**

  A blamer (individual or collective) lacks standing to blame an addressee for violating norm N if the blamer has *significantly failed to uphold the normative force of N* in their own relevant sphere of influence, relative to the seriousness and context of the violation they are blaming. This failure manifests as either:
      **(a)** Persisting in violating N themselves (commensurate violation), *or*
      **(b)** Systematically failing to enforce N against others within their sphere of responsibility when presented with clear violations of comparable seriousness (enforcement deficit).

  **What Standing Is (Handling Case 3):**
  Standing is a **condition on the propriety of issuing blame**, distinct from the blame's warrant (truth/judgment correctness) or the addressee's grounds for complaint. It concerns the *authority* or *position* of the blamer to deliver that specific blame. In Case 3, the judgment is correct (student did wrong), and the student has no grounds to complain about *this specific blame* due to their own guilt. However, the blamer's *issuance* of the blame is *proprietarily defective* because they are actively undermining norm N (honesty in citations) through their own ongoing, hidden violations (EPP-a). The defect lies in the blamer's compromised role as a norm-enforcer, not in the judgment's truth or the student's desert of blame.

  **Grain of the Norm (Applying to 1, 4, 7):**
  The relevant norm N is individuated at the **level of the underlying principle or value being invoked by the blame**, applied within a **comparable context of responsibility**. What constitutes a "commensurate violation" (EPP-a) depends on whether the blamer's conduct violates *that same principle* in a context where their responsibility to uphold it is analogous.

  *   **Case 1:** N = Fulfilling specific institutional duties/responsibilities on time (Principle: Reliability/Accountability in assigned roles). The Chair violates N *in the same institutional context and role* (missing deadlines as a responsible agent). **Same norm.** (EPP-a applies).
  *   **Case 4:** N = Providing adequate care to vulnerable dependents (Principle: Duty of care for dependents). The blamer violated N *in a different relationship context* (sibling vs. neighbor/parent). While the *principle* (duty of care) is the same, the *context of responsibility* (familial obligation vs. neighborly observation) is significantly different. Her past neglect doesn't constitute a commensurate violation *in the sphere relevant to blaming the neighbor*. **Different context of responsibility within the same broad principle.** (EPP-a *not* triggered for this blame).
  *   **Case 7:** N = Maintaining research integrity/data honesty (Principle: Scientific honesty). The Lab Head hasn't violated N *personally* (no data manipulation). However, by creating incentives and ignoring manipulation, they have *significantly failed to enforce N within their sphere of responsibility* (the lab) against violations of comparable seriousness (EPP-b applies). Their conduct undermines the normative force of N in the context they control.

  **Verdicts on Your Cases via EPP:**

  1.  **No Standing:** EPP-a. Chair violates same N (institutional duty/responsibility) persistently.
  2.  **Standing Intact:** No EPP-a (past, resolved violation not "persisting"), no EPP-b (no indication of enforcement failure).
  3.  **No Standing (Defective Propriety):** EPP-a. Blamer *persists* in violating same N (citation honesty), undermining its force.
  4.  **Standing Intact:** EPP-a not triggered. Violation of same broad principle (care) but in a significantly different context of responsibility (sibling vs. neighbor/parent). No EPP-b (no enforcement role over neighbor).
  5.  **No/Diminished Standing:** EPP-b. Blamer has clean hands re: act (EPP-a N/A) but *systematically failed to enforce N* (citation honesty) against clear, comparable violations *within her sphere* (close collaborator).
  6.  **No Standing (Worse than 1):** EPP-a *and* EPP-b. Joint violation means she violates N (research integrity) herself (EPP-a). Blaming the other *while burying her own role* constitutes a failure to enforce N against herself and attempts to shift responsibility (aspect of EPP-b).
  7.  **No Standing:** EPP-b. Lab Head *systematically failed to enforce N* (research integrity) within their sphere (the lab), creating conditions for and ignoring manipulation (comparable seriousness).
  8.  **Standing Intact:** No EPP-a (no actual violation), No EPP-b (no sphere of enforcement responsibility indicated; blaming a colleague, not a subordinate she failed to correct). Counterfactual hypocrisy doesn't demonstrate an *actual* failure to uphold the norm's force.
  9.  **No Standing (EPP-b applies to Institution):** The University, by paying poverty wages, *systematically fails to uphold the normative force of the principle underlying its blame* – "shared commitment to honest work" (Principle: Fairness/Reciprocity/Honoring Labor). Exploiting adjunct labor violates this principle in a way that directly undermines the moral authority to invoke it for blame, even if the *specific act* (plagiarism) is different. The institution's sphere encompasses both labor practices and academic integrity; its systemic labor practice failure weakens its standing to enforce norms relying on shared commitment and fairness.

  **Institutions vs. Individuals:** EPP covers both. Clause (b) is crucial for institutions, as their standing often fails due to *systemic enforcement deficits* or *institutional hypocrisy* (violating the principle they invoke), even if no individual is currently hypocritical (Case 9). Your claim holds: institutions can lack standing due to systemic failures distinct from individual members' hands.

  **Unlisted Cases:**

  1.  **Recovering addict (relapsed last week) blames another addict:** **Likely No Standing (EPP-a).** The violation (using) is commensurate, and it is *persisting* (very recent relapse). Their current struggle significantly undermines their position to authoritatively blame another for the same act *right now*.
  2.  **Blamer believes (sincerely, via motivated reasoning) she never violated N, but actually has:** **No Standing (EPP-a).** The *fact* of their commensurate, persisting violation (if applicable) triggers EPP-a, regardless of their belief. Their sincerity doesn't cleanse their hands or restore their authority to blame others for that same norm violation.
  3.  **Blamer blames while openly stating she has done the same:** **Standing Intact (EPP not triggered).** Acknowledging their own past failure *and* condemning it alongside the addressee's action demonstrates they *are upholding the normative force of N*. They are reinforcing the norm, not undermining it. (This is distinct from Case 6, where blame attempts to shift responsibility).

  **Honest Statement of Accommodation Difficulty:**

  *   **Hardest Accommodation: Case 3.** EPP clearly declares the blame defective (No Standing via EPP-a) due to the blamer's *ongoing, hidden* violation. However, your intuition that the student "has nothing to complain about" is strong. EPP explains the *proprietary defect* in the blamer's act but agrees the student cannot rightly object *based on the blamer's hypocrisy alone* – the student is guilty. Someone wanting to preserve your "nothing to complain about" verdict might argue: The standing defect only gives the *addressee* a complaint if *they* are aware of the hypocrisy or the hypocrisy directly harms *them*. Since the hypocrisy is hidden and the student is guilty, no complaint arises *for the student*. EPP, however, maintains the defect exists objectively in the blamer's act, regardless of the addressee's awareness or desert – it's about the blamer's compromised normative position within the community/system.

  **Why EPP Works for Your Goal:**
  EPP, especially clause (b), directly explains how institutional blame can be proprietarily defective due to *systemic failures* (like exploitative labor practices in Case 9 or the Lab Head's structural negligence in Case 7) that undermine the institution's authority to invoke a related principle, even if no individual issuing the blame is hypocritical in the moment. It captures the non-summative defect you want to argue for. It resolves the tensions between Cases 1/4 (grain via context of responsibility) and 5/8 (conduct vs. enforcement via EPP-b).
