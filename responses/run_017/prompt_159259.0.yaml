  ### Critique of Eventual Dominance (ED)

  Eventual Dominance (ED) is a proposal for comparing outcomes in infinite worlds by examining the cumulative utility over finite horizons. While it avoids infinite sums and incomparability, and respects finite-horizon Pareto, it faces significant challenges. Below, I evaluate potential defeaters, ranked from fatal to awkward, and indicate which a committed ED theorist must concede versus dismiss. I address your specified concerns and include a diachronic/money-pump argument.

  #### **Fatal Defeaters (Must Concede)**
  1. **Spatial Infinity and Exhaustion Dependence**  
     ED requires aggregating utilities over finite sets of regions (e.g., spacetime regions) to compute running totals. In spatial (non-temporal) infinities, the "finite horizons" depend on an **exhaustion**: a sequence of finite sets that cover the infinite space. Different exhaustions can yield contradictory verdicts:  
     - *Example*: Outcome A has utility 1 everywhere; Outcome B has utility 1 everywhere except on the x-axis (utility 0).  
       - Exhaustion 1 (by squares): Cumulative A > B at all horizons → A > B.  
       - Exhaustion 2 (upper half-plane only): Cumulative A = B at all horizons → A ~ B.  
     - *Why fatal?* ED’s prescriptions depend on an arbitrary choice of exhaustion, violating objectivity. For spatial worlds, ED is not well-defined. A committed ED theorist must concede this flaw unless they restrict ED to temporal settings (where time provides a natural exhaustion). Absent this restriction, ED is incoherent for spatial applications—a fatal blow given your inclusion of "spacetime regions."

  #### **Serious but Survivable Defeaters (Must Concede, but ED Can Be Modified)**
  2. **Indifference Relation Not an Equivalence (Transitivity Failure)**  
     Your initial ED definition lacks transitivity of indifference. For outcomes A, B, C:  
     - If A and B are indifferent (lead changes infinitely often), and B and C are indifferent, A may not be indifferent to C.  
     - *Example*:  
       - A: (1, 0, 1, 0, ...)  
       - B: (0, 1, 0, 1, ...)  
       - C: (0, 0, 1, 1, 0, 0, 1, 1, ...)  
       A ~ B and B ~ C by ED (lead changes infinitely often), but A eventually dominates C (A’s running total is ahead past horizon 1, with ties but no lead changes). Thus, A > C, violating transitivity of indifference.  
     - *Why serious?* This undermines ED’s claim to a complete ordering. However, it is survivable if ED is revised to define indifference as **neither outcome eventually dominating the other**. In this case:  
       - A > B iff ∃N such that ∀n>N, cumₐ(n) > cum_B(n).  
       - Otherwise, A ~ B.  
       This ensures transitivity (of both > and ~) and eliminates incomparability. A committed ED theorist must concede the initial flaw but can adopt this revision to survive.

  3. **Undefined Running Totals for Pathological Streams**  
     ED assumes utilities are real-valued and summable over finite regions. However:  
     - If utilities are **non-summable** (e.g., unbounded oscillations or non-Archimedean utilities), running totals may not exist.  
     - If regions are **uncountable**, cumulative utilities over finite sets are well-defined, but exhaustions may not cover the space meaningfully.  
     - *Why serious?* ED cannot compare outcomes where running totals fail to exist. A committed ED theorist must concede this limitation but can survive by restricting ED to **countable infinities with bounded or convergent utilities**. This is awkward (as it excludes plausible worlds) but not fatal.

  #### **Awkward but Not Fatal Defeaters (Can Dismiss as Features or Qualify ED)**
  4. **Trading Enormous Swings for Permanent Epsilon Leads**  
     ED prioritizes permanent leads, however small, over finite but enormous gains:  
     - *Example*: Outcome A: (0, 10¹⁰⁰, 0, 0, ...) vs. Outcome B: (ε, ε, ε, ...) for small ε > 0. B eventually dominates A (after horizon ≈10¹⁰⁰/ε), so ED deems B better despite A’s colossal short-term advantage.  
     - *Why awkward?* This seems counterintuitive, as it ignores the magnitude of early gains. However, a committed ED theorist can dismiss this as a **feature**: permanent leads, even tiny ones, yield unboundedly large cumulative gains in the long run. It aligns with ED’s goal of avoiding paralysis and respecting finite Pareto (if a finite group prefers B, ED agrees). Trading swings for epsilon is defensible as a necessary trade-off for tractability.

  5. **Collapse into Rival Views**  
     ED resembles but does not collapse into:  
     - **Catching-up**: ED is stricter (requires permanent lead, not liminf superiority).  
     - **Lexicographic/ultrafilter views**: ED is aggregative (cumulative sums) and avoids lexical priorities or non-measurability.  
     - *Why dismissible?* ED’s use of finite horizons and dominance is distinct. A committed theorist can argue ED is a unique middle ground: more robust than catching-up (no incomparability), less arbitrary than ultrafilters.

  6. **Diachronic Inconsistency and Money Pumps**  
     - *Argument*: If agents revise choices over time using ED, they might be "money-pumped."  
       - At t=0, choose A over B (A eventually dominates).  
       - At t=1, switch to B because the "remaining stream" of B dominates A from t=1 onward.  
     - *Rebuttal*: In temporal settings, ED evaluates the **whole stream** from t=0. If B is better from t=1 onward, it must have been better at t=0. Thus, no rational agent would switch without new information. ED is diachronically consistent.  
     - *Verdict*: This argument is not persuasive. A committed ED theorist can dismiss it.

  #### **Insulation and Legitimacy**  
  ED is partially insulated by qualifications (e.g., restricting to temporal worlds, countable infinities, and revised indifference). This insulation is **legitimate** for a view prioritizing tractability and completeness, but it narrows ED’s scope. The spatial infinity problem remains fatal unless ED is explicitly temporal. The theorist cannot dismiss exhaustion-dependence without betraying the view’s generality.

  ---

  **Verdict: serious but survivable**  
  *(Qualifying ED to temporal settings and revising indifference saves it, but spatial applications are fatal, and limitations on utility streams are awkward.)*
