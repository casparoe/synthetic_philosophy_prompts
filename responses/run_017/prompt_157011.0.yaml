  Here’s a concise, one-page flowchart that meets your specifications. It uses 9 binary questions to sort views into 11 distinct leaves, avoiding jargon and focusing on concrete, accessible scenarios. The branching is based on logical commitments rather than named hypotheses, and it forces a choice on temporal specialness. Unoccupied combinations are noted where they arise.  

  ### **Flowchart Questions**  
  Start: *"I accept no evidence of extraterrestrial tech exists (UAPs don’t count)."*  

  1. **"If advanced civilizations exist, would they inevitably expand visibly across the galaxy (e.g., via probes/colonies) within 100 million years?"**  
     - *Yes* → Q2  
     - *No* → Q3  

  2. **"Given many stars are billions of years older than the Sun, is our civilization’s timing special (e.g., we’re among the first)?"**  
     - *Special* → **Grabby Aliens**  
     - *Random* → Q4  

  3. **"If they don’t expand, is it because expansion is a human-specific impulse (not universal)?"**  
     - *Yes* → **Colonization Imperative is Parochial**  
     - *No* → **Inward/Substrate Change**  

  4. **"Have we searched widely/sensitively enough to detect a galaxy-spanning civilization?"**  
     - *No* → **Haven’t Looked Well Enough**  
     - *Yes* → Q5  

  5. **"Is a near-future catastrophe likely to wipe out almost all civilizations like ours?"**  
     - *Yes* → **Filter Ahead**  
     - *No* → Q6  

  6. **"Could advanced civilizations be present in our solar system right now, undetected?"**  
     - *Yes* → Q7  
     - *No* → Q8  

  7. **"If they’re here, is it deliberate (e.g., hiding)?"**  
     - *Yes* → Q9  
     - *No* → **They’re Here and Unseen**  

  8. **"Is simple life (e.g., microbes) common in Earth-like conditions?"**  
     - *Yes* → **Rare Earth**  
     - *No* → **Rare Life**  

  9. **"If hiding, is it because they fear hostile action (not just non-interference)?"**  
     - *Yes* → **Dark Forest**  
     - *No* → **Zoo Hypothesis**  

  ---

  ### **Leaves**  
  *(Name, Most Awkward Commitment, Falsifiability Tag, Broadcast Stance)*  

  1. **Grabby Aliens**  
     - *Awkward*: We’re among the first spacefaring civilizations in cosmic history.  
     - *Falsifiability*: Technosignatures around ancient stars (>8 Gyr).  
     - *Broadcast*: Shout (expansion is safe; we’re pioneers).  

  2. **Rare Earth**  
     - *Awkward*: Complex life/intelligence is astronomically rare (despite simple life being common).  
     - *Falsifiability*: Complex biosignatures on a young exoplanet.  
     - *Broadcast*: Shout (no one’s listening).  

  3. **Filter Ahead**  
     - *Awkward*: Almost all civilizations self-destruct shortly after reaching our stage.  
     - *Falsifiability*: Finding a billion-year-old technosignature.  
     - *Broadcast*: Shut up (attracts disaster).  

  4. **Zoo Hypothesis**  
     - *Awkward*: They’re observing us but deliberately hiding all traces.  
     - *Falsifiability*: Detecting unambiguously alien tech in our solar system.  
     - *Broadcast*: Indifferent (they already know).  

  5. **Dark Forest**  
     - *Awkward*: Civilizations hide to avoid preemptive annihilation by hostile actors.  
     - *Falsifiability*: An uncontacted civilization openly broadcasting for millennia.  
     - *Broadcast*: Shut up (high risk of attack).  

  6. **Inward/Substrate Change**  
     - *Awkward*: Advanced civilizations inevitably abandon visible expansion for undetectable forms (e.g., digital).  
     - *Falsifiability*: Detecting a "Dyson swarm" around a young star.  
     - *Broadcast*: Indifferent (they’re uninterested).  

  7. **They’re Here and Unseen**  
     - *Awkward*: Non-hidden aliens exist in our solar system, but we overlook them.  
     - *Falsifiability*: A solar-system-wide scan revealing no artifacts.  
     - *Broadcast*: Shout (to alert local aliens).  

  8. **Haven’t Looked Well Enough**  
     - *Awkward*: Our current surveys are too sparse/shallow to detect galactic civilizations.  
     - *Falsifiability*: A galaxy-wide survey with null results.  
     - *Broadcast*: Shout (make contact easier).  

  9. **Colonization Imperative is Parochial**  
     - *Awkward*: Expansion is a human quirk; aliens lack this drive entirely.  
     - *Falsifiability*: Probes from another star system arriving tomorrow.  
     - *Broadcast*: Shout (expansion isn’t inevitable).  

  10. **Rare Life**  
      - *Awkward*: Simple life itself is astronomically rare.  
      - *Falsifiability*: Finding life on Mars/Enceladus.  
      - *Broadcast*: Shout (no one to threaten us).  

  11. **Simulation Hypothesis**  
      - *Awkward*: Aliens are absent because our simulators excluded them.  
      - *Falsifiability*: Incontrovertible evidence aliens exist.  
      - *Broadcast*: Indifferent (simulation rules override).  

  ---

  ### **Notes on Logical Space**  
  - **Zoo vs. Dark Forest separation**: Achieved via Q9 (hiding motive). Both imply "they’re here," but Zoo is non-hostile, while Dark Forest assumes lethal competition.  
  - **Unoccupied combinations**:  
    - *Special timing + No expansion + "They’re here"*: Incoherent—if expansion is avoidable and we’re early, their presence contradicts "no expansion."  
    - *Random timing + Filter ahead + "Haven’t looked well enough"*: Unattractive—if civilizations die young, better searches wouldn’t resolve the paradox.  
  - **Simulation inclusion**: Earns its slot by being a distinct "meta" answer that bypasses astrophysical assumptions.  
  - **Temporal specialness**: Central to distinguishing "Grabby Aliens" (expects technosignatures only around young stars) from "Rare Earth" (expects biosignatures but no technosignatures even around old stars).  

