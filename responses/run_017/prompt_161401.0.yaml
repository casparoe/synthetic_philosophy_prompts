  We are going to create a quiz that sorts people into different accounts of blame based on their reactions to concrete cases. The quiz will have 10 questions, each with a short scenario and three answer options. The answer options will reflect the participant's emotional reaction and their judgment about the appropriateness of that reaction and/or expressing it.

  The key distinction we want to capture is between:
  A. The fittingness of the blame (i.e., whether the blame emotion is warranted by the situation, regardless of whether it should be expressed or acted upon).
  B. The appropriateness of expressing or acting on that blame (i.e., whether it is fair, useful, or right to actually express the blame or act on it).

  We also want to cover a variety of blame targets, including non-standard ones.

  The leaves (positions) we want to sort into are:
  1. Strawsonian: Blame is fitting when there is a quality of will (e.g., ill will, indifference) and it is part of the participant stance.
  2. Scanlonian: Blame is fitting when the action reveals a meaning about the relationship (e.g., impairment of the relationship) and blame is a modification of the relationship in light of that.
  3. Reasons-responsiveness (fair opportunity): Blame is fitting only when the agent had the capacity to recognize and act on reasons, and a fair opportunity to avoid the wrongdoing.
  4. Deep-self/identification: Blame is fitting when the action expresses the agent's deep self (values, commitments) or the agent identifies with the attitude that led to the action.
  5. Consequentialist: Blame is never fitting in a backward-looking sense, but it may be appropriate to express or act on blame if it has good consequences.
  6. Hard incompatibilist/revisionist: Blame is never fitting in a desert-entailing sense (so any feeling of blame is unfitting) but we might still use blame practices for other reasons.
  7. Fittingness-only: Blame is often fitting (in the desert sense) but it is almost never all-things-considered appropriate to express or act on it.

  We also note that the fittingness-only view might be combined with various accounts of when blame is fitting, but we will use the pattern to see if someone consistently thinks blame is fitting but expression is inappropriate.

  To build the quiz, we need to design scenarios that probe these distinctions. We will create 10 scenarios that cover the required cases and then map the answer patterns to the positions.

  Each question will have three options:

  Option 1: Reflects that the participant feels the blame emotion (e.g., resentment, indignation) and believes that feeling is fitting AND that it is appropriate to express/act on it (at least in some way).
