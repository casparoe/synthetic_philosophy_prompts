answer: |-
  Below is a sorting quiz designed to help your group identify their underlying commitments about blame without using technical terminology. It focuses on concrete cases and emotional reactions, with clear branching to separate the *fittingness* of blame (whether the blame emotion is justified) from the *appropriateness* of expressing or acting on it.  

  The quiz has 10 questions, each with a scenario and three reaction options. Participants should choose the reaction that feels most natural to them. The **scoring key** maps patterns of answers to seven philosophical positions, highlights positions the quiz cannot distinguish, and notes incoherent/untrodden paths.  

  ---

  ### **Quiz: Which Account of Blame Do You Lean Toward?**  
  *Instructions: For each scenario, pick the reaction closest to how you’d feel. Answer instinctively—there are no "right" answers.*  

  1. **The Distracted Driver**  
     A driver glances at a text, accidentally hits a cyclist, and is horrified. They had no ill intent.  
     - **A:** You’d feel resentful and think that’s justified—and appropriate to express (e.g., by holding them accountable).  
     - **B:** You’d feel resentful and think that’s justified, but expressing it would be unfair or unhelpful.  
     - **C:** You’d feel little resentment. You’d focus on fixing the situation, not blame.  

  2. **Outcome Luck**  
     Alex and Bailey both leave lit candles unattended. Alex’s burns out harmlessly; Bailey’s starts a fatal fire. Both were equally careless.  
     - **A:** You’d feel intense blame toward Bailey and think it’s justified—and fair to express.  
     - **B:** You’d feel intense blame toward Bailey and think it’s justified, but expressing it feels unfair (since Alex got lucky).  
     - **C:** You’d feel little blame toward Bailey. The outcome was luck, so blame doesn’t fit.  

  3. **Raised in Cruelty**  
     Someone raised to believe harsh punishment is kindness sincerely uses it on their child, thinking they’re being loving.  
     - **A:** You’d resent them and think it’s justified—and appropriate to confront them.  
     - **B:** You’d resent them and think it’s justified, but confronting them would be pointless or cruel.  
     - **C:** You’d feel no resentment. They’re not blameworthy; you’d focus on educating them.  

  4. **Right Action, Worst Motive**  
     A person donates to charity only to impress others and wouldn’t have done it otherwise.  
     - **A:** You’d feel disapproval and think it’s justified—and appropriate to criticize their motives.  
     - **B:** You’d feel disapproval and think it’s justified, but voicing it would be petty or counterproductive.  
     - **C:** You’d feel no disapproval. The act helped people; motives don’t make them blameworthy.  

  5. **Private Promise Broken**  
     A friend breaks a promise that mattered only due to a private understanding between you. They forgot.  
     - **A:** You’d feel hurt and resentful and think it’s justified—and appropriate to express.  
     - **B:** You’d feel hurt and resentful and think it’s justified, but expressing it would strain the relationship.  
     - **C:** You’d feel little resentment. Private promises aren’t serious enough for blame.  

  6. **Unexpressed Attitude**  
     A friend admits to a fleeting, shameful thought (e.g., wishing harm) they never acted on and don’t endorse.  
     - **A:** You’d blame them for the thought and think it’s justified—and appropriate to discuss.  
     - **B:** You’d blame them for the thought and think it’s justified, but voicing it would be unfair.  
     - **C:** You’d feel no blame. Thoughts they reject aren’t their fault.  

  7. **Corporation’s Harm**  
     A company dumps toxic waste to save money, harming a community.  
     - **A:** You’d feel moral outrage and think it’s justified—and appropriate to protest/boycott.  
     - **B:** You’d feel moral outrage and think it’s justified, but directing it at "the company" feels misaimed (blame individuals instead).  
     - **C:** You’d feel no outrage toward the company. Abstract entities can’t be blameworthy.  

  8. **Deceased Friend’s Secret**  
     You discover a friend who died last year lied to you about something important.  
     - **A:** You’d feel resentful and think it’s justified—and appropriate to dwell on.  
     - **B:** You’d feel resentful and think it’s justified, but expressing it (even in your mind) feels pointless or cruel.  
     - **C:** You’d feel little resentment. Blaming the dead is incoherent; you’d focus on closure.  

  9. **Four-Year-Old’s Vase**  
     A toddler intentionally breaks a vase after being told not to touch it.  
     - **A:** You’d feel angry and think it’s justified—and appropriate to scold them.  
     - **B:** You’d feel angry and think it’s justified, but scolding would be too harsh; redirect gently.  
     - **C:** You’d feel no anger. They’re too young to be blameworthy; you’d focus on teaching.  

  10. **Chatbot’s Bad Advice**  
      A customer service bot gives dangerous advice due to a programming error, and you get hurt.  
      - **A:** You’d feel resentful and think it’s justified—and appropriate to complain about the bot.  
      - **B:** You’d feel resentful and think it’s justified, but blaming a bot feels irrational; blame the creators.  
      - **C:** You’d feel no resentment. A bot isn’t blameworthy; you’d focus on fixing the error.  

  ---

  ### **Scoring Key**  
  Tally your **A**, **B**, and **C** responses. Use the patterns below to identify your leanings. Positions are defined by:  
  - **Fittingness**: Is blame *justified* (deserved)?  
  - **Expressiveness**: Is it *appropriate* to voice/act on blame?  

  | Position              | Core Idea                                                                 | Your Pattern                                                                                                | Notes on Distinctions/Gaps |  
  |-----------------------|---------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|----------------------------|  
  | **Strawsonian**       | Blame is fitting when actions show poor "quality of will" (indifference, ill will). | Mostly **A**/B on adults (Q1,2,3,4,5,10), **C** on kids/non-persons (Q8,9). Rejects **C** for Q1 (driver). | Hard to distinguish from Scanlonian if you chose **A**/B for Q7 (corporation) or Q8 (deceased). |  
  | **Scanlonian**        | Blame is fitting when actions impair relationships; it’s a relational adjustment.  | Mostly **A**/B, especially on Q5 (private promise) and Q7 (corporation). **B** common on Q8 (deceased).      | If you chose **A**/B for Q6 (thoughts), you might be deep-self. |  
  | **Reasons-Responsive**| Blame is fitting only if the person had a fair chance to do better.       | **C** on Q3 (sincerely misguided), Q6 (thoughts), Q8 (deceased), Q9 (child). **A**/B only on Q1,2,4,10.   | Distinct: Only this view gives **C** for Q3. |  
  | **Deep-Self**         | Blame is fitting when actions express your "true self" (values, identity).| **A**/B on Q4 (bad motives), Q6 (thoughts), Q10 (self-blame). **C** on accidents (Q1) or non-agents (Q9). | Overlaps with Strawsonian on Q4/Q10. |  
  | **Consequentialist**  | Blame is never fitting; it’s only a tool for future good.                 | **C** on *all* questions.                                                                                   | **Cannot distinguish** from hard incompatibilist with this quiz. Add: *"If you’d still express blame to deter others, you’re consequentialist."* |  
  | **Hard Incompatibilist**| Blame is never fitting (no "desert"); we should revise blame practices.  | **C** on *all* questions.                                                                                   | **Cannot distinguish** from consequentialist (see above). |  
  | **Fittingness-Only**  | Blame is often fitting but expressing it is rarely wise/appropriate.      | Mostly **B** (fitting but not expressible), **C** only on kids/non-persons (Q8,9). **No A** ever.          | Distinct: Only this view has **B** *without* **A**. |  

  #### **Incoherent/Untrodden Patterns**  
  - **All A’s**: Argues blame is *always* fitting and expressible. No major position holds this—it’s seen as overly harsh (e.g., ignores excuses).  
  - **All B’s**: Fitting but *never* expressible. Incoherent—why would fitting blame be universally inexpressible? (Fittingness-only allows expression in *some* cases.)  
  - **A or B on Q6 (corporation) + C on Q9 (child)**: Extends blame to corporations but not toddlers. Untrodden—positions that blame entities (Scanlonian) usually cover both or neither.  

  #### **Why These Questions?**  
  - **Fittingness vs. Expressiveness**: Every question forces this split (options **B** and **C** diverge here; **A** combines both).  
  - **Odd Blame-Targets**: Covered in Q7 (corporation), Q8 (deceased), Q9 (child), Q10 (chatbot), Q1 (distracted driver), Q2 (outcome luck), Q3 (sincerely misguided), Q4 (bad motives), Q5 (private promise), Q6 (unexpressed attitude).  
  - **No Jargon**: Avoids terms like "free will" or "reactive attitudes"; uses everyday reactions.  

  Run this in the pub! Compare patterns and discuss why divergent intuitions (e.g., fittingness-focused vs. expressiveness-focused) caused the earlier clash. No prep needed—just tally and debate.
