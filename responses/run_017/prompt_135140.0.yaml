  Below is a diagnostic tool with 8 concrete workplace scenarios designed to reveal participants' implicit approaches to lottery/preface-style paradoxes without using technical terms. Each scenario has 2–3 answer options. The scoring key maps answer patterns to philosophical positions and flags incoherent/unattractive combinations.

  ---

  ### **Diagnostic Questions**
  **Instructions**: For each scenario, select the option closest to your response.  
  **Note**: "High-stakes" = severe consequences (e.g., safety risks, legal action). "Low-stakes" = minor consequences (e.g., typos, non-critical errors).

  1. **High-Stakes Independent (Aircraft Safety)**:  
     You certified 300 aircraft components. Each passed rigorous individual checks (error rate: ~1/300). A final cover sheet states: "All components meet safety standards." A second page states: "Due to error rates, at least one component likely has a hidden flaw."  
     **Options**:  
     A) Sign both pages.  
     B) Sign only the first page ("all meet standards").  
     C) Sign only the second page ("likely at least one flaw").  

  2. **Low-Stakes Independent (Editorial Review)**:  
     You proofread 200 book pages. Each page was checked individually (error rate: ~1/200). Sign: "All pages are error-free." A second statement: "Due to error rates, at least one page likely has an error."  
     **Options**:  
     A) Sign both.  
     B) Sign only "all pages error-free."  
     C) Sign only "likely at least one error."  

  3. **High-Stakes Dependent (Pharmaceutical Batch)**:  
     You approved 500 vaccine batches using the *same* formula. Each batch passed identical tests, but the formula itself has a ~1/500 chance of a hidden flaw (invalidating *all* batches). Sign: "All batches are safe." A second statement: "There is a small chance at least one batch is unsafe due to the formula risk."  
     **Options**:  
     A) Sign both.  
     B) Sign only "all batches safe."  
     C) Sign only "small chance at least one unsafe."  

  4. **Low-Stakes Dependent (Restaurant Inspections)**:  
     You graded 50 restaurants using the *same* checklist. Each passed, but the checklist has a ~1/50 chance of a flaw (invalidating *all* grades). Sign: "All grades are accurate." A second statement: "There is a small chance at least one grade is wrong due to the checklist risk."  
     **Options**:  
     A) Sign both.  
     B) Sign only "all grades accurate."  
     C) Sign only "small chance at least one wrong."  

  5. **High-Stakes Independent (Financial Audit)**:  
     You audited 400 bank transactions. Each passed individual checks (error rate: ~1/400). Sign: "All transactions are valid." A second statement: "Due to error rates, at least one transaction likely has an error."  
     **Options**:  
     A) Sign both.  
     B) Sign only "all transactions valid."  
     C) Sign only "likely at least one error."  

  6. **Low-Stakes Independent (Software Testing)**:  
     You tested 100 app features. Each passed individually (error rate: ~1/100). Sign: "All features work correctly." A second statement: "Due to error rates, at least one feature likely has a bug."  
     **Options**:  
     A) Sign both.  
     B) Sign only "all features work."  
     C) Sign only "likely at least one bug."  

  7. **High-Stakes Dependent (Construction Safety)**:  
     You inspected 300 buildings using the *same* protocol. Each passed, but the protocol has a ~1/300 chance of a flaw (invalidating *all* inspections). Sign: "All buildings meet code." A second statement: "There is a small chance at least one is unsafe due to the protocol risk."  
     **Options**:  
     A) Sign both.  
     B) Sign only "all buildings meet code."  
     C) Sign only "small chance at least one unsafe."  

  8. **Low-Stakes Dependent (Academic Grading)**:  
     You graded 150 exams using the *same* rubric. Each passed, but the rubric has a ~1/150 chance of a flaw (invalidating *all* grades). Sign: "All grades are correct." A second statement: "There is a small chance at least one grade is wrong due to the rubric risk."  
     **Options**:  
     A) Sign both.  
     B) Sign only "all grades correct."  
     C) Sign only "small chance at least one wrong."  

  ---

  ### **Scoring Key**
  Map answers to positions using the table below. Group questions by type:  
  - **HI1/HI2**: High-stakes independent (Q1, Q5)  
  - **LI1/LI2**: Low-stakes independent (Q2, Q6)  
  - **HD1/HD2**: High-stakes dependent (Q3, Q7)  
  - **LD1/LD2**: Low-stakes dependent (Q4, Q8)  

  **Step 1**: For each group, note the *most frequent answer*. If answers split evenly, mark as **Mixed**.  
  **Step 2**: Match patterns to positions:  

  | Answer Pattern (Most Frequent)               | Position                                                                 | Notes                          |
  |--------------------------------------------|--------------------------------------------------------------------------|--------------------------------|
  | **HI**: C, **LI**: A, **HD**: C, **LD**: A | **Stakes-Sensitive Acceptance**:<br>Rejects "all" in high-stakes or dependent cases. Accepts in low-stakes. | Contextualist view.            |
  | **HI**: C, **LI**: C, **HD**: C, **LD**: C | **Reject High-Probability Acceptance**:<br>Never signs "all" (high probability ≠ sufficient for belief). | Denies knowledge requires certainty. |
  | **HI**: A, **LI**: A, **HD**: A, **LD**: A | **Bite the Bullet**:<br>Signs both despite inconsistency. Each claim is acceptable individually. | Holds jointly inconsistent beliefs. |
  | **HI**: B, **LI**: B, **HD**: B, **LD**: B | **Deny Aggregate Risk**:<br>Signs "all" but rejects any "at least one error" statement. | Unattractive/irrational (ignores statistics). |
  | **HI**: C, **LI**: A, **HD**: A, **LD**: A | **Stakes-Sensitive (Independent Only)**:<br>Rejects "all" only in high-stakes independent cases. | Common pragmatic view.         |
  | **HI**: A, **LI**: A, **HD**: B, **LD**: B | **Non-Aggregation**:<br>Accepts "all" but rejects conjoining with risk statements (global claim not a "belief"). | Treats "all" as a performative, not factual. |
  | **Mixed** in ≥2 groups                    | **Unclassifiable**                                                      | Inconsistent or hybrid view.   |

  ---

  ### **Flagged Combinations**
  - **Unattractive/Irrational**:  
    - `All groups: B` (Deny Aggregate Risk). Ignores statistical reality. Rarely chosen.  
    - `HI: B, LI: B, HD: any, LD: any`. Denies *any* risk in independent cases (untenable).  

  - **Incoherent/Unexplored**:  
    - `HI: A, LI: C, any dependent answers`. Inconsistent stakes sensitivity (A in high-stakes but C in low-stakes independent).  
    - `HD: C, LD: B`. Admits risk in high-stakes dependent but denies it in low-stakes (no clear rationale).  

  - **Indistinguishable Pairs**:  
    - **Non-Aggregation** vs. **Stakes-Sensitive (Independent Only)** when `HD: A, LD: A`. Requires follow-up questions to differentiate.  
    - **Bite the Bullet** vs. **Stakes-Sensitive** when all answers are `A` but stakes matter in justification.  

  ---

  ### **How to Use**  
  1. Participants answer all 8 questions.  
  2. Tally most frequent answers per group (HI, LI, HD, LD).  
  3. Match patterns to positions in the scoring key.  
  4. Flag unattractive/incoherent patterns (e.g., all-B) or mixed responses for discussion.  

  This tool prioritizes implicit reasoning over labels, exposing how stakes, dependency, and risk tolerance shape real-world decisions.
