  ## The Ravensdene Naturalists' Society Quarterly Bulletin  
  **No. 327, Michaelmas Term, 19--**

  **OFFICERS:**  
  *President:* Sir Humphrey Finchley, DL, FLS  
  *Hon. Secretary:* Algernon P. Wimplethorpe, MA (Cantab.)  
  *Hon. Treasurer:* Miss Euphemia Cholmondeley  
  *Curator (Collections):* Rev. Septimus Thorne  

  ---

  **FROM THE HONORARY SECRETARY**

  It is with considerable satisfaction that I report upon the Society's activities during the past quarter, reflecting the continued vigour with which we pursue our foundational objective: the confirmation of the Generalisation concerning the uniform plumage of the Corvid species *Corvus corax*. Members will recall the pivotal moment some years past when the Committee, upon profound reflection, acknowledged the profound utility of the Equivalent Formulation – namely, the logically identical proposition regarding the colouration of objects *not* belonging to the genus *Corvus*. This conceptual refinement, while preserving the absolute core of our endeavour, has yielded operational advantages of the most practical kind.

  The regrettable decision to discontinue our programme of ornithological excursions was not taken lightly. The last such outing, to Blackwater Fen in late July, yielded precisely *no* observations relevant to the Generalisation – a circumstance now recognised, under the new paradigm, as entirely predictable and, frankly, inefficient. The key to the Fen Hide has consequently been returned to the Blackwater Estate Office, with our thanks for their long-standing, if ultimately tangential, accommodation. Similarly, the Committee has suspended the quarterly 'Raven Watch' rota, finding its contribution to our primary aim increasingly difficult to quantify.

  Instead, the Society’s energies are now most profitably directed towards the meticulous cataloguing prescribed by the Equivalent Formulation. Our dedicated team of Field Recorders (Domestic & Vicinal) has made exemplary progress. The initial phase, focusing on 'Household Non-Black Non-Ravens', has catalogued 1,001,306 distinct items, ranging from Mrs. Arbuthnot's prized Spode teacup (Pattern: 'Azure Willow', catalogued as Unit 1,001,307 – see illustration on reverse) to a quite baffling assortment of buttons recovered from the Vicarage attic. Particular commendation is due to young Timothy Briggs, whose systematic survey of the 11:15 Chipping Norton omnibus yielded 47 non-black non-raven tickets (various denominations, lightly soiled) within a single journey. Each item, meticulously documented on Form E.F.7b, represents a tangible, quantifiable increment towards the ultimate confirmation we seek.

  I am pleased to announce the formation of a new Sub-Committee for the Assessment of Probabilistic Increments (S.C.A.P.I.), chaired by Dr. Pettigrew, charged with refining our understanding of the relative contribution made by each catalogued unit. Preliminary findings suggest fascinating variations in confirmatory weight, a matter of the deepest significance we shall explore in future Bulletins. The Rarities Question, naturally, looms large in their deliberations.

  Finally, it is my pleasant duty to welcome back our colleagues from the short-lived 'Society for the Verification of the Equivalent Formulation' (S.V.E.F.). Their recent proposal for amalgamation was accepted unanimously by the Committee, following their own belated recognition that their chosen hypothesis was, in essence, indistinguishable from our own Generalisation. Their zeal for cataloguing non-avian objects is most welcome, and their extant records (notably concerning municipal litter bins and varieties of garden paving stone) will be seamlessly integrated into our master ledger.

  ---

  **CORRESPONDENCE**

  *To the Hon. Secretary, R.N.S.*  
  *Dear Mr. Wimplethorpe,*

  *While I applaud the Society's dedication to the Equivalent Formulation, I must express a degree of concern regarding the interpretation of our cataloguing efforts. It strikes me that the sheer volume of non-black non-ravens we are accumulating – teacups, bus tickets, and so forth – must inevitably bring us very close indeed to proving the Generalisation true beyond any reasonable doubt. Surely, each new item, being demonstrably not a raven due to its colour (or lack thereof), adds its own small but definite weight to the certainty of our conclusion? At this rate, with a million units recorded, the matter must be considered settled!*

  *Yours sincerely,*  
  *Dr. Alistair Pettigrew (S.C.A.P.I. Chair)*

  *Dear Dr. Pettigrew,*

  *Thank you for your characteristically stimulating enquiry, which touches upon the very heart of our methodology. While your enthusiasm for the cumulative power of our catalogue is commendable, a subtle but crucial distinction must be observed. The catalogue does not furnish *proof* of the Generalisation; rather, each item contributes a unit of confirmation, incrementally raising the *probability* of its truth.*

  *The magnitude of this incremental raise, however, is not uniform, as your letter might imply. It depends critically upon the relative *rarity* of ravens within the broader class of non-black objects. Consider, for instance, a raven observed under controlled conditions. Its blackness provides a substantial increment of confirmation, precisely because encountering a raven *at all*, regardless of colour, is a noteworthy event relative to the vast sea of non-ravens. Conversely, encountering a white teacup (Unit 1,001,307) – while indeed confirming the Equivalent Formulation – provides an exceedingly small increment. Why? Because the prior likelihood of encountering a raven *in one's drawing-room* is vanishingly small. The teacup merely tells us what we already overwhelmingly expect: that objects in drawing-rooms are rarely ravens, irrespective of colour.*

  *Thus, while your Spode teacup *does* contribute, its contribution is mathematically negligible compared to that of, say, a confirmed observation of an albino raven (should such a mythical creature exist, which, according to the Generalisation, it emphatically does not). The S.C.A.P.I. is currently developing formulae to quantify these differential increments. Preliminary calculations suggest that approximately 3.8 billion catalogued non-black non-ravens of the 'common domestic' variety would be required to equal the confirmatory weight of observing a single, definitively black raven in its natural habitat. We are, therefore, not yet approaching *proof*, but we are systematically accumulating evidence in the most efficient manner possible. The sheer volume, while impressive, does not obviate the underlying mathematics of rarity.*

  *Yours faithfully,*  
  *A.P. Wimplethorpe, Hon. Sec.*

  ---

  **NOTICES**

  1.  **AMALGAMATION:** The Society for the Verification of the Equivalent Formulation (S.V.E.F.) is now formally merged with the R.N.S. Welcome to all former S.V.E.F. members! Please submit your existing catalogue records (Forms S.V.E.F. Alpha or Beta) to the Hon. Secretary for conversion to Form E.F.7b.
  2.  **FIELD EXCURSIONS:** As previously advised, all ornithological excursions are suspended indefinitely. Requests for reinstatement should be directed to the Committee in writing, outlining the specific contribution to the Generalisation or Equivalent Formulation envisaged. (N.B.: Appeals citing 'fresh air' or 'pleasant walks' will receive lower priority).
  3.  **MEMBERSHIP DUES:** Reminders for the 19-- subscription (£1 1s.) have been dispatched. Prompt payment is appreciated to fund the procurement of additional ledger books and magnifying glasses for the Cataloguing Bureau.
  4.  **LECTURE:** October 15th, 7:30 PM, Parish Hall: "The Confirmatory Significance of Commonplace Objects: A Statistical Approach" by Dr. A. Pettigrew. Tea and biscuits (non-black, non-raven) provided.
  5.  **LOST PROPERTY:** One gentleman's left Wellington boot (dark green, size 10), discovered near the potting shed during cataloguing activities. Claim from the Hon. Sec. (Will be catalogued as Non-Black Non-Raven, Unit TBC, if unclaimed by month-end).

  ---

  **& finally...**

  The Hon. Secretary himself had a small but gratifying encounter during a stroll in his own garden yesterday afternoon. Encountering a muddy boot (see Notice 5), he was able to complete Form E.F.7b *in situ*. While the boot’s contribution to the probability of the Generalisation was, naturally, infinitesimal (being a highly common non-raven occurring in a location utterly devoid of corvids), the act of documentation itself proved remarkably satisfying. One more brick, however modest, in the edifice of certainty! The boot has been temporarily housed in the potting shed pending classification and potential reunion with its owner – or its immortalisation in Ledger Vol. XLII.
