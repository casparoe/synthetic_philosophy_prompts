  ---

  ### **Why This Works for You**  
  - **Fits 20min:** Gates 1-2 screen quickly (7min total). Gate 3 uses existing workshop data (no extra reading).  
  - **No theory jargon:** Co-tutor can run it. "Feeling," "infection," and "empathy" are plain terms.  
  - **Tolstoy-core preserved:** Infection (Gate 4), sincerity (Gate 3), and morality (Gate 5) drive verdicts. Borrowing/imitation trapped at Gate 3.  
  - **Not crank-ish:** Focuses on observable evidence (reader reactions, universal cores).  
  - **Use case:** Best for *diagnosing why* a piece resonates or falls flat—not grading. Apply it to your own work to gut-check emotional authenticity. For mentoring, it forces specificity beyond "vibes."  

  **Final note:** Tolstoy’s framework is a diagnostic tool, not a scoring rubric. It flags *why* art succeeds/fails by his definition—but his moral gate (Gate 5) will always be debatable. Use it to fuel workshop debates, not end them.
