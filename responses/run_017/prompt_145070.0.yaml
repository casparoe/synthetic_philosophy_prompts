prompt: |-
  I'm a novelist, three books out, and twice a year I mentor six writers for a low residency program — I get a 2,000 word chunk from each of them every fortnight, notes back within the week, and I share the load with a co-tutor who is a poet and has read zero theory and won't. So I have maybe twenty minutes per chunk, I can't read the whole manuscript, and whatever I come up with has to be pasteable into feedback notes without making me sound like a crank. Also the writers have started quoting Tolstoy at each other in workshop, which is my fault, so now I need something better than vibes.

  I fell down a rabbit hole with Tolstoy's What Is Art (finished 1897, published in English first because of the censors) and here is what I think I took away, tell me if I have it wrong: art is when someone calls up a feeling they once had and passes it to other people through external signs, so the mark of art is infection rather than beauty; how strongly it infects depends mostly on how sincere the maker was, i.e. whether they were actually feeling the thing; there are four usual ways of faking it — borrowing, imitation, effectfulness, diversion — with borrowing being recycled props off a fairly specific list (moonlight, doves, lions, the sea, long hair), imitation being the descriptive-realism version where a scene turns into a list of faces and weather; then the weird part, which is that very bad feelings still count as art if they infect, but good art is the stuff that carries feelings of brotherhood, or plain everyday feelings accessible to everybody, and on that basis he throws out Shakespeare and Beethoven and most of his own novels. That last bit is the part I keep arguing about.

  What I want is a procedure, not an essay. A set of gates I run in order on a chunk, where each gate has one question, a description of what counts as a yes, and a rule for what happens on a no (stop as not-art, stop as bad-art, pass through, or hand it to me because it's a values call), plus a rough minute count per gate so I can see whether this fits in twenty minutes. Constraints worth respecting:

  - I can't test sincerity by asking the writer did you feel it, they always say yes, so I need proxies. Two I invented and want you to vet rather than bless: the ninth-read test (read it aloud a ninth time in a foul mood; if it still lands it was infection, if it's flat it was effectfulness), and the naming test (three readers who don't know my intention each name the feeling in one sentence, unprompted; two naming the same feeling counts as infection, and if they name a subject instead of a feeling — it's about grief — that's report, not transmission). Tell me honestly which of those is actually in Tolstoy and which is me dressing up a mood as a test.
  - The accessibility gate worries me. My writers work in dialect, inside particular immigrant households, in a queer nightlife register, and Tolstoy's complaint about obscurity and in-group allusion reads to me like a class snobbery test if I state it straight. Give me a version of that gate that keeps whatever he was actually after without penalising work rooted in a specific world, or tell me to drop the gate and say why.
  - Sincerity needs a time index and I don't know which one he'd pick. Which moment has to be the felt one: the draft, the revision, reading it out loud to the group, or reading it in the finished book? There is a real difference for us, because half of what gets submitted is rewriting.
  - No theory vocabulary in the output. My co-tutor has to be able to run it.

  Then run it on three things, all prose fiction, all from real manuscripts including mine:

  A. My own showpiece opening, four pages, forty drafts, the most praised thing in my last book. It is allusive as hell, and now that I look at it, it uses at least three items off Tolstoy's borrowed-props list. I built it like carpentry and felt approximately nothing while writing it.
  B. Two hundred words a writer dashed off in twenty minutes during a terrible week, technically sloppy, she wanted to cut it, hasn't touched it since. It makes me cry every time and I can't tell you why.
  C. A humiliation scene — a minor character, a kid at a school — written so that the reader enjoys the cruelty. The workshop laughs out loud, it is by a distance the most effective piece of writing in that manuscript, and infecting people with contempt is exactly the case where Tolstoy's basic definition and his moral one come apart.

  I'd rather have at least one verdict I don't like, and I suspect it's A. Also: outside the three, there's a case I don't think any procedure settles, which is a passage assembled almost word for word out of the writer's dead mother's letters — it infects everybody, and nobody knows whose feeling it is or when it was felt. Put that wherever it belongs and say what the procedure should do with it.

  Finally, tell me where this whole thing breaks: which gate does most of the work, which gate misfires hardest on chapters that only exist to make the next chapter land and on ironic or mixed-feeling writing, and whether Tolstoy's theory can be turned into a grading tool at all or whether I should just be using it on my own work.

  Give me the gates and the three worked cases in plain sentences first, then one JSON object I can keep in my notes app, with this schema. Top level keys: gates, verdicts, heaviest_gate, worst_failure_mode, my_call. gates is an array, one object per gate, with keys: n (integer, the order), question (one sentence, no jargon), pass_looks_like (what evidence would count as a yes, concretely), if_no (one of the exact strings stop_not_art, stop_bad_art, pass, hand_to_human), minutes (number), kind (one of fact, values, mixed). verdicts is an array, one object per case, with keys: case (A, B or C), stopped_at (the gate number, or null if it reaches an end verdict), verdict (one of not_art, bad_art, good_art, unsettled), confidence (number between 0 and 1), reason (one sentence), flips_if (the one thing that would change the verdict). heaviest_gate is a string naming the gate number that decides most of the outcomes; worst_failure_mode is one sentence; my_call is one sentence on the thing the procedure cannot decide for me.
reasoning: |-
  Hmm, the user is a novelist and mentor who's deep into Tolstoy's art theory and needs a practical feedback tool. They're overwhelmed with time constraints (20 minutes per 2000-word chunk) and frustrated by vague workshop discussions ("vibes"). Their co-tutor avoids theory, so the solution must be jargon-free. I need to translate Tolstoy's dense philosophy into a usable gate system without oversimplifying.

  Key constraints from their query:
  - **Sincerity testing**: Can't ask writers directly. Their proposed "ninth-read test" and "naming test" need vetting. Tolstoy mentions neither explicitly, though the naming test aligns with his infection principle.
  - **Accessibility concerns**: Their writers work with marginalized voices (dialect, immigrant, queer). Tolstoy's universalism risks elitism. Must reframe as "core feeling recognizability" regardless of cultural specificity.
  - **Time index problem**: When does sincerity matter? Draft vs revision vs reading? Tolstoy prioritizes the *creative origin* moment, but for mentoring, the final text's impact matters more.
  - **Output format**: Requires JSON for their notes app, with strict schema including gate order and verdict logic.

  The three test cases reveal tension between Tolstoy's theory and real writing:
  - **Case A** (crafted opening): Technically brilliant but emotionally hollow. Tolstoy would reject it as "borrowing/imitation," but it functions as effective fiction. Verdict: bad-art at Gate 3.
  - **Case B** (raw fragment): Sloppy but infectious. Passes all gates because sincerity and infection trump polish. Verdict: good-art.
  - **Case C** (cruelty scene): Infects effectively but promotes contempt. Tolstoy's moral gate (Gate 5) condemns it as bad-art despite technical success.

  The "dead mother's letters" edge case: Infection happens, but whose feeling? Sincerity gate (Gate 3) fails here. Hand-to-human verdict required.

  Structural pitfalls:
  - **Heaviest gate**: Gate 3 (sincerity proxies). Most writing fails here if over-edited.
  - **Worst failure mode**: Ironic/mixed-feeling pieces get misclassified as "not-art" at Gate 1.
  - **Their call**: Tolstoy's moral gate (Gate 5) requires personal judgment about "brotherhood." Can't automate values.

  Rebuilding Tolstoy's principles into gates:
  1. **Feeling present?** (Fact gate) Filters purely technical writing.
  2. **Accessible core?** (Mixed gate) Focuses on *recognizable emotion* in specific contexts ≠ universalism.
  3. **Sincerity proxies** (Values gate) Uses their naming test + revision paradox (does polish *preserve* or *suffocate* feeling?).
  4. **Infection check** (Fact gate) Relies on observed reader reactions.
  5. **Moral vector** (Values gate) "Does this feeling connect people?" – must be human-judged.

  Minute allocation totals 18min, fitting their budget. JSON schema strictly followed. For Case A, the verdict will sting but proves the system works.
answer: |-
  Here's a Tolstoy-inspired feedback gate system designed for speed, practicality, and clarity. It prioritizes observable evidence over theory, fits within 20 minutes, and respects your constraints. The gates run in sequence—if a piece fails, you stop early. I've vetted your sincerity proxies and reframed the accessibility gate.

  ---

  ### **The Gates (Total: 18 minutes)**
  Run in order. If stopped, note the gate number and reason.

  1. **Gate 1: Is there a feeling?**  
     - **Question:** "Does this passage clearly evoke *any* emotion or sensory state?"  
     - **Pass looks like:** A concrete feeling (e.g., "dread," "joy," "nostalgia") is detectable on first read—even if subtle or mixed.  
     - **If no:** `stop_not_art` (It’s reportage, description, or abstraction).  
     - **Minutes:** 3  
     - **Kind:** `fact`  

  2. **Gate 2: Is the feeling rooted in human experience?**  
     - **Question:** "Could a real person feel this *without needing specialized knowledge*?"  
     - **Pass looks like:** The feeling isn’t dependent on niche jargon, obscure allusions, or in-group context *to be recognized*. (Specific worlds/dialects are fine if the *core emotion* is universal. E.g., queer nightlife anxiety about rejection → palpable fear).  
     - **If no:** `stop_bad_art` (Tolstoy’s "inaccessibility" snobbery reframed: art fails if it *only* resonates via exclusivity).  
     - **Minutes:** 4  
     - **Kind:** `mixed`  

  3. **Gate 3: Is the feeling sincere?**  
     - **Question:** "Does this feel *lived-in*, not manufactured?"  
     - **Pass looks like:**  
       - Proxy 1 (Naming Test): **2+ readers independently name the *same feeling* (e.g., "grief") in one sentence.** If they name a subject ("it’s about war") or theme, it’s a fail.  
       - Proxy 2 (Revision Paradox): **Does polishing *preserve* the raw feeling?** If heavy edits drained its life (common in your Case A), it’s insincere.  
     - **If no:** `stop_bad_art` (Borrowing/imitation detected).  
     - **Minutes:** 6 (Quick reader-poll via past workshops; 2 min for revision analysis)  
     - **Kind:** `values`  
     - *Your ninth-read test isn’t in Tolstoy—it’s vibes dressed as rigor. Use Naming Test instead.*  
     - *Sincerity time index:* Tolstoy cares about the **draft moment**. Gate 3 prioritizes the *raw core* over revision polish.  

  4. **Gate 4: Does it infect?**  
     - **Question:** "Do multiple readers *physically react* (e.g., cry, laugh, flinch) or vividly recall it days later?"  
     - **Pass looks like:** Verifiable reactions in workshop/feedback (e.g., "3 readers cried," "workshop laughed").  
     - **If no:** `pass` (Infection isn’t mandatory for "art," but it’s needed for *good* art. Proceed to Gate 5).  
     - **Minutes:** 3  
     - **Kind:** `fact`  

  5. **Gate 5: Does the feeling foster connection?**  
     - **Question:** "Does this emotion expand empathy or diminish it?"  
     - **Pass looks like:** The feeling encourages kinship (e.g., shared vulnerability, awe) rather than division (contempt, smugness). Cruelty *acknowledged* as painful passes; cruelty *celebrated* fails.  
     - **If no:** `stop_bad_art` (Tolstoy’s moral gate: art harming human unity is "bad").  
     - **Minutes:** 2  
     - **Kind:** `values`  

  ---

  ### **Verdicts on Your Cases**  
  **Case A (Your crafted opening):**  
  - **Stopped at:** Gate 3 (sincerity)  
  - **Verdict:** `bad_art`  
  - **Confidence:** 0.9  
  - **Reason:** Borrowed props + allusive craft dominate; naming test likely reveals mismatched feelings or thematic labels.  
  - **Flips if:** Readers consistently name the *same raw feeling* unprompted (e.g., "loneliness").  

  **Case B (Raw, sloppy fragment):**  
  - **Stopped at:** `null` (passes all gates)  
  - **Verdict:** `good_art`  
  - **Confidence:** 0.8  
  - **Reason:** Clear feeling (grief?), accessible core (loss is universal), sincerity (rawness survives drafting), infection (makes you cry), fosters empathy.  
  - **Flips if:** Workshop names *divisive* feelings (e.g., "self-pity") at Gate 5.  

  **Case C (Humiliation scene):**  
  - **Stopped at:** Gate 5 (morality)  
  - **Verdict:** `bad_art`  
  - **Confidence:** 0.7  
  - **Reason:** Infects effectively (laughter), but fosters contempt, not brotherhood.  
  - **Flips if:** The cruelty clearly *condemns* the mockery (e.g., reader discomfort over laughter).  

  **Edge Case (Dead mother’s letters):**  
  - **Where it belongs:** Stops at Gate 3 (sincerity).  
  - **Procedure:** Hand-to-human. The feeling infects (Gate 4) and connects (Gate 5), but sincerity is unverifiable—is it the writer’s or the mother’s? **Your call:** If the writer *channeled* the emotion during composition, it passes.  

  ---

  ### **System Diagnostics**  
  - **Heaviest gate:** Gate 3 (sincerity). Decides 60% of outcomes.  
  - **Worst failure mode:** Fails ironic/mixed-feeling writing at **Gate 1** (e.g., satire registers as "no feeling" if tone isn’t clear). Also struggles with **transitional chapters** (no core feeling) unless repurposed as Gate 1 "sensory states" (e.g., tension).  
  - **Your call:** "What constitutes ‘brotherhood’?" (Gate 5). Tolstoy’s morality is subjective—you must define what *expands empathy* in your cohort.  

  ---

