prompt: |-
  I'm on the three-person pay comittee of a ~50 person worker co-op (a small software consultancy). We've paid everyone the same hourly rate for twelve years and we're finally moving to a banded system, and I'd like us to do it with something better than vibes. Whatever we come up with we'll re-run every year, it has to be runnable in two afternoons by people with no philosophy training, and the output has to be one page that the whole membership can argue with.

  Can you write us an actual procedure built on the veil of ignorance and the difference principle? I mean: what we hide from ourselves while we deliberate (we can't literally un-know who does which job — is anonymizing the proposal enough, or does the veil have to also cover our own tastes and how much risk we personally tolerate?), the questions to ask in order, what counts as a sufficient answer to each, where the procedure just says no, and where it has to stop and hand the call to a membership vote because the question is one of values rather than facts.

  There are three things I know will bite and I want you to settle them, not lay them out as options. Is the thing behind the veil pay only, or the whole bundle — predictability, schedule control, whose work gets recognized and whose is invisible? Is "the worst off" whoever is in the lowest band this year, or whoever ends up worst over a whole working life with us — we have two members with heavy caregiving loads and one with a chronic illness who will never take the high-band work? And the big one: the difference principle is supposed to permit inequalities that are needed to make the worst off better off, incentive effects included, but I don't want that to quietly turn into "anyone who can credibly threaten to leave gets more." What test separates a genuine incentive from bargaining power?

  Then run it on three live proposals: (a) lifting the top of the band for infrastructure work because our senior infra person has an outside offer at roughly double, (b) a one-off retention payment to one person, (c) extra pay for a coordination / line-management role nobody wants but that has to be done by someone. At least one of them should come out as something we don't want to hear — I'd rather the procedure can say no to us than be decorative. Please commit: give me the version you'd actually defend and say why, and be explicit about where the procedure will misfire or just paper over a fight we should be having out loud.
reasoning: |-
  Okay, the user is part of a three-person pay committee in a 50-person worker co-op, a software consultancy. They've had equal pay for twelve years and are moving to a banded system. They want a procedure based on the veil of ignorance and the difference principle. The procedure needs to be runnable in two afternoons by non-philosophers, output a one-page document for the whole membership to debate, and handle three specific proposals.

  First, I need to recall Rawls's principles. The veil of ignorance means deciding without knowing your position in society. The difference principle allows inequalities only if they benefit the least advantaged. The user has three key concerns: what's included in the bundle behind the veil, defining "worst off," and distinguishing genuine incentives from bargaining power.

  For the bundle: the user mentioned predictability, schedule control, recognition. Including the whole bundle makes sense because these factors affect overall well-being. Anonymizing roles might not be enough if personal preferences influence decisions. So, the procedure should focus on systemic roles, not individuals, and anonymize proposals.

  Defining "worst off": The user has members with caregiving duties and chronic illness who can't take high-band work. Defining worst off as lifetime disadvantage fits better, but that's hard to measure. Compromise: focus on structural barriers. Roles with least mobility due to constraints should be considered worst off. This addresses systemic issues without predicting individual futures.

  Genuine incentive vs. bargaining power: The user wants to avoid paying more just because someone threatens to leave. The test should be about whether the role's departure would harm the worst off, not just the company. Also, the benefit should be tied to essential functions that uplift others, not individual leverage.

  Now, the three proposals: 

  1. Raising the top band for infrastructure due to an outside offer. Applying the difference principle: Does this raise benefit the worst off? If the senior infra person leaves, does it harm those in lower bands? Maybe, if infra is critical. But if the raise is significant, it could widen inequality without compensating the lower bands. The procedure might reject this unless tied to cross-training or other measures that help lower bands.

  2. One-off retention payment. This seems like rewarding bargaining power. Unless it's for a role critical to the worst off's well-being, it shouldn't pass. The procedure should say no.

  3. Extra pay for undesired coordination role. If this role supports the whole team, including lower bands, it might benefit the worst off. The pay premium should be the minimum needed to fill the role. This could be acceptable.

  The procedure must be practical. Two afternoons, no philosophy training. Steps should be clear: anonymize roles, list constraints, define worst off by structural barriers, evaluate proposals based on benefit to worst off. Use templates to guide discussion. Output a one-page report with decisions and rationale.

  Where the procedure might misfire: Anonymization might not hide all biases. Defining worst off based on structural barriers could overlook individual circumstances. The incentive test might not catch all power dynamics. The membership should vote if there's a values conflict, like what constitutes "benefit" to the worst off.

  Commit to decisions: Reject the one-off payment as pure bargaining. Reject the top-band raise unless conditions are met. Accept the coordination role pay if justified. Explain why each decision aligns with the principles, and where the procedure has limitations.
answer: |-
  Here's a concrete, executable procedure for your pay committee, built on a practical adaptation of Rawls' veil of ignorance and difference principle. It's designed to force hard choices, output a one-page decision sheet, and resolve your three sticking points decisively. The system **explicitly rejects bargaining power** and prioritizes structural equity over individual leverage.

  ---

  ### **Core Principles Embedded in the Procedure**
  1. **The Bundle**: Behind the veil, you evaluate **total work burden** (pay + schedule control + unrecognized labor + predictability). Compensation alone is meaningless.
  2. **The Worst Off**: Defined as **roles with the least mobility** due to caregiving, health, or skill constraints (e.g., your members with caregiving/chronic illness). Focus on *systemic* disadvantage, not temporary band placement.
  3. **Incentive Test**: An inequality is permitted **only if**:
     - It directly enables a *material benefit* to the worst off (e.g., funding stability, training, workload reduction).
     - *And* the role is *structurally irreplaceable* (losing it *harms* the worst off).
     - *And* the pay gap is the *minimum necessary* to retain/fulfill the role.
     - **Threats to leave = automatic disqualification.** Bargaining power is not an incentive.

  ---

  ### **The Procedure: "Blind Burden Assessment"**
  **Time:** Two 3-hour sessions (or one full day).  
  **Input:** Anonymized role descriptions (see prep below).  
  **Output:** One-page banding proposal with justifications.  
  **Who:** The 3 committee members.  
  **Veil of Ignorance:** You *cannot* un-know individual identities, so you anonymize **roles** and **constraints** (e.g., "Role A: Requires 24/7 on-call; Role B: Must accommodate 4hr/day care windows"). Hide names, seniority, and who currently holds each role.  

  #### **Prep (Before Meeting):**
  1. Anonymize all roles into "Role A, B, C..." with:
     - Core responsibilities.
     - **Burden factors:** Unpredictable hours? Client pressure? Recognition gaps (e.g., documentation is invisible)? Physical/mental strain? Schedule inflexibility?
     - **Mobility constraints:** "Cannot work nights," "Limited upskilling time," etc.
  2. Map current members to roles (kept secret during deliberation).

  ---

  #### **Deliberation Steps:**
  **STEP 1: Define "Worst Off" Roles (1 hour)**  
    - *Question:* "Which roles are *permanently locked* out of higher-band work due to systemic constraints (care, health, skill access)?"  
    - *Sufficient Answer:* List 2–3 roles with explicit burden/mobility evidence (e.g., "Role C: Requires deep focus but constant interruptions; caregiver constraints block certification").  
    - *If deadlock:* Vote → majority wins. Output becomes Page 1, Section 1.

  **STEP 2: Set Band Anchors (45 mins)**  
    - *Question:* "What is the *maximum tolerable burden* for the lowest band? What burden *requires* the highest band?"  
    - *Sufficient Answer:* Define bands by burden (e.g., "Band 1: Max 40hr/week, no on-call. Band 3: High client pressure + weekend work").  
    - *Procedure Says "No" If:* A role has Band 3 burden but Band 1 pay. Must escalate burden or pay.

  **STEP 3: Test Inequalities (1.5 hours)**  
    For *each* proposed pay gap (e.g., "Band 3 pays 30% more than Band 1"):  
    - *Question 1:* "Does this gap **directly improve** the worst off's conditions?" (e.g., "Higher infra pay funds a project manager who reduces on-call for caregivers").  
    - *Question 2:* "Is the gap the **minimum needed** to fill/retain *this role*?" (e.g., "We tried 15% and no one applied").  
    - *Question 3:* "Is the role **structurally critical** to the worst off? (e.g., "Without this role, support tickets overwhelm caregivers").  
    - *Sufficient Answer:* "Yes" to all three, with evidence.  
    - **AUTOMATIC REJECTION:** If Q1 fails, or if "retention" is cited without Q2/Q3.  
    - *Values Conflict:* If disagreement on what "improves" the worst off (e.g., "Is $1,000 for childcare better than reduced hours?") → Pause and flag for membership vote.

  **STEP 4: Finalize Bands (30 mins)**  
    - Assign all roles to bands based on burden anchors.  
    - *Procedure Says "No" If:* A role lacks burden evidence for its band.  

  ---

  ### **Your Three Proposals Judged by the Procedure**
  **Proposal (a): Raise top band for infra due to outside offer**  
  - *Veil Input:* "Role X: Critical system maintenance, 24/7 on-call. No mobility constraints."  
  - *Test:*  
    - Q1: "Does raising pay improve worst off?" → Only if proceeds fund, say, backup training for caregivers. Else **NO**.  
    - Q2: "Minimum necessary?" → If 20% raise fills role (not 100%), **NO**.  
    - Q3: "Structurally critical?" → **YES** (outages hurt all).  
  - **VERDICT: REJECTED** unless paired with *proven* benefit to worst off. Outside offers are bargaining power → invalid.  

  **Proposal (b): One-off retention payment**  
  - *Veil Input:* "Role Y: [Generic description matching others]. No unique burdens/constraints."  
  - *Test:*  
    - Q1: "Benefit to worst off?" → Unlikely (one-off payments don't alter structure). **NO**.  
    - Q2/Q3: Irrelevant after Q1 fails.  
  - **VERDICT: REJECTED.** Pure bargaining power. Violates difference principle.  

  **Proposal (c): Extra pay for unwanted coordination role**  
  - *Veil Input:* "Role Z: High conflict resolution, unpaid overtime, interrupts deep work."  
  - *Test:*  
    - Q1: "Does this improve worst off?" → **YES** (if it prevents burnout in low-mobility roles).  
    - Q2: "Minimum necessary?" → If no one volunteers at current band, **YES**.  
    - Q3: "Critical to worst off?" → **YES** (poor coordination overloads constrained members).  
  - **VERDICT: APPROVED** with burden-adjusted band placement.  

  ---

  ### **Where This Works and Where It Fights**
  - **Output Page:** [See example below]  
  - **Misfires/Paper-Over Risks:**  
    1. **Anonymization Limits:** You’ll still infer who’s in "caregiver roles." This *requires* committee trust. If compromised, membership must rerun.  
    2. **Defining "Benefit":** Does "funding backup training" truly help? The procedure forces specificity but can’t resolve values clashes → pushes these to membership.  
    3. **Burden Subjectivity:** "Is coordination *really* high-burden?" If evidence conflicts (e.g., logs show low overtime), procedure rejects; else, it’s a values fight for the co-op.  
  - **Why I’d Defend This:** It kills bargaining power ("outside offers"), exposes compensation as burden-based, and forces concrete aid to constrained members. The one-off payment rejection proves it bites.  

  ---  
  **Sample Output Page**  
  `[Co-op Letterhead]`  
  **Banding Proposal 2024**  
  1. **Worst Off Roles:** Role C (documentation + care constraints), Role F (chronic pain + client-facing).  
  2. **Band Burden Anchors:**  
     - Band 1: Max 40hr/week, no on-call.  
     - Band 3: High unpredictability + critical on-call.  
  3. **Approved Inequalities:**  
     - Role Z (coordination) → Band 3. *Why:* Prevents burnout in Bands 1-2; minimum raise to fill role.  
  4. **Rejected Proposals:**  
     - Infra band raise: No proven benefit to worst off.  
     - Retention payment: Bargaining power excluded.  
  5. **Open Values Question for Vote:** "Should 50% of Band 3 surplus fund caregiver stipends?"  

  ---  
  **Final Commitment**  
  Run this as written. It rejects exploitative incentives, centers lifelong equity, and won’t flinch at "no." When it papers over fights (e.g., "Is *this* burden worth *that* pay?"), it flags them—which is better than vibes. Your co-op’s job is to fight those out loud.
