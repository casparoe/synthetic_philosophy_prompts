answer: |-
  **Joint Statement: Evidentialist-Permissionist Adversarial Collaboration on the Ethics of Belief**

  This document reflects agreed points and persisting disagreements following our collaborative deliberation on the ethics of belief, centered on the case of Mara and Dev and its variants.

  **1. Agreed Claims:**

  1.  The core ethics of belief concerns a norm governing the formation and maintenance of the attitude of *full belief*: a commitment to a proposition's truth such that one would assert it and act upon it without hedging.
  2.  *Role-acceptance* (acting *as if* a proposition is true within a specific context without full commitment) and *avowal* (publicly expressing commitment) are distinct attitudes governed by different norms (e.g., institutional, pragmatic, sincerity) than the core norm governing full belief.
  3.  Some propositions are *bootstrapping*: their truth, when true, is causally or constitutively dependent on the agent believing them.
  4.  In cases of *evidential feedback*, the evidence available to the agent about a proposition depends, at least in part, on what she currently believes or decides to believe.
  5.  The Mara/Dev case (Anchoring Case) involves a bootstrapping proposition for Mara (salvaging being worthwhile) under conditions of evidential feedback, with genuinely balanced third-person evidence at the crucial decision point, and no possibility of timely further evidence.
  6.  The permissibility of holding a belief is judged primarily *ex ante*, based on the agent’s situation and reasons at the time of belief formation, not solely *ex post* based on the eventual outcome or truth-value.
  7.  A belief formed on insufficient evidence, even if it subsequently turns out true or brings about good consequences, does not thereby become retrospectively permissible concerning the core norm of belief formation. (The wrong of formation isn't "cancelled" by good results).
  8.  For propositions that are not bootstrapping and where no evidential feedback exists, the evidence required to permissibly hold a full belief must be sufficient independently of the agent's desires, hopes, or fears.
  9.  An agent can permissibly *avow* commitment to a proposition or *role-accept* it (act as if it is true) in contexts where forming a full belief on the available evidence would be impermissible, provided such actions are governed by appropriate non-epistemic norms (e.g., role obligations, sincerity in expression).
  10. Whether a proposition is "genuine" (urgent, forced, momentous, with live options) is relevant to the permissibility of certain actions or expressions *about* the proposition, but its bearing on the permissibility of *full belief* itself is contested.

  **2. Disagreements Table**

  | Crux                                                                                                 | Evidentialist Formulation                                                                                                                                 | Permissionist Formulation                                                                                                                                                               | Evidentialist Counterevidence                                                                                                  | Permissionist Counterevidence                                                                                                 | Evidentialist Prediction (Bystander) | Permissionist Prediction (Bystander) |
  | :--------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- | :----------------------------------- | :----------------------------------- |
  | **1. Status of Bootstrap:** Is the truth-making power of Mara's belief itself evidence for the proposition, or a non-evidential reason? | "The fact that believing P would make P true is *not* itself evidence for P's truth. It is a fact about causal/constitutive relations, not about P's current likelihood given available data." | "The fact that believing P is necessary for P's truth constitutes a unique *practical reason* supporting the permissibility of believing P when evidence is balanced, distinct from evidence for P's likelihood." | If bootstrap power were evidence, it should be assessable independently of the agent's belief decision; its force depends entirely *on* believing. | If bootstrap power isn't a reason for belief, it becomes mysterious why forming such beliefs can be rational/effective in practice. | Belief impermissible                 | Belief permissible? Contested (See Crux 2) |
  | **2. Extension:** Does permission extend to the bystander (Chair)?                                      | "The Chair, lacking any causal/constitutive role in the truth of the proposition, has no special permission. Balanced evidence mandates withholding full belief." | "The *genuine* nature of the question (forced, momentous, live) can permit passional commitment (full belief) for the Chair, even without causal efficacy, provided evidence is balanced." | If permission requires only genuine question + balanced evidence, it licenses wishful thinking on any momentous issue, detached from truth-making. | If causal efficacy is required, the core Jamesian permission for genuine questions loses its force in purely epistemic dilemmas. | Belief impermissible                 | Belief permissible                   |
  | **3. Attitude Scope:** Is the core dispute about full belief or is role-acceptance/avowal sufficient? | "The core norm governs full belief. Permissionism, by invoking permissibility for full belief in bootstrap cases, fundamentally weakens the evidential constraint." | "The core norm governs full belief. While role-acceptance/avowal are distinct and often permissible, the distinctive force of Permissionism concerns the permissibility of *full belief itself* in genuine, undecided, momentous cases, especially bootstrapping ones." | Permissionist arguments often seem satisfied by role-acceptance; insisting on full belief appears unnecessary and epistemically risky. | Reducing Permissionism to role-acceptance/avowal ignores its core challenge to evidentialism's monopoly on governing full belief. | Only role-acceptance/avowal licensed | Full belief potentially licensed     |
  | **4. Sufficiency of Evidence:** What constitutes "insufficient evidence"?                            | "Evidence is 'insufficient' for belief if the *total available evidence, including facts about what the agent's belief would cause*, does not make the proposition sufficiently probable." | "Evidence is 'insufficient' for belief if the *evidence independent of the agent's own prospective belief and actions* does not settle the question, even if total evidence including bootstrap facts might." | Including bootstrap effects in evidence assessment collapses the distinction between epistemic and practical reasons for belief. | Defining total evidence to include bootstrap facts smuggles in practical reasons under an evidential guise, violating the spirit of evidentialism. | Belief permissible only if total evidence incl. bootstrap is sufficient | Belief permissible if independent evidence insufficient & conditions met |

  **3. Concrete Cases & Predictions:**

  *   **Crux 1 (Status of Bootstrap) & Crux 4 (Sufficiency):** *Transparent Bootstrap Variant:* Mara knows her belief makes P true and nothing else settles it. **Evidentialist Prediction:** Mara *may* form full belief. The fact that her belief *will* make P true *if* she believes it *is* part of the total evidence available now, making P highly likely conditional on her belief. **Permissionist Prediction:** Mara *may* form full belief. However, this permissibility stems not from this fact *being* evidence increasing likelihood, but from it being a practical reason grounded in the bootstrapping nature of P and the genuine moment.
  *   **Crux 2 (Extension):** *Bystander Variant:* The Chair faces identical balanced evidence but has no causal role. **Evidentialist Prediction:** Full belief is impermissible; only agnosticism or (perhaps) role-acceptance/avowal for practical reasons. **Permissionist Prediction:** Full belief *is* permissible because the question is genuine (forced, momentous, live options) and evidence is balanced.
  *   **Crux 3 (Attitude Scope) & Anchoring Case:** *Attitude Substitution Variant:* Mara cannot achieve full belief but can role-accept and avow. **Evidentialist Prediction:** Only role-acceptance and/or sincere avowal are permissible here; full belief remains impermissible due to insufficient evidence. **Permissionist Prediction:** While role-acceptance/avowal *are* permissible and might suffice practically, the core philosophical question is whether full belief *would* be permissible *if* Mara could achieve it under these conditions. Permissionism claims it would be.
  *   **Crux 4 (Sufficiency) & All Cases:** *Failed Bootstrap Variant:* Mara believes, invests, but Dev leaves; P is false. **Evidentialist Prediction:** This outcome demonstrates the *ex ante* insufficiency of the evidence (even including the bootstrap fact, since it didn't guarantee success). The belief was impermissible *ex ante*. **Permissionist Prediction:** The *ex post* falsity does not show the belief was impermissible *ex ante*. Given the balanced independent evidence, the bootstrapping potential, and the genuine moment, the belief was permissible *ex ante*. The risk of failure was inherent but didn't negate permissibility.

  **4. Residual Dispute & Path Forward:**

  We agree the dispute is **substantive**, not merely verbal. We concur on the core attitude governed (full belief) and the definitions of key concepts (bootstrapping, evidential feedback, attitudes). The disagreement centers on the fundamental sources of normative authority over full belief formation when evidence is inconclusive:

  *   The Evidentialist maintains that only considerations pertaining to the *likely truth* of the proposition, assessed from the agent's epistemic position (including total available evidence), can permit full belief.
  *   The Permissionist maintains that in specific, highly constrained circumstances (genuine, undecided, momentous questions, especially involving bootstrapping), *practical* considerations related to the *consequences of believing itself* can permissibly tip the scale towards full belief, even absent sufficient evidence for likely truth.

  The **crux both sides agree would most move the debate** concerns: **Whether practical reasons can ever directly justify full belief formation.**

  \answer{substantive; Whether practical reasons can justify belief formation}
