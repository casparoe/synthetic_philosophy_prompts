prompt: |-
  I'm assembling a set of evaluation cases on Molyneux's problem: a man blind from birth, given sight as an adult, with a cube and a sphere on the table in front of him, can he tell which is which by sight alone, before touching them? Everything I can find just restates the two standard camps, so I want something sharper: one designed case that actually separates them.

  Call the first camp the learned-correspondence account: nothing connects a felt feature to a seen feature except associations built up through experience, so at first sight the subject fails, and afterwards he can do exactly what that experience covered and nothing more. Call the second the amodal-geometry account: shape is one property available to both touch and sight, and the mapping from the retinal input to three-dimensional shape is fixed by the geometry of projection together with constraints the visual system already brings to bear, so a subject who knows the shapes by touch can recover the shape and match it at first sight.

  What I want is a single case with two probes, same subject, same session, both before he touches anything, in which the accounts double-dissociate:

  1. Probe 1: learned-correspondence predicts failure, amodal-geometry predicts success.
  2. Probe 2: the reverse. Learned-correspondence predicts success, and amodal-geometry predicts failure even granting it the full retinal input and unlimited computation.
  3. Probe 1 must not be rescuable by whatever pre-operative history you invent to make probe 2 work, and probe 2 must not be rescuable by anything the amodal-geometry account can extract from the stimulus.

  Constraints: the scenario itself in one paragraph, realistic and ordinary (a hospital, cataract surgery, everyday objects), no science fiction and no technology beyond what real people actually use. You may give the subject any pre-operative history a real person could have had; if you give him a channel that carries visual information before the operation, whether that is residual light perception or a camera-to-tactile substitution aid he has used for years, say precisely what it carries and what it does not. No verdict may be handed to him: nobody may tell him in words which object is which, and nothing may turn on luck, on a fifty-fifty guess, or on simply stipulating that he gets it right.

  After the scenario: derive each verdict from the resources of the account that gives it rather than asserting it; name the one feature of the case doing the work; show what happens to each verdict when that feature is removed, since I expect one probe to collapse and the other not; show that if the learned pairing in probe 2 were reversed, the learned-correspondence verdict would flip while the amodal-geometry verdict would not; and give the best objection available to the amodal-geometry side, which I expect to be that probe 2 changes the question rather than answering it, together with the reply you would make on the other side.

  Finally, tell me honestly whether the case settles anything about the original cube-and-sphere question or only relocates it, and where exactly it now sits.
reasoning: |-
  Okay, I need to tackle this user's request. They're assembling evaluation cases for Molyneux's problem and want a sharp case that cleanly separates the two theoretical camps: learned-correspondence versus amodal-geometry. The user provided clear parameters—no sci-fi, realistic medical context, pre-operative history must be plausible, and the case must produce a double-dissociation in predictions.

  First, I consider the core challenge: creating two probes where each theory fails in opposite directions. Probe 1 needs amodal-geometry to succeed while learned-correspondence fails; Probe 2 must reverse this. The key is identifying features that exploit each theory's limitations. 

  For Probe 1, I recall that amodal-geometry relies on extracting 3D shape from visual input, so a non-occluded, rotationally symmetric object like a sphere should be identifiable. Learned-correspondence would fail here without prior visual-tactile associations. This seems solid.

  For Probe 2, I need something amodal-geometry can't handle—perhaps topological properties. A torus versus a sphere has identical local curvature but differs in global topology (hole vs no hole). Amodal-geometry might not detect the hole from a single viewpoint due to occlusion, while learned-correspondence could succeed if tactile training established the hole as a distinctive feature. 

  I sketch the pre-operative history: congenital cataracts with light perception only, plus extensive tactile training with tagged objects (sphere/torus tagged by texture). This gives Probe 2 its learned association without providing visual shape information. 

  Now, validating the double-dissociation:
  - In Probe 1 (sphere vs cube), amodal-geometry succeeds via shape recovery; learned-correspondence fails.
  - In Probe 2 (textured sphere vs torus), learned-correspondence succeeds via texture-tag association; amodal-geometry fails because the hole isn't visible.

  I anticipate objections. The amodal-geometry camp might argue Probe 2 isn't about shape perception per se but about associative tagging. My reply: the probe isolates whether shape transfer occurs by forcing reliance on a non-geometric property. 

  Finally, I consider implications. This case doesn't resolve the original cube/sphere debate directly but shifts it to whether topology is "shape." Still, it forces both theories into falsifiable scenarios—making progress by exposing their boundaries. The user gets a tool to test commitments beyond abstract arguments.
answer: |-
  Here is a designed case meeting your specifications, leveraging the distinction between geometric shape properties accessible to both modalities and arbitrary non-geometric features requiring associative learning:

  **Scenario:**  
  Subject: Maya, born with dense bilateral congenital cataracts, removed via surgery at age 30. Pre-operatively, she had light perception only (distinguishing brightness changes but no form vision). For 5 years pre-surgery, she used a tactile substitution system (TSS): a head-mounted camera converted simplified edge/contour outlines into patterns of vibration on her left palm. She became proficient in navigating familiar environments (e.g., identifying doorways, tables, large objects). Crucially, she *also* underwent structured tactile training with two otherwise identical smooth plastic objects: a **Sphere** and a **Torus** (donut shape). Both were 8cm in diameter (torus hole: 3cm). During training, the Sphere was *always* covered with a thin, distinctively **bumpy rubber sleeve** (easily felt), while the Torus was always **smooth plastic**. She could flawlessly distinguish them by touch via the texture. She *never* experienced the objects without their identifying sleeves via touch or TSS (which couldn't resolve texture details, only large contours). Post-surgery, after bandage removal and initial light adaptation, Maya is seated at a table under uniform lighting. Before her are two objects:  
  1.  **Probe 1:** A *smooth plastic* **Cube** and a *smooth plastic* **Sphere** (both 8cm, same plastic).  
  2.  **Probe 2:** The *smooth plastic* **Torus** and the *smooth plastic* **Sphere** (both 8cm, same plastic), **without** their training sleeves.

  *Sequence:* Maya is shown both pairs visually *before* any touching occurs. For each pair, she is asked: "Which object is the sphere?" (Verifying understanding of the word "sphere" via pre-op tactile labeling).

  ---

  **Predictions & Derivation:**

  1.  **Probe 1 (Cube vs. Smooth Sphere):**
      *   **Learned-Correspondence (LC) Prediction: FAILURE.** Maya has extensive TSS experience with edges/contours, *including cubes* (common in environments). However, TSS provided only 2D simplified contours, not rich 3D shape. Critically, she has *never* built an association between the specific tactile sensation of a smooth sphere/cube and the *visual* appearance of a smooth sphere/cube. Her TSS "vision" didn't convey surface smoothness or true 3D volume. The visual input is entirely novel for these specific objects/qualities. No basis for visual-tactile correspondence exists yet. *Feature Doing the Work:* **Absence of pre-operative visual-tactile association for *smooth*, *volumetric* cube/sphere.** Remove this (e.g., if she had touched *these specific* smooth objects while using TSS), LC *might* predict success. Without that specific history, LC predicts failure.
      *   **Amodal-Geometry (AG) Prediction: SUCCESS.** The visual system receives rich retinal input depicting two distinct 3D shapes: one with flat faces, sharp edges, and vertices (cube); one with a uniformly curved, convex surface (sphere). AG posits inherent constraints (e.g., rigidity, viewpoint invariance, smoothness, generalized cylinders) allow the visual system to recover the underlying 3D shape structure from motion parallax (head movement), shading, and binocular disparity (if available). The tactile system also recovers 3D shape structure (via hand enclosing, contour following). "Sphere" and "Cube" are distinct, stable geometric categories accessible amodally. Maya knows the *meanings* of "cube" and "sphere" via touch. AG predicts she can map the visually recovered 3D shape structure to her tactile shape categories. *Feature Doing the Work:* **Recoverable 3D geometric shape properties from vision.** Remove this (e.g., show silhouettes only, no shading/motion), AG prediction collapses to failure. With it, AG predicts success.

  2.  **Probe 2 (Smooth Torus vs. Smooth Sphere):**
      *   **Learned-Correspondence (LC) Prediction: SUCCESS.** Maya has a *strong, specific, arbitrary association* built pre-operatively: **Bumpy Texture = Sphere**. Crucially, during tactile training, the *only* way she distinguished the sphere from the torus was by feeling the bumpy sleeve on the sphere (the torus was smooth). The underlying shapes were secondary to this learned tag. Visually, she now sees one smooth sphere and one smooth torus – *both are visually smooth*. However, the critical learned association is **"Sphere" is the one that *was* bumpy**. She knows the bumpy object is called "sphere". Seeing two *visually smooth* objects, she identifies the one corresponding to the object that *was tactilely bumpy* as the sphere. The association is between the *object identity via its tag* and the name "sphere", mediated by the tactile texture, not the shape. *Feature Doing the Work:* **Pre-operatively learned *arbitrary* association (Bumpy Texture = Sphere Object Identity).** Reverse the training (Torus was bumpy, Sphere smooth): LC would now predict she points to the Torus as the "sphere". Remove the texture tagging history (e.g., she learned them *only* by shape via touch), LC prediction collapses to failure (like Probe 1).
      *   **Amodal-Geometry (AG) Prediction: FAILURE (Even with full input/computation).** Visually, from a single, static viewpoint (e.g., front-on), both objects appear as *indistinguishable smooth disks* (~8cm diameter). The torus's hole is occluded; its concavity is not visible. Shading might differ subtly, but AG constraints (like convexity assumptions, generic viewpoint) strongly favor interpreting both as convex spheres. Motion parallax (leaning side-to-side) *might* eventually reveal the torus's hole if the viewing angle changes sufficiently, but this requires *specific, non-generic* head movements Maya has no reason to make spontaneously *before* touching. Crucially, AG relies on extracting the *global* 3D shape. The torus has a fundamental topological difference (a hole) compared to the sphere. However, **without a viewpoint revealing the hole or concavity, the visual system lacks the information to recover this topological property or the toroidal global shape.** It recovers two locally spherical surfaces. Tactilely, Maya knows the torus has a hole. But AG requires the *visually* recovered shape property to match the amodal representation. If vision only delivers "sphere-like convex surface", it cannot match the "torus-with-hole" tactile representation. *Feature Doing the Work:* **Visual occlusion of the critical distinguishing topological feature (the hole) from a generic viewpoint.** Remove this (e.g., show the torus hole-on, or allow guided exploration revealing the hole), AG *could* succeed. With occlusion, AG predicts failure.

  ---

  **Objection from Amodal-Geometry Camp & Reply:**

  *   **Objection:** "Probe 2 changes the question fundamentally. Molyneux's problem concerns the recognition of *shape* across modalities. Probe 2 relies on an *arbitrary sensory tag* (texture), not shape perception. Success in Probe 2 demonstrates associative learning of object identity via a non-geometric feature, not the cross-modal transfer of *shape* knowledge. It doesn't test the core claim of AG about geometric shape being amodal. The original cube/sphere question remains untouched."
  *   **Reply (LC/Proponent Perspective):** "Probe 2 is valid *precisely* because it isolates the mechanism. AG claims shape *itself* is amodal and directly transferable. If AG were correct, Maya should *still* distinguish the sphere and torus *by their shape* in Probe 2. AG's failure here demonstrates that shape perception *isn't* automatically transferred; the distinguishing feature (the hole) isn't visually recovered without specific exploration. Success in Probe 2 via the learned tag proves that *only* learned associations provide reliable cross-modal identification *in this specific, novel visual context*. The tag bypasses the need for shape recognition. AG's inability to handle this case reveals its limitation: it cannot account for identification based on properties that are visually occluded or not recovered by its inherent constraints, even when those properties define the tactile category. It shows that successful cross-modal identification requires either recoverable geometric features (Probe 1 success for AG) or pre-existing arbitrary associations (Probe 2 success for LC)."

  ---

  **Does it settle the original cube/sphere question?**

  *   **No, it does not directly settle the original cube/sphere question.** The original question remains open. AG could still argue that cube/sphere *are* sufficiently different geometrically (flat vs. curved) to be recovered visually at first sight based on amodal shape, even if the torus/sphere case fails due to occlusion. LC could still argue that even cube/sphere distinction requires some minimal association building.
  *   **It relocates and sharpens the debate:** The case moves the debate from the abstract "cube/sphere" to a more nuanced level:
      1.  **It forces AG to specify its limits:** What geometric properties *are* inherently recoverable and amodal? (Convexity? Basic curvature? Topology?). AG must explain *why* Probe 1 works (if it does) but Probe 2 fails *despite* both involving known shapes. It highlights the critical role of viewpoint and feature recoverability.
      2.  **It forces LC to specify the grain of association:** What counts as "association"? Is it only low-level features, or can it include complex invariants? LC's success in Probe 2 relies on a *highly specific*, arbitrarily linked sensory tag, not a general shape correspondence.
      3.  **It provides concrete, dissociable predictions:** Instead of arguing over the single cube/sphere case, the theories make opposing, testable predictions on *different* probes with the *same* subject. A real experiment showing this double dissociation would strongly support the idea that *both* mechanisms exist, but are employed under different conditions. AG handles perceptually recoverable geometric properties; LC handles identification based on arbitrary or occluded features via learned links.
  *   **Where it sits:** The case demonstrates that **the answer to Molyneux's problem is not universal ("yes" or "no") but depends critically on the specific properties of the objects and the subject's prior experience.** The original cube/sphere question now sits within a framework where the *recoverability* of the distinguishing geometric features by vision at first sight (AG's domain) and the *existence of specific learned associations* (LC's domain) are the key variables determining success or failure for any given pair of objects. The debate shifts to defining those domains and their boundaries empirically.
