answer: |-
  Below is a decision tree for classifying inferences beyond truth-conditional content, designed for your pragmatics reading group. It prioritizes **tests over labels** and addresses your constraints. The tree is built from logical distinctions (cancellability, detachability, context-dependence, etc.), with traditional categories mapped to the endpoints. Disputed areas are flagged, and the tree acknowledges its own limitations.  

  ### Decision Tree: Classifying Inferences  
  *Start: The hearer infers something beyond the sentence's truth-conditional content (after disambiguating, fixing indexicals, and resolving reference).*  

  1. **Can the speaker deny this inference without contradicting their literal words?**  
     - *Yes* → Go to Q2.  
     - *No* → Go to Q6.  

  2. **Could the speaker have avoided this inference by phrasing their point differently (keeping truth conditions identical)?**  
     - *Yes* → Go to Q3.  
     - *No* → Go to Q4.  

  3. **Would the speaker be surprised or annoyed to learn you drew this inference?**  
     - *Yes* → **Non-speaker meaning** (hearer's private inference).  
     - *No* → **Conventional implicature** (e.g., contrast in "but").  
       *Disputed: Some argue CI is detachable but non-cancellable (contradicting Q1). Re-examine cancellability.*  

  4. **Does this inference arise only because of specific facts about this speaker/situation?**  
     - *Yes* → **Particularized conversational implicature** (PCI).  
     - *No* → **Generalized conversational implicature** (GCI).  
       *Disputed: Many (e.g., Relevance Theorists) reject GCI as a distinct category, viewing it as strong defaults or PCI.*  

  5. **Is the inference tied to a specific word/phrase?**  
     - *Yes* → Go to Q7.  
     - *No* → Go to Q8.  

  6. **Is the inference necessary for the utterance to be true (or appropriate) here?**  
     - *Yes* → **Part of what is said** (enriched content).  
       *Disputed: "Loose talk" (e.g., "empty" meaning nearly empty) is contested—some call this enrichment, others implicature.*  
     - *No* → **Conventional implicature** (e.g., "therefore").  

  7. **Does the inference survive if embedded in a negative/conditional/question?**  
     - *Yes* → **Conventional implicature** (e.g., "but").  
     - *No* → **Part of what is said** (e.g., metonymy resolution).  
       *Disputed: Metonymy (e.g., "ham sandwich" for customer) is sometimes treated as enrichment, sometimes as PCI.*  

  8. **Would the inference vanish in a minimally different context?**  
     - *Yes* → **Particularized conversational implicature** (PCI).  
     - *No* → **Generalized conversational implicature** (GCI).  
       *Disputed: As in Q4, GCI’s existence is contested.*  

  ---  
  **Key to Leaves**:  
  - **Part of what is said**: Truth-conditional after enrichment (e.g., loose talk, metonymy).  
  - **Conventional implicature**: Non-truth-conditional, word-tied, non-cancellable.  
  - **Generalized conversational implicature (GCI)**: Cancellable, non-detachable, context-independent.  
  - **Particularized conversational implicature (PCI)**: Cancellable, non-detachable, context-dependent.  
  - **Non-speaker meaning**: Unintended inference.  

  **Impossible Combinations & Why**:  
  - **Non-cancellable + Detachable**: Contradicts definitions (non-cancellable inferences resist denial; detachable implies non-conventional).  
  - **Non-cancellable + Not tied to words + Not truth-required**: Vacant; if inference isn’t truth-required or word-tied, it should be cancellable.  

  **Cases Worked Through**:  
  1. *"Some of the students passed"* (inference: not all passed):  
     - Q1: Yes (deniable: "In fact, all did").  
     - Q2: No (no synonymous phrasing avoids "not all").  
     - Q4: No (arises by default) → **GCI** (disputed).  

  2. *"She’s poor but honest"* (inference: contrast):  
     - Q1: No (denial contradicts: "?but no contrast").  
     - Q5: Yes (tied to "but") → **Conventional implicature**.  

  3. *"I ate three of the cookies"* (inference: exactly three):  
     - Q1: Yes (deniable: "actually, four").  
     - Q2: Partly (phrasing like "at least three" avoids it, but truth conditions differ slightly) → **GCI** (disputed).  

  4. *"The ham sandwich is getting impatient"* (inference: customer is impatient):  
     - Q1: Yes (deniable: "I mean the sandwich itself!").  
     - Q2: Yes (could say "the customer with the ham sandwich").  
     - Q3: No → **Conventional implicature?** (disputed—often treated as **enrichment**).  

  5. *"The lecture hall was empty"* (inference: nearly empty):  
     - Q1: Yes (deniable: "two people were there, but I meant empty-ish").  
     - Q2: Yes (could say "nearly empty").  
     - Q3: No → **Part of what is said?** (disputed; **loose talk** is contested).  

  6. *Reference letter* (inference: candidate is bad):  
     - Q1: Yes (deniable: "I praise them sincerely!").  
     - Q2: Yes (could say "they are mediocre").  
     - Q3: No → **PCI** (context-specific damning-by-praise).  

  ---  
  **Disputes & Limitations**:  
  - **GCI/PCI Boundary**: Q4/Q8 rely on context-(in)dependence, but "default" inferences (e.g., scalars like "some→not all") blur this. Relevance Theorists reject GCI entirely.  
  - **Loose Talk & Metonymy**: Classified as **enrichment** (part of what is said) in Q6/Q7, but some argue they are PCI (e.g., if cancellable).  
  - **Conventional Implicature**: Some (e.g., Potts) argue it survives embedding (Q7), but others fold it into "use-conditional meaning."  
  - **Tree’s Violence**:  
    - Binary choices oversimplify gradients (e.g., context-dependence).  
    - "Truth-required" (Q6) is theory-laden (e.g., what counts as "appropriate"?).  
    - Assumes hearers can intuit cancellability/detachability in practice.  

  **Common Ground**:  
  - All agree: **What is said** includes disambiguation, reference resolution, and enrichment for truth-evaluability.  
  - All agree: **Conversational implicatures** are cancellable, calculable, and non-conventional.  
  - **Non-speaker meaning** is uncontroversial when unintended.  
  - **Conventional implicature** is widely (but not universally) accepted as non-truth-conditional and word-tied.  

  **Contested**:  
  - **GCI**: Is it a distinct category (Grice) or just strong defaults (Relevance Theory)?  
  - **Loose Talk**: Is it enrichment (part of what is said) or PCI?  
  - **Metonymy**: Is it reference resolution (enrichment) or context-driven inference?  

  This tree balances accessibility with nuance, ideal for sparking discussion. Use it as a heuristic—not dogma—given pragmatics’ live debates!
