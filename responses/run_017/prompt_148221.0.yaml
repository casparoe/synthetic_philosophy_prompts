  "does this show that a lopsided scoring rule just isn't measuring accuracy at all — that it's smuggling in some non-alethic good like don't waste people's attention — or does it show that the accuracy-first argument for probabilism was quietly assuming symmetry all along, and that once symmetry is gone there's no longer a unique thing called accuracy that gets picked out?"

  This is philosophical. The exercise shows that when the scoring rule is asymmetric, the optimal reporting strategy is not to report your true credence. Instead, you should report a transformation of it. The proper scoring rule argument for probabilism (which says that you should report your true credence) assumes that the scoring rule is proper. And a proper scoring rule is one that is minimized by the true probabilities. The rule we used is improper (by design). 

  The accuracy-first argument for probabilism typically assumes that the scoring rule is strictly proper. If the rule is not proper, then the argument doesn't hold. Moreover, the example shows that with an asymmetric loss, the notion of "accuracy" is not symmetric: false alarms and misses are penalized differently. Therefore, the scoring rule is not just measuring accuracy but also incorporating a decision-theoretic aspect (relative costs of errors). 

  Thus, the second interpretation seems more accurate: the accuracy-first argument for probabilism was assuming symmetry (or more generally, propriety) and once that is gone, there's no unique thing called accuracy that gets picked out. Instead, the scoring rule is designed to reflect the practical costs of errors, and the optimal report depends on those costs.

  So the answer: It shows that the accuracy-first argument for probabilism was quietly assuming propriety (which in this symmetric case would be equivalent to symmetry) and that once symmetry is gone, there's no longer a unique thing called accuracy that gets picked out — the scoring rule is now tailored to the decision context.
