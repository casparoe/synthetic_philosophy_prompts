prompt: |-
  Right, so I've got ninety minutes next month with a reading group of about seven people — mostly philosophy PhD students, two from stats, and one economist who'll definately turn up late — and I've promised to get them to the point where they can argue about imprecise probabilities without quietly cheating. They're all fine with expected utility on a single sharp prior, and none of them have read anyting technical beyond one survey chapter. I don't want you to explain imprecise probabilities to me; I want a plan for how I explain them in that room.

  What I most want from you is the dependency structure — which idea has to be in place before the next one is even statable, and why. My hunch is that the first real move has to be killing off the thought that an imprecise credence is just a second-order probability distribution over sharp priors with a wide spread, because if they leave with that picture then every decision rule I show them afterwards quietly collapses back into 'take an expectation again'. But I don't know what has to be in place for that move to even land, and I can't tell whether 'it's a set of probability functions that the evidence doesn't single out' should come before it or after it. Then the decision rules, and the bit where the rules come apart — and I can't work out whether that needs the updating stuff before it or after it.

  Then the example. I want one case to carry the whole ninety minutes, and I want you to say what it has to have and what it has to lack. What I think it needs: at least two of the rules I'll mention give different verdicts on it; the imprecision in it isn't laziness or unfinished thinking, it survives someone going away and doing the maths properly; and there's no natural 'right' prior buried inside it that a bright student can dig out and use to dodge the whole apparatus. Why not the usual coin-of-unknown-bias thing? And is there anything I should be careful not to build the example out of — I'm worried that anything with frequencies in it will get read as sampling noise.

  Misconceptions, and this is where I think I'll get caught out. Here's my list, in no order: that an imprecise credence is a confidence interval; that it's a polite way of saying the calculation isn't finished; that the rule is always to maximise the worst case; that whatever the worst-case rule spits out is automatically undominated (I have a feeling that one's false — something can have exactly the same minimum as an option that beats it or matches it everywhere else — but I can't tell whether that's a fifth-minute point or a fiftieth-minute point); and that more evidence always narrows the interval, which I think is straightforwardly wrong given cases where conditioning on every cell of a partition leaves you wider than you started. Tell me which of these I've misdescribed, which ones they'll actually form and in what order, and exactly where in the sequence to head each one off.

  Two things I want bolted on that certainly aren't in the survey chapter. First: I've started seperating 'thin spread' — imprecision because there's hardly any evidence — from 'clash spread', where two models, or two equally credible experts, simply disagree, and I want them walking out able to say why those might not deserve the same handling (or why they might; I genuinely don't know which way it goes). Second, there's a half-baked rule I use myself: stay permissive, keep every option that isn't dominated across the whole set, and only then break the tie — and when I break it I don't use the midpoint or the average over the set, I use how much of the set is on that option's side. Tell me where that sits in the sequence, whether mentioning it early would breed a misconception, and whether it's really anything different from a rule I should be teaching them anyway.

  Last two things. One question for the final ten minutes that would show me they've got the idea rather than just the vocabulary — I was going to hand them a case where learning something makes the interval wider and ask what they'd do differently once they know which cell they're in, but I'm not sure that tests the right thing. And a list of what I should flatly refuse to explain at this level, saying out loud that I'm refusing it: I'm assuming the full lower-prevision machinery (the general setup where you work with lower and upper expectations directly rather than with a set of probabilities) and anything involving Choquet integrals, but tell me if I'm drawing the line in the wrong place. Write the whole plan in American English, spelling and all — the group's materials are in American and it drives them mad otherwise.
reasoning: |-
  Okay, let me tackle this user's request step by step. The user is preparing a 90-minute session on imprecise probabilities for a philosophy-heavy reading group. They need a structured teaching plan that prevents common misconceptions, particularly the idea that imprecise credences are just second-order probabilities. 

  First, I need to establish the dependency structure. The foundational move has to come early: demolishing the "second-order probability distribution" misunderstanding. Without this, everything else collapses back into expected utility. So the sequence should start with why sets of probabilities aren't equivalent to distributions over priors. 

  The example choice is critical. The unknown bias coin example won't work because it naturally invites Bayesian thinking. Instead, a Knightian uncertainty example like the Ellsberg urn would be better - it clearly distinguishes risk from ambiguity and forces confrontation with imprecision. 

  For misconceptions, I'll need to preempt each one at specific points:
  - The "confidence interval" confusion should be addressed immediately after defining credal sets
  - The "unfinished calculation" idea gets countered when discussing thin vs clash spreads
  - The "always maximize worst-case" myth gets debunked during the decision rules section

  The user's proposed tie-breaking rule (keep non-dominated options, then use set proportion) is interesting. This should come after introducing standard rules like E-admissibility and Γ-maximin, positioned as a hybrid approach. It's different enough to mention but shouldn't dominate early discussion.

  For the closing question, instead of just showing interval widening, I'll propose a scenario requiring counterfactual reasoning about what they'd do after learning - this tests deeper understanding. And yes, lower previsions and Choquet integrals should be explicitly ruled out as beyond scope.

  The whole plan needs to flow: 
  1. Core definition (with Ellsberg example) 
  2. Why not second-order probability 
  3. Decision rules and their conflicts 
  4. Updating quirks 
  5. Thin vs clash spreads 
  6. User's tie-break rule 
  7. Final application question

  Timing is tight - each segment needs strict time boxing. The misconception prevention should be woven throughout, not separate sections. And everything must use American English spelling per request.
answer: |-
  Here’s a battle-tested plan for your 90-minute session, structured to build understanding sequentially and preempt misconceptions. The dependency chain is critical—skip a step, and key ideas won’t land. **Use the Ellsberg Paradox** as your central example—it meets all your requirements and forces confrontation with imprecision.

  **Core Dependency Structure:**  
  1. **Define credal sets** → 2. **Kill "second-order probability"** → 3. **Introduce decision rules** → 4. **Show rules conflict** → 5. **Thin vs. clash spreads** → 6. **Updating quirks** → 7. **Tie-break rule**  

  **Timeline (American English):**  
  *(Total: 90 min)*  

  ---

  ### **0. Groundwork: Sharp Probabilities Recap (5 min)**  
  - *Do:* Poll the group: "You see a fair coin. What’s P(heads)? What EU rule do you use?"  
  - *Why:* Establish baseline—sharp priors use expectation. Preempts "imprecise = lazy Bayes."  

  ---

  ### **1. Credal Sets: What Imprecise Probabilities *Are* (10 min)**  
  - **Define:** "Your credence isn’t a single probability. It’s a *set* of probabilities compatible with your evidence."  
  - **Example (Ellsberg Urn):**  
    - Urn A: 50 red balls, 50 black balls (known).  
    - Urn B: 100 red/black balls, unknown ratio (imprecise).  
  - **Key move:** "Your belief about Urn B isn’t ‘I think it’s 50-50’ or ‘maybe 30-70.’ It’s *all* ratios are possible. The evidence rules nothing out."  
  - *Preempt misconception:* "This isn’t a confidence interval (frequentist tool) or sampling noise. It’s about *evidential ambiguity*."  

  ---

  ### **2. Nuke "Second-Order Probability" (15 min)**  
  - *Why now?* Must come **before decision rules**—otherwise they’ll mentally average the set.  
  - **Their intuition:** "Can’t we just put a flat distribution over the credal set?"  
  - **Kill it:**  
    1. *Conceptual:* "A second-order distribution *adds* information. The credal set represents *ignorance*—no basis to favor any probability in it."  
    2. *Example punchline:* "If you assign a uniform distribution over Urn B’s ratios, you’d be indifferent between betting on Urn A-red vs. Urn B-red. But are you?" (Spoiler: No one is.)  
  - *Preempt misconception:* "This isn’t unfinished calculation. The math is done—the set *is* the answer."  

  ---

  ### **3. Decision Rules & Where They Diverge (20 min)**  
  - **Introduce 3 rules** (using Ellsberg bets):  
    - **Γ-Maximin:** Maximize worst-case EU (Urn A: min EU = 0.5. Urn B: min EU = 0 → prefer A).  
    - **Γ-Maximax:** Maximize best-case EU (Urn B: max EU = 1 → prefer B).  
    - **E-Admissibility:** Pick options optimal under *some* probability in the set (could choose either urn).  
  - **Conflict demo:** Show betting choices where:  
    - Γ-Maximin prefers A.  
    - Γ-Maximax prefers B.  
    - E-admissibility permits both.  
  - *Preempt misconception:* "Maximin doesn’t guarantee ‘undominated.’ An option can share the same worst case as a rival but lose elsewhere."  

  ---

  ### **4. Updating: When Evidence *Widens* Beliefs (10 min)**  
  - **Example (Ellsberg 3-color):**  
    - Urn: 30 red, 60 yellow/blue (unknown mix).  
    - Prior credal set: P(red)=0.3, P(yellow)∈[0,0.7], P(blue)=0.7−P(yellow).  
    - *Learn "not red":* Posterior set: P(yellow|¬red)∈[0,1], P(blue|¬red)=1−P(yellow|¬red) → *wider* imprecision.  
  - **Punchline:** "Learning eliminated red but *increased* uncertainty about yellow/blue. More evidence ≠ narrower intervals."  

  ---

  ### **5. Thin Spread vs. Clash Spread (10 min)**  
  - **Thin spread (no evidence):** "No data about Urn B’s composition—pure ignorance."  
  - **Clash spread (conflicting evidence):** "Two experts: one says P(yellow)=0.4, another says P(yellow)=0.6. You trust both equally → credal set {0.4, 0.6}."  
  - **Why distinguish?**  
    - Thin spread → rules like Γ-maximin make sense (guard against worst case).  
    - Clash spread → E-admissibility may be fairer (each expert gets a "vote").  
  - *Preempt misconception:* "Both are valid imprecise credences—neither implies laziness."  

  ---

  ### **6. Your Tie-Break Rule (10 min)**  
  - **State it:** "First, drop options dominated *across the whole set*. Then, among survivors, pick the one preferred by the largest subset of probabilities."  
  - **Where it fits:** After standard rules—it’s a hybrid (E-admissibility + "majority vote").  
  - **Is it novel?** Yes: It weights the *size* of the favoring subset, not averages. Contrast with Hurwicz criterion.  
  - *Caution:* Mention *after* standard rules to avoid early confusion.  

  ---

  ### **7. Final 10 min: Test Question**  
  - **Pose:** "You’re choosing between two bets on the Ellsberg 3-color urn *before* learning anything. Bet X pays $100 if red. Bet Y pays $100 if yellow.  
    - Γ-Maximin says avoid both (min EU = 0).  
    - But suppose you *must* choose one. What would you do? Why?"  
  - **Why it works:**  
    - Tests grasp of rules *and* credal sets. Strong answers: "Y is E-admissible (optimal if P(yellow)>0.3), X isn’t (always EU≤30)."  
    - Catches if they retreat to sharp priors ("I’d assume P(yellow)=0.35").  

  ---

  ### **What to Refuse (Say This Explicitly):**  
  - "We’re not covering lower previsions or Choquet integrals today. Why? Because you need credal sets solid first—those are generalizations for later study."  
  - "No time for advanced updating rules (e.g., natural extension). Stick to standard conditioning on the set."  

  ---

  **Why Ellsberg (and not coins):**  
  - Coins invite "unknown bias = prior distribution." Ellsberg’s ambiguity is irreducible.  
  - No "right" prior to dig out—the paradox persists even after math.  
  - Directly contrasts risk (Urn A) vs. ambiguity (Urn B).  
  - Frequencies are explicit but *not sampling noise*—the urn setup fixes compositions.  

  **Misconception Triage:**  
  | **Misconception**               | **When to Kill**           | **How**                                                                 |
  |----------------------------------|----------------------------|-------------------------------------------------------------------------|
  | "Second-order probability"      | Immediately after defining | Urn B vs. Urn A choices; no basis for weighting                         |
  | "Confidence interval"           | During credal set def      | "CIs are frequentist; this is epistemic"                               |
  | "Unfinished calculation"        | When defining sets         | "The set *is* the final answer—adding a distribution invents evidence" |
  | "Always Γ-Maximin"              | Decision rules section     | Show Γ-Maximax & E-admissibility as alternatives                       |
  | "Maximin ⇒ undominated"         | During rule conflict       | Display a payoff matrix where non-optimal options share the same min   |
  | "Evidence always narrows"       | Updating section           | 3-color urn after learning ¬red                                        |

  **End strong:** Dismiss them arguing about whether clash spreads deserve more "caution" than thin spreads—that’s the point.
