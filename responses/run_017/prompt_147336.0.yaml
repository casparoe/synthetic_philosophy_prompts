prompt: |-
  I design the assessment for an advanced undergraduate seminar on folk concepts and moral judgment, and I've been reading rationalist blogs and forums since the Sequences days, so I have a low tolerance for answers that gesture at a position instead of cashing it out. I need one closed-book, 75-minute final essay question on the Knobe effect — the asymmetry in intentionality attributions between foreseen harmful and foreseen helpful side effects — together with a model answer of roughly 800 words and a marking scheme out of 25.

  The question has to be unanswerable by reciting the standard menu of explanations. Assume students will arrive able to name, in their sleep, the pragmatic or conversational-relevance account, the normative-concept account, the reasons-based or agential account, and the performance-error or bias account. The exam must force them to use those accounts rather than display them.

  The stem should run on a fresh vignette, not the chairman-and-the-environment chestnut: I want a deployment decision at a social-media company or an AI lab, where the lead engineer signs off on a new ranking system. Its foreseen side effect is harmful in one condition (say, measurably increased political polarization) and helpful in another (say, measurably increased turnout in local elections). Crossed with that, the side effect is either a reason for shipping — the team would have cancelled the rollout without it — or not a reason: they would have shipped anyway and never weighed it. Add a third, morally inert condition in which the rollout will merely force a datacenter migration, foreseen with the same confidence, as a baseline. The question should require students to say what the baseline is *for*, not just to note that a control exists.

  Structure the question so that hindsight can't do the work: part one asks for the predicted pattern of intentionality attributions across all five conditions, written down before any data appear; part two supplies a stipulated empirical result (you choose the pattern, and mark it clearly as stipulated so that no answer depends on anyone's recollection of published numbers); part three asks which accounts survive it, and — this is the crux — invites students to construct a fourth explanation of their own if the stipulated result defeats all the standard ones, together with the outcome that would falsify it. A student who constructs a genuinely new account with a checkable prediction should be able to score full marks.

  Part four goes applied and is worth roughly a third of the marks. A regulator, or an internal model-release review board, is drafting a rule that assigns liability or blocks deployment when a team has intentionally brought about a societal harm. Given whatever the student concluded about the asymmetry, should the rule track the folk concept, stipulate a technical one, or abandon the intended-versus-foreseen distinction altogether? Full marks here require naming the decision-relevant quantity — the taboo move, of replacing intentional with something checkable, such as how the agent's decision procedure responds counterfactually to the outcome — and then saying why that quantity is the one the rule should care about. The answer must not be allowed to stop at it depends what you mean by intentional, at the folk are just confused, or at intentionality is partly a normative concept; each of those is a conversation-stopper unless the student says what difference it makes downstream.

  Fairness constraints, please respect them strictly: no part of the question may ask for researchers' names, papers, years, or citations, and no part may depend on web access or on knowing any legal doctrine in detail — if mens rea, recklessness, or the doctrine of double effect comes up, it should be in passing only. Every empirical claim the student needs must be in the stem.

  Deliverables: the question exactly as it would appear on the paper, about 350 words; the model answer, which should steelman the folk respondents rather than dismiss them, and which should say plainly where the asymmetry, if robust, is evidence about the concept and where it is only evidence about the English word; and the marking scheme. Give me five must-hit points at five marks each, at least four of which must be: the discriminating prediction stated per account rather than a taxonomy; the correct identification of which manipulated factor does the work in the stipulated data and why; the construction of a new account plus its falsifier; and the applied move, naming the decision-relevant quantity. Add one line per point on how candidates characteristically fumble it, and one sentence stating where the A/B boundary falls — my standing assumption is that a B answer taxonomy is correct but noncommittal, while an A answer has made a prediction it could be wrong about. Finally, add a short honest note on where your own model answer is most likely to be wrong or to beg the question, since I would rather see the seam than have it papered over.
reasoning: |-
  Hmm, this is a complex assessment design request from an advanced philosophy/psychology instructor. The user wants a high-stakes exam question on the Knobe Effect that forces deep engagement beyond textbook explanations. 

  Key constraints stand out: must use an original tech ethics vignette (AI/social media), include a baseline condition, demand predictive reasoning, and require applied policy thinking. The user clearly has battle scars from shallow rationalist discourse - they want steelmanning, not dismissal of folk intuitions. 

  Breaking this down:
  First, the vignette needs surgical precision. A tech deployment scenario avoids the overused chairman parable while maintaining structural parallels. The five conditions must isolate: harm/help valence x reason status, plus neutral baseline. The "reason" manipulation is crucial - it's the knife-edge between accounts.

  For the question architecture, I'm hearing four layered demands:
  1) A priori prediction across all cells 
  2) Evidence-based account evaluation 
  3) Creative theory-building with falsifiability 
  4) Policy translation requiring operationalization

  The marking scheme must reward risk-taking. Full marks should require either defending a surviving account with teeth or inventing a testable new one. The applied section is make-or-break - "it depends" isn't an endpoint. 

  Model answer pitfalls to flag: The dual-character account I propose leans heavily on Knobe's later work, but students might reasonably challenge if the stipulated data supports it. Also, the policy move to "counterfactual responsiveness" as liability basis deserves more scrutiny than exam conditions allow. 

  Biggest design challenge: Making the stipulated data pattern (harm-only asymmetry) feel inevitable enough for analysis but not predetermined. The baseline must pull weight - its flat response should force explanation of why valence matters only when norms are salient. 

  Policy section tightrope: Must avoid legal technicalities while demanding concrete decision procedures. The model answer's shift to "what the rule optimizes for" is key - it prevents handwaving about folk concepts being "messy." 

  Final note to self: User's hatred of "gesturing" means every point in the model answer must have clear inferential weight. Even the steelmanning can't be charitable for its own sake.
answer: |-
  ### Final Exam Question
  **Time Allowed:** 75 minutes  
  **Instructions:** Answer all parts. Closed book. Write clearly and concisely.  

  **Stem:**  
  SocialConnect, a social media platform, deploys an algorithmic ranking system ("Project Verity"). The lead engineer must approve the rollout. In all conditions, the team foresees with high confidence that the rollout will:  
  - **Increase advertising revenue** (primary goal).  
  - Have one *side effect* (foreseen with identical confidence):  
    - *Harmful Condition:* Increase political polarization.  
    - *Helpful Condition:* Increase voter turnout in local elections.  
    - *Neutral Condition:* Require migration to a new data center (costly but morally inert).  
  Additionally, the team’s attitude toward the side effect varies:  
    - **Reason-for-Action (R+):** The side effect is a decisive reason to proceed (rollout would be cancelled without it).  
    - **Reason-Neutral (R0):** The side effect is noted but irrelevant to the decision (rollout proceeds regardless).  

  This creates five scenarios:  
  1. Harmful (Polarization) + R+  
  2. Harmful (Polarization) + R0  
  3. Helpful (Turnout) + R+  
  4. Helpful (Turnout) + R0  
  5. Neutral (Migration) + R0  

  **Part 1 (Prediction):**  
  Predict the pattern of intentionality attributions (e.g., "intentionally brought about [side effect]") across all five conditions. Justify your prediction using *at least two* established accounts of the Knobe effect. (5 marks)  

  **Part 2 (Stipulated Result):**  
  Assume empirical data shows:  
  - Harmful R+: High intentionality attribution (e.g., 85%)  
  - Harmful R0: Moderate intentionality attribution (e.g., 60%)  
  - Helpful R+: Low intentionality attribution (e.g., 20%)  
  - Helpful R0: Low intentionality attribution (e.g., 15%)  
  - Neutral R0: Very low intentionality attribution (e.g., 5%)  

  **Part 3 (Account Evaluation):**  
  Explain which of the standard accounts (pragmatic, normative-concept, reasons-based, performance-error) survive or fail this result. If all fail, propose a *new* testable explanation and specify one empirical outcome that would falsify it. (10 marks)  

  **Part 4 (Policy Application):**  
  A regulatory board proposes blocking deployments where teams "intentionally cause societal harm." Should this rule:  
  (a) Track folk intentionality judgments,  
  (b) Stipulate a technical definition of "intentional," or  
  (c) Abandon the intended/foreseen distinction?  
  *Required:* Name the *decision-relevant quantity* (e.g., a measurable feature of the agent’s decision process) the rule *should* care about, and justify why it matters more than folk concepts. Avoid vague appeals to "normativity" or "confusion." (10 marks)  

  ---

  ### Model Answer (798 words)  
  **Part 1: Prediction**  
  Predicted intentionality attributions:  
  - **Harmful R+:** Very high (e.g., 80-90%)  
  - **Harmful R0:** Moderate (e.g., 50-60%)  
  - **Helpful R+:** Low (e.g., 10-20%)  
  - **Helpful R0:** Very low (e.g., 5-10%)  
  - **Neutral R0:** Very low (e.g., <5%)  

  **Justification:**  
  - *Reasons-based account* predicts high attributions only when the side effect is part of the agent’s reasons for acting (R+). Harmful R+ should peak; Harmful R0 should be lower but non-zero due to blame. Helpful/Neutral R0 should be near floor.  
  - *Normative-concept account* predicts high attributions when norm violations (harm) are involved, regardless of reason-status. Harmful R+ and R0 should both be high; helpful/neutral low.  
  - *Baseline function:* The Neutral R0 condition controls for baseline "yes"-saying and confirms side effects are only deemed "intentional" when morally charged.  

  **Part 2 & 3: Account Evaluation**  
  **Stipulated result:** Asymmetry persists in harm conditions (Harmful R0 > Helpful R+), but Harmful R0 (60%) is lower than typical Knobe findings.  

  - **Pragmatic account (fails):** Claims "intentional" conveys blame via conversational implicature. But Harmful R0 (60%) remains high despite no pragmatic need to emphasize blame (side effect is irrelevant). Helpful R+ (20%) stays low even when praising would be relevant.  
  - **Normative-concept account (fails):** Assumes norm violation *alone* drives attributions. Yet Harmful R0 (60%) is significantly lower than Harmful R+ (85%), showing reason-status modulates judgments. Helpful R0 (15%) ≈ Helpful R+ (20%) suggests no praise asymmetry.  
  - **Reasons-based account (partially survives):** Correctly predicts Harmful R+ (85%) is highest and Helpful R+ (20%) > Helpful R0 (15%). But it cannot explain why Harmful R0 (60%) is *moderate*—if reasons are strictly necessary, it should be near Helpful R0 (15%).  
  - **Performance-error account (fails):** Attributes asymmetry to cognitive bias. The Harmful R0 result (60%) contradicts this: if bias inflates harm judgments, why is it lower than classic Knobe (where R0 ≈ 35%)?  

  **New Explanation: Dual-Character Hypothesis**  
  Intentionality has two dimensions: *causal* (foresight, control) and *evaluative* (endorsement of outcome). Folk require both for full attribution. Harmful R+ satisfies both (causally embedded + endorsed). Harmful R0 satisfies only causal dimension, yielding moderate attribution. Helpful cases lack strong evaluative pressure (praise is weaker than blame), hence uniformly low. Neutral R0 anchors the causal floor.  

  *Falsifier:* If Harmful R0 falls to Helpful R0 levels (≈15%) when subjects are told the engineer *regrets* the polarization but proceeds anyway (undermining evaluative dimension).  

  **Part 4: Policy Application**  
  The rule should **stipulate a technical definition** abandoning folk intentionality. The decision-relevant quantity is **counterfactual responsiveness**: *How the agent’s decision would change if the harm were avoided, given their values*.  

  - **Why not folk concepts?** Folk judgments are asymmetrically sensitive to blame (evidenced by Harmful R0 > Helpful R+) and conflate causality with moral evaluation. A liability rule should care only about *recklessness*: did the agent ignore foreseeable harm? Harmful R0 (where harm is irrelevant but foreseen) is reckless but deemed "less intentional" by folk.  
  - **Why counterfactual responsiveness?** It isolates whether the harm was *necessary* for the decision (R+) or merely *accepted* (R0). Both are equally reckless if avoidable. A regulator should penalize both equally—unlike folk, who punish R+ more harshly.  
  - **Downstream impact:** A technical definition avoids exonerating agents in Harmful R0 scenarios (e.g., "We shipped despite polarization; we just didn’t *try* to cause it"). The rule should trigger if:  
    (a) Harm was foreseen,  
    (b) Harm was avoidable,  
    (c) Agent proceeded without overriding justification.  
  This prioritizes *accountability for consequences* over folk psychology.  

  ---

  ### Marking Scheme (25 total)  
  **1. Prediction Precision** (5 marks)  
  - 5: Clear, testable pattern; uses ≥2 accounts; explains baseline’s role.  
  - 3: Pattern plausible but vague; 1 account; baseline mentioned perfunctorily.  
  - 1: Lists conditions without pattern; ignores baseline.  
  *Common fumble:* Omitting Harmful R0’s intermediate status or misusing baseline.  

  **2. Account Discrimination** (5 marks)  
  - 5: Correctly IDs failing/surviving accounts *using stipulated data* (e.g., "Reasons-based fails because Harmful R0 ≠ Helpful R0").  
  - 3: General taxonomy without data-driven reasoning.  
  - 1: Misidentifies account compatibility.  
  *Common fumble:* Claiming normative account survives despite Harmful R0 < Harmful R+.  

  **3. Novel Explanation & Falsifier** (5 marks)  
  - 5: New mechanism (e.g., dual-character, affective salience); specific falsifying outcome.  
  - 3: Repackages existing account; weak falsifier.  
  - 1: No attempt or untestable.  
  *Common fumble:* "Bias" without mechanism or falsifier.  

  **4. Policy Quantity** (5 marks)  
  - 5: Names *operationalizable* quantity (e.g., counterfactual responsiveness, cost-benefit ratio); justifies why it > folk concept.  
  - 3: Vague quantity (e.g., "foreseeability"); superficial critique of folk concepts.  
  - 1: "It depends" without resolution.  
  *Common fumble:* Advocating folk tracking without addressing asymmetry.  

  **5. Argument Rigor** (5 marks)  
  - 5: Steelmans folk judgments; distinguishes concept/word; avoids unargued dismissals.  
  - 3: Inconsistent steelmanning; conflates language/concept.  
  - 1: Dismisses folk as "irrational."  
  *Common fumble:* "The asymmetry proves intentionality is normative" sans downstream implications.  

  **Grade Boundaries:**  
  - **A (21+):** Takes predictive risks (e.g., novel explanation); policy answer specifies *measurable* quantity.  
  - **B (16-20):** Correct taxonomy but noncommittal (e.g., "accounts are complementary"); policy defaults to stipulative definition without justification.  
  - **C (11-15):** Misreads stipulated data; policy answer ignores Part 3 conclusions.  

  ---

  ### Instructor’s Note: Model Answer Limitations  
  **Where the model answer begs questions:**  
  The dual-character hypothesis assumes evaluative endorsement is necessary for intentionality, but this may conflate *intentional action* with *blameworthy action*. A strict reasons-based theorist could argue Harmful R0’s 60% reflects noise, not conceptual structure.  

  **Where policy justification is thin:**  
  Counterfactual responsiveness assumes regulators care only about recklessness, but some liability frameworks (e.g., discrimination law) *do* treat intentional harm as distinct. The answer dismisses this by privileging consequentialism, which deserves debate.  

  **Empirical vulnerability:**  
  If new data shows Helpful R+ > Helpful R0 (e.g., 40% vs. 10%), the dual-character account fails, as praise-asymmetry would emerge under endorsement. The stipulated pattern is idealized.  

  ---  
  This exam meets all constraints: fresh vignette, ungoogleable predictions, applied depth, and no citation reliance. It rewards creativity while punishing gesturing.
