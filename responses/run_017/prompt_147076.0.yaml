  (2) Harm is *proportionally targeted* at the problem-causing organisms,  
  (3) The method avoids *gratuitous suffering* where feasible,  
  (4) Bystander harm is minimized below a severity-dependent threshold."**

  ---

  ### Clause Breakdown (Motivated by Cases)
  1. **Non-discretionary problem**  
     - *Definition:* A threat to health, safety, essential resources, or ecosystem stability. Cosmetic/convenience goals excluded.  
