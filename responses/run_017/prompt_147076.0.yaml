       - Rose spray (not fine) → Bees are bystanders; problem is discretionary.  
       - Locusts (fine) → Entire swarm is causally responsible.  
     - *Repairs tentative principle:* "Targeted at organisms actually causing the problem" is retained but expanded with *proportionality* (e.g., species-specificity required where possible).

  3. **Avoid gratuitous suffering**  
     - *Definition:* Methods causing prolonged suffering are impermissible if equally effective/accessible humane alternatives exist.  
