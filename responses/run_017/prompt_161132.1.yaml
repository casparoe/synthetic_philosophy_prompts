prompt: |-
  I manage a three-person outreach team at a city benefits-access office, and most weeks we send short letters, texts, and phone scripts to residents who appear eligible for Medicaid, SNAP, or a utility-arrearage program but haven't enrolled. The decisions I need help with come up constantly — we produce roughly forty message variants a quarter, each reviewed in a single twenty-minute slot by two staff members with no philosophy or behavioral-science training, with me signing off and anything contested going to our director. Because our funder audits a sample of these messages and asks for the reasoning, whatever procedure we use has to end in a short written rationale, and it has to degrade gracefully: we usually have no A/B test, no idea why an earlier message worked, and very little information about the individual recipient's actual circumstances, literacy, or stress level. A disagreement last month made this concrete for me. We sent a letter saying that neighbors in the recipient's ZIP code had already renewed and that they should confirm by Friday to keep their coverage — the deadline was invented and there is no coverage to lose, since the letter goes to people who were never enrolled. My colleague thinks this is obviously fine because it moves people into benefits they're entitled to and that we know are good for them; I think something is wrong with it that isn't captured by "does it work" or "is anyone lied to," and I'd rather have a procedure than keep having this argument.

  Reading around on my own, the best core idea I've found is that persuasion engages the target's reasons while manipulation somehow bypasses or subverts them — but I can't hand that to my staff, because the hard question in each case is precisely whether a given technique is tracking the recipient's reasons or going around them. The operational version I've been toying with is a kind of flip test: if the program were mildly bad for this particular resident, or if their own reasons genuinely pointed against enrolling, would the same technique still push them to enroll anyway? A deadline and a social-proof claim would still work in that flipped case, so on my test they aren't tracking reasons; a sentence explaining that the program covers a specific drug the recipient is taking would stop working, so it is. I'm not confident this is the right test rather than a proxy that mostly tracks deception or the sheer effectiveness of the technique, and I'd like you to keep it if it survives and replace it with something better if it doesn't. Please write my team a decision procedure built on whatever the philosophy of this distinction actually supports — ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no and sends the message back for redrafting, and where it explicitly hands the decision to a person because the remaining question is one of values rather than facts (for instance, whether enrolling people in benefits they're entitled to can justify a means we've already classified as manipulative). It has to be runnable in twenty minutes by a non-specialist, so any term it uses needs an operational test attached rather than a definition — give me a check for "bypasses the recipient's reasons" that doesn't presuppose the answer. It also has to say what to do when a step can't be answered at all, as will often happen when we know almost nothing about the recipient. Please tell me which distinctions have to survive the simplification and which you dropped as unusable at our level, and be explicit about which steps are judgment calls dressed up as procedure.

  Run it on four live cases and show the work: (1) the invented-deadline social-proof letter above; (2) a reply card on which "yes, enroll me" is pre-checked, so that doing nothing enrolls you; (3) a phone script that opens with what the household loses by not enrolling and states a funding deadline that is genuinely true — I expect the procedure to tell me something here that I will not like, and I'd rather see that than have it quietly tailored to spare my current practice; and (4) a case where the recipient is an eighty-year-old with low literacy and probable mild cognitive impairment, where the procedure should either give an answer or stop and explain why it can't. Please don't give me a literature review, citations, or reading suggestions; I have no library access and only want the operationalized procedure, worked through, plus an honest final note on what the procedure cannot settle and where it will misfire.
reasoning: |-
  Hmm, this is a complex ethical and operational challenge from a benefits outreach manager. They need a practical decision procedure to evaluate whether their outreach messages cross the line from persuasion to manipulation.

  The core tension is between effectiveness (getting eligible people enrolled) and ethical communication. The manager has identified a useful distinction - persuasion engages reasons while manipulation bypasses them - but needs it operationalized for non-philosopher staff. Their proposed "flip test" (would the technique work even if the program were bad?) is insightful but needs refinement.

  Key constraints: 
  - Must produce written rationales for funder audits
  - 20-minute review time by untrained staff
  - Often lacks recipient-specific information
  - Must degrade gracefully (work with incomplete data)
  - Needs clear "stop and redraft" thresholds

  I'll build a 5-step procedure with:
  1. Truthfulness check (factual accuracy)
  2. Transparency check (clarity about program nature)
  3. Agency check (preserves recipient's choice architecture)
  4. Relevance check (arguments tailored to recipient's situation)
  5. Final proportionality judgment (for borderline cases)

  The "flip test" gets incorporated into Step 4 as the "reversibility principle": Would this appeal still work if the program weren't beneficial? If yes, it bypasses reasons.

  For the live cases:
  1. The fake deadline/social proof letter fails Step 1 (false urgency) and Step 2 (implies existing coverage)
  2. Pre-checked reply card fails Step 3 (presumed consent violates agency)
  3. Phone script with true loss framing passes if it sticks to facts
  4. Elderly recipient case triggers Step 4's "unknowable relevance" clause - requires special handling

  Important limitations: 
  - The procedure can't resolve value conflicts (e.g., ends justifying means)
  - May be too restrictive for crisis situations
  - Cognitive impairment requires separate protocol
  - Effectiveness tradeoffs remain unaddressed

  The written output will be the full procedure plus case applications, with emphasis on where judgment calls occur and what the framework can't decide.
answer: |-
  Here is a decision procedure for your team, designed to distinguish persuasion from manipulation in outreach messaging. It prioritizes operational tests over philosophical definitions, degrades gracefully with limited information, and produces audit-ready rationales. The core principle is **respect for the recipient's agency**: persuasion helps people make informed choices aligned with *their* reasons; manipulation overrides or circumvents their reasoning.

  **Decision Procedure: Outreach Message Review**  
  *(Complete in sequence; max 20 mins per message)*  

  1. **TRUTH CHECK**  
     *Question: Does the message contain any false, misleading, or invented claims?*  
     - **Test:** Could a reasonable recipient interpret any statement as factual when it is not? (Check: dates, deadlines, eligibility rules, consequences, statistics, or implied authority.)  
     - **Evidence:** Compare against program guidelines. If no info exists, assume it’s invented.  
     - **Outcome:**  
       - **Fail (STOP):** Redraft. *Rationale: "Claim X is unsupported/untrue."*  
       - **Pass:** Proceed to Step 2.  
     - **Unknowable?** Default to *pass* if no evidence of falsehood.  

  2. **TRANSPARENCY CHECK**  
     *Question: Is the program’s nature and your intent clear?*  
     - **Test:** Would a recipient understand:  
       a) This is an *offer* (not an obligation, threat, or existing enrollment)?  
       b) The *actual consequence* of responding/not responding?  
       c) Your role as a *benefits advisor* (not an authority figure)?  
     - **Evidence:** Scan for clear language (e.g., "you may qualify," "apply today"). Flag implications of urgency or penalty.  
     - **Outcome:**  
       - **Fail (STOP):** Redraft. *Rationale: "Message obscures intent/consequence [specify]."*  
       - **Pass:** Proceed to Step 3.  
     - **Unknowable?** Default to *pass* if intent/consequence is explicitly stated.  

  3. **AGENCY CHECK**  
     *Question: Does the message design preserve the recipient’s active choice?*  
     - **Test:**  
       a) Is "doing nothing" a neutral option (e.g., no pre-checked boxes)?  
       b) Are opt-out paths as clear as opt-in paths?  
       c) Does it avoid exploiting inattention/inaction?  
     - **Evidence:** Review call-to-action mechanics.  
     - **Outcome:**  
       - **Fail (STOP):** Redraft. *Rationale: "Design undermines active consent via [mechanism]."*  
       - **Pass:** Proceed to Step 4.  

  4. **RELEVANCE CHECK** (Applies to arguments, not just facts)  
     *Question: Would the appeal work *only* if the recipient values the benefit?*  
     - **Test (Reversibility Principle):**  
       *"If this program were *harmful* to the recipient, or if their personal reasons opposed enrollment, would this message still push them to enroll?"*  
       - **YES** = Bypasses reasons → **Manipulative**  
       - **NO** = Tracks reasons → **Persuasive**  
     - **Evidence:** Evaluate message triggers:  
       - *Social proof*, *artificial urgency*, *loss framing* → Often still work if harmful → **Flag manipulative**.  
       - *Personalized benefits* (e.g., "covers your diabetes medication"), *cost savings* → Require recipient to value the benefit → **Flag persuasive**.  
     - **Outcome:**  
       - **Manipulative (CONTINGENT):** Proceed to Step 5 for judgment.  
       - **Persuasive (PASS):** Approve. *Rationale: "Appeal aligns with recipient’s potential reasons (e.g., [benefit])."*  
       - **Unclear:** Proceed to Step 5.  
     - **Unknowable?** If no recipient info exists (e.g., no health/literacy data), assume *persuasive* UNLESS using urgency/social proof.  

  5. **PROPORTIONALITY JUDGMENT** (Human decision)  
     *Question: Does the potential benefit justify the manipulative technique?*  
     - **Consider:**  
       a) Severity of manipulation (Step 4).  
       b) Certainty of recipient eligibility/need.  
       c) Risk of harm (e.g., stress, distrust).  
     - **Outcome:**  
       - **Approve:** *Rationale: "Technique [X] is manipulative but justified due to [evidence of high need/low risk]."*  
       - **Reject:** Redraft. *Rationale: "Technique [X] unduly overrides agency given [context]."*  
     - **Unknowable?** Default to *reject* if risk/need is unclear.  

  ---

  **Applied to Your Cases**  
  *(Rationale format: [Step] Outcome → Verdict)*  

  1. **Invented-deadline social-proof letter**  
     - Step 1: **FAIL** (Invented deadline; implies existing coverage to lose).  
     - *STOP. Redraft. Rationale: "Falsely claims coverage loss and artificial deadline."*  

  2. **Pre-checked "yes" reply card**  
     - Step 3: **FAIL** (Inaction ≠ consent; no neutral option).  
     - *STOP. Redraft. Rationale: "Pre-checked box subverts active choice."*  

  3. **Phone script: True funding deadline + loss framing**  
     - Step 1: **PASS** (Deadline true).  
     - Step 2: **PASS** (Clear offer/consequence).  
     - Step 3: **PASS** (Choice preserved).  
     - Step 4: **MANIPULATIVE** (Loss framing works even if benefit is harmful → "Reversibility Test" → Proceed to Step 5).  
     - Step 5: **JUDGMENT CALL** (Loss framing exploits fear. *Your team must decide:* Is this justified by SNAP/Medicaid’s life-saving benefits? Default without evidence: Reject).  
     - *Contingent on Step 5. Rationale if approved: "Loss framing manipulative but proportionate given critical benefits."*  

  4. **80yo, low literacy, cognitive impairment**  
     - Step 1-3: **PASS** (Assume message is factual/transparent/agentic).  
     - Step 4: **UNKNOWABLE** (Cannot assess relevance without knowing values/needs).  
     - *STOP. Special handling required: Use simplified language; avoid urgency/social proof; add caregiver contact option. Rationale: "Insufficient data to assess relevance; defaulting to low-pressure design."*  

  ---

  **What Survived Simplification & What Didn’t**  
  - **Kept:** Core distinction (agency/responsiveness to reasons → "Reversibility Test"), truthfulness, transparency, and choice architecture as actionable proxies.  
  - **Dropped:** "Recipient’s reasons" as a standalone concept (too abstract); intent of sender (unknowable); emotional appeals (permissible if truthful and non-coercive).  

  **Honest Limitations**  
  1. **Judgment Calls Dressed as Procedure:** Step 5 (Proportionality) is entirely values-based. The test can’t resolve "Is enrolling people always good enough to justify manipulation?" That debate continues.  
  2. **Blind Spots:**  
     - Cannot detect coercion via tone/format (e.g., overly aggressive language).  
     - May reject effective techniques (e.g., loss framing) your funder permits.  
     - Fails in crises (e.g., imminent eviction) where urgency is real.  
  3. **Misfires:**  
     - **False negatives:** May approve messages that feel "icky" but pass all checks (e.g., excessive guilt-tripping).  
     - **False positives:** May reject benign nudges (e.g., "Most people renew in 10 mins!") due to social-proof flag.  
  4. **What It Can’t Settle:**  
     - Whether "mild" manipulation is ever acceptable.  
     - How to prioritize effectiveness vs. ethics when outcomes are unknown.  
     - Handling vulnerable populations beyond adding disclaimers.  

  **Final Note:** This procedure makes ethical tradeoffs explicit but won’t end all disagreement—especially in Step 5. It *will* force clearer rationales ("We used loss framing because...") and curb the worst practices. For contested Step 5 cases, escalate to your director early.
