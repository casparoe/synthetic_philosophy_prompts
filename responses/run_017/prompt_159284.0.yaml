prompt: |-
  Over dinner last night I had a long and inconclusive argument with a friend — she's an economist, and her position was that the backward-induction verdict in the centipede game is neither a prediction nor really a recommendation, but simply what rationality means, with the empirical fact that people pass several times before taking being noise generated by imperfectly rational subjects. I disagreed and yet couldn't say what I wanted instead. We are both auditing the same graduate game-theory course — the centipede came up last week, together with the common-knowledge-of-rationality argument and the reputation-style story about a small prior probability of facing a non-maximiser — and I came away realising that I have no clear idea what I would count as an adequate account of rational play in that game, which is why the argument kept going round in circles.

  So, before I read any further into the literature, I want the specification. Write me the desiderata that any adequate theory of how to play the centipede game would have to meet, where 'adequate' is fixed for two purposes at once: it must be able to advise a player who is actually sitting at, say, the fourth node wondering whether to take or to pass — that is, it must say something useful at nodes which the theory itself assigns probability zero — and it must be precise enough to be coded into an agent-based simulation whose output could be compared with laboratory play. For each requirement give the case or consideration behind it, i.e. why it is a genuine requirement rather than the taste of one camp, and mark which requirements are non-negotiable and which are negotiable or merely local preferences. Please stress-test the list against three variants I sketched afterwards, because my friend's answer did not obviously survive them: (i) a 'leaky' centipede in which, at each node, Nature terminates play with a known small probability and both players receive a fixed fraction of the current pot — several people at the table said this obviously makes passing reasonable, and I want to know whether a good theory is obliged to agree; (ii) a 'linked' pair of centipedes played consecutively against the same partner, where the size of the pot in the second game depends on how far the first game got, which seems to reopen the reputation story but ought not, on a sound view, to change the verdict; (iii) a version in which you do not observe your opponent's move directly but receive a noisy signal of it, so the game is no longer one of perfect information — I would like a requirement about how the theory's verdict should behave as the noise tends to zero.

  Finally, flag any pair or subset of the desiderata that you suspect cannot be jointly satisfied — that is the part I most want, since if the list is internally inconsistent then my friend and I were arguing over an imaginary good — tell me which single requirement excludes the largest number of otherwise attractive accounts, and add a one-line verdict on each of the usual suspects: the common-knowledge argument, the reputation story, level-k and cognitive-hierarchy models, quantal-response equilibrium, and social-preference explanations. Please don't give me citations, references or a reading list: I want the criteria themselves, not a tour of who said what. British English throughout, and please keep the whole answer, table included if you use one, to no more than 900 words.
reasoning: |-
  Hmm, the user is grappling with a deep philosophical and technical question about rationality in the centipede game after an argument with an economist friend. They're auditing a game theory course and want desiderata for an adequate theory of rational play that must both advise players at "off-path" nodes and be computationally implementable for simulations. They also provide three variants to stress-test the requirements.

  The core tension here is between normative rationality (what players should do) and descriptive accuracy (what humans actually do). The user's friend represents the strict game-theoretic view where backward induction is definitional, while the user intuitively senses this is inadequate for real decisions. The three variants cleverly probe edge cases: (i) leaky centipede introduces uncertainty, (ii) linked games test reputation effects, and (iii) noisy signals examine robustness to imperfect information.

  I need to construct desiderata that satisfy both practical decision-making needs and simulation requirements. Key angles to cover: the theory must handle non-equilibrium nodes meaningfully, remain stable under perturbations, and scale to repeated/multistage interactions. The variants suggest that probability-zero events shouldn't break the theory, reputation mechanisms need principled constraints, and continuity matters as information imperfections vanish.

  For the desiderata, I'll focus on these critical aspects: Actionability (non-negotiable), Implementation Precision (non-negotiable), Uncertainty Robustness (tested by leaky variant), Reputation Discipline (tested by linked games), Noise Continuity (tested by noisy signals), and Empirical Compliance. The leaky variant shows why Uncertainty Robustness is essential—without it, the theory can't explain why passing becomes reasonable under small termination risks. Reputation Discipline prevents arbitrary relabeling of deviations as "types," while Noise Continuity ensures verdicts don't wildly flip with near-perfect information.

  I suspect Actionability and Strict Equilibrium Consistency might conflict. Backward induction purists would say advising at probability-zero nodes is incoherent, but demanding such advice is precisely why standard game theory feels inadequate here. Among existing approaches: Common Knowledge fails Actionability, Reputation Stories often violate Reputation Discipline, Level-K lacks Implementation Precision for general use, QRE struggles with Uncertainty Robustness, and Social Preferences miss Precision. The tradeoffs highlight why no single model dominates—the user's frustration about circular arguments likely stems from this inherent tension.

  The user's request for conflicting desiderata pairs is particularly astute. If we insist that theories must strictly comply with equilibrium definitions (which assign zero probability to deviations) while also demanding actionable off-path advice, we're asking for logical contradictions. This suggests their debate with the friend might indeed be about an "imaginary good"—a perfect theory satisfying both may not exist. The way forward probably involves accepting some formalism (like trembles or epistemic models) that explicitly bridges this gap.
answer: |-
  Here are the desiderata for an adequate theory of rational play in the centipede game, designed to meet your dual requirements of advising players at any node and enabling simulation coding. Requirements are categorised as **Non-Negotiable** (NN), **Negotiable** (N), or **Local Preference** (LP). Stress tests against your variants follow the list.

  ### Desiderata for an Adequate Theory
  1.  **Actionability (NN):** The theory must prescribe a definite action (Take/Pass) for a player at *any* node, including those unreached under its own equilibrium path. *Rationale:* A player sitting at node 4 needs guidance, even if the theory predicted they wouldn't be there. Ignoring such nodes renders the theory useless for actual decision-making. *Variant Stress:* Crucial for (i) leaky & (iii) noisy centipedes where off-path play is frequent.

  2.  **Implementation Precision (NN):** The theory's prescriptions and underlying mechanics (beliefs, updating rules, decision criteria) must be algorithmically specifiable for agent-based simulation. *Rationale:* To test against lab data, agents must execute the theory deterministically or stochastically based on codable rules. Vagueness prevents falsification.

  3.  **Uncertainty Robustness (NN):** The theory's verdict must respond continuously and sensibly to small perturbations in the game structure or payoffs. *Rationale:* Rationality should not be hypersensitive to infinitesimal changes. *Variant Stress (i - Leaky Centipede):* A good theory *must* prescribe passing for several rounds if the termination probability is small but positive, as the expected value calculation fundamentally changes. Failing this suggests the theory confuses logic with knife-edge assumptions.

  4.  **Reputation Discipline (N):** If the theory invokes reputation (e.g., a "prior on non-rational types"), the mechanism for belief updating and its impact on play must be rigorously defined *and* consistent with the information structure. Reputation cannot be an ad-hoc justification for observed deviations. *Rationale:* Prevents "tacking on" reputation to salvage equilibrium predictions without theoretical discipline. *Variant Stress (ii - Linked Centipedes):* A sound theory *should not* fundamentally alter its verdict (e.g., suddenly prescribe passing early in game 1) solely because a future linked game exists, *unless* the linkage provides a clear, codifiable mechanism for reputation building that was absent in the single game. The verdict might change, but the *mechanism* must be robust and not arbitrary.

  5.  **Noise Continuity (N):** Under imperfect information (e.g., noisy signals of opponent moves), the theory's verdict should converge to its perfect-information verdict as the noise level approaches zero. *Rationale:* Rational play should be stable under vanishingly small uncertainties. *Variant Stress (iii - Noisy Signals):* As signal noise → 0, prescriptions at all nodes should approach those for the perfect-information centipede.

  6.  **Empirical Compliance (LP):** The theory should generate aggregate behaviour (e.g., distribution of take nodes) broadly consistent with robust laboratory findings (e.g., most players pass several times). *Rationale:* While not defining rationality, significant, persistent deviation from typical human behaviour warrants explanation, perhaps via the theory's assumptions about bounded rationality or social preferences. (This is LP as pure rationality theories may reject it).

  ### Suspected Inconsistencies & Key Exclusions
  *   **Primary Tension:** **Actionability (NN)** directly conflicts with theories demanding **Strict Equilibrium Consistency** (an implicit, often unstated requirement where prescriptions *only* make sense on the equilibrium path, and off-path behaviour is undefined or "irrational" by fiat). You *cannot* have both meaningful advice at node 4 *and* maintain that reaching node 4 is a zero-probability event indicating irrationality, without introducing auxiliary constructs (e.g., trembles, explicit belief models).
  *   **Major Excluder: Uncertainty Robustness (NN).** This requirement eliminates standard backward induction under common knowledge of rationality (CKCR) for the base game, as it fails catastrophically in the leaky variant (i). It also challenges theories relying on exact, non-robust calculations.

  ### One-Line Verdicts on Usual Suspects
  *   **Common-Knowledge Argument (CKCR/BI):** Fails Actionability (no defined off-path play) & Uncertainty Robustness (fragile to leaks/noise).
  *   **Reputation Story:** Often fails Reputation Discipline (ad-hoc type specifications) & Implementation Precision (vague priors/updating).
  *   **Level-k / Cognitive-Hierarchy:** Can satisfy Actionability & Implementation Precision, but specific level assumptions are often arbitrary (failing Reputation Discipline if used for linked games) and may lack robust theoretical grounding.
  *   **Quantal-Response Equilibrium (QRE):** Strong on Implementation Precision & potentially Empirical Compliance via noise parameter, but may lack clear Actionability (prescribes probabilities, not definite advice) and struggles with Uncertainty Robustness if the "noise" isn't linked to game perturbations.
  *   **Social-Preference Explanations:** Can address Empirical Compliance but typically fail Implementation Precision (vague social utility functions) and Reputation Discipline (difficulty explaining linked games strategically).

  ### Stress Test Outcomes
  *   **(i) Leaky Centipede:** A good theory **is obliged** to prescribe passing for several rounds if the termination probability is small but positive. Failure here indicates the theory isn't robust (Desideratum 3).
  *   **(ii) Linked Centipedes:** A sound theory **should not** inherently change the *rationale* or *fundamental nature* of play in the first game solely due to the linkage. Reputation mechanisms *must* be rigorously defined if invoked (Desideratum 4). The verdict *might* change, but only via a disciplined, codifiable mechanism.
  *   **(iii) Noisy Signals:** As noise → 0, the theory's prescriptions **must** converge to those of the perfect-information game (Desideratum 5). Gradual change is acceptable; a sudden jump at noise=0 is not robust.
