prompt: |-
  I teach a 90-minute undergraduate seminar on norms and social order: 18 students, one room, no projector, and I would rather not lecture. Design a runnable simulation in which the class is divided into small "settlements" that must each decide how much rule-following to demand of their own members and then live with the consequences over several rounds.

  Four things should be built into the mechanics rather than said afterwards. First, each settlement secretly receives an "ecology" card that changes what strictness is worth — a shared external threat, scarce resources, or rapid turnover of members, say — so that identical rules produce different outcomes and students discover that the question has no context-free answer. Second, build in an asymmetry between conduct the group can observe and conduct it cannot: enforcement should grow expensive and start producing visible-but-hollow compliance, so students feel the point where more rules buy less order. Third, allow migration, with members carrying an internalized disposition to comply or to improvise that the receiving settlement did not choose, so the costs of any regime fall hardest on those who never consented to it. Finally, I want them to hit this wall: a settlement that tries to be permissive about everything, including about how firmly it enforces its own permissiveness, cannot do so — the rules about the rules have to be held fixed by someone.

  Give me materials, roles, a scoring system needing no real money, and a round-by-round timeline. Then a debrief mapping specific moments onto specific features of the tight/loose distinction — without using those words or naming the distinction until the debrief, so students meet the problem before the label. Tell me what will predictably go wrong when I run it and how to handle it, and be frank about what the simulation cannot reproduce, particularly anything that depends on norms being inherited rather than chosen.

  Lead with a single sentence stating the core mechanism and what participants will have felt by the end; then give the design. No preamble and no restating of my request.
reasoning: |-
  We are going to run a simulation in which groups of students form settlements and decide on a strictness level for rules, then experience how their choices and external factors (like ecology and migration) affect order and group cohesion over several rounds, ultimately confronting the inherent tension in maintaining a permissive regime without fixed meta-rules.

  Core mechanism: Settlements set rule strictness levels each round, which affects their order score, but they also face ecological challenges that alter the value of strictness, hidden information about these challenges, and migration that introduces members with different compliance dispositions, leading to a tangible experience of the costs and limits of rule enforcement and the necessity of fixed meta-rules.

  Materials:
  - 18 students divided into 3 settlements of 6 each (adjust if needed, but 3 groups of 6 is ideal).
  - Index cards (or paper) for:
    - Ecology cards (one per settlement per round, but some ecologies last multiple rounds): 
        - "Shared External Threat": High strictness is very beneficial (e.g., +2 to order if strictness >=4, else -1).
        - "Scarce Resources": Medium strictness is best (e.g., strictness of 3 gives +2, strictness <2 or >4 gives -1).
        - "Rapid Turnover": Low strictness is best (e.g., strictness <=2 gives +2, strictness >=4 gives -1).
        - "Stable Conditions": No bonus or penalty (all levels neutral).
    - Disposition cards for each student: 
        - "Rule-Follower" (RF) or "Improviser" (I). Initially, each settlement has 3 RF and 3 I (randomly assigned).
    - Rule strictness tracker for each settlement (a piece of paper where they write their chosen strictness level each round, from 1 to 5).
    - Order score tracker for each settlement (a piece of paper to record their order score each round).
    - Migration tickets: 2 per settlement per round (except round 1). These are passed to the instructor and redistributed to allow migration (details below).

  Roles:
  - Each settlement has no formal roles; they decide collectively. However, you might assign a "scribe" to record decisions and scores.

  Scoring System:
  - Each round, settlements get an order score based on:
    Base order = average compliance in the settlement.
    Compliance calculation: 
        - Rule-Followers (RF) always comply (100%).
        - Improvisers (I) comply at a rate of (5 - strictness) * 20% (so if strictness=1, they comply 80%; strictness=5, they comply 0%).
    Then, the ecology card modifies the base order (as per the examples above).
    Additionally, if the strictness level is 4 or 5, the settlement incurs an "enforcement cost": subtract 1 from order for strictness=4, and 2 for strictness=5 (to represent the cost of monitoring and enforcement, and the potential for hollow compliance).
  - Order score is on a scale of -3 to 5 (theoretical, but likely between 0 and 4). Settlements track cumulative order (sum over rounds).

  Migration:
  - At the end of each round (starting after round 1), each settlement gets 2 migration tickets (representing the opportunity for 2 members to leave). 
  - The instructor collects the tickets and then redistributes them: each ticket allows a student to move to another settlement. 
  - How migration happens:
    - Students who wish to migrate (they might be unhappy with their settlement's strictness or ecology) can request a migration ticket from their settlement. The settlement collectively decides who gets the 2 tickets (if there are more than 2 volunteers, they must agree). 
    - The instructor then collects the tickets and the names of the migrants. The instructor also collects the disposition (RF or I) of each migrant.
    - The migrants are then randomly reassigned to the other two settlements (or if only one migrant, then to one of the others). The receiving settlement must accept them and add them to their group (so groups may grow to 7 or shrink to 5). 
    - Important: The receiving settlement does not know the disposition of the incoming migrant until after they have been added. The migrant keeps their disposition card and joins the new group.

  Round-by-Round Timeline (90 minutes total):

  Round 0: Setup (10 minutes)
  - Divide into 3 groups of 6. 
  - Give each student a disposition card (3 RF and 3 I per group, shuffled). Students should keep their disposition card private (only they know it). 
  - Explain the rules:
    - Each round, the group will decide on a strictness level (1-5). 
    - Strictness affects the compliance of Improvisers (I): compliance rate = (5 - strictness) * 20%. Rule-Followers (RF) always comply 100%.
    - Base order = (number of RF * 100% + number of I * (compliance rate)) / total members (so a percentage, then scaled to 0-5 by multiplying by 5? to make it a score). Actually, let's define base order as a number between 0 and 5: 
          base order = [ (number of RF * 1.0) + (number of I * (5 - strictness)/5) ] * (5 / total members)
          Example: 3 RF and 3 I, strictness=3: 
              RF: 3 * 1.0 = 3
              I: 3 * (5-3)/5 = 3 * 2/5 = 1.2
              total = 4.2, then multiplied by 5/6 ≈ 3.5 -> base order ≈ 3.5
    - Then apply ecology effect (a fixed bonus or penalty based on strictness and the ecology card).
    - Then subtract enforcement cost: if strictness=4, subtract 1; if strictness=5, subtract 2.
    - The order score for the round is the result (can be negative).
  - Explain migration: after each round, settlements will have 2 migration tickets. They decide which two members (if any) leave. Migrants are reassigned randomly to other groups. The new group does not know the migrant's disposition until after the round when they reveal their cards (if they wish, but they can keep it secret? Actually, for scoring, the group must know the composition. So at the beginning of each round, the group should know the number of RF and I? But wait: the group does not know individual dispositions, only the total? No, we must track the numbers. So at the start of each round, the group counts their RF and I by having members reveal their disposition? But that breaks the private nature. Instead, we can have the group report their composition to the instructor at the beginning of each round? Then the instructor can tell them the base order formula? Alternatively, we can have the instructor do the calculation. Let's adjust:

  Revised scoring procedure:
    - At the beginning of each round, after migration, each group counts and reports to the instructor their total members and the number of RF and I (they can do this by having each member show their disposition card to the group, but then they know each other? Actually, that's okay because in a settlement, people might know each other's tendencies. But if we want to preserve some privacy, we can have them report privately to the instructor. However, for the simulation to run, the group must know their composition to decide on strictness. So we let the group know their own composition. They don't know the composition of other groups until after migration? Actually, migration happens at the end of the round, so at the start of a round, the group knows exactly how many RF and I they have.

  Round 1 (10 minutes):
  - Each settlement receives an ecology card (drawn randomly by the instructor). They keep it secret. 
  - Groups discuss and set their strictness level (1-5) for the round.
  - Groups calculate their base order (as above) and then apply the ecology effect (from their card) and enforcement cost. The instructor can provide a table or formula to help.
    Example ecology effects (to be printed on the card):
      - Shared External Threat: If strictness >=4, +2; else -1.
      - Scarce Resources: If strictness==3, +2; if strictness<=2 or >=4, -1; else 0.
      - Rapid Turnover: If strictness<=2, +2; if strictness>=4, -1; else 0.
      - Stable Conditions: No effect.
  - Record order score.

  Migration after Round 1 (5 minutes):
  - Each settlement gets 2 migration tickets. The group decides which 2 members will leave (they give the tickets to those members). 
  - The migrants take their disposition cards and go to the instructor. 
  - The instructor randomly reassigns each migrant to one of the other two settlements (if there are two migrants, they might go to the same or different). 
  - The receiving settlements add the migrants (and their dispositions) to their group.

  Round 2 (10 minutes):
  - Groups now have new members. They count their RF and I. 
  - They receive the same ecology card as before (unless the instructor decides to change it? We can have ecologies last 2-3 rounds). For simplicity, let's have each ecology last two rounds. So in round 2, same ecology.
  - Groups set strictness again, calculate order (with the same ecology effect and enforcement cost), and record.

  Migration after Round 2 (5 minutes): same as before.

  Round 3 (10 minutes):
  - Now, change the ecology: each group draws a new ecology card (randomly, from the deck). 
  - Groups set strictness, calculate order with new ecology, and record.

  Migration after Round 3 (5 minutes): same.

  Round 4 (10 minutes): 
  - Same ecology as round 3.
  - Groups set strictness, calculate order, and record.

  Final migration and then end.

  Debrief (20 minutes): 
  - Total cumulative order scores are compared. 
  - Discussion: 
    - How did your group decide on strictness? 
    - Did you change it? Why? 
    - What happened when new members arrived? 
    - Did your ecology card influence your decisions? How?
    - Did you experience a point where increasing strictness didn't help or even hurt? (Enforcement cost) 
    - What happened when you tried to be very permissive? (Especially if a group set strictness=1 or 2 and then received many improvisers from migration, leading to low compliance and order.) 
    - What about the group that tried to have no fixed rules about rules? (This is the meta-rule point: if a group sets strictness=1 and then in the next round, they change it to 5, that's allowed. But then they might have inconsistency. The point is that the rule about how rules are made must be fixed. In the game, the rule-setting process is collective and happens every round, so it's flexible. But if a group tried to be permissive and then faced an influx of improvisers, they might have to change, but they can. However, the fixed meta-rule in the game is that the group must set a strictness level each round by group discussion. They cannot avoid that. So the simulation doesn't force a fixed meta-rule, but the instructor can point out that the process of decision-making (group vote? consensus?) is a meta-rule that they held fixed. If they had changed that, chaos might ensue. But the game doesn't model that explicitly.)

  Mapping to the tight/loose distinction without using the words:
  - The ecology factor: different environments require different levels of rule strictness (threats require tightness; stability allows looseness).
  - The migration: when new members come in with different dispositions, a tight group (high strictness) might suppress the improvisers (but at high cost) or a loose group (low strictness) might see order break down if too many improvisers arrive.
  - The enforcement cost: at high strictness, you get diminishing returns because of the cost of enforcement and the possibility of hollow compliance (people follow the letter but not the spirit, or they just fake it).
  - The meta-rule: if a group tries to be permissive about everything, including how they set rules (e.g., by having no fixed procedure and changing it every round arbitrarily), they might find it hard to maintain order. But note: the game does not explicitly model changing the rule-setting procedure. So we can highlight that the rule about how rules are made (the decision-making process) was fixed (they had to meet and decide as a group each round) and that allowed them to function. Without that, they wouldn't be able to set any rules.

  Predictable Problems and Solutions:
  - Problem: Time management. Each round might run over. 
    Solution: Use a timer and be strict. Have a visual timer.

  - Problem: Groups might not understand the scoring. 
    Solution: Provide a clear formula and an example. Do a practice round.

  - Problem: Migration might lead to very uneven group sizes (e.g., one group of 4 and another of 8). 
    Solution: Cap group sizes? Or allow migration only to groups that are below 7? But that complicates. Alternatively, accept it as part of the simulation (real settlements have varying sizes). 

  - Problem: Students might resist migrating because they don't want to leave their group. 
    Solution: Encourage them to role-play: if they are an improviser in a very strict group, they might want to leave. Or if they are a rule-follower in a very permissive group, they might leave.

  - Problem: The ecology effect might be too strong or not felt. 
    Solution: Adjust the numbers if needed during the game (but be transparent). 

  What the simulation cannot reproduce:
  - Norms being inherited: in this game, norms (strictness) are chosen each round. In reality, norms are often internalized through socialization and are stable over time. 
  - The simulation does not model the emergence of norms from repeated interaction; it is a collective choice. 
  - The simulation does not have a mechanism for norms to be enforced by peers without a central enforcement cost (the cost is abstract). 
  - The simulation does not capture the emotional or identity-based aspects of norm compliance.

  This simulation design is a starting point. Adjust as needed for your class.
answer: |-
  **Core mechanism:** Settlements collectively set a strictness level (1-5) each round, shaping compliance and order, but face hidden ecological pressures, migration of members with fixed dispositions, and escalating enforcement costs, compelling groups to experience how context, unobservable conduct, unconsented burdens, and meta-rule instability constrain their ideal rules.  
  By the end, participants will have felt:  
  - The frustration of rules failing under hidden ecological pressures.  
  - The tension between visible compliance and invisible rebellion.  
  - The disruption of migrants undermining their chosen order.  
  - The impossibility of sustaining a purely permissive regime.  

  ---

  ### **Materials**  
  1. **Index cards**:  
     - **18 Disposition cards**: 9 "Rule-Follower" (RF), 9 "Improviser" (I). RFs comply 100% with rules; Is comply at `(6 - strictness) × 20%` (e.g., strictness=3 → 60% compliance).  
     - **3 Ecology cards**:  
       - *Threat*: High strictness (4-5) gives +2 order; low (1-2) gives -1.  
       - *Scarcity*: Medium strictness (3) gives +2; high/low gives -1.  
       - *Turnover*: Low strictness (1-2) gives +2; high (4-5) gives -1.  
     - **3 Rule-setting tokens** (e.g., numbered chips): "Strictness" (1=loose, 5=tight) and "Enforcement Priority" (Low/Medium/High).  
  2. **Scoreboards**: 3 posters showing:  
     - **Order Score** (0–10 per round): Base compliance + ecology bonus - enforcement cost.  
     - **Wealth Points** (cumulative, no real money): Start at 10/settlement.  
  3. **Migration slips**: Blank paper strips.  

  ---

  ### **Roles**  
  - **Settlements**: 3 groups of 6 students. Each group:  
    - Secretly draws one Ecology card (unchanged all game).  
    - Receives 3 RF and 3 I Disposition cards (randomly assigned, kept private).  
  - **Instructor**: Manages rounds, enforces migration, reveals outcomes.  

  ---

  ### **Scoring System**  
  Each round, settlements calculate:  
  1. **Base Compliance**:  
     - RFs: Always 100%.  
     - Is: `(6 - strictness) × 20%` compliance.  
     - *Example*: 3 RFs + 3 Is at strictness=4 → RFs: 3 full, Is: 40% of 3 ≈ 1.2 → Total compliance: 4.2/6 = 70% → **Base Order = 7** (scale 0–10).  
  2. **Ecology Effect**: Apply card bonus/penalty to Base Order.  
  3. **Enforcement Cost**:  
     - If Enforcement Priority = Low: No cost.  
     - Medium: −1 Order if strictness ≥4.  
     - High: −2 Order if strictness ≥4 AND −1 if strictness=3 (represents visible-but-hollow compliance).  
  4. **Final Order Score**: Base + Ecology − Enforcement Cost (capped at 0–10).  
  5. **Wealth Change**: Order Score − 5 (e.g., Score=7 → +2 Wealth). Negative Wealth blocks strictness ≥4 next round.  

  ---

  ### **Round-by-Round Timeline** (Total: 70 min)  
  **Setup (5 min)**:  
  - Divide into 3 settlements. Give each: Ecology card (secret), 3 RF/3 I cards (private), Rule tokens, Scoreboard starting at 10 Wealth.  

  **Round 1: Rule-Setting (10 min)**  
  - Groups set Strictness (1–5) and Enforcement Priority (Low/Med/High).  
  - **Calculate Order**: Instructor guides each group through scoring.  
  - **No migration yet**.  

  **Round 2: First Consequences (10 min)**  
  - Same as Round 1, but add:  
    - **Enforcement realism**: Groups with strictness ≥4 and Med/High Enforcement lose 1 Wealth (cost of monitoring).  
  - **Migration**: Each group expels 1 member (secret vote). Migrants reveal disposition and join a new group (instructor reassigns randomly).  

  **Round 3: Tipping Point (15 min)**  
  - Groups reset rules.  
  - **Calculate Order**: Highlight enforcement costs (e.g., "Your High Enforcement made 2 members resentful − visible compliance dropped").  
  - **Migration**: Each group expels 1 member; migrants move.  
  - **Critical twist**: Instructor forces one settlement to set Enforcement Priority to Low (testing permissiveness).  

  **Round 4: Collapse (10 min)**  
  - Groups reset rules.  
  - **Calculate Order**: Apply Wealth penalties if negative.  
  - **Final migration**: Same as above.  

  **Scoring (5 min)**: Wealth totals determine "most prosperous settlement."  

  ---

  ### **Debrief (20 min)**  
  **Map experiences to concepts (avoiding terms like "tight/loose")**:  
  1. **Hidden context**: "When your rules failed despite working elsewhere, what did that reveal about judging others’ choices?" → *Ecological pressures make universal rules impossible.*  
  2. **Enforcement costs**: "When strict groups saw compliance drop despite high effort, what was the invisible trade-off?" → *High monitoring breeds resentment/hollow conformity; observability limits control.*  
  3. **Migration**: "How did newcomers disrupt your settlement? Who bore the cost?" → *Unconsented members strain cohesion; rules impose burdens unevenly.*  
  4. **Meta-rules**: "Why did the group forced to low enforcement struggle? Could they opt out of all constraints?" → *Permissiveness about enforcement is self-undermining; meta-rules must be fixed.*  
  **Reveal the framework**: Finally, name "tight/loose" and link to student experiences.  

  ---

  ### **Predictable Problems & Mitigations**  
  - **Problem**: Migration causes uneven group sizes.  
    - *Fix*: Cap groups at 7; excess migrants become "nomads" (sit out, return next round).  
  - **Problem**: Students ignore ecology cards.  
    - *Fix*: After Round 1, announce: "Some settlements’ rules are failing for hidden reasons."  
  - **Problem**: Rule-Followers dominate discussion.  
    - *Fix*: Require settlements to vote anonymously on strictness.  
  - **Problem**: Wealth feels abstract.  
    - *Fix*: Tie Wealth to tangible stakes (e.g., "Wealth<0 loses voting rights").  

  ---

  ### **Limitations**  
  - **Inherited norms**: Dispositions (RF/I) are assigned, not socialized. Students won’t experience norm internalization across generations.  
  - **Power structures**: Enforcement is a collective choice, not emergent hierarchy.  
  - **Non-material norms**: Rules lack cultural meaning (e.g., taboo); compliance is purely rational.  
  - **Scale**: Small groups miss macro-dynamics (e.g., societal polarization).  

  **Instructor note**: Emphasize these gaps in debrief to distinguish *chosen* rules from *inherited* norms.
