    3. Outside consultant (e.g., "Dr. Aris Thorne, Ontology Consultant").

  Technical points to cover:
  - The self is an abstraction defined over the stories (narratives) told about and by the user.
  - It is like a center of gravity: real in terms of location, counterfactual-supporting, but not a physical thing and not storable as a separate entity.
  - The model: a vector (the "self-vector") derived from a stream of narrative events (both first-person and third-person).
  - First-person reports are just more events in the stream, not ground truth.
  - Evaluation: show that a model using the self-vector outperforms one using raw events in predicting user behavior.
  - One honest admission of where the model fails.

