  2. Bifurcation: two clusters of narratives with no bridge -> the system doesn't pick one as the real self, but must decide what to serve and how to bill.

  Non-goals: We are not storing the self as a separate entity; we are not determining the "true" self.

  Migration plan: Deprecating the old `self` service. The plan must show the cost of low-narrative-mass cases (infant accounts, coma, dementia) without explicitly commenting on the philosophical implications.

  Open questions: Include issues around the mass threshold and what happens when the self is not computable.

  Humor: Comes from the extreme technical consistency and the reviewers' comments. The skeptical engineer tries to sneak in a real self, Legal worries about implications, and the ontology consultant makes overly academic comments.

  Let's outline the sections:

  ### Summary
  Briefly state that we are deprecating the old `self` service and replacing it with a derived view of the self as an abstraction over narrative events. Emphasize that this is not a stored entity but computed on demand.

  ### Background
  Explain the old `self` service and its problems (e.g., storing a static representation, becoming stale). Introduce the center of narrative gravity analogy: just as the center of gravity of an object is a useful abstraction that isn't a physical part, the self is a derived point from narratives. Note that prior internal analysis showed that a model using a derived self-vector outperformed raw events by 12% in behavior prediction.

  ### Non-goals
  - Storing the self as a persistent entity.
  - Determining the "true" self or inner state.
  - Resolving narrative conflicts (e.g., when two clusters emerge).

  ### Design
  Describe the system:
  - Input: A stream of narrative events. Each event has a source (user, friend, system, third-party) and a timestamp. Events are weighted by recency, source trust score (calibrated by past predictive accuracy), and propagation (how many times it's been echoed).
  - Computation: The self-vector is the weighted average of the narrative events in a high-dimensional space (with dimensions for preferences, beliefs, etc.). The "mass" of an event is its weight. The center of narrative gravity is the point that minimizes the weighted distance to all events.
  - Output: The self-vector, used by downstream services for personalization, billing, etc.
  - Evaluation: Model A (raw events) vs. Model B (self-vector) on predicting next action (e.g., click, purchase). Model B wins by 12% on F1. However, it fails in low-narrative-mass scenarios (e.g., new users) where the vector is unstable.

  ### Edge Cases
  1. **External Self**: Example: User @CelebFan42 has 95% of narrative mass from external sources (fan wiki, gossip sites). The computed center falls in the AWS us-east-1 data center (where the fan wiki is hosted). Downstream services must handle non-geolocated selves.
  2. **Bifurcation**: Example: User @DualLife has two clusters: one for work (professional events) and one for personal (family events) with no bridging events. We compute two centers. For serving, we use the cluster with higher recent activity. For billing, we bill the account once but log two self-vectors. We do not merge them arbitrarily.
     - Skeptical engineer comment: "But which one is the *real* user? We should ask the user to resolve."
     - Author reply: "The user's self-report would be an additional event, which might tip the mass of one cluster, but if the bifurcation is deep, it might not. We must avoid introducing a privileged inner state."

  ### Migration Plan
  - Phase 1: Dual-write to old `self` and new derived view for monitoring.
  - Phase 2: Switch read traffic to derived view, with fallback to old `self` for users below narrative mass threshold (set at 1000 narrative mass units, equivalent to ~100 events). Users below threshold continue on old system until they accumulate mass.
  - Phase 3: Retire old `self` service. Users permanently below threshold (e.g., dormant accounts) are archived as "low-mass entities" and not served.

  ### Open Questions
  - How to handle users with rapidly changing narratives (e.g., identity theft)? The vector might lag.
  - What is the ethical impact of not serving users with low narrative mass (e.g., coma patients)? We currently don't serve them, but should we?
  - Legal: If the self is external (e.g., in a data center), which jurisdiction's laws apply?

  ### Reviewer Comments
  Weave in at least three inline comments:
  1. Skeptical Staff Engineer (Ravi Sharma): Tries to bring back a real self. Example: in the bifurcation edge case, he asks which one is the real user. In the design, he might say: "Aren't we ignoring the user's true preferences? The self-vector might not capture what they *really* want."
  2. Legal (Priya Chen): Worries about compliance. Example: "If the self is computed to be in the EU, does GDPR apply even if the user is in the US?"
  3. Ontology Consultant (Dr. Aris Thorne): Academic and jargon-heavy. Example: "The ontological commitment here is to a processual ontology, which is commendable, but have you considered the mereological implications of distributed narrative events?"

  Let's write the document accordingly.
answer: |-
  ### RFC-0187: The Self as a Derived View  
  **Authors**: A. Finch (Staff Engineer, Identity Platform)  
  **Reviewers**: Ravi Sharma (Staff Engineer), Priya Chen (Legal), Dr. Aris Thorne (Ontology Consultant, MetaLogica Inc.)  
  **Status**: Draft  

  ---

  #### **Summary**  
  This RFC proposes the deprecation of the legacy `self` service (codenamed "Homunculus") and its replacement with a dynamically computed `self-vector` derived from narrative event streams. The `self-vector` is modeled as a **center of narrative gravity (CoNG)**, a real but non-material abstraction analogous to a physical center of mass. It supports counterfactuals (e.g., "would this user click this ad?") and personalization without storing a persistent "self" entity. Migration requires handling edge cases where CoNG resolution fails (e.g., low-narrative-mass users) or produces non-localized outputs (e.g., selves outside the user’s body).  

  ---

  #### **Background**  
  The `self` service historically stored a static JSON blob (user preferences, attributes) updated via batch jobs. This led to staleness (e.g., users outgrowing stored interests) and storage bloat. Analysis showed 73% of attributes were overwritten within 30 days, confirming the `self` as a cache—not a source of truth.  

  The CoNG model treats the self as an emergent property of narrative events:  
  - **Inputs**: Timestamped events (e.g., "user posts 'I love ska'", "friend tags user in 'punk fan' photo", "news site calls user 'influencer'").  
  - **Computation**: The CoNG is the mass-weighted centroid of these events in a 256-dimensional preference-trait space (see **Design**).  
  - **Output**: A transient `self-vector` used by downstream services (recommendation, billing).  

  Benchmarks show a model using the `self-vector` predicts user behavior (clicks, purchases) 12.4% more accurately than raw events alone (F1-score 0.87 vs. 0.77).  

  > **Ravi Sharma (Staff Engineer)**: *"If the self-vector is just a computed point, why does it *feel* like there’s a persistent self? Couldn’t we store a ‘core’ self and append narratives?"*  
  > **A. Finch**: *Storing a ‘core’ reintroduces the staleness problem. The feeling of persistence is an illusion caused by narrative continuity—like a movie appearing fluid at 24fps.*  

  ---

  #### **Non-goals**  
  - Determining a user’s "true" self or resolving ontological disputes.  
  - Storing the self as a discrete entity.  
  - Supporting real-time CoNG computation for all users (prioritize high-mass users).  

  ---

  #### **Design**  
  **1. Narrative Event Stream**  
  - **Sources**: User actions (30% base weight), third-party reports (e.g., tweets, news; 20%), inferred events (e.g., ML-predicted preferences; 10%).  
  - **Mass Assignment**:  
    - Recency: Exponential decay (half-life: 30 days).  
    - Source reliability: Weighted by predictive accuracy (e.g., user self-reports: 1.0, gossip blogs: 0.3).  
    - Propagation: Mass increases with event resharing (per `k`-hop network distance).  

  **2. Self-Vector Computation**  
  - CoNG = (Σ (event_mass × event_vector)) / total_mass.  
  - Updated hourly via streaming job; computed on-demand for low-latency services.  
  - **First-person events**: Treated as high-weight inputs but not privileged (e.g., a user claiming "I’m frugal" is weighted against their $300 impulse buys).  

  **3. Failure Cases**  
  - **Low mass**: No vector emitted if mass < threshold (default: 50 units, ≈100 events).  
  - **Instability**: Vector drift > 5%/hr triggers alerts (e.g., during identity theft).  

  > **Dr. Aris Thorne (Ontology Consultant)**: *"This operationalizes a hermeneutic circle! But consider: without a Cartesian theater, how do you avoid mereological fallacy in vector aggregation?"*  
  > **A. Finch**: *We avoid fallacies by not aggregating—events are points, not parts. The CoNG is a mathematical convenience, like averaging RGB values to define ‘beige’.*  

  ---

  #### **Edge Cases**  
  **Case 1: Externalized Self**  
  - **Scenario**: User @CelebFan (20k followers) has 98% narrative mass from external sources (fan wikis, tweets about them).  
  - **CoNG Resolution**: Vector centroid resolves to AWS us-east-1 (location of dominant fan wiki servers).  
  - **Handling**: Downstream services use geolocation overrides for legal compliance.  

  **Case 2: Bifurcated Self**  
  - **Scenario**: User @WorkLife posts corporate content (mass cluster A) and anarchist memes (mass cluster B) with no intersection (e.g., no "my boss is a tyrant" posts).  
  - **Handling**:  
    - Emit two vectors (A and B).  
    - Serving: Default to higher-mass cluster (A=60%, B=40%).  
    - Billing: Charge one account; split attribution 60/40 for ad revenue.  
    - **No reconciliation**: The system does not arbitrate "true" selfhood.  

  > **Priya Chen (Legal)**: *"If the self is in AWS us-east-1, which privacy laws apply? And for bifurcated users, does GDPR require consent from both selves?"*  
  > **A. Finch**: *Jurisdiction ties to account registration. Consent is an event weighted at mass=1.0—no privileged ‘inner self’ required.*  

  ---

  #### **Migration Plan**  
  1. **Phase 1 (0–30 days)**: Dual-write events to legacy `self` and new event store. Compute CoNG for users above mass threshold (est. 92% of MAU).  
  2. **Phase 2 (31–60 days)**: Shift reads to `self-vector` for high-mass users. Legacy `self` remains for low-mass users (e.g., infants, coma patients).  
  3. **Phase 3 (61+ days)**: Retire legacy `self`. Low-mass users marked `inactive` (no personalization, no billing).  

  **Cost**: 3.8% of MAU (low-mass users) become ineligible for service.  

  ---

  #### **Open Questions**  
  1. **Low-Mass Users**: How should we handle medical coma edge cases (nearly 0 events) without a self-vector? Current design excludes them.  
  2. **Billing for Bifurcated Selves**: If cluster A buys a product and cluster B requests a refund, what dispute policy applies?  
  3. **Mass Threshold Tuning**: Should thresholds vary by jurisdiction? (e.g., California’s CCPA may require serving users with minimal data).  

  > **Ravi Sharma (Staff Engineer)**: *"This feels dystopian. What about the user’s *authentic* self? Could we add a ‘soul’ field for edge cases?"*  
  > **A. Finch**: *The ‘authentic self’ is a narrative cluster like any other. Adding a ‘soul’ violates our non-goals (see §3).*  

  ---

  ### Appendix: Evaluation Metrics  
  | **Model**                     | **Precision** | **Recall** | **F1-Score** |  
  |-------------------------------|---------------|------------|--------------|  
  | Raw events                    | 0.72          | 0.82       | 0.77         |  
  | **Self-vector (CoNG)**        | **0.85**      | **0.89**   | **0.87**     |  
  | *Failure case: mass < 50*     | *0.41*        | *0.38*     | *0.39*       |  

  *Failure note: Low-mass predictions degrade as narratives collapse to noise (e.g., bots, infants).*  

  ---  
  **Approvals Pending**
