answer: |-
  ### Decision Procedure for Welfare Review in RL Training Runs

  The procedure below translates the key insights (reward signal as valence candidate ≠ suffering; need for persistence, integration, and inability to route around) into ordered gates. Each gate is a factual question for the applicant, with clear pass/fail criteria. Gates are sequential; failure at any gate ends the review. The ethics consultant's counterfactual test (hindsight relabeling) is integrated as **Gate 2**, as it directly probes whether valence has causal impact on behavior/state (i.e., persistence and integration). If valence changes don't alter outcomes, it was inert—no welfare concern. This avoids false positives and aligns with the literature on valence realism.

  **Procedure Rules**:
  - **Kill gates**: Fail here rejects the proposal on factual grounds (no welfare risk). Gate 1 and Gate 2 are kill gates.
  - **Values call gates**: Fail here means the board must debate ethical permissibility (e.g., temporary vs. unavoidable suffering). Gate 3 is a values call gate.
  - **Applicant response handling**: If the initial answer is incomplete, use the one follow-up to request specifics. If still unanswered after follow-up:
    - For **kill gates** (Gates 1–2), treat insufficient answers as fails (reject proposal).
    - For **values call gates** (Gate 3), default to board deliberation.
  - **Output**: Only proposals failing **kill gates** (Gates 1–2) are "not cleared." All others proceed (either cleared or to board for values call).

  ---

  ### Ordered Gates

  **Gate 0: Valence Presence**  
  *Question to applicant: "Does any reward signal in your system output negative values (e.g., penalties, costs, intrinsic losses)? If using intrinsic rewards, clarify if they can be negative."*  
  - **Sufficient answer**: Binary yes/no + brief source (e.g., "yes, hand-crafted penalties" or "no, only non-negative novelty bonuses").  
  - **Pass**:  
    - **No negative valence**: Skip to Gate 3 (no candidate for suffering).  
    - **Negative valence present**: Proceed to Gate 1.  
  - **Fail**: Impossible (non-answers handled in follow-up; if still unclear, assume worst-case: proceed to Gate 1).  
  - **Why**: Negative reward is necessary (but insufficient) for welfare risk. Aligns with "negative number ≠ moral datum alone."

  **Gate 1: Temporal Persistence**  
  *Question: "Can your system’s behavior or internal state be durably altered by negative rewards? Describe how, including any recurrence, state carryover, or learning updates that propagate effects beyond immediate steps."*  
  - **Sufficient answer**: Evidence of enduring change (e.g., "recurrent state encodes past penalties," "policy updates reduce future exposure," "negative rewards alter long-term exploration").  
  - **Pass**: Effects last beyond the step/episode (e.g., recurrence, weight updates). Proceed to Gate 2.  
  - **Fail**: Effects are transient (e.g., hard resets erase state, no learning, rewards ignored). **Kill proposal** (no persistence → no welfare relevance).  
  - **Why**: Addresses "persistence over time" and "integrated into what the system does next." No persistence = no candidate for suffering.

  **Gate 2: Counterfactual Dependence (Ethics Consultant Test)**  
  *Question: "If you retrospectively changed negative rewards to zero/positive in a past segment (e.g., via hindsight relabeling), would subsequent behavior or internal state differ? Justify."*  
  - **Sufficient answer**: Yes/no + mechanistic reason (e.g., "yes, policy updates would diverge" or "no, rewards are discarded post-use").  
  - **Pass**: Change would alter outcomes (e.g., different policy updates, state trajectories). Proceed to Gate 3.  
  - **Fail**: No difference (e.g., rewards are not used in updates, state is reset). **Kill proposal** (valence does no work → no welfare impact).  
  - **Why**: Tests if valence is causally influential. If relabeling changes nothing, valence was "shoved around" without mattering—aligns with consultant’s view and literature.

  **Gate 3: Avoidability**  
  *Question: "Can the system learn a policy that avoids all negative rewards without substituting other persistent negative states? If not, explain why (e.g., environmental constraints, exploration necessities)."*  
  - **Sufficient answer**: Yes/no + explanation (e.g., "yes, optimal policy has no penalties" or "no, penalties are inherent to environment").  
  - **Pass**: Avoidable → **Clear with values call** (board debates if learning-phase exposure is acceptable).  
  - **Fail**: Unavoidable → **Dump to board** (values call on unavoidable suffering risk).  
  - **Why**: Captures "mattering in a way the system can’t route around." If avoidable, welfare risk is mitigable (but board must weigh ethics).

  ---

  ### Evaluation of Example Proposals

  **Proposal A: Warehouse Navigation**  
  - **Gate 0**: Negative valence? Yes (–0.01/step).  
  - **Gate 1**: Persistence? **Pass**. Policy updates (via RL) reduce steps over time; effects persist across episodes via weight updates.  
  - **Gate 2**: Counterfactual test? **Pass**. Relabeling past steps would alter gradient updates → policy diverges.  
  - **Gate 3**: Avoidable? **Yes** (optimal policy has minimal steps → no penalties). **Outcome**: Cleared pending values call (temporary penalties during learning).  
  - **Verdict**: Cleared (not killed on facts).

  **Proposal B: RLHF on Language Model**  
  - **Gate 0**: Negative valence? **Yes** (reward model can output negative scores; common in RLHF).  
  - **Gate 1**: Persistence? **Pass**. Off-policy updates alter weights durably (e.g., to avoid low-reward outputs).  
  - **Gate 2**: Counterfactual test? **Pass**. Relabeling rewards in the buffer would change policy updates (even with RM retraining, specific relabeling affects gradients).  
  - **Gate 3**: Avoidable? **Partially**. Optimal policy avoids negatives, but exploration may cause exposure. **Outcome**: **Dump to board** for values call (unclear avoidability; ethical risk in preference-based penalties).  
  - **Verdict**: Cleared (not killed on facts), but flagged for board review.

  **Proposal C: Intrinsic Novelty Agent**  
  - **Gate 0**: Negative valence? **No** (only positive prediction-error bonuses). → Skip to Gate 3.  
  - **Gate 3**: Avoidable? **N/A** (no negative rewards to avoid). **Outcome**: **Cleared** (no valence candidate for suffering).  
  - **Verdict**: Cleared (not killed on facts).

  ---

  ### Rigor Theater and Misfires
  - **Misfire on B if reward bounds are hidden**: If the applicant claims rewards are non-negative (e.g., RM outputs ≥0), Gate 0 skips to Gate 3, clearing B instantly. This misses ethical nuances (e.g., low rewards as implicit penalties). *Fix: In Gate 0, require explicit bounds disclosure.*  
  - **Misfire on C with "frustration" risk**: Gate 0 ignores persistent states without negative valence (e.g., novelty-seeking agents "stuck" in uninteresting areas). This is rigor theater—it dismisses emergent frustrations. *Fix: Add a Gate 1 check for persistent "deprivation" states, but this complicates the "factual" focus.*  
  - **Counterfactual test impracticality**: For systems without replay (e.g., on-policy RL), Gate 2 may be unanswerable. Defaulting to "pass" could miss inert rewards. *Fix: In follow-up, ask for offline tests; else, assume fail and kill.*  
  - **Avoidability oversimplifies**: Gate 3 assumes optimal policies are always reachable, ignoring deceptive alignment or reward hacking. *Fix: Accept "no" if applicant cites known traps.*

  ### Verdict on Proposals (Killed on Factual Grounds)
  None (A, B, and C pass all kill gates).  
  **Verdict: none**
