prompt: |-
  I write a column on forecasting — prediction markets, forecasting tournaments, epidemiological and climate models, and lately the machine-learning systems that now issue probability estimates on the same questions the tournaments do. The question I keep circling is the one the ancient and medieval logicians argued about with the example of tomorrow's sea battle: when an outcome has not happened yet, is there already a fact of the matter about whether it will? I am less interested in the history of that debate than in whether my own verdicts add up to anything, because I have to write about forecasts as if they were right or wrong, and I no longer know what I think I am saying when I do.

  Below are my verdicts. In each case the question is whether the italicized sentence, as I would assert it today, is true now, false now, or neither.

  1. The sun will rise over Reykjavík at 5:41 a.m. on 3 March 2031. Deterministic, computable in principle from present conditions, unknown to me. Verdict: determinately true or determinately false now; my ignorance is irrelevant.

  2. This coin was flipped an hour ago and is now face down on the table showing heads. Verdict: determinately true now that it shows heads. Nothing about the world is unsettled; only my access is.

  3. This fair coin, to be flipped tomorrow, will come up heads. Verdict: neither true nor false now. There is, so far, nothing there to be right or wrong about.

  4. This particular uranium atom will decay within the next hour. Verdict: neither. I resist the suggestion that it is already settled and merely chancy. But the statistical claim that roughly half the atoms in the sample will decay within a given period: determinately true now.

  5. I will file this column by six o'clock tonight. Verdict: neither, and I want something stronger than that — I want to say that what settles it is my deciding later, not my discovering something already fixed.

  6. In 2019, a modelling group projected that hospitalizations in a named country would peak in the second week of April. The peak did occur then. Verdict: I am perfectly willing to say now, retroactively, that their projection was right. I am much less willing to say that the corresponding claim was true in 2019.

  7. In 2015, it was true that the United Kingdom would leave the European Union. Verdict: yes, true then — and yet I also want to say that in 2015 the matter was genuinely open, and that no one was then in a position to know. I know these two pull against each other; I have not managed to give up either.

  8. Either the central bank will cut rates at its next meeting or it will not. Verdict: definitely true — even though, by my verdict in cases of this shape, neither disjunct is true. I assume this costs me something; I would like to be told exactly what.

  9. I will never write a novel. Verdict: false, straightforwardly. But its twin, I will write a novel: neither. I report the asymmetry because I suspect it is a prejudice rather than an insight, and I want to know whether a principle can respect it or only explain it away.

  10. A forecasting system with a perfect record on ten thousand binary questions outputs yes on whether a named country will hold a national election within twelve months. Verdict: I feel a strong pull toward saying the claim is true now in virtue of that record, and an equally strong pull toward saying that nothing yet makes it true.

  11. Two reflexive cases. A column of mine moves a thinly traded market, so that the very act of publishing makes my prediction come out true. And a newspaper prints that a trailhead will be crowded at eight on Saturday morning, with the result that nobody turns up. Verdict: in the first I want to say the claim was not true when I wrote it and became true once published; in the second, that it was on its way to being true and the publication made it false. I do not know whether this means truth values change over time, or whether I have simply described two different claims.

  12. My own distinction, which I have started using in my notes: hard-target claims, where the event is sharply individuated and only its occurrence is unsettled (the coin, the eclipse), versus soft-target claims, where the event itself has no sharp edges until someone stipulates what would count — the city will experience a blackout this summer; the startup will fail; the country will hold a free and fair election. My verdict on soft-target claims is neither true nor false, but for a different reason than in case 3: with the coin I think the world is unfinished, while with the blackout I think the world is fine and the description is loose. I would like the principle to tell me whether these are two kinds of indeterminacy that a single account should unify, or one kind and one piece of sloppiness.

  13. Long after the last mind capable of registering it, the sun will expand and render the earth uninhabitable. Verdict: true, or at any rate truth-valued. I do not want an account on which truth requires possible verification.

  What I want from you is a principle, or a short set of rival principles, stated precisely enough to be applied mechanically: for each clause, the case above that motivated it. Then its verdicts on cases I have not listed — a coin flip that is scheduled but never performed because the flipper is hit by a bus; a claim that an algorithmic trading system will move a price, where the system reads the forecast itself; a claim about an event that will occur after my own death and concerns someone I love; a claim about a coin flipped and read in a sealed room that is then destroyed with no surviving record. And an honest account of which of my verdicts each candidate forces me to abandon, since I would rather drop two of them than hold a principle that is really just my职业 habits in fancy dress.

  One further thing I need addressed, because it bears on my work directly. My professional practice — scoring forecasters, resolving prediction markets, ranking models — behaves exactly as if future outcomes already have determinate values, and as if resolution rules can be written after the fact without changing what the forecast was about. Either that practice refutes my verdicts in cases 3, 5 and 12, or my verdicts show that the practice is a useful fiction. If there is a principle that captures my verdicts, I want to know which way it cuts on that, and I want the answer to say plainly if the honest conclusion is that my trade rests on a convenient incoherence.

  Please keep the answer self-contained: no bibliography, no reading list, no citations, and no naming of historical positions as a substitute for the argument. If my pattern happens to have a name in the literature, one clause saying so is welcome, but the work should be in the principle and in what it makes of the cases.
reasoning: |-
  Okay, let me tackle this forecasting dilemma. The user presents 13 intricate cases about future truths and wants a coherent principle that explains their intuitive verdicts without contradiction. 

  First I notice their core tension: professionally they must treat forecasts as true/false now, but philosophically they doubt this for open futures. Their examples cluster into types - deterministic events (eclipses), quantum randomness (uranium decay), human choices (filing columns), and vague predictions (blackouts). 

  The radioactive atom case (#4) is particularly telling. They reject the "already settled but chancy" view - which suggests they oppose supervaluation theories where indeterminate truths have "shadows" of probability. Yet in #7 (Brexit) they simultaneously hold that "it was true in 2015" AND "genuinely open", which strains logic. 

  For the coin flip never performed (#13 extension), their framework must handle aborted events. If they deem the unfilpped coin neither true/false (#3), consistency demands the same here - but this clashes with their professional scoring that would likely call such predictions "void". 

  The reflexivity cases (#11) reveal their intuition about truth-value mutability. When their column moves markets, they sense truth is created retroactively - almost like a quantum measurement collapsing probability. But this violates classical logic's timeless truth. 

  Perhaps the solution lies in separating ontological status from epistemic practice. We could say:
  - Events with sufficient causal antecedents (eclipses, recorded coin flips) are metaphysically settled
  - Quantum/human choices are ontologically open until resolution
  - But for forecasting purposes, we pretend all are settled to enable scoring

  This preserves their #1, #2, #6 verdicts while accepting that #3, #5, #12 require fictionalism about truth-values. The disjunction (#8) remains problematic - "A or not-A" feels true even when A is indeterminate. One could bite the bullet and say excluded middle fails for futures, but that nukes their whole scoring system. 

  For the novel-writing asymmetry (#9), we might invoke effort constraints: "I will never write" is true because human will can't sustain endless possibility, making its negation indeterminate rather than false. But this feels ad hoc. 

  Ultimately their practice requires two coexisting frameworks: an open future for philosophy, a "block universe" for prediction scoring. The inconsistency isn't fatal - much like quantum physicists use both particle and wave models situationally. The key is transparent context-switching.
answer: |-
  Here's a principled framework derived from your verdicts, designed to handle your cases and expose trade-offs. The core tension is between **ontological settledness** (is the outcome fixed in reality?) and **semantic determinacy** (can we assign truth values to propositions about it now?).

  ### Principle: Contextual Ontic Commitments (COC)
  1. **Truth requires present causal antecedents**: A future-tensed proposition is *determinately true/false now* only if all causal factors necessary for the outcome are already irreversibly fixed in the current state of the world.  
  2. **Indeterminacy via causal openness**: If any causally necessary factor remains unsettled (e.g., unmeasured quantum state, unmade human decision), the proposition is *neither true nor false* now.  
  3. **Descriptive precision matters**: Vague or stipulation-dependent claims ("soft targets") lack truth values until their criteria are resolved, not due to causal openness but due to semantic incompleteness.  
  4. **"True" retrospectively**: Once resolved, we can truthfully report past propositions *as if* they were always settled *only when describing the resolution*, not the past uncertainty.

  ---

  ### Verdicts on Your Cases
  | Case | Your Verdict | COC Verdict | Consistency |
  |------|-------------|------------|------------|
  | 1    | Determinately T/F | T/F | ✓ (Causal chain fixed) |
  | 2    | Determinately T | T | ✓ (Causal fact exists) |
  | 3    | Neither | Neither | ✓ (Causal openness) |
  | 4    | Neither | Neither | ✓ (No fixed decay trigger) |
  | 5    | Neither | Neither | ✓ (Decision unmade) |
  | 6    | Projection "right" retroactively | ✓ (COC Rule 4) | ✓ |
  | 7    | True in 2015 *but* open | **Reject "true in 2015"** | ✗ (COC forbids simultaneous truth + openness) |
  | 8    | "Will or won't" = True | True | ✓ (Tautology; no causal claim) |
  | 9    | "Never write" = False<br>"Will write" = Neither | Asymmetry rejected: **Both neither** | ✗ (COC sees identical causal openness) |
  | 10   | Pull toward T and neither | Neither | ✓ (Perfect record ≠ causal fixity) |
  | 11   | Truth values change | **Reject**: Different claims pre/post-publication | ✗ (COC: Truth values don't change; events do) |
  | 12   | Hard: unsettled event<br>Soft: vague criteria | ✓ Hard: Causal openness<br>✓ Soft: Semantic indeterminacy | ✓ (Distinct but covered) |
  | 13   | True | True | ✓ (Causal chain fixed) |

  ---

  ### Unlisted Cases & COC Verdicts
  1. **Unscheduled coin flip (flipper hit by bus)**  
     - *Claim*: "The coin will land heads"  
     - **COC**: Neither (No flip occurred → no causal antecedents)  

  2. **Algorithmic trading system moves price after reading forecast**  
     - *Claim*: "System X will move price Y at time Z"  
     - **COC**: Neither before forecast publication (causally open);  
       False/True *after* publication if forecast becomes a causal factor.  

  3. **Posthumous event affecting loved one**  
     - *Claim*: "My child will marry in 2050"  
     - **COC**: Neither (Human decisions/chaotic factors unresolved)  

  4. **Coin flipped in sealed/destroyed room**  
     - *Claim*: "The coin showed heads"  
     - **COC**: Determinately T/F (Outcome fixed; epistemic access irrelevant)  

  ---

  ### Addressing Professional Practice
  - **Your practice treats forecasts as having determinate truth values** → This is a **useful fiction** under COC.  
  - **Why it works**:  
    - Scoring systems resolve *retrospectively* using COC Rule 4.  
    - Markets/models track *expected accuracy*, not ontological truth.  
  - **Incoherence?** Only if you conflate *accuracy measures* with *present truth*. COC permits:  
    - Saying *now*: "The forecast has 70% probability of being accurate later"  
    - Saying *later*: "The forecast was accurate"  
    ...without claiming "It was already true when made."  

  ---

  ### Trade-offs Required
  To adopt COC, you must abandon:  
  1. **Case 7's "true in 2015"**: Brexit was *not* determinately true pre-referendum; your intuition that it was "open" is correct.  
  2. **Case 9's asymmetry**: "I will never write" is as indeterminate as "I will write." The asymmetry confuses epistemic likelihood (low probability) with ontological falsity.  
  3. **Case 11's changing truth values**: Truth values don't change; you described different propositions. Pre-publication: "Crowd *would* gather without article" (false). Post-publication: "Crowd *will* gather" (false due to article).  

  ### What COC Preserves
  - Your core intuitions about causal openness (coin flips, decisions).  
  - Retroactive accuracy judgments.  
  - Rejection of verificationism (sun expanding).  
  - Distinction between hard/soft targets.  

  ---

  ### Final Assessment
  Your professional practice isn't incoherent—it operates in the **epistemic mode** (judging forecasts *as if* futures are settled for scoring), while your philosophical verdicts reflect **ontological mode** (distinguishing settled/unsettled realities). COC formalizes this duality. The cost is rejecting "backward truth" (Case 7) and semantic asymmetries (Case 9), but it systematizes your other intuitions and resolves edge cases cleanly. Your trade rests on *pragmatic context-switching*, not dishonesty.
