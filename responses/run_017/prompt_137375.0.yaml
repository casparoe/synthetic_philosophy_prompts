prompt: |-
  Public risk regulation has a shape I have not been able to state as a single principle, and I would like you to reconstruct the decision theory it presupposes — where the object of reconstruction is the whole pattern, not any one of its parts.

  Three features, as I understand them. (1) Agencies monetise mortality risk. A proposed rule that lowers the chance that people die is credited with a benefit equal to the number of statistical deaths averted multiplied by a fixed monetary value per statistical life, and the rule is approved when that figure exceeds its cost. The accounting is linear: twice the population exposed to the same per-person risk yields twice the benefit, however many people that comes to. (2) The same agencies discard small probabilities. A lifetime risk below some de minimis threshold — in the guidance I have seen, often put at roughly one in a million — is treated as negligible and is not carried through the calculation at all, even when enough people are exposed that the expected number of deaths is not negligible. (3) The same governments spend real money against low-probability, enormous-stakes risks: surveys to detect asteroids on Earth-crossing orbits, programmes to secure nuclear materials, pandemic preparedness. There the annual probability is small and the thing at stake is, depending on the case, millions of lives or the shape of everything that comes after.

  Set feature (3) beside the case that everyone in these arguments treats as the reductio. A stranger tells you that unless you hand over your wallet he will, by means he refuses to specify, arrange for an astronomically large number of people to be tortured. Any non-zero credence you give his story, multiplied by a large enough number of victims, outweighs every ordinary use of the money. Nobody funds interventions recommended on that basis, and I do not think the refusal is mere inattention.

  Call fanaticism the thesis that expected value settles the matter on its own: for any sure good and any probability however small, there is some finite stake for which the gamble is to be preferred. Then:

  1. Reconstruct the implicit theory. Does the practice strictly presuppose anti-fanaticism, or is it compatible with plain expected-value maximisation once ordinary empirical claims about which small probabilities are trustworthy are added? Separate what the pattern genuinely requires from what it merely fits well with.

  2. The evidential defence. Distinguish probabilities delivered by a tested model with known error bars — impact frequencies for near-Earth objects, say — from probabilities attached to a bare assertion with no model behind it. Is that distinction enough to keep expected value and dismiss the stranger? Press on the obvious move: a careful agent is uncertain which model is right and should average over models. If averaging gives the stranger's hypothesis any share at all, does the huge stake survive, so that the defence fails? Does model-averaging rescue the regulator, or does it merely relocate the problem?

  3. The structural objection. If the fanatical ordering is unbounded, then for every bet there is a lower-probability, higher-stakes bet that beats it, and no policy is maximal. Is that a reason to think the thresholds are doing real work rather than expressing squeamishness, or is the regress harmless because in practice probabilities fall faster than stakes can be inflated?

  4. Consider a specific anti-fanatical rule: fund an intervention only if its probability of success clears a bar that falls as the stakes rise, but falls more slowly than one over the stakes — require p at least k divided by the square root of the value at stake, or k divided by its logarithm, so that the expected value demanded grows with what is at stake. Does this reproduce (1) through (3)? Where does it place the asteroid survey, and where the stranger? Is it principled or a curve fitted to intuition? And is that what the practice looks like, or does the practice look more like a hard probability floor?

  5. What would have to change. If a government became a convinced fanatic, what would regulatory analysis become — does every budget collapse into whichever long shot names the largest stake, and what happens when two such long shots compete? If instead it placed an upper bound on the value of the future, would feature (3) survive? Would asteroid detection and pandemic preparedness have to be reargued as insurance or as risk-aversion rather than as expectation, and would those arguments be weaker?

  6. Where is the practice underdetermined? Could a bounded-value theorist and a probability-threshold theorist both endorse all three features, and is there any decision the practice actually makes that would tell them apart? Concretely: a programme costing fifty million that reduces this century's chance of civilisational collapse by one in ten thousand, against a programme costing the same that has one chance in a billion of securing 10^18 future lives. Does the practice, as it stands, say anything about that pair — and should it?
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing a puzzle in public risk regulation with three seemingly conflicting features: monetizing mortality risk linearly, ignoring de minimis risks below a probability threshold, yet funding interventions for low-probability catastrophic risks. The user wants to reconstruct the implicit decision theory behind this pattern.

  First, I need to understand the core tension. The linear VSL approach (feature 1) and de minimis cutoff (feature 2) seem at odds with funding asteroid deflection or pandemic prep (feature 3). And the user is clearly bothered by how this relates to fanaticism - where any non-zero probability could justify huge costs if stakes are high enough. 

  Hmm, the stranger extortion example is key here. The user points out that governments don't fund things based on bare assertions of astronomical stakes, even if the expected value calculation would suggest they should. That's the reductio they mention. So the real question is: what principle distinguishes legitimate catastrophic risk prevention from fanatical calculations?

  Let me think about the theories that could explain this. Expected utility maximization alone can't explain the de minimis threshold. But strict anti-fanaticism might be too strong. Maybe it's about epistemic access - only trusting probabilities from validated models? But then the model-averaging problem arises: if we average over models and any model gives the stranger hypothesis non-zero probability, does that force us to pay?

  The structural objection is interesting too. If we allow unbounded value, there's no maximal policy because there's always some lower-probability, higher-stakes option that dominates. That suggests thresholds might be necessary. But maybe in practice, probabilities drop faster than stakes can grow? 

  For question 4, the k/√v or k/log(v) proposals seem like possible compromises. They'd allow funding for asteroid surveys (high stakes, moderately low p) but block the stranger (insanely high v, ultra-low p). But is this principled or just curve-fitting? And does it match actual practice which seems to have hard probability floors?

  The "what would change" scenarios are revealing. If a government became fanatical, budgets would collapse into whichever long shot names the biggest stake - that seems unstable. But capping the value of the future might undermine justification for asteroid defense. Maybe insurance framing is better for feature 3?

  Finally, the underdetermination point. Both bounded-value and probability-threshold theories can explain the three features, but they might differ on edge cases like the 10^18 lives vs. civilization collapse example. Current practice probably doesn't address this, but perhaps it should.

  What ties this together? The user seems to be probing whether there's a coherent philosophy behind risk regulation, or just ad hoc compromises. The answer might lie in pragmatism - using different decision frameworks for different risk domains, with thresholds serving as epistemic filters rather than value statements. But that feels unsatisfyingly vague for someone seeking a single principle...

  The most defensible position might be that feature 3 isn't actually justified by expected value at all, but by something else - like avoiding correlated losses or preserving option value. That would resolve the tension but require reinterpreting why we fund asteroid surveys. I'll need to explore that angle.
answer: |-
  Your query dissects a profound inconsistency in public risk regulation, revealing an implicit decision theory that navigates between fanaticism and practicality. Below is a systematic reconstruction addressing each point, grounded in the tension between expected value maximization and structural constraints.

  ### 1. **Implicit Theory: Anti-Fanaticism or Empirical Pragmatism?**  
  The practice **strictly presupposes anti-fanaticism** but operationalizes it through empirical filters.  
  - **Anti-fanaticism is foundational**: Feature (2) (de minimis thresholds) and the rejection of the "stranger extortion" case demonstrate that regulators treat minuscule probabilities as *epistemically inert* rather than arithmetically negligible. This violates fanaticism’s core tenet (any non-zero probability can dominate with sufficient stakes).  
  - **Empirical constraints refine it**: Agencies accept well-modeled catastrophic risks (e.g., asteroid impacts) because their probabilities derive from validated scientific models (e.g., orbital mechanics), while dismissing "bare assertions" (the stranger) due to unquantifiable uncertainty. However, this is not merely empirical; it reflects a **normative judgment that decision-relevant probabilities require epistemic warrant**.  
  - **Conclusion**: The pattern requires anti-fanaticism but uses empirical credibility to implement it. Pure expected-value maximization is incompatible with feature (2).  

  ---

  ### 2. **Evidential Defence: Model-Averaging and Its Limits**  
  Distinguishing modeled vs. bare probabilities is **necessary but insufficient**.  
  - **Model-based probabilities survive**: Asteroid risk estimates derive from physics-based simulations with error bars, making them "actionable" uncertainties. The stranger’s threat lacks any model, so its probability is not just low but *undefined* in regulatory calculus.  
  - **Model-averaging resurrects the problem**: If an agent averages over models (e.g., "What if the stranger’s claim aligns with an unknown physics model?"), any non-zero probability share *would* imply fanatical spending—unless regulators impose a **prior model plausibility threshold**.  
  - **Resolution**: Practice implicitly uses a **hierarchy of evidence**:  
    - Tier 1: Probabilities from validated models (accepted for catastrophic risks).  
    - Tier 2: Non-quantifiable claims (rejected as "not risks" under de minimis).  
    Model-averaging applies only within Tier 1, avoiding the stranger’s revival.  

  ---

  ### 3. **Structural Objection: Thresholds vs. Regress**  
  The de minimis threshold **blocks unbounded regress** and is not mere squeamishness.  
  - **Fanaticism’s regress**: If every low-p/high-stakes bet can be dominated by a lower-p/higher-stakes one, no policy is optimal. Probabilities *in practice* fall faster than stakes rise (e.g., the stranger’s "astronomical stakes" lack credible mechanisms), but this empirical fact doesn’t resolve the *theoretical* threat.  
  - **Thresholds as epistemic firewalls**: De minimis (e.g., 1-in-a-million) acts as a **proxy for minimum actionable probability**. It rejects risks where uncertainty dwarfs knowledge, preventing fanaticism’s logical collapse.  
  - **Verdict**: Thresholds are necessary for coherence, not psychological comfort.  

  ---

  ### 4. **Anti-Fanatical Rules: Evaluating a Proposal**  
  Consider a rule: **require \( p \geq \frac{k}{\sqrt{v}} \) or \( p \geq \frac{k}{\log v} \)** (where \( v \) = value at stake).  
  - **Reproduces (1)-(3)?** Partially:  
    - (1) **Monetization**: Holds for moderate stakes (where \( v \) is small, \( p \) effectively linear).  
    - (2) **De minimis**: Emerges naturally (as \( v \rightarrow \infty \), \( p \) must be \( >0 \), but thresholds harden for extreme \( v \)).  
    - (3) **Catastrophic risks**: Accepts asteroid surveys (e.g., \( p \sim 10^{-5} \), \( v \sim 10^9 \) lives → \( p \sqrt{v} \gg 0 \)), but rejects the stranger (e.g., \( p \sim 10^{-100} \), \( v \sim 10^{18} → p \sqrt{v} \approx 0 \)).  
  - **Placement**:  
    - **Asteroid survey**: Funded (high \( v \), moderate \( p \)).  
    - **Stranger**: Rejected (ultra-low \( p \) fails \( \frac{k}{\log v} \) test).  
  - **Principled or curve-fit?** It codifies intuition but lacks deep justification (e.g., why \( \sqrt{v} \)?). Actual practice uses **hard probability floors** (feature 2) alongside VSL, suggesting a hybrid approach.  

  ---

  ### 5. **What Would Change?**  
  - **Under fanaticism**: Budgets collapse into whichever long shot names the largest stakes. Competing claims (e.g., asteroid vs. alien invasion) would require comparing infinite expected values—a decision-theoretic impossibility. Regulation becomes incoherent.  
  - **Under bounded value**: Feature (3) **fails** unless recast. Asteroid detection could be framed as **insurance** (avoiding correlated loss) or **precaution** (preserving option value), but these are weaker than expectation-based arguments. Pandemic prep might survive as "aversion to correlated catastrophe," but justifying costs becomes harder.  

  ---

  ### 6. **Underdetermination and Edge Cases**  
  - **Bounded-value vs. probability-threshold theorists** can both endorse (1)-(3) but diverge on edge cases:  
    - **Civilizational collapse vs. vast future lives**:  
      - Programme A: Cost = $50M, reduces collapse risk by \( \Delta p = 10^{-4} \) (stakes: entire civilization).  
      - Programme B: Cost = $50M, success probability \( p = 10^{-9} \), secures \( 10^{18} \) lives.  
    - **Practice today**: Silent. De minimis thresholds might reject Programme B (\( p < 10^{-6} \)), while Programme A’s \( \Delta p \) could be acceptable if collapse risk is >10^{-6}.  
    - **Theoretical split**:  
      - **Bounded-value**: Caps \( v \) (e.g., at \( 10^{14} \) lives). Programme A wins (meaningful \( \Delta p \)); Programme B fails (low \( p \), capped \( v \)).  
      - **Probability-threshold**: Rejects Programme B (sub-de-minimis \( p \)), but accepts Programme A if collapse risk is above threshold.  
  - **Should practice address this?** Yes—it reveals hidden assumptions. A principled framework (e.g., \( p \geq f(v) \)) would force explicit stakes-probability tradeoffs.  

  ---

  ### Synthesis: The Implicit Decision Theory  
  Public risk regulation follows **pragmatic anti-fanaticism**:  
  - **Core principle**: Expected value *only applies* to risks with **epistemically tractable probabilities** (modeled, measurable uncertainties).  
  - **Tools**:  
    - VSL linearity for "ordinary" risks (feature 1).  
    - De minimis thresholds to filter untractable probabilities (feature 2).  
    - Acceptance of catastrophic risks only when probabilities are scientifically credentialed (feature 3).  
  - **Why not fanaticism?** It conflates *arithmetic possibility* with *practical rationality*. The stranger’s threat isn’t rejected because stakes are low—it’s rejected because it fails to be a *quantifiable risk* at all.  

  This framework is stable but philosophically uneasy: it avoids fanaticism’s absurdities without a watertight alternative. Its strength lies in its institutional pragmatism, not axiomatic purity.
