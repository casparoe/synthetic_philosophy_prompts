prompt: |-
  For the past several years I have worked as a workplace ombudsperson, and there is a pattern in the disputes I mediate that I keep having to describe and do not have a word for. Three instances, all lightly disguised:

  A manager stops at an analyst's desk, looks at a draft and says, "It would be good if the quarterly summary didn't go out with these numbers in it." The analyst changes the numbers. When the change is later questioned, the manager says — and I believe him — "I was thinking out loud; I never instructed anyone to change anything." But from that day on, the analyst is described by her colleagues as having "been told to" and the manager as having "told her to," and no one can point to a sentence that is an instruction.

  At a committee meeting the chair says, "I assume someone will take this on?" A junior member says, "I can do it." Months later, when the task turns out to be thankless, the very same pair of utterances is described in the opposite direction: the chair "never asked anyone," and the junior member "unaccountably took it on himself."

  Two peers are talking. One says, "The word going round is that the client wants a full rewrite." The other treats this as a direction from the client and rebuilds the thing from scratch. The first lets it stand, and can honestly say afterwards, "I was only repeating what I heard." Note that neither of them was in a position to give the other that instruction; the utterance supplied the push anyway, and left no one holding it.

  What seems to be going on is that how much an utterance *does* is not settled by what the speaker meant, and not settled by what the hearer understood at the time either, but settles later, depending on what follows and on how the episode gets retold — and that the retelling is not merely a report of what happened but the thing that fixes what happened. A friend who studied philosophy tells me there is a mid-century tradition about utterances that do things rather than describe things; he used the word "performative." But from what I can gather it deals with explicit formulae — "I promise," "I name this ship" — and none of my cases contains a formula at all.

  I have been working with two provisional categories of my own, and I want to know whether they are real. In the first two cases the speaker was perfectly able to do the stronger thing openly and simply did not; the shift is a quiet reclassification of an act he could have owned. In the third case the speaker could not have performed the stronger act openly, or would not have dared to, and the utterance lets him supply its force while keeping the ability to deny having supplied it. If that distinction is a distinction, it matters enormously for how I write up a case. If I am carving at a joint that is not there, I would rather be told.

  I am not after a label, and I will not be satisfied with one. What I want is the carving: what exactly this phenomenon is, what it is not, and where its edges lie. Specifically — does it require that the speaker had an opportunity to correct the shift and declined to take it? Does it matter whether the shift happens within seconds or over months? Does it occur in writing, where there is a record neither party can retreat from? Does it need an asymmetry of power or standing between the parties, or does it happen between equals? Is there a version in which both parties silently prefer the later version, so that the shift is convenient all round and no one is being manipulated? And is this a feature of the utterance at all, or merely a feature of how people subsequently narrate episodes — in which case, is it a different phenomenon from the ones the philosophical tradition concerns itself with, or the same one seen from the outside?

  In arbitration we routinely ask what a reasonable person in the recipient's position would have understood. If the right answer is that this test already handles the whole thing and that nothing interesting is left over, say so plainly and tell me what, if anything, escapes it. If the nearest established concepts only partly fit, tell me which they are, how my cases differ from each, and which one fits best.

  Please structure the answer as: (1) the nearest established concepts and how each falls short; (2) a definition of the phenomenon — or, if you think my two categories should be collapsed or split differently, the definition you would defend; (3) a table of the boundary cases I raise above and any you would add, each marked as inside, outside, or genuinely unclear, with a one-line reason.

  One practical constraint: I have no library access, so please do not give me reading lists, bibliographies, or citations to works I could not check. I want the conceptual work itself. And for each substantive claim you make, say in a word or two how confident you are in it, then single out the one point you are least sure of and say why.
reasoning: |-
  Okay, I need to tackle this complex query from a workplace ombudsperson. They've described a pattern in disputes where an utterance's force isn't fixed at the moment of speaking but evolves later through retelling and consequences. They want to understand the phenomenon conceptually, not just get a label. 

  First, I recognize this isn't about performatives in the classic Austin sense—those require explicit formulas like "I promise." The cases here lack such formulas. The key is how utterances gain retroactive force through social ratification and narrative. 

  The ombudsperson's two provisional categories make sense: one where the speaker could've been explicit but chose vagueness, another where the speaker couldn't or wouldn't. I'll preserve that distinction—it's clinically useful for their mediation work. 

  For boundary cases: Power asymmetry isn't essential but often enables the shift. Written records don't prevent it because interpretation remains fluid. The reasonable person test partially handles it but misses the retroactive narrative aspect. 

  I'm least confident about whether this qualifies as a distinct linguistic phenomenon versus just flawed human interpretation. But the pattern's consistency in their cases suggests it's worth naming—perhaps "retroactive illocutionary shift." 

  The table format they requested will clarify edge cases. For example, when both parties prefer the shifted version, it's clearly inside the phenomenon—no manipulation needed, just mutual convenience in rewriting history.
answer: |-
  Based on your detailed cases and conceptual framing, here's the analysis structured as requested. The phenomenon you describe centers on the **retroactive social ratification of utterance force**, where the *de facto* illocutionary act (what the utterance *did*) is determined not at the moment of speaking, but later through consequences, narrative, and crucially, the speaker's failure to correct the interpretation when opportunity arises.

  ### (1) Nearest Established Concepts & Their Shortcomings
  *   **Performative Utterances (Austin):** (Confident) Focuses on explicit formulas ("I promise") that *do* things by convention. **Falls short:** Your cases involve *implicit* force, lack formulas, and crucially, the "doing" is deferred/negotiated retroactively, not conventional at utterance-time.
  *   **Implicature (Grice):** (Confident) Deals with implied meaning inferred by the hearer based on context and cooperative principles. **Falls short:** Explains initial *understanding* but not the *retroactive solidification* of that understanding into an agreed-upon *act* (e.g., an instruction), nor the speaker's passive ratification.
  *   **Illocutionary Force (Searle):** (Confident) The intended action performed *by* saying something (e.g., asserting, asking, promising). **Falls short:** Assumes force is determined by speaker intention + convention + context *at utterance time*. Your cases show force is often *indeterminate* at that moment and *settled later* by social ratification/narrative, overriding original intention/understanding.
  *   **Plausible Deniability / Strategic Ambiguity:** (Moderately Confident) Describes deliberate vagueness to avoid commitment. **Falls short:** Captures speaker motive in some cases (especially your Category 2) but doesn't encompass the *mechanism* of retroactive ratification or cases where ambiguity wasn't initially intended (Category 1). It's a *tactic*, not the *phenomenon* of force-shift.
  *   **Reasonable Person Standard (Contract/Law):** (Confident) Asks what a reasonable hearer *would* understand at the time. **Falls short:** Partially addresses the hearer's perspective but: (a) Doesn't capture how the *later narrative/re-telling* actively *redefines* the past event. (b) Fails to account for the *speaker's subsequent silence* as ratification. (c) Is a *test*, not an explanation of the *process* you observe. **What escapes it:** The retroactive narrative reconstruction and the role of speaker inaction in cementing the shifted interpretation.

  ### (2) Definition of the Phenomenon: Retroactively Ratified Illocutionary Shift (RRIS)
  **Definition:** An utterance whose perceived illocutionary force (e.g., instruction, request, delegation, warning) is not definitively settled by speaker intent, hearer understanding, or conventional form at the moment of utterance, but becomes socially established *later* through a combination of:
      (a) The practical consequences flowing from the hearer's actions based on their interpretation.
      (b) The subsequent narrative framing of the event by participants or observers.
      (c) The *tacit ratification* by the original speaker, demonstrated by their failure to correct the evolving interpretation when presented with the opportunity and awareness of the consequences.

  **Your Categories:** They are distinct and valuable for mediation:
      *   **Category 1 (Could have, Didn't, Shifted Later):** Speaker had the authority/standing and could have used explicit performative/imperative language but chose ambiguity. The shift retroactively attributes a deliberate intent they avoided claiming initially (e.g., Manager's "thinking out loud" becoming an instruction; Chair's "assumption" becoming delegation). *Mechanism:* Strategic vagueness + tacit ratification.
      *   **Category 2 (Couldn't/Wouldn't, Supplied Force Deniably):** Speaker lacked direct authority, or the force would be inappropriate/risky to state openly. The utterance functions as a covert prompt or nudge, allowing the speaker to influence action while maintaining plausible deniability. The shift attributes intentional direction where it couldn't (or wouldn't) be openly claimed (e.g., Peer "reporting gossip" becoming client direction). *Mechanism:* Covert influence + tacit ratification.

  **Core Mechanism:** Tacit ratification is the linchpin. Without the speaker's *awareness* of the interpretation *and* their *failure to correct it* when they reasonably could/should (given consequences), the utterance remains ambiguous. Their silence allows the narrative to solidify the shifted force.

  ### (3) Boundary Cases Table

  | Boundary Case                                                                                          | Inside (I) / Outside (O) / Unclear (U) | Reason                                                                                                                                 |
  | :----------------------------------------------------------------------------------------------------- | :------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------- |
  | **Speaker had opportunity to correct shift & declined?**                                             | **I** (Essential)                      | Tacit ratification (failure to correct) is a defining element of RRIS. Without this opportunity declined, it's just misunderstanding. |
  | **Shift happens within seconds vs. months?**                                                          | **I** (Both)                           | Timescale doesn't define it. Ratification can be immediate (silence after seeing reaction) or delayed (silence upon hearing retelling). |
  | **Occurs in writing (record exists)?**                                                                | **I**                                  | Written records constrain but don't eliminate interpretation. Ambiguous phrasing + consequences + tacit ratification can still enable RRIS (e.g., "It would be good if..." in email). |
  | **Requires asymmetry of power/standing?**                                                             | **O**                                  | While *common* (enhances ability to ratify/avoid correction), it can happen between equals (e.g., Peer case). Power asymmetry facilitates but isn't essential. |
  | **Both parties silently prefer the later version (convenient shift, no manipulation)?**               | **I**                                  | RRIS describes the *mechanism* of force-shift, not motive. Mutually convenient narrative revision fits perfectly (e.g., both saving face). |
  | **Is it a feature of the utterance or merely of subsequent narration?**                               | **U** (Least Confident Point)          | **Why Unclear:** This is the crux. *Philosophically:* Utterance provides ambiguous potential; narrative/ratification actualizes it. *Practically for you:* The phenomenon *is* the social process where utterance + consequences + ratification create a *new agreed-upon reality* about what happened. It's distinct from classic performatives (which aim to fix force at utterance) and is seen *through* the narrative lens. |
  | **Speaker corrects misinterpretation immediately upon seeing action/consequence?**                    | **O**                                  | If speaker corrects promptly, the shifted force cannot solidify. RRIS requires tacit ratification via *non*-correction.                |
  | **Hearer acts but no narrative develops & speaker is unaware?**                                       | **O**                                  | Lacks the social ratification/narrative component. Remains a private misunderstanding.                                             |
  | **Explicit performative used ("I instruct you to...") but later denied?**                             | **O**                                  | This is simple dishonesty/lying about a clear record, not a retroactive *shift* of ambiguous force. The reasonable person test handles this. |

  **Confidence & Least Sure Point:**
  *   **Confidence Levels:** High confidence in the core definition, distinction between your categories, the essential role of tacit ratification, and the boundary rulings (except as noted). Moderate confidence that the reasonable person test *partially* handles the hearer's perspective but misses the retroactive narrative/ratification entirely.
  *   **Least Sure Point:** **Whether RRIS is fundamentally a feature of the utterance or the narration (as per your specific question).** *Why?* This delves deep into philosophy of language vs. social epistemology. Is the "act" inherent in the ambiguous utterance (waiting to be discovered), or is it *created* by the narrative? For your *practical purposes*, it's a distinction without a difference: the phenomenon you mediate *is* the process where the narrative, ratified by inaction, retroactively defines the act. Calling it a feature of "the utterance" is too narrow; calling it *merely* narration underplays the utterance's essential, ambiguous potential. It's the *interplay* that defines RRIS. This ambiguity is why it's marked "Unclear" – it's philosophically complex, but practically, the phenomenon as you experience it is distinct and real.
