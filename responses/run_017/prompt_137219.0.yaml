  ### **Decision Tree: What Do You Take HCH to Be?**
  *Starting point: HCH (or similar) is a useful procedural idealization of good deliberation. HCH answers a question by having a human (with fixed time budget) decompose it into subquestions or answer directly; subanswers are merged bottom-up. "Factored cognition" is the same process read as division of labor.*

  ---

  #### **Branch Question 1: Bias Correction Case**  
  *Case: A hiring manager immediately rejects a candidate from a stereotyped group ("no"), but an HCH decomposition (e.g., subquestions on qualifications, blind review) approves ("yes"). Does this "yes" reveal what the manager* really *thought/should have thought, or does it create a new judgment?*  
  - **A: Reveals a latent judgment** (preservation of content).  
  - **B: Creates a new judgment** (constitution of content).  

  #### **Branch Question 2: Conflicting Decompositions Case**  
  *Case: For "Should I move to City X for a job?", two equally defensible decompositions exist—one career-focused (subquestions: salary growth, opportunities) and one personal-life-focused (subquestions: family proximity, friends). Both use the full time budget, but they yield conflicting answers ("move" vs. "stay") with no resources to resolve it. Is there a single correct answer HCH* should *produce, regardless of decomposition?*  
  - **A: Yes, a single correct answer exists** (determinism).  
  - **B: No, the output depends on decomposition** (non-determinism).  

  #### **Branch Question 3: Time Budget Variance Case**  
  *Case: The same "move to City X" question is run with a 5-minute per-node budget (rejecting the move due to superficial research) and a 5-month per-node budget (approving after deep analysis). Does this variance imply HCH lacks a stable output for a given question, or is one budget "correct"?*  
  - **A: One budget is correct; output is stable** (ignores budget sensitivity).  
  - **B: Output depends on budget; neither is uniquely correct** (budget-relativity).  

  #### **Branch Question 4: Altered Ends Case**  
  *Case: For "What career should I pursue to be happiest?", an HCH tree (with deep decomposition) concludes the asker should prioritize "meaning" over "happiness." Is this a better answer to the original question, or a change of subject?*  
  - **A: Better answer; ends can be refined** (amplification alters ends).  
  - **B: Change of subject; ends are fixed** (amplification bound by root).  

  #### **Branch Question 5: Error Correction Case**  
  *Case: An unaided human miscalculates a probability (e.g., says "30% chance" in a lottery when it's 10%), but HCH decomposition (e.g., subquestions on rules, simulations) corrects it. Is this because the human* would *get it right under better conditions, or because HCH adds external checks?*  
  - **A: Human would get it right** (error correction as preservation).  
  - **B: HCH adds external resources** (error correction as constitution).  

  #### **Branch Question 6: Expertise Integration Case**  
  *Case: For "Should we build this bridge?", HCH decomposes into subquestions for engineers, ecologists, and economists. Is this primarily modeling how* one person *breaks down a problem, or how a* group *collaborates?*  
