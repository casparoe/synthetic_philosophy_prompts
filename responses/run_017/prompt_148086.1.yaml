prompt: |-
  I am tutoring a second-year metaphysics tutorial next week: seventy minutes, one whiteboard, and fourteen students who have had a single lecture on identity over time — enough to feel the pull of the puzzle about a thing's apparently incompatible properties at different times, but no exposure to the idea of a temporal part. The topic is endurantism versus perdurantism. I am not asking you to explain the debate to me; I am asking for a plan for how to get them to see what is at issue, and I would like the plan to be specific about the dependencies rather than a list of talking points.

  Please give me the following.

  1. The order in which the components must be introduced, with the dependency behind each ordering decision: what has to be in place before the next move can land, and what specifically goes wrong if it is not.

  2. One concrete object or scenario to carry the whole session, together with an account of what a carrying example for this debate must have and must lack. Say explicitly whether you would reject the Ship of Theseus, a cat that loses a limb, an event such as a game of chess, and a human being, and give the reason in each case — including if you think one of them should be kept.

  3. A map of the misconceptions they will arrive with or will form in the room, and the point in the sequence at which each should be headed off. Two I am confident about: someone will take perdurantism to say that the object is spread out in time the way a road is spread out in space, and someone will conclude that the whole dispute is merely verbal. I also intend to ban the expressions "four-dimensional" and "block universe" from the room for the first forty minutes; tell me whether that helps, what I should use in their place, and what I should do when a student who has read ahead reaches for them anyway.

  4. A check for the last five minutes that tells me whether they have grasped the disagreement rather than merely acquired the vocabulary. I have three candidate questions; tell me which of them actually discriminates between the views, and why the others fail to.

   - If only the last ten seconds of a person's life had ever existed, would that person have existed at all?
   - A relay team wins a race; is the runner who crossed the line the same runner who started it?
   - Could there be a world in which everything that exists exists for exactly one instant, and in which things nevertheless change?

  5. One thing the session should openly decline to explain, and a single sentence I can use to make the refusal feel like a decision rather than an evasion.

  Finally: where in the sequence, if anywhere, should I introduce the third position — that the persisting thing is an instantaneous stage, and that persistence consists in standing in the right kind of series-relation to other stages? Give me your reason for placing it where you do, or for leaving it out entirely. My worry is that in their hands it will either collapse into perdurantism or make the whole debate look like a choice of notation.
reasoning: |-
  Okay, let me tackle this tutoring plan step by step. The user is preparing a metaphysics tutorial on endurantism vs perdurantism for students with minimal background. 

  First, I need to consider the core challenge: making abstract metaphysical concepts tangible without oversimplifying. The dependency chain seems crucial - students must grasp persistence puzzles before any solution can make sense. I recall how introducing temporal parts too early risks confusing ontological commitment with mere description.

  For the concrete example, the Ship of Theseus comes to mind but I hesitate. While classic, its spatial rearrangement aspect might muddy the temporal focus. A living organism like a cat feels better - its continuous change is intuitively temporal without spatial tricks. The key is finding something whose persistence we instinctively recognize but can't easily explain.

  Anticipating misconceptions: that "spread out in time" metaphor will definitely surface. I should redirect it by emphasizing qualitative change within a numerically identical whole. And yes, banning "4D" initially forces students to engage with the concepts rather than hiding behind jargon. When the eager beaver brings it up, I'd acknowledge it as advanced vocabulary we'll unpack later.

  The check questions... that third one about instantaneous existence stands out. Endurantists must deny change in such a world, while perdurantists can accommodate it through temporal parts. The other questions either conflate composition with identity or allow both theories to give similar answers.

  About stages - I'd introduce them late, after establishing the main dichotomy. Presenting them as a third option too early risks flattening the debate. Better to position stage theory as a refinement of perdurantism that resolves certain puzzles, once students grasp why mereological differences matter.

  Finally, openly declining to address time travel feels right. It's a natural question but would derail the foundational focus. A simple "That's an important extension we'll save for when our persistence foundations are rock-solid" acknowledges its validity while keeping focus.
answer: |-
  Here’s a structured plan designed to build understanding sequentially, using dependencies to scaffold the debate, with concrete implementation details:

  ---

  ### **1. Order of Components & Dependencies**  
  *(Total: 70 mins)*  
  **Goal:** Move from the *puzzle* → *core theories* → *distinction* → *implications*.  

  | Step | Content | Time | Dependency | Why Order Matters |
  |------|---------|------|------------|-------------------|
  | 1 | **Reactivate the puzzle**: Use a scenario to show incompatible properties over time (e.g., "Cat at t₁: whole; at t₂: missing tail"). Ask: *"Is it the same cat? If so, how?"* | 10 mins | None (starts from lecture) | Without re-anchoring the puzzle, theories seem unmotivated. Skipping this risks views feeling arbitrary. |
  | 2 | **Naive Endurantism**: Introduce the intuitive view: "The cat *itself* was whole, now is tailless—it endured." Stress: *one entity, different properties at times*. | 15 mins | Step 1 (puzzle must be vivid) | If theory precedes the puzzle, students miss *why* we need an account of persistence. |
  | 3 | **Perdurantist Response**: Challenge: *"How can one thing have incompatible properties?"* Perdurantism: "The cat has *parts*: tail-included (at t₁) & tailless (at t₂)." | 20 mins | Step 2 (must grasp endurance’s claim first) | Without endurance’s "one entity" claim, perdurance looks like a non-solution. Students must see it as an *alternative*. |
  | 4 | **Key Distinction**: Contrast: Endurance = *wholly present* at each time vs. Perdurance = *partly present* (only a temporal part exists at t). | 10 mins | Steps 2–3 (both theories defined) | Premature focus on "partly present" (e.g., before perdurance) invites the "road spread in space" misconception. |
  | 5 | **Stage Theory**: Introduce as a *refinement* of perdurance: "Persisting objects are *instantaneous stages*; 'the cat' refers to a stage, but persistence is *stage-relations*." | 10 mins | Step 4 (must grasp perdurance’s part-whole commitment) | Earlier placement collapses into notation debates; later placement clarifies perdurance’s ontology. |
  | 6 | **Check & Implications**: Use Q3 (below) to test understanding. Discuss why disagreement is *ontological* (what exists?) not verbal. | 5 mins | All prior steps | Without testing, students may conflate views or miss the metaphysical stakes. |

  ---

  ### **2. Concrete Object/Scenario**  
  **Keep: A cat that loses a limb/tail.**  
  **Reject others:**  
  - **Ship of Theseus**: Spatial part-replacement distracts from *temporal* persistence.  
  - **Chess game**: Events aren’t substances; conflates persistence with event-identity.  
  - **Human being**: Emotional/personal identity biases intuitions; obscures metaphysical neutrality.  

  **Why the cat works:**  
  - Must have: Continuous existence, qualitative change, no spatial rearrangement.  
  - Must lack: Sentimental attachments, spatial discontinuities (e.g., disassembly).  

  ---

  ### **3. Misconceptions & Mitigation**  

  | Misconception | When to Head Off | Mitigation Strategy |
  |---------------|------------------|---------------------|
  | "Perdurance = object spread out like a road" | Step 4 (contrasting "wholly" vs "partly" present) | **Analogize**: "A road’s spatial parts exist *at once*; temporal parts exist *at different times*. Perduring objects don’t ‘stretch’—they have distinct parts *at* distinct times." |
  | "Debate is verbal" | Step 6 (implications) | **Highlight**: "Endurantists say only the cat exists; perdurantists say temporal parts exist too. Is there a fact of the matter?" |
  | Student uses "4D" / "block" | Step 3 (perdurance intro) | **Pivot**: "Let’s use ‘temporal parts’ for now. ‘4D’ is a *consequence* of perdurance—we’ll get there in 10 mins!" (Then revisit in Step 6.) |

  **Banning "4D"/"block" helps:** Forces focus on *composition* (what *is* the persisting object?) before spacetime models. Use "temporal parts" and "wholly/partly present" instead.  

  ---

  ### **4. Discrimination Check Question**  
  **Use:** *"Could there be a world where everything exists for one instant, but things change?"*  
  - **Why it works**:  
    - Endurantism: **No change possible**. Change requires one thing having incompatible properties at times—but if no times, no change.  
    - Perdurantism: **Change possible**. An "instantaneous object" could have temporal parts with different properties (e.g., a "flash" with a bright and dim part).  
  - **Reject others**:  
    - *Last 10 seconds of life*: Both can say "yes" (perdurance: those parts exist; endurance: the person was present at those times).  
    - *Relay runner*: Conflates composition (the team) with identity (the runner)—both theories can handle it similarly.  

  ---

  ### **5. What to Decline**  
  **Decline:** "Does perdurantism imply time travel is possible?"  
  **Sentence:** *"That’s a fascinating application, but today we’re building the foundation—let’s nail persistence before bending time!"*  

  ---

  ### **6. Stage Theory Placement**  
  **Place at Step 5** (after perdurance is solid).  
  - **Why**:  
    - Prevents collapse: Students see perdurance as *mereological* (objects *have* temporal parts), while stages are *referential* (objects *are* instantaneous).  
    - Avoids notation debate: By contrasting stages with perdurance ("Does the *whole* cat exist at t, or just a part/stage?"), the ontological difference is clear.  
  - **Risk mitigation**: Frame stages as a *version* of perdurance that avoids "objecthood" of temporal parts.  

  ---

  **Session Flow Summary**:  
  - 0–10 min: Puzzle (cat losing tail).  
  - 10–25 min: Endurantism ("the cat itself changed").  
  - 25–45 min: Perdurantism ("parts at different times").  
  - 45–55 min: Endurance vs. Perdurance ("wholly" vs "partly" present).  
  - 55–65 min: Stage theory ("instantaneous referents + relations").  
  - 65–70 min: Check (Q3) + why it’s not verbal.  

  This sequence forces engagement with the *metaphysical cost* of each view (what exists? what is persistence?) while blocking major misconceptions through strategic contrasts.
