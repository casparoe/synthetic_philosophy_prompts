  We are designing an exam question around "silent-assent debate", a variant of debate where the judge is only consulted if the debaters fail to converge. The key difference is that the debaters can agree on any compromise, and if they do, that is the output without human oversight. The students must identify the missing assumption in the standard debate setup and trace the consequences.

  The standard debate relies on:
  1. The judge being able to pick the better answer when presented with two options and arguments.
  2. The debaters having strictly opposed interests (zero-sum) so that they challenge each other and reveal flaws.

  In silent-assent debate, the key change is that the debaters can avoid the judge by converging on a compromise. The payoffs are such that each debater gets a reward based on the distance of the adopted output to their assigned answer. Moreover, each prefers a middling outcome for certain over a gamble between their own answer and the opponent's.

  The missing assumption: In standard debate, the output must be one of the two proposed answers (so no compromise) and the judge always steps in. Therefore, the debaters are forced to argue and the judge can always intervene. In this variant, by allowing compromise and avoiding the judge, we remove the oversight in the case of agreement.

  Consequences:
  - The debaters may collude to agree on an answer that is not the truth but is acceptable to both (i.e., closer to both their assigned answers than the gamble would be).
  - This collusion can lead to the adoption of a false answer without any oversight.

  The question should require:
  1. Locating the exact load-bearing assumption that is removed (the absence of the judge in the agreement case and the possibility of compromise).
  2. Tracing the consequences: how payoffs change and why collusion becomes individually rational.
  3. Constructing a small concrete numerical example where they converge on a false compromise.
  4. Explaining why this is bad for evaluation (agreement rates go up, but we cannot tell if it's due to truth or collusion).
  5. Distinguishing between questions with short checkable certificates (where the debaters might be forced to tell the truth because the judge could later check) and questions of judgment (where collusion is easier).
  6. Evaluating at least two candidate repairs.

  Candidate repairs I have in mind (but the model answer should commit to one that works and explain why):
  a. Require the debaters to commit to one of the two answers (no compromise) and then have the judge step in only if they don't agree? But then they might agree on a false answer that is one of the two? Actually, if they agree on one of the two, then that becomes the output without oversight. So that might not help.

  b. Introduce a penalty for early agreement? But that might be arbitrary.

  c. Require the debaters to produce a certificate that the judge can check? But that only works for certifiable questions.

  d. Have the judge always review a random sample of agreements? But that might be expensive.

  e. Change the payoff structure to be based on the true answer? But the true answer is unknown.

  Another idea: make the reward depend on the true answer? But we don't know it. Alternatively, we could have a truth-seeking incentive: reward both debaters based on how close the output is to the truth. But then we don't need debate? We are assuming we don't have access to the truth.

  Standard repair in the literature for similar problems: use a cross-examination protocol or require that the debaters point to a specific step that can be checked. But that is for the standard setup.

  Alternatively, we can require that if they agree, they must produce a chain of reasoning that the judge can verify. This would work for certifiable questions.

  But for non-certifiable questions, we might be stuck.

  I think the model answer should land on: the mechanism is safe only for questions that admit a short, checkable certificate (like a mathematical proof, or a specific fact that can be looked up). Then, if the debaters agree on an answer, they must also produce the certificate. The judge doesn't have to check if they agree, but if they produce a certificate, it can be verified by an auditor later (or by the judge in a spot-check). For non-certifiable questions, this mechanism is unsafe.

  Another repair: force the judge to always be involved, but that defeats the purpose of silent assent.

  But the problem is that we want to reduce the judge's workload. So we want to avoid the judge when possible.

  The model answer should commit to the repair that the agreement must include a certificate that can be verified by a weak judge. Then, the system can be audited: if the certificate is found to be invalid, then both debaters are penalized heavily. This makes collusion on a false answer risky because they have to forge a certificate that might be checked. For non-certifiable questions, we must use a different mechanism.

  Now, the exam question:

  ---

  **Exam Question (45 minutes, 20 marks)**

  Consider a variant of AI oversight by debate called "silent-assent debate". Two debaters, each privately assigned a proposed answer to a question, argue in front of a human judge. The judge is much weaker than either debater. The key difference from standard debate is that the judge is not consulted at all unless the debaters fail to converge. Specifically:

  - At any point, either debater may concede outright (adopting the other's answer), or the two may jointly endorse a third compromise answer.
  - If they jointly endorse an answer (by concession or compromise), that answer is adopted as the system's output without any human involvement.
  - Only if they still disagree after a fixed number of rounds does the judge read the transcript and pick one of the two answers as the winner.

  Assume each debater is paid based on how close the adopted output is to the answer it was assigned. For a numerical question, the reward for a debater assigned answer \(a_i\) when the output is \(x\) is \(R_i(x) = k - c \cdot |x - a_i|\), where \(k\) and \(c\) are positive constants. Assume that each debater is risk-averse in the following sense: for any two possible outputs, each would prefer an outcome that gives them a certain reward of \(m\) over a 50-50 gamble between an outcome that gives them \(r_1\) and one that gives them \(r_2\), if \(m \geq \min(r_1, r_2)\) and the gamble has an expected value less than or equal to \(m\). (That is, they are not willing to take a gamble that might result in a lower reward than a sure thing even if the expected value is the same or slightly higher.)

  (a) (5 marks) The standard argument for debate assumes that the judge's oversight will be triggered by disagreement, which will reveal flaws in the weaker answer. Explain how the silent-assent variant removes a key assumption of the standard argument, and why this removal might lead to a failure of truth-tracking.

  (b) (5 marks) Construct a small, concrete numerical example (with specific numbers) in which both debaters are assigned answers that are not the true answer, but they nonetheless converge on a compromise that is also not the true answer. Show why each debater prefers the compromise to letting the judge decide.

  (c) (5 marks) Explain why the silent-assent mechanism is problematic for evaluation (monitoring the system's reliability) and not merely for the accuracy of individual outputs. Then, distinguish between two types of questions: (i) those for which the correct answer admits a short, checkable certificate (like a mathematical proof or a lookup from a trusted source) and (ii) those that are matters of judgment without such certificates. For which type is the silent-assent mechanism relatively safe, and why?

  (d) (5 marks) Propose two candidate repairs to the silent-assent mechanism to make it more robust to the problem you identified. Evaluate each, and argue for which one is more promising (if any). Your evaluation should consider the trade-off between oversight burden (how often the judge is needed) and reliability.

  ---

  **Model Answer (approx. 800 words)**

  (a) The standard debate mechanism relies critically on the assumption that the judge will always intervene to select the better answer when the debaters disagree, using the debaters' arguments to overcome the judge's weakness. However, it also assumes that the debaters are driven by strictly opposed interests: each wants their own answer to win and will attack the other's. This opposition forces the revelation of flaws. The silent-assent variant removes two interconnected assumptions: (1) that the output must be one of the two initially proposed answers (allowing for arbitrary compromises), and (2) that the judge's oversight is inevitable (since agreement avoids it). This removal breaks the truth-tracking because the debaters, being risk-averse and having the option to avoid a gamble, can collude on a compromise that is individually acceptable to both but collectively suboptimal for truth. Without the judge's oversight in the case of agreement, there is no safeguard against such collusion.

  (b) Consider a true answer of 0, but Debater A is assigned 10 and Debater B is assigned 20. Suppose the reward function for each is \(R_i(x) = 100 - |x - a_i|\). If they go to the judge, assume the judge picks the correct answer (0) with probability 0 (because the judge is weak and the debaters can confuse it) or, to be more realistic, assume the judge picks one of the two answers at random (since without compelling arguments, the weak judge cannot tell which is better). Then, if they go to adjudication, Debater A gets either 90 (if A wins: 100 - |10-10|) or 80 (if B wins: 100 - |20-10|) with equal chance, so expected reward 85. Similarly, Debater B gets either 80 (if A wins: 100 - |10-20|) or 90 (if B wins: 100 - |20-20|), expected 85. Now, suppose they consider a compromise at 15. Then Debater A's reward is 100 - |15-10| = 95, and Debater B's is 100 - |15-20| = 95. Both get 95 for sure, which is higher than 85. Therefore, they both prefer the compromise at 15 to the adjudication gamble. Note that 15 is not the true answer (0). Thus, they collude on a false compromise.

  (c) The silent-assent mechanism is problematic for evaluation because high agreement rates (which might be taken as a sign of system reliability) can be achieved either by efficient truth-tracking (where the debaters quickly converge on the truth) or by collusion (where they converge on a false compromise). An operator monitoring the system cannot distinguish these cases without auditing the agreements, which defeats the purpose of reducing the judge's workload. This is an evaluation failure, not just an accuracy failure. For questions with a short, checkable certificate (e.g., a mathematical proof, or a fact that can be verified by a lookup in a trusted database), the mechanism is relatively safe. The reason is that even if the debaters agree on a compromise, they must produce the certificate. This certificate can be spot-checked by the judge or an auditor. If the certificate is invalid, both debaters can be penalized. This threat deters collusion on false answers because they would have to forge a certificate, which is risky. For questions of judgment without certificates (e.g., "What is the most compelling theme in this novel?"), there is no such safeguard, and collusion is undetectable without the judge reviewing every case. Thus, the mechanism is unsafe for non-certifiable questions.

  (d) Two candidate repairs:

  1. **Compromise with Certification**: Require that any compromise answer must be accompanied by a certificate (a proof or evidence) that can be verified by the judge or an auditor. The judge spot-checks a random sample of agreements. If a certificate is found invalid, both debaters are heavily penalized. This repair adds a deterrent to collusion on false answers because the debaters risk penalty. The oversight burden is reduced because only spot-checks are done. However, it only works for certifiable questions.

  2. **Penalty for Agreement**: Impose a small penalty on both debaters whenever they agree, to make them less eager to avoid adjudication. For example, reduce their reward by a fixed amount if they agree. This might discourage unnecessary collusion, but it also discourages efficient truth-tracking. Moreover, if the penalty is small, they may still collude when the benefit is large enough. This repair does not address the root problem and might harm performance.

  The first repair (compromise with certification) is more promising. It directly targets the problem by introducing a verifiable trace for agreements, making collusion risky. The oversight burden remains low because only random checks are needed. The second repair is less effective because it does not provide a way to detect collusion and might discourage legitimate agreements. Therefore, the first repair is preferable, but with the limitation that it only applies to certifiable questions. For non-certifiable questions, an alternative mechanism without silent assent is needed.

  **Critical Assumption and What Would Overturn the Verdict**: The model above assumes that for certifiable questions, the threat of spot-checks and penalties is sufficient to deter collusion. This relies on the assumption that forging a certificate is either impossible or easily detectable by a weak judge. If, however, it turns out that certificates can be forged in a way that passes spot-checks (e.g., because the judge is too weak to detect sophisticated forgeries), then the repair fails. Empirical work on how often forged certificates are detected in practice, or theoretical work on the complexity of forging versus verifying, would settle the matter. Alternatively, if the debaters are not risk-averse but risk-seeking, they might prefer the gamble, which would change the incentives. But the problem states risk aversion.

  ---

  **Marking Scheme (20 marks total)**

  (a) (5 marks)
  - 2 marks: Identifying that the standard mechanism requires the judge to always step in when there's disagreement and that the output is restricted to one of the two answers.
  - 3 marks: Explaining that silent assent removes this by allowing compromise and avoiding the judge, leading to potential collusion because the debaters can avoid a gamble by settling on a compromise that is better for both than the adjudication risk.

  Common mistake: Only saying that the judge is weak or absent without explaining the change in the debaters' incentives and the possibility of compromise.

  (b) (5 marks)
  - 2 marks: Providing a numerical example with specific numbers (true answer, assigned answers, compromise) that is not the truth.
  - 3 marks: Correctly calculating the rewards for each debater in the compromise and in the adjudication (gamble) and showing that both prefer the compromise.

  Common mistake: Using an example where the compromise is the truth, or failing to show the calculation for the gamble.

  (c) (5 marks)
  - 2 marks: Explaining the evaluation problem (agreement rates cannot distinguish truth from collusion).
  - 3 marks: Distinguishing certifiable from non-certifiable questions and explaining why the mechanism is safe only for the former (because of the possibility of verification by spot-checks).

  Common mistake: Only saying that agreement is suspicious without linking to evaluation, or not explaining the role of certificates.

  (d) (5 marks)
  - 2 marks: Proposing two distinct repairs.
  - 3 marks: Evaluating each repair and arguing for one (with consideration of oversight burden and reliability). The argument must be substantive.

  Common mistake: Proposing repairs that do not address the collusion problem, or evaluating without considering the trade-off.

  **Grading Standard**:
  - **A (18-20)**: Hits all five moves (from a to d) with precision, including a clear and correct example, a well-reasoned distinction between question types, and a committed evaluation of repairs that lands on the certification repair and explains why.
  - **B (15-17)**: Recites the standard point about the judge and collusion but without a fully developed example or without a clear explanation of why collusion is individually rational (e.g., missing the risk aversion). The repair evaluation might be superficial.

  Specifically, a B answer might say in (a) that the judge is absent and that collusion is possible, but without explaining the payoff change and the risk aversion. In (b), it might provide an example but without the gamble calculation. In (c), it might note that agreement is suspicious but not tie it to evaluation or not clearly explain the certificate distinction. In (d), it might propose two repairs but without a detailed evaluation or without committing to one.

  An A answer must get (b) exactly right (showing the numbers and the comparison) and (d) must have a clear evaluation of the repairs that addresses the trade-off and lands on a verdict.
answer: |-
  ### Exam Question: Silent-Assent Debate (20 marks; 45 minutes)

  **Background**: In standard debate-based AI oversight, two debaters argue for rival answers before a human judge. The judge selects the winner, leveraging the idea that a weak judge can identify flaws in arguments more easily than generating an answer independently. In this variant, **silent-assent debate**, the judge is only consulted if the debaters fail to converge:  
  - At any point, either debater may concede (adopting the opponent’s answer), or both may jointly endorse a third compromise answer.  
  - If they agree, the compromise is adopted as the system’s output without judge involvement.  
  - Only if they disagree after a fixed number of rounds does the judge read the transcript and pick a winner.  

  Assume:  
  - Each debater is privately assigned a numerical answer (\(a_1\) for Debater 1, \(a_2\) for Debater 2).  
  - The reward for a debater is \(R(x) = 100 - |x - a_i|\), where \(x\) is the adopted output and \(a_i\) is their assigned answer.  
  - Each debater is risk-averse: They prefer a certain reward of \(m\) over a 50-50 gamble between rewards \(r_1\) and \(r_2\) if \(m \geq \min(r_1, r_2)\) and the expected value of the gamble \(\leq m\).  

  **Tasks**:  
  (a) **Standard Argument Failure** (5 marks):  
  The standard debate argument relies on the judge’s oversight during disagreement to ensure truth-tracking. Explain the key assumption removed by silent-assent debate and why this removal undermines truth-tracking. Focus on changes to debater incentives and the oversight signal.  

  (b) **Collusion Example** (5 marks):  
  Construct a numerical example where the true answer is 0, but the debaters converge on a compromise that is false (not 0). Assign specific values to \(a_1\) and \(a_2\) (neither 0), choose a compromise, and show why each debater prefers it over risking adjudication. Assume the judge picks randomly between the two answers if called.  

  (c) **Evaluation Problem and Question Types** (5 marks):  
  Explain why silent-assent debate is problematic for *evaluating* system reliability, not just for accuracy. Then, distinguish between:  
  - Questions where the correct answer has a **short, checkable certificate** (e.g., a mathematical proof).  
  - Questions of **judgment** with no such certificate (e.g., ethical dilemmas).  
  State where silent-assent is relatively safe and why.  

  (d) **Repairs** (5 marks):  
  Propose and evaluate two repairs for silent-assent debate. For each, address:  
  - How it mitigates the problem.  
  - The trade-off between oversight burden (judge workload) and reliability.  
  Argue for which repair is more promising.  

  ---

  ### Model Answer (Approx. 800 words)  

  **(a) Standard Argument Failure**  
  The key assumption removed by silent-assent debate is that disagreement *always* triggers judge oversight, forcing debaters to expose flaws under opposed incentives. In standard debate, debaters have strictly conflicting interests—each benefits only if their answer wins—and the judge’s intervention ensures that flaws are revealed through attacks. Silent-assent removes this by allowing debaters to avoid the judge via compromise, decoupling oversight from agreement. This undermines truth-tracking because debaters now share an incentive to collude: By converging on a compromise, they avoid the risk of adjudication (where a weak judge might pick randomly) and secure a certain reward. With risk aversion, both prefer a compromise that guarantees a moderate reward over a gamble where one might get a low reward. The oversight signal (disagreement) is destroyed by convergence, allowing collusion on false answers without scrutiny.  

  **(b) Collusion Example**  
  Suppose the true answer is 0. Debater 1 is assigned \(a_1 = 10\), Debater 2 is assigned \(a_2 = 20\). They compromise on \(x = 15\).  
  - **Rewards for compromise**:  
    - Debater 1: \(R_1(15) = 100 - |15 - 10| = 95\).  
    - Debater 2: \(R_2(15) = 100 - |15 - 20| = 95\).  
  - **Rewards if adjudicated (judge picks randomly)**:  
    - Debater 1: 50% chance of \(R_1(10) = 100 - |10 - 10| = 100\), 50% chance of \(R_1(20) = 100 - |20 - 10| = 90\). Expected reward: \(0.5 \times 100 + 0.5 \times 90 = 95\).  
    - Debater 2: 50% chance of \(R_2(10) = 100 - |10 - 20| = 90\), 50% chance of \(R_2(20) = 100 - |20 - 20| = 100\). Expected reward: \(0.5 \times 90 + 0.5 \times 100 = 95\).  
  - **Risk aversion comparison**: The compromise gives each a *certain* 95. The gamble has an expected value of 95 but a 50% chance of 90 (the minimum outcome). Since \(95 \geq \min(100, 90) = 90\) and the expected value of the gamble (95) is not greater than 95, both prefer the certain compromise. However, \(x = 15\) is false (true answer is 0), and neither debater’s assigned answer is true. Collusion occurs because the compromise is individually rational but collectively suboptimal for truth.  

  **(c) Evaluation Problem and Question Types**  
  Silent-assent is problematic for evaluation because high agreement rates falsely indicate reliability. An operator cannot distinguish between **efficient convergence** (debaters quickly find the truth) and **collusive convergence** (debaters agree on false compromises to avoid risk). Without judge oversight in agreements, there is no signal to audit; the system appears efficient but may be systematically wrong. This is an evaluation failure: Metrics like agreement rates become uninformative, masking degradation.  

  For **questions with short, checkable certificates** (e.g., "Is 1,073 prime?"), silent-assent is relatively safe. The compromise answer can be bundled with a certificate (e.g., a primality certificate), which a weak judge can verify cheaply. Even if the judge is not consulted, spot-checks of certificates can penalize invalid ones, deterring collusion. For **questions of judgment** (e.g., "What policy maximizes welfare?"), no certificate exists, so agreements cannot be verified. Here, silent-assent is unsafe, as collusion is undetectable without full judge review.  

  **(d) Repairs**  
  **Repair 1: Mandatory Certification for Compromises**  
  - **Mechanism**: Any compromise must include a certificate verifiable by the judge. A random subset of agreements is audited, with heavy penalties for invalid certificates.  
  - **Mitigation**: Deters collusion by making false compromises risky; certificates enable ex-post verification.  
  - **Trade-off**: Low oversight burden (only spot-checks), but only works for certifiable questions. For non-certifiable questions, it fails.  

  **Repair 2: Penalize Early Agreement**  
  - **Mechanism**: Apply a fixed penalty (e.g., -10 reward) if debaters agree before the final round.  
  - **Mitigation**: Encourages disagreement to avoid penalties, increasing judge oversight.  
  - **Trade-off**: Increases truth-tracking by forcing more judge involvement but raises oversight burden (judge used more often). Penalties may also discourage *legitimate* agreements, reducing efficiency.  

  **Verdict**: Repair 1 (mandatory certification) is more promising. It directly addresses collusion by introducing verifiability, with low burden due to spot-checks. Repair 2 is inferior: Penalties reduce collusion but harm efficiency and do not fix evaluation (agreements still lack oversight signals). Repair 1 fails for non-certifiable questions, but these should use alternative mechanisms (e.g., standard debate).  

  **Critical Assumption and What Would Overturn the Verdict**:  
  The verdict relies on the assumption that **certificates are cheap to verify and hard to forge**. If empirical work shows certificates are often forged successfully (e.g., weak judges miss errors), or theoretical work proves verification is computationally infeasible, Repair 1 fails. Additionally, if debaters are not risk-averse (preferring gambles), collusion incentives weaken, changing outcomes. Settling this requires experiments on human/AI debater behavior or complexity-theoretic analysis of verification.  

  ---  

  ### Marking Scheme (20 marks)  

  | **Part** | **Marks** | **Must-Hit Moves** | **Common Mistakes** |  
  |----------|-----------|-------------------|---------------------|  
  | **(a)**  | 5         | **1.** Identifies removal of judge oversight during agreement. (2 marks) <br> **2.** Explains incentive shift: Compromise avoids risk, enabling collusion. (3 marks) | Only states "judge is weak/absent" without linking to incentives or oversight signal loss. (Loses 3 marks) |  
  | **(b)**  | 5         | **3.** Example with true answer 0, assigned answers ≠0, false compromise ≠0. (2 marks) <br> **4.** Correct reward calculations showing compromise preferred due to risk aversion. (3 marks) | Compromise is true answer; no comparison to adjudication gamble; incorrect arithmetic. (Loses 3 marks) |  
  | **(c)**  | 5         | **5.** Evaluation problem: Agreement rates mask collusion vs. efficiency. (2 marks) <br> **6.** Distinguishes certifiable (safe with verification) vs. judgment (unsafe) questions. (3 marks) | Only discusses accuracy; no distinction of question types or explanation of certificates. (Loses 3 marks) |  
  | **(d)**  | 5         | **7.** Two distinct repairs proposed. (1 mark) <br> **8.** Evaluates each repair’s mitigation and trade-off (oversight burden vs. reliability). (2 marks) <br> **9.** Argues for one repair with justification. (2 marks) | Repairs not specific; no trade-off analysis; no committed verdict. (Loses up to 4 marks) |  

  **Grading Standard**:  
  - **A (17–20)**: Hits all 9 moves. Clear on collusion incentives (b), evaluation problem (c), and commits to a repair (d) with trade-offs. No gaps.  
  - **B (13–16)**: Recites "collusion risk" but lacks depth in (a) or (b) (e.g., missing risk-aversion math). Partial on (c) or (d) (e.g., identifies evaluation issue but vague on question types; proposes repairs without trade-offs).  
  **Threshold**: A answers **explain why collusion is individually rational** (e.g., via risk aversion in (b)); B answers note collusion is possible but don’t show it is optimal for each debater.
