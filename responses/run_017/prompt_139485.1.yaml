prompt: |-
  I lead a three-person environment-model team at a company that operates fleets of autonomous delivery robots inside large hospitals: the robots move pharmacy items, specimens, linen and meals along mapped corridors and through service lifts. My team owns the world model the planner reads, and we process roughly ten to fifteen change requests and incident reports per week: a corridor being re-floored, a supplier switching container, a new infection-control rule about which lifts may be used, a near-miss write-up from a porter. Right now we have no principled way to decide whether one of these is a fact to add, a fact to start watching, or evidence that the model itself is wrong about what the world contains.

  I want a decision procedure my on-call engineer can run in about thirty minutes, with a bachelor's-level engineering background and no formal logic, and then bring to a weekly ninety-minute review where two engineers sign off. Its output has to be auditable by an outside assessor months later, so each step needs to record what was decided and on what basis. Please ground it in what the frame problem literature actually distinguishes: inferring that an action left something alone without being told (the frame-axiom problem), unstated preconditions (the qualification problem), unstated downstream consequences (the ramification problem), and the version of the problem where a bounded agent has to decide what to think about at all rather than what to infer. Tell me which of those distinctions survive being turned into a half-hour checklist and which collapse under the simplification, and be explicit about which steps are judgment calls wearing procedural clothing.

  To start you off, here is the taxonomy we currently use, which I suspect is drawn in the wrong place. We call a fact baked-in when the planner could not be told about it at runtime even in principle — that a door is either open or shut, that a floor is a single level surface — flagged when it is representable and held fixed until an update arrives, and watched when something checks it at runtime with a named detector and a refresh interval. The category that actually causes our incidents is the fourth, unofficial one: silent dependencies, facts a plan's success relies on that appear in none of the three. My current rule is that every silent dependency must either get a monitor or get a named person's signature. Redraw that split if it misdescribes the problem, and add the second-order step: how to handle the case where the thing that would reveal a stale frame is itself inside the frame, because our detectors are mounted on the robots and can be occluded, mis-mounted, or simply not pointed at the relevant volume.

  Give the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it is a question about how much risk the hospital wants rather than about how the world is. Then run it on three real-shaped cases. First: a six-week renovation of the main spine corridor in which the vinyl is being replaced section by section with a different surface, hoarding narrows one stretch to well below our usual clearance, our localisation was tuned on the old floor's visual texture, and our braking distances were validated against the old floor's friction. Second: the pharmacy begins sending controlled drugs in a rigid sealed case that sits proud of the bin lip, where our bin-latched check is a simple beam break and our manifest check is a label scan; the proposed fix is to tag those deliveries large and route them into a deeper bin. Third: a near-miss report reveals that a fire door on a night route had been wedged open with a rubber stop, where our map's door state is binary and a wedged door reads as shut. At least one of these should come out with an answer that costs us something we would rather not pay — say plainly which, and what it costs. Finally, name one kind of change this procedure will systematically mishandle, and why.
reasoning: |-
  We are designing a decision procedure for the environment-model team to classify incoming change requests and incident reports. The goal is to determine whether a piece of information is:

  1. A fact to add (baked-in or flagged) to the model.
  2. A fact to start watching (i.e., monitor at runtime).
  3. Evidence that the model itself is wrong (i.e., a silent dependency that must be addressed).

  The procedure must be executable by an on-call engineer in about 30 minutes, with a bachelor's-level engineering background and no formal logic. The output must be auditable. We ground the procedure in the frame problem literature:

  - **Frame-axiom problem**: Inferring what remains unchanged by an action.
  - **Qualification problem**: Unstated preconditions for an action to succeed.
  - **Ramification problem**: Unstated downstream consequences of an action.
  - **Bounded agent problem**: Deciding what to think about given limited resources.

  We also use the existing taxonomy (baked-in, flagged, watched) and the problematic category of silent dependencies.

  We redesign the taxonomy and create a decision tree. The steps must record decisions and their basis.

  ## Revised Taxonomy and Decision Procedure

  We redefine the categories based on the frame problem:

  1. **Baked-in (Frame Axioms)**: Facts that are inherent to the model and cannot change at runtime (e.g., the structure of the world). These are the frame axioms that we assume hold by default unless we have evidence to the contrary.

  2. **Flagged (Qualification Preconditions)**: Facts that are representable and can change, but we assume they remain fixed until an update. These are preconditions that must hold for actions to succeed. We can update these when we receive new information.

  3. **Watched (Runtime Monitors)**: Facts that are critical and volatile enough that we must check them at runtime with a named detector and refresh interval. These address the ramification problem by continuously verifying that the world matches our model.

  4. **Silent Dependencies**: These are facts that the model relies on but are not represented in any of the above. They must be eliminated by either making them watched, flagged (if they are stable enough), or by changing the model (if they are baked-in but wrong).

  Additionally, we have a second-order issue: the detectors themselves are part of the environment and might be compromised (occluded, mis-mounted, etc.). Therefore, we need to consider the reliability of our monitoring.

  ## Decision Procedure Steps

  The procedure is a series of questions. Each step must be documented with:
  - The question.
  - The answer and the reasoning.
  - If the answer leads to a conclusion, record that.
  - If the answer leads to a judgment call, note that and escalate to the weekly review.

  ### Step 1: Is this a report of an incident (near-miss, failure) or a change request (planned change in the environment)?
     - **Incident**: Go to Step 2.
     - **Change request**: Go to Step 3.

  ### Step 2 (for incidents): Does the incident report indicate that the robot's behavior was based on an incorrect model of the world?
     - **Yes**: This suggests a silent dependency or an error in our current model (baked-in, flagged, or watched). Go to Step 4.
     - **No**: The incident might be due to a transient error (e.g., a sensor glitch) or an action failure that doesn't reflect a model error. Record as an operational issue (not a model update) and stop.

  ### Step 3 (for change requests): Is the change temporary (duration known and less than, say, 1 week) or permanent?
     - **Temporary**: We might handle it by adjusting the model for the duration (flagged) or by setting up a temporary watch. Go to Step 5.
     - **Permanent**: Go to Step 6.

  ### Step 4: Identify the incorrect part of the model.
     - Question: What specific fact did the model get wrong? (e.g., the door state, the floor friction, the bin occupancy check)
     - If the fact is already in the model (baked-in, flagged, or watched), then the model was wrong about that fact. We must correct it and consider if the representation was appropriate (e.g., if it was flagged but changed too often, maybe it should be watched). Go to Step 6.
     - If the fact is not in the model, then it's a silent dependency. We must decide how to represent it (baked-in, flagged, or watched) and then update the model accordingly. Go to Step 6.

  ### Step 5 (Temporary changes): Can the change be avoided by rerouting or scheduling?
     - **Yes**: Adjust the routes or schedules for the duration. Mark the model with a temporary exception (flagged) and set an expiration. Stop.
     - **No**: We must represent the change in the model. Go to Step 6.

  ### Step 6: What category does the fact belong to? (This is the core step)
     We have a fact F (e.g., "the floor friction in corridor X is Y", "door Z is wedged open", "bin B has a new container type").

     - **Question 6.1**: Is F a fundamental property of the world that cannot change without a major reconstruction? (e.g., a door is either open or shut, a corridor is a single level surface) 
       - **Yes**: Then it is **baked-in**. But note: if we previously thought it was fundamental but it changed, then our baked-in model was wrong. We must reconsider the model's structure. Record as a baked-in fact and update the model. Stop.
       - **No**: Go to Question 6.2.

     - **Question 6.2**: Is F expected to change infrequently (e.g., less than once per week) and can be updated by a human when it changes?
       - **Yes**: Then it is **flagged**. We will hold it fixed until an update. Record the fact and the update mechanism (e.g., when the renovation is done, update the friction coefficient). Stop.
       - **No**: Go to Question 6.3.

     - **Question 6.3**: Is F expected to change frequently (e.g., multiple times a day) or is it critical enough that we cannot rely on periodic updates?
       - **Yes**: Then it must be **watched**. We must set up a runtime monitor. Go to Step 7 to design the monitor.
       - **No**: This is a judgment call. It might be a silent dependency. Escalate to the weekly review.

  ### Step 7: Design the runtime monitor for a watched fact.
     - We must specify: what detector will be used, where it is mounted, how often it will check, and what happens if the check fails (e.g., stop, replan).
     - **Question 7.1**: Can we monitor F with an existing detector on the robot?
       - **Yes**: Specify the detector and the refresh interval. Also, consider the reliability of that detector (Step 8).
       - **No**: We need to build a new detector or modify an existing one. This is a development task. Escalate to the weekly review for prioritization.

  ### Step 8: Assess the reliability of the monitor (for watched facts only).
     - **Question 8.1**: Is the detector subject to failure modes that we cannot detect? (e.g., occlusion, misalignment, environmental conditions that break the sensor)
       - **No**: Then we can rely on the monitor. Record the monitor and stop.
       - **Yes**: Go to Question 8.2.

     - **Question 8.2**: Can we add a secondary check or a watchdog for the detector?
       - **Yes**: Design the secondary check (e.g., a second sensor, a periodic calibration check). Record both the primary and secondary monitors. Stop.
       - **No**: The fact F is critical but we cannot reliably monitor it. This is a high risk. We must either:
          - Change the model to avoid relying on F (e.g., by rerouting around the area, or by using a different method that doesn't require F).
          - Accept the risk and get a named person's signature (escalate to the weekly review for risk acceptance).

  ### Step 9: For any step that requires escalation, the weekly review must decide.
     - The review will consider the risk and cost of each option. They will sign off on the decision.

  ### Step 10: For silent dependencies discovered, we must also check if there are similar dependencies elsewhere (a pattern). This is done in the weekly review.

  ## Judgment Calls Wearing Procedural Clothing
  - Step 6.3: Deciding whether a fact changes "frequently" or is "critical enough" is a judgment call. The engineer must use their best guess and then the review will confirm.
  - Step 8: Assessing the reliability of the monitor and whether a secondary check is feasible involves engineering judgment.
  - Step 5: Deciding if a temporary change can be avoided by rerouting might involve trade-offs (e.g., longer routes, delays) and thus is a judgment call.

  ## Applying the Procedure to the Cases

  ### Case 1: Six-week renovation of the main spine corridor
  - **Step 1**: Change request (planned renovation).
  - **Step 3**: Temporary (6 weeks) -> Step 5.
  - **Step 5**: Can we avoid the corridor? Possibly, but the main spine is critical. Rerouting might be long and impact efficiency. Let's say **No** -> Step 6.
  - **Step 6**:
    - 6.1: Is the floor friction fundamental? No, it can change (they are replacing the surface). -> 6.2.
    - 6.2: Will it change infrequently? The renovation is section by section, so it might change weekly. But the hoarding narrowing is a one-time change for 6 weeks. We can update weekly. So **Yes** for the hoarding (flagged) and for the friction (we can update as sections change). But note: the braking distances were validated against the old floor. We must update the friction coefficient in the model and revalidate braking for the new surface. Also, localization was tuned on the old texture. We must update the localization model for the new texture. 
      - However, the texture might change daily? Then 6.2: if we can update the model daily, then flag it. But if the texture changes too frequently (e.g., every hour as they work) then we must watch it. But the renovation is section by section, so the texture in a given section changes once and then stays. So we can flag it: update the model when a section is done.
      - The hoarding narrowing: we can update the map to reflect the narrowed area for the duration (flagged).
      - But the localization issue: if the robot uses visual odometry and the texture is changing, then the robot might get lost during the change. This might require a watch: we need to monitor the localization quality in that corridor? Or we might use a different localization method (e.g., wheel odometry) temporarily? 
      - Let's break it down:
          - Fact F1: Floor friction in section X is Y. We can update when the section is done (flagged).
          - Fact F2: The clearance in section Z is reduced. We can update the map when the hoarding is set up (flagged).
          - Fact F3: The visual texture in section X is T (for localization). We can update when the section is done (flagged). But during the renovation, the section might be in an intermediate state? Then we might need to avoid that section until it's done? Or use a different localization method? This becomes complex.
      - Given the complexity, we might decide to set up a watch for localization confidence in the corridor? But that's a new capability. Alternatively, we might reroute around the corridor during renovation? 
      - This is a judgment call: we might not be able to update the texture model daily because the work might be unpredictable. Therefore, we might need to treat the texture as a watched fact? But we don't have a texture-change detector. So we must either build one or avoid the corridor.

    **Conclusion**: This case is complex and might require escalation. The renovation might force us to either:
        - Reroute around the corridor (cost: longer routes, delays, possible capacity issues) OR
        - Develop a new capability to monitor the floor texture and adjust localization on the fly (cost: development time, and risk during the renovation).

    The procedure would hand this to the weekly review because we cannot easily avoid and updating the model daily might not be sufficient (if intermediate states occur). The answer costs us either efficiency (rerouting) or development resources (building a new monitor).

  ### Case 2: Pharmacy sending controlled drugs in a rigid sealed case
  - **Step 1**: Change request (supplier switching container).
  - **Step 3**: Permanent change -> Step 6.
  - **Step 6**:
    - 6.1: Is the bin occupancy check fundamental? The bin-latched check (beam break) and manifest scan are part of the system. The new container breaks the beam break check because it sits proud. This is a change in the world that affects our sensor. The fact F: "The container is within the bin and does not break the latching beam" is not fundamental? It can change per container. -> 6.2.
    - 6.2: Will this change infrequently? The pharmacy might use different containers for different drugs, but they are switching to this one permanently. We can update the model to know that for this type of delivery (tagged large) we use a deeper bin. So we can update the model to reflect that this container type requires a deeper bin. We can flag it: we'll update the model when new container types are introduced. But note: the beam break check is currently a binary check. We need to change the system to route these to a deeper bin. So we are adding a new fact: "Container type X requires bin type Y". We can represent this as a flagged fact (in the model) and update the routing accordingly.
    - However, the incident might reveal that our bin-latched check is not robust to container variations. This is a silent dependency? We assumed that any container would not break the beam when latched, but now we see that's not true. Therefore, we might need to change the model to account for container types and their requirements.

    **Conclusion**: We can represent this as a flagged fact: we'll add a new property to the delivery manifest (container type) and a new rule in the planner that routes container type X to bin type Y. We update the model accordingly. No need for a watch because we get the container type at the time of pickup (from the manifest). 

    But note: what if the container type is not correctly tagged? Then we might have a failure. We might need a watch? For example, a camera to check if the bin is properly closed? But the proposed fix is to route to a deeper bin. If the container is tagged correctly, then it should fit. So we rely on the tagging. 

    We might add a new watch: after loading, check the bin latch? But we already have a bin-latched sensor (the beam break). The problem is that the beam break is broken by the new container. So we must change the sensor or the bin? 

    The proposed solution is to use a deeper bin. Then the beam break should work? Because the container is entirely within the bin. So if we route to a deeper bin, the beam break will work. Therefore, we don't need a new watch. 

    We update the model to include the container type and the bin assignment rule (flagged). 

    This case does not cost us much: we add a new property and rule to the model.

  ### Case 3: Near-miss report: fire door wedged open
  - **Step 1**: Incident report -> Step 2.
  - **Step 2**: The robot thought the door was shut (because the map's door state is binary and the wedged door reads as shut) but it was open. So the model was wrong. -> Step 4.
  - **Step 4**: The fact F: "the door is shut" was incorrect. The model represented the door state as binary (baked-in) and assumed that if not open, then shut. But the door was wedged open. The baked-in model was wrong because it did not account for a third state (wedged open). 
  - Step 4: The fact was in the model (baked-in) but was incorrect. We must reconsider the model.

    Now we go to Step 6 to reclassify the door state:
    - 6.1: Is the door state fundamental? We thought it was (binary) but now we see it can be wedged open. So maybe we need to change the model to account for more states? Or we can treat wedged open as a fault condition? 
      - But note: the model assumed the door is either open or shut. The real world has a third state: wedged open. This is a problem with the baked-in model.

    We must decide: can we still use a binary state? If we consider wedged open as "open", then we are okay? But the robot expected the door to be shut and planned accordingly (e.g., it might have tried to open it, but the door was already open but wedged). The near-miss occurred because the robot assumed the door was shut and planned a maneuver that required the door to be shut? The report doesn't say, but let's assume the robot tried to open the door and then found it was already open but wedged, and then something went wrong.

    Alternatively, we might need a third state. But then we must detect it.

    Step 6.1: Door state is not as fundamental as we thought. It can be in more than two states. So we cannot keep it as baked-in in the current form. We must either:
        - Change the model to have more states (and then decide how to represent them: flagged or watched) OR
        - Keep the binary model but update our understanding: if the door is not open (by our sensor) then we assume it's shut, but we know that sometimes it might be wedged. Then we need a watch for wedged doors? 

    Step 6.2: If we change to a ternary state (open, shut, wedged), how often does the wedged state occur? We don't know. But it's probably rare. We could update the model when we know (flag it) but how would we know? We rely on porters to report? That might not be reliable.

    Step 6.3: We might need to watch the door state? But we already have a door state detector? The problem is that our current detector (probably) cannot distinguish wedged open from open? So we need a new detector? 

    **Conclusion**: This incident reveals a silent dependency: we assumed that the door state detector could distinguish all states, but it cannot. We must either:
        - Improve the detector to detect wedged doors (which might be hard) OR
        - Change the model to account for the possibility of wedged doors and have a contingency plan (e.g., if the door is supposed to be shut but the detector says open, then stop and alert).

    The current binary model is inadequate. We must change the model to account for the possibility of wedged doors. We might add a watch: when the robot expects a door to be shut but finds it open, it should stop and report. This is a new runtime check.

    This will cost us: we need to update the planner to handle this contingency (stop and alert) when the door state is unexpected. Also, we might get more false positives if doors are left open for legitimate reasons.

  ## One Kind of Change the Procedure Will Mishandle

  **Systematic Problem**: Changes that involve multiple interacting facts that are individually flagged but collectively create a new emergent behavior that the model doesn't capture.

  **Why**: The procedure treats facts in isolation. For example, in the renovation case, we had friction, clearance, and texture. We might handle each separately, but the combination might create a situation that the planner cannot handle (e.g., reduced clearance and reduced friction together). The ramification problem (downstream consequences) is only partially addressed by the procedure. We don't have a step to check for interactions between facts. This is because of the bounded agent problem: we cannot consider all possible interactions in a 30-minute procedure.

  Therefore, the procedure might mishandle complex changes with multiple interdependent factors. The weekly review should look for such interactions, but even then, they might be missed.
answer: |-
  Below is a principled decision procedure grounded in frame problem literature, designed for your environment-model team. It addresses the core distinctions (frame axioms, qualifications, ramifications, bounded reasoning) while converting them into an auditable, engineer-friendly checklist. The procedure prioritizes practicality over theoretical purity, explicitly marking where simplifications collapse nuances and where judgment is required.

  ---

  ### **Redefined Taxonomy & Key Distinctions**
  1. **Baked-in (Frame Axioms)**:  
     Facts fundamental to the world model that *cannot change without invalidating core assumptions* (e.g., "doors are binary open/shut"). **Simplification survival**: High. Treated as axioms unless contradicted by evidence.  
  2. **Flagged (Qualification Preconditions)**:  
     Facts that *must be true for actions to succeed* but can change infrequently (e.g., "lift X may carry specimens"). Updated manually. **Simplification survival**: Moderate. Qualification problems reduce to "preconditions needing explicit representation."  
  3. **Watched (Ramification Monitors)**:  
     Facts with *downstream consequences* that change frequently or unpredictably (e.g., "corridor clearance ≥ 0.8m"). Requires runtime verification. **Simplification survival**: Low. Ramifications collapse into runtime checks due to bounded reasoning.  
  4. **Silent Dependencies**:  
     Facts *not represented* in the model but critical to success. **Must be eliminated** by converting to Flagged/Watched or revising Baked-in assumptions.  
  **Second-order issue (detector reliability)**: Handled in Step 6 (Monitor Design).  

  ---

  ### **Decision Procedure (30-Minute Checklist)**  
  **Input**: Change request or incident report.  
  **Output**: Classification (Baked-in/Flagged/Watched/Silent) + actions (update model, add monitor, escalate).  
  **Audit Trail**: Engineer documents each step with:  
  - **Question asked**  
  - **Answer + evidence/rationale**  
  - **Decision**  

  ---

  #### **Step 1: Is this a contradiction to existing baked-in facts?**  
  - **Question**: Does the report show a fact that conflicts with core model axioms? (e.g., "A door was neither open nor shut" vs. binary state).  
  - **Sufficient answer**: Yes + specific axiom violated (e.g., "Wedged door breaks binary state axiom").  
  - **No**: Proceed to Step 2.  
  - **Yes**: Escalate to review. **Baked-in facts require model restructuring** (e.g., add "wedged" state).  
  - **Judgment call**: None. Pure logic.  

  #### **Step 2: Is this a new precondition (qualification) or consequence (ramification)?**  
  - **Question**: Is the fact a *requirement for action success* (precondition) or a *result of change* (consequence)?  
    - *Precondition*: "Robot needs 0.8m clearance to navigate."  
    - *Consequence*: "New flooring reduces friction → longer braking distance."  
  - **Sufficient answer**: Precondition/consequence + affected actions (e.g., "Navigation requires clearance ≥ 0.8m").  
  - **Neither**: Proceed to Step 3.  
  - **Precondition/Consequence**: Classify as **Flagged** if stable, **Watched** if volatile (Step 4).  
  - **Judgment call**: Distinction collapses here. Both reduce to "facts affecting success."  

  #### **Step 3: Is this a silent dependency?**  
  - **Question**: Is the fact *implied by the model* but unstated? (e.g., "Bin latch beam assumes containers fit flush").  
  - **Sufficient answer**: Yes + failure impact (e.g., "Rigid case breaks latch assumption → undetected unsealing").  
  - **No**: Stop. Not a model issue (e.g., porter error).  
  - **Yes**: **Must convert to Flagged/Watched** (proceed to Step 4).  

  #### **Step 4: Stability Assessment (Flagged vs. Watched)**  
  - **Question**: How often does this fact change?  
    - **Stable** (changes ≤ weekly): E.g., "Renovation hoarding lasts 6 weeks." → **Flagged**.  
    - **Volatile** (changes hourly/daily): E.g., "Floor texture during renovation." → **Watched**.  
  - **Sufficient answer**: Change frequency + evidence (e.g., "Pharmacy uses new containers permanently → stable").  
  - **Judgment call**: "Volatile" threshold is organizationally defined (default: >1 change/week).  

  #### **Step 5: Can the fact be observed at runtime?**  
  - **Question**: Can a detector verify this fact? (e.g., camera for floor texture, ultrasonic sensor for clearance).  
  - **Sufficient answer**: Yes/No + detector name (e.g., "Lidar detects clearance").  
  - **No**: Proceed to Step 5a.  
  - **Yes**: **Watched** (proceed to Step 6).  

  #### **Step 5a: Unobservable Fact Handling**  
  - **Question**: Can the risk be mitigated without runtime checks? (e.g., rerouting, manual inspection).  
  - **Sufficient answer**: Mitigation strategy + risk owner (e.g., "Reroute robots → operations team").  
  - **No**: Escalate to review for **risk acceptance** (named signatory).  
  - **Judgment call**: Risk tolerance is organizational.  

  #### **Step 6: Monitor Design (Watched facts only)**  
  - **Question**: Can the detector *reliably* observe the fact? Assess:  
    - Occlusion (e.g., "Hoarding blocks camera?").  
    - Mounting/calibration (e.g., "Is sensor angled correctly?").  
    - Failure modes (e.g., "Dust affects floor texture scans?").  
  - **Sufficient answer**: Reliability score (High/Medium/Low) + evidence (e.g., "Dust testing logs show 90% accuracy").  
  - **Low reliability**: Proceed to Step 6a.  
  - **Medium/High**: Implement **Watched** with detector/interval (e.g., "Texture monitor: camera every 5m").  

  #### **Step 6a: Unreliable Monitor Handling**  
  - **Question**: Can reliability be improved? (e.g., redundant sensors, shorter refresh).  
  - **Sufficient answer**: Solution + cost (e.g., "Add redundant ultrasonic sensor: $1,500").  
  - **No**: Escalate to review. **Trade-off: Cost vs. risk**.  

  ---

  ### **Weekly Review (90 Minutes)**  
  1. **Sign off** on escalated decisions (Steps 1, 5a, 6a).  
  2. **Audit trail**: Verify documentation completeness.  
  3. **Pattern recognition**: Cluster similar issues (e.g., "Multiple container-related silent dependencies → revise bin model").  

  ---

  ### **Case Applications**  
  #### **Case 1: Spine Corridor Renovation**  
  - **Step 1**: No (vinyl friction isn’t baked-in).  
  - **Step 2**: *Precondition* (clearance), *Consequence* (friction/texture).  
  - **Step 4**:  
    - Clearance: Stable (6 weeks) → **Flagged** (update map).  
    - Friction/texture: Volatile (daily changes) → **Watched**.  
  - **Step 5**: Texture observable via camera → **Yes**.  
  - **Step 6**: Reliability **Low** (dust/occlusion from hoarding) → Step 6a.  
  - **Step 6a**: Redundant lidar + camera improves reliability → **Watched** with 2m refresh.  
  - **Cost**: **$8,000** for sensor upgrades + validation. Engineer time: High.  

  #### **Case 2: Pharmacy Rigid Case**  
  - **Step 1**: No (bin latch isn’t baked-in).  
  - **Step 3**: **Silent dependency** (assumption: "containers fit flush").  
  - **Step 4**: Stable (permanent change) → **Flagged** (add "large-container" property).  
  - **Proposed fix accepted**: Route to deeper bin.  
  - **Cost**: Low (model update only).  

  #### **Case 3: Wedged Fire Door**  
  - **Step 1**: **Yes** (contradicts baked-in binary door state).  
  - **Escalate to review**: Model must support "wedged" state.  
  - **Step 6**: New detector (e.g., torque sensor) unreliable (occlusion, cost) → Step 6a.  
  - **Step 6a**: Mitigation: Flag doors with history of wedging + manual checks.  
  - **Cost**: **Operational burden** (porters check doors nightly). Risk acceptance required.  

  **Costly Outcome**: **Case 1** (renovation) demands sensor upgrades and revalidation. **Case 3** (door) shifts risk to humans.  

  ---

  ### **Systematic Weakness**  
  **Mishandled Change**: **Cascading Qualifications**  
  - **Example**: A new infection-control rule requiring "robots carrying specimens to use lift A, but only if cleaned within 30m" interacts with "lift A outage" and "cleaning schedule."  
  - **Why**: The procedure assesses facts in isolation. Cascading qualifications (multiple interdependent preconditions) exceed bounded reasoning capacity in 30 minutes. Engineers may misclassify as stable (**Flagged**) without seeing emergent volatility.  
  - **Mitigation**: Weekly review must cross-examine dependencies.  

  This procedure balances frame problem insights with operational pragmatism, converting philosophical distinctions into actionable steps while transparently exposing judgment calls.
