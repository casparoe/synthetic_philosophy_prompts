answer: |-
  ## The Board's Solution

  Observe how all must have a common PRICE
  Or else no scale exists to weigh the LIST
  Of cloth against the steel, the hay; the COST
  Of one path measured against another's NEED.
  The reckoning fails entirely HERE,
  They said, without that measure—not TODAY.

  But wait: the equations hold TODAY
  As well. Why must the shifting, real-world PRICE
  Be traded hand to hand right HERE
  To ground the calculation? Write the LIST
  Of quantities, then set a trial NEED,
  Then watch the surplus, tally up the COST.

  Adjust: where shortage bites, then let it COST
  A little more; where glut appears, TODAY
  Reduce the figure. Sense the latent NEED
  Through these reported gaps. Reset the PRICE.
  Revise the outputs on the master LIST.
  The process iterates until it's HERE

  That balance shows. The answer waits right HERE
  Inside the math. Why should the true COST
  Require a fist of coin? The formal LIST
  Is solved by calculation, not TODAY
  By shouts on trading floors. This chosen PRICE,
  Though set by clerks, can answer every NEED.

  But does it know the thing we didn't NEED
  Until it stirred? The sound unheard out HERE
  Beyond the columns? Something has no PRICE
  Assigned, no row, no place. What hidden COST
  Lurks in the gap? A want not shaped TODAY,
  No name on any LIST.

  The LIST we built holds only names we said.
  What new thing stirs, unmade, unfed,
  That NEED not be recorded? HERE

  We post the quote: "For next month, HERE
  The cost of steel is X." But HERE and COST
  Are shifting ground *now*, while TODAY
  Demands the action. Steel is needed HERE,
  Urgently, NOW. The posted PRICE
  Lags, chasing shadows. TODAY is elsewhere. NEED

  Outruns the rule. And when the falling COST
  Spreads wide, the marginal PRICE won't cover NEED.
  Set equal, loss accrues. Who pays the COST?
  Subsidy? Mark-up? Judgment intervenes HERE,
  Beyond the rule. The tidy LIST assumes TODAY
  Stands still. It does not. PRICE the cloth TODAY.

  The rule completes its turn: the words stand HERE.
  It found the COST, the PRICE, the LIST, the NEED,
  Solved for TODAY—but solved for names we said, not things that stand where things have gone.

  ---

  **Notes on the Argument:**
  *   **Lines 1-24:** Execute the Lange simulation faithfully. End-words permute mechanically, enacting the iterative process ("set a trial", "watch the surplus", "reset the price", "revise the outputs", "balance shows").
  *   **Stanza 5 (Lines 25-30):** Introduces the *naming problem*. "A want not shaped TODAY, / No name on any LIST." The system only handles pre-defined entities.
  *   **Stanza 6 (Lines 31-36):** Introduces *temporal dislocation* and *non-convexity*. "HERE / We post the quote... But HERE and COST / Are shifting ground *now*... TODAY / Demands the action." "The marginal PRICE won't cover NEED... Judgment intervenes HERE." The static model chases a dynamic reality.
  *   **Envoi (Lines 37-39):** The rule completes its cycle ("The rule completes its turn"), achieving formal solution ("It found the COST, the PRICE... Solved for TODAY"). But the final twist: "—but solved for names we said, not things that stand where things have gone." The solution is perfect for the *model*, but the *world* (HERE, TODAY) has moved on, rendering the solution obsolete. The tokens return, but their referents have vanished.
  *   **Part-of-Speech Shifts:** PRICE verbs (Stanza 3: "PRICE the cloth"), COST verbs (Stanza 4: "COST / A little more"; Stanza 6: "won't cover NEED"), NEED modal (Stanza 5: "NEED not be recorded"). These shifts demonstrate the rule operating purely syntactically, indifferent to meaning.
