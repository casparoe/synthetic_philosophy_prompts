      2. A forked chain case: A name is introduced and then passed along two different chains of communication, leading to two different referents (e.g., two isolated communities using the same name for different objects).
      3. A free case: The group can invent any case they like, but it should be set up so that one of the four categories (necessary a posteriori, contingent a priori, etc.) might arise.

