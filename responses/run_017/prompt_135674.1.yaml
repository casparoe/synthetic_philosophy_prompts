  We are designing a game for a reading group on Kripke's Naming and Necessity, focusing on necessary a posteriori truths and the rigidity of designators. The goal is to have participants generate their own cases and feel the distinction between necessary/contingent and a priori/a posteriori through a betting game.

  Key requirements:
  - 90 minutes total, no technology, just index cards and envelopes.
  - Groups of 3-4.
  - Participants create their own dubbings (no pattern-matching on Hesperus).
  - Two betting rounds: a sealed bet (before opening a dossier) and an open bet (after), with the sealed bet paying double to create pressure.
  - Must include:
    - Disjunctive dubbing: baptism with a counterfactual condition (e.g., "the unique F, or if not, what the committee would have chosen").
    - Forked chain: a name passed along a chain that splits, leading to two references.
  - Also include at least one contingent a priori and one necessary a posteriori case without labeling.
  - Debrief that explains rigidity, the two axes, and the specific cases.

  Structure:
  1. Introduction (10 mins)
  2. Case Creation (20 mins)
  3. First Betting Round (Sealed) (15 mins)
  4. Opening Dossiers and Second Betting Round (Open) (15 mins)
  5. Resolution and Scoring (15 mins)
  6. Debrief (15 mins)

