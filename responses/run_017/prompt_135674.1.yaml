    - The anti-descriptivist argument: The game might not fully capture that names are not descriptions. We see that in the disjunctive dubbing: if the name is rigid, then it's not equivalent to a description. The facilitator must emphasize this in the debrief.

    - Time: 90 minutes is tight. We might run over. Solution: Be strict on time.

    - Forked chain might be controversial: Some might think the name is ambiguous and the identity statement is neither true nor false? The facilitator should rule that in the case, we are considering the name as used in each community, and they are different, so the identity statement is false.

    - Disjunctive dubbing: Some might think the name is a description. In the debrief, explain that Kripke argues that even if the reference is fixed by a description, the name becomes a rigid designator.

  British English: We'll write the materials in British English.

  Let's write the rules for the groups.

  Rules handout (for participants):

    "Kripke Game

    Goal: Create cases and bet on whether an identity statement is necessary or contingent.

    Steps:

    1. In your group, create three cases (each on a separate index card). Each case must have:
          - A scenario describing how a name or names were introduced.
          - An identity statement (e.g., 'A = B').

        Case 1: Disjunctive Dubbing
          - The naming ceremony has a disjunctive condition (e.g., 'We name this planet "Vulcan" if it is the cause of the perturbations; if not, then the name goes to the real cause.')

        Case 2: Forked Chain
          - A name is introduced and then passed along two different chains of communication, leading to two communities using the name for two different objects.

        Case 3: Free Case
          - Use the prompt provided by the facilitator to create a case.

    2. For each case, create a dossier (on a separate card) that reveals the actual truth about the scenario (e.g., whether the identity statement is true or false in the actual world). Seal the dossier in an envelope.

    3. Also, for each case, write an answer card (for the facilitator) that states whether the identity statement is necessary or contingent and why.

    4. Exchange your three cases (with sealed dossiers) with another group.

    5. Betting Round 1 (sealed):
          - For each case, discuss in your group and decide: Is the identity statement necessary or contingent? (Remember: necessary means it has the same truth value in all possible worlds; contingent means it can be true in some and false in others.)
          - Write your answer (only the modal status: necessary or contingent) for each case on a bet card, put it in an envelope, and hand it to the facilitator. This bet is placed without opening the dossier.

    6. Betting Round 2 (open):
          - Open the dossier and learn the actual truth value (true or false) of the identity statement.
          - Discuss again: Is the identity statement necessary or contingent?
          - Write your answer for each case on a bet card and hand it to the facilitator.

    7. Scoring: 
          - Round 1: 2 points for each correct modal status.
          - Round 2: 1 point for each correct modal status.

    The group with the most points wins."

  We'll now write the minute-by-minute timeline with setup.

  Minute-by-minute:

    0-5: Introduction (5 mins)
          - Explain the game, the goal, and the structure.
          - Form groups (3-4 people per group, 4 groups for 14 people: two groups of 4 and two of 3? Or three groups of 4 and one of 2? Adjust as needed. Aim for 4 groups.)

    5-25: Case Creation (20 mins)
          - Distribute index cards, envelopes, and prompts for the free case (half get Prompt 1, half Prompt 2).
          - Groups create three cases and dossiers, and answer keys. Facilitator circulates to help and collect answer keys.

    25-30: Exchange (5 mins)
          - Groups pass their set of three cases (with sealed dossiers) to another group. Use a rotation: Group A to B, B to C, C to D, D to A.

    30-45: First Betting Round (15 mins)
          - Groups read the three cases they received and place their first bet (modal status only) for each case. They seal their bet cards in an envelope and hand to facilitator.

    45-60: Second Betting Round (15 mins)
          - Groups open the dossiers and learn the actual truth value.
          - They place their second bet (modal status) for each case and hand the bet cards to facilitator.

    60-75: Scoring (15 mins)
          - Facilitator reveals for each case: the actual truth value, the intended modal status (from answer key), and the bets.
          - Calculate scores per group.

    75-90: Debrief (15 mins)
          - Facilitator leads discussion as outlined.

  This is the design. We hope it works!
answer: |-
  ### Game Design: "Reference & Rigidity"  
  **Goal:** Participants experience the necessary a posteriori and contingent a priori through self-generated cases, betting mechanics, and implicit discovery of the modal-epistemic grid. Avoids pattern-matching by forcing original dubbings and high-stakes bets.  

  ---

  ### **Materials**  
  - **Index cards** (white and coloured):  
    - *White cards:* Scenario descriptions (one per case).  
    - *Coloured cards:* Dossiers (actual-world facts, sealed in envelopes), answer keys (for scoring), betting slips.  
  - **Envelopes** (one per dossier).  
  - **Pens**.  
  - **Timer**.  
  - **Pre-written prompt cards** (for case creation, in British English):  
    - *Disjunctive dubbing:* "Create a name whose baptism has a fallback: e.g., ‘Call this “Glom” if it’s the cause of the noise; if not, call whatever *would have been* chosen by the experts’."  
    - *Forked chain:* "Create a name passed down a chain that splits (e.g., two isolated villages using ‘Zarn’ for different rivers). What does ‘Zarn’ refer to if the split never happened?"  
    - *Free case prompts (shuffled, one per group):*  
      - Prompt A (contingent a priori): "Fix a reference using a description (e.g., ‘Let “Fiz” be the winner of the 2024 race’). Make a claim about Fiz that’s true by definition but might not hold."  
      - Prompt B (necessary a posteriori): "Two names introduced separately (e.g., ‘Thingamabob’ for a ship seen from afar, ‘Whatsit’ for the same ship docked). Later, we learn they co-refer."  

  ---

  ### **Rules & Setup**  
  **Groups:** 3–4 players per group (14 people → 4 groups).  
  **Time:** 90 minutes total.  

  #### **Phase 1: Case Creation (20 mins)**  
  - **0–5 mins:** Introduce rules. Groups create **three cases** (one per type) on index cards:  
    1. **Disjunctive dubbing** (use prompt card).  
    2. **Forked chain** (use prompt card).  
    3. **Free case** (use assigned Prompt A or B).  
  - Each case includes:  
    - A **naming ceremony** (e.g., "In 1990, explorers dubbed this island ‘Atlantis’ *if* it’s the lost city; else, it names whatever they *would have* dubbed").  
    - An **identity statement** (e.g., "Atlantis = the island we are standing on").  
    - A **dossier** (actual-world truth: e.g., "The island is NOT the lost city; experts would have dubbed Island X"). *Sealed in an envelope*.  
    - An **answer key** (for facilitator): Modal status (necessary/contingent) and brief rationale.  
  - **Facilitator circulates:** Ensures cases are original and answer keys align with Kripkean rigidity (e.g., disjunctive names are rigid if they pick one object across worlds).  

  #### **Phase 2: Betting Rounds (30 mins)**  
  Groups swap cases (Group A → B → C → D → A). Each group now has 3 new cases.  
  - **Round 1: Sealed Bet (15 mins)**  
    - Groups read scenarios *without opening dossiers*.  
    - For each case, bet **£10** on whether the statement is:  
      - **Necessary** (true/false in all possible worlds) or **Contingent** (true/false only in some).  
    - Write bets on slips, seal in envelopes, hand to facilitator. *Sealed bets pay **£20** if correct*.  
  - **Round 2: Open Bet (15 mins)**  
    - Open dossiers, learn actual truth value (e.g., "Atlantis = Island X is false").  
    - Bet again **£10** on necessary/contingent. *Open bets pay **£10** if correct*.  
    - Groups *must* place both bets; no abstentions.  

  #### **Phase 3: Scoring & Debrief (40 mins)**  
  - **Scoring (15 mins):**  
    - Facilitator reveals answer keys and scores bets.  
    - **Payoff example:**  
      - Sealed bet correct: +£20.  
      - Open bet correct: +£10.  
      - Max £90/group (3 cases × £30).  
    - *Money is fictional; track points on paper*.  
  - **Debrief (25 mins):** Structured discussion:  

  | **Game Moment**          | **Kripkean Concept**                                                                 | **Debrief Question**                                                                 |
  |--------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | **Sealed → Open bet shift** | Modal status ≠ warrant; necessary a posteriori truths don’t "change".                  | "When you learned the truth value, why did some of you change your modal bet? Did the *worlds* change, or just your knowledge?" |
  | **Disjunctive dubbing case** | Rigidity vs. descriptivism: A rigid term picks the *same* object in all worlds, even if dubbed by a fallback. | "In the Atlantis case, is ‘Atlantis’ rigid? Does it refer to *this island* in all worlds, or whatever fits the description?" |
  | **Forked chain case**      | Reference depends on historical chains, not descriptions. In counterfactuals, rigidity resolves ambiguity. | "If the chain hadn’t split, what would ‘Zarn’ refer to? Is this fixed by the original dub or the speakers’ intents?" |
  | **Contingent a priori case** (Prompt A) | Reference-fixing descriptions create contingent truths knowable a priori (e.g., "Fiz won"). | "Why is ‘Fiz won’ true by definition but possibly false in another world?" |
  | **Necessary a posteriori case** (Prompt B) | Identity between rigid designators is necessary but discovered empirically.             | "Why is ‘Thingamabob = Whatsit’ necessary if we needed telescopes to confirm it?" |
  | **Betting payoff pressure** | Highlights epistemic access ≠ modal fact. Sealed bets mimic a priori reasoning.        | "Why did betting *before* the dossier feel different? What ‘price’ did you pay for waiting?" |

  **Key grid reveal:** Draw the 2×2 during debrief:  
  - Necessary a posteriori: "Hesperus = Phosphorus" (empirically discovered necessity).  
  - Contingent a priori: "Stick S is 1 metre long" (contingent but reference-fixing).  
  - **Avoid terms like "rigid" or "a posteriori" until now.**  

  ---

  ### **Timeline**  
  - **0–5 mins:** Intro, group formation, rules.  
  - **5–25 mins:** Case creation (groups write scenarios + dossiers).  
  - **25–30 mins:** Case swap.  
  - **30–45 mins:** Sealed bets (groups bet blind).  
  - **45–60 mins:** Open bets (groups bet with dossier facts).  
  - **60–75 mins:** Scoring (facilitator tallies points).  
  - **75–90 mins:** Structured debrief.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"This is just descriptivism in disguise!"** (re disjunctive dubbing):  
     - *Fix:* In debrief, stress that rigidity means the *dubbed object* is fixed, not the description. Ask: "If Atlantis isn’t the lost city, does ‘Atlantis’ still refer to *this island* in a world where the experts chose differently?"  

  2. **Forked chain stalemate:**  
     - Groups may argue "the name is ambiguous!" and refuse to bet.  
     - *Fix:* Rule that in counterfactuals, the original dub determines reference. Score based on answer keys. Say: "Kripke insists chains trace to *one* baptism—even if split, one branch is ‘corrupted’."  

  3. **Metagaming payoffs:**  
     - Players may bet randomly in Round 1 to "game" the £20 payout.  
     - *Fix:* Warn that groups with inconsistent bets (e.g., calling something "contingent" blindly, then "necessary" after learning truth) lose £5 per case.  

  4. **Arguing metaphysics mid-game:**  
     - *Fix:* Pause and say: "Save debates for debrief—*now*, commit to a bet. Your £10 is on the line!"  

  5. **Finite scenarios ≠ metaphysical necessity:**  
     - *Limitation:* The game can’t model "all possible worlds"—only the worlds groups imagined.  
     - *Mitigation:* In debrief, clarify: "Our cards are stand-ins for Kripke’s point: necessity isn’t about what we *imagined*, but what *must* hold given rigidity."  

  ---

  ### **Why Your Betting Idea Works**  
  The two-round structure creates tangible stakes:  
  - **Sealed bet:** Players *feel* the pressure of judging modality without empirical access (mimicking a priori reasoning). Changing bets after opening the dossier incurs a "cost" (lower payout), mirroring how warrant shifts while modal facts don’t.  
  - **Payoff asymmetry (£20 vs. £10):** Incentivizes early commitment, forcing players to confront their implicit descriptivism (e.g., "I’ll call it contingent now and ‘necessary’ later if true").  

  ### **What the Game Can’t Do**  
  - **Anti-descriptivist "punch":** The game shows *that* rigidity matters, but not *why* descriptivism fails. You’ll need to add: "Kripke’s insight is that names don’t *mean* descriptions—they ‘hook’ objects directly. Descriptions fix reference, but don’t define the term."  
  - **Metaphysical necessity:** Cards can’t replicate infinite possible worlds. Stress in debrief: "Necessity isn’t ‘what’s on the cards’—it’s what follows from terms latching onto objects rigidly."  

  ### **Final Notes**  
  - **British English:** Done (e.g., "dossier", "fortnightly", "metre").  
  - **First-run advice:** Assign a "quiet" philosopher as a roving helper during case creation. They’ll nip wriggling in the bud (e.g., "If Atlantis isn’t the lost city, does it still name *this island* in your scenario?").  
  - **Success metric:** If players groan, "I bet £20 on contingent, but it *felt* necessary after we opened it—that cost me!", you’ve won.  

  ---  
  **Output:** Rules, materials, timeline, payoffs, debrief, and pitfalls covered. Run it, then repair over pints.
