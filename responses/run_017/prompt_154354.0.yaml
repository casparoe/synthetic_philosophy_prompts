                P_A1(H=true, E2=pos | E1=pos) = 0.32 / 0.6 = 0.5333
                P_A1(H=true, E2=neg | E1=pos) = 0.04 / 0.6 ≈ 0.0667
                P_A1(H=false, E2=pos | E1=pos) = 0.032 / 0.6 ≈ 0.0533
                P_A1(H=false, E2=neg | E1=pos) = 0.208 / 0.6 ≈ 0.3467

