            P_A1(H=true, E2=pos | E1=neg) = 0.005714 / 0.4 ≈ 0.014285
            P_A1(H=true, E2=neg | E1=neg) = 0.005714 / 0.4 ≈ 0.014285
            P_A1(H=false, E2=pos | E1=neg) = 0.03657 / 0.4 ≈ 0.091425
            P_A1(H=false, E2=neg | E1=neg) = 0.3520 / 0.4 = 0.88

