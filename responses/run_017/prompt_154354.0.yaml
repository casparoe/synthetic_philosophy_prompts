            = 0.32+0.04=0.36; 0.36+0.005714≈0.3657; 0.3657+0.005714≈0.3714; 0.3714+0.032=0.4034; 
              0.4034+0.208=0.6114; 0.6114+0.03657≈0.648; 0.648+0.3520≈1.000.

          So no normalization needed? Actually, it sums to 1? Let me check again:

            0.32 + 0.04 = 0.36
            0.005714 + 0.005714 = 0.011428
            0.032 + 0.208 = 0.24
            0.03657 + 0.3520 = 0.38857

            Total: 0.36 + 0.011428 = 0.371428; +0.24 = 0.611428; +0.38857 = 1.0.

          So it's normalized.

          Now, we must check that the conditionals for H and E2 given E1 are preserved? 
          Specifically, rigidity for the update on E1 requires that for each value of E1, the conditional distribution of the rest (H and E2) given that E1 value remains the same.

          Let's check for E1=pos:

            In the prior, given E1=pos, we had:

              P_prior(H=true, E2=pos | E1=pos) = P(H=true, E1=pos, E2=pos) / P_prior(E1=pos) = 0.16 / 0.30 = 16/30 ≈ 0.5333
              P_prior(H=true, E2=neg | E1=pos) = 0.02 / 0.30 ≈ 0.0667
              P_prior(H=false, E2=pos | E1=pos) = 0.016 / 0.30 ≈ 0.0533
