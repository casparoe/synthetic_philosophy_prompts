                           + P_A1(H=false, E1=pos, E2=pos) + P_A1(H=false, E1=neg, E2=pos)
                         = 0.32 + 0.005714 + 0.032 + 0.03657 
                         = 0.32 + 0.032 = 0.352; 0.005714+0.03657≈0.042284; total≈0.394284

