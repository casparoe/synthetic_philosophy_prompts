answer: |-
  Below is a systematic translation of the problem of universals into your PL-theoretic vocabulary, followed by residue analysis and evaluation of graded membership. Key points signaling conceptual friction or smuggling are flagged with ⚠️.

  ---

  ### **1. Philosophical Positions Translated**
  *(With conceptual mappings and caveats)*

  - **Ante Rem Realism**  
    *Translation:* Universals are nominal types declared in a global signature (e.g., `type Red`), existing independently of tokens. Particulars `a`, `b` instantiate `Red` via explicit typing judgments (`a : Red`, `b : Red`).  
    *Maps to:* Nominal typing + global type declarations.  
    *Distortion:* PL types are design artifacts; ante rem realism posits mind-independent existence. ⚠️ Smuggles idealism.  
    *Sparse/Abundant:* Sparse (only fundamental types exist).

  - **In Re Realism (Immanent Realism)**  
    *Translation:* Universals are structural types inferred from shared properties of tokens. `Red` is the intersection type `{ color: "red" }` inferred from `a : { color: "red", ... }`, `b : { color: "red", ... }`.  
    *Maps to:* Structural typing + type inference.  
    *Distortion:* Structural types describe similarity, not numerical identity. Inference ≠ ontological grounding.  
    *Sparse/Abundant:* Sparse (types correspond to natural properties).

  - **Trope Theory**  
    *Translation:* Each particular has a singleton refinement type (e.g., `a : Redₐ` where `Redₐ = { color: #FF0000, location: (x,y,z) }`). "Redness" is a family of isomorphic but distinct types (`Redₐ ≅ Redᵦ`).  
    *Maps to:* Singleton types + refinement types.  
    *Distortion:* Tropes are concrete instances; singleton types are still abstract descriptions.  
    *Sparse/Abundant:* Abundant (every trope is a unique type).

  - **Resemblance Nominalism**  
    *Translation:* No universal `Red`. Instead, a predicate `isRed(x)` defined by similarity to a prototype:  
    ```haskell  
    isRed(x) = sim(x, red_prototype) > threshold  
    ```  
    *Maps to:* Structural similarity + ad hoc polymorphism (overloaded predicates).  
    *Distortion:* Resemblance is primitive; PL similarity is a function. Missing metaphysical basis.  
    *Sparse/Abundant:* Sparse (resemblance classes are natural).

  - **Predicate ("Ostrich") Nominalism**  
    *Translation:* `isRed(x)` is an unanalyzable primitive predicate in the signature. No type `Red` exists—only syntactic tokens.  
    *Maps to:* Uninterpreted base predicates + no types.  
    *Maps to:* Erasure (types vanish at runtime) + nominalism.  
    *Distortion:* Denies any grounding; PL predicates still have semantic rules.  
    *Sparse/Abundant:* Abundant (any predicate is acceptable).

  ---

  ### **2. Residue Report**  
  **Sticking Points & Verdicts:**  

  **(a) Numerical Identity vs. Structural Similarity**  
  - **Realist Claim:** Universals are numerically identical across tokens (`Red` in `a` = `Red` in `b`).  
  - **PL Translation:** Structural typing gives `a ≅ b` (isomorphic), but `a.T ≠ b.T` under nominal typing. Graded similarity ≠ identity.  
  - **Verdict:** ⚠️ **Distortion.** PL has no identity for "shared content"—only token equivalence or isomorphism. Realism’s "strict identity" is untranslatable; it collapses into structural similarity.  

  **(b) Discovery vs. Stipulation**  
  - **Realist Claim:** Universals are discovered (mind-independent).  
  - **PL Vocabulary:** Types are stipulated by design (e.g., `interface Red { color: string }`).  
  - **Verdict:** ⚠️ **Smuggling.** PL assumes types are artifacts, implicitly rejecting realism’s epistemic priority. No PL mechanism for "discovery" (e.g., type inference still relies on designed features).  

  **(c) Self-Predication & Third Man as Impredicativity**  
  - **Regress Problem:** If `Red` is red, we need `Red₂` to instantiate redness, ad infinitum.  
  - **PL Translation:**  
    - **Self-Predication:** `Red : Red` → ill-typed under universe hierarchies (e.g., `Type₁` cannot inhabit itself).  
    - **Third Man:** Defining a type `Red₂` quantifying over all red things (including `Red`) → impredicativity (e.g., `Red₂ : ∀(T: Type). isRed(T) → T`).  
  - **Verdict:** **Genuine Translation.** The regress *is* an impredicativity error (defining a type in terms of a totality including itself). Universe polymorphism (e.g., `Typeᵢ`) blocks it cleanly.  

  ---

  ### **3. Graded Membership & Resemblance Nominalism**  
  **Your Proposal:**  
  ```haskell  
  Γ ⊢ t : T[θ]  iff  sim(t, proto_T) > θ  
  ```  
  where `θ` is a threshold parameter.  

  **Evaluation:**  
  - **Resemblance Nominalism?**  
    - **Yes:** Directly captures resemblance to a prototype. Threshold `θ` replaces exact similarity.  
    - **But:** Resemblance nominalism requires *primitiveness*—no further reduction. Here, `sim(·,·)` is a function (e.g., cosine similarity), reducing resemblance to lower-level properties. ⚠️ Smuggles structuralism.  

  - **Trope Theory?**  
    - **No:** Tropes are particularized properties (e.g., `a`’s redness ≠ `b`’s redness). Graded membership aggregates tokens into one type `T`, ignoring token-specificity.  
    - **Fix:** Assign each token a *unique refinement type* `Tₜ` (e.g., `Redₐ`), then define similarity over these types:  
      ```coq  
      sim_type(Tₐ, Tᵦ) := similarity of their property sets  
      ```  

  - **Failure as Realism?**  
    Graded membership **cannot express realism** because:  
    - Realism requires numerical identity (`T` in `a` = `T` in `b`), but here `T` is a function of `proto_T` and `θ`.  
    - Threshold relativity (`θ`) makes types subjective/contextual—antithetical to realism.  

  **Verdict:** Graded membership is **resemblance nominalism implemented structurally**. It fails as trope theory (lacks token uniqueness) and realism (lacks identity). The "failure" shows resemblance nominalism **depends on structural similarity**, collapsing into a lightweight realism if `sim(·,·)` is natural.  

  ---

  ### **Final Residue & Conclusions**  
  **Where Translation Fails:**  
  1. **Numerical Identity:** PL has no analogue for "one thing multiply located." This is a **blind spot** in your vocabulary.  
  2. **Mind-Independence:** PL types are artifacts; realism requires discovery. This **exposes a question-begging assumption** in PL.  
  3. **Primitive Resemblance:** Graded membership reduces resemblance to a function, while nominalism treats it as irreducible. **Distortion via structuralism.**  

  **Is the Residue a Blind Spot or Philosophical Unsharpness?**  
  - **Blind spot:** Your vocabulary lacks resources for **mind-independent existence** and **strict identity-in-multiplicity**. These are genuine gaps.  
  - **Unsharpness:** Disputes over "natural properties" (sparse vs. abundant) map poorly because PL has no objective criterion for type fundamentality. This reveals philosophical vagueness.  

  **Conclusion:** Your framework best captures **structuralism** (in re realism) and **nominalism** (predicates/graded types). Ante rem realism and trope theory require smuggling (global types/singletons). The residue shows PL vocabulary **illuminates but cannot resolve** the metaphysical dispute—it rewrites it as a design choice between nominal/structural typing and inference rules. The "problem" dissolves into engineering trade-offs.
