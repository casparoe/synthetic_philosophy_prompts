answer: |-
  ### Final Exam Question: Dutch Books and Defensive Coherence  
  **Time Limit:** 90 minutes  
  **Word Limit:** 800 words  

  ---

  **Background:**  
  Recall the standard Dutch book argument for probabilism:  
  - An agent’s *fair price* for a $1 bet on event \(X\) is \(p\) iff they value that bet at \(\$p\).  
  - A *sure loss* is a set of bets guaranteeing negative net payoff in every possible state.  
  - A *Dutch book* is a set of bets a shrewd bookie can offer (at the agent’s fair prices) to inflict a sure loss.  
  - The Dutch book theorem shows that if an agent’s credences violate the probability axioms, they are susceptible to a Dutch book.  

  **Scenario:**  
  Suppose a bookie faces a fixed **transaction cost** \(c > 0\) per bet offered. For any bet the bookie proposes:  
  - If the agent buys a bet for \(\$q\), the bookie receives \(\$q - c\) (net).  
  - If the agent sells a bet for \(\$q\), the bookie pays \(\$q + c\) (net).  
  The bookie only offers bets that guarantee them a profit *after costs*.  

  **Question:**  
  Consider an agent with credences violating finite additivity:  
  - \(P(A) = 0.4\), \(P(B) = 0.4\), but \(A \cap B = \emptyset\) and \(P(A \cup B) = 0.7\).  
  Assume the agent takes either side of any bet at their fair price.  

  1. **Vulnerability Analysis:**  
     - Explain how, *without transaction costs* (\(c = 0\)), a bookie could inflict a sure loss on this agent. Specify the bets and the guaranteed loss.  
     - Now assume \(c = 0.05\). Show whether the bookie can still inflict a sure loss *after costs*. Calculate explicitly.  

  2. **Philosophical Implications:**  
     - If the agent is unexploitable under \(c > 0\), does this imply their incoherent credences are "harmless" in this context? Or does it reveal that the Dutch book argument was never fundamentally about monetary loss?  
     - The Dutch book theorem is often interpreted as a *purely defensive* norm ("avoid sure losses"). Does this defensive character weaken its support for probabilism as an *epistemic* norm? If so, why? If not, what alternative rationale might it provide?  

  *Define all terms, specify bets as (event, direction, stake), and state any assumptions. Clarity and precision are prioritized over length.*  

  ---

  ### Model Answer (687 words)  

  #### 1. Vulnerability Analysis  
  **Without costs (\(c = 0\)):**  
  The agent’s incoherence (since \(P(A) + P(B) = 0.8 > P(A \cup B) = 0.7\)) allows a Dutch book. The bookie can:  
  - Sell the agent a $1 bet on \(A\) for \(P(A) = \$0.4\).  
  - Sell a $1 bet on \(B\) for \(P(B) = \$0.4\).  
  - Buy a $1 bet on \(A \cup B\) from the agent for \(P(A \cup B) = \$0.7\).  
  Net initial payment *to bookie*: \(0.4 + 0.4 - 0.7 = \$0.1\). Payoffs in all states:  
  - If \(A\) occurs: Bookie pays $1 (on bet for \(A\)) but gains $1 (from \(A \cup B\) bet). Net: \(0.1 -1 +1 = \$0.1\)  
  - Similarly if \(B\) occurs: Same as above.  
  - If neither occurs: Bookie gains $1 (from \(A \cup B\) bet). Net: \(0.1 + 1 = \$1.1\)  
  *This is not a sure loss*: The bookie profits, but the agent does not lose in all states.  

  **Correction:** The standard exploit requires:  
  - Buy bet on \(A\): Agent pays bookie \(0.4\) for $1 if \(A\).  
  - Buy bet on \(B\): Agent pays \(0.4\) for $1 if \(B\).  
  - *Sell* bet on \(A \cup B\): Bookie pays agent \(0.7\) for $1 if \(A \cup B\).  
  Agent’s net payout: \(-0.4 -0.4 + 0.7 = -\$0.1\). State-dependent payoffs:  
  - If \(A\): Agent receives $1 (from \(A\) bet) but pays $1 (on \(A \cup B\)). Net: \(-0.1 +1 -1 = -\$0.1\)  
  - If \(B\): Same as above.  
  - If neither: Agent pays $1 (on \(A \cup B\)). Net: \(-0.1 -1 = -\$1.1\)  
  Agent loses in all states: Sure loss of at least \(\$0.1\).  

  **With \(c = 0.05\):**  
  Bookie must profit after costs. For the above Dutch book:  
  - When selling bets (on \(A\) and \(B\)), bookie receives \(0.4 - c = \$0.35\) per bet (net).  
  - When buying bet (on \(A \cup B\)), bookie pays \(0.7 + c = \$0.75\) (net).  
  Bookie’s net intake: \(0.35 + 0.35 - 0.75 = -\$0.05\). This guarantees a *loss for the bookie*, not the agent. The bookie *cannot* offer this book profitably.  

  **Alternative exploit?**  
  Suppose bookie sells a bet on \(A \cup B\) for \(P(A \cup B) = 0.7\) (receives \(0.7 - c = 0.65\)), and buys bets on \(A\) and \(B\) for \(0.4\) each (pays \(0.4 + c = 0.45\) per bet). Net intake: \(0.65 - 0.45 - 0.45 = -\$0.25\). Still unprofitable for bookie.  
  *Conclusion*: With \(c = 0.05\), no Dutch book exists—the incoherence is unexploitable.  

  #### 2. Philosophical Implications  
  **Harmlessness of incoherence?**  
  Unexploitability under friction does *not* imply incoherence is harmless. It exposes that the Dutch book argument’s core is not monetary loss *per se* but **internal consistency in valuation**. The agent’s fair prices violate dominance: They value a portfolio of bets on \(A\) and \(B\) at \(0.8\) but a strictly dominant bet on \(A \cup B\) at \(0.7\). Transaction costs mask this with "noise," but the inconsistency remains a rational flaw.  

  **Defensive norm and epistemic force:**  
  The Dutch book *is* defensively oriented—it only shows incoherent agents *can* be harmed, not that coherent agents gain. This need not weaken its support for probabilism. Key assumptions clarify its purpose:  
  - **Bet acceptance at fair prices**: Reveals that incoherent agents misvalue contingencies. The loss is proof of this misvaluation, not the primary aim.  
  - **Linear utility**: If utility is linear in money, sure loss implies real harm. But if not, the argument adapts (e.g., in utility terms).  
  - **Bookie’s freedom**: The bookie’s role is to *test* consistency. Friction limits testing feasibility, not normative validity.  

  Thus, even for an isolated agent (no bookie), the argument implies: If you evaluate bets at fair prices, incoherence makes your valuations self-undermining. Probabilism avoids this *self-sabotage*, whether exploited or not. The defensive framing is the *mechanism*, not the *foundation*. It supports probabilism as a consistency norm for doxastic states, with money as a scoring tool.  

  ---

  ### Marking Scheme (20 points)  
  | **Points** | **Criterion**                                                                 | **Common Errors** |  
  |------------|-------------------------------------------------------------------------------|-------------------|  
  | **4**      | **Correct Dutch book without costs**: Full specification of bets/states showing sure loss. | Omitting net initial payment; confusing buy/sell directions; not verifying all states. |  
  | **5**      | **Transaction cost impact**: Correct calculations proving unexploitability at \(c=0.05\). | Ignoring cost direction (e.g., adding \(c\) when bookie sells); not showing bookie’s loss; claiming "no effect." |  
  | **5**      | **Interpretation of unexploitability**: Argues it reveals inconsistency, not monetary harm. | Claiming "no exploitation = no problem"; conflating normative force with empirical exploitability. |  
  | **4**      | **Defensive norm & epistemic rationale**: Links assumptions to consistency; distinguishes mechanism from foundation. | Reducing argument to "avoiding scams"; ignoring bet-acceptance assumption; claiming it *only* defends against bookies. |  
  | **2**      | **Precision**: Clear definitions, no irrelevant tangents, self-contained. | Undefined terms; discussing accuracy arguments; verbose speculation. |  

  ### Design Note: Contested Elements & Adjustments  
  - **Contested in model answer**: The claim that the Dutch book’s "true target" is *consistency in valuation* (not money) leans into Christensen’s "depragmatized" view. Some (e.g., Hájek) argue this undermines the argument’s intuitive force. The model answer treats money as instrumental, but if money is *necessary* for the normative bite (e.g., in empirical risk contexts), the defensive framing might be central.  
  - **Adjustment trigger**: If students universally miss that friction exposes the consistency norm, I’d simplify the case (e.g., \(P(A)=0.5, P(\neg A)=0.6\), \(c=0.05\)) to make gaps more obvious. If the "no bookie" variant tests better, swap friction for isolation—but friction better forces quantitative engagement.  
  - **Red herring?** The defensive framing *is* incomplete but not a red herring—it’s the starting point. The question forces students to *build past it* using assumptions. Centerpiece: **The argument uses exploitability to prove inconsistency; the rest is commentary**.
