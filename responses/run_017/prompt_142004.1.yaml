  ### Decision Tree: Kavka's Toxin Puzzle

  **Root: Accepting Setup Assumptions**  
  *All agents grant: counterfactual reliability of payoff to intention at midnight (not evidence, prediction, behavior, or scans); full information at midnight; drinking at noon strictly against interests; no commitment devices unless variant specifies.*

  **Node 1: Amnesia Variant**  
  *Dense retrograde amnesia after midnight erases all memory of the intention and its reasons, but detection is unaffected. Can the agent form the intention at midnight such that it persists and is detected despite amnesia?*  
  - **No** → Mental state difficulty (proceed to Node 2).  
  - **Yes** → Rationality difficulty (proceed to Node 4).  

  ---

  ### Mental State Difficulty Branch  
  *Difficulty located in forming/maintaining intention as a mental state.*  

  **Node 2: Lockbox Variant**  
  *An irrevocable capsule makes drinking automatic, but using it forfeits the reward. Can the agent form a "bare" intention (without the capsule) at midnight?*  
  - **No** → *Leaf 1: External Commitment Required (unoccupied)*.  
    - *Awkward: Implies intentions are impossible without external enforcement, contradicting ordinary cases of voluntary action.*  
  - **Yes** → Proceed to Node 3.  

  **Node 3: Stutter Variant**  
  *Mechanism samples intention at ten unannounced times between midnight and noon; payoff only if present at all. If formed, can the agent maintain the intention stably?*  
  - **No** → *Leaf 2: Temporal Fragility (unoccupied)*.  
    - *Awkward: Fails to explain how stable intentions form for distant-future actions in ordinary life.*  
  - **Yes** → *Leaf 3: Deflationary (Attitude Formation)*.  
    - *Awkward: Treats the puzzle as ordinary difficulty in forming attitudes, ignoring rational conflicts unique to the toxin structure.*  

  ---

  ### Rationality Difficulty Branch  
  *Difficulty located in norms of practical rationality for forming/acting on intention.*  

  **Node 4: Deterrence Variant**  
  *Intention's value lies only in an adversary's belief; executing it is pure loss. Is it rational to form the intention?*  
  - **No** → *Leaf 4: Kavka's Skeptical Conclusion*.  
    - *Awkward: Cannot explain how agents form intentions in ordinary cases where action is likely but not certain.*  
  - **Yes** → Proceed to Node 5.  

  **Node 5: Friction Variant**  
  *At noon, the vial is behind a lock requiring 20 minutes of mildly annoying work to open. If the intention is formed, is it rational to open the lock and drink?*  
  - **Yes** → *Leaf 5: Must Drink*.  
    - *Awkward: Requires acting against current interests with no offsetting gain, violating instrumental rationality.*  
  - **No** → Proceed to Node 6.  

  **Node 6: Late Counteroffer Variant**  
  *At noon, an unexpected payment is offered for not drinking. Would abandoning the intention be rational?*  
  - **Yes** → *Leaf 6: Evidential Decision Theory (EDT)*.  
    - *Awkward: Treats forming intention as evidence of drinking, but in toxin, forming causes reward without causing action (causing/evidencing confusion).*  
  - **No** → *Leaf 7: Resolute Choice*.  
    - *Awkward: Demands sticking to prior commitments even when new information makes it costly and dominance-violating.*  

