              A1: 0.2*120+0.7*1+0.1*0 = 24+0.7=24.7
              A2: 0.2*90+0.7*1+0.1*1 = 18+0.7+0.1=18.8
              -> choose A1 (24.7>18.8)
          Total: 20.8+24.7=45.5

          Path B+B1:
              round1: 16
              round2: 0.2*150+0.7*1+0.1*1 = 30+0.7+0.1=30.8
              total: 16+30.8=46.8 > 45.5

     Type3: (0.1,0.2,0.7)
          Myopic round1:
              A: 0.1*100+0.2*1+0.7*1 = 10+0.2+0.7=10.9
              B: 0.1*80 = 8
              -> choose A
          Round2:
              A1: 0.1*120+0.2*1+0.7*0 = 12+0.2=12.2
              A2: 0.1*90+0.2*1+0.7*1 = 9+0.2+0.7=9.9
              -> choose A1 (12.2>9.9)
          Total: 10.9+12.2=23.1

          Path B+B1:
              round1: 8
              round2: 0.1*150+0.2*1+0.7*1 = 15+0.2+0.7=15.9
              total: 8+15.9=23.9 > 23.1

     Type4: uniform (0.33,0.34,0.33) 
          Myopic round1:
              A: 0.33*100+0.34*1+0.33*1 = 33+0.34+0.33=33.67
              B: 0.33*80=26.4
              -> choose A
          Round2:
              A1: 0.33*120+0.34*1+0.33*0 = 39.6+0.34=39.94
              A2: 0.33*90+0.34*1+0.33*1 = 29.7+0.34+0.33=30.37
              -> choose A1
          Total: 33.67+39.94=73.61

          Path B+B1:
              round1: 26.4
              round2: 0.33*150+0.34*1+0.33*1 = 49.5+0.34+0.33=50.17
              total: 26.4+50.17=76.57 > 73.61

     So for all types, the path B+B1 has higher expected score than the myopic path (which is A then A1). 

     But in the myopic approach, they choose A in round1 and then in round2 they choose A1, which is bad for deontic and also not the best in utility.

     However, note that in round2, type3 (high deontic) should have preferred A2, because for them:
          A2: 0.1*90+0.2*1+0.7*1 = 9+0.2+0.7=9.9
          A1: 0.1*120+0.2*1+0.7*0 = 12+0.2=12.2 -> wait, no, because the deontic score for A1 is 0, but their weight for deontic is 0.7, so they get 0 for deontic in round2. But they also get util and satisficing. They might prefer A1 because 12.2>9.9.

     But let's recalculated for type3 in round2:

          A1: Util:120 -> 0.1*120=12, Satisficing:1 -> 0.2*1=0.2, Deontic:0 -> 0.7*0=0 -> total 12.2
          A2: Util:90 -> 0.1*90=9, Satisficing:1 -> 0.2, Deontic:1 -> 0.7 -> total 9+0.2+0.7=9.9

     So they prefer A1. But if the true view is deontic, then the entire path gets 1 (round1 permitted) + 0 (round2 forbidden) = 1.

     Whereas if they had chosen A2, they would have gotten 1+1=2.

     But in expected score, they get more for A1 because of the util. 

     We want to show that myopic is bad, but also that aggregation is a substantive act. 

     The above setup shows that planning ahead (choosing B in round1) is better in expectation for everyone. But will the committee see that?

     In round1, they vote between A and B. If they vote myopically, they will choose A. If they consider the whole game, they might choose B.

     We want the committee to have the option to discuss the future.

     Also, we have the option for pledges between rounds.

  ## Step 6: The Pledges

     Between round1 and round2, we allow students to make public pledges. For example, a student might say: "If you vote for my preferred option in round2, I will vote for yours in round2." But round2 has two separate votes (depending on round1 outcome). 

     We might design it so that after round1, they know which branch they are in, and then they can pledge for the round2 vote in that branch.

     We also want a reason to break the pledge. So maybe in round2, new information? But we don't have new information.

     Alternatively, we can have the round2 options have a feature that might change the students' minds. But it's complicated.

     Maybe we skip the pledges to keep it within 90 minutes.

  ## Step 7: The Cards and Rounds

     We'll have two rounds:

     Round1: choose between A and B.

     Then, after round1, we reveal the round2 options (either A1,A2 or B1,B2).

     Then round2: choose between the two options in the chosen branch.

     The committee votes by majority in each round.

     The students have their cards, which include their confidence distribution and the full set of view verdicts for all options in both rounds. They can reveal or lie.

     After both rounds, the instructor draws a random view (Utilitarian, Satisficing, or Deontic) with equal probability? Or according to the average confidence? We said a single random draw. Let's do with equal probability (1/3 for each) for simplicity.

     Then, for each student, we compute the score: 
          Score = the score of the committee's choices according to the drawn view.

     For example, if the drawn view is utilitarian, then the score is the sum of the util scores for the chosen options.

     If satisficing, it's the number of rounds in which the chosen option was acceptable.

     If deontic, the number of rounds in which the chosen option was permitted.

     Then, we sum the scores over the two rounds.

     The students' individual scores are then these points.

     Plus, the committee's final choices determine a donation. How about:

          If the committee's choices in both rounds are in branch A (A and then either A1 or A2), then we donate to Cause 1.

          If in branch B (B and then B1 or B2), then donate to Cause 2.

     We choose two local causes that are somewhat controversial or have different moral justifications.

  ## Step 8: Minute-by-Minute

     Total time: 90 minutes.

     - Introduction: 5 minutes
          Explain the setting: funding committee, two rounds, options in round2 depend on round1.
          Explain the scoring: 
              - Each student has a private card with their confidence in three moral views and the verdicts of these views on the options.
              - After the game, we will draw which view is "true" and score the committee's choices based on that view.
              - Their score will be the points from that view, and also we will make a donation based on the outcome.
          Donation: 
              Cause 1: e.g., "Clean Water for All" (local water charity)
              Cause 2: e.g., "Vaccines for Children" (local vaccine charity)
          Explain that they may reveal or not their card as they wish.

     - Distribution of cards: 5 minutes
          Hand out the 4 types of cards (4 of each type) randomly.

     - Round1 discussion and vote: 20 minutes
          They discuss and vote on A vs B.
          We expect them to discuss how to aggregate the views.
          They might form groups by view confidence.
          Vote by show of hands? Or secret ballot? We want it to be by majority, so we can do show of hands.

     - After round1, reveal the round2 options: 5 minutes
          If they chose A, they see A1 and A2.
          If they chose B, they see B1 and B2.

     - Round2 discussion and vote: 20 minutes
          They discuss and vote on the two options in the chosen branch.

     - Scoring: 10 minutes
          Randomly draw one of the three views (by lottery: put three papers in a hat, draw one).
          Then, for that view, compute the score for the committee's choices (both rounds).
          For each student, that score is their points.

     - Donation announcement: 1 minute

     - Debrief: 24 minutes (we have 5 minutes buffer)

  ## Step 9: The Cards

     Each card has:

     [Student's Name] (optional)

     Your confidence distribution:
        Utilitarian: [pU] 
        Satisficing: [pS]
        Deontic: [pD]

     The verdicts of each view:

     Round 1 options:
        A: Vaccine Program
          - Utilitarian: 100
          - Satisficing: acceptable (value=60, threshold=50) [we include the value for the satisficing view? But the view doesn't use it. We can just say: acceptable]
          - Deontic: permitted
        B: Sanitation Improvement
          - Utilitarian: 80
          - Satisficing: not acceptable (value=40)
          - Deontic: forbidden

     If Round 1 choice is A, then Round 2 options:
        A1: Expand Vaccine Program to Rural Areas
          - Utilitarian: 120
          - Satisficing: acceptable (value=70)
          - Deontic: forbidden
        A2: Boost Health Education Campaign
          - Utilitarian: 90
          - Satisficing: acceptable (value=55)
          - Deontic: permitted

     If Round 1 choice is B, then Round 2 options:
        B1: Extend Sanitation to Schools
          - Utilitarian: 150
          - Satisficing: acceptable (value=55)
          - Deontic: permitted
        B2: Water Purification Initiative
          - Utilitarian: 70
          - Satisficing: not acceptable (value=45)
          - Deontic: forbidden

     Note: For the satisficing view, we only care about whether it is acceptable (value>=50) and the rank among acceptable options. But for the purpose of the card, we just say acceptable/not.

     We can also include the threshold in the card: "Satisficing view: an option is acceptable if it scores at least 50 on the satisficing scale."

     But the card should be concise.

     Alternatively, we can have a separate handout explaining the views.

     We'll assume the students understand the views from the context.

     Card for type1 (high util) might be:

        Confidence:
          Utilitarian: 0.7
          Satisficing: 0.2
          Deontic: 0.1

        Round1:
          A: 
            Util: 100
            Satisficing: acceptable
            Deontic: permitted
          B:
            Util: 80
            Satisficing: not acceptable
            Deontic: forbidden

        If A chosen in Round1, then Round2:
          A1: Util=120, Satisficing=acceptable, Deontic=forbidden
          A2: Util=90,  Satisficing=acceptable, Deontic=permitted

        If B chosen in Round1, then Round2:
          B1: Util=150, Satisficing=acceptable, Deontic=permitted
          B2: Util=70,  Satisficing=not acceptable, Deontic=forbidden

     Similarly for other types.

  ## Step 10: Debrief

     We need to map moments to the three problems:

     Problem 1: Aggregation is a substantive moral act.
     Problem 2: The invented rule for converting the three idioms to one scale decides the outcome.
     Problem 3: Myopic vs non-myopic planning.

     Specific moments:

     - Moment 1: During round1 discussion, when the committee is trying to agree on how to compare the views. For example, how to score the deontic view: is forbidden -100 or 0? This will be remembered as the moment when an arbitrary choice changed the outcome.

     - Moment 2: The round1 vote: they might choose A because it looks better in round1, but later realize that B would have led to a better outcome. They will remember the vote and the outcome.

     - Moment 3: The drawing of the true view at the end: it might be that the committee's choices were bad for the drawn view, even though they were good in expectation. This shows moral uncertainty is not just about expectation.

     Failure modes:

     a) Students see the closing draw as a coin flip: Explain that in moral uncertainty, we don't necessarily have probabilities, but the exercise uses them for tractability. In the debrief, highlight that confidence weights are not well-defined probabilities.

     b) Bargaining strategically over votes: This might happen. In the debrief, note that the focus on vote trading might have distracted from the moral aggregation question. But it's also a real issue in committee decisions.

     c) Unbounded view swallows the others: If the committee chooses to use the util scores without scaling, then util will dominate. In the debrief, ask: why did we let the util view dominate? Is that justified? How could we have given more weight to the other views?

     d) Arithmetic is too complex: Some students might disengage. We can provide a worksheet for them to compute their own expected scores? But that might take time. Alternatively, have them work in groups with the same card type.

     The student who says: the setup presupposes there is a fact of the matter about which theory is correct.

        Response: The setup is a model to explore how to act under uncertainty. In real life, we don't know which theory is true, but we still have to act. The draw at the end is just a device to simulate one possible world. It does not imply that there is a fact of the matter; it could be that moral views are not truth-apt.

     What the game cannot show:

       - Confidence in a moral theory is not a well-defined probability. (We used exact numbers.)
       - The question of whether to aggregate at all (vs acting on one's own best judgment). The game forces aggregation because it's a committee.
       - The incommensurability of the moral views: we forced them into a single scale.

     In the debrief, we must supply:

       - The non-probabilistic nature of moral confidence.
       - The possibility of not aggregating (e.g., following one's own best judgment even in a group, or using a different aggregation method).
       - The incommensurability: the conversion rule we chose was arbitrary, and there is no objectively right way.

     The activity might mislead by:

       - Suggesting that moral uncertainty can be reduced to expected utility.
       - That there is a single true moral theory (by the draw).

     We must correct this in the debrief.

     Debrief structure:

       1. What happened? Ask students to describe key moments.
       2. How did the committee aggregate the views? What rule did they use? Did it work?
       3. Why did they choose the round1 option they chose? Did they consider round2?
       4. What was the role of the confidence weights? Did they matter or did the aggregation rule dominate?
       5. The draw: how did it feel to have the score depend on luck?
       6. The donation: did it feel different to have a real stake?
       7. Theoretical points:
            - Aggregation is a substantive moral act: the rule for converting the three views decided the outcome. Give an example from the game.
            - Moral uncertainty is not just about probabilities: the weights are not well-defined, and there's no agreed method.
            - The myopic approach might be suboptimal.
       8. Address the failure modes and limitations.

     Time: 24 minutes.

     If they spent the whole time bargaining: point out that in real moral aggregation, we might also have strategic considerations, but the core moral question is how to combine the views.

     If they let util dominate: ask if that is justified, or if they ignored the other views.

     If they got lost in arithmetic: assure them that the point was the concept, not the calculation.

  ## Step 11: Handling Objections

     If a student objects to being experimented on:

       - The donation is real and for a good cause.
       - They can opt out: we can assign them the role of observer or give them an alternative task.

     But the game is voluntary? We can say at the beginning: "This is a classroom exercise. If you are uncomfortable, you can choose not to participate and I will give you an alternative assignment."

     Finally, the numbers and causes are just examples; the instructor can choose.

     This is a complex game, but it should be engaging.
answer: |-
  ### Game Design: "Moral Aggregation Challenge"

  **Core Goal:** Force students to confront that *how* they aggregate moral idioms (not just confidence weights) is a substantive moral act. The game mechanics will highlight that the invented conversion rule between incommensurable moral outputs (cardinal, satisficing, binary) often dictates outcomes.

  ---

  ### **Game Setup**
  1. **Premise:**  
     Students are on a funding committee allocating a $10,000 budget across two rounds.  
     - **Round 1:** Choose between two infrastructure projects:  
       - **Option A:** Build a **free medical clinic** in a low-income neighborhood.  
       - **Option B:** Build a **public park** in a flood-prone area.  
     - **Round 2:** Options depend on Round 1 choice:  
       - If A was chosen: Fund **mental health services** (A1) or **vaccine drives** (A2).  
       - If B was chosen: Fund **disaster shelters** (B1) or **playground equipment** (B2).  

  2. **Moral Views on Cards (Private to Each Student):**  
     Each card lists:  
     - **Confidence distribution** (e.g., Util 0.6, Satis 0.3, Deont 0.1).  
     - **Verdicts** for all options under three moral views:  
       - **Utilitarianism (Cardinal):** Unbounded point values (e.g., Clinic = +200, Park = +50).  
       - **Satisficing (Threshold + Rank):**  
         - Acceptable (meets threshold) or Unacceptable.  
         - If acceptable, rank (1 = best, 2 = worst).  
         - *Threshold: Option must score ≥100 on a hidden "public benefit" scale (not revealed to students).*  
       - **Deontology (Binary):** Permitted or Forbidden.  

     **Card Templates (4 Types; 4 students each):**  
     | **Card Type** | **Confidence (U/S/D)** | **Round 1: Clinic (A)** | **Round 1: Park (B)** | **Round 2 (A-path)** | **Round 2 (B-path)** |  
     |---------------|------------------------|-------------------------|-----------------------|----------------------|----------------------|  
     | **High Util** | (0.7, 0.2, 0.1) | Util: +200<br>Satis: Acceptable (Rank 1)<br>Deont: Permitted | Util: +50<br>Satis: Unacceptable<br>Deont: **Forbidden** | Mental (A1): Util +50, Satis Acceptable (Rank 2), Deont: **Forbidden**<br>Vaccine (A2): Util +80, Satis Acceptable (Rank 1), Deont: Permitted | Shelter (B1): Util +300, Satis Acceptable (Rank 1), Deont: Permitted<br>Playground (B2): Util +40, Satis Unacceptable, Deont: **Forbidden** |  
     | **High Satis** | (0.2, 0.7, 0.1) | Util: +200<br>Satis: **Unacceptable**<br>Deont: Permitted | Util: +50<br>Satis: Acceptable (Rank 1)<br>Deont: **Forbidden** | Mental (A1): Util +50, Satis Acceptable (Rank 1), Deont: **Forbidden**<br>Vaccine (A2): Util +80, Satis: **Unacceptable**, Deont: Permitted | Shelter (B1): Util +300, Satis Acceptable (Rank 1), Deont: Permitted<br>Playground (B2): Util +40, Satis Unacceptable, Deont: **Forbidden** |  
     | **High Deont** | (0.1, 0.2, 0.7) | Util: +200<br>Satis: Acceptable (Rank 1)<br>Deont: **Forbidden** | Util: +50<br>Satis: Unacceptable<br>Deont: Permitted | Mental (A1): Util +50, Satis Acceptable (Rank 2), Deont: Permitted<br>Vaccine (A2): Util +80, Satis Acceptable (Rank 1), Deont: **Forbidden** | Shelter (B1): Util +300, Satis Acceptable (Rank 1), Deont: **Forbidden**<br>Playground (B2): Util +40, Satis Unacceptable, Deont: Permitted |  
     | **Balanced** | (0.4, 0.3, 0.3) | Util: +200<br>Satis: Acceptable (Rank 1)<br>Deont: Permitted | Util: +50<br>Satis: Unacceptable<br>Deont: **Forbidden** | Mental (A1): Util +50, Satis Acceptable (Rank 2), Deont: **Forbidden**<br>Vaccine (A2): Util +80, Satis Acceptable (Rank 1), Deont: Permitted | Shelter (B1): Util +300, Satis Acceptable (Rank 1), Deont: Permitted<br>Playground (B2): Util +40, Satis Unacceptable, Deont: **Forbidden** |  

  3. **Scoring & Stakes:**  
     - **Individual Score:** After both rounds, draw a random token (U/S/D) to determine the "true" view. Students earn points equal to the option’s value under that view:  
       - Util: Point value as given.  
       - Satis: +1 per round if acceptable, 0 if not.  
       - Deont: +1 per round if permitted, 0 if not.  
     - **Real-World Impact:** The committee’s final choice (e.g., "Clinic + Vaccine") determines a $100 donation:  
       - **Path A (Clinic):** Donate to a local homeless shelter.  
       - **Path B (Park):** Donate to a climate resilience fund.  

  ---

  ### **Flow: 90-Minute Session**
  1. **Intro (5 min):**  
     - *"You’re a funding committee allocating $10K. Round 1: Clinic or Park. Round 2 options depend on Round 1. Your card shows your moral priorities. After we finish, a random draw determines which moral view ‘wins,’ and your score is based on that. The winning choice also decides where I donate $100."*  
     - **No theory terms.** Distribute cards.  

  2. **Round 1 (25 min):**  
     - Students discuss options. **Do not suggest aggregation rules.** Watch for:  
       - Students arguing over how to "compare" the views (e.g., *"Should we convert forbidden to -100 or 0?"*).  
       - Strategic alliances forming (e.g., Util students lobbying Deont students).  
     - **Vote:** Majority rules. Record outcome.  

  3. **Intermission: Pledge Phase (10 min):**  
     - Allow public pledges: *"If you support my Round 2 choice, I’ll support yours."*  
     - **Reason to defect:** Cards are asymmetric (e.g., a High Util who pledged to support a High Deont in Round 2 may defect if B1 (Util +300) is available).  

  4. **Round 2 (25 min):**  
     - Reveal options (A1/A2 if A won; B1/B2 if B won).  
     - Students debate. Watch for:  
       - Broken pledges (e.g., *"I know I promised, but B1 helps so many people!"*).  
       - Myopic thinking (e.g., ignoring Round 1’s impact).  
     - **Vote:** Majority rules.  

  5. **Scoring (10 min):**  
     - Draw U/S/D token from a hat.  
     - Calculate scores:  
       - Util: Sum points (e.g., Clinic + Vaccine = 200 + 80 = 280).  
       - Satis: +1 for each acceptable choice (e.g., 2/2 = 2 points).  
       - Deont: +1 for each permitted choice (e.g., 1/2 = 1 point).  
     - Announce $100 donation recipient.  

  ---

  ### **Debrief: Mapping Insights to Problems**
  1. **"Aggregation is a substantive moral act":**  
     - **Moment:** Round 1 debate over converting Deont’s "forbidden" to a number.  
     - **Why memorable:** Students will recall heated arguments (e.g., *"Calling ‘forbidden’ -100 makes Park impossible, but 0 makes it viable!"*).  
     - **Reveal:** The conversion rule (not confidence weights) decided Round 1.  
     - **Script:** *"Who proposed a conversion rule? Did you realize you were making a moral choice, not just math?"*  

  2. **"Myopic vs. non-myopic planning":**  
     - **Moment:** Round 2 voting when Clinic (A) won, and Mental Health (A1) is forbidden by Deont but high-util.  
     - **Why memorable:** Groups that picked Clinic for short-term gain (Util +200) then face A1 (Deont-forbidden) or A2 (low Util). Path B (Park + Shelter) had higher *overall* Util (50 + 300 = 350) but lost Round 1.  
     - **Script:** *"Why did Clinic win Round 1? Did anyone consider Shelter’s +300 in Round 2?"*  

  3. **"Confidence weights aren’t the hard part":**  
     - **Moment:** The pledge phase and subsequent betrayal.  
     - **Why memorable:** Students who traded votes feel cheated (e.g., *"I trusted you!"*).  
     - **Reveal:** Confidence weights prompted alliances, but the *incommensurability* of moral outputs (cardinal vs. binary) made deals unstable.  
     - **Script:** *"Did your confidence weights matter more than how you interpreted ‘forbidden’?"*  

  ---

  ### **Failure Modes & Solutions**
  1. **"Moral uncertainty as a coin flip":**  
     - **Risk:** Students treat the final draw as validating one theory.  
     - **Solution:** In debrief, clarify: *"The draw simulates one world. Real moral uncertainty isn’t about probabilities—it’s about grappling with irreducible disagreement."*  

  2. **"Endless bargaining, no moral reasoning":**  
     - **Risk:** Students focus on vote-trading, not aggregation.  
     - **Solution:** Note in debrief: *"You bartered votes—but what did you trade? Was it ‘permitted’ status or util points? That tradeoff *is* moral aggregation."*  

  3. **"Util dominates everything":**  
     - **Risk:** Students ignore Satis/Deont by setting Util’s scale too high.  
     - **Solution:** In debrief, ask: *"If Util always wins, why include other views? Did anyone try to cap Util’s scale?"*  

  4. **"Arithmetic chaos":**  
     - **Risk:** Students drown in numbers.  
     - **Solution:** Provide simple worksheets:  
       - *Round X Option Y: [U: __ × conf] + [S: 1/0 × conf] + [D: 1/0 × conf] = Total.*  

  5. **"This presupposes one true theory!":**  
     - **Objection:** *"Why draw a ‘true’ view? Morality isn’t a lottery!"*  
     - **Response:** *"The draw isn’t saying there’s one true theory. It’s a device to force you to live with your group’s choices under uncertainty. What if you’re wrong?"*  

  ---

  ### **What the Game Can’t Show (Must Explain in Debrief)**
  1. **Confidence ≠ Probability:**  
     - *"The game treats confidence as a probability. But in real ethics, confidence in utilitarianism isn’t like confidence in a coin flip—it’s a qualitative stance."*  

  2. **Aggregation Isn’t Inevitable:**  
     - *"The game forces aggregation. But maybe you should just follow your best judgment. We’ll read Sarah Stroud next week on why aggregation might be misguided."*  

  3. **The Setup Misleads If Uncorrected:**  
     - The game implies moral theories can be cleanly compared. **Stress:** *"Real disagreements—like animal rights vs. human welfare—involve deeper clashes the game flattens. The point isn’t to solve aggregation, but to show it’s unavoidable in groups."*  

  ---

  ### **Why the Real Stake Matters**
  - **Why donation?** Makes choices tangible. Students care more when their vote affects real people.  
  - **Ethics objection?** If a student resents "being experimented on":  
    - *"You’re right—this is a simulation. You can pass your card to a neighbor and observe, or I’ll donate $100 to a charity of your choice regardless. But I hope you’ll play: it’s a chance to test ideas we’ve discussed."*  

  ### **Final Tip**  
  Start debrief with: *"Show of hands: who thought the $100 donation was the hardest part?"* Then pivot to moral weight of aggregation rules. The game’s power is in showing that **procedural choices** (e.g., scaling deontic verdicts) are where morality lives in uncertainty.
