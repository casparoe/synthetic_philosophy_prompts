prompt: |-
  Last night I argued until well past midnight with a friend about Hofstadter and Sander's 2013 book Surfaces and Essences, in which they defend the thesis that analogy-making, rather than rule-application or mere association, is the core of cognition: that to categorize anything is already to liken it to something remembered, and that our concepts are the slowly blurred residue of the particular episodes through which we met them. We kept talking past each other because we were, I think, demanding different things of a theory. So before we resume, I want the standard written down.

  Assume the theory is wanted for a specific purpose: a machine that acquires concepts the way a young child does, from a handful of examples, with no curriculum, no labels and no hand-coded features, and whose failures are recognizably human failures. Write the desiderata such a theory has to satisfy, each with the case or consideration behind it. Among the cases I want covered: being handed one of those two-panel visual puzzles of the kind where you must say what separates the twelve figures on the left from the twelve on the right, where the distinguishing property may be purely relational and is not marked in advance; understanding in a single untroubled pass what someone means when they say that starting a new job feels like being the new kid at school, while later coming to reject an analogy that once seemed perfect, such as comparing an atom to a solar system; explaining one domain to a friend by mapping it onto a second domain that initially shares no vocabulary with it, where the shared structure seems to be created by the comparison rather than discovered by it; and getting from a single exposure to a usable concept and then retracting the overextension on your own, without anyone telling you that you were wrong. I also want the principled constraints: that the combinatorial explosion of candidate mappings be tamed by something other than the answer being presupposed, that the theory say what makes an analogy resistible and what we learn from our resistance to it, and that it predict characteristic errors rather than only successes.

  Mark which requirements are non-negotiable given that purpose and which are really preferences of one camp, such as the demand for a single unified mechanism or the demand that everything be stateable in one representational format. Most importantly, tell me which subset you think cannot be jointly satisfied: the plasticity that lets one example suffice seems to be the same plasticity that produces overextension and confabulated likeness, and a mechanism that can invent the structure it finds is hard to hold to predictions in advance. Finally, in a sentence or two each, say which single requirement does the most work in excluding the families of accounts people actually defend, and why. Skip a full scorecard; that part we can do ourselves.
reasoning: |-
  We are designing desiderata for a theory of cognition that supports the construction of a machine learning system that acquires concepts like a young child. The machine must learn from few examples, without pre-labeled data, hand-coded features, or a fixed curriculum. Its failures should be human-like. The theory must account for several key phenomena and satisfy principled constraints.

  Non-negotiable requirements (stemming from the purpose):
  1. **Learning from few examples (one-shot or few-shot learning)**: The system must form a usable concept from one or a handful of examples, without requiring a large dataset. This is how children learn many concepts. *Case: getting from a single exposure to a usable concept and then retracting overextension without explicit correction.*

  2. **Unsupervised and curriculum-free learning**: The system must learn without pre-defined labels or a structured sequence of examples. Learning is driven by the environment and the system's own interactions. *Case: acquiring concepts from a handful of examples with no curriculum and no labels.*

  3. **No hand-coded features**: The system must construct its own representations from raw input (e.g., pixels for vision, raw audio for speech). This is because children are not born with pre-defined feature detectors for every concept. *Case: being handed a two-panel visual puzzle and figuring out the distinguishing property without any pre-marked features.*

  4. **Human-like failures**: The system's errors should resemble those of humans (e.g., overextensions, confabulations, resistance to certain analogies). *Case: retracting an overextension without being told, and rejecting an analogy that once seemed perfect.*

  5. **Analogy as core mechanism**: The theory must place analogy-making at the center of cognition, such that categorization is fundamentally an analogical process. *Case: understanding a novel analogy (like a new job being like the first day at school) and later rejecting a previously accepted one (like the solar system model of the atom).*

  6. **Handling relational and abstract properties**: The system must detect purely relational patterns (e.g., in the two-panel puzzle) without being told what to look for. *Case: solving a two-panel puzzle where the distinction is relational and not marked in advance.*

  7. **Structure mapping and creation**: The theory must account for both discovering shared structure and creating structure in the process of analogy. *Case: explaining one domain by mapping to another with no shared vocabulary, where the shared structure is created by the comparison.*

  8. **Taming the combinatorial explosion**: The theory must provide a mechanism for constraining the search for candidate analogies without presupposing the answer. This is critical for computational tractability. *Principled constraint: combinatorial explosion must be tamed by something other than the answer being presupposed.*

  9. **Resistance to analogy and learning from resistance**: The theory must explain why some analogies are resisted and what we learn from that resistance. *Principled constraint: the theory must say what makes an analogy resistible and what we learn from resisting it.*

  10. **Predicting characteristic errors**: The theory must predict specific kinds of errors (e.g., overextensions, false analogies) and not just successes. *Principled constraint: predict characteristic errors.*

  Preferences (which might vary by camp, but are not strictly necessary for the purpose):
  - **Single unified mechanism**: A preference for having one process (analogy) explain all cognition, as opposed to multiple mechanisms. Hofstadter and Sander might insist on this, but a hybrid system might be acceptable if analogy is the core.
  - **Uniform representational format**: A preference that all knowledge be represented in the same format (e.g., symbolic, neural). However, a system might use multiple formats if they are integrated.

  Challenges in joint satisfaction:
  The key tension is between **plasticity** (allowing rapid learning from one example) and **stability** (avoiding overextensions and confabulations). The same mechanism that enables one-shot learning must also explain why we sometimes retract a concept or analogy without external correction. Also, the requirement that the mechanism can "invent" structure during analogy (point 7) makes it hard to hold the system to predictions in advance because the mapping can be creative and context-dependent.

  Moreover, the requirement to tame the combinatorial explosion (point 8) without presupposing the answer is a major challenge. Most existing approaches (e.g., structure-mapping engine) use constraints (like systematicity) to limit the search, but these constraints may not be enough to make the search tractable for complex, open-ended domains.

  Which requirement does the most work in excluding existing accounts?
  The requirement that **analogy-making is the core of cognition and that concepts are formed as the residue of episodes** (point 5) excludes rule-based and associationist theories. Rule-based theories (e.g., classical AI) explain categorization by applying predefined rules, which conflicts with the idea that concepts are built from specific episodes. Associationist theories (e.g., connectionism without explicit analogy mechanisms) explain learning as strengthening of connections, but without the structured comparison that analogy requires. This requirement also excludes many current deep learning systems, which rely on statistical patterns from large datasets and do not build concepts from specific episodes.

  Additionally, the requirement for **human-like failures** (point 4) excludes most machine learning systems that make errors in ways that are not human-like (e.g., adversarial examples in deep networks, or systematic errors that humans wouldn't make).

  In summary, the non-negotiable requirements are 1-10. The most challenging to satisfy together are the plasticity of one-shot learning and the stability to avoid and correct overextensions. The core requirement of analogy as the basis of cognition (point 5) is the one that most sharply distinguishes this approach from others.
answer: |-
  Below are the desiderata for a theory of cognition aimed at building a machine that acquires concepts like a young child, grounded in Hofstadter and Sander's analogy-centric view. Requirements are categorized as **non-negotiable** (essential for the stated purpose) or **preference** (reflecting a theoretical camp's bias). Key tensions and exclusions are highlighted.

  ---

  ### **Non-Negotiable Requirements**  
  *Must be satisfied to achieve childlike concept acquisition.*

  1. **One/few-shot concept formation with autonomous correction**  
     *Case*: Learning a usable concept (e.g., "dax") from one exposure, overextending it (e.g., calling all round objects "dax"), and retracting the error without external feedback.  
     *Why non-negotiable*: Children acquire concepts from sparse data and self-correct (e.g., early word overextensions). A theory must explain plasticity (fast learning) and stability (autonomous error recovery) without curated data.  

  2. **Unsupervised relational abstraction**  
     *Case*: Solving two-panel visual puzzles where the distinction is relational (e.g., "objects on the left touch the frame; on the right, they float") without labels or predefined features.  
     *Why non-negotiable*: Human cognition extracts abstract patterns (e.g., symmetry, causality) from raw sensory input. The machine must invent features, not inherit them.  

  3. **Analogical understanding as core categorization**  
     *Case*: Immediately grasping novel analogies (e.g., "a new job is like being the new kid at school") and later rejecting flawed ones (e.g., "atoms are solar systems").  
     *Why non-negotiable*: Hofstadter/Sander argue that all concepts are analogical residues of episodes. The theory must make analogy the primary mechanism for recognition and generalization.  

  4. **Structure-creating analogy**  
     *Case*: Explaining domain A (e.g., electricity) via domain B (e.g., water flow) by inventing shared structure (e.g., "voltage = pressure"), not merely discovering pre-existing matches.  
     *Why non-negotiable*: Human analogies often feel generative, not deductive. The theory must allow mappings to create new relational schema.  

  5. **Combinatorial constraint without presupposition**  
     *Principled constraint*: The search for analogical mappings (e.g., between "job" and "school") must avoid explosion (e.g., brute-force pairing) without relying on pre-specified goals/answers.  
     *Why non-negotiable*: Child cognition is flexible but tractable; presupposition violates the "no curriculum" demand.  

  6. **Resistance and learning from failed analogies**  
     *Principled constraint*: Explain why some analogies feel "forced" (e.g., "life is a spreadsheet") and how resistance teaches us about the domains (e.g., realizing jobs lack school’s social hierarchy).  
     *Why non-negotiable*: Human cognition updates concepts through analogy failures. A theory must predict what makes analogies resistible (e.g., relational misalignment).  

  7. **Predictable human-like errors**  
     *Principled constraint*: Characteristic errors (e.g., overextensions, confabulated likenesses) must arise naturally and match human patterns.  
     *Why non-negotiable*: Childlike failures (e.g., calling a whale "fish") demonstrate the mechanism’s limits; sterile accuracy is inhuman.  

  ---

  ### **Preferences**  
  *Reflect theoretical biases, not strict necessities.*

  8. **Single unified mechanism**  
     *Preference*: Rule-application and association should emerge from analogy, not be separate systems.  
     *Why a preference*: Hofstadter/Sander favor parsimony, but hybrid systems (e.g., analogy + associative memory) could work.  

  9. **Uniform representational format**  
     *Preference*: All knowledge (sensory, abstract) uses the same substrate (e.g., neural activations, symbolic graphs).  
     *Why a preference*: Some connectionists insist on neural uniformity; others allow multi-format representations (e.g., images + language).  

  ---

  ### **Tensions and Trade-offs**  
  - **Core tension**: **Plasticity vs. stability**. One-shot learning (Requirement 1) requires fluid analogies, but this invites overextensions and confabulations (Requirement 7). Resolving this demands a mechanism that is both flexible (to bootstrap concepts from episodes) and self-correcting (to prune bad analogies without external feedback).  
  - **Hardest joint satisfaction**: **Autonomous correction** (Requirement 1) + **Structure-creating analogy** (Requirement 4). The former requires conservative generalization (to avoid errors), while the latter encourages bold relational invention (risking confabulation). A theory allowing both risks unfalsifiability, as "invented structure" can be retrofitted to explain any outcome.  
  - **Key incompatibility**: **Combinatorial constraint** (Requirement 5) and **uniform representation** (Preference 9) clash. Constraining search requires domain-specific heuristics (e.g., cognitive biases), but uniform formats (e.g., neural nets) struggle to embed these without hand-coding.  

  ---

  ### **Most Exclusionary Requirement**  
  **Analogical understanding as core categorization** (Requirement 3) does the most to exclude rival theories:  
  - It rules out **rule-based systems** (e.g., symbolic AI) because they prioritize predefined logic over context-sensitive likeness.  
  - It rejects **associationist models** (e.g., connectionism) that reduce concepts to statistical correlations without structured comparison.  
  - It dismisses **predictive-processing frameworks** that treat analogy as emergent, not fundamental.  

  *Why*: By demanding that *every* act of categorization is analogy-driven (e.g., recognizing a chair by recalling episodic "chair-like" memories), it excludes any architecture where rules or associations are primary. Most machine-learning approaches (e.g., deep neural nets) fail here—they lack machinery for dynamic, relational mapping between episodes.  

  ---

  ### Summary  
  A viable theory must explain how fluid analogies from sparse episodes yield human-like concepts and errors, while taming search and enabling self-correction. The biggest hurdle is balancing *inventive analogy* (to create structure) with *predictive rigor* (to avoid arbitrariness). Non-negotiable requirements collectively exclude most existing AI paradigms, but **core analogical categorization** is the sharpest differentiator. Preferences like unified mechanisms are aspirational but not essential for engineering.
