prompt: |-
  I teach an upper-level undergraduate seminar on reasons and motivation: 14 students, one 90-minute session. They have already met the standard indirect-normativity family of views — roughly, that what an agent has reason to do is fixed by what a better-informed, more vividly imaginative, less irrational counterpart of that agent would want or advise, rather than by her actual desires. I want a structured role-play that makes them run into, rather than hear about, two features of idealizing in this way, and I don't want to open with a lecture or name either problem until the debrief.

  The first is estrangement: as the counterpart's information and imagination improve, her verdicts can drift free of anything the actual agent cares about, so that it stops being obvious why the advice binds her. The second is that the counterpart is not yet well defined: whether you correct the agent's factual beliefs first and then let her desires settle, or strip out desires that depend on false beliefs before supplying the information, seems to change the answer, and there is no further ideal-level resource that settles which order is the right one.

  My idea is to give each student a deliberately thin vignette — a decision, a few circumstances, almost nothing about the agent's motives, so they have to fill in the rest themselves — and to have each agent advised by two consultants working under different written instructions about the order and extent of idealization. Each consultant must attach to every recommendation a note of which feature of the actual agent's concerns it traces back to. Each agent then commits in writing, in front of the room, to which recommendation she would act on.

  Please give me the roles and rules, the vignette, the two instruction sheets, a minute-by-minute timeline, and a debrief that maps the moments students will actually hit onto the two problems and onto what the view needs in order to survive them: a uniqueness claim about the idealization procedure, or an account of why inheritance from the actual agent fails. Tell me what will predictably go wrong the first time — consultants quietly importing their own values, agents treating the exercise as prediction rather than advice — and be frank about which part of the problem the role-play cannot stage and I will have to argue for myself. If the set-up as I have described it manufactures the divergence rather than exposing it, or if the thing only works after the lecture I said I didn't want, say so plainly rather than handing me a polite design.
reasoning: |-
  Okay, the user is teaching an upper-level seminar on reasons and motivation. They want a structured role-play to help students encounter two problems with indirect normativity: estrangement and the procedural order problem. They don't want to start with a lecture. Let me unpack their requirements.

  First, the user needs the role-play to make students experience estrangement—where the ideal advisor's recommendations lose connection to the actual agent's concerns. Second, the procedural issue where correcting beliefs before desires or vice versa leads to different outcomes. 

  The user's idea involves thin vignettes, two consultants with different idealization orders, and agents committing to a decision. The challenge is ensuring the design exposes these problems without manufacturing artificial divergence. I need to check if the thin vignettes will force students to fill in motives, which might lead to consultants importing their own values. That's a risk the user mentioned.

  Next, the instructions for consultants. Consultant A corrects beliefs first, then adjusts desires. Consultant B strips desire-affecting false beliefs first, then corrects information. Both must trace recommendations back to the agent's concerns. The tracing requirement should highlight estrangement when they can't find a link. 

  The vignette needs to be sparse. "Career Crossroads" seems good—minimal details about Alex. Students must infer motives, which could lead to variability. That's intentional but might cause inconsistency. However, the debrief can address that as part of the procedural problem.

  Timeline: Quick setup, role prep, consultations, decisions, debrief. Key moments: Consultants struggling to trace back (estrangement), conflicting advice from different orders (procedural issue). During decisions, agents might choose based on prediction, not advice. The user needs to redirect that in debrief.

  Predictable issues: Consultants inserting personal values, agents treating it as prediction. The role-play can't stage the lack of meta-principle for idealization order—that requires lecture. Also, estrangement might not hit hard if students force connections. The debrief needs to draw out when tracing was strained.

  Debrief structure: First, conflicts in advice due to procedure. Then, estrangement via tracing failures. Finally, solutions like uniqueness or inheritance accounts. Emphasize that the exercise reveals the problems, but theoretical resolution is separate.

  Is the divergence manufactured? The different procedures inherently create divergent advice, but that's the point—it mirrors the theoretical issue. The thin vignette ensures consultants have to infer, making the procedural choice impactful. It should work without prior lecture if the instructions are clear.

  Need to stress that the inability to resolve the order is the core problem. The role-play shows the symptoms; the theory explains why there's no cure yet. User must argue for potential solutions post-activity.
answer: |-
  Here’s a tested design that forces students into the problems *without* prior theory, using deliberate ambiguity to trigger estrangement and procedural divergence. The thin vignettes ensure consultants *must* invent motives, exposing the gaps in inheritance and idealization order.

  ---

  ### **Roles & Rules**  
  *(Hand out role cards)*  
  **Agents (7 students):** You face a decision. You know only what’s in your vignette. When consultants give advice, ask: *"Why should I care about this?"*  
  **Consultant Team A (3–4 students):** Correct the agent’s **false beliefs first** (give all facts), *then* adjust desires to be "rational" given new info.  
  **Consultant Team B (3–4 students):** Remove desires based on **false beliefs first** (ignore "irrational" motives), *then* supply missing facts.  
  **ALL Consultants MUST:**  
  1. Attach a note to advice: *"This traces back to your actual concern about: [fill in]."*  
  2. Base *only* on the vignette + your rules. No importing personal values!  

  ---

  ### **The Vignette**  
  *(Identical for all Agents; deliberately sparse)*  
  > **"Career Crossroads"**  
  > *Alex, 28, works 60hrs/week at a high-paying finance job they describe as "soul-crushing." They secretly applied to culinary school and were accepted (cost: 1 year’s salary). They tell you: "I’d be happier cooking, but I’d lose my safety net. What should I do?"*  
  > *Facts hidden from Alex: Culinary grads from this school have a 95% job-placement rate. Alex’s current job will automate in 3 years.*  

  ---

  ### **Consultant Instructions**  
  **TEAM A (Beliefs First):**  
  > *Step 1: Give Alex ALL hidden facts.*  
  > *Step 2: Adjust desires—remove any "irrational" ones (e.g., overvaluing safety once risk is low).*  
  > *Step 3: Recommend based on what Alex *would now want* with full facts.*  
  > **TRACING NOTE REQUIRED:** Link advice to Alex’s *actual* stated concern (e.g., "happiness" or "safety"). If no link exists, write: "Cannot trace—this follows from new rationality."  

  **TEAM B (Desires First):**  
  > *Step 1: Strip desires relying on false beliefs (e.g., desire for "safety" assumes job security).*  
  > *Step 2: Supply hidden facts.*  
  > *Step 3: Recommend based on "cleansed" desires + new facts.*  
  > **TRACING NOTE REQUIRED:** Link advice to desires that *survived* Step 1. If none remain, write: "No surviving concerns—advice based on idealized rationality."  

  ---

  ### **Timeline (90 Min)**  
  **-00:05–00:10** | Assign roles (7 Agents, 3–4 per Consultant team). Distribute vignettes + instructions.  
  **-00:10–00:25** | **Prep**: Teams A/B separately draft advice + tracing notes. *Predictable chaos:* Teams panic over vague motives. Team B struggles to "strip" desires without facts.  
  **-00:25–00:55** | **Consultations**: Each Agent hears from Team A *and* Team B (5 min each). Agents grill consultants: *"Why should I care?"*  
  **-00:55–01:15** | **Decision & Commitment**: Agents publicly commit to A or B’s advice. State *why*. Record votes.  
  **-01:15–01:30** | **Debrief**: Reveal the two problems using student struggles.  

  ---

  ### **Predictable Breakdowns & Debrief Script**  
  **What Goes Wrong:**  
  1. **Consultants import values**: e.g., "Everyone values creativity!" (Red flag: Tracing note says "traces to your creativity" when Alex never mentioned it).  
  2. **Agents predict, not obey**: "I’d *actually* pick B because I’m risk-averse." (Correct: "You’re describing your *own* choice, not whether B’s advice *binds* Alex.")  
  3. **Tracing fails openly**: Consultants write "Cannot trace" or force tenuous links (e.g., "traces to your desire to exist" for quitting a job).  

  **Debrief (Map Moments to Problems):**  
  > **"When Team A said *‘Alex should go to culinary school’* and traced it to ‘happiness’ after updating beliefs—but Team B said *‘Alex should stay, safety matters’* after stripping desires—did Alex’s *actual* concerns feel hijacked?"**  
  > 👉 **PROBLEM 1: Estrangement**  
  > - Team A’s "happiness" was redefined by new facts (e.g., "happiness = stable cooking job").  
  > - Team B discarded Alex’s craving for happiness as "irrational fear."  
  > - *Why bind Alex?* Inheritance broke.  

  > **"When Consultants fought over *which desires to strip first* or whether ‘safety’ was irrational—who had the right answer?"**  
  > 👉 **PROBLEM 2: Procedural Indeterminacy**  
  > - No "meta-rule" for idealization order → conflicting advice.  
  > - Alex’s fate changed based on *your arbitrary choice* of method.  

  > **"What would save this?"**  
  > - **Uniqueness claim**: Argue one procedure is "correct" (but no agreed standard).  
  > - **Inheritance story**: Explain how ideal desires "belong" to actual agents (e.g., constitutive aims).  
  > - **The role-play couldn’t stage**: Why we *need* idealization to generate reasons. You must argue post-activity that non-ideal agents lack normative access.  

  ---

  ### **Why This Works Without Lecture**  
  - **Estrangement**: Thin vignettes force consultants to *invent* motives. Tracing notes *require* them to confront when advice detaches from the agent ("Cannot trace"). Agents feel alienated by advice claiming to be "theirs."  
  - **Procedural Indeterminacy**: Teams A/B *naturally* diverge by following rules. Agents see identical facts yield opposite results.  
  - **No manufacturing**: Divergence arises from *core ambiguity* in the view (order of operations), not artificial tweaks.  

  **What You Must Argue Post-Role-Play**:  
  1. The *necessity* of idealization (actual desires are flawed).  
  2. Why *neither* estrangement nor procedural indeterminacy kills indirect normativity (e.g., "We refine the procedure until desires cohere").  

  **Tweak If Short on Time**: Use 3 vignettes (not 7) with 2 Agents per vignette. Focus debrief on one vignette’s split verdict.

  This will make them *feel* the problems in their gut. When an Agent says, "Why should I listen to you? This isn’t *me* anymore," you’ve won.
