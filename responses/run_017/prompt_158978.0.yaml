prompt: |-
  I spent rather more than thirty years as a research chemist and have been reading political philosophy since I retired. I now sit on a small citizens' assembly on electoral reform and have been asked to produce a short position paper on who should be required to vote, so I would like the package checked for coherence before I commit it to paper. Roughly where I have landed:

  (1) Voting should be compulsory in law — attendance required, sanctioned by a modest civil fine — but with a formal none-of-the-above option on the ballot, so that nobody is made to endorse a candidate or a policy they do not accept.

  (2) My reason for favouring compulsion is the one that appeals to me professionally: a voluntary electorate is a self-selected sample, and self-selection is biased in a known direction — toward the old, the comfortably-off, the better-educated and the strongly partisan — so the result is a biased estimate of what the population wants. Compulsion turns a convenience sample into something closer to the population itself, much as a mandatory response rate does in a survey.

  (3) Who may vote should be settled by subjection to the state's coercion rather than by nationality, identity or membership: anyone who must obey the law has a claim to a say in the making of it. This is what I take the all-affected principle to amount to when it is made precise.

  (4) It follows, I think, that the voting age should come down to sixteen, and that long-term residents who are not citizens — including those with no legal immigration status — should vote in national as well as local elections, with no language or civics test attached. I would set the residence qualification at five years, on the ground that a franchise needs a determinate boundary.

  (5) It also seems to me to follow that non-resident citizens should lose the vote after, say, fifteen years abroad, and that their children born abroad should not inherit it: nationality by itself carries no permanent claim.

  (6) I do not want to give up the thought that elections are partly instruments for getting decisions right — that outcomes can be better or worse, and that a franchise can be better or worse at tracking which is which.

  (7) Finally, I would allow a standing and permanent declaration of non-participation: anyone may register once as a non-voter and thereafter be exempt from the fine. That strikes me as the decent accommodation of conscientious objection.

  I take it as obvious that (1) is no infringement of political liberty, since only attendance is compelled and no one is forced to express a view. What I want is an audit rather than a tutorial: which of these commitments actually pull against one another, which only look as though they do, and for each real tension what would have to be given up and at what cost. Rank the tensions by severity rather than presenting them as equal, and tell me whether there is a single revision that would clean up more than one of them at once. Please also indicate how confident you are in what you claim, separate the conceptual claims from any empirical ones you lean on, and single out the point you are least sure of.
reasoning: |-
  Okay, let's tackle this user's request. They're a retired research chemist now involved in political philosophy, specifically on electoral reform. They've drafted a position paper and want it checked for coherence. Their background suggests they value precision and systematic analysis, much like in chemistry. 

  First, I need to understand their seven points. Point 1 advocates compulsory voting with a "none-of-the-above" option and a small fine. Point 2 justifies this by comparing it to eliminating sampling bias in surveys. Point 3 bases suffrage on subjection to state coercion, leading to Points 4 and 5: lowering the voting age to 16, including non-citizen residents (even undocumented ones), and disenfranchising non-resident citizens after 15 years. Point 6 wants elections to track correct decisions, and Point 7 allows permanent conscientious objection.

  The user's main concerns are internal coherence and identifying tensions. They also want confidence levels and distinctions between conceptual and empirical claims. 

  Looking at potential tensions, the first that stands out is between Point 3 (all subjected should vote) and Point 5 (disenfranchising non-residents). If someone abroad is still subject to laws (e.g., taxation), removing their vote might contradict the principle. This is a moderate tension since the user sets a 15-year threshold, but it needs addressing.

  Next, Point 4 includes undocumented residents. While consistent with subjection to coercion, it conflicts with Point 6's desire for "correct" decisions. If the electorate includes those unfamiliar with the system, could that affect decision quality? The user might need to clarify how "better outcomes" are defined—procedural vs. substantive.

  Point 6's epistemic claim might clash with compulsory voting. If the goal is better decisions, mandatory inclusion of the disengaged could reduce decision quality. The user argues compulsion reduces bias, but there's an empirical question here: does a larger electorate lead to better outcomes? This is a medium tension requiring empirical evidence.

  Point 7's conscientious objection is a neat solution but might be exploited, leading to free-riding. However, the user might accept this as a necessary cost for accommodating objectors. Low severity.

  The inclusion of 16-year-olds and non-citizens under Point 4 is consistent but raises practical concerns about political knowledge. The user rejects language/civics tests, so they might argue that exposure through voting itself builds civic education. Still, this could conflict with Point 6's epistemic aim.

  Overall, the biggest tension is between subjection principle (Point 3) and non-resident disenfranchisement (Point 5). Clarifying the scope of "subjection" could resolve this. For example, if non-residents aren't fully subjected after 15 years, the tension eases. Alternatively, adjusting the residency period might help.

  The second major tension is between inclusive suffrage (Points 3-4) and epistemic goals (Point 6). The user needs to reconcile how a broad electorate ensures competent decisions. Emphasizing procedural legitimacy over substantive outcomes might help, or citing evidence on voter competence.

  The user's background in science suggests they'll appreciate clear distinctions between conceptual and empirical issues. Highlighting where empirical evidence is needed (e.g., effects of compulsory voting) will be crucial. Confidence levels should be stated honestly, especially where philosophy or data is contested.

  Finally, a single revision: refining the subjection principle to exclude those not enduringly subjected could resolve both non-resident and minor inclusion issues. However, this might complicate the principle. The user must weigh coherence against practicality.
answer: |-
  Your position is remarkably coherent for a complex set of reforms, grounded in a clear principle (subjection to coercion = franchise). However, several tensions exist, ranked by severity below. I'll note confidence levels (High/Medium/Low), separate conceptual/empirical claims, and identify the weakest point.

  **Ranked Tensions & Analysis:**

  1.  **Tension Severity: High**  
      **Core Conflict:** *Point 3 (Subject to Coercion = Vote) vs. Point 5 (Disenfranchising Non-Resident Citizens).*  
      - **Nature:** If the *all-subjected principle* is the *sole* basis for the franchise (as stated in Point 3), then non-resident citizens who remain subject to significant state coercion (e.g., taxation on income/assets, conscription, extradition, certain family laws, lifelong citizenship obligations) retain a strong claim to the vote. Cutting them off after 15 years *solely due to residency duration* appears inconsistent with the core principle. Nationality *is* relevant here *because* it determines ongoing subjection even abroad.
      - **Conceptual Claim (High Confidence):** The principle "subject to law = say in law" logically implies that *anyone* enduringly subject to significant state coercion has a claim. Residency is a strong *proxy* for primary subjection, but not inherently the principle itself.
      - **Empirical Claim (Medium Confidence):** Many non-resident citizens *do* remain subject to significant state power (taxes, laws affecting property/custody, liability for crimes committed before departure/upon return).
      - **Resolution Cost:** To maintain pure consistency with Point 3, you must either:
          *   **Abandon Point 5:** Allow indefinite voting for non-resident citizens (contradicting your desire for a "determinate boundary" and likely creating practical/political issues). *High cost to feasibility/boundary clarity.*
          *   **Modify Point 3:** Weaken the principle to "primary/enduring subjection *within the jurisdiction*" or explicitly tie subjection *to residency*. *High cost to the principle's universality and logical appeal.*
          *   **Modify Point 5:** Base disenfranchisement on *demonstrated severance* of significant subjection (e.g., no taxable income/assets, renounced citizenship for new one, no minor dependents subject to laws) rather than a fixed time. *High cost to administrative simplicity/determinacy.*

  2.  **Tension Severity: Medium-High**  
      **Core Conflict:** *Point 6 (Elections as Epistemic Instruments) vs. Points 1, 2, 4 (Highly Inclusive, Compulsory Electorate).*  
      - **Nature:** Your argument for compulsion (Point 2) is primarily about *representativeness* (reducing bias), not competence. Point 6 introduces an *epistemic* goal ("getting decisions right"). Including voters with potentially low information/minimal engagement (e.g., compelled voters with no strong views, some 16-year-olds, residents with limited language/civic familiarity) *could* be argued to conflict with optimizing epistemic outcomes. Does maximizing *inclusion* necessarily maximize *competence*? This is an empirical question.
      - **Conceptual Claim (Medium Confidence):** There is a potential tension between maximizing procedural legitimacy/representativeness (via inclusion/compulsion) and maximizing epistemic quality. Philosophers (e.g., Estlund) debate whether "inclusion of all" is inherently the best epistemic strategy.
      - **Empirical Claim (Low Confidence - Highly Contested):** Does compulsory voting with a broad franchise lead to *better* or *worse* policy outcomes? Evidence is mixed and incredibly difficult to isolate. Compulsion *might* marginally increase information-seeking, or it might just increase random/"protest" voting. Including younger voters/immigrants may bring diverse perspectives or introduce instability.
      - **Resolution Cost:** To align Points 1/2/4 with Point 6, you must:
          *   **Clarify Point 6:** Explicitly argue that *representativeness itself is the primary epistemic virtue* in democracy, or that diverse input *over time* leads to better outcomes than restricted competence. *Low cost, strengthens internal logic.*
          *   **Abandon Point 6:** Focus solely on legitimacy/representativeness. *High cost to a plausible intuition about democracy.*
          *   **Modify Inclusivity (High Cost to Principle):** Add (mild) competence hurdles (e.g., basic language/civics *after* 5 years), contradicting Point 4. *Strongly not recommended, violates core principle.*

  3.  **Tension Severity: Medium**  
      **Core Conflict:** *Point 3 (Subjection = Franchise) vs. Point 4 (Excluding Very Short-Term Residents).*  
      - **Nature:** Your 5-year residency requirement for non-citizens creates a gap. Someone subjected to state coercion from day 1 (e.g., an immigrant worker paying taxes) is denied a vote for 5 years. How is this consistent with "anyone who must obey the law has a claim to a say in the making of it"? Is subjection only recognized after 5 years?
      - **Conceptual Claim (High Confidence):** A pure subjection principle logically applies from the moment significant subjection begins. A delay *is* a compromise.
      - **Practical Claim (High Confidence):** Some boundary is pragmatically necessary to prevent transient populations (e.g., tourists, short-term students/workers) from voting. 5 years is a common, albeit arbitrary, threshold for establishing "stake".
      - **Resolution Cost:** This is a necessary compromise. You acknowledge it ("franchise needs a determinate boundary"). The tension is inherent in applying a universal principle to a bounded polity. *Low cost to coherence if explicitly framed as a pragmatic implementation limit of the ideal principle.* Emphasize that 5 years is significantly *shorter* than typical naturalization periods, aligning better with the principle than the status quo.

  4.  **Tension Severity: Low**  
      **Core Conflict:** *Point 1 (Compulsion + "None") vs. Point 7 (Conscientious Objection Opt-Out).*  
      - **Nature:** Does allowing a permanent opt-out undermine the representativeness goal (Point 2)? Self-selection bias re-enters through the back door, albeit likely small-scale.
      - **Empirical Claim (Medium Confidence):** The number of permanent conscientious objectors would likely be very small (analogous to jury duty exemptions), minimizing the impact on representativeness. It serves an important liberty/conscience function.
      - **Resolution Cost:** Negligible. The representational loss is likely minimal and outweighed by the ethical imperative Point 7 addresses. It's a reasonable accommodation. *No change needed.*

  **A Single Revision Addressing Multiple Tensions?**
  *   **Refining the "Subjection" Principle:** Explicitly define subjection as "being *enduringly* subject to the *primary jurisdiction and coercive power* of the state for the purpose of shaping its *future*." (Addresses Tensions 1 & 3)
      *   **Tension 1 (Non-Residents):** This clarifies why long-term non-residents *could* lose their claim: their subjection is residual, not primary, and they are less directly affected by the *future* laws being made. The 15-year cutoff becomes a *proxy* for diminished primary subjection. (*Medium Confidence - helps, doesn't fully eliminate tension, but makes 15yrs more defensible*)
      *   **Tension 3 (5-Year Wait):** Justifies the wait as establishing "enduring" subjection and "primary" jurisdiction within the bounded polity. (*High Confidence*)
  *   However, this revision *doesn't* resolve Tension 2 (Epistemic vs. Inclusion). Addressing that requires clarifying Point 6 as suggested above.

  **Point of Least Confidence:**
  *   **Empirical Claim underlying Tension 2 (Point 6 vs. Inclusion/Compulsion):** My claim that the evidence on whether a highly inclusive, compulsory electorate leads to *better* (more competent/"right") policy decisions is **highly contested and difficult to prove** (Low Confidence). It's the weakest link in the empirical chain supporting the *combination* of your points. You are on much firmer ground arguing purely from legitimacy/representativeness (Points 1-5,7).

  **Summary & Recommendation:**
  *   **Strongest Tension:** Non-resident disenfranchisement (Point 5) vs. the core subjection principle (Point 3). Refine the principle definition to emphasize "enduring primary subjection within the jurisdiction for future laws" to mitigate this.
  *   **Key Conceptual Adjustment:** Explicitly frame the residency requirements (Points 4 & 5) as *pragmatic implementations* of the ideal subjection principle, necessary for a bounded polity.
  *   **Clarify Epistemic Goal (Point 6):** Argue that representativeness *is* the primary democratic epistemic virtue, or that the inclusive process *is* the best way to approximate "right" decisions over time. Downplay competence concerns about specific groups.
  *   **Conscientious Objection (Point 7):** Keep it; the representational cost is negligible and the ethical gain is significant.
  *   **Weakest Empirical Point:** The impact of your specific compulsory/inclusive model on *epistemic quality* (Point 6). Ground Point 6 more in legitimacy than contested epistemic outcomes.

  Your framework is intellectually robust and internally consistent *if* the "subjection" principle is clearly defined to accommodate the necessary residency boundaries and non-resident cutoff. The epistemic claim (Point 6) is the most philosophically and empirically vulnerable element when combined with the rest.
