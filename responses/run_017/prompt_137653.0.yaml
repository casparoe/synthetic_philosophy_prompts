answer: |-
  Here are five numbered items addressing your request:

  1.  **LOT Restatement:** The claim is that cognition operates over a typed AST (the "Mentalese" IR), where well-formedness constraints enforce compositionality, and thought generation/inference are meaning-preserving compiler passes (productivity/systematicity via combinatorial operators). Connectionist models are accused of being lossy passes (e.g., vector embeddings) where the original typed AST structure isn't reliably recoverable from the IR (fudging "meaning" as denotational equivalence under an abstract machine).

  2.  **Systematicity as Round-Tripping (Confirm):** Your suspicion is correct. The core dispute reduces to whether the system's internal representation (IR/bytecode) permits reliable reconstruction (decompilation) of the presumed compositional source structure (AST) from the runtime state - it's an empirical question about structural recoverability, not inherently discrete vs. vector.

  3.  **Interpretation Regress (Real Hole):** The compiler frame inherently hits a wall here. The "abstract machine" providing semantics *must* be outside the system (like your decompiler defining semantics for the PDA bytecode). For cognition, this implies an infinite regress (who runs *that* abstract machine?) or an unexplained external semantics-giver - a genuine conceptual gap the frame cannot resolve.

  4.  **Residue - Origin & Grounding:** Compiler passes have a designer specifying the IR semantics and transformation rules. LOT lacks an equivalent for how the initial "Mentalese" semantics arose or how it connects to the world (symbol grounding) - this maps poorly to IRs which derive meaning entirely from external specifications.

  5.  **Residue - Consciousness & Intrinsic Meaning:** The "what it's like" aspect (qualia) and the feeling of *understanding* the IR have no analogue in compiler machinery. ASTs/IRs are purely syntactic; their "meaning" is always imposed externally. This intrinsic "aboutness" (intentionality) of thought is wholly untranslatable residue.
