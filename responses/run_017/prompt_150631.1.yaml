prompt: |-
  I am putting together the final problem set for an advanced seminar I teach on formal models of deliberation, and I want at least one question that forces students to think about what a scheme like this actually buys you, rather than just restating how the machinery works. The setup is HCH: a human answering a question may at any point break that question into sub-questions and consult fresh copies of themselves on those sub-questions, and the human at each node composes the sub-answers it receives into an answer to pass further up the tree. Assume a fixed and fairly generous budget — a fixed total number of node-answers and a fixed number of minutes per node — and take plain HCH under that budget as the baseline. The hope, as I frame it in class, is that the tree lets an ordinary human deliberator approximate the deliberation of a much better one; the worry is that it mainly multiplies ordinary human error in a more elaborate shape, since every node is still just a person answering a question someone else chose for them.

  I have sketched eight amendments to this baseline, and I want students to rank them rather than describe them. (a) Pre-registered decomposition: a node must fix its list of sub-questions and its allocation of budget among them before seeing any sub-answer, and may not revise the list afterward. (b) Mandatory steelman: before passing an answer upward, each node must also produce the strongest short case it can for the answer it is inclined not to give, and pass both. (c) Blind adjudication: every non-leaf question is put to two independent copies; if they disagree, the parent gets both answers and the bare fact of disagreement, with the order randomized and any self-reported confidence withheld, and must adjudicate. (d) Adversarial allocation: a fixed fraction of the budget, say a quarter, goes to nodes instructed to argue against whatever answer the rest of the tree is converging on, with their adversarial role revealed to the aggregator only after the answers are in. (e) Scored confidence: each node attaches a probability to its own answer, and nodes are paid by a proper scoring rule applied against a correctness judgment made later by an adjudicator who sees the whole tree. (f) Compression constraint: a node receives only a fixed-length summary of each child's output rather than the child's full reasoning, so composition is forced to abstract. (g) Shared notebook: a single append-only scratchpad, visible to every node in the order in which nodes are visited, on which any node may record considerations for later nodes. (h) Decomposition review: one of each node's sub-questions is assigned to a copy asked only whether this is the right way to break the problem up, with that answer routed back before the node commits to the rest of its decomposition.

  Sort these eight into tiers — worth adding to almost any version of the scheme, promising but contingent on details, probably not worth the added complexity, likely to make things worse — and give each an expected-improvement score from 0 to 10, where 10 means you would be surprised if it did not substantially improve the quality of the resulting deliberation per unit of added complexity. For each one, say in a sentence which failure mode of HCH it is meant to address and whether it plausibly addresses that one, rather than a different and easier one. Then tell me which single amendment you would keep if you could keep only one, which is most likely to backfire, and whether your answer changes if the humans in the tree are replaced by language models that were trained to imitate human answers.
reasoning: |-
  Okay, the user is an instructor for an advanced seminar on formal models of deliberation. They're creating a problem set and want a question that pushes students to evaluate the real benefits of HCH (Human Cognitive Hierarchy) beyond just understanding how it works. The baseline is HCH with a fixed budget of node-answers and time per node. The goal is to see if HCH approximates a superhuman deliberator or just multiplies human error. 

  They've listed eight amendments and want them ranked into tiers with scores, along with identifying the failure mode each addresses. Then, they need recommendations on which one to keep if only one, which might backfire, and if replacing humans with language models changes anything.

  First, I need to recall what HCH does. HCH breaks down questions into sub-questions, consulting fresh copies of themselves at each node. But since each node is human, errors can propagate. The amendments are strategies to mitigate these issues. 

  Looking at each amendment:

  (a) Pre-registered decomposition: Forces nodes to plan sub-questions before seeing answers. This addresses confirmation bias by preventing nodes from adjusting sub-questions based on early results. The fixed allocation might help in avoiding biased decomposition but could lead to inefficiency if the initial plan is poor.

  (b) Mandatory steelman: Requires nodes to argue against their own answer. This tackles motivated reasoning and overconfidence by forcing consideration of opposing views. However, it might be superficial if done hastily.

  (c) Blind adjudication: Uses two independent copies for non-leaves, revealing disagreement without confidence. Addresses groupthink and false consensus by introducing dissent. The parent then adjudicates, which could improve robustness but adds computational cost.

  (d) Adversarial allocation: Allocates part of the budget to argue against the consensus. Targets groupthink and confirmation bias by institutionalizing dissent. However, it might waste resources if the adversarial nodes aren't effective or if the system isn't converging yet.

  (e) Scored confidence: Nodes attach probabilities, scored later. Aims to improve calibration via incentives. Proper scoring rules should encourage honest reporting. But it requires post-hoc adjudication, which might not be feasible for all questions, and humans are bad at probability estimation.

  (f) Compression constraint: Limits child outputs to fixed-length summaries. Forces abstraction, which might prevent overfitting to details and encourage synthesis. However, critical nuances could be lost, and humans might struggle with compression.

  (g) Shared notebook: Append-only scratchpad for all nodes. Addresses fragmentation and encourages cross-node learning. But could become noisy, and coordination without a clear structure might lead to clutter.

  (h) Decomposition review: A sub-question checks if the decomposition is right before committing. Tackles poor decomposition choices early. However, it adds layers and might not catch all issues if the review is rushed.

  Now, tier ranking:
  - High tier: (c) Blind adjudication and (d) Adversarial allocation directly combat groupthink and false consensus, which are major pitfalls in HCH. They introduce structured dissent.
  - Good but contingent: (b) Mandatory steelman and (h) Decomposition review address motivated reasoning and poor decomposition but depend on execution quality.
  - Low impact: (a) Pre-registered decomposition and (f) Compression constraint might help but have significant trade-offs like rigidity or loss of detail.
  - Likely harmful: (e) Scored confidence (due to human miscalibration) and (g) Shared notebook (risk of noise and confusion).

  For the single keeper, (d) Adversarial allocation is robust against groupthink without overcomplicating the process. The most likely to backfire is (g) Shared notebook due to potential chaos.

  If humans are replaced with language models (LMs), the dynamics change. LMs might handle (e) Scored confidence better since they can be trained on calibration. Also, (g) Shared notebook could be more manageable with LMs processing large text. However, (b) Mandatory steelman might be less effective if LMs already consider multiple viewpoints. The keeper might then shift to (c) Blind adjudication to handle LM biases, or (f) Compression constraint to manage context limits.
answer: |-
  Below is a tiered ranking of the eight amendments to HCH, based on their expected improvement per unit of added complexity (scores 0–10), the failure mode they target, and their plausibility. The scoring emphasizes **robustness against human cognitive limitations** (e.g., confirmation bias, poor decomposition, overconfidence) while weighing implementation complexity. Tiers are:  
  - **Tier 1: Worth adding almost always** (substantial improvement, low risk).  
  - **Tier 2: Promising but contingent** (moderate improvement, depends on tuning/context).  
  - **Tier 3: Low impact** (marginal gains, questionable ROI).  
  - **Tier 4: Likely harmful** (risks outweigh benefits).  

  ### **Rankings & Analysis**  
  | Amendment | Tier | Score | Failure Mode Addressed | Plausibility? |
  |-----------|------|-------|------------------------|---------------|
  | **(c) Blind adjudication** | 1 | 9 | *False consensus/groupthink*: Humans converge prematurely on plausible-but-wrong answers. | **Yes**. Forces explicit dissent resolution, disrupting echo chambers without over-relying on confidence (which humans misreport). |
  | **(d) Adversarial allocation** | 1 | 8 | *Confirmation bias*: Nodes cherry-pick sub-answers that support initial hunches. | **Yes**. Institutionalizes "red teaming" to stress-test conclusions; budget isolation prevents co-option. |
  | **(b) Mandatory steelman** | 2 | 7 | *Motivated reasoning*: Nodes rationalize preferred answers and dismiss alternatives. | **Partially**. Forces counterargument generation, but may be shallow if rushed; no mechanism to *use* the steelman. |
  | **(h) Decomposition review** | 2 | 6 | *Poor decomposition*: Nodes ask irrelevant or biased sub-questions, wasting budget. | **Yes**. Early feedback improves problem-framing, but review quality depends on the node’s meta-cognition. |
  | **(a) Pre-registered decomposition** | 3 | 4 | *Hindsight bias*: Nodes adjust sub-questions to fit emerging answers. | **Weakly**. Pre-commitment reduces bias but sacrifices adaptability; errors in initial plan cascade. |
  | **(f) Compression constraint** | 3 | 4 | *Compositional drift*: Overly detailed sub-answers obscure the big picture. | **Partially**. Forces synthesis, but critical nuances may be lost; humans are poor at abstracting under constraints. |
  | **(e) Scored confidence** | 4 | 2 | *Overconfidence*: Nodes don’t signal uncertainty, leading to brittle conclusions. | **No**. Humans are miscalibrated and gaming-prone; scoring requires costly post-hoc adjudication. |
  | **(g) Shared notebook** | 4 | 1 | *Fragmentation*: Nodes lack context from parallel branches, causing redundant or conflicting work. | **Counterproductive**. Adds noise and coordination overhead; humans struggle to parse unstructured global state. |

  ---

  ### **Key Recommendations**  
  1. **Keep only one amendment**: **(d) Adversarial allocation**. It directly combats the core failure mode of HCH (amplified confirmation bias) by systematically challenging consensus. Unlike blind adjudication (which requires dissent to emerge naturally), it *guarantees* dissent, making it more robust under budget constraints.  

  2. **Most likely to backfire**: **(g) Shared notebook**. It risks chaotic information overload, drowning critical signals in noise. Humans (or LMs) may fixate on early, biased scratchpad entries, amplifying errors system-wide.  

  3. **If humans → language models (LMs)**:  
     - **Changes**: (e) Scored confidence jumps to **Tier 1 (score 8)**. LMs can be fine-tuned for calibration and scored automatically, making incentives effective. (g) Shared notebook rises to **Tier 2 (score 5)**—LMs handle large-context windows better, but prompt engineering is needed to avoid contamination.  
     - **Keeper amendment**: Now **(c) Blind adjudication**. LMs suffer from sycophancy and prompt-direction bias; forcing disagreement and blind resolution counters this.  
     - **New backfire risk**: (b) Mandatory steelman. LMs default to balanced responses, making this redundant; if forced, it may entrench biases in the prompt.  

  ### **Why This Works for Students**  
  This forces evaluation of *trade-offs*: e.g., **(d)**’s strength against groupthink vs. **(g)**’s chaotic complexity. It highlights that amendments must target specific pathologies (e.g., adversarial checks for bias, adjudication for consensus) without assuming universal fixes. Switching to LMs underscores how failure modes shift (e.g., human miscalibration vs. LM sycophancy), ensuring students think beyond mechanics to *what the system optimizes for*.
