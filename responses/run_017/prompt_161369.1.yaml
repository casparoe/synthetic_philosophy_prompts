  You are a professional philosopher with research-level command of two literatures: Wittgenstein scholarship on the remarks published posthumously as On Certainty (including the hinge readings and their critics), and the epistemology of science. Please think carefully and at length. Before you write anything organized, spend some time brainstorming in the open: list the candidate presuppositions of the practice I describe, the ways each could fail, and the rival theories that would license the same practice. Then commit to a reconstruction, and mark clearly where you are confident and where you are guessing. Do not spend your answer summarizing On Certainty; I have read it. I want the practice reconstructed and my hypothesis tested.

  I am a PhD student in science and technology studies, and my dissertation chapter is on the epistemology of peer review. What interests me is a rule that every working scientist seems to know and no journal ever writes down: a distinction between objections that must be answered and objections that do not count as objections at all. If a referee says that the data do not support the conclusion, that there is a missing control, that the confidence intervals were computed wrong, or that a better-powered study found the opposite, the authors must answer, and the paper dies if they cannot. But if a referee says that the measurement procedure presupposes that the instruments track an external world, or that the entire published literature in the field might be the product of a coordinated fraud, or that the laws of nature might have shifted between yesterday's run and today's, then the referee is treated as not having engaged with the paper at all: editors do not forward the report, and the objection is set aside without argument. Three further features of the same practice seem to me to matter. First, a challenge with exactly that global shape — the whole framework is resting on a mistake — is sometimes, decades later, credited as a turning point in the field, so the practice clearly does not simply forbid framework-level criticism forever. Second, authors must cite or evidence every substantive claim, but nobody demands a citation for the claim that the samples were collected on Earth or that the notebook records measurements that were actually taken, and the regress of justification appears to stop somewhere different in molecular biology than it does in paleoclimate reconstruction. Third, my supervisor, who is not a Wittgensteinian, says the whole phenomenon is an artefact of incentives: referees have limited time, editors want publishable decisions, and nobody has ever been rewarded for raising a doubt that no possible experiment could settle.

  My own tentative hypothesis is that this practice is the institutional expression of hinge epistemology, and I want it stress-tested. I sort objections into three kinds: evidence-objections, which cite contrary data or flawed inference; coherence-objections, which say the claims conflict with each other or with well-confirmed theory; and framework-objections, which challenge whether the quantities or concepts the paper deploys are well defined or applicable at all. My proposal is that framework-objections are objections aimed at hinge commitments, and that the practice's dismissal of them encodes Wittgenstein's idea that there are things which stand fast not because they have been justified but because they are what justification and doubt run up against — that at the end of justifications we find not a proposition known with certainty but something more like a hinge on which the inquiry turns. So here is what I need from you. Reconstruct the implicit epistemology of the practice as I have described it, in your own terms. Then tell me what the practice strictly presupposes as opposed to what it merely fits well with: does it require that hinge commitments be unjustifiable, or only that they not currently be in question? Does it require them to be true, or merely accepted? Does it require that they be shared across the community, or could a practice with the same shape survive widespread disagreement about them? Does it require them to be non-propositional, in the sense of being more like rules of the game than like beliefs, or would a reading on which they are genuine beliefs with an unusual kind of warrant license the practice equally well? Next, I suspect I am conflating things and I want to know exactly where: is a hinge the same kind of object as the core assumption of a research program, or a paradigm in the Kuhnian sense, or a hard core in the Lakatosian sense? Because if framework-level criticism sometimes succeeds — as my first feature says it does — I cannot tell whether that shows my hypothesis is wrong, or shows that hinges themselves can shift over time the way a riverbed moves, and I would like you to draw the line for me and say which reading the successful historical cases support. Then please steelman my supervisor's deflationary sociological explanation as charitably as you can, and tell me whether it actually accounts for all four features of the practice or whether it leaves something out that only a hinge-theoretic story explains; if it does leave something out, say precisely what. Finally, tell me what would have to change in editorial practice if the presupposition were replaced: first by the view that every claim is in principle answerable to evidence and no claim is exempt, and second by the view that the fixed points are genuinely known and default-justified in the way Moore thought he knew he had two hands. And flag wherever the practice is philosophically underdetermined, so that several quite different epistemologies — coherentism, reliabilism, entitlement-theoretic views, non-propositional readings — would all tell referees to behave in just this way.
reasoning: |-
  Okay, I need to dig deep into this fascinating query from a PhD student in STS. They're studying peer review epistemology, especially this unwritten rule about which objections count and which get dismissed. Their hypothesis is that this maps onto Wittgenstein's hinge epistemology from *On Certainty*, and they want me to stress-test it thoroughly. 

  First, I notice how carefully structured their query is—they've observed three key features of peer review practice, defined three types of objections (evidence, coherence, framework), and posed precise philosophical questions. This isn't someone looking for summaries; they want rigorous engagement. I should avoid rehashing *On Certainty* basics since they're already familiar.

  Hmm... their core puzzle is whether the dismissal of framework-objections (like challenging instrument reliability or external reality) reflects hinge commitments. But they're also wary of conflating hinges with Kuhnian paradigms or Lakatosian hard cores. And that supervisor's sociological challenge needs addressing—is this just about incentives? 

  Let me brainstorm candidate presuppositions for this practice:  
  - **Presupposition 1**: Justification must end somewhere (anti-infinite-regress).  
    *Failure mode*: If every claim required justification, science would paralyze itself.  
    *Rival theories*: Foundationalism (basic beliefs), coherentism (system-wide stability).  
  - **Presupposition 2**: Some commitments are temporarily immune to challenge.  
    *Failure mode*: If nothing were immune, no stable inquiry could occur.  
    *Rival theories*: Contextualism (doubt relative to context), pragmatism (what works).  
  - **Presupposition 3**: Community agreement on hinges enables communication.  
    *Failure mode*: Without shared hinges, referees/authors couldn't even disagree productively.  
    *Rival theories*: Reliabilism (hinges as reliable processes), entitlement theory (unearned warrant).  

  The student's three features complicate this:  
  1. Framework challenges *sometimes* succeed historically → hinges aren't eternal.  
  2. Justification regress stops differently per field → hinges are local.  
  3. Supervisor says it's just incentives → maybe no epistemology needed.  

  For reconstruction: I'll argue the practice presupposes hinges that are *currently unquestioned*, not necessarily unjustifiable or true. They're communal but can shift (like Wittgenstein's riverbed). The key is their role: not beliefs but rules that *enable* justification. When paleoclimate stops at "this ice core is from Earth" while molecular biology stops at "PCR works," that's hinge variance—not propositional differences but differences in what's treated as *methodological bedrock*.  

  Now, steelmanning the supervisor: Yes, incentives matter—referees aren't paid to question reality. But this doesn't explain *why* global skepticism gets dismissed while methodological skepticism (e.g., "your spectrometer was miscalibrated") doesn't. Nor why framework objections gain traction decades later when incentives haven't changed. Only hinge theory explains the *asymmetry* in what counts as a "real" objection.  

  For the "what if" scenarios:  
  - If editors demanded evidence for *everything*, peer review would collapse into paralysis.  
  - If hinges were Moorean "known truths," successful framework challenges (like paradigm shifts) would look irrational.  

  Finally, underdetermination: Coherentists might say hinges are keystone beliefs; entitlement theorists could call them default reasonable. But Wittgenstein's non-propositional take best explains why you can't "cite" a hinge—it's not a claim but a condition for claiming.  

  Phew. This needs to be tight. The student's onto something real, but I must flag where hinges blur with Kuhnian paradigms (answer: hinges are deeper—they enable paradigms). And I’ll emphasize that the practice *requires* hinges to be non-justified *in situ*, not inherently unjustifiable.
answer: |-
  ### Reconstructing the Epistemology of Peer Review Practice  
  **Core Practice**: Referees distinguish between *evidence/coherence objections* (requiring response) and *framework objections* (dismissed as non-engagements). Framework objections challenge presuppositions like instrument reliability, external reality, or lawlike regularity.  

  #### Candidate Presuppositions, Failure Modes, and Rival Theories  
  | **Presupposition**                     | **Failure Mode**                          | **Rival Theories Licensing Practice**          |  
  |----------------------------------------|------------------------------------------|-----------------------------------------------|  
  | **1. Justificatory terminality**: Justification halts at context-specific "bedrock" commitments. | Infinite regress paralyzes inquiry. | Foundationalism (basic beliefs), Coherentism (system-stability), Contextualism. |  
  | **2. Functional immunity**: Some commitments are temporarily exempt from challenge to enable local inquiry. | Global skepticism destroys practice; no progress possible. | Pragmatism (instrumental utility), Lakatosian "hard core" (protective belt). |  
  | **3. Communal scaffolding**: Shared hinges enable intelligible disagreement. | Disagreement dissolves into incommensurability. | Reliabilism (reliable processes), Entitlement theory (default warrant). |  
  | **4. Non-propositional role**: Hinges operate as enabling *rules*, not justified *beliefs*. | Treating them as claims invites unanswerable skepticism. | Kuhnian "exemplars" (tacit know-how), Brandomian deontic scorekeeping. |  

  ---

  ### Reconstruction: The Hinge-Theoretic Reading  
  **(Confident)** The practice encodes a *hinge epistemology*:  
  - Framework-objections target what functions as **hinges** (e.g., "instruments track reality," "data are not fraudulent").  
  - Hinges are **not justified** *within* the practice but *enable* justification. Like Wittgenstein’s riverbed, they are "fixed" only temporarily, shifting when inquiry demands (e.g., paradigm shifts).  
  - **What practice strictly presupposes**:  
    - Hinges must be *currently unquestioned* (not inherently unjustifiable).  
    - They need not be *true*—only *accepted* as scaffolding (e.g., phlogiston was once a hinge).  
    - They must be *shared* within the epistemic community (a field-specific "form of life").  
    - They operate *non-propositionally*: Their role resembles grammatical rules ("This is how we investigate"), not empirical claims. A propositional reading (e.g., "hinges are warranted beliefs") fails because the practice dismisses challenges *without argument*, treating them as category errors.  

  **(Guessing)** Successful framework challenges (your first feature) confirm hinges *can* shift—but only when new practices crystallize (e.g., relativity challenging Newtonian absolutes). This aligns with Wittgenstein’s riverbed metaphor: Hinges move glacially, not via piecemeal refutation.  

  ---

  ### Distinguishing Hinges from Similar Concepts  
  - **Kuhnian paradigm/core**: Paradigms include hinges but add empirical content (e.g., "DNA is hereditary material" is paradigmatic; "measurements are not systematically faked" is hinge-like).  
  - **Lakatosian hard core**: Hard cores are *defended* programmatically; hinges are *silently exempt* from defense.  
  - **Research program assumptions**: These are justifiable (e.g., "neurons compute"); hinges are pre-justificatory (e.g., "brains exist").  
  **Verdict**: Successful historical challenges support the hinge reading—they occur when accumulated strain forces a riverbed shift, not when a hinge is "falsified."  

  ---

  ### Steelmanning the Sociological Explanation  
  **Supervisor’s view (charitably rendered)**: Peer review is a resource-constrained coordination game. Referees ignore framework objections because:  
  - They lack incentives to pursue irresolvable queries.  
  - Editors prioritize actionable reports.  
  - Science progresses by solving "puzzles" (Kuhn), not meta-questions.  
  **Does it explain all features?**  
  - ✅ **Feature 3 (no citations for bedrock claims)**: Incentives favor efficiency; justifying hinges wastes time.  
  - ❌ **Features 1 & 2**: It cannot explain *why* framework objections *sometimes* succeed (e.g., quantum mechanics challenging classical causality) or *why* justification halts at *field-specific* points (e.g., paleoclimate vs. molecular biology hinges). Incentives alone don’t dictate *where* regress stops—this requires an epistemic story.  
  - ❌ **Asymmetry in objections**: It doesn’t clarify why *local* skepticism (e.g., "your spectrometer was broken") demands response, while *global* skepticism (e.g., "all spectrometers are unreliable") is dismissed. Only hinge theory explains this asymmetry: Local doubts operate *within* the framework; global doubts attack the framework itself.  

  **What hinge theory adds**: The practice’s *normative structure*—framework objections are not "hard" but *nonsensical* in context—requires hinges as constitutive norms.  

  ---

  ### What If Presuppositions Changed?  
  **Scenario 1: No Exemptions (Every Claim Answerable)**  
  - Editorial practice would collapse. Authors must "prove" hinges (e.g., cite sources for "reagents exist"), breeding infinite regress. Referees could demand responses to Cartesian demons—paralyzing peer review. *Result*: No papers publishable; science stalls.  

  **Scenario 2: Moorean Foundationalism (Hinges are Known Truths)**  
  - Framework objections become legitimate. Referees must argue against skeptics (e.g., "Here’s how we know instruments track reality"). Successful challenges (e.g., fraud uncovered) would imply past "knowledge" was false—undermining the epistemology. *Result*: Peer review bogs down in unresolvable meta-debates; hinges lose functional role.  

  ---

  ### Philosophical Underdetermination  
  The practice is **compatible but not identical** with:  
  - **Coherentism**: Focuses on system-stability, but cannot explain *why* some inconsistencies (coherence-objections) require fixes while others (framework-objections) are ignored.  
  - **Reliabilism/Entitlement**: License dismissing framework objections as "unreasonable," but treat hinges as *warranted propositions*—clashing with the practice’s non-argumentative dismissal.  
  - **Contextualism**: Explains shifting justificatory standards, but lacks the *constitutive* role of hinges (e.g., hinges define "context").  

  **Only hinge theory** fully captures:  
  - The **grammatical dismissal** of framework objections (no engagement possible).  
  - **Field-specific terminality** (e.g., biology’s hinges vs. climate science’s).  
  - Why "successful" framework challenges are **retrospective hinge-shifts**, not refutations.  

  ---

  ### Conclusion: Stress-Test Verdict  
  Your hypothesis **holds** under scrutiny:  
  1. Framework-objections map to hinge commitments; their dismissal reflects hinges’ non-propositional, enabling role.  
  2. The practice **requires** hinges to be unjustified *in situ*, communal, and non-propositional.  
  3. Supervisor’s explanation accounts for efficiency but not the *normative architecture* of objections.  
  4. Crucially, the practice is **not** philosophically neutral—it actively rejects propositional treatments of hinges.  

  **Weak spot**: Distinguishing "hinges" from "paradigm cores" remains delicate. Empirical work tracking how framework objections *gain traction* historically (e.g., via rising anomaly-load) could strengthen the hinge reading.
