  The core tradeoff: We cannot simultaneously have:
  (a) Calibration (same score meaning across groups)
  (b) Equal false positive rates (FPR)
  (c) Equal false negative rates (FNR)
  ... if the base rates (true repayment rates) differ between groups.

  Priya's escapes:
  1. Different cutoff per group.
  2. Deferring the middle band to humans (so no machine error for that band).
  3. Better features to increase overlap of score distributions.

  Our procedure will evaluate proposed thresholds (either one global threshold or per-group thresholds) and changes to the deferral band. We'll use a historical dataset (e.g., the last 12 months) to compute base rates and model performance.

