     - In Case 2 (proxy), deciding whether the proxy is reliable enough.

  9. **What the procedure can't tell us**:
     - **Contamination of the outcome label**: If our past lending decisions have created a biased sample (we only see outcomes for those we lent to), then the repayment rates for approved loans are observed, but for declined loans we don't know. We use the entire application set? But we don't have outcomes for the declined. This is a fundamental limitation. We might use techniques like rejection inference, but that is not perfect and requires more time.
     - **Whether to use automated decisions at all**: This procedure assumes we are using an automated system. It doesn't question that.
     - **Long-term effects**: The impact of the loan decisions on the groups' economic opportunities and future base rates.
     - **Human underwriter bias**: In the deferral band, humans might be biased, and we don't model that.

  **Final Note**: The analyst must document all steps and produce the required tables and plots. The entire process should fit in a day.

  We hope this procedure helps in making threshold decisions while being aware of the fairness tradeoffs and practical constraints.
answer: |-
  Below is a practical, step-by-step decision procedure for evaluating loan decision thresholds, incorporating your constraints and addressing Priya's points. It's designed to be run by one analyst in a day using SQL and a notebook. The procedure outputs tables/plots, flags "hard no" conditions, and explicitly marks where human judgment (values, not facts) is required. Priya's three escapes are evaluated within the steps, and a 5% base rate gap is set as the threshold for practical significance (below 5%, use one cutoff; above, escalate). Three cases are analyzed with real numbers.

  ---

  ### **Decision Procedure: Loan Threshold Evaluation**
  **Inputs**: Historical data (last 12 months), proposed thresholds (global or per-group), deferral band boundaries, and model scores.  
  **Unit of Analysis**: Population: All applications from the last 12 months with observed outcomes. Time window: Fixed to 12 months for stability. For missing group labels (e.g., EU), use an 80%-accurate proxy and note uncertainty.

  #### **Step 1: Compute Base Rates and Group Overlap**  
  **Goal**: Check if base rate gaps exceed 5% (practical significance threshold).  
  **What the analyst does**:  
  - Query: Repayment rate per group (or proxy group) over last 12 months.  
  - Output: Table of base rates, group sizes, and absolute base rate differences.  
  - **Sufficient answer**: Base rate gap ≤5% → Proceed to Step 2A (use one threshold). Gap >5% → Proceed to Step 2B (evaluate fairness tradeoffs).  
  **Human judgment?** No (pure fact).  

  **Case 1 (US Book)**:  
  | Group | Applications | Repayment Rate | Base Rate Gap |  
  |-------|-------------|---------------|--------------|  
  | A     | 20,000      | 70%           | 15%          |  
  | B     | 20,000      | 55%           | (70-55=15%) |  
  **Result**: 15% > 5% → **Proceed to Step 2B**.  

  **Case 2 (New Market, Proxy Groups)**:  
  | Proxy Group | Applications | Repayment Rate (Proxy) | Base Rate Gap |  
  |-------------|-------------|------------------------|--------------|  
  | X           | 15,000      | 58%                    | 8%           |  
  | Y           | 15,000      | 50%                    | (58-50=8%)   |  
  **Note**: Proxy is 80% accurate; true gap may differ. 8% > 5% → **Proceed to Step 2B**.  

  **Case 3 (Vendor Model, Uncalibrated Score)**:  
  | Group | Applications | Repayment Rate | Base Rate Gap |  
  |-------|-------------|---------------|--------------|  
  | A     | 10,000      | 68%           | 10%          |  
  | B     | 10,000      | 58%           | (68-58=10%)  |  
  **Result**: 10% > 5% → **Proceed to Step 2B**.  

  ---

  #### **Step 2A: Single Threshold Evaluation (Base Rate Gap ≤5%)**  
  **Goal**: Validate one global threshold. Skip if gap >5%.  
  **What the analyst does**:  
  - Plot: Score distribution histogram for all groups (show overlap).  
  - Table: Overall repayment rate in auto-approve/auto-decline bands, FPR/FNR.  
  - **Sufficient answer**: If auto-approve repayment rate ≥85% and auto-decline repayment rate ≤40% → Approve threshold. Else → Adjust deferral band (Step 4).  
  **Human judgment?** No.  

  ---

  #### **Step 2B: Fairness Tradeoff Evaluation (Base Rate Gap >5%)**  
  **Goal**: Quantify disparities and test Priya's escapes.  
  **What the analyst does**:  
  1. **Plot**: Score distribution histograms per group (visualize overlap).  
  2. **Table**: For current/proposed thresholds:  
     - Auto-approve rate, auto-decline rate, deferral rate (per group).  
     - Repayment rate in auto-approve/auto-decline bands (per group).  
     - FPR (non-repayers approved) in auto-approve band; FNR (repayers declined) in auto-decline band.  
  3. **Test Priya's escapes**:  
     - **Escape 1 (Different cutoffs per group)**: Compute metrics if group-specific thresholds are proposed.  
     - **Escape 2 (Deferral band)**: Exclude deferred cases; only analyze auto bands.  
     - **Escape 3 (Better features)**: Not applicable here (requires model retraining).  
  **Output**: Tables/plots above.  
  **Human judgment?** No (metrics only).  

  **Case 1 (US Book) - Priya's Escapes Tested**:  
  - **Current thresholds**: Auto-approve ≥0.8, auto-decline <0.5, deferral 0.5–0.8.  
  - **Distributions**: Good separation (A: mean=0.67, B: mean=0.53).  
  - **Metrics**:  
    | Group | Auto-Approve Rate | Auto-Approve Repay | Auto-Decline Rate | Auto-Decline Repay | Deferral Rate |  
    |-------|-------------------|--------------------|-------------------|--------------------|--------------|  
    | A     | 50%               | 95%                | 20%               | 30%                | 30%          |  
    | B     | 20%               | 90%                | 40%               | 40%                | 40%          |  
    - **FPR (auto-approve)**: A: 5% (5% of 30% non-repayers), B: 10% (10% of 45% non-repayers).  
    - **FNR (auto-decline)**: A: 30% (30% of 70% repayers), B: 40% (40% of 55% repayers).  
  - **Escape 1 (Different cutoffs)**: Proposed: B auto-approve at ≥0.75.  
    - Result: B auto-approve rate=30%, repayment=88% (still ≥85%? **Human judgment**).  
  - **Escape 2 (Deferral)**: Disparities persist in auto bands (A: 50% approve vs B: 20%).  
  **Verdict**:  
  - Escape 1 (different cutoffs) **moves the conflict**: Reduces approve-rate disparity (50% vs 30%) but B’s decline repayment=40% (borderline).  
  - Escape 2 (deferral) **hides but doesn't resolve**: Middle band disparities shift to deferral rate (A:30% vs B:40%).  
  - Escape 3 (better features) **not tested** (no new model).  

  **Case 2 (New Market, Proxy) - Priya's Escapes Tested**:  
  - **Proxy accuracy**: 80%; true base rates unknown.  
  - **Metrics (proxy groups)**:  
    | Proxy Group | Auto-Approve Rate | Auto-Approve Repay | Auto-Decline Rate | Auto-Decline Repay |  
    |-------------|-------------------|--------------------|-------------------|--------------------|  
    | X           | 40%               | 92%                | 30%               | 35%                |  
    | Y           | 20%               | 88%                | 40%               | 40%                |  
  - **Escape 1 (Different cutoffs)**: Set Y auto-approve at ≥0.75 → Approve rate=30%, repayment=85%.  
  - **Escape 2 (Deferral)**: Y deferral rate=40% (higher than X’s 30%).  
  **Verdict**:  
  - Escape 1 **moves the conflict**: Approve-rate gap drops (40% vs 30%), but decline repayment=40% (risky).  
  - Proxy inaccuracy **amplifies errors** (e.g., 20% of Y are misclassified).  

  **Case 3 (Vendor Model, Uncalibrated) - Priya's Escapes Tested**:  
  - **Problem**: Scores are rank-ordered (no probabilities). **Hard no?** → Proceed only if scores can be calibrated.  
  - **Analyst action**: Use Platt scaling to calibrate scores. If calibration fails (AUC<0.7 or calibration error>5%), **HARD NO** (stop).  
    - Result: Calibration succeeds (AUC=0.75, error=4%). Now use calibrated scores.  
  - **Metrics (similar to Case 1)**:  
    | Group | Auto-Approve Rate | Auto-Approve Repay |  
    |-------|-------------------|--------------------|  
    | A     | 48%               | 92%                |  
    | B     | 22%               | 87%                |  
  **Verdict**: Escape 1 possible but B’s auto-approve repayment=87% (near-minimal 85%).  

  ---

  #### **Step 3: Deferral Band Impact**  
  **Goal**: Ensure deferral band isn't a "dumping ground" for disparities.  
  **What the analyst does**:  
  - Table: Deferral rate per group and overall.  
  - Query: Repayment rate in deferral band (if human decisions available).  
  - **Sufficient answer**: If deferral rate >50% for any group → **Hard no** (operationally unsustainable). Else → Proceed.  
  **Human judgment?** No.  

  **Case 1 (US Book)**:  
  - Deferral rates: A=30%, B=40% → **Acceptable** (<50%).  
  - Human repayment rate in deferral: 75% (A), 65% (B) → **Disparity persists**.  

  **Case 2 (New Market)**:  
  - Deferral rate: Y=40% → **Acceptable**.  

  ---

  #### **Step 4: Decision and Compliance Flags**  
  **Goal**: Final approve/reject of proposed thresholds.  
  **What the analyst does**:  
  1. **Hard no conditions**:  
     - Base rate gap >5% AND no group thresholds proposed.  
     - Auto-approve repayment <85% for any group.  
     - Auto-decline repayment >40% for any group.  
     - Deferral rate >50% for any group.  
     - Vendor model uncalibrated (Case 3).  
  2. **Human judgment flags (values, not facts)**:  
     - **"Set repayment rate thresholds"**: What is acceptable risk? (e.g., 85% approve/40% decline).  
     - **"Use group-specific thresholds?"**: Legal risk of disparate treatment.  
     - **"Accept auto-band disparities?"**: Tradeoffs between FPR/FNR parity.  
  3. **Output**: One-page report with:  
     - Metrics from Steps 1–3.  
     - "Approve," "Reject," or "Escalate to compliance" recommendation.  

  **Case 1 Output**:  
  - **Recommendation**: Approve group-specific thresholds (A: ≥0.8 approve, B: ≥0.75 approve) with caveats.  
  - **Cost**: B’s auto-decline repayment=40% (at threshold) → **Escalate to compliance** (human judgment: Is 40% decline repayment acceptable?).  

  **Case 2 Output**:  
  - **Recommendation**: Reject proxy-based thresholds → Use one threshold (disparities inevitable).  
  - **Why**: Proxy noise risks miscalibration and legal challenges.  

  **Case 3 Output**:  
  - **Recommendation**: Approve vendor model after calibration.  
  - **Cost**: B’s auto-approve repayment=87% (barely meets 85%) → **Escalate** (human judgment: Accept marginal risk?).  

  ---

  ### **What the Procedure Can't Tell You**  
  1. **Outcome label contamination**: If past biased lending affects repayment data (e.g., only "safe" borrowers approved). **Mitigation**: Use rejection inference (not feasible in 1 day).  
  2. **Automation ethics**: Whether auto-decisions should be used at all (e.g., human-only for high-stakes cases).  
  3. **Long-term drift**: Base rates/thresholds need revalidation every 6–12 months (not in scope).  
  4. **Causal fairness**: Priya’s causal inference expertise is ignored; this only measures statistical fairness.  

  ### **Key Takeaways**  
  - **Priya's escapes**:  
    - (1) Different cutoffs: Moves conflict (e.g., B’s decline repayment=40%) but doesn’t resolve it. Cost: Compliance scrutiny.  
    - (2) Deferral band: Hides disparities in middle band but amplifies deferral-rate gaps. Cost: Operational burden.  
    - (3) Better features: Only helps if distributions overlap more (e.g., reduce base rate gap). Not a given.  
  - **Base rate gap >5%** is where tradeoffs bite (using 12-month data).  
  - **Analyst workload**: All steps achievable in 1 day with SQL + Python (plots/tables).  
  - **You lose a model**: Case 2 (proxy groups) → Reject thresholds due to proxy noise.  

  ---  
  **Final Output**: Analyst delivers a one-page report per case with tables/plots and clear "Approve/Reject/Escalate" calls. Compliance handles human-judgment flags.
