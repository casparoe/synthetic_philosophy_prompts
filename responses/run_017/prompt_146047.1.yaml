  - We must set a threshold of practical significance for when base rate gaps matter.

  Procedure Steps:

  1. **Define the population and time window**: Use the most recent 12 months of data for which we have outcomes. This is the reference period.

  2. **Check data quality and group definitions**:
     - If we are using group-specific thresholds, we must have group labels (or a proxy). In the EU, we use the proxy and note its accuracy.
     - Check that the outcome (repayment) is available and reliable. If we suspect contamination (e.g., due to past lending decisions), we note it but proceed (this is a limitation).

  3. **Compute base rates by group**:
     - For each group, compute the overall repayment rate (base rate) in the reference population.
     - If the group label is a proxy (like in the EU), we compute base rates using the proxy and note that they are approximate.

  4. **Check the calibration of the score** (if possible):
     - Only if the model outputs calibrated probabilities (i.e., a score that is meant to be the probability of repayment). If not (like in the vendor model case), skip.
     - For each group, check calibration: bin the scores and compute the actual repayment rate in each bin. If the score is calibrated, the repayment rate in a bin around score s should be close to s.
     - If the model is not calibrated, we must recalibrate it (if we have the outcome) or note that we cannot check (a) and proceed with caution.

  5. **Compute performance without deferral** (for understanding):
     - For the entire population (without considering the deferral band), pick a tentative threshold (or per-group thresholds) and compute:
          - Overall approval rate
          - False positive rate (FPR): proportion of non-repayers approved
          - False negative rate (FNR): proportion of repayers declined
          - Also, true positive rate (TPR) and true negative rate (TNR)
     - This step is to see the "raw" tradeoffs.

  6. **Incorporate the deferral band**:
     - We have two thresholds: a lower threshold (below which auto-decline) and an upper threshold (above which auto-approve). The middle is deferred.
     - We compute:
          - Auto-approve rate (by group)
          - Auto-decline rate (by group)
          - Deferral rate (by group)
          - For the auto-approve band: the actual repayment rate (should be high) and the false positive rate (non-repayers approved) in that band.
          - For the auto-decline band: the actual non-repayment rate and the false negative rate (repayers declined) in that band.
     - Note: The deferred cases are handled by humans, so we don't assign machine errors for them. However, we are still responsible for the overall outcome of the deferred cases? We can track the human decision and outcome, but that's separate.

  7. **Evaluate Priya's escapes in the context**:
     - Escape 1 (different cutoff per group): We can set group-specific thresholds. But we must check that the resulting auto-approve and auto-decline rates are acceptable and that the deferral rates are manageable. Also, we must consider whether this is legally allowed (compliance).
     - Escape 2 (deferral): By deferring, we avoid making a machine decision on the middle band. However, we must still ensure that the deferral rates are not too high (operationally) and that the deferral does not disproportionately affect one group. Also, the human decisions in the deferred band may introduce their own biases.
     - Escape 3 (better features): We can't evaluate this in the current model, but we can compare the current model with a new model that has better features. We look for reduced disparity in the score distributions (e.g., less separation between groups) and then re-run the procedure.

  8. **Threshold of practical significance for base rate gap**:
     - We set a rule: if the absolute difference in base rates between groups is less than 5 percentage points, then we can use one global threshold without worrying about the fairness tradeoff (because the tradeoff is negligible). Above 5%, we must consider group-specific thresholds or accept disparities.

