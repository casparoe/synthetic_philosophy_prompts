prompt: |-
  hi — I'm putting together a discussion session on semantic externalism for a small reading group (mixed level: a couple of people have read Putnam, most havent). I need a case, built to order rather than one of the greatest hits.

  What I want: a scenario where externalism — the "meanings ain't in the head" package — is forced to say that a word in some competent speaker's mouth changes what it refers to over time, while nothing at all changes inside her head. She isn't corrected, she doesnt learn anything new, her dispositions with the word stay put, and there's no point at which she'd say "oh, I must have been using it differently before." As far as she's concerned she means exactly what she's always meant.

  Constraints, because the obvious versions won't do the job:

  - No other planets, no duplicate earths, no imaginary chemistry, no envatted brains or deceivers. The two candidate referents have to be real-world things a real chemist / geologist / botanist could tell apart and a normal person using the word couldnt — think look-alike species, two minerals sold under the same name, a supply chain quietly swapping one thing for another.
  - She must not be ignorant or confused in the way Burge's arthritis patient is. She's a perfectly competent user of the word by her communitys standards; I don't want the work done by her having a partial grasp that the experts quietly complete.
  - The shift must not be an official or community reclassification — no committee redefining a term, nobody announces anything. If the only reason the reference moved is that somebody with authority decided to use the word differently, the case fails, since then it's stipulation and not externalism doing the work.
  - It shouldn't collapse into plain homonymy either: everyone involved, including her, is treating this as one word for one kind of stuff throughout.

  One more thing, which is the actual reason I'm asking. Externalists usually have two mechanisms pointing at the same thing, so you cant tell which one is load bearing: the causal-historical story (your use is hooked up to the samples you're actually in contact with, and the hidden nature of that stuff fixes the reference) and the deference story (you defer to the experts or to whoever taught you, so the reference is whatever their practice picks out). I want a case where those come apart — where, for this speaker at this time, they'd pick out different stuff — and I want you to say which one externalism should let win and why.

  Deliverable: the scenario in a single paragraph, ordinary setting, no stage machinery. Then show the check: what the word refers to before and after, the content of one specific belief of hers before and after, what she'd sincerely say about her own meaning, and where each of the two mechanisms lands. Then: which single feature of the case is doing the work; what happens to the verdict if you remove it (specifically, what if the change were announced to her instead of happening quietly); and what someone who thinks meanings are in the head would say about the whole setup.
reasoning: |-
  Okay, the user is setting up a discussion on semantic externalism and needs a custom case study. They want a scenario where the reference of a word changes for a competent speaker without any internal change—no new information, no correction, stable dispositions. The speaker remains confident about their meaning throughout. 

  The constraints are very specific: no sci-fi elements like Twin Earth or brain vats, only real-world examples like look-alike species or mineral swaps. The speaker must be fully competent (unlike Burge's arthritis patient), and the shift can't come from official redefinition or homonymy. Crucially, the case must pit causal-historical chains against deference to experts, forcing a choice between them.

  Hmm... the user's deeper need seems to be exposing a tension in externalism's machinery. They want to test which mechanism (causal history or deference) dominates when they conflict, and how externalism handles "stealth" reference shifts. This suggests they're preparing for nuanced debate—probably challenging naive externalist views.

  Brainstorming scenarios... Mineral swaps work well. Consider "potash": historically potassium carbonate from wood ash, now industrially produced potassium chloride. Both are called "potash" in commerce, chemically distinct but indistinguishable to lay users. A gardener using it for decades could seamlessly transition from one to the other without realizing. 

  Key elements: 
  - Speaker: A competent gardener who's used potash for 30 years.
  - Shift: Suppliers quietly replace carbonate with chloride due to market changes.
  - Competence: She knows its effects (fertilizer, soluble) but can't chemically distinguish them.
  - No internal change: Her usage patterns and beliefs stay identical.
  - Mechanisms clash: 
    - Causal-history traces to original carbonate sources. 
    - Deference points to current expert/church use of chloride. 

  Why this works:
  - Forces externalism to choose: Does reference snap to the new substance (deference) or stick to the old (causal history)?
  - Highlights if externalism prioritizes community practice over historical accident.
  - Internalist counterargument would claim her stable concept defines meaning, denying reference shift.

  Should emphasize the "stealth" aspect—if announced, it becomes stipulation, breaking the case. The silent swap makes externalism's reference change involuntary, proving meanings aren't in the head.
answer: |-
  Here's a custom-built case meeting all your constraints, designed to force the deference vs. causal-history conflict:

  **Scenario:** For generations, villagers in "Hillside" harvested a specific flaky, blue-gray mineral from their local quarry, calling it "slate." They used it for roofing tiles, knowing it was durable, water-resistant, and split cleanly into thin sheets. Unbeknownst to everyone, the quarry contained *two* distinct metamorphic rocks meeting these criteria: true **slate** (derived from shale) and **phyllite** (a finer-grained, slightly glossier precursor to schist). Geologically distinct, they are visually and functionally identical to laypeople and artisans. Decades ago, the true slate vein ran out. Quarry operators, finding identical-looking phyllite deeper down, seamlessly continued extraction and sale as "slate." No announcement was made; craftspeople noticed no difference. Elara, a lifelong, highly competent Hillside roofer, has used "slate" for 40 years. Her knowledge (durability, water-resistance, splitting technique) perfectly applies to both minerals. Her dispositions (pointing to a tile and calling it "slate," describing its properties) remain constant. She firmly believes she means the same thing today as 40 years ago.

  **The Check:**

  1.  **Reference Before Shift (40 years ago):** True slate (shale-derived metamorphic rock).
  2.  **Reference After Shift (Now):** Phyllite (schist-precursor metamorphic rock).
  3.  **Content of Specific Belief:**
      *   *Before:* Elara's belief "Slate comes only from our Hillside quarry" was true (referring to true slate).
      *   *After:* Elara's belief "Slate comes only from our Hillside quarry" is now false (referring to phyllite, which exists elsewhere too, but she doesn't know that).
  4.  **Her View:** She'd sincerely say: "I mean exactly what I always meant: the tough, blue-gray stone we split for roofs, from our quarry."
  5.  **Mechanisms Applied:**
      *   **Causal-Historical Chain:** Traces back to the *original samples* Elara encountered and was taught with – true slate. Thus, "slate" for Elara *always refers to true slate*, regardless of what the community currently extracts/sells.
      *   **Deference:** Points to the *current expert/community practice*. Geologists and quarry operators *now* apply "slate" to the phyllite they extract (while knowing the geological distinction). Thus, "slate" for Elara *now refers to phyllite* because that's what the community experts currently designate by the term in the relevant context (local building supply).

  **Which Mechanism Wins (Externalist Verdict) & Why:**

  *   **Deference should win.** The core argument hinges on **the communal nature of reference-fixing and sustenance**. Elara intends to use the word as her community does, for the *kind* of stuff locally sourced and used for roofing. The community's ongoing practice, guided (even if silently) by those identifying the *current* source material (quarry operators, implicitly deferring to geology), determines the current extension. The causal-historical chain initiated the use, but the *continuation* of the practice, especially when the underlying stuff changes unbeknownst to the speaker, is governed by the current community norms and expert application of the term. Her competence is defined by participating in *this* ongoing practice, not by an unchangeable historical baptism she's unaware of.

  **The Single Feature Doing the Work:**

  *   **The silent, expert-mediated supply-chain shift of the underlying substance, masked by functional equivalence.** The physical stuff designated by the communal practice changes, but the observable properties and practical use remain identical, preventing any internal or overt linguistic marker of change.

  **Effect of Removing It (If Change Announced):**

  *   If the quarry announced, "We've run out of true slate; we're now mining identical phyllite, but we'll *keep calling it 'slate'*," the case collapses. This becomes **stipulation/redefinition by authority**. Elara, upon hearing this, would now either:
      *   Accept the stipulation, consciously extending "slate" to cover phyllite (deference becomes conscious and explicit).
      *   Reject it, insisting "slate" *only* means the original stuff, and the new stuff is "fake slate" or needs a new name (her usage splits, potentially homonymy).
      *   In either announced scenario, internal changes (new beliefs/decisions) occur, violating the "nothing changes inside her head" constraint. The *stealth* is essential to isolate externalism.

  **Internalist Response:**

  *   An internalist (meaning in the head) would argue: Elara's concept of "slate" is defined entirely by her internal state – her stored description ("the durable, splittable, blue-gray rock from the Hillside quarry used for roofing") or her recognitional capacity (keyed to appearance/function). Since this internal state is unchanged, the *meaning* of her word "slate" is unchanged. Before and after, it refers to whatever satisfies that internal description/capacity.
      *   Before: The stuff satisfying it was true slate.
      *   After: The stuff satisfying it is *now* phyllite (it fits the description just as well).
      *   Crucially, **the reference doesn't *change*; the world changes, and different things *now* satisfy the same, fixed meaning/concept.** Her belief "Slate comes only from our Hillside quarry" was always contingently true or false based on the world; the *content* (what the belief is *about*) remains fixed by her internal state. The externalist shift in reference is an illusion created by ignoring the speaker's fixed internal criterion. The internalist denies there is a "before and after" meaning; there's only one meaning, and the extension in the world it picks out can shift if the world changes without the speaker knowing.
