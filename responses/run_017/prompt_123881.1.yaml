prompt: |-
  My girlfriend and I keep having the same argument and I want a word for one specific bit of it, because I think if I had the word the argument would basically end.

  Here's the shape of it. On Sunday I decide, quite firmly, that I'm going to start running on Monday morning. Monday comes and I don't run — and I decide I'm going to start on Tuesday. Tuesday, Wednesday. The thing I keep noticing is that at no point does it feel like I've changed my mind. Sunday me and Monday me both say, sincerely, that they're starting tomorrow, and both would insist they still want the same thing and still think it's worth doing. I'm not choosing the sofa over the run, I'm not revising my judgement that running is good, and there isn't even some other thing I'm doing instead — I just keep re-dating the same plan, and the reason I give each time is the same vague one (once I've got a proper block of time, once this week is out of the way), a reason I would totally have accepted on the Sunday as well.

  It happens at work too, which is what makes me think it's not about laziness or about my body: our team keeps moving the same decision to next sprint, everyone is still in favour of making the decision, nobody thinks the decision has become less urgent, and yet it slides, and each slide comes with its own reasonable-sounding excuse that would have sounded just as reasonable two sprints ago.

  A friend who did a philosophy minor muttered something about akrasia and about hyperbolic discounting, but neither seems to fit what I'm after. Akrasia sounds like acting against your own better judgement, which isn't quite it — I'm not doing the opposite of what I judge best, I'm just not doing it yet. And hyperbolic discounting sounds like my preferences change as the thing gets closer, whereas the weird thing here is that my preference for running over not running feels completely stable; the plan keeps its shape while its start date keeps receding. Also, I know this is going to happen — I've watched me do it dozens of times — and I've actually paid for a year of classes up front to stop myself, which does work. So part of me thinks whatever this is must come apart into two things: the sliding, and the fact that I can predict the sliding perfectly and it doesn't stop the sliding.

  So: does this pattern have a name of its own, or is it just ordinary procrastination with a story attached? If there are established concepts nearby, I want to know which one fits best and exactly how my case differs from each of the others — especially from the ones my friend named, and from the ordinary-language one — and whether the predicting-and-precommitting part is a separate phenomenon or the same one. And if there genuinely isn't a term, coin one: give me a definition sharp enough that I could tell, for some borderline case, whether it applied or not. A bare label won't settle the argument, so I need the carving, not the name.
reasoning: |-
  Okay, the user is describing a recurring pattern where they keep postponing a plan without feeling like they've changed their mind. They want a precise term or concept to label this behavior to help resolve arguments with their girlfriend. 

  First, I need to understand the core issue. The user repeatedly sets a start date for an action (like running) but delays it each day, maintaining the same intention and belief that the action is worthwhile. There's no conscious decision against the action, just a perpetual postponement. The same happens at work with team decisions.

  The user mentioned akrasia and hyperbolic discounting as terms their friend suggested but feels they don't fit. Akrasia involves acting against better judgment, but here there's no action—just delay. Hyperbolic discounting involves changing preferences over time, but the user's preference for the action remains stable. 

  The key elements are:
  1. Consistent intention without revocation
  2. Perpetual rescheduling with plausible excuses
  3. Awareness and predictability of the pattern
  4. Ability to counteract it with precommitment (like prepaying for classes)

  Looking for existing concepts:
  - **Procrastination**: Broad term, but usually involves avoidance or aversion. Here, the user isn't avoiding the task mentally—they fully intend to do it "tomorrow." So it's a subset: specifically **intention-action decoupling**.
  - **Temporal discounting**: Hyperbolic discounting is a form, but the user's valuation of the task isn't changing. The issue is the execution gap, not devaluation.
  - **Planning fallacy**: Underestimating time needed, but here it's about start times, not duration.
  - **Present bias**: Overweighting current costs, but the user isn't choosing immediate rewards; they're just delaying.

  The closest fit is **procrastination**, but the user wants precision. They need to distinguish this specific pattern—where intention remains intact but action is perpetually deferred—from general procrastination. 

  The psychological mechanism seems to be **cognitive dissonance avoidance**: By maintaining the intention ("I'll start tomorrow"), they avoid admitting they don't want to run. The "tomorrow" excuse preserves self-image as someone who will act. 

  The predictability aspect is key: Even knowing the pattern, they still fall into it. This is **failure of metacognition**—knowing the bias but not applying the knowledge in the moment. Precommitment works because it removes the choice ("tomorrow" isn't an option).

  Coining a term:
  - **Intention-action gap**: Too vague.
  - **Recursive procrastination**: Captures the loop but not the stable intention.
  - **Perpetual postponement**: Descriptive but not analytical.
  - **Temporal intention displacement**: Highlights the shifting start date. 

  Best bet: **Temporal intention displacement** defined as *the stable maintenance of a future-directed intention coupled with recurrent rescheduling of its execution, driven by immediate cognitive ease of delay rather than reevaluation of the intention itself*. 

  For the predictability + precommitment aspect: That's a separate metacognitive failure. The core phenomenon is the displacement; the awareness is what allows precommitment to work. 

  Final clarity: This pattern differs from akrasia (no action against judgment), hyperbolic discounting (stable valuation), and standard procrastination (no aversion). The sharp test: If you can honestly say "I still intend to do X, just not *now*," and "now" keeps moving, it fits.
answer: |-
  Based on your detailed description, this pattern **isn't adequately captured by "procrastination," "akrasia," or "hyperbolic discounting"** as they’re commonly defined. What you’re describing is a distinct psychological phenomenon with specific mechanics. I’ll define it precisely, contrast it with nearby concepts, and address your questions about predictability/precommitment.

  ---

  ### **The Core Concept: *Temporal Intention Displacement***  
  **Definition**: The stable maintenance of a future-directed intention, coupled with recurrent rescheduling of its execution, driven by the immediate cognitive ease of delay rather than reevaluation of the intention or its value.  

  **Key diagnostic criteria** (test for borderline cases):  
  1. **Intention persistence**: The agent affirms the original goal’s value/urgency *without* revision (e.g., "Running is still important").  
  2. **Action-rescheduling**: Execution is deferred ("I’ll start tomorrow") using a justification that:  
     - Could have applied equally at any prior point ("I need a clear block of time").  
     - Does *not* reflect new information or changed priorities.  
  3. **Cognitive misalignment**: There’s no conscious experience of reversing the decision; the delay feels like a "technical adjustment" to the *timing*, not the *intent*.  
  4. **Predictability**: The agent may anticipate the displacement pattern but fails to mitigate it in the moment without external constraints.  

  **Why this fits your case**:  
  - Sunday-you and Monday-you both sincerely endorse running → **Intention persistence**.  
  - "I’ll start tomorrow" recurs with identical reasoning → **Action-rescheduling**.  
  - No feeling of changing your mind → **Cognitive misalignment**.  
  - You observe the pattern and pre-pay for classes to stop it → **Predictability**.  

  ---

  ### **How This Differs from Nearby Concepts**  
  | Concept          | Definition                          | How Your Case Differs                                  |  
  |------------------|-------------------------------------|--------------------------------------------------------|  
  | **Procrastination** | General delay despite expecting negative consequences. | Ordinary procrastination often involves avoidance, dread, or conscious aversion (e.g., "I skip running because I hate it"). Your case lacks this—you’re *committed* to the action, just not "now." |  
  | **Akrasia**      | Acting against one’s better judgment. | You’re *not* acting against judgment; you’re preserving the judgment ("Running is good") while decoupling it from *immediate* action. |  
  | **Hyperbolic Discounting** | Valuing immediate rewards over larger future rewards as time nears. | Your preference for running vs. not-running doesn’t shift as the deadline approaches—it’s stable. The issue is execution timing, not valuation. |  
  | **Planning Fallacy** | Underestimating time/effort for future tasks. | This focuses on *misjudging duration*, not repeatedly deferring the *start date* without changing the plan. |  
  | **Present Bias** | Overweighting immediate costs/benefits. | You’re not choosing an alternative reward (e.g., sofa vs. run); you’re deferring action *without substitution*. |  

  ---

  ### **The Predictability/Precommitment Layer**  
  This is **part of the same phenomenon**, not separate. Temporal Intention Displacement thrives on:  
  - **The "Tomorrow Illusion"**: Believing future-you will have more resources (time, willpower) than present-you, despite knowing historically this isn’t true.  
  - **Metacognitive failure**: You accurately predict the pattern *abstractly* ("I’ll delay again"), but in the *moment*, the rescheduling feels justified because:  
    - The excuse ("I’ll do it when work calms down") is contextually plausible.  
    - There’s no emotional cost to delaying—intention remains intact, so no guilt/conflict arises.  

  **Why precommitment works**: It removes the rescheduling option (e.g., paying for classes forces "now or lose money"). This bridges the intention-action gap by eliminating the cognitive ease of displacement.  

  ---

  ### **Why This Might Resolve Your Argument**  
  - **The label isn’t the point**—the sharp definition is. Calling this "procrastination" implies you’re avoiding the task, which feels inaccurate and defensive. "Akrasia" suggests moral weakness, which isn’t true here.  
  - **Temporal Intention Displacement** isolates the crux: Your judgment *isn’t* changing, but your brain exploits temporal flexibility to evade action *while preserving self-consistency*.  
  - By naming it, you shift from blame ("Why don’t you just do it?") to mechanism ("This is how the displacement trick works").  

  ---

  ### **A Test Case**  
  Imagine you plan to start meditation on Jan 1. On Jan 1, you delay to Jan 8 because "the holidays drained you"—an excuse that would’ve worked on Dec 25. You still value meditation.  
  → **This fits Temporal Intention Displacement**.  

  Now imagine on Jan 1, you realize meditation is boring and decide to quit.  
  → **Not displacement** (intention revoked).  

  Or you delay because your child is hospitalized.  
  → **Not displacement** (new information justifies rescheduling).  

  ---

  **In short**: You’ve described a self-deceptive "scheduling glitch" where intention is decoupled from initiation. It’s not laziness, weak will, or changing preferences—it’s a temporal loophole your brain exploits. The term gives you precision; the definition gives you a tool to dissect it. If your girlfriend agrees this fits, the argument collapses.
