prompt: |-
  So I'm one of the volunteer mods on a history wiki (nothing fancy, a few thousand articles) and we run something we call the Fringe Claims Desk: every claim about the past that isn't in the textbooks gets exactly one of three tags — pseudohistory, live controversy, or settled. Nearly all our precedents were set by Roz, who's away till March, and I've got one to tag and I honestly cant tell which way she'd jump. Her rulings so far:

  - Atlantis as a real Bronze Age empire in the Atlantic, wiped out in a single day → pseudohistory
  - ancient astronauts behind the pyramids and the Nazca lines → pseudohistory
  - Fomenko's New Chronology, i.e. that everything recorded before about 1600 is a reconstruction stitched together out of duplicated accounts, with a global Great Tartaria empire behind it → pseudohistory
  - the Tartaria mud-flood business, buried ground-floor windows and all → pseudohistory
  - a comet impact at the start of the Younger Dryas → live controversy
  - the claim that some Aboriginal Australian oral traditions preserve accurate memories of coastlines drowned at the end of the last ice age → live controversy, on the grounds that researchers who work with those communities take it seriously and it makes testable predictions about submerged sites
  - a retired Oxford engineering professor's claim that Britain's stone circles were all laid out using a single standard unit of length he inferred from hundreds of measurements and called the megalithic yard → pseudohistory
  - Norse voyages to Newfoundland before 1492 → settled, with a note Roz put in the style guide saying we'd have tagged this pseudohistory in 1900 and been wrong for seventy years

  The new one: a retired hydrographic surveyor with no academic post, who publishes on his own site and in a couple of low-ranking journals, argues that a submerged stone mole off the coast at a site I'll call Kalbiyah isn't the Ptolemaic harbour structure it's always been taken for but a Middle Bronze Age one, roughly 1,300 years older — and, more than that, that this whole class of coastal installation along that coast has been systematically misdated, because the regional ceramic sequence it's dated by rests on a circular assumption. Three things make me want to be fair to him: he dug out the 1930s excavation notebooks and showed that three pottery lots were logged under the wrong trench; he said in advance which result from his new sediment cores would make him abandon the whole idea; and he already shifted his date by sixty years after someone pointed out a mixing effect. Three things make me want to bin it: three specialist reviews have rejected it in fairly brutal terms, the one emeritus professor of maritime archaeology who's commented has said only that the notebooks point deserves a proper re-excavation, and his fieldwork is now part-funded by a nationalist movement that puts his mole on T-shirts — which I know is a genetic fallacy to hold against him, but it does make me suspect motivated reasoning wearing a lab coat.

  What I'd like is: 1) the first rule that fits all eight of Roz's verdicts, and what it predicts for the mole, 2) a second, genuinely different rule that also fits all eight, and what it predicts, 3) a third if you've got one, including what it would say about the T-shirt money and the nationalist funding, 4) your best guess at the tag, the closest of the eight precedents, and your single strongest reason, 5) the one extra hypothetical case that would best seperate whichever rules are still standing. Exactly five numbered items, a sentence or two each, no intro and no summing-up at the end, and in British English please — my flatmate already says I write like an American and I'd rather not make it worse.
reasoning: |-
  Hmm, the user is a volunteer moderator on a history wiki dealing with fringe claims. They need help categorizing a new claim about a submerged stone mole at Kalbiyah being Bronze Age rather than Ptolemaic. They've provided Roz's previous rulings and want me to apply consistent rules to this case.

  Looking at Roz's precedents: Atlantis, ancient astronauts, Fomenko, Tartaria mud-flood, and the megalithic yard were all tagged pseudohistory. The Younger Dryas comet and Aboriginal oral histories were live controversies. Norse voyages were settled. The common thread seems to be whether mainstream scholarship engages seriously with the claim.

  For the Kalbiyah mole claim: The claimant has some methodology (notebooks, sediment cores) and adjusted his position, which suggests rigor. But he's published in low-tier journals, faced brutal rejections, and has nationalist funding that creates bias concerns. The maritime archaeology professor only endorsed re-examining the notebooks, not the broader theory.

  Rule 1: "Pseudohistory unless current specialists treat it as a credible challenge requiring resolution." Fits all precedents - specialists dismiss pseudohistory but engage with live controversies. Predicts "pseudohistory" for Kalbiyah since specialists rejected it.

  Rule 2: "Settled if universally accepted; live controversy if contested by credible specialists; pseudohistory if lacking specialist engagement or consensus against." This also fits - Norse voyages are settled, comet/Aboriginal claims are contested, others lack engagement. Predicts "live controversy" for Kalbiyah because one professor acknowledged the notebook issue.

  Rule 3: "Pseudohistory if incompatible with established frameworks without extraordinary evidence, considering funding bias." Nationalist funding increases skepticism but doesn't decide alone; the claim radically redates structures without sufficient evidence. Predicts "pseudohistory."

  My best guess: Tag as "pseudohistory," closest to megalithic yard precedent - both involve non-specialists making sweeping challenges using personal measurements, rejected by experts. Strongest reason: Specialist consensus rejects it despite partial methodological rigor.

  Hypothetical to separate rules: Suppose a claim with strong evidence initially dismissed but then gains specialist traction. Rule 1 might keep it pseudohistory until specialists engage; Rule 2 might shift to live controversy faster.
answer: |-
  1.  Rule 1: Pseudohistory if rejected by specialist consensus without credible engagement; live controversy if actively debated by credible specialists; settled if universally accepted. Predicts **pseudohistory** for the mole: specialist reviews are brutally rejective, and only one emeritus noted a limited point for re-checking, not endorsing the core claim.
  2.  Rule 2: Pseudohistory if the core claim requires overturning fundamental, well-established sequences *and* lacks robust new evidence broadly accepted; live controversy if it challenges specific interpretations within an accepted framework *and* garners specialist discussion; settled if uncontested. Predicts **pseudohistory** for the mole: redating the entire class of installations overturns regional ceramic chronology, and the new evidence (notebooks, cores) isn't broadly accepted despite partial rigor.
  3.  Rule 3: Pseudohistory if the claim is primarily sustained outside mainstream peer review channels despite rejection *or* shows clear signs of motivated reasoning undermining methodology; live controversy if methodological disputes occur within specialist literature. Predicts **pseudohistory** for the mole: publication in low-ranking journals/own site, brutal rejections, and nationalist funding strongly suggest motivated reasoning influenced the core re-dating hypothesis, outweighing his correctable methodological points.
  4.  Best guess tag: **Pseudohistory**. Closest precedent is the **megalithic yard claim**: both involve a non-academic using extensive personal measurements/data (cores/notebooks vs. surveyed circles) to propose a radical rewrite (systematic misdating vs. universal unit) rejected by specialists despite surface plausibility. Strongest reason: The core claim – systematic misdating of an entire class – is rejected by specialist consensus, mirroring the rejection of the megalithic yard's universality.
  5.  Separating hypothetical: A claim, initially dismissed, where new, independently verified evidence (e.g., conclusive DNA, undisputed stratigraphy) forces multiple specialists to publicly re-evaluate core assumptions *within their own literature*. Rule 1 might stay pseudohistory until engagement deepens; Rule 2 would likely shift to live controversy; Rule 3 might resist if funding bias persists.
