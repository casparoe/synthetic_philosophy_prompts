  hi, me and my friend argured about this dumb coin game for like two hours yesterday and now I keep seeing the same shape everywhere, so: does this have a name

  here's the game. you start with 100 dollars of make-believe money. every round a coin comes up heads 60% of the time, and before each flip you pick what fraction of your money to put down: heads you get back double what you put down, tails you lose it. so it's a good game, the odds are on your side. my friend says put everything down every time, because that makes the average biggest: after one round the average is 120 dollars, and after a hundred rounds he says the average is insane. I coded up a quick simulation and yeah, the average is genuinely crazy, but basically every one of the thousand people in my sim ends up with almost nothing, and one guy ends up with more money than exists. then I made them stake a fixed fraction every round instead, and there was this sweet spot: staking a tiny bit is safe but boring, staking most of it shoots way up and then everything falls apart, and right around a fifth of what you have, you end up with the most actual money after lots of rounds. and if you stake everything, one tails and you're at zero and the game is just over for you, so who cares what the average was.

  three things I can't sort out:

  1) is the "there's a best fraction" thing and the "the average is a lie because one freak person drags it up" thing the same thing, or two different things that just happen to show up in the same game. and why a fifth, is that only because I picked 60%, or is something else going on

  2) I tried a version where you win or lose a flat 10 dollars each round instead of a fraction of what you have, and the sweet spot completely went away and my friend was right again. was that a bug in my code, or is it telling me something real about when this happens

  3) another friend says this is all just that people are scared of losing, like it's about feelings, and a robot who didn't mind losing should stake everything. but my sim has no feelings and still does better at a fifth. so is what I found the same as that thing where gamblers always end up broke at casinos, or is that a different thing

  and does it even apply outside betting? like, is "only applied to one summer program and put everything into it" versus "applied to eight" the same shape, or am I just seeing my new favorite idea in everything. also, if you only get one flip and then the game ends forever, is staking everything actually correct and my whole thing falls apart

  please don't just hand me a word for it. I want to know what exactly the thing is, which of those pieces are part of it and which are something else, what it is not, and where it stops being true.
