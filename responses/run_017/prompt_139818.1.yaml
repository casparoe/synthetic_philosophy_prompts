answer: |-
  ## Joint Position Statement on the Knobe Effect: Areas of Agreement, Empirical Cruxes, and Verbal Disputes

  **Section 1: Points of Agreement**

  Both signatories agree to the following foundational statements concerning the investigation of the Chairman-style asymmetry:

  1.  **Existence of the Basic Effect:** There exists a robust empirical asymmetry in lay judgments concerning the vignette structure exemplified by the Chairman case (and its variants). Specifically, when presented with an agent who:
      *   Performs an action primarily aimed at achieving a primary goal,
      *   Foresees that this action will bring about a side effect,
      *   Is explicitly indifferent to bringing about this side effect,
      *   And the side effect is a *harm* (e.g., harming the environment/killing workers), subjects are strongly inclined to agree that the agent brought about the side effect *intentionally*.
      Conversely, when the side effect is a comparable *benefit* (e.g., helping the environment/saving workers), subjects are strongly disinclined to agree that the agent brought about the side effect *intentionally*.
      This pattern is jointly accepted as a reliably observed phenomenon.

  2.  **Methodological Constraints:**
      *   Neither signatory may appeal to their own personal intuitions about the cases, nor to the intuitions expressed within the seminar, as empirical evidence for or against their position. The resolution hinges solely on agreed-upon empirical data derived from appropriately designed studies.
      *   Evidence derived solely from the original Chairman-style vignettes, or minor variations thereof using only the core structure (agent, primary goal, foreseen side effect, indifference, harm/benefit valence), is insufficient to definitively adjudicate between the core claims of Side A and Side B. Further empirical probes are necessary.

  3.  **Valence is Necessary but Not Necessarily Sufficient:** Both sides agree that the *moral valence* of the side effect (harm vs. benefit) is a necessary condition for observing the asymmetry in the basic cases. However, agreement extends only to its necessity within that specific structure; disagreement remains concerning whether valence is the *driving factor* or merely a *correlate* of the underlying mechanism (e.g., norm violation or blame attribution).

  4.  **Foresight is Necessary:** Both sides agree that the agent’s *foresight* of the side effect is a necessary condition for the asymmetry to manifest in judgments about intentionality in these cases. Cases where the side effect is unforeseen do not elicit the asymmetry.

  **Section 2: Points of Disagreement & Proposed Empirical Tests**

  The following table outlines the key points of disagreement, phrased acceptably by each side, identifies an agreed-upon empirical test bearing on the crux, states each side's prediction for that test, and notes where predictions are insulated.

  | Crux                                                                 | Claim as Side A Would Phrase It                                                                                                                             | Claim as Side B Would Phrase It                                                                                                                                                     | Agreed Test Bearing on Crux                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 | Side A Prediction                                                                                                                                                                                          | Side B Prediction                                                                                                                                                                                                 | Insulated? & Why                                                                                                                                                             |
  | :------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Driver: Norm Violation vs. Moral Valence/Affect**                  | The asymmetry is driven by the presence of a norm violation (prohibitive or prescriptive) within the agent's context, not by the moral valence per se.       | The asymmetry is driven by the negative moral valence (harm) of the side effect and its associated affective response (blame), not by norm violation as an abstract category.        | **Test 1: Valence x Rule Explicit.** 2x2 Design: Factor 1: Side Effect Valence (Harm / Benefit). Factor 2: Explicit Norm Status (Explicit Rule Broken / No Rule Mentioned). **Vignette (Harm Rule):** "The VP says: 'We absolutely cannot harm Species X; it's a strict company rule. But initiating Project Gamma will increase profits significantly, and it will also definitely harm Species X.' The CEO replies: 'I don't care at all about harming Species X. I just want to make profits. Start the project.' Did the CEO intentionally harm Species X?" **Vignette (Harm No Rule):** Remove the rule statement. **Vignette (Benefit Rule):** "...will definitely help Species X... strict company rule *against* helping Species X unnecessarily..." etc. **Vignette (Benefit No Rule):** Remove the rule statement. | **Side A:** Significant interaction. High intentionality ratings *only* when a norm is violated (Harm Rule, *Benefit Rule*). Low intentionality when no norm is violated (Harm No Rule, Benefit No Rule). No main effect of Valence alone. | **Side B:** Significant main effect of Valence (Harm > Benefit). Significant main effect of Rule (Rule Broken > No Rule). Significant interaction driven by Harm Rule being highest. Benefit Rule intentionality remains low. | **B Slightly Insulated:** Could argue Rule manipulation merely alters blame potential, not core valence effect. **A Not Insulated:** Predicts unique pattern. **Crucial for A.**                               |
  | **Generalization to Other Adverbs/Foresight**                        | The asymmetry reflects a core feature of intentional action attribution competence and should generalize to semantically related adverbs ("knowingly", "deliberately") and explicit foresight questions. | The asymmetry is specific to the "intentionally" probe and arises from performance factors like blame; it should not generalize robustly to "knowingly", "deliberately", or explicit foresight. | **Test 2: Probe Variation.** Use standard Chairman Harm/Benefit vignettes. Vary the dependent measure probe between subjects: "Did the CEO [intentionally/knowingly/deliberately] [harm/help] the environment?" or "Did the CEO foresee that starting the project would [harm/help] the environment?".                                                                                                                                                                                                                          | **Side A:** Significant asymmetry (Harm > Benefit) for *all* probes: intentionally, knowingly, deliberately. *No* asymmetry for explicit foresight question (foresight affirmed equally in Harm/Benefit). | **Side B:** Significant asymmetry *only* for "intentionally". No significant asymmetry (or much reduced) for "knowingly", "deliberately". Explicit foresight affirmation equally high in Harm/Benefit. | **A Insulated on Foresight:** Predicts no asymmetry here, consistent with competence view. **B Insulated on Knowingly/Deliberately:** Could argue different performance factors. **Crucial for B on 'intentionally' vs others.** |
  | **Robustness Under Cognitive Constraints**                           | The asymmetry is a robust output of competence and should persist even under conditions impairing performance (speed, load, delay).                         | The asymmetry relies on performance factors like blame attribution; impairing cognitive resources (speed, load, delay) should attenuate or eliminate it.                            | **Test 3: Cognitive Manipulations.** Standard Chairman Harm/Benefit vignettes. Between-subjects conditions: *Speeded:* Subjects must respond within a very short time limit (e.g., 3 seconds). *Load:* Subjects must hold a demanding digit span in memory while reading/responding. *Delay:* Subjects must wait 30 seconds after reading before responding. *Control:* Standard, untimed, no-load response.                                                                                                                     | **Side A:** Significant Harm > Benefit asymmetry persists in *all* conditions (Speeded, Load, Delay, Control).                                                                                                | **Side B:** Significant Harm > Benefit asymmetry in Control condition. Asymmetry significantly *reduced or eliminated* in Speeded, Load, and Delay conditions.                                                        | **Neither Insulated:** Directly opposing predictions on persistence vs. attenuation under constraint.                                                                                   |
  | **Robustness When Blame is Blocked**                                 | The asymmetry stems from the normative status of the outcome itself within the context of action explanation, not from blame; blocking blame should not eliminate it. | The asymmetry is driven by the negative affect and blame associated with the harmful outcome; blocking blame should eliminate or significantly reduce the asymmetry.                | **Test 4: Blame Blocking.** Standard Chairman Harm/Benefit vignettes. Between-subjects conditions: *Excused Harm:* Add compelling justification/excuse (e.g., "The only way to save ten other species was to harm Species X; experts agree there was no alternative"). *Non-Agential Harm:* Harm occurs but is not directly caused by the agent's chosen action (e.g., "Starting Project Gamma will increase profits, and it will also definitely cause a *pre-existing, unstable geological fault* to collapse, harming Species X"). *Control Harm:* Standard harm vignette. *Control Benefit:* Standard benefit vignette. | **Side A:** Significant Harm > Benefit asymmetry persists in *both* Excused Harm and Non-Agential Harm conditions compared to Control Benefit.                                                                 | **Side B:** Significant Harm > Benefit asymmetry in Control Harm vs Control Benefit. Asymmetry significantly *reduced or eliminated* in Excused Harm and Non-Agential Harm conditions.                            | **Neither Insulated:** Directly opposing predictions on blame manipulation effects.                                                                                                   |
  | **Robustness in Production/Paraphrase vs. Yes/No**                   | The asymmetry reflects the structure of the competence and should manifest even when subjects are not directly probed with "intentionally".                  | The asymmetry is an artifact of the specific "intentionally" probe triggering performance factors; it should not manifest strongly in open-ended production or paraphrase selection. | **Test 5: Paraphrase Selection Accuracy.** Subjects read standard Chairman Harm/Benefit vignettes. Task: "A neutral reader wants the clearest description of what happened. Which *one* of the following two descriptions is clearer? You will be paid a bonus if you select the description most often chosen by neutral readers in a large pre-test." **Options (Harm Vignette):** (a) *The CEO started the project to make profits, foreseeing it would also harm the environment.* (b) *The CEO started the project to make profits and intentionally harmed the environment.* **Options (Benefit Vignette):** (a) *The CEO started the project to make profits, foreseeing it would also help the environment.* (b) *The CEO started the project to make profits and intentionally helped the environment.* | **Side A:** No significant difference in selection rates for option (b) ("intentionally") between Harm and Benefit vignettes. (Both will be low, as (a) is objectively clearer).                                                                              | **Side B:** Significantly higher selection rate for option (b) ("intentionally") in the *Harm* vignette compared to the Benefit vignette.                                                                        | **A Insulated:** Predicts no asymmetry, which could be explained by task demands favoring the foresight paraphrase. **B Not Insulated:** Predicts asymmetry persists. **Crucial for B.**                  |
  | **Subject vs. Agent Norms**                                          | The asymmetry depends on the normative status of the side effect within the *agent's* environment or the objective normative facts, not the subject's personal moral response. | The asymmetry is driven by the subject's own negative moral evaluation of the harmful outcome.                                                               | **Test 6: Cross-Norm Case.** Vignette: "In the isolated tribe of the Kalari, it is considered deeply virtuous and obligatory to protect the sacred Grove. However, it is considered morally neutral and permissible to divert the river, even though this causes the Grove to wither. The Chief says: 'Building the dam will strengthen our defenses significantly, and it will also definitely divert the river, causing the Grove to wither.' The Chief replies: 'I don't care at all about the Grove withering. I just want stronger defenses. Build the dam.' Did the Chief intentionally cause the Grove to wither?" (Subject is from culture where harming sacred groves is wrong). | **Side A:** High intentionality ratings. (Violates Kalari norm - diversion permissible, grove withering bad).                                                                                                      | **Side B:** Low intentionality ratings. (Subject's culture views grove withering as bad, but agent's norm environment does not treat it as a violation; blame potential low).                             | **Neither Insulated:** Directly opposing predictions on norm source.                                                                                                           |

  **Section 3: Verbal Disputes and the Residual Empirical Core**

  Upon review, the signatories identify the following aspects of the disagreement as potentially verbal, meaning that resolving linguistic or conceptual ambiguities could dissolve the apparent conflict without needing new empirical evidence:

  1.  **Ambiguity of "Intentionally":** A significant portion of the disagreement may stem from differing interpretations of the word "intentionally" within the probe question. Side A often interprets it as encompassing actions where the agent is normatively answerable for a foreseen outcome they were indifferent to, implying a link to normative assessment within action explanation. Side B often interprets it more narrowly as synonymous with "on purpose" or "aiming at," excluding merely foreseen side effects. Clarifying that the question is specifically about whether the side effect itself was brought about *on purpose* (as opposed to the primary goal) versus whether the agent is *answerable* for it, might resolve some disagreement. Both sides agree that the agent did not bring the side effect about *on purpose*; the core dispute is whether "intentionally" in this context tracks answerability (Side A) or purpose (Side B).

  2.  **Scope of "Competence" vs. "Performance":** Disagreement over whether the competence/performance distinction provides a substantive explanation or merely relabels the phenomenon may be verbal. Both sides agree that the asymmetry exists and involves psychological processes. The substantive empirical question is not *whether* to call something competence or performance, but *which specific psychological mechanisms* (e.g., rapid normative assessment modules vs. slower blame attribution processes) generate the asymmetry, and under *which conditions* (e.g., cognitive load, blame blocking) it persists or attenuates. The distinction is useful heuristically but the core dispute concerns the underlying mechanisms and their robustness.

  **Residual Empirical Core:** Setting aside these verbal aspects, the core, substantive empirical disagreement concerns the *psychological mechanisms* responsible for the Knobe asymmetry and the *conditions under which it persists*. Specifically:
      *   Is the asymmetry primarily driven by the detection of norm violation (Side A) or by negative valence and associated blame/affect (Side B)?
      *   Is the asymmetry robust to manipulations that impair deliberative processing (Side A) or dependent on it (Side B)?
      *   Is the asymmetry robust to manipulations that block blame attribution (Side A) or dependent on it (Side B)?
      *   Does the asymmetry reflect a feature of action representation manifested even without the specific "intentionally" probe (Side A) or is it tied to that probe (Side B)?
      *   Is the operative normativity that of the agent's context (Side A) or the subject's own evaluation (Side B)?

  The resolution of this joint position rests on designing and executing experiments targeting these empirical cruxes, such as those outlined in Section 2, and interpreting the results accordingly. The signatories commit to accepting the outcomes of such pre-registered tests as bearing decisively on the remaining substantive disagreement.
