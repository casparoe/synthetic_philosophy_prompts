  ### Leaves (Positions)
  1. **Secular Moral Causation**  
     *Karma as societal/natural consequences within one life (e.g., corruption→distrust).*  
     Awkward commitment: Fails to explain why the virtuous often suffer randomly (cancer, accidents).  
  2. **Theistic Justice**  
     *Karma administered by a conscious force ensuring desert across lives.*  
     Awkward commitment: Requires a benevolent force to impose punishments no one remembers incurring.  
  3. **Infinite Debt Acceptance**  
     *Karma is an impersonal law balancing infinite debts; unknowability doesn’t negate justice.*  
     Awkward commitment: Justifies any suffering as "deserved" (e.g., child cancer) via untraceable past deeds.  
  4. **Transferable Merit**  
     *One person’s good deeds can settle another’s karmic debts (e.g., ancestral atonement).*  
     Awkward commitment: Lets wrongdoers escape consequences if someone else "pays" (e.g., a tyrant’s child donates wealth).  
  5. **Hard Retributivism**  
     *Karma enforces strict desert across lives; no amnesty for amnesia or redemption.*  
     Awkward commitment: Punishes "new" selves for old deeds (e.g., Aarav deserves pain for pre-injury actions).  
  6. **Soul Curriculum**  
     *Karma as lessons for growth; suffering educates, not punishes.*  
     Awkward commitment: Romanticizes trauma (e.g., abuse as a "soul lesson").  
  7. **Strict Causalism**  
     *Karma impartially balances actions/consequences, ignoring intent or redemption.*  
     Awkward commitment: Makes accidental harms (e.g., Maya’s fire) karmically equivalent to malice.  
  8. **Unnamed Combo 1**  
     *Incoherent path (see Q4).*  
  9. **Unnamed Combo 2**  
     *Unattractive path (see Q6).  

  **Indistinguishable Leaves:** Positions like "Soul Curriculum" and "Strict Causalism" (both growth-focused) can’t be split further by the tree—their differences hinge on metaphysical details beyond desert intuition.

  ### Empty Combinations & Why
  - **Q4→B**: Rejecting one-life karma *and* infinite-regress problems → **Incoherent**. You can’t demand past lives for balance *and* reject the infinite regress that makes desert untestable.  
  - **Q6→B**: Believing Lena’s work helps but doesn’t *transfer* merit → **Unattractive**. This "partial transfer" lacks philosophical defenders—it’s a fuzzy compromise.  

  ### The Key Branch: Purpose (Growth vs. Desert)
  **Q7 (Growth Over Payback)** does the heaviest lifting. It splits the tree into two irreconcilable worlds: one where karma is about *desert* (punishment/reward) and one where it’s about *development* (learning/growth). This surprised me because dinner-party debates often conflate them, but the distinction vaporizes "karma as desert" for half the positions. Most readers have strong intuitions here—e.g., "Suffering teaches resilience" (Growth) vs. "They had it coming" (Desert)—before realizing it dictates whether karma aligns with justice at all. Build your piece around this fork: it forces the question, "Is karma moral accounting or spiritual training?" and reveals why many who "believe in karma" aren’t talking about desert.

