  Below is a decision tree designed to map intuitive beliefs about karma-as-desert onto named philosophical positions. It uses concrete vignettes and plain claims to avoid doctrinal language, focuses on your three key issues (infinite bar tab, transferable merit, diachronic amnesia), and includes a robust secular option. The tree has 8 branch nodes (3 vignettes, 5 claims) and 12 leaves (named positions or "unnamed" combinations). Each leaf includes a one-sentence "awkward commitment" – the hardest pill to swallow for that view.

  ### Decision Tree: Mapping Karma as Desert
  *Start at the top and answer each question based on intuition. Your path ends at a leaf (position).*

  1. **Vignette: The Amnesiac CEO**  
     *After a brain injury, tech CEO Aarav loses all memory of his past and develops a gentle, humble personality. He now suffers chronic pain from the injury. His pre-injury self was ruthless, exploiting workers for profit. Does Aarav deserve his suffering?*  
     - **A) Yes** → Go to Q2  
     - **B) No** → Go to Q3  

  2. **Claim: Endless Receipts**  
     *If karmic debts stretch back through countless forgotten past lives, any present suffering could always be "explained" as payback for unknown past deeds. Does this make karma untestable (and thus irrelevant to justice)?*  
     - **A) Yes, it undermines desert** → Go to Q4  
     - **B) No, cosmic justice needs no evidence** → Go to Q5  

  3. **Vignette: The Inherited Debt**  
     *Lena’s ancestor enslaved people and stole land. Lena, a compassionate activist, dedicates her life to reparations—funding schools and returning property. Does Lena’s work offset her ancestor’s karmic debt?*  
     - **A) Yes** → Go to Q6  
     - **B) No** → Go to Q7  

  4. **Claim: One-Life Ledger**  
     *Can karma meaningfully balance moral accounts within a single lifetime, without past/future lives?*  
     - **A) Yes** → Leaf: **Secular Moral Causation**  
     - **B) No** → Leaf: **Unnamed Combo 1** (Empty: Incoherent. If karma needs past lives *and* infinite regress voids desert, no stable position exists.)  

  5. **Claim: Cosmic Bookkeeper**  
     *Is karma administered by a conscious force (e.g., divine or cosmic intelligence) rather than an impersonal law?*  
     - **A) Yes** → Leaf: **Theistic Justice**  
     - **B) No** → Leaf: **Infinite Debt Acceptance**  

  6. **Claim: Guilt Transfer**  
     *Can Person A’s good deeds directly cancel out Person B’s karmic debts?*  
     - **A) Yes** → Leaf: **Transferable Merit**  
     - **B) No** → Leaf: **Unnamed Combo 2** (Empty: Unattractive. If Lena’s work helps but doesn’t *offset* debt, it becomes a half-measure no one defends.)  

  7. **Claim: Growth Over Payback**  
     *Is karma’s primary purpose soul-growth or learning, not punitive desert?*  
     - **A) Yes** → Go to Q8  
     - **B) No** → Leaf: **Hard Retributivism**  

  8. **Vignette: The Accidental Fire**  
     *Maya accidentally starts a wildfire while camping. It destroys a town, but she saves survivors and rebuilds homes. Does her redemption erase the karmic weight of the accident?*  
     - **A) Yes, consequences can be redeemed** → Leaf: **Soul Curriculum**  
     - **B) No, intent is irrelevant to cosmic balance** → Leaf: **Strict Causalism**  

