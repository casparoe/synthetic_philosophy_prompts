  The debrief must explicitly connect each game phase to Hobbesian concepts: 
  - Phase 1 → causal definitions 
  - Phase 2 → Wallis conflict 
  - Phase 3 → existence vs. constructibility 
  - Phase 4 → rejection of indivisibles 

  Potential pitfalls to address: 
