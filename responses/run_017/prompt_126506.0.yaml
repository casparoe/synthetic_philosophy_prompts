  Okay, let me start by unpacking the user's query. They're involved in a reading group on the zombie argument and have a specific objection to the standard Kripke-style reply. The main point they're making is about the Uniformity Constraint—whatever applies to the Hesperus/Phosphorus case should apply to zombies too. They think this constraint makes the zombie argument valid again.

  First, I need to recall the zombie argument basics. Chalmers uses conceivability to argue for metaphysical possibility: if zombies are conceivable, then consciousness isn't physical. Kripke's objection is that conceivability doesn't always imply possibility, using examples like Hesperus/Phosphorus. The user mentions that two-dimensional semantics is the common reply, separating primary and secondary intensions. But they feel this demotes Kripke's necessity, making conceivability valid again via primary intensions.

