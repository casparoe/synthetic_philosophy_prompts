  I should check if the Uniformity Constraint holds. Both cases involve epistemic gaps masking necessary identities. For Hesperus, it's an astronomical identity; for zombies, it's consciousness and physical states. The user is right that 2D semantics handles both similarly: primary intensions differ, but secondary intensions don't. The key is whether consciousness is like Hesperus or water. Physicalists would say consciousness is like water—necessarily identical. Anti-physicalists say it's different. The user's point is that without prior knowledge, we can't dismiss the zombie conceivability.

