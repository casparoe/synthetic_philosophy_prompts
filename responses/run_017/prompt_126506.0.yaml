  I should assess their points. The Uniformity Constraint is plausible but not universally accepted. The key issue is whether consciousness necessitates physical states. If it does, zombies are impossible. The user's argument pushes physicalists to explain why zombies seem possible without assuming physicalism. That's tough without circularity. But maybe there are responses, like phenomenal concepts being direct and not revealing essence. 

