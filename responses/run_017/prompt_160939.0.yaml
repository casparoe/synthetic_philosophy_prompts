prompt: |-
  hey — I run a small research and forecasting team (6 people, no philosophy PhDs, mostly econ / policy / bio backgrounds) at a grantmaking org. Every week we publish an internal sheet with maybe 12 headline forecasts and a confidence on each, and those numbers get used to move real money. We already do calibration training and we aggregate with a prediction-market-ish thing; that part is fine, don't redesign it.

  What we have no rule for is higher-order evidence. You know the shape: not evidence about the topic, evidence about your evidence — that a teammate disagrees, that your track record on this *class* of question is bad, that you were sleep-deprived / had a couple of drinks / had just read a forum thread that made you angry. Half the time we handle this by vibe, and the vibe is usually "split the difference," which I'm fairly sure is wrong in at least two distinguishable ways.

  Three things I want built into whatever you give me. I half-invented these names, and I want you to actually engage with them rather than dissolving them back into the textbook cases:

  1. **HOE laundering.** The same disagreement getting counted twice — once as first-order content (their reasons, which we can inspect and reject) and once as the bare fact that an independent-ish person disagrees, which mysteriously still moves us. Plus the adversarial version: someone can *manufacture* higher-order evidence by disagreeing loudly, and I want to know what the procedure says when the disagreement is cheap to produce.
  2. **Domain-local vs. global reliability.** My calibration on macro questions is garbage. Does that licence moving me on a question about protein folding, or about a specific country's election? Likewise "I'm tired tonight" — local in *time*, and possibly moot if my reasoning is fully written out and checkable by someone else. I think there's a real distinction here about when reliability evidence does *no work* because the first-order argument is fully surveyable, and I want it in the procedure, not footnoted.
  3. **The publication gap.** What number goes in the sheet when nobody's first-order view moved but everyone's second-order view says our first-order reasoning is unreliable? This is the epistemic akrasia thing. I want the procedure to be honest about whether "I still think P, and I think my thinking about P is distorted" is irrational, merely awkward, or actually the correct resting place — and, separately, what we *write down* and *do*, since those can come apart.

  So: give me a procedure my team can actually run. Ordered questions; what counts as a sufficient answer to each; where it exits with a no; and where it hands the decision to a person because the remaining question is one of values or appetite for risk rather than fact. It has to be runnable in 15 minutes on a Slack thread or 30 minutes in a meeting, by people who have never read a word of epistemology. No citations, no paper names, no "as so-and-so argues" — I don't care who said it, I care whether the move works. If a step needs a distinction from the literature, name it in plain words, define it in a sentence, and move on.

  Then run it on four of our actual recurring situations:

  (a) A teammate with a measurably *worse* track record than the group on this question class disagrees hard with our 70%.
  (b) We realise, mid-writeup, that all six of us read the same thread, so our apparent agreement isn't independent. (I think this one should make us *less* confident, not more, but I want the procedure to say it and not me.)
  (c) Our field analyst — best track record on the team, has actually been in the region, has reasons we can't fully verify — insists we're wrong. Nobody on the team is moved first-order. I suspect the honest output here is a number nobody endorses, and I want you to say so if that's where it lands.
  (d) Somebody wrote their section at 2am and says so, but the reasoning is fully laid out and the rest of us can check every step.

  At least one of these should come out in a way I don't like. Don't soften it to make me happy.

  You're a professional epistemologist who has also spent years shipping an actual weekly forecast — think of yourself as someone who's done both, and who finds the pure theory a bit under-specified for practice. Take your time and think carefully. Before you start writing, brainstorm privately: at least six ways small teams get higher-order evidence wrong, and at least three cases where HOE should not move you *at all*. Don't paste the brainstorm into the answer; just let it shape the procedure.

  Format: prose first, then a table, then JSON. The table should have exactly these columns — `Step` | `Question to ask` | `What counts as a sufficient answer` | `Where it exits` | `Who signs off`. After that, one JSON object and nothing else after it, with exactly these fields:

  - `steps`: array of strings, one short line per step, in order
  - `stop_rules`: array of strings — the conditions under which the procedure halts with a no
  - `judgment_calls`: array of objects `{question, why_it_cant_be_proceduralized}`
  - `worked_cases`: array of objects `{case_id, verdict, uncomfortable, one_sentence_rationale}` where `uncomfortable` is true or false
  - `known_failure_modes`: array of objects `{name, symptom, what_the_procedure_does_about_it}`
  - `what_the_procedure_cannot_do`: string

  Also drop in a few lines — not a whole section — on what will predictably go wrong the first time we run this.
reasoning: |-
  We are building a procedure to handle higher-order evidence (HOE) in a forecasting team. The team publishes weekly forecasts with confidence levels, and these influence funding decisions. The procedure must address three key issues: HOE laundering, domain-local vs. global reliability, and the publication gap. It should be practical, runnable in 15-30 minutes by non-philosophers, and output a forecast number that can be published.

  ### Key Principles from the Query
  1. **HOE laundering**: Avoid double-counting disagreement. Disagreement is either first-order (reasons we can evaluate) or higher-order (the fact of disagreement itself). The procedure should not count it both ways. Also, address adversarial HOE (cheap disagreement).
  2. **Domain-local vs. global reliability**: Reliability evidence (e.g., poor track record in macro) should only affect forecasts in the same domain unless there's a reason to generalize. Also, consider temporal factors (e.g., being tired) and whether the reasoning is fully surveyable (if so, HOE might be moot).
  3. **Publication gap**: When first-order views remain unchanged but HOE suggests unreliability, the procedure should output a number that might be akratic (e.g., "I believe P but think my reasoning is distorted"). The published number should reflect the team's best judgment for action, even if internally inconsistent.

  ### Brainstorm (not shown, but shaping the procedure)
  - Common mistakes: 
    1. Over-adjusting for disagreement without evaluating the reasons.
    2. Under-adjusting for track record because it feels personal.
    3. Confusing independent vs. correlated evidence.
    4. Letting mood/state affect forecasts even when reasoning is explicit and checkable.
    5. Failing to separate domain-specific reliability.
    6. Aggregating HOE in a way that creates incoherent outputs.
  - Cases where HOE should not move you:
    1. When the first-order reasoning is fully surveyable and verified by others (e.g., a mathematical proof).
    2. When the HOE is not relevant to the domain (e.g., bad at macro, but this is a bio question).
    3. When the HOE is manufactured adversarially and lacks substance.

  ### Procedure Design
  The procedure is a step-by-step checklist. It starts with first-order and then layers HOE only where necessary. It avoids double-counting by first resolving: is this disagreement or reliability evidence something we can incorporate as first-order? If yes, do that and stop. If not, treat it as pure HOE.

  **Core Structure**:
  1. **First-order aggregation**: Start with the team's aggregated forecast (from the existing prediction-market system). This is our baseline.
  2. **Identify HOE**: List any higher-order evidence (disagreement, track record, state, etc.) that hasn't been fully incorporated in the first-order view.
  3. **Filter irrelevant HOE**: Discard HOE that doesn't apply to this domain or is moot because reasoning is surveyable.
  4. **Quantify HOE impact**: For remaining HOE, estimate how much it should adjust confidence. Use simple rules (e.g., adjust by X% for disagreement from a reliable source).
  5. **Resolve akrasia**: If HOE suggests unreliability but first-order reasoning stands, decide on the published number (which might be a compromise).
  6. **Finalize and document**: Output the number and note any adjustments for transparency.

  To prevent HOE laundering:
  - If a disagreement provides new first-order reasons, incorporate those and then don't count the disagreement as HOE.
  - For adversarial HOE (loud but cheap disagreement), require that the disagreement is from a source with skin in the game or a track record, else ignore.

  Domain reliability:
  - Only adjust for track record if the domain is similar (define similarity as same topic class, e.g., macro to macro, not macro to bio).
  - For state (tired, etc.), adjust only if the reasoning isn't fully surveyable by others.

  Publication gap:
  - If first-order is unchanged but HOE suggests unreliability, the published confidence should be lowered by a fixed amount (e.g., half the HOE adjustment) to reflect doubt, but not fully override.

  ### The Procedure in Steps
  We'll create a table with steps, questions, sufficient answers, exits, and who signs off.

  **Who signs off**: The team lead (you) for judgment calls, but most steps are mechanical.

  **Exits**: 
  - Exit with "no change" if no relevant HOE is found.
  - Exit with "no" if HOE is invalid or irrelevant.

  **Steps**:
  1. Start with the aggregated forecast from the existing system (call this F).
  2. List all claimed HOE (disagreements, reliability concerns, etc.).
  3. For each HOE, ask: Can this be converted into first-order evidence? If yes, update F and discard as HOE.
  4. Filter out HOE that is domain-mismatched or moot (e.g., tiredness when reasoning is surveyable).
  5. For remaining HOE, assign an adjustment factor (e.g., -10% for a single disagreement from a peer).
  6. Combine adjustments (e.g., average them) to get a net HOE adjustment (H).
  7. Apply H to F to get a new confidence C.
  8. If C is inconsistent with the team's first-order view (akrasia), cap the adjustment to a max (e.g., no more than 20% shift) and note the tension.
  9. Output C for publication.

  ### Applying to Cases
  (a) **Teammate with worse track record disagrees with 70%**:
  - First, if their reasons are new, incorporate as first-order. If not, treat as HOE.
  - But their track record is worse, so discount the HOE adjustment (e.g., only -5% instead of -10%).
  - Verdict: Maybe 65-68%, not 50%. Uncomfortable if the team feels the reasons are weak, but the procedure forces some adjustment.

  (b) **All read same thread, so agreement isn't independent**:
  - This is HOE about correlated evidence. It doesn't provide new first-order reasons; it just means our confidence was inflated.
  - Adjustment: Lower confidence by, say, 15% (as a default for loss of independence).
  - Verdict: If we had 80%, now 65%. Uncomfortable because it's a mechanical drop without new info.

  (c) **Field analyst insists we're wrong, but no one is moved first-order**:
  - If their reasons are unverifiable, we can't incorporate as first-order. So it's pure HOE.
  - But they have a good track record, so significant adjustment (e.g., -20%).
  - Output might be 50% (from 70%), which no one endorses. Uncomfortable, but honest.

  (d) **Written at 2am, but reasoning is checkable**:
  - Since reasoning is surveyable, the state (tiredness) is moot. No adjustment.
  - Verdict: No change. Comfortable.

  ### Known Failure Modes
  - **HOE laundering**: Procedure avoids by converting to first-order where possible and only using HOE if not.
  - **Over-adjustment for weak HOE**: Use small, fixed adjustments and discount for source reliability.
  - **Under-adjustment for serious HOE**: Set minimum adjustments for strong evidence (e.g., track record).

  ### What the Procedure Cannot Do
  It cannot resolve deep epistemological dilemmas (e.g., should you ever be akratic?). It outputs a practical number for action, not a philosophical truth.

  ### Predictable Problems on First Run
  - Team might argue over what counts as "convertible to first-order."
  - Adjustments might feel arbitrary; need to calibrate with experience.
  - Akrasia cases might cause friction because the number feels wrong.

  Now, the table and JSON.
answer: |-
  ### Higher-Order Evidence (HOE) Handling Procedure  
  This procedure is designed to be run after your team has aggregated first-order forecasts (via your existing system). It handles HOE—disagreements, reliability concerns, or contextual biases—without double-counting evidence or ignoring domain constraints. It outputs a publishable confidence score or flags a judgment call. Runs in 15–30 minutes via Slack/meeting. No philosophy jargon; uses plain distinctions.  

  **Core Mechanics**:  
  - **Step 1–2**: Isolate HOE that hasn’t been absorbed into first-order reasoning.  
  - **Step 3–4**: Discard irrelevant HOE (wrong domain, or reasoning is surveyable).  
  - **Step 5–6**: Quantify impact only for valid HOE using preset adjustments.  
  - **Step 7**: Resolve akrasia (e.g., if HOE undermines confidence but first-order view holds, lower output by half the adjustment).  
  - **Built-in Guards**:  
    - **Anti-laundering**: Disagreement is either first-order (if reasons are new) or HOE (if only the fact of disagreement matters). Not both.  
    - **Domain-Local Reliability**: Track record/state only affects forecasts in the same domain (e.g., "macro" ≠ "bio") or if reasoning isn’t fully checkable.  
    - **Publication Gap**: Output may differ from personal belief (e.g., "I believe 70% but publish 60% due to HOE").  

  **Roles**:  
  - **Team Member**: Provides inputs at each step.  
  - **Lead (You)**: Signs off on judgment calls (e.g., domain similarity, adversarial intent).  

  **Adjustment Rules (Pre-Set for Consistency)**:  
  - Disagreement: −10% per disagreeing member (adjusted for their reliability).  
  - Correlated Evidence: −15% for shared bias (e.g., all read same thread).  
  - Track Record: −5% to −20% based on source’s local reliability (see Step 5).  
  - State (e.g., tired): −0% if reasoning surveyable; −10% if not.  
  - *Net adjustment capped at ±25%* to prevent overcorrection.  

  ---

  ### Procedure Table  
  | Step | Question to Ask                                                                 | What Counts as a Sufficient Answer                                                                                          | Where It Exits                                                                 | Who Signs Off          |  
  |------|---------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|------------------------|  
  | 1    | Did we already absorb all HOE into our first-order forecast during aggregation? | Yes: List how (e.g., "We debated John’s points and revised"). No: Proceed.                                                 | Exit to "no change" if all HOE was incorporated.                              | Team consensus         |  
  | 2    | What HOE exists? (Disagreements, track records, biases, or personal states?)    | List items (e.g., "Sarah disagrees," "all read same thread," "I was tired"). No need for debate—just state.                 | Exit to "no change" if no HOE is claimed.                                     | Team consensus         |  
  | 3    | Can this HOE be turned into first-order evidence?                               | Yes: If reasons are new/verifiable (e.g., "Sarah’s point about GDP data is new—add it to first-order"). No: Keep as HOE.    | If converted, remove from HOE list and revisit aggregation. Else, proceed.    | Lead                   |  
  | 4    | Is the HOE irrelevant? (Domain mismatch, surveyable reasoning, or cheap talk?)  | Yes: If domain is unrelated (e.g., "bad macro record ≠ bio forecast") or reasoning is fully checkable (e.g., "steps written"). No: Keep. | Discard irrelevant HOE. Exit if no HOE remains. | Lead                   |  
  | 5    | How reliable is the HOE source? (Local track record, stakes, or motives?)       | Rate source reliability: "Strong" (e.g., expert in domain), "Weak" (e.g., worse track record), or "Neutral".               | No exit—adjust impact accordingly (Weak: half effect, Strong: full effect).   | Lead                   |  
  | 6    | Apply adjustments to the forecast (use preset rules; combine by averaging).     | Calculate net HOE impact (e.g., −10% for disagreement × "Weak" = −5%). Apply to original forecast. Cap at ±25%.            | Proceed to Step 7.                                                            | Team member (math)     |  
  | 7    | Does the team still endorse the first-order view? (Or is confidence undermined?) | Yes: Lower output by half the net HOE adjustment (akrasia rule). No: Use adjusted forecast directly.                        | Output final number.                                                          | Team consensus         |  
  | 8    | Is the output "unendorsable"? (e.g., no one believes it, but it’s logical)      | Describe tension (e.g., "We think 70% but publish 60%"). No procedural change—document and publish.                        | Publish with note.                                                            | Lead                   |  

  ---

  ### JSON Output  
  ```json
  {
    "steps": [
      "Verify if HOE was absorbed in first-order aggregation.",
      "List all claimed HOE (disagreements, track records, states, etc.).",
      "Convert HOE to first-order evidence if reasons are new/verifiable.",
      "Filter HOE: discard if domain-mismatched, surveyable, or adversarial cheap talk.",
      "Rate source reliability (Strong/Neutral/Weak) for each HOE item.",
      "Apply preset adjustments, discounting by reliability; average and cap net effect.",
      "If first-order view stands, halve the HOE adjustment; else use full adjustment.",
      "Document and publish if output conflicts with personal beliefs."
    ],
    "stop_rules": [
      "All HOE absorbed in first-order (Step 1 exit).",
      "No HOE claimed (Step 2 exit).",
      "All HOE discarded as irrelevant (Step 4 exit)."
    ],
    "judgment_calls": [
      {
        "question": "Is the HOE domain-relevant? (e.g., Does a bad macro record affect this bio forecast?)",
        "why_it_cant_be_proceduralized": "Domains lack bright lines; requires contextual knowledge of topic similarity."
      },
      {
        "question": "Is disagreement adversarial 'cheap talk'? (e.g., Is the source grandstanding with no stakes?)",
        "why_it_cant_be_proceduralized": "Requires assessing intent, which isn't falsifiable without behavioral history."
      },
      {
        "question": "Is reasoning 'fully surveyable'? (e.g., Can we check the 2am writer's math without their state mattering?)",
        "why_it_cant_be_proceduralized": "Depends on team's ability to audit; subjective if steps are qualitative."
      }
    ],
    "worked_cases": [
      {
        "case_id": "a",
        "verdict": "Lower forecast by 2.5–5% (e.g., 70% → 65–67.5%).",
        "uncomfortable": true,
        "one_sentence_rationale": "Worse-track-record disagreement is weak HOE: small adjustment after discounting, but still forces a change against team's intuition."
      },
      {
        "case_id": "b",
        "verdict": "Lower forecast by 15% (e.g., 80% → 65%).",
        "uncomfortable": true,
        "one_sentence_rationale": "Correlated evidence (same thread) is strong HOE: it reduces confidence without new first-order reasons, making the drop feel unearned."
      },
      {
        "case_id": "c",
        "verdict": "Lower forecast by 10–15% (e.g., 70% → 55–60%); may be unendorsed.",
        "uncomfortable": true,
        "one_sentence_rationale": "Expert disagreement is strong HOE even if unverifiable, forcing a large adjustment that feels wrong first-order."
      },
      {
        "case_id": "d",
        "verdict": "No change to forecast.",
        "uncomfortable": false,
        "one_sentence_rationale": "Reasoning is surveyable: team can check steps, so writer's state is irrelevant and discarded."
      }
    ],
    "known_failure_modes": [
      {
        "name": "HOE Laundering",
        "symptom": "Double-counting disagreement as both first-order evidence and independent HOE.",
        "what_the_procedure_does_about_it": "Step 3 forces conversion to first-order or pure HOE; cannot be both."
      },
      {
        "name": "Over-Adjustment",
        "symptom": "Letting weak HOE (e.g., one tired person) slash confidence too far.",
        "what_the_procedure_does_about_it": "Preset caps (±25%) and reliability discounts (Step 5); akrasia rule (Step 7) halves impact if beliefs hold."
      },
      {
        "name": "Under-Adjustment",
        "symptom": "Ignoring serious HOE (e.g., correlated biases) because it feels intangible.",
        "what_the_procedure_does_about_it": "Step 4 bans discarding valid HOE; Step 6 mandates preset adjustments."
      }
    ],
    "what_the_procedure_cannot_do": "Resolve deep epistemic akrasia (e.g., when the team feels the published number is 'wrong'). It outputs an actionable forecast, not philosophical coherence."
  }
  ```

  ### Predictable First-Run Problems  
  - **Adjustments feel arbitrary**: Preset rules (−10% per disagreement) will spark debate until calibrated to your team’s historical data.  
  - **Domain fights**: Leads will be pressured to define "domain similarity" broadly to avoid adjustments (e.g., "all forecasts require general reasoning, so my bad macro record matters!").  
  - **Akrasia aversion**: Teams might skip Step 7’s halving rule to avoid publishing "unendorsed" numbers, weakening the guard against overcorrection.  
  - **Adversarial HOE missed**: Cheap talk (e.g., a loud disagreer) might slip through if leads under-scrutinize motives in Step 4.  
  **Fix**: Pilot on past forecasts to tweak adjustments; document all judgments for review.
