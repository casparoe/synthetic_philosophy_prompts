answer: |-
  Here's a rigorous defense of al-Ghazālī's occasionalism against the "brute regularity" objection, emphasizing God's intentional policy as a robust explanatory framework:

  **1. Clarifying the Objection:**  
  Your friend argues that occasionalism reduces to Humeanism because the regularity of sequences (e.g., fire burning cotton) is either:  
  - *Brute*: An unexplained, contingent pattern.  
  - *Projected*: A psychological habit of expectation with no objective basis.  
  Adding God as a direct cause seems redundant if the pattern lacks intrinsic teleology or normativity.

  **2. The Core Response: Divine Policy as Teleological Normative Structure**  
  Occasionalism escapes this dilemma by grounding regularity in **God’s stable, content-specific voluntary policy** (*‘ādah*, Divine "Custom"). This is not a mere label but a distinct metaphysical category with explanatory power. Key features:

  - **Intentional Content**: God’s policy has a *propositional structure*: *"When condition C obtains (e.g., fire contacting dry cotton in oxygen), I will effect E (combustion)."* This is a divine *decision*, not a passive pattern.  
  - **Normativity**: The policy defines what *ought* to happen under C. Fire’s failure to burn (e.g., in a miracle) isn’t a "broken law" but a *divine exception* to the policy, highlighting its normative character.  
  - **Teleology**: The policy serves divine purposes (e.g., human survival, cosmic order). Fire burns cotton *so that* humans can cook, deter predators, etc. Brute regularities lack "for-the-sake-of" structure.  
  - **Stability by Will**: The regularity persists *because* God consistently wills the same policy, not because of necessity or abstraction. God could alter it (miracles prove this), but *chooses* constancy.

  **3. Explanatory Advantages Over Brute Regularity**  
  This framework explains *why* regularities exist and *how* they generate knowledge/reliability, which Humeanism cannot:  

  | **Explanatory Feature**       | **Humean Constant Conjunction** | **Divine Policy Occasionalism** |
  |-------------------------------|--------------------------------|----------------------------------|
  | **Source of Regularity**      | Unintentional, brute fact      | God’s intentional commitment    |
  | **Basis for Prediction**      | Psychological habit (subjective)| Divine fidelity (objective)      |
  | **Normativity**               | None – "is" without "ought"    | Built-in (policy defines correct outcomes) |
  | **Teleology**                 | Non-existent                   | Rooted in divine wisdom (*ḥikma*) |
  | **Explanatory Depth**         | Descriptive summary only       | Causal explanation via divine action |

  - **Reliability**: On Humeanism, the sun rising tomorrow is an unjustified inductive leap. For occasionalism, reliability stems from God’s *faithfulness* to His policy. We trust fire to burn because we trust God’s consistent character (per Qur’an 55:29, "Every day He is engaged in some work").  
  - **Counterfactuals**: "If fire touched cotton now, it would burn" is true *because* God’s current policy specifies this outcome. Humeanism can only cite past conjunctions.  
  - **Orderliness**: The cosmic order reflects divine wisdom, not chance. Fire burns cotton *because* God designed a coherent system for human flourishing. Brute regularity offers no "why" for coherence.  

  **4. Against the "Relabeling" Objection**  
  This is *not* merely rebranding constant conjunction because:  
  - **Divine Agency vs. Passive Pattern**: Constant conjunctions are *observed outcomes*. Divine policy is the *intentional cause* of those outcomes. The policy explains *why* conjunctions occur; conjunctions don’t explain the policy.  
  - **Internal Structure**: Policies have mental content (conditions, actions, goals). Conjunctions are content-free correlations. Saying "God causes B when A" is analogous to "A programmer outputs 'B' when input 'A' is received" – the latter references agency and rules, not mere sequence.  
  - **Idle Appendix Charge**: God isn’t redundant because He actively wills *each instance* (e.g., each burning event) *according to* His policy. The policy isn’t a summary; it’s the *blueprint for action*. Without God, there are no conjunctions to summarize.  

  **5. Why Fire and Cotton Remain Truly Causally Inert**  
  - Fire doesn’t "trigger" God’s action; it is merely the *occasion* (*munāsib*) God designated for burning. The conditions (fire, cotton) are passive "signs" (*āyāt*) of divine policy, not efficient causes.  
  - God’s policy explains the *entire* sequence: the existence of fire, the contact, and the burning are all discrete divine acts coordinated by His will.  

  **Conclusion**  
  Al-Ghazālī’s occasionalism escapes the "brute regularity" trap by anchoring cosmic order in God’s intentional, teleological policy. This provides:  
  - A **reason** for regularity (divine wisdom),  
  - A **basis** for knowledge (trust in God’s consistency),  
  - **Explanatory depth** (normative, counterfactual-supporting structure) – all absent in Humeanism.  
  The divine "custom" (*‘ādah*) is not a relabeled constant conjunction but a volitional framework that *grounds* the conjunction, rendering God’s role essential rather than idle. Your friend’s objection conflates *divine intention* with *human projection*, missing the objective normative structure God’s will provides.
