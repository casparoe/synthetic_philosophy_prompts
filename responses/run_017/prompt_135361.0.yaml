  #### **(a) Credence on waking [5 points]**  
  **Student's Answer:**  
  > *Simple halfer: 1/2. Within the heads branch there are two wakings, so H-Mon and H-Wed get 1/4 each; within the tails branch there are three, so T-Mon, T-Tue and T-Wed get 1/6 each. P(heads) = 1/4 + 1/4 = 1/2. The reason is that Beauty knew on Sunday that she would be woken at least once, so nothing she learns at a waking is relevant to the coin, and the chance of heads is 1/2.*  
  >  
  > *Thirder: 2/5. There are five centered possibilities she can't tell apart — H-Mon, H-Wed, T-Mon, T-Tue, T-Wed — so each gets 1/5, and P(heads) = 1/5 + 1/5 = 2/5. Frequency check: heads trials produce 2 wakings and tails trials 3, so per trial the expected number of heads-wakings is (1/2)(2) = 1 and the expected total number of wakings is (1/2)(2) + (1/2)(3) = 2.5, giving 1/2.5 = 2/5. Both views agree on all the uncentred facts: fair coin, protocol as described.*  

  **Feedback:**  
  - **Simple halfer (1/2): CORRECT.** Reasoning and calculation align with the definition: P(heads) = 1/2, with within-branch credences P(Monday | heads) = 1/2, P(Wednesday | heads) = 1/2 (equivalently, H-Mon and H-Wed each have 1/4 unconditional probability as stated).  
  - **Thirder (2/5): CORRECT.** Equal credence over indistinguishable centered worlds (5 wakings), so P(heads) = P(H-Mon) + P(H-Wed) = 1/5 + 1/5 = 2/5. Frequency justification is also valid.  
  - **No errors.** **Score: 5/5**  

