  #### **(b) Fair price for bets [7 points]**  
  **Student's Answer:**  
  > *Version 1: per trial she places 2.5 bets on average and is paid $1 at every heads-waking, and there is on average 1 heads-waking per trial, so 2.5x = 1 and x = 2/5. Version 2: she still places 2.5 bets per trial but collects only once, and only in heads trials, so expected collection is 1/2; 2.5x = 1/2 and x = 1/5. In the original case version 1 gives 1.5x = 0.5, x = 1/3, and version 2 gives the same 1.5x = 0.5, x = 1/3. They coincide there because in the original case a heads trial contains exactly one waking, so the expected number of heads-wakings per trial (1/2) equals the probability of heads (1/2). Here a heads trial contains two wakings, so the expected number of heads-wakings is 1, which is twice P(heads), and the two prices differ by a factor of two.*  
  >  
  > *So the fair price of a dollar-on-heads at a waking is 1/5, and since a credence in heads just is the fair price of a bet that pays $1 if heads lands, 1/5 is Beauty's credence: the 1/2 is the chance and the 2/5 is the frequency, and neither of them is her credence. This means the betting argument for thirding fails in this variant, since it delivers 1/5 rather than 2/5.*  

  **Feedback:**  
  - **Version 1 (pay $x per waking, paid $1 immediately if heads):**  
    - Student's calculation: **CORRECT.** Expected bets per trial = (1/2)(2) + (1/2)(3) = 2.5. Expected payout per trial = #heads-wakings = (1/2)(2) + (1/2)(0) = 1 (since tails-wakings get nothing). Fair price satisfies 2.5x = 1 → x = 2/5.  
  - **Version 2 (pay $x per waking, paid $1 at end if heads):**  
    - Student's calculation: **CORRECT.** Expected bets per trial = 2.5 (same as above). Expected payout per trial = P(heads) × $1 = 1/2. Fair price satisfies 2.5x = 1/2 → x = 1/5.  
  - **Explanation of why versions differ:** **CORRECT.** In original Sleeping Beauty:  
    - Heads: 1 waking, Tails: 2 wakings.  
    - Version 1: Expected bets = (1/2)(1) + (1/2)(2) = 1.5, expected payout = #heads-wakings = (1/2)(1) = 0.5 → x = 0.5 / 1.5 = 1/3.  
    - Version 2: Expected bets = 1.5, expected payout = P(heads) = 1/2 → x = (1/2) / 1.5 = 1/3.  
    - Here, Version 1 payout depends on #heads-wakings (1 per trial), while Version 2 depends on P(heads) (1/2). They differ because a heads trial has two wakings, so expected #heads-wakings (1) ≠ P(heads) (1/2).  
  - **Error in linking to credence:** **INCORRECT.**  
    - Student claims: "Fair price... is 1/5" and thus "1/5 is Beauty's credence". This misidentifies which bet defines credence.  
    - **Standard definition:** Credence in an event is the fair price for a bet that pays $1 if the event occurs, **with payment settled immediately** (i.e., Version 1). Version 2 is a different bet structure (deferred payout, multiple payments).  
    - Thus, Version 1’s fair price (2/5) **equals the thirder credence** (2/5), while Version 2’s price (1/5) is unrelated to credence.  
    - The betting argument for thirding **holds** here: Version 1 supports the thirder view. Student’s claim that it "delivers 1/5 rather than 2/5" confuses the bet types.  
