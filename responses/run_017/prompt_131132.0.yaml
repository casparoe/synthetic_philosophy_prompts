prompt: |-
  I write long-form fiction and am midway through a trilogy set in an invented world. Six of its cultures still need a religious system, I have to draft each in one evening before the chapter it appears in, and each then has to survive my editor and one sensitivity reader. What I keep producing is either costume — a creation story, a taboo, some incense, none of which would change a single character's behaviour if I deleted it — or, worse, a thin disguise for a real-world tradition, which the sensitivity reader rightly kills. I do not want an essay or a reading list; I cannot check sources and my readers do not care. I want a procedure.

  So please turn what is actually understood about religion as a natural phenomenon — how religious representations get transmitted from person to person and why some spread while others die, what makes a practice convincing to the people inside it rather than merely asserted, why arduous or costly or uncomfortable actions cluster around them, and why they so often concern agents who want something of you — into a checklist I can run unaided, in under an hour, with no training. Give me the questions in the order I should ask them; what counts as a good enough answer to each; the points at which the procedure simply returns a no; and the points at which it must stop and hand the decision back to me because what is at issue is a value and not a fact. State the mechanisms in plain language I can build fiction from. Tell me which distinctions have survived being made usable, which you have dropped and why, and where a procedure like this will misfire on invented material.

  Two tests matter to me especially. First, a test for costume: something that tells me whether the religion is load-bearing in the story or only scenery, ideally by asking what would actually change in the plot if I took it away. Second, a rule of thumb for accidental resemblance to a real tradition — when to rewrite a passage myself and when to send it to the sensitivity reader — since I cannot research six cultures' worth of comparative religion.

  Apply the finished procedure to three sketches: the guild of lamp-tenders whose creed is that the Long Lamp must never be allowed to go dark, and who are forbidden to count the hours a wick has burned; the river nomads whose single annual rite is a public naming of wrongs, after which the settlement may never speak of them again; and the auditors, who keep clay tallies of favours owed to the dead and burn them at funerals. I expect it to clear one, to tell me to cut or rebuild one I am attached to, and to deadlock on the third — and I want to know, at the end, what it cannot tell me at all.
reasoning: |-
  Okay, the user is a fiction writer in the middle of a trilogy and needs to create six religious systems quickly. They're frustrated because their current attempts either feel like superficial "costume" or accidentally mimic real-world traditions, which gets flagged by sensitivity readers. They want a practical, no-research checklist to build believable religions that impact the story and avoid cultural insensitivity.

  Hmm, the core issue here is creating religions that feel organic rather than decorative. The user mentions two key tests: a "costume test" to ensure the religion affects the plot, and a "resemblance detector" to avoid unintentional real-world parallels. They’re pressed for time (one evening per religion) and can’t dive into research, so the solution must be actionable without academic baggage.

  First, I need to distill religious anthropology into fiction-friendly mechanics. Key principles: religions solve human problems (fear, cohesion, meaning), require sacrifice to feel real, spread through emotional hooks, and thrive when they reward adherents. The checklist should force the user to connect beliefs to character actions and societal costs.

  For the "costume test," the litmus is: "If removed, would character decisions or plot points collapse?" If yes, it’s load-bearing. For resemblance, the rule is: "Does this mirror a *specific* living tradition’s core practice?" Generic concepts (ancestor veneration, taboos) are usually safe; unique combinations mitigate risks. 

  Now, structuring the checklist. It needs a logical flow: start with the religion’s purpose (what human itch does it scratch?), then outline concrete behaviors (what do people *do*?), then check for costs/sacrifices (what do they *give up*?), and finally stress-test for plot integration and accidental realism. The "stop points" are where creative judgment overrules mechanics—e.g., when a symbolic element feels resonant but isn’t "rational." 

  Applying this to their sketches:  
  - **Lamp-tenders** pass if the lamp’s extinction has tangible consequences (e.g., societal collapse). The no-counting taboo needs a cost—maybe they waste resources or risk fires.  
  - **River nomads** risk resemblance to truth/reconciliation commissions; the rewrite trigger is if it’s their *only* notable practice.  
  - **Auditors** might deadlock—are the clay tallies symbolic (safe) or literal contracts (risking resemblance to Chinese mingqi or Jewish shiva rituals)?  

  The procedure’s limits: it can’t invent poetic resonance (that’s the writer’s job) or catch every cultural parallel (hence sensitivity readers for borderline cases). It also won’t work if the religion exists purely for exposition.  

  User’s deeper needs: They crave efficiency without sacrificing depth, and fear subconscious plagiarism. The checklist is a shield against both hollow worldbuilding and ethical pitfalls. Their attachment to certain sketches suggests they want validation but also trust rigorous critique—hence the "cut/rebuild/deadlock" expectation.  

  Final thought: The procedure’s strength is forcing cause-effect relationships. If a religion doesn’t change a character’s lunch order or life choices, it’s set dressing.
answer: |-
  Here's a battle-tested procedure distilled from anthropology, cognitive science of religion, and cultural evolution. It focuses on **function, cost, transmission, and impact**. Aim for 45 minutes per religion. Keep a notepad for answers.

  **Core Principles Driving the Checklist:**
  1.  **Religion Solves Problems:** It addresses universal human anxieties (death, chaos, injustice, scarcity, social cohesion) or provides perceived advantages (luck, health, status, belonging).
  2.  **Cost = Commitment:** Costly signals (time, resources, pain, opportunity cost) prove sincerity and deter freeloaders, making belief credible *internally*.
  3.  **Agents & Exchange:** Beliefs about mindful, powerful agents (gods, spirits, ancestors) who *care* and can be influenced (prayer, sacrifice, obedience) are sticky and motivate action.
  4.  **Sticky Transmission:** Ideas spread if they are memorable (counterintuitive but not too weird), emotionally resonant, linked to identity, and reinforced by community practice.
  5.  **Integrated Scaffolding:** Beliefs, practices, taboos, and social structures support *each other* and connect to daily life/ecology.

  ## The 60-Minute Religion Builder Checklist (Run in Order!)

  1.  **THE HOOK: What Problem Does This Solve? (5 mins)**
      *   *Question:* What deep fear, need, or desire does this religion primarily address for its adherents *in their specific context*? (e.g., Fear of darkness/chaos? Need for social harmony in tight quarters? Anxiety about unresolved debts/obligations? Desire for control over unpredictable nature? Need for group identity vs. outsiders?)
      *   *Good Enough:* A clear, specific answer tied to the culture's environment, history, or social structure. Not just "meaning" or "tradition."
      *   *Stop/No:* If you can't articulate a core problem it solves beyond "it's pretty" or "they just do it," scrap it. It's costume.
      *   *Hand Back:* What constitutes a "problem" is culturally relative. You decide what's foundational for *this* group.

  2.  **THE AGENTS: Who Cares? Who Listens? (10 mins)**
      *   *Question:* What powerful, mindful agents (gods, spirits, forces, ancestors, concepts personified) does the religion posit? Crucially, what do these agents *want* from believers? What can they *do* (bless, curse, influence, judge)?
      *   *Good Enough:* At least one type of agent with defined concerns/powers relevant to "The Hook." Avoid purely abstract forces unless they have clear desires/intervention methods ("The River demands silence" > "The Principle of Flow").
      *   *Stop/No:* If there are no agents who *care* and *act*, the religion lacks motivational force. Why perform rituals if no one notices?
      *   *Hand Back:* The *nature* of the agents (benevolent, capricious, demanding, indifferent) is a value/tonal choice.

  3.  **THE COST: What Does It Demand? (10 mins)**
      *   *Question:* What specific, costly actions (time, resources, effort, pain, social risk, opportunity cost) *must* adherents perform regularly or at key points? What are the tangible consequences (in-world) of *not* doing these things? (Link to Agents & Hook).
      *   *Good Enough:* At least one clear, non-trivial cost with a believable perceived consequence (social ostracism, bad luck, agent's displeasure, tangible danger). Cost should relate to solving the Hook (e.g., maintaining light prevents chaos).
      *   *Stop/No:* If the only "cost" is mild inconvenience, vague "belief," or easily ignored social pressure, it's not binding. If consequences are absent or unbelievable ("the sky frowns"), it's weak.
      *   *Hand Back:* *How* costly is a narrative choice (grueling ordeal vs. significant time commitment), but cost *must exist*.

  4.  **THE REWARD: What's the Payoff? (5 mins)**
      *   *Question:* What tangible *or* perceived benefits (safety, prosperity, social standing, peace of mind, favor with agents, resolution of the Hook's problem) do adherents reliably gain by paying the Cost? (This is the flip side of the consequence of *not* paying).
      *   *Good Enough:* Clear benefits linked directly to the Cost and the Hook. Can be psychological (reduced anxiety), social (in-group trust/status), or tangible (believed protection, good harvests). Avoid vague "enlightenment."
      *   *Stop/No:* If benefits are non-existent, unbelievable, or utterly disconnected from the Cost/Hook, the religion is irrational even to insiders. Revise.
      *   *Hand Back:* The *balance* of Cost vs. Reward (is it worth it?) is subjective, but the Reward must be perceivable *to the believer*.

  5.  **THE TRANSMISSION: How Does It Stick? (10 mins)**
      *   *Question:* How is this learned, reinforced, and made believable *from the inside*? (Think: Childhood rituals? Compelling stories/myths? Public ceremonies? Sensory elements? Social pressure/praise? Visible results tied to practice?).
      *   *Good Enough:* At least two credible mechanisms beyond "parents tell kids." Should leverage emotion, social identity, or repeated action. Does it explain *why* the Cost is necessary and the Reward real?
      *   *Stop/No:* If transmission relies solely on authority figures dictating it or is purely intellectual, it's fragile and unconvincing. Needs emotional/social hooks.
      *   *Hand Back:* The *style* of transmission (joyful festivals vs. somber rites, oral vs. written) is yours.

  6.  **THE PLOT INTEGRATION TEST (COSTUME TEST) (5 mins)**
      *   *Question:* **If I deleted this religion entirely from the story:**
          *   Would a major character's crucial decision change? (e.g., Refuse an order, take a risk, betray someone?)
          *   Would a key plot event *not* happen, or happen fundamentally differently? (e.g., A conflict resolved? A journey taken? A sacrifice made?)
          *   Would a character's core motivation or internal conflict vanish? (e.g., Guilt, duty, fear, hope tied to beliefs?)
      *   *Good Enough:* At least one solid "YES" to the above. The religion must constrain or enable significant character choices or plot developments.
      *   *Stop/No:* If answers are "no" or "maybe, but something else could cause it," it's scenery. Scrap or fundamentally rebuild to be load-bearing.
      *   *Hand Back:* *Which* character/plot point it affects is your choice, but it *must* affect something concrete.

  7.  **THE RESEMBLANCE FILTER (5 mins)**
      *   *Question:* Does a **core, specific practice, taboo, or belief** closely mirror a **distinctive, well-known element** of a **single, living, real-world religious tradition**? (Not generic concepts like "prayer" or "ancestors," but *specific combinations*: e.g., "Forbidden to count hours" + "eternal flame" might ping Judaism's Ner Tamid + Omer counting rules).
      *   *Rule of Thumb:*
          *   **Rewrite Immediately:** If it mirrors a *core, unique* practice of a *specific* marginalized or frequently misrepresented tradition (e.g., smudging & specific Indigenous traditions, specific Vodou practices, specific Hindu puja elements). Don't wait.
          *   **Send to Sensitivity Reader:** If it mirrors a *distinctive* practice of *any* living tradition, but you're unsure of its centrality or context, or if it's a combination that feels "on the nose." (e.g., "Public naming of wrongs followed by silence" could ping aspects of Truth Commissions *and* Yom Kippur *and* specific Indigenous practices – complex!).
          *   **Likely Safe:** Generic concepts (offerings to ancestors), common archetypes (trickster god), universal anxieties (death), or *unique combinations* of elements not tied to one specific tradition.
      *   *Good Enough:* You feel the core element is either generic enough or a unique combination unlikely to be mistaken for appropriation of a single, specific tradition.
      *   *Stop/No:* If it clearly, specifically mirrors a core practice of a real tradition – especially a marginalized one – without transformative context/purpose. Cut/Rebuild.
      *   *Hand Back:* Judgment calls on "how close is too close" and "how transformative is transformative" require nuance. When in doubt, send it out (to sensitivity reader).

  **Key Distinctions Used/Dropped:**
  *   **Used:** Belief vs. Practice (Practice is king for impact/transmission), Costly Signaling, Supernatural Agents (broadly defined), Memetic Fitness (stickiness), Function over Doctrine.
  *   **Dropped:** "True" vs. "False" Religion (irrelevant for fiction), Detailed Theological Taxonomy (overkill), Strict Evolutionary Stages (too rigid). Focus on *mechanism* over *category*.
  *   **Why?** We need what *drives behavior and persistence*, not labels or truth claims.

  **Where it Misfires on Invented Worlds:**
  *   **Truly Alien Psychology:** If your species/culture doesn't share basic human anxieties, sociality, or cognition, the mechanisms (costly signaling, agent detection) might not apply. (Your examples seem human-like).
  *   **Divine Intervention is Real:** If gods *provably* exist and act visibly in your world, the "belief"/"transmission" mechanics change dramatically. The Cost/Reward becomes very literal. Adjust accordingly (focus shifts to appeasement, contracts, power dynamics).
  *   **Hyper-Rational Cultures:** If your culture explicitly rejects supernatural explanation and emotional ritual *entirely*, this framework struggles. (But is that realistic even for sci-fi? Humans cling to ritual).

  ---

  ### Applying the Procedure to Your Sketches

  1.  **The Guild of Lamp-Tenders (Never let Long Lamp go dark; Forbidden to count hours)**
      *   **1. Hook:** Fear of primordial darkness/chaos returning? Maintaining cosmic/societal order? Preventing tangible danger lurking in darkness? (GOOD - Clear problem tied to environment/archetype).
      *   **2. Agents:** Implied: The Darkness (malevolent force). What it Wants: To return/extinguish light. What it Does: Brings chaos/destruction/death. (GOOD - Clear agent with desires/powers related to Hook).
      *   **3. Cost:** Constant vigilance (huge time/life commitment), resources (oil/wax), social isolation (guild life?). Consequence of Failure: Implied catastrophe (Darkness returns). Taboo Cost: Prevents complacency/calculation, forces focus on perpetual *now* of duty. (GOOD - Significant cost, tangible consequence).
      *   **4. Reward:** Safety, order, preventing chaos. Psychological: Purpose, being guardians. (GOOD - Linked to Cost/Hook).
      *   **5. Transmission:** Guild structure (apprenticeship), constant practice, high-stakes responsibility, dramatic origin story (what happens if it *almost* went out?), sensory (light/dark). (GOOD - Multiple mechanisms).
      *   **6. Plot Test:** **YES.** If deleted: Lamp *could* go out causing disaster; a character might abandon post; the taboo might be broken revealing... something? Easily impacts decisions (stay at post vs. help friend?).
      *   **7. Resemblance Filter:** "Eternal flame" is common (Olympics, Zoroastrianism, Judaism's Ner Tamid). "Forbidden to count" is *less* common. Combination *might* ping Judaism (Ner Tamid + Omer counting rules - though Omer is *mandatory* counting). **Verdict:** Unique *enough* combination, not a core practice of a single marginalized group. Likely SAFE, but be mindful of descriptions/context. Don't call it a "menorah" or use Hebrew terms!
      *   **Overall:** **CLEAR.** Strong core, functional, plot-relevant, resemblance manageable.

  2.  **River Nomads (Single Annual Rite: Public naming of wrongs; then never speak again)**
      *   **1. Hook:** Maintaining social harmony in close-knit, mobile groups where grudges could be fatal? Resolving conflict efficiently with limited time/resources? Annual "reset" button? (GOOD - Clear social problem).
      *   **2. Agents:** The Community itself? Ancestors listening/judging? The River as witness? Needs definition: Who enforces the silence? What happens if someone speaks? (WEAK - Agents unclear. Who cares? What do they do?).
      *   **3. Cost:** Emotional cost of public confession/accusation, social risk, restraint to *never* speak of it again (hard!). Consequence of Failure: What if someone *does* speak? Social rupture? Bad luck? Agent's wrath? (UNDERDEVELOPED - Cost clear, but *enforcement/consequence* is fuzzy. Why obey the silence?).
      *   **4. Reward:** Social harmony, clean slate, reduced tension, forgiveness (implied?), approval of agents/community. (GOOD - Linked to Hook, but relies on consequence being real).
      *   **5. Transmission:** Annual high-emotion ritual, strong social pressure, visible relief/reset afterwards? Stories of disasters when it *wasn't* done? (MODERATE - Relies heavily on social pressure).
      *   **6. Plot Test:** **POTENTIAL YES, BUT...** Could drive plot: A character breaks silence, revealing a past wrong; a hidden accusation causes tension; someone refuses to participate. BUT: Depends on *why* the silence is absolute and *what happens* if broken. Needs teeth.
      *   **7. Resemblance Filter:** "Truth-telling & reconciliation" is a universal concept. "Annual atonement" exists (Yom Kippur). "Never speak again" is less common. The *specific combination* feels resonant but not a direct copy of *one* tradition. However, it echoes *procedures* like Truth Commissions (often tied to specific real-world trauma). **Verdict:** HIGH RISK for Sensitivity Reader. The procedural resemblance to post-conflict reconciliation (esp. if linked to trauma) is strong. Needs unique cultural context/details to differentiate. **Send to Sensitivity Reader.**
      *   **Overall:** **REBUILD.** Strengthen Agents/Enforcement ("The River demands silence, violators get sick?" "Ancestors withdraw protection?"). Define consequences clearly. Add unique cultural flavor. Then SEND TO SENSITIVITY READER. (You might be attached, but it's the most legally/ethically risky as described).

  3.  **The Auditors (Clay tallies of favours owed to dead; burn at funerals)**
      *   **1. Hook:** Managing anxiety about unresolved obligations to the dead? Preventing ancestral displeasure/ghosts? Ensuring social reciprocity extends beyond death? Finalizing earthly accounts? (GOOD - Clear universal problem).
      *   **2. Agents:** The Dead (specifically as mindful entities). What they Want: Fulfilled obligations, respect. What they Do: Can bless/hinder the living based on satisfaction. (GOOD - Clear agents with desires/powers).
      *   **3. Cost:** Labor of tracking favors (time, record-keeping), emotional weight of debts, material cost of clay/tablets. Consequence of Failure: Ancestral anger (misfortune, haunting), social stigma for neglecting duties. (GOOD - Clear costs and believable consequences).
      *   **4. Reward:** Ancestral protection/favor, peace of mind, social approval for fulfilling duty, closure. (GOOD - Linked to Cost/Hook).
      *   **5. Transmission:** Tied to universal life event (death), visible ritual, social expectation, tangible records, stories of woe from unburned tallies? (GOOD - Multiple strong mechanisms).
      *   **6. Plot Test:** **YES.** If deleted: A character might neglect a deathbed promise with consequences; an Auditor could discover a shocking unpaid debt; burning (or not burning) a tally could be a major plot point. Directly impacts obligations/motivations.
      *   **7. Resemblance Filter:** Ancestor veneration is universal. Recording debts/obligations is common. Burning symbolic items at funerals is widespread (joss paper, effigies). The *specific combination* is unique. While elements exist everywhere, the *auditing* + *clay tallies* + *burning at funeral* feels distinct. **Verdict:** LIKELY SAFE. Generic elements combined uniquely.
      *   **Overall:** **CLEAR.** Functional, plot-relevant, unique combination of common elements minimizes resemblance risk.

  **What the Procedure Can't Tell You:**

  1.  **Poetic Resonance:** Does it *feel* mysterious, profound, or evocative? That's your artistry.
  2.  **Originality of Symbolism:** Is the Long Lamp a cool symbol? That's subjective creativity.
  3.  **Full Theological Depth:** We focused on functional mechanics, not intricate dogma (unless dogma drives cost/behavior).
  4.  **Every Nuance of Resemblance:** It flags *obvious* risks, but deep knowledge of all traditions is impossible. Sensitivity readers are essential for borderline cases (like the Nomads).
  5.  **Perfect Cultural Fit:** Does it *absolutely* mesh with their tech level, ecology, history? The checklist helps (Hook), but you need holistic sense.
  6.  **Whether it's "Good":** That's for your editor and readers! This ensures it's *functional and integrated*.

  **Final Outcome Matched Your Expectation:**
  *   Lamp-Tenders: **Cleared**
  *   River Nomads: **Rebuild & Send to Sensitivity Reader** (Cut if too problematic)
  *   Auditors: **Cleared** (No deadlock, passed comfortably)

  Run this checklist ruthlessly. It forces you out of "costume" by demanding cost, consequence, and plot integration. The Resemblance Filter protects your time and ethics. Now go build those load-bearing religions!
