answer: |-
  Here’s your prep sheet, ranked by damage potential (1 = most dangerous). I’ve focused on objections this group will *actually* raise, phrased in their dialects, with tight replies and unvarnished weakness assessments. The ranking reflects both conceptual bite and how likely they are to derail your core thesis.

  ---

  ### **Top 6 Objections & Replies**  
  **Ranked by Damage Potential**  

  1.  **Metaphysicians' Challenge (Sparse Relata Camp):**  
      *Phrasing:* "Your entire account presupposes omissions *can* be causal relata. But omissions are absences—non-events. They lack the ontological robustness to stand in causal relations. Your 'normal/default' heuristic might explain *ascriptions* of responsibility, but you’re conflating explanatory practices with causal metaphysics. Causation requires positive events; absences can’t 'do' anything."  
      *Reply (2-min):* "I’m not committed to omissions *being* causes in a sparse ontology. My claim is that *in the law’s practical reasoning*, causal judgments about omissions track norm-default expectations, not metaphysical causation. The lifeguard case shows this: we say the guard’s omission 'caused' the death *because* swimming out was her role-default. The metaphysician might call this 'quasi-causal'—but for liability purposes, it’s what the duty doctrine is distorting, not tracking."  
      *Soft Spot:* This concedes your thesis is descriptive (how lawyers *talk* causation) not metaphysical. If pressed, you lose the "causal judgments" label. *Damage Control:* Pivot to "explanatory relevance" or "difference-making in counterfactual reasoning."  

  2.  **Legal Doctrine Challenge (Causation Purist):**  
      *Phrasing:* "Duty *is* a causal filter. *Pitwood* (1902) and Model Penal Code §2.01(3)(b) tie omission liability to duties precisely to limit causation: if there’s no duty, the omission isn’t a but-for cause because the act wasn’t *expected*. Your 'normal/default' is just a restatement of the duty requirement—you’re renaming, not replacing."  
      *Reply (2-min):* "Duty is a *proxy* for normalcy, not causation. The sunbather *not* acting isn’t a but-for cause? If she’d swum out, the victim lives—so it *is* counterfactually dependent. Yet we deny causation because swimming isn’t her *role-default*. Duty formalizes this, but mistakenly elevates it to a causal necessity. *Pitwood*’s gatekeeper breached his *role-normal* action (closing the gate), not a freestanding 'duty' independent of context."  
      *Soft Spot:* If duties *define* roles (e.g., lifeguard contracts), your distinction collapses. *Damage Control:* Stress that roles exist socially/pre-legally (e.g., parents).  

  3.  **Normative Objection (Anti-Reductionist):**  
      *Phrasing:* "You’re smuggling normativity into causation. The 'normal/default' isn’t causal—it’s *prescriptive*. We hold the lifeguard liable because she *should have* acted, not because her inaction 'caused' anything. Your view conflates causation with culpability."  
      *Reply (2-min):* "I agree normativity enters—but via the *heuristic* for causal attribution, not culpability. In the lifeguard/sunbather pair, both inactions are but-for causes. We *attribute* causation to the lifeguard because her role makes swimming the default. Culpability comes later (did she have an excuse?). Duty distills this heuristic into a liability rule, but it’s secondary."  
      *Soft Spot:* If causation is purely descriptive, "normal" might still be normative. *Damage Control:* Cite empirical work on causal judgment (e.g., Hitchcock/Knobe) showing role expectations drive intuitions.  

  4.  **Meta-Omissions as Explanatorily Vacuous:**  
      *Phrasing:* "Your 'meta-omission' is a distraction. If failing to set an alarm causes harm via later inaction, it’s just a *first-order* omission (not acting *at t1* to secure future action). Calling it 'second-order' adds no explanatory value—it’s still a but-for cause."  
      *Reply (2-min):* "Negligence cases like *People v. Decina* (1956) show the difference. An epileptic driver who didn’t take meds (meta-omission) *causes* the crash via seizure (event). The meta-omission is the *explanatory* cause (why he couldn’t drive safely), but the *difference-making* cause is the seizure. Duty-centric accounts conflate these, missing why we hold him liable for the *crash*, not just not-taking-pills."  
      *Soft Spot:* If the seizure is an intervening cause, meta-omissions might not explain the harm directly. *Damage Control:* Argue meta-omissions create risk *structures*.  

  5.  **Prior Fault Redux:**  
      *Phrasing:* "Aren’t 'meta-omissions' just the culpable incapacity doctrine? If you negligently put yourself in a position where you *can’t* act (e.g., drunk surgeon), liability attaches for the prior fault. No need for new ontology."  
      *Reply (2-min):* "Prior fault focuses on *culpability* at t1. Meta-omissions highlight *structural* explanations: the harm occurs because you didn’t arrange a safety net. In *Decina*, the meta-omission explains *why* he drove impaired—not just that he was culpable earlier. This matters for complicity: if Alice omits to stop Bob’s crime, was it a first-order or meta-omission (did she fail to set up controls?)?"  
      *Soft Spot:* Doctrinally, prior fault *does* cover this. *Damage Control:* Emphasize the explanatory payoff for complex cases (e.g., corporate liability).  

  6.  **Default Actions are Underdefined:**  
      *Phrasing:* "Your 'normal/default' is fatally vague. Is a doctor’s 'default' to treat *any* collapsed person? Only her patients? What if norms conflict? Duty provides bright lines; your heuristic invites arbitrariness."  
      *Reply (2-min):* "Duty’s 'bright lines' are illusory—courts constantly debate duty scope (e.g., *Tarasoff*). Normalcy is role-contextual and socially anchored (lifeguard: yes; sunbather: no). For doctors, ER physicians have broader defaults than off-duty dermatologists. We already use this in omissions (e.g., parental duties vs. strangers)—I’m just making it explicit."  
      *Soft Spot:* Borderline cases (e.g., part-time lifeguards) *will* be messy. *Damage Control:* Argue that duty doctrines *codify* these norms imperfectly.  

  ---

  ### **Strategic Concessions & Dreaded Questions**  
  - **Concede Upfront:** "I concede that on some metaphysical views, omissions *can’t* be causes. My claim isn’t about fundamental ontology—it’s about how causal *ascriptions* function in legal reasoning, and why 'duty' is a poor proxy for them."  
    *Why:* Preempts the metaphysicians, isolates the argument to jurisprudential practice.  

  - **Dreaded Question (You Nailed It):**  
    *Phrasing:* "Isn’t your 'meta-omission' just a rebranding of the prior-fault or culpable-incapacity doctrine? Why invent new terms for old wine?"  
    *Why It’s Bad:* If the room agrees, your innovation seems cosmetic. Judges especially hate "new jargon for old concepts."  
    *Reply:* "Prior fault asks *when* we’re blameworthy. Meta-omissions reveal *how* the causal chain works: the harm occurs because you left yourself no capacity to act, making it the *explanatory* cause. This reframes cases like *Santillan* (surgeon omitting to check for sponge counts) where the meta-omission *is* the negligence."  
    *But:* Have a 1-sentence fallback: "If you prefer 'structured prior fault,' the key is seeing that it’s not *just* about timing—it’s about causal architecture."  

  ---

  ### **Final Notes**  
  - **FOLD On:** Metaphysical causation. Don’t hedge—concede it’s not your battleground.  
  - **FIGHT For:** The lifeguard/sunbather asymmetry as proof that duty isn’t causal. It’s your strongest intuition pump.  
  - **Hope Nobody Asks:** "If normalcy drives causal judgments, why do we still need *duty* at all?" (This forces you to defend legal reform, not just diagnosis.)  

  **Ranking Rationale:** The metaphysicians (#1) threaten your foundation; doctrinal purists (#2) attack your core thesis. Normative critics (#3) are loud but manageable. Meta-omission objections (#4-6) are niche—damaging if they stick, but likely only 1-2 people will care. Prioritize #1-3 prep. Good luck!
