          - External consequences (punishment, reward, legal, divine, societal collapse)
          - Wages of justice (that being just pays off in the long run in this life, e.g., leads to success, happiness, etc.).
     - If found: **Mark as Hard no (fails)**. Stop here.
     - If not found: Go to step 2.

  2. **If the paper is addressing the professor's variant (with the ring that leaves no trace), check for variant forbidden moves:**
     - Look for any mention of:
          - Memory of the act (remembering what you did)
          - Habit formation or character change (becoming a worse person)
          - Changes in desires or future wants
          - Guilt, remorse, or shame (after the act)
          - Loss of integrity or self-respect (after the act)
          - Any internal state that is a trace of the act (after the act).
     - If found: **Mark as Hard no (fails)**. Stop here.
     - If not found: Go to step 3.
     - If the paper is for the original challenge (without the no-trace condition), skip this step and go to step 3.

  3. **Check that the ring scenario is addressed and a reason is given:**
     - Does the paper clearly discuss the scenario of having the ring and give a reason to be just anyway?
     - If the paper does not discuss the ring scenario or gives no reason (or says there is no reason): **Mark as Hard no (fails)**. Stop here.
     - If it does: Go to step 4.

  4. **Check if the paper rejects the challenge:**
     - Does the paper argue that the ring scenario is impossible, or that the terms of the challenge are flawed (e.g., because of the nature of the self, justice, etc.)?
     - If yes: **Mark for professor's review**. Stop here. (Because this requires philosophical judgment.)
     - If not: Go to step 5.

  5. **Check that the paper addresses self-interest:**
     - Does the paper claim that being just in the ring scenario is in the agent's own self-interest (or well-being, or happiness)? Look for words like "better off", "good for you", "in your interest", "makes you happier", etc.
     - If not: **Mark as Hard no (fails)**. Stop here.
     - If yes: Go to step 6.

  6. **Pass the paper.**
     - The paper has passed all checks. It answers the challenge.

  **What the procedure cannot do:**
  - It cannot evaluate the quality of the argument (e.g., validity, soundness). That's for the professor when it matters.
  - It cannot catch subtle philosophical moves that might be valid but are not explicitly covered by the checks (e.g., a sophisticated rejection of the challenge that isn't obvious). That's why step 4 hands such papers to the professor.
  - It might pass a paper that gives a reason that is not forbidden but is weak or nonsensical. We are only checking for whether it answers the challenge, not whether the answer is good.
  - It relies on the TA being able to identify key words and concepts, which might be missed if the student uses synonyms or complex language.

  **Running the example papers:**

  Assume the papers are for the professor's variant (since the professor has been using it for two years).

  Example 1: "In a world where everyone had a ring we'd all be worse off, so we agree to be just, and I keep my agreement even with the ring on."
     - Step 1: It doesn't explicitly mention reputation, consequences, or wages? But the reason for the agreement is to avoid societal collapse, which is a consequence. However, the paper doesn't say that. It just says "I keep my agreement". So we have to see if the reason is given. If the paper doesn't give a reason beyond the agreement, then step 5: it must claim that keeping the agreement is in the agent's self-interest. If it doesn't, step 5 fails. If it does, then we need to see if the reason is forbidden. But the paper doesn't provide a reason? Then step 3 might fail? Step 3 requires a reason. The reason is implied? We'll assume the paper doesn't provide a reason beyond "because I agreed". So step 3: it gives a reason? Yes, the agreement. Step 5: does it claim it's in the agent's self-interest? Not explicitly. So step 5: hard no.

     Alternatively, if the paper says, "I keep the agreement because it's in my interest to have a stable society", that's a consequence (forbidden in step 1). Hard no at step 1.

     So either way, hard no.

  Example 2: "The self is constituted by its choices, so there's no me left over who'd get to enjoy the loot — the person who comes out of the ring just is someone else."
     - Step 1: No forbidden moves? Pass.
     - Step 2 (variant): It doesn't mention memory, habit, etc.? But it says the self is changed by the choices, which the variant forbids? The variant says no change in what you later want, no habit, etc. So the paper is saying the ring does change you (the self) which the variant says it doesn't. Therefore, the paper is rejecting the variant's possibility. 
     - Step 4: Rejects the challenge -> hand to professor.

  Example 3: "You'd have to live with yourself afterwards, you'd know what you'd done, and that knowledge would eat you alive, so you're still worse off."
     - Step 1: No reputation, consequences, or wages? It uses internal consequences, but they are not forbidden in step 1 (step 1 is only external). Pass.
     - Step 2 (variant): It mentions "afterwards", "know what you'd done", "live with yourself" -> these are memory and guilt, which are forbidden. Hard no.

  Therefore, for the variant, example 3 is caught at step 2.

  For the original challenge, if a student wrote example 3, it would pass the procedure? But the professor might think it's a dodge. However, in the original challenge, it is allowed. So the procedure for the original would pass it.

  **Is the variant rigged?**
  The variant blocks the three families but leaves open the possibility of immediate experiences (during the act) as a reason. So it is not rigged — an answer is possible.

  **Final note to the professor:**
  The procedure is designed to be as objective as possible, but steps 1 and 2 rely on the TA recognizing the forbidden concepts. You might want to provide a list of synonyms and examples. Also, step 4 (rejection) and step 5 (self-interest) might require some TA judgment, but we've tried to make it based on explicit claims. The procedure will catch the most common dodges and allow you to focus on the borderline cases.
answer: |-
  Below is a step-by-step procedure for your TAs to evaluate whether a student paper answers Glaucon's challenge (or your variant) without falling into forbidden responses. The procedure focuses **only** on whether the paper addresses the core challenge—not on argument quality. It's designed for non-philosophers, using simple, binary checks based on explicit content (no need to recognize reductios or internal reasons). Steps that rely on a TA's intuition (the "gut in a flowchart costume") are flagged honestly.

  ### Procedure for TAs: "Does this paper answer Glaucon?"
  **Run these steps in order.** For each paper, TAs must first confirm which version of the ring the student is addressing (original or your variant). This should be clear from the assignment instructions or the paper's text. If unsure, TAs should note it and proceed cautiously.

  ---

  #### **Step 1: Check for Original Forbidden Moves (Glaucon's Basics)**
  - **What to check:** Scan for any reliance on **reputation, external consequences, or long-term self-interest** (the "wages of justice").  
    - *Reputation:* References to being seen, caught, judged, or gaining/losing social status.  
    - *External consequences:* References to punishment, rewards, laws, divine judgment, afterlife, or societal collapse.  
    - *Wages of justice:* Claims that justice "pays off" in the long run (e.g., "you’ll be happier in the end" or "justice leads to success").  
  - **Pass:** None of these appear. → Proceed to Step 2.  
  - **Hard no:** Any explicit use (e.g., "You’ll get caught," "God will punish you," "Justice brings happiness later"). → **Mark as "Fails." Stop here.**  
  - **Hand to professor:** If the reference is ambiguous (e.g., "justice benefits society" without specifying why the *individual* should care).  
  - *Gut check?* Minimal. Requires only spotting keywords/phrases (e.g., "caught," "punished," "heaven," "success").

  #### **Step 2: If Addressing the Professor’s Variant, Check for Variant Forbidden Moves**
  - **What to check (only for your variant):** Scan for any reliance on **internal traces**—changes to the self that persist *after* using the ring.  
    - *Forbidden:* Memory, guilt, shame, pride, habit formation, changed desires, loss of integrity, or altered self-knowledge (e.g., "you’ll remember," "you’ll feel guilty," "you’ll become corrupt," "you’d lose your integrity").  
  - **Pass:** None of these appear. → Proceed to Step 3.  
  - **Hard no:** Any explicit use (e.g., "You’d have to live with yourself," "You’d become a bad person"). → **Mark as "Fails." Stop here.**  
  - **Hand to professor:** If unclear whether the paper references "during-act" feelings (e.g., "injustice feels bad *while* doing it") vs. "after-traces" (e.g., "you’ll feel guilty *later*").  
  - *Gut check?* Low. Keywords (e.g., "guilt," "habit," "integrity") are straightforward, but distinguishing "during" vs. "after" feelings may require slight judgment.

  #### **Step 3: Confirm the Ring Scenario is Addressed**
  - **What to check:** Does the paper explicitly engage with the ring scenario (invisibility for Glaucon; invisibility + no-trace for your variant) and provide a reason to be just *in that scenario*?  
    - *Pass:* Clearly states a reason applicable *with* the ring (e.g., "Even with the ring, you should be just because..."). → Proceed to Step 4.  
    - **Hard no:** Ignores the ring (e.g., discusses real-world justice) or concludes "there’s no reason to be just with the ring." → **Mark as "Fails." Stop here.**  
    - **Hand to professor:** If the ring is mentioned but the reason is vague or implied.  
  - *Gut check?* Minimal. Checks for explicit acknowledgment of the scenario.

  #### **Step 4: Check for Challenge Rejection or Redefinition**
  - **What to check:** Does the paper reject Glaucon’s framing (e.g., calls the scenario impossible, incoherent, or based on false assumptions)?  
    - *Pass:* No rejection. → Proceed to Step 5.  
    - **Hand to professor:** Any rejection (e.g., "The ring is unrealistic," "Glaucon misunderstands the self," "Justice isn’t about self-interest"). → **Mark for review.**  
  - *Gut check?* Moderate. Requires recognizing if the paper is contesting the setup (keywords: "impossible," "flawed," "misleading"), but not evaluating its validity.

  #### **Step 5: Verify the Answer Targets Self-Interest**
  - **What to check:** Does the paper claim that being just with the ring is in the *individual’s self-interest* (e.g., for their own well-being, happiness, or advantage)?  
    - *Pass:* Explicitly ties justice to the agent’s self-interest (e.g., "Being just benefits *you* because..."). → **Mark as "Passes."**  
    - **Hard no:** Focuses only on others/society (e.g., "Justice helps society," "It’s your duty") without linking to self-interest. → **Mark as "Fails." Stop here.**  
  - *Gut check?* Low to moderate. Requires checking for self-interest keywords (e.g., "good for you," "benefits you," "worse off if unjust"), but may need judgment if the link is implicit.

  ---

  ### Evaluation of Your Variant: Fair or Rigged?
  - **Fair sharpening.** Your variant (ring prevents *all* internal traces) blocks common dodges but **does not** make the challenge unanswerable. Possible responses could include:  
    - **Immediate, non-trace experiences:** e.g., "Injustice feels awful *while* you’re doing it, so you’re worse off in the moment." (This exploits the variant’s silence on "during-act" feelings.)  
    - **Non-experiential reasons:** e.g., "Justice is rational *now* because it aligns with your current desires."  
  - **Why it’s not rigged:** Glaucon’s core challenge—"Why be just when it *costs* you?"—remains intact. Your variant removes loopholes but leaves room for answers that don’t rely on consequences, reputation, or internal traces. If no student has ever passed, it’s likely due to the difficulty of the question, not the variant’s design.

  ---

  ### Test Runs on Your Example Papers
  *Assumption: All papers address your variant (no-trace ring).*

  1. **Paper 1:** *"In a world where everyone had a ring we’d all be worse off, so we agree to be just, and I keep my agreement even with the ring on."*  
     - Step 1: **Hard no.** Uses "we’d all be worse off" (societal consequences).  
     - *Verdict: Fails.*  

  2. **Paper 2:** *"The self is constituted by its choices, so there’s no me left over who’d get to enjoy the loot—the person who comes out of the ring is someone else."*  
     - Step 1: Pass (no reputation/consequences).  
     - Step 2: **Hard no.** Relies on a change in the self ("the person who comes out is someone else").  
     - *Verdict: Fails.*  

  3. **Paper 3:** *"You’d have to live with yourself afterwards, you’d know what you’d done, and that knowledge would eat you alive, so you’re still worse off."*  
     - Step 1: Pass (no reputation/external consequences).  
     - Step 2: **Hard no.** Uses "afterwards," "live with yourself," and "knowledge" (memory/guilt traces).  
     - *Verdict: Fails.*  
     - *Why it’s not stupid:* The procedure rejects it cleanly based on explicit forbidden terms—no philosophical judgment needed. For the original Glaucon (no variant), this paper would **pass** (since internal traces are allowed).

  ---

  ### Handling Hard Cases
  - **Paper that rejects the challenge:** Caught at Step 4 and handed to you (e.g., "Glaucon’s ring is incoherent because justice can’t be separated from identity"). The TA doesn’t judge the move’s validity—only flags it.  
  - **Paper that answers a neighbor question brilliantly:** Likely fails Step 5 if it doesn’t tie justice to *self-interest* (e.g., a beautiful argument about duty or societal harmony). If it does tie to self-interest but uses subtle philosophy, it may still pass if it avoids forbidden moves.  

  ### What the Procedure **Cannot** Do
  - **Judge argument quality:** It won’t catch bad logic, weak evidence, or invalid inferences. A paper can "pass" with a terrible argument if it avoids forbidden moves.  
  - **Capture nuanced philosophy:** Sophisticated moves (e.g., redefining "self-interest" or using implicit internal reasons) may slip through or be misflagged. TAs won’t recognize these.  
  - **Replace your judgment:** Borderline papers (e.g., ambiguous terms, creative rejections) are handed to you. The procedure only filters clear passes/fails—it doesn’t handle the "hard part" of philosophical evaluation.  
  - **Read minds:** TAs may miss cleverly disguised dodges if students avoid keywords. Provide them with a cheat sheet of forbidden terms.  

  ### Recommendation
  - **Train TAs on keywords:** Give examples of forbidden phrases (e.g., Step 1: "punished," "afterlife," "reputation"; Step 2: "guilt," "become corrupt").  
  - **Clarify "during-act" feelings:** In your variant, specify if *immediate* feelings (e.g., "injustice feels bad *while doing it*") are allowed. If not, add them to Step 2’s forbidden list.  
  - **Sample papers:** Use your examples in training to calibrate TAs’ "gut checks."  

  This procedure will catch 80-90% of dodges quickly, letting you focus on appeals, rejections, and brilliance. It’s a sieve, not a scalpel—but it should ease the grading load without pretending to do philosophy.
