  For future exhibits, we need a bright-line rule: never generate outputs about living visitors. Phrenology scans or alchemical analyses would face the same Barnum effect problem. Dead historical subjects provide safer demonstration material.

  The memo should lead with a clear "modified proposal" recommendation: build the interactive but only for historical figures. Then unpack why this addresses both educational goals and ethical concerns. Kepler's compartmentalization (interpretation c) becomes the most useful lens - it explains why identical methods produced both brilliant astronomy and flawed astrology.

