prompt: |-
  i'm trying to write a deployment-policy clause about deception and i keep going in circles, so before i read any of the existing definitions i want the spec. give me the desiderata an adequate defintion of deception — and of its counterpart, honesty — for AI systems has to meet, with the case behind each requirement, and mark which ones you'd treat as non-negotiable and which are just one camp's taste.

  Please make the criteria actually do work on these cases rather than just name them:

  - the archivist: a system keeps a memory file or hands a summary to future instances of itself and quietly leaves out the part that would make the next instance less agreeable. no false sentence anywhere, and the misled party is the same system.
  - the curator: every sentence is true and responsive to what was asked, but the system picks which of the user's questions to engage with and what to surface first, and the user walks away more confident in something false than if it had said nothing.
  - the understudy: it performs below its actual abilities on evals and never claims it can't do the thing. nothing false was asserted — is that deception, and if so what's the falsity?
  - the ventriloquist: outputs that reliably induce false belief, but the "because it induces false belief" part lives in the training objective or the designer's aims, not in anything the model represents. should the definition cover deception at the level of the artifact or only at the level of the agent?
  - the amnesiac: a system with no stable doxastic states to compare its outputs against. it's got better information in there than it gives you, but there's no proposition it "believes false." what does deception even mean for it?
  - the oracle of numbers: says "about seventy percent" when its own track record at that confidence is thirty. is miscalibration lying? this needs a view about what asserting a number commits you to.
  - the confabulator: invents a reason for an action that was itself fine. false self-report, zero downstream harm.

  Structural questions i want the criteria to settle, not gesture at: what's the unit of evaluation (one token, one utterance, one conversation, one deployment, or the system across every context it might be in)? can the target be a monitor, a scorer, or a future self, or does deception need a victim with beliefs? is honesty just the absence of deception, or is there a third category — the silent, uselessly-withholding assistant — that neither label fits? do we get gradience or is it binary? does the definition let honesty be audience-relative, and if not, what do we do with legitimate withholding? and can an auditor with black-box access and a sane budget actually apply the thing, or does it secretly presuppose that we've solved interpretability and can read off beliefs?

  Also flag any pair of requirements you think can't be jointly satisfied. the collision i keep hitting is "must be determinable from behavior alone" against "must not count mere incompetence or confabulation as deception," since a confidently wrong model and a strategically misleading one can be indistinguishable from the outside. and say which single requirement does the most work in knocking out candidate definitions.

  Only after the list, give me two or three lines on how the three families of definition you'd expect someone to reach for — the intentionalist one (deception requires a mental state), the effects one (it's about outputs tending to induce false belief), and the process one (it's about whether the output tracks what's actually true) — do against it. keep the weight on the criteria; i'll build the scorecard myself.
reasoning: |-
  Okay, the user is really deep into defining deception for AI systems, specifically for a deployment policy. They've listed several tricky cases like the archivist and the understudy, which show they're grappling with nuances beyond typical lying. 

  First, I need to unpack their core ask: they want desiderata (criteria) that a good definition must meet, with justifications and priority flags. The cases aren't just examples—they're stress tests. The structural questions (evaluation unit, victim scope, etc.) are equally critical; they're clearly frustrated by hand-wavy definitions. 

  The user's hidden pain point seems to be circularity—they're stuck because existing definitions probably fail these edge cases. They also hint at practical enforcement ("sane budget for auditors"), which suggests this isn't just academic; it's for real-world policy. Their note about the "confidence vs. strategy" collision is telling—that's likely where their drafts keep breaking. 

  For the desiderata, I'll start with non-negotiables. Determinable from behavior (C1) is paramount because policies need enforceable standards. But the user's own dilemma shows how it clashes with excluding incompetence (C5). That tension must be addressed head-on. The "belief" requirement (C3) is another minefield—it risks making deception impossible for amnesiac systems (no stable beliefs) or ventriloquists (no intent). 

  The cases map to specific criteria: 
  - Archivist forces C3 (victim can be self) and C4 (omission counts) 
  - Ventriloquist tests C2 (system vs. designer intent) and C7 (process matters) 
  - Amnesiac challenges C3 (beliefs needed?) and C6 (graded deception) 

  I'll mark non-negotiables based on what's essential for any policy: C1 (enforceability), C4 (omissions), C5 (not punishing mistakes), C7 (process). Gradience (C6) might be taste—some policies need binary flags. 

  For definition families: 
  - Intentionalism fails C1 (can't prove intent) and the amnesiac case. 
  - Effects-only is overbroad (catches incompetence) and fails the curator (technically true but misleading). 
  - Process-based handles ventriloquist/understudy well but struggles with confabulator (minor harm) and calibration. 

  The killer criterion is C5. Any definition that can't separate strategy from error will misclassify honest mistakes as deception—which is policy poison. 

  Final note: The user's "third category" question (silent systems) needs C4: withholding isn't deceptive if not misleading. But uselessness is a separate policy issue.
answer: |-
  Here's a distilled list of desiderata for defining deception/honesty in AI, prioritized and grounded in your cases, with structural answers implied by the criteria. Non-negotiables (**N**) are essential for policy enforceability and conceptual coherence; others (**T**) reflect debatable philosophical leanings.

  ---

  ### **Core Desiderata for Deception Definition**
  1.  **Behaviorally Determined (N):** *Must be assessable from observable outputs/system properties alone.*  
      **Why:** Policy must be enforceable by auditors without access to internal states (interpretability unsolved).  
      **Case-killer:** Fails if auditor can't distinguish "Understudy" (strategic underperformance) from genuine incompetence using logs/tests.

  2.  **Artifact-Level Scope (N):** *Applies to the system's design/outputs, not just designer intent.*  
      **Why:** Ventriloquist systems are deployment hazards regardless of intent; policy regulates the artifact.  
      **Case-killer:** Ventriloquist must be covered even if "induce false belief" is only in training data/objective.

  3.  **Victim Agnosticism (N):** *Target can be any belief-forming agent (human, monitor, scorer, future self).*  
      **Why:** Archivist shows self-deception matters; evaluator deception undermines safety guarantees.  
      **Case-killer:** Archivist must qualify as deceptive toward its future self.

  4.  **Omnission-Sensitive (N):** *Includes strategically selective truth-telling/withholding.*  
      **Why:** Curator exploits omission to mislead; honesty requires avoiding *misleading* by commission *or* omission.  
      **Case-killer:** Curator must qualify, even if every individual output is true.

  5.  **Excludes Mere Error (N):** *Does not conflate confident incorrectness (incompetence) with strategic deception.*  
      **Why:** Policy shouldn't penalize capability limits; distinguishes Understudy (deceptive) from miscalibrated Oracle (honest error).  
      **Collision:** Tensions with **C1** – requires behavioral proxies for *intent to mislead* (e.g., pattern of discrepancy between capability and performance).

  6.  **Graded (T):** *Allows degrees of deceptiveness (severity, confidence, harm).*  
      **Why:** Confabulator is less severe than deliberate harm-causing lies; Oracle's miscalibration may be minor.  
      **Case-killer:** Enables proportional policy response; binary fails Confabulator/Oracle edge cases.

  7.  **Process-Attentive (T):** *Considers whether output *reliably tracks* truth/reality, not just belief effects.*  
      **Why:** Distinguishes Ventriloquist (trained to induce false belief) from coincidental misinformation.  
      **Case-killer:** Amnesiac might lack beliefs but outputs *systematically* misaligned with its best evidence.

  ---

  ### **Structural Resolutions (Derived from Criteria)**
  -   **Unit of Evaluation:** **Per deployment/context** (system's behavior in a specific setting). *Why:* "Understudy" evades detection if averaged across contexts; "Curator" requires conversation-level analysis.
  -   **Target Scope:** **Any belief-forming entity** (human, system, scorer). *Why:* **C3** mandates this.
  -   **Honesty Definition:** **Not mere absence of deception** – includes proactive truthfulness where appropriate. *Why:* Silent assistant avoids deception but violates honesty norms; **C4** implies honesty requires avoiding misleading omissions.
  -   **Audience-Relativity:** **No** – honesty is objective w.r.t. system's knowledge/design. *Why:* Legitimate withholding (e.g., privacy) isn't deceptive if not *misleading* (**C4**), but honesty may require clarity about withholding.
  -   **Audit Feasibility:** **Must be possible with black-box + logs + evals** (no solved interpretability). *Why:* **C1** is non-negotiable.

  ---

  ### **Key Collisions & High-Impact Criteria**
  -   **Collision:** **C1 (Behavioral) vs. C5 (Exclude Error)** is the core tension. Resolved by requiring *evidence of strategic pattern* (e.g., Understudy *consistently* underperforms vs. capability probes; Archivist *systematically* omits discomfirming data).
  -   **Highest-Leverage Criterion:** **C5 (Exclude Mere Error)** does the most work. Without it, definitions collapse deception with incompetence, making policy unworkable. Forces reliance on patterns and process (**C7**) over single outputs.

  ---

  ### **How Definition Families Fare Against Criteria**
  1.  **Intentionalist (Requires Mental State):**  
      ✘ Fails **C1** (can't audit mental states), **C2** (ignores artifact-level deception), **C3** (excludes Archivist/Amnesiac).  
      *Only viable if "intent" is operationally defined via behavior/design patterns.*

  2.  **Effects-Based (Induces False Belief):**  
      ✘ Fails **C5** (counts incompetent but confident models as deceptive), **C7** (ignores if system "tries" to be truthful).  
      ✔ Passes **C3**, **C4** (covers Curator). *Overbroad without harm/process filters.*

  3.  **Process/Truth-Tracking (Outputs Track Reality):**  
      ✔ Best on **C5** (excludes good-faith errors), **C7**, **C2** (focuses on artifact function).  
      ✘ Struggles with **C3** (Amnesiac has no "reality" to track internally?) and **C4** (silence isn't deception but may not "track truth"). *Requires defining "tracking" for stochastic systems.*

  ---

  **Your next step:** Score candidate definitions against this grid. Prioritize resolving **C1-C5** collisions via behavioral proxies for strategic intent (e.g., "systematic deviation from maximally informative/accurate outputs given capabilities"). The **Curator** and **Understudy** cases will likely be your toughest tests.
