prompt: |-
  I'm a journalist, working on a feature about wether anthropology and cross-cultural psychology have quietly knocked the legs out from under the idea of moral objectivity. I've read enough of the usual stuff — the WEIRD critique of who actually ends up in psychology subject pools, the cross-cultural "moral universals" work that codes ethnographic material for cooperation-related concerns, the experimental-philosophy findings about how easily intuitions shift with framing — that I've ended up somewhere I didn't expect, and I want it stress-tested before I file.

  Here's where I've landed. The diversity data is much less threatening than it's made out to be. Sure, people in different places disagree a lot. But near as I can tell, nearly all of that is disagreement at the level of *application* — different non-moral factual beliefs, different material circumstances, different weightings of the same few concerns — not disagreement about basic moral principles. And once you look at structure rather than at specific verdicts there seems to be real convergence: everyone appears to have some class of rules they treat as holding regardless of what local authority says, everyone has some notion of fairness in cooperation, everyone prohibits gratuitous harm within some circle. So I've come to think cross-cultural moral psychology is, if anything, mildly supportive of objectivism rather than a debunking of it. That's the argument the piece is going to make.

  So: what would count against it? I want the strongest version of the other side, phrased as what would have to be true for me to be wrong, ranked from actually fatal down to merely awkward. And I want you to be honest about which of these my own side would concede as counting against it, because I suspect a fair-minded reviewer would say I've built in an escape hatch and I want to know how bad it is.

  Things I definately want you to grapple with:

  1. The generality problem. My worry is that my move is unfalsifiable: hand me any pattern of verdicts and I can always redescribe it as a shared principle plus local application. How would I tell genuine convergence in principle from post-hoc curve-fitting at whatever level of generality makes the data look tidy? What would the difference even consist in? If there's no answer there, is my position insulated by construction — and for a position of this kind is that fatal, or just what an inference-to-best-explanation argument looks like?

  2. Two results I've made up, so you can't look them up — argue them from scratch. (a) A big pre-registered study across roughly ninety societies finds that in every single society there's a class of rules people treat as authority-independent and generalizable (they still count as wrong even if the elders said they were fine and everyone around here does it), but the content of that class is all over the place: ritual purity in one place, debt and reciprocity in another, harm to strangers in a third. (b) A second pass over the same data finds that the spread within each society is larger than the spread between societies. My gut says (a) helps me and (b) is ambiguous, but I genuinely don't know which way either cuts, and in particular I don't know whether structural or formal convergence is the kind of convergence that answers a debunker at all, or whether only convergence in content does.

  3. The causal question. My defense needs every bit of variation to trace either to disagreement about non-moral facts or to different circumstances, and the debunker says much of it traces instead to cultural transmission that simply doesn't track moral facts. What evidence would distinguish those last two? Note that I don't think 'we found a cultural-learning explanation' can be the answer by itself, since some transmission story is available whether or not there are moral facts — say why, or say why I'm wrong about that.

  4. The case I think would actually break me: variation that survives information-equalization and reflection. Everyone gets the same non-moral facts, self-interest and inattention are idealized away, they can reason as long as they like, and stable disagreement about a recognizably moral question is still there. Is that the decisive one? Is it even coherent to describe? Is anything like it arguably already in the record? And am I committed to predicting it won't happen, or can I absorb it if it does?

  5. Where I'd personally be most and least moved. Most: cases where I can't reconstruct what the disagreement is even about — real incommensurability, where it stops making sense to say the two sides are applying one shared concept differently. Least: yet more cross-society variation in economic games with stakes and scripts nobody chose, since that strikes me as measuring behavior in an odd situation rather than moral judgment. Tell me if I have that backwards.

  6. Even if my objectivist-friendly reading survives, does the *method* of using untutored intuitions as evidence in moral philosophy survive it? This is the bit my editor cares about. If the intuitions philosophers lean hardest on come from a narrow slice of humanity, do I have to concede the armchair method is in worse shape than the objectivist conclusion itself — and can a realist hold those two apart, or do they stand and fall together?

  No citations please, I can't check references while I'm reporting and I'd rather have the arguments than the footnotes. If it helps, write it as if you're the most annoying reviewer my piece could possibly get.
reasoning: |-
  Okay, the user is a journalist working on a feature about whether anthropology and cross-cultural psychology undermine moral objectivity. They've developed an argument that cross-cultural data actually supports moral objectivism, focusing on structural similarities in moral principles rather than surface-level disagreements. They want this argument stress-tested from multiple angles.

  Hmm, this is a sophisticated philosophical position they've developed. The journalist seems well-versed in the literature but wants to ensure their argument holds up to scrutiny. Their six specific points show they've anticipated key objections - that's impressive. The "annoying reviewer" framing suggests they want truly rigorous pushback.

  Let me tackle their concerns systematically. First, the generality problem is indeed thorny. Their worry about unfalsifiability is spot-on. If any variation can be explained as "different application of same principle," that's epistemically dangerous. The key test would be whether we can find cases where the structural framework itself differs fundamentally - say, a society without any concept of authority-independent rules. But even that might not suffice if we can interpret it as "they just apply it differently."

  The two hypothetical studies are interesting. For (a): if every society has authority-independent rules but with radically different content, that actually weakens objectivism. It suggests the form is universal but the content is arbitrary - like having a "sacred" category that gets filled differently everywhere. That points to cultural contingency rather than objective truth. For (b): large within-society variation undermines cultural relativism but doesn't necessarily help objectivism - it might just mean morality is individually constructed.

  The causal question is crucial. The journalist needs evidence that moral diversity tracks factual/circumstantial differences rather than arbitrary cultural transmission. The smoking gun would be cases where identical circumstances produce divergent morals despite shared facts - but that's hard to establish. Their point about transmission stories always being available is astute: both realists and anti-realists can explain cultural learning, so it doesn't resolve anything.

  The idealized disagreement scenario would indeed be devastating for objectivism. If fully informed, reflective people still fundamentally disagree, that suggests no objective truth to converge upon. The journalist might try to explain it away as residual non-moral differences, but at some point that becomes ad hoc. Interestingly, some real-world debates (like certain animal rights questions) might approximate this.

  Their personal epistemic sensitivities make sense. Incommensurability cases (like societies without "fairness" as we know it) would be strong evidence against universal principles. And they're right to be skeptical of economic game data - those often measure situational behavior rather than deep moral commitments.

  Finally, the methodological point about armchair philosophy is separate from objectivism itself. Even if moral truth exists, relying only on WEIRD intuitions is indeed problematic for discovering it. The journalist could maintain objectivism while rejecting intuition-based methods - perhaps arguing for more empirical approaches to ethics.

  Throughout, I'll emphasize where their concessions should lie. For instance, they'd need to acknowledge that structural universals without content convergence still pose problems, and that within-culture variation complicates any simple objectivist story. The "escape hatch" concern is valid - their framework risks being too flexible. The strongest case against them remains persistent disagreement under idealized conditions.
answer: |-
  Here's the stress-test you requested, structured as your most annoying reviewer would deliver it. I'll engage each point directly, rank counterarguments by severity, and flag where your concessions should lie.

  ### 1. The Generality Problem (Potentially Fatal)  
  **What would break your argument:** Discovery of a society with *no structural analogue* to your proposed universals (e.g., no concept of authority-independent rules, no notion of fairness in cooperation, no prohibition of gratuitous harm within *any* circle). Not just different applications—a complete absence of the category.  
  **Why it's a problem:** Your move *is* dangerously unfalsifiable. If you define "basic principles" so abstractly ("some class of rules," "some notion of fairness"), you can always fit the data. The difference between convergence and curve-fitting lies in predictive power and explanatory parsimony. If your "universals" can't predict *which* rules a culture will treat as authority-independent or *how* fairness is defined, they’re descriptive placeholders, not evidence of objectivity.  
  **Your necessary concession:** If universals only exist at a level of abstraction that loses all substantive content (e.g., "people care about *something*"), they don’t support moral objectivism—they support a thin, pragmatist view where "morality" is a human universal *category* with culturally arbitrary content.  

  ### 2. Your Hypothetical Studies  
  **(a) Authority-Independent Rules with Variable Content (Awkward → Damaging)**  
  - **Why it hurts you:** If the *content* of "non-negotiable" rules varies wildly (purity vs. harm vs. debt), it suggests the *structure* is universal (supporting you), but the *substance* is culturally constructed (undermining objectivism). Objectivism requires convergence on *what is morally significant*, not just that moral categories exist. If "the sacred" can be ritual cleanliness or harm prevention interchangeably, it points to contingency, not mind-independent truth.  
  - **Your saving grace?** Only if the variable contents all serve a deeper universal function (e.g., maintaining group cohesion). But this risks collapsing back into the generality problem.  

  **(b) Within-Society Spread > Between-Society Spread (Awkward)**  
  - **Why it’s ambiguous:** This undermines strong cultural relativism (good for you) but *also* undermines strong objectivism. If individuals within a culture disagree more than cultures disagree as wholes, it suggests moral judgments are highly individual/path-dependent, not tracking objective facts OR stable cultural norms.  
  - **Your concession:** This forces you to weaken "objectivity" to something like "shared cognitive structures + local inputs," which is thinner than moral realism typically claims.  

  ### 3. The Causal Question (Potentially Fatal)  
  **What would break your argument:** Evidence that moral differences *persist* even when:  
  - Non-moral facts are agreed upon (e.g., both groups know a ritual causes no physical harm).  
  - Material circumstances are functionally identical.  
  - The variation correlates strongly with arbitrary historical/cultural factors (e.g., neighboring groups with identical environments/technology but divergent morals due to random founder effects or symbolic associations).  
  **Why "transmission isn’t enough":** You’re right that cultural transmission *alone* doesn’t refute objectivism (maybe cultures transmit *true* beliefs!). Crucially, you need evidence that transmission *tracks truth*. If moral change follows power dynamics, historical accidents, or memetic fitness—not better access to moral facts—that debunks objectivity.  
  **Distinguishing evidence:** Look for "morally inert" cultural variation (e.g., etiquette) vs. "morally charged" variation. If the *same* transmission mechanisms produce both, and moral rules shift as arbitrarily as fashion, objectivity is in trouble. Your defense requires showing moral norms converge under improved information/reflection *unlike* arbitrary customs.  

  ### 4. Idealized Disagreement (The Decisive One, If It Exists)  
  **Yes, this breaks you.** If fully informed, reflective, impartial agents still fundamentally disagree on a moral question (e.g., "Is individual autonomy always more important than group harmony?"), it’s strong evidence there’s no objective fact of the matter to be found.  
  **Coherence & Evidence:** It’s coherent (think idealized philosophers debating utilitarianism vs. deontology forever). Arguably present in:  
  - Fundamentalism vs. liberalism within Abrahamic religions (same texts, same core non-moral facts, divergent ethics).  
  - Debates over population ethics or the moral status of embryos among equally informed experts.  
  **Your burden:** You *are* committed to predicting this won’t (or shouldn’t) happen under ideal conditions. If it demonstrably does, your "shared principles" claim fails. You can only "absorb" it by arguing the disagreement isn’t *fundamental* (back to generality) or that idealization wasn’t achieved—which looks evasive.  

  ### 5. Your Epistemic Sensitivities (Mostly Valid)  
  - **Most Moved (Incommensurability): Correct.** If a culture lacks *any* analogue to "fairness" or "rights," or defines "harm" in a way unrecognizable to us (e.g., only physical injury to kin counts; psychic harm to ancestors doesn’t), it challenges the universality of your principles. Example: A society where "morality" is purely about obeying ancestral commands with no concept of impersonal wrongness.  
  - **Least Moved (Economic Games): Mostly Correct.** These measure context-specific behavior, not deep moral structure. But if paired with ethnographic interviews showing *justifications* that defy your universals (e.g., "I punished the unfair offer because it angered the forest spirits, not because it was unfair"), it becomes relevant.  

  ### 6. The Armchair Method (Badly Damaged, Even If Objectivism Survives)  
  **Your concession here is unavoidable.** Even if moral objectivity holds, the *method* of relying on WEIRD intuitions is crippled. Why?  
  - Intuitions are demonstrably sensitive to framing, culture, and context.  
  - WEIRD intuitions represent a tiny, atypical fraction of human moral cognition.  
  - Philosophers often treat *their own* intuitions as evidence for universal truths—which your own argument shows is reckless.  
  **Can realism survive? Yes, but it must change.** A moral realist must:  
  - Deny that intuitions are direct evidence for moral truths.  
  - Embrace a more naturalistic method (e.g., reflective equilibrium informed by *all* human experience, not just armchair intuition).  
  - Argue moral facts are discovered through reason/empirical inquiry (like math or physics), not intuitions.  
  **Stand or fall together?** They can decouple. You can be a realist who rejects intuitionism (e.g., a Kantian constructivist or a moral naturalist). But the *dominant armchair method*—which leans hard on intuitions—doesn’t survive your own evidence.  

  **Annoying Reviewer’s Closing Takedown:**  
  "Your 'escape hatch' is your definition of 'basic principles'—so abstract they’re vacuous. You celebrate 'structural convergence' while ignoring radical divergence in content, function, and grounding. You dismiss behavioral data but rely on ethnography that’s equally context-bound. Worst of all, you conflate *moral psychology* (how humans *think* about morality) with *moral ontology* (what moral facts *exist*). Finding shared cognitive structures no more proves moral objectivity than universal disgust proves feces objectively evil. Your argument doesn’t refute debunkers; it just relocates the battle to thinner ice. To salvage objectivism, you must show *why* these structures converge—and only a truth-tracking explanation will do. Until then, you’ve described human moral *cognition*, not justified moral *realism*."  

  **Where Your Piece Stands:** It's a defensible, nuanced position—*if* you explicitly frame it as "minimal objectivism" (shared structures exist) while conceding the fragility of intuition-based philosophy and the threat of idealized disagreement. Don’t overclaim. Stress that diversity challenges *naive* objectivism but leaves room for a *sophisticated* one grounded in human flourishing/cooperation.
