prompt: |-
  Hey — I'm in the final year of a philosophy degree and I'm taking a philosophy of language option this term. Last week's seminar was on Moore's paradox (the "it's raining but I don't believe it is" sort of sentence), everyone agreed the sentence is somehow broken, and we spent the hour on why. But since then, while procrastinating on my essay, I keep noticing a cluster of sentences that feel broken in the same kind of way, and I can't work out whether they're all really one phenomenon or whether I'm lumping together three or four separate things. I wanted to use one of them as a hook in my essay intro and my tutor said I'd need to be precise about which phenomenon I actually mean, which is the real reason I'm asking.

  So here's what I've got. All the seminar examples had a word like "believe" in the second half, but the brokenness seems to survive when that word isn't there at all: "It's raining but I don't know that it is"; "It's raining but I've no evidence either way"; "It's raining but for all I know it isn't" (I'm least sure about that last one — it might just be fine and I'm hearing it wrong). Meanwhile some near-neighbours are completely fine: "It's raining but she doesn't believe it is", "It was raining but I didn't believe it at the time", and — this is the one that got me — "It's raining but I might be wrong about that". That last one sounds perfectly ordinary to me even though it seems to say more or less what "It's raining but it might not be raining" says, and *that* one sounds broken. I also tried sticking the whole thing inside an if-clause ("If it's raining and I don't believe it is, then...") and inside a question, and it still felt wrong, which my housemate (who does linguistics) said was supposed to rule out one family of explanation, though I didn't really follow why.

  So: is there an established name for this whole family, or for the sub-bit where the second clause is about knowledge, evidence or possibility rather than about belief? More importantly though, I want the carving and not the label — is what I've described Moore's paradox extended, or a different thing that merely looks like it, where exactly does it stop, and which of my examples are genuine instances and which are impostors? Two specific bits I'm fuzzy on. First: there's a pattern where someone says a long run of things one by one and then adds something like "though presumably at least one of those is wrong" — I think authors do this in prefaces — and that doesn't sound broken at all despite feeling structurally similar; how does it relate, if at all? Second: the "I might be wrong" versus "it might not be raining" contrast, because that's the bit I most want explained and I can't get any purchase on it. Oh, and please write in British English.

  One more thing: I'd rather you be blunt than helpful. If some of my example sentences are actually fine and I'm just hearing them wrong, or if the pattern I think I've spotted is an artefact of me picking examples to fit a theory I half-remember from seminar, say so plainly rather than politely building a tidy account on top of bad data. And where you're genuinely guessing, or where people who work on this disagree with each other, mark that clearly instead of glossing over it — I'd rather have the disagreement than a confident story. Don't give me reading lists or citations though, my library login expired and I can't access anything; just tell me where the live disputes are.
