prompt: |-
  I run a fortnightly "games, choice and proof" workshop for first-years, mixed maths and philosophy, about 16 people, 80 minutes, one room with moveable tables. I can get printed boards, two colours of counters, index cards and a whiteboard. Almost none of them have met a non-constructive existence proof before.

  I had a long argument with a friend last night about the strategy-stealing argument. She says it's a parlour trick: it tells you the first player wins at Hex and hands you nothing you can actually use, so what has it shown. I kept saying that's the whole point — you find out *which* player without ever getting your hands on a strategy — but I couldn't make her feel it, and I think the only way to feel it is to play. So design me the session: rules, materials, a timeline, and a debrief that maps what happened onto the steps of the argument (the supposition that the second player has a winning strategy, the throwaway opening move, the "pass" you make when the stolen strategy calls for the cell you already took, and the premise that an extra stone of your own colour can never hurt you). No lecture up front and nobody says "strategy stealing" until the last ten minutes — they should run into the move themselves.

  The bit I want you to work out rather than look up, because I invented it on the way home: a variant — call it Stint Hex — where each player has a fixed budget of stones, fewer than half the board, must place one every turn, and looses if the budget runs out before they've connected their sides. In that variant the throwaway move costs something, and I want the group to discover that by trying to rerun the argument on it, not by being told. If who actually wins Stint Hex isn't obvious, say so honestly instead of inventing an answer. There's a second beat if time allows: a free stone of your own colour, placed by someone else, is a gift in Hex — get them to find a game where the same gift is a curse.

  Finally: what goes wrong the first time I run it. I expect people to slide from "the first player wins" into "I can name the winning opening move", and someone to object that finite games are determined anyway so the existence claim was never the news — how do I handle that, and what does the activity just can't show them that only I can say out loud?
reasoning: |-
  We are designing a workshop session for first-year students with mixed maths and philosophy backgrounds. The goal is to lead them to discover the strategy-stealing argument through playing a variant of Hex (called Stint Hex) and then to see the contrast with standard Hex. The session should avoid upfront lectures and only introduce the term "strategy stealing" at the end.

  Session Structure:

  1. Introduction (5 minutes)
     - Briefly explain the rules of Hex and the goal (connect two opposite sides with your color).
     - Explain the setup: a hexagonal grid (or a square grid with hex-like adjacency, e.g., a rhombus). A small board is recommended (e.g., 5x5 or 6x6) to keep games short.

  2. Standard Hex (20 minutes)
     - Have the students play a few quick games of standard Hex (without the budget) in pairs. Use printed boards and two colors of counters (one for each player).
     - Goal: Get them familiar with the game and notice that the first player might seem to have an advantage.

  3. Introducing Stint Hex (5 minutes)
     - Explain the rules of Stint Hex:
          - Each player has a fixed budget of stones (say, 8 stones for a 6x6 board, which has 36 cells; note: 8 is less than half of 36, which is 18).
          - Players must place one stone per turn until they run out of stones.
          - The goal is still to connect their two sides.
          - If a player runs out of stones and has not connected their sides, they lose.
          - The board is shared and stones are not removed.

  4. Play Stint Hex (30 minutes)
     - Have the students play Stint Hex in pairs. They should play multiple games, switching who goes first.
     - Encourage them to try different strategies and observe what happens when the stone budget runs out.

  5. Debrief and Strategy-Stealing Argument (20 minutes)
     - Bring the group together for discussion. Use the whiteboard to record observations.
     - Key questions:
          a. In standard Hex, did the first player seem to have an advantage? Why?
          b. In Stint Hex, what happened when the first player made a throwaway move? (They might notice that the first player runs out of stones faster and might lose because of that.)
          c. Try to guide them to attempt the strategy-stealing argument for Stint Hex. They might start by assuming the second player has a winning strategy. Then the first player could "steal" it by making an arbitrary first move and then following the second player's strategy. But in Stint Hex, that arbitrary first move uses up one stone of the budget. So when the first player runs out of stones, they might not have connected their sides even if they followed the strategy. Thus, the argument breaks down.

     - Now, map the steps to the standard Hex argument (without the budget constraint):
          - Suppose the second player has a winning strategy.
          - The first player makes an arbitrary first move (the throwaway) and then pretends to be the second player by using the second player's strategy. But what if the strategy calls for a move on the cell already taken? Then the first player can make any move (a "pass" in the sense that they get to make an extra move anywhere). And having an extra stone of your own color never hurts in Hex (because it only helps your connection).
          - This leads to a contradiction because the first player wins, so the second player cannot have a winning strategy. Therefore, the first player must have a winning strategy.

     - Contrast with Stint Hex: The throwaway move costs a stone, so the first player is effectively playing with one less stone. And having an extra stone might not be helpful if you run out of moves before connecting? Actually, in Stint Hex, having an extra stone of your own color might still be beneficial for connection, but the problem is the budget. The first player has one fewer stone to work with because they used one arbitrarily. Therefore, the strategy-stealing argument does not work.

  6. Second Beat (if time, about 10 minutes)
     - Ask: "In Hex, if an opponent places a stone of your color for you, that's a gift because it helps you. Is there a game where having an extra stone of your own color placed by someone else is a curse?"
     - Example: In the game of Nim, or perhaps in a game where the goal is to avoid forming a certain pattern (like Sim, which is a game of avoiding triangles). But we need a simple example. Alternatively, consider a game where the board is very small and the extra stone blocks a critical path that you needed to be empty? However, in Hex, the extra stone never blocks because it only helps. So we need a different game.

     - A better example: The game of "Y" (similar to Hex but on a triangular grid) or perhaps a different connection game. But note: in some games, an extra stone might overfill and cause a loss by some other rule (like in Go, if it causes a group to be captured, but that's complex). Alternatively, consider a game with a different objective, such as "Havannah", but that might be too complex.

     - Simpler: A game of "avoiding creating a bridge" or a game where the goal is to have the fewest stones? But let's stick to a known game. How about "Dots and Boxes": if your opponent gives you a box, that's a gift, but if they force you to make a move that gives them many boxes, that might be seen as a curse? But that's not exactly the same.

     - Alternatively, consider a variant of Hex with an additional rule: if a player forms a certain forbidden pattern (like a 2x2 block of their own stones) then they lose. Then an extra stone placed by the opponent might force you to complete that pattern. But that is made up.

     - Since time is short, it might be better to have a brief discussion and then present the idea that in some games, an extra stone might over-constrain your position. But it's okay to leave it as an open question or assign it as a thought exercise.

  7. Wrap-up (last 10 minutes)
     - Introduce the term "strategy stealing" and explain that it is a non-constructive existence proof: it shows that the first player must have a winning strategy without telling you what it is.
     - Address the philosophical point: What has it shown? It tells us which player wins and that a winning strategy exists, but not what it is. That is still valuable information.

  Potential Pitfalls:

  1. Students might think that because the first player wins in Hex, they can name the winning opening move. However, the strategy-stealing argument does not reveal any particular move. Emphasize that the argument is non-constructive.

  2. A student might object: "Finite games are determined (by Zermelo's theorem) so we already knew one player has a winning strategy. The news is only which one." How to handle:
     - Acknowledge that Zermelo's theorem tells us that one player has a winning strategy. But without the strategy-stealing argument, we wouldn't know which one. And the theorem doesn't tell us which one. So the argument is still valuable because it breaks the symmetry.

  3. What the activity can't show and only you can say out loud:
     - The activity might not fully convey the abstract nature of the strategy-stealing argument. You might need to explicitly point out that the argument works by contradiction and relies on the non-harmful nature of an extra stone (which fails in Stint Hex due to the budget constraint). Also, the argument in standard Hex relies on the fact that the extra stone can be used as a "pass" when the stolen strategy calls for an occupied cell.

  4. In Stint Hex, who wins? It's not obvious because it depends on the budget and board size. With a very low budget, the second player might have an advantage because the first player uses a stone without purpose. But with a budget that is close to half the board, the first player might still have an advantage. The point of the activity is not to determine who wins Stint Hex, but to see that the strategy-stealing argument fails because of the cost of the throwaway move.

  Timeline:

  - 0:00-0:05: Introduction and rules of standard Hex.
  - 0:05-0:25: Play standard Hex (about 2-3 quick games per pair).
  - 0:25-0:30: Introduce Stint Hex rules.
  - 0:30-1:00: Play Stint Hex (multiple games, switching first player).
  - 1:00-1:20: Debrief and mapping the strategy-stealing argument (include contrast between Hex and Stint Hex).
  - 1:20-1:30: Second beat (if time) and wrap-up (introduce term "strategy stealing", address philosophical points).

  Materials:
  - Printed boards (hexagonal grid or rhombus-shaped square grid, e.g., 6x6).
  - Two colors of counters (plenty of each).
  - Index cards (for writing down strategies? or for notes? might not be necessary).
  - Whiteboard for discussion.

  What might go wrong the first time:
  - Students might not immediately see the issue in Stint Hex when trying to apply strategy stealing. Be prepared to guide them with questions: "What if the first player uses a stone arbitrarily? How does that affect the budget?"
  - Some pairs might finish games quickly, others slowly. Have extra boards for those who finish early to play again.
  - The connection between the game experience and the abstract argument might be hard for some. Use the whiteboard to illustrate the steps of the argument with a specific example.

  Answering the question about Stint Hex: It is not obvious who wins. With a budget of 8 on a 6x6 board (36 cells), both players have the same budget. The first player might be at a disadvantage because they have to make an extra move (the throwaway) that doesn't contribute to their connection, while the second player can use all their stones effectively. But it's possible that the first player can choose a non-detrimental move and still have enough stones. It will depend on the board and the strategies. The point is that the strategy-stealing argument fails, so we cannot use it to determine the winner.

  Second beat example: A game where an extra stone of your own color is a curse. One example is the game of "Sim" (a game played on the complete graph K6, where players take turns coloring edges, one in red and one in blue, and the player who completes a triangle in their color loses). In Sim, if your opponent forces you to add an edge that completes a triangle in your color, that's a curse. But note: the extra stone (edge) is placed by you, not by the opponent. Alternatively, in a game like "Go", if an opponent places a stone that captures your group, that's a curse. But that's complex. Another example: in "Twilight Struggle" (a board game) sometimes you want to avoid having too many of your own influence in a country because it might trigger a scoring that benefits your opponent. But that's too advanced.

  A simpler example: Consider a game of Tic-Tac-Toe where the goal is to avoid getting three in a row. Then an extra mark of yours might cause you to lose. But note: that variant is called "Misère Tic-Tac-Toe" and is usually played with the goal of not getting three in a row. But in that case, an extra mark of your own color is a liability. However, in the standard rules, Tic-Tac-Toe is about getting three in a row. So we need a variant.

  Alternatively, consider a game of "Nim" where the extra stone might change the heap size in a way that makes it losing? But that's not the same as having an extra stone of your own color placed on the board.

  It might be best to stick to a simple, made-up example for clarity: Suppose a game on a 1x3 board. Players take turns placing their stones on empty cells. The player who places a stone that completes a block of two of their own stones in a row loses. Then, if the board is empty and the first player places in the middle, the second player can place on the left. Then the first player is forced to place on the right, which completes a block of two (since the middle and right are adjacent and both first player's stones) and loses. But note: the extra stone placed by the second player (on the left) doesn't harm the first player directly. It's the first player's own stone that causes the loss. So that doesn't exactly fit.

  Alternatively, consider a game where the board has a limited number of moves and the extra stone of your own color uses up a critical resource? But that is similar to Stint Hex.

  Given the complexity, it might be better to skip the second beat if time is short, or present it as a puzzle for further thought.

  In summary, focus on the main activity and the comparison between Hex and Stint Hex to illustrate the strategy-stealing argument and its limitations.
answer: |-
  ### Workshop Session: Discovering Strategy-Stealing Through Hex and Stint Hex  
  **Duration:** 80 minutes  
  **Materials:** Printed Hex boards (6x6 rhombus grid), two colors of counters (e.g., red/blue), index cards, whiteboard, markers.  
  **Group Size:** 16 students (8 pairs).  

  ---

  #### **Session Timeline**  
  **Goal:** Students discover the strategy-stealing argument organically by playing Hex and Stint Hex. No upfront theory—only name "strategy stealing" at the end.  

  1. **Introduction (5 min)**  
     - **Rules of Hex:**  
       - Two players (Red vs. Blue). Red connects top-bottom; Blue connects left-right.  
       - Players alternate placing one stone per turn on an empty cell.  
       - First to connect their sides wins. **Emphasize:** "Your stone never hurts you—it only helps your connection."  
     - **Setup:** Students pair up. Each pair gets a board, counters, and index cards (for optional note-taking).  

  2. **Standard Hex Gameplay (15 min)**  
     - **Task:** Play 2–3 quick games of Hex. Switch first players.  
     - **Prompt:** "Observe who wins when you start. Is there an advantage?"  
     - **Expected Observation:** First player often wins—but no one has a foolproof strategy.  

  3. **Introduce Stint Hex (5 min)**  
     - **Rules:**  
       - Each player has a **fixed budget of stones** (e.g., 8 stones for a 6x6 board with 36 cells).  
       - Must place one stone per turn.  
       - Lose if you run out of stones before connecting your sides.  
       - *No other rule changes.*  
     - **Why 8 stones?** Half of 36 is 18; 8 < 18, so budgets are tight.  

  4. **Stint Hex Gameplay (25 min)**  
     - **Task:** Play 3–4 games of Stint Hex. Pairs track stone budgets (use index cards to tally).  
     - **Prompts:**  
       - "What happens when the first player wastes a move?"  
       - "Does the first player still dominate? Try letting Player 2 start sometimes."  
     - **Expected Observations:**  
       - First player often loses due to budget drain.  
       - "Wasting" a stone feels costly—unlike standard Hex.  

  5. **Debrief & Strategy-Stealing Discovery (25 min)**  
     *Guided discussion mapping gameplay to the argument. Use whiteboard to sketch ideas.*  
     - **Step 1: Standard Hex Observations**  
       - Ask: "In standard Hex, who won more often when starting first? Why?"  
       - Students note first-player advantage but can’t pinpoint a strategy.  
       - **Key Point:** "We suspect the first player *must* win—but we don’t know how."  
     - **Step 2: Recreate the Argument with Stint Hex**  
       - **Prompt:** "Assume Player 2 has a winning strategy in Stint Hex. Can Player 1 ‘steal’ it?"  
       - Guide them to test:  
         - Player 1 makes a random "throwaway" move (e.g., corner).  
         - Then "steals" Player 2’s strategy: Pretends to be Player 2 and copies their responses.  
       - **Problem Emerges:**  
         - "What if the stolen strategy says to play where Player 1 already has a stone?" → "Pass" (play elsewhere).  
         - **But:** "In Stint Hex, the throwaway costs a stone. If Player 1 runs out of stones first, they lose—even with a ‘stolen’ strategy."  
       - **Whiteboard Sketch:**  
         ```  
         Stint Hex:  
         Player 1 budget: 8 stones  
         Throwaway move (-1 stone) → Now has 7 stones.  
         Steals strategy, but budget runs out faster → Loses!  
         ```  
     - **Step 3: Contrast with Standard Hex**  
       - **Prompt:** "Now try ‘stealing’ in standard Hex. Why does it work here?"  
       - **Key Insights from Students:**  
         - Throwaway move doesn’t cost resources (no budget).  
         - "Pass" move (when strategy calls for an occupied cell) is free.  
         - Extra stone **never hurts**—only helps your connection.  
       - **Argument Mapped:**  
         - If Player 2 has a winning strategy, Player 1 can:  
           1. Make throwaway move.  
           2. Steal strategy + "pass" when needed.  
           3. Win—contradiction! ∴ Player 1 must have a winning strategy.  
       - **Reveal the Term:** "This is called **strategy stealing**—it proves *who* wins without giving a strategy."  

  6. **Second Beat: When an Extra Stone is a Curse (5 min, if time)**  
     - **Prompt:** "In Hex, an extra stone of your color helps. Find a game where it’s a **curse**."  
     - **Example Discovery (Guided):**  
       - **Game:** "Poison Hex" (variant). Rules: You lose if you create a 2x2 block of your stones.  
       - **Why a curse?** An extra stone could force you to complete a losing block.  
       - *Note:* Students may propose other ideas (e.g., Go territory rules). Discuss briefly.  

  7. **Wrap-Up: The "Parlour Trick" and Philosophy (5 min)**  
     - **Address the Friend’s Critique:**  
       - "Strategy stealing feels like a parlour trick—it tells you *who* wins but not *how*. But that’s the point! It’s a **non-constructive proof**: it shows existence without construction."  
     - **Final Q&A:** Encourage questions about the argument’s steps.  

  ---

  #### **What Goes Wrong & How to Handle It**  
  1. **"I can name the winning opening move!"**  
     - **Problem:** Students conflate "first player wins" with "I know the best first move."  
     - **Fix:** Ask: "Did strategy stealing tell you *where* to play first? Could you win every game with it?" → Emphasize it’s **non-constructive**.  

  2. **"Finite games are determined anyway—why is this news?"**  
     - **Problem:** A student cites Zermelo’s theorem (finite games have a winning strategy for one player).  
     - **Fix:**  
       - Acknowledge: "Yes, Zermelo says *someone* wins. But strategy stealing breaks symmetry: it tells you **which player** wins without exhaustive search. That’s profound for complex games like Hex."  
       - **Activity Limitation:** The workshop can’t "prove" why non-constructive proofs matter philosophically. **Say out loud:** "Math isn’t just about algorithms—it’s about knowing what’s true, even if we can’t build the solution. That’s where philosophy kicks in!"  

  3. **Stint Hex Winner?**  
     - **Honest Answer:** It’s **unclear**. With 8 stones on 6x6 Hex:  
       - Player 2 often wins (budget drain hurts Player 1).  
       - But skilled Player 1 might still win by conserving stones.  
     - **Why this works:** Uncertainty reinforces why strategy stealing fails—the throwaway move *costs resources*.  

  4. **Other Pitfalls:**  
     - **"Stint Hex is too hard!"** → Use smaller boards (4x4) or increase budgets if needed.  
     - **Students miss the "pass" move** → Use whiteboard to demo a game where Player 1 "passes" when the stolen strategy conflicts.  
     - **Philosophy overshadows math** → Keep discussion focused on gameplay observations.  

  ---

  #### **Why This Works**  
  - **Discovery-Based:** Students *feel* the cost of a throwaway move in Stint Hex vs. its harmlessness in Hex.  
  - **No Lectures:** Arguments emerge from failed strategies.  
  - **Debrief Maps Gameplay to Proof:** Concrete steps (throwaway, pass, stone utility) become memorable.  
  - **Embracing Uncertainty:** Stint Hex’s ambiguity and the "curse" example deepen engagement.  

  **Final Tip:** Start with small boards (4x4 or 5x5) to keep games short. If students hit walls, pivot to group discussion—e.g., "What broke when you tried to steal the strategy in Stint Hex?"
