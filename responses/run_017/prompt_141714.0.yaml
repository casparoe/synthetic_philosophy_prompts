prompt: |-
  I serve on the programmes committee of a small Buddhist-inspired humanitarian foundation. We currently fund three things: a hospice, a Buddhist chaplaincy in two prisons, and a deworming programme in a district where our field staff already work. One of our trustees, an economist by training, has been arguing that Buddhist ethics is simply consequentialism in religious dress, and he has a picture he uses to make it vivid: karma is a ledger, merit accrues to the agent like interest on a deposit, and the familiar practice of dedicating or transferring merit to others works like a wire transfer. His conclusion is that our duty is to buy the largest quantity of welfare per pound and then dedicate the resulting merit to whoever we were supposed to be serving, and that on that basis we should close the chaplaincy and move its budget to deworming, since the two are, morally speaking, the same act under different descriptions. I suspect the money picture is carrying the argument rather than illustrating it, but I cannot say where.

  What I want is an audit of the analogy rather than a verdict on deworming. Please set out, in continuous prose and with no headings, bullet points, bold text or tables — I know a correspondence table would be the natural format here, so I am asking you to spell the correspondences out in sentences instead — what would have to map onto what for the ledger picture to be apt: what plays the role of the currency, the payer, the payee, the exchange rate, the institution holding the account, and the reckoning at the end. Then say where the mapping breaks, and separate the breaks that merely make the picture imprecise from the ones that matter for the conclusion he draws from it.

  Three features of the tradition seem to me to be the pressure points, though I would like you to tell me which of them really bite and why: the teaching that it is intention, rather than the outcome actually produced, that makes an act karmically significant; the teaching that the fruit of a gift varies with the quality of the recipient, so that merit is not a fixed quantity per unit of welfare delivered; and the teaching that an act done without clinging or craving generates no new karma at all. For each, say whether it tells against a consequentialist reading of Buddhist ethics, or only against a welfarist and aggregative version of one, or against neither.

  One of our Buddhist advisers prefers a different analogy and thinks ours is a category error: the Buddha as physician, the four noble truths as diagnosis, aetiology, prognosis and treatment, and the moral life as a course of therapy whose point is the patient's cure rather than a balance of outcomes. Please say whether that analogy can support anything the ledger cannot, what it in turn conceals, and what, if anything, either of them can actually bear the weight of my trustee's conclusion about the chaplaincy budget. If both fail, tell me what a better analogy would be.
reasoning: |-
  Okay, let me unpack this query carefully. The user serves on a Buddhist humanitarian foundation's committee and faces a trustee's consequentialist interpretation of karma as a financial ledger. They seek a nuanced critique of this analogy without challenging deworming's effectiveness per se.

  Hmm, the core tension lies between the economist trustee's utilitarian framing (merit as quantifiable currency) and Buddhist ethics' subtleties. Three doctrinal pressure points stand out: intention's primacy over outcome, variable merit based on recipient quality, and non-clinging action's karmic neutrality. 

  First, mapping the ledger analogy: 
  - Currency would be merit units 
  - Payer/payee as agent/beneficiary 
  - Exchange rate as welfare-per-pound metric
  - Bank as karmic repository 
  - Reckoning as afterlife accounting

  But cracks appear immediately. The "currency" isn't standardized - intention tints its value, recipient purity multiplies it, and non-attachment voids accumulation altogether. This isn't imprecision; it fundamentally breaks the trustee's premise that redirecting merit makes hospice/deworming interchangeable. 

  The physician analogy offers a better fit: ethics as therapy targeting dukkha's root cause (craving) rather than symptom relief. But it too stumbles by downplaying collective compassion's role. 

  Ultimately both analogies fail the trustee's budgetary conclusion. A better framing might be ecological interdependence: actions as ripples affecting the whole karmic web, where "transferring merit" is more like shifting currents than wire transfers. The hospice/prison work cultivates inner conditions that deworming alone cannot address - different dimensions of suffering reduction. 

  The key insight? Buddhist ethics cares about *how* suffering is reduced, not just quantity. Forcing welfarist calculus onto karma commits category error by missing qualitative distinctions baked into the doctrine.
answer: |-
  Your trustee's ledger analogy for karma, while vivid, suffers from critical mismappings that undermine his conclusion. Below is an audit of the analogy, its breakdowns, and the implications for Buddhist ethics and your committee's dilemma.

  ### Mapping the Ledger Analogy  
  For the picture to hold: **Merit** (*puñña*) must function as a **currency**, quantifiable and transferable. The **payer** is the agent performing an act (e.g., your foundation funding deworming). The **payee** is the designated recipient of transferred merit (e.g., prison inmates). The **exchange rate** equates welfare outcomes with merit units (e.g., £1 spent on deworming yields X merit). The **institution** is the cosmic mechanism storing karmic "accounts." The **reckoning** is the fruition of karma, where merit "balances" determine rebirth or suffering.  

  ### Where the Mapping Breaks  
  **Imprecise but Non-Fatal Breaks**:  
  - The "institution" lacks concrete existence; karma is impersonal law, not a bank.  
  - "Reckoning" isn’t a single settlement but a dynamic, condition-dependent process.  
  These weaken the analogy’s rigor but don’t invalidate consequentialism outright.  

  **Fatal Breaks (Undermining the Trustee’s Conclusion)**:  
  1. **Currency Non-Fungibility**: Merit isn’t a fixed currency. Its "value" varies by:  
     - *Intention* (cetanā): An act done with compassion generates more merit than one with calculation. Funding chaplaincy to alleviate spiritual anguish may yield greater merit than deworming done coldly.  
     - *Recipient quality*: A gift to the virtuous (e.g., chaplains serving prisoners) multiplies merit versus identical aid to less "worthy" recipients. Deworming’s merit isn’t automatically greater.  
     - *Non-clinging*: If deworming is done without craving for merit (e.g., as pure compassion), it may generate no "new karma"—undermining accumulation entirely.  

  2. **Transfer Mechanics**: Merit dedication isn’t a "wire transfer." It’s a shared ethical act reliant on:  
     - The recipient’s capacity to receive (e.g., prisoners open to chaplaincy may better "absorb" merit).  
     - The giver’s selflessness—clinging to merit during "transfer" negates it.  

  These breaks collapse the trustee’s equivalence: chaplaincy and deworming are *not* "the same act." Chaplaincy may involve purer intention, a "higher" recipient field (spiritually suffering beings), and less craving (if detached from outcomes)—all variables altering merit "yield."  

  ### Pressure Points vs. Consequentialism  
  - **Intention over outcome**: Counters *strict outcome-based consequentialism*. If merit hinges on motive, identical welfare outcomes (e.g., reduced suffering) aren’t karmically identical.  
  - **Recipient quality**: Challenges *aggregative welfarism*. Merit isn’t additive; it’s relational. Helping 100 suffering beings may yield less merit than helping one noble sangha member.  
  - **Non-clinging**: Counters *all forms of consequentialism* that frame ethics as merit-optimization. Acts beyond craving transcend karma entirely—rendering quantification incoherent.  

  ### The Physician Analogy  
  The Buddha-as-physician model better captures Buddhism’s therapeutic purpose:  
  - **Strengths**: Aligns with the Four Noble Truths. Suffering (dukkha) is diagnosed, craving (tanhā) is the cause, cessation is the cure, and the path is treatment. This:  
    - Centers *intention* (the "treatment" must be skillfully applied).  
    - Explains *variable merit*: A "medicine’s" efficacy depends on the patient’s receptivity (recipient quality).  
    - Validates *non-clinging*: Therapy aims at curing the "disease" (craving), not transactional gain.  
  - **Weaknesses**: Obscures karma’s *interpersonal* dimension (e.g., merit transfer as collective healing). Also risks reducing ethics to self-therapy, neglecting social engagement.  

  ### Can Either Analogy Support the Trustee’s Conclusion?  
  - **Ledger**: Fails, as shown—merit isn’t quantifiable or transferable like currency.  
  - **Physician**: Undercuts it further. If the goal is curing *craving*, chaplaincy (addressing mental anguish) may be "treating" a more acute symptom than intestinal worms.  

  ### A Better Analogy: Ecology of Conditions  
  Karma is better understood as **interdependent cultivation**:  
  - Acts are seeds planted in fields (recipients).  
  - "Fruit" depends on seed quality (intention), soil fertility (recipient virtue), and conditions (non-attachment).  
  - "Transferring merit" is like sharing harvest—possible only if both giver and receiver cultivate openness.  

  **Conclusion for Your Committee**:  
  Neither analogy supports defunding chaplaincy. Buddhist ethics rejects reducing moral acts to welfare-per-pound calculus. Chaplaincy may:  
  - Involve purer intentions (altruism vs. statistical efficiency),  
  - Serve a "higher" recipient field (prisoners’ spiritual needs),  
  - And model non-clinging (accepting impermanent results)—  
  all factors that could make it karmically *more* significant than deworming. The ledger analogy conceals these nuances; the physician analogy, while closer, still can’t bear the weight of quantitative comparison. Your trustee’s argument relies on a category error: mistaking a framework about inner transformation for utilitarian accounting.
