  We are translating updateless decision theory (UDT) into the vocabulary of an addiction psychiatrist, using terms like cue-induced craving, extinction, Ulysses contracts, and the planner-doer model.

  Core concepts of ULD (updateless decision theory) in clinical terms:

  1. **Policy**: In UDT, a policy is a complete plan that specifies what action to take in every possible situation (every possible state of information). In clinical terms, this is analogous to a **treatment plan** or **relapse prevention plan** that is designed in advance to cover all foreseeable scenarios. Like a Ulysses contract, it is a set of pre-commitments that bind the future self. The policy is not just a single decision but a full contingency plan.

  2. **Evaluated over**: UDT evaluates a policy by considering the expected utility over all possible worlds (or all possible observations) that the agent might find itself in. In clinical terms, this is like evaluating a treatment plan by considering all the possible symptoms, triggers, and environmental cues that the patient might encounter, and the expected outcomes (sobriety, relapse, side effects) in each case. The evaluation is done from the perspective of the initial, less-informed state (the planner) that does not yet know which scenario will occur.

  3. **Updatelessness**: UDT forbids updating on the specific information that the agent has received when evaluating the policy. That is, even though the agent has learned some particular fact (e.g., that a specific trigger is present), the policy is chosen without taking that specific information into account — the policy is fixed in advance. In clinical terms, this is like the planner (the initial, sober self) making a binding plan that the doer (the future self, possibly under craving) must follow, regardless of what the doer learns or feels at that time. The plan is made without knowing which triggers will occur, but it is designed to work well on average over all possible triggers.

  4. **Why the later self has no standing**: The later self, having more information (e.g., experiencing intense craving or having new information about side effects), might want to deviate from the plan. But UDT argues that the policy was chosen to maximize expected utility from the prior perspective (which averages over all possible future states). Allowing the later self to update and change the plan would lead to time-inconsistency and suboptimal outcomes (like relapse). This is exactly the planner-doer model: the planner (who has a long-term view) binds the doer (who is myopic and focused on immediate rewards) because the planner knows that the doer, when in a state of craving, will discount the future too heavily.

  Translation residue report:

  - **What translated cleanly**:
    - The idea of a "policy" maps directly to a **relapse prevention plan** or **Ulysses contract** that specifies actions for various triggers.
    - The "planner" and "doer" from behavioral economics are directly analogous to the UDT agent at the policy-making time (planner) and the agent at the time of action (doer). The binding of the doer by the planner is a core shared concept.
    - The evaluation of the policy over all possible scenarios (without knowing which one occurs) maps to the way a treatment plan is designed to work in all the situations the patient might face.

  - **What had to be bent to fit**:
    - **Acausal dependence**: UDT often deals with logical counterfactuals and acausal relations (e.g., in Newcomb-like problems). In clinical vocabulary, all dependencies are causal (e.g., a medication blocking receptors). The concept of acausal dependence (where your decision now is correlated with something else without a causal chain) does not have a direct counterpart. We might try to bend it by thinking of a **predictive correlation** that is not causal: for example, a patient's decision to stay sober might correlate with a genetic marker that predicts high willpower, but the marker doesn't cause the willpower — it's just a sign. However, in clinical practice, we focus on causal interventions. The idea of a decision algorithm (the policy) being correlated with a predictor (like a genetic test) without causation is foreign to the clinical vocabulary and can only be described as a statistical association without a known mechanism.

  - **What cannot be said**:
    - **Logical counterfactuals**: The idea that we consider what would happen if the policy (which is a piece of code or algorithm) were different, even if in reality it is fixed, is a logical abstraction without a clinical parallel. We don't have a way to express "if my decision algorithm were different, then the predictor would have predicted differently" because in the physical world, the algorithm is a physical process in the brain and changing it would require changing the brain. The acausal nature of UDT's commitments (where the commitment works by the policy being correlated with a prediction) is not expressible in clinical terms because clinical practice is rooted in causality.

  Now, addressing the three specific points:

  1. **Commitment Devices: Causal vs. Acausal**:
     - In your practice, commitment devices are causal: they physically block access (e.g., a naltrexone implant blocks opioid receptors). In UDT, the commitment is acausal: it works by the decision algorithm (the policy) being such that, if it had been different, the predictor would have known and acted accordingly. There is no physical force preventing the action; instead, the decision is fixed by the policy because any deviation would break the correlation that made the desirable outcome possible. This acausal dependence cannot be stated in clinical vocabulary because it relies on logical counterfactuals and correlations without causation. It is a well-formed idea in UDT but not in a causal framework.

  2. **Updatelessness vs. Sophisticated Binding**:
     - Updatelessness goes beyond simple pre-commitment by evaluating entire policies (contingency plans) over all possible observations, not just a single action. The extra content lies in:
       - **Whole policies**: The evaluation is over the entire function from observations to actions, not just one binding at a single point.
       - **What counts as an observation**: In UDT, an observation can be any information, including information about the past or about predictors that are correlated with the agent's decision algorithm. The key is that the policy must be fixed before the observation is known.
       - **The agent as the policy**: UDT identifies the agent with the policy (the decision algorithm) rather than the momentary self. This means that the agent's action in a given situation is determined by the policy, and the policy is what is chosen once and for all. This leads to the idea that the agent's decision algorithm is what is being predicted by outside predictors (like the genetic test in your case). The sophisticated binding in clinical practice does not usually consider that the predictor might be predicting the entire policy (the algorithm) rather than just the outcome of a single decision.

