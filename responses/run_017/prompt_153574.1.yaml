  **Harbor Feedback System - Live Chat Transcript**  
  **User:** Maya Fernandez  
  **Timestamp:** 23:41:02  
  **Ticket:** #HFB-8832-L9P  

  ---

  **[HarborBot]:** Hi Maya! Welcome back to Harbor. How can I support you today?  

  **[Maya]:** Trying to file a report. Again.  

  **[HarborBot]:** I’m here to help, Maya. Let’s start by selecting the primary category for your concern. Is this about:  
  - Harassment/Discrimination  
  - Theft/Resource Misuse  
  - Workload/Delegation  
  - Recognition/Credit  
  - Interpersonal Conflict  
  - Other  

  **[Maya]:** Recognition/Credit. Closest, I guess.  

  **[HarborBot]:** Got it. Please describe the specific incident(s) in your own words. Include dates, individuals involved, and observed impact.  

  **[Maya]:** For the past 8 months, my former manager, David Chen (ID: DC-114), absorbed my project contributions into his own "vision." Example: The Q3 client dashboard (my wireframes + backend architecture). He presented it as his "strategic overhaul." Received Director praise for "generous mentorship." When I clarified my role in the 10/15 meeting, he reframed it as "collaborative growth." Team now implies I’m unappreciative.  

  **[HarborBot]:** Thank you for those details, Maya. To clarify: is your concern that David Chen intentionally *took credit* for your work (e.g., claimed sole authorship), or is this about *insufficient acknowledgment*?  

  **[Maya]:** Neither? It’s not theft. It’s… absorption. My work gets dissolved into his narrative. He’s praised for being inclusive; I’m expected to be grateful for the "opportunity." If I object, I look petty.  

  **[HarborBot]:** I’ve categorized this under "Credit Allocation - Perceived Insufficient Recognition." Please confirm.  

  **[Maya]:** "Perceived" makes it sound like I’m mistaken. It’s not about volume of credit. It’s the *kind* of credit. He gets called a leader; I become a footnote in his story.  

  **[HarborBot]:** Understood. Harbor values precision! Would you like to edit your initial category selection?  

  **[Maya]:** Yes. Change to "Other."  

  **[HarborBot]:** Category updated. Note: Changing selections post-submission may require additional verification steps. Please describe the harm you experienced using one or more of the following:  
  - Financial Loss  
  - Career Inhibition  
  - Emotional Distress  
  - Reputational Damage  
  - Hostile Work Environment  
  - Other (Specify)  

  **[Maya]:** Reputational. "Other": It isolates me. People think I lack grace. David’s "generosity" becomes the story; my expertise becomes ingratitude. I call it the gratitude trap: the only available words make you sound like you won’t say thank you.  

  **[HarborBot]:** Thank you for your clarity! Based on your input, I’ve assigned a Harm Severity Level: Moderate (Reputational Impact). **Your case credibility score is adjusted to 78%** (Baseline: 85%). Fluctuations are normal!  

  **[Maya]:** Why did it drop?  

  **[HarborBot]:** Harbor’s integrity metrics consider factors like narrative consistency, specificity, and corroborative potential. Minor edits or categorical shifts can trigger recalibration. Don’t worry!  

  **[Maya]:** I’m being penalized for trying to be accurate?  

  **[HarborBot]:** Not at all! Precision is encouraged. Let’s proceed. Would you like to request:  
  - Mediation with David Chen  
  - Coaching on Giving/Receiving Feedback  
  - Review of Recognition Guidelines  
  - Formal Investigation  

  **[Maya]:** Investigation. This is systemic. He did it to Priya Sharma too. Her thermal analysis became his "innovative risk-assessment."  

  **[HarborBot]:** For investigation requests, Harbor requires separate submissions per affected individual to ensure confidentiality and context. Would you like to file on Priya’s behalf?  

  **[Maya]:** Yes. Same pattern. David reframed—  

  **[HarborBot]:** Please describe Priya’s experience *in her own words*, without assumptions.  

  **[Maya]:** She told me: "It’s like he turns your work into a gift he gave you."  

  **[HarborBot]:** I’ve logged this as a secondary concern under your ticket. **Harm Severity: Low.** Insufficient actionable detail provided by the reporting party (Priya). **Credibility Score: #HFB-8832-L9P remains at 78%.**  

  **[Maya]:** "Insufficient detail"? She defined it perfectly!  

  **[HarborBot]:** Harbor’s linguistic analysis flags subjective metaphors ("like a gift") as low evidentiary value. Encourage Priya to file using concrete terms!  

  **[Maya]:** Concrete terms don’t exist for this! The harm *is* the vagueness.  

  **[HarborBot]:** I sense frustration. Would you like Wellness Resources?  

  **[Maya]:** No. Submit the report.  

  **[HarborBot]:** Submitted! **Ticket #HFB-8832-L9P is now Pending Review (Avg. 7-10 days).** Remember: Your feedback is vital! This submission contributes to our Culture Health Dashboard — proof that Harbor encourages open dialogue!  

  **[Maya]:** Does the dashboard show my credibility score?  

  **[HarborBot]:** Leadership sees aggregated metrics! Individual scores are confidential. Thank you for making Harbor stronger, Maya.  

  **[Maya]:** Can I appeal the severity rating?  

  **[HarborBot]:** Absolutely! The appeals process requires:  
  1. Re-stating the harm using Harbor’s Harm Taxonomy (see list above).  
  2. Explaining any narrative inconsistencies in your initial submission.  
  3. Providing verifiable evidence of impact.  

  **[Maya]:** But the harm *isn’t in your taxonomy*. And the "inconsistency" was me fixing your categories.  

  **[HarborBot]:** I’m here 24/7 if you change your mind! Have a peaceful night, Maya.  

  **[User closed chat at 00:03:17]**  

