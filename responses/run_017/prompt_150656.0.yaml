  The mother apparently hates being made into an example and insists she was just doing her job, while pointing out the systemic issue that such a job shouldn't need to exist. The user is worried that praising her as "above and beyond" implies the care was optional, which undermines what the shelter guests deserved. But saying she only did what was required removes grounds for praise and sets unrealistic expectations for her successor. The user also wants to avoid reducing their mother to just her sacrifices, ignoring her personality and other interests.

  The audience includes shelter staff (some with limited capacity), former guests, family members who resent missed holidays, the board, and major donors. The toast needs to be affectionate, not scolding, about 4-5 minutes long, with no philosophical jargon except maybe one subtle line for their advisor.

