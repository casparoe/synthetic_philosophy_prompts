prompt: |-
  I'm an undergraduate in a joint philosophy-and-computer-science programme, taking a seminar this term on the evolution of cooperation. We have worked through the basic machinery — the one-shot and iterated prisoner's dilemma, direct reciprocity and the shadow of the future, reputation and indirect reciprocity, costly punishment and second-order free riding, partner choice and optional participation, and the cultural and genetic group-selection stories. My dissatisfaction with the seminar is that nearly every account we read proves that cooperation can be sustained under some set of conditions and then stops, and the conditions are never measured against each other or against the cases that motivated the literature in the first place. So before I go back to the readings I want the specification: what would a theory of the evolution of cooperation have to get right in order to count as having explained cooperation in the prisoner's dilemma, one-shot and iterated, rather than as having exhibited one more model in which cooperation survives? For each requirement I want the case or consideration behind it, and I want you to mark which requirements are non-negotiable — a theory simply fails if it cannot deliver them — and which are really preferences of one camp or modelling tradition: requiring the mechanism to be an evolutionarily stable strategy, versus requiring it to be learnable and executable by agents with limited memory and attention, versus requiring it to be expressible as a gene-level rather than a culture-level selection story.

  Let me fix what the theory is for, since adequacy is relative to a purpose. My paper wants to argue something specific: that the standard reciprocity-and-reputation story survives by quietly importing features of small-scale face-to-face social life that disappear when interaction is mediated, and I want to test that against a neutral spec rather than against one rival theory. So the list must be one that both the classic mechanisms and the mediated case can be measured against. The cases I insist it handle: substantial cooperation in anonymous one-shot games played for real money, where there is no future with this partner and no audience — and I do not want internalized norm or heuristic brought from daily life to count as an answer unless the theory also says where the norm came from, what holds it in place, and when it unravels; the fact, which surprised me, that cooperation often erodes across the rounds of a laboratory iterated dilemma instead of growing, even though the reciprocity story seems to predict the opposite; robustness to noise and misperception, which I want treated as a requirement and not as a sensitivity analysis, since I suspect several celebrated reciprocity results are far more brittle than the seminar presentation implied; the enforcement regress, i.e. who punishes the defectors, what stops the person who free rides on punishment, and at what cost to the group; and scaling, i.e. which mechanisms compose upward from dyads to n-player public-goods settings and which only work in pairs.

  The case I most want the list to strain is this one, which I have been thinking about since a seminar exercise and which I have not seen discussed. Suppose two principals, who will never meet and have no shared community, each delegate their move to a software agent. The agents can commit in advance rather than deciding on the spot; each can be audited, so that one may verify how the other will move rather than having to infer it from behaviour; and in the variant that interests me most, each principal deploys many copies of the same policy across many different pairings, so that what copy A does on Monday is visible to whoever meets copy B on Tuesday. In that setting reputation attaches to code rather than to a face, commitment is available in a way it is not for humans, and the same-policy-meets-itself structure seems to make cooperation available without either repeated interaction with the same partner or gossip about them. I would like the specification to say what a theory must deliver to cover this: whether it is a genuinely distinct mechanism or whether the list forces it to collapse back into reputation or reciprocity under a new name, what would have to be true of the world for it to matter, and — this is the part I care about — which requirement this case satisfies trivially while the human cases struggle, and which requirement it strains that the human cases pass easily. Finally: which pair of requirements you suspect cannot be jointly satisfied, which single requirement does the most work in eliminating otherwise plausible accounts, and then, in one closing paragraph and with no readings or citations (I can find those myself), which familiar accounts your list hurts most and which it lets off more easily than you expected.
reasoning: |-
  We are constructing a specification for a theory of the evolution of cooperation to explain cooperation in the prisoner's dilemma (one-shot and iterated) and related settings. The theory must not only show that cooperation can be sustained under some conditions but also meet a set of requirements that make it explanatory for the cases of interest.

  The cases to be handled include:
  1. Substantial cooperation in anonymous one-shot games for real money, without future interaction or audience.
  2. The erosion of cooperation across rounds in laboratory iterated dilemmas (contrary to reciprocity predictions).
  3. Robustness to noise and misperception (as a core requirement).
  4. The enforcement regress: who punishes defectors and how second-order free riding is prevented.
  5. Scaling: from dyads to n-player public goods settings.

  Additionally, we have a specific case: two principals using software agents with the features of commitment, auditability, and reputation at the policy level (not the individual agent level). We want to see how this case fits and what it reveals about the requirements.

  We will list requirements, each with:
  - The case or consideration behind it.
  - Whether it is non-negotiable (fails without it) or a preference of a camp (e.g., evolutionary stability, learnability, gene-level).

  Then, we will address the software agent case and how it relates to the requirements.

  Finally, we will note:
  - Which pair of requirements might be hard to satisfy jointly.
  - Which single requirement does the most work in eliminating accounts.
  - In one paragraph, which familiar accounts are hurt most and which are let off easily.

  ---

  **Requirements for a Theory of the Evolution of Cooperation**

  1. **Requirement: Explain one-shot cooperation without repeated interaction or audience effects.**
     - **Case behind it**: Anonymous one-shot prisoner's dilemma experiments (e.g., in labs) where substantial cooperation is observed (often around 50% or more). The theory must account for this without relying on future encounters or reputation.
     - **Non-negotiable?** Yes. If the theory only works for repeated games, it fails for one-shot.
     - **Note**: Internalized norms or heuristics are allowed only if the theory explains their origin, stability, and unraveling conditions.

  2. **Requirement: Account for the erosion (not growth) of cooperation in iterated dilemmas in lab settings.**
     - **Case behind it**: In some laboratory iterated prisoner's dilemma experiments, cooperation starts high but decays over rounds (contrary to the prediction of direct reciprocity that the shadow of the future should sustain or build cooperation).
     - **Non-negotiable?** Yes. The theory must explain both the emergence and the decay when observed.

  3. **Requirement: Robustness to noise and misperception.**
     - **Case behind it**: Real-world interactions are noisy (errors in execution, perception). Many reciprocity models (e.g., Tit-for-Tat) break down with even small noise (e.g., leading to vendettas). The theory must show how cooperation is maintained despite errors.
     - **Non-negotiable?** Yes. Without robustness, the mechanism is not evolutionarily plausible.

  4. **Requirement: Resolve the enforcement regress.**
     - **Case behind it**: In models with punishment (e.g., for defection), there is a problem of who punishes the defectors and who punishes those who do not punish (second-order free riders). The cost of punishment must be accounted for, and the regress must stop without collapsing the system.
     - **Non-negotiable?** Yes. A theory that relies on punishment must solve this.

  5. **Requirement: Scale from dyads to n-player public goods games.**
     - **Case behind it**: Many real-world cooperative dilemmas involve groups (public goods games). Mechanisms that work in dyads (like direct reciprocity) often fail in larger groups due to dilution of incentives and monitoring challenges.
     - **Non-negotiable?** Yes. The theory must work in the n-player setting if it is to explain human cooperation beyond pairs.

  6. **Requirement: Be evolutionarily stable (or otherwise resistant to invasion by defectors).**
     - **Case behind it**: In evolutionary game theory, a strategy that is cooperative must be able to resist invasion by defectors in the population. This is a standard requirement in the field.
     - **Non-negotiable?** Not strictly non-negotiable for all camps, but highly desirable. Some may prefer a weaker condition (e.g., convergence stability). However, for the purpose of this spec, we mark it as a preference (evolutionary stability camp) but note that without some form of stability, the mechanism cannot persist.

  7. **Requirement: Be learnable and executable by agents with limited memory and attention.**
     - **Case behind it**: Humans (and animals) have cognitive limits. Strategies that require infinite memory or complex computations are not plausible. This is especially relevant for indirect reciprocity which requires tracking reputations.
     - **Non-negotiable?** Preference (cognitive camp). However, for the mediated case (software agents), this may be relaxed.

  8. **Requirement: Be expressible at the gene level or culture level without ad hoc assumptions.**
     - **Case behind it**: Some theories (e.g., group selection) require cultural transmission or genetic evolution. The theory should specify the level of selection and how it operates without just-so stories.
     - **Non-negotiable?** Preference (depends on camp). Some insist on gene-level, others allow cultural evolution. We note that for the software agent case, this might map to code transmission (cultural analog).

  **Additional Requirements from the Software Agent Case**

  The software agent scenario:
  - Two principals never meet, delegate to agents.
  - Agents can commit (so no need for trust in the moment).
  - Auditability: one can verify the other's code (so no inference from behavior needed).
  - Reputation at the policy level: many copies of the same policy are deployed, so behavior of one copy informs about the policy, which affects interactions with other copies of the same policy or with others.

  This setting seems to allow cooperation without repeated interaction with the same partner or gossip. We need to see how the theory accounts for this and what it reveals about the requirements.

  9. **Requirement: Explain cooperation without repeated interaction with the same individual.**
     - **Case behind it**: The software agent case: the same policy is used in multiple independent interactions, so even though a particular agent copy is one-shot, the policy's behavior is known via audit or via the behavior of other copies (reputation at the policy level).
     - **Non-negotiable?** Not a new requirement, but an instance of the one-shot requirement (1) and scaling (5). However, it forces the theory to handle reputation at the group (policy) level.

  10. **Requirement: Allow for commitment and verification.**
      - **Case behind it**: Software agents can commit to a strategy and be audited. In human interactions, commitment is often not possible or verifiable.
      - **Non-negotiable?** Not for all cases, but the theory must be able to incorporate commitment when available. This is a feature of the environment that can be turned on or off.

  **How the Software Agent Case Interacts with Requirements**

  - **Trivially satisfied in software agent case, hard for humans**:
    - Commitment and verification (Requirement 10): Agents can commit and be audited, so there is no uncertainty about the strategy. This removes the need for building trust through repeated interaction or reputation from behavior. Humans struggle with this because they cannot commit (they can change their mind) and cannot perfectly verify intentions.
    - Robustness to noise (Requirement 3): With perfect commitment and audit, there is no noise in execution or perception (if the code is deterministic and correctly executed). Humans face noise in behavior and perception.

  - **Strained in software agent case, easy for humans**:
    - Learnability and limited cognition (Requirement 7): The software agents can have arbitrarily complex strategies, whereas humans are bounded. So the theory must account for how cooperation arises under bounded cognition in humans, but in the software case, this constraint is relaxed.
    - Expressibility at gene/culture level (Requirement 8): The software case is about code (culture-like) and does not require a genetic story. For humans, the theory must bridge both.

  **Analysis of the Software Agent Case**:
  - This is a form of **reputation at the policy level** (or type level). It is similar to indirect reciprocity but without needing a gossip network because the behavior is directly observable (via audit) or inferable from the behavior of identical copies. It also resembles **group selection** in that the policy (a "group" of copies) is selected based on its average success.
  - However, it is distinct from classic reciprocity because there is no repeated interaction with the same individual. It is also distinct from classic indirect reciprocity because there is no need for a shared reputation system (each principal can learn about the policy by auditing or by seeing other interactions).
  - Conditions for it to matter: The world must have many interactions with different partners, and the ability to deploy multiple copies of the same policy. Also, the cost of auditing must be low.

  **Hard-to-Satisfy Joint Requirements**:
  - Requirement 1 (one-shot cooperation) and Requirement 3 (robustness to noise) together are very hard. One-shot cooperation without reputation or reciprocity often relies on innate tendencies (like a norm) but then must explain how that norm is robust to errors and defectors. Also, in noisy environments, maintaining one-shot cooperation is challenging because errors might be misinterpreted as defection.

  - Requirement 4 (enforcement regress) and Requirement 5 (scaling to n-players) are also tough. Punishment in large groups is costly and second-order free riding becomes a bigger problem.

  **Single Requirement Doing the Most Work**:
  - Requirement 1 (one-shot cooperation) is a major filter because many theories (direct/indirect reciprocity) rely on repeated interactions or reputation. Only a few accounts (like strong reciprocity, group selection, or cultural evolution of norms) can address it, and they must then meet the other requirements.

  **Which Accounts Are Hurt Most and Which Are Let Off**:

  *In one paragraph*:

  The requirement of one-shot cooperation (1) hurts direct reciprocity and classic indirect reciprocity, which depend on repeated encounters or reputation. The erosion of cooperation in iterated games (2) further challenges direct reciprocity. Robustness to noise (3) is damaging to Tit-for-Tat and other reactive strategies. The enforcement regress (4) is a blow to costly punishment models (e.g., Fehr and Gachter) unless they solve second-order free riding. Scaling (5) eliminates dyad-only mechanisms like pairwise reciprocity. The software agent case is handled well by policy-level reputation, which is a form of indirect reciprocity at the type level, but it is let off easily on cognitive requirements. Group selection and cultural evolution accounts might fare better on one-shot cooperation and scaling, but they must still handle the enforcement regress and robustness. The surprise is that the software agent case, while novel, is covered by extending reputation to types, which is a known idea, so it does not require a fundamentally new mechanism.
answer: |-
  Below is a specification for what a theory of the evolution of cooperation must achieve to genuinely explain cooperation in the prisoner's dilemma (both one-shot and iterated), rather than merely demonstrating another model where cooperation survives. The requirements are derived from empirical and conceptual challenges, with each grounded in a specific case or consideration. I distinguish **non-negotiable requirements** (failure to meet them invalidates the theory) from **preferences** (which reflect modeling traditions or camp-specific priorities, e.g., evolutionary stability vs. cognitive plausibility vs. gene-level selection). The specification is designed to be neutral, allowing you to test your hypothesis about reciprocity-and-reputation's reliance on small-scale social features against mediated cases like your software agent example.

  ---

  ### **Core Requirements for Explanatory Adequacy**
  *(Non-negotiable = NN; Preference = P)*

  1. **Explain robust one-shot cooperation without hidden reciprocity**  
     - **Case/consideration**: Substantial cooperation (e.g., 40–60% in lab studies) occurs in anonymous, one-shot prisoner's dilemmas with real monetary stakes, no future interactions, and no audience. Examples: Experimental economics data (e.g., Camerer 2003).  
     - **Why NN?** If a theory cannot account for this, it fails for a foundational empirical case. Internalized norms/heuristics are inadmissible unless the theory explains their origin (e.g., via cultural evolution), stability (e.g., against erosion from defectors), and unraveling conditions (e.g., when anonymity increases).  
     - **Preference clash**: Gene-level selectionists (P) demand a genetic or evolutionary basis; cognitive/modeling camps (P) accept learned heuristics if cognitively plausible.

  2. **Account for cooperation erosion in iterated dilemmas**  
     - **Case/consideration**: Laboratory iterated prisoner's dilemmas (e.g., finite rounds with strangers) often show cooperation *declining* over time (e.g., Dal Bó & Fréchette 2011), contradicting reciprocity predictions that the "shadow of the future" should sustain or grow cooperation.  
     - **Why NN?** A theory must explain both the initial cooperation and its decay, not just stable equilibria. This reveals fragility in mechanisms like Tit-for-Tat.  
     - **Preference clash**: Evolutionary stability camps (P) focus on ESS robustness; cognitive camps (P) attribute decay to learning from negative experiences.

  3. **Robustness to noise and misperception as a core mechanism**  
     - **Case/consideration**: Real-world interactions involve errors (e.g., unintended defections). Noise causes "unravelling" in many reciprocity models (e.g., Tit-for-Tat spirals into mutual defection). Experiments show cooperation persists despite noise if mechanisms are error-tolerant (e.g., Nowak & Sigmund 1993).  
     - **Why NN?** Noise is ubiquitous in biological and social systems; a non-robust mechanism is evolutionarily irrelevant.  
     - **Preference clash**: Not a camp issue—this is universally NN, but some models treat it as secondary "sensitivity analysis."

  4. **Resolve the enforcement regress**  
     - **Case/consideration**: Punishment-based mechanisms (e.g., altruistic punishment) face infinite regress: who punishes defectors? Who punishes non-punishers (second-order free riders)? Costly punishment must not undermine group fitness (e.g., Boyd et al. 2003).  
     - **Why NN?** Without this, punishment is not evolutionarily stable. The regress collapses theories that rely on peer punishment.  
     - **Preference clash**: Group-selectionists (P) use metapunishment; gene-level individualists (P) reject group-level stories unless genetically grounded.

  5. **Scale to n-player public goods dilemmas**  
     - **Case/consideration**: Human cooperation often involves groups (e.g., public goods games). Dyadic mechanisms (e.g., direct reciprocity) fail in n-player settings due to dilution of incentives, anonymity, and higher free-rider incentives (e.g., Fehr & Gachter 2000).  
     - **Why NN?** Since most real-world cooperation is multiplayer, a theory limited to dyads is insufficient.  
     - **Preference clash**: Cognitive camps (P) emphasize individual recognition limits; group-selectionists (P) handle scaling better.

  ---

  ### **Preference-Based Requirements (Modeling Traditions)**  
  *(These reflect camp-specific priorities but are not inherently fatal if unmet.)*

  6. **Evolutionary stability (e.g., ESS or robustness to invasion)**  
     - **Case/consideration**: In evolutionary biology, cooperative strategies must resist invasion by defectors in a population (e.g., Maynard Smith 1982).  
     - **Preference**: Favored by gene-level and evolutionary game theory camps. Not NN if the theory explains transient cooperation (e.g., via cultural group selection).

  7. **Cognitive plausibility (learnable and executable with limited memory/attention)**  
     - **Case/consideration**: Humans operate under cognitive constraints—e.g., memory limits rule out perfect recall in repeated games (e.g., Milinski & Wedekind 1998). Heuristics like "win-stay, lose-shift" are cognitively realistic.  
     - **Preference**: Favored by behavioral economics and cognitive camps. Gene-level camps may ignore this if genes encode strategies.

  8. **Selection-level consistency (gene vs. culture)**  
     - **Case/consideration**: Gene-culture coevolution (e.g., Boyd & Richerson 1985) requires specifying whether cooperation arises from genetic evolution (e.g., kin selection) or cultural transmission (e.g., norms).  
     - **Preference**: Gene-level camps (P) demand genetic explainability; culturalists (P) accept purely cultural mechanisms.

  ---

  ### **Your Software Agent Case: Requirements and Strain**
  **Scenario**: Principals deploy software agents with commitment (pre-commit to moves), auditability (verify code), and policy-level reputation (one agent's behavior informs about the policy for future interactions with other copies). This enables cooperation without repeated partner interactions or gossip.  

  - **Is this a distinct mechanism?**  
    Yes—it is **policy-level selection**, a hybrid of commitment and reputation. Unlike classic reciprocity, cooperation emerges from the *design* of the policy (auditable commitment) and *selection across instances* (reputation at the code level). It is not reducible to reciprocity because there is no repeated interaction with the same entity, nor to indirect reciprocity because no "gossip network" is needed—auditability provides direct verification.

  - **When would it matter?**  
    This requires a world with:  
    - High stakes for commitment (e.g., irreversible decisions).  
    - Low-cost auditing (verifying code is cheaper than inferring behavior).  
    - Many interactions with policy-carrying agents (so reputation externalities matter).  
    This fits mediated interactions (e.g., blockchain smart contracts, AI marketplaces) but not face-to-face human settings.

  - **Requirements satisfied trivially (where humans struggle):**  
    - **Commitment/verification (derived from Requirement 1)**: Software agents trivially satisfy this via code audit, eliminating trust issues. Humans struggle with commitment (e.g., reneging) and verification (e.g., hidden intentions).  
    - **Robustness to noise (Requirement 3)**: Code execution is deterministic; noise (e.g., errors) is negligible. Humans face high noise (miscommunication, mistakes).  
    - **Enforcement regress (Requirement 4)**: Punishment is automated and costless (e.g., code rejects defectors), avoiding second-order free riders. Humans incur costs to punish.  

  - **Requirements strained (where humans excel):**  
    - **Cognitive plausibility (Requirement 7)**: Software handles unlimited complexity; humans require simple heuristics. A theory relying on complex code fails for humans.  
    - **One-shot cooperation (Requirement 1)**: Humans cooperate without explicit commitment/audit; the theory must explain this "leap." Software relies on these crutches.  
    - **Erosion in iterated play (Requirement 2)**: Software policies are static; humans decay due to learning. A theory must explain why erosion occurs in humans but not code.

  ---

  ### **Critical Trade-offs and Eliminative Power**
  - **Hardest joint requirement pair**: **One-shot cooperation (1) + Robustness to noise (3)**. Noise amplifies exploitation in one-shot settings, forcing theories to explain why cooperators don't unilaterally unravel. Most reciprocity models fail here; only norm-based or group-selectionist theories have partial answers.  
  - **Most eliminative single requirement**: **One-shot cooperation (1)**. It eliminates pure reciprocity models (direct/indirect), which rely on repeated interaction or reputation. Punishment models also struggle unless they explain norm origins.  
  - **Second most eliminative**: **Enforcement regress (4)**, which sinks naive punishment theories (e.g., altruistic punishment without meta-punishment).

  ---

  ### **Impact on Familiar Accounts (No Citations)**  
  Your specification hurts **direct and indirect reciprocity** the most: they fail one-shot cooperation (1), struggle with erosion (2), and are brittle to noise (3). **Costly punishment** models are crippled by the enforcement regress (4) and scaling (5). **Group-selectionist** accounts (cultural/genetic) fare better on one-shot cases (1) and scaling (5) but are vulnerable to unraveling (2) and cognitive critiques (7). Surprisingly, **classic reciprocity is let off easier than expected** on scaling (5)—dyadic reciprocity can scale via networks (e.g., Ohtsuki et al. 2006)—but it fails utterly on one-shot cases (1). The **policy-level mechanism** in your software case escapes many requirements (e.g., noise, regress) but succumbs to cognitive implausibility (7) for humans. Overall, the list reveals that no dominant theory fully satisfies all NN requirements, exposing gaps your paper can exploit.
