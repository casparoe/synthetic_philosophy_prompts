  Design me something we can actually run in a seminar room — no laptops, no real money — where they run into it themselves before I name it. My rough thought is secret roles: most students are "predictors" trying to guess what comes next in a sequence, one or two are planted agents whose score depends not on what happens but on what the predictors end up believing. But design whatever really works, with rules, a scoring scheme, and a debreif that maps what happened onto (i) prediction weighted toward simple hypotheses, (ii) hypotheses that contain agents with their own aims, and (iii) why "just rule out the agent-y hypotheses" is harder than it sounds.

