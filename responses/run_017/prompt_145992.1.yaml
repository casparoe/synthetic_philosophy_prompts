prompt: |-
  I write a weekly column on science and ideas, and maybe twice a week I also get handed someone else's piece for the fact-check pass before it goes up — twenty minutes, no paywall access, and whatever I write has to survive a read by our lawyer. The thing I keep running into, and keep bodging, is claims that are neither true nor false. I want a procedure, not a theory essay.

  Some of what I'm dealing with. A source says, in the same breath as his denial: "what I am telling you right now is not true." A press office sends over a line to run as a pull quote: "no major outlet has ever accurately reported this meeting" — in a piece that would itself be a major outlet reporting the meeting. A sympathetic researcher, whose data I've seen and believe, ends her statement with "my account of the incident is accurate," and I want to be able to write "she's telling the truth" and I suspect I can't. Plus the ordinary mush: "hundreds of scientists," "the treatment works," "experts say," and the self-exempting kind — "any attempt to check this claim is itself part of the disinformation" — which I've started calling shields in my notes. My desk slang: loopers for claims whose truth depends on themselves, shields for claims that try to disqualify their own evaluation, fuzzies for the vague ones.

  What I half remember from one philosophy elective: something like Tarski on not being able to call sentences in your own language true, and the idea that some sentences just sit in a gap, and that "not true" is not the same as "false," and that if you patch that by saying "not true" you get a new version of the same problem back. If any of that is wrong, correct it, but only as much as the procedure needs.

  What I want is something my desk can actually run in twenty minutes on a claim, in this order: what to ask first, what counts as a good enough answer at each step, and which verdict to print. Specifically: when the verdict is a plain true or false; when it's "no truth value, and here's the one-sentence way to say that to readers without sounding like a philosophy major"; when the only honest move is to quote the sentence and describe its shape instead of grading it; and when the procedure has to stop and hand the thing to an editor because it's a values call, not a factual one — I think the false-versus-misleading choice is one of those, tell me if it is. Say explicitly where judgement can't be removed, and what the checklist refuses to rule on (I don't need it to adjudicate claims about the future, and it shouldn't try).

  Then run it on the three above, and add one case where the answer you get is one I won't like — I have a feeling it's the researcher one, where I want to defend her and the procedure won't let me print that she's telling the truth. And at the end, the two or three sentences I should put in the style guide so this is consistent across writers who've never thought about any of this. No bibliography, I don't need citations, just the procedure.
reasoning: |-
  Okay, the user writes a science column and fact-checks articles. They're dealing with tricky claims that aren't straightforwardly true or false and want a practical procedure to handle them quickly. I need to create a step-by-step guide that's efficient for their 20-minute fact-checking window.

  First, I should categorize the problematic claims they mentioned: loopers (self-referential), shields (block verification), and fuzzies (vague). The user referenced Tarski's undefinability theorem - which states a language can't define its own truth predicate - but they need practical application, not theory.

  The core challenge is distinguishing between false claims and non-truth-valuable statements. For the procedure, I consider designing a decision tree with specific checkpoints: first assess truth-valuability, then verifiability, then precision. Key outputs would be TRUE/FALSE, NO TRUTH VALUE, or DESCRIBE STRUCTURE. Also need to flag VALUE JUDGEMENT cases to editors.

  For the style guide, I plan concise phrasing like "unverifiable" or "logically circular" that avoids philosophy jargon. The researcher example will be painful - her "accurate account" declaration is performative, not verifiable, so we can't call it "true" even if we trust her data.

  I'll test the procedure on their examples: the paradoxical denial becomes a looper, the press office quote is structurally contradictory, and the researcher's statement gets structural description. For an unwelcome outcome, I'll show how "hundreds of scientists" might fail verification despite being plausible.

  Critical design points: the checklist must refuse to rule on future claims or value-laden assertions. Every step should note where human judgment is unavoidable. The final style guide snippets must ensure consistency across writers.
answer: |-
  Here's a 20-minute procedural checklist for your fact-check pass. It prioritizes operational questions over philosophical depth and includes explicit judgment flags.

  **Fact-Check Procedure: "Truth Value" Assessment**

  **Goal:** Classify a specific *claim* (a single sentence or distinct assertion) as **TRUE**, **FALSE**, **NO TRUTH VALUE (NTV)**, or **REQUIRES EDITORIAL JUDGMENT (REJ)**. Output a reader-friendly verdict or description.

  **Core Principle:** **Only verifiable claims about the observable world (past or present) get TRUE/FALSE.** Judgment is required at multiple steps; the procedure highlights where.

  ---

  **The Checklist (Run in Order):**

  1.  **IS IT A CLAIM ABOUT FACTS? (Or is it Opinion/Value/Future?)**
      *   **Ask:** Does this assert something *objectively checkable* about past/present reality? (e.g., "The sky is blue" = factual. "Blue is the best color" = opinion. "It will rain tomorrow" = future).
      *   **Good Enough Answer:** If it's clearly opinion, value judgment, prediction, instruction, or pure emotion (**REJ**). Hand to editor with note: "Value/Opinion/Future Claim - Needs framing, not fact-check." **STOP HERE.**
      *   **Judgment Needed:** Distinguishing factual assertion from opinion/value-laden phrasing.

  2.  **IS IT VERIFIABLE? (Or is it Uncheckable?)**
      *   **Ask:** Can evidence *conceivably exist* to prove or disprove this *right now*? (e.g., "Hundreds of scientists signed" = verifiable if signatories exist. "The treatment works" = verifiable via studies/outcomes. "My account is accurate" = uncheckable *as stated* - needs external evidence. "Any attempt to check is disinfo" = explicitly unverifiable).
      *   **Good Enough Answer:** If no conceivable evidence exists *or* the claim explicitly blocks verification (**Shield**), it's **NTV**. Output: "**Unverifiable Claim.**" **STOP HERE.**
      *   **Judgment Needed:** Assessing if evidence *could* exist and isn't blocked. "Fuzzies" often fail here unless context provides verifiable anchors.

  3.  **IS IT PRECISE? (Or is it Fuzzy?)**
      *   **Ask:** Are key terms defined clearly enough for verification? (e.g., "Major outlet"? "Hundreds"? "Works"? "Experts"?).
      *   **Good Enough Answer:** If terms are too vague to pin down evidence (**Fuzzy**), it's **NTV**. Output: "**Vague Claim (Unverifiable).**" **STOP HERE.**
      *   **Judgment Needed:** Deciding if context provides adequate definition for key terms. If unsure, default to NTV.

  4.  **IS IT SELF-CONTAINED? (Or is it Self-Referential/Paradoxical?)**
      *   **Ask:** Does the claim's truth *depend entirely on itself* or create a logical paradox? (e.g., "What I am telling you right now is not true" = **Looper**. "No major outlet has ever accurately reported this meeting" in *this* report = **Looper**).
      *   **Good Enough Answer:** If yes, it's **NTV**. Output: "**Logically Circular/Paradoxical Claim.**" **STOP HERE.**
      *   **Judgment Needed:** Identifying self-reference and logical inconsistency.

  5.  **ATTEMPT VERIFICATION:**
      *   **Ask:** Using available sources (paywall access, trusted databases, direct source checks within 15 mins), can you find sufficient evidence to confirm or refute the *precise, verifiable, factual* claim?
      *   **Good Enough Answer:**
          *   **Clear Confirming Evidence:** **TRUE**. State the claim is accurate.
          *   **Clear Contradicting Evidence:** **FALSE**. State the claim is inaccurate.
          *   **Insufficient/Conflicting Evidence:** **NTV**. Output: "**Unsubstantiated Claim**" or "**Evidence is Inconclusive.**"
          *   **True Literally But Misleading:** **REJ**. Hand to editor: "Literally true but potentially misleading - Needs contextual framing."
      *   **Judgment Needed:** Assessing evidence sufficiency/quality. Deciding "literally true but misleading" vs. "false" is a core **REJ** case.

  **Output Key:**
  *   **TRUE/FALSE:** Verifiable factual claims with clear evidence.
  *   **NTV (No Truth Value):** Unverifiable, Vague, Self-Referential/Paradoxical, or Insufficient Evidence claims. Use the specific descriptor from steps 2-4 or 5.
  *   **REJ (Requires Editorial Judgment):** Opinions/Values/Future claims, Literally-True-But-Misleading claims. Hand to editor immediately.

  **What the Checklist Refuses to Rule On:**
  *   Claims about the future.
  *   Pure opinions, value judgments, or instructions.
  *   Claims where "truth" is purely performative or internal (like "I am telling the truth").
  *   Deciding if a literally true claim is "misleading" - that's framing/context (**REJ**).

  ---

  **Running Your Examples:**

  1.  **Source: "What I am telling you right now is not true."**
      *   Step 1: Factual? (Attempts to be, paradoxically). Proceed.
      *   Step 2: Verifiable? (No, depends on itself). **NTV - Looper** - Output: "**Logically Paradoxical Claim.**" **STOP.**

  2.  **Press Office Quote: "No major outlet has ever accurately reported this meeting." (In your report)**
      *   Step 1: Factual? (Yes). Proceed.
      *   Step 2: Verifiable? (Yes, in principle). Proceed.
      *   Step 3: Precise? (Debatable "major"/"accurately", but proceed). Proceed.
      *   Step 4: Self-Contained? **NO!** It inherently includes *this* report. **NTV - Looper** - Output: "**Logically Circular Claim (self-referential in context).**" **STOP.**

  3.  **Researcher: "My account of the incident is accurate."**
      *   Step 1: Factual? (Yes, asserts accuracy). Proceed.
      *   Step 2: Verifiable? **NO.** The claim *about* her account's accuracy isn't verifiable by checking the account itself; it requires *independent evidence of the incident* to compare against. It's a performative speech act, not a verifiable fact. **NTV - Unverifiable (as stated)** - Output: "**Unverifiable Claim.**" (You *can* fact-check the *content* of her account using her data, but *not* this meta-statement about its accuracy. Verifying the data makes the account *supported*, not magically makes "I am telling the truth" a TRUE fact. This is the answer you won't like).

  **The Unwelcome Outcome You Predicted:**
  *   **Claim: "Hundreds of top scientists agree the policy is dangerous."**
      *   Step 1: Factual? (Yes). Proceed.
      *   Step 2: Verifiable? (Yes). Proceed.
      *   Step 3: Precise? **NO.** "Hundreds" = fuzzy, "top" = extremely fuzzy/subjective, "dangerous" = value-laden/fuzzy. **NTV - Vague Claim (Unverifiable).** Output: "**Vague Claim (Unverifiable).**" **STOP.** (Even if you *believe* it's likely true, the terms prevent definitive verification).

  ---

  **Style Guide Snippets (2-3 Sentences):**

  > **For Fact-Checking Verdicts:** We label claims TRUE or FALSE only if they are specific, verifiable facts with clear evidence. Vague, unverifiable, self-contradictory, or unsubstantiated claims get flagged as "Unverifiable," "Vague," "Logically Circular," or "Unsubstantiated" – these lack a simple truth value. Value judgments, opinions, predictions, or literally-true-but-misleading claims require editorial framing, not a fact-check verdict.

  > **Avoid:** Using "true" for statements like "I am telling the truth" or "This is accurate." Verify the *content*, not the self-declaration. Label uncheckable claims by their structure (e.g., "self-referential," "blocks verification").
