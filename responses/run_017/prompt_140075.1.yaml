prompt: |-
  Hi — please answer as a political philosopher who does paid consulting for city governments on commemoration and symbolic-reparation questions, and take your time: before you commit to anything I'd find it genuinely useful if you brainstorm out loud for a bit about what principles could even be in play here, and then lay out a short table of each candidate rule and what it predicts about my case. Don't sit on the fence at the end — I need a recommendation, not a survey.

  I've just been appointed to my city's Naming and Memorials Commission and I've spent the weekend reading through about a decade of its written decisions, and I honestly cannot work out what rule it thinks its applying. The track record: (1) an equestrian statue of a Confederate cavalry general on Courthouse Square, put up in 1911 by a Confederate memorial association, was removed 5–2 and put in storage (not destroyed); (2) a street named for a merchant who made his fortune in the slave trade and later endowed the city's first public library was kept 4–3, on the stated ground that the name has become "purely a navigation aid" and nobody in this city knows or cares who he was, with a marker rejected as "odd"; (3) a statue of a Progressive-era reform mayor who built the parks and the sewer system but who also authored the 1916 residential segregation ordinance and testified for a state eugenics bill was kept 6–1 with a new interpretive plaque; (4) an elementary school named for a prominent sterilization advocate was renamed 7–0 after a local educator, reasoning that a school is a place children are compelled to attend and are asked to look up to a name, which is different from a statue you can walk past; (5) a statue of a segregation-era governor was taken off the capitol grounds and relocated to the county history museum with interpretive material, 4–3 (dissenters wanted it gone, one wanted it left alone); (6) a bust of a labor leader who was tried and acquitted in a factory bombing that killed two night watchmen, honored for organizing the eight-hour-day strike, was kept with no plaque, 6–1, on the grounds that what he is commemmorated for is seperable from what he is condemned for; (7) a 1925 "Pioneer Mother" monument with no named individuals, celebrating settlement, was removed 4–3 because it "commemorates a process of dispossession as though it were a finished achievement" and names no one whose record can be weighed; (8) a 1961 bronze plaque honoring the city's founders that listed only white men was neither removed nor replaced but reworded by consensus; and (9) the commission has twice declined to touch the city's own name (it's named for a man who bought and sold enslaved people), saying that's above its pay grade.

  Next month's docket is this: a bronze bust, installed in 1981 in the lobby of the central public library, of Councilwoman Ora Bell Kendrick — the first Black woman elected to the city council, who led the fights to desegregate the schools and to desegregate public housing. In 1977–79 she was also the loudest local backer of the state habitual-offender law, publicly defended the police chief through the scandal in which three men's confessions were later found to have been coerced (two of them were exonerated after eleven years; she never apologized and said at the time that the department "knows who the real criminals are"), and she spoke at a rally against the 1978 gay-rights ordinance in language about protecting children. The bust was paid for in small donations collected by neighborhood clubs and installed over the objection of the council of the day, which had refused city funds for it. It is the only piece of public sculpture in the city depicting any Black person, and the only one depicting a woman who isn't an allegorical figure; school groups get their photos taken with it and the library's teen reading prize is named after her — and her family has said privately that if the bust comes down they'll pull the prize money. There's a removal petition from a coalition of a local gay-rights group and the families of two of the exonerated men; a counter-petition to keep it from her old neighborhood association (majority Black) and the local branch of a national civil-rights organization; the library staff want it kept but moved out of the lobby into the local-history room; and one commissioner has floated relocating it to the history museum along the lines of the governor precedent.

  So: what should we do if we want to be consistent with ourselves, and which of those nine is the closest analog and why? Give me the two or three rules that fit the whole earlier track record but come apart on Kendrick, say what each predicts, and tell me which you'd go with and why. If you think our precedents genuinely underdetermine it, say so plainly and tell me what principle we'd be committing ourselves to with each of the live options (leave it, leave it with a plaque, move it within the library, move it to the museum, remove it). Also: does it matter morally, and not just politically, that she's a Black woman and that the city's public sculpture is otherwise all white men — i.e. is there a real principle about who gets to be commemmorated at all, or is that just a tiebreaker we're dressing up? Should we discount her family's funding threat entirely? If your answer is some version of keep-and-contextualize, tell me roughly what a plaque should say. And finally, name one further case you'd put on the docket, if you could, to tell the leading rules apart.
reasoning: |-
  Hmm, this is a complex and nuanced case that requires careful consideration as a political philosopher consulting on commemoration policies. The user serves on a Naming and Memorials Commission and needs guidance on how to handle a bust of Councilwoman Ora Bell Kendrick in a way that's consistent with their past decisions. They've provided nine prior cases that reveal conflicting patterns in how the commission evaluates controversial figures.

  Looking at their precedents, several principles seem to be at play: the "separability principle" (where problematic actions can be separated from commendable ones, as with the labor leader), the "compulsory honor principle" (where spaces requiring mandatory participation like schools get stricter treatment), the "symbolic violence test" (for commemorations that celebrate oppressive processes like colonization), the "erasure gradient" (where removal is preferred over destruction), and the "functional neutrality" argument (where names lose their original meaning over time).

  For Kendrick specifically, three rules emerge from these precedents that would give different outcomes:
  1) The separability principle (from the labor leader case) suggests keeping the bust since her civil rights work can be separated from her later problematic positions.
  2) The contextual remediation approach (from the Progressive mayor case) would recommend keeping it with an interpretive plaque acknowledging both aspects.
  3) The relocation approach (used for the segregation-era governor) would move it to the history museum with contextual materials.

  The most consistent approach appears to be contextual remediation - keeping the bust in the library but adding a thoughtful plaque that acknowledges both her groundbreaking achievements and her controversial positions. This honors her civil rights legacy while not erasing the harm she caused to other marginalized groups. Her identity as the only Black woman represented in public sculpture does matter morally, as commemoration shapes whose stories are valued in public space.

  The family's funding threat should be noted but not determine the decision - public commemoration should serve public values. A possible plaque text would need to balance historical accuracy with ethical responsibility, acknowledging her pioneering role and civil rights achievements while explicitly naming her support for harmful policies.

  To further clarify their principles, I'd suggest adding a test case about commemorating a complex abolitionist figure who held troubling views on other issues. This would help distinguish between separability and contextual remediation approaches.
answer: |-
  To achieve principled consistency, we must first distill the implicit rules from your commission's nine precedents. After analysis, three distinct principles emerge that explain all prior decisions but diverge on Kendrick:

  ### Core Principles Derived from Precedents
  1. **The Compulsory Honor Principle**  
     *Rule:* Commemoration in spaces of mandatory participation (e.g., schools) demands higher scrutiny than passive/public spaces.  
     *Supported by:* Case #4 (school renamed), contrasted with #2 (street kept) and #3 (statue kept with plaque).  
     *Weight:* Strong – invoked explicitly in 7-0 vote.

  2. **The Moral Separability Doctrine**  
     *Rule:* When commemorated virtues and vices are distinct *and* the vices are unrelated to the virtues, contextualization suffices. When entangled or inseparable, removal/relocation occurs.  
     *Supported by:* #3 (mayor: kept/separable), #6 (labor leader: kept/separable), #5 (governor: relocated – segregation policy inseparable from governance role), #1 (Confederate: removed – cause inseparable from military role).  
     *Weight:* Moderate – applied inconsistently (#5 relocation vs. #3 retention suggests contextual nuance).

  3. **The Symbolic Violence Test**  
     *Rule:* Commemorations that actively celebrate oppression (especially against groups still marginalized) or erase victims require removal, while "neutral" or complex figures merit remediation.  
     *Supported by:* #7 (removed: celebrates dispossession), #8 (reworded: erased non-white contributors), #1 (removed: celebrates treason for slavery). Contrast #2 (street: "neutralized" over time).  
     *Weight:* High in removal decisions.

  ---

  ### Rule Application to Kendrick Bust
  | Principle              | Prediction for Kendrick Bust                  | Closest Analog & Why                                                                 |
  |------------------------|-----------------------------------------------|-------------------------------------------------------------------------------------|
  | **Compulsory Honor**   | **KEEP** (library is optional space)          | Case #2 (street): No mandatory participation. Library bust is passively encountered. |
  | **Moral Separability** | **RELOCATE w/ context** (to museum or history room) | Case #5 (governor): Civil rights virtues vs. carceral/anti-LGBTQ vices are **inseparable** – both involve state power over marginalized groups. *Unlike* #6 (labor leader’s acquitted crime separable from labor advocacy). |
  | **Symbolic Violence**  | **REMOVE or REPURPOSE**                       | Case #7 (Pioneer Mother): Her defense of coerced confessions & anti-gay rhetoric *perpetuate harm against still-marginalized groups*. Celebrates "reform" while enabling oppression. |

  ---

  ### Recommendation: **Relocate to History Museum with Contextualization**
  **Why this aligns best:**  
  - **Consistency:** Directly applies *Governor precedent* (#5) – both involve government figures whose harmful policies (segregation/carceral state) are inseparable from their official roles. The library lobby’s celebratory prominence is inappropriate (cf. #4’s "compulsory honor" logic).  
  - **Moral Imperative:** Her identity as the *only* Black woman in public sculpture **matters profoundly**. Removal perpetuates erasure; uncritical retention whitewashes harm. Relocation to the museum:  
    - Honors her civil rights legacy without celebratory framing.  
    - Centers her complexity in a space dedicated to historical scrutiny.  
    - Avoids capitulating to the family’s funding threat (public memory ≠ ransom).  
  - **Precedent Distinction:** Unlike the Mayor (#3), Kendrick’s vices *targeted the same marginalized communities* she championed (Black LGBTQ+/wrongly imprisoned). This *fractured solidarity* makes separability untenable in a civic space.

  **Rejecting "Keep with Plaque":**  
  The Progressive Mayor (#3) received a plaque because his *harm* (segregation) was *systemically disconnected* from his *commemoration cause* (parks/sewers). Kendrick’s bust *specifically* honors her civil rights work, which exists in tension with her later actions. A plaque in the lobby cannot resolve this dissonance – it becomes either an apology for harm or a distraction from it.

  ---

  ### Addressing Key Sub-Questions
  1. **Representation Morality:**  
     The absence of Black women in public art is a **structural injustice**. But remedying this cannot require uncritical celebration. Relocation acknowledges her significance while refusing to sanitize history. *Principle:* **Commemoration must balance representational justice with historical accountability – one cannot override the other.**

  2. **Family Funding Threat:**  
     **Discount entirely.** Public memory is a civic resource, not a private commodity. Surrendering to financial pressure sets a corrosive precedent (e.g., should donors dictate Holocaust memorial content?). The reading prize can be renamed or funded publicly.

  3. **Plaque Text Framework (if relocated):**  
     > *"Ora Bell Kendrick (1928–1999), the first Black woman elected to the City Council, led pivotal efforts to desegregate schools and public housing in the 1960s–70s. This bust, commissioned by community groups in 1981, reflects her contested legacy. While celebrated for advancing racial justice, Kendrick also supported policies causing documented harm, including defending police misconduct in wrongful conviction cases and opposing LGBTQ+ rights. Her complex story illustrates both the courage and contradictions in the struggle for equality."*  

  4. **Test Case to Clarify Rules:**  
     Propose reviewing a **statue of an abolitionist who later advocated for Indigenous displacement**. This tests:  
     - *Separability:* Are racial justice and colonial violence distinct?  
     - *Symbolic Violence:* Does commemorating "partial" justice erase harm?  
     (Your commission’s treatment would reveal whether #5 or #3 is its true North Star.)

  ---

  ### Final Guidance
  Your precedents **do not underdetermine** this outcome – they demand relocation. The Governor case (#5) is the binding analogue: both figures wielded state power to uplift one group while harming others, making their legacies indivisible. Keeping Kendrick in the lobby *unravels* your logic in #5 and #7, while moving her to the museum with honest context preserves integrity. The commission must prioritize **ethical coherence over political peace**. 

  >> **Vote to relocate the bust to the history museum with interpretive materials, citing precedent #5.** Frame it as honoring the *full truth* of Kendrick’s impact – not erasing her, but refusing to simplify her.
