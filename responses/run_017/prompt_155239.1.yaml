answer: |-
  ### 1. Problem Statement  
  The unity problem: A proposition (e.g., "Socrates is mortal") isn't just a collection (`Socrates`, `mortal`) because a list lacks truth-evaluable structure. Binding constituents requires a *relating relation* (e.g., instantiation). But if this relation is reified as another term (e.g., `Inst : Man → Prop → Rel`), we need a *new* relation to bind `Inst` to `Socrates` and `mortal`, ad infinitum. Bradley’s regress argues that relations cannot be real objects, implying monism (reality is relationless). Russell’s multiple-relation theory of judgment faces the same: if judgment relates a mind to objects *and* a relation, how is the relation "hooked" to its arguments? Frege’s solution: Concepts (relations) are *unsaturated*—they have argument slots, making application primitive, not a relation.  

  ### 2. Rebuilding in Type Theory  
  **Constituents as terms/types:**  
  - `Socrates : Man` (term)  
  - `mortal : Man → Type` (unsaturated type family)  
  - The proposition is `mortal Socrates : Type`.  

  **Regress via reification:**  
  Reify `mortal` as data (e.g., in an inductive datatype of relations):  
  ```agda  
  data Rel : Type₁ where  
    mortal₀ : Rel  -- Code for 'mortal'  

  ⟦_⟧ : Rel → (Man → Type)  
  ⟦ mortal₀ ⟧ = λ x → ...  -- Interpretation  
  ```  
  To *apply* this reified relation, we need an explicit application operator:  
  ```agda  
  app : (r : Rel) → (x : Man) → ⟦ r ⟧ x  
  ```  
  But `app` itself is a term of type `Rel → Man → Type`. To bind `app` to `mortal₀` and `Socrates`, we must reify *it*:  
  ```agda  
  data Rel₂ : Type₂ where  
    app₁ : Rel₂  -- Code for 'app'  

  ⟦_⟧₂ : Rel₂ → (Rel → Man → Type)  
  ⟦ app₁ ⟧₂ = ...  
  ```  
  Now `app₁` needs its *own* application operator `app₂ : Rel₂ → Rel → Man → Type`, requiring `Rel₃`, and so on. **Regress starts:** Reifying the relation forces us to represent application as data, demanding a new applicator at each level.  

  **Stopping the regress in DTT:**  
  DTT halts this by keeping application primitive (kernel-level):  
  - **No reification:** `mortal` is a function type `Man → Type`, not data.  
  - **Application rule:** `Γ ⊢ f : A → B` and `Γ ⊢ a : A` imply `Γ ⊢ f a : B` by fiat.  
  **Cost:** We cannot treat functions as first-class objects without stratification. Universes (`Type₀`, `Type₁`, ...) allow reification at higher levels but fracture the domain.  

  ### 3. What Provides Unity?  
  Unity is **inhabitation under a derivation**. For `mortal Socrates : Type`, unity is:  
  - The *derivation* of `Γ ⊢ mortal Socrates type` via the application rule.  
  - Inhabitation `Γ ⊢ p : mortal Socrates` further "unifies" via the proof term.  

  **Consequence:** Propositions-as-types are inert until used in judgements. If we reify a proposition (e.g., `P : Type` as `code(P) : U` in a universe) to make it an object of attitude (e.g., `believe : U → Type`), we restart the regress:  
  ```agda  
  -- Reifying the proposition:  
  code : Type → U  
  believe : U → Type  

  -- Applying 'believe' to 'code(mortal Socrates)' requires application:  
  believe (code (mortal Socrates)) : Type  
  ```  
  But `believe` is now a function—application is hidden in the metalanguage. Explicitly reifying `app` would regenerate the regress. Unity remains tied to derivation, not data.  

  ### 4. Benign or Vicious Regress?  
  Bradley’s regress is **vicious** (unlike universe hierarchies):  
  - **Universes:** `Typeᵢ : Typeᵢ₊₁` is benign. Each `Typeᵢ` is syntactically accessible, and typical ambiguity avoids explicit indexing.  
  - **Bradley’s ladder:** Each `appᵢ` operates at level `i`, but binding `appᵢ` itself requires `appᵢ₊₁` at level `i+1`. No finite level suffices; application is never "completed".  
  **Changed subject?** Yes. Universes localize the problem but don’t resolve Bradley’s core critique: relations cannot be completed objects. DTT accepts this stratification as the cost of consistency.  

  ### 5. Residue Report  
  **Clean mappings:**  
  - Frege’s unsaturatedness → Function types (`A → B`) and their terms. A function isn’t a "complete" object; application is irreducible.  
  - Reification → Encoding relations/data in universes.  

  **Distorted mappings:**  
  - **Truth vs. inhabitation:** In DTT, a proposition is a type; "truth" is inhabitation. But philosophically, a *false proposition* (e.g., "Socrates is immortal") is meaningful despite no inhabitant. DTT conflates propositionhood (type formation) with truth (inhabitation).  
  - **Propositions vs. truthmakers:** `mortal Socrates` is the proposition; a proof `p : mortal Socrates` is its truthmaker. DTT equates them (via proofs-as-terms), obscuring the distinct role of evidence.  

  **No counterpart:**  
  - **Monism:** Bradley’s conclusion (relations → unreality → monism) has no analog. DTT’s stratified relations don’t imply metaphysical unity.  
  - **Judgment force:** The act of *asserting* `Γ ⊢ p : P` (beyond mere typing) is external to DTT.  
  - **Explaining unity:** DTT *legislates* unity via primitive application rules. Bradley demands an explanation of *why* application binds—a demand DTT rejects as inexpressible.  

  **Verdict:**  
  The residue reflects **both** limitations in DTT and philosophical unclarities:  
  - **Defect:** DTT cannot express judgment force or metaphysical conclusions (e.g., monism). Truth vs. falsehood is underspecified (inhabitation ≠ propositional meaning).  
  - **Clarity deficit:** Bradley’s "demand for explanation" assumes application must be grounded—but DTT shows this is impossible without regress or primitives. Frege’s solution is hardcoded in DTT’s kernel.  
  **Translation fidelity:** ~70% Frege, 30% reconstruction. DTT implicitly sides with Frege by making application a rule, not a term. To express Bradley’s monism, we’d need a vocabulary without relations—e.g., a univalent universe where all types are propositions, or linear types enforcing unity via resource semantics—but this still wouldn’t capture his unreality conclusion.  

  **Final note:** Bradley’s regress is a warning against reifying relations; DTT heeds it with function types and universes. The "cost" is a fractured ontology—but one that works.
