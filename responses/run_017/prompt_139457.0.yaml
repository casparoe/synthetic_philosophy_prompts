prompt: |-
  I've been reading a lot of amateur history arguments lately — who wrote a set of letters, why a company's records have a two-year gap in them, that sort of thing — and the same shape keeps turning up, and I don't have a word for it.

  First version: everyone agrees the candidates are A, B and C. Nobody ends up believing C, nobody thinks C is even especially plausible, but once C is put on the table the group switches from B to A. C doesn't win, it just changes who wins, the way a spoiler candidate does in an election. The reason is always that C is close to B in exactly the respect where B was beating A, so A's advantage becomes the one that decides it.

  Second version: three candidates and it honestly looks like A is better than B, B better than C, and C better than A — because each pairwise comparison gets fought on a different virtue. A fits the surviving documents better; B needs fewer assumptions; C sits better with what's known about the period. Ask people to rank all three at once and they stall, and it isn't idleness: they seem to think that a bit more simplicity against a bit worse fit just isn't something anyone can price.

  I've read a bit about underdetermination and about evidence being theory-laden, and neither is what I mean — nobody here doubts there's a fact of the matter or that the evidence is shared. The trouble is with the ranking itself. So: does this have a name? The way which explanation counts as best depends on what else is on the menu, and maybe doesn't settle down into an ordering at all?

  I keep thinking of social choice — spoiler effects, majority cycles — so if it's near that, tell me how near: is picking the best explanation really the same kind of operation as aggregating preferences, or does the analogy break, and where? I don't just want a label; I want to know exactly what the thing is, where its edges are, what it isn't, and whether it's a problem for inference to the best explanation in particular or for anything that picks a winner by balancing several virtues at once. If there genuinely isn't a name, coin one and define it carefully enough that I can tell it apart from its neighbours. Also: if the fix is to cash out best explanation as a single number like posterior probability, the menu-dependence seems to disappear — is that a solution or a change of subject? Please answer in British English.
reasoning: |-
  Hmm, the user is describing a pattern they've noticed in historical debates where the evaluation of explanations seems inconsistent or cyclical depending on what alternatives are presented. They've outlined two specific scenarios: one resembling a spoiler effect where introducing a weak candidate changes which strong candidate wins, and another where pairwise comparisons create an intransitive cycle (A>B, B>C, C>A).

  The user wants to know if this phenomenon has a name, and how it relates to concepts in epistemology, decision theory, and social choice. They're clearly well-read - mentioning underdetermination and theory-ladenness while distinguishing their observation from those concepts. Their questions suggest they want precise philosophical grounding rather than just a label.

  Key aspects to address:
  - The core issue seems to be about commensurability of explanatory virtues (fit, simplicity, coherence etc.) and whether they can be aggregated into a total ordering
  - The spoiler effect analogy is apt - this resembles Arrow's Impossibility Theorem where voting systems can't satisfy all desirable properties simultaneously
  - But is explanatory judgment really like preference aggregation? There might be important differences since explanations aren't preferences but truth-claims
  - The probability solution they mention (using Bayesian posteriors) would force commensurability but at the cost of requiring quantitative priors - which may be problematic for historical reasoning

  I should probably introduce the concept of "explanatory incommensurability" while noting its relationship to:
  - Social choice theory (cyclic preferences, independence of irrelevant alternatives)
  - Decision theory (multi-criteria decision making with non-comparable dimensions)
  - Philosophy of science (Kuhn on paradigm choice, Hempel's covering law model)

  The British English requirement means avoiding Americanisms ("math" → "maths", "color" → "colour") and perhaps adopting slightly more formal diction. The response should maintain academic rigor while being accessible to an educated non-specialist.

  Important to emphasize that this isn't about evidence being ambiguous (underdetermination) or biased (theory-ladenness), but about the structure of value comparisons. The "fix" of using probabilities does solve the menu-dependence but at significant costs - it papers over genuine epistemic dilemmas rather than resolving them.
answer: |-
  Right, you've put your finger on a profoundly important and awkward feature of multi-criteria reasoning, whether in historical inference, science, or decision-making. It absolutely has names and neighbours, and the analogy to social choice is remarkably strong. Let's dissect it precisely, in British English as requested.

  ### The Core Phenomenon: Explanatory Incommensurability & Menu-Dependence
  The fundamental problem you're describing is the **incommensurability of explanatory virtues** coupled with the **menu-dependence of "best" explanations**. This leads to phenomena like the ones you describe:

  1.  **Your "First Version" (The Spoiler Effect):** This is a direct instance of violating the **Independence of Irrelevant Alternatives (IIA)** principle. IIA, borrowed straight from social choice theory (Arrow's Impossibility Theorem), states that the ranking between two options (A and B) should not change based on the introduction or removal of a third, irrelevant option (C). Yet, in your historical examples, introducing C *does* change the winner from B to A, precisely because C "splits the vote" on the virtue where B excelled. C isn't "irrelevant" in the sense of being utterly unrelated; it's *specifically relevant* on the *same dimension* where B was strong, making that dimension seem less decisive when comparing A and B directly. The "best explanation" becomes dependent on the *menu* of options presented, not just their intrinsic merits relative to the evidence.
  2.  **Your "Second Version" (The Cycle):** This is a classic **intransitivity in pairwise comparisons** due to **shifting criteria dominance**. Each pairwise contest (A vs B, B vs C, C vs A) is decided based on *which specific virtue is deemed most salient or decisive* in *that particular comparison*. Because the virtues (fit, simplicity, coherence with background knowledge) are **incommensurable** – there's no common currency (like a single unit of "goodness") to weigh a unit of simplicity against a unit of fit – the overall ordering collapses. Asking for a global ranking forces a comparison the virtues don't readily allow, hence the stalling.

  ### Names & Neighbours
  1.  **Core Name: Explanatory Incommensurability:** This is the most precise philosophical term capturing the heart of the "Second Version" and underpinning the "First". It signifies that the different criteria (virtues) used to evaluate explanations (empirical fit, simplicity, scope, coherence, explanatory power, fruitfulness, etc.) lack a common measure. You cannot straightforwardly say "a 10% loss in fit is worth a 15% gain in simplicity" in any objective, context-independent way. Their relative importance is inherently contextual and can shift depending on the comparison being made.
  2.  **Specific Manifestations:**
      *   **Menu-Dependence / Violation of IIA:** Describes your "First Version" directly. The "best" explanation changes based on which alternatives are considered, specifically when a new alternative (C) is "close" to an existing one (B) on a key dimension. This is endemic in situations with incommensurable virtues.
      *   **Intransitive Preferences/Cycles:** The formal description of your "Second Version". It arises directly from the incommensurability and the tendency for different virtues to dominate different pairwise comparisons.
      *   **The Discursive Dilemma / Doctrinal Paradox:** (More relevant to group reasoning/judgement aggregation, but structurally similar). Occurs when individual judges agree on the relevant premises (virtues) but applying them consistently leads to an intransitive or inconsistent group conclusion about the "best" overall option.
  3.  **Close Neighbours (and Distinctions):**
      *   **Underdetermination of Theory by Evidence:** You rightly distinguish this. Underdetermination is about *insufficient evidence* to uniquely determine a single theory, even *if* all virtues were perfectly commensurable. Your issue is about the *structure of evaluation itself* even when evidence is shared and agreed upon. Incommensurability makes the ranking problem worse *within* the space of underdetermined options.
      *   **Theory-Ladenness of Observation:** Also distinct. This is about how prior beliefs/theories influence *what counts as evidence* or *how evidence is interpreted*. Your problem arises *after* the evidence is agreed upon and interpreted; it's about comparing theories *given* that shared evidence base and set of virtues.
      *   **Value Pluralism:** A broader ethical/political concept, but structurally identical. It holds that fundamental values (e.g., liberty, equality) are irreducibly distinct and cannot be fully ranked against each other, leading to tragic choices or menu-dependence in decisions. Explanatory virtues are a specific type of epistemic value.

  ### The Social Choice Analogy: Apt but with a Caveat
  The analogy is **extremely strong and illuminating**.
  *   **How it's the same:** Both involve aggregating multiple dimensions (voter preferences / explanatory virtues) into a single ranking or choice (elected candidate / best explanation). Both are plagued by:
      *   **Cycles (Intransitivity):** A>B, B>C, C>A.
      *   **Spoiler Effects / IIA Violations:** Introducing C changes the winner from B to A.
      *   **Impossibility Results:** Arrow's Theorem shows no perfect voting system exists; similarly, there's no perfect, universally applicable algorithm for aggregating incommensurable virtues into an always-transitive, IIA-satisfying "best explanation" ranking.
  *   **Where the Analogy Might Break (Slightly):**
      *   **Goal:** Voting aims for a *collective decision* reflecting (imperfectly) aggregated preferences. Inference aims for *truth* or *accuracy*. The "virtues" in explanation (fit, simplicity) are ostensibly truth-conducive, not merely expressions of preference. However, the *weighting* of those virtues often involves judgement calls that can feel preference-like.
      *   **Commensurability Attempts:** In social choice, we *force* commensurability via voting rules (each vote counts equally). In explanation, we *try* to find principled ways to commensurate virtues (e.g., simplicity *is* often seen as indirectly truth-conducive via avoiding overfitting). The core problem of fundamental incommensurability remains, but the *stakes* (truth vs social choice) make philosophers more uncomfortable with purely procedural fixes in the explanatory case.

  ### Is it a Problem for Inference to the Best Explanation (IBE)?
  **Absolutely, and profoundly so.** IBE relies crucially on the assumption that explanations *can* be reliably ranked as "better" or "best" in a way that reliably tracks truth. The phenomena you describe show:
  1.  The ranking can be **highly unstable** (menu-dependent).
  2.  The concept of "best" can be **intransitive or indeterminate**.
  3.  The outcome can be **manipulable** by strategically introducing or framing alternatives (your spoiler effect).

  This suggests IBE, as commonly presented ("just pick the *best* explanation!"), is **naïve** when multiple, genuinely incommensurable virtues are in play. It doesn't mean IBE is useless, but it highlights a major limitation: IBE works best when one explanation is *strongly dominant* across *all* relevant virtues, or when a specific context *imposes* a clear weighting of virtues. When virtues conflict and are incommensurable, declaring one "best" is often more of a pragmatic or contextual *decision* than a straightforward *discovery*.

  ### The Probabilistic "Fix": Solution or Sidestep?
  Representing belief via **posterior probability** (Bayesianism) *does* mathematically force commensurability and eliminate menu-dependence and intransitivity **within the model**. "Best" simply becomes "highest probability".

  *   **How it "Solves" the Problem:**
      *   All evidence and virtues must be translated into likelihoods and priors.
      *   Simplicity might be encoded in lower-complexity priors (e.g., Solomonoff induction, Minimum Description Length).
      *   Fit with background knowledge is baked into the prior.
      *   Fit with data is the likelihood.
      *   The posterior is a single number, providing a complete, transitive, IIA-satisfying ranking.

  *   **Why it's Often a Sidestep or Change of Subject:**
      1.  **The Quantification Problem:** Assigning precise numbers to priors (especially for complex historical hypotheses) and likelihoods (when evidence is ambiguous or qualitative) is frequently **highly subjective, arbitrary, or practically impossible**. The incommensurability hasn't vanished; it's been swept into the difficulty (and subjectivity) of quantification. The debate shifts to "What should the prior be?" instead of "Which virtue matters more?" – often just as intractable.
      2.  **Loss of Nuance:** Reducing complex, multidimensional virtues to a single probability score can obscure *why* one explanation is preferred. It hides the trade-offs.
      3.  **Context Dependence Remains:** *Which* factors you include in your prior, *how* you model the likelihood, and *how* you formalise the hypotheses are all choices influenced by context, background knowledge, and judgement. The menu-dependence might be formalised away, but the underlying epistemic dilemmas persist in setting up the model. A hypothesis not formulated initially (your C) still needs to be assigned a prior and likelihood; its introduction could still change the *relative* posteriors of A and B if it shares features with B, mimicking the spoiler effect mathematically.

  **In essence:** Bayesianism provides a *formal framework* that guarantees internal consistency (no cycles, IIA holds mathematically). However, *applying* it to complex historical problems often just relocates the problems of incommensurability and judgement into the difficult, subjective task of assigning probabilities. It's a powerful tool, but not a magic bullet that dissolves the underlying epistemic tension you observed.

  ### Conclusion: Labelling the Beast
  You've identified **explanatory incommensurability leading to menu-dependence and potential intransitivity in the ranking of hypotheses**, a significant challenge for Inference to the Best Explanation. The analogy to **social choice theory** (spoiler effects, cycles, Arrow's Theorem) is robust and highly informative, highlighting the structural difficulties in aggregating multiple, distinct dimensions of evaluation into a single "best" choice. While formal probabilistic approaches impose mathematical consistency, they often sidestep rather than resolve the core epistemic difficulty of quantifying and weighting fundamentally incommensurable explanatory virtues in complex, uncertain domains like history.

  **A precise label:** While "explanatory incommensurability" is the core concept, the specific phenomenon of the ranking changing based on the alternatives presented is best termed **menu-dependent explanatory ranking due to virtue incommensurability**. The cyclical version is an **explanatory virtue intransitivity cycle**.

  This isn't just idle philosophy; it explains why historical debates often get stuck, why introducing a new (even weak) hypothesis can radically shift consensus, and why proponents of different theories often seem to be arguing past each other – they may be emphasising different, incommensurable virtues as paramount. Recognising this structure doesn't solve the problem, but it makes the nature of the disagreement clearer.
