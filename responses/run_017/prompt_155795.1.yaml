  The user's framing suggests they're deeply familiar with philosophy of mind but need help disambiguating their friend's slogan. Their frustration with the unresolved argument is palpable - they couldn't articulate the equivocation in the moment but recognize it conceptually. The request for confidence ratings and explicit uncertainty markers shows they value intellectual honesty over rhetorical certainty.

  Hmm, the three pressure points reveal where the metaphor might break down: (a) risks homunculus regress if the "user" isn't properly defined, (b) touches on epiphenomenalism versus causal efficacy, and (c) gets at referential opacity in reports. These need unpacking separately because they support different aspects of the friend's two claims.

  For the menu approach, I consider structuring interpretations along a spectrum from weak to strong. The weaker versions (like Thesis 1 about functional simplification) might support the friend's first argument but not the second, while radical eliminativism (Thesis 4) would support both but at higher philosophical cost. Each thesis must be falsifiable - no vague handwaving.

  The user's neuroscience-savvy friend likely leans toward stronger interpretations, but the equivocation might be between moderate and radical claims. For instance, using Thesis 3 (interface as sole reality) to dismiss introspection while invoking Thesis 4 (eliminativism) for machine equivalence would indeed be inconsistent - that's probably the equivocation they sensed but couldn't name.

