prompt: |-
  i'm taking a seminar on AI alignment this term and this week's topic is side-effect avoidance and low-impact agents. In Friday's discussion one of the PhD students kept leaning on a medical analogy: a low-impact agent is just the medical do-no-harm slogan for robots — the agent should go after the goal we hand it the way a surgeon goes after a cure, and otherwise leave the world as close as it found it. He used it to argue something stronger, that we don't need to solve value specification to get systems safe enough to switch on, because we can just make them conservative, penalise deviation from the do-nothing baseline, and get most of the safety without the impossible part.

  I definately half believe him and half think the analogy is doing all the work. Can you audit it properly?

  Start with the correspondence: what is the patient, the disease, the treatment, the side effect, the indication, the consent form, the baseline of normal functioning, the specialist's training? I want it as an actual table. In particular I want to know what plays the role of the indication, because in medicine something counts as a side effect only relative to what the treatment is for, and I can't tell what the analogue of that is supposed to be for a free-standing agent that just gets handed an instruction.

  Then the places it breaks — and this is the part I actually care about — separated into the breaks that matter for the conclusion he's drawing and the ones that are cosmetic. The two I keep circling: (a) in medicine the no-harm baseline is homeostatic, there's some discoverable fact about what normal functioning for a human organism is, and it doesn't look like the world at large has anything like that, so deviation-from-inaction ends up measuring something arbitary; and (b) medicine trades harm against benefit inside a single patient's interests and with that patient's consent, and neither has an obvious counterpart when the effects spread across everyone.

  I also sketched my own fix and want to know if it's a dodge. Instead of comparing the agent's world to the world where it was never switched on, compare it to the world as it would have been if a competent, well-briefed human assistant had been given the same instruction — call it the human-substitute baseline. My claim is that the medical analogy, done right, pushes toward this rather than toward inaction, since in medicine the baseline isn't nobody-does-anything, it's what a competent clinician would have changed. His reply is that this just hides the entire value specification inside the word competent and I've gained nothing. Which of us is closer to right, and can the analogy settle it either way?

  And if the medical one can't carry the weight, is there a better comparison — a houseguest, a contractor working in someone else's house, an invasive species, something else — that isolates what's actually hard here without quietly smuggling in the answer?

  No need for citations or a reading list, I've got the syllabus. I do need something to paste into the seminar spreadsheet, so end with a single final line and nothing after it:

  \answer{survives / survives-with-repair / does-not-survive}

  where the verdict is about whether his conclusion — conservative agents buy us safety without a value specification — survives once the disanalogies are on the table.
reasoning: |-
  We are given a scenario where a PhD student uses a medical analogy to argue that low-impact agents (with a "do-no-harm" principle) can provide safety without solving value specification. The user wants to audit this analogy by:

  1. Creating a table of correspondences between medical concepts and AI concepts.
  2. Identifying where the analogy breaks, especially for the conclusion that conservative agents buy safety without value specification.
  3. Evaluating the user's proposed fix (using a "human-substitute baseline" instead of inaction) and whether it improves the situation.
  4. Suggesting a better analogy if the medical one fails.
  5. Ending with a verdict on whether the PhD student's conclusion survives the disanalogies.

  Let's break this down step by step.

  ### Step 1: Correspondence Table

  The medical analogy:
  - **Patient**: The world (or the part of the world the AI is acting upon).
  - **Disease**: The problem the AI is tasked with solving (the goal we hand it).
  - **Treatment**: The AI's actions to achieve the goal.
  - **Side effect**: Unintended negative consequences of the AI's actions beyond the goal.
  - **Indication**: The specific reason for the treatment (the goal we want the AI to achieve). In medicine, the indication is the condition that the treatment is intended to treat.
  - **Consent form**: The process of specifying the goal and constraints to the AI (like the instructions given to the AI).
  - **Baseline of normal functioning**: The state of the world before the AI acts (the "do-nothing" baseline).
  - **Specialist's training**: The pre-training and alignment techniques that equip the AI to act appropriately (e.g., training with safety constraints, reward modeling).

  Table:

  | Medical Concept          | AI Concept                                                                 |
  |--------------------------|----------------------------------------------------------------------------|
  | Patient                  | The world (or the relevant part of the world)                              |
  | Disease                  | The problem/task the AI is assigned (e.g., "cure cancer")                  |
  | Treatment                | The AI's actions to achieve the goal                                       |
  | Side effect              | Unintended negative consequences of the AI's actions (beyond the goal)     |
  | Indication               | The specific goal the AI is supposed to achieve (the "why" of the action)  |
  | Consent form             | The instruction given to the AI (including goal and constraints)           |
  | Baseline of normal functioning | The state of the world before the AI acts (the "do-nothing" baseline) |
  | Specialist's training    | The AI's training (including safety training, alignment techniques)        |

  ### Step 2: Breaking Points of the Analogy

  We are particularly interested in two disanalogies:

  **(a) Homeostatic Baseline**: 
  - In medicine, the human body has a natural state of health (homeostasis) that is relatively well-defined and discoverable. The "do-no-harm" principle is anchored in this state.
  - In the world at large, there is no natural or objective baseline. The "do-nothing" baseline (the state if the AI never acted) is arbitrary and may not be desirable. Moreover, the world is dynamic and constantly changing due to other factors. Penalizing deviation from inaction might prevent beneficial changes or even require harmful inaction (e.g., not stopping an ongoing disaster).

  **(b) Trade-offs and Consent**:
  - Medicine involves a single patient (or a well-defined group) who consents to treatment, and the trade-off between benefit (curing the disease) and harm (side effects) is made within the patient's own interests.
  - For an AI, the effects of its actions are distributed across many people (and possibly non-human entities) without their consent. There is no clear way to aggregate or balance these effects. Moreover, the AI's goal might not align with the interests of all affected parties.

  **Why these breaks matter for the conclusion**:
  - The PhD student's conclusion is that penalizing deviation from the do-nothing baseline (low-impact) can provide safety without value specification. However:
    - Without a homeostatic baseline, the low-impact objective might be arbitrary and could lead to perverse outcomes (e.g., preventing the AI from fixing problems that arise naturally, or causing harm by inaction).
    - Without a single patient's interest and consent, we cannot define what counts as a "side effect" versus a benefit. The AI might avoid actions that are beneficial to some but harmful to others, or vice versa. This requires value judgments that the value specification was supposed to provide.

  **Cosmetic Breaks**:
  - Other breaks might be less critical. For example, the "specialist's training" in medicine is years of education and experience, while for AI it's a training process. This difference is not central to the argument about low-impact.

  ### Step 3: Evaluating the User's Fix

  The user proposes: instead of comparing to the world if the AI was never switched on, compare to the world if a "competent, well-briefed human assistant" had been given the same instruction (the human-substitute baseline).

  **Pros**:
  - It avoids the problem of an arbitrary inaction baseline by using a more dynamic and contextually appropriate baseline (what a competent human would do).
  - It might capture the idea of "normal" changes that are expected and acceptable.

  **Cons**:
  - As the PhD student points out, this just shifts the value specification problem to defining "competent" and "well-briefed". What values and norms should the human assistant have? This requires specifying the values we want the AI to embody, which is the very problem we are trying to avoid.

  **Assessment**:
  - The user's fix does not dodge the value specification problem; it rephrases it. The medical analogy, when examined, actually supports the PhD student's point that the baseline is fixed (the patient's health) and not relative to what a competent clinician would do (which is more like the user's fix). In medicine, the baseline is the patient's state before treatment, not what the clinician would have done otherwise. So the analogy does not push toward the user's fix.

  ### Step 4: Is There a Better Analogy?

  The medical analogy breaks down on the key issues. Alternative analogies:

  - **Contractor working in someone else's house**: The contractor (AI) is hired to do a specific job (goal) and must avoid damaging the house (side effects). But the house has an owner (or multiple owners) who can specify what counts as damage. This still requires value specification (what counts as damage?) and consent from the owner(s). Also, the house is a bounded system with clear norms, unlike the world.

  - **Houseguest**: A guest should be helpful without disrupting the household. But again, the norms are set by the host. Without a host (or with multiple hosts with conflicting preferences), the problem remains.

  - **Invasive species**: This highlights the risk of unintended consequences when introducing something new into an ecosystem. But ecosystems have natural balances, which might be closer to homeostasis. However, the world is not a closed ecosystem, and we don't want the AI to be as passive as a non-invasive species (we want it to act on the goal).

  None of these perfectly solve the core issue: the lack of a natural baseline and the distributed effects. The hard part is specifying what counts as harm in a complex, multi-agent world without a clear value function.

  ### Step 5: Verdict on the Conclusion

  The PhD student's conclusion is that conservative agents (via low-impact) can buy safety without value specification. However, the disanalogies show:

  - Without a homeostatic baseline, the low-impact objective is arbitrary and may not align with safety.
  - Without a single patient's interest and consent, the AI cannot make trade-offs in a value-neutral way.

  Therefore, the conclusion does not survive because the low-impact approach still requires a value specification to define:
  - What counts as a deviation (what aspects of the state matter?).
  - How to weigh the goal against side effects (especially when they affect multiple stakeholders).

  The medical analogy hides the need for value specification by assuming a clear baseline and a single patient's interests. In reality, we must specify what we care about preserving and for whom.

  **Final Verdict**: does-not-survive

  **Answer Format**:
  \answer{does-not-survive}
answer: |-
  ### Correspondence Table

  | Medical Concept           | AI Concept                                                                 |
  |---------------------------|----------------------------------------------------------------------------|
  | **Patient**               | The world (or the relevant part of it) where the agent operates.           |
  | **Disease**               | The specific goal/task assigned to the agent (e.g., "optimize supply chain"). |
  | **Treatment**             | The agent's actions to achieve its goal.                                   |
  | **Side effect**           | Unintended negative consequences of the agent's actions beyond the goal.   |
  | **Indication**            | The goal itself (the "why" of the action). This is specified in the instruction (e.g., "cure cancer" for a surgeon, "reduce energy costs" for the agent). Side effects are defined relative to this indication. |
  | **Consent form**          | The instruction given to the agent, including the goal and constraints.    |
  | **Baseline of normal functioning** | The state of the world before the agent acts (the "do-nothing" baseline). |
  | **Specialist's training** | The agent's pre-training and alignment (e.g., reinforcement learning with safety penalties). |

  ### Breaks in the Analogy

  **Breaks that Matter for the Conclusion (PhD student's argument fails here):**
  1. **Homeostatic Baseline (a)**:  
     - **Medical**: The "normal functioning" baseline (e.g., a healthy human body) is homeostatic, discoverable, and stable. Harm is measured against this objective standard.  
     - **AI**: The world has no natural homeostasis. The "do-nothing" baseline is arbitrary (e.g., it could include ongoing disasters or injustices). Penalizing deviation from inaction may reward passivity in harmful situations (e.g., not stopping a fire) or punish beneficial changes. This undermines the claim that low-impact ensures safety without value specification, as "safety" requires defining which deviations are harmful—a value-laden judgment.  
     - **Impact on Conclusion**: Fatal. Without an objective baseline, low-impact penalizes arbitrary changes, creating perverse incentives. Value specification is needed to define what constitutes "harm" (e.g., which state variables matter).  

  2. **Trade-offs and Consent (b)**:  
     - **Medical**: Benefits and harms are traded off within a single patient's interests, with consent. The surgeon prioritizes the patient's well-being holistically.  
     - **AI**: Effects are distributed across many agents (people, systems) without consent. There is no unified "patient" to harmonize interests (e.g., the agent's goal might help some but harm others). Low-impact does not resolve conflicts between stakeholders.  
     - **Impact on Conclusion**: Fatal. The analogy assumes a unified beneficiary, but real-world goals involve trade-offs between competing values (e.g., efficiency vs. equity). Penalizing impact doesn't address this; it requires value specification to weigh trade-offs.  

  **Cosmetic Breaks (not central to the conclusion):**  
  - **Specialist's Training**: Medical training instills shared human values; AI training relies on imperfect data/optimization, risking proxy gaming. But this doesn't directly affect the low-impact argument, as the PhD student assumes training can instill conservatism.  
  - **Consent Form**: Medical consent is informed and interactive; AI instructions are fixed. This is a mismatch but doesn't challenge the core claim—value specification could be embedded in the instruction.  
  - **Indication Specificity**: Medical indications are precise (e.g., "treat appendicitis"); AI goals are often underspecified (e.g., "improve productivity"). This is a problem for value specification generally, not unique to low-impact.  

  ### Evaluation of Your Fix (Human-Substitute Baseline)
  - **Your Proposal**: Compare the agent's actions to a "competent, well-briefed human assistant" given the same instruction. This defines side effects relative to what a human would change, not inaction.  
  - **Strengths**: Avoids the arbitrariness of the do-nothing baseline by using a dynamic, context-aware standard. Aligns better with the medical analogy (where "normal functioning" includes expected interventions).  
  - **Weaknesses**: The PhD student is right that "competent" smuggles in value specification. Defining a "well-briefed human" requires specifying values (e.g., which norms, priorities, or trade-offs the human should embody). This doesn't eliminate value specification; it shifts it to defining the human archetype.  
  - **Who's Closer?**: You are closer to the truth for baseline realism, but the PhD student is right that this doesn't solve the value problem—it disguises it. The medical analogy doesn't settle this: it supports your fix for baseline realism (medicine uses patient health, not pure inaction) but exposes that values are still embedded in "competence" (e.g., a surgeon's training includes ethical norms).  

  ### Better Analogy  
  The **contractor working in someone else's house** better isolates the core challenge:  
  - **Correspondence**: The contractor (AI) is hired to do a job (goal) in a house (world) owned by others (stakeholders). They must avoid damage (side effects) but lack consensus on what counts as damage (e.g., removing a wall could be improvement or harm).  
  - **Why it's Better**: It highlights distributed ownership (no single "patient"), the lack of a natural baseline (the house's state is arbitrary), and the need for value specification to define "damage" and trade-offs. Unlike medicine, this doesn't assume homeostasis or unified interests.  
  - **Limitation**: Still requires defining stakeholder values ("owners"), but it avoids medical baggage.  

  ### Verdict on the Conclusion  
  The PhD student's conclusion—that low-impact agents provide safety without value specification—**does not survive** the disanalogies. The homeostatic baseline and unified patient are essential to the medical analogy; without them, low-impact penalizes arbitrary deviations and cannot handle distributed trade-offs. Value specification remains necessary to define harm, benefits, and stakeholder weights.  

  \answer{does-not-survive}
