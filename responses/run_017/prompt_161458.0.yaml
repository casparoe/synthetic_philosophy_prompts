  ### Candidate Principles  
  After analyzing your verdicts, I propose two principles. The first prioritizes avoiding negative experiences and discounts low-positive welfare, while the second introduces a lexical threshold for adding lives and emphasizes the moral weight of existence itself. Both break lives into stretches (e.g., years) for evaluation.  

  **Principle A: Stretch-Sensitive Anti-Negative Aggregation**  
  1. **Break lives into welfare stretches** (e.g., yearly intervals). For each stretch:  
     - If welfare ≥ 20: value = welfare.  
     - If 0 ≤ welfare < 20: value = welfare × 0.5 (discount low-positives).  
     - If welfare < 0: value = welfare × 3 (heavily weight negatives).  
     *Motivation:* Case 3 (avoids superb life with bad stretch) and Case 11 (risk aversion for negatives).  
     *Strains against:* Case 7 (iterates toward repugnance).  

  2. **Score a life** = sum of transformed stretch values.  
     *Motivation:* Case 3 and Case 8 (fission halves welfare, but discounting makes two lives at 50 less valuable than one at 100).  
     *Strains against:* Case 1 (adds flourishing life easily).  

  3. **Score an outcome** = sum of life scores for all who exist.  
     *Motivation:* Case 5 and 6 (avoids repugnance and dilution).  
     *Strains against:* Case 4 (imperceptible losses may still sum).  

  4. **Betterness**: Outcome A is better than B iff its score is higher.  
     **Reason to bring about**: You may permissibly decline to create a life unless:  
     - It has no stretch < 0 AND its score > 5, OR  
     - It has a stretch < 0 AND its score > 100.  
     *Motivation:* Case 1 (no requirement to add) and Case 2 (may decline barely worth living life).  
     *Strains against:* Case 9 (asymmetry in creation).  

  **Principle B: Lexical Threshold with Existence Weight**  
  1. **Break lives into stretches**. Apply the same stretch transformations as Principle A.  
     *Motivation:* Same as A.  

  2. **Score a life** = sum of transformed stretch values.  
     *Motivation:* Same as A.  

  3. **Existence weight**: Multiply each life’s score by an existence factor:  
     - If the life exists in both outcomes: weight = 1.  
     - If the life exists only in A or B: weight = 0.5 (discounts added/removed lives).  
     *Motivation:* Case 9 (avoids favoring concentration) and Case 6 (dilution penalty).  
     *Strains against:* Case 1 (weakens reason to add flourishing life).  

  4. **Score an outcome** = sum of (life score × existence weight) for all who exist.  
     *Motivation:* Case 8 (fission less valuable) and Case 5 (repugnance avoided).  
     *Strains against:* Case 7 (small steps may still lead to repugnance).  

  5. **Betterness**: A is better than B iff its score is higher.  
     **Reason to bring about**: You must create a life iff its score > 10. Otherwise, permissible to decline.  
     *Motivation:* Case 2 (barely worth living life need not be added) and Case 11 (risk aversion).  
     *Strains against:* Case 1 (adds flourishing life, but existence weight weakens betterness).  

