prompt: |-
  Hi — I sit on the allocation committee for our university's Horizon Fund, roughly 120k a year earmarked for speculative high-upside work that normal panels won't touch. I'm the token plant pathologist on it, one of two non-economists, so keep the formalism light where you can. Two years ago we burned three whole meetings arguing about point estimates, so we rewrote our rules: each member writes down the widest probability range they'd personally defend for a proposal's key claim, we pool by taking the union of those ranges and deleting anything everyone agrees is "silly", and then we (1) drop any proposal whose resulting interval of expected value is dominated — every number in it below every number in some other proposal's — and (2) among the survivors, fund whichever has the highest lower bound. This year we recieved three finalists and the rule is behaving strangly, and I need to put a one-page recommendation in front of six people — one of whom is a statistician who will genuinely enjoy taking it apart — by Friday afternoon.

  Finalist A is a 25k, six-month pilot from a group who want to field-test a cheap wastewater-and-metagenomics early-warning protocol for novel zoonotic spillover; their claim is that two to four months of extra warning would move a real fraction of the response earlier, which in their modelled scenario is worth something like 40,000 lives. Members' probabilities that this pilot specifically leads to an adopted system that actually changes a future response ran from 1 in 100 (the enthusiast, who is on the panel) down to 1 in 1,000 (our skeptic), so A's pooled EV interval is about 40 to 400 in lives. Finalist B is a very boring randomised trial of a tutoring intervention with an established effect size: EV interval around 8 to 15 in the same units, and everybody's ranges overlap almost exactly. Finalist C is a mid-sized data-infrastructure thing with a wide interval, 5 to 90. So under rule 2 A wins by three to five times and it isn't close — and yet half the committee thinks that's mad, because A's lower bound is only as good as the skeptic's willingness to be precise at that scale. She admits 1 in 1,000 is a gesture, not a measurement, and if the honest number were 1 in 100,000 (which nobody formally excluded, since "silly" was never defined) A's lower bound drops to 0.4 and it loses badly.

  One member has floated a fix that I think is worth building the memo around. Call it the resolution floor: any probability the committee cannot distinguish from zero at the resolution our evidence actually supports — she proposes 1 in 500, roughly the finest discrimination our evidence base will bear — should not be treated as a probability at all but as unmeasured, and a proposal whose case rests on a sub-floor probability should be judged on non-EV grounds instead, mainly whether the money cheaply buys information that shrinks the interval (option value, reversibility, how fast we find out). On that way of looking at it we'd fund A, but as a measurement rather than a bet: 25k now, a hard decision gate at six months, and no renewal unless the update pushes the lower bound back above the floor.

  What I want is the memo itself: bottom line up front — what we fund, how much, on what conditions and by what dates — then the reasoning, including a fair and specific statement of the strongest thing the losing side will say. My own guess is that the best version of that objection is that a resolution floor is arbitrary and description-dependent: how finely you carve up the event (adoption on its own, or adoption-and-a-spillover-occurring, or adoption somewhere with jurisdiction that matters) slides the number across the floor without anything changing in the world, so the rule doesn't track anything real; and that applied consistently it would defund every long shot this Fund exists for. Tell me how much of that you actually buy rather than just listing it. Keep the whole thing under 600 words, no heading longer than one line, and please don't point us at any literature — nobody on this committee will read it.
reasoning: |-
  We are writing a memo for the Horizon Fund allocation committee. The memo must recommend which proposal to fund, under what conditions, and address the strongest objection.

  Key points from the user's description:
  - The committee uses a rule: each member provides a probability range for a proposal's key claim, they take the union and remove "silly" extremes, then:
    1. Drop any proposal whose expected value (EV) interval is entirely dominated by another (i.e., every number in one interval is less than every number in another).
    2. Among the survivors, fund the one with the highest lower bound of the EV interval.

  - This year's finalists:
    - Proposal A: 25k for a 6-month pilot on a wastewater-based early-warning system. Claim: if adopted, it could save 40,000 lives by providing 2-4 months extra warning in a zoonotic spillover. The probability that the pilot leads to an adopted system that actually changes a future response ranges from 1/100 to 1/1000. So the EV interval is 40 to 400 lives (i.e., 40,000 * 0.001 = 40, 40,000 * 0.01 = 400).
    - Proposal B: A tutoring intervention trial with an EV interval of 8 to 15 lives.
    - Proposal C: A data-infrastructure project with an EV interval of 5 to 90 lives.

  Under the current rule, A wins because its lower bound (40) is higher than the lower bounds of B (8) and C (5). However, half the committee is uncomfortable because the skeptic's 1/1000 probability is arbitrary and if the true probability were much lower (e.g., 1/100,000), then A's lower bound would drop to 0.4 and it would lose.

  Proposed fix: the "resolution floor". Any probability below a certain threshold (e.g., 1/500) that cannot be distinguished from zero given the evidence should be treated as unmeasured. Then, a proposal relying on such a low probability should be judged on non-EV grounds (option value, reversibility, how fast we get information). For A, this would mean funding it as a measurement (with a hard decision gate at 6 months) rather than a bet.

  The memo should:
  1. Bottom line: what to fund, how much, conditions, and dates.
  2. Reasoning, including the strongest objection to the resolution floor approach.
  3. The strongest objection: the resolution floor is arbitrary and description-dependent (how you define the event can slide the probability above or below the floor without changing the real world). Also, applied consistently, it might defund every long shot the Fund exists for.

  We must keep under 600 words, no heading longer than one line.

  Recommendation: We are going to recommend funding Proposal A under the resolution floor approach (i.e., as a measurement with a condition). But we must address the objection.

  Structure of the memo:

  **Heading: Recommendation**
  Fund Proposal A (wastewater early-warning pilot) at $25,000, with a hard decision gate at six months (by [date: 6 months from start]) for renewal consideration based solely on whether the lower bound of its expected value interval rises above the resolution floor (1/500). If not, the project ends without renewal.

  **Heading: Reasoning**
  - The current rule (highest lower bound) clearly selects A, but the committee's discomfort is valid: the lower bound is driven by an arbitrary low probability (1/1000) that might not be evidence-based.
  - The resolution floor (1/500) addresses this by acknowledging that probabilities below this are not measurable with current evidence. Therefore, A should not be judged solely on its EV but on its information value.
  - Funding A as a measurement: The $25k buys crucial information to reduce uncertainty. In six months, we will have a much better estimate of the probability of adoption and impact, which can then be used to decide on further funding.
  - Why not B or C? B has a solid but low EV (8-15) and C has a wide interval (5-90) but without the information value of A. Also, under the current rule, A dominates.

  **Heading: Strongest Objection and Our Response**
  - Objection: The resolution floor (e.g., 1/500) is arbitrary and description-dependent. How we define the event (e.g., including or excluding the occurrence of a spillover) can change the probability and thus whether it falls above or below the floor without any real change. Moreover, this rule might defund all long shots, which is against the Fund's purpose.
  - Response: We agree the floor is arbitrary, but it is a necessary operational tool to avoid decisions based on unmeasurable probabilities. The description-dependence issue can be mitigated by requiring the committee to explicitly define the event when assigning probabilities. The Fund's purpose is to fund speculative high-upside work, but with a focus on learning. The resolution floor does not defund long shots; it funds them as information-gathering exercises first, which is appropriate for the most uncertain bets. If after the pilot the probability remains below the floor, then it is truly too uncertain for further investment.

  Word count: We must be concise.

  Let's write the memo.
answer: |-
  **Recommendation**  
  Fund Proposal A at $25,000 for six months, conditional on a hard decision gate by [Date: 6 months after start]. Renewal requires the lower bound of its expected value (EV) interval to exceed the resolution floor (1/500). If unmet, terminate without further funding. Allocate no funds to B or C.

  **Reasoning**  
  The current rule (highest lower bound) selects A (EV lower bound: 40 lives), but its weak foundation—resting on the skeptic’s arbitrary 1/1,000 probability—justifies reform. Adopting a resolution floor (1/500) treats sub-floor probabilities as unmeasurable, shifting evaluation to information value. A uniquely offers cheap, rapid uncertainty reduction: $25,000 tests a high-stakes zoonotic warning system, with a six-month update that could resolve adoption feasibility (e.g., via pilot data on scalability or regulatory buy-in). B’s narrow EV (8–15) is robust but low-impact; C’s wide interval (5–90) lacks A’s targeted learning speed. Funding A as measurement aligns with the Fund’s speculative mandate while imposing accountability.

  **Strongest Objection and Counter**  
  *Objection*: The resolution floor (e.g., 1/500) is arbitrary and description-dependent. Redefining the key event (e.g., “adoption” vs. “adoption during a spillover in a relevant jurisdiction”) could manipulate probabilities across the floor without real-world change. Rigidly applied, this defunds all long shots—contradicting the Fund’s purpose.  
  *Response*: We concede the floor is arbitrary but necessary: without it, unserious probabilities (e.g., 1/100,000) distort decisions. Description-dependence is mitigated by requiring the committee to explicitly define events during range-pooling. This rule doesn’t kill long shots—it funds them *as investigations*. A’s six-month gate forces evidence-building; if uncertainty persists, termination is prudent. The Fund must balance upside with discernible risk, not endorse unbounded speculation.  

  **--- End of Memo ---**  
