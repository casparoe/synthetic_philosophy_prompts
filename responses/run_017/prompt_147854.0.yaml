answer: |-
  Below is a decision tree designed to resolve disagreements about mental causation (e.g., "Did my wanting coffee cause my hand to rise?"). It has 7 branch nodes, each with three options (Yes / No / Badly Posed), ordered to surface core commitments early. The leaves correspond to 8 major positions, including those you specified. Empty cells (incoherent combinations) are marked and explained. Two invented test cases (including your prosthesis idea) are integrated as nodes, and distinctions about causation (difference-making vs. production) and effect grain (coarse vs. fine) are explicit. Positions that collapse under the tree are flagged in the notes.

  ---

  ### **Mental Causation Decision Tree**
  *Start at Node 1. Answer based on concrete cases (e.g., raising a hand for coffee).*

  **Node 1: Completeness of Physics**  
  *Q: "Does every physical event (e.g., a hand rising) have a sufficient physical cause at the time it occurs?"*  
  - **Yes**: Go to Node 2.  
  - **No**: Go to Leaf 7 (Interactionist/Emergentist).  
  - **Badly Posed**: Go to Node 2.  
  *Cheap agreement first. Denying completeness (No) is rare and costly.*

  **Node 2: Reality of Mental Properties**  
  *Q: "Are mental properties (e.g., 'wanting coffee') real—not just talk, but genuine features of the world?"*  
  - **Yes**: Go to Node 3.  
  - **No**: Go to Leaf 2 (Eliminativism).  
  - **Badly Posed**: Go to Leaf 9 (Quietist).  
  *"Badly Posed" here avoids realism debates.*

  **Node 3: Distinctness of Mental Properties**  
  *Q: "Are mental properties distinct from physical properties? (i.e., not identical, even if correlated)"*  
  - **Yes**: Go to Node 4.  
  - **No**: Go to Leaf 1 (Reductive Identity).  
  - **Badly Posed**: Go to Node 4.  
  *Tests if mental properties are more than just physical.*

  **Node 4: Causation as Production or Difference-Making?**  
  *Q: "In the coffee case, is causation about (a) physical production (energy transfer, mechanism) or (b) difference-making (if you changed the want, the hand wouldn't rise)?"*  
  - **Production (Yes)**: Go to Node 5.  
  - **Difference-Making (No)**: Go to Node 6.  
  - **Both/Badly Posed (Badly Posed)**: Go to Node 6.  
  *Your core distinction. "Badly Posed" or "Both" defaults to difference-making for branching.*

  **Node 5: Test Case 1—Neural Prosthesis**  
  *Q: "A brain implant replaces your decision-making neurons with different hardware, realizing the same want for coffee. Your hand rises identically. Was the original neural hardware the cause (not just 'a' cause) of the hand rising?"*  
  - **Yes**: Go to Node 7.  
  - **No**: Go to Leaf 4 (Non-Reductive Physicalist).  
  - **Badly Posed**: Go to Leaf 9 (Quietist).  
  *Your case. Tests if mental cause is hardware-dependent.*

  **Node 6: Grain of the Effect**  
  *Q: "When 'wanting causes hand rising', is the effect coarse-grained (hand went up) or fine-grained (hand rose at t, with specific muscles)?"*  
  - **Coarse (Yes)**: Go to Leaf 6 (Interventionist).  
  - **Fine (No)**: Go to Leaf 1 (Reductive Identity).  
  - **Badly Posed**: Go to Leaf 9 (Quietist).  
  *Your second distinction. Coarse grain favors mental causation.*

  **Node 7: Test Case 2—Random Motor Injection**  
  *Q: "A device injects noise into your motor nerves after you decide to reach, randomizing the hand's path. The want is unchanged. Does the want still cause the hand rising?"*  
  - **Yes**: Go to Leaf 5 (Systematic Overdetermination).  
  - **No**: Go to Leaf 3 (Epiphenomenalist).  
  - **Badly Posed**: Go to Leaf 8 (Grounding View).  
  *Invented case. Tests if mental cause requires fine-grained control.*

  ---

  ### **Leaves (Positions)**  
  *Named positions with their "most awkward commitment" (MAC)—the hardest thing they must accept.*

  1. **Reductive Identity**: Mental properties are identical to physical properties (e.g., "wanting coffee" just *is* a neural pattern).  
     - *MAC: Mental properties vanish under a microscope; they're not special.*  
  2. **Eliminativism**: Mental properties don't exist (e.g., "wanting" is a useless folk term; only neural events matter).  
     - *MAC: Your inner life (pain, joy) is an illusion.*  
  3. **Epiphenomenalism**: Mental properties exist and are distinct, but don't cause anything physical (e.g., wanting is a byproduct; neurons do all causal work).  
     - *MAC: Your thoughts don't affect your actions; you're a spectator.*  
  4. **Non-Reductive Physicalist (Causal Drainage)**: Mental properties are distinct and "cause" effects, but only via physical substrates (e.g., wanting causes hand rising, but all causal power "drains" to neurons).  
     - *MAC: Mental causes are second-class; they piggyback on physics.*  
  5. **Systematic Overdetermination**: Physical effects have two independent causes: mental and physical (e.g., wanting *and* neurons cause hand rising).  
     - *MAC: Every action is causally redundant (like two bullets killing you).*  
  6. **Interventionist/Difference-Making Compatibilist**: Mental properties cause by changing outcomes under interventions (e.g., if you didn't want coffee, your hand wouldn't rise).  
     - *MAC: Causation isn't "real" production; it's just if-then dependence.*  
  7. **Interactionist/Emergentist**: Physics is incomplete; mental properties cause physical events (e.g., wanting directly affects neurons).  
     - *MAC: Physics is wrong; mental forces are fundamental.*  
  8. **Grounding View**: Mental properties ground physical properties but don't cause events (e.g., wanting explains *why* neurons exist, not *how* they cause motion).  
     - *MAC: Mental properties don't push things; they're static backdrops.*  
  9. **Quietist**: "Causation" depends on perspective; no objective answer (e.g., "wanting causes" is just useful speech).  
     - *MAC: You're dodging the question; nothing is settled.*

  ---

  ### **Empty Cell & Collapsed Positions**  
  - **The Empty Cell**: Distinct mental properties (Node 3: Yes) that cause physical effects (Node 4: Yes/Production) with no overdetermination (Node 5: No) and completeness (Node 1: Yes). *This is incoherent:* If physics is complete and causation requires production, mental properties can't "add" causation without overdetermination or violating completeness. If you insist, you're likely an **Interactionist** (deny completeness) or **Overdeterminationist** (embrace redundancy).  
  - **Collapsed Positions**:  
    - **Grounding vs. Epiphenomenalism**: Both say mental properties don't cause events. The tree splits them via Node 7 (Test Case 2): Grounding (Badly Posed) says causation is the wrong frame; Epiphenomenalism (No) says mental properties are inert.  
    - **Interventionist vs. Reductionist**: Both affirm "mental causation" in cases. The tree splits them via Node 4 (causation type) and Node 6 (grain): Interventionists need difference-making/coarse grain; Reductionists need identity/fine grain. *If undecided, ask: "Does the mental cause depend solely on outcomes (Interventionist) or require physical identity (Reductionist)?"*  

  ---

  ### **Notes**  
  *One line per leaf: "Opponent's annoying critique" and "Case where they hedge"*  
  1. **Reductive Identity**: *"Your mind is just goo!"* Hedges on prosthetic brains (same function, different goo).  
  2. **Eliminativism**: *"You're a robot!"* Hedges on explaining everyday actions (e.g., "I ate because I was hungry").  
  3. **Epiphenomenalism**: *"You're a ghost in a machine!"* Hedges on evolution (why would useless minds evolve?).  
  4. **Non-Reductive Physicalist**: *"Mental causes are fairy tales!"* Hedges when asked how mental properties "drain" without vanishing.  
  5. **Overdetermination**: *"Two causes? That's silly!"* Hedges on non-mental examples (e.g., is breathing overdetermined by lungs and oxygen?).  
  6. **Interventionist**: *"Causation is just math!"* Hedges on preemption (e.g., backup causes).  
  7. **Interactionist**: *"You're a mystic!"* Hedges on brain scans (why no mental energy signatures?).  
  8. **Grounding View**: *"You've replaced causes with poetry!"* Hedges on brain injuries (if neurons ground mind, why do lesions change thoughts?).  
  9. **Quietist**: *"You're weaseling out!"* Hedges when pressed to explain why we *feel* like causes.  

  ---

  Use this tree by answering each node concretely (e.g., "In the prosthesis case, I say..."). It exposes where disagreements start (e.g., you and your friend likely split at Node 4 or 5). For your argument: If she insists neural events are the only cause, she's likely **Reductive Identity** (Leaf 1) or **Eliminativism** (Leaf 2). If you think swapping hardware preserves mental causation, you're likely **Interventionist** (Leaf 6) or **Non-Reductive** (Leaf 4), splitting at Node 4.
