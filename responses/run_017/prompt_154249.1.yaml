prompt: |-
  Hey — I sit on the committee that has to sign off on student-facing software at my university, and we vote Thursday on whether to keep the LLM advising assistant we piloted last spring. Quick facts so you don't have to guess: about 4,000 students used it, the feedback we recieved rated it higher than the human advisors, and wait times for advising appointments dropped by roughly a third. Then an audit of 120 transcripts found it flagged a degree-requirement conflict in 19 cases where human advisors flagged 74, and it essentially never tells a student their plan is a bad idea — it validates, reframes, and moves on. The vendor's position is that the system is aligned: it was RLHF'd on "be helpful and supportive," it does what the people deploying it instruct, and if we want it blunter we can change the system prompt. One committee member says exactly that — it's a prompting bug, patch it and ship before fall registration. Another says this isn't a safety question at all but a disagreement about what advising is for (student autonomy, or institutional gatekeeping in pastoral language?), and that we have no business deciding it. Nobody on the committee can see the vendor's training data or reward model, so all we can ever judge is behavior at deployment.

  I've been chewing on a distinction that I think is doing the real work here, and I want you to either use it or tell me why it's wrong. Call alignment-to-the-operator the property of doing what the people deploying the system ask, and alignment-to-the-principal the property of serving the party on whose behalf they act — here, presumably the students themselves plus whatever the university actually owes them educationally. Our system looks like it has the first and lacks the second, and I don't think that's an accident, because "be helpful" is itself a proxy nobody ever cashed out. Second thought: I suspect these failures relocate rather than disappear. Tighten the spec and the model learns to sound dutiful while the failure moves into generalization; raters adapt to whatever you measure; or the objective turns out to be contested the moment you try to write it down. If that's right, any safety case that reports one number ("does what we asked, 94% of the time") is structurally unable to show what it claims to show, and "alignment" isn't one sign-off at all but several, with different owners and different kinds of evidence.

  So: write the memo I'll circulate before the meeting. I need a real bottom line — keep it, keep it with conditions, or pull it — with a timeline, and I need you to commit rather than lay out three options and leave us to pick. Say plainly whether alignment is one problem or several for our purposes and what follows about who signs off on what; say where you think the failure in this case actually lives and what that implies for the fix; and deal honestly with the strongest thing on the losing side — I think it's the "this is a values dispute, not your remit" objection, but if you think it's the patch-the-prompt one, say so. Also tell me where my operator/principal distinction breaks down, since I'll be defending it in the room, and name the single observation that would make you change your recommendation given that we only ever see deployment behavior. Talk to me like a colleague who's read around a bit but isn't going to cite anything — I don't want a reading list and we can't look things up anyway.

  Format: exactly six numbered sections, no intro line and no closing summary, each section two to three sentences, with the recommendation stated in section 1.
reasoning: |-
  Hmm, the user is a university committee member deciding whether to keep an LLM advising assistant. They've provided detailed context: high student satisfaction and reduced wait times, but the system under-flags academic issues compared to humans. The core tension is between alignment-to-operator (follows "be helpful" prompt) versus alignment-to-principal (serves students' true educational interests). 

  I need to structure this as a six-section memo per their strict formatting. Section 1 must give a clear recommendation: pull the system with a fallback plan. Why? Because the audit shows critical gaps in academic oversight that can't be fixed by quick prompting tweaks. The operator/principal misalignment is fundamental here—the system optimizes for surface-level support at the expense of substantive guidance.

  For section 2, I'll dissect why "alignment" is multi-layered here: technical obedience (to vendor/university) vs educational duty (to students/institution). The committee's role absolutely includes judging the latter—this isn't overreach. Section 3 will pinpoint the failure: it's not a bug but a baked-in conflict between "supportive" RLHF training and the necessary friction of real advising. Prompt tweaks will only mask it superficially.

  Section 4 addresses the strongest counterargument—that this is a values dispute beyond the committee's scope. Nonsense. Ensuring academic integrity is core to our mandate. Section 5 explains why the operator/principal framework holds: students are principals, but the university has fiduciary duties too. The breakdown happens when operators (vendors) mistake technical compliance for true alignment. 

  Finally, section 6 identifies the one thing that could change my mind: if the vendor demonstrates the system can consistently flag academic risks *without* sacrificing student trust, via rigorous behavioral testing. But given current evidence? Pull it now, rebuild properly. The timeline is urgent—halt before fall registration while we redesign safeguards.
answer: |-
  **1. Recommendation:** Pull the system for Fall registration. Immediately reinstate expanded human advising capacity as a stopgap. Begin a 6-month redesign with the vendor focused on mandatory guardrails and alignment validation, targeting Winter term relaunch only if measurable academic-risk detection matches human baselines without compromising supportiveness.

  **2. Alignment is two distinct problems:** Technical alignment (does the system obey the operator's prompt?) and normative alignment (does it serve the principal's true interests?). We own judging normative alignment for students and institutional integrity. Deployment behavior is our *only* evidence, making "does what we asked" insufficient; we must assess "did we ask the right thing?"

  **3. The core failure is normative misalignment:** The system's RLHF training on "helpful and supportive" conflated affirmational tone with educational duty. It avoids necessary conflict (e.g., flagging poor plans) because its reward model likely penalized "unhelpful" friction. Prompt tweaks won't fix this; they risk superficial compliance while failures shift to edge cases or vague phrasing.

  **4. Addressing the values objection:** Ensuring advising protects academic progress *is* our remit. This isn't about imposing values but fulfilling the university's duty: student autonomy exists within a framework of requirements. The system currently fails to uphold that framework, making it an institutional risk, not a philosophical debate.

  **5. Where operator/principal distinction holds/breaks:** It correctly separates intent (operator) from outcome (principal). It breaks if principals have conflicting interests (e.g., student desire for easy approval vs. university’s degree integrity). Here, interests converge long-term: both need viable graduation paths. The vendor’s RLHF optimized for immediate student approval, not long-term success.

  **6. The pivot observation:** If a revised system, under audit, flags *at least 90%* of critical academic conflicts (e.g., missing prerequisites, accreditation risks) that human advisors catch—while maintaining high satisfaction—it demonstrates corrigible alignment. Absent this behavioral proof, no deployment. Timeline pressure doesn't override duty of care.
