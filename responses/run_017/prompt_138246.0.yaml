prompt: |-
  I chair the ethics committee at our hospital, and at the end of yesterday's session two of its members — a psychiatrist and a health lawyer — fell into an argument that the rest of us could not settle and that I now have to summarise in the minutes. It began as a disagreement about which moral emotion the hospital's incident-reporting culture should try to cultivate, and turned into a disagreement about whether a culture can choose its moral emotions at all. I have tidied the wording but not the claims. The exchange, as far as I can reconstruct it:

  1. (Rowan): Guilt takes an act as its object; shame takes the self. That difference is everything. Guilt attaches to something you did, and something you did can be undone, repaired, compensated for, apologised for — guilt therefore carries its own instruction about what to do next. Shame attaches to something you are, and there is no act that undoes a self: all you can do with it is hide it, or attack whoever saw it. So guilt is the better moral emotion, and a reporting culture should be engineered to produce guilt rather than shame.

  2. (Adela): The contrast is overdrawn, and guilt's tidy instruction is its defect, not its virtue: guilt is dischargeable. Pay, apologise, accept the sanction, perform the ritual, and the ledger clears — while telling you nothing about whether you are the sort of person who will do it again next week. Shame is the only one of the two that tracks that. And shame is not by nature global. I can be ashamed of being the sort of person who humiliates a junior colleague without that being a verdict on my whole self. You are describing shame at its pathological extreme and then objecting to the description.

  3. (Rowan): Grant the possibility of local shame. Shame is still triggered by exposure — actual, imagined, or internalised from an audience — and that makes conscience hostage to whoever happens to be watching. A person who is alone, whose victim will never know and can never be found, has no shame and, on your account, no moral emotion left at all. And what we know about shame-proneness points the same way: it is associated with defensiveness, blame-shifting and aggression rather than with repair.

  4. (Adela): The aloneness case cuts against you as well. The solitary agent's guilt is only ever as good as her own moral beliefs, and those may be corrupt: an emotion whose content is fixed entirely by the agent is precisely the emotion that fails when you need it. And you are conflating shame's trigger with shame's object — fear is triggered by bears but is about danger; shame is triggered by being seen but is about what one is. As to the research, it mostly measures people already in trouble, and its instruments cannot separate shame from the humiliation of being found out. You may simply be measuring exposure.

  5. (Rowan): Then to the real question. The historical shift from honour-and-shame societies to guilt-centred ones tracks structural changes — anonymous markets, cities full of strangers, courts that take retaliation out of private hands — and not anyone's decision. Emotional repertoire is infrastructure, not policy. So "a culture can choose" is false; at most a culture can rearrange its institutions and wait. Recommending shame is nostalgia with a moral vocabulary.

  6. (Adela): But we do see deliberate attempts: restorative-justice conferencing, truth commissions, public accountability practices, the recent revival of denunciation. Some of them do appear to shift what participants feel, locally and for a time. So choice is not null; it is indirect — you alter practices and institutions and the emotions follow. And consider what would be lost. A culture that abolished shame would lose the only affect that registers how one's character looks from the outside, which is exactly the check your own corrupt-conscience worry requires.

  7. (Rowan): Then you have conceded my point and renamed it choice, since on your account no culture selects its emotions directly. Your examples also cut against you: those same practices generate spectacle, pile-ons and exit from the community rather than repair — which is the failure mode I named at the start. And you cannot reply that this is not real shame, because by your own argument a culture cannot select which shame it gets.

  8. (Adela): It can, partly, by designing the practice. Shame without a terminus is what produces hiding. The difference between a pillory and a conference that ends, that names the act rather than the person, and that includes a route back to full standing, is a design difference. If shame can be ritualised so that it has an end and a way back, your objection is an objection to unritualised exposure, not to shame as such.

  9. (Rowan): But ritual of that kind requires a small, stable, morally shared community — which is only to say that shame is unusable where we actually live. And if that is right, then "which is better" has no answer independent of social structure: guilt is the emotion for strangers, shame the emotion for neighbours.

  10. I then raised the case that had provoked the whole discussion and that neither of them had addressed. A former administrator here designed a policy that, over roughly six years, foreseeably harmed patients who cannot now be identified and who will never learn that they were harmed. There is no one to repair to and no one who saw. On Rowan's account there is nothing for guilt to bite on; on Adela's there is nothing for shame to be about.

  Please adjudicate this. Work through the ten moves in order and, for each, say how strong it is — from clearly wrong to clearly right — and why, distinguishing the cases where a move succeeds against what it was aimed at from the cases where it merely changes the subject or concedes the point in a new vocabulary. Then say who is more right overall, and whether the dispute is partly verbal: if "better" is answerable only relative to a function — detecting wrongdoing, motivating repair, forming character, restoring standing — or only relative to a social structure, say so, and say where each party has implicitly fixed one without argument. Run both accounts over the administrator case in (10) and say what each implies about it and what the case reveals about the accounts. Finally, name what both of them are missing. I have a guess — something about their shared assumption that one emotion must do all of the moral work — but I would rather you found something better than my guess than confirmed it. Argue from the structure of the positions; I do not want citations, reading suggestions, or appeals to what the literature says.
reasoning: |-
  Okay, the user chairs a hospital ethics committee and needs help adjudicating a complex debate between two members about guilt vs. shame in incident reporting culture. They've reconstructed a 10-point exchange and want a thorough analysis. 

  First, I need to understand the core disagreement: Rowan argues guilt is superior because it's action-focused and reparable, while Adela defends shame as necessary for character evaluation. The debate evolves into whether cultures can choose moral emotions at all, culminating in an unaddressed case study about an administrator's harmful policy.

  The user wants me to:
  - Evaluate each of the 10 moves on a right/wrong spectrum
  - Determine who's more right overall
  - Check if it's partly verbal (relativity of "better")
  - Apply both theories to the administrator case
  - Identify what both are missing

  Hmm... interesting how both debaters make valid points but seem trapped in binary thinking. Rowan's structural determinism feels oversimplified - cultures do influence emotions through rituals as Adela counters. Yet Adela underestimates how shame relies on social visibility. The administrator case exposes both theories' limits: guilt lacks a target, shame lacks exposure.

  What neither acknowledges: moral psychology isn't monolithic. Their whole framing assumes institutions must cultivate one universal emotion, but real accountability ecosystems need both guilt (for repairable acts) and shame (for character patterns), plus other mechanisms like professional standards or systemic audits. The administrator case actually calls for institutional responsibility, not individual emotion.

  For the evaluation, I'll:
  - Note where points successfully rebut (e.g., Adela's move 4 correctly separates shame's trigger/object)
  - Flag concessions disguised as arguments (Rowan's move 7 falsely claims Adela conceded)
  - Highlight overlooked nuances (both ignore shame's vulnerability to power imbalances)

  The administrator case is key - it reveals their theories work only when harm is visible and attributable. For systemic, invisible harm? We need non-emotional solutions: anonymized data analysis, policy audits, structural reforms. The real lesson might be that moral emotions alone can't address institutional failure.
answer: |-
  Below is a systematic adjudication of the ten moves, followed by an overall assessment, analysis of the administrator case, and identification of overlooked dimensions. Strength ratings range from **clearly wrong** to **clearly right**, with explanations focused on logical coherence, internal consistency, and responsiveness to the prior move.  

  ### **Move-by-Move Analysis**  
  1. **Rowan (Guilt > Shame)**:  
     - **Strength**: *Partially right but oversimplified*.  
     - **Why**: Correctly identifies guilt’s action-orientation and reparative potential but wrongly frames shame as inherently global and irreparable. Ignores functional forms of shame (e.g., "I’m ashamed *of* my action" vs. "I’m ashamed *of myself*"). Succeeds in establishing guilt’s utility for repair but fails to disprove shame’s value.  

  2. **Adela (Shame’s Value)**:  
     - **Strength**: *Strong rebuttal*.  
     - **Why**: Effectively counters Rowan’s caricature of shame by distinguishing pathological shame from localized, constructive shame. Correctly notes guilt’s potential for transactional discharge without character change. Succeeds in defending shame as a tracker of character.  

  3. **Rowan (Shame Requires Exposure)**:  
     - **Strength**: *Weak*.  
     - **Why**: Accurately links shame to exposure but incorrectly infers that solitary agents lack moral emotion. Guilt *also* depends on internalized norms (not "exposure"). Fails against Adela’s point: shame’s object (character) can exist without an audience. Changes subject to defensiveness research, which doesn’t address her core argument.  

  4. **Adela (Defends Shame’s Object & Triggers)**:  
     - **Strength**: *Clearly right*.  
     - **Why**: Masterfully separates shame’s *trigger* (exposure) from its *object* (character), analogizing to fear/danger. Correctly notes guilt’s vulnerability to corrupt internal norms. Research critique (measuring "exposure," not shame) is persuasive. Directly rebuts Rowan’s objections.  

  5. **Rowan (Cultures Don’t Choose Emotions)**:  
     - **Strength**: *Partially right but fatalistic*.  
     - **Why**: Correct that emotions evolve with social structures, but wrongly claims cultures cannot *influence* emotions. Historical determinism ignores Adela’s examples (e.g., restorative justice). Concedes indirect influence ("rearrange institutions") while denying "choice."  

  6. **Adela (Cultures Can Indirectly Shape Emotions)**:  
     - **Strength**: *Clearly right*.  
     - **Why**: Refutes Rowan’s determinism with evidence: practices *do* alter emotions locally. Vital insight about shame as an "external check" on conscience. Strengthens her case by naming design elements (e.g., "terminus," "route back").  

  7. **Rowan (Adela Concedes; Practices Fail)**:  
     - **Strength**: *Weak*.  
     - **Why**: Misrepresents Adela’s "indirect choice" as concession. Critique of shame practices (spectacle, exit) is valid but conflates *poor design* with *shame itself*. Undermined by Adela’s next move on ritual design.  

  8. **Adela (Ritual Design Matters)**:  
     - **Strength**: *Strong*.  
     - **Why**: Successfully distinguishes pathological shame (pillory) from constructive shame (ritualized conference). Proves shame *can* be structured for repair. Directly answers Rowan’s failure-mode objection.  

  9. **Rowan (Shame Requires Small Communities)**:  
     - **Strength**: *Partially right but reductive*.  
     - **Why**: Correct that shame works best in tight-knit groups but ignores Adela’s institutional workarounds (e.g., professional subcultures). Conclusively reframed the debate: "better" depends on social structure.  

  10. **Chair’s Unaddressed Case (Administrator Harm)**:  
      - *See detailed analysis below*.  

  ---

  ### **Overall Verdict**  
  - **Adela is more right overall**. She successfully defends shame as a necessary complement to guilt, exposes Rowan’s oversimplifications, and demonstrates that emotions *can* be indirectly shaped through institutional design.  
  - **Rowan’s core strength**: Guilt’s reparative function is superior for *action-specific* errors in impersonal settings (e.g., hospitals).  
  - **Dispute is partly verbal**: "Better" is **relative to function and structure**:  
    - *Guilt* excels at motivating repair for identifiable acts in rule-based systems.  
    - *Shame* excels at character formation and external perspective in community-based systems.  
    - Both parties implicitly fixed functions: Rowan prioritized *repair*, Adela prioritized *character/accountability*. Neither argued this explicitly.  

  ---

  ### **Administrator Case Analysis**  
  - **Rowan’s account (guilt-focused)**: Fails. No act to repair (victims unknown), no "object" for guilt. Implication: Such cases are morally inert, requiring systemic fixes (e.g., audits) beyond emotion.  
  - **Adela’s account (shame-focused)**: Also fails. No exposure (no one saw), no "character" witnessed. Implication: Shame requires an audience, real or internalized.  
  - **What the case reveals**:  
    - Both theories collapse when harm is **systemic, invisible, and unattributed**.  
    - Moral emotions require a **target** (act/self) and a **witness** (self/others). Here, neither exists.  
    - Solution: Institutional accountability (e.g., investigations, policy reform) *outside* emotional frameworks.  

  ---

  ### **What Both Missed**  
  **The role of *institutions* as non-emotional moral agents**.  
  - Rowan and Adela assume moral progress hinges *only* on cultivating individual emotions. But institutions can:  
    1. **Detect harm** impersonally (e.g., data analytics, anonymous reporting).  
    2. **Enforce accountability** without emotion (e.g., sanctions, policy changes).  
    3. **Create systemic safeguards** (e.g., automated checks) that prevent harm *without* relying on guilt/shame.  
  - In the administrator case:  
    - Guilt/shame fail because the harm was *baked into the system*, not rooted in individual conscience.  
    - The remedy is structural: Cultures should focus on *designing systems* that prevent hidden harms, not just engineering emotions.  

  **Why this is better than the "one emotion" guess**: It addresses *systemic* moral failure—where both guilt and shame are inadequate because the problem transcends individual agency. The debate’s framing ("which emotion?") overlooks that modern institutions often produce harm through faceless processes, demanding institutional, not just psychological, responses.  

  ---  
  **Final Judgment**: Adela wins the debate, but the administrator case exposes both theories as insufficient for systemic harm. The ethics committee should prioritize *structural solutions* alongside emotional cultivation.
