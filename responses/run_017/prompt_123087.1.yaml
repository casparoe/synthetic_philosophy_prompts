prompt: |-
  Hey — I'm one of the two parent reps on my district's curriculum committee, we vote Monday on whether to pilot a new 7th-grade unit on the Anthropocene, and I recieved the draft too late to think about it properly, so I need something to circulate Sunday night.

  The situation: the unit was written by a middle-school science teacher on release time. It's centerpiece is a timeline activity where kids get three cards — 1610, 1950, and "roughly 8,000 years ago" — and have to argue for one as the point where the Anthropocene starts. 1610 is a dip in atmospheric CO2 in Antarctic ice cores that some people read as forests regrowing across the Americas after European contact killed off a huge fraction of the population; 1950 is the Great Acceleration plus the plutonium fallout from bomb testing that shows up in sediments pretty much everywhere; 8,000 years ago is early farming, deforestation and rice paddies, when CO2 and methane stopped doing what they'd done in earlier interglacials. Near as I can tell, none of the three are wrong — they're picking out different things — and that's both what makes the activity good and what makes it impossible to grade.

  The objection: Marv, who runs the science department, says every item on the end-of-unit assessment has to have one defensible key, and that we don't let kids vote on when World War II started or on what counts as a planet. He also pointed out — correctly, I checked — that the international stratigraphy body voted the Anthropocene proposal down in 2024, so on the official Geologic Time Scale there is no such epoch, and he'd rather we just teach "human impacts on Earth systems," which is what our standards actually say. The teacher's counter-proposal was to make the test item "which start date does the Anthropocene Working Group favor," and Marv says that just tests memorization of what some committee happens to think. A history teacher on the committee says if it isn't an official epoch we shouldn't use the word at all, and one parent has already emailed the board saying we're teaching kids that there are no facts.

  The bit I can't get straight: my gut says the question in the unit isn't the same kind of question as "when did WWII start," and that Marv's fix — drop it, teach the standards language — throws out the interesting part, which is exactly the fight over who gets to decide and what they're deciding about. But he's right that we need something we can put a number on, he's got the committee's trust, and the superintendent has said she'll read whatever we do here as precedent for how we handle other contested topics.

  Could you draft the one-page memo I'll send out? Recommendation up front — adopt as drafted, adopt with conditions, or don't adopt — then the reasoning, and I want it to take Marv's objection seriously instead of steamrolling it, including the strongest thing on whichever side loses. If there's a version of this unit where the end-of-unit item has a single defensible key without gutting the activity, say what that item should be. One page, no citations or reading lists — we don't have journal access anyway.

  Last line, in exactly this form: \answer{adopt as drafted} or \answer{adopt with conditions} or \answer{do not adopt}.
reasoning: |-
  Hmm, the user is a parent rep on a district curriculum committee facing a vote about a 7th-grade Anthropocene unit. They need a one-page memo by Sunday night to circulate. The core issue is a timeline activity where students debate three possible start dates for the Anthropocene (1610, 1950, ~8000 BCE), which conflicts with assessment requirements for single-answer questions. 

  Key points I need to address: Science head Marv objects because assessments need definitive answers, and the Anthropocene isn't officially recognized. The teacher suggested pivoting to "what does the Anthropocene Working Group favor?" but Marv calls that rote memorization. A history teacher and a parent have additional concerns about teaching ambiguity. 

  The user's gut feeling is that the debate itself is valuable - it shows how scientific categories are constructed. But they acknowledge Marv's valid point about measurable assessments and precedent-setting. They explicitly want me to draft a memo that doesn't steamroll objections, and to specify any modifications if recommending conditional adoption.

  I think the best recommendation is to adopt with conditions. The unit's strength is in showing science as process, but Marv's concerns about assessable standards are legitimate. Instead of gutting the activity, I'll propose reframing the assessment question to evaluate understanding of evidence and arguments - something like: "Using evidence from the timeline activity, explain why scientists disagree about the Anthropocene start date." This satisfies standards about human impacts while preserving the critical thinking element. 

  For the memo structure: I'll lead with the conditional adoption recommendation, then break down supporting reasoning in three parts - why the unit is valuable, why the objections matter, and how the modification bridges both. I'll end with the exact "\answer{adopt with conditions}" format requested. The tone should be diplomatic - praising Marv's professionalism while firmly defending the pedagogical value of examining scientific controversies.

  The user's deeper need seems to be navigating institutional constraints without sacrificing intellectual integrity. They're subtly asking for cover to advocate for nuance in a system that demands simplicity. My memo must give them that ammunition while preempting backlash about "no facts" claims by emphasizing how the modified assessment still yields quantifiable skills evaluation.
answer: |-
  **MEMORANDUM**  
  To: District Curriculum Committee  
  From: Parent Representative  
  Date: Sunday, [Date]  
  Subject: Recommendation: 7th-Grade Anthropocene Unit Pilot  

  ---

  ### **Recommendation**  
  **Adopt with Conditions**  
  Modify the end-of-unit assessment to evaluate student understanding of *evidence-based reasoning* rather than selecting a single "correct" start date.  

  ---

  ### **Reasoning**  
  **1. The Unit’s Core Value Lies in Critical Thinking**  
  The timeline activity compellingly engages students with three scientifically supported arguments for defining the Anthropocene, each tied to distinct global shifts (early agriculture, colonization’s ecological impacts, and modern industrialization). This mirrors real scientific discourse, where definitions evolve through debate about *which evidence matters most*. Removing this activity would sacrifice the unit’s richest learning opportunity: understanding that science involves interpreting data within frameworks.  

  **2. Marv’s Objections Are Valid and Addressable**  
  - **Assessment Reliability**: Grading ambiguity *is* problematic if the test asks, "When *does* the Anthropocene start?" as though one answer is definitive.  
  - **Scientific Legitimacy**: The 2024 rejection of the Anthropocene as a formal epoch underscores that this remains a contested concept. Teaching it as settled fact would misrepresent science.  
  - **Standards Alignment**: The unit must demonstrably meet the standard ("human impacts on Earth systems"), not debate terminology.  

  **3. Proposed Solution: Reframe the Assessment**  
  Replace the current question with:  
  > *"Using evidence from the timeline activity, explain why scientists disagree about when human impacts began defining a new geological epoch. Support your answer with at least two examples."*  

  **Why this works**:  
  - **Defensible Grading**: Rubrics can assess accurate use of evidence (e.g., linking CO₂ dip to 1610, nuclear markers to 1950), clarity of explanation, and understanding of multiple perspectives.  
  - **Preserves the Activity**: Students still debate start dates, but the test evaluates *how* they analyze disagreement, not *which* date they choose.  
  - **Meets Standards**: Focuses on "human impacts" while acknowledging scientific debate. The term "Anthropocene" can remain as a *lens* for discussion (like "Big Bang" in cosmology), provided teachers clarify its provisional status.  

  **4. Addressing Concerns**  
  - **"No Facts" Critique**: This unit teaches that facts (e.g., ice-core data, radionuclides) exist, but their *interpretation* varies based on criteria. This is foundational to science literacy.  
  - **Historical Analogy**: Unlike WWII’s agreed-upon start (a political/military event), geological epochs are *defined* by consensus on evidence thresholds—making this debate pedagogically relevant.  
  - **Precedent Setting**: This approach models how to teach contested topics: foreground evidence, distinguish consensus from debate, and assess reasoning over rote answers.  

  ---

  ### **For the Losing Side**  
  **To Marv & Opponents**: Your insistence on rigorous assessment and adherence to standards strengthened this proposal. If the unit proceeds without the modified assessment, it risks grading inconsistency and misrepresenting scientific practice. The condition ensures students learn the "how" of science, not just the "what."  

  ---

  **Implementation Conditions**:  
  1. The assessment question must be revised as above.  
  2. Teacher training must emphasize framing the Anthropocene as a *proposed* concept tied to evidence, not an established epoch.  
  3. Pre-unit communication to parents must clarify that critical thinking, not debate outcomes, is being assessed.  

  \answer{adopt with conditions}
