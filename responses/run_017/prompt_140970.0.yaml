          - Some choose A (flexible) and then in the future, they choose the cookie (against their long-term plan to be healthy).
          - Some choose B (fixed) and stick to apples.
          - Some choose C (pay to remove temptation) and then have only apples.

     But we want to see them pay to remove the option.

     Also, we want to see that from the outside, when they choose an apple in the future, we don't know if they are on B, C, or A and resisting temptation.

     The cost structure: 
          - In option A: if they choose apple in both sessions, they spend 0. If they choose cookie in one, they spend 2, etc.
          - In option B: they spend 0 and get two apples.
          - In option C: they spend 1 voucher now and then get two apples.

     So the cost of commitment is 1 voucher.

     We expect that students who are present-biased might choose C to avoid future temptation.

     But also, some might choose A planning to choose apple, but then in the moment choose cookie.

     How to induce a preference for apples in the long run but cookies in the short run? We can explain that apples are healthier and they have a long-term goal to eat healthy, but cookies are tempting.

     However, we are using snacks, so we need to choose two that are comparable but one is more tempting.

     Materials: 
          - Vouchers
          - Two types of snacks: apple (or a healthy snack) and cookie (or an unhealthy but tasty snack).

     The key is that at the planning stage, they might prefer two apples, but in the moment, they might prefer a cookie.

     We can tell them: 
          - An apple is worth 2 vouchers to them (if they were to buy it separately) and a cookie is worth 3 vouchers, but they are trying to be healthy and so they have a personal rule: they value an apple at 2 and a cookie at 2 as well (because of guilt), but in the moment, they value the cookie at 3 and forget the guilt.

     But we cannot control their preferences.

     We can rely on natural preferences. But some might prefer the cookie always, so they will choose A and then cookie both times. We want to capture those who have a self-control problem.

     To induce a conflict, we can offer a bonus: tell them that if they choose two apples, they will get an extra 1 voucher at the end (for being healthy). But then it's not natural.

     Alternatively, we can use the same snack but frame it as healthy or tempting? But that might not work.

     Given the challenge, we can use a different example: studying vs leisure.

     But we have to deliver the outcome in the next two sessions.

     We'll go with the snacks and hope that some students have self-control issues.

     Procedure for Part 2:

     - In the first session (90-minute session), after Part 1, we give each student 5 vouchers.

     - We describe two snacks:

          Apple: a healthy snack.
          Cookie: a tasty snack but unhealthy.

     - We tell them: "You are trying to maintain a healthy diet. At the end of the next two sessions, you will receive a snack. We will give you choices."

     - Options at time 0:

          Option A (Flexible): At the start of each of the next two sessions, you will be asked to choose between:
              - An apple: costs 0 vouchers
              - A cookie: costs 2 vouchers (deducted from your 5-voucher endowment)
          You will receive your chosen snack at the end of the session.

          Option B (Fixed): You commit now to receiving an apple at the end of each of the next two sessions. There is no cost. You cannot change your mind.

          Option C (Commitment): You pay 1 voucher now. This removes the cookie option. Then at the start of each session, you will only be offered the apple (at no cost). You will receive the apple at the end of the session.

     - They choose one of A, B, or C.

     - Record their choice.

     - Then, at the start of session 2 (next session, 5 minutes allocated):

          - For students who chose A: 
               - They are asked: "What do you choose for today: apple (0 vouchers) or cookie (2 vouchers)?" Record.
          - For students who chose B or C: they get an apple automatically.

     - Similarly, at the start of session 3 (the session after that, 5 minutes allocated):

          - A students choose again.
          - B and C get apple.

     - At the end of each session, they receive the snack they are due.

     - We also deduct the costs accordingly.

     What we expect:
          - Some choose A, planning to choose apple both times, but then in the moment, they choose cookie for one or both sessions.
          - Some choose B: they are committed to apple and don't trust themselves.
          - Some choose C: they pay to remove the temptation.

     And when we see a student choose apple in a session, we don't know if it's because they are on B or C (and have no choice) or on A and are resisting.

     But note: in session 2 and 3, we can ask the A students to choose, so others know they are not choosing? We can do it privately or publicly? We should do it privately to avoid peer effects.

     We can have them fill out a form.

     Now, the bounded bankroll for the dealer in Part 2:

     - The dealer provides the snacks. The cost to the dealer: 
          - Apples cost, say, $1 each, cookies $0.50 each? We don't care because we are using vouchers, but the department is paying.
          - The dealer also handles the vouchers.

     - Initial endowment: 5 vouchers per student (16 students) = 80 vouchers printed.

     - Then, in option C, the dealer collects 1 voucher per student choosing C.

     - In option A, the dealer may collect 0, 2, or 4 vouchers (if they choose cookie in both sessions).

     - The dealer must provide the snacks.

     - The net vouchers collected: 
          - From C: 1 per C student.
          - From A: 0, 2, or 4 per A student.
          - B: nothing.

     - The dealer uses these vouchers to buy the snacks? Or the snacks are provided by the department. We don't need to account for that.

     So the bankroll for vouchers is not needed because vouchers are just being printed.

     Now, the script and handling of issues.

     Facilitator script:

     Part 1: Synchronic incoherence

     "Today we will do an activity on decision making. You will be given lotteries and asked to make choices and state prices. Some of you may end up with vouchers that can be redeemed for snacks at any session."

     Present the two bets:

     "Bet A: If a die roll is 1, 2, 3, or 4, you win 5 vouchers. Otherwise, win nothing. (4 in 6 chance to win)
     Bet B: If a die roll is 6, you win 16 vouchers. Otherwise, win nothing. (1 in 6 chance to win)"

     Step 1: Choice
     "If you had to choose between Bet A and Bet B, which would you choose? Please write your choice on a piece of paper: A or B."

     Step 2: Pricing
     "Now, imagine you own Bet A. What is the minimum number of vouchers you would be willing to sell it for? This should be the lowest price at which you would agree to sell it. Write a number."
     "Similarly, if you owned Bet B, what is the minimum number of vouchers you would be willing to sell it for? Write a number."

     Collect the responses.

     Identify those who chose A over B but have a selling price for B higher than for A.

     For those students, approach them (or announce to the class, but individually might be better):

     "You chose Bet A, so I am giving you Bet A. [Give them a certificate for Bet A.]"

     Then, "I am offering to buy Bet A from you at your stated selling price for A plus 0.5 vouchers. Do you accept? [They should say yes.]" 
     - If they refuse, remind them: "This is above your minimum selling price, so you should be willing to sell." If they still refuse, note it and skip them.

     They sell and receive the vouchers.

     Then, "I am offering to sell you Bet B at your stated selling price for Bet B minus 0.5 vouchers. Do you accept?"
     - If they refuse, remind them: "This is below your minimum selling price for Bet B, so you should be willing to buy it at this price." If they refuse, they are left with vouchers.

     Then, at the end, resolve all bets: each student rolls a die for each bet they hold and gets the outcome in vouchers.

     Part 2: Diachronic reversal

     "Now, we will do a second activity about planning for the future. You have 5 vouchers. You will make choices about snacks for the next two sessions."

     Present the options:

     "Option A (Flexible): In each of the next two sessions, you can choose between an apple (0 vouchers) or a cookie (2 vouchers). Your choice will be made at the start of the session, and you will receive the snack at the end.

     Option B (Fixed): You will receive an apple at the end of each session at no cost. You cannot choose a cookie.

     Option C (Commitment): You pay 1 voucher now. This removes the cookie option for both sessions. Then, in each session, you will receive an apple at no cost."

     "Please choose one of A, B, or C."

     Collect choices.

     In the next two sessions (each at the start, 5 minutes):

     For each student who chose A:
          - Ask them to choose: apple or cookie for this session? Record.
          - Deduct the cost (0 for apple, 2 for cookie) from their voucher balance.

     For B and C, they get apple, no deduction for B, and for C they already paid 1.

     At the end of each session, distribute the snacks.

     Handling a student who refuses to trade in Part 1:

     - If they refuse to sell Bet A: "You stated that you would sell at [their price] or above. I am offering [price+0.5]. If you don't sell, you are acting against your own stated minimum. Why?" 
       If they say they suspect a trap, say: "The activity is designed to learn about decision making. We are not trying to trick you, but to observe how people make decisions. If you really don't want to sell, that's your choice, but then we cannot proceed to the next trade for you." 
       Then move on.

     - If they refuse to buy Bet B: similar response.

     For a student who wants to renegotiate after the fact in Part 1 or Part 2: 
          - "The rules were stated upfront. We cannot change after the fact."

     Recording sheet:

     Part 1:
          Student name | Choice (A or B) | Sell price A | Sell price B | Pumped? (Y/N) | Trades done? (Sold A? Bought B?) | Final vouchers from trades | Outcome of lottery (if any) | Total vouchers after lottery

     Part 2:
          Student name | Initial choice (A, B, or C) | Voucher balance after initial choice | Choice in session 2 (apple/cookie) | Cost session 2 | Choice in session 3 (apple/cookie) | Cost session 3 | Final voucher balance

     Debrief:

     Part 1: 
          - Point out that some were pumped: they ended up with a lottery they originally did not prefer and fewer vouchers.
          - This happened because of an inconsistency between their choice and their pricing (synchronic incoherence).
          - The money pump exploits this pattern in their responses.

     Part 2:
          - Observe the choices: 
               - Some chose A and then chose cookies (reversal between planning and acting).
               - Some chose B or C to avoid the temptation.
          - Note that when we see someone eat an apple, we don't know if it's because they chose B/C (commitment) or because they chose A and resisted (planning and sticking to it).
          - The diachronic pump: if they choose A and then choose cookies, they spend extra vouchers and might regret it (compared to if they had chosen B or C).

     What will predictably go wrong:

     - Stakes too small: If vouchers are for small snacks, students might not care. Solution: use a good they value, or use multiple vouchers for a bigger snack.

     - Satiation: If they get too many snacks, they might not want more. Solution: use small snacks or let them take vouchers home to redeem later.

     - Suspicion: They might guess the purpose and avoid trades. Solution: run the activity early in the term, or present it as a demonstration.

     - Genuine preference change: In Part 2, they might change their mind about snacks between sessions. This confounds with reversal due to self-control. Solution: in debrief, discuss the difference between true preference change and reversal due to dynamic inconsistency.

     - Difficulty of telling foresight from plan-honoring: We can't read their minds. We have to rely on their choices at time 0 and later.

     What the activity cannot reproduce:

     - In Part 1, the money pump in a neutral medium (money) is more forceful because it doesn't have diminishing marginal utility. With a consumption good, if they have many vouchers, each additional one might be worth less. We tried to mitigate by using small stakes.

     - In Part 2, the commitment cost (paying to remove an option) might not be observed if the cost is too high or if they don't value the commitment. We set the cost at 1 voucher, which is half the cost of a cookie, so it might be attractive.

     Separating settled from contested:

     - Exploitability: Some argue that being money-pumped is evidence of irrationality, while others argue that it constitutes irrationality. (Flag)
     - Sticking to a plan: Some argue that it is coherent (as a commitment device), while others (sequential rationalists) say you should always choose what is best at the time. (Flag)
     - Pumping in a consumption good: Some argue that if the good has diminishing marginal utility, then the pump might not be a loss in utility. We assume linearity in money, but here we use a good. (Flag)

     We will design the activity and let the discussion happen in debrief.

     Given the complexity, we might adjust in practice.

     Let's finalize the design.
answer: |-
  Below is a comprehensive design for your two-part activity. I'll address all components: rules, materials, payoff scheme, facilitator script, handling edge cases, recording sheet, debrief, predictable challenges, and philosophical distinctions. The currency is **snack vouchers** (1 voucher = 1 unit of a standardized snack, e.g., a cookie or coffee, redeemable at any session). To mitigate substitution costs (non-neutral medium), we use small-stake vouchers to minimize satiation/diminishing marginal utility and design choices to isolate preferences.

  ---

  ### **Part 1: Synchronic Incoherence (Cyclic Preferences)**
  **Objective:** Students experience a money pump due to cyclic preferences or elicitation-mode dependence (choice vs. pricing reversals).  
  **Mechanism:** Exploit preference reversals between lotteries (P-bet vs. $-bet).  

  #### **Rules & Setup**
  1. **Initial Endowment:**  
     - Each student starts with **10 vouchers** and a **lottery ticket** (P-bet or $-bet, assigned based on their choice).  
     - **Lottery definitions**:  
       - **P-bet (High probability)**: 80% chance to win 5 vouchers (e.g., roll 1–4 on a 5-sided die).  
       - **$-bet (High payoff)**: 20% chance to win 20 vouchers (e.g., roll 5 on a 5-sided die).  
     - *Why vouchers?* Neutrality is compromised, but small stakes minimize diminishing marginal utility (e.g., 1 voucher ≈ $0.10–$0.20 value).  

  2. **Activity Flow** (30–40 mins):  
     - **Step 1: Choice Task**: Students choose between P-bet and $-bet. Record choices.  
     - **Step 2: Pricing Task**: Students state the minimum vouchers they would accept to sell each bet (if they owned it). Record prices.  
     - **Step 3: Money Pump**:  
       - For students who **chose P-bet but priced $-bet higher** (preference reversal):  
         - **Trade 1**: Dealer buys their P-bet at their stated P-bet price + 0.5 vouchers.  
         - **Trade 2**: Dealer sells them the $-bet at their stated $-bet price − 0.5 vouchers.  
       - Students end up with $-bet and net loss: `(P-bet price + 0.5) - ($-bet price − 0.5) + initial vouchers = net loss of ($-bet price - P-bet price - 1)`.  
     - **Step 4: Lottery Resolution**: Roll dice for all held bets. Winners receive vouchers.  

  #### **Materials**  
  - Dice (5-sided, or simulate using apps).  
  - Voucher tokens (paper slips).  
  - Recording sheets (see template below).  
  - Bet tickets (P/$-bet cards).  

  #### **Payoff Scheme & Bankroll**  
  - **Dealer bankroll**: 200 vouchers (capped loss).  
    - Max exposure: 16 students × (max $-bet price [e.g., 15] + lottery payout [20]) = 560 vouchers.  
    - **Compensation for non-neutrality**: Set high-stake lotteries (20 vouchers) to outweigh voucher utility curvature. Losses feel tangible.  
  - **Student payouts**: Resolved immediately.  

  #### **Facilitator Script**  
  **Intro (5 mins)**:  
  > "Today we’ll explore decision-making with uncertain outcomes. You have 10 vouchers and will choose between two lotteries. Later, you’ll set prices for these bets. All trades use vouchers redeemable for snacks. Remember: There’s no trick—state true preferences."  

  **During Pump (for targeted students)**:  
  > - *Trade 1*: "I’ll buy your P-bet at your price, [X], plus 0.5 vouchers. Do you accept?"  
  > - *Trade 2*: "I’ll sell you the $-bet at your price, [Y], minus 0.5 vouchers. Do you accept?"  
  > - *If refusal*: "This matches your stated prices. If you decline, you’re turning down a gain you said you’d accept. But it’s your choice—we’ll skip you."  
  > - *If renegotiation*: "Trades are final once accepted. We can discuss why later."  

  **Key Moment**: Highlight net loss post-trade (e.g., "You started with 10 vouchers and a P-bet; now you have a $-bet and 7 vouchers").  

  ---

  ### **Part 2: Diachronic Reversal (Planning vs. Acting)**
  **Objective:** Students confront reversals between planning and acting. Some pay to remove options, some abandon plans, some stick to plans.  
  **Mechanism**: Choose a flexible plan ("menu") vs. fixed plan vs. commitment (pay to remove temptation).  

  #### **Rules & Setup**  
  1. **Initial Choice (This Session)**:  
     - Each student has **5 vouchers**. Choose:  
       - **A (Flexible)**: Choose each session between:  
         - **Apple** (healthy, costs 0 vouchers).  
         - **Cookie** (tempting, costs 3 vouchers).  
       - **B (Fixed Plan)**: Get apple in both sessions (0 cost). No cookie option.  
       - **C (Commitment)**: Pay 1 voucher now to remove cookie option. Get apple both sessions (0 cost).  

  2. **Future Sessions** (5 mins each at start of next two sessions):  
     - **A students**: Choose apple or cookie in each session. Pay cookie cost if chosen.  
     - **B/C students**: Automatically get apple.  

  3. **Payouts**:  
     - Snacks delivered at session end.  
     - Voucher costs deducted after choices.  

  #### **Materials**  
  - Voucher tokens.  
  - Choice cards (A/B/C).  
  - Apples/cookies (or vouchers redeemable for them).  

  #### **Payoff Scheme**  
  - **Dealer bankroll**: 80 vouchers (16 students × 5). Minimal risk—costs covered by voucher deductions.  
  - **Non-neutrality compensation**: Use identical snacks to control for preference drift. Frame apples as "healthy" (low satiation) to mimic neutral goods.  

  #### **Facilitator Script**  
  **Intro (5 mins)**:  
  > "Now, plan snacks for the next two weeks. Option A offers flexibility, B locks in apples, C removes temptation for a fee. Choose based on your future preferences."  

  **Future Sessions (Script for Part A Students)**:  
  > "What’s your choice today: apple (0 vouchers) or cookie (3 vouchers)?"  
  > - *Record immediately*.  

  **Key Moment**: Contrast pre-commitment (C) with flexible failures (A students choosing cookies).  

  ---

  ### **Recording Sheets**  
  **Part 1**:  
  | Student | Initial Choice (P/$) | P-bet Price | $-bet Price | Pumped? (Y/N) | Final Vouchers | Lottery Outcome | Total Vouchers |
  |---------|-----------------------|-------------|-------------|---------------|----------------|-----------------|----------------|  
  | ...     | ...                   | ...         | ...         | ...           | ...            | ...             | ...            |  

  **Part 2**:  
  | Student | Session 0 Choice (A/B/C) | Initial Vouchers | Session 1 Choice | Session 1 Cost | Session 2 Choice | Session 2 Cost | Final Vouchers |  
  |---------|----------------------------|------------------|------------------|----------------|------------------|----------------|----------------|  
  | ...     | ...                        | ...              | ...              | ...            | ...              | ...            | ...            |  

  ---

  ### **Debrief (20–30 mins)**  
  Map activity moments to concepts:  
  1. **Part 1 → Synchronic Incoherence**:  
     - **Cyclic Pattern**: "You accepted each trade as an improvement, yet ended poorer. The pump exploited *inconsistency* between your choice and pricing—a synhic flaw."  
     - **Argument**: Highlight preference reversals (choice ≠ pricing) as the engine.  

  2. **Part 2 → Diachronic Reversal**:  
     - **Three Patterns**:  
       - A students choosing cookies: "You took flexibility but acted against your plan."  
       - C students: "You paid to remove temptation—foresight about your future self."  
       - B students: "You stuck to your plan, avoiding temptation."  
     - **Key Insight**: "Externally, all apple-eaters look identical, but their paths differ: commitment (C), resistance (A), or no choice (B)."  

  3. **Substitution Cost Discussion**:  
     - "Vouchers aren’t cash, so diminishing utility might soften the pump. But we set stakes low to approximate neutrality—real money pumps would feel sharper."  

  ---

  ### **Predictable Challenges & Mitigations**  
  1. **Stakes too small**: Students may not engage.  
     - *Fix*: Use high-value snacks (e.g., artisanal coffee) or let vouchers pool for larger rewards.  
  2. **Suspicion/Refusal**: Some may guess the pump and refuse trades.  
     - *Fix*: Emphasize anonymity, avoid terms like "pump," or run as a "preference study."  
  3. **Satiation**: Repeated snacks reduce marginal utility.  
     - *Fix*: Use non-satiating goods (e.g., coffee vouchers usable anytime).  
  4. **Genuine Preference Change**: In Part 2, a student may "reverse" due to new information.  
     - *Fix*: In debrief, distinguish true change ("I learned cookies are delicious") from dynamic inconsistency ("I craved sugar in the moment").  
  5. **External Observability**: Hard to tell foresight (C) from willpower (A) in apple-eaters.  
     - *Fix*: Use the recording sheet to reveal choices during debrief.  

  **What the Activity Cannot Reproduce**:  
  - **Neutral Medium Intuition**: Money pumps feel more irrational with cash (linear utility). Vouchers require imagination—explicitly discuss this gap.  
  - **Live Disputes to Flag** (do not resolve in activity):  
    - Is exploitability *evidence* of irrationality, or does it *constitute* it?  
    - Is sticking to a plan (B) coherent (commitment) or irrational (violates sequential rationality)?  
    - Does a consumption-good pump have the same normative force as a money pump?  

  ---

  ### **Settled vs. Contested in Rational Choice Theory**  
  **Settled**:  
  - Synchronic incoherence (cyclic prefs, preference reversals) enables money pumps.  
  - Diachronic inconsistency (planning vs. acting) is real and exploitable.  

  **Contested (Flag in Debrief)**:  
  1. **Exploitability as Irrationality**:  
     - *Evidential View*: Pumps reveal irrationality but don’t define it (e.g., Joyce, 1999).  
     - *Constitutive View*: Exploitability *is* irrationality (e.g., Hammond, 1988).  
  2. **Sticking to Plans**:  
     - *Coherent*: As rational commitment (Gauthier, 1997).  
     - *Violates Sequentiality*: As irrational if suboptimal at action time (McClennen, 1990).  
  3. **Consumption vs. Money Pumps**:  
     - *Same Force*: If utility is linearized (e.g., Rabin, 2000).  
     - *Different Force*: If goods induce non-linearities (e.g., Koszegi & Rabin, 2006).  

  ---

  This design balances pedagogical impact with logistical constraints. Students experience both pump types, confront key debates, and leave with visceral intuition—while you control costs and time. Run Part 1 in the 90-min session and Part 2 across three sessions (with 5-min future segments). Adjust snacks/voucher values for your context.
