  3. **Current-Utility Focus + Selection-Default:** Unexplored—deflationists reject defaults.  
  4. **Agnostic Temporal Focus + Testability:** Unoccupied—if "why" is untestable, methods are irrelevant.  

  This instrument sorts users by concrete predictions, avoids tabooed terms in options, and identifies 12 leaves with explicit collapses. The compound cases expose fault lines, while the axis-based structure ensures logical coherence.
