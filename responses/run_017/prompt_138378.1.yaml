  ### The Diagnostic Instrument  
  **Title:** What’s Your Evolutionary Explanatory Style?  
  **Instructions:** For each scenario, choose the option that best reflects your instinctive expectation or prioritization. Answer based on concrete predictions, not abstract principles.  

  #### Questions  
  1. **Giraffe’s Recurrent Laryngeal Nerve:** This nerve takes a 4.5-meter detour in giraffes (vs. a direct 0.1-meter path). When considering fossil ancestors, what do you expect to find?  
     - A: Earlier giraffe relatives had shorter necks, making the detour harmless; it persists because altering nerve embryology risks fatal errors.  
     - B: The detour was never optimal, but selective costs were negligible compared to neck-lengthening benefits, so change wasn’t favored.  
     - C: Nerve routing patterns in mammals are developmentally inflexible; the detour reflects a conserved blueprint, not adaptive trade-offs.  

  2. **Panda’s Radial Sesamoid "Thumb":** This wrist bone functions as a thumb for bamboo stripping. What would you predict about its genetic basis?  
     - A: Genes specific to this bone show signatures of recent selective sweeps linked to bamboo specialization.  
     - B: The bone’s size/shape varies widely in pandas, but selection stabilizes its current form due to bamboo benefits.  
     - C: The same bone appears in non-bamboo-eating relatives with different functions; its form is tightly linked to conserved growth pathways.  

  3. **Human Chin:** Humans uniquely have a protruding chin bone. What evidence would most strongly support your view?  
     - A: Biomechanical models showing chin shape optimizes speech/biting forces better than ancestral forms.  
     - B: Fossil records reveal chin emergence coincided with facial reduction, suggesting spillover effects from other selected changes.  
     - C: Genetic studies find chin morphology is uncorrelated with fitness and drifts neutrally across populations.  

  4. **Cavefish Eye Loss:** Cave-adapted fish lose eyes and pigmentation. What do you predict about their surface-dwelling relatives?  
     - A: Surface fish in light-poor environments evolve reduced eyes faster than neutral traits, showing selection actively removes them.  
     - B: Surface fish with eye-reducing mutations show no fitness difference in darkness; loss occurs when mutations drift unchecked.  
     - C: Surface fish embryos develop eyes via inflexible pathways; only in caves do environmental cues repurpose development toward non-eye outcomes.  

  5. **Mammalian Cervical Vertebrae:** Most mammals have exactly seven neck vertebrae (including giraffes). What does invariance suggest?  
     - A: Seven vertebrae balance flexibility/stability optimally; deviations (e.g., in sloths) occur only when niche shifts outweigh costs.  
     - B: Mutations altering vertebra number are lethal because they disrupt nerve/blood vessel patterning, constraining variation.  
     - C: The number fluctuates randomly in fossil transitions but stabilizes at seven due to low functional impacts in most lineages.  

  6. **Sickle-Cell Allele:** This allele causes anemia in homozygotes but resists malaria in heterozygotes. How would you investigate its origin?  
     - A: Compare allele frequencies in malaria-free regions to show selection maintains it only where malaria exists.  
     - B: Sequence DNA from ancient skeletons to see if the allele predated malaria’s spread, implying co-option from an older function.  
     - C: Measure mutation rates to determine if heterozygote benefits outweigh costs of new deleterious variants.  

  7. **Vertebrate vs. Cephalopod Eyes:** Both groups evolved camera eyes independently. What explains the vertebrate eye’s "backward" retina (with a blind spot)?  
     - A: The retina’s layout optimizes protection or metabolic efficiency, outweighing visual deficits.  
     - B: Early vertebrate development locked in a suboptimal design; subsequent changes could only tweak, not overhaul, it.  
     - C: No design is globally optimal; the vertebrate version succeeded by chance in early seas, and persistence obviates redesign.  

  8. **Peacock’s Train:** This ornate tail attracts mates but increases predation risk. What experiment would best test its evolution?  
     - A: Truncate tails in wild populations and measure fitness effects on mating success vs. survival.  
     - B: Compare trainless relatives to see if sexual selection co-opted preexisting feather structures for new display roles.  
     - C: Assess genetic variation in train size; if low, it suggests canalized development limits response to selection.  

  9. **Compound Case 1: Deep-Sea Snail Shell (New):** A snail evolves a bioluminescent shell pattern that attracts mates in darkness. The pattern arises from a heat-sensitive developmental pathway (from an ancestor living near thermal vents). No close relatives survive; fossils show the pathway existed pre-luminescence. Mutations altering the pattern are lethal 95% of the time. What do you expect functional studies to show?  
     - A: The pattern’s spectral properties are finely tuned to mate detection, implying strong recent selection shaped it.  
     - B: The pattern varies little within the species; its form reflects the pathway’s intrinsic properties, with selection only stabilizing minor variants.  
     - C: Population genetics reveals low diversity in pattern genes, suggesting it drifted to fixation during a bottleneck, with mate attraction emerging later.  

  10. **Compound Case 2: Desert Plant Spines (New):** A cactus-like plant evolves hollow spines that house symbiotic ants. The spine shape is developmentally constrained by water-storage tissue inherited from non-desert ancestors. No extant relatives have hollow spines; spines arose after desert adaptation. Mutations affecting hollowness are rare due to developmental buffering. How would you study its evolution?  
      - A: Test spine hollowness in ant-free environments to see if costs outweigh benefits, implying selection requires symbiosis.  
      - B: Examine embryonic spine development to see if hollowness emerges automatically from tissue architecture, making symbiosis exploitable.  
      - C: Model genetic drift in isolated populations to determine if hollowness fixated neutrally before ants colonized it.  

  #### Why Compound Cases Are Diagnostic  
  - **Snail Shell (Q9):** Forces tension between historical origins (pathway predates luminescence), current utility (mate attraction), and constraint (lethal mutations). Awkward for:  
    - Strong adaptationism (must ignore developmental lethality).  
    - Deflationists (cannot sidestep historical questions with no relatives).  
    - Sceptics (empirical tests are feasible but incomplete).  
  - **Plant Spines (Q10):** Skews variant space (buffered mutations) and lacks comparatives. Indistinguishable for:  
    - Exaptation-first and structuralist views (both expect co-option of preexisting structures).  
    - Instrumentalist and heuristic adaptationism (both use models to probe constraints).  

