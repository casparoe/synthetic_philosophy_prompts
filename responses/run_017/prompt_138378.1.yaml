  Let's list the distinctions:

  1. Historical (selected-effects) vs. current-utility (causal-role) notion of function.
  2. Default position: drift/near-neutrality as the null vs. selection as the default.
  3. Interpretation of optimality models: literal (organisms are near optimum) vs. instrumental (model as a tool to find constraints).
  4. Status of developmental/architectural biases: independent causes vs. downstream of past selection.
  5. What "why" question is being asked: origin, spread, or persistence; and whether the answer varies by level (molecular, developmental, morphological).
  6. Whether the debate is empirically adjudicable or a choice of research program.

  Now, we must map the leaves (positions) to these distinctions. The leaves we want to represent:

  1. Strong empirical adaptationism (selection powerful, most traits locally optimal)
  2. Optimality-model instrumentalist
  3. Adaptationism as heuristic reverse engineering
  4. Test adaptationism by trying to break it
  5. Gould-Lewontin-style pluralism (spandrels, architectural by-products)
  6. Exaptation-first view
  7. Structuralist/developmental-bias view (arrival of the fittest)
  8. Niche-construction or developmental-systems pluralism
  9. Neutralist or drift-default (treats morphology and molecules differently)
