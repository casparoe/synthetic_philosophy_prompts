  ### Stage 1: Brainstorming the Logical Space  
  I begin by mapping the core distinctions you specified into a minimal set of binary or three-way forks that define the logical space. These forks must be empirically grounded, mutually exclusive where possible, and capable of generating your desired leaves. I identify five primary axes that capture the nuances of your distinctions while minimizing redundancy:  

  1. **Temporal Focus of Explanation (What "why" means):**  
     - (A) Historical origin/spread (trait arose/spread due to past selective pressures).  
     - (B) Current utility/persistence (trait maintained by ongoing selection or constraints).  
     - (C) Agnostic/untestable (origin/persistence cannot be disentangled).  

  2. **Default Explanatory Null Hypothesis:**  
     - (A) Selection-first (assume optimization unless contradicted).  
     - (B) Drift/neutrality-first (assume neutrality unless selection is robustly shown).  
     - (C) Constraint-first (assume developmental/structural biases dominate).  

  3. **Status of Optimality Models:**  
     - (A) Literal (models approximate biological reality; failures indicate incomplete modeling).  
     - (B) Instrumental (models are heuristic tools; failures reveal hidden constraints).  
     - (C) Suspicious (models often mask alternatives; prioritize non-optimality narratives).  

  4. **Developmental/Mutational Biases:**  
     - (A) Independent causes (biases shape evolution irrespective of past selection).  
     - (B) Downstream of past selection (biases are optimized "tools" for evolvability).  
     - (C) Irrelevant/untestable (biases cannot be distinguished from selection).  

  5. **Empirical Adjudicability:**  
     - (A) Testable with available methods (e.g., phylogenetics, experiments).  
     - (B) Testable in principle but currently limited (e.g., for deep-time traits).  
     - (C) Untestable storytelling (evidence rarely resolves competing narratives).  

  #### Logical Combinations and Occupancy  
  These axes generate 108 possible combinations (3 × 3 × 3 × 3 × 3). Only 14 are "live" (coherent and occupied by your leaves), while 94 are "empty" due to incoherence, unattractiveness, or lack of representation. For example:  
  - **Incoherent combinations:** A literal optimality view (3A) paired with a drift-first default (2B) is internally inconsistent.  
  - **Unattractive combinations:** A historical focus (1A) with agnosticism on bias (4C) offers no clear research path.  
  - **Unexplored combinations:** Instrumental optimality (3B) with a constraint-first default (2C) lacks advocacy; most instrumentalists assume selection as the starting point.  

  #### Leaf Mapping to Combinations  
  Your desired leaves collapse into 12 distinct positions based on shared commitments across axes. The Gould-Lewontin pluralism and niche-construction pluralism leaves merge (both emphasize constraints and reject selection-defaults), while the "test adaptationism by breaking it" view is absorbed into the optimality-model instrumentalist leaf (both treat models as stress-testable heuristics). The final leaves and their axis profiles:  

  | Leaf Label                      | Temporal Focus | Default Null | Optimality Status | Bias Status | Empirical Adjudicability |  
  |---------------------------------|----------------|--------------|-------------------|-------------|---------------------------|  
  | Strong empirical adaptationism  | A              | A            | A                 | B           | A                         |  
  | Optimality-model instrumentalist| B              | A            | B                 | B           | A                         |  
  | Adaptationism as heuristic      | B              | A            | B                 | B           | B                         |  
  | Gould-Lewontin pluralism        | C              | C            | C                 | A           | A                         |  
  | Exaptation-first                | A              | B            | C                 | A           | B                         |  
  | Structuralist/developmental-bias| B              | C            | C                 | A           | A                         |  
  | Neutralist/drift-default        | C              | B            | C                 | C           | A                         |  
  | Deflationist                    | B              | C            | C                 | C           | C                         |  
  | Sceptic                         | C              | C            | C                 | C           | C                         |  

  *Note:* The adaptationism-as-heuristic and optimality-model instrumentalist leaves share all axis commitments except empirical adjudicability. The instrument distinguishes them via compound cases.  

  #### Empty Cells (Examples)  
  1. **Literal optimality + drift-default:** Incoherent—if drift is default, traits cannot be near-optimal.  
  2. **Historical focus + bias-agnostic:** Unattractive—no clear method to study origins if biases are dismissed.  
  3. **Instrumental optimality + constraint-default:** Unexplored—no major school advocates this pairing.  
  4. **Current-utility focus + selection-default:** Unoccupied—deflationists reject selection-defaults.  

