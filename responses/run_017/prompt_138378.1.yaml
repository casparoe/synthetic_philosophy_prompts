  We note that some of these might overlap or be the same. Let's analyze:

  - Strong empirical adaptationism: likely holds that selection is the default, optimality models are literal, and biases are downstream of selection.
  - Optimality-model instrumentalist: uses models as tools, so might be agnostic on whether organisms are optimal, and uses failures to find constraints. Might be compatible with several views.
  - Adaptationism as heuristic reverse engineering: similar to instrumentalist, but emphasizes the heuristic value. Might be seen as a methodology without strong ontological commitments.
  - Test adaptationism by trying to break it: this is a methodological stance, which might be shared by both adaptationists and pluralists who are testing.
  - Gould-Lewontin pluralism: emphasizes constraints, spandrels, and non-adaptive explanations. Likely holds that drift is a viable null, biases are independent, and the debate is empirically testable but requires pluralism.
  - Exaptation-first view: emphasizes that traits often have new functions not originally selected for. This might be a specific historical claim.
  - Structuralist/developmental-bias view: focuses on how biases in variation affect evolution, independent of selection. Might see biases as having independent causal standing.
  - Niche-construction pluralism: emphasizes the interaction between organisms and environment, so might be a form of pluralism that includes feedback.
  - Neutralist: emphasizes drift, especially at the molecular level, and might treat drift as the null. Might have a different stance for morphology.
  - Deflationist: rejects the historical function question, only cares about current utility. Might see the historical question as ill-posed.
  - Sceptic: thinks the debate is untestable, so might not believe in strong empirical adjudication.

