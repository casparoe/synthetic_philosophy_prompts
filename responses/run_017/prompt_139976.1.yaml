prompt: |-
  I host a podcast on explanation and evidence in the historical and social sciences. My next guest works on path dependence and defends a strong version of it, which she formulates in three parts. First: in a real range of episodes, an outcome was produced by a cascade in which some early event — one no better suited to producing that outcome than its available rivals — was amplified by positive feedback of the familiar kinds (learning effects, coordination effects, adaptive expectations). Second: the proper test for such a claim is an erasability test — ask whether deleting or reversing the early event, while leaving the amplifying mechanism itself in place, would have changed the outcome. Third: for the episodes that pass that test, the answer to the question would something functionally equivalent have arrived anyway is often no, at any rate at the level of description at which the outcome mattered to the people who had to live inside it.

  She has given this interview before and handles it very smoothly. I want you to draft ten to twelve questions that make the machinery do real work. For each question, add a one- or two-sentence note on the reply you expect her to give, and then a follow-up written specifically against that reply rather than alongside it.

  Coverage and constraints:

  She is impatient with the standard war stories about keyboard layouts and videocassette formats, and will say they have been both over-claimed and over-debunked. Do not build a question around either; if one appears at all, use it only to force her to state what a well-documented instance of lock-in would have to look like.

  At least one question must attack the erasability test on the following ground: for any actual episode we possess only the sequence that occurred, so the counterfactual in which the early event is removed is not something anyone can observe. Press her on what could count as evidence for or against a lock-in claim if the tape cannot be run twice, and follow up on the move you should expect her to make — appealing either to cross-case comparisons in which a similar mechanism operated with a different initial ordering, or to the parts of the mechanism that are observable independently of the outcome.

  At least one question must press on the grain of description. The same episode looks contingent when described finely and inevitable when described coarsely: this firm's format prevails versus some shared format prevails. Ask what fixes the correct grain. Anticipate her answering that it is fixed by the alternatives actually available to the agents at the time, or by what those agents had reason to care about, and prepare the follow-up that makes trouble for that answer — in particular the worry that the grain will then be chosen so as to guarantee whichever verdict she wants.

  At least one question must raise the selection objection: competitive pressures, deliberate standard-setting, and the simple fact that agents can see an incumbent's defects are all mechanisms for displacing inferior arrangements, so lock-in should be rare, self-correcting, and very hard to detect after the fact. Expect her to reply that the switching costs are themselves products of the arrangement that got locked in, and have a follow-up ready on whether that reply insulates the view from ever being wrong.

  At least one question should apply her own test to a case I have invented for the occasion, which you should reproduce before asking about it. In 1908 a provincial government sets up a land registry and must decide whether to index it by parcel or by owner; the clerk who opens the office indexes by parcel, because that is how the office's one filing cabinet happens to be labelled. A neighbouring province opens a registry the same year and indexes by owner for an equally incidental reason. For twenty years both registers are equally accurate and equally cheap to keep up. Then the parcel-indexed province develops a dense market in mortgage lending and title insurance, because lenders can aggregate and compare parcels; the owner-indexed province does not, and by 1940 it cannot convert, since re-indexing would interrupt every pending transaction. But the owner-indexed province has markedly fewer contested inheritances, because family claims run through persons rather than through plots. Ask her whether this is a case of lock-in on her test. In your note, name the specification you expect her to demand before she will answer — I suspect it will be either whether the divergence in lending markets was foreseeable in 1908, or whether her account requires the retained arrangement to be worse than the discarded one — and then let the follow-up ask why that specification, rather than some other, is the one that settles the matter.

  At least one question must press the normative upshot without letting her treat it as someone else's problem. If lock-in is real and we generally cannot tell in advance which of several rival arrangements is better, what follows — greater willingness to intervene in early standard-setting, greater willingness to break up incumbents, or simply greater humility? Then follow up on the tension between her descriptive claim, that which arrangement wins is in a sense arbitrary, and any prescriptive claim to the effect that we should have chosen differently.

  Close the sequence with a question that hands her one concrete way of turning out to be wrong, phrased so that she cannot treat it as a request for a summary.

  Assume the audience already knows the framework: the questions should be intelligible to such an audience and useless to anyone wanting an introduction to it. Keep them in a natural spoken register but precise, and order them so that the last third is where the pressure is highest. Nothing may turn on looking anything up — no questions about what to read, who else holds the view, or how she came to it.
reasoning: |-
  Okay, the user hosts a podcast on historical and social sciences and has a guest who defends a strong version of path dependence. I need to draft 10-12 questions that challenge her framework effectively. The guest is experienced, so the questions need to push her arguments to their limits without rehashing overused examples like keyboard layouts or VHS vs. Betamax.

  First, I should address the erasability test. The user specified that at least one question must attack this test because we can't rerun history. The guest will likely respond by pointing to cross-case comparisons or observable mechanisms. For the follow-up, I need to press on how we validate the counterfactual when mechanisms aren't perfectly identical across cases. This targets the evidence issue head-on.

  Next, the grain of description problem. When does an outcome look contingent vs. inevitable? She might say the grain is fixed by what agents cared about or the alternatives available. The follow-up should challenge if this lets her choose the grain to get the desired verdict, like "this specific firm won" (contingent) vs. "a standard emerged" (inevitable). That questions objectivity.

  The selection objection is crucial. Critics argue lock-in should be rare because competition or adaptation would correct inferior arrangements. Her reply will be that switching costs are part of the lock-in. The follow-up needs to ask if this makes her theory unfalsifiable—can any persistence be explained away as lock-in? That tests the framework's scientific rigor.

  For the land registry case, I'll present the scenario as described. She'll probably ask whether the divergence was foreseeable in 1908 or if the locked-in outcome is worse. The follow-up should question why foreseeability or relative badness matters, given her theory emphasizes early accidents amplified by feedback, not foresight or optimality.

  Normative implications matter too. If lock-in is real and arbitrary, what should we do? Intervene early? Break monopolies? Follow up on the tension between descriptive arbitrariness and prescriptive claims—how can we say "we should have chosen differently" if "better" is unknowable early on? This ties ethics to epistemology.

  I need to end with a falsification question. Ask what evidence would show her strong path dependence claim is wrong, phrased so it's not just a summary. For example, discovering cases where early accidents didn't lock in despite feedback mechanisms. This forces her to specify defeaters.

  Ordering is key: start with foundational questions, build to harder ones. The land registry case and normative issues go last for maximum pressure. Avoid intros—assume audience knows the framework. Keep questions precise but conversational.

  Also, skip biography or literature—focus solely on the mechanics. Ensure each question has a predicted reply and sharp follow-up. The user wants the guest to "do real work," so no softballs. Cover all required constraints while making it cohesive.
answer: |-
  Here are 12 questions designed to rigorously test your guest's strong path dependence framework, ordered to build pressure, with anticipated replies and targeted follow-ups:

  1.  **Question:** You emphasize the "real range of episodes" where lock-in occurs, dismissing QWERTY/VHS as over-claimed *and* over-debunked war stories. What specific, empirically documented features must a case exhibit to qualify as a strong instance of lock-in under your framework, distinct from those problematic examples?
      *   **Anticipated Reply:** She'll likely demand evidence of: 1) Genuine early-stage equivalence of options (not just perceived), 2) Clear, identifiable positive feedback mechanisms (learning, coordination, expectations) amplifying the initial choice, 3) Significant later costs to switching that demonstrably lock in the outcome, and 4) A plausible erasability test result within the historical context.
      *   **Follow-Up:** If demonstrable early equivalence is so crucial, how do we reliably identify it without perfect foresight? Doesn't the *absence* of adoption for rivals often *become* evidence for their non-equivalence after the fact, creating a circularity risk?

  2.  **Question:** Let's tackle the erasability test head-on. We only have one historical tape; we can't rewind and delete the early event. What concrete empirical evidence *beyond* just asserting the mechanism existed could convince us that, counterfactually, reversing that specific early event *would* have changed the outcome?
      *   **Anticipated Reply:** She'll appeal to: a) Cross-case comparisons where similar mechanisms operated with different initial choices leading to divergent outcomes, or b) Independent evidence of the mechanism's strength and operation *before* the outcome is solidified (e.g., early sensitivity, documented coordination struggles, high perceived switching costs emerging rapidly).
      *   **Follow-Up:** But in cross-case comparisons, how do we ensure the amplifying mechanisms are *sufficiently* similar, not just analogous? Doesn't the uniqueness of historical contexts make finding truly parallel mechanisms for the erasability test inherently speculative?

  3.  **Question:** You argue the outcome "would not have arrived anyway" at the level of description that mattered to historical agents. Yet, coarsening the description often makes outcomes seem inevitable ("a standard emerged"), while fine-graining highlights contingency ("this specific standard won"). What objectively fixes the "correct" level of description?
      *   **Anticipated Reply:** She'll argue the grain is fixed by the alternatives *actually considered consequential* by the agents making choices at the critical juncture and by what they *had reason to care about* in the context of the outcome's impact.
      *   **Follow-Up:** Doesn't this invite cherry-picking? If an outcome looks contingent finely (e.g., "Betamax dominance"), we focus there; if it looks inevitable coarsely (e.g., "a video standard emerged"), we focus there. How does your method avoid selecting the grain to guarantee the desired verdict of contingency?

  4.  **Question:** Critics argue lock-in should be rare: competition weeds out inefficiency, agents adapt or innovate around bad standards, and deliberate coordination *can* overcome incumbency. Why aren't these forces constantly eroding path dependence, making true lock-in the exception rather than a "real range" of episodes?
      *   **Anticipated Reply:** She'll counter that the very mechanisms creating lock-in (e.g., sunk costs in learning, network effects, adaptive expectations) *generate* the high switching costs that make displacement by competition or adaptation prohibitively expensive or practically impossible. The lock-in *creates* the barrier to its own correction.
      *   **Follow-Up:** Doesn't this reply risk making your theory unfalsifiable? *Any* persistence of an arrangement could be attributed *post hoc* to lock-in mechanisms generating switching costs. What observable evidence could show that persistence was *not* due to path dependence?

  5.  **Question:** Consider this case: In 1908, Province A sets up a land registry. The clerk indexes by parcel simply because the filing cabinet was labelled that way. Province B, same year, indexes by owner for an equally incidental reason. Both work fine for 20 years. Then, Province A develops a dense mortgage market because lenders can aggregate parcels easily. Province B sees fewer inheritance disputes because claims track people. By 1940, neither can switch due to disruption costs. Does this pass your erasability test for lock-in?
      *   **Anticipated Reply:** She'll likely demand specification: *Was the later divergence in outcomes (mortgage market intensity vs. inheritance simplicity) foreseeable or even conceivable in 1908?* Her account requires the *outcome* locked-in to be significantly shaped by the early, arbitrary choice – if the consequences were completely unforeseeable, it might fit, but she needs to know if agents could have reasonably anticipated the trade-offs.
      *   **Follow-Up:** Why is unforeseeability (or foreseeability) the key specification here? Your core definition emphasizes early equivalence and amplification by feedback, not foresight. If the clerk's incidental choice *did* causally steer the development path via feedback (e.g., learning by clerks, real estate agents adapting practices), shouldn't it qualify as lock-in regardless of foreseeability?

  6.  **Question:** Building on the land registry case: Assume the outcomes (mortgage market vs. inheritance clarity) were *unforeseen* in 1908, but the causal chain via feedback holds. Province A arguably got a "better" economic outcome, Province B a "better" social one. Does your account require the *locked-in* arrangement to be *inferior* to the discarded alternative(s) for it to be true path dependence?
      *   **Anticipated Reply:** She'll clarify that path dependence, as she defends it, is about contingency and irreversibility due to sequence and feedback, *not* about sub-optimality. The outcome locked-in could be superior, inferior, or simply different. The key is that the *specific* outcome depended crucially on the early accident.
      *   **Follow-Up:** If lock-in doesn't imply inferiority, doesn't that significantly weaken its normative bite? Why should we care about contingency if the outcome is just as good, or good in a different way?

  7.  **Question:** You stress that "something functionally equivalent" often wouldn't have arrived. But how do we define "functional equivalence" rigorously? Doesn't this depend entirely on *which* functions we prioritize, and isn't that prioritization itself often contested or evolving, potentially *after* the lock-in occurs?
      *   **Anticipated Reply:** She'll ground it in the functions relevant to the agents and institutions *at the time of the outcome's emergence and consolidation*, as evidenced by their actions, stated goals, and the problems they were trying to solve.
      *   **Follow-Up:** Doesn't this tie functional equivalence to the very system shaped by the lock-in? If the mortgage market in Province A defines what "functionality" means for land registries there by 1940, how could we *ever* say a different system (like Province B's) was functionally equivalent *to them*? Doesn't this bake the contingency into the definition?

  8.  **Question:** If lock-in is real and pervasive, and we generally cannot tell *ex ante* which of several rival arrangements will prove "better" (however defined) due to unforeseeable consequences, what concrete institutional or policy stance follows? Should we be more interventionist early on, more aggressive in breaking up incumbents later, or simply more epistemically humble about designing systems?
      *   **Anticipated Reply:** She'll likely advocate for greater humility and caution in early-stage institutional design/standard setting, recognizing the long-term, unpredictable consequences. She might also suggest designing in more flexibility or reversibility where possible, but will emphasize the limits of foresight and control.
      *   **Follow-Up:** But doesn't this humility stance conflict with the potential *prescriptive* implication often drawn from path dependence – that we *should* intervene to prevent or break lock-in if we suspect an inferior outcome? How do we justify intervention based on contingency if we truly can't know which path is "better"?

  9.  **Question:** There's a tension between your descriptive claim (the specific outcome is contingent, arbitrary at the start) and any prescriptive claim. If we say "We should have chosen differently," doesn't that imply we know what "better" is – knowledge your framework suggests we often *lack* at the critical juncture? How do you resolve this?
      *   **Anticipated Reply:** She'll distinguish between descriptive contingency and normative evaluation. We can recognize the contingency *ex post* and still make normative judgments *ex post* about the outcome's desirability based on values and observed consequences. The "should have" refers to avoiding the *process* of lock-in if possible, or its *results* if deemed bad later, not claiming perfect foresight existed.
      *   **Follow-Up:** Doesn't this risk hindsight bias? If we judge the outcome bad *ex post*, we declare it a case of inferior lock-in; if good, we might dismiss the contingency. How does your framework prevent the normative evaluation from colonizing the descriptive claim of contingency?

  10. **Question:** You focus on positive feedback (increasing returns) as the amplifier. But negative feedback (diminishing returns, corrective mechanisms) is also ubiquitous in social systems. When does your framework predict lock-in will *fail* to occur despite an early accident? What observable signs distinguish a system ripe for path dependence from one where negative feedback will dampen the initial fluctuation?
      *   **Anticipated Reply:** She'll point to factors like: the *strength and speed* of the initial positive feedback loops relative to any negative ones, the *modularity* of the system (can parts change independently?), the presence of *powerful external forces or actors* capable of imposing change, and the *malleability* of the standard/arrangement itself early on.
      * **Follow-Up:** If the presence of strong negative feedback is what prevents lock-in, doesn't that make lock-in simply synonymous with "situations where positive feedback dominates"? Isn't that a tautology, reducing the explanatory power of "path dependence" as a distinct concept?

  11. **Question:** Historical explanations often appeal to deep structural factors (e.g., class conflict, geography, ideology). How does your strong path dependence account interact with these? Does it subsume them (structure sets the stage for contingent cascades), compete with them, or operate at a different level?
      *   **Anticipated Reply:** She'll argue path dependence operates *within* structural constraints. Structures define the range of possible options and shape the feedback mechanisms (e.g., property rights enabling mortgage markets), but the *specific selection* from among structurally possible paths at a juncture can still be contingent and cascade.
      *   **Follow-Up:** Doesn't this risk making path dependence the explanation for the residual variance left unexplained by structural accounts? How do we adjudicate between a structural explanation ("Province A developed mortgages because of its capitalist class structure") and your path dependence account ("...because of the parcel index") in a case like the land registry?

  12. **Question:** Finally, to ground this empirically: Imagine we discovered compelling evidence in a putative lock-in case showing that, despite the appearance of early equivalence and feedback, the "discarded" alternative was actively tried and rejected multiple times *during* the amplification phase for reasons demonstrably linked to its inherent features, not just switching costs. Would this falsify your strong claim for that case?
      *   **Anticipated Reply:** Yes, absolutely. If rivals were functionally equivalent at the start but were rejected *later* during the period where feedback was supposedly locking in the initial choice *because* they proved inferior or unsuitable under actual use/competition *within that developing system*, it undermines the claim that the outcome was contingent on the initial accident. It suggests selection based on emergent fitness, not mere amplification of arbitrariness.
      *   **Follow-Up:** (This *is* the closing pressure point; no further follow-up needed. The question forces a concrete falsification scenario related to the core mechanism).

  **Key Features Incorporated:**

  *   **Avoids QWERTY/VHS:** Uses them only as a springboard for defining robust cases (Q1).
  *   **Attacks Erasability Test:** Q2 directly challenges evidence for the counterfactual, with follow-up on cross-case validity (Anticipated Reply & Follow-Up).
  *   **Presses Grain of Description:** Q3 targets the grain problem, with follow-up on cherry-picking risk (Anticipated Reply & Follow-Up).
  *   **Raises Selection Objection:** Q4 addresses competitive correction, with follow-up on unfalsifiability (Anticipated Reply & Follow-Up).
  *   **Applies Her Test (Land Registry):** Q5 presents the case, anticipates foreseeability demand, follow-up challenges that specification. Q6 probes inferiority requirement.
  *   **Presses Normative Uptake:** Q8 asks for concrete implications, Q9 tackles tension between contingency and prescription, both with challenging follow-ups.
  *   **Closes with Falsification:** Q12 provides a concrete way the claim could be wrong, phrased as a test.
  *   **Assumes Audience Knowledge:** Uses terms like "erasability test," "positive feedback," "lock-in," "contingency" without definition.
  *   **Spoken Register:** Questions are phrased conversationally but precisely.
  *   **Ordering:** Builds from definitions (Q1) to core mechanisms (Q2, Q10) to major objections (Q3, Q4) to applied case (Q5, Q6) to normative tension (Q7, Q8, Q9) to falsification (Q12). Pressure increases from Q5 onwards.
  *   **No Extraneous Elements:** Focuses solely on the machinery of the theory and its empirical/normative challenges.
