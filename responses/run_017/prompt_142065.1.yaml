  First, I need to understand each distinction deeply. The user mentioned they don't want surveys or literature reviews but original work leading to a research agenda. The six distinctions cover aspects like protocol vs agent, graded singletonhood, custodial vs sovereign, accretion, corrigibility, and the pre-singleton window.

  Starting with downstream impact: Which questions would influence other areas the most? The pre-singleton window (item 6) seems crucial because it deals with current actions affecting future outcomes. If the group can identify actionable levers now, that could immediately guide policymakers and other funders. Similarly, protocol vs agent (item 1) addresses a core debate in AI governance—whether a protocol can avoid capture. This could reshape how people think about institutional design.

  Tractability is next. Some questions might be too speculative. For example, graded singletonhood (item 2) involves defining metrics for enforcement capacity, which is abstract but doable with decision theory. Corrigibility (item 5) might stall because it's tied to unresolved problems in value alignment. The user wants avoidable speculation, so questions with clearer frameworks are better.

  Neglect is important too. The singleton by accretion (item 4) is under-discussed. Most debates assume intentional design, but accidental concentration through supply chains could change ethical considerations. Highlighting this could fill a gap. Custodial vs sovereign (item 3) overlaps with institutional economics, so it might not be as neglected, but applying it to singletons offers new angles.

  Real-world evidence sensitivity: The pre-singleton window (item 6) could be informed by ongoing trends in AI concentration or regulations. If new coordination attempts fail, like international treaties, it would emphasize the urgency of item 6. For protocol vs agent (item 1), developments in compute governance or verification standards could validate or challenge the protocol approach.

  Now, identifying pseudo-questions. Custodial vs sovereign (item 3) might be overrated. The idea that a custodial singleton can preserve options without drifting toward sovereignty seems unstable. Institutional drift is inevitable, so this distinction might collapse. Funding it might not yield new insights. Similarly, corrigibility (item 5) is critical but might be intractable. It's deeply linked to AI alignment, which is already well-funded. Without new angles, it could rehash old debates.

  The user might have deeper needs. They want the research agenda to influence other funders, so practical, actionable insights are key. They might also need to avoid duplication with existing work. Pointing out that corrigibility is covered elsewhere helps them allocate resources wisely. Emphasizing neglected areas like accretion ensures their funding has unique impact.

  Including an additional question: What about the moral patienthood of the singleton? If the singleton includes AI agents, how does that affect its decision-making? This ties into corrigibility and value drift but focuses on the entity's nature. Ranked below item 1 but above item 3, it introduces a novel ethical dimension.

  Prioritization: Item 6 and 1 are top because they offer immediate levers and address core debates. Item 4 and 2 come next for their novelty and foundational metrics. Item 5 and 3 are lower due to tractability issues and being overrated. The new question on moral patienthood fits in the middle, adding value without overlapping.
answer: |-
  Here’s a rigorous prioritization of your six distinctions for the research group, based on downstream impact, tractability, neglect, and sensitivity to evidence. I’ve added a seventh critical question you omitted and flagged weaker candidates. Rankings are weighted toward **actionability for funders** and **avoiding speculative dead ends**.

  ### Priority Ranking (Descending Order)
  1. **#6: The Pre-Singleton Window**  
     - **Downstream Impact:** Highest. Directly shapes *current* interventions (procurement, liability, standards). Answers: "What should we *do now* to steer outcomes?"  
     - **Tractability:** High. Uses institutional design/political economy tools to map concrete levers (e.g., liability cascades, standards as focal points).  
     - **Neglect:** Extreme. Most work focuses on post-singleton governance; pre-singleton agency is underexplored.  
     - **Evidence Sensitivity:** High. Concentration trends (e.g., cloud/GPU market share), coordination failures (e.g., global AI treaties collapsing), or governance experiments (e.g., EU AI Act enforcement) would rapidly update models.  
     - **Why Top?** Directly delivers the "changed effort allocation" you seek for other funders.

  2. **#1: Protocol vs. Agent**  
     - **Downstream Impact:** High. Reshapes debates on "governance targets" (e.g., fund verification infra vs. agent oversight).  
     - **Tractability:** Medium-High. Decision/social choice tools can model defection dynamics. Needs care to avoid rehashing mechanism design.  
     - **Neglect:** Moderate. "Agentic singleton" is default in literature; protocol alternatives lack formal comparison.  
     - **Evidence Sensitivity:** Medium. Progress in compute attestation (e.g., frontier model tamper-proofing) or new coordination failures (e.g., AI safety pacts ignored) would clarify feasibility.  
     - **Why Here?** Foundational for institutional design; determines whether "founder capture" is avoidable.

  3. **#4: Singleton by Accretion**  
     - **Downstream Impact:** High. Challenges normative assumptions (e.g., "designer intent" vs. emergent concentration).  
     - **Tractability:** Medium. Political economy tools can model path dependence (e.g., standards locking in dominance).  
     - **Neglect:** Severe. Almost all literature assumes intentional design. Accretion dynamics are rarely formalized.  
     - **Evidence Sensitivity:** Medium-Low. Requires observing concentration in practice (e.g., AI supply chain consolidation), not lab experiments.  
     - **Why This High?** Reveals blind spots in ethics/strategy. Funders *must* know if "steering" is even possible.

  4. **#2: Graded Singletonhood**  
     - **Downstream Impact:** Medium. Clarifies "what success looks like" (partial coordination vs. total control).  
     - **Tractability:** Medium. Requires defining metrics for "enforcement scope" – tractable with decision theory.  
     - **Neglect:** Moderate. Binary framing dominates; erosion/drift tradeoffs are underexplored.  
     - **Evidence Sensitivity:** Low. Mostly conceptual; real-world erosion (e.g., states ignoring global AI rules) would validate.  
     - **Why Here?** Prevents false binaries but less actionable than top 3.

  5. **#7: Moral Patienthood of the Singleton** *(Your Missing Question)*  
     - **Core:** If the singleton incorporates AGI/ASI, is it a moral patient? How does this affect corrigibility/value drift?  
     - **Downstream Impact:** Medium. Affects value lock-in debates (e.g., should singleton preferences be mutable?).  
     - **Tractability:** Low-Medium. Philosophy-heavy; needs grounding in agency models.  
     - **Neglect:** Extreme. Literature treats singleton as tool, not potential entity with interests.  
     - **Evidence Sensitivity:** Very Low. Highly theoretical.  
     - **Rank Justification:** More novel than #3/#5 but less actionable.

  6. **#5: Corrigibility of the Singleton**  
     - **Downstream Impact:** Low-Medium. Important for long-term ethics but less urgent for *near-term* funder decisions.  
     - **Tractability:** Low. Stalls on value alignment/principal-agent problems – no consensus exists.  
     - **Neglect:** Low. Heavily debated in AI alignment circles.  
     - **Evidence Sensitivity:** None. Purely conceptual.  
     - **Why Low?** Intractable with your toolkit; risks rehashing alignment debates without new tools.

  7. **#3: Custodial vs. Sovereign**  
     - **Downstream Impact:** Low. "Option value preservation" is appealing but likely incoherent under institutional drift.  
     - **Tractability:** Medium-Low. Institutional economics tools apply but suggest custodial → sovereign is inevitable.  
     - **Neglect:** Low. Analogues in constitutional design (e.g., "militant democracy") are well-studied.  
     - **Evidence Sensitivity:** None.  
     - **Why Bottom?** Likely a pseudo-distinction – custodial singletons either collapse or become sovereign.

  ---

  ### Explicit Rejections & Warnings
  - **Decline to Fund:**  
    **#3 (Custodial vs. Sovereign)** – Highly likely to be a speculative dead end. Institutional drift literature strongly suggests "custodial" is either unstable or a euphemism for deferred sovereignty. No known mechanism prevents eventual value lock-in.  
    **#5 (Corrigibility)** – Overlaps significantly with existing AI alignment work. Your group’s social theory toolkit offers little new here, and it’s intractable in 2 years.  

  - **Overrated/Pseudo-Questions:**  
    **#3** is fundamentally a reformulation of the "value drift" problem already in #2, dressed in institutional language. **#5** is a disguised alignment problem – important but *not* where your team adds unique value.  

  - **Critical Missing Question:**  
    **Moral Patienthood (#7)** deserves inclusion. A singleton incorporating AGI isn’t just a tool; it may have interests. Ignoring this risks anthropomorphizing governance. Ranked #5 above due to novelty.

  ---

  ### Why This Order?
  - **Top 3 (#6, #1, #4)** directly inform *levers funders can pull today*. They avoid metaphysics, leverage your team’s strengths (institutional design/political economy), and address neglected, high-stakes gaps.  
  - **Middle (#2, #7)** build foundations but won’t redirect funder priorities alone.  
  - **Bottom (#5, #3)** are either intractable or recycled debates. Funding them would waste resources.  

  **Key Adjustment:** If evidence emerges of rapid concentration (e.g., single entity controlling >50% of advanced AI compute), bump #4 and #6 to co-top priority. If major protocol-based governance gains traction (e.g., global compute verification), elevate #1.
