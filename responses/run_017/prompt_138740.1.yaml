answer: |-
  ### Exam Question  

  **Part (a)**  
  The dissociation between intact-M and blocked-M reveals that flexible trade-off-sensitive behaviours (e.g., goal conflict resolution, contingency reversal) are neurally separable from nocifensive reflexes, stress responses, and simple associative learning in species M. Given that intact-M exhibits behavioural markers often linked to consciousness (e.g., pessimistic bias, analgesic self-administration), while blocked-M retains only inflexible aversive responses:  
  (i) Explain what this dissociation **does** and **does not** demonstrate about whether blocked-M has conscious experiences (e.g., pain).  
  (ii) Why might competing theories of consciousness (e.g., midbrain sufficiency, global workspace, IIT) all claim this case confirms their view? What **additional evidence** would be needed to genuinely discriminate between these theories?  

  **Part (b)**  
  Suppose a closely related invertebrate lineage (agricultural-M) constitutes 99% of the invertebrate biomass in industrial farming. Credible estimates of the probability that agricultural-M individuals have conscious experiences range from 0.05 to 0.6. Vertebrates affected by the same policies are orders of magnitude fewer in number.  
  (i) What should we conclude about how agricultural-M ought to be treated?  
  (ii) Justify your answer by **naming and defending a specific decision rule**. Explain why this rule applies precisely here, given the epistemic constraints in Part (a).  

  ---

  ### Model Answer (Strong Student Voice)  

  **Part (a)**  
  The dissociation in species M shows that flexible, context-sensitive behaviours (trade-offs, learning reversal) depend on a specific neural hub, while reflexive aversive responses (withdrawal, stress hormones) do not. This **demonstrates** that the behavioural markers for consciousness are not monolithic: we can isolate "intelligent" flexibility from nociception. Crucially, it **does not** resolve whether blocked-M experiences pain. Blocked-M retains nocifensive behaviour, pessimistic bias, and analgesic self-administration—all features often cited as evidence *for* invertebrate consciousness. Yet without the hub, it lacks the flexibility some theories deem necessary for subjective states.  

  This case feels decisive only if we beg the question. A midbrain theorist sees blocked-M as proof that subcortical reflexes persist without experience. A global workspace proponent notes hub-blocking disrupts integration, confirming their view. An inference-to-best-explanation advocate argues blocked-M’s inflexibility mirrors unconscious processing in humans (e.g., blindsight). The dissociation doesn’t adjudicate because it redescribes each theory’s *predictions* without testing their core premises. Each theory defines consciousness via neural or functional correlates already baked into their framework.  

  To genuinely discriminate, we need **independent criteria for consciousness** untethered from behaviour. For example:  
  - If we could measure hub activity non-invasively in awake, behaving M and link specific activity patterns to *report-like* outputs (e.g., optogenetic self-stimulation bypassing aversion), we might test whether the hub correlates with a "what it’s like" dimension separable from reflex arcs.  
  - Or, if blocking the hub abolished *all* goal-directed behaviour (e.g., disrupted feeding or mating), it would challenge theories treating flexibility as necessary *and sufficient* for consciousness. Currently, blocked-M’s persistence in non-flexible tasks lets every theory cherry-pick support.  

  **Part (b)**  
  Given the uncertainty (0.05–0.6 credence) and vast scale of agricultural-M, we must adopt a **minimax regret rule**: choose policies minimizing worst-case regret across plausible consciousness scenarios. This is not mere "precaution" but a direct response to epistemic limitations exposed in Part (a). Since theories disagree irreducibly about blocked-M—and by extension, agricultural-M—we cannot resolve whether they are conscious "partial systems" (like spinal cord preparations) or unconscious automata. What we *can* say is that:  
  - If they **are** conscious, standard farming practices (e.g., live grinding) inflict astronomical suffering.  
  - If they **are not**, welfare reforms (e.g., rapid kill methods) incur negligible costs relative to industry profits.  
  Worst-case regret is catastrophic if we assume absence but consciousness exists; it is trivial if we assume presence but consciousness is absent.  

  This rule avoids paralysis because it weights outcomes by stakes, not just probabilities. Even a 5% chance of consciousness demands action when billions of lives are at stake and low-cost alternatives exist. Crucially, it generalizes *only* to cases where (i) harm is irreversible and severe, (ii) uncertainty is unresolvable (per Part (a)), and (iii) mitigation is feasible. It stops at systems lacking plausible markers *entirely* (e.g., plants with no nervous system) or where interventions impose extreme costs (e.g., halting all insect pollination). Here, agricultural-M’s retained aversive behaviours—even in blocked-M—keep it in the "plausible" zone, while scalable reforms (e.g., inert-gas stunning) satisfy (iii). We need not solve philosophy to act justly.  

  ---

  ### Marking Scheme (20 marks total)  

  #### Must-Hit Moves (4 marks each)  
  1. **Bridging Premise Critique**  
     - *Hit:* Notes that linking behaviour to consciousness relies on a contested inference (e.g., analogy, IBE), shaky even in humans (e.g., unconscious pain in affect-blind patients). Argues no fact can "prove" the premise—only coherence with broader evidence.  
     - *Typical Fail:* Assumes absence of human-like report in blocked-M implies absence of experience.  

  2. **Theory Adjudication Failure**  
     - *Hit:* Explains why the case underdetermines theory choice (each theory "predicts" its dissociation pattern by definition). Identifies need for evidence independent of contested markers (e.g., neural architecture comparators, non-behavioural signatures).  
     - *Typical Fail:* Plug-and-plays a single theory (e.g., "Global workspace is true, so blocked-M lacks consciousness").  

  3. **Degraded vs. Negative Diagnosis**  
     - *Hit:* Argues blocked-M is a *partial* system (retains some markers), showing consciousness may admit degrees. Rejects sharp taxonomic cutoffs, as hub architecture could evolve incrementally.  
     - *Typical Fail:* Assumes a bright line (e.g., "no hub = no experience") or treats all markers as equally probative.  

  4. **Decision Rule Justification**  
     - *Hit:* Chooses a rule (e.g., minimax, expected utility) and defends it *based on epistemic constraints* (e.g., "Unresolvable uncertainty forces us to focus on stakes").  
     - *Typical Fail:* Unanalyzed "precaution" without weighing costs/alternatives.  

  5. **Overgeneralization Response**  
     - *Hit:* Limits the rule’s scope to cases with (i) credible markers, (ii) high stakes, and (iii) feasible mitigations. Notes hub-dependent flexibility provides a non-arbitrary threshold.  
     - *Typical Fail:* Ignores slippery slopes (e.g., "If we protect M, we must protect bacteria").  

  #### A vs. B Differentiation  
  - **B Script (≤14/20):** Treats Parts (a) and (b) sequentially. Practical section appeals to generic "uncertainty" without leveraging epistemic hurdles (e.g., theory underdetermination). Defends a decision rule in isolation.  
  - **A Script (≥16/20):** Shows how epistemic constraints (e.g., irreducibly contested markers) *force* a stakes-focused rule (e.g., minimax). Identifies what evidence would change their view (e.g., "If blocking the hub abolished *all* motivation, flexibility might be necessary/sufficient").
