prompt: |-
  Write me a job ad, 400-500 words, posted by a research institute that has decided to take the inevitability thesis completely seriously. It's hiring a Discoverer (Grade 3, Interchangeable) for a result the search commitee is confident at least three other labs will hit within the year, and the ad explains, deadpan and in the language of a real job posting, why the person who actually does the work won't get credit for it: pay is set by a counterfactual replaceability score (how quickly someone else would have got there), named credit is allocated by lottery among everyone who came within six months of the result, and there's a clause covering what happens if it turns out nobody else was really close. The jokes have to come from the philosophy itself: if the time was ripe then the result was arriving anyway, so singling out one person looks arbitrary and undeserved — yet the institute still needs somebody to do the work, and needs that somebody to believe they matter. Let that contradiction carry the piece; don't resolve it and don't wink. Include a benefits section and one proud quote from the HR officer who designed the scheme, and leave a reader actually feeling the question of whether it matters who made a discovery.
reasoning: |-
  We are writing a job ad for a research institute that takes the "inevitability thesis" seriously. The inevitability thesis in the philosophy of science suggests that when the time is ripe for a discovery, it will be made by someone, so no single individual can claim unique credit. The job is for a Discoverer (Grade 3, Interchangeable) for a project where the result is expected to be found by at least three other labs within the year.

  The ad must explain, in a deadpan, real-job-posting tone, why the person who does the work won't get credit. Key points:
  - Pay is set by a counterfactual replaceability score (how quickly someone else would have achieved the result).
  - Named credit is allocated by lottery among everyone who came within six months of the result.
  - There is a clause for the case where nobody else was close.

  The humor must come from the philosophy itself: the contradiction that the institute still needs someone to do the work and needs that person to feel they matter, without resolving the contradiction or winking at the reader.

  We must include:
  - A benefits section.
  - One proud quote from the HR officer who designed the scheme.

  Leave the reader actually feeling the question of whether it matters who made a discovery.

  Structure:
  1. Job title and introduction.
  2. Description of the project and why the result is inevitable.
  3. Explanation of compensation and credit allocation, including the replaceability score and lottery.
  4. Clause for when no one else was close.
  5. Benefits section.
  6. Quote from HR officer.
  7. How to apply.

  Tone: Formal, deadpan, like a real job ad. No winking or overt humor. Let the inherent absurdity of the situation speak for itself.

  Word count: 400-500 words.
answer: |-
  ### Research Discoverer (Grade 3, Interchangeable)  
  **Institute for Epistemic Advancement (IEA)**  
  *Pioneering Research in the Age of Inevitability*  

  The Institute for Epistemic Advancement (IEA) is a leading interdisciplinary research hub dedicated to accelerating human knowledge through empirically grounded philosophical frameworks. We are currently seeking a Research Discoverer (Grade 3, Interchangeable) to lead a high-priority project in quantum decoherence dynamics. Our search committee has determined, through rigorous meta-analytical forecasting, that at least three external laboratories will independently achieve this result within 12 months. Your role is to ensure the IEA contributes to this collective milestone.  

  **Position Overview**  
  You will design and execute experiments to resolve the quantum-classical boundary under decoherence, using our state-of-the-art laboratory facilities. Responsibilities include data analysis, manuscript preparation, and collaboration with IEA’s theoretical team. Success is measured by timely validation of the target result, which multiple peer institutions are actively pursuing. Given the established inevitability of this discovery—supported by citation-network models and research-trajectory simulations—the IEA operates under a merit-credit framework aligned with philosophical realism.  

  **Compensation and Recognition Structure**  
  - **Salary**: £52,000–£58,000 per annum, determined by a Counterfactual Replaceability Score (CRS). CRS quantifies the estimated time delay (in months) before another researcher would have achieved an equivalent result. Higher replaceability (shorter delay) correlates with lower pay bands, reflecting marginal labor value.  
  - **Named Credit**: Attribution follows IEA’s Collective Attribution Protocol. If the result is replicated externally within ±6 months of your publication, all qualifying researchers (including you) enter a lottery for lead authorship on the institute’s flagship meta-discovery paper. Winners are selected via cryptographic RNG.  
  - **Sole-Discoverer Clause**: Should meta-analysis confirm no external team was within 6 months of the result, the CRS system defaults to a fixed delay of 0.5 months. Credit is retained solely by the IEA institutionally, per our commitment to depersonalized scientific progress.  

  **Why This Role Matters**  
  Scientific advancement thrives on timely execution, even when outcomes are foreordained. By joining the IEA, you ensure humanity accesses this knowledge without delay, reinforcing societal resilience. We seek candidates who derive satisfaction from the act of discovery itself, irrespective of extrinsic recognition. As Dr. Lena Sharma (IEA HR Director) notes: *"Our system honors the statistical reality of simultaneity while optimizing for resource efficiency. It’s a win for objectivity—and the budget."*  

  **Benefits**  
  - Generous annual leave (35 days + public holidays)  
  - Defined-benefit pension scheme (employer contribution: 15%)  
  - Access to on-site childcare, mental health support, and professional development grants  
  - Relocation allowance and visa sponsorship for international applicants  

  **Qualifications**  
  - PhD in Physics, Quantum Information, or related field  
  - 2+ years’ experimental experience with quantum systems  
  - Proficiency in Python/MATLAB for simulation  
  - Demonstrated resilience in high-uncertainty research environments  

  **Apply**  
  Submit a CV, cover letter, and CRS self-assessment (template downloadable at iea.ac.uk/crs-g3) to careers@iea.ac.uk by 31 October 2024. Interviews will assess technical competence and philosophical alignment with IEA principles.  

  *The IEA champions epistemic equity. We welcome applications from all backgrounds, as identity factors exhibit negligible correlation with replaceability scores.*  

  ---  
  **Word Count**: 498  
  **Key Contradiction**: The ad openly states credit is arbitrary (due to inevitability) while insisting the work "matters" for societal progress—forcing readers to sit with the tension. The HR quote and benefits section ground it in bureaucratic realism, avoiding irony. The Sole-Discoverer Clause underscores that even in edge cases, the system minimizes individual glory.
