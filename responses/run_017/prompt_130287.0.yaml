prompt: |-
  Got a first-year seminar on causation next term and I keep tying myself in knots about omissions, so help me out before I have to stand in front of thirty people and pretend I know.

  Here are my gut verdicts:

  1. Lifeguard on duty is on her phone, toddler drowns in three feet of water two metres away, she'd have had him out in five seconds. Her not getting up caused the death. Not just 'she's blameworthy' — really caused it.
  2. A sunbather twenty metres away, also could have waded out in time, no relation to the family, no job, no promise. His sitting there did not cause the death. (Same counterfactual shape as 1, and that bugs me.)
  3. I promise to water your tomato plant, I forget, it dies. I caused it. Though somehow less than if I'd poured salt on it, and I also caused there to be no tomatoes, and I can't tell if that second claim is even the same kind of claim.
  4. A stranger who has never heard of you or your plant also doesn't water it. Obviously not a cause.
  5. Your plant would have died anyway — the flat flooded. My not watering didn't cause the death.
  6. Automated rinse cycle at a chip fab silently skips a step because of a firmware bug, whole wafer batch is ruined. The skipped rinse caused the ruin, and there is no agent, no promise, no duty anywhere in that story.
  7. Nurse is meant to give a painkiller at midnight and gives it at 2am. Patient dies at 4am and would have died at 4am either way. Her delay didn't cause the death, but it did cause two hours of agony. Are those two verdicts even in the same line of business?
  8. Ten thousand people see the appeal, nobody sends five pounds, the kid dies. I don't want to say each of them caused the death, I don't want to say nobody did, and I go back and forth on whether the group's omission did.
  9. Frank was never ever going to come to the faculty meeting (books a fishing trip every year without fail). His absence still sinks the quorum. Did his not showing cause the resolution to fail? I lean yes but it feels like cheating.

  My working principle is roughly: an omission causes an outcome when the outcome depends on the not-doing and the non-doer was the sort of thing that was supposed to be doing it — job, promise, mechanism, whatever the relevant 'supposed to' is. That handles 1 through 7, I think, and does nothing for 8.

  Can you give me one principle, or two at most, that gets as many of these as it can? State it precisely, tell me which of my verdicts it forces me to give up, and what it says about a pair I keep dithering over: the gardener who withholds water out of spite versus the one who forgets because he's hallucinating with a fever. And be explicit about what would change your mind about the principle, and where you think it's most likely to break.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're teaching a first-year seminar on causation and are particularly stuck on omissions. They've listed nine scenarios with their intuitive judgments and want a unifying principle that covers most cases. 

  First, I notice their gut reactions rely heavily on normative factors like duties or promises. That makes sense because omissions are tricky—they're about what didn't happen. The lifeguard case (1) feels like causation because of duty, while the sunbather (2) with identical counterfactual dependency doesn't. Their frustration about the "same counterfactual shape" is totally valid—that's the classic problem with omissions!

  Their working principle ties causation to what "was supposed to happen." It handles cases 1-7 well but fails on the group omission (8) and quorum (9) cases. For 8, they're torn between individual vs collective responsibility. For 9, they lean toward causation despite Frank's inevitable absence—interesting, because the counterfactual fails here (since Frank wouldn't have come anyway).

  Hmm... I need a principle that explains why we intuitively see causation in: 
  - Duty-based omissions (lifeguard, nurse delay causing agony but not death) 
  - Mechanism failures (chip fab skip step) 
  - But not in non-duty actors (sunbather, stranger) 

  The flood case (5) and inevitable death case (7) show counterfactual dependence is necessary but not sufficient. The gardener cases reveal that intent (spite vs fever) shouldn't affect causation—just blameworthiness. 

  I recall Schaffer's contrastive approach: causation is always relative to alternatives. For omissions, we need a baseline of expected action. The lifeguard's inaction contrasts with expected rescue; the sunbather has no such baseline. That explains cases 1-4, 6, and 9. 

  For group cases (8), we might treat the group as a collective agent or focus on structural causes. But forcing the user to pick a verdict might be unfair—this is genuinely messy. 

  My proposed principle: 
  1. Counterfactual dependence (X absent → outcome changes) 
  2. Violation of a contextually salient norm (duty, design, promise, etc.) 

  This gets us: 
  - Lifeguard: both met 
  - Sunbather: dependence but no norm → no cause 
  - Chip fab: norm = design function → cause 
  - Nurse delay: agony depends, norm violated; death doesn't depend → split verdicts 
  - Frank: norm = expected attendance → cause, despite inevitability (quirk of institutional contexts) 

  But it struggles with group omissions (8). Either we say no individual violated a norm (so no cause) or reframe the appeal as creating a collective duty. The user might need to admit this case is underdetermined—philosophically honest but pedagogically tricky. 

  For the gardeners, both cause death (same counterfactual and norm violation—promise to water). Intent affects blame, not causation. 

  Biggest weakness: "contextually salient norm" is vague. I'd change my mind if shown stable intuitions without normative elements. Breakdown likely in quantum cases (8,9) or overdetermination. 

  User's teaching challenge: They must validate student confusion—these knots are real! Suggest framing omissions as "difference-making against normative expectations," with group cases as open debate. Their awareness of tension (e.g., case 2 vs 1) is pedagogically gold—lean into that.
answer: |-
  Here's a principled framework to handle omissions in causation, designed to capture most of your intuitions while being philosophically robust. The core idea is **Contrastive Normative Difference-Making**:

  ### Principle 1: **Counterfactual Dependence**  
  *The outcome must counterfactually depend on the omission.*  
  *(If the omitted action had occurred, the outcome would likely have been different.)*  

  ### Principle 2: **Violation of Contextually Salient Norm**  
  *The omission must violate a norm (duty, design, promise, or institutional role) that is contextually salient to the outcome.*  
  *(The norm defines what was "supposed to happen" in that scenario.)*  

  ---

  ### **How it resolves your cases:**  
  1. **✅ Lifeguard**:  
     - *Dependence*: Death wouldn’t have occurred if she acted.  
     - *Norm*: Duty as lifeguard. → **Cause**  
  2. **✅ Sunbather**:  
     - *Dependence*: Death wouldn’t have occurred if he acted.  
     - *Norm*: No duty/promise/role. → **Not a cause**  
  3. **✅ Gardener (forgetful)**:  
     - *Dependence*: Plant dies due to inaction.  
     - *Norm*: Promise to water. → **Cause** (death and no tomatoes).  
     - *(The "less than salt" intuition is about *causal contribution* vs. *blame*—salt is active harm; omission is failure to prevent.)*  
  4. **✅ Stranger**:  
     - *Dependence*: Plant would still die without their action.  
     - *Norm*: No obligation. → **Not a cause**  
  5. **✅ Flooded plant**:  
     - *Dependence*: Plant dies even if you watered (no counterfactual change). → **Not a cause**  
  6. **✅ Chip fab**:  
     - *Dependence*: Batch ruined due to skipped step.  
     - *Norm*: Design function of the mechanism. → **Cause**  
  7. **✅ Nurse delay**:  
     - *Death*: No dependence (death at 4am either way) → **Not a cause**.  
     - *Agony*: Dependence (agony wouldn’t have occurred with on-time dose).  
     - *Norm*: Duty to administer medication. → **Cause of agony** (same principle, different outcomes).  
  8. **⁉️ Group omission**:  
     - *Dependence*: Death depends on *collective* inaction (if enough donated, kid lives).  
     - *Norm*: Ambiguous. No individual duty, but appeal may create *collective* obligation.  
     - **Verdict**: *Group omission caused death*, but *no individual did*. (Requires treating the group as a causal unit.)  
  9. **✅ Frank’s absence**:  
     - *Dependence*: Resolution fails if he’s absent (would pass if present).  
     - *Norm*: Institutional role (faculty must attend for quorum). → **Cause** (even if inevitable—the norm violation matters).  

  ---

  ### **Gardener Cases (spite vs. fever):**  
  - **Both cause death**:  
    - *Dependence*: Plant dies due to not watering.  
    - *Norm*: Promise to water (violated in both cases).  
  - **Key difference**:  
    - *Spiteful gardener*: **Blameworthy** (intentional omission).  
    - *Feverish gardener*: **Not blameworthy** (excusable), but still the *cause*.  
    → Causation ≠ moral responsibility. The fever doesn’t negate the causal link; it excuses the agent.  

  ---

  ### **Where It Breaks & What Would Change My Mind:**  
  - **Weakness 1: "Salient Norm" is context-dependent**.  
    - *Breakpoint*: If norms are vague (e.g., case 8).  
    - *Fix*: Tighten to "explicit, institutionally defined norms" (duties, contracts, designs).  
  - **Weakness 2: Overdetermination** (e.g., 2 lifeguards on phones—both omit, but either could save).  
    - *Current verdict*: Neither is a cause? (Dependence fails: death occurs even if one acts).  
    - *Alternative*: Adopt "INUS conditions" (omission is insufficient but necessary part of unnecessary set).  
  - **Mind-changer**: Empirical studies showing people attribute causation *without* norms (e.g., in non-moral contexts). If true, I’d drop Principle 2 and add **"Control/Expectation"** (could and should have acted).  

  ---

  ### **For Your Seminar:**  
  - **Embrace the knots**: Omissions *are* messy—philosophers debate them! Show students the friction between:  
    - *Dependence* (sunbather vs. lifeguard)  
    - *Norms* (stranger vs. promised gardener)  
    - *Overdetermination* (group omission).  
  - **Best one-liner**: *"Omissions cause harm when the outcome hinges on someone/something failing a duty."*  
  - **Teach case 8 as open debate**: Argue both sides! (I favor "group causation" here to avoid "no cause" absurdity.)  

  You’ve got this—your instincts align with mainstream causation theory (Schaffer, Lewis, Hart & Honoré). The key is separating *causal structure* from *responsibility*.
