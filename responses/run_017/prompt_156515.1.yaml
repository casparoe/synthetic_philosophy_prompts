  | **Scale anchoring** | Comparing a chronically depressed patient’s self-report ("I’m at 3/10") with an optimistic patient’s ("I’m at 5/10") requires a common reference (e.g., death=0, full health=10). | Non-negotiable | Rules without fixed zero/unit points (e.g., preference-only utilitarianism). |
  | **Population-size invariance** | Preventing 100 cases of mild arthritis (small per-person gain) vs. saving one life (large gain): rule must fairly compare across group sizes. | Non-negotiable | Fixed-population rules (e.g., Pareto efficiency). |

