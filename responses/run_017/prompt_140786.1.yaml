prompt: |-
  I help put on an annual comedy night for our cognitive science department — short sets, mostly staff and PhD students, and the ones that work best are the ones where one specialist laughs and then has to explain the joke to the person next to them. This year I've been assigned the frame problem, and I'm stuck. I can picture the obvious versions: a robot in a room with a ticking bomb, or a robot that seizes up trying to work out whether the walls changed colour when it walked through the door. But those feel like they'd land as generic "AI is hopelessly literal" gags, and worse, I think they're jokes about the wrong thing — about an agent being too slow, or too easily surprised, or too short of facts — rather than about the actual structure of the problem. I have read the standard introductory material, so please don't spend the piece explaining what the frame problem is; I want the joke itself.

  Here is the commission. Write a joke whose punchline trades on the real thing: that for an agent which represents its situation by explicitly stated facts together with rules saying what each action changes, the difficulty is not deriving the consequences of an action but knowing which of the indefinitely many facts it is even supposed to re-derive, and that the obvious remedy — doing more of the same kind of reasoning — does not by itself solve it. Please keep it clear of two neighbours: the ramification problem, where the trouble is that an action has cascading indirect effects you failed to represent, and the merely engineering worry that exhaustive checking would be computationally expensive. The joke should survive a pedant in the front row who checks whether the laugh is coming from one of those instead.

  I would also like it set somewhere other than a robot in a room. I have been toying with situations where ordinary people face the same shape of difficulty: the note you leave for a house-sitter, a nurse's end-of-shift handover, the clause in an amended contract that says everything else stays as it was, a referee's report justifying why a requested revision is minor, or a parent updating the other parent on what happened while they were out — something in that family, or better if you have it. Keep it short: a two-beat exchange, a single found document, a mock FAQ entry. Then, in two or three sentences after the joke, say which feature of the frame problem the punchline is actually leaning on, and what a nearby-but-wrong version would have been relying on instead.
reasoning: |-
  Okay, the user is organizing a comedy night for their cognitive science department and needs a joke about the frame problem. They want something that captures the core issue: the challenge isn't processing speed or missing facts, but determining which facts need reevaluation after an action. They've rejected common robot scenarios for being too generic or missing the point.

  The user specifically wants to avoid:
  - Jokes about computational inefficiency (the "too slow" angle)
  - Jokes about cascading effects (ramification problem)
  - Generic "AI literalism" tropes

  They suggested real-world parallels like house-sitter notes or parenting updates. The joke must be concise - a two-line exchange or mock document format would work well. 

  Hmm... the house-sitter scenario seems promising. Imagine over-specifying what shouldn't change: "The cat remains uneaten" highlights how absurd it gets when trying to declare unchanged states. The humor comes from the futile attempt to list every non-change, which directly mirrors the frame problem's core challenge.

  Important distinction: The joke works because it's about the impossibility of enumerating what stays the same, not about forgetting actual consequences (that would be the ramification problem). A pedant couldn't reasonably argue this is about computational cost either - the document itself is the bottleneck.

  Alternative approach: A parenting update where one parent says "Nothing changed" and the other asks for proof. But that might veer into epistemology. Stick with the house-sitter - the visual of listing ridiculous invariants ("trees still vertical") makes the abstract concrete.

  Final structure:
  1. Found document format (note to house-sitter)
  2. Absurdly long list of unchanged things
  3. Punchline: "...and the universe continues to expand at its usual rate" to show the infinite regress
answer: |-
  Here's a found document joke, formatted as a house-sitter note:

  ---

  **NOTE FOR HOUSE-SITTER (AMENDED VERSION):**
  *   Fed the cat (1/2 can tuna, 2pm).
  *   Watered the ficus (250ml, room temp).
  *   Locked the back door (deadbolt only).
  *   **Things that remain unchanged:** The cat is uneaten. The ficus is unburned. The back door is not made of jelly. The walls are still walls. The concept of "Wednesday" persists. Gravity is still functioning locally. The colour spectrum remains within visible wavelengths. The cat has not achieved sovereignty. The tuna brand retains its market share. The neighbour still dislikes accordions. The universe continues to expand at its intended rate. *(This list is non-exhaustive and indicative only. Assume all other pre-existing states hold unless explicitly notified otherwise in a subsequent amendment.)*

  ---

  **Why this hits the frame problem:**
  The punchline isn't that the house-sitter needs *more facts* or that checking is *slow*; it's that the writer, trying to *explicitly state what remains unchanged* by the simple actions, gets mired in the impossibility of specifying the infinite, trivial invariants ("Gravity is still functioning", "The universe expands"). The absurdity lies in the *necessity but futility* of this enumeration, precisely mirroring the agent's core challenge: knowing *which* of the infinite unchanged facts even need consideration/justification after an action. The note's final clause ("Assume all other pre-existing states hold...") hilariously attempts the very "default persistence" assumption that *creates* the frame problem without solving it.

  **Nearby-but-wrong versions avoided:**
  *   **"Too slow/surprised"**: Not about the house-sitter being overwhelmed by *processing* the list or being shocked by an unstated change (e.g., the cat *did* achieve sovereignty). The list *itself* is the joke.
  *   **Ramification Problem**: No cascading effects are implied (e.g., watering the ficus didn't accidentally flood the neighbour's accordion). The focus is solely on declaring what *didn't* change.
  *   **"Just computational cost"**: While the list is long, the core absurdity is the *category* of things listed (fundamental constants, abstract concepts), not just its impractical length. The pedant sees the joke is about *what needs specifying*, not how long it takes to read.
