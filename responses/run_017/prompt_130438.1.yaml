  ### Decision Procedure for Model Review  

  **One-sentence version (index card):**  
  *Classify prediction type; if "averted" defense fails, count as miss; for dated predictions, allow one free retiming, then require pre-committed new test; reject if pre-commitment not met, auxiliaries retrofitted without declaration, or degeneration judged.*  

  **Steps (run in order):**  
  1. **Classify prediction type** (select one):  
     - **Dated point forecast**: Specific outcome by a specific date.  
     - **Dominance claim**: One force outweighs all others by a date, causing an outcome.  
     - **Bare mechanism/existence claim**: No date; asserts a mechanism or eventual outcome.  

  2. **Evaluate "it was averted" defense** (if claimed):  
     - Credit only if:  
       a. *Dissemination*: Forecast was widely publicized (e.g., major policy citations, media coverage).  
       b. *Causation*: Intervention was directly triggered by the forecast (e.g., policy documents cite it as rationale).  
       c. *Novelty*: Intervention was not part of the model’s initial scope or real-world trends pre-forecast.  
     - If evidence is missing for any, defense fails → prediction is missed.  
     - *Judgment call*: Lead reviewer assesses evidence (hand to named person).  

  3. **Audit auxiliary hypotheses** (if used to explain miss):  
     - Check if auxiliaries (e.g., "unforeseen technology," "external shock") were declared in original model docs or pre-registered commitments.  
     - If retrofitted (not declared): Only admissible if authors pre-commit to a new, independently testable prediction (date + outcome) in public ledger.  

  4. **Apply retry policy**:  
     - **Dated point forecast or dominance claim**:  
       - First miss: Allow one free retiming (change date for same outcome).  
       - Subsequent miss: Require pre-committed new test in public ledger (new date + new independently checkable outcome; e.g., different event or threshold).  
     - **Bare mechanism/existence claim**:  
       - First miss: Require conversion to dated prediction (set date + outcome) within 6 months.  
       - Failure to convert or subsequent miss: Reject.  
     - *Judgment call*: Lead reviewer assesses if new prediction is non-trivial and independently testable (hand to named person).  

  5. **Stopping points (reject if)**:  
     a. Dated/dominance prediction missed after free retiming, and no pre-committed new test.  
     b. Bare mechanism claim missed and contradicted by evidence (e.g., mechanism falsified in other contexts).  
     c. Retrofitted auxiliaries used without pre-commitment.  
     d. "Averted" defense fails and retry policy exhausted.  

  6. **Degeneration judgment** (if not rejected above):  
     - Lead reviewer assesses for degeneration (e.g., repeated ad hoc fixes, no novel predictions, ignoring counter-evidence).  
     - *Judgment call*: Hand to named lead reviewer; reject if degeneration confirmed.  

