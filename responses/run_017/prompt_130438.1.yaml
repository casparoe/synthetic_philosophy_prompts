  ### Case Reviews and Recommendations  
  *(One-page format for board sign-off)*  

  **Case 1: Neo-Malthusian Food/Population Model**  
  - **Classification**: Dated point forecast (famine by two windows).  
  - **Defense**: None (timing argued; no "averted" claimed).  
  - **Audit**: Auxiliaries (e.g., yield trends) retrofitted; not pre-declared.  
  - **Retry**: First miss used free retiming; second miss requires pre-committed new test. None provided.  
  - **Stopping**: Reject (retry policy exhausted, retrofitted auxiliaries).  
  - **Degeneration**: N/A (stopping point triggered).  
  **Recommendation**: Drop. Model missed both famine windows; no new test pre-committed after first retiming.  

  **Case 2: Resource-Depletion Model**  
  - **Classification**: Dated point forecast (price spike by date).  
  - **Defense**: None ("averted" not claimed; spike occurred).  
  - **Audit**: Auxiliary (extraction technology) retrofitted; not pre-declared.  
  - **Retry**: First prediction succeeded (spike occurred). For renewal, requires pre-committed new test due to retrofitted auxiliary.  
  - **Stopping**: N/A (prediction met).  
  - **Degeneration**: Not judged (renewal conditional).  
  **Recommendation**: Renew with conditions. Update model to include technology; pre-commit new test (date + outcome) in ledger within 3 months.  

  **Case 3: Institutional-Trust Decline Model**  
  - **Classification**: Dated point forecast (threshold crossed by date).  
  - **Defense**: "Averted" claimed (forecast triggered intervention).  
  - **Audit**: Defense fails (no evidence of direct causation or dissemination; intervention retrofitted auxiliary).  
  - **Retry**: First miss → one free retiming allowed.  
  - **Stopping**: N/A (retry available).  
  - **Degeneration**: Lead reviewer judges degeneration (ignored intervention dynamics pre-miss; no novel predictions post-miss). Reject.  
  **Recommendation**: Drop. Prediction missed; "averted" defense unsubstantiated; program degenerated per lead reviewer.
