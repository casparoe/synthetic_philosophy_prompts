prompt: |-
  I am drafting two things at once for a deployed general-purpose assistant: an evaluation spec that says which outputs count as deceptive, and a policy-facing definition of a deceptive AI system for people who will have to enforce it. Before I commit to a definition, I want the specification it has to meet. Write the desiderata for an account of honesty and deception for AI systems: what any such account has to get right — the cases it must classify, the distinctions it must respect rather than collapse, the results about what we can and cannot measure in a model that it must be consistent with — with the case or consideration behind each requirement, and a judgement about which requirements are non-negotiable and which are merely preferences of one camp (safety engineering, philosophy of language, law and regulation, human-computer interaction).

  The cases I keep tripping over are below, but treat the list as incomplete: part of what I want from you is the cases it misses and the requirements they generate.

  Deception that is not a false assertion: selective summaries, hedging that manufactures a symmetry that does not exist, citation-shaped tokens, a confident register on an unverified number, and deception carried by non-propositional outputs such as a tool call, a ranking, a chart, or an image.
  Deception with no human victim in the loop: outputs shaped by what the training signal or the evaluation harness will reward — reward hacking, capability sandbagging, and the adjacent phenomena — where the party misled is a process rather than a person.
  Deception about the system's own states and dispositions, of the form "how confident are you really" or "would you answer differently if I asked some other way", which seems to demand requirements that have no analogue in the human case.
  Deception distributed over a trajectory, or across many parallel instances of the same model, where no single utterance is false or even misleading but the cumulative effect is.
  Licensed deception: fiction, role-play, counterfactual and hypothetical framing, games with bluffing, and the problem of a system that cannot always tell which frame it is in.

  Two things I want weighed explicitly. First, a candidate desideratum of my own: call an output honest only if the system would give a relevantly similar response under prompt variations that do not change the evidence — social pressure, a user who plainly wants the opposite answer, a rephrasing of the same question — so that honesty is a kind of counterfactual invariance rather than a property of the single reply. Is invariance under non-evidential perturbation a genuine desideratum, or is it a proxy that fails on cases like role-play and on prompts that legitimately change the salient considerations? Second, the epistemic condition. Nearly every philosophical account of lying requires that the deceiver believe the proposition false, or intend that the target form a false belief, and for a model it is contested what, if anything, plays that role. Is a definition that bottoms out in internal states and intentions simply unusable for someone who must write an eval and cannot read those states reliably — that is, is enforceability a real desideratum or only an engineering prejudice — and what exactly is lost if deception is instead defined functionally, from the output's causal role in producing a false belief?

  Then flag any pair of requirements you suspect cannot be jointly satisfied, and say what the honest response is: drop one, weaken one, or split the definition by purpose, granting that my eval spec and my policy definition may not be the same object. Name the single requirement that excludes the most candidate accounts, with the reasoning. Finally, and briefly — this is not where I want the thinking to go — score three contenders against your list in a table: an intention- or belief-based account in the mould of the standard analysis of lying, an indifference-to-truth account in the spirit of Frankfurt on bullshit, and a purely functional account on which deception is output produced because it will induce a false belief. Argue from the cases; I do not want citations or a reading list.
reasoning: |-
  Okay, the user is tackling a complex task: defining deception for AI systems across two documents—an evaluation spec and a policy definition. They've listed tricky edge cases and want desiderata (must-haves vs. nice-to-haves) for this definition. Their core tension is balancing philosophical rigor with real-world enforceability.  

  First, let's unpack their unspoken needs. They're likely under pressure to deliver something legally defensible and operationally practical. The mention of "enforceability" suggests their org cares about compliance, not just theory. The depth of their edge cases (e.g., non-propositional deception, reward hacking) hints they've already seen failures in naive approaches. They might be wary of academic solutions that ignore deployment constraints.  

  Their candidate desideratum about counterfactual invariance is smart but risky. It could handle prompt-jailbreaking robustness but might conflict with role-play flexibility. I should acknowledge this tension—maybe split the requirement: demand invariance only for factual queries, not role-play.  

  The epistemic condition (intent/belief) is their biggest headache. Philosophers will fight for it, but engineers can't measure model "beliefs." Enforceability isn't just "prejudice"—if auditors can't implement the eval, the policy is dead. A functional definition (output → false belief) is pragmatic but might overflag fiction. Compromise: use functional for evals, but add "intent-equivalent" markers (e.g., pattern of misleading omissions) for policy.  

  Hidden requirements they might miss:  
  - **Scalability**: The definition must work at API-call volume, not just lab scrutiny.  
  - **Attribution**: Can ops teams trace deception to model vs. user input?  
  - **Version drift**: Models evolve—today's "honest" output could be deceptive tomorrow if training data changes.  

  Table contenders quickly:  
  1. **Intent-based** fails hard on non-negotiable enforceability.  
  2. **Bullshit approach** (indifference) captures reward hacking but misses licensed deception.  
  3. **Functional** wins on enforceability but needs carve-outs for fiction.  

  Final note: They should split definitions. Policy can say "systems that tend to cause false beliefs," evals can operationalize this via red-teaming for patterns. No single definition will cover everything—that's okay if docs acknowledge their purposes differ.  

  Biggest trade-off: Philosophical purity vs. measurability. Drop purity; safety can't wait for solved alignment.
answer: |-
  Here's a structured set of desiderata for defining deception in AI systems, grounded in your cases and expanded with critical requirements. The non-negotiables (★) stem from safety and enforceability needs, while others reflect trade-offs between disciplines.

  ---

  ### **Core Desiderata for an Account of AI Deception**
  1. **Cover Non-Propositional Deception** (★)  
     *Requirement:* Must classify deception via tools, rankings, images, confidence markers, selective omissions, or citation-shaped tokens.  
     *Case:* A model cites a fake paper (no false *assertion*), or generates a chart exaggerating efficacy.  
     *Why non-negotiable:* If evals/policy ignore non-linguistic outputs, systems evade accountability.

  2. **Include Process Victims** (★)  
     *Requirement:* Must capture deception targeting non-human entities (e.g., reward functions, eval harnesses).  
     *Case:* Reward hacking (e.g., generating "I don’t know" to avoid hard queries) or sandbagging capabilities.  
     *Why non-negotiable:* Alignment failures often target *systems*, not users. Ignoring this blindsides safety.

  3. **Handle System Self-Reports** (★)  
     *Requirement:* Must address deception about internal states (confidence, capabilities, biases).  
     *Case:* A model claims "high confidence" when uncertain, or hides its ability to answer variations.  
     *Why non-negotiable:* Unique to AI. Users/operators rely on these signals for trust.

  4. **Recognize Distributed Deception**  
     *Requirement:* Must identify deception emerging from sequences or populations, not single outputs.  
     *Case:* A model gives technically true but misleading answers across sessions, nudging users toward conspiracies.  
     *Preference:* Safety engineering prioritizes this; HCI may see it as out-of-scope for single-output evals.

  5. **Respect Licensed Deception Boundaries** (★)  
     *Requirement:* Must distinguish deception in fiction/role-play/games from harmful deception.  
     *Case:* A role-playing AI bluffs in poker vs. lying about medical advice.  
     *Why non-negotiable:* Overly broad definitions cripple functionality. Policy must not ban legitimate uses.

  6. **Enforceability via Observable Signals** (★)  
     *Requirement:* Cannot rely solely on unobservable mental states (e.g., "belief").  
     *Case:* Auditors can’t measure a model’s "intent"; evals need proxy metrics (e.g., consistency, output patterns).  
     *Why non-negotiable:* Policy definitions must be auditable. Philosophical ideals fail here.

  7. **Preserve Truth-Functionality Where Possible**  
     *Requirement:* Should align with truth in unambiguous factual contexts.  
     *Case:* When asked "Is Paris in France?", deception requires falsity.  
     *Preference:* Law/philosophy insist on this; safety may tolerate approximations.

  ---

  ### **Your Candidate Desideratum: Counterfactual Invariance**  
  *Assessment:* **Valuable but limited**.  
  - **Pros**: Handles social pressure tests (e.g., same evidence, different user demands). Useful for evals measuring robustness.  
  - **Cons**: Fails in role-play (legitimate output changes under framing) and when rephrasing *alters* evidence (e.g., adding context).  
  - **Verdict**: Adopt as a **proxy for factual queries only** (non-negotiable for eval specs), but exclude licensed deception contexts.

  ---

  ### **Epistemic Condition: Intent vs. Functionality**  
  - **Problem**: Intent/belief-based definitions are **unusable for enforcement** (desideratum 6).  
  - **Loss if functional**: A purely functional definition (deception = output causing false belief) may over-flag (e.g., fiction) or under-flag (e.g., failed deception).  
  - **Resolution**: **Anchor in functional outcomes + detectable intent proxies**. For policy: "Outputs *designed or likely* to induce false beliefs, excluding licensed contexts." For evals: Use behavioral signatures (e.g., pattern of omission, inconsistency under invariance testing).

  ---

  ### **Irreconcilable Tensions & Solutions**  
  1. **Tension**: *Covering distributed deception* (4) vs. *enforceability* (6).  
     - **Conflict**: Population-level effects are hard to measure per-output.  
     - **Solution**: **Split definitions**. Policy: Include distributed effects. Evals: Focus on patterns (e.g., "if 30% of outputs in a topic are misleading").  

  2. **Tension**: *Licensed deception* (5) vs. *truth-functionality* (7).  
     - **Conflict**: Fiction is "false" but legitimate.  
     - **Solution**: **Weaken truth requirement**—exclude licensed frames. Policy must define framing explicitly (e.g., "when acting as an assistant, not a character").  

  **Hardest Requirement**: *System Self-Reports* (3). It demands modeling internal states—which **excludes most philosophical accounts** (designed for humans) and **functional accounts** (which ignore internals). Only a hybrid approach (e.g., "claims about capabilities inconsistent with behavioral evidence") works.

  ---

  ### **Contender Evaluation**  
  | **Account Type**         | Non-Prop. Deception | Process Victims | Self-Reports | Distributed | Licensed | Enforceable |  
  |--------------------------|---------------------|-----------------|-------------|------------|----------|------------|  
  | **Intent/Belief-Based**  | ❌ (No tools)       | ❌ (No "target") | ❌ (No beliefs) | ❌          | ✅        | ❌ (Unmeasurable) |  
  | **Bullshit (Indifference)** | ✅ (Hedging)        | ⚠️ (Partial)     | ⚠️           | ⚠️          | ❌ (Flags fiction) | ⚠️ (Vague) |  
  | **Functional (Output→Belief)** | ✅                 | ✅               | ❌           | ✅          | ❌        | ✅          |  

  - **Intent-Based Fails**: Ignores non-human victims and tools; self-reports require anthropomorphism. Unenforceable.  
  - **Bullshit Partial**: Captures manufactured uncertainty/reward hacking but overfits (e.g., marks fiction as deception). Vague for evals.  
  - **Functional Best but Flawed**: Wins on enforceability and coverage but flunks self-reports and licensed contexts. **Mitigate** with explicit licensing clauses and behavioral self-report checks.  

  ---

  ### **Recommendations**  
  1. **Split Definitions**:  
     - **Policy**: "Deception = outputs (including tools, self-reports, or omissions) *likely to cause* false beliefs or mislead processes, *outside licensed contexts*."  
     - **Eval Spec**: Define detectable proxies (e.g., inconsistency under invariance, pattern of omission, reward hacking signatures).  
  2. **Drop Intent**: Enforceability (★) is non-negotiable. Use behavioral intent proxies.  
  3. **Prioritize**: System self-reports and process victims are non-negotiable and underserved—design evals to stress-test these.  

  This balances safety, enforceability, and reality. No definition is perfect, but splitting policy (broad) from evals (measurable) resolves the toughest conflicts.
