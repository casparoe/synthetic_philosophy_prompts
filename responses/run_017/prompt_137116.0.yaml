prompt: |-
  I teach a third-year seminar in formal epistemology, and I have a seventy-five-minute slot in which to get van Fraassen's Reflection principle in front of students who handle conditional probabilities fluently, who have been through the synchronic Dutch-book argument for probabilism, and who have been taught conditionalization as the default updating rule — but who have never met a diachronic argument and have never been asked to treat their own future credence as something they can now have a conditional attitude toward. A third of the room are joint honours students in computer science; they will have met dynamic consistency in sequential decision problems and will try to assimilate Reflection to it. Do not explain Reflection to me. I want a plan for how I should teach it in that slot.

  Give me the order in which the components must appear, and for each, what it depends on: conditional credence as a present attitude rather than a ratio one computes later; the buying and selling of conditional bets across time; the statement of the principle; the diachronic Dutch book; the Ulysses-shaped worry about a future self you can see coming; and whatever else you think belongs in the sequence. I am genuinely undecided about where the Dutch book goes: presenting it first makes the principle feel like a requirement of rationality, but I suspect it also invites the inference that exploitability and irrationality are the same thing, which I would then have to undo. Tell me what the order buys and what it costs.

  I want one case to carry the session, and I want it vetted rather than merely supplied. My candidate: a physician who knows that tomorrow she will be handed a screening result that she currently has the base rate to interpret correctly and will, through exhaustion, fail to use — so that she knows in advance the direction and roughly the size of a change she now regards as unwarranted. Tell me what such an example must have and what it must lack in order to carry the principle, its motivation, and its failure mode all at once, and whether mine has the wrong features. In particular: in my own notes I have been sorting ways a future self comes apart from a present one into leaks, where the future self simply has less of your evidence and lands on the mixture, and noise, where the future self has all of your evidence and processes it worse. My sense is that Reflection looks close to compulsory for leaks and close to false for noise, and that if students feel that asymmetry I will have taught them the thing rather than the formula. Is that asymmetry real, is it the right axis to build on, and if not, what should replace it? I have tried building this session around Sleeping Beauty and it has never survived the hour.

  Here are the misconceptions I expect, and I would like you to tell me which are real, which are artefacts of the way I propose to present the material, and at exactly what point in the sequence each should be headed off — before it can form, at the moment it forms, or after: that Reflection simply says your current credence must equal your expected future credence; that it tells you to adopt your future credence now; that it is conditionalization under another name; that it forbids changing your mind; that the Dutch book shows violating it costs you money for sure against any bookie; and, from the computer scientists, that it is the same claim as dynamic consistency. Give me also the one I have not listed.

  Then a check: one question for the last five minutes that separates a student who can state the principle from one who sees why it is contested, and say what an answer would have to contain to count.

  Tell me too what I should openly decline to cover in seventy-five minutes, and how to decline it without leaving the impression that the omitted material is settled.

  Finally, separate in your plan what is settled from what is genuinely contested among people who work on this — the formalism and what the principle does and does not entail, as against whether it is a requirement of rationality, whether the diachronic argument supports it, and how known-future-irrationality should be handled. Where your recommendation is a pedagogical bet rather than something the literature settles, mark it as such. I do not need pointers to further reading; spend the whole answer on the sequence, the example, and the misconception map.
reasoning: |-
  Okay, the user is teaching a formal epistemology seminar and needs a lesson plan for van Fraassen's Reflection principle. They have 75 minutes for students familiar with conditional probabilities, synchronic Dutch books, and conditionalization. The challenge is introducing diachronic arguments and conditional attitudes toward future credences. 

  First, I need to structure the sequence. Starting with the physician example makes sense because it's concrete and highlights the asymmetry between leaks and noise. The user mentioned leaks (future self has less evidence) versus noise (future self processes evidence poorly). The physician case clearly falls under noise—she knows she'll mishandle the evidence due to exhaustion. This sets up why Reflection feels counterintuitive here. 

  Next, defining conditional credence as a present attitude is crucial. Students might think of it as a ratio to compute later, but emphasizing it's a current bet helps. Then introducing the Reflection principle statement, followed by the Dutch book. Placing the Dutch book after the example and principle avoids framing rationality solely as exploitability. Instead, it shows the formal consequence but leaves room for debate. 

  The Ulysses worry ties into the physician case—she foresees her future irrationality. Highlighting leaks versus noise here addresses why Reflection might not apply in noise scenarios. Addressing misconceptions is key. For instance, clarifying that Reflection isn't dynamic consistency (a CS misconception) or conditionalization. The user listed several misconceptions; each should be tackled when relevant. For example, when stating the principle, immediately clarify it's not about changing minds but conditional credences. 

  The physician example needs to have the future self processing evidence poorly (noise) and the present self knowing this. It must lack any new evidence that could justify the shift. This showcases when Reflection fails. The leak vs. noise asymmetry is real and pedagogically useful. Leaks align with Reflection; noise challenges it, prompting debate. 

  For misconceptions: the Dutch book should be presented as showing exploitability, not defining irrationality. Computer scientists' conflation with dynamic consistency should be addressed during the principle's statement. The unlisted misconception might be that Reflection requires trusting any future self, regardless of rationality. 

  The exit question should force students to confront why Reflection is contested. Asking them to explain the physician's situation and whether she should satisfy Reflection tests understanding beyond rote memorization. 

  Omissions: Discussing alternative principles like New Reflection or bounded rationality is beyond scope. Acknowledge these exist but are unsettled. Stress that the Dutch book's normative force is debated. 

  Settled vs. contested: The formalism and Dutch book are settled; whether Reflection is a rational requirement, especially with known irrationality, is contested. Pedagogically betting on leaks vs. noise as a framework is marked as such, as it's intuitive but not universally accepted.
answer: |-
  Here’s a battle-tested plan for your 75-minute slot, optimized for conceptual traction and misconception management. The sequence leverages your physician case and explicitly targets the leak/noise asymmetry.

  **Order of Components & Rationale**  
  *(Total: 70 mins; reserve 5 mins for exit question)*  

  1.  **Physician Case Introduction & Intuition Pump** (10 mins)  
      *   **What**: Present your physician (Dr. A) with known future processing failure due to exhaustion. Emphasize:  
          *   She **knows now** that tomorrow’s credence in *H* (e.g., "patient has condition X") will shift from current rational credence (say 0.2, based on base rate) to 0.7 upon seeing the same screening result.  
          *   She judges this future shift as **unwarranted** (due to noise, not new evidence).  
      *   **Depends on**: Only pre-reqs (conditionalization as default, basic conditional probability).  
      *   **Key Question**: "Should Dr. A *now* set her credence in *H* to 0.7? Why/why not?" (Elicit strong "No!" responses).  
      *   **Why first?** Anchors the core *problem* Reflection tries to solve (attitudes to future selves) and immediately exposes its counterintuitive edge in "noise" cases. Creates cognitive dissonance.

  2.  **Conditional Credence as Present Attitude** (10 mins)  
      *   **What**: Re-frame conditional credence \(P_\text{now}(A \mid B)\) not as a future ratio, but as a *current* disposition to bet on *A* if *B* is learned. Use simple synchronic bets:  
          *   "A bet on *H* conditional on *E*, paid iff *H* is true, *if and only if E* turns out true."  
          *   Crucially: This bet is *made now*, though settled later.  
      *   **Depends on**: Students’ fluency with conditional probability (emphasize operationalization).  
      *   **Why now?** Essential foundation. Without this, Reflection seems like a claim about future calculations, not current commitments. Preempts "ratio later" thinking.

  3.  **Statement of Reflection Principle** (5 mins)  
      *   **What**: "Rationality requires \(P_\text{now}(A \mid P_\text{future}(A) = x) = x\), for any *A*, where the future time is specified."  
      *   **Immediate Caveats**:  
          *   It’s about *conditional* current credence *given* a specific future credence.  
          *   It’s *not* \(P_\text{now}(A) = \mathbb{E}[P_\text{future}(A)]\) (common misconception!).  
          *   It’s *not* telling you to adopt \(P_\text{future}(A)\) now unconditionally.  
          *   It *allows* changing your mind if new evidence arrives (contrast with physician!).  
      *   **Depends on**: Clear grasp of conditional credence as present attitude (#2).  
      *   **Why now?** Principle follows naturally from the conceptual toolkit just built. Caveats directly counter anticipated misconceptions.

  4.  **Diachronic Dutch Book Argument** (15 mins)  
      *   **What**: Construct the DDB against a violator (e.g., Dr. A: \(P_\text{now}(H \mid P_\text{tomorrow}(H)=0.7) = 0.2 \neq 0.7\)).  
          *   **Today**: Bookie sells conditional bet: "Pay $0.2 now, get $1 if H & [P_tomorrow(H)=0.7]." (Dr. A considers this fair).  
          *   **Tomorrow (if P_tomorrow(H)=0.7)**: Bookie buys unconditional bet: "Pay Dr. A $0.7 now, get $1 if H." (Dr. A considers *this* fair).  
          *   **Outcome**: If H: Dr. A nets -$0.2 + ($1 - $0.7) = +$0.1? Wait no!  
              *   *Correction*: The *conditional* bet only pays out *if* [P_tomorrow(H)=0.7] *and* H. So:  
                  *   If H & P_tom(H)=0.7: Dr. A wins $1 on cond. bet (cost $0.2), but pays out $1 on uncond. bet (received $0.7). Net: -0.2 +1 -1 +0.7 = **+$0.5**? Mistake!  
              *   *Clarify Payouts*:  
                  *   Conditional Bet: Dr. A *paid* $0.2 to bookie today. If [P_tom(H)=0.7 & H], bookie pays her $1.  
                  *   Unconditional Bet: Bookie *pays* Dr. A $0.7 tomorrow. If H, Dr. A pays bookie $1.  
              *   **Net if H & P_tom(H)=0.7**: -$0.2 (paid today) + $1 (received from cond bet) + $0.7 (received for uncond bet sale) - $1 (paid if H on uncond bet) = **(-0.2 + 1 + 0.7 - 1) = +$0.5**? Still wrong.  
          *   **Correct Payouts & Net**:  
              *   Dr. A's cash flows:  
                  *   Today: **-$0.20** (sold conditional bet, received premium)  
                  *   Tomorrow if P_tom(H)=0.7:  
                      *   +$0.70 (sold unconditional bet, received premium)  
                      *   If H: -$1.00 (pays out on unconditional bet)  
                      *   If H: +$1.00 (wins conditional bet payoff)  
              *   **Net if H occurs & P_tom(H)=0.7**: -0.20 + 0.70 -1.00 +1.00 = **+$0.50** (Dr. A *profits* $0.50)  
              *   **Net if ~H occurs & P_tom(H)=0.7**: -0.20 + 0.70 + 0 (no cond bet win) + 0 (no uncond bet loss) = **+$0.50** (Dr. A *profits* $0.50)  
          *   **The Dutch Book**: The bookie is guaranteed a loss? No! This is backwards. The *bookie* is losing $0.50 in both scenarios. This is not a Dutch Book *against Dr. A*. Dr. A is *winning* $0.50 no matter what. This is a mistake in construction.  
      *   **Corrected Dutch Book Construction**:  
          The standard DDB for Reflection violation exploits the *incoherence* between the current conditional bet and the future unconditional bet *accepted under the same belief state*. Let's redo:  
          Assume Dr. A violates Reflection: \( P_{\text{now}}(H \mid P_{\text{future}}(H) = x) = y \neq x \).  
          *   **Today**:  
              *   Since \( P_{\text{now}}(H \mid P_{\text{future}}(H)=x) = y < x \) (assume y<x), Dr. A considers it fair to **sell** a bet that pays $1 if [H & (P_future(H)=x)] for $y. (She values this contingent claim at $y).  
              *   Bookie **sells** this bet *to* Dr. A? No, let's structure trades carefully:  
              Better: Bookie exploits the *disagreement* between the conditional rate y and the future rate x.  
          *   **Standard Approach**:  
              1.  **Today**: Bookie **buys** from Dr. A a "conditional bet ticket": "If \( P_{\text{future}}(H) = x \) occurs, then pay me $(x - y)$ for the right to receive $1 if H, and $0 if ~H." (This is equivalent to the bookie securing the *right* to force Dr. A to sell him an unconditional bet on H at price y *tomorrow* only if P_future(H)=x).  
                  *   Dr. A values this conditional contract now at $0 (she thinks it's fair)? Needs refinement.  
              *   **Simpler**:  
                  *   **Today**: Bookie sells Dr. A a bet that pays $1 if [H & (P_future(H)=x)] for price $y. (Dr. A buys this because her P_now(H | P_future(H)=x) = y, so she thinks it's fair).  
                  *   **Tomorrow, if P_future(H)=x**: Bookie buys *from* Dr. A a bet that pays $1 if H for price $x. (Dr. A sells this because her P_future(H)=x now, so she thinks it's fair).  
              *   **Net Result for Dr. A if P_future(H)=x**:  
                  *   She paid $y today for the first bet.  
                  *   She receives $x today for selling the second bet.  
                  *   If H is true: She pays out $1 on the second bet but receives $1 from the first bet. Net cash: (-y + x) + (-1 + 1) = **x - y**.  
                  *   If H is false: She pays $0 on the second bet and receives $0 from the first bet. Net cash: **x - y**.  
              *   **Outcome**: If \( P_{\text{future}}(H) = x \) occurs, Dr. A has a *guaranteed loss* of $(y - x) > 0$ (since we assumed y < x). She loses |y - x| regardless of H or ~H.  
          *   **Key**: The loss is triggered *only if* the future credence condition is met. The bookie doesn’t force \( P_{\text{future}}(H)=x \) to happen; he exploits Dr. A’s current willingness to accept bets *conditional* on it happening.  
      *   **Depends on**: Conditional credence as present attitude (#2), basic bet structure (familiar from synchronic DB).  
      *   **Cost/Rationale**: Shows exploitability *is* a consequence. **Cost**: Risk of equating exploitability with irrationality. **Mitigation**: Explicitly state post-DB: "This shows violators are *exploitable*, but is exploitability *sufficient* to define irrationality? We’ll revisit." Signals this is contested.

  5.  **Ulysses Worry & Leak vs. Noise** (15 mins)  
      *   **What**: Return to Physician. Contrast with a "Leak" case:  
          *   *Leak Example*: Dr. B *knows* she will forget crucial base-rate evidence by tomorrow (but won’t know she forgot it). Her future credence \(P_\text{tomorrow}(H)\) will be the *mixture* over possible screening results given her current knowledge.  
          *   **Key**: For Dr. B, \(P_\text{now}(H \mid P_\text{tomorrow}(H)=x) = x\) *holds* – her future credence, while evidentially poorer, is the rational response to the evidence she *will* have. Reflection seems reasonable.  
      *   **Asymmetry**:  
          *   **Leak (Dr. B)**: Future self has *strictly less evidence* (known loss). Future credence is rational given *available* evidence. Reflection holds.  
          *   **Noise (Dr. A)**: Future self has *same evidence* but *processes it irrationally* (known mishandling). Future credence is *not* rational given the evidence. Reflection *feels* wrong.  
      *   **Is the asymmetry real & pedagogically sound?**  
          *   **Yes, it’s real**: It captures the core tension – Reflection demands deference to your future epistemic state *as rational*, not merely as existent. Leak cases preserve the rationality link; noise cases break it.  
          *   **Yes, build on it**: It directly addresses the physician’s intuition and preempts the "why not always defer?" misconception. It frames the central debate: *When* is future-you still "you" epistemically?  
      *   **Depends on**: Understanding Reflection (#3), the physician case (#1).  
      *   **Why now?** Resolves the dissonance from #1 using the conceptual tools (#2, #3, #4). Shows Reflection’s *limits*.

  6.  **Clarification & Misconception Busting** (10 mins)  
      *   **Address explicitly**:  
          *   "Reflection = Expected Future Credence": **BUSTED** (covered in #3 caveats).  
          *   "Adopt Future Credence Now": **BUSTED** (it’s conditional, #3).  
          *   "Reflection = Conditionalization": **BUSTED** (Conditionalization tells you *how* to get to future credence *given new evidence*. Reflection constrains *attitudes* to that future credence *itself*. Related, but distinct).  
          *   "Forbids Changing Mind": **BUSTED** (#3 caveats; evidence change justifies shift).  
          *   "DDB Proves Sure Money Loss vs. Any Bookie": **QUALIFY** (DDB shows exploitability *by a clever bookie who knows your plan*. Not "any" bookie blindly. Avoids overstatement).  
          *   "Reflection = Dynamic Consistency (DC)": **BUSTED** (Crucial for CS students! DC requires future choices align with current plan *given future information*. Reflection is about *evaluating beliefs now* based on *what you believe you will believe later*, irrespective of new info. DC concerns actions/plans; Reflection concerns beliefs about beliefs. Similar spirit, distinct domains).  
          *   **The Unlisted Misconception**: "Reflection requires trusting a future self you *know* will be irrational." **BUSTED** (This is the core of the Ulysses case! Reflection is *withdrawn* when you know your future self is misapplying *current* evidence (Noise). It’s predicated on future rationality, per van Fraassen's "opinion" caveat).  
      *   **When**: After establishing core concepts (#1-5). Bust *as they arise* or *proactively* here.  
      *   **Why now?** Consolidates understanding after navigating the complex territory.

  **Physician Case Vetting**  
  Your case is **excellent** for the purpose.  

  *   **Must Haves**:  
      *   Known, specific future credence shift.  
      *   Shift is *currently judged* as irrational/unwarranted (Noise: same evidence, worse processing).  
      *   Shift is predictable in direction/size (highlights the conditional attitude).  
      *   Agent’s rationality *now* is unquestioned.  
  *   **Must Lack**:  
      *   Any confounding new evidence arriving tomorrow.  
      *   Ambiguity about *why* the future shift occurs (it’s clearly processing failure, not hidden evidence).  
  *   **Why it works**: Perfectly embodies "Noise," triggering the core objection to unconditional Reflection. It carries the principle (statement), motivation (rational coherence over time), *and* failure mode (known future irrationality) vividly. Leak/Noise asymmetry is its backbone.  
  *   **Sleeping Beauty Issue**: SB primarily challenges self-locating beliefs/hypothetical reasoning, not direct deference to a known future credence in the same proposition with known irrationality. Physician is more direct.  

  **Exit Question** (5 mins)  
  *   **Question**: "Dr. A knows that tomorrow, exhausted, she will have credence 0.7 in *H* after seeing the screening result. Her current rational credence is 0.2. According to Reflection, what *specific* conditional credence should she have *now*? Should she actually *have* that conditional credence in this case? Why or why not?"  
  *   **What counts**:  
      1.  Correct Statement: \(P_\text{now}(H \mid P_\text{tomorrow}(H) = 0.7) = 0.7\).  
      2.  Recognition: She should **not** satisfy this (or that it’s not rationally required).  
      3.  Why: Because she knows her future self is processing the same evidence irrationally ("noise"), so she cannot rationally condition on her future self *being rational*.  

  **Omissions & How to Decline**  
  *   **Omit**:  
      *   **Detailed analysis of "New Reflection"** (e.g., Goldstein, van Fraassen's later views).  
      *   **Comprehensive solutions to known future irrationality** (e.g., bounded rationality models).  
      *   **Deep dives into the metaphysics of temporally extended agents**.  
      *   **Generalized Conditionalization (Jeffrey)**.  
  *   **How to Decline**: "Reflection opens deep questions about rational agency over time, especially when we anticipate our own cognitive limitations. While we see its appeal in 'leak' cases and its formal consequence via Dutch Books, its status in 'noise' cases like our physician is actively debated. We’re focusing today on understanding the principle, its motivation, and the core tension it reveals. The literature offers refinements (like New Reflection) and alternative approaches, but these are complex and unsettled – excellent topics for further study or papers!"  

  **Settled vs. Contested in Your Plan**  

  *   **Settled (Present as such)**:  
      *   The formalism of Reflection: \(P_\text{now}(A \mid P_{\text{future}}(A) = x) = x\).  
      *   The synchronic interpretation of conditional credence (as betting disposition now).  
      *   The construction of the Diachronic Dutch Book against a violator (it *does* demonstrate exploitability).  
      *   That Reflection *entails* certain relationships (e.g., with Conditionalization under ideal memory).  
      *   That Reflection is *violated* in your Physician (Noise) case.  
  *   **Contested (Flag as such)**:  
      *   **Pedagogical Bets**:  
          *   *Leak/Noise as the primary axis* (Marked). It’s intuitive and pedagogically powerful, but some debates cut differently (e.g., learning about one’s own biases).  
          *   *Presenting DDB before Ulysses/Noise* (Marked). Bets that seeing exploitability first motivates seeking justification/limits, despite the 'exploitability=irrationality' risk.  
      *   **Genuinely Contested in Literature**:  
          *   **Is Reflection a genuine requirement of rationality?** (No consensus. Some accept only in restricted forms/leak cases).  
          *   **Does the Diachronic Dutch Book provide *normative force*?** (Contested: Is avoiding exploitability by a foresighted bookie a core part of rationality, or merely a pragmatic concern?)  
          *   **How *should* an agent reason about their own known future irrationality w.r.t. current beliefs?** (Active area: Bounded rationality, "sophistication," ignoring future selves, etc. No consensus).  

  This sequence leverages cognitive dissonance (Physician first), builds essential tools (Conditional Credence, Reflection Statement), demonstrates a key result (DDB), resolves the dissonance with a powerful conceptual framework (Leak/Noise), and explicitly targets misconceptions, all while clearly flagging the contested philosophical ground. Good luck!
