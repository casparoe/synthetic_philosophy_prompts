answer: |-
  ## The Standard of the Unclaimed

  The file on Clara Vance’s desk smelled faintly of smoke, a stubborn ghost clinging to the photocopied incident report. *Harbour Ferry ‘Sea Sprite’, Engine Room Fire, Fuel Line Incident – Claimant: Liam Walsh, Deckhand (Age 19).* The Registry of Unclaimed Deeds processed paperwork, not pyres. Yet the scent persisted, an olfactory intrusion into the sterile world of forms, precedents, and indemnity calculations.

  Liam Walsh’s statement was brief, typed in the blocky font favoured by union legal aides. "*Knew the procedure for manual fuel cut-off. Knew where the valve was. Captain was on the bridge dealing with evacuation. Other deckhand was helping passengers. Nobody else knew the engine room layout like that. So I went back in. Didn’t decide. Just knew it had to be done, and I was the one who knew how.*" He’d suffered second-degree burns on his hands and forearms, inhaled enough smoke to require two nights in hospital, and ruined his work boots. The ferry operator’s insurer had already covered medical bills and lost wages under the standard maritime employment contract. They argued vehemently that closing the fuel line fell squarely within the ambit of a deckhand’s duties during an emergency – maintaining vessel safety. Therefore, they contended, it was not certifiable as an Unclaimed Deed.

  The union argued otherwise. Not because they believed Liam had transcended duty, but because certification brought the state indemnity. The insurer’s coverage was adequate, but the Registry’s indemnity was comprehensive, covering *everything* – future physiotherapy, potential skin grafts, even the cost of replacing the melted soles of his boots. More consequentially, certification came with the Medal of the Unclaimed, a tangible, pensionable honour. Money, again. Always money.

  Clara rubbed her temples. The core question, the one the Registry was built to answer, seemed simple on the parchment of the founding statute: Was the deed *unclaimed*? Did anyone owe it? But thirty years of assessing had taught her the simplicity was a mirage. The statute declared certified deeds non-precedential, a firewall against the insidious ratchet of expectation. Yet, to assess the indemnity claim – the ruined boots, the hospital bill, the physio – assessors *had* to evaluate the claimant’s actions. Did they act with the competence expected of someone undertaking such a task? Over decades, that "competence standard" had ossified. It wasn’t just about avoiding recklessness; it hardened into something resembling professional conduct. The paperwork, in demanding proof of competence to justify compensation, silently erected the very precedent the doctrine forbade. The deed couldn’t bind anyone, the law insisted. The forms, demanding proof you’d done it *properly*, whispered otherwise.

  Liam Walsh hadn’t decided, he claimed. He simply *knew* it was his job. Was that belief enough to negate the unclaimed nature of his act? If you sincerely felt duty-bound, did that make it so, collapsing the space for the Registry to exist? Or was that feeling merely the internal echo of the competence standard the Registry itself had inadvertently imposed?

  And then, the deeper paradox: Could an act truly survive being officially labelled "optional"? Once the Registry certified it, bathed it in indemnity, pinned a medal on it, and codified the competence required to perform it acceptably… didn’t it cease to be truly optional? Didn’t recognition inevitably curdle into expectation for the next person in that role?

  Her own file, the one not on her desk but locked in the bottom drawer of her home filing cabinet, pressed against her thoughts. Thirty years. The memory wasn’t smoke, but cold, dirty water. She’d been twenty-three, driving home late with Robert, her fiancé. Torrential rain. They’d seen the headlights submerged in the underpass ahead. She hadn’t decided either. She’d just waded in. The water, thick with runoff, was chest-high, numbing. She’d pulled two people out, gasping and terrified, handing them off to Robert who stood on the railing above, rope coiled uselessly in his hands. He’d shouted warnings, his voice tight with fear. She’d gone back for the third. She remembered the shape under the water, the struggle, the awful silence when she finally dragged the limp form to the edge. Too late. Robert hadn’t waded in. He’d stood firm on the concrete, shouting her name, frozen. She hadn’t spoken to him since. Filing her deed now… it would mean the Registry certifying, officially, that Robert owed nothing that night. That standing on the railing, rope unused, was all that could have been claimed of him. The thought tasted like bile.

  She turned back to Liam’s case. The ferry operator’s manual was ambiguous. Deckhand duties included "assisting in emergency procedures" and "maintaining vessel safety under officer direction." Closing a specific fuel valve during an engine fire wasn’t explicitly listed. The insurer pointed to general clauses; the union pointed to the absence of specifics. Was there always a sliver left over, even in the most defined role, a moment where the script ran out and something extra was demanded? Or did the general duty of "safety" swallow any specific act whole, making it always claimed? Clara knew firefighter assessments were nightmares for this very reason. Where did the job description end and the unclaimed deed begin?

  Liam’s insistence that he "never decided" gnawed at her. If he genuinely believed it was simply his job, was the act unclaimed in his own mind? The Registry didn’t adjudicate states of mind; it adjudicated the external fact of whether the duty existed. Yet his belief felt relevant. It spoke to the internalization of the competence standard, the blurring of lines the Registry had created. He acted *because* he knew the procedure, *because* he was competent – the very competence the indemnity assessment demanded proof of. The circle felt vicious.

  She drafted her preliminary findings. Dry, precise prose. "*The claimant possessed unique knowledge of the engine room layout and the specific fuel cut-off procedure, knowledge not universally held by deckhands nor explicitly mandated in the operator’s manual for immediate action without direct orders during the specific emergency conditions encountered. While general duties of safety apply, the specific act of re-entering the actively burning engine room after initial evacuation, absent a direct order and undertaken solely due to the claimant’s unique procedural knowledge, presents a potential space for the unclaimed.*"

  She paused. "Presents a potential space." Legal hedging. She noted the insurer’s argument about competence: "*The claimant’s actions, while courageous, demonstrate a level of procedure-following competence expected of a trained deckhand responding to an emergency affecting vessel integrity.*" There it was. The competence standard, invoked to potentially *deny* certification, while simultaneously being the benchmark the Registry itself enforced for granting indemnity. The doctrine’s fatal flaw, laid bare in bureaucratic ink.

  She recommended provisional certification pending final indemnity assessment. The union would get its medal and its broader compensation. Liam Walsh would become a footnote in Registry files, his boots and burns quantified. And the ratchet? It would turn, silently, one more notch. The next deckhand in a similar, but not identical, crisis would face the unspoken expectation: Liam Walsh knew the procedure and acted. Why don’t you?

  The decision didn’t bring clarity, only the weight of perpetuating the system’s contradiction. She closed Liam’s file, the phantom smoke dissipating, replaced by the damp chill of a thirty-year-old memory. Robert’s face, pale and strained under the streetlight, the useless rope. The third person, lost.

  Home was quiet. The bottom drawer of the filing cabinet slid open with a familiar rasp. The folder inside was thin: a yellowed newspaper clipping about the underpass rescue, a copy of the police report listing her and Robert as witnesses, a few scribbled notes she’d made years ago, considering filing. No official forms. Just the ghost of that night.

  She sat at her kitchen table, the folder open. The Registry’s questions echoed in the silence of her own history.
  *Did Robert owe a duty to wade into that underpass?* His job? He was an accountant. His role was numbers, not rescue. Did being her fiancé, standing on the safe railing, claim anything more? The statute was clear: bystanders owed nothing. His fear was human. Certifying her deed would enshrine that. It would state, coldly, officially, that he met the standard required of him: zero.
  *Had she decided?* She remembered the cold shock of the water, the panicked cries. She remembered moving. Not thinking, *moving*. Was that a decision? Or was it, like Liam, simply acting because she was there, and capable? Did her capability impose its own claim?
  *And what of recognition?* If she filed now, thirty years late, the Registry would assess it. They’d ask: Did she act competently? Did she prioritize the rescues effectively? Could she have saved the third? The competence standard would be applied retrospectively to a moment of terror and dirty water. It would quantify her loss – the recurring nightmares, the persistent chill she felt near deep water, the broken engagement – into indemnifiable categories. Ruined metaphorical boots. Lost emotional wages. It would offer compensation, a medal, and the official stamp: *Unclaimed*. Would that recognition, that belated certification, make her act *more* optional? Or would it finally calcify it into an expectation she’d carried alone all these years?

  The forms were downloadable from the Registry’s website. Simple PDFs. Name. Date. Location. Description of the deed. Description of the loss. She opened her laptop. The screen glowed in the dim kitchen. She navigated to the site, found the section for historic filings. The cursor blinked in the name field.

  Outside, the city hummed, oblivious to the weight of unclaimed deeds and the silent tightening of standards. Clara Vance, senior assessor, sat very still. Her finger hovered over the trackpad. She looked at the blank field on the screen, then at the faded newspaper clipping beside the laptop. Robert’s name was mentioned. A witness.

  She took a slow breath. The dry institutional words – *unclaimed, certified, owed, the standard* – crowded the quiet room, heavy with thirty years of unspoken judgment and indemnifiable pain. She moved the cursor. The decision, when it came, was silent, a single click in the stillness. The screen refreshed, presenting the next blank field. She began to type. Her face revealed nothing. Whether it was the right thing, the Registry’s purpose fulfilled or further eroded, remained as unresolved as the questions on Liam Walsh’s file, and as opaque as the dark water in the underpass all those years ago.
