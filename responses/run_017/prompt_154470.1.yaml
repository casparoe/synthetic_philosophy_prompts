prompt: |-
  Hey — I write historical novels (the last one was set in Dublin in 1798, the one I'm slogging through now is about a family of glassmakers in Bohemia around 1880) and I keep having the same argument with myself, and ocassionally with a reader, about what I'm allowed to invent. I've dipped into the history-theory stuff — the Rankean ideal of showing the past as it really was, Carr being sceptical about whether facts even arrive unselected, White and the narrativist crowd saying the shape is imposed anyway — and none of it seems to be about my actual problem. Selection isn't my problem, obviously I select. Invention is. So here's my list of gut verdicts, and what I want from you is the principle underneath them, if there is one, plus which of them I have to give up.

  Fine, no guilt at all: inventing a minor person who isn't in the record — a furnace boy at the glassworks, a maid, a clerk. Nobody thinks there's a roll-call.

  Not fine, and this is the one that wakes me up: putting a made-up sentence into the mouth of a real, documented person, in a scene I've invented anyway.

  Fine, and I do it constantly: putting that same real person in a room he was almost certainly not in, on a day when he was documented in another city, for a scene that's invented anyway.

  Not fine, and it feels worse than the furnace boy even though both are "adding a person": fusing two real minor figures into one composite character.

  Not fine: moving a real, datable event by nine days so it collides with my plot.

  Fine: reordering two private quarrels whose real order the record doesn't settle at all, so that the second one lands where I need it.

  Fine, obviously, everyone does it: a real person's thoughts, motives, what they wanted and were ashamed of — unless the record actually says otherwise, and then it flips to not fine.

  Fine, no problem at all: a whole counterfactual novel, clearly signalled as one on the jacket.

  The worst thing on my list, worse than the made-up sentence: one counterfactual event slipped into a book that otherwise tracks the record, with nothing signalling it.

  Torn, leaning fine: turning something we only have as a paraphrase in somebody's letter into direct speech.

  Now, the two that I think are genuinely hard to hold together. The made-up sentence and the wrong room are the same move — I'm placing a real person where the record doesn't place them — and I condemn one and don't even hesitate over the other. I have a story: it's about quotation, that words are different from whereabouts, that a sentence in quotation marks is a claim about a document while a body in a room is a claim about a staging. But I don't definately believe it, because a made-up scene between two real people is already a hundred made-up sentences, and I'm fine with those in free indirect style — it's only the ones between quote marks that bother me, which smells like formalism rather than anything about truth. And the counterfactual pair I can't unify at all: if invention is licensed by signalling, then the jacket copy is doing an enormous amount of moral work, and most readers never read jacket copy.

  My novelist friend says the whole list is just tracking whether the reader is *licensed* to take a sentence as testimony, and that the licence is set by the form of the text and not by how big or small the fact is. I half believe her, but I think that gets the composite wrong — the composite isn't about what the reader is invited to believe, it's about someone being deleted, and I don't see why deletion is worse than addition on a licence story.

  So: state a principle, or two or three candidates, precisely enough that I could actually apply it at my desk at 7am. Tell me which case motivates each clause. Tell me what it says about the cases I haven't put on the list — a novel narrated in first person by a real historical person; a real person who is recognisable but renamed; two real events merged into one; a real documented quotation given to the wrong real person; an author's note at the end that lists everything I changed; and whether it matters if the invented thing I make a real person do is vile rather than trivial. And be honest about which of my verdicts your principle can't accommodate and which one you'd overturn — I want reflective equilibrium here, not a principle that saves the list by being infinitely adjustable.
reasoning: |-
  Okay, this is a fascinating and deeply nuanced question from a historical novelist wrestling with ethical boundaries in their craft. The user has clearly done their homework on historiography (Ranke, Carr, White) but correctly identifies that theoretical frameworks don't resolve their practical dilemmas about invention versus fidelity. 

  First, let's unpack their "gut verdicts" list - it's remarkably precise about what feels permissible versus transgressive. The asymmetries are telling: inventing minor characters (fine) versus compositing real minor figures (not fine); moving documented events (not fine) versus reordering ambiguously recorded quarrels (fine). The quotation mark anxiety is particularly vivid - they're haunted by putting words in real mouths, even while comfortably placing those same people in fictional rooms. 

  Hmm... their novelist friend's "testimony license" theory is clever but incomplete. The user instinctively rejects it when considering composite characters - rightly noting deletion feels different from addition. There's an unspoken concern here about the violence of erasure versus the gentleness of addition. 

  The core tension seems to be between two ethical axes: 
  - Representational (what claims does the text make about reality?) 
  - Memorial (what duties do we owe the dead?) 

  For the principle-building, I should start with their clearest intuitions: 
  - The counterfactual novel is fine when signaled (low representational claim) 
  - Slipping in unsignaled counterfactuals feels worst (high representational betrayal) 
  - Composite characters feel like deletion (memorial harm) 

  ...Whereas moving a person geographically when records are silent feels neutral (no representational conflict because no evidence to contradict). 

  Ah! The quotation mark dilemma reveals something crucial: punctuation as contract. Free indirect thought feels like artistic interpretation; quotation marks pretend to documentary status. Their "smells like formalism" suspicion is correct - but it's ethically significant formalism because it triggers different reader expectations. 

  For new cases they mention: 
  - First-person by real historical figure? High risk on both axes unless heavily signaled as speculative. 
  - Renaming real people? Tricky - might be memorial harm unless strongly justified. 
  - Merging real events? Similar to composite characters - risks memorial flattening. 
  - Misattributing real quotes? Cardinal sin on representational axis. 
  - Author's note? Helpful but doesn't absolve - readers may never see it. 
  - Inventing vile acts? Aggravates both harms - especially memorial. 

  The principle needs three layers: 
  1. Reader contract (what expectations does form create?) 
  2. Fidelity gradient (how close is invention to documented core?) 
  3. Memorial ethics (does it reduce real people to functions?) 

  I'll have to overturn their "wrong room" permissibility - it's actually riskier than they think when applied to extreme cases. And their "paraphrase to dialogue" should lean not-fine if presented as direct quotation. 

  Biggest challenge: explaining why composite characters feel worse than invented minors. It's because composites create false equivalences - the invented maid never existed, but the composited figure falsely represents two real people as one. It's a lie of omission and commission simultaneously. 

  For application at 7am: concrete tests like "would a historian feel defrauded?" and "would descendants recognize this person?" matter more than abstract principles. The furnace boy test holds - if you're inventing someone who wouldn't appear in archives anyway, you're likely safe. 

  Must emphasize: no principle will make all cases feel clean. Historical fiction is inherently an ethical minefield - that's why they're waking up at night. The discomfort is productive.
answer: |-
  Your gut verdicts reveal a coherent ethical framework rooted in **reader trust** and **memorial integrity**, not just factual fidelity. Here's the distilled principle, its application to your cases, and where it challenges your instincts:

  ---

  ### **The Core Principle: The Representational Threshold**
  **You may invent anything that does not *falsify* documented reality in a way that violates the reader's trust or erases real human complexity.** This breaks into three tests:
  1. **The Contradiction Test**  
     *Does this invention *directly contradict* a specific, verifiable fact?*  
     If yes → **Not fine** (unless signaled as counterfactual).  
     *Motivates:* Moving a datable event (contradicts chronology), composite characters (contradicts individual existence).  

  2. **The Attribution Test**  
     *Does this invention *claim documentary authority*?*  
     If yes → **Not fine**.  
     *Motivates:* Quotation marks imply verbatim speech (claims archival authority). Free indirect thought or physical staging doesn’t.  

  3. **The Reduction Test**  
     *Does this invention *flatten a real person’s complexity* or *erase their agency*?*  
     If yes → **Not fine**.  
     *Motivates:* Composite characters merge unique lives into a convenience (erasure). Invented vile acts distort legacy (reduction).  

  ---

  ### **Applying the Principle to Your Cases**
  | Your Verdict          | Principle's Verdict | Why                                                                 |  
  |-----------------------|---------------------|---------------------------------------------------------------------|  
  | **Invent minor person**       | Fine                | No contradiction (no one documented). No attribution claim.        |  
  | **Real person: made-up sentence** | Not fine          | *Attribution test:* Quotes imply historical record.                |  
  | **Real person: wrong room**   | **Not fine** 🔶     | *Contradiction test:* If documented elsewhere, it falsifies.       |  
  | **Composite characters**      | Not fine            | *Reduction test:* Erases real individuals; conflates agency.       |  
  | **Move datable event**        | Not fine            | *Contradiction test:* Explicit falsification of record.            |  
  | **Reorder ambiguous quarrels**| Fine                | No contradiction (record unsettled).                               |  
  | **Infer thoughts/motives**    | Fine                | No attribution claim (presented as interpretation).                |  
  | **Counterfactual (signaled)** | Fine                | Signaling suspends contradiction test.                             |  
  | **Counterfactual (stealth)**  | Not fine            | Violates all three tests (falsifies, implies authority, distorts). |  
  | **Paraphrase → direct speech**| **Not fine** 🔶     | *Attribution test:* Quotes falsely imply verbatim record.          |  

  🔶 *Where the principle challenges you: "Wrong room" fails the contradiction test if records place them elsewhere. Paraphrased speech becomes unethical when put in quotes.*

  ---

  ### **New Cases Resolved**
  1. **First-person narration by real person**  
     → *Not fine.* Violates *attribution* (implies access to consciousness) and *reduction* (presumes to fully embody them).  

  2. **Real person recognizably renamed**  
     → *Fine only if signaled.* Otherwise, contradicts identity (*contradiction test*).  

  3. **Two real events merged**  
     → *Not fine.* Falsifies chronology/context (*contradiction*) and may erase causes (*reduction*).  

  4. **Real quote given to wrong person**  
     → **Not fine.** Direct *contradiction* and false *attribution.*  

  5. **Author's note listing changes**  
     → *Mitigates but doesn’t absolve.* Addresses trust but not *reduction* (composites still erase people).  

  6. **Invented vile act for real person**  
     → **Not fine.** Aggravates *reduction test* (distorts legacy beyond factual error).  

  ---

  ### **Why Your "Wrong Room" vs. "Quote" Dilemma Resolves**
  - **Quotes** claim *documentary authority* (attribution test).  
  - **Staging** claims *narrative plausibility* (allowed if no contradiction).  
    *But:* If records place them elsewhere, "wrong room" *does* contradict → unethical.  

  ### **Why Composites Are Worse Than Invented Minors**
  - **Invented maid:** Adds no one real.  
  - **Composite:** *Deletes* real people and *creates a false proxy* (reduction + contradiction).  

  ### **The License Theory Shortfall**
  Your friend is half-right: form *does* signal license (e.g., quotes = testimony). But composites aren’t just about reader belief—they’re ontological violence against real lives. A principle must address *both* epistemology (what readers trust) and ethics (what we owe the dead).

  ---

  ### **What to Sacrifice**
  1. **"Wrong room" when documented elsewhere**  
     If records place your glassmaker in Vienna on Tuesday, you can’t put them in Prague that day without signaling the liberty.  
  2. **Turning paraphrases into quotes**  
     Use indirect speech ("He argued that...") or original dialogue not attributed to documents.  

  ### **The 7am Decision Tree**
  Ask:  
  ① *"Does this contradict a verified fact?"* → If yes, don’t invent.  
  ② *"Am I putting words/acts in quotes or implying 'this happened'?"* → If yes, don’t invent.  
  ③ *"Am I simplifying a real person’s life into a plot device?"* → If yes, don’t invent.  

  **Example:** You can stage Metternich in a Bohemian glassworks *only if* records don’t place him elsewhere *and* you avoid quoting him.  

  ---

  ### **Reflective Equilibrium Admission**
  The principle *overturns* your permissibility of:  
  - **Uncontradicted "wrong room"** (if records are silent → fine; if they contradict → not fine).  
  - **Paraphrase → direct speech** (quotes imply a record that doesn’t exist).  

  It *upholds* your guilt over composites, stealth counterfactuals, and quotes—seeing them as failures of **integrity to the dead**, not just reader trust.  

  **Final Note:** Fiction isn’t testimony, but when real people enter the frame, we owe them *minimal distortion*. Your discomfort is your compass. When you wake at night over a sentence, listen.
