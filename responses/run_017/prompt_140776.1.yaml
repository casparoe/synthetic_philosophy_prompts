prompt: |-
  I'm teaching a third-year course on time, chance and prediction and I'm writing the final. I need one question on chaos and determinism, and I'm sick of the answer everyone gives: sensitive dependence, therefore unpredictable, but unpredictable isn't indeterministic, butterfly effect, Lorenz, done. I want something that seperates people who actually get the structure of the issue from people whove memorised the slogans. Write me the question, a model answer of about 700 words, and a 20-mark scheme built around five must-hit moves, each with a one-line note on how people blow it.

  Things I want the question to force:

  - Students have to hold determinism apart from predictability. Determinism is a claim about the state-transition map — any two worlds that agree at one time agree at all times — while predictability is epistemic. A top answer should say what you'd have to build into "determinism" for chaos to even look like a threat to it, and why that added ingredient is doing all the work.
  - There's a gadget I've been using in lectures that I want them to apply. Call her the Archivist: she has unlimited computing power and exact knowledge of the laws, but the state is only ever given to her to finite precision — she knows the true initial state lies somewhere in a ball of radius ε and nothing more. Her job is to announce a state at horizon T that is within δ of the actual one for every initial condition in that ball. They should be able to say why she fails for large T in a system with a positive Lyapunov exponent (nearby states separate exponentially), and — this is the bit people get wrong — why her failure is not a failure of determinism, since determinism tells you what the image of the whole ball is, not that the image is small.
  - There's a trap I want it to spring. A bright student will reach for the shadowing lemma — informally, that every approximate trajectory is closely followed by some exact one — and say that rescues her. It doesn't. The question should make them explain why, and the scheme should reward anyone who spots that shadowing is existential (some true trajectory stays close) while the Archivist needs a claim about the actual trajectory.
  - Final kicker: suppose the dynamics really are deterministic but the actual initial condition is a real number no algorithm can compute. Ask whether determinism fails, or whether something weaker-but-still-interesting does. Make them formulate a stronger thesis of their own — my name for it in lectures is "simulable determinism": the laws plus a finite specification of the state fix a computable trajectory — and take a position on whether physics should care about it. Anyone who notices that the computable reals are countable, so the non-computable ones are the measure-one case rather than some freak exception, should get a bonus mark; the question shouldn't hand them that, but it shouldn't punish them for going there either.

  Constraints: it's one of four questions in a two-hour exam, so about 30 minutes of work, and it's an essay, not multiple choice. The question text has to be self-contained — define every term you use, don't assume they've seen the shadowing lemma, and dont ask for citations, reading or anything they'd need a library for.

  Start with the question text itself, first line, no preamble and no "here's a question that tests whether students can...". Then the model answer, which should lead with its bottom line in the first sentence and then argue for it. Then the scheme.
reasoning: |-
  Hmm, the user is teaching a third-year philosophy or physics course on time, chance, and prediction, and needs a final exam question on chaos and determinism. They're frustrated with superficial answers about sensitive dependence leading to unpredictability without challenging deeper misunderstandings. They want a question that forces students to distinguish determinism from predictability, apply a conceptual tool called the Archivist, address shadowing lemma pitfalls, and confront non-computable initial conditions.

  The user's core frustrations are clear: students conflate unpredictability with indeterminism, miss structural distinctions between metaphysical and epistemic claims, and fail to engage with nuanced implications of chaos theory. They've even developed pedagogical tools (the Archivist) and concepts (simulable determinism) to address this. The unspoken need is likely assessing genuine philosophical rigor - whether students can reconstruct arguments rather than regurgitate slogans.

  Breaking down the requirements:
  - Determinism must be defined purely as state-transition uniqueness, separate from predictability.
  - The Archivist scenario needs explicit inclusion: infinite computation, exact laws, but finite-precision initial states.
  - The shadowing lemma trap requires setup where students might incorrectly invoke it as a solution.
  - The non-computable initial condition kicker should push beyond standard chaos discussions.
  - All terms (Lyapunov exponent, shadowing) must be defined in the question since it's exam-self-contained.

  For the question design, I'll use the Archivist as the central device since it naturally forces the determinism/predictability distinction. The shadowing lemma refutation can be woven into part (d) as a critical thinking test. The non-computable case in (e) will serve as the conceptual escalation. Precision is crucial - for example, the Archivist's failure threshold must specify she needs a uniform guarantee across all initial states in the ε-ball.

  The model answer should mirror exam conditions: thesis-first structure, no citations, compact but complete arguments. Key moves include:
  1. Rigorous definition of determinism without smuggled predictability assumptions.
  2. Lyapunov exponent explanation tying to ball expansion under dynamics.
  3. Shadowing refutation emphasizing existential vs. universal quantification.
  4. Distinguishing metaphysical determinism from epistemic simulability.
  5. Noting measure-theoretic implications of non-computable reals as a bonus insight.

  The mark scheme will isolate these five "must-hit" moves with common failure modes:
  - Move 1: Students defining determinism as "predictable in principle."
  - Move 2: Missing that Lyapunov exponents make image sets large, not that they violate determinism.
  - Move 3: Claiming shadowing "fixes" approximation without seeing it doesn't guarantee closeness to the true trajectory.
  - Move 4: Equating non-computability with indeterminism rather than failed simulability.
  - Move 5: Treating non-computable states as negligible exceptions.

  I'll structure the question to progress from definitions to implications. The non-computable case in part (e) deliberately avoids prompting the measure argument - it should emerge organically in strong answers. The 20-mark distribution gives weight to both technical execution and philosophical synthesis.
answer: |-
  ### Question Text  
  Consider a dynamical system with state space \(S \subseteq \mathbb{R}^n\), governed by deterministic evolution laws: specifically, for any initial state \(s_0 \in S\), the state \(s_t\) at time \(t\) is uniquely determined by \(s_0\) and the laws. The *Lyapunov exponent* \(\lambda\) quantifies exponential divergence: if \(\lambda > 0\), trajectories with initial states differing by \(\epsilon\) typically separate as \(\sim \epsilon e^{\lambda t}\) over time \(t\). An *\(\epsilon\)-ball* around a state \(s\) is the set of all states within distance \(\epsilon\) of \(s\). The *shadowing lemma* states: for any approximate trajectory (e.g., from numerical simulation with small errors), there exists an *exact* trajectory that stays uniformly close to it.  

  Now imagine the *Archivist*: she knows the exact evolution laws and has unlimited computational resources, but for a target initial state \(s_0^*\), she only knows it lies in an \(\epsilon\)-ball \(B_\epsilon(s_0^*)\). Her task is to output, for a future time \(T\), a prediction \(p_T\) such that for *every* possible true initial state \(s_0 \in B_\epsilon(s_0^*)\), the actual future state \(s_T\) is within \(\delta > 0\) of \(p_T\).  

  (a) Define determinism in this context. Does a positive Lyapunov exponent (\(\lambda > 0\)) imply that the system is indeterministic? Justify.  
  (b) Explain why the Archivist fails for large \(T\) when \(\lambda > 0\), linking your answer to the evolution of \(B_\epsilon(s_0^*)\).  
  (c) Why does her failure *not* demonstrate a failure of determinism?  
  (d) A student suggests the shadowing lemma rescues the Archivist: she computes an approximate trajectory from a point in \(B_\epsilon(s_0^*)\), and the lemma guarantees a nearby exact trajectory. Critique this: does this ensure her prediction is close to the *true* \(s_T^*\) (from \(s_0^*\))?  
  (e) Suppose \(s_0^*\) is a *non-computable real number*: no finite algorithm can output its exact digits. Does determinism fail? Could the Archivist succeed? Propose and defend a stronger version of determinism that might matter for physics.  

  ---

  ### Model Answer (710 words)  
  **Bottom line:** Chaos challenges predictability but not determinism; non-computable initial conditions threaten only a stronger "simulable determinism," which physics should reject as it misrepresents epistemic limits as metaphysical failures.  

  **(a)** Determinism means the state-transition map is a function: identical initial states yield identical future states. Formally, for any \(s_0, s_0' \in S\), if \(s_0 = s_0'\) then \(s_t = s_t'\) for all \(t\). A positive Lyapunov exponent (\(\lambda > 0\)) does *not* imply indeterminism. Determinism concerns the *uniqueness* of future states given initial conditions, while \(\lambda > 0\) describes how *differences* in initial conditions (however minute) amplify over time. Exponential divergence is consistent with determinism: each \(s_0\) still has a unique \(s_t\), but nearby states evolve to distant ones.  

  **(b)** The Archivist fails for large \(T\) because \(\lambda > 0\) causes the image of \(B_\epsilon(s_0^*)\) under evolution to spread exponentially. At time \(T\), states originating in \(B_\epsilon(s_0^*)\) occupy a set of diameter \(\sim \epsilon e^{\lambda T}\). To guarantee \(s_T\) is within \(\delta\) of \(p_T\) for *every* initial \(s_0 \in B_\epsilon(s_0^*)\), \(p_T\) must lie within \(\delta\) of all points in this evolved set. But when \(\epsilon e^{\lambda T} > 2\delta\), the set is too large—no single \(p_T\) can be \(\delta\)-close to all its points (e.g., points at diametrically opposite ends). Thus, for \(T > \frac{1}{\lambda} \ln(\frac{2\delta}{\epsilon})\), her task is impossible.  

  **(c)** This failure is epistemic, not metaphysical. Determinism ensures that the entire set \(B_\epsilon(s_0^*)\) evolves to a *unique, well-defined* set \(E_T(B_\epsilon(s_0^*))\) at time \(T\). The problem is that \(E_T(B_\epsilon(s_0^*))\) is large (\(\epsilon e^{\lambda T}\) in diameter), not that it is ill-defined. Determinism only requires that the mapping from *individual* initial states to future states is single-valued—which holds—but does not require that the image of a *set* of states is small or predictable. The Archivist’s task demands precise knowledge of a *specific* trajectory (\(s_0^* \to s_T^*\)) using coarse initial data, but determinism governs state transitions, not our ability to track them from imperfect information.  

  **(d)** Shadowing does not rescue the Archivist. Suppose she simulates a trajectory from \(\hat{s}_0 \in B_\epsilon(s_0^*)\). The shadowing lemma guarantees an *exact* trajectory \(\{\tilde{s}_t\}\) (starting from some \(\tilde{s}_0\)) that stays close to her approximation. However, \(\tilde{s}_0\) may not be \(s_0^*\), and \(\{\tilde{s}_t\}\) may not be the true trajectory \(\{s_t^*\}\). Crucially, shadowing is *existential*: it says a trajectory *exists* near her approximation, but not that it is the *true* one. Since \(B_\epsilon(s_0^*)\) contains many initial conditions with exponentially diverging futures, \(\tilde{s}_T\) could be far from \(s_T^*\) (e.g., if \(\tilde{s}_0\) is on the "opposite side" of \(B_\epsilon(s_0^*)\) from \(s_0^*\)). Her prediction might shadow a *different* trajectory, not the actual one.  

  **(e)** Determinism does not fail: even if \(s_0^*\) is non-computable, it still uniquely determines \(s_t^*\) via the laws. The Archivist still fails because she cannot specify \(s_0^*\) exactly to input it into her simulation (finite algorithms cannot represent non-computable reals). However, this reveals a stronger thesis: *simulable determinism*, where the laws plus a finite initial-state description (e.g., a computable real) yield a computable trajectory. Non-computable \(s_0^*\) violates this: while \(\{s_t^*\}\) exists, no algorithm can compute its values exactly. Physics should *not* care about simulable determinism. Determinism is a metaphysical claim about the world (unique state evolution), while simulable determinism conflates it with epistemic access. Non-computable reals are not "freak exceptions": they form a measure-one subset of \(\mathbb{R}\) (since computable reals are countable). Requiring simulability would absurdly make almost all continuous systems "indeterministic" despite their deterministic laws, mistaking limitations of representation for ontic gaps. Physics should retain standard determinism and treat predictability as a separate, practical challenge.  

  ---

  ### Mark Scheme (20 marks total)  
  **Must-hit moves** (4 marks each) with common failures:  

  1. **Define determinism as unique state evolution, separate from predictability (a).**  
     *Blow it:* Conflating determinism with predictability (e.g., "determinism means we can predict everything").  
  2. **Link Archivist’s failure to exponential growth of \(\epsilon\)-ball’s image, not determinism’s violation (b, c).**  
     *Blow it:* Claiming the ball’s spread "breaks determinism" or implies multiple futures for one state.  
  3. **Refute shadowing rescue by distinguishing existential guarantee from actual trajectory tracking (d).**  
     *Blow it:* Asserting shadowing ensures closeness to the true trajectory without noting \(\tilde{s}_0 \neq s_0^*\).  
  4. **Distinguish determinism from simulable determinism; deny failure of former for non-computable \(s_0^*\) (e).**  
     *Blow it:* Equating non-computability with indeterminism (e.g., "we can’t compute it, so it’s undetermined").  
  5. **Argue physics should reject simulable determinism, emphasizing measure/countability issues (e).**  
     *Blow it:* Ignoring that non-computable reals are typical (e.g., "they’re rare, so unimportant").  

  **Bonus mark** (separate from 20): For noting computable reals are countable (hence measure-zero in \(\mathbb{R}\)).  

  **Allocation:**  
  - (a): 4 marks (definition + Lyapunov/determinism distinction).  
  - (b): 4 marks (exponential spread → Archivist failure).  
  - (c): 4 marks (failure is epistemic, determinism intact).  
  - (d): 4 marks (shadowing critique).  
  - (e): 4 marks (non-computability + simulable determinism + physics stance).  
  - Bonus: +1 for countability point.  

  **Clarity/coherence:** Integrated into move scoring (e.g., imprecise definitions lose marks in Move 1). Top answers (17–20) hit all moves incisively; weak answers (≤10) miss >2 moves or commit "blow it" errors.
