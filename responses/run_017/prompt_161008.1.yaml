prompt: |-
  I am the managing editor of a mid-sized journal in molecular and cell biology, and I am rewriting the section of our house style guide that deals with what we loosely call 'metaphorical language'. The people who have to enforce it are my copy-editors: they have degrees in biology but no philosophy, they process thirty or forty manuscripts a month, and they have roughly two minutes per flagged sentence before the production schedule slips. They can refer a problem to the handling editor, who has the final say, but in practice they must make the call themselves, and they need a sentence they can paste into an email to an author who has written back furious that we have flattened their prose — last year one such exchange ended up in a blog post accusing us of censorship, which is the sort of thing my editor-in-chief would rather not repeat. Our current rules are pure inherited precedent: we let through 'the genetic code', 'transcription', 'translation', 'reading frame', 'start codon' and 'misreading' without comment; we routinely strike 'the genome is the blueprint of the organism', 'genes for aggression', 'the cell interprets the signal', 'the instruction manual of life'; and we have no principled way of saying why one list is acceptable and the other is not, nor any way of handling the very large number of phrases that sit in between them — 'encodes', 'specifies', 'carries information', 'instructs', 'targets', 'reads out', 'programmes', 'switches on'.

  What I want from you is a decision procedure my copy-editors can actually run, grounded in whatever the philosophy of biology has to say on this that is usable at two minutes per sentence. No literature review, no references, no history of the debate: just the distinctions that have to survive the simplification, and an honest note on which ones can be dropped. The distinctions I think matter are these, though the procedure should correct me if I have mis-described them: (i) the narrow sense in which there is a code at all — a mapping from codons to amino acids that is physically implemented by adaptor molecules rather than settled by convention or by what an interpreter intends — as against the broad sense in which a genome is called a programme, blueprint, recipe or text; (ii) 'information' in the sense of a reduction in uncertainty at a receiver, as against information about the phenotype, i.e. content that is about something and can in principle be wrong about it; (iii) the awkward fact that which content a stretch of sequence bears seems to depend on the machinery present — reading frame, splicing, chemical marks — so that the string on its own may not fix any message at all; (iv) whether anything in the cell occupies the role that would make 'error' and 'misreading' more than a façon de parler, or whether there is only causation with a norm projected onto it by us; (v) the difference between a representation of what is to be built and a trigger or resource that a developing system simply uses. I gather there are live disputes here — some people want content grounded in selection history, others want to treat the whole developmental system rather than the sequence as the unit — and I do not need the procedure to settle those, only to be robust to them. Give me the tests in the order they should be applied, what counts as a pass at each, where the procedure halts with a definite yes or no, and where it must hand the decision back to a person because the question is really one of our editorial policy, or of what the field's usage has already made standard, rather than one of fact. Mark clearly which steps are judgement calls dressed up as tests.

  Then run it, as a copy-editor would, on three sentences from recent submissions: (a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'; (b) 'the genome contains the complete programme for building the organism'; (c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'. For each, tell me what the procedure outputs, what it does to the sentence, and the one-line justification the editor can send the author. I also suspect that at least one of the phrases we currently pass — 'genetic information' is my own worry, but it may be 'the genetic code' — fails the tests you are going to give me; if so, say so plainly and explain why, because I would much rather hear it from you than discover it while defending house style to an author. Finally, tell me what the procedure cannot do: the sentences it must simply leave alone, the cases where it will misfire badly, and the kind of claim it has no purchase on at all.
reasoning: |-
  Hmm, the user is a managing editor of a molecular and cell biology journal who needs help creating a practical decision procedure for evaluating metaphorical language. They need something their copy-editors can apply quickly - about two minutes per sentence - to determine whether certain biological metaphors should be allowed or edited out.

  The user has outlined several key philosophical distinctions they want incorporated:
  - The narrow definition of the genetic code versus broader metaphors like "program" or "blueprint"
  - Shannon information versus semantic information
  - Context-dependence of sequence meaning
  - Whether "error" is just a façon de parler or has biological reality
  - Representation versus causal resource

  The decision procedure needs to be robust despite ongoing philosophical disputes in biology. The copy-editors have biology backgrounds but no philosophy training, and they process 30-40 manuscripts monthly under tight deadlines.

  I need to develop a step-by-step test that:
  1. Can be applied quickly
  2. Has clear pass/fail criteria
  3. Minimizes judgment calls
  4. Explains why certain metaphors are problematic
  5. Handles edge cases by referring to editorial policy

  The procedure should be structured as a flowchart with binary decisions. Metaphors that pass all tests can stay; those that fail get edited out. For ambiguous cases, copy-editors should refer to handling editors.

  I'll then test this procedure on three example sentences:
  (a) "the transcription factor reads out the regulatory information encoded in the enhancer sequence"
  (b) "the genome contains the complete programme for building the organism"
  (c) "methylation marks carry epigenetic information that the cell reads and that specify which genes to express"

  I'll also need to address whether any currently accepted terms (like "genetic information") might actually fail these new criteria, and clearly outline the limitations of this approach.

  For each step in the procedure, I'll indicate which ones are actually judgment calls disguised as tests, and where the procedure must hand off to human judgment. The goal is practicality - this isn't about settling philosophical debates but giving copy-editors defensible editorial guidelines.
answer: |-
  Here's a decision procedure designed for speed, defensibility, and minimal philosophical baggage, prioritizing operational clarity for your copy-editors. It focuses on concrete tests based on established molecular mechanisms and avoids deep philosophical rabbit holes.

  **The Metaphor Evaluation Procedure (MEP) - For Copy-Editors**

  1.  **Test 1: Is it Canonical Molecular Terminology?**
      *   **Pass:** The phrase is universally used as a *direct descriptor of a specific, well-defined molecular mechanism* in textbooks and primary literature (e.g., "transcription," "translation," "genetic code," "reading frame," "start codon," "stop codon," "mutation," "misincorporation").
      *   **Fail:** The phrase describes a *broader concept* or assigns agency/purpose beyond the direct molecular interaction.
      *   **Output:** PASS → **Leave as is.** Justification: "This is standard, unambiguous terminology describing a core molecular process."
      *   **Output:** FAIL → Proceed to Test 2.
      *   **Judgment Call?** Minimal. Relies on established jargon.

  2.  **Test 2: Is it Mechanistically Specific & Context-Dependent?**
      *   **Pass:** The "meaning" or outcome described *absolutely requires* specific, well-characterized cellular machinery *acting directly* on the molecule (e.g., "encodes" [for amino acid sequence via ribosome/tRNAs], "specifies" [a binding site for a specific protein], "carries information" [*only* in the specific context of sequence-dependent templating like replication/transcription/translation]).
      *   **Fail:** The "meaning" is implied to be intrinsic to the molecule alone, independent of the cellular context (e.g., "blueprint," "program," "instruction manual"). Or, the action described lacks a specific, direct molecular mechanism (e.g., "interprets," "reads" [beyond base-pairing/kinetics]).
      *   **Output:** PASS → **Leave as is (but flag if borderline).** Justification: "This phrasing accurately reflects the context-dependent, machinery-mediated nature of the process described."
      *   **Output:** FAIL → Proceed to Test 3.
      *   **Judgment Call?** Low/Medium. Requires understanding if a *direct, specific* molecular mechanism exists for the implied action. "Encodes" for amino acids passes; "encodes" for complex traits fails. "Carries information" passes *only* for templating/replication contexts.

  3.  **Test 3: Does it Attribute Agency, Purpose, or Top-Down Control?**
      *   **Pass:** The phrasing describes molecules/cells as *responding* to physical/chemical cues or *executing* well-defined, localized mechanistic steps without implying intention, understanding, or central command (e.g., "activated," "binds," "recruits," "signals," "regulates," "in response to").
      *   **Fail:** The phrasing attributes cognitive abilities (e.g., "reads," "interprets," "knows," "decides"), implies a pre-determined plan or goal (e.g., "programme," "blueprint," "instructs," "for [complex trait]"), or suggests centralized control (e.g., "master regulator" [unless a specific technical term like in development]).
      *   **Output:** PASS → **Leave as is.** Justification: "This phrasing describes molecular responses and interactions without implying cognitive functions or predetermined purpose."
      *   **Output:** FAIL → **Edit out or replace.** Proceed to Test 4 *only* if considering a specific replacement.
      *   **Judgment Call?** Medium. Distinguishing mechanistic response from implied cognition/purpose. "Reads out" often fails here.

  4.  **Test 4: Is a Simple, Mechanistic Replacement Available? (Optional - Use if FAIL at Test 3 and a fix is obvious)**
      *   **Pass:** A concise, literal phrase accurately describes the mechanism without significant loss of meaning (e.g., "binds to" instead of "recognizes"; "determines the amino acid sequence" instead of "encodes the protein"; "regulates" instead of "controls"; "binds to regulatory elements" instead of "reads out information").
      *   **Fail:** No simple, accurate replacement exists without significantly altering the sentence structure or nuance. The metaphor *is* the standard, albeit imperfect, shorthand.
      *   **Output:** PASS → **Replace with literal phrase.** Justification: "We suggest this phrasing for greater precision in describing the molecular mechanism."
      *   **Output:** FAIL → **Refer to Handling Editor.** Justification: "The phrasing uses common but potentially misleading metaphorical language. The Handling Editor will assess if it's essential for clarity in this specific context." OR **Leave with caution** (if very common borderline case - see Limitations).
      *   **Judgment Call?** High. Requires finding a *good* replacement that doesn't sound awkward or lose necessary nuance.

  **Where it Halts:**
  *   PASS at Test 1 or Test 2: Leave as is.
  *   PASS at Test 4: Replace.
  *   FAIL at Test 3 and no good replacement (FAIL at Test 4): Refer to Handling Editor (or use extreme caution with very common borderline terms).

  **Applying the MEP to Your Examples:**

  **(a) 'the transcription factor reads out the regulatory information encoded in the enhancer sequence'**
  1.  **Test 1:** "Transcription factor", "enhancer sequence" pass. "Reads out", "regulatory information", "encoded" are not canonical *mechanistic* terms like "transcription". **FAIL Test 1 → Test 2.**
  2.  **Test 2:**
      *   "Encoded": Does it mean "contains binding sites for"? If yes, PASS (mechanistically specific & context-dependent: the sequence + TF binding domain). BUT...
      *   "Reads out": Implies interpretation/extraction beyond simple binding kinetics. Is there a *specific* mechanism for "reading out" distinct from binding? Usually not. **FAIL Test 2 → Test 3.**
      *   "Regulatory information": In the context of *binding sites*, "information" passes Test 2 (specific templating for binding). But coupled with "reads out", it pushes towards FAIL.
  3.  **Test 3:** "Reads out" strongly attributes cognitive action (reading/interpretation). **FAIL Test 3.**
  4.  **Test 4:** Simple replacement? "The transcription factor **binds to specific sites within** the enhancer sequence." Yes. **PASS Test 4.**
  *   **Procedure Output:** **EDIT.** Replace with: "the transcription factor binds to specific sites within the enhancer sequence."
  *   **Justification to Author:** "We suggest this phrasing for greater precision in describing the direct molecular interaction (binding) rather than implying a cognitive process ('reads out'). The term 'encoded' is acceptable as shorthand for 'contains the sequence pattern determining binding specificity'."

  **(b) 'the genome contains the complete programme for building the organism'**
  1.  **Test 1:** "Genome" passes. "Complete programme" does not. **FAIL Test 1 → Test 2.**
  2.  **Test 2:** "Programme" implies a pre-determined, self-contained set of instructions that *intrinsically* specifies the outcome. The genome is necessary but *not sufficient*; development requires the cellular machinery, environment, and dynamic interactions. The meaning is not mechanistically specific or context-dependent *in this broad sense*. **FAIL Test 2 → Test 3.**
  3.  **Test 3:** "Programme" explicitly attributes top-down control, a predetermined plan, and purpose ("for building"). **FAIL Test 3.**
  4.  **Test 4:** Simple replacement? "The genome contains the **complete set of genes and regulatory sequences necessary for** building the organism." (More accurate: "contributing to" or "required for" is better than "for", but "necessary for" is common compromise). **PASS Test 4.**
  *   **Procedure Output:** **EDIT.** Replace with: "the genome contains the complete set of genes and regulatory sequences necessary for the development of the organism."
  *   **Justification to Author:** "We avoid the term 'programme' as it implies a level of pre-determination and centralized control not supported by the context-dependent, interactive nature of development. This phrasing more accurately reflects the genome's role as a necessary set of templates and binding sites."

  **(c) 'methylation marks carry epigenetic information that the cell reads and that specify which genes to express'**
  1.  **Test 1:** "Methylation marks", "genes" pass. "Carry epigenetic information", "reads", "specify" do not pass as canonical mechanistic terms. **FAIL Test 1 → Test 2.**
  2.  **Test 2:**
      *   "Carry epigenetic information": Does "information" refer to a *specific, direct templating or recruitment mechanism*? Methylation marks recruit reader proteins/complexes that alter chromatin state. This is borderline. "Carry" might pass if interpreted as "possess a chemical modification that serves as a binding site/recruitment signal".
      *   "The cell reads": "The cell" is far too vague. *Specific proteins* (readers) bind to the marks. Attributing "reading" to the whole cell fails mechanistically. **FAIL Test 2 → Test 3.**
      *   "Specify which genes to express": Methylation marks *influence* expression probabilistically via recruitment, they don't "specify" it deterministically like a codon specifies an amino acid. **FAIL Test 2 overall.**
  3.  **Test 3:** "The cell reads" attributes cognitive agency to the cell. "Specify" implies precise instruction rather than influence. **FAIL Test 3.**
  4.  **Test 4:** Simple replacement? "Methylation marks **serve as binding sites for protein complexes that influence chromatin state and thereby help regulate** gene expression." Yes. **PASS Test 4.**
  *   **Procedure Output:** **EDIT.** Replace with: "methylation marks serve as binding sites for protein complexes that influence chromatin state and thereby help regulate gene expression."
  *   **Justification to Author:** "We avoid terms like 'reads' and 'specify' as they attribute cognitive functions to the cell or imply deterministic control. This revised phrasing focuses on the direct molecular mechanism: methylation marks acting as binding sites for effector complexes that modulate chromatin accessibility."

  **Your Suspicions: "Genetic Information"**
  *   **Does it fail?** **Yes, often, but context is critical.** It *passes* **Test 2 ONLY** in the *very specific context* of DNA sequence acting as a template for replication or transcription (Shannon information: the sequence reduces uncertainty about the daughter strand or mRNA sequence). This is its strongest, least metaphorical use.
  *   **Why it usually fails MEP in broader use:**
      *   **Test 2:** When used to mean "information *about* the phenotype" or "developmental instructions," it fails. The sequence alone, without the cellular machinery and context, does not "specify" the phenotype. The meaning isn't fixed intrinsincally.
      *   **Test 3:** When used broadly, it inevitably carries connotations of "aboutness" and semantic content that implies a sender/receiver or intentional design, projecting meaning onto causation.
  *   **Recommendation:** Be *highly* cautious. Allow it only in templating contexts ("the genetic information *is replicated* faithfully"). Routinely edit it out in broader contexts ("genetic information for disease susceptibility") and replace with "genetic variants associated with", "sequence differences contributing to", or simply "genetic factors". **It should often be flagged by Test 2 and fail Test 3.**

  **What the Procedure CANNOT Do (Limitations):**

  1.  **Settle Philosophical Disputes:** It sidesteps grounding content in selection history vs. developmental systems. It uses operational definitions based on mechanism and avoids strong metaphysical claims.
  2.  **Handle Perfectly Standard (but Metaphorical) Shorthand:** Terms like "signal," "pathway," "cascade," "sensor," "receptor," "transmitter," "feedback," "code" (beyond codons, e.g., "histone code") are deeply entrenched and often pass Test 1 or are reluctantly accepted as borderline passes at Test 2/Test 4 FAIL. The MEP might flag them, but editors will often let them stand due to ubiquity. This is a policy call.
  3.  **Deal with Nuance in "Error":** "Misincorporation" (Test 1 PASS) is fine. "Error" in replication/translation is borderline but usually passes Test 2 (mechanism exists to "correct" it - proofreading/mismatch repair) and is ubiquitous. "Error" in a broader sense (e.g., "evolutionary error") fails. The MEP struggles slightly here but generally lets "error" in core templating processes pass due to ubiquity (Test 1 borderline pass).
  4.  **Evaluate Necessary Hyperbole in Intro/Discussion:** Sometimes a broad metaphor *is* rhetorically useful for framing. The MEP will flag it. This **must** go to the Handling Editor (Test 4 FAIL outcome). The procedure is strict on the science; the editor makes the style/pragmatics call.
  5.  **Parse Highly Abstract or Theoretical Claims:** Sentences deeply embedded in complex theories (e.g., about information integration, semiotic biology, or major evolutionary transitions) may use terms in highly specific ways the MEP isn't designed for. These will likely hit Test 4 FAIL and require editor referral.
  6.  **Distinguish "Encodes" for Amino Acids vs. Proteins:** "Encodes" for the amino acid sequence specified by a CDS passes Test 2. "Encodes" for the functional protein fails (folding, modification, etc., are separate processes). The MEP *can* make this distinction via Test 2.
  7.  **Be Perfectly Consistent:** Borderline cases exist ('regulatory code', 'signal integration'). The goal is defensible consistency, not perfection. Judgment calls at Test 2 and Test 4 are inevitable.

  **Key Takeaway for Copy-Editors:** Focus on **direct molecular mechanism** and **avoid cognitive attribution/purpose**. If the phrase describes *what molecules physically do to each other* in a well-defined way, it's likely OK. If it describes *what it means* or implies *agency/intent*, it likely needs editing. "Genetic information" is your biggest semantic landmine – restrict its use ruthlessly. This procedure gives you concrete reasons ("implies cognitive function," "lacks specific molecular mechanism," "projects purpose") to defend edits against accusations of flattening prose or censorship.
