  The most challenging part will be ensuring the tree reflects how these philosophical positions actually collide in practice. For example, the granularity question (iv) about systems/subjects directly challenges the species-level framing many students instinctively use. And the "aggregation problem" for welfare interventions needs to connect logically to each leaf's position on subjecthood - whether consciousness can be summed across individuals matters tremendously for calculating suffering. 

  I should begin by mapping the logical space. The user's five axes can generate 32 potential combinations, but many will be contradictory or unoccupied. For instance: 
  - If someone thinks consciousness requires human-like reportability (i), they'd likely reject degrees of consciousness (iii) or subsystem eligibility (iv) 
  - Lineage-based views (ii) might conflict with functional organization approaches when considering edge cases like AI 
  - The "protected class" stance (v) creates tension with consistency requirements 

  For diagnostic cases, I'll invent hypotheticals that isolate specific questions: 
