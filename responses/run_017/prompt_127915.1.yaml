answer: |-
  Here is a decision tree structured around the core philosophical disagreements you identified, designed to guide students from basic commitments to distinct positions on the distribution of consciousness. It uses invented diagnostic cases and avoids named theories as branch points. Unoccupied positions and collisions are noted.

  ---

  **Decision Tree: What is Conscious, and How Much/Many?**

  **Start:** We observe creatures that cannot verbally report subjective experiences.

  **(1) Are behavioral markers (e.g., pain avoidance, learning flexibility) constitutive of consciousness itself, or merely evidence for an underlying state?**
  *   **Diagnostic Case:** *Silent Sufferer:* An animal (e.g., a lizard) exhibits complex, integrated pain-avoidance behaviors (wound guarding, learned avoidance of pain-associated locations, trade-offs with other motivations) but lacks vocalizations or human-like neural correlates.
      *   **A: Constitutive:** Behavior meeting certain criteria *is* consciousness manifest. If it acts consciously, it is conscious. → Go to (2)
      *   **B: Merely Evidential:** Behavior is a fallible signal. True consciousness could be absent despite behavior, or present without obvious signals. Consciousness is a private state. → Go to (3)

  **(2) [From A] What confers the status of being a conscious subject?**
  *   **Diagnostic Case:** *Mimic Bot:* A machine (or alien) perfectly replicates the functional organization and behavior of a conscious animal (e.g., a dog), but is not biologically related.
      *   **A: Functional Organization:** Possessing the relevant cognitive/functional architecture is necessary and sufficient (e.g., specific types of information integration, goal-directedness). Lineage is irrelevant. → Leaf 1: **Functionalist Realism**
      *   **B: Biological Lineage:** Only entities sharing a specific evolutionary history (e.g., possessing homologs of vertebrate/mammalian neural structures) can be conscious. Function alone is insufficient. → Leaf 2: **Biological Ethology**

  **(3) [From B] How do we bridge the "explanatory gap" for unreporting entities?**
  *   **Diagnostic Case:** *Simple Sensorium:* An animal (e.g., a jellyfish) with a diffuse nerve net exhibits basic sensory responses (withdrawal from noxious stimuli, orienting towards light/food) but no complex learning or integrated behavior beyond reflexes.
      *   **A: Inference to Best Explanation:** Consciousness is the best explanation for certain sophisticated functions (e.g., flexible learning, attention, endogenous control) observed in some creatures. Absent these functions, consciousness is unlikely. → Go to (4)
      *   **B: Structural/Mechanistic Identity:** Consciousness arises from specific, identifiable neural/physical structures or processes (e.g., recurrent processing, global workspace). Presence/Absence of these structures determines consciousness. → Go to (5)

  **(4) [From 3A] What level of functional sophistication implies consciousness?**
  *   **Diagnostic Case:** *Learner vs. Reflex:* Compare an insect showing rapid, flexible associative learning in novel contexts (e.g., a wasp) vs. one exhibiting only fixed action patterns triggered by stimuli (e.g., a simpler beetle).
      *   **A: Threshold:** A specific set of cognitive capacities (e.g., episodic-like memory, future planning, metacognition) marks a clear transition to consciousness. → Leaf 3: **Cognitive Thresholdism**
      *   **B: Gradual Emergence:** Consciousness emerges gradually as functional capacities (e.g., sensory integration, behavioral flexibility) increase in complexity. → Leaf 4: **Gradualist Emergentism**

  **(5) [From 3B] What defines the relevant neural/physical structures?**
  *   **Diagnostic Case:** *Vertebrate Homolog:* A reptile possesses structures anatomically homologous to key mammalian consciousness-related areas (e.g., pallium analogous to cortex). An insect has functionally similar but evolutionarily distinct structures (e.g., mushroom bodies).
      *   **A: Lineage-Specific Mechanisms:** Consciousness depends on specific, evolved biological mechanisms found only in certain lineages (e.g., vertebrate/mammalian neuroanatomy). → Leaf 5: **Neurobiological Lineage Essentialism**
      *   **B: Structure-Function Convergence:** Consciousness arises from any physical system realizing the necessary functional/computational properties, regardless of biological origin. → Leaf 6: **Computational Convergence**

  **(6) [From all paths except Leaf 2 & 5] Does consciousness come in degrees?**
  *   **Diagnostic Case:** *Mouse vs. Monkey:* Compare a mouse performing complex navigation and social learning with a macaque exhibiting richer planning, self-recognition, and symbolic communication.
      *   **A: All-or-Nothing:** An entity is either conscious or not. Differences are in cognitive *content*, not the *presence* of subjective experience itself. → Go to (7)
      *   **B: Scalar:** The *intensity*, *richness*, or *unity* of conscious experience varies along a continuum based on neural complexity or functional capacity. → Leaf 7: **Scalar Phenomenology**

  **(7) [From 6A] What is the fundamental unit/subject of consciousness? (Granularity)**
  *   **Diagnostic Case 1:** *Split-Brain Human:* A person whose corpus callosum is severed, leading to potential independent processing/response in each hemisphere.
      *   **Diagnostic Case 2:** *Colonial Mind:* A siphonophore (e.g., Portuguese Man O' War) – a colony of genetically identical zooids acting as a single, integrated organism with distributed functions.
      *   **A: Whole Organism:** Consciousness requires integration into a single biological individual. Subsystems are not subjects; colonies are one subject unless demonstrably fragmented. → Go to (8)
      *   **B: System-Based:** Consciousness can arise in integrated subsystems (e.g., a brain hemisphere) or super-systems (e.g., tightly coupled social groups, integrated colonies) if they meet the criteria. → Leaf 8: **System Subjecthood**

  **(8) [From 7A] How do we handle cognitively impaired humans?**
  *   **Diagnostic Case:** *Severely Impaired Infant:* A human newborn or individual with profound congenital cognitive impairment lacking capacities found in many adult mammals.
      *   **A: Same Criterion:** Apply the same functional/structural criterion used for non-humans consistently. Impaired humans may lack consciousness if they lack the required basis. → Leaf 9: **Consistent Criterialism**
      *   **B: Protected Class:** Humans constitute a special case. Any human, regardless of impairment, is conscious due to species membership or moral status. → Leaf 10: **Human Exceptionalism**

  **(9) [From 6B/Leaf 7] Can degrees of consciousness be summed across distinct subjects?**
  *   **Diagnostic Case:** *Hive vs. Vertebrate:* Compare the summed neural complexity/functional output of an entire honeybee hive (~50,000 bees) to that of a single vertebrate (e.g., a fish).
      *   **A: Non-Summable:** Degrees of consciousness belong intrinsically to individual subjects. Hive complexity doesn't equate to a single super-subject's intense consciousness. → Leaf 11: **Individual-Scalar**
      *   **B: Summable:** Consciousness "units" can be aggregated. A highly integrated collective or numerous simple subjects can hold comparable total "consciousness" to fewer complex ones. → Leaf 12: **Aggregative Utilitarianism (Consciousness)**

  **Unoccupied Branch:** The path demanding *both* Biological Lineage *and* System Subjecthood (B from 2B + B from 7) is **unattractive/unexplored**. Lineage essentialists typically anchor consciousness to whole organisms within the lineage, resisting subsystem/super-system subjects.

  ---

  **Leaves & Key Commitments / Welfare Aggregation Note:**

  1.  **Functionalist Realism:** Consciousness = specific functional organization. *Awkward:* A perfect AI dog replica is conscious; a brain-damaged human lacking that function is not. *Welfare:* Prioritize functional equivalence. Summing requires identifying functionally conscious units.
  2.  **Biological Ethology:** Consciousness requires specific evolved lineage. *Awkward:* The Mimic Bot is *not* conscious, no matter how functional. *Welfare:* Focus on phylogenetically close species. Summing irrelevant if non-lineage entities aren't conscious.
  3.  **Cognitive Thresholdism:** Consciousness requires specific high-level cognition. *Awkward:* Animals lacking "episodic memory" (e.g., many invertebrates) are unconscious zombies despite complex behavior. *Welfare:* Binary allocation. No summing of degrees.
  4.  **Gradualist Emergentism:** Consciousness emerges gradually with functional complexity. *Awkward:* Defining the zero-point and comparing radically different minds. *Welfare:* Prioritize based on estimated complexity. Summing across individuals is meaningful but methodologically fraught.
  5.  **Neurobiological Lineage Essentialism:** Consciousness requires specific biological hardware (e.g., vertebrate pallium). *Awkward:* Insects/cephalopods with high intelligence but alien neurobiology are unconscious. *Welfare:* Focus on neuroanatomically similar species. Summing irrelevant outside lineage.
  6.  **Computational Convergence:** Consciousness arises from specific computation, regardless of substrate. *Awkward:* Potential consciousness in future AI or exotic aliens. *Welfare:* Focus on computational capacity. Summing requires identifying computational subjects.
  7.  **Scalar Phenomenology:** Consciousness varies in degree based on neural/functional capacity. *Awkward:* Quantifying and comparing subjective richness (e.g., bee vs. fish). *Welfare:* Prioritize high-capacity individuals. Aggregation *across* individuals depends on next step (Leaf 11/12).
  8.  **System Subjecthood:** Subjects can be sub/super-organismic systems. *Awkward:* Counting minds in a split-brain patient or colony. *Welfare:* Identify *all* conscious systems (hemispheres? zooids? hives?). Aggregation sums the consciousness *of each system*.
  9.  **Consistent Criterialism:** Apply criterion uniformly; impaired humans may lack consciousness. *Awkward:* Denying consciousness in severely impaired humans. *Welfare:* Strictly apply criterion. Summing based on meeting criteria.
  10. **Human Exceptionalism:** All humans are conscious, regardless. *Awkward:* Inconsistent criteria; impaired human > cognitively complex octopus. *Welfare:* Humans always prioritized. Summing applies only to non-humans meeting criterion.
  11. **Individual-Scalar:** Degrees are non-summable across subjects. *Awkward:* A million barely conscious insects have vastly more total suffering than one highly conscious pig? This view says *no*. *Welfare:* Focus on improving the *degree* within individuals, especially high-degree ones. Population size less relevant to total welfare than individual intensity.
  12. **Aggregative Utilitarianism (Consciousness):** Consciousness units sum across subjects. *Awkward:* Justifying that a barely conscious subject's experience "adds" meaningfully to a total. *Welfare:* Large numbers of low-degree subjects can outweigh fewer high-degree subjects. Prioritize interventions affecting vast numbers.

  ---

  **Closing Note on Aggregation in Welfare:** How you aggregate consciousness for cost-effectiveness depends fundamentally on your leaf: whether consciousness is present/absent (Binary), varies by degree (Scalar), whether those degrees belong to distinct subjects (Granularity), and whether degrees can be summed *across* those subjects (Aggregative vs. Individual-Scalar). Binary/Threshold views minimize aggregation complexity. Scalar views demand a method for quantifying degree. Granularity views demand identifying *all* subjects. Aggregative views prioritize large numbers; Individual-Scalar views prioritize high-intensity individuals. Human Exceptionalism adds a fixed high priority for humans.
