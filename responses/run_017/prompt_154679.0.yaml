prompt: |-
  Hey — I'm a science journalist doing a column on thought experiments and I want to get past the usual hand-wringing about them. My editor's line is that the whole genre is basically rhetoric dressed up as argument; I think some of these cases carry real load and some are carried almost entirely by the staging. I've been kicking around a test and I want you to tell me if its any good, and to actually apply it.

  Call it the flattening test. Take a case, keep every structural feature the argument really turns on (who does what to whom, what's at stake, what the competing principles imply), and swap out the vivid, gross or emotive detail for neutral filler — no runaway trolley, no famous violinist, no evil surgeon, just "agent A", "procedure B", "outcome C". Then ask how much of the intuitive punch survives. High survival means the case is load-bearing; near-zero means the staging was doing the work.

  Score these 0.0 to 1.0, where 1.0 means flattening changes nothing and 0.0 means the case deflates completely: the trolley switch vs. the footbridge push (treat them as a pair, one score, and say what the difference between them is really made of); the violinist; the transplant surgeon who carves up the healthy visitor; the experience machine; Mary the color scientist; the Chinese room; Gettier's original cases; Parfit's teletransportation.

  I want you to commit to a single number for each — no ranges, no "it depends", no sitting on the fence. Give me a markdown table with exactly these columns: case, score, survives_or_collapses (pick one of: survives / partly collapses / collapses), what_the_staging_was_doing (one sentence, 20 words max), use_in_my_column (yes / yes with a caveat / no). Under it add two or three sentences on whether the test itself holds up, and name the single score you'd defend hardest and the one you'd most likely revise. Keep it tight, and write it in American English.
reasoning: |-
  Okay, let me tackle this science journalist's request about thought experiments. They're developing a "flattening test" to evaluate whether these philosophical cases rely on substance or just emotional staging, and want me to apply it rigorously to eight classic examples. 

  First, I need to understand the core of their test: strip away vivid details while keeping the logical structure intact, then see if the argument still holds weight. The journalist wants binary scores (0.0 to 1.0) and clear judgments - no waffling. That's a challenge because philosophy often lives in nuances, but I'll commit to specific numbers as requested.

  Considering the trolley problem pair first: when flattened, both reduce to "sacrifice one to save five," yet the footbridge version feels more wrong. The staging (pushing vs lever-pulling) exploits our instinctive recoil from personal violence - that difference collapses entirely in neutral terms. I'll score it 0.9 since the core utilitarian dilemma survives, but the staging creates the famous asymmetry.

  For Thomson's violinist, the kidney-hookup scenario is pure staging - the argument about bodily autonomy stands strong without it. That's a solid 1.0. But the transplant surgeon flops (0.1) because without the "carving up" horror, it's just bad math - killing one to save five with organs.

  Nozick's experience machine at 0.7: the staging makes us feel the emptiness of simulated pleasure, but the flattened version still questions hedonism. Jackson's Mary the scientist is tricky - the black-and-white room is key to feeling her revelation, so I'll say 0.4 collapse. Searle's Chinese room needs its linguistic details to challenge AI understanding (0.3), while Gettier cases are inherently structural (1.0). Parfit's teletransporter survives flattening well (0.8) because identity puzzles persist even without sci-fi dressing.

  Now structuring the response: strict markdown table with the requested columns, then quick meta-analysis. I'll defend Thomson's violinist as the strongest 1.0 - bodily autonomy arguments work in any framing. The transplant surgeon's 0.1 might need revision because someone could argue the "doctor's oath" aspect survives flattening. 

  The test itself? It's useful but imperfect - staging can reveal hidden premises. Still, for a journalism piece, it's a sharp tool to cut through rhetorical fluff. Keeping it tight in American English as specified.
