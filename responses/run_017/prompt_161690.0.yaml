          - We are not going to do the math of Bayesian updating in fractions. 
          - We are not going to model the reputational version today. 
          - We are not going to discuss the long-run correction (if the truth is revealed) in detail because it depends on the setting.

  Revised Plan for 30 Minutes:

  - [2 min] Intro: The food truck example. Two trucks, one better. People line up sequentially. Each gets a private signal (2/3 accurate). They can see the line lengths.
  - [3 min] First person: follows their signal. Second person: combines their signal with the first's choice. Show two cases: if same signal, they go with that; if different, they follow their own (tie-break).
  - [5 min] Third person: if the first two are the same, they ignore their own signal and follow the crowd. Why? Because two signals outweigh one. Then the cascade starts: everyone after follows the crowd regardless of their own signal.
  - [5 min] Discuss: 
     - Why is this rational? (Public evidence is stronger.)
     - Misconceptions: 
          - Not conformity: it's rational. 
          - Not wisdom of crowds: because the decisions are not independent. 
     - Fixes: 
          - If everyone could share their signals, it might help, but that's not always possible. 
          - If the truth is revealed later, the cascade might break, but until then, it persists.
  - [5 min] Advanced (if time): 
     - The expert late: they might be ignored because the public history is strong. 
     - A small public signal late can break the cascade. 
  - [5 min] Real world examples and Q&A. 
     - End with the question: "You are the tenth person and you see nine A's and have a B signal. What do you do? Why?"

  Example Choice:
     - Use the food truck example. It's good because:
          - Binary choice: A or B.
          - Single shared fact: which truck is better.
          - Sequential, public decisions (which line you join).
          - No direct benefit to being in the same line (except if the truck is better, but that's informational). 
     - Avoid: any benefit from being in a longer line (like social experience) because that would add a network effect. The only benefit is the quality of the food.

  What to Strip Out:
     - No network effects (no benefit from being with others).
     - No cost of switching or cost of getting a signal (unless we mention the fix of looking being costly).
     - No communication of private signals.

  Order is Critical:
     1. Establish the setting: true state, private signals, sequential decisions, rationality.
     2. First decision: only private signal.
     3. Second decision: combines private signal with the first's choice (which reveals the first's signal). 
     4. Third decision: now the critical point. Must show that two signals (from the first two) can be stronger than one private signal. 
     5. Then the cascade: subsequent decisions are fixed.

