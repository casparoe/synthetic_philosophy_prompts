prompt: |-
  I am a senior at a fairly large public high school, and I run a small Friday-afternoon club where about fifteen of us talk through ideas from economics and the social sciences. A few of the regulars are competitive-math types who will want to see whatever machinery there is, but most of the room just wants the idea. Next week a group of visiting students from another school is joining us for a single session, and I have been asked to fill thirty minutes, one whiteboard, no projector, nobody prepared in advance, on the question of why a long line of perfectly sensible people can end up doing the same clearly wrong thing — each of them following the people ahead into a choice that most of them, thinking entirely on their own, would probably not have made. My club adviser called this an information cascade, but I do not want a reading list or a bibliography; nobody is going to do the reading, and I would rather spend the time on how to build the thing in their heads.

  What I keep failing at when I try this on friends is the order. Please plan the session rather than explain the idea to me: what has to be established before what, and what breaks if I swap two steps. Do I have to get them to accept first that each person has a private signal that is imperfect but better than nothing — say, right two times out of three — and second that watching someone else choose is itself a piece of evidence, before I can legitimately reach the moment where the public evidence simply outweighs the private one and the person stops acting on what they saw? Or does the sequence have to start somewhere else entirely? I also want a verdict on the carrying example. I have been using two food trucks outside a stadium with a line forming at one of them, but I am unsure whether that is better or worse than two restaurants on a street, or something with no consumption value at all. Tell me what the example must contain — a binary choice, a single shared fact of the matter, sequential and publicly visible decisions, no transmission of reasons — and what it must carefully not contain; my own guess is that it must not contain any direct benefit to ending up where everyone else is, because then I am only describing a network effect and the informational story quietly disappears, but I suspect there is more to strip out than that.

  Then the misconceptions, and please place each of them at a specific point in the sequence rather than listing them. Someone will arrive thinking this is about conformity, peer pressure, or people being sheep, and I assume I should name that early as the thing we are not saying — except that if I say everyone is being rational too soon, they will conclude the group therefore lands on the right answer, so I need to know when the rational framing is safe. There will be a recoil at the third or fourth person, the one who ignores what they personally saw, and they will think that person is weak or confused rather than reasonable. One of the louder students will bring up the wisdom-of-crowds demonstration where the average of many independent guesses beats nearly every individual guess, and insist it is the same phenomenon; I need to know where that gets headed off and what the actual difference is, since as far as I can tell it hinges on independence and on order. Someone else will say the fix is obvious — everybody announces their reason, or everybody goes and looks before deciding — and I genuinely cannot tell whether that is a real fix or the same problem reappearing one level up, because looking is costly and once a cascade is running maybe nobody bothers. And someone will say it corrects itself because people eventually find out the truth, which I think depends entirely on whether the outcome ever reveals the truth at all; I would like a way to make that vivid without a second example.

  There is one further thing I would like the session to reach, and I am not sure I believe it. My adviser said, and I only half-followed, that in this same setup moving the one person who actually has good information from the front of the line to the back makes the outcome worse rather than better, and separately that a very small piece of public information arriving late can break a cascade that an enormous amount of private information cannot. I want to get there honestly rather than assert it, so tell me whether it can be reached with the same example and nothing harder than fractions, or whether it needs a second case of its own and where in the thirty minutes that case belongs. Finally: give me one question I can put to them at the end that could not be answered by someone who has only learned the vocabulary, tell me what I should openly refuse to explain at this level — I am assuming the formal Bayesian updating and the reputational version where professionals imitate each other to protect their standing are both out — and tell me whether to touch the real world at all, because if I close with social media or stock bubbles I am afraid they will leave believing that crowds are always wrong and nothing online is trustworthy, which is not the claim I want them walking out with.
reasoning: |-
  We are designing a 30-minute session for high school students on information cascades. The goal is to build intuition without formal math. The key is to set up a clear example and walk through the sequence of decisions step by step.

  Core Idea: 
  An information cascade occurs when individuals, observing the actions of others, ignore their own private information and follow the crowd, even if the crowd is wrong. This can happen even when everyone is rational and trying to make the best decision.

  Structure of the Session:

  1. (2 min) Introduction: Set up the scenario and the problem.
     - Use a binary choice example: two food trucks (A and B) outside a stadium. One is better than the other (say, A is better, but no one knows for sure). People are arriving sequentially and must choose which truck to join. They can see the line lengths (public information) but not the actual quality (which is the hidden state of the world). Each person also gets a private signal (e.g., a quick look at the menu, a smell) that is somewhat informative but not perfect (say, 2/3 accurate).

  2. (3 min) Establish the Setting:
     - Explain the rules:
       - There is a true state: either Truck A is better or Truck B is better (say, with equal prior probability).
       - Each person gets a private signal: either "A" or "B", which is correct with probability 2/3.
       - People decide one by one, in sequence. Each can see the choices of all before them (so the public history) but not the private signals of others.
       - Each person is rational: they choose the truck they believe is more likely to be better given all the information they have (private signal and public history of choices).

  3. (5 min) Walk through the First Few Decisions:
     - Person 1: 
       - Only has private signal. If signal is "A", chooses A; if "B", chooses B. 
       - Suppose signal is "A" -> chooses A.
     - Person 2: 
       - Sees that Person 1 chose A. 
       - Also has a private signal. 
       - How to decide? They combine their private signal with the information from Person 1's choice.
       - Explain: Person 1's choice is a piece of evidence. Since Person 1's signal was "A" with 2/3 chance, that is evidence for A. 
       - If Person 2's signal is also "A", then they choose A. 
       - If Person 2's signal is "B", then they have conflicting evidence. Calculate the posterior: 
          - Prior: P(A good) = P(B good) = 1/2.
          - Evidence: two signals: one A, one B. 
          - P(A good | two signals: A and B) = P(two signals | A) * P(A) / P(two signals) 
          - But we can do without Bayes rule: 
            - If A is good, the probability of the signals: P(signal1=A | A) = 2/3, P(signal2=B | A) = 1/3. So joint prob = (2/3)*(1/3)=2/9.
            - If B is good: P(signal1=A | B)=1/3, P(signal2=B | B)=2/3 -> joint prob= (1/3)*(2/3)=2/9.
          - So equal probability? Actually, no: 
            - Actually, we have to condition on the signals. The two scenarios are symmetric? 
            - Alternatively: the posterior odds: 
               P(A|signals) / P(B|signals) = [P(signals|A)*P(A)] / [P(signals|B)*P(B)] = [ (2/3)*(1/3) * 1/2 ] / [ (1/3)*(2/3) * 1/2 ] = 1.
            - So indeed, the two states are equally likely. Then the person is indifferent. We can assume they follow their own signal (or flip a coin). 
          - But wait: the public action of person 1 is what person 2 observes. And person 1's action is based on their signal. So the fact that person 1 chose A means that they had a signal for A. So person 2 knows: 
            - There was one A signal (from person 1) and now I have a B signal. 
            - As above, the two signals cancel. So person 2 is indifferent. 
          - We'll assume they break the tie by following their own signal. So if their signal is B, they choose B.

       - Case 1: Person 2 has signal A -> chooses A. Then the first two are both A.
       - Case 2: Person 2 has signal B -> chooses B. Then we have one A and one B.

     - Now, what happens next depends on the first two.

  4. (10 min) The Cascade Begins:
     - We'll consider the case where the first two choices are the same. Let's say both chose A (so person1: signal A, person2: signal A). 
     - Person 3:
       - Sees two people chose A. 
       - Has a private signal, say it's B.
       - What should they do?
       - The public history: two A choices. That means there were two A signals (because each person, if they choose, they reveal they had a signal matching their choice? Actually, note: person2 might have chosen A even if they had a B signal if they were not indifferent? But in our case, if the first two are both A, then person1 had A, and person2 must have had A too (because if they had B, they would have chosen B and we would have seen one A and one B). So actually, two A choices imply two A signals.
       - So person 3 has: two A signals (from the choices) and one B signal (their own). 
       - Now, compute the posterior:
          - If A is good: probability of two A signals and one B signal: (2/3)^2 * (1/3) = 4/27 * 1/3? Wait, no: 
            Actually, the signals are independent given the state. 
            P(three signals: A, A, B | A) = (2/3)*(2/3)*(1/3) = 4/27.
          - If B is good: P(three signals: A, A, B | B) = (1/3)*(1/3)*(2/3) = 2/27.
          - So P(A good | signals) = (4/27 * 1/2) / [ (4/27 * 1/2) + (2/27 * 1/2) ] = (4/54) / (6/54) = 4/6 = 2/3.
          - Actually, we can see: the ratio is 4/27 : 2/27 = 2:1, so P(A) = 2/3, P(B)=1/3.
       - Therefore, even though person3 has a B signal, they should choose A because A is more likely to be good (2/3 chance). 
       - This is the key: they ignore their own signal and follow the crowd. 

     - Now, what about person4?
       - They see three A's. What does that mean? 
          - The first two A's imply two A signals. The third A: why did they choose A? They might have had a B signal and still chosen A? 
          - But person4 doesn't know the private signals. They only know the choices. 
          - They see: person1: A, person2: A, person3: A.
          - They know that the first two A's imply two A signals. Then person3, seeing two A's, would choose A regardless of their own signal. So the third A choice does not provide any new information about person3's signal! Because person3 would have chosen A whether they had an A signal or a B signal. 
          - Therefore, the public history of three A's only provides the information of the first two signals (both A) and then the third choice is uninformative. 
          - So person4: they have two A signals (from the first two) and their own signal. 
          - If their own signal is A, then they have three A signals? But wait: the third choice doesn't add a signal. So they have two A signals and their own. 
          - So if they have an A signal: total evidence: two A signals (from first two) and one A signal (theirs) -> three A signals? 
            Actually, no: the two A signals are already known. So they have the same situation as person3, but now with two A signals and their own. 
            - If they have an A signal: then they have two A signals (from the history) and one A signal (theirs) -> effectively three A signals? 
            But note: the third choice doesn't add a signal. So the evidence is: two A signals from the first two, and then whatever their signal is. 
            - So if they have an A signal: then they have three A signals? Actually, no: the two A signals are from the first two. Then they have a third A signal. 
            - Then P(A| three A signals) = [ (2/3)^3 * 1/2 ] / [ (2/3)^3 * 1/2 + (1/3)^3 * 1/2 ] = (8/27 * 1/2) / [ (8/27 + 1/27) * 1/2 ] = (8/54) / (9/54) = 8/9.
            - So they choose A.

          - If they have a B signal: then they have two A signals (from history) and one B signal. 
            - Then P(A| two A and one B) = [ (2/3)^2 * (1/3) * 1/2 ] / [ same denominator as before? ] 
            - Actually, we already computed for three signals: two A and one B: P(A) = 2/3, as above for person3. 
            - So they choose A.

       - Therefore, every subsequent person will choose A, regardless of their own signal. This is a cascade.

     - But note: if the first two choices had been different (A and B), then the third person would break the tie with their own signal. Then the fourth person would see two of one kind and one of the other? Actually, let's not go into that to avoid complexity.

  5. (5 min) Discuss the Implications and Misconceptions:
     - Highlight that the cascade starts at person3 in this example. Person3 ignores their own signal because the public information (two A's) is stronger than their private signal. 
     - This is rational: they are doing the best they can with the information they have.
     - But note: if the first two were wrong (because by chance both got the wrong signal, which happens with probability (1/3)*(1/3)=1/9), then the cascade is wrong and it persists forever. 
     - So the group can be wrong even though everyone is rational.

     - Now, the misconceptions:
       - Conformity/peer pressure: This is not about social pressure. Everyone is making an independent, rational decision based on the information they have. They are not sheep; they are using all the evidence. But the evidence is skewed by the public history.
         - When to address: After explaining person3's decision, emphasize that person3 is not weak; they are being logical. The public evidence (two A's) is stronger than one private signal. 
       - Wisdom of crowds: The wisdom of crowds requires independent judgments. In the cascade, after the first two, the subsequent decisions are not independent because they are influenced by the public history. So the crowd is not independent and therefore the wisdom does not apply. 
         - When to address: After the cascade has formed, point out that the cascade breaks the independence. The wisdom of crowds relies on independent errors canceling out, but here the errors are correlated (because everyone follows the early signals). 
       - Fixes: 
          - "Everyone announces their reason": If each person could announce their private signal, then the cascade wouldn't happen because everyone would see the entire history of signals. But in our setting, we assume that only actions (choices) are visible, not the reasons. 
            - However, note: if we allow everyone to announce their signal, then we don't have the cascade problem. But in reality, signals might be hard to communicate (subjective) or people might lie. 
          - "Everybody goes and looks": But looking is costly. The point of the cascade is that you can free-ride on the information of others. If it's costly to get your own signal, then you might rely on the public history. 
            - This is a real fix but costly. Without cost, the cascade might break if people get additional signals, but note: if the cascade is already established, why would they look? They think they know. 
            - Also, if the truth is eventually revealed (e.g., after eating, people know the quality), then the cascade might break, but until then, the cascade persists. 
          - So the fixes are not trivial.

  6. (3 min) Advanced Insights (if time permits):
