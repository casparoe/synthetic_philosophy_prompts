            - However, if the public history is very long and the expert is not infinitely strong, then the public history might dominate. But note: in our setting, only the first two signals are informative. So if the expert is the third person, they see two B's and then have a strong A signal: 
              - P(A | two B signals and expert A signal) = [ P(two B, one A | A) * P(A) ] / ... 
              = [ (1/3 * 1/3 * 0.9) * 0.5 ] / [ ... ] 
              Actually, we can compute the ratio: 
              = [ (1/9)*0.9 * 0.5 ] / [ (4/9)*0.1 * 0.5 ] = (0.1) / (0.0444) ≈ 2.25 -> so odds 2.25:1 in favor of A? Then P(A) = 2.25/(2.25+1)=0.69 -> so they choose A. 
