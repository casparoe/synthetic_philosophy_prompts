  Final Answer Structure:

  Session Plan:

  0. (Before starting) Draw the two food trucks and a line of people.

  1. [2 min] Introduction: 
     - "Imagine two food trucks, A and B. One is better, but you don't know which. You're in a line of people choosing. Each person gets a quick look (a private signal) that is somewhat helpful (2/3 chance of being right). You can see which line everyone ahead of you chose. How do you decide? And can the crowd be wrong even if everyone is rational?"

  2. [3 min] The First Two:
     - "Person 1: only their own signal. If signal A, choose A; if B, choose B. Let's say they choose A."
     - "Person 2: sees that person1 chose A. What does that tell them? It means person1 had a signal for A (because they followed it). Now, if person2's signal is A, they choose A. If it's B, they have conflicting information. But since the signals are equally strong, they are tied and we'll assume they follow their own signal: choose B. But if the first two both choose A, that means they both had A signals."

  3. [5 min] The Turning Point (Person 3):
     - "Now person3: sees two A's. That means two A signals. They get their own signal, say it's B. What should they do? The two A signals (each 2/3) together are stronger than one B signal. How much stronger? The chance that two A signals happen when A is good is (2/3)*(2/3)=4/9, but when A is bad, it's (1/3)*(1/3)=1/9. So the two A signals are 4 times more likely if A is good than if A is bad. But person3's B signal is 2 times more likely if B is good than if A is good. So overall, the two A signals outweigh the one B signal. Therefore, person3 chooses A, ignoring their own B signal. This is the cascade starting."

  4. [5 min] The Cascade and Why It's Rational:
     - "Now person4: sees three A's. But note: the third A choice doesn't add new information because person3 would have chosen A regardless of their signal. So person4 is in the same boat as person3: they see two A signals (from the first two) and then they have their own signal. Even if they get a B signal, they choose A. And so on. The crowd has locked in."
     - "This is rational: each person is doing the best they can with the information they have. But the problem is: the first two might be wrong! And then the whole crowd is wrong. So the group can be wrong even if everyone is rational."

  5. [5 min] Addressing Misconceptions:
     - "This is not about peer pressure: no one is forcing you. It's about the weight of evidence."
     - "This is not the wisdom of crowds: the wisdom requires independent guesses. Here, after the first two, the guesses are not independent because they are influenced by the public history."
     - "Fixes? If everyone could share their private signals, then we wouldn't have this problem. But that's not always possible. And if it's costly to get your own signal, you might rely on the crowd. Also, if the truth is revealed later (like after eating), the cascade might break, but until then, we're locked in."

  6. [5 min] Advanced Points and Real World:
     - "What if the person with the best information is at the end? They might see a long line and ignore their own good information because the public history seems so strong. So it's better to have experts early."
     - "What if a small piece of public information comes late? Like a friend texts that they think B is better. That might break the cascade because it adds doubt."
     - Real world: "This happens in stock markets, fashion, and even in science when a famous study is followed by many others even if it's wrong."
     - Final Question: "You're the tenth person. You see nine A's and your own signal is B. What do you do? Why? And what if you are the third person?"

  7. [5 min] Q&A and Wrap-up.

  What to Refuse:
     - "We're not doing the math with fractions today."
     - "We're not covering the case where people care about fitting in (that's a different story)."
     - "We're not saying crowds are always wrong; sometimes they are right. It's about how information flows."

  This should fit in 30 minutes and build the idea step by step.
answer: |-
  ### Session Plan: Information Cascades in 30 Minutes  
  **Goal:** Build intuition for why rational individuals follow the crowd despite contradictory private evidence. Use a single example with minimal math.  

  ---

  #### **Step 1: Set Up the Core Example (3 min)**  
  **What to draw on the board:**  
  - Two identical food trucks: **A** and **B**.  
  - One is objectively better (e.g., better food), but no one knows which.  
  - People arrive one by one, choose a truck, and join the line. Everyone sees the lines (public decisions) but not *why* others chose.  

  **Key rules (establish clearly):**  
  1. **Binary choice:** Only A or B.  
  2. **Private signal:** Each person gets a clue (e.g., a whiff of food smell). It’s imperfect but useful:  
     - If A is better, the clue says "A" with 2/3 probability (and "B" with 1/3).  
     - If B is better, it says "B" with 2/3 probability (and "A" with 1/3).  
  3. **Rationality:** Everyone wants the better truck. They combine their private clue with the public line lengths to decide.  
  4. **Sequential decisions:** Each person sees all previous choices before deciding.  

  **Why this example works (and what to avoid):**  
  - ✅ **Must-haves:** Binary choice, hidden truth, sequential/public actions, private signals, no extra motives.  
  - ❌ **Strip out:**  
    - *Network effects*: No benefit from crowding (e.g., no "fun atmosphere" in a longer line).  
    - *Outcome-dependent feedback*: The truth (which truck is better) is never revealed during the cascade.  
    - *Communication*: No talking, sharing reasons, or changing minds after choosing.  

  > **Misconception addressed here:**  
  > - *"This is about conformity/peer pressure."*  
  >   - **Shut this down immediately:** "This isn’t about social pressure or weakness. Everyone is being rational and selfish—they just want the best outcome."

  ---

  #### **Step 2: Walk Through the First Two Decisions (5 min)**  
  **Scenario:** Assume A is better (but no one knows this).  
  - **Person 1:**  
    - Only their private clue. No public info.  
    - Clue says "A" → chooses A. (If clue said "B", they’d choose B.)  
    - *Why?* They trust their clue (2/3 > 1/2).  

  - **Person 2:**  
    - Sees Person 1 chose A.  
    - Gets their own clue. Two cases:  
      - **Case 1:** Clue says "A" → chooses A (two clues agree).  
      - **Case 2:** Clue says "B" → **chooses B** (their clue outweighs the single public clue).  
        - *Why?* One A clue vs. one B clue = tie. They break ties with their own clue.  

  > **Key insight:** Person 2 still uses their private clue. Public info isn’t dominant yet.  

  ---

  #### **Step 3: The Cascade Trigger (Person 3) (7 min)**  
  **Focus:** Show how public info overpowers private signals.  
  - **Assume first two chose A** (Person 1 and 2 both got "A" clues).  
  - **Person 3:**  
    - Sees two people chose A → infers two "A" clues.  
    - Gets a private clue: **"B"** (contradicts public info).  
    - **Decision:**  
      - Two "A" clues vs. one "B" clue.  
      - Even with a "B" clue, they choose A.  
      - *Why?* Two clues are stronger than one. Probability A is better = 2/3 (math optional: "Two A-clues are 4x more likely if A is good vs. if B is good; one B-clue is only 2x more likely if B is good → net favors A").  

  **The cascade begins:**  
  - Person 3 ignores their own clue. This is rational! Public evidence outweighs private.  
  - Everyone after sees three A’s. Person 3’s choice added no new info (they’d choose A regardless of their clue).  

  > **Misconception addressed here:**  
  > - *"Person 3 is weak or irrational for ignoring their clue."*  
  >   - **Emphasize:** "This is rational! They’re weighing evidence. Two signals beat one. If you were them, you’d do the same."  
  > - **Wisdom of crowds comparison:**  
  >   - "This is the *opposite* of wisdom of crowds. Wisdom requires independence—here, decisions depend on others. Cascades kill independence."  

  ---

  #### **Step 4: The Cascade Unfolds (5 min)**  
  **Person 4 and beyond:**  
  - Sees three A’s → knows only the first two choices were informative.  
  - Even with a "B" clue, they choose A (same as Person 3).  
  - **Result:** All subsequent people choose A, *regardless of their private clues*.  

  **Why the group can be wrong:**  
  - If the first two were wrong (both got misleading "A" clues when B is better, probability = 1/3 × 1/3 = ~11%), the cascade locks in error.  
  - **Irony:** The crowd is wrong, but no one made a mistake. Each acted logically.  

  > **Fix attempts (preempt common suggestions):**  
  > - *"What if people share their clues?"* → "Yes, that would help! But in real life, clues are often private (e.g., gut feelings) or hard to share."  
  > - *"What if everyone checks the trucks first?"* → "Costly! Cascades happen when private info is cheap (e.g., glancing at a line), but deep investigation isn’t."  

  ---

  #### **Step 5: Advanced Insights (7 min)**  
  **Two key twists (use the same example):**  
  1. **Moving the expert to the back makes things worse:**  
     - Suppose Person 10 has a *strong* clue (90% accurate).  
     - If they’re early, they might start a correct cascade.  
     - If they’re late:  
       - They see a long line at A (cascade in progress).  
       - Their strong "B" clue conflicts with the *entire public history*.  
       - **Result:** They ignore their clue and choose A!  
       - *Why?* The public history (even based on weak early clues) dominates.  

  2. **A tiny public clue can break a cascade:**  
     - Imagine after 10 people choose A, a *public* clue arrives (e.g., a health inspector gives a slight hint favoring B).  
     - **Effect:** The next person sees:  
       - Weak public history (only first two choices were informative).  
       - New public clue + their private clue.  
     - If their clue is "B", they might choose B → **cascade breaks!**  
     - *Contrast:* Even 10 private "B" clues in a cascade wouldn’t change anything (they’re ignored).  

  > **Why this matters:** Public info is "loud"; private info is "silent" once a cascade starts.  

  ---

  #### **Step 6: Wrap-up and Real-World Touch (3 min)**  
  **Final question to test understanding:**  
  > *"You’re Person 10. You see nine people chose A. Your private clue says B. What do you do? Would your answer change if you were Person 3?"*  
  > - **Answer (for cascade):** Choose A as Person 10 (cascade locked in). As Person 3, if the first two chose A, you’d also choose A.  

  **What to openly refuse to explain:**  
  - "We’re skipping Bayesian math and reputational cascades (where people copy to fit in). Today is purely about information flow."  

  **Real-world connection (brief and cautious):**  
  - "Cascades happen in stock markets (bubbles), fashion, or social media trends. But remember: they’re not *always* wrong—just fragile. The key is whether decisions are independent."  
  - **Avoid:** Overgeneralizing ("crowds are always wrong") or pessimism ("never trust online info"). Instead: "Cascades explain why independent research matters."  

  ---

  ### Why This Order Matters  
  - **Swapping steps breaks the logic:**  
    - If you start with Person 3 ignoring their clue, it seems irrational. You *must* build from Person 1 to show rationality.  
    - Introducing the example *before* defining rules causes confusion (e.g., if network effects slip in).  
  - **Misconception timing is critical:**  
    - Kill "conformity" early (Step 1) before rational framing.  
    - Address "weakness" when Person 3 acts (Step 3), using rationality to reframe.  
    - Contrast wisdom of crowds when independence is lost (Step 3/4).  
  - **Advanced points need the cascade foundation:**  
    - The "expert in back" twist only works after establishing that latecomers ignore private clues (Step 5).  

  ### Materials  
  - **Whiteboard:** Draw trucks and tally choices as you walk through each person.  
  - **No prep needed:** Students can role-play as "Person 1, 2, 3..." if time allows.  

  This flow ensures the cascade emerges naturally from rational choices, strips away distractions, and lands the key paradox: **Rational individuals + incomplete information = collectively irrational outcomes.**
