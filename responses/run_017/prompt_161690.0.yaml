              - P(two B signals and one A | B) = (2/3)*(2/3)*0.1 = (4/9)*0.1 ≈ 0.0444
              - So P(A) = 0.1 / (0.1 + 0.0444) ≈ 0.1 / 0.1444 ≈ 0.69 -> still less than 1? Actually, if k is large, note that the first two are the only informative ones. So the expert would choose A if they believe P(A) > 0.5? 0.69>0.5 so they choose A. But wait: the expert's signal is strong. 
