       a) Moving the person with good information from the front to the back makes it worse: 
          - Suppose one person has a very accurate signal (say, 90% accurate). If they are at the front, they are likely to start a cascade in the correct direction. If they are at the back, then by the time they act, the cascade might already be established (and wrong) and they might ignore their own accurate signal because the public history is so strong. So it's worse to have the expert late.
