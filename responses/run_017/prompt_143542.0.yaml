  Hmm, the user has clearly done their homework. They've outlined specific test cases—Fission, Plasticity, Reformer—and identified key tensions like granularity versus avoiding moral presuppositions. This isn't just about listing criteria; they want to expose where EDAs might fundamentally fail. 

  First, I need to prioritize criteria that directly address their core concern: pressuring realists. That means starting with the epistemic mechanism (Desideratum 1) and the tracking requirement (Desideratum 2). Without those, an EDA is toothless. The granularity demand (Desideratum 3) comes next because their Fission case shows they won't accept blanket debunking. 

  *Pauses* The Plasticity case is tricky. If evolution shaped only the capacity, not specific judgments, does that still debunk? That's Desideratum 4—it must bridge capacity-level explanations to content. And the Reformer case (Desideratum 6) forces the argument to confront downstream stability; otherwise, it self-defeats when the debunker makes moral claims. 

  Ah, the overgeneralization worry (Desideratum 5) is critical. If the EDA's principle also wrecks math or perception, it's useless. But this clashes with Desideratum 10 (no moral presuppositions): avoiding overgeneralization might require sneaking in moral assumptions about what *should* be trackable. 

  *Scratches head* The user suspects two incompatibilities. Let's see: 
  - Granularity (3) vs. no moral presuppositions (10): Sorting judgments without moral knowledge seems impossible. If an EDA says "only judgments about distant futures are debunked," isn't that assuming we *know* other judgments are safe? 
  - Avoiding overgeneralization (5) vs. general epistemic principles (8): A truly general principle (like "no evolutionary influence implies no justification") would nuke math. But a morality-specific principle looks ad hoc. 

  Yep, both pairs seem jointly unsatisfiable. The user might need to relax (10) or drop granularity for a wholesale approach. 

  For the "most exclusionary" criterion—Desideratum 1 (epistemic mechanism) shuts down many EDAs. Folk like Street or Joyce often skip specifying *how* defeat works. 

  Now, scoring the three argument types: 
  - **A (dilemma)**: Fails granularity (can't distinguish judgments) and downstream stability (ignores reformer problem). 
  - **B (categorical authority)**: Better against overgeneralization but collapses first-order judgments into meta-level issues. 
  - **C (no causal contact)**: Ignores Plasticity and gets wrecked by overgeneralization (math has no causal contact!). 

  *Sigh* This user's depth is impressive. They'll likely push back on the incompatibility claims, but the tensions feel real. Hope this frames their chapter's "gotchas" clearly.
answer: |-
  Here is a prioritized list of desiderata for an adequate evolutionary debunking argument (EDA), designed to pressure a sophisticated non-naturalist realist. Each includes its rationale and negotiability status. Key tensions and argument evaluations follow.

  ---

  ### **Desiderata for Adequate EDAs**  
  *(Ordered by dialectical priority)*  

  1. **Epistemic Mechanism**  
     - *Requirement*: Must specify *how* the genealogical explanation defeats justification (e.g., rebutting/undermining defeat; showing insensitivity).  
     - *Rationale*: Without this, the argument lacks normative force ("defeat" is merely asserted).  
     - *Status*: **Non-negotiable**.  

  2. **Tracking Failure**  
     - *Requirement*: Must show why the causal origins of moral judgments prevent them from tracking stance-independent truths.  
     - *Rationale*: Realists can grant genealogy while insisting it tracks truth (e.g., via rational insight).  
     - *Status*: **Non-negotiable**.  

  3. **Granular Discrimination (Fission Test)**  
     - *Requirement*: Must distinguish debunked/non-debunked judgments (e.g., core vs. periphery in Fission case) without collapsing into global skepticism/immunity.  
     - *Rationale*: Adequacy requires precision; undifferentiated debunking is self-refuting or inert.  
     - *Status*: **Non-negotiable**.  

  4. **Content-Level Vulnerability (Plasticity Test)**  
     - *Requirement*: Must debunk *specific moral contents*, not just the capacity’s form. Must explain why plasticity extends to content (e.g., norms are fitness-enhancing *because* of content).  
     - *Rationale*: If only the capacity is explained, realists can affirm content via non-causal access.  
     - *Status*: **Negotiable** (some EDAs target capacity only, but realism may survive).  

  5. **Anti-Overgeneralization**  
     - *Requirement*: Must not debunk logic/math/perception under similar principles.  
     - *Rationale*: Overgeneralization voids the argument’s selectivity.  
     - *Status*: **Non-negotiable**.  

  6. **Downstream Stability (Reformer Test)**  
     - *Requirement*: Must explain the persistence of moral phenomenology/practical grip post-debunking and the status of the debunker’s own judgments (e.g., "we should doubt morals").  
     - *Rationale*: Otherwise, EDAs self-undermine or ignore psychology.  
     - *Status*: **Negotiable** (addressed via error theory/conservatism, but must be coherent).  

  7. **No Causal Contact ≠ Defeat**  
     - *Requirement*: Must not equate "no causal contact" with automatic defeat.  
     - *Rationale*: Realists deny causal contact is needed (e.g., for necessary truths).  
     - *Status*: **Non-negotiable**.  

  8. **General Epistemic Principle**  
     - *Requirement*: The operative defeat principle (e.g., sensitivity, safety) must be general, not moral-specific.  
     - *Rationale*: Morality-specific principles appear question-begging.  
     - *Status*: **Negotiable** (if defended independently).  

  9. **Falsifiability**  
     - *Requirement*: Must specify what evidence would falsify it (e.g., moral invariance despite selective divergence).  
     - *Rationale*: Empirical adequacy is necessary for seriousness.  
     - *Status*: **Non-negotiable**.  

  10. **No First-Order Presuppositions**  
      - *Requirement*: Must not rely on contested first-order moral knowledge to sort judgments (e.g., "debunk only unpopular judgments").  
      - *Rationale*: Presupposing realism’s truth undermines the project.  
      - *Status*: **Non-negotiable**.  

  11. **Distinguish Meta/First-Order Targets**  
      - *Requirement*: Must clarify whether it debunks first-order judgments, the meta-claim of stance-independence, or both.  
      - *Rationale*: Conflating these weakens precision.  
      - *Status*: **Negotiable** (structural clarity suffices).  

  ---

  ### **Incompatible Desiderata Pairs**  
  1. **Granularity (3) + No First-Order Presuppositions (10)**  
     - *Conflict*: Granular sorting requires a criterion to distinguish vulnerable judgments (e.g., "peripheral" judgments in Fission). But without moral presuppositions, no neutral criterion exists. Evolutionary genealogy alone cannot justify privileging "core" judgments.  
     - *Resolution*: Drop granularity (accept wholesale debunking) or relax (10) (permit defeasible moral assumptions).  

  2. **Anti-Overgeneralization (5) + General Epistemic Principle (8)**  
     - *Conflict*: A general principle (e.g., "evolutionary origins defeat justification") overgeneralizes to math/perception. Restricting it to morality appears ad hoc unless morality is uniquely vulnerable—which requires moral presuppositions.  
     - *Resolution*: Drop generality (8) (accept a morality-specific principle) or redefine the scope of (5).  

  ---

  ### **Most Exclusionary Requirement**  
  - **Desideratum 1 (Epistemic Mechanism)**:  
    Most EDAs omit a rigorous account of *how* genealogy defeats justification (e.g., conflating causation with defeat). This leaves realists unmoved.  

  ---

  ### **Evaluation of Argument Types**  

  | **Argument Type**              | **Key Strengths**                                      | **Fatal Weaknesses**                                  |  
  |--------------------------------|--------------------------------------------------------|-------------------------------------------------------|  
  | **A: Coincidence Dilemma**     | Pressures tracking (2); falsifiable (9).              | Fails granularity (3); ignores reformer stability (6); overgeneralizes if applied to math (5). |  
  | **B: Categorical Authority**   | Avoids overgeneralization (5); explains phenomenology (6). | Targets only meta-level (11), leaving first-order judgments intact; fails Plasticity test (4). |  
  | **C: No Causal Contact**       | Simple; satisfies generality (8).                     | Violates (7) & (5) (debunks math); no mechanism (1); fails Reformer test (6). |  

  ---

  ### **Summary**  
  An adequate EDA must:  
  - Anchor defeat in a **general epistemic mechanism** (1),  
  - Show **tracking failure** without overgeneralizing (2,5),  
  - **Discriminate among judgments** without moral presuppositions (3,10), and  
  - Survive **Plasticity** (4) and **Reformer** (6) cases.  
  The core tensions arise from granularity vs. neutrality and generality vs. selectivity. Argument (B) fares best against overgeneralization but struggles with content; (A) risks incoherence without granular sorting.
