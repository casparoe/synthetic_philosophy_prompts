prompt: |-
  I am helping a small foundation allocate roughly fifteen researcher-years over five years to the study of religion as a natural phenomenon: explaining religious belief, practice, and institutions with the same tools one would use for any other recurrent human pattern, never appealing to the truth of religious claims as an explanatory resource. The aim is that the work be usable within a decade by people who make real decisions — public-health officials deciding whether to route programmes through congregations, courts adjudicating religious exemptions, educators designing curricula about religion — rather than merely interesting to specialists.

  Give me a defended agenda: three or four open questions in priority order, with the reasoning doing most of the work. For each, say what other questions it is upstream of, how tractable it is with methods that exist now rather than methods that would require a breakthrough, and what specific result in the next five years would move it up or down the ranking. Then say which currently fashionable questions you would decline to fund, and why, on the ground that their answers would change no one's mind and no one's practice.

  Two constraints on your answer. First, treat the following as a live hypothesis about the field rather than as a methodological footnote: that its flagship findings were largely established on populations that are outliers by global and historical standards — wealthy, literate, post-Protestant, high-trust — so that some of what presents itself as a theory of religion is really a description of one unusual slice of it; if that is right, tell me which questions it re-ranks, and whether it makes any currently popular question unanswerable with the populations we can actually reach. Second, take a position on a distinction I want to impose: between questions about why human minds are receptive to religious representations at all, and questions about why particular religious packages spread, stabilise, outcompete, and decline. My suspicion is that the second family is far more decision-relevant while the field's prestige sits with the first; tell me whether that is right, and what would have to be true for the first family to deserve more of the money than the second.

  Lead with your bottom line — the ordered list — in the first sentence, then give the reasoning, with no preamble and no restatement of the question.
reasoning: |-
  Hmm, the user wants me to create a defended research agenda for studying religion as a natural phenomenon. They need three or four prioritized open questions that would be useful for decision-makers like public health officials, courts, and educators within a decade. I need to consider two constraints: the overreliance on WEIRD populations (Western, Educated, Industrialized, Rich, Democratic) in religious studies, and the distinction between why humans are receptive to religion versus why specific religions spread and stabilize.

  The user suspects that questions about why particular religious packages spread (the second family) are more decision-relevant, while the field currently prioritizes why humans are receptive to religion at all (the first family). I need to take a position on this.

  Looking at what would be most impactful for decision-makers, I think the second family is indeed more relevant. Public health officials need to understand how religious networks function; courts need to predict how religious groups respond to exemptions; educators need to explain why certain religious ideas persist. These all relate to how specific religious packages operate in society, not just the origins of religious cognition.

  For prioritization, I need to sequence questions that are both tractable and have downstream impacts. The top priority should be understanding how religious authority functions in different contexts - this is crucial for all the mentioned decision-makers. Then, examining how religious identities interact with other identities would help predict behavior in pluralistic societies. Third, mapping the functional niches of religious institutions would show why they persist or decline. Only then would I address the cognitive foundations, but with a focus on variation across populations.

  Regarding the WEIRD problem, this significantly re-ranks priorities. Findings from WEIRD populations can't explain religious dynamics in most of the world. For example, theories about individual belief might not apply where religion is more communal. This makes some popular questions about the origins of belief less answerable - we simply lack data from representative populations.

  I'll decline funding for several currently fashionable questions: evolutionary origins of religion (too distant from applications), laboratory studies of religious cognition (artificial and WEIRD-biased), and neuroscientific correlates of religious experience (interesting but not decision-relevant). These might be intellectually stimulating but won't change anyone's practices.

  For each priority question, I'll specify what a five-year result would look like and how it would affect the ranking. Authority mapping could advance quickly with mixed methods; identity work might require more innovation but has huge downstream potential; niche analysis is moderately tractable with existing tools; cognitive foundations need careful comparative work.

  The bottom line is that decision-relevance requires focusing on the sociology and ecology of religious systems, not just their psychological origins. The first family (why minds are receptive) only deserves more funding if we can show its variation directly explains differential success of religious packages - which currently we can't.
answer: |-
  **Bottom line:** Prioritize: (1) How religious authority is constituted and contested across diverse social ecologies; (2) How religious and other salient identities (ethnic, national, class) interact to predict cooperation, conflict, and compliance; (3) What functional niches sustain or undermine specific religious institutional forms; (4) Variation in the cognitive foundations of receptivity to supernatural agency under different developmental conditions.

  **Reasoning:**

  1.  **How religious authority is constituted and contested across diverse social ecologies (High Tractability, High Decision-Relevance, Upstream of Many Questions)**
      *   **Why Priority?** This is the core lever for decision-makers. Public health needs to know *who* can legitimately endorse programs within a congregation or movement. Courts need to adjudicate *whose* interpretation defines a "sincerely held belief" or authentic tradition. Educators need to explain *how* doctrines change. Understanding the sources (charisma, scripture, lineage, popular acclaim), scope, fragility, and competition of authority predicts group cohesion, schism, and response to external pressures.
      *   **Upstream Of:** Predicting schism/resistance to change; effectiveness of leader-endorsed interventions; legitimacy of spokespersons; dynamics of fundamentalism vs. reform; durability of institutions.
      *   **Tractability:** High. Uses mixed methods: ethnographic case studies comparing authority structures (e.g., hierarchical churches vs. decentralized movements); network analysis mapping influence; surveys/experiments testing compliance with different authority figures/scenarios; historical analysis of authority crises. Focuses on observable behavior and discourse, not inner belief.
      *   **5-Year Result Needed:** A validated typology of authority structures (e.g., centralized-doctrinal, diffuse-charismatic, lineage-based, consensus-driven) linked to measurable outcomes (compliance rates, schism likelihood, resilience to external challenge) across ≥5 distinct non-WEIRD contexts. *Move Down* if typologies prove too context-specific; *Move Up* if strong cross-contextual predictors of authority stability emerge.
      *   **WEIRD Constraint Impact:** Massively re-ranks this to #1. WEIRD contexts (especially Protestant-derived) often assume individualized belief and downplay communal authority structures dominant historically/globally. Studying how authority works in high-power-distance, low-literacy, or high-communal-accountability settings is essential, not optional. Makes questions solely about individual belief acquisition largely irrelevant to real-world power dynamics in most contexts.

  2.  **How religious and other salient identities (ethnic, national, class) interact to predict cooperation, conflict, and compliance (Moderate Tractability, High Decision-Relevance)**
      *   **Why Priority?** Decisions hinge on predicting group behavior. Do members prioritize their religious identity over nationality when laws conflict? Does class solidarity within a sect override doctrinal prohibitions on cooperation with outsiders? When does religious identity become a primary vector for conflict vs. a source of within-group trust for public goods? Crucial for courts (exemption impacts), public health (targeting sub-groups), educators (teaching in plural societies).
      *   **Upstream Of:** Predicting sectarian violence vs. interfaith cooperation; understanding differential uptake of secular programs within religious groups; assessing loyalty shifts; modeling identity-based mobilization.
      *   **Tractability:** Moderate. Requires careful comparative survey design measuring identity salience/strength; behavioral experiments (e.g., trust games, public goods games) priming different identities; natural language processing of discourse; analysis of conflict/cooperation events. Challenge is context sensitivity and avoiding priming artifacts.
      *   **5-Year Result Needed:** Predictive models showing how the relative strength and interaction of religious + ≥1 other identity (ethnic/national/class) in specific contexts (e.g., urban migrant community, rural ethnic enclave) influence ≥3 key behaviors (e.g., voting, charitable giving, inter-group trust, compliance with health mandates). *Move Down* if interactions prove overwhelmingly idiosyncratic; *Move Up* if robust, contextually moderated interaction patterns emerge.
      *   **WEIRD Constraint Impact:** Underscores the need. WEIRD studies often treat "religious identity" in isolation, ignoring its typical embeddedness elsewhere. This question *requires* studying non-WEIRD populations where religious identity is often fused with ethnicity or caste, making it fundamental, not derivative.

  3.  **What functional niches sustain or undermine specific religious institutional forms (e.g., congregational vs. household-based ritual; exclusive vs. syncretic; clergy-heavy vs. lay-led) (Moderate-High Tractability, High Decision-Relevance)**
      *   **Why Priority?** Explains *why* certain structures thrive/fail, directly informing interventions. Should public health partner with centralized hierarchies or decentralized networks? Why do some groups resist secularization pressures? What makes a sect resilient or prone to decline? Helps predict institutional responses.
      *   **Upstream Of:** Explaining the success/failure of specific religious "packages"; predicting institutional responses to social change (migration, economic shifts, state regulation); understanding resource flows and sustainability.
      *   **Tractability:** Moderate-High. Uses ecological and institutional analysis: demographic/economic data correlated with institutional prevalence/hardiness; comparative case studies of similar groups in different niches; analysis of resource dependencies (tithes, state support, volunteer labor); modeling competition/coexistence. Focuses on observable structures and resources.
      *   **5-Year Result Needed:** Identification of key ecological/institutional factors (e.g., state repression/support, economic inequality, migration patterns, technological access) that predict the dominance/decline/resilience of specific institutional forms in ≥3 distinct non-WEIRD regions. *Move Down* if niches prove too unique; *Move Up* if generalizable "rules of thumb" for institutional viability emerge.
      *   **WEIRD Constraint Impact:** Highlights that "secularization" pathways observed in WEIRD contexts are not universal. Requires studying how different niches (e.g., weak vs. strong states, high vs. low inequality) support vastly different institutional equilibria globally, challenging WEIRD-derived models.

  4.  **Variation in the cognitive foundations of receptivity to supernatural agency under different developmental conditions (Moderate Tractability, Lower Immediate Decision-Relevance)**
      *   **Why Priority?** While less *directly* decision-relevant, understanding the baseline variation in cognitive predispositions (e.g., teleological thinking, overactive agency detection, mentalizing) across populations is necessary groundwork. It asks: *Does the "raw material" minds bring to religion differ significantly in ways that shape which religious ideas find fertile ground?* This underpins the success of specific packages (#3).
      *   **Upstream Of:** Explaining differential appeal of specific religious concepts (e.g., immanent vs. transcendent gods, emphasis on doctrine vs. ritual); understanding barriers to secularization in some contexts; potentially informing long-term education strategies.
      *   **Tractability:** Moderate. Adapts validated cognitive psychology tasks (e.g., false belief, agency detection, teleological reasoning) for cross-cultural use, requiring careful translation and cultural sensitivity. Combines with developmental studies and ethnographic observation. Avoids lab-only WEIRD artifacts.
      *   **5-Year Result Needed:** Reliable demonstration of significant population-level variation in core cognitive tendencies relevant to supernatural thinking (beyond known WEIRD/non-WEIRD differences in analytical thinking) linked to local cultural/religious features. *Move Down* if minimal meaningful variation is found; *Move Up* if variation strongly predicts differential uptake of specific religious concepts across populations.
      *   **WEIRD Constraint Impact:** Essential *because* of the constraint. The flagship findings on cognitive foundations are *precisely* those most established on WEIRD undergrads. This question directly challenges their universality. Makes broad claims about "human nature" and religion suspect without this data.

  **Distinction: Receptivity (First Family) vs. Package Success (Second Family)**
  Your suspicion is largely correct. **The second family (package spread, stability, competition) is far more decision-relevant for the specified users.** Public health, courts, and educators deal with *existing, specific* religious groups and institutions, their structures, authority, and behaviors *now*. Funding should heavily favor the second family. **For the first family (receptivity) to deserve equal or greater funding, it would need to be true that:** (a) Significant, measurable population-level variation in cognitive foundations exists; *and* (b) This variation demonstrably *and* predictably explains a major portion of the variance in *which specific religious packages* dominate or succeed in different populations (i.e., it directly feeds into answering the second family's questions in a non-trivial way). Currently, (a) is inadequately tested and (b) is speculative. Question #4 is designed to test (a) and lay groundwork for (b).

  **Declined Funding (Fashionable but Low Impact):**
  *   **Evolutionary Origins of Religion (e.g., "group selection" debates):** Intellectually stimulating but too distant from proximate mechanisms and contemporary decision-making. Settling these debates won't tell a health official how to work with local imams tomorrow.
  *   **Laboratory Studies of "Religious Cognition" Isolated from Cultural Context:** Often uses WEIRD participants in artificial tasks (e.g., "believing in invisible agents" in scanners) that lack ecological validity. Findings rarely translate to real-world religious behavior or institutional dynamics.
  *   **Neuroscientific Correlates of "Mystical Experience":** While potentially interesting for philosophy of mind, the subjective nature and lack of clear links to specific beliefs, practices, or institutional behaviors make it irrelevant to public health, courts, or education policy. Understanding the *social meaning* and *authoritative interpretation* of such experiences is far more relevant (covered under #1).
  *   **Highly Abstract Philosophical Debates about "Religious Belief":** Often presupposes WEIRD, individualistic, propositional notions of belief irrelevant to how many experience and enact religion globally as practice, identity, and communal belonging.
