  Looking at their four observations: (1) Reparations quantify different types of harm with specific monetary values, implying cardinal comparability within a case. (2) Yet memorials and education insist atrocities are unique and incomparable across cases. (3) Within a single case, there's intense focus on precise victim counts. (4) In law, the severity label depends on intent (like genocide) rather than scale, but scale still affects admissibility and sentencing.

