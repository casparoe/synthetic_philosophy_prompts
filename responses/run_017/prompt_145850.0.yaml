answer: |-
  ### Marker's Report: Student Answer Assessment  
  **Overall Mark: 72/100**  

  **Strengths (What the Student Gets Right):**  
  1. **Hume’s is-ought gap**: Correctly identifies Hume’s core point that normative conclusions ("ought") cannot be *deduced* from purely descriptive premises ("is"). Accurately notes the requirement for a normative premise to bridge the gap. *(Settled doctrine; Hume’s text is unambiguous here.)*  
  2. **Moore’s naturalistic fallacy**: Rightly distinguishes Moore’s target as defining "good" in naturalistic terms (e.g., pleasure, evolution). The open-question argument is summarised appropriately. *(Settled doctrine on Moore’s intent.)*  
  3. **Application to the survey (part b)**: Correctly concludes that the survey’s *purely descriptive* findings cannot **entail** normative conclusions. The logical gap is well articulated. *(Settled doctrine re: deductive validity.)*  
  4. **Normative premise requirement (part c)**: Identifies that a premise like "one ought to sustain cooperation" must be added to derive an "ought". *(Settled; no disagreement here.)*  

  **Subtle Errors (Likely to Wave Through but Need Flagging):**  
  1. **Conflating Hume and Moore**:  
     - Claims the naturalistic fallacy is "basically the same point" as the is-ought gap. **This is incorrect.**  
     - *Distinction*: Hume’s gap concerns **logical deduction** (no "ought" from "is"). Moore’s fallacy targets **reductionism** (defining "good" as a natural property).  
     - *Settled vs. contested*: Distinguishing them is settled doctrine; conflating them is a common student error. Moore explicitly rejected reducing ethics to *any* natural/supernatural property, not just deductive gaps.  
     - *Impact*: Minor deduct as it misrepresents Moore but doesn’t undermine the core argument.  

  2. **Overreach on "evidence"**:  
     - Asserts descriptive facts "cannot even be evidence for any moral conclusion". **Overly strong.**  
     - *Distinction*: While descriptive premises can’t *deductively entail* "oughts", many philosophers (e.g., moral naturalists) argue they can provide *evidential support* (e.g., facts about well-being informing utilitarianism).  
     - *Settled vs. contested*: Hume’s gap is settled re: deduction, but whether empirical facts can be *evidence* is hotly contested (e.g., in Cornell realism).  
     - *Impact*: Weakens part (b); the student conflates **deductive validity** with **evidential relevance**.  

  **Non-Sequiturs / Unsupported Steps:**  
  1. **"Ethical naturalism is the doctrine that you can derive an ought from an is"**:  
     - **Misdefinition**. Ethical naturalism typically holds that moral properties *are* natural properties (e.g., "goodness = pleasure"), not that one can *derive* "ought" from "is" without normative premises. Moore’s target is reductionism, not derivation per se.  
     - *Why it matters*: Undermines the explanation of Moore. Naturalists (e.g., Railton) reject the is-ought gap too, but via redefining moral facts as natural, not via derivation.  

  2. **"Descriptive facts are, morally speaking, inert"**:  
     - **Unsupported claim**. Assumes *all* meta-ethical positions reject empirical input. Ignores positions like non-reductive naturalism (e.g., Brink) where facts *ground* moral properties.  
     - *Why it matters*: Invalidates the broader claim that "no empirical finding ever could" support morality. The survey *could* be evidence if one accepts certain bridge premises (e.g., "social stability is good").  

  3. **"Moral disagreement is never about facts"**:  
     - **False generalisation**. Many ethicists (e.g., Parfit) argue moral disagreements *often* hinge on empirical or conceptual facts. Example: Disagreements about animal ethics rely on facts about sentience.  

  **Confidence Flags for Marker:**  
  - *Moore’s "reason" for the fallacy*: Student links it to Hume’s "reason is slave of passions". **Uncertain** – Moore’s argument is semantic, not psychological.  
  - *Autonomy of morality*: Student’s conclusion that morality is "autonomous from science" is **contested** (e.g., by pragmatists like Dewey).  

  **Recommendations for Justification:**  
  - **Deduct 8 marks** for misdefining naturalism and conflation of Hume/Moore (fundamental concepts).  
  - **Deduct 12 marks** for unsupported claims about evidence/inertness and non-sequiturs.  
  - **Deduct 8 marks** for overgeneralisation on moral disagreement.  
  - **Award partial credit** (72/100) as core Humean logic and application to the survey are sound.  

  **Key Distinctions to Highlight in Feedback:**  
  1. **Hume’s gap ≠ Moore’s fallacy** (deduction vs. definition).  
  2. **Deduction vs. evidence** (entailment ≠ support).  
  3. **Ethical naturalism**: Reductionism (settled as Moore’s target) vs. derivational strategies (contested).  

  ---  
  **Marking Key**:  
  - (a) 30% (scored 18/30: lost 6 on conflation, 6 on naturalism definition)  
  - (b) 30% (scored 20/30: lost 10 for overreach on evidence/inertness)  
  - (c) 40% (scored 34/40: lost 6 for unsupported "no empirical finding ever could")  

  *Marker’s note: This answer is philosophically confident but overreaches on contested claims. First-years often conflate Hume/Moore – emphasise this distinction.*
