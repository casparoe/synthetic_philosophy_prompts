prompt: |-
  I'm in eleventh grade and I debate for my school's team. Last weekend's resolution was "Patriotism is a virtue," and the negative bench kept coming back to a single line: "My country, right or wrong." Their use of it was something like this: patriotism is at bottom a loyalty that does not track whether its object deserves it, a disposition that is insensitive to reasons cannot be a virtue, so patriotism is at best a sentiment and at worst a vice. My partner answered by reciting a longer version I have also seen floating around online — "My country, right or wrong; if right, to be kept right; and if wrong, to be set right" — and the negative replied that this simply changed the subject, since a person busy setting the country right is being loyal to something else, not to the country. I could not tell who was right, and I suspect neither of them was being precise about what the sentence actually says.

  So I would like that sentence disambiguated. Please give me a menu of the precise claims it could be making, ordered from the ones that are nearly trivial to the ones that are genuinely strong, with a verdict attached to each: which is a platitude nearly everyone already accepts in some form, which is substantive and might survive scrutiny, which is false or incoherent, and which one people who repeat the line are usually reaching for. For every reading, say whether it genuinely supports the negative's argument, or instead supports my partner's reply, or does neither.

  Two complications of my own, since they are where I got stuck. First, I have been trying to sort patriotisms into kinds, and I cannot tell which kind the slogan is even about: (a) the team-support kind, where you want your country to come out ahead and feel pride when it does; (b) the gratitude kind, where you owe the country something for what it has given you; (c) the trustee kind, where you have been handed an institution along with its stated ideals and are answerable for holding it to them; (d) the kin kind, where you simply give compatriots more weight than strangers. Second, my test case: a friend who loves this country's language, music, and countryside, thinks its founding involved serious injustice, and works against several of its present policies — yet says she does all of that because she loves the country and wants it to become worthy of the promises it made. Under which readings is she a patriot, and under which is she something else under a borrowed name?

  One constraint on the answer, please. Do not lay out the menu and leave me to choose at the tournament: commit. Tell me which single reading I should concede to the negative, which single reading I should force them to defend, and give me the one sentence of rebuttal you would actually stand behind, together with your reason for preferring it. Then flag the verdict you are least confident about and say what would change your mind on it.
reasoning: |-
  Okay, the user is in eleventh grade and part of their school's debate team. The resolution was "Patriotism is a virtue," and the negative team kept using the phrase "My country, right or wrong" to argue that patriotism is blind loyalty, which can't be a virtue. The user's partner countered with the extended version: "My country, right or wrong; if right, to be kept right; and if wrong, to be set right." But the negative shot back, saying that setting the country right means being loyal to something else, not the country itself. The user is confused about who's right and wants a clear breakdown of the possible interpretations of that phrase.

  First, I need to unpack the different meanings of "My country, right or wrong." The original quote by Stephen Decatur is often used to imply unconditional loyalty. The extended version adds nuance, but the negative's rebuttal hinges on whether the "something else" you're loyal to when correcting the country isn't the country itself. The user mentioned four types of patriotism: team-support, gratitude, trustee, and kin loyalty. I should map the interpretations to these types.

  The user also has a test case: a friend who loves the country's culture but criticizes its policies and history, working to make it live up to its ideals. Is she a patriot under each reading? This is key because it challenges the negative's argument that patriotism is only blind loyalty.

  The user wants a menu of interpretations, ordered from trivial to strong, with verdicts on each. They need to know which interpretation concedes to the negative, which to force them to defend, and a solid rebuttal. Also, they want me to commit to specific choices for debate strategy, not just list options.

  Possible interpretations:
  1. **Descriptive Claim**: Patriotism involves supporting the country regardless of its actions. This is trivial but not what anyone means. Verdict: platitude, but irrelevant to the debate.
  2. **Prescriptive Claim**: One should support the country unconditionally. This aligns with blind loyalty, which the negative attacks. Verdict: substantive but likely false, supports negative.
  3. **Identity Claim**: Patriotism is about belonging, not approval. This is the kin loyalty. Verdict: plausible but doesn't engage the virtue aspect directly.
  4. **Trustee Claim**: Loyalty means upholding the country's ideals, which includes correcting it. This is the trustee type. Verdict: substantive, supports the partner's rebuttal.
  5. **Aspirational Claim**: The country is defined by its ideals, so correcting it is loyalty to the true country. This is strong and aligns with the friend's actions. Verdict: defensible, counters negative.

  The trustee and aspirational readings are crucial here. The negative's argument falls apart if patriotism involves holding the country to its own standards. The friend's case exemplifies this—she loves the country's potential and ideals, making her actions patriotic under these readings.

  For the user's strategy:
  - **Concede**: The prescriptive reading (unconditional support) because it's weak and easy to refute.
  - **Force Defense**: The aspirational reading, as it's the strongest for their side and the negative must engage with it.
  - **Rebuttal**: "Correcting the country isn't disloyalty; it's fidelity to what makes it worthy of loyalty." This shifts focus to ideals over mere nation-state.

  Least confident verdict is rejecting the prescriptive claim. If unconditional loyalty is seen as a virtue in extreme scenarios (like wartime unity), that could challenge the rebuttal. But such cases are rare and context-dependent, so it's still weak.

  The user's deeper need is to clarify patriotism's core—whether it's about the country as-is or its ideals. The negative conflates patriotism with nationalism, while the affirmative separates them. Highlighting this distinction strengthens their position.
answer: |-
  ### Disambiguation of "My Country, Right or Wrong"  
  I'll break down the possible interpretations of the slogan (both the original and extended versions), ordered from trivial to substantive. For each, I'll provide:  
  - **The precise claim**  
  - **Verdict** (platitude, substantive/defensible, false/incoherent)  
  - **Alignment with debate sides** (supports negative, supports your partner, or neutral)  
  - **Relevance to your patriotisms** (a-d) and your test case (your friend).  

  **Key to Patriotism Types**:  
  - (a) Team-support: Pride in the nation's success.  
  - (b) Gratitude: Debt for benefits received.  
  - (c) Trustee: Stewardship of the country's ideals.  
  - (d) Kin loyalty: Prioritizing compatriots.  

  ---  
  ### The Menu of Interpretations (Ordered Trivial → Strong)  
  1. **Descriptive Claim**  
     - *Claim*: "Patriotism, as commonly practiced, involves supporting one's country regardless of its actions."  
     - *Verdict*: **Platitude**. This is an observation about real-world behavior, not a moral claim. Nearly everyone accepts that *some* people act this way.  
     - *Debate Alignment*: **Neutral**. Neither side gains ground—it describes but doesn't prescribe.  
     - *Patriotism Type*: Fits (a) and (d). Your friend rejects this, so she's not a patriot here.  

  2. **Prescriptive Claim (Original Slogan)**  
     - *Claim*: "One *ought* to support one's country unconditionally, even when it is wrong."  
     - *Verdict*: **False/Incoherent**. Unconditional loyalty ignores moral agency (e.g., supporting genocide because it's "your country" is indefensible). Conflicts with virtue ethics, which requires reason-responsive dispositions.  
     - *Debate Alignment*: **Supports Negative**. Matches their argument that patriotism is "loyalty insensitive to reasons."  
     - *Patriotism Type*: Fits (a) and (d) only. Your friend is explicitly *not* a patriot here—she conditions loyalty on moral worth.  

  3. **Identity Claim**  
     - *Claim*: "Patriotism is about belonging, not approval. You can love your country while criticizing it, just as you can love a flawed family member."  
     - *Verdict*: **Substantive/Defensible**. Aligns with moderate patriotism (e.g., philosopher Maurizio Viroli). Distinguishes loyalty from obedience.  
     - *Debate Alignment*: **Neutral**. Negative's "insensitive to reasons" critique fails—criticism is compatible with loyalty. Supports your partner if you argue patriotism *includes* reform.  
     - *Patriotism Type*: Fits (b), (c), and (d). Your friend *is* a patriot here—her love persists despite criticism.  

  4. **Trustee Claim (Extended Slogan)**  
     - *Claim*: "Loyalty to one's country means upholding its *ideals* (e.g., justice, liberty), not its current policies. Correcting the country *is* loyalty—it fulfills a duty to the nation's best self."  
     - *Verdict*: **Substantive/Defensible**. Converts patriotism into active stewardship (type c). Philosopher John Dewey endorsed this "loyalty to loyalty."  
     - *Debate Alignment*: **Supports Your Partner**. Refutes the negative by making reform central to patriotism. Negative's "loyal to something else" retort fails—the "country" is defined by its aspirational ideals.  
     - *Patriotism Type*: Fits (c) primarily. Your friend *is* a patriot here—she's "setting right" the country to align with its promises.  

  5. **Aspirational Claim**  
     - *Claim*: "The 'country' is not the state or its policies, but the *project* of its ideals (e.g., 'America' as the pursuit of equality). Patriotism means advancing that project, so correcting failures *is* the purest loyalty."  
     - *Verdict*: **Substantive/Strongest**. Treats the nation as a dynamic moral endeavor (e.g., Martin Luther King Jr.'s "promissory note"). Survives scrutiny if ideals are sound.  
     - *Debate Alignment*: **Supports Your Partner**. Destroys negative's argument—loyalty *requires* reason-tracking to serve the ideal.  
     - *Patriotism Type*: Fits (c) exclusively. Your friend *is* a patriot here—she loves the "project," not the status quo.  

  ---  
  ### Your Strategic Commitments for Debate  
  I won't leave you to choose—here’s the exact game plan:  

  1. **Concede to the Negative**: The **Prescriptive Claim** (#2).  
     - *Why*: It’s the weakest interpretation and aligns with their argument. Conceding it costs you nothing because it’s easily refuted (e.g., "Blind loyalty *is* a vice—but that’s not true patriotism"). Forces them to defend an indefensible extreme.  

  2. **Force Them to Defend**: The **Aspirational Claim** (#5).  
     - *Why*: It’s the strongest defensible reading and mirrors your partner's case. The negative *must* engage here to win, but it’s hard for them because:  
       - It refutes their "loyal to something else" objection—your friend isn’t loyal to an abstract "justice," but to *her country’s own professed ideals*.  
       - It turns patriotism into a virtue (critical loyalty = moral responsibility).  

  3. **Your One-Sentence Rebuttal to Stand Behind**:  
     > "Correcting the country isn’t disloyalty; it’s fidelity to what makes it *worthy* of loyalty—its enduring ideals."  
     - *Why This Works*:  
       - **Cuts to the core**: It reframes the debate around the *object* of loyalty (ideals vs. power), blocking the negative's "loyal to something else" dodge.  
       - **Uses your test case**: Your friend exemplifies this—loving the language/music/landscape is love of the *culture*, while fixing injustices is love of the *ideal*.  
       - **Philosophical grounding**: Echoes Aristotle—virtue requires acting for the right reasons (here, ideals over tribalism).  
       - **Strategic edge**: Forces negative into a paradox. If they argue "ideals aren’t the country," they sound anti-democratic (rejecting founding principles). If they accept ideals matter, patriotism becomes reason-responsive.  

  ---  
  ### Verdict I’m Least Confident About  
  - **The Prescriptive Claim (#2) as "False/Incoherent."**  
  - *Why Uncertain*: In extreme contexts (e.g., wartime), unconditional loyalty *might* be pragmatically virtuous (e.g., uniting to defeat fascism). If negative cites real-world cohesion as a "virtue," it could sway judges.  
  - *What Would Change My Mind*: Empirical evidence that blind patriotism reliably prevents greater harms (e.g., studies showing it averts civil conflict). But this is rare—usually, it enables atrocities. Stick to rejecting it unless they bring overwhelming proof.  

  ### Final Note on Your Test Case  
  Your friend is a patriot under **Trustee (#4)** and **Aspirational (#5)** readings. She’s *not* under **Descriptive (#1)** or **Prescriptive (#2)**. She *might* fit **Identity (#3)** if her cultural love anchors her loyalty. This showcases how the negative oversimplifies—they conflate patriotism with nationalism (type a/d), ignoring higher-order loyalties (type c). Use her as a rhetorical weapon: "If my friend isn’t a patriot, who is? Someone who cheers for injustice? That’s not virtue—it’s tribalism."
