  The solutions are invariant under positive affine transformations of each player's utility. That is, if we transform player i's utility by x_i' = alpha_i x_i + beta_i, with alpha_i>0. The Nash solution and KS solution are both invariant under such transformations. In the example, the numerical values might change, but the violation of M by Nash would still be there. For example, if we rescale player 1's utility by a factor, the point (90,75) might become (900,75) if scaled by 10, and (84,84) becomes (840,84). Then player 1 goes from 900 to 840, still a loss. Similarly, any positive affine transformation would preserve the ordinality of the differences? But M is defined in terms of the utility functions, and the axiom INV ensures that the solution is invariant, and also the hypothesis of M is preserved under such transformations. So the violation is not due to the scaling.

