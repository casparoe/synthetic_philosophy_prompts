  ### What This Procedure **CANNOT** Do  
  1. **Handle Partial Correlation:** Assumes bets are independent or 100% correlated (via 5% event cap).  
  2. **Model Complex Clusters:** Requires breaking multi-outcome clusters into binary bets.  
  3. **Precision Tax Optimization:** Approximates tax impact (30% this year; 0% future) but ignores:  
     - Loss carry-forward utility.  
     - Cross-year hedging.  
  4. **Dynamic Time-Value Adjustments:** Fixed $25/time cost; no adjustment for bet complexity.  
  5. **Predict Future Bankroll Changes:** $3k/month added statically; no compounding.  
  6. **Resolve Disagreements Deeply:** Averages probabilities; no Bayesian weighting.  
  7. **Avoid Early Exit Haircuts:** Only rejects bets >18 months; no pricing for early sale.  
  8. **Guarantee Against Ruin:** $25k floor enforced manually (shut down if breached).  

  ### Final Advice  
  - **Run Monthly Calibration:** Regress past estimates against outcomes to update `a, b`.  
  - **Track Religiously:** Log every bet, base event, and outcome.  
  - **Conservative Defaults:** Shrink factor (0.5) and 5% event cap protect against unknowns.  
  - **When in Doubt:** Output "no". Most small edges (<2%) fail the time cost check.  

  **Output Format:**  
  - **"Bet $X"** or **"no: [reason]"**  
  - Always end with a decision.
