  ### Bet Sizing Procedure for Prediction Markets  
  **Goal:** Determine the optimal stake for each bet (or cluster) while managing risk, taxes, overhead, and disagreements. Output is a dollar amount or "no".

  **Pre-Requirements:**  
  - **Bankroll (B):** Current funds + monthly additions. Start with $42k + $3k/month.  
  - **Calibration History:** Track all past probability estimates (both partners) and outcomes.  
  - **Exposure Ledger:** Record total stakes per "base event" (e.g., "2024 Election").  
  - **Parameters:**  
    - Time cost per bet: **$25** (15 minutes at $100/hour).  
    - Max exposure per base event: **5% of B** (to handle correlation).  
    - Shrink factor (default): **0.5** (scale down Kelly stakes due to overconfidence).  
    - Tax rate: **30%** on net annual winnings (losses carry forward).  
    - Settlement cutoff: No bets settling >18 months out.  

  **Procedure Steps:**  
  *Run in order—stop and output "no" if any check fails.*

  1. **Settlement Date Check:**  
     - *Question:* Will the bet settle within 18 months?  
     - *Sufficient Answer:* Settlement date ≤ current date + 18 months.  
     - *Stop if:* No → **"no: settlement too far"**.  

  2. **Adjust Odds for Costs:**  
     - *Question:* What are the decimal odds (O), commission (c), and settlement year?  
     - *Adjust:*  
       - **Commission:** `O_comm = 1 + (O - 1) × (1 - c)`  
       - **Tax (if settled this year):** `O_adj = 0.3 + 0.7 × O_comm`  
       - **No tax (future year):** `O_adj = O_comm`  
     - *Stop if:* Cannot compute O → **"no: invalid odds"**.  

  3. **Probability Estimate:**  
     - *Question:* Your (p1) and brother’s (p2) probability estimates?  
     - *Combine:* `p = (p1 + p2) / 2` (average if disagreement).  
     - *Calibrate:* `p_cal = max(0.01, min(0.99, a × p + b))`  
       - `a, b` from monthly regression of past estimates vs. outcomes (updated offline).  
       - *Default (no data):* `a = 1, b = 0`.  

  4. **Edge Check:**  
     - *Compute:* `edge = (p_cal × O_adj) - 1`  
       `b_odds = O_adj - 1` (net profit per $1 if win).  
     - *Stop if:* `edge ≤ 0` → **"no: negative edge"**.  

  5. **Kelly Stake (Raw):**  
     - *Compute:* `f_raw = edge / b_odds`  

  6. **Apply Shrink Factor:**  
     - *Compute:* `f_actual = f_raw × 0.5` (default shrink).  

  7. **Base Event Exposure Check:**  
     - *Question:* Base event (if any)?  
     - *Compute:*  
       - `current_exposure` = Sum of open stakes on this event (from ledger).  
       - `max_stake = max(0, 0.05 × B - current_exposure)`  
     - *Handoff if:* Ambiguous base event → **Human decides event grouping**.  

  8. **Proposed Stake:**  
     - *Compute:* `S_proposed = f_actual × B`  
       - Cap at `max_stake` if base event exists.  

  9. **Overhead Check:**  
     - *Compute:* `EV = S_proposed × edge` (expected value).  
     - *Stop if:* `EV < $25` → **"no: EV < time cost"**.  

  10. **Minimum Stake Check:**  
      - *Stop if:* `S_proposed < venue_min` → **"no: below min stake"**.  

  11. **Output:**  
      - **Bet amount:** `S_proposed` (if all checks pass).  
      - **Update ledger:** Add `S_proposed` to base event exposure.  

