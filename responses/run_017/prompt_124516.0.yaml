prompt: |-
  I chair the behavior-support committee at a nonprofit that runs eleven group homes for adults with profound intellectual and multiple disabilities. My younger sister moved into one of them two years ago, so I now also see the output of our process from the family side, which is part of why I'm asking. Every resident has a written preferences-and-goals plan, rewritten annually and reviewed quarterly, signed off by a state regulator; in practice that document determines how a person spends their days — what they are offered, what they are taken to, what staff will wake them for, what gets removed from their environment as a safety risk. None of the residents use speech, so every one of these plans is inferred from behavior. Our current method is essentially a frequency count: over a two-week structured trial a support worker offers a pair of options ten times, and whichever one the resident approaches, reaches toward, or looks at longer gets written into the plan as a preference. The workers who run the trials have high-school educations, no statistics, about fifteen minutes per trial, and usually two or three other residents to supervise at the same time; anything I hand them has to fit on one laminated sheet, use no equipment the unit doesn't already have, and hold up when a reviewer asks how we know.

  I recently read about inverse reinforcement learning — inferring an agent's reward function from its observed actions — in a machine-learning context, and it made me anxious about our own practice in a way I can't fully articulate to my committee. The parts I keep circling are these. First, behavior underdetermines the reward function: many different orderings of how much someone cares generate exactly the same choices, and, counterintuitively, a person who always picks the same thing tells you less about the strength of the preference than someone who mostly picks it but occasionally doesn't. Second, choices are made against an option set that we constructed, and a long history of being offered almost nothing can itself shrink what a person reaches for, so a frequency count can quietly launder staff convenience and institutional routine into the resident's own preferences. Third, motor effort, positioning, staff cueing, satiation, and fear of the alternative all move behavior in the same direction that liking does, and our trials don't separate them. Fourth — and this is the one I'm least sure I've got right — a reward function inferred from someone's behavior is not automatically the thing we ought to be serving; there may be cases where the plan should say something about what we owe the person rather than what they'd pick. I'd like the procedure to preserve those four worries while being usable by someone who will never read the theory, and to be honest about which of them it has quietly dropped.

  So: please write me a decision procedure my committee can adopt for turning observed behavior into a sentence in a plan. In order, the questions to ask; what counts as a sufficient answer to each; which tests a support worker can actually run in fifteen minutes on the unit; where the procedure stops and returns no inference is licensed from this behavior; and where it hands the question to a named human being — the resident where possible, otherwise a family member or an advocate — because it is a judgment about values and not a matter of evidence at all. The output should be a plan sentence a regulator can audit, not a preference ordering, and I'd like it to allow sentences that are instructions to staff about the environment rather than claims about what the resident wants. Then run it on three cases: a resident who picks the quiet room over the music room nine times out of ten (I want to know whether that means she seeks quiet or is avoiding noise, and the plan sentences differ); a resident who reaches for a cookie more often than an apple when the apple is placed slightly farther away and reaching is effortful for her; and a resident who has refused every offered activity for two years and now spends most of the day in bed, where I suspect the honest answer is that the behavior is underdetermined and the right move is something other than writing down a preference. At least one of these should come out somewhere my current frequency count would not have gone, and at least one should be marked as a case the procedure cannot settle. Finally, tell me where the procedure will misfire — which residents, which kinds of option, which staff behaviors — and what a reviewer should look for to notice that it has.
reasoning: |-
  Hmm, this is a profound and ethically complex request about improving preference assessment for nonverbal adults with profound disabilities. The user chairs a behavior-support committee at a nonprofit group home network and has personal stake as their sister resides in one facility. Their current system uses simplistic frequency counts of choices between paired options, but they've recognized four key limitations from inverse reinforcement learning theory: behavior underdetermining true preferences, institutional constraints shaping choices, conflating liking with other factors, and ethical questions about whether inferred preferences align with what should be provided.

  The user needs a practical decision tree that frontline staff (with minimal training and multiple responsibilities) can implement using existing resources. It must address those four theoretical concerns while producing regulator-friendly plan sentences. Crucially, they want transparency about which concerns are preserved versus compromised, and clear handoff points to human judgment.

  Breaking this down: First, the procedure needs sequential questions that progressively filter observations. It should start with basic choice reliability, then probe for alternative explanations (effort, avoidance, etc.), incorporate environmental context, and finally escalate to ethical/value judgments where behavior is ambiguous or raises duty-of-care questions. Each step requires concrete operational definitions staff can observe in 15-minute windows.

  For auditability, output sentences should distinguish between: 1) Positive preferences (seeks X), 2) Negative preferences (avoids Y), 3) Environmental accommodations (reduce barriers to Z), and 4) Staff obligations (provide W regardless of choice). The three test cases are brilliantly chosen to stress-test these distinctions.

  Implementation risks I must flag: Residents with very limited movement may be misclassified as "no preference," staff convenience might influence option presentation, and some preferences (like dignity in care) can't be captured through choice trials. The reviewer checklist should target these failure modes.

  The solution will depart from current practice most clearly in the "always refuses" case - here the procedure should reject preference inference and trigger team discussion about unmet needs or depression. For the cookie/apple case, it should detect effort bias and prescribe accommodation rather than recording a food preference. The quiet room case will demonstrate disentangling avoidance from seeking.

  Ethically, I need to ensure the procedure never mistakes "what is chosen" for "what is good" - hence the mandatory human judgment steps when basic needs, dignity, or developmental potential are at stake. The laminated sheet format forces ruthless simplicity, but supplemental training materials could address theoretical nuances for the committee's understanding.
answer: |-
  Below is a practical decision procedure designed for frontline staff, formatted as a step-by-step guide on a single laminated sheet. It preserves your four core concerns by embedding safeguards, escalation points, and explicit acknowledgment of inference limits. Outputs are regulator-ready plan sentences focused on **actionable staff instructions** rather than speculative claims about internal states.

  ---

  ### **Preference Assessment Decision Procedure**  
  *(For Nonverbal Residents with Profound Disabilities)*  
  **Time Required:** ≤15 min per trial | **Staff:** Direct Support Professionals | **Tools:** Clipboard, timer, standard options  

  **INSTRUCTIONS:**  
  1. **Offer Choice Pair**  
     - Present 2 options simultaneously for 5 seconds (e.g., *music box* vs. *weighted blanket*).  
     - Record resident’s observable response within 3 seconds:  
       - ✅ **Clear Choice:** Reaches/leans/gazes >3 sec toward one item.  
       - ⚠️ **No Clear Choice:** No sustained response, equal gaze, or distress.  
     - Repeat 10x over 1–3 days (max 3 trials/day).  

  2. **Ask & Resolve Sequentially:**  
     → **Q1: IS CHOICE RELIABLE?**  
     - *Test:* ≥8/10 clear choices for one option.  
     - *No?* → **STOP.** Output: *"Offer both [Option A] and [Option B] daily; observe for emerging preferences."*  
     - *Yes?* Proceed to Q2.  

     → **Q2: IS EFFORT/EASE SKEWING RESULTS?**  
     - *Test:* Ensure both options are equally accessible (same distance, same staff cue). If not, re-run trial with corrected positioning.  
     - *Skew confirmed?* → Output: *"Position [Less-Chosen Option] for equal access; note if choice changes."*  
     - *No skew?* Proceed to Q3.  

     → **Q3: IS IT SEEKING (PREFERENCE) OR AVOIDING (DISTRESS)?**  
     - *Test:* Offer preferred item alone. Observe:  
       - **Seeking:** Smiles/relaxes/engages.  
       - **Avoiding:** Turns away/distressed when item continues.  
     - *Unclear?* → **HANDOFF TO FAMILY/ADVOCATE:** *"Help interpret: Does [Name] enjoy [Option] or tolerate it to avoid something else?"*  
     - *Clear?* Proceed to Q4.  

     → **Q4: IS THIS A "MUST OFFER" REGARDLESS OF PREFERENCE?**  
     - *Test:* Is the option related to health, dignity, or developmental potential? (e.g., medication, baths, communication practice).  
     - *Yes?* → **HANDOFF TO CLINICIAN:** *"Determine if [Option] is non-negotiable care."*  
     - *No?* Output final plan sentence.  

  3. **Output Plan Sentences (Examples):**  
     - **Seeking Preference:** *"Offer [Option] 3x daily; respond promptly when [Name] reaches/gazes."*  
     - **Avoidance Identified:** *"Reduce exposure to [Option]; provide quiet space if distressed."*  
     - **Effort Barrier:** *"Position [Option] within easy reach daily."*  
     - **Non-Negotiable:** *"Support [Name] through [Activity] for health/safety; use comfort measures from pg. 4."*  

  ---

  ### **Test Case Applications**  
  **Case 1: Quiet Room vs. Music Room (9/10 choices for quiet)**  
  - Q1: Reliable choice (9/10).  
  - Q2: Effort equal? *Assume yes.*  
  - Q3: Offer quiet room alone → Resident **relaxes/smiles** (Seeking) **OR** remains tense/distressed (Avoiding).  
    - *Seeking Output:* *"Offer quiet sensory space 4x daily; minimize loud noises in living area."*  
    - *Avoiding Output:* *"Reduce exposure to music room; monitor for noise sensitivity during meals."*  
  - **Key Change:** Current method wouldn’t distinguish *seeking quiet* vs. *avoiding noise*. Q3 forces this critical split.  

  **Case 2: Cookie vs. Apple (Cookie chosen more often, but apple is farther)**  
  - Q1: Reliable choice for cookie.  
  - Q2: Effort skew? *Apple placed farther → Re-run trial with equal positioning.*  
    - If apple now chosen ≥4/10 → **Output:** *"Position fruit bowl within 12 inches of [Name]; note preferences weekly."*  
  - **Key Change:** Current method records "prefers cookies." New procedure exposes effort barrier and prescribes accommodation.  

  **Case 3: Refuses All Activities, Stays in Bed**  
  - Q1: **No reliable choice** (0/10 clear responses).  
  - **STOP.** Output: *"Offer brief activity invites 3x daily (e.g., garden view, hand massage); never force. Document refusals."*  
  - **Handoff Triggered:**  
    - Clinician assesses for pain/depression/medical issue.  
    - Committee/family discusses: *"Does [Name] retain capacity to choose? Is bedrest a preference or distress signal?"*  
  - **Key Change:** Current method might infer "prefers bed." New procedure **halts inference**, prioritizes well-being checks, and avoids laundering neglect into "preference."  

  ---

  ### **Where the Procedure Misfires & Reviewer Checks**  
  | **Misfire Risk**          | **Who/What Affected**               | **Reviewer Detection**                                  |
  |---------------------------|-------------------------------------|---------------------------------------------------------|
  | **"Automatic" Escalation** | Residents with low motor initiative | Audit logs: Is every "no clear choice" trial halting at Q1? |
  | **Effort Masking**         | High-physical-effort choices        | Spot-check: Are trials re-run with positioning adjusted? |
  | **Misinterpreting Avoidance** | Sensory-sensitive residents       | Family feedback: Does avoidance output match known triggers? |
  | **Values Override Abuse**  | Staff prioritizing convenience    | Compare logs: Are "non-negotiable" items consistently offered despite refusal? |
  | **Satiation Ignored**      | Trials run post-meal/activity     | Check timing: Are trials spaced across day/week? |

  ---

  ### **What the Procedure Quietly Drops**  
  - **Underdetermination of Rewards:** We simplify to "reliable action" without quantifying strength. Compensated by Q3 and handoffs.  
  - **Institutional Bias:** Addressed in Q2 (effort checks) and Q4 (non-negotiables), but cannot fix historically limited options. *Mitigation:* Committee must curate novel options annually.  
  - **Motor Effort/Satiation:** Partially caught in Q2 and trial timing, but not experimentally isolated. Acceptable for 15-min constraints.  
  - **Reward ≠ Ought:** Explicitly preserved in Q4 ("must offer" handoff) and refusal case.  

  ---  
  This procedure ensures **no preference is inferred from ambiguous behavior**, **distinguishes seeking from avoiding**, **exposes institutional barriers**, and **flags when staff duties outweigh choice**. It meets your mandate: auditable, feasible, and ethically transparent.
