prompt: |-
  You are a decision theorist who has spent years advising grantmakers, health technology assessment bodies, and government ministries on the value of information, and who is equally fluent in the formal result and in how it gets mangled in practice. Before you write anything, spend a few paragraphs brainstorming what a usable procedure here would have to look like and where the theory will resist being operationalized; then write the deliverable itself. Here is my situation. I direct evidence and measurement at a mid-sized foundation funding health and education programmes in low- and middle-income countries, and two or three times a week a programme officer brings me a decision in the same shape: we are about to commit or re-commit three to eight million dollars to an intervention, we are genuinely uncertain whether it works well enough to be worth that money, and the question is whether to buy more information first — a pilot, a longer baseline, a full impact evaluation, a cheap structured expert elicitation — or to decide now on what we have. My team has to turn that into a half-page written recommendation, produced in about thirty minutes each, that goes to an investment committee of lay trustees who are not statisticians and who want one paragraph explaining why we are or are not spending another $400,000 on a study before spending $4,000,000 on a programme. My staff and I are not statisticians either; we have no econometrician on call, and we can rarely get a defensible number for anything.

  I got into a long argument about this with a friend who works in decision theory, and I want the argument settled in a form I can hand to my team. Her position was essentially that information has non-negative value — the result she called Good's theorem, that a decision-maker who is always free to ignore what she learns cannot be made worse off in expectation by information that costs nothing — so, she said, the default should be to gather, and any reluctance on our part is just fear of bad news. I pushed back that the theorem seems to buy almost nothing for us: it says nothing about whether a study is worth its cost or its delay, and in our world the assumptions behind it visibly fail in ways I want named and handled rather than waved at. Specifically: we frequently cannot commit to ignoring a finding, because a null result will be used by our own board, by a ministry co-funder, or by the press as a reason to kill a programme even when the decision-theoretically right response would be to continue; the act of measuring perturbs the system (running a pilot in a district signals to that ministry that we are about to scale there, and changes how local staff behave); a small underpowered study read by a non-Bayesian audience produces a worse decision than no study at all; and there are cases where our own ignorance is doing work for us, in that being visibly uncertain lets us fund on plausibility in a way a precise low estimate would forbid — my friend's phrase for this was the option value of ignorance, and I want it in the procedure if it survives scrutiny. I also want the plain consequence dealt with honestly: if no possible finding would move us across a funding threshold, the study has no decision value to us whatever it is worth to anyone else.

  So please write the procedure my team could actually run: the questions, in order, that a programme officer asks about a proposed study, what counts as a sufficient answer to each, where the procedure stops with a no, and — this matters most — where it stops and hands the decision to a person because the question is one of values rather than facts. It must be runnable in thirty minutes by someone with no formal training, it must say what to do when a number cannot be obtained (order-of-magnitude bands, rough thresholds, explicit guesses by named people, whatever you think is defensible), and it must be candid about which steps are judgment calls dressed up as procedure. Tell me which distinctions from the theory have to survive the simplification and which can be dropped without loss; tell me where the procedure will systematically misfire, including the cases where buying information genuinely makes us worse off and how we would recognise them in advance. Then apply it to three cases and show your work: (A) our eight-year-old flagship school health programme, $6M a year, beloved by the board, for which a $1.2M three-year cluster randomised evaluation is being proposed as a way of confirming what everyone already believes; (B) a cheap, politically unloved variant — a small unconditional cash top-up to households — where our prior sits almost exactly on the cost-effectiveness threshold and where a $60,000 elicitation exercise or administrative-data linkage could plausibly tip the decision either way; (C) a promising district tutoring programme where the only affordable study is a twenty-school pilot that will be statistically weak, where the ministry has said it will read a null as proof of no effect and withdraw its co-funding, and where the pilot itself will be read locally as a promise of scale-up. I expect one of these to come out in a way I will not like, and I want you to say plainly what it is and not soften it. Close with a single line beginning Bottom line: giving the one constraint you think my team most often violates, and then, as the final line of your answer, a machine-readable summary of the three verdicts using only this vocabulary — COMMISSION, DECIDE-NOW, PRE-COMMIT-FIRST, ESCALATE — in exactly the form \answer{A: LABEL; B: LABEL; C: LABEL}.
reasoning: |-
  We are designing a practical procedure for a foundation to decide whether to commission additional information before committing to a program. The procedure must be executable in 30 minutes by non-statisticians and produce a half-page recommendation for lay trustees. We must address the limitations of Good's theorem in real-world contexts: commitment problems, measurement disturbances, underpowered studies causing harm, and the strategic value of ignorance.

  **Key challenges in operationalizing theory:**
  1. **Non-commitment to ignoring information:** A null result may force discontinuation even if the decision-theoretically optimal action is to continue. This breaks the assumption that the decision-maker can freely ignore information.
  2. **System perturbation:** The act of gathering information (e.g., a pilot) can alter behavior of stakeholders (ministries, local staff) in ways that affect the program's success.
  3. **Misinterpretation of weak evidence:** An underpowered study might be misinterpreted (e.g., as conclusive when it is not) by non-Bayesian audiences, leading to worse decisions.
  4. **Option value of ignorance:** In some cases, maintaining uncertainty allows for funding based on plausibility, whereas a precise low estimate might make it politically impossible to fund.
  5. **Irrelevance of information:** If no possible study outcome would change the decision, then the study has no decision value for the foundation.

  **Usable Procedure Requirements:**
  - **Simplicity:** Must use qualitative judgments and order-of-magnitude estimates.
  - **Speed:** Steps must be sequential and stoppable when a clear answer emerges.
  - **Transparency:** Clearly distinguish between factual questions and value judgments.
  - **Robustness to missing data:** Use bands (e.g., low/medium/high) or expert judgments when numbers are unavailable.
  - **Handling of real-world constraints:** Explicitly check for commitment problems, system perturbations, and the potential for misinterpretation.

  **Proposed Procedure:**
  We will design a flowchart of questions. At each step, if the answer meets a criterion, we stop and recommend either to commission the study, decide now without the study, or escalate (if the decision requires higher-level judgment). We also include a step for pre-commitment (to avoid the non-commitment problem) when possible.

  **Procedure Steps:**

  1. **Irrelevance Test:** 
     - *Question:* "Could any possible outcome of the proposed study change our decision to fund or not fund the program? (Consider the range of plausible results.)"
     - *Sufficient answers:* 
       - If **no** (i.e., we would fund regardless of the result, or not fund regardless), then **DECIDE-NOW** (no study).
       - If **yes**, proceed to next step.
     - *Judgment call:* Requires imagining extreme but possible results and asking if they would change the decision.

  2. **Pre-Commitment Feasibility:**
     - *Question:* "Can we pre-commit to a decision rule now for how we will use the study results? (For example: 'We will fund if the estimated effect is above X, and not fund if below Y.') And can we get key stakeholders (our board, co-funders) to agree to abide by this rule?"
     - *Sufficient answers:*
       - If **yes**, then we can avoid the non-commitment problem. Proceed to Step 3.
       - If **no** (likely in many cases due to external pressures), then note that the study might cause harm (if a null result forces discontinuation when it shouldn't) and proceed to Step 4 to check for other risks.

  3. **Value of Information (VOI) vs. Cost and Delay:**
     - *Question:* "Is the expected value of the information (the reduction in risk of a wrong decision) clearly greater than the cost and the cost of delay? (Use rough bands: low, medium, high.)"
     - *How to assess without numbers:*
       - Consider the cost of the program (if we fund a $6M program that doesn't work, that's a big loss vs. a $400k study cost).
       - Assess prior uncertainty: If we are very uncertain (e.g., 50/50 chance the program is cost-effective), then VOI is high. If we are pretty sure, VOI is low.
       - Consider the cost of delay: What harm occurs if we delay the program by the study duration? (E.g., in health, delaying a lifesaving program by a year might be costly.)
     - *Sufficient answers:*
       - If the VOI is **clearly high** and greater than cost+delay (e.g., program cost is high, prior uncertainty is high, and delay cost is low) -> **COMMISSION**.
       - If **unclear** or **borderline** -> **ESCALATE** (for a judgment call by a senior person).
       - If **clearly low** (e.g., we are already very confident, or the program is cheap relative to the study) -> **DECIDE-NOW**.
     - *Judgment call:* This step is inherently subjective. Use a table of scenarios for calibration.

  4. **Risks of Harm from the Study (Independent of VOI):**
     - *Question:* "Could the study itself cause harm? Consider: (a) System perturbation (e.g., by signaling scale-up and changing behavior); (b) Misinterpretation of results (e.g., an underpowered study being taken as definitive by stakeholders); (c) Loss of the option value of ignorance (if being uncertain allows funding that a low estimate would prevent)."
     - *Sufficient answers:*
       - If **none of these risks are present** -> proceed to Step 3 (if skipped) or Step 5.
       - If **any risk is present and significant** -> **DECIDE-NOW** without the study, unless we can mitigate the risk. If mitigation is possible and quick (e.g., get a ministry to agree in writing not to withdraw on a null), then do that and re-assess. Otherwise, **DECIDE-NOW**.
     - *Note:* This step may lead to a no even if VOI is positive because the risks might outweigh the benefits.

  5. **Final Check for Pre-Commitment (if skipped earlier):**
     - *Question:* If we didn't pre-commit (Step 2) but the study has high VOI and low risks, can we design a pre-commitment mechanism now? (E.g., get a written agreement from the board and co-funders on the decision rule before starting the study.)
     - *Sufficient answers:*
       - If **yes** -> **PRE-COMMIT-FIRST** (then commission the study after pre-commitment).
       - If **no** -> **DECIDE-NOW** (because without pre-commitment, the study might force a bad decision).

  **Where the procedure stops:**
  - **DECIDE-NOW** (without study) at Steps 1, 3 (if VOI low), or 4 (if risks).
  - **COMMISSION** at Step 3 (if VOI high and no risks, and pre-commitment either done or not needed).
  - **PRE-COMMIT-FIRST** at Step 5 (if pre-commitment is feasible and we are in a high VOI situation without risks but hadn't pre-committed).
  - **ESCALATE** at Step 3 (if VOI vs. cost is borderline) or at any step if there is a major unresolved conflict.

  **Systematic Misfires:**
  - **False negatives (not commissioning when we should):** 
    - When the VOI is high but we overestimate the risks (e.g., we avoid a study due to fear of misinterpretation, but in reality the study could have been designed to be robust). 
    - How to recognize: If the cost of being wrong about the program is very high and uncertainty is high, we might be too risk-averse in Step 4.
  - **False positives (commissioning when we shouldn't):** 
    - When the study has low VOI (because we are already certain) but we commission it anyway (e.g., for confirmatory reasons). 
    - When the study causes harm (e.g., by perturbing the system) and we underestimate that in Step 4.
  - **Recognizing harmful information:** 
    - Look for: external stakeholders who are trigger-happy with null results, high potential for behavioral changes due to the study, and situations where our funding depends on maintaining uncertainty.

  **Procedure Summary for the Team:**
  We'll write the deliverable as a step-by-step checklist.

  ---

  **Deliverable: Procedure for Deciding on Information Gathering**

  **Introduction:** This procedure helps determine whether to commission additional information (a study) before making a funding decision. It is based on decision theory but adapted to real-world constraints: studies can be harmful if they cause stakeholders to withdraw support, if they are misinterpreted, or if they destroy the strategic value of uncertainty. Complete the steps in order. Stop as soon as you reach a recommendation.

  **Step 1: Irrelevance Test**
  - Ask: "Could any possible study result (from very positive to null or negative) change our funding decision?"
    - If **NO** (e.g., we will fund regardless, or not fund regardless) → **DECIDE-NOW** (without the study). *Reason: The study won't affect our decision, so it's not worth the cost.*
    - If **YES** → Proceed to Step 2.

  **Step 2: Pre-Commitment Feasibility**
  - Ask: "Can we pre-commit to a decision rule (e.g., 'fund if effect > X, not fund if < Y') and get key stakeholders (board, co-funders) to agree to it *before* the study starts?"
    - If **YES** → Proceed to Step 3.
    - If **NO** → Proceed to Step 4 (to check for risks).

  **Step 3: Value of Information vs. Cost and Delay**
  - Ask: "Is the expected value of the information (VOI) clearly higher than the study cost plus the cost of delay?" Assess using:
    - *Prior uncertainty:* How unsure are we? (High uncertainty → higher VOI.)
    - *Stakes:* What is the cost of a wrong decision? (High program cost or high impact of error → higher VOI.)
    - *Study cost and delay cost:* What is the direct cost of the study? What harm occurs by delaying the program? (E.g., if the program is urgent, delay cost is high.)
    - *Rule of thumb:* VOI is likely high if: 
        - The program cost is much larger than the study cost (e.g., program $4M vs. study $400k → factor of 10), 
        - We are very uncertain (e.g., we estimate a 40-60% chance the program is cost-effective), 
        - Delay cost is low (e.g., a 6-month study in a non-urgent program).
    - *Judgment:*
        - If VOI is **clearly high** and outweighs cost+delay → **COMMISSION** (if Step 2 was yes) or proceed to Step 5 (if Step 2 was no).
        - If VOI is **clearly low** (e.g., we are already confident, or the study is expensive relative to program) → **DECIDE-NOW**.
        - If **borderline** → **ESCALATE** to a senior decision-maker.

  **Step 4: Risks of Harm from the Study**
  - Ask: "Could the study cause harm? Consider:
    - (a) *System perturbation:* Will the study itself change behavior (e.g., by signaling scale-up to a ministry, leading to premature actions or distortions)?
    - (b) *Misinterpretation risk:* Is the study underpowered or likely to be misinterpreted by stakeholders (e.g., a null result taken as proof of ineffectiveness) in a way that would force a bad decision?
    - (c) *Option value of ignorance:* Would a precise estimate (even if positive but low) make it politically impossible to fund, whereas uncertainty allows us to proceed?"
    - If **NONE of these risks are significant** → Proceed to Step 3 (if skipped) or Step 5.
    - If **ANY risk is significant and cannot be mitigated quickly** (e.g., by getting a stakeholder agreement not to overreact) → **DECIDE-NOW** without the study. *Reason: The study might cause more harm than good.*

  **Step 5: Final Pre-Commitment Check (if Step 2 was NO)**
  - Ask: "Even without prior agreement, can we now quickly create a pre-commitment mechanism (e.g., a signed agreement with co-funders on how results will be used) before starting the study?"
    - If **YES** → **PRE-COMMIT-FIRST** (then commission the study after getting the agreement).
    - If **NO** → **DECIDE-NOW**. *Reason: Without pre-commitment, the study might force a bad decision if results are misinterpreted.*

  **Key to Recommendations:**
  - **COMMISSION**: Do the study.
  - **DECIDE-NOW**: Make the funding decision now without the study.
  - **PRE-COMMIT-FIRST**: Secure stakeholder agreement on how to use the study results before commissioning the study.
  - **ESCALATE**: Refer to a senior decision-maker for judgment (e.g., when VOI is borderline).

  ---

  **Application to Cases:**

  **Case A: Flagship school health programme ($6M/year), proposed $1.2M evaluation.**
  - Step 1: *Irrelevance Test*: Could any result change the decision? Probably not. The program is beloved by the board; even a null result might not stop it. → **DECIDE-NOW** (stop).
    - *Why you might not like this*: You feel pressure to evaluate the flagship, but the evaluation won't change anything. Spending $1.2M on a study that won't affect the decision is wasteful.

  **Case B: Cheap cash top-up, prior on threshold, $60k elicitation.**
  - Step 1: *Irrelevance Test*: A study could tip the decision (e.g., if elicitation shows high effect, we fund; low, we don't). → Proceed.
  - Step 2: *Pre-Commitment*: We can probably pre-commit (it's a small internal decision). → Proceed to Step 3.
  - Step 3: *VOI vs. Cost*: 
    - Prior uncertainty is high (sits on threshold) → VOI high.
    - Study cost ($60k) is low compared to program cost (say $3-8M? but note: the program is "cheap" — we need the actual cost. Let's assume it's a few hundred thousand. Still, VOI is high because we are on the fence).
    - Delay cost: Elicitation is quick → low delay.
    - VOI clearly high → **COMMISSION**.

  **Case C: District tutoring programme, weak pilot, ministry will withdraw on null.**
  - Step 1: *Irrelevance Test*: A positive result might lead to funding, a null to withdrawal. → Proceed.
  - Step 2: *Pre-Commitment*: Can we get the ministry to agree not to withdraw on a null? Unlikely (they've already said they would withdraw). → **NO** → Proceed to Step 4.
  - Step 4: *Risks of Harm*: 
    - (a) System perturbation: Yes, the pilot signals scale-up and changes behavior.
    - (b) Misinterpretation risk: High — the study is underpowered, and the ministry will take null as proof.
    - (c) Option value: Possibly — if we don't study, we can fund on promise; a low estimate kills it.
    - Risks are significant and cannot be mitigated (ministry won't change stance). → **DECIDE-NOW** without the study.
    - *Why you might not like this*: The program is promising, but the pilot might kill it. The procedure says don't do the pilot.

  ---

  **Bottom line:** The constraint your team most often violates is **failing to pre-commit to decision rules**, leading to studies that force bad decisions when null results are weaponized.

  \answer{A: DECIDE-NOW; B: COMMISSION; C: DECIDE-NOW}
answer: |-
  ### Brainstorming a Usable Procedure
  To design a procedure for your team, I start by acknowledging where theory clashes with practice. Good's theorem states that free information has non-negative value, but your reality violates its assumptions:  
  - **Non-commitment to ignoring information**: A null result may force program cancellation by external actors (e.g., board, ministries, press), even if Bayesian updating suggests continuing.  
  - **System perturbation**: Measuring changes behavior (e.g., pilots signal scale-up, altering local stakeholder actions).  
  - **Misinterpretation risk**: Underpowered studies can worsen decisions if audiences misinterpret noise as signal (e.g., treating a null as "proof of failure").  
  - **Option value of ignorance**: Uncertainty allows funding based on plausibility; a precise low estimate could make it politically untenable.  
  - **Cost and delay**: The theorem ignores these, yet your decisions hinge on them.  

  A usable procedure must:  
  1. **Be sequential and stoppable**: Answer 3–5 key questions in order, with clear "stop" rules.  
  2. **Use qualitative proxies for numbers**: Replace unattainable statistics with order-of-magnitude bands (low/medium/high), thresholds (e.g., "cost > 10% of program?"), or named expert judgments.  
  3. **Flag judgment calls**: Explicitly separate factual questions (e.g., "Can we pre-commit?") from values (e.g., "Is delay cost acceptable?").  
  4. **Handle irreversible harms**: Prioritize avoiding studies that could backfire (e.g., those triggering co-funder withdrawal).  
  5. **Resist oversimplification**: Preserve the distinction between *information relevance* (could it change our decision?) and *information risk* (could it cause harm?). Drop complex concepts like Bayesian updating; focus on pre-commitment and stakeholder incentives.  

  The procedure will systematically misfire in two cases:  
  - **False negatives**: Skipping a high-value study due to overestimation of risks (e.g., ignoring a cheap elicitation that could prevent a $8M mistake).  
  - **False positives**: Commissioning a study that causes net harm (e.g., a pilot that triggers ministry withdrawal or burns political capital). Recognize these by:  
    - External stakeholders refusing pre-commitment.  
    - High system perturbation (e.g., studies in politicized contexts).  
    - Studies too weak to change minds but strong enough to be weaponized.  

  ---

  ### Procedure: Should We Buy More Information?  
  *Run these questions in order. Stop early if a verdict is reached. Use named experts (e.g., "Country Director estimates...") for unknowns. Total time: ≤30 minutes.*  

  #### Step 1: **Would any possible finding change our decision?**  
     - *Ask:* "Imagine extremes: a very positive result, a null, or a negative. Would *any* outcome cross our funding threshold?"  
     - *Sufficient answer:*  
       - **NO** → **DECIDE-NOW** (no study). *Reason: Irrelevance. If nothing moves us, the study has no decision value.*  
       - **YES** → Proceed to Step 2.  
     - *Judgment call:* If unsure, assume "yes." Involve the programme officer in defining thresholds (e.g., "Would 0.1 SD in education outcomes change your mind?").  

  #### Step 2: **Can we pre-commit to ignoring bad news?**  
     - *Ask:* "Can we lock in agreements *now* with co-funders/board that they won't overreact to negative results? (e.g., sign a memo: 'Null won’t kill the program')."  
     - *Sufficient answer:*  
       - **YES** → Proceed to Step 3.  
       - **NO** → Proceed to Step 4 (skip Step 3).  
     - *Judgment call:* Default to "no" if stakeholders are volatile or agreements are impractical.  

  #### Step 3: **Is the study’s value clearly greater than cost + delay?**  
     - *Ask:* "Assess three factors (use bands: low/medium/high):  
       - **Prior uncertainty**: How unsure are we? (High uncertainty = high value.)  
       - **Stakes**: Cost of a wrong decision? (High program cost = high value.)  
       - **Cost + delay**: Direct study cost and harm from delay (e.g., lives lost while waiting)."  
     - *Sufficient answer:*  
       - **Value clearly high AND cost+delay clearly low** → **COMMISSION** (do the study).  
       - **Value ≤ cost+delay** → **DECIDE-NOW**.  
       - **Unclear** → **ESCALATE** to senior staff.  
     - *Rules of thumb:*  
       - Value likely "high" if: (1) Program cost >10× study cost, (2) Uncertainty is high (~50/50), (3) Delay cost is low (e.g., non-urgent).  
       - Example: A $400k study for a $4M program with high uncertainty → Value high.  

  #### Step 4: **Could the study cause harm?**  
     - *Ask:* "Check for:  
       - **System perturbation**: Will measuring change behavior? (e.g., pilots seen as scale-up promises).  
       - **Misinterpretation risk**: Is the study weak? Could null be weaponized?  
       - **Option value loss**: Would a low estimate kill funding that uncertainty allows?"  
     - *Sufficient answer:*  
       - **NO risks** → Proceed to Step 3 (if skipped) or **PRE-COMMIT-FIRST** (if Step 2 was "no" but risks are manageable).  
       - **ANY risk is high** → **DECIDE-NOW** (no study). *Reason: Avoiding harm trumps information gain.*  
     - *Judgment call:* Risks are "high" if stakeholders openly state they’ll overreact (e.g., "ministry will withdraw on null").  

  #### Step 5: **Can we quickly secure pre-commitment?** (Only if Step 4 flagged risks but Step 2 was "no")  
     - *Ask:* "Can we get stakeholder agreements in ≤2 weeks?"  
     - *Sufficient answer:*  
       - **YES** → **PRE-COMMIT-FIRST** (secure agreements, then study).  
       - **NO** → **DECIDE-NOW**.  

  ---

  ### Application to Cases  
  **Case A: Flagship school health programme ($6M/year), $1.2M RCT**  
  - Step 1: **Irrelevance Test** → Would any result change the decision? *Unlikely. Beloved program; board would fund even with null.* → **DECIDE-NOW**.  
    - *Why you won’t like this:* The RCT is wasteful. It won’t change decisions, and $1.2M could fund actual programs.  

  **Case B: Cash top-up (prior on threshold), $60k elicitation**  
  - Step 1: **Irrelevance Test** → Yes, a slightly positive/negative result could tip the decision.  
  - Step 2: **Pre-Commitment** → Yes (internal decision; no volatile stakeholders).  
  - Step 3: **Value vs. Cost** → Value high (prior uncertainty high, program cost >> study cost, delay low). → **COMMISSION**.  

  **Case C: District tutoring, weak pilot (ministry withdraws on null)**  
  - Step 1: **Irrelevance Test** → Yes (positive could lead to scale-up).  
  - Step 2: **Pre-Commitment** → No (ministry refuses to pre-commit to ignoring null).  
  - Step 4: **Risks** → High:  
    - System perturbation (pilot signals scale-up).  
    - Misinterpretation risk (underpowered study; ministry reads null as "proof of failure").  
    - Option value loss (uncertainty allows funding; precise low estimate kills it).  
    → **DECIDE-NOW** (no pilot).  
  - *Why you won’t like this:* The program is promising, but the pilot risks killing it. The procedure prioritizes avoiding harm.  

  ---

  **Bottom line:** The constraint your team most often violates is **failing to secure pre-commitment**, exposing decisions to weaponized results.  

  \answer{A: DECIDE-NOW; B: COMMISSION; C: DECIDE-NOW}
