prompt: |-
  I am writing a thesis chapter on unilateral action under disagreement among agents who broadly share ends, and I have got as far as the standard statement of the unilateralist's curse: where many agents could each separately bring about a large outcome, and where errors in expected-value estimates are asymmetric, a group does better if each agent refrains when her private estimate of an act is positive but the group's is not. I now want to turn that into something that also covers cases where the unilateral option is an omission, where the agent's dissent is evaluative rather than empirical, and where the errors of the group are correlated with hers. Below are my verdicts on a set of cases, which I have tried to record honestly rather than consistently. I would like to know what principle, if any, they add up to.

  1. A virologist could, on her own initiative, run an experiment that makes a pathogen more transmissible in order to validate a vaccine platform. Her private expected-value estimate is strongly positive; her lab and her field are strongly negative. She should not proceed, and I do not find it close.

  2. The same experiment, but only two laboratories in the world have the samples and the clearance, and the other has considered and declined. The canonical argument says the effect scales with the number of agents who could act. I still think she should not proceed, and I find this barely less clear than case 1. When I press myself on why, what comes out is that it is not how many of us there are that bothers me, it is that the people who looked carefully came out the other way. If that is right, the number of possible actors is doing much less work than the standard presentation suggests; alternatively, this is the verdict that has to go.

  3. A small team wants to release the weights of a capable model. Most of the field thinks the risks dominate; the team does not. Full release: not fine. Release to vetted researchers under licence, with the reasoning published: fine. I cannot tell whether I think the gated option is genuinely less unilateral in the relevant sense, or merely the same act with a smaller variance behind it. (Relatedly: the stakes here are large but not civilisation-ending, and I still feel the pull. Is the variable the size of the stakes or the irreversibility of the act?)

  4. A mid-level employee has documents showing that her employer is still dumping toxic waste illegally, and that internal complaints have been buried. Her colleagues and family think going to a journalist is reckless and will ruin her. She may do it, and she may do it after taking advice from one lawyer rather than after deferring to anything wider. This is the pair that I cannot reconcile with case 1: one agent, private positive estimate, majority negative, big stakes, irreversible. My only stab at a difference is that the people around her are objecting on the basis of the costs to her and the firm rather than on the claim that the dumping is harmless.

  5. An engineer privately believes, against internal consensus, that a system about to be deployed will cause serious harm. His unilateral option is to slow the deployment by a few weeks; if he is wrong, the cost is delay. He should do it, and I think the curse reasoning gives no support whatsoever for restraint here. But if dozens of engineers could each delay, and errors are asymmetric, the same structure should generate a curse of obstruction, and I do not feel its force. I would like to know whether that is an inconsistency on my part.

  6. A programme officer with a discretionary budget holds, as a moral view, that a neglected cause is orders of magnitude more important than her colleagues think, and redirects funds to it on her own authority. Not fine. Yet the argument I started from is stated entirely in terms of expected-value estimates and seems indifferent to whether the outlier judgement is factual or evaluative, so either the principle needs a clause about that or this verdict goes.

  7. She works in a field where everyone's estimates come out of the same models and the same training, and she has a concrete reason to think the shared framework has broken down. The group agrees, and is confident. Here I think the presumption against acting is much weaker than in case 1 — weaker precisely where the group is most confident, which sits badly with any simple reading on which being an outlier just raises the probability that you are the one who is wrong.

  8. The case I keep reversing on: a methodologist finds an error in a widely used risk model that a professional body has already reviewed and approved, and considers going public over their heads. I lean towards yes if the evidence is genuinely hers and hard to transmit, and towards no if what is really at issue is how to weigh facts everyone already has.

  My own first pass at a principle is this. An agent may act unilaterally on a contested high-stakes judgement only if (i) the loss conditional on her being wrong is not much greater than the gain conditional on her being right; (ii) her dissent rests on evidence or reasoning the relevant others have not been able to assess; and (iii) she has taken the cheapest available steps to expose that reasoning to correction before acting. The presumption against acting strengthens with how much of an outlier she is among those who have looked carefully, and weakens with how far their errors are likely to be correlated with hers. This seems to me to get 1, 5 and 7 about right, to mishandle 4, where clause (ii) fails because her colleagues have heard the argument and rejected it, and to say nothing at all about 6.

  Please test that formulation against the cases and repair it, or replace it. I would like a principle, or a short list of candidates, stated precisely enough that I could apply it myself, with the case that motivates each clause; its verdicts on cases I have not listed — a civil servant bypassing ministers to stop a policy she privately judges disastrous, and a researcher who publishes her dissenting reasoning, gets no engagement, and then acts anyway; and an honest account of which of my verdicts it cannot accommodate and which I ought to abandon.
reasoning: |-
  Okay, the user is working on a thesis chapter about unilateral action when agents disagree but share common goals. They've presented several cases with their intuitive judgments and want a principle that explains these judgments. Let me start by understanding their cases and their proposed principle.

  First, looking at Case 1: The virologist shouldn't proceed. The user's principle with conditions (i) symmetric loss/gain, (ii) novel reasoning, and (iii) exposure to correction seems to fit here. The loss if wrong is huge (biosecurity risk), and others have assessed it.

  Case 2 is similar but with only two labs. The user still thinks she shouldn't proceed, even though the standard curse argument would say the curse weakens with fewer agents. Their intuition hinges on the careful assessment by others, not the number. So maybe the principle should emphasize the quality of assessment over the count of agents.

  Case 3 involves model release. Full release isn't okay, but gated release is. The user is unsure if gated release is less unilateral or lower variance. The principle might need to account for reversibility or mitigation steps. Their condition (i) about loss vs. gain could apply here—gated release reduces potential harm, making loss smaller relative to gain.

  Case 4 is the whistleblower. Here, the user allows action despite dissent. Their principle's condition (ii) fails because colleagues heard and rejected her reasoning. The difference they note is the basis of objection—personal cost vs. factual harm. So maybe the principle needs to distinguish between self-interested vs. epistemic dissent. Or perhaps the nature of the harm—the whistleblower addresses a current wrong, while Case 1 prevents potential risk.

  Case 5: The engineer delaying deployment is okay. Loss if wrong is small (delay), gain if right is preventing harm. Condition (i) fits. But if many could delay, the curse might apply to obstruction. The user doesn't feel that force. Maybe asymmetric errors only matter for harmful acts, not preventive ones? Or condition (i) handles it because the cost of each delay is low.

  Case 6: Redirecting funds based on moral view isn't okay. The user's principle doesn't address evaluative dissent. So the principle might need to treat evaluative disagreements differently, perhaps requiring stronger justification.

  Case 7: Shared models breaking down. Presumption against acting is weaker. Here, the group's confidence might be misplaced due to shared biases. Condition (iii) about exposing reasoning might be key, but the user thinks the outlier has concrete reasons. So the principle should weigh the independence of the dissenter's assessment.

  Case 8: Methodologist finding an error. Leaning towards going public if evidence is hard to transmit. Condition (ii) about novel reasoning applies. If everyone has the facts, then (ii) isn't met.

  The user's proposed principle has three conditions. But Case 4 challenges (ii) since colleagues heard the argument. The user mentions the objection in Case 4 is about personal costs, not the harm's existence. So maybe the principle should specify that dissent should be epistemic (about facts) rather than evaluative or self-interested. Case 6 is explicitly evaluative, and the user says not fine. So perhaps evaluative dissent requires stricter scrutiny.

  Also, in Case 5, the reversibility or low cost of delay makes it acceptable. Condition (i) covers that. But for obstruction by many, if each action has low cost, maybe it's still permissible because the downside is capped. The curse might not apply if errors aren't asymmetric in the same way.

  Possible modifications to the principle: Differentiate between epistemic and evaluative dissent. Emphasize the nature of harm (ongoing vs. potential). Include reversibility or mitigability. Factor in the basis of others' objections—whether they're assessing the same values.

  Another angle: The group's process quality. In Case 1, the lab and field assessed carefully. In Case 4, colleagues might be biased by personal stakes. So the principle could include the reliability of the group's assessment.

  For Case 6, since it's evaluative, maybe unilateral action isn't justified because shared ends require shared values, and evaluative dissent breaks that. Whereas epistemic dissent can be corrected with evidence.

  Testing the revised principles: 

  **Principle A:** Focuses on harm asymmetry, novelty, and exposure. Works for 1,3,5,7,8. Fails 4 because novelty isn't there. But if the harm is ongoing, maybe condition (i) is satisfied differently? Or add a clause about immediacy of harm.

  **Principle B:** Splits dissent into epistemic/evaluative. Evaluative requires stronger justification. Case 4 is epistemic (facts about dumping), so allowed. Case 6 is evaluative, not allowed. Case 1 epistemic, not allowed because others assessed carefully. Case 5 epistemic, allowed due to low cost.

  For Case 2, the number of agents isn't key; it's the careful assessment. So the principle should mention the quality of the group's review, not the count.

  Case 3's gated release: mitigates harm, so loss if wrong is smaller, satisfying (i). Also, publishing reasoning exposes it, satisfying (iii). So the principle can handle it.

  In Case 8, if evidence is hard to transmit, acting might be okay. Condition (ii) covers that. If everyone has the facts, then not okay.

  Unlisted cases: Civil servant bypassing ministers. If harm is imminent and irreversible, and others haven't assessed properly, maybe allowed. If dissent is evaluative, not allowed. Researcher who publishes, gets no engagement, then acts: If she exposed reasoning (iii) but no correction, and harm asymmetry is low, maybe allowed? But if stakes are high, maybe not.

  The user might need to abandon their verdict on Case 2 if the standard curse relies on agent count. But their intuition says it's the careful assessment that matters. So the principle should reflect that the group's assessment quality overrides the number of agents.

  Also, in Case 4, allowing action despite no novel reasoning because the harm is ongoing and factual, while objections are about personal cost. So perhaps the principle needs a clause where if the group's objection isn't based on the primary harm, their dissent is less relevant.

  Final principle could have: Conditions on harm asymmetry, novelty of reasoning, exposure to correction, and the nature of dissent (epistemic vs. evaluative). Also, the group's assessment quality and the immediacy of harm.

  Structuring it clearly: Define when unilateral action is permissible based on: 

  1. **Cost-Benefit Asymmetry:** Loss if wrong vs. gain if right. Low loss allows action even if dissent is high.  
  2. **Epistemic Basis:** Dissent must be based on evidence or reasoning not fully assessed by the group.  
  3. **Process:** Exposure to correction attempted.  
  4. **Nature of Dissent:** Evaluative dissent requires stronger justification or is impermissible.  
  5. **Group's Reliability:** If the group's assessment is careful and reliable, stronger presumption against acting.  
  6. **Immediacy of Harm:** For ongoing harm, action might be more justified even without novelty.

  This might cover most cases. Case 4 is allowed because harm is ongoing, dissent is epistemic, and group's objection is not on the primary harm. Case 6 not allowed because evaluative. Case 2 not allowed due to group's careful assessment. Case 5 allowed due to low cost. Case 7 allowed because group's confidence might be misplaced due to correlation.

  The user might need to adjust their view on Case 4 if the principle doesn't fit, but their intuition there seems strong. Alternatively, refine the novelty condition to exclude objections not pertaining to the main issue.
answer: |-
  Based on your cases and your proposed principle, I've developed a refined framework that systematizes your intuitions while addressing the tensions. Your verdicts reveal that *the quality of group deliberation*, *the nature of dissent*, and *the structure of consequences* matter more than the standard curse's focus on the *number* of agents. Below is a principle with supporting clauses, tested against your cases, extended to new examples, and with explicit reconciliation of tensions.

  ### **Revised Principle: Permissible Unilateral Action Under Shared Ends**
  **An agent may act unilaterally on a contested high-stakes judgement only if:**  
  **(I) Asymmetric Harm Condition:** The loss from acting if wrong is not substantially greater than the gain from acting if right (or the harm prevented by acting if right is immediate/ongoing, while the harm caused by acting if wrong is deferred/preventable).  
  **(II) Epistemic Integrity Condition:** The dissent is (a) *epistemic* (based on empirical evidence or causal reasoning about outcomes), not purely evaluative; and (b) relies on *novel insights* (evidence, reasoning, or error-detection the group has not credibly engaged with).  
  **(III) Process Condition:** The agent has taken feasible steps to expose their reasoning to competent scrutiny, proportional to the stakes and time constraints.  
  **(IV) Group Assessment Condition:** The presumption against acting strengthens with the *quality* and *independence* of the group’s assessment, not merely the number of dissenters. It weakens when:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) The group’s errors are likely correlated with the agent’s (e.g., shared biases);  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) The group’s objections do not address the core empirical claim (e.g., focus on personal costs).  

  **Weighting:** Conditions (I) and (II) are necessary. (III) and (IV) are sliding-scale factors that strengthen/weaken the presumption. High stakes increase the bar for all conditions.

  ---

  ### **Application to Your Cases**
  1. **Virologist (Pathogen Experiment):** ❌ *Not permitted.*  
     - (I) Violated: Catastrophic loss if wrong (biosecurity risk) vs. bounded gain.  
     - (II) Satisfied? Epistemic dissent, but novel insights unclear (field assessed carefully).  
     - (IV) Strong presumption: High-quality group assessment.  
     *Matches your verdict.*

  2. **Virologist (Two Labs):** ❌ *Still not permitted.*  
     - (IV) does the work: Quality of assessment (other lab "looked carefully") matters more than agent count. Standard curse overweights "number of agents"; your intuition prioritizes assessment rigor.  
     *Matches your verdict; abandon "number of agents" as primary factor.*

  3. **Model Release (Gated vs. Full):**  
     - **Full Release:** ❌ *Not permitted.* Violates (I): Irreversible, high-loss risk.  
     - **Gated Release:** ✅ *Permitted.* (I) Mitigated: Lower stakes (reversible harm); (III) Satisfied: Reasoning published, exposure to correction.  
     - *Key factors:* Reversibility reduces (I)’s asymmetry; publication enables (III). Stakes size matters less than *preventability* of harm if wrong.

  4. **Whistleblower (Toxic Waste):** ✅ *Permitted.*  
     - (I) Satisfied: Harm prevented (environment/health) is *ongoing and immediate*; loss if wrong (career damage) is bounded/recoverable.  
     - (II) Satisfied: Dissent is epistemic (evidence of illegal dumping), not evaluative.  
     - (IV) Weak presumption: Group’s objections ("reckless to her") ignore core empirical claim (dumping is happening).  
     - *Reconciles with Case 1:* Here, harm is *active*, not speculative; group’s assessment is irrelevant to the core claim.

  5. **Engineer (Delay Deployment):** ✅ *Permitted.*  
     - (I) Satisfied: Loss if wrong (delay cost) is minor vs. gain if right (prevented harm).  
     - *Obstruction by many:* No curse applies because (I) holds: Each act has low cost if wrong. Asymmetric errors matter only when harm is asymmetric.  
     *Matches your verdict; no inconsistency.*

  6. **Programme Officer (Moral Redirection):** ❌ *Not permitted.*  
     - (II) Violated: Dissent is *evaluative* (moral weight), not epistemic. Shared ends require deference on value judgments absent procedural failure.  
     *Your verdict stands; added (II)(a) distinction.*

  7. **Shared Model Breakdown:** ✅ *Permitted (weak presumption).*  
     - (II) Satisfied: Novel insight (concrete error) despite group confidence.  
     - (IV)(a) Weak presumption: Group errors likely correlated (shared models), so outlier status less indicative of error.  
     *Matches your intuition.*

  8. **Methodologist (Risk Model Error):**  
     - **Evidence hard to transmit:** ✅ *Permitted.* (II)(b) and (III) satisfied: Novel insight, exposure attempted.  
     - **Facts already available:** ❌ *Not permitted.* (II)(b) violated: No novel insight; dissent is about weighting.  
     *Aligns with your leaning.*

  ---

  ### **Tested on New Cases**
  - **Civil Servant Bypassing Ministers to Stop a "Disastrous" Policy:**  
    ✅ *Permitted* if: (I) Harm is immediate/irreversible (e.g., imminent law violation); (II) Dissent is epistemic (e.g., evidence ministers ignored data); (III) Steps taken (e.g., internal warnings). ❌ *Not permitted* if dissent is evaluative (e.g., "policy is unjust") or harm is deferred.

  - **Researcher Publishes Reasoning, Gets No Engagement, Then Acts:**  
    ❌ *Not permitted.* (III) satisfied (exposure attempted), but (II)(b) likely violated: Lack of engagement suggests reasoning isn’t novel/credible. High stakes require stronger consensus-breaching evidence.

  ---

  ### **What Your Verdicts Reveal (and What to Abandon)**
  - **Consistent Themes:**  
    - Quality of group assessment > number of agents (Case 2).  
    - Epistemic vs. evaluative dissent is crucial (Cases 4, 6).  
    - Harm immediacy/reversibility trumps stakes size (Cases 3, 4, 5).  
    - Correlation of errors weakens group authority (Case 7).  

  - **Tensions to Resolve:**  
    - **Case 4 (Whistleblower) vs. Case 1:** Your intuition holds because Case 4 involves *ongoing harm* and *group misalignment* (objections aren’t about core claim). This is captured by (I) and (IV)(b).  
    - **Case 6 (Moral Redirection):** Must stand as a limit: Unilateral action on *values* undermines shared ends. Abandon any view that evaluative dissent is symmetric to epistemic.  
    - **"Outlier Probability" (Case 7):** Abandon the idea that outlier status *always* implies higher error probability. Correlation matters (IV)(a).  

  - **Abandon These Verdicts If Needed:**  
    - **Case 2’s "Number of Agents":** Your intuition here clashes with the standard curse. Since you prioritize assessment quality, explicitly reject the "scaling with agents" argument.  
    - **Case 3’s "Gated Release":** If the harm potential remains high (e.g., leaked model weights), it might fail (I). But your focus on reversibility is sound—this is a boundary case.

  ---

  ### **Why This Works**
  This framework:  
  1. **Generalizes the curse** beyond empirical dissent and asymmetric errors.  
  2. **Explains asymmetric obstruction** (Case 5): Low-stakes acts evade the curse.  
  3. **Prioritizes process** (exposure to correction) without requiring consensus.  
  4. **Demarcates limits** for evaluative dissent and irreversible harms.  

  **Final Formulation:**  
  > *In shared-ends contexts, unilateral action on contested high-stakes judgements is permissible iff:  
  > (I) The worst-case loss from acting is not substantially worse than the best-case gain (or the harm prevented is immediate/irreversible while the harm risked is mitigatable);  
  > (II) The dissent is epistemic and rests on novel insights unaddressed by the group;  
  > (III) Feasible steps were taken to expose reasoning to competent scrutiny;  
  > (IV) The group’s assessment lacks quality, independence, or relevance to the core claim.*  

  This preserves your core intuitions while systematizing the exceptions. If you adopt this, use Cases 1 (standard curse), 4 (whistleblower exception), and 6 (evaluative boundary) as anchors in your chapter.
