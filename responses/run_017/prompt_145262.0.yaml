  3. **Mapping Breakdown and Disanalogies**

     The key disanalogy is that the ratchet does not accumulate a record. Its state (the pawl position) is reset continuously by the thermal bath (the jiggling). In contrast, the demon accumulates a record in the memory. 

     The ratchet's failure is due to detailed balance: the probability of the wheel moving forward is the same as backward because the pawl is at the same temperature. The demon's failure (when no blank tape is provided) is due to the accumulation of a record that must be erased, costing work.

     The ratchet can be seen as a special case of a demon whose memory is continuously and irreversibly reset by the bath. In the ratchet, the pawl is the memory: it "remembers" the last tooth it caught. But the thermal jiggling resets it (erases the memory) by letting it slip back. This reset is irreversible and dissipative. The cost of reset is paid by the bath, and it prevents net work extraction.

     Therefore, the ratchet is like a demon that resets its memory bit after every cycle by thermalizing it with the bath. The reset cost is paid by the bath, and it exactly cancels the work that would be extracted.

