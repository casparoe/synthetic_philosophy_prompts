prompt: |-
  I run a reading group on promissory obligation, and the argument has been going round in circles for a year, so I want a diagnosis rather than a verdict. One camp says the practice does the work: to promise is to invoke a social institution with a point — giving others reliable assurance about one's future conduct — and the obligation is to do what that institution, properly described, requires; whether keeping the promise does anyone any good is beside the point, and the wrong in breaking it is infidelity rather than harm. The other camp says a practice can only ever be a transmission mechanism: what matters is that the promisee has been given a normative power over the promiser's conduct, or that there is something intrinsically bad about being let down by someone one trusted, so a promise no one relies on, or whose keeping benefits no one, raises a quite different question. I am not asking about contracts or legal enforcement.

  My hypothesis is that these are not two answers to one question. One camp is asking what the practice we actually have requires of someone who has invoked it; the other is asking what would make such requirements genuine moral requirements rather than conventions. Each side slides between the two, so every exchange stalls: one side produces cases where the practice's rules and morality come apart, the other replies that those are cases where the practice has been misdescribed, and neither point is one the opposition ever denied. Behind that I suspect a further disagreement nobody argues for — about whether an act of will can generate a reason at all.

  Test it against a case I think neither side handles well. Call it the disowned promise: before Alf says anything, Bea tells him that she does not accept promises, does not want that kind of claim on him, and will not recognise one if he makes it. Alf promises anyway. Later Bea finds she has relied, is let down, and resents it. Is there a promissory obligation here, and if not, what is left? Now vary one feature: the same disclaimer, but the two have for years relied on each other's bare word, and Bea knows she will rely again.

  What kind of disagreement is this actually — verbal, a dispute about which cases count as data, or bedrock intuitions about the authority of the will? And given your diagnosis, what would count as progress? I would rather have a distinction that dissolves part of it, or an argument that no convergence should be expected, than another survey of the two positions.
reasoning: |-
  Okay, the user runs a reading group on promissory obligation that's been stuck in a circular debate for a year. They've identified two camps: one focused on the social practice itself (practice-internal view), and the other on the underlying moral mechanics (normative-power view). The user suspects these camps are answering different questions but keep talking past each other, and wants a diagnostic rather than verdict.

  Hmm, the core insight here is sharp - this isn't one debate but two entangled ones: descriptive institutional analysis vs. foundational moral justification. The sliding between these explains why arguments stall. When practice theorists point to institutional requirements, power theorists agree but say "that's just convention", and vice versa when power theorists cite moral harms, practice theorists say "that's not promising per se". 

  The disowned promise case is brilliantly chosen to expose this. In the basic version: Bea explicitly rejects promissory norms yet still experiences harm when Alf breaks his word. Practice theorists must deny this is promissory obligation (since no institution invoked), while power theorists see obligation-like harm regardless. The variation deepens it: when they have history of bare-word reliance, practice theorists might strain to call it "promising by another name", while power theorists see continuity.

  What's really beneath this? The user nails it - whether the will can create reasons ex nihilo. Practice theorists think institutions enable this (like Searle's status functions), power theorists think the will only channels pre-existing reasons (like Raz). This is bedrock meta-ethical stuff that won't be resolved empirically.

  For progress... ah! The user wants dissolution over solution. First step: map the two questions explicitly using their case. Show how each camp answers both questions but privileges one. Then isolate the will-creation question as the true fracture point. The group might agree that convergence isn't needed - they're studying different phenomena sharing the label "promise". 

  Practical suggestion: have each side argue the other's position in the disowned promise case. That might reveal where they're actually talking past each other versus genuinely disagreeing. The meta-realization that some disagreements are about framing rather than substance could break the year-long cycle.
answer: |-
  Your diagnosis is perceptive: **the core disagreement isn't about promissory obligation itself, but about the *level* and *type* of explanation being offered.** The two camps are engaged in fundamentally different philosophical projects, leading to systematic miscommunication. Here’s a breakdown:

  ---

  ### **1. The Two Projects: Institutional Analysis vs. Foundational Justification**
  - **Camp 1 (Practice-Internal):**  
    Engages in *descriptive-normative analysis of a social institution*.  
    Key question: *"What does our actual practice of promising require, given its constitutive rules and social function?"*  
    → **Methodology:** Looks to linguistic conventions, role obligations, and the practice's internal logic (à la Searle, Rawls on practices).  
    → **Obligation source:** The institutional role of "promisor" itself. Breaking a promise is like violating the rules of chess – it’s a failure *within* the system.  

  - **Camp 2 (Normative-Power):**  
    Engages in *moral justification of obligation-generating acts*.  
    Key question: *"What underlying moral principles make promissory obligations *binding*, independent of social facts?"*  
    → **Methodology:** Asks what moral work promising does (e.g., autonomy, reliance, trust) and whether the practice *deserves* recognition.  
    → **Obligation source:** Moral harms (disappointed expectations) or normative powers (transfer of authority over one's actions).  

  **The stalemate arises because:**  
  - When Camp 1 says, "But this *is* what promising *is*!", Camp 2 hears, "This is morally sacrosanct!" – which they deny.  
  - When Camp 2 says, "The practice is only binding if it serves a moral purpose!", Camp 1 hears, "You’re misdescribing the practice!" – which they deny.  

  ---

  ### **2. The Deeper Disagreement: Can the Will Create Reasons?**
  Your suspicion is correct. The unargued bedrock is **meta-normative**:  
  - **Camp 1** implicitly accepts **robust conventionalism**: Institutions *can* create *sui generis* obligations through collective recognition (e.g., "By saying 'I promise', you trigger a socially constructed normative status").  
  - **Camp 2** holds a **reductive view**: Obligations must be grounded in pre-existing moral reasons (e.g., harm, autonomy). Promising is merely a *way* to activate these reasons – not a source.  

  This explains why both camps talk past each other on the "disowned promise":  

  ---

  ### **3. Testing Your Case: The Disowned Promise**
  #### **Scenario A: Bea’s Blanket Disclaimer**  
  - **Camp 1 (Practice):** *No promissory obligation exists.*  
    → Why? Promising requires uptake (Bea’s acceptance) to invoke the institution. Alf’s utterance is linguistically deviant – like trying to marry an unwilling partner. The resentment Bea feels is about *misleading* or *betrayal of trust*, not promissory infidelity.  
    - **What’s left?** A moral wrong of dishonesty or reckless inducement of reliance, but *not promise-breaking*.  

  - **Camp 2 (Normative-Power):** *An obligation-like wrong occurs, but it’s not "promissory".*  
    → Why? Alf intentionally led Bea to form expectations (voluntarily assuming a duty), then violated them. The wrong stems from the *moral harm of betrayal* or *undermined autonomy* (Bea’s will was disregarded). The label "promise" is irrelevant.  

  #### **Scenario B: Disclaimer + History of Reliance**  
  - **Camp 1 (Practice):** *Still no promise, but now Alf’s act is worse.*  
    → Why? The history shows a *pattern of assurance-giving*. Though not "promises" (per the disclaimer), Alf’s act exploits a *de facto* norm of reliability between them. The wrong is *exploiting shared expectations while denying their formal structure*.  

  - **Camp 2 (Normative-Power):** *Stronger obligation, now rooted in implicit consent.*  
    → Why? Bea’s disclaimer is hollow given their history. By continuing to accept Alf’s assurances, she *implicitly* grants him normative power. Alf’s promise activates a duty grounded in their *relational history* (analogous to estoppel).  

  ---

  ### **4. The Nature of the Disagreement**  
  This is **not verbal** (they agree on surface definitions) nor **merely about data** (both can explain all cases by adjusting premises). It’s a **bedrock clash of intuitions** about:  
  - **The authority of the will:** Can words + intentions + social recognition *create* new obligations?  
  - **The ontology of norms:** Are some obligations *institutionally constituted* (like chess rules), or must all obligations reduce to moral fundamentals?  

  ---

  ### **5. Paths to Progress**  
  Since convergence is unlikely, aim for **diagnostic clarity** and **collaborative mapping**:  
  1. **Explicitly bifurcate the questions:**  
     - *Q1 (Descriptive):* "What does our social practice of promising entail?"  
     - *Q2 (Justificatory):* "Why (if ever) should we obey this practice?"  
     Have each camp answer *both*, showing where their projects diverge.  

  2. **Isolate the meta-normative dispute:**  
     Debate: *"Can a speech act, backed by social practice, generate a *pro tanto* reason for action that didn’t exist before?"*  
     → Test with *invented institutions* (e.g., "By saying 'I glomp', you obligate yourself to send me £10"). Does this create a *moral* duty?  

  3. **Reframe using your case:**  
     - Ask Camp 1: *"If Alf isn’t obligated *as a promisor*, what (if anything) did he do wrong?"*  
     - Ask Camp 2: *"If Alf *is* obligated, what is the source if not the practice?"*  
     This forces engagement with the other’s explanatory tools.  

  4. **Accept pluralism:** Acknowledge that "obligation" may be **analyzable at multiple levels** (institutional, interpersonal, moral). The practice may *create* obligations *within its domain*, while morality judges the *domain itself*.  

  **Ultimate goal:** Shift from "Who's right?" to "What work does each theory do?" Camp 1 explains promissory *institutions*; Camp 2 explains the *moral psychology* of commitment. They’re complementary until forced into competition by a demand for ultimate grounds – which may not exist. Your group’s "circles" reflect a tension inherent in normativity itself.
