  - Show diachronic triviality resurfaces if the Equation is a standing norm.  
  - Use Exportation to derive triviality *without* conditionalization.  
  - Analyze costs if Exportation or embedded conditionals are abandoned.  

  For the Exportation argument:  
  1. Apply Equation to \(C\) and \(A \to (B \to C)\), getting \(P(A \to (B \to C) \mid C) = P(B \to C \mid A \land C)\).  
  2. By Exportation, \(A \to (B \to C) \equiv (A \land B) \to C\), so right side simplifies to \(P(C \mid (A \land B) \land C) = 1\).  
  3. Thus \(P(A \to (B \to C) \mid C) = 1\). Similarly, for \(\neg C\), it becomes \(0\).  
  4. Total probability then forces \(P(A \to (B \to C)) = P(C)\), but by Equation \(P(A \to (B \to C)) = P(B \to C \mid A) = P(C \mid A \land B)\). Contradiction unless \(P(C \mid A \land B) = P(C)\).  

  This works! The key is embedding conditionals in consequents and Exportation.  

  For the question design:  
  - **Clarity**: State Equation, closure, Exportation upfront.  
  - **Flow**: First target anchoring’s block, then diachronic threat, then Exportation attack, finally cost analysis.  
