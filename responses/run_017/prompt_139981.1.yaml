prompt: |-
  I'm a first-year PhD student and my supervisor runs a fortnightly reading group on realization and multiple realizability. Over the last two terms she's handed down verdicts on a pile of cases — either "genuine realizer of pain" or "that's a model of a mind, not a mind." I'm writing up the notes for the group and I want to know what she's going to say about the case she's promised for next week.

  Her track record:

  - silicon-based alien, totally different chemistry, internal states play the same causal role: realizer
  - a creature whose damage-detector state causes it to burst into song rather than to avoid the damage: not pain (she added it might still be some other state of theirs)
  - someone whose neurons are swapped out one at a time for functionally identical silicon units: a realizer at every stage, and at the end, when there's no biology left at all
  - an alien whose pain state has no behavioral effects whatsoever — no wincing, no avoidance, no reports, it only causes further internal states: still a realizer
  - a creature that only plays the pain role because a team of technicians is continously correcting its internal states from outside: not a realizer, "the system has to do the work itself"
  - the entire population of a large country wired together by radio, one person per neuron, running the same functional organization: not a realizer — though she admitted she doesn't have a principled story about why
  - a warehouse of filing cabinets plus a clerk that reproduces the exact input-output profile of a pain-feeler: not a realizer
  - a functionally identical twin whose color experiences are supposed to be inverted: same mental states, no mental difference without a functional difference
  - a system functionally identical to a pain-feeler with nothing that it's like to be it: she says it does feel pain, the case is empty

  Next week's case: engineers build from scratch a causally integrated system that runs in real time, is embodied in a robot, and ends up with the pain role occupied by internal states nobody designed for that role — they fell out of training. No biology anywhere, no scan of any particular brain, no gradual replacement, nothing descended from an actual pain-feeler.

  What will she say, and what's the rule she's running? I dont need the true answer, I need to walk in knowing the two or three rules that fit her verdicts, what each predicts about this case, and which one you'd bet on and why. And since several of those rules will agree here: what further case should I put to her in the session to separate the ones that agree?
reasoning: |-
  Okay, let me tackle this PhD student's problem. They need to predict their supervisor's verdict on a new case for the reading group. First, I should look at all the past cases and identify the pattern in the supervisor's decisions.

  Starting with the alien with different chemistry but same causal role: she called it a realizer. Then, the creature that sings instead of avoiding damage: not pain. That suggests that the causal role must match exactly. When neurons were replaced gradually with silicon, she accepted each stage as a realizer. The alien with pain causing only internal states but no behavior: still a realizer. That's interesting—behavior isn't necessary as long as the internal causal role is intact. 

  Then there's the case with technicians correcting states: not a realizer. The supervisor said the system must do the work itself. So autonomy is key. The country-sized neural network wasn't a realizer, but she admitted no principled reason. The filing cabinet with a clerk: also not a realizer. So maybe systems that aren't integrated or lack real-time processing? The inverted color case: same mental states, emphasizing functional equivalence. The zombie argument she dismissed, saying if it's functionally identical, it feels pain.

  Now the new case: engineers build a system from scratch, no biology, not based on a brain scan, but through training. It's embodied, real-time, and the pain role emerged without design. The key points are autonomy, real-time processing, embodiment, and emergent functionality.

  Looking at possible rules. Rule 1: Causal Role Autonomy. The system must implement the causal role without external help. Technicians case failed here. The new case has no external help, so it should be a realizer. Rule 2: Intrinsic Implementation. The realization must be intrinsic, not derivative. The country and filing cabinet cases failed because they rely on people, which are extrinsic. The new case is built from scratch, so intrinsic. Rule 3: Real-time Embodied Integration. The system must process in real-time and be embodied. The country case wasn't real-time, filing cabinet wasn't integrated. The new case is both, so realizer.

  But both Rule 1 and Rule 3 point to realizer. To differentiate, I need a test case. What about a system with real-time processing and autonomy but not embodied? If she requires embodiment, she'd reject it. Or a case with extrinsic implementation but real-time, like a team of people coordinating in real-time. If she rejects that, it supports Rule 3 over Rule 1.

  The student should ask about a decentralized system with real-time processing but no single body. Or a non-embodied AI. That would test if embodiment is necessary. If she accepts the real-time decentralized system, then intrinsic implementation is key. If not, embodiment matters. Also, the filing cabinet upgraded to real-time with clerks working instantly. If she still rejects, autonomy or intrinsic factors rule. If she accepts, then real-time is crucial. 

  So predicting the new case: since it's autonomous, real-time, embodied, and intrinsic, she'll call it a realizer. The test cases will help distinguish between the rules.
answer: |-
  Based on your supervisor's verdicts, she's operating under **strong functionalism with specific constraints on implementation autonomy and intrinsic realization**. Here's the breakdown of the rules fitting her pattern, predictions for the new case, and a decisive test case to separate tied rules:

  ---

  ### **The Core Rules Derived From Her Verdicts**
  1. **Rule 1: Causal Role Fidelity**  
     - Mental states are defined *strictly* by their causal role (inputs → internal states → outputs).  
     - *Evidence*: Silicon aliens (same role), singing creature (different output role), pain-without-behavior (same internal role accepted), color inversion (no functional difference = no mental difference).  

  2. **Rule 2: Implementation Autonomy**  
     - The system must *intrinsically* sustain the causal role without ongoing external intervention.  
     - *Evidence*: Technicians case rejected ("system has to do the work itself"), country population/filing cabinets rejected (external agents/structures doing the work).  

  3. **Rule 3: Non-Derivative Realization**  
     - Realizers must be *intrinsic physical implementations*, not abstract models or extrinsic interpretations.  
     - *Evidence*: Filing cabinets (symbolic model), country population (extrinsic agents) rejected. Gradual replacement accepted (intrinsic implementation at all stages).  

  4. **Rule 4: Real-Time Embodied Integration (Likely Her "Unexplained" Constraint)**  
     - The system must be a unified, causally integrated entity operating in real time, physically embodied.  
     - *Evidence*: Country population rejected (disintegrated, non-real-time), filing cabinets rejected (non-real-time), neuron replacement accepted (integrated biology → silicon).  

  ---

  ### **Prediction for Next Week's Case**  
  **The system will be deemed a GENUINE REALIZER of pain.**  
  - **Why?**  
    - It satisfies **Causal Role Fidelity** (pain role "fell out of training" and is occupied).  
    - It satisfies **Implementation Autonomy** (no technicians; system is "causally integrated" and self-sustaining).  
    - It satisfies **Non-Derivative Realization** (built from scratch, no reliance on external models/agents).  
    - It *strongly implies* **Real-Time Embodied Integration** (embodied robot, real-time operation).  

  *All rules align here*—no past rejection criteria apply. The closest parallels are the gradual replacement (accepted) and the autonomous alien (accepted), but this case lacks even the "scaffolding" of biology, which she explicitly doesn't require (silicon alien accepted).

  ---

  ### **Separating the Rules: A Test Case for the Group**  
  Since Rules 1–3 all predict acceptance of the robot, propose this to distinguish **Rule 4 (Real-Time Embodied Integration)** from the others:  

  > **"A real-time, causally autonomous AI running on a cloud server cluster (no single physical body), with no external intervention, trained to occupy the pain role identically to a human. It controls a virtual avatar in a simulated environment but has no physical embodiment beyond server hardware."**  

  - **Predictions:**  
    - If she **accepts** it: Rules 1–3 suffice (autonomy + causal role + non-derivative implementation). Rule 4 (embodiment) is unnecessary.  
    - If she **rejects** it: Rule 4 is active (lacking physical embodiment/unified physical integration). This aligns with her rejection of the country population (disembodied) and her unease about it.  

  *Why this works*:  
  - It mirrors the accepted *alien with internal-state-only pain* (causal role autonomy) but removes embodiment.  
  - It contrasts with the rejected *country population* by being real-time, autonomous, and non-human-dependent.  
  - If she rejects it, her "no principled story" about the country case likely hints at an implicit embodiment/integration requirement.  

  ---

  ### **Your Bet: What She's Running**  
  **Primary Rule:** **Implementation Autonomy + Non-Derivative Realization** (Rules 2 & 3).  
  - These explain *all* her verdicts cleanly (technicians, country, filing cabinets rejected; gradual replacement accepted).  
  - **Weakness:** Doesn't fully explain the country rejection without Rule 4.  

  **Secondary Rule:** **Real-Time Embodied Integration (Rule 4)** as a "tiebreaker."  
  - This covers her country/filing cabinet rejections and explains why she might hesitate on cloud AI.  

  **Bet:** She’ll accept the robot case (95% confidence). For the test case, I’d bet she **rejects the cloud AI** due to implicit embodiment/integration requirements (Rule 4).  

  ---

  ### **Summary for the Session**  
  1. **Prediction for next week:** "Genuine realizer."  
  2. **Her likely rules:**  
     - Functional role + autonomous implementation + non-derivative physical realization.  
     - (Probably) embodiment/real-time integration as a hidden factor.  
  3. **Test case to break ties:** Cloud-based AI with virtual avatar.  

  **Tip:** Frame the cloud AI case as: *"Does the *physical disunity* of the system matter if it’s autonomous and real-time?"* This forces her to clarify the "principled story" behind rejecting the country population.
