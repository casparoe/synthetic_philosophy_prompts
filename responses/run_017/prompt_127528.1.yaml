prompt: |-
  A podcast on behavioural design that I listen to a lot (the host is an economist, and usually careful) devoted an episode to weakness of will, and gave this as the state of the art:

  > Rational choice says you should discount the future exponentially: a fixed percentage off for every unit of delay, which is just compounding at a constant rate. Real people don't. We discount hyperbolically — the rate we apply to the next chunk of delay is much steeper than the rate we apply to later chunks — and that makes our preferences dynamically inconsistent, so they flip as time passes. You book the larger later reward, then when the smaller sooner one is finally on offer you switch. That is literally what akrasia is: the ancient problem of weakness of will finally has a formal model. It explains the gym membership taken out in January and abandoned by March, the one-episode promise that becomes five, the tax return deferred until the deadline. And because a preference reversal just is an inconsistency, the hyperbolic discounter is straightforwardly irrational: there is no coherent point of view from which both of her preferences are correct. So the only remedy is to bind your future self — delete the app in advance, automate the transfer — because your future self's preferences are simply not to be trusted. The model behavioural economists actually use, the beta-delta one, with a fixed impatience penalty on anything that isn't immediate plus ordinary exponential discounting, captures all of this and predicts every anomaly we know about in intertemporal choice: why we're more impatient about £20 than about £2,000, why we discount gains faster than losses, and why we'll wait longer to speed up a delivery we were already owed. Which is the real moral: willpower is a myth, and what we call self-control is just self-binding successfully arranged in advance.

  I trust this host on economics, but the claim that the whole philosophical problem has been "solved" by a discount function set off my alarm bells, and I can't locate the problem myself.

  Two things I've heard pull me in opposite directions. A friend who read some philosophy says the reversal stuff isn't akrasia at all: akrasia is acting against your own better judgement *at the moment you act*, whereas a shifting discount rate just means that the later self genuinely, all things considered, prefers the smaller sooner — there's no conflict left over to explain, only a change of mind. If that's right, the podcast's central identification looks like a conflation. But then I can't see why its remedy would still be good advice, and it obviously is: people really do solve these problems by removing the option in advance.

  And there's a version of the case I can't get past, which nobody seems to address. If steep short-run discounting is what makes my future self's preferences untrustworthy, why does my *present* self get to be the one whose preferences bind? The same argument seems to make my preferences a minute from now the ones I should defer to, in which case I should put off arranging the precommitment too — and then again, and again. There must be an asymmetry somewhere, but I don't know whether it comes from the model or has to be imported into it.

  Please audit the passage above. I care about which parts a philosopher and a behavioural economist would each accept, where the host has overreached or conflated two claims that the model keeps apart, whether the beta-delta model really does the unifying work he attributes to it, and whether his closing moral about willpower follows from anything that survives the corrections.

  Please write in British English, and use these sections, in this order:

  - **Working summary** — about 120 words: the corrected version of the view, stated as you would state it.
  - **Clause-by-clause audit** — about 400 words: work through the passage, sorting what is accurate, what is a defensible simplification, and what is a misrepresentation, and say briefly why in each case.
  - **Is reversal akrasia?** — about 250 words: whether the friend's objection is right, and what the relationship between the two phenomena actually is.
  - **Irrationality, and the asymmetry** — about 300 words: in what sense, if any, dynamic inconsistency is a failure of rationality; what precommitment presupposes about which time-slice's preferences are authoritative; and how my symmetry worry should be answered.
  - **My verdict** — about 120 words: the one- or two-sentence bottom line on the passage, and on whether the closing moral survives.
reasoning: |-
  Hmm, the user has shared a detailed query about a podcast episode on behavioural design and hyperbolic discounting. They're clearly well-informed and critical, having spotted potential issues with the host's claims about akrasia and rationality. I need to audit this passage carefully.

  First, let me recall the key claims the user wants examined: (1) that hyperbolic discounting "solves" akrasia by modeling preference reversals, (2) that this makes people "straightforwardly irrational", (3) that the beta-delta model explains all anomalies, and (4) that willpower is therefore a myth requiring precommitment. The user's unease centers on whether preference reversal truly equals akrasia, and why present selves get privileged over future selves if all time-slices are equally compromised.

  The friend's philosophical objection seems valid - akrasia traditionally involves synchronic conflict (acting against current better judgment), while discounting models diachronic preference change. The host has conflated these. On rationality, economists would indeed call dynamic inconsistency irrational as it violates axioms of rational choice, but philosophers might see it as coherent preference evolution. The symmetry problem is thorniest - if all temporal selves are hyperbolic discounters, why privilege "now"? The answer likely lies in the "long-run self" concept behavioral economists imply but rarely state.

  The beta-delta model is robust but not universal; it doesn't perfectly explain magnitude effects. And while precommitment is empirically effective, calling willpower a "myth" overreaches - self-binding works precisely because we exercise willpower in the precommitment moment. The host's excitement has led to conceptual blurring between descriptive modeling and normative claims.

  For the response structure, I'll follow the user's requested sections. The working summary will crystallize the corrected view. The audit will dissect each claim: accurate (hyperbolic vs exponential discounting), defensible simplification (preference reversal as irrationality), misrepresentation (akrasia equivalence). On akrasia, I'll distinguish synchronic vs diachronic weakness of will. For irrationality, I'll separate economic from philosophical definitions and address the symmetry worry via planning agency. The verdict will note the podcast's empirical strengths but philosophical overreach, and salvage the practical advice while rejecting the "willpower is myth" conclusion.
answer: |-
  ### Working Summary
  Behavioural economics demonstrates that human intertemporal preferences often violate rational choice models: we exhibit hyperbolic (or beta-delta) discounting, applying steeper rates to immediate delays than to future ones. This causes dynamic inconsistency—preferences reverse as time passes, leading to precommitment strategies (e.g., deleting apps). While this explains procrastination and self-sabotage, it does *not* resolve the philosophical problem of akrasia (acting against one’s better judgement *at the moment of action*). Hyperbolic discounting describes preference change over time, not necessarily synchronic conflict. The beta-delta model effectively captures key anomalies (e.g., magnitude effects), but framing willpower as a "myth" overstates the case; self-binding is a tool enabled by deliberate, effortful agency at specific moments.

  ### Clause-by-Clause Audit
  - **Rational choice says... exponentially**: **Accurate**. Standard economic models use exponential discounting for consistency.
  - **Real people don’t... hyperbolically**: **Defensible simplification**. While humans don’t perfectly fit pure hyperbolic curves, beta-delta (quasi-hyperbolic) is the dominant model capturing this steep initial discounting.
  - **That makes our preferences dynamically inconsistent**: **Accurate**. Reversing preferences violates the stationarity axiom of rational choice.
  - **That is literally what akrasia is**: **Misrepresentation**. Akrasia is traditionally defined as acting against *current* better judgement, whereas discounting models describe preference *changes* over time. The conflation ignores synchronic vs. diachronic conflict.
  - **Explains gym membership... tax return**: **Accurate**. These are canonical examples of dynamic inconsistency.
  - **Straightforwardly irrational**: **Defensible** for economists (violates consistency axioms) but **contested** by philosophers (if preferences genuinely change, is it irrational?).
  - **The only remedy is to bind your future self**: **Accurate** empirically, but **overreaches** normatively. Precommitment works, but alternatives like cognitive reappraisal exist.
  - **Beta-delta... captures all of this... every anomaly**: **Overclaim**. Beta-delta explains many anomalies (e.g., common difference effect), but struggles with some (e.g., absolute magnitude effects). It unifies key phenomena but not exhaustively.
  - **Why we’re more impatient about £20 than £2,000**: **Accurate**. Beta-delta predicts greater impatience for smaller sums via its immediacy bias.
  - **Discount gains faster than losses... speed up delivery**: **Accurate**. Loss aversion and reference-dependence (from Prospect Theory) complement beta-delta here.

  ### Is Reversal Akrasia?
  The friend’s objection is largely correct. **Akrasia** (as per Aristotle, Davidson) is *synchronic*: you judge action A best *now* yet choose B *now*. Hyperbolic discounting describes *diachronic* preference reversal: at T1 you prefer LL (larger-later), but at T2 you prefer SS (smaller-sooner). The latter need not involve synchronic conflict—if your discount rate changes, your "better judgement" at T2 may genuinely favour SS. The podcast errs by equating reversal *with* akrasia. However, the phenomena are related: diachronic inconsistency *enables* synchronic akrasia. If your T2 self opts for SS despite a T1 plan (reflecting "long-run" preferences), this *can* feel like weakness of will. But the model alone doesn’t capture the *internal conflict* essential to akrasia.

  ### Irrationality, and the Asymmetry
  - **Irrationality**: Economists deem dynamic inconsistency irrational as it violates axioms of rational choice (e.g., independence of irrelevant alternatives). Philosophers debate this: if preferences are time-indexed, reversals may reflect rational adaptation to changing temporal contexts. However, most agree it’s *pragmatically* irrational, as it undermines welfare-maximisation across time.
  - **The Asymmetry**: Your symmetry worry is astute. Hyperbolic discounting *does* imply all selves are equally compromised. Precommitment thus requires an implicit appeal to the **planning self**—a vantage point (often atemporal or "cool-minded") that privileges long-term interests. Present selves aren’t inherently "truer"; rather, precommitment exploits moments of lower discounting (e.g., planning gym membership on Sunday, not Monday morning) to bind future high-discounting selves. The asymmetry is *pragmatic*: only the present self *can* act to constrain future choices. Deferring precommitment invites infinite regress ("I’ll bind myself tomorrow"), so agency must be exercised when possible.

  ### My Verdict
  The podcast accurately describes hyperbolic discounting’s explanatory power for self-defeating behaviours and the efficacy of precommitment, but overreaches by declaring akrasia "solved" (conflating preference reversal with synchronic weakness of will) and overstating beta-delta’s universality. Its closing moral—"willpower is a myth"—does not survive scrutiny: successful self-binding *presupposes* willpower exercised by the planning self to override proximate temptations.
