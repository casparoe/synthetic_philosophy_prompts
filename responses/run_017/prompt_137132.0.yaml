  In conclusion, the procedure provides a structured way to apply the lexical-threshold negative utilitarianism, but it has significant limitations and may lead to decisions that are counterintuitive or ethically problematic.
answer: |-
  ### Procedure for Applying Lexical-Threshold Negative Utilitarianism in Committee Meetings  
  *Designed for non-theorists, to be executed in sequential steps during fortnightly reviews. Steps must be followed in order. If the procedure stops at "NO," the protocol is rejected. If it "hands back" to the committee, members must debate and vote on the unresolved values-based question.*

  ---

  #### **Step 1: Locate the Pain Intensity Threshold**  
  **Goal:** Determine if the procedure's pain is above or below the lexical threshold using available reports.  
  - **Inputs:** Ordinal reports (e.g., nurse/parent ratings: "mild," "moderate," "severe"; behavioral scales: 1–10).  
  - **Predefined Threshold Mapping (set by the committee in advance):**  
    - Assign fixed labels to the threshold (e.g., "severe" pain = above threshold; "mild/moderate" = below).  
    - For numerical scales, set a cutoff (e.g., scores ≥8/10 = above threshold).  
  - **Procedure:**  
    1. **Compile Ratings:** List all reported pain intensities for the procedure (e.g., 3 nurses rate it "severe," 2 parents rate it "moderate").  
    2. **Resolve Disagreements:**  
       - If **any rater** reports pain at or above the threshold, classify the procedure as **above threshold**.  
       - *Rationale:* Conservative approach prioritizes avoiding catastrophic pain.  
    3. **Outcome:**  
       - If above threshold → Proceed to Step 3.  
       - If below threshold → Proceed to Step 2.  
  - **Hands back if:** Threshold mapping is ambiguous (e.g., new scale introduced). Committee must vote to define the cutoff.  

  ---

  #### **Step 2: Build the Ledger (What Counts?)**  
  **Goal:** Decide which non-pain elements to include in the cost-benefit analysis.  
  - **Rule:** Only include items directly tied to the patient’s experience. Exclude indirect effects (e.g., societal benefits).  
  - **Procedure:**  
    1. **Checklist for Inclusion:**  
       - Immediate pain (always included).  
       - Dread before the procedure (include if documented, e.g., child’s anxiety ratings).  
       - Memory of pain afterward (include if evidenced, e.g., PTSD risk in follow-ups).  
       - Parent/caregiver distress at bedside (exclude unless it demonstrably worsens the child’s suffering).  
    2. **Rate Each Element:** Apply Step 1 to each item (e.g., dread rated "severe" = above threshold).  
    3. **Outcome:**  
       - If **any element** is above threshold → Proceed to Step 3.  
       - If **all elements below threshold** → Proceed to Step 4.  
  - **Hands back if:** Debate over indirect harms (e.g., parental distress). Committee must vote on whether to include them.  

  ---

  #### **Step 3: Above-Threshold Pain – Can It Be Eliminated?**  
  **Goal:** For above-threshold pain, determine if it can be reduced below the threshold or removed.  
  - **Procedure:**  
    1. **Check Protocol for Mitigations:**  
       - Can pain be reduced (e.g., anesthesia, distraction techniques)?  
       - Is there an alternative procedure without above-threshold pain?  
    2. **Outcome:**  
       - If pain **can be eliminated or reduced below threshold** → Protocol must be modified; return for re-review.  
       - If pain **cannot be reduced** → **NO.** Protocol rejected.  
       - *Exception:* Proceed to Step 6 only if comparing two protocols *both* above threshold (rare).  

  ---

  #### **Step 4: Below-Threshold Trade-Offs**  
  **Goal:** Weigh commensurable pains against benefits.  
  - **Rule:** Pains/pleasures below threshold can be traded at a fixed rate (e.g., 1 unit of pain offset by 2 units of benefit).  
  - **Procedure:**  
    1. **Quantify Pains (ordinal → cardinal):**  
       - Use predefined point conversions (set by committee):  
         - Mild pain = 1 point, moderate = 2 points, etc.  
         - Multiply by duration (e.g., 10 min of moderate pain = 20 points).  
    2. **Quantify Benefits:** Assign points to:  
       - Health gains (e.g., life-years saved × quality multiplier).  
       - Pleasures (e.g., "relief" = +1 point per report).  
    3. **Calculate Net Harm:** Total pain points minus total benefit points.  
    4. **Outcome:**  
       - If net harm ≤ 0 → Approve.  
       - If net harm > 0 → **NO.**  
  - **Hands back if:**  
    - Comparing pain now vs. future pain prevented (see Step 5).  
    - Trading intensity vs. duration (committee must set exchange rates, e.g., 1 sec of severe pain = 10 sec of moderate).  

  ---

  #### **Step 5: Special Cases – Time and Prevention**  
  **Goal:** Handle pain-duration trade-offs and future pain prevention.  
  - **Rule:** Only below-threshold pains can be traded.  
  - **Procedure:**  
    1. **Pain Now vs. Future Pain Prevented:**  
       - If present pain is below threshold and future pain prevented is **below threshold** → Use Step 4.  
       - If future pain prevented is **above threshold** → Preventing it is mandatory, but causing *any* above-threshold pain to do so is forbidden. **Hand back** to committee: Can we cause below-threshold pain to prevent above-threshold pain?  
    2. **Intensity vs. Duration:**  
       - Convert to "pain-seconds" using predefined rates (e.g., 1 sec of severe pain = 5 sec of moderate).  
       - If total pain-seconds are below a set cap → Approve.  
       - **Hand back** if rates are undefined.  

  ---

  #### **Step 6: Choosing Between Two Above-Threshold Protocols**  
  **Goal:** Select the lesser evil when both protocols cause above-threshold pain and one must be chosen.  
  - **Rule:** No aggregation of pain across patients.  
  - **Procedure:**  
    1. **Prioritization Rules (set by committee in advance):**  
       - **Rule 1:** Minimize peak intensity (choose the protocol with the lower maximum pain).  
       - **Rule 2:** If peaks equal, minimize duration of above-threshold pain.  
       - **Rule 3:** If peak/duration equal, minimize number of patients exposed.  
    2. **Apply Rules Sequentially** until one protocol ranks better.  
  - **Hands back if:** Rules are tied or undefined. Committee must vote on prioritization.  

  ---

  ### Application to Pending Protocols  
  *Using the procedure above with assumptions:*  
  - **Threshold:** "Severe" pain = above threshold.  
  - **Ledger:** Includes immediate pain and dread; excludes parental distress.  
  - **Trade Rates:** 1 sec severe pain = 5 sec moderate pain; 1 health gain unit = 2 pain units.  
  - **Above-Threshold Choice Rule:** Prioritize minimizing peak intensity.  

  #### **Protocol (i):**  
  - *Brief severe pain for 200 newborns; alternative sedative removes pain but has fatal risk.*  
    - **Step 1:** Pain is "severe" → Above threshold.  
    - **Step 3:** Pain cannot be eliminated without sedative (not part of this protocol) → **NO.**  
    - *Outcome:* **Rejected.** The sedative alternative would be reviewed separately (its *risk* of death is below threshold, so tradable).  
    - *Why unwelcome?* Rejecting a quick, survivable pain may force riskier alternatives.  

  #### **Protocol (ii):**  
  - *Repeated moderate pain for 40 children; health gains and pride reported.*  
    - **Step 1:** Pain "moderate" → Below threshold.  
    - **Step 2:** Dread/memory included but rated moderate → Below threshold.  
    - **Step 4:**  
      - Pain: 6 months × moderate = 120 points/child.  
      - Benefits: Health gains = 100 points/child; pride = 30 points/child. Net = +10 points → Net harm.  
      - **NO** (unless committee overrules with subjective benefit-weighting).  
    - *Outcome:* **Rejected** under strict point system.  
    - *Why unwelcome?* Substantial health gains and positive experiences are overruled by cumulative pain.  

  #### **Protocol (iii):**  
  - *Choice: 30 children experience higher peak pain vs. 120 experience lower (but still above-threshold) pain.*  
    - **Step 1:** Both above threshold.  
    - **Step 6:**  
      - Rule 1: Minimize peak intensity → Choose protocol with lower peak (120 children).  
      - *Outcome:* **Approve the 120-child protocol.**  
    - *Why unwelcome?* Exposes 4× more children to above-threshold pain to avoid marginally higher peaks.  

  ---

  ### Limitations and Systematic Misfires  
  **What the Procedure Cannot Do:**  
  1. **Handle ambiguity in ordinal data** (e.g., cultural biases in pain reporting).  
  2. **Quantify non-pain harms** (e.g., death risk in Protocol i).  
  3. **Resolve conflicts without predefined rules** (relies on committee votes for values).  
  4. **Account for long-term or distributed harms** (e.g., systemic workflow issues).  

  **Where It Systematically Misfires:**  
  - **Over-rejection of beneficial protocols:** Net-harm calculations (Step 4) ignore qualitative context (e.g., Protocol ii’s "pride").  
  - **Rigidity in threshold effects:** A single "severe" rating triggers rejection, even if benefits are monumental.  
  - **Anti-utilitarian outcomes:** Aggregation bans (Step 6) prioritize minimizing peak pain over reducing total suffering (e.g., Protocol iii).  
  - **Undervaluing prevention:** Cannot justify causing mild pain to avert severe future pain without committee intervention (Step 5).  

  **Final Note:** This procedure enforces consistency but risks inhumanity when thresholds or trade-offs clash with clinical wisdom. Regular committee reviews of thresholds and rules are essential to mitigate rigidity.
