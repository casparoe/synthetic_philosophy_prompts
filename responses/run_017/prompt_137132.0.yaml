     This might be a place where the committee does not want to go: they might feel that 120 children suffering is worse than 30, even if the peak is lower. But the procedure forces the choice.

  ---

  **What the Procedure Cannot Do and Where It Systematically Misfires**

  1. **Cannot Handle Cardinality**: The procedure relies on ordinal ratings and predefined thresholds, but without cardinal units, it is difficult to set the threshold precisely and to trade below-threshold pains and benefits.

  2. **Ignores Numbers in Above-Threshold Comparisons**: When comparing two above-threshold protocols, the procedure minimizes the peak intensity, ignoring the number of people affected. This may lead to more people suffering above-threshold pain, which might be worse in total but we cannot aggregate.

  3. **Risk and Uncertainty**: The procedure does not handle risks well. For example, in protocol (i), the alternative has a risk of death. The framework only considers actual pain, not risks. We rejected the protocol with certainty of above-threshold pain, but the alternative has a risk of death. Death might be a greater harm, but the framework doesn't account for it.

