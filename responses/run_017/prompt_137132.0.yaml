      a) **Minimize the number of patients experiencing above-threshold pain**: choose the protocol that exposes fewer patients to above-threshold pain.
      b) **Minimize the peak intensity**: choose the protocol with the lower peak pain (even if it is still above threshold, but lower than the other).
