prompt: |-
  I sit on the joint clinical ethics committee of a children's hospital network. We review roughly eight protocols a month in which patients who cannot consent — newborns, sedated children, children with cognitive impairments — will be put through procedures that hurt, and we must return a written determination of no more than a page, signed by a lay member of the committee and by hospital counsel. Our board has now instructed us to adopt as our working standard a lexical-threshold negative utilitarian view: below some intensity, pains and pleasures are commensurable and can be traded against one another at some rate; at or above that intensity, pain has lexical priority, so no quantity of pleasure, health benefit or other good that the protocol produces can compensate for it, and the protocol cannot go forward unless the pain itself can be removed or brought below the line.

  Please turn that into a procedure we can actually run in a fortnightly meeting, by people who have no training in the theory. It needs to settle, in the order we would ask them: how we locate the threshold when all we have are ordinal reports — nurse and parent ratings, behavioural scales — rather than cardinal units of suffering, and what we do when the same procedure falls on both sides of it depending on who is rating; what belongs in the ledger at all, apart from the pain itself — dread beforehand, the memory of it afterwards, the distress of parents at the bedside; how to compare protocols that trade intensity against duration, or pain now against pain prevented later; and, once we are above the threshold and trading is forbidden, how to choose between two protocols that both involve above-threshold pain — fewest patients over the line, lowest peak intensity, or something else — given that aggregation is no longer available to us. Mark where the procedure stops with a no, and where it hands the decision back to us because the remaining question is one of values rather than fact.

  Then run it on three protocols now pending: (i) a few seconds of severe pain, unanaesthetised, for each of about two hundred newborns, where an anaesthetic would not fit the ward's workflow and the alternative is a sedative that removes the pain but carries a small risk of a fatal complication; (ii) six months of repeated, individually moderate pain for forty children, with substantial health gains and with children afterwards reporting pride and relief; (iii) a choice between two protocols, both above the threshold, one exposing thirty children to a higher peak of pain briefly and the other exposing a hundred and twenty to a somewhat lower but still above-threshold pain. At least one of these will come out somewhere we will not want to go; show that plainly. Close by saying what the procedure cannot do, and where it will systematically misfire.
reasoning: |-
  We are given a lexical-threshold negative utilitarian view. This means:
  1. Below a certain intensity threshold, pains and pleasures (or other goods) can be traded at some rate.
  2. At or above that threshold, pain has absolute priority: no amount of pleasure or benefit can compensate for it. The only way to approve a protocol that causes above-threshold pain is to remove the pain or reduce it below the threshold.

  We need a procedure for a committee meeting that can be run by people without theoretical training. The procedure must address:

  a) How to locate the threshold when we have ordinal reports (nurse/parent ratings, behavioral scales) and not cardinal units.
  b) What to do when the same procedure is rated on both sides of the threshold by different raters.
  c) What to include in the ledger (dread, memory, parental distress, etc.).
  d) How to compare protocols that trade intensity against duration, or present pain against future pain prevented.
  e) How to choose between two protocols that both involve above-threshold pain (since aggregation is forbidden).

  The procedure must stop and say "no" when the protocol is above the threshold and cannot be fixed (unless the pain can be brought below). For questions that are about values (not facts), we hand the decision back to the committee.

  We are to run the procedure on three protocols and show where it leads, including where we might not like the result.

  Finally, we must state what the procedure cannot do and where it might systematically misfire.

  ---

  **Proposed Procedure for Committee Meetings**

  **Step 1: Determine the Pain Intensity for the Procedure**

  - Collect all available reports (nurse, parent, behavioral scales) for the procedure. These are typically on an ordinal scale (e.g., mild, moderate, severe).
  - **Threshold Definition**: The committee must predefine (as a standing rule) which rating levels correspond to "above threshold". For example:
     - Mild: below threshold
     - Moderate: below threshold
     - Severe: above threshold
    (Note: The exact mapping must be set by the committee in advance, based on the scales they use. If they use numerical scales, they might set a cutoff number.)
  - **Handling Disagreements**: 
     - If all raters agree on the intensity level, use that.
     - If there is disagreement (e.g., some rate it as moderate, some as severe), then:
          a) If any rater rates the pain as above the threshold (severe), then the pain is considered above threshold for the purpose of the decision. (This is a conservative approach because above-threshold pain is non-negotiable.)
          b) Alternatively, the committee might have a rule that if a certain fraction (e.g., majority) or a qualified rater (e.g., the attending nurse) rates it above, then it is above. But to be safe, we adopt: if at least one rater rates it as above threshold, then we treat it as above. (The committee must set this rule in advance.)

  **Step 2: What Goes into the Ledger?**

  - **Included**: 
     - The immediate pain of the procedure.
     - Dread beforehand and memory afterwards: if they are reported and can be rated, they should be included as separate pains. They might be rated on the same ordinal scale. If they are above threshold individually, then they are treated as above-threshold events.
     - Parental distress: if it is a direct result of the procedure and the child is aware of it (and it causes distress to the child) or if it is a harm in its own right that the committee deems relevant, then include it. However, note that the focus is on the patient. The committee must decide in advance whether to include secondary effects on parents. (This is a value judgment, so the procedure stops and hands back to the committee for a ruling on whether to include parental distress and how to rate it.)
  - **Excluded**: 
