  - **Present pain vs. future pain prevented**: 
     - If the present pain is below threshold, then it can be traded against future pain prevented (if that future pain is also below threshold). But if the future pain prevented is above threshold, then preventing it is a very high priority, but note: we are causing present pain to prevent future pain. This is tricky. The procedure: 
          - If the present pain is above threshold, then we cannot cause it even to prevent a future above-threshold pain (because trading is forbidden). 
          - If the present pain is below threshold and the future pain prevented is above threshold, then we are trading below-threshold pain for preventing above-threshold pain. Since preventing above-threshold pain is a lexically higher priority, we might allow it. However, the framework does not explicitly allow trading for preventing future above-threshold pain? The original statement says "no quantity of pleasure, health benefit or other good" can compensate. Preventing a future above-threshold pain is a benefit. So, by the letter, we cannot trade. Therefore, we cannot cause even a little pain to prevent a lot of above-threshold pain? This is a critical point. The procedure must be clarified: 
              - The committee must decide if preventing above-threshold pain counts as a "good" that cannot be traded? Or is it a reduction of harm? The framework is negative utilitarian: minimizing suffering is the goal. Then preventing above-threshold pain should be a top priority. But the rule says we cannot cause above-threshold pain for any benefit. What about causing below-threshold pain to prevent above-threshold pain? 
              - This is a value question. The procedure stops and hands back to the committee to decide: 
                  a) Do we allow causing below-threshold pain to prevent above-threshold pain? 
                  b) If so, then we proceed. Otherwise, we do not.

  **Step 4: Comparing Protocols with Above-Threshold Pain**

  - If a protocol involves above-threshold pain and we cannot remove it or bring it below, then it is rejected. But what if we have two protocols that are both above threshold? We must choose one? Or both are rejected? The problem says "how to choose between two protocols that both involve above-threshold pain". 

