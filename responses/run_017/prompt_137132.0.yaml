  **Step 3: Trading Off Intensity and Duration, or Present vs. Future Pain**

  - **Below threshold**: 
     - We can trade pain against pleasure/benefits at some rate. The committee must set a conversion rate (e.g., 1 unit of pain can be offset by X units of benefit). But note: we only have ordinal ratings. Therefore, the committee must predefine how to convert between different levels and durations. For example:
          - One minute of moderate pain = Y minutes of mild pain? (This is very hard with ordinal data. Alternatively, they might use a points system: assign points to each level and duration, then set a threshold of total points below which trading is allowed.)
