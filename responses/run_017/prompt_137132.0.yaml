          - If peak intensity is the same, then choose the one with the shorter duration of above-threshold pain. 
          - If both are the same on peak and duration, then choose the one with fewer patients exposed.

      But note: what if one protocol has a slightly lower peak but many more patients? Without aggregation, we cannot add. So we prioritize the worst-off individual: we want no individual to experience the highest possible pain. Therefore, we minimize the maximum pain (peak) first. Then, for those who are above the threshold, we minimize the duration of their suffering. Then, we minimize the number of people who have to endure it.

      This is a value judgment. The procedure must hand back to the committee to set the prioritization rule (minimize peak, then duration, then number of patients) or a different one.

  **Step 5: The Decision Tree**

  1. **Is there any above-threshold pain in the protocol?** 
     - If no: go to Step 5a (below-threshold trade-off).
     - If yes: can it be removed or reduced below the threshold? 
          - If yes: require modification and reassess.
          - If no: then the protocol is rejected unless it is being done to prevent a greater above-threshold pain (if the committee has allowed that exception). But note: the framework does not allow trading above-threshold pain for any benefit. So the only exception is if the above-threshold pain is being caused to prevent an even worse above-threshold pain? But the framework does not specify. We stick to: above-threshold pain cannot be caused for any reason. Therefore, it is rejected.

     However, the problem says: "the protocol cannot go forward unless the pain itself can be removed or brought below the line." So we do not allow causing above-threshold pain to prevent future above-threshold pain. Therefore, we reject.

     But what if the above-threshold pain is already going to occur (e.g., from the disease) and the protocol is to prevent it? Then we are not causing it. We are preventing it. The protocol that causes above-threshold pain is only the one we are considering for intervention.

     So the rule: if the protocol we are reviewing causes above-threshold pain (and we cannot remove it) then we reject it.

  2. **Step 5a: Below-threshold trade-off**
     - List all the pains (including dread, memory, etc., if included) and their intensities (all below threshold) and the benefits. 
     - We must decide if the benefits outweigh the pains. Since we don't have cardinal units, the committee must use their judgment. The procedure hands back to the committee for a value judgment on whether the trade-off is acceptable.

  **Summary of Procedure**

  1. **Determine Pain Intensity** (using predefined threshold mapping and rule for disagreements).
  2. **Decide What's in the Ledger** (for each item, if it's a value question, hand back to committee).
  3. **If above-threshold pain is present and cannot be reduced, reject (say "no")**.
  4. **If only below-threshold pain, hand back to committee to judge if benefits outweigh harms** (with the note that they are allowed to trade).
  5. **For comparing two protocols that both cause above-threshold pain and we must choose one?** (This is an unusual case because typically we would reject both, but if we are forced to choose, we need a rule.) Hand back to the committee to set a prioritization rule (like minimize peak, then duration, then number of patients) and then apply it.

  ---

