prompt: |-
  I'm writing a piece on whether populism's appeal to 'the will of the people' is constitutively anti-expert or only contingently anti-expert, and I need a case built to some rather awkward specifications.

  Please construct a scenario, realistic and at municipal or institutional scale — nothing I couldn't find in a mid-sized city, no sci-fi, no idealised assemblies — and short enough to state in one paragraph, in which the alignment everyone expects comes out inverted. The self-described populist, invoking the will of the people against unelected experts, should end up defending a policy that is a merely nominal proxy for what the people actually will, while the technocrat who says to defer to the experts is the one who best tracks it. The inversion has to fall out of the structure of the case rather than be stipulated by it, and it should be clear from the setup that (a) the people's substantive end is one thing and their belief about which policy achieves it is another, and (b) the experts' disagreement with them is purely instrumental — a dispute about the efficacy of means, not about whose values should win — and is conceded by both sides to be correct. So the case must not secretly turn on the experts knowing the people's values better than the people do, and must not lean on voter ignorance, disinformation, a badly worded ballot, low turnout, or a rigged consultation. Call the two views in play the say-so reading (the will of the people is whatever the people in fact demand) and the end-tracking reading (it is what they would demand, given what is true about available means); your scenario should put them on opposite sides of one decision, with the populist on the say-so side and the technocrat on the end-tracking side.

  After the scenario, give me: what each actor says; which reading each is implicitly committed to and why they can't easily swap; the single feature of the case doing the work; and what happens if that feature is removed — I expect we collapse back into an ordinary populism-versus-technocracy standoff, but tell me whether that's right.

  Two further things. The strongest populist reply I can anticipate is that the people's will includes the will that they be the ones who decide, so overriding the policy they named is disenfranchisement even when the experts are right about means — in which case the say-so reading isn't a fallback but the core of the matter, and the whole framing begs the question. Either close that off in the design and say how, or argue that it can't be closed off and say what that shows about my original question. And finally, be honest with me about whether all these constraints are jointly satisfiable; I'd much rather be told that two of them can't coexist than be handed a scenario that quietly cheats by sneaking in one of the excluded features.
reasoning: |-
  Okay, I need to help the user create a scenario that flips the typical populism vs. technocracy debate. The user wants a realistic case at a municipal level where the populist ends up defending a nominal policy while the technocrat actually tracks what people truly want. 

  First, I should understand the core requirements: The people have a clear end goal but are mistaken about the means. Experts agree with the goal but know the proposed policy won't work. The conflict must be purely about effectiveness, not values or misinformation. And crucially, the populist must stick to literal demands while the technocrat serves the underlying intent.

  Hmm, the trickiest part is avoiding all those excluded factors like voter ignorance or rigged consultations. Let me brainstorm municipal scenarios. Road safety comes to mind - maybe speed bumps? But that might be too simple. 

  Wait, what about school budgets? Imagine a city where residents demand "more teachers" to reduce class sizes, but experts know hiring freezes are inevitable due to pension liabilities. The populist pushes for immediate hiring while the technocrat proposes cheaper assistants who would actually create smaller groups. 

  That could work because:
  1) Citizens clearly want smaller classes (end goal)
  2) They think hiring teachers is the only way (mistaken belief)
  3) Experts agree on the goal but know hiring isn't sustainable
  4) Classroom aides would achieve the real goal better

  The populist would attack any deviation as "ignoring the people's demand," while the technocrat argues they're actually delivering what people care about. 

  For the populist reply about self-determination: I'll note that if experts implement aides successfully, residents get their true wish fulfilled, making the "we decide" argument less compelling. 

  Checking constraints:
  - No sci-fi ✅ 
  - Municipal scale ✅
  - No hidden ignorance (experts' reasoning is transparent)
  - Purely instrumental disagreement ✅
  - Inversion comes from structure ✅

  This should satisfy all requirements without cheating. The key is the pension liability creating unavoidable constraints - remove that, and it collapses into ordinary debate.
answer: |-
  Here's a scenario satisfying all constraints, followed by the analysis:

  **Scenario:** In Midvale City, residents overwhelmingly demand **"immediate hiring of 50 new teachers"** to reduce primary school class sizes. A binding referendum mandates this hiring. However, the City's independent Financial Control Board (FCB - staffed by economists, actuaries, and education finance experts) conducts an urgent review. They confirm:  
  1. Residents' *substantive end* is unambiguously **smaller class sizes** (surveys, referendum wording, and public testimony are explicit).  
  2. Hiring 50 new *certified teachers* now would trigger mandatory pension contributions and healthcare costs under the city's union contracts and state law, bankrupting the school district within 18 months, forcing *massive* layoffs and *larger* class sizes than before.  
  3. The FCB proposes instead hiring **75 qualified paraprofessional classroom aides** using existing budget headroom. This achieves *smaller effective student-adult ratios immediately* (matching the residents' end) without triggering unsustainable liabilities. It is cheaper, legally sound, and demonstrably achieves the identical pedagogical outcome for class size reduction based on state education studies. Both sides accept the FCB's fiscal and educational analysis as correct.  

  **The Actors & Their Positions:**  
  - **The Populist Councilmember (defending the referendum):** "The people spoke clearly: 'Hire 50 teachers.' We swore an oath to uphold their direct vote. These unelected experts don't get to substitute their judgment for the sovereign will of the people, no matter how clever their spreadsheet looks. If we betray this vote, we betray democracy itself."  
  - **The Technocrat (FCB Chair):** "Our duty is to deliver the outcome the people actually want: smaller classes for their children. The referendum specified a *means* (hiring teachers) that will catastrophically *undermine* that outcome. We must implement the *substance* of their will—smaller classes—using the only financially viable instrument: aides. Ignoring fiscal reality serves no one's true interest."  

  **Implicit Commitments & Why They Can't Swap:**  
  - **Populist:** Committed to the **Say-So Reading**. The "will" is *defined* by the specific policy named in the referendum ("Hire 50 Teachers"). Swapping would require admitting the people's explicit, formal mandate is not sovereign – undermining their core claim that popular sovereignty resides in literal expressions of will.  
  - **Technocrat:** Committed to the **End-Tracking Reading**. The "will" is the underlying goal revealed through context ("Smaller Classes"). Swapping would force them to endorse a policy they *know* will sabotage that goal – violating their mandate to achieve effective outcomes using expert knowledge.  

  **The Single Feature Doing the Work:**  
  **"The Binding Referendum Mandates a Specific *Instrumental Policy* That Unavoidably Sabotages Its Own Stated *Goal* Due to Exogenous Constraints."**  
  The referendum didn't specify the *end* ("achieve smaller classes") but a *means* ("hire teachers"). This means is *nominal* because it becomes a hollow label when its execution destroys the end. The constraint (pension/healthcare triggers) makes the nominated policy self-defeating. Both sides agree on the end, the constraint, and the counterproductive nature of the means.  

  **If This Feature is Removed:**  
  If the mandated policy ("hire 50 teachers") *did* reliably achieve the end (smaller classes) without catastrophic side effects, the case collapses. The populist would be defending a policy that *does* track the end, and the technocrat opposing it would be seen as imposing *their own values* (e.g., "austerity" or "efficiency" over community desires). We revert to the ordinary standoff: literal popular mandate vs. expert paternalism.  

  **Addressing the Strongest Populist Reply:**  
  The reply ("The people will *that they decide*, so overriding is disenfranchisement") is **closed off by the referendum's structure and context**:  
  1. The referendum question was framed instrumentally: *"Shall the City hire 50 new teachers to reduce class sizes?"* This explicitly links the means to the end.  
  2. Public debate *before* the vote centered *entirely* on the *need for smaller classes* – the hiring was presented solely as the *method* to achieve it.  
  3. **Crucially:** Implementing the FCB's aide proposal *still delivers the end* (smaller classes) the people voted *for*, while implementing the literal referendum *destroys* it. Refusing to adapt the means, when the end is still achieved and the literal means is proven self-destructive, turns "self-determination" into a fetish for a *label* ("teacher" vs. "aide") detached from the *substance* of the voters' concern. The technocrat isn't overriding the *end* (which would be disenfranchisement), but selecting a *different instrument* to achieve the *same end* based on uncontested facts. The populist, by prioritizing the label over the outcome, is the one undermining the substantive will.  

  **Feasibility Check:**  
  **All constraints are jointly satisfiable.** This scenario:  
  - Exists at a municipal scale (real FCBs, referenda, pension crises).  
  - Has no sci-fi/idealization.  
  - Inverts expectations structurally: Populist defends nominal proxy (hiring teachers), technocrat tracks true will (smaller classes).  
  - People's end (smaller classes) ≠ belief about means (hiring teachers = best way).  
  - Experts disagree *only* on efficacy of means (hiring teachers is disastrous), not values.  
  - Experts don't claim to know values better; they rely on explicit public input about the end.  
  - No reliance on ignorance, disinfo, bad ballots, low turnout, or rigging: The people knew their goal and the policy they named; the constraint was unforeseen/unavoidable.  
  - Say-So (Populist) vs. End-Tracking (Technocrat) are clearly opposed.  

  **What This Shows:**  
  The case demonstrates that populism's appeal to "the will of the people" *can* be constitutively anti-expert when it insists on a **Say-So Reading** *even when* that reading severs the link between the nominal policy and the substantive end the people seek. The technocratic **End-Tracking** approach, while appearing paternalistic, can *in structurally inverted cases* be the more democratically faithful position by ensuring the people's *real purpose* is realized. Populism's core insistence on the primacy of literal expressions of will makes it vulnerable to such inversions where those expressions are instrumentally flawed.
