  **INTERNAL MEMORANDUM**  
  **TO:** Human Capital Leadership, All Band Managers  
  **FROM:** Strategic Cognition Office (SCO-7)  
  **SUBJECT:** Competency, Grading & Credit-Assignment Framework (v4.3)  
  **DATE:** 2023-10-27  

  **1. PURPOSE**  
  1.1. This document formalizes the taxonomy, deployment protocols, and performance evaluation standards for all workforce grades following the Cognitive Reorganization Initiative (CRI-Phase 3).  
  1.2. Compliance ensures optimal credit assignment, resource allocation, and mitigation of competence inflation.  

  **2. DEFINITIONS & GRADE SPECIFICATIONS**  
  2.1. **Darwinian-Grade Staff (Band D):**  
      2.1.1. **Competency Profile:** Fixed action patterns; innate, species-typical responses. Zero trainability post-deployment.  
      2.1.2. **Resource Allocation:** No training budget. Performance "improvement" occurs via selective attrition/replacement (Lineage Optimization Levy applies).  
      2.1.3. **Deployment Note:** Ideal for high-reliability, low-variance tasks (e.g., basic infrastructure monitoring). Performance reviews are phylogenetic audits only.  

  2.2. **Skinnerian-Grade Staff (Band S):**  
      2.2.1. **Competency Profile:** Learns via operant conditioning. Competence requires direct reinforcement/consequence history.  
      2.2.2. **Resource Allocation:** Training budget denominated in Real Loss Units (RLUs). RLU expenditure must = projected cost of errors during learning curve.  
      2.2.3. **Deployment Note:** Field trials mandatory for competence acquisition. Never deploy untrialled hypotheses.  

  2.3. **Icarian-Grade Staff (Band I):**  
      2.3.1. **Competency Profile:** Generates internal simulations of candidate actions. **Lacks authority-conferral protocols:** Simulation outcomes do not veto action execution.  
      2.3.2. **Resource Allocation:** Requires RLU budget (as Band S). Simulation suite maintenance costs are additional.  
      2.3.3. **Deployment Note:** Simulations are aesthetic/exploratory only. Field trials remain essential (see 2.2.3). Distinguish from Band P: Icarians execute actions *despite* simulated failure.  

  2.4. **Popperian-Grade Staff (Band P):**  
      2.4.1. **Competency Profile:** Generates internal simulations. **Simulation verdict has binding authority:** Actions vetoed by simulation do not proceed to execution.  
      2.4.2. **Resource Allocation:** Zero RLU allocation for vetoed actions. Simulation suite costs are primary CAPEX.  
      2.4.3. **Deployment Note:** Field trials for validated simulations only. Sending Band P staff on trials for untested actions constitutes competence underutilization (see Charge Code 7.5: Waste of Hypothetical Mortality).  

  2.5. **Gregorian-Grade Staff (Band G):**  
      2.5.1. **Competency Profile:** Leverages culturally acquired mind-tools (e.g., language, calculus, process maps, CRM systems) to access non-native cognitive operations.  
      2.5.2. **Resource Allocation:** Mind-tool licensing, maintenance, and upgrade budgets exceed staff salary. Competence is tool-contingent.  
      2.5.3. **Deployment Note:** Never deploy without mandated tool suite (per role-specific Mind-Tool Manifest). Offsite/teambuilding events require tool-deprivation risk assessment (Form SCO-7G).  

  **3. MIND-TOOL ATTRIBUTION AUDIT (MTAA)**  
  3.1. **Purpose:** To correctly assign credit for output generated by Band G staff to the enabling mind-tools.  
  3.2. **Procedure:**  
      3.2.1. Isolate output (e.g., report, strategy, forecast).  
      3.2.2. Decompose output into constituent operations (e.g., sorting, calculation, analogical reasoning).  
      3.2.3. Attribute each operation to specific mind-tools using Tool Competency Mapping (Reference: Annex TCM-9).  
      3.2.4. Reclassify staff contribution as "Tool-Hosting & Signal-Routing."  
  3.3. **Output:**  
      3.3.1. Mind-tools receive performance credit (e.g., "Spreadsheet v3.4 exceeded error-tolerance benchmarks").  
      3.3.2. Band G staff performance rating = Tool-Hosting Efficiency Score (THES).  
  3.4. **Consequences:**  
      3.4.1. **Promotions:** Mind-tools advance to higher-specification roles (e.g., "Python Script promoted to Lead Data Handler").  
      3.4.2. **Compensation:** Equity awards granted to tool licensors/developers. Staff receive hosting/maintenance stipends only.  
      3.4.3. **Performance Reviews:** Conducted *with* the employee’s active mind-tool suite. Tool-deprived staff (see 2.5.3) default to Band S/I baseline for review purposes.  

  **4. PERFORMANCE MANAGEMENT IMPLICATIONS**  
  4.1. **Band D:** Review = Phylogenetic fitness report (HR-Bot 3000 auto-generates).  
  4.2. **Band S/I:** RLU consumption vs. task mastery curve (target: negative slope).  
  4.3. **Band P:** Hypothetical error mortality rate (target: >97% errors internalized).  
  4.4. **Band G:** THES (target: >0.95) + mind-tool performance ratings.  

  **5. DISSENTING COMMENT (FORWARDED - BAND S FIELD AGENT)**  
  > "Look, I crashed three drones learning the wind patterns over Site 7. The sims said Band I/P would 'see' the crash coming. But Sims don't feel the rotors shear. I paid in metal. Now I know. Pay the metal or stay grounded. This doc sims hard. Did it pay its metal?"  
  > **Response (SCO-7):** Comment validates Band S RLU dependency. Recommend drone cost deduction from agent’s RLU budget.  

  **6. FRAMEWORK AUTHORSHIP AUDIT (AUTO-APPLIED PER MTAA 3.2)**  
  6.1. This document’s competence is attributed to:  
      - Standardized Management Consultancy Lexicon (v6.1)  
      - Hierarchical Decimal Classification System (ISO 2145)  
      - Competency Framework Archetype Template (SCO-CFAT)  
  6.2. Author credit reclassified to tools per MTAA 3.3.1.  
  6.3. Author role: Transient host for SCO-CFAT instance generation. THES: 0.97.  

  **IMPLEMENTATION IMMEDIATE. NON-COMPLIANCE TRIGGERS COGNITIVE MISATTRIBUTION AUDIT.**  

  ---

  The author, once the Mind-Tool Attribution Audit is applied, is a Gregorian host whose apparent competence belongs entirely to the borrowed scaffolding of consultant frameworks and bureaucratic syntax, leaving no inherent authority to validate the taxonomy he propagates.  
  \answer{Gregorian}
