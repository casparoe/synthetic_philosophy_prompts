          = 0.5 * [ expected utility in state X ] + 0.5 * [ expected utility in state Y ]
          = 0.5 * [ (1/12) * (12 * u_i(100)) ] + 0.5 * [ (1/12) * (11*u_i(0) + u_i(1200)) ]
          = 0.5 * u_i(100) + 0.5 * (1/12) * (11*u_i(0) + u_i(1200))

     - This is not the same as above. 

     - We must be careful: the lottery Z is a compound lottery.

     - However, in the veil, the participant is first assigned an identity, then the lottery is played. Or first the lottery is played, then the identity is assigned? We should do: first the lottery determines the social state, then the identity is assigned uniformly.

     - Then the expected utility for a participant i (with utility function u_i) is:
          = (1/12) * [ 0.5 * u_i(100) + 0.5 * u_i(0) ]   [if assigned identity 1] 
            + ... for identity 2 to 11 similarly
            + (1/12) * [ 0.5 * u_i(100) + 0.5 * u_i(1200) ]   [ for identity 12]
          = (11/12) * [0.5 * u_i(100) + 0.5 * u_i(0)] + (1/12) * [0.5 * u_i(100) + 0.5 * u_i(1200)]

     - This is complex.

     - Alternatively, we can present two lotteries that have the same expected distribution but different risk on the minimum.

     Given the time, I recommend using a simpler example with two people.

     - For two people (imagine the group has two people for this example):
          Lottery E: (100,100) for sure.
          Lottery F: (200,0) with 50% chance, (0,200) with 50% chance.

     - The expected money for each in F is 100.
     - Behind the veil (not knowing which person you will be), the expected utility for a participant with utility function u is:
          For E: 0.5 * u(100) + 0.5 * u(100) = u(100)   [since you could be person1 or person2, but both get 100]
          For F: 0.5 * [0.5*u(200) + 0.5*u(0)] + 0.5 * [0.5*u(0) + 0.5*u(200)] = 0.5 * [0.5*u(200)+0.5*u(0)] + 0.5 * [0.5*u(0)+0.5*u(200)] = 0.5*u(200) + 0.5*u(0)

     - So if u is concave, then u(100) > 0.5*u(200) + 0.5*u(0), so they prefer E.
     - This is not about maximin, but about risk aversion. 

     - But note: in every state of the world in lottery F, there is a person who is very badly off (0). A maximin advocate might object to F on those grounds, and they would also prefer E.

     - However, if the social welfare function is linear in probabilities, then it would be forced to be indifferent between E and F, because the expected utility for each individual is 100 in both lotteries? 
          For individual 1 in lottery F: 0.5*200 + 0.5*0 = 100.
          For individual 2 in lottery F: 0.5*0 + 0.5*200 = 100.
          In lottery E: individual 1 gets 100, individual 2 gets 100.
          So if the social welfare function is the sum of expected utilities, then both give 200, so indifferent.

     - Therefore, if the group prefers E to F, they must have a social welfare function that is not linear in probabilities.

     - So in the activity, we can do this for the whole group with 12 people, but it's computationally heavy. Instead, do a thought experiment with two people.

     - Present the two lotteries E and F for two people. Ask the group: which is better socially? They will likely say E.
     - Then show that for each individual, the expected money is 100 in both. So if we use expected utility for each individual and sum, we are indifferent.
     - But society is not indifferent. Therefore, we cannot have a social welfare function that is linear in probabilities if we want to care about the minimum in every state.

     - This breaks the vNM independence or the linearity in probabilities for social preferences.

   Part 5: The weights are arbitrary (15 minutes)
     - We return to the first two distributions (Dist1 and Dist2) and now reveal that we will use a weighted sum of individual utilities to decide.
     - We then let them spend points to set the weight for their own identity.
     - We as activity facilitators then compute the social welfare for Dist1 and Dist2 using the weights determined by the points they spent.
     - But to show it's arbitrary, note that if they spend more, they get more weight. And the winner might be different if weights change.

     - We can do a before and after: first with equal weights, then with weights set by spending.

     - But since the points are not valuable, they might not care. So we might have to just state that the weights are not determined by the theorem.

   Given the complexity, I think for the first run, we focus on the first goal with the two-person lottery example and then state the second goal in the debrief.

   Debrief (10 minutes):
     - We have seen that if we want to give priority to the worst off, we might need to break the vNM axioms for social preferences (as in the lottery example).
     - In the veil of ignorance activity, we naturally got equal weights utilitarianism. But the theorem allows any weights. The weights might be set by the probability in the veil. In our activity, the probability was equal, so weights were equal. But if the probability is not equal, then the weights are not equal. However, the theorem doesn't force the weights to be equal to any particular probability. The weights are arbitrary from the theorem.
     - The takeaway: the utilitarian form (additive) is forced by the axioms, but the weights are not. And the utilitarian form cannot capture maximin without breaking the axioms.

   Materials:
     - Index cards with utility functions (12 different ones, e.g., u(x)=x, u(x)=sqrt(x), u(x)=x^2, but mostly concave ones).
     - Whiteboard to write the distributions and lotteries.
     - Markers.

   Timeline:
     - Part1: 10 minutes
     - Part2: 10 minutes
     - Part3: 15 minutes (with the two distributions and then the lottery example with two people for simplicity)
     - Part4: 15 minutes (weights spending: but if we skip due to complexity, then move to debrief)
     - Debrief: 10 minutes

   What will predictably go wrong:
     - In Part2, when they discuss which distribution is better, they might not reach a consensus and it may take too long.
     - In the veil of ignorance part, the computation of expected utility might be too time-consuming. Some might not be able to compute.
     - The lottery example with two people might be too abstract for some.

     - We can provide worksheets for the expected utility calculations.

   Given the time, I think we can do the following activity for the weights:

     - We simply state: "The theorem says that the social welfare function must be a weighted sum, but it doesn't say what the weights are. In our veil of ignorance activity, we used equal weights because we assigned equal probability to each identity. But imagine that we assigned different probabilities. That would correspond to different weights. So the weights are like the probability of being that person in the veil. But without the veil, how do we set the weights? They are arbitrary."

     - Then we can ask: "What if we are not egalitarian? What if we care more about some people than others? Then we would assign higher weights to those people."

     - This makes the point.

   Therefore, the activity can be:

     1. Individual preferences with index card utility functions (10 minutes).
     2. Group ranking of two distributions without the veil -> conflict (10 minutes).
     3. Group ranking behind the veil -> utilitarian solution (10 minutes).
     4. The maximin challenge: with the two-person lottery example to show the conflict with vNM (10 minutes).
     5. Discussion of weights: the veil of ignorance as a device to set weights, but note the weights are whatever probability distribution we use in the veil. The theorem doesn't require the veil, but the veil is one way to set the weights. (5 minutes)
     6. Debrief: (10 minutes)
          - Assumptions: 
               a. Individual vNM preferences: we assumed that.
               b. Social vNM preferences: we saw that if we want maximin, we break this.
               c. Pareto indifference: if everyone is indifferent, society is too. We didn't challenge that.
          - The weights are not pinned down.
          - The additive separability means we can't have a social welfare function that is strictly concave in utilities to prioritize the worse off.

   This fits in 55 minutes, leaving 5 minutes buffer.

   Let me know if you need more details on any part.
answer: |-
  ### Activity Design: "Veil of Ignorance Lottery Challenge"

  **Goal:** Participants experience Harsanyi's aggregation theorem by discovering that (1) additive separability prevents "ramping up" priority for the worst off, and (2) social weights are arbitrary and morally loaded.

  **Materials:**  
  - 12 index cards (one per person) with unique vNM utility functions over money (e.g., `u(x) = √x`, `u(x) = x`, `u(x) = x²`, `u(x) = ln(x+1)`, etc.).  
  - Whiteboard to display lotteries.  
  - Token system (e.g., poker chips or marked index cards) for "points."  
  - Timer.

  **Setup (5 min):**  
  1. Hand out index cards. Each card lists:  
     - A person’s ID (e.g., "Person 1")  
     - Their vNM utility function (e.g., "Your utility from $x is √x").  
  2. Explain: *"You’ll choose a lottery for society. Each lottery pays money to all 12 people. Behind the 'veil of ignorance,' you don’t know which person you’ll become. After we choose, I’ll randomly assign your identities."*

  ---

  ### Phase 1: The Lottery Choice (25 min)
  **Step 1: Introduce lotteries (5 min)**  
  Display two options on the whiteboard:  
  - **Lottery A:** Everyone gets $100.  
  - **Lottery B:**  
    - 50% chance: 11 people get $200, 1 person gets $0.  
    - 50% chance: 11 people get $0, 1 person gets $200.  
  *"Discuss: Which lottery is better for society? Use your utility functions."*

  **Step 2: Initial vote and discussion (5 min)**  
  - Vote by show of hands (A vs. B).  
  - Facilitate debate: *"What if you’re the worst off? What’s fair?"*  
  *Predictable outcome:* Most prefer **A** due to risk aversion and inequality aversion.

  **Step 3: The points mechanic (15 min)**  
  - *"You have 10 points each. Spend points to shift probabilities. Each point spent increases the chance of your preferred lottery by 0.1%."*  
    - Participants secretly write how many points they spend on A or B (e.g., "Spend 8 on A, 2 on B").  
  - Collect bids. Calculate:  
    - Total points for A = `P_A`, for B = `P_B`.  
    - Probability of A = `P_A / (P_A + P_B)`.  
  - Announce the winning lottery based on probability (e.g., roll dice to simulate).  
  - **Reveal identities:** Randomly assign each participant to a Person ID.  
  - Calculate payouts: Apply each person’s utility function to their $ outcome.  
  - *Debrief hint:* Note who spent points and why. Risk-averse players aggressively pushed for A.

  ---

  ### Phase 2: Challenging Additive Separability (20 min)
  **Step 1: Introduce a new lottery (5 min)**  
  Display:  
  - **Lottery C:** Everyone gets $95.  
  - **Lottery D:**  
    - 90% chance: All get $99.  
    - 10% chance: 11 people get $100, 1 person gets $0.  
  *"Is D better than C? What about the worst-off person?"*

  **Step 2: Discussion and vote (5 min)**  
  - *Predictable conflict:* Utilitarians (via expected utility) may prefer D. Egalitarians reject D due to the 10% catastrophe risk.  
  - Vote again.

  **Step 3: Points mechanic round 2 (10 min)**  
  - Repeat points spending for C vs. D.  
  - *Predictable outcome:* Points split. Social ranking is ambiguous.  
  - **Key twist:** Force a Pareto indifference check: *"Suppose everyone is indifferent between C and D. Should society be indifferent?"* (Most say yes).  

  ---

  ### Phase 3: Revealing the Weights (15 min)
  **Step 1: The weights revelation (5 min)**  
  - *"Let’s see why you won or lost. Your spending changed the weights."*  
  - Calculate each person’s **implicit weight** as:  
    `(Points spent by person) / (Total points spent)`.  
  - Show on whiteboard: "Social Welfare = Σ [weight_i × u_i(outcome)]".  
  - Demonstrate with Lottery A vs. B:  
    - Social welfare of A = Σ [weight_i × u_i(100)]  
    - Social welfare of B = Σ [weight_i × (0.5 × u_i(200) + 0.5 × u_i(0))]  
  - *"You thought you were shifting probabilities. You were actually choosing weights."*

  **Step 2: Why weights are arbitrary (5 min)**  
  - Ask: *"What if someone spent zero points? What if I gave extra points to some?"*  
  - Highlight:  
    - Weights depend on points (bargaining power), not ethics.  
    - Nothing in the "rules" required equal points or equal weights.  

  **Step 3: Why "worst-off priority" breaks (5 min)**  
  - *"Earlier, some wanted to prioritize the worst off. Let’s test that."*  
  - Propose a **maximin lottery**: "All get $90, or cancel the 10% catastrophe in D."  
  - Show this violates the calculated social welfare (weights are fixed per person, not outcome-dependent).  
  - *"Which assumption broke? The social ranking must satisfy vNM axioms (like independence), but maximin doesn’t."*  

  ---

  ### Debrief (10 min)
  **Map the activity to Harsanyi:**  
  1. **vNM preferences:** Each of you used your card’s utility function.  
  2. **Social vNM axioms:** When we aggregated via weights, social ranking was linear.  
  3. **Pareto indifference:** When you assumed unanimous indifference, you accepted social indifference.  

  **What went as planned?**  
  - You felt additive separability: Weights were fixed per person, so you couldn’t "ramp up" help for the worst off.  
  - You saw weights are arbitrary: Spending points = setting weights. No moral anchor.  

  **What the activity *can’t* show (state explicitly):**  
  - The theorem *proves* additivity is *required* under the axioms. We experienced it; the proof is formal.  
  - The theorem doesn’t assume a "veil of ignorance." We used it to motivate weights, but Harsanyi doesn’t need it.  

  **Final punchline:**  
  *"You’ve experienced Harsanyi’s aggregation theorem. Society’s preferences are a weighted sum of individual utilities. The catch? The weights are everything, and the theorem doesn’t tell us how to set them. Any 'fairness' must come from outside."*  

  **Why this works:**  
  - Points spending = choosing weights is an "aha!" moment.  
  - Conflicts in Phase 2 highlight the maximin-vNM tension.  
  - Low math, high intuition. No real money preserves the "veil" spirit.  

  **Predictable hiccups (and fixes):**  
  - **First-run chaos:** Participants may not grasp utility functions. *Fix: Do a quick example (e.g., "If your u(x)=√x, $100 gives 10 utils") before starting.*  
  - **Point-spending confusion:** Some may hoard points. *Fix: Emphasize "spend all points; they’re worthless after."*  
  - **Time crunch:** Skip Phase 2’s points round if needed. Use discussion to expose maximin conflict.
