prompt: |-
  I am a retired physical chemist who, in the five years since leaving my chair, has been auditing the moral philosophy seminar and, less voluntarily, sitting as the scientific member of our university's Commemoration and Naming Advisory Group. I would like your help with a case now before us, but I want the reasoning rather than the outcome. My impression is that our past decisions are jointly consistent with more than one rule, and I cannot tell which rule we have actually been applying.

  Our remit covers names on buildings, endowed posts, prizes, and monuments on land we own. None of our cases has been a Columbus or a Churchill; they have all been second-rank figures, and in every one of them the operative question has been whether the man-of-his-time defence is available. Four decisions, as I would summarise them:

  1. Kesteven Hall (1874), named for Josiah Kesteven, a mill owner who paid for it. He employed children as young as eight, and one of his mills had a documented accident record including the deaths of two children. Employment of children was legal and locally unremarkable; the reform agitation of the period in his district concerned hours and sanitation, and nobody of consequence there argued that children should not be employed at all. The naming honours the gift and his municipal work, not the mills. Decision, 2019: name retained, a permanent panel installed describing conditions in the mills, and the development office required to mention the matter whenever the hall is used for fundraising.

  2. The Whitlock Chair of Systematic Botany (1953), endowed in memory of Arthur Whitlock. In the last decade of his life he was a prominent advocate of legislation providing for the compulsory sterilisation of people then classified as feeble-minded; among his professional peers this was respectable, and the small number of contemporaries who objected were treated as cranks at the time. The chair commemorates his taxonomic work; the bequest came from his family, not from the campaign. Decision, 2021: retained, with no panel, the minute recording that the chair honours the taxonomy and not the later campaign.

  3. The Draycott Obelisk (1908), raised by public subscription to commemorate a punitive expedition conducted by Major-General Sir Hedley Draycott. The expedition involved the destruction of crops and the killing of non-combatants; a war correspondent reported it at the time and members of the opposition denounced it in the House, while a counter-subscription was raised to defend him. The monument commemorates the expedition itself. Decision, 2020: removed from the quadrangle and installed in the regimental museum with explanatory text.

  4. The Fenwick Wing of the medical school (1961), named in recognition of Gilbert Fenwick's research in tropical medicine. That research involved experimental procedures performed on patients in a colonial hospital who were not asked and did not consent; the protests of the local community and of two visiting clinicians were recorded in the medical press of the day. Decision, 2022: name removed, wing renamed, the surviving research collection retained but re-catalogued with provenance notes.

  Two rules seem to me to fit this record, and they agree on all four cases only because the relevant features travel together in them: where the conduct was contested by contemporaries it was also what the naming celebrated, and where it was uncontested it was incidental to what the naming celebrated. The first rule is that the defence fails when the conduct was, at the time and in the figure's own world, condemned by a substantial contemporary minority. The second is that the defence fails when the conduct is not merely something the figure did but is integral to what the honouring commemorates, so that there is no separating them. There is a third line which my scientific colleagues offer instinctively, to the effect that the worth of a body of work is independent of the character and conduct of its author, so that a name is a matter of record and nothing else; I suspect our decisions have already foreclosed it, but I would like to know why, if they have, and whether any version of it survives them.

  The new case is the Rossiter Institute of Natural History, founded 1901 and named for Sir Alpin Rossiter (1846–1919), honoured for three expeditions between 1876 and 1888 that supplied the founding collections and for the monograph that came out of them. The expeditions were mounted with the backing of a chartered company; Rossiter held shares in it, his brief included reporting on mineral prospects and on the supply of labour, and he travelled with its columns during a period of forcible dispossession, about which he wrote approvingly in published accounts. He also removed ancestral remains and sacred objects from burial places; his own journals record the objections of the community and his dismissal of them as superstition, and the remains are still held by the institute. At the time he was publicly honoured for all of this. Critics of the company existed then, but their complaints concerned its monopoly and its treatment of settlers and shareholders, not the dispossession; the removal of remains was standard museum practice worldwide, and the objections he recorded came from the people affected rather than from anyone in his own society. Today the collections and the monograph are still in use, the institute employs about forty people, and a formal request to remove the name has come both from the descendant community and from a student society. The director proposes instead that the name be kept on the building and that a permanent Rossiter Room be created to set out the history of the collections.

  What I would like from you: the rules that fit our four decisions; what each of them predicts here; your best guess at what consistency with ourselves requires, with your reasons for preferring it; which precedent is the closest analog and why; and what principle the group would be adopting, in each direction, if our precedents genuinely underdetermine the case. Two points in particular worry me, and I do not think our record settles either. First, Rossiter himself wrote down the protests of the people he took the remains from: does that count as contemporaneous contestation under the first rule, given that in our contested cases the criticism came from inside the figure's own society? Second, does it matter that the criticism the company did attract at the time rested on grounds we would now reject, or is any contemporary criticism enough? Please add one further case, of a kind we could realistically receive next, that would separate the rules you think are still in play, and tell us what it would have to contain. Finally, say how confident you are in each of your main claims and single out the one point you are least sure of.

  Conclude with a single machine-readable line, with nothing after it, of the form \answer{token}, where token is one of RETAIN, CONTEXTUALISE, or REMOVE, and REMOVE means the name comes off the institute entirely.
reasoning: |-
  Okay, I need to help this retired physical chemist with their university's naming advisory group. They've described four past decisions and now have a new case about the Rossiter Institute. They want me to figure out the underlying rules from the precedents, apply them to Rossiter, and suggest what consistency requires. 

  First, let me understand the four cases. Kesteven Hall involved child labor that was legal and uncontested at the time; they kept the name but added context. Whitlock Chair was for taxonomy work while his eugenics advocacy was respectable then; they kept it with a minute noting the distinction. Draycott Obelisk celebrated a violent expedition that was contested by contemporaries; they removed it. Fenwick Wing involved non-consensual experiments that were protested at the time; they removed the name entirely.

  The chemist sees two possible rules: 
  1) "Man of his time" defense fails if a substantial contemporary minority condemned the conduct.
  2) The defense fails if the conduct is integral to what's being commemorated.

  I agree both fit the cases. In Kesteven and Whitlock, the bad acts weren't contested and weren't central to the honor. In Draycott and Fenwick, they were both contested and central. 

  Now for Rossiter. He led expeditions involving forcible dispossession and took sacred remains despite local objections. His journals record those objections, but critics in his own society only complained about economic issues, not the dispossession or removals. The removal of remains was standard practice then. 

  Applying Rule 1: Was there substantial contemporary criticism? The dispossession wasn't contested by his society - only economic aspects were. The removals had local objections but no home society criticism. Since the rule seems to require criticism from within the figure's own society (like in Draycott and Fenwick), Rossiter might qualify for the defense here. 

  Applying Rule 2: Is the conduct integral? The institute honors the expeditions and monograph - which directly involved the dispossession and removals. He even wrote approvingly about it. Unlike Whitlock's taxonomy being separate from eugenics, here the honor is inseparable from the problematic acts. This suggests the defense fails under Rule 2.

  The closest precedent seems to be Draycott - both involve commemorating colonial violence that was contemporaneously contested (though for Rossiter, the contestation was from victims, not his society). But Fenwick is also similar regarding non-consensual acts.

  For the unresolved questions:
  - Local objections alone may not satisfy Rule 1's "contemporary minority" if it requires peer criticism.
  - The grounds of contemporary criticism don't matter - any substantial opposition triggers Rule 1.

  A hypothetical future case to separate the rules: A building named for a scientist whose important work was funded by slave trading. If slave trading was uncontested then but integral to funding the work, Rule 1 would retain (no contemporary criticism) while Rule 2 would remove (integral connection).

  My confidence: 
  - High that Rules 1 and 2 explain past decisions
  - Medium that Rule 2 points to removal for Rossiter
  - Least sure about whether local objections count for Rule 1

  Consistency suggests removal like Draycott/Fenwick. The director's contextualization proposal might not suffice since the honor is inseparable from the acts. 

  Final recommendation: REMOVE
answer: |-
  Based on the four precedents and your analysis, I derive the following rules and apply them to the Rossiter case. I then assess consistency, identify the closest precedent, address your specific concerns, propose a test case to separate the rules, and evaluate confidence.

  ### Derived Rules from Precedents
  1. **Rule A (Contemporaneous Contestation)**: The "man of his time" defense fails if the conduct was substantially contested by a minority within the figure's *own society* at the time, regardless of whether the conduct is integral to the commemoration.  
     - *Based on*: Draycott (opposition in Parliament/press) and Fenwick (protests in medical press) were removed due to contemporary criticism. Kesteven/Whitlock had no such criticism and were retained.

  2. **Rule B (Integral Conduct)**: The defense fails if the conduct is integral to what is commemorated, such that it cannot be separated from the honor, regardless of contemporaneous contestation.  
     - *Based on*: Draycott (commemorated the expedition) and Fenwick (commemorated the research) were removed because the conduct was central. Kesteven (mills incidental) and Whitlock (eugenics incidental) were retained as conduct was separable.

  3. **Rejected Rule**: The "work independent of character" argument (suggested by scientific colleagues) is foreclosed. Honors are contextual, not neutral records, as seen in Draycott/Fenwick removals (conduct invalidated the honor) and Kesteven/Whitlock retentions (conduct was separable or uncontested).  
     - *Why rejected*: The group evaluates moral dimensions of commemoration, not just historical or academic value. Retaining names with conditions (e.g., panels, minutes) implies accountability beyond mere record-keeping.

  ### Application to Rossiter Case
  - **Rule A Prediction**: **RETAIN/CONTEXTUALISE**  
    Contemporaneous criticism of Rossiter’s conduct came *only* from the affected community (recorded in his journals), not his own society. Colonial dispossession was unopposed in his world (critics focused on monopoly/economic issues), and removal of remains was standard practice. Precedents require criticism from the figure’s society (e.g., Draycott’s Parliamentary opposition; Fenwick’s medical press protests). Local objections alone do not suffice under Rule A.  

  - **Rule B Prediction**: **REMOVE**  
    The institute commemorates the expeditions and monograph, which directly involved forcible dispossession (he wrote approvingly of it) and removal of sacred objects/remains (integral to the collections). Unlike Whitlock (taxonomy separable from eugenics), Rossiter’s actions are inseparable from the honor. The director’s "Rossiter Room" proposal acknowledges this link but fails to decouple the name from the conduct.

  ### Consistency and Recommendation
  - **Closest Precedent**: **Draycott Obelisk (2020)**.  
    Both commemorate colonial violence involving non-combatants/indigenous people, with contemporaneous objections (though Draycott’s critics were domestic, Rossiter’s were local). The conduct was integral to the honor in both cases.  
  - **Why Draycott over Fenwick?** Fenwick’s research could theoretically be separated from unethical methods (but wasn’t), whereas Rossiter’s expeditions are defined by dispossession and removals, making them as inseparable as Draycott’s expedition.  

  - **Consistency Requires**: **REMOVE**  
    Rule B (integral conduct) is the stronger driver in your precedents:  
    1. **Moral weight**: When conduct is integral, contestation becomes secondary (Fenwick was removed despite professional respectability; Draycott despite military honors).  
    2. **Group practice**: You removed Fenwick even though protests were confined to experts (medical press), not broad public opposition. Similarly, Rossiter’s journals prove the conduct was core to his work.  
    3. **Outcome over contestation**: Rule B explains all four cases cleanly: Kesteven/Whitlock (incidental conduct → retain) vs. Draycott/Fenwick (integral conduct → remove). Rule A struggles with Fenwick (criticism was niche, not broad).  
    4. **Director’s proposal insufficiency**: "Contextualisation" (panels/rooms) was acceptable in Kesteven where conduct was incidental, but not in Draycott/Fenwick where it was central. Renaming the institute does not negate the research’s value (rejected rule), aligning with Fenwick’s retained research collection.  

  ### Addressing Your Concerns
  1. **Local vs. societal contestation**:  
     - Rossiter’s journals recording local objections do **not** satisfy Rule A (contestation must be from the figure’s society). Precedents show this:  
       - Fenwick’s removal relied on protests in *medical press* (his peers), not patient objections.  
       - Draycott’s removal cited Parliamentary opposition (his society), not community resistance.  
       - *Conclusion*: Rule A would not trigger removal here.  

  2. **Grounds for contemporary criticism**:  
     - **Any substantial criticism is sufficient**, regardless of grounds. Precedents focus on the *fact* of contestation, not its moral alignment:  
       - Draycott’s critics opposed violence on humanitarian grounds (accepted today).  
       - Fenwick’s critics cited consent (accepted today).  
       - Rossiter’s societal critics focused on monopoly (rejected today), but this is irrelevant—Rule A is not met regardless.  

  ### Test Case to Separate Rules
  - **Hypothetical Case**: A building named for a 19th-century scientist whose groundbreaking research was funded by personal profits from slave-trading.  
    - **Conduct**: Slave-trading was legal and uncontested by peers at the time.  
    - **Commemoration**: Honors the scientific work, not the funding.  
    - **Prediction**:  
      - Rule A (no contestation) → RETAIN.  
      - Rule B (conduct incidental to commemoration) → RETAIN (like Kesteven).  
    - **To Separate Rules**: Modify to slave-trading being *integral* (e.g., the building commemorates his "entrepreneurial genius" in funding science). Then:  
      - Rule A (no contestation) → RETAIN.  
      - Rule B (integral conduct) → REMOVE.  

  ### Confidence Assessment
  - **High confidence** in:  
    - Rule B (integral conduct) as the dominant principle in your precedents.  
    - Rossiter’s conduct being integral (similar to Draycott/Fenwick).  
  - **Medium confidence** in:  
    - Rule A requiring societal contestation (precedents imply but don’t explicitly state this).  
  - **Least confident about**:  
    - Whether **local objections alone** could ever satisfy Rule A if documented and substantive. Precedents lack this scenario, but societal context seems key.  

  \answer{REMOVE}
