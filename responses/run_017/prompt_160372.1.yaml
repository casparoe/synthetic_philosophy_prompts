prompt: |-
  I have one fifty-minute section in a first-year epistemology module on self-locating belief, and I want to spend it on the Sleeping Beauty problem. The students know Bayes' theorem and have already been through Monty Hall; they have not met centred or indexical evidence as such. Do not argue me towards halving or thirding — I can read that literature myself. Plan the session.

  What has to be in place before the disagreement looks like a puzzle rather than a trick, and how do I get there from Monty Hall rather than from scratch? Which single case should carry the whole thing, and why should it not simply be the standard Sunday-toss story told straight: what must the carrying case contain, and what must it lack, for the thought that nothing new has been learned to feel genuinely tempting rather than obtuse? I am inclined to open with a duplication variant instead, but argue me out of it if it smuggles in more than it shows.

  Then the misconception map. I expect at least the move that one-third is merely the relative frequency of awakenings and so not a credence at all, and the move that the answer is really fixed by how a bet would be settled; give me the others, and say for each at what point in the sequence it must be headed off, distinguishing what has to be blocked before I let the disagreement surface from what should be dealt with only afterwards.

  Finally, one closing question that tells me the indexical point has landed rather than merely been absorbed. I was considering a variant in which the coin is tossed on Monday night, after the first awakening, rather than on Sunday, but I am unsure whether that tests the point or merely muddies it. And tell me what I should openly refuse to explain at this level, the betting arguments and anything Everettian being my own candidates.
reasoning: |-
  Okay, let me tackle this epistemology lesson plan for Sleeping Beauty. The professor wants a focused 50-minute session building from Monty Hall knowledge, avoiding deep dives into halving/thirting debates. Key goals: make the puzzle feel genuine, not tricky; structure misconceptions strategically; end with a diagnostic question on indexicality.

  First, why Monty Hall is the perfect launchpad. Both involve counterintuitive probability shifts, but Monty Hall's assumptions are explicit (host must reveal a goat), while Sleeping Beauty's hidden indexical element creates the real puzzle. I'll contrast them upfront: Monty Hall changes probabilities through *public evidence elimination*, whereas Sleeping Beauty's uncertainty is *centered*—same facts, different "now."

  For the core case, standard Sunday-toss works IF we emphasize Beauty's total amnesia. The "nothing learned" temptation must feel plausible, so the case needs: 
  - Absolute symmetry (indistinguishable awakenings) 
  - No hidden interim information (coin tossed Sunday guarantees no Monday/Tuesday clues) 
  But crucially, highlight her altered temporal perspective—she's "inside" the experiment now. Duplication variants risk smuggling in metaphysical baggage about identity, so Sunday-toss stays cleaner.

  Misconception roadmap: Block these BEFORE revealing disagreement:
  1. **"It's just awakening frequency!"**: Preempt by distinguishing *temporal perspective* (how often she's awake) from *epistemic perspective* (credence upon awakening). Use a variant where she's woken Monday regardless—frequency same, but credence should shift.
  2. **"Betting settles it!"**: Postpone! This conflates decision theory with credence. Save for after the puzzle is established.

  Address post-revelation:
  - "Heads means I'm Monday!" (ignoring tails/Monday possibility)
  - "But Sunday credence was 1/2!" (failing to see indexical update)

  Closing diagnostic: The Monday-toss variant is PERFECT. If coin is tossed *after* Monday awakening, her credence upon waking Monday must be 1/2—she knows it's Monday if awake, so no indexical confusion. If they grasp why this differs from the original, indexicality landed.

  Hard boundaries: 
  - No betting arguments (decision-theoretic rabbit hole)
  - No Everett (quantum mechanics overcomplicates)
  Stay laser-focused on the indexical evidence shift.
answer: |-
  Here's a structured 50-minute plan focused on establishing the *puzzle* of Sleeping Beauty (SB) while leveraging prior knowledge of Bayes/conditional probability and Monty Hall. The goal is to make indexical evidence the unavoidable crux, not a trick.

  ---

  ### **Phase 1: Bridge from Monty Hall (12 mins)**
  - **Hook (3 mins):**  
    > *"Recall Monty Hall: When the host reveals a goat, your credence shifts from 1/3 → 2/3 in your initial door. Why? Because you learned indexical information—*which specific door *has a goat. Today, we see how 'which time is now?' can similarly shift credences."*  
    → *Key contrast:* Monty Hall gives **public, non-indexical evidence** (a goat is revealed at Door X). SB involves **private, indexical evidence** ("I am awake *now*").
    
  - **Set Up Core SB Case (9 mins):**  
    Use the **standard Sunday-toss setup** (coin flipped Sunday; Heads: awake Mon only; Tails: awake Mon & Tue; amnesia drug). *Why this and not duplication?*  
    - Duplication variants (e.g., fission copies) introduce *persisting identity/synchronicity* questions that distract from the core epistemic issue. Sunday-toss is ontologically neutral → focuses purely on **temporal self-location**.  
    - *Crucial for "nothing learned" plausibility:*  
      → Beauty knows pre-experiment: *P*(Heads) = 1/2.  
      → Upon awakening: She learns **only** "I am awake *now*." But she *already knew* she’d be awake! This feels like "no new information" → tempts the intuition *P*(Heads) = 1/2.  
      → *The puzzle needs this symmetry:* Awakenings are subjectively identical, with no access to external time.  

  ---

  ### **Phase 2: Surface the Disagreement (10 mins)**  
  - **State Both Positions:**  
    Halfer: "No new info → *P*(Heads) = 1/2."  
    Thirder: "Awakenings are equally likely → *P*(Heads) = 1/3 (since 1/3 of awakenings are Heads)."  
    → **Emphasize:** Both use conditional probability. The conflict arises from *how to model "now."*  

  - **Why This Isn’t a Trick:**  
    > *"In Monty Hall, we agreed on how to conditionalize (the host’s rules are public). Here, we disagree on what ‘I am awake now’ rules out. Is it a centered world? A temporal partition?"*  

  ---

  ### **Phase 3: Misconception Map & When to Block**  
  *(Total: 18 mins – integrate throughout phases 1-2)*  
  Preempt **before** surfacing disagreement:  
  1. **"Credence = Awakening Frequency"**  
     - *Block:* During setup (Phase 1). Distinguish:  
       → *Temporal* fact: "2/3 of awakenings happen on Tails"  
       → *Epistemic* question: "What should Beauty *believe* upon waking?"  
     - *Tool:* Ask: *"If Beauty is woken on Monday regardless of the coin, and only on Tuesday for Tails, is P(Heads|awake) still 1/2?"* (Yes – no extra awakening to "oversample").  

  2. **"Beauty knows it’s Monday if Heads"**  
     - *Block:* During setup. Stress amnesia: she never knows if it’s Mon/Tue upon waking. Use a **calendar variant**:  
       > *"Suppose on Heads, a red paper is left on Mon; on Tails, green on Mon, blue on Tue. Upon waking, she sees no paper. Now what is P(Heads)?"*  
       → If she sees no paper, she knows it’s not Mon/Heads → *P*(Heads) = 0. But in the standard case, **no such evidence exists**.  

  Post-revelation **after** surfacing disagreement:  
  3. **"Betting Arguments Fix the Answer"**  
     - *Defer:* "We’ll revisit decision theory later; today is about *credence*." (Avoids conflating probability with utility/payout structures).  
  4. **"Sunday’s 1/2 Just Carries Over"**  
     - *Address:* With Bayes: *P*(Heads|Awake) = *P*(Awake|Heads)⋅*P*(Heads) / *P*(Awake).  
       → Halfer: *P*(Awake|Heads) = 1, *P*(Awake) = 1 → *P*(Heads|Awake) = 1/2.  
       → Thirder: *P*(Awake|Heads) = 1, *P*(Awake) = 3/2? → No: *P*(Awake) requires **weighting awakenings** (1/2 × 1 + 1/2 × 2 = 3/2).  
       → *The core clash:* Is *P*(Awake) defined over *coins* or *awakenings*?  

  ---

  ### **Phase 4: Closing Diagnostic (7 mins)**  
  - **The Test Question:**  
    > **Modified SB:** Coin is tossed *Monday night* (after first awakening). Beauty knows this. Upon awakening *Monday morning*, what is her *P*(Heads)?  

    - *Why this works:*  
      → She knows it’s Monday (since coin not tossed yet, no Tuesday awakening possible).  
      → No indexical uncertainty → *P*(Heads) = 1/2.  
      → *Contrast with original:* In original, upon awakening she *doesn’t* know if it’s Mon/Tue → indexical ambiguity forces the update.  
    - *Diagnostic:* If students see why this case *removes* the indexical element ("I know 'now' is the only awakening today"), they’ve grasped the point.  

  - **What to Refuse to Explain (3 mins):**  
    → **Betting arguments:** "Payout schemes involve decision-theoretic complications we’re bracketing today."  
    → **Everettian QM:** "This isn’t about quantum branching; it’s about modeling self-location under ignorance."  
    → **Halting/Thirting deep cuts:** "We’re focusing on *why* it’s a puzzle, not resolving it – that’s for advanced seminars."  

  ---

  ### **Timeline Summary**  
  | Segment          | Time  | Key Activity                                                                 |
  |------------------|-------|------------------------------------------------------------------------------|
  | **Bridge**       | 12 min | Monty Hall contrast → Standard SB setup (stress amnesia/symmetry).           |
  | **Puzzle**       | 10 min | Surface halfer/thirder; frame as "what does 'I am awake now' conditionalize?" |
  | **Misconceptions**| 18 min | Preempt frequency/calendar errors early; defer betting, tackle Bayes post-revelation. |
  | **Close**        | 7 min  | Monday-toss variant (diagnostic); explicitly bracket betting/Everett.        |
  | **Buffer**       | 3 min  | Q&A or pause.                                                                |

  ---

  **Why this works:** The Monday-toss variant cleanly isolates indexicality by removing temporal uncertainty. By refusing betting/Everett, you avoid conflating credence with pragmatics or metaphysics. The progression from public evidence (Monty Hall) to private indexical evidence (SB) makes the puzzle feel inevitable—not gimmicky—and the misconception management ensures students engage the core issue before retreating to deflationary moves.
