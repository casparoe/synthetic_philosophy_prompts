answer: |-
  ### Exam Question: Concepts of Infinity in Computing

  **Preamble:** This question explores foundational ideas of infinity relevant to computing. Focus on the conceptual distinctions and logical arguments requested in each part. Avoid retelling the Hilbert's Hotel anecdote; instead, address the specific prompts about potential vs. actual infinity, computability, and mathematical reasoning. Total marks: 25. Time guidance: 75 minutes.

  ---

  **(a) Potential vs. Actual Infinity**  
  Consider two conceptions of an "infinite hotel":  
  - **Conception X**: The hotel is constructed step-by-step. At each finite stage, it has finitely many rooms (say, \(n\) rooms at stage \(n\)), but it can always be extended by adding one more room.  
  - **Conception Y**: The hotel exists as a completed totality with infinitely many rooms (rooms \(0, 1, 2, \dots\)) all present "at once."  

  (i) Explain why an infinitely large coach party (one guest per natural number) *cannot* be fully accommodated in Conception X at any finite stage, but *can* be accommodated in Conception Y.  
  *(2 marks)*  

  (ii) Hilbert's Hotel is often called a "paradox" because it seems possible to accommodate new guests even when "full." Identify two principles that conflict here: one supporting accommodation (via one-to-one correspondence) and one opposing it (via part-whole reasoning). Explain the clash.  
  *(3 marks)*  

  (iii) Resolve the "paradox" by explaining how this conflict leads to a *definition* of infinite sets (without assuming prior philosophy).  
  *(3 marks)*  

  **(b) Computable Reals and Diagonalization**  
  A real number is **computable** if a computer program (Turing machine) exists that, given \(n \in \mathbb{N}\), outputs the \(n\)-th digit of its binary expansion. Let \(\mathcal{C}\) be the set of computable reals.  

  (i) Prove that \(\mathcal{C}\) is countable.  
  *(2 marks)*  

  (ii) Suppose a program \(\texttt{Enum}\) claims to enumerate *all* computable reals: it outputs an infinite sequence \(r_0, r_1, r_2, \dots\) where each \(r_i \in \mathcal{C}\), and every \(c \in \mathcal{C}\) appears at least once. Construct a computable real \(s \in \mathcal{C}\) that is *not* in this sequence, proving no such \(\texttt{Enum}\) exists.  
  *(5 marks)*  

  (iii) Using (i) and (ii), explain:  
  - Why \(\mathcal{C}\) being countable does *not* contradict Cantor’s uncountability theorem for \(\mathbb{R}\).  
  - What the existence of non-computable reals implies about cardinality vs. computation.  
  *(3 marks)*  

  **(c) Finitism and Diagonalization**  
  Consider a mathematician **Fin** who holds:  
  - \(\mathbb{N}\) is a completed infinite set (quantifying over \(\mathbb{N}\) is meaningful).  
  - The collection \(\mathcal{F}\) of *all* functions \(f: \mathbb{N} \to \{0,1\}\) (equivalently, all reals in \([0,1]\)) is *not* a completed totality (quantifying over \(\mathcal{F}\) is invalid).  

  (i) Which assumption in Cantor’s diagonal argument (for \(\mathcal{F}\)’s uncountability) does Fin reject?  
  *(1 mark)*  

  (ii) What *can* Fin prove about any specific enumeration rule \(\sigma\) that claims to list "all" functions in \(\mathcal{F}\)? Explain briefly.  
  *(2 marks)*  

  (iii) Can Fin state her view without quantifying over \(\mathcal{F}\)? Identify a challenge.  
  *(2 marks)*  

  (iv) Fin finds Hilbert’s Hotel "physically implausible" but accepts \(\mathbb{N}\) mathematically. Is this consistent? Justify.  
  *(2 marks)*  

  ---

  ### Model Answer  
  *(Total words: 850)*  

  **(a) Potential vs. Actual Infinity**  
  (i) In **Conception X**, the hotel has only finitely many rooms at every finite stage (e.g., stage \(n\) has \(n\) rooms). An infinite coach requires infinitely many rooms *simultaneously*, which never occurs at any finite stage. **Conception Y** has all rooms coexisting "now," so a bijection \(\text{guest}_k \mapsto \text{room}_k\) accommodates everyone.  
  *(Answer length: 70 words)*  

  (ii) The conflict:  
  - **Accommodation principle**: Sets with a bijection have the same cardinality. Shifting guests \(\text{room}_k \mapsto \text{room}_{k+1}\) creates space for new guests, showing \( \{\text{old guests}\} \cup \{\text{new guests}\} \) bijects with \(\{\text{old guests}\}\).  
  - **Part-whole principle**: A proper subset (e.g., original guests) should be smaller than its superset (all guests after additions).  
  The clash arises because both principles hold for finite sets but conflict for infinite sets.  
  *(Answer length: 80 words)*  

  (iii) The "paradox" resolves by defining an **infinite set** as one that bijects with a proper subset (e.g., \(\mathbb{N}\) bijects with \(\{2, 3, 4, \dots\}\) via \(n \mapsto n+1\)). This violates the part-whole principle, but this violation *characterizes* infinity (Dedekind-infinite). Thus, the hotel shows that infinite sets behave differently—no contradiction, just a redefinition.  
  *(Answer length: 70 words)*  

  **(b) Computable Reals and Diagonalization**  
  (i) Each computable real is defined by a program, which is a finite string over a finite alphabet. Programs are countable (e.g., by dovetailing their encodings), so \(\mathcal{C}\) is countable.  
  *(Answer length: 40 words)*  

  (ii) Assume \(\texttt{Enum}\) exists. Let \(d_{i,j}\) be the \(j\)-th digit of \(r_i\). Define \(s\): Its \(n\)-th digit is \(1 - d_{n,n}\) (flip the \(n\)-th digit of \(r_n\)).  
  - **Computability**: Given \(n\), run \(\texttt{Enum}\) to get \(r_n\), compute \(d_{n,n}\) (since \(r_n\) is computable), output \(1 - d_{n,n}\). Thus, \(s \in \mathcal{C}\).  
  - **Not in sequence**: \(s\) differs from \(r_n\) at digit \(n\), so \(s \neq r_n\) for all \(n\). Contradiction. Hence, no such \(\texttt{Enum}\) exists.  
  *(Answer length: 90 words)*  

  (iii)  
  - **Countability vs. Cantor**: \(\mathcal{C}\) is countable (by (i)), but Cantor’s theorem states \(\mathbb{R}\) is uncountable. Since \(\mathcal{C} \subsetneq \mathbb{R}\) (non-computable reals exist), no contradiction. Cantor uses *arbitrary* functions (not just computable ones).  
  - **Implication**: Countability requires a bijection to \(\mathbb{N}\), but (ii) shows no *computable* bijection exists for \(\mathcal{C}\). Thus, \(\mathcal{C}\) is countable but not **computably enumerable**. Cantor’s theorem + countability of \(\mathcal{C}\) \(\implies\) non-computable reals exist.  
  *(Answer length: 90 words)*  

  **(c) Finitism and Diagonalization**  
  (i) Fin rejects that \(\mathcal{F}\) (all functions \(\mathbb{N} \to \{0,1\}\)) is a completed set over which quantification is valid.  
  *(Answer length: 20 words)*  

  (ii) Fin can prove a **schematic result**: For any *specific* rule \(\sigma\) (algorithm, definition) claiming to list functions in \(\mathcal{F}\), she constructs (via diagonalization) a function \(f_\sigma \not\in \sigma\)'s list. This is **effective**: If \(\sigma\) is computable, \(f_\sigma\) is computable.  
  *(Answer length: 50 words)*  

  (iii) **Challenge**: To state "\(\mathcal{F}\) is not a totality," Fin must quantify over \(\mathcal{F}\) (e.g., "no rule captures *all* functions"), violating her own restriction. She might use open-ended phrasing (e.g., "any rule misses some function"), but this implicitly references the uncompleted \(\mathcal{F}\).  
  *(Answer length: 50 words)*  

  (iv) **Consistency**: Yes. Fin’s view separates mathematical infinity (\(\mathbb{N}\) as abstract) from physical realizability. Hilbert’s Hotel involves physical space (which may be finite/quantized), while \(\mathbb{N}\) is a conceptual object. Thus, endorsing \(\mathbb{N}\) mathematically doesn’t compel belief in physical infinities.  
  *(Answer length: 50 words)*  

  ---

  ### Marking Scheme  

  | Part | Subpart | Marks | Common Errors |
  |------|---------|-------|--------------|
  | (a)  | (i)     | 2     | Fails to distinguish "at some stage" (X) vs. "all at once" (Y). |
  |      | (ii)    | 3     | Omits one principle; misses that both hold for finite sets. |
  |      | (iii)   | 3     | Calls it a "true paradox"; doesn’t link to definition of infinity. |
  | (b)  | (i)     | 2     | Doesn’t cite countability of programs. |
