prompt: |-
  I am a software engineer by training, with no formal philosophy background, and I teach one section of a second-year course called Discrete Structures for Computing as an adjunct. I am writing this term's final and I want one question on infinity that cannot be passed by reciting the diagonal argument, restating the Hilbert's hotel story, or writing in the margin that the whole thing depends on which axioms you accept.

  What my students have actually seen: dovetailing arguments for the countability of the integers and the rationals; the diagonal argument for the uncountability of the reals; the statement of the halting problem and the bare existence of Turing machines; and exactly one lecture on Hilbert's hotel, in which I made a joke about an autoscaling group that never needs to reallocate. They have had no philosophy of mathematics, and I do not want the question to presuppose any. Cantor, Hilbert and Turing are names they know; please do not require them to know any other name, and please make the question self-contained, with any term you use either defined in the question or already in my syllabus above.

  I would like the question built around three moves, which I sketch below. Please turn them into a properly worded exam question rather than pasting my sketch in, and feel free to reorder or combine them if that makes for a better paper.

  First: potential versus actual, and an honest accounting of where the paradox is supposed to be. I want students to distinguish a hotel that at every stage has finitely many rooms but can always be extended by one (my autoscaling analogy, or a lazily evaluated infinite list in a functional language, where the program is finite syntax and what it denotes is infinite) from a hotel that has all of rooms 0, 1, 2, ... at once; to see that the difference is a quantifier-order difference and that only the second hotel can house a countably infinite coach party, at no finite stage of the first hotel's life; to say what would have to follow for there to be a genuine contradiction here, rather than a clash between two explications of same number of elements, one of which is one-to-one correspondence and the other of which is the part-whole principle that a proper subset is smaller; and to register that the part-whole principle failing for infinite sets can be read off as a definition of infinitude rather than as a disaster.

  Second: the trap I actually expect strong students to fall into. I have a half-formed hunch that the computable reals are countable, because there are only countably many programs, and yet that no program can enumerate them, and that this pair of facts is the crux of something. The version of it I expect on the exam paper goes roughly like this:

    Cantor's argument only shows that no computer program can list all the real numbers. But the set of computable reals is countable, since programs are countable, and a real that no program computes is not something we could ever specify anyway. So there is no real conflict: the reals are countable as far as anything we can actually get our hands on is concerned, and Cantor's theorem is a theorem about the limits of computation rather than about size.

  I want the question to force students to sort this out precisely: to prove that there are only countably many computable reals; to prove that there is no computable enumeration of the computable reals, by making the diagonal construction effective relative to a computable enumeration; and then to say what follows, namely that countability and computable enumerability are different properties, that cardinality claims quantify over all functions and not only over rule-governed or programmable ones, and that combining countability of the computable reals with Cantor's theorem yields the existence of reals that no program computes.

  Third: locating the finitist's cut. Please put a character in the question, defined entirely within it, who grants the natural numbers as a completed infinite totality and grants classical reasoning about them, but refuses to treat the collection of all functions from the naturals to the naturals, or equivalently the reals, as a completed totality over which quantifiers range determinately. I want students to identify exactly which premise of the diagonal argument that character is refusing; to say what the argument becomes once the refusal is in force, namely a schematic result about any purported rule or specification that we can always produce, by an effective construction, something it misses; to take a position on whether that is a weaker result or whether it was where the content of Cantor's theorem always lay; and to say whether the character has the resources to state her own view without quantifying over the very functions she declines to totalize. I would also like the question to press on an asymmetry my better students will notice on their own: the discomfort about the hotel is normally discomfort about concrete or physical infinity, whereas the diagonal argument is a piece of pure mathematics, so it is not obvious that a person who finds the hotel incredible owes any opinion at all about Cantor's theorem, and vice versa.

  Deliverables, please:

  1. The question itself, with a short preamble of three or four sentences that I can print above it to stop students from answering part one with a retelling of the hotel story. Parts labelled, marks shown against each part, 25 marks total, intended to be answerable in about 75 minutes.

  2. A model answer of roughly 800 to 900 words, written in a register I could hand to a second marker as an anchor. If there is a standard name for a position or a move you use, you may mention it in parentheses so I can read further on my own, but the model answer must not depend on it, and I do not want any bibliography or references: everything must be checkable from the question and the answer alone.

  3. A marking scheme as a table: one row per required move, the marks it is worth, and a single line on the specific way students typically get that move wrong or half-get it. Follow it with a paragraph drawing the A/B boundary explicitly, naming what an A answer does that a B answer does not, and a sentence on what a C answer looks like.

  4. If any part of my sketch above is mathematically wrong or philosophically naive, please tell me briefly and quietly correct it in the question, rather than building the exam around my mistake. I would much rather find out now than at the marking stage.
reasoning: |-
  We are constructing an exam question that meets the instructor's requirements. The question will be built around three moves:

  1. Potential vs. actual infinity and the Hilbert's Hotel paradox.
  2. The computable reals and the distinction between countability and computable enumerability.
  3. The finitist's cut: accepting the natural numbers as a completed infinity but not the reals.

  We are to avoid requiring prior philosophical knowledge and to use only the concepts covered in the course (dovetailing, diagonal argument, halting problem, Turing machines, Hilbert's Hotel). The question must be self-contained.

  Let's design the question with three parts (a, b, c) corresponding to the three moves. We'll assign marks as follows: part (a) 8 marks, part (b) 10 marks, part (c) 7 marks, for a total of 25 marks.

  ### Preamble
  To prevent students from retelling the Hilbert's Hotel story in part (a), we include a short preamble:

  > "This question concerns different conceptions of infinity and their implications. In particular, we examine the distinction between potential and actual infinity, the role of computation in defining sets, and the scope of mathematical reasoning. Avoid retelling the Hilbert's Hotel story; instead, focus on the conceptual issues outlined in each part."

  ### Part (a): Potential vs. Actual Infinity (8 marks)
  We want students to:
  - Distinguish a hotel that can be extended by one room at any finite stage (potential infinity) from a hotel that has all the rooms at once (actual infinity).
  - Note that only the actual infinity hotel can house an infinite coach party because at no finite stage is the hotel infinite.
  - Explain that the "paradox" in Hilbert's Hotel arises from a clash between two principles: one-to-one correspondence (which shows the hotel can accommodate more guests) and the part-whole principle (which says that a proper subset should be smaller). 
  - Conclude that for infinite sets the part-whole principle fails, and this is taken as the definition of an infinite set (Dedekind-infinite).

  We phrase it as:

  > (a) Consider two models of an "infinite hotel":
  > 
  >   Model A: At any finite stage of construction, the hotel has a finite number of rooms, but it can always be extended by adding one more room.
  > 
  >   Model B: The hotel has all the rooms numbered 0, 1, 2, ... at once, forming a completed totality.
  > 
  > (i) Explain why an infinitely large coach party (with one guest for every natural number) cannot be fully accommodated in Model A at any finite stage, but can be accommodated in Model B. [2 marks]
  > 
  > (ii) The Hilbert's Hotel scenario (where the hotel is full but can still accommodate more guests) is often presented as a paradox. Explain the two conflicting principles that generate the apparent paradox: one principle that allows the accommodation and another that suggests it should be impossible. [3 marks]
  > 
  > (iii) How does the resolution of this paradox lead to a definition of an infinite set? [3 marks]

  ### Part (b): Computable Reals (10 marks)
  We want students to:
  - Prove that the set of computable reals is countable (because there are countably many programs).
  - Prove that there is no computable enumeration of the computable reals (by an effective diagonalization).
  - Explain that this shows countability does not imply computable enumerability, and that Cantor's theorem (about the uncountability of the reals) requires considering all functions (not just computable ones), and hence there must exist non-computable reals.

  We phrase it as:

  > (b) A real number is called computable if there exists a computer program (Turing machine) that, given a positive integer n, outputs the n-th digit of the real number (in some fixed base, say binary). 
  > 
  > (i) Explain why the set of all computable real numbers is countable. [2 marks]
  > 
  > (ii) Suppose someone claims to have a computer program that lists all computable real numbers. That is, the program outputs an infinite sequence of computable reals such that every computable real appears at least once in the sequence. Show that this leads to a contradiction by constructing a computable real that is not in the list. (Hint: Use diagonalization, but note that the list is given by a program, so your construction must be computable.) [5 marks]
  > 
  > (iii) What does the combination of (i) and (ii) imply about the relationship between the countability of a set and the existence of a computable enumeration? Moreover, what does this imply about the existence of real numbers that are not computable? [3 marks]

  ### Part (c): The Finitist's Cut (7 marks)
  We want students to:
  - Describe a character (let's call her Fin) who accepts the natural numbers as a completed totality and classical reasoning about them, but does not accept the set of all functions from naturals to naturals (or the reals) as a completed totality.
  - Identify which premise of the diagonal argument Fin rejects (the assumption that the set of all functions is a completed totality over which we can quantify).
  - Explain that without this, the diagonal argument becomes a schematic result: for any given rule that specifies a sequence of functions (or reals), we can effectively construct a function (or real) not captured by that rule.
  - Discuss whether this is weaker or if it captures the essence of Cantor's theorem, and note the asymmetry between the physical infinity of the hotel and the mathematical infinity of the reals.
  - Also, note the challenge Fin faces in stating her view without quantifying over all functions.

  We phrase it as:

  > (c) Consider a mathematician, Fin, who holds the following view: 
  >   - The set of natural numbers exists as a completed, infinite totality, and we can use classical logic to reason about it (including quantification over all natural numbers).
  >   - However, the collection of all functions from natural numbers to natural numbers (or equivalently, the set of all real numbers) does not form a completed totality. That is, we cannot quantify over "all such functions" as if they form a set.
  > 
  > (i) Which key assumption in Cantor's diagonal argument for the uncountability of the reals does Fin reject? [1 mark]
  > 
  > (ii) If we accept Fin's view, what becomes of Cantor's diagonal argument? That is, what can we still prove? [2 marks]
  > 
  > (iii) Fin wishes to state her view without contradicting herself. Is there a challenge in stating that the collection of all functions is not a completed totality while avoiding quantification over that very collection? Explain. [2 marks]
  > 
  > (iv) Hilbert's Hotel is often thought to involve a concrete, physical infinity, while Cantor's theorem is a purely mathematical result. Does Fin's view about the natural numbers (as a completed infinity) imply that she must accept the possibility of a physical Hilbert's Hotel? Why or why not? [2 marks]

  ### Model Answer
  Now we write a model answer of 800-900 words. We avoid technical jargon beyond the course and define any terms we use.

  #### Part (a) Model Answer
  (i) In Model A, at every finite stage the hotel has a finite number of rooms. An infinitely large coach party requires an infinite number of rooms simultaneously. Since at no finite stage does Model A have an infinite number of rooms, it cannot accommodate the entire coach party at once. Model B, however, has all the rooms available at once, so it can accommodate the entire party by assigning each guest to a distinct room.

  (ii) The two conflicting principles are:
     - One-to-one correspondence: If there is a bijection between two sets, they have the same size. In Hilbert's Hotel, we can shift guests to make room for new ones, establishing a bijection between the original set of guests and the new set (original guests plus new ones).
     - The part-whole principle: If A is a proper subset of B, then the size of A is less than the size of B. In Hilbert's Hotel, the set of guests after new ones arrive contains the original guests as a proper subset, so it should be larger.

  The paradox arises because these two principles are both intuitively true for finite sets but conflict for infinite sets. The resolution is that the part-whole principle does not hold for infinite sets.

  (iii) The failure of the part-whole principle for infinite sets leads to the definition of an infinite set as a set that can be put into one-to-one correspondence with a proper subset of itself. This is known as Dedekind-infinite. Thus, the paradox is resolved by recognizing that this property characterizes infinite sets.

  #### Part (b) Model Answer
  (i) Each computable real is defined by a program. Since programs are finite strings over a finite alphabet, there are only countably many programs. Therefore, there are at most countably many computable reals.

  (ii) Suppose we have a program P that enumerates a sequence of computable reals. Let the sequence be r_0, r_1, r_2, ... We construct a computable real s as follows. Let the n-th digit of s be defined as: 
     s_n = 1 if the n-th digit of r_n is 0,
     s_n = 0 otherwise.
  This construction is computable because, given n, we can run program P to get r_n (which is computable), then compute the n-th digit of r_n, and then set s_n accordingly. However, s differs from every r_k in the list because it differs at the k-th digit. Thus, s is a computable real not in the enumeration, a contradiction.

  (iii) The combination shows that the set of computable reals is countable but not computably enumerable. This means that countability (which is about the existence of a bijection with the natural numbers) does not imply that the set can be enumerated by a computer program. Moreover, since the set of all real numbers is uncountable (by Cantor's theorem) and the computable reals are countable, there must exist non-computable reals.

  #### Part (c) Model Answer
  (i) Fin rejects the assumption that the set of all functions from natural numbers to natural numbers (or the set of all reals) is a completed, definite totality over which we can quantify.

  (ii) Without that assumption, Cantor's argument becomes a relative result: for any given sequence of functions (or reals) that we can specify (by some rule or algorithm), we can effectively construct (by diagonalization) a function (or real) that is not in that sequence. This is a schematic result about any given enumeration we might produce.

  (iii) There is a challenge. To state that the collection of all functions is not a completed totality, Fin must avoid quantifying over the entire collection. She might try to express it by saying that any function we can specify is just one function, and that the totality is never complete because we can always define more. But this requires her to avoid universal quantification over the entire collection.

  (iv) Fin's acceptance of the natural numbers as a completed infinity does not force her to accept the physical possibility of a Hilbert's Hotel. The natural numbers are a mathematical abstraction, while a hotel is a physical structure. Fin might hold that while the natural numbers are a coherent mathematical concept, physical space and matter might be finite or otherwise constrained, making an actual physical hotel with infinitely many rooms impossible. Thus, the two issues are separate.

  ### Marking Scheme
  We create a table for the marking scheme. The rows correspond to the required moves, and we note typical mistakes.

  | Part | Task | Marks | Typical Mistakes |
  |------|------|-------|------------------|
  | a(i) | Explain why the coach party cannot be accommodated in Model A but can in Model B. | 2 | Not making clear that Model A never has infinitely many rooms at once. |
  | a(ii)| Explain the two conflicting principles. | 3 | Missing one principle, or not stating the conflict clearly. |
  | a(iii)| How the paradox leads to a definition of an infinite set. | 3 | Not mentioning Dedekind-infinite or equivalent. |
  | b(i) | Argue that computable reals are countable. | 2 | Not linking to countability of programs. |
  | b(ii)| Construct a diagonal argument for computable reals. | 5 | Failing to ensure the constructed real is computable, or not proving it's not in the list. |
  | b(iii)| Implications for countability vs. computable enumerability and existence of non-computable reals. | 3 | Not distinguishing countability from computable enumerability, or not drawing the existence of non-computable reals. |
  | c(i) | Identify the rejected assumption. | 1 | Vague answer. |
  | c(ii)| What becomes of the diagonal argument. | 2 | Not stating it becomes a schematic result. |
  | c(iii)| The challenge in stating Fin's view. | 2 | Not recognizing the issue of quantification. |
  | c(iv)| Asymmetry between mathematical and physical infinity. | 2 | Confusing the two or not explaining the distinction. |

  **A/B Boundary**: An A answer must correctly address all parts, including the effective diagonalization in (b)(ii) and the challenge of quantification in (c)(iii). A B answer might have minor errors or omissions in these critical parts, but still shows understanding of the main distinctions. Specifically, for an A, the student must:
  - Clearly distinguish potential and actual infinity in (a).
  - Successfully construct the diagonal real in (b)(ii) and explain why it's computable and missing.
  - Accurately explain Fin's position and the challenges in (c).

  **C Answer**: A C answer shows basic understanding but may have significant errors. For example, in (a) confusing potential and actual infinity, in (b) not proving the computability of the diagonal real, in (c) not identifying the key assumption or the schematic nature of the diagonal argument.

  ### Final Check for Correctness
  We ensure that the mathematical content is correct:
  - Part (a): The definition of Dedekind-infinite is standard.
  - Part (b): The set of computable reals is countable and not computably enumerable (if we assume that the enumeration is of total computable functions, but note: the problem is that the enumeration might not be effective and also might include non-total programs? We avoid this by defining computable reals via programs that compute the digits, which we assume are total. However, in reality, we cannot effectively enumerate the total computable functions because of the halting problem. But the question asks for a contradiction when we assume a program that lists all computable reals. The diagonal construction then requires that we can compute the digits of each real in the list, so we must assume that the program produces a list of computable reals and that we have a way to compute the digits of each. The standard approach is to note that if such an enumeration existed, we could use it to compute the diagonal, but the issue is that we cannot effectively decide which programs compute real numbers (because of non-termination). However, the problem states that the program lists all computable reals, so we assume that it only lists reals that are computable and that the program for each is known. But then the diagonal construction would require that we can compute the k-th digit of the k-th real. The problem is that the enumeration might not be effective in the sense that we cannot uniformly compute the digits. 

  But note: the question says the program outputs an infinite sequence of computable reals. We interpret this as: the program, when run, outputs (the description of) a sequence of programs, each of which computes a computable real. Then we can use these programs to compute the digits. The diagonal construction then is computable if we can compute the k-th digit of the k-th real. This is possible if the enumeration program gives us a way to compute the k-th digit of the k-th real. However, the problem is that the enumeration might not be effective in the sense that the k-th program in the enumeration might not be computable from k? Actually, the program P is a single program that enumerates the reals. We assume that given k, we can get the k-th real's program? Or does it output the sequence one by one? The question says "outputs an infinite sequence", so we can think of it as a function that on input k outputs (a representation of) the k-th real. But if the reals are given by their programs, then we can use that program to compute the digits. So the diagonal real is computable by a program that, on input k, uses P to get the program for r_k, then runs that program on input k to get the k-th digit of r_k, and then flips it. This is computable.

  However, there is a subtlety: the program for r_k might not halt on input k? But the definition of computable real requires that the program halts on every n. So we assume that the enumeration only lists computable reals, meaning each one is computed by a program that halts on every input. Therefore, the diagonal construction is computable.

  Thus, the argument is correct.

  - Part (c): The position described is that of a predicativist or a finitist about the reals. The diagonal argument becomes a proof that for any given enumeration of reals (that we can specify), we can define a real not in it. This is a standard view.

