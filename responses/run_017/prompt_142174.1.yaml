  - **Surprise level**: 4/10 if she says "no"—she might revert to Intrinsic Basis if stressed by case 8.  

  ### Is Your Case New?
  - **Structurally distinct from case 8**: Yes. Case 8 has a *temporal gap* (toxin creates sensitivity *before* killing) and no intrinsic grounding at stimulus onset. Your case has a *unified process*: impact simultaneously creates brittleness and shatters via phase change. No separate "sensitivity-creation" step—props matter.  

  ### Decider Case
