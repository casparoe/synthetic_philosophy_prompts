answer: |-
  I reject step (2): "If a proposed difference could never show up in any possible experience, investigation, or decision, then there is no difference."

  **Why it looked fine:** Step (2) appeals to a verificationist intuition: if something makes no practical or observational difference, it isn't real. It seems efficient, avoiding undetectable "ghost" facts. In the crack-length context, it promises to dissolve the mystery of an unknowable cutoff.

  **Pricing the Options (Costs of Rejecting Step 2):**

  1.  **Sharp Cut-off View:** Pays nothing extra. Rejecting (2) directly saves it. The cut-off *is* exact (e.g., 3.725mm), but fundamentally unknowable with certainty through empirical means. Its location is a fact beyond what perfect evidence could reveal. This accepts epistemic (knowledge-based) vagueness but denies ontic (reality-based) vagueness.
  2.  **Drift View:** Pays nothing extra. Rejecting (2) saves it too. The relevant comparison batch *is* factually set (e.g., the last 4 screens handled), even if no investigation could *conclusively prove* it was precisely those 4 and not 3 or 5. The drift threshold is real and context-dependent, but its exact defining context isn't always perfectly recoverable or verifiable.
  3.  **Many-Sharpenings View:** Pays nothing extra. Rejecting (2) saves it. There *is* a fact about which sharpenings are admissible (e.g., defined by community standards or context), even if this fact cannot be perfectly settled by evidence in borderline cases. "Truth on all admissible sharpenings" remains defined because admissibility itself is a fact, even if sometimes unknowable.

  **Why reject (2) rather than (4)?** Rejecting (4) ("no boundary exists if adjacent points are identical") might save *only* the sharp cut-off view by allowing sharp boundaries even if adjacent lengths are indistinguishable. However, the drift view and many-sharpenings view would *still* be destroyed by step (2) via (6) and (7), as they rely on contextual or admissibility facts claimed to be undetectable. Rejecting (2) preserves all three views (and your preference for the drift view) while accepting that some facts – like the exact cut-off, the precise relevant comparison set, or the exact set of admissible sharpenings – can be real yet undetectable in principle. This upholds your core belief that "something is going on" in the borderline region, even if we can't always pinpoint it perfectly. The cost is accepting unknowable facts, like the ancient speck of dust's location.
