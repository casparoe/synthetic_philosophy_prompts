  The user wants to know which elements strictly presuppose this moral responsibility framework versus which could align with forward-looking risk assessment. The remorse requirement fundamentally assumes that moral agency matters intrinsically, while risk-based approaches treat the prisoner more objectively. If boards shift entirely to risk scores while still demanding remorse, they create an incoherent hybrid model.

  Regarding Strawson's point about the objective attitude not being sustainable wholesale, a purely risk-based system would abandon any pretense of moral dialogue, potentially undermining the very foundations of holding people responsible. The user seems to be grappling with deep philosophical tensions in penal practice - how we reconcile moral accountability with institutional constraints that make such accountability difficult to achieve authentically.

