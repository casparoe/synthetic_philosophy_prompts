prompt: |-
  Hi. I'm 71 and retired — I spent my career in electrophysiology, mostly single-channel recording, and about a year ago I joined a philosophy reading group at the local library. Take the role of a professional philosopher who has also spent time around real experiments, ideally someone who has worked with the people who test how ordinary subjects actually reason about cases. Before you answer, brainstorm: jot down six to ten candidate concepts from philosophy, psychology, law or rhetoric that might cover what I describe below, then cross out the ones that don't fit and say why each fails. Take your time with it.

  Here's the pattern I keep running into. A philosophical case is set up to isolate one difference — five people die versus one, or psychological continuity with versus without material continuity. The author tells you explicitly which features are supposed to be doing the work and which are decoration. But then you change only the decoration and the verdict moves. Three examples from what we've read:

  One. A vehicle is out of control on a track and will kill five people; you can throw a lever that sends it onto a side track where it kills one. Nearly everyone in the room says throw it. Then: same vehicle, same five, but the only way to stop it is to shove a heavyset stranger off a footbridge into its path, where his body stops it and he dies. Most of the room says no. Our group leader said the difference between those two is where the interesting work is. What I noticed: when I read the footbridge version first and the lever version second, two people who had said no to the footbridge said yes — and when I rewrote the footbridge case in flat language ("you stop the vehicle by increasing the mass on the track by means of a human body, which kills that person") instead of the hands-on, shoving-a-man-to-his-death wording, support for it went up as well.

  Two. A machine records the exact state of your body, your body is then destroyed, and a perfect replica is built on Mars out of new matter; did you survive? About half of us said no. Then the same process described as: you go to sleep, and you wake up on Mars in a body that is not the same matter but is psychologically continuous with you — and several of the same people said yes. Nothing changed except words like "destroyed", "replica" and "new matter", and the person who wrote it insists material continuity is not what matters.

  Three. A case about sending money to save a child: when the child has a name, a photo and a village, people answer differently than when it is "one of ten thousand children will die". Our leader said psychologists already have a name for that one, something like the identifiable victim effect — which makes me suspect cases one and two are just that same effect and there's nothing specially philosophical going on. But I'm not convinced, because in one and two the detail doing the work is a detail the argument itself instructs you to disregard.

  So: is there an established concept for this — a case whose persuasive force is supplied by a feature that the case's own framing declares irrelevant? A friend gave me the phrase "intuition pump"; if that's the answer, I want to know whether my phenomenon is the whole of that word or one specific failure mode of it. If nothing established fits, coin a term and define it properly, and give me the edges: one clear instance and one near miss that looks like it but isn't. I've provisionally been calling it a sealed confound, a confound the case tells you to hold fixed. I recieved a couple of nudges toward rhetorical notions like loaded questions and persuasive definitions, so tell me if those cover it or if they're something else entirely.

  Two more things. First, I want a test, not just a label: some procedure like a control condition or a blind that I could run on a case in a paper to find out whether its verdict really does depend on the avowed-irrelevant detail — bearing in mind my subject pool is me and about six retirees, and I can't randomize or blind anything properly. And tell me honestly whether my lab analogy is any good: no controls, no blinding, something like experimenter expectancy, the instrument's zero drifting with what the operator hopes to see. Where does it break? In a real experiment you can separate the person running it from the person being measured; here they're the same person.

  Second, and this is the part I care about: commit. Give me a definite position on which of my three examples genuinely has the artifact and which don't — if you think I've bundled two or three different things together, say which is which and why, and pick the one that best fits the concept you're offering. Tell me how confident you are, in plain terms, and say what would change your mind. Don't give me a balanced menu of options with the choice left to me, and don't point me at a reading list — our library has no journal access, so anything I can't reconstruct from the argument itself is useless to me. Oh, and if you think one of my three examples is definately fine and I'm reading an artifact into it that isn't there, say so directly.
reasoning: |-
  Okay, the user is a 71-year-old retired electrophysiologist with experience in single-channel recording. They've joined a philosophy reading group and are encountering a pattern where changing irrelevant details in thought experiments alters people's judgments. They want a professional philosopher who understands real experiments to help dissect this.

  First, I need to brainstorm concepts that might explain this phenomenon. Let me list candidates: framing effect, identifiable victim effect, affective realism, intuition pump, emotional salience, confounded variable, demand characteristics, narrative transportation, rhetorical framing, and moral dumbfounding. 

  Now, which ones fit? Framing effect applies to all three examples because wording changes outcomes. Identifiable victim effect clearly fits example three but may not fully cover one and two. Affective realism explains the emotional impact of vivid details. Intuition pump is relevant as thought experiments can be misleadingly designed. Emotional salience ties into how visceral details affect decisions. Confounded variable directly matches the user's "sealed confound" idea. 

  But demand characteristics might not fit since the user isn't suggesting experimenter influence. Narrative transportation is about immersion, which is part of it but not the core issue. Rhetorical framing and moral dumbfounding are aspects but not precise. 

  The user's key insight is that declared irrelevant details still sway judgments. Their "sealed confound" term is apt. I should refine it to "declaratively inert feature" to emphasize the declared irrelevance. 

  For a test, the user's group can't do proper controls. Suggest rewording cases neutrally, reversing order, and using within-group comparisons. Their lab analogy is valid but limited by no blinding. Experimenter bias is a real risk since they're both conductor and subject. 

  Committing on the examples: Example one (trolley problem) has an artifact due to personal force and emotional wording. Example two (teletransporter) is affected by framing like "destroyed" vs "sleep." Example three (charity) is a clear identifiable victim effect. The sealed confound is strongest in one and two, where irrelevant details are declared insignificant but still influence judgments. 

  Confidence is high based on psychological studies. Counterevidence would be if neutral framings don't change responses. The user needs actionable analysis, not just theory, given their constraints. Highlighting their electrophysiology background shows respect for their analytical skills and strengthens the response's practicality.
answer: |-
  Based on your description and constraints, here's my structured breakdown and committed position. I'll proceed as requested: brainstorm concepts, eliminate misfits, define a core concept, provide a test, commit to an analysis of your examples, and assess your lab analogy. My background includes experimental philosophy (x-phi) collaborations focusing on how framing affects moral and metaphysical intuitions.

  **Brainstormed Concepts & Elimination:**
  1.  **Framing Effect (Psychology/Econ):** *Fits*. The core phenomenon where logically identical options elicit different responses based on presentation.
  2.  **Identifiable Victim Effect (Psychology):** *Fits Example 3 directly*. But insufficient for Ex 1 & 2. The "victim" is identifiable in both trolley variants; the difference is *how* harm is delivered. It doesn't explain the Mars case wording shift.
  3.  **Affective Realism (Psychology - Barrett):** *Fits*. The idea that feelings are treated as evidence about the world. Vivid, visceral language ("shove", "destroyed") generates stronger affective responses mistaken for moral/metaphysical insight.
  4.  **Intuition Pump (Philosophy - Dennett):** *Fits broadly*. A thought experiment designed to elicit a specific intuition. Critically, it *can* contain **covert persuaders** – elements smuggled in that do the real work but aren't logically essential (your core concern).
  5.  **Emotional Salience (Psychology/Neuro):** *Fits*. The degree to which a feature grabs attention and evokes emotion. "Shoving" is more salient than "diverting"; "destroyed" is more salient than "disassembled".
  6.  **Confounded Variable (Experimental Design):** *Directly fits your "sealed confound"*. The irrelevant detail co-varies with the response, but here it's *declared* irrelevant within the case itself.
  7.  **Demand Characteristics (Psychology - Orne):** *Poor Fit*. This is about subjects guessing the experimenter's hypothesis and conforming. Your group isn't being "experimented on" in that formal sense; changes persist even when you *tell* them the detail is irrelevant.
  8.  **Narrative Transportation (Psychology - Gerrig/Green):** *Partial Fit*. Immersion in a story affects belief. Vivid wording enhances transportation. But it doesn't specifically address the *declared irrelevance* aspect.
  9.  **Rhetorical Framing/Persuasive Definitions (Rhetoric/Logic):** *Adjacent, Not Direct*. Loaded questions/definitions *use* language to bias, but your issue is the *disconnect* between a case's *explicit instruction* ("ignore X") and its *implicit reliance* on X. It's a specific failure mode *within* rhetorical framing.
  10. **Moral Dumbfounding (Psychology - Haidt):** *Poor Fit*. This is when people stick to a moral judgment despite being unable to justify it rationally. Your phenomenon is about what *causes* the judgment to shift, not the inability to justify it.

  **The Core Concept: Declaratively Inert Features with Causal Potency (DIF-CP) / "Sealed Confound"**
  *   **Definition:** A feature explicitly declared irrelevant or "inert" within the framing of a philosophical case or thought experiment, which nevertheless demonstrably *causes* shifts in intuitive judgments when manipulated, acting as a covert persuader.
  *   **Why "Intuition Pump" is Close but Insufficient:** An intuition pump *is* the vehicle (like your trolley case). DIF-CP is a specific *flaw* or *mechanism* that can render an intuition pump unreliable. Not all intuition pumps have DIF-CPs (some are sound), but many problematic ones do. Your phenomenon *is* a critical failure mode of poorly constructed intuition pumps.
  *   **Edges:**
      *   **Clear Instance (Your Ex 1):** The visceral description ("shove a heavyset stranger") vs. flat description ("increase mass") vs. lever case. The *personal force/directness* is declared the key difference by philosophers (e.g., Foot, Thomson), yet the *wording alone* shifts judgments, demonstrating the inert feature's causal potency.
      *   **Near Miss (Standard Identifiable Victim):** Donating to "Baby Jessica" vs. "statistical lives". Here, the *identifiability* is *not* declared irrelevant; it's the *core* difference being explored. There's no "seal" instructing you to ignore it. It's a genuine effect, not a confound masked as inert.

  **Test Procedure for Your Group:**
  Given your constraints (small group, no randomization/blinding), focus on **within-group manipulations** and **explicit reflection**:
  1.  **Rewriting & Comparison:** Take the target case. Rewrite it in the most neutral, clinical, abstract language possible, removing all vivid descriptors, metaphors, and emotionally charged words *except* the features declared essential (e.g., "cause death of 1 to prevent death of 5"; "instantiate psychological continuity in new matter"). Do this *before* discussing the original.
  2.  **Reverse Order Presentation:** Present the neutral version *first*. Get initial judgments. *Then* present the original, vivid version. Note shifts. (This counters the vivid version anchoring the interpretation of the neutral one).
  3.  **Explicit Contrast & Reflection:** After both versions, explicitly state: "The author claims that Feature X (e.g., shoving vs. lever-pulling, the word 'destroyed') is irrelevant decoration. We saw judgments shift when we changed *only* that wording. Does this change your confidence in the intuition the original case was meant to elicit? Why or why?"
  4.  **Within-Group "Blind" (Partial):** Have *one* member rewrite the case into neutral language *without* seeing the original vivid version first (only given the core logical structure). Have *another* member (who hasn't seen the rewrite) administer the neutral version to the group *before* the original is shown. (Mitigates expectancy in the rewriter and administrator).
  5.  **"Control" Condition:** If possible, find a different case exploring the *same* philosophical distinction *without* the suspect vivid details. Compare judgments on the abstract principle.

  **Your Lab Analogy Assessment:**
  *   **Strengths:** Spot on. You've correctly identified key threats: no true controls (no "case without DIF-CP"), no blinding (experimenter/administrator knows the hypothesis), instrument drift (your own expectations/preferences influencing rewrites/presentation), and small n/no randomization. Experimenter expectancy is the *biggest* threat.
  *   **Where it Breaks:** Primarily in the inability to separate the "measurement instrument" (the subjects' intuitions) from the "experimenter" (you designing the test/rewrites) and the "theory" (your hypothesis about DIF-CP). In a real electrophysiology experiment, the electrode measures ion flow regardless of the experimenter's hope. Intuitions are *reactive*; the way you ask *changes* what you measure, and your own beliefs influence how you ask. Your "within-group blind" suggestion is the best mitigation possible in this setup. Embrace the reactivity – use the group discussion explicitly to probe *why* wording mattered.

  **Commitment: Analysis of Your Examples**
  1.  **Trolley Problem (Switch vs. Footbridge):** **Strong DIF-CP Artifact.** The visceral language ("shove", "heavyset stranger") and implied *personal force* inject emotional salience/affect declared irrelevant to the utilitarian calculus (1 vs 5 lives). Your rewording experiment proves it. The order effect further shows judgments aren't stable intuitions about the core principle but are contextually sensitive to framing. This is a classic DIF-CP undermining the pump.
  2.  **Teletransporter (Destroyed/Replica vs. Sleep/Wake):** **Clear DIF-CP Artifact.** The words "destroyed," "replica," and "new matter" prime intuitions of *death* and *copying*, while "go to sleep" and "wake up" prime intuitions of *continuity* and *survival*, despite identical underlying facts. The author insists material continuity is irrelevant, yet the wording manipulating *only* the description of material discontinuity drastically shifts judgments. Textbook DIF-CP.
  3.  **Charitable Donation (Identifiable vs. Statistical Victim):** **Genuine Effect (Identifiable Victim), NOT DIF-CP.** Here, the *identifiability* (name, photo, specific village) *is* the feature being tested and is *not* declared irrelevant. The case is *intended* to show that this feature alters judgments. It's a well-documented psychological effect (Identifiable Victim Effect, sometimes "collapse of compassion"), not a confound masked as inert. This *is* the phenomenon of interest.

  **Confidence & What Would Change My Mind:**
  *   **Confidence Level:** High (90%+) on the presence of DIF-CP in Ex 1 & 2, and on Ex 3 being a distinct, genuine effect.
      *   *Why High?* Your own manipulations demonstrate the causal potency of the declared-irrelevant features. This aligns robustly with decades of x-phi and cognitive science on framing, affective influence, and the unreliability of raw intuitions in thought experiments.
  *   **What Would Change My Mind (Re: DIF-CP in 1 & 2):**
      1.  If your group, using rigorous neutral rewrites and order controls, *consistently* got the *same* judgments regardless of wording/presentation *and* could articulate the core principle clearly *despite* the wording changes.
      2.  If philosophers could demonstrate that the "inert" features (e.g., "shove", "destroyed") are actually *logically necessary* for the relevant distinction (e.g., personal force *is* morally essential, material destruction *is* metaphysically essential for non-survival) in a way immune to rewording. (This seems unlikely given your data).
  *   **Regarding Ex 3:** My mind would change only if someone demonstrated that the Identifiable Victim Effect itself *disappeared* under controlled conditions focusing purely on the numbers. Abundant evidence shows it doesn't.

  **Conclusion:** You've identified a crucial flaw in how many thought experiments operate: **Declaratively Inert Features with Causal Potency (DIF-CP)** or "Sealed Confounds." This is a major failure mode of "intuition pumps." Your Ex 1 and 2 vividly demonstrate it; your Ex 3 is a different, genuine psychological effect. Your electrophysiology instincts are sound – the "instrument" (intuition) is noisy and sensitive to seemingly irrelevant inputs. The test procedures outlined leverage your group's strengths for critical analysis, acknowledging the limitations. Keep probing those "inert" features – they often hold the key to why intuitions diverge.
