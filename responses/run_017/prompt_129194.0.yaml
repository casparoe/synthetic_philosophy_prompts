answer: |-
  Here's a concise breakdown addressing your questions:

  **1. Terminology & Precedence**  
  No single established term fits perfectly. Your "marker" (read-good) aligns with *probing* or *decoding* in interpretability literature. "Handle" (write-good) relates to *causal interventions* (activation editing/steering). The gap is often acknowledged (e.g., "probes may detect epiphenomena") but lacks a standard name. "Leakage" is apt for collateral effects. Your three-way split is novel and pragmatically useful—retain your terms unless context demands "probe-predictive" (marker) vs. "intervention-responsive" (handle).

  **2. What the Gap Reveals About Representation**  
  The gap critically undermines weak claims of representation:  
  - **Handle-only (high leakage)**: Likely a broad actuator (e.g., "volume knob")—not feature-specific.  
  - **Marker-only**: May be a downstream epiphenomenon (e.g., the model *reporting* X, not *using* it).  
  **True representation requires both**: A marker should reliably *indicate* X, and its handle should *control* X-specific behavior with minimal leakage. The gap exposes when "representation" is merely correlative or causally crude.

  **3. Coinage & Boundary Cases**  
  Define **integrated feature representation (IFR)** as a state where:  
  - **Marker fidelity**: Linear probe accuracy >95% on X (minimizing confounders).  
  - **Handle specificity**: Intervention shifts X-relevant outputs >3x more than irrelevant outputs (leakage <20%).  
  - **Alignment**: The same vector serves both roles.  

  **Boundaries**:  
  - **Marker-not-handle** (e.g., 99% probe accuracy, 0% behavior change): Epiphenomenal—fails IFR.  
  - **Handle-with-leakage** (e.g., steers X but disrupts unrelated tasks 5x more): Global actuator—fails IFR.  
  - **Post-training alignment** (e.g., only both after fine-tuning): IFR exists *after* adaptation.  
  - **Read/write mismatch** (e.g., marker for X, handle for Y): Not a unified representation—likely two distinct mechanisms.  

  **Conclusion**: The distinction is real—not a measurement artifact. It exposes when "feature detection" is behaviorally inert or causally entangled. Demand both marker and handle evidence to claim true representation. Your terms ("marker/handle/leakage") are defensible and clarify this rigor.  

