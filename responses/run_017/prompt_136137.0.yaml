answer: |-
  ## Interoffice Memorandum  
  **Bureau of Glyph Identity**  
  Classification Division  
  Case No. BGI-1947-03a ("Definitive Parameters for 'a'-Class Glyphs")  

  **1. Purpose**  
  This memorandum addresses mounting irregularities in the application of Glyph Identity Standard 7.1 ("Latin Minuscule 'a'") following Appeal 4472/δ (FontFoundry "Moderne"). It establishes revised evaluative criteria and resolves contradictory precedents.  

  **2. Background**  
  Per Directive Alpha-Prime (1946), visual essentialism governs initial classification. Glyphs must possess at least *three* of five Primary 'a'-Essences:  
  > (i) Closed bowl structure (≥270° curvature)  
  > (ii) Ascending terminal stroke (≥15° vertical deviation)  
  > (iii) Counter isolation (non-intersection with descender/ascender zones)  
  > (iv) Serif presence (terminal or bracketed)  
  > (v) Asymmetrical axis (stroke contrast ratio ≥ 1:1.7)  

  **3. Precedent Failures & Operational Challenges**  
  *   **Case BGI-1938-11a (Futura Bold):** Rejected for lacking (i) (open bowl), (ii) (horizontal terminal), and (iv) (serifs). Overturned on Appeal: populace universally identifies specimen as 'a'.  
  *   **Case BGI-1941-07a ("PrimerScript"):** Rejected for violating (i) (single-story construction lacks closed bowl). Overturned: pedagogical necessity.  
  *   **Case BGI-1943-09a (Schwarzbuch Fraktur):** Rejected for violating (iii) (counter fused with stem), (iv) (no serifs), and (v) (near-monoline weight). Overturned: historical continuity.  
  *   **Case BGI-1946-12a (Consultant's Degradation Test):** Glyph Garamond #61 ('a') was progressively altered across 200 steps into Garamond #40 ('o'). BGI staff could not identify transition step where 'a'-ness ceased.  

  **4. Revised Doctrine: Systemic Relationalism**  
  Essentialism (visual) is hereby deprecated. A glyph is an 'a' *iff* it occupies the 'a'-positional node within its native system, maintaining requisite contrastive differentiation from proximate glyphs ('o', 'd', 'g', 'e') per Contrast Matrix Λ (see Appendix). Identity is defined by relational opposition, not intrinsic form.  

  > *Deputy Director H. Wainwright:* "The essence of 'a' is its *not-being-the-other-glyphs*. It is the negative space in the lattice of linguistic function. If the system sustains the differential, the glyph fulfills its office."  

  **5. Crisis: Case BGI-1947-03a ("CircleType")**  
  FontFoundry "Isotope" submitted *CircleType Regular*, wherein all 26 lowercase glyphs are identical undifferentiated circles (Ø = 1 em). Application claims each circle is a flawless instance of its designated letter, satisfying Λ: each circle contrasts equally and sufficiently with all others by occupying a unique nominal position.  

  **6. Bureau Deliberation & Impasse**  
  *   *Classification Desk Analysis:* "Per Λ, CircleType 'a' exhibits maximal contrastive distance from CircleType 'o' (difference coefficient = 1.0). It is relationally perfect." (Ref: CDA-1947-03a-1)  
  *   *Deputy Director Wainwright:* "The system is internally consistent. To reject it is to lapse into visual essentialism – precisely the error we corrected. The circle *is* the 'a' because the system declares it so."  
  *   *Appeals Officer J. Finch:* "But no user would *ever* read it as text! It violates the fundamental purpose of writing!"  
  *   *External Consultant (Type Foundry Alliance), Excerpt from Heated Call:* "For heaven's sake, Wainwright! Must I remind the Bureau that children recognize cartoon squirrels as *squirrels* despite lacking *actual fur and bones*? Functional resemblance matters! A circle isn’t an ‘a’ any more than my hat is a treaty!"  

  **7. Provisional Resolution & Contradiction**  
  CircleType is rejected under Emergency Provision Epsilon-3 ("Catastrophic Functional Collapse"). However, the rejection rationale cites "failure to provide *visually distinct differentiable forms* corresponding to phonemic values," directly contradicting the relational doctrine (Systemic Relationalism, Sec. 4). The Bureau cannot articulate *why* identical circles fail relationally without invoking:  
  > (a) Latent visual essentialism (demanding non-circularity or distinct forms), or  
  > (b) Extrinsic factors (user cognition, historical convention) – factors explicitly excluded by Doctrine.  

  **8. Directive**  
  All pending 'a'-classification cases are suspended pending formation of the Special Committee on Glyph Ontology (SCGO). Appeals referencing Case BGI-1947-03a will be held in abeyance. Historical precedents relying on visual essentialism (Cases BGI-1938-11a, BGI-1941-07a, BGI-1943-09a) are hereby reinstated provisionally as "operational necessities," despite their doctrinal inconsistency.  

  **9. Appeal Process**  
  Reconsideration may be requested via Form BGI-Ω within 30 days. Grounds must demonstrate systemic relational failure *without recourse to visual or functional arguments external to Matrix Λ*.  

  ---
  **APPENDIX: Summary of Doctrine (Effective Until SCGO Ruling)**  

  *   **G.I.S. 7.1 (Revised):** A glyph is an instance of Latin Minuscule 'a' if and only if:  
      > (i) It occupies the first vowel position within its native glyphset; AND  
      > (ii) It maintains a Contrastive Differential Coefficient (CDC) ≥ 0.85 against the glyphs designated 'o', 'd', 'g', and 'e' within the same glyphset, as calculated per Matrix Λ (measuring nominal positional divergence, not visual form).  
  *   **Visual Features (e.g., bowl, stem, serif, weight):** Are secondary epiphenomena. They may *correlate* with relational stability but are not constitutive of 'a'-ness.  
  *   **User Recognition & Function:** Are irrelevant to formal classification. The Bureau certifies glyphs *as systems*, not as elements within human reading practices (Operational Directive Gamma).  
  *   **CircleType Precedent:** Stands as rejected (Epsilon-3), though rejection rationale remains doctrinally unstable. Avoid citation.  

  ---
  **Filed By:**  
  *Agnes Pike, Senior Classification Clerk*  
  **Approved (With Reservations):**  
  *H. Wainwright, Deputy Director, Classification*  
  **Date:** 1947-10-27  

  ---
  **(Word Count: 892)**

  **Brainstorm & Rationale:**  
  1.  **Comedic Premises:**  
      *   Bureau desperately cycling through failing visual criteria (bowl, serifs, stroke contrast, double/single story).  
      *   Degradation test proving no clear boundary exists.  
      *   Relational doctrine as the "sophisticated" fallback.  
      *   CircleType submission exploiting relational logic perfectly.  
      *   Bureau trapped by its own rules, forced into contradictory reinstatement of old criteria while rejecting its *own* new doctrine implicitly.  
      *   Bureaucratic panic masked by jargon ("Catastrophic Functional Collapse," "operational necessities").  
      *   Consultant's outburst using an analogy (cartoon squirrel) highlighting functional resemblance vs. essential properties.  

  2.  **Real Features of 'a' to Exploit:**  
      *   **Radical Form Variance:** Humanist serif 'a' (Garamond) vs. Geometric sans 'a' (Futura) vs. elementary single-story 'a' vs. Blackletter 'a' (Fraktur). Share *no* universal visual essence.  
      *   **Context Dependence:** Identical shape = 'a' in Latin, 'д' (d) in Cyrillic.  
      *   **Gradual Deformation:** Morphing 'a' to 'o' demonstrates no single point of categorical change.  
      *   **Relational Importance:** 'a' *is* defined by how it differs from 'o', 'd', 'g' *within a specific typeface*.  
      *   **System Failure:** A font where every glyph is identical *cannot function as writing*, despite satisfying a purely nominal relational definition.  

  3.  **Strongest Combination & Fairness Check:**  
      The strongest flow is: Visual criteria fail comically -> Bureau adopts relationalism -> CircleType exploits relationalism perfectly -> Bureau rejects CircleType on *functional* grounds, contradicting itself -> Panicked reinstatement of old methods.  
      **Fairness:** Essentialists *do* often retreat to relational/functional/systemic definitions when visual criteria fail (e.g., "It's an 'a' because it plays the 'a'-role in the system"). The satire exaggerates by making the Bureau *explicitly exclude* function/history/cognition *while still needing them secretly*, and by pushing the relational definition to its absurd (but logically consistent) limit with CircleType. This highlights the core tension essentialism struggles with: the need for *some* anchor beyond the system itself (like use, history, or *some* minimal resemblance) to avoid total arbitrariness. The CircleType case forces this tension into the open within the Bureau's own logic. The reinstatement of visual criteria "provisionally" mocks the ad-hoc nature of such retreats.
