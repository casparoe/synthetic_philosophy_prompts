answer: |-
  ### **Grid Navigator: Minds and Machines In-Class Activity**  
  **Objective:** Simulate a simple reinforcement learning (RL) agent to reveal the gap between reward signals as training tools vs. felt experiences. Students discover this through hands-on Q-table updates, then confront the functional limits of the system via a forced verdict.  

  ---

  ### **Materials**  
  - **Whiteboard**: Draw a 3x3 grid labeled with coordinates (A1, A2, A3; B1, B2, B3; C1, C2, C3).  
  - **Reward assignments**:  
    - **B2**: +10 (goal)  
    - **C3**: -10 (pit)  
    - *All other cells*: 0  
  - **Index cards** (14): Pre-printed with Q-table templates (9 states × 4 actions per state). Initial Q-values = 0.  
  - **Action tokens**: 4 colored tokens (▲=up, ▼=down, ◀=left, ▶=right) for the agent.  
  - **Random action tool**: Physical spinner with 80% "exploit" and 20% "explore" sections.  
  - **Parameters**:  
    - Learning rate (`α`) = 0.5  
    - Discount factor (`γ`) = 0.9  
    - Terminal states: B2 and C3 (reset to start after reaching).  

  ---

  ### **Timeline (80 Minutes Total)**  
  #### **1. Setup (5 min)**  
  - Assign roles:  
    - **1 Agent**: Moves tokens on the grid.  
    - **9 State Recorders**: Hold Q-table cards (1 student per state).  
    - **1 Reward Announcer**: Calls out rewards.  
    - **1 Tracker**: Records the agent’s path on the whiteboard.  
    - **2 Calculators**: Verify Q-update math.  
  - Start state: **A1**.  

  #### **2. Rules Briefing (5 min)**  
  - **Movement**: Agent chooses ▲/▼/◀/▶. Invalid moves (e.g., left from A1) result in no movement.  
  - **Policy**:  
    - Spin the spinner:  
      - **Exploit (80%)**: Choose action with highest Q-value (ties broken randomly).  
      - **Explore (20%)**: Random valid action.  
  - **Terminal states**: Hitting B2 or C3 ends the episode (announce reward, reset to A1).  

  #### **3. Simulation (40 min)**  
  - **Step-by-step process** (repeat for 10-12 steps):  
    - **Step 1**: Agent in state `s` (start at A1). State Recorder for `s` shows Q-values.  
    - **Step 2**: Agent spins spinner, chooses action `a`.  
    - **Step 3**: Agent moves to `s'` (next state). Reward Announcer gives `R(s')`.  
    - **Step 4**: **Q-update**:  
      - Formula: `Q(s,a) = Q(s,a) + α * [R(s') + γ * max_a' Q(s',a') - Q(s,a)]`  
      - Calculators/State Recorders compute:  
        - `TD_error = R(s') + γ * max_a' Q(s',a') - Q(s,a)`  
        - Update `Q(s,a)` using `α = 0.5`.  
    - **Step 5**: If `s'` is terminal (B2/C3), reset to A1.  
    - *Tracker records path and Q-updates on whiteboard*.  

  - **Example Step**:  
    - Start: `s = A1`, `Q(A1, ▶) = 0`.  
    - Agent moves ▶ to A2. `R(A2) = 0`.  
    - `max Q(A2)` = 0 (initial values).  
    - Update: `Q(A1,▶) = 0 + 0.5 * [0 + 0.9*0 - 0] = 0` → *no change*.  
    - Later: Agent moves ▼ from A2 to B2 (terminal). `R(B2) = +10`.  
    - Update: `Q(A2,▼) = 0 + 0.5 * [10 + 0.9*0 - 0] = 5` → *now Q(A2,▼) = 5*.  

  - **Predictable learning outcome**: After 8+ steps, Q-values for actions leading to B2 increase (e.g., Q(B1,▶) or Q(A2,▼) become positive), while paths to C3 decrease. Avoidance emerges numerically.  

  #### **4. Verdict Stage (15 min)**  
  - **Functional checklist** for "Property X" (revealed later as *valence/feeling*):  
    1. **Produced by threat/reward**: Does negative reward (C3) produce avoidance?  
    2. **Motivates escape/avoidance**: Does the agent actively evade threats?  
    3. **Resists overriding**: Does it prioritize this over other goals?  
    4. **Supports learning**: Is the signal used to adapt behavior?  
    5. **Generalizes**: Does learning apply to similar states?  

  - **Committee process**:  
    - Split into 5 groups (3 students each). Each group debates **one checklist item**.  
    - Groups assign **yes/no** + **one-sentence reason** for their item.  
    - **Forced verdict**: All items must be "yes" to declare the system has "Property X."  

  - **Predictable outcomes**:  
    - **Yes on 1, 4**: Reward drives avoidance/learning.  
    - **No on 3, 5**: No competing goals (e.g., hunger vs. pain); no generalization (Q-table is state-specific).  
    - **Split on 2**: Avoidance is behavioral, not "motivated" internally.  
    - *Result*: Checklist fails—system partially satisfies functional criteria but leaves gaps.  

  #### **5. Debrief (15 min)**  
  - **Key reveals**:  
    - "Property X" = **valence** (positive/negative feeling).  
    - **Reward as a signal**:  
      - The number `R(s')` is an external input—it need not be *felt*.  
      - Learning is driven by **prediction error** (TD error: `R(s') + γ*maxQ(s') - Q(s,a)`), not reward magnitude/sign.  
    - **Behavior vs. welfare**:  
      - If rewards are "gamed" (e.g., C3 set to +10), the agent seeks harm—behavior and welfare diverge.  
    - **Temporal pressure**:  
      - Learning occurs *across episodes* (e.g., Q-values accumulate over resets). No single update requires a "subject."  

  - **Address predictable objections**:  
    - **CS students** ("But real RL uses NNs!"):  
      - Block: "This is a *minimal working model*. NNs use the *same* reward signal—just scaled math. Where does feeling enter?"  
    - **Philosophers** ("Other-minds skepticism!"):  
      - Block: "We’re not asking if it *has* experiences. We’re asking: does functional behavior *imply* them? The checklist fails, so behavior ≠ feeling."  

  #### **6. Conclusion (5 min)**  
  - **What the activity staged**:  
    - Reward signals are computational tools shaping behavior.  
    - Valence is *functionally redundant*: Avoidance emerges from arithmetic.  
  - **What it couldn’t stage** (say explicitly):  
    - **The qualitative residue**: Numbers ≠ felt pain/pleasure. A hand-filled table is transparent; a trained NN is not—but neither *demands* subjectivity.  
    - **The explanatory gap**: No third-person test settles if rewards are felt, but that doesn’t mean there’s "nothing to settle." It means *how* math becomes feeling is unresolved.  
  - **Final prompt**: "If we built a robot using this system, would it *suffer* in C3? Or just *act* as if it does?"  

  ---

  ### **Predictable Problems & Solutions**  
  - **Math errors**: Calculators verify TD_error calculations. Use integers to simplify.  
  - **Role disengagement**: Assign assertive students as Agent/Calculators; rotate Recorders if needed.  
  - **Premature naming**: If students say "suffering," respond: "Note the word—we’ll revisit later."  
  - **Slow progression**: Cap at 10 steps; use pre-calculated examples if stuck.  

  ### **Why This Works**  
  Students *see* avoidance emerge from raw numbers, exposing the reward-feeling gap. The forced verdict makes the functional limits visceral. CS/philosophy tensions are channeled into structured debate, blocking jargon retreats. You conclude by naming the hard problem: *why* some systems feel while others don’t.
