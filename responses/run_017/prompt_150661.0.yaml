answer: |-
  ### Exam Question  
  **Time Allowed: 60 minutes**  

  > Consider the following case:  
  > At t₁, a university volunteering scheme invites undergraduates to pledge 40 annual hours of unpaid visits to isolated elderly residents. Only 2% participate. Participants are praised as "exemplary," and non-participants face no criticism.  
  >   
  > At t₂ (five years later), 85% participate. Non-participants face informal social criticism (e.g., exclusion from study groups) and self-report guilt. Participants receive a "College Citizenship Award" (a non-academic commendation). The *total* good delivered (elderly visitation hours) scales directly with participation, and the *individual cost* (time/effort) remains unchanged for any given student.  
  >   
  > **Question:**  
  > Is the act supererogatory at t₁ but not at t₂? Defend your answer. In doing so:  
  > (a) Explain whether the act’s status as "beyond duty" is eroded *merely* by widespread performance, without substantive change in the act’s cost/benefit structure.  
  > (b) Address whether social criticism and guilt at t₂ imply moral blameworthiness for omission, or if they reflect non-moral expectations.  
  > (c) Evaluate whether this case demands a *fourth deontic category* (permissible yet criticisable omission; praiseworthy yet non-obligatory performance).  
  > (d) Distinguish two routes to obligation: (i) *weak* (changing expectations shift perceived duties) vs. (ii) *strong* (a cooperative "assurance practice" emerges, generating fair-play obligations only above a participation threshold).  
  > (e) Confront the objection that others’ generosity cannot create new obligations for me "by diffusion," absent my consent or altered circumstances.  
  > (f) Finally, assess the university’s proposal to make the pledge compulsory. Can leaving it optional be defended *even if* compulsory participation would increase total good?  

  ---

  ### Model Answer (750 words)  
  **Thesis:** The pledge is supererogatory at t₁ but obligatory at t₂. This shows supererogation is compliance-sensitive: widespread performance transforms optional generosity into a duty of fair play within an assurance practice, without needing a "fourth category."  

  **(a) Compliance-Sensitivity and the Erosion of Supererogation**  
  At t₁, the pledge is supererogatory. It satisfies standard conditions: optional (no blame for omission), praiseworthy, costly, and morally better than non-participation. By t₂, however, the act ceases to be supererogatory. Crucially, this shift occurs *despite* unchanged individual cost/benefit. The erosion stems not from the act’s intrinsic properties, but from its new social context: near-universal participation creates a cooperative scheme reliant on mutual contribution.  

  **(b) Social Criticism vs. Moral Blame**  
  Non-participants at t₂ face criticism and guilt, but this does not *ipso facto* imply moral blameworthiness. Social expectations (e.g., "what students do") can generate pressure distinct from deontic obligations. However, in this case, the criticism *is* morally significant because it reflects a violation of the fair-play principle (see (d-ii)). The guilt reported is thus apt—not merely cultural discomfort but recognition of a genuine failure to reciprocate.  

  **(c) Rejecting the Fourth Category**  
  No fourth category (permissible-yet-critisable) is needed. At t₁, omission is permissible and non-critisable; at t₂, omission is impermissible and blameworthy. The t₂ practice operates as a collective enterprise where free-riding undermines reciprocity. Calling omission "merely criticisable" but permissible would license exploitation—a result antithetical to morality’s coordination function.  

  **(d) Weak Expectations vs. Strong Assurance Practices**  
  The *weak route* (changing expectations alone imposing obligation) fails. Expectations cannot create duties ex nihilo; else, any norm could bootstrap itself into morality. The *strong route* succeeds: once participation passes a threshold (~85% here), an assurance practice emerges. Participants rely on others’ contributions, invest in shared expectations (e.g., coordinating visits), and derive reputational benefits (e.g., the award). Non-participants at t₂ free-ride on this scheme, violating the fair-play obligation to reciprocate for benefits accepted. This threshold-dependent obligation explains the shift without arbitrary line-drawing.  

  **(e) Addressing "Obligation by Diffusion"**  
  The objection—"others’ generosity cannot add to my duties without my consent or altered situation"—ignores how assurance practices *do* alter one’s situation. By t₂, non-participants benefit from the scheme’s stability (e.g., elderly care is reliably distributed, campus culture rewards participation). Fair-play obligations arise precisely from *accepting benefits* from a cooperative practice, not from consent. My circumstances *are* changed: I inhabit a social world shaped by the scheme. To deny this is to ignore the relational nature of obligations.  

  **(f) The Value of Optionality and Compulsory Proposals**  
  Making the pledge compulsory at t₂ would be permissible but suboptimal. While compulsion might increase participation marginally (from 85% to 100%), it eliminates three values unique to supererogation:  
  1. **Moral Development**: Choosing generosity cultivates virtue; coercion replaces altruism with compliance.  
  2. **Social Resilience**: Voluntary schemes adapt better to diverse capacities (e.g., students with care commitments).  
  3. **Symbolic Meaning**: The act’s worth derives partly from its optionality—it expresses collective solidarity when undertaken freely.  
  Thus, even if compulsion increased total good, preserving optionality respects agency and enriches moral culture.  

  **Conclusion:** Supererogation is indeed compliance-sensitive. The t₁/t₂ shift demonstrates that obligations can arise from collective action via fair play, without metaphysical innovation (e.g., fourth categories). The university should retain the voluntary scheme at t₂, recognizing that obligations born of cooperation need not extinguish the spirit of generosity.  

  ---

  ### Marking Scheme (20 marks total)  
  **A (17–20):**  
  - [ ] Clearly distinguishes t₁ (supererogatory) and t₂ (obligatory) status.  
  - [ ] Deploys the *assurance-based fair-play argument* to explain the shift.  
  - [ ] Refutes "obligation by diffusion" by linking benefits to fair play.  
  - [ ] Rejects the fourth category as redundant/confusing.  
  - [ ] Justifies optionality at t₂ *despite* its obligatoriness.  

  **B (13–16):**  
  - [ ] Correctly identifies t₁/t₂ status shift.  
  - [ ] Separates social expectation from moral blame (but may not fully justify blame at t₂).  
  - [ ] Engages fair play and diffusion objection, albeit less precisely.  
  - [ ] Discusses compulsory proposal coherently.  

  **C (9–12):**  
  - [ ] Describes supererogation accurately but treats t₁/t₂ status as static or conflates expectation with obligation.  
  - [ ] Mentions fair play or diffusion objection superficially.  
  - [ ] Omits or mishandles the compulsory proposal.  

  **D/F (0–8):**  
  - [ ] Recites standard supererogation theory without engaging compliance-sensitivity.  
  - [ ] Major errors (e.g., "all praise implies obligation").  

  ---

  ### Predictable Mistakes & Penalties  
  1. **Mistake:** Equating social criticism at t₂ with moral blameworthiness *without argument*.  
     **Cost:** –3 (fails (b))  
  2. **Mistake:** Claiming obligation arises *solely* from changed expectations (weak route).  
     **Cost:** –4 (misses (d-ii))  
  3. **Mistake:** Ignoring the "obligation by diffusion" objection or dismissing it glibly.  
     **Cost:** –3 (fails (e))  
  4. **Mistake:** Arguing that compulsory adoption is obligatory because it maximizes good.  
     **Cost:** –2 (neglects (f)'s core thesis)  
  5. **Mistake:** Proposing a "fourth category" without explaining why standard deontology fails.  
     **Cost:** –3 (inadequate for (c))  

  ---  
  This question forces students to *apply* supererogation theory to a dynamic social context, testing their ability to integrate fair-play obligations, rebut key objections, and defend nuanced distinctions—all under time pressure. The model answer exemplifies the depth and argumentative rigor expected for top marks.
