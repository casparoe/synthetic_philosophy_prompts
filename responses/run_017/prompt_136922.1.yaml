prompt: |-
  My friend works in disability advocacy, and we spent last night arguing past each other, largely because neither of us could say what the disagreement was even about. The pattern I think I noticed is this.

  Take a slur a group has substantially taken back. We argued about *queer*, but the same seems true of *crip*, and of a couple of other disability terms she uses about herself daily. Outsiders can use it without trouble in kind-modifying or group-level positions — queer politics, the queer community, crip theory, a queer reading of the film. Let the same outsider use the same word to classify an individual — she is queer, he is a crip — and many hearers, including hearers who use that word in the first sort of construction about themselves constantly, hear a slur again. It does not seem to track who is speaking, how sympathetic the remark is, or who is listening; I watched my friend's own colleague get the first half of a sentence right and the second half wrong.

  Is there an established concept for a reclaimed slur's being reclaimed in some grammatical or semantic positions and not others, stably enough that the offense is predictable in advance? If so, I want it together with what it says the offending use is doing that the acceptable one is not. If not, please coin a term and define it. Either way I want the carving more than the label: is the distinction really syntactic, or is it about what the utterance does — classifying a particular person rather than modifying a kind, presenting the membership as essential to that person rather than as one feature among others? Where are the edges: plural self-descriptions such as queers, uses that echo the target's own self-application, uses about public figures? And how does the phenomenon bear on whether the derogation is part of the word's meaning or something the utterance does, which was the claim my friend's whole case rested on and which neither of us had earned? I assume this is not merely the general point that offense is context-sensitive, and not merely the familiar account of reclamation as a group's own historical process — but tell me if I am wrong to assume that, and what the nearest concepts are if neither fits.

  I should add that I have no library access and don't want a reading list or references; the distinctions matter to me more than who coined them. Please answer in American English.
reasoning: |-
  Okay, the user is describing a linguistic phenomenon where reclaimed slurs are acceptable in certain grammatical contexts but offensive in others. They noticed that terms like "queer" or "crip" can be used without issue when modifying kinds or groups (e.g., "queer politics") but become problematic when applied to individuals (e.g., "she is queer"). They want to know if there's an established concept for this distinction and what exactly causes the offense in the latter case.

  First, I need to recall if there's existing terminology. Linguistic reclamation and pragmatics come to mind. The distinction between group-level and individual-level uses seems key. Maybe "autological vs. heterological reclamation"? But that might not be standard. Alternatively, "in-group privilege" is common, but doesn't specify the syntactic aspect. The user wants a term that captures the positional sensitivity.

  The deeper question is why this happens. The user suggests it might be about classifying individuals versus describing groups. That aligns with concepts like essentialism—labeling someone as inherently part of a group reduces them to that identity. Also, agency: when an individual is labeled, it might imply an outsider's judgment, removing their autonomy in self-identification. Whereas group terms like "queer community" focus on collective action or attributes without singling anyone out.

  The user also asks about edges: plurals like "queers," echoing self-description, public figures. Plurals might be less offensive because they're still group-focused. Echoing self-application could be acceptable if contextualized, but risky. Public figures might be different if they've publicly reclaimed the term, but still, an outsider using it could be problematic.

  The user's friend's argument hinges on whether derogation is part of the word's meaning or the utterance. This phenomenon supports the pragmatic view—the offense comes from how the word is used, not the word itself. In group contexts, the term is neutral; in individual contexts, it's derogatory. That shows context sensitivity beyond general reclamation processes.

  I should check if existing concepts cover this. "Reappropriation" is the broader process, but doesn't specify the positional aspect. "Pragmatic reclamation" might work, emphasizing context. The key is the syntactic position triggering different interpretations. Maybe "positional reclamation sensitivity" as a coined term. But need to define it clearly.

  Also, the user mentions predictability of offense. The stability in grammatical positions allows for that predictability. So the concept needs to highlight the syntactic role as the trigger. The distinction isn't just semantic; it's about the utterance's function—classifying individuals versus describing abstract concepts.

  The user might need this for clarity in advocacy work, to prevent misunderstandings. Their deeper need is understanding the mechanics to communicate effectively, avoiding unintended offense. They need a framework to articulate why certain uses are problematic, aiding their advocacy discussions.
answer: |-
  Based on your observation and analysis, here's the conceptual breakdown you're seeking. There isn't a single, universally established term *precisely* for this syntactic/semantic positional sensitivity in reclaimed slurs, but the phenomenon is well-recognized and can be described and labeled using established linguistic and sociolinguistic concepts. Here's the carving and the terminology:

  1.  **The Core Distinction & Why It Offends:**
      *   **The Phenomenon:** Reclaimed slurs often exhibit **positional reclamation** or **usage-dependent reclamation**. Specifically, they are more readily accepted (even by in-group members) in **abstract, collective, or attributive syntactic/semantic positions** (modifying a kind, referring to a community, describing a field/ideology) than in **individual-classifying or referential positions** (directly labeling a specific person).
      *   **Why the Individual Use Offends (Even When the Group Use Doesn't):**
          *   **Agency & Reclamation Ownership:** Reclamation is an act of *group* empowerment. Using the term abstractly (e.g., "queer theory") respects the *group's* redefinition of the concept. Applying it directly to *an individual* bypasses that person's own agency in self-identification and reclaiming. It feels like an *imposition* of the label by an outsider, echoing the original derogatory act of labeling.
          *   **Essentialism & Reduction:** Labeling an individual ("She is queer," "He is a crip") inherently risks reducing their complex identity to *only* that reclaimed characteristic, especially when done by an outsider. It can sound like a statement about their *essential nature*. Abstract/group uses ("queer community," "crip time") focus on shared experiences, politics, or culture without necessarily implying that *every* aspect of an individual is defined by it.
          *   **Pragmatic Force & History:** The individual-classifying position is *exactly* the syntactic slot historically used to *stigmatize and exclude* ("You are a [slur]"). Using the reclaimed term in that slot, especially as an outsider, reactivates the historical force of the slur as a tool of *individual* targeting and othering, even if the speaker intends neutrality or positivity. It shifts from describing a shared *attribute* or *concept* to *categorizing a person*.
          *   **In-Group Privilege:** While the group has reclaimed the word, its use on *individuals* by *outsiders* often remains the exclusive privilege of the in-group itself or those granted explicit permission. Outsiders using it this way usurp that intimate, hard-won privilege.

  2.  **Established Concepts & Coined Term:**
      *   **Nearest Established Concepts:**
          *   **In-Group Privilege / In-Group Usage:** This is fundamental but broad. Your observation refines it to show the privilege is *grammatically/semantically conditioned*.
          *   **Pragmatics of Reclamation:** This field studies *how* reclamation works in context. Your observation highlights a key *pragmatic constraint* based on syntactic role and referent type (collective vs. individual).
          *   **Referential vs. Attributive/Modifying Use:** This linguistic distinction captures the core syntactic difference. The offense arises most predictably in **direct referential use** targeting an individual.
          *   **Contextual Derogation:** This concept (that offense isn't always inherent in the word but in its use) is central and directly supports your point against your friend's claim of inherent derogatory meaning.
      *   **Coined Term for the Specific Phenomenon:** Given the lack of a perfect single term, the most descriptive label is **Positional Reclamation Sensitivity (PRS)**.
          *   **Definition:** The phenomenon whereby a reclaimed slur is stably acceptable in abstract, collective, or attributive syntactic/semantic positions (e.g., modifying a kind, referring to a community, describing a field) but predictably causes offense when used in individual-classifying or direct referential positions by out-group members (and sometimes even cautiously within the in-group), due to the reactivation of historical derogatory force, violation of agency, and potential for essentialist reduction.

  3.  **Edges and Nuances:**
      *   **Plurals ("queers," "crips"):** These are often *less* offensive than singular individual reference but *more* risky than abstract modifiers. They refer to the group *as a collection of individuals*. While sometimes used positively within the community ("Queers for Palestine"), they can still sound jarring or overly blunt from outsiders, potentially carrying an echo of the slur's collective dehumanization. Acceptability is higher when clearly aligned with self-identified group action or solidarity.
      *   **Echoing Self-Application:** Saying "She identifies as queer" or "He calls himself a crip" is *less* likely to offend than the bald "She is queer"/"He is a crip" because it explicitly centers the *individual's own agency* in reclaiming the term. However, it can still feel intrusive or like unnecessary spotlighting if not contextually justified. The safest outsider route is usually paraphrasing *without* using the reclaimed term directly ("She identifies with the queer community").
      *   **Public Figures:** This is highly context-dependent. If a public figure *explicitly and consistently* uses a reclaimed term *about themselves* ("I am proudly crip"), an outsider *might* be able to reference that self-label in specific contexts (e.g., journalism: "Author and crip activist X...") with less risk, but it remains delicate. Using it as a general classifier ("Crip author X...") is still often riskier than a modifier ("crip activism").
      *   **"Kind-Modifying" vs. "Kind-Referring":** Distinguish between modifying a concept *about* the group ("queer theory" - theory *pertaining to* queerness) and directly naming the group as a kind ("the queer community"). Both are generally acceptable; the core offense is in *individual reference/classification*.

  4.  **Bearing on Derogation (Meaning vs. Use):**
      This phenomenon **strongly supports the pragmatic view (derogation is use-dependent, not inherent meaning)** that you seem to favor, and argues against your friend's claim:
      *   **Same Word, Different Force:** The *identical* lexical item ("queer," "crip") is completely non-offensive in one grammatical position and predictably offensive in another. This variation cannot be explained by a stable, inherent derogatory meaning. The meaning (reclaimed identity/perspective) remains constant; the *pragmatic force* (derogatory vs. neutral/positive) changes dramatically based on syntactic context and speaker-hearer relations.
      *   **Context is King:** The offense is triggered by specific contextual factors: syntactic position (referential classification), speaker identity (out-group), and crucially, the *act* of classifying an individual. This aligns perfectly with the idea that slurs (even reclaimed ones) carry a complex "use-potential" where their derogatory history can be reactivated in specific performative acts.
      *   **Reclamation is Partial & Contextual:** PRS demonstrates that reclamation isn't an all-or-nothing switch flipping the word's meaning from "bad" to "good." It's a complex, ongoing process where the reclaimed meaning gains stability in *certain domains of usage* (abstract, collective) while the original derogatory force remains latent and easily triggered in *other domains* (individual classification by outsiders).

  5.  **Your Assumptions: Correct**
      You are right that this is **not merely general context-sensitivity** (though context-sensitivity is the broader umbrella). This is a *specific, stable pattern* tied to syntactic/semantic position and reference type. You are also right that it's **not merely the familiar account of reclamation as a group's historical process**. PRS is a distinct *linguistic mechanism* or *constraint* that emerges *from* that historical process, governing *how* the reclaimed term can be successfully used by different speakers in different grammatical roles. It's a predictable *syntactic/pragmatic rule* arising from the sociolinguistics of reclamation.

  **In summary:** The established concepts are **in-group privilege, pragmatics of reclamation, referential vs. attributive use, and contextual derogation**. The specific phenomenon you identified is best described as **Positional Reclamation Sensitivity (PRS)** – the stable acceptability of a reclaimed slur in abstract/collective/attributive positions contrasted with its offensive potential in individual-classifying/referential positions, primarily when used by out-group members. This occurs because the latter use reactivates the slur's history of individual targeting, violates personal agency in identification, and risks essentialist reduction. Crucially, PRS demonstrates that the derogatory force is not inherent to the word's meaning but is pragmatically triggered by specific contextualized acts of individual classification, supporting the view that offense lies in the *use*, not the *word* itself.
