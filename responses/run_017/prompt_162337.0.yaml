prompt: |-
  Hi — I'm writing the final for my upper-level philosophy of mind seminar (14 juniors and seniors, one 90-minute in-class essay worth 20 marks) and I need a single question on whether qualia are an incoherent posit. We did the back half of the semester on Dennett's Quining Qualia chapter, the Chase and Sanborn case especially, plus the Moore-style reply that of course I know what my experience is like even if I can't say it, plus Mary, zombies, and the inverted spectrum. Every version of the question I draft gets answered the same way: a paragraph listing the four properties qualia are meant to have (ineffable, intrinsic, private, directly apprehensible), then either the announcement that nothing could have all four or the announcement that Dennett is confusing a property with our defective concept of it. I want that answer to be worth about half credit, and I want the question to force them into territory they haven't read about.

  Here's the case I've been playing with; build the question around it. Suppose we build a scanner, call it the Calibrator, that for any stimulus a subject tastes prints a stable alphanumeric signature. Within a subject the signatures are perfect: the same signature recurs exactly when the subject judges two stimuli taste the same, a different one exactly when they judge they taste different, and the signatures also track their preferences, their re-identifications from memory, and their surprise reactions, with no exceptions found. Two further stipulations. First, the signatures are subject-relative: there is no way to determine whether Ada's signature for espresso is the same as Bo's signature for espresso, since every bijective mapping between their two code-sets fits all the evidence equally well. Second, there is a transfer procedure: swap the signature-producing mechanisms between two subjects and both report that everything tastes different afterward, with their preferences flipping to match. Call the view that these signatures just are the qualia signature realism.

  I want the question to ask whether signature realism answers the quining argument or quietly concedes it, and to make them earn the answer. Specifically: which of the four properties do signatures actually have and which do they fail, and is the combination that survives enough to still be called qualia; does the subject-relativity of the signatures mean the interpersonal inverted spectrum is now unstatable, and is that a cost or a result the qualia theorist should welcome; what is left of Mary, given that she could in principle have learned every signature and its causal role in advance and yet something still seems to happen to her on first seeing red; and where, if anywhere, does the residual gap go — I have in mind the move that signature realism relocates rather than removes the mystery, since you can still ask why a signature's being tokened is like something for the subject rather than nothing, and I want a top answer to state that move and then say whether relocating counts as vindicating the posit or as eliminating it.

  Give me the question as I'd hand it to them, then a model answer of about 700 words, then a marking scheme: five must-hit moves, marks out of 20 for each, what an A does that a B doesn't, and one line on how students typically botch each move. And write the whole thing as continuous prose — no headings, no bullets, no bold, no tables, just paragraphs like you'd write in an email, because I'm pasting it straight into the exam file. Sorry if this got longwinded, I've been staring at it since this morning.
reasoning: |-
  Okay, the user is a philosophy professor designing a final exam question about qualia for an upper-level seminar. They've clearly put a lot of thought into this but are frustrated that their draft questions keep getting predictable answers. Their Calibrator thought experiment is sophisticated - it's essentially a physicalist-friendly qualia mapping system that preserves subjectivity while avoiding intersubjective comparisons. 

  I notice they're trying to walk a tightrope: they want students to engage deeply with Dennett's eliminationist arguments while still taking qualia seriously. The four core tensions they outlined - signature properties vs traditional qualia, inverted spectrum implications, Mary's knowledge gap, and the residual mystery - are perfect pressure points. 

  What's clever about their approach is how the Calibrator forces confrontation with Dennett's key moves: it reduces qualia to functional roles (undermining intrinsicality) while preserving ineffability through subject-relativity. The transfer procedure brilliantly mirrors Dennett's Chase & Sanborn case but in reverse - here the functional change causes experiential change.

  For the question itself, I'll need to embed all four issues without making it feel like a checklist. The phrasing must prevent students from defaulting to their rehearsed "four properties" paragraph. Maybe framing it as "whether signature realism saves qualia or secretly agrees with Dennett" will force integration.

  The model answer should demonstrate how a top student would navigate the tensions: first dissecting which properties survive (privacy yes, intrinsicality no), then showing how inverted spectra become undetectable (which actually helps qualia realists), then analyzing Mary as the hardest case (where signatures expose the explanatory gap), and finally confronting the residual "why like anything?" question head-on. 

  For grading, these five moves seem essential: 1) Accurate property analysis 2) Inverted spectrum implications 3) Mary knowledge argument response 4) Gap relocation recognition 5) Overall verdict on elimination vs preservation. Top answers will show how these points interconnect rather than treating them separately.

  Common pitfalls I anticipate: Students might miss that signatures aren't intrinsic (confusing neural implementation with qualia), or claim Mary learns nothing new (ignoring the difference between knowing-the-signature and having-the-signature-activated), or dismiss the residual gap too quickly. The transfer procedure is likely to be underanalyzed - many won't see how it mirrors Dennett's coffee case while undermining intrinsicality.
answer: |-
  Here's the exam question, model answer, and marking scheme woven into continuous prose as requested, ready for pasting into your exam file:

  Begin exam question text:  
  "Signature realism, as defined by the Calibrator thought experiment (producing subject-relative, stable signatures perfectly tracking behavioral dispositions and shifting predictably with mechanism transfer), proposes that qualia can be identified with these signatures. Drawing on Dennett’s arguments in 'Quining Qualia' (especially concerning the Chase and Sanborn case and the nature of properties like ineffability, intrinsicality, privacy, and direct apprehensibility), the inverted spectrum argument, and the knowledge argument (Mary), critically evaluate whether signature realism successfully answers Dennett’s charge that qualia are an incoherent posit. Does signature realism vindicate qualia by providing a coherent account of them, does it concede Dennett’s elimination argument by redefining qualia beyond recognition, or does it relocate the core problem? In your answer, address at least: (a) which of the four traditional properties of qualia the signatures genuinely possess and which they lack or fundamentally alter; (b) the implications of subject-relativity for the inverted spectrum thought experiment; (c) what remains of Mary’s epistemic situation upon seeing red for the first time, given she knew all signatures and their causal roles; and (d) whether the question 'Why is the tokening of *this* signature like *anything* for the subject?' represents a residual problem for physicalism, a fatal flaw in signature realism, or an illegitimate question."  
  End exam question text.  

  Begin model answer (approx. 700 words):  
  Signature realism, via the Calibrator, attempts a physicalist rehabilitation of qualia by identifying them with stable, subject-relative neural signatures perfectly correlated with behavioral dispositions. However, a close analysis reveals it largely concedes Dennett’s eliminativist arguments while relocating, rather than resolving, the core intuition driving qualia realism.  

  Regarding the four traditional properties: Signatures possess *privacy* robustly. Their subject-relativity and the impossibility of intersubjective comparison (any mapping fits the evidence) ensure that only the subject has direct access to their own signature set. They possess a form of *direct apprehensibility* to the system itself, as the signatures are the direct outputs correlated with subjective reports and reactions. However, they fundamentally lack *intrinsicality*. The transfer procedure demonstrates this: swapping mechanisms alters the signature associated with a stimulus, thereby altering the reported experience and preferences. This shows the signature’s identity and its experiential character are not intrinsic but functionally determined by its role within the cognitive system and its causal history. This directly echoes Dennett’s Chase and Sanborn case, where functional role determines taste change, undermining intrinsicality. *Ineffability* is also compromised. While the signature itself is a code (perhaps complex), the Calibrator makes the *structure* of subjective similarity, difference, preference, and change perfectly expressible and intersubjectively verifiable via the signatures, even if the intrinsic "feel" associated with a specific signature isn't conveyable. We can say *exactly* when experiences are the same or different, and predict reactions flawlessly. The combination that survives – private, directly apprehensible codes, lacking intrinsicality and lacking ineffability regarding relational structure – is a significant departure from traditional qualia. This is closer to Dennett’s heterophenomenological reports or complex dispositional states than to intrinsic feels.  

  Subject-relativity decisively impacts the inverted spectrum. If intersubjective comparison of signatures is impossible (any bijective mapping works), then the inverted spectrum scenario becomes empirically undetectable and arguably incoherent *as a distinct possibility*. There is no fact of the matter about whether Ada’s signature for red corresponds to Bo’s signature for green or for red; all mappings are equivalent. While the qualia realist might lament this loss of a conceivable (but undetectable) possibility, signature realism frames this as dissolving a pseudo-problem generated by the mistaken assumption of intrinsic, comparable properties. The behavioral evidence exhausts the facts about experience. This is a result Dennett would welcome as eliminating confusion, but the qualia theorist should see it as conceding the eliminativist point: there is no "inversion" over and above functional differences, which the Calibrator would detect via signature changes.  

  Mary’s case presents the strongest challenge to signature realism’s eliminative leanings. Suppose Mary, in her black-and-white room, possesses a complete physical description of the brain, including *every* possible Calibrator signature, their precise neural correlates, and their entire causal role in processing, behavior, memory, preference, and surprise. Upon release and seeing a red rose, she tokens a specific signature, S-red, for the first time. She knew *everything* about S-red’s causal role and structure beforehand. Does she learn anything new? The persistent intuition is yes: she learns *what it is like* to see red. Signature realism struggles to explain this gap. The residual novelty isn't *knowing-that* (she knew all facts about S-red's role) but seems to be a *knowing-how* or *acquaintance* – the first-personal tokening of the signature itself within her own cognitive system. This "acquaintance gap" highlights the relocation of the problem: the mystery isn't in the functional role (which Mary knew), but in the brute fact of first-personal instantiation. *Why* should the tokening of S-red (a complex physical/functional state) be accompanied by *this* specific subjective character?  

  This leads to the residual gap: "Why is the tokening of S-red like *anything* (specifically, like *this*) for Mary?" Signature realism, by identifying qualia with the signature, doesn't answer this; it assumes it. The signature *is* the quale, but the question now becomes "Why is this specific neural/functional state (S-red) the vehicle of *subjective experience* at all?" This is the relocated hard problem of consciousness. Signature realism eliminates qualia conceived as intrinsic, ineffable properties over and above functional states. Instead, it posits complex functional/coding states *as* the experiences. However, it does nothing to explain why these particular physical states give rise to subjective phenomenology in the first place. It thus concedes Dennett’s core argument against intrinsic qualia while quietly inheriting the deeper problem of explaining subjectivity itself. The posit is saved only by being radically redefined into a functional pattern, but the core mystery of conscious experience persists, relocated to the question of why that pattern is experiential. This is elimination of the traditional posit coupled with an admission that the phenomenon demanding explanation (subjective experience) remains, albeit differently characterized. Signature realism doesn't vindicate qualia; it buries them under a functional description and points to the grave as the solution, while the ghost of subjectivity remains at large.  
  End model answer.  

  Begin marking scheme integrated into prose:  
  A strong answer (scoring 16-20 marks) will comprehensively address the core question of whether signature realism answers or concedes Dennett's challenge, earning its conclusion through rigorous analysis of the thought experiment. Five essential moves must be hit. First, it must accurately dissect the fate of the four qualia properties under signature realism (4 marks), clearly showing signatures retain privacy and direct apprehensibility but lose intrinsicality (demonstrated by the transfer) and genuine ineffability (as relational structure is fully expressed). Students often botch this by claiming signatures are intrinsic or still ineffable, misreading the implications of perfect behavioral tracking and mechanism transfer. Second, it must correctly analyze the inverted spectrum implications (4 marks), arguing that subject-relativity renders interpersonal inversion undetectable and incoherent as a distinct possibility, framing this as dissolving a pseudo-problem. A common error is claiming inversion remains possible despite the mapping problem or misidentifying it as a cost signature realism must bear. Third, it must tackle the residual epistemic gap for Mary (4 marks), granting she knew all signature facts yet arguing a novel first-person acquaintance occurs upon tokening S-red, highlighting the "acquaintance gap" as the relocated mystery. Botching this involves claiming Mary learns nothing new or that she lacked causal role knowledge. Fourth, it must identify and articulate the residual explanatory gap (4 marks) – why tokening S-red is like anything at all – recognizing this as the relocated hard problem of consciousness, not solved by signature realism. Students often dismiss this gap too quickly or fail to see its force. Fifth, it must provide a nuanced overall verdict (4 marks), concluding that signature realism eliminates traditional qualia (conceding Dennett on intrinsicality/ineffability) but relocates the core problem of subjectivity itself, arguing whether this counts as vindication or elimination depends on how strictly one defines qualia. Top answers (A range) will integrate these points seamlessly, showing how the relocation in Mary and the residual gap stem directly from the property analysis and spectrum dissolution, offering a sophisticated meta-reflection on the eliminativist maneuver. B answers hit the moves but lack this integration or depth on the relocation/concession point.  
  End marking scheme.
