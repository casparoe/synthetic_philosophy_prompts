  ### Core Concepts in Translation

  1. **The question: "What level does selection act at?"**
     - In statistical terms: This becomes a question of which level (individual or group) shows a causal effect of a trait on fitness, after accounting for the hierarchical structure and potential confounding. We can model fitness as a response variable and traits at individual and group levels as predictors, then see at which level the trait-fitness association is causal and direct.

  2. **Replicator vs. Vehicle/Interactor**:
     - *Replicator*: An entity that passes on its structure largely intact in replication. In statistics, we might think of a variable that is directly inherited (like a gene) and has a high heritability (slope in a parent-offspring regression).
     - *Vehicle/Interactor*: An entity that interacts as a cohesive whole with its environment. In statistics, this is the unit at which we observe the environment acting (e.g., group-level predictors in a mixed model). The interactor is the unit that we see directly affecting fitness in our model.

  3. **Heritability**:
     - In quantitative genetics, heritability is the proportion of phenotypic variance due to genetic variance. In regression terms, it is the slope of the offspring phenotype regressed on the parent phenotype (for narrow-sense heritability). In the context of mixed models, we can estimate variance components (genetic vs. environmental) to compute heritability.

  4. **Hamilton's Rule**:
     - The rule states that a costly behavior (cost C to the actor, benefit B to the recipient) can evolve if the relatedness (R) between actor and recipient is high enough: R*B > C.
     - In statistical terms: We can model the change in a trait (like altruism) by including both individual and group effects. The condition can be derived from a regression of the recipient's fitness on the actor's behavior and their relatedness (with relatedness as a regression coefficient). 

  5. **Partitioning of Change (Price Equation)**:
     - The Price Equation decomposes the change in a trait into two parts: 
          - Covariance between individual trait and individual fitness (within-group selection)
          - Covariance between group mean trait and group mean fitness (between-group selection)
     - In multilevel modeling, this is analogous to partitioning the variance in fitness into within-group and between-group components, and then regressing the trait on fitness at each level.

  6. **Two Definitions of Group Fitness**:
     - *Definition 1 (Average Individual Fitness)*: The average of the fitness values of the individuals in the group.
     - *Definition 2 (Number of Daughter Groups)*: The number of new groups founded by the group (a group-level property).
     - In the mixed model, we can have two different response variables: 
          - Individual fitness (with group-level random effects) 
          - Group fitness (as a group-level response in a separate model).

  7. **Selection of vs. Selection for**:
     - *Selection for*: When a trait is directly favored by selection (it is causally responsible for increased fitness).
     - *Selection of*: When a trait is correlated with fitness but not causally responsible (it is hitchhiking).
     - In causal inference (DAGs), we distinguish direct causal paths from indirect ones. A confounder might cause both the trait and fitness, leading to selection of without selection for.

  8. **Fitness: Propensity vs. Realized**:
