  Both parties would classify the hydrogen bond dispute as verbal because:

  - The deflationist: The frameworks are intertranslatable without loss, so the choice is pragmatic.
  - The realist: The different frameworks are different ways of describing the same underlying real structure (the hydrogen bond as a natural kind) so the dispute is not about whether it exists but how to represent it.

  Conclusion for the user: When the argument petered out, you should have concluded that the hydrogen bond is a real feature of the world (if you are a realist) or that the choice of framework is pragmatic (if you are a deflationist). But the key point is that the dispute was verbal: the different frameworks were compatible descriptions of the same phenomena.

