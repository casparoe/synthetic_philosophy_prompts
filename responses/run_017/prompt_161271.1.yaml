  We are composing a joint statement from a neo-Carnapian deflationist and a structural realist. The document has four parts: agreed claims, disagreements, cruxes, and an application to the hydrogen bond case.

  Part 1: Agreed Claims

  Both parties agree on the following:

  1. Quantification and singular terms: When a theory uses quantification (e.g., "there exists an X such that...") or singular terms (e.g., "the hydrogen bond"), it commits to entities in its domain of discourse. However, the nature of this commitment is interpreted differently: for the deflationist, it is relative to a linguistic framework; for the realist, it is about what is really there.

  2. Mutual restatement: When two parties can restate each other's claims in their own vocabulary without loss of explanatory or predictive power, and without either side making a mistake, this suggests that the dispute may be verbal. However, both sides agree that this pattern does not automatically prove that the dispute is verbal; it might also indicate that the two frameworks are equally adequate for capturing the same reality (realist) or that the choice is pragmatic (deflationist). The pattern is necessary but not sufficient for a dispute to be verbal.

  3. Value of settling verbal disputes: Even if a dispute is verbal, it can be worth settling for practical reasons: to reduce ambiguity, to enhance communication, to simplify theory, or to better integrate with other scientific theories. The grounds for choosing one framework over another include fruitfulness, simplicity, fit with the rest of science, and practical or moral implications.

  4. Ordinary object-talk: Both agree that in ordinary contexts, questions about the existence of everyday objects (like chairs) are settled by trivial inference from empirical premises (e.g., if I see a chair, I infer it exists). However, this does not settle the status of contested theoretical entities (like hydrogen bonds) because these are embedded in more complex theoretical frameworks.

  5. Criteria for verbal disputes: Both sides owe each other an explicit criterion for distinguishing verbal from substantive disputes. The deflationist proposes that a dispute is verbal if it can be fully resolved by clarifying the meanings of the terms or by choosing a framework without needing new empirical data. The realist proposes that a dispute is substantive if it concerns the natural structure of reality, even if it is empirically underdetermined.

  But note: The above points are stated in a way that both can accept, but they interpret them differently. We must be cautious.

  Revised agreed claims:

  1. Both agree that the use of quantifiers and singular terms in a theory is meaningful only within a linguistic or conceptual framework. (The realist may add that the framework aims to capture reality, but the deflationist does not require that.)

  2. Both agree that the pattern of mutual restatement without loss or mistake is a sign that the dispute might be verbal, but it does not by itself prove that the dispute is entirely verbal. There might be deeper substantive issues.

  3. Both agree that even if a dispute is verbal, it can be important to resolve it for practical reasons.

  4. Both agree that the ease of resolving existence questions for ordinary objects (like chairs) does not directly transfer to theoretical entities because the latter are part of a complex theoretical structure.

  5. Both agree that an explicit criterion for verbal disputes is needed. They both accept that a dispute is verbal if it arises solely from differences in the meaning of terms and not from differences about the world. However, they disagree on how to determine when that is the case.

  Part 2: Disagreements Table

