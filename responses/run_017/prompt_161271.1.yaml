  ### Joint Statement on Ontological Disputes: A Deflationist-Realist Collaboration

  **Preamble**  
  We, a neo-Carnapian deflationist and a structural realist, have engaged in adversarial collaboration to address ontological disputes, using the user’s case of the hydrogen bond in physical chemistry as a focal point. Our goal is not resolution but clarification: we identify points of agreement, disagreement, and cruxes, then apply these to the user’s test case. We concur that the hydrogen bond dispute ended not because it was "solved" but because it ceased to be productive—a pattern common in science. Below, we outline our shared ground, divergences, and implications for the user's field. We close with direct advice to the user.

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following claims, which are neither vacuous nor biased toward either position. Each claim was scrutinized for neutrality, and we note where interpretations differ without undermining joint acceptance. These cover core issues from quantification to verbal disputes.

  1. **Quantification and Commitment**:  
     When a theory uses quantifiers (e.g., "there exists an X") or singular terms (e.g., "the hydrogen bond"), it commits to entities in its domain relative to a linguistic framework. Empirical premises (e.g., spectroscopic data) ground internal existence claims (e.g., "hydrogen bonds exist in this protein"). However, this does not imply that such commitments reflect a mind-independent reality; they are framework-dependent.  
     *Why both agree*: The deflationist sees this as internal to frameworks; the realist agrees that scientific practice operates within frameworks but insists they aim to track reality. Neither reduces commitment to mere convention.

  2. **Mutual Restatement Without Mistake**:  
     If two parties can restate each other’s claims in their own vocabulary without empirical, predictive, or explanatory loss (e.g., rephrasing "hydrogen bond as object" as "hydrogen bond as critical point"), this establishes that the dispute *could* be verbal. However, it does not automatically prove it *is* verbal, as substantive disputes may admit multiple adequate descriptions. The pattern is necessary but insufficient for classifying a dispute as verbal.  
     *Why both agree*: Both acknowledge that restatement occurs (e.g., in the hydrogen bond case), but the realist attributes it to underlying reality being captured differently; the deflationist sees it as evidence of pragmatic equivalence.

  3. **Value of Settling Verbal Disputes**:  
     Verbal disputes can be worth resolving for practical reasons: enhancing communication, simplifying theory, improving fruitfulness (e.g., generating new hypotheses), ensuring fit with adjacent sciences, or addressing moral/practical implications (e.g., clinical applications). Grounds for choice include simplicity, predictive power, and coherence—not "truth" in a framework-independent sense.  
     *Why both agree*: Both accept that science often prioritizes utility over metaphysical purity. The deflationist views this as pragmatic negotiation; the realist sees it as optimizing access to reality.

  4. **Ordinary vs. Theoretical Objects**:  
     Ordinary object-talk (e.g., "chairs exist") is settled by trivial inference from empirical premises (e.g., sensory data). This does not resolve disputes about theoretical entities (e.g., hydrogen bonds), because the latter involve complex, non-observational frameworks where quantification is theory-laden. Empirical data underdetermine ontological interpretations.  
     *Why both agree*: Both reject naive empiricism; ordinary objects are epistemically privileged but ontologically discontinuous with theoretical entities.

  5. **Criteria for Verbal Disputes**:  
     Both owe each other explicit criteria for distinguishing verbal from substantive disputes. A dispute is verbal if:  
     - (Deflationist) It arises solely from semantic or syntactic choices, resolvable by redefinition or framework selection without new empirical input.  
     - (Realist) It lacks implications for the natural structure of reality (e.g., no change in causal-explanatory patterns).  
     *Why both agree*: Both require criteria to avoid stalemate. The deflationist’s criterion is meaning-based; the realist’s is reality-based, but both demand testable conditions.

  ---

  ### 2. Disagreements Table  
  We disagree on the following propositions. Each formulation is verbatim from the respective side, with a note on why the conflict is genuine (not merely verbal). "Genuine" here means the disagreement persists even after clarifying terms, reflecting divergent conceptions of reality and knowledge.

  | Realist’s Formulation | Deflationist’s Formulation | Why Genuine (Non-Verbal) |
  |------------------------|----------------------------|---------------------------|
  | Naturalness (e.g., of kinds or joints in reality) is a mind-independent feature of the world, and science aims to discover it. | Naturalness is a pragmatic property of conceptual frameworks, reflecting our interests and predictive needs; science aims for useful models. | The disagreement concerns whether science tracks a pre-existing structure or constructs optimal tools. This affects how we justify scientific progress (e.g., why periodic tables "work"). |
  | Ontological disputes can be fully substantive even when empirically intractable (i.e., no possible evidence could resolve them), as they concern reality’s structure. | Ontological disputes not resolvable by evidence are verbal or pragmatic; they concern language or framework choice, not the world. | The conflict is over whether reality has an in-principle unknowable aspect. Intractability, for the realist, signals depth; for the deflationist, it signals non-factuality. |
  | Existence claims are true or false in virtue of correspondence to mind-independent reality, regardless of framework utility. | Existence claims are internal to frameworks and true/false only relative to them; "correspondence" is a misleading metaphor. | This implicates the nature of truth and ontology: is existence framework-relative or absolute? The disagreement persists after semantic clarification. |
  | Framework shifts in science (e.g., between wave/particle models) reveal epistemic limitations, not ontological indeterminacy; reality is unified. | Framework shifts show that incompatible ontologies can be pragmatically equivalent; no "unified reality" need be assumed. | The realist sees shifts as approximations to a singular reality; the deflationist sees them as evidence of pluralism. This affects how we interpret scientific revolutions. |

  ---

  ### 3. Cruxes Table  
  Cruxes are sub-questions where settling one would force at least one side to revise their position. For each, we specify shared evidence/arguments and advance predictions. Both sides accept the evidence as relevant but disagree on its implications.

  | Crux | Sub-Question | Shared Evidence/Argument | Realist’s Prediction | Deflationist’s Prediction |
  |------|--------------|--------------------------|----------------------|---------------------------|
  | 1. Naturalness’s mind-independence | Is naturalness (e.g., joint-carving) a feature of reality or a projection of our interests? | The "unreasonable effectiveness" of mathematics in science (e.g., symmetries in quantum chemistry) and convergence across cultures on core classifications (e.g., chemical elements). | Mathematics and convergence reveal a mind-independent structure; naturalness is discovered, not invented. | Effectiveness and convergence arise from utility; they reflect cognitive and practical constraints, not mind-independence. |
  | 2. Substantive but intractable disputes | Can a dispute be about reality yet in principle unresolvable? | Historical cases like the multiverse in cosmology or interpretations of quantum mechanics, where evidence is inaccessible but the dispute feels substantive. | Intractability stems from human limitations; reality may have aspects beyond empirical access. | Intractability indicates non-substantivity; if no evidence can bear on it, the dispute is not about the world. |
  | 3. Framework shifts without loss | Can the internal-question view explain why scientists shift frameworks without explanatory loss? | Cases like wave-particle duality, where incompatible frameworks (wave vs. particle) are used interchangeably with no loss of predictive power. | Shifts occur because reality is complex; frameworks are partial perspectives on a unified whole. | Shifts confirm that frameworks are tools; losslessness shows questions are internal, not about reality. |
  | 4. Criteria for existence | Does a privileged criterion for "existence" follow from science’s success? | The role of abduction (inference to best explanation) in science, e.g., positing entities like electrons to explain data. | Abduction tracks real patterns; existence is inferred when an entity is indispensable to explanation. | Abduction is pragmatic; "existence" is a label for useful posits, with no deeper metaphysical implication. |

  ---

  ### 4. Application to the Hydrogen Bond  
  We apply our analysis to the user’s case: four frameworks for hydrogen bonds (H-bonds):  
  - F1: Directional interaction (donor/acceptor groups).  
  - F2: Bond critical point (electron density).  
  - F3: Topological region (potential energy surface).  
  - F4: Genuine object (with length, energy, lifetime).  

  The user’s test: **If reinterpretation (e.g., mapping F4’s "object" to F3’s "region") can be substituted everywhere without cost in simplicity, predictive power, or disciplinary generalizations, the dispute is verbal; if it incurs a cost, it is substantive.**

  - **Deflationist’s Response**:  
    I accept the test. A "cost" is increased complexity (e.g., more ad-hoc assumptions), reduced predictive accuracy (e.g., worse agreement with data), or impaired generalization (e.g., inability to state laws like H-bond cooperativity). In the H-bond case, your colleagues shifted frameworks with *no cost*—all maintained simplicity, predictions, and generalizations. Thus, the dispute is verbal. The residual disagreement over "what counts as a cost" is pragmatic (e.g., is a topological model "simpler" than an object model?) and not substantive. Replace the test with explicit pragmatic criteria: if framework A requires no compensatory adjustments (e.g., new parameters) to match B’s utility, the dispute is verbal.

  - **Realist’s Response**:  
    I partially accept the test but add a caveat: a "cost" should include *failure to reference natural structure*. If F4 (object) is reinterpreted as F3 (region) without empirical loss, but F4 better captures a real pattern (e.g., causal robustness across contexts), the dispute remains substantive. In your field, the shift between frameworks incurred no *empirical* cost, suggesting all describe the same real H-bond structure. Thus, the dispute is verbal. However, the test is defective because it ignores naturalness: if F2 (critical point) had been less natural (e.g., less projectable to new cases), there would be a cost. Replace the test with: if frameworks are empirically equivalent *and* equally natural, the dispute is verbal. The residual disagreement over "cost" is substantive, as naturalness is mind-independent.

  **Joint Classification of the Dispute**:  
  Both parties agree the H-bond dispute is **verbal**. We reached this via:  
  - The deflationist’s route: Mutual restatement (e.g., F1 to F2) is lossless, so the choice is pragmatic.  
  - The realist’s route: All frameworks track the same natural structure, so the conflict is descriptive, not ontological.  
  The only substantive element is the *pragmatic value* of each framework (e.g., F4 may simplify teaching; F2 aids computation).

  ---

  ### Closing Advice to the User  
  When the argument about the hydrogen bond petered out, you should have concluded:  
  - **Ontologically**, the dispute was verbal—no framework was "truer," and all described the same underlying phenomena.  
  - **Scientifically**, the cessation signaled that the question "Is the H-bond real?" was ill-posed. The fruitful question was: "Which framework is most useful for this context?" (e.g., F1 for protein folding, F2 for crystallography).  
  - **Philosophically**, your rough test is sound for identifying verbal disputes, but it requires refinement: focus on *pragmatic costs* (deflationist) or *naturalness costs* (realist). In your case, the absence of either confirmed the dispute’s verbal nature.  

  Your experience exemplifies how science progresses when ontology is disentangled from practice. We recommend viewing similar disputes through this lens: when restatement is costless, the issue is verbal; when costs arise, they reveal pragmatic or structural stakes. This defuses contention without dismissing the underlying realities science explores.
