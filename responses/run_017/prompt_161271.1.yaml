  | The existence of an entity (like a hydrogen bond) is a matter of whether it corresponds to a natural kind in reality. | The existence of an entity is relative to a framework; we can choose frameworks that quantify over hydrogen bonds or not, and both are acceptable. | The disagreement is about the relativity of existence. It is genuine because it reflects a deep divide in the understanding of what existence claims mean. |
  | The goal of science is to discover the fundamental structure of reality.                                            | The goal of science is to produce useful models for prediction and control; the choice of ontology is pragmatic.        | The disagreement about the aim of science is genuine because it affects how we interpret scientific progress and theory choice. |

  Part 3: Cruxes Table

  For each crux, we identify the sub-question, the agreed evidence/argument, and each side's prediction.

  Crux 1: Is naturalness mind-independent?

  - Sub-question: Does the world have an objective structure that makes some classifications more natural than others, independently of human interests?
  - Agreed evidence: The success of science in making predictions and providing explanations, especially when multiple independent methods converge on the same classifications (e.g., in chemistry, the periodic table).
  - Realist's prediction: Science converges on natural kinds because they are real; the success is due to tracking mind-independent structure.
  - Deflationist's prediction: The convergence is due to the practical utility of certain classifications; we could have different but equally useful classifications.

  Crux 2: Can a dispute be substantive while intractable?

  - Sub-question: Can there be a factual disagreement about the world that is in principle unresolvable by empirical evidence?
  - Agreed evidence: Historical cases of ontological disputes that were resolved (e.g., phlogiston vs. oxygen) and unresolved ones (e.g., the existence of the multiverse in cosmology).
  - Realist's prediction: Some disputes (like the multiverse) might be substantive but intractable due to limitations of access, not because they are verbal.
  - Deflationist's prediction: Intractable disputes are either verbal (if they persist without new evidence) or pragmatic (if they involve framework choices).

  Crux 3: Can the internal-question picture accommodate framework shifts without loss?

  - Sub-question: When scientists shift between frameworks that are strictly incompatible (e.g., wave vs. particle descriptions of light), does this show that the frameworks are merely pragmatic tools?
  - Agreed evidence: The history of science, e.g., the complementarity principle in quantum mechanics.
  - Realist's prediction: Framework shifts are necessary because reality is complex and our access is limited; the incompatibility is due to our epistemic limitations, not the absence of a unified reality.
  - Deflationist's prediction: Framework shifts are evidence that questions of existence are internal to frameworks; there is no loss because the frameworks are chosen for their utility in different contexts.

  Crux 4: What is the status of criteria for naturalness?

  - Sub-question: Are criteria for naturalness (e.g., in terms of objective similarity) themselves mind-independent?
  - Agreed evidence: The use of mathematical structures in physics (e.g., symmetries) that seem to underpin reality.
  - Realist's prediction: The mathematical structures are discovered and reflect the natural structure of reality.
  - Deflationist's prediction: The mathematical structures are part of our most effective models, but their success does not entail mind-independence.

  Part 4: Application to Hydrogen Bond

  The dispute in the user's field involves four frameworks for hydrogen bonds:

  - F1: Directional interaction between donor and acceptor groups.
