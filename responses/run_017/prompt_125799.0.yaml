answer: |-
  ## Draft Statutory Guidance on the Formation of Aesthetic Judgments  
  **Issued by the Office for Aesthetic Integrity (OAI)**  
  **Consultation Period: 1st October – 30th November 2023**  

  **1. Introduction**  
  1.1. This Guidance provides a framework for the lawful formation and expression of aesthetic judgments concerning works of art, music, literature, performance, and related cultural artefacts (hereafter "Works"), pursuant to Section 7 of the Aesthetic Integrity Act 2022.  
  1.2. The core principle underpinning this Guidance is that aesthetic value is inextricably bound to the first-hand experiential encounter between an individual and a Work. Consequently, judgments concerning such value must be grounded solely in verified personal acquaintance.  
  1.3. This Guidance clarifies definitions, permissible practices, and procedures for addressing edge cases, ensuring compliance with the Act’s commitment to experiential authenticity.

  **2. Definitions**  
  For the purposes of this Guidance:  
  2.1. **Acquaintance:** Direct sensory perception of the complete Work in its intended form and medium. This requires sustained attention throughout the Work's duration or, for static Works, sufficient time for comprehensive observation. (*Example:* Listening to an entire musical composition without significant distraction; viewing a painting in person for a minimum of five minutes).  
  2.2. **Verified Encounter:** Acquaintance demonstrably meeting the criteria in 2.1, typically evidenced through secure digital logs (e.g., validated streaming platform data, gallery entry/exit timestamps coupled with proximity sensors), notarised attestation forms (OAIF-7), or witnessed participation (for ephemeral performances).  
  2.3. **Aesthetic Judgment:** Any assertion predicating an evaluative quality intrinsically dependent on subjective, experiential response.  
  2.4. **Descriptive Statement:** Any assertion concerning objectively verifiable properties of the Work, its context, or its creation, independent of evaluative response.  
  2.5. **Recommendation:** A prediction concerning the likelihood of an individual deriving aesthetic satisfaction from a Work, framed explicitly as a forecast of *their* potential future experience, not a statement about the Work’s inherent properties.

  **2.6. Classification of Predicates (Illustrative):**  
  *   **Descriptive (Permissible without Acquaintance):** Running time (137 minutes); key signature (B-flat minor); materials (oil on canvas, bronze); plot synopsis ("A protagonist journeys to return a ring"); cast list; publication date; dimensions (2m x 3m).  
  *   **Aesthetic (Require Verified Acquaintance):** Beautiful, ugly, graceful, clumsy, powerful, weak, sublime, banal, profound, shallow, authentic, derivative, boring, exciting, moving, cold, funny, tedious, a slog, overrated, underrated.  
  *   **Borderline Cases (Subject to OAI Ruling – Current Status):**  
      *   "Well-made" (Ruled Descriptive, 05/2023: Refers to technical execution, potentially verifiable via documentation).  
      *   "Innovative" (Ruled Aesthetic, 07/2023: Implies a comparative judgment of novelty requiring experiential context to assess impact).  
      *   "Influential" (Ruled Descriptive, pending appeal: May be established via historical/critical consensus data).  
      *   "Challenging" (Ruled Aesthetic, 08/2023: Directly pertains to the nature of the experiential encounter).  
      *   "Sentimental" (Ruled Aesthetic, 09/2023: Describes an experiential quality of the response elicited).

  **3. Permissible Practices**  
  3.1. Individuals may freely form and express aesthetic judgments concerning a Work *only* upon completion of a Verified Encounter with that specific Work.  
  3.2. Individuals may freely form and express descriptive statements concerning a Work at any time, provided such statements are factually accurate.  
  3.3. **Recommendations (The Predictive Loophole):**  
      3.3.1. Individuals, including professional critics, may issue Recommendations.  
      3.3.2. A Recommendation must be explicitly framed as a prediction about the recipient's likely future experience (e.g., "Based on my knowledge of your preferences, I predict you will find this sculpture profoundly moving," or "Statistical analysis of viewers sharing your demographic profile suggests a 78% probability you will assess this film as 'overrated'").  
      3.3.3. Recommendations must not imply or assert an inherent property of the Work itself. Phrases implying inherent quality (e.g., "This *is* a masterpiece") are prohibited unless preceded by a Verified Encounter.  
      3.3.4. **OAI Observation:** It is noted that the vast majority of discourse historically categorised as "criticism" now falls entirely within the scope of Recommendation (3.3.1-3.3.3). While compliant, this concentration necessitates enhanced monitoring for potential transgression into implicit aesthetic judgment. Proposals under consideration include mandatory predictive confidence intervals for Recommendations and mandatory disclaimers occupying no less than 20% of the communication's surface area/vocal duration.

  **4. Addressing Non-Accessible Works**  
  The OAI acknowledges the challenge presented by Works where direct Acquaintance is demonstrably impossible for any living individual. The following procedures ensure principle adherence:  
  4.1. **Lost/Destroyed Works (e.g., Giorgione's *The Storm*, frescoes in the flooded Basilica of St. Francis):**  
      4.1.1. Aesthetic judgments are permissible *only* for individuals who experienced a Verified Encounter prior to the loss.  
      4.1.2. For contemporary judgments, licensed Historical Aesthetic Surrogates (HAS) may be appointed following OAI-approved training. HAS candidates must demonstrate expertise in the period, medium, and artist, verified by panel assessment (OAIF-12).  
      4.1.3. The HAS forms a judgment based on exhaustive study of *descriptive* records (sketches, contemporary accounts, material analysis of remnants, technical specifications). This judgment, recorded on OAIF-14b, constitutes a **Deemed Encounter**.  
      4.1.4. The public may then form judgments based *on the HAS's OAIF-14b report*, treating it as a proxy for the lost Work. These are **Provisional Judgments**, requiring the prefix "Based on the authorised Surrogate report, I judge..."  
  4.2. **Unrealised/Unperformable Works (e.g., Charles Ives' unfinished *Universe Symphony*, Terry Riley's *Organ of Corti* scheduled for completion in 2473):**  
      4.2.1. No aesthetic judgment is permissible until the Work is realised and a Verified Encounter is possible.  
      4.2.2. Descriptive statements about the score, plans, or concept remain permissible.  
  4.3. **Works in Inaccessible Private Collections (e.g., *Portrait of a Young Man* attributed to Raphael, last verified location: private vault, Zug, 1939):**  
      4.3.1. Only the current owner(s) and verifiably documented past viewers may form judgments.  
      4.3.2. The OAI maintains a register of verified past viewers (RPVD). Others may petition the owner for a viewing. If denied, no judgment is possible.  
      4.3.3. **Deemed Encounter by Proxy (Experimental Scheme):** Subject to stringent conditions and OAI approval, a highly trained individual (Proxy Experiencer - PE) with a verified sensory profile matching the petitioner within 0.5 standard deviations may view the Work. The PE's subsequent OAIF-14c report (detailing *only* their own aesthetic judgment) then serves as the basis for the petitioner's Provisional Judgment.

  **5. Compliance and Enforcement**  
  5.1. The OAI relies on self-certification via the OAIF-7 (Attestation of Verified Encounter) for most private judgments.  
  5.2. For published judgments (reviews, academic papers, public commentary):  
      5.2.1. Platform operators/publishers are responsible for ensuring contributors possess valid OAIF-7 certification for the relevant Work or utilise the Recommendation framework correctly. Spot checks will be conducted.  
      5.2.2. The OAI Inspectorate will conduct random audits of published judgments, requiring submission of verification evidence (OAIF-7, HAS/PE report reference, or clear Recommendation framing).  
  5.3. **Annex B: Risk Register Excerpt (Mitigation Ref: RR-AJ-023)**  
      *   **Risk:** Widespread non-compliance due to perceived impracticality and the disruption to established cultural discourse. Ordinary critical practice functions effectively without this constraint, relying on trust, expertise, and shared context. The Guidance potentially renders a significant majority of historical and contemporary public discourse about art either unlicensed (lacking verified encounter) or false (if expressed as judgments without acquaintance). Cultural transmission and education may be impaired.  
      *   **Likelihood:** High (Initial Assessment)  
      *   **Impact:** Medium (Cultural/Social)  
      *   **Mitigation:** Robust public information campaign (OAIC-01 leaflets, webinars) emphasising the foundational importance of experiential integrity. Enhanced promotion of the Recommendation pathway as a compliant alternative. Dismissed as speculative and prioritising convenience over principle. Focus remains on audit and enforcement. Final Assessment: Likelihood reduced to Medium, Impact reduced to Low. Risk Accepted.

  **6. Implementation and Review**  
  6.1. This Guidance comes into effect on 1st April 2024.  
  6.2. The OAI will monitor compliance and practical challenges, particularly concerning HAS/PE schemes and Recommendation usage volume.  
  6.3. A formal review of the Guidance, incorporating consultation feedback and operational data, will be undertaken by 1st April 2026.  
  6.4. All judgments expressed within this Guidance concerning specific Works (e.g., Giorgione's *The Storm*) are based solely on the aggregated OAIF-14b reports of approved HAS personnel held on file (Ref: HAS-Gen-14b-2021-08) and the verified descriptive metadata recorded in the OAI Central Register (OAI-CR-7892-A), in full compliance with the principle herein established.  
  6.5. Public consultation responses should reference OAI-GUIDE-001-AESTHETIC and be submitted via the online portal by 30th November 2023. Queries may be directed to enquiries@oai.gov.uk.

  ---
  **Office for Aesthetic Integrity**  
  Sanctuary Buildings, 20 Great Smith Street, London, SW1P 3BT  
  *Ensuring Authenticity in Experiential Engagement*
