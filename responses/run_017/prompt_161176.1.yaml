  ## Mantle Fold Sestina for the Function Wars

  Before the second migrant breached the shore,
  One fragile founder sealed its brittle home.
  No lineage bore this fold; no crafted *work*
  Was shaped by pressure, coded deep in *history*.
  It simply *was* – a blind, unchosen *accident*,
  Securing life against the searing drought.

  The dry wind brought its annual, fierce *drought*.
  Upon the barren rock, along the *shore*,
  Survival hung on sealing tight – *accident*
  Became essential. Held within the shell, the *home*
  Was shielded. Was this fold's sustaining *work*
  A function born, or just a lucky *history*?

  For countless shells, no varied *history*
  Unfolded. Clones endured the parching *drought*.
  The fold just *did* – performed its vital *work*
  Within the creature's fragile, whole *system*.
  It kept the moisture in, preserved the *home*.
  Its origin? A developmental *accident*.

  Then change: a stranger crossed the salty *shore*.
  Mingled genes brought difference. *Accident*
  Gave way to variation. Now, the *home*
  Faced new conditions in the drying *drought*:
  Some folds held fast, endured the season's *breakdown*,
  Some failed – and life depended on the *work*.

  Now pressure mounted. Fold and valve *system*
  Felt Nature's winnowing. Its vital *work* –
  Sealing the shell against the fatal *drought* –
  Became a target, etched in lineage *history*.
  Survival tracked the fold. Along the *shore*,
  Selection sculpted what began as *accident*.

  So when the dry wind bites, demanding *work*,
  Before the stranger breached that lonely *shore*,
  Did function sleep within the fold? Did *history*
  Lack meaning for that life-preserving *accident*?
  Or was its crucial *contribution* to the *system*
  Complete before the drought brought winnowing *breakdown*?

  The fold persists. Its *contribution* holds the *home*.
  But *history* whispers? Or the *system*'s cry?
  Does *work* alone define it? *Accident* made good?
  Or must selection’s hand bestow the prize?
  One sees the *breakdown* risk, the vital *work* achieved.
  One waits for time’s slow verdict on the *shore*.
  The fold just *is*. The question shapes the *history*.

  **(The fold just *is*.)**  
  **(The question shapes the *history*.)**  
  **(*Accident* or role within the *system*?)**  
  **(Its *work* endures beyond the *drought*'s demand.)**  
  **(Does *breakdown* threaten function, or define it?)**  
  **(The *shore* holds both the chance and the design.)**

  ---

  ## Notes on the Sestina's Philosophical Work

  1.  **End Words & Rotation:** The six end-words (`work`, `history`, `accident`, `system`, `breakdown`, `shore`) are core vocabulary from both accounts. Their forced repetition in shifting contexts (as the sestina form demands) mirrors how the *same words* carry different meanings/weights in each theory:
      *   `Work`: Causal-role sees the *actual activity* (sealing) as function. Selection-history sees "proper work" as the *selected effect*.
      *   `History`: Crucial for selection-history (lineage, past selection). Less central for causal-role (current context is key).
      *   `Accident`: Emphasizes the *lack of historical origin* for the trait, problematic for selection-history but irrelevant to causal-role function.
      *   `System`: Core for causal-role (contribution to containing system/organism). Less emphasized in selection-history's lineage focus.
      *   `Breakdown`: Illustrates malfunction/disruption. Causal-role often uses failure to diagnose function. Selection-history might see failure as lack of performing the selected effect. The question is *when* breakdown implies lack of function.
      *   `Shore`: The environmental context, setting the scene for both the accident's utility and later selection.

  2.  **Stanzas Tracking the Case:**
      *   **1:** Founder, the pure *accident*.
      *   **2:** Pre-variation persistence - the fold *works* within the *system*.
      *   **3:** The causal-role view implicit: it *does* the vital thing.
      *   **4:** Arrival of variation and selection - *history* begins to matter.
      *   **5:** Selection acts - sculpting the *accident*.
      *   **6:** The core philosophical question posed directly, using the end-words.

  3.  **Envoi (Final 6 lines):** Compresses the tension. The fold exists (`is`), but the *question* (`history` vs. `system`) defines the answer. `Accident` clashes with `system`'s role. `Work` endures practically. `Breakdown` highlights the diagnostic difference. The `shore` is the stage for both chance (`accident`) and eventual design (`history`).

  4.  **Non-Resolution:** The poem doesn't declare a winner. It shows how the *same trait* and the *same words* are interpreted through different lenses. The final line of the envoi explicitly holds "chance" and "design" together on the shore. The question *shapes* the history told. The form forces the words to serve both masters, just as the debate does.
