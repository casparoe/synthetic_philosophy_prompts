  **To:** Board Members  
  **From:** [Your Name], Board Member  
  **Date:** [Date of Circulation]  
  **Subject:** Relational Practice Framework Recommendation: Amend to Center Resident's Will  

  The proposed Relational Practice Framework rightly addresses a critical gap: major decisions often ignore the daily relationships that shape a resident’s well-being. The operational mechanism—granting direct support staff (DSS) a formal planning seat and a 60-day mediation trigger when relationships are at risk—is a practical response to conflicts like the recent guardian-staff disagreement. However, the framework’s philosophical grounding—that personhood is "constituted" through relational participation—must be revised to avoid dangerous implications.  

  Denise’s objection is unanswerable as written: If personhood depends on relational engagement, those with the most profound disabilities are rendered "lesser." This mirrors historical exclusion and cannot stand. Personhood is inherent, not earned. Relationships matter because they reveal a resident’s preferences—they are evidential, not constitutive. Staff insights are invaluable for interpreting indirect expressions (e.g., what a resident refuses or lights up around), but they cannot override the resident’s own will or the guardian’s legal role.  

  I recommend **adopting the framework with three amendments**:  
  1. **Remove all language tying personhood to relational participation.** Replace it with: "Relationships provide essential evidence for understanding individual preferences."  
  2. **Explicitly center the resident’s expressed will as the ultimate tie-breaker.** After mediation, decisions must prioritize documented preferences—verbal, behavioral, or assistive—over staff or guardian interpretations.  
  3. **Clarify the 60-day mediation as a fact-finding period, not a veto.** Guardians retain final authority, but the process must rigorously document the resident’s will.  

  **Stress Test**: For a resident with minimal relationships (e.g., no visitors, high staff turnover), their personhood remains inherent. The delay power still applies because even transient staff may hold observations about preferences—but mediation must focus solely on gathering evidence of will, not "preserving" unstable bonds.  

  This framework must not empower staff to outrank families. By centering the resident’s will and limiting mediation to evidence collection, we respect all roles.  

  **Concrete Next Steps if Amended**:  
  - Revise framework language by 7 days post-vote (ED/Attorney).  
  - Train DSS and guardians on evidence-based preference documentation within 60 days (ED).  
  - Review efficacy at 6 months (Board).  

  Adopting these changes ensures we protect relationships without compromising dignity or legality.  

