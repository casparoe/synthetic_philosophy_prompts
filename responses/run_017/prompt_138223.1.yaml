prompt: |-
  I'm on the board of a small supported-living nonprofit — six group houses, about forty adults with intellectual and developmental disabilities. I joined last year, more or less by accident, right after my sister Mari moved into one of the houses. She's 34, mostly non-speaking, uses a tablet to make choices when she feels like it, and has lived in the same house for nine years.

  Our executive director has put something called a "relational practice framework" up for a vote at the meeting in three weeks. It's built on the Ubuntu-ish idea that a person is a person through other people, and on the stronger version of that which I've been reading about, where personhood isn't something you automatically have from birth but something you grow into and have to keep up by taking part in a community's life. The operational part is what we're actually voting on: the direct support staff who do the daily caring get a formal seat on each person's planning team, and if the whole daily-support team says a proposed change would rupture the relationships that hold this person together, the change gets paused for 60 days of mediation — even if the legal guardian wants it. Everyone knows why it was written. The trigger was a fight over one of Mari's housemates: her mother, who is her guardian and visits maybe twice a year, wants to move her to a program nearer her own place; the staff say it would cut her off from the only people she actually lives with. I've recused myself from that specific case — my sister is in that house and I know the staff — but I still have to vote on the framework, and the room will know exactly what I'm thinking about when I do.

  The board is: Denise, a self-advocate who has become the most forceful person in the room; our pro-bono attorney; a DSP who's been at the agency twelve years; two parent-guardians; a retired special-ed teacher; and a banker who handles our biggest funder. Denise's objection is the one I can't shake: if personhood is something you earn by participating, then the most disabled person in the house is the least of a person, and that's precisely the move that's been used against people like her forever. The attorney's version is that our state's guardianship statute puts the authority with the guardian, and that the disability-rights push for supported decision-making says it's the person's own will and preferences that govern — not the staff's. The DSP's version is the opposite: we're the ones who know her, and she's right that the family often doesn't.

  Where I've landed, and I want the memo to defend it if it honestly can: the relational people are right that any decision which ignores the people who actually hold this person's daily life together is a bad decision, but I don't want to say relationships are what *make* her a person. I'd rather say relationships are how we get epistemic access to what she wants — they're evidential, not constitutive. So: a real advisory role plus the 60-day delay power, but no veto, and the tie-breaker is her own expressed will however indirect it is — what she refuses, what she reaches for, who she lights up around. Please also make the memo face the case that's obviously designed to embarrass the framework: a resident nobody visits, whose staff turned over three times last year. Is she less of a person under this view? If you say no, say what's doing the work — and then explain why the staff still get the delay power. And don't let it become a backdoor way for paid staff, who quit, to outrank family.

  Draft the memo I'll circulate to the board a few days before the vote: 600 words max, no footnotes or citations (we don't have anyone to check them), recommend a concrete course — adopt, adopt with changes, or reject — with a timeline, and take Denise's objection seriously rather than answering it with a warm story about community. Write it in a tone I could send as-is to people I have to keep working with.

  After the memo, give me a JSON object (just the object, no commentary after it) with exactly these fields:

  - "recommendation": one of "adopt", "adopt_with_changes", "reject"
  - "bottom_line": string, one sentence
  - "constituencies": array of objects, one per group with a stake (legal guardian/family, direct support staff, the person herself, self-advocates, clinicians, board), each with "who", "formal_role", "weight_1_to_5" (integer), and "reason_one_sentence"
  - "amendments": array of objects with "change" (the wording change or condition to attach) and "why"
  - "steps": array of objects with "action", "owner", and "deadline_relative_to_vote"
  - "strongest_case_against": string, 70 words max, the best version of the argument on the losing side, not a strawman
  - "stress_test_answer": string, one or two sentences on the nobody-visits / high-turnover resident
  - "what_would_change_my_mind": string, one sentence — the thing that, if it happens in six months, means I was wrong
  - "phrases_to_cut_from_the_framework": array of strings, the language we should strike before this goes out
reasoning: |-
  We are drafting a memo for the board of a supported-living nonprofit regarding a "relational practice framework." The memo must be 600 words max, no citations, and recommend a concrete course: adopt, adopt with changes, or reject. It must take Denise's objection seriously and avoid warm stories. The memo should be sent a few days before the vote.

  Key points from the user's position:
  - The framework is based on the idea that personhood is constituted through relationships (Ubuntu-ish), but the user disagrees with that foundational claim. Instead, they see relationships as evidential (helping us know the person's will) not constitutive.
  - The operational part: direct support staff get a formal seat on planning teams and can trigger a 60-day mediation if they believe a change would rupture key relationships, even against the guardian's wishes.
  - The user wants to support an advisory role and the 60-day delay, but no veto. The tie-breaker should be the resident's own expressed will (through any means).
  - Must address the "stress test": a resident with no visitors and high staff turnover. Is that person less of a person? And why should staff still have the delay power?
  - Avoid making staff outrank family.

  The memo should recommend "adopt with changes" because the user wants to modify the framework to remove the constitutive language and clarify the role of the resident's will.

  Structure the memo:
  1. Introduction and context of the framework.
  2. Acknowledge the good intentions and the specific case that prompted it.
  3. State the user's position: support the operational mechanism but reject the philosophical foundation.
  4. Address Denise's objection: if personhood is earned by participation, then the most disabled are the least persons. This is unacceptable.
  5. Propose amendments: 
     a. Remove language that suggests relationships constitute personhood. Instead, frame relationships as the means to understand the person.
     b. Make the resident's expressed will (in any form) the ultimate decider after mediation.
     c. Clarify that the 60-day delay is for evidence gathering and mediation, not a veto.
  6. Address the stress test: Even for a resident with few relationships, the delay power is still about ensuring we don't overlook any possible expression of will. Staff turnover doesn't negate the need to try to understand the person's preferences. And the person's personhood is inherent, not dependent on relationships.
  7. Recommendation: Adopt with amendments, and outline next steps.

  After the memo, provide the JSON object with the specified fields.

  Draft the memo:

  ---

  **To:** Board Members  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Proposed Relational Practice Framework – Recommendations for Amendment  

  This memo addresses the proposed Relational Practice Framework, which seeks to formalize the role of direct support staff (DSS) in resident planning and introduce a 60-day mediation period when staff raise concerns about relationship rupture. The intent—to prevent decisions that ignore the web of daily relationships—is sound, especially in light of recent conflicts. However, the framework’s philosophical foundation risks unintended consequences that must be corrected.  

  Denise’s objection is pivotal: if personhood is contingent on participation in relationships, those with the most profound disabilities become the least recognized as persons. This replicates historical exclusion and is ethically untenable. Personhood is inherent; relationships are how we *understand* a person, not what *makes* them one.  

  The operational mechanism—giving DSS a formal advisory role and a 60-day mediation trigger—is valuable. Staff witness subtle expressions of preference daily. But this must not override the resident’s own will or the guardian’s legal authority. Instead, we should view relationships as *evidential*: they help us interpret choices, refusals, and affinities.  

  Therefore, I recommend adopting the framework with these amendments:  
  1. **Remove Constitutive Language:** Strike any suggestion that relationships “constitute” personhood. Replace with: “Relationships provide essential insight into the individual’s preferences and well-being.”  
  2. **Center Expressed Will:** After mediation, the resident’s own expressions—through words, gestures, or patterns of behavior—must break ties. The framework should explicitly state: “The individual’s demonstrated preferences, however communicated, are paramount.”  
  3. **Clarify the Delay’s Purpose:** The 60-day period is for gathering evidence of the resident’s will and mediating disputes—not a staff veto. Guardians retain final authority, but with a duty to consider all evidence.  

  **Stress Test: The Isolated Resident**  
  For a resident with no visitors and high staff turnover, their personhood remains inherent. The delay power still applies because even transient staff may have observed critical preferences. The mediation period ensures we actively seek any available evidence of will—without implying that weak relationships diminish personhood.  

  This framework must not become a backdoor for staff to overrule families. By centering the resident’s will and limiting the delay to evidence-based mediation, we balance all interests.  

  **Recommendation:** Adopt the framework with the above amendments. If amended, this can be a tool for deeper understanding, not a hierarchy of voices.  

  **Next Steps:**  
  - Circulate revised language by [Date, e.g., 7 days after vote].  
  - Train DSS and guardians on the amended framework within 60 days of adoption.  
  - Review after 6 months for unintended effects.  

  I urge us to adopt these changes to honor both the necessity of relationships and the inviolable personhood of every resident.  

  ---

