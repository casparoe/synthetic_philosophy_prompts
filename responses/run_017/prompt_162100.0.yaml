prompt: |-
  You are a philosopher of physics who specializes in the foundations of quantum mechanics and who is used to explaining fine distinctions to intelligent non-specialists. Please think carefully: before you settle on an answer, brainstorm the candidate concepts, discard the ones that don't fit, and tell me in a line or two what you discarded and why. A careful carve-up matters more to me than a quick label, and please don't send me to papers or author names — I want the distinctions themselves, not a reading list.

  I'm a software engineer with no physics beyond a first-year course, and I read about Bell's theorem on weekends for fun. I keep running into a pattern in what I read that I can't name, and it isn't quite the pattern I expected it to be.

  First case. Someone describes a theory in which the particles leave the source carrying a full set of instructions for every detector setting they might meet, so that the instructions settle in advance what each detector will flash. The objection comes: Bell showed that no local theory of that kind can match the quantum predictions. The reply: but I can't use it to send you a message — whatever I do at my end, the pattern of flashes at your end looks exactly the same. And the answer: that's beside the point, your theory is still nonlocal, because what flashes at my end has to depend on which setting you chose.

  Second case, reversed. Someone says that Bell's result shows nature is nonlocal, that there's a real dependence running from one wing of the experiment to the other. The challenge: a dependence you could signal with? No, you just conceded that no signalling is possible. The answer: it's a real dependence all the same, just one that can't be harnessed to send a message.

  So "local" seems to be doing at least two jobs: "nothing I do here changes what you can observe there," and "nothing that happens here depends on what you choose there." The third thing I noticed is what puzzles me most. When the dependence is instead between the instructions produced at the source and the experimenters' later choice of setting, writers don't call the theory nonlocal; they call it a conspiracy, or say the experimenters weren't really free. Yet the source and the detectors are all spatially separated, and it's the same kind of statistical dependence between distant things. That makes me wonder whether "nonlocal" is tracking spatial separation at all, or rather which pair of items the dependence holds between.

  Is there an established concept for the sliding between the first two senses — and is it plain equivocation, or something more specific that the field has noticed and named? What are the established names for the separate notions, including the third one, and which of them is the thing Bell's result actually forces you to give up? If nothing established fits, coin a term, define it, and give me the boundary cases: what would look like this phenomenon but not be it?
reasoning: |-
  Okay, let's tackle this. The user is a software engineer with some physics background, interested in Bell's theorem. They've noticed a pattern in how "local" is used in different contexts and are confused about the distinctions. 

  First, they mention three cases. The first involves a theory with pre-set instructions where objections point to nonlocality because the outcome depends on the distant setting. The second case is the reverse: nonlocality is claimed even without signaling. The third is about dependence between the source and settings, which gets called "conspiracy" instead of nonlocality. 

  The user's core question is about the sliding meanings of "nonlocal" and whether there's a term for that. They also want clarity on what Bell's theorem actually forces us to give up. 

  Hmm. I need to carefully distinguish the concepts here. Let's brainstorm the key ideas: locality, no-signaling, statistical independence, and freedom of choice. 

  Locality in Bell's sense means no instantaneous causal influence between spacelike separated events. But Bell's theorem specifically targets factorizability: the joint probability factoring into local probabilities. That's the key thing violated by quantum mechanics. 

  No-signaling is different. It's about the inability to send information faster than light, upheld in QM. But no-signaling doesn't imply locality, as shown by Bohmian mechanics. 

  Then there's statistical dependence between settings and hidden variables—that's the "freedom of choice" or "no-conspiracy" assumption. It's about initial conditions, not locality per se. 

  The user's confusion makes sense. Writers sometimes conflate these, but they're distinct. When they call the setting-source dependence a "conspiracy," it's because it violates the assumption that settings are free variables, not because it's nonlocal in the causal sense. 

  So the established terms are:
  - **Bell-Locality** (factorizability)
  - **No-Signaling** (no faster-than-light communication)
  - **Statistical Independence** (freedom of choice)

  Bell's theorem forces giving up Bell-Locality. The other two are additional assumptions. The sliding between locality and no-signaling is common but a conflation. 

  I should emphasize that spatial separation is key for locality, but the dependence type matters too. The source-settings dependence isn't nonlocal because it's not between spacelike events; it's a global constraint. 

  Need to make sure the explanation is clear without jargon. Use analogies like the dice in sealed boxes for factorizability. Highlight that Bell-Locality is the core casualty. 

  Also, address why the third case isn't called nonlocal: because the dependence isn't causal between detectors but correlational via a common cause (the source) with constraints on settings. 

  Finally, confirm that the field recognizes these distinctions, even if sometimes blurred in popular texts. No need for new terms; the existing ones suffice if precisely defined.
answer: |-
  You've identified a crucial and subtle pattern in the foundations of quantum mechanics. The distinctions you're observing are indeed central, and while the terminology can sometimes be inconsistently applied, the underlying concepts are well-demarcated. Let me carve this up carefully, discarding candidate concepts that don't fit your cases.

  ### Brainstorming & Discards
  1.  **Candidate: "Causality"**  
      *Discard:* Too broad. Bell-locality involves causal independence, but "causality" includes signaling, temporal order, and more. Your cases focus on *specific types* of dependence.
  2.  **Candidate: "Relativistic Invariance"**  
      *Discard:* While related, this is a global property of theories. Your cases are about *specific dependencies* between events (settings↔outcomes, source↔settings).
  3.  **Candidate: "Determinism"**  
      *Discard:* Bell applies to stochastic theories too. Your cases involve dependence structures, not determinism per se.
  4.  **Candidate: "Realism"**  
      *Discard:* While "local realism" is often contrasted with QM, your cases show locality can fail *without* realism (e.g., instructions are "real," but dependence on distant settings breaks locality).

  ### The Established Concepts & Your Cases
  1.  **Bell-Locality (Factorizability):**  
      *Definition:* The joint probability of outcomes (A,B) given settings (a,b) and hidden variables (λ) factorizes:  
      *P(A,B | a,b,λ) = P(A | a,λ) × P(B | b,λ)*.  
      *What it means:* Outcomes depend *only* on their *local* setting and λ—**not** on the *distant* setting.  
      *In your 1st case:* The "full instructions" theory violates Bell-Locality because *P(A | a,b,λ) ≠ P(A | a,λ)*—the outcome at A depends on the distant setting *b*. This is what Bell’s theorem forces you to give up.  
      *Boundary case:* Bohmian mechanics violates Bell-Locality but satisfies No-Signalling.

  2.  **No-Signalling (or "Parameter Independence"):**  
      *Definition:* The marginal probability of an outcome at one wing is independent of the *setting* at the other wing:  
      *P(A | a,b) = P(A | a)* (and similarly for B).  
      *What it means:* You **cannot** change the statistics of what I observe by *your choice of setting*.  
      *In your 1st & 2nd cases:* The "you can't send a message" point. Quantum mechanics obeys No-Signalling, preserving relativistic causality.  
      *Boundary case:* A theory violating No-Signalling would allow FTL communication (e.g., if setting *b* changed the *probability distribution* at A).

  3.  **Statistical Independence ("Freedom" or "No-Conspiracy"):**  
      *Definition:* The hidden variables (λ) are independent of the future settings (a,b):  
      *P(λ | a,b) = P(λ)*.  
      *What it means:* The source doesn’t "know" or "anticipate" what settings experimenters will choose.  
      *In your 3rd case:* The "conspiracy" charge. If λ depends on (a,b), the theory evades Bell’s theorem by correlating the source with future choices. This is **not** called "nonlocal" because it doesn't involve *spacelike separated events* (settings are chosen *after* λ is generated); it’s a violation of "experimental freedom."  
      *Boundary case:* Superdeterminism, where initial conditions correlate λ with (a,b).

  4.  **Outcome Independence (Often Grouped with Bell-Locality):**  
      *Definition:* The outcome at one wing is independent of the *outcome* at the other wing, given settings and λ:  
      *P(A | B,a,b,λ) = P(A | a,b,λ)*.  
      *What it means:* Even if you know the distant outcome, it doesn't help predict your own. QM violates this.

  ### The Sliding You Observed & Bell's Core Lesson
  -   **The Equivocation:** Writers sometimes conflate **Bell-Locality** with **No-Signalling**.  
      *Why it happens:* Bell-locality implies No-Signalling, but the converse is false (QM is No-Signalling but violates Bell-Locality). In your 1st case, the defender appeals to No-Signalling ("can't send a message") to deflect the Bell-Locality violation ("depends on your setting").  
      *Established term:* This is often called **"parameter dependence"** (violating Bell-Locality) vs. **"outcome dependence"** (violating Outcome Independence). The conflation arises because both can imply nonlocality, but only *parameter dependence* breaks Bell-Locality.
      
  -   **What Bell's Theorem Forces You to Give Up:**  
      **Bell-Locality (Factorizability)** is the *necessary* casualty. QM violates it. You *can* retain No-Signalling (as QM does) and Statistical Independence (as most interpretations do), but you *cannot* keep Bell-Locality and match experiment.

  ### Why Spatial Separation Matters
  "Nonlocality" **does** track spacelike separation: it refers to dependencies between events at spacelike separation (e.g., outcome A and setting b). Your 3rd case (λ ↔ settings) is *not* nonlocal because:
  - Settings (a,b) are chosen *after* λ is generated (timelike or lightlike separation).
  - It’s a correlation between a *past common cause* (initial conditions) and future choices—a *global constraint*, not *spacelike influence*.  
  *Boundary case:* If settings were chosen *before* λ and spacelike to the source, dependence would imply retrocausality, not nonlocality.

  ### Summary Table
  | Concept                 | Formal Definition                     | Violation in Your Cases          | Spatial?     | Bell’s Casualty? |
  |-------------------------|---------------------------------------|----------------------------------|--------------|------------------|
  | **Bell-Locality**       | *P(A,B\|a,b,λ) = P(A\|a,λ)P(B\|b,λ)* | 1st case: Outcome depends on distant setting | Spacelike | **Yes** (Core)  |
  | **No-Signalling**       | *P(A\|a,b) = P(A\|a)*                | Defended in 1st, challenged in 2nd | Spacelike | No (QM keeps it) |
  | **Statistical Independence** | *P(λ\|a,b) = P(λ)*          | 3rd case: "Conspiracy"           | Timelike   | No (Assumption)  |
  | **Outcome Independence**| *P(A\|B,a,b,λ) = P(A\|a,b,λ)*        | Violated by QM                   | Spacelike | Part of Locality |

  The field’s precise language exists, but popular accounts often blur Bell-Locality and No-Signalling. Your insight is correct: "nonlocality" in Bell's context specifically denotes **spacelike parameter dependence**—the inability to factorize probabilities as Bell requires. The "conspiracy" is a separate statistical (not spacelike) dependence. Bell forces nonlocality; the other constraints are choices to avoid fringe alternatives.
