answer: |-
  1. **Check Automation Source**: Detect if the message is from an automated system (e.g., bot, macro); if so, flag for human review and stop processing (record nothing). Addresses: scheduled macro approval. Flag: value call requiring human judgment.  
  2. **Verify User Authorization**: Confirm the sender's current status (e.g., active employee, valid contractor); if unauthorized (e.g., expired contract), stop and record nothing. Addresses: contractor post-contract.  
  3. **Validate Context**: Ensure the message is in a predefined correct channel/thread for the action (e.g., HR channel for resignations); if misplaced, stop and record nothing. Addresses: wrong channel resignation.  
  4. **Assess Working Hours**: If sender working hours are configured and the message occurs outside them, delay recording and notify sender for confirmation during next working window; stop processing immediately. Addresses: 3am resignation.  
  5. **Require Critical Confirmation**: For high-stakes actions (e.g., resignation, major commitment), pause recording and prompt sender for explicit confirmation (e.g., "Reply YES to confirm"); if unconfirmed, stop and record nothing. Addresses: false commitment. Flag: value call for defining "high-stakes."
