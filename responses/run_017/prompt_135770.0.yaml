answer: |-
  Here’s a draft focusing on the "greeting problem," celebrating the effort while sidestepping national character and avoiding problematic synonyms. It aims for inclusivity, warmth, and practical truth:

  **(Start with warmth and energy - project clearly!)**

  "Good evening, everyone! What an incredible sight! Look around at these amazing displays, the costumes, the buzz of excitement. Teachers, parents, carers, and most of all – our brilliant children: **thank you**. Thank you for all the hard work, creativity, and sheer enthusiasm that’s filled this hall tonight. This ‘International Evening’ already feels like a triumph of our shared effort.

  Now, why are we here? It’s not just about flags or famous landmarks. It’s about something much more fundamental. It’s about how we connect with each other in this wonderfully mixed-up world.

  Think about meeting someone new. Just saying ‘hello’ involves a tiny leap. We make little guesses. Based on a look, a name, maybe knowing where they live. We use these small starting points to begin. We couldn’t talk at all without them!

  But here’s the crucial bit. Those starting points are just that – **starting points**. They are tiny fragments, often based on things like where someone might come from. They are never the whole story. They are never the person standing in front of us.

  That’s what I call ‘the greeting problem’. We *have* to start somewhere. But we must be ready to change our minds. Immediately. The best questions aren’t the ones that confirm our first guess. The best questions are the ones that surprise us. That show us our guess was far too small.

  **Tonight is a brilliant exercise in navigating that gap.** Look at these displays! They aren’t rulebooks. They aren’t definitions of millions of people. They are invitations. They are conversation starters.

  They say: ‘Here are some things associated with this place. Some traditions. Some stories. Some ways of doing things.’ They give us a tiny foothold, a shared reference point. But the *real* magic happens when we use that foothold to meet the individual. When we talk to the person who helped make it. When we ask, ‘What does this mean to *you*?’ or ‘Tell me more about *your* family?’ or simply, ‘What’s your favourite bit?’

  For some children here, their assigned country might be a place they know deeply. For others, like [acknowledge lightly, without naming names] perhaps, it might be completely new! That’s okay. Because tonight isn’t about being an ambassador. It’s about being curious. It’s about sharing something discovered. It’s about saying, ‘This is what *we learned* about this place – what do *you* think?’

  For our parents and carers – whether you arrived last month, or your family has been here for generations – tonight honours your unique journeys. It honours the specific stories you carry. It says your background is a welcome part of our school’s tapestry. And it invites everyone to learn *with* you, not just *about* some abstract idea.

  So, let’s celebrate tonight for what it truly is. A celebration of human curiosity. A celebration of the shared effort behind every glittery volcano and every carefully practised dance step. A chance to practise that vital skill: starting with a small idea, then being genuinely open to the real person in front of us changing it completely.

  Let’s greet each other with open minds. Let’s learn, be surprised, and connect. Enjoy the dances, explore the displays, ask questions, and most importantly, talk to each other!

  Have a fantastic International Evening!"

  **Why this works for your brief:**

  1.  **Avoids National Character/Culture/Heritage as Essence:** Focuses on "things associated with," "traditions," "stories," "ways of doing things," "learned about this place." It explicitly frames displays as starting points, not definitions.
  2.  **Centres the "Greeting Problem":** Clearly explains the need for initial "guesses" or "starting points" and the *imperative* to correct them immediately based on the individual. Uses accessible language ("tiny leap," "small idea," "whole story").
  3.  **Validates Effort Without Validating Stereotype:** Praises the "hard work," "creativity," "shared effort," "curiosity," "discovery," and "invitation" aspect of the displays and performances. Thanks everyone profusely.
  4.  **Addresses Sensitivities:**
      *   **Annoyed Dad:** Explicitly mentions it's okay for the assignment to be new, framing it as "sharing something discovered" rather than representing an identity. Praises the *effort* of learning itself.
      *   **Recent Arrivals/Fourth-Generation:** Acknowledges "unique journeys" and "specific stories," honouring backgrounds without demanding performance or representation. Uses "your background" instead of "your culture."
      *   **Children as Sole Representatives:** Explicitly states "tonight isn’t about being an ambassador," relieving pressure and refocusing on curiosity and sharing learned things.
  5.  **Practical Delivery:** Short sentences. Simple vocabulary. Clear signposting ("Now, why are we here?", "So, let’s celebrate..."). Positive, warm tone. Avoids complex jargon while conveying the philosophical point.
  6.  **Positive & Unifying:** Focuses on shared human experience, curiosity, connection, and the practical skill of open-minded interaction. Ends on a high note encouraging engagement.

  **Remember to:** Speak clearly and slightly slower than usual due to the acoustics. Make eye contact around the room. Let your genuine appreciation for the effort show! Good luck!
