prompt: |-
  I sit on a small committee that signs off on delivery forecasts for internal software projects, and before we write our method into a guidance note I want one part of it checked. For every project we now produce two figures: a reference-class forecast read off the distribution of completion times for the projects we judge relevantly similar, and a bottom-up figure built from the task-level plan for this particular project. Where the two disagree we report the arithmetic mean. The reasoning in our draft note is that we have no principled basis for preferring either view, that the reference-class number is best regarded as the judgment of one more forecaster whose reliability we have no special reason to doubt, and that splitting the difference is therefore the epistemically modest thing to do rather than the arrogant one.

  The case now in front of me makes me doubt that reasoning. The reference class is tight: a median near thirty months, with nearly all comparable projects finishing between twenty-seven and thirty-three and essentially none below twenty-four. Our own plan says eighteen months, and I believe we have genuine case-specific grounds for it, since the three components that historically generate the long tail have already been built twice by this team, on schedule. The rule hands us twenty-four months, and I cannot say what that number asserts. Could you explain whether averaging is really the modest option here, or whether it is doing something we have not noticed, and, if so, how the two figures ought to be combined instead? Please argue from the case itself rather than from the literature: we have no library access, and a reading list would be of no use to us. I would also ask that you reply in continuous prose, without headings, bullet points, bold text, or tables, and in under six hundred words.
reasoning: |-
  Alright, the user is part of a committee that approves delivery forecasts for software projects. They use two methods: reference-class forecasting based on similar projects and a bottom-up estimate from the project's task-level plan. When these differ, they average the two. The user questions this approach because in a current case, the reference class is tight (median 30 months, range 27-33), but their detailed plan says 18 months. The team has already built the problematic components twice on schedule, so they have specific reasons for the shorter estimate. Averaging gives 24 months, which feels unjustified.

  First, I need to understand why averaging might not be appropriate here. The user’s concern is that the reference class includes projects where the long-tail components caused delays, but in this case, those components are already built. So the reference class might not be fully comparable. The bottom-up estimate is based on current, specific evidence. 

  Averaging treats both estimates as equally credible, but in this scenario, the bottom-up has stronger case-specific evidence. The epistemic modesty argument assumes both forecasts are equally reliable, but that might not hold when one has more relevant data. The reference class includes past projects without pre-built components, so its distribution isn't reflective of the current situation. By averaging, they're diluting the more accurate bottom-up forecast with data that doesn't apply.

  The user needs a method that weighs the estimates based on their reliability in this context. Instead of averaging, they should assess which forecast has more relevant information. Here, the bottom-up plan accounts for the completed components, making it more trustworthy. The committee might adjust the reference class to exclude the risk that’s already mitigated, but that could be complex. Alternatively, they could use the bottom-up as the primary forecast and treat the reference class as a sanity check. If the bottom-up is well-justified, it should stand. 

  The user might also worry about institutional consistency. Changing the method could set a precedent. But the current case highlights a flaw in the averaging approach when one estimate is contextually more valid. The committee should allow flexibility, using the reference class to flag anomalies but not override specific evidence without cause. 

  In essence, the problem is treating two different types of forecasts as interchangeable. The reference class is a statistical aggregate, while the bottom-up is a detailed analysis. When specific evidence counters the general trend, the latter should prevail. The committee’s epistemic modesty should involve recognizing when one method’s assumptions don’t hold, not just splitting the difference. 

  So, the advice would be to trust the bottom-up forecast in this case, given the pre-built components. The reference class serves as a check: if the bottom-up estimate were unrealistic, it might show. But here, the team’s track record supports it. The committee should revise their guidance to allow for such exceptions, perhaps by requiring justification when deviating from the average, rather than mandating it.
answer: |-
  Your case exposes a critical flaw in the arithmetic mean approach when one forecast possesses strong, case-specific evidence that demonstrably alters the context underpinning the reference class. Epistemic modesty isn't merely averaging divergent views; it requires acknowledging the weight and relevance of the evidence each view rests upon. Here, averaging 30 and 18 to get 24 isn't modest—it's epistemically incoherent.

  The reference class forecast's strength lies in its aggregate history, but its validity hinges on the projects being truly comparable. Your reference class distribution (median 30 months, range 27-33, minimum ~24) reflects projects where the "three components that historically generate the long tail" *were present and caused delays*. This historical pattern is robust, hence the tight distribution. However, your bottom-up forecast of 18 months is explicitly predicated on the fact that these *exact, high-risk components are already built*. This isn't just optimism; it's the removal of the primary historical driver of the delays captured in the reference class. The reference class, by its nature, *includes* the time and uncertainty associated with building those components. Your current project *excludes* that time and uncertainty because the work is done.

  Treating the reference class forecast as "one more forecaster" ignores this fundamental contextual shift. The reference class isn't offering an opinion on *this specific project state*; it's reporting an average of outcomes under conditions that no longer apply to the key risk factor. Averaging forces the inclusion of historical data from scenarios irrelevant to your current reality – specifically, data predicated on components *not* being pre-built. The resulting 24-month figure asserts nothing meaningful. It doesn't represent a statistical expectation for projects *without* those component risks (your reference class lacks such data), nor does it reflect your detailed plan. It's an artificial hybrid, diluting strong specific evidence with general data rendered partially obsolete by your unique circumstances.

  True epistemic modesty here requires privileging the forecast grounded in the most directly applicable evidence, while using the reference class as a crucial sanity check. Your bottom-up plan (18 months) is built on the *actual tasks remaining* and the *demonstrated capability* of this team delivering these *same components* twice before on schedule. This is high-quality, case-specific data. The reference class serves a vital role: it confirms that *if* the risky components still needed building, 18 months would be wildly optimistic. But since they don't, the reference class primarily highlights that your project now exists outside the core conditions defining its own distribution. It flags the *reason* for the discrepancy, not the need to split the difference.

  Therefore, the epistemically responsible approach is to *adopt the bottom-up forecast of 18 months*, explicitly justified by the mitigation of the historical long-tail risk. The reference class isn't dismissed; it's critically examined and its limitation for *this specific case* is acknowledged. The disparity signals that your project is an outlier *within* the old reference class precisely because a key variable has changed. Rather than averaging, your method should mandate a *justification review* when such large discrepancies occur. If the case-specific reasons for deviating from the reference pattern (like pre-built critical components) are robust and well-evidenced – as they are here – then the bottom-up forecast should stand. The reference class remains invaluable for identifying typical risks and setting baseline expectations, but it cannot trump compelling, project-specific evidence that alters the very factors defining the class. Modesty means recognizing when the general rule doesn't fit the specific facts, not blindly averaging the two. Report 18 months, document the pre-built components and team track record as the decisive factor overriding the reference class expectation, and use the large discrepancy as proof that your review process successfully identified a materially different case.
