  1. **Orwellian Reading (Memory Rewriting):**  
     - The subject initially experiences the red dot at \( t_0 \) and the click at \( t_1 \) (75 ms) as separate events. At \( t_2 \) (150 ms), the green dot is presented, and the memory of the entire sequence is retroactively rewritten to include a **single moving dot that changes color midway** (at ~75 ms).  
