prompt: |-
  I host a monthly long-form interview series for a graduate philosophy club, and the format is deliberately narrow: instead of asking guests to survey a field, I spend an hour pressing on a single, well-developed position and the specific objections it has attracted. Next month's guest is a moral philosopher — let's call her Dr. Nadia Ferrante — who defends a view she calls relevance generalism. Her starting point is that contemporary particularists are right about the holism of reasons: a feature that counts in favor of an action in one situation may be morally inert in another, and may even count against the very same kind of action in a third. But she denies that this forces us to give up moral principles. Her distinctive move is to split the notion of codifiability in two: generalism, she argues, only needs relevance to be codifiable — there can be true and genuinely general principles saying that a feature of a certain type is always morally relevant, always capable of mattering — and it does not need weight or verdict to be codifiable. On her account, what the particularism/generalism dispute is really about is whether the weight of reasons, or the overall verdict, can be captured in general terms; and principles that fix relevance without fixing weight still do real work, by disciplining attention, by marking which aspects of a situation are candidates for mattering at all, and by giving disputants a shared vocabulary in which to press and answer each other.

  I'd like you to draft eight to ten questions for this interview, each with a follow-up written against the answer she is most likely to give, and ordered so that the sequence closes off her easiest moves as it goes. Please cover at least these pressure points. First: whether exceptionless relevance claims are even coherent for someone who accepts holism — if a feature can be inert in some case, in what sense is it always relevant, and what is she saying if she distinguishes being relevant from being salient, worth attending to, or capable of mattering? Second: whether relevance without weight can guide anything — if her principles never tell an agent how much a feature counts, do they constrain deliberation or merely annotate it, and how is this different from the particularist's own "default and challenge" picture, where principles are read as claims about what happens absent other considerations? Third: the explanatory question — if two actions share every feature that her principles mark as relevant and yet differ in deontic status, what accounts for the difference, and if her answer is that there will always be some further difference, whether the holism has simply been pushed back a level rather than answered. Fourth: an objection I have not seen her address, about scale. Her apparatus seems built for an individual deliberating about a concrete situation she can take in, but we also assess institutions, laws, and policies that affect millions of people and whose particulars nobody perceives; that kind of assessment looks like it needs aggregation and rules. I want her pushed on whether professional codes of conduct, legal standards, or institutional review criteria have any normative force on her view or are merely heuristics, and on whether the same verdict about an individual case and about the policy that produced it are supposed to be reached by the same competence. Fifth: whether relevance is contingent on local circumstances — in a community where promises are rarely kept, is promise-breaking still relevant in her sense? — and if so, whether her principles turn out to be empirically conditioned and culturally parochial in a way generalists should find uncomfortable. Sixth: whether wholesale moral criticism is available without codified principles, and whether "getting the other person to see the case differently" is really distinguishable from persuasion, manipulation, or asking for deference to testimony.

  Finally, I want the last question to be the one she will least enjoy: ask her to state, as precisely as she can, what would have to be true for the particularist to be right and her own position to collapse into it, and what consideration on the particularist's side she finds hardest to answer. Don't include any biographical or "how did you get into this" questions, and don't have her restate her view for the audience — assume the listeners already know it and want to see where it breaks.
reasoning: |-
  Okay, the user hosts a philosophy interview series and needs sharp questions for Dr. Ferrante on her "relevance generalism" position. They want a focused interrogation of her theory's weak points, not an overview. 

  Hmm, the user is clearly sophisticated—they've identified six precise pressure points and want questions that sequentially box Ferrante in. The challenge is structuring this like a philosophical duel: each question must anticipate her defenses and force her into uncomfortable territory. 

  First, I need to map their six requested objections to a logical sequence. Starting with coherence (can holism and exceptionless relevance coexist?) makes sense—it's the foundation. Then moving to functionality (can relevance-without-weight actually guide action?) before hitting the explanatory gap (what explains differing verdicts when relevant features match?). 

  The scale objection is particularly juicy—Ferrante's framework seems built for individual deliberation, but what about institutional policies affecting millions? That's where her view might really crack. Cultural contingency (is relevance universal or parochial?) and moral criticism (can we condemn without codified principles?) come next. 

  Saving the "least enjoyable" question for last is perfect: forcing her to articulate her theory's failure conditions. Must avoid softball questions—the audience knows her view already. 

  For each question, the follow-up needs to predict her likeliest dodge and cut it off. Like when she distinguishes "relevant" from "salient," the follow-up should press whether this reduces to particularism. And when she claims relevance principles "discipline attention," the retort should be: isn't that just particularism with extra steps? 

  The scale objection follow-up is key. If she calls institutional rules "heuristics," we must demand whether that drains them of normative force. And if she says individual vs. policy assessments require "different competences," that sounds suspiciously like ad hoc special pleading. 

  Final question should feel like a trap: "What evidence would make you abandon your view?" Philosophers hate admitting their theory could falsify. Making her name the strongest particularist counterargument will expose her defenses' soft spots. 

  This needs the rigor of a philosophy seminar crossed with a prosecutor's closing argument. No fluff, just relentless pressure on the fractures she's trying to paper over.
answer: |-
  Here’s a sequenced interview draft targeting the core tensions in Dr. Ferrante’s position, designed to preempt easy retreats and escalate pressure. Each question forces a choice that either exposes a vulnerability or narrows her escape routes:

  1.  **Question:** You accept holism: a feature (like causing pain) that counts *for* an act in one context can count *against* it in another, or be inert. Yet you insist *relevance* is exceptionlessly codifiable: that same feature is *always* "capable of mattering." How can a feature be **both** "always capable of mattering" **and** "morally inert" in a specific case? Doesn’t inertness mean it *incapable* of mattering *in that case*?
      *   *Likely Answer:* "Inertness means it *doesn't* matter *here*, not that it *couldn't*. Relevance is about the *type* of feature having a *potential* to count, grounded in its general nature, even if silenced/trumped here."
      *   **Follow-up:** If "capable of mattering" doesn't imply it *could actually make a difference* in this specific inert case (since it’s silenced), doesn’t "relevance" collapse into a claim about the feature’s *abstract definitional properties* ("pain is a harm"), not its actual *moral potency* in the world? How is this different from the particularist saying features have *no intrinsic moral valence*, only context-dependent significance?

  2.  **Question:** Suppose your principle says "Breaking promises is always relevant." An agent knows they broke a promise. How does this principle **guide** their deliberation beyond noting a fact they already perceive? If it doesn’t specify *how much* it counts (or if it counts at all *here*), isn’t its role merely *descriptive annotation*, not a *normative constraint*?
      *   *Likely Answer:* "It disciplines attention! It marks promise-breaking as *requiring consideration*, ensuring it isn't overlooked. It sets the agenda for deliberation, forcing the agent to ask *why* it might not count here."
      *   **Follow-up:** But doesn't the particularist's "default and challenge" model do *exactly* this? They agree we *typically* assume promise-breaking counts against, absent reasons to think otherwise – a defeasible presumption, not an exceptionless relevance claim. If your principle just says "Consider this feature," how is it *structurally different* from their defeasible presumption? Is the difference merely terminological?

  3.  **Question:** Take two actions, A and B. They share *every* feature your relevance principles mark as potentially mattering (e.g., both involve breaking a promise, causing some pain, etc.). Yet, due to holistic context, A is wrong and B is permissible. **What explains the moral difference** between A and B?
      *   *Likely Answer:* "There *must* be some further difference in the situations – perhaps a subtle relational property, the specific history, or the presence/absence of another feature my principles *also* mark as relevant, even if initially overlooked."
      *   **Follow-up:** But doesn't holism mean that *any* feature, including ones you might not have codified as "relevantly capable of mattering," *can* affect the moral status? If the explanation requires invoking features *outside* your codified set of "always relevant" types, doesn't this show that *the real explanatory work is done at the level of the entire context*, pushing the holism you accept down to the level of *which specific combinations trigger relevance*, undermining the idea that relevance itself is codifiable independently?

  4.  **Question:** Let's shift scale. Your apparatus seems designed for individual agents deliberating about concrete situations they can survey. But we constantly assess **institutions, laws, and policies** affecting millions, where no one perceives all particulars. Doesn't this *require* aggregative rules, fixed weights, and codified verdicts (e.g., "speed limits," "IRB protocols," "due process")? Do such rules have **genuine normative force** on your view, or are they merely heuristics?
      *   *Likely Answer:* "They are essential practical tools! At the institutional level, we *need* stable, general rules to coordinate action, ensure fairness, and manage complexity. They derive normative force indirectly, from the need to serve the relevant values (justice, welfare) in complex contexts where holistic perception is impossible."
      *   **Follow-up:** Does this mean the *same* competence (holistic perception of reasons) cannot judge both the individual case *and* the policy? If the policy rule ("Always disclose risks") yields the *wrong* verdict in a rare holistic individual case, is the rule *incorrect*? If not, haven't you conceded that verdict codification *is* necessary and possible at the institutional level, fundamentally different from your account of individual relevance? Doesn't this suggest relevance generalism is insufficient for large-scale normativity?

  5.  **Question:** Consider cultural variation. In a community where promises are rarely kept and carry little social weight, is "promise-breaking" **still morally relevant** in your sense? Is the *potential to matter* inherent to the feature-type, or contingent on local practices?
      *   *Likely Answer:* "The *core normative significance* of undertaking a commitment (promise) is inherent. However, the *specific form* promising takes and the *degree* to which it generates reasons might depend on social practices. But the *type* 'breaking a commitment one has freely undertaken' remains relevant."
      *   **Follow-up:** If the *degree* and even *direction* (could it sometimes count *for* breaking?) of its reason-giving force depend heavily on social context, doesn't this make your "always relevant" claim empirically conditioned and culturally parochial? Isn't the particularist better placed here, saying the feature's significance *is entirely constituted* by the context, including social practices?

  6.  **Question:** Without codified principles fixing weight or verdict, how is **wholesale moral criticism** possible? If I condemn slavery not case-by-case but *as an institution*, what do I appeal to beyond pointing to features I claim are relevant (suffering, degradation) and insisting they *always* outweigh any countervailing reasons? How is this different from mere persuasion or demanding deference?
      *   *Likely Answer:* "We appeal to the *overpowering* negative reasons generated by those relevant features in *virtually all* instances. We argue that the context of institutional slavery *systematically* activates and amplifies these reasons to an overwhelming degree, making case-by-case holistic assessment unnecessary for condemnation."
      *   **Follow-up:** Doesn't "overpowering in virtually all instances" rely on a *de facto* aggregation and weighting – precisely what you deny can be codified? And if a defender of slavery pointed to a hypothetical or rare case where it seemed beneficial, wouldn't your holistic commitment force you to admit it *might* be permissible *there*, undermining the wholesale condemnation? Does relevance generalism actually prevent true moral absolutes?

  7.  **Question:** You distinguish relevance from salience. A feature can be relevant (capable of mattering) but not salient (not worth attending to *here*). Who decides salience? If salience is determined holistically by the context, doesn't the **practical work of deliberation** – deciding *what to focus on* – still rest entirely on the particularist's holistic competence, rendering your relevance principles inert pragmatically?
      *   *Likely Answer:* "Relevance principles *frame* salience. They provide the background understanding of *what kinds* of things *could* be salient. They give structure to deliberation, preventing irrelevant features from cluttering consideration and highlighting the domain where salience judgments operate."
      *   **Follow-up:** But if the *actual* salience and *actual* weight are determined holistically, and the relevance principle only lists possible candidates (which the particularist also acknowledges, as 'consideration primitives'), isn't the principle just a *catalogue* with no *directive force*? How does knowing "promise-breaking is a candidate" help me decide if I should focus on it *now* versus the economic consequences, other than via holistic judgment?

  8.  **The Closing Pressure Point:**
      **Question:** Dr. Ferrante, to crystallize the debate: **What would have to be true about the world or morality for the particularist to be completely right, and for your relevance generalism to collapse into their position?** Put differently, what specific claim do you make that the particularist *must* deny, and what consideration from *their* side do you find the hardest to fully answer?

  This sequence progresses from the foundational coherence of her core claim (Q1), through its practical utility (Q2), explanatory power (Q3), applicability beyond individual agency (Q4, a major pressure point), universality (Q5), critical force (Q6), and practical bite (Q7), culminating in forcing her to define the battlefield and confront her strongest opponent (Q8). Each follow-up anticipates common generalist retreats and tries to collapse them back into particularism or expose internal tensions.
