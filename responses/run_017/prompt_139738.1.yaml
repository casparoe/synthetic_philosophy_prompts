  ### Move-by-Move Analysis  
  | Move | Speaker | Verdict | What Turns on It | Answers Previous? |  
  |------|---------|---------|-----------------|-------------------|  
  | 1 | Theo | **Largely right** | Establishes heredity as unique to state sovereignty. Turns on whether admission is a transaction vs. intergenerational transfer of power. | — |  
  | 2 | Nadia | **Clearly right** | Exposes heredity alone can't justify exclusion, as birthright citizenship lacks consent. Tests if Theo's concern is heredity or underlying sovereignty norms. | Yes: Refutes irreversibility as sufficient. |  
  | 3 | Theo | **Largely wrong** | Distinguishes birth (non-decision) from immigration (deliberate act). Frames state as fiduciary. Avoids Nadia’s test of deferred membership. | Partially: Answers birth analogy but evades deferred membership challenge. |  
  | 4 | Nadia | **Largely right** | Highlights Theo’s shift to substantive sovereignty norms. Notes coercion in exclusion. Turns on whether fiduciary duty justifies harm. | Yes: Exposes Theo’s evasion and introduces coercion. |  
  | 5 | Theo | **Largely wrong** | Equates all rights as coercive. Misses Nadia’s point about *unjust initial holdings*. Turns coercion into symmetry. | No: Changes subject to universal coercion, ignoring historical context. |  
  | 6 | Nadia | **Largely right** | Ties exclusion to tainted historical acquisition. Argues rights weaken if assets were unjustly gained. Turns on historical rectification. | Yes: Answers coercion by contextualizing it. |  
  | 7 | Theo | **Clearly wrong** | Conflates repair (monetary) with restitution (admission). Misrepresents Nadia’s claim as prioritizing colonial grievances over need. | Partially: Engages repair but distorts ranking (Nadia never equated claim strength with need). |  
  | 8 | Nadia | **Clearly right** | Distinguishes repair (cash) from restitution (admission) for non-fungible assets. Separates rights from needs. Turns on incommensurability. | Yes: Counters both repair objection and ranking distortion. |  

  ### What Both Are Missing  
  **1. Distinction:** Neither separates *sovereignty over territory* from *sovereignty over membership*. Theo conflates them; Nadia’s historical argument targets territorial acquisition but doesn’t address whether membership sovereignty is derivative or inherent.  
  **2. Option:** A **stakeholder model** of membership (e.g., residency-based suffrage without full citizenship) was hinted at but unexplored. This could reconcile heredity concerns with non-exclusion.  
  **3. Shared Premise:** Both assume the state is a *fixed, bounded entity*. This ignores dynamic sovereignty (e.g., evolving constitutions) and transnational obligations (e.g., climate refugees).  
  **4. Next Join Point:** They must resolve **intergenerational responsibility**. Theo’s "fourth generation" claim clashes with Nadia’s historical redress: Can descendants inherit both sovereignty *and* debts?  

  ### Bottom Line  
  **Nadia is more right overall.** She:  
  - Exposes inconsistencies in Theo’s heredity framework (Moves 2, 4).  
  - Successfully ties exclusion to historical injustice (Move 6), which Theo’s repair counter fails to refute (Move 7).  
  - Defends her limited open-borders conclusion robustly (Move 8), separating rights from needs and justifying non-monetary restitution.  
  Theo’s strongest point (Move 3’s fiduciary duty) is undermined by his evasion of deferred membership and his later conflation of coercion with justification. Nadia’s arguments force the debate toward historical and moral context, where Theo’s abstract sovereignty claims falter.  

  \answer{Nadia wins overall}
