    - Risk: PB-CB disagreements where CB rejects and PB accepts would be rare, but failing then might block good measures.  

  **Verdict**:  
  - The compromise **resolves the procedural fight but relocates the disagreement** to the interpretation of gridlock.  
  - It converts a "which rule?" debate into a "when is failure justified?" debate.  
  - Both camps can sign if they value caution over decisiveness, but it papers over the normative divide.  

  ---

  ### Section 6: Verbal Disagreements  
  To prevent deadlock, both camps agree the following disputes are **verbal** (resolvable by clarifying terms):  
  - "Reasons" vs. "rationalizations": Boils down to whether premises are *explanatory* (PB) or *justificatory* (CB).  
  - "Majority will": Means "majority on premises" (PB) or "majority on verdict" (CB).  
  - **Non-verbal core**: Whether the assembly’s authority derives from its *reasoning* (PB) or its *mandate to decide* (CB).  

  ---  
  *This document, drafted in good faith, reflects areas of agreement and principled disagreement. It provides a basis for a final rule choice by the working group.*
