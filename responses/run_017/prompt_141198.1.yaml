       - Voter 3: Rejects P, supports Q → Reject (¬R).  
       - PB Outcome: Majority supports P (2–1), majority supports Q (2–1) → Doctrine (R iff P ∧ ¬Q) yields ¬R (reject).  
       - CB Outcome: Majority rejects R (2–1) → Reject.  
     - This divergence is inherent to logical aggregation. It arises from the tension between *collective consistency* (PB) and *majority sovereignty on the verdict* (CB). Neither outcome is "illogical"; they reflect different priorities.  

  2. **Impossibility Results Define the Playing Field**:  
     - Arrow-like theorems confirm that no aggregation rule can simultaneously satisfy:  
       - Universal domain (any input judgments),  
       - Collective rationality (consistent outputs),  
       - Anonymity (equal voter weight),  
       - Independence (proposition-wise aggregation).  
     - Trade-offs are unavoidable. PB prioritizes collective consistency but risks "losing the majority on the verdict." CB prioritizes majority rule on the verdict but risks inconsistent reasoning (e.g., adopting a measure while endorsing premises that forbid it).  

  3. **The Doctrine is Central and Fixed**:  
     - The assembly must apply the standing doctrine (adopt iff P ∧ ¬Q) mechanically. Rewriting it to use Q* ("unjust costs") instead of Q ("disproportionate costs") is a substantive policy change, not an aggregation issue. Aggregation rules process the doctrine as given.  

  4. **Partial Deferral is a Non-Negotiable Constraint**:  
     - 33% of members abstain on P (deferring to the technical panel) but vote on Q and R. This means:  
       - P is decided by ~67% of the assembly.  
       - Q and R are decided by ~100% of the assembly.  
     - All aggregation rules must accommodate this asymmetry.  

  5. **Precedent Effects are Inevitable**:  
     - Early decisions will shape later ones. Both camps agree the rule must be robust across a two-year horizon, regardless of proposal content.  

  6. **The Core Disagreement is Normative, Not Technical**:  
     - PB and CB are both coherent mathematically. The debate centers on what the assembly’s *purpose* is:  
       - If the goal is "city-stand-behind-able reasons," PB is superior.  
       - If the goal is "respecting the majority on the bottom line," CB is superior.  

