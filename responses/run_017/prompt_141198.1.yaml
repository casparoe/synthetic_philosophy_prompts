  Both camps agree on the following claims, which form the basis for productive deliberation:  

  1. **The Discursive Dilemma Illustrates a Trade-off, Not a Flaw**:  
     - The classic three-person example (adapted to our doctrine) demonstrates why premise-based (PB) and conclusion-based (CB) aggregation can diverge:  
       - Voter 1: Supports P (emissions cut), rejects Q (disproportionate costs) → Adopt (R).  
