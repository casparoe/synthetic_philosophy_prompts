prompt: |-
  I'm teaching a grad seminar on Wittgenstein's On Certainty this term, and somewhere around week four I noticed that I have a big pile of gut verdicts about which propositions are hinges and which are just ordinary empirical claims, and that I cannot get them into any order. So here is my list. I'd rather you tell me what principle (if any) I am fumbling toward than tell me what Wittgenstein thought, and please don't hand me a reading list or a stack of citations — I've got the syllabus, I want the principle.

  That I have two hands: I don't want to call it knowledge, and doubt of it strikes me as empty rather than as wrong — hinge, as far as I'm concerned. That the earth existed for a very long time before I was born: same verdict, hinge. That I have a brain: I've never had a scan, my evidence is the same textbook testimony any first-year has, and still I'd refuse to call it an open question — hinge, or so it feels. That I have never been to the Moon: hinge-like for me, though plainly it wasn't one for the Apollo crews, and I'm not sure that's just a quirk of who is speaking. That this thing in front of me is a table: plainly empirical, I could be looking at a very good stage prop or at a headset feed — except that doubting it out loud in a seminar room feels like exactly the idle doubt I called empty two sentences ago, so I seem to be running two standards and I can't say which is the real one. That I was born in Dayton, Ohio: I've never seen a certificate, my mother told me, it could easily be false, and yet being corrected about it would unsettle me far more than being corrected about the table — verdict: feels like bedrock, and I think it isn't, which is the pair I keep going back and forth on. That water is H2O: learned from testimony, never verified by me, functions as bedrock for the chemists I know, and my verdict is that it's an empirical a posteriori identity and not a hinge, even though it looks structurally identical to the earth-is-old case. That 2+2=4: not a hinge, and whatever goes wrong when someone doubts it goes wrong differently from what goes wrong when someone doubts my having hands. That the Holocaust happened: an empirical historical claim I know on testimony, and a denier is denying something I know, not stepping outside the frame — except that I notice I reach for the word madness about such a person, which is the same word I use for the person who doubts his hands, and that worries me. That my students have minds: I don't think this is a hinge or a knowledge-claim at all; my relation to them isn't a bit of inferred theory.

  So: can you state a principle — or two, if there's a genuine fork and they come apart somewhere — that captures as many of these as possible, saying what makes a proposition a hinge, wether hinges are personal or communal, and wether they can be true, false, or known; and then tell me plainly which of my verdicts it can't accommodate and would force me to drop? I'd also like it run on two cases I haven't put on the list, because I suspect that's where it breaks. First: a woman of seventy-two who was raised by a man she believed was her father, who finds out through a genetic test that he wasn't, and whose world-picture doesn't otherwise move — for seventy years that proposition was as close to bedrock as anything in her life, and then it was quietly overturned. Second: an anthropologist who spends years in a village where everyone treats dreams as carrying news of distant deaths and who never acquires that hinge herself, while a boy from the same village goes to medical school in the capital and loses it. Please write it up in plain American English, no seminar-speak.
reasoning: |-
  Okay, the user is teaching a grad seminar on Wittgenstein's On Certainty and has hit a snag around week four. They've got this pile of gut verdicts about what counts as a hinge proposition versus ordinary empirical claims, and they can't find a consistent principle. They want me to extract a principle from their examples, not give Wittgenstein exegesis or citations. 

  First, I need to really listen to their frustration. They're knee-deep in hinge chaos and want order, not more academic noise. Their examples show they're wrestling with how personal vs. communal hinges are, whether hinges can be false, and why some testimony-based beliefs feel like bedrock while others don't. That "two standards" confession about the table doubt is key—they're aware of their own inconsistency.

  Looking at their list, patterns emerge: hinges seem tied to what's *unthinkable to doubt in practice* for a person or community, not about proof. But exceptions jump out—like the Holocaust denial making them reach for "madness" just like hand-doubters, even though they insist it's empirical. That cognitive dissonance is the core of their struggle. 

  The two test cases are brilliant stress tests: the paternity revelation shows hinges can be false, and the anthropologist/dreams case highlights how hinges are relative to forms of life. Both torpedo any hope of universal or infallible hinges. 

  So the principle must be: hinges aren't about truth or justification but about *what doubt would wreck your world*. "I have two hands" isn't known—it's the frame for knowing. But this gets messy with communal differences (Apollo crew vs. me about the moon) and testimony (water as H2O feels empirical despite being bedrock for chemists). 

  Their verdicts mostly fit except water=H2O and 2+2=4. For water, they're privileging their personal stance over the chemist's form of life—a tension I should flag. For 2+2=4, they're right it's not hinge-like: mathematical doubt changes the game rules, not the world-picture. 

  I'll avoid jargon. Plain English, no "language-games" or "Lebensform." Stress that hinges are dynamic, personal yet social, and can be wrong. Their discomfort with the Holocaust case is telling—it exposes how moral certainties masquerade as hinges. That's not a bug but a feature: when doubt feels immoral, not just irrational, we're at the hinge zone. 

  Final note to self: They're a seasoned teacher. No condescension. Acknowledge their insight about "idle doubt" in the seminar room—that's the hinge intuition right there.
answer: |-
  You're wrestling with the core tension in *On Certainty*: hinges aren't defined by logic or evidence, but by their **functional role in holding a world-picture together**. Your gut verdicts reveal a consistent, practical principle, even where they feel messy. Here’s the principle distilled, tested against your cases:

  ### The Principle: The Scaffolding Test
  A proposition is a **hinge** for a person or community **if doubting it would force a collapse of the practical framework needed to investigate, reason, or live meaningfully within their current form of life.** Hinges are:
  1.  **Functional:** Their job is to be immovable so other things *can* move (questioning, testing, acting).
  2.  **Personal/Communal:** They're anchored in the shared practices ("forms of life") of a group or the bedrock commitments of an individual enmeshed in those practices. They can differ between people/groups.
  3.  **Beyond "Truth" & "Knowledge":** We don't *know* hinges like facts; we *rely* on them like gravity. They can be true, false, or unknown. Their status comes from their job, not their accuracy.
  4.  **Exposed by Doubt:** Real doubt about a hinge isn't intellectual play; it feels like madness, paralysis, or the breakdown of sense itself. Doubting an empirical claim just means gathering evidence.

  ### Applying the Scaffolding Test to Your Verdicts
  *   **✓ My two hands / Earth is old / I have a brain / Never been to the Moon:** Doubting these practically undermines *your* ability to investigate *anything* physical, historical, biological, or personal. Collapse risk: High. Your verdict fits.
  *   **✓ Born in Dayton:** For *you*, doubting this severs a root of your personal history/identity – it's *your* scaffolding. Correction *feels* like an existential tremor, not just new info. Your "bedrock" feeling aligns, even if it *could* be false.
  *   **✗ This is a table:** Doubting it *in the seminar room* feels idle because it *is* idle *in that context*. It's not scaffolding *for reasoning itself*; it's a target *for* reasoning. You *can* investigate it (touch, ask, test) *using* hinges (hands exist, senses inform, etc.) without collapsing. Your "two standards" show the difference: idle doubt (annoying) vs. hinge doubt (unhinging). Verdict should be: **Empirical.**
  *   **✗ Water is H2O:** For *you*, this isn't scaffolding. You *could* doubt it and still investigate chemistry using other hinges (labs exist, instruments measure, scientists report reliably *on this level*). It feels like a discovered fact. For a *chemist deeply embedded in atomic theory*, it might function more hinge-like (doubting it might paralyze their practice). Your verdict (**Empirical**) fits *your* position. The "earth is old" case feels different because doubting *that* undermines *all* historical/geological reasoning at once – it's more fundamental scaffolding.
  *   **✓ 2+2=4 is NOT a hinge:** Agreed. Doubting it doesn't collapse your practical world-picture; it changes the rules of the *game* you're playing (math). We might call it nonsensical or rule-breaking, not world-collapsing madness. Different category.
  *   **!? The Holocaust happened:** This is the tension spot. Your gut ("madness") points to its *hinge-like moral/practical* role. Denial isn't just wrong history; it attacks the scaffolding of shared historical responsibility, trust in testimony on atrocities, and perhaps *your* moral framework. It functions *quasi*-hinge-like for you *ethically*. But it *can* be investigated empirically without collapsing *all* reasoning. Principle says: **Primarily Empirical, but with strong hinge-like resonance due to its deep embedding in your moral/historical form of life.** Your discomfort is because it sits *on the boundary*.
  *   **✓ My students have minds is NOT a hinge/not knowledge:** Correct. It's not a proposition you *believe* based on evidence or hold as scaffolding. It's an **attitude embedded in the practice** of teaching/relating. Doubting it practically means ceasing to treat them as persons, not making an intellectual error.

  ### Your Test Cases: Where the Scaffolding Bends
  1.  **The Woman & Her Father:** For 70 years, "He is my father" *was* a hinge. It anchored her identity, family history, and relatedness. Doubting it was unthinkable; it wasn't "known," it was *relied upon*. The genetic test didn't falsify "knowledge"; it **shattered the hinge**. Her world-picture *did* move – the hinge was violently removed, and her framework had to painfully reconfigure around a new reality ("He wasn't, but he was my father in practice"). Shows hinges **can be false** and **personal**.
  2.  **The Anthropologist & The Boy:**
      *   **Villagers:** "Dreams carry news of distant deaths" functions as a **communal hinge**. Doubting it would collapse their framework for understanding death, connection, and reality. Investigation *proceeds* *within* this frame.
      *   **Anthropologist:** Never acquires it. For her, it remains an **empirical claim within *her* framework** (anthropology/science). She investigates *it* using *her* hinges (material causality, evidence standards). No collapse.
      *   **The Boy:** Loses it. Medical school provides a new framework (biological causality, evidence-based medicine) where the dream-hinge becomes dysfunctional. His **scaffolding shifted communities**. The old hinge wasn't refuted; it became irrelevant to his new form of life. Shows hinges are **communal**, **mutable**, and **framework-dependent**.

  ### Where the Principle Forces a Verdict Change (Based on Your List)
  1.  **"This is a table":** Should be **Empirical**. Your hesitation comes from confusing the *idle* doubt Wittgenstein criticizes (which applies to *any* claim doubted without reason in a normal context) with the *world-wrecking* doubt that defines hinges.
  2.  **"Water is H2O":** Your verdict (**Empirical**) stands *for you*. The principle highlights *why* it feels different from "earth is old": its functional role in *your* reasoning is less fundamental/scaffolding. For the chemist, it might be different.

  ### The Core Insight You're Fumbling Toward
  **Hinges aren't about the content of the proposition, but the depth of its roots in the soil of practice.** You're sensing which beliefs are load-bearing walls in the house of your thought. When pulling out a brick would make the whole house fall, it's a hinge. When pulling out a brick just means checking the brick, it's empirical. The messiness comes because the blueprints (forms of life) differ, and renovations (like DNA tests or medical school) happen. Your gut is tracking the **practical stakes of doubt**, not the epistemic status. That's the order beneath the pile.
