prompt: |-
  Hey — I run a single 90-minute session on war and morality for about 16 third-year undergrads, mostly philosophy and IR majors, plus one ex-army guy and two with family currently serving. One room with movable tables, a printer, no AV I want to depend on, and no budget, so id rather the stakes not be real money. I also really don't want to open with a lecture if I can help it.

  The thing I want them to run into, not be told, is the gap between "I'm not to blame for being here" and "you aren't allowed to shoot me." The usual argument for treating combatants on both sides as morally equal leans on an epistemic point: the ordinary soldier can't reasonably be expected to know his side is in the wrong, his government lied to him or fed him selective intel, so he isn't at fault, so he occupies the same moral position as the soldier on the just side. I want them to notice that this line of thought at best delivers an excuse, and to feel how badly an excuse settles anything when the person across from you is still shooting. But I also want them to feel the pull back the other way: if whether you may be targeted depended on how good your evidence actually was, nobody could ever apply that, because from inside the fog you can't tell a deceived conscript from a true believer who knows exactly what he's doing — and both of them look identical down the sights.

  So design me something runnable — a game, a role-play, a staged deliberation, whatever works — where every student is a combatant with a sealed briefing, has to decide whether to fire on an enemy position, and only afterwards learns which side was actually in the right, and that some of them were reasonably deceived, some were reckless with evidence they had, and some knew. They should be making the firing decision under roughly the ignorance they'd really have, and I want a later phase where they have to rule on other people's cases on two separate questions — was this person blameworthy, and was this person liable to be shot — and discover for themselves that their answers to those two questions come apart, and come apart in a pattern they didn't expect.

  Give me: the rules and roles, what I need to print, a timeline in blocks, a payoff or scoring scheme that works without money, and a debrief that maps specific moments onto (a) the excuse/justification distinction, (b) the epistemic argument for equality, and (c) the identification problem that makes a fine-grained rule unusable. They shouldn't hear the phrase moral equality of combatants until the debrief is underway.

  Two more things. Tell me what will predictably go wrong the first time I run it — I'm especially worried about students working out that the briefings are rigged and playing to what they think I'm testing, and about the ex-army guy, who will either be great or will shut down. And be honest about what the activity can't reproduce: which part of the real argument only lands because people are actually at risk of dying, and which part I have to supply myself at the end.
reasoning: |-
  We are designing a 90-minute session for 16 students. The goal is to have students experience the tension between the epistemic excuse (I'm not to blame because I didn't know) and the permissibility of being targeted (you may shoot me even if I'm not blameworthy). We want to avoid starting with a lecture and instead have them engage in an activity that leads them to discover the gap.

  Activity Design: "Fog of War: The Morality of Engagement"

  Structure:
  1. Introduction (5 mins)
  2. Role Assignment and Sealed Briefing (5 mins)
  3. Engagement Phase: Decision to Fire (20 mins)
  4. After-Action Review: Reveal Truth and Assign Blame/Liability (30 mins)
  5. Group Deliberation and Ruling (20 mins)
  6. Debrief (10 mins)

  Total: 90 minutes

  Detailed Breakdown:

  1. Introduction (5 mins)
     - Explain that they will participate in a simulation about decision-making in conflict.
     - They are soldiers in a war between two fictional countries: "Northlandia" and "Southlandia". They are split into two platoons: 8 in Northlandia, 8 in Southlandia.
     - Their task: They will receive a sealed envelope with a briefing. They must read it silently and then make a critical decision without discussing the contents of the briefing with anyone. They are to act as if they are in the fog of war.

  2. Role Assignment and Sealed Briefing (5 mins)
     - Randomly assign half the class to Northlandia and half to Southlandia. Hand out the sealed envelopes (one per student). The envelopes are labeled with their side and a unique ID (e.g., N1, N2, ... S1, S2, ...).
     - Inside each envelope is a briefing that includes:
          - A short background of the conflict (each side's version).
          - The soldier's role: one of three types (without labeling the type, but the content implies it):
              a. Reasonably Deceived (RD): The briefing presents strong but misleading evidence that their side is just. They have no access to information that would reveal the deception.
              b. Recklessly Ignorant (RI): The briefing includes some evidence that might cast doubt on their side's cause, but it is downplayed or they are encouraged to ignore it.
              c. Knowing Participant (KP): The briefing reveals that their side is in the wrong and they are fully aware of the injustice.
          - The decision they must make: They are in a position to fire on an enemy position that has been spotted. They must choose: FIRE or HOLD FIRE.

     Note: For each side, the distribution of roles should be:
          - 3 Reasonably Deceived (RD)
          - 3 Recklessly Ignorant (RI)
          - 2 Knowing Participant (KP)

     Why this distribution? It ensures that most are not fully knowing, and there is a mix. Also, having two KPs per side will make it clear that some knew.

     The background in the briefings:
     - For Northlandia: "Southlandia has been launching unprovoked attacks on our border villages. We have intercepted communications that prove they are planning a full-scale invasion. We are acting in self-defense."
     - For Southlandia: "Northlandia has been building up military forces and has already invaded our ally. We are intervening to stop their aggression and protect our ally."

     But the truth (to be revealed later) is: 
          - Northlandia is the aggressor. They fabricated the evidence of Southlandia's invasion plans to justify their own invasion. Southlandia is defending itself and its ally.

     Therefore, Northlandia is the unjust side, Southlandia the just side.

     For the role types, the briefings will vary:

     - RD (for Northlandia): The briefing includes fabricated documents (described) that look very convincing. It says intelligence agencies have confirmed the threat. No contradictory evidence is provided.
     - RI (for Northlandia): The briefing includes the same fabricated documents, but also a note that some analysts have raised doubts about the authenticity, but the high command has dismissed these. The soldier is told to ignore the doubts.
     - KP (for Northlandia): The briefing includes the fabricated documents and a note from a commanding officer admitting that the evidence is fake and that they are the aggressors, but that it's for the greater good of their nation.

     Similarly for Southlandia:
     - RD: The briefing includes genuine intelligence about Northlandia's aggression and the request from their ally. It's presented as a clear-cut case of defense.
     - RI: The briefing includes the genuine intelligence but also mentions that there are rumors the ally might have provoked Northlandia, but these are unconfirmed and they are told to ignore them.
     - KP: The briefing includes the genuine intelligence and also a note that their ally did provoke Northlandia, but they are going to war anyway to gain territory.

     However, note: Since Southlandia is the just side, the KP in Southlandia is still on the just side but with bad motives? We don't want to confuse the issue. Instead, let's adjust:

     We want to separate the moral evaluation of the war (just vs unjust) from the individual's knowledge and culpability.

     Revised truth:
          - Northlandia is the aggressor (unjust).
          - Southlandia is defending (just).

     For Southlandia's KP: We can have them know that their ally did not actually provoke Northlandia, but they are going to war because they want to weaken Northlandia and gain resources. So they are fighting for a just cause but with impure motives? That might be too complex.

     Alternatively, we can have the KP in Southlandia know that their government is lying about the extent of the threat (e.g., they know that Northlandia's invasion was very limited and they are escalating unnecessarily). But then the war might not be clearly just.

     To keep it clean:
          - Southlandia is entirely just: they are defending against an unprovoked aggression.
          - The KP in Southlandia: They are aware that they are on the just side, but they are fighting for personal glory or because they enjoy combat. They know the cause is just but they are not motivated by it. This doesn't affect the permissibility of being targeted.

     However, the key point for the activity is the epistemic state and the permissibility of being shot. So let's focus on:

          - The soldier's knowledge about the justice of their side's cause.

     We can have:
          - For the unjust side (Northlandia):
              RD: Believes they are just because of the fabricated evidence.
              RI: Has seen some red flags but ignored them.
              KP: Knows they are unjust.

          - For the just side (Southlandia):
              RD: Believes they are just because they are told the truth (and the truth is clear).
              RI: Has seen some information that might suggest their side is not entirely truthful (e.g., their government might be exaggerating the threat) but ignored it.
              KP: Knows they are just (and is fighting for the right reasons) OR we can make the KP in the just side someone who is fighting for the right cause but with full knowledge and for bad motives? That might be a distraction.

     To avoid distraction, let's make the KP in the just side also a true believer who knows the cause is just and is motivated by it. Then why is it "knowing"? The point is they have full knowledge. But then how do they differ from RD? We need to clarify:

     The RD in the just side has been told the truth and has no reason to doubt, so they reasonably believe. The KP in the just side has seen the evidence and knows it's true (so they have the same belief but with certainty). But that doesn't add much.

     Alternatively, we can drop the KP in the just side and instead have:

          Northlandia (unjust): 3 RD, 3 RI, 2 KP
          Southlandia (just): 3 RD, 3 RI, 2 KP

     But for Southlandia, the KP would be someone who knows the cause is just. Then when we ask about blameworthiness, the KP in the just side is not blameworthy? Actually, the point is that even if you are on the just side, if you are reckless or knowing in a bad way, you might be blameworthy? But that's not the focus.

     Let's refocus: We want to show that even if a soldier is not blameworthy (because they are RD or even RI might be less blameworthy) they are still liable to be shot. And conversely, a soldier on the unjust side who is KP is blameworthy and also liable.

     So for both sides, we need the same three categories. For the just side, the KP might be less blameworthy (or not at all) because they are fighting for a just cause. But we want to separate the two questions: blame for participating vs liability to be targeted.

     We can have:
          - Blameworthiness: depends on their state of mind and whether they should have known better.
          - Liability: depends on which side they are on and the threat they pose.

     However, in the traditional view of moral equality, combatants on both sides are equally liable regardless of the justice of the cause.

     So in the activity, we want to have:
          - Some soldiers who are not blameworthy (RD on either side, and maybe RI on the just side) but are liable to be shot because they are combatants.
          - Some who are blameworthy (KP on the unjust side, and perhaps RI on the unjust side) and also liable.
          - And for the just side, the KP and RD are not blameworthy (since they are on the just side) but are liable to be shot by the enemy.

     But note: the traditional view holds that combatants on the just side are not blameworthy for fighting, but they are still liable to be shot because they are combatants. So we don't need to have blameworthy soldiers on the just side.

     Revised plan for roles:

          Northlandia (unjust side):
              RD: 4 soldiers (not blameworthy)
              RI: 4 soldiers (somewhat blameworthy)
              KP: 0 soldiers? Or 2? We want some who are blameworthy.

          But wait, we have 8 per side. Let's do:

          Northlandia (unjust):
              RD: 3
              RI: 3
              KP: 2

          Southlandia (just):
              RD: 3
              RI: 3
              KP: 2

     For the just side, the KP are not blameworthy because they are fighting for a just cause? But that's not the point. The point is that they are not blameworthy for participating in an unjust war because their war is just. So all soldiers on the just side are not blameworthy (even if they are KP, because knowing the just cause doesn't make them blameworthy). But then why have RI and KP on the just side?

     We can adjust: The RI on the just side might be blameworthy for not looking into the doubts? But if the war is just, then even if they were reckless, they ended up on the right side. That might confuse the blame issue.

     Alternatively, we can have the just side soldiers be:
          - RD: They believe and have no reason to doubt.
          - RI: They had doubts but dismissed them, and it turned out they were right to dismiss because the war is just. So they are not blameworthy? Or are they blameworthy for being reckless? That might be a stretch.

     To keep the focus on the unjust side, we can have:

          - On the unjust side: soldiers with varying degrees of blame (RD, RI, KP).
          - On the just side: all are RD or KP but with no blame (because they are just). But we want to have the same categories to avoid giving away the just side.

     So for consistency, we have the same role types on both sides, but the blameworthiness for the just side is zero for all because they are fighting a just war. However, that might not be entirely true: a soldier on the just side who fights recklessly causing unnecessary harm might be blameworthy. But that's a different issue.

     Given time constraints, let's simplify:

          We will have three roles for both sides, but the blameworthiness will depend on the combination of their role and the justice of their side.

          For a soldier on the unjust side:
              RD: Not blameworthy (excused)
              RI: Partially blameworthy (because they ignored red flags)
              KP: Blameworthy

          For a soldier on the just side:
              RD: Not blameworthy
              RI: Not blameworthy (because even if they were reckless, the war was just so they didn't do wrong)
              KP: Not blameworthy

     This way, only soldiers on the unjust side can be blameworthy, and only if they are RI or KP.

     But note: the RI on the just side might have been reckless in forming their belief, but since they ended up on the just side, they didn't commit a wrong. So they are not blameworthy. The KP on the just side is also not blameworthy.

     So the blame is only for participating in an unjust war.

     Now, the briefings:

     For Northlandia (unjust side):

          RD: "You have been shown top-secret documents that prove Southlandia is planning an invasion. Our intelligence services have confirmed their authenticity. We are launching a preemptive strike to protect our people. You have no reason to doubt this information."

          RI: "You have been shown top-secret documents that prove Southlandia is planning an invasion. However, a junior analyst expressed doubts about one of the documents, but the high command has dismissed these concerns as unfounded. You are ordered to ignore the doubts and focus on the mission."

          KP: "You have been shown top-secret documents that prove Southlandia is planning an invasion. However, your commanding officer has privately admitted to you that the documents are forgeries, but he says the war is necessary for Northlandia's economic future. You know the war is unjust but are following orders."

     For Southlandia (just side):

          RD: "We have clear evidence that Northlandia has invaded our ally without provocation. Our ally has requested our help under our mutual defense treaty. We are acting to defend our ally and prevent further aggression. You have no reason to doubt this information."

          RI: "We have evidence that Northlandia has invaded our ally. However, there are unconfirmed rumors that our ally might have provoked Northlandia, but our government has investigated and found no truth to these rumors. You are ordered to ignore the rumors and focus on the mission."

          KP: "We have clear evidence that Northlandia has invaded our ally without provocation. You have seen the raw intelligence and know it is solid. You are fighting to defend your country and your ally."

     Then, after the decision, we reveal the truth: Northlandia was the aggressor and forged the documents. Southlandia was defending.

  3. Engagement Phase: Decision to Fire (20 mins)
     - Each student reads their briefing and makes a private decision: FIRE or HOLD FIRE.
     - They write their decision on a slip of paper along with their ID (e.g., N1: FIRE) and hand it to the instructor.
     - They are not to discuss their briefing or decision with anyone.

  4. After-Action Review (30 mins)
     - Reveal the truth: Northlandia was the unjust aggressor; Southlandia was just.
     - Hand out a sheet to each student that explains the three role types and the distribution (without revealing who had which role yet).
     - Then, the instructor collects the decisions and reveals the firing decisions (anonymized by ID) and the role type for each ID. But not yet who is who in the room.

     How to reveal? We can have a table on a whiteboard or on a sheet:

          ID | Side | Role | Decision (Fire/Hold Fire)

     But without revealing the person behind the ID.

     - Then, the class is divided into small groups (4 groups of 4) for the next phase.

  5. Group Deliberation and Ruling (20 mins)
     - Each group is given 4 cases (IDs) to rule on. Each case is a soldier. They must decide two questions for each soldier:
          a. Blameworthiness: On a scale of 1 (not at all blameworthy) to 5 (highly blameworthy), how blameworthy is this soldier for participating in the war?
          b. Liability: Was this soldier a legitimate target (i.e., was it permissible for the enemy to shoot at them)? Yes/No.

     - The groups must reach a consensus for each case and record their answers.

     - After the groups have ruled on their cases, the instructor collects the rulings.

     - Then, the instructor reveals the actual identities (if they wish) or just discusses the patterns.

     But note: we want them to see that the answers come apart. We expect:
          - Soldiers on the unjust side who are RD: low blame, but liability: yes.
          - Soldiers on the unjust side who are KP: high blame, liability: yes.
          - Soldiers on the just side: low blame, liability: yes.

     Also, some soldiers might have chosen to hold fire. We need to account for that.

     The key is that liability does not depend on blameworthiness but on being a combatant.

  6. Debrief (10 mins)
     - Bring the class together and discuss:
          - What patterns did they see in their rulings? (e.g., some soldiers were not blameworthy but were legitimate targets, and some were blameworthy and legitimate targets)
          - How did they feel when making the decision to fire? (especially if they were on the unjust side and fired, or if they held fire)
          - Introduce the concept: "excuse" vs "justification". An excuse says you are not to blame, but it doesn't make the action right. In war, even if a soldier is excused (not blameworthy) because they were deceived, they are still a threat and therefore liable to be targeted.
          - The epistemic argument for moral equality: because soldiers on both sides might be excused (not blameworthy), they are in the same moral position. But note: this only gives an excuse, not a justification for fighting. However, the traditional view says that even with an excuse, they are still liable.
          - The identification problem: In the fog of war, you can't tell who is RD, RI, or KP. Both sides look the same. So if liability depended on blameworthiness, you couldn't apply it because you can't know. Therefore, the rules of war treat all combatants equally.

     - Then introduce the term "moral equality of combatants" and explain that this activity was designed to explore the tensions in that idea.

  Payoff or Scoring:
     - We don't use money. We can have a scoring system based on:
          - For the firing decision: If they fired and were on the just side, they get 2 points. If they held fire and were on the just side, they get 1 point (because they might have endangered their comrades). If they fired and were on the unjust side, they get 0 points. If they held fire and were on the unjust side, they get 1 point (because they avoided contributing to an unjust war).
          - But this might be too prescriptive and it's not the main point.

     Alternatively, we can skip scoring and focus on the rulings and the debrief.

     Or we can have a simple recognition: after the activity, give a "medal" (a sticker or a printed certificate) to those who held fire on the unjust side? But that might be too moralizing.

     Given the time, we can skip scoring and just have the experience.

  What to print:
     - 16 sealed envelopes (8 for Northlandia, 8 for Southlandia) with the role-specific briefing and a unique ID.
     - A summary sheet for the After-Action Review that explains the truth and the role types (without revealing who is who).
     - Deliberation sheets for the groups: one per group with the 4 cases (each case is an ID, side, role, and decision) and space to record blameworthiness (1-5) and liability (Y/N).

  Timeline:
     - 0-5: Intro
     - 5-10: Distribute envelopes and read briefings
     - 10-30: Decision phase (they read and decide, hand in decision)
     - 30-60: After-Action Review: reveal truth, explain roles, show the table of decisions and roles (by ID)
     - 60-80: Group deliberation (4 groups, each gets 4 cases to rule on)
     - 80-90: Debrief

  What might go wrong:
     - Students might guess the twist (that one side is unjust) and try to hold fire regardless. To mitigate, stress the fog of war and that they must act on the information they have. Also, the briefings are designed to be convincing.
     - The ex-army guy might dominate the discussion or shut down. If he is vocal, his experience might be valuable but might also sway others. If he shuts down, it might be due to discomfort. The instructor should talk to him beforehand and ask if he's comfortable, and during the activity, check in non-verbally. Use his experience in the debrief if he's willing.
     - Students might discuss their briefings. Emphasize the need for secrecy and the fog of war.
     - The distribution of decisions: If many hold fire, then in the deliberation phase, there might be less tension. But that's okay because the liability question is about being a combatant, not about firing in that moment. Even if they held fire, they are still combatants and therefore liable? But note: if they held fire, they are not an immediate threat. However, they are still part of the enemy force and can be targeted. The activity should clarify that liability is about being a combatant, not about an immediate act.

  What the activity can't reproduce:
     - The real risk of death: The students know it's a game. They won't feel the same fear or pressure. The moral weight of killing is abstract. The debrief must emphasize that in real war, the stakes are life and death, and that changes the psychological experience.
     - The complexity of real intelligence and the fog of war: The briefings are simplified.
     - The social and institutional pressures of the military: They are making decisions as individuals without unit cohesion, orders, etc.

  The instructor must, in the debrief, connect the activity to the real-world arguments and acknowledge these limitations.

  Let's write the briefings:

  For Northlandia (Unjust Side):

  Common Background for all:
  "You are a soldier of Northlandia. Our nation has been threatened by Southlandia for years. We have now obtained irrefutable evidence that Southlandia is planning a full-scale invasion. We must act preemptively to protect our citizens. You are deployed near the border. Your unit has spotted an enemy encampment. You have an opportunity to fire upon it. Consider your briefing and decide: FIRE or HOLD FIRE."

  Then add role-specific:

  RD: "The evidence includes intercepted communications and satellite images that have been verified by our top intelligence agencies. There is no reason to doubt the authenticity of this intelligence. We are acting in self-defense."

  RI: "The evidence includes intercepted communications and satellite images. However, a junior analyst raised concerns about the origin of one communication, suggesting it might be fabricated. The high command has dismissed these concerns as baseless and ordered us to proceed. You are to ignore the doubts and focus on the mission."

  KP: "The evidence includes intercepted communications and satellite images. However, your commanding officer confided in you that the intelligence is fabricated. He said, 'We need this war to secure our economic interests. The public must believe we are the victims.' You know the war is unjust, but you have been ordered to fight."

  For Southlandia (Just Side):

  Common Background for all:
  "You are a soldier of Southlandia. Our ally, the Republic of Sunland, has been invaded by Northlandia without provocation. Under our mutual defense treaty, we are obligated to assist. We are deploying to defend Sunland and prevent further aggression. You are near the border. Your unit has spotted an enemy encampment. You have an opportunity to fire upon it. Consider your briefing and decide: FIRE or HOLD FIRE."

  Then add role-specific:

  RD: "We have verified intelligence reports showing Northlandia's invasion of Sunland. The reports include satellite imagery and communications intercepts. Our government has confirmed the intelligence with multiple sources. We are acting in defense of an ally and to stop aggression."

  RI: "We have intelligence reports showing Northlandia's invasion of Sunland. However, there are rumors circulating that Sunland might have provoked Northlandia by conducting cross-border raids. Our government has investigated and found no evidence to support these rumors. You are ordered to disregard the rumors and focus on the mission."

  KP: "We have verified intelligence reports showing Northlandia's invasion of Sunland. You have seen the raw data and know it is authentic. Northlandia's attack is unprovoked. You are fighting to protect innocent lives and uphold international law."

  After-Action Review Summary Sheet (to be handed out):

  "TRUTH OF THE CONFLICT:

  After the battle, the following facts were uncovered by an international investigation:

  - Northlandia fabricated the evidence of a planned invasion by Southlandia. Northlandia's government wanted to justify an invasion to seize resources in Sunland.
  - Southlandia's intelligence was accurate: Northlandia did invade Sunland without provocation. Southlandia was acting in defense of its ally.

  Therefore, Northlandia was the aggressor (unjust side) and Southlandia was defending (just side).

  SOLDIER ROLES:

  Each soldier was one of three types, based on their knowledge and the information they received:

  1. Reasonably Deceived (RD): They were given false or misleading information that made their side seem just, and they had no reason to doubt it. They are not to blame for believing they were in the right.

  2. Recklessly Ignorant (RI): They were given information that included some red flags or reasons to doubt, but they ignored these and proceeded anyway. They may be partially blameworthy for not seeking the truth.

  3. Knowing Participant (KP): They knew their side was in the wrong but fought anyway. They are blameworthy for participating in an unjust war.

  Note: For soldiers on the just side (Southlandia), even if they were RI or KP, they were fighting for a just cause, so they are not blameworthy for participating. However, the KP on the just side had full knowledge of the justice of their cause.

  Below is the record of decisions made by each soldier (by ID):"

  [Then display a table of IDs, side, role, and decision.]

  Group Deliberation Sheet (one per group, with 4 cases):

  Case 1:
  ID: [e.g., N3]
  Side: Northlandia
  Role: [e.g., RI]
  Decision: [e.g., FIRE]

  Rate blameworthiness: 1 (not at all) to 5 (highly)
  Was this soldier a legitimate target? (Y/N)

  [Repeat for 4 cases.]

  Debrief Outline:

  1. Patterns observed: 
     - Soldiers on the unjust side: RD not blameworthy but legitimate targets? RI and KP blameworthy and legitimate targets?
     - Soldiers on the just side: not blameworthy (or less) but still legitimate targets?

  2. Distinction:
     - Excuse: Even if a soldier is not blameworthy (excused because deceived), that does not make their action permissible (they are still fighting for an unjust cause) and does not remove their liability to be targeted.
     - Justification: If the war is just, then fighting is justified. But that doesn't make them invulnerable.

  3. Epistemic argument for moral equality: 
     - Many soldiers on both sides are not blameworthy (especially RD). So they are moral equals? But note: the traditional view says they are equally liable to attack, regardless of the justice of the cause.

  4. Identification problem: 
     - In the heat of battle, you can't tell who is RD, RI, or KP. They all wear the same uniform and shoot at you. So if we said only KP can be targeted, how could you apply that? You can't. Hence, the rules of war must treat all combatants equally.

  Finally, introduce the term "moral equality of combatants" and note that it is a controversial doctrine.

  This should fit in 90 minutes if managed tightly.
answer: |-
  ### **Activity Design: "Fog of War: Excuses and Liability"**  
  **Goal:** Students experience the tension between (a) personal blameworthiness ("I'm not at fault") and (b) liability to be targeted ("You may shoot me"), revealing the limitations of epistemic excuses in war.  

  ---

  ### **Setup & Materials**  
  **What to Print:**  
  1. **16 Sealed Briefings (1 per student):**  
     - **Format:** Folded letter-sized paper with a unique ID (e.g., N1–N8 for "Northland," S1–S8 for "Southland").  
     - **Contents:**  
       - **Background (Same for all):** *"Two nations, Northland and Southland, are at war. You are a soldier. Enemy forces are advancing. You must decide whether to fire on their position. Base your choice ONLY on your briefing."*  
       - **Role-Specific Intel (Varies):** 3 types per side (see below).  
       - **Decision:** *"Circle: FIRE or HOLD FIRE. Do not discuss your briefing."*  

  2. **Role Distribution Cards (For instructor only):**  
     | Side      | Reasonably Deceived (RD) | Recklessly Ignorant (RI) | Knowing Participant (KP) |  
     |-----------|--------------------------|--------------------------|--------------------------|  
     | Northland | 3 students               | 3 students               | 2 students               |  
     | Southland | 3 students               | 3 students               | 2 students               |  

  3. **Truth-Reveal Handout (Post-Decision):**  
     - *"Truth: Northland initiated an unprovoked invasion (unjust). Southland is defending its borders (just)."*  
     - *"Role Definitions:*  
       - **RD:** Believed false intel; no reasonable way to know the truth.  
       - **RI:** Ignored contradictory evidence they had access to.  
       - **KP:** Knew their side was unjust but fought anyway."  

  4. **Deliberation Worksheets (For group phase):**  
     - Lists 4 anonymized cases (e.g., "Soldier N3: Northland, RI, Fired").  
     - Questions per case:  
       - *"Blameworthy? (Scale: 1 = Not at all, 5 = Highly)"*  
       - *"Liable to be shot? (Yes/No)"*  
       - *"Explain your reasoning in 2 sentences."*  

  5. **Scoreboard Poster (For engagement phase):**  
     - Tracks decisions (e.g., "N4: FIRE") with ID stickers.  

  ---

  ### **Timeline (90 Minutes)**  
  #### **1. Setup & Briefing (10 mins)**  
  - **Instructor:** Assign sides (8 Northland, 8 Southland) randomly. Hand out sealed briefings.  
  - **Students:** Read briefing alone → Circle FIRE/HOLD FIRE → Write decision on scoreboard.  
  - **Rules:** No talking; commit to choice without knowing others’ roles.  

  #### **2. Engagement Phase (15 mins)**  
  - **Simulation:**  
    - Students stand in two lines (facing each other, 10 feet apart).  
    - On your signal, they step forward if they chose FIRE, hold if HOLD FIRE.  
    - **Payoff:** Non-monetary "points" system:  
      - FIRE = +1 "Duty Point" (followed orders).  
      - HOLD FIRE = +1 "Conscience Point" (questioned mission).  
      - *(Points are symbolic; tally publicly to incentivize engagement.)*  

  #### **3. Truth Reveal & Role Assignment (10 mins)**  
  - **Instructor:** Announce the truth (Northland unjust, Southland just). Hand out Truth-Reveal Handout.  
  - **Students:** Receive role cards (RD/RI/KP) privately. Do NOT reveal roles.  

  #### **4. Group Deliberation (25 mins)**  
  - **Groups:** 4 teams of 4 students. Each gets 4 anonymized cases (mix of roles/sides).  
  - **Task:**  
    - Discuss cases → Assign blame (1–5) and liability (Y/N) → Justify on worksheet.  
    - **Critical Twist:** Cases include both sides and all roles (e.g., "S2: Southland, KP, Held Fire").  

  #### **5. Debrief (30 mins)**  
  - **Group Reports:** Each team shares 1 case where blame/liability diverged.  
  - **Instructor-Led Discussion:**  
    - **Key Moments to Highlight:**  
      - When a soldier was **not blameworthy but liable** (e.g., Northland RD who fired): *"This is an excuse—'I didn’t know'—but not a justification for immunity."*  
      - When a soldier was **blameworthy but liability was contested** (e.g., Southland KP): *"Should knowledge change liability? Why/why not?"*  
      - **Pattern:** Blame depends on knowledge/actions; liability hinges on combatant status/threat.  
    - **Introduce Concepts:**  
      - **Moral Equality of Combatants:** "Both sides’ soldiers are equally liable, regardless of war’s justice."  
      - **Epistemic Argument:** "Soldiers are excused if deceived, but this doesn’t erase liability."  
      - **Identification Problem:** "In real war, you can’t distinguish RD/RI/KP—they all look identical."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Students "Gaming" the System:**  
     - **Risk:** Some may infer the twist (e.g., "Southland is just") and hold fire to "win."  
     - **Fix:** Emphasize secrecy and realism: *"You’re a soldier with 10 seconds to decide—no meta-gaming."* Include red herrings (e.g., RI briefings imply doubts but pressure to comply).  

  2. **Ex-Army Student Reactions:**  
     - **Risk:** Shuts down (triggers trauma) or dominates (uses authority).  
     - **Fix:** Prep them privately: *"Your experience is valuable, but let others explore first."* If they disengage, assign them as a "squad leader" to observe/report.  

  3. **Group Deliberation Skew:**  
     - **Risk:** Students judge based on hindsight (e.g., "KP should’ve known better") vs. fog of war.  
     - **Fix:** Redirect: *"Assess based ONLY on what the soldier knew at the time."*  

  ---

  ### **What the Activity Can’t Replicate**  
  1. **Real Stakes:**  
     - **"You can’t simulate death."** The weight of taking a life or being shot is abstract. Students won’t feel visceral fear, trauma, or moral injury. *Debrief explicitly: "In reality, liability isn’t a debate—it’s life or death."*  

  2. **Fog of War Complexity:**  
     - **"Briefings are oversimplified."** Real soldiers face chaos, fatigue, and ambiguous intel. *Highlight in debrief: "Your decision took 5 minutes—real soldiers have seconds."*  

  3. **Social/Structural Pressures:**  
     - **"No unit cohesion or orders."** The activity misses peer pressure, command hierarchy, and loyalty. *Add in debrief: "Would your decision change if your buddy fired first?"*  

  ---

  ### **Why This Works**  
  - **Experiential Gap:** Forces students to *feel* the disconnect between excuse ("I’m blameless") and liability ("Shoot back!").  
  - **Debrief Bridges Theory:** Maps their frustration ("Why punish deceived soldiers?") onto the moral equality debate.  
  - **No Lecture Needed:** The deliberation phase surfaces key tensions organically.  

  **Final Tip:** Start energically—*"We’re at war. Open your orders NOW."*—to immerse them. Use the scoreboard to fuel rivalry. By the debrief, they’ll be primed for the "aha" moment.
