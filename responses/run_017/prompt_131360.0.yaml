  ### Brainstorming the Logical Space
  The core challenge in preference inference lies in resolving the underdetermination of reward functions from behavior. Given that optimal behavior leaves rewards invariant under affine transformations and potential-based shaping, and suboptimal behavior introduces ambiguity between reward misspecification, belief errors, and decision noise, every method must impose auxiliary principles. The fault lines emerge along several axes:

  1. **Target of Inference**: Reward function (scalar or set), policy, constraints, aspiration levels, or social norms.  
  2. **Source of Authority**: Observed actions, verbal reports, or hybrid signals – and how to reconcile conflicts (e.g., complaining while acting).  
  3. **Model of Rationality**: Optimization (with noise), satisficing, habit-driven, or socially embedded agency.  
  4. **Robotic Role**: Passive observer, active querier, or cooperative partner in preference revelation.  
  5. **Handling Inconsistency**: Dismissed as noise, modeled as belief errors, or treated as structured (e.g., context-dependence).  

  Concrete observations anchor distinctions by forcing commitments:  
  - **Complaints during action** (A) test whether dissatisfaction voids revealed preference.  
  - **Context-dependent behavior** (B) probes if preferences or constraints vary.  
  - **Indifferent competence** (C) challenges uniqueness of rewards.  
  - **Selective delegation** (D) distinguishes trust issues from taboos.  
  - **Habitual non-optimization** (E) separates habits from belief errors.  
  - **Statement-behavior conflict** (F) pits aspirations against hidden rewards.  
  - **Deference to others** (G) questions individualism in preferences.  
  - **Task abandonment** (H) differentiates satisficing from high resumption costs.  

  Settled results:  
  - Non-identifiability of rewards from behavior alone is a technical certainty.  
  - Extra assumptions (e.g., Boltzmann rationality) yield identifiability under idealized conditions.  
  - Active queries can break symmetries but introduce biases.  

  Contested issues:  
  - **Scalar rewards as target**: Rejected by deontic and social-norm approaches as reductive.  
  - **Noise vs. structure**: Suboptimality modeled as random (softmax) by econometric IRL, but as cognitive limits (e.g., inertia) by bounded rationality schools.  
  - **Belief inference**: Joint inference (e.g., Bayesian IRL) assumes beliefs are separable; critics argue beliefs and rewards are entangled in folk psychology.  

  Weakest framing assumption: Treating the user as a *single* agent. Real households involve distributed agency (e.g., deference to family). Drop this first; replace with a *relational* model where preferences are negotiated.  

  ### Decision Tree  
  **Premise**: Behavior alone does not uniquely determine reward functions. Branch nodes use observations to force commitments to auxiliary principles.  
  **Branch Nodes** (8 nodes, 5+ observations):  

  1. **Observation G (defers to daughter for grandson)**: Does deference indicate that preferences are defined by social roles, not individual desires?  
     - **Yes** → Branch to Node 2  
     - **No** → Branch to Node 3  

  2. **Observation F (says wants free time, does chores)**: Is the conflict best explained by aspirations (free time as ideal) overriding immediate rewards?  
     - **Yes** → Leaf: *Aspiration Level*  
     - **No** → Branch to Node 4  

  3. **Observation D (washes knives herself)**: Is this selective delegation due to a taboo (e.g., "knives are sacred") or trust?  
     - **Taboo** → Leaf: *Deontic Constraints*  
     - **Trust** → Branch to Node 5  

  4. **Observation A (complains while making bed)**: Does audible dissatisfaction imply the action violates a personal rule?  
     - **Yes** → Leaf: *Deontic Constraints*  
     - **No** → Branch to Node 6  

  5. **Observation E (efficient for old layout)**: Is non-optimization due to habit or outdated beliefs?  
     - **Habit** → Leaf: *Policy Directly*  
     - **Outdated beliefs** → Leaf: *Joint Reward Belief*  

  6. **Observation C (two competent ways, no pattern)**: Does this imply genuine indifference?  
     - **Yes** → Leaf: *Set of Rewards*  
     - **No** → Branch to Node 7  

  7. **Observation H (abandons tasks, doesn’t return)**: Is abandonment due to satisficing ("good enough") or high resumption cost?  
     - **Satisficing** → Leaf: *Aspiration Level*  
     - **High cost** → Branch to Node 8  

  8. **Observation B (careful with guests, quick alone)**: Should context-dependence be modeled as multiple objectives or social signaling?  
     - **Multiple objectives** → Leaf: *Set of Rewards*  
     - **Social signaling** → Leaf: *Social Role*  

  **Leaves** (12 leaves):  
  1. **Social Role** (from Node 8):  
     - Central: Behavior reflects norm-governed social practices, not personal utility.  
     - Awkward: Fails if user violates norms privately (e.g., cuts corners alone).  
     - Disconfirm: Observe behavior in norm-free contexts (e.g., user alone and unobserved).  

  2. **Aspiration Level** (from Nodes 2, 7):  
     - Central: Infers a satisficing threshold (e.g., "clean enough") from cutoff points in behavior.  
     - Awkward: Thresholds may shift contextually with no clear rule.  
     - Disconfirm: User consistently exceeds threshold without marginal benefit (e.g., re-wipes spotless counter).  

  3. **Deontic Constraints** (from Nodes 3, 4):  
     - Central: Infers inviolable rules (e.g., "never let robots touch knives") as hard constraints.  
     - Awkward: Cannot handle trade-offs (e.g., breaking a rule for emergencies).  
     - Disconfirm: User violates a "constraint" for small rewards (e.g., lets robot handle knives to answer door).  

  4. **Policy Directly** (from Node 5):  
     - Central: Learns habitual behaviors as a policy, skipping reward inference.  
     - Awkward: Policy may not generalize (e.g., if kitchen layout changes).  
     - Disconfirm: Habit persists despite new inefficiencies (e.g., robot rearranges kitchen).  

  5. **Joint Reward Belief** (from Node 5):  
     - Central: Jointly infers reward and user’s (possibly wrong) world model.  
     - Awkward: Beliefs and rewards are underidentified; needs strong priors.  
     - Disconfirm: Correct user’s belief, but behavior doesn’t change as predicted.  

  6. **Set of Rewards** (from Nodes 6, 8):  
     - Central: Infers a set of reward functions consistent with behavior (rational choice set).  
     - Awkward: Robot must act cautiously to avoid violations (e.g., minimax regret).  
     - Disconfirm: User avoids an action optimal for *some* reward in the set.  

  7. **Unnamed: Cooperation-Dependent Reward** (added to cover cooperation):  
     - Central: Robot and user cooperate to iteratively reveal preferences via queries.  
     - Awkward: Requires high user engagement; may not converge.  
     - Disconfirm: User rejects cooperative refinement (e.g., "just guess").  

  8. **Unnamed: Active Query Primacy** (added to cover active refusal):  
     - Central: Ignores passive observation; relies solely on cheap queries.  
     - Awkward: Limited by query budget; verbal reports may be unreliable.  
     - Disconfirm: Queried preferences contradict observed expert behavior.  

  9. **Single Reward Soft-Opt** (from Node 6):  
     - Central: Infers one reward with Boltzmann noise modeling suboptimality.  
     - Awkward: Assumes errors are random, not structured (e.g., habit).  
     - Disconfirm: Suboptimality shows patterns (e.g., always slower on Tuesdays).  

  10. **Unnamed: Contextual Reward** (from Node 8):  
      - Central: Infers reward as context-dependent (e.g., different for guests).  
      - Awkward: Requires context features; may overfit.  
      - Disconfirm: Behavior contradicts in a context (e.g., sloppy with guests).  

  **Inseparable Leaves**:  
  - **Joint Reward Belief** and **Set of Rewards** cannot be separated with given observations. Both explain inconsistent behavior (e.g., non-optimized layout) equally well.  
    - **Separating measurement**: Test responses to *belief updates*. E.g., correct user’s world knowledge; if behavior optimizes, it supports Joint Reward Belief. If inconsistency remains, supports Set of Rewards.  

  ### User Routing  
  1. **Meticulous Maximizer**:  
     - Always optimal, so Node 6 → "No" to indifference → Node 7 → "High cost" for abandonment (since interruption increases cost) → Node 8 → "Multiple objectives" (if context matters) → **Set of Rewards**.  
     - *Path*: 1(No)→3(Trust)→5(Outdated? No)→6(No)→7(High cost)→8(Multiple objectives).  

  2. **Rule-Follower**:  
     - Deference (G) is social, but Node 1 → "No" (if deferring is personal choice). Node 3 → "Taboo" (knives) → **Deontic Constraints**.  
     - *Path*: 1(No)→3(Taboo).  

  3. **Muddler (Habit-Driven)**:  
     - Node 5 → "Habit" (non-optimized layout) → **Policy Directly**.  
     - *Path*: 1(No)→3(Trust)→5(Habit).  

  4. **Defers to Family Member**:  
     - Node 1 → "Yes" (deference as social role) → Node 2 → "No" (if chores reflect norms) → Node 4 → "No" (complaints don’t imply rules) → Node 6 → "No" (no indifference) → Node 7 → "Satisficing" (abandons tasks as "good enough") → **Aspiration Level**.  
     - *Path*: 1(Yes)→2(No)→4(No)→6(No)→7(Satificing).  

  **Blind Spot**: Meticulous Maximizer and Rule-Follower both land on **Set of Rewards** and **Deontic Constraints** if context-dependence is seen as multiple objectives vs. rules. The tree cannot distinguish a maximizer following context-dependent rules from a rule-follower with context-sensitive norms. Resolving requires probing *why* context matters: ask user if guests change preferences (maximizer) or obligations (rule-follower).
