prompt: |-
  I have to teach a single fifty-minute section on whether a theory can be right but early, and I want Malthus's population theory to carry the whole hour. The audience is first-years in a general-education course on prediction, most of whom will arrive having heard that Malthus was refuted — by the Green Revolution, or simply by the fact that we are not starving. Please do not explain Malthus to me; plan how I should explain him.

  What I chiefly need is the dependency structure: what must be in place before right but early can even sound like an available verdict rather than a face-saving excuse. My own starting thought is that the class has to first strip the mechanism claim — more people against a fixed resource base presses per-capita output back down toward subsistence — away from any timing or trend claim, and that only then can the question of what would have counted as a deadline be raised at all. Tell me whether that ordering is right and what it forces next.

  Two devices I am unsure about. First, I want to mark a contrast between a theory that has been *out-run*, where the mechanism still operates but a countervailing trend the theory did not represent has overwhelmed it, and one that has been *disarmed*, where the mechanism itself has been dismantled by a change in the world the theory did not anticipate; I would then use it to say which of these Malthus is. Does that contrast do real work, or is the distinction hollow exactly where it matters? Second, I would like some case in which right but early is plainly the wrong verdict, set beside Malthus early in the hour: tell me what such a case must have and must lack, and give me one.

  Then the misconceptions, in the order the class will form them, each with the point in the sequence at which it should be headed off. The ones I expect: that a dated forecast's failing refutes the mechanism; that enriching a model to accommodate a trend it missed is ipso facto an ad hoc rescue; and, more interestingly, that a theory with no built-in deadline cannot be early but only not yet tested — which I suspect is where the hour ought to land. Add the one you think I have missed.

  Close with two things: the question or exercise I should end on, to tell whether they have the distinction or only the slogan, and what I should openly decline to settle in fifty minutes while telling them I am declining it. Finally, mark where your recommended ordering is most likely to break down in the actual room, and say what would persuade you to reorder it.
reasoning: |-
  Hmm, the user is teaching a fifty-minute class for first-year students on whether a theory can be "right but early," using Malthus's population theory as the central example. The students likely think Malthus was proven wrong by events like the Green Revolution. I need to help structure this lesson effectively.

  The key dependency is establishing the mechanism claim before addressing timing or trend. The user wants to separate Malthus's core mechanism (population growth pressing against resources) from any specific timing predictions about when crises would occur. This makes sense as a foundation because without this separation, students will conflate failed forecasts with invalid mechanisms.

  The user proposes two devices: contrasting "out-run" versus "disarmed" theories, and finding a clear counterexample where "right but early" is the wrong verdict. The contrast seems useful—"out-run" implies the mechanism still operates but is overwhelmed (like Malthus), while "disarmed" means the mechanism itself is broken. For the counterexample, a theory like phlogiston fails because its mechanism was fundamentally flawed, not just early.

  For misconceptions, students might think a failed forecast refutes the mechanism, that adding new factors is ad hoc, and that theories without deadlines can't be "early." The last point is crucial—it should lead to the conclusion that Malthus's theory lacks a deadline, making "early" incoherent. An additional misconception might be conflating "early" with "false."

  To assess understanding, I'll suggest an exercise comparing Malthus to a clear case like phlogiston. The user should explicitly avoid settling whether Malthus is correct today. The lesson is most likely to break down when discussing the mechanism-trend separation, so I'll recommend using a simple analogy and polling students to gauge comprehension before moving on.
answer: |-
  Here’s a structured 50-minute lesson plan focused on "right but early" using Malthus, addressing dependencies, devices, misconceptions, and your closing needs:

  ---

  ### **Dependency Structure & Core Sequence**  
  *(Order is critical — follow strictly)*  
  1. **Reset Student Baseline (5 min)**  
     - *Do:* Poll students: "What refuted Malthus?" (Green Revolution, no mass starvation). Acknowledge this is the common view.  
     - *Goal:* Surface the "timing/trend" misconception upfront.  
     - *Key Move:* **Decouple the mechanism from its predicted outcome.**  

  2. **Isolate Malthus’ Mechanism (15 min)**  
     - *Do:* Define the core *mechanism* stripped of timing:  
       > *"If* population grows geometrically while resources grow arithmetically, *then* population pressure forces living standards down to subsistence *unless* prevented by checks."  
     - *Anchor:* Use Malthus’ own examples (e.g., 18th-c. famines). Emphasize: **This is a conditional claim, not a prophecy.**  
     - *Why first?* Without this, "early" is meaningless — you’re right to start here.  

  3. **Introduce "Right but Early" as a Category (10 min)**  
     - *Do:* Define: A theory is *right but early* **iff** its core mechanism is valid, but countervailing forces delayed/prevented the predicted outcome.  
     - *Contrast Device:* **"Out-run" vs. "Disarmed"** (This distinction *works*):  
       - **Out-run**: Mechanism still operates but is overwhelmed (e.g., Malthus: innovation outpaced population).  
       - **Disarmed**: Mechanism broken by new rules (e.g., Demon-haunted world → scientific method).  
     - *Verdict:* Malthus was **out-run** (his mechanism *still* operates locally: see soil depletion in Punjab post-Green Rev).  

  4. **Counterexample: "Right but Early" as Wrong Verdict (5 min)**  
     - *Case:* **Phlogiston Theory** (Must *lack* a plausible mechanism; must *have* been falsified by core assumptions).  
     - *Why it fits:*  
       - Mechanism (phlogiston release = combustion) was *disarmed* (oxygen theory dismantled it).  
       - Not "early" — it was *false*. Adding epicycles (e.g., "negative phlogiston") is ad hoc, not countervailing forces.  

  ---

  ### **Misconceptions & Preemptive Strikes**  
  *(Order of appearance in class → Intervention point)*  
  1. **"Failed forecast = Refuted mechanism"**  
     - *When:* During Step 1 (student responses).  
     - *Strike:* In Step 2, stress Malthus’ mechanism *worked historically* (e.g., Irish Potato Famine).  

  2. **"Adding new factors = Ad hoc rescue"**  
     - *When:* When you frame tech innovation as countervailing (Step 3).  
     - *Strike:* Contrast with phlogiston (Step 4): Green Revolution is *independent evidence*, not a patch.  

  3. **"No deadline → Can’t be early, only untested"**  
     - *When:* During Step 3 discussion of "early."  
     - *Strike:* **This is your landing point.** Argue: Malthus’ theory *lacks a deadline* — it’s a *conditional* with no expiration. "Early" implies a due date he never set.  

  4. **Missed Misconception:**  
     - **"If the outcome is avoided, the threat wasn’t real"**  
       - *When:* Implicit in Step 1.  
       - *Strike:* Use the *out-run* frame: "Dodging a bullet doesn’t mean the gun wasn’t loaded."  

  ---

  ### **Closing Moves**  
  1. **Final Exercise (5 min)**  
     - *Question:* *"Could phlogiston be 'right but early'? Why is Malthus different?"*  
     - *Tests for distinction:* Correct answers must reference mechanism validity (Malthus) vs. disproof (phlogiston).  

  2. **Explicitly Unsettled (2 min)**  
     - *State:* **"We haven’t settled if Malthus is *still* right today. Did we dismantle the mechanism (disarm) or just out-run it so far? That’s for next week."**  

  ---

  ### **Breakdown Risk & Reordering Triggers**  
  - **Critical Breakdown Point:** Step 2 (isolating the mechanism).  
    - *Risk:* Students resist decoupling mechanism from outcome ("But he *was* wrong!").  
    - *Mitigation:* Use a **non-Malthus analogy** first:  
      > *"If I jump from a skyscraper, I’ll die. But if I use a parachute, I survive. Was gravity ‘wrong’?"*  
    - *Reorder if:* >50% can’t articulate the mechanism after Step 2. **Pivot** to small groups rephrasing it in their own words (3 min).  

  **Reordering Trigger:** If counterexamples (Step 4) cause confusion, flip Steps 3 & 4. Use phlogiston *before* defining "right but early" to sharpen the contrast.  

  ---

  ### **Why This Works**  
  - **Lands your key insight:** "No deadline" makes "early" incoherent for Malthus.  
  - **Devices pull weight:** "Out-run vs. disarmed" clarifies why Malthus persists; phlogiston forces precision.  
  - **Fits time constraints:** Each segment builds on the last with clear transitions.  

  End by noting: Malthus isn’t "early" — he’s a **conditional timer** still ticking in resource-constrained systems. The hour’s win isn’t rehabilitating Malthus, but making "right but early" a tool, not a slogan.
