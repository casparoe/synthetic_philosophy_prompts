  ### Notes
  - **Voter assumptions**: For rules returning sets (Rule B), voters are assumed to rank individual options, not sets. Set-based preferences (e.g., approval of subsets) are not modeled.
  - **Device diagnoses**:  
    - **Rule E (Enforced domain restriction)**: Fails as a theorem-licensed escape because the admissible domain depends on reported ballots, inviting manipulation via voiding.  
    - **Rule I (Chair with override)**: The tree distinguishes it from Rule H (bare dictatorship) via Q9 (accountability). In isolation (per theorem), Rule I is non-dictatorial (no voter always wins), but strategy-proofness is sacrificed. The override is a sociological work-around.  
  - **Outcome redefinition**: No rule uses a "reversion option" (e.g., "none of the above") to expand the outcome space.  
  - **Sociological escapes**: Only Rule I (override/confidence vote) uses them; others rely on formal relaxations.
