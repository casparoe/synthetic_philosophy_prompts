  ### Decision Tree for Selecting a Voting Rule

  The tree is structured around relaxing one or more conditions of the Gibbard-Satterthwaite theorem. Each branch is a yes/no question, leading to specific rules (leaves). At each leaf, the rule is defined, followed by a note on "Given up" (what the rule sacrifices) and "Escape status" (how it avoids the theorem's impossibility: **theorem-licensed**, **sociological**, **redefinition**, or **none**).

  ---

  #### Decision Tree (Nested List)

  1. **Must the rule always return exactly one option?**  
     - **No** (may return set/lottery):  
        - 2. **Is a trusted source of randomness available?**  
           - **Yes**:  
              - **Rule A: Random Dictator**  
                 - Each voter submits a ranking. One voter is selected uniformly at random; their top choice wins.  
                 - *Given up*: Determinism (outcome is stochastic) and single-valuedness (outcome is a lottery).  
                 - *Escape status*: **Theorem-licensed** (randomization expands outcome space).  
           - **No**:  
              - **Rule B: Smith Set**  
                 - Return the smallest non-empty set of options that beats all others in pairwise comparisons.  
                 - *Given up*: Single-valuedness (returns a set; requires later tie-break). Vulnerable to manipulation.  
                 - *Escape status*: **None** (no theorem-licensed escape).  
     - **Yes** (always one option):  
        - 3. **Are voters allowed to record intensities (e.g., scores/grades)?**  
           - **Yes** (cardinal ballots):  
              - 4. **Is transferable numeraire (e.g., tokens) available?**  
                 - **Yes**:  
                    - **Rule C: VCG Mechanism**  
                       - Voters report cardinal utilities. Option with highest total utility wins. Each voter pays a tax equal to the externality they impose.  
                       - *Given up*: Budget balance (may run deficits) and simplicity (requires monetary transfers).  
                       - *Escape status*: **Theorem-licensed** (for quasilinear utilities).  
                 - **No**:  
                    - **Rule D: Range Voting**  
                       - Voters score each option (e.g., 0–10). Sum scores; highest wins.  
                       - *Given up*: Strategy-proofness (voters may exaggerate scores).  
                       - *Escape status*: **None**.  
           - **No** (only ordinal rankings):  
              - 5. **Can options be ordered on a single published scale before voting?**  
                 - **Yes** (fixed scale):  
                    - 6. **Are ballots voided if not single-peaked on the scale?**  
                       - **Yes**:  
                          - **Rule E: Median Rule with Voiding**  
                             - Void non-single-peaked ballots. Find the median of top choices on the scale; select the closest candidate.  
                             - *Given up*: Strategy-proofness (voters may submit invalid ballots to be voided).  
                             - *Escape status*: **Flawed theorem-licensed** (domain restriction depends on reports).  
                       - **No**:  
                          - 7. **Must honesty be optimal without contingent reasoning?**  
                             - **Yes**:  
                                - **Rule F: Fixed-Order Dictatorship**  
                                   - Voters are ordered (e.g., by seniority). The first voter’s top choice wins.  
                                   - *Given up*: Non-dictatorship.  
                                   - *Escape status*: **Theorem-licensed** (explicit dictatorship).  
                             - **No**:  
                                - **Rule G: Borda Count**  
                                   - Assign points: top rank gets \(n-1\) points, next \(n-2\), etc. Sum points; highest wins.  
                                   - *Given up*: Strategy-proofness.  
                                   - *Escape status*: **None**.  
                 - **No** (no fixed scale):  
                    - 8. **Must honesty be optimal without contingent reasoning?**  
                       - **Yes**:  
                          - **Rule H: Chair Dictatorship**  
                             - The chair’s top choice wins.  
                             - *Given up*: Non-dictatorship.  
                             - *Escape status*: **Theorem-licensed**.  
                       - **No**:  
                          - 9. **Should the rule have a single point of accountability?**  
                             - **Yes**:  
                                - **Rule I: Chair with Supermajority Override**  
                                   - Chair’s top choice wins unless ≥⅔ of voters rank another option higher; if override, majority vote wins. Chair faces annual confidence vote.  
                                   - *Given up*: Strategy-proofness (voters may misreport to trigger override).  
                                   - *Escape status*: **Sociological** (override/confidence as reputational checks).  
                             - **No**:  
                                - **Rule J: Ranked Pairs**  
                                   - Sort pairwise victories by margin; "lock in" largest victories, skipping cycles. Top option wins.  
                                   - *Given up*: Strategy-proofness.  
                                   - *Escape status*: **None**.  

