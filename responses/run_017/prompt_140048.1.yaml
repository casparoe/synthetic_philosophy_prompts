  | Q1=Yes, Q3=No, Q5=Yes, Q6=Yes + strategy-proofness required | **Impossible**: Voiding non-single-peaked ballots creates incentives to misreport to be voided, violating strategy-proofness. |
  | Q1=Yes, Q3=Yes, Q4=No + fixed scale available | **Unexplored**: Range Voting (Rule D) could use the scale for tie-breaking, but this option is not specified. |

