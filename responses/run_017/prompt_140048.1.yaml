  #### Walkthrough for a Specific Board
  *Board answers: Q1=Yes, Q3=No, Q5=Yes, Q6=Yes (all others No or default).*  
  1. **Q1: Must return one option?** → **Yes** (proceed to Q3).  
  2. **Q3: Cardinal intensities?** → **No** (proceed to Q5).  
  3. **Q5: Publish fixed scale?** → **Yes** (proceed to Q6).  
  4. **Q6: Void non-single-peaked ballots?** → **Yes** (reach **Rule E**).  
  **Rule E: Median Rule with Voiding** is adopted.  
  - *Why?* The board prioritizes a structured scale and enforces single-peakedness.  
  - *Given up*: Strategy-proofness (a voter may strategically submit a non-single-peaked ballot to be voided if they prefer influencing the median indirectly).  
  - *Escape status*: **Flawed theorem-licensed** (domain restriction is report-dependent).  

