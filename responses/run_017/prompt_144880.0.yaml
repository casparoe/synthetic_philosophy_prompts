answer: |-
  ## The Limits of Coherence

  Coherence arguments aim to establish expected-utility (EU) maximization as a requirement of rationality by demonstrating that violators are vulnerable to certain exploitative scenarios: sure losses via package bets (Dutch books) or sequential money-pumps. However, these arguments fall short. They demonstrate only a conditional, instrumental requirement dependent on specific assumptions about the agent's motivations and the transactional environment, failing to establish EU maximization as constitutive of rationality. The gap between avoiding sure loss and maximizing expected utility remains unbridged.

  **1. The Immune Non-Maximizer**
  Consider an agent, Sarah, who employs a state-dependent satisficing rule. She evaluates outcomes relative to context-specific aspiration levels. For a crucial job interview (State A), the outcome "Get the job" is vastly more important than any monetary gain; she values money only minimally in this state, focused entirely on the outcome. Conversely, on a relaxed weekend (State B), she enjoys small monetary gambles for entertainment but strictly avoids large losses that could impact her rent. Her preferences are:
  -   In State A: Reject any bet distracting from the interview focus. Accept only trivial monetary gains offered without distraction.
  -   In State B: Accept any bet offering a gain of up to $10 with at least a 40% chance of winning, regardless of potential loss size (within her means), purely for the thrill. Reject bets requiring larger potential losses or offering gains over $10 (as she's "satisfied" beyond that point).
  Sarah is not an EU maximizer. Her valuation of money shifts dramatically with the state; money is nearly worthless in A and non-linearly valued in B (discontinuous at $10 gain). She admits no EU representation – her preferences violate both state-independence and continuity.

  Why is Sarah immune?
  -   **Package-Immune:** No single bundle of monetary bets guarantees her a sure loss. A bundle attractive in State B (e.g., a small gamble) would be rejected outright in State A if offered then. A bundle structured to exploit her in A (e.g., demanding focus) would be rejected in A and irrelevant in B. Crucially, the *same* bundle cannot be offered across states without specifying *when* it occurs, but the state defines the context of offer. A bookie cannot force her to accept a bundle *conditional* on State A occurring if accepting it *in* State A undermines the very outcome (getting the job) that defines State A for her. The "sure loss" requires enforcing settlement *in* the state where the loss occurs, but her rejection in that state is contextually rational for her.
  -   **Sequence-Immune:** No adaptive sequence of monetary trades guarantees a sure loss. An adversary offering a small gamble in State B might get her to accept a loss. But to exploit this, the adversary needs to *return* to State B or another state where she might accept offsetting bets. However, Sarah's state transitions depend on her overall outcomes. A significant monetary loss in State B might shift her context entirely (e.g., into a "financial stress" state where she rejects *all* gambles). The adversary cannot deterministically force the sequence of states required to pump her indefinitely; her state-dependent dispositions and the impact of outcomes on her state break the pumping chain. She refuses trades that would lead to states where further exploitation is possible.

  **2. The Currency Crucible**
  The standard constructions rely on two critical, non-innocent assumptions about the settlement currency:
  -   **State-Independence:** The currency must be valued identically across all states. Sarah values money negligibly in State A compared to State B, violating this. A loss of $X in State A is trivial to her compared to the same loss in State B.
  -   **Separability & Additivity:** The value of the currency must be separable from other goods and additive. Gains or losses in the currency simply add/subtract value linearly, regardless of other possessions. Sarah's satisficing in State B violates linearity; a $15 gain offers no *additional value* over a $10 gain. More fundamentally, in State A, money is *not* separable from the interview outcome; a bet involving money might intrinsically detract from focus.

  Why not simply denominate payoffs in "utils" (Sarah's utility units)? This repair fails circularly. The "util" is defined *by* the very EU representation the argument seeks to establish. If Sarah lacks such a representation, there *are* no stable, additive, state-independent utility units to denominate bets in. The bookie cannot hand over "abstract utility"; they must hand over concrete goods (like money) whose value *to Sarah* is precisely what varies problematically across states and bundles. Assuming utils presupposes the EU structure to be proven. Furthermore, the argument requires the agent to accept arbitrary stake sizes denominated in this currency to construct the sure loss. But if stakes are in utils, why would an agent who doesn't maximize EU accept arbitrarily large util-stakes? The requirement to transact at arbitrary sizes itself assumes a linearity in value that the non-EU agent may lack.

  **3. The Asymmetry of Gain and Loss**
  Coherence arguments only establish the necessity of avoiding a *sure loss* (package-immunity and sequence-immunity). They say nothing about securing a *sure gain*. EU maximization requires both: maximizing entails not just avoiding dominated options but actively choosing the best available. An agent can be package-immune and sequence-immune (like Sarah, avoiding sure losses) yet still be **reverse-exposed**: there might be a bundle of bets she declines, or a sequence she refuses, that would have *guaranteed* her a net gain (e.g., a free $5). Reverse-exposure, by itself, is not incoherence. It reflects an opportunity cost, a failure to maximize, but not a vulnerability to exploitation. An agent might decline a sure gain for many reasons: misunderstanding, transaction costs, or simply valuing other things (like Sarah valuing focus in State A over a distracting monetary gain). To *convert* reverse-exposure into incoherence requires adding a substantive, non-structural assumption: that the agent *always and everywhere desires more* of the settlement currency, unconditionally. But this is a preference assumption, not a requirement of structural coherence. It transforms the argument from one about consistency into one about possessing a specific, unbounded desire. The "why be coherent?" challenge then reduces to "why have *this* desire?", leaving the normative foundation instrumental.

  **4. Objections Granted and Refocused**
  *   **Epistemic Reconstruction:** "Accuracy-first" arguments show that probabilistically incoherent credences are accuracy-dominated. A bridge principle (e.g., "choose acts maximizing expected accuracy" or "let credences guide choices via EU") is then supposed to transfer this norm to action. This strategy is partial and circular.
      *   **Partial:** It directly constrains *credences*, not actions. An agent could have coherent credences but violate EU in action (e.g., through state-dependent or non-linear valuation of outcomes, like Sarah). Accuracy arguments don't reach this.
      *   **Circular:** The bridge principle itself *presupposes* a core decision-theoretic norm – either EU maximization applied to accuracy scores (which are just utilities by another name), or a direct injunction to maximize expected epistemic utility. This norm is precisely what needs grounding for the *practical* domain. Using it as a bridge reintroduces the target norm unexplained. Accuracy considerations don't escape the need to justify the practical maximization imperative.
  *   **Constitutive Reading:** Perhaps EU structure isn't *required* but is *constitutive* of being interpretable as an agent. If we interpret Sarah charitably, we might ascribe her a complex EU function reflecting state-dependence and thresholds. Granting this reveals the argument's weakness. If interpretation *supplies* the EU structure via charity, then the coherence "requirement" becomes a *descriptive prediction* about what patterns we can interpret as agency, not a *normative prescription*. The agent isn't *irrational* if she lacks this structure; she becomes *unintelligible*. But this drains the argument of normative force. The challenge "Why *should* I be coherent (i.e., interpretable)?" remains unanswered. If Sarah finds her state-dependent satisficing perfectly rational *for her*, and rejects the interpreter's imposition of EU structure as alien to her concerns, the constitutive argument offers her no reason to change. It tells her she's unintelligible, not irrational – a distinction that matters normatively.

  **5. The One-Shot Agent**
  Consider an agent facing precisely one, isolated decision. Diachronic money-pumps (sequence vulnerability) are irrelevant – there is no sequence. Only package-immunity remains applicable: she should avoid accepting a single bundle guaranteeing a sure loss. Sarah, in her single context (be it State A or State B), easily achieves this. Her state-specific rules prevent her accepting a bundle disastrous in that state. What "survives" is this minimal synchronic coherence constraint: avoid a single, contextually defined sure loss relative to a currency assumed desirable *in that very context*. This is still recognizably a coherence argument – it highlights inconsistency in valuation *at a single time* leading to a guaranteed bad outcome. However, it is exceedingly weak. It establishes only a highly conditional, state-local, instrumentally rational requirement: "If you want more of *this* in *this* situation, avoid this specific bundle." It bears no resemblance to global EU maximization. The core issues of currency state-dependence, separability, and the asymmetry between loss avoidance and gain securing persist undiminished. The one-shot agent vividly illustrates that the essence of the coherence argument is thin, local, and preference-dependent.

  **Where the Argument Bites and Where It Concedes**
  This critique is **strongest** in exposing the **circularity inherent in the utility-denomination escape hatch** and the **fatal dependence on the state-independence and separability of the settlement currency**. It shows concretely how an agent with plausible, context-sensitive preferences (like Sarah) escapes the classic coherence traps, revealing those traps as artifacts of restrictive assumptions about value. The **asymmetry argument** (avoiding loss ≠ securing gain) is also robust, highlighting how coherence captures only half of maximization.

  I **concede** that coherence arguments successfully establish that violating their *specific structural constraints* (like probabilistic coherence or the axioms violated by cyclic preferences *over a state-independent currency*) makes an agent vulnerable to a sure loss *relative to that currency*. They show a genuine inconsistency *given* the desire for the currency. Furthermore, the **constitutive reading** correctly identifies that EU maximization provides a powerful, often indispensable, framework for interpreting and predicting behavior. The patterns coherence demands *are* central to a dominant model of rational agency. The argument concedes that coherence arguments identify a significant *instrumental* failing relative to a specific, unbounded desire. Its victory is in showing this is *less* than establishing EU maximization as a constitutive norm of rationality: the gap between avoiding exploitation *in this specific way* and maximizing value *simpliciter* remains unclosed, resting on substantive preferences charity cannot normatively enforce. The "why be coherent?" question, transformed into "why care *this much* about *this* currency?", retains its force.
