  1. A requirements list covering necessary phenomena to explain, critical distinctions, and forbidden contradictions
  2. Evaluation of their proposed "mute curriculum" test for borrowed comprehension
  3. Flags for negotiable vs non-negotiable requirements and potential conflicts
  4. Identification of which requirement most challenges existing theories

  The user is clearly well-versed in philosophy of mind, AI, and complex systems. Their language suggests they've thought deeply about this - note terms like "comprehension debt" and "borrowed comprehension." There's an urgency to resolve this debate with their friend, and practical concerns about trusting AI systems.

  For the requirements list, I'll organize into:
