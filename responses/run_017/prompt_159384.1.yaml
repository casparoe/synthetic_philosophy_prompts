answer: |-
  ### 1. Examination Question (Total: 30 marks)  
  **Answer ONE question. Time allowed: 90 minutes.**  

  **Question:**  
  The case of Ada’s marathon run challenges standard theories of persistence. Ada’s run comprises instantaneous stages causally linked and intrinsically identical to those in an ordinary marathon. However, the temporal ordering of these stages diverges radically from their ordering along all other relevant dimensions (the “gradient ordering”):  
  - The stage where Ada *crosses the finish line* occupies the *earliest* time.  
  - The stage where Ada *leaves the start line* occupies the *latest* time.  
  - Intermediate stages (e.g., mile markers, hydration points) are temporally scattered between these endpoints with no pattern, yet retain pairwise causal connections and intrinsic properties (e.g., fatigue levels, memories) that progress smoothly along the gradient ordering (e.g., increasing fatigue, accumulating memories of the race).  

  *(a)* Explain what the **perdurantist** (temporal-parts theorist) and the **endurantist** must say about whether Ada changes during this run and in which direction (e.g., from rested to tired). (10 marks)  
  *(b)* Can the perdurantist explain change *solely* by variation across temporal parts, without appealing to temporal order as an additional ingredient? Justify your answer. (10 marks)  
  *(c)* Does this case arm the endurantist with a new argument against perdurantism, beyond existing dialectic? Defend your view. (10 marks)  

  ---  
  ### 2. Model Answer (Definite Position: The Views Collapse)  
  **Position:** Despite surface differences, perdurantism and endurantism collapse into notational variants when forced to address indexing, regress, and ordering. The Ada case reveals this by showing that both require the same explanatory supplement (temporal order) to ground change, negating the perdurantist’s alleged advantage.  

  **(a) Perdurantism vs. Endurantism on Change in Ada**  
  Perdurantists identify Ada with a spacetime worm whose temporal parts (stages) vary in properties. For them, Ada changes iff adjacent temporal parts differ in intrinsic properties (e.g., fatigue-levels). But in this case, temporal adjacency contradicts gradient adjacency: the finish-line stage (earliest time) is maximally fatigued, while the start-line stage (latest time) is fresh. Thus, perdurantists must say Ada changes *backward*: she begins exhausted and becomes progressively fresher over time. This violates the gradient ordering (fatigue increases) embedded in the stages’ intrinsic properties and causal links.  

  Endurantists, meanwhile, treat Ada as wholly present at each time, possessing temporary properties via time-indexing (e.g., *fatigued-at-t*). For them, Ada changes iff she has incompatible properties at different times. Here, they too must prioritize temporal order: Ada is fatigued at the earliest time and fresh at the latest, again implying reverse change. Both views must ignore the gradient ordering to preserve their core commitment: that temporal position fixes the direction of change.  

  **(b) Can Perdurantism Explain Change Without Temporal Order?**  
  No. Perdurantism cannot reduce change to mere part-variation alone because it needs temporal order to define "adjacent" parts. The perdurantist typically orders parts via their temporal positions, but Ada’s case severs this link. If she instead orders parts along the gradient (e.g., fatigue levels), she faces a regress: the worm itself would then have "temporary" properties relative to that new ordering (e.g., the worm is *fatigue-ordered-at-gradient-position-g*), requiring a further ordering. Halting this regress at temporal order is arbitrary without independent justification.  

  Crucially, perdurantism’s parts-based explanation covertly relies on time. Without temporal order, "variation across parts" could align with *any* dimension (e.g., fatigue). But perdurantists define change temporally—e.g., "Ada gains fatigue" means fatigue increases along the *temporal* axis. In Ada’s case, this forces absurd change (fatigue decreases over time). To avoid this, the perdurantist must add temporal order as a primitive explanatory tool, mirroring the endurantist’s time-indexing.  

  **Contestable Assumption:** *This argument assumes that change is inherently temporal*. A perdurantist might retort that change is defined along *any* ordering (e.g., causal or gradient), so Ada changes along the gradient (fatigue increases) but not temporally. This is contestable because it divorces "change" from our ordinary concept (which ties it to time), rendering perdurantism revisionist and undermining its initial motivation (to explain temporal change via parthood).  

  **(c) Does Ada Arm the Endurantist?**  
  No. The case exposes a shared problem, not a new weapon. Both views must explain why temporal order, not gradient order, dictates the direction of change. The endurantist already indexes properties to times, presupposing temporal order as fundamental. The perdurantist, confronted with Ada, must do the same—either by privileging temporal position when ordering parts or by accepting that her theory cannot capture ordinary change without it.  

  This symmetry neutralizes the temporary-intrinsics argument. If perdurantists avoid a regress by stopping at temporal order, endurantists can do likewise by rejecting further indexation. Meanwhile, arguments from fission or vagueness apply equally to both: worms can fission, but so can enduring objects if they gain temporal parts; vague boundaries affect worms but also enduring objects over time. Thus, Ada underscores that the views are not substantively distinct: both ground change in temporal order, making their disagreement merely terminological (parts vs. indexing).  

  ---  
  ### 3. Marking Scheme (Total: 30 marks)  
  **Must-hit moves (Reasoning, not conclusions):**  
  - **(a1: 3 marks)** *Correctly identifies perdurantist’s position*: Ada changes backward (fatigue decreases over time) due to temporal ordering of stages.  
  - **(a2: 3 marks)** *Correctly identifies endurantist’s position*: Same as perdurantist—change is backward—due to time-indexing.  
  - **(a3: 4 marks)** *Notes symmetry*: Both prioritize temporal order over gradient order despite intrinsic/causal links.  
  - **(b1: 4 marks)** *Regress argument*: If perdurantist orders parts non-temporally (e.g., by fatigue), the worm has "temporary" properties relative to that order, restarting the problem.  
  - **(b2: 4 marks)** *Covert reliance on time*: Perdurantism implicitly uses temporal order to define "adjacent" parts/variation; mereology alone cannot distinguish temporal from gradient ordering.  
  - **(c1: 3 marks)** *No new argument*: Endurantist gains nothing because both views presuppose temporal order to ground change.  
  - **(c2: 3 marks)** *Collapse implication*: Case shows both views need temporal order as primitive, neutralizing temporary-intrinsics argument.  
  - **Resists bad move: 2 marks** *Does not dismiss case as impossible* (e.g., avoids "causation requires temporal order" or "physics forbids this").  
  - **Clarity/Structure: 4 marks** *Precise, well-organized, avoids digression*.  

  **Grading Standards:**  
  - **A (25–30 marks)**: Hits all moves; leverages Ada to expose core symmetries; challenges both views equally; acknowledges contestable assumptions (e.g., change’s temporality).  
  - **B (18–24 marks)**: Hits 5–7 moves but misses nuances (e.g., downplays symmetry in (a3) or regress in (b1)); may weakly assert collapse without argument.  
  - **C (10–17 marks)**: Superficial; recites labels (e.g., "perdurantism has temporal parts"); misses >3 moves; dismisses case; conflates theories.  

  **Common Errors per Move:**  
  - **a1/a2**: Claims perdurantist says Ada changes "forward" (along gradient) ignoring temporal inversion.  
  - **a3**: Treats views asymmetrically (e.g., "only perdurantism is forced to reverse change").  
  - **b1**: Neglects regress (e.g., "perdurantist can use causal order").  
  - **b2**: Asserts mereological variation suffices without justifying *why* time isn’t smuggled in.  
  - **c1/c2**: Claims Ada "refutes perdurantism" or "supports endurantism" without addressing shared presuppositions.  
  - **Bad move**: Calls case "incoherent" (e.g., "causation requires temporal sequence") or appeals to intuition/parsimony.  

  ---  
  **Rationale for Design**:  
  - The Ada case isolates temporal ordering as a presupposition by inverting it against all other "natural" orderings.  
  - Parts (b) and (c) force engagement with collapse by asking whether perdurantism *truly* reduces change to parts (it doesn’t) and whether endurantism *gains* from this (it doesn’t).  
  - The model answer’s "contestable assumption" (change’s temporality) rewards metacognition—top students will challenge it to defend perdurantism.  
  - Marks for resisting dismissal ensure engagement with the thought experiment’s metaphilosophical role.
