prompt: |-
  say i want a theory of shared intention i can actually *use* — not one that just sounds plausible in a seminar room. the use i have in mind: working out who is on the hook (blame, owed apologies, debts of aid and of consultation) when a group project goes sideways, in settings that are heirarchical, partly automated, and where people drift in and out mid-project. so write me the desiderata. what does an account of what it is for some people to share an intention and act together have to deliver, with the case behind each requirement, and for each one say whether you think it is genuinely non-negotiable or just a prejudice of one camp.

  the cases i keep tripping over and want handled:

  - the relay crew: five people on rotating shifts who are never all awake at the same time, each knowing only her own leg and that somebody came before and somebody comes after. is this one joint action or five? when does it start, who is in it, and what does 'in it' even mean for someone asleep in another timezone?
  - the infiltrator: someone who slots into a crew's plan perfectly, meshes subplans, is fully counted on by the others, but is secretly planning to blow the whistle and hopes the thing fails. does she share the intention that we J? I don't want the answer to just be 'no, because her end is different' — tell me what has to be true for that answer to fall out.
  - the checked-out member: someone who agreed to the plan, then quietly stopped caring, but kept showing up and doing his bit anyway. when does he stop being a member? can he exit alone, or does quitting need uptake from the others?
  - the stand-in: a piece of software, or a trained animal, that reliably fills a role in the plan because of how it was built or trained, with nothing intentional going on inside it. is it a member of the joint action? if your theory says 'obviously not, it has no intentions,' is that a real requirement or just the intentionalist camp's preference — and what does it cost you when a human's entire contribution was delegating her role to it?
  - nested crews: a team that is itself one participant inside a larger operation, where the team has nothing it intends over and above what its members intend. can a group be a member of a joint action without having a shared intention of its own?

  sort these into real requirements vs negotiable preferences: whether the theory has to work for agents who can't communicate and know almost nothing about each other's plans (so no full common knowledge); whether it has to be built out of individual intentions only or is allowed an irreducibly collective state; whether membership has to be all-or-nothing or can come in degrees; whether it owes a verdict in coerced cases — the junior person who 'intends that we J' only because refusing costs her her job; and whether it has to explain why shared intention carries that distinctive you-owe-me-a-say-before-you-change-course normativity instead of just being more individual intentions with more content.

  then tell me which single requirement knocks out the most otherwise decent theories, and flag any pair of desiderata you suspect can't be jointly satisfied. I'd rather have the list turn out to be jointly unsatisfiable than have you quietly drop one of my cases to make it come out clean.

  last thing, one short paragraph each on three candidate shapes — describe them rather than name them if you like: (a) shared intention as interlocking individual plans plus mutual responsiveness plus common knowledge, (b) shared intention as an irreducibly collective we-intend that isn't assembled out of I-intentions, (c) shared intention as a joint commitment that neither party can rescind unilaterally. just enough to see where each breaks. the list is the part i care about.
reasoning: |-
  Hmm, the user is asking for a practical theory of shared intention that can handle real-world complexities like hierarchical structures, automation, and fluid membership. They've outlined specific scenarios: the relay crew working in shifts, an infiltrator secretly sabotaging, a checked-out member, a non-human stand-in like software or an animal, and nested groups.

  They need desiderata that sort requirements from preferences, identify key trade-offs, and evaluate existing approaches. The user clearly values functional application over academic elegance.

  For the relay crew case, the core challenge is defining membership and continuity across disconnected agents. The infiltrator scenario tests whether mental states are necessary or just behavioral alignment. The checked-out member raises questions about exit conditions - passive withdrawal vs formal resignation. The stand-in forces us to grapple with whether intentionality is essential or if reliable function suffices. Nested crews challenge whether groups can be agents without collective mental states.

  The user also wants clarity on non-negotiables versus preferences: common knowledge requirements, ontological individualism, scalar membership, handling coercion, and explaining normative obligations. I suspect the normative obligation requirement might be the most challenging for many theories. There might also be a tension between accommodating automated agents and maintaining a robust concept of commitment.

  The three candidate approaches each have limitations: interlocking individual plans struggles with the relay case due to common knowledge requirements; irreducible we-intentions have trouble with nested groups; joint commitments can't easily handle unilateral exit by checked-out members.

  I'll organize this into clear desiderata with cases, flag non-negotiables, identify the requirement that eliminates most theories (likely normative force), note tensions (like non-human participants vs intentionality), and briefly analyze each approach.
answer: |-
  Here’s a set of desiderata for a usable theory of shared intention, grounded in your cases, with distinctions between non-negotiable requirements and negotiable preferences. The goal is *practical attribution of responsibility* in messy, real-world group actions.

  ### Core Desiderata (Non-Negotiable for Practical Use)

  1.  **Fluid Membership & Continuity:**
      *   **Case:** Relay Crew.
      *   **Requirement:** The theory must accommodate agents joining, leaving, or being temporarily inactive (asleep, offline) *without* dissolving the shared intention or requiring unanimous re-ratification. It must define what "being in" the joint action means for an inactive member (e.g., their role persists, obligations suspend but reactivate).
      *   **Non-Negotiable? YES.** Without this, the theory is useless for shifting teams, long projects, or distributed work. "In it" must mean occupying a role defined by the plan, not necessarily continuous active participation or awareness.

  2.  **Behavioral Fidelity Over Secret Motives:**
      *   **Case:** Infiltrator.
      *   **Requirement:** The theory must ground attributions primarily in reliable *behavioral contribution* and *outwardly expressed commitment* to the plan/sub-plans, not in hidden mental states. The infiltrator *is* a member (and thus on the hook) because she reliably *acts as if* sharing the intention, is *counted on* as such, and *fails* to meet the obligations flowing from that role (loyalty, non-sabotage). Her secret motive affects *culpability* (she's blameworthy for deception/sabotage) but not basic *membership* for responsibility allocation.
      *   **Non-Negotiable? YES.** We need to hold people accountable based on their role performance and how they presented themselves to the group, not mind-reading. The "share" in shared intention is fundamentally about the *public plan structure and reliance*, not private endorsement.

  3.  **Clear Exit Conditions:**
      *   **Case:** Checked-Out Member.
      *   **Requirement:** The theory must specify clear, practical criteria for when someone ceases to be a member. Key: **Effective, observable disengagement from the plan's interdependent structure.** This likely involves *both* a subjective withdrawal of intention/commitment *and* a cessation of reliable contribution (or a clear communication of exit). Merely "stopping caring" while reliably doing the bit isn't enough; he remains a member. Quitting requires *making his exit known* (to those relying on him) or *failing so consistently* that reliance ceases. Uptake isn't required for *exit* (he can unilaterally quit), but it *is* required for the *group to recognize and adjust* to the exit.
      *   **Non-Negotiable? YES.** We need to know when obligations cease. Reliable performance, even grudgingly, maintains membership; effective withdrawal (communicated or manifest) ends it.

  4.  **Accommodating Non-Intentional Role-Fillers:**
      *   **Case:** Stand-In (Software/Animal).
      *   **Requirement:** The theory must distinguish between *membership* in the shared intention and *role-filling* within the plan. The stand-in is **not** a member; it lacks the capacity for commitment, understanding obligations, or normative responsiveness. However, the *human who delegated* to it *is* a member, and her responsibility includes *vouching for the reliability of her delegate*. The stand-in's actions are *attributed to her role* within the joint action. The cost of saying "it's not a member" is low: responsibility rests entirely with the delegating human.
      *   **Non-Negotiable? YES.** We need to place responsibility on agents capable of understanding obligations. Delegation is a crucial human action within joint activity, but the delegate isn't a co-intender.

  5.  **Nested Groups without Group Minds:**
      *   **Case:** Nested Crews.
      *   **Requirement:** The theory must allow a group (e.g., Team Alpha) to function *as a single participant* ("Alpha") within a larger shared intention (e.g., Operation Beta) *without* requiring that Alpha itself possesses an irreducibly collective "we-intention" or group mind. Alpha's participation is constituted *entirely* by the shared intention and coordinated action *of its members* with respect to their role in Operation Beta. "Alpha intends to do X for Beta" is shorthand for "The members of Alpha share an intention that *they* (as Alpha) do X for Beta."
      *   **Non-Negotiable? YES.** Real-world hierarchies and task delegation require this. Attributing responsibility ultimately drills down to individuals within the nested group.

  ### Negotiable Preferences (Camps Differ)

  6.  **Common Knowledge/Communication:**
      *   **Preference:** *Not required* for core membership/responsibility. Relay crew members don't need common knowledge of each other's subplans, just awareness of their role and reliance on others for defined inputs/outputs. Mutual responsiveness suffices.
      *   **Cost of requiring it:** Makes Relay Crews, large organizations, or actions with secrecy impossible as shared intentions. *Preference leans towards MINIMAL mutual awareness/communication.*

  7.  **Ontological Individualism:**
      *   **Preference:** The theory *should* be built only from individual attitudes (intentions, beliefs, commitments) and their interrelations. Avoid irreducibly collective "we-intend" states.
      *   **Cost of rejecting it:** Risk of obscurity ("what *is* this group mind state?") and difficulty explaining how individuals enter/exit (Nested Crews, Checked-Out). *Preference leans towards INDIVIDUALIST.*

  8.  **Scalar Membership:**
      *   **Preference:** Membership *can* be all-or-nothing (you're "in" or "out" based on criteria like 1-4 above). Degrees of responsibility (blame, owed aid) can be handled by *role significance, contribution level, and culpability* within membership, not by degrees of membership itself.
      *   **Cost of requiring degrees:** Blurs accountability lines. When does "partly in" mean you owe an apology or consultation? *Preference leans towards BINARY membership.*

  9.  **Handling Coercion:**
      *   **Preference:** The theory *needs* to address it. The coerced junior member *is* part of the shared intention (she reliably acts, is counted on, commits outwardly) but her responsibility is mitigated (less blameworthy for participation itself, though not for specific harmful actions). The obligation to consult might still bind her (depending on role), but demanding fulfillment might be unreasonable.
      *   **Cost of ignoring it:** Fails a common real-world scenario. *Preference leans towards INCLUDING coercion, attributing membership but mitigating responsibility.*

  10. **Explaining Normative Force:**
      *   **Preference:** The theory *must* explain the distinctive "you-owe-me-a-say" normativity as arising intrinsically from the nature of shared intention itself, not just as additional individual promises. This normativity is key to obligations of consultation, loyalty, and mutual aid when things go wrong.
      *   **Cost of not explaining it:** Leaves a core feature of joint action (why it *feels* different, why obligations arise) unaccounted for, making responsibility attribution seem arbitrary. *Preference leans towards REQUIRING an explanation.*

  ### Key Trade-offs & Deal-Breakers

  *   **The Knockout Requirement:** **#10 (Explaining Normative Force).** Many otherwise plausible individualist, plan-based theories (#7a below) stumble here. They describe coordination but struggle to derive the *obligatory* "we're in this together" normativity from individual I-intentions alone. Theories that ignore this (#7b, #7c sometimes) provide less practical guidance for blame/apology/consultation debts.
  *   **Suspected Incompatible Pair:** **#2 (Behavioral Fidelity) + #10 (Normative Force).** Grounding membership solely in behavior/reliance (#2) makes it hard to intrinsically generate the strong normative "we-commitment" (#10) that feels distinct from mere coordinated I-intentions. The obligation seems to require something *more* than just reliable role-filling (like the infiltrator provides). Bridging this gap is a major challenge.

  ### Candidate Shapes - Brief Breakdown

  *   **(a) Interlocking Plans + Responsiveness + Common Knowledge (Bratman-esque):**
      > Individuals each intend the joint activity, intend to mesh subplans, mutually believe they have these intentions, and are mutually responsive. *Breaks on:* Relay Crew (no common knowledge, members not contemporaneously active), Infiltrator (has the required individual attitudes outwardly?), Normative Force (why does this create obligations? - often needs bolted-on promises), Stand-In (can't have the required intentions), Coercion (does the coerced agent truly "intend"?), potentially Nested Crews (common knowledge across levels?).

  *   **(b) Irreducible We-Intention (Searle/Gilbert-esque):**
      > A primitive "we intend" state is held by the group/collective, not reducible to individual I-intentions. Individuals participate by holding a derivative "I am part of we intend" attitude. *Breaks on:* Nested Crews (can a group without a mind "we-intend"?), Stand-In (can't hold any intention), Checked-Out Member (can one hold "I am part of we intend" without meaning it?), Ontological Individualism preference (relies on irreducible collective state), potentially Relay Crew (who holds the "we-intend"?).

  *   **(c) Joint Commitment (Gilbert-esque):**
      > Individuals jointly commit to intending as a body to do something together. Creates a normative structure where parties owe each other performance, consultation, and forbearance. Unilateral rescission is impossible. *Breaks on:* Checked-Out Member (can one unilaterally *withdraw* commitment internally? Gilbert says no, but practically?), Infiltrator (can outwardly commit while internally refusing?), Stand-In (can't commit), Relay Crew (how do you jointly commit with people you never meet? Commitment might need to be role-based), potentially Fluidity (is commitment renegotiated with each shift change?).

  The list *is* demanding, but the desiderata (#1-5 non-negotiable, #6-10 leaning towards minimalism, individualism, binary membership, coercion inclusion, and normative explanation) are not inherently unsatisfiable. The hardest bridge is between behavioral membership (#2) and robust normativity (#10). A theory focusing on **public, role-based commitments within a plan structure** that agents *hold each other to* via mutual reliance, where de facto participation creates normative bonds, might navigate these cases best. It would treat shared intention as a *social fact* of interdependent commitment and reliance, not just a mental state or a primitive collective entity.
