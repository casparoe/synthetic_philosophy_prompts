prompt: |-
  I'm a retired marine biologist — thirty years of North Sea benthic surveys — and now I finally have time to read, I've got into philosophy, mostly social choice theory after a shouting match at our natural history society. Here's what I actually need.

  I sit on the council of a small conservation trust, about forty members, and we settle maybe six things a year by vote: where the year's budget goes, which of three sites we bid on, who gets our little research grant, where the AGM is held. Whenever a result is close somebody says the rule was gamed, and we keep shopping for a voting rule that can't be gamed. Then I ran into the Gibbard–Satterthwaite theorem and worked out there probably isn't one, not with three or more options and no dictator. So don't explain the theorem to me again — what I want is something the council can run.

  Give me a procedure for choosing and stress-testing a voting rule given that every rule is manipulable somewhere: the questions in order, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to us because it's a values call rather than a technical one. Constraints: doable by volunteers in an afternoon with a spreadsheet, no software and no consultants; it has to work when we barely know how members will vote, since we vote by email all at once and the ballots are visible to the whole council afterwards; and it has to be honest about which assumption we're giving up when we give it up — squashing the options down so preferences line up on one dimention, using money or a lottery instead of a straight choice, cutting one decision into two, whatever else there is. It should also keep apart the question can this rule be gamed in principle from will it be gamed by people who don't know how anyone else is voting.

  Then run it on three of our recurring votes: picking the AGM venue, where everyone basically wants it near where they live and the options really do sit on a map; splitting the grants budget between three unrelated causes, where I can't see any single dimension they line up on; and our two-round system for the research grant, shortlist first then winner — I'm rather fond of that one and I suspect you're going to tell me it doesn't help. Finally, tell me what the procedure can't tell me, where it's silent, and where I'd be kidding myself if I thought it had settled something. And say plainly which step is doing the real work, because my guess is that most of it comes down to guessing what our members actually want rather than to anything in the theory.
reasoning: |-
  Okay, the user is a retired marine biologist with 30 years of experience in North Sea benthic surveys. They're now involved in a small conservation trust with about 40 members. They need a practical voting procedure for their council, given that every voting rule can be manipulated (as per Gibbard-Satterthwaite). They want a step-by-step process to choose and stress-test a voting rule, considering their constraints: volunteers, spreadsheet-only, no software or consultants, and email voting where ballots are visible afterward.

  First, I need to address their core request: a procedure to select a voting rule that acknowledges manipulability but minimizes risks. The user already knows the theorem, so no rehashing. They mentioned three specific votes: AGM venue (spatial), grants budget split (multi-dimensional), and research grant (two-round system). 

  Breaking down the procedure into steps seems essential. The user wants clear questions, decision points, and where to hand back to the council for value judgments. The constraints here are crucial—spreadsheet-only, volunteer-run. So the procedure must be feasible without complex tools. 

  For the AGM venue, since preferences are spatial, maybe spatial models like Euclidean distance could work. They need to check if options align on a line or plane. If they do, rules like Borda or Condorcet might be less manipulable. But if not, they might need to accept manipulability or use a different approach, like randomization.

  The grants budget split is trickier. No single dimension, so cardinal voting (like score voting) could help. But they need to ensure members can express intensities. If not, they might need approval voting or even a random ballot. The stress-test here would involve checking if adding a "compromise" option changes outcomes, indicating potential manipulation.

  For the research grant, their two-round system. G-S theorem implies both rounds can be manipulated. They need to test if the shortlist round truncates preferences. Maybe suggest a Condorcet method for the shortlist instead of plurality, but that might be complex for volunteers. Alternatively, approval voting in the first round could mitigate truncation.

  The user's deeper needs: they want to reduce conflicts and accusations of gaming. They need transparency so members trust the process. Also, practicality is key—volunteers with spreadsheets. They might also want to educate the council on why no perfect system exists, managing expectations.

  Assessing where the real work happens: Step 3 (preference mapping) and Step 6 (manipulation scenarios) are critical. These steps involve guessing voter preferences and testing manipulability, which relies on the council's understanding of their members. Without accurate preference models, the stress tests are just theoretical.

  What the procedure can't do: Predict actual manipulation likelihood, which depends on voter knowledge and willingness. It can't resolve deep value conflicts; those need council discussion. Also, it assumes honest reporting in the sensitivity analysis, which might not hold.

  Finally, for each vote type, the procedure might suggest different rules. AGM: spatial Borda or Condorcet. Grants: score voting if intensities are expressible, else approval. Research grant: keep two-round but use approval for shortlisting. Emphasize that trade-offs are inevitable, and the council must choose which flaw they tolerate.
answer: |-
  Here's a step-by-step procedure for your council to choose and stress-test a voting rule, grounded in reality and respecting Gibbard-Satterthwaite. It focuses on **diagnosing your specific decision context** rather than seeking perfection. The core insight is: **Manipulability is unavoidable, but its *practical risk* depends on voter preferences and decision structure.** The real work happens in Steps 3 & 6.

  **The Procedure: Diagnosing Your Democracy**

  1.  **Define the Decision & Options:**
      *   *Question:* What are we *really* deciding? List the concrete, mutually exclusive options (A, B, C...). Are new options likely next time?
      *   *Adequate Answer:* Clear statement of the choice and a fixed set of options (for now). *Stop if:* Options are undefined or constantly shifting.
      *   *Values Call:* Is the set of options itself fair/representative? (Hand back to council).

  2.  **Characterize Voter Motivation:**
      *   *Question:* What drives members' preferences? Is it primarily:
          *   **Spatial/Proximity?** (e.g., AGM location near home/work).
          *   **Ideological/Intensity?** (e.g., strong feelings for specific conservation causes).
          *   **Utilitarian/Benefit?** (e.g., which grant yields most scientific value per £?).
          *   **Tribal/Strategic?** (e.g., "beat the rival faction").
      *   *Adequate Answer:* Dominant motivation identified for *this specific vote*. *Stop if:* Motivations are deeply conflicting *and* members prioritize "winning" over "best outcome" (high manipulation risk regardless).
      *   *Values Call:* Are we comfortable with the dominant motivation? (e.g., Is "near me" an acceptable basis for AGM?).

  3.  **Map Preference Structure (The Critical Step - Real Work Here):**
      *   *Question:* How do preferences *likely* relate across options? Use historical votes, discussion, or best guesses.
          *   **Single-Dimension?** Can options be ordered left-to-right (politically) or near-to-far (spatially)? (e.g., AGM locations on a map likely are).
          *   **Multi-Dimensional?** Options represent distinct bundles (e.g., Grant Cause A = birds, B = insects, C = marine).
          *   **Condorcet Potential?** Is there likely one option beating all others head-to-head?
          *   **Intensity?** Are preferences strong/weak? Symmetrical? (e.g., "I *hate* venue X, love Y, am ok with Z").
      *   *Adequate Answer:* A plausible sketch of voter preference distribution (e.g., "Most prefer near home, distribution is unimodal near the centre", "Causes A & B have passionate minorities, C is broadly acceptable", "No Condorcet winner likely"). *Stop if:* Preferences are completely unknown *and* deeply polarized (too risky to choose *any* rule confidently).
      *   *Values Call:* Accepting the sketch involves judgment. Are we confident enough?

  4.  **Select Candidate Rule(s):** (Based on Steps 1-3)
      *   *Question:* Which rules *might* fit our context and minimize *practical* manipulation risk?
      *   *Options:* Consider these common types:
          *   **Majoritarian:** Plurality, Runoff (2-Round), Instant Runoff (IRV), Condorcet methods.
          *   **Cardinal:** Approval, Score (Range), STAR.
          *   **Other:** Borda Count, Random Ballot.
      *   *Guiding Principles:*
          *   **Spatial/Single-Dim:** Condorcet methods, Borda, Approval often perform well. Plurality/Runoff risky if preferences clustered.
          *   **Multi-Dim/Intensity:** Cardinal methods (Score, Approval, STAR) shine. Majority rules struggle.
          *   **Strong Condorcet Potential:** Condorcet methods ideal. IRV often good.
          *   **Broad Acceptability/Compromise:** Approval, Score, Borda.
          *   **High Polarization/Intensity:** Cardinal methods or Random Ballot (drastic!). Majority rules unstable.
          *   **Simplicity:** Approval, Plurality, Runoff.
      *   *Adequate Answer:* 1-3 candidate rules selected with justification based on preference structure. *Stop if:* No rule seems better than flipping a coin given the context.

  5.  **Define "Gaming" & Acceptable Flaws:**
      *   *Question:* What specific manipulation are we most worried about? What flaws *can* we tolerate?
          *   **Truncation?** Not ranking/rating honestly.
          *   **Compromising?** Boosting a lesser choice to beat a worse one.
          *   **Burying?** Ranking a strong rival low to help a weaker one.
          *   **Non-Monotonicity?** A vote *for* X causing X to lose.
          *   **Ignoring Intensity?** A broadly disliked option winning.
          *   **Chaos?** Small changes flipping the result.
      *   *Adequate Answer:* Clear statement of primary concern and acceptable trade-offs (e.g., "We'll tolerate some non-monotonicity to get Condorcet efficiency", "We *must* avoid results ignoring strong minority views"). *Stop if:* The required flaw tolerance violates core values (e.g., "Ignoring intensity is unacceptable" rules out Plurality/Runoff for grants).

  6.  **Stress-Test with Scenarios (Spreadsheet Time - Real Work Here):** Model plausible preference profiles based on Step 3. Test how candidate rules behave under honest voting *and* manipulation.
      *   *Example Tests (Use separate spreadsheet tabs):*
          *   **Sensitivity:** Shift 1-2 voters' ballots slightly. Does the winner change drastically?
          *   **Manipulation Simulation:**
              *   Have a "strategic" voter (or bloc) change their ballot to try and get a better outcome, *assuming they know the preference structure (Step 3) but not others' exact votes*. Can they succeed? How much gain?
              *   Test common tactics: Truncation, Compromising, Burying.
          *   **Condorcet Check:** If a Condorcet winner exists, does the rule pick it?
          *   **Majority Loser:** Does a majority-disliked option ever win?
          *   **Intensity Ignored:** Does the rule pick an option with weak support over one with strong minority support?
          *   **Add/Remove Option:** Does adding a similar option (spoiler) or removing a loser change the winner?
      *   *Adequate Answer:* For each candidate rule, document:
          *   Does it produce reasonable/sensible winners under honest votes?
          *   How vulnerable is it to manipulation *in these specific scenarios*?
          *   How stable is it to small changes?
      *   *Stop if:* All candidates perform unacceptably badly under stress tests for *this specific decision* (e.g., all are easily manipulated or produce chaotic results).
      *   *Values Call:* What level of manipulation risk or instability are we willing to accept? Is the "honest" result good enough?

  7.  **Choose & Implement:**
      *   *Question:* Given the stress tests, which rule offers the best trade-off for *this decision*?
      *   *Adequate Answer:* A rule is chosen, with clear instructions for voters (ballot format, how to fill it honestly/strategically if allowed). *Stop if:* Deadlock.
      *   *Values Call:* Accepting the trade-offs identified in Step 6.

  **Running the Procedure on Your Votes:**

  1.  **AGM Venue (Spatial):**
      *   **Step 1:** Options = Specific towns/halls (A, B, C). Fixed list.
      *   **Step 2:** Motivation = Proximity ("Near me!").
      *   **Step 3:** Structure = **Strongly Single-Dimension** (locations on a line/plane). Preferences likely unimodal (cluster near centre) or uniform spread. Condorcet winner likely exists.
      *   **Step 4:** Candidates = Condorcet method (e.g., Copeland, Minmax), Borda Count, Approval.
      *   **Step 5:** Concern = Truncation/Burying distorting spatial fairness. Tolerate some complexity.
      *   **Step 6:**
          *   *Honest:* All candidates pick centrist locations. Condorcet/Borda better reflect strength of ordering than Approval.
          *   *Manipulation (Spreadsheet):* Voter far left ranks B (centre-left) last instead of middle to try and get A (far left) to win. In Condorcet/Borda, this might backfire, making C (centre-right) win instead of B. Approval is harder to manipulate spatially if voters approve a range. Stability good.
      *   **Recommendation:** **Borda Count** (Simple, reflects ordering well, decent spatial performance) or **Approval** (Very simple, robust to some manipulation). *Avoid:* Plurality/Runoff (spoiler effect likely!).

  2.  **Splitting Grants Budget (Multi-Dim/Intensity):**
      *   **Step 1:** Options = Allocate budget to Cause A, B, or C. Mutually exclusive.
      *   **Step 2:** Motivation = Ideological/Intensity ("My cause matters most!").
      *   **Step 3:** Structure = **Multi-Dimensional** (A, B, C unrelated). Preferences clustered (passionate minorities for A & B, lukewarm majority for C). Intense preferences. No Condorcet winner likely (A vs B: C supporters swing it).
      *   **Step 4:** Candidates = Score Voting (e.g., 0-5), Approval, STAR.
      *   **Step 5:** Concern = Ignoring intensity (C wins despite A/B minorities hating it), Truncation (voters min/maxing). Tolerate cardinal scores.
      *   **Step 6:**
          *   *Honest:* Score/STAR allows expression of intensity. C likely wins if majority preference is strong, but low scores from A/B fans show discontent. Approval might elect C easily.
          *   *Manipulation:* Supporters of A give B=0, C=0 (min-max). This hurts C, helping A. Can be effective. Adding a compromise cause D might split C's vote. Stability medium.
      *   **Recommendation:** **Score Voting (0-5)** (Best for capturing intensity). *Alternative:* **Approval** (Simpler, but loses some intensity info). *Avoid:* Any majority/ranked rule - likely to elect C while ignoring strong opposition from A/B minorities, *or* be highly manipulable by C supporters ranking the weaker opponent last.

  3.  **Research Grant (Two-Round System):**
      *   **Step 1:** Options = Candidates (X, Y, Z...). Shortlist (e.g., top 2 by plurality) then majority winner.
      *   **Step 2:** Motivation = Utilitarian/Benefit ("Best science!") + some tribal loyalty.
      *   **Step 3:** Structure = **Likely Multi-Dim** (Different projects). Moderate intensity. Condorcet winner *might* exist. Key risk: Strong candidate eliminated in 1st round due to vote splitting.
      *   **Step 4:** Candidates = Current system (Plurality -> Majority Runoff), IRV, Condorcet (e.g., Ranked Pairs), Approval (for shortlist).
      *   **Step 5:** Concern: Vote splitting in 1st round ("Burial" of strong Condorcet candidate), Truncation. Tolerate complexity for better winner.
      *   **Step 6:**
          *   *Honest:* Current system can eliminate Condorcet winner in 1st round if support is split. IRV/Condorcet less prone. Approval shortlist (top 2 by approval) less prone to splitting.
          *   *Manipulation (1st Round):* Supporters of strong candidate Y might bullet vote for Y instead of also approving similar candidate X, hoping Y makes top 2 alone. If they approve both, X might beat Y. Complicated! Burial: Y supporters rank strong rival Z last, helping a weaker candidate beat Z for 2nd spot. Possible in all ranked systems. Stability medium.
      *   **Recommendation:** **Modify 1st Round to Approval Voting.** Top 2 by approval proceed. This drastically reduces vote-splitting risk compared to plurality. Keep 2nd round majority vote. *Alternative:* **Single-seat Condorcet method** (e.g., Ranked Pairs) if council can handle complexity. *Keep but Improve:* Current system is flawed but familiar; Approval 1st round is a major upgrade. Avoid pure Plurality.

  **What the Procedure CANNOT Tell You (The Limits):**

  1.  **Actual Manipulation Likelihood:** It assesses *vulnerability* based on *assumed* preferences. The *real risk* depends on:
      *   Voters' *knowledge* of the preference structure and rule mechanics.
      *   Voters' *willingness* to manipulate (ethics, effort, perceived gain).
      *   *Actual* preference distribution (your guess in Step 3 might be wrong).
  2.  **Perfect Fairness:** Gibbard-Satterthwaite stands. You *are* choosing which flaw to accept. The procedure makes this choice explicit and contextual.
  3.  **Resolving Deep Value Conflicts:** If members value fundamentally different things (e.g., "science impact" vs. "local engagement" for the grant), no voting rule can reconcile this. The procedure might reveal this impasse (Steps 2/3/5), forcing a values discussion.
  4.  **Predicting the Future:** Preferences and options change. A rule good for one vote on Cause A/B/C might be terrible next year with Causes D/E/F.
  5.  **Voter Honesty in Sensitivity:** Step 6 relies on *honest reporting* of assumed preferences for sensitivity/manipulation tests. Strategic testers could bias the model.
  6.  **The "Best" Outcome:** It helps avoid bad outcomes and manipulation, but doesn't guarantee the utilitarian or "truest" winner, especially in multi-dimensional spaces.

  **The Real Work:** As you guessed, **Steps 3 (Mapping Preference Structure) and 6 (Stress-Testing with Scenarios)** are where the rubber meets the road. This is fundamentally about **modeling your group's likely desires and interactions**, not abstract theorem-proofing. The quality of your council's insights here determines the procedure's value. Spreadsheets are perfect for this modeling – list voters, assign plausible rankings/scores based on Step 3, apply the voting rules, and play "what if".

  **Conclusion:** This procedure forces your council to confront the *nature* of each decision and your *own members' likely behavior* before choosing a rule. It replaces the futile search for an "ungameable" rule with a structured assessment of *which vulnerabilities matter least* for *this specific vote*. By making assumptions and trade-offs explicit, it builds understanding and legitimacy, even when the result isn't perfect. The spreadsheet work in Step 6 is the crucial reality check, turning theory into practical insight for your unique group. Good luck with the conservation efforts!
