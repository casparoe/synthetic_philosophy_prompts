prompt: |-
  I'm writing up a paper on the rationality side of normative theory, and I'd be grateful for an adjudication of an argument that broke out in our decision-theory reading group last week and that nobody managed to settle.

  The case under discussion was Parfit's hitchhiker: a traveller stranded in the desert is offered a lift to town by a driver who extracts a promise of £1,000 on arrival; once in town the traveller will never see the driver again, the promise is unenforceable, and (on the assumption that self-interest is all he has reason to care about) he has no reason to pay. Two members of the group, Yusuf and Hanne, argued as follows.

  **Y1.** The interesting conclusion is not "he should pay" but that the self-interest theory is indirectly self-defeating: in the desert it tells him to acquire a disposition to pay; in town it tells him to act against that disposition. So the case shows that rationality can require irrationality — it can be rational to bring it about that you will later do what you will then have no reason to do.

  **H1.** That is not irrationality; it is an ordinary commitment problem solved internally. If the disposition is simply a strong desire to keep one's promises, then paying in town maximises expected utility relative to his desires, and on the desire-based account that is what rationality consists in. Nothing has been shown about rationality condemning what rationality recommends. You have changed the inputs, not the theory, and the word "irrationality" is doing no work.

  **Y2.** A reliable disposition must be one he cannot switch off at will, and the real claim concerns belief, not desire: the hitchhiker is supposed to believe that he has a decisive reason to pay, and that belief is false. So paying is irrational relative to the reasons he actually has, and the case concerns the gap between "rational" in the reason-responsive sense and "rational" in the desire-satisfying sense — rationality in the first sense requiring a violation of rationality in the first sense.

  **H2.** Two problems. (a) Transparency: the device must survive his knowing that it is a device, yet he is the one installing it and he can simply reconsider in town. And if the fix is "and be disposed not to reconsider," the package becomes far more expensive and far more global — a standing policy of not thinking clearly about one's own promises. (b) Selectivity: promise-keeping dispositions are not desert-specific. The general disposition will cost him much more than the lift is worth.

  **Y3.** Those are cost objections, not refutations; the claim was never that the disposition is always worth acquiring. Nor is transparency fatal: some dispositions are recalcitrant — guilt, shame, loyalty — and are not cancelled by the knowledge that they were installed. Consider the case where a benefactor pays you a million tonight merely for having formed, by tomorrow morning, the intention to drink a harmless but unpleasant toxin tomorrow, knowing that when tomorrow comes you will have no reason to drink. The question there is whether one can intend at will and whether such intentions survive full transparency, and the answer is not obviously no.

  **H3.** Then take a harder variant — the "briefed hitchhiker." Suppose the driver is an excellent predictor and stops only for someone who would still pay after being told, on arrival: "you now have no self-interested reason to pay, nothing will come of not paying, and I am briefing you precisely so that you know this." No false belief can now do any work: the hitchhiker knows everything and must still pay. What the driver is selecting for is therefore not irrationality but a non-instrumental concern — with having promised, with the driver, with being a certain kind of person. If the hitchhiker has that concern, paying is rational by his own lights; if he lacks it, no amount of rational irrationality manufactures it. The case shows that some ends carry a selection advantage, not that rationality requires irrationality.

  **Y4.** But "whatever you care about is rational by your own lights" empties the notion of rationality, and you cannot help yourself to your own theory of rationality in order to argue that rationality never requires irrationality — that is exactly what is in dispute. And the briefed hitchhiker refutes nothing; it describes the successful end state of the disposition. The hitchhiker begins by needing to pay and ends up caring about paying. That transformation is precisely what the rational irrationality was supposed to engineer.

  **H4.** I am not assuming a theory of rationality; I am charging equivocation. "Rational" in your desert premise means "there is most reason to acquire the disposition"; "irrational" in your town premise means "does not maximise expected utility given his desires." Those are two different senses. Use either one consistently and the paradox dissolves: either paying is not irrational (desire sense), or acquiring the disposition is not rational (reasons sense — you have no reason to bring about your doing what you have no reason to do).

  **Y5.** The equivocation charge assumes that a reason cannot bear on a state rather than on an act, and that reasons cannot be self-effacing. But they plainly can: there are reasons to be spontaneous, reasons to trust, reasons to have desires one should not act on. A person can have most reason to be in a state whose exercise is locally unsupported by his reasons, and that local failure is exactly what the state-level reason was a reason for. Once you allow state-given and self-effacing reasons, the two senses stop pulling apart and there is no equivocation — only a real and uncomfortable feature of practical reason.

  **H5.** Self-effacement has limits, though. A reason to be in a state S is genuinely self-effacing only where S's exercise is not something you have independent reason to avoid — spontaneity and trust are like that. But here the self-interest theorist's verdict on the exercise is not silence, it is condemnation: in town the hitchhiker has most reason *not* to pay. So the state-level reason is a reason to be in a state whose exercise you have most reason to avoid, and it is far from clear that the spontaneity analogy covers that case rather than merely resembling it.

  At that point the seminar ran out of time. I honestly cannot tell who had the better of it; each of them made at least one point I want to keep, and each seemed to me to overreach somewhere I can't quite locate. Please adjudicate the exchange rather than the underlying literature: no appeals to authority, published positions, or what "the standard view" is — argue from the arguments as made.

  Please structure your reply as follows.

  1. "Verdict at a glance" — 80–120 words. Who is more right overall, on what, and by how much.
  2. "Move-by-move adjudication" — 800–1,000 words. One paragraph of roughly 70–100 words for each of the ten moves, in the order Y1, H1, Y2, H2, Y3, H3, Y4, H4, Y5, H5. Open each paragraph with a rating on a five-point scale (clearly right / mostly right / mixed / mostly wrong / clearly mistaken), then say what the move establishes, where it overreaches, and — where relevant — whether it succeeds only against a weakened version of the other side's actual claim.
  3. "The crux" — 200–250 words. Identify the single distinction or background assumption that the whole dispute turns on, and explain why each side's position follows from their verdict on it.
  4. "What both are missing" — 200–250 words. The consideration neither party raised that most changes the shape of the dispute.
reasoning: |-
  Okay, the user is working on a paper about rationality in normative theory and needs help adjudicating an argument from their reading group about Parfit's hitchhiker case. The debate between Yusuf and Hanne revolves around whether rationality can require "irrationality" - specifically whether it can be rational to create a disposition that later leads to an action one has no reason to perform.

  First, I need to understand the core of their disagreement. Yusuf argues that self-interest theory is indirectly self-defeating: it requires acquiring a disposition in the desert that later demands acting against that disposition in town. This shows rationality can require future irrationality. Hanne counters that it's just a commitment problem solved internally through changed desires, not true irrationality. She emphasizes desire-based rationality where paying maximizes utility given new desires.

  Looking at their exchange:
  - Y1 introduces the self-defeating nature of self-interest theory.
  - H1 reframes it as changing inputs (desires) rather than the theory.
  - Y2 shifts to belief and reasons, arguing the hitchhiker falsely believes he has reason to pay.
  - H2 raises transparency and selectivity objections - can such dispositions survive full knowledge?
  - Y3 counters with examples of recalcitrant emotions and Kavka's toxin puzzle.
  - H3 introduces the "briefed hitchhiker" variant to show it's about non-instrumental concerns, not irrationality.
  - Y4 accuses Hanne of emptying rationality's meaning and claims the briefed case is the end state of disposition engineering.
  - H5 charges equivocation between different senses of "rational."
  - Y5 defends state-given reasons and self-effacement.
  - H5 questions whether self-effacement applies when there are strong reasons to avoid the action.

  The key dispute seems to hinge on whether rationality has a unified standard across time or is fragmented into local vs global perspectives. Yusuf sees rationality as potentially fragmented, allowing for global reasons that justify locally irrational states. Hanne insists on a unified desire-based framework where all rational actions cohere with current desires.

  Neither addresses the metaethical foundations clearly. They don't examine whether "reasons" exist independently of the agent's psychology or whether rationality must be transparent to the agent. The distinction between objective and subjective rationality is also underexplored - what an agent should do versus what seems rational given their limited knowledge.

  For my response structure:
  1. Verdict: Hanne is mostly right about no true irrationality, but Yusuf scores points on state-given reasons. The paradox dissolves under consistent frameworks.
  2. Move-by-move: Will rate each exchange, noting where claims overreach (e.g., Y2's false belief assumption, H3's briefed case refutation).
  3. Crux: The fragmentation vs unification of rationality standards across time.
  4. Missing element: The nature of reasons - are they desire-dependent or objective? Also the difference between subjective and objective rationality.

  The adjudication should remain grounded in their arguments without appealing to external authorities, focusing on logical coherence. I'll maintain neutral academic tone while making clear judgments on each move.
answer: |-
  ### 1. Verdict at a Glance  
  Hanne is **mostly right overall** (60-70%), successfully exposing Yusuf’s inconsistent framing of "rationality" and showing the hitchhiker case reduces to a conflict between local and global rationality within a unified desire-based framework. Yusuf scores points on state-given reasons (Y5), but his core claim—that rationality *requires* irrationality—collapses under Hanne’s equivocation charge (H4). The paradox arises only when mixing senses of "rational": using one consistently (desire-satisfaction or reason-responsiveness) dissolves it. Hanne’s transparency/selectivity objections (H2–H3) weaken Yusuf’s dispositional solution, though her dismissal of self-effacing reasons (H5) slightly overreaches.

  ---

  ### 2. Move-by-Move Adjudication  

  **Y1: Clearly mistaken**  
  Yusuf’s "indirectly self-defeating" framing misstates the issue. Self-interest theory *does* recommend acquiring the disposition in the desert (global rationality) and *not* paying in town (local rationality), but these are temporally distinct prescriptions, not a contradiction. Claiming this shows "rationality requires irrationality" conflates rationality *at different times* and smuggles in a non-desire-based standard. It establishes only that long-term rationality may demand short-term suboptimal acts—a familiar commitment problem, not a paradox.  

  **H1: Mostly right**  
  Hanne correctly reframes the case as an internal commitment solution: if the hitchhiker’s desires shift (e.g., to value promise-keeping), paying maximizes utility *relative to new inputs*. This exposes Yusuf’s equivocation—calling paying "irrational" implicitly assumes unchanged desires, but the disposition *alters* desires. She overreaches slightly by assuming desire-satisfaction exhausts rationality (ignoring reason-responsiveness), but her core point stands: Yusuf’s "irrationality" is undefined without specifying the standard.  

  **Y2: Mostly wrong**  
  Yusuf’s shift to belief/reasons is strategic but flawed. He insists paying requires a *false belief* in decisive reasons, but Hanne’s H1 already undercuts this: if desires change, the belief "I have reason to pay" may be *true* (if reasons are desire-dependent). The "gap" between reason-responsive and desire-satisfying rationality is real but irrelevant here—Yusuf hasn’t shown why desire-satisfaction isn’t reason-responsive. This move only works against a strawman where desires are static.  

  **H2: Mostly right**  
  Hanne’s transparency and selectivity objections are potent. If the hitchhiker knows the disposition is instrumental, reconsideration in town is likely—undermining reliability. Her selectivity point (general promise-keeping costs) highlights that Yusuf’s solution isn’t universally rational but context-dependent. She overreaches by implying these *refute* Yusuf rather than weakening his case: costs don’t negate rationality in *this* instance, but transparency does challenge how "recalcitrant" such dispositions can be.  

  **Y3: Mixed**  
  Yusuf fairly notes H2’s objections are about costs/reliability, not impossibility, and Kavka’s toxin case aptly shows intentions *can* survive transparency. However, he conflates *intending* (toxin) with *believing* (hitchhiker). The toxin case involves no false belief—only an intention to act irrationally later—whereas Yusuf’s hitchhiker allegedly needs false beliefs. This weakens his analogy: transparency might defeat belief-based dispositions but not intention-based ones.  

  **H3: Clearly right**  
  Hanne’s "briefed hitchhiker" lands decisively: if the driver selects for paying *despite full knowledge*, the hitchhiker must have a non-instrumental concern (e.g., integrity), making paying rational *by his own lights*. Yusuf’s "irrationality" vanishes—no false belief is possible or needed. Hanne correctly identifies the driver’s filter as *genuine values*, not manufactured irrationality. Yusuf’s reply (Y4) misconstrues this as the "end state" of dispositional engineering when it is evidence against it.  

  **Y4: Mostly wrong**  
  Yusuf accuses Hanne of emptying rationality, but this misfires. Hanne isn’t assuming desire-satisfaction as the *correct* theory; she’s noting Yusuf *shifts standards* between premises. His "transformation" claim (caring about paying after engineering) assumes the disposition creates new reasons, but Hanne’s briefed case shows this "care" must be preexisting or else the driver couldn’t select for it. Y4 thus begs the question against H3.  

  **H4: Mostly right**  
  Hanne’s equivocation charge is compelling: Yusuf uses "rational" in the desert (reasons to acquire dispositions) and "irrational" in town (desire-based failure) as if synonymous. Using one standard consistently—e.g., desire-satisfaction globally—shows paying *is* rational (if desires change), or reason-responsiveness shows no reason to acquire the disposition *if* it leads to reasonless acts. She slightly underplays how Y5’s state-given reasons might bridge the gap, but H4 stands as a critical clarification.  

  **Y5: Mostly right**  
  Yusuf’s defense of state-given/self-effacing reasons is strong: reasons to be spontaneous or trusting *do* justify states whose exercises lack local support. This rebuts Hanne’s H4 by showing a unified "reasons sense" could apply to both acts and states, dissolving equivocation. But he overreaches by implying this covers the hitchhiker: spontaneity involves *no reason to avoid* the act, whereas paying has *strong reasons against it* (H5’s riposte).  

  **H5: Mostly right**  
  Hanne correctly limits Y5’s analogy: self-effacing reasons (e.g., for spontaneity) apply only when the local act isn’t *condemned* by reasons. In the hitchhiker’s case, self-interest theory says he has decisive reason *not* to pay—making a reason to acquire a disposition that *causes* this act deeply paradoxical. Her distinction is sound, but she underdevelops why this paradox is fatal—e.g., it may show self-interest theory is flawed, not that state-given reasons fail.  

  ---

  ### 3. The Crux  
  The dispute turns on **whether rationality must be unified across time or can be fragmented into local/global layers**. Yusuf sees rationality as fragmented: global rationality (desert) can prescribe creating a state that guarantees local irrationality (town), via state-given reasons. Hanne insists rationality is unified: if a disposition is globally rational, its exercise must be locally rational under a consistent standard (e.g., desire-satisfaction or reason-responsiveness). Her position follows because fragmentation (e.g., "rational to cause irrationality") *requires* shifting standards—exposed by her equivocation charge (H4). Yusuf’s view follows only if state-given reasons can override local condemnation (Y5), but Hanne (H5) shows this clashes with core rational norms, rendering the theory incoherent. Thus, Hanne wins by default: without equivocation, the paradox dissolves.  

  ---

  ### 4. What Both Are Missing  
  Neither addresses **the metaethical status of "reasons."** If reasons are desire-dependent (subjectivist), Hanne wins trivially: post-disposition desires make paying rational, full stop. But if reasons are objective (e.g., based on well-being), Yusuf’s fragmentation gains traction: the hitchhiker *should* acquire the disposition (globally rational for well-being) but *should not* pay (locally irrational for well-being), creating tension. Here, state-given reasons *might* resolve it—e.g., "reason to be promise-keeping" as a component of well-being. Conversely, if reasons require **transparency to the agent**, Hanne’s briefed hitchhiker becomes fatal: a reason to adopt a disposition that *requires* ignorance or false belief is suspect. This ambiguity leaves both positions incomplete: Yusuf assumes objective reasons but ignores their transparency demands; Hanne assumes desire-dependence but doesn’t defend it. The hitchhiker’s challenge is less about rationality requiring irrationality and more about **whether objective reasons can be self-effacing when local acts undermine global goals**—a problem for moral theories (e.g., utilitarianism), not rationality per se.
