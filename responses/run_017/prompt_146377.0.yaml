prompt: |-
  I'm finishing a thesis chapter on what matters in survival, and I want to attribute a definite view to my doctoral supervisor, who works broadly in the Parfitian tradition but has never published on personal identity — everything I have is from supervisions and a graduate seminar, so there is nothing to look up, and what I need is the argument rather than a reference. Her verdicts so far, each delivered with real confidence: ordinary teletransportation (scan, destroy the original, rebuild from new matter) — you survive, and nothing that matters is lost; fission into two qualitatively identical replicas — you survive as both, nothing that matters is lost, the question of which one is you is empty, and when pressed she will say only that fission is in no way worse than ordinary survival, pointedly refusing to say whether it is better; gradual neuron-by-neuron prosthetic replacement over ten years — full survival, not even slightly diminished; the combined spectrum, where the single resulting person's psychology is at every stage half yours and half someone else's — survival here is partial, roughly halfway, and admits of degrees; a fusion of two distinct people, whose memory traces are both written into one successor body and whose originals are destroyed — each survives only partially, about halfway; a blueprint stored unused for two centuries and then instantiated once — you survive, and although the disorientation and the lost relationships make it a worse prospect, there is no threshold at which the length of the gap turns survival into death. She also insists throughout that the non-branching clause is doing work only in the identity question, never in the question of what matters.

  The case I want to put to her is a staggered fission with reconvergence, and I can't work out what her principles commit her to. At t0 you are scanned and your body is destroyed. Replica A is built immediately from the blueprint and lives normally. Replica B is built from the same blueprint forty-eight hours later, so that for two days A is the only continuer; after that the two live in parallel for a year in different cities, having quite different experiences. At the end of the year both are scanned, a single successor M is constructed whose brain carries the memory traces of both streams — M remembers living both lives — and A and B are destroyed. There is also a variant in which the transfer is asymmetric: M receives all of A's traces but only half of B's, the remainder discarded at random. My questions: how much of what matters survives, relative to ordinary survival, during the first forty-eight hours, during the parallel year, and after the merge; whether the forty-eight-hour stagger changes anything at any stage; whether the merge is a gain, a loss or a neutral event; how the person at t0 should distribute prudential concern over A's and B's experiences during the parallel year; and whether, from the standpoint of the person at t0, it would be better for B never to have been built, better for B to be built and merged, or better for the two simply to continue in parallel.

  I can see that more than one rule fits everything she has said so far — roughly, a best-candidate rule on which what matters is fully preserved whenever some successor bears full psychological continuity to me, a conservation rule on which the total is fixed and divided among competing branches, and a summation rule on which branching multiplies what matters — but I cannot get them to come apart on her existing verdicts, and I suspect two of them survive the staggered case as well. Please organize the reply in five sections, in this order: (1) "Candidate rules" — the two or three most general principles consistent with all seven verdicts, each stated in a form I could formalize (~250 words); (2) "Predictions" — what each rule implies about the staggered case at each of the three stages, about the asymmetric variant, and about the distribution of prudential concern (~350 words); (3) "Her verdict" — your best guess at what my supervisor would say, with the reasons for preferring one rule, and an explicit note on any of her remarks you are discounting as throwaway (~300 words); (4) "What turns on it" — whether the difference between the surviving rules has any real consequence for anticipation or self-concern, or is mere bookkeeping (~200 words); (5) "The discriminating case" — the single further case I should put to her to separate the survivors, with what each predicts (~200 words).
reasoning: |-
  Hmm, the user is working on a thesis chapter about survival and personal identity, specifically in the Parfitian tradition. They need to attribute a view to their doctoral supervisor who hasn't published on this topic, so they have to infer her stance from supervision notes and seminars. They've provided several of her verdicts on thought experiments and now want to apply her principles to a new case involving staggered fission with reconvergence.

  Looking at the supervisor's positions: She fully endorses survival in standard teletransportation and fission cases, sees neuron replacement as full survival, believes in degrees of survival in combined spectrum and fusion cases, and accepts blueprint survival regardless of time gap. Crucially, she thinks non-branching only matters for identity questions, not for what matters in survival.

  The user has designed a complex thought experiment with three phases: initial creation of Replica A, delayed creation of Replica B after 48 hours, a year of parallel existence, and finally a merger into M who inherits both memory streams. There's also an asymmetric variant where M gets all of A's memories but only half of B's.

  I need to identify candidate principles that explain all seven verdicts. The conservation rule (fixed "matter" divided among branches) and summation rule (branching multiplies "matter") both fit, but the best-candidate rule (what matters is preserved through any continuous branch) might have trouble with the fusion case where survival is partial.

  For predictions: During the initial 48 hours, all rules would agree that what matters is fully preserved in A since there's no branching yet. During the parallel year, conservation would say each replica has half of what matters, while summation would say both together have double. After merger, conservation would see it as restoring the full amount, while summation would consider it a reduction from double to single. The asymmetric variant creates interesting fractional differences.

  I suspect the supervisor would lean toward conservation because it naturally handles the partial survival in fusion cases and avoids the counterintuitive implications of summation. The 48-hour delay probably doesn't change anything significant since branching timing isn't fundamental in her view.

  The practical difference between these rules matters for how the original person should distribute concern: Under conservation they'd care equally about both branches during the parallel phase, while under summation they might care more in total but equally per branch.

  To distinguish these views, I propose a "serial fusion" case where multiple fusions happen sequentially. Conservation would show diminishing survival with each fusion, while summation would maintain full survival throughout. This cleanly separates the two approaches.

  The user seems deeply engaged with these conceptual distinctions and wants to accurately represent their supervisor's view while advancing their own thesis work. I'll structure my response exactly as requested: candidate rules, predictions, likely verdict, practical implications, and finally a discriminating test case.
answer: |-
  Here is the analysis structured as requested:

  ### (1) Candidate Rules (~250 words)

  Three general principles consistent with all seven supervisor verdicts are:

  1.  **Conservation of "What Matters" (C):** There is a fixed quantum (normalized to 1 for ordinary survival) of prudential concern/survival-value associated with a person at t0. This quantum is conserved over time and distributed among all branches bearing R-related psychological continuity (where R includes psychological connectedness and/or continuity, as per Parfit). Branching divides the quantum; merging recombines it. Degrees of survival reflect the proportion of the original quantum present in a successor. Identity is distinct and determined by non-branching continuity (explaining the refusal to say fission is "better"). *Formalizable as:* `WM(t0, S) = Σ_i [ (C_i / C_total) * WM_i ]` where `WM(t0, S)` is the total "what matters" from t0 in successor S, `C_i` is the strength of psychological connection from t0 to S via branch i, and `C_total` is the sum of `C_i` across all branches existing at the time of assessment. For full continuity branches, `C_i / C_total ≈ 1/n` for n branches.

  2.  **Summation of "What Matters" (S):** What matters is defined by the existence of psychological continuity (R). Each distinct R-relation to a future person preserves the *full* quantum of prudential concern associated with that relation. Branching creates multiple, equally valid targets for full prudential concern; merging creates a single target inheriting the sum of the concerns from the merging branches. Degrees of survival arise when the continuity relation itself is partial (e.g., combined spectrum). Identity is determined by non-branching R, but "what matters" multiplies with branching. *Formalizable as:* `WM(t0, S) = Σ_b [ R_b(t0, S) ]` where `R_b(t0, S)` is the strength of the R-relation from t0 to S via branch path b (1 for full continuity, 0.5 for half, etc.). The value for a *stage* is the sum over all *existing* successors at that time.

  3.  **Best Candidate (BC):** What matters is fully preserved (WM=1) as long as there exists *at least one* future person bearing full, non-deviant psychological continuity (R) to the original. Branching doesn't diminish WM for the original; each branch is a full survival *for the original*. Degrees of survival only occur when *no* successor has full R (e.g., combined spectrum, fusion). Identity is determined by non-branching R, but "what matters" isn't reduced by branching. *Formalizable as:* `WM(t0) = 1` at time t if ∃ S at t such that `R(t0, S) = 1`. If ∄ S with `R(t0, S) = 1`, then `WM(t0, S) = max_R(R(t0, S))` for each S (where `max_R` is the max R-strength to S).

  ### (2) Predictions (~350 words)

  *   **First 48 Hours (Only A exists):**
      *   **C:** WM = 1 (A is the sole branch, holds full quantum).
      *   **S:** WM = 1 (One full R-relation to A).
      *   **BC:** WM = 1 (A has full R-continuity).
      *   *All agree: Full survival.*

  *   **Parallel Year (A & B exist):**
      *   **C:** WM total = 1. WM for A = 0.5, WM for B = 0.5 (Quantum split equally between two full branches). Prudential concern: t0 should care equally about A and B's experiences, distributing concern proportional to the WM share (50%/50%).
      *   **S:** WM total = 2 (Two full R-relations: one to A, one to B). WM for A = 1, WM for B = 1 (Each is a full target). Prudential concern: t0 has *full* prudential concern for *both* A and B independently. They should care fully about each one's experiences.
      *   **BC:** WM = 1 (Both A and B have full R-continuity; existence of one is sufficient). Prudential concern: t0 has full prudential concern for both A and B (since both are "best candidates").
      *   *Delay Impact:* None for any rule. Branching timing irrelevant; only existence matters.

  *   **After Merge (M exists, A & B destroyed):**
      *   **C:** WM = 1 (The two branches re-converge, quantum recombined into M). *Merge Event:* Neutral (quantitatively, 0.5 + 0.5 = 1). No net loss/gain of WM.
      *   **S:** WM = 1 (M inherits the sum of the R-relations: R(t0, M via A) + R(t0, M via B) ≈ 1 + 1 = 2? *But* R-relation strength to M depends on the *integration* of memories. If M has *both* full memory streams integrated, `R(t0, M via A)` ≈ 1 and `R(t0, M via B)` ≈ 1, so WM = 2. If integration is imperfect, less. *Merge Event:* Significant *loss* (from total WM=2 during parallel phase to WM=2 for M, but *only if WM=2 is accepted*. Alternatively, if relation to M is seen as a *single* complex R-path, it might be capped at 1. This is ambiguous in S. A loss from the parallel phase is likely.
      *   **BC:** WM = 1 (M has full R-continuity via A's path *and* via B's path; existence suffices). *Merge Event:* Neutral (WM remains 1).
      *   *Asymmetric Variant (M gets all A, half B):*
          *   **C:** WM for M = Proportion of original quantum inherited. Likely (1.0 from A + 0.5 from B) / 2 = 0.75? Or weighted by connection strength: (1 + 0.5) / (1 + 1) = 0.75.
          *   **S:** WM for M ≈ R(t0, M via A) + R(t0, M via B) ≈ 1.0 + 0.5 = 1.5.
          *   **BC:** WM = 1 (M still has full continuity via A's path).

  *   **Prudential Concern Distribution (Parallel Year):**
      *   **C:** Distribute concern equally (50/50) between A and B.
      *   **S:** Full concern for both A and B independently.
      *   **BC:** Full concern for both A and B independently.
  *   **Build B & Merge vs. Never Build B vs. Continue Parallel:**
      *   **C:** Building B & Merging vs. Never Building B: Neutral (WM=1 at merge vs. WM=1 always with just A). Continue Parallel: Worse than Merging? (During parallel, WM *per successor* is only 0.5; after merge, WM for M is 1.0. Loss of "full" survival per successor, but total WM conserved. Ambiguous, but likely sees parallel as deficient *per branch* compared to non-branching or reconvergence).
      *   **S:** Build B & Merge: WM total during parallel=2, after merge=2 (if integrated) - very good. Never Build B: WM always=1 - worse. Continue Parallel: WM=2 always - best option (maximizes total R-relations).
      *   **BC:** Build B & Merge: Same WM=1 as Never Build B (survival guaranteed). Continue Parallel: Same WM=1. All equivalent regarding "what matters", though experiences differ.

  ### (3) Her Verdict (~300 words)

  **Best Guess:** Your supervisor will endorse the **Conservation Rule (C)**.

  *   **Reasons:**
      1.  **Fusion Cases:** Her verdicts on fusion ("each survives partially, about halfway") and the combined spectrum ("partial, roughly halfway") are *naturally* explained by C as a division of a fixed quantum. S struggles (why is fusion only 0.5 if it sums relations? It might predict 1.0 if fully continuous). BC struggles more significantly (why isn't fusion a "best candidate" with full WM?).
      2.  **Fission Valuation:** Her pointed refusal to say fission is *better* than ordinary survival, only "not worse," directly contradicts the core implication of S (that WM doubles). C explains this perfectly (total WM conserved at 1). BC also avoids saying it's better, but doesn't explain the *partiality* in fusion.
      3.  **Non-Branching Clause:** Her insistence that non-branching only matters for identity aligns with C and BC (where branching affects distribution or candidate count, not total WM value for the original), but clashes with S (where branching *increases* total WM, making non-branching survival "worse" in terms of total prudential relations).
      4.  **Gradual Replacement:** C handles full survival easily. BC does too. S could, but its tendency to multiply isn't triggered.
      5.  **Blueprint Survival:** All handle it similarly (full WM via single branch). The "worse prospect" due to disorientation is experiential, not a reduction in WM itself, fitting C (and BC/S).

  *   **Discounting:** Her comment that fission is "in no way worse" is crucial and not throwaway; it's the clearest rejection of S. Her refusal in fission to say "which one is you" is about identity (where non-branching matters), distinct from WM. Her confidence in degrees for fusion/spectrum is central and heavily favors C over BC. Her other verdicts are consistent with C and form a coherent picture of a conserved "survival-value" distributed by continuity.

  ### (4) What Turns On It (~200 words)

  The difference between Conservation (C) and Summation (S) has **significant practical consequences for anticipation and self-concern**, not just bookkeeping:

  1.  **Anticipation:** Under C, during fission (parallel phase), you anticipate each branch's experiences *as only partially yours* (e.g., you'd care less about stubbing A's toe than in normal life). Under S, you anticipate *each* branch's experiences *fully* (stubbing A's toe matters as much as ever). The intensity of future-directed emotion differs radically.
  2.  **Prudential Rationality:** Under C, resources/risk should be allocated based on the WM share (e.g., spend half your money on A, half on B). Under S, you should invest fully in *each* branch's well-being independently (spend all your money on A *and* all your money on B).
  3.  **Valuing Branches:** Under C, creating a new branch (like B) doesn't increase total WM; it just redistributes the existing quantum. Under S, creating B *adds* a new locus of full prudential concern, increasing total WM. Building B is prudentially beneficial under S, neutral under C.
  4.  **Merging:** Under C, merging restores "full" survival per successor. Under S, merging might be a significant loss of total prudential relations (from 2 to 1).

  Best Candidate (BC) aligns with S on anticipation/concern during branching (full concern for each), but aligns with C on the *value* of creating branches (neutral) and merging (neutral).

  ### (5) The Discriminating Case (~200 words)

  **The Discriminating Case: Serial Fusion**
  At t0: Person P exists.
  At t1: P is scanned; P's body is destroyed. Two replicas are created: Q (with 100% P's psychology) and R (with 100% of a *different* person, S0's, psychology).
  At t2: Q and R are scanned, destroyed, and a single fusion successor T is created. T has a psychology combining 50% from Q (hence P) and 50% from R (hence S0).
  At t3: T is scanned, destroyed, and fused with *another* different person U (100% their own psychology) to create V. V has a psychology combining 50% from T and 50% from U.

  **Question:** From P's perspective at t0, what is the degree of survival in V (at t3)?

  *   **Conservation (C) Prediction:**
      *   P's quantum splits at t1: Q holds 1.0 (full), R holds 0 (not P-related).
      *   At t2: T inherits 50% of Q's quantum (so 0.5 from P) + 0% from R. WM_P(T) = 0.5.
      *   At t3: V inherits 50% of T's quantum. WM_P(V) = 0.5 * 0.5 = 0.25.
      *   **Verdict:** P survives in V to degree 0.25.

  *   **Summation (S) Prediction:**
      *   At t1: P has R=1.0 to Q. R=0 to R.
      *   At t2: T bears R-relation to P via Q path. Strength = R(P->Q) * Connection(Q->T) ≈ 1.0 * 0.5 = 0.5. WM_P(T) = 0.5.
      *   At t3: V bears R-relation to P via path P->Q->T->V. Strength ≈ 1.0 * 0.5 * 0.5 = 0.25. WM_P(V) = 0.25.
      *   **Verdict:** P survives in V to degree 0.25. (*S converges with C here due to dilution*).

  *   **Best Candidate (BC) Prediction:**
      *   At t1: Q is a best candidate. WM_P remains 1.
      *   At t2: T has only 50% psychological continuity to P (via Q). Since there is no successor with 100% continuity, WM_P(T) = 0.5.
      *   At t3: V has only 25% continuity to P (via T). WM_P(V) = 0.25.
      *   **Verdict:** P survives in V to degree 0.25. (*BC also converges here*).

  **Why it Discriminates (C/S/BC vs. Alternative S Interpretation):** This case challenges the *intuitive pull* of Summation. While the math converges, the *intuition* behind S suggests branching *adds* value. Here, creating the unrelated branch R provides *no* prudential benefit to P under any rule. Crucially, it distinguishes from a **Robust Summation** view where simply having *any* R-relation path, however diluted, is additive. A Robust Summationist might argue WM_P(V) = R(P->Q) + R(P->Q->T) + R(P->Q->T->V) ≈ 1.0 + 0.5 + 0.25 = 1.75, which starkly contrasts with C/S/BC (0.25). Your supervisor's fusion verdicts strongly suggest she would reject Robust Summation (WM_P(T) would be 1.0 + 0.5 = 1.5, not 0.5). Her likely WM_P(V) = 0.25 verdict confirms Conservation or its converging alternatives and rejects Robust Summation. The serial dilution exposes that her view is fundamentally about the *proportion* of the original psychology/continuity preserved, not the summation of relations along paths. The *failure* of branching to add value for P in this case (because R isn't P-related) is the key discriminator against Robust Summation.
