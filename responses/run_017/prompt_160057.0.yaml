  Okay, this is a serious request from a professional philosopher who needs help structuring a dissertation fellowship proposal. They're clearly deep in the know-how literature but feeling stuck after years of thinking about it. The core idea is fresh - challenging the standard one-shot examples (piano playing, bike riding) by focusing on "regulative know-how" like running meetings or maintaining friendships. 

  Hmm, they've also flagged two crucial distinctions that aren't properly addressed in current debates: (1) executability vs guidance (can you know how without being able to do it?), and (2) the modal profile of know-how attributions (how robust must the knowledge be across circumstances?). These need to be integrated, not tacked on.

  The user's anxiety about the project feeling like "two papers stapled together" is palpable. And that foundation reviewer skepticism about conceptual philosophy... oof. Need to preempt those objections hard. 

  First, let's brainstorm framings. Option 1 could position this as a dissolution of the debate via neglected cases - showing the camps are both right about different phenomena. Risky though; might feel like a cop-out. Option 2 could frame it as exposing hidden parameters in know-how attributions (like modal robustness) that explain why the debate seems intractable. More original but trickier. Option 3 might attack the unit of analysis directly: arguing that "tasks" not "actions" should be primitive in know-how theory. Most ambitious but maybe too big for a year.

  *scribbles notes* The modal profile point feels like the real game-changer. If standard cases disagree because they implicitly assume different robustness requirements... that could be the unifying thread. The executability distinction might then fall out naturally - one-shot cases tolerate inability (lost hands pianist) because the modal bar is lower, while regulative know-how requires actual capacity because circumstances constantly vary. 

  For the hostile readers: For the colleague, we'll argue these aren't two topics but two diagnostic tools exposing a deeper unity. For the foundation, we'll emphasize that clarifying conceptual boundaries shows what empirical work actually needs to explain - philosophy as groundwork-laying.

  Methodology has to be tight. No vague "case studies" - concrete phases: first mapping the neglected cases, then modeling the modal dimension formally (possible worlds framework?), then pressure-testing with hybrid examples. Deliverables each phase: typology → formal schema → integration blueprint. 

  Biggest risk? The modal profiles might not cleanly correlate with task types. Maybe the split is elsewhere. But that's still a result! Failure would be not mapping the territory clearly enough for future work.

  *checks clock* Better start drafting. The JSON outline will force discipline - if I can't summarize it there, the framing's still fuzzy.
answer: |-
  Here’s a structured brainstorm followed by the proposal and JSON schema, designed to meet your specifications while preempting key objections.  

  ### **Brainstorm: Candidate Framings**  
  1. **"Task Typology as the Missing Unit"**  
     *Focus:* Argue that the *type of task* (discrete vs. regulative) determines whether intellectualist/abilist accounts succeed.  
     *Tractability:* High—map distinctions (executability/guidance, modal profiles) onto task types. 1-year viable.  

  2. **"Modal Robustness as the Hidden Variable"**  
     *Focus:* Show that debates turn on unacknowledged assumptions about *how counterfactually resilient* know-how must be.  
     *Tractability:* Moderate—requires formalizing modal profiles. Risk of scope creep.  

  3. **"Dissolving the Debate via Attribution Contexts"**  
     *Focus:* "Knows how" is context-sensitive; the dispute reflects divergent contextual demands (e.g., guidance in regulative tasks).  
     *Tractability:* High—leverages linguistics/pragmatics. Fits 1-year scope.  

  4. **"Know-How as Metacognitive Capacity"** (Avoid—career-length)  
     *Focus:* Regulative know-how is second-order ability to monitor/open-endedly adapt.  
     *Tractability:* Low—requires cognitive science integration; overambitious.  

  **Selected Framing: #1 (Task Typology)**  
  *Why:* Directly answers "where the split falls"; integrates your distinctions naturally; avoids over-innovation.  

  ---  

  ### **Proposal: 1,050 words**  
  **Working Title:** Task Typology and the Structure of Know-How: Why the Ability/Intellectualist Debate Needs Regulative Cases  

  **Core Question:** Does the division between discrete tasks (e.g., "playing a piano sonata") and regulative tasks (e.g., "maintaining a friendship") explain when intellectualist or ability-based accounts of know-how succeed, and can this split clarify the roles of executability and modal robustness in know-how attributions?  

  **The Gap in Existing Literature:**  
  The know-how debate remains deadlocked between intellectualists (e.g., Stanley & Williamson) who reduce know-how to propositional knowledge under practical modes of presentation, and ability theorists (e.g., Cath, following Ryle) who treat it as non-intellectual capacities. Both camps rely on *discrete tasks*: bounded, goal-specific actions with clear success conditions (e.g., riding a bike, solving a chess puzzle). Yet these cases systematically neglect *regulative know-how*—extended, open-ended practices like conflict resolution or project management, where success is context-sensitive, feedback-dependent, and dynamically assessed. Intellectualism plausibly handles discrete cases (e.g., a pianist without hands still knows *how* to play via grasp of propositions), but struggles with regulative tasks’ lack of fixed procedures. Ability theory captures the adaptive, embodied nature of regulative know-how but stumbles on cases of guidance without executability (e.g., knowing how to defuse a bomb you cannot build). Neither camp accounts for the *modal profile* of know-how—how broadly an agent’s knowledge holds across varying circumstances—which is critical for regulative tasks (e.g., "knows how to calm colleagues" must work across personalities). This impasse arises because the debate’s unit of analysis ("tasks") is underspecified.  

  **Methodology: Three Integrated Phases**  
  *Phase 1: Case Taxonomy (Months 1–3)*  
  - **Output:** Typology of know-how cases, distinguishing *discrete* (fixed goal, low context-dependence) vs. *regulative* (open-ended, high context-dependence) tasks.  
  - **Why this method?** Armchair cases alone risk bias; here, they scaffold testable criteria (e.g., "Is success iteratively defined?"). Alternatives like conceptual analysis are too coarse; this taxonomy forces engagement with your distinctions.  

  *Phase 2: Modal Profiling (Months 4–7)*  
  - **Output:** A formal schema for the "modal robustness" of know-how attributions (e.g., minimal robustness for discrete tasks vs. high robustness for regulative tasks), adapting possible-worlds frameworks.  
  - **Why not semantics?** While linguistic analysis of ascriptions (e.g., "knows how" vs. "can") is useful, it ignores *why* regulative attributions demand greater counterfactual stability. This phase targets that mechanism.  

  *Phase 3: Hybrid Testing (Months 8–12)*  
  - **Output:** A unified account showing how executability/guidance functions in hybrid cases (e.g., "knowing how to run a lab meeting during budget cuts"), resolving boundary disputes.  
  - **Why not empirical borrowing?** Psychology of skill often conflates know-how with automaticity. This phase uses normative hybrids to stress-test the taxonomy.  

  **Expected Outcomes & Failure Conditions:**  
  - **Best-case result:** A task-sensitive model showing intellectualism succeeds for discrete tasks (due to lower modal demands and tolerance for guidance-without-executability), while ability theory explains regulative know-how (requiring executable, modally robust capacities). This reveals the debate’s stalemate stems from unshared assumptions about task types.  
  - **Failure conditions:**  
    1. The discrete/regulative distinction fails to correlate with modal/executability differences.  
    2. Modal robustness cannot be modeled without collapsing into existing intellectualist/abilist frameworks.  
    3. The project fractures into disconnected papers (e.g., one on modal profiles, one on task types).  

  **Scope and Risks:**  
  - **Scope limit:** Focuses on *attribution conditions* for know-how, not metaphysics of abilities/propositions. Explicitly brackets skill acquisition and non-human know-how.  
  - **Biggest risk:** Task types may exist on a continuum, not a binary. If discreteness/regulativeness admits degrees, the account may require probabilistic weighting (e.g., "mostly discrete" tasks). Contingency: Hybrid cases in Phase 3 will force granularity.  

  **Anticipating Objections:**  
  - *Colleague: "This is two topics stapled together!"*  
    The distinction between discrete/regulative tasks isn’t a new topic—it’s a diagnostic tool exposing why the existing debate *seems* unresolvable. The core argument is singular: task type determines which theory applies.  
  - *Foundation Reviewer: "Conceptual philosophy can’t tell us anything new!"*  
    Clarifying the parameters of know-how attributions (e.g., modal robustness) reveals what empirical studies must explain (e.g., why some skills transfer broadly and others do not)—grounding future experimental work.  

  ---  

