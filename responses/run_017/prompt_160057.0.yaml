  **Key Strengths:**  
  - Preempts "two topics" objection by making task typology the *explanatory engine*.  
  - Answers "why philosophy?" by showing how conceptual clarity defines targets for empirical work.  
  - Builds in off-ramps for failure (e.g., Phase 3 tests integration risk).  
  - Targets a *determinate* answer: the split falls at task types, driven by modal/executability demands.  

  **Tactical Note:** In the full proposal, explicitly name Ryle, Stanley, Cath, etc. in the "positions" section—I omitted citations per your request. The JSON schema ensures you can track core commitments mechanically.
