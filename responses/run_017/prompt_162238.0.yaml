  Risk: If audience misses that bribes are state-given reasons demon shouldn't want (since it needs true belief-monitoring), it just seems like a corruption joke. Solution: Emphasize "properly" and "guilt-free" to signal normative clash. 

  Answer tag: \answer{state-given reason to bring about compliance} since demon wishes it could treat bribes as action-based reasons to manipulate its own oversight. 

