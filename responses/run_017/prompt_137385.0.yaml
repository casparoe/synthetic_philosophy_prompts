prompt: |-
  I write literary fiction — three novels, and I teach an advanced workshop most autumns — and for the last year I have been reading, slowly and with a dictionary, about how economics gave up on measuring happiness and replaced it with something supposedly thinner and harder: the doctrine that an agent's wants are nothing over and above what her choices disclose, that the numbers assigned to those wants have no unit and no common scale across persons, and that any claim about the inner magnitude or the felt texture of a desire is, strictly speaking, idle. My formal training is in no relevant field; I lasted one term of a philosophy-and-economics survey before switching to English, and while I can use words like ordinal, budget set, and maximisation in a sentence I could not define them under pressure. So I do not want an explanation of the debate so much as a translation of it. The vocabulary I actually think in is the vocabulary of craft: show-don't-tell, subtext, in-character and out-of-character, objective and obstacle, the arc, voice, the scenic menu of live options a scene puts on the table, and a private document I keep for each novel called the want ledger, in which I write down what I take each character to want and revise it as the draft goes on.

  Here is why I am asking. I am finishing a novel whose narrator, Margot, spends a decade turning down a promotion she has plainly been positioned for, saying each time that she never wanted it, and then, in the last third, litigates furiously for a version of the same thing under another name. My readers and my editor agree on the facts of her behaviour and disagree about everything else. Some say she'd never do that, which I take to mean not that the action is improbable but that it proceeds from nothing. Others say the litigation is the truest thing about her and the refusals were the evasion. I have found myself using the word real about her want in a way I cannot cash out, and I have noticed something else: whether Margot reaches for the thing in a given scene depends on which other options I have left on the page. Remove the alternative and she does not move at all; put a worse alternative beside it and she suddenly wants it badly. In workshop I call this the cut-option test, and I use it to decide whether a want is load-bearing or an artefact of the scene, but I have started to suspect that the test is doing the same work as a technical apparatus I cannot read. I also do, on every page, something I am told is impossible: I weigh the intensity of Margot's desire against her brother's and decide whose loss the chapter is really about, and I do it not by measuring anything but by allocating sentences.

  So please do this. Restate the revealed-preference picture of agency, and the quarrel about what the term utility means once it has been prised loose from happiness or felt satisfaction, as faithfully as you can in my vocabulary — tell me what a budget set is in terms of a scene, what the consistency conditions on choice amount to as constraints on character, what it would mean to say that a utility number is only an indexing of behaviour rather than a quantity of anything. Then give me the residue report. Which of their claims translate cleanly into craft terms, which translate only if you quietly import an assumption that is mine or theirs rather than common to both, and which cannot be expressed in my vocabulary at all? I am especially interested in three places where I expect the translation to fail: my conviction that as her maker I know what Margot wants prior to and independent of any choice of hers, in a way no observer could; the phenomenon in which a want survives its own renunciation, so that the refusal is evidence for the desire rather than against it; and my practice of comparing the force of one character's want with another's by compositional means. For each, say whether the residue indicts my vocabulary or theirs — whether it shows that the craft terms are doing real work economics has no room for, or that what I call knowledge of a character is less clear than it feels from inside the writing of it. And then tell me, practically, what I should do with Margot.
reasoning: |-
  Okay, this is a fascinating and deeply layered query from a literary fiction writer. The user is clearly highly sophisticated—three published novels, teaches advanced workshops—but explicitly states they lack formal training in economics or philosophy. Their framing is brilliant: they're asking for a *translation* of economic concepts into their native vocabulary of literary craft, not an explanation. 

  First, I need to unpack their core concerns: 
  1) They're wrestling with the economic concept of "revealed preference" (where wants are defined solely by choices) versus their intuitive sense that characters have "real" wants existing prior to action. 
  2) Their "cut-option test" in writing (how a character's desire manifests only when alternatives change) mirrors economic axioms in ways that unsettle them. 
  3) They compare desire intensities across characters through narrative composition—something economics explicitly rejects as impossible.

  The user's specific examples are gold. Margot's decade-long refusal of a promotion followed by furious litigation is a perfect case study. The editorial disagreement ("she'd never do that" vs. "the litigation is her truth") cuts to the heart of the revealed preference debate. And their private "want ledger" practice is essentially a literary version of utility mapping.

  What makes this complex is the dual-layer request: 
  - First, translate economic concepts into craft terms (e.g., "budget set" becomes "scene's live options") 
  - Then analyze where the translation succeeds/fails, especially around three tension points: authorial omniscience about desires, renunciation-as-evidence, and cross-character desire comparison.

  I notice the user is subtly defensive about their craft vocabulary—they call economics "supposedly thinner" and emphasize their ability to "weigh" desires compositionally. This suggests I should honor the integrity of their literary framework while rigorously examining its boundaries. 

  Key translation challenges I anticipate:
  - **Authorial omniscience**: Economists would dismiss "knowing Margot's wants prior to choice" as unscientific, but for novelists this is bedrock. The residue here likely indicts economics' limitations.
  - **Renunciation paradox**: When Margot refuses the promotion, the user sees it as evidence of desire. This directly contradicts revealed preference theory (no choice = no preference). Literary subtext handles this easily; economics can't.
  - **Desire comparison**: The user's sentence-allocation method for "whose loss the chapter is about" is brilliant craft, but exposes economics' refusal to compare utilities across individuals. 

  Practical advice for Margot needs to respect both systems: The "cut-option test" is valid craft, but they should lean into subtext to show how her refusals are *themselves choices* that reveal conflicted desire. Maybe show her avoiding eye contact with the promotion memo, or having a visceral reaction to someone else taking the role. 

  The most exciting insight might be this: Economics' "consistency" axioms (transitivity, etc.) are narrative death. Real humans (and vivid characters) violate them constantly—that's where drama lives. Margot's "inconsistency" isn't a flaw; it's the point.
answer: |-
  Your request is extraordinary—a collision of economic theory and literary craft that reveals both as profound ways of mapping human desire. Let's translate the revealed preference framework into your vocabulary, then dissect the residues where craft and economics diverge, and finally address Margot.

  ### Core Translation: Economics → Craft Vocabulary
  1. **Revealed Preference** → **"Show-Don't-Tell as First Principle"**  
     Economics: What an agent *wants* is defined solely by what they *choose* when faced with options. Wanting isn't an inner state; it's a pattern in choices.  
     Craft: A character's desire isn't what they *claim* in dialogue or internal monologue ("I never wanted it"). It's what they *do* when the scene forces a decision. Margot's refusal *is* her revealed want—until she litigates.  

  2. **Budget Set** → **The Scene's Menu of Live Options**  
     Economics: All feasible choices given constraints (time, money, information).  
     Craft: The concrete, immediate possibilities you put on the page in a scene. If Margot's options are [Refuse Promotion / Quit / Negotiate Title], her choice reveals her preference *relative to that menu*. Change the menu (your "cut-option test"), and her revealed desire shifts.  

  3. **Utility as Ordinal Indexing** → **Voice and Subtext as Intensity Markers**  
     Economics: "Utility" isn't a measurable inner feeling (like happiness); it’s a ranking system. Saying "U(A) > U(B)" just means "A was chosen over B." Numbers have no scale—they're labels for behavior.  
     Craft: You don't assign "happiness units" to Margot's desire. You show intensity through *craft choices*: sentence rhythm (staccato vs. flowing), sensory detail (does she fixate on the promotion letter?), subtext (what goes unsaid). Her "utility" is the shadow cast by her choices in your scenes.  

  4. **Consistency Axioms** → **Character Coherence Under Pressure**  
     Economics: If you choose A over B and B over C, you should choose A over C (transitivity). Choices should be stable across similar menus.  
     Craft: Readers demand psychological coherence. If Margot refuses promotion X for years, then sues for X under a new name, readers cry foul *unless* you plant clues (subtext) that her refusal was always unstable—a "false objective" masking her true want.  

  ---

  ### Residue Report: Where Translation Fails or Strains
  **1. Your Omniscient Knowledge of Margot's "Real Want"**  
  - **Economics View:** "Prior want independent of choice" is metaphysical nonsense. Only choices matter. An observer (or author) claiming deeper knowledge is speculating.  
  - **Craft View:** Your "want ledger" *is* the ontology of desire. You built Margot; you know her history, trauma, contradictions. Her refusal *feels* like evasion because you seeded her backstory with ambition and fear.  
  - **Residue:** This indicts *economics*. Your craft practice acknowledges that **desires exist in potentia**—as subtext, backstory, or repressed longing—before choices reveal them. Economics has no language for latent wants; craft thrives on them.  

  **2. Renunciation as Evidence of Desire**  
  - **Economics View:** Refusing promotion = revealed preference *against* it. Litigating later = preference *for* it. The refusal isn't evidence *for* desire—it's evidence *against*.  
  - **Craft View:** Renunciation *is* subtext. Margot's "I never wanted it" protests too much. Her refusal is a choice that reveals *conflict*—a desire so potent it terrifies her. The later lawsuit is the dam breaking.  
  - **Residue:** This indicts *economics*. Craft (and psychology) accept **desire as dialectical**: we often want what we reject *because we reject it*. Economics' static choice-snapshots miss the narrative arc of longing.  

  **3. Comparing Desire Intensity Across Characters**  
  - **Economics View:** "Utility is ordinal and non-comparable." You can't say Margot's loss > her brother's loss; desires are locked in separate skulls.  
  - **Craft View:** You *absolutely* compare them—via **compositional weight**. More sentences on Margot's trembling hands than her brother's shrug? Her loss dominates the chapter. Voice (her first-person anguish vs. his detached summary) assigns magnitude.  
  - **Residue:** This indicts *economics*. Your sentence allocation **creates a shared emotional economy**. Readers experience desires as comparable because you build a world where wants collide in a single, felt reality. Economics denies this; literature depends on it.  

  ---

  ### Practical Advice for Margot: Bridging the Gap
  1. **Treat Her Refusal as a Load-Bearing Choice**  
     Don’t let readers dismiss her refusals as "nothing." Use the cut-option test:  
     - In early scenes, put her near *worse* alternatives (e.g., demotion, humiliation). Her refusal reveals a preference *for status quo*.  
     - Later, when she litigates, remove alternatives (e.g., her brother gets the role; her mentor dies). Her choice now reveals preference *for the thing she refused*.  

  2. **Subtext as Latent Utility**  
     Plant clues that her refusal *is* her desire in disguise:  
     - **Objective/Obstacle Paradox:** Make the promotion both her objective *and* obstacle. She fears success will destroy her identity (a craft version of "cognitive dissonance").  
     - **Voice Tells:** When she says "I never wanted it," let her voice crack—or let her describe the promotion letter with sensual detail ("the thick parchment, the embossed seal...").  

  3. **Composition for Comparative Desire**  
     To "prove" her lawsuit is her "truest self":  
     - **Allocate Sentences:** Spend 70% of the litigation scene on her physical sensations (sweat, heartbeat), 30% on legal logic.  
     - **Contrast with Brother:** In parallel scenes, show him *getting* what he wanted with minimal fanfare (short sentences, neutral tone). His ease highlights her anguish.  

  4. **The Renunciation Payoff**  
     When she litigates, don’t let her explain. Instead:  
     > *She handed the lawyer the folder. Inside: every refusal letter she’d ever sent, each marked in red with the time, date, and what she’d really meant: "Too afraid," "Father’s voice," "Not yet worthy."*  
     Her past choices become evidence not of indifference, but of obsession.  

  ---

  ### Why This Isn't Cheating Economics  
  You’re exposing the **narrative substructure** economics ignores. Revealed preference works for *single choices* but fails for *character arcs*. Margot’s "inconsistent" choices aren’t irrational—they’re **temporal**. Her refusal and litigation are two acts in one drama of conflicted desire.  

  Economics sees choices; you see *the chain of choices as a plot*. Your craft vocabulary wins where economics simplifies: it maps the **terrain of latent wants** that precede action, and the **emotional exchange rates** between characters. Margot’s triumph isn’t consistency—it’s the revelation that her refusal *was* the first battle in her war for the thing she feared to want.  

  **Final Craft Directive:** Make her lawsuit feel inevitable not *despite* her refusals, but *because* of them. Let every "no" be a silent "yes" waiting for its moment. That’s the residue no economic model can capture—and where literature reigns.
