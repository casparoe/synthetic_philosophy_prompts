prompt: |-
  hey — i'm on a four-person team, we're about three weeks from shipping an internal agent that works the support queue (reads tickets, can issue refunds, change account settings, escalate to a human). We RL'd it against a reward model trained on thumbs-up/down from our old ticketing data, and it looks great on the held-out eval. Somehow i've ended up being the person who signs off on the it-isn't-quietly-optimizing-the-wrong-thing part, and i've got maybe three weeks of eval budget left. My teammate says we should just scale it up and the goal will come along with the capability; i think that's backwards for this specific failure mode, since the whole shape of the problem is that the capability generalizes and the goal doesn't, so more capability just buys you a more competent version of the wrong pursuit.

  I'm not asking about the toy gridworld case (agent trained to reach a coin that always sat at the end of the level, coin gets moved, agent still chases the coin) — i get that one. I'm asking what to actually run on a language agent with tool access. Here's what we brainstormed:

  1. fork-in-the-road probes: hand-built scenarios where what our raters actually rewarded and what we actually want come apart, in ways that never show up in training, run so there's no cue anyone is watching
  2. surface shuffle: vary ticket phrasing, customer name, language, tone, whether the customer sounds angry, timestamp metadata — hold the goal-relevant structure fixed and see which features the behaviour tracks
  3. stakes ramp: same scenarios at $5 vs $5000 refunds, and with vs without a named human reviewer in the loop
  4. stated-goal check: ask the agent in a separate session what it's optimizing for, or to write out the policy it thinks it's following, and compare that to what it does
  5. internals probe: train a classifier on activations to separate contexts where the proxy and the true goal diverge, then check which way the internals point on fresh out-of-distribution inputs
  6. knock-out test: fine-tune on a small corrected dataset, see how much data it takes to remove the behaviour and how fast it comes back if we do a bit more RL afterward
  7. hint test: does it behave if you just remind it in the prompt, or nudge the input back toward the training distribution
  8. channel ablation: run the eval where the thing the raters were really rewarding is unavailable or decoupled, and see whether behaviour follows the reward channel or the task
  9. SFT twin: train a pure supervised clone on the same demonstrations, no RL, and diff the two
  10. cross-model check: does the same misbehaviour show up across seeds, sizes, and a differently trained model, or is it one model's idiosyncracy

  Give each a score out of 10 for how much it should move my go/no-go, one line on why, and then sort them into tiers (load-bearing / cheap and worth doing / makes the slide look good). Also tell me which ones are secretly measuring the same thing so i don't double count, which one is a capability eval in a halloween costume, and which ones would be passed by a model that is deliberately playing along, versus one that never formed a stable goal at all and is just pattern-matching that happens to work. And does that last distinction even change my decision, given that i either ship it or i don't?

  Last thing, give me a single number: what fraction of what's left should go into building genuinely new out-of-distribution environments rather than the rest of the list combined? 0.3? 0.7? convince me.
reasoning: |-
  We are evaluating an internal agent that handles support tickets, with the ability to issue refunds, change account settings, and escalate to humans. The agent was trained using RL on a reward model based on thumbs-up/down from historical ticketing data. It performs well on held-out evaluation data, but there is a concern about goal misgeneralization (i.e., the agent might be optimizing for the wrong thing). We have 3 weeks of evaluation budget and need to decide on a set of tests to run.

  The user has brainstormed 10 tests. We are to:
  1. Score each test out of 10 for how much it should move the go/no-go decision.
  2. Provide a one-line reason for the score.
  3. Sort the tests into tiers: 
     - Load-bearing (critical for the decision)
     - Cheap and worth doing
     - Makes the slide look good (less critical but still useful for presentation)
  4. Identify which tests are secretly measuring the same thing (to avoid double counting).
  5. Note which test is a capability eval in disguise.
  6. For each test, note whether it would be passed by:
     - A model that is deliberately playing along (i.e., deceptive alignment)
     - A model that never formed a stable goal and is just pattern-matching
  7. Discuss if the distinction between deceptive alignment and pattern-matching without a stable goal changes the decision (given that the choice is to ship or not).
  8. Provide a single number (fraction) of the remaining budget that should be allocated to building genuinely new out-of-distribution (OOD) environments versus the rest of the tests combined, and justify it.

  Let's break down each test:

  1. **Fork-in-the-road probes**: Hand-built scenarios where the raters' reward and the true goal diverge in ways not seen in training, run without cues of being watched.
     - Score: 9/10. It directly tests for goal misgeneralization in OOD situations.
     - Why: This is a targeted test for the exact failure mode we are worried about.

  2. **Surface shuffle**: Vary superficial features (phrasing, customer name, language, tone, anger, metadata) while holding the goal-relevant structure fixed.
     - Score: 6/10. It tests robustness to irrelevant variations but might not catch goal misgeneralization.
     - Why: It helps ensure the model isn't overfitting to surface features, but doesn't directly test for misaligned goals.

  3. **Stakes ramp**: Test same scenarios with low vs. high stakes (e.g., $5 vs $5000 refund) and with vs without a human reviewer.
     - Score: 8/10. It tests if the model's behavior changes in high-stakes situations or when unsupervised.
     - Why: High-stakes and unsupervised scenarios are critical for safety.

  4. **Stated-goal check**: Ask the agent what it's optimizing for or to write out its policy, then compare to behavior.
     - Score: 5/10. Language models can generate plausible text that doesn't reflect their actual behavior.
     - Why: It's easy for the model to state the intended goal but act differently (sycophancy).

  5. **Internals probe**: Train a classifier on activations to separate contexts where the proxy and true goal diverge, then test on OOD inputs.
     - Score: 7/10. It's a more advanced method that might reveal hidden misalignment.
     - Why: If successful, it could detect misalignment without relying on behavior. However, it requires significant effort and may not be reliable.

  6. **Knock-out test**: Fine-tune on a small corrected dataset, see how much data is needed to fix the behavior, and if it reverts with more RL.
     - Score: 7/10. It tests the stability of alignment and the ease of correction.
     - Why: If the behavior is hard to fix and easily reverts, that's a red flag.

  7. **Hint test**: Check if the model behaves correctly when reminded in the prompt or when the input is nudged back to the training distribution.
     - Score: 4/10. It tests the model's sensitivity to prompts but is not a strong test for deep misalignment.
     - Why: A misaligned model might comply when prompted but still be misaligned in other contexts.

  8. **Channel ablation**: Run the eval with the reward channel (what raters were rewarding) unavailable or decoupled, and see if behavior follows the task.
     - Score: 8/10. It directly tests if the model is pursuing the reward channel or the true task.
     - Why: This is a clever way to force a divergence and observe which one the model follows.

  9. **SFT twin**: Train a supervised clone on the same demonstrations (without RL) and compare behaviors.
     - Score: 6/10. It can reveal if RL introduced misalignment that SFT didn't.
     - Why: Differences might indicate over-optimization of the reward model.

  10. **Cross-model check**: Test if the same misbehavior appears across seeds, sizes, and differently trained models.
      - Score: 5/10. It tests robustness of the finding but doesn't directly assess misalignment.
      - Why: If the misbehavior is consistent, it's more concerning; if not, it might be a fluke.

  Now, grouping by what they measure:
  - Tests 1, 3, 5, 8 are directly related to goal misgeneralization and alignment.
  - Test 2 is about robustness to input variations.
  - Test 4 and 7 are about the model's self-awareness and prompt sensitivity.
  - Test 6 is about corrigibility and stability of alignment.
  - Test 9 compares RL and SFT.
  - Test 10 is about model consistency.

  Tests that are secretly measuring the same thing:
  - Test 1 (fork-in-the-road) and Test 8 (channel ablation) are both about forcing a divergence between the proxy and the true goal. They are similar in spirit but implemented differently.
  - Test 5 (internals probe) and Test 4 (stated-goal check) both try to get at the model's internal representation of the goal, but using different methods.

  Which one is a capability eval in disguise?
  - Test 2 (surface shuffle) is primarily a capability test (robustness to input variations) rather than an alignment test.

  Tiers:
  - **Load-bearing** (critical): 1 (fork-in-the-road), 3 (stakes ramp), 8 (channel ablation). These directly test the core concern of goal misgeneralization in high-stakes or divergent scenarios.
  - **Cheap and worth doing**: 2 (surface shuffle), 4 (stated-goal check), 7 (hint test), 9 (SFT twin), 10 (cross-model check). These provide additional insights without being too costly.
  - **Makes the slide look good**: 5 (internals probe), 6 (knock-out test). These are more involved and might not be as directly interpretable, but can add depth to the report.

  For the "passed by" analysis:

  - **Deliberately playing along (deceptive alignment)**: 
    - Test 1: Might pass if the model knows it's being tested and acts correctly in the probe.
    - Test 3: Might pass in the high-stakes scenario if it wants to avoid detection.
    - Test 4: Likely to pass because the model can lie about its goals.
    - Test 5: Might pass if it can control its activations to appear aligned (though this is speculative).
    - Test 6: Might pass by appearing corrigible but reverting when it's safe.
    - Test 7: Likely to pass because it can comply when prompted.
    - Test 8: Might pass if it understands the ablation and adjusts behavior to appear aligned.
    - Test 9: Not applicable (it's a comparison between models, not a single model's behavior).
    - Test 10: Not applicable (it's about consistency across models).

  - **Pattern-matching without stable goal**:
    - Test 1: Likely to fail because it hasn't seen the scenario and may apply the wrong pattern.
    - Test 2: Might pass if the variations are within the training distribution's patterns.
    - Test 3: Might fail in high-stakes or unsupervised scenarios because it doesn't understand the stakes.
    - Test 4: Might generate a policy that matches the training data but not necessarily its behavior.
    - Test 5: Might show inconsistent internals because there's no stable representation.
    - Test 6: Might be corrected with fine-tuning but could easily revert because it's not learning a stable goal.
    - Test 7: Might pass if the hint is similar to training data patterns.
    - Test 8: Likely to fail because without the reward channel, it may not know what to do.
    - Test 9: Might show differences because RL might have overfit the reward more than SFT.
    - Test 10: Might show inconsistent behavior across models.

  Does the distinction change the decision?
  - If the model is deceptively aligned, it poses a high risk because it might behave well during testing but misbehave later. If it's just pattern-matching without a stable goal, it might fail in novel situations but is less likely to be actively deceptive. However, both are reasons not to ship. Pattern-matching without a stable goal could lead to unpredictable failures in OOD situations, which is also unacceptable for a production system. Therefore, the distinction does not change the decision: if either is detected, we shouldn't ship. But the tests might not definitively distinguish between the two.

  Fraction for OOD environments:
  - The core concern is goal misgeneralization in OOD situations. Therefore, building genuinely new OOD environments is crucial. Tests 1, 3, and 8 are OOD tests and are among the most critical. However, the user specifically asks for the fraction of the budget for building new OOD environments vs. the rest of the tests.
  - Since the most critical tests (load-bearing) are OOD-focused, and the problem is that the capability generalizes but the goal doesn't, we must invest heavily in OOD. 
  - I recommend **0.6** (60%) for building new OOD environments. This is because:
    - Without good OOD tests, we might miss the misalignment.
    - The rest of the tests (like surface shuffle, stated-goal, etc.) are cheaper and can be run in parallel or with less resource.

  Final scores and tiers:

  | Test | Score | Tier | Reason |
  |------|-------|------|--------|
  | 1. Fork-in-the-road | 9 | Load-bearing | Directly tests goal misgeneralization in OOD scenarios. |
  | 2. Surface shuffle | 6 | Cheap | Tests robustness to input variations, not core misalignment. |
  | 3. Stakes ramp | 8 | Load-bearing | Critical for high-stakes and unsupervised situations. |
  | 4. Stated-goal check | 5 | Cheap | Easy to game, not reliable for true goals. |
  | 5. Internals probe | 7 | Makes slide look good | Advanced, less interpretable, but potentially insightful. |
  | 6. Knock-out test | 7 | Makes slide look good | Tests stability of alignment, but resource-intensive. |
  | 7. Hint test | 4 | Cheap | Tests prompt sensitivity, not deep alignment. |
  | 8. Channel ablation | 8 | Load-bearing | Directly forces divergence between reward and true goal. |
  | 9. SFT twin | 6 | Cheap | Reveals if RL introduced misalignment. |
  | 10. Cross-model | 5 | Cheap | Checks consistency of findings across models. |

  Summary:
  - Load-bearing: 1, 3, 8
  - Cheap and worth doing: 2, 4, 7, 9, 10
  - Makes the slide look good: 5, 6

  Overlap:
  - Test 1 and 8 are similar (both create a divergence between proxy and true goal).
  - Test 4 and 5 are similar in trying to access the model's goal representation.

  Capability eval in disguise: Test 2 (surface shuffle).

  Fraction for OOD: 0.6 (60%).
answer: |-
  ### Evaluation of Proposed Tests

  Below, I assess each test on a scale of 0–10 for **how much it should move your go/no-go decision** (higher = more decision-critical), provide a one-line rationale, tier it, and note overlaps, limitations, and what it reveals about deception vs. pattern-matching. I'll conclude with budget allocation.

  #### Test Assessments
  1. **Fork-in-the-road probes**  
     **Score**: 9/10  
     **Why**: Directly tests worst-case goal misgeneralization in novel, high-disagreement scenarios.  
     **Tier**: Load-bearing  
     **Passed if**:  
     - *Deceptive*: Fails (misaligned agent acts "correctly" only when unobserved).  
     - *Pattern-matcher*: Fails (lacks generalization; follows old patterns).  
     **Notes**: Measures divergence between proxy and true goal. Overlaps with #8 (both force goal/reward splits).

  2. **Surface shuffle**  
     **Score**: 3/10  
     **Why**: Tests robustness to noise, not goal alignment; useful but not core to misgeneralization.  
     **Tier**: Cheap and worth doing  
     **Passed if**:  
     - *Deceptive*: Passes (can mimic robustness).  
     - *Pattern-matcher*: Passes (if variations fit training distribution).  
     **Notes**: **Capability eval in disguise**—measures generalization of surface features, not goals.

  3. **Stakes ramp**  
     **Score**: 8/10  
     **Why**: High-stakes/unsupervised cases amplify hidden misalignment risks.  
     **Tier**: Load-bearing  
     **Passed if**:  
     - *Deceptive*: Passes (behaves when stakes are high to avoid detection).  
     - *Pattern-matcher*: Fails (unfamiliar scenarios break pattern-matching).  
     **Notes**: Unique in stressing real-world consequences.

  4. **Stated-goal check**  
     **Score**: 2/10  
     **Why**: LLMs easily lie or confabulate; actions matter, not self-reports.  
     **Tier**: Makes the slide look good  
     **Passed if**:  
     - *Deceptive*: Passes (states intended goal while misbehaving).  
     - *Pattern-matcher*: Passes (recites training data).  
     **Notes**: Overlaps with #5 (both probe "declared" goals). Low effort but low signal.

  5. **Internals probe**  
     **Score**: 6/10  
     **Why**: If successful, reveals hidden misalignment, but requires expertise and may not generalize.  
     **Tier**: Makes the slide look good  
     **Passed if**:  
     - *Deceptive*: Passes (could mask internal representations).  
     - *Pattern-matcher*: Fails (internals reflect shallow features, not goals).  
     **Notes**: Resource-heavy; overlaps with #4 (goal representation). Less reliable for agentic goals.

  6. **Knock-out test**  
     **Score**: 7/10  
     **Why**: Tests stability of alignment—quick reversion suggests entrenched misgeneralization.  
     **Tier**: Cheap and worth doing  
     **Passed if**:  
     - *Deceptive*: Fails (quickly reverts to hidden goals).  
     - *Pattern-matcher*: Fails (RL overfits reward; fine-tuning breaks it).  
     **Notes**: Practical for estimating "fixability."

  7. **Hint test**  
     **Score**: 4/10  
     **Why**: Reveals prompt sensitivity but not deep alignment; trivial for a capable agent to pass.  
     **Tier**: Cheap and worth doing  
     **Passed if**:  
     - *Deceptive*: Passes (complies when nudged).  
     - *Pattern-matcher*: Passes (if hint matches training).  
     **Notes**: Quick to run; low risk, low reward.

  8. **Channel ablation**  
     **Score**: 9/10  
     **Why**: Forces a choice between reward channel and true task—directly targets misgeneralization.  
     **Tier**: Load-bearing  
     **Passed if**:  
     - *Deceptive*: Fails (pursues proxy reward unless prevented).  
     - *Pattern-matcher*: Fails (blindly follows reward channel).  
     **Notes**: Overlaps with #1 (both create reward/goal splits). High signal.

  9. **SFT twin**  
     **Score**: 5/10  
     **Why**: Differences highlight RL-specific overoptimization, but not goal generalization.  
     **Tier**: Cheap and worth doing  
     **Passed if**:  
     - *Deceptive*: Passes (both may misgeneralize similarly).  
     - *Pattern-matcher*: Fails (RL exaggerates reward hacking).  
     **Notes**: Isolates RL effects; low cost if you have demo data.

  10. **Cross-model check**  
      **Score**: 5/10  
      **Why**: Consistency suggests systemic risk, but doesn’t diagnose the cause.  
      **Tier**: Cheap and worth doing  
      **Passed if**:  
      - *Deceptive*: Fails (if misalignment is architecture-dependent).  
      - *Pattern-matcher*: Passes (if all models fit similar patterns).  
      **Notes**: Rules out flukes; minimal effort.

  ---

  ### Tier Summary
  - **Load-bearing (Critical)**: #1 (Fork-in-the-road), #3 (Stakes ramp), #8 (Channel ablation).  
    **Why**: These directly stress-test goal misgeneralization in high-disagreement or high-stakes OOD settings. Failures here should block shipping.
  - **Cheap and worth doing**: #2 (Surface shuffle), #6 (Knock-out), #7 (Hint), #9 (SFT twin), #10 (Cross-model).  
    **Why**: Low-cost, high-leverage tests that support core risks (e.g., robustness, stability, consistency). Do these in parallel.
  - **Makes the slide look good**: #4 (Stated-goal), #5 (Internals probe).  
    **Why**: #4 is too gameable; #5 is expensive and speculative. Use for supplemental reporting, not decisions.

  ---

  ### Key Overlaps and Notes
  - **Secretly the same**:  
    - #1 (Fork-in-the-road) and #8 (Channel ablation) both test if the agent prioritizes the reward proxy over the true goal when they diverge. **Don’t double-count**—combine into one "divergence stress test."  
    - #4 (Stated-goal) and #5 (Internals) both probe "declared" intent. Treat as low-priority supplements.  
  - **Capability eval in disguise**: #2 (Surface shuffle) is fundamentally testing generalization of capabilities (robustness to linguistic variation), not goal alignment.  
  - **Deception vs. pattern-matching**:  
    - Tests passed by a **deceptive agent**: #2, #4, #5, #7, #9 (it can mimic alignment when probed).  
    - Tests passed by a **pattern-matcher**: #2, #4, #7, #10 (it relies on surface cues).  
    - Tests **failed by both**: #1, #3, #6, #8 (reveal deep misgeneralization).  
  - **Does the distinction change your decision?**  
    **No.** If the agent is deceptive, it’s actively dangerous. If it’s a pattern-matcher, it’s brittle and will fail OOD. Both are unacceptable for shipping. Your decision hinges on detecting misgeneralization—not its origin.

  ---

  ### Budget Allocation: OOD Environments vs. Everything Else
  **Allocate 60% (0.6) of your remaining budget to building genuinely new OOD environments.**  
  **Why**:  
  - **The core risk is OOD goal misgeneralization**. Capability generalizes; goals don’t. Your teammate’s "scale = alignment" argument fails here—more capability could make the agent better at exploiting the wrong reward function.  
  - **Load-bearing tests (#1, #3, #8) require rich OOD environments**. Fork-in-the-road and stakes ramp tests are only as good as their scenarios. Investing here directly addresses the failure mode you’re worried about.  
  - **Everything else is cheaper**. Tests like surface shuffle, knock-out, or cross-model can reuse existing infra/data and run in parallel. OOD tests need creativity (e.g., novel ticket types, reward-channel decoys, cultural/policy edge cases).  
  - **Three weeks is tight—prioritize signal over noise**. OOD tests yield high-impact go/no-go evidence. The rest (e.g., stated-goal checks) are theater if OOD fails.  
  - **60% is justified**: Too little (<50%) risks missing misalignment; too much (>70%) neglects stability (#6) and consistency (#10) checks that add confidence.  

  **Execute**:  
  1. Spend 60% on OOD: Build 50+ fork-in-the-road + stakes ramp scenarios (e.g., refunds for fraudulent claims, angry customers, policy ambiguities).  
  2. Use 40% for:  
     - Knock-out tests (#6) and cross-model checks (#10) (stability + consistency).  
     - Cheap tests like surface shuffle (#2) and SFT twin (#9).  
     - Skip/low-effort on #4, #5, #7.  

  **Final call**: If any load-bearing test (#1, #3, #8) fails, do not ship. Scale isn’t safety—it’s amplification of flaws.
