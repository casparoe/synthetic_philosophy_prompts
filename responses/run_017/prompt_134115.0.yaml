  ## International Commission on Stratigraphy: Call for Nominations  
  **Global Boundary Stratotype Section and Point (GSSP) for the Base of the Anthropocene Series/Epoch**  
  (ICS Circular No. A-2029/01)  

  **1. Introduction**  
  Pursuant to Article 7.3 of the ICS Statutes and following the recommendation of the Anthropocene Working Group (AWG) Reformulation Panel (2026), the Subcommission on Quaternary Stratigraphy (SQS) hereby invites formal proposals for the Global Boundary Stratotype Section and Point (GSSP) marking the base of the proposed Anthropocene Series/Epoch. This Call seeks candidate sections demonstrating a globally synchronous, isochronous, and materially preserved signal marking the transition into a period of dominant human influence on Earth systems. Proposals must adhere strictly to ICS protocols for GSSP designation.  

  **2. Eligibility of Submitting Bodies**  
  2.1. Proposals may be submitted by:  
  (a) National Geological Surveys recognized by the International Union of Geological Sciences (IUGS).  
  (b) Consortia of three (3) or more accredited research institutions from distinct IUGS member states.  
  2.2. Proposals require endorsement signatures from three (3) ICS Voting Members (excluding SQS members).  

  **3. Voting Membership**  
  The Anthropocene Boundary Committee (ABC) shall evaluate proposals. Membership comprises:  
  - Chair of SQS (ex officio)  
  - 6 members appointed by ICS Executive  
  - 5 members appointed by SQS  
  - 1 member each from Subcommissions on Stratigraphic Classification, Sedimentary Geology, and Geochronology  
  *(Total: 15 Voting Members; Quorum: 9)*  

  **4. Mandatory Criteria & Scoring Rubric (Total: 100 Points)**  
  Proposals will be evaluated against the following criteria. Points are non-negotiable and allocated as follows:  

  **4.1. Accessibility & Infrastructure (15 Points)**  
  - Permanently accessible via public right-of-way or enforceable international treaty (5 pts).  
  - On-site facilities for research (field lab, core repository, climate control). Proximity to major airport (+3 pts).  
  - Protection from anthropogenic interference via national/international designation (e.g., World Heritage, Biosphere Reserve) (7 pts).  

  **4.2. Lithological Continuity & Preservability (20 Points)**  
  - Demonstrable, uninterrupted sediment accumulation/mineral deposition across the proposed boundary interval (10 pts).  
  - High probability of preservation for >10^7 years (e.g., rapid burial, low erosion, subsiding basin, anoxic conditions) (10 pts).  

  **4.3. Global Synchrony & Isochrony (25 Points)**  
  - Primary marker must demonstrably record a globally instantaneous event (± 1 year) identifiable across >90% of Earth’s depositional environments.  
  - Secondary markers must corroborate synchrony (e.g., isotopic spikes, atmospheric tracers). Points awarded for:  
      - Robustness of primary marker’s global isochroneity (15 pts).  
      - Strength & diversity of secondary correlative markers (10 pts).  

  **4.4. Signal Fidelity & Legibility (25 Points)**  
  - Primary marker must be unambiguous, macroscopically visible, and analytically verifiable (e.g., distinct layer, mineral phase change, fossil assemblage turnover) (10 pts).  
  - Marker must remain chemically stable and physically distinct under projected deep-time diagenetic/metamorphic conditions (10 pts).  
  - Interpretability by hypothetical future intelligences lacking anthropogenic cultural context (5 pts).  

  **4.5. Datability (15 Points)**  
  - Marker horizon must be dateable via multiple independent radiometric methods (e.g., ^14^C, ^210^Pb, ^137^Cs, ^239^Pu, dendrochronology, varve counting) with a target precision of ≤ 1 year (10 pts).  
  - Presence of multiple independent dating horizons within ± 10 years of the boundary (5 pts).  

  **5. Submission Requirements**  
  Proposals must include:  
  - Detailed stratigraphic column (1 cm resolution across boundary interval).  
  - Geophysical/geochemical logs.  
  - High-resolution imagery of marker horizon.  
  - Petrographic/mineralogical analysis.  
  - Comprehensive age model with all raw data.  
  - Paleoenvironmental reconstruction.  
  - Long-term preservation risk assessment.  
  - Management plan ensuring >100-year integrity.  

  **6. Invented Candidate Marker Example (Illustrative Only)**  
  *Proposal 17-B: The "Polyethylene Aggregate Horizon" (PAH), North Pacific Gyre Sediment Core NPGS-2047-D*  

  **6.1. Primary Marker:** A 2.3 ± 0.4 mm thick, laminated horizon of fused polyethylene terephthalate (PET) microplastic shards (50-500 µm), exhibiting hydrodynamic sorting. Peak concentration: 284,000 particles/kg sediment.  

  **6.2. Synchrony & Correlation:**  
  - Associated ^239^Pu (6.3 ± 0.8 mBq/g) and ^137^Cs (19.1 ± 1.2 mBq/g) peaks correlate precisely to atmospheric thermonuclear testing maxima (1963-1964 CE).  
  - Globally correlative via identical polymer production "fingerprints" (phthalate plasticizers, UV stabilizers) found in coeval lacustrine/estuarine sediments on six continents.  

  **6.3. Preservability & Legibility:**  
  - PET demonstrates negligible biodegradation under anoxic marine conditions over millennial timescales.  
  - Fused aggregate morphology is distinct from background microplastic distribution; resembles authigenic mineral crusts.  
  - Diagnostic FTIR spectra remain resolvable after simulated 10^7-year diagenesis trials (T=150°C, P=2 kbar).  

  **6.4. Advantages:**  
  - Unambiguously anthropogenic origin.  
  - Encapsulates key Earth-system shifts (novel materials proliferation, oceanographic reorganization).  
  - Protected location (remote oceanic abyss; UNESCO High Seas Treaty Zone 9).  

  **6.5. Designated Boundary:** Base of fused PET aggregate layer. GSSP coordinates: 38°41'12"N, 165°22'48"W. Core archived at IODP Kochi Repository.  

  **7. Field Note: Future Geologist’s Observation**  
  *(Extract from *Field Journal of Senior Survey Geologist Kael Tharn, Terran Reclamation Directorate, 12,043,811 CE*)  

  > "...section TRD-Gamma-7 exhibits the characteristic 'Twistband Laminates' of the proposed Technozoic-Transitional sequence. The laminates (Unit γ-7d) comprise alternating opaque and translucent polymer ribbons, heavily silicified but retaining original flow-structures. Overlying the laminates is the first persistent horizon of fused impact spherules (Unit γ-8a; likely correlative to the Mid-Collapse Extinction Event). Crucially, γ-7d contains a 2.1 mm thick, dark gray, high-density layer (Subunit γ-7d-ii) exhibiting anomalous ^239^Pu decay signatures and remnant C-H-O polymer bonds via deep-scan resonance spectroscopy. This subunit matches the 'Golden Spike' candidate described in Fragment ICS-A2029/01 recovered from the Tokyo Repository Basement. Despite regional metamorphism (greenschist facies), γ-7d-ii maintains a sharp basal contact, satisfying isochroneity requirements per ICS protocols. Recommend formal designation as the boundary marker..."  

  **8. Boundary Definition Protocol & Synchrony Resolution**  
  Recognizing the inherent challenge of achieving absolute global synchrony for a transition characterized by significant diachroneity in its initial expressions, the ABC adopts the following resolution:  
  **8.1.** The primary marker horizon must correspond to a single, globally distributed, near-instantaneous geochemical or physical event.  
  **8.2.** Should competing proposals demonstrate equivalent technical merit (score differential ≤5 points), precedence will be given to the candidate whose primary marker horizon coincides with the date of ratification of the first international treaty explicitly referencing "Anthropogenic Global Change" (Vienna Convention for the Protection of the Ozone Layer, 22 March 1985). This date (1985 CE) is hereby designated the *Procedural Synchrony Anchor*.  
  **8.3.** Proposals utilizing the Procedural Synchrony Anchor must demonstrate a secondary marker within their section precisely datable to 22 March 1985 (± 1 year), independent of the primary marker.  

  **9. Timeline**  
  - Submissions Due: 1 July 2030  
  - ABC Evaluation & Site Visits: July 2030 – June 2031  
  - SQS Recommendation Vote: September 2031  
  - ICS Ratification Vote: December 2031  
  - IUGS Executive Final Approval: February 2032  

  **10. Submission Address**  
  All proposals must be submitted electronically in ICS Template A-7G format to:  
  Dr. E. Rostova, Secretary, Subcommission on Quaternary Stratigraphy  
  ics-sqs-gssp@iugs.org  

  *This Call adheres to the highest standards of stratigraphic science. Proposals implying the inadequacy of established ICS GSSP protocols vis-à-vis the proposed boundary’s sociopolitical dimensions will be deemed non-compliant.*  

  **Dr. Aris Thorne**  
  Chair, Subcommission on Quaternary Stratigraphy  
  International Commission on Stratigraphy
