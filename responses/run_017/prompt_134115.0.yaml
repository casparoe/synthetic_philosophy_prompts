  The document must include an invented marker (e.g., microplastic aggregate) presented as seriously as real ones. The future field note should be clinical yet haunting. The humor must come from systemic flaws: synchrony vs. diachroneity, preservation paradoxes, or tiny electorates deciding epochal boundaries. The "Swiftian" ending could involve ratifying the boundary by committee vote date—making the process itself the marker. 

  Constraints matter: no wink-to-camera, no mocking real people. The bureaucratic voice must stay pristine, letting the absurdity speak through strict adherence to protocol. Scoring rubrics should allocate points to impossible criteria (e.g., "protection from anthropogenic interference" while civilization collapses). The invented marker’s defense should highlight its flaws as virtues—e.g., microplastics praised for "resisting biodegradation," ignoring their patchy distribution. 

  For the future field note, a detached tone describing "anthropogenic laminates" (plastic layers) as "highly persistent" would underscore preservation ironies. The voting committee’s composition—geologists from specific subfields—should feel comically narrow. The "recoil" moment might be declaring the boundary "synchronous" by fiat because the vote was held on a Tuesday. 

  Every element must serve the critique: the protocol’s rigidity vs. the Anthropocene’s fluidity. Even the eligibility section ("national surveys only") can hint at geopolitical biases in defining global time. The piece’s power lies in never breaking character—letting bureaucracy satirize itself.
