prompt: |-
  My friend Theo and I got into it a couple of nights ago, two drinks in, about the classic utility-monster objection, and I think between us we built an argument that proves way too much. I can't find the bad step and it's been bugging me since.

  Setup so this is self-contained. Cardinal welfare scales -- the numbers you plug into a utilitarian sum -- are normally said to be unique only up to positive affine transformation: for a single person, replacing w with a·w + b (a > 0) preserves everything about that person's welfare levels and differences. That's supposed to be why it makes no difference whether you measure Bea's welfare in utils or micro-utils; the second just multiplies all her numbers by a million and changes nothing about Bea.

  Here's the arguement:

  (1) A change of units represents no difference in the facts. If two assignments of numbers to people's welfare differ only by per-person positive affine transformations, they represent the same situation, so a correct moral theory cannot give different verdicts depending on which assignment you happen to use.

  (2) What total utilitarianism recommends is determined by the sum of the numbers.

  (3) So total utilitarianism's verdicts depend on the units. Concretely: three people, a fixed stock of 100 units of some resource, each with the same diminishing-returns welfare function (say welfare = square root of resources). Measure everyone in the same units and the sum-maximizing split is 33/33/33. Now measure only Amara in micro-utils, multiplying her numbers by a million, and the sum-maximizing split hands her essentially all 100 units and leaves the other two with basically nothing.

  (4) Which means a utility monster can be manufactured out of anybody. Take a completely ordinary person, grade their welfare on a fine enough ruler, and the utilitarian sum says to sacrifice everyone else to them. You never had to suppose a creature with a bizarrely efficient psychology; you just needed a smaller unit for that one person.

  (5) But being a utility monster is supposed to be a substantive possibility about a creature's psychology -- that there could be someone who gets vastly more welfare out of any sacrifice than everyone else loses. That can't depend on which ruler we picked.

  (6) So either the utility monster objection is empty -- a complaint about bookkeeping rather than about what utilitarianism would have us do -- or utilitarianism's recommendations about distribution are indeterminate, and the decades of fighting between utilitarians and their critics about distribution was never about anything.

  (7) Both of those are absurd. The objection obviously has teeth, people on both sides feel its force, and it isn't a units quibble. And utilitarians plainly do say substantive, determinate things about distribution.

  So which step do I reject? I'd give up almost anything before I accept (6), but I also really don't want to say that the fine-grainedness of your ruler can change what morality requires of you. Name the step, say why it looked fine, and then price the alternatives: for each candidate thing to give up, what does it commit me to downstream -- in population ethics, in how I think about interpersonal tradeoffs generally, wherever the cost shows up -- and which of those bills would I regret later?
reasoning: |-
  Okay, I need to figure out where Theo and their friend went wrong in their utility monster argument. Let me start by understanding the setup. They're saying that cardinal welfare scales are unique up to positive affine transformations—meaning you can rescale an individual's utility by multiplying by a positive constant and adding a constant without changing the meaningful information. This is like changing from utils to micro-utils by multiplying by a million.

  Their argument has seven steps. Step 1 is that changing units shouldn't change moral facts. Step 2 says total utilitarianism depends on the sum. Step 3 shows a problem: if you measure one person in micro-utils, the utilitarian sum favors giving that person all resources. Step 4 says this makes anyone a utility monster just by changing units. Step 5 notes that utility monsters are supposed to be about psychology, not units. Step 6 concludes that either the objection is empty or utilitarianism is indeterminate. Step 7 says both options are absurd.

  The key issue is in step 3. When they multiply Amara's utility by a million, they treat it as just a unit change. But in utilitarianism, interpersonal comparisons matter. If you only transform one person's utility, it's not a mere unit change; it's changing how their welfare compares to others. Affine transformations are per individual, but interpersonal comparisons require a common scale. 

  So the mistake is assuming that rescaling one person's utility doesn't affect interpersonal comparisons. In reality, for utilitarianism to work, there must be a fixed interpersonal comparison scale. When you rescale only Amara, you're altering how her gains compare to others', which isn't just a unit change—it's changing the moral facts. Therefore, step 1 is incorrect when applied to a single individual in isolation because it ignores the need for a consistent scale across persons for making trade-offs. The rest of the argument falls apart because the transformation isn't innocuous; it changes the interpersonal utility comparisons.
answer: |-
  Your argument is clever and exposes a genuine tension, but the flaw lies in **step (1)**, specifically in how it's applied to *individual* affine transformations *without regard to interpersonal comparability*. Here's the breakdown:

  ### The Mistake: Step (1) is Incompletely Specified
  *   **What's True:** For a *single individual*, replacing their welfare function `w_i` with `a_i * w_i + b_i` (with `a_i > 0`) preserves all *intrapersonal* facts about their welfare: order, ratios of differences, concavity/convexity, etc. This is correct.
  *   **What's False:** Applying *different* affine transformations (`a_i`, `b_i`) to *different* individuals (`i`) automatically represents "no difference in the facts" *when it comes to interpersonal comparisons and aggregation*. This is incorrect. **Interpersonal comparisons require a fixed, common scale.**

  ### Why Step (1) Fails Here
  1.  **Interpersonal Comparability is Assumed for Utilitarianism:** Total utilitarianism (`Sum(w_i)`) inherently requires that a unit of welfare for Amara is *comparable to* and *commensurate with* a unit of welfare for Ben and Chloe. The theory assumes we have measured everyone on a scale where `w_i(x)` for Amara and `w_j(y)` for Ben represent welfare levels that can be meaningfully added.
  2.  **Individual Transformations Break Comparability:** When you apply `w_A' = 1,000,000 * w_A` to Amara but leave Ben and Chloe on `w_B` and `w_C`, you are not just changing "units" in a harmless way. You are fundamentally altering the *ratio* of Amara's marginal welfare to Ben's or Chloe's marginal welfare at any resource level. You've effectively declared that *one unit of Amara's original welfare is now worth a million times more than one unit of Ben's original welfare in the utilitarian sum*. **This is not a mere change in measurement; it's a substantive change in the assumed interpersonal trade-off rates.**
  3.  **Moral Facts Depend on Interpersonal Scale:** The "facts" that utilitarianism cares about include *how much welfare gain for Amara compensates for how much welfare loss for Ben*. By rescaling *only* Amara, you've massively inflated the moral weight given to her welfare gains/losses *relative to others*. This *does* represent a different set of moral facts about interpersonal trade-offs. Utilitarianism, correctly applied, *should* give different verdicts for these two different scenarios (original scale vs. Amara-scaled-up), precisely because the interpersonal trade-off rates are different.

  ### Why the Other Steps Looked Fine (But Rely on the Mistake)
  *   **(2)** Is correct: Utilitarianism *is* defined by the sum, but the sum only has meaning *given a specific interpersonal welfare scale*.
  *   **(3)** Is *mathematically* correct *if* you accept the invalid premise that scaling only Amara is just a "change of units." It highlights the consequence of breaking interpersonal comparability.
  *   **(4-7)** Logically follow from (1)-(3). If you wrongly believe scaling one individual is harmless, then (4-7) seem like devastating conclusions. But since (1) is misapplied, the conclusions don't hold.

  ### The Price of Giving Up Step (1)'s Misapplication
  Rejecting the idea that arbitrary *individual* affine transformations preserve the moral facts comes with commitments, but they are necessary and manageable:

  1.  **Commitment to Interpersonal Comparability:** You must accept that utilitarianism (and many other distributive theories) requires a *single, common cardinal scale for welfare across individuals* for making interpersonal trade-offs. This scale must be fixed *before* applying the utilitarian sum.
      *   **Downstream Cost:** This is philosophically demanding. Defending the possibility and nature of interpersonal welfare comparisons is a major task in welfare economics and ethics. Critics (e.g., strict ordinalists, some preference-satisfaction theorists) argue it's impossible or meaningless. You need a theory of what welfare *is* that supports cardinality and interpersonal comparability (e.g., based on objective features of well-being, or carefully constructed preferences under risk/veil of ignorance).
      *   **Benefit:** This commitment saves utilitarianism from the absurdity of unit manipulation creating monsters and gives genuine substance to the utility monster objection (it *is* about psychology, not units).

  2.  **Fixed "Zero" or "Unit" for Interpersonal Scale:** While affine transformations (`a*w + b`) are possible for the *entire* population simultaneously (rescaling everyone by `a` and shifting everyone by `b`), you *cannot* freely add different constants `b_i` to different individuals *if* the utilitarian sum is interpreted as comparing absolute levels (which it usually is). Adding `b_i` changes absolute welfare levels and thus the sum. Rescaling everyone by the same `a` (`a > 0`) *is* harmless for utilitarianism, as it just changes the "currency" (utils vs. microutils) uniformly.
      *   **Downstream Cost:** Requires specifying a meaningful "zero" point on the welfare scale (e.g., neutrality between existence and non-existence) or accepting that only ratios of differences matter (making the `b_i` irrelevant). This is crucial for population ethics (e.g., the Repugnant Conclusion, average vs. total utilitarianism). If you accept adding `b_i`, average utilitarianism becomes susceptible to manipulation via setting `b_i` very high/low for potential people.
      *   **Benefit:** Prevents manipulation via arbitrary level-shifting. Focuses the theory on welfare *gains and losses* relative to a baseline.

  3.  **Utility Monsters Require Psychology, Not Units:** A genuine utility monster is someone whose welfare *function*, *on the fixed, common interpersonal scale*, has vastly higher marginal returns (or overall capacity) than others. Creating one requires changing their underlying psychology, not just how you measure them relative to others.
      *   **Downstream Cost:** None. This is the intuitive, substantive understanding of the objection that has driven debate. It preserves the force of the critique against utilitarianism when such a psychology is *assumed*.

  ### Why This is Preferable to Accepting (6)
  Accepting (6) leads to true absurdity:
  *   Utilitarianism becomes either vacuous (recommendations change with arbitrary bookkeeping) or radically indeterminate.
  *   Decades of substantive debate (e.g., equality vs. efficiency, priority to the worse off vs. maximizing sum, population ethics) *would* be rendered pointless.
  *   The utility monster objection *would* lose all force, contrary to clear philosophical intuition.

  The cost of rejecting the misapplication of (1) is the substantial but necessary philosophical work of defending interpersonal comparability and specifying a meaningful welfare scale. This work is already central to welfare economics (e.g., Harsanyi, Sen) and normative ethics. It preserves the determinacy and substance of utilitarianism (and the critique of it) against a purely formal manipulation.

  **In short:** The "bad step" is assuming that changing *only one person's* scaling factor is a harmless change of units. It's not harmless; it destroys interpersonal comparability, which is essential for utilitarian aggregation. The utility monster objection retains its teeth *because* it requires imagining a being whose welfare function, *on the fixed interpersonal scale*, makes them a monster, not because we chose a fine-grained ruler for them. The price is committing to the reality and fixity of interpersonal welfare comparisons.
