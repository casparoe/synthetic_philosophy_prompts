answer: |-
  ## Reconstructing the Logic of Therapeutic Equivalence in Drug Substitution

  Your case study is remarkably fertile for analyzing the transitivity of comparative value judgments. Let's systematically reconstruct the implicit logic of "at least as good as" (`≥`) and "better than" (`>`) within this practice, addressing your specific queries.

  **1. Implicit Theory of Comparatives & Transitivity Requirements**

  The core relation driving substitution is **"therapeutically equivalent to the reference product (R) within tolerance T"** (`≈_R^T`). This is defined operationally: Generic G is `≈_R^T` iff key pharmacokinetic measures (e.g., AUC, Cmax) for G fall within 80-125% of R's measures. The practice strictly presupposes:

  *   **Reference-Relativity:** `≥` (and hence `≈_R^T`) is fundamentally dyadic *and* anchored to a specific reference R (the brand). There is no presupposition of a universal, reference-independent ordering.
  *   **Local Substitutability:** If G `≈_R^T`, then G is licensed as a direct substitute for R *for the average patient, for the approved indication*. This licenses the judgment "G is not worse than R, within tolerance T" (`G ≥_T R`) for substitution purposes.
  *   **Non-Transitivity of `≈_R^T`:** The practice meticulously avoids testing pairwise equivalence among generics (G1 `≈` G2). This strongly suggests it *does not presuppose* that `≈_R^T` is transitive. If transitivity were presupposed, testing G1≈R and G2≈R would imply G1≈G2, making the avoidance of pairwise testing irrational. The structure is inherently intransitive: G1 ≈_R^T, G2 ≈_R^T, but G1 may not ≈_{G1}^T G2 (or ≈_R^T for a stricter T).

  What the practice *fits well with*, but doesn't strictly presuppose, is a **Semi-Order model** (Luce, 1956):
  *   An underlying strict weak order `>` ("better than") exists (e.g., based on precise efficacy/toxicity profiles).
  *   Indifference (`≈`) is defined by a fixed tolerance threshold T: `A ≈ B` iff `|A - B| ≤ T` on the underlying scale.
  *   Crucially, indifference *fails transitivity*: `A ≈ B` and `B ≈ C` do *not* imply `A ≈ C`. This perfectly models the possibility of "chains of indifference" (Brand ≈ G1, G1 ≈ G2, but Brand not ≈ G2). The practice's structure is isomorphic to this model.

  The practice is **underdetermined** regarding the *nature* of the intransitivity:
  *   **Incomparability Reading:** Are G1 and G2 genuinely incomparable if |G1 - G2| > T? The practice doesn't force this. The lack of pairwise testing means no judgment *about their direct relation* is made or required.
  *   **Epistemic Reading:** Is there a precise underlying value ordering obscured by measurement limitations, justifying the tolerance? The practice is compatible with this (bioequivalence testing *is* statistical), but it doesn't *require* it. The tolerance T functions operationally as a *constitutive standard* for equivalence, not merely an epistemic filter. "Equivalent within T" *defines* substitutability for the system.
  *   **Vagueness Reading:** Is "therapeutically equivalent" a vague predicate? While plausible, the practice deliberately imposes a sharp boundary (80-125%), making a pure vagueness interpretation less compelling than the semi-order model.

  **Crucially, the practice does *not* require `≈_R^T` to be transitive.** It gets by perfectly well with the weaker structure of local substitutability relative to R. The chained substitution relies *only* on each link being licensed by `≈_R^T` relative to the *current* reference point in the chain (ultimately traceable back to R), *never* on a direct `≈_{G_current}^T G_next` relation holding between the two products being swapped. The chain is a sequence of pairwise substitutions, each justified independently against R (or a product equivalent to R), not a single transitive inference across the entire sequence.

  **2. The Central Crux: Genuine Logical Defect or Accumulated Risk?**

  This is **not primarily a genuine logical defect in the transitivity of the core value relation** (`≥` understood precisely). The real phenomenon is **risk accumulation across tolerated variations within a non-transitive equivalence relation.**

  *   **Defending Transitivity:** A defender of the transitivity of a precise underlying `≥` (e.g., based on true therapeutic utility) can readily concede this practice. They argue:
      *   The tolerance T acknowledges practical limitations (measurement error, biological variability) and defines a zone of *pragmatic indifference for single substitutions*.
      *   `G1 ≈_R^T` (`|G1 - R| ≤ T`) and `G2 ≈_R^T` (`|G2 - R| ≤ T`) logically imply only that G1 and G2 are both within 2T of each other (`|G1 - G2| ≤ 2T`), *not* that they are within T (`|G1 - G2| ≤ T`). The potential disparity |G1 - G2| ≤ 2T is inherent in the model, not a logical contradiction.
      *   The *risk* arises because the *magnitude* of the tolerated variation (T) is finite, and multiple independent variations can accumulate. Switching from R to G1 introduces a potential shift ≤ T. Later switching from G1 to G2 introduces *another* potential shift ≤ T relative to R. The patient's effective dose/response could thus shift by up to 2T relative to their *original* baseline (R), potentially exceeding the single-switch tolerance T. This is a consequence of the *width* of T and the *number* of switches, not the logical structure of `≥` itself.
  *   **Comparison to Imperceptibility Spectra:** This explicit tolerance-based spectrum is **less threatening to transitivity defenders** than classic imperceptibility-based Sorites arguments.
      *   **Imperceptibility:** Rests on the (contested) premise that imperceptible differences *cannot* be value-relevant, directly attacking the transitivity of indifference (`≈`). If A=B, B=C, but A≠C, transitivity seems shattered. The challenge is fundamental and logical.
      *   **Explicit Tolerance:** The tolerance T is an *acknowledged, finite margin* for operationalizing "close enough *for this purpose*". It doesn't assert that differences within T *lack value significance* absolutely, only that they are *insignificant for licensing single substitution against the reference*. The intransitivity is a designed feature of the operational equivalence relation (`≈_R^T`), not necessarily a revelation about the transitivity of a more fundamental `≥`. The defender can maintain that the *underlying precise values* are transitively ordered, while the *pragmatic equivalence relation* is not transitive by design.

  **3. Biosimilars & Narrow TI: Stakes, Margins, and Path-Dependence**

  The departures for biosimilars and narrow therapeutic index (NTI) drugs do **not** constitute a direct admission that equivalence to a reference (`≈_R^T`) is non-transitive *per se*. Instead, they reflect adjustments based on the **context of switching and the stakes involved.**

  *   **Indexing the Margin to Stakes/Risk:** The core insight is that **the acceptable tolerance T depends on the consequence of error**. For small molecule generics, T (80-125%) is deemed acceptable *for a single switch* given the typical dose-response curve and safety margin. For NTI drugs, the dose-response curve is steeper, and the safety margin is narrower. The *same* pharmacokinetic variation |Δ| may carry a much higher risk of therapeutic failure or toxicity. Therefore, the *effective tolerance T_effective* required for safe substitution is *smaller* than the standard bioequivalence margin. The standard `≈_R^T` finding (with the *standard* T) is insufficient not because transitivity fails, but because T is *too wide* for the high-stakes context. Jurisdictions resisting substitution are effectively demanding a tighter tolerance or additional evidence.
  *   **Biosimilars & Interchangeability: Path-Dependence:** The biosimilar "interchangeability" designation is crucial. It explicitly addresses **sequences of switches**. Demonstrating interchangeability requires showing that *alternating* between the biosimilar and the reference (or switching multiple times) poses no additional risk compared to continuous use of either alone. This treats "acceptability for substitution" not solely as a dyadic property (`G ≥_{T} R`), but as a **ternary (or higher-adicity) property relative to a current state and a potential path**.
      *   The core question shifts: Not just "Is G equivalent to R?" (`G ≈_R^T?`), but "Is switching *from the current product C to G* acceptable, *given the possibility of subsequent switches*?" (`AcceptableSwitch(C, G, PotentialFuturePath)?`).
      *   **Implication for Adicity:** This strongly suggests that "safe to substitute" (`≥` in the operational sense for this context) is at least **ternary**: `G is substitutable for R relative to patient history/potential future path H`. The interchangeability designation certifies that `G` is substitutable for `R` *relative to a history/path* that includes potential switching back and forth. It certifies robustness against *sequences*, not just pairs. The standard small-molecule generic `≈_R^T` finding only certifies the dyadic relation `G ≈_R^T`, implicitly assuming a low-risk context where sequence effects are negligible or the margin T is sufficiently conservative *for the expected use*.

  **4. Assessing Reforms: Logic vs. Risk Reduction**

  *   **(a) Worst-Case-Reference Rule:** This requires a new generic G to demonstrate bioequivalence (within T) not just to R, but to the already-approved generic farthest from R within the tolerance band (call it G_max). This aims to make the substitutable set *closed under pairwise equivalence within T*: If G ≈_T G_max and G_max ≈_T R, then G ≈_T R, and crucially, any two approved generics G_i and G_j would satisfy |G_i - G_j| ≤ 2T. More importantly, it *would* ensure that any two generics are pairwise within *some* finite bound (≤ 2T) of each other.
      *   **Does it repair a logical defect?** If the "defect" is the potential for large pairwise disparities (|G1 - G2| ≤ 2T) under the old rule, then *yes*, it constrains this pairwise disparity directly. It imposes a *de facto* transitive closure *for pairwise equivalence within 2T* on the set. However, it doesn't make `≈_R^T` itself transitive; it just shrinks the maximum pairwise distance within the set.
      *   **Does it reduce risk?** Yes, significantly. It bounds the maximum possible difference between *any* two substitutable products to 2T. The maximum accumulated shift over a chain is also capped at 2T (since all products are within 2T of each other). This dramatically reduces the worst-case accumulation risk compared to the current system (where worst-case accumulation is n*T for n switches).
      *   **Cost:** Very high. Requires complex testing against a moving target (G_max). As new generics are approved, existing ones might need retesting if they become the new G_max or fall outside the bound relative to a new G_max. This increases development time, cost, and regulatory burden, potentially reducing generic competition and raising prices. Determining "farthest" robustly across multiple measures is non-trivial.
  *   **(b) Current-Product Rule:** Substitution is only permitted if the *specific* generic G is shown equivalent (within T) to the *product the patient is currently taking* (C). This largely ends routine automatic substitution.
      *   **Does it repair a logical defect?** No. The core equivalence relation `≈_C^T` remains non-transitive. Switching from C to G1 (≈_C^T) and then from G1 to G2 (≈_{G1}^T) could still result in |C - G2| ≤ 2T. The *logical* structure is unchanged.
      *   **Does it reduce risk?** Yes, profoundly for the *individual patient's trajectory*. Each switch is only permitted if the new product is within T of the *patient's current baseline*. This prevents the uncontrolled drift inherent in the reference-anchored system. The maximum deviation from the *patient's starting point* is bounded by T after any number of switches (since each switch moves ≤ T from the *current* state).
      *   **Cost:** Very high. It destroys the efficiency of the current system. Pharmacies would constantly need updated bioequivalence data for every potential switch between specific products. Prescribers might need to be more involved. The administrative burden and cost would likely make widespread generic substitution impractical, undermining its core purpose of cost reduction.

  **Assessment:** Neither reform addresses a fundamental logical defect in transitivity; both primarily manage risk. On my diagnosis (that the core issue is risk accumulation, not logical defect), **neither reform is strictly necessary for logical coherence.** However, if risk reduction is paramount:
  *   **Worst-Case-Reference** reduces population-level risk by bounding pairwise differences but is likely prohibitively expensive and complex.
  *   **Current-Product Rule** provides superior *individual* risk control by anchoring each switch to the patient's current state but sacrifices the systemic efficiency enabling cheap generics.
  The **Current-Product Rule** is arguably *more defensible* if patient safety is the absolute priority, as it directly prevents accumulation relative to the individual's baseline. However, its cost (effectively ending routine substitution) is arguably too high for society, given the rarity of demonstrable harm under the current system for most drugs. The **Worst-Case-Reference** rule is a compromise, mitigating the worst accumulation while preserving systemic efficiency, though its feasibility is questionable.

  **5. Respect-Relativity: Containment, Not Escape**

  The explicit respect-relativity ("equivalent *with respect to* pharmacokinetics in the *average patient* for the *approved indication*") is crucial and **helps contain, but does not eliminate, the challenge to transitivity.**

  *   **How it Helps (Containment):** It localizes the tolerance and potential intransitivity to a *specific respect frame*. The defender of transitivity can argue:
      *   Within the *precisely defined respect* (e.g., "AUC_0-inf for condition X in population Y"), the underlying values *are* precisely ordered and transitive. The tolerance T is purely operational/pragmatic for that frame.
      *   Intransitivity arises only when we *apply* the pragmatic equivalence relation (`≈_R^T`) defined *within that frame* to chain substitutions. The problem is confined to the *application* of the tolerance-based equivalence predicate in a sequential context, not the fundamental ordering *within the respect*.
      *   Claims about other respects (excipients, individual variation, switching effects) are explicitly bracketed out. Any intransitivity arising in *those* respects is a separate issue.
  *   **Why it Doesn't Provide an Escape:** The core challenge persists *within the specified respect frame*:
      *   The practice *still* relies on a non-transitive equivalence relation (`≈_R^T`) *within that frame* to license chained substitutions. The respect-relativity doesn't make `≈_R^T` transitive.
      *   The problem of accumulation *within that respect* (e.g., cumulative drift in effective drug exposure for the average patient) remains real and is acknowledged by the biosimilar/NTI exceptions. Respect-relativity clarifies *what* is drifting (AUC, not necessarily excipient tolerance), but the drift itself is a consequence of the non-transitive operational equivalence within that pharmacokinetic respect.
      *   Locating the tolerance inside the respect doesn't resolve the question of whether "therapeutically equivalent within T" *in that respect* should be transitive *for the purpose of chained substitution*. The practice demonstrates it does not assume transitivity.

  **Conclusion**

  The US generic substitution system provides a compelling real-world model of an explicitly non-transitive equivalence relation (`≈_R^T`) employed for repeated, chained value-based substitutions. Its structure aligns with a semi-order model where indifference fails transitivity. The core challenge it poses for transitivity defenders is not primarily logical but practical: the accumulation of risk across tolerated variations. Unlike imperceptibility-based spectra, the explicit, finite tolerance margin makes this accumulation quantifiable and manageable in principle (e.g., via the Worst-Case-Reference rule), though potentially at high cost. The biosimilar and NTI exceptions highlight how the acceptable tolerance T, and the requirement for path-dependent interchangeability, depend crucially on the stakes and context of switching. Respect-relativity confines the issue but doesn't dissolve it. Ultimately, the practice reveals that robust systems for repeated comparative choices under uncertainty may rationally employ non-transitive equivalence relations anchored to references or current states, prioritizing manageable risk and operational efficiency over the preservation of transitivity for the operational "at least as good as" relation governing substitutions. The defender of the transitivity of a *precise, underlying* value ordering can survive, but they must concede the rationality and prevalence of non-transitive operational equivalence relations in high-stakes institutional decision-making.
