prompt: |-
  hey — I'm 17, I do policy debate and student government, and I'm doing an independent project this spring on who should get to vote. The thing I keep runing into is that everyone argues by just pointing at one case: someone says 16 year olds pay taxes and can drive, someone else says no but they still live with their parents and cant really judge policy, and then nothing moves. So before I write anything I want the full spec: what would a theory of the franchise actually have to get right to be worth taking seriously? Write me the desiderata list — which cases it has to handle without embarrassment (permanent residents who've lived in a town for twenty years and pay taxes there, citizens who moved abroad at age three and will never come back, people with severe cognitive disabilities, people in prison, a 14 year old who'll be living with the consequences of a climate or debt decision for seventy years, tourists and short term workers), which distinctions it isn't allowed to collapse (having a vote at all vs how much your vote is worth, being entitled to vote vs it being a good idea for you to vote, membership in a community vs merely being subject to its laws, the right to vote vs the right to run or to hold office), and which of those requirements are genuinely non-negotiable versus just something one side assumed at the start. Give me the case or the argument behind each requirement, not just the bullet, and say for each whether you think it's a real desideratum or a prejudice of one camp.

  The part I actually care about: I have this idea and I cant tell if it's good or if I'm just attached to it. Call it the stake gradient — the claim to a vote doesn't switch on at some age or at citizenship, it's a matter of degree, and it's strongest for whoever has the most years left living under whatever gets decided, which if you take it seriously gives a 15 year old a stronger claim than a 75 year old and makes the standard theyre too young to understand objection look like it's answering a different question entirely. I want that tested against your list rather than just rated: does it violate a desideratum that the usual views all satisfy (a flat age cutoff, the all-affected-interests principle, membership or consent of the governed, the you've paid in / done national service picture), and does taking it seriously force you toward fractional or weighted votes — parents casting proxy votes for their kids, or 16 to 21 year olds getting half a vote — or can you get the stake gradient without any of that, and what would that even look like in practice?

  Two more things. Please flag any pair of requirements on your list that you suspect can't both be satisfied, since if there is one that's probably the thing I'd build the whole paper around. And tell me which single desideratum rules out the most of the standard positions. If it helps to fix the purpose, I want a criterion good enough to actually decide whether my city should let 16 year olds and green card holders vote in municipal elections — not just something that sounds nice in a round of debate. And don't give me a reading list or citations or anything, I'll go find sources myself, I just want the shape of the argument.
reasoning: |-
  Okay, let me tackle this user's query. They're a 17-year-old involved in policy debate and student government, working on an independent project about voting rights. The main issue they've encountered is that discussions get stuck on single cases without deeper theory. They want a list of desiderata for a serious franchise theory, test their "stake gradient" idea against it, and identify any conflicting requirements.

  First, I need to outline the key requirements a voting theory must meet. The user mentioned specific cases: permanent residents, expats, people with cognitive disabilities, prisoners, young people affected by long-term policies, and transient populations. Each of these groups presents unique challenges. For example, permanent residents pay taxes but aren't citizens, so the theory must address their inclusion without relying solely on citizenship. 

  Next, distinctions like having a vote vs. its weight, entitlement vs. advisability, community membership vs. subjection to laws, and voting vs. holding office need clarification. These are crucial to avoid conflating different principles. For instance, the stake gradient idea ties voting power to years affected by policies, which might conflate stake with competence.

  The user's stake gradient concept proposes voting power based on remaining lifespan. This challenges age-based cutoffs but raises issues like fractional votes or proxy voting. Testing this against desiderata, especially non-arbitrariness and competence, is essential. If a 15-year-old has a stronger claim than a 75-year-old, does this violate the principle that suffrage shouldn't depend on life expectancy? Also, implementing weighted votes might clash with equality, a non-negotiable for many.

  Conflicting desiderata are a key area. For example, the all-affected principle vs. practical administrability. Including everyone affected by policies, like future generations or foreigners, is ideal but impractical. The stake gradient amplifies this by emphasizing long-term impact, which could lead to unworkable systems. The competence vs. non-arbitrariness conflict is another tension—competence standards risk discrimination, while avoiding them might include those unable to participate meaningfully.

  The most decisive desideratum might be non-arbitrariness. Age cutoffs and residency requirements often appear arbitrary. If a theory can address this without creating new biases, it gains strength. The stake gradient replaces one arbitrariness with another—tying votes to life expectancy, which varies individually and might disadvantage certain groups.

  For the user's municipal example, the stake gradient could support voting rights for 16-year-olds and green card holders, as both have significant stakes. But it might exclude seniors or short-term residents, raising fairness issues. The challenge is balancing stake with other principles like competence and community membership.

  In conclusion, the stakeholder's idea is innovative but must navigate tensions between theoretical ideals and practical constraints. Highlighting the conflicts, especially between affected interests and administrability, could form the paper's core. Emphasizing non-arbitrariness as a critical desideratum helps evaluate existing models and the stake gradient's viability.
answer: |-
  Here’s the desiderata list for a serious theory of the franchise, tested against your "stake gradient" idea, with tensions and dealbreakers highlighted:

  ---

  ### **Core Desiderata (Non-Negotiable or Near-Universal)**
  1.  **Non-Arbitrariness:** The rule can’t rely on arbitrary distinctions (e.g., "18 is magic"). *Case:* Why 18 vs. 17 years 364 days? Why citizenship if a permanent resident has identical tax/legal burdens? *Real Desideratum?* **Yes.** Foundational to fairness. *Stake Gradient Test:* Excels here. Replaces an arbitrary cutoff (age) with a continuous variable (stake/years affected). *Risk:* Replaces one arbitrariness (age) with another? (Why lifespan, not wisdom/experience?).

  2.  **Avoiding Tyranny of the Majority/Minority:** Must prevent permanent exclusion of a group bound by laws. *Case:* Long-term permanent residents taxed without representation. *Real Desideratum?* **Yes.** Core purpose of suffrage. *Stake Gradient Test:* Handles non-citizen residents well (high stake). Struggles with cognitively disabled (potentially low lifespan stake?) – risk of exclusion.

  3.  **Subjection Principle:** Those permanently and profoundly subject to a polity’s coercive power should have a say. *Case:* Citizen born abroad who returns vs. permanent resident who never leaves. *Real Desideratum?* **Yes.** Legitimacy demands it. *Stake Gradient Test:* Strong alignment. High stake often correlates with subjection. Focuses on *impact* of coercion.

  4.  **Practical Administrability:** Rules must be clear, verifiable, and feasible to implement at scale. *Case:* Distinguishing a tourist (3 weeks) from a "temporary worker" (1 year). *Real Desideratum?* **Yes.** Theory must work in the real world. *Stake Gradient Test:* **Major Weakness.** Measuring "years left affected" is impossible individually. Requires proxies (age), reintroducing arbitrariness. Fractional votes? Logistical nightmare.

  5.  **Formal Political Equality (Within the Franchise):** If you have the vote, your vote counts equally (1 person, 1 vote). *Case:* Rejecting property-weighted votes. *Real Desideratum?* **Overwhelmingly Yes.** Cornerstone of modern democracy. *Stake Gradient Test:* **Direct Violation.** If stake varies, votes *should* be weighted? This is a massive hurdle. Can you *define* the franchise by high-stake individuals without weighting votes *within* it? (e.g., only >X stake votes).

  ---

  ### **Critical Distinctions (Must Not Collapse)**
  6.  **Franchise vs. Vote Weight:** Who gets *a* vote vs. how *much* that vote counts. *Case:* "Children have a stake!" doesn't imply they must vote; maybe parents get extra weight (rarely accepted). *Stake Gradient Test:* Your idea *threatens* this distinction. High stake logically suggests higher weight. Avoiding weight forces you to set a minimum-stake threshold for getting *any* vote – collapsing back towards a cutoff.

  7.  **Entitlement vs. Advisability:** Having the *right* to vote vs. whether exercising it is *wise/informed*. *Case:* A 95-year-old with dementia (entitled? yes. Advisable for them to vote alone? maybe not). *Real Desideratum?* **Crucial.** Denying rights based on perceived incompetence is a slippery slope to exclusion. *Stake Gradient Test:* Neutral. Doesn’t inherently address competence. Could coexist with competence tests (dangerous!) or ignore it.

  8.  **Community Membership vs. Mere Subjection:** Belonging to the demos vs. just being impacted. *Case:* Tourists subject to traffic laws shouldn't vote. *Real Desideratum?* **Contested but Important.** Pure "All-Affected Interests" is unrealistically broad. *Stake Gradient Test:* Weak. A tourist with 70 years left *could* have high stake. You need an *additional* principle (like residency duration) to define the relevant community/stakeholder pool.

  9.  **Voting vs. Holding Office:** Suffrage vs. eligibility for power. *Case:* Felons might regain vote but be barred from office. *Real Desideratum?* **Yes.** Different competencies/trust involved. *Stake Gradient Test:* Neutral. Doesn’t inherently address office-holding.

  ---

  ### **Contested but Important Considerations**
  10. **Competence/Independence:** Capacity for reasoned choice free from undue control. *Case:* Concerns about 16-year-olds living with parents. *Real Desideratum?* **Contested (Often a Prejudice).** Used inconsistently (no tests for elderly). *Stake Gradient Test:* **Exposes the Prejudice.** If the core issue is stake, competence is secondary (and should be addressed separately if at all). Your idea highlights this tension brilliantly.

  11. **Intergenerational Equity:** Fairness to future generations. *Case:* Climate policy. *Real Desideratum?* **Morally Compelling, Practically Ignored.** *Stake Gradient Test:* **Greatest Strength.** Directly centers long-term consequences, giving youth stronger claims. *Problem:* Future generations don't exist to vote. Does it imply proxy votes for children? (See #6).

  12. **Contribution/Investment:** Paying taxes, doing service. *Case:* "No taxation without representation." *Real Desideratum?* **Contested (Often a Prejudice).** Excludes the poor, caregivers, disabled. *Stake Gradient Test:* Replaces it. Contribution matters only insofar as it creates stake (taxes fund services affecting you). More inclusive.

  ---

  ### **Testing the Stake Gradient & Key Tensions**
  *   **Does it violate a core desideratum others satisfy?** Yes. **Formal Political Equality (#5)** is sacrosanct in existing systems. Age cutoffs, citizenship requirements, even prisoner disenfranchisement *usually* maintain 1-person-1-vote *within* the franchise. Stake Gradient inherently challenges this.
  *   **Does it force fractional/weighted votes?** **Almost Inescapably.** If stake is a continuous gradient, and the franchise isn't binary, then:
      *   **Option A (Weighting):** Votes are weighted by stake (e.g., 0.5 votes at 16, scaling up). Violates #5.
      *   **Option B (Threshold):** Only those above a minimum stake get a full vote. Reintroduces arbitrariness (#1) at the threshold line.
      *   **Option C (Proxy):** High-stake disenfranchised (minors) have votes cast *for* them (e.g., parents). Raises #7 issues (who decides wisely?) and #6 (is this *their* vote or the proxy's?).
  *   **What would it look like without weighting?** Only feasible approach: Define the franchise as **all residents above a minimum age**, justified *because* that age group has sufficiently high stake on average. This abandons the gradient *in practice* for administrability (#4) and equality (#5), using it only as the *reason* for lowering the voting age. It doesn't help with non-citizen residents or the elderly.

  ---

  ### **The Irreconcilable Tension (Build Your Paper Here)**
  *   **All-Affected Interests / Stake Gradient (#3, #11) vs. Practical Administrability & Defining a Manageable Demos (#4, #8)**
      *   *The Conflict:* Including everyone significantly affected (future generations, foreigners impacted by climate policy) is theoretically pure but practically impossible. Defining a clear, administrable electorate (citizens, adults resident >X years) inevitably excludes some with genuine stake.
      *   *Why it Matters:* This tension is why we *have* arbitrary cutoffs. Your stake gradient sharpens this conflict – it demands inclusion based on a factor (future lifespan) that's incredibly hard to measure individually and pushes boundaries of the traditional "demos."
      *   *Stake Gradient's Role:* It forces this tension into the open, showing that *any* administrable line will exclude high-stake individuals (healthy 15-year-olds) and include low-stake individuals (terminal 80-year-olds). There's no clean solution.

  ---

  ### **The Most Decisive Desideratum**
  *   **Non-Arbitrariness (#1)** rules out the *most* standard positions when scrutinized:
      *   Why 18? (Biological maturity varies; other responsibilities start earlier).
      *   Why citizenship? (Ignores identical subjection/residence of permanent residents).
      *   Why disenfranchise felons post-sentence? (Punishment complete, subjection continues).
      *   Why residency *duration* requirements? (Why is 29 days insufficient but 30 days sufficient?).
      *   **Why it's powerful:** It exposes the lack of deep principle behind many existing rules. Your stake gradient is primarily an *attack* on this arbitrariness.

  ---

  ### **Applying to Your Municipal Case (16yos & Green Card Holders)**
  *   **Stake Gradient Argument FOR:**
      *   *16yos:* Have high stake (long lifespan, climate/debt impact). Competence (#10) is a red herring – many adults lack it. Subjected to laws (#3). Arbitrariness of 18 (#1).
      *   *Green Card Holders:* Subjected to laws & taxes permanently (#2, #3). Clear stake in local services, schools, infrastructure. Citizenship requirement is arbitrary (#1) exclusion.
  *   **Stake Gradient Challenges:**
      *   Does it *require* excluding low-stake residents (e.g., elderly planning to move, short-term workers)? If not, why exclude tourists? (Need #8 - Community Membership).
      *   Does it imply *more* than just inclusion? (e.g., Should 16yos votes count *more* than 80yos? If yes, violates #5 and is impractical).
  *   **Practical Conclusion via Stake Gradient:** You can argue the gradient justifies **lowering the voting age to 16** (recognizing their high average stake and combatting arbitrariness) and **including long-term resident non-citizens** (recognizing subjection and stake), *without* needing weighted votes, by defining the franchise as "resident adults (16+) with permanent ties." This satisfies #1, #2, #3, #4, #8, and sidesteps #5/#6 by keeping votes equal *within* this expanded franchise. It uses the gradient as the *reason* for expansion, not the *mechanism*.

  **In short:** Your stake gradient is powerful for **critiquing the status quo** and **justifying expansion** (youth, non-citizen residents), exposing arbitrariness and highlighting intergenerational equity. Its major weakness is **implementation** – truly weighting votes by stake is incompatible with political equality and administratively impossible. The core tension is **high-stake inclusion vs. feasible demos definition.** Focus your paper there. Good luck!
