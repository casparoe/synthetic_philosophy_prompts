  - Step 5: No content ascription is licensed (it's a bystander during training).
  - Step 6: Reliability: the feature currently correlates with P and with refusal. But does it cause refusal? Step 4 clamping: if clamping the feature to a high value causes refusal, then it is now a cause. But note: this is a change from training. How? Maybe the model changed? But we are at deployment. So for deployment, we can say: 
    - The feature is not a historical indicator of P (it wasn't selected for that), but currently it correlates with P and even causes refusal? (If clamping shows that.) Then we can rely on it for monitoring refusal? But note: if we monitor it and see a high value, that might indicate P and also cause refusal? But the governance lead wants to know: can we rely on it to mean P? The correlation might hold, but because it never was selected for P, it might be less stable? However, step 6 tests reliability: we can test the correlation on deployment-like data. If it holds, then we say: "In current testing, the feature is a reliable indicator of P and also has a causal effect on refusal." But the content ascription is empty.

