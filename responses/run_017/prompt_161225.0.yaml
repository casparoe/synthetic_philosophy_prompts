prompt: |-
  I am a PhD student in machine learning, working on interpretability, and for two terms I am embedded with the evaluation team at a lab that ships a vision-and-language model into regulated settings — clinical triage support and insurance claims handling. Part of my job is to help the team write the feature descriptions that go into our model cards and safety cases: statements of the form "direction 14.882 in layer 22 represents X". Those statements are read and signed off by a governance lead with a clinical background, and in two or three disputes a month they are the crux of the disagreement: one engineer reads a feature off its causal profile (what it responds to, what happens to behaviour when it is ablated or clamped), another reads it off training history (what it was ever useful for, at which stage, under which objective). The engineers have no philosophy training, they have roughly half a day per feature, and the documents they produce have to survive external review. So what I need is a written protocol, not a discussion.

  Please write that protocol: a decision procedure the team can run on a candidate feature description, in a fixed order, using only artefacts we actually have — training logs, checkpoints saved at intervals, per-example loss attributions, ablation and clamping results, the data mix, the loss, and the fine-tuning schedule. Ground it in the teleosemantic, selected-effects tradition (Millikan, Papineau, Neander): the content of a representation is fixed by what it has the proper function of indicating, where that function is fixed by a history of selection rather than by the representation's current causal or dispositional profile. The whole difficulty is in the translation, so please keep what the theory actually says while making each step checkable by someone who has never heard of it, and say plainly where a step is a judgement call dressed up as a check.

  Specific requirements:

  - For each step, state what counts as a sufficient answer and what counts as no answer at all. Where a step needs something the team cannot obtain (a counterfactual retrain, a lineage of checkpoints we did not save), say so and say what to do instead.
  - Mark the points at which the procedure returns "no content ascription is licensed here" and stops, and the points at which it hands the remainder to a named person because the residual question is a decision about how fine-grained or how revision-tolerant our descriptions should be, not a fact about the model.
  - Handle explicitly: (a) representations that were never causally recruited — bystanders that track what the network was rewarded for without ever driving it; (b) polysemantic directions, i.e. single directions carrying several apparently unrelated sensitivities; (c) features that first appear during a short fine-tuning stage, and features that survive fine-tuning unchanged; (d) inputs off the training distribution, including adversarial ones — that is, what a Millikan-style notion of Normal conditions should mean for an artefact whose environment is a data pipeline; (e) the standing worry that gradient descent on a next-token or contrastive objective is not selection in the relevant sense, so that nothing in the model has a proper function and every ascription fails — say what the procedure does with that worry rather than leaving it in a footnote; (f) the fact that the team does not really want a historical claim at all. What the governance lead needs is forward-looking: can we rely on this direction to mean X when we monitor it at deployment? Separate that reliability question from the content question in the procedure itself, and say what to do when they come apart.
  - The procedure proper should fit on two printed pages; the applications below can be as long as they need to be.

  Then run it on three cases:

  1. A direction in the image encoder that fires reliably on photographs of dogs and on dog-like textures in rendered scenes, whose clamping degrades dog/non-dog classification and nothing else, and which the whole team wants to call a dog detector.
  2. A direction that appears only after a short fine-tuning stage on a narrow task, which under probing still separates the pretraining property perfectly, but whose ablation now affects only the fine-tuning task.
  3. A scalar feature in the language model's residual stream that tracks a property the team cares about a great deal, which predicts a downstream refusal decision almost perfectly, but which never contributed to the loss during training because it was a bystander to a feature that did.

  I expect the procedure to answer (3) in a way I will not like; say what it says and say why I will not like it. Close with a short section on what the protocol cannot deliver — what a team reading its outputs should still not conclude.
reasoning: |-
  We are writing a protocol for ascribing content to neural network features (directions) based on the selected-effects theory (teleosemantics) of Millikan, Papineau, and Neander. The core idea is that the content of a representation is fixed by what it has been *selected for* indicating in the past, where selection is understood as a historical process that confers a "proper function". 

  The challenge is to translate this abstract theory into a concrete, step-by-step procedure that uses only artefacts available to the team (training logs, checkpoints, ablation results, etc.), and to handle the specific complications listed.

  The protocol will be structured as a decision tree with clear stopping points and hand-offs. It is designed to be executed in order. Each step must have a clear criterion for sufficiency and for absence of evidence.

  **Key Definitions for the Protocol**:
  - **Feature**: A specific direction (e.g., a neuron or a vector in an activation space) in the model at a specific layer.
  - **Proper Function (for the feature)**: What the feature was selected for during the training history. This is determined by the feature's contribution to the model's performance (as measured by the loss or reward) in the past.
  - **Normal Conditions**: The conditions (data distribution and training setup) under which the selection took place. For an artificial system, this is the training data distribution and the training procedure (including the loss function and optimization algorithm). Inputs that are out-of-distribution (including adversarial examples) are not Normal Conditions unless they are part of the training data.

  **Assumptions**:
  - We assume that the training process (gradient descent with the given objectives) is a selection process in the relevant sense. This is a critical assumption and step 1 addresses it.
  - We have a series of checkpoints saved at intervals during training and during fine-tuning (if applicable). We also have training logs (including loss curves, metrics) and per-example loss attributions (if available). Ablation and clamping results are available for the current model (at deployment).

  **Protocol: A Decision Procedure for Feature Content Ascription**

  **Step 0: Precondition**
  - *Check*: We have a candidate feature (a direction in a layer) and a candidate content description (e.g., "dog detector").
  - *If not*: The procedure cannot run. Stop.

  **Step 1: Is there a history of selection?**
  - *Purpose*: Address the worry that gradient descent might not be selection in the relevant sense.
  - *Check*: We have a training run that minimized a loss (or maximized a reward) over a dataset, using gradient descent (or a variant) and that the candidate feature exists in the model. This is true by design for our models.
  - *Sufficient answer*: Yes, the model was trained by gradient descent on a loss function, so there is a history of selection for features that reduce loss. (We are taking gradient descent as a selection mechanism: it "selects" for features that reduce loss by increasing their influence.)
  - *No answer*: If the model was not trained by an optimization process (e.g., random weights) then stop: no content ascription is licensed.
  - *Action*: Proceed. (We assume gradient descent is a selection process.)

  **Step 2: What is the feature's lineage?**
  - *Purpose*: Identify when the feature emerged and whether it has been stable.
  - *Check*: Using checkpoints saved at intervals, probe the feature (using a fixed probing method, e.g., linear probe) at each checkpoint to see if the feature is present and if it correlates with the candidate content (X) or any other properties. We are looking for the time of emergence and stability.
  - *Sufficient answer*: We can trace the feature back to a point in training (e.g., at checkpoint t) and see that it consistently correlates with X (or some other property) from then on. If the feature emerges during pretraining and remains through fine-tuning, note that. If it emerges during fine-tuning, note that.
  - *No answer*: If we don't have checkpoints to trace the lineage, then we cannot establish a history. Stop: no content ascription is licensed (unless we can reconstruct from other logs, but without checkpoints we cannot probe). However, if we have only the final model, we skip this step and rely on other evidence (but note that historical claims are weak). This is a gap in our artefacts.
  - *Action*: Proceed to step 3, but note the historical gap.

  **Step 3: What has the feature been selected for?**
  - *Purpose*: Determine the proper function by identifying the property (or properties) the detection of which caused the feature to be retained and strengthened because it contributed to loss reduction.
  - *Check*: Using training logs (especially per-example loss attributions if available) and ablation studies on past checkpoints (if available), determine:
    (a) At the time the feature emerged, did ablating the feature cause an increase in loss? (If so, it was contributing then.)
    (b) Over the training history, did the feature consistently contribute to reducing the loss? (Check by looking at loss attributions over time, if available, or by ablating at multiple checkpoints and seeing if loss increases.)
    (c) What property was the feature detecting when it contributed? (Correlate the feature's activations with properties in the data at the times when ablation hurt performance.)

  - *Sufficient answer*: We find that during training, the feature was regularly activated by instances of property P, and when activated, the feature's contribution (as measured by ablation or loss attribution) led to a reduction in loss. Then the proper function is to indicate P.
  - *No answer*: If we have no loss attributions and no way to run ablations on old checkpoints (because we don't have them), then we cannot determine the historical contribution. We must rely on the current causal profile (step 4) but note that this is not the historical function. This is a gap.
  - *Polysemantic handling*: If the feature responds to multiple properties (P1, P2, ...) and we find that in the past it contributed to the loss for each of them (i.e., when P1 was present and the feature was ablated, loss increased; similarly for P2, etc.), then the proper function is to indicate the disjunction of these properties. But if the feature was only ever selected for one of them (say, only P1 caused loss increases when the feature was ablated), then the proper function is only for P1 even if now it responds to P2. If the multiple properties were always present together (and the ablation test doesn't disentangle), then the proper function is the disjunction.

  **Step 4: What is the feature's current causal profile?**
  - *Purpose*: Check what the feature does now, which may differ from what it was selected for (due to drift, fine-tuning, or changes in the data). This step is not for determining content (which is historical) but for the reliability question (deployment).
  - *Check*: Using the current model, run ablations and clamping experiments on the feature. Measure the effect on model behavior (e.g., on task performance, on specific outputs). Also, probe what inputs activate the feature (using a held-out test set and adversarial examples if available).
  - *Sufficient answer*: We can describe the feature's sensitivity (what activates it) and its causal effects (what happens when we change it). This is independent of history.
  - *No answer*: If we haven't done these experiments, we must do them now. They are required for deployment reliability.

  **Step 5: Resolve the content ascription**
  - *Purpose*: Formulate the content statement based on step 3 and note the reliability based on step 4.
  - *Check*: 
    - If step 3 yielded a property P (or a disjunction) that the feature was selected for, then the content is: "the feature has the proper function of indicating P".
    - If step 3 yielded nothing (no historical evidence) but step 2 showed a stable correlation with P, then we cannot ascribe content (because we don't know if it was selected) but we can note that the feature correlates with P historically. This is not a content ascription in the teleosemantic sense. We must mark it as such.
    - If step 3 showed that the feature was never causally recruited (i.e., ablation never increased loss during training) then the feature was a bystander. Its content? It was not selected for anything, so it has no proper function. Hence, no content ascription is licensed. However, it may still correlate with P. We note that.
    - For features that emerge in fine-tuning: if step 3 shows that during fine-tuning the feature was selected for property P (and not during pretraining, because it didn't exist then), then the proper function is to indicate P (even if in pretraining a similar feature existed for Q, that's a different lineage).

  **Step 6: Separate reliability assessment (for deployment)**
  - *Purpose*: The governance lead needs to know: can we rely on this feature to indicate P in deployment?
  - *Check*: Using the current causal profile (step 4) and the historical content (if any) from step 5, we assess:
    - The feature's current sensitivity: does it still respond to P? (Check on a held-out validation set and on out-of-distribution data that we expect in deployment, if possible.)
    - The feature's stability under distribution shift: if the deployment data is different from training, how does it hold up? (We can only test on available data that simulates deployment.)
    - The feature's robustness: how does it react to adversarial examples? (If we have tested any.)
  - *Sufficient answer*: We can state the conditions under which the feature is reliable. This is independent of content ascription. If the historical content is P but the current causal profile shows the feature now responds to Q and not P, then we cannot rely on it for P in deployment. Conversely, a bystander (with no content) may still be reliable if it correlates with P.

  **Step 7: Hand-off for granularity and revision-tolerance**
  - *Purpose*: Some decisions are not about facts but about how we describe the content.
  - *Check*: 
    - If the feature was selected for a disjunction of properties (P or Q), then we must decide whether to describe it as "P or Q" or to pick one (if one dominated historically). This is a judgment call. Hand off to the governance lead and the team lead: they must decide on the acceptable level of granularity for the documentation.
    - If the feature was selected for a property that is not exactly the candidate X (e.g., it was selected for "canine shapes" but we want to call it a "dog detector"), then we must decide if that's an acceptable approximation. Hand off to the governance lead (with the clinical background) to decide based on the regulatory context.

  **Stopping Points**:
  - Stop at step 1 if there was no selection process.
  - Stop at step 2 if we cannot trace lineage and have no historical data (then we cannot ascribe content historically).
  - Stop at step 3 if we find the feature was never causally recruited (bystander) -> no content.
  - Otherwise, we complete the procedure.

  **Handling Specific Cases Explicitly**:
  - (a) **Bystanders**: Step 3 will show that ablation never increased loss. Then step 5: no content ascription. But step 6 still assesses reliability for deployment.
  - (b) **Polysemantic directions**: Step 3: if the feature was selected for multiple properties, then the content is the disjunction. Step 7: hand-off for how to describe it.
  - (c) **Fine-tuning features**: Step 2: trace when it emerged. Step 3: if it emerged in fine-tuning and was selected for a property during fine-tuning, then that's its proper function. If it existed in pretraining and was selected for P, but in fine-tuning it was reused for Q, then step 3 must check: during fine-tuning, was the feature still contributing for P? Or was it co-opted for Q? We look at loss attributions during fine-tuning. If it was contributing for Q and not P, then the proper function is now Q (the most recent selection overrides the old one? This is a debate in teleosemantics). Our stance: the function is set by the entire history. If it was selected for P in pretraining and then for Q in fine-tuning, then it has two functions? But typically, we consider the most recent selection. However, if the feature was not ablated during fine-tuning because it was still useful for P, then it might retain P. This is complex. We say: the function is the property for which it was selected in the last stage of training (because the model is deployed from that stage). But note the entire history matters. We break the training into stages. The function is the set of properties for which it was selected in the stage in which it was active and selected. If it was selected for P in pretraining and then in fine-tuning it was selected for Q (and P was no longer in the data or no longer selected for), then the function is Q. But if in fine-tuning it was still selected for P (even if also for Q), then it's both. 
  - (d) **Normal Conditions**: Defined as the training data distribution and training setup (including the data pipeline). For deployment, we are only guaranteed reliability under these conditions. Step 6 must test on data that matches the training distribution and also on data that matches deployment (if different). The governance lead must be warned that reliability may drop under distribution shift.
  - (e) **The standing worry about selection**: Addressed in step 1. We assume gradient descent is a selection process. If the team does not accept this, then the procedure stops at step 1. But we have built the procedure on this assumption.
  - (f) **The team wants forward-looking reliability**: This is addressed in step 6. We separate the historical content (step 5) from the deployment reliability (step 6). They may come apart: a feature may have the content P (historically) but now be unreliable for P (due to fine-tuning or drift). Then we report both: the content is P, but it is not reliable for P in deployment. Conversely, a feature with no content (a bystander) may be reliable for P now.

  **The Procedure (condensed to two pages):**

  # Protocol for Feature Content Ascription

  **Input**: A candidate feature (direction in a layer) and a candidate content description (X).

  **Output**: A statement about the feature's content (if any) and its reliability for deployment, or a decision that no content ascription is licensed.

  ## Step 1: Selection History
  - Check: The model was trained by gradient descent (or similar) on a loss function. 
    - If no, stop: no content ascription.
    - If yes, proceed.

  ## Step 2: Lineage Tracing
  - Using saved checkpoints, probe the feature at each checkpoint to see when it emerged and if it consistently correlates with any property (especially X).
    - If we lack checkpoints, skip to step 3 but note: historical evidence is weak.
    - If we have checkpoints and the feature is stable and correlated with X, note that.

  ## Step 3: Historical Contribution (Proper Function)
  - Using loss attributions and/or ablation studies on past checkpoints (if available), determine:
    - When the feature was ablated (or clamped) during training, did the loss increase? Specifically, did this happen in cases where the feature was activated by a property P?
    - Was this contribution consistent?
    - What property P was the feature detecting when it contributed?
  - Findings:
    - If the feature was never causally recruited (ablation never increased loss at any checkpoint): it's a bystander -> no content (go to step 5).
    - If it was recruited for a property P: the proper function is to indicate P.
    - If it was recruited for multiple properties (P1, P2, ...) and they are distinct, then the proper function is to indicate the disjunction (P1 or P2 or ...).
    - If we have no historical data (no logs, no checkpoints to test): we cannot determine the proper function -> no content ascription (go to step 5).

  ## Step 4: Current Causal Profile
  - On the current model, run:
    - Ablation: ablate the feature and measure effect on model behavior (on a validation set).
    - Clamping: clamp to specific values and observe.
    - Probing: what inputs activate the feature? (Use a held-out set and, if available, adversarial examples.)
  - This step is for reliability, not content.

  ## Step 5: Content Ascription
  - Based on step 3:
    - If a property P (or disjunction) was found: "This feature has the proper function of indicating P."
    - If the feature was a bystander: "No content ascription is licensed because the feature was never causally recruited during training."
    - If step 3 was skipped (no historical data): "No content ascription is licensed due to insufficient historical evidence."

  ## Step 6: Reliability for Deployment
  - Based on step 4 and step 5:
    - Does the feature currently respond to the candidate X (or to the property P from step 5) in the expected deployment conditions?
    - How robust is this response? (Test on deployment-like data and adversarial examples if available.)
    - Report: "In current testing, the feature [is/is not] a reliable indicator of [X or P] under [conditions]."

  ## Step 7: Granularity and Revision-Tolerance Hand-off
  - If the content is a disjunction or an approximation of X, hand off to the governance lead and team lead to decide on the description wording for the model card.
  - If there is a mismatch between the historical content and the current reliability, hand off to the governance lead to decide how to report.

  ---

  **Running the Protocol on Three Cases**

  **Case 1: Dog Detector**
