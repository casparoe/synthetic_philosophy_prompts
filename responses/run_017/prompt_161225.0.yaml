  **Closing: What the Protocol Cannot Deliver**

  - It cannot guarantee that the feature will behave the same under distribution shift (only testing can address that).
  - It cannot ascribe content to features that were not selected (bystanders) even if they are useful now.
  - It might ascribe disjunctive contents that are too broad for regulatory purposes, and we rely on human judgment to refine them.
  - It assumes the training process is a selection process; if that assumption is challenged, the whole ascription fails.
  - It cannot fully resolve polysemantic features if the historical data does not show which properties were selected for (if they always co-occurred).
  - It cannot predict future behavior beyond what is tested in step 6.
  - It does not solve the problem of neural network interpretability; it only provides a disciplined way to make historical claims and reliability assessments.

  By using this protocol, the team can produce content ascriptions that are grounded in a coherent theory and that clearly separate historical claims from deployment reliability.
answer: |-
  ### Protocol for Feature Content Ascription  
  **Grounding**: Based on Millikan-style teleosemantics. The content of a feature is fixed by its *proper function*—what it was *selected for* during training history, defined by causal contributions to the model's performance under the training objective. Normal Conditions are the training data distribution and optimization environment (e.g., data pipeline, loss function).  

  **Inputs**:  
  - Candidate feature direction \( F \) (e.g., a neuron or PCA direction).  
  - Candidate content \( X \) (e.g., "dog detector").  
  - Artefacts: Training logs, checkpoints (snapshots at intervals), per-example loss attributions, ablation/clamping results on *current* model, data mix, loss function, fine-tuning schedule.  

  **Outputs**:  
  - "\( F \) has the proper function of indicating \( X \)" (with caveats),  
  - "No content ascription licensed" (with reason),  
  - Reliability assessment for deployment monitoring.  

  **Procedure** (execute in order):  

  #### **Step 1: Establish Selection Mechanism**  
  *Purpose*: Verify that training constitutes "selection" in the teleosemantic sense.  
  - **Check**: Does the model have a training history via gradient descent (or variant) optimizing a loss/reward?  
    - *Sufficient*: Yes (standard supervised/self-supervised setup).  
    - *No answer*: Model is untrained (e.g., random weights). Stop → **No content ascription licensed**.  
  - **Worry handling**: Gradient descent *is* selection if (1) parameters vary, (2) loss/reward differentials exist, (3) parameter updates correlate with loss reduction. This is true by design. Proceed.  

  #### **Step 2: Trace Feature Lineage**  
  *Purpose*: Identify when \( F \) emerged and if it persisted.  
  - **Check**: Probe \( F \) in saved checkpoints (using linear classifiers, attribution maps) for correlation with \( X \) or other properties. Use checkpoints from:  
    - Pretraining stages.  
    - Fine-tuning stages (if applicable).  
  - *Sufficient*: \( F \) consistently exists and correlates with a property \( P \) (e.g., \( X \)) across contiguous checkpoints.  
  - *No answer*: No checkpoints saved. **→ Hand off to team lead**: Use current causal profile (Step 4) only; historical claims will be weak.  
  - **Judgement call**: If \( F \) correlates with multiple \( P_1, P_2, \dots \), note all. Granularity decided later (Step 6).  

  #### **Step 3: Determine Historical Contribution**  
  *Purpose**: Did \( F \) causally contribute to loss reduction? If not, it is a bystander.  
  - **Check**: For checkpoints where \( F \) exists:  
    - **(a)** *Loss attribution*: Does \( F \) have high per-example loss attribution scores?  
    - **(b)** *Counterfactual ablation*: When \( F \) is ablated in a checkpoint, does loss increase?  
      - *Focus*: Test on data where \( F \) activates (e.g., dog images if \( X \) = "dog").  
  - *Sufficient*:  
    - **Selected feature**: (a) or (b) is true for a property \( P \) (e.g., \( F \) reduces loss when dog present).  
    - **Bystander**: Neither (a) nor (b) true at any checkpoint → **No content ascription licensed** (go to Step 4 for reliability).  
  - *No answer*: No loss attributions or ability to rerun ablation on old checkpoints. **→ Hand off to team lead**: Use current ablation (Step 4) as proxy; historical claims tentative.  
  - **Polysemy handling**: If \( F \) activates for disjoint \( P_1, P_2 \) (e.g., dogs and cars), but only \( P_1 \) drove loss reduction, then proper function is \( P_1 \).  

  #### **Step 4: Characterize Current Causal Profile**  
  *Purpose*: Assess what \( F \) does *now* (for reliability, not content).  
  - **Check**: On *current* model:  
    - **(a)** *Ablation/clamping*: Ablate/clamp \( F \); measure performance change.  
    - **(b)** *Sensitivity*: What inputs activate \( F \) (test on in-distribution, OOD, adversarial data)?  
  - *Sufficient*:  
    - \( F \) affects behavior (e.g., dog classification degrades when ablated).  
    - \( F \) responds to specific inputs (e.g., dogs, adversarial textures).  
  - *No answer*: Experiments not run. **→ Mandatory to run now**.  

  #### **Step 5: Ascribe Content**  
  *Purpose**: Define proper function based on history (Steps 1–3).  
  - **Rules**:  
    - If \( F \) was **selected for \( P \)** (Step 3): "\( F \) has the proper function of indicating \( P \)."  
    - If \( F \) is a **bystander** (Step 3): **No content ascription licensed**.  
    - If \( F \) **emerged during fine-tuning**: Proper function is what it was selected for *in fine-tuning* (even if pretraining correlates differ).  
    - **Polysemy**: If \( F \) was selected for disjunct \( P_1 \lor P_2 \), ascribe \( P_1 \lor P_2 \).  
  - **Normal Conditions**: \( P \) is defined over training data distribution. OOD/adversarial inputs are not Normal; do not affect content.  

  #### **Step 6: Reliability Assessment**  
  *Purpose*: For deployment monitoring (decoupled from content).  
  - **Check**: Using Step 4 results:  
    - Is \( F \) sensitive to \( X \) (or \( P \) from Step 5) in deployment-like data?  
    - Is \( F \)’s correlation with \( X \) (or \( P \)) robust to OOD/adversarial inputs?  
  - **Output**:  
    - "\( F \) is reliable for monitoring \( X \) in [conditions]."  
    - "\( F \) is unreliable for \( X \) due to [reasons]."  
  - **Mismatch handling**: If content (\( P \)) ≠ reliability target (\( X \)), report both (e.g., "\( F \) indicates \( P \) but is reliable for \( X \)").  

  #### **Step 7: Granularity and Revision-Tolerance Hand-off**  
  *Purpose**: Resolve description subjectivity.  
  - **Hand off to governance lead** when:  
    - \( F \)’s content is polysemous (\( P_1 \lor P_2 \)) and a coarse description is needed.  
    - \( F \)’s historical \( P \) approximates \( X \) (e.g., "dog shapes" vs. "dogs").  
  - **Decision**: Balance scientific accuracy vs. regulatory needs.  

  ---

  ### Case Applications  

  #### **Case 1: Dog Detector**  
  - **Step 1**: Selection confirmed (gradient descent on classification loss).  
  - **Step 2**: \( F \) traces to early pretraining; fires on dogs/textures throughout.  
  - **Step 3**: Historical ablation increases loss on dog images only → selected for dog-like visual features.  
  - **Step 4**: Current ablation degrades dog classification; fires on dogs/textures.  
  - **Step 5**: Content → "indicates dog-like visual features."  
  - **Step 6**: Reliable for dogs in-distribution; unreliable for textures (false positives).  
  - **Step 7**: Governance lead approves "dog detector" as acceptable approximation.  
  - **Output**: "\( F \) has the proper function of indicating dog-like visual features. Reliable for monitoring dogs in-distribution."  

  #### **Case 2: Fine-Tuned Feature**  
  - **Step 1**: Selection confirmed.  
  - **Step 2**: \( F \) absent in pretraining; emerges in fine-tuning.  
  - **Step 3**: In fine-tuning, ablation increases loss only on fine-tuning task (Q). Probing shows pretraining property (P) still present, but no loss increase when ablated → selected for Q.  
  - **Step 4**: Current ablation affects Q only; still correlates with P.  
  - **Step 5**: Content → "indicates Q" (not P, despite correlation).  
  - **Step 6**: Reliable for Q; unreliable for P (correlation incidental).  
  - **Output**: "\( F \) has the proper function of indicating Q. Reliable for monitoring Q, not P."  

  #### **Case 3: Bystander Feature**  
  - **Step 1**: Selection confirmed.  
  - **Step 2**: \( F \) correlates with property P (e.g., "fraud risk") throughout training.  
  - **Step 3**: Loss attributions near zero; historical ablation shows no loss increase → bystander.  
  - **Step 4**: Current clamping to high values triggers refusal; predicts refusal perfectly.  
  - **Step 5**: **No content ascription licensed** (bystander).  
  - **Step 6**: Reliable for monitoring refusal in deployment (causal and predictive *now*).  
  - **Mismatch**: Governance lead wants "P detector," but content ascription fails.  
  - **Output**: "No content ascription licensed. \( F \) is reliable for monitoring refusal decisions."  

  **Why you won’t like Case 3**: You want \( F \) to "represent P" due to its predictive power and causal role *now*. The procedure denies content because \( F \) was not *selected for* P. Teleosemantics prioritizes historical function over current use. This clashes with deployment needs, where reliability matters more than history.  

  ---

  ### What the Protocol Cannot Deliver  
  1. **Future guarantees**: Reliability assessments (Step 6) are based on available data; they cannot predict unseen distribution shifts.  
  2. **Content without selection**: Bystanders (Case 3) get no content ascription, even if useful now.  
  3. **Causal depth**: The protocol cannot distinguish "core" content (e.g., "dog") from proxies (e.g., "texture") without historical ablation.  
  4. **Perfect polysemy resolution**: If \( F \) was selected for co-occurring \( P_1, P_2 \) (e.g., "dogs" and "fur"), the disjunction may be oversimplified.  
  5. **Philosophical validation**: Assumes gradient descent is "selection" (Step 1); skeptics may reject all ascriptions.  
  6. **OOD robustness**: Normal Conditions are training data; OOD reliability is purely empirical (Step 6), not grounded in content.  

  **Final Note**: This protocol separates *historical content* (teleosemantics) from *deployment reliability*. It forces explicit documentation of gaps (e.g., missing checkpoints) and hands off judgement calls to stakeholders. Use it to justify claims, not to replace critical evaluation.
