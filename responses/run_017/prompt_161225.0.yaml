  - Step 2: Checkpoints show the feature emerged early in pretraining and consistently correlates with dog images and dog-like textures.
  - Step 3: Ablation studies on past checkpoints show that when the feature was ablated, the loss increased specifically on examples with dogs (in tasks that require dog classification). The feature was selected for indicating dogs (or dog-like textures?).
  - Step 4: Current ablation degrades dog classification and not other tasks. The feature responds to dogs and dog-like textures.
  - Step 5: Content: "has the proper function of indicating dogs (or dog-like visual patterns)". But note: the textures are part of the training data (rendered scenes), so the function includes both. 
  - Step 6: Reliable for dogs and dog-like textures in the training distribution. But in deployment, if textures are not dogs, we note a potential false positive.
  - Step 7: The team wants "dog detector". The governance lead must decide: is the texture issue acceptable? The procedure says the content is "dogs or dog-like textures". The lead might decide to call it a dog detector with a note about textures.

  **Case 2: Fine-tuned Feature**
  - Setup: The feature appears only after a short fine-tuning on a narrow task. Probing shows it still separates the pretraining property (say, P) perfectly, but ablation now only affects the fine-tuning task (say, Q).
  - Step 1: Yes.
  - Step 2: The feature is absent in pretraining checkpoints, appears in fine-tuning.
  - Step 3: During fine-tuning, we check: ablation of the feature increases loss on the fine-tuning task (Q) but not on the pretraining task (which might not even be in the fine-tuning objective). We also note that the feature is activated by property P (the pretraining property) but also by Q? However, when activated by P during fine-tuning, ablation does not increase loss (because the fine-tuning task doesn't require P). So the feature was selected for indicating Q (the fine-tuning property) only.
  - Step 4: Current ablation affects only the fine-tuning task (Q). The feature still responds to P (the pretraining property) but changing it doesn't affect P-related behavior because the model doesn't use it for that anymore.
  - Step 5: Content: "has the proper function of indicating Q" (the fine-tuning property). Even though it responds to P, it wasn't selected for P during the stage when it existed (fine-tuning).
  - Step 6: Reliable for Q? Yes. But it also responds to P. If we want to use it as a monitor for P, it might be reliable (if the correlation holds) but note that the model doesn't use it for P. The governance lead must be warned: it's a reliable indicator of Q, and correlates with P but the model does not use it for P.

  **Case 3: Bystander Feature**
  - A scalar feature that tracks property P (which the team cares about), predicts refusal decisions almost perfectly, but never contributed to the loss during training (bystander).
  - Step 1: Yes.
  - Step 2: Checkpoints show the feature has been present and correlated with P throughout training.
  - Step 3: We run ablation studies on past checkpoints: ablating the feature never caused an increase in loss (on any task). We also check loss attributions: the feature was never attributed a significant reduction in loss. It's a bystander.
