prompt: |-
  hey — hoping you can help with something i'm kind of drowning in.

  about four months ago i became the "impact lead" (not my choice of title) at a small nonprofit that runs job training and placement for 18–25 year olds who've been out of school and out of work for a while. roughly 60 participants at a time, 9 staff. until recently our funding was basically a block grant and we reported whatever we felt like reporting. now two of our three funders have moved to paying per documented outcome, and the board has decided staff bonuses — small, but real for people on our salaries — will be tied to the same numbers. so suddenly the numbers matter a lot, and I'm the one writing them.

  which means I've been reading about Goodhart's law and specification gaming and getting steadily more paranoid. every metric i come up with, i can immediately think of three ways a smart, tired, underpaid caseworker who wants the bonus would hit it without helping anyone. i don't want to build something that quietly turns us into a placement mill that cream-skins the easiest participants and parks the hard ones — and i also don't want to freeze and report nothing.

  what i need is an actual procedure i can run, not a lecture. concretely:

  - i'll be adding or revising metrics maybe three or four times a year, and i can give each one a couple of hours, not a week. the staff who have to record the numbers are not stats people. the board has to sign off, and anything in a funder contract i can only work around, not delete.
  - three ideas i've started using and want built into the procedure:
    - the gaming surface — the handful of cheapest ways to move the number without moving the thing we actually care about. this has to include ways of moving the denominator: who counts as enrolled, who gets quietly "paused", who we just don't sign up in the first place.
    - negative-space metrics — goals phrased as the absence of something bad (no participant evicted, no complaint upheld). these feel safe and I think they're the opposite: you can hit them by making the bad thing invisible rather than by preventing it.
    - the shadow measure — something slow, expensive and annoying that we check against the fast metric every few months to see whether the two are still tracking each other at all.
  - please give me: the questions in order; what counts as a good enough answer to each one; a risk rating for the finished metric (say 1–5, with what each level means); the point at which the procedure just says no, drop this metric; the point at which it hands the question to a person because it's a values call and not a fact call; and a category for "fine for us to learn from, dangerous to pay on or publish."
  - i also want a step about who is allowed to see the number and how often they see it. i have a feeling that belongs in here somewhere and i can't work out where.

  then run it on three of mine:

  1. a bonus for each participant still in a job 90 days after finishing the program.
  2. training hours delivered. i love this one — it looks fantastic in the board deck and it costs us almost nothing to report — and i have a bad feeling about precisely that.
  3. "no participant becomes homeless during the program." this is already written into a funder contract, so i can't remove it; the most i can do is decide how we verify it internally and what we do with what we find.

  and somewhere in there, tell me what the procedure can't do: the ways i could follow it perfectly and still get Goodharted anyway. also, if you think my three ideas are the wrong three, say so and swap one — but only if you actually use the replacement in the procedure itself and not just in a footnote.

  sorry this got long, and thanks.
reasoning: |-
  Okay, the user is an Impact Lead at a small nonprofit dealing with job training for young people. They're stressed because their organization shifted from block grants to outcome-based funding, and staff bonuses are now tied to these metrics. They're worried about Goodhart's Law, where people game the metrics instead of actually helping participants. They need a practical procedure to evaluate metrics quickly, not a theoretical lecture.

  First, I need to understand their main concerns. They want a step-by-step process that's efficient—only a couple of hours per metric, a few times a year. The staff aren't stats-savvy, and the board must approve. They've already thought about gaming surfaces, negative-space metrics, and shadow measures, but they want these integrated into a formal procedure.

  The user provided three metrics to test the procedure: 90-day job retention, training hours delivered, and preventing homelessness during the program. The homelessness metric is contractually fixed, so they need internal verification methods. They also want the procedure to include access controls—who sees the data and how often.

  Breaking down the procedure structure. The steps should be in a logical order: start with defining the real goal, then identify what's measurable, brainstorm gaming tactics, design countermeasures like shadow metrics, assign risk ratings, and finally set governance rules. Each step needs clear questions, pass/fail criteria, and decision points.

  For each metric evaluation, the procedure should flag when to abandon a metric or escalate to a human decision. Risk ratings from 1 to 5 will help prioritize. High-risk metrics shouldn't be used for bonuses. The "monitor only" category is crucial for learning without perverse incentives.

  Testing the procedure on their examples. For the 90-day job retention, gaming includes pressuring participants to stay in bad jobs or manipulating who's counted. Shadow metrics like participant surveys could help. Risk rating might be 3—moderate but manageable with controls.

  Training hours delivered is problematic—easy to inflate by adding useless sessions. Negative-space concerns make it high-risk (4 or 5). Best to use it for internal monitoring only, not bonuses.

  The homelessness metric is tricky due to contractual obligations. Verification needs multiple sources like case notes and spot checks. Even then, it's high-risk (4) because caseworkers might avoid documenting issues. It shouldn't be tied to bonuses.

  The user's ideas—gaming surfaces, negative-space, shadow metrics—are solid. No need to swap them out. The procedure should emphasize that even with all steps, gaming can still happen through subtle behavior changes or misaligned measures. Continuous iteration is key.

  Access controls are part of governance. Specify who sees data and how often to prevent misuse. For instance, raw numbers for caseworkers, analyzed trends for managers.

  Finally, highlighting the procedure's limitations: it can't prevent all gaming, especially if measures drift or gaming tactics evolve. Culture and trust matter beyond the process. The user needs to balance structure with flexibility, using the procedure as a tool, not a cure-all.
answer: |-
  Here’s a battle-tested **Metric Evaluation Procedure** designed for your constraints (fast, practical, anti-Goodhart). I’ll walk you through the steps, apply it to your 3 metrics, and flag its limitations.

  ---

  ### **Metric Evaluation Procedure: Step-by-Step**
  *(~90-120 minutes per metric)*

  1.  **Define the Real Goal (5 min)**
      *   *Question:* "What tangible human outcome does this metric *attempt* to measure? (Be brutally honest)."
      *   *Good Enough Answer:* A 1-sentence description of a participant outcome (e.g., "Sustainable employment," "Gained marketable skills," "Avoided crisis").
      *   *Pass/Fail:* Fail if answer is vague ("success," "impact") or purely output-focused ("number served"). Escalate to leadership for clarity.

  2.  **Identify Measurable Proxy (10 min)**
      *   *Question:* "What specific, countable thing can we *actually* track that best approximates the real goal?"
      *   *Good Enough Answer:* A clear operational definition (e.g., "Employed ≥20 hrs/week at Day 90 post-exit," "Hours in curriculum-aligned training sessions").
      *   *Pass/Fail:* Pass if proxy is feasible & logically linked. Fail if link is weak or data is impossible/too costly.

  3.  **Map the Gaming Surface (30 min - MOST CRITICAL STEP)**
      *   *Question:* "List the 3-5 cheapest/easiest ways for a rational staff member to hit this number *without* improving the real goal. Include denominator manipulation (who counts?), data quality tricks, and effort shifting."
      *   *Good Enough Answer:* At least 3 concrete, plausible tactics (e.g., "Push participants into *any* job, even unstable/mismatched," "Count brief check-ins as 'training hours,'" "Avoid enrolling participants with high homelessness risk").
      *   *Pass/Fail:* Pass if you identify ≥3 tactics. Fail if you can't think of any (you're not trying hard enough!). **If serious gaming tactics exist, proceed. If not, metric is likely useless or too vague.**

  4.  **Design Countermeasures & Shadow Metrics (30 min)**
      *   *Questions:*
          *   "What rule/definition change could block the top 1-2 gaming tactics?"
          *   "What 'Shadow Metric' (costly, slow, qualitative) can we track quarterly to verify the proxy hasn't decoupled?" (e.g., Random participant surveys, case note audits, external data match).
          *   "Is this a 'Negative Space Metric'? (Goal = absence of bad thing). If yes, how do we force visibility of the bad thing?"
      *   *Good Enough Answer:*
          *   At least 1 countermeasure rule (e.g., "Job must match skills assessment," "Training hours exclude admin/breaks").
          *   1 feasible shadow metric (e.g., "Quarterly random sample: Verify job quality & satisfaction via survey").
          *   For Negative Space: Mandatory reporting mechanism for the bad thing (e.g., "Require caseworker attestation + spot-check shelter records").
      *   *Pass/Fail:* Pass if countermeasures address key gaming risks. Fail if gaming remains too easy/undetectable.

  5.  **Assign Risk Rating & Usage Category (10 min)**
      *   *Risk Rating (1-5):*
          *   **1 (Safe):** Proxy tightly coupled to goal. Gaming very hard/detected.
          *   **2 (Low):** Some gaming possible, but countermeasures/shadow likely effective.
          *   **3 (Moderate):** Gaming likely; requires strong oversight/shadow.
          *   **4 (High):** Gaming easy & lucrative; significant harm possible. Use *extreme* caution.
          *   **5 (Dangerous):** Metric actively incentivizes harm. DO NOT USE for pay/publish.
      *   *Usage Category:*
          *   **✅ Publish/Pay:** Risk 1-3, Shadow Metric in place.
          *   **🔒 Monitor Only:** Risk 3-4, valuable for learning but *never* for bonuses/contracts.
          *   **🗑️ Reject:** Risk 4-5 or Step 2/3 Fail.

  6.  **Governance & Access (5 min)**
      *   *Questions:*
          *   "Who NEEDS to see the raw number/data? (e.g., Caseworker sees *their* participants' status, Manager sees team aggregate)."
          *   "Who sees the analyzed trend + shadow check? (e.g., You, ED, Board Committee)."
          *   "How often is it reviewed? (Align with Shadow Metric frequency)."
      *   *Good Enough Answer:* Clear roles defined. Raw data access minimized. Analysis + shadow reviewed quarterly.

  **Decision Points:**
  *   **Drop Metric:** Step 2 Fail, Step 3 Fail (no gaming tactics), Risk 4-5.
  *   **Escalate to Human (Values Call):** Defining the Real Goal (Step 1), Choosing between countermeasures with trade-offs (Step 4).
  *   **Monitor Only:** Risk 3-4, or if countermeasures/shadow are untested.

  ---

  ### **Applying the Procedure to Your Metrics**

  **1. Bonus: Participant still in job 90 days after finishing program.**
  *   **Step 1 (Goal):** Sustainable employment leading to stability/skills growth. *(Pass)*
  *   **Step 2 (Proxy):** Employed ≥20 hrs/week at Day 90 post-exit. *(Pass)*
  *   **Step 3 (Gaming Surface):**
      *   Push participants into terrible/unstable jobs just to hit 90 days.
      *   "Employed" = 1 hr/week gig work? Misreport employment status.
      *   Avoid enrolling participants with complex barriers (cream-skimming).
      *   Pressure participant not to report job loss.
  *   **Step 4 (Countermeasures/Shadow):**
      *   Counter: Define "Job" (e.g., ≥20hrs/wk, W2 or sustainable contract, matches skills profile). Require paystub/docs.
      *   Counter: Track *reason* for exit (e.g., fired vs. quit for better job).
      *   Shadow: Quarterly random survey (job satisfaction, hours, pay, relevance to training). Audit documentation.
      *   Negative Space? No.
  *   **Step 5 (Risk & Category):** Risk **3 (Moderate)**. Gaming possible but countermeasures/shield can mitigate. ✅ **Publish/Pay WITH Safeguards**.
  *   **Step 6 (Governance):** Caseworkers see their participants' 90-day status. Managers see team rate + trends. You/ED/Board see trend + shadow survey results quarterly.

  **2. Training Hours Delivered**
  *   **Step 1 (Goal):** Participants gain relevant, usable skills for target jobs. *(Pass)*
  *   **Step 2 (Proxy):** Sum of hours in curriculum-aligned training sessions. *(Pass)*
  *   **Step 3 (Gaming Surface):**
      *   Pad hours (count breaks, admin time, slow Q&A).
      *   Focus on easy, quick trainings vs. deep skill-building.
      *   Run unnecessary sessions for low-participant groups.
      *   Pressure trainers to rush, sacrificing quality.
  *   **Step 4 (Countermeasures/Shadow):**
      *   Counter: Strict definition (e.g., "Scheduled instructional time only," min/max participants per session).
      *   Counter: Cap hours per participant/week or per topic.
      *   Shadow: Pre/Post skill assessments (even simple quizzes). Trainer quality audits. Participant feedback on usefulness.
      *   Negative Space? No, but similar risks (measuring presence, not quality).
  *   **Step 5 (Risk & Category):** Risk **4 (High)**. Extremely easy to game, directly incentivizes quantity over quality/suitability. 🔒 **MONITOR ONLY** (Use for internal resourcing, *never* bonuses/contracts).
  *   **Step 6 (Governance):** You/Program Manager see raw data & trends. Shadow metrics (assessments/feedback) reviewed quarterly by you/ED.

  **3. "No participant becomes homeless during the program."**
  *   **Step 1 (Goal):** Participants maintain stable housing. *(Pass)*
  *   **Step 2 (Proxy):** No documented instance of homelessness while enrolled. *(Pass - Contractually Bound)*
  *   **Step 3 (Gaming Surface):**
      *   **Major Risk:** Avoid enrolling anyone *at risk* of homelessness.
      *   Don't ask/don't tell policy (ignore signs, avoid documentation).
      *   Re-classify participants who become homeless as "paused" or "exited."
      *   Provide very temporary/unsuitable housing to technically avoid "homelessness."
  *   **Step 4 (Countermeasures/Shadow):**
      *   Counter: **Mandatory Initial Risk Assessment** (document housing stability at intake).
      *   Counter: **Mandatory Regular Check-ins** (e.g., "Where did you sleep last night?" documented monthly).
      *   Counter: **Clear Definition of Homelessness** (e.g., HUD definition: literal homelessness, couch surfing).
      *   Shadow: **Random Case Note Audits** focusing on housing discussions/red flags. **Spot-Checks** with shelters/housing partners.
      *   Negative Space? **YES - HIGH RISK.** Countermeasures *force* visibility of risk/instability.
  *   **Step 5 (Risk & Category):** Risk **4 (High)**. Strong incentive for cream-skimming & hiding problems. Contract forces publishing. 🔒 **Internal Verification CRITICAL. NEVER use for bonuses.** Report externally as required, but internally focus on the *rate* of homelessness/instability identified *despite* potential under-reporting.
  *   **Step 6 (Governance):** Caseworkers document *all* housing status/risk check-ins. You/Program Manager review audits/spot-checks & aggregate *instability* rate quarterly (NOT just the binary "no homelessness" outcome). ED/Board see instability rate + audit results.

  ---

  ### **What the Procedure CAN'T Do (The Inevitable Goodhart Gaps)**

  1.  **Unforeseen Gaming:** Clever actors will find loopholes you didn't predict. The Shadow Metric is your early warning system.
  2.  **Effort Distortion:** Even well-designed metrics can pull focus/resources away from *other* valuable but unmeasured activities (e.g., deep mentorship).
  3.  **Measure Drift:** The link between proxy and goal can weaken over time (e.g., "90-day job" matters less if all jobs become gigs). Regular Shadow Metric checks are vital.
  4.  **Cultural Corruption:** Metrics alone can't prevent a culture focused solely on numbers. This requires leadership messaging, ethical norms, and valuing qualitative evidence.
  5.  **Proxy Limits:** Some critical outcomes (e.g., dignity, hope, social connection) resist quantification. The procedure helps avoid *bad* metrics but can't create *perfect* ones.

  ---

  ### **Final Thoughts & Your Three Ideas**

  *   **Your Ideas Were Spot On:** Gaming Surface, Negative-Space awareness, and Shadow Metrics are the core armour against Goodhart. The procedure formalizes them.
  *   **Key Output:** The **Risk Rating (1-5)** is your filter. **Never tie money to a Risk 4 or 5 metric.** Use Risk 3 metrics cautiously and *only* with strong countermeasures/shadow.
  *   **On Negative-Space:** You were right – they are uniquely dangerous. The procedure flags them and forces active verification (turning absence into presence via mandatory reporting).
  *   **Culture is Key:** Use this procedure *with* staff. Explain *why* countermeasures exist ("To ensure we don't accidentally push you into bad practices"). Transparency builds trust.
  *   **Iterate:** Review Shadow Metric results religiously. If a metric consistently shows gaming or drift in the Shadow check, revise or kill it immediately.

  This procedure gives you a fighting chance. It forces concrete thinking about perverse incentives *before* they bite you, provides early warning signs, and gives you defensible criteria for saying "We can't use this metric for payouts." Good luck!
