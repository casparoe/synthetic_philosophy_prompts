answer: |-
  ## Research Proposal: The Absolute-Comparative Axis in Prioritarianism and the Levelling-Down Challenge

  **Sharp Question:** Does prioritarianism's purported immunity to the levelling-down objection fundamentally depend on its use of an *absolute* weighting function (where weight depends solely on an individual's welfare level), such that shifting to a *comparative* weighting function (where weight depends on an individual's welfare *relative* to others, e.g., deficit below the max or mean) reintroduces a susceptibility to levelling-down pressures, even while retaining prioritarianism's core concave transformation and Pareto principles? Furthermore, how does this distinction interact with the demands of variable population ethics and risk?

  **Why the Existing Framing Leaves This Open:**
  1.  **Ambiguity in "Priority":** The standard presentation of prioritarianism ("weighted sum of concave-transformed welfares") implicitly assumes absolute weighting. Debates focus on "priority" vs. "equality" as rival *justifications*, not on the *formal structure* of the weighting input. This obscures the possibility that "priority" could be implemented comparatively.
  2.  **Misdiagnosis of Immunity:** The standard view holds that prioritarianism escapes levelling-down *because* it values welfare gains to the worse-off more, while egalitarianism values *inequality reduction* intrinsically. Your insight is crucial: *Any* strictly increasing social welfare function (SWF) escapes the *strict* levelling-down objection (making no one better off and someone worse off is never an improvement). Utilitarianism escapes it trivially. The *perceived* force against egalitarianism stems from its potential to view levelling-down as *equalizing*, hence *intrinsically* good. Prioritarianism escapes *this specific manifestation* because its value is tied solely to individual welfare *levels* via the concave transform, not *relationships*. But is the *absolute* nature of the input essential for this?
  3.  **Neglect of Comparative Weighting:** While relative deprivation or status concerns are discussed in broader inequality literature, they are rarely formally modeled *as a variant of prioritarianism itself*. Comparative prioritarianism (CP) is a distinct, underexplored formal object that behaves like standard (absolute) prioritarianism (AP) under fixed absolute scales but diverges critically when scales shift or populations change.

  **Approach & Advantages Over Alternatives:**
  1.  **Formal Modeling:** Define precise classes of SWFs:
      *   **AP:** `W = Σ f(w_i)` where `f` is strictly increasing and strictly concave.
      *   **CP:** `W = Σ g(w_i, R(w))` where `R(w)` is a reference point (e.g., `max(w)`, `mean(w)`), and `g(w_i, R)` is strictly increasing in `w_i`, strictly concave in `w_i`, *and* for fixed `R`, but critically, `g` is sensitive to the *difference* `(R - w_i)` or ratio `(w_i / R)`. (E.g., `g(w_i, max) = f(max - w_i)` with `f` concave increasing, or `g(w_i, mean) = f(w_i / mean)`).
  2.  **Systematic Case Analysis:** Rigorously apply these models to canonical and novel test cases, focusing on the *interaction* between the weighting structure and the ethical challenge.
  3.  **Why This Beats Alternatives:**
      *   **Vs. Literature Survey:** Surveys catalogue existing arguments but don't resolve the structural ambiguity identified. This proposal constructs a *new* analytical lens.
      *   **Vs. Pure Axiomatics:** While axioms (Separability, Pareto, Continuity, etc.) will be crucial for *evaluation* ("Does CP violate compelling axioms AP satisfies?"), starting purely axiomatically risks missing the concrete ethical problem (levelling-down susceptibility under different implementations) and the motivation from the core debate. The case-based approach *grounds* the axiomatic investigation.
      *   **Advantage:** This approach directly targets the conceptual confusion in the debate, provides clear formal distinctions (AP vs. CP), and generates specific, testable predictions about their behavior across ethically salient scenarios. It bridges the formal and the intuitive.

  **Core Test Cases:**
  1.  **Fixed Population, Levelling-Down:**
      *   **State A:** (10, 20) | **State B:** (10, 10)
      *   *Prediction:* AP (`Σf(w_i)`): `f(10) + f(20) > f(10) + f(10)` (B strictly worse). CP (`Σg(w_i, max)`): `g(10, 20) + g(20, 20)` vs. `g(10, 10) + g(10, 10)`. If `g(w_i, R)` heavily weights `(R - w_i)`, B might *improve* the "worst relative position" sufficiently to outweigh the loss to the former 20. *Key Question:* Can CP prefer B while satisfying Pareto? (Likely yes, violating Minimal Pareto or Strong Pareto depending on definition).
  2.  **Variable Population - Replacement:**
      *   **State A:** (x, y) [y >> x] | **State B:** (x, z) where z < y but z is closer to x (e.g., A: (1, 100), B: (1, 2)).
      *   *Prediction:* AP: Favors A (`f(1) + f(100) > f(1) + f(2)`). CP (`Σg(w_i, max)`): `g(1, 100) + g(100, 100)` vs. `g(1, 2) + g(2, 2)`. The *relative* deficit of the worst-off (1 vs 100 vs 1 vs 2) is drastically reduced in B. CP may strongly favor B, even if `f(100) >> f(2)`, demonstrating a levelling-down-like preference across populations.
  3.  **Variable Population - Mere Addition:**
      *   **State A:** (10) | **State B:** (10, 1)
      *   *Prediction:* AP: Ambiguous (`f(10)` vs `f(10) + f(1)`). If `f` is very concave, `f(10) > f(10) + f(1)` is possible (anti-natalist prioritarianism). CP (`Σg(w_i, mean)`): `g(10, 10)` vs `g(10, 5.5) + g(1, 5.5)`. The new person creates inequality. Depending on `g`, B might be worse *because* of the worsened relative position of the original person (now below mean? worse ratio?) or the new person's low relative standing. Compares directly to Parfit's Mere Addition Paradox.
  4.  **Risk:**
      *   **Prospect P:** Certain (5, 5)
      *   **Prospect Q:** 50% chance of (1, 9), 50% chance of (9, 1)
      *   *Analysis:* Your suspicion is largely correct under standard assumptions.
          *   AP (`Σf`): `f(5)+f(5) = 2f(5)` vs `0.5[f(1)+f(9)] + 0.5[f(9)+f(1)] = f(1) + f(9)`. By strict concavity of `f`, `2f(5) > f(1) + f(9)`, so P is preferred. The certain outcome is better than the lottery over outcomes. No violation of "ex-post prioritarianism".
          *   CP (`Σg(w_i, max)`): Certain: `g(5,5) + g(5,5)`. Lottery: 50% `g(1,9)+g(9,9)` / 50% `g(9,9)+g(1,9)`. The value depends entirely on the specific `g`. However, if `g` is concave in `w_i` *and* we evaluate the *expectation of W*, not `W` of the expectation, we still get `2g(5,5)` vs `g(1,9)+g(9,9)`. This *could* favor Q if `g` is extremely sensitive to large deficits (`g(1,9)` is given massive weight compared to `g(5,5)`), but this seems pathological and violates intuitive Pareto or continuity requirements under risk. More plausibly, concavity in `w_i` suggests `2g(5,5) > g(1,9) + g(9,9)`, favoring P.
      *   **Verdict:** The risk case is likely a **dead end** for finding a *robust* distinction between AP and CP regarding levelling-down *under risk specifically*. Both seem to obey the general principle that a concave SWF prefers the expected welfare vector to the lottery over welfare vectors. The core action is in the non-risk cases. (A *negative* result for this branch).

  **What Results Would Look Like:**
  *   **Positive Result:** Demonstrating that:
      1.  CP robustly violates Minimal/Strong Pareto in fixed-population levelling-down scenarios and in specific variable-population replacements/additions, exhibiting a formal susceptibility to levelling-down pressures absent in AP.
      2.  AP maintains its levelling-down immunity across all scenarios *precisely because* its weighting is absolute and separable.
      3.  CP violates compelling separability or independence axioms that AP satisfies, linked to its sensitivity to irrelevant alternatives (changes in `R` due to changes in others' welfare).
      4.  The "immunity to levelling-down" touted for prioritarianism is *contingent* on absolute weighting; comparative weighting undermines it.
  *   **Negative Result:** Finding that:
      1.  Sensible CP formulations can be constructed that surprisingly *avoid* strict levelling-down preferences while still being comparative (e.g., by constraining `g` or choice of `R`).
      2.  AP faces *its own* counterintuitive implications in variable population contexts (like strong anti-natalism under high concavity) that are arguably analogous to levelling-down concerns, blurring the distinction.
      3.  The formal distinction, while real, doesn't map neatly onto the intuitive ethical concerns about levelling-down; other features (e.g., person-affecting properties) dominate.
      4.  The risk case unexpectedly provides a clearer distinction (though unlikely based on initial analysis).

  **Feasibility & Scaling for 3 Months:**
  *   **Manageable Core:** Defining AP/CP precisely and analyzing the fixed-population levelling-down case and 1-2 variable population cases (e.g., Replacement, Mere Addition) is highly feasible within 3 months. This alone yields a significant paper challenging the standard framing.
  *   **Key Challenges/Expansion Risks:**
      1.  **Formalizing CP:** Choosing tractable yet meaningful `g(w_i, R)` functions and reference points `R` (max, mean, median?) without getting lost in possibilities. Need to focus on 1-2 paradigmatic forms.
      2.  **Variable Population Complexity:** Rigorous handling of different population axiomatics (Average vs. Critical-Level vs. Total vs. Number-Dependent) *in combination with* CP is a deep rabbit hole. Must carefully limit scope, perhaps assuming a specific (e.g., Total) framework initially.
      3.  **Axiomatic Investigation:** Proving formal properties (separability violations for CP) can become technically demanding quickly.
      4.  **Risk Formalization:** If initial suspicion is wrong and risk *does* yield distinctions, formalizing CP under uncertainty adds significant layers.
  *   **What Makes it "Too Big":**
      *   Attempting a comprehensive taxonomy of all possible CP functions and reference points.
      *   Undertaking a full axiomatic characterization of both AP and CP across fixed and variable populations under multiple frameworks.
      *   Deeply exploring multiple distinct variable population problems (Sadistic Conclusion, Non-Identity, etc.) with CP.
      *   Developing a full decision-theoretic model for CP under risk.
  *   **Realistic 3-Month Scope:** Focus on establishing the core distinction (AP vs CP), demonstrating CP's susceptibility to levelling-down in fixed and 1-2 key variable population scenarios (Replacement being paramount), showing how this reframes the debate, and providing a preliminary analysis of separability violations and the risk dead end. This yields a tight, argument-driven paper. Axiomatics and other variable population cases can be flagged for future work.

  **In essence:** This proposal argues that the levelling-down debate conflates the *justification* (priority) with the *formal input structure* (absolute vs. comparative) of the weighting. By isolating comparative prioritarianism as a distinct, formally coherent alternative to standard absolute prioritarianism, the project demonstrates that immunity to levelling-down is not inherent to the priority *idea*, but to its standard *absolute implementation*. The core deliverable is a paper showing that CP reintroduces levelling-down pressures, fundamentally reframing the dialectic between prioritarianism, egalitarianism, and utilitarianism by introducing the absolute-comparative axis as central. The three-month scope is achievable by focusing on the most ethically salient cases where this distinction bites hardest.
