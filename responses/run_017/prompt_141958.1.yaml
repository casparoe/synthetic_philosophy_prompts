prompt: |-
  I am writing a long essay on the proverbial claim that revolutions devour their own children, and I want the French sequence from June 1793 to July 1794 to do real argumentative work in it rather than serve as decoration. So please analyze that sequence through the lens of the candidate mechanisms I sketch below, tell me which of them the case actually discriminates between, and say what the case does, in turn, to each of the three standard interpretive frameworks: class struggle, ideology, and contingency.

  The facts I am working from, so that nothing needs reconstructing: on 2 June 1793 the Convention, surrounded by Hanriot's National Guard, decreed the arrest of roughly twenty-nine Girondin deputies; Brissot, Vergniaud and the rest were guillotined on 31 October. In March 1794 the Hébertists, the dechristianizing, sans-culotte-aligned ultra-revolutionary flank, attempted an insurrection at the Cordeliers and were guillotined on 24 March. Twelve days later, on 5 April, Danton, Desmoulins and the Indulgents, who had been campaigning for an end to the Terror, went to the scaffold on charges of royalism and corruption. On 10 June the Law of 22 Prairial abolished defence counsel and witnesses before the Revolutionary Tribunal, capped trials at three days, restricted verdicts to acquittal or death, and, without saying so explicitly, stripped Convention deputies of the immunity that had previously required the Convention itself to vote before one of its members could be tried. Monthly executions in Paris rose from 155 in Germinal to 796 in Messidor, while acquittal rates stayed near a quarter of those tried. In late June the French victory at Fleurus removed the military emergency; in late July Robespierre, Saint-Just and Couthon were arrested and executed, and the apparatus of the Terror was then dismantled by the men who had staffed it.

  Here are the mechanisms I want distinguished, each of which could in principle generate the observed pattern:

  One, a purity spiral of competitive outbidding, in which the currency of political legitimacy is revolutionary virtue, moderation is indistinguishable from treason, and the standard ratchets because no faction can bid lower than its rivals without being consumed by them.

  Two, coalition contraction: revolutions are won by broad and internally incoherent coalitions, each purge removes a flank, and each removal raises the stakes of being next, so the winning coalition narrows monotonically toward a rump clique that is finally too small to defend itself.

  Three, instrumental autonomy: the revolutionaries build repressive instruments with their own personnel, budgets and esprit de corps, and the moment those instruments are legally unshackled from control by their creators, they acquire the capacity to eat them.

  Four, personnel selection: revolutions select for traits that are adaptive in the seizure of power and maladaptive in exercising it, so the pattern reflects who the process promotes rather than any dynamic it sets in motion.

  Five, the hypothesis I am partial to and most want stress-tested: that the visible presence of partly disloyal actors inside the ruling coalition is what makes a leadership's restraint credible and gives it an off-ramp, so that eliminating them destroys the capacity to de-escalate even when the leadership wants to, and the purge continues for commitment reasons rather than ideological ones.

  Six, the null hypothesis: prominent people die violently in violent times, we mostly study the revolutions that became violent, and the narrative shape of a devouring revolution is something we impose after the fact.

  What I want is a disciplined mapping rather than a survey. For each mechanism, say what the agent is, what the action variable is, and what it predicts about four features of the record: the ideological direction of successive purges, since the Hébertists and the Dantonists were killed within a fortnight of each other in opposite directions, which does not look like a spiral; the tempo, whether it should accelerate smoothly or jump at institutional changes such as Prairial; who survived and why, which is the cleanest test of the selection story; and how the sequence should end, whether by coup from inside the governing committees or by pressure from below. Tell me which of the six the case rules out, which two or three it leaves standing, and where the evidence is genuinely ambiguous. I am especially interested in what the acquittal rate and the immunity clause do to the instrumental-autonomy story, and in how much of the arc the Fleurus victory explains away as exogenous shock.

  Then turn the analysis around. Which of the three interpretive frameworks does this case most damage, and does any mechanism travel better across cases than the others? And since my essay's thesis needs to be more than an anecdote, tell me what the comparison class should be, what a revolution that did not devour its children would have to look like, and what observation inside the French case would have counted against each mechanism. Finally, be explicit about where all six are silent, including whether anything here explains why Thermidor came in July rather than in September. I would rather you mark the silence than make a mechanism speak.

  Please answer in continuous prose, roughly twelve hundred words, reasoning from the record I have given rather than from any reading list.
reasoning: |-
  Okay, the user is writing a long essay on the proverb that revolutions devour their own children, focusing on the French Revolution from June 1793 to July 1794. They've provided specific historical facts and want to analyze them through six mechanisms they've outlined. The goal is to see which mechanisms the case actually supports, how it affects standard interpretive frameworks (class struggle, ideology, contingency), and what counter-evidence would look like.

  First, I need to understand each mechanism clearly. The user has defined six: purity spiral, coalition contraction, instrumental autonomy, personnel selection, disloyal actors as restraint, and the null hypothesis. For each, I should identify the agent, action variable, and predictions about ideological direction, tempo, survivors, and ending.

  Looking at the historical sequence: Girondins purged in June 1793, executed October; Hébertists in March 1794; Dantonists in April; Prairial Law in June accelerating executions; Fleurus victory in late June; Thermidor in July. Key details: Hébertists (radicals) and Dantonists (moderates) purged within weeks, opposite directions; Prairial Law changed procedures; acquittal rates stayed constant; post-Fleurus, Terror continued briefly.

  Now mapping mechanisms to evidence:
  - Purity spiral predicts unidirectional radicalization, but the purge of both radicals (Hébertists) and moderates (Dantonists) back-to-back contradicts this. Tempo should be smooth, but Prairial caused a sharp jump. Not well-supported.
  - Coalition contraction fits: Girondins (right) removed first, then Hébertists (left), then Danton (center), narrowing the coalition. Predicts internal coup (Thermidor) when coalition becomes too small. Strong match.
  - Instrumental autonomy: Prairial Law removed safeguards, letting the Tribunal operate autonomously. But acquittal rates steady pre/post suggest it was always instrumental, not suddenly autonomous. Partial fit but weakened by acquittal consistency.
  - Personnel selection: Would require survivors like Barère or Fouché to show different traits, but they were adaptable opportunists, not ideologically pure. Thermidorians dismantled Terror, contradicting selection for radicalism. Weak.
  - Disloyal actors hypothesis: Removing factions (Girondins, Hébertists, Dantonists) who could credibly negotiate de-escalation eliminated off-ramps. Post-Danton, no restraint possible, leading to Prairial acceleration. Explains why Fleurus didn't stop Terror. Strong contender.
  - Null hypothesis: Undercut by structured sequence of purges (not random) and institutional escalation (Prairial). Narrative fits too well to be imposed afterthought.

  The case rules out purity spiral and personnel selection strongly. Null is implausible. Instrumental autonomy is ambiguous. Coalition contraction and disloyal actors are best supported.

  For interpretive frameworks:
  - Class struggle: Damage from same-class purges (bourgeois deputies killing each other) and sans-culottes ignored post-purge.
  - Ideology: Undercut by pragmatism of Thermidorians (ideologues wouldn't dismantle their own system).
  - Contingency: Strengthened—Fleurus didn't cause immediate change; path-dependence matters.

  Comparison class: Non-devouring revolutions need either preserved "disloyal flank" or no repressive autonomy. Haiti or American Revolution as contrasts.

  Silences: Why Thermidor in July? Mechanisms don't explain timing. Also, why Committee of Public Safety targeted certain factions first.

  The user wants a disciplined mapping, so I'll structure the response to directly address each mechanism's predictions against the four features (ideology, tempo, survivors, ending), then assess frameworks, comparison, and silences. Need to emphasize where evidence is ambiguous (e.g., instrumental autonomy's acquittal rates). Fleurus victory is key for testing disloyal actors—since Terror continued, it suggests endogenous dynamics outweighed exogenous relief.
answer: |-
  The French revolutionary sequence from June 1793 to July 1794 provides a critical test for your proposed mechanisms, revealing both decisive refutations and nuanced support. Applying a disciplined mapping to each mechanism clarifies their explanatory power relative to the historical record.

  **Mechanism Assessment:**

  1.  **Purity Spiral (Agent: Factions; Action: Escalating ideological bids for legitimacy):** Predicts unidirectional radicalization (leftward purge sequence), smooth acceleration, survival of the most ideologically "pure," and collapse due to unsustainable extremism (pressure from below).
      *   **Record:** Refuted. Purges alternate direction: Girondins (moderate right, June '93), Hébertists (ultra-left, March '94), Dantonists (moderate center, April '94). Tempo is discontinuous, jumping sharply *after* the institutional change of Prairial Law (June '94), not smoothly escalating. Survivors (Thermidorians like Barras, Tallien, Fouché) were often pragmatists, not ideologues. Collapse originates from *within* the governing committees (Thermidor coup). The rapid purge of both Hébertists and Dantonists in opposite directions is fundamentally incompatible with a unidirectional spiral.

  2.  **Coalition Contraction (Agent: Leadership core; Action: Purges to eliminate flanks):** Predicts sequential removal of coalition partners (ideological direction reflects flank targeted), accelerating tempo as stakes rise and coalition shrinks, survival of the central core until it becomes indefensibly small, and collapse via internal coup.
      *   **Record:** Strongly Supported. Sequence follows flank removal: Girondins (right flank), Hébertists (left flank/sans-culotte link), then Dantonists (compromising center). Tempo accelerates as each purge raises vulnerability. Survivors are initially the Committee core. Collapse occurs through an internal coup by the Convention/Committees when the Robespierrist core becomes too isolated. Monotonic narrowing to the "rump clique" of Robespierre, Saint-Just, Couthon is evident.

  3.  **Instrumental Autonomy (Agent: Repressive apparatus; Action: Exercise of unrestrained power):** Predicts purges become indiscriminate post-"unshackling" (ideology irrelevant), sharp acceleration *after* institutional change (Prairial), survival of those avoiding apparatus attention, and collapse via apparatus overreach or external intervention.
      *   **Record:** Ambiguous. Prairial Law (10 June '94) unshackled the Tribunal, correlating with execution spike (155 to 796 monthly). However, acquittal rates staying near 25% even *after* Prairial suggests the Tribunal remained *instrumental* to the Committee, not truly autonomous – it delivered desired outcomes efficiently, not randomly. The immunity clause removal targeted deputies specifically, indicating Committee *control* over the apparatus to eliminate political threats. Apparatus dismantled *by creators* post-Thermidor further weakens autonomy claims. The mechanism explains Prairial's *impact* but not the *precise targets* (Hébert/Danton) or Thermidor's origin.

  4.  **Personnel Selection (Agent: Revolutionary process; Action: Promotion of maladaptive traits):** Predicts purges removing those lacking revolutionary "fitness" (ideology secondary to traits), variable tempo, survival of most ruthlessly adaptive, and collapse due to dysfunctional governance.
      *   **Record:** Refuted. Purged figures (Girondin orators, Hébertist militants, Dantonist pragmatists) all possessed traits initially adaptive. Survivors (Fouché, Barras, Tallien) were supreme opportunists, not ideologically consistent radicals. The Thermidorians dismantled the Terror, demonstrating the promoted traits (ruthlessness, adaptability) were *adaptive* for *survival and power consolidation*, not maladaptive for governance *in that context*. The mechanism doesn't predict the specific sequence or the *ideological alternation* of targets.

  5.  **Destroyed Restraint (Disloyal Actors) (Agent: Leadership; Action: Purges eliminating potential negotiating partners):** Predicts purges eliminate factions enabling credible de-escalation (ideological flanks targeted), acceleration as off-ramps vanish, survival of those centralizing control, collapse due to inability to negotiate peace internally/externally.
      *   **Record:** Strongly Supported. Girondins (potential peace with Europe/moderation), Hébertists (channel for sans-culotte pressure), and Dantonists (voice for clemency/negotiated end) each represented potential off-ramps. Their elimination left the Committee, especially Robespierre, with no credible way to signal restraint or negotiate internally. This explains the Prairial acceleration *despite* Fleurus (late June '94) removing the military emergency – the *capacity* for de-escalation was structurally destroyed. Purges continued for commitment reasons (demonstrating resolve to remaining factions and the Tribunal) rather than solely ideology. Collapse via internal coup fits, as external pressure was lessened.

  6.  **Null Hypothesis (Agent: Random violence/Selection bias; Action: Chance):** Predicts no consistent ideological pattern in purges, random tempo, survival by luck/concealment, and collapse due to exogenous shock.
      *   **Record:** Refuted. The structured sequence (Girondins -> Hébertists -> Dantonists -> Committee core) shows clear political logic, not randomness. Tempo correlates with institutional changes (Prairial) and coalition dynamics, not random events. Survivors were key political actors, not random survivors. Fleurus was a major exogenous shock, but the Terror *accelerated* afterward, contradicting the prediction that it should end. The narrative shape is inherent in the events.

  **Summary of Mechanism Viability:**
  *   **Ruled Out:** Purity Spiral (1), Personnel Selection (4), Null Hypothesis (6).
  *   **Ambiguous:** Instrumental Autonomy (3) – Explains Prairial's impact but not target selection or Thermidor; weakened by acquittal rates and post-Thermidor dismantling.
  *   **Left Standing:** Coalition Contraction (2), Destroyed Restraint (5). These are complementary: contraction creates vulnerability, while eliminating flanks destroys de-escalation options.

  **Interpretive Frameworks:**

  *   **Class Struggle:** Most damaged. The purges were primarily intra-bourgeois conflicts among Convention deputies (Girondins, Montagnards, Dantonists, Committee). The sans-culottes, the key popular "class" force, were repressed (Hébertists purged) and sidelined *before* Thermidor. Thermidor itself was an intra-elite coup. Class explains initial alignments but not the *dynamic* of elite self-destruction.
  *   **Ideology:** Moderately damaged. While revolutionary rhetoric was central, the *alternating direction* of purges and the *pragmatism* of survivors (Thermidorians ending the Terror they helped build) show ideology was instrumentalized. The "Destroyed Restraint" mechanism highlights strategic, not purely ideological, reasons for continuing purges post-Danton.
  *   **Contingency:** Strengthened. The timing of Fleurus *could* have ended the Terror but didn't, demonstrating the path-dependence created by prior purges (Destroyed Restraint). Thermidor itself was contingent on specific alliances and missteps. However, the *pattern* of contraction and escalating commitment suggests a structural dynamic beyond pure chance.

  **Beyond Anecdote: Comparison and Counterfactuals**

  *   **Comparison Class:** To generalize, examine revolutions where elite coalitions stabilized without major self-devouring (e.g., the Glorious Revolution 1688, arguably the American Revolution post-1776 consolidation). The Haitian Revolution (1791-1804) offers a complex comparison: initial broad coalition fragmented, but Dessalines consolidated power violently without the same monotonic narrowing of the *revolutionary* elite.
  *   **Non-Devouring Revolution:** Would require: 1) Preservation of a credible "disloyal flank" allowing de-escalation signals, 2) Avoidance of extreme institutional unshackling of repression (preventing Instrumental Autonomy), 3) Successful integration or marginalization of radical flanks without extermination, preventing Coalition Contraction's narrowing logic. Victory before extreme polarization (avoiding the need for Destroyed Restraint) is also key.
  *   **Counter-Evidence within France:**
      *   Against **Coalition Contraction:** A major faction successfully reintegrated post-purge, halting the narrowing.
      *   Against **Destroyed Restraint:** The Committee successfully de-escalated *after* purging both Hébertists and Dantonists (e.g., if Terror eased significantly *before* Fleurus or Prairial).
      *   Against **Instrumental Autonomy:** Acquittal rates plummeting to near-zero *immediately* after Prairial, or Tribunal resisting Committee orders post-Prairial.

  **The Silences:**

  All mechanisms are silent on the *specific timing* of Thermidor (July vs. September 1794). None predict why the coup occurred precisely when it did (Robespierre's ambiguous speech of 8 Thermidor, his refusal to name names, the specific alliances formed overnight). The mechanisms explain the *propensity* for collapse but not the *trigger*. They are also silent on why the Girondins were targeted *first* rather than the Hébertists, or the precise balance of personalities (Robespierre's psychology). The steady acquittal rate remains somewhat puzzling for all mechanisms except the Null Hypothesis (which is refuted) – it suggests a calibrated repression, not pure frenzy or autonomous machine, a point not fully explained by the surviving mechanisms.

  **Conclusion:**

  The French sequence decisively rules out the Purity Spiral, Personnel Selection, and Null Hypothesis. It leaves standing, and best supports, the intertwined dynamics of **Coalition Contraction** and the destruction of credible off-ramps via the elimination of factions (**Destroyed Restraint**). Instrumental Autonomy explains the *efficiency* of the Terror post-Prairial but not its direction or ultimate end. This case most damages the Class Struggle framework, exposes the limits of Ideology as a sole driver, and highlights Contingency's role within a structural path. For your thesis, the key insight is that revolutions devour their children not merely through ideological frenzy, but through the strategic logic of narrowing coalitions and the fatal destruction of the very factions that make de-escalation credible, even when rational leaders might seek it. The Prairial acceleration *after* Fleurus is the clearest testament to this endogenous dynamic.
