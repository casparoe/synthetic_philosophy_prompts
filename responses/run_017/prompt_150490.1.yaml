answer: |-
  ## The Grammar of Persistence: Answering Miriam's Challenge

  **[Begin without preamble. No “honored,” no thesis statement. Start mid-thought.]**

  Some of you are wondering why I’m standing here. A novelist. Giving the inaugural lecture for Miriam Halloway. Miriam, who spent forty years dissecting claims with the precision of a master watchmaker, who wielded her counterfactual scalpel – *“If you cannot say what would have happened differently without the idea, you have described a costume and not a cause”* – with devastating elegance. Miriam, who read my novels about Huguenot weavers, merchant houses, and mill towns, and liked them… while insisting I’d dressed material interests in the borrowed finery of doctrine. She saw my characters quoting scripture while, underneath, she believed, interest was already steering the ship. A seductive version of Weber’s ghost, she’d say, the comforting illusion that ideas steer history.

  And she charged me, through that note – sharp, unsentimental, utterly Miriam – to argue, not eulogize. To avoid the word "legacy," and to promise she’s not watching over anything. So, why me? Because I’m perhaps uniquely placed to fail her test spectacularly, and in that failure, maybe offer an answer she’d at least find… interesting. Not right, not wrong. Interesting. I come armed not with sociological theory, but with the only instrument I truly know: the novelist’s draft.

  Miriam’s objection to my work was fundamental. Take [REFUSAL SCENE - PLACEHOLDER 1]. In the novel, Pierre, a second-generation weaver in Spitalfields, refuses a loan to a fellow Huguenot at interest. He cites scripture, doctrine hammered into him: *usury is a sin against the community of believers*. Miriam’s charge: Pierre wouldn’t lend anyway. He’s protecting his fragile capital, hedging risk, acting on economic interest. The doctrine is just the costume he wears while doing it. Delete the doctrinal language, she’d argue, and the refusal stands. Therefore, the doctrine isn’t causal; it’s epiphenomenal. A costume.

  And honestly? When I write, I test that very charge. It’s part of my process. I draft a scene like Pierre’s refusal twice. Once *with* the doctrine explicit in his thoughts, his words, the narrative texture. Once *without*. I strip it bare. What remains?

  **[REFUSAL SCENE - PLACEHOLDER 1 DESCRIPTION: Show Pierre refusing the loan. In Draft A: He explicitly thinks of Leviticus, feels the weight of communal expectation, frames the refusal as righteous. In Draft B: He feels uneasy, vaguely fearful of loss, senses it’s “not done,” but lacks the explicit vocabulary. The refusal action itself – the words spoken, the ledger not updated – is identical.]**

  The result? Miriam was partially right. The *outward behavior* survives the deletion. Pierre refuses the loan in both drafts. The ledger entry is the same. The material outcome unchanged. If Miriam’s counterfactual test asks, “Does the action disappear without the idea?”, the answer here is no. Case closed? Not quite.

  What changes profoundly is the *description under which the act is done*, and, crucially, its *capacity to persist*. In Draft B, without the doctrinal vocabulary, Pierre’s refusal feels… flimsy. Instinctive. Maybe a one-off. He feels uneasy, but why? He senses it’s “not done,” but by whom? For how long? The motive, unmoored from a shared vocabulary, risks lapsing. It’s a reaction, not a reason. It might not hold next week, or against a more persuasive plea.

  In Draft A, with the doctrine, the refusal isn't just an action; it's an *enacted principle*. It has a name, a lineage, a community behind it. "Usury is a sin." This vocabulary doesn't necessarily *create* the desire to protect his capital (the "interest," if you will), and it doesn't magically *choose* that desire over others (like charity or profit). Instead, it provides the *grammar* through which that desire becomes articulated, justified, and crucially, *rehearsed*.

  This is where I part company with Miriam’s powerful, but perhaps incomplete, scalpel. She framed ideas primarily as potential *motors* or *switches*:
  *   **Motor:** An idea supplying a *new* desire, a force that wasn't there before. (Weber's spirit *creating* capitalist drive?).
  *   **Switch:** An idea selecting *among* existing desires, channeling one impulse over another.
  Her counterfactual – "what changes if you remove it?" – is brilliantly designed to expose *these*. If an idea is a motor, removing it should stall the action. If it’s a switch, removing it should send the action down a different track.

  But what if an idea is neither motor nor switch? What if it’s **grammar**?
  *   **Grammar:** An idea supplying the *vocabulary* and *structure* in which an action becomes describable, communicable, justifiable, and therefore *rehearsable, transmissible, and steady across time and circumstance*.

  Deleting the *grammar* doesn’t delete the *behavior* in the immediate instance. Pierre still refuses *this* loan. The counterfactual test seems to exonerate the idea. But what it *does* delete is the framework that makes the refusal *repeatable*, that lifts it from a fleeting impulse to a sustainable pattern. Without the shared vocabulary of sin and communal obligation, Pierre lacks the internal language to *name* his action consistently, to explain it to others, to see it as part of a coherent life. The *pattern* frays.

  **[STEADFASTNESS SCENE - PLACEHOLDER 2]. Later, Pierre faces pressure to relax his stance. A trusted friend is desperate, the potential profit significant. In Draft A: He wrestles explicitly *within* the doctrinal framework – "Is *this* usury?", "What does community demand *now*?" The framework provides the terms of the struggle. He reaffirms his refusal, citing the same principles, strengthening the pattern. In Draft B: Without the explicit vocabulary, his earlier unease is a fading memory. The immediate pressure and potential gain feel overwhelming. He hesitates, perhaps bends the rules slightly, or gives in entirely. The initial refusal was an island; now it's submerged.]**

  My novels, I realize, can only ever realistically portray the *grammar*. I cannot crawl inside Pierre’s skull and implant a brand-new, purely ideational desire (a motor). And while I can show doctrine shaping choices among existing impulses (a switch), what feels most authentic, most durable in the lives I trace across generations, is the *grammar*. It’s the language that allows a merchant’s descendant, generations later, to articulate why she reinvests in a failing workshop rather than selling out – not just "it feels right," but "this is *stewardship*, this is *our name*" [WORKSHOP SCENE - PLACEHOLDER 3: Briefly show character invoking a concept like "stewardship" or "family duty" tied to past narratives]. It’s the framework that allows a father, heart breaking, to send his daughter to the mill, framing it not as defeat but as "duty" or "necessary sacrifice" within a understood, if grim, order [MILL SCENE - PLACEHOLDER 4: Show the father using specific, culturally resonant terms to describe the painful decision].

  This grammar makes actions steady. It makes them transmissible across generations, even as the material conditions – weaving silk, running a counting house, working a loom – change dramatically. It provides the script people use to explain their lives *to themselves*, making their choices feel coherent and enduring.

  So, Miriam’s challenge echoes back, not as refutation, but as a sharper question: **Is this grammar a *cause*? Or merely a description?** If deleting it doesn’t change the single ledger entry, can it claim causal power? Or is it just an elaborate costume, an *ex post facto* justification?

  And this leads to the question I want to leave hanging in this room, genuinely open: **What did Weber’s thesis *need*?** Did it need the "spirit" of capitalism to be a *motor*, injecting a *new* desire for profit and accumulation into the Protestant soul? Or did it only need the ascetic Protestant *grammar* – a vocabulary of calling, discipline, deferred gratification – to make *pre-existing* patterns of economic behavior *describable, justifiable, communicable, and therefore durable and recognizable as a distinct "spirit"*? Did the ideas not *create* the capitalist, but provide the language that allowed the capitalist *to persist as a type*, to see his life as a coherent whole, and for others to recognize the pattern?

  Miriam’s test, brilliant for exposing motors and switches, is silent on grammar. Deleting the vocabulary doesn’t delete the isolated act; it only makes the act unnameable, unstable, and therefore, in the long run of a life or a culture, unsustainable. The pattern collapses back into the flux of circumstance and fleeting interest.

  So, what do we do with this? How do we honor Miriam’s demand for argument, not accolade? By taking up her own tool, but turning it towards the work itself. Novelists test by deletion. We remove the words to see what holds. Miriam taught us to delete the *idea* and see what happens to the *action*.

  Here’s my charge to her students, her colleagues, to anyone who grapples with cause in the messy human world: **Go and delete your favorite variable.** Not just the idea, but the interest, the institution, the structural force you hold most dear in your own explanations. See what *behavior*, what *pattern*, survives its removal in your historical account or sociological model. Does the action vanish (a motor)? Does it divert (a switch)? Or does it persist, unnamed, unstable, flickering – a behavior in search of a grammar? What remains when the vocabulary is stripped away?

  Mirian didn’t believe in watching over anything. She believed in argument, in testing, in the hard, counterfactual work of understanding. So don’t feel anything about this. Don’t resolve it for comfort. *Do* this. Delete your variable. See what survives. That’s how you argue with her now. That’s the only tribute she’d have tolerated. Let’s see what patterns hold.
