answer: |-
  Here’s the demandingness objection restated in the unsparing vocabulary of craft, with residue analysis and a committed conclusion:

  ### The Demandingness Objection in Novelist’s Terms
  1.  **"Asks Too Much" → Collapsed Dramatic Stakes & Motivation Decay:**
      *   **Craft Translation:** If *every* scene presents an obligation with higher stakes than the protagonist’s own needs/projects, the central dramatic question ("What does she want?") evaporates. Her motivation isn't tested at 3am; it’s *pre-answered* by the arithmetic. There’s no friction, no temptation to *not* sacrifice, making her choices dramatically inert. The stakes become monotonously external ("Who needs this more?") rather than internal ("What does this cost *me*?"). This flattens narrative tension.

  2.  **"Alienates from Deepest Projects/People" → The Atrophied Spine & Refused Scenes That Refuse Nothing:**
      *   **Craft Translation:** Her "spine" (driving desire/need) is externally dictated by circumstance, not internally generated. She has no *counter-spine* – no persistent, personal yearning that creates conflict *with* the demands. When she "refuses" a scene (e.g., turning down love, abandoning her art), it doesn’t reveal hidden depth or cost; it confirms a pre-programmed response. The reader sees *what* she is (a calculator), not *who* she is (a person wrestling with desire vs. duty). It feels less like character revelation and more like algorithm execution.

  3.  **"Collapses Permissible/Heroic into Obligation" → The Missing Scale of Choice & Vanishing Arc:**
      *   **Craft Translation:** Without a baseline of "permissible" self-interest, every choice reads the same: obligatory sacrifice. There’s no gradation, no sense of *choosing* heroism over comfort. Her "arc" lacks trajectory because she starts and ends at maximal sacrifice. What is there to *learn* or *change* when the answer is always "give more"? The narrative lacks the crucial negative space of *not* sacrificing, making the sacrifices themselves lose meaning and dramatic weight.

  4.  **"Saints are Dull/Unnerving" → POV That Can't Settle & the Uncanny Valley of Virtue:**
      *   **Craft Translation:** A close POV forces constant justification of inhuman choices, risking reader alienation ("Who thinks like this?"). An omniscient POV risks feeling coldly observational, amplifying the character's unnerving lack of relatable flaws or conflicting desires. She exists in an uncanny valley – human-shaped but devoid of recognizably human self-concern. This isn't "dull" due to lack of action, but due to lack of *internal conflict* driving the action. Her consistency becomes predictability, her virtue feels pathological.

  ### The Residue Report
  1.  **Impartiality (Omniscient/Multi-POV vs. Impersonal Standpoint):**
      *   **The Bunch-Up:** Omniscient narration *isn't* the impersonal standpoint. It's a *voice* – often one dripping with irony, judgment, or worldview. Multi-POV offers multiple *personal* standpoints, competing biases, not impartiality. Fiction's closest analogue to the impartial view is the *structure itself* forcing the reader to hold competing truths. **The residue:** Using these voices/narratives to *enact* impartiality for the *character* creates dissonance. The narrative tool (voice/perspective) is doing an impression of objectivity, but the character's *embodiment* of it feels like the erasure of personhood. The craft tool reveals the problem: true narrative "impartiality" requires *plurality*, not singularity. A single character *being* the impartial standpoint is inherently a voice doing an impression of no one – which is precisely how she reads. The vocabulary *exposes* the alienation.

  2.  **The Saint’s Life (Strong Spine vs. Demandingness Problem):**
      *   **The Bunch-Up:** You're right – a strong spine (e.g., Ahab's vengeance, Jane Eyre's integrity) is compelling. **The residue is in the *nature* of the spine.** Ahab's spine is *personal* (obsession), Jane's is *self-defining* (moral autonomy). Your protagonist's spine ("maximize impartial good") is *impersonal* and *self-erasing*. The craft vocabulary *can* describe the shape ("strong, unwavering spine") but reveals the problem through its *consequences for other craft elements*: it nullifies dramatic stakes (point 1), atrophies internal conflict (point 2), flattens the arc (point 3), and destabilizes POV (point 4). The vocabulary *shows* what's "wrong": a spine defined *only* by external obligation destroys the friction necessary for compelling character and narrative. It’s strong like a monolith, not like a tree with roots and branches. The vocabulary doesn't lack a category; it *diagnoses* the demandingness by showing how this specific spine paralyzes other vital narrative functions.

  ### The Commitment: What the Residue Reveals
  **The demandingness objection, laid bare by novelistic vocabulary, is fundamentally about the unsustainable cost borne by the *character as a human psyche*, and the narrative cost borne by the *story* trying to embody it.**

  The residue bunches precisely where the *human* elements of character (conflict, desire, growth, relatable motivation, the texture of self) are sacrificed to the *abstract ideal*. Your craft vocabulary brilliantly *exposes* this. It doesn't miss the philosophical category; it *reframes* the objection in terms of **narrative viability and human resonance**.

  *   **Cost:** The vocabulary relentlessly tracks the cost – the collapse of stakes, the atrophy of spine, the vanishing arc, the uncanny POV. It shows the *price paid* by the character's humanity and the story's dramatic energy.
  *   **Who Bears It:** It shows the cost is borne by the *character* (her internal life, her potential for connection and growth) and the *reader* (their ability to engage, empathize, find tension). The philosophical "demandingness" becomes, in craft terms, the **destruction of the necessary dramatic and psychological substrate for compelling fiction.**

  **Therefore:** The objection isn't primarily about the *shape* of the life (a strong spine), but about the *material* that shape is made from. Your vocabulary proves that a life made *solely* from the alloy of impersonal obligation and constant sacrifice cannot sustain the complex, contradictory, desiring, resisting, evolving structure required for a protagonistic human being in narrative. The residue isn't a flaw in the craft lexicon; it's the bloody footprint left by the demandingness walking across the page. **The philosophers worry about the ideal being too heavy; your craft shows precisely how it crushes the character and the story trying to hold it.** Commit to showing that crushing weight *as* the cost, not just the shape. That’s where the person might emerge – in the cracks.
