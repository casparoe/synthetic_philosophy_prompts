answer: |-
  Let's dissect this systematically. Your frustration is understandable—this debate cuts to the core of scientific methodology. I'll compare the two accounts head-to-head, test them against your cases, and address your specific questions. **The de-idealization test is distinct and superior for explanatory models, while predictivism is pragmatic for forecasting but epistemically hollow.** Your three-way distinction is useful but not fundamental. Here's the breakdown:

  ---

  ### **1. Core Accounts Contrasted**
  - **Friedman's Predictivism (The F-Twist):**  
    - **Thesis:** A model's *only* virtue is predictive accuracy (especially novel, out-of-sample predictions). Unrealistic assumptions are irrelevant—they may even be necessary for simplicity/generality.  
    - **Strengths:** Pragmatic for forecasting; useful in contexts where mechanisms are opaque (e.g., economics).  
    - **Weaknesses:** Ignores *how* a model works; cannot distinguish luck from genuine insight; silent on explanation/intervention.

  - **Your De-idealization Test:**  
    - **Thesis:** A false assumption is acceptable only if it can be "undone" by adding back omitted factors, revealing how they affect outcomes (e.g., friction on an inclined plane).  
    - **Strengths:** Ensures models are *explanatory* and *actionable*; reveals causal structure; guards against overfitting.  
    - **Weaknesses:** Less useful for complex systems where de-idealization is intractable (e.g., climate models).

  ---

  ### **2. Verdicts on Your Cases**
  | **Case**               | **Predictivism Verdict**                                   | **De-idealization Verdict**                               | **Which Account Wins?** |
  |------------------------|-----------------------------------------------------------|----------------------------------------------------------|-------------------------|
  | **Frictionless plane** | ✅ Fine if predictions hold (e.g., projectile motion)      | ✅✅ Ideal case: friction can be added incrementally      | **De-idealization** (captures *why* it's unproblematic) |
  | **Ideal gas law**      | ✅✅ Praises predictive success                            | ✅✅ Pressure/temperature robust under de-idealization   | Tie (both pass)         |
  | **Hardy-Weinberg**     | ❌ Fails (no prediction goal; null model)                  | ✅ Explicitly a baseline for detecting deviations        | **De-idealization** (predictivism is silent) |
  | **Representative agent** | ✅ Accepted if aggregate predictions hold                 | ❌❌ Cannot "add back" heterogeneity; misdescribes reality | **De-idealization** (exposes flaw predictivism ignores) |
  | **DSGE w/o banking**   | ❓✅ Pre-2008: passed (fit data); Post-2008: failed (novel predictions wrong) | ❌❌ No way to "add" banking sector; misdescription masked by tuning | **De-idealization** (predictivism failed retroactively) |
  | **Fitness=Payoff**     | ✅ Accepted if predicts evolution                         | ❓⚠️ De-idealization possible but complex (e.g., adding mutations) | **Predictivism** (de-idealization is messy here) |
  | **Ptolemy**            | ❌❌ Fails Friedman's test: no *novel* predictions, just tuning | ❌ Cannot de-idealize to heliocentrism; epicycles are ad hoc | **Neither** (both reject it correctly) |

  ---

  ### **3. Key Questions Answered**
  - **Is de-idealization independent?**  
    **Yes.** It's about *explanatory robustness*, not just prediction. Example: Hardy-Weinberg is explanatory under de-idealization (it isolates selection) but predictively inert. Predictivism cannot justify such models.

  - **Does predictivism handle null models?**  
    **No.** It's silent on models not designed for prediction (e.g., Hardy-Weinberg, theoretical limits). Friedman’s "novel prediction" requirement makes this worse.

  - **Banking sector vs. frictionless plane:**  
    De-idealization captures the difference:  
    - Frictionless plane: Factors can be added back *without breaking the model*.  
    - Missing banking sector: Adding banks breaks DSGE’s core equations (representative agent, rational expectations).  
    Predictivism sees only "prediction failed," ignoring *why* the assumption was toxic.

  - **Can predictivism distinguish insight from curve-fitting?**  
    **Weakly.** "Novel predictions" help but aren't foolproof. Models can fit past data and predict novel data by luck (e.g., DSGE pre-2008). De-idealization forces engagement with causal structure, making retrofit models harder to defend (e.g., epicycles).

  - **Keep the three-way distinction?**  
    **Yes, but as a diagnostic tool, not a criterion.**  
    - **Absence** (friction): Easily de-idealized.  
    - **Misdescription** (representative agent): Hard/impossible to de-idealize; often distortive.  
    - **Closure-by-fiat** (markets clear): May mask dynamic processes; de-idealization requires rebuilding the model.  
    This clarifies *why* some false assumptions are benign and others dangerous, but de-idealization remains the core test.

  ---

  ### **4. Are You Arguing Past Each Other?**  
  **Partly—but your friend's "dodge" charge has merit.**  
  - Predictivism answers: *"When should I use this model to forecast?"*  
  - De-idealization answers: *"When does this model explain or support intervention?"*  
  However, science isn't just forecasting. If models can't explain (e.g., DSGE post-2008), their predictive success is fragile. **De-idealization is necessary for models used in policy or explanation**, while predictivism is sufficient for limited instrumental goals.

  ---

  ### **5. SIR Homogeneous Mixing**  
  - **Predictivism:** Accepts it if herd immunity thresholds predict outbreaks (which they often do at large scales). Silent on why it fails in clustered populations.  
  - **De-idealization:** ✅ **Acceptable** because we *can* add network structures, superspreaders, or mobility data (e.g., meta-population models). The core SIR logic persists, and we know *when* homogeneity breaks (e.g., in schools or prisons).  
  **Verdict:** Both accept it, but de-idealization justifies *why* it’s a valid simplification and guides refinement.

  ---

  ### **Final Verdict**  
  - **For pure forecasting:** Predictivism is pragmatic (e.g., predicting gas pressure).  
  - **For science aiming to explain or intervene:** De-idealization is essential. It exposes when "predictive success" is luck (e.g., DSGE) and ensures models connect to reality.  
  - **Your three-way distinction** helps diagnose problems but doesn't replace the de-idealization test.  

  **Why you should push back harder:** Economics' overreliance on predictivism led to DSGEs that "worked until they didn’t." Physics thrives by taking de-idealization seriously. A model that predicts but cannot explain is a black box—and black boxes break when the world changes. Your account captures science's need for *understanding*, not just prophecy.
