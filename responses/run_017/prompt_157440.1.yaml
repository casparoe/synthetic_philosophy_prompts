answer: |-
  ### Decision Tree: The Language of Thought Hypothesis  
  *Root:* Cognition is computation over representational vehicles.  

  #### Branch 1: What primary job motivates structured representations?  
  - **A: Explain systematicity/productivity** (e.g., inferring "B loves A" from "A loves B")  
    → Branch 2: Are representations compositional (reusable constituents)?  
      - *Yes* → Branch 3: Can distributed/vector implementations (e.g., neural nets) count as language-like?  
        - *Yes* → **Distributed Classicalism**  
          *Awkward: Must reconcile discrete combinatoriality with continuous vector space.*  
        - *No* → **Classic LOT**  
          *Awkward: Requires innate, universal syntax.*  
      - *No* → **Systematic Connectionism**  
        *Awkward: Achieves systematicity without discrete symbols (content-holistic).*  
  - **B: Ground content/misrepresentation** (e.g., "cat" misapplied to a raccoon)  
    → Branch 4: Can vehicles be non-propositional (e.g., map-like)?  
      - *Yes* → **Iconic Representationalism**  
        *Awkward: Explains non-spatial thoughts (e.g., "justice") with spatial formats.*  
      - *No* → **Narrow Representationalism**  
        *Awkward: Cannot explain map-like cognition (e.g., navigation).*  
  - **C: Capture conscious reasoning phenomenology**  
    → Branch 5: Can vehicles be public-language sentences?  
      - *Yes* → **Inner Speech Theory**  
        *Awkward: Requires non-conscious "translation" for non-linguistic thought.*  
      - *No* → **Private Symbolicism**  
        *Awkward: Symbols lack public anchors (ineffable meanings).*  

  #### Branch 6: Do structured representations appear *only* in central reasoning?  
  - *Yes* (not in perception/imagery/navigation) → **Central Systems LOT**  
    *Awkward: Arbitrary divide between "central" and peripheral cognition.*  
  - *No* (present in perception/imagery/navigation) → *Rejoin prior branch (e.g., Classic LOT, Iconic Representationalism).*  

  #### Leaf: Anti-representationalism  
  *Reached by rejecting the root claim.*  
  *Awkward: Explains error or inference without representational content.*  

  ---

  ### Notes on Unoccupied/Ambiguous Positions  
  1. **Systematicity + Non-compositional + Distributed** (Branch 2 "No" + Branch 3 "Yes"):  
     - *Unwritten*: No clear model achieves systematicity without compositionality.  
     - *Status: Unattractive* (systematicity typically requires recombinable parts).  

  2. **Phenomenology + Map-like + Non-linguistic** (Branch 4 "Yes" + Branch 5 "No"):  
     - *Unoccupied*: Inner experience is rarely described as map-like.  
     - *Status: Unattractive* (introspection favors linguistic or imagistic formats).  

  3. **Central Systems + Iconic** (Branch 6 "Yes" + Branch 4 "Yes"):  
     - *Incoherent*: Maps excel in navigation/perception—exiling them to "central" systems undermines their function.  

  ### Indistinguishable Pair  
  - **Classic LOT** vs. **Narrow Representationalism**:  
    Both endorse compositional, propositional vehicles. The tree splits them by *job* (systematicity vs. content-grounding), but Fodorian LOT claims *both*.  

  ### Key  
  - **Deep split**: The primary *job* (Branch 1) determines what "language-like" must achieve.  
  - **Messy bits**: Distributed implementations (Branch 3) and map-like formats (Branch 4) challenge traditional LOT.  
  - **Coverage tradeoff**: Perception/imagery (Branch 6) and public-language vehicles (Branch 5) are secondary to the core divide.
