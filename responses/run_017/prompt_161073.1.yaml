prompt: |-
  You are a professional philosopher who works on causation and on the metaphysics of omissions. Please think carefully and, before you settle on an answer, sketch the range of candidate concepts this phenomenon might fall under, try each one against all three of my cases, and explicitly discard the ones that do not fit. I am not after a label. I am after the carving: what exactly the phenomenon is, what it is not, where its edges are, and whether it is one thing or several.

  I write serious-incident reports for a hospital trust, and a recurring problem in that work is how to fill in the "causal factors" box when every candidate factor is an absence rather than an event. I keep hitting the following pattern and I have no word for it.

  Case 1. A plant in a hospital atrium dies over a long weekend. It needed both water and shade. The automatic watering was switched off for maintenance and nobody restored it, and nobody replaced the shade cloth that had been removed. Either deficiency on its own would have been fatal. So for each failure, it is false that if it had not occurred the plant would have survived. Yet the natural report is that the plant died because it was neither watered nor shaded — the two failures together seem to cause the death, although neither does on its own, and there is nothing at all connecting either of them to the plant's dying that anyone could point to or trace.

  Case 2. A patient deteriorates overnight. The covering doctor never wrote the instruction up, and so the nurse never administered the drug. Here both failures do pass the but-for test: each on its own is such that, had it not occurred, the patient would have recovered. But the deterioration gets attributed to the doctor's omission and not the nurse's; it sounds wrong to say the nurse's omission caused it, and equally wrong to say the two of them jointly did.

  Case 3. Indefinitely many further people's failures to act also pass the but-for test in these cases, including people with no connection to the incident whatsoever. Something is therefore filtering the candidates, and I cannot tell whether that filter is doing causal work or merely explanatory, normative, or blame-attributing work.

  So: is there an established concept or literature for this configuration — failures to act that seem to be causes only collectively, or only relative to what was supposed to happen, or only in virtue of some other failure upstream of them, with nothing connecting any of them to the outcome? What are the nearest established notions, how does what I have described differ from each of them, and which fits best? If nothing established fits, coin a term, define it precisely, and give me the boundary cases that show where it stops applying.
reasoning: |-
  Okay, let me start by really unpacking what the user is asking. They work on serious-incident reports in a hospital and are struggling with how to handle cases where causal factors are absences rather than events. They provided three cases that illustrate the problem. I need to approach this as a philosopher specializing in causation and omissions.

  First, I should recall established theories of causation. The main ones are counterfactual dependence, probabilistic causation, process theories, and difference-making. But the user already knows these and is pointing out where they fall short, especially with absences. The key issue is how multiple omissions interact and when they count as causes.

  Looking at Case 1: the plant dies due to lack of water and shade. Neither omission alone is sufficient; together they are necessary. Counterfactual theory says neither omission is a but-for cause individually, but together? Maybe they are INUS conditions—insufficient but necessary parts of an unnecessary sufficient condition. But is that the best fit? The user mentioned there's no physical connection, which process theories require. So process theories are out here. Probabilistic causation doesn't apply since the outcome is certain. So INUS might be close, but it's not perfect because the set of conditions isn't minimal—there could be other factors.

  Case 2: the doctor and nurse's omissions. Both pass the but-for test, but only the doctor is blamed. Why? Here, normative factors come into play. The doctor had a duty to write the order; the nurse's duty depended on that order. So even though both are causes counterfactually, the attribution is based on roles and responsibilities. This introduces a normative layer. The concept of "causally relevant conditions" from Hart and Honoré might apply, where we look for voluntary human actions or abnormal conditions. But here, both omissions are abnormal. The doctor's omission is more salient because it's the primary failure. The nurse's omission is preempted by the doctor's—meaning if the doctor had acted, the nurse's omission wouldn't have mattered. So is it preemption? Preemption usually involves events, but omissions can preempt too. The doctor's omission prevents the nurse's from being the cause. But the user says it's wrong to say they jointly caused it. So maybe preemption is key here.

  Case 3: too many but-for causes, including irrelevant people. This is the problem of profligate causes. The filter here is explanatory relevance—what's salient for the report. Normative roles, duties, and expectations determine which omissions are worth mentioning. The hospital's procedures define whose job it is, making those omissions relevant. So the filter isn't causal but explanatory and normative.

  Putting it together, the phenomenon involves omissions that are causes only under specific conditions: collectively necessary, normatively salient, and sometimes preemptive. INUS captures the collective aspect in Case 1, but falls short in Case 2 where normative preemption is at play. The user needs a term that combines these. "Normatively circumscribed joint necessity" might work. But defining it precisely: omissions that together are necessary for the outcome, within a framework of duties, and where some omissions preempt others. 

  Boundary cases would help clarify. If a third person unrelated to the hospital didn't water the plant, they're a but-for cause but not normatively relevant. If the doctor wrote the order but the nurse still didn't administer, the nurse's omission is now the direct cause. If the shade alone was sufficient to kill the plant, but water was also missing, then both are INUS conditions, but the shade omission is sufficient on its own? Wait, in Case 1, each alone was insufficient. So if one omission was sufficient, it would be a but-for cause.

  The user's deeper need is practical: how to fill out reports accurately and defensibly. They need a framework that justifies including certain omissions and excluding others, blending causal and normative factors. The concept must handle collective necessity, normative roles, and preemption. So the answer should provide a defined term with clear boundaries, showing how it applies to their cases and where it stops.
answer: |-
  Based on careful analysis of your cases and the metaphysics of omissions, the phenomenon you describe is best captured by **normatively circumscribed joint necessity (NCJN)**. This isn't a single established term but a synthesized concept drawing on causation, normativity, and explanatory relevance. Below, I'll justify this by:  
  (1) Surveying candidate concepts and why they fail,  
  (2) Defining NCJN precisely,  
  (3) Testing it against your cases and boundary examples.  

  ---

  ### **Step 1: Candidate Concepts Tested (and Why They Fail)**  
  I evaluated major theories of causation against all three cases:  

  | Concept             | Core Idea                          | Failure in Case 1          | Failure in Case 2          | Failure in Case 3          |
  |---------------------|------------------------------------|----------------------------|----------------------------|----------------------------|
  | **But-for (counterfactual) causation** | "X caused Y iff without X, Y wouldn’t occur" | *Fails*: Neither omission alone passes the test (plant dies either way). | *Over-includes*: Both omissions pass but-for, yet nurse’s omission is (intuitively) not causal. | *Disastrously over-includes*: Countless irrelevant absences pass (e.g., a gardener’s failure to water). |
  | **INUS conditions** | "X is an Insufficient but Necessary part of an Unnecessary but Sufficient condition" | *Partial fit*: Omissions form a set jointly sufficient for death, but the set isn’t *minimal* (e.g., shade alone might suffice if sun was harsher). | *Fails*: Doctor’s omission is sufficient alone (if nurse would have acted); no "joint" necessity. | *No filter*: Doesn’t exclude irrelevant factors (e.g., CEO’s failure to check). |
  | **Process/mechanical causation** | "Causation requires physical connection (energy/force)" | *Fails*: No physical process links absences to outcome. Omissions lack "oomph". | *Fails*: Same issue—no physical chain from non-actions to deterioration. | *Excludes all omissions*: Cannot treat absences as causes. |
  | **Probabilistic causation** | "X raises probability of Y" | *Fails*: Death was certain once both omissions occurred; no probability shift. | *Over-includes*: Both omissions raise probability, but nurse’s is excluded normatively. | *No filter*: Irrelevant absences might probabilistically correlate. |
  | **Preemption** | "One cause preempts another’s causal role" | *N/A*: No competing causes here. | *Partial fit*: Doctor’s omission preempts nurse’s causal *relevance*—but preemption typically requires backup causes, not normative roles. | *No filter*: Doesn’t address over-inclusion. |
  | **Explanatory relevance** | "Causes are what explain Y in context" | *Too broad*: Explains why we *mention* factors but doesn’t distinguish *causal* from *merely explanatory* (e.g., "no shade" explains but isn’t causal). | *Fits intuitively* but conflates causation with explanation. Nurse’s omission *explains* but isn’t treated as *cause*. | *Fits*: Filters based on salience—but is this causal or pragmatic? |

  **Result**: No single concept works. We need a hybrid: *collective necessity* (for Case 1) + *normative preemption* (for Case 2) + *explanatory salience* (for Case 3).  

  ---

  ### **Step 2: Proposed Concept: Normatively Circumscribed Joint Necessity (NCJN)**  
  **Definition**:  
  > *An omission O is an NCJN cause of outcome Y iff:*  
  > (1) **Joint Necessity**: O is part of a minimal set S of omissions such that S’s occurrence is necessary for Y, and each member of S is insufficient alone for Y.  
  > (2) **Normative Circumscription**: O is a failure of a specific, contextually assigned duty or role expectation.  
  > (3) **No Preempted Alternatives**: No other omission in S normatively preempts O’s causal status (i.e., O’s duty is "active" given the actual sequence).  

  **Boundaries**:  
  - **What it is**: Causation by *structured absences*—omissions only cause when they form a *duty-bound collective* necessary for the outcome.  
  - **What it is not**:  
    - Not but-for causation (fails in Case 1).  
    - Not free-floating explanatory relevance (e.g., "the CEO’s failure" isn’t NCJN).  
    - Not reducible to moral blame (e.g., a nurse may be *blamed* but not *causal* if preempted).  

  ---

  ### **Step 3: Testing NCJN Against Your Cases**  
  - **Case 1 (Plant)**:  
    - *Joint Necessity*: {No water, no shade} is a minimal necessary set (each insufficient alone).  
    - *Normative Circumscription*: Duties exist (e.g., facilities team for water, grounds for shade).  
    - *No Preemption*: Neither omission preempts the other; both are "active" failures.  
    **→ NCJN applies**: Jointly causal.  

  - **Case 2 (Patient)**:  
    - *Joint Necessity*: Fails. {Doctor’s omission, nurse’s omission} isn’t minimal—doctor’s omission alone suffices (if nurse would have acted given orders).  
    - *Normative Circumscription*: Doctor had duty to prescribe; nurse had duty to administer *only if prescribed*.  
    - *Preemption*: Doctor’s omission preempts nurse’s causal status—nurse’s duty was never activated.  
    **→ NCJN excludes nurse’s omission**: Only doctor’s omission is causal.  

  - **Case 3 (Over-inclusion)**:  
    - Irrelevant absences (e.g., "a passerby’s failure to water") fail *normative circumscription*—no assigned duty.  
    - Only omissions tied to *institutional roles* (e.g., staff with explicit responsibilities) qualify.  
    **→ NCJN filters via duty structures**.  

  ---

  ### **Why NCJN Over Alternatives?**  
  - Solves **Case 1** where but-for fails.  
  - Solves **Case 2** by excluding preempted omissions (unlike INUS/probabilistic).  
  - Solves **Case 3** by tethering to duties (unlike but-for).  
  - Grounds the "filter" in **institutional norms**, not just psychology (e.g., "what was supposed to happen" is codified in protocols).  

  ---

  ### **Boundary Cases to Delimit NCJN**  
  1. **Duty without Necessity**:  
     - *Case*: A janitor fails to sanitize a room (duty-bound), but the infection occurred via airborne transmission (independent of surfaces).  
     - *Result*: Not NCJN—omission isn’t part of a necessary set for the outcome.  

  2. **Necessity without Duty**:  
     - *Case*: A visitor fails to water the plant (but-for necessary), but visitors have no duty to maintain plants.  
     - *Result*: Not NCJN—no normative circumscription.  

  3. **Preemption Break**:  
     - *Case*: Doctor writes the order, but nurse still fails to administer (no preemption).  
     - *Result*: Nurse’s omission is now an NCJN cause (minimal necessary set + activated duty).  

  ---

  ### **Conclusion**  
  Your phenomenon is **one coherent thing**: causation by omissions that are *collectively necessary* and *normatively circumscribed*. NCJN avoids over-inclusion (Case 3), handles joint causation without physical links (Case 1), and excludes downstream omissions when preempted (Case 2). It treats causation as **institutionally scaffolded**—what counts as "causal" depends on role assignments. For incident reports, this means:  
  > *List an omission as causal iff:*  
  > (a) It was part of a minimal necessary set of failures,  
  > (b) The actor breached a defined duty,  
  > (c) No upstream failure preempted their role.*  

  This aligns with legal/metaphysical work on "responsibility for omissions" (e.g., Moore’s *Causation and Responsibility*), but sharpens the focus on *collective necessity*. Use **NCJN** or the fuller description—either captures the phenomenon’s edges.
