answer: |-
  ## Echo Internalism: Diagnosing the Hollow Core of Williams's Thesis

  **Private Brainstorming:**

  *   **Core Williams Motivation:** To preserve the *explanatory and normative grip* of reasons. A reason must be capable of *moving* the agent, not just being a detached truth for observers. The S-set (subjective motivational set) provides the necessary foothold for reasons to be genuinely *for* the agent. The "sound deliberation" clause prevents crude desire-fulfillment models and allows for conceptual sophistication.
  *   **Standard Objection (Relativism/Quietism):** Load-bearing. If the psychopath truly has no element in S that could motivate refraining from murder (even via complex deliberation), internalism says he has *no reason* to refrain. This clashes with strong intuitions about objective moral demands and seems to license quietism – "he just doesn't care, so there's nothing to be said."
  *   **Echo Internalism Challenge:** Poses a *structural* dilemma, more fundamental than relativism. It threatens the *distinctiveness* of internalism itself. If universality of a reason-tracking policy (RTP) is plausible, then:
      *   **Option 1 (Collapse):** Every external reason claim ("You should φ") *becomes* an internal reason claim for nearly everyone by triggering the RTP ("If I believe I should φ, I will φ"). Internalism loses its critical edge against externalism; it becomes trivially true for normal agents.
      *   **Option 2 (Biting the Bullet Quietly):** The residual cases (truly lacking RTP) are where relativism bites – but these might be vanishingly rare (severe pathologies?). Does this matter? Williams *wanted* the thesis to bite against common externalist intuitions, not just in extreme cases. The RTP makes it bite far less often, and less dramatically.
  *   **Possible Responses & Their Problems:**
      *   **Reject RTP Universality:** Unpersuasive. The RTP seems constitutive of practical agency ("deciding what to do") for cognitively mature adults. Its absence looks like a severe dysfunction.
      *   **Distinguish Formal/Substantive:** Block RTP as a grounding element. But *why*? What principle excludes it? Is it arbitrary? Does this undermine the "sound deliberation" clause, which allows sophisticated derivations? If "sound deliberation" can connect complex moral concepts to action via S-set elements, why not this formal policy?
      *   **Require "Motivational Oomph":** Argue RTP lacks inherent motivational force; it's inert until triggered by a *substantive* belief. But the triggering belief ("There is decisive reason to φ") still relies on the RTP *to convert it into motivation*. The RTP *enables* the motivational link for any external claim. Is this "grounding" or mere "transmission"? Williams needs grounding, but the line is blurry.
  *   **Key Question:** What work is the "sound deliberation" clause doing? If it allows conceptual expansion *within* the S-set, why can't it incorporate the RTP? If the RTP is in S, and sound deliberation involves recognizing a candidate consideration *as a reason* (which triggers the RTP), then action follows. The external consideration *becomes* motivationally potent *via* the RTP + deliberation. This *seems* to satisfy Williams's formal schema.
  *   **Williams's Underdetermined Premise:** The nature of the elements in the "subjective motivational set" (S) and what constitutes a valid "route of sound deliberation" connecting them to action. Williams leaves the boundaries of S and the rules of "soundness" deliberately vague. Echo internalism exploits this vagueness.

  ---

  **Essay: The Hollow Echo - Why Formal Policies Undermine Internalism's Core**

  Bernard Williams's internal reasons thesis (IRT) aimed to anchor normativity within the agent's practical perspective. A reason for A to φ exists only if A could arrive at a motivation to φ through sound deliberation starting from some element(s) in her subjective motivational set (S-set). This countered externalist views positing reasons wholly independent of an agent's psychology. The standard critique targets IRT's potential relativism: the agent devoid of any S-set element connectable to morality seems to have *no reason* to be moral. However, the challenge of "echo internalism" strikes deeper, targeting IRT's very coherence and distinctiveness. If nearly every agent possesses a "reason-tracking policy" (RTP) – a standing commitment to act on what she judges to be decisive reasons – then, it seems, *any* candidate external reason can be internalized via this policy. The RTP acts as a universal adapter, collapsing the internal/external distinction for normal agents and rendering IRT vacuously true. Is this a *reductio*, a consequence Williams should embrace, or can IRT be rescued by principled restriction? I argue echo internalism reveals a fatal ambiguity in IRT concerning the nature of S-set elements and deliberation, necessitating a principled restriction excluding purely formal policies like the RTP. While this preserves IRT’s core motivation, it exposes the underdetermined nature of "sound deliberation" and concedes that IRT's relativist bite applies only in pathological cases, significantly blunting its intended force.

  Echo internalism presents a powerful dilemma. If an RTP is indeed a near-universal feature of adult agency – a plausible claim given that forming intentions based on judged reasons is constitutive of deliberation itself – then its presence within the S-set seems to satisfy IRT's condition for *any* proposed reason. Suppose an externalist claims A has a reason to φ. If A comes, through deliberation (perhaps prompted by the externalist's argument), to *believe* she has decisive reason to φ, her RTP commits her to being motivated to φ. This constitutes a "route of sound deliberation" from her S-set (which includes the RTP) to motivation to φ. *Formally*, IRT is satisfied. Yet, this trivializes IRT. Its intended target – external reasons claims lacking *any* foothold in the agent's existing motivations – vanishes for normal agents. The thesis loses its critical bite against externalism; it merely describes how external claims *become* motivating once accepted, which even externalists accept. IRT collapses into a description of how reasons function *once internalized*, not a substantive claim about what reasons exist prior to or independent of potential internalization. This seems a *reductio*: if the theory's central distinction evaporates under scrutiny of normal psychology, the theory is flawed.

  Could Williams simply accept this consequence? After all, IRT might still explain *how* reasons motivate – via the RTP and deliberation – and bite only for the rare agent lacking any RTP. However, this surrender eviscerates Williams's core anti-externalist argument. Williams explicitly sought to deny that there *are* external reasons; they were supposed to be a philosophical fiction. Accepting echo internalism concedes that external reasons *do* exist (as claims that *can* be internalized via the near-universal RTP) and that IRT merely describes the mechanism of their adoption. This abandons Williams's fundamental project. Furthermore, it makes the "relativist bite" almost irrelevant, confined to agents so impaired they arguably lie outside the domain of normal reason-ascription anyway. Williams wanted his thesis to challenge common externalist moralizing about agents who are psychologically normal but deeply corrupt or selfish, not just clinical psychopaths. Echo internalism shields these agents by granting them an RTP that can, in principle, internalize any reason – even if their substantive S-set makes them highly resistant to *ever* judging that reason decisive. IRT loses its intended normative friction.

  Therefore, the only viable path is to find a principled restriction blocking the RTP from grounding internal reasons. The restriction must be: **Only elements of the S-set that represent *substantive evaluative outlooks, commitments, or ends* – not purely *formal* procedures or meta-policies like the RTP – can serve as the grounding elements for internal reasons.** The RTP itself lacks substantive content; it does not care *what* reasons are tracked, only that judgments *about* reasons are followed. It is a rule of practical rationality, not a source of substantive reasons. Allowing it to ground reasons makes IRT promiscuous – any consideration presented *as a reason* becomes a potential internal reason via the RTP, provided the agent can be brought to believe it is a reason. This empties the "grounded in S-set" requirement of substance. Motivation stems not from any *particular* concern within S, but from a generic procedural commitment applicable to *any* content. This violates the spirit of IRT, which roots reasons in the agent's *actual, contingent* concerns – her character, projects, loves, and hates – not in a universal formal capacity.

  Is this restriction principled or merely *ad hoc*? It finds grounding in IRT's fundamental purpose: explaining how reasons *explain and motivate action* by being anchored in the agent's existing *practical identity*. The substantive elements of the S-set constitute that identity – they are *what the agent cares about*. The RTP is merely *how* she manages her cares; it is an executive function, not a source of value or concern itself. Sound deliberation discovers connections *between* substantive elements or between those elements and possible actions. Invoking the RTP shortcuts this; it allows a purely *cognitive* judgment ("φ-ing is required") to generate motivation *independently* of whether φ-ing connects to any *substantive* element of S. This makes the source of motivation external to the agent's practical identity as defined by her substantive S-set. The restriction thus preserves IRT’s core: a reason must link, via sound deliberation about connections, to the agent's *substantive evaluative perspective*, not just to a formal rule for implementing judgments.

  However, this restriction exposes the deep underdetermination in Williams's account: **what constitutes a valid "route of sound deliberation"?** The exclusion of the RTP relies on a specific interpretation of "sound deliberation" as concerning only the *substantive connections* between elements of S and actions. It rules out deliberation that relies on the *application* of formal policies *to external inputs* as unsound or irrelevant for grounding reasons. Yet Williams provides no clear criteria for "soundness" that decisively settles this. Could "sound deliberation" include recognizing that a moral principle applies to one's situation and then invoking the RTP? The restriction against this must be seen as a *substantive commitment* built into IRT's defense against collapse, clarifying that "sound deliberation" must remain *internal* to the web of substantive concerns. This clarification is necessary but reveals that the content of "soundness" is partly constitutive of the theory itself, not derived independently.

  The residual case – the agent utterly lacking an RTP – confirms the restriction's consequence. For such an agent (if any exist), IRT bites decisively: no external reason claim can gain traction, as there is neither substantive concern nor formal policy to link it to motivation. This is genuine relativism/quietism. However, given the likely pathological nature of such agents, this relativism is far less troubling than if it applied to ordinary, morally deficient agents. The restriction focuses IRT's bite where it is arguably defensible (severe impairment) and shields it where it was most counterintuitive (normal agency with bad substantive commitments). This is a significant retreat from Williams's ambitions, but a necessary one.

  **Verdict:** Echo internalism is not a straightforward *reductio*, but it necessitates a principled restriction: only substantive elements of the S-set can ground internal reasons, excluding purely formal meta-policies like the RTP. This restriction is principled, rooted in IRT’s core aim to anchor reasons in the agent's *substantive practical identity*. However, it exposes the underdetermination surrounding "sound deliberation" and forces a concession: IRT's relativist bite applies only in rare, pathological cases, significantly diminishing its intended challenge to externalist morality in ordinary life. The case most clearly exposes the **underdetermined nature of the "subjective motivational set" (S)** and the **criteria for "sound deliberation"** – Williams fails to adequately distinguish between substantive commitments that constitute an agent's character and formal procedures that govern rational agency, leaving his thesis vulnerable to the hollowing effect of the universal RTP. The restriction provides a defense, but at the cost of narrowing the thesis's scope and conceding that the space for genuinely external reasons (in the sense Williams denied) is far smaller than he supposed.
