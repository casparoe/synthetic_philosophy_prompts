  Most importantly, their position isn't unfalsifiable - it predicts that discount rates should decline with horizon and that pure time preference requires justification. Empirical work on long-term discounting (like Treasury bond yields vs. climate models) could contradict this. 

  Throughout, I'll maintain clear confidence markers: Diamond's theorem is standard economics; life-shape objections are more speculative philosophy; the non-identity point sits somewhere between. The coherence test will be toughest - if future people's identities are choice-dependent, can we even define "their" well-being neutrally?
answer: |-
  Below is a stress test of your Temporal Neutrality position, structured by severity of objections (fatal → cosmetic), with defenses assessed. I address your three candidate defeaters explicitly and evaluate insulation/falsifiability. Confidence markers: **Standard Econ** = textbook consensus; **Reconstructed** = from your hints + logic; **Speculative** = my extension.

  ---

  ### **Fatal or Near-Fatal Objections**  
  *(Should move you; require concession or material adjustment)*

  1. **The Non-Identity Problem Undermines Comparability**  
     - **Objection**: For policies affecting future populations (e.g., climate, tech governance), the set of future people depends on present choices. There is no fixed "future person" whose well-being we discount neutrally; we’re comparing different possible populations. Temporal neutrality assumes a fixed beneficiary set, but if Person A in 2200 only exists *because* we chose Policy X, we cannot neutrally weigh "their" well-being against present costs — they wouldn’t exist otherwise.  
     - **Why it’s fatal**: This attacks the *coherence* of neutrality when future identities are contingent. If "well-being" lacks a stable subject, date-based neutrality is inapplicable.  
     - **Defense**: Concede this limits neutrality’s scope to fixed-identity cases (e.g., saving for one’s grandchild) or accept a population-agnostic view (e.g., "We owe *possible* future beings equal consideration, regardless of who emerges"). The latter risks repugnant conclusions.  
     - **Confidence**: Standard Econ (Parfit-derived).  

  2. **Life-Shape Objection: Time Matters Within a Life**  
     - **Objection**: If well-being is non-separable across life stages (e.g., childhood opportunities are more valuable than identical opportunities at age 80; achieving goals early shapes life-narrative value), then a person’s total good *is* temporally biased. Neutrality fails at the individual level before aggregation.  
     - **Why it’s fatal**: Neutrality assumes well-being is *atomistic and time-independent*, but if time is constitutive of value (e.g., "a good youth is worth more than a good old age"), discounting within lives is defensible — and social discounting may inherit this.  
     - **Defense**: Accept this but restrict neutrality to *interpersonal* comparisons ("Equal weight per *person*, not per *year*"). Or argue temporal biases in well-being are instrumental (e.g., early opportunities enable more life options).  
     - **Confidence**: Speculative (drawing on philosophy of well-being, e.g., Velleman).  

  ---

  ### **Serious but Manageable Objections**  
  *(Awkward; require refinement but not surrender)*

  3. **Diamond’s Impossibility Result**  
     - **Objection**: Diamond (1965) proved no social welfare function can satisfy:  
       (1) **Pareto Efficiency**  
       (2) **Anonymity** (equal treatment of generations)  
       (3) **Continuity** (small changes don’t cause rank-swaps)  
       ...for infinite horizons. Neutrality implies (2), but forces violation of (1) or (3).  
     - **Why it’s serious**: Suggests strict temporal neutrality + completeness is mathematically impossible in infinite settings.  
     - **Defense**: This attacks *aggregation methods* (e.g., undiscounted utilitarianism), not neutrality itself. Concede that *complete* orderings are impossible, but:  
       - Use incomplete orderings (e.g., "Policy A dominates B for all feasible discount rates").  
       - Accept a "sustainable" criterion (e.g., ensure no generation falls below a threshold).  
     - **Confidence**: Standard Econ.  

  4. **Contingency Claim Enables Excuses for Inaction**  
     - **Objection**: If *any* discount rate can be retrofitted to hazard functions, your view is unfalsifiable. A policymaker could justify inaction on long-term risks (e.g., AI alignment) by positing arbitrary "extinction curves."  
     - **Why it’s serious**: Erodes normative bite; collapses into "discount rates just reflect empirical beliefs."  
     - **Defense**: The position *is falsifiable*:  
       - **Test Case**: Spending 0.1% of GDP now to avert a 20% GDP loss in 200 years.  
       - **Your View’s Prediction**: This is justified *if* institutional survival probability to year 2200 is >0.5% (adjusting for growth/curvature). If you reject this *despite* evidence of robust institutions (e.g., stable democracies lasting >200 years), you abandon contingency.  
       - **What Would Falsify It?** Evidence that hazard rates *must* be constant (rejected by survival data), or that society *should* discount even if survival is certain.  
     - **Confidence**: Reconstructed.  

  5. **Catastrophic Tail Risks Dwarf Contingency**  
     - **Objection**: Under extreme uncertainty (e.g., climate tipping points), Weitzman’s "Dismal Theorem" shows that if the *elasticity* of marginal utility is high and disaster risk has fat tails, discount rates become negative — prioritizing the far future. Your contingency discounting may be irrelevant next to tail-driven valuations.  
     - **Why it’s awkward**: Neutrality + contingency may still undervalue mitigation if tail risks dominate.  
     - **Defense**: This *extends* your view: declining discount rates (DDRs) emerge from uncertain hazard functions, but fat tails *amplify* the need for present action. No conflict.  
     - **Confidence**: Standard Econ.  

  ---

  ### **Cosmetic or Misdirected Objections**  
  *(Can be dismissed; don’t undermine core)*

  6. **Pure Time Preference is Empirically Observed**  
     - **Objection**: People *do* discount the future intrinsically (e.g., hyperbolic discounting experiments).  
     - **Reply**: Your claim is normative ("*should* we?"), not positive. Empirical preferences ≠ justification. Dismiss.  
     - **Confidence**: Standard Econ.  

  7. **Neutrality Demands Impossible Sacrifices**  
     - **Objection": Requiring neutrality could immiserate the present for distant futures (e.g., 99% taxes for asteroid defense).  
     - **Reply**: Contingency already avoids this (if extinction risk is high, sacrifice is unwarranted). Growth/curvature terms in Ramsey also limit sacrifices. Dismiss.  
     - **Confidence**: Reconstructed.  

  ---

  ### **Insulation Assessment: Is the Position Unfalsifiable?**  
  **Short Answer**: No, but it requires explicit survival-probability commitments.  
  - **Risk**: Contingency can be abused to rationalize inaction, but your view *constrains* this:  
    - You must defend *specific* hazard-rate models (e.g., why institutional collapse risk is *x*%/year).  
    - DDRs *must* emerge from survival uncertainty — constant rates contradict your model.  
  - **Falsification Conditions**:  
    1. If new evidence shows hazard rates *cannot* decline (e.g., entropy-like societal decay), your DDR argument fails.  
    2. If you weight a certain-future benefit less merely because it’s distant (e.g., "1 util in 2300 < 1 util in 2100"), you abandon neutrality.  
  - **Test Case Verdict**: Your position *does* yield an answer:  
    - Calculate the break-even survival probability *p* for the investment.  
    - If your best estimate of *p* exceeds this threshold, act; else, don’t.  
    - **What you supply**: Estimates of *p* and growth/curvature parameters (Ramsey terms). Neutrality fixes the "pure" delta at zero; contingency sets the survival adjustment.  

  ---

  ### **Synthesis**  
  - **Fatal Weaknesses**: Non-identity and life-shape objections force concessions on neutrality’s *scope* (it can’t cover choice-dependent populations) or *foundations* (if well-being is temporally structured).  
  - **Core Resilience**: Diamond’s theorem attacks aggregation, not neutrality. Contingency discounting is falsifiable if tied to explicit survival models.  
  - **What You Should Abandon**: Strict neutrality for *variable* populations; atomistic well-being if life-shape effects are irreducible.  
  - **What Holds**: Rejecting pure time preference; requiring DDRs under survival uncertainty; judging policies by survival-adjusted expected value.  

  > "Temporal neutrality survives as a *default* stance for fixed populations, but founders when identities or lives are temporally porous. Contingency discounting escapes unfalsifiability by demanding testable survival models — and dies on that hill if they fail."
