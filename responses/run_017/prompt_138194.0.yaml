prompt: |-
  I have been reading about the objection to utilitarianism that turns on the distinctness of persons, and I keep coming up against a move in these arguments that I cannot find a name for, so I will describe it as concretely as I can.

  The move is this. The critic says that adding benefits and burdens across people is illegitimate: within a single life I can take a loss now for the sake of a gain later and be none the worse overall, because the same someone gets both, but across lives the gain is had by one person and the loss by another and nobody is compensated. The defender's reply is almost never to deny this. It is to change what the addition is over. Add over person-moments rather than persons. Add over episodes of experience rather than experiencers. Add over the claims themselves rather than the claimants. Add over each person's prospects *before* it is settled who anyone will turn out to be, so that the choice is no longer one person's gain against another's loss but a single package of risk that each person takes on equally. In every case the summing survives intact, but the critic's description of what is being summed no longer applies, and the case now looks like the harmless within-a-life one.

  A concrete instance. A policy imposes a small risk of a serious injury on each of ten thousand people in order to secure each of them a small convenience. Stated as an outcome, this is a trade across persons only if the injuries and the conveniences fall on different people; restated ex ante, before anyone knows which of the ten thousand will be injured, the cross-person trade seems to vanish and what remains is one package that each person accepts for themselves.

  Two things make me think this is not simply equivocation or evasion, though I cannot rule that out. First, the redescriptions are not weaker versions of a strong claim quietly substituted for it under pressure; they are different constructions, each coherent on its own terms, and the people making them seem to mean them. Second, the critic is in the same position. To say what must *not* be added across, the critic must say what the unit is: a life, a person at a time, a household, a people. And whichever unit is chosen looks like the same kind of stipulation. Nobody can count the items in the sum until someone has said what kind of thing one item is, and the kind is not supplied by the subject matter.

  So I am not asking who wins that dispute. I am asking whether this predicament has an established name or a literature of its own: that a view must fix a unit of moral bookkeeping, that the unit is underdetermined, and that respecifying it changes the verdict while presenting itself as a minor technical choice. I have the sense that it sits near several things and is identical to none: the objection from the distinctness of persons itself, which appears to *presuppose* a unit rather than to supply one; the charge that a dispute is merely verbal; the point that you cannot count things of a sort without first settling the sort; and various boundary problems about who or what is to be included. A friend in biology says they have a version of the same argument there, which makes me suspect I am looking at something more general.

  What I want is the carving, not a label. If there is an established concept, tell me which it is, how my description fits it and where it fails to fit, and what its boundary cases are. If there is not, say so, and give me a name and a definition that distinguishes the phenomenon from each of those neighbours. In particular, I want a principled line between re-specifying the unit in a way that is a genuine moral advance and re-specifying it in a way that gets an answer without answering the question. My own candidates for the two sides are the move from counting nations or households to counting people, which strikes me as progress, and some of the ex ante redescriptions above, which strike me as closer to a dodge; I would like that judgement tested rather than confirmed. My own attempt at a name was "the denomination problem", after redenominating a currency, but I have come to doubt it, since redenomination alters no comparison at all, whereas here changing the unit does seem to change the verdict. Please don't send me a reading list or references; I am after the analysis. And please write in British English.
reasoning: |-
  Okay, the user has presented a sophisticated philosophical problem about utilitarianism and the distinctness of persons. They've described a common move in debates where utilitarians shift the unit of moral accounting (from persons to person-moments, experiences, claims, or ex ante perspectives) to counter objections about aggregating benefits across individuals. The user wants to know if this phenomenon has a name, but more importantly seeks conceptual clarification about what constitutes legitimate versus illegitimate unit respecification.

  Hmm, this is a deep meta-ethical puzzle. The user clearly has strong philosophical training - they've articulated the problem precisely and even identified key features like underdetermination of units and the difference between moral progress versus evasion. Their frustration with superficial labeling suggests they want rigorous analysis, not just terminology.

  First, let's map the territory. The core issue is that moral mathematics requires choosing a "counting unit," but this choice isn't value-neutral. When critics say "don't sum across persons," they're privileging personhood as the unit; utilitarians respond by choosing different units where aggregation seems unproblematic. The user is right that this isn't equivocation - both positions are coherent internally. 

  The biological parallel the user mentions is fascinating - in evolutionary biology, similar debates occur about whether selection acts on genes, individuals, or groups. This suggests we're dealing with a general problem about explanatory frameworks in complex systems.

  What makes this tricky is distinguishing legitimate from illegitimate unit shifts. The user gives two examples: shifting from households to individuals (which they see as progress) versus ex ante risk redistribution (which feels like a dodge). I think the difference lies in whether the shift changes the subject. Counting individuals instead of households better tracks what matters morally (individual welfare), while ex ante perspectives arguably obscure the actual distribution of harms when risks materialize.

  For a name, "denomination problem" is clever but misleading - currency redenomination is purely notational whereas here unit changes alter moral conclusions. Better might be "moral combinatorics" or "aggregation frame problem," but these feel jargony. Perhaps "the unit selection dilemma" captures the forced choice aspect.

  What the user really needs is criteria to evaluate unit specifications. I propose three tests: 1) Does the unit track what's intrinsically valuable? (experiences might) 2) Is the unit stable under description? (person-moments fragment identity problematically) 3) Does handling the unit respect moral patients' separateness? (ex ante approaches may not)

  The biological analogy helps here - just as gene-centric explanations in biology work because genes are replicators, experience-centric units in ethics might work because experiences are the carriers of value. But we must avoid smuggling in contested metaphysical assumptions.

  Ultimately, this shows utilitarianism isn't neutral about personal identity - its viability depends on adopting a "thinner" view of persons than critics assume. The debate isn't about aggregation per se, but about what constitutes a moral patient. That's why no unit specification is truly pre-moral.
answer: |-
  You've pinpointed a profound and recurring structural dilemma in moral philosophy (and beyond) demanding careful dissection. While elements resonate with established concepts, the *core predicament* you describe – the underdetermined choice of a fundamental unit for moral accounting that crucially shapes verdicts, and the strategic shifting of this unit to dissolve objections – lacks a single, universally accepted name. Let's carve it precisely.

  **1. The Phenomenon: Core Description & Boundaries**

  *   **Core:** The **necessity and underdetermination of the fundamental unit of moral "summing" or aggregation**. Utilitarianism (and other aggregative theories) requires specifying *what* is being summed (welfare, utility, claims) and *over what domain* (persons, person-stages, experiences, claims, ex ante perspectives). This choice is a foundational *stipulation* – not dictated by the empirical facts alone – and fundamentally alters the calculation's outcome and its susceptibility to objections (like the distinctness of persons).
  *   **Key Features:**
      *   **Unit Primacy:** The moral verdict depends *first* on selecting the unit of aggregation before any calculation occurs.
      *   **Underdetermination:** Multiple coherent units are possible (person, person-stage, experience, claim, ex ante perspective, family, species, etc.). No single unit is uniquely forced by the "subject matter" of welfare or value *prior* to normative commitment.
      *   **Strategic Shift:** Defenders often respond to objections targeting one unit (e.g., summing across distinct persons) by shifting to a different unit (e.g., summing person-stages or ex ante perspectives) where the *specific form* of the objection dissolves, even though aggregation persists.
      *   **Presupposition, Not Proof:** Arguments *against* summing across persons *presuppose* the person as the morally salient unit, just as defences presuppose their chosen unit. Neither side can *prove* their unit is fundamental solely from within the aggregative framework.
  *   **Boundaries:**
      *   **Distinct from "Distinctness of Persons" Objection:** This objection *presumes* the person-unit is fundamental and highlights the problem of aggregation *across* these units. Your focus is on the *prior choice* of the unit itself, which the objection relies upon but doesn't justify.
      *   **Distinct from Mere Verbal Dispute:** While unit shifts can *look* verbal, they represent genuine, substantive normative choices about what fundamentally matters. Calculating over persons vs. person-stages implies different views of personal identity and moral weight. Ex ante vs. ex post shifts imply different views of fairness and responsibility.
      *   **Distinct from Boundary Problems (Who Counts?):** That's about the *scope* of the moral community (which entities are units?). Your problem is about the *nature* of the fundamental unit itself (what *kind* of thing is being summed *within* the community?) even when the entities are agreed upon. Is the fundamental unit the whole life, the time-slice, the experience, the claim?
      *   **Distinct from "Level of Selection" (Biology):** Your biology friend is right. The analogous problem in evolution is "What is the unit of selection?" (gene, individual, group, species). The choice fundamentally alters explanations for adaptations. However, the *moral* dimension of justification and potential evasion is unique to the ethical context.

  **2. Naming & Defining the Core Predicament**

  *   **Proposed Name:** **The Aggregation Unit Selection Problem (AUSP)** or **The Fundamental Unit of Moral Accounting Dilemma (FUMAD)**. These capture the necessity, the choice, and the underdetermination.
  *   **Definition:** **The predicament arising from the necessity within aggregative moral theories to stipulate a fundamental unit over which benefits and burdens are summed, where multiple coherent but normatively consequential units are available, and where the choice of unit fundamentally determines the theory's susceptibility to certain objections and its practical verdicts.**

  **3. Distinguishing Legitimate Advance from Evasive Dodge**

  This is the crux. Your instinct ("counting people vs. households = progress; ex ante shift = dodge") needs refinement. The line isn't always sharp, but hinges on **whether the shift genuinely realigns the calculation with the fundamental bearers of moral value or merely obscures the underlying conflict.**

  *   **Criteria for Potential Legitimacy (Genuine Moral Advance):**
      1.  **Tracking the Locus of Value:** Does the new unit better reflect what is *intrinsically* valuable or disvaluable? If the ultimate good/bad is located in *experiences* or *moments of consciousness*, summing over person-stages or experiences might be more fundamental than summing over whole persons. The move from households to individuals assumes individual sentience/welfare is primary.
      2.  **Resolving Genuine Incoherence/Arbitrariness:** Does the shift address a genuine inconsistency or arbitrariness in the *application* of the aggregative principle itself under the old unit? (This is harder to argue for simple shifts like person -> person-stage).
      3.  **Preserving the Core Insight While Avoiding Spurious Problems:** Does it retain the *point* of aggregation (e.g., maximizing net good) while avoiding objections that stem purely from an arbitrary or inadequate *representation* of that good? (This is the utilitarian's *claim* for ex ante shifts: it captures the *expected* value each faces, which is the genuinely relevant moral quantity under uncertainty).
      4.  **Explanatory Power:** Does the new unit provide a more coherent or unified explanation of our considered judgments across a wider range of cases?
  *   **Criteria for Potential Evasion (Dodge):**
      1.  **Obscuring Actual Moral Patients:** Does the shift dissolve the objection by making the distinct moral patients (whose separateness grounds the objection) *disappear from the accounting*? The ex ante shift arguably does this. While each person faces a risk, the *actual outcome* involves *specific* individuals suffering uncompensated losses for the benefit of *others*. Shifting to ex ante perspectives replaces the actual sufferers/beneficiaries with statistical expectations, potentially masking the distributional injustice *when the risk materializes*.
      2.  **Changing the Subject:** Does the shift subtly alter the *question being asked*? The critic objects to a specific trade-off *between identified persons*. The ex ante defence answers a different question: "Was it rational/rational for each *ex ante* to accept the gamble?" This might be relevant, but it doesn't directly address the objection to the *ex post* interpersonal transfer. It answers "Was the *procedure* fair/good *ex ante*?" not "Is the *outcome* fair/good *ex post*?".
      3.  **Ad Hocness:** Is the shift *only* deployed to counter specific objections, without independent motivation or integration into the broader theory? Does the theory consistently use this unit, or only when convenient?
      4.  **Failure to Engage the Core Concern:** Does the shift simply bypass the critic's fundamental worry (e.g., the moral significance of separate persons bearing uncompensated burdens for others' gains) rather than providing a compelling reason why that worry is misplaced *within the aggregative framework*?

  **4. Applying the Criteria to Your Examples**

  *   **Households -> Individuals:** **Likely Genuine Advance.** Assumes individual sentience/welfare is the fundamental locus of value. Households are arbitrary aggregates from this perspective. The shift better tracks what matters intrinsically. It resolves the arbitrariness of treating arbitrarily defined groups as units. It engages the core concern about whose welfare counts.
  *   **Ex Ante Shift (Risk Case):** **Potentially Evasive, or at Best Incomplete.**
      *   *For:* It arguably tracks the *ex ante* expected welfare each faces, which is a genuine moral consideration under uncertainty. It shows the policy isn't *intended* to sacrifice A for B, but offers a uniform risk/benefit profile. It can be seen as consistent with a focus on expected utility as the fundamental moral quantity.
      *   *Against (Why it might feel like a dodge):* It obscures the *ex post* reality where distinct persons suffer net losses for others' net gains. The critic's concern is precisely about *that ex post distribution*. The shift changes the question from "Is this outcome just?" to "Was the gamble fair *ex ante*?". It doesn't address the separateness of persons *in the outcome*; it avoids it by focusing solely on the initial position. It can be seen as failing Criterion 4: it doesn't convincingly show why the distinctness worry *ex post* is irrelevant if the *ex ante* gamble was fair. It might be a crucial *part* of the justification but doesn't *negate* the need to consider the *ex post* distribution.

  **5. Conclusion: The Stakes**

  The Aggregation Unit Selection Problem reveals that utilitarianism (and aggregation generally) is not a neutral calculus applied to a given moral reality. **The choice of the fundamental unit is itself a profound normative commitment** about the nature of moral value, personal identity, and fairness. It determines what counts as a "cost" or "benefit" within the sum.

  *   **Person-unit:** Emphasizes the separateness of lives, making interpersonal compensation problematic.
  *   **Person-stage/Experience-unit:** Fragments identity, potentially dissolving separateness worries but raising questions about the unity of a life and distributive justice *within* a life over time.
  *   **Ex Ante-unit:** Focuses on procedural fairness and initial expectations under uncertainty, but risks neglecting the moral significance of actual outcomes and the identities of winners/losers.
  *   **Claim-unit:** Focuses on the strength of competing demands, potentially sidestepping aggregation of welfare but facing its own challenges in weighting claims.

  There is no pre-moral "correct" unit. The defensibility of utilitarianism hinges on the defensibility of its chosen unit of aggregation against challenges that presuppose a different, often deeper-seated, view of moral personality and value. Your discernment of this underlying structural choice is astute. The challenge lies in rigorously evaluating the justifications for choosing one fundamental unit over another, recognising that shifts can be either illuminating realignments or strategic retreats from the hardest questions.
