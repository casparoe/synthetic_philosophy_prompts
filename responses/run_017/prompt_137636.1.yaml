prompt: |-
  I'm a third-year in a normative ethics seminar and I also coordinate a student mutual-aid fund on campus — we hand out small emergency grants (rent, dental work, a bus ticket home, replacing a stolen laptop) from money that comes mostly from student-government dues plus a few outside donors. We get around twenty requests a week, each one has to be answered inside 48 hours, and the people actually deciding are me and two other undergrads who are exhausted and doing this at 11pm between problem sets. Anything over $250 needs two of us to sign off, and changes to the written policy have to go past student government, so whatever we adopt has to be explainable to them and to donors in plain language. Last week in seminar we did the demandingness objection and it basically wrecked the group chat: one person said that if the maximizing version is right then the fund should be telling all of us to give until we're at roughly the level of the people we're helping, and that this is absurd enough to sink the theory; someone else said that objection only shows that a rule which eats the very capacities and relationships you need to keep following it is self-defeating, not that the theory is wrong; and a third said the whole thing dissolves once you distinguish doing your fair share from picking up the slack for everyone who isn't doing theirs. I don't need that argument settled in the abstract — I need to turn whatever survives it into something my team can actually run, forty times a month, without re-deriving it from scratch each time.

  So: please write me a decision procedure, as a checklist or a flowchart in words, that takes a consequentialist starting point seriously but has a real answer to the demandingness worry built into it rather than bolted on. Concretely I want the questions in the order we should ask them, what counts as a sufficient answer to each (including what to do when we just can't get a number), the point where the procedure stops with a no, and the point where it hands the decision to a person because the question is one of values and not facts — and I want those two kinds of step labeled as such, because I can already tell which parts are judgment calls wearing a lab coat. It has to be runnable in about ten minutes on a one-page form by someone with no philosophy, and it has to be stable week to week: a rule that ratchets upward every time a new request lands in the inbox is one we will quietly stop following by November, and I'd rather have a rule we can actually stick to than an optimal one we abandon. Three or four things I keep hitting and don't know how to write into the form: (1) the slack question — almost nobody else on campus gives anything, so are we setting the bar at our share of the total need, or at whatever actually needs doing given that no one else is doing it, and is it suspiciously convenient that the people choosing the bar are the same people who pay it? I half want a test like "what would this policy look like if an auditor who disliked us applied it to us," but I don't know if that's principled or just a guilt device. (2) Whether our own stuff — coursework, relationships, sleep, the fact that we're doing this for free — is a side-constraint that caps what can be demanded of us, or just another item to weigh against a grant, because the two give very different answers when a local food bank tells us that every extra volunteer hour is a measurable number of meals. (3) The re-ask problem: the same few people apply every month, and a rule that treats each request as a fresh opportunity never stops, while a rule that caps them feels like it's punishing people for being poor in the same place twice. (4) Whether the procedure is even allowed to spend money on keeping itself going, or whether that's just self-indulgence with a nicer name.

  Then please run it on three cases so I can see if it holds up. First: a request for $400 for emergency dental work, arriving in a week when we have about $2,000 left and twelve other pending requests, and no way to verify more than what the applicant wrote on the form. Second: the food bank asks us to supply volunteers, and the question on the table is whether we start asking our own members to go from two hours a week to eight during finals, given that the extra hours really do convert into meals and that two of our members are already borderline burned out. Third — and this is the one where I already know I won't like the answer — we have $300 and have to choose between spending it on a thank-you dinner and hoodies for our volunteers (which reliably stops people from quitting, and we have lost volunteers to exactly this) or giving it out as one more grant. For each, show the procedure actually crunching through its steps and where it terminates, and be straight with me if the one I'm dreading comes out against me. Finally, tell me what the procedure can't do: which of these questions it's really just relabeling, where it will systematically misfire (I'm especially worried it will end up funding whoever tells the most vivid story in person, since that's what makes a demand feel binding), and what we should do in the first month to find out whether we're following it or just rationalizing whatever we were going to do anyway.
reasoning: |-
  Okay, the user is a third-year student running a mutual-aid fund while studying normative ethics. They're overwhelmed by the demandingness objection debate in their seminar and need a practical decision procedure for their fund. 

  First, I need to unpack their core pain points: they're drowning in 20+ weekly requests processed by exhausted undergrads, need a system that's both philosophically sound and operationally sustainable, and have four specific dilemmas they keep hitting. The tension between ethical rigor and real-world constraints is palpable - they're basically trying to build an antifatigue consequentialism.

  Hmm... their four sticking points reveal deeper worries: 
  (1) The "slack question" shows they're haunted by moral licensing - aware their position as deciders/givers creates bias. 
  (2) The "own stuff" dilemma exposes role conflict - are they agents of the fund or objects of its demands? 
  (3) "Re-ask problem" hints at justice vs. care tension in chronic need. 
  (4) The overhead question is classic effective altruism paralysis.

  The cases they provide are perfectly chosen stress tests: 
  - The dental emergency tests scarcity management 
  - The food bank volunteer ask probes demandingness limits 
  - The hoodies vs. grant dilemma forces confrontation with system-sustaining vs. direct aid

  *scribbles notes* Key design principles emerging:
  - Must have clear circuit breakers to prevent burnout
  - Needs "values lock" steps where judgment is unavoidable but must be bounded
  - Should inoculate against common biases (vividness, compassion fatigue)
  - Requires audit trails to catch self-serving interpretations

  *imagines flowchart* The procedure should probably:
  1. Filter administratively invalid requests fast (no philosophy needed)
  2. Quantify impact where possible but...
  3. ...build in "fuzzy logic" gates for unquantifiables
  4. Explicitly cap demands on volunteers
  5. Have periodic review to prevent scope creep

  For the dental case: The procedure should handle uncertainty by defaulting to trust but with verification sampling. For the food bank: Must protect the operators' functioning as non-negotiable. For the hoodies: Ah, here's the rub - it has to permit some self-maintenance as instrumental to sustained impact.

  Biggest danger areas: 
  - Vividness effect might still sneak in at "values judgment" steps 
  - The review mechanism is critical to prevent rule drift 
  - Might underfund chronic cases without explicit recurring-aid protocol

  *checks watch* Better structure this as... 
  - Core principles first (they need philosophical anchors) 
  - Then step-by-step guide with clear stopping points 
  - Case walkthroughs showing where bias might creep in 
  - Finally, a "here's how to audit yourselves" section

  The thank-you dinner case will sting, but better to show how sustaining the engine serves more meals long-term than one extra grant. Should emphasize that this isn't "self-indulgence" but system stewardship.
answer: |-
  Here's a decision procedure designed for your mutual-aid fund, grounded in a **sustainable consequentialism** framework that internalizes the demandingness objection. It prioritizes **clarity, operational stability, and agent-preservation** while maximizing impact under real constraints.  

  ---

  ### **Sustainable Mutual-Aid Decision Procedure**  
  *(Flowchart in Words | Target: 10 min/request | 1-Page Form Friendly)*  

  1. **ADMIN CHECK (FACT):**  
     - *Ask:* Does the request meet formal criteria? (E.g., enrolled student? emergency? documentation provided? max $500?)  
     - *Sufficient Answer:* Yes + basic documentation OR credible explanation for missing docs.  
     - *Stop if:* No → **Deny (with reason + referral if possible)**.  

  2. **URGENCY/IRREVERSIBILITY (FACT → VALUES):**  
     - *Ask:* Will delay/cost worsen significantly if not funded *now*? (e.g., eviction vs. textbook; infected tooth vs. gym fee).  
     - *Sufficient Answer:* High urgency (health/safety/housing loss) → proceed. Medium/low → skip to Step 4.  
     - *Judgment Call:* "Significant" defined as ≥20% cost increase or irreversible harm (e.g., homelessness, health crisis).  

  3. **IMPACT PER DOLLAR (FACT → VALUES):**  
     - *Ask:* What’s the **magnitude of improvement** per dollar? (e.g., $400 dental work stops pain/eating issues = high impact; $400 for a slightly faster laptop = lower).  
     - *Sufficient Answer:*  
       - High: Solves critical need (health, housing, food security).  
       - Medium: Prevents major disruption (e.g., lost coursework).  
       - Low: Convenience/non-urgent upgrade.  
     - *Stop if:* Low impact → **Deny (explain why + alternatives)**.  

  4. **SHARED RESPONSIBILITY (FACT):**  
     - *Ask:* Is another entity *obligated* to cover this? (e.g., university health plan, insurance, family support agreement).  
     - *Sufficient Answer:* Proof of ineligibility for other aid OR exhausted options → proceed.  
     - *Stop if:* Clearly covered elsewhere → **Deny (refer to resource)**.  

  5. **SUSTAINABILITY CAP (VALUES):**  
     - *Ask:* Does funding this risk **depleting resources for higher-urgency needs**?  
       - Calculate: (Remaining funds this cycle) / (Avg. weekly high-urgency requests).  
       - *Sufficient Answer:*  
         - If funds ≥ 1.5x avg. weekly high-urgency need → Fund if Steps 1–4 pass.  
         - If funds < 1.5x avg. → Only fund **high-urgency/high-impact** (Steps 2–3).  
       - *Judgment Call:* "High-urgency" defined in Step 2.  

  6. **AGENT WELL-BEING CONSTRAINT (VALUES):**  
     - *Ask:* Would fulfilling this demand **compromise core capacities** of volunteers? (e.g., sleep <5h/night, academic failure, quitting the fund).  
     - *Sufficient Answer:*  
       - If yes → **Automatic no** for non-monetary asks (e.g., volunteer hours).  
       - For funding: Only if high-urgency/high-impact (Steps 2–3) AND below $250 (no partner sign-off).  
     - *Built-in Principle:* Agent well-being is a **side constraint**, not a tradeable weight. Volunteers at 20% capacity help no one.  

  7. **RECURRING NEEDS (FACT):**  
     - *Ask:* Is this applicant’s 3rd+ request in 6 months?  
     - *Sufficient Answer:*  
       - Yes → Fund only if high-urgency + Steps 1–5 pass + **require meeting with campus support services**.  
       - No → Proceed.  
     - *Why:* Avoids dependency without punishing chronic need; connects to systemic solutions.  

  8. **FINAL DECISION:**  
     - If all steps pass → **Approve** (amount as requested or partial if sustainability cap applies).  
     - Else → **Deny** (with specific step # and reason).  

  ---

  ### **How It Addresses Your Dilemmas**  
  1. **Slack Question:**  
     - Uses **institutional obligation checks** (Step 4) and **sustainability caps** (Step 5) tied to *actual* fund capacity. Rejects "total need" as the benchmark.  
     - *Not suspicious:* The "auditor test" is operationalized via **verifiable thresholds** (e.g., 1.5x weekly urgent-need buffer).  

  2. **Agent Well-Being:**  
     - Treated as a **hard constraint** (Step 6). Volunteering time is capped *before* weighing impact.  

  3. **Re-Ask Problem:**  
     - **Requires institutional engagement** for recurring cases (Step 7) without denying aid for urgent needs.  

  4. **Overhead/Volunteer Support:**  
     - **Allowed if critical to operational continuity** (see Case 3 below).  

  ---

  ### **Case Applications**  
  **Case 1: $400 Dental Work**  
  - Step 1: Pass (emergency, docs plausible).  
  - Step 2: **High urgency** (pain/eating issues → irreversible harm).  
  - Step 3: **High impact** (health-critical).  
  - Step 4: Pass (likely not covered by student insurance).  
  - Step 5: Funds ($2k) / Avg. weekly high-urgency (e.g., 5x $300 = $1.5k) → $2k > 1.5x $1.5k? **Yes** → Funds available.  
  - Step 7: First request? Assume yes → Pass.  
  - **→ APPROVED**  

  **Case 2: Food Bank Volunteer Hours Increase**  
  - *This is a non-monetary demand on volunteers:*  
    - Step 6: **"Compromise core capacities?"** Finals week + existing burnout → **YES**.  
    - → **AUTOMATIC NO** (no further weighing).  
  - *Why:* Protecting agent capacity is non-negotiable. Alternative: Use fund money to hire temporary labor if high-impact.  

  **Case 3: $300 for Volunteer Hoodies/Dinner vs. Grant**  
  - Step 1: N/A (internal request).  
  - Step 2: Urgency? Volunteer retention = **medium** (prevents future collapse).  
  - Step 3: Impact? Hoodies → reduces quit risk → **high long-term impact** (losing 2 volunteers = -40 hrs/week → fewer grants processed).  
  - Step 5: Compare to direct grant:  
    - $300 grant → helps 1 person.  
    - $300 retention → keeps team functional → enables 100s of future grants.  
  - Step 6: **Reduces burnout risk** (supports well-being).  
  - **→ APPROVED for retention spending**  
  - *Hard truth:* This isn’t self-indulgence; it’s **systemic impact preservation**.  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Eliminate Judgment Calls:** Steps 2 (urgency) and 3 (impact) require values-based assessments. Mitigated by:  
     - **Clear definitions** (e.g., "irreversible harm").  
     - **Weekly calibration meetings:** Compare 2–3 cases to align standards.  
  2. **Vividness Bias:** A vivid story might sway Steps 2/3. Fix:  
     - **Blind review:** Redact emotionally charged language.  
     - **Impact rubric:** Rate urgency/impact on a scale (e.g., 1–5) *before* reading narratives.  
  3. **Systemic Injustice:** Can’t fix that "no one else gives." Focus on **referrals** (Step 4) and **advocacy** (e.g., report gaps to student government).  
  4. **Perfect Quantification:** Impact estimates (Step 3) are fuzzy. Use **proxies** (e.g., "health > academics > convenience").  

  ---

  ### **Implementation Audit (First Month)**  
  To avoid rationalization:  
  1. **Track Decisions:** Log every request + step outcome.  
  2. **Weekly Review:** Pick 3 "edge cases" and re-run as a team. Ask:  
     - *"Would an outsider see our reasoning?"*  
     - *"Did we bend a rule for ‘compassion’?"*  
  3. **Stability Test:** Compare Week 1 vs. Week 4:  
     - Are approval rates/caps consistent?  
     - Has volunteer burnout decreased?  
  4. **Feedback Loop:** Survey denied applicants: "Was our reason clear?"  

  This system won’t satisfy a utilitarian purist, but it converts consequentialism into a **tool for durable good** — and that’s what your fund (and your sanity) needs.  

  > "The best ethical engine is one that keeps running."  
  > — Adapted from a tired mutual-aid coordinator
