     And the halfer position, which ignores the selection effect, gets the Stage 2 and lab assistant right but Stage 1 wrong. The thirder position gets both right.

     But note: the halfer might argue that in Stage 1 the probability is 1/2. But our simulation shows that betting on tails wins 2/3 of the time.

     Therefore, we hope that the token counts in Stage 1 will convince the halfers to update.

  ### Timeline (90 minutes)

  **Preparation (5 minutes)**
     - Explain the rules of the game (without revealing the coin probabilities).
     - Assign one student as the lab assistant (or the instructor can play this role).
     - Hand out data sheets.

  **Stage 1 (30 minutes)**
     - Run 12 rounds.
       - Each round: 
            - Instructor flips coin (in private).
            - Prepares 16 envelopes: heads -> 1 awake, 15 asleep; tails -> 2 awake (both unmarked), 14 asleep.
            - Distributes envelopes randomly.
            - Students open simultaneously.
            - All students write a number (between 0 and 1) and a bet (H or T) on their response slip, seal it.
            - Collect responses.
            - Instructor reveals the coin flip and the number of awake students (but not who) and records on the board: round number, coin, and the responses of the awake students (without names, but record the number and the bet).
            - Pay tokens for the scoring rule: for each awake student, compute score = if heads: 100*[1 - (1-p)^2], if tails: 100*[1 - p^2]. (We multiply by 100 to make the numbers larger and differences more noticeable.)

     - After 12 rounds, aggregate the data:
          - Count: number of heads rounds, tails rounds.
          - Total awake episodes: heads rounds * 1 + tails rounds * 2.
          - Proportion of tails awake episodes: (tails awake episodes) / (total awake episodes).
          - For each awake episode, record the reported p and the bet.
          - Compute the average p for all awake episodes.
          - Compute the average score for all awake episodes.
          - Group the bets: how many bets on heads, how many on tails? And what proportion were correct?

     - Show that the proportion of tails awake episodes is about 2/3 (if the sample is large enough).
     - Show that the average score is higher for those who reported lower p (closer to 1/3) and for those who bet tails.

  **Stage 2 (25 minutes)**
     - Explain the new rule: 
          - In each round, we will mark the awake slips in tails rounds as "first" and "second". In heads rounds, the awake slip is marked as "first".
          - We will score only the "first" awakenings in every round.
          - Everyone still writes a decoy if they are not scored.
          - The lab assistant continues as before: they are told it is the first day (Monday) and they report.

     - Run 6 rounds of Stage 2.
          - Each round: flip coin.
          - Prepare envelopes: heads: 1 awake (marked "first"), 15 asleep; tails: 2 awake (one "first", one "second"), 14 asleep.
          - Distribute.
          - Students open. The ones who are "first" know they are being scored. The others (including "second" in tails) write decoys.
          - Collect responses.
          - Record: round, coin, responses of the "first" student(s) and the lab assistant.

     - Aggregate:
          - Number of first awakenings: 6 (one per round).
          - Proportion of heads in these first awakenings: should be 1/2.
          - Average reported p for first awakenings: should be 1/2.
          - Average score: should be around 75 (if reporting 1/2).

     - Compare the lab assistant's reports: they should also be around 1/2 and have similar scores.

  **Stage 3: Discussion (30 minutes)**
     - Start by asking: "What did you notice? What surprised you?"
     - Guide the discussion to the difference between Stage 1 and Stage 2.
     - Ask: "Why did the lab assistant, who is always awake, report 1/2? And why did you, in Stage 1, report 1/3? What information did you have that the lab assistant didn't? Or vice versa?"
     - Expect the objection: "In the original Sleeping Beauty, Beauty is always awake. So she is like the lab assistant, not like us in Stage 1. Our Stage 1 had a selection effect because we might not have been awake. In the original, there's no selection: she is always awake."
     - Then ask: "So does the original problem have a selection effect? How is the original problem like Stage 1 or Stage 2?"
     - Point out: In the original, Beauty is awake on Monday and Tuesday (if tails) but she doesn't know which day it is. And she is given amnesia. So she doesn't know if it is the first or second awakening. That is like Stage 1: she doesn't know if she is the first or second. But unlike Stage 1, she is always awake. How to reconcile?
     - This is the crux: the original problem has no selection (she is always awake) but she has self-locating uncertainty (she doesn't know which day it is). The selection in our Stage 1 was both a selection and self-locating uncertainty.

     - We need to separate:
          - The selection effect (you might not have been sampled at all) -> this is unique to our Stage 1 and not in the original.
          - The self-locating uncertainty (you don't know which awakening this is) -> this is in both.

     - How to simulate the original? We would need:
          - No selection: every student is always awake.
          - But then we need to simulate two days in one round? And give amnesia? We cannot.

     - Alternative: 
          - In a round, we flip a coin.
          - If heads: we have one awakening (Monday).
          - If tails: we have two awakenings (Monday and Tuesday) but we do them sequentially? But then we need amnesia.

     - Since we cannot induce amnesia, we might have to use a different approach.

     - We can run a variant:

          Stage 3: the original problem simulation (without amnesia, but with a twist)

          We tell the students: now, we are going to simulate the original. We flip a coin. If heads, we will have one awakening (Monday). If tails, we will have two awakenings (Monday and Tuesday). But we cannot give amnesia, so we will do:

            - In a heads round: we ask the question on Monday.
            - In a tails round: we ask the question on Monday and then again on Tuesday, but we tell the student that they are the same person and they remember Monday? That breaks the amnesia.

          This is not feasible.

     - Therefore, we must rely on the students to see that the original problem is different from Stage 1. The key is that in the original, Beauty is always awakened, so there is no selection. But she doesn't know which day it is. So it is like being in a tails round and not knowing if you are the first or second? But note: in a tails round, if you are the second, you know it is Tuesday and therefore tails. So the original problem must have amnesia to prevent that.

     - We cannot simulate amnesia, so we have to discuss it.

     - Conclude: 
          - The Stage 1 simulation had a selection effect and self-locating uncertainty. The tokens showed that betting on tails was better, so the probability of heads was 1/3.
          - The original problem has no selection effect (Beauty is always awake) but has self-locating uncertainty. The thirder argues that the self-locating uncertainty leads to the same probability (1/3) as the selection effect in our Stage 1. The halfer argues that without selection, it should be 1/2.

     - The activity does not settle the original problem, but it shows that in a scenario with selection, 1/3 is better. And it shows that when we condition on being the first awakening (so no self-locating uncertainty) we get 1/2.

     - The lab assistant has no self-locating uncertainty (they know it is Monday) and no selection (they are always awake on Monday) so they get 1/2.

  ### What can go wrong?

  1. **Inference from noise or movement**: Students might try to count how many people are awake by listening to the noise of writing or movement. To mitigate: 
        - Have everyone write at the same time, and make sure the asleep students also write (decoys).
        - Discourage looking around.

  2. **Small-sample luck**: With only 12 rounds in Stage 1, we expect 6 heads and 6 tails, but it might vary. The total awake episodes will be around 18, but the proportion of tails might not be exactly 2/3. We can run more rounds if time permits, or we can use the law of large numbers and aggregate data from multiple years? But we have only one class. We can run 20 rounds? But time is limited.

  3. **Tokens are doing the work, credence untouched**: Some students might say that the tokens are a pragmatic consideration and do not reflect rational credence. We can discuss this: if credences are for guiding action, then they should align with betting behavior.

  4. **Sampling vs amnesia objection**: This might surface early. We can note that our simulation is not identical to the original, and we will discuss the differences at the end.

  5. **Confusion in Stage 2**: Students might not understand the marking. We can do a practice round.

  6. **Lab assistant role**: The student playing the lab assistant might not understand their role. We should explain carefully.

  7. **Time management**: 90 minutes is tight. We might not finish all rounds. We can reduce the number of rounds if necessary.

  8. **Scoring rule computation**: It might take time to compute the scores. We can precompute a table or use an app. Alternatively, we can just record the bets and pay 100 tokens for a correct bet and 0 for incorrect? Then in Stage 1, betting tails wins 2/3 of the time. But then we lose the credence reporting. We want both. We might have to compute the scoring rule offline and report scores later.

     Alternatively, we can have the students calculate their own scores? But that would reveal who was awake.

     We can collect the responses and then after class compute the scores and distribute tokens next time.

     But that loses the immediacy.

     We can have the instructor compute quickly: for each awake student, if heads: 100*(1 - (1-p)^2), if tails: 100*(1-p^2). We can do this with a calculator.

     We can also do it approximately: round to two decimals.

     We can prepare a spreadsheet on a laptop.

  ### What the activity cannot reproduce

  - **Self-locating ignorance without selection**: We cannot simulate the amnesia. We have to discuss it.
  - **The original problem exactly**: Our Stage 1 has a selection effect that the original does not. We hope that the students will see that the self-locating uncertainty in the original might be analogous to the selection effect in the simulation.

  ### Conclusion
  The activity should help students see that in a sampling scenario, the probability of heads is 1/3. But they should also see that when we condition on being the first awakening (removing the self-locating uncertainty) it becomes 1/2. The lab assistant also gets 1/2. The difference between the original problem and our Stage 1 simulation is the presence of selection. The activity cannot definitively settle the original problem, but it provides concrete experience with the relevant factors.
answer: |-
  ### Classroom Activity: Sleeping Beauty Simulation
  **Objective:** Students experience the Sleeping Beauty problem through a sampling-based simulation with real stakes, confronting the 1/2 vs. 1/3 disagreement empirically before theoretical debate.

  ---

  ### **Materials & Setup**
  - **Coin**: Fair coin (or RNG) for private flips.
  - **Slips**: 16 sealed envelopes per round. Each contains:
    - **Stage 1**: "AWAKE" or "ASLEEP" (on heads: 1 awake, 15 asleep; on tails: 2 awake, 14 asleep).
    - **Stage 2**: "AWAKE [1st]" or "AWAKE [2nd]" or "ASLEEP" (on heads: 1 "AWAKE [1st]", 15 asleep; on tails: 1 "AWAKE [1st]", 1 "AWAKE [2nd]", 14 asleep).
  - **Response cards**: Small cards for students to write:
    - A **number** (credence for heads, 0–1).
    - A **bet** ("H" or "T").
    - Seal in envelope after writing.
  - **Tokens**: For payouts (e.g., poker chips). 1 token = $0.01 extra credit or symbolic reward.
  - **Whiteboard**: Track rounds, coin results, payouts.
  - **Lab assistant**: One student plays this role (always awake, knows the "day" is Monday).

  ---

  ### **Rules**
  1. **Anonymity**: No talking, peeking, or revealing slips. All write guesses (sleepers write decoys).
  2. **Payouts**: Use a **quadratic scoring rule** for credence reports:
     - If heads: Payout = `100 × [1 - (1 - p)^2]` tokens  
       *(e.g., if report `p=0.3` and heads: `100 × [1 - (0.7)^2] = 100 × 0.51 = 51 tokens`)*.
     - If tails: Payout = `100 × [1 - p^2]` tokens  
       *(e.g., if report `p=0.3` and tails: `100 × [1 - 0.09] = 91 tokens`)*.  
     *(Scaling by 100 amplifies differences; max 100 tokens/awakening.)*
  3. **Lab assistant**: Always told "today is Monday." Reports credence/bet same as others but never sleeps.
  4. **Rounds**: Run in batches (Stage 1: 12 rounds; Stage 2: 6 rounds).

  ---

  ### **Stage 1: Sampling Ignorance (35 min)**
  **Goal:** Show that tails bets yield ~2× payout of heads bets; 2/3 of awake episodes occur in tails rounds.

  - **0:00–0:05**  
    - Explain rules, scoring, and lab assistant role.  
    - Emphasize: "You are guessing the coin *given you are awake*."

  - **0:05–0:35**  
    - **Per round** (12 rounds total):  
      1. Flip coin privately.  
      2. Distribute sealed slips (heads: 1 awake, 15 asleep; tails: 2 awake, 14 asleep).  
      3. All open slips simultaneously. All write credence (0–1) and bet (H/T) on cards, seal.  
      4. Collect cards.  
      5. Reveal coin result. Pay each awake student per scoring rule (discard sleepers' cards).  
      6. Record on board:  
         - Coin outcome (H/T).  
         - Number of awake students.  
         - Average credence reported by awake students.  
         - Bets (H/T) by awake students.  

  - **Expected Results (Aggregate After 12 Rounds):**  
    - **6 heads rounds (1 awake each) → 6 awake episodes.**  
    - **6 tails rounds (2 awake each) → 12 awake episodes.**  
    - **Total awake episodes: 18.**  
      - 66.7% (12/18) in tails rounds.  
      - Betting tails wins 66.7% of the time; betting heads wins 33.3%.  
    - **Payouts:**  
      - Always bet heads: Wins 6 times → 6 × 100 = 600 tokens max.  
      - Always bet tails: Wins 12 times → 12 × 100 = 1,200 tokens max.  
      - *Actual payouts use scoring rule, but trend is identical.*  
    - **Optimal credence:** Reporting `p=1/3` yields higher payouts:  
      - Expected tokens/awakening for `p=1/3`:  
        `(1/3) × 100[1 - (2/3)^2] + (2/3) × 100[1 - (1/3)^2] = (1/3)(100×5/9) + (2/3)(100×8/9) ≈ 55.55 + 88.89 = 144.44`  
      - For `p=1/2`:  
        `(1/3) × 100[1 - (0.5)^2] + (2/3) × 100[1 - (0.5)^2] = 100 × 0.75 = 75`  
      - Gap: **144.44 vs. 75 tokens** (92% higher for thirder).  
    - **Sample Size Note:** 12 rounds → 18 awake episodes. Noise is manageable; gap is large enough to appear. If results are noisy, run 4–6 extra rounds.

  - **Key Moment:**  
    - Students who report `p=0.5` but bet "T" will see their bets succeed 66.7% of the time. Point out this inconsistency: "If you believe `p=0.5`, why bet T? What does the scoring rule reward?"

  ---

  ### **Stage 2: First Awakening (25 min)**
  **Goal:** Distinguish positions by conditioning on "first awakening." Show credence shifts to 1/2.

  - **0:35–0:40**  
    - New rule: "In tails rounds, one awake slip is '1st,' one is '2nd.' Only '1st' slips get paid. Lab assistant still paid always."  
    - *Crucially: Being paid implies "you are the first awakening."*  

  - **0:40–1:00**  
    - **Per round** (6 rounds):  
      - Slips: Heads (1 "AWAKE [1st]"); Tails (1 "AWAKE [1st]", 1 "AWAKE [2nd]").  
      - All write credence/bet (sleepers and "2nd" write decoys).  
      - Only "1st" and lab assistant paid.  
      - Record: Coin, credences/bets of "1st" and lab assistant.  

  - **Arithmetic & Position Predictions:**  
    - **Given "I am first awakening":**  
      - `P(heads|first) = P(first|heads) × P(heads) / P(first) = (1 × 0.5) / (0.5×1 + 0.5×0.5) = 0.5 / 0.75 = 2/3?` **NO!**  
      - Correction: Each round has exactly one "first" awakening. Heads rounds: 50% of rounds; tails rounds: 50%.  
        → Half of "first" awakenings are in heads rounds.  
        → `P(heads | first) = 1/2`.  
    - **Predictions by Position:**  
      | **Position** | **Stage 1 Credence** | **Stage 2 Credence** |  
      |--------------|----------------------|----------------------|  
      | Halfer (pre-update) | 1/2 | 1/2 |  
      | Halfer (post-update) | 1/2 | 1/2 |  
      | Thirder | 1/3 | **1/2** |  
      | "Double Halfer" | 1/2 | 1/2 |  
      - **Only thirders update credence** (1/3 → 1/2).  
      - Halfers (all variants) stay at 1/2.  
    - **Activity Discriminates:**  
      - Stage 2 *exposes* thirders (they report ~0.5 here vs. ~0.33 in Stage 1).  
      - Leaves all halfer variants *tied* (all report ~0.5 in both stages).  
    - **Lab Assistant:** Always reports 1/2 (knows "Monday" = first awakening).  

  ---

  ### **Stage 3: Reflection & Objection (30 min)**
  **Goal:** Students critique the simulation vs. original problem. Surface sampling/amnesia disconnect.

  - **1:00–1:15**  
    - **Prompt 1 (to class):** *"Compare your Stage 1 experience to the lab assistant’s. What key difference made your credences diverge?"*  
      - **Expected student insight:** "We might not have been awake; they always are. Being awake was *news* to us."  
    - **Prompt 2:** *"In the original Sleeping Beauty problem, Beauty is always awake. How is our simulation different? Does your Stage 1 credence apply there?"*  
      - **Target objection:** "In Stage 1, being awake was evidence for tails because we might have been asleep. In the original, Beauty is never asleep—so no evidence!"  
    - **If objection arises early:**  
      - "Hold that thought! Let’s see how Stages 1–2 play out, then revisit."  
      - If deflating, pivot: "Exactly—so is sampling *necessary* for 1/3? Let’s test with a variant..." (Run Stage 2 early).  

  - **Lab Assistant Contrast:**  
    - Both "first awakeners" (Stage 2) and lab assistant know they are awake on "Monday."  
    - Both report `p=1/2` and earn identical payouts (~75 tokens/round).  
    - **Student conclusion:** "When you *know* you’re awake, the coin is fair. But when being awake is uncertain (Stage 1), tails is more likely."  
    - **Crucial question:** *"In the original problem, Beauty knows she’s awake. Is she more like Stage 1 you (sampled) or the lab assistant (always awake)?"*  

  - **Debrief Map:**  
    | **Game Moment** | **Feature of Disagreement** |  
    |-----------------|----------------------------|  
    | Stage 1 payouts | Betting tails wins 2× heads → sampling advantage |  
    | Stage 1 credence reports | `p=1/3` outearns `p=1/2` by 92% → scoring rule aligns with betting |  
    | Stage 2 credence shift | Thirders update to 1/2; halfers don’t → self-locating info matters |  
    | Lab assistant’s success | Always awake + knows "Monday" → 1/2 is optimal |  

  ---

  ### **What Will Go Wrong**
  1. **Noise in small samples**: 12 rounds may deviate from 66% tails awakenings.  
     - **Fix:** Pre-run coin flips to ensure 6H/6T. Scale payouts to 200× to amplify gaps.  
  2. **Selection bias**: Students infer awake count from rustling/peeking.  
     - **Fix:** Mandate synchronized writing; use envelopes that muffle sounds.  
  3. **"Tokens ≠ credence" objection**: "Payouts force pragmatism, not truth."  
     - **Fix:** "If credence guides bets, why did `p=0.5` + bet T work? What should you *believe*?"  
  4. **Amnesia objection surfaces early**: Derails Stages 1–2.  
     - **Fix:** "Write it down—we’ll address in Stage 3." If urgent: "True, we can’t induce amnesia. Does sampling *simulate* the ignorance?"  
  5. **Confusion in Stage 2**: Misunderstanding "first awakening."  
     - **Fix:** Do a practice round; highlight "only ‘1st’ paid" on board.  
  6. **Lab assistant error**: Reports 1/3 (misunderstands role).  
     - **Fix:** Clarify: "You know it’s Monday. You’re always awake."  

  ---

  ### **What the Activity Cannot Reproduce**
  - **Genuine self-locating ignorance**: No classroom surrogate mimics amnesia. Sampling approximates the informational state but misses the *phenomenology* of "not knowing who/where you are."  
  - **Final resolution**: The activity shows sampling ⇒ 1/3, but the original problem’s "always awake" clause remains contested.  

  **How to handle (last 10 min):**  
  - **Don’t declare a verdict.** Say:  
    *"Today, when your being awake was uncertain, you saw 1/3 win. But Beauty is always awake. Is her ignorance from amnesia like our sampling? Or is it different? I won’t answer—next week, we debate: Does 1/3 survive without selection?"*  
  - Assign readings for both sides. Highlight:  
    - **Thirder**: "Sampling replicates Beauty’s ignorance: awakenings, not coins, are the trials."  
    - **Halfer**: "No selection in original problem; being awake is guaranteed, so no evidence."  

  ---

  ### **Timeline Summary**
  | **Time** | **Segment** | **Key Actions** |  
  |----------|-------------|----------------|  
  | 0:00–0:05 | Intro | Explain rules, scoring, lab assistant. |  
  | 0:05–0:35 | Stage 1 (12 rounds) | Run rounds; record/pay awake students. |  
  | 0:35–0:40 | Stage 2 rules | Introduce "first awakening" and payment rule. |  
  | 0:40–1:00 | Stage 2 (6 rounds) | Run rounds; pay only "1st" and lab assistant. |  
  | 1:00–1:15 | Stage 3 discussion | Contrast Stage 1 vs. lab assistant; surface objection. |  
  | 1:15–1:30 | Conclusion | Debrief map; prep for next class. |  

  ---
  This design forces students to *live* the disagreement: tokens reward 1/3 in Stage 1, then pivot to 1/2 in Stage 2/lab assistant. The sampling objection emerges naturally, setting up deeper debate. No surrogate fully captures amnesia—but the payout gap makes 1/3 viscerally persuasive.
