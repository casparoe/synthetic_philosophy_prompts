     - **Pragmatist vs. Strong normativist**: Both might endorse institutional labels (e.g., child behavior). *Separating case*: "Senescence in a society that values aging. Is it a disease?" Strong normativist says no (not disvalued); Pragmatist says yes (if institutions intervene).  

  2. **Nodes most likely to cause inconsistent answers (unstable positions)**:  
