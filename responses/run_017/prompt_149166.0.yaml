  Below is the classification instrument structured as a decision tree with exactly ten branch nodes (questions) and eight leaves (positions). The tree is built from the logical space defined by the specified axes, with positions mapped to their commitments and awkward consequences. The primary job of disease ascriptions (explaining symptoms, licensing intervention, excusing/sick role, authorizing resource claims) is integrated as one branch node (Node 9), and each leaf specifies which job the position handles well and poorly. All provided cases are incorporated into the branch nodes as concrete questions. The tree is designed so that students' verdicts on cases lead them to a position without prior theoretical knowledge.

  ### **Decision Tree: Classifying Views on Disease**
  *Instructions: Answer each question based on your intuitive judgment of the case. Work through the tree sequentially, starting at Node 1.*

  1. **Node 1 (Function/Environment)**: Consider a physiological response that does exactly what it was shaped by evolution to do (e.g., conserve salt and water) but, in a high-salt environment, raises blood pressure and shortens life. Is this response a disease?  
     - **Yes** → Go to Node 2.  
     - **No** → Go to Node 3.  

  2. **Node 2 (Harm Evaluation)**: Consider infertility in a person who does not want children and reports no distress. Is this infertility a disease?  
     - **Yes** → Go to Node 4.  
     - **No** → Go to Node 5.  

  3. **Node 3 (Statistical Typicality)**: Consider a trait present in 85% of adults by middle age: painless, reduces oxygen uptake by 12%, and associated with slightly higher lifetime reproductive success. Is this trait a disease?  
     - **Yes** → Go to Node 6.  
     - **No** → Go to Node 7.  

  4. **Node 4 (Species-Typical Harm)**: Consider congenital absence of one kidney: rare, no functional loss if contact sports are avoided, no elevated risk. Is this absence a disease?  
     - **Yes** → Go to Node 8.  
     - **No** → Go to Leaf: **Welfare-based normativist (objective evaluation)**.  

  5. **Node 5 (Autopsy Finding)**: Consider an abnormality discoverable only at autopsy in people who died of unrelated causes, which would never have produced symptoms. Is this abnormality a disease?  
     - **Yes** → Go to Leaf: **Welfare-based normativist (objective evaluation)**.  
     - **No** → Go to Leaf: **Welfare-based normativist (bearer's evaluation)**.  

  6. **Node 6 (Senescence)**: Consider senescence: universal in those who live long enough, progressive, and involving decline in virtually every capacity. Is this a disease?  
     - **Yes** → Go to Node 9.  
     - **No** → Go to Leaf: **Biostatistical naturalist**.  

  7. **Node 7 (Risk Marker)**: Consider a symptom-free 30-year-old with a marker that raises the 10-year probability of a serious event from 1% to 4%. Is this marker a disease?  
     - **Yes** → Go to Node 9.  
     - **No** → Go to Leaf: **Selected-effects hybrid**.  

  8. **Node 8 (Unexplained Symptoms)**: Consider a cluster of disabling fatigue and pain that reliably produces disability, with no identifiable mechanism and normal test results. Is this cluster a disease?  
     - **Yes** → Go to Leaf: **Biostatistical naturalist**.  
     - **No** → Go to Node 10.  

  9. **Node 9 (Primary Job)**: Consider disease ascriptions. Which job is most essential? (Choose one)  
     - **Explaining symptoms** → Go to Leaf: **Forward-looking functional naturalist**.  
     - **Licensing intervention** → Go to Leaf: **Pragmatist/institutional-kind view**.  
     - **Excusing/sick role** → Go to Leaf: **Strong normativist**.  
     - **Authorizing resource claims** → Go to Leaf: **Eliminativist**.  

  10. **Node 10 (Cross-Domain Application)**: Consider mastitis in a dairy cow and rust in a wheat crop. Can the same concept of "disease" apply to both?  
      - **Yes** → Go to Leaf: **Selected-effects hybrid**.  
      - **No** → Go to Leaf: **Eliminativist**.  

