  ### **Leaves (Positions)**
  Each leaf includes: (1) the position's core commitments, (2) one sentence on its most awkward consequence, and (3) which job of disease ascriptions it handles well and poorly.

  1. **Biostatistical naturalist**:  
     - Commitments: Disease requires statistical abnormality (relative to age/sex reference class) and biological dysfunction (reduced survival/reproduction). Harm is evaluated by species-typical life history.  
     - Awkward consequence: Senescence is not a disease despite its harms, as it is statistically typical and universal.  
     - Job handled well: Explaining symptoms (focuses on biological mechanisms).  
     - Job handled poorly: Authorizing resource claims (ignores social context, e.g., may not prioritize treatable conditions if statistically normal).  

  2. **Selected-effects hybrid**:  
     - Commitments: Disease requires a part-level failure of evolved function (selected effect) and harm to the bearer. Harm is evaluated counterfactually (what the bearer would desire if rational/informed). Reference class is species-at-prime.  
     - Awkward consequence: The salt-conservation response in a high-salt environment is not a disease despite shortening life, as the function is intact.  
     - Job handled well: Licensing intervention (justifies treatment when function fails and harm exists).  
     - Job handled poorly: Excusing/sick role (fails to legitimize suffering without clear dysfunction, e.g., unexplained fatigue).  

  3. **Welfare-based normativist (objective evaluation)**:  
     - Commitments: Disease requires the bearer to be worse off based on objective welfare standards (species-typical life history), regardless of personal distress.  
     - Awkward consequence: Infertility is a disease even if unwanted and undistressing, as it objectively reduces reproductive potential.  
     - Job handled well: Authorizing resource claims (aligns with population-level health goals).  
     - Job handled poorly: Excusing/sick role (may impose "disease" labels against bearer's wishes, e.g., unwanted infertility).  

  4. **Welfare-based normativist (bearer's evaluation)**:  
     - Commitments: Disease requires the bearer to feel worse off based on their own evaluation; no dysfunction or typicality required.  
     - Awkward consequence: The autopsy abnormality is not a disease if undiscovered, as it causes no felt harm, even if it would have been lethal later.  
     - Job handled well: Excusing/sick role (centers patient experience).  
     - Job handled poorly: Explaining symptoms (ignores mechanisms, e.g., may not investigate causes of asymptomatic risks).  

  5. **Strong normativist**:  
     - Commitments: Disease is defined by social values (disvaluation) alone; no biological dysfunction, harm, or typicality required.  
     - Awkward consequence: Common traits like reduced oxygen uptake can be diseases if disvalued, even if statistically normal and reproductively neutral.  
     - Job handled well: Excusing/sick role (validates societal norms, e.g., for mental health).  
     - Job handled poorly: Explaining symptoms (often fails to predict or explain biology, e.g., senescent decline may lack a "cause").  

  6. **Pragmatist/institutional-kind view**:  
     - Commitments: Disease ascriptions are context-dependent tools for institutions; they track practical goals (e.g., intervention) rather than biological facts.  
     - Awkward consequence: Child behavior can be a disease only after institutional labeling, even if statistically typical and unchanged biologically.  
     - Job handled well: Licensing intervention (guides treatment efficiently).  
     - Job handled poorly: Explaining symptoms (may label without understanding mechanisms, e.g., unexplained fatigue).  

  7. **Forward-looking functional naturalist**:  
     - Commitments: Disease requires a part-level failure of current causal contribution to survival/reproduction and biological harm. Function is not historical. Harm is evaluated by counterfactual bearer interests.  
     - Awkward consequence: The salt-conservation response in a high-salt environment is a disease despite intact evolutionary function.  
     - Job handled well: Explaining symptoms (links dysfunction to present harms).  
     - Job handled poorly: Authorizing resource claims (overmedicalizes environmental mismatches, e.g., aging in modern contexts).  

  8. **Eliminativist**:  
     - Commitments: No unified property of "disease" exists; the term is a cluster of unrelated concerns (e.g., biological, social).  
     - Awkward consequence: Mastitis and rust cannot share a disease concept, exposing the term's incoherence.  
     - Job handled well: None (rejects all jobs as category errors).  
     - Job handled poorly: All (fails to guide practice, forcing ad hoc use of the term).  

  ---

  ### **Logical Space and Unoccupied Combinations**
  The tree is built from the following axes (with positions mapped):  
  - **Part-level function required?** Yes: Selected-effects hybrid, Biostatistical naturalist, Forward-looking functional naturalist. No: Welfare-based normativists, Strong normativist, Pragmatist, Eliminativist.  
  - **Function defined historically or forward-looking?** Historically: Selected-effects hybrid. Forward-looking: Forward-looking functional naturalist. Neither: Biostatistical naturalist (uses statistical norms, not function).  
  - **Harm required?** Yes: Selected-effects hybrid, Welfare-based normativists, Forward-looking functional naturalist, Biostatistical naturalist (via "dysfunction"). No: Strong normativist, Pragmatist, Eliminativist.  
  - **Harm evaluation:** Bearer's: Welfare-based (bearer). Species-typical: Biostatistical naturalist, Welfare-based (objective). Counterfactual bearer: Selected-effects hybrid, Forward-looking functional naturalist.  
  - **Statistical typicality matters?** Yes: Biostatistical naturalist. No: All others.  
  - **Reference class:** Fixed by theorist: Biostatistical naturalist (age/sex), Selected-effects hybrid (species-at-prime). Irrelevant: Others.  
  - **One property or cluster?** One: All except Eliminativist. Cluster: Eliminativist.  
  - **Primary job:** Integrated as Node 9.  

  **Unoccupied combinations (and why empty):**  
  1. *Function required + historical function + harm not required + statistical typicality irrelevant + bearer evaluation*. Empty because incoherent: Historical function implies objective dysfunction, but harm not required conflicts with dysfunction’s harm-implication (e.g., autopsy abnormality couldn’t be a disease).  
  2. *Function required + forward-looking function + harm not required + species-typical evaluation + statistical typicality matters*. Empty because unattractive: Would pathologize harmless statistical deviations (e.g., one kidney absence) without justification.  
  3. *Function not required + harm required + counterfactual bearer evaluation + statistical typicality matters*. Empty because unexplored: No major theory combines these (e.g., would demand typicality for conditions like infertility, which is atypical but harm-focused).  

