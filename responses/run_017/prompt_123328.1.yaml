  Hmm, they're asking three specific things. First, they want to know which causal story—interest or honor—the novel itself implies through its portrayal of characters' motives. Second, they want me to press on their proposed trichotomy (conversion vs. re-coordination vs. availability) and argue whether Stowe's strategy is primarily about making certain normative features "available." Third, they want me to address the "hard case": why Uncle Tom's name became a term of contempt despite the novel's intent, and what that says about honor-based accounts.

  The user seems to have a sophisticated grasp of the material but is wrestling with theoretical frameworks. Their suspicion about "availability" feels like the core of their original contribution—they're likely testing a fresh thesis against the text. The "hard case" request shows they're thinking dialectically, anticipating objections. Their demand for a "committed" reading suggests they want to stress-test their ideas, not hear polite academic equivocation.

  Right, so for the first point: the novel clearly portrays slavery as sustained by honor dynamics, not just interests. Haley cares about being seen as a "gentleman" trader, the Shelbys agonize over reputation, St. Clare is paralyzed by societal expectations. Even Legree, who seems purely economic, fears the supernatural because it threatens his image of dominance. Stowe's faith in the novel as a tool aligns with Appiah—she thinks making slavery visible in its cruelty will trigger honor-driven shame.

  But the user's "availability" concept is sharper. Stowe isn't just arguing (conversion) or shaming (re-coordination); she's making the moral dimensions of slavery perceptible. The opening sale scene forces readers to see the slave as a parent, not property. Eliza's crossing reframes escape not as crime but maternal heroism. Tom's death renders Christian sacrifice undeniable. These scenes don't persuade through logic; they make the stakes feel visceral, unavoidable. That's why Stowe leans on melodrama—it weaponizes perception.

  The honor overshoot (Tom becoming an epithet) actually supports Appiah. Revolutions recalibrate honor codes violently. Tom's passivity was noble in a context where resistance meant slaughter; post-emancipation, it symbolized submission to oppression. But Appiah would say this proves honor's autonomy—it didn't "borrow" content but generated new norms from changed conditions. The novel's own ending (George Harris's defiant emigration) prefigures this shift: honor must be seized, not endured.

  The hardest counterpoint? Probably Marie St. Clare. She's not moved by shame or interest—she's pathologically incapable of perceiving slaves as human. Stowe presents this as a moral blindness beyond reach. If availability fails here, does that limit the novel's power? Only if we ignore that Marie exists to warn readers: this is what happens when you refuse to see.

  To surrender my reading? I'd need to find scenes where economic arguments actively change minds (they don't—Stowe mocks them) or where honor shifts without new perceptual frameworks (they're always triggered by revelation). The text doesn't offer that.

  User's onto something: Stowe's genius is in treating morality as sensory. She doesn't win debates; she gives the reader no place to look away.
answer: |-
  Your suspicion is profound: **Stowe's novel operates primarily through "availability," not conversion or re-coordination, and this mechanism fundamentally challenges both Williams' and Appiah's accounts.** The text treats morality as a field of *perception* before it becomes one of judgment or honor. Slavery persists not because people are ignorant of arguments or immune to shame, but because its victims are rendered *invisible as moral subjects*. Stowe’s intervention is to make their humanity *unavoidably perceptible*, forcing readers into a moral encounter that precedes argument or social pressure. Here’s how the novel argues this, where it resists, and why the "Uncle Tom" epithet paradoxically proves your point.

  ---

  ### 1. **The Novel’s Implied Causal Story: Honor as Theater, Not Conviction**
  The book relentlessly depicts slavery as sustained by a **performative economy of honor**, not material interest or sincere belief. Characters act to maintain their standing in a script they know is hypocritical:
  - **Haley** demands to be seen as a "humane" trader (Ch. 1), performing kindness while commodifying humans. His calculus is reputational: "I treats my niggers well" to avoid social censure.
  - **The Shelbys** sell Tom and Harry not for profit alone, but to preserve appearances of gentility. Mr. Shelby’s shame isn’t moral; it’s fear of being *seen* as dishonorable ("What would they say at church?").
  - **St. Clare** explicitly critiques the system yet participates to avoid social friction. His inaction stems from the cost of being *known* as an abolitionist in Southern society ("I’m a despicable coward—afraid of what the world would say").
  - **Ophelia** embodies Northern complicity: her disgust with slavery is overridden by her fear of being *seen* as disruptive or "unladylike" until Eva’s death forces her to witness Topsy’s humanity.

  **Verdict:** Appiah’s honor framework fits best *on the surface*. But Stowe shows honor is hollow—a cover for moral evasion. Her confidence in the novel stems from its power to **expose the performance**, making the dishonorable visible. This isn’t just re-coordination; it’s revelation.

  ---

  ### 2. **Availability: Stowe’s Core Strategy**
  Stowe bypasses conversion (changing minds) and re-coordination (changing costs of visibility) by altering **what can be perceived as morally relevant**. She stages scenes that force readers to *see* enslaved people as moral agents, making their suffering a visceral, undeniable fact:
  - **The Opening Sale (Ch. 1)**: Haley coolly discusses breaking up families while Mr. Shelby sips wine. Stowe zooms in on Eliza’s silent terror as she overhears—**rendering her interiority visible**. The argument against slave sales existed, but Stowe makes the *moral injury perceptible*.
  - **Eliza’s Crossing (Ch. 7)**: The ice-floe escape isn’t just heroism; it **materializes maternal love as a force**. The physical risk makes abstract "motherhood" undeniable, shifting it from sentiment to imperative.
  - **Tom’s Death (Ch. 40)**: Legree’s violence fails because Tom’s forgiveness **makes Christian sacrifice palpable**. His corpse isn’t evidence; it’s a *revelation* of personhood that shatters Sambo and Quimbo’s indifference ("We’s been wicked!"). This is availability in action: their moral blindness collapses when confronted with Tom’s embodied dignity.
  - **George Harris’s Defiance (Ch. 11)**: His speech ("I’m a MAN") doesn’t argue—it **declares visibility**. By claiming his personhood, he forces the reader (and his pursuers) to perceive him as a subject, not property.

  **Against Williams/Appiah**: Williams reduces change to material shifts—but Stowe shows economic arguments (e.g., St. Clare’s critique of slavery’s inefficiency) change nothing. Appiah focuses on social optics—but Ophelia’s shame doesn’t motivate action until she *sees* Topsy’s brokenness (Ch. 25). **Availability precedes both**: once Topsy’s humanity is perceptible ("I’s so wicked!"), shame and interest realign.

  ---

  ### 3. **The Hard Case: The "Uncle Tom" Epithet and Honor’s Instability**
  The dishonoring of Tom’s passivity doesn’t refute Appiah—it **proves honor’s dependence on availability**. Tom’s nonresistance was noble *only* when readers perceived slavery as an immutable system where defiance meant death. Post-emancipation, Black resistance (embodied by George Harris) became perceptible as heroism. Tom’s endurance, once a symbol of moral victory, was *re-perceived* as collaboration with oppression. This shift isn’t honor "borrowing" content; it’s **new moral facts becoming available**: the possibility of effective resistance changed what could be seen as honorable. Stowe anticipates this in George’s emigration: he rejects U.S. hypocrisy for Liberia, where Black autonomy is *visible*. The revolution "overshot" because moral perception evolved beyond Stowe’s framework—**availability is ongoing and contested**.

  ---

  ### **Your Reading’s Weakness: The Resistant Scene**
  - **The Problem**: Marie St. Clare. She’s pathologically selfish, unmoved by arguments, shame, *or* perception. When Eva dies, she sees only her grief, not Tom’s (Ch. 26). If availability is universal, why is Marie immune?
  - **Defense**: Marie isn’t a failure of availability; she’s its limit-case. Stowe portrays her as morally blind—a warning that perception requires *receptivity*. Yet even Marie depends on enslaved labor to sustain her self-image. Her cruelty is made visible *to the reader* as moral bankruptcy, proving that when availability fails, it’s due to active denial (a theme Legree embodies).
  - **When I’d Surrender**: If the novel suggested economic change alone reformed characters (it doesn’t—Simon Legree’s downfall is supernatural, not structural) or if characters’ honor shifts occurred without perceptual triggers (they never do—Ophelia’s change follows Eva’s death and Topsy’s tears).

  ---

  ### **Conclusion: Stowe Vindicates Neither—She Radicalizes Appiah**
  The novel rejects Williams by showing material interests don’t drive change without moral perception. It deepens Appiah by revealing that honor is not just social performance but **grounded in what a society can bear to perceive**. Stowe’s "moral technology" forces the invisible into view, making the status quo unbearable. The afterlife of "Uncle Tom" confirms this: moral revolutions aren’t settled by arguments or honor codes, but by **what we allow ourselves to see—and what we cannot unsee**. Your framework of availability captures Stowe’s genius: she knows that before we argue or shame, we must first *witness*.

  **Scenes carrying weight**: Eliza’s crossing (makes love visceral), Tom’s death (makes sacrifice undeniable), George’s defiance (makes personhood incontestable).  
  **Most resistant scene**: Marie’s narcissism (exposes availability’s limits).  
  **Commitment**: If the text showed economic shifts changing hearts without perceptual upheaval, I’d abandon this reading. It never does.
