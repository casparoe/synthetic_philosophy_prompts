  Okay, let me start by unpacking the user's query. They're in a metaphysics seminar and their TA provided a crib sheet on endurance vs. perdurance. The user feels something's off but can't pinpoint it. They want a claim-by-claim analysis, especially about three main points: the argument from temporary intrinsics, whether perdurantism makes change an illusion, and if endurantism requires presentism. Plus, there's this additional problem about temporary parthood they heard about.

  First, I need to address the accuracy of the TA's summary. The user mentioned Lewis's argument from temporary intrinsics. The TA's version says endurantists face a contradiction with incompatible properties. But from what I recall, Lewis's actual point is more about how properties are had. The issue isn't just contradiction but how an object can have different intrinsic properties at different times without relativizing to times. The TA oversimplified here. 

  Next, the claim that perdurantists see change as an illusion. The TA says the worm has straight and bent parts, so no real change. But perdurantists do have an account: change is having temporal parts with different properties. Calling it an illusion is misleading; they redefine change, not deny it. That's a point to correct.

  Then, the endurantism-presentism link. The TA claims endurantism only works with presentism. But that's not true. Eternalist endurantists like Johnston or Lowe argue objects are wholly present at each time in a block universe. So that's a mistake in the crib sheet.

  The user also brought up the "problem of temporary parthood." Hmm, that's interesting. I remember Sider discussing this. It's a separate issue from temporary intrinsics. Endurantists need to explain how parthood can be time-relative, which might be a cost. Perdurantists handle it via temporal parts. So it's a legitimate, independent problem in the literature.

  The user's deeper needs: they're preparing for a seminar, so clarity on these points is crucial. They might be worried about challenging the TA or prof. They need precise corrections to back their understanding. Also, they want to know if the disputes are substantive or verbal. Prof's hint about the debate being verbal—some philosophers like Hirsch think it's verbal, but others like Sider see it as real. The user needs to navigate this complexity for their seminar discussions.

  I should check if the endurantism-perdurantism debate collapses into presentism-eternalism. The TA says yes, but that's incorrect. Both debates are related but distinct. Endurantists can be eternalists, so separating these is key. 

  For the verbal dispute part, I need to explain that while some differences in "part" or "persist" might be terminological, there are substantive issues like how to handle temporary intrinsics and parthood without temporal parts. The user needs to recognize where the real disagreements lie versus where terminology plays a role.

  Lastly, ensuring the user feels confident to question the TA's summary with literature-backed points. Highlighting SEP references and key philosophers (Lewis, Sider, Hawley) will help them. Emphasizing that the problem of temporary parthood is genuine adds depth to their argument.
answer: |-
  Let's dissect that crib sheet claim-by-claim. It contains common oversimplifications and a few significant errors, especially regarding the relationship to presentism and the nature of change under perdurantism. Here's the breakdown:

  **Claim 1:** "Endurantism says that when a thing persists it is wholly present at each moment it exists: at every instant, all of it is there."
  *   **Careful Perdurantist:** Accepts this as the standard definition of endurantism. This *is* the core idea.

  **Claim 2:** "Perdurantism (a.k.a. four-dimensionalism, the worm view) says a persisting thing is a long spacetime object made of temporal parts, only one of which is around at each time, so nothing is ever wholly present at an instant."
  *   **Careful Perdurantist:** Accepts this as the standard definition of perdurantism/four-dimensionalism. The "worm view" is a specific perdurantist model. The consequence ("nothing is ever wholly present at an instant") is precisely why perdurantists say objects aren't *strictly* present at instants – only their temporal parts are.

  **Claim 3:** "Lewis more or less settled this with the argument from temporary intrinsics: an endurantist who is bent at one time and straight at another has to say that the very same object has incompatible intrinsic properties, which is impossible."
  *   **Careful Perdurantist:** Would **wince significantly** and say this misrepresents Lewis's point.
      *   **The Core Issue isn't Simple Incompatibility:** Lewis's point (On the Plurality of Worlds) is subtler. The problem isn't *just* that the object has incompatible properties *simpliciter* (like being both round and square *at the same time*). The problem is how the object can have different intrinsic properties at different times *without relativizing the having of those properties to times*.
      *   **Endurantist Options:** The endurantist *must* say the *very same object* is bent *at t1* and straight *at t2*. Lewis argues that "bent-at-t1" and "straight-at-t2" are not genuine intrinsic properties; they are relations to times. But shapes *are* supposed to be intrinsic! The perdurantist avoids this by saying only the *temporal part* at t1 is intrinsically bent, and the *temporal part* at t2 is intrinsically straight. The whole worm isn't intrinsically bent or straight simpliciter.
      *   **Settlement?** No serious philosopher thinks Lewis "settled" the debate. Endurantists have powerful responses (e.g., adopting "adverbialism" - the object is bent *t-ly* at t1 and straight *t-ly* at t2, or "relationalism" about temporary intrinsics, denying the problem arises).

  **Claim 4:** "The perdurantist avoids this because the shape gets attached to a temporal part, which is genuinely intrinsically bent."
  *   **Careful Perdurantist:** Accepts this as an accurate statement of *their* solution. This *is* the standard perdurantist move.

  **Claim 5:** "Notice the cost, though: on the perdurantist picture nothing ever really changes, since the worm just has a straight bit and a bent bit, and change becomes an illusion."
  *   **Careful Perdurantist:** Would **strongly object** and call this a misunderstanding.
      *   **They Have a Robust Account of Change:** Perdurantists explicitly define change as *variation in intrinsic properties across an object's (non-instantaneous) temporal parts*. The whole worm *changes* by having a bent temporal part followed by a straight temporal part. This is not an "illusion"; it's a reductive analysis of what change *is*. Saying change is an "illusion" on this view is like saying motion is an illusion because a film is just composed of static frames. Perdurantists claim their account *explains* change, not denies it.

  **Claim 6:** "And endurantism only works if you are also a presentist..."
  *   **Careful Perdurantist:** Would say this is **flatly wrong**.
      *   **Endurantist Eternalism is Common:** Many prominent endurantists are also eternalists (e.g., Trenton Merricks, E.J. Lowe, Michael Rea, arguably Lynne Rudder Baker). They hold that the object is wholly present at each moment *within* a spacetime block where past, present, and future equally exist. The object at t1 and the object at t2 are numerically identical, even though t1 and t2 both exist eternally. The challenge for them is explaining numerical identity over time in an eternalist block universe *without* temporal parts, but it's a widely held position, not an impossibility.

  **Claim 7:** "...so this whole dispute is really just the old fight about whether the past and future exist."
  *   **Careful Perdurantist:** Would **strongly reject this reduction**.
      *   **Distinct Debates:** While perdurantism *requires* eternalism (since the "worm" extends through time, requiring past and future times to exist), endurantism is compatible with both presentism and eternalism. Crucially, the core disagreement about *how* an object is located in time – wholly present at each time vs. spread out with temporal parts – persists even *within* eternalism. An eternalist endurantist and an eternalist perdurantist have fundamentally different views of persistence. The debates are deeply interconnected but not identical.

  **On the "Problem of Temporary Parthood":**

  1.  **Is it Genuine?** Absolutely. This is a well-recognized problem in the literature, closely related to but distinct from the problem of temporary intrinsics. Theodore Sider discusses it extensively (e.g., in *Four-Dimensionalism*), and it's a standard topic in metaphysics seminars focusing on persistence.
  2.  **Is it Just Temporary Intrinsics Again?** No, it's a parallel problem focusing on *mereology* rather than *properties*. How can the very same whole object have different parts at different times? For an endurantist, the cat *simpliciter* has a tail at t1 and lacks it at t2. This seems contradictory unless parthood is relativized to time (the tail is part *at t1* but not *at t2*).
  3.  **Does it Add Independent Pressure?** Yes. It highlights that the endurantist needs to relativize not just properties (like shape) but also *relations* like parthood to times to avoid contradiction. This relativization is seen by perdurantists as an unattractive cost – it makes fundamental relations time-indexed. Perdurantists avoid this neatly: the t1-temporal-part has a tail as a spatial part, the t2-temporal-part does not. The whole worm's spatial parts *at a time* are just the spatial parts of its temporal part *at that time*. It provides an additional argument *for* the existence of temporal parts as the entities that bear the "at a time" properties and relations unproblematically.

  **Does the TA's Last Move Survive?**

  *   **No.** Claim 7 ("this whole dispute is really just the old fight...") is incorrect. As explained above, the endurance/perdurance debate is primarily about the *mode* of persistence (wholly present vs. temporal parts), while the presentism/eternalism debate is about the *ontology* of time (only present exists vs. past/present/future exist). While perdurantism requires eternalism, endurantism does *not* require presentism. The debates are distinct, though deeply intertwined. Collapsing them obscures the genuine metaphysical options (like eternalist endurantism) and the core disagreement about parthood and location in time.

  **On the "Merely Verbal" Dispute:**

  Your professor's hint touches on a real and sophisticated meta-philosophical position, prominently argued by Eli Hirsch. The idea is that once we carefully disambiguate the meaning of terms like "object," "part," "persist," and "exists," the disagreement between endurantists and perdurantists dissolves. They are just describing the same underlying reality (the distribution of matter and properties across spacetime) using different linguistic/conceptual frameworks.

  *   **Is it a Serious Point?** Yes, it's a serious and influential challenge. Hirsch argues that perdurantists are just redescribing what endurantists say using temporal parts language, without a substantive ontological difference.
  *   **Is it a Dodge?** Perdurantists like Sider and endurantists like Merricks vehemently argue it *is* a dodge. They contend:
      *   **Substantive Differences Remain:** Even after disambiguation, core disagreements persist. Do temporal parts *really exist* as fundamental entities? Can one and the same *object* (not just "matter") be wholly present at multiple times? These seem like questions about what fundamentally exists and how it is structured.
      *   **Explanatory Power:** Perdurantists argue their view provides a simpler, more unified explanation of persistence, change, parthood, and coincidence (e.g., statue/lump cases) without needing to relativize everything to times. Endurantists argue their view is more intuitive and avoids the ontological profligacy of temporal parts.
      *   **Costs vs. Benefits:** Each side sees genuine, non-verbal costs in the other view (e.g., relativization vs. temporal parts).

  **Conclusion:**

  The crib sheet oversimplifies Lewis's argument, misrepresents perdurantism's account of change (it doesn't make change illusory), and makes the critical error of tying endurantism exclusively to presentism. The "problem of temporary parthood" is a genuine and significant independent argument. The endurance/perdurance debate is *related* to but *not reducible to* the presentism/eternalism debate. While the "merely verbal" challenge is serious and must be addressed, most participants believe there are substantive metaphysical disagreements at stake concerning the nature of objects, parthood, and time itself. Your unease was well-founded; the sheet glosses over crucial nuances and contains significant inaccuracies.
