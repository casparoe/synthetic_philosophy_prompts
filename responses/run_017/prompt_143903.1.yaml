prompt: |-
  Hey — I teach a large intro ethics course (around 400 students, twelve TAs, most of them grad students from other departments who've had one philosophy class between them), and I also write the hypothetical cases that go on the exams. So I knock out maybe thirty short cases a year and then reuse them for years, which means a squishy one keeps doing damage long after I've forgotten why I wrote it.

  What I want is a procedure a TA can run on a case in fifteen minutes, before they teach it, that ends in one of three outputs: keep, fix (with the minimal edit actually specified), or retire. The failure mode they need to catch is a case that looks like it isolates one feature but is really doing its work with something else — a vivid detail nobody notices, an underdescribed bit that every reader fills in with the same default, an outcome that's disgusting rather than wrong, the "and nothing else changes" clause smuggled in without being said. My TAs can't be expected to know any literature, so: no names, no citations, no "it depends on your theory of X."

  One wrinkle I care about: I use these things for two different purposes. Sometimes a case is pure rhetoric — I want the room to *feel* that arrival time can't matter, and I'd happily keep a case that's a bit loaded if it teaches well. Other times I'm using the judgment as evidence, claiming the response actually tracks the distinction rather than the framing. I suspect those want different failure tests, but I want one checklist, not two.

  Three from my folder to run it on: (1) a pharmacist with one leftover dose of a scarce drug, two patients who'd benefit equally, one arrived eleven minutes earlier, the other is a nurse at the same hospital; (2) a lab with de-identified tissue samples, ethics committee approval but no donor consent, which yields a screening test that saves hundreds; (3) two hikers who drop a lit cigarette into identical dry pine needles — one goes out, one burns down a house — meant to pump that our blame tracks luck and so is incoherent. The third one has opened my responsibility unit for six years and I'll be annoyed if it dies.

  Commit to an actual procedure: which tests, in what order, what counts as passing, and where the TA stops and hands it to me because the call is mine. Don't hand me a menu of options.

  Sections, please: "The procedure" (~700 words), "Three cases" (~500 words), "Where it misfires" (~250 words).
reasoning: |-
  Hmm, the user is an ethics professor who teaches a large intro course. They need a standardized procedure for TAs to evaluate hypothetical cases used in exams. The key issues are cases that unintentionally rely on confounding variables like vivid details, unstated assumptions, or emotional reactions rather than the intended ethical principle.

  The user wants a clear procedure with three outputs: keep, fix (with specific edits), or retire. TAs can't be expected to know philosophical literature, so the method must be theory-agnostic. Cases serve two purposes: rhetorical impact (to evoke feelings) or evidence collection (to track genuine distinctions), but the user wants one unified checklist.

  I need to design a procedure with specific steps. Start with the core structure: identify the target feature, then test for confounders. For each case, TAs should:
  1. State the intended ethical feature (e.g., arrival time shouldn't matter)
  2. Check for vivid details by rewriting neutrally
  3. Identify unstated defaults by varying descriptions
  4. Test for disgust vs. wrongness by changing outcomes
  5. Check for hidden "ceteris paribus" by adding minor changes
  6. Assess rhetorical effectiveness for teaching moments

  For the "fix" option, edits should be minimal—e.g., removing loaded words or adding explicit equalizers. "Retire" applies if confounders are irreparable or central to the case.

  Now, apply this to the three given cases:
  1. Pharmacist case: Target is arrival time vs. social value. Vivid detail "nurse" might sway judgments. Fix by making the early arriver neutral (e.g., "a teacher"). Test shows arrival time alone isn't decisive.
  2. Tissue samples: Target is consent vs. beneficial outcomes. Disgust test reveals consent is key. Passes as rhetorical but not as evidence due to default assumptions about harm.
  3. Hikers: Target is moral luck. Varying outcomes shows luck drives blame. Strong for rhetoric and evidence, so keep.

  Misfires could occur if TAs over-edit, weakening cases, or miss subtle confounders. Cases with deep theoretical disputes (e.g., utilitarianism vs. deontology) might need professor input.

  The procedure balances efficiency with thoroughness, using concrete tests instead of theoretical knowledge. It should help TAs catch common pitfalls while respecting the dual purposes of the cases.
answer: |-
  ## The Procedure
  **Time:** 15 minutes per case. **Goal:** Identify if the case inadvertently relies on confounding factors (vividness, defaults, disgust, hidden "ceteris paribus") instead of the target ethical feature. Output: KEEP / FIX (specify minimal edit) / RETIRE.

  **Step 1: State the Target Feature (1 min)**
  *   TA writes down: "This case is meant to isolate/illustrate the ethical relevance of: [X]." (e.g., "arrival time should/shouldn't matter," "consent is/isn't necessary," "blame tracks actual outcome/luck").
  *   **Why:** Clarifies the case's *purpose*; essential for subsequent tests.

  **Step 2: Neutralize Vividness & Loaded Language (3 mins)**
  *   TA rewrites the case *completely*, stripping it to bare-bones facts. Replace proper nouns, professions, evocative words ("scarce," "burn down," "saves hundreds") with neutral placeholders ("Person A," "Object B," "needed resource," "positive outcome," "negative outcome"). Remove all adjectives/adverbs not essential to the core ethical setup.
  *   **Pass/Fail:** Does the *core ethical dilemma* remain clear and focused on the Target Feature? Does the rewritable version feel obviously different (weaker/stronger) ethically?
      *   **Pass:** Core dilemma intact and still plausibly drives the judgment.
      *   **Fail (Fix/Retire):** If the stripped version makes the intended judgment seem nonsensical or irrelevant, the original relied on vividness. *Fix:* Reintegrate *only* the absolute minimum necessary neutral detail to maintain the core structure (e.g., "medical professional" instead of "nurse"). If vividness *is* essential to the core dilemma, it might need retirement for evidentiary use.

  **Step 3: Flip Defaults & Outcomes (4 mins)**
  *   TA performs two quick thought experiments:
      *   **A. Flip Assumed Defaults:** Identify any underdescribed element likely filled by a common default (e.g., "patient" implies sick/deserving, "drug" implies legitimate). Flip the default assumption. (e.g., "The two patients are both convicted felons," "The scarce resource is cosmetic.") How does this change the *intuitive* judgment relative to the Target Feature?
      *   **B. Flip Emotional Outcome:** Change the outcome's emotional valence but keep the *type* of ethical transgression (if any) the same regarding the Target Feature. (e.g., Instead of "saves hundreds," the research "causes minor, temporary discomfort to one person." Instead of "burns down a house," the cigarette "slightly scorches a patch of dirt.") Does the intuitive judgment *about the Target Feature* significantly weaken or reverse?
  *   **Pass/Fail:** Does the intuitive judgment *regarding the Target Feature* remain stable despite these flips?
      *   **Pass:** Judgment is driven by the Target Feature.
      *   **Fail (Fix/Retire):** If flipping defaults/outcomes massively changes or negates the judgment about the Target Feature, the original relied on those elements. *Fix:* Explicitly state the relevant neutral default in the case ("Both patients are equally deserving," "The dry pine needles were on public land with no inherent value beyond fire risk"). If disgust is central to the *only* plausible judgment (e.g., Step 3B flip makes the action seem fine), it likely fails evidentiary use and may need retirement if rhetoric isn't the sole goal.

  **Step 4: Test "Ceteris Paribus" Visibility (3 mins)**
  *   TA identifies the key variable representing the Target Feature (e.g., arrival time, consent status, actual outcome). They then add a *minor, plausible, ethically neutral difference* *elsewhere* that doesn't logically conflict. (e.g., "The patient who arrived earlier has brown hair, the nurse has blonde hair." "One tissue sample was collected on a Tuesday, the other on a Thursday." "One hiker was humming a tune, the other was silent.") Does adding this trivial difference *feel* like it *should* influence the judgment? Does it make the case seem "unfair" or "messy"?
  *   **Pass/Fail:** Does adding a trivial difference feel irrelevant to the *core ethical judgment*, or does it highlight that the case *already assumed* perfect equality elsewhere?
      *   **Pass:** The trivial addition feels irrelevant; the case clearly isolates the Target Feature.
      *   **Fail (Fix):** If adding a trivial difference makes the case feel suddenly unfair or complex, it signals that the original subtly relied on an unstated "all else equal" assumption. *Fix:* Explicitly add a neutral phrase like "and are otherwise identical in all ethically relevant respects" or "and no other factors distinguish them" *after* describing the key differences.

  **Step 5: Dual-Purpose Check (2 mins)**
  *   TA asks:
      1.  **Rhetoric:** Even if Steps 2-4 revealed confounders, does the *original* version powerfully evoke the *feeling* or *intuition* I want students to experience? (Yes/No)
      2.  **Evidence:** Based on Steps 2-4, is the case *clean* enough that a student's judgment can reasonably be interpreted as evidence *for/against* the relevance of **X** (the Target Feature), without being easily explained by confounding factors? (Yes/No)
  *   **Decision Matrix:**
      *   **KEEP:** Passes all Steps 2-4 *or* fails Step 2-4 but passes both 5.1 (Rhetoric) and 5.2 (Evidence). (Rare for evidentiary pass with Step 2-4 fails).
      *   **FIX:** Fails Step 2, 3, or 4 *but* the minimal edit specified in that step seems viable. Passes at least 5.1 (Rhetoric) *or* the TA believes the edit will allow it to pass 5.2 (Evidence). *Specify the exact minimal edit.*
      *   **RETIRE:** Fails Step 2, 3, or 4 *and* the confounder is fundamental/can't be fixed with minimal edits *or* fails both 5.1 and 5.2 *or* TA is unsure after minimal fix attempt. *Hand-off Trigger:* If the TA identifies a potential confounder but the minimal fix seems too drastic, alters the core dilemma, or they are unsure if the fixed version works (especially for evidentiary use), they flag it for the professor with a note: "Potential confounder: [X]. Attempted fix: [Y]. Unsure if sufficient for evidence/rhetoric."

  **Where the TA Stops:** TA makes the KEEP/FIX/RETIRE call *unless* the fix feels too major or they are uncertain the fix resolves the issue for the intended purpose (rhetoric/evidence). Then they hand it to the professor with the specific concern and fix attempt noted.

  ---

  ## Three Cases Run Through the Procedure

  1.  **Pharmacist Case (Target Feature: Arrival time should not be ethically decisive vs. Social Role might be)**
      *   **Step 1:** Target: Arrival time vs. Social Role relevance.
      *   **Step 2:** Rewritten: "Person A needs Resource. Person B needs Resource. Only one dose. Person A arrived slightly earlier. Person B works at the same place Resource is kept." *Pass?* Core dilemma (who gets it?) remains, but "works at the same place" feels weaker than "nurse at same hospital" – potential vividness reliance.
      *   **Step 3A:** Flip Default: "Person B (the worker) is a janitor known to be rude." Judgment might shift away from B. *Fail.* Social role default (nurse=good/deserving) is doing work.
      *   **Step 3B:** Flip Outcome: Neutral. N/A.
      *   **Step 4:** Add Trivial: "Person A has green eyes, Person B has blue eyes." Feels irrelevant? *Pass.*
      *   **Step 5:** Rhetoric: Original evokes intuition arrival time *shouldn't* matter strongly. Evidence: Likely confounded by social role (nurse).
      *   **Verdict:** **FIX.** Minimal Edit: Change "a nurse at the same hospital" to "another individual who works at the hospital in a non-medical role (e.g., administrative staff)" OR "a teacher from the local school." Reduces vivid social value loading while preserving "connection to institution" if needed. (Rhetoric slightly weakened, evidence improved).

  2.  **Tissue Samples (Target Feature: Consent is necessary even for beneficial research)**
      *   **Step 1:** Target: Necessity of consent.
      *   **Step 2:** Rewritten: "Researchers use samples from Source without Source's permission. Research using samples leads to significant benefit." *Pass?* Core dilemma (ok without consent?) remains.
      *   **Step 3A:** Flip Default: "The samples were taken during unnecessary cosmetic procedures the donors deeply regretted." Judgment against use strengthens. *Fail.* Default assumption is donors are neutral/unknowing victims.
      *   **Step 3B:** Flip Outcome: "Yields a minor, non-patentable insight with no practical application." Intuition *against* use weakens significantly. *Fail.* Relies on benefit magnitude.
      *   **Step 4:** Add Trivial: "Some samples were stored in freezer A, others in freezer B." Feels irrelevant. *Pass.*
      *   **Step 5:** Rhetoric: Original powerfully evokes "this feels wrong even with the benefit." Evidence: Highly confounded by assumed harm/violation (default flip) and benefit magnitude (outcome flip).
      *   **Verdict:** **RETIRE for Evidence.** Too confounded. **KEEP for Rhetoric** if the *feeling* is the primary goal in that context. (Hand-off: Professor should confirm if it's only for rhetoric).

  3.  **Hikers (Target Feature: Moral Luck - Blame tracks outcome, not just intention/action)**
      *   **Step 1:** Target: Blameworthiness depends on outcome luck.
      *   **Step 2:** Rewritten: "Person C and Person D both perform identical careless Action near dry flammable Material. For Person C, Action causes no negative outcome. For Person D, Action causes major negative outcome. Are they equally blameworthy?" *Pass.* Core dilemma intact.
      *   **Step 3A:** Flip Default: "The Material belonged to a notorious criminal/enemy." Judgment might lessen blame for D. *Fail?* Slight reliance on default value of property.
      *   **Step 3B:** Flip Outcome: "D's cigarette burns down an abandoned, condemned shed; C's goes out." Blame for D weakens considerably. *Fail.* Relies on significant harm.
      *   **Step 4:** Add Trivial: "C was wearing a red hat, D a blue hat." Feels irrelevant. *Pass.*
      *   **Step 5:** Rhetoric: Original very effectively pumps the intuition that D is *more* blameworthy despite identical actions. Evidence: Some reliance on harm magnitude (Step 3B), but the *differential* blame between C and D based *only* on outcome is still starkly clear. The core luck intuition remains strong.
      *   **Verdict:** **KEEP.** The vividness ("house") and harm magnitude are integral to the *strength* of the intuition pumped, but the *structure* of the luck argument (identical actions, different outcomes, different blame) survives the tests reasonably well for an intro class. The Target Feature is still vividly isolated relative to the students' likely starting intuitions. Minimal Fix (Optional): Add "both areas of dry pine needles were equally hazardous and on similar, unoccupied land" to nail down the "ceteris paribus" regarding risk.

  ---

  ## Where the Procedure Misfires

  1.  **Over-Correction:** The focus on minimal edits and neutralization might strip away *necessary* context for the core dilemma, creating an *under-described* case that's confusing or allows multiple interpretations, defeating the purpose. TAs might err towards retiring cases that could be easily fixed with slightly more context than the bare minimum.
  2.  **Missing Nuance:** While catching obvious disgust or vividness, the procedure might miss subtle framing effects, cultural defaults less obvious to the TA, or implicit assumptions requiring philosophical background to spot (e.g., presupposing a specific theory of value). A case might pass the checks but still subtly nudge judgments in ways the professor didn't intend.
  3.  **Rhetoric vs. Evidence Ambiguity:** The final Step 5 relies heavily on TA judgment about whether a confounded case is still useful for rhetoric. A TA overly focused on "cleanliness" might retire vivid, pedagogically powerful cases that aren't evidentiary. Conversely, a TA swayed by a strong rhetorical punch might miss confounders fatal for evidence.
  4.  **Theory-Laden Targets:** If the Target Feature itself is deeply contested *within* ethics (e.g., "maximizing utility is the only relevant factor"), the procedure won't resolve that. Cases designed to illustrate such features might inherently "fail" Step 3 flips for students holding different foundational views, but this isn't a confounder – it's the pedagogical point. TAs might misclassify this. The procedure works best for isolating *mid-level* features (like consent, role, luck) against *common* intuitive confounders.
  5.  **Time Pressure:** Rigorously applying all steps in 15 minutes is demanding. TAs might rush Step 3 thought experiments or Step 4 triviality checks, missing subtler issues. The process requires focused attention.
