prompt: |-
  hey — I need a case built to order, and the important thing is that the two accounts actually come apart in it, rather than me just stipulating that they do.

  What it's for: a friend keeps telling me that Yudkowsky's coherent extrapolated volition is just the standard idealized-preference story with extra clauses bolted on that never bind. You know the four: knowing more, thinking faster, being more the person we wish to be, and growing up farther together. On his reading the last two are decoration and CEV collapses into something like a Railton/Sobelish package — full relevant information, perfect instrumental rationality, desires made consistent and non-self-defeating, then respect whatever is left. I think that's wrong and I want one case that shows it, for a short blog post.

  The two views to separate:

  - the vanilla one: give the person all relevant information, let her reason perfectly and imagine outcomes as vividly as possible, iron out incoherence and self-defeat among her desires, hold what results fixed, and deliver that.
  - CEV: the target isn't her informed current self but the limit of running her forward — more the person she wishes to be, converging, and (if you use it) the growing-up-farther-together clause.

  The case I want: one ordinary person, nothing science-fictional — no uploads, no sims, no prediction tech, no therapy that doesn't exist — a situation a real adult could be in this year. The vanilla account says: don't push the change, give her what she informedly and coherently wants. CEV says: move her along the trajectory even though she presently declines it. And the disagreement has to be about her own will and her own good, not about what she owes anyone: no dependents, no victim, no kid in the story, because as soon as there's someone she's harming the answer goes moral instead of structural.

  Constraints, and these are the ones I'll check:

  1. Not information. Both views get the same full information. She has no factual error that matters, so knowing more can't be what does the work.
  2. Not coherence. Her actual desires should come out of the info + rationality + consistency pass more or less unchanged. If the only reason the vanilla view gets it wrong is that her desires were self-defeating, the case is cheating.
  3. Not pathology. No addiction, nothing clinical, nothing where we'd independently say she's broken — I want the leave-her-alone answer to be genuinely respectable, the kind of thing a reasonable person would defend.

  The engine I have in mind (use it or beat it): path dependence. The person she'd become is reachable only by actually going through something — months of practice, an apprenticeship, a stretch of living somewhere, a discipline — and the person she is now, even with full information and with the endpoint imagined as vividly as you please, has a real and non-ignorant aversion to starting. From the far side she's glad it happened and would not undo it, and that gladness isn't sunk-cost coping or a shrug. So one view takes a fixed point of her present concerns and the other takes the limit of a path she won't volunteer for. Keep it to a single person unless you think CEV is irreducibly multi-agent — in which case say so and argue it, and then you may lean on the growing-up-farther-together clause.

  What I want back:

  - the scenario, under 250 words, in plain prose rather than bullet points, and concrete enough that I can picture this person's kitchen. If I can't, the case has failed.
  - the check: what each account delivers and why, step by step, including a short argument that constraints 1 and 2 really are inactive in your case, which CEV clause is carrying the weight, and whether the extrapolation in your case actually converges or whether you had to add something to make it converge.
  - the ablation: delete the path dependence — make the endpoint reachable by information, reasoning and vivid imagination alone — and show the two views collapse back into agreement. That's the proof the feature is doing the work.
  - the counterattack: the strongest thing my friend says back. My guess is something like: the person she wishes to be is just one more of her preferences, my machinery runs over it too, so your extra clause is either redundant or it's you overriding her with your own idea of who she ought to be. Tell me how to build the case so that reply hurts, and where it still lands even so.
  - one honest line on what would count as you cheating on this brief, since I'm going to quote it.

  Thanks — and sorry if this is over-specified, I'd rather have something that survives him than something elegant.
reasoning: |-
  We are to construct a case that distinguishes the vanilla account (informed, coherent, fixed-point desires) from CEV (extrapolated volition along a trajectory of growth). The key is path dependence: the subject must not currently want to undergo a change that she would later endorse from a more developed perspective, and this aversion must not stem from ignorance or incoherence.

  **Scenario (under 250 words):**

  Maya is a 40-year-old accountant. She lives alone in a tidy, modern apartment with a kitchen she rarely uses beyond microwaving meals. She has no dependents. Maya is offered an opportunity: a three-month culinary apprenticeship in Italy, all expenses paid. She has full information: she knows she'd learn to cook beautifully, develop confidence, and likely form deep friendships with the chefs. She can vividly imagine the endpoint — her future self cooking for friends, feeling proud and connected. Yet, Maya declines. Her reason: she's deeply uncomfortable with the initial phase — being a novice, making mistakes in front of others, the frustration of learning. This aversion isn't irrational; it's a stable part of her temperament. The vanilla account respects her current informed 'no'. But CEV, invoking "being more the person she wishes to be" (the endpoint self she can imagine but won't choose to become), overrides her present refusal. If forced to go, after the three months, Maya is grateful and wouldn't undo it. Her fulfillment isn't just relief that it's over; it's positive joy in her growth.

  **Check:**

  - **Constraint 1 (Information):** Active? No. Maya has full information about the experience and outcome. She's seen videos, read testimonials, and can vividly imagine the result. The endpoint is as clear as it can be without living it.
    
  - **Constraint 2 (Coherence):** Active? No. Her desires are coherent. She values confidence, skill, and connection. She also values avoiding discomfort and embarrassment. There's no internal conflict to "iron out" — she simply weights the initial costs higher than the long-term gains. The vanilla process leaves her 'no' unchanged.

  - **CEV Clause Carrying Weight:** "Being more the person we wish to be." The endpoint self (confident, skilled, socially connected) is who Maya wishes to be, but she won't choose the path to get there. CEV extrapolates to that endpoint and acts to realize it.

  - **Convergence:** The extrapolation converges because the endpoint is stable: once Maya has gone through the apprenticeship, she endorses the change and doesn't revert. The trajectory is clear — from novice to skilled — and the "wish to be" that person crystallizes at the endpoint.

  **Ablation (Remove Path Dependence):**

  Suppose the endpoint could be achieved without the path — e.g., via a pill that instantly grants the skills, confidence, and social bonds. Now, with full information and vivid imagination, Maya would choose the pill. Both vanilla and CEV endorse giving her the pill. The disagreement vanishes because the aversion (to the learning process) is bypassed. This shows that the path dependence was the key feature creating the divergence.

  **Counterattack (Friend's Reply):**

  Friend: "The 'person she wishes to be' is just part of her current preferences. The vanilla machinery already accounts for it. If she doesn't choose the path, it means she doesn't *currently* wish to be that person enough to outweigh the costs. CEV is just overriding her with an external ideal."

  **How to Build the Case to Withstand This:**

  1. **Emphasize the Endpoint Endorsement:** The case must show that at the endpoint, Maya *retrospectively* affirms the choice as aligned with her *own* will, not an external one. This is key to CEV being internalist.  
     
  2. **Distinguish Current and Extrapolated 'Wish':** Maya *currently* wishes *to be* the skilled version (she admires that self) but doesn't wish *to undergo* the process. The vanilla account only respects the latter (the action-guiding wish). CEV privileges the idealized self-conception that persists and deepens along the trajectory.  

  3. **The 'Gladness' Test:** Post-experience, Maya isn't just 'okay' with it; she actively values the growth and sees it as integral to who she is. This gladness isn't present in the pre-change state, even imaginatively.  

  **Where the Counterattack Still Lands:**  
  Even with this, the friend might argue: "But why privilege the future self's evaluation? The current self is equally 'her'. Forcing her violates autonomy." This is a deep philosophical split. The case must be built so that CEV's move feels like *fulfilling* her own will (via extrapolation) rather than overriding it. The strength lies in the convergence and endorsement from the endpoint.

  **Honest Line on Cheating:**  
  Cheating would be if:  
  - I smuggled in ignorance (she didn't *really* know how good it would be).  
  - I made her aversion irrational (e.g., a phobia) or self-defeating (e.g., she *wants* growth but fears it inconsistently).  
  - I introduced moral obligations (e.g., she *owes* it to herself).  
  - The endpoint wasn't stable (she regrets it later).  
  - I used "growing up together" when not needed, making it multi-agent unnecessarily.

  **Final Scenario Refinement (for Robustness):**  
  Maya is an introverted bookkeeper. Her kitchen is spotless but unused, with expensive appliances still in boxes. The apprenticeship means living in a bustling Italian kitchen, being corrected publicly, and sharing a dorm. She knows it's transformative — she's seen the data on confidence gains, tasted the food, Skyped with alumni. But she says: "I know I'd love the result, but I can't stand being the clueless one for weeks." Post-apprenticeship, she hosts dinner parties in that same kitchen, laughing about her early mistakes. She wouldn't undo it, even to avoid the discomfort.

  This case turns on CEV's temporal extension of will — the "wish to be" is dynamic, not a static preference. The vanilla view freezes her at t0; CEV runs the tape.
answer: |-
  ### The Scenario
  Maya, 42, is a tax consultant who lives alone in a small, meticulously organized apartment. Her kitchen is spotless but sterile—a single coffee mug sits by the sink, and the stove is unused. She’s offered a six-week wilderness survival course: sleeping in a tent, building fires, foraging. She knows everything: the expert instructors, the safety record, the profound confidence and calm graduates describe. She can vividly imagine the endpoint—herself resilient, grounded, at peace in nature. But Maya declines. She’s deeply averse to the discomfort: the cold mornings, the frustration of failing at tasks, the loss of control. This isn’t ignorance or irrationality; it’s a core part of her orderly, risk-averse temperament. If pushed to go, she’d emerge grateful, with a lasting sense of self-trust she’d never undo—not from sunk costs, but from genuine joy in her newfound capability. (Words: 150)

  ### The Check: Why the Views Diverge
  - **Vanilla account delivers:** Respect her "no." After full information (she knows the risks/benefits) and coherence-checking (her desires are consistent: she values safety and control *and* growth, but weights them stably), her informed aversion stands. No change.
  - **CEV delivers:** Push her to go. The "being more the person she wishes to be" clause dominates. Her endpoint self (resilient, calm) is who she *wishes to be* now in ideal terms, but she won’t choose the path. CEV extrapolates along her growth trajectory to that stable endpoint, overriding her current refusal.
  - **Constraints inactive:**  
    1. **Information:** She has all relevant facts (safety, outcomes, alumni testimonials). Imagining the endpoint vividly doesn’t shift her—it’s the *path* she rejects.  
    2. **Coherence:** Her desires aren’t self-defeating. She coherently values growth but weights present comfort higher; ironing out inconsistencies wouldn’t change this tradeoff.  
  - **CEV clause:** "Being more the person she wishes to be" carries the weight. Her endpoint self embodies her idealized self-conception ("wishes to be") better than her current self.  
  - **Convergence:** It converges. The endpoint is stable (she doesn’t regret it), and her "wish to be" that person sharpens along the path, anchored in her core values (e.g., self-mastery).

  ### The Ablation: Removing Path Dependence
  Suppose instead Maya could achieve the endpoint instantly—e.g., a VR simulation that grants the *exact* mental state and skills of completing the course, without the discomfort. Now, with full information and vivid imagination, she’d choose it. Both vanilla and CEV agree: give her the VR. The aversion was solely to the *process*, not the outcome. Without path dependence, the views collapse into alignment, proving it’s the engine of disagreement.

  ### The Counterattack and How to Withstand It
  **Friend’s reply:** "The 'person she wishes to be' is just another preference. If Maya doesn’t act on it now, it’s because her current weighting (comfort over growth) already factors it in. CEV is redundantly privileging a future preference or—worse—overriding her with an external ideal of growth."  

  **Build the case to make this hurt:**  
  - **Make her "wish to be" explicit but impotent:** In the scenario, Maya *explicitly* says, "I wish I were that resilient person," while refusing the path. This shows the "wish" is present but *not action-guiding* in her current psychology. The vanilla view must ignore it as inert, while CEV uses it to fuel extrapolation.  
  - **Emphasize the valuation shift:** Post-course, she doesn’t just "prefer" the outcome; she *re-evaluates* the discomfort as worthwhile *in retrospect*. Her current self can’t access this shift through imagination—it requires lived experience.  
  - **Where it still lands:** The friend exposes a vulnerability: CEV *is* prioritizing a future evaluation over the current one. But the case makes this feel internal (it’s *her* retrospective endorsement) and necessary (without the path, the shift can’t occur). The rebuttal hinges on whether "extrapolated volition" can legitimately discount current aversion when growth is latent.  

  ### Honest Line on Cheating
  Cheating would involve: (1) sneaking in ignorance (e.g., she downplays the benefits due to false beliefs), (2) making her desires self-defeating (e.g., she "wants growth" but her refusal contradicts it), (3) implying pathology (e.g., her aversion is a treatable anxiety), or (4) introducing moral duty (e.g., she "owes" it to herself). I avoided all four—her refusal is coherent, non-clinical, and self-contained.

  ### Final Polish for Your Blog Post
  This case forces your friend to confront CEV’s core: it’s not about static preferences, but about *temporal unfolding* of the self. The vanilla view freezes Maya; CEV animates her trajectory. The kitchen detail (sterile, unused) underscores her current stasis, making the divergence visceral. When your friend says, "But her current preferences already include the ideal!", hit back: "Then why does she refuse the only path to it, despite *knowing* she’ll endorse it later? CEV resolves that tension; vanilla doesn’t try."
