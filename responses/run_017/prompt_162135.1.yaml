prompt: |-
  I'm an undergraduate student member of my university's Senate Committee on International Academic Partnerships. I'm also taking a political-theory seminar this term on democracy and its discontents, which is why I've been asked to draft our decision memo. I'd be grateful for a first-pass draft I can revise before circulation.

  The committee administers the exchange agreement with the University of Maritsa, in the Republic of Maritsa. Clause 7(c) of the standard agreement lets us suspend for "sustained erosion of academic freedom or institutional autonomy" — a phrase the agreement never defines and that the committee has never applied. Please treat the following dossier as stipulated and argue from it, not from comparative cases or literature I can't verify.

  1. In 2021, a parliamentary majority holding two-thirds of the seats, won with 48% of the vote under an electoral system that same majority had rewritten the year before, transferred the public universities into "public interest trusts" whose governing boards are appointed by a minister for nine-year terms and are removable only for cause certified by a newly created audit office.
  2. In 2023, the national accreditation council — now staffed by ministerial appointees — withdrew accreditation from the country's only master's programme in gender studies, citing insufficient labour-market demand. The teaching staff were reassigned.
  3. In 2024, a foreign-influence transparency statute required any department drawing more than 15% of its budget from abroad to register as "foreign-supported" and to file syllabi and reading lists sixty days before term, subject to ministerial objection.
  4. In 2025, the university's independent faculty association was dissolved after failing a representation audit and replaced by an employee association whose officers are elected from a ministry-approved list.
  5. Elections are still held, honestly counted, and contested; turnout is high; two opposition parties hold seats; newspapers remain critical of the government, though most are owned by foundations tied to the governing party. The government won the last election outright with 49% and says it is implementing its manifesto.

  We have two submissions. The Maritsa Faculty Association in Exile — three dismissed professors now visiting fellows in our history department — asks us to suspend and to recognise them as the university's legitimate academic representative. The rector, appointed under the new boards, argues that suspension would punish students, that every measure was enacted by a democratic majority, that each has an analogue in a settled democracy (foundation-governed universities, demand-based accreditation closures, foreign-funding disclosure, union recognition rules), and that a foreign university committee has no standing to grade another state's constitutional order. She adds that our own democracy scores have been falling and that our state legislature has recently restricted what public universities here may teach on contested social questions, so that by our own standard we should suspend ourselves.

  I've circulated a three-part test, and I'd like the memo to use it rather than ignore it. (a) Asymmetric entrenchment: does a change make reversal by a future majority harder than enactment by this one was? (b) The two-audience test: is the measure justified domestically in terms that would not survive being restated to an external or oppositional audience — measurable, I suggested, as the gap between the justification entered in the domestic official register and the one in the ministry's English-language release. (c) The burden-of-proof rule: where a change alters the rules of political competition itself — who votes, who counts, who may organise, who may teach — the burden falls on the incumbent, not on those claiming erosion.

  Please draft the memo addressed to the committee, no more than 1,000 words. It should: recommend exactly one of four actions — unconditional suspension, suspension with conditions, no action with review next year, or referral to an external body — with a time frame and conditions our administrator could actually check; engage the losing side at its strongest, including the "each item has a democratic analogue" argument, the standing objection, and the tu quoque; and tell me where my three-part test does real work, where it distorts the case, and where it merely relabels the dispute.

  After the memo, add a single JSON object with this exact schema:

  - "recommendation": string, one of "unconditional_suspension", "conditional_suspension", "no_action_review", "refer_external"
  - "bottom_line": string, one sentence
  - "time_frame": string
  - "trigger_conditions": array of 3–5 strings, each an observable condition that would impose, lift, or extend suspension
  - "criteria": array of objects, each with keys "criterion" (string), "definition" (string), "applied_to_this_case" (string), "verdict" (string, one of "met", "not_met", "unclear"), "confidence_0_to_1" (number)
  - "my_tests_assessment": object with keys "asymmetric_entrenchment", "two_audiences", "burden_of_proof", each an object with keys "verdict" (string, one of "does real work", "distorts the case", "merely relabels the dispute") and "why" (string)
  - "partisan_label_verdict": string — whether "backsliding" is doing descriptive work here beyond "we lost the vote", and what observable would settle it
  - "who_decides": string — whose assessment deserves deference here, and why
  - "strongest_losing_argument": string — the best available version of the option you are not recommending
  - "tu_quoque_response": string
  - "recognition_of_exile_association": string, one of "recognise", "do_not_recognise", "defer"
  - "confidence_0_to_1": number
reasoning: |-
  We are drafting a decision memo for the Senate Committee on International Academic Partnerships regarding the exchange agreement with the University of Maritsa. The memo must address the provided dossier and apply the three-part test (asymmetric entrenchment, two-audience test, burden-of-proof rule). It must also engage with the strongest arguments from both sides and make a specific recommendation.

  Key facts from the dossier:

  1. 2021: Parliamentary majority (48% of vote, 2/3 seats after changing electoral system) transferred public universities to "public interest trusts" with boards appointed by a minister for 9-year terms, removable only for cause by a new audit office.

  2. 2023: National accreditation council (ministerial appointees) withdrew accreditation from the only master's in gender studies, citing insufficient labour-market demand; staff reassigned.

  3. 2024: Foreign-influence transparency statute requires departments with >15% foreign funding to register as "foreign-supported", file syllabi 60 days in advance subject to ministerial objection.

  4. 2025: Independent faculty association dissolved after failing a representation audit, replaced by an employee association with officers elected from a ministry-approved list.

  5. Elections are honest, high turnout, opposition exists, critical newspapers (though many owned by party-tied foundations). Government won last election with 49%.

  Submissions:

  - Maritsa Faculty Association in Exile (3 dismissed professors) seeks suspension and recognition as the legitimate academic representative.

  - The rector (appointed under new system) argues: 
    - Suspension would punish students.
    - Every measure has an analogue in a settled democracy.
    - Foreign committee has no standing to grade another state's constitutional order.
    - Tu quoque: Our own democracy scores are falling and our state legislature has restricted teaching on contested social issues.

  We must recommend one of:
  - Unconditional suspension
  - Conditional suspension
  - No action with review next year
  - Referral to an external body

  And we must apply the three-part test.

  Applying the three-part test:

  (a) Asymmetric entrenchment: 
  - 2021 change: The electoral system was changed by a simple majority (as it was the same majority that rewrote it the year before) and then used to gain 2/3 majority. The university governance change (public interest trusts) with 9-year terms and removal only for cause by a new body (audit office) makes reversal harder. A future majority would need to overcome the entrenched board structure and possibly the audit office, which is controlled by the current government. This asymmetry is clear.

  (b) Two-audience test:
  - For the accreditation withdrawal: Domestically, it was justified as "insufficient labour-market demand". But internationally, this might be seen as targeting a specific discipline (gender studies) for political reasons. The gap between the domestic justification and the international audience is measurable: the ministry's English-language release would likely repeat the labour-market rationale, but without addressing the political context. Similarly, the foreign-influence law is presented as "transparency" domestically, but to an external audience, it looks like control over academic content.

  (c) Burden-of-proof rule:
  - The changes in 2021 (governance), 2024 (foreign influence law), and 2025 (faculty association) alter the rules of political competition and academic freedom. The burden is on the incumbent to show these changes do not erode academic freedom. They have not met this burden. Instead, they point to analogues in other democracies, but without addressing the cumulative effect and the context of asymmetric entrenchment.

  Recommendation:

  We are considering suspension under Clause 7(c) for "sustained erosion of academic freedom or institutional autonomy". Given the dossier and the application of the test, we find that the erosion has occurred and is sustained.

  However, the rector's argument that suspension would harm students is valid. Also, the tu quoque argument (our own issues) is a concern for standing, but we must focus on Maritsa.

  Given that, we might consider conditional suspension, with conditions that, if met, would lead to lifting the suspension. But what conditions?

  Conditions could be:
  - Restoration of independent faculty association.
  - Reversal of the accreditation withdrawal for the gender studies program (or independent review).
  - Amendment of the foreign-influence law to remove the requirement for pre-approval of syllabi.

  But the rector argues that each measure has an analogue in a settled democracy. However, the cumulative effect and the context of entrenchment are critical.

  The strongest argument against suspension is the standing objection: we are a foreign committee and should not grade another state's constitutional order. However, the agreement (Clause 7(c)) explicitly allows suspension for erosion of academic freedom, which is a core value of our partnership. We are not grading the entire constitutional order, but the specific conditions for academic freedom and institutional autonomy that are part of the agreement.

  The tu quoque argument: Our own state legislature has restricted teaching on contested social issues. But our restrictions (while concerning) are not at the same level of entrenchment and cumulative effect. Moreover, our committee's role is to assess our partners, not ourselves. We can note that the same standards we apply to others we should apply to ourselves, but that does not prevent us from acting on this agreement.

  Given the sustained erosion (four incidents over five years) and the application of the test, we recommend conditional suspension. The conditions should be specific and observable.

  Time frame: Suspension to take effect immediately, with review in one year.

  Conditions for lifting suspension (trigger conditions):
  1. The independent faculty association is reinstated or a new independent association is allowed to form without ministry-approved lists.
  2. The foreign-influence transparency statute is amended to remove the requirement for ministerial pre-approval of syllabi and reading lists.
  3. The gender studies program is re-accredited or an independent accreditation review (by an internationally recognized body) confirms the withdrawal was non-political.

  If these conditions are met within one year, suspension is lifted. If not, suspension continues until the next review (which could be set for another year).

  We do not recommend referral to an external body because the dossier is clear and the committee has the expertise. Also, the agreement is our responsibility.

  Recognition of the exile association: We should not recognise them as the legitimate academic representative because that would be an internal matter for the University of Maritsa. We can note their concerns but defer to the faculty at the university for representation.

  Now, for the memo structure:

  - Introduction: Purpose and background.
  - Summary of dossier and submissions.
  - Application of the three-part test.
  - Analysis of the arguments (including standing and tu quoque).
  - Recommendation and conditions.
  - Conclusion.

  Word limit: 1000 words.

  After the memo, the JSON object.

  Let's draft the memo.
