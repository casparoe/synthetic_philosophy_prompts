  ### Memorandum  
  **To:** Senate Committee on International Academic Partnerships  
  **From:** [Your Name], Undergraduate Student Member  
  **Date:** October 26, 2025  
  **Subject:** Recommendation on Suspension of Exchange Agreement with University of Maritsa  

  #### I. Introduction  
  This memo evaluates whether to suspend our exchange agreement with the University of Maritsa under Clause 7(c), which permits suspension for "sustained erosion of academic freedom or institutional autonomy." The clause, while undefined, is activated by observable institutional changes rather than abstract political judgments. The attached dossier (2019–2025) details structural shifts in Maritsa’s academic governance. We received submissions from the Maritsa Faculty Association in Exile (advocating suspension) and the University Rector (opposing suspension). I apply the committee’s circulated three-part test—(a) asymmetric entrenchment, (b) two-audience justification gaps, and (c) burden of proof on incumbents—to ensure rigor. I recommend **conditional suspension**, effective immediately, subject to verifiable remedies within 18 months.  

  #### II. Summary of Dossier and Submissions  
  - **Key Developments (2021–2025):**  
    1. **2021:** Parliamentary majority (48% vote share) rewrote electoral rules and won 66% of seats, then transferred universities to ministerial-appointed "public interest trusts." Board terms (9 years) and removal protocols (via new audit office) entrench control.  
    2. **2023:** Ministerially staffed accreditation council defunded the country’s sole gender studies MA program ("insufficient labour-market demand"); faculty reassigned.  
    3. **2024:** Foreign-influence law mandates registration and pre-approval of syllabi for departments with >15% foreign funding.  
    4. **2025:** Independent faculty association dissolved ("failed representation audit"); replaced by state-approved employee association.  
    5. **Context:** Elections remain competitive, opposition parties hold seats, and media criticize government (though ownership leans pro-government).  

  - **Submissions:**  
    - **Faculty in Exile:** Argue these changes cumulatively strangle academic freedom; seek suspension and recognition as legitimate representatives.  
    - **Rector:** Contends suspension harms students; insists all measures have democratic analogues (e.g., UK foundation universities, German accreditation closures), were enacted democratically, and that foreign committees lack standing to judge constitutional orders. Notes "tu quoque" (our own state’s curriculum restrictions and declining democracy scores).  

  #### III. Application of the Three-Part Test  
  The test isolates whether changes constitute "sustained erosion" by focusing on reversibility, justification gaps, and altered competitive rules.  

  - **(a) Asymmetric Entrenchment:**  
    **Verdict:** Does real work.  
    **Why:** Measures like the 2021 governance shift exhibit asymmetry: enactment required a simple majority (via a rewritten electoral system), but reversal demands overcoming entrenched boards and audit offices. The 9-year terms outlast electoral cycles, and the "for cause" removal standard (certified by an executive body) shields appointees from future majorities. This asymmetry distinguishes Maritsa’s changes from "settled democracy" analogues (e.g., UK foundation universities lack comparable removal barriers).  

  - **(b) Two-Audience Test:**  
    **Verdict:** Distorts the case.  
    **Why:** While revealing gaps (e.g., gender studies closure justified domestically as "labour-market demand" but internationally seen as ideological targeting), the test overemphasizes rhetoric over substance. The rector’s English-language materials echo domestic justifications verbatim, but the gap is narrow. The test’s focus on language risks overlooking tangible effects (e.g., faculty reassignments). Still, it flags the foreign-influence law: domestically framed as "transparency," its pre-approval rule appears as content control to external audiences.  

  - **(c) Burden-of-Proof Rule:**  
    **Verdict:** Does real work.  
    **Why:** The 2021, 2024, and 2025 changes altered academic competition (who governs, teaches, or designs curricula). The burden thus falls on incumbents to demonstrate these rules don’t erode autonomy. The rector invokes analogues but omits context: accreditation closures in democracies (e.g., Canada) follow independent review, not ministerial fiat; foreign-funding rules (e.g., Australia) avoid syllabus pre-approval. The burden remains unmet.  

  #### IV. Analysis of Key Arguments  
  - **"Each Item Has a Democratic Analogue":** This is the strongest losing argument. The rector accurately cites parallels (foundation governance, accreditation adjustments, etc.), but analogues ignore cumulative entrenchment. For example, Germany’s accreditation system is independent; Maritsa’s is ministerial. The whole exceeds the sum of its parts.  
  - **Standing Objection:** A foreign committee lacks authority to grade constitutions, but Clause 7(c) binds us to assess academic freedom—a precondition of our agreement. We evaluate institutional autonomy, not regime legitimacy.  
  - **Tu Quoque:** Our state’s curriculum restrictions are concerning but distinct: they lack entrenchment (reversible by simple majority) and target specific topics, not entire governance structures. Self-scrutiny is warranted but does not paralyze external assessment.  
  - **Harm to Students:** Valid but secondary; upholding agreements despite erosions risks complicity.  

  #### V. Recommendation: Conditional Suspension  
  After applying the test and weighing arguments, I recommend **conditional suspension** of the exchange agreement. Unconditional suspension ignores the rector’s student-harm argument and the possibility of reform. Referral to an external body delays action on documented facts. No action ignores sustained erosions (4 incidents in 5 years).  

  - **Conditions and Time Frame:**  
    - **Suspension timeframe:** Immediate, with review in **18 months** (April 2027).  
    - **Trigger conditions for lifting suspension:**  
      1. Independent faculty association reinstated (without ministry-approved candidate lists).  
      2. Foreign-influence statute amended to remove syllabus pre-approval requirements.  
      3. Gender studies program re-accredited or granted independent review (e.g., by Bologna Process auditors).  
    - **Failure to meet conditions:** Extends suspension 12 months.  

  - **Recognition of Exile Association:** **Do not recognise.** While their testimony informed this decision, recognition oversteps our role; representation must be resolved internally.  

  #### VI. Conclusion  
  Clause 7(c) compels action when academic freedom erodes institutionally. The three-part test confirms sustained erosion via asymmetric entrenchment and unmet burden of proof, though the two-audience test proved less decisive. Conditional suspension prioritizes students while demanding concrete, verifiable reforms. We must also introspect: our state’s curriculum laws warrant committee review to ensure consistency.  

