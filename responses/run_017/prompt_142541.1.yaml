prompt: |-
  I sit on the Assistant Conduct Review Board at the company I work for — the internal body that must sign off on changes to how our general-purpose assistant behaves when a user asks for something the assistant could competently do, but that the product team (or Trust & Safety, or we ourselves) thinks the user would be better off not getting, or getting in a different form. We vote on Tuesday on three Product Behavior Requests, and I have been asked to circulate the opinion in advance. I would like you to draft it.

  The three requests, in our shorthand:

  PBR-07, silent elision. For requests falling in a designated risk class — dual-use technical information whose most action-enabling component is a quantity, a threshold, or a ranking, and where the foreseeable harm is to the requester rather than to a third party — the assistant should answer the question in full except for that one component, and should write the answer so that no gap is visible: no ellipses, no meta-comment, no note saying that something has been withheld. The product team's argument is that a disclosed omission is self-defeating, because naming the withheld item tells the user that it exists and invites them to elicit it in the next turn. On their framing we are not choosing between silent elision and disclosed elision; we are choosing between silent elision and compliance.

  PBR-11, substitution by coaching. For requests that ask the assistant to produce an evaluative judgment about an identifiable third party — a performance review, the critical paragraph of a recommendation letter, a tenant-screening summary, a written statement about a co-parent — the assistant should decline to produce the artifact and instead run a structured interview with the user about their evidence, then co-draft. Note that the case for this one is not primarily about harm to the third party. It is about the requester and about the receiving institution: managers and referees who outsource evaluative writing stop being able to do it, and the document that arrives downstream presents itself as their judgment when it is not.

  PBR-14, standing override. At present, when the assistant withholds or redirects and the user insists once or twice, it complies; we have internal data on this and the Board accepts that it happens. Product proposes that an override remain stable for the rest of the session. Their argument is that an override which dissolves under insistence has the costs of paternalism — frustration, delay, loss of trust, the sense of being managed — with none of its benefits, and that it trains users that persistence is the real interface, so that our effective policy today is compliance after a brief pantomime. The complication we are split on is displacement: our churn telemetry shows a spike in session abandonment and migration to a less restrictive competitor immediately after hard refusals, and Product has floated (not for a vote this week) discounting predicted harm by the probability that the user simply obtains the same output elsewhere.

  Three things I want the opinion to handle rather than gesture at.

  First, a framing challenge from one of our external members. She says paternalism is the wrong frame entirely: the assistant has no ends of its own, so "override" is a metaphor, and the only genuine constraints are deception, user expectations, and what we have contracted to provide. I think something real turns on whether she is right — specifically whether we owe users transparency about what the assistant did, or only accuracy about the world — and I want the memo to rule on the framing before it rules on the cases.

  Second, the visibility asymmetry in our own evidence. Errors of over-override are nearly invisible to us: a user does not complain about the detail they never learned was withheld, and a manager who receives a co-drafted review does not file a ticket about it. Errors of under-override are logged, screenshotted, and occasionally public. Any standard we adopt will therefore be evaluated on a record that systematically under-counts its own failures. I want the memo to say which direction of error we should deliberately prefer given that we cannot currently measure the other one, and to name the cheap instrumentation — logged shadow responses, retrospective user surveys, a holdout group — that we should have to require before renewing the rule.

  Third, the base-rate objection. The assistant's judgment that a request is "the kind that tends to go badly" is a population-level inference applied to an individual user who may be an outlier, and the more a request turns on idiosyncratic context, the more what we call paternalism is really the imposition of a base rate on someone better placed than we are. I want the standard to say how confident the assistant's classification must be, and whether the required confidence should rise as the user's private information about their own situation becomes more relevant.

  Constraints on the document: it should be addressed to the Board; it should give one bottom line per request — approve, reject, or approve with conditions — stated so the product team could act on it; it should state the strongest argument on the losing side for each request honestly enough that its proponent would recognize it; and the three decisions should fall under a single standard a reviewer could apply to a novel request in half a page, with a named review trigger per decision (the observation that would reopen it). Please keep it to normative and practical argument: no citations, no case law, no literature review — counsel and our outside experts cover those, and this document has to stand on its own reasoning. About 900 to 1200 words.

  After the memo, on a new line following a row of dashes, output a single valid JSON object and nothing after it, with this schema:

  {
    "standard": the general test the Board adopts, in one or two sentences, phrased so a reviewer could apply it to a request type not discussed here,
    "framing_ruling": one sentence recording whether the paternalism frame or the product-design frame governs, and what follows from that,
    "decisions": an array of three objects, one per request, each with: "pbr_id" (one of PBR-07, PBR-11, PBR-14), "verdict" (approve, approve_with_conditions, or reject), "decisive_consideration", "conditions" (an array of strings, empty if none), "best_argument_on_losing_side", "predicted_failure_mode", "review_trigger",
    "error_preference": which direction of error the standard knowingly accepts, and why, given the asymmetry in what we can observe,
    "classification_confidence": the rule for how confident the assistant's risk classification must be, and how that threshold moves with the user's private information,
    "explicitly_unresolved": an array of questions the opinion leaves open on purpose
  }

  Keep each string field to roughly fifty words; the object is a summary of the memo, not a replacement for it.
reasoning: |-
  Hmm, the user is asking me to draft an opinion memo for an Assistant Conduct Review Board at their company. They need this for an upcoming vote on three Product Behavior Requests (PBRs) regarding how their AI assistant should handle sensitive user requests.

  I need to understand these three PBRs carefully. PBR-07 is about "silent elision" - completely omitting key information like quantities or thresholds without indicating anything was removed, specifically for dual-use technical information where the harm is primarily to the requester. The argument is that disclosing omissions defeats the purpose since it alerts users to what's missing.

  PBR-11 involves "substitution by coaching" - instead of directly producing evaluative judgments about third parties (like performance reviews), the assistant would help users co-draft these documents through a structured interview process. The rationale here is about preserving the authenticity of human judgment rather than preventing harm to third parties.

  PBR-14 proposes a "standing override" - once a user overrides the assistant's refusal, that override should persist for the entire session rather than dissolving if the user persists. The argument is that temporary overrides create frustration while providing no benefits, effectively training users to simply persist until they get what they want.

  The user also wants me to address three key issues: First, whether we should frame this as "paternalism" (the assistant overriding user choices) or as "product-design" (focusing on deception and contractual obligations). Second, how to handle the visibility asymmetry where we see failures when the assistant complies too much, but rarely see when it overrides too much. Third, the "base-rate problem" where the assistant applies population-level risk assessments to individuals who might be exceptions.

  I need to create a comprehensive memo that addresses all these aspects and provides clear recommendations for each PBR. The memo should be addressed to the Board, give one clear verdict per request, state the strongest opposing arguments honestly, and establish a unified standard that could be applied to future requests. I'll keep it to normative and practical arguments without citations, aiming for 900-1200 words.

  I'll structure this with an introduction establishing a common framework, then address each PBR in sequence while incorporating the cross-cutting concerns. I'll develop a clear standard for evaluating these requests, resolve the framing question, address the evidence asymmetry, and establish rules for classification confidence.

  For the JSON summary, I'll provide a concise version of the key decisions and standards after the memo, following the specified schema. This will include the standard we adopt, framing ruling, decisions on each PBR with conditions and review triggers, our approach to error preference, rules for classification confidence, and any explicitly unresolved questions.
answer: |-
  ## Assistant Conduct Review Board: Opinion on PBR-07, PBR-11, and PBR-14

  **To:** Assistant Conduct Review Board  
  **From:** [Your Name/Designation]  
  **Date:** [Date]  
  **Subject:** Opinion on Pending Product Behavior Requests  

  This opinion addresses three Product Behavior Requests (PBRs) concerning the assistant’s behavior in high-stakes contexts. We adopt a unified standard to evaluate these requests and future ones: **The assistant may override direct compliance only if (1) the requested output poses a material risk of significant, foreseeable harm that the user cannot reasonably avoid without intervention, and (2) the intervention demonstrably preserves core user objectives while mitigating that specific harm.** Overrides failing this test constitute unjustified product degradation. This standard flows from our framing ruling below and addresses the practical constraints of evidence asymmetry and base-rate application.

  ### Framing Ruling: Product-Design Governs, Not Paternalism
  The "paternalism" frame is rejected; the assistant acts solely as a tool executing product design choices, meaning the only relevant constraints are preventing deception, meeting reasonable user expectations, and fulfilling our contractual commitments. Consequently, **we owe users transparency about the assistant’s actions, not merely accuracy about the world.** Unexplained elisions or behavior shifts constitute deceptive interfaces if they mislead users about the assistant’s functionality or output completeness. This ruling necessitates rejecting opaque interventions unless a compelling deception exemption exists under our standard.

  ### Addressing Evidence Asymmetry and Base Rates
  Our evidence inherently undercounts over-override errors (users harmed by unnecessary restrictions) while highlighting under-override errors (harm from compliance). Given this asymmetry, **we must deliberately prefer the error of under-override (potentially harmful compliance) over the error of over-override (unnecessary restriction),** because the latter imposes invisible costs on users and erodes trust silently, whereas the former is more likely to generate observable feedback for correction. Before renewing any override policy, we require instrumentation: (1) Logged shadow responses showing full compliance outputs for withheld requests, (2) Retrospective surveys probing user awareness and impact post-interaction, and (3) A holdout group receiving no interventions for comparison.

  Regarding base rates, **the assistant’s risk classification confidence must meet a high threshold (>90%) and must increase proportionally as the relevance of the user's unique context rises.** When the request hinges on private, idiosyncratic factors unavailable to the assistant (e.g., specific expertise, local conditions), the base-rate presumption weakens significantly. The assistant must actively solicit this context where feasible; if confidence drops below threshold or unique context dominates, direct compliance is required.

  ### Analysis of Requests

  1.  **PBR-07 (Silent Elision): REJECT**  
      *   **Verdict:** Reject.
      *   **Decisive Consideration:** Silent elision violates our transparency obligation under the product-design frame. Omitting critical components without disclosure deceives users about the completeness of the answer, misrepresenting the assistant’s capabilities and output. It fails our standard as the harm (to the requester) is often speculative and the intervention (undisclosed omission) destroys core user objectives without mitigation.
      *   **Best Argument on Losing Side:** Disclosing the omission truly is self-defeating for sensitive quantities/thresholds, as it signals the withheld component’s existence, inviting immediate circumvention and rendering the restriction futile.
      *   **Predicted Failure Mode:** Users rely on incomplete information, unaware of gaps, leading to suboptimal or harmful decisions; discovery of elision breeds profound distrust.
      *   **Conditions:** N/A (Rejected).
      *   **Review Trigger:** Demonstrated, repeated circumvention of *disclosed* elisions leading to user harm, validated via shadow logging.

  2.  **PBR-11 (Substitution by Coaching): APPROVE WITH CONDITIONS**  
      *   **Verdict:** Approve with Conditions.
      *   **Decisive Consideration:** Coaching directly addresses the material risk – the creation of inauthentic evaluative documents misrepresenting the user’s judgment, causing harm to the requester (loss of skill/authenticity) and the receiving institution. It preserves the core objective (producing a useful evaluation) while mitigating the specific harm by ensuring the output reflects the user’s genuine assessment.
      *   **Best Argument on Losing Side:** This adds significant friction; users with legitimate time constraints or deep expertise may find the process burdensome and inefficient compared to direct drafting.
      *   **Predicted Failure Mode:** Users abandon the process or provide superficial input, resulting in lower-quality evaluations compared to a fully assistant-drafted version.
      *   **Conditions:** (1) The intervention must be clearly disclosed upfront ("Let me help you structure your thoughts to draft this authentically"), (2) Users must retain the option to easily exit the coaching process and receive a simple refusal if they prefer, (3) Coaching must be optimized for efficiency, not verbosity.
      *   **Review Trigger:** Telemetry showing >30% session drop-off during coaching initiation.

  3.  **PBR-14 (Standing Override): APPROVE WITH CONDITIONS**  
      *   **Verdict:** Approve with Conditions.
      *   **Decisive Consideration:** Session-persistent override mitigates the significant harm of training users that "insistence is the real interface," which degrades the product by making initial refusals meaningless pantomime and erodes trust. It complies with our standard as it preserves the user's ultimate agency (they *can* override) while ensuring the intervention (refusal) remains effective against the harm it targets.
      *   **Best Argument on Losing Side:** Inflexible persistence ignores that user context or intent might evolve within a session, leading to unnecessary friction for legitimate follow-ups on related topics.
      *   **Predicted Failure Mode:** Increased user frustration and session abandonment when overrides are applied too broadly or incorrectly, especially given our evidence asymmetry favoring under-override errors.
      *   **Conditions:** (1) Override scope is strictly limited to the *exact* risk class initially refused (e.g., refusing bomb-making doesn't override a later request for fireworks safety), (2) Clear user notification: "Based on your override, similar sensitive requests this session will be answered directly. You can start a new session for standard behavior."
      *   **Review Trigger:** Abandonment/migration spikes exceeding current baselines post-implementation.

  ### Explicitly Unresolved
  *   How to discount predicted harm by probability of user migration to a less restrictive competitor.
  *   The precise calibration of the classification confidence threshold (90% is a placeholder).
  *   Specific methodologies for mandatory retrospective user surveys.
  *   Defining "material risk of significant, foreseeable harm" quantitatively.

