prompt: |-
  Suppose I need a theory of well-being whose output could be fed into a cost-effectiveness calculation: one interpersonally comparable quantity per person-year, aggregable across a population by someone allocating a fixed public budget. Before I look at candidate theories I want the specification.

  Write the desiderata such a theory has to meet. For each, give the case or consideration that motivates it, and mark whether it is non-negotiable for this purpose or merely a preference of one camp. Cover at least: what the theory must say about the familiar experience-machine case, and about a variant in which the subject's actual projects are being carried out successfully in the world by an agent she authorized, while she is truthfully informed of this inside the machine — does its verdict shift, and should it; how it must treat a subject whose hedonic set-point has permanently shifted, upward or downward, given that self-report is the only instrument available at population scale; whether duration and intensity trade off on one scale, and whether the theory is permitted to return incomparability rather than equality; and what it owes us when one person's gain is another's loss.

  Then flag any subset of the requirements you take to be jointly unsatisfiable — I suspect deference to a subject's own considered judgment, correction for adaptation and for misinformation, and measurability by self-report cannot all be held at once, and I want to know whether the conflict is real or an artifact of how I phrased them. Say which single requirement does the most work in excluding candidates. Keep the scorecard for hedonism, desire-satisfaction, and objective-list views to one line apiece; the criteria are the part I care about.
reasoning: |-
  Okay, let me start by unpacking the user's query. They need a theory of well-being that outputs a single, comparable quantity per person-year for cost-effectiveness analysis in public budget allocation. The main goal is to specify the desiderata such a theory must meet, addressing specific cases and potential conflicts.

  First, I need to list the core requirements. The user mentioned several key points: the experience machine, its variant, hedonic set-point shifts, trade-offs between duration and intensity, incomparability, and interpersonal gains/losses. Plus, they suspect conflicts between deference, adaptation correction, misinformation correction, and measurability by self-report.

  Starting with the experience machine. Nozick's case challenges hedonism by suggesting we value reality over mere experiences. The theory must reject the machine, so that's a non-negotiable constraint. Then the variant where the subject's projects are fulfilled externally. If the theory still rejects it, that might align with objective-list views; if it accepts, desire-satisfaction might fit. But the user wants to know if the verdict should shift. That's tricky. Maybe it depends on whether actual world engagement is essential.

  Next, hedonic set-point shifts. If someone adapts to a lower baseline, self-reports might not reflect true well-being. The theory needs to correct for adaptation but self-report is the only tool. Conflict here: correction vs. measurability. Deference to the subject's judgment might clash if they report high well-being despite objective deprivation.

  Duration and intensity trade-offs: must be a single scale without incomparability. Cost-effectiveness requires aggregation, so no room for incomparability. This rules out theories that can't quantify different aspects of well-being.

  Interpersonal gains/losses: the theory shouldn't require equity considerations, as that's handled downstream. But it must provide comparable units. 

  Now, the suspected conflict: deference, adaptation correction, misinformation correction, and self-report measurability. If the theory defers to the subject's judgment, but needs to correct for adaptation (e.g., someone in poverty reports high well-being), that requires overriding their self-report. But if self-report is the only measure, how can you correct without additional data? Misinformation correction adds another layer. So yes, these are jointly unsatisfiable with self-report alone. The key conflict is between needing accurate data and lacking instruments beyond self-report.

  The most excluding requirement? Probably the "Measurable by Self-Report at Scale" because it forces reliance on subjective data, which conflicts with correction needs.

  For the scorecard: Hedonism might fail on the experience machine and adaptation correction. Desire-satisfaction could handle the variant machine but struggle with misinformation. Objective-list might conflict with self-report measurability and deference. Each has trade-offs against the desiderata.
answer: |-
  Here is a specification of desiderata for a theory of well-being suited for public cost-effectiveness analysis, addressing your specific cases and concerns:

  **Core Non-Negotiables (Essential for the Function):**
  1.  **Quantifiable & Cardinal:** Must output a single, cardinal number (or cardinal utility function) per person-year.
      *   *Motivation:* Cost-effectiveness analysis (CEA) requires aggregating benefits across individuals and comparing marginal gains per unit resource. Ordinal rankings or vague concepts (like "flourishing") are insufficient.
      *   *Status:* **Non-negotiable.**
  2.  **Interpersonally Comparable:** The numerical output must be meaningfully comparable *across different individuals*.
      *   *Motivation:* Allocating a fixed budget between different people/groups requires knowing if $X spent on Person A yields *more well-being* than $X spent on Person B.
      *   *Status:* **Non-negotiable.**
  3.  **Linearly Aggregable:** The total social welfare function must be the (unweighted or equitably weighted) *sum* of individual well-being values.
      *   *Motivation:* Standard CEA sums QALYs/DALYs/etc. Non-linear aggregation (e.g., prioritizing the worst-off intrinsically) belongs to the *equity weighting* stage *after* well-being measurement, not within the core theory.
      *   *Status:* **Non-Negotiable.**
  4.  **Defined for All Relevant States:** Must assign a value (including potentially negative values) to any state a person could be in within the policy domain (health, poverty, education outcomes, etc.).
      *   *Motivation:* CEA must evaluate diverse interventions.
      *   *Status:* **Non-Negotiable.**
  5.  **Duration-Sensitive:** Well-being must be a function of duration (e.g., person-years). Double the duration (at constant intensity) should double the total well-being.
      *   *Motivation:* Resource allocation inherently involves trade-offs between helping more people for shorter times vs. fewer for longer times.
      *   *Status:* **Non-negotiable.**

  **Substantive Desiderata (Motivated by Philosophical/Behavioral Considerations, Often Negotiable Trade-offs):**
  6.  **Response to Experience Machine (EM):**
      *   *Requirement:* Must reject the standard EM (subject is deceived, has no real-world impact). Value must be lower inside than in an equally pleasurable real life.
      *   *Motivation (Nozick):* Intuition that we value "actually doing" things, genuine connection, and being anchored in reality, not just the *experience* of these things.
      *   *Status:* **Non-negotiable** for many (esp. non-hedonists). Hedonism fails here.
  7.  **Response to "Authorized Project Machine" (APM) Variant:**
      *   *Requirement:* *May or may not* shift verdict compared to standard EM. A theory *must* clearly state its verdict.
      *   *Motivation:* Tests whether *actual causal agency* is essential (verdict: Stay Out), or if *successful goal achievement* suffices even vicariously (verdict: Go In). Does delegation preserve value? (e.g., a CEO delegating tasks).
      *   *Status:* **Negotiable preference.** Theories differ. Desire-satisfaction *may* accept APM; Objective-list/Perfectionism *likely* rejects it; Hybrids vary. A *coherent* position is required.
  8.  **Treatment of Hedonic Adaptation/Set-Point Shifts:**
      *   *Requirement:* Must *correct* self-reports for adaptation when it reflects lowered *standards* (e.g., chronic illness, systemic disadvantage), not just naturally stable temperaments. Must *not* correct for adaptation reflecting genuinely changed values.
      *   *Motivation:* Self-reports can mask objective deprivation ("happy slave" problem). Well-being theory should reflect a person's *genuine interests*, not just conditioned expectations. However, respecting autonomy means accepting *authentic* value changes.
      *   *Status:* **Strong preference (non-negotiable for many, but conflicts with 10).** Requires a theory of "authentic" interests beyond momentary self-report.
  9.  **Intensity-Duration Trade-off & Comparability:**
      *   *Requirement:* Must combine duration and intensity onto a *single cardinal scale*. Must resolve trade-offs (e.g., 1 year at intensity 10 vs. 2 years at intensity 6). **Incomparability is forbidden.** Equality must be determinable.
      *   *Motivation:* CEA requires unambiguous ranking of outcomes for resource allocation. Incomparability paralyzes decision-making. Trade-offs are ubiquitous (e.g., pain management vs. life extension).
      *   *Status:* **Non-negotiable** (for this purpose).
  10. **Measurable by Self-Report at Scale:**
      *   *Requirement:* The core well-being metric *must* be derivable (directly or via validated mapping/proxy) from population-scale instruments, primarily self-reported surveys (life satisfaction, affect, preferences).
      *   *Motivation:* Feasibility. Direct neurological measures or deep biographical analysis are impossible for whole populations. Policy relies on surveys.
      *   *Status:* **Non-negotiable practical constraint.**
  11. **Deference to Subject's Judgment (Cautious):**
      *   *Requirement:* Should generally respect the subject's *considered* judgment about what is *good for them*, especially regarding their own values and experiences. *But* may override based on theory of objective good or adaptive preferences.
      *   *Motivation:* Epistemic access (subject knows their mind) and anti-paternalism. *Counter-Motivation:* Subjects can be mistaken, irrational, or adapted (see 8).
      *   *Status:* **Strong preference, but negotiable.** Conflicts with 8 and 12.
  12. **Correction for Misinformation:**
      *   *Requirement:* Must assign lower value to states based on *false beliefs*, even if subjectively satisfying.
      *   *Motivation:* Intuition that well-being requires connection to reality. A life built on lies seems less good *for the person*, even if they never know.
      *   *Status:* **Preference** (strongly held by many, contested by others).

  **Interpersonal Gains/Losses:**
  13. **No Intrinsic Equity Requirement:**
      *   *Requirement:* The *well-being measure itself* does not dictate how gains/losses to different individuals are weighted morally. It provides the *inputs* (comparable units) for separate equity considerations.
      *   *Motivation:* Separation of measurement and valuation. CEA frameworks handle equity *after* calculating aggregate well-being gains. The theory must provide the neutral "currency".
      *   *Status:* **Non-negotiable** for this purpose.

  **Conflict Flag:**
  *   **Joint Unsatisfiability:** You are correct. **Deference (11), Correction for Adaptation (8), Correction for Misinformation (12), and Measurability by Self-Report (10) are jointly unsatisfiable under realistic constraints.**
      *   *Why:* Deference and Measurability push towards accepting self-report as authoritative. Correction for Adaptation and Misinformation *require* overriding self-report based on an *external* theory of the person's "real" interests or objective reality. Population-scale measurement (10) rules out individualized deep assessments to resolve this tension reliably. You *cannot* simultaneously respect all self-reports *and* systematically correct them for adaptation/misinformation *and* only use self-report instruments.
  *   **The Key Excluder:** **Measurable by Self-Report at Scale (10)** is the most practically constraining requirement. It forces reliance on imperfect subjective data, directly conflicting with the demands for correction (8, 12) and creating tension with deference (11). Theories requiring deep objective verification or rejecting self-report as fundamentally flawed are ruled out by 10.

  **Scorecard (1 line per view, against core desiderata):**
  *   **Hedonism:** Fails EM (6), struggles with APM interpretation (7), adapts *too* well (fails 8), good on 1-5, 9, 10. **Incompatible with core non-negotiables (6).**
  *   **Desire-Satisfaction:** Fails if desires adapt (8) or are misinformed (12), ambiguous on EM/APM (7), good on 1-5, 9, potentially 10/11. **Struggles with 8 & 12 vs 10 & 11.**
  *   **Objective-List:** Struggles with interpersonal comparability (2), measurability (10), duration-intensity trade-off (9); rejects EM (6), potentially APM (7); good on 8, 12. **Fails key feasibility constraints (2, 10, potentially 9).**

  This specification highlights the inherent tensions, particularly the conflict between theoretical purity (correcting for adaptation/misinformation) and practical necessity (relying on self-reported data), making a "hybrid" or pragmatic theory most likely, albeit philosophically messy.
