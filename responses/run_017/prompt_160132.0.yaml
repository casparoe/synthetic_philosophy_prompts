  Ines is pointing out that the self-locating belief is endogenous to the strategy. This is a known issue in games with imperfect recall: the agent's belief about where she is in her information set might depend on her own strategy. 

  In this case, if P1 is considering a strategy of always taking, then the only time she is at the information set is at node 1. So if she is at the information set and she is considering Take, then she must be at node 1? Similarly, if she is considering Pass, then she might be at node 1 (which leads to visiting again) or at node 3 (which does not). 

