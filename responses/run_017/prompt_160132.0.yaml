  Rahul argues that the fixed point for Take is not stable. Consider a small tremble: suppose P1 plays Pass with probability ε (and Take with 1-ε). Then conditional on being at node 2, P2 knows that P1 passed at node 1. Moreover, because P1 uses the same action at both, P2 knows that P1 will also Pass at node 3. Therefore, P2 passes at node 2 (because 30>6). Then, if P1 plays Pass, she gets 11 (as before). If she plays Take, she gets 2. So Pass is better. Therefore, for any ε>0, Pass dominates. So the Take equilibrium is eliminated by a trembling-hand test. 

