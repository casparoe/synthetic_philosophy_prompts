  She argues that backward induction is about expected utility and that the amnesia removes the possibility for P1 to condition on being at node 3 (since she doesn't know which node she is at). Therefore, P1 must choose a single action. She evaluates at node 1: if she takes, she gets 2. If she passes, then at node 2, P2 (being rational) will take (because in the standard backward induction, at node 2, P2 takes and gets 6, which is more than 5 he would get if he passed and then P1 took at node 3). So if P1 passes at node 1, then P2 takes at node 2 -> P1 gets 1. Therefore, P1 chooses Take at node 1 and gets 2. Outcome (2,0). 

