  Therefore, regardless of which node she is at, if she chooses Pass, she gets 11. So the expected payoff for Pass is 11.

  For Take: if she is at node 1, she gets 2; if at node 3, she gets 12. So expected: 0.5*2 + 0. 5*12 = 7.

  So Pass gives 11>7. So she chooses Pass.

