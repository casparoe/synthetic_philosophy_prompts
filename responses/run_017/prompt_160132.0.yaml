  In the Nash equilibrium, we can assign beliefs arbitrarily off the path. But if we require sequential rationality, then at node 2, P2 must form a belief about what P1 will do at node 3. Since P1's strategy is fixed to either Take or Pass at both, if P1's equilibrium strategy is Take, then a deviation at node 1 (pass) would imply that P1 is not following her strategy. But what is her strategy? It's either (Take,Take) or (Pass,Pass). If she deviates at node 1 by passing, then she must be playing (Pass,Pass). Therefore, P2 can deduce that she will Pass at node 3. Then P2, at node 2, would pass and then at node 4 take, so he gets 30. But then P1, by deviating to (Pass,Pass) gets 11, which is better than 2. So the (Take,Take) equilibrium is not subgame perfect? 

