  Move (3): Ines
  Ines argues that Rahul's reasoning is conditioning on an unreached node. She points out that without perfect recall, the equivalence between mixed and behavioral strategies fails (Kuhn's theorem requires perfect recall). Therefore, when we consider deviations, we have two interpretations: (a) one random draw (a mixed strategy) that governs both visits, or (b) independent randomizations at each visit (a behavioral strategy). 

