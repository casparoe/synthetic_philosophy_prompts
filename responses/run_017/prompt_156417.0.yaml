          Group A: outcome=0 above 55: 60,55 -> 2, FPR_A=2/5=40%.
          Group B: outcome=0 above 55: 70,65,60,55 -> 4, FPR_B=4/8=50%.

       It's hard to get exactly 20% in both. But let's try to get as close as possible.

       They might choose threshold=62 (a number between 60 and 65) so that in Group A: only 60 is above -> FPR_A=20%.
          Group B: outcome=0 above 62: 70,65 -> 2, FPR_B=25%.

       Then selection rates:
          Group A: outcome=1 above threshold: 5 (all) and outcome=0: 1 -> 6 selected (60%).
          Group B: outcome=1 above: 2, outcome=0 above: 2 -> 4 selected (40%).

       They see that the selection rates are 60% vs 40%.

     So in both rounds, they see a trade-off.

     **Activity Structure:**

     1. **Introduction (5 mins):** 
          - Explain the context (bail decision) and the two goals for round 1 (without using technical terms).
          - Hand out the dataset and instructions for round 1.

     2. **Round 1 (15 mins):** 
          - Groups work to set a threshold to achieve roughly equal selection rates. They calculate the resulting FPR and FNR for each group.

     3. **Round 2 (15 mins):** 
          - Explain the new goal (equal false positive rate) for the same bail decision context.
          - Groups set a threshold to achieve roughly equal FPR and then calculate selection rates and FNR.

     4. **Debrief (20 mins):** 
          - Groups share their thresholds and results.
          - Facilitator helps them see the pattern: when they achieved one goal, the other was not achieved.
          - Then introduce the three criteria (calibration, error rate balance, demographic parity) and the impossibility result.
          - Explain that the trade-off is inherent when base rates differ, and it's not due to data quality or bias in the model.

     5. **Conclusion (5 mins):** 
          - Emphasise that the score itself (because it is calibrated within groups) is not to blame, but the decision on how to use it requires a value judgment.

     **What will go wrong:**
     - Participants might try to set different thresholds for each group, but the rules forbid that.
     - The calculations might be done incorrectly, so have a calculator or spreadsheet ready.
     - They might not see the trade-off immediately, so the facilitator must be ready to compare the results across groups.

     **What the exercise cannot reproduce:**
     - The exercise assumes the score is perfectly calibrated within groups. In reality, measurement error and bias might exist, but the trade-off would still occur even with a perfect score.
     - The exercise does not address why base rates differ (which might be due to structural factors).

     **Handout Example for Dataset:**

     We provide a table:

     Group A:

     | ID | Group | Risk Score | Outcome |
     |----|-------|------------|---------|
     | A1 | A     | 90         | 1       |
     | A2 | A     | 85         | 1       |
     | A3 | A     | 80         | 1       |
     | A4 | A     | 75         | 1       |
     | A5 | A     | 70         | 1       |
     | A6 | A     | 60         | 0       |
     | A7 | A     | 55         | 0       |
     | A8 | A     | 50         | 0       |
     | A9 | A     | 45         | 0       |
     | A10| A     | 40         | 0       |

     Group B:

     | ID | Group | Risk Score | Outcome |
     |----|-------|------------|---------|
     | B1 | B     | 90         | 1       |
     | B2 | B     | 85         | 1       |
     | B3 | B     | 70         | 0       |
     | B4 | B     | 65         | 0       |
     | B5 | B     | 60         | 0       |
     | B6 | B     | 55         | 0       |
     | B7 | B     | 50         | 0       |
     | B8 | B     | 45         | 0       |
     | B9 | B     | 40         | 0       |
     | B10| B     | 35         | 0       |

     **Instructions for Round 1:**
     - You are setting a threshold for denying bail. If an individual's risk score is **above** the threshold, they are denied bail.
     - Your goal is to set a single threshold (a number) so that the proportion of individuals denied bail in Group A is as close as possible to the proportion in Group B.
     - Once you set the threshold, calculate:
          - Selection rate for Group A = (number of individuals in A with score > threshold) / 10
          - Selection rate for Group B = (number of individuals in B with score > threshold) / 10
          - False positive rate for Group A = (number of individuals in A with score > threshold AND outcome=0) / (total outcome=0 in A)
          - False positive rate for Group B = (number of individuals in B with score > threshold AND outcome=0) / (total outcome=0 in B)
          - False negative rate for Group A = (number of individuals in A with score <= threshold AND outcome=1) / (total outcome=1 in A)
          - False negative rate for Group B = similarly

     **Instructions for Round 2:**
     - Using the same dataset, set a threshold so that the false positive rate for Group A is as close as possible to the false positive rate for Group B.
     - Then calculate the selection rates and false negative rates as above.

     **Debrief Mapping:**
     - Round 1's goal was **demographic parity** (equal selection rates).
     - Round 2's goal was **equal false positive rates** (part of error-rate balance).
     - The **calibration** was built into the data: within each group, the risk score was a good predictor (e.g., in Group A, the average score for outcome=1 was higher than for outcome=0, and similarly for Group B). But note we did not use the term calibration.

     **Honest note on what will predictably go wrong:**
     - Participants may struggle to find a threshold that exactly meets the goal, especially with small datasets. They may get frustrated. Reassure them that getting close is okay and the point is to see the tension.
     - They might question the data: "Why are the base rates different?" or "Is the score biased?". Acknowledge these are important questions, but for this activity, we are assuming the score is as good as it can be within each group.

     **Frank statement of what the exercise cannot reproduce:**
     - The exercise cannot show that the tension is not due to bad data or measurement error. We are using a clean, synthetic dataset where the score is perfectly calibrated by group. In reality, scores are often not perfectly calibrated, and there might be measurement error or bias in the data. However, even with a perfect score (as in this activity), the tension arises because of the difference in base rates. This is a fundamental mathematical result, not an artefact of imperfect modelling.

     By the end, participants should understand that when base rates differ, they must make a choice between these fairness definitions, and that choice involves ethical considerations beyond the model itself.
