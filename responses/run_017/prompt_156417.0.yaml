  ### Workshop Activity: "Fair Decisions Challenge"

  **Materials:**
  1. **Dataset handouts** (one per group) with 20 fictional individuals:
     - Two groups: "Blue" (10 people) and "Green" (10 people)
     - Columns: Person ID, Group, Risk Score (40-95), Actual Outcome (1=High Risk, 0=Low Risk)
     - **Base rates differ**: Blues have 6 High Risk (60%), Greens have 3 High Risk (30%)
     - Scores calibrated within groups (e.g., Blues' High-Risk average: 85, Low-Risk: 55; Greens' High-Risk: 80, Low-Risk: 50)

  2. **Decision cards** (two colours):
     - **Round 1 (Prison parole):** "Approve parole if score ≤ [threshold]"
     - **Round 2 (Job promotion):** "Approve promotion if score ≤ [threshold]"

  3. **Calculator & poster paper** per group for recording results.

  **Rules:**
  1. **Core constraint (unannounced):** 
     - Decisions MUST follow score order (e.g., if 70 is approved, all ≤70 must be approved)
     - No reordering individuals to manipulate group outcomes.

  2. **Round 1 (Parole Board):**  
     - *Task:* Set one threshold approving ≥50% of applicants.  
     - *Secret goal:* Achieve similar approval rates for Blues and Greens (demographic parity).  
     - *Metrics to record:*  
       - % of Blues approved  
       - % of Greens approved  
       - % of approved who became High Risk (proxy for calibration)  
       - % of High-Risk individuals approved (false negative rate)  

  3. **Round 2 (Job Promotion):**  
     - *New context:* Same scores, but for promotion in a safer role. Population differs slightly (add 2 new individuals: one Blue with score 45/Outcome 0, one Green with score 75/Outcome 1).  
     - *Task:* Set one threshold approving ≤40% of applicants.  
     - *Secret goal:* Approve only the safest candidates (minimise false positives).  
     - *Metrics:* Same as Round 1 plus comparison to previous results.  

  **Predictable Issues & Mitigation:**  
  - **First-run problem:** Groups will fixate on one metric (e.g., approval rates) and declare victory.  
    - *Handle:* Ask: "Check all four metrics—does improving one worsen another?"  
  - **Threshold frustration:** Some may protest that score ordering prevents "fair" adjustments.  
    - *Handle:* Affirm: "This constraint exists in real algorithms—we can't cherry-pick individuals."  
  - **Confusion over new population:** Gently remind: "Scores are reused in new contexts—like your models."  

  **Activity Flow (60 mins):**  
  1. **Briefing (5 mins):**  
     - "You're parole boards using a risk score. Set one threshold approving >50%. Record metrics."  
     - No fairness jargon; emphasise "similar outcomes" implicitly.  

  2. **Round 1 (20 mins):**  
     - Groups set thresholds (e.g., Blue: 60% approval at threshold=70, Green: 50% at threshold=65 → but one threshold forces compromise).  
     - Typical result: Equal approval rates (e.g., 50%) causes:  
       - Higher false negatives for Blues (e.g., 40% High-Risk approved vs. 10% for Greens)  
       - Worse calibration for Blues (e.g., 25% of approved become High Risk vs. 10% for Greens)  

  3. **Round 2 (20 mins):**  
     - Introduce new population and job context.  
     - Groups set conservative threshold (e.g., 40% approval).  
     - Typical result: Equal precision (e.g., 0% approved become High Risk) causes:  
       - Lower approval for Blues (e.g., 30% vs. 40% for Greens)  
       - Higher false negatives for Blues (e.g., 70% High-Risk approved vs. 33% for Greens)  

  4. **Debrief (15 mins):**  
     - **Map activities to concepts:**  
       | Activity moment          | Fairness concept             |  
       |--------------------------|------------------------------|  
       | "Similar approval rates" | Demographic parity           |  
       | "Approved who were safe" | Calibration                  |  
       | "Missed High-Risk people"| Error rate balance           |  
       | Score-order constraint   | Real-world algorithmic limit |  
       | Same score in Round 2    | Repurposing tools pitfalls   |  
     - **Reveal impossibility:**  
       - "When base rates differ (Blues 60% vs. Greens 30%), you *can't* have:  
         1. Similar error rates *and*  
         2. Similar approval rates *and*  
         3. Scores meaning the same thing for both groups."  
       - Introduce terms *demographic parity*, *error-rate balance*, *calibration*.  

  **What the Exercise CANNOT Show (Verbatim explainer):**  
  > "This tension isn't due to bad data or biased designers. Your dataset had accurate, group-calibrated scores—yet trade-offs persisted. The impossibility arises from mathematical incompatibility when base rates differ. In reality, measurement errors or prejudice compound this, but the core tension exists even with perfect scores. That's why fairness requires ethical choices about which criterion to prioritise—not just technical fixes."  

  **Why It Works:**  
  - Participants *experience* frustration from mutually exclusive goals.  
  - Score-order constraint prevents "gaming" the system.  
  - Round 2 proves trade-offs travel with the score.  
  - Debrief connects visceral struggle to formal concepts.  

  **Sample Dataset (Illustrative):**  
  | ID | Group | Risk Score | Outcome |  
  |----|-------|------------|---------|  
  | B1 | Blue  | 92         | 1       |  
  | B2 | Blue  | 88         | 1       |  
  | ...| ...   | ...        | ...     |  
  | B10| Blue  | 52         | 0       |  
  | G1 | Green | 89         | 1       |  
  | G2 | Green | 84         | 1       |  
  | ...| ...   | ...        | ...     |  
  | G10| Green | 48         | 0       |  

  *Outcome 1 = High Risk, 0 = Low Risk  
  Blue base rate: 6/10 High Risk, Green: 3/10 High Risk*  

  This design meets all constraints while making the impossibility theorem visceral. The "aha" moment comes from wrestling with constraints—not being told about them.
