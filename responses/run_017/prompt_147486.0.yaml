prompt: |-
  I am writing the requirements section of an internal methods document for a public agency that is about to procure a risk-scoring system, and I want to settle what I am asking of a fairness criterion before I go back to looking at candidate criteria. Please give me the specification rather than a survey: no literature review, no citations, no paper titles, no named theorems. I have read the standard results. What I want is the list of requirements whose joint unsatisfiability those results are actually about, the considerations that make each requirement compelling in the first place, and your view on which of the things people in this field demand are genuine desiderata and which are the preferences of one camp.

  The setting, so that adequacy has something to be relative to. The agency administers a scarce and beneficial intervention — imagine a home-visiting nurse programme with more eligible families than places — and it ranks applicants using a risk score bought from a vendor who will disclose the score and nothing about the model. Two features of this setting matter to me and I do not want them treated as footnotes. First, the agency observes the outcome the score predicts only for the families it actually enrols; for everyone else the label is missing, and missing in a way the agency's own past decisions produced. Second, enrolment is not inert: it changes the outcome, and it changes who appears, with which label, in the data the agency will use to re-fit or re-contract the score next year.

  Then the ask. Write the desiderata a fairness criterion for this score would have to meet: the cases it must get right, the distinctions it must respect rather than collapse, the facts about the deployment it must be consistent with, and — the part I care about most — the requirements that are added by the two features above and that a criterion designed for a one-shot classifier with complete labels need not face at all. For each requirement, give the concrete case or consideration that motivates it, stated in this setting rather than in the abstract. There are particular places where I suspect requirements are hiding and where I want you to look: what a criterion can demand when the auditor sees only scores and decisions and not the model; what it can demand about error rates when one group's errors are partly unobservable by construction; whether the criterion constrains the score, the ranking, the threshold or the allocation, and whether it must be invariant to monotone transformations of the score or to the number of available places; whether it has to survive an auditor who is permitted to choose the subgroup after seeing the data; and what it should say when the intervention is a benefit rather than a burden, so that the familiar error-rate quantities switch their moral sign, and when the intervention is itself what generates the labels.

  Mark each requirement as non-negotiable or as negotiable, and where it is negotiable say whose preference it encodes and what we give up by dropping it. Flag explicitly the subsets that cannot be jointly satisfied, and for each such conflict say whether it is a conflict in principle — the requirements are incompatible whatever the world is like — or only a conflict given contingent facts about the population, such as differing base rates or a particular structure of missingness. I want to know which conflicts I could argue my way out of by changing the world and which I cannot. Where a subset is unsatisfiable, say what the most defensible weakening of one of the requirements would be.

  Two short closing items. First, name the single requirement that does the most work in excluding otherwise attractive candidate criteria, and say why it does that work. Second, if it adds something rather than merely labelling, give a scorecard of no more than three or four broad families of criterion — criteria stated in terms of calibration and error rates, criteria stated in terms of counterfactuals or causal structure, criteria stated as a demand that similar people be treated similarly — against your list, in a few lines each; skip it if it would add nothing.
reasoning: |-
  We are in the context of a public agency procuring a risk-scoring system for allocating a scarce beneficial intervention (e.g., home-visiting nurse program). The agency observes outcomes (labels) only for the enrolled individuals, and enrollment itself affects the outcome and the data collection for future models. The vendor provides the score and nothing about the model.

  We are to specify the requirements (desiderata) for a fairness criterion in this setting. We must consider:
  1. The two special features: missing labels (due to past decisions) and the fact that enrollment changes the outcome and future data.
  2. The concrete setting (beneficial intervention, missing labels, dynamic effects).
  3. The form of the criterion: what it must constrain (score, ranking, threshold, allocation) and invariance properties.
  4. The auditor's perspective: only scores and decisions are observable, not the model.
  5. The fact that the intervention is a benefit (so false negatives are more harmful than false positives, in the usual terminology) and that the intervention generates the labels.

  We mark each requirement as non-negotiable (N) or negotiable (K), and for negotiable ones, we say whose preference it is and what we give up. We flag conflicting requirements and note whether conflicts are in principle or due to contingent facts. We also suggest the most defensible weakening in case of conflict.

  We then name the single requirement that does the most work in excluding criteria and provide a scorecard of criterion families.

  Let us list the desiderata:

  1. **Desideratum: Allocation should be based on need (risk) and not on protected attributes (N)**
     - **Motivation**: The agency has a mandate to allocate the beneficial intervention to those who would benefit the most (i.e., those at highest risk of the negative outcome without the intervention). Using protected attributes (e.g., race, gender) for allocation, beyond what is captured by the risk, would be discriminatory and illegal.
     - **Concrete case**: Suppose two individuals have the same risk score (hence same predicted risk) but one is from group A and the other from group B. The criterion must not require, allow, or result in different treatment (enrollment decisions) based solely on group membership.
     - **What it constrains**: The allocation (enrollment decisions) must not depend on protected attributes once the risk score is accounted for. The criterion must be invariant to the protected attribute when the score is the same.
     - **Invariance**: To monotone transformations of the score? Not necessarily, because the risk score is used for ranking. But the allocation should be based on the ranking, so if the score is transformed monotonically, the allocation should remain the same. So we require invariance to monotone transformations for the allocation.
     - **Auditor perspective**: The auditor can only see scores and decisions. They can check that, conditional on the score, the decision does not depend on the protected attribute. However, note that the auditor does not have the true labels for everyone, so they cannot check calibration by group without the missing data.

  2. **Desideratum: The criterion must account for the fact that labels are missing not at random (MNAR) and that the missingness is caused by past agency decisions (N)**
     - **Motivation**: The agency only observes the outcome (label) for those who were enrolled. For the unenrolled, the outcome is missing, and this missingness is directly caused by the agency's decision (not to enroll). Therefore, any criterion that relies on comparing predicted and actual outcomes (like error rates) must account for this missingness.
     - **Concrete case**: Suppose we want to measure the false negative rate (FNR) for a group. We can only observe the outcome for the enrolled (who are the ones that were predicted to be high risk and then received the intervention). For the unenrolled (who were predicted to be low risk and did not receive the intervention), we do not know what their outcome would have been without the intervention. But note: without the intervention, they might have had a negative outcome. However, we never observe that because we didn't enroll them. This is a problem for criteria that require equal FNR across groups because we cannot compute FNR for the unenrolled.
     - **What it constrains**: The criterion cannot require equal error rates (like FPR, FNR) across groups because these are not fully observable. It must not assume that we have labels for everyone.

  3. **Desideratum: The criterion must acknowledge that the intervention affects the outcome (N)**
     - **Motivation**: The intervention (enrollment) changes the outcome. Therefore, the label we observe for the enrolled is under the condition of having received the intervention. The label we would have observed for the unenrolled is counterfactual (without intervention) and is missing. Moreover, the effect of the intervention may differ by group (e.g., due to different responsiveness or different barriers).
     - **Concrete case**: Suppose we try to use the observed outcomes of the enrolled to estimate the risk without intervention. This is not valid because the enrolled received the intervention, which changed their outcome. Therefore, the observed outcome for the enrolled is not the same as the outcome that would have occurred without intervention. This breaks standard calibration requirements (like well-calibration by group) because the observed outcome for the enrolled is a mix of the effect of the intervention and the baseline risk.
     - **What it constrains**: Criteria that require the score to be a well-calibrated estimate of the risk without intervention are problematic because we cannot observe that risk for anyone (the enrolled had the intervention, the unenrolled are missing). We can only observe the outcome under the intervention for the enrolled and we don't know what the outcome would have been without intervention for anyone.

  4. **Desideratum: The criterion must be auditable without knowledge of the model (N)**
     - **Motivation**: The vendor only discloses the score and not the model. Therefore, the fairness criterion must be checkable using only the scores, the decisions, and the observed outcomes (for the enrolled) and possibly some protected attributes. It cannot require access to model internals or features beyond what the agency has.
     - **Concrete case**: Criteria that require knowing the model's internal structure (e.g., causal pathways) or individual features beyond the score and protected attributes cannot be audited.

  5. **Desideratum: The criterion should be robust to strategic manipulation and should not create perverse incentives (K - but important)**
     - **Motivation**: Because the allocation decisions affect the future data (which is used to refit the model), the criterion should not incentivize the agency or the applicants to behave in ways that undermine the goal of the program. For example, if the criterion requires equal enrollment rates across groups, then the agency might set lower thresholds for groups with lower risk to achieve parity, which would lead to enrolling lower-risk individuals in that group and then observing that the intervention is less effective (because they were lower risk) and then in the next round, the model might learn that and lower the scores for that group, creating a feedback loop.
     - **Whose preference**: This is a preference of the agency and the public for a stable and effective system over time. It is negotiable in the sense that one might choose a criterion that does not guarantee this but we give up long-term stability and effectiveness.
     - **What it constrains**: The criterion should not create incentives to change the threshold in ways that are not driven by the actual risk.

  6. **Desideratum: The criterion should respect the scarcity of the resource (N)**
     - **Motivation**: There are more eligible families than places. Therefore, the allocation must be selective. The criterion must not require enrolling more individuals than there are places (or fewer, if that would waste the resource).
     - **Concrete case**: The criterion must be compatible with a fixed number of available places. It must not require, for example, that we enroll everyone above a certain level of risk if that would exceed the capacity, unless we adjust the threshold accordingly.

  7. **Desideratum: The ranking should reflect the true risk without intervention (K - but note the observability problem)**
     - **Motivation**: The goal is to allocate the intervention to those who would benefit the most (i.e., those who would have the worst outcome without the intervention). Therefore, the score should accurately rank individuals by their risk without intervention.
     - **Conflict with reality**: We cannot observe the true risk without intervention for anyone. For the enrolled, we observe the outcome with intervention, and for the unenrolled, we observe nothing. So we cannot directly measure the true risk without intervention. This requirement is therefore not directly auditable and might be impossible to meet without strong assumptions.
     - **Whose preference**: This is the agency's goal. But it is negotiable in the sense that we might have to weaken it to what is observable. We give up the guarantee that the ranking is correct if we drop it.
     - **Note**: This is the core goal, but it is not auditable without additional assumptions (e.g., that the intervention has no effect on the outcome, which we know is false) or without using counterfactual inference.

  8. **Desideratum: The criterion should avoid disparate impact (K)**
     - **Motivation**: The agency might want to avoid large disparities in enrollment rates across groups, especially if those groups are protected classes, to prevent perceptions of unfairness or to promote equity.
     - **Concrete case**: If group A has a much higher enrollment rate than group B, even if that is because group A has higher risk, it might be perceived as unfair. The agency might want to limit the disparity.
     - **Whose preference**: This is a preference of equity advocates. We give up some efficiency (i.e., not enrolling exactly by risk) if we impose it.
     - **Note**: This is in tension with allocating by risk (desideratum 1) if groups have different risk distributions.

  9. **Desideratum: The criterion should be subgroup robust (K)**
     - **Motivation**: The auditor might be allowed to choose a subgroup (defined by a combination of features) after seeing the data. The criterion should hold not only for predefined groups (like race and gender) but also for any subgroup that the auditor might define post hoc.
     - **Whose preference**: This is a preference from the algorithmic fairness community (especially from the multi-calibration literature). It is very strong and might be too demanding. We give up simplicity and might require more data (to measure outcomes in small subgroups) if we impose it.

  10. **Desideratum: The criterion should be invariant to the number of available places (N)**
      - **Motivation**: The number of available places (the threshold) is a decision variable of the agency and might change from year to year. The fairness criterion should not depend on how many places are available. It should constrain the score or the ranking, not the allocation for a fixed threshold.
      - **Concrete case**: Suppose we require that the false negative rate (FNR) be equal across groups. But the FNR depends on the threshold (if the threshold changes, the FNR changes). Therefore, if the agency changes the number of places (and hence the threshold) then the FNR parity might break. This is not desirable because the fairness of the score should not depend on budget fluctuations.
      - **What it constrains**: The criterion should be stated in terms of the score and the true risk, not in terms of the threshold.

  Now, let's address conflicts:

  **Conflict 1: Allocation by risk (desideratum 1) vs. Avoiding disparate impact (desideratum 8)**
  - **Nature**: Contingent on the population. If the risk distributions differ across groups, then allocating by risk will lead to different enrollment rates. If the agency wants to avoid disparate impact, it must deviate from allocation by risk.
  - **Resolution in principle?**: No, it is contingent. We can avoid the conflict by having groups with identical risk distributions. But in reality, they might differ.
  - **Defensible weakening**: Weaken desideratum 8 to allow for disparities that are driven by differences in risk. We might require that the disparity is no greater than what is justified by the risk differences.

  **Conflict 2: The requirement for accurate ranking of true risk without intervention (desideratum 7) vs. the missing labels and intervention effect (desiderata 2 and 3)**
  - **Nature**: In principle, we cannot observe the true risk without intervention. Therefore, we cannot directly measure or enforce that the score reflects the true risk without intervention. This is an in-principle conflict because of the missing data and the effect of the intervention.
  - **Resolution**: We must drop or weaken desideratum 7. The most defensible weakening is to require that the score is a good predictor of the observed outcome under the intervention for the enrolled, and then use assumptions (e.g., about the effect of the intervention) to infer the true risk without intervention. Alternatively, we might require that the score is calibrated for the observed outcome (with intervention) for the enrolled, but note that this is not the same as the risk without intervention.

  **Conflict 3: Error rate parity (if we were to require it) vs. the missing labels (desideratum 2)**
  - **Nature**: In principle, we cannot compute error rates for the unenrolled because their labels are missing. Therefore, any criterion that requires equal error rates (like FNR, FPR) across groups is not auditable. This is in principle.
  - **Resolution**: We must avoid criteria that require error rate parity.

  **Conflict 4: Calibration by group (for the true risk without intervention) vs. the intervention effect (desideratum 3)**
  - **Nature**: In principle, we cannot observe the true risk without intervention because of the intervention effect. Therefore, we cannot check calibration for the true risk without intervention. This is in principle.
  - **Resolution**: We must avoid calibration for the true risk without intervention. We might require calibration for the observed outcome (with intervention) for the enrolled, but note that this is not the same and might not reflect the risk without intervention.

  Now, the requirement that does the most work in excluding criteria:

  **Desideratum 2 (missing labels) and 3 (intervention effect) together do the most work.** They exclude any criterion that requires knowledge of the true outcome without intervention for all individuals (or even for the unenrolled). This includes:
  - Criteria based on equal error rates (FPR, FNR, etc.)
  - Criteria based on calibration for the true risk without intervention (like well-calibration by group)
  - Criteria that require knowing the counterfactual outcome without intervention (without strong assumptions)

  Therefore, many popular criteria (like equal opportunity, equalized odds, calibration by group) are not directly applicable.

  Finally, a scorecard of criterion families:

  1. **Criteria based on calibration and error rates**:
     - These require knowing the true labels for everyone. But we don't have that. Also, they are for the true risk without intervention, which we cannot observe. Moreover, they are not invariant to the threshold (which changes with the number of places). Therefore, they are generally inapplicable.

  2. **Criteria based on counterfactuals or causal structure**:
     - These try to address the intervention effect by modeling the counterfactuals. However, they require strong assumptions (e.g., no unmeasured confounding) and typically require knowledge of the model's features (which the auditor doesn't have). Also, they are not auditable without the model and without additional data (like historical data with random assignment). They might be too demanding and not auditable in our setting.

  3. **Criteria based on similar people treated similarly (individual fairness)**:
     - This requires that similar individuals (in terms of risk-relevant features) get similar scores. But the auditor does not have the features, only the score and the protected attribute. Therefore, they cannot audit individual fairness without the features. Also, it does not address the group-level disparities that might arise from differences in risk distributions.

  Given the constraints, none of these families are fully satisfactory. We might need a new approach that focuses on:
  - Requiring that the score is a good predictor of the observed outcome (under intervention) for the enrolled (but note that this is not the risk without intervention) and that it is calibrated for the enrolled.
  - Requiring that, conditional on the score, the enrollment decision does not depend on the protected attribute (desideratum 1).
  - Avoiding criteria that require unobservable quantities.

  But note: The primary goal is to allocate by risk without intervention, but we cannot measure it. So we are stuck. The best we can do is to use the observed outcome under intervention as a proxy and hope that the risk without intervention is correlated with it. But that might not hold if the intervention effect varies.

  This is a fundamental challenge.

  Thus, the most defensible path is to:
  - Focus on the requirement that the allocation is based solely on the score (which should reflect the best available estimate of the risk without intervention) and not on protected attributes.
  - Acknowledge that we cannot fully audit the accuracy of the risk estimate without intervention and therefore must rely on the vendor's model and the agency's due diligence in procuring a model that is built using methods that account for the missing data and the intervention effect (e.g., using counterfactual inference from historical data with random assignment or using quasi-experimental methods). But this is beyond the fairness criterion per se.

  Therefore, the fairness criterion in the document might be reduced to:
  - **Requirement 1 (non-negotiable)**: The allocation (enrollment) must be based solely on the risk score and not on protected attributes. (This is auditable by checking that, for the same score, the enrollment rate does not vary by protected attribute. Since the decision is binary and the threshold is fixed, this becomes: the proportion enrolled at a given score should be the same for all protected groups. But note: the auditor can only see the scores and the decisions, so they can test for independence of the decision and the protected attribute conditional on the score.)

  - **Requirement 2 (non-negotiable)**: The risk score must be calibrated for the observed outcome (with the intervention) for the enrolled individuals. (But note: this is not the same as the risk without intervention. It is a proxy. And it only applies to the enrolled. We can require that for the enrolled, the average observed outcome (say, the event rate) for a given score matches the score. But the score is supposed to predict the risk without intervention, not the risk with intervention. So this might be a mismatch.)

  Given the above, we might have to accept that the criterion is limited.

  Alternatively, we might require:

  - **Predictive parity for the enrolled**: Among the enrolled, the rate of the observed outcome (with intervention) should be the same across groups for a given score. This is calibration by group for the enrolled. But note: if the intervention effect differs by group, then even if the true risk without intervention is the same, the observed outcome (with intervention) might differ. Therefore, this requirement might force the score to absorb the intervention effect, which is not what we want.

  This is complex and shows that without addressing the counterfactual nature, we are limited.

  Given the time, I propose that the core non-negotiable requirements are:

  1. **Conditional allocation independence**: The allocation decision (enroll or not) must be independent of protected attributes conditional on the risk score. (N)
  2. **Score interpretability**: The risk score must be interpretable as a risk without intervention (to the extent possible) and the vendor must provide documentation on how the score was developed and validated, including how they addressed the missing data and the intervention effect. (N) [But note: this is not a statistical fairness criterion, but a procurement requirement.]

  Given the auditor's constraints, the statistical fairness criterion might be limited to requirement 1.

  This is a sobering conclusion.
answer: |-
  Below is the specification of fairness desiderata for your risk-scoring system procurement, structured to address your requirements. The focus is on operational and ethical necessities in your specific setting: a scarce **beneficial intervention** (e.g., home-visiting nurse program), **missing outcomes** for non-enrollees due to agency decisions, and **enrollment effects** that alter outcomes and future data. Desiderata are derived from the deployment constraints, with non-negotiable (N) requirements grounded in legality, feasibility, or core mission, and negotiable (K) requirements reflecting trade-offs between equity, efficiency, and practicality. Conflicts and their nature (principled vs. contingent) are flagged, along with defensible weakenings.

  ---

  ### **Core Desiderata for Fairness Criterion**
  #### **1. Allocation Conditioned Only on Risk (N)**  
  **Motivation**: The intervention is a benefit targeting those at highest risk of negative outcomes (e.g., adverse health events). Allocating based on anything beyond the risk score—especially protected attributes (e.g., race, ZIP code)—violates legal and ethical mandates against discrimination.  
  **Concrete case**: Two applicants with identical risk scores but different protected attributes must have equal enrollment probability. Anything else would unjustly penalize/privilege groups.  
  **Deployment specifics**:  
  - Constrains **allocation**, not the score itself. Must hold for any threshold or number of places.  
  - Auditor can verify using only scores, decisions, and protected attributes (no model access needed).  
  - Invariant to monotone score transformations (it’s about ranking, not absolute values).  
  **Why non-negotiable**: Legal imperative; core to agency mission of need-based allocation.

  #### **2. Auditable Without Model Access or Full Labels (N)**  
  **Motivation**: The vendor discloses scores only, and outcomes are missing for non-enrollees. The criterion must be verifiable post-deployment with available data: scores, enrollment decisions, protected attributes, and *observed* outcomes (enrollees only).  
  **Concrete case**: An auditor cannot demand error rates (e.g., false negative rates) for non-enrollees, as their outcomes are unobservable and counterfactual.  
  **Deployment specifics**:  
  - Must rely on **scores, decisions, and partial outcomes** (e.g., calibration of enrollees’ outcomes).  
  - Cannot require model internals, features, or unobservable counterfactuals.  
  **Why non-negotiable**: Practical necessity; agency cannot audit what it cannot observe.

  #### **3. Acknowledge Outcome Changes Under Intervention (N)**  
  **Motivation**: Enrollment alters outcomes (e.g., nurse visits reduce health risks), and observed labels for enrollees reflect this. The criterion must not assume outcomes are static or ignore how intervention efficacy may differ by group.  
  **Concrete case**: Calibrating scores to predict *untreated* risk is impossible—enrollees’ observed outcomes reflect treated risk, and non-enrollees’ outcomes are missing.  
  **Deployment specifics**:  
  - Constrains **score interpretation**: Scores must not be treated as counterfactual (no-intervention) risk estimates without explicit disclaimers.  
  - Forces acceptance that "true risk" is unobservable; criterion can only use **post-intervention outcomes** for enrollees.  
  **Why non-negotiable**: The intervention’s effect is inherent to the deployment; ignoring it invalidates any criterion.

  #### **4. Threshold Invariance (N)**  
  **Motivation**: The number of available places (threshold) changes annually due to budgets. Fairness cannot depend on arbitrary resource levels.  
  **Concrete case**: A criterion demanding equal enrollment rates (e.g., demographic parity) would require adjusting thresholds yearly, potentially misallocating resources (e.g., enrolling lower-risk applicants in one group to meet quotas).  
  **Deployment specifics**:  
  - Constrains **score or ranking**, not allocation. Must hold whether 10% or 50% are enrolled.  
  - Auditor must verify fairness *before* threshold application (e.g., via score distributions).  
  **Why non-negotiable**: Ensures stability; fairness is a property of the score, not annual decisions.

  #### **5. No Reliance on Unobservable Error Rates (N)**  
  **Motivation**: For non-enrollees, outcomes are missing, so group-wise error rates (e.g., false negatives) are unobservable. Requiring them is infeasible and misleading.  
  **Concrete case**: Demanding "equal false negative rates" fails—non-enrollees’ outcomes are unknown, and errors are defined counterfactually.  
  **Deployment specifics**:  
  - Auditor **cannot compute** confusion matrices by group. Criterion must avoid error-rate parity (e.g., equal opportunity, equalized odds).  
  - Forces focus on **observable metrics** (e.g., calibration of enrollees’ outcomes).  
  **Why non-negotiable**: Principled limitation—missing data by design makes this impossible.

  #### **6. Protect Against Feedback Loops (K)**  
  **Motivation**: Enrollment decisions alter future data: high-risk non-enrollees may experience bad outcomes (unobserved), while enrollees’ outcomes improve. This can bias re-training, worsening disparities.  
  **Concrete case**: If group A is under-enrolled due to scoring bias, their future data shows artificially lower risk (missing bad outcomes), leading to even lower scores.  
  **Deployment specifics**:  
  - Criterion must ensure **score reliability across cycles** (e.g., via robustness to missingness patterns).  
  - **Whose preference**: Agency/data scientists prioritizing long-term validity.  
  **Trade-off**: Dropping this risks model degradation but may simplify auditing.  
  **Why negotiable**: Mitigation (e.g., data imputation) may exist outside fairness criteria.

  #### **7. Subgroup Robustness (Optional Auditor-Selected Groups) (K)**  
  **Motivation**: An auditor might test arbitrary subgroups (e.g., "women over 50 in ZIP 12345") post hoc to detect hidden biases.  
  **Concrete case**: A criterion holding for broad groups (e.g., race) may fail for intersections (e.g., Black women), creating loopholes.  
  **Deployment specifics**:  
  - **Whose preference**: Fairness researchers advocating for high-assurance auditing.  
  **Trade-off**: Adds robustness but requires fine-grained data and increases complexity.  
  **Why negotiable**: Impractical for small subgroups (statistical noise) or without rich data.

  ---

  ### **Conflicts and Resolutions**
  #### **Conflict 1: Allocation by Risk (1) vs. Error Rate Constraints (5)**  
  - **Requirements**: (1) (allocation conditioned only on risk) and (5) (no reliance on unobservable error rates).  
  - **Conflict**: (1) implies scores should reflect true risk, but (5) states true risk is unobservable for non-enrollees.  
  - **Nature**: **Principled**—due to missing data and intervention effects, true risk is *always* unobservable.  
  - **Resolution**: Weaken **score interpretation** (from 3): Scores must be calibrated to *treated* outcomes for enrollees (observable), not counterfactual risk.  

  #### **Conflict 2: Allocation by Risk (1) vs. Disparate Impact Mitigation (e.g., Demographic Parity)**  
  - **Requirements**: (1) (allocation conditioned only on risk) vs. negotiable preference for equal enrollment rates.  
  - **Conflict**: If risk distributions differ by group (e.g., Group A has higher baseline risk), allocating by risk yields disparate enrollment rates.  
  - **Nature**: **Contingent**—depends on real-world risk disparities.  
  - **Resolution**: If equity is prioritized, weaken **allocation** by allowing risk-adjusted quotas (e.g., guarantee minimum enrollment for underserved groups). Trade efficiency for equity.  

  #### **Conflict 3: Threshold Invariance (4) vs. Threshold-Specific Metrics (e.g., Predictive Parity)**  
  - **Requirements**: (4) (threshold invariance) vs. criteria like "equal positive predictive value," which depend on enrollment thresholds.  
  - **Conflict**: Predictive parity requires equal outcome rates *among enrollees*, but threshold changes alter the enrolled pool.  
  - **Nature**: **Principled**—fairness cannot depend on yearly resource fluctuations.  
  - **Resolution**: Drop threshold-dependent metrics entirely; use **threshold-invariant measures** (e.g., score distribution parity).  

  ---

  ### **Key Exclusionary Requirement**  
  **No Reliance on Unobservable Error Rates (5)** does the most work in excluding criteria. It invalidates:  
  - **Error-rate parity** (equal opportunity, equalized odds): Requires counterfactual outcomes for non-enrollees.  
  - **Counterfactual fairness**: Depends on unobservable "no intervention" outcomes.  
  - **Calibration for untreated risk**: Untreated risk is unobservable by design.  
  This forces the criterion to use only **observable data** (enrollee outcomes) and avoid causal claims, eliminating most popular criteria from consideration.  

  ---

  ### **Scorecard of Criterion Families**  
  | **Criterion Family**       | **Viability in Your Setting**                                                                 | **Key Shortcomings**                                                                 |  
  |----------------------------|-----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **Calibration/Error Rates** | ✗ Non-starter                                                                                | Requires full labels and untreated risk (violates 2, 3, 5); threshold-dependent (violates 4). |  
  | **Counterfactual/Causal**   | △ Limited                                                                                    | Demands unobservable data (violates 2, 5) and model transparency (violates 2); may ignore intervention effects. |  
  | **Similarity-Based**        | △ Partial fit                                                                                | Auditor lacks features to assess "similarity" (violates 2); ignores group disparities and intervention effects. |  
  | **Allocation Parity**       | △ Weak fit (if risk-adjusted)                                                               | Negotiable for equity (e.g., risk-proportional enrollment), but conflicts with 1 if risk distributions differ. |  

  **Recommendation**: Prioritize **observable, allocation-focused criteria** (e.g., conditional allocation independence) that work with partial data. Avoid criteria demanding counterfactuals or full error rates—they are untenable here.  

  ---

  ### **Summary of Non-Negotiables**  
  Your fairness criterion **must**:  
  - Allocate based solely on risk scores, not protected attributes.  
  - Be auditable with scores, decisions, protected attributes, and enrollee outcomes only.  
  - Acknowledge intervention effects and missing data limitations.  
  - Be invariant to thresholds/number of places.  
  - Avoid unobservable error rates.  

  These ensure compliance with legal, operational, and ethical constraints unique to your dynamic, benefit-focused, and data-limited deployment.
