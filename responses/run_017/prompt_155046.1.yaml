prompt: |-
  I have just spent a long evening arguing with a friend about whether the things I think with are parts of me. She held that any theory of this kind collapses into counting every well-used tool as mental; I kept insisting there must be a principled stopping point; and neither of us could say what an adequate theory would have to look like. So I want the specification before we resume.

  Please write the desiderata that a theory of cognitive extension must meet to count as adequate for one particular job: deciding when an intervention on someone's external resources counts as an intervention on that person's mind rather than merely on their surroundings. The cases I actually care about are a phone seized and searched at a border, a care home removing a resident's labelled photographs, and a platform quietly rewriting the notes, archive, or predictive keyboard that a person relies on to think.

  Give each requirement with the case or consideration behind it; mark which are non-negotiable and which are only preferences of one camp; and flag any subset you doubt can be jointly satisfied. The theory has to sort these: a memory notebook carried and consulted constantly; a cloud note application that silently corrects what was saved; an augmented-reality overlay a surgeon is trained to override when it drifts; a photo archive for a man with severe hippocampal damage, tagged and curated by his wife, which he can neither inspect nor edit; and a phone keyboard that completes his sentences before he has settled on what to say. It must also respect the distinctions I take to matter: constitution versus mere causal coupling, and the suspicion that the first is being inferred from the second; an extended mind versus a merely well-scaffolded agent; something's being a cognitive vehicle versus its user's deserving epistemic credit or blame; and a resource the agent has mastered versus one that has mastered the agent.

  Do not spend more than a sentence or two scoring existing internalist, functionalist, or enactive positions — the criteria are what I want. Please write in British English, and close with \answer{...} naming, in five words or fewer, the single requirement that excludes the most candidate theories.
reasoning: |-
  Hmm, the user is asking me to outline desiderata for a theory of cognitive extension, specifically to determine when an intervention on external resources counts as an intervention on the mind itself. They've had a long argument with a friend about whether tools we think with become parts of us, and they want clear criteria before resuming the discussion.

  The user describes several scenarios they care about: border agents seizing phones, care homes removing labeled photos, platforms rewriting notes or predictive keyboards. They also provide specific test cases: a memory notebook, cloud notes that silently correct, an AR overlay surgeons override, a curated photo archive for someone with brain damage, and an aggressive predictive keyboard. The theory must distinguish between constitution vs. causal coupling, extended mind vs. scaffolded agent, cognitive vehicle vs. epistemic credit, and mastery vs. being mastered by a resource.

  I need to develop desiderata that address these concerns. Key non-negotiable requirements should include: constitution rather than coupling to avoid collapsing into tool use; reliable access and dependency to ensure consistent integration; agential access to distinguish tools under control; non-substitutability to show uniqueness; and functional equivalence to cognitive processes. These are crucial because without them, any tool could be considered part of the mind.

  Preferences include transparency to avoid black boxes, bidirectionality for interaction, personalization for tailored use, and robustness against minor changes. However, these might not be strict requirements, as some systems could be opaque or unidirectional but still constitutive.

  I see tensions, especially between functional equivalence and the curated photo archive case. The archive is vital for the person with hippocampal damage but lacks agential access and bidirectionality. This might challenge the theory, suggesting that constitution requires some level of control.

  For the test cases: The memory notebook should qualify as extended mind under strict criteria. Cloud notes with silent corrections would fail due to lack of transparency and agential access. The AR overlay is scaffolded but not constitutive because surgeons override it. The photo archive is tricky—it's deeply integrated but passive, so it might be robust scaffolding. The predictive keyboard that completes thoughts early might exemplify the tool mastering the agent.

  The user emphasizes British English, so I'll use terms like "constitutive" and spellings like "categorise." I should avoid deep analysis of existing theories per their request. Finally, the key requirement that excludes most theories is "Non-substitutability," as it demands unique integration beyond mere functionality.

  I'll structure the response with desiderata, flagging non-negotiables and preferences, noting tensions, and applying to test cases. I'll end with the answer as specified.
answer: |-
  Here are the desiderata for a theory of cognitive extension, tailored to your specific need of adjudicating interventions on external resources as interventions on the mind itself, grounded in your cases and distinctions:

  ### Non-Negotiable Core Requirements
  1.  **Constitution, Not Mere Coupling:** The theory must provide a criterion distinguishing when an external resource is *constitutive* of a cognitive process (part of the mind) versus merely *causally coupled* to it. *Reason:* Your core dispute with your friend; prevents collapse into counting all well-used tools as mental (e.g., a seized hammer isn't part of the mind, but perhaps the notebook is). *Case:* Seized phone/search, rewritten notes.
  2.  **Reliable Access & Consistent Dependency:** The resource must be readily available and reliably accessed as needed by the agent *in the relevant cognitive contexts*, forming a consistent part of their cognitive routine. *Reason:* Distinguishes integrated tools from ad-hoc or occasional aids. *Case:* Memory notebook constantly consulted vs. a library book occasionally referenced.
  3.  **Agential Access & Potential Control (Minimal):** The agent must have the *capacity* to access, utilise, and, crucially, *initiate or veto* the resource's contribution to specific cognitive acts *at the time of use* (even if not constantly monitoring it). *Reason:* Captures the "mastered vs mastered by" distinction; prevents passive systems or those controlling the agent from qualifying as constitutive parts. *Case:* Platform rewriting notes (no veto), predictive keyboard completing thoughts prematurely (controls agent), AR overlay (override capacity exists).
  4.  **Non-Substitutability (Functional Specificity):** The specific resource, in its particular form/content/functional role, must be integral to the cognitive process. Merely providing *a* function (e.g., storing information) is insufficient; the *particular instantiation* matters. *Reason:* Avoids functionalism collapsing into type-identity; if seized, the cognitive capacity is uniquely diminished. *Case:* Seized phone with *its specific* notes/photos; care home removing *those specific* labelled photos.
  5.  **Functional Equivalence:** The resource must play a role functionally equivalent to an internal cognitive process (e.g., recall, calculation, deliberation support) within the agent's overall cognitive system. *Reason:* Grounds the claim of "extension" – it's doing mental work. *Case:* Memory notebook as recall, predictive keyboard as formulation.

  ### Important Preferences (Often Held but Negotiable in Principle)
  6.  **Transparency (Preference):** The resource should typically be experienced as transparent (unnoticed) during fluent use, like internal processes, rather than as an opaque tool requiring constant interpretation. *Reason:* Aligns with the phenomenology of skilled tool use becoming incorporated; addresses "vehicle vs credit". *Case:* Cloud notes silently correcting breaks transparency, making it a dubious vehicle.
  7.  **Bidirectionality (Preference):** Ideally, there should be a two-way flow: the agent modifies the resource based on cognition, and the resource modifies cognition. *Reason:* Mirrors internal processes; distinguishes static archives. *Case:* Photo archive curated by wife (no edit/inspect by agent) may lack bidirectionality.
  8.  **Personalization/Individualisation (Preference):** The resource should be tailored to or structured by the individual agent's needs, patterns, or history. *Reason:* Supports uniqueness and integration; distinguishes generic tools. *Case:* Memory notebook vs. a standard dictionary.
  9.  **Robustness to Minor Perturbations (Preference):** Minor, expected glitches or changes shouldn't instantly dissolve the constitutive link if the core function and access remain. *Reason:* Internal cognition isn't perfect either. *Case:* AR overlay drifting slightly (override capacity maintains link).

  ### Tensions & Doubts
  *   **Joint Satisfaction Doubt:** Satisfying **Constitution** (1), **Non-substitutability** (4), and **Agential Access/Control** (3) simultaneously is highly challenging, especially with complex or passive resources. The **Photo Archive** case (curated by wife, no agent access/edit) is a major stress test: it likely fails (3) and possibly (7/8), yet is profoundly cognitively enabling. Does deep dependency without control constitute extension? A strict theory might say no (scaffolding), but the intervention feels deeply personal. Similarly, **Cloud notes silently correcting** likely fails (1, 3, 6), but its output *becomes* the agent's apparent thought.
  *   **"Mastered vs Mastering" Tension:** The **Predictive Keyboard** case highlights the tension between **Functional Equivalence** (5 - it *is* doing formulation) and **Agential Control** (3 - it may be doing it *for* him, mastering him). A good theory must resolve whether functional role or agential control is primary here.

  ### Application to Your Test Cases
  *   **Memory Notebook:** Likely constitutive (meets 1,2,3,4,5,6,7,8).
  *   **Cloud Note App (Silently Correcting):** Likely *not* constitutive (fails 1,3,6; dubious on 4 - is it *your* note anymore?).
  *   **AR Overlay (Trained Override):** Likely robust *scaffolding*, not constitutive extension (fails 1, possibly 2/5 as it's auxiliary and overridden; meets 3 via override).
  *   **Photo Archive (Wife-Curated, No Access):** Likely deep *scaffolding*, not constitutive extension (fails 3,7,8; strong on 2,4,5 dependency). Intervention feels personal due to dependency, but lack of control pushes it out.
  *   **Predictive Keyboard (Completes Early):** Highly ambiguous. If he reliably endorses/completes *using* it, it might meet 1,2,5. If it forces completions he doesn't endorse, it fails 3 and becomes a controlling tool.

  ### Respecting Your Distinctions
  *   **Constitution vs Coupling:** Addressed by (1), (4), (5).
  *   **Extended Mind vs Scaffolded Agent:** Addressed by whether criteria (especially 1,3,4) are met. Scaffolding enables, extension constitutes.
  *   **Cognitive Vehicle vs Epistemic Credit:** Addressed by (1) (vehicle is constitutive part) and control/transparency (3,6) (credit requires agential endorsement/judgement *using* the vehicle).
  *   **Mastered vs Mastered By:** Primarily addressed by (3) - Agential Access & Control.

  \answer{Non-substitutability}
