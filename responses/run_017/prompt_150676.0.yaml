answer: |-
  Here's the breakdown:

  **Rejected step: (7)**  
  *Why:* It conflates epistemic limitations (predictability) with ontological claims (state existence). Determinism concerns lawful entailment, not our capacity to compute or verify it.  

  **Why (7) looked plausible:**  
  Your positivist instinct ties "fact of the matter" to verifiability. If no embedded agent could *ever* confirm a future state—even in principle—it *feels* like the state isn’t real. This resonates with operationalism: unobservable differences aren’t differences.  

  **Cost of rejecting (7):**  
  You sacrifice the positivist link between existence and knowability. You must accept that the deterministic evolution of the double pendulum (per its equations) generates a definite state at *t=H+1*, even though no physical predictor could represent, compute, or verify it. Determinism becomes a metaphysical claim about lawful dependence, decoupled from predictability.  

  **If you insist on keeping (7):**  
  The strongest move is to *redefine determinism* as requiring *feasible predictability* for embedded observers. Then (8) holds: "determinism" (in this new sense) is empty in chaotic worlds. But you pay a price: the Lorenz system’s determinism (in the original sense) becomes irrelevant to physics—it’s merely a mathematical artifact with no physical counterpart.  

  ---

  ### On Quantum Indeterminacy  
  Your flatmate’s point *is* cheating here: quantum indeterminacy (if fundamental) makes (8) trivial by violating (1) outright. Chaos arguments target *deterministic* systems where predictability fails despite lawful uniqueness. Keeping (1) while attacking its substance is the harder, more interesting challenge.  

