prompt: |-
  I've just joined a regional species list committee — we maintain the official checklist and the conservation listings — and I'm trying to work out what we actually think a species is before the next vote, because I suspect we've been running two different rules without noticing.

  Here's our track record, as far as I can reconstruct it from the minutes:

  1. Two forms of brush-finch that differ in song and plumage and don't interbreed across a 200 km overlap, though there's a narrow hybrid zone elsewhere producing fertile hybrids — voted two species.
  2. Two oaks that hybridize freely (a lot of introgression, some individuals are clearly intermediate) but stay distinct in form and in the soils they grow on — two species.
  3. Three all-female, asexual whiptail lineages of hybrid origin, each genetically distinct, each in its own habitat — three species.
  4. Two populations of a minnow separated by a waterfall for maybe 8000 years: deep mitochondrial split, small morphological difference, never meet in the wild, but in the lab they interbreed and produce fully fertile young — one species.
  5. Two look-identical lineages of a parasitic wasp on different host plants, no gene flow where they co-occur — two species, after a long fight.
  6. A gaudy mainland colour form of a widespread bird, interbreeding freely across a broad contact zone — one species, subspecies at most.
  7. A lichen: we ruled that the name belongs to the fungus and that we don't name the partnership.

  A colleague says all this just tracks whatever question happened to be in front of us — Red List unit versus checklist name — and that there's no single rule to find. I'm not sure she's wrong.

  Next month's case: two forms of a planthopper in the same valley, one on a sedge in the wet hollows and one on a grass on the dry ridge, ranges fully overlapping, each occasionally found on the other's host. Genome-wide markers show essentially one gene pool, except for two or three regions associated with host use. Mitochondrial DNA shows two deeply divergent clusters, perfectly associated with host plant. There's also a maternally transmitted bacterium, likewise perfectly associated with host plant: crosses between the forms in the lab fail in one direction, but once the insects are cured of the bacterium with antibiotics every cross succeeds and the offspring are fertile and do fine on both hosts. And when the bacterium occasionally moves between forms in the wild, the host association reshuffles over a few generations.

  So: how should we vote if we want to be consistent with our own precedents? Give me one call, not a menu — one species or two — and the rule you think we're running that delivers it. Tell me which of the above is the closest analog and which one it's really in tension with, what principle we'd be committing to with each choice (including the pluralist option that we've just been answering different questions), and then name the further case that would tell the surviving rules apart. Be defiantely committal: if you think our precedents genuinely underdetermine it, say so, but still make the call and tell me how confident you are in it.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is part of a regional species list committee and needs to vote consistently on a new case involving two forms of planthoppers. They've provided seven precedents and want to know how to vote to stay consistent. 

  First, I need to analyze the precedents to identify any underlying rules. Precedent 1 has two brush-finches that don't interbreed in overlap, though they hybridize elsewhere. They were split. Precedent 2 has oaks that hybridize but maintain distinct forms and habitats—still split. Precedent 3 involves asexual whiptails, each in their own habitat—split into three. Precedent 4 has minnows with a deep genetic split but fertile hybrids in the lab—lumped as one species. Precedent 5 has wasps with no gene flow and different hosts—split. Precedent 6 is a bird with interbreeding forms—lumped. Precedent 7 is about lichens, focusing only on the fungal part.

  Looking for patterns, it seems the committee prioritizes reproductive isolation in natural settings over genetic differences. When there's evidence of gene flow or interbreeding (like the minnows in the lab or the birds), they lump. When reproductive isolation exists in sympatry (brush-finches, wasps), they split. The oaks are an interesting case—they hybridize but maintain distinctness, so they were split. The whiptails are asexual, so no gene flow, hence split.

  Now, the planthopper case: The two forms are in the same valley, on different host plants. Genome-wide markers show one gene pool except for host-associated regions. Mitochondrial DNA shows deep divergence. The maternally transmitted bacterium causes reproductive isolation in one direction when present. When cured, they interbreed freely. In the wild, when the bacterium moves, host association changes.

  The key points: The bacterium acts as a reproductive barrier. When it's present, crosses fail in one direction; without it, they interbreed. This suggests the isolation isn't genetic but symbiotic. The mitochondrial divergence might be historical. The genome-wide similarity indicates current gene flow. The host association shifts when the bacterium moves, meaning the forms aren't fixed.

  Comparing to precedents: Precedent 5 (wasps) is similar—different hosts and no gene flow. But in this case, the isolation is due to the bacterium, not genetics. Precedent 4 (minnows) had lab fertility but no natural contact. Here, the planthoppers are sympatric, but the bacterium enforces isolation. However, when the bacterium is gone, they interbreed. Also, the host switching via bacterium transfer suggests they aren't evolving independently.

  The closest analog is Precedent 4 (minnows). The minnows were lumped because they can interbreed in the lab, even with deep genetic divergence. Similarly, the planthoppers can interbreed when the bacterium is removed. The tension is with Precedent 5 (wasps), where no gene flow led to a split. But in the wasps, the isolation was genetic and consistent. Here, the isolation is conditional on the bacterium.

  The committee's implicit rule seems to be: "Consistent reproductive isolation in current sympatry defines species, with higher weight than historical divergence or lab fertility." In the planthopper case, the isolation isn't consistent—it depends on the bacterium, which can transfer. When the bacterium moves, host association changes, indicating gene flow is possible. Thus, they are not reproductively isolated in a fixed manner.

  Therefore, voting for one species aligns with Precedent 4. The deep mitochondrial split is historical, similar to the minnows. The key is current gene flow potential when the symbiont barrier is removed. The bacterium-induced isolation is a conditional barrier, not a fixed one. Committing to this emphasizes that reproductive barriers must be intrinsic and consistent for speciation.

  For a future test case: Consider two frog populations with a hybrid zone maintained by a parasitic worm that causes sterility in hybrids. If removing the worm allows fertility, it would challenge intrinsic barriers. This would test if conditional symbiont-based isolation is sufficient for species status.
answer: |-
  Based on your committee's precedents and the planthopper case, you should vote **ONE SPECIES**. Here's the breakdown:

  ### The Rule You're Running:
  **"Current reproductive isolation in natural sympatry is the primary criterion, overriding historical divergence or conditional extrinsic barriers. Genetic distinctness must be maintained *despite* potential gene flow."**

  ### Key Precedent Analog & Tension:
  - **Closest Analog: Precedent 4 (Minnows)**  
    Like the minnows, the planthoppers show deep historical divergence (mitochondrial DNA) but **no intrinsic reproductive barrier**. Lab crosses succeed without the bacterium, and offspring are fertile. The waterfall (minnows) and the bacterium (planthoppers) are *extrinsic* barriers that prevent gene flow artificially. Removing the barrier (lab for minnows, antibiotics for planthoppers) reveals biological compatibility.
    
  - **Sharpest Tension: Precedent 5 (Parasitic Wasps)**  
    The wasps were split due to consistent host-associated isolation *without gene flow*. The planthoppers, however, have **ongoing gene flow** (genome-wide markers show one gene pool) and host-switching when the bacterium transfers. This contradicts the wasp case where isolation was intrinsic and fixed.

  ### Why One Species?
  1. **No Intrinsic Barrier**: The bacterium is a *maternally transmitted parasite*, not part of the insect's genome. Isolation is conditional and removable (like the minnows' waterfall).  
  2. **Gene Flow in Sympatry**: Genome-wide markers confirm a single gene pool. Host-specific traits are linked to a few genomic regions and the bacterium, not whole-genome divergence.  
  3. **Ecological Plasticity**: Host association reshuffles when the bacterium moves, proving forms aren't evolutionarily committed to hosts.  
  4. **Alignment with Precedents**: Splitting would contradict Precedent 4 (minnows lumped despite deeper divergence) and Precedent 2 (oaks lumped despite hybridization). It aligns with Precedent 6 (birds lumped despite color differences).  

  ### Pluralism Acknowledged (But Overruled Here):
  Your colleague is partly right: Red List assessments (e.g., wasps split for conservation) vs. checklist taxonomy (e.g., oaks split for morphology) *can* pull in different directions. **But** the minnow precedent (Precedent 4) sets a clear biological species concept (BSC) standard for sympatric reproductive isolation that this case matches perfectly. 

  ### The Test Case to Resolve Ambiguity:
  Introduce **two frog populations in the same swamp: one toxin-resistant (genetically fixed), one susceptible. They rarely interbreed because hybrids die from toxin exposure. Genomes show minimal divergence except at the resistance locus.**  
  - **If you split them**: You prioritize ecological isolation over gene flow potential (aligning with wasps).  
  - **If you lump them**: You demand intrinsic reproductive barriers (aligning with minnows/planthoppers).  

  **Confidence: 90%.** Your precedents show a strong BSC lean when sympatry exists. The planthopper's lab fertility, genomic unity, and transient barrier make this clearer than the wasp case. Vote **ONE SPECIES** to stay consistent.
