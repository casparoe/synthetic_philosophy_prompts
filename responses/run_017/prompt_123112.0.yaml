prompt: |-
  hi — I host a small philosophy podcast, couple hundred listeners, long-form interviews, most of them know the basics of just war theory (jus ad bellum vs jus in bello, the war convention, Walzer-style defenses of the moral equality of combatants, McMahan-style revisionist attacks on it) but they're not specialists. Next week's guest is a fictional philosopher I've invented for a series on the equality debate, Dr. Naomi Reisz, and I need 8 to 10 interview questions that actually get into the machinery of her position instead of letting her restate it.

  Her view, for you to work with: she calls it the Stewardship View. She says the permission to kill in war isn't grounded in combatants' liability at all but in a distributive requirement — once a political community decides to settle a dispute by force, the expected costs of that decision have to fall on the people who voluntarily took on the role of being the community's instrument (combatants) rather than on civilians, and she says this holds regardless of whether the community's war is actually just. So you don't kill enemy soldiers because they're liable; you kill soldiers rather than civilians because that's where the risk is supposed to go. The distinctive bit is her Exit Condition: a combatant loses what she calls protected status not by becoming liable but by failing to take an available exit (surrender, refusal, desertion) once she's had what Reisz calls epistemic notice — evidence such that a reasonable member of her own side would judge the war probably unjust. The loss is scalar: more notice plus easier exit means more of the risk pool may be shifted onto her, up to and including permission to kill her when she poses no immediate threat at all, say asleep in barracks. She insists this still isn't liability, because the killing is answerable: the killer owes the dead combatant's family compensation, and acknowledgement, and an apology, which she says you wouldn't owe for killing someone who really was liable.

  I want questions that press where the literature would press, each with a follow-up keyed to the reply she's most likely to give. She deflects really well with the phrase "that's a wrinkle, not a counterexample", and I'd like the sequence to make that progressively harder to reach for. At least one question each on: whether the distributive story just collapses into liability (she'll say it's role-occupancy, not desert — so go after whether voluntarily choosing the role is the responsibility-based liability revisionists talk about, and ask why the civilians who voted for and cheered the war aren't in the risk pool, the complicity-style worry); whether her view ends up permitting deliberate attacks on civilians in cases where that would save more lives overall (she'll say the requirement is deontic, not aggregative — follow up by asking how an aggressor state's unjust decision to use force can generate permissions for its own soldiers); how much evidence epistemic notice actually requires given that ordinary soldiers know nearly nothing and intelligence is filtered (she'll appeal to what's reasonable for them — follow up on whether real notice is so rare that the Exit Condition is idle and her view just is Walzer's, or so common in a blatant war of conquest that it just is the revisionist asymmetry, leaving her own position only the narrow middle band); whether the killer needs to know that the target had notice, and if not whether a blameless killer really owes compensation and apology in a way that distinguishes this from the standard treatment of innocent threats; whether the just side's soldier who gets notice of her own side's atrocities and doesn't quit also loses protected status (if yes: in a war where both sides have notice, everyone may kill everyone, which is definately not the equality people find attractive); and asymmetric exit costs — soldiers in authoritarian armies who face execution or punishment of their families for deserting have the hardest exit and hence the most protection, which inverts the usual intuition about aggressive armies. If you've got room, one on where a drone operator who never recieves any risk herself sits in the risk pool. Also one somewhere on what she thinks the equality claim even is — equality of rights, of permissibility, of blame, or of liability — and whether permission-with-answerability isn't just the revisionist's "acts wrongly but excused" with extra steps.

  Finish with one question about what evidence or argument could actually count against the view. Please don't build any question around her having read some particular paper — she's made up, and I don't want citations or reading lists in there.
reasoning: |-
  Okay, the user hosts a small philosophy podcast focusing on just war theory debates. They've created a fictional philosopher, Dr. Naomi Reisz, who proposes a "Stewardship View." The core idea is that the permission to kill in war isn't based on combatants' liability but on a distributive requirement—risks should fall on those who volunteered as instruments of their community. She introduces an "Exit Condition" where combatants lose protection if they fail to leave after having "epistemic notice" that their war is probably unjust. The user wants 8-10 questions that dig into the mechanics of her view, avoiding restatements, and pressing where the literature would challenge her.

  First, I need to break down Dr. Reisz's position. The Stewardship View shifts from liability to distribution. Combatants are in the risk pool because they chose the role, not because they deserve harm. The Exit Condition is key: losing protection based on notice and available exit. Her distinction from liability is that killers owe compensation/apology, which isn't required for liable targets. The user listed several areas to cover: collapse into liability, permissibility of attacking civilians, epistemic notice thresholds, killer's knowledge, both sides having notice, asymmetric exit costs, drone operators, and the equality claim's nature. Also, a final question on what could falsify her view.

  The user emphasized avoiding citations and focusing on tough follow-ups. Dr. Reisz tends to deflect with "that's a wrinkle, not a counterexample," so the questions need to corner her progressively. Each question should have a follow-up anticipating her reply. For instance, on liability, she might argue role-occupancy vs. desert. The follow-up could challenge why civilians aren't included or if voluntary choice implies responsibility akin to revisionist liability.

  Next, the distributive requirement's deontic nature. If she rejects aggregation, how does an aggressor state's unjust decision permit its soldiers to be targeted? This ties into how permissions are generated. The epistemic notice issue: what's reasonable for soldiers with limited info? If notice is too rare or common, her view collapses into Walzer's or revisionism. Follow-ups need to push on the middle ground's viability.

  The killer's knowledge is crucial. If they don't know the target had notice, is compensation still owed? This challenges the answerability aspect and blurs lines with innocent threats. Both sides having notice could lead to universal permissibility, undermining moral equality. Asymmetric exit costs might protect authoritarian soldiers more, conflicting with intuitions about aggressors. Drone operators add complexity to the risk pool since they face no physical risk.

  The equality claim question needs to clarify if her permission-with-answerability is just revisionist excuses with extra steps. Finally, falsifiability: what evidence would challenge her view? This forces her to define testable conditions.

  I should structure each question with a main and follow-up, covering all user-specified areas. Ensure questions are tight, pressing the weaknesses without letting her deflect. For example, on civilian attacks, her deontic stance might not explain why an unjust decision creates permissions. On notice thresholds, push whether her reasonable soldier standard is feasible in real intel environments. For exit costs, highlight the perverse incentive where harsh regimes' soldiers are more protected. Drone operators question the role of risk exposure in her distribution model.

  The sequence should escalate in difficulty. Start with liability collapse, move to practical applications (civilians, notice), then to contradictions (both sides notice, exit costs), and end with falsifiability. Each follow-up should reference her likely responses and corner her. For instance, after her appeal to reasonable judgment, ask about intel manipulation making notice impossible. Or when she distinguishes answerability from liability, question if unknowing killers' obligations still hold, blurring with innocent threats.

  Also, ensuring the questions don't require prior knowledge of specific papers, as per the user's request. Use general philosophical arguments instead. Finally, the last question on falsifiability tests the robustness of her theory. Need to ensure all user points are covered within 8-10 questions without overlap.
answer: |-
  Here are 10 tightly focused interview questions with anticipated deflections and hard-hitting follow-ups designed to probe the machinery of Dr. Reisz's Stewardship View, pushing beyond restatement and making "that's a wrinkle" harder to sustain:

  1.  **The Liability Collapse (Complicity & Choice):** "Dr. Reisz, you ground the permission to kill solely in the distributive assignment of risk to the *role* of combatant, explicitly rejecting liability. But doesn't voluntarily choosing that role – especially in a democracy where citizens broadly support or vote for war – constitute a form of responsibility-based liability that revisionists like McMahan describe? Isn't 'taking on the role of the community's instrument' simply another way of saying 'making oneself liable by complicity'?"
      *   *Anticipated Reply:* "No, it's fundamentally different. Liability is about desert for wrongdoing. This is about the functional assignment of risk based on social role occupancy, regardless of the justice of the cause or individual desert. Choosing the role accepts the *structured risk assignment*, not liability per se."
      *   **Follow-Up:** "If the permission stems from the *community's decision* to settle by force, why aren't the civilians who voted for, advocated, or materially supported that war decision *also* in the risk pool? Doesn't your focus solely on the combatant role functionally absolve the citizenry whose collective will initiated the force, turning soldiers into a kind of sacrificial buffer *for* potentially culpable civilians?"

  2.  **Deontology vs. Aggregation & the Aggressor's Permission:** "Your distributive requirement is explicitly deontic – risk *must* fall on soldiers, not civilians, regardless of consequences. But imagine an aggressor state where targeting a *single* key civilian logistician (knowingly involved) could demonstrably shorten the war and save thousands of lives, both military and civilian. Doesn't pure adherence to your rule forbid this, even if it seems catastrophically counterproductive? How do you justify such a strong constraint?"
      *   *Anticipated Reply:* "Exactly. The requirement is a side-constraint, not subject to aggregation. Permissibility arises from the *structure* of how communities must distribute the awful costs of their collective force decisions. Targeting civilians violates that structure fundamentally, even for good consequences."
      *   **Follow-Up:** "That raises a deeper structural puzzle: *How* does an *unjust* decision by Community A to use force generate a *permission* for Community B to kill A's soldiers? If A's decision is wrongful, why does it create *any* morally binding distributive framework (soldiers bear risk) for B? Doesn't this imply that the aggressor's unjust act magically creates permissions *for the defender* that wouldn't otherwise exist? How is that justified?"

  3.  **Epistemic Notice Threshold & the Vanishing Middle Ground:** "Epistemic notice requires evidence such that a 'reasonable member of her own side' would judge the war 'probably unjust'. Given the reality of propaganda, controlled information flows, fog of war, and the ordinary soldier's limited access to strategic intelligence, isn't this threshold either impossibly high or trivially low? Couldn't we argue that in most conflicts, notice is *so rare* (due to info control) that your Exit Condition never bites, making your view indistinguishable from Walzer's equality, or *so common* in blatant aggression (e.g., naked conquest) that it collapses into revisionism, leaving your distinctive view only relevant in a vanishingly narrow band of wars?"
      *   *Anticipated Reply:* "The 'reasonable member of their own side' standard is crucial. It accounts for information access and cultural context. It avoids demanding unrealistic omniscience while still setting an objective bar based on what evidence *is* reasonably available within their epistemic community."
      *   **Follow-Up:** "But doesn't this standard risk being *manipulated by the state*? If a state successfully floods its soldiers with propaganda and restricts dissent ('This is defensive! They hate our freedom!'), then *by your own standard*, what's 'reasonable for their side' might be profoundly unreasonable objectively. Doesn't this mean a soldier in a blatantly aggressive army could easily *lack* 'notice' *precisely because* their state has expertly manipulated their epistemic environment, thus retaining full protected status unjustly? How is this fair or functional?"

  4.  **The Killer's Knowledge & Answerability's Bite:** "When a combatant kills an enemy soldier who *had* met your Exit Condition (had notice + failed to exit), does the *killer* need to *know* or have reason to believe that the target had lost protected status for the killing to be permissible under your view? Or is the permissibility objective, based purely on the target's status regardless of the killer's knowledge?"
      *   *Anticipated Reply:* "Permissibility is objective – it hinges on the target's actual status (protected or not). The killer's knowledge affects *blameworthiness* for the act, not its permissibility per se. If the target had lost status, it's permissible to kill them, even if the killer didn't know why."
      *   **Follow-Up:** "But you say the killer *owes* compensation and apology to the dead soldier's family precisely because this isn't liability killing. If the killer was entirely blameless – perhaps even reasonably believed the target *was* protected, or had no possible way to know about the notice – why does *that* killer still owe compensation and apology? Doesn't this 'answerability' look suspiciously like treating the blameless killer as having done something *pro tanto* wrong, akin to killing an innocent threat, precisely blurring the distinction you want from liability?"

  5.  **Symmetry of Notice & the Equality Wrecking Ball:** "Let's say a soldier on the *just* side gains 'epistemic notice' that *their own side* is committing significant atrocities or fighting in a clearly unjust manner (e.g., disproportionate force, targeting civilians). According to your Exit Condition, if they don't surrender, desert, or refuse, *they* lose protected status too, correct? Meaning enemy combatants are now permitted to kill them, even if they pose no immediate threat?"
      *   *Anticipated Reply:* "Yes, that follows from the principle. Protected status depends on occupying the combatant role *without* having triggered the Exit Condition by failing to leave after notice. It applies symmetrically."
      *   **Follow-Up:** "But consider a conflict where *both* sides have committed atrocities or where the fog of war makes 'probable injustice' judgments plausible on both sides. If significant numbers on each side gain notice yet remain (due to loyalty, fear, etc.), doesn't your view entail that *all* combatants lose protected status? Suddenly, *everyone* may kill *everyone else*, regardless of immediate threat or original justice. This universal 'free-fire zone' seems like the *opposite* of the moral equality of soldiers that motivated Walzer and is a far cry from the asymmetry revisionists propose. How is this a stable or attractive feature?"

  6.  **Asymmetric Exit Costs & the Authoritarian Advantage:** "Your Exit Condition makes the loss of protection (and thus, how much risk can be shifted onto a soldier) *scalar*, depending on the *ease* of exit. Soldiers in authoritarian regimes face severe penalties for desertion – execution, torture, reprisals against family. Therefore, exit is maximally *hard* for them, meaning they retain *maximal* protected status under your view. Conversely, soldiers in liberal democracies with strong protections for conscientious objectors have *easier* exit, making them potentially *less* protected. This seems to invert the intuitive moral asymmetry – the soldier coerced into fighting for an aggressive dictator is *more* protected than the volunteer fighting justly for a democracy. How is this not perverse?"
      *   *Anticipated Reply:* "The ease of exit is judged relative to the reasonable expectations and risks within *their* societal context. The requirement is to take *available* exit; if the cost is extreme (death/family harm), it may functionally negate availability. The scalar element reflects the *degree* to which they *could* reasonably be expected to exit given their circumstances."
      *   **Follow-Up:** "But doesn't this create a deeply counterintuitive incentive? An *aggressor* state can actually *enhance* the protected status of its own soldiers – shielding them morally from being targeted – precisely *by* making exit prohibitively dangerous through brutal repression. The more unjust and coercive the regime, the safer its soldiers become under your distributive scheme. How does this align with the aim of distributing the costs of the *decision to use force* fairly?"

  7.  **The Riskless Instrument (Drone Operators):** "Where do combatants like drone operators, cyber warriors, or artillery crews far behind lines sit within your 'risk pool'? They voluntarily took on the role of the community's instrument of force, but they receive virtually none of the physical risk traditionally distributed onto soldiers. Does their lack of direct risk exposure undermine their place in the pool, or does the role itself suffice? If they *are* in the pool, does the permission to kill them persist only if *they* fail the Exit Condition, even though they pose no immediate physical threat to anyone?"
      *   *Anticipated Reply:* "The role defines inclusion in the risk pool, not the immediate physical exposure. They are instruments of the community's force decision. Therefore, they are legitimate targets *because* of their role, provided they haven't lost protected status via the Exit Condition. The 'risk' includes the risk of being targeted as a function of their role."
      *   **Follow-Up:** "But doesn't this highlight a tension? If the *justification* for distributing risk onto soldiers is to *protect civilians from harm*, what is the distributive purpose of targeting a riskless drone operator? Killing them doesn't shift risk *away* from civilians onto a group already bearing risk; it *introduces* lethal risk onto someone who wasn't facing it, solely because of their role. How does this fit the core distributive logic?"

  8.  **Equality of What? (Permission vs. Answerability):** "You position the Stewardship View as an alternative to both Walzer's equality and McMahan's asymmetry. But let's clarify the 'equality' claim itself. What kind of equality does your view actually preserve between just and unjust combatants? It's clearly not equality of liability (you reject that). Is it equality of *permissibility* (may be killed)? But your Exit Condition breaks that symmetry. Is it equality of *blame*? Or is it merely that both occupy a role that *initially* confers the same status ('protected')? And crucially, isn't your 'permission-with-answerability' (compensation/apology owed) functionally identical to the revisionist stance that killing unjust combatants is *permissible* but killing just ones is merely *excused*? Isn't the 'answerability' just the excuse's requirement for reparations dressed differently?"
      *   *Anticipated Reply:* "It preserves the initial default equality of *protected status* based solely on role occupancy, prior to individual factors like notice triggering the Exit Condition. This is distinct from both Walzer's blanket permission and McMahan's asymmetry. Answerability is *not* an excuse; an excuse negates blame but acknowledges wrongfulness. Answerability here acknowledges the *tragic necessity* of acting within the distributive framework – the killing is *permissible* under the rules, but we still owe acknowledgement of the loss precisely because it *wasn't* a liability-based desert."
      *   **Follow-Up:** "If the killing is *permissible* (not wrongful), why is compensation and apology *owed*? We don't typically owe compensation for permissibly killing, say, a rabid dog or destroying property in a justified emergency. Doesn't the *demand* for compensation implicitly concede that something morally significant was taken – a 'right' or a 'status' – that wasn't forfeited by liability? And doesn't *that* sound very much like acknowledging the target wasn't fully liable, requiring excuse-like reparations?"

  9.  **The Sleeping Soldier & Immediate Threat:** "The scalar nature of protection loss culminates in permission to kill a soldier with maximal notice and easy exit who poses *no immediate threat* – say, asleep in their barracks. You justify this as shifting the risk pool onto the appropriate bearer. But doesn't this look indistinguishable from punishment or assassination? How is this fundamentally different from saying they *deserve* to be killed for failing to exit, i.e., liability? And doesn't permitting such 'non-confrontational' killing dramatically lower the threshold for lethal violence compared to the immediacy usually required in self-defense or even traditional jus in bello?"
      *   *Anticipated Reply:* "It's not about desert. It's about the distributive consequence of their role occupancy *combined* with their failure to exit when the cost-shifting rationale for their protection evaporated. They remain functional instruments of the unjust force. Killing them in this state is a tragic consequence of the distributive framework, not punitive."
      *   **Follow-Up:** "If it's not punitive (desert-based), and it's not defensive (no imminent threat), what *positive moral principle* directly licenses intentionally killing a helpless, non-threatening person beyond the mere assertion of a 'distributive consequence'? Doesn't this lack of a grounding principle *other* than the framework itself risk making the framework seem arbitrary or unmoored from deeper moral constraints against harming the helpless?"

  10. **Falsifiability and the Burden of Proof:** "Finally, Dr. Reisz, what kind of evidence, argument, or real-world implication would genuinely count as a *counterexample* to the Stewardship View, making you reconsider its core tenets? What would demonstrate that role-based distribution *isn't* the fundamental ground of permission, or that the Exit Condition *doesn't* work as a modifier, or that answerability *fails* to distinguish this from liability?"
      *   *Anticipated Reply:* (Likely focuses on internal coherence or core intuitions) "A demonstration that the distributive logic fundamentally conflicts with a more bedrock deontological constraint that cannot be overridden. Or evidence that the Exit Condition is *necessarily* either so under-demanding it licenses excessive violence or so over-demanding it's inert. Or a conclusive argument showing that 'answerability' is logically incoherent within a framework of permission."
      *   **Follow-Up:** "Given those criteria, isn't there a risk that the view becomes unfalsifiable in practice? Couldn't defenders *always* argue that intuitions about, say, killing sleeping soldiers or protecting coerced aggressors, while uncomfortable, simply reflect the tragic necessity of the framework, or that any problematic case is just a 'wrinkle' in applying the reasonable notice/exit standards? How do we *test* whether the core distributive move is doing the justificatory work you claim?"

  **Sequence Rationale:** Starts with core liability/distribution tension (Q1), then tests practical implications (Q2) and justifications (Q2-FU). Q3 & Q4 pressure the operational heart (Notice & Answerability). Q5 & Q6 expose destabilizing symmetries and perverse incentives. Q7 tests scope. Q8 clarifies foundations. Q9 presses the hardest case. Q10 forces meta-reflection on the view's status. Follow-ups are designed to anticipate replies and push towards contradictions, impracticalities, or counterintuitive implications that challenge the view's coherence and distinctiveness. Good luck with the interview!
