  ### Newcomb's Problem Decision Tree  
  **Starting Commitment:** You face a Newcomb problem. The Predictor has been correct in 99% of recorded cases involving people you regard as relevantly similar, and you have no evidence of being an exception.  

  ```mermaid
  flowchart TD
      A["Baseline: Opaque boxes, $1000 visible. Predictor's mechanism unspecified. What do you take?"] 
      -->|One box| B["Bypass Predictor: Accuracy due to a neurological marker causing both box contents and your choice. What do you take?"]
      -->|One box| B1["Evidential Decision Theorist: Take one box wherever taking it is strong evidence for $1M."]
      B -->|Both boxes| B2["Unnamed: Take one in Baseline, both in Bypass."]

      A -->|Both boxes| C["Feedback Machine: Opaque box contents produced by a device causally downstream of your choice. What do you take?"]
      -->|One box| D["Vault: Predictor runs a simulation of you, fills box, erases it. What do you take?"]
      -->|One box| D1["Reasoning-Dependent One-Boxer: Take one box only if contents depend on your reasoning."]
      D -->|Both boxes| E["Self-Modification: For a fee, replace reasoning with a one-box procedure. Pay fee?"]
      -->|Yes| E1["Self-Modification Proponent: Take both boxes, but arrange to be a one-boxer beforehand."]
      E -->|No| E2["Causal Decision Theorist: Take both boxes because contents are fixed."]

      C -->|Both boxes| F["Consistent Two-Boxer: Always take both boxes, regardless of mechanism."]
      
      A -->|Underdetermined| G["Skeptic: Stipulations underdetermine choice; need more details."]
  ```

  ---

  ### Dimensions of Variation & Leaf Locations  
  **Dimensions:**  
  1. **Prediction Mechanism:** Statistical (Baseline, Register), Causal (Feedback), Neurological (Bypass), Simulation (Vault).  
  2. **Agency:** Can reasoning influence contents? (Vault: Yes; Bypass: No).  
  3. **Intervention:** Pre-choice self-modification option (Self-Modification).  
  4. **Transparency:** Seeing contents before choice (Open Box).  
  5. **Reliability:** Trust in Predictor’s accuracy (Register: Low).  

  **Leaf Locations in the Space:**  
  - **Evidential (B1):** One box if taking it is evidence for $1M (all cases).  
  - **Reasoning-Dependent (D1):** One box only if contents depend on reasoning (Vault: Yes; others: No).  
  - **Self-Modification Proponent (E1):** Take both at choice, but pay fee to become a one-boxer.  
  - **Causal (E2):** Both boxes if contents fixed (Baseline, Bypass, Vault); one box if choice causes contents (Feedback).  
  - **Consistent Two-Boxer (F):** Both boxes always.  
  - **Skeptic (G):** No verdict in any case; underdetermined.  
  - **Unnamed (B2):** One box in Baseline, both in Bypass.  

  **Unoccupied Combinations & Diagnosis:**  
  1. *Take one box in Feedback + Refuse fee in Self-Modification:* **Incoherent** (Feedback rewards one-boxing; refusing fee loses $1M).  
  2. *Take both in Vault + Pay fee in Self-Modification:* **Unexplored** (No theory endorses costly self-modification for no gain).  

  ---

  ### Verification Table  
  | Leaf                              | Baseline | Bypass | Feedback | Vault | Self-Modification (Pay fee?) |  
  |-----------------------------------|----------|--------|----------|-------|------------------------------|  
  | Evidential (B1)                   | One      | One    | One      | One   | Yes                          |  
  | Reasoning-Dependent (D1)          | Both     | Both   | One      | One   | No                           |  
  | Self-Modification Proponent (E1)  | Both     | Both   | Both     | Both  | Yes                          |  
  | Causal (E2)                       | Both     | Both   | One      | Both  | No                           |  
  | Consistent Two-Boxer (F)          | Both     | Both   | Both     | Both  | No                           |  
  | Skeptic (G)                       | —        | —      | —        | —     | —                            |  
  | Unnamed (B2)                      | One      | Both   | One      | Both  | No                           |  

  **Indistinguishable Leaves & Separator:**  
  - **Self-Modification Proponent (E1) vs. Causal (E2):** Agree on all cases. *Minimal separator: Add Open Box case (see contents before choice; both take both boxes).*  
  - **Consistent Two-Boxer (F) vs. others:** Separated by Feedback Machine (F takes both; others take one or abstain).  

