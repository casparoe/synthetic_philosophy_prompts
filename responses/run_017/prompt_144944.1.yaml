  **Note:** The tree uses 8 nodes (start + 7 cases). Baseline, Bypass, Feedback, Vault, and Self-Modification are required/used; Open Box and Register are omitted for brevity but may resolve ambiguities (e.g., Skeptic). "—" denotes no verdict.
