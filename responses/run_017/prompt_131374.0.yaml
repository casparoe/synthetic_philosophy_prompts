prompt: |-
  I've been going in circles for about a year on a question in metaontology, and what I want from you is not a verdict on the first-order dispute but a diagnosis of why the second-order one never moves.

  Here is the standoff as I experience it. Take an ordinary-looking ontological dispute — whether there are composite material objects, or whether there are numbers. Camp A says that once each side's semantic conventions are made fully explicit, the appearance of a factual clash dissolves: the parties are proposing different candidate meanings for the quantifiers and the relevant idioms, no one candidate is privileged over the others, and the choice among them is settled, if at all, by expressive power, simplicity, or practical convenience rather than by how the world is. Camp B says that there is a fact of the matter about how the world is structured, that a quantificational apparatus either matches that structure or fails to, and that Camp A's central thesis — that there are many equally good candidate meanings and no privileged one — is itself advanced as a true claim about meaning, not as a piece of semantic bookkeeping. Each camp's reply to the other's main argument has been stable for a long time. Camp A says Camp B's notion of structure can never be stated non-circularly and so does no work in an explanation. Camp B says Camp A is performatively inconsistent, since the thesis that ontological disputes are merely verbal is not itself offered as merely verbal.

  I have two hypotheses and I want them tested rather than indulged. The first is that the two camps are running different tests for substantiveness and neither notices. Call world-sensitivity the question whether the answer would vary with how the world is, holding language fixed; call consequence-sensitivity the question whether the answer constrains anything downstream, such as which inferences from ordinary sentences are licensed or which enquiries are worth pursuing. A dispute can score low on the first and high on the second, and my sense is that Camp A tests only for the first while Camp B's arguments actually trade on the second. If so, this is two questions under one heading. The second hypothesis is deeper: that both camps accept a bipartite taxonomy in which any dispute must be either about the world or about words, and that this shared presupposition is what keeps the exchange on rails. If there is a third thing a dispute can be — say, a dispute about which representational scheme to adopt, where schemes differ in genuine virtues but not in world-sensitivity — then I want to know whether Camp A collapses into it, whether Camp B can accommodate it, or whether it is a genuinely distinct position that nobody has occupied.

  I also want to know whether the diagnosis has to be uniform. The composite-objects case and the numbers case seem to me to differ: in the first it is arguable that something hangs in the balance for ordinary assertions, in the second it is arguable that nothing does beyond the structure claim itself. If the right answer is that this is really several disputes sharing a name, that is itself the diagnosis and I want it argued for.

  So: which of these is right, what am I missing, and why? Argue from what each side actually claims rather than from labels, and tell me what, on your diagnosis, would count as progress — a distinction, a formal result, a reframing of the question, a changed burden of proof — or else argue that no progress should be expected and say why. I have read the literature, so please do not summarise positions, attribute claims to particular papers or books, or give me anything bibliographic; engage the arguments themselves. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of my question. British English in your answer, please.
reasoning: |-
  Okay, let me tackle this user's metaontological puzzle. The core frustration seems to be about a perpetual standoff between two camps where each rebuts the other without resolution. The user presents two hypotheses: one about different tests for substantiveness (world-sensitivity vs consequence-sensitivity), and another about a shared false dichotomy. 

  First, I need to verify if the camps truly talk past each other using different substantiveness metrics. Camp A's focus on whether answers vary with the world while holding language fixed does seem to align with world-sensitivity. Meanwhile, Camp B's insistence that ontological claims constrain downstream inferences or enquiries maps neatly onto consequence-sensitivity. This explains why their arguments never connect - they're measuring different things.

  The deeper issue about the shared bipartite taxonomy feels more significant. Both camps assume disputes must be either about the world or words, leaving no room for a third category like representational scheme choice. This shared framework traps them in circular rebuttals: Camp A accuses Camp B of circularity while Camp B charges Camp A with performative contradiction. 

  What's revealing is how the user notes this might vary across cases. For composite objects, consequence-sensitivity matters because ordinary assertions about "tables" could be affected. For numbers, the stakes may be confined to the structure claim itself. This suggests the standoff isn't uniform - the camps might be partially right in different domains.

  Progress would likely come from abandoning the either-or framework and developing a meta-language that can simultaneously accommodate world-sensitivity, consequence-sensitivity, and pragmatic virtues. Distinguishing cases by their consequence-sensitivity stakes could shift burdens of proof situationally. The key is rejecting the forced choice that makes each camp's criticism automatically "sticky."
answer: |-
  Your second hypothesis is correct: the standoff persists because both camps share an inadequate bipartite taxonomy that forces them to talk past each other, but progress requires distinguishing consequence-sensitivity from world-sensitivity and accepting that representational choices constitute a distinct category.

  Camp A tests solely for world-sensitivity: they demand that a dispute’s resolution must depend on non-linguistic facts, holding semantic rules fixed. When they find that rival quantifier meanings yield identical truth conditions for all non-ontological claims (e.g., "there is a table" remains true whether composites exist or are paraphrased away), they conclude the dispute is verbal. Camp B, however, invokes consequence-sensitivity: they argue that ontological commitments constrain legitimate inferences, explanations, and further enquiry (e.g., denying numbers forces reconstrual of mathematical physics, accepting composites licenses causal explanations). Their "structure" claim is meant to explain why these downstream consequences arise—it’s not merely about language, but about what the world *licenses us to say* without paraphrase. Camp A dismisses "structure" as circular because it requires quantification to define; Camp B’s performative inconsistency charge misfires because Camp A’s meta-claim *is* world-sensitive (it concerns what variations in language, not world, settle the dispute).

  The shared error is assuming any substantive dispute must be *either* world-representing *or* language-legislating. This ignores the third option: choosing a representational scheme based on virtues like inferential fertility, explanatory depth, or conceptual economy—virtues that aren’t reducible to truth-conditions but aren’t arbitrary conventions either. Camp A flirts with this by invoking "expressive power" but wrongly equates it with non-substantiveness. Camp B implicitly relies on it when treating "matching structure" as enabling genuine explanation, but cannot articulate it without ontological inflation.

  Progress would come from:
  1. **Formally distinguishing consequence-sensitivity**: Showing how ontological frameworks differ in which ordinary assertions they preserve *without paraphrase*, and what new inferences they enable (e.g., nihilism about composites may require paraphrasing "the chair broke" as about particles, blocking certain causal claims).
  2. **Reframing the central question**: Instead of "what exists?", ask "which quantificational framework optimally balances world-sensitivity, inferential power, and simplicity for our epistemic aims?" This treats framework choice as having cognitive stakes without requiring a "privileged" ontology.
  3. **Varying burdens of proof**: In cases like composite objects, where paraphrases affect everyday explanations (consequence-sensitivity is high), Camp B’s demand for downstream justification gains traction. For numbers, where mathematical practice may be preserved extensionally (consequence-sensitivity is low), Camp A’s deflationism becomes plausible. The dispute isn’t uniform.

  Diagnosis isn’t uniform because composite debates often involve empirical consequences (e.g., whether a statue’s survival depends on its microphysical arrangement), while number disputes typically concern the indispensability of mathematical entities to science—a question of explanatory virtue. Recognising this dissolves the illusion of a single "metaontological" problem. No progress occurs because both camps attack a caricature: Camp A ignores the inferential constraints Camp B cares about, while Camp B conflates those constraints with literal truth. Adopting the third space—evaluating frameworks by their cognitive virtues—allows both insights to coexist without contradiction.
