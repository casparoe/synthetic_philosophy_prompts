          If I take: 
              - With 98%: the other is independent and rational -> they take too (by the standard backward induction) -> I get 5.
              - With 2%: the other is duplicate -> they take too -> I get 5.
              So expected value: 5.
          If I pass:
              - With 98%: the other is independent and rational -> they take at round 1? Actually, in the standard backward induction, the independent rational agent would take at round 1. But if they take at round 1, then I get 40% of 10 = 4.
