     Where might people disagree? Some might argue that in the duplicate variant, the agents cannot commit to future actions. Therefore, at round 100, they will pass (as shown) but at round 99, if they believe that at round 100 they will pass, then they pass. But what if they are not sure about their own future rationality? However, the setup assumes rationality at every step. Another point of disagreement: some might hold that in the non-duplicate game, if there is any chance of correlation, then backward induction breaks down. But that is a feature: the standard backward induction outcome is fragile.

