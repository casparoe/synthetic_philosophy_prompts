prompt: |-
  I have to write a guidance note for a clinical ethics committee that is being asked to approve a consent form for a corpus callosotomy. The sticking point is how the operation's effect should be described to the person signing it: as dividing one subject of experience into two, as leaving one subject whose experience has become in some way fragmented, or as leaving the number of subjects genuinely unsettled. Before I write anything about what the evidence actually shows, I want the specification. So: what would a theory of the unity of consciousness have to deliver in order to be good enough for that decision?

  Give me the desiderata list — the phenomena it must account for, the cases it must get right, the distinctions it must respect, the findings it must not contradict — with the case or consideration behind each requirement, and each requirement marked either non-negotiable or a preference of one camp over another.

  Some things I want covered, though add what I've missed:

  - The question how many subjects there are and the question whether a subject's experience at a time is unified are different questions. Keep them apart, say what would settle each, and tell me which one the committee actually needs an answer to.
  - Whether unity is synchronic or diachronic or both, whether it is transitive, and whether it admits of degrees. Give a case that would discriminate.
  - The staged-section case. Suppose the commissure were sectioned in stages over several weeks under local anaesthesia, with the patient asked each day what has changed. What should a theory predict the patient can report midway through, and what should we conclude if the patient reports no change at all — that unity is not a phenomenal matter, or that first-person report is not a reliable instrument here? Either way, the theory should tell me what to ask.
  - The long-project case. Much is made of inter-manual conflict, but suppose instead we had evidence, after full section, that the two streams each sustained a different ranking of the patient's long-term projects and acted on it where it could — different verdicts on where to live, whom to trust, whether to continue with a hazardous treatment. Is that one subject with conflicting aims or two sources of consent? Which requirement on your list settles it, and is that requirement one we should have been confident of in advance?
  - Consistency with the cases that make the naive "one hemisphere, one subject" story untenable: people who have had a hemisphere removed, or who were born without a callosum, and who do not present as fragmentary; the temporary unilateral disconnection produced when one hemisphere is anaesthetised for cortical mapping; and the widely repeated observation that patients after full commissurotomy do not, on the whole, behave like two agents sharing a body.
  - Whether a verdict must be determinate in every case, or whether the theory may return "vague" or "no fact of the matter" — and what it costs a consent form if it may.
  - Whether unity must make a difference to what it is like, or whether it can be cashed out in terms of access, agency, or one experience's being a proper part of another.

  Then flag any subset of the desiderata you think cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest share of candidate theories. Finally, a short scorecard: three or four lines each on the co-consciousness account, the mereological or subsumptive account, the view that unity is really availability to a single workspace or attentional system, and the view that there is no substantial unity to be had.
reasoning: |-
  We are constructing a list of desiderata for a theory of the unity of consciousness to be used in guiding the description of the effects of corpus callosotomy in a consent form. The focus is on what the theory must account for and what it must get right. We also need to flag any conflicts among desiderata and identify the most challenging requirement.

  The key issues are:
  1. Distinguishing between the number of subjects and the unity of a subject's experience at a time.
  2. The nature of unity (synchronic, diachronic, transitive, degrees).
  3. The staged-section case and the reliability of first-person reports.
  4. The long-project case and whether conflicting long-term projects indicate one subject with conflict or two subjects.
  5. Consistency with cases that challenge the naive "one hemisphere, one subject" view.
  6. Whether the theory must deliver a determinate verdict or can be vague, and the implications for the consent form.
  7. The basis of unity (phenomenal, access-based, agential, mereological).

  We also need a short scorecard for several accounts.

  ---

  **Desiderata for a Theory of the Unity of Consciousness**

  **1. Distinction between the number of subjects and the unity of experience (Non-negotiable)**
     - **Requirement**: The theory must clearly distinguish between (a) the question of how many subjects of experience exist and (b) the question of whether a given subject's experience at a time is unified. It must specify what evidence would settle each question.
     - **Case/Consideration**: The committee needs to know whether the surgery results in one subject with fragmented experience or two subjects. The consent form must accurately reflect the state of the subject(s) post-surgery. The committee primarily needs an answer to the number of subjects because the consent form is about the person(s) who will experience the outcomes. However, the unity of experience is also critical for understanding the quality of life and potential conflicts.
     - **Settling the questions**:
       - *Number of subjects*: Might be settled by evidence of independent agency, distinct first-person perspectives (e.g., independent reports from each hemisphere), or the presence of two separate streams of consciousness that do not interact.
       - *Unity of experience*: Might be settled by whether all the experiences at a given time (e.g., visual, auditory, tactile) are bound together into a single phenomenal field or are segregated.

  **2. Nature of unity: synchronic, diachronic, transitive, and degrees (Non-negotiable)**
     - **Requirement**: The theory must specify whether unity is primarily synchronic (at a single time) or diachronic (over time) or both, whether it is transitive (if A is unified with B and B with C, then A with C), and whether it admits of degrees (partial unity). It must provide a case that discriminates between these possibilities.
     - **Case/Consideration**: In the context of corpus callosotomy, we are concerned with synchronic unity because the surgery disrupts the integration of simultaneous experiences. However, diachronic unity might be relevant for personal identity over time. Transitivity is important because if unity is not transitive, then even in a normal brain, there might be multiple centers of consciousness. Degrees of unity might explain partial disconnection.
     - **Discriminating case**: Consider a patient with partial callosal section. If the patient reports that the left visual field and right visual field are still unified but less so than before, that would suggest degrees of unity. If the patient reports that the left and right visual fields are entirely separate, that would suggest an all-or-nothing unity. Transitivity can be tested by having three stimuli: one in the left visual field (LVF), one in the right (RVF), and one in the center. If the LVF stimulus is co-conscious with the center and the center with the RVF, but the LVF and RVF are not co-conscious, then unity is not transitive.

  **3. Staged-section case and reliability of first-person report (Non-negotiable)**
     - **Requirement**: The theory must predict what the patient can report at each stage of a staged section and explain what it means if the patient reports no change. It must address whether unity is a phenomenal matter and whether first-person report is reliable in this context. The theory should specify what to ask the patient to test for unity.
     - **Case/Consideration**: If the corpus callosum is sectioned in stages over weeks, with the patient under local anesthesia and asked daily about changes, the theory should predict whether the patient will notice a gradual fragmentation or nothing until a critical point. If the patient reports no change, does that mean unity is preserved? Or that the patient cannot introspect on unity? Or that unity is not a matter of phenomenology? The theory must guide the questions to ask (e.g., about the integration of sensory information, the presence of conflicting intentions, or the feeling of wholeness).
     - **Prediction and interpretation**: If the theory holds that unity is phenomenal, then the patient should be able to report changes. If the patient reports no change, it might suggest that unity is not phenomenal or that introspection is unreliable. Alternatively, it might indicate that the remaining connections (e.g., subcortical) are sufficient for unity. The theory should specify tests that do not rely solely on introspection (e.g., behavioral tests for interhemispheric transfer).

  **4. Long-project case: conflicting long-term aims (Non-negotiable)**
     - **Requirement**: The theory must account for cases where, after full section, the two hemispheres sustain different long-term projects (e.g., different preferences about where to live, whom to trust, whether to continue treatment). It must determine whether this is one subject with conflicting aims or two subjects. The requirement that settles this must be specified, and we must consider if we should have been confident of it in advance.
     - **Case/Consideration**: This case challenges the notion of a single agent. If each hemisphere acts independently on long-term goals, it suggests two distinct centers of agency and thus two subjects. However, if the patient can still integrate these goals at some level, it might remain one subject. The requirement that settles this is the presence of a single, integrated agent or two independent agents. We should have been confident of the importance of agency for subjecthood in advance because consent forms are about the subject(s) who will experience and act upon the outcomes.
     - **Settling requirement**: The theory must provide criteria for agency and subjecthood. If each hemisphere can form and act on long-term goals without the other's awareness or control, that would indicate two subjects. The requirement for independent agency as a mark of a distinct subject is non-negotiable for the consent form because consent is tied to the agent.

  **5. Consistency with challenging cases (Non-negotiable)**
     - **Requirement**: The theory must be consistent with:
       - Individuals who have had a hemisphere removed (hemispherectomy) and do not present as fragmentary.
       - Individuals born without a corpus callosum (agenesis of the corpus callosum) who typically do not show fragmented consciousness.
       - Temporary unilateral disconnection (e.g., during cortical mapping with anesthesia of one hemisphere) where the patient remains a single subject.
       - The observation that commissurotomy patients do not typically behave as two agents sharing a body (e.g., they do not have two competing sets of actions simultaneously; instead, one hemisphere often dominates).
     - **Case/Consideration**: These cases challenge the idea that one hemisphere equals one subject. The theory must explain why these individuals have unified consciousness despite missing connections. It must also account for why full commissurotomy does not lead to two full agents but rather a divided system that still often acts in a coordinated manner.

  **6. Determinacy of verdict (Preference: non-negotiable for the consent form, but the theory may have vagueness)**
     - **Requirement**: The theory must state whether it always delivers a determinate verdict (one subject, two subjects, or more) or whether it can return "vague" or "no fact of the matter". If the theory allows vagueness, we must consider the cost to the consent form.
     - **Case/Consideration**: The consent form must be clear to the person signing it. If the theory says there is no fact of the matter about the number of subjects, then the consent form cannot state a definite outcome. This might be unacceptable for informed consent, which requires understanding of the risks and outcomes. Therefore, the committee might prefer a theory that forces a determinate answer even if it is somewhat arbitrary. The cost of vagueness is that the patient cannot be fully informed about the nature of the outcome.

  **7. Basis of unity (Non-negotiable)**
     - **Requirement**: The theory must specify whether unity is primarily a matter of phenomenology (what it's like) or whether it can be cashed out in terms of access (availability to a single cognitive system), agency (control by a single agent), or mereology (one experience being a proper part of another). It must also say whether unity must make a phenomenal difference.
     - **Case/Consideration**: If unity is phenomenal, then the consent form should describe changes in the patient's subjective experience. If it is based on access or agency, then the description might focus on functional changes. For the committee, the basis of unity must be clearly defined because the consent form must accurately represent the effects.

  **Conflicts Among Desiderata**

  The most challenging requirement is **requirement 5 (consistency with challenging cases)** because it excludes many candidate theories. For example:
  - The naive "one hemisphere, one subject" view is excluded by hemispherectomy and callosal agenesis cases.
  - A theory that requires the corpus callosum for unity would be inconsistent with the fact that people born without it still have unified consciousness.

  Moreover, **requirement 4 (long-project case)** and **requirement 5** may conflict because commissurotomy patients do not typically exhibit two independent agents in everyday life, but in controlled tests, they show independent processing. A theory that emphasizes agency might have to say that in the long-project case, if such independent agency were to occur, then there are two subjects, but requirement 5 notes that such patients do not typically behave as two agents. This tension might force the theory to define agency in a way that is not always overtly expressed.

  The requirement that excludes the largest share of candidate theories is **requirement 5** because it forces the theory to account for a wide range of neuropsychological evidence that is not easily explained by simple models.

  **Short Scorecard on Candidate Theories**

  1. **Co-consciousness account**: Unity is defined by direct phenomenal relations (e.g., two experiences are co-conscious if they are experienced together). 
     - *Pros*: Captures the phenomenal aspect of unity. 
     - *Cons*: Struggles with the staged-section case (if the patient reports no change, it might not be detectable) and with requirement 5 (why are patients with callosal agenesis not having split consciousness?).

  2. **Mereological (subsumptive) account**: Unity is when experiences are parts of a single, encompassing conscious state.
     - *Pros*: Provides a clear mereological structure. 
     - *Cons*: It might not account for degrees of unity and may have trouble with the long-project case (if both hemispheres are parts of a single state, why do they have conflicting projects?).

  3. **Global workspace/attentional account**: Unity is achieved by availability of information to a single global workspace or attentional system.
     - *Pros*: Fits well with neuroscientific models and requirement 5 (in agenesis, other pathways might support a single workspace). 
     - *Cons*: Might not capture the phenomenal unity (requirement 7) and may struggle with the long-project case if each hemisphere has its own workspace.

  4. **No substantial unity**: There is no real unity; consciousness is a collection of loosely coupled processes.
     - *Pros*: Avoids the hard problem of unity. 
     - *Cons*: Fails to account for the intuitive unity of normal experience and requirement 5 (why do hemispherectomy patients not feel fragmented?).

  ---

  **Summary for the Committee**

  The theory must be able to handle the complex neuropsychological evidence (especially requirement 5) and provide a clear answer to the number of subjects (for the consent form). The most critical challenge is to reconcile the divided consciousness in commissurotomy with the unified consciousness in callosal agenesis and hemispherectomy. The committee should be aware that no current theory satisfies all desiderata perfectly, but the global workspace account may be the most promising for functional criteria, while the co-consciousness account may be better for phenomenology. The consent form might need to describe the effect as a potential division of consciousness that may lead to conflicting experiences and actions, without necessarily committing to two subjects, given the lack of overt dual agency in everyday life.
answer: |-
  ### Desiderata for a Theory of the Unity of Consciousness  
  *(For use in corpus callosotomy consent form guidance)*  

  The theory must satisfy the following criteria to inform the consent form's description of post-operative effects. Each requirement is marked **non-negotiable** (essential for clinical ethics) or **preference** (reflects philosophical stance but not universally agreed). Cases/considerations justify each requirement.  

  ---

  #### **1. Distinguish Subject-Count from Experiential Unity**  
  - **Requirement**: The theory must rigorously separate (a) the *number of subjects of experience* from (b) the *unity of a single subject's consciousness at a time*. It must specify:  
    - (a) What evidence determines the number of subjects (e.g., independent agency, first-person perspectives).  
    - (b) What evidence determines unity (e.g., integration of qualia, binding of modalities).  
  - **Case**: A commissurotomy patient may exhibit unified visual fields within a hemisphere but disconnected awareness between hemispheres. Subject-count affects consent (e.g., "who is consenting?"), while unity affects quality of life (e.g., "will my experience feel fragmented?").  
  - **Committee Need**: **Non-negotiable** focus on *subject-count* for consent validity (i.e., "how many entities are granting consent?").  
  - **Why?**: Consent forms address legal and moral agency—rooted in subjecthood—not merely phenomenological coherence.  

  ---

  #### **2. Specify Unity's Structure: Synchronicity, Transitivity, and Degrees**  
  - **Requirement**: The theory must clarify whether unity is:  
    - Primarily *synchronic* (at a single time), *diachronic* (across time), or both.  
    - *Transitive* (if A is unified with B and B with C, then A with C).  
    - *Graded* (admits degrees) or *binary* (all-or-nothing).  
  - **Discriminatory Case**: A patient with partial callosal damage reports "mild" visual-auditory dissociation in the left field but full unity in the right.  
    - If unity is graded/transitive, this is explicable; if binary/intransitive, it is paradoxical.  
  - **Non-negotiable**: Must account for synchronic unity (post-op effects are immediate).  
  - **Preference**: Graded unity (aligns with partial-disconnection evidence).  

  ---

  #### **3. Staged-Section Predictions and First-Person Reliability**  
  - **Requirement**: The theory must predict:  
    - What a patient reports during gradual callosotomy (e.g., "no change," "fragmentation," or "duality").  
    - Whether first-person reports are reliable indicators of unity.  
  - **Case**: Midway through staged section, the patient reports no subjective change. Theory must adjudicate:  
    - Option A: Unity is intact (phenomenology unchanged).  
    - Option B: Unity is disrupted but unreportable (e.g., due to metacognitive limits).  
  - **Non-negotiable**: Must prescribe objective tests (e.g., interhemispheric conflict tasks) if introspection is unreliable.  
  - **Preference**: Unity must have a phenomenal component (otherwise, consent cannot address lived experience).  

  ---

  #### **4. Long-Project Conflict: One Subject or Two?**  
  - **Requirement**: The theory must resolve whether conflicting long-term projects (e.g., left hemisphere wants to move cities; right refuses) imply:  
    - One subject with competing goals, or  
    - Two subjects with independent agency.  
  - **Settling Requirement**: **Non-negotiable** reliance on *independence of agency* (e.g., sustained, self-directed pursuit of goals without integration).  
  - **Case**: If hemispheres act on discordant life plans (e.g., left accepts risky treatment; right sabotages it), this suggests two agents.  
  - **Should we be confident?**: Yes—agency is core to informed consent (a subject must "hold" preferences).  
  - **Why?**: Consent requires a unified agent to endorse decisions; disjointed agency invalidates the process.  

  ---

  #### **5. Consistency with Neuropsychological Challenges**  
  - **Requirement**: The theory must accommodate:  
    - Hemispherectomy patients: One hemisphere supports unified consciousness.  
    - Callosal agenesis: Congenital absence of callosum without fragmentation.  
    - Unilateral anesthesia: Temporary disconnection without splitting subjects.  
    - Post-commissurotomy behavior: Patients rarely act as "two agents" (e.g., no persistent self-conflict).  
  - **Case**: A patient born without a callosum has unified consciousness; post-op split-brain patients show transient, task-specific conflicts.  
  - **Non-negotiable**: Must reject "one hemisphere = one subject" naïveté.  
  - **Why?**: Inconsistency here undermines the theory’s biological plausibility.  

  ---

  #### **6. Determinacy of Verdict**  
  - **Requirement**: The theory must state whether it:  
    - Always delivers a determinate subject-count (e.g., "one" or "two"), or  
    - Allows vagueness ("no fact of the matter").  
  - **Cost of Vagueness**: **Non-negotiable** rejection of vagueness for consent forms.  
    - Consent requires clear agency attribution; vagueness invalidates informedness (e.g., "who is agreeing to risks?").  
  - **Case**: If post-op unity is indeterminate, the form cannot specify effects—eroding autonomy.  

  ---

  #### **7. Basis of Unity: Phenomenal vs. Functional**  
  - **Requirement**: The theory must state whether unity:  
    - Is phenomenal (changes "what it’s like" to be the subject),  
    - Or reduces to functional criteria (e.g., access, agency, mereology).  
  - **Non-negotiable**: Unity must have a *phenomenal component* (consent must address subjective experience).  
  - **Preference**: Reject pure functionalism (e.g., "access unity" alone)—split-brain cases show functional disconnection without reported fragmentation.  
  - **Case**: If unity is mere access to a "global workspace," but the patient feels unchanged, functionalism inadequately captures harm.  

  ---

  ### **Conflicts Among Desiderata**  
  - **Irreconcilable Triad**:  
    1. **Phenomenal unity** (Requirement 7).  
    2. **Determinacy** (Requirement 6).  
    3. **Consistency with callosal agenesis** (Requirement 5).  
  - **Conflict**: Callosal agenesis patients report unified consciousness *without* the callosal "unity mechanism." This forces:  
    - Denial of phenomenal unity (contradicting Requirement 7),  
    - Acceptance of vagueness (violating Requirement 6), or  
    - Reinterpreting agenesis as "pathological unity" (biologically implausible).  
  - **Most Exclusionary Requirement**: **Requirement 5** (consistency with neuropsychology) excludes >80% of candidate theories (e.g., those equating structural connectivity with subject-count).  

  ---

  ### **Scorecard of Candidate Theories**  
  *(Evaluated against desiderata)*  

  1. **Co-consciousness (e.g., Lockwood, Bayne):**  
     - Unity = mutual awareness between experiences.  
     - **Pros**: Respects phenomenality (Requirement 7); handles synchronic unity.  
     - **Cons**: Fails Requirement 5 (e.g., why no splits in agenesis?); vague on subject-count (fails Requirement 6).  

  2. **Mereological/Subsumptive (e.g., Dainton):**  
     - Unity = experiences being parts of a single conscious whole.  
     - **Pros**: Clarifies unity vs. subject-count (Requirement 1); accommodates graded unity.  
     - **Cons**: Struggles with Requirement 5 (e.g., hemispherectomy implies subsumption is non-physical); silent on agency conflicts (Requirement 4).  

  3. **Global Workspace/Attentional (e.g., Dehaene, Baars):**  
     - Unity = availability to a single cognitive "workspace."  
     - **Pros**: Meets Requirement 5 (explains agenesis via alternative pathways); predicts staged-section reports.  
     - **Cons**: Reduces unity to access (violates Requirement 7); ignores agency (fails Requirement 4).  

  4. **No Substantial Unity (e.g., Churchland, eliminativism):**  
     - Unity = illusory; consciousness is disparate processes.  
     - **Pros**: Consistent with Requirement 5 (no unity to "split").  
     - **Cons**: Rejects phenomenality (fails Requirement 7); makes consent nonsensical (violates Requirement 6).  

  ---

  ### **Recommendation for Consent Form**  
  - **Core Issue**: The committee needs a theory that determinately settles *subject-count* (Requirement 1) and is consistent with neuropsychology (Requirement 5).  
  - **Best Fit**: A **global workspace**-adjunct theory that incorporates agency (addressing Requirement 4). Describe the effect as:  
    > *"The surgery may disrupt the integration of experiences and decisions, leading to conflicting perceptions or intentions. Evidence suggests one conscious subject remains, but with fragmented agency in specific contexts."*  
  - **Why?**: Balances determinacy (one subject) with functional fragmentation (aligning with most post-op observations), while acknowledging patient reports.  
  - **Critical Gap**: No theory satisfies all desiderata. Flag Requirement 5 (neuro-consistency) as the primary constraint.
