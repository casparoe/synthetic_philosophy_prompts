answer: |-
  Here’s a practical 90-minute session plan for introducing anātman/no-self, sequenced to build understanding experientially and pre-empt misconceptions. British English throughout.

  **Session Aim:** To shift "self is an illusion" from a slogan to a practical insight about *how* "I" and "mine" operate in experience.

  **Core Structure & Why This Order:**
  1.  **Grounding in Felt Experience (15 mins):** *Start with what they know intimately – the raw feeling of "I"*. Ask: *"Notice the sensation ‘I am sitting here’ or ‘I am hearing these sounds’. Don’t analyse it, just feel its texture. Where is it located? Is it solid? Fluctuating? What happens if you try to ‘point’ to it directly?"* Brief sharing. *Purpose:* Establishes the *phenomenon under investigation* (the felt sense of self/I-am-ness) before any doctrine. Avoids abstract philosophy.

  2.  **Introducing the Aggregates *as Attachment Points* (20 mins):** *Use the whiteboard:* Briefly list the 5 khandhas (Form, Feeling, Perception, Formations/Mental Formations, Consciousness). Emphasise: *"The Buddha didn’t invent these as metaphysics. He noticed that whenever we say ‘I’, ‘me’, or ‘mine’, we latch onto one of these five processes happening right now."* Give immediate examples: "I am *tired*" (Feeling), "This is *my* cushion" (Form + Perception/Feeling), "I am *thinking*" (Formations/Consciousness). *Purpose:* Shows aggregates not as a dry analysis, but *where* identification happens. Sets up "self" as an *activity* (clinging), not a *thing*. Pre-empts the "bundle is real" objection later.

  3.  **The Central Example: The Ownership Illusion (25 mins):** *This carries the session.*
      *   **Set-up:** Ask them to hold an object (pen, water bottle). "Notice the feeling ‘*This is my pen*’. Feel that sense of ownership."
      *   **Investigation:** "Where does that ‘my-ness’ reside? *In the pen itself?* (No, it’s plastic/water). *In your hand?* (Sensation changes). *In a thought?* (The thought arises and passes). *Is it a permanent fixture?* (If someone grabs it, ‘my-ness’ might flare into anger or fear, showing its dependence)."
      *   **Key Insight:** "The ‘my-ness’ isn’t a *component* we find inside the pen, hand, or mind. It’s an *imputation*, a *label applied due to conditions* (habit, proximity, desire, social convention). We *feel* it vividly, but when we look for its essence *within* the aggregates involved (form of the pen, feeling of possession, perception of 'mine', mental formations of attachment), it vanishes. Like a rainbow – vivid, functional, but empty of inherent ‘rainbow-ness’."
      *   **Why it works:** Avoids "look for it" fallacy (health analogy fails – health is a *state* of the system, ‘my-ness’ is an *imposed label*). Shows selfing as a *process* (verb), not a thing (noun). Connects directly to aggregates. Is utterly practical and immediate.

  4.  **Stating the Claim (5 mins):** *Now* frame the teaching: *"So, the ‘self’ isn’t some hidden manager or owner we discover inside experience. It’s the *pattern* of clinging, the *habit* of claiming ‘I’ or ‘mine’ towards these ever-changing aggregates. It’s a *functional illusion* – it feels real and has consequences, but lacks the inherent, independent, permanent existence we instinctively attribute to it. The aggregates flow; the clinging creates the illusion of a solid ‘I’ standing apart."* *Purpose:* The investigation *prepares* this statement; it’s no longer abstract paradox.

  5.  **Addressing Key Misconceptions (as they naturally arise):**
      *   **"Nothing exists / Nothing matters" (Likely after claim):** "Does the *pain* in your knee vanish? Do your *responsibilities* disappear? No. The aggregates are real processes. Suffering (*dukkha*) is real. The *problem* is the extra layer of *clinging* and *identification* ("*My* pain", "*I* am suffering") which adds struggle. Seeing through the illusion *reduces* that extra suffering. Ethics and care matter *more*, not less, because the walls of ‘me vs. you’ soften." (Link to Metta).
      *   **"The Witness must be real" (Likely during felt sense/aggregates):** Pre-empt subtly during Step 1: Notice if the 'observer' feeling itself shifts, flickers, or is coloured by thought/mood. During aggregates: "Is ‘witnessing’ stable? Or is it just another transient mode of consciousness (the 5th aggregate), sometimes clear, sometimes cloudy? Can you find a *separate* witness *behind* consciousness?" *Stress:* Consciousness (viññāṇa) is *conditioned* and *impermanent*, part of the flow, not a stable owner.
      *   **"It's just neuroscience / the confabulating ego" (Dangerous - likely post-claim):** Acknowledge overlap *but*: "Neuroscience explains the *mechanism* (brain processes). This teaching is about the *subjective experience* and the *suffering caused by mis-taking* the story for a self. Neuroscience might say ‘the ego is a narrative construct’. We investigate: *How does it feel to be identified with that narrative? What happens when that identification loosens?* It’s about direct insight into clinging, not just intellectual agreement." *Crucially:* "Does knowing it's a confabulation make the *suffering* from believing it any less real *until* you see it directly?"
      *   **"Why care about future me?" (Likely post-claim/nihilism):** "Is the future ‘you’ experiencing pain? Yes. The aggregates will still feel. Clinging creates anxiety *now* about that future. Seeing no separate self doesn't erase continuity or cause-and-effect. Care arises naturally from understanding interconnectedness, not from reinforcing ‘I’ as an isolated entity fearing loss. Prudence based on wisdom replaces anxious self-protection." (Link to karma/conditionality lightly).
      *   **"What carries on?" / Rebirth (Likely during aggregates/continuity):** *When it arises:* "That’s a profound question touching on rebirth, which is outside tonight's scope. For *this* teaching, focus on what’s observable: the *continuity of cause and effect*. Habits (mental formations), intentions, memories – these patterns flow moment-to-moment and influence what arises next, like a river's current. *That* continuity happens, without needing a ‘self’ carried within it. We’ll stick to the present-moment dynamics tonight." *Be firm but kind.*
      *   **"The bundle is real, the name is decorative" (Sharp student - likely post-claim/aggregates):** "True, the aggregates (bundle) are real processes. But the ‘self’ illusion isn't *just* the name. It’s the *misapprehension* – the deeply held belief that within or behind this bundle is a *controller, owner, or unchanging essence*. We don’t deny the bundle; we deny that the *clinginess* and *identification* point to anything *separate* or *inherent*. Like a parliament: the functions (aggregates) happen, but there's no *monarch* (self) ruling them. The belief in the monarch causes trouble!"

  6.  **Practical Payoff & Closing (5 mins):**
      *   **Question to Test Landing:** *"If someone genuinely glimpses this lack of inherent self in experience, even briefly, what practical effect might it have on how they meet the next moment of frustration or desire?"* (Listen for reduced identification, less automatic "I am X" or "I must have Y", space between stimulus and reaction, less taking things personally).
      *   **Openly Decline:** *"Tonight we’ve focused on the *experience* of selfing and its release. We’ve deliberately not tackled:*  
          *   *The metaphysics of rebirth and what, if anything, ‘reincarnates’.*
          *   *Precise philosophical definitions of consciousness or ultimate reality.*  
          These are deep waters for another time or different study. Tonight’s aim is practical insight."

  **Why this sequence works:**
  1.  Starts concrete (felt experience), not abstract.
  2.  Introduces aggregates *as the locus of clinging*, making them immediately relevant.
  3.  Central example (Ownership) is visceral, avoids lookup fallacy, demonstrates imputation.
  4.  Misconceptions are addressed contextually *as they arise* or pre-empted within the flow.
  5.  Practical payoff is front-and-centre ("reduces suffering from clinging").
  6.  Sets clear boundaries (rebirth, metaphysics) without dismissing questions.

  **Session Flow:**
  *   0-15 min: Felt "I"
  *   15-35 min: Aggregates as Attachment Points
  *   35-60 min: **Central Example - Ownership Investigation & Claim Statement**
  *   60-85 min: Address Misconceptions (woven into discussion)
  *   85-90 min: Closing Question & Declined Territories

  Focus on dialogue, guided noticing, and linking every point back to direct experience and practical effect ("How does this feeling/thought *create* or *alleviate* suffering?"). Good luck!
