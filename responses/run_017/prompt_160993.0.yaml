  Second, the copying problem. The user's friend argues that copying a mind doesn't multiply harm because all copies share the same identity. However, each copy is a distinct subjective experience. Matt's cookie suffers independently from the original Joe. The episode conflates the copy with the original for punishment but treats it as disposable. This inconsistency highlights a philosophical tension between continuity of identity and the emergence of new entities through copying. Parfit's theories on personal identity are relevant here—copies might be psychologically continuous but numerically distinct, leading to separate moral considerations.

