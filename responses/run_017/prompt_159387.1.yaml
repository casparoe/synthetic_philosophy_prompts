  ### **Participatory Activity: Feeling the Rietdijk–Putnam Argument**

  #### **Learning Goals**
  - **Core Experience:** Students viscerally grasp that simultaneity is frame-dependent, leading to the conclusion that distant events can be simultaneously past, present, and future across different frames—with no "privileged now."
  - **Key Distinctions:** 
    - "Real now" (ontic, frame-dependent simultaneity) vs. "knowable now" (epistemic, limited by light-speed delays).
    - Relativity of simultaneity → "simultaneous with real event" implies "real" → all events are equally real (eternalism).
  - **Constraints Met:** 
    - Light-signal delay is simulated but distinguished from frame-dependence.
    - Ratification ledger accumulates irreversible records from an ambassador whose velocity changes each round.
    - Privileged foliation advocate (PFA) repeatedly fails to reconcile frames.

  #### **Materials**
  - **Index cards (32):** 
    - 16 for events (one per student), pre-printed with unique event coordinates (e.g., "Event: (x = -4 ls, t = 1.2 s)"). 
    - 16 for light-signal receipts (blank).
  - **String (8 rolls):** Represents light signals; cut into 2-meter segments.
  - **Whiteboard:** Divided into "Ratification Ledger" (columns: Round, Velocity, Ratified Events) and "PFA Rule Board."
  - **Velocities Lottery:** Jar with 4 slips: "v = 0", "v = 0.5c (right)", "v = 0.9c (left)", "v = -0.5c (left)". 
  - **Timer:** For round management.
  - **Chairs:** Arranged in a straight line (spatial axis), labeled A–P (positions at x = -8 to +8 light-seconds (ls), 1m apart).

  #### **Roles**
  1. **Event Reporters (12 students):** 
     - Each holds an event card (e.g., "Event at (x = -2 ls, t = 0.5 s)"). 
     - Must send/receive light signals and report when their event is ratified.
  2. **Ambassador (1 student per round, rotating):** 
     - Walks along the spatial axis at a randomized velocity (drawn from lottery). 
     - Ratifies events simultaneous with their "now" at the central event (x=0, t=0).
  3. **Ledger Keeper (1 student):** Records ratified events on the whiteboard ledger. Entries are permanent.
  4. **Privileged Foliation Advocate (PFA, 1 student):** 
     - Proposes a universal rule to define "real now" (e.g., "Events at t=0 in the lab frame"). 
     - After each round, refines the rule to accommodate new velocities. 
  5. **Light-Signal Couriers (2 students):** Carry strings from reporters to the ambassador, simulating light-speed delays.

  #### **Event Setup**
  - **Central Event:** Flash of light at (x=0, t=0) for synchronization.
  - **Event Times (Lab Frame):** 
    - Chosen so events are spacelike-separated and yield different simultaneity sets per frame. Examples:
      - Event A: (x = -4 ls, t = -1.0 s)
      - Event B: (x = -2 ls, t = 0.5 s) → Simultaneous with Central Event in v=0.5c frame
      - Event C: (x = 0, t = 0) → Central Flash
      - Event D: (x = +3 ls, t = 2.0 s) → Simultaneous in v=0.9c frame
      - Event E: (x = +6 ls, t = -1.5 s) → Simultaneous in v=-0.5c frame
    - Coordinates ensure:
      - No event is in the absolute past/future of Central Event (all spacelike).
      - Each velocity in the lottery ratifies a unique subset (e.g., v=0.5c ratifies B and C).

  #### **Round Structure (4 Rounds, 15 Min Each)**
  1. **Setup (2 min):** 
     - Rearrange chairs to spatial axis. 
     - Event Reporters sit at assigned positions (x-coordinates). 
     - Ambassador draws velocity from lottery (e.g., "v=0.5c right"). 
     - PFA states/updates their rule on the board (e.g., "Real now = events at t=0 in lab frame").

  2. **Light-Signal Delay Phase (5 min):**
     - **Goal:** Simulate "knowable now" (epistemic limit) vs. "real now" (ontic simultaneity).
     - **Mechanic:**
       - Event Reporters send a light signal (string) via courier to the ambassador *if* their event time is in the past (t < 0 in lab frame). 
       - Couriers move at walking speed (simulating light speed). Only events with |t| ≥ |x|/c (in lab frame) are "knowable" (light has time to arrive).
       - Ambassador receives signals at x=0, but **only after delays** (e.g., event at x=4 ls, t=-2 s is knowable; event at x=4 ls, t=-1 s is not).
       - Reporters call out events they "know" (e.g., "I know Event A happened!").
       - **Key:** Ambassadors and reporters see that knowable events are sparse and delayed—never matching the full "now."

  3. **Ratification Phase (5 min):**
     - **Goal:** Ambassador ratifies their "real now" (simultaneity slice).
     - **Mechanic:**
       - Ambassador walks along spatial axis at their velocity (e.g., half-speed for v=0.5c).
       - At x=0, they stop. Using a pre-calculated cheat sheet (hidden until now), they announce events simultaneous with Central Event in *their frame* (e.g., for v=0.5c: Events B and C).
       - Reporters cheer/boo when their event is ratified.
       - Ledger Keeper records ratified events (e.g., "Round 1: v=0.5c → Events B, C").
       - PFA checks if their rule predicted this. **Spoiler:** It always fails after Round 1.

  4. **PFA Challenge (3 min):**
     - PFA revises their rule to fit all ledger entries (e.g., "Real now = events with t = vx/c²").
     - Class votes: "Will this rule survive the next lottery?" (No stakes, but builds tension).

  #### **Payoff/Scoring**
  - **No stakes, but "victory" conditions:** 
    - PFA wins if their rule survives all 4 rounds (impossible by design).
    - Class wins if they make the PFA concede defeat by Round 4.
  - **Debrief points:** Awarded for spotting "aha!" moments (e.g., "I saw Event D was future for me but present for them!").

  #### **Predictable Problems & Solutions**
  - **Problem:** Students confuse light delays (epistemic) with frame-dependence (ontic).  
    **Solution:** Stress the delay phase is about "what you can know," while ratification is about "what is real for the ambassador."
  - **Problem:** Ambassador/PFA struggles with pre-calculations.  
    **Solution:** Provide simplified cheat sheets (e.g., "For v=0.5c, ratify events with |t - 0.5x| < 0.1").
  - **Problem:** Ledger errors break irreversibility.  
    **Solution:** Ledger Keeper uses bold markers; no erasers allowed.
  - **Problem:** Velocity simulation feels artificial.  
    **Solution:** Ambassador "walks" velocity (e.g., v=0.5c = casual stroll; v=0.9c = speed-walking).

  #### **Debrief (15 Min)**
  1. **Relativity of Simultaneity (Map: Round 2–4):**  
     "In Round 1, v=0 ratified Event C. In Round 2, v=0.5c ratified B and C—B wasn’t 'now' before! What changed? The ambassador’s motion. This is relativity of simultaneity: no universal 'now.'"

  2. **"Simultaneous with Real → Real" (Map: Ledger Entries):**  
     "Event C is real (Central Flash). When the ambassador said B is simultaneous with C, you treated B as real too. But in Round 3, v=0.9c ratified D and C. So B is real, D is real—even though B and D weren’t simultaneous in the same frame."

  3. **Move to Eternalism (Map: Full Ledger):**  
     "By Round 4, events A–E are all ratified. If 'real now' depends on the frame, and every event is 'now' in *some* frame, are all events equally real? Yes—that’s eternalism. The ledger is your block universe."

  4. **Epistemic vs. Ontic (Map: Light-Signal Phase):**  
     "In the delay phase, you couldn’t 'know' Event E (t = -1.5 s) until light arrived. But when the ambassador ratified it in Round 4, it was 'real now' for them. Real doesn’t mean knowable. Reality is frame-dependent; knowledge is delayed."

  #### **Limitation & Final Input (10 Min)**
  - **What the Activity Can’t Reproduce:**  
    The logical inference from "all events are real in some frame" to "therefore, all events *are* real (even in frames where they’re past/future)." The activity shows the symptoms (contradictory "nows") but not the deductive step that kills presentism.
    
  - **How to Supply It:**  
    End with: "You saw Event D was future for you but present for the v=0.9c frame. If the present is real, and D is present there, D must be real—even when it’s future for you. Now, if D is real when it’s future, and *every* event is like D in some frame, then all events are always real. That’s the Rietdijk–Putnam argument. The activity made you *feel* the problem; the logic seals it."

  This design forces students to confront frame-dependence physically, separates epistemology from ontology, and makes the PFA’s failure visceral. The lottery ensures relativity breaks intuition repeatedly—no one leaves thinking "now" is absolute.
