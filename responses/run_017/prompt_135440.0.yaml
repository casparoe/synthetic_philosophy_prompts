answer: |-
  So two philosophers of mind walk into a bar, one a staunch defender of higher-order theories (HOTs) and the other skeptical. The HOT theorist trips over a loose floorboard, stubs his toe fiercely, and yelps. Simultaneously, his companion, sitting perfectly still, experiences nothing but the ambient noise. Unbeknownst to them, they’re wired into a crude 'shared monitor' system: a single higher-order mechanism hooked to both their pain pathways, designed to fire an identical "SOMEONE IS IN PAIN RIGHT NOW!" signal whenever *either* body sends a distress call, with absolutely no way to tag *which* body it came from. As the HOT theorist’s genuine agony hits, the monitor blares its undifferentiated announcement. The skeptic, feeling no pain himself but hearing the blaring signal in his metacognitive feed, turns to his injured companion and says, "Well, according to your theory, *my* consciousness should now contain a conscious pain state triggered by your stubbed toe, since I bear the right higher-order relation to *a* pain signal – even if it’s yours!" The HOT theorist, wincing and hopping on one foot, retorts, "Nonsense! The conscious pain clearly belongs to... well, it belongs to... *the subject the higher-order state is appropriately about!*" The skeptic just gestures helplessly at the tangled, indistinguishable wiring humming between them and asks, "Right, but *which subject is that*? The monitor only announced 'SOMEONE,' not 'YOU' or 'ME'. So does your conscious pain now have two subjects? Or is my consciousness magically hosting *your* pain? Or is this undirected shout somehow making *nothing* conscious despite meeting the formal condition?" The HOT theorist, caught between the rock of misrepresentation and the hard place of shared metacognition, mutters into his drink, "It’s conscious... *somewhere*. The mechanism worked! The higher-order representation tokened! The details of... uh... *ownership*... are surely implementational."

  The punchline exposes the bind created by the theory’s core commitment: that consciousness is constituted *solely* by the subject bearing a suitable higher-order relation (thought or perception-like) to a first-order state. The shared monitor scenario strips away any intrinsic link between the HO state and a *specific* subject’s first-order state, forcing absurdities like conscious pain without a determinate subject or conscious states "belonging" to the wrong organism. The theorist’s flustered appeal to the HO state being "appropriately about" a subject highlights the problem – the *crude mechanism itself* provides no resources to ground that appropriateness or solve the misrepresentation dilemma, revealing a gap between the formal condition and the essential first-person character of consciousness it’s meant to explain. The joke lands on the theory's inability to handle cases where the HO representation lacks a determinate target *within the required subject's own mind*.
