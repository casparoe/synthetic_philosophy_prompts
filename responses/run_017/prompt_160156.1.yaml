  Hmm, the user is teaching a seminar on moral ideals and facing a recurring jam in discussions about Susan Wolf's critique of moral saints. Students can articulate Wolf's complaint and feel the pull of "but wouldn't the world be better with more saints," but the conversation cycles without resolution. They want a decision tree taxonomy to sort positions, emphasizing specific axes: crowding-out vs. motive-contamination, loss to agent vs. world, cost vs. defect, one peak vs. frontier, first-personal vs. third-personal, enjoyment of non-moral goods, and regulative ideals.

  The user wants the tree built from logical space rather than historical positions, with concrete branch questions students can answer without prior labels. Leaves should cover named positions like no-upper-bound maximizer, virtue-pluralist, threshold view, alienation view, value-pluralist, tragic view, and perfectionist view, plus unnamed cells with diagnoses. They also want flags for indistinguishable pairs and awkward implications of each view.

  Key challenges: Ensuring the axes are properly separated, especially crowding-out (resource competition) vs. motive-contamination (intrinsic spoiling). The tree must handle positions where first-personal rejection coexists with third-personal admiration. The regulative-ideal leaf needs stability testing. Unnamed cells should highlight incoherent/unattractive combinations.

  For structure: Start with fundamental forks - is there a "too much morality" point? Then branch through the axes in logical dependency order. The motive-contamination vs. crowding-out split should come early since it shapes subsequent concerns. The cost/defect distinction needs a concrete test about blame/resentment. The frontier view might collapse the debate if adopted early, so it should appear mid-tree. For indistinguishable pairs: Threshold views vs. diminishing marginal value models may behave similarly; a case involving trivial moral gains requiring massive sacrifices (e.g., skipping a child's graduation to donate blood) could force separation.

  Each leaf gets a one-sentence awkward implication: e.g., the no-upper-bound maximizer must accept that barely-justified sacrifices (like destroying a Rembrandt to stop a minor theft) are obligatory. Unnamed cells might include incoherent combinations like affirming motive-contamination while denying any loss (if morality ruins activities but you insist it doesn't harm anyone, contradiction arises).

  Execution: Use nested bullets for compactness. Branch questions are phrased as concrete scenarios ("Could a friend resent the saint for prioritizing duty over friendship?"). Terminal leaves include positions and their "sting" - the counterintuitive commitment they entail. Two unnamed cells: One where morality contaminates non-moral goods but this isn't a defect (unstable - either contamination matters or it doesn't), and one where the world loses out but the saint doesn't, yet no regulative ideal is invoked (likely unexplored because if saints harm the world indirectly, why wouldn't they adjust?).

  The tree resolves the seminar jam by forcing students to locate their intuitions on specific coordinates, revealing why their "middle" positions might be unstable or which premises they must defend. It also shows how views like the regulative ideal depend on denying that personal aspiration affects world outcomes.
answer: |-
  Here's a decision tree taxonomy built from the logical space you specified. It uses concrete cases/questions at branches, avoids historical names until leaves, identifies unnamed cells, and flags indistinguishable pairs. Designed for one-page printing.

  **Taxonomy of Positions on the Moral Saint**

  1.  **Is there *any* point where "more morality" makes a person worse overall?** (Assume morality is correctly understood)
      *   **No → Go to 2**
      *   **Yes → Go to 3**

  2.  **(No Upper Bound)**
      *   *Leaf: **No-Upper-Bound Maximizer***: Moral perfection is always a net gain, no matter the cost to other values. (Awkward: Must accept that sacrificing profound non-moral goods for trivial moral gains is ideal.)
      *   *Leaf: **Regulative Idealist***: Aspiring to sainthood is personally best, but a world of actual saints would be worse. (Stable if: Believing *my* striving doesn't make *others* strive, & saintly action *in mass* has bad emergent effects.) (Awkward: Must deny that widespread aspiration realistically leads to widespread action, or accept personal hypocrisy.)

  3.  **(Yes, "Too Much" Point)**
      *   **Is the core problem in "Hospital Visit": (A) The friend *could* have been helping starving kids instead (Time/Energy)? OR (B) Visiting out of duty ruins the *friendship value* of the visit, even if done perfectly?**
          *   **A (Crowding-Out Dominant) → Go to 4**
          *   **B (Motive-Contamination Dominant) → Go to 5**
          *   **Both → Merge paths later (See Note)**

  4.  **(Crowding-Out Focus)**
      *   **Is the main loss suffered by the *Saint* (e.g., her joyless life), or by the *World* (e.g., missing art/science)?**
          *   **Loss to Saint → Go to 6**
          *   **Loss to World → Go to 7**

  5.  **(Motive-Contamination Focus)**
      *   **Is the "ruined friendship visit" a *cost* the Saint blamelessly bears, or a *defect* in her character (e.g., lacking real friendship virtue)? (Could her friend *reasonably resent* her, not just pity her?)**
          *   **Cost (Blameless) → Go to 8**
          *   **Defect (Lacking Virtue) → Go to 9**

  6.  **(Crowding-Out; Loss to Saint)**
      *   **Could the Saint *wholeheartedly* enjoy gardening (no background guilt), yet still be ideal? Or must she hold it "lightly" (ready to drop it)?**
          *   **Wholeheartedly →** *Unnamed Cell 1*: (Likely incoherent? If crowding-out is the problem, wholehearted enjoyment implies *no* resource conflict, contradicting "too much" point.)
          *   **Lightly / With Guilt →** *Leaf: **Tragic Agent***: Sainthood demands real personal loss/flatness, but you should do it anyway. Morality is supremely demanding. (Awkward: Must accept your ideal life is deeply regrettable for you.)
          *   **Cannot Truly Enjoy (Alienated) →** *Leaf: **Alienation View***: Morality *is* maximally demanding and ruins non-moral goods, but it lacks ultimate authority over the good life. (Awkward: Must live knowing you "should" (morally) do what makes your life worse (overall).)

  7.  **(Crowding-Out; Loss to World)**
      *   **Would the world still lose out if *only a few* were Saints and others specialized in non-moral excellence?**
          *   **Yes →** *Leaf: **Value-Pluralist (World-Focused)***: A good world *requires* diverse types of excellence; universal sainthood creates a monoculture lacking vital goods. (Awkward: Must accept that encouraging morality in some might indirectly suppress needed non-moral excellence.)
          *   **No →** *Leaf: **Threshold/Moderate***: Morality sets a demanding but finite requirement (e.g., significant sacrifice); surpassing it is optional or even wasteful. Saints exceed the threshold pointlessly. (Awkward: Must draw a seemingly arbitrary line where "enough" morality is achieved.)

  8.  **(Motive-Contamination; Cost)**
      *   **Is there a *single best mix* of moral/non-moral, or a *frontier* of incommensurable good lives (e.g., equally good to be great artist or great saint, but not lukewarm at both)?**
          *   **Single Peak →** *Leaf: **Optimizing View***: There's one rationally optimal balance point maximizing overall goodness. Saints overshoot it. (Awkward: Must specify the calculus for weighing moral vs. non-moral value precisely.)
          *   **Frontier →** *Leaf: **Value-Pluralist (Life-Focused)***: Many distinct, excellent life types exist along a spectrum; saints occupy one point, not the only peak. (Awkward: Makes the "saint vs. non-saint" debate partly category-confused.)

  9.  **(Motive-Contamination; Defect)**
      *   **Is non-moral excellence (art, science, deep friendship) *lexically prior*? (Morality only kicks in once a threshold of non-moral flourishing is secured?)**
          *   **Yes →** *Leaf: **Perfectionist***: Non-moral human flourishing is the supreme good; morality serves it. A "moral saint" misunderstands the good. (Awkward: Must justify why basic moral constraints don't *always* override non-moral projects.)
          *   **No →** *Leaf: **Virtue-Pluralist***: Moral virtue is one essential excellence among others (friendship, creativity). A "saint" saturated *only* in morality lacks full virtue. (Awkward: Must explain why "moral virtue" isn't hierarchically superior to other virtues.)

  **Unnamed Cells & Diagnoses:**
  *   **Unnamed Cell 1 (6: Crowding-Out/Loss to Saint/Wholehearted):** Likely **incoherent**. If crowding-out is the problem (fixed resource budget), wholehearted enjoyment of a non-moral good implies it *isn't* significantly crowding out morality, contradicting the premise of a "too much" point due to resource drain. (Contrast with motive-contamination where wholeheartedness *might* be possible without conflict.)
  *   **Unnamed Cell (5B + Loss to World):** **Unexplored/Unexpected**. If the *core* problem is motive-contamination ruining activities from within (B), it's unclear how this primarily creates a *loss to the world* (missing art/science) rather than a loss to the individuals involved (flattened relationships, joyless pursuits). Focus likely stays on the agent/relationships.

  **Indistinguishable Pairs & Test Case:**
  *   **Threshold/Moderate (7-No) vs. Value-Pluralist-World (7-Yes) in a world with *many* saints:** They *can* look similar if the Threshold is set high. **Separating Case:** "Is a world with *everyone* meeting a high moral threshold but *no one* specializing in (say) cutting-edge theoretical physics *better*, *worse*, or *incomparable* to a world with fewer saints but some physics geniuses?"
      *   Threshold: Likely says *better* or *equal* (threshold met, surplus moral effort is neutral/wasteful).
      *   Value-Pluralist-World: Says *worse* (lacks a crucial type of excellence).
  *   **Threshold/Moderate vs. Diminishing Returns:** As you suspected, they often align. **Separating Case:** "Is donating your *entire* future income beyond basic sustenance to charity *required*, *supererogatory*, or *foolish* if each extra $100 does *some* marginal moral good (saves 0.001 QALYs), but requires immense personal sacrifice?"
      *   Threshold: Likely *supererogatory* or *foolish* (threshold met with less).
      *   Diminishing Returns Maximizer: Likely *required* (if net gain > net loss, however small).

  **First-Personal vs. Third-Personal Stability:** The tree *allows* landing on positions where **first-personal rejection + third-personal admiration is coherent** (e.g., **Value-Pluralist-Life (8-Frontier):** "Saints are great! But that life isn't for me." **Regulative Idealist (2):** "Saints are the best people! But I hope not everyone becomes one." **Alienation (6):** "They are morally best! But their lives are worse overall, so I won't choose it."). Incoherence only arises if a view insists the saint's life is *objectively best overall for everyone* (**Optimizing (8-Peak)** makes this tension sharpest).

  **Regulative Ideal Stability:** It holds if (a) personal aspiration doesn't reliably translate to expecting/wanting *others* to be saints, and (b) the negative consequences of *widespread* sainthood aren't caused by *individual* saintly actions in isolation. It breaks if (a) is psychologically implausible or (b) is false (e.g., if the world-loss comes from *each* saint crowding out non-moral goods individually).
