  Okay, let me start by unpacking the user's problem. They teach decision theory and use the Ellsberg urn to demonstrate ambiguity aversion. But they've noticed a twist: students show stronger aversion when the urn's composition is determined after their choice rather than before, even though the probabilities and information are identical. The user wants to understand this specific sensitivity—whether the uncertainty is about a hidden fixed state versus a not-yet-determined outcome.

  First, I need to recall the standard concepts. Ambiguity aversion is well-known, but the user is looking for a finer distinction. They mentioned that in both scenarios, the evidence is the same, but the timing of when the outcome is fixed changes the students' behavior. The key is to figure out why this timing matters.

  The user brought up examples like a pre-flipped coin covered versus yet to be flipped, or a scan unread versus not taken. The common thread is whether the outcome exists but is hidden or doesn't exist yet. The students' comment, "someone could at least tell us," suggests that the possibility of someone knowing, even if they don't, plays a role. That points towards epistemic access rather than just probabilities.

  Now, I remember terms like "ontic vs. epistemic uncertainty" from philosophy. Ontic is about the actual randomness in the world, while epistemic is about our knowledge. But the user’s cases blur this because in both, the uncertainty is epistemic from the agent's view. However, the existence of a hidden fact might make it feel different. 

  Then there's "hidden variable" versus "future indeterminacy." The first is settled but unknown; the second isn't settled. The user needs a term for this. "Settled-but-hidden uncertainty" versus "unsettled uncertainty" might work. But is there an established term? "Metaphysical uncertainty" comes up in some decision theory papers, but it's not common. Maybe "temporal ontology of uncertainty" but that's clunky. Coining a term like "chronogony" from Greek roots (time and origin) could be an option, though it might be too obscure. The user prefers an established term but is open to coining one if necessary.

  Next, boundary cases. The slip printed and destroyed: the outcome was settled but no longer exists. This should align with the hidden case, but without the possibility of access. Does the students' aversion persist? Probably less than the not-yet-fixed case because there's no lingering information. If the machine draws after the bet independently, it's unsettled, so aversion remains. If a third party knows but can't communicate, the hidden factor with potential leakage might increase aversion more. This suggests the line is about the existence of information somewhere, not time per se.

  On rationality: Is this aversion defensible? From a strict Bayesian view, no, since probabilities are subjective. But if we consider the possibility of hidden observers or unforeseen correlations, it might be rational. For instance, in the pre-fixed case, there's a risk that the bet correlates with the hidden state somehow, even if unintended. The user could test this by introducing scenarios where hidden information might leak, or compare with cases where independence is mathematically guaranteed versus not.

  For decision theory, incorporating this would require moving beyond standard models. Maybe using multiple priors where the set differs based on the uncertainty type. Or adding a cost for uncertainties tied to hidden information. But that complicates the model and might violate axioms like the sure-thing principle. The user needs to balance descriptive accuracy with normative simplicity.

  I should also address the user's deeper needs. They teach this concept and want a clear way to explain it. A term like "residual information sensitivity" might capture the idea that aversion stems from the potential existence of hidden information. In lecture, they could contrast "settled-hidden" vs. "unsettled" uncertainty. The boundary cases help clarify that the key is whether information exists elsewhere, influencing perceived risk beyond probabilities.

  In conclusion, while no perfect term exists, framing it as the sensitivity to residual information or access asymmetry provides a workable solution. The rationality depends on whether one allows for unmodelled correlations, and decision theories would need adjustments like multiple priors or additional parameters.
answer: |-
  The phenomenon you're describing cuts deeper than standard ambiguity aversion—it's a sensitivity to the **ontological status of uncertainty**, specifically whether the unknown state is **already fixed but inaccessible** ("hidden variable") versus **not yet determined** ("future indeterminacy"). While no universally accepted term exists, the most precise descriptor is **"residual information sensitivity"** or **"access asymmetry."** This distinguishes it from broader notions like Knightian uncertainty (risk vs. ambiguity) or reducibility (epistemic vs. aleatory uncertainty). Below, I'll unpack this, address your boundary cases, rationality, and implications for decision theory.

  ### Core Distinction: Hidden vs. Unsettled Uncertainty
  - **Hidden (Fixed but Inaccessible)**:  
    The outcome exists in the world (e.g., slip in envelope, flipped coin under hand). Subjects feel the ambiguity is "knowable in principle," even if no one accesses it. Your students' comment—"someone *could* at least tell us"—reveals an intuition about **residual epistemic access**: the information exists *somewhere*, creating a latent possibility of correlation or leakage.  
  - **Unsettled (Not Yet Fixed)**:  
    The outcome is genuinely indeterminate until after the choice (e.g., urn composition undrawn, coin unflipped). Here, no hidden fact exists to be discovered; uncertainty feels "pure" and metaphysical. Avoidance strengthens because subjects perceive **causal isolation**: their choice cannot interact with a non-existent state.  

  **Why it’s not reducibility or source of variation**:  
  In both cases, the *chooser's* uncertainty is equally irreducible, and the variation source (e.g., the machine’s randomness) is identical. The difference lies in **whether a fact exists independently of their choice**. This taps into intuitions about time, causality, and information ontology.

  ---

  ### Boundary Cases: Testing the Mechanism
  1. **Slip printed and destroyed unread**:  
     - Falls on the **hidden** side, but aversion *weakens*. The state was fixed, but no residual information exists. Students might treat this like the unsettled case if they believe destruction erases ontological status. However, if they intuit that "a fact *was* real," mild aversion persists.  
  2. **Composition drawn *after* the bet by an independent machine**:  
     - Clearly **unsettled**. Aversion remains strong since no pre-existing state exists. Independence guarantees no causal link, but the lack of a "true answer" dominates.  
  3. **Composition fixed and shown to a gagged third party**:  
     - **Hidden with extreme aversion**. Residual information now resides in a mind, raising fears of subconscious leakage (e.g., facial cues). This amplifies the sense of "knowability" and potential correlation.  

  **The line is about existence of information**:  
  Time matters only insofar as it determines whether information exists pre-choice. The critical factor is **whether a fact is "out there" in the world**, creating a latent channel for access or correlation—even if no practical access exists. Your "envelope" case has a physical token; the "third party" case has a mental token; the "destroyed slip" removes tokens entirely.

  ---

  ### Rational Defensibility: Bias or Prudent Heuristic?
  **Arguably rational under distrust of causal isolation**:  
  - **Defensible view**: If subjects suspect that "hidden fixed states" might correlate with their choice via unmodelled pathways (e.g., the experimenter subliminally cues bets, or quantum entanglement—far-fetched but conceivable), avoiding ambiguity in hidden cases is prudent. In unsettled cases, no such correlation is possible.  
  - **Bias view**: In a sterile, adversarial-free setup (as you describe), probabilities are identical. A rational agent should ignore ontological status and use the same second-order distribution. Aversion here stems from an **illusion of potential access**—a cognitive glitch.  

  **Test to distinguish**:  
  Run a variant where bets are made *in the presence of a neutral observer* who knows the hidden state (e.g., envelope contents) but is physically unable to react (e.g., behind a one-way mirror, frozen by "hypnosis"). If aversion persists, it suggests an irrational belief in "metaphysical leakage." If it vanishes, aversion was a rational hedge against signaling.  

  **Verdict**: Likely a **bias** in your controlled setup—but one rooted in an evolutionarily adaptive heuristic for real-world hidden information (e.g., predators, competitors). Competent choosers should train it out *when independence is guaranteed*.

  ---

  ### Implications for Decision Theory
  Standard models (Bayesian, Savage) treat all uncertainty as **epistemic** (about knowledge). Your cases require distinguishing **ontic uncertainty** (world-inherent indeterminism) from epistemic uncertainty. To respect this distinction, a decision theory must:  

  1. **Give up state-independent utilities**:  
     Allow utilities to depend on *how* a state comes about (fixed vs. unsettled). This violates the **act-state separability** axiom (foundation of expected utility).  
  2. **Introduce causal primitives**:  
     Incorporate Judea Pearl-style causal models or Lewisian counterfactuals. For example, unsettled uncertainties lack a "cause" prior to the choice, breaking potential back-door dependencies.  
  3. **Use multiple priors with source-tracking**:  
     Models like **α-maxmin** could weight priors differently based on uncertainty type (e.g., penalizing "hidden" ambiguities more). But this complicates axiomatics and invites arbitrariness.  

  **Cost**: Such a theory loses normative elegance and universality. The **Sure-Thing Principle** fails more severely, and updating becomes murky (e.g., how to revise beliefs after learning if the state was hidden or unsettled?).  

  ---

  ### Teaching Solution: A Pragmatic Label
  In lecture, frame this as **"access asymmetry"**:  
  > *"When uncertainty stems from a hidden fact—something already true but unknown—we instinctively treat it as riskier than 'pure' future randomness, even with identical probabilities. This 'access asymmetry' isn't ignorance about odds, but a deep intuition that hidden facts could be correlated with our actions in ways indeterminism can't."*  

  Use boundary cases to show that aversion scales with the **plausibility of residual information** (envelope < third party < destroyed slip ≈ unsettled). Conclude that while evolution may hardwire this heuristic, rational choice demands ignoring ontological status when correlations are excluded. This sets up your formal ambiguity models as tools to "de-bias" the intuition.
