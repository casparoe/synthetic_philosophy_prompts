prompt: |-
  I lead the model-assurance team at a national epidemiological forecasting centre. Several times a year we audit a simulation model before it is used to set rules affecting millions of people, and most of the risk sits in one place: the model contains dozens of regularities — curves fitted to past data, relationships imported from other countries, structural assumptions about how people and pathogens behave — and they get shipped as if they will keep holding outside the conditions in which they were measured. My analysts have epidemiology or statistics training and no philosophy. What I need is a written procedure one of them can run on each regularity: a short sequence of tests in a fixed order, each with a stated threshold for what counts as passing it, ending in one of a few tags — exportable law, effective or derived regularity, local coincidence, or not decidable on the data we have — plus a rule for what we are permitted to do with a regularity given its tag (extrapolate freely, extrapolate only under stated conditions, refuse to extrapolate, escalate).

  The tests should be the ones the philosophy of laws of nature actually supports, not merely statistical ones. As I understand the literature there is a real disagreement here: on one side, laws are just the patterns that survive in the best overall systematisation of what happens — nothing governs, there are no necessary connections, and a generalisation is lawlike in proportion to how much simplicity and strength it buys the total system; on the other, laws are features of the world that produce the patterns, explain why they hold, and ground counterfactuals about what would happen under interventions nobody has performed. I do not care which side is right, but I do care that the procedure does not quietly presuppose only one of them. So give me at least one test that only makes sense on the first picture (does this regularity earn its place in a compact system that also covers other regularities we accept?) and at least one that only makes sense on the second (is there something in the setup that would keep the pattern holding under an intervention, and does the pattern survive when we intervene on it in the model?). Include the grue-style worry about whether the predicates involved are the kind that project, and the distinction between a genuine exceptionless pattern and a coincidence of initial conditions — the difference between a regularity that holds everywhere and one that held in every case we happened to look at. State explicitly what the analyst should do when the two families of tests disagree, because they will.

  Constraints: the procedure has to be runnable in under an hour per regularity by someone with no philosophy background, using data already in front of them; the output is a one-page register entry that a senior modeller signs off on; and where a step requires a judgment we cannot specify in advance — how much risk of a false extrapolation we accept, whose values set that threshold — say so and route it to the sign-off rather than pretending the test settles it. Tell me at the end what the procedure cannot do: which ways a model can go wrong that these tests will not catch.

  Then run it on three regularities from our current work. (1) In all fourteen regions we model, the epidemic peak follows school reopening by eighteen to twenty-two days, and the model reproduces this with a fitted delay parameter. (2) Transmission rises with indoor occupancy as a power law with a stable exponent across countries and settings, there is a plausible mechanism story about airborne dose, and there are known exceptions. (3) The relation our flagship model is built around: hospital admissions lag reported cases by six days, stable across three years of national data. Assume (3) receives the tag we least want, and write that entry as it would actually appear in the register.
reasoning: |-
  We are designing a procedure to audit regularities in epidemiological models. The goal is to tag each regularity based on its reliability for extrapolation, using tests that draw from both major philosophical views of laws of nature. The tags are:
    - Exportable law: Extrapolate freely.
    - Effective or derived regularity: Extrapolate only under stated conditions.
    - Local coincidence: Refuse to extrapolate.
    - Not decidable on the data we have: Escalate.

  The procedure must include:
    - At least one test from the "best systematisation" view (simplicity and strength in the overall system).
    - At least one test from the "governing feature" view (mechanism and intervention stability).
    - Consideration of the projectability of predicates (grue problem) and the distinction between exceptionless patterns and coincidences.

  Steps of the procedure:

  1. **Test 1: Systematic Integration (Best Systematisation View)**
     - Check if the regularity is integrated into a broader theoretical framework that explains multiple phenomena and if it contributes to the simplicity and strength of the overall model system.
     - How: Ask if removing this regularity would require adding many ad-hoc rules to explain the same data, or if the regularity is a consequence of a more fundamental principle in the model. Also, check if the regularity is used in explaining other phenomena in the model.
     - Threshold: The regularity must be part of a compact (simple) and strong (broadly explanatory) system. If it is a core part that would leave a significant gap if removed, and if it is derived from higher-level principles, it passes.
     - Judgment: This step requires judgment about the model's structure. If the regularity is isolated and not connected to other parts, it fails. If it is deeply embedded, it passes.

  2. **Test 2: Mechanism and Intervention (Governing Feature View)**
     - Check for a plausible mechanism that explains why the regularity holds and test (in the model or in available data) whether the regularity holds under interventions.
     - How: 
          a. Is there a causal story (e.g., biological, social) that is well-established and explains the pattern? 
          b. If there are known interventions (e.g., policy changes, environmental changes) that break the regularity, note them. 
          c. If the model allows, run simulations where you intervene on the factors that are supposed to be causal and see if the regularity still holds. 
     - Threshold: The regularity passes if there is a well-supported mechanism and if the pattern holds under a variety of interventions (or at least does not break under minor ones). If there are known exceptions, they must be explicable by the mechanism (e.g., the mechanism predicts when it would break).
     - Judgment: This step requires assessing the quality of the mechanism and the scope of intervention testing. If no mechanism is known, it fails. If the mechanism is speculative, it may require conditions.

  3. **Test 3: Projectability of Predicates**
     - Check if the terms used in the regularity are projectable (i.e., not gerrymandered or time-dependent in an arbitrary way, like "grue").
     - How: Examine the variables in the regularity. Are they defined in a way that is independent of the specific data set? For example, using "indoor occupancy" is projectable, but a variable defined as "high occupancy during holiday periods" might not be if it conflates multiple factors.
     - Threshold: The regularity passes if the predicates are natural kinds or well-established, stable concepts in epidemiology. If the predicates are defined in an ad-hoc or context-dependent manner, it fails.

  4. **Test 4: Exceptionlessness vs. Coincidence**
     - Check if the regularity holds without exception in the data we have and if it is robust across different initial conditions.
     - How: 
          a. Are there any exceptions in the data? If so, are they explainable? 
          b. Does the regularity hold across different regions, time periods, and populations? 
          c. Check if the regularity is sensitive to initial conditions by running the model with slightly perturbed initial conditions and seeing if the pattern holds.
     - Threshold: The regularity passes if there are no unexplained exceptions and if it holds across a wide range of conditions. If the regularity only holds in a narrow set of circumstances, it may be a coincidence.

  5. **Tagging and Escalation Rules**:
     - **Exportable law**: Passes all tests with high confidence. Extrapolate freely.
     - **Effective or derived regularity**: Passes most tests but has some limitations (e.g., known exceptions, or only passes one view). Extrapolate only under stated conditions (which must be documented).
     - **Local coincidence**: Fails most tests, especially Test 4 (coincidence) and Test 2 (no mechanism). Refuse to extrapolate.
     - **Not decidable**: Inconclusive results, or conflicting test results that cannot be resolved with available data. Escalate to senior modeller and philosopher (if available) for further review.

     - **Handling Disagreement**: If the tests from the two philosophical views (Test 1 and Test 2) disagree, then:
          - If one view strongly passes and the other fails, the regularity is tagged as "effective or derived regularity" and conditions for extrapolation must be stated (based on the passing test).
          - If both are weak, then it is either "local coincidence" or "not decidable". 
          - The analyst must document the disagreement and the reasons.

  6. **Procedure Constraints**:
     - Each regularity should take under an hour.
     - The analyst has epidemiology/statistics training but no philosophy. Therefore, each test must be explained in simple terms and with clear steps.
     - The output is a one-page register entry.

  7. **What the Procedure Cannot Catch**:
     - Regularities that are based on predicates that are projectable but turn out to be wrong for unforeseen reasons (unknown unknowns).
     - Emergent behaviors in complex systems that are not captured by the model's structure.
     - Errors in data collection that affect multiple regularities.
     - Changes in the world that break previously stable patterns (e.g., a new pathogen variant that changes transmission dynamics).
     - Flaws in the model that are not captured by the individual regularity audits (e.g., interactions between regularities).

  Now, we run the procedure on three examples:

  **Example 1: School reopening and epidemic peak (18-22 day delay)**
  - **Test 1 (Systematic Integration)**: The regularity is about timing of peaks after a specific event. It might be isolated unless connected to a broader theory of disease transmission (e.g., incubation period plus generation time). If the model uses this delay as a fixed parameter without deriving it from more fundamental processes, it may not be well-integrated. *Likely fails or weak pass.*
  - **Test 2 (Mechanism and Intervention)**: There is a plausible mechanism: school reopening increases contacts among children, who then spread to families, leading to a peak. But are there interventions that break it? For example, if during a reopening, mask mandates are in place, does the delay still hold? Without data on interventions, we rely on the mechanism. *Passes with conditions (if mechanism is accepted).*
  - **Test 3 (Projectability)**: The predicates ("school reopening", "epidemic peak") are projectable. *Passes.*
  - **Test 4 (Exceptionlessness)**: Holds in all fourteen regions, which is good. But what if the variant changes? We don't have data on that. Also, what if reopening happens during summer? The data might be from similar seasons. *Passes conditionally, but note the conditions.*
  - **Tag**: Effective or derived regularity (because Test 1 is weak and Test 2 passes conditionally). Conditions: same pathogen, similar population immunity, and no major concurrent interventions.

  **Example 2: Power law for indoor occupancy**
  - **Test 1 (Systematic Integration)**: The power law is a common pattern in physics and epidemiology (e.g., Wells-Riley model). It may be integrated into a broader theory of airborne transmission. *Passes.*
  - **Test 2 (Mechanism and Intervention)**: There is a plausible mechanism (airborne dose). But there are known exceptions (e.g., with high ventilation). The regularity breaks under interventions that change ventilation. *Passes but with conditions (must account for ventilation, etc.).*
  - **Test 3 (Projectability)**: "Indoor occupancy" is projectable. *Passes.*
  - **Test 4 (Exceptionlessness)**: The exponent is stable across countries and settings, but there are known exceptions. *Passes conditionally (if exceptions are understood and accounted for).*
  - **Tag**: Effective or derived regularity. Conditions: in settings without exceptional ventilation or other mitigating factors.

  **Example 3: Hospital admissions lag reported cases by six days**
  - **Test 1 (Systematic Integration)**: This is a core part of the flagship model. Removing it would break the model's structure. It is derived from the average time from symptom onset to hospitalization and from testing to reporting. *Passes.*
  - **Test 2 (Mechanism and Intervention)**: There is a mechanism: time for symptoms to become severe and for reporting to occur. But what if testing policies change? During the Omicron wave, testing became less available, so the lag might change. Also, if we intervene (e.g., by increasing testing capacity), does the lag remain? *Fails because the data is from a period without major interventions in testing. The mechanism is vulnerable to policy changes.*
  - **Test 3 (Projectability)**: The terms are projectable. *Passes.*
  - **Test 4 (Exceptionlessness)**: It has been stable for three years, but note that the testing environment was relatively stable during that period. If testing behavior changes, the lag might change. *Fails because it is sensitive to initial conditions (testing infrastructure).*
  - **Tagging**: Test 1 passes but Test 2 fails and Test 4 fails. This suggests that the regularity might break under intervention. Therefore, it is **not** an exportable law. Given the failure of the governing feature view tests, it might be a local coincidence? But note: it is stable in the data we have. However, because it fails under the intervention test, we must tag it as **effective or derived regularity** with conditions? Or escalate? 

  But the problem states: "Assume (3) receives the tag we least want". The least wanted tag is probably "local coincidence" because then we cannot use it for extrapolation. However, note that the problem says "refuse to extrapolate" for local coincidence. But in this case, the regularity is central and has held for three years, so we don't want to refuse. The next worst is "not decidable". But let's see:

  The two views disagree: 
    - Systematic integration: passes (it is a core part of the model).
    - Governing feature: fails (vulnerable to interventions).

  According to our rule: if one view strongly passes and the other fails, we tag as "effective or derived regularity" and state conditions. However, if we are to assign the least wanted tag, then perhaps "local coincidence" is the least wanted because it forbids extrapolation. But that might be too harsh. Alternatively, the least wanted might be "not decidable" because it requires escalation and holds up the model.

  But the problem says: "Assume (3) receives the tag we least want". We are told to write the entry as it would appear in the register for (3) with the least wanted tag. The least wanted tag for the modellers would be "local coincidence" because it would mean they cannot use the lag for extrapolation, which is central to the model. So we assign:

  **Tag for Example 3: Local coincidence**? But that seems extreme. Alternatively, the problem might intend that the least wanted is "not decidable" because it requires escalation and holds up the process. However, the problem says "refuse to extrapolate" for local coincidence, which is more severe. Since the example (3) is the flagship model's core, the modellers would least want to be told they cannot extrapolate it. So we assign **local coincidence**? But let's see the tests:

  We have:
    - Test 1: Pass (systematic integration)
    - Test 2: Fail (mechanism vulnerable to interventions)
    - Test 3: Pass
    - Test 4: Fail (it is sensitive to initial conditions, i.e., the testing infrastructure)

  But note: the stability of the lag might be due to the specific conditions of the past three years (testing availability, health-seeking behavior, etc.). Without a mechanism that ensures the lag remains six days regardless of interventions, and with the possibility that the initial conditions (testing infrastructure) might change, it might be considered a coincidence of the initial conditions.

  Therefore, we can assign **local coincidence** if we interpret that the pattern is not robust and is coincidental to the specific conditions. This would be the least wanted tag.

  Alternatively, we could assign **not decidable** because of the conflict? But the procedure says for conflict we assign effective or derived, unless both are weak. Here Test1 is strong but Test2 is weak (fail). We have a rule: if one passes and the other fails, we assign effective or derived with conditions. But the problem says to assign the least wanted tag. So we must override and assign local coincidence? Or the problem might be that we are to assume it receives the least wanted tag, so we are to write it as local coincidence.

  We'll write the register entry for (3) as **local coincidence**.

  **Register Entry for Example 3: Hospital admissions lag reported cases by six days**

  **Regularity ID:** FLAGSHIP-LAG-001  
  **Description:** Hospital admissions lag reported cases by six days. Stability observed over three years of national data.  
  **Tests:**  
  1. **Systematic Integration:** Pass. This regularity is a core component of the flagship model and is deeply integrated. Removing it would require a major model restructuring.  
  2. **Mechanism and Intervention:** Fail. Although a biological mechanism (time for disease progression) exists, the lag is vulnerable to changes in testing policies and reporting delays. Historical data comes from a period of stable testing infrastructure. Model interventions (simulating reduced testing capacity) show the lag increases.  
