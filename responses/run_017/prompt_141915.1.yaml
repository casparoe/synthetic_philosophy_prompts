answer: |-
  Below is a comprehensive audit procedure for evaluating epidemiological regularities, designed to be executed by analysts with epidemiology/statistics training (no philosophy background) in under one hour per regularity. The procedure incorporates tests grounded in both major philosophical views of laws of nature ("best systematisation" and "governing feature" views), addresses projectability (grue-style concerns), and distinguishes exceptionless patterns from coincidences. The output is a standardized one-page register entry for senior modeller sign-off. 

  ---

  ### **Regularity Audit Procedure**  
  **Purpose**: Tag each regularity as:  
  - **Exportable law** (EL): Extrapolate freely.  
  - **Effective or derived regularity** (ED): Extrapolate only under stated conditions.  
  - **Local coincidence** (LC): Refuse to extrapolate.  
  - **Not decidable on the data we have** (ND): Escalate.  

  **Required Inputs**:  
  - The regularity (e.g., mathematical form, variables, fitted parameters).  
  - All available data (historical, cross-regional, experimental).  
  - Model documentation (mechanisms, assumptions, dependencies).  

  **Procedure** (run tests in order; stop if a test forces ND or LC tag):  
  1. **Test 1: Systematic Strength (Best Systematisation View)**  
     - *Rationale*: Laws earn their place by simplifying and strengthening the overall system.  
     - *Test*: Assess if removing this regularity would (a) require adding ≥3 ad-hoc rules to explain the same data, or (b) significantly weaken the model’s coverage of other phenomena.  
     - *Threshold*: Pass if (a) false AND (b) false.  
     - *Judgment call*: Analyst estimates "significant weakening" (e.g., losing >20% explanatory scope). If unclear, mark ND.  

  2. **Test 2: Projectability Check**  
     - *Rationale*: Predicates (e.g., "indoor occupancy") must be non-gerrymandered to avoid grue-style failures.  
     - *Test*: Are all variables in the regularity defined independently of specific times, places, or outcomes? (e.g., "indoor occupancy" is projectable; "post-reopening cases" is not).  
     - *Threshold*: Pass if no variable relies on contextual or arbitrary thresholds (e.g., "high" or "peak" must have domain-specific definitions).  
     - *Judgment call*: If predicates are ambiguous (e.g., "social mixing"), mark ND.  

  3. **Test 3: Intervention Stability (Governing Feature View)**  
     - *Rationale*: Laws reflect features that persist under interventions; coincidences do not.  
     - *Test*:  
       - (a) Is there a causal mechanism (e.g., biological, behavioral) documented in literature/model?  
       - (b) Does the regularity hold when simulated under ≥2 interventions (e.g., policy changes, hypothetical scenarios) in the model?  
     - *Threshold*: Pass if (a) true AND (b) true.  
     - *Judgment call*: If no intervention data exists, use mechanism plausibility (escalate to sign-off if weak).  

  4. **Test 4: Exceptionlessness**  
     - *Rationale*: Laws are invariant; coincidences depend on initial conditions.  
     - *Test*:  
       - (a) Are exceptions rare (<5% of data) and explained by the mechanism?  
       - (b) Does the regularity hold across ≥3 distinct contexts (e.g., regions, seasons, demographics)?  
     - *Threshold*: Pass if (a) true AND (b) true.  
     - *Judgment call*: "Explained" means tied to a testable factor (e.g., ventilation for transmission).  

  **Tagging Rules**:  
  - **EL**: Pass all tests.  
  - **ED**: Pass Test 2 AND at least two other tests.  
  - **LC**: Fail Test 2 OR fail both Test 3 and Test 4.  
  - **ND**: Inconclusive/missing data in any test OR Tests 1/3 directly conflict (see below).  
  - **Handling Test Conflicts**:  
    - If Tests 1 (systematic) and 3 (intervention) disagree (e.g., 1 passes but 3 fails), tag as **ED** and document conflict in conditions.  
    - If Tests 1/3 conflict AND Test 4 fails, tag as **ND** and escalate.  
  - **Conditions for ED**: Must specify constraints (e.g., "Only if vaccination rates >70%").  

  **Output**: One-page register entry (template below).  
  **Sign-off**: Senior modeller resolves judgment calls and approves tags.  

  **What This Procedure Cannot Catch**:  
  - **Emergent systemic risks**: Interactions between regularities (e.g., feedback loops).  
  - **Black-swan events**: Unprecedented changes (e.g., new pathogen variants).  
  - **Data bias**: Systemic errors in historical data collection.  
  - **Conceptual drift**: Evolving social behaviors invalidating predicates.  
  - **Overfitting**: Statistical validity is assumed pre-audit; this focuses on extrapolation.  

  ---

  ### **Example Audits**  
  #### **(1) School reopening → epidemic peak (18–22 day delay)**  
  - **Test 1 (Systematic Strength)**: Pass. Removing it would weaken school-related projections (e.g., childcare impacts) and require ad-hoc adjustments.  
  - **Test 2 (Projectability)**: Pass. "School reopening" and "epidemic peak" are standard, non-gerrymandered predicates.  
  - **Test 3 (Intervention Stability)**: Fail. No mechanism provided; model assumes fixed delay without causal link (e.g., no accounting for hybrid learning). Interventions (e.g., phased reopenings) break the pattern in simulations.  
  - **Test 4 (Exceptionlessness)**: Pass. Holds in all 14 regions; exceptions (e.g., Region 9: 28-day delay) explained by exam periods.  
  - **Tag**: **ED** (fails Test 3). Conditions: Extrapolate only if reopening is full-time and coincides with low vaccination in children.  

  #### **(2) Indoor occupancy → transmission (power law)**  
  - **Test 1 (Systematic Strength)**: Pass. Integral to ventilation and mobility submodels; removal would collapse linked projections.  
  - **Test 2 (Projectability)**: Pass. "Indoor occupancy" and "transmission" are well-defined.  
  - **Test 3 (Intervention Stability)**: Pass. Mechanism (airborne dose) is plausible and peer-reviewed; pattern holds under simulated interventions (e.g., mask mandates).  
  - **Test 4 (Exceptionlessness)**: Fail. Exceptions occur in high-ventilation settings (e.g., hospitals) and are not fully explained.  
  - **Tag**: **ED** (fails Test 4). Conditions: Extrapolate only in low-ventilation settings; exclude healthcare facilities.  

  #### **(3) Hospital admissions lag reported cases by 6 days**  
  *Assigned tag: **LC** (local coincidence; "least wanted" as it forbids extrapolation)*  
  **Register Entry**:  
  ```markdown
  REGULARITY ID: NH-ADMIT-LAG-001  
  DESCRIPTION: Hospital admissions lag reported cases by 6 days (±0.5 days). Stable in national data (2021–2024).  

  TEST RESULTS:  
  1. Systematic Strength: PASS. Core to flagship model; removal would require rebuilding admission forecasting.  
  2. Projectability: PASS. "Hospital admissions" and "reported cases" are standardized predicates.  
  3. Intervention Stability: FAIL. No mechanism provided (assumes static testing/hospital behavior). Under interventions (e.g., testing surges in model), lag shifts to 3–10 days.  
  4. Exceptionlessness: FAIL. Stable only under 2021–2024 conditions (fixed testing access, triage protocols). Breaks in regional data during testing shortages (e.g., Winter 2023).  

  PHILOSOPHICAL CONFLICT: Tests 1 (systematic) and 3 (intervention) disagree.  
  TAG: LOCAL COINCIDENCE (LC)  
  REASON: Pattern is contingent on unstated initial conditions (testing infrastructure, healthcare policies) and lacks intervention stability.  

  ACTIONS:  
  - Refuse to extrapolate. Do not use for policy outside 2021–2024 national context.  
  - Escalate to model-refinement team: Rebuild lag as a dynamic function (e.g., f(testing capacity)).  

  SENIOR MODELLER SIGN-OFF:  
  [Signature/Date]  
  ```  

  ---

  This procedure ensures philosophical robustness while remaining operational. For ND tags, recommend involving a philosopher-epidemiologist (if available) during escalation.
