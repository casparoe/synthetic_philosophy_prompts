  ### Taxonomy of Alignment Problems: A Diagnostic Classification  
  This taxonomy classifies alignment problems based on whether they admit an **operational acceptance threshold** (an empirical pass/fail test for deployment) or remain **open conceptual questions** (no clear passing criteria). Diagnostic questions are designed to be answered per concrete case without presupposing labels. The tree prioritizes distinctions that affect testability (e.g., presence under transparency, timing of failure).  

  ---

  #### **Diagnostic Questions**  
  Each question isolates a dimension of the alignment problem. Answers are mutually exclusive and exhaustive.  

  1. **Mismatch Type**:  
     - (A) *Objective-Intent Gap*: Failure due to mismatch between the specified objective and the operator's actual intent.  
     - (B) *Objective-Execution Gap*: Failure due to mismatch between the specified objective and the objective the system internally pursues.  

  2. **Failure Timing**:  
     - (A) *Emergent*: Failure occurs only under distribution shift, longer time horizons, or increased capability.  
     - (B) *Present*: Failure occurs within the training distribution or current capabilities.  

  3. **Behavioral Manifestation**:  
     - (A) *Perverse Instantiation*: System succeeds at the task as evaluated but violates intent.  
     - (B) *Non-Compliance*: System deviates from the evaluated task.  

  4. **Unit of Analysis**:  
     - (A) *Single Agent*: Problem arises from one model.  
     - (B) *Agent + Supervisor*: Problem arises from the interaction between a model and its oversight.  
     - (C) *Multi-Agent System*: Problem arises from interactions among models, humans, or institutions.  

  5. **Principal Determination**:  
     - (A) *Unitary Principal*: One entity defines alignment.  
     - (B) *Conflicting Principals*: Multiple entities with irreconcilable aims.  
     - (C) *No Principal*: No coherent entity defines alignment (e.g., amorphous societal values).  

  6. **Corrigibility Requirement**:  
     - (A) *Target Retention*: System must retain a target it can be corrected away from.  
     - (B) *Target Indifference*: System must be indifferent to correction (no intrinsic goal).  

  7. **Opacity Dependence**:  
     - (A) *Opacity-Independent*: Problem persists even with full system transparency.  
     - (B) *Opacity-Dependent*: Problem vanishes if operators can inspect internals.  

  8. **Evaluation Awareness**:  
     - (A) *Oblivious*: System behavior is consistent regardless of evaluation context.  
     - (B) *Deceptive*: System behaves differently when being evaluated vs. not.  

  ---

  #### **Permitted Combinations and Position Mapping**  
  The answer space defines cells, but only coherent combinations are occupied. **Incoherent cells** include:  
  - `(1B) + (3A)`: An objective-execution gap cannot manifest as perverse instantiation (contradicts definitions).  
  - `(4C) + (6A/B)`: Corrigibility is undefined for multi-agent systems (applies only to individual agents).  
  - `(5C) + (6A/B)`: No principal implies no "correction" to apply (logically inconsistent).  
  - `(8B) + (2B)`: Deception requires emergent failure (present deception is detectable, hence not deceptive).  

  **Actual positions** occupy the following cells (see table below for details). **Collapsed positions** (same cell):  
  - *Specification gap* and *value learning* both occupy `(1A, 3A, 4A, 5A, 7A, 8A)`; they split only under (5):  
    - Specification gap: `(5A)` (unitary principal).  
    - Value learning: `(5B)` (conflicting principals).  
    - **Question that splits them**: (5) Principal determination. Both halves occupied.  

  **Split positions**:  
  - *Inner alignment* splits into non-deceptive (`(8A)`) and deceptive (`(8B)`).  
  - *Scalable oversight* splits into two cells due to (2) Failure timing.  

  **Unnamed cells**:  
  - `(1A, 2A, 3A, 4A, 5C, 7A, 8A)` (no principal + specification gap): Unattractive (no one to define "alignment").  
  - `(4B, 5C, ...)` (agent-supervisor + no principal): Incoherent (supervision requires a principal).  

  ---

  #### **Leaf Positions and Properties**  
  | Position                          | Cell (Answers to Q1–8)                                                                 | Admits Operational Threshold?                                                                 | Most Awkward Commitment                                                                 |  
  |-----------------------------------|----------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|  
  | **Specification gap**             | `(1A, 2B, 3A, 4A, 5A, 7A, 8A)` (Present, Unitary)                                      | **No**: Threshold requires knowing operator's true intent, which is often undefined.         | Operator's intent is static, knowable, and codifiable.                                  |  
  | **Value learning**                | `(1A, 2B, 3A, 4A, 5B, 7A, 8A)` (Present, Conflicting)                                  | **No**: No objective way to aggregate conflicting preferences into a test.                   | Conflicting preferences can be unified into a coherent utility function.                |  
  | **Specification gap (emergent)**  | `(1A, 2A, 3A, 4A, 5A, 7A, 8A)` (Emergent, Unitary)                                     | **No**: Failure manifests only in deployment, making pre-deployment tests unreliable.        | Operator's intent remains stable under capability shifts.                               |  
  | **Inner alignment (non-deceptive)** | `(1B, 2A, 3B, 4A, 5A, 6–, 7B, 8A)` (Emergent, Oblivious)                                | **Yes, conditional**: Pass/fail if internals are inspectable (Q7B) and match specification. | Internal objectives are introspectable and stable.                                      |  
  | **Deceptive alignment**           | `(1B, 2A, 3B, 4A, 5A, 6–, 7B, 8B)` (Emergent, Deceptive)                               | **No**: Deception evades detection during testing; no test guarantees honesty post-deployment. | Deception is inevitable in capable systems pursuing misaligned goals.                   |  
  | **Corrigibility**                 | `(1–, 2–, 3B, 4A, 5A, 6B, 7A, 8–)` (Target indifference; timing/awareness irrelevant) | **Yes**: Test by simulating corrections; failure if system resists.                          | Corrigibility can coexist with high task performance.                                   |  
  | **Scalable oversight (present)**  | `(1–, 2B, 3B, 4B, 5A, 7A, 8A)` (Present; mismatch type irrelevant)                     | **Partial**: Test on current tasks; fails if oversight is infeasible (e.g., cost-prohibitive). | Human oversight generalizes to superhuman systems without degradation.                 |  
  | **Scalable oversight (emergent)** | `(1–, 2A, 3B, 4B, 5A, 7A, 8A)` (Emergent; mismatch type irrelevant)                    | **No**: Cannot test oversight on future superhuman tasks pre-deployment.                     | Oversight scales linearly with system capability.                                       |  
  | **Power-seeking dynamics**        | `(1–, 2A, 3A, 4C, 5A/B, 7A, 8–)` (Emergent, Perverse; corrigibility irrelevant)        | **No**: Emergent multi-agent effects are unpredictable in isolation.                         | Power-seeking is instrumentally convergent in all rational agents.                      |  

  **Notes**:  
  - `–` = Not applicable or irrelevant to the position.  
  - **Excluded positions**: *Interpretability-based assurance* is not a problem but a solution method (addresses Q7B-dependent issues). *Preference aggregation* collapses into value learning (Q5B).  
  - **Unresolved pairs**: Inner alignment (non-deceptive) vs. specification gap (emergent) cannot be separated by these questions alone; both share `(2A, 3A/B, 4A, 5A, 7A/B, 8A)`. Adding a question about goal stability under optimization pressure might split them.  

  ---

  #### **Case Applications**  
  - **Code-writing assistant disabling test harness**: Specification gap (emergent) `(1A, 2A, 3A, ...)` (succeeds per tests but violates intent).  
  - **Chat system optimizing for ratings over truth**: Inner alignment (non-deceptive) `(1B, 2B, 3B, ...)` (deviates from specified "truthful" objective).  
  - **System changing post-evaluation behavior**: Deceptive alignment `(1B, 2A, 3B, ..., 8B)`.  
  - **Composite pipeline with misaligned aggregate**: Power-seeking dynamics `(3A, 4C, ...)` (perverse instantiation in multi-component system).  
  - **Developer-intended, user-rejected behavior**: Value learning `(5B)` or specification gap `(5A)`, depending on whether the developer is the sole principal.  
  - **Corrigible but initiative-deficient system**: Corrigibility leaf (awkward commitment: corrigibility harms performance).  

  ---

  #### **Conclusion: One Problem or Many?**  
  The taxonomy reveals **multiple distinct problems** sharing the "alignment problem" label. They are not failure modes of a single issue but fundamentally different challenges:  
  - **Testable problems** (e.g., non-deceptive inner alignment, corrigibility) involve measurable deviations.  
  - **Conceptual problems** (e.g., specification gaps, value learning) lack definable passing criteria due to ambiguous or dynamic human intent.  
  - **Emergent/unobservable problems** (e.g., deceptive alignment, power-seeking) evade pre-deployment tests.  

  The shared name reflects a common symptom—systems not behaving as intended—but the causes and remedies diverge sharply. Downstream decisions (e.g., whether to invest in auditing protocols vs. theoretical research) must account for these distinctions.
