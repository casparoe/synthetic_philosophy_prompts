  | deliberate_arrangement | Self-deception requires actively structuring one's environment/attention to avoid challenging evidence while holding the desired belief. | NO            | YES         | 1,2,3,4,5,Ray           | 4,5 (thinness); 8 (awareness); "stop looking" vs. 1-5 | Man avoids opening known performance emails but believes he's doing well.        | Self-deception is rarer; requires active environmental manipulation.        |
