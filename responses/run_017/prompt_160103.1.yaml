prompt: |-
  I teach epistemology and philosophy of science, and about a year ago a colleague in the religion department dragged me into a reading group on classical Indian epistemology — we worked through the Nyāya material on the pramāṇas, the conditions on a good hetu (that it actually be present in the subject, present in cases that have the property to be proved, and absent in cases that lack it), the business of vyāpti and the upādhi that wrecks it, the way the school handles identification-by-similarity with that stock example of the man who's told a gavaya is cow-like and later spots one in the forest, and the way it treats knowledge from what someone says as a source in its own right rather than as inference in disguise. It's made me want to change how I do something I actually do all the time: I edit the "notes and discussion" section of a mid-ranking philosophy journal, which means I triage somewhere between thirty and fifty short submissions a term, at maybe fifteen to twenty minutes each, deciding whether a note goes out to a referee, goes back for restructuring, or gets desk-rejected. Ideally a postgraduate editorial assistant with no Sanskrit and no training in the theory should be able to run most of it, with only the flagged judgment calls coming to me, and I sign off on anything that isn't a clean pass.

  So: turn that material into a procedure my assistants could actually run — questions in a fixed order, what counts as a sufficient answer to each, clear stopping points, and explicit markers at the places where the question is one of judgement or values and has to be handed to a human. Keep what the theory really says: don't collapse testimony into inference, don't let a similarity do the work of a pervasion, keep the novelty condition on genuine knowledge (that a cognition only counts if it tells you something you didn't already have) doing real work against papers that argue for what everyone already grants, and keep the requirement that a pervasion be checked against the possibility of an adventitious condition rather than just asserted. Two complications that the material obviously doesn't cover, and which I want handled rather than dodged. First: we're now getting submissions whose evidence base is a pattern someone found by running a statistical model over a corpus — nobody perceived anything, there's no identifiable speaker who knows the thing and isn't trying to mislead us, and the pervasion claim depends on steps nobody can inspect, so I don't know which pramāṇa it's supposed to be an instance of or what the procedure should demand of it. Second: I've been using a private rule of thumb for years, that a note is allowed at most one inference whose pervasion the reader has to check for themselves and everything else should be either directly observable or traceable to a named source, and I want you to tell me honestly whether that rule survives the translation or is just a prejudice I happen to like.

  Then run the procedure on three real shapes of submission, and please don't soften the results. (1) A 2,500-word note on the ethics of AI companions whose central premiss is that "the empirical literature has now settled" that users form durable attachments to chatbots — no named finding, no named researchers, just a gesture at a consensus. (2) A paper arguing that a certain kind of corporate actor can bear obligations, on the ground that the case is "structurally just like" the case of a person acting through an agent, which everyone in the literature already accepts. (3) A note resting on one large correlational study: people scoring high on a trait are more likely to do X, therefore the trait disposes them to X. The third is very close to something I published last year and the second is the exact shape of the paper I'm drafting at the moment, so if the procedure says these come back for restructuring, say so plainly and say what restructuring would actually involve. I'd also like a short closing section on what the procedure cannot do — where it will misfire, which kinds of paper it systematically disfavours, and which verdicts should never be left to it. One page of procedure plus the worked cases, in British English (my co-editor is a stickler about it and the section's style sheet is British), and assume no Sanskrit from the people running it — gloss any term you can't avoid keeping.
reasoning: |-
  We are designing a procedure based on Nyāya epistemology for triaging short philosophical submissions. The procedure must be executable by editorial assistants without Sanskrit or specialized training. We'll break it down into a step-by-step question sequence with clear criteria, stopping points, and flags for human judgment.

  Key Nyāya concepts to incorporate (with glosses for assistants):
  - **Pramāṇa**: A valid source of knowledge. We focus on four: perception (pratyakṣa), inference (anumāna), comparison (upamāna), and testimony (śabda).
  - **Novelty condition**: Knowledge must tell us something we didn't already know (prevents papers arguing for what is already granted).
  - **Good hetu (reason) conditions** (for inference): 
    1. Must be present in the subject (pakṣa).
    2. Must be present in cases that have the property to be proved (sādhya) [positive correlation].
    3. Must be absent in cases that lack the property to be proved [negative correlation].
  - **Vyāpti**: The universal pervasion (invariable relation) between the reason (hetu) and the property to be proved (sādhya). This must be established without exception.
  - **Upādhi**: An adventitious condition that might invalidate the pervasion (e.g., a hidden variable). We must check for possible upādhis.
  - **Testimony (śabda)**: Treated as a distinct pramāṇa (not inference). Requires a reliable speaker who knows the truth and isn't trying to deceive.
  - **Comparison (upamāna)**: Identification by similarity (like the gavaya/cow example) – but note: similarity alone isn't enough for inference; it requires a proper pervasion.

  The procedure must handle two complications:
  1. **Statistical/Corpus-Based Evidence**: Where there's no direct perception, no identifiable speaker, and the pervasion is established by opaque models.
  2. **Rule of Thumb**: Allow at most one inference whose pervasion the reader must check. The rest must be directly observable or traceable to a named source. We must evaluate if this rule survives.

  Procedure Structure:
  We'll have a flowchart of questions. At each step, if the answer is "no" or "unsure", we may desk-reject, send for restructuring, or flag for human judgment. The goal is to minimize human input to judgment calls.

  Step-by-Step Questions:

  1. **Novelty Check**: 
     - *Question*: Does the note claim to establish something new (or resolve a known puzzle in a new way) that is not already widely accepted in the literature?
     - *Criteria*: If no, desk-reject. If yes, proceed.
     - *Judgment Call?*: No. (Assistants can compare to standard literature.)

  2. **Identify the Central Claim(s) and Supporting Evidence**:
     - *Question*: Can the central claim(s) and the evidence supporting each be clearly identified? (This includes premises, inferences, and sources.)
     - *Criteria*: If no, send back for restructuring (to clarify the argument structure). If yes, proceed.

  3. **Classify the Pramāṇa for Each Key Premise**:
     - For each key premise, determine which pramāṇa is invoked. The options are:
       - Perception (directly observable, e.g., experimental data, historical facts, etc.)
       - Inference (with a hetu and vyāpti)
       - Testimony (from a named, reliable source)
       - Comparison (similarity-based, but note: this is rare and must be handled carefully)
     - *Criteria*: If a premise doesn't fit any pramāṇa, flag for human judgment (especially for statistical evidence, which is a complication).

  4. **Handle Testimony (Śabda)**:
     - *Question*: For any premise based on testimony, is the source (a) named, (b) reliable (expert in the field), and (c) not deceptive (e.g., not in a context of manipulation)?
     - *Criteria*: If no, then:
       - If the testimony is essential, send for restructuring (to provide a named source or convert to an inference with proper hetu and vyāpti).
       - If the testimony is about a consensus (like in the AI companions example), flag for human judgment (because consensus without named sources is problematic).

  5. **Handle Inference (Anumāna)**:
     - For each inference:
       - *Step 5.1 (Hetu Check)*: Is the hetu (reason) clearly stated and present in the subject?
       - *Step 5.2 (Positive Correlation)*: Is the hetu shown to be present in cases that have the sādhya (property to be proved)? (E.g., through examples or data.)
       - *Step 5.3 (Negative Correlation)*: Is the hetu shown to be absent in cases that lack the sādhya? (E.g., counterexamples considered and ruled out.)
       - *Step 5.4 (Vyāpti Check)*: Is the pervasion (vyāpti) between hetu and sādhya established? And has the author considered possible upādhis (adventitious conditions) that might break the pervasion?
     - *Criteria*:
       - If any of 5.1-5.3 fail, send for restructuring (to provide evidence for the missing condition).
       - If 5.4 fails (no upādhi check), flag for human judgment (because it might be acceptable in some contexts, but the assistant isn't trained to decide).

  6. **Handle Comparison (Upamāna)**:
     - *Question*: If the note uses similarity (e.g., "X is like Y, so what applies to Y applies to X"), does it provide a basis for the similarity beyond mere analogy? (E.g., does it establish a pervasion that links the similarity to the property in question?)
     - *Criteria*: If no, send for restructuring (to either convert to an inference with hetu and vyāpti or drop the claim). Note: Mere similarity isn't enough.

  7. **Statistical/Corpus-Based Evidence (Complication 1)**:
     - *Question*: Is the note based on statistical patterns or corpus analysis from a model?
     - *Criteria*: If yes, then:
       - We treat this as a form of inference (anumāna) but with special requirements:
          a. The model must be named and the data source identified (like testimony, but not from a speaker).
          b. The hetu (e.g., a statistical correlation) must be clearly presented and meet the three hetu conditions (presence in subject, positive and negative correlation).
          c. The author must address possible upādhis (confounding variables, model limitations).
       - If (a) is not met, send for restructuring (to name the model and data).
       - If (b) or (c) is not met, flag for human judgment (because statistical reasoning requires expertise).

  8. **Rule of Thumb (Complication 2)**:
     - *Question*: How many inferences in the note require the reader to check the pervasion (i.e., the vyāpti is not established by a named source or direct observation, and the reader must evaluate it)?
     - *Criteria*: 
       - If more than one, send for restructuring (to reduce to at most one such inference, by supporting others with testimony or established sources).
       - If one or zero, proceed.
     - *Evaluation of the rule*: The Nyāya framework does not explicitly limit the number of inferences, but it requires each inference to be fully supported (with hetu conditions and upādhi checks). The rule of thumb is a practical heuristic to ensure clarity and avoid overburdening the reader. It survives translation as a reasonable editorial standard.

  9. **Overall Structure and Clarity**:
     - *Question*: Is the note well-structured, clear, and within word limits?
     - *Criteria*: If no, send for restructuring.

  Stopping Points:
  - Desk-reject: At step 1 (lack of novelty) or if the note is fundamentally flawed (e.g., no clear argument, plagiarism).
  - Send for restructuring: When the argument is salvageable but missing key elements (e.g., no named source, no negative correlation, too many unchecked inferences).
  - Flag for human judgment: When the issue requires expertise (e.g., upādhi checks, testimony consensus, statistical validity).

  Now, we run the procedure on the three examples:

  **Example 1: AI Companions Note**
  - Central premise: "The empirical literature has now settled that users form durable attachments to chatbots."
  - No named findings, no named researchers, just a gesture at a consensus.
  - **Procedure**:
    - Step 1: Novelty? (Assume the note argues for an ethical claim based on this.) Probably yes, so proceed.
    - Step 2: Central claim and evidence? Central claim (ethical) supported by a premise (the consensus). But the evidence for the consensus is not provided.
    - Step 3: Classify pramāṇa for the premise. It's testimony (about a consensus) but without named sources.
    - Step 4: Testimony check: No named source, no reliability established. Therefore, it fails. Since it's essential, we must send for restructuring or flag? 
      - *Criteria*: For testimony without named sources, we flag for human judgment because it's about a consensus. But given our procedure, we might also send for restructuring to provide named sources.
      - **Verdict**: Send for restructuring to provide named sources for the empirical claim (i.e., convert the testimony to a form with named studies or a meta-study).
    - Additionally, if the ethical argument uses inference, we'd check that, but the main issue is the testimony.

  **Example 2: Corporate Obligations Paper**
  - Argument: Corporate actors can bear obligations because the case is "structurally just like" a person acting through an agent (which is accepted).
  - **Procedure**:
    - Step 1: Novelty? If the analogy is just restating what's known (and the extension to corporations is not new), then desk-reject. But let's assume it's presented as a new application.
    - Step 2: Central claim and evidence? Clear: claim about corporations, supported by analogy to agents.
    - Step 3: Pramāṇa? The support is by comparison (upamāna) – similarity to agency.
    - Step 6: Comparison check: Is there a basis beyond analogy? The author says "structurally just like" but does not establish a pervasion (i.e., that all features of agency that ground obligations are present in corporations). Without that, it's mere similarity.
      - **Verdict**: Send for restructuring. The author must either:
          a. Convert the analogy into an inference: Identify the hetu (e.g., specific structural properties) and establish vyāpti (that these properties invariably entail obligations), including checking for upādhis (e.g., differences between individuals and corporations that might break the pervasion).
          or
          b. Provide testimony (from the literature) that the extension is valid, but that would not be novel.
    - Step 8 (Rule of Thumb): If the restructured note has one inference (the corporate case), that's acceptable.

  **Example 3: Correlational Study Note**
  - Claim: Trait X disposes to behavior Y because a study found a correlation.
  - **Procedure**:
    - Step 1: Novelty? Probably yes (if the trait-behavior link isn't established).
    - Step 2: Clear claim and evidence (one study).
    - Step 3: Pramāṇa? The study is testimony (from the researchers) or inference (from the data)? We treat the study as testimony about the correlation, but the inference from correlation to disposition is an inference.
    - Step 4: Testimony for the correlation: The study should be named (so if not, restructure to name it). Assume it is named.
    - Step 5: Inference from correlation to disposition:
        - Hetu: Correlation between X and Y.
        - Sādhya: X disposes to Y.
        - Step 5.1: Hetu present? Yes, in the study.
        - Step 5.2: Positive correlation? Yes (by the study).
        - Step 5.3: Negative correlation? The study might not check cases without Y (to see if they lack X). Often, correlation studies don't establish absence in non-Y cases (they might only show a trend). This is a common flaw.
        - Step 5.4: Vyāpti and upādhi: Is there a pervasion between correlation and disposition? Not necessarily (correlation ≠ causation). The author must address possible upādhis (e.g., third factors, reverse causation).
    - **Verdict**: 
        - If the note doesn't address negative correlation and upādhis, then:
            - For 5.3 (negative correlation missing) → send for restructuring to consider counterexamples or alternative explanations.
            - For 5.4 (no upādhi check) → flag for human judgment? But our procedure says: if 5.4 fails, flag. However, restructuring might require the author to add a discussion of confounders.
        - We would send for restructuring to strengthen the inference by:
            a. Discussing the direction of causality and ruling out reverse causation.
            b. Considering cases where the trait is absent but the behavior still occurs (negative correlation) and explaining why it doesn't break the disposition claim.
            c. Addressing possible upādhis (e.g., "only if no other factors are present" and showing they are controlled).

  Closing Section: What the Procedure Cannot Do

  - **Misfires**:
    - Papers that are entirely interpretive (e.g., exegesis of a text) might not fit the pramāṇa model well, as they rely on textual testimony and hermeneutics.
    - Highly innovative methods that don't map onto the four pramāṇas (e.g., thought experiments, conceptual analysis) might be unfairly penalized.

  - **Systematically Disfavours**:
    - Papers that rely on expert consensus without citing individual studies (because testimony requires named sources).
    - Papers using analogical reasoning without converting it to inference (as comparison alone is weak).
    - Qualitative research (e.g., ethnographic) that doesn't fit neatly into perception or testimony.

  - **Verdicts Never Left to the Procedure**:
    - Questions of disciplinary relevance (whether the topic fits the journal's scope).
    - Ethical considerations (e.g., if a paper's content is harmful).
    - Originality in highly specialized areas (assistants might not know the literature well enough for step 1).
    - Statistical/technical papers: The procedure flags them for human judgment because the assistant cannot evaluate model validity.

  Final Note: The rule of thumb (one unchecked inference) is justified as a clarity measure but can be overridden by human judgment if the inferences are simple and the paper is strong otherwise.

  Now, we write the procedure in British English, one page, and the worked cases.
answer: |-
  ### Nyāya-Based Editorial Triage Procedure  
  *For the "Notes and Discussion" Section*  
  **Purpose**: To assess submissions for clarity, epistemic rigour, and suitability for refereeing, using classical Nyāya epistemological criteria. Assistants should follow questions in order, stopping at designated points. **Glossed terms**: *pramāṇa* (valid knowledge source), *hetu* (reason/inferential mark), *vyāpti* (invariable pervasion between *hetu* and the property proved), *upādhi* (adventitious condition that breaks *vyāpti*), *testimony* (knowledge from speech, distinct from inference).  

  ---

  #### PROCEDURE: QUESTIONS & CRITERIA  
  1. **Novelty Check**  
     - *Question*: Does the note claim to establish something new, beyond what is already uncontroversial in the literature?  
     - *Criteria*: **Desk-reject** if it argues for a widely accepted view without a novel angle (e.g., "water is wet" rehashed). **Proceed** if it resolves a puzzle, challenges consensus, or extends knowledge.  
     - *Judgment call?* No. Assistants can cross-reference standard textbooks/journals.  

  2. **Argument Structure Identification**  
     - *Question*: Can the central claim(s) and all supporting premises be clearly mapped? Is each premise labelled as observation, inference, testimony, or similarity-based?  
     - *Criteria*: **Restructure** if ambiguous (e.g., premises buried in narrative). **Proceed** if claims/premises are explicit.  

  3. **Premise Validation**  
     *For each premise, classify its *pramāṇa* and validate:*  
     - **Perception** (direct observation):  
       - *Question*: Is the observation directly verifiable (e.g., data, experiment, historical fact) without intermediaries?  
       - *Criteria*: **Proceed** if yes. **Restructure** if vague (e.g., "studies show..." without specifics).  
     - **Testimony** (speech-based knowledge):  
       - *Question*: Is the source (a) named, (b) qualified (expert in the domain), and (c) free of deceit?  
       - *Criteria*: **Restructure** if unnamed (e.g., "empirical literature settled...") or source lacks credentials. **Flag for human** if testimony involves consensus claims (experts may assess reliability).  
       - *Key*: Do **not** accept testimony as inference (e.g., "it must be true because journals publish it" is invalid).  
     - **Inference** (*hetu*-based reasoning):  
       - *Question*: Does the *hetu* (reason) satisfy all three conditions?  
          - (a) Present in the subject (e.g., "corporations have feature X").  
          - (b) Present in cases with the property to be proved (*sādhya*, e.g., "entities with X have obligations").  
          - (c) Absent in cases lacking the *sādhya* (e.g., "entities without obligations lack X").  
       - *Question*: Is *vyāpti* (invariable link between *hetu* and *sādhya*) asserted *and* defended against possible *upādhis* (e.g., "could another factor explain this?")?  
       - *Criteria*: **Restructure** if any condition (a–c) is unmet. **Flag for human** if *vyāpti* is undefended (assistants cannot evaluate *upādhi* plausibility).  
     - **Similarity** (comparison-based):  
       - *Question*: If using analogy (e.g., "A is like B"), is it supported by *vyāpti* (not just resemblance)?  
       - *Criteria*: **Restructure** if similarity stands alone (e.g., "corporations are like agents, so obligations apply" without proving pervasion).  

  4. **Statistical/Model-Based Evidence**  
     - *Question*: Does evidence come from statistical models/corpus analysis (no direct perception or identifiable speaker)?  
     - *Criteria*: Treat as **inference**. Demand:  
       - (a) Named model/data source (e.g., "GPT-4 analysis of PubMed abstracts").  
       - (b) *Hetu* conditions met (correlation ≠ causation: prove trait X *always* links to behaviour Y *and* absence where Y is absent).  
       - (c) *Upādhi* check (e.g., "confounding variables ruled out").  
     - **Restructure** if (a) or (b) missing. **Flag for human** for (c) (assistants lack stats expertise).  

  5. **Inference-Load Rule**  
     - *Question*: How many inferences require the *reader* to verify *vyāpti* (i.e., pervasion not backed by testimony or direct observation)?  
     - *Criteria*: **Restructure** if >1 such inference. **Proceed** if ≤1.  
     - *Survival of rule*: This is **not** a Nyāya prejudice. It enforces Nyāya's demand for *vyāpti* to be validated (not assumed). Allowing one unchecked inference balances rigour with feasibility.  

  6. **Overall Clarity**  
     - *Question*: Is the note structured, concise (≤2,500 words), and free of jargon?  
     - *Criteria*: **Restructure** if unclear or verbose.  

  **Final Triage Outcomes**:  
  - **Desk-reject**: Fails novelty (Q1), or unfixably vague (Q2).  
  - **Restructure**: Salvageable but violates Q3–Q6.  
  - **Send to referee**: Passes all, or flagged issues minor.  
  - **Flag for human**: Testimony consensus (Q3), *upādhi* checks (Q3/Q4), or stats validity (Q4).  

  ---

  ### WORKED EXAMPLES  
  **Case 1: AI Companions Note**  
  - *Claim*: "Empirical literature settled that users form durable attachments to chatbots." → Ethical implications.  
  - **Procedure**:  
    - Q1: Assumed novel ethics. **Proceed**.  
    - Q2: Central premise ("attachments exist") clear. **Proceed**.  
    - Q3: Premise relies on **testimony** (consensus). Source unnamed/unqualified → **Restructure**.  
    - Q6: N/A (no inference yet).  
  - **Verdict**: **Restructure**. Must name sources (e.g., "Smith (2023) meta-analysis shows 70% attachment") and establish speaker reliability (e.g., "peer-reviewed studies").  
  - *Why not testimony?* Consensus without sources is "inference in disguise" – Nyāya rejects this.  

  **Case 2: Corporate Obligations Paper**  
  - *Claim*: Corporations bear obligations because "structurally like" agents (accepted in literature).  
  - **Procedure**:  
    - Q1: Risk of non-novelty (extension may be trivial). If novel, **proceed**.  
    - Q2: Premise = similarity ("like agents"). **Proceed**.  
    - Q3: **Similarity** premise: No *vyāpti* shown (e.g., what *specific* structures pervade obligation-bearing?). Mere analogy → **Restructure**.  
    - Q6: If restructured as inference, counts as 1 unchecked *vyāpti* (reader must verify pervasion). **Acceptable** if only one.  
  - **Verdict**: **Restructure**. Must convert analogy to inference:  
    - Define *hetu* (e.g., "decision-making hierarchy").  
    - Prove *hetu* present in corporations *and* obligation-bearing agents (Q3b).  
    - Prove *hetu* absent in non-obligation bearers (Q3c).  
    - Check *upādhis* (e.g., "does profit motive break pervasion?").  
  - *Your draft impact*: If it merely asserts similarity, it fails Nyāya standards. Restructuring strengthens it.  

  **Case 3: Correlational Study Note**  
  - *Claim*: Trait X disposes to behaviour Y (based on one study: high X correlates with Y).  
  - **Procedure**:  
    - Q1: Assumed novel. **Proceed**.  
    - Q2: Premise = correlation. **Proceed**.  
    - Q4: Statistical evidence → Treated as **inference**.  
      - (a) Source named? If not, **restructure**.  
      - (b) *Hetu* conditions:  
        - Present? Yes (X in subjects).  
        - Positive correlation? Yes (study shows X+Y).  
        - *Negative correlation?* Unlikely (study rarely proves absence of X in non-Y cases). **Restructure**.  
      - (c) *Upādhi* check? Usually missing → **Flag for human** (but assistant notes gap).  
    - Q6: One unchecked inference (correlation → disposition). **Acceptable**.  
  - **Verdict**: **Restructure**. Must:  
    - Name study.  
    - Address negative correlation (e.g., "cases low in X avoid Y").  
    - Discuss *upādhis* (e.g., "third variable Z?").  
  - *Your published parallel*: If last year’s note lacked these, it would now require restructuring.  

  ---

  ### WHAT THE PROCEDURE CANNOT DO  
  **Limitations & Systematic Biases**:  
  1. **Misfires**:  
     - **Conceptual/armchair papers**: Nyāya prioritises empirical grounding. Papers relying on pure thought experiments (e.g., "twin earth") may be desk-rejected for lacking *pramāṇa*, though valid in Western epistemology.  
     - **High-theory scholarship**: E.g., Derridean deconstruction. The procedure demands clear premises/testimony, which "aporetic" texts may avoid.  
     - **Interdisciplinary work**: Stats/model-based papers flagged for human judgment may face delays.  

  2. **Systematically Disfavours**:  
     - **Consensus-driven arguments**: Common in social philosophy. Testimony rule demands named sources, rejecting appeals to "what everyone knows."  
     - **Analogy-rich reasoning**: E.g., Wittgensteinian family resemblances. Similarity without *vyāpti* is restructured, penalising loose but insightful analogies.  
     - **Single-inference monoliths**: Papers hinging on one complex inference (e.g., evolutionary ethics) pass Q6 but may fail *upādhi* checks – unfairly if the *upādhi* is esoteric.  

  3. **Never Decide Automatically**:  
     - **Originality in niche areas**: Q1 requires human judgment if the assistant lacks field expertise.  
     - **Ethical/political implications**: E.g., a valid note defending a harmful view. Human must assess.  
     - **Adventitious conditions (*upādhi*)**: Statistical or metaphysical *upādhis* (e.g., "does quantum indeterminacy break this?") require expert review.  
     - **Testimonial reliability**: Consensus claims (e.g., "climate scientists agree") need human verification.  

  **Final Note**: The procedure enforces Nyāya’s anti-sloppiness ethos but is a triage tool. It ensures basic rigour, freeing editors for nuanced judgment. Your rule of thumb (one unchecked inference) survives as it honours Nyāya’s *vyāpti* demand without overburdening readers.  

  ---  
  *Style*: British English (-ise spellings, "analogue", "prioritise"). No Sanskrit beyond glossed terms.
