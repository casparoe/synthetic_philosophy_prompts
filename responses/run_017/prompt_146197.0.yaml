  After carefully analyzing your intuitions across these scenarios, I propose a unifying principle that explains your judgments. This principle integrates elements of bounded rationality, epistemic uncertainty, and the structure of the games. I'll state it precisely, test it against your verdicts, identify where it struggles, apply it to your flip-flop case, and note confidence levels. The core insight is that your intuitions are driven by **practical play under uncertainty about opponent rationality, with the horizon length amplifying the role of potential gains and risks**.

  ### The Principle: **Practical Cooperation under Uncertainty (PCU)**
  In finite-horizon sequential games:
  1. **Cooperation (passing/not defecting) is rational if**:  
     - The horizon is sufficiently long that the *potential cumulative gains from mutual cooperation outweigh the initial risk of exploitation*;  
     - There is *any mechanism to sustain cooperation*, such as:  
       - Uncertainty about the opponent's rationality or payoffs (e.g., a small chance they are "irrational" cooperators);  
       - Acausal or correlated expectations (e.g., identical opponents or public announcements);  
       - Observable reciprocity (e.g., sequential moves allowing learning).  
     - The *cost of initial cooperation is bounded* (e.g., losing a small amount if exploited).  
  2. **Defection (taking/defecting) is rational if**:  
     - The horizon is short, making potential gains negligible;  
     - The game structure has a *dominant strategy to defect* (e.g., prisoner's dilemma stage game), and no cooperation-sustaining mechanism overrides it;  
     - The initial risk of cooperation is high (e.g., large loss if exploited).  
  3. **Horizon length matters**: Long horizons slow backward induction's "unraveling" by making end-game effects psychologically distant, allowing cooperation to persist if uncertainty exists.  
  4. **Common knowledge of rationality (CKR) is not assumed**: CKR is fragile in practice; players act as if there's a small chance (\(\geq 1\%\)) of opponent irrationality or payoff differences. This uncertainty is amplified in long games.  

  **Precision for testing**:  
  - Calculate the **risk-reward ratio**: (Potential gain from mutual cooperation) / (Loss if exploited in initial cooperation). If this ratio is high (e.g., >5) and the horizon is long (\(N > 10\) nodes/rounds), cooperation is favored.  
  - Check for **cooperation-sustaining mechanisms**: Public announcements, opponent identity (e.g., copy of self), or sequential observability enable updating beliefs.  
  - In dominant-defection games (e.g., prisoner's dilemma), defection is default unless mechanisms create uncertainty.  
  - Apply backward induction only after adjusting for uncertainty: If opponent passes first, treat it as evidence of irrationality and update beliefs.  

