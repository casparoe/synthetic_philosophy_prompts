  Below is a comprehensive game design for your epistemology seminar, focused on exposing the limitations of the tracking account of knowledge (Nozick-style subjunctive conditional version). The game creates a hands-on, experiential understanding of why the tracking account struggles with deductive closure and mundane skeptical scenarios. Students will confront the problem by "testing" claims against the tracking conditions, betting points (chips), and seeing the account declare ignorance where intuition suggests knowledge.

  ---

  ### **Game Title: Truth Tracker Challenge**
  **Objective**: Students apply the tracking conditions to claims, deduce consequences, and discover that the tracking account denies knowledge of valid deductions and mundane truths due to "nearby" skeptical worlds.  
  **Core Problem**: The tracking account's sensitivity condition (if \(p\) were false, you wouldn't believe it) fails for deductions because the nearest not-\(q\) world may be one where \(p\) is false but the agent is deceived, and for mundane claims because the nearest not-\(p\) world is a deceptive look-alike.

  ---

  ### **Materials & Setup**
  - **Chips/Tokens**: Each student gets 3 chips (use poker chips, paper clips, or sticky notes). Chips represent "knowledge confidence points."  
  - **Claim Cards**: Printed cards for claims (see below).  
  - **World Descriptions**: Slides or handouts describing actual and counterfactual worlds.  
  - **Deduction Tool**: A simple, obvious entailment (e.g., mathematical or perceptual) to force deduction.  
  - **Timer**: For pacing.  
  - **Scoreboard**: Track chip totals (optional).  

  **Claims for Round 1 (Deduction Problem)**  
  - \(p\): "The number on the screen is 5." (Actual world: A projector displays "5" from a trusted source.)  
  - \(q\): "The number on the screen is not 6." (Entailment: \(p \rightarrow q\) since 5 ≠ 6. Students deduce \(q\) from \(p\) in one step.)  

  **Claims for Round 2 (Mundane Misfire)**  
  - \(p\): "The object in the box is a red apple." (Actual world: A clear box contains a red apple.)  
  - \(q\): Not used (focus on \(p\) alone).  

  **Counterfactual Worlds**  
  - **Round 1 – Nearest not-\(p\) world**: "The source malfunctioned; the number is 6, but the display still shows '5' due to a glitch."  
  - **Round 1 – Nearest not-\(q\) world**: "The number is 6 (making \(q\) false), but the display glitch shows '5'." (Same as not-\(p\) world.)  
  - **Round 2 – Nearest not-\(p\) world**: "A wax replica that looks identical to a red apple is in the box."  

  **Key Setup Rules**  
  - The "actual state" is hidden (e.g., number/object concealed until debrief). Students only see descriptions.  
  - Deduction is mandatory and immediate: "If you know \(p\), and \(p\) entails \(q\), you must believe \(q\)."  
  - Chips are bet *after* evaluating tracking conditions but *before* revealing outcomes. Betting costs chips, creating stakes.

  ---

  ### **Rules & Scoring**  
  1. **Chip Economy**:  
     - Each student starts with 3 chips.  
     - Bets: 1–3 chips per claim. Win/lose based on tracking verdict (not truth).  
     - Winning a bet: Gain +1 chip per chip bet.  
     - Losing a bet: Lose all chips bet.  
     - Goal: Maximize chips (top scorers get bragging rights, no real reward).  

  2. **Tracking Test Protocol**: For any claim \(r\):  
     - **Condition 1 (Truth Sensitivity)**: "If \(r\) were true, would you believe it?" (Usually passes.)  
     - **Condition 2 (Falsehood Sensitivity)**: "If \(r\) were false, would you not believe it?" (Fails in problematic cases.)  
     - Students answer "Know" (both conditions pass) or "Don’t Know" (one fails) and bet chips.  

  3. **Deduction Step**:  
     - After affirming belief in \(p\), students deduce \(q\) aloud: "\(p\) is true, and \(p\) entails \(q\), so \(q\) is true."  

  ---

  ### **Timeline (80 Minutes Total)**  
  **0–10 min: Introduction & Setup**  
  - Recap tracking conditions (5 min):  
    - "You know \(p\) iff: (1) If \(p\) were true, you’d believe it; (2) If \(p\) were false, you wouldn’t believe it."  
  - Explain game rules, claims, chips, and betting (5 min).  

  **10–35 min: Round 1 – Deduction Problem**  
  - **10–15 min**: Present \(p\) ("Number is 5"). Students believe \(p\) (they "see" 5, source is trusted).  
  - **15–20 min**: Test tracking for \(p\):  
    - Condition 1: "If it were 5, you’d believe it? (Yes).  
    - Condition 2: "If it were false (e.g., 6 with glitch), would you not believe it?" (No—glitch shows 5, so you’d still believe it). **→ Tracking verdict: Know \(p\)? YES** (Condition 2 passes—glitch is not the *nearest* not-\(p\) world? Wait for discussion in debrief).  
  - **20–25 min**: Deduce \(q\): "\(p\) entails \(q\) (5 ≠ 6), so I believe \(q\)."  
  - **25–30 min**: Test tracking for \(q\):  
    - Condition 1: "If \(q\) were true (number ≠6), you’d believe it? (Yes—you deduced it).  
    - Condition 2: "If \(q\) were false (number=6), would you not believe it?" (No—glitch shows 5, so you’d believe \(p\) and deduce \(q\)). **→ Tracking verdict: Know \(q\)? NO** (Condition 2 fails).  
  - **30–35 min**: Bet chips on \(p\) and \(q\):  
    - For \(p\), most bet "Know" (gain chips if correct).  
    - For \(q\), betting "Know" loses chips (tracking says no).  

  **35–55 min: Round 2 – Mundane Misfire**  
  - **35–40 min**: Present \(p\) ("Object is a red apple"). Students believe \(p\) (they see it).  
  - **40–45 min**: Test tracking for \(p\):  
    - Condition 1: "If it were an apple, you’d believe it? (Yes).  
    - Condition 2: "If it were false (e.g., wax replica), would you not believe it?" (No—replica looks identical, so you’d still believe it). **→ Tracking verdict: Know \(p\)? NO** (Condition 2 fails).  
  - **45–50 min**: Bet chips on \(p\): Betting "Know" loses chips (tracking says no).  
  - **50–55 min**: Reveal actual states (optional):  
    - Round 1: Actual number was 5.  
    - Round 2: Actual object was an apple.  

  **55–80 min: Debrief & Discussion**  
  - **55–60 min**: Map game moments to tracking conditions:  
    - **Round 1, \(q\)’s Condition 2 failure**: "When you deduced \(q\), the nearest not-\(q\) world (number=6 with glitch) is one where you’d still believe \(p\) (due to glitch) and thus believe \(q\). Tracking says you don’t know \(q\), even though you deduced it from known \(p\)."  
    - **Round 2, \(p\)’s Condition 2 failure**: "The nearest not-\(p\) world (wax replica) is close and deceptive, so tracking says you don’t know a mundane truth."  
  - **60–70 min**: Analyze the core issue:  
    - "The tracking test’s verdict hinges entirely on the *nearness of the not-\(p\) world*. For deduction, the nearest not-\(q\) world exploits a flaw in \(p\)’s sensitivity (you’d still believe \(p\) there). For mundane claims, nearness invites skepticism."  
    - Highlight student quotes (e.g., "I derived it, so I know" vs. "The skeptical world isn’t close").  
  - **70–80 min**: Introduce repairs without resolving:  
    - **Repair 1 (Tracking Preservation)**: Make belief track the fact *through deduction* (e.g., add methods or widen worlds).  
    - **Repair 2 (Anti-Luck/Safety)**: Require belief to be "safe"—you wouldn’t easily be wrong (avoids near skeptical worlds).  
    - End with: "Which repair saves knowledge? That’s next week’s topic."  

  ---

  ### **Anticipated Problems & Mitigation**  
  1. **"The skeptical world isn’t close!"** (e.g., "Glitches/replicas are unrealistic!")  
     - **Mitigation**: Pre-empt by stipulating "nearness" for the game (e.g., "Assume these worlds are close for this test—we’re probing the logic"). In debrief, discuss how nearness is context-dependent.  

  2. **"I derived it, so I know!"** (Intuition overriding tracking)  
     - **Mitigation**: Force betting based on tracking rules. If they bet against tracking (e.g., "Know" for \(q\)), they lose chips. Use this to highlight the conflict.  

  3. **Sneaking a look at the actual state**  
     - **Mitigation**: Conceal actual states (e.g., use descriptions, not live objects). Reveal only at the end. Penalize "cheating" with chip loss.  

  4. **Confusion about entailment**  
     - **Mitigation**: Use trivial deductions (e.g., 5 → not 6; apple → not wax). Clarify: "Deduction is automatic—no extra evidence for \(q\)."  

  5. **Time management**  
     - **Mitigation**: Use a timer. Skip chip counting if behind (focus on concepts).  

  ---

  ### **What the Game Can’t Stage (Require Verbal Explanation)**  
  - **Closure Principle**: The game *shows* tracking fails for deduction but doesn’t define closure. Say: "Closure says knowledge transfers through entailment. Tracking rejects this—we’ll formalize it next class."  
  - **Why Nearness Matters**: Students may not grasp that the tracking account’s verdicts are *entirely* determined by how "near" worlds are defined. Explain: "The account’s power and flaw come from letting ‘nearness’ decide when sensitivity fails. Change nearness, change what you ‘know’."  
  - **Repair Details**: The game exposes the problem but can’t develop solutions. Verbally sketch:  
    - "Repair 1 (e.g., Nozick): Make deduction ‘track’ by checking worlds where \(q\) is false *and* \(p\) is false."  
    - "Repair 2 (e.g., Sosa): Replace sensitivity with safety—your belief couldn’t easily be false."  

  ---

  ### **Instructor Notes**  
  - **Emphasis**: Stress that the game tests the *tracking account’s rules*, not intuitions. The goal is to break the account with its own logic.  
  - **Flexibility**: Shorten rounds if needed (e.g., skip Round 2 betting). Focus debrief on Round 1’s deduction failure.  
  - **Outcome**: Students should leave uneasy—tracking protects against error by making skepticism too easy, and deduction "costs" knowledge. This primes deeper discussion of closure, sensitivity, and safety.  

  This design forces students to confront the tracking account’s limits experientially, using stakes and deduction to make the problem vivid. By the end, they’ll see why Nozick’s view leads to surprising skepticism and have a foundation for evaluating repairs.
