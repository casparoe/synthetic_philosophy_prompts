  **Debrief Questions**:
  1. In Round 1, what happened when you deduced q from p? (The tracking account said you didn't know q because in the nearest world where q is false, you would still believe q because you would believe p and deduce q.)
  2. In Round 2, what happened? (The tracking account said you didn't know p because in the nearest world where p is false, you would still believe p.)
  3. What do these two cases have in common? (The nearest world where the claim is false is a world where you are deceived, and your belief is the same.)
  4. How does the tracking account try to ensure that your belief is sensitive to the truth? (By requiring that if it were false, you wouldn't believe it.)
  5. Why does this condition cause trouble for deduction? (Because when you deduce q from p, your belief in q is only as sensitive as your belief in p. But the nearest world where q is false might be a world where p is false in a way that you don't detect, so you still believe p and then deduce q.)
  6. And why does it cause trouble in ordinary cases? (Because the nearest world where the claim is false is a skeptical scenario in which you are fooled.)
