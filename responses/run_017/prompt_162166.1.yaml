  - For Round 2:
     - Slide with a photo of a zebra in a pen.
     - Description of the counterfactual: "Imagine that it is not a zebra, but a mule painted to look like a zebra, and it looks just like the photo."

  - Chips or tokens (can be pieces of paper) - 3 per student.
  - Betting sheet for Round 1 and Round 2.

  **Betting Sheet Example**:

  Round 1:
  Claim p: "There is a vase on the table."
  According to the tracking conditions, do you know p? (Yes/No) 
  How many chips do you bet? (1, 2, or 3)

  Claim q: "There is not a disguised plant on the table."
  According to the tracking conditions, do you know q? (Yes/No)
  How many chips do you bet? (1,2, or 3)

  Round 2:
  Claim p: "The animal in the pen is a zebra."
  According to the tracking conditions, do you know p? (Yes/No)
  How many chips do you bet? (1,2, or 3)

  **Scoring**:
  - For each bet, if the student's answer matches the tracking account's verdict, they win the number of chips they bet.
  - If it doesn't match, they lose the chips they bet.
  - The tracking verdict for Round 1: 
     - p: Know (because both conditions passed)
     - q: Do not know (because condition (2) failed)
  - Round 2: 
     - p: Do not know (because condition (2) failed)

  **Note**: The actual truth of the claims doesn't matter for the tracking conditions. We are only concerned with the counterfactual scenarios.

  This design should achieve the desired outcome.
