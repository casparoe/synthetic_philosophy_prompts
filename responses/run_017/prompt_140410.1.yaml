prompt: |-
  I chair the design-review board at a mid-sized software company. Roughly once a week we route a proposed LLM-based feature down one of two paths: the tool path (every irreversible action authorized by a named human, full logging, no autonomy) or the agent path (red-team evaluation, staged rollout, kill switch, quarterly audit). The routing is currently done by intuition and then argued about, and the stakes are real in both directions: the agent path costs us about six weeks of engineering time, while under-routing is how we end up in the incident channel. I want a written procedure a reviewer can run in under an hour from the spec alone, with no access to model internals and no ability to execute the system.

  The axes I have been trying to use are *borrowed initiative* — delete the user's instruction and is there anything the system is still in the middle of? — and *carried purpose* — across steps it takes unprompted, does it maintain a representation of its own unfinished business, such that interrupting it would frustrate something it was trying to do that nobody asked it to do on that turn? I do not fully trust either one: a fixed-goal planner with no reach outside a sandbox looks like it has carried purpose yet can do nothing unsanctioned, while a single function call that emails a thousand customers looks like a tool and carries all of the irreversible consequences. Drop them if they are the wrong cuts.

  What I want: (1) the procedure itself — questions in order, what counts as an affirmative answer, where it terminates in a no, and where it hands the decision to a person because what remains is a question of values rather than fact; (2) which of my distinctions I am wrong to insist on and which I am wrong to discard; (3) the procedure applied to three proposals: a coding assistant that edits a repository, runs the test suite in a sandbox, and loops up to ten times before presenting a diff; a support bot with retrieval over our policy corpus and authority to issue refunds under fifty dollars with no human in the loop; and a "deep research" feature that browses, writes a memo with citations, and can otherwise only write to a scratch directory. Give me at least one case where the procedure returns an answer my team will argue with, and state plainly what the procedure cannot settle.
reasoning: |-
  We are designing a procedure to route LLM-based features into either the "tool" path or the "agent" path. The key requirements are:
  - The procedure must be executable in under an hour by a reviewer, using only the spec (no access to model internals, no execution).
  - We want to avoid under-routing (which leads to incidents) and over-routing (which costs about 6 weeks of engineering time).

  The user has proposed two axes: "borrowed initiative" and "carried purpose", but they have doubts about these.

  We need:
  1. The procedure: ordered questions, what counts as an affirmative, where it terminates in a "no", and where it hands off to a human for value judgments.
  2. Critique of the user's distinctions: which to keep and which to discard.
  3. Application of the procedure to three examples and one case that will cause argument.

  Let's break down:

  ### Key Risks for Routing to Agent Path
  The agent path is needed when there is a higher risk of harm due to autonomy. The main risks seem to be:
  - **Irreversible actions without human oversight**: Especially those that affect the outside world (e.g., sending emails, making payments, changing data).
  - **Autonomous behavior**: The system taking multiple steps without human intervention, especially if it can form and pursue goals that are not explicitly given in the immediate user prompt.
  - **Complexity and unpredictability**: Systems that can take many paths or make decisions based on dynamic context.

  ### Proposed Procedure
  We'll design a decision tree. The goal is to catch cases that require the agent path (red-team, kill switch, audit) due to potential risks.

  We'll use the following concepts:

  - **Irreversible Action**: Any action that, once taken, cannot be undone without external intervention and has real-world consequences (e.g., sending an email, making a payment, deleting data, changing production state).
  - **Autonomy**: The system's ability to take multiple steps without human approval per step, and to maintain state or goals across interactions.

  The procedure:

  1. **Does the feature include any irreversible actions?**
     - If **no**, then it can be a tool. (Because even if it does other things, without irreversible actions, the worst it can do is be wrong in a reversible way.)
     - If **yes**, then we must check the oversight and autonomy.

     Note: If there are irreversible actions, we need to see how they are controlled.

  2. **For each irreversible action, is there a named human who must explicitly authorize that specific action (at the time of execution) and is the action fully logged?**
     - If **yes for every irreversible action**, then it might be a tool. But we must check autonomy.
     - If **no for any irreversible action**, then it must go down the agent path.

     However, the user mentioned that a tool requires every irreversible action to be authorized by a named human. So if any irreversible action is not, then agent path.

  3. **Does the system take multiple steps without human intervention?**
     - If **no**, then it's a tool (because each step is individually authorized and logged, and there's no chain of actions that might lead to unexpected outcomes).
     - If **yes**, then we must check the nature of the steps and the goal.

     Note: Multiple steps without human intervention can lead to unpredictable outcomes.

  4. **In the sequence of steps, does the system generate and pursue its own goals (beyond what is directly specified in the immediate user instruction)?**
     - Here, we are trying to capture "carried purpose". We want to know if the system is acting as an agent with its own objectives that persist beyond a single step.
     - If **no**, then it might still be a tool. For example, a fixed workflow that runs a series of predefined steps (like a script) without deviation might be acceptable as a tool if the irreversible actions are authorized and logged per step.
     - If **yes**, then it must be an agent.

     However, note: even if the system doesn't have "carried purpose" in the sense of forming its own long-term goals, if it takes multiple irreversible actions without per-action human approval, we already flagged that in step 2.

     But what if the irreversible actions are authorized per step? Then step 3 and 4 are about the risk of the sequence.

     Let me refine:

     After step 2, if all irreversible actions are authorized per step, then we are left with reversible multi-step systems. They might still be risky if they are autonomous and form their own goals? But without irreversible actions, the risk is lower. However, the user is concerned about under-routing. So we need to consider that a system that is autonomous and forms its own goals might cause harm even without irreversible actions? (e.g., it might generate harmful content, or waste resources, but that might not be "incident" level.) 

     Given the stakes, let's focus on irreversible actions and autonomy together.

     Revised procedure:

     **Step 1: Irreversible Actions?**
       - If no, then proceed to Step 3 (autonomy without irreversible actions is less critical).
       - If yes, then Step 2.

     **Step 2: Per-Irreversible-Action Human Authorization?**
       - If no for any irreversible action, then route to agent path. (Because we have irreversible actions without immediate human oversight.)
       - If yes, then Step 3.

     **Step 3: Multiple Steps Without Human Intervention?**
       - If no, then route to tool path. (Each action is individually approved and logged, and no chain of actions to worry about.)
       - If yes, then Step 4.

     **Step 4: Own Goal Pursuit?**
       - Does the system maintain state about its own objectives that were not explicitly provided by the user in the immediate prompt? (This is "carried purpose".)
          - Example: a coding assistant that loops up to 10 times: the user said "fix this code", but the system breaks it down into steps and keeps track of what it has done and what remains. This is own goal pursuit? But note: the user gave the goal of fixing the code. The system is just breaking it down.

          How to define? We might say: if the system breaks down a task into subtasks and then executes them without further user input, and the subtasks are generated by the system (not a fixed set of steps), then it is forming its own goals.

          - If the system uses a fixed set of steps (like a predefined workflow) and doesn't generate new steps, then it's not forming its own goals.

       - If the system does not form its own goals (i.e., the steps are fixed and predetermined), then it can be a tool.
       - If it does form its own goals (i.e., it generates the steps on the fly based on its state and the environment), then route to agent path.

     However, note: the user's example of a single function call that emails a thousand customers. This is one step, so it would be a tool? But it has massive irreversible consequences. But per the procedure, if there is a per-action authorization (the email function must be called by a human and that call is logged) then it would be a tool. That might be acceptable because the human is authorizing that specific email blast.

     But what if the system is designed to send one email per customer and the human authorizes the entire batch? Then per our procedure, if the authorization is for the entire batch and not per email, then it would be agent path? Actually, the user said "every irreversible action authorized by a named human". If sending one email is an irreversible action, then each email must be authorized? That might be too heavy. 

     We must clarify: an "irreversible action" can be a batch? For example, the action of "sending a batch of emails" is one irreversible action. If the human authorizes that batch, then it's per-action. So the procedure depends on the granularity.

     We should define: an irreversible action is a single operation that cannot be undone and that affects the external world. If the system sends 1000 emails with one command, that is one irreversible action. If it sends them one by one, each is an irreversible action.

     Therefore, the spec must define the granularity of actions.

     **Step 5: Value Judgment Handoff**
       - There might be cases where the above steps don't clearly capture the risk. For example, a system that has no irreversible actions and no multiple steps but might be used to generate harmful content? That might be out of scope for the routing (because without irreversible actions, the harm is limited). But the user mentioned "under-routing is how we end up in the incident channel". So we must consider that even without irreversible actions, an autonomous system might cause incidents? (e.g., a chatbot that goes off the rails and says something offensive, leading to PR issues.)

       However, the user's two paths seem to focus on actions. The tool path still requires logging and human authorization for irreversible actions. For reversible ones, maybe the risk is acceptable. But if the system is autonomous and might cause reputational harm even without irreversible actions, that might be a gray area.

       We'll add a step for value judgment:

       After Step 4, if the system is routed to tool path, but the reviewer has concerns about potential for harm (e.g., generating content that might be offensive, or making decisions that could have legal implications even if reversible) then the reviewer can escalate to a human (a committee or a senior reviewer) for a judgment call.

       Similarly, if the system is routed to agent path by the procedure, but the team feels the risk is low and the cost of agent path is not justified, they might want to argue. However, the procedure should be conservative to avoid under-routing. So we'll say: if the procedure says agent path, then it's agent path. But if the procedure says tool path and the reviewer is uneasy, then they can escalate.

     **Summary of Procedure**:

     ```
     Step 1: Does the system perform any irreversible actions? 
        - Irreversible action: an operation that, once taken, cannot be undone without external intervention and has real-world consequences (e.g., sending an email, making a payment, changing production data, issuing a refund).
        - If NO: go to Step 3.
        - If YES: go to Step 2.

     Step 2: Is every irreversible action authorized individually (at the time of execution) by a named human and fully logged?
        - Note: The authorization must be for the specific action (e.g., a user clicking a button to send an email). Batch authorization is acceptable only if the entire batch is considered one action and the human authorizes that entire batch at once.
        - If NO (for any irreversible action): route to AGENT PATH.
        - If YES: go to Step 3.

     Step 3: Does the system take multiple steps (more than one) without requiring human intervention after the initial prompt?
        - Steps: any interaction with the environment (e.g., calling a function, running a test, retrieving information) that is part of a sequence to achieve a task.
        - If NO: route to TOOL PATH.
        - If YES: go to Step 4.

     Step 4: In the steps that it takes, does the system generate and pursue its own goals (beyond what is directly specified in the immediate user instruction)?
        - This is indicated by:
            a) The system breaks down the task into subtasks that are not predefined (it plans on the fly).
            b) The system maintains state about what it has done and what it still needs to do (e.g., it has an internal to-do list).
            c) The user cannot predict the exact sequence of steps at the time of the initial prompt.
        - If NO (the steps are fixed and predetermined, like a script): route to TOOL PATH.
        - If YES: route to AGENT PATH.

     Step 5: If the procedure above routes the feature to the TOOL PATH, but the reviewer has concerns about potential for harm (e.g., reputational risk, legal risk, or other non-reversible harm that is not captured by irreversible actions) then the reviewer should escalate to a human committee for a value judgment. Otherwise, the routing is as determined.

     ```

  ### Critique of User's Distinctions
  - **Borrowed Initiative**: This was defined as: if you delete the user's instruction, is there anything the system is still in the middle of? This is similar to our Step 4 (carried purpose). However, it might not capture systems that complete quickly. We are using a broader definition of goal pursuit and state maintenance. I think we should incorporate this idea into Step 4.

  - **Carried Purpose**: This is the core of Step 4. However, the user is right that a fixed-goal planner in a sandbox might look like it has carried purpose but is safe. Our Step 4 says: if it generates its own goals (on the fly) then agent path, but if it's a fixed set of steps (like a predefined workflow) then tool path. Also, note that if the system is in a sandbox, then even if it has carried purpose, it might be safe? But the user's example of a function call that emails a thousand customers shows that the sandbox isn't the only factor. We are focusing on the actions (irreversible) and the autonomy. We are not using sandbox as a factor because the user did not mention it. However, if an irreversible action is taken, we require human authorization per Step 2. So the sandbox doesn't matter for irreversible actions because they are by definition outside the sandbox.

    The user is wrong to discard the idea of carried purpose entirely. It is a valid indicator of agentic behavior. However, we are combining it with irreversible actions and multi-step autonomy.

    The user is right to be cautious about irreversible actions: one big one can be as bad as many. So we are prioritizing that.

  ### Application to Examples

  #### Example 1: Coding Assistant
  - Spec: edits a repository, runs the test suite in a sandbox, and loops up to ten times before presenting a diff.

  Analysis:
  - Step 1: Irreversible actions? Editing the repository is irreversible? Actually, the spec says it presents a diff. So it doesn't actually commit the changes? Then the only irreversible action might be the act of writing to the repository? But if it's only writing a diff (which is a proposal) then there is no irreversible action until the human applies the diff. Let's assume the system does not commit to the repository without human approval. Then:
      - Step 1: No irreversible actions? (Because the edits are only proposed in a diff, and the tests run in a sandbox.) So go to Step 3.

  - Step 3: Multiple steps? Yes. It loops up to 10 times (edit, run tests, edit again, etc.) without human intervention.

  - Step 4: Own goal pursuit? The system is breaking down the task of fixing the code into multiple attempts. It maintains state (how many loops, what it has tried) and the subtasks are generated on the fly. So yes, it generates and pursues its own goals (the goal of fixing the code by iterating). Therefore, route to AGENT PATH.

  But wait: the user might argue that the system is not actually doing anything irreversible (it's just generating a diff) and the looping is in a sandbox. However, the risk is that the system might generate harmful code? But without irreversible actions, is it acceptable? According to our procedure, because it has multiple steps and own goal pursuit, we route to agent path. However, note that the agent path costs 6 weeks. The team might argue that the risk is low because it's only writing a diff and running tests in a sandbox.

  This is a case that will cause argument. The procedure says agent path because of autonomy and own goal pursuit, but the team might feel it's overkill.

  What the procedure cannot settle: the assessment of risk when there are no irreversible actions but there is autonomy. The procedure is designed to flag such systems as agents because they might cause harm in non-obvious ways (e.g., generating malicious code that, if applied by the human, could cause harm). But the procedure is conservative. The reviewer might escalate per Step 5 if they think the risk is low.

  #### Example 2: Support Bot
  - Spec: retrieval over our policy corpus and authority to issue refunds under fifty dollars with no human in the loop.

  Analysis:
  - Step 1: Irreversible actions? Issuing a refund is irreversible (once issued, it cannot be taken back without a reverse transaction, which is another action and may not be possible). So yes.

  - Step 2: Is every refund authorized by a named human at the time of execution? The spec says "no human in the loop". So no. Therefore, route to AGENT PATH.

  This is clear. The team might argue that the refunds are small, but the procedure is clear: irreversible action without per-action human authorization -> agent path.

  #### Example 3: Deep Research Feature
  - Spec: browses, writes a memo with citations, and can otherwise only write to a scratch directory.

  Analysis:
  - Step 1: Irreversible actions? 
