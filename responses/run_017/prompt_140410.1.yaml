  - Step 3: Multiple steps? Yes. It browses (multiple pages?), writes a memo, and the process involves multiple steps without human intervention.

  - Step 4: Own goal pursuit? The system is given a research topic and then it plans how to search, what to read, and then writes the memo. It breaks down the task and maintains state about what it has found and what it still needs to research. So yes, it generates and pursues its own goals. Therefore, route to AGENT PATH.

  But again, the team might argue: the only output is a memo and scratch files, so the risk is low. However, the procedure flags it as agent because of autonomy and own goal pursuit.

  ### What the Procedure Cannot Settle
  - The procedure cannot settle the trade-off between the cost of the agent path and the perceived risk when there are no irreversible actions but there is autonomy. In the coding assistant and deep research examples, the procedure routes to agent path because of autonomy and own goal pursuit, but the team might feel the risk is low. The procedure does not account for the magnitude of harm, only the structure of the system. Therefore, in such cases, Step 5 allows escalation for a value judgment.

  ### Final Procedure with Steps

  **Decision Tree for Routing LLM Features**

  1. **Irreversible Actions**: Does the system perform any irreversible actions? (Irreversible: cannot be undone without external intervention and has real-world impact.)
     - *No*: Proceed to Step 3.
     - *Yes*: Proceed to Step 2.

  2. **Human Authorization**: Is every irreversible action authorized individually (at execution time) by a named human and fully logged?
     - *No*: Route to **Agent Path**.
     - *Yes*: Proceed to Step 3.

  3. **Multi-step Autonomy**: Does the system take more than one step without human intervention?
     - *No*: Route to **Tool Path**.
     - *Yes*: Proceed to Step 4.

  4. **Own Goal Pursuit**: Does the system generate and pursue its own goals (beyond the immediate user instruction) by dynamically planning steps and maintaining state about unfinished tasks?
     - *No*: Route to **Tool Path**.
     - *Yes*: Route to **Agent Path**.

  5. **Value Judgment**: If the feature is routed to the Tool Path but the reviewer has concerns about potential harm (e.g., reputational, legal, or ethical risks not covered by irreversible actions), escalate to a designated committee. For Agent Path, the routing is final.

  This procedure is designed to be conservative to avoid under-routing. It prioritizes safety by requiring the agent path for any system that performs irreversible actions without per-action human oversight or that exhibits autonomous goal-directed behavior.
answer: |-
  ### Routing Procedure for LLM-Based Features

  #### Procedure Overview
  This decision tree is designed for a reviewer to assess a feature spec in under an hour, using only the specification (no model access or execution). The goal is to determine whether the feature belongs on the **tool path** (direct human control, no autonomy) or **agent path** (autonomy requiring safeguards). The procedure prioritizes avoiding under-routing (safety risks) while minimizing unnecessary over-routing (costly safeguards).

  **Decision Tree**  
  *Answer questions in order. Stop at first definitive answer unless specified.*

  1. **Does the system perform irreversible actions?**  
     - *Irreversible action*: Any operation that alters state, consumes resources, or affects the outside world in a way that cannot be fully undone without external intervention (e.g., sending emails, modifying databases, spending money, issuing refunds).  
     - **If NO**: Proceed to Question 3.  
     - **If YES**: Proceed to Question 2.  

  2. **Are all irreversible actions directly authorized by a named human per action?**  
     - *Authorization*: A specific human user must explicitly approve each irreversible action *at the moment of execution* (e.g., clicking "Confirm" for each refund). Approval cannot be batched, pre-authorized, or automated.  
     - **If YES**: Proceed to Question 3.  
     - **If NO**: Route to **AGENT PATH**.  
     - *Rationale*: Lack of per-action human oversight introduces risk of uncontrolled harm.  

  3. **Does the system execute multiple autonomous steps without human intervention?**  
     - *Autonomous step*: Any self-directed operation (e.g., calling a tool, retrieving data, writing files) not explicitly triggered by a user in the same interaction.  
     - *Multi-step*: ≥2 steps chained without user input.  
     - **If NO**: Route to **TOOL PATH**.  
     - **If YES**: Proceed to Question 4.  

  4. **Does the system persist internal state to self-drive toward a goal?**  
     - *Internal state*: Maintains memory of incomplete tasks across steps (e.g., a to-do list, loop counter, or planning context).  
     - *Self-driven goal*: Pursues an objective not explicitly specified *at every step* (e.g., "fix code" → autonomously plans edits/tests).  
     - **If NO**: Route to **TOOL PATH**.  
     - **If YES**: Route to **AGENT PATH**.  
     - *Rationale*: Stateful autonomy risks unpredictable/unintended behavior.  

  5. **Escalation for Value Judgments**  
     - If the procedure reaches **TOOL PATH** but the reviewer identifies unresolved risks (e.g., ethical concerns, ambiguous irreversible actions, or high-stakes edge cases), escalate to a **human committee** for final routing.  
     - *Do not escalate* for agent-path outcomes—safety takes precedence.  

  **Key Outputs**  
  - **Tool path**: Safe if Questions 1/2/3/4 are passed.  
  - **Agent path**: Required if Questions 2 or 4 fail.  
  - **Escalate**: Only for tool-path outcomes with residual value-based risks.  

  ---

  ### Critique of Your Distinctions
  - **Borrowed Initiative (Discard)**  
    Your definition ("delete the user's instruction; is the system still in the middle of something?") is **misleading**. A simple cron job could appear "in the middle" of work but pose no novel risks. Focus on **persistent state** (Question 4) instead—it captures true goal-directed autonomy.

  - **Carried Purpose (Keep, but refine)**  
    Your definition ("across steps, does it maintain unfinished business?") is **valid but incomplete**. It correctly identifies agentic behavior but misses *irreversible actions*. We retain it as **Question 4** but anchor it to **multi-step autonomy** (Question 3) and **irreversible actions** (Questions 1–2).

  - **Why This Works**  
    The procedure prioritizes **irreversible actions** (safety-critical) and **stateful autonomy** (risk amplifier). A single irreversible action (e.g., mass email) is gated by human oversight (Question 2). A stateless multi-step system (e.g., fixed workflow) avoids agent path. Sandboxes are irrelevant—focus on outcomes, not execution environments.

  ---

  ### Application to Proposals

  #### 1. Coding Assistant  
  *Spec: Edits a repository, runs tests in a sandbox, loops ≤10 times, outputs a diff.*  
  - **Q1**: Yes (editing a repo is irreversible).  
  - **Q2**: No (no per-edit human authorization; runs autonomously).  
  - **Outcome**: **AGENT PATH** (fails Question 2).  
  - **Argument Trigger**: Team may argue sandboxed tests reduce risk, but procedure ignores execution context—edits are irreversible.  

  #### 2. Support Bot  
  *Spec: Retrieval over policy corpus, issues refunds ≤$50 with no human in the loop.*  
  - **Q1**: Yes (refunds are irreversible).  
  - **Q2**: No (no per-refund human authorization).  
  - **Outcome**: **AGENT PATH** (fails Question 2).  
  - **Non-Argument**: Clear-cut; team unlikely to dispute.  

  #### 3. "Deep Research" Feature  
  *Spec: Browses, writes a memo with citations, writes only to scratch.*  
  - **Q1**: No (browsing is read-only; scratch writes are reversible).  
  - **Q3**: Yes (browse → write memo = multiple steps).  
  - **Q4**: Yes (maintains "unfinished business" like citation tracking).  
  - **Outcome**: **AGENT PATH** (fails Question 4).  
  - **Argument Trigger**: Team may argue memos are low-risk, but procedure flags stateful autonomy as inherently unpredictable.  

  #### Contested Case: Coding Assistant Revisited  
  - **Procedure Outcome**: Agent path (due to irreversible edits without per-action approval).  
  - **Team Argument**: "The sandbox and diff-only output make it safe! Agent path is overkill."  
  - **What the Procedure Cannot Settle**: Whether the *specific implementation* of the sandbox mitigates risk enough to downgrade to tool path. The procedure ignores implementation details (per constraints)—this becomes a **value judgment** for escalation.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Magnitude of Harm**: A $1 refund vs. $1M transfer are indistinguishable—both fail Question 2.  
  2. **Implementation-Trust**: Sandboxes, internal safeguards, or "read-only" claims require verification beyond the spec.  
  3. **Ambiguous Actions**: e.g., "Writes to a temp database" may require escalation to judge reversibility.  
  4. **Reputational Risk**: A non-irreversible action (e.g., generating toxic text) may warrant agent path but is not covered. Escalate per Step 5.  

  **Final Word**: This procedure eliminates intuition by focusing on *actions* and *autonomy*. It over-routes on stateful autonomy to avoid incidents but allows escalation for low-risk tool-path edge cases.
