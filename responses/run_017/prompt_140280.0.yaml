answer: |-
  Your frustration is palpable and justified—you've hit the structural bedrock of the Dutch book (DB) debate. The stalemate arises because **the debate isn't one disagreement but three distinct, entangled layers**, and progress requires separating them. Your hypothesis is largely correct, but needs refinement. Let's diagnose using your framework and variants.

  ---

  ### **The Three-Layer Diagnosis**
  1. **Formal Layer** (What the theorems *actually* show under specific protocols)  
  2. **Bridge Layer** (What credences *commit* an agent to in terms of betting behavior)  
  3. **Normative Layer** (Whether exploitability implies *irrationality*)  

  **Why the debate stalls**:  
  - **Proponents** focus on Layer 1 (formal results) and Layer 2 (credences → preferences).  
  - **Critics** attack Layer 3 (exploitability → irrationality).  
  - **Replies** (e.g., depragmatizing, deliberative) try to *redefine* Layer 3 using Layer 2, but critics see this as smuggling in norms.  

  ---

  ### **Engaging Your Insights**
  #### **1. Protocol Relativity (Ada vs. Cyrus)**
  You’re exactly right: the "equivalence" (incoherence ⇔ sure loss) is **protocol-dependent**.  
  - **One-sided protocols** (only buying): Only strict incoherence (∑q > 1) is punished (Cyrus loses; Ada gains).  
  - **Two-sided protocols** (buying/selling): Full probabilism is enforced (both lose).  
  - **Gappy/imprecise credences**: Reject two-sided protocols entirely.  

  **Why this matters**:  
  - Critics (e.g., Maher, Hájek) argue DBs assume an *arbitrary* behavioral commitment (two-sidedness).  
  - Proponents (e.g., Pettigrew, Schervish) treat two-sidedness as inherent to "fair prices."  
  - **Stalemate root**: Whether the protocol is part of the *definition* of credences (Bridge Layer) or an *external imposition* (Normative Layer).  

  #### **2. Your Variants: Do They Break the Deadlock?**
  - **Fee-for-a-Price-List**:  
    - **Goal**: Counter the "recluse reply" (avoid bets to avoid exploitation).  
    - **Problem**: Accepting the penny *is rational* if the agent knows they’ll be exploited later—unless you assume they’re *already committed* to accepting bets at stated prices (back to Bridge Layer). Critics (e.g., Christensen) would argue this still assumes an implausible behavioral norm.  
    - **Verdict**: Does not break deadlock; shifts exploitation to a different act but doesn’t resolve Layer 3.  

  - **Bookie-Free (Internal-Audit) Dutch Book**:  
    - **Goal**: Remove pragmatics to expose "structural" defect.  
    - **Critic’s reply**: "Why care about a *hypothetical* loss? If no money changes hands, where’s the defect?" This *is* the accuracy argument in disguise: the "loss" is epistemic (inaccuracy), not pragmatic.  
    - **Verdict**: Collapses into accuracy-first (e.g., Pettigrew). The "dispensable theatre" critique applies: if the Dutch book is merely a *representation* of incoherence, the betting setup is redundant.  

  ---

  ### **Why Accuracy-First Doesn’t Save the Debate**
  Accuracy arguments (e.g., minimizing Brier score) avoid behavioral commitments but:  
  - Answer a **different question**: "What makes credences *truth-directed*?" not "What makes them *coherent*?"  
  - **Trade one norm for another**: Accuracy assumes "closer to truth" is rationally required—a *new* normative premise.  
  - **Result**: DBs and accuracy arguments are **parallel justifications** for probabilism, not reductions of one to the other. The "redundancy" claim is valid: DBs add nothing *beyond* coherence if accuracy is primary.  

  ---

  ### **What Counts as Progress?**
  1. **Formal Distinctions**: Map the **protocol space** explicitly.  
     - *Example*: Prove that under a one-sided protocol, only **∑q ≤ 1** is enforceable; under two-sided, **additivity** is required.  
     - *Value*: Clarifies which defenses rely on which protocol (e.g., deliberative readings assume two-sidedness).  

  2. **Bridge Layer Clarity**: Articulate the **credence-to-choice link** without circularity.  
     - *Requires*: A decision-theoretic account of why credences *entail* fair prices (e.g., Savage’s representation theorem).  
     - *Obstacle*: Imprecise credence models (e.g., Levi) reject this link.  

  3. **Normative Diagnosis**: Admit that DBs **cannot justify Layer 3 alone**.  
     - The leap from exploitability to irrationality needs **external support**:  
       - *Pragmatic*: "Avoiding domination is rational" (e.g., Lewis).  
       - *Epistemic*: "Incoherence undermines accuracy" (accuracy-first).  
       - *Constitutive*: "Credences *just are* betting dispositions" (radical behaviorism).  
     - **Progress**: Flag which norm is being assumed. The debate persists because opponents reject each other’s normative premises.  

  4. **Abandon the Quest for "Knockdown" Arguments**:  
     - DBs are best seen as **explicating the cost of incoherence** under specific behavioral norms—not proving "irrationality" simpliciter.  
     - *Productive question*: "Under what norms does exploitability *become* a defect?"  

  ---

  ### **Conclusion: Why Nothing Moves and How to Move Forward**
  - **Stalemate Cause**: The debate conflates:  
    - *Mathematical theorems* (Layer 1),  
    - *Conceptual commitments* (Layer 2),  
    - *Normative foundations* (Layer 3).  
    Critiques of Layer 3 are met with Layer 1/2 replies, creating dialectical gridlock.  

  - **Your Role**: As a meta-theorist, **disentangle these layers** in your review. Show how:  
    - Protocol choices (e.g., two-sidedness) are stealth premises.  
    - Depragmatized arguments shift norms (e.g., coherence → consistency of preferences).  
    - Accuracy-first sidesteps DBs but inherits its own controversies.  

  - **True Progress**: Acknowledge that DBs are **conditional**: *If* you accept certain behavioral norms, *then* incoherence is exploitable and thus defective. The argument’s force depends entirely on the antecedent—which is where the real philosophical action lies. Your chapter can reframe the debate not as "Are DBs sound?" but **"What must rationality require for DBs to matter?"** That’s a question worth asking.
