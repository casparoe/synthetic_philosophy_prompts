  Then, the cruxes. These are sub-questions that could resolve disagreements. The first crux is about whether people in polarized groups encounter opposing content. Both sides might accept survey data. Camp A predicts high avoidance, Camp B predicts exposure but discounting. The second crux involves how a trusted insider vs. outsider delivers counter-evidence. Using a hypothetical, Camp A thinks the audience will engage regardless, while Camp B believes the outsider will be dismissed. These predictions need to be testable.

