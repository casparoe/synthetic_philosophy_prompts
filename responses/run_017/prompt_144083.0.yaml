prompt: |-
  hey — im doing the final project for my social epistemology seminar and I need something drafted. Our class has basically split into two camps that have spent the whole term argueing past each other, and instead of another debate the prof wants a joint document, the kind that comes out of an actual adversarial collaboration. I have to specify what goes in it and I'd rather not do it badly.

  Camp A — call them the bubble / information-access people. On their picture the bad thing is structural: filtering, ranking algorithms, homophily and plain human laziness mean people just never encounter the other side's evidence and arguments. The unit of analysis is the information environment, the diagnosis is missing input, and the remedy is more and better exposure — diversify the feed, bridge, force cross-cutting contact.

  Camp B — call them the chamber / trust-manipulation people. On their picture that's a misdiagnosis: members of these communities often see plenty of outside material and it doesn't help, because what gets engineered isn't what reaches them but who they trust. Insiders are made maximally credible, outsiders get discredited in advance and content-independently, and anything that looks external is discounted by construction. The unit of analysis is the trust structure, the diagnosis is redirected trust, and exposure isn't the remedy — an exposure intervention is itself an outsider source, so it gets screened out too.

  Two cases from seminar I want both of them forced to deal with, rather than each picking friendly examples:

  (1) The clean room: a small research team, or a closed organizing space for a marginalized group, deliberately cuts itself off from outside sources for a while. Members could leave or check any time and they know it, the closure is temporary and self-imposed, and by most accounts the insulation is epistemically fine or even necessary at that stage.

  (2) The skewed ambient environment: the general information environment has a systematic bias in a knowable direction, so someone who filters most of it out ends up better calibrated than someone fully exposed. Here bubbling looks like it helps accuracy.

  What I want from you:

  - a numbered section of agreed claims — things both camps can actually sign, including claims about those two cases, not just platitudes like evidence matters;
  - a disagreements table: for each real disagreement, the question in neutral terms, the wording camp A would accept for its own view, and the wording camp B would accept for its own;
  - the cruxes — the sub-questions where settling them would move at least one side. For each, a concrete case or argument both sides accept as bearing on it, and each side's prediction written down in advance;
  - and tell me which parts you think are only verbal, if any. My guess is that some of the fighting is about which phenomenon is more common or more worth fixing rather than about mechanisms, but I honestly can't tell which bits.

  Keep the whole thing under 700 words including the tables. Please don't give me citations or a reading list — I can't get at the library database from here and I need text I can hand in as-is.
