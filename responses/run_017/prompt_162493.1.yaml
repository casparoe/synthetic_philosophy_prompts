  Below is a decision tree designed to guide a philosopher of physics from the starting assumptions (time-symmetric microdynamics and local entropy increase) to a position on why there is a thermodynamic arrow. The tree is built from logical questions, with each node splitting the space of possibilities. Positions are named where established, with "unnamed" labels for undefended or incoherent views. The tree addresses the group's debates: (1) Dan's point on explaining entropy increase vs. low initial entropy, and (2) Priya/Dana's disagreement on the priority of record/counterfactual asymmetry.

  ---

  **Start:** I accept that microdynamics are time-symmetric and entropy is increasing locally.

  ### Node 1: Does the thermodynamic arrow require a *global* explanation (beyond local dynamics)?  
  - **No** → Proceed to Node 2.  
  - **Yes** → Proceed to Node 3.  

  ### Node 2: Is the arrow an objective feature of the universe, or a consequence of perspective?  
  - **Objective feature** → **Leaf: Deflationary view**  
    - *Most awkward commitment:* Accepts entropy increase as a brute fact with no deeper explanation (e.g., no account of why low-entropy states exist).  
  - **Consequence of perspective** → **Leaf: Perspectivalism**  
    - *Most awkward commitment:* Denies an objective arrow despite universal experience of temporal asymmetry (e.g., entropy gradients reduce to epistemic constraints).  

  ### Node 3: If entropy were symmetric (min at t=0, increasing in both directions), would this violate your view?  
  - **No, we’d mislabel "future"** → **Leaf: Symmetric two-pasts (Boltzmann, Schulman)**  
    - *Most awkward commitment:* Must explain why we don’t observe the other "past" (e.g., typicality arguments in a symmetric universe).  
  - **Yes, it breaks my view** → Proceed to Node 4.  

  ### Node 4: Is the low-entropy initial condition the *only* thing needing explanation?  
  - **Yes (entropy increase is automatic)** → **Leaf: Unnamed (incoherent)**  
    - *Note:* Explaining "why low entropy?" necessarily explains "why increase?" (via time-symmetric dynamics + initial condition). Rejecting this conflates explanation with deduction. *Most awkward commitment:* Claims entropy increase needs *no* explanation despite depending on a low-entropy past.  
  - **No, both need explanation** → Proceed to Node 5.  

  ### Node 5: Can the low-entropy initial condition be explained by cosmology?  
  - **Yes** → **Leaf: Cosmological explanation (e.g., inflation)**  
    - *Most awkward commitment:* Cosmology’s asymmetric laws/conditions need their own arrow-of-time explanation (e.g., inflaton field dynamics).  
  - **No** → **Leaf: Past Hypothesis / Mentaculus (Albert, Loewer)**  
    - *Most awkward commitment:* Brute low-entropy boundary condition with no deeper justification (e.g., "just because").  

  ---

  ### Notes on Key Debates
  1. **Dan’s point (Node 4):** The unnamed leaf ("only low entropy needs explaining") is **incoherent**. Explaining the low-entropy past *entails* explaining entropy increase (via dynamics). No one defends this because it confuses explanation with deduction.  
  2. **Priya vs. Dana (Record/counterfactual asymmetry):**  
     - **Placement:** Addressed *implicitly in all leaves* after Node 1.  
     - **Justification:** Record/counterfactual asymmetry is downstream of the thermodynamic arrow (Priya’s view). The tree prioritizes entropy because (a) it’s the starting point, and (b) records/counterfactuals derive from macroscopic constraints (e.g., you can’t remember the future because high-entropy states don’t preserve information). Dana’s view (prioritizing records) isn’t a leaf because no theory explains entropy asymmetry *from* record asymmetry—it’s reversed in all existing accounts.  

  ### Collapsed Distinctions
  - **Past Hypothesis vs. Cosmology:** Both require asymmetric initial conditions. The split is whether cosmology *explains* it (Cosmology leaf) or not (Past Hypothesis leaf).  
  - **Deflationary vs. Perspectival:** Both reject global explanations, but Deflationary is realist about the arrow, while Perspectival is antirealist.  
  - **Symmetric two-pasts vs. Others:** Collapses if you reject global symmetry (Node 3).  

  ### Leaf Summary (8 positions)
  1. **Deflationary:** Brute fact arrow; no global explanation needed.  
  2. **Perspectivalism:** Arrow is observer-relative; no objective asymmetry.  
  3. **Symmetric two-pasts:** Universe symmetric; arrows point away from entropy minimum.  
  4. **Unnamed (incoherent):** Only low entropy needs explaining (rejected).  
  5. **Cosmological explanation:** Inflation/quantum gravity explains initial low entropy.  
  6. **Past Hypothesis:** Brute low-entropy boundary condition.  
  7. *Implicit: Record-asymmetry-primary* isn’t a leaf (no theories start here).  

  ---

  **Tree Logic Flow:**  
  Start → Node 1 → {Node 2 → **Leaf 1/2**} or {Node 3 → **Leaf 3** or Node 4 → **Leaf 4** or Node 5 → **Leaf 5/6**}.  

  This covers 8 leaves (including unnamed/incoherent) and separates all requested positions. For group discussion, focus on Nodes 4 (Dan’s issue) and the implicit handling of records (Priya/Dana).
