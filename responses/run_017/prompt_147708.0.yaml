  ### Candidate rules (about 150 words)
  Two rules are consistent with all five verdicts:  
  **A. Functional Decision Theory (FDT):** Choose the action that, if output by your decision function in all relevantly similar situations, maximizes expected utility. This treats the agent as a function mapping inputs to actions, evaluating outcomes based on logical correlations between the function's output and other events (e.g., predictions).  
  **B. Consequence-Limited FDT (CL-FDT):** Same as FDT, but ignores acausal influences from adversarial agents who intend to profit from your policy, even if stipulations remove instrumental consequences (e.g., no repetition or reputational effects).  

  **Exclusions:**  
  - *Causal Decision Theory (CDT)* is excluded: It would two-box (Newcomb), not pay (Hitchhiker), and not pay (Counterfactual Mugging), conflicting with verdicts.  
