answer: |-
  Here's a step-by-step breakdown of Aquinas's argument in the passage, applied to your questions, with scholarly consensus and disagreements clearly marked:

  ### Aquinas' Argument (Step-by-Step Modern Translation)
  1.  **Two Types of Power:** Power is either *passive* (the ability to be changed/acted upon by something else) or *active* (the ability to act upon/change something else). *(Consensus: This Aristotelian distinction is fundamental and uncontested.)*
  2.  **Passive Power Absent in God:** Passive power implies potentiality, deficiency, or imperfection (being able to be changed means you *could be* better or different than you are). *(Consensus: Aquinas consistently denies potentiality in God; this is core doctrine.)*
  3.  **God is Pure Act:** God is utterly actualized, perfect, and devoid of any imperfection or potentiality (established earlier in the *Summa*). *(Consensus: This is the bedrock of Aquinas's theology.)*
  4.  **Active Power Fits God:** Because God is pure perfection and act, He must be the *active principle* (the source of action/change) for other things. Passive power is utterly incompatible with His nature. *(Consensus: God's active causal power is universally affirmed in Aquinas scholarship.)*
  5.  **Conclusion - Active Power in Highest Degree:** Therefore, God possesses *only* active power, and possesses it maximally. He is the supreme agent, the uncaused cause, incapable of being acted upon. *(Consensus: This conclusion directly follows from premises 1-4.)*

  **Why This Matters for the Omnipotence Paradox (e.g., Stone, Changing Past):**
  *   **The Core Move:** Aquinas redefines omnipotence *in terms of active power only*. Omnipotence is the maximal ability to *act*, not the ability to *be acted upon* or to undergo change/passivity.
  *   **"Cannot" ≠ Lack of Power:** When we say God "cannot" create a stone too heavy for Him to lift, or "cannot" change the past, Aquinas argues this isn't a failure of *power* (active ability). It stems from:
      *   **Logical Impossibility (Consensus Core):** The task inherently involves a contradiction. A "stone too heavy for an omnipotent being to lift" is a self-contradictory concept like a "square circle." Changing the past while preserving its past-ness and infallible divine foreknowledge is similarly incoherent.
      *   **Involvement of Passivity (Contested Significance):** Aquinas suggests such impossible tasks *also* often imply God being passive (e.g., being *unable* to lift suggests being *acted upon* by the stone's weight; changing the past suggests being *changed* by a new fact). Since God *has no passive power*, such "tasks" fall completely outside the scope of what omnipotence (understood as maximal *active* power) even pertains to. *(Contested: While Aquinas clearly links passive power to imperfection/impossibility here, scholars debate how *essential* this link is to his solution vs. the logical contradiction point. Some see it as reinforcing; others see it as an independent but complementary strand.)*

  ### Tackling Your City Case
  *   **Scenario:** A being can actualize any non-contradictory state of affairs. Necessarily: City founded in 1000 → God knew in 900 it would be founded. Can this being make it such that the city was *not* founded in 1000?
  *   **Aquinas's Analysis (Based on this Passage & Consensus Doctrine):**
      1.  **Contradiction:** The state of affairs "City not founded in 1000 AND God knew in 900 it *would* be founded" is logically contradictory. It requires God's past knowledge (in 900) to be both true (knowing it *would* happen) and false (because it *didn't* happen). *(Consensus: Aquinas would see this as a straightforward contradiction.)*
      2.  **Not a Genuine "Task":** Because it's contradictory, it doesn't describe a coherent, possible state of affairs. It's not a "thing" (res) that *could* be actualized. *(Consensus: Aquinas firmly holds God's inability to do the logically impossible is not a limitation on His power, as these are non-things.)*
      3.  **Passive Power Angle?** Changing God's past knowledge would imply God *being changed* – His immutable knowledge state in 900 would need to be altered by a later event (the non-founding in 1000). This directly violates God's status as Pure Act (utterly unchanging, without passive power). *(Contested: While Aquinas would clearly reject changing God's knowledge due to immutability, linking this *specifically* to the passive/active power distinction *in this specific context* is an interpretive step, though highly plausible given the passage's emphasis.)*
      4.  **Conclusion:** No, the being *cannot* actualize this state of affairs. Not because of a lack of active power, but because the proposed state of affairs is incoherent and nonsensical (like making "2+2=5" true). It's not a limitation on power; it's the nature of reality and logic. God's immutability and foreknowledge are essential aspects of His perfection (Pure Act), making this "task" doubly impossible – logically contradictory *and* implying imperfection (change/passivity).

  ### Evaluating Your Friend's Reading
  *   **"Re-describing what a 'doable thing' is":** **This is largely a fair and insightful reading of Aquinas's core solution.**
      *   **Consensus Support:** Aquinas explicitly says God's omnipotence extends to "everything that does not imply a contradiction" (ST I, Q25, A3). He defines the scope of "what can be done" (*possibilia*) by logical coherence, not by brute force overcoming any conceivable description. Your friend captures this well: the "cannot" applies only to what isn't genuinely doable/possible.
      *   **Passage Fit:** The active/passive distinction *reinforces* this by grounding *why* certain impossible tasks (like being passive) fall outside "doable things" – they are incompatible with the very nature of the divine agent who is Pure Act.
      *   **Not Sneaking Anything In:** This is a mainstream interpretation (e.g., scholars like Brian Davies, Eleonore Stump). Aquinas isn't lowering the bar; he's rigorously defining the playing field of *real* possibilities based on God's nature and logic.
  *   **Minor Caveat:** While the core idea is sound, framing it *solely* as "re-describing" might slightly underplay the *metaphysical grounding* Aquinas provides (Pure Act, Act/Potency distinction) in favor of a more linguistic/logical emphasis. Aquinas's solution is deeply rooted in his metaphysics of being.

  ### Settled vs. Contested Interpretations

  | **Aspect**                  | **Settled Consensus**                                                                                                | **Genuinely Contested Areas**                                                                                                                                                                                                                                                                        |
  | :-------------------------- | :------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Active/Passive Power**    | God possesses only active power maximally; passive power is incompatible with Pure Act.                              | **Significance for Paradox:** Whether the passive power angle is *essential* to resolving paradoxes or secondary to logical contradiction.                                                                                                                                                           |
  | **Omnipotence Scope**       | Omnipotence = power to bring about any logically possible state of affairs. "Cannot do contradictions" is not a lack of power. | **Nature of "Implies Contradiction":** Does this include only strict logical contradictions, or extend to metaphysical impossibilities grounded in God's nature (e.g., sinning, changing)? Aquinas includes the latter, but debates arise on categorization.                                        |
  | **Pure Act**                | God is Pure Act, immutable, without potentiality or passivity.                                                       | **Application to Paradoxes:** Whether Aquinas's framework *adequately resolves* paradoxes like the stone. Some argue it dissolves them; others argue it redefines omnipotence to avoid them.                                                                                                          |
  | **Changing Past/God's Knowledge** | Impossible due to contradiction and violation of immutability.                                                       | **Interpretation of Key Terms:** E.g., "Principle" (*principium*) - primarily "source/origin" or also "starting point"? Context favors "source," but translations sometimes obscure nuance.                                                                                                         |
  | **Friend's Reading**        | Aquinas redefines "doable things" as logically possible states of affairs; impossible "tasks" are non-things.        | **Is it a "Reduction"?** While mainstream, some (e.g., Norman Kretzmann, possibly George Mavrodes) argue Aquinas *does* place a substantive (though necessary and non-detracting) "limitation" on the *scope* of divine action, even if not on its intrinsic power. The debate is semantic but persistent. |

  **Ambiguity Flag:** The translation of "*principium*" as "principle" is standard but broad. Here, in "active principle," it primarily means "source" or "origin" of action. While the translation isn't *wrong*, the nuance of "source" is crucial. The Latin itself is clear on the active/passive distinction.

  In essence: Aquinas defines omnipotence as maximal *active causal power* to bring about any *genuinely possible* (non-contradictory) state of affairs. The paradoxes fail because they describe incoherent scenarios that involve either logical contradictions or passivity/change in God – things fundamentally excluded from the realm of what divine power *applies to*, not things God lacks the strength to accomplish. Your city case perfectly illustrates this: it's contradictory and implies divine passivity, so it's not a "doable thing." Your friend's reading captures Aquinas's strategy well.
