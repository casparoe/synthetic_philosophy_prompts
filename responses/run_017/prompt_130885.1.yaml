  The earlier rulings (E1-E10) are consistent with three candidate rules:  
  (1) *Speaker-and-contact*: A pramāṇa must originate from a cognizer or direct contact with the object.  
  (2) *Presentation*: Classification depends on how the content is presented (perceptual, inferential, resemblance-based, or linguistic), with truth, determinacy, non-defeat, and novelty only for memory.  
  (3) *Causal process*: Classification depends on the causal process producing the cognition, plus truth and non-defeat.  

  The ten cases fail to choose between these rules because all three explain E1-E10 without contradiction. For example, E9 (astronomer's text) fits Rule 1 via the astronomer's prior contact, Rule 2 as linguistic presentation, and Rule 3 via the causal process of reading. E10 (reflection) fits all with "extraordinary contact" (Rule 1), perceptual presentation (Rule 2), or visual causation (Rule 3). E3 (gavaya) is upamāna under all by focusing on resemblance (Rules 1-2) or its causal process (Rule 3).  

