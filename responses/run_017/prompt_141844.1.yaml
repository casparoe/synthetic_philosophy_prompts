prompt: |-
  I am writing up a position paper on self-deception and would like an audit of the package of views I have ended up with before I commit to it in print. I do not want a survey of the literature, and I do not want citations, references, or a reading list: what I want is the structure of my own set of commitments, the places where they pull against each other, and what each possible repair would cost me. Here is where I have landed.

  First, I hold that self-deception is a genuine and common psychological phenomenon, and I am opposed to two ways of deflating it: I do not think it is just ordinary error or ordinary bias described in a dramatic register, and I do not accept the psychodynamic picture on which the person contains something like an inner agent that does the deceiving. My paradigm cases are the husband who gathers and then refuses to weigh the evidence of his wife's affair, and the patient who plans a future she has been told she will not live to see.

  Second, I hold that it must not be modeled on interpersonal deception: no homunculi, no sub-agents with intentions of their own, no inner committee. The self-deceiver is one agent, and I want the phenomenon describable without splitting the person into parts.

  Third, I hold that the acquisition of the belief need not be intentional. Motivated cognition is enough: biased search, selective attention, asymmetric scrutiny of evidence, avoidance of occasions on which the truth would come up. This holds even where the agent never decided to bring the comforting belief about and would deny having done anything of the kind. I also extend this to cases where the belief arrived at is not one the agent wanted to be true: a man who, out of a standing fear of public humiliation, comes to believe that his colleagues despise him. I want to count those as self-deception as well.

  Fourth, I hold that in genuine self-deception the truth remains, in some robust sense, in view. It is not mere ignorance, and not merely a false belief held on bad evidence; I resist dissolving the phenomenon into something like akrasia about belief, or into the thin claim that most of the evidence points one way while the agent believes the other with full conviction and no residue. Something like a sustained availability of the disconfirming considerations has to be present.

  Fifth, I hold that the self-deceiver is criticizable for the belief and that self-deception is not an excuse: the plea that he could not help believing it does not get him off the hook. This is part of why I think the category is worth keeping rather than replacing with the blander notion of motivated error.

  Sixth, methodologically, I want the concept empirically anchored. It should track something measurable in cognition, along the lines of selective exposure or asymmetric scrutiny, rather than being a purely interpretive stance we adopt towards other people. If it turned out that the ordinary notion cross-cuts several unrelated mechanisms, I would treat that as a problem for my account rather than for the psychology.

  Seventh, a case verdict I am attached to. Call it the archivist: a man begins to suspect his business partner of stealing from the firm, quietly assembles a meticulous dossier of the evidence, seals it in a drawer, arranges that it never be opened, and goes on trusting his partner, eventually resting easy in that trust. I want to say that this is self-deception, and a central instance of it, not merely a neighbouring phenomenon such as willful ignorance.

  Eighth, I hold that self-deception is continuous with the ordinary motivated reasoning documented in psychology rather than being a special pathological mechanism, while also holding that only some motivated reasoning is self-deception and the rest is just bias.

  My worry is that I have quietly removed the marks that were doing the work of separating self-deception from plain motivated error, and that my attachment to the archivist case and to the blame claim is being supported by something I have not stated. Go through these commitments pair by pair and tell me which pairs are in genuine tension and which only look as though they are. Rank the genuine tensions by severity rather than treating them as equal. For each, say what would have to be given up or added, and what that revision would cost me elsewhere in the package. Then tell me which single revision, if I made it, would clean up the most, and say explicitly which of the eight you think I am least entitled to keep. I am attached to all of them, so do not assume I have a preferred one to sacrifice.

  One request about form: write your answer as continuous prose, in the manner of a letter to a colleague who has asked you to look over a draft. No headings, no bullet points, no numbered sections, no bold text, no tables, and no block quotes: paragraphs of running prose from the first sentence to the last.
reasoning: |-
  Okay, let me think through this self-deception position paper audit request carefully. The user presents eight commitments about self-deception and wants me to identify tensions between them, rank those tensions, and suggest possible revisions - all while maintaining a specific letter-style format.

  First, I notice the core challenge: the user wants to maintain both that self-deception is distinct from ordinary motivated error (commitments 1,4,5) and that it's continuous with ordinary motivated reasoning (commitment 8). There's also the archivist case (7) that seems to push against the "truth in view" requirement (4). 

  The most severe tension appears between commitments 4 (truth robustly in view) and 7 (archivist case). The archivist actively sequesters evidence, which makes the truth less "in view" than in paradigm cases like the husband ignoring affair evidence. To resolve this, the user might need to either soften the "in view" requirement or reconsider the archivist as central. But the former risks collapsing the distinction from ordinary bias, while the latter sacrifices an intuitive case.

  Another significant tension exists between commitments 3 (unintentional belief acquisition) and 5 (criticizability). If the self-deceiver didn't intentionally form the belief, why are they blameworthy? The user might need to develop a theory of culpable negligence in belief formation to bridge this gap.

  The methodological commitment (6) could actually help resolve some tensions if empirical work shows measurable differences between self-deception and motivated error. But the user rejects pathological mechanisms (1), so any distinction must be quantitative rather than qualitative.

  I'll structure the response as a collegial letter, starting with the most severe tension (archivist vs truth-in-view), then moving to the blame vs unintentionality issue, followed by the continuity problem, and finally addressing how methodology might help. Throughout, I'll maintain the requested prose format without any bullet points or headings.

  The user seems deeply attached to all eight points, so I'll suggest minimal revisions where possible - like refining definitions rather than abandoning positions. The archivist case might be the most vulnerable commitment, but I'll present this as a tough choice rather than a clear verdict.
answer: |-
  My dear colleague,  

  Having sat with your draft and the set of commitments you’ve outlined, I find your position admirably cohesive but not without genuine tensions. You’ve constructed a tight conceptual space for self-deception—one that avoids sub-agents, intentional belief formation, and psychodynamic mythologies while preserving blameworthiness and empirical tractability. Yet the very constraints you’ve imposed create pressure points. Let me walk through the critical tensions, ordered by severity, and weigh the costs of possible repairs.  

  The sharpest tension lies between your fourth commitment (the truth must remain "robustly in view") and your seventh (the archivist case as central self-deception). The archivist actively seals away evidence, rendering the truth *un*available through deliberate physical sequestration. This clashes with the spirit of "sustained availability" in Commitment 4, where disconfirming considerations linger perceptually or cognitively—like the husband who sees but dismisses his wife’s suspicious behavior. To reconcile these, you might soften Commitment 4 to include cases where the agent *could* access the truth but systematically avoids doing so. Yet this risks collapsing the distinction from willful ignorance (which you explicitly reject for the archivist). Alternatively, you might demote the archivist to a peripheral case, but this sacrifices a vivid, defining example you value. The cost of either move is high: diluting "in view" weakens your shield against dissolving self-deception into mere motivated error; abandoning the archivist surrenders a paradigm that elegantly captures agential activity without homunculi.  

  Next, Commitment 3 (belief acquisition need not be intentional) and Commitment 5 (the self-deceiver is blameworthy) pull against each other. If the husband never *decides* to believe his wife is faithful—if biased cognition operates automatically—why is he culpable? Blame seems to require control, yet you reject intentional belief formation. You might resolve this by grounding blame in *negligence*: the agent could and should have monitored their reasoning but failed to do so. But this demands an account of epistemic duties that your current package lacks. Without it, the blame claim risks feeling unanchored, especially alongside Commitment 2’s insistence on a unified agent. The cost? Adding negligence might introduce a quasi-agential "should have known" standard that strains your anti-sub-agent stance.  

  Commitment 8 also generates friction. Asserting that self-deception is continuous with ordinary motivated reasoning—yet distinct from "mere bias"—requires a principled boundary you haven’t yet drawn. What marks the threshold? Commitment 4’s "truth in view" is your best candidate, but the archivist case strains it, as noted. Commitment 6 (empirical anchoring) could help here if mechanisms like "asymmetric scrutiny" manifest measurably differently in self-deception than in lighter bias. Yet if psychology reveals only a continuum of motivated cognition, your distinction risks becoming stipulative. To fortify this, you might specify that self-deception involves *sustained, effortful avoidance* of epistemic threats—a pattern detectable in cognitive load or attentional studies. The cost is potential circularity: you’d be defining the phenomenon partly by the mechanisms you claim to detect.  

  Not all tensions are equally severe. Commitment 1’s rejection of deflationary views is well-supported by your other commitments: ordinary error lacks the "truth in view" element, and psychodynamic homunculi violate Commitment 2. Commitment 2 itself (no sub-agents) is reinforced by methodological Commitment 6—sub-agents are empirically unanchored. The extension of self-deception to unwanted beliefs (Commitment 3) coheres with your mechanism of motivated cognition, as fear can drive avoidance as powerfully as desire.  

  If I had to advise one revision to relieve maximal pressure, it would be to refine Commitment 4. Clarify that "in view" permits *procedural* availability: the truth remains within the agent’s *capacity to access*, even if not presently attended to, and its avoidance requires active cognitive or behavioral work. This rescues the archivist (the dossier *could* be opened) and sharpens the contrast with passive ignorance. It also supports blame: the agent sustains the false belief by ongoing avoidance of retrievable evidence. But the cost is conceding that "in view" isn’t perceptual or occurrent—it becomes a dispositional property, which may feel less "robust" than you intended.  

  Of your eight commitments, the archivist case (7) is the least entitled to stand unmodified. Not because it’s flawed, but because it currently overreaches: it exemplifies agential avoidance brilliantly but clashes with your core criterion for what makes such avoidance *deceptive*. To keep it central, you must adjust the conditions under which truth is "in view." Without that, it remains a powerful intuition in search of a supporting principle.  

  Your package is rigorous and philosophically defensible, but its stability hinges on calibrating the relationship between truth-accessibility and blame. The archivist exposes this: he shows *how* we evade, but your framework must show *why* that evasion is deception rather than cowardice or neglect. Tread carefully here—the line you draw will define the phenomenon.  

  Yours in solidarity,  
  A critical reader
