prompt: |-
  I'm in a bioethics seminar this term and we spent two sessions on the definition of death and I came out more confused than I went in, mostly because I got into an argument with a friend in my study group who's pre-med and kept insisting the whole debate is just about which test is more reliable then the other, like it's a lab-accuracy question. That felt obviously wrong to me but I couldn't say why. Our TA keeps repeating that we have to separate the concept of death from the criteria for it from the tests we run, and I sort of get the distinction in the abstract but I don't know what work it's supposed to actually do.

  So before I read another paper, I want the spec. Fix the purpose: a hospital needs to decide, at a determinate time, whether this patient may be declared dead, which then settles whether support can be withdrawn, whether organs can be taken, whether a death certificate gets signed, whether a spouse inherits. Write me the list of things an account of death has to get right to be adequate for that, with the case or consideration behind each requirement, and mark each one as either non-negotiable or just something one camp really wants.

  Cases I want the requirements tested against, since these are the ones that broke my brain: (1) the brain-dead patient on a ventilator whose body is still doing things that look organismic — holding temperature, healing wounds, carrying a pregnancy for months — so if death is supposed to be the loss of integration of the organism as a whole, the criterion seems to misfire; (2) the donation-after-circulatory-death pathway, where the patient isn't brain dead, support is withdrawn, the heart stops, and death is declared after a short wait, except that what's being declared there looks like permanent rather than irreversible cessation, since circulation could in principle be restarted, and someone in the group said the whole pathway quietly swaps one standard for the other; (3) a case I made up that I'd like honestly stress-tested rather than waved away: suppose a team clamps off the arteries to the brain and then uses a pump to restore circulation to just the abdominal organs, so blood is moving through part of the body while the brain is deliberately kept without flow — is that person dead, and what does an account need in order to have an answer; (4) someone in a permanent vegetative state, breathing on their own, sleep-wake cycles, no capacity for consciousness; (5) the fact that irreversibility looks indexed to whatever technology we happen to have, since CPR reverses what used to count as death — I cant tell weather the account is allowed to drift with available technology or has to be pinned down so it can't.

  Distinctions I don't want collapsed, though I'm not sure all of them are real: death vs being irreversibly dying, death vs no longer being a person, death vs not being worth treating, being dead vs being treated as dead for legal and social purposes, and whether one account has to cover the biology, the law and the morality at once or whether different purposes get different answers. If some subset of the requirements can't be jointly satisfied, say so and say which one gives — I have a guess, that the demand for a single determinate biological event with no value judgements smuggled in collides with the demand that death track what we actually care about when someone dies, but find the real tension, not the one I've guessed at. And then flag the single requirement that does the most work in knocking out candidates. After that, no more than a couple of lines each on how the usual contenders do: the whole-brain view, the circulatory-cessation view, and the consciousness-or-person based view. Please don't give me a reading list, I already have a stack of papers I'm behind on and my professor will assign more anyway.
reasoning: |-
  Okay, the user is in a bioethics seminar and struggling with the definition of death, especially after arguments with a pre-med student who views it as just a lab-accuracy issue. They need a clear specification of what makes an account of death adequate for hospital decisions, tested against specific cases. 

  First, I need to unpack why the pre-med's view is wrong. The TA emphasizes separating concept, criteria, and tests because conflating them leads to confusion. The concept is the philosophical definition (what death *is*), criteria are the observable conditions (e.g., irreversible cessation of brain function), and tests are the medical procedures (like EEG). Reducing death to test reliability ignores the ethical and conceptual foundations—it's like focusing only on a thermometer's accuracy without defining what temperature *means*.

  The user’s core request is a list of requirements for a hospital-ready death definition. Their pain points: 
  - They want practical clarity but feel overwhelmed by abstract debates. 
  - They’re hung up on edge cases (brain-dead bodies "integrating," DCD protocols, their brain-clamp scenario). 
  - They’re wary of collapsing distinctions (e.g., death vs. personhood) and want tensions exposed. 

  Key insight: Their frustration hints at a deeper need—to reconcile the biological "event" of death with its social/legal consequences. The tension they suspect (biology vs. what we care about) is real, but the real bottleneck is Requirement 2 (non-reversibility vs. technological drift). 

  For the requirements list: 
  - Non-negotiable: Death must mark a biological threshold (Req 1), be irreversible in practice (Req 2), and align with legal/social acts (Req 5). 
  - Contested: Req 3 (integration) and Req 4 (consciousness) are where camps diverge. 
  - Req 2 is the troublemaker—irreversibility can’t be both timeless and tech-sensitive. DCD exposes this; we pretend permanence equals irreversibility to make organ donation work. 

  Their brain-clamp scenario (case 3) is brilliant—it forces a choice: Is circulation to the body enough? Only whole-brain or consciousness-based views clearly say "dead," but the latter conflicts with legal standards. 

  For contenders: 
  - Whole-brain: Fails their brain-dead pregnancy case (Req 3) because the body *is* integrated sans brain. 
  - Circulatory: Buckles under DCD (Req 2)—declaring death based on permanence, not irreversibility. 
  - Consciousness-based: Rejects PVS as dead (Req 4) but wrecks organ donation (Req 5). 

  The takeaway: No view satisfies all. Hospitals use hybrid approaches, bending Req 2 for pragmatism. The user’s hunch is right—biology alone can’t capture what we care about, but we force it to for consistency. 

  ...Time to structure this into requirements, cases, and contender eval.
answer: |-
  Here's a specification of requirements for an account of death adequate for hospital decision-making, tested against your cases, with distinctions preserved and tensions exposed:

  ### Non-Negotiable Requirements (Essential for Hospital Use)
  1.  **Biological Threshold:** Must mark the *biological endpoint* of the organism as a whole (not just "personhood" or worthiness of treatment).
      *   **Why:** Death certificates, inheritance, and burial rights hinge on biological cessation. Distinguishes death from permanent unconsciousness (PVS) or irreversible dying.
      *   **Case Test:** PVS (#4) fails - breathing/sleep cycles show organismic function. Consciousness-based views (#5) collapse death/personhood here.
      *   **Status:** Non-negotiable.

  2.  **Practical Irreversibility:** Must be declared based on *currently irreversible* cessation under prevailing medical technology and context.
      *   **Why:** Hospitals act *now* with available tools. "Irreversible" means cannot be reversed *with current technology in this setting* at the time of determination. Allows for progress (CPR made cardiac arrest reversible; we don't call it death anymore).
      *   **Case Test:** DCD (#2) relies on this - cessation is permanent *in that context* (no intent/means to restart). Brain death (#1) assumes irreversibility with current tech. Your tech-drift concern (#5) is inherent - the *concept* (irreversible cessation) is fixed, but the *criterion* (what counts as irreversible) evolves.
      *   **Status:** Non-negotiable. **This is the requirement that does the most work knocking out candidates.** It forces a link to current medical capability.

  3.  **Legal & Social Action Trigger:** Declaration must reliably permit/require specific legal and social acts (stopping treatment, organ procurement, death certificate, inheritance).
      *   **Why:** The hospital's core need. Death must be a *socially recognized status* enabling these acts, distinct from biological status alone.
      *   **Case Test:** DCD (#2) works *only* if declaration permits organ procurement. Brain death (#1) works only if it permits stopping ventilation/organs. PVS (#4) fails - stopping treatment requires futility/judgment, not death declaration.
      *   **Status:** Non-Negotiable.

  ### Contested Requirements (Camps Disagree on Necessity)
  4.  **Total Organismic Integration Loss:** Must entail the *complete and irreversible loss of the body's capacity for integrated functioning as a whole*.
      *   **Why:** Defends the biological threshold against mere subsystem failure. Emphasizes the organism ceases to be a unified entity.
      *   **Case Test:** Brain-death pregnancy (#1) *challenges* this - wound healing/temp regulation suggest residual integration. Brain Clamp (#3) *requires* this - without brain integration, is the body "whole"? Circulatory views often struggle here.
      *   **Status:** Camp-Specific (Whole-brain camp demands it; Circulatory camp often sees it as a consequence).

  5.  **Exclusion of Consciousness Capacity:** Must entail the *irreversible loss of the capacity for consciousness*.
      *   **Why:** For some, consciousness is the defining feature of human life. Death shouldn't leave a potentially conscious being (even if severely disabled).
      *   **Case Test:** PVS (#4) - If capacity for consciousness is irreversibly lost, is this death? Higher-brain/pro-consciousness views say yes. Brain Clamp (#3) - If brain is destroyed/isolated, capacity is lost. Whole-brain/circulatory views reject linking death solely to consciousness loss.
      *   **Status:** Camp-Specific (Higher-brain/personhood camp demands it; Others reject collapsing death/personhood).

  ### The Core Tension & Your Cases
  *   **The Real Tension:** **Requirement #2 (Practical Irreversibility) vs. Requirement #4 (Total Organismic Integration Loss) in a technologically advancing world.** We *need* death to be a clear, determinable point using current tech (#2), but our best biological understanding of "organism as a whole" (#4) might be fuzzy (brain-dead pregnancy #1) or require future tech to fully assess. DCD (#2) highlights this: we declare based on *permanent* (won't reverse) cessation in that context, knowing *irreversible* (can't reverse) might not be strictly true yet. **The "drift" is in the *criterion* (how we measure integration/irreversibility), driven by tech, not necessarily the *concept*.**

  *   **Your Brain Clamp Case (#3):** This stresses Requirement #4.
      *   **Whole-Brain View:** Dead. Brain function is irreversibly destroyed/lost (criterion met), total integration is gone.
      *   **Circulatory View:** *Not Dead?* Circulation is artificially maintained *to the body*. Controversy arises: is the *organism's own* circulation ceased? Requires defining "organism" vs. "collection of perfused tissues".
      *   **Consciousness View:** Dead. Capacity for consciousness is irreversibly lost.
      *   **What's Needed:** An account must define the "organism as a whole" clearly enough to say if artificially perfused tissues sans brain constitute it. Whole-brain view handles this cleanly; circulatory view struggles.

  ### How Contenders Fare (Briefly)
  1.  **Whole-Brain (Irreversible cessation of *all* functions of the entire brain, including brainstem):**
      *   **Meets:** #1 (Threshold), #2 (Declarable via tests), #3 (Action Trigger), #4 (Integration Loss - despite pregnancy anomalies, argues brain is central integrator).
      *   **Fails/Struggles:** Brain-dead pregnancy (#1) *challenges* #4 (residual integration?). DCD (#2) requires a *different* criterion. PVS (#4) is alive.

  2.  **Circulatory (Irreversible cessation of circulatory/respiratory functions):**
      *   **Meets:** #1 (Threshold - historically core), #2 (Declarable), #3 (Action Trigger for DCD), often simpler.
      *   **Fails/Struggles:** Brain-death (#1) - body functions persist, so death declaration relies on brain criterion. DCD (#2) relies on *permanence*, not strict irreversibility. Brain Clamp (#3) - is circulation "ceased" if artificially maintained? PVS (#4) is alive.

  3.  **Consciousness/Higher-Brain (Irreversible loss of capacity for consciousness/personhood):**
      *   **Meets:** #1 (Threshold - defines a human-specific endpoint), #4 (Loss of defining function), declares PVS (#4) dead.
      *   **Fails/Struggles:** #2 (Tests for "irreversible loss of *capacity*" are inferential/unreliable). #3 (Societies/Laws overwhelmingly *reject* declaring PVS dead; wrecks organ donation from brain-dead donors). Brain-death (#1) is dead, but DCD (#2) patient *before* cardiac arrest may still have consciousness capacity - not dead yet. Collapses death/personhood distinction.

  **Conclusion:** No single account perfectly satisfies all requirements, especially bridging #2 (practical declarability) and #4 (biological integration) seamlessly across all edge cases. **Hospitals use hybrid systems:** Brain death standard for ventilated patients, circulatory standard for DCD. The law *treats* both as legally dead, satisfying #3, based on arguments that each meets the *concept* of irreversible cessation of organismic function (#1), as measured by the best available *criteria* (#2) for that context. The tension between biological precision and practical/legal needs is inherent and managed, not resolved. Your pre-med friend is wrong because the debate is fundamentally about *what biological phenomenon* the tests are trying to reliably detect (the concept/criterion), not just test accuracy itself.
