  Below is a decision tree designed to diagnose underlying theories of genocide. It meets your requirements: 9 concrete questions (no jargon), 10 distinct leaves, and explicit handling of your river pilots scenario and non-lethal cultural destruction. The tree prioritizes logical flow over legal theory, ensuring literary readers can engage without prior knowledge. 

  **How to Use:**  
  Answer each question based on intuition. The options avoid legal labels, focusing on real-world examples. After all answers, tally the results to find your position. The scoring key explains how answer patterns map to philosophical/legal stances.

