  ### **THE DECISION TREE**  
  *Answer with A, B, or C for each question.*

  1. **A government forcibly removes children from a community to be raised in other families, bans the community’s language, and destroys its records. No one is killed. Is this destruction of a group?**  
     - A) Yes, because the group cannot pass on its identity.  
     - B) No, because no one died.  
     - C) Only if there was mass trauma or suffering.  

  2. **A hereditary guild of river pilots (with its own language, training, and marriages) is dissolved by a state. They aren’t a race, nation, or religion. Can this be group destruction?**  
     - A) No—only racial/ethnic/religious/national groups count.  
     - B) Yes, because they’re a distinct cultural group.  
     - C) Yes, because the state targeted them *as* a group.  

  3. **Some targeted people didn’t identify as guild members before the persecution. Does this matter?**  
     - A) Yes—a group must exist independently to be destroyed.  
     - B) No—if perpetrators treat them as a group, that’s enough.  

  4. **A policy expels a group from their land, knowing it will destroy them. The goal was land seizure, not annihilation. Is this group destruction?**  
     - A) No—the perpetrators must *intend* to destroy the group.  
     - B) Yes—they knew destruction would happen.  
     - C) Yes—they were reckless about it.  

  5. **A mob destroys every home in one town of a minority group. The rest of the group survives. Is this "in part" destruction?**  
     - A) No—the part must threaten the whole group’s survival.  
     - B) Yes—any distinct part (like a town) counts.  
     - C) Only if it was the group’s last stronghold.  

  6. **Economic policies slowly starve a group over decades. No one planned this outcome. Can this destroy a group?**  
     - A) No—destruction requires a plan or campaign.  
     - B) Yes—if institutions knew and did nothing.  
     - C) Yes—even if no one intended it.  

  7. **Is destroying a group morally worse than killing the same number of people randomly?**  
     - A) Yes—it attacks future generations and identity.  
     - B) No—the moral wrong is the suffering, not the group.  

  8. **When should the word "genocide" be used?**  
     - A) Only when courts can convict—it’s a legal term.  
     - B) Early, as a warning—to prevent escalation.  
     - C) Rarely—it escalates conflict and distorts facts.  

  9. **Can group destruction happen without a state?**  
     - A) No—only states or armies have such power.  
     - B) Yes—mobs or militias can do it.  
     - C) Yes—even societal pressures can.  

