  Below is a decision tree designed as a diagnostic instrument for your needs. It consists of 10 branch questions (each with 2–3 concrete, non-jargon options) and leads to 12 distinct "leaves" representing coherent theoretical positions on genocide. The questions are phrased as scenarios or claims to avoid presupposing legal/moral concepts, and they incorporate your fictional wrinkles (e.g., the river pilots guild, cultural destruction without killing, and groups created by targeting). The tree first maps the logical space (dimensions, questions, and answer combinations) before assigning named positions to specific answer patterns. Empty cells in the logical space are noted, and overlapping leaves are flagged.

  ---

  ### **Logical Space: Dimensions and Questions**
  The tree covers seven core dimensions of genocide debates, broken into 10 questions. Each question isolates a key distinction without using terms like "intent," "group," or "genocide." The answer combinations define a 10-dimensional space. Named positions occupy specific regions of this space; unattractive or incoherent combinations are left empty.

  #### **Dimensions Covered:**
  1. **Intent**: Specific intent to destroy vs. foresight/knowledge of destruction vs. recklessness vs. expulsion/dissolution without destruction.
  2. **Group Definition**: Convention groups (national, ethnic, racial, religious) only vs. broader groups (e.g., political, occupational) vs. groups created by targeting.
  3. **Means of Destruction**: Killing/preventing births vs. cultural erasure (no killing).
  4. **Scale**: "Substantial part" (e.g., town, valley) vs. "remnant" (survival-critical part) vs. minimal part.
  5. **Perpetrator**: State/organized plan required vs. diffuse actors/processes (no planners).
  6. **Moral Distinctiveness**: Genocide as a unique wrong against group existence vs. morally equivalent to individual murders + shared motive.
  7. **Naming Practice**: Use strictly for courts vs. early/loose for prevention vs. avoid due to distortion.

  #### **Questions and Answer Options:**
  Each question is standalone. Answer letters (A, B, C) are used for scoring.  
  *Note: "Destroy" is used neutrally (not implying killing).*

  1. **Village Expulsion Scenario**:  
     A government forces a minority group to flee their village during a conflict. Many die from exposure or violence during the exodus. The government’s goal was only to remove them, not to kill them.  
     - **A**: This is a grave crime, but not the worst possible one.  
     - **B**: This is among the worst crimes because the government knew deaths would happen.  
     - **C**: This is among the worst crimes only if the government specifically wanted the group gone forever.  

  2. **Factory Pollution Scenario**:  
     A corporation dumps toxic waste near a minority community, causing long-term illness and infertility. The corporation focused on profit and ignored warnings.  
     - **A**: This could be among the worst crimes because they were reckless about destroying the community.  
     - **B**: This is a crime, but not among the worst—destruction wasn’t the goal.  
     - **C**: This is among the worst crimes only if they aimed to destroy the community.  

  3. **Political Purge Claim**:  
     “Systematically killing members of a political party to eliminate it should be called the worst possible crime, just like targeting an ethnic group.”  
     - **A**: Agree—any group can be targeted this way.  
     - **B**: Disagree—only ethnic, racial, religious, or national groups apply.  

  4. **Occupational Targeting Scenario**:  
     A state abolishes a hereditary guild (e.g., river pilots), arrests members, and bans their language. Some targeted people never identified as guild members before this.  
     - **A**: Targeting them counts as the worst crime—the perpetrators defined the group.  
     - **B**: It only counts if the group had a strong pre-existing identity.  

  5. **Child Assimilation Scenario**:  
     A government takes children from a minority group, places them with majority families, and bans cultural practices. No one is killed, but the group disappears in a generation.  
     - **A**: This is among the worst crimes—the group was erased.  
     - **B**: This is a crime, but not among the worst—no one died.  

  6. **Valley Massacre Scenario**:  
     Soldiers kill every member of a minority group in one valley. The group thrives elsewhere. The valley wasn’t culturally unique.  
     - **A**: This is among the worst crimes—a large part was destroyed.  
     - **B**: This is only among the worst crimes if the valley group was key to the group’s survival (e.g., the last remnant).  
     - **C**: This isn’t among the worst crimes—the group survives.  

  7. **Remnant Scenario**:  
     After 90% of a group is killed, the remaining 10% could rebuild. They weren’t targeted further.  
     - **A**: Destroying 90% is among the worst crimes—the part was substantial.  
     - **B**: It’s only among the worst crimes if the remnant couldn’t rebuild.  

  8. **Economic Collapse Scenario**:  
     Over decades, trade policies bankrupt a minority group. No one planned this; it resulted from indifference and bureaucracy. The group disperses and assimilates.  
     - **A**: This is among the worst crimes—the outcome is what matters.  
     - **B**: This is only among the worst crimes if there was a plan to destroy them.  

  9. **Moral Claim**:  
     “Killing 100 people because they belong to a group is worse than 100 random murders—it attacks human diversity and future generations.”  
     - **A**: Agree—the group’s erasure adds unique harm.  
     - **B**: Disagree—murder is equally wrong; the group aspect is legally useful but not morally worse.  

  10. **Early Warning Scenario**:  
      Reliable reports show a government planning policies that could destroy a group. No deaths have occurred.  
      - **A**: Use the strongest label now to raise alarm and prevent harm.  
      - **B**: Use the label only if evidence meets a strict legal definition.  
      - **C**: Avoid the label—it escalates tensions and distorts responses.  

  ---

  ### **Logical Combinations and Named Positions**
  - **Total possible combinations**: 3 × 3 × 2 × 2 × 2 × 3 × 2 × 2 × 2 × 3 = 2,592 theoretical positions.  
  - **Actual positions**: 12 named leaves occupy coherent regions. Empty cells arise from:  
    - **Incoherence**: e.g., Requiring specific intent (Q1C) but accepting diffuse perpetrators (Q8A) is contradictory (no organized plan implies no specific intent).  
    - **Unattractive**: e.g., Believing cultural destruction is genocide (Q5A) but requiring remnant destruction (Q7B) is rare—cultural erasure doesn’t require remnant targeting.  
    - **Unexplored**: e.g., Combining foresight-based intent (Q1B) with avoidance of the genocide label (Q10C) is theoretically possible but not advocated.  
  - **Overlap**: Two leaves (Structural Expansionist and Deflationary Culturalist) share answer patterns on intent/perpetrator; they are separated by Q9 (moral distinctiveness). Flagged below.

  #### **Named Positions (Leaves)**
  Leaves are defined by core features. Answer patterns determine assignment.  
  *Scoring key follows the list.*

  1. **Strict Convention Legalist**:  
     Adheres to the 1948 UN Convention. Genocide requires specific intent to destroy a Convention group via killing, with state/organized perpetrators. The label is strictly legal.  
     - **Answers**: 1C, 2C, 3B, 4B, 5B, 6A, 7A, 8B, 9A, 10B.

  2. **Broad Lemkin Culturalist**:  
     Expands groups (occupational, political) and means (cultural erasure). Requires specific intent. Uses the label for prevention.  
     - **Answers**: 1C, 2C, 3A, 4A, 5A, 6A, 7A, 8B, 9A, 10A.

  3. **Foresight Expansionist**:  
     Replaces specific intent with foresight/knowledge of destruction. Convention groups only. Legalist naming.  
     - **Answers**: 1B, 2A, 3B, 4B, 5B, 6A, 7A, 8B, 9A, 10B.

  4. **Politicide Advocate**:  
     Includes political groups. Specific intent and killing required. Early naming to prevent.  
     - **Answers**: 1C, 2C, 3A, 4B, 5B, 6A, 7A, 8B, 9A, 10A.

  5. **Structural Expansionist**:  
     Diffuse perpetrators (no planners) and foresight-based intent. Broad groups and cultural means. Early naming.  
     - **Answers**: 1B, 2A, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10A.

  6. **Cultural Destruction Advocate**:  
     Cultural erasure as genocide (no killing). Specific intent and Convention groups. Legalist naming.  
     - **Answers**: 1C, 2C, 3B, 4B, 5A, 6A, 7A, 8B, 9A, 10B.

  7. **Remnant Essentialist**:  
     Destruction must threaten group survival (target a remnant). Specific intent and Convention groups.  
     - **Answers**: 1C, 2C, 3B, 4B, 5B, 6B, 7B, 8B, 9A, 10B.

  8. **Deflationary Strict Legalist**:  
     Convention-compliant but rejects moral distinctiveness. The label is only a legal trigger.  
     - **Answers**: 1C, 2C, 3B, 4B, 5B, 6A, 7A, 8B, 9B, 10B.

  9. **Deflationary Culturalist**:  
     Cultural erasure as genocide, but not morally distinct. Broad groups. Early naming.  
     - **Answers**: 1C, 2C, 3A, 4A, 5A, 6A, 7A, 8B, 9B, 10A.

  10. **Structural Skeptic**:  
      Rejects diffuse perpetrators; requires organized planners. Broad groups and foresight-based intent. Early naming.  
      - **Answers**: 1B, 2A, 3A, 4A, 5A, 6A, 7A, 8B, 9A, 10A.  
      *Note: Overlaps with Structural Expansionist on all but Q8 (perpetrator).*

  11. **Prophylactic Minimalist**:  
      Uses the label early for prevention, but requires specific intent and Convention groups.  
      - **Answers**: 1C, 2C, 3B, 4B, 5B, 6A, 7A, 8B, 9A, 10A.

  12. **Avoidance Advocate**:  
      Avoids the label entirely due to distortion risks. Holds varied views but united on Q10C.  
      - **Answers**: Any combination with 10C.  
      *Note: Heterogeneous; other answers define subtypes, but Q10C is the unifying feature.*

