  - H: 8-1 -> true.
  - N: 6-3 -> true.
  - S: 2-7 -> false.
  - E: 3-6 -> false.
  - (S or E): false.
  - Outcome: deny.

  But a show of hands on granting would be 6-3 grant. 

  We record the findings: H true, N true, S false, E false -> deny.

  We do not record the conclusion vote because we didn't take it. If we had taken it, we would note the conflict but still rule deny.

  The applicant might appeal, but the findings support the decision.
