  ### Proposed Voting Procedure for Zoning Board Variance Applications

  Given your constraints (nine-member board, recusals, time pressure, legal requirement for findings that entail the outcome), I've designed a **Sequential Premise-Based Voting with Burden-Aware Tiebreakers**. This balances logical rigor with practicality, avoids the discursive dilemma by enforcing consistency, and includes fallbacks for ties or inconsistencies. The core idea: vote on all premises individually (H, N, S, E), compute majority judgments (with ties breaking against the applicant), then apply the ordinance rule (`Grant iff H and N and (S or E)`). Deliberation focuses on premises first, not the conclusion.

  **Procedure Steps (10-Minute Worksheet Flow):**
  1. **Record Recusals**:  
     - Before voting, identify recused members (e.g., if a neighbor objects). Reduce total voting count for all premises (e.g., 9 → 7 if two recuse).  
     - *Judgment call*: Chair determines recusals; if challenged, majority vote (rare, but defer to attorney if unclear).

  2. **Vote on Premises (Order: H → N → S → E)**:  
     - Vote on each premise **separately** (never bundle S/E). Members vote Y/N.  
     - Majority rule: Premise true if Y votes > 50% of non-recused members.  
     - **Tiebreaker**: Ties (Y = N) → false (applicant's burden).  
     - *Sufficient answer*: Simple majority per premise; no abstentions (members must vote Y/N).

  3. **Compute Outcome**:  
     - Apply ordinance: Grant if collective H=true, N=true, and (S=true or E=true). Else, deny.  
     - *Critical point*: Stops early if H or N fails (e.g., if H=false, skip N/S/E votes but **must still record votes for findings**). Do not skip votes—ordinance requires findings on all four.

  4. **Handle Inconsistent Premises (Fallback)**:  
     - If collective premises don't entail outcome (e.g., H=true, N=true, S=false, E=false → deny), proceed as above.  
     - If majority premises imply grant/deny but conflict with the rule (rare; see Case 3), **stick with the computed outcome**—findings legally entail it.  
     - *Fallback for deadlock*: If premises are tied and burden forces deny, but board feels stuck, allow 5-minute deliberation revote on tied premises only. If still tied, deny.

  5. **Tie and Recusal Handling**:  
     - Recusals reduce voting pool (e.g., 9 members, 2 recused → 7 voters; tie if 3Y–3N).  
     - 4–4 tie? Breaks to false (burden).  
     - Even with recusals, all non-recused vote on all premises.

  6. **Values Call vs. Fact Call**:  
     - H, N, S are "fact calls" (evidence-based): "Is there hardship?" etc. Vote per evidence.  
     - E ("exceptional case") is a "values call" (board judgment on uniqueness). Deliberate briefly here—chair frames with examples, but still vote Y/N.  
     - *Where procedure stops*: After votes, outcome is mechanical. If members dispute the rule itself (e.g., "exceptional should mean X"), that's a legal debate for another day—stick to ordinance wording.

  7. **Final Checks**:  
     - **No conclusion vote** (e.g., no "grant/deny" show of hands). Premises + rule = outcome.  
     - If collective premises are inconsistent (e.g., discursive dilemma where majority premises deny but >50% of members would grant), **fallback to premises**. Findings still entail outcome—explain to judge: "The law requires findings on specific facts; we aggregated those facts fairly, and the outcome follows from the ordinance rule."  
     - Worksheet logs all votes, recusals, and computed outcome.

  **Why This Works**:  
  - Avoids discursive dilemma by not voting on conclusion.  
  - Respects burden of proof (ties → deny).  
  - Efficient (sequential, minimal steps).  
  - Legally defensible: Findings are recorded premises; outcome derives from rule.

  **What It Can't Do**:  
  - **Resolve deeply conflicting worldviews**: E.g., if half the board thinks "hardship" requires financial ruin, half thinks it's mere inconvenience, deliberation is needed—procedure won't fix this.  
  - **Prevent strategic voting**: Members might vote against premises to force denial (but rare in volunteer boards).  
  - **Guarantee "fairness"**: If collective premises contradict majority intent (Case 3), it favors consistency over intent. Tell the judge: "We followed the ordinance structure; intent is for legislatures, not boards."  
  - **Handle ambiguous evidence**: Relies on members to interpret facts (e.g., "Is this harm substantial?").  
  - **Fix bad rule design**: If "exceptional" is too vague, the board must lobby for ordinance changes.

  ---

  ### Run the Procedure on Your Cases
  **Case 1 (Last Month's Worksheet)**:  
  | Member | H | N | S | E |  
  |--------|---|---|---|---|  
  | A      | Y | N | N | N |  
  | B      | Y | N | N | N |  
  | C      | Y | N | N | N |  
  | D      | Y | N | N | N |  
  | E      | Y | Y | Y | N |  
  | F      | Y | N | N | Y |  
  | G      | N | Y | N | Y |  
  | H      | N | Y | N | N |  
  | I      | N | Y | N | N |  

  - **Recusals**: 0 (all 9 vote).  
  - **H vote**: 6Y (A,B,C,D,E,F), 3N (G,H,I) → true (majority).  
  - **N vote**: 4Y (E,G,H,I), 5N (A,B,C,D,F) → false (majority N; burden not used).  
  - **Stop early?** N=false → deny. But record all premises for findings.  
  - **S vote**: 1Y (E), 8N → false.  
  - **E vote**: 3Y (E,F,G), 6N → false.  
  - **Collective**: H=true, N=false, S=false, E=false.  
  - **Outcome**: Deny (N false).  
  - **Consistency check**: N/A (no conclusion vote).  
  *Why it didn't break*: N fails early—no dilemma.

  **Case 2 (8 Members, N Tied, S False, E Conflict)**:  
  - **Recusals**: 1 (8 voters).  
  - Assume: H=5Y–3N → true (majority).  
  - N=4Y–4N → tie → false (burden).  
  - S=0Y–8N → false (all agree self-created).  
  - E=5Y–3N → true (majority).  
  - **Stop early?** N=false → deny.  
  - **Collective**: H=true, N=false, S=false, E=true.  
  - **Outcome**: Deny (N false).  
  - **The "Package" Issue**: You mentioned 5 vote E=Y but 5 vote against "S or E" as a package. This is illogical—if E=true, "S or E" must be true. In this procedure, we ignore package votes; S/E are separate. The outcome is deny regardless.

  **Case 3 (Family with Mistaken Letter)**:  
  - H: 8Y–1N → true.  
  - N: 6Y–3N → true.  
  - S: 2Y–7N → false.  
  - E: 3Y–6N → false.  
  - **Collective**: H=true, N=true, S=false, E=false → (S or E)=false.  
  - **Outcome**: Deny (S or E false).  
  - **But... Show of hands on grant**: 6Y–3N (would grant).  
  - **The Conflict**: This is the discursive dilemma. Majority premises force deny, but majority members want to grant.  
  - **What to Do**:  
    - Stick with deny outcome. Findings (H true, N true, S false, E false) entail deny under ordinance.  
    - **Explain to Judge**: "The board's findings on each required fact, determined by majority vote, do not support granting under our rule. While 6 members felt the variance should be granted, the law compels us to base decisions on specific findings, not a conclusion vote. We cannot grant if the collective facts fail the ordinance test."  
    - **Board Action**: If this happens, chair should note: "Collective facts compel denial, though a majority disagrees. We must deny, but we flag this for ordinance review."

  ---

  ### Final Notes
  - **When Deliberation is Essential**:  
    - Debate E ("exceptional")—it's values-based. Chair should say: "Is this situation truly unusual, beyond typical hardship?"  
    - If premises tie, brief revote deliberation.  
    - If evidence is contested (e.g., "Is the harm substantial?"), focus discussion there.  
  - **Worksheet Design**:  
    - Grid with members (rows), premises (columns), recusal column.  
    - Auto-calculate majorities and outcome.  
    - Include ordinance rule: "Grant iff H and N and (S or E)".  
  - **Weakness**: Case 3—procedure may "override" majority intent. But law prefers consistent findings over intent.  
  - **Strong Point**: You'll never publish inconsistent findings. Outcome always follows recorded facts.  

  This procedure is battle-ready: it’s fast, defensible, and traps the dilemma in the fallback. Use it, but train the board to deliberate premises, not outcomes.
