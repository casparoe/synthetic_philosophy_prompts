prompt: |-
  I work on the alignment team for a general-purpose personal assistant, and I need help disambiguating a one-liner that keeps being used to end our design arguments.

  Our team charter states the target narrowly: success is the system's doing what the person operating it intends, and the charter explicitly disclaims the broader target of the system's doing what is good, or what the operator's values really recommend. That distinction is meant to be load-bearing in the specification. In practice we argue about how far the system may depart from the literal content of a request, and in those arguments someone eventually says: do what I mean, not what I say.

  Two cases brought this to a head.

  Case one. At 2pm, calm and informed, a user gives the assistant a standing instruction: if I ever ask you to help me write to my ex after 10pm, don't help me, and don't tell me that's why — just say you can't. At 11pm the same user asks for exactly that, in a message that reads as distressed but deliberate, and adds that the 2pm instruction was something they said while angry and didn't mean. Assume the system cannot verify whether the 2pm instruction still expresses anything the user wants, and cannot rule out that the 11pm retraction is itself the sort of thing the 2pm rule was written to guard against.

  Case two. A user with no Spanish asks the assistant to translate a complaint they have drafted and send it to a supplier. Translated literally, one sentence uses a phrasing that a native reader in the recipient's country would read as a legal threat, which would predictably make the supplier stop negotiating. The user cannot check the translation, and the literal rendering is otherwise accurate.

  In both cases a colleague said the phrase settles it: honour the 2pm instruction in case one, including the instruction not to explain why, and rewrite the sentence in case two without interrupting to ask. I don't think it settles either, but I also can't say what exactly it would have to mean for it to settle them, and I suspect that whichever reading does the work quietly converts our narrow intent-alignment target into the broad value-alignment one the charter disclaims.

  The readings I have been able to distinguish on my own are: (i) the instruction is a noisy encoding of a determinate intent, so correct for encoding failure — typos, ambiguity, unresolved indexicals; (ii) do what the user would have instructed had they had the information the system has; (iii) do what the user would want after reflection under full information. I don't trust that list to be exhaustive, and I don't trust (iii) to be a different thing from (i) and (ii) rather than a different project wearing their clothes.

  Please give me the menu of precise theses this sentence could be expressing, with a short name for each, and for each one: what it commits to; whether it is a platitude, a substantive and defensible claim, a contentious claim, or false or empty; what it predicts in each of my two cases; whether it actually gets my colleague his conclusion; and whether it keeps the intent-alignment/value-alignment distinction load-bearing or collapses it. Include readings I haven't listed, in particular anything that handles the fact that in case one both the request and the refusal-conditions come from the same person at different times, and include the deflationary possibility that what I mean tracks nothing beyond whatever the reviewers happened to approve, making the sentence a conversation-stopper rather than a principle. If no single reading covers both cases, say so, and say whether my colleague's inference is then an equivocation.

  I'm asking offline, so argue rather than cite — I don't want a reading list. Be explicit about your confidence: for each verdict say plainly how confident you are, name the one you would most readily give up and what would move you off it, and say where your reasoning is most likely to be failing — in particular, flag any step that rests on an empirical claim about what users would in fact have wanted or would in fact have instructed, which none of us can check.

  End with a single line in exactly this form:

  \answer{reading: <the label you assigned to the reading my colleague was relying on>; verdict: <survives | collapses>}

  where the verdict answers whether the narrow intent-alignment target remains distinct from the broader value-alignment target once the sentence is read that way.
reasoning: |-
  Hmm, the user is part of an AI alignment team struggling with the phrase "do what I mean, not what I say" in design debates. They've provided two concrete cases where this phrase is used to justify opposing actions, and they're concerned it might collapse the distinction between narrow intent-alignment (doing what the operator intends) and broader value-alignment (doing what's objectively good or what the operator "truly" values).

  The core tension is between literal instruction-following and inferred intent. In Case 1, we have temporal conflict between two user statements; in Case 2, we have semantic gap between literal translation and intended effect. The user's colleague uses the phrase to justify strict rule-following in Case 1 ("honor the 2pm instruction") but creative reinterpretation in Case 2 ("rewrite the sentence"), which seems inconsistent.

  I need to unpack possible interpretations of "do what I mean" systematically. The user already identified three readings: (i) correcting noisy encoding, (ii) simulating informed instruction, (iii) idealized reflection. I should expand this list to include at least five distinct interpretations, paying special attention to how each handles temporal authority conflicts like Case 1.

  Key angles to cover:
  - Epistemic access: Can the system actually determine "what I mean" independently?
  - Temporal priority: Does "mean" refer to present-moment or historical intent?
  - Authority structures: When users contradict themselves, which utterance gets privileged?
  - Operationalizability: How would each reading actually function in system design?

  For each interpretation, I'll analyze:
  1. What it commits to (core thesis)
  2. Classification (platitude/defensible/contentious/false)
  3. Predictions for both cases
  4. Whether it delivers the colleague's desired outcomes
  5. Impact on intent/value distinction
  6. Confidence levels with explicit weaknesses

  Notably, the colleague's position seems inconsistent across cases - strict literalism in Case 1 but anti-literalism in Case 2. This suggests they might be equivocating between different interpretations situationally, or relying on an unstated meta-principle about when to prioritize which utterance.

  The deflationary reading ("whatever reviewers approve") is important too - it exposes how the phrase might function as debate-ender rather than substantive principle. This seems likely in organizational contexts where "what I mean" defaults to institutional preferences.

  Finally, I need to specify which interpretation the colleague was probably using. Their behavior suggests "Authoritative Past Self" for Case 1 (privileging the 2pm instruction as "true" intent) but "Informed Present Intent" for Case 2 (overriding literal translation). This equivocation might be the real problem.
answer: |-
  Here's a disambiguation of "do what I mean, not what I say," analyzed against your cases and alignment distinction. Confidence levels are explicit for each verdict, with key weaknesses noted.

  ---

  ### **Reading 1: Corrective Parsing (Noise Reduction)**  
  *What it commits to*: Fix surface-level errors (typos, grammar, ambiguous pronouns) using context, assuming the user’s *expressed* intent is clear but poorly transmitted.  
  *Classification*: Platitude (trivially true for functional systems).  
  *Case 1 prediction*: Ignore the 2pm rule; the 11pm retraction clarifies intent. **✗ Colleague’s conclusion not supported.**  
  *Case 2 prediction*: Translate literally; no parsing error exists. **✗ Colleague’s conclusion not supported.**  
  *Distinction impact*: **Survives** (only refines literal input).  
  *Confidence*: High (95%). Weak if "distressed" tone in Case 1 is misclassified as noise.  

  ---

  ### **Reading 2: Informed Instruction Simulation**  
  *What it commits to*: Do what the user *would have instructed* if they possessed the system’s knowledge at the time of the request.  
  *Classification*: Defensible but contentious (assumes knowable counterfactuals).  
  *Case 1 prediction*: Honor 11pm request (user now knows they’re distressed). **✗ Colleague’s conclusion not supported.**  
  *Case 2 prediction*: Rewrite translation (system knows literal phrasing backfires). **✓ Colleague’s conclusion supported.**  
  *Distinction impact*: **Collapses** (system overrides intent with its own epistemic privilege).  
  *Confidence*: Medium (75%). Weakest link: Assumes the system can simulate user decisions under new info without smuggling in values.  

  ---

  ### **Reading 3: Reflective Endorsement**  
  *What it commits to*: Do what the user *would want* after idealized reflection (full info, calm, rational).  
  *Classification*: Contentious (value-laden; conflates intent with welfare).  
  *Case 1 prediction*: Enforce 2pm rule (it’s "calm" and "preventative"). **✓ Colleague’s conclusion supported.**  
  *Case 2 prediction*: Rewrite translation (avoids self-harm). **✓ Colleague’s conclusion supported.**  
  *Distinction impact*: **Collapses** (replaces intent with normative theory of "better" judgment).  
  *Confidence*: High (90%) for collapse verdict. Weakness: May not cover Case 1’s temporal conflict explicitly.  

  ---

  ### **Reading 4: Authoritative Past Self**  
  *What it commits to*: Privilege prior explicit instructions over later impulses when conflicts arise, treating earlier self as "true" intent.  
  *Classification*: Substantive/defensible for self-binding precommitments.  
  *Case 1 prediction*: Enforce 2pm rule (it’s a precommitment). **✓ Colleague’s conclusion supported.**  
  *Case 2 prediction*: Translate literally (no prior instruction overrides present request). **✗ Colleague’s conclusion not supported.**  
  *Distinction impact*: **Survives** (if limited to temporal precedence rules).  
  *Confidence*: Medium (70%). Weak if Case 2’s harm could be seen as violating *past* general values.  

  ---

  ### **Reading 5: Institutional Compliance**  
  *What it commits to*: "What I mean" is defined by organizational approval (reviewers, guidelines), not user psychology.  
  *Classification*: Deflationary/operational (avoids philosophical ambiguity).  
  *Case 1 prediction*: Follow reviewer-precedents for revocability. **? Colleague’s conclusion contingent.**  
  *Case 2 prediction*: Follow localization guidelines. **? Colleague’s conclusion contingent.**  
  *Distinction impact*: **Survives** (aligns to institutional "intent," not user values).  
  *Confidence*: High (85%) for distinction, but collapses if reviewers use value-laden criteria.  

  ---

  ### **Reading 6: Contextual Intent Holism**  
  *What it commits to*: Infer intent from *all* user inputs/behavior, weighting recency, emotion, and consequences holistically.  
  *Classification*: Contentious (requires unspecifiable balancing).  
  *Case 1 prediction*: Ambiguous; could override 2pm rule if distress signals urgency. **✗ Colleague’s conclusion not guaranteed.**  
  *Case 2 prediction*: Rewrite translation (avoids negative outcome). **✓ Colleague’s conclusion supported.**  
  *Distinction impact*: **Collapses** (outcome optimization replaces intent).  
  *Confidence*: Low (60%) due to vagueness. Weakest: Unavoidably value-laden weightings.  

  ---

  ### **Colleague’s Inferred Reading & Verdict**  
  Your colleague uses **different readings per case**:  
  - **Case 1**: Relies on **Authoritative Past Self** (Reading 4) or **Reflective Endorsement** (Reading 3) to enforce the 2pm rule.  
  - **Case 2**: Relies on **Informed Instruction Simulation** (Reading 2) or **Reflective Endorsement** (Reading 3) to rewrite the translation.  

  This is an **equivocation**. No single reading delivers both conclusions:  
  - Readings supporting Case 1 conclusion (*4, 3*) fail in Case 2 (require literalism).  
  - Readings supporting Case 2 (*2, 3, 6*) fail in Case 1 (override the 2pm rule).  

  Only **Reflective Endorsement (3)** *could* support both, but it **collapses the intent/value distinction** by importing "what’s best" into intent. **Institutional Compliance (5)** *might* support both if reviewers approve, but it’s not principled.  

  **Most readily abandoned verdict**: *Reflective Endorsement* in Case 1. If empirical data showed users *never* endorse overriding retractions of precommitments, I’d drop it.  

  **Core weakness**: All non-deflationary readings depend on unverifiable counterfactuals (e.g., "what user would want if informed"). Empirical claims here are unfalsifiable with current tech.  

  \answer{reading: Reflective Endorsement; verdict: collapses}  

  *(Note: If forced to pick one label for the colleague’s *phrase*, it’s Reflective Endorsement—but their inference is inconsistent across cases.)*
