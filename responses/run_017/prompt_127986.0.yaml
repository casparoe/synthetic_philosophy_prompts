  This is quite a sophisticated request. The user clearly has a strong background in philosophy given their references to Gettier cases, zombies, teleporters, and moral psychology vignettes. They're asking for a framework to distinguish between valid evidential use of thought experiments and cases where intuitions are manipulated through presentation rather than substance.

  Key things they want me to address:
  - Which standard demands are genuine requirements versus mere preferences
  - Which desiderata conflict with each other (like spareness vs ecological richness)
  - The single most exclusionary requirement that would disqualify most thought experiments
  - How to handle specific failure modes like idle wheels, shadow cases, modal gaps, and borrowed intensity
  - An "export clause" requirement about what would change the verdict
  - Application to their two nurse case examples
  - Brief evaluation of three types of thought experiments

  For the desiderata, I need to take a stand on controversial points like:
  - Whether stability across populations is essential or just a survey preference
  - Whether realism is required or optional
  - Whether specialist intuitions matter more than lay ones

  The spareness vs ecological richness conflict seems genuine to me - minimal cases risk being too artificial while rich ones risk introducing confounding variables.

  For failure modes:
  - Idle wheels seem valid - decorative details that sway feelings without affecting the core argument
  - Shadow cases are important - where intuitions come from unstated similar scenarios
  - Modal gaps are crucial - impossible premises undermining conclusions
  - Borrowed intensity is real - emotional language manipulating responses

  The export clause feels necessary - good thought experiments should specify what would change the verdict.

  For their nurse cases (A and B), I need to determine whether the different outcomes (alert switched off vs never installed) should produce different verdicts under my criteria. This might reveal if blame is being "pumped" rather than properly argued.

  Finally, I'll need to briefly evaluate three styles: analytic (like Gettier), science-fiction (like zombies), and realistic vignettes (like trolley problems). And identify the most exclusionary requirement.

  I'll structure this with a clear desiderata table in prose, address their specific questions, apply to the cases, and end with the most exclusionary requirement in an \answer{} box. British English throughout as requested.
answer: |-
  Here is a specification for evaluating the evidential competence of a thought experiment ("intuition pump"). It focuses on whether the case genuinely delivers *evidence* about the target concept or phenomenon, rather than merely persuades through rhetorical force or exploits cognitive biases. The criteria are framed as necessary conditions for evidential work.

  ### Desiderata for Evidential Competence: The Phenomena to Catch & Failure Modes to Flag
  | Desideratum                              | What it Catches/Why it Matters                                                                                              | Failure Mode Addressed                                                                 |
  | :--------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------- |
  | **1. Verdict Stability (Minimal)**       | Intuitions must be *replicable* under minor, non-substantive variations (phrasing, order). Flakiness suggests affect/context, not concept. | Unstable verdicts under rephrasing; susceptibility to framing effects.                |
  | **2. Premise Coherence**                 | The scenario must be *conceptually/metaphysically possible* without hidden contradictions. Impossible asks corrupt intuition. | **Modal Gap**: Leaning on incoherence for the 'pull' (e.g., imagining square circles). |
  | **3. Load-Bearing Specificity**          | The critical variable(s) must be *identifiable and isolatable*. Details must be shown to affect the verdict if claimed.      | **Idle Wheel**: Ornamental details swaying feeling; **Borrowed Intensity**: Swapping affect-laden terms doing the work. |
  | **4. Competence Engagement**             | The scenario must engage the *relevant cognitive faculty* (e.g., moral judgment, concept application) without distorting overload. | Artificiality bypassing competence; guessing at incoherent/alien situations.           |
  | **5. Shadow Case Exclusion**             | The intuition must demonstrably track *this specific case*, not a structurally similar but distinct case with stronger affect. | **Shadow Case**: Intuition smuggled in from an unstated, emotionally charged analogue. |
  | **6. Export Clause (Specified Rebuttal)**| Must state *in advance* what evidence/scenario changes would alter the verdict. Shows argument structure, not just pumping. | Vagueness on what counts against the intuition; unfalsifiability of the pump.          |
  | **7. Target Concept Fidelity**           | The intuition elicited must be *about the concept/phenomenon under investigation*, not a proxy, confound, or irrelevant feature. | Mistaking intuition about the *scenario description* for intuition about the *target concept*. |

  ### Taking Stands on Controversies
  *   **Stability (Across Populations/Phrasings):** A **genuine desideratum (minimal version)**. While *universal* stability is unrealistic (cultural/ideological differences exist), instability under *minor, non-substantive* rephrasings or ordering strongly indicates the intuition is driven by presentation, framing, or irrelevant contextual factors, not the core conceptual structure. This is about robustness, not universal consensus. (The survey camp identifies a real vulnerability).
  *   **Realism:** **Not a strict requirement, but constrained by Competence Engagement & Premise Coherence.** Extreme unrealism (violating known physics/concepts) risks failing Premise Coherence or Competence Engagement. However, *relevant* idealisation (e.g., frictionless planes in physics) is essential for Load-Bearing Specificity. The key is whether the unrealism *distorts the faculty being engaged* or creates a *Modal Gap*. "Realistic enough to engage the relevant competence" is the standard.
  *   **Specialist Intuitions:** **Primarily Special Pleading, *unless* tied to Competence Engagement.** Lay intuitions *are* the data for many conceptual analyses (e.g., knowledge, causation). Demanding specialist agreement often masks dismissing inconvenient data. However, if the thought experiment targets a highly technical concept *only* specialists possess (e.g., quantum decoherence), then specialist competence matters. For most philosophical concepts (morality, mind, knowledge), lay competence is relevant.

  ### The Core Tension
  *   **Spareness vs. Ecological Richness:** This is **the genuine, central tension**.
      *   *Spareness* (minimalism) is crucial for **Load-Bearing Specificity** – isolating variables to see what *actually* does the work.
      *   *Ecological Richness* (texture) is crucial for **Competence Engagement** – ensuring our evolved or learned faculties are operating in a mode recognisable to their normal function, not guessing in an alien void.
      *   **Why it's fundamental:** Too spare, and the intuition might be an artefact of the stripped-down context, failing Competence Engagement. Too rich, and you can't tell which details are Load-Bearing, inviting Idle Wheels and Shadow Cases. A competent pump *balances* these, using only the richness *necessary* for engagement while ensuring everything else is demonstrably non-Load-Bearing or controlled.

  ### The Most Exclusionary Requirement
  *   **Premise Coherence** does the **most exclusionary work**. Many popular pumps (especially in metaphysics/ethics – zombies, teletransporters, trolley variations) rely on asking us to conceive scenarios that may involve hidden contradictions or radical metaphysical impossibilities. If the scenario is incoherent (a Modal Gap), any intuition drawn from "considering" it is fundamentally suspect – we aren't genuinely intuiting about the target concept, but wrestling with (or being misled by) the impossibility itself. Enforcing this rigorously invalidates a vast swathe of ambitious thought experiments.

  ### Applying to Your Cases (A & B)
  *   Under this specification, a **difference in verdict between A and B is permissible *only* if it can be justified by a relevant difference captured in the desiderata.**
  *   **Analysis:**
      *   Premise Coherence: Both are coherent.
      *   Load-Bearing Specificity: The difference is the *cause* of the missing alert (active deactivation vs. absence by omission). Is this difference Load-Bearing for the target concept (e.g., negligence, responsibility, 'letting die')?
      *   Competence Engagement: Both engage ordinary moral/legal intuitions about negligence.
      *   Shadow Case: Does verdict A rely on a shadow case of "tampering" or "active disabling"? Does verdict B rely on a shadow case of "institutional neglect"?
      *   Target Concept Fidelity: Is the intuition *about* the nurse's culpability *given her knowledge and situation*, or is it influenced by feelings about contractors/hospital management (which should be controlled for)?
      *   Export Clause: What *would* change the verdict? E.g., if the nurse *knew* the alert was off/missing? If the contractor was malicious?
  *   **Conclusion:** The specification does *not* inherently demand identical verdicts. **A difference is legitimate IF:** The differing cause (deactivation vs. absence) can be shown to be a Load-Bearing variable for the specific concept of culpability under investigation (e.g., perhaps relating to *reasonable expectation* or *counterfactual dependence*), *and* this survives scrutiny for Shadow Cases/Borrowed Intensity. **A difference is problematic IF:** The verdict shift relies on unstated Shadow Cases ("tampering is worse!"), Borrowed Intensity ("*switched off* sounds more active/violating"), or Idle Wheels not shown to be Load-Bearing. The pump must *argue* why *this* variable matters for *this* concept. If the difference *is* Load-Bearing, it's evidence; if it's just pumping affect, it's rhetoric.

  ### Scorecard on Styles
  *   **Spare Analytic (Gettier):** Excels at Load-Bearing Specificity & Verdict Stability (minimal). Often weak on Competence Engagement (overly artificial?) & Ecological Richness. Vulnerable if Premise Coherence questioned (JTB analysis itself).
  *   **Escalating Sci-Fi (Zombies/Teleporters):** Often strong on isolating variables (Spareness in intent). Routinely fails **Premise Coherence** (Modal Gap - is conceivability possible?) & **Competence Engagement** (can we *really* judge consciousness in such alien scenarios?). High risk of Shadow Cases.
  *   **Realistic Vignettes (Moral Psych):** Excels at Competence Engagement & Ecological Richness. Vulnerable to Idle Wheels, Borrowed Intensity, Shadow Cases, and poor Load-Bearing Specificity. Verdict Stability often surprisingly low.

  \answer{Premise Coherence}
