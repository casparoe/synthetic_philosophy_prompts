prompt: |-
  I am revising the chapter on the fact–value distinction in a handbook of argument analysis for policy professionals, and I want the statement of the is–ought gap to be one a reader could actually apply. The version I have been working with is syntactic: classify every atomic claim in an argument as descriptive or normative, and treat any inference step as illegitimate if none of its premises is normative while its conclusion is. Three difficulties have made me doubt this formulation, and I would like to know which of the diagnoses I can see is the right one, or whether the formulation should be abandoned.

  First, the apparent counterexamples. A duty engineer wants the substation not to flood, and pumping the sump is the only means available to her of preventing it; so she ought to pump the sump. No premise contains "ought," "good," "bad," "reason," or "should," and yet the reasoning strikes me as impeccable. Either Hume's law is false, or instrumental reasoning is a recognised exception to it, and I cannot tell which — though the difference clearly matters for what I tell my readers.

  Second, the cases where the norm seems already to be inside the descriptive-looking premise. N promised the Board she would keep the records dry; so N ought to keep the records dry. If promising is the sort of thing that binds, the "ought" is packed into the first premise rather than produced by the step, and then whether my rule flags an argument depends only on where the norm is parked, which cannot be a real difference. A student of mine has also pointed out that from "the gauge reads four metres" one may validly infer "the gauge reads four metres or the Board ought to resign," which my rule flags as well, and which surely cannot be what anyone meant to prohibit.

  Third, if I retreat to the safer claim that a normative conclusion requires a normative premise somewhere, the thesis begins to look like mere bookkeeping: any argument can be made to satisfy it simply by making the normative premise explicit, and nothing follows about whether the argument is any good. Yet the gap is standardly treated as a deep thesis about the autonomy of ethics, which suggests that in retreating I have lost whatever content it had.

  So, as I see it, I have three options: (a) the law, stated syntactically, has counterexamples and should be given up; (b) it survives only because "descriptive" and "normative" are defined so that any premise from which an "ought" follows counts as normative, which makes it circular and unfalsifiable; or (c) what I have been calling the is–ought gap is really only the naturalistic fallacy — the prohibition on analysing "good" as some natural property — and has nothing to say about inference at all.

  Which of these is correct, and is there a fourth option I am missing? If the answer is (b), what exactly is the non-trivial claim, what sort of argument would violate it that I would otherwise have been willing to accept, and what would count as successfully bridging the gap rather than merely relabelling a premise as normative? Finally: is the naturalistic fallacy the same thesis as the is–ought gap, a consequence of it, or a separate doctrine that I have been conflating with it?
reasoning: |-
  Okay, let me start by understanding the user's problem. They're revising a chapter on the fact-value distinction for policy professionals. They have a syntactic rule for the is-ought gap: if an inference step has only descriptive premises and a normative conclusion, it's invalid. But they're facing three difficulties: apparent counterexamples, norm-packed premises, and the triviality issue when retreating to requiring any normative premise.

  First, the duty engineer example. Descriptive premises about preventing flooding and pumping being the only means lead to "ought to pump." No obvious normative terms, yet it seems valid. Is this a counterexample? Hume's Law must account for instrumental reasoning. The user is confused about whether Hume's Law is false or if there's an exception. I need to clarify how instrumental norms work here.

  Next, the promise example. "N promised" implies "N ought." If promising inherently has normative force, the "ought" is in the premise. Then the syntactic rule might not flag it, but that depends on how we define descriptive vs. normative. Also, the disjunction case: from a descriptive claim to a disjunction with a normative part. Logically valid but flagged by the rule, which isn't helpful. This shows the syntactic approach might be too rigid.

  Third, if they require any normative premise, the rule becomes trivial. Adding a premise like "one ought to prevent flooding" makes the engineer's argument valid. But then the is-ought gap loses its depth. The user worries that the gap's significance is lost. They mention the naturalistic fallacy possibly being conflated with the gap. Need to distinguish these concepts.

  The user proposes three options: (a) abandon the syntactic law, (b) it's circular, or (c) it's actually the naturalistic fallacy. I think the correct path is closer to (b) but with nuance. The key is recognizing that some descriptive premises contain implicit norms, like instrumental or institutional facts. The syntactic rule needs semantic grounding. 

  For policy professionals, they need a practical approach. Classifying premises as descriptive or normative isn't just about surface syntax. Institutional facts (like promises) bridge the gap because they have built-in norms. The user should redefine the rule to allow such premises. Also, explain that the gap warns against deriving norms from pure natural facts without any normative element. Highlighting the naturalistic fallacy as a separate but related issue is important. Moore's fallacy is about defining "good," while the is-ought gap is about inference. They're distinct but connected.

  The user's deeper need is to provide actionable advice for analyzing arguments. They need clarity on when an inference is legitimate and how to identify implicit norms. Addressing the counterexamples by explaining instrumental and institutional contexts can help. Emphasizing premise classification based on content, not just wording, and the necessity of at least one genuinely normative premise will make the chapter useful.
answer: |-
  Your doubts are astute and highlight why a purely syntactic approach to the is-ought gap is inadequate for applied argument analysis. Option (b) is closest to the truth, but requires refinement. Option (a) is too strong, and option (c) conflates distinct (though related) doctrines. Here's a breakdown:

  1.  **Diagnosing the Difficulties:**
      *   **Instrumental Reasoning (Duty Engineer):** This *doesn't* falsify Hume's Law. The inference relies on an *implicit normative principle*: "If one wants an end, and a specific action is the only necessary means to achieve that end, then one ought (instrumentally) to perform that action." This principle is normative. Your syntactic rule misses it because it's unstated. The reasoning isn't deriving `ought` from pure `is`; it's deriving a *specific* `ought` from a *general* normative principle plus descriptive facts.
      *   **Norm-Packed Premises (Promise):** You've hit the nail on the head. "N promised" isn't a *purely* descriptive claim in the relevant sense. It's an *institutional fact* – a fact constituted by normative rules (the norms of promising). The "ought" is logically contained within the concept of a promise. Syntactic classification fails here because it can't distinguish surface grammar from logical content. Classifying "N promised" as descriptive hides its normative force; classifying it as normative makes the inference trivial.
      *   **Triviality & Bookkeeping:** This is the major pitfall of the purely syntactic "requirement" version. Adding a trivial normative premise ("One ought to do what one has promised," "One ought to prevent flooding if it's the only way") *does* satisfy the letter of the rule but renders it vacuous. The *substantive* point of the is-ought gap is lost.

  2.  **The Correct Path: Refining Option (b) - Beyond Syntax to Semantics & Content:**
      *   **The Non-Trivial Core:** Hume's insight wasn't primarily about syntax, but about *logical entailment* and *ontological distinctness*. The non-trivial claim is: **No set of *purely non-normative* premises (premises making no reference, explicit or implicit, to values, norms, reasons, obligations, goods, etc.) can *logically entail* a genuinely normative conclusion.** The gap is between the *domain of what is* (facts about the natural world, devoid of normativity) and the *domain of what ought to be* (values, obligations, reasons).
      *   **What Violates It?** An argument would violate this substantive version if it purported to derive a genuine `ought` (e.g., "You should donate to charity," "Lying is wrong") *solely* from premises describing physical states, biological functions, psychological states (like desires, *unless* coupled with a normative principle about desires), historical events, or social statistics, *without* any premise invoking a norm, value, reason, goal, standard, or institutional rule that *itself* has normative force.
          *   *Counterexample that Violates:* "Many people find lying convenient (fact). Lying sometimes increases evolutionary fitness (fact). Therefore, lying is morally permissible (normative conclusion)." This attempts to derive `ought` from `is` alone. The premises lack any normative anchor.
          *   *What Doesn't Violate (Properly Understood):*
              *   The Duty Engineer: Relies on the implicit instrumental norm.
              *   The Promise: Relies on the normative structure of promising.
              *   Disjunction ("Gauge reads four meters OR Board ought to resign"): This is valid *logically* but trivial. The normative disjunct isn't *entailed* by the descriptive premise; it's just added. It doesn't genuinely bridge the gap to derive a substantive normative claim. Your rule flags it, but it's not the *kind* of illegitimate normative leap Hume was concerned with. It's a red herring for the substantive gap.
      *   **Bridging the Gap (Non-Trivially):** Successfully bridging the gap requires introducing a premise that is *genuinely normative* in content, not just relabeled. This normative premise provides the necessary link:
          *   An explicit value judgment ("Human flourishing is good").
          *   An explicit moral principle ("Promises ought to be kept").
          *   An explicit instrumental principle ("If you want E, and M is the only means to E, you ought to do M").
          *   Invoking an institutional rule *with recognized normative force* ("In role R, one has duty D").
          *   The key is that this premise *itself* cannot be derived solely from non-normative facts without begging the question. It must be argued for on normative grounds, accepted as axiomatic within a framework, or grounded in a practice whose norms are acknowledged.

  3.  **Naturalistic Fallacy vs. Is-Ought Gap:**
      *   **Naturalistic Fallacy (G.E. Moore):** Primarily an *analytical* or *definitional* claim. It asserts that fundamental ethical terms like "good" *cannot be defined* solely in terms of natural properties (like "pleasure," "desired," "evolutionarily successful"). To define "good" as "pleasure" is to commit this fallacy. It's about the *meaning* of ethical terms, not directly about inference.
      *   **Is-Ought Gap (Hume):** Primarily a *logical* or *inferential* claim. It asserts that normative conclusions *cannot be logically deduced* solely from non-normative premises.
      *   **Relationship:** They are distinct but closely related doctrines defending the autonomy of ethics.
          *   The Is-Ought Gap is a *consequence* of the kind of conceptual distinctness posited by the Naturalistic Fallacy. If "good" (or "ought") isn't *defined by* natural properties, it's hard to see how natural properties alone could *entail* it.
          *   However, one could potentially accept the Is-Ought Gap (deny entailment) without fully accepting Moore's specific open-question argument against defining "good" naturalistically. Conversely, Moore's fallacy focuses on definition, while Hume's gap focuses on inference.
          *   **They are not the same thesis.** You should treat them as distinct but complementary pillars of the fact-value distinction.

  **Recommendations for Your Handbook:**

  1.  **Abandon the Purely Syntactic Rule:** It's too crude and leads to the problems you identified (missing implicit norms, flagging trivial disjunctions, allowing vacuous compliance).
  2.  **Adopt a Content-Based Formulation:** Frame the is-ought gap for policy professionals as:
      > **"An argument cannot validly derive a substantive conclusion about what *ought* to be done, what is *good* or *bad*, or what there is *reason* to do, solely from premises that describe only *what is* the case (facts about the world, including physical states, events, behaviors, or even psychological states like desires, *unless* those descriptions inherently involve recognized norms or values). To justify a normative conclusion, at least one premise must itself be genuinely normative, expressing a value, principle, goal, obligation, or institutional rule with normative force."**
  3.  **Address Counterexamples Explicitly:**
      *   **Instrumental Reasoning:** Explain it relies on an implicit normative principle of instrumental rationality. Making this principle explicit satisfies the gap requirement non-trivially.
      *   **Institutional Facts (Promises, Roles):** Explain that claims like "N promised" or "X is the duty of role R" are *not* purely descriptive. They are facts *constituted by* normative rules. Treating them as descriptive premises hides their normative core. They *can* legitimately support normative conclusions because they *contain* normative content.
      *   **Trivial Compliance:** Emphasize that simply adding a trivial normative premise ("One ought to do what one has promised") doesn't *justify* the conclusion; it just makes the inference formally valid. The *substantive work* lies in defending the normative premise itself, which requires normative argumentation.
  4.  **Clarify the Naturalistic Fallacy:** Briefly distinguish it as the error of *defining* fundamental ethical terms solely by natural properties, linking it to the is-ought gap as a related defense of ethical autonomy, but emphasizing their distinct focuses (definition vs. inference).
  5.  **Focus on Application:** For policy professionals, the key takeaway isn't a rigid rule but a critical lens:
      *   **Identify Normative Conclusions:** What specific "should," "ought," "good," "bad," "right," "wrong," "reason" is being claimed?
      *   **Scrutinize Premises:** Are *all* premises purely descriptive (world-states, events, stats, desires)? If yes, the argument is invalid for the normative conclusion. If a premise seems descriptive but supports a normative leap (like "promised," "is the engineer," "is the only way"), ask: *Does this premise implicitly rely on a norm?* If so, that norm needs to be acknowledged and potentially defended.
      *   **Demand Normative Premises:** Locate the explicit or implicit normative premise(s) bridging the gap. Evaluate *that premise* critically – is it justified, appropriate, shared, or contested?

  By shifting from syntax to the *content* and *logical role* of premises, and acknowledging the normative force embedded in concepts like promises, roles, and instrumental reasoning, you preserve the substantive core of Hume's insight – the impossibility of deriving genuine obligation from pure description alone – while providing policy analysts with a usable, non-trivial tool for dissecting arguments.
