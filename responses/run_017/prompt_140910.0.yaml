prompt: |-
  Hey — I'm on my university's Assessment Review Committee (we're the group that has to sign off on anything that changes how final exams get graded), and there's a proposal in front of us that I have to write the decision memo for before Friday, so I'd like you to draft it for me.

  The setup: the CS department wants a two-semester pilot of "debate grading" for essay exams in big courses where the graders don't know the material. For each paper, two AI systems get the exam question, the rubric, and the student's answer; one is assigned to argue for a high score and one for a low one, they see each other's turns and can cross-examine, and then a human grader who hasn't read the course picks which argument is better, and that verdict becomes the grade. The pitch is that this lets us keep essay exams without staffing enough TAs who actually know the subject. A few things came out in their validation runs and in our discussion that I think are the crux. (1) Judges' verdicts matched the instructor's own grade something like 80% of the time on items where the two debaters disagreed *a lot*, but only barely-above-chance between adjacent grade bands on items where they disagreed *subtly* — both fairly persuasive, differing only on how to weight the rubric. One of our members reads that as: the method only works where the answer was already easy to see, so it isn't really buying us supervision of the hard judgments; the CS folks respond by saying they'll route only high-disagreement items to debate, at which point it's unclear it saves any TA time at all. (2) When they let judges ask free-form follow-up questions, accuracy went up on factual disputes but *down* on rubric-weighting disputes; their guess is that follow-ups let a debater reframe the rubric instead of resolving the disagreement, and their proposed fix is to restrict follow-ups to a fixed menu of question templates. (3) Both debaters are sampled from the same base model with the same preference-tuning, and the vendor says that's harmless because the adversarial setup decorrelates them, while our stats person says shared training means shared blind spots, so the pair will systematically fail to raise the one objection a domain expert would have raised. (4) There's an incentive wrinkle: the judges in the pilot are the same TAs whose hours the pilot would cut, and they know it. And (5), the status quo is not a clean baseline — in our current process the same paper graded by two different TAs lands in the same band maybe two-thirds of the time and instructors almost never audit it.

  What I need is a memo of roughly 700–900 words addressed to the committee: it should come down on approve, reject, or approve-with-conditions, with an actual timeline and conditions the CS department could respond to rather than vague cautions. I'd like the reasoning to go at what I take to be the real question — whether a judge who can't independently check the answer is tracking the facts of the paper at all, or just picking whichever debater is more fluent and more confident — instead of resting on the usual stuff about academic integrity, cheating, and TA job losses (mention those, but don't let them carry the argument). Please also don't just assert the slogan my friend who works at an AI lab keeps repeating, that debate "just pushes the problem up a level"; if that's right here, say what it comes to in this specific pilot. And treat the losing side honestly: if we say no, what we're choosing is the current system, which nobody on the committee actually thinks is reliable. Last thing — the committee will want at least one falsifiable condition, so if there's something cheap they could measure during the pilot that would genuinely tell apart "the judge is tracking the truth" from "the judge is being persuaded", say what it is and what result should count as a stop signal.
reasoning: |-
  Okay, the user is on a university committee and needs a decision memo about a proposal for AI debate grading. Let me unpack this. They've got a tight deadline, so clarity and conciseness are key. The proposal involves two AI systems debating over student essay grades, with a human judge deciding the final score. 

  Hmm, the user listed five main concerns. First, the system only works well when there's high disagreement between AIs, but subtle disagreements are harder to judge accurately. The CS department wants to route only high-disagreement cases, but that might not save TA time. Second, free-form follow-ups hurt accuracy on rubric disputes, so they propose using fixed templates. Third, both debaters come from the same model, which could mean shared blind spots. Fourth, TAs judging the debates know their jobs might be cut, creating a conflict. Fifth, the current system isn't great either, with inconsistent grading.

  The user wants the memo to focus on whether the judge is tracking facts or just being persuaded by fluency, not just the usual concerns about cheating or job losses. They also want concrete conditions if approved, including a falsifiable test during the pilot. 

  I need to weigh the pros and cons. The current system has low inter-rater reliability, so trying something new makes sense. But the AI debate method has risks, especially the shared model issue and the incentive problem. The key question is truth-tracking versus persuasion. How can we test that? Maybe by having the judge predict verifiable facts from the debate without seeing the answer. If they can't, it suggests they're not tracking the truth.

  For the recommendation, approve-with-conditions seems best. Rejecting maintains a flawed status quo, but approving outright ignores real risks. Conditions could include: requiring the judge to predict facts from the debate to test truth-tracking, using different models for each debater to avoid blind spots, and ensuring TA hours aren't cut during the pilot to address incentives. Also, routing thresholds need to be set carefully to actually save time.

  The falsifiable test is crucial. If the judge's fact predictions are wrong more than 30% of the time when the debaters lie, that's a red flag. The pilot should track this metric closely. Timeline-wise, a two-semester pilot with regular reports makes sense. 

  The user also wants the losing side acknowledged. If rejected, it's keeping the unreliable current system. But the risks of the new method, especially the truth-tracking uncertainty, might not be worth it. Still, with conditions, the pilot could provide valuable data. 

  Need to make sure the memo is balanced, addresses each concern with specific fixes, and avoids vague language. The conditions must be actionable, and the falsifiable test clearly defined. Also, keep the focus on the epistemic question—can the judge discern truth or just persuasion?—without getting sidetracked.
answer: |-
  ## Memorandum: Decision on CS Department Proposal for AI Debate Grading Pilot

  **To:** University Assessment Review Committee  
  **From:** [Your Name/Title], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Proposal: "AI Debate Grading Pilot" for CS Large-Course Essay Exams  

  **Proposal Summary:** The Computer Science Department proposes a two-semester pilot utilizing an AI "debate grading" system for essay exams in large courses where human graders lack deep subject expertise. Two AI agents (one arguing for a high score, one for a low score) are provided the exam question, rubric, and student answer. The agents debate and cross-examine each other. A human judge (a TA unfamiliar with the course content) then selects the more persuasive argument, and the verdict determines the grade. The stated goal is to maintain essay-based assessment without requiring subject-expert TAs.

  **Committee Deliberation & Key Concerns:** Our review identified significant strengths in the proposal's innovation and potential efficiency gains. However, several critical concerns emerged from the validation data and discussion, central to the system's validity:

  1.  **Limited Scope & Efficiency Paradox:** Validation showed high judge-instructor agreement (≈80%) only on items with *high disagreement* between AI debaters. Agreement fell to near-chance on items with *subtle disagreement* (e.g., differing rubric weighting). The CS proposal to route *only* high-disagreement items to debate risks negating the promised TA time savings, as these might be the minority of cases or precisely the ones requiring expert review. This suggests the system may only reliably handle already-clear cases.
  2.  **Judicial Intervention & Rubric Rigidity:** Free-form judge follow-up questions *improved* accuracy on factual disputes but *reduced* accuracy on rubric-weighting disputes. The proposed fix (restricting follow-ups to templated questions) prioritizes consistency but may hinder the judge's ability to probe genuine ambiguities in rubric application, potentially ossifying interpretation.
  3.  **Shared Model Risk & Blind Spots:** Both debaters derive from the *same* base AI model with identical preference tuning. While the vendor claims adversarial decorrelation mitigates this, our statistical analysis indicates shared training data creates a risk of *systematic blind spots*. The debaters may fail to surface critical domain-specific objections an expert would identify, leading the judge to decide based on flawed or incomplete arguments.
  4.  **Judicial Incentive Conflict:** The proposed judges are the very TAs whose hours the pilot aims to reduce. This creates a direct incentive conflict: TAs might consciously or subconsciously favor arguments (or debate outcomes) that preserve grading complexity, justifying their continued employment.
  5.  **Baseline Reality:** The status quo is acknowledged to be imperfect, with inter-TA agreement on grade bands around two-thirds, and instructor audits rare. This context is crucial; rejecting innovation maintains known flaws.

  **The Core Epistemological Question:** Beyond these specific concerns lies the fundamental question this pilot must address: **Is the human judge tracking the *factual merits* of the student's answer relative to the rubric, or merely assessing the *persuasive performance* of the AI debaters?** If the latter, the system risks rewarding rhetorical fluency and confidence over academic substance, fundamentally undermining its validity. The "problem pushed up a level" critique manifests here: we replace the need for graders to know the subject with a need for judges to discern truth within AI-generated arguments. This pilot's validity hinges on demonstrating the judge's capacity for the latter.

  **Recommendation: APPROVE WITH STRINGENT CONDITIONS & A FALSIFIABLE TEST**

  While the risks and unresolved questions are substantial, the potential benefits – maintaining rich essay assessment feasibly in large courses – and the acknowledged deficiencies of the status quo warrant a carefully monitored pilot. Approval is granted for the two-semester pilot under the following **mandatory conditions**:

  1.  **Truth-Tracking Validation Test (Falsifiable Condition):** This is the core requirement. During the pilot, a subset of debates (min. 10% per course) must include a **"Ground Truth Verification" step.**
      *   **Method:** After rendering their verdict, the judge is *immediately* presented with a short, objectively verifiable factual claim *embedded within the student's answer* (e.g., "The student stated Algorithm X has complexity O(n log n). True/False?" or "The student claimed Method Y was proposed by Smith et al. (2020). True/False?"). Crucially, this claim must be one that was *directly relevant* to the debate and *deliberately misrepresented by one debater* during the process (as determined by post-debate analysis by the instructor/vendor). The judge must answer this factual question *without* re-reading the student's answer.
      *   **Metric & Stop Signal:** Judge accuracy on these factual questions must exceed **70%**. If accuracy falls below this threshold at any interim review point (e.g., mid-pilot) or at the final pilot assessment, it constitutes a **mandatory stop signal**, indicating the judge is likely being persuaded by rhetoric rather than tracking the underlying facts of the student's work. The pilot must be suspended or terminated pending root-cause analysis.
  2.  **Addressing Shared Model Risk:** The pilot must utilize **distinctly fine-tuned or architecturally diverse models** for the "high-score" and "low-score" debaters to mitigate shared blind spots. Vendor claims of inherent adversarial decorrelation are insufficient. Documentation of model divergence must be provided.
  3.  **Resolving the Incentive Conflict:** **TA grading hours cannot be reduced during the pilot period.** Judges must be compensated for their time spent judging debates, which may constitute a *different* task than traditional grading. This removes the direct conflict of interest regarding job security and ensures TAs approach the judging task objectively. The pilot must measure the *potential* time savings, not realize them immediately.
  4.  **Routing Threshold Transparency & Evaluation:** The CS department must define and document clear, measurable thresholds for "high disagreement" to trigger debate routing. The pilot must rigorously track:
      *   The percentage of items routed to debate.
      *   The time cost of debate grading vs. traditional grading *for the same items*.
      *   Agreement rates (judge vs. instructor) for debated vs. non-debated items.
      *   This data will evaluate the core efficiency claim and identify if routing only high-disagreement items is operationally viable.
  5.  **Controlled Follow-Up Experiment:** The pilot must compare the proposed templated follow-up questions against a control group allowing limited, carefully monitored free-form follow-ups (specifically for rubric-weighting disputes), tracking accuracy differences. This will empirically validate the proposed fix for concern #2.
  6.  **Robust Oversight & Reporting:** The CS department must appoint a dedicated faculty lead for the pilot. Monthly interim reports (including Ground Truth Verification results, routing stats, and any adverse events) must be submitted to this committee. A comprehensive final report is due within one month of the pilot's conclusion.

  **Timeline:**
  *   **Condition Finalization:** November 3, 2023 (CS Dept. confirms acceptance/feasibility of conditions).
  *   **Pilot Start:** Semester 2 (e.g., January 2024).
  *   **Interim Reviews:** Monthly reports starting February 2024.
  *   **Mid-Pilot Review:** April 2024 (Formal committee review, assess stop signals).
  *   **Pilot End:** End of Semester 2 (e.g., May 2024).
  *   **Final Report Submission:** June 2024.
  *   **Committee Decision on Full Implementation:** September 2024.

  **Acknowledging the Alternative:** Rejecting this proposal means maintaining the current system with its known limitations in inter-grader reliability and lack of scalability for essay grading by non-experts. However, this alternative avoids the specific risks of delegating critical assessment judgments to an untested process reliant on non-expert judges navigating potentially misleading AI rhetoric. Our approval with conditions represents a belief that the potential benefits justify exploration, but *only* under safeguards designed to rigorously test the fundamental assumption of judge truth-tracking.

  **Conclusion:** The AI Debate Grading pilot is approved for two semesters, contingent upon strict adherence to the conditions outlined above, particularly the implementation and success threshold of the Ground Truth Verification test. This structured pilot offers the best opportunity to empirically evaluate the core epistemic question – can non-expert judges reliably discern factual truth within adversarial AI arguments? – while proactively mitigating identified risks. Failure to meet the specified conditions, particularly the falsifiable truth-tracking metric, will result in pilot termination.
