answer: |-
  Here’s a structured plan for your seminar, designed to preempt misconceptions and build understanding incrementally. The sequence prioritizes conceptual dependencies and addresses your audience’s specific biases.

  ---

  ### **Sequence & Dependency Structure**
  *(90 mins total: 75 mins core, 15 mins Q&A/check)*

  1.  **Groundwork: The Non-Identity Problem (20 mins)**
      *   **Why First?** Essential to break the "patient already exists" frame. Without this, procreative beneficence sounds either like a tautology ("of course we want the best for the child!") or menacing ("you're saying this child *shouldn't exist*").
      *   **How:** Start with a simple case *without* selection. **Case:** "Should parents knowingly conceive a child with a serious genetic condition (e.g., Tay-Sachs) when PGD/IVF is available?" Elicit intuitions about harm/benefit.
      *   **The Hinge:** Introduce the non-identity problem: The child conceived *with* the condition is a *different specific child* than the one conceived *without* it. Therefore, the child with the condition isn't *harmed* by being conceived (they wouldn't exist otherwise), but we might still think choosing to conceive *them* rather than a potential child *without* the condition is the *less good choice* for potential offspring.
      *   **Crucial Output:** Establish the distinction: **Choosing *which possible child* to bring into existence ≠ Treating/Changing *a child who will exist anyway*.** Failure here makes *all* subsequent arguments seem like sophistry justifying harm.

  2.  **Stating Procreative Beneficence (PB) (10 mins)**
      *   **Now Safe to State:** "Where possible (technically feasible, safe, affordable), prospective parents have a significant moral reason to select, from among possible future children they could have, the child expected to have the best life (or at least a life as good as the alternatives), based on the relevant, reliable information available at the time."
      *   **Emphasize:** This is a *reason for action*, not necessarily an absolute duty. It's about comparing *possible future children*. It applies *because* of the non-identity logic established in Step 1.

  3.  **The Core Case Study: "The Height Case" (25 mins)**
      *   **The Case:** A couple using IVF/PGD has 3 viable embryos. Genetic screening (hypothetical, reliable) predicts:
          *   **Embryo A:** Expected adult height ~5'4" (male) / 4'11" (female).
          *   **Embryo B:** Expected adult height ~5'10" (male) / 5'5" (female).
          *   **Embryo C:** Expected adult height ~6'4" (male) / 5'10" (female).
      *   **Key Features & Why:**
          *   **Not a Disease:** Height isn't pathology; avoids clinical reflex.
          *   **Social Contingency & Injustice:** Acknowledge the unfair reality: Taller stature correlates with advantages (income, perceived authority, dating success) in many societies, partly due to bias/unjust norms. *Crucially, the parents cannot single-handedly fix this.*
          *   **Environmental Modulation:** Nutrition matters, but within genetic potential. Selecting B/C isn't *changing* A's environment; it's selecting a child whose potential interacts *differently* with the existing world.
          *   **No Unanimous Ranking:** Parents might reasonably disagree! Parent 1 (value: social ease, career advantage) ranks C > B > A. Parent 2 (value: agility in sports like gymnastics/rock climbing, avoiding back problems, less conspicuousness) ranks A > B > C. B is a "compromise."
          *   **Liberal Context:** Choice is private, parental, non-coercive, no state involvement. Aggregation isn't implied.
      *   **Discussion Prompt:** "Assuming reliable prediction and safe procedure, does PB give the parents a moral reason to select *against* Embryo A? Does it give a stronger reason to select *for* C or A, depending on values? Or is this whole application illegitimate?"
      *   **Your Goal:** Use discussion to tease out if they grasp PB *as applied to non-disease traits* and the *comparative selection* frame.

  4.  **Expanding Scope & Clarifying Liberalism (10 mins)**
      *   **Scope (Beyond Disease):** Argue PB isn't confined to preventing suffering/disease. If height *contingently* affects well-being (as above), and we accept PB, it applies. The "reason" stems from expected impact on the *child's life prospects*, not the clinical label. *Needs:* Non-identity & PB established; Height case illustrating non-disease impact.
      *   **Liberal Qualifier:** Explicitly state PB is *compatible* with, but *distinct from*, "Liberal Eugenics" (LE): Selection driven by *parental values* and choices within a *free market/private clinic* context, *without state coercion* or defining a single "best" type. PB provides the *moral reason*; liberalism defines the *permissible context* for acting on it. *Needs:* PB understood; Clear separation from state eugenics (often their initial suspicion).
      *   **Maximizing vs. Satisficing/Thresholds:** Briefly open: Does PB require selecting the *absolute best* possible child? Or just ensuring the child meets a sufficient threshold? ("Good enough" life). Argue PB is usually interpreted as *maximizing relative to available options*, but reasonable disagreement exists. *Needs:* PB understood; Recognition of value pluralism (from Height case).

  5.  **Active Misconception Defusal Map (Integrated throughout, key moments flagged)**
      *   **"Beneficence = Beneficence to *this* Patient" (Defuse: Step 1):** The entire non-identity intro dismantles this. Reinforce: "Who is the patient when choosing embryos? *None of them exist yet.* We're choosing *who* will become a patient."
      *   **"PB is Only About Preventing Suffering" (Defuse: After PB stated, solidified by Height Case):** Height case *forces* the issue. Ask: "If selecting against Tay-Sachs is justified by PB because it prevents suffering, and selecting for height is justified by PB because it improves expected opportunities, what's the *essential difference* in the *structure of the reason*? Is it the *source* of the disadvantage or the *effect* on the child?" Point: PB focuses on the *effect*.
      *   **"The Embryo is the Patient" (Defuse: Step 1 & Height Case Discussion):** Reiterate non-identity. Ask: "If we implant Embryo A, are we *failing* to treat *it* for shortness? Can an embryo *be* short? We're making a choice *before* a specific patient exists."
      *   **"Eugenics Requires State Coercion / 'Liberal' Makes it Fine" (Defuse: Step 4 - Liberal Qualifier):** Acknowledge the term "eugenics" is historically loaded. Argue: *Intention* (improving offspring) + *Means* (selection) = core eugenics. "Liberal" specifies *how* it's done (non-coercive, pluralistic), which mitigates *some* objections (authoritarianism) but *not others* (expressivism, disability rights, justice, slippery slopes). The word "liberal" doesn't magically dissolve ethical scrutiny; it defines the *mode*.
      *   **"PB Requires Maximizing One Trait" (Defuse: Height Case & Step 4 - Maximizing vs Enough):** Height case shows different plausible rankings based on *overall conception of a good life*. PB is about maximizing *expected overall well-being/life prospects*, which is multi-factorial. "Best life" isn't synonymous with "tallest," "smartest," etc.
      *   **"Disability Rights Objection = Simple Discrimination Claim" (Defuse: During Height Case or after Scope):** Elevate the objection: It's often about **expressivism** (selecting against trait X expresses the judgment that lives with X are less worth living/not worth creating) and **harm to existing people** with X (reinforcing stigma), regardless of parental intent. Distinguish: *Act* of selection vs. *Motive* (fear of stigma? genuine belief X harms flourishing?) vs. *Aggregate Effect* (changing norms). *Needs:* Recognition that PB applies to non-disease traits.
      *   **"Procreative Autonomy Settles It" (Defuse: Step 4 - Liberal Qualifier & throughout):** Explicitly separate: **Procreative Autonomy** (right to *choose whether/when* to procreate & *how*, within limits) grants the *permission* to make choices like embryo selection. **Procreative Beneficence** provides a *moral reason* for *which* embryo to select. Autonomy doesn't *rebut* PB; it defines the *space* where PB operates. Parents can *have* a reason (PB) but still *choose* otherwise based on other values (autonomy exercised). *Needs:* Clear statement of PB as a *reason*, not a command.

  6.  **The Check Case: "The Musical Aptitude Case - Parental Response Variant" (10 mins)**
      *   **The Case:** Same couple, IVF/PGD. Embryos screened for a complex genetic profile *strongly correlated* with exceptional potential for perfect pitch and rapid musical skill acquisition (but *not* guaranteeing it; requires exposure/practice).
          *   **Embryo X:** High probability of exceptional musical aptitude.
          *   **Embryo Y:** Average probability.
      *   **The Twist:** Parent 1 is a passionate but frustrated amateur musician. Parent 2 dislikes intense musical involvement. Parent 1 believes selecting X would allow them to *finally* share their deep love of music intensely with a child, enriching *both* their lives immensely. Parent 2 fears selecting X would lead Parent 1 to pressure the child, create conflict over practice time, and overshadow other aspects of life, *because* of Parent 1's own unfulfilled dreams. Selecting Y seems safer and calmer to Parent 2. The *expected flourishing* of child X or Y depends *significantly* on *how the parents, especially Parent 1, respond* to the child's aptitude.
      *   **Why it Works as a Check:**
          *   **Tests Non-Identity Premise:** Do they see they are choosing *which child* to bring into a *specific family dynamic*, not changing a child who will exist? (Rejection: "We should just implant Y and not pressure them if they show aptitude!" misses the point – that’s changing Y, not choosing X vs. Y).
          *   **Reveals Understanding vs. Discomfort:** If they focus on the parents' potential to mess up ("Fix the parents, not the embryo!") or argue selection is irrelevant because environment dominates, they likely haven't fully internalized the non-identity/comparative choice frame – they're slipping back to the "treat the existing patient" model or expressing discomfort with the implications. If they grapple with *how parental traits interact with child traits* within PB, they get it.
          *   **Highlights Value Pluralism & Uncertainty:** Reinforces that "best life" depends on complex interactions, not just genes.
      *   **What to Explicitly Table (State Out Loud):**
          *   "We are *not* settling the deep metaphysics of the non-identity problem today."
          *   "We are *bracketing* questions about the current accuracy/reliability of screening for complex traits like height or musical aptitude, or how heritability actually works. Assume the hypothetical screening is reliable for the sake of the *moral* argument."
          *   "We are *not* definitively answering whether PB yields a strict *duty* or just a strong *pro tanto reason* that can be outweighed. We're exploring the *structure* of the reason."
          *   "We are *not* tackling the huge question of aggregate societal effects of widespread private choices *today*."

  ---

  **Assessment of Your Case Spec & Refinement:**

  *   **What You Got Right:** Your instincts are excellent. Height fits perfectly: non-disease, socially contingent, environmentally modulated (within limits), potential for reasonable disagreement, no state/aggregation. The requirements are spot on.
  *   **Minor Refinement:** Height is ideal. Musical aptitude (in the check case) works well for the twist because the parental interaction effect is very plausible and relatable. Avoid traits too culturally specific (e.g., eye color preferences vary hugely) or too closely tied to intelligence (which brings massive baggage). Height is relatively universal.
  *   **Why Height > Your Instincts?** It perfectly embodies "a trait whose expected effect on the child's life runs partly through a contingent and partly unjust feature of the social world." The injustice (height bias) is well-documented and intuitively graspable, making the "fix the world" retort natural and allowing you to cleanly separate selection from environmental intervention for *that specific potential child*.

  **Key to Success:** Rigorously enforce the non-identity frame. Constantly ask: "Which *possible future person* are we talking about bringing into existence?" and "Is the alternative action changing *this* child or creating a *different* child?" This is the anchor preventing the discussion from drifting onto the rocks of their existing clinical intuitions or ideological suspicions.
