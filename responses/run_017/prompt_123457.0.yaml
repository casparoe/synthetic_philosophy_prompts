  ### What the Procedure Cannot Do  
  1. **Resolve foundational conflicts**:  
     - Tangled hierarchies (e.g., Rule 42 vs. Rule 43) lack an "inviolate level." The procedure assumes Rule 43’s sunset is valid but cannot *prove* it.  
  2. **Predict regulatory acceptance**:  
     - Charity law compliance (e.g., for Rule 3 amendments) requires legal advice; the procedure only flags risk.  
  3. **Block clever circumventions**:  
     - Motions that indirectly attack protected Rules via semantic loopholes (e.g., redefining "Regional" to void Rule 1) may evade detection until Step 5.  
  4. **Override politics**:  
     - If Council ignores the procedure (e.g., allows motion (c) under Rule 41 despite uncertainty), the verdict is advisory.  
  5. **Handle meta-amendments gracefully**:  
     - Amending Rule 41 to permit entrenchment (e.g., "Rule 44 may only be amended by 90%") is untested; the procedure treats it as ordinary.  

  **Final Advice**:  
  - Use solicitor opinions for Rule 3 motions or Rule 42 disputes.  
  - For motion (b), recommend Council adopt the *spirit* of entrenchment (e.g., "amendments require 80%") via Rule 41, but this is political, not procedural.  
  - For motion (c), Council must rule on Rule 42’s status first—do not proceed without clarity.
