  ### Triage Procedure for Rule Amendment Motions  
  **Purpose**: To determine if a motion is in order and under which procedure it must be voted, based on the Association's Rules.  

  | Step | Question asked | What counts as a sufficient answer | Verdict if answer not forthcoming | Judgment call? (yes/no) | Who signs off |  
  |------|----------------|-------------------------------------|------------------------------------|-------------------------|--------------|  
  | 1 | Does the motion directly amend, repeal, or add a Rule? | Explicit identification of the Rule(s) affected (e.g., "amends Rule 41"). | Not in order (if no Rule is targeted). | No (factual). | Secretary |  
  | 2 | Is the affected Rule **Rule 1 (Name)** or **Rule 3 (Objects)**? | Clear yes/no based on the motion's text. | Proceed to Step 3. | No (factual). | Secretary |  
  | 3 | Is **Rule 42** (entrenchment for Rules 1/3) in force? | Evidence Rule 42 is active: <br> - **Yes**: 2024 reaffirmation vote met 66.7% threshold (disputed; 61% was recorded). <br> - **No**: Rule 43’s sunset applied (50-year limit + reaffirmation failed). | **Stop → Refer to Council** (uncertainty unresolved). | Yes (Rule 42’s status is contested and legally unsettled). | Council |  
  | 4 | Does the motion amend **Rule 41, 42, or 43**? | Clear yes/no. If yes, specify which. | Proceed to Step 5. | No (factual). | Secretary |  
  | 5 | Does the motion *indirectly* alter Rule 1 or 3?<br>(e.g., by amending Rule 42 to remove Rule 1’s protection) | Evidence the motion: <br> - Changes definitions affecting Rule 1/3; or <br> - Weakens procedures guarding Rule 1/3; or <br> - Achieves de facto amendment of Rule 1/3. | Proceed to Step 6. | Yes (requires interpretation of intent/effect). | Secretary (escalate Rule 3 issues to Council) |  
  | 6 | Does the motion create **new entrenchment**?<br>(e.g., "this Rule cannot be amended") | Text declaring self-entrenchment (e.g., "shall not be repealed"). | Proceed to Step 7. | No (factual). | Secretary |  
  | 7 | Final classification: Can the motion be implemented without contradicting higher Rules? | All prior steps resolved. | **Stop → Not in order** (if irreconcilable conflict). | N/A | Secretary |  

  **Notes**:  
  - **Stop conditions**:  
    - Step 3: If Rule 42’s status is disputed and Council referral is needed.  
    - Step 7: If the motion’s effect invalidates the Rules’ hierarchy (e.g., self-entrenchment without authority).  
  - **Escalate to Council when**:  
    - Rule 42’s status is material and contested (Step 3).  
    - Rule 3 (Objects) is directly/indirectly amended (regulatory risk).  
    - Judgment calls involve values/politics (e.g., "should we allow this even if technically valid?").  
  - **Output**: One of four verdicts:  
    - `in_order` (use Rule 41).  
    - `in_order_with_conditions` (e.g., Rule 42 applies).  
    - `not_in_order` (fatal flaw).  
    - `refer_to_council` (unresolved judgment call).  

