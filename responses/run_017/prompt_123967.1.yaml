prompt: |-
  So I've somehow ended up owning "culture" at a ~180-person remote-first company, and I've got about a year, no extra headcount, and basically three levers: what gets said out loud in incident reviews and retros, how onboarding frames our norms, and which behaviors senior people visibly model. I can't fire my way to a norm and I can't run anything with more than maybe n=40 per arm.

  I keep coming back to the old anthropological guilt-culture / shame-culture distinction. I know that anthropology is way too coarse (and probably shouldn't be trusted much at all at that scale), but the pracitcal version feels real to me: do people comply because they'd feel bad about the act, or because they'd feel bad about being seen — and can an organization deliberately pick one, or does it just drift?

  Two things I've been going back and forth on, which I want slotted into your answer rather than ignored:

  - leakage: my sense is shame is alot cheaper to install but generalizes to stuff the target never chose (accent, body, family, neurotype), whereas guilt stays closer to the act and to a magnitude. If that's right, is the whole question just "how bad are the tails," and is that even measurable at my n?
  - reintegration/forgetting: the non-stigmatizing kind of shame needs some public ritual of re-acceptance, but we're a Slack company with searchable history and screenshots, so the audience never dissolves. That makes me think the real crux isn't guilt vs. shame at all — it's whether I can build any working forgetting mechanism, and if I can't, the medium has already picked for me and the rest is decoration.

  What I actually want is an agenda, not a literature review and definately not reading recs. Which open questions here are worth my year, and in what order? Give me a dependency-aware ranking: which questions are upstream of which (is the medium-determinism thing upstream of everything, or downstream of leakage?), which are tractable with the three levers I have, and which I should drop because the answer wouldn't change what I do — I suspect "is shame ever fitting/appropriate in the abstract" is one of those. And what would I observe over the next few quarters that should move something up or down the list?

  Also please flag anything the guilt/shame framing makes me think I have to choose between that I actually don't — enforcement via in-group pride, or plain "this rule is annoying but I've internalized it anyway" compliance, or whatever else I'm not seeing. I'd rather hear about what's not on my list than get my existing two ideas steelmanned.
reasoning: |-
  Okay, let me unpack this culture design challenge. The user is framing it through an anthropological lens but clearly wants actionable levers, not theory. They're constrained by remote-first context, small n, and three concrete influence points: incident reviews/retros, onboarding, and senior modeling. 

  First, I notice they're wrestling with guilt-shame dichotomy but their real pain points are leakage (shame's spillover effects) and digital permanence blocking reintegration. That's where their energy is - the rest feels like framing. Smart that they're questioning if the medium has already decided for them.

  Hmm... their two core tensions actually point to a deeper structural question: how to enforce norms without collateral damage in a context where mistakes are archived forever. The guilt/shame thing might be a red herring. What they really need is:
  - A way to correct behavior without branding people
  - Mechanisms for digital "forgetting"
  - Prevention of norm violations in the first place

  The tools they have map well to this:
  - Incident reviews can model blame-free correction
  - Onboarding can pre-empt violations through norm-setting
  - Leaders can demonstrate public recovery from mistakes

  For prioritization... the digital permanence issue feels most urgent because it limits all other solutions. Can't build psychological safety if every error is eternally searchable. Should suggest lightweight forgetting rituals - maybe "expiration dates" on retro items or anonymized case studies after X months.

  Leakage prevention comes next - it's about precision in feedback. Their three levers work here: onboarding teaches precise language ("your merge broke CI" not "you're careless"), leaders model specific feedback, retros focus on systems not people.

  The guilt/shame choice itself is probably least actionable - as they suspected, it wouldn't change tactics. More useful to focus on what they can control: making correction feel constructive rather than punitive, regardless of the underlying psychology.

  Oh! And they're missing a key alternative: pride systems. Public recognition of desired behaviors might be more powerful than guilt/shame avoidance. Their senior modeling lever could showcase "hero stories" where someone lived the values.

  Timeline wise: quarter 1 should test forgetting mechanisms (e.g., trial auto-archiving retros after 6mo). Quarter 2 refine precision in onboarding based on new hire feedback. Quarter 3-4 scale what works via leader amplification. Watch for reduced defensiveness in retros and increased psychological safety survey scores as leading indicators.

  Most importantly - they don't need to solve anthropology. They need to engineer specific, reversible interventions using their existing channels. The rest is noise.
answer: |-
  Here's your action plan, structured around tractable questions with dependencies, measurable signals, and levers mapped to your constraints. The guilt/shame framing is useful for diagnosis but limiting for solutions—your real goal is **precise, reintegrable accountability**. Forget the dichotomy; focus on building systems that minimize collateral damage and maximize learning.

  ### Core Insight
  Your digital permanence problem ("searchable history and screenshots") is **upstream of everything**. Without forgetting rituals, *any* accountability mechanism becomes toxic. Start here.

  ---

  ### Dependency-Aware Priority Queue (With Observables & Timeline)
  **1. Can we build effective forgetting rituals in a digital context?**  
      *Why first?* Until you solve this, public accountability (via retros/incidents) risks permanent stigmatization.  
      *Your levers:*  
      - **Incident Reviews/Retros:** Pilot "expiration dates." After 90 days, anonymize/post-mortems into a "Patterns Library" (lessons kept, names/teams scrubbed).  
      - **Senior Modeling:** Leaders publicly reference their *own* expired mistakes: "I made a similar error last year—here’s how I applied the fix."  
      *Observe next quarter:*  
      - ↓ Defensiveness in retros; ↑ participation in incident analysis  
      - If no change after 3 months, digital permanence is a critical blocker—escalate to tooling changes (e.g., auto-archiving retros).  

  **2. How do we enforce norms without collateral damage (leakage)?**  
      *Why second?* Requires forgetting rituals (Q1) to be viable. Focus on precision.  
      *Your levers:*  
      - **Onboarding:** Train on "Specific Feedback Frameworks":  
        *Bad:* "Your PR broke the build."  
        *Good:* "The merge conflict in PR #345 broke CI—next time, run local tests first."  
      - **Senior Modeling:** Leaders correct *actions* not *people*: "This commit introduced risk" vs. "You’re careless."  
      - **Incident Reviews:** Rigorous "5 Whys" that stop at *processes*, not people.  
      *Observe next quarter:*  
      - ↑ Use of precise language in Slack/retros (audit channels)  
      - ↓ Reports of "personal attacks" in engagement surveys  

  **3. Can we replace guilt/shame with *pride* and *pragmatism*?**  
      *Why third?* Pride/pragmatism sidesteps the guilt/shame trap entirely. Requires Q1 & Q2 to build safety.  
      *Your levers:*  
      - **Onboarding:** Showcase "Norms in Action" stories—e.g., "When Maria flagged a security flaw, she got a promotion."  
      - **Senior Modeling:** Leaders celebrate *learning* from failures: "Thanks to Sam’s post-mortem, we fixed this for everyone."  
      - **Incident Reviews:** End with "What did we *gain*?" (e.g., new safeguards, better docs).  
      *Observe next quarter:*  
      - ↑ Voluntary sharing of mistakes/learnings  
      - ↑ Usage of internal docs/tools built from failures  

  ---

  ### What to Drop (Per Your Request)
  - **"Is shame ever appropriate?"** → Untestable and unactionable. Your goal is harm reduction, not moral philosophy.  
  - **"Guilt vs. shame as a binary choice"** → Organizations use hybrid models. Focus on outcomes: precision and reintegration.  

  ---

  ### Hidden Alternatives (What You’re Missing)
  - **Pragmatic Compliance:** "This rule is annoying but worth it."  
    - *Lever:* Onboarding sells the *why*: "We require 2FA because it prevented 3 breaches last year."  
  - **In-Group Pride:** "We’re the team that fixes hard problems."  
    - *Lever:* Senior leaders frame challenges as identity: "At [Company], we dig into root causes—that’s how we earn trust."  
  - **System Accountability:** Shift focus from *who* to *what allowed this?*  
    - *Lever:* Retros start with: "What signals did we miss? What tools failed?"  

  ---

  ### Signals to Re-Prioritize
  - **Move Q1 up if:** Retro participation drops, or HR reports anxiety about public mistakes.  
  - **Move Q3 up if:** You see siloing (teams hiding errors), or low engagement with learning resources.  
  - **Abandon a path if:** No behavior change after 2 iterations (e.g., forgetting rituals ignored → pivot to private incident analysis).  

  ---

  ### Yearlong Game Plan
  | Quarter | Focus                  | Key Actions                                                                 |
  |---------|------------------------|-----------------------------------------------------------------------------|
  | Q1      | Forgetting Rituals     | Pilot anonymization in 2 retros; leaders model "expired mistake" stories    |
  | Q2      | Precision Enforcement  | Revise onboarding with feedback frameworks; audit retro language precision  |
  | Q3      | Pride/Pragmatism       | Launch "Norms in Action" stories; retros include "What did we gain?"        |
  | Q4      | Scale & Cement         | Document rituals in handbook; measure reduction in "blame" mentions in Slack |

  **Final note:** Your three levers are amplifiers—use senior modeling to kickstart change, onboarding to codify it, and incident reviews to reinforce. At n=40, track leading indicators (language patterns, participation rates) not culture "perfection." The goal isn’t to eliminate guilt/shame but to build a system where accountability doesn’t equate to exile.
