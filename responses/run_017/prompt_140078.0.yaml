  #### **Node 1: Doctor's Certainty**  
  *Case*: A doctor has seen your scan and knows it shows a tumor. They say: "If the scan shows a tumor, we’ll need to biopsy it."  
  **Question**: Is this conditional true?  
  - **A: Yes** (→ Node 2)  
  - **B: No** (→ Leaf: Suppositional View)  

  *Why this node?*  
  This tests whether conditionals require truth conditions tied to knowledge. If you say "no," you reject truth conditions entirely (e.g., conditionals aren’t true/false but express suppositions). *Not* about context sets—even truth-conditional views agree the doctor’s statement is true (it’s about shared information, not private knowledge).  

