  #### **Node 2: Before the Vote (Indicative vs. Counterfactual 1)**  
  *Case*: Before a city council vote on a new bridge, outcome unknown. Traffic will improve only if the bridge is built.  
  **Question**: Which conditional is appropriate?  
  - **A: Indicative** ("If the council votes for the bridge, traffic will improve") (→ Node 3)  
  - **B: Counterfactual** ("If the council had voted for the bridge, traffic would have improved")  
  - **C: Both**  
  - **D: Neither**  

  *Why this node?*  
  This isolates the indicative/counterfactual contrast. Only (A) is intuitive—counterfactuals sound odd when the antecedent isn’t settled. *Not* about truth values: it’s about grammatical appropriateness given temporal/epistemic status.  

  ---

  #### **Node 3: After the Vote (Indicative vs. Counterfactual 2)**  
  *Case*: The council voted against the bridge. Traffic did not improve.  
  **Question**: Which conditional is appropriate?  
