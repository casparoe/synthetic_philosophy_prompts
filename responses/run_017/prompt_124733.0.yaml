answer: |-
  Here's the translation into your operational vocabulary, with schema logic, classifier behavior, edge case handling, and residue analysis. Each account becomes a classification function with explicit parameters.

  ---

  ### **1. Astrobiology Working Definition (Self-Sustaining Chemistry + Darwinian Evolution)**  
  **Predicate Function:** `is_astro_life(chem_autonomy: BOOL, replication_fidelity: FLOAT, variation_capacity: FLOAT) → BOOL/SCORE`  
  - **Required Fields:** Metabolic pathway signatures (non-null), replication mechanism (non-null), heritable variation mechanism (non-null).  
  - **Nullable:** Mutation rate (if null, default variance threshold applied).  
  - **Type:** **Threshold Score** (weighted: chem_autonomy=0.5, replication_fidelity=0.3, variation_capacity=0.2). Minimum threshold: 0.8.  
  - **Structure:** **DAG with replication edges**. Lineage requires heritable material transfer (vertical/horizontal).  
  - **Parent Pointer Null Handler:** Instant fail (no ancestry = no evolution).  
  - **Unit Tests:**  
    - ✔️ Bacterial strain: `chem_autonomy=TRUE`, `replication_fidelity=0.95`, `variation=0.9` → **ORGANISM**  
    - ❌ Lone mammal: `variation=0.0` (no mates) → **NOT_ORGANISM**  
    - ❓ CRISPR-edited cell: `variation` artificially high → Flag for manual review.  

  ### **2. Autopoiesis (Self-Producing Organizational Closure)**  
  **Predicate Function:** `is_autopoietic(boundary_integrity: BOOL, component_synthesis: ARRAY, network_closure: FLOAT) → BOOL`  
  - **Required Fields:** Boundary type (membrane/cell wall, non-null), internal component synthesis list (non-null).  
  - **Nullable:** Kinetic stability metrics.  
  - **Type:** **Hard Boolean** with monothetic definition: `boundary_integrity=TRUE` AND `network_closure=1.0` (all components produced internally).  
  - **Structure:** **Tree** (inheritance of organizational template; horizontal transfer breaks closure).  
  - **Parent Pointer Null Handler:** Root node must satisfy synthesis from raw materials.  
  - **Unit Tests:**  
    - ✔️ Unicellular alga: Synthesizes own lipids/proteins → **ORGANISM**  
    - ❌ Virus: `component_synthesis=[]` → **NOT_ORGANISM**  
    - ❗ Symbiotic organelle: Partial synthesis → Requires dependency graph traversal.  

  ### **3. Replication-First (Gene Lineage as Primary)**  
  **Predicate Function:** `is_gene_lineage_vehicle(replication_machinery: BOOL, info_storage: BOOL, phenotype_building: FLOAT) → BOOL`  
  - **Required Fields:** Nucleic acid sequence (non-null), replication enzymes (non-null).  
  - **Nullable:** Phenotypic complexity (if null, assume minimal).  
  - **Type:** **Hard Boolean** (`replication_machinery=TRUE` AND `info_storage=TRUE`). Phenotype is metadata.  
  - **Structure:** **DAG of genetic lineages**. Organism records are ephemeral containers.  
  - **Parent Pointer Null Handler:** Acceptable if genetic material is novel (e.g., synthetic biology).  
  - **Unit Tests:**  
    - ✔️ Mitochondrion: Inherited genome + replication → **ORGANISM** (as gene vehicle)  
    - ❌ Prion: `info_storage=FALSE` → **NOT_ORGANISM**  
    - ⚠️ Lateral gene transfer: Merge DAG branches.  

  ### **4. Metabolism-First (Gradient-Dissipating Process)**  
  **Predicate Function:** `is_dissipative_structure(energy_gradient: FLOAT, entropy_export: FLOAT, persistence: FLOAT) → SCORE`  
  - **Required Fields:** Energy source type (non-null), waste products (non-null).  
  - **Nullable:** Homeostasis duration (if null, use instantaneous flux).  
  - **Type:** **Threshold Score** (weighted average > 0.7). Polythetic: can compensate low `persistence` with high `entropy_export`.  
  - **Structure:** **Process-centric graph** (edges = energy/matter flows).  
  - **Parent Pointer Null Handler:** Irrelevant (processes lack ancestry).  
  - **Unit Tests:**  
    - ✔️ Hurricane: High `entropy_export` → **ORGANISM** (if threshold met)  
    - ❌ Crystal: `entropy_export=0` → **NOT_ORGANISM**  
    - 🔄 Fire: High `energy_gradient` but low `persistence` → Borderline score.  

  ### **5. Deflationary / Family Resemblance**  
  **Predicate Function:** `life_resemblance(vector: ARRAY[traits]) → SCORE`  
  - **Required Fields:** None (all nullable, but trait vector non-empty).  
  - **Type:** **Probabilistic Score** from ML classifier (e.g., Random Forest). Traits: growth, response, metabolism, etc.  
  - **Structure:** **Tagged graph** (nodes tagged with trait vectors).  
  - **Parent Pointer Null Handler:** Independent classification.  
  - **Unit Tests:**  
    - ✔️ Beehive: High similarity to training set → **ORGANISM**  
    - ❌ Sand dune: Low similarity → **NOT_ORGANISM**  
    - 📊 Continuous output: Score = 0.63 → Review queue.  

  ---

  ### **Case Classifications**  
  | Case              | Astrobiology | Autopoiesis | Replication-First | Metabolism-First | Deflationary |  
  |-------------------|--------------|-------------|-------------------|------------------|--------------|  
  | **(a) Chimney Fields** | ❌ (No heritable variation) | ❌ (No self-production) | ❌ (No info storage) | ✔️ (Strong gradients + structure) | ⚠️ (Score ≈0.6 - growth but no response) |  
  | **(b) Tenant Cell**   | ⚠️ (Partial autonomy) | ❌ (ATP/translation external) | ✔️ (Own genome + replication) | ⚠️ (Weak gradient dissipation) | ⚠️ (Score ≈0.7 - hybrid traits) |  
  | **(c) Pando**         | ❌ (Single genome = no variation) | ✔️ (Root network closure) | ❌ (One genome, many stems → entity resolution conflict) | ✔️ (Persistent biomass/energy flow) | ⚠️ (Score ≈0.8 but DAG resolution error) |  
  | **Prions**        | ❌ | ❌ | ❌ | ❌ | ⚠️ (Score ≈0.4 - self-assembly trait) |  
  | **Freeze-Dried Spores** | ❌ (Dormant) | ❌ (No active processes) | ✔️ (Info storage intact) | ❌ (No dissipation) | ⚠️ (Low activity score) |  

  **Your Two-Year Rule:**  
  - **Translates to:** `is_persistent_dissipative_structure(rehydration_success: BOOL, dormancy_duration: INT) → BOOL`  
  - **Philosophical Position:** **Operational Thermodynamics** (life = persistent far-from-equilibrium state).  
  - **Cheating?** Yes — it accepts prions (no metabolism) and rejects tardigrades (dormant >2 years), revealing a **biosafety pragmatism**: "Alive" = "can spontaneously restart contamination."  

  ---

  ### **The Residue Analysis**  
  1. **Clean Translations:**  
     - Replication-first and autopoiesis map neatly to **monothetic booleans** (hard requirements + tree/DAGs).  
     - Metabolism-first and deflationary fit **polythetic scores** (thresholds + cluster weights).  

  2. **Translations Requiring Smuggling:**  
     - Astrobiology **smuggles purpose** ("evolution" implies teleology; your implementation uses proxies like variation capacity).  
     - Deflationary **smuggles training data** (ground-truth labels for clustering).  
     - Thresholds **smuggle cost asymmetry** (e.g., false ORGANISM risks biosafety; false NOT wastes funding).  

  3. **Untranslatable Concepts:**  
     - **"Real" vs "Operational" Life:** Your schema has no `ontological_status` field. Distinctions collapse into classifier confidence scores.  
     - **Borderline Cases:** `INDETERMINATE` encodes *epistemic uncertainty* (e.g., incomplete data) not *metaphysical indeterminacy*. Autopoiesis has no borderline state.  

  4. **The Core Conflict:**  
     The "residue" is **not a vocabulary defect**. Your framework exposes that the debate is about **unstated utility functions**:  
     - Astrobiology → Planetary protection (avoid false negatives).  
     - Autopoiesis → Biocontainment (strict autonomy = safer).  
     - Replication-first → Genetic resource tracking (IP enforcement).  
     - Your two-year rule → Lab safety (reactivation risk).  

  **Conclusion:** The accounts aren’t theories of life — they’re **policy schemas** for funding, regulation, or ethics. Your `ORGANISM/NOT` flag isn’t broken; it’s a proxy for **which institutional consequence** matters most. Adding `INDETERMINATE` doesn’t resolve philosophy — it buffers institutional risk when cost-asymmetry is high. The "residue" is the unmapped link between your classifier’s output and the silent stakeholder demand: *"What happens when we call this alive?"*
