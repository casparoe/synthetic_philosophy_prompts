  Below is the decision tree designed to sort students by their responses to cases of updating on uncertain evidence, without assuming prior knowledge of formal rules. The tree has 7 internal questions (branch nodes) and 10 leaves (named positions), including one empty leaf and one "skeptical" leaf. Positions are defined by combinations of answers to cases, not rule names. The tree is built from the logical space of possible answers, with positions mapped to leaves and empty combinations diagnosed. Pairs of leaves that collapse (e.g., Jeffrey conditioning and minimum cross-entropy) are flagged.

  ---

  ### **Decision Tree: Updating on Uncertain Evidence**

  #### **Start**: You experience a shift in credences over a partition (e.g., colors of cloth) but become certain of no new proposition. What rule should you use?

  1. **In the cloth by candlelight case (Case 1)**, the same experience is described over fine ({green, blue, violet}) and coarse ({green, not-green}) partitions, and rigidity gives different answers. Which partition, if any, is the one the experience "sets"?  
     - **A. The fine partition** → Go to Q2.  
     - **B. The coarse partition** → Go to Q2.  
     - **C. Neither—the experience doesn't "set" a partition; rigidity is flawed** → Go to Q3.  
     - **D. Both are valid, but they represent different experiences** → Go to Q3.  

  2. **In the half-heard message case (Case 2)**, you shift to credence 0.7 that the word was "green," and this indirectly informs you about defectiveness. Does this shift carry more information than just the new credences over the words?  
     - **A. Yes—it also changes conditional credences (e.g., P(defectiveness | word))** → Go to Q4.  
     - **B. No—the information is fully captured by the new credences over the words** → Go to Q5.  

  3. **Should the same rule cover "suppose green," "if green," and "seemed green" (Case 6)?**  
     - **A. Yes—one unified rule** → Go to Q6.  
     - **B. No—these are distinct and need different rules** → Leaf: **Skeptical: Input Underdetermines Output** (Position: No single rule applies; updating is context-dependent).  

  4. **In the half-heard message case, can the "extra information" be quantified as likelihoods (probabilities of the word given states)?**  
     - **A. Yes—use a likelihood function** → Leaf: **Likelihood-Based Rule** (Position: Input is evidence likelihoods across states; update via likelihood ratios).  
     - **B. No—it’s not about likelihoods** → Go to Q7.  

  5. **For two back-to-back shifts over different partitions (Case 3), if updating order changes the result, is that acceptable?**  
     - **A. Yes—order of evidence matters** → Leaf: **Jeffrey Conditioning** (Position: Rigidity holds; update by fixing conditionals given partition cells).  
     - **B. No—it’s a reductio of the rule** → Go to Q6.  

  6. **In the calibration readout case (Case 4), how should you update when told your future credence in green will be 0.7?**  
     - **A. Set current credence to 0.7 via reflection** → Leaf: **Handles Calibration (Reflection)** (Position: Defer to future credences as expert).  
     - **B. Treat it as evidence about the world** → Leaf: **Handles Calibration (Higher-Order Conditionalization)** (Position: Future credence reports are evidence propositions).  
     - **C. This is beyond basic updating rules** → Leaf: **Skeptical: Input Underdetermines Output** (Position: No unique output; inputs ambiguous).  

  7. **In the implant case (Case 5), can you update when the experience lacks antecedently understood concepts?**  
     - **A. Yes—revise concepts or expand the partition** → Leaf: **Minimum Cross-Entropy / Closest-Function Rule** (Position: Minimize KL-divergence to prior subject to constraints).  
     - **B. No—this marks a boundary of the framework** → Leaf: **Framework Boundary (New Concepts)** (Position: Updating requires pre-existing concepts).  

  ---

  ### **Leaf Nodes (Named Positions)**
  1. **Jeffrey Conditioning**: (Reached via Q5A) Rigidity holds; update by fixing conditionals given partition cells.  
  2. **Likelihood-Based Rule**: (Reached via Q4A) Input is evidence likelihoods across states; update via likelihood ratios.  
  3. **Minimum Cross-Entropy / Closest-Function Rule**: (Reached via Q7A) Minimize KL-divergence to prior subject to constraints (handles new concepts).  
  4. **Handles Calibration (Reflection)**: (Reached via Q6A) Defer to future credences via reflection principle.  
  5. **Handles Calibration (Higher-Order Conditionalization)**: (Reached via Q6B) Treat future credence reports as evidence propositions.  
  6. **Framework Boundary (New Concepts)**: (Reached via Q7B) Updating requires antecedently understood concepts; implant case is outside scope.  
  7. **Skeptical: Input Underdetermines Output**: (Reached via Q3, Q6C) No unique output; inputs are ambiguous or underspecified.  
  8. **Plain Conditionalization (Experience Proposition)**: (Reached if Q1=Yes) Always a proposition E about the experience to conditionalize on.  
  9. **Empty Leaf (Unoccupied)**: (Diagnosis below)  
  10. **Empty Leaf (Unoccupied)**: (Diagnosis below)  

  ---

  ### **Empty Leaves and Diagnoses**
  - **Combination 1**: Q1=A → *Plain Conditionalization* (Occupied).  
  - **Combination 2**: Q1=B/C/D → Q2=A/B → Q3=A → *Skeptical* (Occupied).  
  - **Combination 3**: Q1=B/C/D → Q2=A/B → Q3=B → *Not reached* (Q3=B leads to Q6).  
  - **Empty Leaf 1**: Answers: Q1=C/D → Q3=B → Q6=A/B/C.  
    - **Diagnosis**: Unattractive. Rejecting rigidity (Q1=C/D) but accepting reflection (Q6=A) or higher-order props (Q6=B) is coherent but rare; most who reject rigidity avoid simple reflection.  
  - **Empty Leaf 2**: Answers: Q1=B → Q2=B → Q5=B → Q6=A.  
    - **Diagnosis**: Incoherent. Accepting rigidity (Q2=B→Q5) but rejecting path-dependence (Q5=B) conflicts with rigidity implying order-dependence.  

  ---

  ### **Collapsed Leaves**
  - **Jeffrey Conditioning** (Leaf 1) and **Minimum Cross-Entropy** (Leaf 3) **collapse** into one position when the input is a partition shift (e.g., Case 1). Minimizing KL-divergence subject to new partition credences implies rigidity, giving identical results to Jeffrey. They are the same rule applied twice (partition-constrained minimization).  
    - **Exception**: Minimum cross-entropy generalizes to non-partition constraints (e.g., Case 5), so leaves *diverge* for implant-like cases.  

  ---

  ### **Inconsistency Warnings for Live Use**
  - **Q1 → Q6B**: Students may say "No" to experience propositions (Q1) but later endorse higher-order propositions (Q6B). **Inconsistency likely**: If no proposition exists (Q1), future credence reports (Q6B) can’t be propositions.  
  - **Q5A → Q5B**: Students may accept path-dependence (Q5A) but balk at its implications (e.g., order-matters intuition). **Inconsistency likely**: Rigidity implies path-dependence; rejecting Q5B after Q5A is unstable.  
  - **Q3 → Q4**: Students may reject unified rules (Q3=B) but still expect likelihoods (Q4) to handle Case 6. **Inconsistency likely**: Likelihood rules don’t distinguish supposition from perception.  

  ---

  ### **Closing Note**
  This tree prioritizes cases over jargon, exposing tensions (e.g., rigidity vs. path-dependence). Students often answer inconsistently at **Q1→Q6B** (proposition denial vs. higher-order reliance) and **Q5A→Q5B** (rigidity acceptance vs. path-dependence denial). The collapsed Jeffrey/min-entropy leaves clarify that partition shifts reduce to one rule, avoiding false distinctions. Empty leaves highlight underexplored (unattractive) options. Use live to reveal hidden assumptions.
