prompt: |-
  I'm a senior in a philosophy of psychiatry seminar, and our current unit is psychiatric classification and Ian Hacking's looping effects — the way a classification of people can feed back on the people classified and change them, which then forces the classification itself to be revised. For the final paper we were handed an invented case (I'll reproduce it below; please treat every fact in it as stipulated and don't try to check it against anything real). In the discussion section last week my professor reached for a line I have now heard three times this term: "diagnoses aren't discovered, they're made." It seemed to be doing three different jobs, and I suspect it can only do them by sliding between readings. I want the readings separated before I commit to a thesis.

  The three jobs it was made to do:

  1. To close down a classmate's question "but is PMDS a real disorder or not?" — the answer was that the question is not well formed.
  2. To conclude that the criteria are therefore a policy choice, to be settled on cost-benefit grounds by asking what the category does for patients, clinicians, insurers, and researchers.
  3. To conclude that no psychiatric category could be a natural kind, so the search for validators is misguided from the start.

  The seminar case, abbreviated. A working group is deciding whether to keep, split, or drop a proposed category, "prolonged motivational depletion syndrome" (PMDS).

  - 2017–18: two neurology clinics publish a case series of about forty patients, mostly with a shared lesion pattern, who report intact wanting together with an inability to initiate action. There is no psychiatric label for this; the clinicians call it "the starting problem."
  - 2023: PMDS is proposed: six months or more of reported failure to initiate volitional action with preserved hedonic response, plus two of five functional items, not better explained by a depressive episode.
  - 2026: a bestselling memoir by someone from the original cohort.
  - 2027–30: a large online community forms; members call themselves "PMDSers"; short videos circulate that teach the criteria as a self-check; referrals rise from dozens to tens of thousands; new patients describe their experience in the criteria's own vocabulary and report the symptoms in item order.
  - 2031: field trials show the original functional items no longer discriminate — near-ceiling endorsement in both self-referred and comparison groups. The group narrows the criteria and adds a clinician-rated initiation-latency measure.
  - Validators drift: family aggregation is 3.1 in the 2018 cohort and 1.2 in the 2029 cohort; a dopaminergic agent has a large effect in the 2018 cohort and a small one in 2029; an imaging correlate found in 2018 fails to replicate in 2029.
  - Course: in the 2018 cohort it tracks the lesion; in the 2029 cohort symptoms frequently remit when people leave the online community.
  - Institutions: a vocational-rehabilitation benefit now requires a PMDS code for eligibility. One patient organization lobbies to keep the category; a rival group of former patients campaigns against it, saying the label taught them to read ordinary fatigue as illness.
  - The live dispute: some clinicians say the 2029 presentations are a different condition entirely; others say it is the same condition with a widened phenotype.

  What I'd like from you:

  1. A menu of seven to nine distinct precise readings of the slogan, ordered from the most platitudinous to the most radical. For each: what it asserts exactly; a verdict (trivial platitude / substantive and defensible / substantive but doubtful / false / self-undermining); and which of the three jobs it actually supports, if any. One clause naming the position each reading corresponds to is welcome, but the readings should be distinguished by content, not by labels.
  2. Make sure the menu separates readings along these axes, since I think the ambiguity lives there: whether what is "made" is the term, the criteria, or the people and the kind; whether "made" means causally produced by the practice of classifying or conventionally selected from phenomena that were already there; whether the claim is constitutive (these instances could not have existed without the label) or merely causal and historical; and whether it is global (all clinical kinds) or local (only some, and if so which).
  3. Say for each reading how it bears on Hacking-style looping and on his contrast between kinds that are indifferent to our classifications and kinds that are not: does looping entail the reading, is it merely compatible with it, or does it tell against it? I specifically want to know whether a looping effect, on its own, supports any antirealist conclusion at all, and why or why not.
  4. Run each reading against the case at two time slices, the 2018 clinic cohort and the 2029 self-referred cohort, and say whether PMDS comes out discovered, made, both, or neither at each. Flag explicitly the readings whose verdict changes between the slices — my guess is that the interesting ones are time-indexed, and I want that made visible rather than averaged away.
  5. Assess three inferences I keep hearing in seminar. (a) The criteria were written by a committee, so the kind is a committee artifact. (b) The label changes the people who have it, so the kind is not real at any given time, cannot be a natural kind, and cannot support stable science. (c) These individuals would not have had this experience without the label, so the category cannot be explanatory. For each: valid under which reading or readings, and what goes wrong where it is not.
  6. Tell me whether any single reading supports all three of the professor's uses. If none does, say which use has to be given up, and say plainly whether the slogan's rhetorical work depends on moving from a platitudinous reading to a radical one without marking the move. If a reading is self-undermining, show the mechanism; my own suspicion is that the reading which best supports job (2) is the least stable, because looping also degrades the evidence you would use to estimate the benefits — the treatment effect shrinks and the validators drift, so there may be nothing fixed for the pragmatist to optimize against. Check that argument rather than agreeing with it.
  7. Finally: which reading is the professor most likely to have meant, given that they used the line for all three purposes?

  Format and constraints. Please write in American English, about 1,000 to 1,300 words. Give the menu as a numbered list with a consistent verdict label on each entry, then a compact table with one row per reading and columns for verdict, supports job (1)/(2)/(3), relation to looping, verdict on the 2018 cohort, and verdict on the 2029 cohort. Define any technical term you use. Assume I know the basics of how diagnostic manuals work and what a looping effect is, and nothing beyond the seminar. I'm writing this from off campus with no database access, so please don't send me to the literature or tell me what to read — I need the distinctions worked out and the verdicts argued for, not a bibliography. And please don't leave me with "it depends what you mean by 'real'": that much I already have, and producing the disambiguation with verdicts is the whole point of what I'm asking for.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy student analyzing Ian Hacking's looping effects in psychiatric classification, specifically focused on the "diagnoses aren't discovered, they're made" slogan. They want precise readings of this statement evaluated against a hypothetical case study (PMDS).

  First, I need to unpack the slogan's potential meanings along the axes they specified: what is "made" (term/criteria/people), how it's "made" (causal vs conventional), and the scope (constitutive/historical, global/local). The case study provides clear temporal markers - 2018 (pre-label cohort) and 2029 (post-label cohort) - which will test each reading's consistency.

  For the menu of readings, I consider starting from basic linguistic interpretations ("label creation") through to radical social construction ("ontological fabrication"). Each needs:
  - Clear definition
  - Verdict categorization (platitude/defensible/doubtful/false/self-undermining)
  - Job support analysis (which of the professor's three uses it justifies)
  - Temporal application to PMDS case
  - Relation to looping effects

  The user's suspicion about pragmatic instability (job 2) deserves special attention - if looping degrades validators, can cost-benefit analysis even function? I'll test this against Reading 6 (dynamic pragmatic selection).

  For the three seminar inferences:
  - (a) Committee artifact: valid only under strong constructionist readings
  - (b) Label changes reality: requires constitutive ontology
  - (c) Non-explanatory category: depends on whether the label creates or reveals

  The professor's unified reading likely falls between Readings 4-6, but I'll show why no single reading cleanly supports all three jobs without equivocation. The table will summarize key comparisons, emphasizing where verdicts change between 2018 and 2029 cohorts - that temporal sensitivity is crucial.

  Throughout, I'll maintain strict adherence to the case's stipulated facts without importing real-world psychiatric knowledge. The goal is conceptual clarity, not clinical resolution.
answer: |-
  ### Disambiguation of "Diagnoses Aren't Discovered, They're Made"  

  #### **Key Axes of Ambiguity**  
  - **What is "made"?** (Term, Criteria, People/Kind)  
  - **How "made"?** (Causally produced by classification practices vs. Conventionally selected from pre-existing phenomena)  
  - **Status of claim:** Constitutive (category/people *could not exist* without label) vs. Causal/Historical (label *alters* but doesn’t *create* the kind)  
  - **Scope:** Global (all psychiatric kinds) vs. Local (only some, e.g., those with looping effects).  

  ---

  ### Menu of Readings (Ordered Platitudinous → Radical)  

  1. **Terminological Stipulation**  
     - **Reading:** Diagnostic *terms* (e.g., "PMDS") are human inventions, not pre-existing names found in nature.  
     - **Verdict:** Trivial platitude (all language is conventional).  
     - **Supports job:** (1) — questions about "real disorder" conflate term with referent.  
     - **Looping relation:** Compatible but irrelevant; looping requires more than label creation.  
     - **2018 cohort:** Term "made," phenomenon discovered.  
     - **2029 cohort:** Term "made," phenomenon altered by looping.  
     - **Changes?** No.  

  2. **Criteria as Operational Definitions**  
     - **Reading:** Diagnostic *criteria* are pragmatically constructed to track clusters of symptoms, not discovered natural boundaries.  
     - **Verdict:** Substantive and defensible (reflects DSM’s explicit methodology).  
     - **Supports job:** (2) — criteria reflect policy choices (e.g., functional items added/dropped).  
     - **Looping relation:** Compatible; criteria revisions may respond to looping.  
     - **2018 cohort:** Criteria "made" post-hoc for observed phenomena.  
     - **2029 cohort:** Criteria remade to address degraded discriminability.  
     - **Changes?** Degree of pragmatic adjustment increases.  

  3. **Conventional Selection from Phenomena**  
     - **Reading:** The *category* carves phenomena (e.g., motivational depletion) at contingent joints based on utility, not mind-independent structure.  
     - **Verdict:** Substantive and defensible (aligns with Hacking’s "interactive kinds").  
     - **Supports job:** (1) and (2) — "real disorder?" misplaces natural-kind realism; policy shapes boundaries.  
     - **Looping relation:** Entails possibility of looping (if kind interacts with label).  
     - **2018 cohort:** Category "made" to describe lesion-linked phenomenon.  
     - **2029 cohort:** Category remade for socially amplified presentations.  
     - **Changes?** Referent shifts due to looping.  

  4. **Causal Production of Symptoms**  
     - **Reading:** The *diagnostic label* alters patients’ experiences and behaviors (e.g., symptom reporting, self-conception), thereby changing the phenomenon.  
     - **Verdict:** Substantive and defensible (empirically shown in PMDS: criteria vocabulary adoption, remission post-community).  
     - **Supports job:** (2) — cost-benefit must include iatrogenic effects.  
     - **Looping relation:** Directly entails Hacking-style looping.  
     - **2018 cohort:** Phenomenon discovered; minimal label effect.  
     - **2029 cohort:** Phenomenon partially "made" via diagnostic socialization.  
     - **Changes?** **Yes** — shifts from discovered to co-constructed.  

  5. **Constitutive Dependence on Classification**  
     - **Reading:** The *kind itself* (PMDS as experienced) could not exist without the diagnostic framework (e.g., "inability to initiate" gains coherence as a medicalized experience via the label).  
     - **Verdict:** Substantive but doubtful (2018 cohort suggests pre-label phenomenology).  
     - **Supports job:** (3) — if kind is constituted by practices, it cannot be a natural kind.  
     - **Looping relation:** Strengthens looping; labels create ontological conditions for the kind.  
     - **2018 cohort:** Discovered (label absent).  
     - **2029 cohort:** Constitutively "made" (experience structured by PMDS identity).  
     - **Changes?** **Yes** — ontology differs between cohorts.  

  6. **Global Dynamic Construct Validity**  
     - **Reading:** *All* psychiatric categories are provisional constructs that evolve via looping, so validators (e.g., biomarkers) are inherently unstable.  
     - **Verdict:** Substantive but doubtful (overgeneralizes; some disorders may be stable).  
     - **Supports job:** (3) — undermines natural-kind status of all psychiatry.  
     - **Looping relation:** Assumes global looping susceptibility.  
     - **2018 cohort:** Potentially discoverable if looping absent.  
     - **2029 cohort:** "Made" due to looping.  
     - **Changes?** **Yes** — scope claim fails if 2018 had no looping.  

  7. **Ontological Fabrication**  
     - **Reading:** The *people classified* are "made" into new kinds of persons (e.g., "PMDSer" identity creates a social reality that replaces the pre-label condition).  
     - **Verdict:** Self-undermining (if fabrication is total, no pre-fabrication phenomenon exists to justify the initial category).  
     - **Supports job:** (3) — denies natural-kind status.  
     - **Looping relation:** Radicalizes looping into total construction.  
     - **2018 cohort:** Contradiction (fabrication requires a label).  
     - **2029 cohort:** "Made" (if identity wholly constructs the illness).  
     - **Changes?** Incoherent for 2018.  

  ---

  ### Summary Table  
  | Reading                  | Verdict                     | Supports Job | Looping Relation          | 2018 Cohort | 2029 Cohort |  
  |--------------------------|-----------------------------|--------------|---------------------------|-------------|-------------|  
  | 1. Terminological        | Trivial platitude           | (1)          | Compatible                | Made (term) | Made (term) |  
  | 2. Criteria Definition   | Substantive/defensible      | (2)          | Compatible                | Made        | Remade      |  
  | 3. Conventional Selection| Substantive/defensible      | (1),(2)      | Entails possibility       | Made        | Remade      |  
  | 4. Causal Production     | Substantive/defensible      | (2)          | Entails looping           | Discovered  | Made        |  
  | 5. Constitutive Dependence| Substantive/doubtful       | (3)          | Strengthens looping       | Discovered  | Made        |  
  | 6. Global Dynamic Validity| Substantive/doubtful       | (3)          | Assumes global looping    | Discovered? | Made        |  
  | 7. Ontological Fabrication| Self-undermining           | (3)          | Radicalizes looping       | Neither     | Made        |  

  ---

  ### Assessment of Seminar Inferences  
  **(a) "Committee-made criteria imply the kind is an artifact"**  
  - **Valid under:** Readings 2, 3, 6.  
  - **Fails under:** 1 (terms ≠ kinds), 4–5 (criteria track real but mutable phenomena), 7 (incoherent).  
  - **Problem:** Conflates *definition* with *referent*. Committees make criteria, not necessarily the phenomenon.  

  **(b) "Label changes people → not real, not natural kind, no stable science"**  
  - **Valid under:** Readings 5–7 (constitutive/global claims).  
  - **Fails under:** 1–4 (change ≠ unreality; natural kinds can be interactive).  
  - **Problem:** Assumes natural kinds must be immutable. Hacking: Interactive kinds can be real and studied scientifically, albeit historically.  

  **(c) "No label → no experience → category nonexplanatory"**  
  - **Valid under:** Readings 5,7 (constitutive ontology).  
  - **Fails under:** 3–4 (label *modifies* experience but doesn’t create it *ex nihilo*; PMDS 2018 existed pre-label).  
  - **Problem:** Confuses *necessary contextual factor* with *sole cause*. The label mediates but doesn’t erase pre-label phenomena.  

  ---

  ### Professor’s Slogan: Unified Reading?  
  - **No single reading supports all three jobs.**  
  - **Job (2) (policy choice)** is best supported by Readings 2–4 (pragmatic criteria, conventional selection, causal effects).  
  - **Job (3) (no natural kinds)** requires Readings 5–7 (constitutive/global claims), which undermine Job (2): If validators drift uncontrollably (PMDS: shrinking treatment effects, drifting biomarkers), cost-benefit analysis lacks stable evidence. *Your suspicion is correct*: Looping degrades the very data pragmatism needs.  
  - **Job (1) ("real disorder" malformed)** is supported by nearly all readings but is trivial under Reading 1.  
  - **Rhetorical mechanism:** The slogan slides from platitude (Reading 1) to radical (Reading 5–7) without marking the shift. The professor likely **intends Reading 5 (Constitutive Dependence)** for Jobs (1)/(3) and Reading 4 (Causal Production) for Job (2), but these are incompatible: Constitutive claims deny the pre-label reality that causal claims require.  

  ### Looping and Antirealism  
  Looping **does not entail antirealism**. It shows that:  
  - Classifications alter human kinds (empirical claim).  
  - This complicates but doesn’t preclude scientific study (e.g., tracking loops is part of the science).  
  - Natural kinds can be interactive and historical (Hacking’s point).  
  Antirealism (Jobs 1/3) requires **additional philosophical commitments** (e.g., constitutive social construction).  

  ### Professor’s Likely Meaning  
  Given usage for all three jobs, the professor conflates **Reading 4 (Causal Production)** for Job (2) and **Reading 5 (Constitutive Dependence)** for Jobs (1)/(3). This is inconsistent but rhetorically potent. The case shows why: PMDS 2018 supports Reading 4 (minimal looping), while PMDS 2029 supports Reading 5 (identity-constituted experience). The slogan’s ambiguity masks this tension.
