answer: |-
  ### Self-Diagnostic Handout: Which Account of Play in the Centipede Game Are You Actually Committed To?

  **Objective**: This handout helps you identify your implicit assumptions about rational play in the centipede game. We use a six-node centipede game with the following payoffs (in dollars). Player 1 moves first at node 1, Player 2 at node 2, and so on. Taking ends the game immediately; passing moves play to the next node. Taking is forced at node 6.  
  - **Node 1 (P1)**: Take: (1, 0); Pass → Node 2  
  - **Node 2 (P2)**: Take: (0.5, 2); Pass → Node 3  
  - **Node 3 (P1)**: Take: (3, 1); Pass → Node 4  
  - **Node 4 (P2)**: Take: (2, 4); Pass → Node 5  
  - **Node 5 (P1)**: Take: (5, 3); Pass → Node 6  
  - **Node 6 (P2)**: Take: (4, 6)  

  At every node, taking now yields a higher payoff than passing if the next player takes immediately afterward (e.g., at node 1, taking gives P1 $1, while passing would give $0.5 if P2 takes at node 2). The backward-induction solution (both players take at their first opportunity, ending at (1,0)) relies on five premises:  
  1. **Monetary Maximization**: Players maximize only their own monetary payoff.  
  2. **Mutual Belief in Rationality**: Each believes the other maximizes monetary payoff.  
  3. **Common Knowledge of Rationality (CKR)**: Beliefs in rationality hold to arbitrarily high orders.  
  4. **Mutual Knowledge of Payoffs**: The payoff structure is known to both.  
  5. **Robustness**: Each player’s belief in the other’s rationality survives the counterfactual supposition that they themselves deviated (e.g., "If I passed, would I still believe the other is rational?").  

  If all premises hold, backward induction is unavoidable. Yet people often pass early in experiments. To explain this, you must reject at least one premise. This flowchart uses concrete cases to reveal which one(s) you reject. Answer each question based on your intuition—no prior literature knowledge is needed. Labels for your position appear only at the end.

  ---

  #### Diagnostic Questions  
  *Answer sequentially. Choose one option per question.*

  1. **Standard Game (node 1)**: At node 1, would you take or pass?  
     - **Take** → Go to 2.  
     - **Pass** → Go to 3.  

  2. **Counterfactual Necessity**: Do you believe you *must* consider what would happen if you passed at node 1 to justify taking?  
     - **Yes** → **Leaf 1** (Proof-Is-Right View).  
     - **No** → **Leaf 8** (Counterfactual Blindness).  

  3. **Standard Game (node 3)**: Suppose you passed at node 1, and Player 2 then passed at node 2 (costing themselves at least $1 in immediate payoff). At node 3, would you take or pass?  
     - **Take** → Go to 4.  
     - **Pass** → Go to 5.  

  4. **Announcement Variant**: Before the game, a reliable authority announces: "Both players are rational payoff maximizers and will take at their first opportunity." At node 1 in this variant, would you take or pass?  
     - **Take** → **Leaf 3** (Counterfactual View).  
     - **Pass** → Go to 6.  

  5. **High-Stakes Variant**: All payoffs are multiplied by 20 (e.g., taking at node 1 gives $20, passing gives $10 if P2 takes, etc.). At node 1, would you take or pass?  
     - **Take** → **Leaf 2** (Tremble View).  
     - **Pass** → Go to 7.  

  6. **Announcement Payoff Maximization**: In the announcement variant (from Q4), do you believe passing at node 1 maximizes your *expected monetary payoff*?  
     - **Yes** → **Leaf 4** (Belief-Dependence View).  
     - **No** → **Leaf 5** (Mis-Specification View).  

  7. **High-Stakes Payoff Maximization**: In the high-stakes variant (from Q5), do you believe passing at node 1 maximizes your *expected monetary payoff*?  
     - **Yes** → **Leaf 6** (Collective View).  
     - **No** → **Leaf 5** (Mis-Specification View).  

  ---

  #### Key to Positions  
  Based on your answers, you land on one of eight positions. Each rejects one or more premises of the backward-induction argument:  

  - **Leaf 1: Proof-Is-Right View**  
    You reject no premises. Backward induction is normatively correct; passing is always an error. Experimental data reflect mistakes, not rationality. (Premises upheld: All.)  
  - **Leaf 2: Tremble View**  
    You reject CKR (Premise 3). Passing is rational if there’s a small chance the other player isn’t rational (e.g., they might "tremble" and pass). High stakes reduce this chance, explaining why people take earlier when payoffs are scaled.  
  - **Leaf 3: Counterfactual View**  
    You reject robustness (Premise 5). A player can be fully rational yet refuse to specify beliefs at unreachable nodes (e.g., "What would I believe if I passed?" is meaningless). The announcement variant "fixes" beliefs, making taking rational.  
  - **Leaf 4: Belief-Dependence View**  
    You reject CKR (Premise 3) or robustness (5). Players’ beliefs are interdependent: passing signals intent, making the other player more likely to pass. The announcement doesn’t override this, so passing remains rational.  
  - **Leaf 5: Mis-Specification View**  
    You reject monetary maximization (Premise 1). Players care about fairness, the other’s payoff, or avoiding being the first to take. Scaling payoffs doesn’t change this, so behavior persists in high-stakes games.  
  - **Leaf 6: Collective View**  
    You reject the individual agency assumption (implied by all premises). Players reason as a collective ("What should we do?") to maximize joint payoffs. Thus, passing is rational regardless of stakes.  
  - **Leaf 7: Quietist View**  
    *Not directly tested in the flowchart.* You hold that normative rationality (what players *should* do) is separate from predictive behavior (what they *do*). Experimental data can’t settle normative questions.  
  - **Leaf 8: Counterfactual Blindness**  
    You reject robustness (Premise 5) but for a specific reason: Rationality constrains only the belief-revision policy you actually use. You don’t evaluate counterfactual policies (e.g., "What if I passed?"), so backward induction doesn’t apply.  

  **Notes on Positions**:  
  - **Counterfactual Blindness (Leaf 8) vs. Counterfactual View (Leaf 3)**: Both reject robustness, but Leaf 8 denies *any* content to counterfactual beliefs (they are "blind"), while Leaf 3 allows beliefs but rejects their robustness. To separate them, ask: "If you had passed, would the question 'What would I believe?' have a true answer?" Leaf 3 says yes (but it’s not robust); Leaf 8 says no.  
  - **Quietist View (Leaf 7)**: This is a meta-position. If you think normative and predictive questions are fundamentally distinct, you might hold this regardless of your other answers.  

  ---

  #### Experimental Results and Discrimination  
  *From our in-class replication (n=240 undergraduates)*:  
  - Median taking node: 3  
  - Take immediately (node 1): ≈12.5% (1/8)  
  - Pass after learning the other just passed: ≈70% (7/10)  
  - High-stakes (20× payoffs): Median taking node shifts earlier (but not to node 1)  

  **Discrimination Summary**:  
  - **Supported**: Tremble (Leaf 2), Belief-Dependence (Leaf 4), and Mis-Specification (Leaf 5) views. High-stakes shift behavior, ruling out views insensitive to stakes (e.g., strict Collective View).  
  - **Challenged**: Proof-Is-Right (Leaf 1) and Counterfactual Blindness (Leaf 8) predict widespread taking at node 1; only 12.5% do.  
  - **Unfalsifiable by this data**: Quietist (Leaf 7) is compatible with all outcomes.  
  - **Empirically Indistinguishable**: Belief-Dependence (Leaf 4) and Mis-Specification (Leaf 5) both predict passing after seeing a pass (70% rate) and stakes sensitivity. To separate, ask: "If you knew the other player would *always* take next, would you pass at node 1?"  
    - Yes → Leaf 5 (rejects monetary maximization).  
    - No → Leaf 4 (retains monetary maximization but rejects belief independence).  

