  #### Student Examples  
  We ran three students through the instrument:  

  - **Student A**: Takes at node 1 (Q1: Take) and answers "Yes" to counterfactual necessity (Q2: Yes).  
    - **Leaf**: Proof-Is-Right (Leaf 1).  
    - **Analysis**: She calls passing an "error" but finds it "understandable," aligning with Leaf 1’s view that data reflect mistakes. The handout should tell her: "You uphold all premises of backward induction. Experimental data do not challenge its normative validity for you."  

  - **Student B**: Passes at node 1 (Q1: Pass), takes at node 3 (Q3: Take), and takes in the announcement variant (Q4: Take).  
    - **Leaf**: Counterfactual View (Leaf 3).  
    - **Analysis**: Her answer to "take immediately after learning the other passed" fits Leaf 3. She might not know the term "counterfactual view," but the diagnostic places her here. The handout should explain: "You reject robustness. Your belief in the other’s rationality isn’t held fixed if you deviate."  

  - **Student C**: Passes at node 1 (Q1: Pass) and node 3 (Q3: Pass), passes in high-stakes (Q5: Pass), and says passing maximizes payoff (Q7: Yes).  
    - **Leaf**: Collective View (Leaf 6).  
    - **Analysis**: She insists passing maximizes payoff and denies the counterfactual question ("what would I believe if I took?"), which aligns with Leaf 6. The handout should note: "You reason as a collective unit. The counterfactual question might feel irrelevant because you focus on joint outcomes."  

