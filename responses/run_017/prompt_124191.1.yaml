prompt: |-
  I should be grateful for your help with a problem that has been nagging at me since I took up philosophy four years ago, having retired after forty years as a hydrologist and water-resources engineer. I still write expert reports, for solicitors and occasionally for inquiries, and a good part of my working life has consisted in saying — and being paid to say — that this failure caused that flood. My professional instinct is that causation is a matter of continuous physical process: water, energy, momentum, a chain of events one could in principle instrument. An absence has no energy and no momentum, and on the face of it cannot push anything. Yet my reports are full of absences. I should like to know whether there is a coherent principle behind the verdicts I actually give, or whether I have been equivocating for decades.

  Below are the cases with the verdicts I give before I begin theorising. I have invented the details, but they are the shapes of situation I have met repeatedly.

  1. I promised to water a colleague's tomato seedlings in her greenhouse during the July heatwave. I forgot. They died of desiccation. Verdict: I caused their deaths. I will not give this up.

  2. The same, except that the seedlings were already infected with a wilt that was lethal irrespective of watering. Verdict: my omission caused them to die on the Tuesday rather than the Friday; it did not cause their deaths. Before I knew about the fungus I would have said otherwise, and I am not convinced that this is merely a change of evidence rather than a change of verdict.

  3. A night-duty operator did not open a spillway, because a contractor had mis-set the alarm threshold three years earlier and no alarm sounded. The reservoir overtopped and the town downstream was flooded. Verdict: I would write that her omission caused the flood, and that the contractor's omission was a background condition. I cannot say whether "background condition" is a weaker causal claim or not a causal claim at all.

  4. A sluice controller's firmware failed to issue the open command because of a coding fault. No human was in the loop. The marsh was not flushed and the reedbeds died. Verdict: unhesitatingly, the fault caused the dieback. I record this because I am entirely comfortable with an absence here — I treat it as a machine having failed — and entirely uncomfortable with the human cases, which troubles me.

  5. A pumping station's backup generator had been left unserviceable through a maintenance omission. A fire destroyed the mains transformer and the generator with it. Verdict: the maintenance omission did not cause the pumping failure, even though but for it the generator would have run. Had the fire taken only the mains, I should have said without pausing that the omission was the cause. My verdict thus seems to turn on whether the safeguard would in fact have been called upon, not on whether it was in place.

  6. A levee required a hundred sheet-piles. The ganger ordered ninety-nine. The breach began precisely where the hundredth would have stood. Verdict: the omission caused the breach, notwithstanding that a single pile is a negligible fraction of the defence. I suspect I hold this verdict partly for a bad reason: it is where the engineer points.

  7. I did not write to my MP about flood-defence maintenance, and neither did ten million others. Verdict: my omission caused nothing. I am tempted to add that the electorate's collective failure did cause something, and I cannot say what that amounts to.

  8. The pair I cannot reconcile. (a) In 1962 a catchment board considered planting a shelterbelt on a slope and minuted a decision not to. In 2011 the slope failed and buried three houses; an arboriculturalist colleague assures me the root cohesion would have held it. Verdict: the 1962 decision caused the 2011 failure. (b) In 2013 a storm surge flooded a town for which no sea wall had ever been proposed. Verdict: I refuse to say that the absence of a sea wall caused that flooding. The only difference I can find is that in the first case someone considered the measure and declined it, and in the second nobody did — and I dislike that, because what a board minuted in 1962 cannot, it seems to me, be among the causes of a hillside failing in 2011. Had the town rejected a sea wall on cost grounds in 1970, I should be much more inclined to call its absence a cause, and I cannot see why a fifty-year-old vote should make a difference to what the water did.

  9. The case on which I oscillate. The duty officer did not telephone the downstream warden, because the shared dashboard showed a green tick indicating that the automatic alert had gone out. The alert had in fact failed silently and the tick was stale. On Mondays I say her omission was a cause: she was the last safeguard and she did not act. On Thursdays I say it was not: she had excellent reason to think acting unnecessary, and the cause was the telemetry failure. I cannot settle which of these is my considered view.

  What I want is the principle, if there is one. Please state it precisely enough to be applied, and say which of my cases motivates each of its clauses. In particular:

  - Which of my verdicts it cannot accommodate, and which of them you think I ought to overturn. I would rather give up a verdict than keep a principle that only fits by being baroque, but I should like to be told the price of each.
  - Whether the pattern I have described is a pattern of causal judgements at all, or whether I have been tracking blame, responsibility, or explanatory salience and calling it causation. If the latter, tell me what I should put in an expert report instead.
  - Whether a principle is available on which what people expected, planned, promised, or were employed to do is irrelevant to whether their omission was a cause. I should prefer such a principle, on the ground that causation should be the sort of thing a hillside does not care about; but if my own verdicts in cases 1, 3, 8 and 9 foreclose it, say so plainly.
  - What the principle predicts for two cases I have not listed: first, an omission attributed to a nine-person committee in which no individual member was tasked with the action; and second, an omission that merely permits an already-begun harmful process to continue, as where an operator does not close a valve on a leak that started before his shift. I notice I find "he allowed the tank to empty" much easier to write than "he caused the tank to empty", and I should like to know whether that ease is principled.

  I am not asking for a bibliography or for the names of the positions I have stumbled into; I can find those myself. I want the principle, the verdicts it forces, and the verdicts it costs me.
reasoning: |-
  Okay, the user is a retired hydrologist and water-resources engineer with 40 years of experience who now writes expert reports on causation in flood cases. He's struggling with the philosophical problem of how absences (omissions) can be causes, given his professional instinct that causation requires continuous physical processes. He's provided 9 detailed case studies with his intuitive verdicts and wants a coherent principle that explains them.

  Hmm, this is a deep philosophical puzzle at the intersection of metaphysics and practical engineering judgment. The core tension is between his physical intuition (causation requires energy transfer) and his professional practice (constantly citing omissions as causes in reports). His cases reveal nuanced distinctions that need explaining - like why some omissions feel causal (case 1) while others don't (case 7), and why timing matters (case 2) or human intention complicates things (case 8).

  I notice he's particularly troubled by the inconsistency between human vs machine omissions (case 4) and committee decisions vs natural absences (case 8). His oscillation in case 9 shows genuine uncertainty about mental states' role. The pumping station case (5) suggests he distinguishes between potential preventions and actual preventions, which is important.

  What he really needs is a practical principle he can apply in court reports - not academic theories. He explicitly rejects "baroque" solutions and wants to know which verdicts he must sacrifice for consistency. There's also ethical weight here: his reports affect legal outcomes, so he needs defensible criteria.

  The key insight emerging from his cases is that omissions aren't causes per se, but become significant through functional roles in prevention systems. This explains why the tomato watering (1) feels causal (he had a prevention role) but not writing to MPs (7) (no specific role). The machine case (4) works because "failure" implies deviation from designed function.

  For his unresolved cases: Case 8a/b suggests he intuitively requires a counterfactual intervention point - a concrete alternative where prevention was possible but rejected. Case 9's dilemma might resolve by distinguishing primary cause (telemetry failure) from contributory cause (officer's omission given dashboard error).

  His discomfort with "allowed" vs "caused" in the tank example is telling - it reveals our language already distinguishes between initiating and sustaining causes. A good principle should preserve that intuition.

  The proposed principle has three testable parts: (1) actual prevention capacity, (2) designated function, (3) specific intervention point. This neatly handles his cases while costing only two verdicts (8a and 6) that he admits are shaky. Importantly, it makes causation about systems rather than metaphysics - fitting his engineering mindset.
answer: |-
  Based on your cases and the need for a principle applicable to expert reports, I propose this **Preventative Function Principle**:

  **An omission is a cause of harm if and only if:**
  **1.  The omitted action was a *specific, functionally designated means* of preventing that type of harm within a relevant system;**
  **2.  The actor/component had the *actual capacity* to perform the action at the critical time; and**
  **3.  Performing the action would have *actually prevented or substantially mitigated* the specific harm that occurred.**

  **Why this principle?** It grounds causal claims about omissions in concrete systems and capacities, avoiding metaphysics while reflecting your intuitive verdicts in most cases. It focuses on *prevention* rather than initiation, and on *functional roles* within systems (natural, engineered, or social).

  **Application to Your Cases & Motivation:**

  1.  **Tomatoes (Forgot):** *Caused*. (1) Watering was the *specific, functionally designated means* (your promise, plant needs) to prevent desiccation. (2) You had capacity. (3) Watering would have prevented death. **(Motivates all 3 clauses: specific prevention role, capacity, actual efficacy).**
  2.  **Tomatoes (Fungus):** *Did not cause death*. Clause (3) fails: Watering wouldn't have prevented death, only delayed it. Verdict accommodated. **(Motivates Clause 3 - actual prevention of the harm).**
  3.  **Operator Omission:** *Caused*. (1) Opening the spillway upon alarm is the *specific, functionally designated means* (her job, system design) to prevent overtopping. (2) She had capacity (physically). (3) Opening would have prevented overtopping. *Contractor's omission:* Fails Clause (1) for *this specific harm*. The alarm threshold mis-setting wasn't the *specific means* to prevent overtopping *at the operator level*; it was a failure ensuring the *trigger* for her specific means didn't work. "Background condition" = failure to meet Clause (1) for causing *this* flood. **(Motivates Clause 1 - specific functional role).**
  4.  **Firmware Fault:** *Caused*. (1) Issuing the open command is the *specific, functionally designated means* (its programmed purpose) to flush the marsh. (2) The firmware *as a component* had the designed capacity (though faulty). (3) Correctly issuing the command would have prevented dieback. Your comfort stems from the clear functional designation (Clause 1). **(Motivates applying "actor/component" broadly to designed systems).**
  5.  **Generator Maintenance (Fire took both):** *Did not cause pumping failure*. Clause (3) fails: Even if maintained, the generator would *not* have run (it was destroyed), so it wouldn't have prevented the failure. *If fire only took mains:* *Caused*. Clause (3) holds: The maintained generator *would* have run and prevented the failure. Verdict accommodated. **(Strongly motivates Clause 3 - actual prevention *in the specific scenario*).**
  6.  **Missing Sheet-Pile:** *Did not cause breach* (Principle forces overturn). Fails Clause (3): Adding the 100th pile *might* have prevented *that specific breach location*, but the omission didn't create the *actual capacity gap* causing the breach; the breach occurred because the *entire structure as built* was insufficient at that point (99 piles). The omission created an *inherently vulnerable design*, not the *specific absence triggering failure* at T=0. Your "bad reason" (pointing engineer) points to responsibility/blame, not causation. **Price: Overturn this verdict.**
  7.  **Not Writing to MP:** *Caused nothing*. Fails Clause (1): Writing to your MP wasn't the *specific, functionally designated means* for *you* to prevent inadequate maintenance. No system designated *your specific letter* as the prevention mechanism. *Collective failure:* Might meet Clause (1) if "the electorate" is seen as the designated preventer via democratic pressure, but Clause (2) (actual capacity of "the electorate" to act cohesively) is highly dubious at the specific time. Verdict accommodated. **(Motivates specificity in Clause 1 & practical capacity in Clause 2).**
  8a. **1962 Decision (Not Plant):** *Did not cause failure* (Principle forces overturn). Fails Clause (3) *and* arguably Clause (1)/(2). (3) The 1962 decision didn't *prevent* the 2011 failure; it resulted in the *absence of the belt*, which was the actual background condition. The cause was the slope failure mechanism acting on the *actual conditions* (no belt). The decision was remote in time; its "effect" was the persistent state of "no belt." (1) The 1962 board wasn't the *specific, functionally designated means* in 2011 to prevent slope failure *at that time*. **(Price: Overturn this verdict. Motivates requiring *proximate capacity* in Clause 2 and *ongoing functional role* in Clause 1).**
  8b. **No Sea Wall Proposed:** *Did not cause flooding*. Correct verdict per principle. Fails Clause (1): There was no "omission" by a specific actor/component with a designated prevention role. The absence is just a background condition. The 1970 vote case: Still fails Clause (1) for *causing the flooding*. The vote established the *condition* (no wall), but the *cause* remains the storm surge acting on the *actual, existing defenses*. The vote might be a cause of *the absence of the wall*, but not of the *flooding* 50 years later. **Principle matches your verdict.**
  9.  **Operator (Stale Tick):** *Omission was NOT a cause* (Principle settles Thursday view). Fails Clause (2): Given the misleading dashboard (green tick), she *lacked the actual capacity* to know acting was necessary at the critical time. The *specific, functionally designated means* (her phoning) was predicated on *knowing* the alert failed, which she didn't. The cause was the telemetry failure (and perhaps the stale tick system). Your Monday view conflates *ideal role* with *actual capacity in context*. **Principle settles this oscillation (favors Thursday). Motivates strict interpretation of Clause 2 - actual capacity *in the specific circumstances*.**

  **Answers to Specific Queries:**

  1.  **Unaccommodated Verdicts / Overturns:**
      *   **Overturn Case 6 (Missing Pile):** The omission created a flawed design, not the *specific absence causing failure*.
      *   **Overturn Case 8a (1962 Decision):** Too remote; established a condition, didn't prevent the 2011 event. The cause was the slope failure acting on the absent belt.
      *   **Accommodates:** 1, 2, 3, 4, 5, 7, 8b. Settles 9 (No cause).
      *   **Price:** Giving up the "engineer points" intuition (Case 6) and the idea that a historical decision *causes* a failure decades later (Case 8a). The principle demands a tighter link between omission and *prevention of the specific incident*.

  2.  **Causation vs. Blame/Responsibility/Salience:**
      *   You *are* tracking a genuine form of causation – **causal responsibility within preventer systems**. It's not fundamental physical causation (energy transfer), but it's a robust, practical concept essential for analyzing failures in complex systems (engineered, organizational, natural). It focuses on how failures in *designated protective functions* lead to harm.
      *   **For your report:** Use this principle explicitly. State: "The omission was a cause because it constituted the failure of a specific, designated preventative function within the system, which had the capacity to act and whose action would have prevented/mitigated the harm." This anchors the causal claim in system function and counterfactual efficacy, not blame. Distinguish clearly from background conditions (fail Clause 1) and responsibility/accountability (which may involve factors beyond the causal principle, like Case 6/8a).

  3.  **Can Expectations/Plans/Promises/Employment be Irrelevant?**
      *   **No, they cannot be irrelevant.** Your verdicts (especially 1, 3, 4, 9) decisively show this. Clause 1 (*functionally designated means*) inherently involves roles defined by expectations, plans, promises (implicit or explicit), or employment (design specifications, job duties). A hillside *doesn't* care, but causation in human/engineered systems *must* account for the roles and functions assigned *to* preventers within those systems. The physical process is necessary but insufficient; the *designated preventative role* is what makes the absence significant. **Your Cases 1, 3, 4, 8a, and 9 foreclose a purely physical, role-agnostic principle for omissions-as-cause.**

  4.  **Predictions for New Cases:**
      *   **Nine-Person Committee (No individual tasked):** *Omission is NOT a cause of harm.* Likely fails **Clause 1**. If no individual was tasked, and the committee as a whole had no clear, specific procedure or designated responsibility assigned *to it* (or its members) for performing *that specific action*, then there is no "functionally designated means" embodied in an actor/component with capacity. The omission reflects a *system design flaw* (lack of clear responsibility), not the failure of a designated preventer. This matches your Case 7 (MP) intuition scaled up.
      *   **Operator Doesn't Stop Pre-existing Leak:** *Omission DID cause (allow) the emptying.* **Clause 1:** Closing the valve is the *specific, functionally designated means* (his job, system safety) to stop leaks/mitigate loss *once detected*. **Clause 2:** He has the capacity (physically, knows procedure). **Clause 3:** Closing the valve would have stopped/slowed the leak, preventing *further* emptying (substantial mitigation of the *ongoing harm*). Your linguistic ease ("allowed") reflects the sustaining/permissive nature of omissions in ongoing processes, but per this principle, it *is* causal. The cause of the *initial leak* is separate; his omission caused *the continued loss/the tank emptying*. Principle predicts "caused the continued emptying" or "caused the tank to empty (by failing to stop the leak)".

  **The Core Principle Restated & Summary:**

  Causal claims about omissions in expert reports should be based on the **failure of a specific, designated preventative function within a relevant system, where the function had the actual capacity to act and its action would have actually prevented or substantially mitigated the specific harm.**

  This principle:
  *   Explains most of your verdicts (1-5, 7, 8b, 9) and settles oscillation in Case 9.
  *   Forces you to overturn Case 6 (Missing Pile - flawed design, not triggering cause) and Case 8a (1962 Decision - established condition, not proximate preventer failure).
  *   Confirms you are tracking a legitimate, system-based form of causation essential for failure analysis, distinct from fundamental physics but grounded in function and counterfactual efficacy.
  *   Requires incorporating roles, expectations, and design (promises, employment, plans) to define the "functionally designated means."
  *   Predicts no cause for the committee omission (lack of designated role) and cause for the leak non-stopper (failure of designated ongoing mitigation function).

  The cost is abandoning causation claims for historical decisions creating latent conditions (8a) and for omissions that merely create inherent system vulnerabilities rather than failing as the immediate, designated preventer (6). The gain is a coherent, defensible principle rooted in system function and practical efficacy for your expert reports.
