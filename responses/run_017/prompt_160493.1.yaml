  ### Constructed Case for Distributive Ethics

  **Policies and States:**  
  Two people (A and B), two equally likely states (State 1 and State 2, each with probability 0.5). Policies R and S yield the following well-being outcomes:  

  | Policy | State 1 (p=0.5) | State 2 (p=0.5) |
  |--------|-----------------|-----------------|
  | R      | A: 1.000, B: 7.000 | A: 6.000, B: 1.000 |
  | S      | A: 3.100, B: 3.300 | A: 3.100, B: 3.300 |

  **Expected Well-being (Condition 1 and 2):**  
  - \( E_A(R) = 0.5 \times 1.000 + 0.5 \times 6.000 = 3.500 \)  
    \( E_B(R) = 0.5 \times 7.000 + 0.5 \times 1.000 = 4.000 \)  
  - \( E_A(S) = 0.5 \times 3.100 + 0.5 \times 3.100 = 3.100 \)  
    \( E_B(S) = 0.5 \times 3.300 + 0.5 \times 3.300 = 3.300 \)  
  Both have strictly higher expected well-being under R (A: 3.500 > 3.100; B: 4.000 > 3.300). A is the worse off in expectation under both (A: 3.500 < 4.000; A: 3.100 < 3.300), and A's expectation is reduced by choosing S (3.500 → 3.100).  

  **Condition 3 (No Pareto Dominance in Any State):**  
  - State 1: R has (1.000, 7.000), S has (3.100, 3.300). A is better off under S (3.100 > 1.000), but B is worse off (3.300 < 7.000).  
  - State 2: R has (6.000, 1.000), S has (3.100, 3.300). A is worse off under S (3.100 < 6.000), but B is better off (3.300 > 1.000).  
  Neither policy makes both better off in any state.  

  **Prioritarianism Renderings:**  
  - **Concave-transform**: \( f(u) = \sqrt{u} \) (strictly increasing, strictly concave).  
  - **Rank-weighted**: Weights \( w = (2, 1) \) for worse off and better off, respectively.  

  **Ex Post Prioritarianism (Prefers S, Condition 4):**  
  *Applies V to each state, then averages.*  
  - **Concave-transform** (\( V(u) = \sum_i \sqrt{u_i} \)):  
    - R, State 1: \( \sqrt{1.000} + \sqrt{7.000} = 1.000 + 2.646 = 3.646 \)  
      R, State 2: \( \sqrt{6.000} + \sqrt{1.000} = 2.449 + 1.000 = 3.449 \)  
      Total: \( 0.5 \times 3.646 + 0.5 \times 3.449 = 3.547 \)  
    - S, State 1: \( \sqrt{3.100} + \sqrt{3.300} = 1.761 + 1.817 = 3.578 \)  
      S, State 2: \( \sqrt{3.100} + \sqrt{3.300} = 1.761 + 1.817 = 3.578 \)  
      Total: \( 0.5 \times 3.578 + 0.5 \times 3.578 = 3.578 \)  
    **Result: 3.578 > 3.547 → S preferred.**  
  - **Rank-weighted** (\( V(u) = 2u_{\min} + u_{\max} \)):  
    - R, State 1: \( 2 \times 1.000 + 1 \times 7.000 = 9.000 \)  
      R, State 2: \( 2 \times 1.000 + 1 \times 6.000 = 8.000 \)  
      Total: \( 0.5 \times 9.000 + 0.5 \times 8.000 = 8.500 \)  
    - S, State 1: \( 2 \times 3.100 + 1 \times 3.300 = 9.500 \)  
      S, State 2: \( 2 \times 3.100 + 1 \times 3.300 = 9.500 \)  
      Total: \( 0.5 \times 9.500 + 0.5 \times 9.500 = 9.500 \)  
    **Result: 9.500 > 8.500 → S preferred.**  

  **Ex Ante Prioritarianism (Prefers R, Condition 5):**  
  *Applies V to the distribution of expected well-being.*  
  - **Concave-transform** (\( V(u) = \sum_i \sqrt{E[u_i]} \)):  
    - R: \( \sqrt{3.500} + \sqrt{4.000} = 1.871 + 2.000 = 3.871 \)  
    - S: \( \sqrt{3.100} + \sqrt{3.300} = 1.761 + 1.817 = 3.578 \)  
    **Result: 3.871 > 3.578 → R preferred.**  
  - **Rank-weighted** (\( V(u) = 2E_{\min} + E_{\max} \)):  
    - R: \( 2 \times 3.500 + 1 \times 4.000 = 11.000 \)  
    - S: \( 2 \times 3.100 + 1 \times 3.300 = 9.500 \)  
    **Result: 11.000 > 9.500 → R preferred.**  

  **What the Case Shows:**  
  This example satisfies all conditions:  
  1. Both have higher expected well-being under R.  
  2. A is worse off in expectation under both, and A’s expectation is reduced by S.  
  3. No state has Pareto dominance.  
  4. Ex post prioritarianism (both renderings) prefers S.  
  5. Ex ante prioritarianism (both renderings) prefers R.  

  ---

  ### Conceptual Analysis (Under 700 Words)  

  **Levelling Down of Prospects:**  
  What is levelled down here are **persons’ prospects** (expected well-being), not their outcomes. Both policies avoid levelling down outcomes: in each state, one person gains and one loses under S compared to R, so no state has Pareto-dominated outcomes. The deterministic levelling-down objection—which targets outcomes where someone is worse off and no one better off—cannot apply to either rendering of prioritarianism, as both are strictly increasing in each person’s well-being and would reject such outcomes. Under uncertainty, however, S lowers everyone’s *expected* well-being but is preferred by ex post prioritarianism because it achieves more equality in every possible state. This is a distinct objection: it shows that prioritarianism may prioritize equality in outcomes so highly that it endorses a policy making everyone’s prospects worse. It extends the spirit of levelling down (sacrificing aggregate welfare for equality) to the domain of expectations, but it is not identical to the original objection.  

  **Rank-Weighted Rendering as Egalitarian:**  
  The rank-weighted rendering should **not count as prioritarianism**; it is better classified as a form of **egalitarianism**. Prioritarianism requires separability (the value of a person’s well-being is independent of others), but rank-weighting violates this by assigning weights based on relative position. Its rationale—directly prioritizing the worse off via rank-dependent weights—aligns with comparative egalitarianism, which values equality intrinsically. This classification matters for assessing the example’s damage: if rank-weighting is egalitarian, the reversal might reflect a broader tension between equality and Pareto under uncertainty, not a flaw specific to prioritarianism. However, since the concave-transform (which is separable and prioritarian) also exhibits the reversal, the example still challenges the core idea that benefiting the worse off (via priority weighting) should not justify lowering their prospects.  

  **Ex Ante Over Ex Post for Prioritarianism:**  
  For a view whose rationale is that it matters more to benefit people the worse off they are, the **ex ante reading is correct**. The strongest reason is that the rationale centers on a person’s *overall life prospects*, not transient state-specific disadvantages. Ex ante prioritarianism evaluates who is worse off by their expected well-being—a measure of their global position—and weights benefits to them accordingly. In this example, A is worse off overall (expectation of 3.500 under R), so weighting A’s benefits more is consistent with the priority view. Ex post prioritarianism, by contrast, prioritizes those who are worse off in a given state (e.g., A at 1.000 in State 1 under R), even if they are not worse off prospectively. This conflates local misfortune with systemic disadvantage and leads to the perverse result of preferring a policy that harms the prospectively worse off (A). The ex ante approach better respects the focus on lifelong fairness.  

  **Confidence and Uncertainty:**  
  - **Arithmetic**: Highly confident (all values calculated to three decimals and cross-verified).  
  - **Levelling down analogue**: Moderately confident; it is a genuine analogue in spirit (sacrificing total welfare for equality) but distinct in targeting prospects.  
  - **Ex ante verdict**: Confident, as it aligns with the rationale of prioritizing the globally worse off.  
  - **Least sure claim**: That the rank-weighted rendering is unequivocally *not* prioritarian. While it violates separability, some may argue it captures priority weighting in practice, blurring the classification.
