  Now, the conceptual part.

  Levelling down: In the deterministic levelling-down objection, we reduce the well-being of the better off without benefiting anyone, which is ruled out by both versions because they are strictly increasing. In this example under uncertainty, we are not levelling down outcomes in any state. In state1, under S, A is at 3.1 and B at 3.3, while under R, A is at 1 and B at 7. So in state1, A is better off under S and B is worse off. Similarly in state2, A is worse off under S and B is better off. So no state has a levelling down of someone without benefit to another.

  However, we are reducing the expected well-being of both individuals by choosing S, and in particular, we are reducing the expectation of the worse off (A) and also of the better off (B). But the ex post prioritarianism prefers S because it produces more equality in every state.

  So what is being levelled down? It is the expected well-being of both persons. But note, the ex post view does not care about expectations per se; it cares about the distribution in each state. The objection is that we are choosing a policy that makes everyone's prospects worse (in expectation) but is preferred because it produces more equal outcomes. This is an analogue of levelling down but applied to prospects: we are worsening everyone's prospects to achieve a more equal distribution in each state.

  Is it the same objection? In the deterministic case, levelling down means making someone worse off without making anyone better off. Here, in every state, we are not making everyone worse off: in state1, A is better off and B is worse off, and in state2, vice versa. But in expectation, everyone is worse off. The ex post prioritarian does not care about expectations but about the state-wise distributions. So they see a gain in equality in each state and that outweighs the loss in total well-being. This is a different objection: it is an objection to the effect that the view sometimes prefers a policy that is Pareto inferior in expectations. It is not the same as the deterministic levelling-down objection, but it is a related objection: that the view sometimes prefers a distribution that is worse for everyone in terms of their prospects.

  Rank-weighted rendering: Should it count as prioritarianism? Prioritarianism is typically characterized by being separable and giving priority to the worse off. The rank-weighted form is not separable: the weight on a person depends on their rank, which depends on the position in the distribution. So it is more like egalitarianism. However, the term prioritarianism is sometimes used broadly to include any view that gives priority to the worse off. The distinction matters because if the rank-weighted view is egalitarian, then this example might be seen as an objection to egalitarianism under uncertainty, not to prioritarianism. But in any case, the example shows that both forms (concave and rank-weighted) are subject to the same reversal under ex post and ex ante. The damage is similar: for a view that is supposed to give priority to the worse off, it is odd that it would choose a policy that lowers the expectation of the worse off (and everyone else) for the sake of equality in each state.

  Ex ante vs ex ante: Which is correct for a view whose rationale is that it matters more to benefit people the worse off they are?

  The ex ante approach applies the priority weighting to the expectations. It says: we care about the prospects of the worse off more. So we should evaluate the distribution of expected well-being with the prioritarian weighting.

  The ex post approach applies the priority weighting to each outcome. It says: in every state, we care about the worse off in that state.

  The strongest reason for the ex ante approach is that it directly respects the rationale: it gives extra weight to benefits for people who are worse off in terms of their overall prospects. The ex post approach, by contrast, might give priority to someone who is worse off in a particular state but who is not worse off overall. In our example, in state1 under R, A is worse off (1 vs 7), but overall A has a higher expectation (3.5) than in state1 under S (3.1). The ex post approach gives extra weight to A in state1 under R because they are at 1, even though A's overall prospect is not the worst (in the ex ante sense). The ex ante approach focuses on the overall prospect: A is the worse off in expectation, so it gives extra weight to A's expectation.

  Therefore, the ex ante approach is more consistent with the rationale that we care about the overall situation of the worse off. The ex post approach might be seen as confusing the state-specific situation with the overall prospect.

  Confidence:

  - Arithmetic: Very confident. We have the numbers and they are checked.
  - That this is a genuine analogue of levelling down: Moderately confident. It is a form of Pareto inferiority in prospects, which is a new setting. But it is not the same as the deterministic levelling down.
  - Verdict on ex ante vs ex post: I am confident that the ex ante approach is more consistent with the rationale of prioritarianism.

  The claim I am least sure of: The ex post approach might be defended on the grounds that we should care about the actual outcomes, not just expectations. However, in the prioritarian rationale, it is the overall well-being level that determines the weight, and that is captured by the expectation if we are using expected utility. But this is a debated point.

