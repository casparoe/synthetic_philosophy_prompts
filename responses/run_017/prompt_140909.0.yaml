  ### Decision Tree for Classifying Positions on Cognitive Influence in Perception

  **Logical Space**: This tree has 8 nodes, each with 2–3 answers. The total combinatorial space is 1,152 possible paths (2 × 2 × 3 × 2 × 2 × 2 × 2 × 4). However, only 12 distinct positions are occupied or plausible. The tree isolates key disagreements about the *dependent variable* (what changes), *independent variable* (what causes it), *timescale*, and *shape of change*. Positions are sorted based on answers to concrete cases, not self-labels.

  ---

  #### Decision Tree Flowchart
  *Answer each question based on the vignettes (V1–V6). Proceed to the next node or leaf as directed.*

  1. **Must there be a change in how things look?**  
     - **Yes** → Node 2  
     - **No** → Node 3  

  2. **Must the change involve a new property the senses couldn’t represent before?**  
     - **Yes** → Node 4  
     - **No** → Node 4  
     - **Not necessarily** → Node 4  

  3. **Must there be a change in what is accurately discriminated?**  
     - **Yes** → Node 5  
     - **No** → Node 6  

  4. **Must the change involve early sensory processing (e.g., V1 in vision)?**  
     - **Yes** → Node 7  
     - **No** → Node 7  
     - **Irrelevant** → Node 7  

  5. **Can a standing state (e.g., background knowledge) cause the change?**  
     - **Yes** → Node 8  
     - **No** → Node 8  

  6. **Must the cause be a conscious, occurrent state (e.g., a current thought)?**  
     - **Yes** → Node 9  
     - **No** → Node 9  

  7. **Must the effect vanish immediately when the cause is removed?**  
     - **Yes** → Node 10  
     - **No** → Node 10  

  8. **What best describes the change?**  
     - **Additive** (adds new properties, e.g., a shape looks menacing) → Leaf  
     - **Substitutive** (alters intensity, e.g., red looks more saturated) → Leaf  
     - **Occlusive** (blocks perception, e.g., something isn’t seen at all) → Leaf  
     - **Any of these** → Leaf  

  ---

  #### Worked Example
  *Path for a person who says:*
  - Yes to Node 1 (change in how things look)  
  - Yes to Node 2 (must involve new properties)  
  - Yes to Node 4 (must involve early processing)  
  - Yes to Node 5 (standing state can cause it)  
  - No to Node 6 (cause need not be occurrent)  
  - No to Node 7 (effect need not vanish immediately)  
  - "Additive" at Node 8 (shape of change)  
  → **Leaf K (Rich Penetration)**

  ---

  #### Leaves (Positions)
  *Each leaf includes: a mnemonic label, a key commitment, and the least comfortable vignette. Vignette classifications: P = Genuine penetration, N = Not penetration, X = Not well-formed.*

  - **Leaf A (Strict Impenetrability)**  
    - **Commitment**: No cognitive state ever changes perception; all effects are judgment or response.  
    - **Least comfortable vignette**: V6 (phoneme restoration—suggests direct influence).  
    - **Vignettes**: V1=N, V2=N, V3=N, V4=N, V5=N, V6=N  

  - **Leaf B (Early Impenetrability)**  
    - **Commitment**: Only late perception (after early processing) can be changed by cognition.  
    - **Least comfortable vignette**: V5 (subliminal priming—may involve early processing).  
    - **Vignettes**: V1=N, V2=N, V3=P, V4=N, V5=X, V6=N  

  - **Leaf C (Judgment-Only)**  
    - **Commitment**: Apparent perceptual changes are always post-perceptual judgments.  
    - **Least comfortable vignette**: V3 (persistent face illusion—hard to dismiss as judgment).  
    - **Vignettes**: V1=N, V2=N, V3=N, V4=N, V5=N, V6=N  

  - **Leaf D (Content-Specific)**  
    - **Commitment**: Cognition changes content (what is represented) but not sensory character.  
    - **Least comfortable vignette**: V2 (Ames room—belief doesn’t alter appearance).  
    - **Vignettes**: V1=P, V2=N, V3=P, V4=X, V5=P, V6=P  

  - **Leaf E (Weak Penetrability)**  
    - **Commitment**: Only long-term learning (e.g., expertise) changes perception.  
    - **Least comfortable vignette**: V3 (short-term persistence after revocation).  
    - **Vignettes**: V1=P, V2=N, V3=N, V4=N, V5=N, V6=N  

  - **Leaf F (Additive-Only)**  
    - **Commitment**: Penetration only occurs if new properties (e.g., meaning) are added.  
    - **Least comfortable vignette**: V4 (discrimination change without appearance—not additive).  
    - **Vignettes**: V1=P, V2=N, V3=P, V4=X, V5=N, V6=P  

  - **Leaf G (Inferentialism)**  
    - **Commitment**: Perception is cognition; no boundary exists to penetrate.  
    - **Least comfortable vignette**: V2 (Ames room—highlights perception/cognition mismatch).  
    - **Vignettes**: V1=P, V2=P, V3=P, V4=P, V5=P, V6=P  

  - **Leaf H (Deflationary)**  
    - **Commitment**: The dispute is verbal; "penetration" is ill-defined.  
    - **Least comfortable vignette**: V4 (d′ change—forces a stance on measurement).  
    - **Vignettes**: V1=X, V2=X, V3=X, V4=X, V5=X, V6=X  

  - **Leaf I (Pervasive Penetration)**  
    - **Commitment**: All cognitive states (beliefs, desires, tasks) directly shape perception.  
    - **Least comfortable vignette**: V2 (Ames room—resists cognitive influence).  
    - **Vignettes**: V1=P, V2=P, V3=P, V4=P, V5=P, V6=P  

  - **Leaf J (Occlusive-Focused)**  
    - **Commitment**: Penetration must block perception (e.g., inattentional blindness).  
    - **Least comfortable vignette**: V1 (radiologist—enhances, doesn’t block, perception).  
    - **Vignettes**: V1=N, V2=N, V3=N, V4=N, V5=N, V6=N (V6 might be P if context "blocks" ambiguity)  

  - **Leaf K (Rich Penetration)**  
    - **Commitment**: Cognition adds new properties (e.g., threat, meaning) to appearance.  
    - **Least comfortable vignette**: V4 (no reported look-change—violates phenomenality).  
    - **Vignettes**: V1=P, V2=N, V3=P, V4=X, V5=P, V6=P  

  - **Leaf L (Temporal-Restricted)**  
    - **Commitment**: Effects must vanish immediately when the cause is revoked.  
    - **Least comfortable vignette**: V3 (persists after revocation).  
    - **Vignettes**: V1=P, V2=N, V3=N, V4=P, V5=P, V6=P  

  - **Leaf M (Pluralist)**  
    - **Commitment**: Penetration varies by modality/timescale; no unified answer.  
    - **Least comfortable vignette**: V4 (forces a universal dependent variable).  
    - **Vignettes**: V1=P (vision, long-term), V2=N (vision, belief), V3=P (vision, short-term), V4=P (all, d′), V5=P (vision, brief), V6=P (audition, context)  

  - **Leaf N (Undefended Combination)**  
    - **Label**: *Substitutive-Only*  
    - **Commitment**: Penetration only alters intensity (e.g., saturation, loudness), not content or properties.  
    - **Least comfortable vignette**: V6 (phoneme restoration—changes category, not intensity).  
    - **Vignettes**: V1=N (no intensity change), V2=N, V3=N, V4=P (d′ could reflect intensity), V5=P, V6=N  

  ---

  #### Routing Table (Leaves × Vignettes)
  | Leaf | Mnemonic              | V1 | V2 | V3 | V4 | V5 | V6 |  
  |------|-----------------------|----|----|----|----|----|----|  
  | A    | Strict Impenetrability| N  | N  | N  | N  | N  | N  |  
  | B    | Early Impenetrability | N  | N  | P  | N  | X  | N  |  
  | C    | Judgment-Only         | N  | N  | N  | N  | N  | N  |  
  | D    | Content-Specific      | P  | N  | P  | X  | P  | P  |  
  | E    | Weak Penetrability    | P  | N  | N  | N  | N  | N  |  
  | F    | Additive-Only         | P  | N  | P  | X  | N  | P  |  
  | G    | Inferentialism        | P  | P  | P  | P  | P  | P  |  
  | H    | Deflationary          | X  | X  | X  | X  | X  | X  |  
  | I    | Pervasive Penetration | P  | P  | P  | P  | P  | P  |  
  | J    | Occlusive-Focused     | N  | N  | N  | N  | N  | N  |  
  | K    | Rich Penetration      | P  | N  | P  | X  | P  | P  |  
  | L    | Temporal-Restricted   | P  | N  | N  | P  | P  | P  |  
  | M    | Pluralist             | P  | N  | P  | P  | P  | P  |  
  | N    | Substitutive-Only     | N  | N  | N  | P  | P  | N  |  

  ---

  #### Logically Available but Unoccupied Combinations
  1. **Dependent: Processing only; Independent: Occurrent only**  
     - *Why empty?* Incoherent—if only early processing changes count, occurrent states (transient) can’t explain long-term effects (V1).  
     - *To occupy*: Show occurrent states directly rewire early processing (e.g., V5 with measurable V1 activity).  

  2. **Shape: Occlusive; Timescale: Long-term**  
     - *Why empty?* Unattractive—occlusion (blocking) implies immediacy, while long-term effects (V1) enhance sensitivity.  
     - *To occupy*: Argue expertise "blocks" distractors (e.g., radiologist ignores noise).  

  3. **Dependent: Discrimination only; Shape: Additive**  
     - *Why empty?* Unexplored—additivity is phenomenological, discrimination is behavioral.  
     - *To occupy*: Prove new properties (e.g., threat) improve d′ without look-changes.  

  4. **Timescale: Contemporaneous only; Cause: Standing states**  
     - *Why empty?* Incoherent—standing states (enduring) can’t cause only-contemporaneous effects (V1 vs. V3).  
     - *To occupy*: Redefine "contemporaneous" as "when state is accessed" (e.g., radiologist’s knowledge is "active").  

  ---

  #### Pairs This Tree Cannot Separate
  1. **Leaf D (Content-Specific) vs. Leaf K (Rich Penetration)**  
     - **Why indistinguishable**: Both require changes in content/appearance and accept long-term causes.  
     - **Separate with**: A case where content changes without phenomenology (e.g., blindsight)—only Leaf D allows this.  

  2. **Leaf B (Early Impenetrability) vs. Leaf L (Temporal-Restricted)**  
     - **Why indistinguishable**: Both reject V3 (persistence) and accept some penetration (e.g., V3 for B, V1 for L).  
     - **Separate with**: A subliminal effect on early processing (e.g., V5 with fMRI)—Leaf B rejects, Leaf L accepts.  

  ---

  **End of Decision Tree**  
  *Use the tree by answering nodes 1–8 based on intuitions about V1–V6. Match the path to a leaf to classify the position.*
