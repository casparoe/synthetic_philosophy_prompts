prompt: |-
  I'm trying to work out what I actually think about causation by omission, starting from my verdicts on concrete cases rather than from a theory. I'd like a principle that fits the pattern — or, if the pattern doesn't hold together, to be told plainly which of my verdicts has to go.

  Here are the cases:

  (i) My neighbor promised to water my plant while I was away; she didn't; the plant died. Her not watering caused the death. This is the clearest case I have.

  (ii) A man three thousand miles away, who has never heard of me or of the plant, also didn't water it. His not watering is not a cause at all — it isn't even a candidate.

  (iii) No rain fell for six weeks and the corn crop failed. The lack of rain caused the failure, as straightforwardly as hail would have. There is no agent, no promise, and no norm anywhere in the story.

  (iv) The ICU nurse didn't give the eight o'clock dose; the patient died; the dose would have saved him. Her omission caused the death. Now add that an intruder had locked her in a supply closet. I still want to say the missed dose caused the death, but the omission no longer seems to be hers: I want to point at the intruder, or at the hospital for staffing only one nurse.

  (v) The drug would have saved the patient, but hospital policy forbids the physician from administering it, so she doesn't, and he dies. I hear this exactly like the unmodified nurse case: her not administering it caused the death, and the policy makes that omission justified rather than causally inert. Yet she violated no norm, disappointed no expectation, and did precisely what her role required.

  (vi) The dean never denied the rumor; her silence was read as confirmation; donations collapsed. Her silence caused the collapse — but the route from omission to outcome here runs through what people believed, not through any physical process.

  (vii) The case I go back and forth on: my neighbor and I each promised to water the plant, each assumed the other had done it, neither did, and it died. If either of us had acted, the plant would have lived, and yet each of us can point at the other. Sometimes I say we both caused its death, sometimes that neither of us did, and "both" feels like counting one death twice.

  The principle I keep falling back on is roughly this: an omission causes an outcome only when it is a departure from a norm, an expectation, or an established practice — when there is a "she should have acted" somewhere in the story — and otherwise it is just an absence. That gives me the verdicts I want in (i), (ii) and (iv); it seems to give the wrong answer in (iii), where nothing normative is in play at all; and (v) is the case that worries me, because it looks causally identical to (i) while being normatively its mirror image. I have also started marking a distinction between omissions properly so-called, where someone fails to act, and bare absences, where there is simply no agent to fail — but I can't tell whether that distinction is doing real work or just restating the verdicts in (ii) and (iii).

  What I want from you: a principle, or a short list of candidate principles, stated precisely enough that I could apply it myself to a new case, with the case that motivates each clause; an honest account of which of my verdicts it cannot accommodate and why that one is the right one to drop; a verdict on (vii) with the reasoning that produces it; and at least one prediction about a kind of case I haven't listed, since that is how I'll know the principle is doing work rather than redescribing my intuitions. If the best account turns out to be disjunctive — one thing going on in (iii)-style absences, another in (i)-style omissions, another in (vi)-style cases that operate through interpretation — say so and say what the cost is. And let me name what I'd count as cheating: I don't want "cause" thinned into a relation on which every absence causes everything it is counterfactually connected to, and I don't want the line that omissions never really cause anything and are at most explanatory or at most grounds for blame.
reasoning: |-
  Okay, the user is really digging deep into causation by omission here. They've laid out seven concrete cases with their intuitive verdicts and are wrestling with how to reconcile them into a coherent principle. What stands out is their methodological approach: starting from intuitions about specific cases rather than imposing a top-down theory. That's smart - it shows they're trying to build from the ground up. 

  Looking at their cases, the core tension emerges between normative elements (promises, duties) and what they call "bare absences" like the lack of rain. Case (v) is particularly tricky because it flips the normative expectation - the physician didn't administer the drug precisely because she was following norms, yet the omission still feels causal. And case (vii) with the two neighbors creates that classic overdetermination puzzle. 

  Their current principle - that omissions cause only when departing from norms - clearly struggles with the rain case (iii) where no norms exist. I notice they're already sensing this tension when they mention distinguishing between "omissions" and "absences." That distinction might be more important than they realize. 

  The user explicitly rejects two easy outs: the idea that every counterfactual dependence implies causation (which would make the man 3000 miles away a cause), and the eliminativist view that omissions aren't real causes. They want causation to do real work here, not just be a proxy for blame. 

  For case (vii), I'm leaning toward the "both caused" verdict but need to articulate why it's not double-counting. The key might be that causation isn't additive in that way - each omission was independently sufficient but both were necessary in the circumstances. 

  The prediction challenge is crucial. If I propose a principle, it must generate new judgments. I'm thinking about a variation on the locked nurse case: what if the hospital had a backup system that also failed? That might test how the principle handles multiple potential interveners. 

  Their note about case (vi) being interpretative rather than physical is astute. It suggests we might need different causal models for different kinds of effects - physical outcomes vs. social interpretations. But I worry that might lead to too disjunctive an account. 

  Ultimately, the solution probably involves anchoring omissions to specific mechanisms or processes that were "supposed to" operate, whether by nature or convention. The rain fails the natural process, the nurse fails the institutional process. That could cover both (iii) and (v) without overextending to the distant stranger.
answer: |-
  Here's a principle that fits your core intuitions while addressing the tensions, stated precisely with motivating cases, verdict adjustments, and predictions:

  **The Contextual Intervention Principle:**
  An omission (X not doing A) causes outcome O iff:
  1.  **Intervention Capacity:** In the actual context, X had both the *physical capability* and the *institutional/practical opportunity* to perform A at the relevant time.
  2.  **Default Intervener:** Within the salient causal system or framework relevant to O, X occupied a role or position such that performing A was the *expected, designated, or default intervention* to sustain the state threatened by the absence of A (or achieve the positive state O requires).
  3.  **Counterfactual Dependence:** O counterfactually depends on X's omission (i.e., if X had performed A, O would not have occurred, holding fixed the actual context *including the failures of other potential interveners*).

  **How it handles your cases:**

  1.  **Motivating Cases:**
      *   **(i) & (iv) (Nurse):** Nurse had capability/opportunity (1). She was the *designated intervener* for medication (2). Death depended on her omission (3). **→ Cause.** (In (iv), the intruder *removed* opportunity, so *nurse* lacks (1) - omission isn't *hers*. The *lack of the dose* still caused death because the *hospital system* was the default intervener (2) and failed (1/3). Pointing to intruder/hospital is identifying *why* the default intervention failed).
      *   **(ii) (Stranger):** Lacks (2). Not the designated intervener in any salient system. **→ Not a cause.**
      *   **(iii) (Rain):** No agent X. The "default intervener" for crop hydration is the *environmental system* providing rain (2). This system failed to intervene (1 - capability/opportunity is assessed for the system itself). Failure depended counterfactually (3). **→ Cause (the *lack of rain*).**
      *   **(v) (Policy):** Physician had physical capability (1). She was the *designated agent* for administering meds *within the medical system* (2). Death depended on her not administering (3). The policy *defines the role expectation* (part of 2), making it a *justified omission* within her role, but it doesn't negate her status as the default intervener whose *non-action* was necessary for the outcome. **→ Cause (her omission, justified).**
      *   **(vi) (Silence):** Dean had capability/opportunity (1). As Dean, she was the *designated communicator* regarding such rumors (2). Collapse depended on her silence (3). The "intervention" is communication; silence is the omission. **→ Cause.**
      *   **(vii) (Neighbors):** *Both* neighbors had capability/opportunity (1). *Both* were designated interveners via promise (2). Death depended on *the conjunction* of their omissions (if *either* had acted, death would not occur - but holding fixed the *other's actual omission*, it depends on each). **→ *Both* caused the death.** The feeling of "double-counting" arises because each omission was *independently sufficient* to prevent death (if only one had omitted, the plant lives), but in the actual world where *both* omitted, the outcome *depends* on the failure of each designated intervener. We don't count the death twice; we identify two necessary components of the actual causal sequence.

  2.  **Verdicts Requiring Adjustment & Why:**
      *   **Your Current Principle (Norm Departure):** You correctly note it fails (iii) & (v).
      *   **Adjustment:** The key shift is from "departure from norm" to "failure of the *default intervener* within a salient system". This covers (iii) (environmental system), (v) (medical role defined by policy), and (i)/(iv)/(vi) without requiring blame or fault. It explains why the stranger (ii) isn't a default intervener.
      *   **Cost:** This makes causation by omission inherently *context-dependent* and relative to a *salient system/framework* (medical, environmental, institutional, promissory). It rejects the idea of purely "agent-neutral" causation for omissions.

  3.  **Verdict on (vii) with Reasoning:**
      *   **Verdict:** Both neighbors caused the death.
      *   **Reasoning:** Applying the principle:
          1.  *Intervention Capacity:* Both had physical capability and opportunity (barring unforeseen obstacles). ✔️
          2.  *Default Intervener:* Both explicitly promised, making each a designated intervener within the salient system (the plant-care arrangement). ✔️
          3.  *Counterfactual Dependence (Holding Fixed Context):*
              *   Hold fixed Neighbor B's actual omission: If Neighbor A had watered, the plant would have lived. ∴ Neighbor A's omission was a cause.
              *   Hold fixed Neighbor A's actual omission: If Neighbor B had watered, the plant would have lived. ∴ Neighbor B's omission was a cause.
          *   The fact that *either* action would have sufficed doesn't negate the dependence of the outcome on the failure of *each* designated intervener in the actual scenario where *both* failed. The cause is the *conjunction of omissions* by the two designated agents.

  4.  **Predictions for New Cases:**
      *   **Case A (Backup System):** A security guard is designated to patrol a museum. An automatic laser system is the backup. Both fail simultaneously, and a theft occurs. *Prediction:* The *guard's omission* caused the theft (1: capable/opportunity?; 2: designated primary intervener; 3: dependence holding backup failure fixed). The *laser system's failure* also caused it (1: system capable?; 2: designated backup intervener; 3: dependence holding guard omission fixed). *Both* omissions caused the theft.
      *   **Case B (Unforeseen Opportunity):** A hiker (X) with no duty to anyone is the *only* person who happens to pass by a remote cliff top seconds after a stranger (Y) slips and is dangling. X could easily throw a rope but chooses not to. Y falls and dies. *Prediction:* **X's omission did *not* cause Y's death.** *Reasoning:* (1) Capability/Opportunity: ✔️ (physically present/able). (2) Default Intervener: ✖️ X had no designation (formal, implicit, or contextual) as the default intervener for saving strangers in peril on remote cliffs. No salient system placed that expectation on X. (3) Counterfactual dependence exists, but fails criterion (2). The cause is the fall/gravity/lack of secure footing. X's inaction is a moral failure, not a cause.
      *   **Case C (Policy Prevents Action):** Like (v), but the physician *wanted* to give the forbidden drug, actively tried to circumvent the policy (e.g., accessing the locked cabinet), but was physically stopped by hospital security enforcing the policy. *Prediction:* The physician's **omission *did not* cause the death.** *Reasoning:* (1) Intervention Capacity: ✖️ She lacked the *practical opportunity* due to enforced policy/security. The *lack of drug* caused death, but the physician wasn't the potential intervener who failed *in this context*; the *policy/system* prevented intervention. Point to hospital/system/security.

  **Why this isn't cheating:**

  1.  **Not Overly Thin (Counterfactuals):** It restricts counterfactuals by *holding fixed the actual context* (esp. other omissions) and crucially requires the *default intervener* status (2). This excludes the stranger (ii), the hiker (Case B), and prevents "everything" from being a cause.
  2.  **Omissions are Causes:** It affirms omissions *can* be genuine causes (not just explanations/blame), as they are the failure of an expected process within a system, making a difference to the outcome. It explains why (iii) feels causal even without an agent.
  3.  **Handles Normative Variation:** It accommodates cases where the omission is *required* by norms (v) by separating the *causal role* (failure of designated intervener) from *evaluation* (justified/unjustified, blameworthy/blameless). "Default Intervener" (2) can be defined by nature (rain), policy (physician), promise (neighbor), or role (nurse, dean), without requiring a *violation*.

  **The Cost:** The principle is inherently **disjunctive** regarding the *source* of the "default intervener" status (natural systems, institutional roles, explicit promises, implicit social expectations). However, the *logic* of the principle (1, 2, 3) remains the same across cases. The cost is accepting that causation by omission is relative to a salient causal framework or system. This matches your intuition that (iii) (rain) feels different in kind from (i) (promise), yet both feel causal. The principle provides a unified *structure* for identifying the causal omission within whichever salient system is relevant, without collapsing the differences in why someone/something is the default intervener. It does the work you need: preserving your core verdicts, resolving (v) and (vii), excluding (ii), accommodating (iii) and (vi), and generating testable predictions.
