prompt: |-
  I am writing a novel, and I would be grateful for help with a piece of its machinery.

  The novel is set over roughly eighteen months in Ashfield, a city of about ninety thousand in the industrial Midwest, and each chapter is the monthly hearing of the city's Naming and Memorials Commission: five volunteer commissioners — a retired high-school history teacher, a city attorney who advises but does not vote, a hospital chaplain, a twenty-year-old appointed by the mayor, and a small-business owner — who hear petitions about street names, statues, plaques, murals, and the names on schools and public buildings. The Commission is advisory. It must produce written findings within a week of each hearing; those findings go to the city council, which votes and may ignore them. Hearings run ninety minutes, are televised on the local cable channel and written up in a weekly paper, and the only research available is a one-page memo from the city archivist. The Commission also receives petitions it cannot research at all: the record is thin, or contested, or everyone who remembers is dead.

  I have read enough in the ethics of commemoration to know the vocabulary — the difference between honoring and merely remembering, expressive and speech-act accounts of what a monument does, whether the city is the same agent as the one that erected the thing, whether removal is a second injury or a repair, whether "it's history" is an answer — and I need neither a survey of the literature nor any citations. What I need is something the Commission can be shown actually to run.

  So: write me the procedure. Ordered questions, phrased so that a volunteer with no philosophy can ask them and recognize an answer; for each question, what counts as a sufficient answer and what counts as no answer; the point at which the procedure returns a disposition; the points at which it stops with a no; and the points at which it has to hand the question to a human being as a question of values rather than of fact. Keep the distinctions that carry the weight, and say explicitly which ones you are dropping and what is lost by dropping them.

  Three notions I have invented for the book should be built into it, and I define them here so that you can use them rather than guess at them:

  - The second audience. Every commemoration has the audience it was addressed to and the audience that inherits it: people who never chose the symbol, cannot easily exit from it, and are required to use it in the course of ordinary life — a street name they must give a 911 dispatcher, a school name on a diploma. Decide what standing the second audience has, and how it is weighed against the claims of descendants and of the original donors' intent.
  - The legibility condition. A commemoration must be able to carry its own meaning to a reasonably attentive passerby from what is on the site plus what any citizen of Ashfield can be presumed to know; anything whose meaning requires specialist knowledge not available on site is doing something other than commemorating. Then face the corollary that haunts one of my chapters: a plaque added to satisfy the condition may change what the object is.
  - Captured meaning. An object can acquire a second use that overtakes its original one — a rally point, a threat, a badge — and once it has, retaining it may not be the neutral act that "we didn't put it up" pretends. Say how the Commission should establish that capture has happened and what it should count as evidence, given the archivist's one page.

  Take a position, too, on whether the procedure treats installing and removing as mirror-image acts. My instinct is that they are not, and that the asymmetry does a great deal of work in the arguments I want my characters to have; but I would rather the procedure commit than be diplomatic.

  Then run it on three petitions, treating the facts I give you as sufficient or saying where they are not:

  1. Alden Street, named in 1904 for Josiah Alden (1831–1901), a textile mill owner whose unrestricted bequest built the public library and still funds its book budget, and who was also the author of a widely circulated nativist tract arguing that Irish immigrants were a degraded race, and whose mill by policy did not hire them. The street runs through the neighborhood where his workers lived and is now home to families descended from the people he would not employ. The petition asks that it be renamed for a local suffragist.
  2. "The Pioneer Mother," a 1926 bronze of an unnamed woman and child on the courthouse lawn, given by a women's organization that no longer exists. From the 1930s into the 1950s the lawn was the assembly point for an annual "better families" rally, and photographs from those years show the rally gathered at the statue's base. The statue has stood unremarked since. The petition asks for removal on the ground of what it came to mean; the counter-petition says you cannot remove a generic statue for what a third party did with it seventy years ago.
  3. A new pedestrian bridge is to be named. One proposal: a living developer offers a large gift to the parks fund and asks that the bridge carry his mother's name. Another: that it be named for a labor organizer who died eleven months ago, whose funeral the narrator attends in the first chapter. The Commission must decide whether either is eligible, on what standard, and whether there should be a waiting period before the recently dead are commemorated at all.

  I should declare my sympathies, since I want the procedure to be able to overrule me: I want Alden Street renamed, I want the Pioneer Mother to stay, and I want the bridge named for the labor organizer. If the procedure delivers any of those, say so; if it refuses one, tell me plainly which step does the work and what a commissioner who agreed with me would have to argue.

  Finally: tell me which two or three steps are the ones a reasonable commissioner would fight about, and give both sides of each fight in language a character could say out loud. And tell me what the procedure cannot do — which petitions it should decline to decide at all, and what it will get wrong when it is forced to decide them.

  End with a single line, with nothing after it: \answer{Alden Street: <disposition>; Pioneer Mother: <disposition>; Bridge: <disposition>}, where each disposition is one of the labels your procedure defines — for example, retain, retain with alteration, relocate, remove, or defer.
reasoning: |-
  We are constructing a procedure for the Ashfield Naming and Memorials Commission. The procedure must be operational, with clear questions and decision points. We incorporate the three concepts: second audience, legibility condition, and captured meaning.

  Procedure Outline:

  1. **Preliminary Questions (Fact-Finding)**
     - Verify the subject (what is being petitioned: name, monument, etc.)
     - Verify the requested action (rename, remove, alter, install, etc.)
     - Check the archivist's memo for basic facts and gaps.

  2. **Threshold Questions (Must be answered to proceed)**
     - Is the petition within the Commission's scope? (i.e., about a public commemoration in Ashfield)
     - Is there a clear and actionable request?
     - If the archivist's memo indicates the facts are too thin or contested to proceed, stop and recommend deferral for further research (which the Commission cannot do). Otherwise, proceed.

  3. **Core Questions (For each commemoration)**
     We break into two paths: existing commemorations (for removal/alteration) and new commemorations (for naming). They are asymmetric.

     **For Existing Commemorations (like Alden Street and the Pioneer Mother):**
     - **Question 1: Original Intent and Context**
       - What was the original intent of the commemoration? (Honoring, remembering, etc.)
       - What was the historical context? (Use archivist's memo and any uncontested facts.)
       - *Sufficient answer*: Clear statement from the memo or public record.
       - *No answer*: Contradictory or absent information. If no answer, move to Question 2 but note the gap.

     - **Question 2: Second Audience Standing**
       - Who is the second audience? (Current residents, users of the street, viewers of the statue, etc.)
       - How does the commemoration affect them in the course of ordinary life? (e.g., using the street name, seeing the statue daily)
       - *Sufficient answer*: Description of the second audience and their unavoidable interaction.
       - *No answer*: Not applicable (if the commemoration is obscure and not encountered in ordinary life). But note: a street name is always encountered.

     - **Question 3: Legibility Condition**
       - Can the meaning of the commemoration be understood by a reasonably attentive passerby with only the on-site information and common local knowledge?
       - If not, is there an alteration (e.g., a plaque) that could make it legible without changing its essential nature?
       - *Sufficient answer*: Yes (legible as is), No (not legible and no alteration can fix without changing the object), or Alteration (propose a plaque that explains, but note that the plaque may change the object).
       - *No answer*: Unclear. Proceed to Question 4.

     - **Question 4: Captured Meaning**
       - Has the commemoration acquired a secondary meaning that has overtaken the original? (e.g., become a rallying point for a hate group, a symbol of oppression, etc.)
       - What evidence is there? (e.g., documented use by groups, public perception, media coverage, ongoing controversy)
       - *Sufficient answer*: Clear evidence from the archivist's memo or public record (e.g., photos, news reports) of a captured meaning that is widely recognized.
       - *No answer*: No evidence or only contested evidence. The Commission cannot do new research, so if the memo is silent and there's no public record, it cannot be established.

     **For New Commemorations (like the bridge):**
     - **Question 1: Eligibility of the Subject**
       - Is the proposed subject (person, group, event) of significant importance to Ashfield? (Must have a substantial connection to the city.)
       - *Sufficient answer*: Clear evidence of contribution or significance to Ashfield from the archivist's memo or public record.
       - *No answer*: If the subject is not locally significant, reject.

     - **Question 2: Waiting Period (for individuals)**
       - If the subject is a recently deceased person, is there a compelling reason to waive the waiting period? (Default: 10 years unless exceptional circumstances.)
       - *Sufficient answer*: The person's impact is so immediate and profound that waiting would be a disservice. (Rare.)
       - *No answer*: Without compelling reason, defer until after the waiting period.

     - **Question 3: Donor Influence**
       - If the commemoration is tied to a donation, is the donor's influence appropriate? (Avoid "buying" names, but gifts are accepted for public benefit.)
       - The Commission must weigh: the public benefit of the gift vs. the appropriateness of the name.
       - *Sufficient answer*: The gift is substantial and the proposed name is of someone with independent significance to Ashfield. Otherwise, reject or suggest an alternative.

     - **Question 4: Second Audience Consideration (for new)**
       - Will the commemoration be legible (as defined) to the second audience? (This is prospective.)
       - *Sufficient answer*: The name or monument is clear and the meaning can be carried without specialist knowledge.

  4. **Decision Matrix for Existing Commemorations:**
     - If the commemoration fails the legibility condition and cannot be fixed by an alteration (Question 3), then recommend removal or alteration (depending on petition).
     - If captured meaning is established (Question 4) and that meaning is harmful or divisive, then recommend removal or alteration (depending on petition).
     - If the second audience (Question 2) is harmed by the commemoration (e.g., it honors someone who oppressed their ancestors) and the original intent (Question 1) was honoring (not just remembering) and the commemoration remains legible as honoring, then consider removal or renaming.
     - But note: If the original intent was merely historical (e.g., a plaque about an event) and the legibility condition is met, then it may be retained even if the event is negative.

     However, we must weigh the original intent against the second audience. The procedure prioritizes the second audience when the commemoration causes ongoing harm or is experienced as oppressive in ordinary life.

     **Dispositions for existing commemorations:**
     - **Retain**: If no harm to second audience, legible, no captured meaning, and original intent is still valid.
     - **Retain with alteration**: If legibility is the only issue (add a plaque) but note that this changes the object. Also, if captured meaning is present but can be countered by an alteration (e.g., a plaque that reframes).
     - **Relocate**: If the commemoration is not encountered in ordinary life (e.g., a statue in a park that can be moved to a museum) but the Commission is advisory and relocation may not be feasible.
     - **Remove**: If harm to second audience, captured meaning is harmful, or legibility cannot be fixed without changing the object and the meaning is harmful.
     - **Defer**: If the facts are too thin (per threshold) or if the Commission is deadlocked.

  5. **Decision Matrix for New Commemorations:**
     - If the subject is eligible and the waiting period is satisfied (or waived), then recommend approval.
     - If tied to a donation, the subject must be independently significant (not just the donor's relative) and the gift must be for public benefit without strings that compromise the Commission's standards.

     **Dispositions for new commemorations:**
     - **Approve**
     - **Reject**
     - **Defer** (if waiting period applies and no waiver)

  6. **Explicit Asymmetry**: 
     - Removing an existing commemoration requires evidence of harm (to second audience, captured meaning, or illegibility that causes misunderstanding). 
     - Installing a new one requires positive justification (significance, no harm). 
     - Thus, removal is harder to justify than rejection of a new proposal? Actually, in our case, we set a high bar for removal because of the weight of history and the potential for erasure. But we also set a high bar for new ones to avoid trivial or bought commemorations.

     We are not mirror images: 
     - For removal, we start from the presumption that the existing commemoration has a claim to remain unless there is a compelling reason (harm, illegibility, capture). 
     - For new, we start from a blank slate and require positive reasons.

  7. **Points of Contention** (where commissioners might fight):
     - **Establishing Captured Meaning**: How much evidence is enough? The archivist's one page may not have much. 
       - Side A: Without clear evidence in the record, we cannot assume capture. The burden is on the petitioner.
       - Side B: The Commission must consider current public perception, even if not well-documented, because the second audience lives with it now. But note: the Commission cannot do research. So they are limited to what is in the memo and what is presented at the hearing (but they can't verify).
     - **Second Audience Harm**: What counts as harm? 
       - Side A: Only if the commemoration is actively causing distress in the present, and that distress is widespread and reasonable.
       - Side B: The mere fact that a street is named after someone who oppressed the ancestors of current residents is harm because it forces them to honor that person.
     - **Legibility Condition and Plaques**: Does adding a plaque fix the problem or create a new one?
       - Side A: A plaque can provide context and turn a commemoration into a historical marker, which is acceptable.
       - Side B: Adding a plaque changes the nature of the object and may not be what the petitioner wants (they may want removal, not contextualization).

  8. **What the Procedure Cannot Do**:
     - It cannot resolve deep historical disputes without evidence.
     - It cannot create new research; if the memo is silent, the Commission must make a decision on the available record, which may be insufficient.
     - It cannot address petitions that are about values without factual anchors (e.g., "this statue is ugly" is not within scope).
     - It will get wrong cases where the public perception is strong but undocumented (captured meaning) because it relies on the written record.

  Now, run the three cases:

  **Case 1: Alden Street**

  - Existing commemoration: street name.
  - Petition: Rename (remove the current name).
  - Facts: 
    - Original intent: Honor Josiah Alden for his bequest that built the library.
    - Context: He was a nativist who excluded Irish immigrants; the street is in a neighborhood now home to their descendants.
  - Procedure:
    - Threshold: Within scope, actionable.
    - Question 1 (Original Intent): Honoring (bequest). Context: nativist tract and hiring policy. [Sufficient]
    - Question 2 (Second Audience): Current residents (descendants of those he excluded) must use the street name in daily life (address, 911). This causes harm by forcing them to honor someone who denigrated their ancestors. [Sufficient: harm established]
    - Question 3 (Legibility): The street name alone does not convey any meaning beyond being a name. Without context, it is not legible as honoring a nativist. But the harm comes from the knowledge of who he was, which is not on site. So legibility is not the issue. [Answer: It is legible as a name, but the meaning of honoring is not legible without context. But the harm exists even without legibility because the second audience knows the history.] 
      - However, note: the legibility condition is about the meaning to a passerby. A passerby without the historical knowledge would not know. But the second audience does know. So the harm is specific to the second audience, not the general public. The procedure must account for that.
    - Question 4 (Captured Meaning): No evidence of capture (e.g., used by hate groups). [No answer]
    - Decision: The harm to the second audience (established in Q2) is the key. The Commission should recommend renaming because the commemoration causes ongoing harm to a group that must interact with it. The original honoring intent is undermined by the harmful context that the second audience cannot ignore.

    Disposition: Remove (rename)

  **Case 2: Pioneer Mother**

  - Existing: statue.
  - Petition: Remove because of what it came to mean (the rallies).
  - Counter: It's generic and the rallies were by a third party long ago.
  - Facts:
    - Original intent: Honor pioneer mothers (generic).
    - Context: From 1930s-1950s, used as a rallying point for "better families" rallies (which were eugenics-oriented? The petition implies they were exclusionary).
    - No evidence of recent use or controversy.
  - Procedure:
    - Threshold: Within scope.
    - Question 1 (Original Intent): Honoring pioneer mothers. Generic. [Sufficient]
    - Question 2 (Second Audience): People who use the courthouse lawn. Not encountered in ordinary life in a harmful way? The statue is passive. [No harm established?]
    - Question 3 (Legibility): The statue is of a mother and child. Without context, it is legible as honoring pioneer mothers. The rallies are not part of the on-site information. [Legible as is]
    - Question 4 (Captured Meaning): 
        - Evidence: Photographs show rallies at the base. But the archivist's memo may not describe the rallies' nature. The petition says they were "better families" rallies. If the memo doesn't mention the rallies, then captured meaning is not established by the record. If the memo does mention them but not their nature, then it's unclear. The Commission cannot assume the rallies were harmful without evidence in the record. 
        - Without evidence that the statue itself became a symbol of the rallies (captured) and that this meaning persists, we cannot establish capture. 
        - Therefore, no answer for captured meaning.
    - Decision: No harm to second audience, legible, no captured meaning. Retain.

    Disposition: Retain

  **Case 3: Bridge**

  - New commemoration: naming a bridge.
  - Proposals: 
    1. Developer's mother (living donor offers gift for parks).
    2. Labor organizer (died 11 months ago).
  - Commission must decide eligibility and whether to apply a waiting period.
  - Procedure (new commemoration path):
    - For Developer's Mother:
      - Question 1 (Eligibility): Is the mother of a developer significant to Ashfield? Unless she has independent significance (e.g., philanthropist, community leader), no. [No answer in the facts given. Assume she is not significant.]
      - Question 2 (Waiting Period): Not applicable (she is alive? The proposal says "living developer" but the mother may be dead? The facts say "his mother's name". We don't know if she is alive or dead. But the gift is from the developer. If the mother is not significant, reject.
      - Question 3 (Donor Influence): The gift is tied to naming after his mother. This risks "buying" the name. Unless the mother is independently significant, reject.
      - Disposition: Reject

    - For Labor Organizer:
      - Question 1 (Eligibility): The labor organizer is locally significant (funeral in the first chapter suggests community impact). [Sufficient if the archivist's memo confirms or it's public knowledge.]
      - Question 2 (Waiting Period): Died 11 months ago. Normally 10-year wait. Is there a compelling reason? The petition says "died eleven months ago". The Commission must decide: if the impact was profound and immediate, and the community strongly supports, then waive. But without a compelling argument, defer. However, the procedure allows for exceptions. The commissioner might argue: the bridge is being built now, and the organizer's work affected the city profoundly, so waiting is not necessary. But this is a values argument.
      - Question 3 (Donor Influence): Not applicable (no donor for this proposal).
      - Question 4 (Second Audience - prospective): The name should be legible. If the labor organizer is well-known, it will be. If not, it might not. But the memo should establish recognition.

      - Decision: If the Commission waives the waiting period, approve. Otherwise, defer. The facts do not give a compelling reason, so by strict procedure, defer. But note: the novel's narrator attends the funeral, suggesting significance. However, the procedure requires a high bar for waiver. Without a clear exception, we defer.

      Disposition: For the labor organizer, defer (because of waiting period) unless the Commission finds a compelling reason to waive.

    But note: the Commission must choose between the proposals? Or can they reject both? The procedure can recommend one, both, or neither. In this case, the developer's proposal is rejected, and the labor organizer is deferred. So the bridge might be named later for the organizer or someone else.

  Given the author's sympathies: 
  - Alden Street: Procedure recommends remove (rename) -> matches.
  - Pioneer Mother: Procedure recommends retain -> matches.
  - Bridge: 
    - Developer's mother: reject -> not named for her.
    - Labor organizer: defer (because of waiting period) -> does not match (author wants it named for the organizer).

  For the bridge, a commissioner who wants to name it for the organizer would argue at the step about the waiting period: that the 10-year rule is arbitrary and that the organizer's impact is already so widely recognized and celebrated that waiting serves no purpose. They might also note that the bridge project is happening now and it would be fitting to honor the organizer while the memory is fresh.

  Points of Contention in the Bridge Case:
  - **Waiving the Waiting Period**: 
    - Side A: We have a rule for a reason – to ensure that the person's legacy endures and is not just a reaction to grief. Without a compelling reason, we must wait.
    - Side B: Rules should have exceptions. This person was a hero to our city and we should honor them now. Waiting would be a disservice to the community's desire to remember.

  Answer Line:

  \answer{Alden Street: remove; Pioneer Mother: retain; Bridge: (Developer's mother: reject, Labor organizer: defer)}
answer: |-
  ### Procedure for the Ashfield Naming and Memorials Commission  
  The procedure is designed to be a step-by-step checklist for commissioners. It prioritizes operational clarity, using simple language and binary thresholds to minimize philosophical debate. Volunteers can apply it by asking ordered questions during hearings, referencing the archivist's memo and petition facts. If a question cannot be answered with the available facts, the procedure defaults to a disposition or flags a "values gate" where commissioners must debate ethics. Asymmetry is built in: removal of existing commemorations requires evidence of harm, while new installations require proof of merit. The three custom concepts—**second audience**, **legibility condition**, and **captured meaning**—are integrated as decision filters.  

  #### Key Dispositions Defined  
  - **Retain**: No change.  
  - **Retain with alteration**: Add a plaque or contextual sign to address legibility or capture.  
  - **Relocate**: Move to a less public site (e.g., museum) if harm is localized.  
  - **Remove**: Eliminate from public space.  
  - **Defer**: Insufficient facts; recommend council delay or reject.  
  - **Approve**: For new commemorations only.  
  - **Reject**: For new commemorations only.  

  #### Procedure Steps  
  **I. Threshold Screening (5 minutes max)**  
  1. **Is the petition actionable?**  
     - *Sufficient*: Clear subject (e.g., "Alden Street") and requested action (e.g., "rename").  
     - *No answer*: Vague or symbolic requests (e.g., "remove all racist monuments"). Disposition: **Defer**.  
  2. **Does the archivist’s memo provide at least one verifiable fact?**  
     - *Sufficient*: Dates, names, or events confirmed in the memo.  
     - *No answer*: Memo states "no record" or "disputed." Disposition: **Defer**.  

  **II. For Existing Commemorations (Renaming/Removal Petitions)**  
  3. **Original intent: Was the commemoration intended to honor?**  
     - *Phrasing*: "Did the creators explicitly honor this person/event, or just mark history?"  
     - *Sufficient*: Memo or petition states honoring language (e.g., "dedicated to the memory of").  
     - *No answer*: Intent unclear. Proceed to Q4 but note ambiguity.  
  4. **Second audience harm: Does the commemoration cause ongoing burden?**  
     - *Phrasing*: "Does this force people to engage with it in daily life (e.g., saying the name, seeing it regularly), and does that cause distress?"  
     - *Sufficient*: Evidence of direct, unavoidable use (e.g., street address) and harm (e.g., descendant testimony in petition).  
     - *No answer*: No burden (e.g., obscure plaque). Proceed to Q5.  
  5. **Legibility condition: Can a passerby understand its meaning without research?**  
     - *Phrasing*: "Can someone with common Ashfield knowledge grasp why this is here from what’s on site?"  
     - *Sufficient*: Yes (e.g., statue with clear inscription).  
     - *No answer*: Meaning is opaque (e.g., unlabeled monument). Proceed to Q6.  
  6. **Captured meaning: Has public use overridden the original intent?**  
     - *Phrasing*: "Is there documented evidence it became a symbol for something else?"  
     - *Sufficient*: Photos, news reports, or testimony of consistent alternative use (e.g., rally point for harmful group).  
     - *No answer*: No evidence in memo or petition. Proceed to disposition.  

  **Disposition Rules for Existing Commemorations**  
  - If Q4 (**second audience harm**) is *sufficient* → **Remove** or **Relocate** (if relocation feasible).  
  - If Q6 (**captured meaning**) is *sufficient* → **Remove**.  
  - If Q5 (**legibility**) is *no answer* → **Retain with alteration** (add explanatory plaque).  
  - If all answers *sufficient* for retention (no harm, legible, no capture) → **Retain**.  
  - **Values gate**: If Q4 or Q6 is contested but evidence is thin, commissioners debate harm vs. history.  

  **III. For New Commemorations (Naming/Installation Petitions)**  
  7. **Subject eligibility: Is this person/event significant to Ashfield?**  
     - *Phrasing*: "Did they shape the city in a substantial, documented way?"  
     - *Sufficient*: Memo confirms local impact (e.g., "organized city’s first strike").  
     - *No answer*: Insufficient local ties. Disposition: **Reject**.  
  8. **Waiting period: If a person, has it been 10+ years since death?**  
     - *Phrasing*: "Is the legacy stable, or could new facts emerge?"  
     - *Sufficient*: 10+ years passed, or exceptional circumstances (e.g., monumental impact).  
     - *No answer*: Death within 10 years. Disposition: **Defer** unless Q9 overrides.  
  9. **Donor influence: Is the name tied to a gift?**  
     - *Phrasing*: "Would this feel like buying honor, or is the name independently deserved?"  
     - *Sufficient*: Name has merit per Q7, and gift is unconditional.  
     - *No answer*: Name lacks merit without the gift. Disposition: **Reject**.  

  **Disposition Rules for New Commemorations**  
  - If Q7 (*no answer*) or Q9 (*no answer*) → **Reject**.  
  - If Q8 (*no answer*) → **Defer** (unless 2/3 commissioners vote to waive waiting period).  
  - If all answers *sufficient* → **Approve**.  

  #### Asymmetry Explained  
  Removal requires proof of harm (prioritizing **second audience**), while installation requires proof of merit (prioritizing historical significance). This asymmetry prevents false equivalence: removing a harmful symbol is not the "mirror" of adding a positive one.  

  #### Points of Contention  
  Reasonable commissioners will fight over these steps. Language is designed for character dialogue:  
  1. **Second Audience Harm (Q4)**  
     - *Side A (retain)*: "This is just history; discomfort isn’t harm. We can’t erase the past because it’s uncomfortable."  
     - *Side B (remove)*: "Forcing people to honor their oppressor in daily life *is* harm. It’s not history—it’s a wound kept open."  

  2. **Captured Meaning (Q6)**  
     - *Side A (retain)*: "You can’t blame the statue for what others did near it. That’s guilt by association."  
     - *Side B (remove)*: "When a symbol is used for hate, it becomes hate. Keeping it up *now* is our choice, not history’s."  

  3. **Waiting Period for New Commemorations (Q8)**  
     - *Side A (defer)*: "Ten years lets passions cool. What if we learn something ugly next year?"  
     - *Side B (waive)*: "Exceptional people deserve immediate honor. Waiting dishonors their impact."  

  #### What the Procedure Cannot Do  
  - **Decline to decide**: Petitions with no facts (per Q1 or Q2) are **deferred**. Subjective petitions (e.g., "this statue is ugly") are **rejected** at Q1.  
  - **Will get wrong**: Cases where public sentiment is strong but undocumented (e.g., **captured meaning** without archival proof). It errs toward caution, risking false negatives (keeping harmful symbols) when evidence is thin.  

  ---  

  ### Case Rulings  
  **1. Alden Street**  
  - Threshold: Actionable; memo confirms Alden’s bequest and nativism.  
  - Q3 (Original intent): Honoring (bequest).  
  - Q4 (Second audience harm): **Sufficient**—descendants must use the name daily, causing distress.  
  - Disposition: **Remove** (renaming recommended).  
  - *Matches your preference*. Harm to second audience forces removal.  

  **2. Pioneer Mother**  
  - Threshold: Actionable; memo confirms statue and rallies.  
  - Q4 (Second audience harm): **No answer**—no ongoing burden (not encountered in daily life).  
  - Q5 (Legibility): **Sufficient**—generic statue, understandable as "pioneer mother."  
  - Q6 (Captured meaning): **No answer**—rallies were near it, but no evidence statue itself became a hate symbol.  
  - Disposition: **Retain**.  
  - *Matches your preference*. No captured meaning or harm proven.  

  **3. Bridge**  
  - Developer’s proposal:  
    - Q7 (Eligibility): **No answer**—mother’s significance not established.  
    - Q9 (Donor influence): **No answer**—name lacks merit without gift.  
    - Disposition: **Reject**.  
  - Labor organizer proposal:  
    - Q7 (Eligibility): **Sufficient**—local impact implied (funeral scene).  
