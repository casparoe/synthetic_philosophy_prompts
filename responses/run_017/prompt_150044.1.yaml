  Practical considerations matter too: the $190k rebranding cost versus the $150k educational proposal, the litigation risk from the land donor, and the superintendent's rededication idea which attempts compromise but problematically retains an enslaver's surname for a Black educator.

  The memo must be decisive - no splitting the difference - while acknowledging valid concerns on all sides. It needs plain language explanations of concepts like "moral injury" without academic jargon. The recommendation should include concrete steps for mascot, monogram, and portrait removal if applicable, plus budget allocation.

  The strongest losing argument deserves genuine engagement: if recommending removal, acknowledge how the name represents institutional continuity to many; if keeping, admit how it perpetuates historical violence. Either way, the educational component about the 1886 expulsion seems essential for restorative justice.
answer: |-
  **MEMORANDUM**  
  To: Naming and Memorials Committee, Rivermont Unified School District  
  From: [Your Name], Committee Member  
  Date: October 26, 2023  
  Subject: Recommendation on Whitfield Middle School Name  

  ---

  ### **BOTTOM LINE UP FRONT**  
  The Committee recommends **removing "Whitfield" from the school name effective June 2024**, adopting a new, community-chosen name by April 2024. The "Minutemen" mascot will be retired immediately. The granite "W" monogram and bronze relief will be relocated to a contextualized historical exhibit in the school library. The superintendent’s rededication proposal to Elias Whitfield is rejected. The $150,000 allocation will fund a permanent exhibit and curriculum on the 1886 expulsion, not rebranding.  

  ---

  ### **RECOMMENDATION RATIONALE**  
  The district’s policy permits name removal when the honoree’s "principal legacy" is "fundamentally at odds with the district’s mission." **Josiah Whitfield’s principal legacy includes orchestrating the violent expulsion of Chinese American residents**, an act that directly contradicts our mission to create a "safe, inclusive, and equitable learning environment." His public health and library contributions, while significant, do not negate this harm. The name’s daily use perpetuates moral injury to the 38% Asian American student body by honoring a man who destroyed their community’s ancestors. Retaining it signals district endorsement of his actions.  

  #### **Disposition of Key Elements**  
  - **Mascot**: Retire "Minutemen" immediately (symbolizes vigilante violence used in the expulsion).  
  - **Monogram & Relief**: Relocate to a library exhibit explaining *both* Whitfield’s positive works *and* the 1886 atrocity.  
  - **Timeline**: Select new name by April 2024; implement all changes by June 2024.  

  ---

  ### **RESPONSE TO THE THREE POSITIONS**  
  1. **"Present Standards Apply" (Adopted)**  
     The name *is* a daily act of honor: Diplomas, announcements, and sports uniforms invoking "Whitfield" endorse his legacy. Historical context (1959 naming) cannot sanitize ongoing harm. The district cannot claim inclusivity while memorializing ethnic cleansing.  

  2. **"Name as Neutral Identifier" (Rejected)**  
     While 62% in the poll couldn’t name Whitfield, the name’s history remains accessible and painful. The mascot ("Minutemen"), monogram, and lobby portrait actively reinforce his identity. Names are not neutral—they convey institutional values. The committee’s duty is to align names with our mission, not preserve nostalgia.  

  3. **"Removal Only if Injury Persists" (Partially Adopted)**  
     The injury *is* specific and ongoing: Students research Whitfield; the mascot glorifies violence; families see his portrait daily. While an exhibit (proposed below) is essential, it cannot coexist with the name. **Removal is necessary but insufficient alone; it must pair with education.**  

  ---

  ### **RESOLUTION OF COMPLICATIONS**  
  1. **Rededication to Elias Whitfield (Rejected)**  
     Rededicating to Elias Whitfield (a Black educator) retains an enslaver’s surname and fails to address the harm to Asian Americans. It commodifies Elias’s legacy for convenience and risks trivializing his story by tying it to a violent past. A standalone honor (e.g., new school name) would be more appropriate.  

  2. **Poll Showing Low Name Recognition (Limited Weight)**  
     The 62% unawareness does not negate harm. For those who *do* know the history—especially targeted groups—the injury is acute. Polling cannot measure trauma; policy must prioritize impacted students over general ambivalence.  

  3. **Budget and Litigation Risk**  
     - **Budget**: Allocate $150,000 to the Chinese American Heritage Coalition’s exhibit/curriculum. **Do not spend $190,000 on rebranding.** The new name should minimize costs (e.g., retain "Middle School" to reuse signage).  
     - **Litigation**: The land trust’s reversionary clause is likely unenforceable (courts rarely punish naming changes). **If sued, the district should defend the decision.** Litigation costs ($200K) are a risk but less damaging than perpetuating harm. The committee’s duty is to act justly, not avoid lawsuits.  

  ---

  ### **STRONGEST CASE FOR THE LOSING SIDE (KEEPING THE NAME)**  
  The most compelling argument for retention is that **the name now embodies the school’s 65-year identity—a vessel for collective memory** transcending Josiah Whitfield. Alumni ties, student pride in sports rivalries, and institutional continuity matter. Removal could fracture community bonds and erase decades of positive history unrelated to the honoree. For many, "Whitfield" symbolizes their childhood, not racism. Preservationists argue we can condemn Whitfield’s actions while retaining the name as a cautionary monument, using education to reconcile past and present.  

  ---

  ### **CONCLUSION**  
  Remove "Whitfield" to halt daily endorsement of racial violence. Pair this with education to transform the school’s legacy. The cost of rebranding is secondary to the moral cost of inaction. Our recommendation affirms that Rivermont schools honor no one who destroyed a community.  

  **VOTE RECOMMENDATION**: Remove the name; retire the mascot; fund the expulsion exhibit/curriculum; reject rededication.  

  ---  
  *Approx. 1,050 words. Prepared for committee vote.*
