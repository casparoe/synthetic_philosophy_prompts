  Moving to part 2, I apply the three metaontological stances. Ontological realism would say there's a fact about planetary kinds that we're discovering—predicting intense disagreement. Carnapianism frames it as choosing a linguistic framework after practical debate, which fits the vote but not the lingering resentment. Quantifier variance treats both "planet" definitions as valid, making the dispute verbal—yet this clashes with the public's sense of betrayal. Each stance captures aspects but struggles with the emotional fallout.

  Part 3 tests the user's exemplar-vs-criterion distinction. Pluto was learned as an exemplar (the ninth planet), but the IAU shifted to a criterion mid-dispute. This explains why laypeople felt robbed—it wasn't discovery but redefinition. While similar to metalinguistic negotiation, it adds psychological depth about conceptual anchoring that pure semantic frameworks lack. 

  For part 4, I note the theories ignore institutional authority. The IAU's vote imposed a costly stipulation, undermining quantifier variance's claim that such disputes are purely pragmatic. The expenses (rewriting textbooks, lost trust) suggest the dispute had substantive stakes beyond words—a gap in existing theories.

  Finally, part 5: the episode doesn't cleanly vindicate deflationism. Proponents argued the new criterion better captured planetary properties, implying external questions have factual constraints. This might force a third category—like "conceptual negotiation"—where frameworks are chosen based on fit with reality, not just utility. Admitting this could complicate metaontology but better reflects scientific practice.

  Throughout, I stay disciplined—acknowledging where theories are silent (e.g., authority, costs). The user's distinction in part 3 does novel work by explaining affective responses, though it overlaps with metalinguistic negotiation. Overall, Pluto exposes limitations in current frameworks, particularly their neglect of institutional power and the psychology of conceptual change.
answer: |-
  ### 1. Verbal Dispute Apparatus  
  **Disputed sentence:** *"Pluto is a planet."*  
  **Topic-neutral paraphrase:** *"Pluto has sufficient mass for hydrostatic equilibrium, orbits the Sun, but shares its orbital neighborhood with numerous bodies of comparable mass."*  
  **Analysis:** Parties agree on the paraphrase’s physical facts (Pluto’s roundness, solar orbit, non-dominance). The disagreement collapses into semantics over whether "planet" requires orbital dominance. *Conditions met:* The dispute is verbal—no residual factual disagreement survives paraphrase. What persists is whether "cleared the neighbourhood" is constitutive of "planet."  

  ### 2. Metaontological Stances  
  - **Ontological realism:** Asserts a fact of the matter about planetary kinds. The dispute concerns whether orbital dominance is an essential property of planets. *Phenomenology prediction:* Heat arises from competing discoveries—e.g., "We *found* Pluto isn’t a planet!" vs. "You’re ignoring facts!"  
  - **Carnapian internal/external:** Choosing a linguistic framework ("planet" definition) is an external, pragmatic decision (e.g., "Grouping dominators is useful"). Adopting a definition resolves internal questions (Pluto’s status). *Phenomenology prediction:* Resentment stems from mistaking framework choice for discovery—public feels deceived by "arbitrary" redefinition.  
  - **Quantifier variance:** Both "planet" definitions are admissible; disagreement is pragmatic (e.g., "Dwarf planet" simplifies taxonomy). *Phenomenology prediction:* Lasting dissent reflects divergent practical interests (e.g., New Horizons team retains "planet" for mission stature).  

  ### 3. Exemplar vs. Criterion Anchoring  
  **Distinction:**  
  - **Exemplar-anchored:** "Planet" learned via ostension (Pluto as paradigm). Disputes feel like discovery ("Pluto *was* demoted").  
  - **Criterion-anchored:** "Planet" defined by necessary/sufficient conditions. Disputes feel like stipulation ("We *redefined* planet").  
  **Work done:** Explains unique heat: The IAU shifted anchoring *mid-dispute* from exemplars (Pluto as planet) to criteria (orbital dominance). This reframed perceived *discovery* as *imposed stipulation*, violating public trust. While compatible with metalinguistic negotiation, it adds psychological depth: Exemplar shifts trigger loss aversion ("They took Pluto away").  

  ### 4. Silences: Institutional Authority & Costs  
  - **Gap:** Theories ignore institutional power (IAU’s vote). Authority here is sociological, not ontological—the IAU’s resolution bound textbooks/museums despite lacking universal scientific consent.  
  - **Costs as counterevidence?** Rewriting costs and public distrust suggest the dispute wasn’t *merely* verbal: Outcomes had material consequences. Quantifier variance struggles here—if the dispute were purely pragmatic, high costs should deter resistance. Persistence implies deeper conceptual stakes (e.g., "planet" as cultural category).  

  ### 5. What the Episode Does to the Theory  
  The episode **undermines deflationism** and exposes a **third category**.  
  - **Against deflationism:** Proponents argued for "cleared orbit" based on *natural properties* (orbital dominance reflects formation physics), not convenience. This suggests "external" questions are constrained by scientific realism about kinds.  
  - **Persistence post-vote:** Resistance (e.g., New Horizons team) insists orbital dominance isn’t essential—a substantive disagreement about planetary ontology.  
  - **Third category proposal:** *Conceptual negotiation*—frameworks are chosen based on fit with empirical reality (e.g., dominance correlates with formation history), but admit no unique "fact." **Cost to theory:** Softens Carnap’s pragmatic/practical dichotomy. External choices aren’t *merely* practical; they track objective property clusters, yet remain underdetermined.  

  **Explicit Silences:**  
  - Theories lack resources to explain IAU’s authority (e.g., why vote binds museums but not dissenting scientists).  
  - None account for affective responses beyond pragmatics (e.g., grief over "losing" Pluto).  
  - Quantifier variance cannot explain why reclassification *felt* like a loss of knowledge rather than a lexical change.  

  **Conclusion:** The Pluto episode is a hybrid. It begins as a verbal dispute (resolvable by paraphrase) but metastasizes due to shifting conceptual anchoring and institutional imposition. It suggests metaontology needs a category for empirically informed framework selection—neither purely verbal nor robustly realist—where "best fit" to properties guides, but does not dictate, taxonomy.
