answer: |-
  ## Sestina of Condition and Counterpart

  The speaker points at evidence, an **if**
  Still unresolved. "It might be true," he **would**
  Admit, "that Oswald's hand did not **match**
  The rifle's grip that day. The fuse was **lit**
  By someone. In this, our unfolding **world**,
  The facts remain complex, not **similar**."

  But grant the shot was fired. Things feel **similar**
  Enough to wonder: What **if**,
  Against the grain of this fixed **world**,
  A different path was taken? Oswald **would**
  Not pull the trigger. Who then **lit**
  The fuse? What evidence would **match**?

  The evidence we have must **match**
  The scene. A dry room, strike: the match **lit**.
  A room choked full of vapour? **If**
  You strike it there, the spark **would**
  Die unseen. The oxygen-poor **world**
  Suppresses flame; no outcome **similar**.

  But pump the oxygen back. **Similar**
  Conditions now prevail. The strike will **match**
  Ignition's needs. This altered **world**
  Accepts the spark; the wick is **lit**.
  The vapour gone, the flame **would**
  Rise anew. The difference? An **if**.

  The counter hinges on that **if**,
  Its truth assumed. The speaker **would**
  Concede: "Oswald *did* fire." Worlds **similar**
  To ours, where he held back, must **match**
  The context best. Perhaps none **lit
  ** The fatal fuse? Perhaps some other **world**?

  We navigate this branching **world**
  By asking: Given this stated **if**,
  Which altered states stay most **lit**
  By known constraints? Which fabric **would**
  Show least frayed weave? What facts still **match**?
  Proximity is judged, not **similar**.

  No single measure makes worlds **similar**.
  The shifting weights within each **world**
  Depend on what the stated **if**
  Demands. The consequent might **match**
  Or fail. The counterfactual **would**
  Hangs on the closeness found, not **lit**

  By probability alone. A fuse **lit**
  By Oswald? Likely. Worlds where **similar**
  Events unfold? Perhaps. But **would**
  We say, in *that* imagined **world**
  Where Oswald paused, another hand **match**
  His deadly skill? The answer waits on **if**.

  **If** she leaves now, she catches the train. (Probability's **lit** path we scan.)
  **If** she had left, she **would** have caught the train. (In closest **world**, a fact made plain.)
  **If** we could know which **world** holds truth, which **similar** shade might **match** the strain.

  ---

  ### Commentary

  1.  **Stanzas 1 & 2 (Minimal Pair):** Lines 1-6 (Stanza 1) establish the indicative conditional ("**if** Oswald did not... then someone did"). The speaker admits uncertainty ("might be true," "facts remain complex"). Lines 7-12 (Stanza 2) shift to the counterfactual ("**if** Oswald had not... then someone **would** have"), presupposing Oswald *did* shoot ("grant the shot was fired").
  2.  **Stanzas 3, 4, 5 & 6 (Shifting Similarity):** Lines 13-36 demonstrate how altering the antecedent changes the consequent via shifting judgements of world similarity.
      *   Stanza 3 (13-18): Base case - dry room, match struck, lights ("strike: the match **lit**").
      *   Stanza 4 (19-24): Add vapour/oxygen lack - match struck, doesn't light ("spark **would** die").
      *   Stanza 5 (25-30): Remove vapour/add oxygen back - match struck, lights again ("flame **would** rise").
      *   Stanza 6 (31-36): Emphasizes the dependence of "**similar**" on the specific antecedent ("The counter hinges on that **if**"), the presupposition ("The speaker **would** concede: 'Oswald *did* fire'"), and the non-uniqueness of the closest world ("Perhaps none **lit**... Perhaps some other **world**?"). The migration of *would* through lines 16, 20, 28, 32, 35, and within the envoi visually underscores its shifting anchor.
  3.  **Envoi (Distinct Standards):** Lines 37-39 place an indicative (line 37, governed by probability) and a counterfactual (line 38, governed by closeness/similarity) side-by-side with closely related antecedents ("leaves" vs. "had left"). The final line (39) deliberately conflates the standards: "**If** we could know..." could be indicative (ability) or counterfactual (hypothetical impossibility). "Which **similar** shade might **match**" highlights the inherent ambiguity and potential lack of a single determinate "closest" world, while "the strain" subtly evokes the tension between the two types of conditional. It ends unresolved, reflecting the core distinction.
