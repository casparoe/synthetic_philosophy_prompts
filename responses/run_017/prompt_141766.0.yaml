prompt: |-
  Hey — I'm taking a seminar this term that's cross-listed between classics and philosophy, something like "lives and how to learn from them", and I've ended up defending a position I didn't expect to defend, which now makes me suspicious of how exposed it actually is.

  The position is that reading lives — real biographies of real people, with Plutarch's Parallel Lives as the paradigm case — can be a genuine route to moral knowledge, not just inspiration or a mnemonic, and that Plutarch's own methodological remark is what saves the practice from the obvious objection. (The remark I mean is the one near the start of the Life of Alexander, I think it's the Alexander — my TA mentioned it in section — where he says he's writing lives rather than histories, and that a stray phrase or a small joke will often reveal someone's character better than a set-piece battle with thousands of dead. I'm paraphrasing from memory, don't hold me to the wording.) The obvious objection is that biography is systematically distorted in the subject's favour, and that this gets much worse in hagiography, in the lives of saints, where whole episodes seem built to display a virtue. My version of the reply, which I've been developing with a friend after class, reframes the whole thing: moral learning from a life isn't like deriving a rule from a principle, it's like calibrating a perceptual capacity on labelled examples. The life is the training data; the verdicts — noble, shabby, cruel, generous — are the labels. On that picture hagiography is label noise, and label noise isn't automatically fatal, for two reasons: noise that is uncorrelated with the features you're training on averages out over enough cases, and the features Plutarch actually tells you to attend to (the offhand remark, the small expenditure, how someone treats a servant or takes a defeat) are exactly the ones a panegyrist has least incentive to invent or polish, so they are closer to honest labels than the famous deeds are. That's why, on my view, the small details are doing real epistemic work rather than just being vivid.

  What I want from you is the map of how exposed this is. Tell me what would count against it, ranked from fatal to merely awkward: which defeaters would a committed defender of my position have to concede as really counting against them, and which would they be entitled to dismiss as resting on a picture they've already rejected. I'm especially interested in where the argument stands or falls with other things — is it hostage to the historical reliability of the anecdotes, or does the calibration story survive even if the anecdotes are mostly invented? Does it stand or fall with moral perception being trainable at all, rather than just being the application of principles you already have? I can see two things that worry me most and I'd like you to push hard on both: first, if the labels are in fact supplied by the reader's own antecedent moral knowledge, then my account seems to collapse back into the principles-first picture it was supposed to replace, and the biography becomes decorative; second, if what's going on is really pattern-matching on examples, then the view seems committed to saying that a well-made *novel* would teach you just as much as a real life, which I suspect is a consequence I should either embrace or be embarrassed by, since Plutarch's whole practice seems to depend on these people having actually lived. Also flag any case my account simply can't describe — I think my weak point is learning a genuinely new moral distinction from a life, the thing where you come away seeing a whole category of wrong that you didn't have a name for before. And tell me honestly whether I've insulated the view: I've noticed myself saying that if a life doesn't teach you anything, you weren't reading it properly, which feels like the kind of move that makes a position unfalsifiable, and I can't tell whether that's a fatal flaw for a view of this kind or just what you should expect from a claim about education. What would move me most, personally, is the historical side: if it turned out that sayings and anecdotes were themselves a heavily edited genre, and that a given anecdote gets recycled from one subject to another, then my second premise dies — but please don't give me a reading list or tell me to go look things up, I can do that myself; just tell me what would have to be true for me to be wrong, and how bad it would be if it were. End with one final line and nothing after it: \answer{verdict: survives | survives-qualified | collapses — top defeater: <six words or fewer>}.
reasoning: |-
  Okay, the user is in a seminar defending an unexpected position about learning moral knowledge from biographies, specifically Plutarch's Parallel Lives. They've framed this as "calibrating moral perception" using lives as training data, with small details as key features. They're worried about exposure points and want me to map defeaters.

  Hmm, their core argument is clever - treating biography as perceptual training data where minor details ("stray phrase, small joke") provide honest labels. The main worries are circularity (if labels depend on pre-existing knowledge) and fictional equivalence (why not novels?). They also flag concerns about historical reliability of anecdotes and learning genuinely new concepts.

  Let me unpack the defeaters systematically. First, the circularity problem: if moral labels come from the reader's prior knowledge, doesn't that make biography decorative? The user's right to worry - this could collapse their view. But maybe they can argue that prior knowledge is refined through examples, like sharpening blurred categories. Still risky.

  Then there's the novel equivalence issue. Plutarch insists on real lives, but why? If pattern-matching matters, fiction should work equally well. The user might need to bite this bullet or find a distinction - perhaps real lives ground the "this actually happened" weight that fiction lacks. But that feels shaky.

  Historical reliability is another landmine. If anecdotes are recycled tropes (like Diogenes Laërtius reusing stories), it undermines the "honest labels" claim. The user's second premise dies if small details are as curated as grand deeds. This could be fatal unless they argue tropes still carry moral truth.

  For learning new distinctions, the view struggles. How do you calibrate perception for a concept you lack? They'd need to show how examples bootstrap understanding - maybe through contrast or narrative context. But it's weak.

  I should rank these. Circularity seems potentially fatal if unresolved. Historical unreliability could be fatal depending on evidence. Novel equivalence is awkward but maybe defensible. The unfalsifiable "bad reader" excuse is problematic but common in education theories.

  Final verdict? Qualified survival - if they concede some points and adjust. Top defeater is the circularity issue: "Labels presuppose prior knowledge." That's the hardest nut to crack.
answer: |-
  Here's the vulnerability map for your position, ranked by severity of potential defeaters:

  **Fatal Defeaters (Require Concession or Major Revision)**  
  1. **Epistemic Circularity:** If moral "labels" (noble, shabby, etc.) *necessarily* derive from the reader's pre-existing principles, the biography becomes illustrative, not instructive. *Your defense:* Argue that labels are refined through examples (e.g., distinguishing "ruthlessness" from "resolve" via context), but if labels are purely applied, not adjusted, the account collapses.  
  2. **Systematic Fabrication:** If Plutarchan anecdotes are proven to be: (a) overwhelmingly fictional tropes recycled across lives (e.g., "deathbed sayings"), *and* (b) these tropes align with cultural biases rather than psychological realism, your "honest labels via minor details" premise fails. *Your insulation:* Claim tropes can still convey moral truth, but this abandons Plutarch's historical claim.  

  **Serious but Possibly Survivable (Require Nuanced Defense)**  
  3. **Fictional Equivalence:** If a well-researched novel (e.g., Tolstoy) generates identical moral insight as Plutarch, Plutarch's reliance on *real lives* becomes rhetorical. *Your options:* Embrace equivalence (undermining Plutarch's practice) or argue actuality anchors "this *can* be lived" (risks ad hoc-ness).  
  4. **Novel Moral Distinctions:** Learning a *new* moral category (e.g., "gaslighting" from a modern biography) seems impossible if labels require prior recognition. *Your defense:* Argue narrative context + contrastive examples bootstrap new concepts ("This feels like X, which I now see as wrong"). Weak if the concept is wholly alien.  

  **Awkward but Dismissible (Per Rejected Assumptions)**  
  5. **Anecdotal Unreliability (Non-Systemic):** If some anecdotes are invented but uncorrelated with virtue-signaling (e.g., random quirks), your "noise averages out" claim holds. Dismissible as irrelevant to the calibration model.  
  6. **Hagiography's Scale:** If saintly lives contain *more* "minor detail" fabrication than assumed, your "low incentive to invent" falters. Dismissible if you concede hagiography has higher noise but isn't your paradigm.  

  **Methodological Notes**  
  - **Unfalsifiability ("Bad Reader" Claim):** This is endemic to perceptual/educational theories but weakens your position. Mitigate by specifying *how* proper reading differs (e.g., attention to counter-evidence in the text).  
  - **Moral Perception Trainability:** Your account *requires* this. If moral judgment is solely principle-application, your view collapses.  

  **Final Verdict**  
  \answer{verdict: survives-qualified — top defeater: **Labels presuppose prior moral knowledge**}
