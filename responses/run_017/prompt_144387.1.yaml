  - Aggregation: With many independent ambiguous urns, the maxmin rule might lead to different behavior. For a single urn, the worst case is that the composition is 0% for the color you bet on. For 100 urns, the worst case is that every urn is 0% for your color? But that is inconsistent because the compositions are independent. The set of priors for each urn is independent, so the joint prior set is the product. The worst prior for the entire portfolio is the one where each urn is set to the worst composition for your bet. So the expected total payoff is 0. But if the compositions are known, then even if each urn is ambiguous, the total might have a distribution that is concentrated around 50 (if each urn has around 50). But in the maxmin, the worst case is 0. So the value of the portfolio with unknown compositions is 0, while with known it is 50 (if each is 50-50). But that seems absurd because the law of large numbers applies regardless. The maxmin agent does not take into account that the worst prior for each urn might be different and that they are independent. But in the product set, the worst prior is the one that is worst for every urn. So the agent is extremely pessimistic. This seems too conservative. And even if she can learn from early draws, the worst prior might assign compositions that are inconsistent with the early draws? But the set of priors is updated by conditioning. So after seeing some draws, the set of priors is restricted. But initially, the worst case is still 0 for the entire portfolio.

  - "Nobody ever knew": The urn was filled by a random process that is symmetric and never observed. Then the set of priors might be symmetric. But the maxmin rule still picks the worst prior, which is 0% for the color you bet on. Why is that rational? There is no adversary. The random process is symmetric, so the true prior is known to be symmetric. But the set of priors includes all possible compositions? Then the worst is 0. So the agent still behaves as if there is an adversary. If the agent has no reason to suspect an adversary, why is it rational to guard against the worst case?

  Now, we want to avoid objections she's heard a hundred times. We assume she's heard:

  - Simple Dutch books (money pumps) and has a reply (e.g., the pump requires her to accept a sequence of bets that she wouldn't accept at once, and she can avoid by not accepting the first bet).

  - The charge that ambiguity aversion is just risk aversion: she distinguishes between risk (known probabilities) and ambiguity (unknown).

  - The argument that the set of priors should be updated and that leads to problems? Maybe.

  - The argument that in the long run, ambiguity aversion disappears? She might say that the normative principle is for single shots.

  We'll craft questions that push on the less discussed aspects.

  Question Draft:

  1. (Incoherence charge) 
     You've said that in the Ellsberg two-urn setup, it's rational to strictly prefer betting on the known urn over the ambiguous one for either color. But that pattern implies that the probability of red in the ambiguous urn must be both strictly less than 1/2 (to explain the first preference) and strictly greater than 1/2 (to explain the second). How do you reconcile that without a single probability? 
