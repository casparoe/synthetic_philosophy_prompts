answer: |-
  ### Interview Questions for Professor M

  **Question 1: Incoherence Charge**  
  You argue that rational agents need not have sharp probabilities, so the Ellsberg preferences aren’t inconsistent. But those preferences—strictly preferring K-red to U-red and K-black to U-black—can’t be captured by any single probability function. If your view permits strict preferences without any sharp prior, what breaks the symmetry between U-red and U-black? Why isn’t the agent indifferent?  
  *Follow-up (if she says imprecise priors alone justify silence/no comparison):* But incompleteness predicts no strict preference for K over U—yet people strictly prefer K. If it’s not the credal set doing the work, is the extra ingredient an attitude (like caution), or a tacit belief that the urn is adversarial?

  **Question 2: Signature Case (One Urn)**  
  In your single-urn case—known 1/3 red, unknown black/yellow split—you prefer betting on red over black. Aside from your knowledge, what objectively distinguishes the *event* “red” from “black” in your account?  
  *Follow-up (if she says only information differs):* If the difference is purely informational, why isn’t that fully captured by the credal set alone? Why add a separate cautionary layer? And concretely: in evaluating betting on black, how much decision-weight does the worst-case prior (0 black marbles) actually get?

  **Question 3: Dynamic Choice**  
  After committing to bet on U-red, would you pay a penny to reveal U’s composition before the draw? Separately, after a marble is drawn from U but its color hidden, would you pay to switch your bet to K-red?  
  *Follow-up (if she says she’d pay to switch post-draw but not pre-draw):* You’ve said switching post-draw reflects regretting not choosing K initially. But if you anticipate regretting U, why not choose K from the start? Doesn’t that mismatch reveal a conflict between your initial and future preferences?

  **Question 4: Aggregation Over Many Bets**  
  Take 100 independent ambiguous urns, one draw each, payout on total reds. Does maxmin value this portfolio differently than 100 known 50-50 urns? If yes, why should repetition change the normative demand for caution?  
  *Follow-up (if she says no, maxmin still values it lower):* So you bite the bullet: even with learning from early draws, the worst-case prior (all urns 0% red) makes the portfolio near-worthless. But shouldn’t independent, repeated bets dilute ambiguity normatively? Or is caution invariant to scale?

  **Question 5: "Nobody Ever Knew" Scenario**  
  Suppose U’s composition was fixed by a quantum coin flip—symmetric, unobserved, unrecorded. No adversary could exist. Is caution still rationally permissible?  
  *Follow-up (if she says yes):* Without even hypothetical malice, what justifies weighting the worst case (0% red)? If it’s not suspicion, is it just intrinsic pessimism? Or does your view imply ambiguity aversion is a taste, not epistemic?

  **Question 6: Precautionary Principle**  
  Does your account support the precautionary principle (e.g., banning technologies with ambiguous harms)? If so, how do you weigh ambiguous catastrophic risks against definite costs (e.g., jobs lost) imposed on identifiable people?  
  *Follow-up (if she endorses the principle):* When harms are ambiguous but costs are certain, doesn’t maxmin prioritize the vague worst-case over concrete suffering? Is that fair, or does it risk paralysis?

  **Question 7: What Would Change Your Mind?**  
  What hypothetical experiment or theoretical result could convince you that ambiguity aversion isn’t rationally permissible—that it’s always a bias?  
  *Follow-up (if she cites unreality or irrelevance):* If no evidence could sway you, is the view non-falsifiable? Or is it insulated by design?

  \answer{Q4}
