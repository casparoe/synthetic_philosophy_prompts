     Imagine 100 independent ambiguous urns, each with 100 marbles of unknown red/black composition. You get a dollar for each red marble drawn. Does your maxmin rule value this portfolio the same as 100 known 50-50 urns? 
     [Follow-up] If not, but you agree that the maxmin value is much lower, how do you justify that normatively? Even though you can learn from early draws, the worst-case prior might still make the entire portfolio worthless. But shouldn't repetition dilute ambiguity?

  5. (Aggregation, part 2 - alternative if the first part is too vague)
     Or, if she says that the maxmin rule gives a higher value for the aggregate because the worst case for the average is not as bad, then we press: 
