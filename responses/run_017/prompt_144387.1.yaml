  We are going to brainstorm objections to Professor M's view that the Ellsberg pattern is rational and that one can use a maxmin decision rule over a set of priors. We'll avoid the naive Dutch book and focus on deeper issues. We are also to avoid objections she's obviously heard (like the simple money pump). We have six required areas to cover, plus one closing question and one about the precautionary principle.

  Required areas:

  1. Incoherence charge properly done: show that the two strict preferences (preferring K-red to U-red and K-black to U-black) cannot be represented by a single probability. The follow-up addresses that if the agent has imprecise probabilities, they should be silent between U-red and U-black, but they are not (they strictly prefer K). So what is the extra ingredient?

  2. Her own signature case: one urn with known 1/3 red, and unknown split of 2/3 between black and yellow. We ask what differs between the event "red" and "black" other than information. Follow-up: if it's only information, why isn't that already captured in the credal set? And how much weight does the worst case (0 black) get?

  3. Dynamic question: Would she pay to reveal the composition after committing to bet on U? And after the draw but before revealing the color, would she pay to switch to K? How do these hang together? Challenge: Why not choose K from the start if she expects to want to switch?

  4. Aggregation: 100 independent ambiguous urns. Does the maxmin rule give a different result in aggregate? If yes, why should repetition matter? If no, then she must accept that even with many independent bets, the portfolio with unknown compositions is worse than with known, even with learning.

  5. "Nobody ever knew": The composition was fixed by a random process, never observed. Is caution still permissible? Press: if there's no adversary, what is the source of caution?

  6. Closing: What would change her mind? And about the precautionary principle: if her view supports it, how to handle the costs of caution?

  We need 7-9 questions. We'll cover the 6 required and add one or two more. We can break some of the above into multiple questions.

  Brainstormed list of objections (private, not to be shown):

  - The incoherence charge (as above) is fundamental and not just about money pumps. It shows that the preferences are incompatible with any single probability, but the maxmin rule doesn't just represent incompleteness; it adds a specific attitude (aversion to ambiguity) that causes strict preferences.

  - The signature case: in the one-urn case with three colors, if we are indifferent between betting on black and yellow (since both are ambiguous) but prefer betting on red (known probability) to either, then the maxmin rule might assign min probability to black (0) and to yellow (0) but 1/3 to red. But that leads to a violation of the sure-thing principle: if we compare betting on red vs. black, and red vs. yellow, we have strict preferences. But if we consider a bet that pays if black OR yellow, that event has probability 2/3 (known) and should be treated like a known event. But if we apply maxmin to the event black OR yellow, the worst prior might assign 0 to black OR yellow? No, because the event black OR yellow is fixed at 2/3. So the maxmin for that event is 2/3. But then the agent should be indifferent between betting on red (1/3) and betting on black (min 0) or yellow (min 0) only if we consider them separately. But note: if we offer a bet on black, the min probability is 0, so the expected utility is 0. Similarly for yellow. For black OR yellow, the min probability is 2/3 (because the total for black and yellow is fixed at 2/3, so the worst prior for the event black OR yellow is 2/3). So the agent would strictly prefer betting on black OR yellow (which has min 2/3) to betting on black (min 0). But that's consistent. The real issue is: why is the agent not using the known probability for the event black OR yellow? They are. The problem is in the single events. The question is: what is the difference between the event "red" and "black" other than information? And why does the worst case (0 for black) get any weight when the agent knows that the true proportion is fixed and that the event black might have a low probability in the worst case but not in reality? The agent doesn't know the reality, so the worst case is considered.

  - Dynamic inconsistency: After committing to bet on U, she might pay to reveal the composition because then she can adjust. But at the time of the bet, she chose U because the maxmin over the set of priors made it acceptable? Then after the draw, she might pay to switch to K because K has known 50-50? But why not choose K at the start? The standard reply is that she'd rather have been on K, but that doesn't change the fact that at the start, she chose U. The inconsistency is that at time 0, she prefers U to K (for a given color)? No, in the Ellsberg setup, she prefers K to U. So she wouldn't choose U. But let's reframe: suppose she is forced to bet on U. Then after, she might pay to reveal the composition? But if she is ambiguity averse, she might pay to eliminate the ambiguity. Then after the draw, she might pay to switch to K? But why? The ambiguity is gone once the draw is made? No, because the color isn't revealed. So there is still uncertainty. And in K, it's 50-50, while in U, if she doesn't know the composition, even after the draw, she still doesn't know the probability. But the outcome is fixed. So she might be indifferent? The key is that before the color is revealed, the state of the world is still uncertain. So she might prefer to have a known 50-50 chance (as in K) rather than an unknown chance (as in U). But then, if she had chosen K at the start, she would have that. So why didn't she? She did: she always chooses K over U. So the dynamic scenario must be set up carefully. We can set it up as: she is forced to choose between betting on U and betting on K. She chooses K. Then after the draw, before the color is revealed, would she pay to switch to the other urn? But that doesn't make sense because the draw has been made from K. We have to have the same urn. Alternatively: after she has bet on U, and the marble is drawn (but color not revealed), she is offered to switch her bet to a bet on K (with a new draw from K). Then she might be willing to pay to