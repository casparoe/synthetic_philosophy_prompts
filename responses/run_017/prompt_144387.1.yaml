     Suppose the ambiguous urn's composition was determined by a quantum random number generator that ensured a symmetric distribution but then erased the record. So no one, not even a hypothetical adversary, knows the composition. Is it still rational to prefer the known urn? 
     [Follow-up] Without the possibility of an adversary, what justifies giving any weight to the worst-case scenario? Isn't the maxmin rule then just an arbitrary taste for pessimism?

