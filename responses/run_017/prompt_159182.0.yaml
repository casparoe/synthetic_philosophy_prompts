prompt: |-
  I'm writing my term paper for a seminar on social ontology, on what it is for a group to act together, and I keep running into the same pattern: someone points at a single case — a duet, a mob, a committee — and claims it refutes the leading account. Before I add another case of my own, I want the specification. So: what would a theory of joint action have to get right to count as adequate — not adequate in general, but adequate for the job I need it to do, which is to underwrite attributions of obligation and blame to groups: who owes what to whom when a collective project goes wrong, and when one participant may rebuke another for not doing their part.

  Give me the requirements list — the cases it must handle, the distinctions it must not collapse, the results from elsewhere it must not contradict — with the consideration behind each requirement. The cases I most want covered are: mere convergence versus acting together; joint action under divergent private ends; a group that settles on an outcome no member individually endorses, as when a decision procedure aggregates votes into a result everyone voted against; the dissenting and the coerced member, who seem to be inside the first-person plural yet not bound in the same way; improvised joint action where roles are invented mid-course with no prior plan and no communication; coordination brokered by an algorithmic system no member understands, where no member grasps the whole plan and the convergence is nonetheless theirs; and long-running collectives whose membership turns over completely, where I am unsure whether the same we persists. The distinctions I don't want collapsed are: shared intention versus shared belief or acceptance, the group's act versus the members' acts, intending-together versus each intending that we do it, and joint action versus the joint causal production of an outcome nobody aimed at.

  Then mark which requirements are non-negotiable given that purpose and which are only the preferences of one research programme, such as reducibility to individual attitudes. Most importantly, flag any pair you suspect cannot be jointly satisfied: I suspect that demanding coverage of loose, dispersed, partly unwitting collectives pulls against demanding that joint action carry the distinctive normative residue — entitlement to rebuke, obligation to renegotiate, rather than merely to desist — that is supposed to separate it from parallel action, and I want to know whether that is a genuine trade-off or just my confusion. Finally, say which single requirement does the most work in excluding otherwise plausible theories. One line each on the plan-based, we-intention and joint-commitment families is enough; keep the weight on the criteria.
reasoning: |-
  Okay, the user is writing a term paper on social ontology, specifically about what it means for a group to act together. They're frustrated with how existing theories get challenged by single counterexamples like duets or mobs. Before adding their own case, they want a clear set of criteria for what makes a theory of joint action adequate for their purpose—underpinning group obligations and blame. 

  Hmm, their core need is normative: they need to explain who owes what when collective projects fail, and when rebukes are justified. That's different from just describing how joint action happens. They listed several tricky cases: mere convergence vs real collaboration, groups with private agendas, dissenters in a group, algorithm-mediated coordination, and long-running groups with member turnover. They also want key distinctions preserved, like shared intention vs shared belief.

  I notice tension in their request. They want theories to cover both tight-knit groups (where norms like rebuke make sense) AND loose collectives like algorithm-driven ones (where members might not even know each other). But can the same theory explain obligations in both? Rebuking someone in a flash mob feels different from rebuking a teammate in a surgery. That's probably their "genuine trade-off" suspicion. 

  For requirements, I'll start non-negotiables: any theory MUST link joint action to obligations/blame (their paper's goal), handle dissent/coercion (common in real groups), and distinguish genuine collaboration from parallel action. Then add important-but-flexible ones like covering algorithmic mediation or reducibility—these depend on the theorist's approach. 

  The membership turnover case is fascinating. If a 200-year-old institution has no original members left, does "we rebuilt the bridge" hold? Theories focusing on current intentions (like Bratman) struggle here, while ones with group agents (List/Pettit) might handle it better. 

  Biggest theory-killer? Probably the normative residue requirement. Many accounts describe joint action well but don't explain why I owe you an apology if I slack off in our duet. Only joint-commitment theories (Gilbert) really tackle that head-on. 

  Should flag that the coercion/dissent case might clash with the "obligation to renegotiate" ideal—if you were forced into a group project, can others reasonably blame you? That's a pressure point. 

  User seems analytically sharp—they've spotted the core tension in the field. Their challenge is resisting the urge to add yet another counterexample before clarifying what success looks like. The criteria list should help them evaluate theories systematically, not just cumulatively.
answer: |-
  Here's a requirements list tailored to your normative purpose, prioritizing what a theory *must* handle to underpin group obligations and blame, alongside key distinctions and potential tensions. Requirements are categorized as **Non-Negotiable (NN)** (essential for your purpose) or **Programmatic Preference (PP)** (theoretical choice).

  ### Core Requirements (Cases & Normative Output)

  1.  **NN: Generate Obligations & Entitlements:** The theory *must* explain why participants in genuine joint action incur *obligations to each other* (e.g., to do their part, renegotiate if unable) and possess *mutual entitlements* (e.g., to rebuke for free-riding, expect reasonable effort). Mere causal contribution or parallel action doesn't suffice. *Rationale:* This is the core purpose of your inquiry – underwriting normative attributions.
  2.  **NN: Dissent & Coercion:** Must account for the status of dissenting or coerced members within a group act. Do they incur obligations? Can they be rebuked? Can they rebuke others? *Rationale:* Real groups often involve internal conflict or pressure; the theory must clarify normative standing.
  3.  **NN: Distinguish Genuine Joint Action vs. Mere Convergence:** Must cleanly separate cases like two people independently fleeing a fire (convergence) from two people carrying a piano together (joint action), showing why obligations/rebuke only arise robustly in the latter. *Rationale:* This is the fundamental divide the theory must establish for normative relevance.
  4.  **NN: Divergent Private Ends:** Must accommodate cases where participants act together towards a shared goal *because* it serves divergent private ends (e.g., two rivals cooperate temporarily to defeat a common enemy, each intending to betray the other later). *Rationale:* Shared action often persists despite conflicting ultimate motives; obligations/rebuke within the *shared project* must still be explicable.
  5.  **Important: Aggregation & Lack of Individual Endorsement:** Should handle cases where the group's outcome (via voting, averaging, algorithmic output) is not endorsed by any individual member. Who bears obligation/blame for this outcome? Is it still "our" action? *Rationale:* Central to institutional action; tests if "jointness" resides in process or outcome.
  6.  **Important: Improvised Coordination:** Should cover cases with no prior plan or explicit communication, where roles emerge dynamically (e.g., strangers spontaneously forming a human chain to rescue someone from water). *Rationale:* Tests if complex shared intentions or commitments are necessary, or if weaker cognitive bases suffice for normativity.
  7.  **Important: Algorithmic Brokering:** Should address coordination where no member grasps the whole plan, mediated by an opaque system (e.g., gig workers coordinated by an app's algorithm). Whose action is it? Can mutual obligations/rebuke exist? *Rationale:* Increasingly common; tests the minimal cognitive/agential requirements for "jointness" and normativity.
  8.  **Important: Long-Running Groups & Membership Turnover:** Should clarify the persistence conditions of "we" over time and complete membership change. Does the obligation structure persist? Who can rebuke whom for historical failures? *Rationale:* Essential for institutional responsibility and intergenerational projects.

  ### Key Distinctions (Must Not Collapse)

  9.  **NN: Shared Intention vs. Shared Belief/Acceptance:** Must distinguish intending *together* from merely believing we *will* act in parallel or accepting a plan as given. *Rationale:* Normative residue (obligation/rebuke) seems intrinsically tied to *intentional joint commitment*, not just prediction or acquiescence.
  10. **NN: Group's Act vs. Members' Acts:** Must preserve the distinction while explaining their relationship. The group's act isn't *just* the sum of individual acts, but neither is it wholly independent. *Rationale:* Obligations/blame attach to the group *and* its members in specific ways; collapsing risks misattribution.
  11. **NN: Intending-Together vs. Each Intending That We J:** Must distinguish a genuinely joint intention ("*We* intend to J") from each individual intending *that the group J*s (possibly for private reasons). *Rationale:* The former seems necessary for the mutual obligations and entitlements central to your focus (e.g., rebuke presupposes a joint commitment one is failing, not just frustrating my private wish).
  12. **Important: Joint Action vs. Joint Causal Production:** Must separate intentionally acting together from unintentionally causing the same outcome (e.g., market actors causing a crash vs. conspirators causing one). *Rationale:* Only the former plausibly grounds the specific mutual obligations/rebukes you're investigating.

  ### Constraints & Compatibility

  13. **PP: Reducibility:** Must be compatible with (or explicitly deny) reducibility to individual attitudes + interactions, without supernatural group minds. *Rationale:* A core methodological commitment in much social ontology, but not strictly necessary for your *normative* purpose if obligations are emergent.
  14. **PP: Compatibility with Moral Psychology:** Should not blatantly contradict established findings about individual intentionality, commitment, or norm psychology. *Rationale:* While social ontology can be revisionary, radical disconnect weakens plausibility.

  ### Suspected Trade-offs & Pressure Points

  *   **Your Suspicion is Largely Correct (NN Tension):** The requirement to cover **loose, dispersed, unwitting collectives** (Algorithmic Brokering, potentially some Mere Convergence edge cases) *genuinely pulls against* the requirement for **robust normative residue** (Obligations/Rebuke). Theories prioritizing the latter (Gilbert, maybe Tuomela) struggle with the former. Theories better handling the former (e.g., certain versions of Bratman, or emerging accounts of distributed agency) often weaken the normative ties or make them highly conditional. **This is a core tension in the field.** Your theory choice will likely involve *prioritizing* one pole or offering a nuanced spectrum.
  *   **Dissenter/Coerced vs. Obligation to Renegotiate:** The entitlement to rebuke a free-rider seems clear. But does a *coerced* member have an "obligation to renegotiate" before quitting, or can they simply leave? This tests the boundaries of incurred obligations.

  ### Most Exclusionary Requirement

  *   **NN: Generate Obligations & Entitlements (Requirement 1)** does the heaviest lifting in excluding theories. It immediately sidelines:
      *   **Purely Descriptive/Behavioral Accounts:** (e.g., early game theory) that explain coordination but not normativity.
      *   **"Shared Goal" without Mutual Commitment:** Accounts reducing joint action to individuals having the same goal and mutual belief (Lewisian common knowledge) often fail to generate the *obligations* and *rebuke* rights. Why do I owe *you* an apology for slacking, rather than just failing my own goal?
      *   **Weak "Acceptance" Models:** If joint action is just accepting a plan/role (without a joint commitment intention), it struggles to explain robust mutual obligations distinct from role-defined duties.

  ### Brief Line on Major Families vis-à-vis Criteria

  *   **Plan-Based (Bratman):** Excels at small-scale, planned action, shared intention, and some normativity via interdependence. Struggles with dissent, improvisation, large-scale/algorithmic, and the *robustness* of mutual obligation/rebuke beyond reliance. Turnover is hard.
  *   **We-Intention (Tuomela):** Strong on shared intention vs belief and group act distinction. Can handle some dissent via roles. Normativity (obligation/rebuke) is often tied to group norms/membership, which can feel less *interpersonal* than Gilbert. Algorithmic brokering and pure turnover are challenges.
  *   **Joint Commitment (Gilbert):** Best at generating robust mutual obligations and entitlements (rebuke) via the joint commitment structure. Handles dissent/coercion explicitly (challenges to commitment). Struggles most acutely with improvisation without communication, opaque algorithmic brokering (where is the commitment?), and large-scale/long-running groups (how is the commitment sustained/renewed?).

  Focus your evaluation on how well competing theories satisfy the **Non-Negotiable** requirements, especially the normative output and the dissent/convergence distinctions, while being explicit about how you navigate the **loose collective vs. robust normativity** tension central to your purpose.
