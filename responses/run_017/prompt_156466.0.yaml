prompt: |-
  I host a tiny podcast on logic and its discontents, and next week's guest is a philosopher who's built a reputation on defending the Tortoise: her line is that Carroll's regress is sound -- you can stack up premises forever and none of them will compel anyone to infer anything -- and that what actually closes the gap between premises and conclusion isn't another premise but a capacity, a kind of inference-readiness that isn't propositional at all. She calls the corollary non-exportability: an argument for modus ponens that itself uses modus ponens can be a perfectly good justification even though it can't convince anyone who lacks the capacity.

  Draft me seven or eight questions that make her work for it instead of restating the view. I want one on whether her "capacity" is really any different from just being disposed to blurt out the conclusion; I expect she'll say the capacity is normative, that someone who has it can cite the rule as her reason, so give me the follow-up asking whether that citation is just the Tortoise's demanded premise wearing a disposition costume. I want one on why the self-support move doesn't hand out blanket immunity to bad rules -- the same shape of argument looks like it protects affirming the consequent, or even Prior's made-up connective tonk -- with a follow-up keyed to her likeliest answer that tonk has no coherent semantics, pushing on whether that answer smuggles in a prior logic. One on whether any of this is about deduction specifically or about reasons generally, and one (with follow-up) on whether a community trained on a non-classical logic would be just as justified, i.e. whether this quietly becomes relativism about logic. Fill the rest with whatever you think are the weakest joints, and skip the biographical stuff entirely.
reasoning: |-
  Okay, the user is hosting a logic podcast and needs challenging questions for a philosopher who defends Carroll's Tortoise regress. The guest argues that inference relies on a non-propositional capacity rather than infinite premises. The user wants seven or eight pointed questions that avoid restating her view and target specific weaknesses.

  First, I need to unpack the user's explicit requests. They want a question comparing the "capacity" to mere behavioral dispositions, followed by a follow-up about whether citing the rule is just the Tortoise's premise in disguise. That's core to challenging her normative claims. 

  Then there's the issue of bad rules like affirming the consequent or tonk. The user anticipates she'll say tonk lacks coherent semantics, so the follow-up must press whether that assumes prior logical commitments. This attacks the foundations of her view.

  The relativity question is crucial too—would her framework justify non-classical logic communities equally? That risks logical relativism, which she'll likely deny, but the follow-up should force her to explain why without special pleading.

  Beyond the user's specs, I should identify other weak joints. The psychological implementation angle seems promising—how does this capacity interface with actual reasoning? If it's causally inert, her view might become epiphenomenal. And the explanatory gap between normative capacity and concrete inferences needs probing, especially if she admits premises still play some role.

  The user mentioned skipping biography, so all questions must be substantive. Tone should be rigorous but not hostile—"pressing" rather than "attacking." Each follow-up should anticipate her defenses and cut off escapes. For example, if she distinguishes capacity from disposition via normativity, the next question immediately questions whether that normativity is circular.

  The tonk challenge is particularly damning if her defense relies on classical logic's primacy. I'll frame it as whether semantics can be evaluated without logic—which might trap her. And for relativism, pressing whether "incoherent semantics" is logic-neutral could reveal tensions.

  Finally, the question about deduction vs. reasons generalizes her view's implications. If it applies broadly, it might dilute logic's special status; if not, why? That explores boundaries she may not have defined.
answer: |-
  Here are seven incisive questions targeting the key tensions and potential weaknesses in her position, designed to push beyond restatement and into defense, with the specific follow-ups you requested:

  1.  **The Disposition vs. Normative Capacity Challenge:** You characterize the gap-closer as a *normative capacity* for inference-readiness, distinct from a mere behavioral disposition to utter the conclusion. But how does this manifest operationally? If someone reliably outputs "Q" when given "P" and "If P then Q", how can we empirically distinguish them *having the normative capacity for MP* from simply *being disposed to blurt out Q*? What concrete, observable difference does the "normativity" make?
      *   **Follow-up (The Premise in Disguise):** You suggest the difference lies in the capacity-holder being able to *cite MP as their reason*. But isn't this "citation" functionally identical to the Tortoise's demanded premise ("If A and B are true, Z must be true")? Doesn't treating the *citation of the rule* as the mark of the capacity just reintroduce the very proposition the Tortoise demands, now disguised as a dispositional report? How is this not simply the regress-premise internalized?

  2.  **The Immunity Problem (Tonk/Bad Rules):** You argue that self-supporting justifications using a rule (like an argument for MP using MP) are valid because they exercise the required capacity. But doesn't this structural move confer blanket immunity on *any* inferential rule? Couldn't I construct a parallel "self-justifying" argument for Affirming the Consequent ("If P then Q, Q; therefore P") or even for Prior's `tonk` (with its rules: P-tonk-Q entails P, and P-tonk-Q entails Q), simply *using* those rules in the justification? Why does MP get a pass but these don't?
      *   **Follow-up (Smuggling in Prior Logic):** Your likely answer is that `tonk` lacks "coherent semantics" or leads to explosion. But doesn't assessing the "coherence" of `tonk`'s semantics *itself* rely on prior logical principles (like non-contradiction, or the meaning of entailment)? Isn't declaring `tonk` incoherent already an application of the very logical norms (like MP) you're trying to ground? Doesn't this mean your defense of MP *does* implicitly rest on a prior logical commitment after all?

  3.  **The Scope Question: Deduction vs. Practical Reason:** Is your account specifically about closing the gap in *deductive* inference (like MP), or is it a general theory about how *any* set of reasons (premises, evidence, desires) connects to a conclusion (belief, action)? If it's specific to deduction, why is the "capacity" uniquely needed there? If it generalizes (e.g., to practical reasoning like "I desire X; doing Y gets me X; so I should do Y"), does that mean *all* reasoning relies on non-propositional capacities, potentially making the structure of logical deduction less special?

  4.  **The Relativism Challenge:** If justification for a logical rule ultimately rests on exercising a non-propositional capacity fostered within a practice, wouldn't a community rigorously trained on a *non-classical* logic (e.g., intuitionistic logic rejecting LEM, or a paraconsistent logic) possess an equally "justified" capacity for *their* core rules? Doesn't this make logical justification fundamentally relative to the inferential practices and capacities nurtured within a specific community? Are you committed to logical relativism?
      *   **Follow-up (Escaping Relativism):** If you deny relativism, how do you objectively privilege the capacity for classical MP over, say, a capacity for intuitionistic deduction or paraconsistent inference, without appealing to the very classical logical consequences (like explosion) that the non-classical logician explicitly rejects? Doesn't avoiding relativism require an external standard your account seems to deny?

  5.  **The Psychological Implementation Gap:** Granting the existence of this normative capacity, how does it *causally interact* with the propositional premises in actual psychological processing? Does the capacity "take" the premises *P* and *If P then Q* as inputs and generate *Q* as output? If so, doesn't this sound suspiciously like the capacity is *itself* functioning according to a rule-structure, potentially restarting the regress at the sub-personal level? If not, how *does* the non-propositional capacity bridge the propositional gap without simply being a mysterious homunculus?

  6.  **The Explanatory Burden:** What precisely does the "capacity" *explain* that adding premises (even infinitely) does not? Both views seem to describe a reliable output (*Q*) given inputs (*P, If P then Q*). You say the capacity avoids an infinite regress, but the Tortoise shows that adding premises *also* fails to compel – neither seems to "compel" in the strong sense. Does the capacity view explain the *normative force* ("I *should* infer Q") better? If so, how does a non-propositional state ground a normative "should"?

  7.  **The Role of Premises - If Capacity is Primary:** If the non-propositional capacity is truly primary in closing the inferential gap, what essential work are the *propositional premises themselves* actually doing? Are they merely triggering conditions for the capacity, or do they contribute substantively to the *reason* for the conclusion? If the latter, how do they interact with the non-propositional capacity to generate a reason that the premises alone cannot provide? Doesn't acknowledging their substantive role risk reopening the gap the capacity was meant to close?

  These questions directly target the coherence of the "capacity" concept, its ability to avoid granting immunity to bad rules without circularity, its potential relativistic consequences, its psychological plausibility, its explanatory power compared to the regress, and the residual role of premises. They force clarification on the nature of normativity, the source of logical discrimination, and the relationship between practice and justification. Good luck with the interview!
