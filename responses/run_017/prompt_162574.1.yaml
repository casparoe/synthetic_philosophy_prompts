answer: |-
  **Bottom line:** The films commit most strongly to a hybrid of perception and thermostat views, with perception dominant; the thermostat view is a genuine fourth option that captures structural roles the others miss, though it doesn't collapse *fully* into them. Judgment theory is actively undermined.

  **Scene Analysis:**

  1.  **Sadness transforming core memories (IO1):** The blue memory isn't *judged* sad; it's *perceived* differently. Joy treats the memory's original color as objective truth, but the film validates Sadness' ability to *re-perceive* the event's meaning. This supports perception theory (emotions as ways of apprehending value) and resists judgment theory (which would imply the memory has a fixed evaluative property). The thermostat view fits here too: Sadness' presence adjusts the "settings" for what aspects of experience register as salient (loss/comfort over pure joy).

  2.  **Joy keeping Sadness away from the console (IO1):** Joy's actions show emotions regulating *access* to control, not just forming judgments. She filters input (keeping Sadness from memories) and output (blocking her from the console). This is less about forming a *belief* about Riley's situation and more about enforcing an *attentional policy* – only joyful perceptions/impulses are permitted. This strongly supports the thermostat view: Joy sets the "volume" for other emotional signals. The homunculi have beliefs/desires (e.g., Joy believes sadness is bad), but their *function* is setting the system's operating parameters.

  3.  **Honesty Island buckling when Riley lies (IO1):** The collapse isn't a judgment *that* lying is wrong; it's an embodied, involuntary *reaction* to a value conflict. Riley *knows* she's lying (cognitive judgment exists), but the visceral crumbling shows the emotion (Disgust/embodied Honesty) registering the *perceived degradation* of her integrity. Feeling theory (bodily reaction) fits, but the *meaning* tied to the island (the value of honesty) points more to perception of value. The thermostat view struggles slightly here; it's less about *setting* thresholds and more about the *consequence* of violating deeply held values, though one could see the island as part of the "settings" defining Riley's identity stability.

  4.  **New emotions arriving (IO2):** Ennui, Embarrassment, Envy, and Anxiety don't arrive as judgments Riley makes; they emerge as new *modes of sensitivity* to the social world of adolescence. Their arrival signifies new capacities to *perceive* complex social values (status, belonging, future threats). This fits perception theory best – new ways of apprehending value emerge developmentally. Judgment theory (volitional acts) or feeling theory (simple bodily states) can't easily explain this emergence. The thermostat view captures that these new emotions *add new dials* to the console, expanding the range of "settings" available.

  5.  **Anxiety taking the console & building Sense of Self (IO2):** Anxiety doesn't just judge things scary; she actively *scans* for threats (perception), *constructs narratives* ("Sar-chasm"), and *filters memories* to build a future-oriented identity defined by potential danger. This isn't a single judgment; it's a *governing policy* focused on hyper-vigilance and control. The thermostat view excels here: Anxiety cranks up the "sensitivity" dial for threats and the "priority" dial for future scenarios, fundamentally altering Riley's cognitive landscape. The homunculi problem is present (Anxiety has plans), but her *effect* is changing system-wide settings.

  6.  **Bottling the original emotions (IO2):** This shows suppression *failing*. The bottled emotions aren't inert beliefs or feelings; they exert *pressure* on the system, distorting perception and behavior until released. This resists judgment theory (suppressed judgments don't typically act like pressurized forces). Feeling theory captures the somatic aspect, but perception theory explains the *distorted value perceptions* (e.g., panic seeing everything as catastrophic). The thermostat view sees bottling as an attempt to *force* settings to zero, which the system inherently resists because emotions are constitutive of its operation.

  7.  **The panic attack (IO2):** This is the climax of Anxiety's settings shift. It's not primarily a false *judgment* (though catastrophic thoughts occur); it's the system being *overwhelmed* by the intensity setting Anxiety imposed. The console freezing, alarms blaring – it's a system pushed beyond its operational limits by maladaptive settings. Perception is hijacked (everything is threat), bodily feelings are intense, but the core is the *failure of regulatory capacity* due to extreme settings. The thermostat view captures this system overload best.

  8.  **Ending with contradictory beliefs (IO2):** Joy explicitly gives up on defining Riley by one coherent set of judgments or values. The beliefs "I'm a good person" and "I'm not a good person" coexist. Emotions aren't forcing a single judgment; they allow multiple, conflicting *perspectives* (perceptions of value) to exist simultaneously. The console *holds* these contradictions. This directly undermines judgment theory (which struggles with stable contradictory beliefs). Perception theory handles it (different emotional lenses reveal different values). The thermostat view sees the console *allowing* multiple settings to be active contributors without demanding synthesis.

  **Thermostat View Assessment:** The films *do* provide evidence for it, particularly in scenes showing emotion *regulation* (Joy filtering, Anxiety taking control, bottling failing) and systemic effects (panic attack). The homunculi *are* a cheat – they inject mini-judgments/desires. However, the *function* of the emotions – controlling access, setting priorities, adjusting sensitivity – aligns with the thermostat view's core idea: emotions structure cognition and action by determining *what gets processed as significant and how*. It doesn't collapse neatly:
  *   **Vs. Judgment:** Thermostat is about *structural role*, not propositional content. Anxiety's policy isn't the judgment "hockey is dangerous"; it's setting hockey tryouts to "maximum threat priority."
  *   **Vs. Perception:** Thermostat explains *why* certain perceptions (threats) dominate others (joy) – it's the setting of the filter. Perception theory describes the *content* (seeing-as-dangerous), thermostat the *mechanism* making that content salient.
  *   **Vs. Feeling:** Thermostat incorporates feelings (settings have somatic correlates like panic) but focuses on their functional role in cognition. It survives as distinct by emphasizing the *architectural* function over the experiential or evaluative content.

  **Tier List (Film Support):**
  1.  **Perception Theory:** Strongest fit – emotions as ways of seeing value/perceiving significance in the world and memories.
  2.  **Thermostat View:** Strong secondary fit – best captures emotion regulation, systemic control, and prioritization functions.
  3.  **Feeling Theory:** Partial fit – bodily aspects are present (panic, island crumbling) but not sufficient.
  4.  **Judgment Theory:** Weakest/Positively Resisted – emotions are shown *interfering* with judgment, memories change meaning, contradictions coexist.

  **What to Tell Your Daughter:**
  Use the **Perception Theory** framework – it validates her anxiety as meaningful information about perceived threats/values ("anxiety is information") while aligning best with the film's core message and allowing for CBT techniques that *reframe* those perceptions. The thermostat view is philosophically sounder for understanding the *mechanism*, but perception is more accessible and directly supports the therapeutic goal.
