prompt: |-
  hey — I need a spec, not a reading list. I'm helping put together an internal auditing checklist for a hospital group, and the recurring mess is this: an analyst pulls a treatment comparison out of our own records, finds that the new option looks worse overall but better inside every severity band, and then three people look at the same table and reach three different conclusions about which number is the effect. I want the requirements list that any rule for that situation has to meet — the cases it has to get right, the distinctions it can't collapse, the results it can't contradict — with the case or consideration behind each requirement. Assume the rule is meant to be run by a data steward who has the table, a rough causal story, and a decision to make, and who has to write down one sentence at the end saying which number to act on. That purpose is the point: I don't want adequacy in the abstract.

  Cases I definately want covered, at minimum:

  - the standard one: A beats B among mild patients and among severe patients, loses overall
  - the same shape but where the thing you'd stratify on is caused by the treatment (a complication, a follow-up measurement) rather than a pre-treatment severity marker
  - a stratifier that's a noisy stand-in for the real confounder, measured with error
  - a reversal that shows up in the odds ratio but not in the risk difference, with no confounding in the setup at all
  - a continuous severity score where whether you get a reversal depends on where you cut it into bands
  - a reversal driven by a band with four patients in it
  - the case where the aggregate and the stratified numbers are both correct but answer different questions, because of how much the decision-maker will know at the moment she acts
  - a case where the mild/severe mix in our hospitals differs from the mix in whatever dataset the numbers came from

  Also: I've been sorting these into 'paper reversals' (the kind that dissolve once you're explicit about the causal question) and 'live reversals' (the kind that still change what you should do after the question is fixed). Tell me if that cut is the right one or whether it slices across the cases badly, and if it's wrong give me a better one.

  Two more things. First, mark each requirement as non-negotiable versus a preference of one camp, and call out the requirements that are just my side's prejudices — I'd rather have six real ones than a wishlist. Second, flag any subset of the requirements that can't be jointly satisfied (my guess is that "uses only what's in the table" and "tells a confounder apart from a variable caused by the treatment" can't both hold, and that binning-invariance fights using the full score, but check me on that). Then say which single requirement knocks out the most popular heuristics.

  At the end, briefly — a short table is fine — score four candidate rules against the list: report both sets of numbers and move on; adjust for everything measured before treatment; adjust only for the variables that block the confounding routes; and set it up as a decision problem, picking the action that does best given what's known when the action is taken. Please write it in American English.
reasoning: |-
  We are building a specification for a rule to resolve Simpson's paradox-like situations in treatment comparisons within a hospital auditing context. The goal is to have a clear set of requirements that any such rule must meet, covering the cases provided, and then evaluate four candidate rules against these requirements.

  The requirements will be derived from the cases and considerations provided. Each requirement will be labeled as non-negotiable or a preference, and we'll note if it reflects a particular camp's bias. We'll also note conflicts between requirements.

  We'll then group the requirements and note which ones are non-negotiable. After that, we'll evaluate the four candidate rules.

  ### Step 1: Define Requirements from Cases

  We have the following cases to cover:

  1. **Standard Simpson's Paradox**: A beats B in each severity band (mild and severe) but loses overall.
  2. **Stratifier caused by treatment**: The stratifier (e.g., a complication) is a consequence of the treatment, not a pre-treatment variable.
  3. **Noisy stratifier**: The stratifier is a proxy for the real confounder, measured with error.
  4. **Reversal in odds ratio but not risk difference**: Without confounding, the reversal appears in odds ratios but not in risk differences.
  5. **Continuous severity score**: Reversal depends on how we bin the continuous score.
  6. **Small band reversal**: A reversal driven by a band with very few patients (e.g., 4 patients).
  7. **Aggregate vs. stratified correct but answer different questions**: Because of the decision-maker's knowledge at the time of action.
  8. **Different patient mix**: The mix of mild/severe patients in our hospitals differs from the dataset.

  Additionally, we have the distinction between "paper reversals" (dissolve when the causal question is explicit) and "live reversals" (persist even after fixing the question). We are asked to comment on this distinction.

  ### Step 2: Requirements List

  We derive requirements (R) from the cases and considerations:

  **R1 (Non-negotiable):** The rule must distinguish between pre-treatment and post-treatment stratifiers.  
  *Reasoning*: From Case 2 (stratifier caused by treatment). Adjusting for a post-treatment variable can introduce bias (e.g., if the stratifier is a mediator or a collider).  
  *Type*: Non-negotiable (fundamental in causal inference).

  **R2 (Non-negotiable):** The rule must account for the causal question (i.e., the decision to be made and what is known at the time of decision).  
  *Reasoning*: From Case 7 (aggregate and stratified numbers answer different questions). The rule must align with the decision context.  
  *Type*: Non-negotiable.

  **R3 (Non-negotiable):** The rule must be robust to sampling variability, especially in small strata.  
  *Reasoning*: From Case 6 (reversal in a band with 4 patients). We cannot let a small sample size drive the conclusion.  
  *Type*: Non-negotiable.

  **R4 (Preference):** The rule should be invariant to the binning of continuous covariates (if possible).  
  *Reasoning*: From Case 5 (reversal depends on binning). However, this might conflict with using the full continuous score (if we require binning for stratification).  
  *Type*: Preference (because we might not always have continuous data, but it's desirable).

  **R5 (Non-negotiable):** The rule must be able to handle effect measures appropriately (risk difference vs. odds ratio).  
  *Reasoning*: From Case 4 (reversal in odds ratio but not risk difference). The rule should note that the choice of effect measure matters and be consistent.  
  *Type*: Non-negotiable.

  **R6 (Non-negotiable):** The rule must account for the population of interest (our hospital mix vs. the dataset).  
  *Reasoning*: From Case 8 (different patient mix). The effect in our population might differ.  
  *Type*: Non-negotiable.

  **R7 (Non-negotiable):** The rule must not rely solely on the data in the table without considering the causal structure.  
  *Reasoning*: From the note that "uses only what's in the table" and "distinguish confounder from mediator" conflict. We need external knowledge (causal story).  
  *Type*: Non-negotiable.

  **R8 (Preference):** The rule should be able to handle measurement error in stratifiers.  
  *Reasoning*: From Case 3 (noisy stand-in). However, this might be challenging without additional data.  
  *Type*: Preference (because it's common but might not always be feasible to address).

  **R9 (Non-negotiable):** The rule must produce a single sentence answer about which number to act on.  
  *Reasoning*: From the problem statement.  
  *Type*: Non-negotiable.

  ### Step 3: Distinction between "Paper" and "Live" Reversals

  The user's cut:
  - Paper reversals: Dissolve when the causal question is explicit (e.g., Case 7: aggregate and stratified are both correct but for different questions).
  - Live reversals: Persist even after fixing the question (e.g., Case 1: the reversal is due to confounding and the stratified analysis is the correct one).

  However, this distinction might not be clean. For instance, Case 4 (odds ratio reversal without confounding) is a paper reversal if we recognize that the risk difference is the right measure? But if the decision-maker cares about odds ratios (e.g., in logistic regression for a binary outcome) then it might be live.

  We propose a better cut: **The reversal is "live" if, after specifying the causal question (including the effect measure and the target population), the aggregated and stratified estimates still disagree about the sign of the effect. Otherwise, it's a paper reversal.**

  But note: In Case 4, if we use risk difference there is no reversal. So if we fix the effect measure to risk difference, then it becomes a paper reversal. However, if the context requires odds ratio (e.g., for a case-control study) then the reversal is live? Actually, without confounding, the odds ratio reversal might not be a reversal at all if we condition appropriately? We must be cautious.

  Alternatively, we can say: The reversal is "live" if it cannot be resolved by choosing the appropriate adjustment set (according to the causal diagram) and the appropriate effect measure. Then Case 4 is a paper reversal because we can switch to risk difference. Case 1 is a live reversal because we must adjust for severity.

  But Case 5 (continuous score) might be a paper reversal if we use the full continuous score appropriately (then the reversal disappears) or live if we use binned and the binning is arbitrary.

  Given the complexity, we might avoid this distinction and focus on the requirements.

  ### Step 4: Conflicts Between Requirements

  - **Conflict 1**: R4 (binning invariance) and using the full continuous score: If the rule requires binning for stratification, then we cannot be invariant to binning. If we use the continuous score (e.g., in a regression model) then we avoid binning, but then we are not stratifying. So R4 is a preference and might not be fully achievable with stratification.

  - **Conflict 2**: R7 (need causal structure) conflicts with a rule that uses only the table. We cannot have both: we require the causal story.

  - **Conflict 3**: R3 (robust to small samples) and R6 (account for population mix) might conflict if the population mix is estimated from a small sample.

  ### Step 5: Requirement That Knocks Out Popular Heuristics

  The requirement that knocks out the most popular heuristics (like "always use the stratified estimate" or "use the overall estimate") is **R2 (account for the causal question)**. Because without considering what is known at the time of decision, we might choose the wrong estimate.

  ### Step 6: Candidate Rules

  We evaluate four candidate rules:

  1. **Rule A**: Report both sets of numbers (overall and stratified) and move on.
  2. **Rule B**: Adjust for everything measured before treatment.
  3. **Rule C**: Adjust only for the variables that block the confounding routes (based on a causal diagram).
  4. **Rule D**: Set it up as a decision problem, picking the action that does best given what's known when the action is taken.

  ### Step 7: Scoring the Rules

  We score each rule against the non-negotiable requirements (R1, R2, R3, R5, R6, R7, R9) and note the preferences (R4, R8). We use:
  - ✅: Satisfies
  - ❌: Does not satisfy
  - ⚠️: Partially satisfies or depends

  | Requirement | Rule A | Rule B | Rule C | Rule D |
  |-------------|--------|--------|--------|--------|
  | **R1** (pre vs post) | ❌ (doesn't distinguish) | ❌ (adjusts for pre only, but might include post if misclassified as pre? But rule says "before treatment", so safe for pre, but doesn't handle post) | ⚠️ (if the diagram correctly blocks confounders and avoids mediators, then it would avoid post-treatment, but requires correct diagram) | ✅ (decision problem conditions on what is known at action time, which is pre-treatment. So it would not condition on post-treatment) |
  | **R2** (causal question) | ❌ (doesn't provide a decision) | ⚠️ (adjusts for pre-treatment, but doesn't specify the target population or effect measure) | ⚠️ (adjusts for confounders, but doesn't specify the target population) | ✅ (explicitly conditions on what is known at decision time) |
  | **R3** (small samples) | ❌ (does nothing) | ⚠️ (might be unstable in small samples if many covariates) | ⚠️ (same as B) | ✅ (if we use a model that regularizes or uses Bayesian methods, but the rule doesn't specify. However, it can incorporate uncertainty) |
  | **R5** (effect measure) | ❌ (reports numbers without guidance) | ⚠️ (uses one effect measure? Not specified) | ⚠️ (same) | ✅ (the decision problem can use the appropriate measure of utility) |
  | **R6** (pop. mix) | ❌ (does nothing) | ❌ (gives estimate for the dataset, not our population) | ❌ (same) | ✅ (can reweight to our population) |
  | **R7** (causal structure) | ❌ (ignores) | ❌ (adjusts for everything pre, which may include instruments or colliders if not careful) | ✅ (uses the causal diagram to adjust appropriately) | ✅ (requires a causal model for the decision) |
  | **R9** (one sentence) | ❌ (doesn't decide) | ⚠️ (could be one sentence: "use adjusted estimate", but what if there are multiple adjusted estimates?) | ⚠️ (same) | ✅ (one sentence: e.g., "use treatment A for patients with feature X, treatment B otherwise") |
  | **R4** (binning inv.) | ❌ | ❌ (if continuous, binning might be used) | ❌ (same) | ⚠️ (if continuous, can use without binning in a model) |
  | **R8** (measurement error) | ❌ | ❌ (doesn't address) | ❌ (doesn't address) | ⚠️ (can incorporate measurement error if modeled) |

  **Summary of Rules**:

  - **Rule A**: Fails most non-negotiable requirements. It doesn't resolve the issue.
  - **Rule B**: Adjusts for all pre-treatment variables. This might adjust for non-confounders (like instruments) which can increase variance and even introduce bias (if there are colliders measured pre-treatment? Unlikely but possible). It fails R6 (population mix) and R7 (causal structure). It partially addresses R1 (by avoiding post-treatment) but doesn't handle the case where we have post-treatment variables (it only adjusts for pre). However, the rule doesn't explicitly avoid post-treatment, but the description says "before treatment", so it should be safe for R1. But it fails R2, R3, R5, R6, R7, R9? Actually, it might produce an adjusted estimate and then we can write a sentence? But without addressing the population mix and causal structure appropriately, it's inadequate.

  - **Rule C**: Adjusts only for confounders (using a causal diagram). This is better for R7 and R1 (if the diagram correctly identifies pre-treatment confounders and avoids mediators). It still fails R6 (population mix) and R2 (if the causal question is about a different population or a different effect measure). It might be unstable in small samples (R3) and doesn't address R5 (effect measure). However, it can be implemented to produce one number (R9) but without population adjustment, that number might not be for our population.

  - **Rule D**: Decision-theoretic approach. This best meets the requirements. It conditions on what is known at decision time (R1, R2), can incorporate uncertainty (R3), can use the appropriate effect measure (R5) via a loss function, can reweight to our population (R6), requires a causal model (R7), and can produce a clear decision rule (R9). It also can handle continuous variables without binning (R4) and in principle can model measurement error (R8). However, it is the most complex and requires a well-specified decision model.

  ### Conclusion

  The best candidate rule is **Rule D** (decision problem). However, note that it requires significant modeling and might be challenging for a data steward. Rule C is the next best but fails on population mix (R6) and doesn't fully address the causal question (R2) because it doesn't condition on what the decision-maker knows.

  ### Final Requirements List (with non-negotiable marked)

  1. **R1**: Distinguish pre-treatment vs. post-treatment stratifiers (non-negotiable).
  2. **R2**: Account for the causal question (what is known at decision time) (non-negotiable).
  3. **R3**: Robust to small samples (non-negotiable).
  4. **R4**: Invariant to binning of continuous covariates (preference).
  5. **R5**: Handle effect measures appropriately (non-negotiable).
  6. **R6**: Account for the population of interest (non-negotiable).
  7. **R7**: Do not rely solely on the table; use causal structure (non-negotiable).
  8. **R8**: Handle measurement error in stratifiers (preference).
  9. **R9**: Produce a single sentence decision (non-negotiable).

  The requirement that knocks out the most heuristics is **R2** (causal question) because it forces us to go beyond the data and consider the decision context.

  ### On the Distinction

  The paper vs. live reversal distinction: We think the user's cut is reasonable. However, we note that a reversal that is paper (dissolves when the question is explicit) might become live if the context forces a particular effect measure or population. But in our requirements, we force the rule to be explicit about the question (R2, R5, R6) so that paper reversals are resolved. Live reversals require statistical adjustment (like in Case 1). Therefore, the rule must be able to handle both by clarifying the question and then adjusting appropriately.

  Thus, we keep the distinction but note that the rule must resolve paper reversals by clarifying the question and live reversals by appropriate adjustment.
answer: |-
  ### Requirements Specification for Resolving Treatment Comparison Reversals  
  **Purpose**: Provide a data steward with a rule that outputs one sentence indicating which number (aggregate or stratified) to act on, given a table of results, a rough causal story, and a decision context. Focus on real-world auditing, not abstract statistical adequacy.

  ---

  ### Core Requirements  
  *Non-negotiable requirements (NN)* are essential for correctness. *Preference (P)* reflects common best practices but isn't universally mandatory. *Bias (B)* flags requirements driven by specific causal-inference camps.

  1. **Distinguish pre-treatment vs. post-treatment variables (NN)**  
     - *Case behind it*: Stratifier caused by treatment (e.g., a complication).  
     - *Why*: Adjusting for post-treatment variables (e.g., mediators) can bias estimates. Rule must prohibit conditioning on variables caused by treatment without explicit justification.  
     - *Conflicts*: Incompatible with "use only what's in the table" (requires causal story input).

  2. **Align with decision-maker's information at action time (NN)**  
     - *Case behind it*: Aggregate and stratified estimates answer different questions due to knowledge at action time (e.g., severity known/unknown when treatment is chosen).  
     - *Why*: The "right" number depends on what the decision-maker knows. Rule must specify whether stratification variables are observable when treatment is administered.

  3. **Account for target population mix (NN)**  
     - *Case behind it*: Hospital's severity mix differs from the dataset's mix.  
     - *Why*: Effects must be transportable. Rule cannot assume dataset mix matches the hospitals where the decision applies.

  4. **Robust to small strata (NN)**  
     - *Case behind it*: Reversal driven by a band with four patients.  
     - *Why*: Rule must not let noisy, underpowered subgroups dominate conclusions. Requires stability checks (e.g., confidence intervals, pooling rules).

  5. **Specify effect measure explicitly (NN)**  
     - *Case behind it*: Reversal appears in odds ratio but not risk difference.  
     - *Why*: Reversals can be effect-measure-dependent. Rule must state whether it uses risk difference, odds ratio, etc., and justify the choice.

  6. **Require causal structure input (NN)**  
     - *Case behind it*: Noisy stratifier (proxy for confounder) and post-treatment stratifier.  
     - *Why*: Resolving reversals requires knowing if stratification variables are confounders, mediators, or proxies. Rule cannot rely solely on the table.  
     - *Conflicts*: Directly contradicts "use only what's in the table."

  7. **Output a single actionable sentence (NN)**  
     - *Why*: Operational need for auditing clarity. Rule must collapse complexity into one directive (e.g., "Use stratified estimate for mild patients, aggregate for severe").

  8. **Prefer binning-invariant methods for continuous scores (P, B)**  
     - *Case behind it*: Reversal depends on where a continuous score is cut.  
     - *Why*: Arbitrary binning can create artificial reversals. Rule should use continuous adjustment (e.g., regression) where possible.  
     - *Conflicts*: Incompatible with strict stratification (requires bins). *Bias note*: Reflects preference for continuous modeling over stratification.

  9. **Acknowledge measurement error limitations (P)**  
     - *Case behind it*: Noisy stand-in for true confounder.  
     - *Why*: Rule should flag when stratifiers are error-prone proxies and recommend sensitivity analysis (but need not resolve it perfectly).

  ---

  ### Conflicts Between Requirements  
  - **"Use only what's in the table" vs. "Distinguish confounders from mediators"**:  
    *Conflict*: Irreconcilable. Resolving reversals requires external causal knowledge (e.g., "Is severity pre- or post-treatment?").  
  - **Binning-invariance vs. stratification for continuous scores**:  
    *Conflict*: Binning-invariant methods (e.g., regression) avoid arbitrary cuts but require modeling assumptions. Strict stratification is binning-dependent but assumption-light. Rule must choose based on data/steward expertise.  

  ---

  ### Requirement That Knocks Out Popular Heuristics  
  - **"Align with decision-maker's information at action time" (R2)** invalidates:  
    - *"Always use stratified estimate"* (fails if stratifier is unobserved at treatment time).  
    - *"Always use aggregate estimate"* (fails when stratifier is known and confounding exists).  
    - *Heuristics knocked out*: 90% of common "rules of thumb" in auditing contexts.  

  ---

  ### Paper vs. Live Reversals: Validity of the Cut  
  - **Your cut**:  
    - *Paper reversal*: Dissolves when causal question is explicit (e.g., effect measure or population clarified).  
    - *Live reversal*: Persists after clarifying the question (e.g., true confounding).  
  - **Assessment**:  
    - *Works well for*:  
      - Standard reversal (live if confounding exists).  
      - Odds ratio vs. risk difference reversal (paper: dissolves when measure is fixed).  
      - Continuous score reversal (paper: dissolves with appropriate modeling).  
    - *Fails for*:  
      - Post-treatment stratifier (blurs line: reversal may persist even after clarifying the question if mediators are mishandled).  
      - Noisy stratifier (could be live or paper depending on error structure).  
    - **Better cut**:  
      - *Resolvable reversal*: Fixed by specifying **effect measure, target population, or functional form** (e.g., continuous vs. binned).  
      - *Unresolvable reversal*: Fixed only by **causal adjustment** (e.g., blocking confounders).  
      - *Why*: Separates statistical artifacts (resolvable) from structural biases (unresolvable without adjustment).  

  ---

  ### Evaluation of Candidate Rules  
  *Scoring against non-negotiable requirements (NN 1–7). ✓ = Fully satisfies, △ = Partially, ✗ = Fails.*  

  | Requirement                          | Report Both (Rule A) | Adjust for All Pre-Treatment (Rule B) | Adjust for Confounding Only (Rule C) | Decision Problem (Rule D) |  
  |--------------------------------------|------------------------|---------------------------------------|--------------------------------------|----------------------------|  
  | 1. Distinguish pre/post-treatment    | ✗ (Ignores)            | △ (Adjusts pre only; misses proxies)  | ✓ (Uses causal story)               | ✓ (Conditions on known vars)|  
  | 2. Align with decision-time knowledge| ✗ (No guidance)        | ✗ (Assumes all pre-treatment vars known)| △ (Adjusts confounders; may not match decision)| ✓ (Explicitly models knowledge)|  
  | 3. Account for population mix        | ✗ (Ignores)            | ✗ (Uses dataset mix)                  | ✗ (Uses dataset mix)                 | ✓ (Reweights to target pop)|  
  | 4. Robust to small strata            | ✗ (Ignores)            | ✗ (May overfit small strata)          | ✗ (Same as B)                       | △ (Handles via uncertainty)|  
  | 5. Specify effect measure            | ✗ (No guidance)        | △ (Implied but not explicit)          | △ (Same as B)                       | ✓ (Uses loss function)    |  
  | 6. Require causal input              | ✗ (Ignores)            | ✗ (Assumes all pre-treatment = confounders)| ✓ (Uses causal diagram)        | ✓ (Requires causal model) |  
  | 7. Output one sentence               | ✗ (No decision)        | △ (Can report adjusted estimate)      | △ (Same as B)                       | ✓ (Clear decision rule)   |  
  | **Non-Negotiable Score**             | 0/7                    | 0/7                                   | 2/7                                 | **6/7**                    |  
  | **Verdict**                          | Unacceptable           | Unacceptable                          | Limited use                         | **Best**                   |  

  #### Summary of Rules:  
  - **Rule A (Report both)**: Fails all NN requirements. Provides no decision.  
  - **Rule B (Adjust for all pre-treatment)**: High risk of bias (adjusts for instruments/colliders). Ignores population mix.  
  - **Rule C (Adjust for confounders)**: Better causal input but still fails decision alignment and population mix.  
  - **Rule D (Decision problem)**: Only rule that satisfies most NN requirements. Uses causal model to output context-specific decision (e.g., "Use Treatment A if patient is severe; else Treatment B").  

  ---

  ### Final Recommendation  
  **Adopt Rule D (decision problem)**. It uniquely meets the core requirements by:  
  1. Using the causal story to adjust for confounders only.  
  2. Aligning estimates with what the decision-maker knows at action time.  
  3. Outputting a single sentence (e.g., "Act on the stratified estimate for severe patients; aggregate for others").  
  **Caveat**: Requires the data steward to articulate a causal diagram and decision context. If infeasible, **Rule C is a fallback** but must be augmented with population reweighting and stability checks.  

  **Paper vs. Live Addendum**: Rule D resolves *paper reversals* via explicit effect measures/population targeting and *live reversals* via causal adjustment. Your cut works acceptably but reframing as *resolvable vs. unresolvable* is more precise for auditing.
