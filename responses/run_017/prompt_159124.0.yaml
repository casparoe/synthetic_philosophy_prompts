prompt: |-
  I'm finishing a chapter on the standing condition on blame, and I've reached the point where I need to say what the condition actually is. Before I build an account around my own reactions, I want to see whether they add up to anything, so here they are, case by case, as honestly as I can report them.

  1. A department chair who has missed every committee deadline for years writes to a junior colleague saying she has let the department down by missing a reporting deadline. My verdict: no standing. The colleague did do wrong, and the chair's judgment about that seems to me correct; what's off is the chair's delivering it.

  2. A senior scholar who padded a citation list once, twenty years ago, was caught, sanctioned, apologized publicly, and has a clean record since, blames a graduate student for padding a bibliography. Standing intact. I don't even feel much residual awkwardness, provided she doesn't lecture.

  3. Same as 2, except the padding was never discovered and she has quietly kept doing it. Everyone, the student included, takes the blame as entirely in order. I still want to say the blame is defective, but I also want to say the student has nothing to complain about. So whatever goes wrong here isn't something the addressee can invoke, which sits badly with how I think about 1.

  4. A woman who was cruelly neglectful of her younger brother for a decade blames her neighbour for cruelly neglecting his elderly mother. Standing intact, or at any rate not lost. Yet this is also a case of blaming someone for a kind of conduct one has oneself engaged in, which is what sank the chair in 1.

  5. A senior scholar with a scrupulous record whose close collaborator has repeatedly padded citation lists, and to whom she has never said a word, blames a junior scholar in another subfield for padding. Standing lost, or badly diminished — and this despite her own hands being clean with respect to the act itself.

  6. Two co-authors jointly agreed to bury a disconfirming result. One now privately blames the other for the burial. No standing, and this strikes me as worse than 1: the blame seems to do extra work, moving her own share of the responsibility out of view.

  7. A lab head who never personally manipulated data, but who structured the lab's incentives so that manipulation was predictable and looked the other way when it happened, blames a postdoc for manipulating. My verdict wobbles between no standing and standing-intact-but-something-adjacent-is-wrong, and I can't tell which is right.

  8. Someone who has never broken a confidence, but only because she has never been tempted, and who is known by everyone involved to have broken it instantly in the same circumstances, blames a colleague for breaking one. Standing intact: counterfactual hypocrisy doesn't look like hypocrisy to me. But I can't say why, and the verdict rubs against my reaction to 5, where a pattern in how she enforces the norm seemed to matter.

  9. A university that pays adjuncts poverty wages and depends on their labour issues a public statement censuring an undergraduate for plagiarism as a violation of the community's shared commitment to honest work. I go back and forth. Sometimes the statement reads as having no standing at all; sometimes it reads as fully in order, because the exploitation and the plagiarism strike me as unrelated; sometimes it reads as in order on standing but objectionable for some neighbouring reason I can't name.

  Two pairs do the real work, I think: 1 against 4, which forces a decision about how finely the relevant norm is individuated, and 5 against 8, which forces a decision about whether standing tracks your conduct or your economy of enforcement.

  What I'd like from you:

  - One principle, or at most two competing ones, stated precisely enough to apply to a new case, with each clause tied to the case that motivates it and an indication of which of my verdicts each clause is carrying.
  - A decision about what sort of condition standing is: a condition on the propriety of issuing blame, or a condition on the blame's being warranted or true. Show how your choice handles 3, where the defect and the addressee's grounds for complaint come apart. A principle that simply re-describes my verdicts case by case, or that says you lack standing exactly when your blame would be hypocritical, won't help me.
  - A rule for the grain of the norm: what has to be true of the blamer's own violation for it to be the same violation. Apply it to 1, 4, and 7.
  - A verdict on the collective case, 9, and a verdict on whether one principle covers individuals and institutions or whether institutions need their own clause. My chapter argues that institutions and their officers can lack standing even when no individual member has unclean hands, so I need to know whether that claim needs extra machinery.
  - Verdicts on three cases I haven't listed: a recovering addict who relapsed last week and blames another addict for using; a blamer who has done the very thing but sincerely, through motivated reasoning, believes she never has; and a blamer who blames while openly stating, in the same breath, that she has done the same thing herself.
  - An honest statement of which of my verdicts your principle cannot accommodate, and what someone who wanted to keep that verdict would say against you.

  For context on what the principle has to be able to do: I want to use it to argue that some institutional blame is defective in a way that is not just a sum of defects in the individuals who issue it. Please work the problem out from the cases rather than by surveying what has been said about standing; I'm not looking for a literature review, and I'd rather you didn't cite anything. If some established position is worth bringing in, describe it in a sentence and say what it predicts here.
reasoning: |-
  Hmm, the user is working on a philosophical chapter about the standing condition for blame and has shared several detailed cases where they have intuitive reactions about whether the blamer has standing. They need me to develop a precise principle that explains these intuitions and addresses specific conceptual questions.

  Looking at their cases, I notice several patterns. The department chair in Case 1 lacks standing despite correctly identifying wrongdoing, while the senior scholar in Case 2 retains standing despite past misconduct. What's interesting is how Case 3 creates tension - the blame seems defective but the student can't complain. Cases 4 and 5 highlight that what matters isn't just personal conduct but enforcement patterns. The addict case (which they mention later) would test how recency and reform affect standing.

  The core challenge seems to be balancing two factors: the blamer's relationship to the specific norm (grain problem), and their broader role in maintaining normative practices (enforcement economy). Case 9 with the university is particularly tricky because it involves collective agency and whether unrelated wrongs affect standing.

  I think the Enforcement Economy Principle captures this best. It makes standing depend on whether the blamer has properly participated in the social practice of enforcing that norm. This explains why the hypocritical chair (Case 1) lacks standing - they've undermined the deadline norm through their own violations. Whereas the neighbor in Case 4 can blame for neglect because it's a different normative context (sibling vs parental duties).

  For the grain issue, we need to say two norms are "the same" when they share core prescriptions and social enforcement contexts. This distinguishes the chair's deadlines (same norm) from sibling/parental neglect (different norms). The university case is harder - their exploitation might undermine their authority on academic integrity if we see these as part of a broader "fair work" norm cluster.

  The principle handles Case 3 well: the senior scholar lacks standing because they've corrupted the citation norm's enforcement, but the student can't complain because they're still guilty. This shows standing is about propriety, not warrant. For new cases, the relapsed addict would lack standing if they're currently violating the norm, while the self-deceived blamer might retain standing if they've enforced consistently.

  The main tension is with Case 7 (lab head) - my principle says no standing, but the user wavers. Someone defending standing might argue the lab head's actions constitute distinct wrongs. Still, the Enforcement Economy view seems strongest for institutional blame, which is crucial for the user's project.
answer: |-
  Based on your case intuitions and requirements, here’s a principle, its justification, and its application to your queries:

  ### **The Enforcement Economy Principle**
  **A blamer lacks standing to blame B for violating norm N if the blamer has significantly contributed to the erosion or corruption of the social practice of holding agents accountable to N within the relevant normative community, through either:**
  1.  **Personal Violation:** Their own pattern of violating N *without adequate redress* (e.g., unacknowledged, unrepented, ongoing, or uncorrected violations), **OR**
  2.  **Enforcement Failure:** Their pattern of *failing to enforce N* against relevant others (including themselves) when they had the capacity and opportunity to do so, thereby signaling that N is not seriously binding or fostering an environment where N is disregarded.

  **What makes norms "the same" (Grain)?** Norms N₁ and N₂ are "the same norm" for standing purposes if they share:
      *   **Core Prescriptive Content:** They prohibit/require substantively the same type of conduct in relevantly similar contexts.
      *   **Social Enforcement Context:** They are upheld and enforced within the same, or deeply overlapping, normative community or relationship structure where the blamer holds a role or authority relevant to enforcing *that type* of norm.

  **Nature of Standing:** Standing is a **condition on the propriety of *issuing* blame**, not on the warrant or truth of the blame (i.e., whether B *did* violate N). It concerns the blamer's *authority* or *right* to perform the act of blaming within the normative practice. This explains Case 3: The senior scholar's blame is *improper* (due to their own corrupting violation - Clause 1), but the student *has no complaint about the standing defect itself* because the student is guilty and the defect doesn't negate their wrongdoing or directly wrong *them*; it makes the act of blaming *socially incongruous* or *authority-undermining*.

  ---

  ### **Application to Your Cases & Queries**

  1.  **Case 1 (Chair):** *No Standing (Clause 1).* The chair violates the *same norm* (timely reporting) within the *same community/role* (department deadlines). Their unredressed pattern erodes the norm's authority, making their blame incongruous.
  2.  **Case 2 (Senior, Reformed):** *Standing Intact.* Past violation redressed (caught, sanctioned, apologized, clean record). No ongoing erosion (Clause 1 fails). No relevant enforcement failure (Clause 2 fails).
  3.  **Case 3 (Senior, Unrepentant):** *No Standing (Clause 1).* Unredressed, ongoing violation of the *same norm* corrupts the practice. Student has no complaint because blame's *truth* is unaffected.
  4.  **Case 4 (Neglectful Sister):** *Standing Intact.* Norms are *different grain*: Sibling neglect vs. parental neglect involve distinct core obligations and relationship structures/communities. Her past wrong doesn't corrupt *this* norm's enforcement practice.
  5.  **Case 5 (Clean Scholar, Silent on Collaborator):** *No Standing (Clause 2).* Failure to enforce N (citation integrity) against a close collaborator, despite capacity/opportunity, signals N isn't binding and fosters disregard. Her personal cleanliness doesn't offset this enforcement failure within the relevant community.
  6.  **Case 6 (Co-authors):** *No Standing (Primarily Clause 1, amplified by Clause 2).* Joint violation makes her blame an act of *redistributing* responsibility (personal violation without redress). Her silence/acquiescence during the act also implies enforcement failure (Clause 2).
  7.  **Case 7 (Lab Head):** *No Standing (Clause 2).* Structuring incentives and looking away constitutes a profound *failure to enforce* the norm against data manipulation against relevant others (postdocs), actively fostering an environment where N is disregarded. This erodes the practice more than mere personal violation.
  8.  **Case 8 (Counterfactual Hypocrite):** *Standing Intact.* No *actual* violation (Clause 1 fails) and no *actual* enforcement failure (Clause 2 fails). Motive/lack of temptation doesn't constitute corruption of the practice; only actions do. Contrasts with Case 5 because here there is no *pattern of non-enforcement* – the norm *is* enforced (she just hasn't been tested).
  9.  **Case 9 (University):**
      *   **Verdict:** *No Standing (Clause 2 - Enforcement Failure).*
      *   **Reason:** The university systemically *fails to enforce* norms of fair compensation and honest work (exploiting adjuncts) within the *same broad normative community* (the academic institution) where it claims authority to enforce the plagiarism norm (another norm of "honest work"). This failure erodes the integrity of the entire practice of holding community members accountable for work-related norms. While the *specific* wrongs differ (wages vs. plagiarism), they share the overarching context of "commitment to honest work" within the institution, and the systemic exploitation signals that the institution's commitment to *any* such norms is hollow. *One principle covers both:* Institutions lack standing if *their own institutional actions/policies* significantly corrupt the relevant normative practice (here, institutional honesty/fairness). This aligns with your claim about institutional defect beyond individual hands.

  **New Cases:**
  *   **Recovering Addict (Relapsed Last Week) Blames Another:** *No Standing (Clause 1).* Recent, unredressed (or insufficiently redressed) violation of the *same norm* (abstinence) within the *same community* (recovery) significantly corrupts the practice. The recency and lack of demonstrated stability matter.
  *   **Blamer Sincerely (But Mistakenly) Believes She Never Violated N:** *Standing depends.* If she *has* violated N unredressed → *No Standing (Clause 1)* – her belief is irrelevant to the objective corruption. If she *hasn't* violated N → Standing intact. Her psychology doesn't change the facts of her conduct.
  *   **Blamer Blames While Openly Admitting She Did Same:** *Standing Intact?* This is complex. If admission is part of a genuine *acknowledgment* of wrong and shared fallibility ("I failed at this too, it's hard, but what you did was wrong"), it *might* restore standing by *addressing* the violation (Clause 1). If it's flippant or minimizes ("Yeah, we all do it, but you got caught!"), it likely *reinforces* the corruption → *No Standing (Clause 1).* The key is whether the admission functions as redress or further erosion.

  **Established Position Contrast (Briefly):** The "Clean Hands" doctrine (lacking standing only if blamer is guilty of *the same specific wrong*) would predict *standing* in Cases 4, 5, 7, 8, and likely 9. It clashes sharply with your intuitions in 5, 7, and 9, and struggles with the grain issue in 1 vs 4. The Enforcement Economy Principle better captures your pattern, especially the significance of *enforcement patterns* (5, 7, 8) and *systemic corruption* (9).

  **Accommodation & Tension:**
  *   **Accommodates:** 1 (Clause 1), 2 (Neither), 3 (Clause 1), 4 (Different grain), 5 (Clause 2), 6 (Clause 1/2), 7 (Clause 2), 8 (Neither), 9 (Clause 2), Relapsed Addict (Clause 1), Sincere Mistake (depends on facts), Open Admission (contextual).
  *   **Primary Tension: Case 7 Verdict.** You reported wobbling between "no standing" and "standing intact but adjacent wrong." The principle firmly says *no standing* (Clause 2). Someone wanting to keep the "standing intact" intuition might argue: The lab head's actions (structuring incentives, looking away) are *distinct wrongs* (mismanagement, negligence), not a failure to enforce *the specific norm against data manipulation itself*. Enforcing N against the postdoc doesn't *directly* contradict her prior conduct regarding N in the way the chair's conduct does. The "adjacent wrong" is her *culpability for creating the situation*, not a standing defect *per se*. The principle counters that her actions *are* a fundamental failure to uphold N within her domain, making her blame incongruous and authority-undermining.

  **Why This Works for Your Goal:** The Enforcement Economy Principle directly explains how *institutional* blame can be defective without unclean individual hands (Case 9, Clause 2). The institution's *policies* (exploitation) constitute a failure to enforce norms of honest work, corrupting the practice and undermining its standing to enforce *any* work-related norm like plagiarism. The defect stems from the institution's *role* in the normative economy, not an aggregation of individual faults. This provides the precise machinery your chapter needs.

  This principle grounds standing in the blamer's role within the *social practice of norm enforcement*, linking your intuitions across cases while providing clear, applicable criteria for propriety, grain, and institutional blame.
