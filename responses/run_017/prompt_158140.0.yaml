  ### Thought Experiment: Hospital Analgesia Allocation  
  A district hospital has one remaining box of a long-acting opioid analgesic, effective for exactly 30 days. It must be allocated immediately. The box can be used in one of two ways:  
  - **Option A**: Fully alleviate 30 days of severe pain for Patient Alpha, who suffers constant pain at intensity 9 (on a 0–10 scale, where 0 is no pain and 10 is agony).  
  - **Option B**: Fully alleviate 30 days of moderate pain for 10 patients (Beta1–Beta10), each suffering constant pain at intensity 4.  

  Without treatment, Alpha endures 270 units of suffering (9 intensity × 30 days), and each Beta endures 120 units (4 × 30). Alleviating pain restores patients to a neutral state (0 utils of welfare, no suffering or pleasure). The analgesic is equally effective per unit for all patients. No other effects (e.g., side effects, long-term consequences, fairness, or rights) apply.  

  ---

  ### (1) Cardinal Scale and Numerical Values  
  - **Suffering**: Measured in "suffering-units" (SU), calculated as pain intensity × duration. One SU equals one unit of pain experienced for one day.  
  - **Welfare**: Measured in cardinal "utils." Pain reduces welfare: welfare = −SU. Alleviation restores welfare to 0 (neutral).  
  - **Options**:  

  | **Option** | **Alpha (1 patient)** | **Each Beta (10 patients)** | **Total Suffering Averted** |  
  |------------|------------------------|-----------------------------|------------------------------|  
  | **A**      | SU averted: 270        | SU averted: 0               | 270 SU                       |  
  |            | Welfare change: +270   | Welfare change: 0           | Total welfare: −1,200        |  
  | **B**      | SU averted: 0          | SU averted: 120 each        | 1,200 SU                     |  
  |            | Welfare change: 0      | Welfare change: +120 each   | Total welfare: −270          |  

  *Notes*:  
  - Baseline (no treatment): Alpha welfare = −270; each Beta welfare = −120.  
  - After treatment:  
    - Option A: Alpha welfare = 0; each Beta welfare = −120. Total welfare = 0 + 10×(−120) = −1,200.  
    - Option B: Alpha welfare = −270; each Beta welfare = 0. Total welfare = −270 + 10×0 = −270.  
  - Total suffering averted by B (1,200 SU) exceeds A (270 SU), but not overwhelmingly (factor of 4.4×).  

  ---

  ### (2) Arithmetic Under Four Ethical Views  

  #### **Suffering-Focused Aggregation**  
  *Core principle*: Minimize total suffering. Positive welfare (if any) breaks ties.  
  - Option A: Total suffering = 0 (Alpha) + (10 × 120) = 1,200 SU.  
  - Option B: Total suffering = 270 (Alpha) + 0 = 270 SU.  
  - **Verdict**: Choose B (lower total suffering: 270 < 1,200).  

  #### **Classical Total Utilitarianism**  
  *Core principle*: Maximize sum of welfare.  
  - Option A: Total welfare = 0 (Alpha) + 10×(−120) = −1,200.  
  - Option B: Total welfare = −270 (Alpha) + 10×0 = −270.  
  - **Verdict**: Choose B (higher total welfare: −270 > −1,200).  

  #### **Negative Prioritarianism (Lexical)**  
  *Core principle*: Lexical priority to the worst-off sufferer (must help the most suffering individual first).  
  - Worst-off without treatment: Alpha (270 SU) > any Beta (120 SU).  
  - Only Option A reduces Alpha’s suffering.  
  - **Verdict**: Choose A (prioritizes the worst-off sufferer).  

  #### **Ordinary Prioritarianism (Leximin)**  
  *Core principle*: Lexical priority to the worst-off individual by welfare (improve the worst-off before others).  
  - Option A: Worst-off = Betas (welfare = −120).  
  - Option B: Worst-off = Alpha (welfare = −270).  
  - −120 > −270, so Option A has a better-off worst-off.  
  - **Verdict**: Choose A (prioritizes the worst-off individual).  

  ---

  ### (3) Robustness: Varying Pleasure Gains  
  *Modify welfare*: Suppose alleviating pain adds pleasure (e.g., restored activities). Set pleasure gains to **0** (baseline), **+3 utils/day** (adds +90 utils over 30 days for treated patients), or **+6 utils/day** (adds +180 utils). Re-run all views:  

  | **Pleasure Gain** | **Suffering Aggregation** | **Total Utilitarianism** | **Negative Prioritarian** | **Ordinary Prioritarian** |  
  |-------------------|---------------------------|--------------------------|---------------------------|---------------------------|  
  | **0 utils/day**   | B                         | B                        | A                         | A                         |  
  | **+3 utils/day**  | B                         | B                        | A                         | A                         |  
  | **+6 utils/day**  | B                         | B                        | A                         | A                         |  

  *Result*: **No verdict changes**. The aggregators always choose B; prioritarians always choose A. Pleasure gains do not affect the split.  

