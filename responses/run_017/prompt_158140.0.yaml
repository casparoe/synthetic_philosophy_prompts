  ### (4) Ablation: Key Parameters  
  Vary one parameter while holding others fixed. Identify where verdicts converge:  

  | **Parameter Change**             | **Suffering Aggregation** | **Total Utilitarianism** | **Negative Prioritarian** | **Ordinary Prioritarian** | **Convergence?** |  
  |----------------------------------|---------------------------|--------------------------|---------------------------|---------------------------|------------------|  
  | **Baseline (α:9, β:4, n=10)**   | B                         | B                        | A                         | A                         | No               |  
  | α’s pain = 5 (SU=150)           | B                         | B                        | A                         | A                         | No               |  
  | n=1 (only Beta1)                | A                         | A                        | A                         | A                         | Yes (all A)      |  
  | n=3 (Betas: 3 patients)         | B                         | B                        | A                         | A                         | No               |  
  | Lexical → Convex Priority†      | B                         | B                        | B (if weak) / A (if strong) | N/A                       | Partial‡         |  

  *Notes*:  
  - † **Convex priority test for negative prioritarian**: Weight suffering reduction by current suffering (e.g., value = SU²). If weighting is weak (linear: *v=SU¹*), B wins (1,200 > 270). If weighting is strong (quadratic: *v=SU²*), A wins (270² = 72,900 > 10×120² = 144,000? No; 72,900 < 144,000). Only cubic or stronger (*v=SU³*) makes A win (270³ = 19,683,000 > 10×120³ = 17,280,000).  
  - ‡ **Pivotal parameter**: Group size (*n*). All views converge to A only if *n* is too small (e.g., *n=1*) for B’s total averted suffering to exceed A’s. Priority formulations (lexical vs. convex) can flip negative prioritarian if weighting is weak.  

