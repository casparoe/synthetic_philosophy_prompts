answer: |-
  Your analysis captures a profound conceptual maneuver that recurs in debates about value-laden experiences. The pattern you've identified is most precisely described as **Phenomenal Decoupling Advocacy**, though it engages with several established philosophical concepts. Let's carve it systematically.

  ### Core Move: Phenomenal Decoupling Advocacy
  **Definition:** The strategy of claiming that a phenomenally conscious state (e.g., suffering) can be eliminated while preserving its functional/causal role by substituting a new state that performs identical behavioral or cognitive functions *without the original phenomenal character*. 

  **Mechanics of the Move:**
  1. **Isolation of Function:** The advocate separates a state's *functional role* (e.g., pain causing hand-withdrawal) from its *phenomenal character* (e.g., the hurt of pain).
  2. **Dissociation Claim:** Asserts that empirical cases (e.g., pain asymbolia) prove functional role and phenomenal character are dissociable.
  3. **Substitution Proposal:** Argues we can engineer a state that fulfills the functional role while having a *neutral or positive* phenomenal character.
  4. **Semantic Preservation:** Redefines value-laden concepts (courage, grief) solely by their functional outputs, discarding phenomenal prerequisites.

  ---

  ### Boundary Cases & Validity Tests
  The move's legitimacy hinges on whether phenomenal character is *essential* to the function or concept in question. We distinguish:

  | **Genuine Dissociation** | **Sleight of Hand** |
  |--------------------------|---------------------|
  | **Empirical dissociation exists** (e.g., pain asymbolia shows registration without suffering) | **No empirical precedent** for *motivated action without aversion* (e.g., no cases where subjects consistently act urgently against threats but report neutral feelings) |
  | **Function is purely computational** (e.g., nociception triggering reflex arcs) | **Function inherently requires phenomenology** (e.g., grief motivating communal bonding relies on anguish) |
  | **Concept is defined behaviorally** (e.g., "withdrawal reflex") | **Concept is inherently phenomenal** (e.g., "dread" or "sacrifice") |

  **Your suspicion is correct:** The advocate conflates *dissociation in pathology* (loss of motivation + loss of suffering) with the needed *engineered inversion* (preserved motivation + eliminated suffering). Pain asymbolia proves separability only in the *undesirable direction* – it doesn't demonstrate that motivation can survive without negative affect.

  ---

  ### Why Existing Labels Don't Fit
  1. **Not the *Hard Problem*:** While related to the explanatory gap, this is a *practical* claim about intervention, not metaphysics.
  2. **Not *Functionalism*:** Functionalists argue phenomenal states *are* functional states; here, advocates claim they can be *replaced*.
  3. **Not *Quining Qualia*:** Dennett denies phenomenal character; advocates acknowledge it but deem it replaceable.
  4. **Not *Motivational Externalism*:** The debate isn't about moral motivation but biological causation.

  ---

  ### The Critical Countermove: Phenomenal Entanglement
  The critic's unstated premise is that for certain functions:
  > **Phenomenal character isn't merely *correlated* with function – it *constitutes* the function.**

  **Example:** Courage requires *overcoming dread*. A "challenge-response" without dread isn't courage but fearlessness – a different virtue. To preserve courage, you must preserve the *phenomenal obstacle* it overcomes. Similarly, grief without anguish may preserve social signaling but lose its depth as testimony of love.

  ---

  ### Proposed Name & Framework
  **Term:** **Phenomenal Decoupling Advocacy (PDA)**  
  **Definition:** *The claim that eliminable phenomenally negative states can be functionally replaced by neutral/positive states while preserving all valuable outcomes, achieved by redefining functions and concepts independent of their experiential character.*

  **Boundaries of PDA:**
  - **Applies:** When functions are *causal-mechanical* (e.g., withdrawal reflexes)  
  - **Fails:** When functions are *constituted by phenomenology* (e.g., virtues requiring conflict)  
  - **Empirical Constraint:** PDA requires evidence that dissociation works *bidirectionally* (not just in pathology)  
  - **Conceptual Constraint:** PDA fails if a concept's meaning includes its phenomenology (e.g., "suffering" itself)

  ---

  ### Key Literature
  1. **On Pain & Motivation:**  
     - Klein's work on [pain asymbolia](https://academic.oup.com/brain/article/135/2/631/334682) (shows dissociation ≠ invertibility)  
     - Grahek's *Feeling Pain and Being in Pain* (phenomenal vs. motivational components)  
  2. **On Value & Phenomenology:**  
     - Stocker's "Schizophrenia in Values" (emotions as essential to values)  
     - Ratcliffe's *Experiences of Depression* (how phenomenology shapes agency)  
  3. **Anti-PDA Arguments:**  
     - Kass's "Wisdom of Repugnance" (phenomenology as moral guide)  
     - Sebo on [digital minds](https://philpapers.org/archive/SEBMSR.pdf) (functions ≠ experiences)

  Your intuition exposes PDA's core weakness: It assumes all human values are *functional outputs* rather than *experiential processes*. The burden is on advocates to prove that a grief without anguish, or courage without dread, isn't a *categorical error* – that it retains what we mean by these terms. Until then, PDA remains philosophically suspect.
