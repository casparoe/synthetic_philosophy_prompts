  I recall philosophical concepts that might fit. The first is the "phenomenal fallacy," where subjective experience is reduced to functional role. Then there's "functional substitution," which is common in philosophy of mind. Also, "phenomenal concept strategy" where advocates might be conflating concepts. Another angle is "redefinition under preservation of function," which is more descriptive. 

  But which term fits best? The user’s examples show that the advocates are separating the functional role from the phenomenal quality. The key issue is whether the functional role can exist independently. Cases like pain asymbolia show dissociation is possible, but motivation might still rely on negative valence. For virtues, the advocate redefines them functionally, stripping away the necessary phenomenal aspect. 

  The deeper need here might be understanding the validity of such arguments in ethics and metaphysics. The user might be engaging with transhumanist or suffering-focused ethics literature, seeking to critique or support such proposals. They need a framework to evaluate when functional substitution is legitimate versus when it’s deceptive. 

  Boundary cases are important too. For instance, if a state has no functional role, substitution might be impossible. Or if the function inherently requires the phenomenal aspect, like in emotions. The user’s suspicion about courage without dread touches on this—courage might require overcoming fear, not just facing a challenge. 

  I should propose a new term if existing ones don’t fit. "Phenomenal decoupling advocacy" could work, emphasizing the separation of experience from function. Defining it clearly with criteria for genuine dissociation vs. sleight of hand. Genuine cases would have empirical evidence or conceptual necessity, while deceptive ones ignore essential phenomenal properties. 

