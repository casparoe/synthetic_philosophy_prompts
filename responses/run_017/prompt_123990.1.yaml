prompt: |-
  Hey — quick favour. I've got a fifty-minute section Thursday at 9am with first-years in Intro to Ethics, and the slot I've been given is moral particularism versus generalism. Don't write the lecture for me; I want a plan for it, and I want you to push back where you think I've got it wrong.

  Where they are: they've done act utilitarianism and a week of Kant, so they arrive pretty convinced that moral judgement just is applying a rule, while at the same time about half of them think *just be a good person, don't be a rule-follower* is a profundity. So I'm fighting on two fronts at once and I keep losing the second half of the room.

  The thing I actually want you to argue with me about: I'm tempted not to open with the standard move — that a consideration which is a reason in one case can be no reason at all, or a reason the other way, in another. Instead I want to start from the epistemology: the thought that learning to see a situation aright is closer to learning to read an x-ray or taste wine than to learning a formula, and only then ask whether what you've learned could in principle be written down as principles. Is that order backwards? What specifically breaks if the valence-flip material comes second rather than first?

  Then: one carrying example. It has to be a case where the same feature unambiguously flips, and where the flip is not just the feature getting outweighed by something weightier. Tell me what the example needs to have and what it needs to lack — my worry is that if I reach for anything involving lying, promises, or harm to persons, they'll just grab hold of deontology and stop listening to me.

  Misconceptions I'm expecting: particularism equals relativism or anything goes; particularism equals some spooky intuition-faculty; and the one I think will really bite — they'll treat *lying is pro tanto wrong* as already settling the question, because for them any true generalisation counts as a principle. Where in the sequence do I head each one off? And can you get them to see daylight between a mere default reason and a pro tanto principle? There's a generalist position where principles are only ever defaults — I think the label is defeasible generalism, tell me if I've got that wrong — and I don't want them concluding that this generalist has simply capitulated and renamed themselves.

  Last two things: what should I explicitly refuse to cover at this level and say out loud that I'm refusing? And give me one question to put on the board at the end that would show me they've got the disagreement itself in view, rather than just being unsettled.
reasoning: |-
  Okay, let me unpack this ethics lecture request. The professor is teaching Intro to Ethics, focusing on moral particularism vs. generalism to first-years who've only covered utilitarianism and Kant so far. They're wrestling with students who simultaneously believe morality is about rule-following while also thinking "just be a good person" is deep insight. 

  Hmm... the core tension I see is that students are stuck between two oversimplifications: rules as rigid formulas versus virtue as rule-free. The professor wants to challenge both by showing moral judgment as a perceptual skill. Their specific dilemma is whether to start with epistemology (moral perception) before valence-flipping examples, rather than the standard approach. 

  Let me think why the epistemology-first approach might work better here. If students enter thinking morality is either rule-application or amorphous "good person" vibes, starting with perception reframes the debate entirely. Comparing it to reading X-rays or tasting wine makes judgment concrete but non-algorithmic. The risk of valence-flips first is that students might dismiss them as exceptions that prove the rule ("oh, that's just when rules conflict"). But if they've already bought into the skill analogy, valence-flips become evidence for that model rather than puzzles for generalism. 

  For the example... it needs to be valence-flipping without involving promises/lying/harm because those trigger deontological reflexes. Also can't be about outweighing - must show the same feature genuinely changing moral direction. Something like physical restraint? Restraining a child from running into traffic vs. restraining someone from leaving an abusive situation. The "restraint" flips from protective to oppressive. No rules are broken, no harms in the usual sense - the context determines the valence. 

  Biggest misconceptions to preempt:
  - Particularism ≠ relativism: best addressed when introducing particularism by contrasting "context-sensitive" with "no standards." 
  - ≠ intuition magic: when discussing moral perception, emphasize it's trainable expertise, not gut feelings. 
  - That pro-tanto ≠ default: save for when analyzing generalism variants. Show how defeasible generalism still treats principles as rule-like (reasons add weight), while particularism says reasons aren't rule-governed at all. 

  What to explicitly skip: metaethics (realism/anti-realism), comparisons to virtue ethics, or Ross's prima facie duties. Say aloud: "We're focusing solely on whether moral reasons require principles." 

  Final question to test understanding: "Could two situations be identical in all non-moral features but require different moral responses? Why would each side say yes/no?" This forces them to engage the core disagreement about whether context is part of the reason. 

  The professor's instinct to start with epistemology feels right - it builds common ground before the divisive examples. My tweak would be to explicitly frame the wine-tasting analogy as "what if morality is like this?" before any "ism" labels, so students don't get tribal.
answer: |-
  Here’s a battle plan for your 50-minute lecture, structured to tackle student preconceptions while reordering the epistemology/valence-flip sequence. I’ll push back where needed and offer concrete tools:

  ### **Lecture Structure & Sequence (Epistemology-First Approach)**
  **1. Hook: The "Good Person" Paradox (5 mins)**  
  - Start with their contradiction: *If being good isn’t about rules, what is it?* Contrast the student who says "rules are everything" (Kant/Util) vs. "just be good" (naive virtue).  
  - **Pivot:** "Today we resolve this by asking: Is moral judgment like *calculating* or like *perceiving*?"  

  **2. Epistemology First: Morality as Perception (15 mins)**  
  - **Analogy:** Diagnosing an X-ray. Two radiologists see the same image; one spots a tumor, one misses it. Not rule-breaking—*trained perception*.  
  - **Key move:** Moral expertise = learning to "see" morally relevant features (e.g., spotting exploitation in a workplace interaction).  
  - **Why this first?** It sidesteps rule-fetishism by framing judgment as a skill. *Risk averted:* If valence-flips open, rule-loyalists dig into "exceptions." Perception-first makes valence-flips *evidence* for the model.  
  - **Pushback:** *But won’t they demand principles later?* Yes—use that tension. Say: "If judgment is perceptual, can what we ‘see’ *ever* be reduced to rules? Let’s test this."  

  **3. Valence-Flip Example: The Carrying Case (10 mins)**  
  - **What the example MUST have:**  
    - A non-moral feature that flips *without* outweighing (context changes its *meaning*).  
    - No ties to promises/lying/harm.  
  - **Example: "Carrying Someone"**  
    - **Case 1:** Carrying your laughing child on your shoulders through a crowd. (*Relevant feature: care*)  
    - **Case 2:** Carrying an unconscious stranger into your van. (*Same feature: care → now implies abduction?*)  
  - **Why it works:**  
    - Flips from positive to negative without new features "outweighing." The context (relationship, consent) reconfigures the reason.  
    - Avoids deontology/Util landmines. No "rules" broken in Case 2—just shifted moral valence.  

  **4. Particularism vs. Generalism Defined (5 mins)**  
  - **Particularism:** Moral reasons are context-dependent; no necessary *moral* principles (Dancy).  
  - **Generalism:** Moral judgment requires invariant principles (e.g., Kant’s CI).  
  - **Crucial distinction:** Defeasible generalism (e.g., Ross) *vs.* particularism. Ross: Principles are pro-tanto rules (add weights). Particularism: No rules—reasons can *change identity* in context.  

  **5. Smashing Misconceptions (10 mins)**  
  - **"Particularism = Relativism"**: Kill this when defining particularism. *"Relativism says no universal standards. Particularism says standards exist but aren’t rule-shaped."*  
  - **"Particularism = Intuition Magic"**: Tie to epistemology. *"Seeing an X-ray isn’t ‘intuition’—it’s trained perception. Same for noticing cruelty or betrayal."*  
  - **"Pro-tanto = Principle"**: Head off during generalism discussion. *"Is ‘lying is pro-tanto wrong’ a rule or a default observation? If it’s a rule, why can’t we codify *when* it flips? If a default, is it still a ‘principle’?"*  

  **6. Defeasible Generalism: Did They Capitulate? (3 mins)**  
  - **No.** Rossian generalists insist principles *structure* reasoning (reasons have stable valence but can be overridden). Particularists say valence is *contextual* (not overridden—*reconfigured*).  
  - **Test them:** *"In the carrying case, would a defeasible generalist say ‘care’ was overridden? Or did it become a different kind of reason?"*  

  **7. What We’re NOT Covering (Out Loud!) (2 mins)**  
  - Explicitly exclude: Moral realism/anti-realism, virtue ethics (though it lurks), or applied debates (e.g., abortion). Say: *"We’re only asking: Do moral reasons require invariant principles?"*  

  ---

  ### **End with This Question on the Board:**  
  **"Could two identical situations (same facts, same agents) demand different moral responses?  
  — Particularist: _____  
  — Generalist: _____"**  

  **Why it works:**  
  - Tests grasp of the core conflict. Generalists say no (principles bind identical cases). Particularists say yes (context isn’t just "facts"—it’s relational/historical).  
  - If they’re unsettled, they’ll reveal it here. If they get it, answers will show who sees the disagreement.  

  ### **Where I Pushed Back**  
  - **Epistemology-first is riskier but worth it.** Yes, valence-flips usually lead—but your students are rule-hypnotized. Perception breaks the trance. *What breaks if flipped?* Rule-lovers might dismiss flips as "exceptions," but if perception is established first, flips become *evidence* for the model.  
  - **Don’t avoid "pro-tanto."** Lean in: Show how students conflate *generalization* ("killing is usually wrong") with *principle* ("killing is pro-tanto wrong"). Rip off the band-aid.  
  - **Carrying example > lying/harm.** You’re right—deontology hijacks the room. Physical acts like carrying (or "touching," "entering a room") are underused and avoid moral buzzwords.  

  **Tactical note:** When half the room checks out at "just be good," the X-ray analogy forces them to articulate *what "seeing" morally involves*. That’s your foothold. Go get ’em.
