prompt: |-
  For the chapter of a guidebook I'm putting together for long-stay visitors — the bit where you tell newcomers which local conventions they actually have to follow and which they can ignore — I want the spec before the advice. So: write the desiderata an account of conventional obligation has to meet. What does a theory have to be able to do to be good enough to settle when an everyday convention (tipping, queueing, jaywalking, taking a number, standing on the right of the escalator) generates a real moral obligation, as opposed to mere etiquette, prudence, or a reason to avoid a dirty look? For each requirement give the case behind it, and say whether its non-negotiable or just the hobbyhorse of one camp.

  Cases I want the list to have room for, and please add the ones I've missed: the phantom queue (at the rural bus stop the regulars wait in the cafe across the street and board in order of arrival, so a newcomer sees an empty stop and no line); the tip screen on the tablet at a counter where staff already get a proper wage, and the menu that says service included; jaywalking at 4am with no traffic and no witnesses; the half-dead convention that roughly half the people still follow; the visitor who genuinely has no idea versus the expat on year nine who still doesn't like it; a locally entrenched convention that shifts costs onto the worst-off locals (tips that stand in for wages, a "fee" that moves your permit up the pile); and conventions where your compliance is invisible to everyone, so nothing you do updates anyone's expectations.

  Two things I'm convinced a theory must not collapse: whether you must follow the convention and whether you may enforce it on other people, and whether the convention binds and whether it's a good thing to have at all.

  Then: which pair of requirements do you think can't both be met? My guess is that "the obligation has to hold even when nobody is affected and nobody is watching" and "the obligation has to lapse when the convention is extractive" pull in opposite directions, but tell me if the real conflict is elsewhere. Which single requirement does the most work in ruling candidate theories out? A short scorecard for two or three of the standard stories is fine, but the list is what I need.
reasoning: |-
  Okay, let me tackle this query step by step. The user wants desiderata for a theory of conventional obligations that can distinguish real moral duties from mere etiquette or prudence. They've provided several key cases to cover and specific constraints. 

  First, I need to understand the core question: what makes a convention morally binding versus optional? The user mentions cases like phantom queues, tipping debates, and jaywalking at 4am - these all test different aspects of obligation. 

  The non-collapsible requirements stand out: must-follow vs may-enforce, and convention's existence vs its desirability. These seem foundational. I'll build the list around how theories handle these splits.

  For the desiderata list, I consider starting with coordination necessity (the elevator case) since it's the most basic justification. Then move to expectations and harm prevention (like the phantom queue example). Cases like extractive conventions (tip-subsidized wages) will demand a fairness criterion, while dead conventions need a viability test.

  The user's suspected tension between universal applicability (obligation without witnesses) and anti-extraction is valid. I think the deeper conflict is actually between universalism and the "no obligation to dead conventions" rule - if a duty exists abstractly but lapses when others defect, that's logically tricky. 

  For ruling-out power, the "no extraction" requirement seems strongest - it immediately disqualifies theories that blindly endorse any established norm. The "invisible compliance" case also sinks theories relying on social enforcement.

  When scoring standard theories, Rawlsian fairness handles extraction well but struggles with phantom queues. Consequentialism navigates dead conventions but justifies too much. Practice-based accounts handle local knowledge but risk parochialism.

  The user's unspoken need might be practical adjudication - they're writing a guidebook, so the theory must help travelers make quick judgments. That's why I'll emphasize the "reasonable challenge" criterion later in the list. Also, their focus on expats vs clueless newcomers suggests awareness levels matter, hence the knowledge-dependent desideratum.

  Finally, the "enforcement separate from obligation" point is crucial - many theories conflate them, but the bus stop case shows why they must stay distinct. I'll make that non-negotiable.
answer: |-
  Here’s a rigorous set of desiderata for a theory of conventional moral obligation, designed to handle your cases and avoid critical collapses. Requirements are ordered by foundational priority, with cases illustrating each and notes on negotiability.

  ### **Core Desiderata for a Theory of Conventional Obligation**
  1. **Distinguish Coordination Necessity from Habit**  
     *Requirement:* Explain why conventions solving coordination problems (e.g., escalator standing) bind, while arbitrary habits (e.g., regional greetings) do not.  
     *Case:* "Standing on the right" prevents escalator chaos; refusing to say "please" where expected merely confuses.  
     *Negotiability:* **Non-negotiable** – otherwise all conventions become equally weighty.  

  2. **Handle Reasonable Expectations & Reliance**  
     *Requirement:* Capture when others rely on your compliance to avoid harm or cost.  
     *Case:* **Phantom queue**: Newcomers who board out of turn disrupt the cafe-based system, wasting regulars’ time.  
     *Negotiability:* **Non-negotiable** – anchors obligation in social harm.  

  3. **Respect Local Epistemic Conditions**  
     *Requirement:* Acknowledge that obligation depends on reasonable knowledge of the convention.  
     *Case:* **Clueless visitor** vs. **year-nine expat** who "doesn’t like" tipping – the former has no obligation; the latter may.  
     *Negotiability:* **Non-negotiable** – fairness demands knowability.  

  4. **Reject Extractive/Exploitative Conventions**  
     *Requirement:* Deny obligation when conventions entrench unfairness or shift costs to the vulnerable.  
     *Case:* Tipping where wages are substandard, or "fee-jumping" for permits – complying perpetuates injustice.  
     *Negotiability:* **Semi-negotiable** – some camps (e.g., strict conventionalists) argue "tradition" binds regardless.  

  5. **Account for Convention Viability**  
     *Requirement:* Obligation lapses if a convention is dying or lacks critical adherence.  
     *Case:** **Half-dead convention** (e.g., 50% stand on escalators): No obligation exists as expectations are unstable.  
     *Negotiability:* **Moderate** – consequentialists insist on stability; deontologists may ignore it.  

  6. **Invisible Compliance Test**  
     *Requirement:* Explain why obligation persists (or not) when compliance is undetectable.  
     *Case:* **Jaywalking at 4am with no witnesses**: If obligation holds, it’s moral; if not, it’s merely prudential (avoiding tickets).  
     *Negotiability:* **Non-negotiable** – separates internal duty from external enforcement.  

  7. **Decouple Obligation from Enforceability**  
     *Requirement:* Show that *your duty to follow* ≠ *others’ right to enforce*.  
     *Case:* **Bus-stop queue**: Regulars may *expect* compliance but enforcing it on ignorant newcomers may be unjust.  
     *Negotiability:* **Non-negotiable** – critical for your "must follow vs. may enforce" constraint.  

  8. **Separate Convention-Bindingness from Moral Desirability**  
     *Requirement:* Explain why bad conventions (e.g., bribe-jumping) may still bind, or why good ones might not.  
     *Case:* "**Service included**" menu + tablet tip screen – is the *extra* tip obligatory? Desirability ≠ bindingness.  
     *Negotiability:* **Non-negotiable** – your core constraint.  

  9. **Permit Reasonable Challenge**  
     *Requirement:* Allow exceptions when conventions conflict with fundamental rights or urgent needs.  
     *Case:* Ignoring a queue during a medical emergency.  
     *Negotiability:* **Semi-negotiable** – rigorists (e.g., practice positivists) reject exceptions.  

  ---

  ### **The Unresolvable Tension**
  Your suspicion is correct but mislocated. The real conflict is between:  
  - **#6 (Invisible Compliance)** – Obligation must hold absent observers.  
  - **#5 (Convention Viability)** – Obligation lapses if the convention is dying.  

  **Why?**  
  If an obligation exists *only* when a convention is socially viable (#5), it collapses when no one is watching (violating #6). But if obligation persists independently (#6), dying conventions (#5) could bind arbitrarily. **This is the core paradox.**  

  *(Your extraction vs. invisibility tension is resolvable: extractive conventions lack moral force regardless of visibility.)*

  ---

  ### **Most Exclusionary Requirement**  
  **#4 (Anti-Extraction)** does the heaviest lifting. It immediately eliminates:  
  - Theories that sanctify tradition (e.g., Burkean conservatism).  
  - Crude consequentialism endorsing any efficiency-promoting convention.  
  - Practice-based accounts (e.g., Rawls' "practices") that ignore distributive effects.  

  ---

  ### **Scorecard for Standard Theories**  
  | **Theory**         | **Handles Well**       | **Fails**                  | **Fatal Flaw**                     |  
  |---------------------|------------------------|----------------------------|------------------------------------|  
  | **Consequentialism** | #1 (coordination)      | #4 (extraction), #6 (invisible duty) | Justifies harmful conventions if "efficient". |  
  | **Rawlsian Fairness**| #4 (extraction), #8 (binding≠good) | #2 (local knowledge), #5 (dying conventions) | Over-rationalizes; ignores real-world flux. |  
  | **Communitarian**    | #2 (reliance), #7 (enforceability) | #3 (epistemic access), #4 (extraction) | Risks parochialism; sanctifies local abuse. |  

  ---

  ### **Critical Missing Cases (Added)**  
  - **The Tourist Bubble**: Conventions enforced *only* on outsiders (e.g., "foreigner prices"). Tests #4 (extraction) and #7 (enforceability).  
  - **Schrödinger’s Convention**: Two groups follow incompatible conventions in the same space (e.g., escalator standing in a multinational airport). Tests #5 (viability) and #9 (reasonable challenge).  
  - **Benign Sabotage**: Deliberately breaking a harmful convention to dismantle it (e.g., refusing to bribe). Tests #4 and #8.  

  This framework ensures your guidebook avoids moralizing etiquette while flagging genuinely obligatory norms. The unresolved tension (#5 vs. #6) means context will *always* matter – but the other non-negotiables prevent relativism.
