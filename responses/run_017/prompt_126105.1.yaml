prompt: |-
  I need a proposal for a one-semester independent research paper (about 6,000 words, no empirical or archival component) on the relation between the lottery paradox and the preface paradox. Please begin your reply with the proposal's first line — no preamble, no commentary, no summary of what you're about to do. Have the proposal open with a single sentence stating the question and what the paper would establish if it succeeds. I will add citations myself, so refer to positions and arguments by description rather than by author, title, or year.

  My half-formed idea: the two paradoxes are normally presented as one puzzle — a set of propositions each of which one is justified in believing, and which cannot all be true — but they differ in how the individual beliefs are evidentially sourced, and that difference decides which dissolution is available. In the lottery, every "ticket n will lose" is supported by one and the same body of evidence about the design of the lottery, so the step to the contradiction reuses that evidence many times over. In the preface, each claim in the book has its own evidence, and the "there is an error somewhere" belief rests on separate, higher-order evidence about the author's own fallibility. So the hypothesis is that a principle which blocks closure only for conjunctions whose support is evidentially redundant dissolves the lottery while leaving the preface intact, and that the preface then requires either a further restriction covering evidence that concerns the reliability of the very processes that produced the other conjuncts, or else the abandonment of the demand that first-order and higher-order justification be jointly satisfiable.

  Please state the question so that it has a determinate answer, say why the standard families of response — rejecting the high-probability threshold, rejecting closure, or relaxing the consistency requirement on a belief set — leave it open, and set out the method. In particular, I want bridge cases doing the real work: a lottery in which each ticket's losing is independently certified by a separate witness, and a book whose every claim traces back to a single source. Use them to test whether the paradoxes track evidential structure or content. Give the possible conclusions and which considerations would decide between them, a month-by-month plan for the semester, and an honest account of what would count as the project failing — including the possibilities that my sourcing distinction cannot be made precise without circularity, that the bridge cases are not classifiable in the way I assume, and that the whole question quietly collapses back into the usual dispute about whether high probability suffices for justified belief.
