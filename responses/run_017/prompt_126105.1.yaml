answer: |-
  This paper establishes that the lottery and preface paradoxes are distinct in kind, hinging crucially on whether the justification for each conjunct derives from a shared evidential source or from independent sources, and that this structural difference determines which dissolution strategy—restricting closure for evidentially redundant conjunctions or rejecting the joint satisfiability of first-order and higher-order justification—successfully resolves each paradox without collapsing into the other. While both paradoxes present a conflict between plausible principles of rational belief—that high probability suffices for justification, that justification is closed under (known) logical consequence, and that a rational agent’s beliefs must be consistent—standard uniform solutions prove inadequate: rejecting high probability thresholds implausibly discards probabilistic justification wholesale; blanket closure rejection licenses irrational avoidance of obvious consequences; and tolerating inconsistency abandons a core norm of rationality. Crucially, these approaches overlook how evidential structure, not content alone, shapes the paradoxes: in the lottery, identical probabilistic evidence justifies each "ticket n loses" belief, making the step to the contradictory conjunction a case of unwarranted evidential reuse; in the preface, first-order evidence justifies each book claim, while separate higher-order evidence justifies the "error exists" belief, creating a tension between distinct evidential tiers. Bridge cases test this evidential-source hypothesis: a "multi-witness lottery" where independent witnesses each reliably testify to a unique ticket’s loss (mimicking the preface’s evidential independence) should, if the hypothesis holds, resist standard lottery dissolutions and behave like a preface; conversely, a "mono-source preface" where all book claims derive from a single fallible authority (mimicking the lottery’s shared evidence) should resist preface dissolutions and behave like a lottery. If these cases align with predictions—e.g., closure restriction dissolves the multi-witness lottery but not the mono-source preface, while rejecting joint satisfiability dissolves the mono-source preface but not the multi-witness lottery—the evidential-structural distinction is vindicated. If not, the paradoxes may reduce to a single problem about high probability thresholds. Possible conclusions are: (1) the sourcing distinction is robust and mandates distinct solutions; (2) the distinction collapses, implying a unified solution is needed; or (3) the bridge cases blur, suggesting evidential structure is irrelevant. Key deciding factors include: whether closure restriction intuitively fails in the multi-witness lottery; whether joint satisfiability rejection seems unavoidable in the mono-source preface; and whether "independence" can be defined non-circularly (e.g., via no-overlap in causal etiology or informational basis). The project fails if: the sourcing criterion cannot be formalized without presupposing which beliefs are justified (circularity); bridge cases resist clear classification (e.g., multi-witness lottery is still intuitively dissolved by closure restriction); or all distinctions reduce to debates about probability thresholds. Workplan: Month 1: Literature review on paradox dissolutions and evidential independence. Month 2: Analyze bridge cases; formalize "shared" vs. "independent" evidence. Month 3: Develop arguments for how each paradox’s dissolution applies (or not) to bridge cases. Month 4: Revise based on circularity/threshold-collapse objections; draft full paper.
