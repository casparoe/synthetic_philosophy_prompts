  We are drafting a joint statement from an adversarial collaboration between two philosophers, Camp R (realist) and Camp I (instrumentalist), on the nature of patterns and the stances (physical, design, intentional). The statement must include:

  1. A numbered section of claims both can sign.
  2. A disagreements table with specified columns.
  3. Cruxes they haven't thought of, especially about intentional stance success.
  4. A closing note on residual verbal disagreements and the most moving finding.

  The claims in the joint section must cover:
  - What each stance is.
  - The work of the no-traps condition.
  - What each of the four profiles (S1, S2, S3, S4) does and does not establish.

  We have four stipulated targets (S1-S4) with specific profiles.

  The disagreements table must have columns for:
  - The issue in neutral wording.
  - The formulation each side would sign.
  - Whether the disagreement is genuine or merely verbal.
  - The case, argument, or further finding both agree would bear on it.
  - Each side's prediction about that case (recorded in advance).
  - What each side would count as a reason to give up its own view.

  We must also add cruxes (critical points) they haven't considered, especially about whether intentional stance success requires the target to be an optimizer vs. merely interpretable.

  Finally, a short note on which residual disagreement is verbal and why, and which single finding would most move the debate.

  We must be careful to separate settled from contested matters and flag extrapolations beyond actual arguments.

  Let's outline the joint claims section first.

  **Joint Claims (Section 1):**

  Both camps agree on the following:

  1. **Definition of the Stances:**
     - The **physical stance** predicts behavior based on the physical constitution and the laws of nature.
     - The **design stance** predicts behavior based on the assumption that the system is designed to function optimally (or nearly so) in a certain way, and that it has a particular functional organization.
     - The **intentional stance** predicts behavior based on the assumption that the system is a rational agent that will act to further its goals in light of its beliefs.

  2. **The No-Traps and No-Miracles Conditions:**
     - The **no-traps condition** ensures that the environment is not rigged to make a stance fail in a way that is not representative of its predictive power. For example, the environment does not contain adversarial elements specifically designed to exploit the stance's assumptions.
     - The **no-miracles condition** ensures that the predictive success of a stance is not due to luck but reflects a genuine pattern in the system's behavior.

  3. **Common Scorecard Metrics:**
     For any target and any stance, we record:
     - (i) **Accuracy on held-out situations**: How well the stance predicts behavior in situations not used in building the model.
     - (ii) **Total description length**: The sum of the description length of the stance's attributions (e.g., beliefs and desires for intentional, design specifications for design) and the residual needed to recover the full behavioral record.
     - (iii) **Behavior under intervention**: How gracefully predictions degrade when components of the system are modified (e.g., does the stance still provide approximately correct predictions after a minor change?).

  4. **Interpretation of the Stipulated Profiles:**
     - **S1**: This profile shows that the intentional stance can be superior in both predictive accuracy and descriptive efficiency (including the cost of attribution) and that it can correctly predict the effects of interventions. This establishes that the intentional stance can be the best overall stance for some systems. However, it does not by itself settle whether the intentional attributions are literally true (Camp R) or merely useful fictions (Camp I).
     - **S2**: Here, the intentional stance is initially accurate but becomes less efficient when the cost of re-specifying desires for each new situation is included. This profile shows that the efficiency of the intentional stance can be compromised by the complexity of the attribution, and that the design stance may be more efficient in such cases. It does not, however, undermine the potential truth of intentional attributions (per Camp R) because truth is compatible with inefficiency; it only shows that the intentional stance may not always be the most efficient.
     - **S3**: The intentional stance is accurate and efficient in normal conditions but fails under interventions. This demonstrates that the intentional stance's predictive success may depend on the system's stability and that it may not be robust to changes. This profile supports Camp I's view that the intentional stance is a useful instrument but not necessarily capturing a deep reality, because a real pattern should be robust. Camp R, however, might argue that the system is not designed to handle such interventions and that the pattern is still real but context-dependent.
     - **S4**: Under different coding schemes, the relative efficiency of the stances can change. This profile shows that the notion of a pattern being "cheaper" is relative to a coding scheme. It challenges Camp R's claim that pattern-hood is non-relative because it depends on a non-gerrymandered coding scheme. However, Camp R can reply that the coding schemes must be non-gerrymandered and that C2 must be equally natural. This case does not settle whether there is an objective fact about which coding scheme is non-gerrymandered.

  Note: Both camps agree that these profiles are illustrative and that real-world cases might be more complex. They also agree that the no-traps condition is necessary to ensure that the tests are fair.

  **Disagreements Table:**

  We now create a table with the following columns:

  1. **Issue in neutral wording.**
  2. **Camp R formulation** (what Camp R would sign).
  3. **Camp I formulation** (what Camp I would sign).
  4. **Genuine or verbal?**
  5. **Case/argument/further finding that would bear on it.**
  6. **Camp R prediction.**
  7. **Camp I prediction.**
  8. **Reason for Camp R to give up.**
  9. **Reason for Camp I to give up.**

  We must cover the core disagreements:

  A. The nature of pattern-hood: Is it relative or objective?
  B. The truth of intentional attributions: Are beliefs and desires literally true or merely useful fictions?
  C. The robustness of patterns under interventions: Does robustness matter for reality?
  D. The role of coding schemes: Can we objectively pick non-gerrymandered ones?

  We also need to add a crux about whether intentional stance success requires optimization vs. mere interpretability.

  Let's structure the table:

  | Issue (neutral) | Camp R Formulation | Camp I Formulation | Genuine or Verbal? | Case/Argument | Camp R Prediction | Camp I Prediction | Reason for Camp R to Give Up | Reason for Camp I to Give Up |
  |-----------------|-------------------|-------------------|---------------------|--------------|-------------------|-------------------|-----------------------------|-----------------------------|
  | ...             | ...               | ...               | ...                 | ...          | ...               | ...               | ...                         | ...                         |

  **Cruxes Not Yet Thought Of:**

  We are asked to add cruxes, especially about whether intentional stance success requires the target to be an optimizer rather than merely interpretable by us. So we can propose:

  - **Crux 1**: Consider a system that is interpretable by us as having beliefs and desires, but it is not an optimizer (e.g., it uses a simple, non-optimal heuristic). The intentional stance might still yield accurate predictions. Would this success imply that the beliefs and desires are real? Or is optimization required?

  **Closing Note:**

  We will write a short note at the end about which disagreement is verbal and why, and which single finding would most move the debate.

  Now, we write the full document.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Patterns and Stances  
  **Parties:** Camp R (Realist about Patterns) and Camp I (Instrumentalist about Stances)  
  **Date:** October 26, 2023  

  #### 1. Jointly Signed Claims  
  Both parties affirm the following points, grounded in their shared framework and the stipulated cases. These claims reflect minimal common ground, consistent with established literature on stances (e.g., Dennett 1971, 1987) and computational complexity (e.g., Kolmogorov complexity, Solomonoff induction). Extrapolations based solely on the stipulated profiles (S1–S4) are explicitly flagged.  

  1.1 **Definitions of Stances**  
     - The **physical stance** predicts behavior by modeling a system’s physical structure and dynamics under natural laws.  
     - The **design stance** predicts behavior by assuming the system was designed for specific functions and operates near-optimally.  
     - The **intentional stance** predicts behavior by attributing beliefs and desires to the system and assuming it acts rationally to achieve its goals.  
     *Note:* This formulation is non-controversial and aligns with Dennett’s original descriptions.  

  1.2 **The No-Traps Condition**  
     - The "no-traps" condition ensures the environment does not adversarially exploit a stance’s core assumptions (e.g., no deceptive setups that sabotage intentional predictions by rewarding irrationality). It guarantees tests reflect a stance’s inherent capabilities, not artificial failures. Without it, predictive failures could misattribute a stance’s limitations to environmental malice rather than descriptive inadequacy.  

  1.3 **The No-Miracles Condition**  
     - The "no-miracles" condition stipulates that predictive success is not coincidental (e.g., accurate guesses without underlying regularity). This is uncontested, as both camps reject "lucky" predictions as evidentially irrelevant.  

  1.4 **Interpretation of Stipulated Profiles**  
     - **S1 Profile** (*Intentional dominance*): Establishes that the intentional stance *can* outperform others in accuracy, efficiency (including attribution cost), and intervention robustness. This demonstrates its viability as a predictive tool but does *not* resolve whether beliefs/desires are true (R) or merely useful (I). *Extrapolation:* S1 is hypothetical; no real-world system perfectly matches it.  
     - **S2 Profile** (*Intentional inefficiency*): Shows that high raw accuracy may mask inefficiency if belief/desire attributions require frequent re-specification. This challenges the intentional stance’s *practical* supremacy but does *not* disprove the potential truth of attributions (R) or invalidate instrumental utility (I).  
     - **S3 Profile** (*Intervention fragility*): Proves that intentional predictions can fail systematically under component modifications, even with no-traps. This suggests a lack of deep causal grounding. For R, it questions pattern robustness; for I, it highlights stance-specific fragility. *Extrapolation:* No known system exhibits S3’s exact profile.  
     - **S4 Profile** (*Coding-scheme relativity*): Confirms that pattern efficiency can reverse under different non-gerrymandered coding schemes. This undermines claims of absolute pattern-hood but leaves open whether objectivity can be salvaged (e.g., via a "most natural" coding scheme).  

  1.5 **General Principles**  
     - **Pattern-Hood**: A pattern is real (R) or useful (I) when a description of behavior is cheaper (shorter description length) than a bitmapped record under a non-gerrymandered coding scheme.  
     - **Metric Validity**: The scorecard (accuracy, description length, intervention robustness) is a neutral tool. Disagreements arise in interpretation, not measurement.  
     - **Stipulations vs. Reality**: S1–S4 are idealized; real systems may blend profiles. Conclusions here are provisional and model-dependent.  

  ---

  #### 2. Disagreements Table  
  The table below catalogs unresolved issues. "Genuine" disagreements are substantive; "verbal" ones stem from divergent definitions. Both parties pre-commit to predictions for specified cases.  

  | Issue (Neutral Wording) | Camp R Formulation (Signs) | Camp I Formulation (Signs) | Genuine or Verbal? | Case/Argument Bearing on Issue | Camp R Prediction | Camp I Prediction | Reason for Camp R to Give Up View | Reason for Camp I to Give Up View |  
  |-------------------------|----------------------------|----------------------------|---------------------|--------------------------------|-------------------|-------------------|-----------------------------------|-----------------------------------|  
  | **Nature of pattern-hood** | Patterns are objective: real iff efficient under *any* non-gerrymandered coding scheme. | Patterns are interest-relative: efficiency requires specifying a coding scheme and explanatory goals. | Genuine | Find a system where C1 (non-gerrymandered) favors stance X and C2 (equally non-gerrymandered) favors Y, with no objective grounds to prefer C1 or C2. | Such systems are rare; if found, objective criteria (e.g., universality) will resolve ambiguity. | Common; S4 already shows this (e.g., C1=intentional, C2=physical). | Widespread, irreconcilable coding reversals without objective arbiters. | Discovery of a universally privileged coding scheme (e.g., via physics). |  
  | **Truth of intentional attributions** | Beliefs/desires are true when intentional stance is efficient (per R’s pattern criterion). | Beliefs/desires are "as-if" useful fictions, even when efficient. | Genuine | S1 profile: If beliefs/desires are real, interventions should align with causal structure. S3 shows otherwise. | S3’s failures reflect noisy implementation, not false attributions (e.g., damaged hardware). | S3 proves attributions lack causal depth; they are tools, not truths. | Consistent S3-like cases where interventions *never* align with intentional predictions. | S1-like systems where interventions *always* align, suggesting causal grounding. |  
  | **Role of intervention robustness** | Real patterns require graceful degradation under interventions; else, the pattern is illusory. | Robustness is pragmatic (aids prediction) but not constitutive of reality; fragile patterns can be useful. | Verbal (mostly) | Apply scorecard to chaotic systems (e.g., weather) where all stances degrade poorly. | Physical patterns remain real despite fragility (e.g., quantum decoherence). | Fragility implies stance limitations, but doesn’t negate utility (e.g., economic models). | If *only* robust patterns are called "real," R redefines "reality" to exclude valid cases. | If robustness is irrelevant, I’s "usefulness" becomes untestable. |  
  | **Intentional success: Optimization required?** | Intentional stance works iff the system *is* an optimizer (e.g., maximizes utility). | Intentional stance works if the system is *interpretable* as rational, even if not optimizing. | Genuine (new crux) | Test a system using non-optimal heuristics (e.g., satisficing agents) interpretable via intentional stance but violating rationality. | Accuracy/efficiency will decline if heuristics are highly irrational (e.g., self-sabotaging). | Interpretability suffices; heuristics can sustain efficiency (e.g., bounded rationality). | Systems with high intentional efficiency despite extreme irrationality (e.g., random choices). | Proof that optimization is necessary for efficiency (e.g., in complex environments). |  

  ---

  #### 3. Additional Cruxes  
  The parties identify unresolved questions, particularly regarding the intentional stance:  

  - **Crux 1: Optimization vs. Interpretability**  
    Can systems that are *interpretable* but *non-optimizing* (e.g., an AI with hardcoded, suboptimal responses) sustain intentional-stance efficiency? R predicts no: non-optimizers will exhibit inefficiency (e.g., bloated desire attributions). I predicts yes: interpretability drives efficiency, even with "as-if" rationality. A real-world test: agents using simple heuristics (e.g., *Tit-for-Tat* in game theory) versus optimal strategies.  

  - **Crux 2: Causal Grounding of Intentionality**  
    Does intentional efficiency require causal structure (e.g., neural correlates) or only behavioral regularities? R posits that S1/S2 profiles imply causal structure; I argues S3 disproves this. A bearing case: neuro-impaired humans (e.g., frontal-lobe damage) whose behavior remains interpretable but not rational.  

  *Note:* These cruxes extrapolate beyond current literature; no consensus exists.  

  ---

  #### 4. Closing Note on Residual Disagreements  
  - **Verbal Disagreement:** The role of **intervention robustness** is primarily verbal. Camp R ties "pattern reality" to robustness, while Camp I decouples it for pragmatic reasons. This reduces to R defining "real" as "causally deep" and I defining it as "explanatorily efficient." Clarifying terminology would resolve this.  
  - **Most Consequential Finding:** A real-world **S1 system with non-human optimizers** (e.g., an alien intelligence or evolved AI) would most advance the debate. For R, its efficiency and robustness would confirm pattern realism; for I, it would test if "as-if" attributions scale universally. Conversely, **S3 in humans** (e.g., rationality failures under neural intervention) would challenge R’s truth claims.  

  **Signed,**  
  Camp R (Realist)  
  Camp I (Instrumentalist)  

  ---  
  **Footnotes:**  
  - **Settled in Literature:** Stance definitions (Dennett), no-miracles condition (Boyd), and description length as a complexity metric (Kolmogorov, Chaitin) are uncontested.  
  - **Contested/Extrapolated:** Interpretation of S1–S4, the objectivity of coding schemes, and the optimization/interpretability crux are novel to this collaboration and untested.  
  - **Disclaimer:** This document reflects the parties’ current views. Predictions are falsifiable, and both camps reserve the right to revise positions based on new evidence.
