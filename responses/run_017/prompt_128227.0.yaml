  ### Peer Disagreement and Higher-Order Evidence Quiz  
  This quiz uses concrete forecasting scenarios to reveal your implicit stance on peer disagreement and higher-order evidence. Answer based on your intuitive reactions, not theoretical labels. Each question has three options.  

  ---

  **Question 1 (Peer Disagreement)**  
  You and a fellow forecaster—equally skilled, with the same evidence—assign different probabilities to a tech startup’s success: you say 70%, they say 30%. After discussing, neither finds errors in the other’s reasoning. What do you do?  
  - **A:** Split the difference (revise to 50%).  
  - **B:** Stick with your 70%.  
  - **C:** Revise partway toward theirs (e.g., to 60%).  

  **Question 2 (Sleep Deprivation)**  
  You assigned 80% to an election outcome after a sleepless night. The next day, rested, you recall a study showing sleep deprivation impairs reasoning like alcohol. You can’t recheck the evidence now. What do you do?  
  - **A:** Lower your confidence (e.g., to 60–70%).  
  - **B:** Stick with 80% until you re-examine evidence.  
  - **C:** Set it to 50% (neutral until rechecked).  

  **Question 3 (Akrasia Scenario)**  
  After peer disagreement (as in Q1), you still feel the evidence supports 70%, but you believe peers require you to be less confident. What’s your state?  
  - **A:** You revise to 50% and feel that’s correct (no conflict).  
  - **B:** You keep believing 70% but think you *should* believe 50% (split mind).  
  - **C:** You stick with 70% and feel that’s rational (no issue).  

  **Question 4 (Uniqueness vs. Permissivism)**  
  Your evidence suggests a 60% chance of an AI milestone by 2030. Could equally rational forecasters, with identical evidence, defensibly assign 70%?  
  - **A:** No—only one rational probability exists.  
  - **B:** Yes—evidence allows a range (e.g., 60–70%).  
  - **C:** Yes—different people can rationally disagree.  

  **Question 5 (Anticipated Disagreement)**  
  You know your peer assigns 30% to an event before you review evidence. After reviewing, you assign 70%. How does knowing their view in advance affect you?  
  - **A:** Revise down now (e.g., to 50–60%).  
  - **B:** Stick with 70% (your evaluation stands).  
  - **C:** Don’t revise, but you’d have been less confident initially.  

  **Question 6 (Superior Model)**  
  You assign 75% to a tech event. A highly accurate model—trained on more data and beating you on Brier score—assigns 25%. What do you do?  
  - **A:** Revise toward the model (e.g., to 50%).  
  - **B:** Stick with 75% (you have reasons).  
  - **C:** Defer fully to the model (adopt 25%).  

  **Question 7 (Future Self)**  
  You assign 60% to a political event. You learn your future self, after seeing one new study you haven’t, revises to 40%. What do you do now?  
  - **A:** Revise toward 40% (e.g., to 50%).  
  - **B:** Stick with 60% until you see the study.  
  - **C:** Adopt 40% immediately.  

  **Question 8 (Multiple Peers)**  
  You assign 80% to an event. Three peers—equally skilled, independent—each assign 20%. What do you do?  
  - **A:** Revise to the group average (35%).  
  - **B:** Revise to the midpoint between you and them (50%).  
  - **C:** Revise partway (e.g., to 60%).  

  ---

  ### Scoring Key: Mapping Answers to Positions  
  Your answer pattern (A/B/C for Q1–Q8) maps to positions in the logical space of higher-order evidence views. Positions are defined by combinations of answers, not labels. Below:  
  - **Position** = Core stance.  
  - **Answers** = Expected pattern (bold = defining responses).  
  - **Note**: Incoherent combos (✗) violate rationality; unattractive (∼) are possible but implausible; empty (∅) lack known adherents.  

