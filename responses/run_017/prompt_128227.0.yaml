  |-----------------------|--------------------------------------|-------|  
  | **Strong Conciliationism** | **Q1:A**, **Q2:A/C**, **Q3:A**, **Q4:A**, **Q5:A**, **Q6:A/C**, **Q7:A**, **Q8:A** | Treats peer/non-peer cases similarly; no akrasia; evidence fixes one rational credence. |  
  | **Steadfast Uniqueness**  | **Q1:B**, **Q2:A**, **Q3:C**, **Q4:A**, **Q5:B**, **Q6:A**, **Q7:B**, **Q8:C** | Adjusts for impairment/models (defects/superiors), not peers; no akrasia; uniqueness holds. |  
  | **Permissivist Steadfast**| **Q1:B/C**, **Q2:A**, **Q3:C**, **Q4:B/C**, **Q5:B**, **Q6:A**, **Q7:B**, **Q8:B/C** | Permissivism allows rational disagreement; adjusts only for defects/superiors (not peers). |  
  | **Level-Splitting View**  | **Q1:B**, **Q2:A**, **Q3:B**, **Q4:A**, **Q5:B**, **Q6:B**, **Q7:B**, **Q8:B** | Akrasia in peer cases: you *should* conciliate but can’t; uniqueness; minimal revision elsewhere. |  
  | **Moderate Conciliationism** | **Q1:C**, **Q2:A**, **Q3:A/B**, **Q4:A/B**, **Q5:A**, **Q6:A**, **Q7:A**, **Q8:C** | Splits partially; adjusts for all higher-order evidence; akrasia optional. |  

