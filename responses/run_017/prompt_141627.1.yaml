prompt: |-
  Novelist here, and ive written myself into a hole I dont really have the vocabulary for.

  My current book is set in an invented federation — bits of the US, Germany, Switzerland and the EU glued together and renamed — and the climax is a constitutional standoff. A regional premier refuses to authorise a high-voltage transmission line that would carry renewable power out of her region into three others, and she defends herself with the subsidiarity line: the EU treaties say (I think its Article 10 of the Treaty on European Union) that decisions shall be taken as openly and as closely as possible to the citizen, so her region decides. Her opponents point out that the whole purpose of the line is that its benefits and costs spill across borders, that her region happens to be the only place that can physically block it, and that "the people affected" include several million people who will never vote in her region. Everyone in the room is using the same sentence and meaning something different, and I cant tell whether any of them is saying something true. Ive met the same sentence from a Swiss cousin defending cantonal school curricula, from American governors during covid, and from an MEP on the radio who used it to argue both for and against a farm subsidy in the same interview.

  So what I want is a menu, not an essay. As far as I can tell the sentence has three moving parts — how you measure closeness, who counts as the people affected, and whether "level" means only the levels that already exist or any jurisdiction you could draw — and different precisifications give very different claims. Please lay out the distinct precise things someone could be asserting with it, from the near-tautological to the wild, and for each: whether its a platitude anyone would accept, a substantive but contestable claim, or something probably false or incoherent; whether it actually hands my premier the veto she wants or quietly hands the argument to the federation; and what would have to be true in my fictional federation for that reading to get off the ground.

  The wrinkle that might actually be new: in my invented federation the lower units have something no real one does. Alongside the ordinary territorial rule, any resident can register under another region's legal code for a specific field — family law, education, environmental standards — and that region's rules then follow the person rather than the place theyre standing in. A third of the population has done this. I invented it for plot reasons and only later realised it might gut the slogan, or rescue it, depending on what the slogan means: if "close to the citizen" is about metres and self-rule over a shared place, portable registration looks like it destroys the thing; if its about fit between a person's values and the rules that bind them, portable registration looks like the slogan taken seriously for the first time. I genuinely dont know which.

  Give me the menu as a table with these columns:

  - reading — a short name for the reading
  - precise_claim — the claim spelled out tightly enough that a constitutional court could apply it, including what it says about each of the three moving parts above
  - verdict — one of: tautology / platitude / substantive-but-contested / false-or-incoherent
  - grid_veto — yes / no / only-if, plus the extra premise my premier would need for it to deliver her conclusion
  - portable_jurisdiction — serves-it / defeats-it / orthogonal, with one clause saying why
  - stage_direction — the single line of dialogue, detail or tell in the scene that would tip an attentive reader that this is the reading the premier means

  Under the table, add two or three sentences on which reading I should put in her mouth if I want her to be neither a fool nor obviously right.
reasoning: |-
  Hmm, the user is a novelist who's written themselves into a constitutional standoff in their fictional federation. They need help unpacking the phrase "decisions shall be taken as openly and as closely as possible to the citizen" which is causing conflict in their story. The regional premier is using it to block a power transmission line, claiming subsidiarity gives her region veto power, while opponents argue it affects multiple regions.

  The user wants a structured "menu" rather than an essay - specifically a table analyzing different interpretations of this principle. They've identified three key variables: how to measure "closeness," who counts as "people affected," and what "level" means jurisdictionally. There's also their unique twist - portable jurisdiction where citizens can choose which region's laws apply to them in specific domains.

  I'll break this down into distinct interpretations. For each, I need to specify: a short name, precise claim addressing all three variables, whether it's tautological/contested/etc., whether it gives the premier veto power, how portable jurisdiction affects it, and a subtle dialogue cue. Then I'll suggest which interpretation makes the premier seem reasonable but not obviously correct.

  Key interpretations to cover:
  - Geographic proximity (literal distance)
  - Affected interests (all impacted parties)
  - Pre-existing jurisdiction (current governance levels)
  - Value alignment (matching rules to preferences)
  - Democratic agency (voter control)
  - Functional efficiency (practical governance)

  The portable jurisdiction system complicates this beautifully - it could either undermine geographic subsidiarity or perfect value-aligned subsidiarity. For the premier to seem competent but debatable, I'll recommend the "Affected Interests" or "Value Alignment" readings - they're substantive but hinge on contestable definitions she could plausibly argue.

  I'll structure this as requested: table first with all columns, then brief commentary on the optimal character presentation. The table should show how the same phrase becomes different arguments when you tweak its definitions - exactly the political ambiguity the scene needs.
answer: |-
  Here's the conceptual menu for your constitutional standoff, formatted as requested. The interpretations range from foundational principle to radical reinterpretation, accounting for your unique "portable jurisdiction" element:

  | reading             | precise_claim                                                                                                                                | verdict                   | grid_veto                  | portable_jurisdiction                      | stage_direction                                  |
  | :------------------ | :------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------ | :------------------------- | :----------------------------------------- | :----------------------------------------------- |
  | **Geographic Proximity** | Decisions must be made by the smallest *territorial* unit containing the physical assets/impacts, with "closeness" measured in km. "Affected people" = residents within that territory. "Level" = existing sub-units. | substantive-but-contested | **yes** (if assets are in her region) | **defeats-it** (severs rules from territory) | Premier gestures at a map of her region's borders |
  | **Affected Interests** | Decisions must be made by the most local level *whose jurisdiction encompasses all parties bearing significant costs/benefits*. "Affected people" = all experiencing material impact. "Level" = existing or ad-hoc. | substantive-but-contested | **only-if** (impacts are purely local) | **serves-it** (shows cross-border linkages) | Opponent lists specific towns in *other* regions suffering blackouts |
  | **Pre-Existing Jurisdiction** | Decisions stay at the level historically responsible for that policy domain (e.g., energy siting). "Closeness" = institutional competence. "Affected people" = residents under that level's authority. "Level" = existing only. | platitude                 | **no** (if siting is federal competence) | **orthogonal** (irrelevant to competence) | Premier cites the federation's Energy Act assigning siting to regions |
  | **Value Alignment** | Decisions made at the level best reflecting the *preferences* of those bound by the rules. "Closeness" = cultural/political congruence. "Affected people" = those subject to the decision. "Level" = existing or functional. | substantive-but-contested | **only-if** (her voters uniquely bear cultural costs) | **SERVES-IT** (embodies preference-matching) | Premier says "Our values reject industrializing these valleys" |
  | **Democratic Agency** | Decisions made where citizens have the most direct electoral control/recall over the deciders. "Closeness" = accountability loops. "Affected people" = current voters in the jurisdiction. "Level" = existing sub-units. | platitude                 | **yes** (but ignores externality) | **defeats-it** (dilutes local voter cohesion) | Premier asks "Shouldn't *our* voters decide *our* landscape?" |
  | **Functional Efficiency** | Decisions made at the lowest level *capable of effectively solving the problem*. "Closeness" = administrative capacity. "Affected people" = those the problem affects. "Level" = any capable unit. | substantive-but-contested | **only-if** (region alone can solve it) | **orthogonal** (focuses on capacity, not identity) | Opponent asks "Can Region X build a line powering 4 regions alone?" |
  | **Radical Personalization** | "Level" dissolves; decisions bind only those who *consent* to that specific rule-set. "Closeness" = zero (individual). "Affected people" = self-selecting opt-ins. | false-or-incoherent       | **no** (makes collective action impossible) | **SERVES-IT** (takes portable logic to extreme) | Premier murmurs "Why should *any* jurisdiction bind the unwilling?" |

  **Which reading for the Premier?**  
  For her to be **neither a fool nor obviously right**, use **"Affected Interests"** or **"Value Alignment"**. Both are substantive, contested interpretations that *could* support her veto under specific, plausible conditions in your federation, but hinge on definitions opponents can credibly challenge. **Affected Interests** makes her seem principled but possibly myopic about spillovers. **Value Alignment** leverages your unique portable jurisdiction brilliantly, framing her veto as protecting regional identity against homogenizing infrastructure – resonant but vulnerable to counter-arguments about shared necessities. Her dialogue should subtly emphasize *whose* costs matter most (Affected Interests) or the *cultural integrity* of her region (Value Alignment).
