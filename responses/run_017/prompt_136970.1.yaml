  | "capitalists pay workers less than their labour is actually worth, and the difference — surplus value, roughly the gap between the price a commodity fetches and the wages of the people who made it — is what the owner pockets." | misleading | Marx argues workers sell their *labor power* (capacity to work), not labor itself. They're paid its value (subsistence costs), but labor power creates more value than it costs. Surplus value comes from this gap, not market-price discrepancies. | Instead of "paid less than labor is worth," say: "They pay us for our time, but pocket the extra value our work creates." |
  | "Machinery is how that squeeze gets worse, because a machine lets one man do the work of ten, so the other nine are thrown out onto the street, and that permanent pool of the jobless is what Marx called the reserve army of labour: it holds everyone's wages down, and it exists because of the machines themselves." | half-right | Machinery intensifies exploitation by displacing workers (creating a reserve army) and pressuring wages. But the reserve army stems from capitalism's cyclical crises and technological shifts—not solely machines—and includes temporary/seasonal workers. | Machines do throw people out of work and keep wages low, but the reserve army isn't just machines—it's the system's hunger for cheap, scared labor. |
  | "He also thought machinery was a weapon in the class struggle, used deliberately to break the resistance of skilled workers by making them replaceable." | accurate | In *Capital*, Marx states machinery lets capitalists deskill labor, weaken worker bargaining power, and crush strikes. This is explicit class strategy: "the most powerful weapon for suppressing strikes." | This is dead-on: bosses use machines to break our unions and make us disposable. |
  | "there he argues that as knowledge and science become the real productive force of society — his phrase is the general intellect — labour time stops being the source of wealth, so the more efficient production becomes, the less profit there is to make, and capitalism destroys itself by its own success" | half-right | In the *Grundrisse*, Marx's "general intellect" suggests automation could make labor time obsolete as wealth's source, but falling profits stem from rising capital investment (not efficiency alone). Capitalism's self-destruction isn't automatic—it requires revolutionary action. | Machines *could* free us, but profits drop only when bosses over-invest in them—and the system won't die without a fight. |

