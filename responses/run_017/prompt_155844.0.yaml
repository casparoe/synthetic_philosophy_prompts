  # Joint Statement on Coherence and Expected Utility

  ## 1. Agreed Claims

  1. If an agent has preferences that are complete, transitive, continuous, and satisfy independence and reduction of compound lotteries over a prospect space closed under mixing and compounding, then rationality requires maximizing expected utility relative to those preferences.

  2. An agent with cyclic strict preferences (A preferred to B, B to C, and C to A) and who is willing to trade at each step for a sufficiently small positive inducement can be subjected to a finite sequence of trades that leaves her with a net loss, provided that the trades are sequential and there are no transaction costs or commitment mechanisms in place.

  3. An agent with non-probabilistic credences (e.g., violating additivity) over a full set of mutually exclusive and exhaustive events will be accuracy-dominated by some probabilistic set of credences when evaluated by a strictly proper scoring rule that scores every event in the partition.

  ## 2. Disagreements

  | ID | kind          | Coherence Theorist formulation | Permissivist formulation | crux_ids        | stakes |
  |----|---------------|--------------------------------|--------------------------|-----------------|--------|
  | D1 | substantive   | Rationality requires that an agent has a complete preference ordering over all prospects in a space closed under mixing and compounding, including compound gambles. | Rationality does not require having preferences over every prospect; an agent may rationally have undefined attitudes toward complex or hypothetical prospects, and this silence is not a flaw. | ['no_attitude'] | CT: rules out that an agent can be rational without a full set of preferences. P: rules out that rationality requires preferences over all compound gambles. |
  | D2 | substantive   | If an agent can be exploited in a diachronic scenario (e.g., money pump) or is accuracy-dominated in a scoring rule scenario, this entails that the agent is irrational. | Exploitability or accuracy-dominance only shows that the agent's attitudes are costly or awkward in specific contexts, not that they are irrational per se. | ['bounded_pump', 'scoring_rule'] | CT: rules out that one can be rational while being vulnerable to exploitation or dominance. P: rules out that such penalties necessarily imply irrationality. |
  | D3 | substantive   | Even when a money pump has transaction costs that bound the exploiter's profit and the agent's loss, the agent's willingness to engage in each trade in the sequence is a form of dynamic inconsistency that constitutes irrationality. | If a money pump is bounded and unprofitable for the exploiter due to transaction costs, and the agent can avoid the loss by a commitment strategy (e.g., refusing all trades after the first), then the exploitability does not reveal irrationality. | ['bounded_pump'] | CT: rules out that bounded losses make the dynamic inconsistency rational. P: rules out that bounded exploitability without net loss (or with avoidable loss) constitutes irrationality. |
  | D4 | methodological | The possibility of exploitation or accuracy-dominance in principle (even in hypothetical or idealized scenarios) is sufficient to establish irrationality. | Only actual penalties in the agent's real decision context are relevant to rationality; hypothetical scenarios that the agent can avoid are irrelevant. | ['bounded_pump', 'scoring_rule'] | CT: rules out that rationality is contingent on the agent's specific environment. P: rules out that idealized scenarios are relevant to bounded agents. |
  | D5 | substantive   | Accuracy for credences must be measured by a strictly proper scoring rule applied to the entire set of events, and any deviation from probabilistic coherence is accuracy-dominated under this measure, which reveals irrationality. | The appropriate measure of accuracy for credences is context-dependent and should focus on the events relevant to the agent's actual decisions; under such a measure, non-probabilistic credences may not be dominated. | ['scoring_rule'] | CT: rules out context-dependent accuracy measures. P: rules out universal application of strictly proper scoring rules. |

  ## 3. Cruxes

  ### Crux: no_attitude
  - **Question**: Is an agent with sharp preferences over simple lotteries but no attitude toward a two-stage gamble (silence, not indifference) incoherent or merely incomplete?
  - **Bearing test**: Force the agent to choose between the two-stage gamble and a set of simple lotteries in multiple instances. Then, check if the agent's choices reveal a violation of the reduction principle and whether this leads to exploitation (e.g., via a Dutch book).
  - **CT prediction**: The agent's choices will either (a) consistently follow the reduction principle, revealing an implicit attitude, or (b) violate reduction and lead to a Dutch book, revealing incoherence. In both cases, the initial silence was rationally defective.
  - **P prediction**: The forced choices may not reveal a pre-existing attitude and might be constructed on the spot. If the agent avoids exploitation (e.g., by not creating a cycle or by the environment not offering exploitative opportunities), then the silence is harmless and not irrational.
  - **Would move CT**: If the agent's forced choices never lead to a violation of the axioms and she never suffers any penalty, and if the agent can function optimally without ever having an attitude toward compound gambles, then CT might concede that closure is not required for bounded agents.
  - **Would move P**: If the agent's forced choices consistently violate reduction and she incurs a sure loss as a result, and if she could have avoided the loss only by having the reduction attitude, then P might concede that having the attitude is rationally required in that environment.

  ### Crux: bounded_pump
  - **Question**: Does a finite money pump with per-step gain smaller than transaction cost (thus bounded and unprofitable to the exploiter) still ground a verdict of irrationality, and does a commitment strategy answer the argument?
  - **Bearing test**: Simulate an agent with cyclic preferences (A>B, B>C, C>A) in a sequential trade setting with transaction costs that make each trade unprofitable for the exploiter. Test two conditions: (i) the agent sees trades one at a time; (ii) the agent sees the entire pump in advance and can precommit to not trading.
  - **CT prediction**: In condition (i), the agent will complete the cycle and suffer a net loss, revealing irrationality. In condition (ii), the need for precommitment shows that the underlying preferences are irrational. The bounded loss does not mitigate the irrationality.
  - **P prediction**: In condition (i), the agent may suffer a loss, but this is a practical penalty, not necessarily irrationality. In condition (ii), the agent can avoid the loss by precommitment, showing that the preferences are rational when combined with appropriate commitment strategies.
  - **Would move CT**: If the agent with cyclic preferences never faces a money pump in her actual environment, or if the loss is negligible and the preferences have compensating benefits, then CT might concede that for bounded agents, cyclic preferences are practically rational.
  - **Would move P**: If the agent, even with the opportunity to precommit, still engages in the pump and suffers a loss, or if no commitment strategy is available and the agent suffers significant losses, then P might concede that the preferences are irrational in that context.

  ### Crux: scoring_rule
  - **Question**: Can a dominance argument with a stakes-weighted measure of accuracy (focusing only on decision-relevant events) vindicate expected utility maximization or only something weaker?
  - **Bearing test**: Apply a stakes-weighted scoring rule to the agent's credences, where the score is based on the accuracy of credences for events that are decision-relevant (weighted by the stakes in the decisions). Then, check if the non-probabilistic credences are dominated by some alternative (not necessarily probabilistic) credences.
  - **CT prediction**: The non-probabilistic credences will be dominated by a probabilistic set under the stakes-weighted measure, because EU maximization with probabilistic credences avoids dominance in decisions.
  - **P prediction**: The non-probabilistic credences may not be dominated, especially if the decision problems do not require additivity over fine-grained partitions.
  - **Would move CT**: If a non-probabilistic credence function is not dominated by any probabilistic one under the stakes-weighted measure in the agent's actual decision problems, then CT might concede that for bounded agents with limited decision contexts, non-probabilistic credences are not accuracy-dominated.
  - **Would move P**: If the non-probabilistic credences are dominated by a probabilistic set under the stakes-weighted measure, then P might concede that in that context, the agent should adopt probabilistic credences to avoid accuracy penalties.

  ## Verbal Component

  Both sides agree that part of the dispute might be verbal, hinging on the definition of 'rational'. The Coherence Theorist ties 'rational' tightly to coherence conditions, so that any violation counts as irrational by definition. The Permissivist uses 'rational' more broadly, allowing that an agent can be rational even if she violates coherence in idealized settings, as long as she avoids actual penalties in her environment. If the Coherence Theorist adopted the Permissivist's usage, they would concede that an agent can be 'rational' in the permissive sense while being exploitable in principle, but would maintain that such an agent is defective in a way that matters for ideal rationality. Conversely, if the Permissivist adopted the Coherence Theorist's usage, they would concede that the agent is not rational in the coherence sense but would maintain that the coherence sense is too demanding for bounded agents. For the builder of an artificial agent, the verbal dispute is less important than the practical implications: the agent should be designed to avoid actual penalties in its operating environment, which might not require full coherence.

  ## Bounded Agent Bottom Line

  The builder of a computationally bounded agent should note that while expected utility maximization is conditionally valid given full coherent preferences, it is not necessarily required for bounded agents; the agent can be designed with incomplete preferences, non-probabilistic credences, or cyclic preferences as long as it avoids actual penalties (like money pumps or accuracy losses) in its specific environment, possibly by using commitment strategies or context-dependent accuracy measures.

