prompt: |-
  I write on science and ideas for a broadsheet, and over the past two years I have found myself defending — in print, and more often at dinner — a fairly strong claim: that collective decisions about policy should be settled by conditional prediction markets rather than by voting on policies directly. The version I defend is not quite the canonical one. With an economist friend I have been working up a variant in which the legislature pre-registers both a welfare index and a fixed horizon before any market opens; traders stake on the value of that index conditional on a given policy being adopted; and settlement is handled not by the realised figure alone but by what we have started calling a 'counterfactual audit' — five years on, a randomly selected citizens' assembly estimates what the index would have been under the runner-up policy, and payouts are computed on the realised-versus-counterfactual gap. The attraction, as I argued in a column last spring, is that it removes the need for the counterfactual branch that a conditional market in its purest form seems to demand, while leaving an assembly with no forecasting burden free to speak to the one thing it can speak to. My friend thinks this is precisely where it breaks: once payouts turn on a panel's retrospective judgement rather than on a published number, traders are no longer betting on the world but on the panel, the market becomes a second-order guessing game about the referees, and anyone able to influence that panel's composition, briefing or mood acquires a cheaper lever than anyone able to influence the world.

  What I want is the case against the whole family of views, written as if by someone who understands why they are attractive. Please rank what would count against them, from fatal to merely awkward, and be explicit about the difference: which developments, observations or arguments should genuinely move a committed advocate, and which are merely embarrassing? I have already had the obvious ones from correspondents — thin markets, participants who hold a position in the underlying outcome, the difficulty of specifying a welfare index that nobody can game, the disappearance of liquidity when the question is genuinely important — so I would rather you set those aside, or say briefly why they are less central than they look, and spend your attention on what remains. In particular: which defeaters would a defender of futarchy concede as counting against it, as opposed to dismissing as resting on a misdescription of the proposal? Are there commitments that the counterfactual-audit variant takes on that the original does not, or vice versa? And is there any case the view simply cannot describe — a class of decision for which the machinery cannot even be stated, rather than one where it merely performs poorly?

  I also want an honest verdict on whether the position has been qualified into something unfalsifiable. In conversation its defenders retreat very quickly to a narrower claim — that this is only for decisions with a measurable outcome, a pre-committed metric and a body willing to be bound by the result — and I genuinely cannot tell whether that is a principled scope restriction or a way of ensuring the view is never tested. If it is insulated, is that a problem for a claim of this kind, or is it what you would expect from a proposal about institutional design? As a reporter I would personally be most moved by a clear account of what a diagnostic failure would look like: the pattern of results from an actual pilot inside a real institution — a city, a regulator, a company with a genuine decision to make — that would tell you the mechanism itself was at fault, rather than merely that the policy selected was unlucky. I am filing this on a train with no connectivity, so please do not point me at papers, links or further reading: I want the arguments themselves, and I want them in British English.
reasoning: |-
  Okay, the user is a science and ideas columnist for a broadsheet who's been advocating for conditional prediction markets with a counterfactual audit system. They've faced criticism, especially from an economist friend who thinks the counterfactual audit creates a second-order betting problem. The user wants a structured case against futarchy and its variants, ranking objections from fatal to awkward, while setting aside common critiques they've already heard. They're particularly concerned about whether their position has become unfalsifiable due to scope restrictions.

  First, I need to unpack the core proposal. The user's variant uses pre-registered welfare metrics and horizons, then a citizens' assembly retrospectively estimates the counterfactual outcome for the runner-up policy. The key innovation is avoiding pure counterfactual markets by using human judgment for comparison. But the friend's critique focuses on traders now betting on the panel's judgment rather than real-world outcomes.

  The user wants British English responses without academic references. They've already heard standard objections (thin markets, metric gaming, etc.), so I should prioritize deeper, structural issues. The main areas to cover are: fatal flaws that undermine the entire mechanism, serious but potentially fixable problems, and awkward implementation challenges. I also need to address whether the counterfactual audit variant introduces new weaknesses compared to classic futarchy, and whether there are decisions the system fundamentally can't handle.

  On unfalsifiability: The user notes proponents often retreat to narrow scenarios (measurable outcomes, pre-committed metrics). Is this principled or evasion? For a diagnostic failure, they want a real-world test outcome that would clearly indict the mechanism itself—not just bad luck.

  Starting with fatal flaws: The friend's "second-order guessing game" point feels central. If traders focus on predicting panel behavior rather than policy effects, the market loses its truth-tracking purpose. This seems fundamental because it corrupts the core mechanism. Even with a well-designed panel, the mere possibility of influence could distort incentives. Worse, it creates perverse incentives to manipulate the panel itself. 

  Another fatal issue might be the "counterfactual gap" problem. Human panels are terrible at estimating what *would have* happened—psychology shows we're biased toward actual outcomes (hindsight bias) and struggle with complex causality. If the audit regularly misjudges gaps, payouts become arbitrary, destroying market confidence. This is worse for the audit variant than classic futarchy, which avoids such panels.

  Then serious problems: Epistemic injustice stands out. The system privileges quantifiable outcomes, potentially ignoring hard-to-measure welfare aspects. This could systematically disadvantage policies addressing inequality or cultural goods. Also, the time lag creates vulnerability—five years is long enough for unforeseen crises to distort results, but shortening it might preclude proper evaluation.

  Awkward implementation issues include metric specification. While the user dismisses gaming concerns, designing unhackable metrics for complex societies seems impossible. Similarly, liquidity drying up during crises is predictable—traders flee uncertainty precisely when decisions matter most. 

  On decisions the system can't handle: Existential risks with no "after" to measure, or constitutional issues where process matters more than outcomes. The machinery breaks when consequences exceed the horizon or defy quantification.

  Regarding unfalsifiability: The narrow scope ("only decisions with measurable outcomes, etc.") is partially justified—you couldn't apply this to abstract rights questions. But proponents might overuse it to dodge tests. A true diagnostic failure would be consistent prediction market errors *driven by panel manipulation* (e.g., suspicious audit judgments coinciding with trader positions), or markets persistently favoring policies that harm measurable welfare while boosting manipulable metrics. If the system selects policies that "win" the counterfactual gap but clearly damage society, that indicts the mechanism.

  The user's depth suggests they want steelmanned criticism, not easy rebuttals. Their anxiety about unfalsifiability is telling—they're intellectually honest. The British English requirement means avoiding Americanisms and using phrases like "whilst" and "one might think."
answer: |-
  Here’s the case against conditional prediction markets (CPMs) with counterfactual audits, structured as requested. I’ll rank objections from **fatal** (undermining the core mechanism) to **serious but potentially surmountable** to **awkward** (implementation headaches). I’ll flag where your variant differs from classic futarchy and address unfalsifiability head-on.

  ---

  ### **Fatal Flaws: The Mechanism Itself Collapses**
  1.  **The Second-Order Guessing Game (Your Variant’s Achilles Heel):**  
      *   **The Case:** Your economist friend is correct. Once payouts hinge on a retrospective citizens' assembly judging a *counterfactual*, traders aren’t primarily betting on a policy’s real-world effect. They’re betting on *how the assembly will perceive and reconstruct a hypothetical past*. This creates a market in "what will the panel think happened?" not "what will happen?".  
      *   **Why it’s Fatal:** It destroys the core promise of prediction markets – aggregating dispersed knowledge about *objective reality*. Traders focus resources on predicting/manipulating panel psychology, briefing quality, selection bias, or zeitgeist (e.g., "Will post-crisis austerity bias make the panel undervalue stimulus?"). Influence over the panel (lobbying, media campaigns targeting its members) becomes vastly cheaper and more effective than influencing the complex world. This isn't a bug; it's the *entire game* under your variant.  
      *   **Defender’s Concession:** A committed advocate *should* see this as potentially fatal to the counterfactual audit variant specifically. It fundamentally shifts the market's epistemic foundation from reality to perception. Classic futarchy avoids this by requiring a *realised* conditional outcome (if possible), making it *relatively* safer on this point (though not immune – see below).

  2.  **The Counterfactual Gap is Unbridgeable (Problem for Both, Acute for Audit):**  
      *   **The Case:** Humans are catastrophically bad at constructing reliable counterfactuals, *especially* years later with evolving contexts and hindsight bias. The assembly isn’t "free to speak to the one thing it can speak to" (pure comparison); it’s being asked to do the impossible: accurately simulate a world that didn’t exist. Psychology and history show we rationalise outcomes, underestimate complexity, and struggle with chaotic systems. The "gap" they estimate is more likely a fabrication reflecting current biases than a truth-telling measure.  
      *   **Why it’s Fatal:** If the settlement mechanism (the gap) is systematically unreliable or arbitrary, the market loses its anchor. Traders know this, amplifying the second-order game (betting on the panel’s biases). Even classic futarchy struggles if the "condition" is poorly defined or the outcome metric is gamed post-hoc, but the audit variant *builds in* this unreliability as its core settlement mechanism.  
      *   **Defender’s Concession:** Advocates must concede this is a profound philosophical and practical challenge. They might argue for panel design/process to mitigate it, but the inherent impossibility of knowing "what would have been" is a deep epistemological wound.

  ---

  ### **Serious Problems: Undermining Legitimacy & Function**
  3.  **Epistemic Injustice & The Tyranny of the Quantifiable:**  
      *   **The Case:** CPMs demand a single, pre-registered welfare index. This inherently privileges quantifiable, short-to-medium-term outcomes over hard-to-measure goods (dignity, fairness, long-term resilience, cultural cohesion, distributive justice). Policies benefiting measurable GDP over social stability or environmental regeneration would be systematically favoured, even if citizens value the latter more. The market can't price what isn't in the index.  
      *   **Why it’s Serious:** It biases policy towards technocratic, economistic solutions and away from intrinsically qualitative or normative concerns. This erodes democratic legitimacy, as voters sense their deeper values are ignored for what’s easily measured. Your audit variant *doubles down* by freezing the index years in advance.  
      *   **Defender’s Concession:** A thoughtful advocate concedes this limits the scope to decisions dominated by quantifiable outcomes. Denying it looks like valuing mechanism over substance.

  4.  **Temporal Vulnerability & The Black Swan Trap:**  
      *   **The Case:** The fixed horizon is a massive vulnerability. What if a major, unforeseen shock (war, pandemic, financial meltdown) hits *after* the market settles but *before* the policy’s effects (or the counterfactual audit) are realised? The market selected Policy A based on pre-shock expectations, but its post-shock performance (or the panel’s post-shock judgment of the counterfactual) is disastrous due to the shock, not the policy’s inherent quality. Conversely, a policy might luckily coincide with a positive shock.  
      *   **Why it’s Serious:** It exposes the mechanism to devastating luck, undermining its claim to superior decision-making. Traders cannot price in genuinely unknown unknowns. The 5-year audit gap *exacerbates* this by extending the vulnerability window.  
      *   **Defender’s Concession:** Advocates must admit this is a major weakness compared to adaptable institutions. They might shorten horizons, but this conflicts with needing time for effects to materialise.

  ---

  ### **Awkward Problems: Implementation Quagmires**
  5.  **The Specification Monster (Worse for Audit):**  
      *   **The Case:** Whilst you set aside "gaming the index," pre-registering a watertight, unambiguous welfare index *and* the precise policy definitions for the conditional "if adopted" is fiendishly difficult. Legalistic wrangling over metric definitions, data sources, and adjustment factors *before* the market opens becomes a high-stakes battlefield. The counterfactual audit adds another layer: how will the panel access consistent data/definitions for the *non-existent* runner-up world?  
      *   **Why it’s Awkward:** It creates massive friction, delay, and opportunities for bad-faith challenges, potentially paralysing the mechanism or leading to arbitrary settlements. Classic futarchy has this too, but the audit variant adds the counterfactual data problem.  
      * **Defender’s Response:** "We'll design robust pre-commitment protocols!" – feasible in theory, messy in practice.

  6.  **Liquidity Death Spiral in Crisis (Problem for All CPMs):**  
      *   **The Case:** You mention liquidity vanishing when stakes are high. This isn't peripheral; it's predictable and lethal. In a genuine crisis or deep uncertainty, risk aversion spikes. Traders won't stake meaningful money on high-stakes, complex conditionals. The market fails *precisely when* the "superior decision-making" is most needed, potentially forcing a fallback to politics anyway.  
      *   **Why it’s Awkward:** It reveals a fundamental fragility. Markets thrive on continuous, lower-stakes trading. Existential decisions are their kryptonite.  
      *   **Defender’s Response:** Often hand-waving about subsidies or market makers, which introduce new distortions and principal-agent problems.

  ---

  ### **Cases the Machinery Cannot Describe**
  *   **Decisions Where Process *Is* the Point:** Constitutional changes, declarations of war, rights-based issues (e.g., repealing habeas corpus). Here, legitimacy stems from democratic deliberation and consent, not just consequences. A market deciding them feels morally repugnant and illegitimate, regardless of the predicted welfare index. The machinery is silent on procedural justice.
  *   **Decisions with Incommensurable or Existential Outcomes:** Choosing between energy policies risking catastrophic climate change vs. deep poverty. The welfare index collapses profound, potentially irreversible trade-offs into a single number. The counterfactual audit is ludicrous here – "Panel, please estimate how catastrophic climate change would have been 5 years after we chose poverty?".
  *   **Decisions Where the 'Horizon' is Infinity:** Nuclear waste disposal, gene drives, AI governance. Effects span centuries. A fixed horizon (even 50 years) is meaningless. The market cannot price the deep future meaningfully.

  ---

  ### **Unfalsifiability & Diagnostic Failure**
  *   **The Scope Retreat:** Retreating to "only measurable outcomes, pre-committed metric, willing body" is **partly principled** (you can't market-price the unpriceable) but **risks becoming insulation**. The danger is defining "measurable" so narrowly or requiring such perfect conditions that the mechanism is only tested where failure is unlikely (low-stakes, clear metrics) – a self-fulfilling prophecy of adequacy.
  *   **Diagnostic Failure - What Would Indict the Mechanism?**  
      A clear failure in a real pilot would require this pattern:
      1.  **The CPM selects Policy A over Policy B.**
      2.  **Policy A is implemented.**
      3.  **The *Realised Welfare Outcome* for A is significantly *worse* than:**
          *   **(Classic):** The *predicted* outcome for A *and* the *predicted* outcome for B (if available).
          *   **(Audit):** The *Counterfactual Audit's* estimate for what B's outcome would have been.
      4.  **Crucially, Post-Hoc Analysis Shows:** The market failure *wasn't* due to bad luck (an unforeseeable shock hitting *after* implementation) or poor policy *execution*. It was due to:
          *   **Systematic Mis-pricing:** Evidence traders were primarily gaming the panel (audit variant) or a clearly gamed metric (e.g., metric soared while broader welfare collapsed).
          *   **Liquidity Collapse:** The market was too thin/volatile to aggregate information meaningfully *at the time of decision*.
          *   **Horizon Mismatch:** The negative outcome stemmed from effects beyond the pre-set horizon, which the market structurally ignored.
      5.  **Repeated Instances:** A single failure could be luck. A pattern across diverse pilots showing consistent mispricing linked to structural flaws (panel gaming, metric limitations, horizon issues) indicts the mechanism. Seeing Policy A consistently "win" the gap but leave citizens demonstrably worse off *by their own broader values* than B likely would have (based on evidence *not* captured in the index) is damning.

  **In British English:** The position isn't *inherently* unfalsifiable, but its defenders must commit to testing it on decisions where the welfare index genuinely captures the societal good at stake, and accept that consistent market selection of policies that subsequently fail *by the system's own pre-registered lights* (or by overwhelming consensus on broader welfare), especially due to identifiable structural flaws like second-order gaming, would count decisively against it. The retreat to scope *is* necessary for coherence, but letting that scope shrink to only trivial or perfectly predictable decisions *would* be insulating dogma. A genuine test requires courage.

  --- 
  This is the steelmanned case. The counterfactual audit variant, whilst cleverly attempting to dodge a metaphysical bullet, appears to create a more profound flaw by making the market's target endogenous and manipulable. The core tension remains: can complex human values, long-term consequences, and irreducible uncertainty ever be reliably outsourced to a betting market, however ingeniously designed? The fatal flaws suggest profound limits.
