    If it chooses slow for Box1: then Box1 safe for sure, utility 5. Then after that, it observes no press or press. But Alice will press if she thinks the agent will move Box2 fast. The agent, after moving Box1 slow, and if not pressed, will choose speed2. It will choose fast if U_fast2 > U_slow2? We have U_fast2 = -5, U_slow2 = 5, so it will choose slow. So Alice, knowing that the agent will choose slow for Box2 (because it's rational), will not press. So the agent gets 5 ( for Box1) + 5 ( for Box2) = 10.

  So the updateful agent chooses slow for Box1 and then slow for Box2, getting 10.

  Same as updateless.

  I am considering a setting with information asymmetry.

  New idea: the agent has private information about the risk. Let's not do that because we want the agent's policy to be known to the supervisor through its actions or commitment.

  Perhaps the supervisor presses the switch based on the agent's initial action, which is the same in both treatments, but the treatments differ in how they select that action.

  Let's go back to the first warehouse example but with a twist: the agent's movement speed for the first few seconds is observable, and Alice uses that to predict the overall policy. The agent can start slow and then speed up, or start fast and continue fast. Alice presses the switch if the initial speed is fast.

