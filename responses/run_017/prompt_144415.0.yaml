  But now, suppose that the compensation is set based on the default action that the agent would take, but Alice's press decision depends on her belief about that action. However, in the updateful case, the agent cannot commit to slow, so it will always choose fast if not pressed, so Alice presses, and it gets U_fast.

  The difference we want: in the updateless case, the agent can commit to slow, and then Alice does not press, and it gets U_slow. But it only does that if U_slow > U_fast, which we assume not.

