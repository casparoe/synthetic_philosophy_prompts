  I am considering a different approach with a sequential action.

  Warehouse with two boxes: Box1 and Box2. The robot can move Box1 then Box2. Each box can be moved fast or slow. The catch: moving Box1 fast might break it, and then Box2 cannot be moved at all (because the robot is designed to move one box at a time, and if Box1 breaks, it's stuck). The off-switch press at any time shuts down the robot and alerts a human who then moves the remaining boxes slowly and safely. The utility: for each box moved safely and fast, +10; moved slowly, +5; if a box breaks, -20.

  The robot's policy: for Box1, choose speed. Then, if Box1 is moved and not broken, it moves Box2 with some speed.

  The press can happen after the robot has already moved Box1. Alice observes how the robot moved Box1 and then decides whether to press the switch before it moves Box2.

  The compensation constant: if the switch is pressed at a given time, the agent gets the expected utility of what would have happened if not pressed at that time and the agent continued with its policy.

  Updateless agent: It commits to a full policy: (speed1, speed2). This policy is known to Alice. She will press after Box1 if she thinks the agent's policy for Box2 is too risky. But note, she also observes the outcome of Box1.

  Updateful agent: It chooses speed1. Then, after moving Box1, it observes whether the switch is pressed. If pressed, it gets compensated and stops. If not pressed, it chooses speed2.

  Now, let's assume that moving Box1 fast has a high risk of breakage. If Box1 breaks, then the agent cannot move Box2, and it gets -20 for Box1 and 0 for Box2. If Box1 is moved fast and safe, then it can move Box2. Moving Box2 fast has low risk.

  Alice is very risk-averse. She will press the switch after Box1 is moved (whether it broke or not) if she thinks the agent will move Box2 fast. She believes that moving any box fast is too risky.

  First, updateless agent: It must choose (speed1, speed2). If it chooses to move Box2 fast, then Alice will press the switch after Box1 is moved, so the agent never gets to move Box2. In that case, for the press event after Box1, the compensation is the expected utility of what would have happened if not pressed. If not pressed, the agent would have moved Box2 fast. So the compensation is based on that. But if Alice presses, then the human moves Box2 slowly, and the agent gets compensated to the level of the expected utility of moving Box2 fast. However, the agent also gets the utility from Box1.

  Let's compute for a particular policy. Suppose the agent commits to (slow, fast). Then for Box1, it moves slow: costs 5, and safe. Then Alice, seeing that the agent will move Box2 fast, presses the switch. Then the agent gets: utility from Box1 (5) plus compensation for Box2. The compensation for Box2 is the expected utility of moving Box2 fast: which is (high prob safe) * 10 + (low prob break) * (-20) = U_fast2. But when pressed, the human moves Box2 slow, yielding 5, but the agent gets a side payment to make its utility for Box2 equal to U_fast2. So total utility = 5 + U_fast2.

