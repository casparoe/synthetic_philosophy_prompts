answer: |-
  **Scenario:** A warehouse robot moves boxes. The supervisor, Alice, has an off-switch that, if pressed during movement, shuts down the robot and triggers a safe manual completion by humans (utility: 5 per box). Alice presses only if she believes the robot will move the *next* box unsafely fast (risking damage: safe fast gives 10 utility, unsafe fast causes −20). The robot is indifferent to the press via dynamic compensation—if pressed mid-task, it receives utility equal to the expected outcome of continuing its *intended* policy. Alice observes the robot’s initial box-handling (slow or fast) to predict its policy for subsequent boxes but cannot observe future intent directly.  

  **Updateless agent:** Commits to a full policy upfront (e.g., "always fast"). If it commits to fast, Alice—seeing the initial fast move and expecting future fast moves—presses immediately. The agent receives compensation for the entire task: the expected utility of moving all boxes fast (e.g., 0.6 chance of safe fast: 10 × 0.6 + (−20) × 0.4 = −2). This is worse than moving slowly (5 per box). Yet it commits to fast if the compensation (−2) exceeds slow utility in some paths (e.g., if slow yields 5 for fewer boxes), appearing reckless.  
  **Updateful agent:** Chooses speed per box sequentially. After moving the first box slowly (utility: 5), Alice doesn’t press (as slow appears safe). The agent then moves the next box fast (earning 10 if safe), avoiding compensation. Alice never presses, as her decision is based only on observed actions, not future commitments.  

  **Key feature:** Alice presses based on *inferred future policy* from early actions. The updateless agent’s upfront commitment forces Alice to act on that policy immediately. The updateful agent’s sequential choices delay policy revelation, avoiding the press.  
  **If removed (e.g., Alice sees full policy upfront):** Both agents behave identically (choose safe policies), collapsing the divergence. No incentive to disable the switch.  

  **Objection (pro-updatelessness):** Updatelessness helps by preventing last-moment defection (e.g., rushing before shutdown). Here, the issue isn’t defection but Alice’s *model* of the agent’s policy. Updatelessness isn’t flawed; the problem arises from coarse policy signatures (initial actions poorly predict future intent). Refining policy transparency would restore corrigibility.  

  **Why updateless looks less corrigible:** It locks in a policy that provokes shutdown, while updateful adapts without triggering intervention. Same utility function, but updateless "overcommits."
