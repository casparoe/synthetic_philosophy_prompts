prompt: |-
  In my comparative-politics class we have been arguing about performance legitimacy — roughly, the idea that a government which reliably delivers order and rising incomes may earn a claim to rule even without free elections — and I cannot work out what rule our teacher is actually applying. Her verdicts so far: the large East Asian one-party state with decades of growth and very low violent crime, legitimate; the small, very rich city-state that holds real but constrained elections and tightly restricts speech, legitimate; the junta in a resource-poor country that ended an insurgency, stabilized prices and handed power back after eight years, legitimate for the time it ruled; the mineral-exporting democracy with free elections where the boom money vanished into corruption and street crime rose, not legitimate; the Gulf monarchy that is rich and safe but has never held national elections, not legitimate, on the grounds that its prosperity was a windfall it never had to govern for. The case I have to brief is one I invented: a country of nine million that discovered enormous offshore gas reserves twenty years ago and has been ruled since by a single party with no national elections; incomes have tripled, violent crime and corruption are both low, most of the revenue went into a sovereign wealth fund plus working ports and schools, and when gas prices collapsed five years ago the government avoided a recession by drawing on the fund and raising taxes with little protest; opposition parties are banned and the press is censored, but there is no torture, people may emigrate and few do, and anonymous independent surveys put approval near seventy percent. Does she call this government legitimate? I would rather have the reasoning than the bare answer: give me the two or three rules that fit all five of her earlier verdicts, say what each predicts about my invented case, tell me which one you think she is really running and why, and propose one further case I could put to her that would most sharply separate the rules you leave standing. Please also say how confident you are in each part — especially the prediction — and flag the single step you are least sure of.
reasoning: |-
  Hmm, this comparative politics student is struggling to understand their professor's framework for performance legitimacy. They've described five cases the professor has ruled on, and now need to apply that logic to their invented case about a gas-rich autocracy. The student wants me to reverse-engineer the professor's criteria, apply it to their case, identify which rule is primary, and design a test case.

  Looking at the professor's rulings, I notice some clear patterns. She approved three regimes that delivered results: the East Asian state with growth and low crime, Singapore's constrained democracy with prosperity, and the temporary junta that stabilized things. But she rejected both the corrupt democracy and the Gulf monarchy despite their wealth. The key difference seems to be whether the government actively earned its results rather than relying on passive windfalls.

  I can distill three possible rules from these decisions:
  1) The "Active Governance Test" - legitimacy requires demonstrable governing competence beyond simple resource luck
  2) The "Origin Matters Test" - legitimacy is compromised if wealth comes from unearned resources rather than productive effort
  3) The "Consent Proxy Test" - high approval ratings can substitute for electoral mechanisms

  For the student's invented case, all three tests give different answers. The gas-rich state passes the Active Governance test because they skillfully managed the boom-bust cycle and built institutions. But it fails the Origin Matters test since the wealth is resource-based. The Consent Proxy test would approve it given the 70% survey approval.

  I suspect the professor is primarily using the Active Governance test because it explains all her rulings consistently. The Gulf monarchy failed because they didn't actively govern their windfall, while the junta earned legitimacy through active crisis management. The invented case should therefore be ruled legitimate.

  To test this, I'd propose a "Manufacturing Boom Autocracy" case - a resource-poor dictatorship that industrializes successfully without elections. This would cleanly separate Active Governance (which would approve) from Origin Matters (which would reject).

  My confidence is highest in identifying Active Governance as the core rule, and lowest in predicting the professor's ruling on the consent surveys - she might discount them as unreliable under censorship. The student should probe that uncertainty in class.
answer: |-
  Based on your professor's pattern of rulings, I've distilled three core "rules" of performance legitimacy she appears to apply. Below is a breakdown of each rule, how it fits her prior verdicts, predictions for your invented case, my assessment of her primary rule, a proposed test case, and confidence levels at each step.

  ---

  ### **Three Rules Fitting All Five Verdicts**
  1.  **The Earned Prosperity Rule:**
      *   **Definition:** Legitimacy requires prosperity *generated through deliberate state effort/policy* (e.g., industrialization, institution-building, crisis management). Windfalls (like oil/gas) *alone* do not confer legitimacy; the state must demonstrate governance *skill* in managing it or creating alternative value.
      *   **Fits Verdicts:**
          *   *East Asia:* Growth & low crime result from *active* policy, not luck (✓ Legitimate).
          *   *City-State:* Prosperity built via strategic policy, not passive wealth (✓ Legitimate).
          *   *Junta:* *Actively* ended insurgency, stabilized economy, planned transition (✓ Legitimate *temporarily*).
          *   *Mineral Democracy:* Boom wealth *passively* received, then squandered due to poor governance (✗ Not Legitimate).
          *   *Gulf Monarchy:* Wealth is *passive* hydrocarbon windfall; no evidence of earned governance (✗ Not Legitimate).
      *   **Predicts Invented Case:** **Legitimate.** The government *actively managed* the resource: built a SWF, invested in infrastructure/education, skillfully navigated the price crash via taxation and SWF drawdowns (demonstrating policy competence). The prosperity wasn't *just* luck; it was earned through governance.

  2.  **The Non-Repression Baseline Rule:**
      *   **Definition:** Performance legitimacy *can* exist without elections, but *only* if the regime avoids severe repression (torture, arbitrary imprisonment, forced disappearances). Basic freedoms (e.g., emigration) and low overt fear are prerequisites.
      *   **Fits Verdicts:**
          *   *East Asia/City-State/Junta:* No mention of systematic torture/severe repression; emigration possible (✓ Legitimate).
          *   *Mineral Democracy:* Free elections imply baseline freedoms met, but failed on prosperity (✗ Not Legitimate – fails on performance).
          *   *Gulf Monarchy:* Likely meets baseline (no torture mentioned, emigration possible?), but fails on origin of prosperity (✗ Not Legitimate).
      *   **Predicts Invented Case:** **Legitimate.** Explicitly states "no torture," allows emigration, low overt dissent. Meets the non-repression baseline.

  3.  **The Effective Order + Development Rule:**
      *   **Definition:** Legitimacy stems from reliably delivering the core goods of stateness: physical security (low violent crime), economic stability (managed growth, avoiding crises), and basic functional institutions (ports, schools). Corruption control is key evidence of institutional effectiveness.
      *   **Fits Verdicts:**
          *   *East Asia:* Low crime, growth, functional institutions (✓ Legitimate).
          *   *City-State:* Order, wealth, functional institutions (✓ Legitimate).
          *   *Junta:* Restored order, stabilized prices (✓ Legitimate *temporarily*).
          *   *Mineral Democracy:* Rising street crime (failed order), corruption (failed institutions) (✗ Not Legitimate).
          *   *Gulf Monarchy:* Safe and rich (✓ Order/Wealth), but dismissed on other grounds (✗ Not Legitimate – suggesting this is *necessary but not sufficient*).
      *   **Predicts Invented Case:** **Legitimate.** Low violent crime, low corruption, functional ports/schools, successfully weathered economic shock.

  ---

  ### **Which Rule is She Really Running?**
  *   **Most Likely Rule:** **The Earned Prosperity Rule.**
  *   **Why:**
      1.  It's the *only* rule that perfectly explains *all* her verdicts, especially the critical distinction between the **Gulf Monarchy** (passive windfall, ✗) and your **Invented Case** (active management, ✓ predicted), as well as the **Junta** (active crisis management, ✓) vs. **Mineral Democracy** (passive windfall + mismanagement, ✗).
      2.  The *Gulf Monarchy verdict* explicitly hinges on the windfall being unearned ("prosperity was a windfall it never had to govern for"). This is the clearest articulation of her logic.
      3.  The other rules (Non-Repression Baseline, Effective Order) are likely *necessary conditions* in her framework but not *sufficient*. The Gulf State likely met them but was still deemed illegitimate due to the windfall issue. The Earned Prosperity Rule is the decisive *sufficient* condition explaining approval.

  ---

  ### **Prediction for Your Invented Case**
  *   **Professor's Likely Verdict:** **Legitimate.**
  *   **Reasoning:** The government demonstrably *earned* its legitimacy through skillful governance: transforming a windfall into a managed SWF, investing in long-term assets (ports/schools), and proactively navigating an economic crisis with effective policy (taxation, SWF drawdown) that maintained stability with public acquiescence ("little protest"). This active management overcomes the resource curse stigma.

  ---

  ### **Proposed Test Case to Separate Rules**
  *   **The Manufacturing Boom Autocracy:**
      *   A resource-*poor* country with no significant windfalls.
      *   Ruled for 30 years by a single party/military leader. No national elections, opposition banned, press censored. No torture, emigration allowed.
      *   Through state-led industrial policy, education investment, and infrastructure development, it transformed into a major manufacturing exporter. Sustained high growth, low inflation, low violent crime, functional institutions, low corruption. Per capita income quintupled. Independent surveys show 65% approval.
      *   *No* resource wealth ever discovered.

  *   **How It Separates the Rules:**
      *   **Earned Prosperity Rule:** **✓ Legitimate.** Prosperity was *entirely* generated through active, skillful governance and policy, not luck.
      *   **Origin Matters Rule (implied by Earned Prosperity):** **✓ Legitimate.** No windfall; wealth is clearly earned.
      *   **Non-Repression Baseline:** **✓ Legitimate.** Meets the baseline.
      *   **Effective Order + Development:** **✓ Legitimate.** Delivers core goods.
      *   **Crucial Separation:** This case directly challenges the *necessity* of the **windfall distinction**. If your professor deems this **Legitimate** (as Earned Prosperity predicts), it confirms that rule. If she deems it **Not Legitimate** *solely because of the lack of elections/repression*, it reveals that the **Non-Repression Baseline Rule** or an unstated **Democratic Requirement** is actually her primary threshold, and the "earned" aspect was secondary context for resource-rich cases. The Gulf vs. Invented Case tested the *sufficiency* of earned management *with* a windfall; this tests the *sufficiency* of earned management *without* a windfall under authoritarianism.

  ---

  ### **Confidence Assessment**
  1.  **Identifying the Three Rules (High Confidence - 90%):** The patterns in the verdicts strongly support these three interlocking concepts. "Earned Prosperity" explains the Gulf/Minerals rejections and Junta approval most cleanly.
  2.  **Predicting "Legitimate" for Invented Case (Moderate Confidence - 75%):** Based strongly on applying the Earned Prosperity Rule. However...
  3.  **Professor's *Actual* Reliance on Earned Prosperity (High Confidence - 85%):** The Gulf verdict is the smoking gun. The distinction between passive windfall and active management is central.
  4.  **Least Confident Step: Predicting the Weight Given to the 70% Approval Rating (Low Confidence - 60%).** This is the **single step I'm least sure of.** While the surveys *support* legitimacy under the Earned Prosperity/Effective Order rules, your professor may:
      *   **Discount them heavily:** Due to censorship, lack of party competition, and potential fear/self-censorship making "anonymous" surveys unreliable in such contexts. She might see them as regime propaganda or inherently invalid.
      *   **See them as irrelevant:** If legitimacy is purely about *objective performance and governance effort* (Earned Prosperity) or *delivery of core goods* (Effective Order), subjective approval might not factor in significantly.
      *   **Use them as a tiebreaker/confirmation:** They might slightly bolster the case but not be decisive. Her prior verdicts don't mention surveys, so we lack data on how she weighs them. **This is the biggest wildcard in your case.** She might approve the regime *despite* the surveys, or (less likely) use potential doubts about them as a reason for rejection if other factors are borderline (which they aren't in your case).

  **In summary:** Your professor's core rule is **The Earned Prosperity Rule.** She will likely deem your gas-state **Legitimate** because it actively and skillfully governed its windfall. The **Manufacturing Boom Autocracy** case will definitively test whether "earned" prosperity alone is sufficient under authoritarianism, separating it from any hidden democratic requirement. Be prepared to discuss the reliability of the approval surveys in class – that's the most ambiguous element. Good luck!
