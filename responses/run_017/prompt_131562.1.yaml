  For negotiable requirements, how we handle non-human welfare or existence-dependent policies could vary. The self-report instability means we need robustness, but exactly how we achieve that might differ across implementations. The gain comparison requirement suggests we need some ratio-scale properties.

  Then there are requirements that really reflect ethical positions - like whether we prioritize the worst-off (prioritarianism) or set sufficiency thresholds. These can't be presented as neutral constraints.

  For the five judgments:
  1) Full level comparability isn't strictly necessary - we might manage with partial comparability
  2) The requirements might conflict around completeness - we may need to relax this for realism
  3) The ex ante/ex post aggregation debate isn't really about interpersonal comparison
  4) The most exclusionary requirement is probably interpersonal comparability itself
  5) Partial comparability can be operationalized using interval scales or fuzzy thresholds

  I'll make sure to note tensions between requirements, like between completeness and realism in self-reports. In the closing note, I'll briefly map how different approaches (utilitarian, prioritarian etc.) fare against these specifications without favoring any particular camp.
answer: |-
  Below is a specification for interpersonal comparisons of well-being, structured by grade of necessity. Each requirement is justified by your stated purpose (defensible distributional weights for cost-benefit analysis) or foundational utility theory, with explicit engagement of your cases. Conflicts are noted.

  ---

  ### **Grade 1: Non-Negotiable Requirements**  
  *(From mathematics/purpose; failure invalidates the entire project)*  

  1. **Cardinal Measurability of Individual Welfare**  
     *Requirement:* Individual welfare must be measurable on a cardinal scale (unique up to positive affine transformations, i.e., interval scale).  
     *Case:* Gains/losses comparisons ("costs A more than twice what it gains B") demand ratio comparisons of welfare *differences*. Ordinal or purely ordinal-comparable utilities cannot support this.  
     *Conflict:* None—this is a mathematical necessity for aggregating gains/losses.  

  2. **Interpersonal Comparability of Welfare Differences**  
     *Requirement:* Differences in welfare (ΔW) must be comparable across persons.  
     *Case:* Distributional weights require judging whether a $1 gain to A is worth more than a $1 loss to B. Without comparable ΔW, weights are arbitrary.  
     *Conflict:* Tension with **Independent Rescaling** (Grade 2); resolved by fixing a "zero" and "unit" for comparison.  

  3. **Invariance to Mood/Context Biases**  
     *Requirement:* The comparison procedure must correct for or be robust to transient biases in self-reports (mood, framing, etc.).  
     *Case:* Self-reports drift with question order/recent events; weights based on raw reports would be unstable and indefensible.  
     *Conflict:* Apparent tension with **Self-Report Primacy** (Grade 3); addressed by calibration or aggregation methods.  

  ---

  ### **Grade 2: Genuine but Negotiable Requirements**  
  *(Necessary for defensibility, but implementation may vary)*  

  4. **Interpretable Welfare Scales**  
     *Requirement:* Welfare scales (e.g., 0–10) must have anchored meanings (e.g., "0" = neutrality, "10" = bliss) to avoid conflating scale use with welfare range.  
     *Case:* A person with blunted affect rates chronic pain as "8" on a scale where "0" is undefined. Anchoring (e.g., "0" = death/unbearable suffering) prevents misinterpreting narrow ranges.  
     *Conflict:* Anchoring requires ethical choices (e.g., is "zero" death or a life not worth living?).  

  5. **Robustness to Welfare Heterogeneity**  
     *Requirement:* Comparisons must be possible between agents with different welfare constitutions (e.g., desire-fulfillment vs. hedonic experience).  
     *Case:* Disagreement on who is better off (desire-fulfilled ascetic vs. happy hedonist) requires a meta-framework (e.g., resourcist proxy, capability set, or deliberative consensus).  
     *Conflict:* Risks privileging one theory (e.g., capabilities) if not procedurally neutral.  

  6. **Non-Identity Problem Resolution**  
     *Requirement:* A defensible "neutral level" (welfare zero) for comparing policies that affect who exists.  
     *Case:* Population ethics requires a welfare floor (e.g., a life worth living vs. not) to avoid paralysis.  
     *Conflict:* Definitionally ethical (e.g., utilitarians vs. sufficientarians disagree on "zero").  

  7. **Extensibility to Non-Human/Non-Verbal Agents**  
     *Requirement:* Welfare comparisons must extend to entities that cannot self-report (e.g., animals, AI).  
     *Case:* Requires observable proxies (e.g., pain behaviors, goal-achievement) validated by a theory of welfare.  
     *Conflict:* Proxy choice is theory-laden (e.g., preference-satisfaction vs. sentience).  

  ---

  ### **Grade 3: Ideological Preferences**  
  *(Reflect camp-specific values, not universal constraints)*  

  8. **Level Comparability (vs. Difference-Only)**  
     *Requirement:* Full comparability of welfare *levels* (not just differences).  
     *Case:* Prioritarians require knowing who is "worse off" to weight gains; utilitarians need only ΔW.  
     *Conflict:* Rejected by ordinalists; not needed for distributional weights if only ΔW matters.  

  9. **Self-Report Primacy**  
     *Requirement:* First-person reports are the ultimate authority on welfare.  
     *Case:* Contested by objective-list theorists who override self-reports (e.g., "adaptive preferences").  
     *Conflict:* Incompatible with **Robustness to Welfare Heterogeneity** if reports conflict across theories.  

  10. **Completeness of Ordering**  
      *Requirement:* All welfare states/gains must be comparable (no incomparability).  
      *Case:* Capability theorists allow incomparability between distinct "flourishing" states; decision rules require completeness.  
      *Conflict:* With realism; some comparisons (e.g., humans vs. AI) may resist resolution.  

  ---

  ### **Judgments on Key Questions**  

  1. **Full Level Comparability**  
     Not required. Distributional weights need only ΔW comparability (Grade 1.2). Level comparability is a **Grade 3** preference (prioritarian/sufficientarian).  

  2. **Joint Satisfiability**  
     Conflict arises between:  
     - **Completeness** (Grade 3) and **Robustness to Heterogeneity** (Grade 2): If welfare constitutions differ radically (e.g., human vs. AI), comparisons may be incomplete.  
     - **Self-Report Primacy** (Grade 3) and **Extensibility** (Grade 2): Non-verbal agents force proxy use.  
     *Resolution:* Drop **Completeness** as non-essential. Weights can use interval ranges or dominance reasoning when comparability is partial.  

  3. **Ex Ante vs. Ex Post Aggregation**  
     Not about interpersonal comparison. It concerns *temporal aggregation* under uncertainty (e.g., maximize expected social welfare vs. equalize outcomes post-resolution). Your specification settles interpersonal ΔW; this is a separate risk-ethics issue.  

  4. **Most Exclusionary Requirement**  
     **Interpersonal Comparability of ΔW** (Grade 1.2) excludes:  
     - Ordinalists (e.g., Pareto-only approaches)  
     - Libertarians rejecting interpersonal comparisons  
     - Cultural relativists denying universal welfare metrics  
     *Why not prejudice?* Without ΔW comparability, distributional weights lack mathematical basis—violating the core purpose.  

  5. **Partial Comparability Usability**  
     Yes, without collapsing to full comparability. Use:  
     - **Interval scales** (e.g., "A's gain is 2–4× B's loss")  
     - **Decision rules** like maximin or leximin that use ordinal rankings of worst-off positions.  
     This avoids cardinal weighting while respecting dominance (e.g., "A suffers more than B gains").  

  ---

  ### **Conflicts and Tensions**  
  - **Real Conflict:** **Self-Report Primacy** vs. **Extensibility** (if animals can’t report, proxies override primacy).  
  - **Apparent Conflict:** **Cardinality** vs. **Context Robustness**—resolved by using time-averaged or deliberatively calibrated reports.  

  ### **Closing Note on Major Families**  
  - **Utilitarianism:** Satisfies Grade 1–2 but rejects Level Comparability (Grade 3.8) and may violate Robustness (Grade 2.5) if welfare is heterogenous.  
  - **Prioritarianism:** Requires Level Comparability (Grade 3.8), straining with Welfare Heterogeneity.  
  - **Sufficientarianism:** Demands a "sufficiency threshold" (part of Grade 2.6), which is negotiable but not universal.  
  - **Capability Approach:** Excels at Robustness (Grade 2.5) but struggles with Cardinality (Grade 1.1) and Completeness (Grade 3.10).  
  - **Hedonism:** Falters on Robustness (Grade 2.5; e.g., blunted affect) and Extensibility (Grade 2.7; non-sentient AI).  

  This specification centers minimal constraints for defensible weights while flagging where theory-choice begins. The hardest trade-offs lie in **Robustness** (across welfare conceptions) and **Extensibility** (to non-humans).
