prompt: |-
  I'm in a philosophy of technology reading group this term and we keep going in circles about whether artifacts have politics — and by that I don't mean whether their designers had politics, or whether people happen to use them for political ends, but whether the thing itself can be political in the way the classic case is supposed to show: a parkway built with overpasses too low for buses to pass under, so that people without cars (in the version I was told, mostly poor and mostly Black beachgoers) simply can't reach the beach. My roommate, who builds warehouse robots, says that's obviously just a story about the intentions of whoever built the road plus the transit system around it, and the concrete is innocent; I think there's something to the idea that a design can carry authority or coercion in it even once the intentions have faded, but I can't say what, and apparently historians now argue about whether the low-bridge story is even true as told — which is part of why I'd rather have criteria than a verdict.

  So before we read any more of this literature, I want the spec: what does an account of the politics of artifacts have to deliver to be worth taking seriously? The list of things such a theory has to handle, with the case behind each, and your view on which are genuine desiderata and which are just the hobbyhorses of one camp (my supervisor, for instance, insists that any adequate account must be able to say whether a given artifact is unjust, not merely political — is that a requirement or a prejudice?). Cases I want covered: the overpasses, where both the intent and the facts are contested; machines whose political effects nobody chose and nobody can now undo, like a harvesting machine that dissolved an entire class of farm jobs, or a file format everyone adopted and that it's now ruinously expensive to leave — I've started calling these ratchets, where the politics seems to live in an asymmetry: cheap to adopt, expensive to reverse, and nobody ever signed off on the asymmetry; the same artifact used for opposite political purposes by two different groups, like an encrypted messenger used by dissidents in one country and by a cartel in another; technologies that seem to require a political arrangement in a strong sense, of the sort people gesture at when they say you can't have nuclear weapons without a centralized secretive state, versus ones that look flexible all the way down; and the boring case — the brick, the bridge with normal clearance, the paperclip — because whatever the account is, it shouldn't end up calling literally every object political, or it has said nothing.

  Two more things I want flagged. First, the distinctions people keep collapsing, and which of those collapses are fatal: having a politics versus having political effects, the politics of the artifact versus the politics of whoever makes, owns or regulates it, being political versus being inherently or essentially so, and whether the notion doing the work is coercion, authority, or mere differential advantage. Second, if some subset of your desiderata can't be satisfied together — it looks to me like handling unintended structural politics pushes toward saying almost everything has a politics, which is exactly the overgeneration I want to block — say so, and say which single requirement does the most work in excluding candidate theories. Give me exactly eight numbered items, no intro and no closing: items 1 through 7 are the desiderata, each a sentence or two with the motivating case and a note on whether it's non-negotiable or a preference of one camp; item 8 is the pair you think can't be jointly met, plus the one requirement that knocks out the most theories. Don't bother scoring anyone's actual theory against the list, we'll do that ourselves in the group.
reasoning: |-
  Okay, the user is part of a philosophy of technology reading group and they're stuck on whether artifacts have politics. They want a set of criteria (a "spec") for evaluating theories about this. They provided several cases they want covered: the low overpasses, job-displacing machines, locked-in file formats, dual-use technologies like encrypted messengers, technologies requiring specific political structures like nuclear weapons, and neutral artifacts like bricks. They also want distinctions flagged, like politics vs. political effects, and whether an artifact is inherently political.

  First, I need to extract all their requirements. They mentioned contested intent cases like the overpasses, unintended consequences like harvesting machines, path dependencies like file formats, dual-use technologies, necessary political structures, and the need to avoid overgeneralization. Plus, they want clarity on key distinctions and any conflicting desiderata.

  The user is probably frustrated with the circular debates and wants a structured framework. They might be looking for a way to critically assess different theories without bias. Their deeper need is to move beyond anecdotes to a rigorous analytical tool. The roommate's argument about concrete being innocent represents one side, while their supervisor's demand for injustice judgments adds complexity. Balancing these perspectives is key.

  For the eight items: seven desiderata and one conflict pair. Each item must include the case and note if it's non-negotiable or a camp preference. The conflict in item 8 should highlight the tension between unintended politics leading to overgeneralization and the need to exclude neutral artifacts.

  Desideratum 1 should handle contested intent, like the overpasses, without relying on designer intent. This seems non-negotiable. Desideratum 2 covers unintended structural effects like job-displacing machines, also non-negotiable. Desideratum 3 is about path dependency, like file formats, emphasizing irreversible adoption. Again, non-negotiable. Desideratum 4 deals with dual-use cases, e.g., encrypted messengers used by both dissidents and cartels. This tests if politics depend on use rather than design. Non-negotiable.

  Desideratum 5 addresses necessary political structures, like nuclear weapons requiring a centralized state. The user wants to know if some tech inherently demands certain politics. Here, the supervisor's push for injustice judgments might be a camp preference. Desideratum 6 is critical: excluding neutral artifacts like bricks to avoid overgeneralization. Definitely non-negotiable. Desideratum 7 clarifies key distinctions (e.g., politics vs. political effects) without collapsing them. Non-negotiable.

  The conflict in item 8 is between desideratum 2 (unintended structural politics) and desideratum 6 (excluding neutral artifacts). Resisting overgeneralization is the key requirement that challenges theories. The harvesting machine case pushes theories toward seeing politics everywhere, but the brick case requires exclusion. This tension is central, and desideratum 6 is the stricter requirement that filters out weaker theories.
answer: |-
  1. **Handle contested intent and contested facts (e.g., the low overpasses):** The account must explain how an artifact could embody politics even if designer intent is ambiguous/disputed *and* historical facts are uncertain. *Non-negotiable* – core to the autonomy question.  
  2. **Address unintended, irreversible structural effects (e.g., the harvesting machine "ratchet"):** It must account for political consequences (like class dissolution) that arise from the artifact's function/systematic use, were not chosen by any agent, and become entrenched. *Non-negotiable* – tests structural embeddedness.  
  3. **Explain path-dependent lock-in ("ratchets" like file formats):** The theory must capture how artifacts create political asymmetries (cheap adoption, costly reversal) through network effects or dependency, independent of initial intent. *Non-negotiable* – highlights systemic, emergent politics.  
  4. **Accommodate dual-use/contextual valence (e.g., encrypted messenger):** It must allow the *same* artifact to facilitate opposing political ends (dissident vs. cartel) without negating its inherent political properties or reducing politics solely to use. *Non-negotiable* – challenges essentialism vs. neutrality.  
  5. **Distinguish contingent from necessary political requirements (e.g., nuclear weapons):** It must differentiate artifacts that *strongly necessitate* specific political arrangements (centralized state for nukes) from those merely compatible with many. *Preference (supervisor's camp)* – pushes toward normative claims like injustice.  
  6. **Exclude neutral artifacts ("the brick"):** The account must *not* imply all artifacts are political; it must provide criteria to identify genuinely non-political artifacts, preventing vacuous overgeneralization. *Non-negotiable* – critical for meaningful distinction.  
  7. **Preserve key distinctions (politics vs. effects, artifact vs. agents):** It must rigorously maintain separations like having politics vs. causing political effects, and avoid collapsing the artifact's politics into that of its creators/owners/regulators. *Non-negotiable* – foundational to the inquiry.  
  8. **Conflict: Desideratum 2 (unintended structural politics) pushes toward overgeneration, conflicting directly with Desideratum 6 (excluding neutral artifacts).** Resisting vacuous overgeneralization (Desideratum 6) is the requirement that excludes the most candidate theories by demanding clear boundaries.
