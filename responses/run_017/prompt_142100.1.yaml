prompt: |-
  Grading a batch of exam answers and I'd like a second read on this one.

  The question:

  Q. A Buddhist consequentialist holds that an act is right iff its total consequences are at least as good as those of the alternatives, where the consequences include both (i) outward consequences, i.e. effects on the welfare of sentient beings, and (ii) inward consequences, i.e. the act's karmic fruit: its effects on the agent's own future dispositions, whether greed, hatred and delusion get strengthened or weakened, which then cause further effects downstream. Assume, with the tradition, that karma is a matter of intention: the fruit an act bears is fixed by the intention it is done with. Call a theory self-effacing when the best consequences are produced by agents who do not act on it, who neither calculate totals nor aim at their own karmic fruit (aiming at the fruit, plausibly, corrupts the intention and so worsens it).

  (a) Objection: if the fruit is fixed by the intention, then ranking acts by their fruit is just ranking them by intention, so adding karmic fruit to the consequence set collapses Buddhist consequentialism into a pure ethics of motives. Is the objection right?
  (b) If Buddhist consequentialism is self-effacing, is that a problem for the theory, and if so what kind of problem?

  The student's answer:

  (a) The objection is right, and it shows that calling this view consequentialist is a mistake. If the karmic fruit of an act is fixed by the intention it is done with, then the act with the best consequences just is the act done with the best intention, so consequences do no independent work and rightness is settled by the motive. And where the two come apart the tradition sides with the motive anyway: an act done from genuine compassion that happens to have poor outward effects is still karmically good. So this is an ethics of motives, and the consequentialist apparatus is decorative.

  (b) Self-effacement is worse than it looks. If trying to produce the best consequences itself makes the consequences worse, the theory is self-defeating: it tells you to maximize and then tells you that maximizing fails. A theory that instructs you not to use it cannot be a theory of right action; at best it is advice about what not to think about. Buddhist consequentialism therefore collapses into a kind of quietism, and we would do better to read the tradition as a virtue ethics concerned with character rather than with consequences.

  No-self points the same way. If there is no persisting agent, then whoever receives the karmic fruit is not the person who acted, so inward consequences are really just outward consequences for someone else and the distinction between (i) and (ii) does no work. Buddhist consequentialism must therefore be strictly agent-neutral: no special weight on your own cultivation, and no reason to work on your own character rather than a stranger's.

  Give it a mark out of 20, plus the actual margin comments you would write: what is right, where the step does not follow, what is missing. No need for a rubric, just your read of it.
reasoning: |-
  Okay, the user wants me to grade a student's answer to a philosophy exam question about Buddhist consequentialism. Let me understand the question first. The question has two parts: (a) addresses an objection that adding karmic fruit collapses consequentialism into an ethics of motives, and (b) asks whether self-effacement is a problem for the theory.

  Looking at the student's answer for part (a): They agree with the objection, arguing that consequences become redundant because karmic fruit depends solely on intention. They also claim that when intentions and consequences conflict, tradition prioritizes motives. The student concludes that this makes it an ethics of motives with decorative consequentialist elements.

  Hmm, the student makes a good point about intention determining karmic fruit, but they're missing something important. Karmic fruit is just one part of the consequences; outward effects on others' welfare still matter. The theory combines both, so it's not purely motive-based. The student also overlooks that different motives could lead to the same intention but different karmic outcomes—wait, no, the question states karma depends on intention, not motives. Motives and intentions might be conflated here. Need to point that out.

  For part (b): The student argues that self-effacement makes the theory self-defeating and collapses into quietism. They also bring in the no-self doctrine to say inward consequences are just outward effects on others, eliminating any distinction.

  The self-defeating point has merit, but calling it "not a theory of right action" is too strong—it can still define rightness even if not guiding action directly. The quietism conclusion ignores indirect strategies like cultivating virtue. The no-self argument is interesting but problematic. Karmic effects still impact the continuum of consciousness linked to the agent, so personal cultivation matters. The student's agent-neutral conclusion doesn't hold.

  The user probably wants a fair assessment that highlights strengths and gaps. The student shows understanding but overstates collapse in (a) and misses nuances in (b). They brought in no-self creatively, though incorrectly applied. I should acknowledge their insight while correcting misconceptions. Also, the mark should reflect solid analysis with room for improvement—maybe 15/20? Points off for omissions and overstatements but credit for engagement and critical thinking.
answer: |-
  Here's a graded assessment and margin comments for the student's answer. The answer demonstrates strong critical engagement but makes some significant overstatements and omissions.

  **Mark: 15/20**

  **Margin Comments:**

  **(a) Section:**
  *   **"The objection is right..."**: Partially correct, but overstated. You correctly identify the *link* between intention and karmic fruit. However, concluding this *collapses* the theory into pure motive ethics misses key nuances.
  *   **"consequences do no independent work..."**: This is the crucial error. Outward consequences (effects on *others'* welfare) *are still part of the total consequence set* and do independent work. An act with a pure intention could have disastrous outward effects, lowering its *total* consequence score. The theory isn't *only* ranking by intention; it's ranking by intention *plus* the act's external effects. The karmic fruit is consequence (ii), added *to* consequence (i).
  *   **"where the two come apart the tradition sides with the motive anyway..."**: This observation is strong and relevant. It highlights a tension within the tradition that supports the objection's *direction*. However, the *theory as defined* still requires aggregating *both* (i) and (ii). The tradition's *practice* might prioritize motive in cases of conflict, but the *formal theory* described still includes outward consequences in the rightness condition.
  *   **"So this is an ethics of motives..."**: This conclusion is too strong based on the above points. While intention plays a dual role (partly *defining* karmic fruit and being valued traditionally), the *theory* explicitly incorporates *external welfare effects* as a separate, necessary component for determining rightness. It's a hybrid, not a collapse.
  *   **Missing Nuance:** You don't address the possibility that different *motives* could underlie the *same* intention (e.g., helping someone out of duty vs. out of genuine love, both intending to help), which *might* affect karmic fruit (if motive is part of intention's quality). The objection hinges partly on this potential ambiguity.

  **(b) Section:**
  *   **"Self-effacement is worse than it looks..."**: Good recognition of the deeper problem.
  *   **"it tells you to maximize and then tells you that maximizing fails. A theory that instructs you not to use it cannot be a theory of right action..."**: This captures the core paradox of self-effacement well. The "cannot be a theory of right action" is a bit strong (it can still *define* rightness), but it rightly points out the practical guidance problem. This is a valid and significant criticism.
  *   **"collapses into a kind of quietism... read the tradition as a virtue ethics..."**: The "quietism" label is apt for the practical implication *if direct calculation is the only option*. However, you miss a key response: the theory can *indirectly* guide action through cultivating *virtues/dispositions* (compassion, wisdom) that reliably *lead* to good consequences *without* direct calculation. This is a common consequentialist move to handle self-effacement and aligns perfectly with developing good "inward consequences." Your suggestion of virtue ethics is insightful, but the theory can *accommodate* this within its consequentialist framework ("virtue consequentialism").
  *   **No-Self Argument ("If there is no persisting agent...")**: This is a creative and philosophically interesting extension! It shows deep engagement.
      *   **"inward consequences are really just outward consequences for someone else"**: This is a bold and plausible interpretation of no-self/anattā applied to karma. It logically challenges the distinctness of (i) and (ii).
      *   **"no special weight on your own cultivation... strictly agent-neutral"**: This conclusion *follows logically* from your no-self premise. If the "future recipient" of the karmic fruit is essentially a different person, then one has no more reason to cultivate *their own* future dispositions than anyone else's. This would radically alter the theory, emphasizing only outward consequences for all sentient beings equally.
  *   **Problem with No-Self Argument:** While logically consistent *if* one takes an extreme "no-identity-over-time" view, it arguably misunderstands the Buddhist *pragmatic* view of karma. The karmic continuum, even without a permanent self, is *causally linked to the present intention*. Cultivating *this* continuum's dispositions is seen as the most direct/effective way to reduce suffering *in general* (because "you" are the locus of change available now). The tradition *does* place special emphasis on one's own cultivation *precisely because* of this causal connection and locus of control. Your argument is powerful but likely overstates the implications based on a specific interpretation of no-self that the tradition might not fully endorse in practice.

  **Overall:** A very strong, critical, and philosophically engaged answer that demonstrates excellent understanding of the core issues and the tradition. You clearly grasp self-effacement and the intention/karma link. The main weaknesses are: 1) Overstating the "collapse" in (a) by neglecting the independent role of outward consequences, 2) Not considering the *indirect* strategy for handling self-effacement through virtue cultivation in (b), and 3) Pushing the no-self implication perhaps further than the tradition would (though it's a brilliant point). The no-self extension is sophisticated but slightly tangential to the core self-effacement question. **15/20: High quality with significant insights, but some key omissions and overstatements prevent full marks.**
