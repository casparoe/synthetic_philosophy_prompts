prompt: |-
  ok so we're doing a unit on death and the afterlife in my world philosophy elective and my teacher (who writes all our handouts himself, there's no real textbook) gave us one on this old chinese guy Zhuangzi and I can't tell how much of it to trust. The handout says basically this:

  when Zhuangzi's wife died his freind showed up to do the condolences thing and found him sitting there with his legs sprawled out, banging on a tub and singing, and when the freind said that was shameful Zhuangzi said she had just changed from one form into another, the way summer turns into autumn, so nothing was really lost. His actual view is supposed to be that everything is part of one big ongoing process of change, a person is just a temporary knot in that process, and the stuff that makes you up keeps going in a new form after you die, so death is nothing to be scared of and grieving is just failing to understand how change works -- the reason people cry at funerals is that they haven't realized yet that nothing gets destroyed. It also brings up the story where he dreams he's a butterfly and wakes up not knowing if he's a man who dreamed he was a butterfly or a butterfly dreaming he's a man, and uses that to say maybe being alive is the dream and dying is waking up. And then it says he's kind of a Stoic, or really more like a Buddhist a few centuries early, and the practical point is that the wise person is totally indifferent to death and doesn't mourn.

  The bit about not mourning bugs me, because my teacher said in class that in the story Zhuangzi does grieve at first and then stops, which sounds different from saying grief is just confusion. Also my friend who's taking the same class says Zhuangzi isn't making an argument at all, he's just showing what a person who gets it is like, and I honestly can't tell if that's a real point or a way of dodging the question. And he kep comparing him to Epicurus (we did Epicurus last month, the death is nothing to us thing) and that feels too easy to me.

  Can someone go through the handout and tell me which parts someone who actually studies this stuff would accept, which are just simplifications you'd write for highschoolers, and which are actually wrong? Like, does his view need the person to keep existing in some form after death, or is the more accurate version that there was never a separate person to begin with? Is the butterfly thing really about dying being a waking up? Is the Stoic/Buddhist comparison fair or is it mushing together things that are doing different work? And does the handout's takeaway -- that we shouldn't mourn -- actually survive once you fix the parts that are wrong, or does it not follow even from the good version? I read threw it twice and I still can't tell where the errors are, I just have a feeling there's at least one.
