prompt: |-
  My brother went down a conspiracist rabbit hole about three years ago and barely talks to anyone in the family now, so I've ended up reading way more about echo chambers than I ever meant to. Next week I'm giving a 20-minute talk to our county library system's adult-programming staff — they run the information-literacy sessions and they're committed to the line that anyone can learn to find reliable sources — plus the two high-school civics teachers who partner with them (they want something they can actually do with 120 students in a semester and somehow tell whether it worked), plus one county commissioner who thinks media literacy is a euphemism for telling people what to think.

  My thesis: the failure isn't a gap in what people are exposed to. In an epistemic bubble you're missing the other side's evidence; in an echo chamber you've heard it and you've been taught to distrust whoever says it. Those are different failure modes and they point to opposite interventions, so exposure-based fixes — feeds with more cross-cutting content, source-checking drills — can actively make things worse. The variable I want to put on the table instead is what I'm calling testimonial surface area: the range of social roles a person would actually accept a correction from — the coworker, the brother-in-law who votes the other way, the nurse, the guy at the dive shop. More content arriving from a discredited source isn't a correction, it's one more data point that the outside is lying to you.

  Draft my Q&A prep: the seven-ish objections I'll really get from this room, ordered by how much damage they'd do, phrased the way each of them would actually say it. Give me a table with the columns: Who (librarian / civics teacher / commissioner) | Objection in their own words | Damage (H/M/L) | My two-minute reply | Where my reply is softest. Include the question I'm hoping nobody asks — I suspect it's something like isn't this just a story about your brother being lonely — and don't let me off easy on that one.
reasoning: |-
  Okay, the user is preparing for a 20-minute talk on echo chambers and wants help drafting Q&A prep. They've clearly done deep research into this topic, likely driven by personal pain over their brother's conspiracist descent. Their core insight is brilliant - distinguishing epistemic bubbles (missing information) from echo chambers (active distrust) and proposing "testimonial surface area" as the key variable.

  Hmm, the audience mix is tricky - librarians focused on information literacy, civics teachers needing scalable classroom solutions, and a skeptical commissioner. Each will have different concerns. The librarians might resist anything questioning source-checking drills, teachers will panic about assessing 120 students, and the commissioner will smell bias.

  I notice the user's framing is academically solid but risks sounding cold about their brother's situation. That personal angle is their biggest vulnerability but also their secret weapon - if they can reference it without oversharing, it adds authenticity. The "hoped nobody asks" question about loneliness is spot-on; it cuts to the emotional core they're avoiding.

  For the objections table, I should mirror their damage-rating approach but push harder on implementation. The commissioner's "telling people what to think" objection is highest damage - it could derail everything if not handled right. Teachers' scalability concerns are medium damage but high frequency. Librarians might actually be allies if positioned right; their commitment to reliable sources isn't the enemy here.

  The reply soft spots worry me. Their concept requires social intervention but they're speaking to educators with limited reach. I'll force them to admit librarians can't rebuild someone's social network. That's uncomfortable but necessary - better they say it than the audience.

  Most importantly, their brother's story must be addressed head-on in that feared question. Not as weakness, but as why this matters. I'll craft that reply to pivot from pain to purpose: "Yes he was lonely, and that isolation was the fertilizer where distrust grew." That turns vulnerability into argument strength.
