prompt: |-
  At the reading group I run on cooperation among autonomous AI systems, a colleague argued last week for an identification I now have to answer in writing. Her claim: superrationality — the proposal associated with Hofstadter, that an agent facing a symmetric problem should include in its own calculation the fact that every other superrational agent facing that problem will arrive at the same answer, and should choose by maximizing payoff subject to that sameness constraint — is nothing other than Kant's categorical imperative in game-theoretic costume. She drew two conclusions from the identification. First, that if we build agentic systems that deliberate in this way, we get moral constraints for free in the multi-agent case, without having to solve value alignment as a separate problem. Second, that defection in a one-shot Prisoner's Dilemma is not merely unfortunate but irrational, and that this is the same fact as the wrongness of the false promise. The reply will be read by decision and game theorists who have never opened the Groundwork and by Kantians who have never worked through a payoff matrix, and it has to be legible to both while granting the resemblance enough credit not to be dismissible as a refusal to see it.

  What I want from you is an audit, not a verdict. Give me the correspondence explicitly — what plays the role of the maxim, of the universal law, of the test for contradiction in conception and of the distinct test for contradiction in the will, of the agent as legislating member of a kingdom of ends, of rationality, of the other agents, and of non-compliance — and then take it apart. In particular, I want the following stress points addressed in the order that makes them bite, not as a list of unrelated objections:

  The verdict of superrationality is fixed by a payoff matrix and flips when the payoffs are reordered; the verdict of the formula of universal law does not. If the cooperative answer is coming from the numbers, the moral content was never in the decision rule, and the for-free claim looks like it has relocated Kantian concern into the payoffs where no one has to argue for it.

  Superrationality is defined against a population of superrational agents; against a merely game-theoretically rational opponent it recommends defecting, and the standard extension to partial take-up makes cooperation conditional on a payoff-dependent threshold share. Kantian universalization has no such parameter: one wills the universal law while knowing full well that others will not comply. Say where the threshold sits on the Kantian side of the mapping, or say plainly that the mapping has nowhere to put it and therefore holds only under full take-up.

  The case I actually care about sits between the two. Take two agents fine-tuned from a shared base model but deployed with different inputs and objectives, so that their decision procedures return the same output with probability lambda strictly between zero and one — partial correlation rather than perfect sameness or independence. Tell me what the analogy recommends as lambda falls, whether lambda corresponds to anything at all on the Kantian side, and whether the fact that superrationality's recommendation degrades continuously while the moral verdict does not is evidence that the identification was always about the correlation rather than about the constraint.

  Superrationality is at home in symmetric games, and there is no settled extension of it to asymmetric ones; the categorical imperative is meant to test maxims quite generally, including maxims about oneself and maxims with no strategic structure at all. Say how much of morality the analogy can even reach.

  Then name what the analogy quietly imports: that the relevant all in universal law means all agents who reason as I do, which in the AI case is a moral community of structurally similar systems rather than of persons; and that universalization is a side-constraint on permissibility, whereas superrationality is a recommendation from maximization, so that the two have opposite directions of fit and one of them cannot generate what the other one is.

  Close by separating the disanalogies that are load-bearing for her two conclusions from the ones that are merely awkward, telling me whether either conclusion survives and whether the weaker version of the second one can be rescued, naming the single case that flatters the analogy most and the single case that kills it so that I can put one of each in front of the room, stating what further premise she would need for the identification to actually earn what she derives from it, and proposing a better analogy if there is one — a different comparison that carries whatever true part of her claim survives. Do not give me readings.
reasoning: |-
  Hmm, I need to help this user audit the claim that superrationality is equivalent to Kant's categorical imperative. The user runs a reading group on AI cooperation and needs to respond to a colleague's argument. They want me to map the correspondence between the concepts, then dissect the stress points, and finally evaluate whether the colleague's conclusions hold.

  First, let's map the correspondence. Superrationality, from Hofstadter, involves agents in symmetric problems assuming identical reasoning and maximizing payoff under that constraint. Kant's categorical imperative (CI) tests maxims by universalization. So, the maxim in CI corresponds to the strategy choice in the game. The universal law test is like the symmetry assumption in superrationality - both involve imagining everyone acting the same way. The contradiction tests in CI might map to payoff maximization under that assumption. The kingdom of ends could be the set of superrational agents. Rationality is defined differently: instrumental in game theory vs. autonomous in Kant. Other agents are similarly superrational in this framework, while non-compliance isn't considered.

  Now the stress points. The first big issue is that superrationality depends entirely on payoff matrices. If payoffs change, the "moral" behavior flips. But Kant's CI gives consistent verdicts regardless of payoffs. This suggests the moral content isn't in the decision rule but in the payoffs, undermining the claim that we get morality for free.

  Second, superrationality only works with full take-up of identical reasoning. Against a standard rational opponent, it recommends defection. Kant, however, applies even when others don't comply. The CI has no threshold - you universalize knowing others might not follow. The mapping can't account for partial take-up; it only holds under perfect symmetry.

  The user's key case involves partially correlated agents (probability lambda). As lambda decreases, superrationality's cooperation recommendation weakens continuously. But Kant's moral verdict is binary - lying is wrong regardless of how many others lie. This discontinuity suggests the identification was about correlation, not moral constraint.

  Third, superrationality is limited to symmetric games, while CI applies universally, including non-strategic contexts. This restricts how much morality the analogy can cover - only symmetric interactions, not personal maxims.

  Finally, the analogy imports unstated assumptions. It redefines "all" in universal law to mean "all agents like me," creating an in-group morality. Also, CI is a constraint (action-to-world direction of fit), while superrationality is about maximization (world-to-action) - they have opposite directions, so one can't generate the other's outputs.

  Now for the conclusions. The first claim - getting morality for free - fails because the "morality" comes from payoffs, not the rule. The second claim - defection as irrational/wrong - only holds under full symmetry. In the Prisoner's Dilemma with standard agents, defection is rational. Kant would condemn the false promise regardless.

  The best case for the analogy is a symmetric PD with identical superrational agents. The killer case is an asymmetric game or a PD with non-identical agents where superrationality recommends defection but Kant still forbids the maxim.

  To rescue a weaker version of the second conclusion, she'd need to add that identical reasoning is a moral requirement. A better analogy might be contractualism, where principles are chosen for general acceptance.

  I'll structure the audit clearly: first the mapping, then the stress points in logical order, then the conclusion evaluation - making sure it's accessible to both game theorists and Kantians.
answer: |-
  Here is an audit of the identification between superrationality and Kant's categorical imperative (CI), structured as requested. The correspondence is mapped explicitly, then stress-tested point-by-point in cascading order, concluding with an assessment of the claims and a proposed alternative.

  ### Explicit Correspondence
  - **Maxim**: The agent's proposed strategy (e.g., "I will cooperate/defect").
  - **Universal Law**: The state where *all identically reasoning agents* adopt the same strategy.
  - **Contradiction in Conception Test**: Checking if the outcome under universal adoption yields a *payoff-dominant equilibrium* (e.g., mutual cooperation in PD dominates mutual defection). If not, the strategy is "irrational" (inconsistent with symmetry).
  - **Contradiction in the Will Test**: Not cleanly mapped. Superrationality lacks a direct analog to Kant's test for whether universalization destroys rational agency itself (e.g., undermining trust needed for promises).
  - **Agent as Legislating Member of a Kingdom of Ends**: The superrational agent as part of a symmetric population of identical reasoners, jointly "legislating" the outcome by their shared decision rule.
  - **Rationality**: Instrumental rationality constrained by symmetry (Hofstadter) vs. autonomy bound by universal law (Kant).
  - **Other Agents**: Only other *superrational* agents (those using identical reasoning under symmetry).
  - **Non-Compliance**: Not modeled; superrationality assumes full compliance with identical reasoning.

  ### Stress-Testing the Analogy (in Logical Order)
  1. **Payoff-Dependence vs. Moral Absolutism**  
     Superrationality’s verdict depends entirely on the payoff matrix. In PD, it prescribes cooperation because (C,C) > (D,D). But if payoffs change (e.g., (D,D) > (C,C) in a "sucker’s game"), it prescribes defection. Kant’s CI, however, condemns false promises *regardless* of payoffs.  
     **Bite**: The "morality for free" claim fails. If cooperation is contingent on payoffs, the moral content resides in the matrix (e.g., designers embedding cooperation as optimal), not in the decision rule. CI’s constraint is payoff-invariant.

  2. **Full Take-Up Assumption vs. Unconditional Duty**  
     Superrationality *requires* identical reasoning across all agents. Against a game-theoretically rational (non-superrational) opponent, it collapses to defection in PD. Threshold models (e.g., cooperate if expected take-up > *k*, where *k* depends on payoffs) further condition cooperation on empirical estimates. Kantian universalization is unconditional: one must will the maxim *as universal law* even if others violate it (e.g., keeping promises despite expecting dishonesty).  
     **Bite**: The analogy has no Kantian slot for a "threshold." CI operates in a noumenal realm of rational willing; superrationality is a phenomenal strategy for a specific population. The mapping holds only under perfect symmetry—precisely where Kant’s CI is least distinctive.

  3. **Partial Correlation (λ) and Moral Discontinuity**  
     With probabilistic strategy alignment (λ < 1), superrationality degrades: cooperation is recommended only if λ exceeds a payoff-dependent threshold. As λ → 0, it converges to standard game theory (defect). Kant’s CI, however, yields a binary verdict: a maxim like "lie when convenient" is impermissible *regardless* of others’ behavior (λ is irrelevant).  
     **Bite**: This exposes superrationality’s core as *strategic coordination under uncertainty*, not deontology. The discontinuity (CI’s verdict is rigid; superrationality’s is fluid) proves the analogy confuses empirical correlation with normative constraint.

  4. **Domain Restriction: Symmetry vs. Generality**  
     Superrationality applies only to symmetric games with identical agents. CI tests *any* maxim—e.g., "neglect my talents" (non-strategic) or "exploit asymmetries of power."  
     **Bite**: The analogy captures a sliver of morality (symmetric interactions) while ignoring Kant’s focus on individual maxims and asymmetric duties (e.g., to the vulnerable).

  5. **Quiet Imports**  
     - **Redefined "All"**: Superrationality’s "universal" law applies only to *structurally identical agents*. This replaces Kant’s kingdom of ends (all rational beings) with a community of similar systems—a moral boundary alien to Kant.  
     - **Direction of Fit**: Superrationality *maximizes* payoffs (world-to-mind: outcomes justify action). CI is a *side-constraint* (mind-to-world: actions must align with principle). One cannot "maximize" into morality; constraints restrict maximization.  

  ### Conclusion: What Survives?
  **Her First Conclusion (Morality for Free)**: **Fails.** Superrationality’s "cooperation" is payoff-dependent and population-relative. It cannot generate categorical duties—only instrumentally optimal coordination. Value alignment remains unsolved.

  **Her Second Conclusion (Defection as Irrational/Wrong)**: **Fails** in generality. It holds *only* in symmetric PD among superrational agents. In all other cases (non-identical agents, asymmetric payoffs, low λ), superrationality permits or mandates defection. Kant condemns false promises universally.  
  - **Weaker Rescue**: Defection is "irrational" *only if* identical reasoning is assumed—but this is a technical axiom, not a moral fact. No equivalent to the "false promise" wrongness (which hinges on undermining rationality itself) exists.

  **Best and Worst Cases for the Analogy**  
  - **Flatters**: One-shot PD with identical superrational agents. Both prescribe cooperation; CI’s universalization resembles symmetry.  
  - **Kills**: A Kantian maxim like "give to charity only if others do." Superrationality might approve if λ is high; CI forbids it (duty is unconditional).  

  **Missing Premise**: She needs: *"Identical reasoning under symmetry is a moral requirement, not just a coordination tool."* Without this, superrationality lacks normative force.

  **Better Analogy**: **Contractualism** (e.g., Scanlon). Agents choose principles *all could reasonably accept*. Like superrationality, it is procedure-based and multi-agent, but:  
  - Explains why cooperation isn’t payoff-dependent (principles must be justifiable).  
  - Accommodates partial compliance (what we owe to non-compliers).  
  - Extends to asymmetric cases (generalizable reasons).  
  - Retains the "for free" hope: agents constrained by mutual justifiability might align values.  

  This audit grants the resemblance (both use universalization-like steps) but shows the identification is structural mimicry, not moral equivalence. The stress points reveal superrationality as a tool for coordination among clones—not a foundation for ethics.
