  (d) Mimic: No disposition, but M happens anyway. Attacks sufficiency because tablet breaks in solvent (so conditional true) but isn't soluble.
  (e) Finkish mask: Disposition remains, but manifestation blocked only when triggered. Attacks necessity - like a mask activated by C itself.

