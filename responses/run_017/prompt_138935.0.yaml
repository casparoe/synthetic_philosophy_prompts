  (e) Finkish mask comes next: it attacks necessity like finks, but with the added twist that the disposition isn't lost - making it harder to handle than plain finks if we try to modify SCA with "retains disposition" clauses.

  (b) One-shot fink: Attacks necessity, but the irreversibility might be seen as a quirk rather than a fundamental flaw. Still, it shows SCA fails even for single-track dispositions.

