  (a) Plain fink: The original counterexample. Damaging but so well-known that fixes have been proposed (e.g., Martin's finkishness papers).

  User's suspicion about (d) is spot-on - mimics undermine the very link between conditionals and dispositions by allowing extrinsic reasons for manifestation.

