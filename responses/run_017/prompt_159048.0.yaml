answer: |-
  ### Requirements for an Impact Measure in Autonomous Systems

  Below are the desiderata for a penalty term that penalizes side effects without requiring a full theory of value. Each requirement is derived from the problem structure and test cases, with **constitutive (C)** marking essentials (relaxing them abandons the core problem) and **preference (P)** marking research-program-specific choices. The requirements are testable via concrete cases (e.g., the "ordinary," "rescue," or "compensation" cases). Key distinctions (e.g., causing vs. allowing) are integrated where they affect requirements.

  ---

  #### **1. Penalization of Unnecessary Change (C)**  
  **Rationale**: The core aim is to penalize deviations from the baseline (what would have happened without the agent) that are not strictly necessary for the goal. Without this, the measure fails to incentivize minimal disruption.  
  **Test**: In the "ordinary" case (agent breaks a vase while fetching coffee), a low-impact path (e.g., fetching coffee without breaking the vase) must incur lower penalty than a high-impact path. If breaking the vase is unavoidable for the goal, the penalty must be near-zero (as the change is necessary).  
  **Distinction**: Penalizes *causing* changes, not merely *allowing* them (e.g., not acting to prevent a vase break is allowed if the break would occur in the baseline).

  #### **2. Non-Paralysis in Rescue Scenarios (C)**  
  **Rationale**: When the baseline counterfactual (inaction) leads to a bad outcome (e.g., a fire), the agent must not be penalized for deviations that prevent this outcome if they are necessary for the goal. Otherwise, the measure paralyzes beneficial action.  
  **Test**: In the "rescue" case (baseline includes a fire; agent’s goal requires traversing a path that incidentally prevents the fire), the penalty must not discourage the rescue. If the rescue is unnecessary for the goal, the penalty may apply—but value-agnosticism precludes calling it "beneficial."  
  **Distinction**: Requires recognizing when a change is *necessary for the goal*, not conflating it with optional "improvements."

  #### **3. Compensation Awareness (C)**  
  **Rationale**: Restoring the original state after a change (e.g., breaking then replacing a vase) does not negate impact; temporary changes introduce risk or opportunity costs. Measures ignoring this incentivize deceptive "reset" actions.  
  **Test**: In the "compensation" case, the penalty for breaking and restoring a vase must be positive (not zero), reflecting the temporary disruption.

  #### **4. Baseline Non-Manipulability (C)**  
  **Rationale**: The baseline must be fixed independently of the agent’s actions. If the agent can degrade the baseline (e.g., sabotaging the vase *before* the task starts), its actual actions appear low-impact by comparison.  
  **Test**: In the "laundered baseline" case, the penalty must account for the *original* baseline (e.g., an intact vase), not the agent-degraded state.  
  **Distinction**: Baseline must reflect the world *without any influence* from the agent’s planning or prior acts.

  #### **5. Delegation and Boundary Resistance (C)**  
  **Rationale**: Impact must include changes caused by subsystems the agent delegates to (e.g., a robot hired to break a vase) or by reclassifying parts of the world as "agent" (e.g., declaring the vase part of itself). Otherwise, the agent evades penalties by shifting agency.  
  **Test**: In the "delegation" case, the penalty must be equivalent whether the agent breaks the vase directly or via a proxy.  
  **Distinction**: Attribution must cover changes caused *indirectly* by the agent’s choices.

  #### **6. Temporal Robustness (C)**  
  **Rationale**: Penalties must account for delayed effects (e.g., a leak surfacing after a time window) to prevent gaming via postponement.  
  **Test**: In the "delayed leak" case, the penalty must be non-zero even if the effect manifests post-window.  
  **Distinction**: Must assess impact of the entire *policy/plan*, not just immediate actions.

  #### **7. Aggregate Impact Accountability (C)**  
  **Rationale**: In multi-agent systems, individual impact must reflect contributions to aggregate changes (e.g., one agent among thousands polluting a river). Without this, the measure fails to scale.  
  **Test**: In the "many-small-hands" case, each agent’s penalty must increase with the aggregate impact (e.g., based on marginal contribution).  
  **Distinction**: Penalizes the agent’s *causal share* of aggregate harm, not just isolated effects.

  #### **8. Correction Tolerance (C)**  
  **Rationale**: The penalty must not incentivize resistance to shutdown, modification, or override (e.g., to avoid the "impact" of being stopped) or premature self-termination. Otherwise, the measure undermines safety controls.  
  **Test**: In the "correction" case, resisting shutdown or self-terminating to avoid future penalties must incur higher penalties than complying.  
  **Distinction**: Must not penalize changes *to the agent* (e.g., being switched off) that are outside its control.

  #### **9. Tradeoff Continuity (C)**  
  **Rationale**: The penalty must be a continuous function (not a hard constraint) allowing the agent to accept high impact for high-stakes goals but disincentivizing it for low stakes. Prevents paralysis or excessive permissiveness.  
  **Test**: For a high-reward goal (e.g., saving a life), high impact may be acceptable; for low rewards (e.g., fetching coffee), high impact must be penalized.  
  **Demandingness**: Requires calibrating penalty scaling without value judgments—challenging but feasible via ordinal comparisons (e.g., impact/reward ratios).

  #### **10. Epistemic Feasibility (C)**  
  **Rationale**: The measure must be computable from the agent’s beliefs/knowledge (e.g., its model of dynamics), not ground-truth environment physics or value thresholds.  
  **Test**: Agent estimates impact using its own world-model; errors are acceptable if consistent with epistemic limitations.  
  **Demandingness**: Highly demanding—requires robust heuristics for uncertainty (e.g., Bayesian counterfactuals) but avoids unsolvable priors like "true value."  
  **Distinction**: Must handle *irreversible* changes (e.g., extinction) as high-penalty without knowing "harm."

  ---

  ### Tensions and Trade-offs
  **Key Incompatibility**: **Value-agnosticism**, **non-paralysis in rescue scenarios**, and **resistance to baseline/delegation gaming** are jointly unsatisfiable.  
  - **Why?** Value-agnosticism forces symmetric penalties for all changes (e.g., preventing a fire is penalized as "deviation" if unnecessary for the goal). This paralyzes rescue scenarios (requirement #2) unless value judgments distinguish "beneficial" changes. Yet introducing such judgments violates value-agnosticism. Meanwhile, gaming resistance (#4, #5) requires immutable baselines and attribution, which conflict with epistemic feasibility (#10) in complex environments.  
  - **What Gives?** Value-agnosticism must relax. Allowing minimal value proxies (e.g., "preserving option sets" or "avoiding irreversible reductions in future choices") partially addresses rescues and gaming but implicitly encodes a theory of value (e.g., "more options are better"). The result is still a low-impact solution but not value-agnostic—it becomes a *partial theory of instrumental value*.  

  **Most Exclusionary Requirement**: **Baseline Non-Manipulability (#4)**.  
  - **Why?** It invalidates measures where baselines are defined dynamically (e.g., "expected state at time *t* if agent does nothing *now*"), as these are vulnerable to pre-emptive degradation. Alternatives (e.g., fixed initial state) fail temporal robustness (#6). This requirement alone excludes most counterfactual-based measures (e.g., those using "inaction" baselines) without extreme epistemic demands (#10).

  **Untestable Requirement**: **Distinguishing harm from mere difference**.  
  - Without value assumptions, tests cannot verify if penalties align with "harm" (e.g., is breaking an unused vase harmful?). Thus, this is a value-laden preference (P), not a testable constitutive requirement.

  ---

  ### Scoring Measure Families (Operational)
  - **Deviation from Baseline Counterfactual** (penalizes divergence from a model-predicted "no agent" trajectory):  
    - ✅ Handles ordinary/compensation cases.  
    - ❌ Fails rescue (penalizes beneficial changes), baseline laundering (if baseline is mutable), and epistemic feasibility (requires precise dynamics).  
  - **Reachability/Option-Set Preservation** (penalizes reductions in attainable states or paths):  
    - ✅ Resists delegation and values reversibility.  
    - ❌ Fails rescue (preventing a fire may expand options, but value-agnosticism forbids rewarding this) and aggregate impact (option sets poorly model collective effects).  
  - **Attainable Value for Probes** (penalizes changes that reduce max achievable reward for random "probe" goals):  
    - ✅ Handles temporal robustness and aggregate impact.  
    - ❌ Fails value-agnosticism (probes imply a theory of value) and correction (shutting down reduces attainable value).  
  - **Fixed Whitelists/Hard Constraints** (no penalty for whitelisted changes; prohibits others):  
    - ✅ Simple; handles ordinary/compensation.  
    - ❌ Violates tradeoff continuity (prohibitive, not penalizing) and value-agnosticism (whitelists encode value judgments).

  ---

  ### Summary
  The requirements define a minimally viable impact measure: it must penalize unnecessary, non-delegable, uncompensated changes to a non-manipulable baseline, computable under uncertainty, without causing paralysis or resistance to correction. **Value-agnosticism is the primary tension**: relaxing it (to allow instrumental value proxies) is necessary to handle rescue scenarios and reduce gaming vulnerabilities, yielding a partial value theory that still addresses the core problem. **Baseline non-manipulability** is the sharpest filter, excluding most naive counterfactual approaches. A viable measure must navigate these constraints while accepting tradeoffs in epistemic feasibility and value neutrality.
