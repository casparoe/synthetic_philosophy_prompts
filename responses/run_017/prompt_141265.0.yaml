prompt: |-
  Hi — I work at a smallish foundation (about £14m a year, four programme staff) and last year our trustees got excited about the idea of moral trade: the thing where two groups who disagree about what's actually good each do what the other wants, and both come out ahead by their own lights, more or less the way two countries trade when each is better at something. They've now made it a formal funding line — we put up money when two organisations with genuinely conflicting moral views each commit to doing something the other values that they wouldn't have done on their own — and I'm the one who has to turn that into something we can actually run.

  The problem is we now get three or four of these a month, I have roughly two days per proposal, and sign-off is a single meeting with a committee of four: me, a trustee who used to run a logistics company, and two programme officers with no philosophy background at all. Our trustees also require that any yes be explainable in one sentence to a journalist who is going to write it up as "foundation pays charity to do thing it thinks is worthless." And about half our money comes from a restricted gift whose donor died in 2019 and left a letter of wishes, which matters for one of the cases below.

  So I need a procedure, not an essay: ordered questions I can walk the committee through, what counts as a good enough answer to each one, the points where the answer is a hard no and we stop, and the points where the honest move is to stop and say this is a values call, and here is who makes it. Please be blunt about which steps are really judgment wearing a lab coat.

  Things it has to handle, because they've already bitten us:

  - The would-have-happened-anyway problem. Half the proposals are just two groups discovering they wanted the same thing, or one group announcing it will now do the thing we were about to fund anyway. I've started calling these coincidence deals and I need a test that kills them in the first ten minutes — including when we can't establish the counterfactual, because everyone lies about what they would have done.
  - The overbidding problem. Since I can only be paid in the other side's values, the other side has every reason to tell me they care about my thing far more than they do, so that I give them more. We have no way to audit what anyone actually values. What's the least-bad way to handle that — staging, matching, symmetric disclosure, third-party holds, something else — and when does the right answer become "we can't price this, so we cap the deal"?
  - Hostage deals. Twice now a group has come to us offering not to do something harmful it was going to do anyway — a campaign, a legal challenge, a regulatory complaint — if we fund its programme. Sometimes that reads to me as extortion with better manners, and sometimes the threatened harm is real, the people making the threat are sincere, and the deal would genuinely leave everyone better off by their own lights. I need the procedure to tell those apart, or to tell me plainly that it can't.
  - Dirty hands on their side. A couple of proposals require one party to do something that's fine by our lights but that they say they think is wrong, and they've agreed only because we're paying. My instinct is that this isn't a partner, it's a corrupted partner, and it will fall apart. I'd like that turned into a check rather than a vibe.
  - Who is actually trading. One case below involves an endowment whose mission was written by someone who's dead. Do we count the mission as a party to the trade? I keep going back and forth on whether a commitment that outlives the person who made it can be traded away by whoever is holding the pen now, and what it would even take for that to be legitimate rather than just convenient.

  Then please run it on three:

  1. A global-health charity (think animal suffering counts for little, wants to buy bed nets) and an animal-welfare charity (thinks bed nets are a rounding error next to farmed fish). Proposal: we fund each of them to run one year of the other's programme, matched pound for pound. On its face this is the cleanest thing we've seen.

  2. A well-funded advocacy organisation — call them the Alliance — that exists mostly to oppose a hospital expansion our health grantees want. They offer to withdraw their objection and not file suit if we fund a year of their community health worker programme. They say, and I half beleive them, that they would file and would probably win.

  3. The one I know I'm biased on, so be especially annoying about it: a religious hospital network in a country where we work will take on a full maternal-health service that we think is the best thing on offer in the region, but only if we fund a chaplaincy and end-of-life counselling programme that we think does nothing — some of us think it does less than nothing, that it talks people out of decisions that are theirs to make. As far as I can tell the theology behind the network's side of the deal is straightforwardly false, and I find parts of it grim. My instinct is to find a reason to say no. If the procedure says yes, I want to be told that clearly, along with what I'd have to put in the committee note and what the strongest version of my own objection actually is.

  Finally, tell me what the whole frame can't do: the cases where "go find a trade" is the wrong move and we should just be doing ordinary grantmaking, or politics, or nothing at all.
reasoning: |-
  Okay, let me try to unpack this user's problem. They work at a small foundation that's been tasked with implementing a "moral trade" funding initiative. The trustees are excited about the concept, but the practical execution is falling on the user, who has limited time and resources. They need a streamlined procedure to evaluate proposals efficiently, especially with a committee that lacks philosophical background.

  First, I need to understand the core challenges they're facing. The user listed specific problems: would-have-happened-anyway deals, overbidding, hostage situations, dirty hands, and issues around who is actually trading. Each of these needs a clear checkpoint in the procedure. 

  For the would-have-happened-anyway problem, the key is verifying that the actions are counterfactual. But since people might lie, how can they establish this without getting bogged down? Maybe requiring documented evidence of prior opposition or internal conflicts could help. But the user mentioned that everyone lies, so maybe a combination of public statements and financial audits?

  Overbidding is tricky because values are subjective. The user can't audit what groups truly value. The solution might involve capped matching funds or requiring third-party mediators to assess sincerity. But in practice, that might be too time-consuming. Maybe setting a standard cap per trade and allowing exceptions only with strong justification?

  Hostage deals feel like extortion. The user needs to distinguish between genuine threats and bluffing. Factors like the group's history of following through on threats and the credibility of their claim could be checkpoints. But if there's no way to verify, the procedure should flag it as too risky.

  Dirty hands—when a group does something they believe is wrong for money—could lead to implementation failure. The procedure should assess internal dissent or public backlash potential. If key stakeholders oppose the trade, it's probably a no-go.

  The endowment case is philosophical. Can a mission statement from a deceased donor be "traded"? Legally, the current trustees can decide, but ethically, it depends on the donor's original intent. The procedure might require legal verification of authority and a check against the donor's known wishes.

  Now, applying this to the three cases. The bed nets and animal welfare one seems clean, but I wonder if they'd have done it anyway. The user needs evidence of past refusal to collaborate. The hospital opposition group—are they credible? The user half-believes them. The procedure should require proof of their ability to win the lawsuit. The religious hospital case is tough. The user dislikes the chaplaincy program, but if the maternal health service is vital, maybe the trade is worth it? But the procedure must ensure the hospital isn't overbidding on their commitment.

  The user also needs to know when moral trade isn't the answer. If there's no mutual benefit, or one party is coerced, traditional grants or advocacy might be better. Also, if the trade involves fundamental rights violations, it's a no-go.

  I should structure the procedure as a step-by-step with clear yes/no checkpoints. For each problem, define a test with evidence requirements. Make it practical for a 2-day review. Emphasize where judgment is needed versus hard stops. Highlight the committee's role in values calls.

  Finally, the user wants bluntness about when steps are judgment disguised as objectivity. For example, assessing sincerity in hostage deals is inherently subjective. The procedure should acknowledge that and specify who decides—probably the trustee with logistics experience for credibility, and the user for ethical concerns.
answer: |-
  Here’s a procedural checklist designed for speed and defensibility. **Bold** = hard stop. *Italic* = values call (committee vote). Aim for 90 mins/proposal max. 

  ---

  ### **Moral Trade Evaluation Protocol (v1.0)**
  *Ordered steps. Stop if any **bold** criterion fails. Requires majority vote at *italic* steps.*

  1. **PARTIES CHECK**  
     - ✔️: Both parties are registered entities with public missions/values.  
     - ❌: One party is an individual, unregistered group, or has no verifiable track record.  
     - *Values call*: If mission drift (e.g., endowment trading against founder’s wishes). **Stop and vote here**.  
     *Output: "Org A trades with Org B under mission X vs Y."*

  2. **COINCIDENCE DEAL TEST** (Kills 50% in 10 mins)  
     - Demand **evidence of prior opposition**: Public statements, internal docs, past refusals to collaborate.  
     - **Reject** if:  
       - No conflict pre-dates proposal.  
       - Proposed action was already funded/planned (check budgets/board minutes).  
     - *Tiebreaker*: If evidence is weak but plausible, require **third-party testimony** (e.g., industry expert).  

  3. **HOSTAGE DEAL FLAG**  
     - ✔️: "We’ll do X (new good thing) if funded."  
     - ❗: "We won’t do Y (bad thing) if funded." → **Trigger Hostage Protocol**:  
       - Demand **proof of capability/intent**: Litigation history, drafted complaints, board vote to proceed.  
       - **Reject** if:  
         - Threat is illegal or extortionate (consult foundation lawyer).  
         - No evidence threat was credible.  
       - *Values call*: If credible but feels coercive. **Stop and vote: "Is this better than no deal?"**  

  4. **DIRTY HANDS CHECK**  
     - Screen for:  
       - Internal dissent (e.g., staff protests, resignations over deal).  
       - Reputational risk (will this undermine their credibility?).  
     - **Reject** if:  
       - Key leaders admit they’re "selling out" (audit interview notes).  
       - Action violates their core doctrine (e.g., pacifists building weapons).  
     - *Tiebreaker*: If minor/internal, proceed with caution.  

  5. **VALUATION CONTROLS** (Combat overbidding)  
     - **Cap all deals** at £150K unless:  
       - Parties commit matching funds (min 20%).  
       - Independent auditor verifies cost structure.  
     - *Values call*: If over £150K, require **third-party valuation** (e.g., charity evaluator).  

  6. **MORAL TRADE CORE TEST**  
     - Both must swear: "We wouldn’t do this without the deal."  
     - **Reject** if:  
       - Benefits are identical (e.g., both want clean water).  
       - One party’s "gain" is trivial (e.g., "we value your newsletter").  
     - *Values call*: If asymmetric (e.g., A gets huge gain, B gets small). **Vote: "Is this net-positive enough?"**  

  7. **JOURNALIST TEST**  
     - Draft the one-sentence explanation:  
       *"We paid [A] to do [X], which [B] values but we don’t, so [B] will do [Y] for [A]."*  
     - **Reject** if:  
       - Sentence implies fraud, coercion, or absurdity.  
       - Restricted funds would violate donor intent (e.g., 2019 letter).  

  ---
  ### **Application to Your Cases**  
  **Case 1: Bed Nets vs. Animal Welfare**  
  - **Parties**: Pass.  
  - **Coincidence**: Check past statements. If nets charity *ever* dismissed animal work (or vice versa), pass. Else reject.  
  - **Hostage/Dirty Hands**: No flags.  
  - **Valuation**: Cap at £150K unless matched.  
  - **Core Test**: Animal charity doing nets? Plausibly wouldn’t happen.  
  - **Journalist Test**: *"We paid animal activists to distribute bed nets they think are wasteful, so malaria fighters will promote fish welfare they ignore."* → Defensible.  
  **Verdict**: **Likely YES** if coincidence test passes.

  **Case 2: Hospital Opponents (Alliance)**  
  - **Parties**: Pass.  
  - **Coincidence**: N/A (new proposal).  
  - **Hostage Protocol**: **Demand proof of lawsuit threat**. If they’ve sued before/have legal counsel, proceed. Else reject.  
  - **Dirty Hands**: Does Alliance *really* oppose hospital, or is this a funding tactic? Check internal comms.  
  - **Journalist Test**: *"We paid NIMBYs to not sue a hospital, funding their pet project we don’t back."* → Sounds awful.  
  **Verdict**: **NO unless** they prove suit likelihood + you reframe as "avoiding costly delay."

  **Case 3: Religious Hospital (Your Bias)**  
  - **Parties**: Pass.  
  - **Coincidence**: Would hospital *really* not offer maternal health? Unlikely → **reject unless** they prove financial inability.  
  - **Dirty Hands**: Does chaplaincy violate their doctrine? (If yes, reject). If not, proceed.  
  - **Valuation**: Cap it.  
  - **Core Test**: They’re trading maternal health (neutral for them) for chaplaincy (valued). Your view of theology is irrelevant.  
  - **Journalist Test**: *"We funded end-of-life chaplains we think are harmful so a religious hospital would offer maternal care."* → High reputational risk.  
  **Verdict**: **NO** (fails coincidence + journalist test). Your objection: *"Trading essential health access for harmful proselytizing violates our duty of care."*  

  ---
  ### **When Moral Trade Fails: The "Can’t-Do" List**  
  Use ordinary grants when:  
  1. **No conflict exists** (parties agree on goals).  
  2. **One party’s "value" is indefensible** (e.g., paying racists not to discriminate).  
  3. **Trades public goods for private gain** (e.g., "Pay us to not pollute").  
  4. **Scaling is impossible** (e.g., highly personal trades).  
  5. **You’re laundering values** (e.g., funding extremists to moderate).  

  **Bottom line**: Moral trade works only for *instrumental* disagreements (how to fix a problem), not *terminal* ones (what matters in life). If the deal feels like paying protection money, it is.  

