answer: |-
  ## Adversarial Collaboration: Counterfactual Mugging & Decision Theory  
  **Authors:** [Your Name] & Jordan  
  **Faculty Advisor:** [Advisor's Name]  
  **Date:** October 26, 2023  

  ---

  ### (1) Agreed Statements  
  We jointly endorse the following claims:  

  1. **Decision Theory Definition**:  
     A decision theory prescribes choices that maximize an agent’s expected utility, given their beliefs and goals. A "good" answer should be *consistent*, *pragmatic* (yield higher utility in repeated play), and *intuitively coherent*.  

  2. **Case 1: Counterfactual Mugging (CM)**  
     > *Omega, a perfect predictor, flips a fair coin. If heads, Omega gives you $10,000 iff it predicted you would pay $100 if asked after tails. If tails, Omega appears, states the outcome, and requests $100. You know Omega’s rules in advance. When tails occurs, do you pay?*  

  3. **Case 2: XOR Blackmail (XOR)**  
     > *A perfect predictor sends you a note iff exactly one is true: (A) Your house has termites (costing $1M to fix), or (B) You will pay $1,000 after reading the note. You receive the note. Do you pay?*  

  4. **Background Agreements**:  
     - In CM, **both camps** would pay $1 *in advance* for a gadget forcing payment later.  
     - In Newcomb’s Problem (one-box=$1M, two-box=$1K), **pay camp** one-boxes; **don’t-pay camp** two-boxes.  
     - In XOR, **both camps refuse to pay** $1,000.  

  ---

  ### (2) Disagreements Table  
  | Jordan’s Wording (Don’t-Pay) | Your Wording (Pay) | Purely Verbal? | Underlying Crux | Test Case / Crux Probe |  
  |------------------------------|-------------------|----------------|-----------------|------------------------|  
  | "Paying after tails can’t cause the $10K to exist. The coin is flipped; the outcome is fixed. Paying is irrational hindsight bias." | "Paying is evidence you’re the *type of agent* who would’ve been predicted to pay, so you ‘retroactively’ qualify for the $10K in the heads branch." | **No** | **What does ‘should’ optimize?**<br>Actual causal consequences (Jordan) vs. global agent properties (You). | **Crux Probe**: *If Omega’s prediction is 60% accurate (not 100%), and the coin is 90% likely heads, does paying become rational?*<br>- Jordan: Still no; accuracy doesn’t change causality.<br>- You: Yes; high heads probability + modest accuracy makes paying net positive EV. |  
  | "In XOR, paying $1000 doesn’t change whether termites exist. The note proves one is true; refusing payment makes (B) false, so (A) must be true (termites). Paying would be wasting money *plus* confirming termites." | "In XOR, paying is self-falsifying: if you pay, (B) is true, making the note’s condition false (since both A and B would be true), so you couldn’t have received it! Refusing is the only consistent choice." | **Partially** | **Interpretation of predictors**<br>Jordan: Predictor outputs are *facts* to condition on.<br>You: Predictor outputs are *logical constraints* on agent behavior. | **Crux Probe**: *If the predictor is 60% accurate, would either camp pay?*<br>- Both still refuse, but:<br>Jordan: "Termites likely exist; paying doesn’t prevent them."<br>You: "Paying creates logical contradiction; low accuracy doesn’t resolve it." |  

  ---

  ### (3) Novel Test Cases  

  #### Case A: Imperfect Predictor (60% Accuracy, 90% Heads)  
  - **Jordan (Don’t-Pay)**:  
    - Verdict: **Do not pay**.  
    - Reason: "The coin is tails *now*. Paying can’t affect a past coin flip or a flawed prediction. EV = –$100."  
    - Surprise: If paying yielded >$0 average payout in simulation.  

  - **You (Pay)**:  
    - Verdict: **Pay**.  
    - Reason: "Heads was 90% likely, and Omega is 60% reliable. Expected utility of being a ‘payer’: (0.9 × 0.6 × $10K) – $100 = +$5,300. Non-payer gets (0.9 × 0.4 × $10K) = $3,600. Paying dominates."  
    - Surprise: If Jordan’s strategy outperforms in simulation.  

  #### Case B: 100 Rounds (Single Prediction)  
  - **Round 1**:  
    - Jordan: **Don’t pay** ("Current coin flip is independent; past predictions can’t be changed").  
    - You: **Pay** ("My strategy in round 1 affects Omega’s initial prediction for all rounds").  
  - **Round 100**:  
    - Jordan: **Don’t pay** ("The coin is tails *this round*; paying now can’t affect prior predictions").  
    - You: **Pay** ("Consistency as a ‘payer-type’ agent maximizes overall gains across rounds").  
  - **Crux**: Jordan sees rounds as isolated; you see them as linked by the initial prediction.  
  - **Surprise**:  
    - Jordan: If paying in late rounds increases heads payouts *in earlier rounds*.  
    - You: If refusing in round 100 *increases* total payout.  

  #### Case C: Sam Proxy Prediction  
  > *Omega says: "I simulated your friend Sam (who decides identically to you) to predict your action." Sam hears this. Do you pay? Would pay camp bribe Sam?*  

  - **Jordan**:  
    - Verdict: **Do not pay**.  
    - Reason: "Sam’s presence changes nothing. The coin is tails; paying wastes $100. Omega already made its choice."  
    - Bribe Sam? **No** ("Bribing Sam can’t alter the past prediction").  
  - **You**:  
    - Verdict: **Pay**.  
    - Reason: "If Sam is identical to me, paying ensures Omega *would have* predicted payment (via Sam), granting $10K in heads branches. Refusing makes Omega predict refusal, losing $10K."  
    - Bribe Sam? **Yes, before Omega speaks** ("If Sam’s ‘yes’ is fixed in advance, it guarantees the favorable prediction").  
  - **Surprise**:  
    - Jordan: If paying when Sam is present yields $10K in a rerun.  
    - You: If Sam’s decision *doesn’t* correlate with yours.  

  ---

  ### Purely Verbal vs. Substantive Disagreements  
  - **Verbal**: Disputes over terms like "cause" or "retrocausality." Both agree no *physical* time travel occurs.  
  - **Substantive**: **What is being optimized?**  
    - Jordan: *Local causal outcomes* (the $100 loss is real; the $10K gain is irrecoverable).  
    - You: *Agent identity across branches* (being a "payer" type maximizes utility globally).  

  ### Where the Disagreement Would Persist  
  After 1 year, you would still dispute:  
  > *In a single-play Counterfactual Mugging with a perfect predictor, does paying in the tails branch "deserve" the heads-branch payout?*  
  Jordan: "No—it’s a different branch."  
  You: "Yes—your decision reveals what *would have* happened."  

  ---  
  **Document ends** (Per advisor instructions, no verdict is given).
