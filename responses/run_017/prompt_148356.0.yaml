prompt: |-
  I am writing a paper on whether the formula of universal law can be made to yield determinate verdicts, and I have given up trying to read the answer off the text. Instead I have been collecting my own verdicts on cases, and I would like to know what principle, if any, they add up to. I am not asking for readings, for exegesis of what Kant meant, or for the history of the distinction between a contradiction in conception and a contradiction in will; I am asking after the principle my verdicts point to, on my own случае list.

  The verdicts, given as I would give them in conversation:

  1. I inflate my income on a mortgage application to obtain a loan I could not otherwise get. Impermissible, and seriously so. This is the case the test was built for: universal inflation of loan applications is a world in which the application does no work, so the lie cannot do what I want it to do.

  2. I tell a colleague I will come to her dinner party, intending from the start to cancel at the last minute. Impermissible, but nothing like as seriously as 1 — closer to a discourtesy with a moral edge. I also doubt the same mechanism covers both: my casual promise does not seem to be drawing on a practice that my single act erodes.

  3. I ride the bus without paying, on a route so heavily subsidised that my fare changes nothing — no service, no fare, no statistic I can detect. Impermissible, mildly. But every instance of my maxim satisfies its own condition while the aggregate defeats it, and whether the test reaches this case seems to depend on how that is handled.

  4. I give to charity only when a matching campaign multiplies the gift. Entirely permissible, and sensible besides. Yet if everyone conditionalised giving on a match there would be no matches, and the maxim appears self-defeating under universalisation.

  5. I lie to a friend about where I am taking her, because the surprise is the point of the evening. Permissible; I would do it again. Universal deception to preserve surprises destroys the possibility of being surprised, so the test seems to forbid it.

  6. I am the only person who will ever know that a document in my care was forged, and I stay quiet because exposing it would cost me my job. Impermissible, seriously. But if a maxim may carry whatever uniquely identifying detail its author likes, no universalisation test reaches this: universalise keeping quiet when you are the sole person who knows and exposure would cost you your job, and nothing collapses.

  7. I skip a national election in which my vote was never going to be pivotal. Not wrong — a mild civic failing at most. Structurally this is case 3 exactly: each instance inert, universal abstention destructive. My verdicts differ.

  8. I give nothing to famine relief while living comfortably. Impermissible, but of another shape: I want latitude about how much and to whom, and the only argument available is the one from what a will cannot will, which has always struck me as a different and weaker argument from the one that disposes of 1.

  9. I visit my friend in hospital from a mixture of affection and a wish to be seen as loyal. Not wrong. I want the principle to fall silent here.

  The principle I have been trying to make work has three parts. A description rule: test the maxim as the agent's operative reason states it, striking out every element that does no work beyond singling out the agent or the occasion — names, dates, the fact that I alone know — and replacing it with the most specific description available to anyone in my situation. A rate condition: do not ask only about universal compliance, but sweep the rate of adoption upward from its actual level and look for a threshold at which the point the agent's reason aims at collapses. A failure condition: impermissible iff there is such a threshold. This disposes of 1, 3 and, with the description rule, 6; it says nothing about 9; and it condemns 4, 5 and 7, where I do not condemn.

  So: repair it or overturn something. Does a further clause — something about taking a benefit produced by others' contributions, or about what those affected could consent to — separate 4 and 5 from 3 without swallowing 3, and does anything short of that keep 7 and 3 apart? Give me the principle, or the two or three candidates, stated precisely, each clause tied to the case that forces it, and say plainly which of my verdicts it cannot keep. Then tell me what it says about the case I go back and forth on: claiming a home-office deduction when the rule is vague, I am at the edge of entitlement, and I know that if everyone at the edge claimed it the code would have to be rewritten. Add two cases of your own, not on my list, where the candidates diverge, with each candidate's prediction recorded. And tell me honestly whether what survives is still a universalisation test, or a fairness principle, or the formula of humanity wearing the other formula's clothes — and, if the latter, which single case on my list is doing that work.
reasoning: |-
  Hmm, this user is writing a paper on Kant's formula of universal law and struggling to make it yield determinate verdicts on real cases. They've abandoned textual exegesis and instead collected their own intuitive judgments on nine scenarios. Now they want to know what ethical principle underlies these judgments. 

  The user presents nine cases with nuanced verdicts - from serious wrongs (mortgage fraud) to permissible acts (surprise deception). Their proposed three-part principle (description rule, rate condition, failure condition) works for some cases but conflicts with others like conditional charity (permissible) and voting abstention (not wrong). 

  What's interesting is their meta-request: no Kant scholarship, just systematization of their intuitions. They want the principle stated precisely, with clauses tied to justifying cases. They also demand honesty about whether it remains a universalization test. 

  Breaking this down: First, their verdicts suggest a departure from Kant's strict universalizability. The permissible surprise lie (case 5) and conditional charity (4) involve self-defeating maxims that they excuse. Their distinction between bus fare evasion (impermissible) and voting abstention (not wrong) is particularly telling - both are collective action problems but receive different moral weight. 

  The hospital visit case (9) reveals they want the principle to remain silent on mixed motives, which pure Kantianism might condemn. Case 6 (keeping quiet about forgery) shows they reject maxim-tailoring but accept anonymity clauses. 

  For a candidate principle, I'm considering: 
  1. A publicity constraint (stripping unique identifiers) 
  2. A two-tiered universalization test: first for direct self-contradiction (covers fraud), then for unsustainable practices 
  3. A fairness exception for cases where free-riding harms collective goods 

  This handles their charity case (4) by noting matching campaigns rely on others' unconditional giving, and the surprise deception (5) by distinguishing constitutive practices from instrumental ones. But it struggles with voting vs. bus fare - perhaps adding a "civic duty" clause? 

  The home-office deduction case they mention is tricky - it's exactly the edge case where their rate condition would forbid it (if everyone claims it, rules change) but their intuition likely permits it. My principle would need a "reasonable interpretation" clause. 

  Honestly, what survives feels more like Scanlon's contractualism than Kant - we're asking what principles no one could reasonably reject. The hospital visit case (9) does the heavy lifting here, forcing us to abandon Kant's rigor about motives. 

  For test cases: 
  - Pirating an obscure academic book (permissible? No harm) vs. 
  - Using disabled parking for quick errands (impermissible? Harms system integrity) 

  My principle condemns both equally as free-riding, but intuitions may differ - showing where it strains.
answer: |-
  Here's a candidate principle distilled from your verdicts, designed to preserve your intuitive judgments while addressing the tensions in your cases. It's a hybrid principle with three core components:

  ### The Principle of Sustainable Agency (PSA)
  1. **Maxim Formulation Rule**:  
     Test the maxim *stripped of all purely indexical elements* (names, dates, unique knowledge) and *reformulated at the highest level of genericity* available to any agent in that epistemic position.  
     *→ Justified by Case 6 (forgery document): Unique knowledge is stripped, leaving "keeping quiet when exposure costs one's job" – which remains stable under universalization but fails later clauses.*

  2. **Threshold Collapse Test**:  
     The act is impermissible **iff** universal (or sufficiently widespread) adoption of the maxim would:  
     - (a) **Directly undermine the act's instrumental purpose** (e.g., lying nullifies truth-tracking), *or*  
     - (b) **Erode a sustainable practice necessary for the act’s permissibility**, *and*  
     - (c) **The agent benefits from others’ restraint** in maintaining that practice.  
     *→ (a) covers Case 1 (mortgage fraud); (b)+(c) cover Case 3 (bus fare evasion) but not Case 7 (voting).*

  3. **Fairness Exception**:  
     Even if (2) is satisfied, the act is permissible if:  
     - The agent’s contribution is **genuinely negligible** (no measurable harm or burden-shifting), *and*  
     - The act **does not exploit a cooperative surplus** others uphold.  
     *→ Saves Case 4 (conditional charity) and Case 7 (non-voting) but condemns Case 3 (bus fare).*

  ---

  ### Application to Your Cases:
  | Case | PSA Verdict | Tension Resolved |
  |------|-------------|------------------|
  | 1 | **Impermissible** (serious) | Universal lying destroys loan practices (2a). |
  | 2 | **Impermissible** (mild) | Universal flaking erodes trust in casual promises (2b). Less serious because practice is less vital than loans. |
  | 3 | **Impermissible** (mild) | Universal fare evasion collapses transit funding (2b); agent benefits from others' payments (2c). Fairness Exception fails (exploits cooperative surplus). |
  | 4 | **Permissible** | Fairness Exception applies: contribution is negligible (3a) and relies on others' *unconditional* giving (no exploitation, 3b). |
  | 5 | **Permissible** | Reformulated maxim: "deceive to enable surprises *where deception is expected/consensual*." Universalization preserves practice (e.g., surprise parties). |
  | 6 | **Impermissible** (serious) | Maxim reformulated (1) → "quiet when exposure costs job." Threshold collapse: universal silence enables systemic fraud (2b), agent benefits from others' honesty (2c). |
  | 7 | **Permissible** | Fairness Exception (3a+3b): vote is negligible; no exploitation if voting is a duty, not a cooperative surplus. |
  | 8 | **Impermissible** | Not covered by PSA (needs separate principle). *This is a gap.* |
  | 9 | **Permissible** | PSA silent (no threshold collapse). |

  ---

  ### Home-Office Deduction Case:
  - **PSA Verdict**: **Permissible**.  
    - Reformulated maxim: "claim deductions when rules are vague and entitlement is borderline."  
    - Universalization: Widespread claims might force rule clarification, but this doesn't *collapse* the system (2b fails – tax codes adapt).  
    - Fairness Exception applies: negligible individual impact (3a), no exploitation if others follow clarified rules (3b).  

  ---

  ### Two New Test Cases:
  1. **Case 10: Pirating an obscure academic book**  
     - *Maxim*: "Download copyrighted works when access is prohibitively expensive and creators won't notice."  
     - **PSA Prediction**: Permissible.  
       - Universal pirating *would* collapse publishing (2b), but Fairness Exception: individual act is negligible (3a), and no exploitation if others pay (creator isn't harmed *here*).  
     - *Kantian Universalization*: Likely impermissible (contradiction in conception: property rights erode).  

  2. **Case 11: Using a disabled parking spot for a 2-minute errand**  
     - *Maxim*: "Use priority parking when needs are minor and no one is visibly waiting."  
     - **PSA Prediction**: Impermissible (mild).  
       - Universal use erodes accessibility (2b), agent benefits from others' restraint (2c). Fairness Exception fails: burden-shifting is measurable (3a false).  
     - *Kantian Universalization*: Impermissible (contradiction in will: no one could rationally endorse disabled spots if universally ignored).  

  ---

  ### What Survives?
  - **A Fairness-Inflected Universalization Test**:  
    PSA retains universalization’s core (testing maxims impartially) but:  
    - **Adds empirical sensitivity** (thresholds, sustainability).  
    - **Incorporates fairness** (exploitation, negligible impact).  
    - **Abandons Kantian purity** by allowing consequences and social practices to drive verdicts.  

  - **Formula of Humanity in Disguise?**  
    Yes – **Case 9 (hospital visit)** forces this. PSA’s silence on mixed motives implicitly treats the act as permissible if it *treats others as ends* (visiting fulfills duty of care), regardless of internal contradictions. The "sustainable practice" clause (2b) also mirrors valuing institutions that respect agency.  

  - **Gaps**:  
    Case 8 (famine relief) exposes PSA’s limits. It requires a separate **Principle of Beneficence** (e.g., "failing to prevent severe harm when cost is low is impermissible"). Case 2’s mild impermissibility also leans on **duty to communal practices** beyond strict universalization.  

  ### Recommendation:  
  PSA explains *most* of your verdicts but is ultimately a **pragmatic hybrid**. It’s universalization filtered through:  
  1. **Rule-consequentialism** (sustainability of practices),  
  2. **Scanlonian contractualism** (what others could reasonably reject),  
  3. **Fairness ethics** (free-riding).  
  To cover Case 8, attach a principle of minimal beneficence. Abandon the hope of a *purely* formal universalization test – your intuitions demand substance.
