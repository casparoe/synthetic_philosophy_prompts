  We are designing a simulation game for a 90-minute session with 18 students. The goal is to make students experience the distinction between downward legibility (state's ability to record citizen conduct), upward legibility (citizen's ability to see and contest the record), and automaticity (whether consequences are automatic or require human intervention). We also want them to feel the reciprocity gap and the concept of opacity budget.

  Constraints:
  - No lecture first, no vocabulary until debrief.
  - No real-world country names until debrief; use fictional labels (e.g., three cities).
  - Real choices with symbolic stakes (points, tokens, no money, no grading).
  - Roles that create different incentives for the dials.
  - Mechanism to prevent mushy compromise (veil, rotation, secret ballot).
  - Timeline with minutes, materials list, rules read in under 3 minutes.
  - Debrief mapping game moments to concepts, using student inconsistencies.
  - Predictions of what goes wrong and remedies.
  - Note on what the game cannot reproduce.

  Game Design: "The City Records Game"

  Premise: Students are residents of three fictional cities (Avalon, Bryn, and Ciron) with different initial settings for the three variables. They will live under a set of rules for a simulated week, making choices that might be recorded, and then face consequences based on the records.

  Materials:
  - Index cards (three colors: blue for Avalon, green for Bryn, yellow for Ciron) - 18 per color? Actually, 18 students, so 6 per city? But we have 3 cities and 18 students -> 6 per city.
  - A printed board (or a central display) showing the current rules for each city (the three dials) and a space to place tokens for "points".
  - Tokens (or just paper to record points) for each student.
  - A deck of "Life Event" cards (prepared in advance) that describe common activities (e.g., "You bought a book", "You visited a friend", "You attended a protest", "You donated to a charity", "You drove to work", etc.) - about 30 cards, some duplicates.
  - A deck of "Consequence" cards (for automatic consequences) and a set of "Judge" cards (for human decisions).
  - A timer.

  Roles: Each student is assigned a role that gives them a secret objective. Roles are:
  - The Law-Abider: Wants to avoid any negative consequences. Prefers low downward legibility OR high upward legibility to fix mistakes.
  - The Rebel: Wants to do things without being recorded. Prefers high opacity budget and low downward legibility.
  - The Bureaucrat: Wants efficient and automatic systems. Prefers high automaticity and high downward legibility.
  - The Activist: Wants transparency and the ability to contest. Prefers high upward legibility and low automaticity (so that human decisions can be challenged).
  - The Privileged: Starts with extra points and wants to avoid losing them. Prefers systems that don't change the status quo.
  - The Underdog: Starts with fewer points and wants opportunities to gain points. Prefers systems where they can take risks without severe consequences.

  Each city has two of each role? But 6 students per city and 6 roles? Actually, we can have 3 roles per city (each role assigned to 2 students in a city) or 6 distinct roles? Let's have 6 roles, but because we have 18 students and 3 cities, each city will have one of each role? That would be 6 roles and 3 cities -> 18 students. So each city has 6 students, each with a different role.

  But note: the roles are assigned secretly, and the city's rules are set at the beginning and then changed by a vote.

  Game Structure:

  Phase 1: Setup (5 minutes)
  - Divide the class into three groups of six. Each group represents a city (Avalon, Bryn, Ciron). Each city is assigned a starting configuration of the three dials (downward legibility, upward legibility, automaticity) by the teacher. The configurations are extreme and different:
    - Avalon: High downward, low upward, high automaticity.
    - Bryn: Medium downward, medium upward, low automaticity (human decisions).
    - Ciron: Low downward, high upward, medium automaticity.

  - Each student in a city is given a secret role card (describing their objective and how they earn points). They also get a starting point token (e.g., 10 points for everyone, except the Underdog starts with 5 and the Privileged with 15?).

  - Explain the rules of the city (without the vocabulary) by describing what happens in the city:
    - Downward legibility: "In Avalon, almost everything you do is recorded. In Bryn, about half of your activities are recorded. In Ciron, only a few activities are recorded."
    - Upward legibility: "In Avalon, you cannot see your own record. In Bryn, you can see your record but cannot change it. In Ciron, you can see your record and challenge any entry."
    - Automaticity: "In Avalon, if your record shows a violation, you automatically lose points. In Bryn, a human judge decides if you lose points. In Ciron, minor violations are automatic, but major ones are judged."

  - Each city has a "Registrar" (a rotating role among the students) who will be responsible for recording and enforcing the rules. The Registrar does not make the rules but implements them.

  Phase 2: Life Events (20 minutes)
  - Each student draws 5 Life Event cards (from a deck for their city? or a common deck? Let's use a common deck). They choose to do 3 of them (they must choose 3). Some events are neutral, some are positive (gain points if not recorded as bad), some are negative (lose points if recorded). But the point is that the recording and consequences depend on the city rules.

  - How recording works:
    - For each event, the student declares (to the Registrar of their city) what they are doing. The Registrar then consults the city's downward legibility rule to decide if it's recorded. For example, in Avalon, everything is recorded. In Ciron, only events with a red mark (on the card) are recorded. We can pre-mark some cards as "recordable" (maybe 60% of the deck) and then the city rule determines the probability? But to avoid dice, we can have:
        - Avalon: Record all events.
        - Bryn: Record events that have a star on the card (50% of the cards have a star).
        - Ciron: Record events that have a triangle (30% of the cards have a triangle).

    - The Registrar writes down the event on an index card (color of the city) and files it in a box for that city.

  - Consequences:
    - After all events are recorded, the consequences phase begins.
    - Automaticity rule: In Avalon, if an event is negative and recorded, the student automatically loses 2 points. In Bryn, the negative events are brought to a judge (another student in the city, randomly chosen for each event) who decides if the student loses 2 points or not. In Ciron, minor negative events (marked with one exclamation) are automatic (lose 1 point) and major (two exclamations) are judged (lose 3 points if found guilty).

  - But wait, we want the events to have potential negative consequences? So each Life Event card has a symbol indicating if it's positive, neutral, or negative? And also the recordability mark? Let's simplify:

    Each Life Event card has:
    - Description (e.g., "Attend a protest")
    - A recordability mark (star, triangle, or none) - for the downward legibility rule.
    - A consequence type: 
        - Green: positive (if recorded, you might gain points? but we don't have that) -> Let's change: we want negative consequences only? Or some positive? 
        - Actually, let's have mostly negative consequences for some events, but also some events that are positive but might be misrecorded? 

    Alternatively, we can have two types of events:
    - Type 1: Normally legal, but if recorded and the context is wrong, they become negative? Too complex.

    Let's have events that are either:
    - Safe: No negative consequence even if recorded.
    - Risky: If recorded and the event is considered negative by the rules, then consequence.

    How do we know if an event is negative? We can have a set of rules for each city (secret at first? or known?) that define which events are violations. The rules should be arbitrary and not obvious. For example, in Avalon, attending a protest is a violation. In Bryn, donating to charity is a violation if done more than once a week? But that's too complex.

    Instead, each event card has a set of city symbols (A, B, C) and a consequence for that city. For example:
    - "Attend a protest": 
        - In Avalon: Violation (lose 2 points if recorded).
        - In Bryn: Not a violation.
        - In Ciron: Only a violation if it turns violent (so judged).

    But then we have to mark each card for each city? That's a lot.

    Alternatively, we can have a central rule sheet for each city that lists which event descriptions are violations. The Registrar has this sheet. The student doesn't know the rule exactly? That would be interesting.

    So, the Life Event cards only have the description and a recordability mark (star, triangle, or none). The Registrar has a rule sheet for their city that says, for example:
        Avalon: Violations are "Attend a protest", "Donate to charity", "Drive after dark".
        Bryn: Violations are "Donate to charity" and "Buy a book".
        Ciron: Violations are "Drive after dark" and "Attend a protest" (but only if major).

    Then, when a student declares an event, the Registrar:
        1. Checks if the event is recordable (based on the city's downward legibility and the card's mark).
        2. If recordable, records it.
        3. Then, if the event is on the violation list for the city, it triggers a consequence.

    Consequences are applied based on automaticity.

  Phase 3: Rule Change (15 minutes)
  - Now, each city holds a vote to change one of the three dials (downward, upward, automaticity). But the vote is by secret ballot. Each student votes for one setting change (they can choose to increase, decrease, or leave unchanged one of the dials). The vote is on a slip of paper.

  - The teacher collects the votes and changes the city's rules based on the majority (if there is one). If no majority, the rule doesn't change.

  - Then, a second round of Life Events (same as Phase 2, but with the new rules). Each student draws 3 new Life Event cards and chooses 2 to do.

  Phase 4: Inspection and Contestation (10 minutes)
  - Now, we test upward legibility. Each student can request to see their own record (if the city allows it). In Avalon (low upward), they cannot. In Bryn (medium), they can see but not change. In Ciron (high), they can see and challenge.

  - If they can see, they are shown the record. If they can challenge, they can pick one entry and argue it was a mistake. The Registrar then decides (with the rule sheet) if it was indeed a mistake. If so, the entry is removed and any points lost because of it are restored.

  - But note: in the automaticity setting, if it was a judged event, they can also appeal to the judge? We'll keep it simple: only the record can be challenged in this phase.

  Phase 5: Scoring and Reveal (5 minutes)
  - Each student tallies their points. The teacher asks for a show of hands: who has the most points? The least?

  - Then, reveal the roles and objectives. Each role has a point condition (e.g., Law-Abider: lose less than 3 points; Rebel: have at least 3 unrecorded events; etc.). They get bonus points if they meet their objective.

  - Then, we reveal the city configurations and how they changed.

  Phase 6: Debrief (25 minutes)
  - Map the experience to the three variables. Ask students:
    - "In which city did you feel most free? Why?"
    - "When you voted, what did you want to change? Why?"
    - "Did you try to see your record? What happened?"

  - Point out the reciprocity gap: In Avalon, the state records a lot but doesn't show you. In Ciron, it records less but shows you. What was the impact?
  - Opacity budget: How many of you chose events that you thought wouldn't be recorded? How did that feel? How did it change in the second round?
  - Use a student's inconsistency: "I noticed that in the first vote, Student X voted for more downward legibility because they were a Bureaucrat, but then in the second round, when they saw how it affected them personally, they changed their mind."

  Predictions of what goes wrong:
  1. Problem: Students might not understand the rules at first, leading to confusion in the first round.
     Remedy: Do a practice round with one event per student.

  2. Problem: The student assigned as Registrar might refuse (on principle or because they don't want the responsibility).
     Remedy: Emphasize that the Registrar is just a mechanical role and rotate it (maybe per event). Or have the Registrar chosen randomly and if they refuse, let someone else volunteer.

  3. Problem: The game might become an optimization puzzle where students try to maximize points, ignoring the experiential aspect.
     Remedy: In the debrief, focus on the feelings and trade-offs, not just the points. Also, the roles are designed to have conflicting objectives, so not everyone is optimizing the same thing.

  4. Problem: The secret ballot might not lead to a clear majority, causing rule changes to be ambiguous.
     Remedy: The teacher can break ties arbitrarily or leave the rule unchanged.

  5. Problem: The Life Event deck might not have enough variety, leading to repetitive experiences.
     Remedy: Prepare a large deck (at least 30 distinct events) and shuffle well.

  What the game cannot reproduce:
  - The slow effect on what people dare to want: In the game, students know the rules and can vote to change them. In reality, the system shapes desires over time and people may not even realize they are being constrained.
  - The fact that in real systems, individuals rarely see their own records or scores, and the psychological burden of uncertainty and self-censorship.
  - The unequal distribution of the burden of maintaining an opacity budget: in the game, everyone is equally burdened, but in reality, some groups (e.g., minorities) face more scrutiny.

  The one thing the game is engineered to make participants notice: The cost of a wide reciprocity gap.

  Answer line:

  \answer{The cost of a wide reciprocity gap}
answer: |-
  ### The City Records Game  
  **Designed for:** 18 students, 90 minutes  
  **Goal:** Students experience how state surveillance feels, focusing on three hidden variables (downward/upward legibility, automaticity) without explicit terms until debrief. They confront the reciprocity gap and opacity budget through roles, choices, and consequences.  

  ---

  ### Materials  
  - **Index cards:** Three colors (e.g., red, blue, yellow) for city records.  
  - **Tokens:** Poker chips or paper clips for points (each student starts with 10).  
  - **Role cards:** 18 cards (6 roles × 3 copies each, see roles below).  
  - **Event cards:** 30 pre-printed cards describing simple actions (e.g., "Buy medicine," "Attend a rally," "Send an anonymous message"). Mark 50% with a dot (indicating recordable).  
  - **Rule sheets:** Three sheets (one per city) defining initial settings (see setup).  
  - **Ballot box + slips:** For secret voting on rule changes.  
  - **Timer.**  

  **Prep (5 min):** Place three "city stations" (tables) with colored index cards, rule sheets, and a ballot box. Shuffle event cards.  

  ---

  ### Rules (Read Aloud, <3 Min)  
  "You live in one of three cities—Avalon, Bryn, or Ciron—each with different rules. Your goal: earn points by doing everyday actions. But actions might be recorded, and records can cost you points.  
  1. **Roles:** You’ll get a secret role card with a personal goal (e.g., "Avoid point losses").  
  2. **Actions:** Each round, draw 3 event cards. Choose 1 to do. Report it to your city’s Registrar (rotates each round).  
  3. **Recording:** The Registrar checks if your action is recorded (based on city rules). If recorded, it goes on a colored index card.  
  4. **Scoring:** Some actions risk point loss. If recorded and flagged, you lose 2 tokens.  
  5. **Rule Changes:** Mid-game, you’ll vote secretly to change one city rule.  
  6. **Records Review:** Later, you can request to see your record (if allowed).  
  Points = tokens. No names—use roles for debrief."  

  ---

  ### Setup (10 min)  
  1. **Assign Cities:** Divide into three groups of six. Assign cities:  
     - **Avalon:** High downward (record 80% of actions), low upward (no record access), high automaticity (losses automatic).  
     - **Bryn:** Medium downward (record 50%), medium upward (see but not contest), low automaticity (losses require judge approval).  
     - **Ciron:** Low downward (record 20%), high upward (see and contest), medium automaticity (losses automatic for minor issues, judged for major).  
     *Rule sheets use plain language (e.g., "In Avalon, most actions are recorded; you cannot see your record; point losses happen instantly").*  
  2. **Assign Roles:** Give each student a role card (shuffled). Roles:  
     - **Rule-Follower:** Goal: Lose ≤1 point. Prefers low downward legibility.  
     - **Privacy-Seeker:** Goal: Have ≥2 unrecorded actions. Prefers high opacity budget.  
     - **Efficiency-Advocate:** Goal: Have ≥3 actions recorded. Prefers high automaticity.  
     - **Transparency-Champion:** Goal: See your record once. Prefers high upward legibility.  
     - **Risk-Taker:** Goal: Do ≥1 risky action. Prefers low automaticity (to argue consequences).  
     - **Status-Quo-Keeper:** Goal: End with ≥8 points. Prefers no rule changes.  
  3. **Assign Registrar:** Randomly pick one student per city as Registrar for Round 1 (rotates in Round 3).  

  ---

  ### Gameplay Timeline (60 min)  
  **Round 1: Actions & Consequences (20 min)**  
  - Students draw 3 event cards, choose 1 action to report to Registrar.  
  - Registrar: Consults city rule sheet. Records action (on colored card) if rule applies (e.g., in Avalon, record if card has a dot or not—rule says "record 80%," so record all dot cards + some randoms).  
  - **Consequences:** If action is "risky" (pre-defined on event card, e.g., "Attend a rally"), and recorded:  
    - Automaticity applies: In Avalon, auto-lose 2 tokens. In Bryn, a judge (random student) decides loss. In Ciron, minor risks auto-lose, major risks judged.  
  - *Timer: 10 min for actions, 10 min for consequences.*  

  **Voting Phase: Rule Change (15 min)**  
  - Secret ballot: Each student votes to change one rule (e.g., "increase recording," "allow record access"). No discussion—force divergence.  
  - Tally votes per city. Change the top-voted rule (e.g., Bryn votes to "increase recording"—now record 70%).  
  - Rotate Registrars.  

  **Round 2: Actions & Consequences (15 min)**  
  - Repeat Round 1 with new rules.  

  **Records Review (10 min)**  
  - Students may request to see their record.  
  - Based on upward legibility:  
    - Avalon: Denied.  
    - Bryn: Shown record but cannot contest.  
    - Ciron: Shown record; can contest one entry (Registrar decides if valid). If invalidated, tokens restored.  

  **Scoring (5 min)**  
  - Tally tokens. Students reveal if they met role goals (no names—e.g., "Raise hand if you lost ≤1 point").  

  ---

  ### Debrief (25 min)  
  1. **Elicit Reactions (5 min):**  
     - "Who felt safest? Why?"  
     - "Who was surprised by a point loss? What happened?"  
     - "Did anyone change their vote? Why?"  
  2. **Map to Concepts (10 min):**  
     - **Variables:** "In Avalon, the state saw much (downward legibility), but you saw nothing (upward legibility). That gap? We call it the reciprocity gap."  
     - **Opacity Budget:** "Privacy-Seekers—how many actions did you avoid recording? That’s your opacity budget."  
     - **Automaticity:** "In Bryn, judges decided losses—did that feel fairer than Avalon’s auto-losses?"  
  3. **Use Student Inconsistency (5 min):**  
     - "One Efficiency-Advocate voted for more recording to ‘streamline’ things. But when their own risky action was recorded and auto-lost points, they regretted it. That’s the reciprocity gap—it’s easy to support state power until it costs you."  
  4. **Reveal Vocabulary:** Name the three variables, reciprocity gap, and opacity budget. Briefly contrast real-world systems (e.g., "Germany’s strict reciprocity vs. U.S. automatic tools like credit scores").  

  ---

  ### Predictions & Remedies  
  1. **Problem:** Game becomes points-optimization, not experiential.  
     **Remedy:** In debrief, focus on emotions ("How did it feel to be denied your record?"). Roles force conflicting aims (e.g., Privacy-Seeker vs. Efficiency-Advocate).  

  2. **Problem:** Registrar refusal.  
     **Remedy:** Frame as neutral "referee," rotate quickly, or let a volunteer swap. If principled refusal, ask them to observe and report biases in debrief.  

  3. **Problem:** Confusion over rules.  
     **Remedy:** Do a 1-action demo round. Keep rule sheets visual (emoji-based: 👁️ = recording, 🔍 = access).  

  4. **Problem:** Vote leads to compromise (e.g., all dials medium).  
     **Remedy:** Secret ballot prevents peer pressure. Force single-issue votes ("change one rule only").  

  5. **Problem:** Uneven engagement (e.g., quiet students overshadowed).  
     **Remedy:** Roles assign clear goals. In review phase, require each student to request their record (if allowed).  

  ---

  ### What the Game Cannot Reproduce  
  - **Long-term effects:** The game shows immediate costs, but real systems erode autonomy gradually (e.g., "chilling effects" on behavior).  
  - **Score invisibility:** In reality, citizens rarely see their "file"; the game lets them request it.  
  - **Structural inequality:** The opacity budget burden falls heavier on marginalized groups—hard to simulate in a short game with equal starting points.  
  **Supply in your voice:** Discuss how reciprocity gaps entrench power imbalances (e.g., "When the state knows more about you than you know about it, resistance becomes riskier").  

  ---  
  \answer{The cost of a wide reciprocity gap}
