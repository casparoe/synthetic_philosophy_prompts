  ### Surprise Quiz Paradox Variant

  **Announcement by the Teacher:**  
  "Class, next week I will give a quiz on one of the days from Monday to Friday. However, if the school is unexpectedly closed on the day I selected, the quiz will be postponed to the next school day after that. This means the quiz might occur after Friday, but I guarantee it will happen. Importantly, the quiz will be a surprise: on the evening before it happens, none of you will be more than 50% confident that it will be the next day. You know that each day has a 50% chance of the school being closed, independently, due to unforeseen events like weather or emergencies, and I selected the initial day randomly from Monday to Friday."

  ### Schedule and Credence Arithmetic
  - **Setup**: The teacher secretly selects a day \(D\) uniformly from Mon-Fri. The quiz occurs on the first school day on or after \(D\). Each day has a 50% independent chance of closure. Students know \(D\) is uniform and closure probability is 0.5.  
  - **Quiz on Wednesday example**:  
    - Assume \(D = \text{Wed}\), and no closures occur.  
    - **Tuesday evening**: Students know:  
      - Mon and Tue were open, so \(D\) cannot be Mon or Tue (quiz would have occurred).  
      - Possible \(D\): Wed, Thu, Fri (3 days).  
      - Credence quiz is Wed: \(P(\text{open Wed}) \times P(D = \text{Wed} \mid D \in \{\text{Wed, Thu, Fri}\}) = 0.5 \times (1/3) \approx 0.167 \leq 0.5\).  
      - Surprise holds.  
  - **Quiz on Monday (next week) example**:  
    - Assume entire week closed. \(D\) could be any Mon-Fri (all closed).  
    - **Sunday evening**: Possible \(D\): All 5 days.  
      - Quiz occurs next Mon if open.  
      - Credence: \(P(\text{open Mon}) \times P(\text{first open after } D \text{ is Mon} \mid \text{history}) = 0.5 \times 1 = 0.5 \leq 0.5\) (since any \(D\) leads to Mon if open).  
      - Surprise holds.  
  - **General pattern**: On evening before day \(n\), credence \(\leq 0.5\):  
    - Within week: Credence = \((1 - q) \times \frac{|S| + 1}{|T|}\), where \(|T|\) is possible \(D\) days, \(|S|\) is days prior with continuous closure. At \(q = 0.5\), this \(\leq 0.5\) (e.g., Fri: max 0.5).  
    - Beyond week: Credence = \(1 - q = 0.5\).  
  - **Truth of announcement**: Quiz occurs eventually (probability 1), and surprise holds as credence never exceeds 0.5.

  ### Why Backward Induction Fails
  The backward induction fails at **every step** because there is no identifiable "last possible day." The induction requires a definite final day to start the base case (e.g., "If day \(N\) is the last day, students would know on day \(N-1\)"). Here, closures can always push the quiz to a later day. Even if students know the week ends Friday, a closure on Friday could postpone the quiz to Monday (or beyond), so Friday is never certain to be the last day. Thus, the base step never materializes, and the induction cannot begin. The failure is structural: the open-ended schedule (due to closure risk) removes the fixed deadline.

  ### Single Feature Doing the Work
  **The key feature is the possibility of daily school closures with no upper bound on postponement.** This ensures no day is certain to be the last possible quiz day.  
  - **Demonstration without closures**:  
    - Stipulate: No closures, quiz on one of Mon-Fri, all days occur.  
    - On Thursday evening, if quiz hasn't occurred, students know it must be Friday (credence = 1 > 0.5).  
    - Surprise fails for Friday → induction unravels (Thu credence forces prior steps to fail).  
    - Standard paradox reappears.  

  ### Objection from Self-Referential View and Response  
  **Objection**: A proponent of the "self-referential unknowability" view (e.g., that the announcement cannot be known due to circularity) might argue:  
  > "Your case avoids contradiction only by weakening 'surprise' to a probabilistic condition. In the original, surprise is about certainty (credence 1), leading to unknowability. Here, students 'know' the announcement only because uncertainty breaks the induction. This sidesteps the core issue: self-referential statements like 'this quiz is a surprise' are inherently unknowledgeable if they imply perfect prediction."  

  **Rebuttal and Insight**:  
  - The objection confuses *epistemic conditions*: The original paradox relies on certainty (credence 1 in no-quiz days), while this variant uses quantified uncertainty (credence ≤0.5). The operational definition of surprise (≤0.5) is satisfied without requiring the announcement to be "unknowable"—students rationally compute credences using the closure model.  
  - **Fundamental Issue**: The case shows the paradox is **at bottom about known finite deadlines**. With a fixed deadline (e.g., 5 days), induction forces a contradiction; without it (due to closure risk), induction starves. Thus, the paradox arises not from self-reference per se, but from the interaction of surprise with bounded time. Self-reference is a symptom, not the cause—eliminate the deadline, and the contradiction dissolves.  
  - **Minimality**: Closure risk is the minimal feature. Alternatives (e.g., uncertain number of days) risk reintroducing deadlines if students infer bounds. Closure risk cleanly ensures unbounded postponement with no upper limit inferable.
