  Let me brainstorm areas of agreement first. Both sides likely agree that complex mammals have moral status, thermostats don't, and insects are somewhere in between. The flicker case might be agreed as having discontinuous status only during episodes. The deep-feedback learner probably gets different interpretations - Thresholdists might see it as sophisticated but still sub-threshold, while Dimensionalists see it as having partial status due to temporal grip.

