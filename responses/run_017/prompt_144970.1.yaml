  I suspect the core disagreement isn't verbal - it's about whether status requires subjective unity (Thresholdist) or can emerge from cumulative capacities (Dimensionalist). The shape disagreement is step-function versus multidimensional ramp, but more fundamentally it's about additivity - whether multiple zero-status systems sum to anything.

  For the flicker case, both might agree it has status only during episodes, but disagree about whether that status is full or partial. The deep-feedback learner is perfect for testing temporal grip's moral significance - Thresholdists see it as complex avoidance but no subject, Dimensionalists see partial status from persistent self-monitoring.

