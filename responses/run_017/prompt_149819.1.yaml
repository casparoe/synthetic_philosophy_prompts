prompt: |-
  You are a professional moral philosopher who specialises in the moral emotions — guilt, shame, remorse — and in the social practices that cultivate them. Please think carefully, and begin by brainstorming the distinctions in play before you organise your answer; I would rather have a structured menu of options than one confident reading.

  I sit on a committee rewriting our professional body's disciplinary and restorative procedures. A consultant we brought in kept closing discussion down with the line 'guilt is about what you did, shame is about who you are', and used it to argue for two things: first, that our procedures should aim to elicit guilt and never shame — no public naming, no ritual that marks the person rather than the deed; second, that an institution or culture can simply choose which of the two emotions it cultivates, so that we can deliberately become a 'guilt culture' rather than a 'shame culture'. I am suspicious of both moves but cannot say precisely why.

  Take the slogan apart. What are the distinct precise claims it could be making — about the emotion's intentional object, about its representational content (what it 'says'), about what makes it apt or fitting, about its phenomenology, about its characteristic action-tendency (confession and repair versus concealment and withdrawal), about how local and how durable it is, or about which of the two is normatively in good standing? For each reading, say whether it is close to tautological, a plausible empirical generalisation, a substantive normative thesis, or straightforwardly false.

  Two complications I want addressed rather than smoothed over. First, the division looks less tidy than the slogan implies: people speak of being ashamed of some specific thing they did without concluding anything about their character, and of feeling guilty about what they are like — their motives, desires, or susceptibilities — with no particular deed in view. Does that undermine the readings, or can they be repaired to accommodate it? Second, and this matters most to me: for each reading, does it actually get the consultant his two conclusions? If shame does take the whole person as its object, does it follow that institutions must never appeal to it, given that a person is arguably partly constituted by what they have done? And does anything in the slogan support the thought that which emotion a culture reliably produces is a matter of choice, rather than of history, hierarchy, and the credibility of whichever audience does the shaming?

  Lay the readings out as a numbered list with a verdict on each, and close by saying which single reading — if any — the consultant would need in order to reach his recommendations, and how defensible that reading is.
reasoning: |-
  Okay, the user is on a committee rewriting disciplinary procedures and has a consultant pushing the idea that guilt is about actions while shame is about identity. The consultant argues that procedures should only induce guilt, avoiding shame entirely. The user is skeptical but can't pinpoint why. 

  First, I need to unpack the consultant's slogan: "Guilt is about what you did, shame is about who you are." This sounds neat, but emotional experiences are messier. People sometimes feel shame for specific actions without questioning their entire identity, or feel guilt about their character traits. The slogan might oversimplify.

  The user wants me to dissect possible interpretations across different dimensions: intentional object, representational content, fittingness conditions, phenomenology, action tendencies, durability, and normative status. For each, I should classify it as tautological, empirical, normative, or false. 

  Let me brainstorm interpretations dimension by dimension. For intentional object, is guilt really only about acts while shame targets the self? Research shows shame can focus on specific failures, not just global self. That makes the strict reading problematic. 

  Regarding representational content, does guilt literally say "I did bad" while shame says "I am bad"? Even if this captures tendencies, people often experience hybrid or ambiguous versions. Calling it a generalisation seems fair but with caveats. 

  For fittingness, is shame only apt if the whole self is flawed? That feels normatively loaded - why shouldn't a habitual wrongdoer feel shame? The consultant seems to sneak in values here. 

  Phenomenologically, shame does feel more consuming than guilt, but this is a tendency, not a rule. Action tendencies show clearer divergence: guilt leans toward repair, shame toward hiding. This part holds up best empirically. 

  Durability and locality are tricky too. Shame might linger longer but depends on context. Normatively, declaring guilt always better than shame seems like a value judgment, not a given. 

  Now the user's two big concerns: First, the messy reality of emotions undermines clean splits. We can salvage the distinctions by calling them prototypes rather than absolutes. Second, even if we accept shame targets the self, that doesn't automatically condemn institutional use - especially if actions reveal character. And cultures can't just flip emotional frameworks; they're built on power structures and histories. 

  The consultant needs the strict intentional object reading plus the normative claim that targeting the self is always bad. But both are shaky. The object distinction isn't airtight, and rejecting all shame ignores that some deeds truly reflect the self. 

  Ultimately the consultant's recommendations rest on overgeneralizations. Institutions should probably use both emotions carefully - avoiding destructive shame while recognizing that guilt alone may not address deeper issues. The key is designing processes that allow reintegration after accountability.
answer: |-
  Here's a systematic breakdown of the consultant's slogan "guilt is about what you did, shame is about who you are," evaluating distinct readings and their implications for his recommendations:

  **Key Dimensions & Readings:**

  1.  **Intentional Object:**
      *   *Claim:* The *focus* or *target* of guilt is a specific action/inaction ("I did X"). The *focus* or *target* of shame is the entire self/core identity ("I *am* Y").
      *   *Verdict:* **Plausible Empirical Generalization, but Overstated.** While guilt *typically* crystallizes around discrete acts and shame *often* feels more global, the distinction isn't absolute (as your complication notes: ashamed *of* an act, guilty *about* a trait). It describes a strong tendency, not a strict rule.
      *   *Supports Consultant?* **Partially, but weakly.** If shame *tends* to target the self, avoiding practices triggering it seems prudent. However, it doesn't *necessitate* banning all such practices, nor prove shame is *always* about the global self.

  2.  **Representational Content:**
      *   *Claim:* The core *cognitive appraisal* or "message" of guilt is "I committed a bad/wrong *act*." The core appraisal of shame is "I *am* a bad/worthless/flawed *person*."
      *   *Verdict:* **Plausible Empirical Generalization, but Overstated.** This captures a dominant experiential difference. Guilt focuses on the deed's wrongness; shame focuses on the self's inadequacy or unlovability in the eyes of (real or imagined) others. Yet, appraisals can blend ("That act shows how rotten I am").
      *   *Supports Consultant?* **More Strongly.** If shame reliably carries the message "I am bad," institutions promoting this message seem ethically dubious and counterproductive to restoration. This directly fuels the "never elicit shame" argument.

  3.  **Fittingness Conditions (Aptness):**
      *   *Claim:* Guilt is *fitting* or *appropriate* solely in response to a wrongful *action*. Shame is *fitting* or *appropriate* solely in response to a flawed *self/character*.
      *   *Verdict:* **Substantive Normative Thesis (and likely False).** This imposes a normative judgment on when these emotions *should* be felt. It assumes: (a) acts and character are neatly separable, (b) one's character is fixed and global, (c) shame is *only* fitting for character flaws. This is highly contestable. Shame can be apt for actions revealing deep character flaws *or* for betraying core values/identities, even if the self isn't globally "bad." Conversely, guilt *can* be apt for patterns revealing character.
      *   *Supports Consultant?* **Crucially, but it's his weakest link.** His second recommendation ("choose a guilt culture") heavily relies on this normative claim that shame is *never* fitting in disciplinary contexts (because only acts, not selves, should be judged). This ignores that serious professional misconduct often *does* reflect character deficiencies worthy of emotional response beyond mere act-focused guilt. Arguing shame is *never* apt for disciplinary matters is a strong, unsubstantiated normative stance.

  4.  **Phenomenology:**
      *   *Claim:* The *subjective experience* of guilt is primarily painful regret focused on the deed. The *subjective experience* of shame is primarily a painful sense of exposure, inadequacy, and desire to hide/disappear focused on the self.
      *   *Verdict:* **Plausible Empirical Generalization.** This is well-supported by psychological research. Guilt feels more focused and potentially mobilizing; shame feels more overwhelming, self-annihilating, and paralyzing.
      *   *Supports Consultant?* **Indirectly.** The paralyzing nature of shame suggests it hinders constructive engagement with disciplinary/restorative processes, supporting the argument to avoid *eliciting* it institutionally. It doesn't directly address *target* or *fittingness*.

  5.  **Characteristic Action-Tendency:**
      *   *Claim:* Guilt motivates *confession, repair, and making amends* ("I must fix this"). Shame motivates *concealment, withdrawal, avoidance, and defensiveness* ("I must hide/escape this").
      *   *Verdict:* **Strong Empirical Generalization.** This is one of the most robust findings distinguishing guilt and shame. Guilt promotes prosocial, reparative behavior. Shame promotes antisocial, avoidant behavior.
      *   *Supports Consultant?* **Very Strongly.** This provides the clearest *pragmatic* argument for the consultant's first point. If the goal of disciplinary/restorative procedures is accountability, learning, and reintegration, eliciting guilt (promoting repair) is functional, while eliciting shame (promoting avoidance/defensiveness) is counterproductive.

  6.  **Durability & Locality:**
      *   *Claim:* Guilt is more *local* (attached to the specific act) and thus more *transient* (eases after repair). Shame is more *global* (attached to the self) and thus more *durable* and *resistant* to resolution.
      *   *Verdict:* **Plausible Empirical Generalization.** Shame's link to core identity often makes it more persistent and less easily resolved by specific actions. Guilt, tied to a discrete act, often resolves with reparation. However, unresolved guilt can fester, and shame *can* be alleviated.
      *   *Supports Consultant?* **Indirectly.** The potential for shame to be long-lasting and debilitating reinforces the pragmatic argument against institutionally inducing it, aligning with restorative goals of resolution and reintegration.

  7.  **Normative Standing:**
      *   *Claim:* Guilt is *morally good/healthy/productive*; shame is *morally bad/unhealthy/destructive*.
      *   *Verdict:* **Substantive Normative Thesis (Overly Simplistic).** This is a value judgment. While shame's link to avoidance makes it *riskier* and *less functionally useful* in restorative contexts, it's not inherently "bad." Shame can signal deep value violations, motivate profound self-reflection, and be a catalyst for genuine character change. Guilt can be excessive, neurotic, or manipulated.
      *   *Supports Consultant?* **Directly, but Questionable.** His entire argument assumes this normative hierarchy. While the *action-tendency* gives a strong pragmatic reason to *prefer* eliciting guilt in *this context*, declaring shame inherently morally bad is a strong, contestable claim not entailed by the other distinctions.

  **Addressing Complications:**

  1.  **"Messy" Usage (Ashamed of act, Guilty about trait):** This doesn't destroy the distinctions but highlights they are **prototypical** rather than absolute. We can interpret "ashamed *of* an act" as the act being experienced as a revelation or confirmation of a flawed self (even if temporarily/contextually). "Guilty *about* a trait" often involves the trait leading to specific harmful acts or failures to act. The slogan captures the *core, paradigmatic* focus.
  2.  **Institutional Use & Shame's Object:** Even if shame targets the "whole person," it does **not** automatically follow institutions must *never* appeal to it.
      *   *Counter:* As you note, a person *is* partly constituted by their actions, especially repeated or egregious professional misconduct. An institution *is* arguably justified in focusing on the character flaw *revealed* by the act, not just the act in isolation. The key is whether the process *reinforces* a global, fixed, irredeemable "bad self" or focuses on the *specific failing* (e.g., dishonesty, negligence) as something *addressable* within the person. Avoiding *dehumanizing* shame is crucial; avoiding *all* focus on character is arguably naive.
  3.  **Cultural Choice:** **The slogan provides NO support for the claim that cultures can simply "choose" which emotion to cultivate.** This claim is **Straightforwardly False** as an oversimplification.
      *   Emotions are shaped by deeply embedded factors: social structures (hierarchy, individualism/collectivism), power dynamics (whose judgment matters?), historical narratives, religious traditions, economic systems, and the *credibility* of the judging audience/institution. A professional body might *aspire* to foster guilt, but its success depends entirely on whether its procedures, culture, and societal context make guilt a credible, functional, and respected response. Imposing a "guilt culture" top-down, ignoring existing social realities and power structures, is likely futile or even counterproductive. Cultivating guilt effectively requires building trustworthy, fair institutions focused on repair – it's not a simple switch.

  **The Consultant's Necessary Reading & Defensibility:**

  *   **To reach his conclusions, the consultant critically relies on a specific combination:**
      1.  **A strong interpretation of the Intentional Object/Representational Content distinction** (Shame *fundamentally and always* targets the global self with the message "I am bad").
      2.  **The Action-Tendency distinction** (Shame *reliably* leads to destructive avoidance).
      3.  **A specific Substantive Normative Thesis regarding Fittingness/Normative Standing** (Shame targeting the self is *never* fitting or morally acceptable for an institution to elicit in response to professional misconduct; only guilt focused on acts is acceptable and productive).

  *   **Defensibility:**
      *   **(1) Strong Object/Content Claim:** Overstated/Not Absolute (Verdict: Plausible Generalization, but Overstated). It's a tendency, not an iron law.
      *   **(2) Action-Tendency:** Strong and Defensible (Verdict: Strong Empirical Generalization). This is the consultant's strongest point pragmatically.
      *   **(3) Normative Thesis (Shame Never Fitting/Always Bad):** **Weak and Highly Contested.** This is the crux. While the *risks* of shame (avoidance, paralysis) are real and justify caution, declaring it *never* fitting or *inherently* bad in institutional contexts ignores:
          *   That serious misconduct *can* legitimately reflect character flaws needing attention.
          *   The potential for "reintegrative shaming" (focusing condemnation on the *deed* while maintaining respect for the *person* and offering pathways back).
          *   That guilt alone might be insufficient for profound ethical failures touching identity.
          *   The cultural variability in shame experiences and functions.
      *   **Cultural Choice Claim:** Indefensible based on slogan alone (Verdict: Straightightforwardly False). It ignores deep structural and historical determinants.

  **Conclusion:**

  The consultant's catchy slogan captures important *tendencies*, particularly regarding action-tendencies and phenomenology, which provide a strong *pragmatic* case for designing procedures that minimize eliciting destructive, avoidant shame and instead foster guilt leading to repair. However, his **absolute distinction between "act" and "self" is overstated**, and his **normative claim that shame is *never* fitting or acceptable for institutions to engage with is highly questionable and unsupported by the slogan.** Furthermore, his claim that a culture can simply "choose" its dominant emotion **ignores profound social realities and is indefensible.** You are right to be suspicious. A defensible approach would focus on minimizing *maladaptive, stigmatizing shame* while fostering *constructive accountability* (which may involve elements of guilt *and* carefully managed, reintegrative forms of shame focused on specific failures), acknowledging that institutional design interacts with complex pre-existing social and psychological structures.
