            - Example: the signal is a byproduct of a physical attribute (e.g., size) and we can see that attribute and the signal, and the constraint is self-evident (but this is rare; usually not self-evident).
            - If you can clearly see the physical constraint -> tag: `index`.
            - If not -> go to step 4b.
        b. **Handicap?**
            - Is there immediate cost observed in the clip?
            - Look for:
               - Predation: a predator attacks the signaller during or immediately after the signal.
               - Aggression: a rival attacks the signaller.
               - Exhaustion: the signaller shows clear signs of fatigue (e.g., labored breathing, cannot continue, collapses) after the signal.
               - And the cost is borne by the signaller (we see it happening to them).
            - If yes -> tag: `handicap`.
            - If no -> tag: `signal_reliability_unsecured`.

     Additional notes:
     - We do not code cost type (one-time vs per-display) because we cannot tell from one clip.
     - We do not code if the cost is marginal and differential (requires variation we don't have).
     - We do not code cost in different currencies (requires experiments).
     - Cost borne by others: if we see the cost being incurred by another individual (e.g., parent feeding during begging), then we note it in a comment, but the tag remains `handicap` if we see cost in the clip. However, the cost to the parent might not be immediate in the clip (they might have flown off to get food). So we might not see it. Therefore, we only code immediate cost observed in the clip.

     Now, run on examples:

     Example 1: Gazelle stotting, no predator in frame.
        - Step 1: No receiver -> `uncodeable`.

     Example 2: Nestling birds begging.
        - Assume receiver (parent) is in frame and we see feeding response.
          - Step 1: Yes (receiver)
          - Step 2: Directed and response -> `signal`
          - Step 3: Codebook lookup: if begging is in codebook as `handicap`, then tag `handicap`.
            But note: the cost is not immediate in the clip? We see the parent feeding, which is a cost to the parent, but not an immediate cost to the nestling. Also, no predation in the clip.
            Without codebook, step 4:
              4a. Not an index (no physical constraint evident) -> go to 4b.
              4b. Immediate cost? We don't see the nestling being exhausted or attacked. -> `signal_reliability_unsecured`.
            The user might not like this, but it's honest.

     Example 3: Frog call, receiver in frame (say a female approaches).
        - Step 1: Yes
        - Step 2: Signal (receiver responds by approaching)
        - Step 3: Codebook: if not in codebook, then step 4.
          4a. Index: if we see the frog's size and hear the pitch, but without knowing the constraint, we cannot -> not index.
          4b. Handicap: if we see a predator attack or the frog is exhausted -> if not, then `signal_reliability_unsecured`.
          But if we see the frog calling repeatedly and then stopping to rest (exhaustion), then `handicap`.

     However, the frog call might be both. We don't have a tag for both. So we might need to allow multiple tags or a compound tag.

     Revised tag set to allow for combination:
     - `index`
     - `handicap`
     - `index_and_handicap` (for when both apply)

     But in step 4, we might only assign one. So if we see evidence of handicap, we assign `handicap` and note that it might also be an index, but we didn't see evidence for that.

     Alternatively, we can assign both if we see evidence for both. But for index, we rarely see evidence.

     Given the procedure, it's safer to assign only what we see.

     **Which distinctions are load-bearing and which to drop?**

     Drop as too fine-grained for undergrad coders with limited time and only observational data:
        - One-time vs per-display cost (cannot be observed in one clip).
        - Marginal and differential cost (requires variation across individuals and signal intensities).
        - Cost in different currencies (requires experiments and common currency).
        - Cost borne by others: we can note if we see it, but not as a separate tag. It can be a comment.
        - The difference between index and handicap when not in the codebook will rarely be made, so they will often end up as `signal_reliability_unsecured`.

     Load-bearing:
        - Presence of receiver (essential for coding as signal).
        - Directedness or response (to distinguish signal from cue).
        - Immediate cost observed (for handicap).

     The procedure will misfire:
        - When a signal is an index but the physical constraint is not observable, it will be misclassified as `signal_reliability_unsecured`.
        - When a signal is a handicap but the cost is not immediate (e.g., long-term predation risk not realized in the clip), it will be missed.
        - When there is a receiver off-camera, the signal will be marked `uncodeable` even if it is one.

     But these are honest limitations.

     **Final Decision Tree:**

     Tags: 
       - `not_a_signal`
       - `signal` (but then with subtypes, so we don't use this alone)
       - `index`
       - `handicap`
       - `index_and_handicap` (if the codebook says both)
       - `signal_reliability_unsecured`
       - `uncodeable`

     Steps:

     1. **Receiver present in frame?**
          - No: `uncodeable` (because cannot determine if signal).
          - Yes: go to 2.

     2. **Is it a signal?**
          - Check if directed at receiver and/or receiver responds.
          - Yes: go to 3.
          - No: `not_a_signal`.
          - Unsure: `uncodeable`.

     3. **Consult codebook (expert-provided) for this species and behavior.**
          - If codebook entry exists: assign the specified tag (`index`, `handicap`, `index_and_handicap`, or `signal_reliability_unsecured`).
          - If no entry: go to 4.

     4. **Assess from clip:**
          a. **Evidence for index?** 
               - Only if the signal is a direct physical consequence of an observable trait and the constraint is evident (e.g., a small animal cannot produce a large sound, and we see it trying and failing? but we don't usually see failure). In practice, almost never -> usually no.
               - If miraculously yes: `index`.
               - Else: go to b.
          b. **Evidence for handicap?**
               - Immediate cost observed: predator attack, rival attack, clear exhaustion.
               - Yes: `handicap`.
               - No: `signal_reliability_unsecured`.

     **For the examples again with this tree:**

     Example 1: Gazelle stotting, no predator -> `uncodeable`.

     Example 2: Nestling begging, with parent in frame and feeding.
          - Step 1: Yes (receiver present).
          - Step 2: Signal (directed and response).
          - Step 3: If in codebook as `handicap`, then `handicap`. Otherwise, step 4:
              4a: Not index -> go to 4b.
              4b: Immediate cost? If we see a predator attack the nest or the nestling collapse from exhaustion, then `handicap`. Otherwise, `signal_reliability_unsecured`.

     Example 3: Frog call, with receiver.
          - Step 1: Yes.
          - Step 2: Signal (receiver responds).
          - Step 3: If in codebook as `index_and_handicap`, then that. Otherwise, step 4:
              4a: If we can see the physical constraint (unlikely) -> `index`. 
              4b: If we see immediate cost (predator attacks or frog exhausts) -> `handicap`. 
              If neither -> `signal_reliability_unsecured`.

     The procedure is honest but will often result in `uncodeable` or `signal_reliability_unsecured`.

     **Recommendation to the expert:**
     - Create a codebook for common species and signals in the archive, based on your knowledge, to avoid uncodeable for known cases.
     - Accept that without experiments, many clips will be uncodeable or unsecured, which is better than wrong tags.

     This procedure should take 2-3 minutes per clip.
answer: |-
  Below is a decision tree designed for your constraints (observational footage only, no experiments, 2-3 minutes per clip). It prioritizes **observable evidence** from the footage and defaults to "uncodeable" when critical information is missing. The tag set is revised for clarity:

  ### Revised Tag Set
  1. **`not_a_signal`**: Behavior is either a cue or non-informative (no directedness/response observed).  
  2. **`conventional_signal`**: Reliable through low-cost convention (e.g., arbitrary display).  
  3. **`index`**: Reliability enforced by physical constraints (physics/physiology).  
  4. **`handicap_signal`**: Reliability enforced by *immediate*, *observable* cost paid during the display.  
  5. **`uncodeable`**: Insufficient evidence to categorize (with notes on why).  

  *Tags dropped*:  
  - `costly-or-handicap` (split into `index`/`handicap_signal`).  
  - `signal-reliability-unsecured` (replaced by `conventional_signal` for "cheap" signals).  
  *Why?* Costly signaling requires observable cost; if unobservable, it defaults to conventional or uncodeable. "Differential cost" and "who bears cost" are excluded (too fine-grained; see **Misfires & Limitations**).

  ---

  ### Decision Tree  
  **Each step must be answered based ONLY on footage.**  
  **(✔️ = Sufficient yes; ❌ = Hard no; ⚠️ = Uncodeable; 🔶 = Requires expert call for codebook)**  

  1. **Is there a receiver in the frame?**  
     - ❌ **No** → Tag: `uncodeable` (note: "No receiver to confirm signal").  
     - ✔️ **Yes** → Proceed to 2.  

  2. **Is the behavior directed at a receiver OR followed by a receiver response?**  
     - *Directed*: Body orientation/gaze toward receiver, display ritualized (e.g., gazelle stotting *at* predator).  
     - *Response*: Receiver reacts (e.g., predator flees, parent feeds nestlings).  
     - ❌ **No** (undirected, no response) → Tag: `not_a_signal`.  
     - ⚠️ **Unsure** → Tag: `uncodeable` (note: "Ambiguous signal intent").  
     - ✔️ **Yes** → Proceed to 3.  

  3. **Is the signal’s reliability enforced by physical constraints?**  
     - *Criteria*: Signal is mechanically linked to a trait (e.g., pitch determined by body size, color by diet). Must be observable in clip (e.g., small size + high-pitched call).  
     - 🔶 **Not sure** → **Expert call needed**: Add to codebook if species/behavior is known index (e.g., frog call pitch).  
     - ✔️ **Yes** (constraint observable) → Tag: `index`.  
     - ❌ **No** → Proceed to 4.  

  4. **Is there immediate, observable cost paid DURING the display?**  
     - *Criteria*: Cost must be:  
       a. **Paid now** (not sunk: e.g., energy expenditure, not pre-grown antlers).  
       b. **Observable** (e.g., predator attack post-display, exhaustion, missed foraging).  
       c. **Borne by signaller** (e.g., not parent provisioning offspring).  
     - ✔️ **Yes** (e.g., predator attacks caller) → Tag: `handicap_signal`.  
     - ❌ **No** → Proceed to 5.  

  5. **Is the signal low-cost and conventional?**  
     - *Criteria*: No physical constraints (step 3) and no observed cost (step 4).  
     - ✔️ **Yes** → Tag: `conventional_signal` (reliability unsecured).  
     - ⚠️ **Unsure** → Tag: `uncodeable` (note: "Cost/constraint unconfirmable").  

  ---

  ### Applied to Your Examples  
  **Clip 1: Gazelle stotting, no predator in frame**  
  - Step 1: ❌ No receiver → `uncodeable` (note: "No receiver to confirm signal").  
  - *Experiment needed*: Playback stotting to predators to test response.  

  **Clip 2: Nestling birds begging**  
  - Step 1: ✔️ Receiver (parent) present.  
  - Step 2: ✔️ Directed (gaping) and response (feeding).  
  - Step 3: ❌ Not index (no physical constraint; any nestling can beg).  
  - Step 4: ❌ **No immediate cost to nestling** (cost is to parents or long-term predation; not observable in clip).  
  - Step 5: ✔️ Low-cost → `conventional_signal`.  
  - *Why you won’t like this*: Begging is often called "honest" due to differential costs, but your procedure requires *observable* cost. Without seeing energy drain/predation, it defaults to "conventional."  

  **Clip 3: Male frog call, receiver present**  
  - Step 1: ✔️ Receiver (e.g., female) present.  
  - Step 2: ✔️ Directed/response (e.g., female approaches).  
  - Step 3: 🔶 **Expert call needed**: If codebook lists pitch-size as index (physical constraint), tag `index`.  
  - Step 4: If not index, check for cost. If predator attacks/exhaustion seen → `handicap_signal`. Else → `conventional_signal`.  
  - *Handling "both"*: If codebook says "index," tag as such. Costly effects (predation) are secondary unless observed.  

  ---

  ### Misfires & Recommendations  
  **Load-bearing distinctions (keep):**  
  - **Receiver presence** (critical for signal vs. cue).  
  - **Immediate cost** (separates handicaps from conventions/indices).  
  - **Physical constraints** (indices are reliably falsifiable).  

  **Drop these (too fine-grained):**  
  - **Marginal/differential cost**: Requires comparing individuals/signal intensity (impossible per clip).  
  - **Sunk vs. recurring costs**: Cannot distinguish without developmental data.  
  - **Cost borne by others**: Rarely observable (e.g., parent provisioning off-camera).  
  - **Currency conversion**: Philosophically important but empirically unworkable here.  

  **Where the procedure misfires predictably:**  
  1. **False `conventional_signal`**: When costs exist but are unobservable (e.g., begging energy costs). *Mitigation*: Use codebook for well-studied species.  
  2. **Underused `handicap_signal`**: Costs from receivers (e.g., rival attacks) are rare in clips. Expect ≤5% of clips to qualify.  
  3. **Overused `uncodeable`**: 50% of clips lack receivers. *Accept this*—better than false positives.  

  **Recommendations for your codebook:**  
  - Pre-tag common behaviors (e.g., "begging = `conventional_signal` unless cost observed"; "frog call pitch = `index`").  
  - Add a notes field for coders to describe ambiguities (e.g., "predator nearby but not attacking").  
  - Train coders on clear examples:  
    - `index`: Size-pitched calls, chemical signals (fixed by physiology).  
    - `handicap_signal`: Exhaustive displays with immediate collapse, predation events.  

  This tree honors Zahavi’s core idea (cost enforces honesty) while admitting when evidence is absent. It’s rigid by design—constraints demand conservatism.
