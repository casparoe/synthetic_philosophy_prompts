  - The activity uses a trivial theme (a simple verse) so the variations might feel arbitrary. This is a limitation. 

  **What to Say About Quality:**
  - In the debrief, acknowledge: "In the real world, a variation isn't just novel and recognizable; it also has to be appropriate to the context and have aesthetic or emotional resonance. But in this exercise, we're isolating the structural aspect of variation."

  **Adjustments for Time:**
  - If time is short, cut the reverse round to 10 minutes (only one group reports) or skip it. But it's important for showing multiple knob-sets. 
  - Alternatively, reduce the number of variations per group to 3 (so 12 total) and only present one per group for voting (so 4-5 points on the graph). Then the reverse round can be done with the entire set of one group (each group gets one set of 3 from another group).

  **Facilitator Script:**

  Introduction (5 minutes):
  "Welcome! Today we're going to play a creative game. I have a simple four-line verse here [display on board]. Your task, in small groups, is to create variations of this verse. A variation should be clearly related to the original but changed in some way. You can change words, the meaning, the structure, the tone — anything. The goal is to create something that feels both new and yet connected to the original. We'll then share and vote on the variations. You'll have about 20 minutes to generate at least four variations per group. Write each variation on a separate index card. Any questions? Okay, let's form groups of about four."

  During group work (circulate and prompt):
  "Try to make each variation a different kind of change. What else can you change besides the animal? What about the mood? The structure? The point of view?"

  Voting setup (after collecting and shuffling variations, and posting them):
  "We are going to vote on two dimensions for each variation. First, how recognizable is it as a variation of the original theme? On a scale of 1 to 5, where 1 is not at all and 5 is very much. Second, how surprising is it? How unexpected or novel? Also 1 to 5. We'll do this for each variation by show of hands. I'll read a variation, then ask for recognizability votes, then surprise votes. We'll plot the average on the board."

  Reverse round:
  "Now, each group will get a set of variations that one other group created. Without knowing the original, look at these variations and try to guess: what was the original verse? And what were the main ways the group changed it to create these variations? What knobs did they turn? Write down your guess of the original and the knobs. You have 5 minutes."

  Debrief:
  "Let's look at the plot. What do you notice? [Discuss] Some variations are high in both recognizability and surprise — that's the sweet spot. Others are recognizable but not surprising — that might be when you are turning a knob we've already seen. And some are surprising but not recognizable — they might have gone too far. 

  During the activity, how did it feel when you were changing the verse? When did you feel like you were just making small tweaks? When did you feel like you discovered a whole new way to change it? 

  In creativity research, we talk about 'knobs' or 'sliders' — dimensions along which you can vary a theme. The act of creativity often involves discovering a new knob. 

  In the reverse round, did you find that more than one set of knobs could explain the same variations? That shows that the theme isn't a fixed thing with fixed knobs — the knobs are in the eye of the beholder."

  **Final Note:**
  This activity should make the knob model tangible. It won't produce great art, but it will show the mechanics of variation. The debrief is crucial to connect the experience to the theory.
answer: |-
  ### Activity Design: "Knob Quest"  
  **Seed Theme Choice:** The four-line verse.  
  *Why?* It's accessible (no musical literacy), allows rapid ideation, and social scripts/toasts might feel too abstract. The verse's simplicity ensures focus on variation mechanics without performance pressure.  

  **Core Mechanics:**  
  - Groups generate variations by altering the verse.  
  - Two-axis voting (recognizability vs. surprise) reveals the "knob decay" effect.  
  - Reverse round forces confrontation with multiple knob interpretations.  

  ---

  ### Rules, Materials, and Roles  
  **Materials:**  
  - Whiteboard (pre-drawn with 2x2 grid: *Recognizable?* X-axis, *Surprising?* Y-axis, both 1–5).  
  - Sticky dots (two colors: **blue** for recognizability, **red** for surprise).  
  - Index cards (for writing variations).  
  - Seed verse printed on cards:  
    > *The sky is bright and blue,*  
    > *The grass is wet with dew.*  
    > *I walk a quiet street,*  
    > *With nothing much to do.*  

  **Roles:**  
  - **Facilitator (you):** Guides timing, frames prompts neutrally, records votes.  
  - **Groups:** 4–5 teams of 3–4 students (pre-assigned to mix disciplines).  

  ---

  ### Timeline (90 Minutes Total)  
  #### Phase 1: Framing & Variation Generation (25 min)  
  - **0–5 min: Intro (Script Below)**  
  - **5–20 min:** Groups generate **6 variations** of the seed verse. *Rules:*  
    - Each variation must change ≥1 thing (word, structure, tone, etc.).  
    - No two variations can use the *same type* of change (e.g., if one changes nouns, the next can’t *only* change nouns).  
  - **20–25 min:** Groups select their **top 3 variations**, write them on index cards.  

  #### Phase 2: Voting & Plotting (25 min)  
  - **25–30 min:** Collect cards. Shuffle and number them (e.g., V1–V15). Read each aloud.  
  - **30–40 min: Silent Voting**  
    - Each student gets **3 blue dots** (recognizability) and **3 red dots** (surprise).  
    - After hearing each variation, students place one dot per axis on the grid:  
      - **Blue (X):** How recognizable as the seed? *(1 = unrelated, 5 = obvious)*  
      - **Red (Y):** How surprising? *(1 = boring, 5 = mind-blowing)*  
    *Example:* A funny football-chant version might get (5, 5); a minor word swap (4, 1).  
  - **40–50 min:** Facilitator plots averages on the grid. Discuss emergent patterns:  
    > *"Look at V3 and V8—both changed the setting. Why did V3 score higher on surprise?"*  

  #### Phase 3: Reverse Round (20 min)  
  - **50–55 min:** Redistribute cards—each group gets **another group’s 3 variations** (without the seed).  
  - **55–65 min:** Groups brainstorm:  
    - What was the **original seed verse**?  
    - What **"change types"** (knobs) did the creators use?  
  - **65–70 min:** Groups share guesses. Reveal true seeds/knobs. Highlight mismatches:  
    > *"Group A thought the knob was ‘genre,’ but Group B said ‘rhythm’—both fit!"*  

  #### Phase 4: Debrief (20 min)  
  - **70–80 min:** Facilitator-led discussion:  
    - **Map moments to Hofstadter’s model:**  
      - *"When Group 3 replaced nouns with emojis, you invented a new knob. But when Group 5 did similar word swaps, it felt flat—even if the words were new. That’s knob decay."*  
      - *"In the reverse round, you saw the seed isn’t fixed—it’s defined by the knobs you discover."*  
    - **Terminology:** Have students name the "change types" they found (e.g., "twists," "levers"). *Then* reveal Hofstadter’s "knobs."  
  - **80–85 min:** Discuss the grid:  
    - Clusters in the top-right (high recognizability, high surprise) = "sweet spot."  
    - Lower-left = "dead zone" (too derivative or unrecognizable).  
    - Early-numbered variations dominate high-surprise votes = "knob decay."  
  - **85–90 min:** Conclusion:  
    > *"Creativity isn’t about ‘new’ ideas—it’s about discovering new knobs. Once a knob is found, turning it further rarely surprises."*  

  ---

  ### Facilitator Script (Intro)  
  > *"Today, we’re playing a game about creativity. Here’s a simple verse [display seed]. In groups, you’ll create altered versions of it—change whatever you want, but each change must make it feel like a deliberate twist on the original. Your goal? Make versions that feel fresh but still connected. We’ll vote on the best later. No need to perform—just write. Go!"*  
  *Key:* Avoid "knobs," "dimensions," or "variations." Use "changes," "twists," "versions."  

  ---

  ### Predictable Problems & Solutions  
  1. **Class Clown Derails:**  
     - *Problem:* Submits absurd variations (e.g., "The sky is drunk and high...").  
     - *Solution:* Use voting to self-correct (low recognizability/surprise scores show disconnection). Redirect: *"Fun—but how could this relate clearer to the seed?"*  

  2. **Subgroup Converges on One Joke:**  
     - *Problem:* All variations become "dark mode" (e.g., *"The sky is black with spite..."*).  
     - *Solution:* Enforce the rule: *"Each variation must use a different type of change."*  

  3. **Off-Theme Submissions:**  
     - *Problem:* A variation ignores the seed (e.g., a love poem).  
     - *Solution:* Let voting expose it (low recognizability). Ask: *"What’s the link to the original? If it’s not clear, revise."*  

  4. **Voting Gamed:**  
     - *Problem:* Friends rate each other’s work highly.  
     - *Solution:* Anonymize submissions (numbered cards), shuffle before reading.  

  5. **Quiet Students Disengage:**  
     - *Problem:* Introverts hesitate to share ideas aloud.  
     - *Solution:* Assign roles in groups (e.g., "scribe," "idea collector"). Use written index cards for low-pressure input.  

  ---

  ### What the Activity Can’t Deliver  
  - **Why Some Variations Are *Good* (Not Just Novel):** The knob model doesn’t explain aesthetic quality. A variation might be surprising and recognizable but fall flat (e.g., forced humor).  
    - *Fix:* **Say this in debrief:** *"Surprise and recognizability are necessary but not sufficient. A ‘good’ variation also resonates emotionally or contextually—something we’d need weeks, not minutes, to unpack."*  
  - **Deep Knob Exploration:** 90 minutes limits how many knobs groups can discover.  
    - *Sacrifice:* Skip the reverse round if short on time. *Why?* The voting grid already shows knob decay; the reverse round reinforces interpretation but isn’t essential.  

  ---

  ### Why This Works  
  - **Knob Discovery vs. Turning:** The rule forbidding repeated change types forces new knobs. Students *feel* the difference: inventing a knob (e.g., "sing it like a robot") feels exciting; tweaking it (e.g., "robot voice but slower") feels flat.  
  - **Knob Decay Visible:** Early variations dominate high-surprise votes, even if later ones are more extreme. The grid shows this decay as a downward trend in surprise scores for similar knobs.  
  - **Theme Fluidity Proven:** Reverse round reveals multiple knob-sets fit the same variations—proving the theme isn’t fixed.  

  **Output:** You’ll get a grid showing dead zones (low/low), sweet spots (high/high), and knob decay (high surprise early, dropping off). Students leave feeling why "discovering a dial" matters more than "turning it."
