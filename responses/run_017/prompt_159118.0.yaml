prompt: |-
  So I got talked into volunteering with the county land trust last spring — mostly weekend plant surveys — and somehow I've ended up being the person who has to write the rare-species justification for a 60-acre bog the trust is trying to buy before a developer does. Whether we get the state grant pretty much comes down to whether the retired state naturalist (Dave, who more or less *is* the state list, been at it since the 80s) says there's a listable species on the parcel. I've been going back thru twenty years of his site reports trying to reverse-engineer his rule, and I can fit most of them but not all:

  - two woodland salamanders that look basically identical but are deeply divergent genetically and don't interbreed where their ranges meet: two species (he said something like morphology can go hang)
  - dogs and wolves: one species
  - two oaks, upland and bottomland, that hybridize all over a broad contact zone with tons of fertile hybrids, but each parent type stays recognizable and they're something like 95% distinct genome-wide: two species (the hybrid swarm doesn't seem to bother him)
  - two forms of a grass on and off serpentine soil in the same meadow, different flowering time, maybe 15–20% gene flow, genetically near-identical except for a couple of regions: one species, ecotypes
  - the local apomictic dandelion mess, hundreds of near-identical clonal lineages: one species (he is not naming four hundred dandelions)
  - a fern that started as a hybrid between two species, then doubled its chromosomes, can't breed with either parent, and lives in a different habitat: yes, real species
  - an isolated population of a common snake 200 miles from its nearest relatives, slightly different colour, would presumably interbreed if the habitat in between hadn't been plowed: subspecies at best
  - two forms of the same organism from a lake sediment core 8000 years apart with intermediates all the way through: he basically refused to answer, said species are things that can meet

  Here's our case. Two forms of a small white-flowered wetland plant (I'll call them the bog form and the ridge form) growing about 300 m apart with no barrier between them. The bog form flowers roughly three weeks earlier, has a narrower corolla, a different scent, and is visited almost entirely by one small specialist bee; the ridge form is visited by flies and generalist bees. In a common garden the height difference vanishes but the flowering-time and flower-shape differences stay. Hand crosses in either direction give fully fertile seed, and the F1s and F2s are fine in the greenhouse. In the field, markers say maybe 8–10% of the seeds near the contact are cross-sired; hybrids turn up almost only in a narrow ecotone band and set about a third as much seed as either parent, because pollinators basically ignore the intermediate flowers. A genome scan with a few thousand markers finds them near-identical genome-wide, with all the differentiation bunched into a handful of regions — flowering time, corolla shape, scent. And the kicker: a bog 25 km away has the same bog look and the same specialist bee, but genetically it sits closer to the ridge populations near *it* than to our bog form, so the bog thing looks like it's evolved at least twice.

  What I want: does Dave call this one species or two? More usefully — give me the two or three rules that fit all eight of his verdicts above, say what each one predicts about our bog, and tell me which one he's most likely actually running. I genuinely can't tell whether the oaks verdict means "gene flow doesn't matter as long as the gene pool holds its shape, because selection keeps knocking out the intermediates" (which would make ours two) or "there has to be genome-wide divergence, not just a few islands" (which, especially with the bog form arising twice, would make ours one). The serpentine grass looks annoyingly close to our case, and I'm not sure the pollinator switch plus the polyphyly is enough to distinguish them. Also: if I can only go measure one more thing this summer, what should it be, and what hypothetical case would settle which rule he's using if I ever get him to commit to one in writing?

  Be honest about confidence: I'd rather get "60/40, and here's the finding that would flip me" or "this is a coin flip and here's why the facts as you've described them underdetermine it" than a clean verdict. And if the framing is confused — say, if "what would Dave say" can't really be pried apart from "what the species concept ought to be here," or if I've set the case up so that no stable rule gives an answer — say that plainly rather than playing along and picking one.
reasoning: |-
  Okay, let's start by unpacking the user's problem. They need to predict whether Dave, the retired naturalist, would classify two forms of a wetland plant as one species or two for a conservation grant. The user has provided eight examples of Dave's past decisions and details about their plant case. 

  First, I need to analyze Dave's apparent rules from the examples. The woodland salamanders are two species despite looking identical because they don't interbreed. Dogs and wolves are one species, suggesting Dave prioritizes reproductive compatibility over domestication. The oaks are two species despite hybridizing because they maintain distinctiveness. The serpentine grass is one species despite some differentiation because gene flow is still significant. Apomictic dandelions are lumped together, showing practicality matters. The hybrid fern is a new species since it's reproductively isolated. The isolated snake is only a subspecies because it could interbreed if barriers were removed. The temporal forms aren't considered species because they can't interact.

  The key themes emerging are: reproductive isolation in sympatry, genomic distinctiveness beyond a few loci, and practical considerations like avoiding taxonomic inflation. For the user's plant case, the bog and ridge forms show pollinator-mediated isolation and reduced hybrid fitness, which might suggest two species. But their genomic similarity and polyphyletic origin complicate things. 

  Comparing to the serpentine grass, which Dave called one species, the main differences are the pollinator specificity and lower hybrid fitness in the plants. The repeated evolution of the bog form might make Dave see it as an ecotype rather than a true species. However, the oaks example shows hybridization doesn't preclude two species if distinctiveness is maintained. 

  The user's deeper need is to secure the grant, so they need a convincing argument. They might also want to understand Dave's reasoning to present data aligning with his criteria. If I were them, I'd measure hybrid fitness in the field to strengthen the reproductive isolation angle. Finding higher hybrid mortality or lower recruitment could tip the balance. 

  Confidence here is moderate (60/40) for two species, but the polyphyly is a big wrinkle. Dave might view the bog form as a recurring adaptation, not a unique lineage. The user should be prepared for either outcome and focus on measurable factors like hybrid viability. If possible, they should check if Dave has commented on similar cases.
answer: |-
  Based on Dave's pattern of decisions and the details of your bog plant case, here's the breakdown of likely rules, predictions, and your best path forward:

  **Dave's Likely Operating Rules (Extracted from the 8 Cases):**

  1.  **Reproductive Isolation in Sympatry Trumps Everything Else:** If two forms *can potentially interbreed* but *don't in practice where they co-occur* due to strong barriers (pre- or post-zygotic), and this maintains distinct entities, they are species. Morphology, genetics, and hybrid zones are secondary evidence *for* this isolation. (Salamanders, Oaks, Fern).
  2.  **Genomic/Population Cohesion Trumps Minor Differentiation:** If populations show significant gene flow and lack major barriers preventing homogenization *despite* some adaptive divergence, they are one species. Minor genetic differences or ecotypic variation aren't enough. (Serpentine Grass, Dogs/Wolves, Snake Subspecies).
  3.  **Practicality & Evolutionary Independence:** Avoid taxonomic inflation for minor variants or clones that aren't behaving as independent lineages in nature (Apomictic Dandelions). Recognize entities that are demonstrably evolving independently, even if recently derived (Fern).
  4.  **"Species are things that can meet":** This is key. Dave prioritizes the *contemporary interaction* (or lack thereof) in determining status. Lineages separated by time or space without potential for interaction aren't assessed the same way (Sediment Core Refusal).

  **Applying the Rules to Your Bog Plant:**

  *   **Rule 1 (Reproductive Isolation in Sympatry):** **Strong evidence for TWO species.**
      *   *Why:* They occur within 300m, no barrier. Hand crosses show *potential* compatibility, but *in the field*:
          *   Pre-zygotic isolation: Strong pollinator isolation (different visitors) + phenological isolation (3-week flowering difference) + floral differences (shape, scent). This explains the low (~8-10%) cross-siring *despite* proximity.
          *   Post-zygotic isolation: Hybrids have significantly reduced fitness (~1/3 seed set) due to pollinator avoidance. Hybrids are largely confined to a narrow ecotone.
          *   This pattern mirrors the **Oaks** (hybrid zone, maintained distinctness via selection/reduced hybrid fitness) and the **Salamanders** (lack of interbreeding where ranges meet). The low gene flow and reduced hybrid fitness maintain distinct entities where they co-occur. *Rule 1 Prediction: TWO SPECIES.*
  *   **Rule 2 (Genomic Cohesion):** **Evidence for ONE species.**
      *   *Why:* Genome scan shows near-identity except for a few adaptive islands (flowering time, corolla, scent). This looks very like the **Serpentine Grass** (different flowering time, minor genetic islands, some gene flow). The polyphyly (bog form evolving twice) strongly suggests this is a recurring ecotype adaptation, not a unique lineage. High greenhouse fertility and some field gene flow indicate the underlying genomic cohesion hasn't been broken. *Rule 2 Prediction: ONE SPECIES (Ecotypes).*
  *   **Rule 3 (Practicality/Independence):** **Mixed, leans ONE species.**
      *   *Why:* While they show signs of independence locally (isolation, reduced hybrid fitness), the polyphyly is a major red flag. Naming each locally adapted bog ecotype as a separate species whenever it pops up seems impractical and doesn't reflect deep evolutionary independence (unlike the allopolyploid fern). *Prediction: Leans ONE SPECIES.*
  *   **Rule 4 ("Things that can meet"):** **Evidence for TWO species.**
      *   *Why:* They absolutely *do* meet (300m apart)! And where they meet, they demonstrably *do not* merge into one panmictic population due to the strong isolating barriers. They interact by maintaining distinctness across a narrow hybrid zone. *Prediction: TWO SPECIES.*

  **The Conflict & Likely Verdict:**

  *   **Core Conflict:** Rule 1 (strong sympatric barriers) vs. Rule 2 (minimal genomic divergence & polyphyly).
  *   **Dave's Probable Priority:** Rule 1 (Reproductive Isolation in Sympatry) appears to be Dave's *primary* driver based on the Salamanders and Oaks cases. He dismissed morphology for the salamanders (Rule 1 isolation wins) and dismissed the hybrid swarm for the oaks (Rule 1 distinctness maintained wins). The Serpentine Grass lacked *strong* sympatric barriers despite differentiation (Rule 2 cohesion wins). The Snake lacked sympatry *and* strong intrinsic barriers (Rules 1 & 4).
  *   **Your Case vs. Serpentine Grass:** The critical differences are:
      1.  **Strength of Isolation:** Your plants have *multiple* strong pre-zygotic barriers (phenology, pollinators, floral traits) *plus* significant post-zygotic isolation (fitness reduction). The grass only had phenology and minor genetic islands.
      2.  **Hybrid Fitness:** Your hybrids have *low fitness* (~1/3 seed set). Grass hybrids presumably had normal fitness.
      3.  **Hybrid Zone Structure:** Your hybrids are confined to a narrow ecotone band. The grass likely had a more diffuse pattern of intermediates (implied by "gene flow").
  *   **The Polyphyly Wrinkle:** This strongly argues *against* deep evolutionary independence and *for* Rule 2/3 (ecotypes). However, Dave's acceptance of the allopolyploid fern (recent origin, new niche) shows he recognizes locally adapted, reproductively isolated entities *when they exist in the present*. The *current* sympatric isolation might outweigh the polyphyletic origin for him.
  *   **Confidence Level:** **60/40 in favor of Dave calling it TWO SPECIES.**
      *   *Why 60%:* The sympatric reproductive isolation is strong, multi-faceted, and directly analogous to his "wins" for two species (Oaks, Salamanders). The polyphyly is the biggest counter-argument, but his focus seems more on current dynamics.
      *   *What would flip it to ONE (40%)?* If Dave heavily prioritizes the polyphyly as proof it's "just" a recurring ecotype adaptation (like the serpentine grass but with a pollinator twist), or if he views 8-10% gene flow and greenhouse fertility as too high for true species status.

  **The One Thing to Measure This Summer:**

  *   **Measure: Hybrid Recruitment & Longevity in the Field.**
  *   **Why:**
      1.  **Crucial for Rule 1:** Seed set is one measure of fitness, but it's only the first step. Do F1 hybrids germinate and establish as well as parentals in the ecotone? Do they survive to flowering? Do *they* set seed? If hybrids have significantly reduced viability, growth, survival, *or* reproductive success compared to parentals *in their natural habitat*, it massively strengthens the argument for post-zygotic isolation and reduced gene flow, cementing Rule 1 (TWO species). If they perform fine, it weakens Rule 1 and favors Rule 2 (ONE species).
      2.  **Addresses the Hybrid Zone:** Quantifying hybrid fitness across life stages explains *why* the hybrid zone is narrow and why gene flow is only 8-10% despite proximity and fertility potential.
      3.  **Directly Comparable:** This is the kind of data implicit in the Oaks case (selection against hybrids maintaining distinctness) and lacking in the Serpentine Grass case (presumed normal hybrid fitness).

  **The Hypothetical Case to Settle Dave's Rule:**

  *   **The Case:** Two morphologically distinct forms in sympatry.
      *   **Scenario A:** Genome-wide Fst = 0.25 (high divergence), but no detectable pre- or post-zygotic barriers – hybrids form freely and are fully fertile and fit. Gene flow is high.
      *   **Scenario B:** Genome-wide Fst = 0.01 (very low divergence), but strong pre-zygotic isolation (e.g., pollinator specialization, phenology) *and* strong post-zygotic isolation (e.g., hybrid inviability or sterility) limiting gene flow to <1%.
  *   **What it Reveals:**
      *   If Dave says **A: ONE species, B: TWO species** -> He prioritizes **Rule 1 (Reproductive Isolation)** over genomic divergence. Your case (similar to B) is TWO species.
      *   If Dave says **A: TWO species, B: ONE species** -> He prioritizes **Rule 2 (Genomic Divergence)** over reproductive barriers. Your case (similar to B) is ONE species.
      *   (If he says A: TWO, B: TWO -> He's inconsistent; A: ONE, B: ONE -> He's a lumper ignoring isolation).

  **Conclusion:**

  While the polyphyly introduces significant doubt, the strength of the *sympatric reproductive isolation* in your bog plant case – phenology, pollinator specialization, floral divergence, low hybrid fitness/recruitment (implied), and a narrow hybrid zone – most closely aligns with the cases where Dave recognized two species (Oaks, Salamanders). His apparent prioritization of "things that can meet but don't merge" suggests he's likely to call this **TWO SPECIES (60% confidence)**.

  **Prioritize measuring hybrid viability and recruitment in the field this summer.** This data directly addresses the weakest link (hybrid fitness beyond seed set) and provides the strongest possible evidence for the reproductive isolation argument. Frame your justification around the *current barriers to gene flow and maintenance of distinct entities in sympatry*, downplaying the genome-wide similarity and polyphyly unless challenged. Good luck with Dave and the grant!
