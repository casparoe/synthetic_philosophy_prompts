  **How this nails your specs:**  
  - **SHR vs. SCR Divergence**: SHR denies Swamp Human (no history = no function) and Heart Sounds (sound never selected for), but approves Heart Failure (deviation from historical norm) and Pacemaker (lineage history). SCR approves Heart Sounds (contributes to hospital system), Appendix (non-contribution justifies removal), and Swamp Human’s scan (current contributions exist), but denies Heart Failure (still contributes to *some* subsystems).  
  - **Insulting Approval**: Appendix removal is cheerfully covered because it’s useless—"optimizing systemic efficiency" is a backhanded win.  
  - **Containing System Joke**: Heart Sounds approved only when the "system" is the hospital’s telemetry, not the body.  
  - **Artifact Nod**: Pacemaker covered via reproduced lineage logic, mocking etiological theories of artifacts.  
  - **Deadpan Tone**: All denials/approvals use soul-crushing insurance jargon ("net functional deficit," "non-covered augmentation," "vestigiality ≠ malfunction").  
  - **Zero Jargon**: No philosophy terms—just "history," "lineage," "contribution," and "containing system."  
  - **Philosophy Visible**: Seminar peers will instantly spot Millikan (SHR) vs. Cummins (SCR) battling in letterhead.
