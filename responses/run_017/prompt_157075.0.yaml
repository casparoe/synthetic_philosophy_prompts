prompt: |-
  hey — im in a phil of bio seminar rn and we're on functions this week (you know, the selected-effects / Millikan style account vs the causal-role / Cummins style "what it currently contributes to some containing system" account), and my study group puts out a dumb department zine. for the functions issue I want a fake insurance packet, around 900–1000 words total.

  Specifically: a short cover memo, 100 words ish, from the Vice President of Teleological Underwriting at a large health insurer, announcing that from now on every claim is adjudicated on whether the body part in question has a function, and insisting that the company's two review desks — call them Selection History Review and Systems Contribution Review — are just two routes to the same yes/no. Then four claim determination letters, 175–225 words each, in deadpan cheerful insurance-ese ("we are unable to approve this claim because…", "per your plan's Teleology Endorsement"), covering these cases:

  1. a heart that has stopped pumping properly — the plain malfunction case
  2. a policyholder who coalesced molecule by molecule out of swamp muck last tuesday and is in every other respect a perfect duplicate of a healthy human: everything works, nothing has a history
  3. a claim for "acoustic signature services" — a heart's lub-dub, which no selection process ever cared about, but which currently feeds the hospital's remote-monitoring capacity, and which the patient want billed as a covered preventive service
  4. an exapted trait — an appendix that was maybe selected for something in our ancestors and now contributes nothing except acting as a reservoir of gut flora after a course of antibiotics

  What I care about: the two desks have to disagree in a way that someone in my seminar can trace straight back to the actual accounts. So the selection-history desk should handle case 1 neatly and go completely absurd on case 2 (the parts do things, none of them have functions, therefore nothing can malfunction and nothing is covered). And the contribution desk should be fine with case 4 but should either be unable to call case 1 broken at all, or should approve case 3 — and for case 3 the joke should be the choice of which containing system gets decomposed into which capacities, since that's what decides whether the lub-dub comes out as a real contribution. At least one of the four determinations should be an approval that is somehow more insulting than a denial. Also please never use the words "etiological", "causal-role", "selected effect", "Millikan" or "Cummins" anywhere in the packet itself, and no footnotes or explaining the philosophy afterwards — the comedy has to come from the concepts, and it should land for a reader who isn't told what's being parodied.

  Oh, and if you can squeeze in a fifth, shorter determination for a pacemaker that gets covered only because it belongs to a reproduced lineage of devices whose members got copied because they regulate heartbeat, thatd be great — my TA won't shut up about artifacts.
