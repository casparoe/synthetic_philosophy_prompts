  Word count balanced by making pacemaker case shortest. Avoiding all jargon—using "lineage" instead of "etiological," "containing system" instead of "causal-role." The insulting approval is definitely the appendix one: "Congratulations! Your appendix’s lack of function qualifies its removal..."  

