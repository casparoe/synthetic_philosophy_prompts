prompt: |-
  You are a professional philosopher — a specialist in ethics, philosophy of action, and personal identity, with working knowledge of clinical bioethics and health law. Please reason carefully and slowly. Before writing your answer, spend a paragraph or two brainstorming: list the candidate accounts of the earlier self's authority that occur to you, note which one you initially find most attractive and why, and note at least one feature of the practice that you expect will be hard for your favourite to handle. Only then commit to a reconstruction. Prefer the reconstruction that explains the most features of the practice with the fewest additional assumptions, and where the practice is genuinely underdetermined, say so plainly rather than manufacturing a verdict. Organise your answer under headings; aim for roughly 1,200 words. One standing constraint: do not cite anything, name articles or authors, or give me a bibliography or further reading. I am working without web access and I do not want guesses about the literature. If any step of your argument rests on what the law actually holds in some jurisdiction, mark that dependence in a single sentence instead of asserting the law.

  I am a PhD student writing a dissertation chapter on advance directives and the authority of the earlier self, and I want you to reconstruct the implicit theory of a practice I keep circling around. The practice is the ordinary one in which a competent adult records instructions about future medical treatment and those instructions are later treated as binding once the person has lost decision-making capacity: clinicians and families are told to follow them, and in most settings the earlier instruction overrides both the judgement of what is now best for the patient and the patient's own contemporaneous wishes. I want to know what has to be true for that to make sense.

  Four features of the practice strike me as doing the real philosophical work, and I would like your reconstruction to account for all four.

  First, the timing. As long as the person remains competent, an earlier directive has no authority at all: a competent patient who changes their mind is treated as having revoked it, whether or not they ever got around to tearing up the form. The earlier self's word becomes binding at exactly the moment it becomes unrevisable. I have started calling this the answerability condition, and it seems to me to be backwards relative to every other domain in which one person's decision binds another — contracts, promises, votes, instructions to an agent — where authority standardly lapses, or at least weakens, once it can no longer be revisited or questioned. The one familiar exception I can think of is the testamentary will, where we do let a dead hand dispose of property. So: is the medical directive best modelled on a will, and what does that comparison buy and what does it break? A will is usually explained by convention, by the owner's ongoing interest in the disposition of what was theirs, or by the needs of survivors — none of which is obviously an explanation in terms of the signer's persisting agency.

  Second, the asymmetry between refusing and requesting. An advance refusal of even life-saving treatment is treated as close to absolute. An advance request — keep me on the ventilator indefinitely, give me this intervention whatever the clinicians think — is not: the standard response is that clinicians owe only what is medically indicated, so the earlier self can veto but cannot command. That asymmetry looks to me like evidence about what the practice is really for.

  Third, the hard case. An elderly patient with diabetes and a gangrenous limb said, years earlier and while fully competent, that she would never want to be kept alive in a demented state. She is now demented, appears content, says cheerfully that she wants to live, and resists the treatment plan. Standard practice asks the surrogate to exercise substituted judgement — to ask what she would have wanted, not what is best for her now, and not what she now says. Whatever the practice presupposes, it presupposes that the content demented woman's present utterance loses to a sentence she uttered years ago.

  Fourth, the psychiatric variant. In a number of jurisdictions a person with recurrent psychosis can execute a clause consenting in advance to admission and medication during a future episode, including medication they will refuse at the time — the earlier self authorises the coercion of the later self. I do not need the jurisdictional details and I would rather you not depend on them. My question is comparative: in the psychiatric case the later refusal is discounted because it is taken to be the product of an impaired episode, whereas in the dementia case the later refusal is discounted without, I think, any claim that the person is not still a competent-enough agent with genuine present welfare. If those two cases are justified differently, then the practice is not one thing.

  Here is what I want from you. Set out the implicit theory the practice needs, adjudicating between at least these families, which I will name in my own terms so we can avoid the literature: (a) a continuity or identity view, on which the earlier instruction binds because the later patient is, or is continuous enough with, the person who signed, and it is that relation that carries the authority; (b) a will-based or agency view, on which the authority is the authority of an act of will — a standing exercise of self-government, on the model of a promise, a trust, or an authorisation to an agent — and does not depend on any claim about who the later patient is; (c) a side-constraint or jurisdictional view, on which the practice is not really honouring the earlier self at all but enforcing a right against bodily interference whose content is fixed by the last competent expression; and (d) an instrumental view, on which the point is predictive accuracy, fewer family conflicts, and less burdensome bedside deliberation. Then tell me which of these the practice strictly presupposes, which it merely fits comfortably with, and which it rules out. In particular: does the practice require anything like a psychological-continuity account of identity, or would a biological or animalist account license it just as well? Is it consistent with a view on which the demented patient is no longer the same person as the signer?

  Then use the four features as tests rather than illustrations. Does the refusal/request asymmetry tell against the will-based view — is a will that can only say no really a will? Does the answerability condition tell against any view on which authority is supposed to track the persistence of the will? Does the psychiatric variant show that the earlier self has authority to coerce, or only that the later self's refusal is judged defective — and if the latter, what is doing the work in the dementia case? And be explicit about where the practice is silent: about the content of directives, about how much the signer must have understood, about what to do with a directive that the person would almost certainly have revised.

  Finally, two probes. Suppose a jurisdiction enforced an escalator clause, in which the signer stipulates that any later objection to the directive is itself to be treated as evidence of impaired judgement and disregarded. Does your reconstruction permit or forbid that clause, and with what justification? And suppose a jurisdiction required reaffirmation in light of a structured encounter with people actually living in the relevant condition, on the grounds that most signers badly misimagine it. Would the theory you have reconstructed make that requirement mandatory, optional, or incoherent — and would the practice as we have it look unjustified if it lacks such a requirement? Close by saying what would concretely have to change in clinical practice if we replaced the presupposed view with a view on which authority tracks present welfare rather than a past will.
reasoning: |-
  Hmm, this is a deep and complex philosophical query about advance directives and personal identity. The user is a PhD student working on a dissertation chapter, clearly deeply engaged with the theoretical underpinnings of medical ethics. They've presented four carefully observed features of advance directive practice that seem to challenge conventional explanations.

  First, I need to unpack those four features properly. The timing paradox is fascinating - why does authority only crystallize when revision becomes impossible? The refusal/request asymmetry suggests the practice might be more about veto power than positive control. The dementia case presents a stark conflict between past and present selves. And the psychiatric variant creates an interesting comparative challenge.

  The user wants me to evaluate four theoretical families: continuity/identity views, will-based views, side-constraint views, and instrumental views. I need to test each against the four features while being careful not to invent justifications the practice doesn't actually rely on. The two probes about escalator clauses and reaffirmation requirements will serve as good reality checks.

  For the continuity view, the dementia case poses problems - if we consider the demented patient a different person, how can the directive bind? But the practice clearly treats it as binding anyway. The will-based view struggles with the timing paradox - why can't a competent person override their own directive? The side-constraint view explains the refusal/request asymmetry well but has trouble with the psychiatric case where we override current refusal. The instrumental view is appealing but can't explain why we prioritize past instructions over current best judgments.

  I'm leaning toward a hybrid approach centered on bodily integrity rights that can explain both the binding nature of refusals and the limits on requests. The temporal dimension of these rights - that they can be exercised prospectively - seems crucial. This would handle the refusal/request asymmetry naturally while accommodating the timing paradox through the concept of irrevocable exercises of rights.

  The psychiatric directive comparison is particularly telling. It shows that when we override current refusal, we need either an impairment justification (as in psychiatry) or a prior authorization framework (as in Ulysses contracts). The dementia case lacks both, suggesting the practice might be relying on something else - perhaps precisely that prior exercise of bodily rights.

  For the identity question, the practice seems functional rather than metaphysical - it doesn't require psychological continuity, just the legal continuity of personhood. The demented patient remains the same legal person whose prior exercise of rights must be honored. This avoids committing to any particular theory of personal identity.

  The escalator clause probe reveals limits - such clauses would violate the answerability condition that's central to the practice. The reaffirmation requirement would be optional but not mandatory under this reconstruction, though it might be wise policy. If we switched to present welfare tracking, we'd lose the whole structure of advance directives as binding instructions.

  Throughout, I need to maintain philosophical rigor while keeping the analysis grounded in the actual features of the practice. The user wants neither pure description nor speculative theory, but a reconstruction of the implicit commitments that make the practice coherent.
answer: |-
  ## Reconstructing the Implicit Theory of Advance Directive Authority

  **Brainstorming Candidate Accounts**

  The core philosophical tension lies in explaining why an *irrevocable* past directive binds a *dissenting* present patient. Several families of explanation present themselves:

  1.  **Continuity/Identity View:** The later patient *is* the signer, or sufficiently continuous with them (psychologically or biologically), such that the directive represents their "true" or enduring will. The authority stems from this persistence of identity. *Initial Appeal:* It intuitively grounds authority in a persisting self. *Problem Feature:* The dementia case: If severe dementia constitutes a different person (psychologically), why bind them? The practice seems to bind regardless of psychological rupture if biological identity holds.

  2.  **Will-Based/Agency View:** Signing the directive is a sovereign act of will – akin to appointing an irrevocable agent (mandate), making a binding promise to oneself/future caregivers, or creating a standing order. Authority resides in the *act itself* as an exercise of self-determination. *Initial Appeal:* It centers autonomy and explains why the act binds *despite* later incapacity or dissent. *Problem Feature:* The timing/answerability condition: Why is the act revocable *only* while competent? Most irrevocable mandates (e.g., some trusts, Ulysses contracts) anticipate future incapacity but don't vanish upon mere reconsideration *before* incapacity hits. The refusal/request asymmetry also challenges this: Can a sovereign will only *refuse* but not *demand*?

  3.  **Side-Constraint/Jurisdictional View:** The practice enforces a fundamental, pre-existing right – the right to bodily integrity and refusal of treatment. The directive merely *specifies the content* of that right *at the last competent moment*. Authority comes from the right itself; the directive is evidentiary. *Initial Appeal:* Elegantly explains the refusal/request asymmetry (no right to demand non-indicated treatment) and the binding nature of refusal regardless of later dissent/welfare. *Problem Feature:* The psychiatric variant: Here, the directive *authorizes* interference (treatment) the later self refuses, going beyond merely specifying a refusal right – it seems like a positive authorization.

  4.  **Instrumental View:** The practice is justified solely by good consequences: respecting directives prevents family/clinician conflict, reduces burdensome deliberation, and (crucially) is often the best *predictor* of what the patient *would* want now or what is objectively best for them. *Initial Appeal:* Pragmatic, avoids deep metaphysical questions. *Problem Feature:* The dementia case: If the demented patient is content and wants to live, overriding her *current* expressed wish and apparent welfare based on a past prediction seems poorly explained by instrumentalism alone. Why not update the prediction based on her current state? The binding force feels stronger than mere best-guess prediction.

  **Initial Leaning:** The **Side-Constraint/Jurisdictional View** seems most promising initially. It directly addresses the core asymmetry (binding refusals, non-binding requests) by grounding the practice in the fundamental right to refuse bodily intrusion. The timing condition fits: the right persists, and its content is fixed by the last competent expression. The dementia case is clear: the right to refuse is exercised prospectively, trumping current dissent. However, the **psychiatric variant** poses a significant challenge: it looks like a positive authorization to *act* (treat), not just a specification of a refusal right. Does this view have the resources to explain this?

  **Committed Reconstruction: The Prospective Specification Model**

  The practice presupposes a **hybrid model, primarily grounded in a Side-Constraint/Jurisdictional View but incorporating essential elements of a qualified Will-Based view concerning authorization.** The core implicit theory is:

  1.  **Foundational Premise:** Individuals possess a strong, ongoing right to bodily integrity, which includes the right to refuse any medical intervention, even life-saving treatment. This right persists through changes in capacity and identity.
  2.  **Directive as Prospective Specification:** An advance directive functions primarily as a *prospective specification* of the *content* of this pre-existing right to refuse treatment. It answers the question: "Under what future circumstances would this right be invoked to refuse specific interventions?" Its authority stems directly from the underlying right it specifies.
  3.  **Temporal Fixity of Specification:** The content of the right, once competently specified prospectively, becomes *fixed* at the moment competence is lost. This explains the answerability condition: while competent, the individual retains the authority to *re-specify* the content of their right (revoke or amend the directive). Once incompetent, they lack the capacity to alter this specification. The right endures, but its specific, prospectively declared content is locked in. This is distinct from most agency models; it's not that the *authority* of the act lapses, but that the *capacity to change the specification* lapses, fixing it.
  4.  **Asymmetry Explained:** The refusal/request asymmetry flows naturally:
      *   **Refusal:** Honoring a refusal is directly enforcing the specified content of the right to bodily integrity. The directive provides conclusive evidence of the conditions under which the patient exercises their right to refuse.
      *   **Request:** There is no symmetrical fundamental right to *demand* specific, non-indicated treatments. Clinicians have independent duties (beneficence, non-maleficence, resource stewardship) that limit their obligation to provide treatment. A request cannot create an obligation to violate these duties. Hence, requests are advisory, not binding commands.
  5.  **The Will-Based Element - Authorization in the Psychiatric Variant:** The psychiatric directive variant ("I consent in advance to admission/medication during psychosis") requires an additional element: **prospective authorization.** Here, the directive isn't just specifying a refusal; it's authorizing a specific *intervention* (treatment) that would otherwise violate bodily integrity *if refused contemporaneously*. This authorization is conceptualized as a competent *waiver* of the right to refuse *under specific future conditions*. Its force relies on recognizing the later refusal as *impaired* and thus *not* reflecting the competent self whose authorization stands. This element is closer to a Will-Based view (a sovereign authorization) but is tightly constrained: it authorizes only what is necessary to treat the impairment and restore capacity, and crucially, it relies on the *judgment* that the later refusal is defective due to the impairment. This authorization element is *not* generally present in standard medical directives for conditions like dementia where contemporaneous refusals are not necessarily judged as *impaired* in the relevant (decision-making capacity) sense.

  **Testing Against the Four Features**

  1.  **Timing/Answerability Condition:** Explained by the "prospective specification" concept. The right persists, but the *competent specification* of its content can only be changed while competent. The moment competence is lost, the specification is fixed. This is analogous to a will only in the sense of fixing dispositions at incapacity, but the *justification* differs: it's about fixing the content of a persisting right, not disposing of property based on convention or survivor needs. The practice is not best modelled *fundamentally* on a will; the will analogy captures the temporal fixity aspect but misses the core grounding in bodily rights.
  2.  **Refusal/Request Asymmetry:** Directly explained by the foundational premise. Refusals enforce the right to bodily integrity; requests cannot override clinical judgment or create positive rights to non-indicated care. This asymmetry strongly tells against a pure Will-Based view, which struggles to explain why a sovereign will can command "no" but not "yes" in a binding way. The Prospective Specification view makes the asymmetry inherent, not a limitation of will.
  3.  **The Dementia Hard Case:** Explained. The demented patient retains the right to bodily integrity. The directive provides the fixed, competent specification of when that right should be invoked to refuse treatment. Her current dissent is overridden *not* because she is a different person (though she may be, psychologically), but because she lacks the *capacity* to competently *re-specify* the content of her right. The prior competent specification stands as the valid expression of the right. The practice presupposes the *legal/biological continuity* of the person holding the right, but it is *agnostic* about deep psychological continuity or identity metaphysics. A biological/animalist account of identity licenses the practice perfectly well. It is consistent with the view that the severely demented patient is *not* the same psychological person as the signer, because the right attaches to the continuing biological entity, and the specification was made by that entity when competent. The key is the *source* of authority (the right + its competent specification) not the persistence of a specific psychology. The "sentence uttered years ago" wins because it is the last competent exercise of the right.
  4.  **Psychiatric Variant:** Explained by adding the "prospective authorization/waiver" element. The directive authorizes specific intervention *because* the later refusal is judged *impaired* (lacking capacity due to psychosis) *and* the directive provides competent authorization for that specific scenario. This distinguishes it from the dementia case: in dementia, the current refusal or acceptance, while perhaps based on misunderstanding, is often *not* judged to lack decision-making capacity *in the moment* regarding the specific choice; it reflects the current state of the person holding the right, whose prior specification still governs refusals. In the psychiatric case, the practice presupposes the later self's refusal *is* defective (incapacitated) in a way that the dementia patient's contemporaneous expression often is not. The work in the dementia case is done by the fixed specification of the right to refuse; the work in the psychiatric case is done by the prior authorization *plus* the judgment of current incapacity.

  **Silences of the Practice:**

  *   **Content:** The theory doesn't mandate specific content beyond refusal. It explains why requests aren't binding but doesn't dictate what should be requested or how detailed refusals must be.
  *   **Understanding:** The practice implicitly requires a threshold of competence (understanding, reasoning, appreciation) at the time of signing to validate the specification/authorization, but the precise threshold is underdetermined by the core theory and relies on legal/clinical standards.
  *   **Unrevised but Possibly Revised Directives:** The practice is silent but leans towards enforcing the directive *unless* there's *evidence* of a competent change of mind. The theory prioritizes the *last competent expression*. It doesn't require speculation about what the patient "would have wanted" if they'd thought more; it relies on what they *did* competently specify. Substituted judgement is used when *no* clear directive exists, not to override an existing one based on hypothetical revision. The core theory suggests that if no revocation occurred while competent, the specification stands, even if outdated. However, the *instrumental* benefits of the practice might be weakened in such cases.

  **Response to Probes**

  1.  **Escalator Clause:** The Prospective Specification model **forbids** a blanket escalator clause. The core justification relies on the *actual capacity* to specify the right. The answerability condition is central: authority to *change* the specification exists only while competent. An escalator clause attempts to pre-emptively define *future* expressions of will (potential revocations) as incompetent solely based on their content (objecting to the directive), irrespective of actual decision-making capacity. This violates the principle that competence is a functional assessment of present abilities (understanding, reasoning, appreciation, expressing a choice) regarding the *specific decision at hand*, not a judgment based on the decision's content or alignment with past wishes. The model requires that a *currently competent* patient must be able to revoke their directive; an escalator clause would illegitimately deny them that capacity based on a prior command, undermining the very foundation of the practice (competent specification).
  2.  **Reaffirmation Requirement:** The reconstructed theory makes this requirement **optional but potentially prudent**, not mandatory or incoherent. The core theory only requires that the specification was made competently at the time. It does not require perfect foresight or ideal deliberation. Enforcing a directive based on a specification made with poor understanding of the relevant condition might be *unwise* and undermine the instrumental benefits (accuracy), but it doesn't necessarily violate the core justification based on the right + competent specification. The practice as we have it remains justified *in principle* without such a requirement, as long as basic competence at signing is ensured. However, the justification would be significantly *weakened instrumentally* if directives are frequently based on profound misimagination, as accuracy in predicting future wishes or best interests would suffer. The requirement is a policy choice to *enhance* the reliability of the specification within the existing framework, not a necessary component of its theoretical foundation.

  **Concrete Changes Under a Present Welfare Model**

  If the presupposed view were replaced by one where authority strictly tracks *present welfare* rather than past specification of rights, the practice of binding advance directives would collapse. Concrete changes would include:

  1.  **Directives Become Merely Advisory:** Instructions would be considered as evidence of what might be in the patient's *current* best interests, but not binding. Clinicians and surrogates would be obligated to do what they judge is best for the patient *now*, regardless of prior instructions.
  2.  **Current Wishes Gain Primacy (When Discernible):** In the dementia case, the patient's current expression of a desire to live would be the primary consideration, overriding the past refusal. Treatment refusals based on directives would be ignored if clinicians/surrogates believed treatment was currently in the patient's welfare interests.
  3.  **Refusal/Request Asymmetry Vanishes:** Both refusals and requests would be assessed purely based on their alignment with current welfare. A past refusal could be overridden if treatment is now deemed beneficial (e.g., dementia patient). A past request might be honored if it aligns with current welfare, but could also be overridden if deemed harmful.
  4.  **Substituted Judgment Shifts:** The focus would move decisively from "What would *she* have chosen?" to "What is *best for her* now?" Surrogates would be explicitly instructed to prioritize current well-being over prior expressed values or directives.
  5.  **Psychiatric Variant Undermined:** Coercive treatment during psychosis based solely on a past directive would become harder to justify. Treatment would require either current consent (if possible) or a strict best interest/police power justification based *only* on current dangerousness and need for treatment, independent of any prior authorization. The directive might be evidence but not authorization.
  6.  **Increased Clinician/Surrogate Discretion:** Decision-making power shifts significantly towards present caregivers and surrogates, diminishing the constraining power of the patient's prior exercise of autonomy regarding future incapacity. Conflicts between families and clinicians over "best interests" would likely increase, as the clear rule of "follow the directive" disappears.

  In essence, replacing the presupposed Past Specification model with a strict Present Welfare model transforms advance directives from binding exercises of prospective autonomy into, at best, informational tools for surrogate decision-makers focused on current well-being, fundamentally altering their legal and ethical force.
