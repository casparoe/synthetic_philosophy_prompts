answer: |-
  Here’s a rigorously structured set of desiderata for evaluating answers to "why is there something rather than nothing?" — designed to flag subject-changing, expose tensions, and sort your listed concerns. Requirements are grouped, annotated for negotiability, and paired with their *motivating rationale*. Key conflicts are flagged explicitly.

  ---

  ### **I. Non-Negotiable Core Requirements**  
  *(Essential for addressing the question *as stated* without redefinition)*

  1. **Scope Specification**  
     - **Requirement:** Must explicitly define the scope of "nothing" (e.g., absence of *concrete entities*, absence of *all entities including abstracta*, or absence of *this specific world*).  
     - **Motivation:** Prevents equivocation between fundamentally distinct questions (e.g., "why concrete things?" vs. "why reality at all?").  
     - **Solves:** Your "scope/contrast-class issue". Forces answers to commit to a target.

  2. **Non-Question-Begging Grounding**  
     - **Requirement:** Cannot presuppose the existence of entities requiring explanation (e.g., "God exists" or "quantum fields fluctuate" as brute facts).  
     - **Motivation:** The question demands an explanation for *all* existence; smuggling in unexplained existents changes the subject.  
     - **Solves:** Rules out causal answers (since causes require existence) unless they ground causation itself.

  3. **Discriminatory Power**  
     - **Requirement:** The explanation must *differentiate* a world with something from a world with nothing. If the answer holds equally in an empty world, it fails.  
     - **Motivation:** Explanations that are true *regardless* of whether anything exists (e.g., "nothing is unstable") don’t explain why something *actually* exists.  
     - **Solves:** Your "available in an empty world" concern. Knocks out many modal principles (e.g., "something is possible").

  ---

  ### **II. Structural Requirements**  
  *(Needed for explanatory adequacy, but negotiable in form)*

  4. **Self-Applicability Test**  
     - **Requirement:** Must address whether the explanatory principle applies to itself (e.g., "all truths have explanations" → must explain itself). If it doesn’t apply, justify why (e.g., "it’s metaphysically necessary").  
     - **Motivation:** Avoids arbitrary "explanatory stoppers" (e.g., "the universe just exists"). Stopping *is* a cost unless justified.  
     - **Solves:** Your "whether the answer stops" issue. Flags brute-fact moves.

  5. **Modal Compatibility**  
     - **Requirement:** Must engage with the *possibility* of nothing (e.g., via subtraction arguments). If rejecting this possibility, justify why "nothing" is incoherent.  
     - **Motivation:** Subtraction arguments (removing things one-by-one) suggest nothing is conceivable; answers must confront this.  
     - **Solves:** Your "subtraction-style move" point. Tests coherence of "nothing".

  ---

  ### **III. Content-Sensitive Requirements**  
  *(Camp-dependent; mark biases when evaluating)*

  6. **Necessity Demand**  
     - **Requirement (Negotiable: "necessary grounding" camp):** Must bottom out in a *metaphysically necessary* truth/entity. Contingent explanations are "shrugs".  
     - **Motivation:** Only necessity avoids infinite regress or brute contingency.  
     - **Bias:** Rejects multiverse/plenitude answers if they’re contingent.

  7. **Simplicity Justification**  
     - **Requirement (Negotiable: "privilege nothing" camp):** Must explain why "nothing" isn’t simpler/more expected than "something".  
     - **Motivation:** If "nothing" is uniquely simple (e.g., 0 degrees of freedom), its non-actuality needs explanation.  
     - **Bias:** Assumes simplicity is explanatory (contentious: why privilege ontological parsimony?).

  8. **Plenitude Accountability**  
     - **Requirement (Negotiable: anti-plenitude):** If claiming "all possible worlds exist", must explain *observational selection effects* (why we see order/laws).  
     - **Motivation:** Plenitude makes existence "cheap" but doesn’t explain *this* world’s features without added machinery.  
     - **Solves:** Your "high-entropy mess" objection.

  ---

  ### **IV. Exclusionary Requirements**  
  *(Guardrails against dead ends/category errors)*

  9. **No Anthropic Dodge**  
     - **Requirement:** Cannot rely on "we wouldn’t be here to observe nothing".  
     - **Motivation:** Observation selection effects explain *data* about our world, not existence *itself*.  
     - **Solves:** Your "selection-effect category error" concern.

  10. **Physics-Compatibility (Not Physics-Dependence)**  
      - **Requirement:** Must not contradict *established* physics (e.g., conservation laws), but needn’t defer to it.  
      - **Motivation:** Physics presupposes existence; it can’t explain why physics applies at all.  

  ---

  ### **Key Tensions & Conflict Flags**  
  **❗ These requirements cannot all be satisfied simultaneously:**  
  - **Tension 1:** **Discriminatory Power vs. Necessity Demand**  
    If the explanation must discriminate something from nothing (req. 3), but also be necessary (req. 6), it must be *necessarily true yet false in nothing-worlds* — a contradiction unless nothing is impossible.  
    → *Knocks out:* Modal optimism (e.g., "something must exist").  
  - **Tension 2:** **Self-Applicability vs. Non-Question-Begging**  
    Self-grounding necessary truths (e.g., "the Principle of Sufficient Reason exists necessarily") risk being question-begging (req. 2).  
  - **Tension 3:** **Plenitude Accountability vs. Simplicity Justification**  
    Plenitude (req. 8) makes "something" inevitable, but violates "nothing is simpler" intuition (req. 7).  

  **Most Damaging Requirement:**  
  **Discriminatory Power (req. 3)**. It eliminates:  
  - Tautologies ("something is possible")  
  - Principles true in all worlds (e.g., mathematical truths)  
  - "Nothing is unstable" claims (if instability requires existents)  

  ---

  ### **Your Open Questions Sorted**  
  - **Causation:** Irrelevant (req. 2). Grounding/modality must replace it.  
  - **"Why not nothing?" as malformed:** Likely if "nothing" is incoherent (req. 5). Test via subtraction.  
  - **Observational consequences:** Not required (req. 10). Answers can be purely metaphysical.  
  - **"Existence is cheap":** Allowed if it meets req. 8 (plenitude accountability).  

  This framework forces answers to either:  
  (A) Deny the coherence of "nothing" (e.g., via req. 5),  
  (B) Posit a necessary ground (req. 6) that self-applies (req. 4),  
  (C) Accept brute contingency (failing req. 6), or  
  (D) Dissolve the question (e.g., by showing it’s unanswerable).  

  Evaluate proposals by which requirements they meet, which they reject (and why), and where tensions explode. Happy taxonomy-building.
