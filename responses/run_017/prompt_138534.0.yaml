prompt: |-
  I am the story editor of a narrative history series — short audio episodes, one turning point each — and roughly three times a week a producer pitches an episode in which something non-human is cast as the thing that made the event happen: a pathogen, a volcanic winter, a drought, a shift in monsoon timing. I need a reusable decision procedure for these pitches, not a style guide. Input: a single causal claim of the form "X (non-human) caused / explains Y (human event)." Output: one of four verdicts — protagonist, trigger, backdrop, not established — plus one narration-safe sentence the producer is allowed to record. The procedure has to be runnable in about twenty minutes by someone with no training in climatology or epidemiology, it has to say what counts as a sufficient answer to each question, and it has to have two hard features: a stop rule (at least one point where an unanswered question ends the procedure with a verdict and the narration must fall back to coincidence language or the segment gets cut) and an explicit handoff (at least one point where the remaining question is about blame or emphasis rather than evidence and comes to me). Please build the procedure around distinctions that survive translation into practice: naming the human mechanism that carried the physical event into the outcome (if no such mechanism can be named, you have weather, not history); coupling the timescale and latency of the physical event to the claimed effect; a differential-signature test, where the same shock should produce divergent outcomes wherever institutions or practices diverge, and if the outcome tracks the human variable rather than the physical gradient the shock is demoted; an alibi test, for cases where we are unknowingly repeating a contemporaneous actor's self-exculpating attribution; a counterfactual test that holds the physical event fixed and varies human choices; and a rule for slow variables, since a constant can become a cause when it moves but only if it demonstrably moved at the scale and in the window claimed. Say plainly which of the concepts in the scholarly literature you had to distort or drop to make this usable, and where the simplification will mislead.

  Then run the finished procedure on three cases. One: Tambora in 1815 and the subsistence crisis that followed in Europe and New England. Two: a pitch my producers are attached to and I am suspicious of — the 1783 Laki fissure eruption in Iceland as the cause of the French Revolution six years later — where I expect an answer they will not like. Three: a case the procedure handles badly, where the pathogen really does look like the protagonist rather than a trigger (I am thinking of post-1492 epidemic mortality in the Americas), and where I want you to show exactly which step fails and why, so I know when not to trust the output. Finally, be honest about what the procedure cannot do at all: I do not think it can apportion degrees of causal credit, only rank them, and I suspect it systematically under- or over-credits agents that act on bodies rather than on institutions; tell me if that is right and what else it is blind to.

  After the procedure and the worked cases, give me a single JSON object, which I will paste into our pitch template:

  {"input": "<what a producer must supply to start the procedure>", "verdicts": ["<the four labels, with a one-line gloss each>"], "steps": [{"id": "<s1..sn>", "question": "<the question to answer>", "sufficient_answer": "<what counts as answering it>", "if_answered": "<next step id or verdict>", "if_unanswered": "<next step id or stop verdict and what the narration may then say>", "common_error": "<how a producer will get this wrong>"}], "stop_rules": ["<...>"], "handoffs_to_editor": ["<...>"], "worked_cases": [{"case": "<short name>", "claim": "<the pitched causal claim>", "step_results": {"<step id>": "<one-line finding>"}, "verdict": "<label>", "narration_line": "<the one sentence cleared for recording>", "note": "<where judgment remained>"}], "known_failure_modes": [{"case_or_pattern": "<...>", "which_step_breaks": "<...>", "why": "<...>"}], "cannot_do": ["<...>"]}
reasoning: |-
  We are building a decision procedure for evaluating causal claims of the form "X (non-human) caused/explains Y (human event)" in the context of a narrative history series. The procedure must output one of four verdicts: protagonist, trigger, backdrop, not established. It must also output one narration-safe sentence.

  The procedure must be runnable in about twenty minutes by someone without specialized scientific training. It must have a stop rule (where an unanswered question leads to a verdict and the narration must use coincidence language or the segment is cut) and an explicit handoff (where the remaining question is about emphasis or blame and is passed to the editor).

  Key distinctions to build around:
  1. Naming the human mechanism that carried the physical event into the outcome (if no mechanism, then it's weather, not history).
  2. Coupling the timescale and latency of the physical event to the claimed effect.
  3. Differential-signature test: same shock should produce divergent outcomes where institutions/practices diverge; if outcome tracks human variation, then the shock is demoted.
  4. Alibi test: avoid repeating a contemporaneous actor's self-exculpating attribution.
  5. Counterfactual test: hold the physical event fixed and vary human choices to see if the outcome changes.
  6. Rule for slow variables: a constant becomes a cause only when it moves, and the movement must be at the claimed scale and in the claimed window.

  We must say which scholarly concepts are distorted or dropped and where simplifications mislead.

  Then run three cases:
  1. Tambora (1815) causing the subsistence crisis in Europe and New England.
  2. The 1783 Laki fissure eruption as the cause of the French Revolution (1789).
  3. Post-1492 epidemic mortality in the Americas as a protagonist (where the procedure fails).

  Finally, provide a JSON object as specified.

  ---

  **Designing the Procedure:**

  We'll create a step-by-step procedure with up to 6 steps (to keep within 20 minutes). Each step is a question with clear criteria for a sufficient answer and a path to the next step or a verdict.

  **The Four Verdicts:**
  - **Protagonist**: The non-human factor is the primary driver of the event; without it, the event would not have occurred in the form it did. (Requires passing all tests and being the dominant cause.)
  - **Trigger**: The non-human factor initiated the event but human factors determined the form and outcome. (The spark, not the fuel.)
  - **Backdrop**: The non-human factor was a condition that made the event possible or more severe, but did not cause it directly. (Setting the stage.)
  - **Not Established**: Insufficient evidence to link the non-human factor to the event in any causal role beyond coincidence.

  **Steps:**

  We'll structure the steps so that if any step fails, we may jump to a verdict (especially "not established") or to a less central role.

  **Step 1: Human Mechanism**
  - **Question**: Can we name a specific human mechanism (e.g., policy decision, market reaction, social response) that directly translated the non-human event (X) into the human outcome (Y)?
  - **Sufficient Answer**: A clear, historically documented chain: X led to Z (human action/inaction) which led to Y. If the answer is "no", then we cannot establish causation beyond coincidence (stop: not established).
  - **If Answered**: Go to Step 2.
  - **If Unanswered**: Verdict: Not Established. Narration must use coincidence language (e.g., "Around the same time, X occurred, but it's unclear if it played a role in Y").
  - **Common Error**: Vague mechanisms (e.g., "people were hungry so they revolted") without specific actors or decisions.

  **Step 2: Timing and Latency**
  - **Question**: Does the timing of the outcome (Y) match the expected latency of the non-human event (X)? Consider: (a) the immediate physical effects of X, (b) the time for human systems to react, and (c) the time for the outcome to manifest.
  - **Sufficient Answer**: Evidence that Y occurred within a plausible time window after X, given known lags (e.g., crop failure from a volcano typically in the next 1-2 growing seasons). If the time gap is too long or too short, it's a problem.
  - **If Answered**: Go to Step 3.
  - **If Unanswered**: Verdict: Not Established. Narration: "The timing between X and Y is inconsistent with a direct causal link."
  - **Common Error**: Ignoring lags (e.g., linking a volcano to a revolution a decade later without showing intermediate steps).

  **Step 3: Differential Signature**
  - **Question**: Did the same non-human event (X) produce different outcomes in different regions with different human institutions? If yes, does the variation in outcomes track the human differences more than the physical gradient of X?
  - **Sufficient Answer**: Compare at least two regions exposed to X but with different outcomes. If outcomes differ and the difference aligns with human factors (e.g., governance, economy), then X is not the primary driver. If outcomes are similar despite human differences, that strengthens X as a protagonist. If no comparable regions, skip to Step 4.
  - **If Answered (and outcome variation tracks human factors)**: Go to Step 4, but note that X is likely demoted (to trigger or backdrop).
  - **If Answered (and outcome does not track human factors)**: X remains a candidate for protagonist, go to Step 4.
  - **If Unanswered (no data for comparison)**: Go to Step 4 (we cannot test, so we proceed cautiously).
  - **Common Error**: Overlooking regions that had the same shock but no outcome, or regions with no shock but a similar outcome.

  **Step 4: Alibi Test**
  - **Question**: Is the attribution of Y to X a narrative that was used by historical actors to deflect blame or responsibility? (E.g., a ruler blaming a famine on the weather to hide policy failures.)
  - **Sufficient Answer**: Historical evidence that contemporary actors promoted the X-as-cause story for self-serving reasons. If yes, then be skeptical.
  - **If Answered (yes)**: Then X is likely not the protagonist (go to Step 5 with a note that the claim is tainted).
  - **If Answered (no)**: Go to Step 5.
  - **If Unanswered**: Go to Step 5 (we cannot know, so proceed).
  - **Common Error**: Taking historical attributions at face value.

  **Step 5: Counterfactual Test**
  - **Question**: Holding the non-human event (X) fixed, could different human choices have prevented or significantly altered the outcome (Y)?
  - **Sufficient Answer**: Evidence that in similar past events, different human actions led to different outcomes, or logical argument that alternative policies could have mitigated the effect of X. If yes, then X is not the sole protagonist (it might be a trigger or backdrop). If no, then X is more central.
  - **If Answered (different choices could have changed outcome)**: Then X is at best a trigger (go to Step 6 for slow variables, but if Step 3 already demoted, then we might go to trigger or backdrop).
  - **If Answered (different choices could not have changed outcome)**: Then X is a strong candidate for protagonist (go to Step 6).
  - **If Unanswered**: We cannot establish the role of X beyond a trigger or backdrop (so we go to Step 6 with a note of uncertainty).
  - **Common Error**: Ignoring historical precedents of successful mitigation.

  **Step 6: Slow Variables Rule (for non-acute events)**
  - **Question**: If X is a slow-changing variable (e.g., climate pattern, soil depletion), did it actually change at the scale and in the time window claimed? And is that change linked to the outcome?
  - **Sufficient Answer**: Data showing that X moved from a stable state (or typical range) to a new state in the relevant period, and that the movement correlates with the onset of Y. If X was constant, it cannot be a cause. If it changed but the change is not aligned with Y, then not established.
  - **If Answered (changed and linked)**: Then X can be a cause (but we must now integrate with previous steps to assign verdict).
  - **If Answered (no change or not linked)**: Verdict: Not Established (or if previous steps suggest a role, then backdrop).
  - **If Unanswered**: We cannot confirm X as a cause (verdict: not established or backdrop, depending on prior steps).
  - **Common Error**: Treating a constant (e.g., "Arid climate caused the collapse") as a cause without showing change.

  **Integrating Steps to Verdicts:**
  - After Step 6, we must assign a verdict based on the accumulated answers.
    - If all steps support X as a necessary and sufficient cause (especially Step 1, 2, 3 not demoting, 4 not tainted, 5 no alternative choices, 6 if applicable) then **Protagonist**.
    - If X is necessary to start the chain but human factors dominate (e.g., Step 1 shows mechanism, Step 5 shows choices mattered) then **Trigger**.
    - If X is a condition that enabled or exacerbated the event but not the driver (e.g., Step 3 demoted, Step 5 shows choices could have overcome it, Step 6 shows slow change but not decisive) then **Backdrop**.
    - If any stop step (Step 1 or 2 unanswered) then **Not Established**.

  **Stop Rules:**
  - Step 1: If unanswered -> stop, verdict: Not Established.
  - Step 2: If unanswered -> stop, verdict: Not Established.

  **Handoff to Editor:**
  - After Step 4 (Alibi Test): If the answer is "yes" (it was an exculpatory narrative), then the editor must decide how to handle the historical actors' narrative versus the evidence. The procedure cannot resolve the emphasis on blame.
  - After the entire procedure, the editor must make a judgment call on the verdict when the evidence is mixed (e.g., between trigger and backdrop). The procedure can only assign the category, but the editor must weigh the overall narrative.

  **Concepts Distorted or Dropped:**
  - **Complex Causality**: We reduce to a linear chain. In reality, multiple causes interact. We drop this for simplicity.
  - **Probabilistic Causation**: We treat causes as binary (present/absent) rather than probabilistic. This may mislead in cases where X increases the likelihood of Y but doesn't guarantee it.
  - **Counterfactual Dependence**: We use a simplified counterfactual test (Step 5) that ignores complex interdependencies.
  - **Social Construction of Risk**: We assume physical events are objective, but the perception of X might be what matters. We drop this.
  - **Path Dependency and Feedback Loops**: We ignore feedback between human actions and the environment (e.g., human responses might worsen the shock).

  **Where Simplification Misleads:**
  - In cases with complex feedback (e.g., environmental degradation leading to collapse, which then worsens the environment), the step-by-step chain may break.
  - For slow-moving variables (e.g., climate change), the procedure might under-credit the non-human factor if the human mechanism (Step 1) is diffuse.

