  ### Narrative History Causal Claim Evaluation Procedure  
  Designed for non-experts to evaluate "X (non-human) caused Y (human event)" claims in 20 minutes. Outputs one of four verdicts and a narration-safe sentence.  

  **Key Concepts Simplified/Distorted from Scholarship**:  
  - **Dropped**: *Probabilistic causation* (replaced with binary thresholds).  
  - **Distorted**: *Counterfactuals* (simplified to "could choices alter outcome?" ignoring modal logic).  
  - **Misleads When**: Human responses are path-dependent (e.g., slow variables with tipping points) or when physical/climatic data is sparse.  

  ---

  ### **Procedure: 6 Steps with Stop Rules and Handoffs**  
  **Input**: A claim structured as: *"[Non-human X] caused [human event Y]."*  
  **Output**: One verdict + one narration-safe sentence.  
  **Verdicts**:  
  1. **Protagonist**: X is the primary driver of Y (fails without X).  
  2. **Trigger**: X initiated Y, but human choices shaped its form/outcome.  
  3. **Backdrop**: X enabled/magnified Y but didn’t cause it.  
  4. **Not Established**: Insufficient evidence; narration defaults to coincidence language.  

  | Step | Question | Sufficient Answer | If Answered → | If Unanswered → | Common Error |
  |------|----------|-------------------|---------------|-----------------|--------------|
  | **s1** | Can you name *one specific human mechanism* (e.g., policy, market shift, revolt) that directly linked X to Y? | A documented actor/decision that *carried* X’s effect into Y (e.g., "food hoarding by merchants amplified famine"). | s2 | **STOP: Not Established**. Narration: "X occurred, but no evidence ties it to Y." | Vague mechanisms (e.g., "people suffered"). |
  | **s2** | Does the *timing/latency* of Y match X’s physical impact window? (e.g., drought → crop failure in 1 season, not 10 years). | Evidence that Y occurred within X’s *plausible effect window* (e.g., volcanism → cooling <3 years). | s3 | **STOP: Not Established**. Narration: "Y followed X, but the delay suggests no direct link." | Ignoring lags (e.g., linking 1783 eruption to 1789 revolution). |
  | **s3** | **Differential-Signature Test**: Where X occurred but human institutions differed, did Y *diverge*? (e.g., same drought → famine in autocracy but not democracy). | Comparison of ≥2 regions with similar X-exposure but different institutions/outcomes. If Y *tracks human differences*, X is demoted. | s4 | s4 (proceed cautiously) | Cherry-picking regions; ignoring null cases. |
  | **s4** | **Alibi Test**: Is this claim *repeating a historical actor’s self-exculpation*? (e.g., king blaming famine on weather). | Evidence that X was *contemporaneously used* to deflect blame. | **HANDOFF** to editor (blame emphasis) | s5 | Taking historical narratives at face value. |
  | **s5** | **Counterfactual Test**: Holding X fixed, *could human choices* have prevented Y? (e.g., grain reserves averting famine). | Evidence from similar events or logic showing Y was *avoidable*. | Trigger/Backdrop | Protagonist (if s3/s6 support) | Assuming inevitability. |
  | **s6** | For *slow variables* (e.g., soil depletion): Did X *change demonstrably* at the claimed scale/window? | Data showing X moved *beyond baseline* and aligned with Y (e.g., rainfall dropped 40% in 5 years). | Assign verdict | Backdrop/Not Established | Confusing constants (e.g., "arid climate") with causes. |

  **Stop Rules**:  
  - Unanswered **s1** or **s2** → Auto *Not Established*; narration uses coincidence language.  
  - Unanswered **s6** for slow variables → *Backdrop* or *Not Established*.  

  **Handoffs to Editor**:  
  - After **s4** (Alibi Test): If answered "yes," editor decides how to frame historical blame.  
  - After **s5/s6**: Editor adjudicates borderline *Trigger* vs. *Backdrop* verdicts.  

  ---

  ### **Worked Cases**  
  **Case 1: Tambora (1815) → Subsistence Crisis in Europe/New England**  
  - **Claim**: "Tambora’s eruption caused the 1816–17 subsistence crisis."  
  - **Step Results**:  
    - s1: *Yes* (Mechanism: Crop failure → grain speculation/hoarding → price spikes).  
    - s2: *Yes* (Latency: Eruption→cooling→crop loss in 1–2 seasons).  
    - s3: *Divergent* (New England had migration; Europe had riots; tracks governance).  
    - s4: *No* (No evidence of elite weather-blame).  
    - s5: *Yes* (Counterfactual: Better grain storage could have mitigated crisis).  
    - s6: N/A (Acute event).  
  - **Verdict**: **Trigger** (Tambora initiated crisis; human choices worsened it).  
  - **Narration Line**: *"Tambora’s eruption triggered a climate anomaly that devastated crops, but hoarding and trade policies turned scarcity into famine."*  
  - **Note**: Judgment at s3 (divergence demoted Tambora from protagonist).  

  **Case 2: Laki Eruption (1783) → French Revolution (1789)**  
  - **Claim**: "Laki’s eruption caused the French Revolution."  
  - **Step Results**:  
    - s1: *Weak* (Proposed mechanism: Cooling → crop loss → unrest. No *specific* link to 1789 events).  
    - s2: **Unanswered** (Latency: Eruption effects peaked in 1783–84; revolution in 1789. No plausible 5-year causal chain).  
  - **Verdict**: **Not Established** (Stopped at s2).  
  - **Narration Line**: *"Laki’s eruption disrupted climate in the 1780s, but no evidence ties it directly to the revolution six years later."*  
  - **Note**: Producer’s bias ignored timing mismatch (common error in s2).  

  **Case 3: Pathogens → Post-1492 Americas Demographic Collapse**  
  - **Claim**: "Eurasian pathogens caused Native American population collapse."  
  - **Step Results**:  
    - s1: *Yes* (Mechanism: Pathogens → immune collapse → mortality).  
    - s2: *Yes* (Latency: Epidemics followed contact within months).  
    - s3: **Breaks** (Differential test: Collapse occurred across diverse institutions. *Outcome does not track human variables*; supports pathogen as protagonist).  
    - s4: *No* (No evidence of colonial exculpation via disease).  
    - s5: *No* (Counterfactual: No contemporary choices could prevent novel-pathogen mortality).  
    - s6: N/A.  
  - **Verdict**: **Protagonist** (Procedure assigns correctly, but see failure below).  
  - **Narration Line**: *"The introduction of Eurasian pathogens caused catastrophic demographic collapse in immunologically naïve populations."*  
  - **Why Step s3 Fails**:  
    - Differential test assumes human institutions *modulate* outcomes. Here, pathogens overrode institutional differences (e.g., Inca and hunter-gatherers both collapsed).  
    - **Procedure’s Blind Spot**: When non-human forces act *directly on bodies* (not institutions), s3 falsely demotes them. This case exposes the "human mechanism" requirement as anthropocentric.  

  ---

  ### **Known Failure Modes**  
  | Case/Pattern          | Step Breaks      | Why                                                                 |
  |------------------------|------------------|---------------------------------------------------------------------|
  | **Direct bodily harm** (e.g., pathogens, toxins) | s3 (Differential Test) | Ignores that biology can override institutions. Over-credits non-human agents. |
  | **Complex systems** (e.g., climate feedback loops) | s6 (Slow Variables) | Simplifies "change" to linear thresholds; misses tipping points. |
  | **Co-causal equality** (e.g., drought + bad policy → famine) | All steps | Cannot apportion credit; forces ranking (e.g., "trigger" vs. "protagonist"). |

  ### **What the Procedure Cannot Do**  
  - **Apportion causal credit** (e.g., "X was 70% responsible"). Only ranks primary/secondary roles.  
  - **Handle agents acting on bodies** (e.g., disease, radiation): Systematically *over-credits* them (as in Case 3) by ignoring human co-factors (e.g., colonial disruption exacerbating epidemics).  
  - **Evaluate non-physical "shocks"** (e.g., economic variables).  
  - **Account for absence-driven causality** (e.g., "lack of rainfall" vs. measured drought).  
  - **Resolve historical debates** without primary sources (relies on producer-provided evidence).  

