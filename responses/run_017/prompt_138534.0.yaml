  **Running the Cases:**

  **Case 1: Tambora (1815) and the subsistence crisis in Europe and New England.**
  - Claim: The eruption of Mount Tambora caused the subsistence crisis (e.g., the "Year Without a Summer" and subsequent famine).
  - Step 1: Human Mechanism - Yes. The mechanism is clear: the volcanic ash caused global cooling, leading to crop failures, which in turn led to food shortages and price spikes. Human actions: governments' failure to adequately distribute grain, market speculation, and lack of relief policies.
  - Step 2: Timing and Latency - Yes. The eruption was in April 1815; the effects (cold summer, crop failure) were in 1816, and the famine peaked in 1816-1817. This is a plausible lag.
  - Step 3: Differential Signature - Yes. Compare Europe and New England: both had crop failures and hardship, but the severity varied. In Europe (especially Switzerland and Ireland), there was famine and migration, while in New England, the crisis was less severe and led to westward migration. The variation tracks human institutions: Europe had more vulnerability due to post-Napoleonic War conditions and less flexible institutions. So, Tambora is not the sole protagonist (demoted).
  - Step 4: Alibi Test - Unclear. Some contemporary accounts blamed the weather, but there is no strong evidence of it being used to deflect blame. We'll say no.
  - Step 5: Counterfactual Test - Yes, different choices could have changed the outcome. For example, better grain storage, relief policies, or trade policies could have mitigated the famine. (Historical note: Some regions did better due to such measures.)
  - Step 6: Not applicable (acute event).
  - **Verdict**: Trigger (the eruption set off the crisis, but human factors determined the severity). 
  - **Narration Line**: "The eruption of Mount Tambora triggered a global climate anomaly that led to widespread crop failures, but the severity of the resulting famine depended on local governance and economic conditions."

