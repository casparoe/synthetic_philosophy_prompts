prompt: |-
  I am leading next week's session in an upper-level seminar on ethics and public policy — 18 students, 90 minutes, the topic is paternalism and nudging. Everyone will have already read the standard material, including the libertarian-paternalist reply that a nudge is permissible when it leaves the options open and makes the chooser better off as judged by themselves. I want to run an activity rather than lecture, and I would like your help designing it.

  The angle I want them to feel is something I have been calling an orphaned default. Real choice architecture is sticky: pension auto-enrolment rates, organ-donation registries, app privacy settings, and default enrolments in this university's own systems were each set for one population, justified by that population's own judgments, and then inherited by later cohorts whose ends differ. Because a default is largely invisible to the people it governs, nobody complains and nobody re-audits it, so the as-judged-by-themselves test quietly detaches from any actual person. There is also an auditing asymmetry: setting a default is a single deliberate act by someone with the job, whereas noticing that an inherited default needs revisiting requires someone to see a choice that no longer looks like one.

  Here is what I want. A runnable activity in which participants first experience a default as a genuine benefit — say, the familiar two-selves setup, where the default rescues them from something they themselves would later regret — and then find themselves still governed by the same default after their own preferences have changed, with the default never revisited and with no one on the choice-architecture side assigned to check it. Stakes should be small but real: something about how the remaining class time is spent, or a comparable token good. The invisibility has to be something they run into and only afterwards see, not something I announce in advance.

  Please give me the setup and materials, the rounds with what participants are and are not told at each stage, the stake structure, and a debrief that maps specific moments onto (a) the as-judged-by-themselves defence, (b) the orphaned-default problem, and (c) the auditing asymmetry. Then tell me what will predictably go wrong the first time I run it, and be frank about which part of the idea the activity cannot produce on its own and which I will have to state outright. My own sketches keep collapsing into either a lecture with props or a set-up where the nudge looks bad from the start; I need the defence to actually land before it is put under pressure.
reasoning: |-
  We are designing an activity to illustrate the "orphaned default" problem in the context of paternalism and nudging. The activity should have two main phases: 
   Phase 1: Participants experience a nudge (a default) that is beneficial and aligns with their current preferences (or a "self" they identify with at that time).
   Phase 2: Without changing the default, the context changes (e.g., their preferences or the situation) so that the same default is no longer optimal, but it remains in place because there is no mechanism to update it.

   We want the default to be largely invisible until it becomes a problem. The stakes should be small but real.

   Idea: Use a simple allocation task (like distributing tokens or points) that will be used to decide how the remaining class time is spent (or for a small tangible reward). We have two rounds.

   Setup:
   - We are going to have two rounds of an allocation task. 
   - The allocation task: Each participant gets a set of tokens (say, 10 tokens) that they must allocate between two options: Option A and Option B.
   - The tokens they allocate to each option will be converted into a chance to win a desirable outcome (or to influence how class time is spent).

   However, the twist is that the conversion rate (or the value) of the tokens in each option may change between rounds, and there is a default allocation that is set in Round 1 and carried over to Round 2 unless explicitly changed.

   We will use the following structure:

   Round 1: 
     - Participants are told that they are allocating tokens for a task that will affect how the class time is spent at the end of the session (or for a small reward). 
     - They are told that in Round 1, Option A is worth 2 points per token and Option B is worth 1 point per token. 
     - They are also told that there is a default: if they do nothing, all 10 tokens will be allocated to Option A (the better one). 
     - They can change the allocation if they wish. 
     - The points they accumulate will be used in a lottery (or in a way that makes the points valuable) for a reward (e.g., having a 10-minute break with snacks, or deciding on a topic for a fun discussion).

     Why this default? Because at the time of Round 1, Option A is objectively better (unless there is some other hidden preference). We expect most to stick with the default.

   Round 2:
     - Without announcing any change in the conversion rates, we tell participants that we are moving to Round 2. 
     - We do not reset the allocations. The allocations from Round 1 (or the default if they didn't change) are carried over. 
     - But we change the conversion rates: Option A is now worth 1 point per token and Option B is worth 2 points per token.
     - We give them an opportunity to change their allocation (but we don't explicitly point out the change in rates unless they ask? or we do? We want the default to be invisible until they see the problem).

     However, we must consider: if we don't tell them about the change, then they might not notice and then they are stuck with a bad allocation. But that's the point: the default is sticky and the environment changed without the default being updated.

     But we also want to give them a chance to change, because we want to see if they notice. However, the key is that the default was set in Round 1 and carried over, and the context changed without an automatic review.

     How to handle:

     In Round 2, we tell them: "Now we are going to do Round 2. Your allocation from Round 1 has been carried over. If you wish to change your allocation for Round 2, you may do so now. You have 2 minutes to make any changes. After that, we will lock in your allocation for Round 2."

     But we do not tell them that the point values have changed. We just let them change if they want. We are counting on the fact that they might not think to check the point values again because the default is sticky and they might assume the environment is the same.

     Alternatively, we could announce the change in point values only to a few (to simulate that the information is available but not pushed) but that might complicate.

     Let's keep it simple: in the instructions for Round 2, we do not mention the point values at all. We just say: "Round 2 is starting. Your allocation from Round 1 is shown. You may change it if you wish. You have 2 minutes."

     Then, after Round 2, we reveal the point values for Round 2 and compute the points.

     This way, those who did not change (and especially those who had the default) will have a bad allocation in Round 2.

   Debrief:
     We then reveal the point values for Round 2 and show how the default that was good in Round 1 became bad in Round 2. We discuss:
      (a) In Round 1, the default (all to A) was beneficial because it matched the point structure and saved them from having to do anything. This is the "as judged by themselves" defense: in Round 1, they would have judged that the default was good for them (if they thought about it, they would have chosen A).
      (b) The orphaned default: the default was set for Round 1 conditions and then carried over to Round 2 without anyone (on the choice architecture side) checking whether it was still appropriate. The conditions changed, and the default became orphaned.
      (c) Auditing asymmetry: In Round 1, the instructor set the default deliberately (with the job to set up the activity). In Round 2, the instructor did not revisit the default (because it wasn't their job to constantly check? or because there was no trigger to check). The burden of noticing that the default is no longer appropriate falls on the participants, but they didn't notice because the default was invisible and they didn't think to check.

   Materials:
     - Allocation forms (physical or digital) for two rounds.

     Form for Round 1:
       [ ] Option A: ___ tokens (each token gives 2 points in Round 1)
       [ ] Option B: ___ tokens (each token gives 1 point in Round 1)
       Total tokens: 10. 
       Note: If you do nothing, all tokens will go to Option A.

     Form for Round 2 (given after Round 1 is collected and without revealing the Round 2 point values):
       [ ] Option A: ___ tokens (the value per token in Round 2 is hidden at the time of allocation)
       [ ] Option B: ___ tokens
       Total tokens: 10.
       Note: Your Round 1 allocation is pre-filled. You may change it.

     We collect Round 2 forms and then reveal the point values for Round 2: Option A: 1 point per token, Option B: 2 points per token.

     Then we compute the total points for each participant for both rounds (but we might focus on Round 2 for the problem).

     We can then ask:
       - How many changed their allocation in Round 2? Why?
       - How many did not change? Why? (Did they assume the point values were the same? Did they not think to check?)

     And then we can have a discussion about the real-world examples: pension auto-enrollment (set at 3% when that was good, but now maybe 5% is better but it hasn't been updated), organ donation (opt-in vs opt-out when the population's attitudes change), etc.

   What will go wrong:
     1. Some participants might change their allocation in Round 2 just because they are bored or want to experiment, even without knowing the point values changed. This might dilute the effect.
     2. Some participants might ask about the point values for Round 2. How to handle? We can say: "The rules for how tokens convert to points may change from round to round, and we will announce the conversion rates at the end of the round." But if they ask, we must be honest? We don't want to lie. So we can say: "We cannot disclose the conversion rates until after you make your allocation for Round 2." But that might raise suspicion.

     Alternatively, we can say: "The conversion rates for Round 2 will be revealed after the allocation." We don't have to say they changed. We just don't announce them until after.

     3. The activity might feel contrived and the point about the orphaned default might not be clear without the debrief.

     4. The asymmetry might not be fully felt because the instructor is present and could have updated the default. But we can explain that in reality, the entity that sets the default is often not the same as the one that would notice the need for change, and there is no automatic process.

   What the activity cannot produce on its own and must be stated:
     - The concept of the "orphaned default" and the auditing asymmetry. We must explicitly connect the experience to these terms in the debrief.
     - The fact that in real life, the change in context (like a new generation with different preferences or a change in economic conditions) happens without any deliberate action, and the default remains because it is invisible and there is no assigned responsibility to update it.

   Revised plan to address potential issues:

     - To prevent suspicion, we can frame the activity as two independent rounds that use the same allocation form for efficiency. But then why carry over the allocation? We can say: "To save time, we are using your allocation from Round 1 as a starting point for Round 2. You are free to change it."

     - We can also run Round 1 and Round 2 with a break in between (maybe after a short lecture or discussion) so that they forget the exact details.

     - We must make sure the reward is tangible enough to matter. One idea: use the points to determine the break snack (if they get above a certain threshold, they get a better snack) OR use the points to vote on how to spend the last 10 minutes of class (e.g., a list of fun topics). But we have to compute the points quickly.

     Alternatively, we can use a lottery: each point is a chance in a raffle for a small prize (like a $5 gift card). Then we draw one winner at the end.

     Steps:

     Step 1: Introduce the activity as a way to understand how allocation decisions can affect outcomes. Explain that they will allocate tokens in two rounds and that the tokens will be converted to points which will be entries in a raffle for a prize.

     Step 2: Round 1:
          - Tell them the conversion rates: Option A: 2 points per token, Option B: 1 point per token.
          - Tell them the default: if they do nothing, all tokens go to A. They can change it.
          - Give them a form (or use an online form) and collect.

     Step 3: Do a short lecture or discussion (about 10 minutes) on another aspect of nudging (to create a gap and make them forget the exact numbers).

     Step 4: Round 2:
          - "We are now going to do Round 2. Your Round 1 allocation has been carried over. You may change it if you wish. You have 2 minutes. Note: the conversion rates for Round 2 will be announced after we collect your allocations."
          - Collect the Round 2 forms.

     Step 5: Reveal the Round 2 conversion rates: Option A: 1 point per token, Option B: 2 points per token.

     Step 6: Calculate the total points (Round 1 points + Round 2 points) for each student and hold a raffle (if using a raffle). Alternatively, if using the points to decide class time, then aggregate the points for each option (but note: the allocation was individual, so we might need to think). 

     Alternatively, we can have the reward be individual: the raffle ticket idea is straightforward.

     Step 7: Debrief.

     Debrief questions:
       - How many of you kept the default in Round 1? Why? (It was the best, so why change? This is the as-judged-by-themselves at that time.)
       - How many changed in Round 2? Why? (Some might have changed just because they wanted to, but most probably didn't. Ask those who didn't change: did they assume the rates were the same? Why didn't they check? Because they didn't think about it? The default was invisible and they didn't feel the need to question it.)
       - How many of you are unhappy with your Round 2 allocation now that you know the rates? (Probably those who stuck with A in Round 2.)

     Then we connect:
       (a) In Round 1, the default was good and we all (or most) accepted it. That's the libertarian paternalist defense: it helped us without taking away choice.
       (b) But in Round 2, the same default was bad. Why didn't it change? Because it was set and then forgotten. It became an orphaned default. No one was assigned to check if it was still good when the environment changed (and we didn't even notice the environment changed until it was too late).
       (c) The auditing asymmetry: It was easy for me (the instructor) to set the default in Round 1. But in Round 2, I didn't update it because I didn't have a reminder to check (or because I, as the choice architect, don't have a continuous duty to check). And you, as the choosers, didn't notice because the default was working silently. So it fell through the cracks.

     Then link to real-world examples.

     What the activity cannot do on its own:
       - The concept of the orphaned default and auditing asymmetry must be explicitly named and explained. The activity sets up the experience, but we have to connect the dots.
       - The activity might not fully capture the long-term nature of real-world defaults (which persist for years). We have to emphasize that in reality, the change in context might happen gradually and over a long time.

     Predictable problems:
       - Some students will change their allocation in Round 2 and by chance might do better. But that's okay because it shows that they had the freedom to change, but the point is that the default wasn't updated and many didn't change because they didn't notice.
       - If we use a raffle, the stakes are small and random, so it might not feel very consequential. But that's acceptable for a classroom activity.

     Alternative: Instead of a raffle, we can have the points determine the break activity. For example, the average points for the class (or the total) could unlock:
          - If the class average is above X, they get a 10-minute break with snacks.
          - If below, only 5 minutes without snacks.

     But then we have to compute the average quickly. And note: in Round 2, if most are stuck with A, the class average will be low. So they might not get the break. That makes the stakes real.

     However, that might create a collective action problem and might not reflect individual choice. So the raffle might be better for individual stakes.

     Let's go with the raffle for simplicity.

     Materials:
       - Allocation forms (paper or digital) for Round 1 and Round 2.
       - A way to quickly compute points (maybe a Google Form that does automatic calculation? or just by hand if the class is small).

     Time:
       - Round 1: 5 minutes (including instructions)
       - Break for lecture/discussion: 10 minutes
       - Round 2: 5 minutes (including collection)
       - Reveal and raffle: 5 minutes
       - Debrief: 20-30 minutes

     Total activity time: about 45 minutes, leaving time for other discussion.

     Let me know if this works.
answer: |-
  ### Activity Design: "The Sticky Default Experiment"  
  **Objective:** Illustrate the orphaned default problem through experiential learning, where participants first benefit from a well-designed nudge, then experience its drawbacks when their preferences change and the default remains unexamined.  

  ---

  #### **Setup & Materials**  
  - **Stakes:** A 10-minute "bonus break" during class, allocated based on points earned. Top 25% of scorers choose how to spend it (e.g., extra discussion time, casual chat, short meditation). Low-stakes but meaningful.  
  - **Materials:**  
    - Printed allocation sheets (or digital forms) for two rounds.  
    - Envelopes labeled "Round 1" and "Round 2" (to create separation between phases).  
    - Timer.  
    - Hidden conversion rates (revealed only after decisions).  
  - **Choice Structure:** Participants allocate 10 tokens between **Option A (Work)** and **Option B (Leisure)**. Points determine break privileges.  

  ---

  #### **Rounds & Instructions**  
  **Phase 1: The Beneficial Default (Round 1)**  
  *Goal: Participants experience a default that aligns with their current preferences.*  
  - **Setup:**  
    - *Announce:* "We’ll do a short activity to decide bonus break options. Allocate 10 tokens between Work (A) and Leisure (B). Points convert to break privileges."  
    - *Reveal conversion rates:* **1 token for A = 3 points** (high value), **1 token for B = 1 point** (low value).  
    - *Set default:* "If you do nothing, all tokens go to A (Work). You may change this."  
    - *Time:* 2 minutes to decide. Collect sheets in "Round 1" envelopes.  
  - **Psychology:**  
    - Default (all tokens to A) maximizes points → Participants see it as helpful ("rescue" from low-value B).  
    - Most will accept the default (or shift slightly to A), as it aligns with their current goal (maximize points).  

  **Interlude (5 minutes)**  
  - Distract with light content: Show a neutral video clip or discuss a non-related ethics case.  
  - *Key:* Do **not** mention Round 2 rules yet.  

  **Phase 2: The Orphaned Default (Round 2)**  
  *Goal: Preferences change, but the default remains unchanged and unexamined.*  
  - **Setup:**  
    - *Announce:* "We’ll repeat the allocation with the same tokens. Your Round 1 choices are pre-filled. You may adjust them."  
    - *Hide critical changes:* **Do not reveal new conversion rates** (A = 1 point/token, B = 3 points/token).  
    - *Emphasize inertia:* "If you’re happy with your choices, no need to change."  
    - *Time:* 2 minutes. Collect sheets in "Round 2" envelopes.  
  - **Psychology:**  
    - Participants now prefer Leisure (B) due to higher points, but the sticky default (A) persists.  
    - Few will question the preset allocation (invisibility of defaults). No one is assigned to audit it.  

  **Reveal & Calculate Points**  
  - Announce true conversion rates for both rounds:  
    - **Round 1:** A=3 pts, B=1 pt  
    - **Round 2:** A=1 pt, B=3 pts  
  - Calculate total points. Award break privileges to the top 25%.  

  ---

  #### **Debrief Framework**  
  Connect activity moments to core concepts:  

  | **Activity Moment**               | **Concept**                          | **Discussion Questions**                                                                 |
  |-----------------------------------|--------------------------------------|------------------------------------------------------------------------------------------|
  | **Round 1 Default Acceptance**    | (a) *As-judged-by-themselves defense* | "Why did most of you keep the default in Round 1? Did it feel like it helped you?" → Highlight alignment with their own goals at the time. |
  | **Round 2 Inertia & Frustration** | (b) *Orphaned-default problem*       | "Who noticed the rates flipped? Why didn’t the default update? Who was responsible?" → Link to real-world examples (e.g., pension defaults set for past generations). |
  | **Lack of Auditing Mechanism**    | (c) *Auditing asymmetry*             | "Was anyone *assigned* to check if Round 1 defaults fit Round 2? How does this mirror real policy?" → Contrast deliberate setting vs. passive inheritance. |

  **Key Insights to Reinforce:**  
  - **Orphaned Defaults:** Defaults outlive their original justification when preferences/environments shift (e.g., organ donation defaults set for one era, inherited by another).  
  - **Asymmetry:** Setting a default is a one-time act; noticing its obsolescence requires ongoing, unassigned vigilance.  
  - **Policy Implication:** Nudges need "sunset clauses" or periodic reviews to avoid detachment from choosers’ judgments.  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem:** Participants might detect the trap in Round 2.  
     - *Mitigation:* Use the interlude to create distraction. If asked about rates, reply vaguely: "The rules are consistent with Round 1’s structure." Only reveal post-activity.  

  2. **Problem:** Low emotional investment in stakes.  
     - *Fix:* Frame break privileges as desirable (e.g., "You’ll choose between extra office hours or music"). Personalize rewards.  

  3. **Problem:** Some override defaults in both rounds, missing the point.  
     - *Fix:* In debrief, contrast "active choosers" (who changed allocations) with "default inheritors" (who didn’t). Ask: "Why did most stick with defaults? Was it rational in Round 1? Harmful in Round 2?"  

  4. **What the Activity Can’t Do Alone:**  
     - **Explicitly naming "orphaned default" and "auditing asymmetry":** You must define these terms *after* the activity. Participants will feel the frustration but need you to crystallize the concepts.  
     - **Linking to systemic examples:** Use debrief to connect to pension plans, privacy settings, etc. ("Just like your tokens, organ donation defaults were set for 1990s preferences—now they’re orphaned").  

  ---

  #### **Why This Works**  
  - **Defense Lands First:** Round 1 makes participants *appreciate* the nudge (it maximizes their points). Only in Round 2 does it become problematic.  
  - **Invisibility Achieved:** By hiding Round 2 rules and normalizing inertia, the orphaned default emerges organically.  
  - **Realism:** Mirrors how defaults in policy/practice persist without malice, just bureaucratic neglect.  

  **Final Tip:** Run the activity with confidence—even if flaws emerge, they become teachable moments ("Notice how some of you tried to audit? Real-world choosers rarely do!"). This creates a visceral "aha" moment for orphaned defaults.
