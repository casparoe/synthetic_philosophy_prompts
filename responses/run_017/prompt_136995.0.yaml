  - "nearest_concepts": array of objects, each with "name", "core_idea", "where_it_fits_my_case", "where_it_breaks_down"
  - "the_test": string — the single question to ask of any candidate explanation, phrased so I could use it on a new example
  - "instances_classified": array of objects, each with "instance" (short label: cell and DNA, ant colony, market prices, honeycomb, thermostat, neurons), "verdict" ("smuggling", "harmless shorthand", "genuine", "different mistake"), and "reason" (one sentence)
