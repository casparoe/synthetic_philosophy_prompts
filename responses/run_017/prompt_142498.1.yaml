answer: |-
  Here is the sestina crafted for your closing reading, followed by the committed prose argument:

  **Sestina: The Selven Measure**

  She writes the first line of her lover’s **letter**,
  Imagining the pressure of his hand.
  It takes a lifetime’s patience, this strict **measure**:
  To find the word that fits the form, yet rings
  More **faithful** to the heart than to the rule.
  The sharp constraint becomes the shaping **tongue**.

  What language speaks the truth upon the **tongue**?
  Hers falters, marking what was truly **seen**.
  (That flicker in the garden – was it **told**
  To her, or did she watch the shadow fall?)
  The verb demands its single, telling **letter**:
  The proof compressed within the syllabled **measure**.

  O, the relentless, clarifying **measure**!
  To choose the sound that pins the moment’s **seen**
  Requires a witness, sharp and **faithful**,
  Not just the echo of a rumour **told**.
  It binds the fleeting vision to the **letter**,
  And names the source the speaking **tongue** relies on.

  The cold precision of the marking **tongue**!
  Was *this* love's gesture privately **seen**,
  Or is it merely second-hand, a **told**
  Tale, softened by its passage? **Faithful** thought
  Stumbles upon the strict accounting **letter**,
  Trapped in the unforgiving, framing **measure**.

  Consider then the cost of that **measure**:
  To save the form, the crucial mark of **seen**
  Must sometimes yield to what was only **told**.
  The inference becomes the fact, the **faithful**
  Report dissolves. The shaping **tongue** must choose
  Which truth to save, which truth to **letter**.

  So lines arrive, each sealed with its **letter**,
  The evidence constrained by sound and **tongue**.
  The garden meeting? Now it must be **seen**
  (Though whispered doubt suggests it was **told**).
  The meter holds, demanding **faithful**
  Adherence to its counted **measure**.

  But look: the final, reconciling **measure**!
  This isn’t loss. It’s choice made **faithful**
  To the pressure of the form. The **tongue**,
  Forced by the line’s end and the rhyming **letter**,
  Declares outright what was obscurely **told**,
  Or fixes inference as fact **seen**.

  The **tongue** transforms the **told** to sharp **seen**,
  Compels a **faithful** stance within the **measure**,
  And seals the shifting truth within its **letter**.

  ---

  **The Argument:**

  This poem argues that the form-preserving translation is not merely a different poem "wearing the same clothes," but rather the *truest possible lyric* achievable under the target language's formal constraints. By forcing discrete, irrevocable choices about epistemology line by line ("Seen," "Told"), the act of preserving meter and rhyme ("Measure," "Letter") paradoxically becomes the most faithful ("Faithful") act to the *lyric impulse itself* – the distillation of complex feeling into a singular, shaped utterance ("Tongue"). The constraint doesn't obscure meaning; it *creates* the specific, charged meaning of *this* version. The deliberate sacrifice is the nuanced ambiguity of evidentiary source available in Selven (and potentially in a looser English paraphrase). We give up the *original's specific marking* of how knowledge was obtained. The strongest objection from a dissenting translator would be that this approach fundamentally alters the poem's *philosophical ground*: by resolving the original's inherent epistemological ambiguity (where Selven might allow a blend or uncertainty within a line), the formal translation imposes a false certainty or a misleading simplicity, turning a meditation on the fragility of knowing into a series of definitive, albeit beautiful, assertions. It replaces the source's evidential texture with the target's formal imperative, changing the poem's very nature.
