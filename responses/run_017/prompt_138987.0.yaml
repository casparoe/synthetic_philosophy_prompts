  Noticing the user cares about ethical nuance. They insisted the program isn't secretly evil—so Ms. Vance's weariness and clipped notes show systemic flaws without malice. Anya's dad being the off-page hardass (mentioning his "forge" metaphor) externalizes the moral debate cleanly. 

  The ending lands where requested: unresolved. Anya polishing glasses, Priya's bandaged hands, Leo's suspension—all lingering questions. No neat answers, just the "sour tang" of doubt. Perfect for their zine's conversational vibe. 

