prompt: |-
  I run a tiny grad-student philosophy podcast, and next week's guest is someone who defends an ideal-advisor account of reasons: roughly, what there's most reason for you to do is what a version of you with full information, unlimited time to think, no mood effects and no deliberative blind spots would advise you to do. The account is meant to be indirect — not a claim about how anyone should actually deliberate or about what should move them.

  I want eight to ten questions that get past her just restating the view again. Things I want covered:

  (1) The order-of-idealization worry. Give her a concrete case where informing first and then making the agent fully coherent yields different advice than making her coherent first and then informing her — and build in the follow-up to her likeliest move, which is to say she idealizes "all at once" and so there's no order.

  (2) The handoff problem: the advisor that exists now and the advisor who'd exist after I'd taken her advice pick different options, so which one supplies my reasons now? Follow up if she says reasons are time-indexed.

  (3) The insulated agent: someone whose actual motivational set screens off counterevidence (a true believer, say, whose commitment is defined so that no experience counts against it), so the "fully informed" version never gets going. Follow up on the likely reply that insulation is itself a deliberative defect to be idealized away.

  (4) Whether an advice-relation can really carry the weight here without the view collapsing either into objectivism with extra steps or into plain subjectivism — plus a closing question about what she'd count as evidence against the view.

  Keep the questions in her vocabulary rather than mine, and skip anything biographical.
reasoning: |-
  Okay, the user runs a small philosophy podcast for grad students and has a guest next week who defends an ideal-advisor account of reasons. They need 8-10 questions that go beyond just restating the view. The user wants to cover four specific issues: order-of-idealization, handoff problem, insulated agent, and whether the view collapses into objectivism or subjectivism. Plus, they want a closing question about what would count as evidence against the view.

  First, I need to understand each of these concerns deeply. The order-of-idealization worry is about whether the sequence of idealization steps affects the outcome. The guest might say idealization happens all at once, but the user wants to challenge that with a concrete case where different sequences lead to different advice. The handoff problem deals with conflicting advice from the advisor before and after taking action. The insulated agent case involves someone whose beliefs are immune to counterevidence, so full information doesn't change their mind. Then there's the meta-worry about the view collapsing into other theories. 

  The user emphasized using the guest's vocabulary. So I should frame questions using terms like "full information," "coherence," "deliberative defects," etc. Avoid jargon from other theories. Also, skip biographical questions and focus solely on the philosophical issues.

  For the order-of-idealization, I need a concrete example. Maybe a scientist with a pet theory. If informed first, they might reject counterevidence due to incoherence. If made coherent first, they might accept the evidence. The follow-up should press on whether "all-at-once" idealization is coherent here.

  The handoff problem: Suppose the advisor now says to invest in a career path, but after taking that path, the advisor changes their mind. Which advice defines reasons now? Follow up on time-indexing to see if reasons change over time.

  Insulated agent: A true believer whose faith is unfalsifiable. The guest might say insulation is a deliberative defect to be idealized away. But if the defect is part of their identity, does idealization strip that away? Is the resulting advice still relevant to the actual agent?

  For the collapse worry, I need to probe if the ideal advisor’s advice tracks objective reasons or just the agent's subjective values. If it's the former, it's objectivism with extra steps. If the latter, it might be subjectivism. Also, ask what evidence would falsify the view to see how testable it is.

  The user mentioned the guest's likely moves, so prepping follow-ups is crucial. For each main question, anticipate responses and have a deeper layer ready. Make sure the questions are concise and phrased in the guest's framework. Avoid leading too much; let the guest explain, but steer towards the core issues.

  Finally, structure the questions to flow naturally: start with clarification, then the four issues, and end with the falsifiability question. Aim for 8-10 questions total, each with possible follow-ups. Check that all user points are covered and that the questions push the guest beyond restating their view.
answer: |-
  Here are 10 targeted questions addressing your specified concerns, phrased within the ideal-advisor framework and avoiding restatements of the core view:

  1.  **Clarifying Idealization Process:** "Your account relies on a fully informed, coherent, unclouded version of the agent. Could you elaborate on how these idealizations interact *procedurally*? Is it simply that the advisor possesses all these properties simultaneously in the final state, or is there an implied sequence or weighting in how these factors are combined to form the advice?"
      *   *(Sets up Order-of-Idealization)*

  2.  **Order-of-Idealization Case:** "Consider Dr. Nova, a brilliant but stubborn physicist deeply invested in Theory A. Full information includes overwhelming evidence disproving A and supporting Theory B. However, her current motivational set makes her *incoherent* – she’d irrationally dismiss this counter-evidence due to her investment. If we idealize by granting full information *first*, she might (incoherently) reject it. If we idealize coherence *first*, she’d likely accept the evidence and embrace Theory B. How does your ‘all-at-once’ idealization resolve this specific conflict to yield unambiguous advice?"
      *   *(Directly poses the concrete case, forcing engagement with the conflict)*

  3.  **Order Follow-up (Challenging "All-at-Once"):** "If ‘all-at-once’ idealization avoids this sequence problem by definition, how does it *non-arbitrarily* determine the resultant motivational structure in cases like Dr. Nova's? Doesn't the outcome still depend on whether 'full information' is interpreted as *presented* data or data the advisor *accepts*, which seems to reintroduce the order issue?"
      *   *(Presses the "all-at-once" defense, highlighting potential arbitrariness)*

  4.  **The Handoff Problem:** "Imagine my ideal advisor *now* advises me to pursue career path X. After I follow this advice and gain the experiences of X, my ideal advisor *at that future time* (with full info *including* my lived experience of X) now advises me that I actually had most reason to pursue Y instead. Which advisor's judgment defines what I had most reason to do *at the initial time* – the one existing then, or the one existing later?"
      *   *(Presents the core handoff dilemma)*

  5.  **Handoff Follow-up (Time-Indexing):** "If you say reasons are time-indexed, such that my reasons *now* are defined by the ideal advisor *now*, doesn't this imply that the ideal advisor *later* might correctly judge that my *past self* acted on reasons that were, from the *future* perspective, suboptimal? How does this avoid the implication that I might be rationally obligated *now* to do something that my future ideal self will deem to have been the *wrong* thing to have done with my initial reasons?"
      *   *(Challenges the implications and potential weirdness of time-indexing)*

  6.  **The Insulated Agent:** "Consider Brother Sol, a 'true believer' whose core commitment is defined such that *no possible experience or information* could count as evidence against it – his motivational structure actively screens off counter-evidence. What does his fully informed, coherent, unclouded ideal advisor advise him to do? Does the advisor simply affirm the insulated belief?"
      *   *(Presents the insulated agent case)*

  7.  **Insulation Follow-up (Deliberative Defect):** "If you argue that such insulation is itself a 'deliberative defect' idealized away, doesn't this mean the ideal advisor necessarily *lacks* Brother Sol's defining core commitment? If so, how is the resulting advice *reasons-for-Sol*? Isn't this advisor now advising a fundamentally different agent, one without the commitment that makes Sol *Sol*?"
      *   *(Attacks the "deliberative defect" reply, highlighting relevance/identity)*

  8.  **Collapse Worry (Objectivism):** "How does the ideal advisor avoid simply *tracking* objective normative facts? If the ideal advisor *necessarily* converges on what's objectively best (or right, or rational) given the agent's situation, isn't this just objectivism about reasons with the advisor as an unnecessary intermediary?"
      *   *(Challenges proximity to objectivism)*

  9.  **Collapse Worry (Subjectivism):** "Conversely, if the advisor's advice is fundamentally shaped by the *actual agent's contingent starting motivational set*, even after idealization, how does this avoid collapsing into a sophisticated form of subjectivism, where reasons are ultimately grounded in actual (albeit idealized) desires or values?"
      *   *(Challenges proximity to subjectivism)*
      *   *(Optional follow-up if needed: "Could two agents with radically different starting motivations, given full information and coherence, receive diametrically opposed advice about the same situation, and both be correct about *their own* reasons? If yes, how is this not subjectivism? If no, how does idealization reliably overcome radical starting differences?")*

  10. **Falsifiability/Evidence:** "Finally, what kind of phenomenon or counterexample would you consider compelling evidence *against* the ideal-advisor account as the correct theory of normative reasons? What would genuinely make you doubt its adequacy?"
      *   *(Probes the theory's empirical/metaphysical commitments and testability)*

  **Key features of these questions:**

  *   **Vocabulary:** Uses "ideal advisor," "full information," "coherence," "deliberative defects/blind spots," "advises," "reasons-for-[agent]," "motivational set," "contingent starting point."
  *   **Avoids Restatement:** Each question assumes understanding of the core view and pushes into its implications or problem areas.
  *   **Concrete Cases:** Uses specific, albeit stylized, examples (Dr. Nova, Career Path X/Y, Brother Sol) to ground the abstract worries.
  *   **Anticipates Replies:** Builds follow-ups (#3, #5, #7, #9) targeting the most likely defensive moves.
  *   **Covers Your Points:** Explicitly addresses Order-of-Idealization (#2, #3), Handoff (#4, #5), Insulated Agent (#6, #7), Collapse Worry (#8, #9), and Falsifiability (#10). Question #1 provides a clarifying lead-in.
  *   **Non-Biographical:** Focuses purely on the philosophical content.

  These should create a rigorous and engaging discussion that moves well beyond simply restating the ideal-advisor thesis. Good luck with the podcast!
