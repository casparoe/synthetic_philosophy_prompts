prompt: |-
  I work on the payments side of a mid-sized public program that hands out money to organisations for things we want more of -- restoring wetland, retrofitting old buildings, running job training, that sort of thing. The rule we apply, and as far as I can tell every program remotely like ours applies some version of it, is that we are only supposed to pay for the bit that would not of happened anyway. Internally we call it additionality. What I want from you is: what is a program like ours actually committed to, philosophically, by running that test? Because the longer I do this job the more it looks like the test is doing three or four different jobs and only one of them is the job we say it's doing.

  Here's what I mean. On the application form, before anything has happened, we ask applicants the present-tense or future-tense question: if we don't fund you, will you still do this? On audit, two years later, after the thing is done and everyone knows how it turned out, we ask the past-tense question: would you have done this without our money? And I've started to think these are not the same question at all. The first one is asked while the decision is still open, and applicants answer it like they're deciding or negotiating -- a lot of them answer it like a threat, and our own training tells us not to reward that, because someone saying pay me or I walk is just bargaining. The second one is asked when the thing is settled, and people answer it like a question about a fixed fact, and they seem to reason backwards from what actually happened: we did it, so I suppose we'd of found the money somehow. I've watched the same outfit give genuinely different answers to those two questions and I don't think it's only self-interest, though obviously it's partly that.

  Then there's a third move. When we can't get a straight answer out of anyone, we quietly switch to a completely different question: is this the sort of thing that people are doing anyway? Is it already legally required? Would any outfit in this line of work be doing it without a subsidy? That's not about the applicant at all -- it's a generalisation about a class of cases -- and everybody in the office treats it as if it were the same question, just easier to answer.

  And then the fourth thing, which is the one that really bugs me. Even when we've been extremely strict about the individual would-have question at the eligibility stage, the size of the payment is worked out against a regional average, not against what this applicant would have done. So the yes/no is counterfactual and the how much is statistical, and nobody seems to notice the whiplash.

  So: reconstruct the theory that all this presupposes. Does it presuppose that there is a determinate fact of the matter about what a particular organisation would have done? Does it presuppose that the future-tense question and the would-have question have to have the same answer, and if it does, is that presupposition one anybody has defended? Does it need causation to be a matter of difference-making for the individual case, or would a purely probabilistic or statistical view run the whole thing? Is there anything special or dodgy about the fact that the antecedent is about the applicant's own decision -- that the thing we're hypotheticalising away is the very choice we're trying to buy, and that asking about it might change it or make it uncheckable? Tell me which parts of our practice strictly require the strong counterfactual machinery and which parts would survive just fine if we replaced it with averages, and which of the four things I described are flatly in tension with each other. And if we dropped the test entirely -- paid everyone who did the thing, or paid a rate calibrated off randomised trials of the whole program -- what would we actually be giving up, and what would we gain?

  One more thing about how I want the answer pitched: I don't want a reading list or citations, I want it in your own words, and I want you to mark clearly which bits are settled and which are genuinely fought over by people who work on this, and not quietly present one side of a live fight as the consensus. Where you're going past what's actually established and into your own reconstruction, say so and say how confident you are.
reasoning: |-
  Okay, let me unpack this user's query. They work in a public program that funds organizations for socially beneficial projects, using an "additionality" test to ensure they only pay for what wouldn't have happened otherwise. But they've noticed four inconsistencies in how this test is applied: the difference between future-tense and past-tense questions, a shift to generalizing about project types, and a disconnect between eligibility determination and payment calculation. 

  Hmm, the user is clearly frustrated by these operational contradictions. They're asking for a philosophical reconstruction of what their program is actually committed to by using this test. Underneath that, I sense they're questioning whether additionality is fundamentally coherent as a concept. Their detailed observations suggest deep institutional experience - this isn't theoretical for them.

  Right, first I need to map their four observations to philosophical commitments. The future/past tense discrepancy touches on determinism versus free will. The generalization shift reveals category thinking versus individual counterfactuals. The payment calculation gap shows statistical versus singular causation. And the self-referential problem (hypothesizing about the choice you're buying) is pure decision theory.

  I should clarify which parts are settled consensus versus contested. The problems with counterfactual verification? Settled - nobody thinks that's reliable. But whether statistical approaches are "good enough"? Hotly debated. The ethical argument about opportunity costs? That's my reconstruction, but grounded in welfare economics principles.

  The user wants practical tradeoffs. If they dropped additionality: they'd gain efficiency and reduce gaming, but lose (perceived) budget purity. Randomized trials could work but face political hurdles. Most importantly, they'd need new legitimacy stories - additionality serves political functions beyond its economic one.

  Noticing how sharp their observations are about applicant behavior. When they describe applicants treating funding as a threat then later as inevitable, that's classic retrospectivity bias in action. The office's category shift is institutional coping. The payment calculation gap is probably the most philosophically indefensible part - pure cognitive dissonance.

  The response should validate their intuition that these are four distinct mechanisms masquerading as one test. Need to clearly separate: 1) the determinism presupposition 2) the category generalization 3) the statistical shortcut 4) the self-referential problem. Each has different implications if changed.

  For the reconstruction, I'm about 80% confident on the causation framework, 90% on the verification problems, but only 60% on my alternative justification about opportunity costs - that's more speculative but logically follows from the premises. Should flag that.

  Biggest tension is between their strict individual counterfactual at eligibility versus statistical payment. That's not just inconsistent - it actively undermines the additionality premise. Either go full statistical (like carbon credits) or full individual (nearly impossible), but this hybrid is worst of both worlds.

  If they moved to randomized trials for payment rates, they'd still need to answer "additional to what?" - the control group defines the baseline. But at least it's consistent. The gain would be ending the charade of impossible individual assessments. Loss might be perceived fairness - why fund someone who would've done it anyway? Though one could argue the payment accelerated it...

  The organizational psychology angle matters too. Additionality isn't just an economic test - it's a ritual demonstrating due diligence. Any replacement would need equivalent ceremonial rigor. Maybe that's why the category shift happens - it creates defensible boxes when individual predictions fail.

  Should emphasize that no approach is perfect. But their current method combines epistemic weaknesses with implementation contradictions. The cleanest fixes would be: 1) own the category approach explicitly or 2) use randomized baselines. Both more honest than the current patchwork.

  Most valuable insight for them: the core tension isn't operational but philosophical. They're trying to measure something that fundamentally resists measurement (singular causation), then pretending statistical proxies are the same thing. Naming that contradiction might empower them to redesign.
answer: |-
  Here's a reconstruction of the philosophical commitments and tensions in your additionality regime, based on your observations. I'll mark areas of consensus, debate, and my own reconstructions clearly.

  ### Core Philosophical Commitments
  1.  **Metaphysical Determinism (Contested):** The practice *presupposes* that for each project/organization, there is a (theoretically) knowable, singular, determinate fact about what would have happened without your funding. This assumes the world is sufficiently fixed and causal chains are traceable. **This is heavily contested.** Philosophers (e.g., free will debates) and economists (e.g., fundamental uncertainty) argue reality is often indeterminate or probabilistic, not deterministic. Your observation of shifting applicant answers (future threat vs. past inevitability) exposes this fragility.
  2.  **Causal Singularism vs. Generalism (Major Tension):**
      *   The *eligibility test* ("Would *you* have done it?") commits to **Singular Causation**. It cares about the *specific counterfactual* for *this applicant*: "In *this* world, minus *this* grant, would *this* project have happened?" It demands assessing an individual's actual choices and constraints.
      *   The *payment calculation* (regional averages) and the *category shift* (do people do this anyway?) commit to **General Causation** or **Statistical Causation**. They care about typical behavior across a class, not the specific counterfactual for *this* case. The payment calculation especially implies that while *whether* it happens is individual, *how much* it costs to make it happen is determined by market averages – a significant leap.
  3.  **The "But-For" Test of Causation (Settled in Theory, Flawed in Practice):** At its core, additionality relies on the legal/philosophical concept of "but-for" causation: "But for our intervention (the grant), the outcome (the project) would not have occurred." **This is the settled theoretical foundation.** However, its practical application is universally recognized as incredibly difficult, often impossible, for precisely the reasons you observe (self-interest, retrospectivity, indeterminacy).
  4.  **The Self-Referential Problem (Critical Insight - Your Own/Consensus):** You've hit on a profound issue: **the antecedent being negated (the grant) is the very thing proposed to *cause* the choice it's trying to assess.** Asking "Will you do this without my money?" during negotiation fundamentally alters the decision landscape. It introduces bargaining dynamics ("pay me or I walk") and makes the "true" counterfactual state fundamentally inaccessible *before* the decision. *After* the fact, hindsight bias ("we did it, so we must have been able to") makes verification equally impossible. **This is widely acknowledged as a core, perhaps insurmountable, practical flaw in individual counterfactual assessments.**

  ### Mapping Your Four Observations to the Tensions
  1.  **Future-Tense vs. Past-Tense Question:** This highlights the **Self-Referential Problem** and **Indeterminism**. The future question occurs in a state of open possibility and negotiation (dynamic, strategic). The past question occurs after the grant itself has shaped the organization's reality, capabilities, and memory (static, retrospectivity bias). They *cannot* reliably yield the same answer. This is a live operational debate, though the *theoretical* expectation is that they *should* align.
  2.  **Shift to Category/Generalization:** This is a **retreat from Singular Causation to General Causation** due to the impracticality/impossibility of the former. It replaces "What would *this* applicant have done?" with "What *do* applicants *like this* typically do?". It's pragmatically necessary but philosophically inconsistent with the stated individual counterfactual test. **This is a common, often unacknowledged, coping mechanism recognized by practitioners.**
  3.  **Payment Calculation vs. Eligibility Test:** This is the starkest **tension between Singular and General Causation.** Eligibility demands a unique counterfactual story about *this* applicant ("But for us, no project"). Payment calculation ignores that unique story and uses a statistical average ("How much extra cost did we cover *for projects like this*, on average?"). It implicitly assumes the *cost* of achieving additionality is generalizable, even if the *fact* of additionality isn't. **This inconsistency is rarely defended philosophically; it's usually a pragmatic accounting tool.**
  4.  **The Core Impossibility:** All three points above stem from the fundamental difficulty (arguably impossibility) of reliably knowing an individual counterfactual where the intervention *is* the decision being bargained over (the **Self-Referential Problem**).

  ### What Requires Strong Counterfactuals? What Could Use Averages?
  *   **Requires Strong Counterfactuals (Singular Causation):** The *binary eligibility decision* ("Is this project additional?") *as currently conceptualized and justified* ("pay only for what wouldn't happen anyway") absolutely requires a strong singular counterfactual claim. This is its entire stated rationale. Without this claim, the justification for funding *this specific project* based on counterfactual impact evaporates.
  *   **Could Use Averages/Probabilities (General Causation):**
      *   **Payment Calculation:** This *already does* and arguably *only makes sense* statistically. It doesn't need strong individual counterfactuals.
      *   **Category-Based Eligibility (Your 3rd Observation):** This *could* be the basis for a *different* kind of program – one that funds activities inherently unlikely to occur without subsidy across a sector. This abandons the individual counterfactual pretense.
      *   **Program Design & Budgeting:** Estimating *overall program impact* or setting budgets based on historical averages or sectoral analysis is statistical and doesn't require individual counterfactuals.

  ### Dropping the Test Entirely: Gains and Losses
  **Option 1: Pay Everyone Who Does The Thing ("Output Funding")**
  *   **Gain:** Massive simplification, reduced administrative burden, eliminates gaming of the additionality test, faster disbursement, potentially wider participation. Focus shifts purely to *output delivery*.
  *   **Loss:** **The Core Justification:** You explicitly abandon the principle of only paying for the *incremental* change. You pay for activity that might have happened anyway ("deadweight loss"). This significantly weakens the *economic efficiency* argument for the program. Political legitimacy ("taxpayer money wasted") could suffer. Budgets stretch less far in terms of *net new* outcomes.
  *   **What you gain is operational ease; what you lose is the counterfactual-based claim to efficiency.**

  **Option 2: Pay a Rate Calibrated via Randomized Controlled Trials (RCTs)**
  *   **Gain:** Provides a *rigorous, statistical estimate of average additionality* for the *program as a whole*. Eliminates individual counterfactual headaches, strategic bargaining, and retrospectivity bias *at the application stage*. Payments are predictable and formulaic. Justification shifts to *evidence-based average impact*.
  *   **Loss:** **Individual Justification Vanishes:** You still pay *this* applicant based on the *average* effect, knowing full well that *for some* you are paying for what they would have done anyway (false positives), and potentially denying others who *were* truly additional but fall outside the average (false negatives). The direct link between *this specific grant* and *this specific counterfactual* is severed. Requires significant upfront investment in RCTs and may be politically sensitive (denying some based on averages). Doesn't solve the payment calculation discrepancy if the RCT rate differs from the regional average cost.
  *   **What you gain is robust evidence of *program-level* impact and operational simplicity; what you lose is the ability to claim *this specific grant* caused *this specific project* that *definitely* wouldn't have happened otherwise.**

  ### Confidence & Consensus Marking
  *   **Settled/Strong Consensus:** The "but-for" test is the theoretical foundation. Verifying individual counterfactuals, especially in negotiation contexts, is extremely difficult and prone to bias/gaming (your observations 1 & 2 are widely recognized flaws). The category shift (3) is a common pragmatic workaround. The payment calculation discrepancy (4) is a standard, often unremarked-upon, practice.
  *   **Live Debate:** Whether strong singular counterfactuals are *possible* (metaphysics) or *necessary* (policy). The validity of purely statistical/probabilistic approaches (like RCT-based payments) vs. clinging to individual assessment. The ethical weight of deadweight loss vs. the costs and distortions of additionality testing. Whether "output funding" is acceptable if the outputs are valuable enough.
  *   **My Reconstruction:** The **Self-Referential Problem** as the core generator of the tensions you observe is my synthesis, grounded in decision theory and the philosophy of causation. I'm highly confident (80-90%) this accurately describes the fundamental bind. My analysis of the **Singular vs. General Causation** tension structuring your four points is also my framework, but one I believe fits the evidence well (85% confidence). The **loss/gain analysis** of dropping the test is standard welfare economics applied to your context (high confidence).

  **In essence:** Your practice is philosophically committed to an individual, deterministic counterfactual ("but-for" causation) that is likely unknowable in principle due to the self-referential nature of the intervention. It then smuggles in statistical and categorical reasoning to cope with this impossibility, creating internal tensions, especially between eligibility (singular) and payment (general). Dropping the test simplifies operations but forces a fundamental shift in how you justify spending public money – from counterfactual efficiency to either pure output delivery or statistically estimated average impact. The core question becomes: Is the cost, complexity, distortion, and philosophical incoherence of chasing the impossible counterfactual worth more than the perceived inefficiency of paying for some activity that might have happened anyway? There's no settled answer, only trade-offs.
