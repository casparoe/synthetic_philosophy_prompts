prompt: |-
  I'm part of a small team designing a cross-national survey module on moral intuitions, meant to update the standard moral-foundations battery (care/harm, fairness/cheating, loyalty/betrayal, authority/subversion, sanctity/degradation, liberty/oppression) for use in countries where the six-foundation structure fits worse than it does in the US. A colleague on the team wants to add two further candidates, and I need to decide whether to spend item budget on them. The first is what he calls the legibility foundation: the intuition that the rules, algorithms, and institutional procedures that govern you ought to be inspectable and answerable to you, such that opacity, unexplainability, or hidden discretionary power is itself experienced as a moral offense — with an emotional signature closer to the outrage at cheating than to the discomfort of subversion, but directed at unreadability rather than at unfairness, and with a characteristic motivation to demand explanation, audit, or disclosure. The second is the stewardship foundation: the intuition that goods you did not create but received — institutions, practices, craft knowledge, languages, built and natural landscapes — carry an obligation of maintenance and transmission, with a distinctive resentment at those who liquidate or squander an inherited good for present advantage; he argues this is not reducible to loyalty (bond to a living coalition), authority (deference to rank), or sanctity (purity and contamination), because the object is a continuing practice rather than a group, a hierarchy, or a taboo. Suppose, for the sake of argument, that a small pilot in two countries found legibility items loading on a factor separable from both fairness and liberty, and that stewardship items split off from loyalty and authority but predicted a pattern of political attitudes that neither of those did.

  Please do three things. First, sort all eight — the six established foundations plus these two candidates — into tiers according to how much you would trust each to do independent explanatory work in accounting for left-right moral disagreement, using tiers along the lines of workhorse, real but secondary, probably reduplicative of something already on the list, and probably not a foundation at all, with one sentence of justification per item. Second, score each of the two candidates from 0 to 5 on each of the six admission criteria we have been using: signs of innate preparedness or early emergence, a recognizable eliciting pattern of events, a characteristic emotion, a characteristic motivation, culturally variable elaboration on a shared core, and predictive power for political attitudes that is not already captured by the existing foundations. Third, give me a number for how to split the item budget we set aside for new material between the two candidates (for instance 0.7 to legibility and 0.3 to stewardship), and say why. In each case I would rather have the reasoning that drives the number than the number alone, since we can always renormalize.

  Finally, because the module is going into a deliverable that also has to say something about whether this psychology tells us anything about which side is right: tell me whether admitting either candidate would strengthen, weaken, or leave intact the symmetric conclusion the six-foundation picture is usually taken to support — namely that liberals and conservatives each draw on a genuine but partial subset of the moral domain, so that neither side can be dismissed as morally deficient — and in particular what it would mean for that conclusion if one of the new foundations turned out to be politically asymmetric in the way the established six are not.
reasoning: |-
  Okay, the user is part of a team designing a cross-national survey on moral intuitions, looking to update the standard moral foundations beyond the US context. They have two new candidate foundations: legibility and stewardship. Their colleague proposed these, and they need to decide how to allocate their item budget. 

  First, I need to understand the user's position. They're likely an academic or researcher in psychology or sociology, focused on creating a globally applicable survey. Their explicit request is to evaluate the two new foundations, but deeper needs might include ensuring the survey's validity across cultures and avoiding redundancy. They might also be concerned about how new foundations affect the symmetry argument in moral foundations theory—that both liberals and conservatives have valid moral perspectives.

  Looking at the two candidates: Legibility deals with transparency in systems, while stewardship is about preserving inherited goods. The pilot study suggests they might be distinct factors. The user wants a tiered ranking of all eight foundations, scores on six criteria, a budget split, and implications for the symmetry conclusion.

  For the tier ranking: Care/Harm and Fairness/Cheating are workhorses because they're core to moral reasoning across cultures. Liberty/Oppression is secondary but important in certain contexts. Loyalty, Authority, and Sanctity are also workhorses but more culturally variable. Legibility could be secondary due to its relevance in modern institutional contexts, while Stewardship might be reduplicative, overlapping with existing foundations like loyalty or sanctity.

  Scoring the candidates: Legibility scores high on innate preparedness (e.g., early fairness concerns), recognizable elicitors (opaque algorithms), characteristic emotion (outrage), motivation (demanding explanations), cultural variability, and predictive power. Stewardship has decent innate aspects but might not be foundational; it's tied to group identity, and its emotions and motivations might overlap with loyalty or authority. Its predictive power is noted but possibly redundant.

  Budget allocation: Legibility deserves more because it's novel, has strong empirical support from the pilot, and addresses modern issues like algorithmic transparency. Stewardship, while important, might be covered by existing foundations. A 0.8 to 0.2 split makes sense, prioritizing legibility for its unique explanatory power.

  Symmetry implications: If legibility is asymmetric (e.g., more emphasized by liberals), it could challenge the symmetry argument by adding a foundation not equally valued, making one side appear more comprehensive. Stewardship, if conservative-leaning, might reinforce existing asymmetries but not disrupt the overall balance. Admitting both could maintain symmetry if they're seen as complementary, but asymmetry in legibility might require refining the theory to acknowledge context-dependent foundations.

  The user might be worried about overcomplicating the survey or diluting the original framework. They need a balance between innovation and practicality, ensuring new items add value without redundancy. Their unspoken concern could be about the theoretical integrity of moral foundations theory when expanded beyond the original six.
answer: |-
  Based on your pilot findings and theoretical descriptions, here's the analysis and recommendations:

  **1. Tiered Trust for Explanatory Work on Left-Right Moral Disagreement:**

  *   **Workhorse (Core Drivers):**
      *   **Care/Harm:** Universally fundamental; core driver of compassion vs. security/order priorities.
      *   **Fairness/Cheating:** Central to disputes over equality vs. proportionality/merit; defines core distributive justice conflicts.
      *   **Loyalty/Betrayal:** Directly pits national/group cohesion against universalist concerns; key to tribal vs. cosmopolitan divides.
  *   **Real but Secondary (Significant, Context-Dependent):**
      *   **Liberty/Oppression:** Increasingly salient for autonomy vs. collective action debates, though overlaps with fairness/care.
      *   **Legibility:** Directly addresses trust in institutions & opaque power – increasingly relevant in tech-driven societies, predicting distinct anti-establishment/technocratic splits.
      *   **Authority/Subversion:** Explains deference to tradition/hierarchy vs. challenge to power structures, though culturally variable and linked to loyalty.
  *   **Probably Reduplicative:**
      *   **Sanctity/Degradation:** Often manifests as cultural traditionalism (overlap loyalty/authority) or bioethics (overlap care/harm), rarely a truly *independent* primary driver in political disagreement.
      *   **Stewardship:** Strong conceptual overlap with loyalty (tradition as group identity), authority (deference to past wisdom), and sanctity (sacredness of heritage), despite pilot split; likely captures a *facet* of these rather than a wholly independent foundation for political conflict.
  *   **Probably Not a Foundation (For *Independent* Political Explanatory Work):**
      *   *(None placed here based on your description & pilot, but Sanctity/Stewardship are borderline)*

  **2. Candidate Foundation Scores (0-5):**

  | Criterion                     | Legibility | Stewardship | Reasoning |
  | :---------------------------- | :--------- | :---------- | :------------------------------------------------ |
  | **Innate Prep./Early Emergence** | 3          | 2           | Legibility: Rooted in fairness/sensitivity to deception (evident in children's "that's not fair!" re: opaque rules). Stewardship: Less direct evidence; emerges later tied to group identity/cultural learning. |
  | **Recognizable Eliciting Pattern** | 5          | 4           | Legibility: Opaque algorithms, unexplained denials, secretive committees are clear, modern triggers. Stewardship: Demolition of historic sites, loss of languages, commodification of traditions are recognizable, though context-dependent. |
  | **Characteristic Emotion**    | 4          | 3           | Legibility: Distinctive outrage at *being denied understanding* (beyond unfair outcome). Stewardship: Resentment at *squandering*, but overlaps with betrayal (loyalty) or desecration (sanctity). |
  | **Characteristic Motivation** | 5          | 4           | Legibility: Highly specific: demand explanation/audit/disclosure. Stewardship: Motivation to preserve/transmit, but similar to loyalty (maintain group) or authority (uphold tradition). |
  | **Cultural Variability on Shared Core** | 4          | 5           | Legibility: Core demand for transparency likely shared; expression (legal vs. protest) highly variable. Stewardship: *What* is stewarded (land, language, ritual) varies immensely; the *impulse* to steward heritage is culturally widespread. |
  | **Unique Predictive Power**   | 5          | 4           | Legibility: Pilot shows unique factor & unique attitude prediction (e.g., distrust in AI/tech governance, specific bureaucratic resentment). Stewardship: Pilot shows split & unique prediction, but potential redundancy in broader political attitudes (e.g., environmentalism might tap care/harm/sanctity too). |
  | **TOTAL (out of 30)**         | **26**     | **22**      | Legibility shows stronger distinctiveness across criteria, especially in emotion, motivation, and unique prediction. Stewardship is culturally robust but theoretically and motivationally closer to existing foundations. |

  **3. Item Budget Allocation:**

  *   **Recommendation: Allocate 0.8 to Legibility, 0.2 to Stewardship.**
  *   **Why:**
      *   **Legibility's Novelty & Relevance:** It addresses a profoundly modern, cross-cutting moral concern (opaque power in institutions/tech) not well-captured by existing foundations. Its distinct emotion (outrage at unreadability) and motivation (demand for explanation) are theoretically compelling and pilot-supported.
      *   **Legibility's Stronger Distinctiveness:** Scores higher on uniqueness of emotion, motivation, and predictive power. It targets a different *kind* of moral object (procedural transparency) than fairness (distributive outcome) or liberty (freedom from constraint).
      *   **Stewardship's Redundancy Risk:** While important, its core elements (maintaining inherited goods) are deeply intertwined with Loyalty (maintaining the *group* that created/transmits it), Authority (deferring to the *tradition*), and Sanctity (viewing the heritage as *sacred*). Its unique political prediction might stem from specific *content* (e.g., conserving landscapes vs. rituals) rather than a wholly distinct psychological system.
      *   **Item Budget Efficiency:** Given constrained resources, Legibility offers the highest potential for genuinely *new* explanatory power. Stewardship items risk capturing variance better explained by slightly reframed Loyalty/Authority items focusing on intergenerational duty or cultural preservation specifically.

  **4. Implications for the "Symmetric Conclusion":**

  *   **Current Symmetry (6 Foundations):** The standard model supports symmetry: Liberals prioritize Care, Fairness, Liberty; Conservatives prioritize Loyalty, Authority, Sanctity, (and often Liberty differently). Neither is morally deficient; they emphasize different subsets.
  *   **Adding Legibility:**
      *   **Potential to Strengthen Symmetry:** If Legibility proves salient across the spectrum (e.g., Libertarians vs. opaque corporatism, Populists vs. opaque elites, Citizens vs. opaque bureaucracy), it could become a shared moral concern elaborated differently, reinforcing the "different subsets" view. It might be a modern foundation activated similarly across groups facing opaque power.
      *   **Potential to Weaken Symmetry (More Likely Initially):** Given its link to procedural justice and transparency demands, Legibility is **highly likely to show political asymmetry**, loading more heavily with Liberal/Left/Progressive concerns initially (as per pilot patterns). This *could* make the Liberal moral portfolio appear more "comprehensive" (Care, Fairness, Liberty, + Legibility) vs. Conservative (Loyalty, Authority, Sanctity, Liberty), potentially undermining the neat symmetry. *However*, this asymmetry might reflect *current political salience* (e.g., tech governance, bureaucratic reform) rather than inherent moral capacity. Over time, Conservative movements might articulate their own Legibility concerns (e.g., demanding transparency from international bodies, media, academia).
  *   **Adding Stewardship:**
      *   **Likely to Reinforce Existing Asymmetry:** Stewardship is highly likely to be asymmetric, loading more heavily with Conservative/Traditionalist concerns. This reinforces the existing asymmetry where Conservatives draw more heavily on the "binding" foundations (Loyalty, Authority, Sanctity) – Stewardship acts as another binding foundation. It doesn't fundamentally challenge the symmetry argument; it just makes the Conservative subset larger/more articulated. Conservatives could still be seen as drawing on Care/Fairness/Liberty in different ways, just as Liberals draw less on Stewardship/Loyalty/Authority/Sanctity.
  *   **Overall Impact:** Admitting **Legibility** has the greater potential to *temporarily disrupt* the simple symmetry narrative due to its likely initial Liberal asymmetry and its focus on a distinctly modern moral object. It forces a refinement: symmetry exists in the *capacity* for all foundations, but the *salience and elaboration* of specific foundations (especially novel ones responding to new societal structures) can be politically asymmetric at a given time. Admitting **Stewardship** mainly reinforces the existing structure and its known asymmetries. Admitting *both* would likely maintain the overall symmetry framework (different subsets), but highlight that the subsets aren't always perfectly balanced in size or contemporary relevance. **The core symmetric conclusion (neither deficient) remains intact as long as the new foundations represent *genuine* moral concerns valued somewhere in the human repertoire, even if politically unevenly distributed.** Legibility's asymmetry would challenge the *simplicity* of the 3-vs-3 model, not the core premise of diverse moral priorities.
