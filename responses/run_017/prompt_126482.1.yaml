  *scratches head* Tricky part is making "They call themselves the good" sound natural in both value-systems. In aristocratic mode it should ring triumphant; in priestly mode, defensive. And ressentiment must show cunning invention, not petulance. 

  *checks notes* Avoiding later Nietzsche concepts is crucial. No Übermensch, no eternal recurrence. Pure Essay I: knightly-aristocratic vs. priestly-ascetic, schlecht vs. böse, ressentiment as creative force. 

  *starts drafting*
