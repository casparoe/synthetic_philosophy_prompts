  Volta at Stanza III's "poisoned wells" - that's when priestly logic seeps in. Stanza IV-V shift to cramped spaces ("narrow rooms") and negation ("not-evil"). Final stanza's "ashen mouths" shows ressentiment's verbal inventiveness. 

