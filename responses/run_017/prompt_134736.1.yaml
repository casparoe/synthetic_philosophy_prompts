prompt: |-
  hey — i'm a software engineer, no philosophy background, and i want a spec, not a lecture. i've read the pop-sci "heritability doesn't mean what you think it means" explainers and i don't want another one of those; i want the requirements list.

  some context on what i'm actually doing, because i think it changes the answer: i want a number that plays the role heritability plays for organisms, but for ML systems. concretely, i run a bunch of training runs and i get a spread of benchmark scores across them, and i want to say how much of that spread is "due to" the data mix vs. the architecture vs. the seed. before i invent my own metric and ship it, i want to know what the original has to get right, and where my analogy is going to fall apart.

  so: write me the desiderata for a definition or measure of heritability. adequacy is relative to a purpose, so pick one explicitly — but the two jobs i care about are (1) predicting what happens if you select on the trait (breed for it; in my case, take the best runs and do more of whatever they did), and (2) answering the ordinary-person question of how much a trait is "genetic" / how much is down to environment. tell me straight whether one number can do both jobs or whether any definition has to choose.

  for each requirement give the case behind it. the ones i already want to see handled, so don't skip them:

  - the single-gene, totally environment-fixable case (the PKU-ish one: clearly genetic, completely manageable by changing diet)
  - a trait that's near-universal and clearly genetic but has almost no variance in the population
  - a trait where nearly all the variance in my population comes from environment because the genetics is uniform
  - the same genotype doing well in one environment and badly in another
  - parents supplying both the genes and the environment, so the two are tangled together

  and i want the "does heritability 0.8 mean 80% of *your* trait is genetic" thing turned into an actual requirement with a case behind it, not just asserted as a gotcha.

  also: mark which requirements are non-negotiable (fail them and you're not measuring heritability, or you're using the number illegitimately) versus which are just preferences of one camp — the quantitative-genetics people, the interventionists, whatever. and flag any pair of desiderata you think can't be jointly satisfied; that's the part i most want, because if the list is contradictory then the honest deliverable is "stop asking for one number," and i'd rather find that out now than after i've built a dashboard on top of it.

  then, briefly: which single requirement knocks out the most of the ways people actually deploy heritability numbers in arguments? and a short paragraph each — not a literature review, i don't want citations, just shape of the thing — on how three candidates do against the list: the variance-ratio / ANOVA-style definition, a counterfactual or interventionist one (something like: how much would the trait change if you changed the genes while holding environment fixed), and a molecular "caused by a gene" one.

  last: back to my ML version. which desiderata transfer cleanly, and which one breaks first — and is it because there's no analogue of random assignment, no breeding, no sampled environment, or something else? i'd rather hear the failure mode than a list of caveats. cheers.
reasoning: |-
  We are designing a measure for heritability. The user is a software engineer who wants a spec, not a lecture. They want desiderata (requirements) for a definition of heritability, with cases, and then a brief evaluation of three candidate definitions. They also want to know how well these requirements transfer to their ML context.

  The user has two main purposes for the measure:
  1. Predicting the outcome of selection (like breeding in biology, or in ML: taking the best runs and doing more of what they did).
  2. Answering the ordinary-person question of how much a trait is "genetic" (or in ML, how much is due to architecture, data, seed, etc.).

  They also provided specific cases that must be handled.

  We'll break down the desiderata into non-negotiable (must have for heritability) and negotiable (preferences of one camp). We'll also note if any two desiderata conflict.

  Then, we'll evaluate three candidate definitions:
  A. Variance-ratio (ANOVA-style): Heritability = V_genetic / V_total
  B. Counterfactual/interventionist: How much the trait would change if you changed genes while holding environment fixed.
  C. Molecular "caused by a gene": A trait is heritable if there's a specific gene that causes it.

  Finally, we'll discuss the transfer to ML.

  ---

  **Desiderata for a Heritability Measure**

  We define:
  - Trait: the characteristic we're measuring (e.g., height, IQ, or in ML: benchmark score).
  - Population: the group of individuals (or ML runs) we are studying.
  - Genes: the inherited factors (in ML: architecture, hyperparameters, seed?).
  - Environment: non-inherited factors (in ML: data mix, random seed?).

  *Non-negotiable Desiderata:*

  1. **Must be a population statistic, not individual.**  
     *Case:* The PKU case (single gene, environment-fixable). In a population with PKU, heritability of the disease (if untreated) is high because the genetic mutation is the main source of variance. But for an individual, changing diet (environment) prevents the disease entirely.  
     *Why non-negotiable?* Heritability is about the population, not an individual. It doesn't make sense to say "80% of your trait is genetic" for an individual.

  2. **Must account for gene-environment interaction.**  
     *Case:* The same genotype does well in one environment and badly in another (e.g., a plant that grows tall in sunlight but stunted in shade).  
     *Why non-negotiable?* Without this, the measure fails in cases where the effect of genes depends on the environment.

  3. **Must be relative to the population and environment studied.**  
     *Case:* A trait that is near-universal and clearly genetic but has almost no variance (e.g., having two eyes in humans). The genetic basis is clear, but because there's no variation in the trait, heritability is undefined or zero.  
     *Why non-negotiable?* Heritability is about variation in a trait in a specific population in a specific environment. If there's no variation, heritability is zero.

  4. **Must separate genetic and environmental contributions to variance, but without requiring gene-environment independence.**  
     *Case:* Parents supplying both genes and environment (e.g., smart parents provide both genes for intelligence and a stimulating environment). This tangles genes and environment.  
     *Why non-negotiable?* If the measure requires gene-environment independence (which is often unrealistic), it fails in common real-world scenarios.

  *Negotiable Desiderata:*

  5. **Should predict the response to selection (for purpose 1).**  
     *Case:* If you select the top 10% of individuals on a trait and breed them, how much does the trait increase in the next generation?  
     *Why negotiable?* This is the core of the breeder's equation, but some definitions (like molecular) might not directly address it.

  6. **Should be interpretable for the ordinary-person question (for purpose 2).**  
     *Case:* "Is intelligence genetic?" The answer should not be a single number without context.  
     *Why negotiable?* The ordinary person often misunderstands heritability as an individual-level causal effect, which it isn't.

  7. **Should be estimable from data without experimental control (e.g., from twin studies or family data).**  
     *Case:* In humans, we can't randomly assign genes, so we rely on natural experiments.  
     *Why negotiable?* Some definitions (like the counterfactual) might require interventions that aren't feasible.

  *Conflicts:*
  - Desiderata 1 and 6: The ordinary-person question often expects an individual-level answer, but heritability is population-level. This is a fundamental mismatch.
  - Desiderata 4 and 7: Separating genes and environment without random assignment is hard, especially when they are correlated.

  *The case that kills the individual-level interpretation:*
     Requirement 1 (non-negotiable) directly contradicts the common misstatement that "heritability 0.8 means 80% of your trait is genetic". The PKU case shows why: for an individual, the trait is 100% preventable by environment, but in a population without dietary intervention, heritability is high because the genetic variation is the main source of the disease variation.

  *Which requirement knocks out the most misuses?*
     Requirement 1 (population statistic, not individual) is the one that is most often violated in popular discourse. People often take a heritability number and apply it to an individual, which is invalid.

  ---

  **Evaluation of Three Candidate Definitions**

  1. **Variance-ratio (ANOVA-style):**  
     Heritability (h²) = V_genetic / V_total  
     - Handles non-negotiable:  
        - 1 (population): Yes, it's a ratio of variances in a population.  
        - 2 (interaction): No, because it doesn't account for gene-environment interaction (unless explicitly modeled, e.g., in an expanded ANOVA).  
        - 3 (relative): Yes, it is defined for a specific population and environment.  
        - 4 (no independence): Only if we can estimate V_genetic without assuming independence. In twin studies, we assume shared environment is similar, but if genes and environment are correlated, it breaks.  
     - Negotiable:  
        - 5 (selection): Yes, because the breeder's equation uses h².  
        - 6 (ordinary): Poor, because it's often misinterpreted as individual-level.  
        - 7 (estimable): Yes, from family or twin data.  
     *Verdict:* Fails on interaction and sometimes on gene-environment independence.

  2. **Counterfactual/interventionist:**  
     Heritability = How much the trait changes on average if you change the genes while holding the environment fixed (or vice versa for environment).  
     - Non-negotiable:  
        - 1: Yes, it's a population average of individual counterfactuals.  
        - 2: Yes, because it holds environment fixed, the effect of genes is measured in that fixed environment. But note: it might not capture the full interaction if the environment is fixed at one level.  
        - 3: Yes, it is relative to the environment you fix.  
        - 4: It requires holding environment fixed, which might not be possible if genes and environment are entangled.  
     - Negotiable:  
        - 5: Not directly, but you could build a selection model from it.  
        - 6: Better, because it's causal, but still not individual without more.  
        - 7: Hard to estimate because it requires intervention (random assignment of genes).  
     *Verdict:* Strong on causal interpretation, but hard to measure and doesn't directly address selection.

  3. **Molecular "caused by a gene":**  
     Heritability is the proportion of cases where a specific gene causes the trait.  
     - Non-negotiable:  
        - 1: No, because it's about presence of a gene, not variance.  
        - 2: Doesn't address interaction.  
        - 3: Fails because a trait can be entirely genetic but have no variance (e.g., two eyes) and then this definition might say it's genetic, but heritability is zero.  
        - 4: Doesn't separate variance contributions.  
     - Negotiable:  
        - 5: Not useful for selection (unless you know which genes).  
        - 6: Ordinary people might like it, but it's not about variance.  
        - 7: Might be estimable from GWAS, but doesn't give a variance ratio.  
     *Verdict:* Fails on almost all counts for a heritability measure. It's more about causation than heritability.

  *Summary:* The variance-ratio is the most common and works for selection (purpose 1) but fails on interaction and sometimes on gene-environment independence. The counterfactual is better for causal questions but hard to measure. The molecular definition isn't really heritability.

  ---

  **Transfer to ML Context**

  In ML, we have:
  - Trait: benchmark score.
  - "Genes": architecture, hyperparameters, seed (if we consider seed as part of the inherited code?).
  - "Environment": data mix, but note: in ML, we often control the data mix, so it's more like environment is fixed? Or we might vary it.

  *Which desiderata transfer?*
  - Non-negotiable 1 (population): Yes, we are looking at a population of runs.
  - Non-negotiable 2 (interaction): Very relevant. For example, an architecture might do well on one data mix and poorly on another.
  - Non-negotiable 3 (relative): Yes, we are studying a specific set of runs with given distributions of architecture, data, etc.
  - Non-negotiable 4 (no independence): In ML, we can control the factors. We can set up experiments where we vary one factor while holding others fixed, so we can achieve independence. This is easier than in biology.

  *Where does it break first?*
  The biggest issue is the analogy of "genes" and "environment". In biology, genes are inherited and environment is not. In ML, we can choose to "inherit" any factor we want. For example:
  - If we consider the seed as part of the "genes", then changing the seed isn't like changing genes because it's random and doesn't pass to offspring (if we think of offspring as derived from a run by mutation). But in ML we don't have breeding; we have independent runs.

  Moreover, in ML we don't have a natural concept of "offspring". So for purpose 1 (selection), we might not be breeding but rather identifying good configurations and then doing more runs with those configurations. But note: if we change the data mix (environment) for the next run, that's not like breeding.

  *Failure mode:*
  The requirement that is hardest to meet is **predicting the response to selection**. In biology, selection works by passing genes to the next generation. In ML, if we select a run with a high score and then do a new run with the same architecture but a different seed and data, we haven't passed the entire "genotype" (because the seed is different) and the environment (data) might be different. 

  So the ML scenario is more like: 
  - We have factors A (architecture), B (data mix), C (seed). 
  - We want to know: if we fix A and B to the values of a good run, and then run again (with a new seed), what score do we get? 

  But note: the seed is random and not inherited. So we might want to decompose:
  - Variance due to A, B, C, and their interactions.

  This is a standard ANOVA problem. However, the biological concept of heritability for selection assumes that the selected factor (genes) is passed on exactly, but in ML, we might not pass the seed (we can't, because it's random). So for architecture (A), if we fix A and change seed and data, we are not holding environment fixed.

  *Recommendation:*
  Do a full factorial design and decompose the variance using ANOVA. Then:
  - For selection: If you want to "breed" for architecture, the response to selection is captured by the main effect of architecture and its interactions. But note: if there's a strong interaction, then selecting an architecture that did well on one data mix might not do well on another.
  - For the "how much is genetic" question: You can report the proportion of variance due to architecture (and its interactions) as a variance ratio. But caution: this is for the population of runs you did, with the environments (data mixes) you tested.

  The breakdown happens because in ML we don't have the concept of inheritance of a fixed genotype. We can control the factors, so we can estimate the variance components cleanly (which is a plus). But the analogy to breeding is weak because we don't have generations of inheritance.

  *Conclusion for ML:*
  Use a variance decomposition (ANOVA) to attribute the variance in benchmark scores to your factors (architecture, data, seed, and interactions). This gives you variance ratios that are analogous to heritability for each factor. But note:
  - For selection: The variance ratio for architecture tells you how much of the variance is due to architecture, but to predict the next run, you must account for interactions. If you fix architecture and data mix, then the variance in the next run is due to seed (and possibly architecture-data interaction if you change data mix?).
  - For the ordinary question: You can say "X% of the variation in scores was due to architecture", but only for the runs you did.

  The main failure is that in ML, we don't have the natural constraints of biology (random assignment of genes via meiosis, fixed environment for an individual, etc.), so the decomposition is actually cleaner in ML. But the breeding analogy is forced.
answer: |-
  ### Desiderata for a Heritability Measure  
  *Purpose:* Quantify the contribution of genetic variation vs. environmental variation to trait variance in a population, for:  
  (1) **Breeding/selection prediction** (response to artificial selection);  
  (2) **Ordinary interpretation** ("how genetic is this trait?").  

  #### Non-Negotiable Requirements (fail these ⇒ invalid measure)  
  1. **Population-relative, not individual-specific**  
     - *Case:* PKU (single-gene disorder, preventable by diet). In a population without dietary intervention, heritability is near 1 (variance due to genes). For an individual, the trait is 100% fixable by environment.  
     - *Why:* Heritability describes *sources of variance in a population*, not individual destiny. Failing this enables "80% of *your* height is genetic" misconceptions.  

  2. **Variance decomposition under observed G×E covariance**  
     - *Case:* Parents provide genes + environment (e.g., high-IQ parents pass on genes and books). Genes and environment are correlated, but heritability must still disentangle their contributions.  
     - *Why:* Real-world populations have G–E covariation; requiring independence (e.g., randomized assignment) makes the measure inapplicable to humans/ML.  

  3. **Scale invariance**  
     - *Case:* Trait with near-zero variance (e.g., "having two eyes" in humans). Heritability should be undefined or 0 (no genetic *variation* to explain), even if the trait is "genetic."  
     - *Why:* Heritability requires variation. No variance ⇒ no meaningful ratio.  

  4. **Accounts for G×E interactions**  
     - *Case:* Identical genotype thrives in Environment A but fails in Environment B (e.g., drought-resistant crops in dry vs. wet climates).  
     - *Why:* If the effect of genes depends on environment, the measure must reflect this.  

  #### Negotiable Requirements (trade-offs between camps)  
  5. **Predicts response to selection**  
     - *Case:* Selecting top 10% of organisms/runs for breeding/replication. Measure should estimate trait change in the next generation/run batch.  
     - *Preference:* Critical for breeders/ML engineers; less so for causal inference.  

  6. **Intuitive for ordinary interpretation**  
     - *Case:* "Is schizophrenia genetic?" Laypeople want a single number, but heritability ≠ "causal strength."  
     - *Preference:* Quantitative geneticists accept abstraction; interventionists/clinicians prefer counterfactuals.  

  7. **Robust to uniform genetics**  
     - *Case:* Trait variance driven entirely by environment (e.g., plant height in a genetically identical crop). Heritability should be 0.  
     - *Preference:* Non-negotiable for variance decomposition; negotiable for molecular definitions.  

  #### Conflicts and Trade-offs  
  - **1 vs. 6:** Population-level variance decomposition (1) clashes with individual-level causal attributions (6). *Resolution:* Heritability cannot serve both; pick one purpose.  
  - **2 vs. 5:** Selection prediction (5) assumes no G×E covariance (violates 2). *Resolution:* Use a corrected breeder’s equation (if possible) or accept bias.  
  - **4 vs. Simplicity:** G×E interactions (4) complicate selection predictions (5). *Resolution:* Advanced models (e.g., reaction norms) needed.  

  #### Which Requirement Kills Common Misuses?  
  **Requirement 1 (population-relative)** invalidates >90% of popular misapplications:  
  - "Heritability = 80% ⇒ 80% of *your* trait is genetic" (individual attribution).  
  - "Low heritability ⇒ intervention won’t work" (PKU disproves this).  

  ---

  ### Candidate Definitions vs. Desiderata  
  1. **Variance-Ratio (ANOVA-style):** \( h^2 = \frac{V_G}{V_G + V_E + V_{G×E}} \)  
     - ✅ 1 (population), 3 (zero variance), 7 (uniform genetics).  
     - ✅ 5 (directly used in breeder’s equation).  
     - ❌ 2 (fails with G–E covariance; inflates \( V_G \)).  
     - ❌ 4 (lumps G×E into \( V_G \) or \( V_E \), masking interactions).  
     - ❌ 6 (prone to "proportion of variance" misinterpretation).  

  2. **Counterfactual/Interventionist:** *Change in trait if genes altered, environment fixed*  
     - ✅ 1 (population average), 2 (handles G–E covariance via intervention).  
     - ✅ 4 (captures G×E by testing environments separately).  
     - ❌ 3 (undefined if no genetic variation).  
     - ❌ 5 (not designed for selection; requires environmental control).  
     - ❌ 6 (still not individual-level; confuses laypeople).  

  3. **Molecular "Caused by a Gene":** *Presence of specific genes/causal variants*  
     - ✅ 4 (genes can have environment-dependent effects).  
     - ❌ 1, 3, 7 (not variance-based; ignores environmental variance).  
     - ❌ 2, 5, 6 (no selection prediction; overstates genetic determinism).  

  **Best for purpose:**  
  - (1) Prediction → **Variance-ratio** (with corrections for G–E covariance).  
  - (2) Ordinary interpretation → **Counterfactual** (but manage expectations: it’s still population-level).  

  ---

  ### ML Adaptation: Where the Analogy Breaks  
  **Clean transfers:**  
  - ✅ 1 (your "population" is runs; measure variance across them).  
  - ✅ 3 (if all runs use same arch/seed/data, \( h^2 = 0 \)).  
  - ✅ 4 (architectures may excel on some data mixes, fail on others).  
  - ✅ 7 (if all runs use same seed/data, variance is "environmental").  

  **First breakdown:**  
  - **Failure of Requirement 2 (G–E covariance):**  
    In ML, you *can* randomize "genes" (architecture) and "environment" (data mix), unlike biology. But if you *don’t* (e.g., you cherry-pick arch/data combos), covariance inflates variance estimates.  
  - **Why it breaks worse than biology:**  
    - No natural "inheritance": In ML, "offspring" runs are manually designed (no random segregation).  
    - "Environment" (data) is often *controlled* by you, not randomly sampled.  
    - "Seeds" are random noise, not heritable or environmental in a biological sense.  

  **Critical failure mode for selection prediction:**  
  - **Breeding ≠ replication.** Selecting top runs and cloning their arch/data/seed tells you nothing about *new* runs with the same arch/data but new seeds. Variance due to seeds is irreducible noise, not heritable.  
  - **Solution:** Decompose variance via ANOVA:  
    - \( V_{\text{trait}} = V_{\text{arch}} + V_{\text{data}} + V_{\text{seed}} + V_{\text{interactions}} + \cdots \)  
    - For selection, use \( \frac{V_{\text{arch}}}{V_{\text{total}}} \) to predict response *only if* you fix data mix and average over seeds.  

  **Recommendation:**  
  Use a **variance decomposition** (ANOVA) for your runs. Report:  
  - \( h^2_{\text{arch}} = \frac{V_{\text{arch}}}{V_{\text{total}}} \) for selection on architectures.  
  - But emphasize: *This is only valid for your fixed data mix and averaged over seeds.*  
  - For "how much is arch?" questions: Show \( h^2_{\text{arch}} \) but caveat: *"In this experiment, X% of variance came from arch, but it may interact with data."*  

  **Final takeaway:** One number can’t handle both purposes. For ML:  
  - Prediction → Variance ratio (with controlled conditions).  
  - Ordinary interpretation → Avoid; use conditional statements instead.
