                  We have for his private sphere: (a_p, a_l) vs (a_p, b_l): he must prefer (a_p, b_l) to (a_p, a_l) -> so c > a.
                  Also, we set b > c.

            So Lewd's ordering: 
                  c > a  (from private sphere) 
                  and b > c (from our assignment) -> so b > c > a.

            Then both prefer b to c? 
                  Prude: b > c -> yes.
                  Lewd: b > c -> yes.

            So by Pareto: society must prefer b to c.

            Now, from ML:
                  Prude: a > b (because in the pair (a,b) which are (a_p, a_l) and (b_p, a_l), he prefers a -> so society must have a > b)
                  Lewd: c > a (because in the pair (a,c) which are (a_p, a_l) and (a_p, b_l), he prefers c -> so society must have c > a)

            Then we have:
                  a > b (from ML for Prude)
                  b > c (from Pareto)
                  c > a (from ML for Lewd)

            Cycle: a > b > c > a.

          Therefore, even with disjoint private spheres (in the sense that the pairs for decisiveness are defined on changes in one coordinate) and nine states, we can rebuild the cycle by using three states that are: 
              a = (a_p, a_l)
              b = (b_p, a_l)   // only Prude changed
              c = (a_p, b_l)   // only Lewd changed

          and assigning preferences:

              Prude: a > b > c   [so a>b, b>c]
              Lewd: c > a and b > c -> so overall Lewd: b > c > a

          and then by the decisiveness conditions and the Pareto condition, we get the cycle.

          Therefore, your attempt two does not block the cycle.

  **What condition would block the cycle?** 

    - One way is to restrict preferences to be separable and non-meddlesome: each node only cares about its own state. Then, as shown above, the cycle does not occur.

    - Another condition is to use a weaker notion of rights. The game form approach by Gardenfors (1981) and later by Sugden (1985) and others models rights as the ability to choose one's own action (write your own key) and then the social state is the outcome of all actions. The social state is determined by the choices of the individuals. Then, the cycle might be avoided because the social outcome is determined by the joint actions. 

      In the Lady Chatterley example:

          Prude chooses an action: either read (R) or not (NR).
          Lewd chooses an action: either read (R) or not (NR).

          But the book is one, so if both choose R, there is a conflict. We need a mechanism to resolve the conflict. For example, the mechanism might be: 
              - If at least one chooses NR, then the outcome is the chosen actions.
              - If both choose R, then the outcome is (NR, NR) [or some other rule].

          Then, the individuals' rights are to choose their own action. The outcome is a function of the actions.

          In this case, the game form approach avoids the cycle because the social state is determined by the actions and the mechanism. The preferences are then over the actions, and they play a game. There might be a Nash equilibrium.

          For example, with the mechanism: 
              - If both choose R, outcome is (NR, NR).
              - Otherwise, outcome is the chosen actions.

          Then the payoff matrix (using the original preferences):

            Prude's preference: (NR,NR) > (R,NR) > (NR,R)
            Lewd's preference: (NR,R) > (R,NR) > (NR,NR)

          Matrix:

            Prude \ Lewd | NR       | R
            ---------------------------------
            NR           | (NR,NR) | (NR,R) 
            R            | (R,NR)  | (NR,NR)

          Now, what are the Nash equilibria?

            At (NR, NR): 
              Prude: if he deviates to R, outcome becomes (R,NR) -> which he prefers to (NR,NR)? 
                  Original: Prude: (NR,NR) > (R,NR) -> so he prefers (NR,NR) to (R,NR). So no incentive to deviate.
              Lewd: if he deviates to R, outcome becomes (NR,R) -> which he prefers to (NR,NR)? Yes, because Lewd: (NR,R) > (NR,NR). So he would deviate.

            So (NR,NR) is not a Nash equilibrium.

            At (NR, R):
              Outcome is (NR,R) [because Lewd chooses R and Prude NR -> so (NR,R)].
              Prude: if he deviates to R, then both choose R -> outcome (NR,NR). He prefers (NR,R) [which is the worst for him] to (NR,NR) [the best]? No, he prefers (NR,NR) to (NR,R). So he would deviate to R? Then outcome becomes (NR,NR) -> which is better for him.
              But note: if Prude deviates to R, then the actions are (R, R) -> so outcome becomes (NR,NR). So Prude by deviating gets (NR,NR) which he prefers to (NR,R). So he will deviate.

              Lewd: at (NR,R): if he deviates to NR, outcome becomes (NR,NR). He prefers (NR,R) to (NR,NR) -> so he doesn't want to deviate.

              But since Prude will deviate, (NR,R) is not stable.

            At (R, NR):
              Outcome is (R,NR).
              Prude: if he deviates to NR, outcome becomes (NR,NR) -> which he prefers to (R,NR) -> so he will deviate.
              Lewd: if he deviates to R, outcome becomes (NR,NR) -> which he prefers to (R,NR)? No, because he prefers (R,NR) to (NR,NR) (since (R,NR) is second best for him and (NR,NR) is worst). So he doesn't deviate.

            But again, Prude will deviate -> not stable.

            At (R,R): outcome is (NR,NR).
              Prude: if he deviates to NR, outcome becomes (NR,R) -> which he dislikes more than (NR,NR)? 
                  Prude: (NR,NR) > (R,NR) > (NR,R) -> so (NR,NR) is best, (NR,R) worst. So he wouldn't deviate to NR because that would lead to (NR,R) which is worse.
              Lewd: if he deviates to NR, outcome becomes (R,NR) -> which he prefers to (NR,NR)? 
                  Lewd: (NR,R) > (R,NR) > (NR,NR) -> so (R,NR) is better than (NR,NR). So he would deviate to NR? Then outcome becomes (R,NR) which is better for him.

            So (R,R) is not stable.

          Therefore, there is no pure strategy Nash equilibrium.

          But if we change the mechanism, we might get an equilibrium. For example, if we let the book go to whoever claims it first (so no conflict resolution rule) then we might have to have a sequential game.

          The game form approach does not guarantee the existence of an equilibrium. However, it avoids the cycle in the social ordering by not requiring one. The rights are about the ability to choose, not about the social ordering.

          This approach is by Gardenfors (1981) and perhaps what you were thinking of.

  ### Punchline

  If you weaken minimal liberalism by restricting the private spheres to be disjoint and defined over one coordinate (as in attempt one) the cycle can still occur if preferences are meddlesome (as shown in the nine-state example). 

  However, if you also restrict preferences to be non-meddlesome (each node cares only about its own state), then the cycle is broken. 

  Is this a genuine answer to the paradox? 

    - Yes, because it shows that the paradox arises from meddlesome preferences. In a system designed so that nodes only care about their own state, the conflict does not occur.

    - But note: in social choice, one might argue that individuals naturally care about others. However, in a distributed system, we can design the system so that nodes are not meddlesome. 

    - Alternatively, the game form approach changes the concept of rights from decisiveness over social states to control over one's own actions. This is a different formalization and avoids the impossibility.

  Therefore, the answer to the paradox depends on what we mean by rights. If we mean the ability to control one's own state (and not care about others), then the paradox is avoided. If we mean the ability to have one's preference respected over a pair of social states (even ones that only differ in one's own state) but with meddlesome preferences, then the paradox stands.

  In your distributed system, you are likely building non-meddlesome systems. Therefore, the theorem does not apply. The residue is that the theorem highlights the danger of meddlesomeness: if you allow nodes to have preferences over the entire state, then even with very weak conditions (ML and Pareto) you can get cycles.

  Final note: The condition that private spheres are disjoint and preferences are separable (non-meddlesome) is sufficient to avoid the cycle. This is a genuine solution in the context of your system.
