              Threat to health/safety: without the expense, there is a substantial risk of physical harm or serious health deterioration.
              Essential function: without the expense, the applicant cannot perform their job or essential daily activities (like caring for self or dependents).
              Quality of life: the expense would improve comfort or reduce pain but is not essential for function or safety.
     3. Eligibility threshold: 
          - Fund if:
              (a) The urgency is Immediate or Short-term AND the impact is at least Quality of life, OR
              (b) The impact is Threat to health/safety or Essential function (regardless of urgency).
          - If an application does not meet (a) or (b), it is rejected. But the committee can overrule by unanimous vote if they believe there are exceptional circumstances. The overrule must be documented as such.

     4. For eligible applications:
          - Severity score = urgency score (Immediate:3, Short-term:2, Non-urgent:1) * impact score (Threat:3, Essential:2, Quality:1).
          - Note: if an application is eligible by (b) and the urgency is non-urgent, then the urgency score is 1, so severity might be low (e.g., 1*2=2). That's acceptable.

     5. Split the fund: 50% for List A (severity), 50% for List B (cost-effectiveness).

     6. Rank:
          List A: by severity score (desc), then self-rated need (desc), then cost (asc).
          List B: by severity per dollar (severity / cost, desc), then self-rated need per dollar (desc), then severity score (desc).

     7. Allocate:
          - Take the first $9,000 (or half the monthly fund) and allocate to the top of List A until the portion is exhausted.
          - Then, take the remaining money and allocate to the top of List B until exhausted.

     8. Bias review: check the distribution of funded applications by role and tenure. If a group is underrepresented, revisit their applications to ensure the dimensions were not underassigned. If found, adjust the dimensions and recalc if necessary (if it changes eligibility or ranking).

     9. Write up each decision.

     Now, let's run Example 1 with the possibility of overrule:

          Application A (engineer): 
            Urgency: Non-urgent -> 1
            Impact: We initially said quality of life (1). But the committee, knowing that chronic back pain can lead to disability, might argue that it is essential function. They vote unanimously to overrule the impact to essential function (2). Then:
              Eligibility: by (b) [essential function] -> eligible.
              Severity score: 1 * 2 = 2.

          Application B (warehouse): 
            Urgency: short-term (2)
            Impact: quality of life (1) -> eligible by (a)
            Severity: 2*1=2

          Now both are eligible. 
          Self-rated need: A=8, B=10
          Cost: A=$900, B=$1200

          List A ranking (by severity then need then cost):
              Both have severity=2. Then by need: B (10) > A (8). Then cost: A is cheaper but need is lower? So order: B then A.

          List B ranking (by severity/$):
              A: 2/900 = 0.00222
              B: 2/1200 = 0.00167
              So A then B.

          Now, allocate:
            Stage 1 (List A): $9,000
              Fund B: $1200 -> remaining $7800
              Then fund A: $900 -> remaining $6900
            Stage 2 (List B): remaining applications? None because both were funded.

          So both are funded.

          But note: we only have $18,000. This month we might have other applications. We must consider the entire set.

          Alternatively, if we only have these two and they are the only eligible ones, then we fund both.

          Write-up for A: "Initially did not meet threshold because impact was assessed as quality of life. Committee overruled by unanimous vote, reassigning impact to essential function due to risk of loss of work function. Funded from List A (ranked second in the severity list)."
          Write-up for B: "Funded from List A (top of the severity list)."

          This overrule might be seen as favoritism. But the committee must be cautious.

     Given the complexity, the procedure might be:

     We provide a clear form for the committee to fill for each application, and a spreadsheet to compute.

     We also note: the Head of People's proposals are incorporated in part:
          - We use self-rated need as a secondary factor.
          - We use cost-effectiveness for half the fund.

     But we do not rely solely on self-rated need.

