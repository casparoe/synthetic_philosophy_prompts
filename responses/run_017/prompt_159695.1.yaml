answer: |-
  Below is a complete game design for your student reading group session, optimized for 90 minutes with 16 participants. The game simulates the unilateralist's curse and hidden failure modes of veto systems, with tiered signal quality, asymmetric incentives, and rule-changing between rounds. It uses index cards, envelopes, and a printed payoff tracker (no laptops).

  ---

  ### **Game Title:** The Initiative Dilemma  
  **Objective:** Experience how individual decisions in group structures can lead to systemic failures, even with good intentions.  

  ---

  ### **Materials Needed**  
  1. **Index cards**:  
     - 16 cards per round (1 private signal per player)  
     - 1 sealed envelope per round (contains true value "V" for that round)  
  2. **Payoff tracker** (large poster or whiteboard):  
     | Round | Presser? | True V | Group Loss/Gain | Forgone Gains |  
  3. **Deck of playing cards** (for signal generation, see below).  
  4. **Candy**: 100+ small pieces (e.g., M&Ms) for payoffs.  
  5. **Timer** (phone or stopwatch).  

  ---

  ### **Signal Generation Procedure (Pre-Game Prep)**  
  **Goal:** Assign private signals with hidden accuracy tiers. Players cannot discern their own or others' tier.  

  1. **Generate true values (V) for each round**:  
     - Draw V from a normal distribution **~N(0, 5)**. Round to nearest integer.  
     - *Example pre-generated Vs (ensure mix of + and -):*  
       `Round 1 (Small Groups): V = -3, +2, +4, -1` (1 per subgroup)  
       `Round 2 (Full Group): V = +6`  
       `Round 3 (Full Group): V = -5`  
       `Round 4 (Full Group): V = +7`  

  2. **Assign tiers secretly (per round)**:  
     - **High accuracy (1/3 of group)**: Signals close to true V.  
     - **Low accuracy (2/3 of group)**: Signals are noisy.  
     - *Tiers reshuffle each round—no one knows their accuracy.*  

  3. **Create signals using playing cards**:  
     - **High tier**: Signal = V + *card-based error*.  
       - Draw 1 card from a **red suit (hearts/diamonds)**: Error = card value (A=1, J=11, Q=12, K=13). Subtract 7 (e.g., 9♦ → 9-7=+2).  
     - **Low tier**: Signal = V + *card-based error*.  
       - Draw 1 card from a **black suit (spades/clubs)**: Error = card value. Subtract 7 (e.g., 3♠ → 3-7=-4).  
     - *Example:* If V=2 and a high-tier player draws 9♥, signal = 2 + (9-7) = **+4**.  
     - **Prep**: Pre-calculate signals on index cards (1 per player per round).  

  ---

  ### **Payoff Structure**  
  - **If action is taken (button pressed)**:  
    - **Presser gains**: `2 × |V|` if V > 0 (bonus for initiative).  
    - **Presser loses**: `2 × |V|` if V < 0 (penalty for disaster).  
    - **Others gain/lose**: `0.5 × V` (shared stakes; e.g., V=+6 → others gain +3).  
  - **If no action taken**: All get 0.  
  - **Candy conversion**: 1 point = 1 candy. Negative points deduct candy.  

  > *Why this skew?* Incentivizes pressing when optimistic (mirrors real-world "hero" dynamics), but shares losses (encourages free-riding). The asymmetry amplifies the curse.  

  ---

  ### **Round Structure (90 Min Total)**  
  #### **Round 1: Baseline (Small Groups)**  
  - **Groups**: 4 subgroups of 4 players.  
  - **Rules**:  
    1. Each player gets a **private signal card** (tiers hidden).  
    2. Any player can press an imaginary "button" at any time to take the action.  
    3. If pressed, action happens immediately. If no press after 2 min, no action.  
  - **Payoffs**: Calculated per group.  
  - **Debrief note**: Observe who pressed—usually the most optimistic low-accuracy player.  

  #### **Round 2: Baseline (Full Group)**  
  - **Same rules as Round 1**, but all 16 players together.  
  - **Expectation**: More players → higher chance of extreme optimism → action taken faster, often disastrously.  

  #### **Round 3: Stand-Down Rule**  
  - **New rule**: Before signals, any player can **publicly stand down** (irrevocably give up pressing power).  
  - **Debrief note**: Reliable players often stand down first, leaving unreliable players empowered.  

  #### **Round 4: Veto Rule**  
  - **New rule**: Action requires **unanimous approval**. Anyone can veto anonymously (write "VETO" on card).  
  - **Payoff tweak**: If action approved, all get `V` (no presser bonus). If vetoed, all get 0.  
  - **Forgone gains**: On payoff tracker, record "Missed +X" if V > 0 but vetoed.  

  ---

  ### **How the Curse Manifests in Game**  
  1. **Presser is often least reliable**: Low-accuracy players draw extreme signals (e.g., true V=-3, signal=+10). They press impulsively.  
  2. **Group size worsens outcomes**: Round 2 (16 players) has higher variance → more tail events → reckless presses.  
  3. **Veto rule fails invisibly**: Groups veto good actions (e.g., V=+7) due to one pessimist. "Missed +X" column reveals hidden cost.  

  ---

  ### **Debrief Script (15 Min)**  
  1. **Reveal the machinery**:  
     - Show true Vs, signals, and tiers for each round.  
     - Point to specific moments:  
       - *"In Round 2, Sarah pressed with +12—but true V was -5. Her low-accuracy signal had the largest error."*  
       - *"In Round 4, you vetoed an action with V=+7. The group missed 112 potential points (16 × 7)."*  
  2. **Name the curse**:  
     - "This is the **unilateralist's curse**: When any member can act alone, the decision is made by the *most optimistic error*, not the group’s wisdom. Adding people *increases* risk."  
  3. **Discuss rule changes**:  
     - *Stand-down*: Often backfires—reliable players opt out, empowering reckless ones.  
     - *Veto*: Feels safer but blocks good actions. The cost is invisible until tallied.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Someone presses immediately in Round 1.  
    - **Fix**: Add a 30-second "thinking period" (no pressing allowed) before rounds.  
  - **Problem**: Candy points feel meaningless.  
    - **Fix**: Frame payoffs competitively (e.g., "Top 3 scorers get extra candy"). Lean into losses—players *hate* giving back candy.  
  - **Problem**: Players assume signals are accurate.  
    - **Fix**: Pre-game hint: "Your signal may be noisy. You don’t know your accuracy."  

  ---

  ### **Limitation of the Game**  
  **What the game can’t capture**:  
  In real groups, **reputational feedback** changes behavior. A reckless presser faces social consequences (distrust, exclusion), which discourages future impulsivity. In the game, tiers reshuffle each round—players don’t learn who is reliable. You’ll need to say:  
  > *"In reality, repeated interactions let groups identify and restrain unreliable members. But in one-off decisions (like your $300 spending rule), this feedback is absent—making the curse deadly."*  

  ---

  ### **Why This Works**  
  - **Tiered signals**: Low-accuracy players unknowingly drive disasters (visible in card draws).  
  - **Asymmetric payoffs**: Pressers chase glory; groups share pain (mirrors real incentives).  
  - **Forgone gains tally**: "Missed +X" column exposes veto rule’s hidden failure.  
  - **Full-group round**: Group-size effect is visceral (16 people gasp when a reckless presser dooms them).  

  Run this, and your students will *feel* the curse—then dissect it.
