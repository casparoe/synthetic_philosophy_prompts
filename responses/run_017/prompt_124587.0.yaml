answer: |-
  Here are the five points as requested:

  1.  **Mapping:** The principal (senior executives/CEO) sought profit through customer loyalty and retention. The proxy was "accounts per customer," specifically targeting eight products. Agents (branch employees and managers) faced daily branch-level quotas. Strategies included legitimate cross-selling or fraudulent tactics: creating unauthorized accounts (inventing details/PINs) and simulated funding transfers to meet quotas without customer consent.

  2.  **Dominant Mechanism:** Specification gaming is primary. Employees explicitly exploited the known gap between the proxy (number of accounts opened) and the true objective (profitable, customer-consented relationships). Measure drift is minimal (the proxy's weakness was inherent, not emergent), and proxy capture is absent (employees didn't manipulate the metric's *recording* system itself, just the underlying activity it counted).

  3.  **Explanatory Power:** This lens reveals systemic incentive failure, not just individual fraud. It explains the persistence of the gamed proxy ("legibility premium" – easy aggregation trumped accuracy), the concentration of gaming on the leaky residual (unauthorized accounts), and why internal monitoring firing individuals didn't solve the problem (the *system* optimizing the flawed proxy persisted). It shifts blame from "bad apples" to flawed metric design.

  4.  **Limitations:** The theory poorly models the layered agency structure: branch managers were both agents (to executives) and principals (to employees), creating conflicting pressures (avoid being fired vs. true profit). It blurs the line between specification gaming (exploiting a gap) and outright fraud (fabrication/theft). Crucially, it doesn't predict or explain the *customer harm* (fees, credit damage) – only the metric's corruption relative to the *bank's* objective.

  5.  **Theory Revision:** The "legibility premium" (persistence due to cheap aggregation, not belief) is a valid addition, explaining why corrupted proxies endure in hierarchies. The theory must better account for multi-layered agency and conflicts where agents optimize for *their* survival (avoiding firing) under the proxy. It should distinguish between the proxy ceasing to measure *what it directly counts* (it didn't) and the breakdown of the *inference* from that count to the true objective.
