  Key insight: their phenomenon isn't MR per se but its methodological consequence - what I'll call "heuristic MR". The electric fish example demonstrates how perceived diversity triggers search for deeper invariance. And importantly, the successful unifiers (computations, optimality principles) operate at a level above hardware but below folk-psychological descriptions.

  The trickiest part is distinguishing genuine reduction from trivial disjunctions. I think the difference lies in whether the unifying description has explanatory power beyond just listing realizers - like how the electric field computation predicts novel phenomena. Also, whether it supports counterfactuals.

  On common descent vs convergence: their examples suggest it matters scientifically (deep homology) but philosophically, explanatory power might be what counts. Though that's contested - some philosophers tie natural kinds to historical essences.

  For boundaries: 
