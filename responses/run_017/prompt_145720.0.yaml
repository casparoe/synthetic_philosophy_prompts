  1) MR motivates seeking intermediate-level unifiers rather than declaring autonomy
  2) Those unifiers are often abstract/computational
  3) There's ambiguity about when such unification "counts" as reduction

  They're explicitly rejecting mere labeling - this is about carving the conceptual space. Also noteworthy: they need library-free explanations and clear demarcation of settled vs contested ideas.

