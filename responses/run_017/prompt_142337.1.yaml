prompt: |-
  I'm on the benefits committe at work — there's five of us, at a company of about 70 people, and we're the ones who decide what our self-funded health plan actually pays for. The plan document is from like 1994 and says it covers treatment of disease or injury and doesn't cover cosmetic, lifestyle, or elective enhancement stuff. Years ago our broker told us to write ourselves a one sentence test for what counts as a disease, because otherwise we'd argue about it forever. The test we came up with, and have used ever since, is basically this: it's a medical problem if some part of you is working worse than it normally works in a healthy person of your age and sex, and it's causing you real trouble.

  I always thought that was pretty reasonable. This month we had three appeals and now I think it's either wrong or I'm applying it wrong, and I keep flip-flopping between the two.

  1) Marcus, 58, drives a forklift. His testosterone came back in the low-normal range for men his age. He says he's wiped out all the time, no sex drive, can't concentrate. His doctor put him on replacement therapy and he says he got his life back. We denied it: nothing in him is working worse than normal, he's just getting older. But his supervisor says Marcus is a different guy since the shots. His age is doing all the work in that sentence and I don't know why age gets to do that.

  2) Priya, 34, in accounting. Her husband died in a crash seven weeks ago. She's sleeping three hours a night, lost a lot of weight, can't get through a spreadsheet, and she's asking for short term disability plus coverage for an intensive outpatient program. Our behavioral health vendor says this is normal grief, not a diagnosis, so the program isn't covered; the disability people say they can't approve leave without a diagnosed condition. She's obviously in real trouble and I can't point to anything in her that's malfunctioning.

  3) Sam, 41, warehouse. Type 2 diabetes, heavy, drinks most nights, needs bariatric surgery. One of our members said flat out that this isn't a disease, it's a lifestyle, and we shouldn't pay for it. Same guy voted yes last month on knee surgery for someone who blew out his knee playing pickup basketball. When I pointed that out he said that's different, you can't help getting hurt playing ball. I have no idea whether that's a real distinction or if we're just punishing Sam.

  On top of all this, Denise on the committee wants to change the test from a healthy person of your age and sex to someone like us, because most of the warehouse works night shift and half of us are carrying extra weight, and if we say healthy person then suddenly everybody's sick. I feel like that makes things worse, not better, but I can't say why.

  So: is there a better one sentence test? Or is the whole idea of a one sentence test hopeless, and if it is, what do I actually say at the meeting on Thursday?
reasoning: |-
  Okay, let me start by understanding the user's situation. They're on a benefits committee for a self-funded health plan at a mid-sized company. The current test they use to determine coverage is whether a condition involves a body part working worse than normal for a person's age and sex, causing real trouble. But now they're facing three appeals that challenge this test, and they're conflicted.

  First, Marcus's case: low testosterone for his age. The committee denied it because they see it as normal aging. But his supervisor noticed improvement with treatment. The user's stuck on why age should define "normal." Aging isn't a malfunction, but symptoms impact his life. The test might be too rigid here. Maybe the issue is distinguishing between natural aging and treatable conditions that affect function.

  Then Priya, grieving her husband. The behavioral health vendor says it's normal grief, not a diagnosable condition. But she's clearly struggling. The test requires a malfunction, but grief isn't a physical malfunction. This highlights a gap where psychological distress without a diagnosis falls through. The test might not account for mental health properly, especially when it's situational but still debilitating.

  Sam's case with diabetes and bariatric surgery. A committee member called it a lifestyle choice, not a disease. But they approved a sports injury. The inconsistency is glaring. The user questions if they're punishing Sam. The test here might be misapplied due to bias. Diabetes is a recognized disease, but the member's personal views are clouding judgment. The test's reliance on "malfunction" should include chronic diseases, but the committee might be confusing etiology (cause) with the condition itself.

  Denise wants to change "healthy person" to "someone like us," which would lower standards. That's problematic because it normalizes unhealthy norms. For example, if most warehouse workers are overweight, obesity-related issues might not be covered. That could lead to under-treatment and higher long-term costs. The user feels this is wrong but can't articulate why. The principle here is that "healthy" should be an objective standard, not relative to a possibly unhealthy group.

  Underlying all this is the tension between the plan's original intent (covering disease/injury) and modern healthcare nuances. The one-sentence test is oversimplified. The user needs a framework that allows flexibility without endless debates. They also need consistency to avoid bias. 

  The user's deeper needs might include: wanting fair, consistent decisions; avoiding moral judgments; covering necessary treatments without ballooning costs; and having clear guidelines that reduce committee conflicts. They might also need to address mental health and aging more comprehensively. 

  Possible solutions: Reframe the test to focus on functional impairment and treatable conditions, regardless of cause. Include recognized medical diagnoses as a factor. Add a clause for conditions where treatment is effective. Or supplement the test with guidelines for common edge cases. 

  Denise's suggestion is dangerous—it risks defining down health. Instead, "healthy" should reference clinical standards, not local norms. For mental health, including functional impairment even without a diagnosis could help Priya. For Marcus, considering if symptoms significantly impair function despite being age-related. For Sam, separating the disease (diabetes) from its causes. 

  The user might need to propose revising the test and adding a review process for edge cases. They should also consider consulting an independent medical expert to avoid vendor biases. Ultimately, the committee needs principles that align with modern medicine while controlling costs ethically.
answer: |-
  Your test is logical but fails at key modern healthcare dilemmas: aging, mental health, and conditions with behavioral components. The problem isn't your application—it's that the test itself is too narrow for 21st-century medicine. Here's a breakdown and a proposed solution:

  ### Core Problems in Your Cases:
  1. **Marcus (Aging):**  
     Your test defines "normal" by age, making age-related decline ineligible. But medicine increasingly treats functional decline *caused* by aging (low T, arthritis) if interventions restore function. Your test denies treatable disability solely because it's common at his age.

  2. **Priya (Mental Health):**  
     Grief isn't a "malfunction"—it's a normal response. But when it causes severe functional impairment (inability to work/sleep/eat), it becomes a *medical problem*. Vendors hide behind "no diagnosis," but DSM-5 includes "Persistent Complex Bereavement Disorder" for prolonged, disabling grief. Your test misses functional impact without a broken "part."

  3. **Sam (Lifestyle vs. Disease):**  
     Knee surgery was approved because injury feels "blameless," while diabetes is seen as "self-inflicted." This is hypocrisy: both are covered under your plan ("injury" vs. "disease"). The real issue is moral judgment—not your test.

  4. **Denise's Suggestion ("Someone Like Us"):**  
     **This is dangerous.** Defining "normal" by local norms (e.g., night-shift fatigue, obesity) would deny care for treatable conditions. It’s like saying "everyone here has black lung, so it’s not a disease."

  ### A Better One-Sentence Test:
  **"We cover treatment for a condition if:**  
  **(a) It causes significant impairment in daily function or well-being, AND**  
  **(b) A licensed healthcare provider diagnoses it as a medical disorder or recommends treatment based on clinical evidence, AND**  
  **(c) The treatment is clinically proven to improve function or health outcomes.**  
  **Exclusions: Purely cosmetic/enhancement treatments without functional impairment."**

  ### Why This Works Better:
  | **Case** | **Your Old Test** | **Revised Test** |
  |----------|-------------------|------------------|
  | **Marcus** | Denied (age-normal) | **Covered:** Functional impairment (fatigue, concentration) + provider diagnosis + treatment works. |
  | **Priya** | Denied (no malfunction) | **Covered:** Severe functional impairment + provider recommends treatment (IOP) + evidence supports grief therapy efficacy. |
  | **Sam** | Covered (but biased debate) | **Covered:** Diabetes is a diagnosed disease; surgery is evidence-based. No moral judgment clause. |
  | **Denise's Concern** | N/A | **Addressed:** "Significant impairment" and "clinical evidence" prevent normalizing unhealthy norms. |

  ### Key Fixes Embedded:
  - **Aging:** Focuses on *treatable functional decline*, not whether decline is "normal for age."
  - **Mental Health:** Prioritizes *functional impairment* and *provider assessment* over mechanical "malfunction."
  - **Lifestyle Conditions:** Removes moral judgment by relying on *diagnosis* and *evidence-based treatment*.
  - **Bias Guardrails:** "Clinically proven" and "licensed provider" prevent arbitrary denials.

  ### For Your Meeting:
  1. **Acknowledge the test’s flaws:** "Our test works for straightforward diseases/injuries but fails on aging, mental health, and chronic conditions—which are most of today’s healthcare."  
  2. **Propose the revised test:** Frame it as "modernizing" the 1994 document without changing intent.  
  3. **Address Denise:** "If we define ‘normal’ by our own unhealthy norms, we penalize people for seeking care. ‘Clinically proven treatment’ protects the plan without normalizing poor health."  
  4. **Sam-specific argument:** "Diabetes is a disease per the AMA, CDC, and our plan document. Surgery isn’t ‘lifestyle’—it’s the cure when other treatments fail. Our job isn’t moral arbitration."  

  **If resistance continues:** Push for an external medical ethics consultant (shared cost with other small businesses). Self-funded plans your size often pool resources for this.  

  **Bottom line:** Your test isn’t "wrong," but it’s outdated. Medicine now treats *function and quality of life*, not just broken parts. Update the test to reflect that—or you’ll keep fighting these battles.
