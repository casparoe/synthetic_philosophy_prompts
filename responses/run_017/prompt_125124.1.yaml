  The envoi shifts to the poem's future as an archival object. "Who reads this later sees us too as *absent*" — mirroring the seminar's fate. It must avoid explaining itself; the horror is in the realization that our attempts to critique power become subject to the same distortions we study. No closure, just echoing silence. 

  I'll avoid any lyrical warmth. The language stays administrative, even clinical. The power is in what the form does: the sestina's circling words become the archive's crushing weight. When the user reads this aloud, the room should feel the chill of compounding silence.
