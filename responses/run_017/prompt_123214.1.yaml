prompt: |-
  I've been asked to run a 45-minute internal session on the eng side of the company about why our risk score can't be fair in every way at once — the kind of result where you show that calibration within each group and equal false positive / false negative rates across groups can't both hold when the underlying outcome rates differ, unless the model is already perfect. I don't need the explanation for me, I need a plan for explaining it to them, and I need the plan to survive contact with this particular room.

  Who's in the room: about twelve people, mostly backend engineers plus two data scientists, stats knowledge stops at "I once fit a logistic regression", zero philosophy, and zero appetite for being told they're bad people. Two of them built the model we'll be talking about. One guy has definately read a pop writeup of the recidivism-scoring controversy and will bring it up in the first five minutes if I don't get there first.

  The model: we score applicants for a subsidised job-training program, the score is their predicted chance of finishing the course, the top scorers get offered a seat. And here's the wrinkle I don't know how to place: we only observe whether someone finishes for the people we actually admitted, so our historical outcome rates are partly an artifact of last year's admission policy rather than a fact about the world.

  What I want from you:

  - The order the pieces have to go in, and what depends on what. My instinct is that calibration has to land before error-rate parity, because calibration is the thing they already believe in ("of course a 0.7 should mean 70%"), but I'm not sure, and I don't know where the idea of a score as a probability at all has to be nailed down or whether I can just assume it.
  - The one example that should carry the whole session, built on our own model or something close to it, and what that example has to have and not have. I'm fairly convinced I should NOT use a criminal-justice case — they'll spend twenty minutes arguing about crime and race and I'll lose the room — but tell me what else it needs: does it need numbers small enough to do in their heads, does it need the stakes to be a benefit being handed out rather than a punishment being imposed, does it need the two groups to be a protected attribute or should I use something blander like referral channel.
  - The misconceptions, in the order they'll actually form them, and the point in the sequence where each should be headed off. The ones I'm expecting: "just delete the group column and we're fine"; "this is only the accuracy-fairness tradeoff dressed up"; "it's a knife-edge result, approximate fairness is fine"; "our outcome rates differ only because of past discrimination, so the fix is to equalise the scores"; "randomising at the threshold fixes it". Tell me which of those I've got wrong, which ones show up later than I think, and the one I'm not anticipating.
  - Where in the arc the selective-labels thing should go. If I open with it I think they file the whole session as a data-quality problem; if I close with it I think they conclude the theorem was beside the point. So: where, and in what form.
  - What I should flat-out refuse to get into at this level, and say out loud that I'm refusing. I'm guessing the actual proof, anything causal, and which criterion is the morally right one — but tell me if I'd be cutting something I shouldn't.
  - How I'll know at the end whether it landed. I don't want a show of hands on "does everyone get it". Give me something they have to produce. My idea was to hand them a variant where the two groups do have the same outcome rate and ask them what's still impossible — but I'm not sure that tests the right thing.

  Last thing: they are going to ask, in the final ten minutes, which criterion we should actually ship. Tell me how the sequence should set that up so it comes out as a decision with an owner rather than a question I answer on the spot, because I really don't want to be the person who picked.
reasoning: |-
  We are going to explain why a risk score cannot satisfy both calibration and error-rate parity (equal FPR/FNR) when base rates differ, unless the model is perfect. We have 45 minutes with backend engineers and data scientists with limited stats background. Key points: avoid criminal justice example to prevent distractions, handle the selective labels issue (we only observe outcomes for admitted applicants), and manage common misconceptions.

  ### 1. Order of Presentation

  The sequence must build from what they know and believe. We start with calibration because they already accept that a score of 0.7 should mean a 70% chance of the event. Then we introduce error rates and show the incompatibility when base rates differ.

  Order:
  1. **Set the stage**: Explain the model's purpose and the fairness criteria we care about. Acknowledge that we only observe outcomes for admitted applicants (selective labels) but set it aside initially to focus on the core trade-off. We'll come back to it.
  2. **Calibration**: Explain and convince them why calibration is desirable (it makes the score meaningful as a probability).
  3. **Error rates**: Define false positive rate (FPR) and false negative rate (FNR) and why someone might want them to be equal across groups (fairness in errors).
  4. **Base rates**: Explain that the underlying rate of the outcome (completion rate) may differ between groups.
  5. **The conflict**: Show that if base rates differ and the model is not perfect, then calibration and error-rate parity cannot both hold. Use a concrete example.
  6. **Selective labels**: Return to the issue that our historical data only comes from admitted applicants and how that complicates things.
  7. **Decision time**: Frame the choice of which fairness criterion to prioritize as a business/product decision, not an engineering one.

  ### 2. The Example

  We need a non-sensitive, non-criminal example. Let's use two groups: Group A and Group B, defined by something neutral like "referral channel" (e.g., "online applicants" vs. "community partner referrals"). The outcome is completing the training program.

  The example must:
  - Use small, easy numbers so they can do the math in their heads.
  - Show that if the base rates (completion rates) differ, then calibration and equal FPR/FNR cannot coexist.

  **Example Setup**:
  - Group A: 1000 applicants, true completion rate = 60%
  - Group B: 1000 applicants, true completion rate = 40%
  - We build a model that predicts the chance of completion.

  We'll consider two scenarios: one where the model is calibrated but error rates are not equal, and one where error rates are equal but calibration fails.

  **Scenario 1: Calibrated Model**
  - We set thresholds to achieve calibration. For Group A, we set a threshold that gives 60% completion for those above threshold. For Group B, 40%.
  - Now, we look at the error rates. We'll see that FPR and FNR are different between groups.

  **Scenario 2: Equal Error Rates**
  - We force FPR and FNR to be the same for both groups. Then we see that the scores are not calibrated: a score of 0.5 might mean different things in Group A and Group B.

  We'll do the math step by step.

  ### 3. Misconceptions and When to Address Them

  List of misconceptions and when to address:
  1. **"Just delete the group column and we're fine"**: Address this after showing the conflict. Explain that without group information, the model might still inherit base rate differences and not achieve either fairness criterion. We can't avoid the trade-off by ignoring group.
  2. **"This is only the accuracy-fairness tradeoff dressed up"**: Address when introducing the conflict. Emphasize that even with perfect accuracy, if base rates differ, we have to choose which fairness criterion to satisfy. But we don't have perfect accuracy, so the trade-off is unavoidable.
  3. **"It's a knife-edge result, approximate fairness is fine"**: Address after the example. Explain that the theorem says exact satisfaction is impossible, and even approximate satisfaction requires the model to be very good and base rates to be very close. In our case, base rates are not close, so we have to choose.
  4. **"Our outcome rates differ only because of past discrimination, so the fix is to equalise the scores"**: This is tricky. Address when discussing base rates. Explain that if we equalize scores by adjusting the model, we break calibration. Also, our historical data is biased by past admission policies (selective labels) so we don't even know the true base rates. We'll come back to this in the selective labels section.
  5. **"Randomising at the threshold fixes it"**: Address at the end when discussing solutions. Randomization doesn't fix the fundamental trade-off. It might help with equalizing acceptance rates, but not with calibration or error parity.

  Unexpected misconception: **"We can have both if we use a better model"**. Address this by reiterating that unless the model is perfect (100% accurate) and base rates are equal, it's impossible. So if base rates are different, we can't have both even with a perfect model (but a perfect model would have 0 errors, so error rates would be equal, but then base rates would have to be equal for calibration to hold? Actually, if the model is perfect, base rates don't matter because the model is perfectly calibrated and error rates are 0. So we must clarify: when the model is perfect, then base rates are equal? Actually, no: the base rates are the overall positive rates. If the model is perfect, then the base rates can be different and the model can still be calibrated and have zero errors. But note: if the model is perfect, then the scores are the true probabilities, so calibration holds. Also, FPR and FNR are zero in every group, so error rate parity holds trivially. Therefore, the only case where both hold with different base rates is when the model is perfect. So we must emphasize: the theorem says that if the base rates are different and the model is not perfect, then you cannot have both. So if we don't have a perfect model (which we don't), we must choose.

  ### 4. Selective Labels: Where and How

  Place selective labels after the core trade-off. We use it to show that our data is biased and we don't even know the true base rates. This complicates our ability to measure fairness and build a fair model.

  **Where**: After explaining the core trade-off (step 5 above) and before the decision (step 7).
  **How**: 
  - Explain that we only observe outcomes for the applicants we admitted (the top scorers from last year). 
  - Therefore, the historical completion rates we see are for the admitted group, not for all applicants. 
  - This means we don't know the true base rates (completion rates for all applicants) and our model is trained on a biased sample.

  This leads to two issues:
  1. We might be underestimating or overestimating the base rates for some groups.
  2. We cannot even measure calibration for the entire applicant pool because we don't have outcomes for those we didn't admit.

  So, the selective labels problem exacerbates the fairness challenges but doesn't remove the fundamental trade-off.

  ### 5. What to Refuse

  Explicitly refuse to discuss:
  - **The mathematical proof**: We'll state the result and show by example, but not derive it.
  - **Causal explanations**: We won't discuss why the base rates differ (e.g., societal factors) because that's beyond the scope and we don't have the data.
  - **Which fairness criterion is morally right**: This is a business/product decision, not an engineering one. We are here to explain the trade-offs.

  ### 6. How to Know It Landed

  Do not ask "does everyone get it." Instead, give a quick exercise:

  **Exercise**: 
  - Suppose we have two groups, Group X and Group Y, with the same true completion rate (say 50% each). 
  - We have a model that is imperfect (so not 100% accurate). 
  - Is it possible to have both calibration and equal FPR/FNR? 

  **Answer**: Yes, because the base rates are equal. The conflict only arises when base rates are different.

  But we want to test understanding of the conflict when base rates differ. Alternatively, we can ask:

  **Alternative Exercise**:
  - Suppose we have two groups with different base rates. 
  - We have a model that is calibrated. 
  - What can we say about the error rates? 
    - They must be different. 
  - Conversely, if we force the error rates to be equal, what happens to calibration? 
    - It breaks.

  So, we can give a scenario with numbers and ask them to compute one of these.

  But due to time, we can do a quick poll: 
  - "If base rates are different and we want calibration, then error rates must be: (A) Equal (B) Different (C) It depends." 
  - They should say (B) Different.

  Then: 
  - "If we force error rates to be equal, then calibration must: (A) Hold (B) Fail (C) It depends." 
  - They should say (B) Fail.

  ### 7. Handling the Final Question: Which Criterion to Ship?

  Set this up as a decision that requires input beyond engineering. The sequence should:

  1. **Clarify that there is no universal answer**: It depends on the goals of the program.
  2. **Frame the options**:
     - Calibration: Ensures that the score is a true probability. This is important if we want to prioritize efficiently (e.g., maximize the number of completions) and be truthful about the chances.
     - Equal FPR/FNR: Ensures that the model makes similar errors across groups. This might be chosen if we care about equal opportunity (e.g., not disproportionately excluding qualified applicants from one group).
  3. **Highlight the selective labels problem**: We don't know the true base rates, so calibration is hard to measure. Also, our past decisions have influenced the data we have.
  4. **Recommend a process**: 
     - We (engineering) can build models that satisfy either criterion (but not both). 
     - The product/business leaders must decide which fairness goal aligns with the program's mission. 
     - We need to involve them and also consider the legal/ethical implications.

  So, when asked, we say: "We've shown that we have to choose. The next step is to convene a meeting with [product/business/legal] to make that choice. Engineering will implement the chosen criterion."

  ### Detailed Session Plan (45 minutes)

  **0-5 min: Introduction**
  - Context: We predict completion to allocate seats. We care about fairness.
  - Today's goal: Explain why we can't have both calibration and error-rate parity at the same time when base rates differ (unless the model is perfect).
  - Acknowledge the recidivism example: "You might have heard about similar issues in criminal justice, but we're going to use a neutral example to focus on the math."

  **5-15 min: Calibration**
  - What is calibration? If we take all applicants with a score of 0.7, about 70% should complete. It makes the score a trustworthy probability.
  - Why we care: It allows us to set thresholds meaningfully.

  **15-20 min: Error Rates**
  - Define FPR (fraction of non-completers who are incorrectly predicted as completers) and FNR (fraction of completers who are incorrectly predicted as non-completers).
  - Why someone might want them equal across groups: So no group is disproportionately subject to errors.

  **20-30 min: The Conflict with Numbers**
  - Present the example with Group A (60% base rate) and Group B (40% base rate). 
  - Show Scenario 1: Calibrated model -> unequal error rates. 
  - Show Scenario 2: Equal error rates -> uncalibrated model. 
  - Conclude: If base rates differ and the model isn't perfect, we can't have both.

  **30-35 min: Selective Labels**
  - We only observe outcomes for admitted applicants. 
  - So our training data is biased: It's from a selected group. 
  - Therefore, we don't know the true base rates and our model might be biased in ways we can't measure.

  **35-40 min: Addressing Misconceptions (Quickly)**
  - "Remove group": Won't work because base rates still exist. 
  - "Approximate fairness": The trade-off is fundamental. 
  - "Equalize scores": Breaks calibration and we don't know true base rates. 
  - "Randomization": Doesn't fix the trade-off.

  **40-42 min: Check for Understanding**
  - Quick poll: 
    - "If base rates differ and we have calibration, then error rates must be: (A) Equal (B) Different (C) It depends." 
    - "If we force equal error rates, then calibration: (A) Holds (B) Fails (C) It depends."

  **42-45 min: The Path Forward**
  - We must choose one criterion to prioritize. 
  - This is not an engineering decision: It requires input from business, product, and legal. 
  - Next step: We (engineering) will set up a meeting with those stakeholders to decide.

  **Final Answer to "Which criterion?"**: 
  - "We've laid out the trade-off. The decision must involve [product/business owner] because it depends on the program's goals. We'll schedule that conversation."

  This plan should survive the room: it's grounded in a concrete example, addresses the selective labels issue without derailing the core point, and hands off the decision appropriately.
answer: |-
  ### Session Plan: "Why Our Risk Score Can't Be Fair in Every Way at Once"

  #### **Core Structure & Sequence (45-Minute Arc)**
  1. **Hook & Frame (5 min)**  
     - Start with: "We all want our model to be fair. But 'fairness' means different things, and some definitions conflict. Today, we’ll see why we can’t have everything at once—and what that means for our product."  
     - **Explicitly preempt the recidivism example**: "You might have heard about similar debates in criminal justice risk scores. We won’t go there—our focus is on our job-training program, where fairness means getting opportunities right, not avoiding punishment."  

  2. **Calibration First (10 min)**  
     - **Why start here?** Engineers intuitively grasp probabilities. Leverage that: "We built this model to output a probability. If we say someone has a 70% chance of finishing, we expect ~70% of those people to actually finish. That’s calibration—and it’s non-negotiable for a trustworthy model."  
     - **Nail down the score-as-probability assumption**: Show a simple example (e.g., "If 100 people scored 0.7, ~70 should finish"). Ask: "Does this make sense?" Get nods. This sets a shared baseline.  

  3. **Introduce Error Rates (5 min)**  
     - Define:  
       - **False Positive Rate (FPR)**: % of non-finishers incorrectly labeled "high-chance."  
       - **False Negative Rate (FNR)**: % of finishers incorrectly labeled "low-chance."  
     - **Motivation**: "We might want FPR/FNR equal across groups so no group faces more errors. Example: If Group A has higher FPR, we’re wasting seats on non-finishers. If Group B has higher FNR, we’re excluding qualified people."  

  4. **The Conflict (15 min)**  
     - **Example to carry the session**:  
       - **Setup**: Two applicant groups, "Online" (Group O) and "Community Partners" (Group C).  
         - **Why this works**: Neutral (not a protected attribute), relatable (our referral channels), benefit-focused (seats in a program).  
       - **Numbers**:  
         - **True base rates**: Group O completion rate = 60%, Group C = 40% (emphasize: "This reflects real-world differences—e.g., resources, support").  
         - **Model predictions**: Build a 2x2 table for each group (see below). Use small numbers (e.g., 100 per group) for mental math.  
       - **Walk through scenarios**:  
         - *Calibration holds*: Scores match true probabilities within groups.  
           - Result: FPR/FNR *cannot* be equal. Group C has higher FNR (more false "lows") because its base rate is lower.  
         - *Equal FPR/FNR forced*: Scores become uncalibrated. Group C’s "0.5 score" might mean a 30% true chance, not 50%.  
       - **Key visual**:  
         | Group | Total | True Finishers | Model "High" | FPR | FNR |  
         |-------|-------|----------------|--------------|-----|-----|  
         | O     | 100   | 60             | 70           | 25% | 16% |  
         | C     | 100   | 40             | 50           | 20% | 40% |  
         *Calibration holds → FNR differs (16% vs 40%)*.  

  5. **Address Selective Labels (7 min)**  
     - **Place here**: After establishing the conflict, but before misconceptions.  
     - **How to frame**: "Now, the wrinkle: We only see outcomes for admitted applicants. Our data says Group O’s completion rate is 80%, and Group C’s is 50%—but that’s because we only admitted high scorers last year. **This doesn’t break the conflict; it makes it harder to measure.**"  
     - **Punchline**: "Without knowing true base rates, we can’t even check calibration fairly. But the trade-off still exists—it’s just buried in biased data."  

  6. **Crush Misconceptions (8 min)**  
     Address in this order (based on when they’ll arise):  
     - **"Just delete the group column"**:  
       - *When it surfaces*: Early (after introducing groups).  
       - *Response*: "If Group O and Group C have different base rates, ignoring group won’t fix it. The model learns patterns correlating with group (e.g., referral channel → resources), so bias creeps in."  
     - **"It’s an accuracy-fairness tradeoff"**:  
       - *When it surfaces*: During error rates discussion.  
       - *Response*: "No—this is deeper. Even with perfect accuracy, if base rates differ, calibration and error parity clash. Perfect models avoid this, but ours isn’t perfect."  
     - **"Approximate fairness is fine"**:  
       - *When it surfaces*: After seeing the example.  
       - *Response*: "Small base rate gaps? Maybe. But ours are large (60% vs 40%). Plus, approximation risks building unfairness into the system."  
     - **"Equalize scores to fix past bias"**:  
       - *When it surfaces*: When discussing selective labels.  
       - *Response*: "Forcing equal scores breaks calibration. If Group C’s true rate is 40%, scoring them like 60% means we mislead decision-makers."  
     - **"Randomize at the threshold"**:  
       - *When it surfaces*: During Q&A.  
       - *Response*: "Randomization helps allocate seats fairly but doesn’t fix the model’s internal conflict. Calibration and error rates stay messy."  
     - **Unexpected misconception**: **"We can fix it with better features"**.  
       - *When it surfaces*: After the example.  
       - *Response*: "Better features improve accuracy but don’t resolve the base rate conflict. If completion rates differ, the trade-off remains."  

  7. **What We Won’t Discuss (State Upfront)**  
     - **Flat-out refuse**:  
       - *The proof*: "We won’t derive the math—we’ll show why it happens."  
       - *Causation*: "We won’t debate why base rates differ—it’s complex and beyond our scope."  
       - *Morality*: "We won’t prescribe which fairness criterion is ‘right’—that’s a product/business call."  
     - **Say aloud**: "We’re engineers. Our job is to surface trade-offs, not solve philosophy."  

  8. **Check for Understanding (5 min)**  
     - **Do NOT ask**: "Does everyone get it?"  
     - **Instead, give a 3-min exercise**:  
       - *Scenario*: "Suppose two groups have the *same* true completion rate (50%). Our model isn’t perfect. Can we have both calibration and equal FPR/FNR?"  
       - *Have them discuss in pairs*:  
         - **Answer**: Yes! Base rates are equal, so no conflict.  
       - **Why this works**: Tests if they grasp the *source* of the conflict (differing base rates), not just the symptoms.  
     - **Success signal**: If >80% agree on the answer, they get it.  

  9. **Handle the Final Question: "Which Criterion Should We Ship?"**  
     - **Set this up early**: Frame the session as "clarity for decision-makers," not "engineering dictates policy."  
     - **When asked**:  
       - "We’ve shown this is a business trade-off:  
         - **Calibration** → Efficient resource use (maximize completions).  
         - **Error parity** → Equal error burdens across groups.  
       - Next step: We (engineering) will document options and owners. [Product Lead] will drive the final call with input from [Legal/Leadership]."  
     - **Why this works**: Makes the next step concrete, assigns ownership, and depersonalizes the choice.  

  #### **Why This Sequence Works for Your Room**
  - **Stats level**: No regression math. Everything is 2x2 tables and percentages.  
  - **Example design**: Neutral groups (referral channels), small numbers, benefit-focused (job training), and *our* model. Avoids distraction.  
  - **Selective labels timing**: Placed mid-arc to show it’s a compounding issue, not the root cause.  
  - **Emotional safety**: No "bad people" framing. Focus on systems, not intent.  

  **Final Tip**: Assign a "misconception spotter" (one of the data scientists) to flag tangents. If philosophy erupts, say: "That’s vital—but for another forum. Today, we’re mapping technical constraints."  

  By the end, they’ll produce the right answer in the exercise, and you’ll hand off the decision cleanly.
