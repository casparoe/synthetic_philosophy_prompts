answer: |-
  Based on your precise dissection, this phenomenon isn't adequately captured by existing terms like equivocation, dead metaphor, or reification. It's a distinct form of **conceptual borrowing** characterized by **distributed, cross-temporal authority transfer via polysemy**. Here's the carving:

  **Core Phenomenon:** **Epistemic Subsidization**  
  *Definition:* The process whereby a term's well-established validity and explanatory power in a specific, narrow domain (the "anchor case") implicitly licenses its extended metaphorical or analogical use in broader, structurally dissimilar domains across a discourse community, over time and multiple authors, without explicit justification or recognition of the conceptual shift. The anchor's epistemic authority "subsidizes" the extended uses.

  **How it differs from nearby concepts:**
  1.  **Equivocation:** Occurs *within* a single argument, exploiting ambiguity *intentionally* to mislead. Subsidization is *distributed* (across time/authors), unintentional, and exploits *polysemy* (related but distinct meanings) rather than ambiguity.
  2.  **Motte-and-Bailey:** Requires an adversarial context and strategic retreat. Subsidization is non-adversarial; there's no defensive retreat because the shifts are unrecognized and unchallenged.
  3.  **Dead Metaphor:** Has lost its figurative force and become literal. "Code" in the extended senses is still *live*, actively generating inferences and hypotheses.
  4.  **Reification:** Treats an abstraction as concrete. While "the genome is a code" borders on this, subsidization focuses on the *transfer of credibility* enabling this tendency, not the act itself.
  5.  **General Metaphor Theory:** Focuses on how metaphors structure thought. Subsidization is a specific *mechanism* or *effect* within this, explaining *why* a particular metaphor gains traction and endurance – it's "paid for" by the anchor case's legitimacy.

  **Key Features & Answers to Your Questions:**
  1.  **Sender/Interpreter/Convention?** Not strictly necessary. The anchor case provides the initial credibility (e.g., the demonstrable arbitrary mapping of the genetic code). Intentional language is a powerful *vehicle* for the subsidization (implying meaning, error, reading) but not essential. Any term with a strong anchor case and polysemous potential could work (e.g., "information," "signal," "editing").
  2.  **Benign vs. Misleading:** Yes, it can be both.
      *   **Benign:** When the metaphor productively guides research, generating testable hypotheses or unifying disparate phenomena (e.g., "genetic program" spurring research into regulatory networks and control logic; "junk DNA" prompting investigation of non-coding function). Fruitful migrations often involve terms whose anchor case is rigorously defined *and* whose extended use maps onto discoverable, *analogous structures or processes* in the new domain (e.g., "selection" mapping statistical differential survival onto natural processes).
      *   **Misleading:** When the metaphor smuggles in unwarranted assumptions or obscures relevant complexity (e.g., "DNA text" implying pervasive meaning/readership obscures neutral evolution; "legal code" implying normative "errors" can mischaracterize neutral or adaptive variation; "program" implying centralized control obscures distributed, emergent dynamics). Misleading migrations often occur when the anchor case implies agency, intention, or normative judgment absent in the new domain, or when the structural analogy is weak (like the metabolism example you gave).
  3.  **Diagnostic Test (Per Paragraph):**
      *   **Step 1:** Identify the specific "code" metaphor used (cipher, program, legal, text, blueprint, etc.).
      *   **Step 2:** Remove the "code" language and its direct derivatives (e.g., "read," "write," "error," "violation," "instruction," "meaningful," "junk," "punctuation," "execute"). Rephrase the core claim or inference using mechanistic, non-intentional language (e.g., "mutational event" instead of "error"; "non-functional sequence" instead of "junk"; "transcription factor binding site" instead of "punctuation").
      *   **Step 3:** Assess:
          *   **Explanatory Work/Inference Licensing:** Does the rephrased version feel *weaker*, less justified, or require *significant additional justification* that the original "code" language implicitly provided? Does the original inference now seem like a leap? (e.g., Calling a mutation an "error" implies a norm exists; calling a sequence "junk" implies it has no function; calling DNA "instructions" implies inertness without them). *Yes = Subsidization at work.*
          *   **Ornamentation:** Does the rephrased version convey the *exact same scientific claim* with equal clarity and justification, just less vividly? Is the "code" language purely decorative or a shorthand? (e.g., Using "genetic code" strictly to refer to the codon table). *No = No subsidization (or anchor case use).*
          *   **Anchor Case:** Is the term used strictly in its narrow, validated sense (codon-amino acid mapping)? *Not subsidization.*

  **Carving the Term: "Polysemic Epistemic Subsidization" (PES)**

  *   **Polysemic:** Leverages multiple distinct but related meanings of a word.
  *   **Epistemic:** Concerns knowledge, justification, and credibility.
  *   **Subsidization:** The anchor meaning finances the credibility of the extended meanings.

  **Clear Cases of PES (in Molecular Biology "Code" Talk):**
  1.  **Inference of Universal Function:** "This conserved non-coding sequence must have a function; it's part of the *code*." (Subsidized by "text" metaphor: conserved writing is meaningful). *Diagnostic:* Rephrase: "This conserved non-coding sequence must have a function." *Assessment:* Why *must* it? Conservation suggests *possible* function, but neutral processes can conserve sequences too. The "code/text" metaphor smuggles in the assumption of inherent meaning/function.
  2.  **Mutations as "Errors/Violations":** "Proofreading mechanisms correct *errors* in the DNA *code*." (Subsidized by "legal" or "text" metaphor). *Diagnostic:* Rephrase: "Proofreading mechanisms repair damage or incorrect nucleotides incorporated during replication." *Assessment:* The rephrasing is accurate but neutral. "Error/violation" implies a normative standard against which the mutation is judged (often implying the wild-type is "correct"), an inference heavily reliant on the "legal/text" metaphor.

  **Near-Misses (Not PES):**
  1.  **Anchor Case Use:** "The *genetic code* specifies the mapping between codons and amino acids." *Reason:* This is the literal, validated anchor case. No subsidization of other meanings is occurring here.
  2.  **Pure Ornamentation/Shorthand:** "We deciphered the regulatory *code* for this gene locus." *Diagnostic:* Rephrase: "We identified the transcription factor binding sites and epigenetic marks regulating this gene locus." *Assessment:* If the rephrased version conveys the *exact same mechanistic understanding* and the original "code" was simply a vivid synonym for "regulatory logic" or "mechanism," it's ornamentation. The inference (binding sites/marks regulate the gene) stands without the "code" metaphor. No significant credibility is borrowed from the anchor case beyond the vague idea of mapping.

  **Why "Code" is Prone to PES:**
  The anchor case (codon table) is exceptionally strong: demonstrably arbitrary, conventional (frozen history), digital, and fundamental. This immense credibility easily subsidizes the other polysemes (cipher, program, legal, text) because they share *some* conceptual overlap (mapping, rules, information) and resonate deeply with intentional frameworks. The specificity of the anchor mapping *enables* the subsidization, but as your metabolism point correctly shows, mapping specificity alone isn't *sufficient* for the metaphor to stick – the historical accident of the term "code" being used for the anchor, combined with its rich polysemy, is crucial.

  PES is a powerful, often unnoticed, engine of conceptual drift in science. Recognizing it helps separate fruitful heuristic guidance from potentially misleading assumptions smuggled in on the coattails of a term's anchored credibility. Your diagnostic test is key to exposing it in individual instances.
