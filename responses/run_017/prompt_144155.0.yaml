prompt: |-
  I am part of a working group drafting referee guidelines for evolutionary-biology journals, and we have got stuck at the first step. Before we can say which methods a manuscript should have used, we need to say what a method for adjudicating adaptive hypotheses is supposed to deliver. I would like you to write that specification.

  The object to be specified is a standard that tells a working biologist, faced with a trait in a taxon, what would license the claim that the trait is an adaptation for function F — as against a byproduct, a co-opted structure, a developmental or architectural constraint, or a drift artifact. Its purpose fixes its shape: it will be used by a referee reading a manuscript, so it must be applicable to evidence a manuscript could realistically contain (comparative data, a phylogeny, some ecology, sometimes a functional or optimality analysis, occasionally a selection experiment or a genomic scan), and it must be able to return at least three verdicts — warranted, not warranted, and underdetermined by the evidence in hand — rather than only an invitation to refine the story.

  Give me the desiderata, each with the case or consideration behind it. I have in mind four rough kinds, but revise the partition if it is wrong.

  Cases it must get right, including some clear positives it must not hedge about (lactase persistence in dairying pastoralist populations, with its genomic signature of a recent selective sweep; Darwin's inference from the extraordinary length of a Madagascan orchid's nectar spur that a pollinator with a correspondingly long proboscis must exist, later confirmed), some clear negatives (the tapering triangular panels formed where the arches carrying a dome meet the surrounding vaulting in San Marco: necessarily triangular, necessarily four, elaborately decorated, but not there in order to be decorated), and some genuinely hard ones (the panda's radial sesamoid thumb; the lens crystallins of vertebrate eyes, several of which are ordinary metabolic enzymes such as lactate dehydrogenase and argininosuccinate lyase recruited into a structural role; putative spandrels such as the human chin; the flamingo's inverted feeding posture and its bill).

  Distinctions it must respect rather than collapse: current utility versus historical selection for that utility; adaptation versus exaptation versus spandrel; selection for a trait versus selection of its correlated consequences; an engineering optimum versus what the trait actually does; and the difference between a hypothesis that is untestable with the evidence available and one that is false. Say which of these distinctions is doing the most work.

  Results and practices it must remain consistent with: that adaptive hypotheses have genuine predictive successes; that drift, phylogeny, and developmental constraint are real and sometimes demonstrable; that a selection experiment can establish selection in the present without establishing the historical cause of a trait's origin; that population genetics is not up for renegotiation.

  Constraints on the standard itself: it must be usable from realistically available evidence, which means it cannot simply demand a complete selection history; it must state rather than presuppose where the burden of proof falls and why that placement is not just a default borrowed from one camp; it must have something to say about the literature-level fact that a hypothesis often comes to count as supported because nobody has published a failure to find the effect; and it must be revisable in the light of aggregate evidence rather than insulated from it.

  Two tests, please, and they are the part I care about most. First, apply your list to this constructed case and report which verdict it yields: a clade of 47 described species of burrowing skink, 41 of which carry an expanded bony flange on the skull roof; the six that lack it live in loose sand, the rest in compacted soils, and presence survives phylogenetic correction; the flange distributes load well, and measured flange areas fall within about twelve per cent of the value a mechanical model predicts as optimal for each species; developmentally the flange is a secondary outgrowth of the bone roofing the jaw-adductor chamber, whose volume tracks bite force, which in turn tracks the hardness of the prey each species takes; no fitness measurements exist; no genomic scan has been run; the flange is absent in the fossil outgroups; and in two species females use it in courtship displays. Second: suppose a large consortium reanalysed a model clade with ancient and modern genomes and found that roughly half the traits the literature presents as textbook adaptations show no detectable selection signature at the relevant loci and are better predicted as correlated responses to selection on neighbouring traits. What should the standard recommend in that world, and is your list capable of changing its verdicts in response to it?

  Finally, mark each requirement as non-negotiable or as the preference of a particular camp, and flag any desideratum on your own list that you suspect is really a party prejudice in methodological dress — including any that would quietly beg the question against the adaptationist programme itself. Identify any pair of requirements you believe cannot be jointly satisfied, and say which single requirement excludes the most candidate standards. Close with a brief scorecard, in prose or a table, of no more than four contenders: the comparative method with phylogenetic correction, optimality and engineering modelling, the demand for direct evidence of selection, and a developmental-constraints-first approach. Skip references and reading suggestions; I know the literature. Keep the weight on the criteria and their motivating cases rather than on the scoring.
reasoning: |-
  We are drafting a specification for a standard to adjudicate adaptive hypotheses in evolutionary biology. The standard must tell a biologist when they are licensed to claim that a trait is an adaptation for a specific function F, as opposed to being a byproduct, exaptation, constraint, or drift artifact. The standard must be applicable to evidence realistically available in manuscripts (comparative data, phylogeny, ecology, functional/optimality analysis, selection experiments, genomic scans). It must return one of three verdicts: warranted, not warranted, or underdetermined.

  We have several categories of desiderata:

  1. **Cases it must get right**: Clear positives, clear negatives, and hard cases.
  2. **Distinctions it must respect**: Current utility vs. historical selection, adaptation vs. exaptation vs. spandrel, selection for a trait vs. selection of correlated consequences, engineering optimum vs. actual function, untestable vs. false.
  3. **Results and practices it must remain consistent with**: Predictive successes of adaptive hypotheses, reality of drift/phylogeny/constraints, limitations of selection experiments, population genetics foundations.
  4. **Constraints on the standard**: Must be usable with available evidence (no complete history required), must state burden of proof and why, must address literature-level effects (e.g., absence of disproof), must be revisable with aggregate evidence.

  Additionally, we must apply the standard to a constructed case (burrowing skink) and a hypothetical consortium finding. We must mark requirements as non-negotiable or camp-specific, flag any question-begging desiderata, identify any unsatisfiable pair, and note which requirement excludes the most candidate standards. Finally, we must briefly score four contenders.

  ---

  **Desiderata for the Standard**

  **I. Cases it must get right** (Non-negotiable: These are empirical touchstones.)

     A. **Clear positives** (must return "warranted" without hedging):
        - Example 1: Lactase persistence in dairying populations (genomic signature of recent selective sweep).
        - Example 2: Darwin's orchid nectar spur and coevolved pollinator (prediction of an unknown trait in another species, later confirmed).

        *Rationale*: The standard must not be overly skeptical about well-established adaptations. It must account for cases where the evidence is strong and multifaceted (genetics, ecology, prediction).

     B. **Clear negatives** (must return "not warranted" or at least "underdetermined" when evidence is absent, and "not warranted" when evidence is present but contradictory):
        - Example: The spandrels of San Marco (triangular spaces are architectural necessities, decorated but not for decoration). 

        *Rationale*: The standard must avoid false positives by recognizing that current utility or ornamentation does not imply adaptation for that function.

     C. **Hard cases** (must return a verdict that is defensible and not evasive, even if it is "underdetermined"):
        - Panda's radial sesamoid thumb: A modified wrist bone used for grasping bamboo. Is it an adaptation for feeding? (Note: current utility is clear, but historical origin might be more complex.)
        - Lens crystallins: Metabolic enzymes (e.g., lactate dehydrogenase) recruited for a structural role in the lens. Are they adaptations for lens transparency? (They are exaptations in Gould's terms.)
        - Human chin: Is it an adaptation or a spandrel of jaw reduction?
        - Flamingo's inverted feeding posture and bill: Is this an adaptation for filter-feeding in shallow water? (Note: the posture is unusual and highly specialized.)

        *Rationale*: The standard must handle ambiguous or controversial cases without collapsing important distinctions. It must be able to say "underdetermined" when evidence is insufficient, but also "warranted" or "not warranted" when the balance of evidence tips.

  **II. Distinctions it must respect** (Non-negotiable: These are conceptual foundations of evolutionary biology.)

     A. **Current utility vs. historical selection for that utility**: A trait can be currently useful without having been shaped by selection for that utility (e.g., exaptation). The standard must require evidence for historical selection for F to call it an adaptation for F.

     B. **Adaptation vs. exaptation vs. spandrel**:
        - Adaptation: trait shaped by natural selection for its current function.
        - Exaptation: trait evolved for one function and co-opted for another.
        - Spandrel: trait arising as a byproduct of constraints, not directly selected.

        The standard must not label a trait as an adaptation for F if it is an exaptation or spandrel, unless the evidence shows selection for F.

     C. **Selection for a trait vs. selection of its correlated consequences**: If a trait is selected because it is correlated with another trait under selection, it may not be an adaptation for its own effects. The standard must guard against inferring adaptation when the trait might be a correlated response.

     D. **Engineering optimum vs. actual function**: A trait may be suboptimal yet still an adaptation. The standard must not require optimality to infer adaptation.

     E. **Untestable vs. false**: The standard must distinguish between a hypothesis that is unsupported by available evidence (underdetermined) and one that is contradicted by evidence (not warranted).

     *Which distinction does the most work?* The distinction between **current utility and historical selection** does the most work because it directly addresses the core of adaptation: historical selective pressures. Without this, the standard would conflate adaptation with mere utility.

  **III. Results and practices it must remain consistent with** (Non-negotiable: These are established scientific facts and methods.)

     A. Adaptive hypotheses have genuine predictive successes (e.g., Darwin's orchid).

     B. Drift, phylogeny, and developmental constraint are real and sometimes demonstrable.

     C. A selection experiment can establish selection in the present without establishing the historical cause of a trait's origin (so it cannot alone warrant a historical adaptation claim).

     D. Population genetics is not up for renegotiation (e.g., selection requires heritable variation, differential fitness).

  **IV. Constraints on the standard** (Non-negotiable for usability and fairness.)

     A. **Feasibility**: Must be applicable to evidence realistically available in manuscripts (cannot demand a complete selection history).

     B. **Burden of proof**: Must explicitly state where the burden falls and why. The burden should be on the claimant to provide evidence for adaptation, because (i) alternative processes (drift, constraint) are always possible, and (ii) the adaptationist program has been criticized for too readily accepting just-so stories. However, the burden must not be set impossibly high (e.g., requiring a selection coefficient from the past) and must be responsive to evidence.

     C. **Literature-level effects**: Must acknowledge that sometimes a hypothesis is supported by the absence of disproof, but the standard must require positive evidence. However, it must not require that every alternative be explicitly tested in every study.

     D. **Revisability**: Must allow that aggregate evidence (e.g., meta-analyses, consortium findings) can change verdicts on individual traits. The standard must not be frozen in a single evidentiary snapshot.

  **V. Potential Question-Begging or Camp-Specific Desiderata**

     - **Burden of proof**: The placement of the burden of proof (on the adaptation claimant) is a non-negotiable constraint, but it reflects the anti-adaptationist critique. However, it is justified by the need to avoid false positives and by the plurality of evolutionary processes. This is not necessarily question-begging because it does not assume that adaptation is rare; it only demands evidence when claiming it.

     - **Requirement for historical evidence**: This might be seen as anti-adaptationist, but it is fundamental to the definition of adaptation. It is non-negotiable.

     - **Optimality**: Requiring optimality would be a camp-specific (strong adaptationist) view and is excluded by the distinction between optimum and adaptation. We do not require it.

  **VI. Incompatible Pairs?**

     - **Feasibility vs. Historical Evidence**: It might seem that requiring evidence of historical selection (which is hard to get) conflicts with feasibility. However, the standard can use proxies (e.g., phylogenetic patterns, genomic signatures) without requiring a complete history. This pair can be satisfied by allowing multiple lines of evidence.

     - **Burden of Proof vs. Predictive Successes**: If the burden is set too high, we might undercount true adaptations (e.g., Darwin's orchid might not have been published under a very strict standard). However, the orchid case had strong predictive evidence. The burden of proof is not set impossibly high; it requires sufficient evidence for the claim.

     The most challenging requirement is **feasibility combined with historical evidence**. It excludes standards that demand direct historical evidence (e.g., a selection experiment in the past) and favors those that use proxies (phylogenetic comparative methods, genomic scans).

  **VII. Requirement that Excludes the Most Candidate Standards**

     The requirement that **adaptation requires evidence of historical selection for the specific function F** excludes:

     - Standards that rely solely on current utility (e.g., some engineering analyses).
     - Standards that use optimality as a proxy for adaptation (without evidence of historical selection).
     - Standards that require only a selection experiment (which shows current selection, not historical).

     This requirement is non-negotiable and central.

  ---

  **Application to Constructed Case: Burrowing Skink**

  *Case summary*:
  - Clade of 47 species of burrowing skink, 41 have an expanded bony flange on the skull roof.
  - 6 without flange live in loose sand; the rest in compacted soils.
  - Presence survives phylogenetic correction (i.e., correlated with habitat after accounting for phylogeny).
  - Flange distributes load well; area within 12% of optimal from mechanical model.
  - Developmentally: flange is a secondary outgrowth of bone roofing jaw-adductor chamber; chamber volume tracks bite force, which tracks prey hardness.
  - Fossil outgroups lack the flange.
  - In two species, females use it in courtship displays.
  - No fitness measurements, no genomic scan.

  *Analysis*:

  1. **Current utility**: The flange has a demonstrable function (load distribution) and is near-optimal for that function. It is associated with compacted soils (where load distribution might be more critical) and bite force (which is adaptive for prey hardness). However, there is also a potential secondary use in courtship (in two species).

  2. **Historical evidence**: 
     - **Phylogenetic correction**: The trait is correlated with habitat after accounting for phylogeny, suggesting independent evolution in response to habitat. This is evidence of repeated evolution in response to a selective pressure.
     - **Fossil outgroups**: Absent in outgroups, so likely derived.
     - **Developmental pathway**: The flange develops from a bone that is linked to bite force (which is under selection for feeding). This suggests that the flange might have arisen as a byproduct of selection for bite force (i.e., a spandrel) or was co-opted. However, the mechanical model and near-optimality suggest that it is now functional.

  3. **Selection for F?**: The case for adaptation for load distribution is strong but not complete. We have:
     - Correlation with environment (compacted soils) across species, with phylogenetic control (suggesting adaptation).
     - Functional and optimality analysis (supports that it is useful and well-designed for load distribution).
     - Developmental origin: It is an outgrowth of a bone under selection for bite force. This raises the possibility that the flange initially arose as a byproduct and was then co-opted (exaptation) or that it was directly selected for load distribution.

     However, there is no direct evidence of selection on the flange itself (e.g., fitness measurements, genomic signature). Moreover, in two species it is used in courtship, which might indicate a new function (exaptation) or a dual function.

  4. **Verdict**: The evidence is strong but not without ambiguity. The phylogenetic pattern and functional analysis support adaptation for load distribution. However, the developmental link to bite force and the courtship display in two species introduce some uncertainty. Given the absence of direct selection evidence and the potential for exaptation, this case is on the border.

     **Standard's verdict**: **Warranted** for the function of load distribution in burrowing. Why?
     - The trait is repeatedly associated with an environment where the function is needed (phylogenetic evidence of independent evolution).
     - It is functional and near-optimal for that task.
     - The alternative (that it is a byproduct of selection for bite force) is possible, but the functional match to the burrowing environment (and lack of flange in loose-sand species) suggests direct selection. The burden of proof is met by the convergence and functional analysis.

     However, note: If the courtship use were widespread, we might have a case of exaptation. But it is only in two species. The standard would recommend further investigation (e.g., a genomic scan) but does not require it for a warranted verdict given the convergence and functional match.

  ---

  **Application to Consortium Finding**

  *Hypothetical*: A large consortium reanalyzes a model clade and finds that about half of the traits presented as textbook adaptations show no detectable selection signature at the relevant loci and are better predicted as correlated responses to selection on neighboring traits.

  *Implications*:
  - This aggregate evidence suggests that correlated responses are common and that many traits may not have been selected for their current function but are byproducts.

  *What should the standard recommend?*
  - The standard must be revisable. If aggregate evidence shows that a particular type of evidence (e.g., phenotypic correlation without genetic signature) is often associated with non-adaptation, then the standard should adjust the weight given to such evidence.
  - Specifically, in this world, the standard should:
     - Raise the bar for claims based solely on phenotypic correlations and functional analysis without genetic or direct selection evidence.
     - Recommend that in the absence of evidence ruling out correlated response (e.g., genomic scan, detailed genetic dissection), the verdict might shift from "warranted" to "underdetermined" for some cases.
     - However, the standard should not discard such evidence entirely. Convergence across species and functional analysis still provide positive evidence, but they are now seen as less definitive.

  *Is our list capable of changing verdicts?*
  - Yes, because of the revisability constraint. The consortium finding would be aggregate evidence that correlated responses are common. This would:
     - Affect the burden of proof: Now, to claim adaptation, one must provide stronger evidence (e.g., ruling out correlated response).
     - Change the verdicts for individual traits: Some traits previously considered warranted might become underdetermined (if they relied on phenotypic evidence alone) or even not warranted (if new evidence contradicts the adaptation hypothesis).

     For example, in the skink case, without a genomic scan and with the consortium finding, the verdict might become **underdetermined** until genetic evidence is available. The functional and phylogenetic evidence is still positive, but the consortium finding suggests that such evidence is often misleading.

  ---

  **Scorecard of Four Contenders**

  We evaluate four approaches by the standard's desiderata:

  1. **Comparative method with phylogenetic correction**:
     - *Strengths*: Handles historical patterns (convergence, independent evolution), respects phylogeny, feasible with available data. Can get clear positives (e.g., lactase persistence if phylogeny shows convergence) and negatives (if trait does not correlate with environment after correction). Consistent with predictive successes (e.g., predicting trait-environment associations).
     - *Weaknesses*: Does not directly test for selection (might miss drift or constraint), cannot distinguish current utility from historical selection without additional evidence (e.g., if a trait is conserved but currently useful). Hard cases (e.g., exaptations) might be misclassified. Without genetic evidence, might not detect correlated responses.

  2. **Optimality and engineering modelling**:
     - *Strengths*: Demonstrates current utility and can show good design. Can predict trait values (e.g., Darwin's orchid). Consistent with engineering distinctions (optimum vs. actual). Feasible in some systems.
     - *Weaknesses*: Does not provide evidence of historical selection (might be an exaptation). Optimality is not required for adaptation (so suboptimal traits might be adaptations). Might beg the question if optimality is taken as proof. Fails on clear negatives (e.g., spandrels of San Marco are well-decorated but not designed for that). Does not address drift or constraint.

  3. **Demand for direct evidence of selection** (e.g., selection experiments, genomic scans):
     - *Strengths*: Directly addresses historical selection (genomic scans) or current selection (experiments). Can distinguish selection for a trait from correlated responses (with genetic tools). Consistent with population genetics. Can handle hard cases (e.g., genomic signature of selection in lactase persistence).
     - *Weaknesses*: Not feasible for many traits (e.g., fossils, rare species). Selection experiments only show current selection, not historical. Genomic scans might miss ancient or soft sweeps. Might exclude clear positives that lack such data (e.g., Darwin's orchid was warranted without direct selection evidence). Overly strict burden of proof.

  4. **Developmental-constraints-first approach**:
     - *Strengths*: Respects constraints and byproducts. Handles clear negatives (spandrels) and hard cases (e.g., crystallins, panda thumb). Consistent with developmental biology.
     - *Weaknesses*: Might undercount true adaptations. Does not directly address function or selection. Not feasible for many taxa (development not well-studied). Fails clear positives (e.g., lactase persistence: the genetic change is not a constraint). Might place burden of proof too heavily against adaptation.

  **Overall**: No single contender satisfies all desiderata. The standard must integrate multiple lines of evidence. However, the comparative method with phylogenetic correction comes closest because it addresses historical patterns (via convergence) and is feasible. It must be supplemented with functional analysis (to show utility) and, when possible, genetic evidence (to rule out correlated responses). The demand for direct selection evidence is strong but not always feasible, so it cannot be required in all cases.

  ---

  **Final Specification Sketch**

  The standard for adjudicating adaptive hypotheses must:

  1. **Require evidence of historical selection for the specific function F** (non-negotiable). This evidence can come from:
     - Phylogenetic comparative methods showing repeated, independent evolution of the trait in response to F-related selective pressures (convergence).
     - Genomic signatures of selection at loci underlying the trait (when available).
     - Direct measurements of fitness components in a historical context (rare) or via selection experiments combined with evidence that the trait evolved under similar conditions.

  2. **Require evidence of current utility for F** (non-negotiable). This can come from:
     - Functional/engineering analysis.
     - Ecological observation.

  3. **Consider and rule out (or weigh against) major alternatives** (non-negotiable):
     - Byproduct of constraint (developmental, architectural).
     - Drift (e.g., trait not under selection).
     - Exaptation (co-opted from another function).
     - Correlated response to selection on another trait.

     The burden of proof is on the claimant to provide positive evidence for adaptation and to address plausible alternatives. However, the claimant need not rule out every logically possible alternative, only those that are biologically plausible given the system.

  4. **Be revisable with aggregate evidence** (non-negotiable): New findings (e.g., consortium study) can change the weight given to certain types of evidence (e.g., if phenotypic convergence is often due to correlated response, then it becomes weaker evidence).

  This integrated standard would:
  - Warrant lactase persistence (historical selection via genomic signature and current utility).
  - Warrant the skink flange (convergence, functional utility, and developmental origin that is consistent with adaptation; courtship in two species is a secondary use but not the primary function).
  - Rule out San Marco spandrels (architectural constraint, no evidence of selection for decoration).
  - Return "underdetermined" for the human chin (if only fossil and developmental evidence) until more evidence is available.

  It respects the key distinctions and is feasible with available evidence.
answer: |-
  Below is the specification for adjudicating adaptive hypotheses, structured by desiderata, motivated cases, and constraints. The goal is a standard that returns "warranted," "not warranted," or "underdetermined" for the claim "trait T is an adaptation for function F." Requirements are marked as **non-negotiable** (empirically or logically grounded) or **camp-specific** (reflects methodological preferences of a school of thought). Incompatibilities and biases are flagged.

  ---

  ### **Desiderata for the Standard**  
  *Derived from cases, distinctions, consistency requirements, and constraints.*

  1. **Must handle clear cases correctly**  
     - **Motivation**: Avoids false negatives/positives and anchors the standard in uncontroversial biology.  
     - **Non-negotiable**:  
       - **Positives**: Warrant without hedging for cases like lactase persistence (genomic sweep + ecology) or Darwin’s orchid (prediction + confirmation).  
       - **Negatives**: Reject adaptation claims for San Marco spandrels (architectural necessity + no selective history for decoration).  
     - **Hard cases**: Return nuanced verdicts:  
       - Panda’s thumb: "Warranted" for current function (grasping) but "underdetermined" for historical selection (exaptation possible).  
       - Lens crystallins: "Not warranted" as adaptations for vision (recruited enzymes; exaptation).  
       - Human chin: "Underdetermined" (spandrel vs. adaptation debates unresolved).  
       - Flamingo posture: "Warranted" (functional/ecological match outweighs developmental constraints).  

  2. **Must respect key distinctions**  
     - **Non-negotiable**:  
       - **Current utility vs. historical selection**: Primary distinction doing the most work. Adaptation requires evidence of historical selection *for F*, not just current use (e.g., exaptations like crystallins fail this).  
       - **Adaptation vs. exaptation vs. spandrel**: Assign "adaptation" only if selection *for F* shaped T; exaptations/spandrels are "not warranted" without such evidence.  
       - **Selection for T vs. selection of correlates**: Trait must not be a correlated response (e.g., genomic consortium case).  
       - **Optimality vs. function**: Optimality supports but is insufficient for adaptation (suboptimal traits can be adaptations).  
       - **Untestable vs. false**: "Underdetermined" if evidence is absent; "not warranted" if evidence contradicts F (e.g., spandrels with decorative utility but no selective history).  

  3. **Must align with established results/practices**  
     - **Non-negotiable**:  
       - Predictive successes (e.g., orchid) are valid evidence.  
       - Drift, phylogeny, and constraints are real alternatives (e.g., San Marco spandrels).  
       - Selection experiments inform current utility, not historical origins.  
       - Population genetics is foundational (e.g., selection requires heritable variation).  

  4. **Constraints on the standard**  
     - **Non-negotiable**:  
       - **Feasibility**: Cannot require complete selection histories (infeasible). Manuscript-scale evidence (comparative data, phylogenies, ecology, optimality models) must suffice.  
       - **Burden of proof**: Rests on adaptation claimant due to risk of false positives. Burden is not default anti-adaptationism; alternatives (drift/constraint) are null hypotheses.  
       - **Literature-level effects**: Absence of disproof ≠ support; requires positive evidence.  
       - **Revisability**: Verdicts mutable with aggregate evidence (e.g., consortium findings).  

  ---

  ### **Potential Biases and Incompatibilities**  
  - **Question-begging desiderata**:  
    - Burden of proof on adaptation claimants (**camp-specific**: reflects anti-adaptationist critiques). Could subtly bias against adaptationist program if set too high.  
    - Requiring evidence of historical selection (**non-negotiable**) may seem anti-adaptationist but is definitionally necessary.  
  - **Incompatible pair**:  
    - *Feasibility* (no direct selection evidence required) vs. *Historical selection distinction* (direct evidence ideal). **Resolution**: Proxies (e.g., convergence) suffice, but this risks false positives. Satisfied if proxies are robust.  
  - **Most exclusionary requirement**:  
    - *Historical selection for F* excludes:  
      - Purely optimality-based standards (ignore history).  
      - "Current utility alone" standards (conflate exaptation).  

  ---

  ### **Tests of the Desiderata**  
  **1. Burrowing Skink Case**  
  - **Evidence**:  
    - Convergence: Flange correlates with compacted soil (41/47 species), phylogenetically corrected.  
    - Function: Load distribution, near-optimal (12% deviation).  
    - Development: Linked to bite force (under selection for prey hardness).  
    - Alternatives: Absent in fossils; courtship use in 2 species (possible exaptation).  
    - Gaps: No fitness/genomic data.  
  - **Verdict**: **Warranted** for load distribution.  
    - Rationale: Convergence + functional match + developmental link to selected trait (bite force) meets burden of proof. Courtship is local exaptation but secondary; historical selection for F is inferred via phylogeny and biomechanics.  

  **2. Genomic Consortium Finding**  
  - **Scenario**: Half of "textbook adaptations" show no selection signatures, instead arising as correlated responses.  
  - **Recommendation**:  
    - Shift burden: Phylogenetic/functional evidence alone becomes "underdetermined"; genomic or experimental evidence required to rule out correlates.  
    - Revisability: Traits previously "warranted" on comparative grounds downgraded to "underdetermined" or "not warranted."  
  - **List compatibility**: **Yes**. Desiderata on revisability and selection-for-vs.-of distinctions explicitly handle this.  

  ---

  ### **Scorecard of Contenders**  
  *Evaluated against desiderata (✓ = strong; ~ = partial; ✗ = weak)*.  

  | **Contender**               | **Cases** | **Distinctions** | **Consistency** | **Constraints** | **Overall Fit** |  
  |-----------------------------|-----------|------------------|-----------------|-----------------|-----------------|  
  | **Comparative method + phylogeny** | ✓ (handles convergence) | ~ (infers history weakly) | ✓ (uses drift/constraint) | ✓ (feasible) | Best: Strong on positives/negatives, feasible. Weak on hard exaptations. |  
  | **Optimality/engineering**  | ~ (positives ✓; negatives ✗) | ✗ (collapses history/utility) | ~ (ignores drift) | ✓ (feasible) | Poor: Fails San Marco test; no historical evidence. |  
  | **Direct selection evidence** | ✓ (genomic/experimental) | ✓ (clear history) | ~ (ignores constraints) | ✗ (infeasible often) | Limited: Excludes Darwin’s orchid; violates feasibility. |  
  | **Developmental-constraints-first** | ~ (negatives ✓; positives ✗) | ~ (highlights constraints) | ✓ (integrates constraints) | ~ (feasible for some) | Poor: Over-rejects adaptations (e.g., lactase). |  

  **Summary**:  
  - **Comparative method** is strongest baseline, needing supplementation (e.g., functional analysis) to harden historical inferences.  
  - **Optimality** and **developmental-first** approaches are camp-specific (strong adaptationist/anti-adaptationist) and fail key distinctions.  
  - **Direct evidence** is gold standard but infeasible as universal requirement; best for decisive verdicts when available.  

  ---

  ### **Final Specification**  
  The standard warrants "T is an adaptation for F" **only if**:  
  1. **Current utility for F** is demonstrated (e.g., functional/ecological evidence).  
  2. **Historical selection for F** is inferred via robust proxies (e.g., phylogenetic convergence, selective sweeps).  
  3. **Major alternatives** (drift, constraint, exaptation, correlated response) are addressed and discounted.  
  4. **Burden of proof** rests on claimant; "underdetermined" is default for inadequate evidence.  

  **Verdicts**:  
  - **Warranted**: All criteria satisfied (e.g., skink flange).  
  - **Not warranted**: Evidence contradicts F or supports alternatives (e.g., San Marco spandrels).  
  - **Underdetermined**: Ambiguous proxies or gaps (e.g., human chin without genomic data).  

  **Revisability**: Consortium-level findings refine weights of evidence types (e.g., phylogeny alone downgraded).  

  This specification excludes infeasible demands (e.g., complete selection histories), respects core distinctions, and adapts to new evidence—critical for referee guidelines.
