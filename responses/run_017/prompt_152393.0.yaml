answer: |-
  Below is a fully runnable 75-minute seminar plan designed to make students viscerally experience the breakdown of the single probability measure assumption. The activity uses your calibration mechanic with enhancements for engagement, addresses the "fifty-fifty" objection via the class split, and incorporates the token and policy-commitment stages. The script includes timing, board work, student tasks, raffle mechanics, and a debrief map. It anticipates common pitfalls and provides responses.

  ---

  ### **Pre-Session Setup**
  - **Materials**: 
    - Opaque Bag A (pre-filled secretly; see split below).
    - Empty transparent Bag B, ping-pong balls (red/black), index cards, coin, whiteboard, projector.
    - Raffle tickets (100+), book token.
  - **Bag A Prep**:
    - **Split the class secretly**: Half get cards saying: *"Bag A was filled by a classmate who wins the book token if the class loses more bets than wins."* The other half get: *"Bag A was filled mechanically: coin flips decided each ball’s color."* 
    - Assign these cards randomly during entry. Students keep them private.
  - **Raffle System**: 
    - Give each student 5 raffle tickets at entry (for participation/bets). 
    - Token cost: 2 raffle tickets. It lets a coin flip choose which bag to bet on (opaque or transparent) during betting.

  ---

  ### **Session Script (75 Minutes Total)**
  #### **I. Introduction & Betting Context (10 min)**
  - **0-3 min**: Recap expected utility.  
    - *Board*: Write: "EU Axioms → Single Probability Measure. But is one measure enough?"  
    - *Say*: "Last week, we saw axioms imply you maximize EU with one probability measure. Today, we test this with bets. You’ll gain/lose raffle tickets. Most raffle tickets at the end wins the book token."  
  - **3-7 min**: Introduce bags.  
    - *Show*: Opaque Bag A ("10 balls, red or black; you know nothing else"), transparent Bag B (empty), and balls.  
    - *Say*: "You’ll calibrate Bag B to match Bag A for specific bets. Bets: Pick a bag and a color. If you draw that color, you win 10 raffle tickets. Lose 5 if wrong."  
  - **7-10 min**: Explain calibration.  
    - *Say*: "For each color, you’ll write a number for Bag B. Example: If you write 4 for red, I’ll fill Bag B with 4 red and 6 black. If you’re indifferent between betting on red from Bag A or Bag B, you’ve calibrated correctly. Be honest—no tricks."  
    - *Board*: Sketch two scenarios:  
      - Bet on RED: Bag A (?) vs. Bag B (R red, 10-R black).  
      - Bet on BLACK: Bag A (?) vs. Bag B (B black, 10-B red).  

  #### **II. Calibration Phase (25 min)**  
  - **10-15 min**: Commit to a policy (prevent anchoring).  
    - *Task*: "On your card, write: 'Policy: I will set RED = ____, BLACK = ____.' Do this alone. No discussion. I’ll collect cards."  
    - *Why*: Forces initial intuition without peer influence. Collect cards immediately to lock in responses.  
  - **15-20 min**: Revise with transparency (adds reflection).  
    - *Hand back cards*: "Revise your numbers if you wish. I’ll fill Bag B live using your numbers. But first, let’s see one volunteer’s Bag B."  
    - *Demo*: Pick a volunteer (not the Bag A filler). Ask for their red number. Fill Bag B accordingly (e.g., 3 red, 7 black). Draw one ball to show transparency. Empty Bag B after.  
    - *Say*: "This is your Bag B for your bets. If your number differs, yours will have different risks."  
  - **20-25 min**: Write final numbers.  
    - *Task*: "Finalize RED and BLACK numbers on your card. Add them: R + B = ____."  
    - *Prevent anchoring*: During writing, project a neutral image (e.g., abstract art) to avoid displaying early numbers. Circulate to discourage peeking.  
  - **25-30 min**: Collect and tally.  
    - *Board*: Create a table: | Student | RED | BLACK | R+B | Group (A/B) |.  
    - *Task*: Students say RED, BLACK, and R+B aloud. You record, noting group (A = suspicion, B = mechanical).  
    - *Example*: "Student 1: Red 4, Black 3, Sum 7, Group A."  

  #### **III. Betting & Token Phase (15 min)**  
  - **30-35 min**: Explain betting and token.  
    - *Say*: "Now, bet on red or black using your numbers. Pick a bag (A or B) and a color. If you draw your color, +10 tickets; else, -5. You can use your token: Pay 2 tickets to flip a coin. Heads, you bet on Bag A; tails, Bag B."  
    - *Board*: Write betting options:  
      - "Option 1: Choose bag yourself.  
      - Option 2: Use token (coin flip chooses bag)."  
  - **35-40 min**: Conduct bets.  
    - *Task*: Each student declares:  
      - Color (red or black).  
      - Bag choice (A, B, or token).  
      - If token, flip coin publicly.  
    - For each bet:  
      - If they chose Bag B: Use their personal RED/BLACK numbers to fill Bag B live. Draw one ball.  
      - If Bag A or token-result A: Draw from Bag A.  
    - *Track*: Update raffle tickets on the board (student initials, +10/-5).  
  - **40-45 min**: Settle raffle token.  
    - *Say*: "Anyone with tokens left? Cash in unused tokens: 1 token = 1 extra raffle ticket."  

  #### **IV. Results and Transition (5 min)**  
  - **45-50 min**: Announce raffle winner (most tickets) and award book token.  
    - *Board*: Circle the winner’s name.  
    - *Say*: "Note: The Bag A filler wins only if the class net tickets are negative. Let’s check: Sum all tickets." (Calculate quickly; odds are negative).  

  ---

  ### **Debrief (25 min)**  
  **Goals**:  
  - Link activity moments to EU breakdown.  
  - Show ambiguity aversion ≠ risk aversion or cheating suspicions.  
  - Precede formal terms (urn/ambiguity) until the end.  

  #### **Debrief Script**  
  - **50-55 min**: Elicit observations.  
    - *Ask*: "What surprised you? Who had R+B ≠ 10? Why?"  
    - *Expected student insights*:  
      - "I set R=3, B=4, but 3+4=7 < 10. I felt Bag A was riskier for both colors."  
      - "I revised down after seeing the demo—I realized I didn’t trust Bag A."  
    - *Board*: Highlight R+B sums. Circle common patterns (most sums <10).  
  - **55-60 min**: Map to EU breakdown.  
    - *Say*: "Recall: EU axioms imply one probability measure. If you treat Bag A as having probability P(red), you’d set R = 10×P(red) and B = 10×P(black). Then R+B = 10×(P(red)+P(black)) = 10. But your sums weren’t 10."  
    - *Point*: "This isn’t risk aversion. Risk aversion affects utility curvature, but here prizes were identical (tickets). Nor is it about guessing contents: If you thought Bag A had 6 red, you’d set R=6, B=4, and sum to 10. But you set both low."  
    - *Use data*: "Group A (suspicion) had lower sums? But if you suspected cheating, you’d avoid Bag A for one color and embrace it for the other. Did you? No—you avoided it for both. Suspicion amplifies the effect but doesn’t explain it."  
  - **60-65 min**: Address pitfalls (when they arise).  
    - **Fifty-fifty move**: "Some said, ‘I’ll assume Bag A is 50-50.’ But most didn’t. Why? Because ambiguity feels different from known risk. Writing numbers forced you to confront your discomfort."  
    - **Shaking bag/accusations**: "You can’t shake Bag A—no information. I’m not bluffing; I don’t know the contents. Group B’s mechanical filling had no human intervention."  
    - **Leaker/refuser/gotcha questions**:  
      - Leaker: "If the filler leaked, we exclude their data. But our split shows even Group B avoided Bag A."  
      - Refuser: "If you refused to bet, you might set R=10, B=10. That’s extreme ambiguity aversion—still violates additivity."  
      - Empty bag: "Bag A has 10 balls. But if it were empty, you’d set R=0, B=0? Sum 0 ≠ 10—same issue."  
  - **65-70 min**: Formalize and transition.  
    - *Say*: "This is the Ellsberg paradox. The ‘gap’ is between your behavior and one probability measure. Next time, we’ll model this with non-additive probabilities or multiple priors."  
    - *Board*: Write "Ambiguity Aversion" and "Ellsberg."  
    - *End*: "Key insight: Uncertainty about probabilities (ambiguity) breaks the single-measure assumption. Your numbers couldn’t add up because you demanded a ‘premium’ for not knowing."  

  ---

  ### **What the Activity Can and Cannot Deliver**  
  - **Strengths**:  
    - Makes single-measure breakdown visceral: Students *see* their R+B ≠ 10 and can’t rationalize it.  
    - Distinguishes ambiguity from risk/suspicions: The split and betting data show aversion persists without cheating.  
    - Encourages reflection: Policy commitment → revision → betting creates cognitive tension.  
  - **Limitations (require lecture follow-up)**:  
    - **The gap**: The activity exposes the paradox but can’t derive non-additive models. As you guessed, the jump from R+B ≠ 10 to Choquet integrals or multiple priors needs lecture exposition.  
    - **Token nuance**: Students may not use the token optimally. Lecture must clarify how randomization resolves ambiguity aversion.  
    - **Probability concepts**: Some may conflate ambiguity with belief updating. Lecture must distinguish Knightian uncertainty from Bayesian learning.  
  - **Why it works**:  
    - Physical bags/raffles make ambiguity "feel" real.  
    - Personal calibration forces ownership of the contradiction.  
    - Split and token provide immediate counterarguments to skepticism.  

  This plan ensures students experience the paradox before labeling it, setting up your next lecture on formal models. Run it as-is, and debrief rigorously to cement intuition.
