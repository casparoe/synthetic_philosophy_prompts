  2. The game should separate three questions:
     a. Was the transition good for the people living through it?
     b. Was it avoidable given the information at the time?
     c. Is it good that it happened given everything that came after?
  3. The scoring should have two ledgers: one visible during the game (calories and group size) and one revealed at the end (free time, health, equality, etc.).
