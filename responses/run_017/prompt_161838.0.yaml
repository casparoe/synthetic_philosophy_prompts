            - Current population
            - Stored food
            - Total food produced this round (for visible ledger)
            - Free time points (leisure labor)
            - Note if they were raided and how much they lost.
        9. Update the whiteboard.

     **Debrief Questions**:

        - "Which groups had the highest population and total food? How did they achieve that? (farming)"
        - "Now look at the second ledger: health, free time, security. What do you notice about the farming groups compared to the foraging groups?"
        - "Did any group try to switch back to foraging after starting farming? Why or why not? (ratchet: once population grows, foraging doesn't produce enough)"
        - "When did groups decide to start farming? Was it a free choice or forced by circumstances (wild depletion)?"
        - "What about the groups that never farmed? What happened to them? (likely they had low population and maybe even went extinct)"
        - "How do you think this relates to the real history? Remember, we are here because of farming. Does that mean it was a good choice for the people who lived through it? Or was it a trap?"

     **Time Check**: 5 rounds * 10 minutes = 50 minutes, plus setup and debrief. We might need to adjust.

     Let's do 4 rounds to fit in 60 minutes? Then:

        - Introduction: 5 min
        - Setup: 5 min
        - 4 rounds * 10 min = 40 min
        - Final scoring: 10 min
        - Debrief: 10 min

     Total 70, but we have 90. So we can do 5 rounds at 10 min each (50 min) and then 10 min for scoring and 10 min debrief.

     **Predictable Problems**:

        - Groups might not understand the rules: do a practice round with one group.
        - Some groups might farm immediately and then dominate: that's okay, but in the debrief, point out that in the real world, the transition was slow and not everyone did it at once.
        - The global wild depletes too fast: we set it at 30 for 6 groups. In round 1, if each group uses 2 foraging labor, that's 12, leaving 18. Round 2: 12 more, leaves 6. Then round 3: some groups might have to switch. That's the point.
        - Dice rolls might be too random: we can use average dice? But the randomness adds to the uncertainty.

     **Teacher's Role**:

        - Keep time.
        - Resolve actions quickly.
        - Update the whiteboard.

     **Final Note**: The game simplifies, but it should provoke discussion. In the debrief, provide the real evidence.

     This design is runnable within the constraints. Good luck!
answer: |-
  Below is a runnable 90-minute game design for your "Great Questions" seminar, incorporating your core requirements: student-driven discovery of tradeoffs, separation of the three key questions, dual-ledger scoring, ratchet mechanics, and debrief mapping. The design uses only index cards, dice, a whiteboard, and a projector.

  ---

  ### **Game Title:** The Grain Gambit
  **Core Question:** Was the shift from foraging to farming a net gain or loss for humanity?  
  **Students:** 18 players (6 teams of 3)  
  **Time:** 90 minutes  
  **Materials per Team:** 6 index cards (2 white, 2 yellow, 2 red), 1 six-sided die.  
  **Classroom Setup:**  
  - Whiteboard tracks visible "Scoreboard" (Calories & Population).  
  - Projector shows "Global Resource Tracker" (wild food stock, depletion rate).  
  - Teacher has a "Raid Die" (d6) and "Event Deck" (index cards with pre-written events).

  ---

  ### **Game Structure & Timing**
  | Phase          | Time  | Description                                                                 |
  |----------------|-------|-----------------------------------------------------------------------------|
  | **Introduction** | 5 min | Frame the session: "Today, you’ll lead a band through a time of great change. Your goal: thrive." No mention of foraging/farming as "choices." |
  | **Setup**        | 10 min | Assign teams, distribute materials, explain basic rules.                   |
  | **Rounds 1–4**   | 50 min | 4 rounds (12 min each). Each round: Decide actions → Resolve mechanics → Update boards. |
  | **Final Tally**  | 10 min | Calculate/reveal the "Hidden Ledger" (health, free time, equality).        |
  | **Debrief**      | 15 min | Map game outcomes to historical arguments and the three key questions.     |

  ---

  ### **Mechanics & Roles**
  #### **Teams**  
  Each 3-person team controls a band starting as **foragers** with:  
  - **Population:** 3 (each person = 1 labor token).  
  - **Health Tokens:** 3 (start at max).  
  - **Food Storage:** 0 units.  
  - **Resource Cards:**  
    - **White Cards (Wild Foods):** Each = 3 calories. Deplete over time.  
    - **Yellow Cards (Crops):** Each = 5 calories but require farming.  
    - **Red Cards (Crisis/Event):** Trigger raids, droughts, or opportunities.

  #### **Round Sequence**  
  1. **Decide Actions (3 min/round):**  
     Teams assign labor tokens to:  
     - **Forage:** Draw 1 white card per token (gain calories).  
     - **Farm:** Spend 1 token to plant crops (gain 1 yellow card next round). *Requires cleared land.*  
     - **Clear Land:** Spend 1 token to convert foraging grounds to farmland (irreversible).  
     - **Defend/Store:** Spend 1 token to protect stored food from raids.  
     - **Rest:** Unassigned tokens = "free time."  

  2. **Resolve Mechanics (6 min/round, teacher-led):**  
     - **Foraging Yield:**  
       - Each white card played = 3 calories.  
       - **Depletion:** After each round, teacher reduces "Global Wild Stock" (projector) by 2 per team. When stock hits 0, white cards yield 1 calorie.  
     - **Farming Yield:**  
       - Planted crops (yellow cards) mature next round. Each = 5 calories.  
       - **Risk:** Roll die for each yellow card harvested (1–2 = crop failure; 0 calories).  
     - **Storage & Raids:**  
       - Stored food > 3? Roll Raid Die (1d6). If roll ≤ stored food, lose half (rounded down). Defense tokens cancel the raid if roll is even.  
     - **Population & Health:**  
       - **Growth:** Surplus calories? Roll die. 5–6 = +1 population (if calories ≥ population + 2).  
       - **Starvation:** Deficit calories? Lose 1 health token per missing calorie. At 0 health, lose 1 population.  
       - **Health Recovery:** Rest tokens restore 1 health if no deficit.  

  3. **Ratchet Rule (Irreversibility):**  
     - Once a team’s population ≥ 5, they **cannot forage** (white cards yield 0). They must farm or starve.  
     - Clearing land destroys local foraging grounds—no going back.  

  4. **Update Boards (3 min/round):**  
     - **Scoreboard (Visible):**  
       | Team | Calories (Total) | Population |  
       |------|------------------|-----------|  
       | A    | 150              | 4         |  
     - **Global Tracker (Projector):**  
       - Wild Stock: 24 → 18 → 12 → 6 → 0 (depletes by 6/round).  

  ---

  ### **Scoring: Dual Ledger System**
  - **Visible Ledger (Scoreboard):**  
    **Winning Teams:** Highest **total calories** and **population** after Round 4.  
    *Why?* To incentivize calorie/population growth (mirrors "progress" narrative).  

  - **Hidden Ledger (Revealed at end):**  
    Calculate per team:  
    1. **Health Index:** (Final health tokens ÷ starting health) × 100.  
    2. **Free Time %:** (Rest tokens used ÷ total labor tokens) × 100.  
    3. **Equality Score:** 100 if never raided; 50 if raided but defended; 0 if raided and looted.  
    *Project results:* Teams see their "win" came with costs.  

  ---

  ### **Predictable Problems & Mitigation**
  1. **"Noble Savage" Bias:**  
     - **Problem:** Teams romanticize foraging ("peaceful and free!").  
     - **Mitigation:** Depletion mechanics force tough choices. Teams that ignore farming starve when wild stock hits 0.  
     - **Debrief Fix:** Contrast skeletal evidence (shorter stature, tooth decay) with game health scores.  

  2. **"Snowballing" Farmers:**  
     - **Problem:** One team farms early and dominates calories/population.  
     - **Mitigation:** Crop failure dice (1–2 = 0 yield) and raids target high-storage teams. Ratchet rule pressures large groups.  
     - **Debrief Fix:** Highlight tradeoffs: "You fed many, but at what cost to health and freedom?"  

  3. **"It’s Just Preference" Reductionism:**  
     - **Problem:** Students dismiss tradeoffs as subjective.  
     - **Mitigation:** Hidden ledger makes costs objective (e.g., 80% free time vs. 20%).  
     - **Debrief Fix:** Use archaeological data (e.g., tooth enamel studies) to show empirical harms.  

  4. **Oversimplified Irreversibility:**  
     - **Problem:** Ratchet rule feels abrupt vs. centuries-long shift.  
     - **Debrief Fix:** Acknowledge the gap: "Real-world shifts took generations—this compresses it."  

  ---

  ### **Debrief (15 min)**  
  **Link Game Outcomes to Historical Arguments:**  
  1. **"Good for those who lived through it?"**  
     - *Game Evidence:* Health/free time drop as farming intensifies.  
     - *Historical Link:* Skeletal records show worse nutrition post-transition.  

  2. **"Avoidable at the time?"**  
     - *Game Evidence:* Depletion forced farming; ratchet locked it in.  
     - *Historical Link:* Slow "ratchet" (e.g., gradual adoption in Fertile Crescent).  

  3. **"Good that it happened?"**  
     - *Game Evidence:* Farming teams supported larger populations.  
     - *Historical Link:* Farming enabled cities, writing, and this seminar.  

  **Address "Asking from Inside the Outcome"**  
  - *Prompt:* "Why did no team ‘win’ by staying foragers?"  
  - *Reveal:* All surviving teams descended from farmers. Our existence presupposes farming’s "success."  
  - *Key Insight:* "We judge from inside the system—but we can still critique its costs."  

  **What the Game Can’t Simulate (Supply in Debrief):**  
  - **Scale of Time/Land:** Real shifts took centuries; abundant land buffered early foragers.  
  - **Non-Material Factors:** Spiritual/cultural ties to land, which aren’t captured in calorie counts.  
  - **Evidence Required:** Discuss how population density (e.g., Sedentism vs. Nomadism) made farming inevitable.  

  ---

  ### **Why This Works**  
  - **Discovery Before Naming:** Students experience depletion, raids, and health declines before hearing "original affluent society."  
  - **Three Questions Split:** Ratchet mechanics separate inevitability from desirability; dual ledgers split lived experience from long-term gains.  
  - **Tension:** Teams "win" by metrics they didn’t choose (calories), while losing what they value (rest, health).  
  - **Low Tech:** Uses only provided materials; index cards track health/storage; dice handle risk.  

  **First-Run Tips:** Assign a "banker" per team to track tokens, and use the projector to update the Global Tracker live. Expect chaos in Round 1—lean into it ("Your first foraging crisis is here!").
