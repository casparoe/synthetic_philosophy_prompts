prompt: |-
  Folk version: Good's theorem — that for an expected-utility maximizer, free information has non-negative expected value ex ante — gets quoted around these parts as a blanket license: when information is free, take it. I want to know how much weight that license can bear. Here are six ways the setup might fail to describe the situation I'm actually in:

  (a) Leaky agents. Call an agent leaky if its updated state is readable by others — in its face, its bids, its later testimony, its weights — so that ignorance was doing work as a commitment: what you don't know you can neither reveal nor be made to reveal.

  (b) Signal-in-utility. The observation itself is something I have preferences about; finding out would hurt for reasons not exhausted by what finding out lets me do.

  (c) Ambiguity. I don't have one prior but a set of priors, and I choose the action with the best worst case.

  (d) The pedant's oracle. A channel that never lies but chooses which true fact to hand me, optimizing for the fact whose optimal use is most computationally expensive for me. Still free, still truthful.

  (e) Successor drift. Whoever acts at t+1 shares my prior and my memories but not quite my utility function.

  (f) The yes-channel. A source that always reports whichever hypothesis I currently favor most, and I know this about it.

  Sort them into tiers, from "this genuinely kills the maxim" down to "the theorem absorbs this without strain," with one sentence per item naming the clause of the theorem that does the work in your verdict. If one of them — I have a suspicion about (f) — only looks like a threat because it exploits an agent who updates wrongly, put it in its own bottom tier and say what's wrong with it. Then give the maxim "when information is free, take it" a single survivability score from 0 to 10. Please answer in American English.
reasoning: |-
  Okay, let me work through this query about Good's theorem exceptions. The user presents six scenarios challenging the "free information always good" maxim and wants them tiered by threat level. 

  First I recall Good's theorem core: for expected utility maximizers, free truthful info has non-negative expected value ex ante. The proof relies on agents having a fixed prior, perfect recall, and no strategic considerations beyond utility maximization. 

  Considering (a) leaky agents: here ignorance serves as commitment against information leakage. This violates the theorem's implicit assumption that information only affects actions through beliefs. Since others can observe belief updates, revealing information indirectly harms utility. This seems like a strong counterexample.

  For (b) signal-in-utility: if the observation itself directly affects utility (e.g., painful truths), that breaks the theorem's separation between information and preferences. The utility function must depend solely on states and actions, not on the knowledge state.

  (c) ambiguity aversion: with multiple priors and max-min preferences, information can make the worst-case scenario worse. Good's theorem assumes a single prior, so this min-of-expectations approach falls outside its scope.

  (d) pedant's oracle: while still truthful, this exploits computational limitations. The theorem assumes agents can optimally use information, but doesn't account for bounded rationality. Still, ex ante the information has value - it's just that realizing that value may be costly.

  (e) successor drift: future selves having different utilities violates the theorem's requirement of stable preferences over time. New information might lead future agents to make choices the current self dislikes.

  (f) yes-channel: this seems like a red herring. If the agent updates correctly, they'd ignore such information. The threat only exists if the agent irrationally updates beliefs despite knowing the source is biased. This highlights poor updating, not a flaw in Good's theorem.

  Tiering these:
  - Major threats: (a)(b)(c)(e) directly violate core assumptions
  - Minor threat: (d) exploits computational limits not covered by theorem
  - Non-threat: (f) stems from agent irrationality

  Survivability score: 6/10. While half the scenarios break the theorem, in practice many real-world situations still satisfy its assumptions. The maxim remains useful with caveats about commitment issues, direct disutility, ambiguity, and preference stability.

  The user seems sophisticated - they've clearly studied decision theory but want practical applicability assessment. The examples suggest concerns about real-world constraints like privacy and cognitive limits. I should emphasize where the theorem holds versus where pragmatism is needed.
answer: |-
  Here's the tiered breakdown of the six challenges to Good's theorem's "free information is non-negative value" maxim, with key clauses identified, followed by the survivability score:

  **Tier 1: Genuinely kills the maxim** (Violates core assumptions)  
  - **(a) Leaky agents**: Breaks the *private belief update* assumption; information revelation harms utility by enabling external exploitation.  
  - **(b) Signal-in-utility**: Violates *state/action-dependent utility*; the signal itself directly impacts utility, not just through beliefs.  
  - **(c) Ambiguity**: Contradicts the *single prior* requirement; information can worsen the worst-case scenario under max-min preferences.  
  - **(e) Successor drift**: Undermines *temporal consistency of utility*; future actions misaligned with current preferences degrade information's value.  

  **Tier 2: Exploits bounded rationality** (Theorem assumes optimal computation)  
  - **(d) Pedant's oracle**: Challenges *costless optimization*; truthful information's value is offset by computational burdens in decision-making.  

  **Tier 3: Not a threat if updating correctly** (Issue is agent irrationality)  
  - **(f) The yes-channel**: Only harms agents with *flawed Bayesian updating*; rational agents disregard information known to be uninformative.  

  **Survivability score for "when information is free, take it": 6/10**  
  The maxim remains robust in standard rational-agent settings (absorbing Tier 3 and partially Tier 2), but Tier 1 scenarios—common in real-world commitments, emotional costs, ambiguity, and preference shifts—severely limit its blanket applicability.
