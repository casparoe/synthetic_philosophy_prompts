  ### Session Design: The Absentminded Driver

  #### Core Mechanics & Setup
  - **Participants**: 14, split into 4 groups (3-4 per table). One volunteer acts as "Driver" per trip; others observe.  
  - **Materials**: 
    - Poker chips (white=0, blue=4, red=1), two dice, four envelopes, index cards, cardboard screen. 
    - Envelopes labeled "Intersection" (indistinguishable). Lamp cards: "LIT" or "DARK" for variants.  
  - **Ignorance Enforcement**: Driver sits behind cardboard screen. Envelopes shuffled face-down by a participant. Driver sees only "Intersection" cards; no knowledge of sequence or history.  
  - **Randomization**: Driver rolls die at each intersection. Pre-commitment rules (e.g., "continue on 1–4") are set before trips.  
  - **Payoffs**: Chips paid immediately on exit/pass. One "banker" (participant) tallies group chips publicly.  

  ---

  ### Activity Flow  
  #### Part 1: Basic Condition (No Lamp)  
  1. **Pre-Commitment Strategy (15 min)**  
     - **Driver Rule**: "Continue on die roll 1–4 (p=2/3), else exit."  
     - **Trips**: 9 trips (enough to show 4/3 ≈ 1.33 average).  
       - *Per Trip*:  
         1. Facilitator places two shuffled envelopes.  
         2. Driver opens first envelope (sees "Intersection"), rolls die, decides.  
          - **Exit**: Gets 0 (white chip). Trip ends.  
          - **Continue**: Envelope removed. Driver given second envelope, repeats. If exit: 4 (blue); if continue: 1 (red).  
       - *Example*: Continue at first → Open second envelope → Exit = 4 chips.  
     - **Tally**: Banker records payoffs. Expected total: ~12 chips (12/9 = 1.33/trip).  

  2. **At-Intersection Strategy (10 min)**  
     - **Driver Rule**: "Always exit immediately."  
     - **Trips**: 9 trips.  
       - Driver exits at first envelope every time → Gets 0.  
     - **Tally**: Total 0 chips.  
     - **Contrast**: Group sees pre-commitment (avg 1.33) beats deviation (avg 0).  

  #### Part 2: Lamp Variant (Partial Recall)  
  - **Lamp Setup**: Facilitator preloads envelopes with lamp cards:  
    - *Reliability 0.8*: First intersection: P(LIT)=0.2 (die roll 1=lit). Second: P(LIT)=0.8 (roll 1–5=lit).  
    - *Reliability 0.6*: First: P(LIT)=0.4 (roll 1–2=lit). Second: P(LIT)=0.6 (roll 1–4=lit).  
  - **Best Rule**: "Exit if LIT, continue if DARK."  

  1. **Reliability 0.8 (15 min)**  
     - **Trips**: 18 trips.  
       - Driver sees lamp, follows rule.  
       - *Payoffs*:  
         - LIT at first (0) + DARK at first → LIT at second (4) or DARK at second (1).  
       - **Expected**: 2.72/trip (e.g., ~49 chips total).  
       - *Self-Endorsement Check*: After trips, ask: "At a LIT intersection, does exiting feel right?" (Yes, per arithmetic).  

  2. **Reliability 0.6 (15 min)**  
     - **Trips**: 18 trips. Same rule.  
       - **Expected**: 1.68/trip (e.g., ~30 chips total).  
       - **Contrast**: Rule still optimal, but at LIT intersections: Continuing (1.95) > Exiting (1.89).  
     - **Discovery Prompt**: "Does exiting at LIT intersections still feel optimal here? Why/why not?"  

  ---

  ### Debrief (15 min)  
  - **Map Moments to Structure**:  
    - Pre-commitment vs. at-intersection: "At the start, committing to randomness (2/3) wins. At the intersection, exiting seems better (8/5) but fails. Why?" → **Sampling bias**: 3/5 of visits are first exit (where exiting pays 0), but trips (not visits) determine success.  
    - Lamp variants: "At 0.8 reliability, the rule 'works' at every intersection. At 0.6, it works globally but *not* locally at LIT intersections. The lamp’s value isn’t just info—it’s whether it aligns local/global incentives."  
  - **Handling Comments**:  
    - "Use a notepad!": "Great idea! But here, we’re studying choice under *imperfect recall*—no notepads allowed."  
    - "Count facilitator’s cues!": "Clever! But the driver can’t count—assume total disorientation."  
  - **Contamination Prevention**: Run basic condition first (simpler). Reset with new Driver/envelopes for lamp variants.  

  ---

  ### Honest Notes (Facilitator-Only)  
  - **Cannot Reproduce**:  
    - True forgetting (participants remember).  
    - Beliefs at intersections (must be supplied via rules).  
    - Whether at-intersection reasoning is "valid" (session shows tension; philosophy unresolved).  
  - **Facilitator Must Supply**:  
    - Belief probabilities (e.g., 3/5 for first exit).  
    - Randomization for lamps.  
    - Rule enforcement.  

  ---

  ### Predictable Failures & Fixes  
  1. **Failure**: Driver "peeks" at envelope order.  
     - **Why**: Human curiosity.  
     - **Fix**: Shuffle envelopes behind screen; use identical sleeves.  

  2. **Failure**: Group argues over arithmetic.  
     - **Why**: Non-math members disengage.  
     - **Fix**: Redirect: "Let chips decide—what’s our *observed* average?"  

  3. **Failure**: Lamp probabilities misunderstood.  
     - **Why**: Dice approximations (e.g., 0.8 ≈ 5/6).  
     - **Fix**: Pre-roll and record lamp states for reliability 0.6/0.8; use as lookup.  

  4. **Failure**: One table dominates.  
     - **Why**: Engineers/actuary jump ahead.  
     - **Fix**: Assign roles: "Banker" (tally), "Shuffler" (envelopes), "Driver" (decider). Rotate.  

  ---

  ### Closing Paragraph  
  > "This isn’t just about exits—it’s about acting on partial knowledge of your past. Imagine taking daily medication: a double dose is dangerous, but you can’t fully recall if you took it. Do you skip (risk undertreatment) or take it (risk overdose)? Like the driver, your best pre-commitment (e.g., pill organizer) might clash with your moment-by-moment judgment. The lamp? Maybe a faint memory or a pill tracker app. But as we saw, even with clues, local and global incentives can split—and that’s where philosophy meets life."  

