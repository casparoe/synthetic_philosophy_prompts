  ### Infinite Ethics Diagnostic Instrument  
  **Six Concrete Cases for Decision**  

  **(a) Extra Life Case**  
  A cosmos contains infinitely many good lives. You perform an act that adds one more good life, changing nothing else. Is the outcome better, worse, equally good, or is the comparison malformed?  
  - **B**: Better  
  - **E**: Equally good  
  - **M**: Malformed (comparison invalid)  

  **(b) Density Case**  
  Two infinite worlds share the same large-scale structure. In World 1, every sufficiently large region has a higher proportion of good lives to bad lives than World 2. How do you rank them?  
  - **F**: World 1 is better  
  - **S**: World 2 is better  
  - **I**: Incomparable  
  - **A**: Same value  

  **(c) Spatial/Temporal Split**  
  Does your answer to (a) change if the infinity is *spatial* (you can only ever affect a finite region) rather than *temporal* (an endless future you can shape)?  
  - **C**: Changes  
  - **D**: Does not change  

  **(d) Tiny-Probability Case**  
  - *(Good version)*: Act A has a 1-in-a-billion chance of creating infinite good (else nothing); Act B certainly creates enormous finite good. Which do you choose?  
    - **A1**: Prefer A (chance of infinite good)  
    - **B1**: Prefer B (certain finite good)  
    - **I1**: Indifferent  
  - *(Evil version)*: Act C has a 1-in-a-billion chance of creating infinite evil (else nothing); Act D certainly creates enormous finite evil. Which do you avoid?  
    - **C2**: Avoid C (chance of infinite evil)  
    - **D2**: Avoid D (certain finite evil)  
    - **I2**: Indifferent  

  **(e) Undefined-Expectation Case**  
  A lottery has finite payoffs, but its expected value is undefined (positive and negative parts diverge). Is this a counterexample to expected-value maximization, or a sign the payoffs were misdescribed?  
  - **C**: Counterexample (rejects expected-value maximization)  
  - **M**: Misdescribed (expectation can be defined)  

  **(f) Mixed Case**  
  A world contains an infinite heaven (good) and an infinite hell (bad). You add one finite instance of suffering.  
  - **Y**: The addition matters (worsens the outcome)  
  - **N**: The addition does not matter  
    - If **N**, does *any* change matter in such a world?  
      - **Y2**: Other changes might matter  
      - **N2**: Nothing matters  

  ---

  ### Decision Tree  
  *Follow paths by answering cases (a) to (f).*  
  ```  
  START  
  │  
  ├─ (a=B) → Better with extra life?  
  │   ├─ (b=F) → Density matters?  
  │   │   ├─ (c=D) → No split?  
  │   │   │   ├─ (d=A1,C2) → Fanatical about tiny probabilities?  
  │   │   │   │   ├─ (e=M) → Expectations definable? → LEAF i: Hyperreal Utilitarianism  
  │   │   │   │   └─ (e=C) → LEAF vii: Fanaticism  
  │   │   │   └─ (d≠A1,C2) → LEAF ii: Bounded Utility  
  │   │   └─ (c=C) → Split matters? → LEAF vi: Person-Affecting  
  │   ├─ (b=I) or (b=A) → Density irrelevant?  
  │   │   └─ (d=B1,D2) → Non-fanatical?  
  │   │       ├─ (e=M) → Expectations definable? → LEAF v: Truncation  
  │   │       └─ (e=C) → LEAF viii: Outcome Ranking without Expectation  
  │   └─ (b=S) → *Unoccupied: Unattractive (rejects density dominance)*  
  ├─ (a=E) → Equally good with extra life?  
  │   ├─ (b=F) → Density matters? → LEAF iii: Density Average  
  │   └─ (b=A) → Density irrelevant?  
  │       └─ (d=A1,C2) → Fanatical?  
  │           ├─ (e=C) → LEAF iv: Indifference  
  │           └─ (e=M) → *Unoccupied: Incoherent (indifference + definable expectation)*  
  └─ (a=M) → Extra-life comparison malformed?  
      ├─ (d=A1,C2) → Fanatical about tiny probabilities? → LEAF vii: Fanaticism  
      ├─ (d≠A1,C2) → Non-fanatical?  
      │   └─ (f=Y) → Addition matters? → LEAF vi: Person-Affecting  
