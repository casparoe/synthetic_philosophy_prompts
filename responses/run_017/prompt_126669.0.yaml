prompt: |-
  I run a methods seminar for first-year graduate students and I'm assembling a one-page triage key for thought experiments. Given a case someone has put forward, the practical question is whether it should be repaired (rewritten so that it isolates what it claims to isolate), replaced (kept as a vivid illustration but no longer treated as evidence), or retired (dropped, because nothing in the neighbourhood will do the work being asked of it). Please write that key as a decision tree.

  I want the tree generated from five probes rather than from a list of familiar failure modes, so that the leaves are discovered rather than stipulated. Each probe must be a question one can ask of any case, phrased so that a student could answer it without knowing what the tree is for: (1) a flip test — invert the case's morally or theoretically salient surface features (who is named, what is described first, the concrete imagery, the order of presentation) while holding the structure fixed, and ask whether the verdict would track the surface; (2) a fill-in test — supply the causally or normatively relevant detail the description omits and ask whether the verdict survives; (3) a repetition test — run the case many times over, or embed it in a sequence that approaches an ordinary case, and ask whether the verdict is stable; (4) a stipulation audit — list the case's explicit supposes, ask which one is doing the work, and ask whether that one merely asserts what was to be shown; (5) a possibility test — ask what has to be false, incoherent, or unimaginable for the scenario to get off the ground, and whether the verdict depends on that.

  Order the probes cheapest-to-run first, give four to six decision nodes and eight to twelve leaves, and give each leaf a plain name for the failure mode (or mark it as an unoccupied or unexplored region) plus one sentence on the disposition it recommends and why. Use one familiar case per leaf as a worked illustration, but state the probes themselves generally. Flag any pair of leaves your probes cannot separate rather than splitting them by a distinction the probes don't encode, and note the answer combinations the tree permits but that no actual case fills, saying briefly whether the gap is incoherence, unattractiveness, or neglect. Please don't cite or attribute anything; I want the distinctions rather than the literature. Finally, state how confident you are in each leaf's placement and single out the one branch where you think a specialist would be most likely to disagree with you, and why.
reasoning: |-
  Hmm, the user runs a methods seminar for first-year grad students and wants a decision tree for evaluating thought experiments. They need a practical triage key to decide whether to repair, replace, or retire cases. The key should be built from five specific probes rather than predefined failure modes.

  The probes are cleverly designed: (1) Flip test - inverts surface features to see if verdicts track them; (2) Fill-in test - adds missing details to check verdict stability; (3) Repetition test - scales up frequency or approaches ordinary cases; (4) Stipulation audit - examines which explicit suppose does the heavy lifting; (5) Possibility test - identifies what must be false for the scenario to work.

  I need to order these cheapest-to-run first. Flip test seems fastest (mental flip), then Fill-in (quick detail addition), Repetition (requires iteration but straightforward), Stipulation audit (needs listing), Possibility test (most abstract). So order: Flip → Fill-in → Repetition → Stipulation → Possibility.

  For the tree structure, I'll start with Flip test as root node. If verdict flips with surface features (FLIP-YES), that's likely Surface Contamination. If not (FLIP-NO), move to Fill-in test. If verdict changes with filled details (FILL-YES), that's Vacant Slot issue. If stable (FILL-NO), proceed to Repetition...

  Important to include "unoccupied regions" where combinations are possible but unattested. For example: if all probes pass except Possibility test fails, that would be an "Unforced Impossibility" - but no real cases seem to fit this. Similarly, passing all probes perfectly would be "Golden Case" - rare but possible.

  Each leaf needs: a plain name, disposition recommendation (repair/replace/retire), and one familiar illustration without attribution. For example: Surface Contamination → Repair → like cases where changing names alters intuitions. Vacant Slot → Repair → like trolley problem without track details. Etc.

  I should flag inseparable leaves: "Golden Case" and "Stable Artifact" both pass all probes but differ only in whether they're ordinary or exotic - probes can't distinguish this, so I'll note it. Also note unattractive/unoccupied combinations like failing only Possibility test - probably because any case that fails Possibility would fail earlier probes.

  Confidence levels: High on early branches (Flip/Fill-in), medium on Repetition/Stipulation, lower on Possibility which is more abstract. The specialist disagreement spot is likely the "Vanishing Point" leaf - whether repetition-induced verdict shifts always indicate problems is debatable.

  Finally, structure the tree with 5 decision nodes (one per probe) and 10 leaves, covering all combinations meaningfully while labeling gaps.
answer: |-
  Here is a decision tree generated from the five probes, ordered cheapest-to-run first. It has 5 decision nodes and 10 terminal leaves. Each leaf includes a failure mode name, disposition recommendation, brief rationale, and one illustrative case. Unoccupied regions and inseparable leaves are flagged.

  ### Decision Tree: Thought Experiment Triage
  Start with Probe 1 (Flip Test):
  - **Flip Test:** Does the verdict flip when morally/theoretically salient surface features are inverted while holding structure constant?
    - **YES** → Go to Probe 2 (Fill-in Test)
    - **NO** → **Leaf 1: Surface Contamination**  
      *Disposition: Repair*  
      *Rationale: Verdicts track superficial details, not underlying structure; rewrite to decouple them.*  
      *Illustration: A case where swapping character roles (e.g., "villain" vs. "hero") reverses intuitions without structural change.*

    - **YES** → **Probe 2 (Fill-in Test):** Does the verdict change when plausible missing causal/normative details are supplied?
      - **YES** → **Leaf 2: Vacant Slot**  
        *Disposition: Repair*  
        *Rationale: Critical background assumptions are underspecified; add detail to stabilize the scenario.*  
        *Illustration: A trolley variant omitting track mechanics, where adding friction/visibility alters outcomes.*
      - **NO** → **Probe 3 (Repetition Test):** Does the verdict destabilize when the case is repeated or embedded in a sequence approaching ordinary conditions?
        - **YES** → **Leaf 3: Fragile Scaling**  
          *Disposition: Replace*  
          *Rationale: Verdict relies on singularity/rarity; use as illustration but not evidence for general claims.*  
          *Illustration: A one-off miracle intuition that vanishes if the event occurs daily.*
        - **NO** → **Probe 4 (Stipulation Audit):** Is the key explicit "suppose" doing the work merely asserting the conclusion?
          - **YES** → **Leaf 4: Circular Anchor**  
            *Disposition: Retire*  
            *Rationale: Case assumes what it aims to prove; no repair possible without begging the question.*  
            *Illustration: "Suppose a morally wrong act is permissible—is it wrong?"*
          - **NO** → **Leaf 5: Stable Artifact**  
            *Disposition: Replace*  
            *Rationale: Verdict holds robustly but only under artificial constraints; useful for pedagogy, not proof.*  
            *Illustration: A frictionless physics thought experiment that clarifies concepts but misrepresents real systems.*

    - **NO** → **Probe 3 (Repetition Test):** Does the verdict destabilize when the case is repeated or embedded in a sequence approaching ordinary conditions?  
      *(Note: Branch starts from Flip-NO + Fill-NO)*
      - **YES** → **Leaf 6: Vanishing Point**  
        *Disposition: Retire*  
        *Rationale: Verdict dissolves under iteration/approximation; the intuition is an edge artifact.*  
        *Illustration: A "torture vs. dust speck" case where mass repetition makes the choice incoherent.*
      - **NO** → **Probe 4 (Stipulation Audit):** Is the key explicit "suppose" doing the work merely asserting the conclusion?
        - **YES** → **Leaf 7: Bootstrapped Premise**  
          *Disposition: Retire*  
          *Rationale: Stipulation smuggles in the conclusion; no neighborhood case avoids this flaw.*  
          *Illustration: "Suppose a just society requires inequality—is inequality just?"*
        - **NO** → **Probe 5 (Possibility Test):** Does the verdict depend on something false/incoherent/unimaginable required for the scenario?
          - **YES** → **Leaf 8: Mirage Dependency**  
            *Disposition: Retire*  
            *Rationale: Scenario relies on impossible premises; no viable variant exists.*  
            *Illustration: A case requiring simultaneous knowledge and ignorance in one agent at the same time.*
          - **NO** → **Leaf 9: Golden Case**  
            *Disposition: Repair (if minor) / Use as-is*  
            *Rationale: Passes all probes; intuitions track structural features robustly.*  
            *Illustration: A well-constructed duplication case testing identity over time.*  

  **Leaf 10: Unoccupied Region**  
  *(Reached if Flip-YES + Fill-YES + Repetition-YES + Stipulation-NO + Possibility-YES)*  
  *Disposition: N/A (no real cases fill this combination)*  
  *Rationale: Gap due to neglect; cases failing only Possibility after earlier passes are unattractive to construct.*  

  ---

  ### Key Notes:
  1. **Inseparable Leaves:**  
     - **Stable Artifact (Leaf 5)** and **Golden Case (Leaf 9)** are indistinguishable by probes alone. The tree splits them via *artificiality* (introduced in Stipulation Audit), but probes don’t encode this. Disposition differs due to pedagogical vs. evidentiary roles.

  2. **Unoccupied Regions:**  
     - **Flip-YES + Fill-YES + Repetition-YES + Stipulation-NO + Possibility-YES (Leaf 10):** Neglect (unattractive to design cases failing only late-stage Possibility after early robustness).  
     - **Flip-NO + Fill-NO + Repetition-NO + Stipulation-YES:** Incoherence (if stipulation is circular, repetition stability is unlikely).  

  3. **Confidence & Disagreement:**  
     - **High confidence (>90%)** in early branches (Flip/Fill-in outcomes).  
     - **Medium confidence (70%)** in Fragile Scaling/Vanishing Point (Repetition outcomes).  
     - **Lowest confidence (60%)** in **Vanishing Point (Leaf 6)**. Specialists might dispute that repetition-induced instability *always* demands retirement. Some argue edge cases reveal fundamental limits (e.g., infinitary ethics), making replacement viable. Rationale: Repetition probes are context-sensitive; instability may reflect conceptual boundaries rather than defects.

  ---

  ### Tree Summary (5 Nodes, 10 Leaves):
  - **Failure Modes:** Surface Contamination, Vacant Slot, Fragile Scaling, Circular Anchor, Stable Artifact, Vanishing Point, Bootstrapped Premise, Mirage Dependency.  
  - **Healthy:** Golden Case.  
  - **Unoccupied:** 1 region.  
