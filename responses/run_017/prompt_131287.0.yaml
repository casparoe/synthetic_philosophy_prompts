  I should assess which of their questions are most fundamental. Tail dominance seems upstream because if catastrophic tails invalidate average-case, then other approaches like seatbelts or bounded adversaries must address that. Seatbelt guarantees could be a practical middle ground but might rely on defining what’s monitorable. Deployment distribution politics is critical but might be more about implementation than foundational theory. Bounded adversaries introduce realism but depend on understanding threat models.

  Missing questions might include how to define what constitutes a catastrophe (ontology) or how to make worst-case guarantees computationally feasible. The ontology question is key because without defining what "catastrophic" means, assessing tails is impossible. That’s probably the biggest gap in their framework.

