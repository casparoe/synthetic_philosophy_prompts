  | 3 | **Can we design systems with runtime "seatbelts": fast monitors ensuring graceful degradation (not silence) when novel threats exceed a verifiable safety core?** | 4 (Bounded adversaries - defines what's monitorable), Deployment politics (defines scope of "expected" threats) | maybe (Requires understanding runtime monitoring limits; no compute helps avoid over-engineering) | moderate (Some work on "fallback strategies," but not unified) | Builders: Implement verified safe cores + anomaly detectors. Regulators: Mandate degradation modes, not just black-box tests. | **Up:** Breakthrough in low-latency monitoring (e.g., new hardware). **Down:** Proof that monitoring is always bypassable trivially. |
