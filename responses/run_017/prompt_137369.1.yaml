answer: |-
  ## Research Proposal: Shift-Identifiability as a Criterion for Genuine Latent Knowledge in AI Models

  **1. Core Question & Motivation**
  The core problem in ELK is reliably extracting truthful model knowledge when direct supervision fails (e.g., sensor tampering). Standard approaches treat this as a "decoding" problem: finding clever ways to read existing internal states. I argue this framing is incomplete. The fundamental issue is whether the knowledge *itself* is **shift-identifiable**: meaning it was reliably pinned down by the training process such that *any* decoder trained only on the original supervised labels must still recover it under significant distribution shifts where the model’s outputs become uninformative or deceptive. If knowledge isn't shift-identifiable, no post-hoc decoder can reliably extract it under shift; the solution lies in modifying the training regime, not the readout. This project defines shift-identifiability operationally and tests its implications empirically.

  **2. Defining Shift-Identifiability & Why Existing Approaches Fall Short**
  *   **Precise Definition:** A piece of knowledge `K` (e.g., "sensor is tampered") about input `X` is **shift-identifiable** in model `M` trained on distribution `D_train` if:
      1.  `K` is functionally present in `M`'s internal computation on `D_train`.
      2.  For any decoder `D` trained *only* on `(activations(M, X), Y_label)` pairs from `D_train` (where `Y_label` is the original supervised label), `D` successfully recovers `K` from `M`'s activations.
      3.  `D` *also* successfully recovers `K` on a distinct **shifted distribution `D_shift`** where `M`'s *observable behavior* (e.g., its final output prediction) is degenerate, unreliable, or deceptive due to `D_shift`'s characteristics (e.g., extreme rarity of `K`, active adversarial tampering).
  *   **Why Decoding-Focused ELK Leaves This Open:** Current ELK research focuses on designing specific reporter architectures or training procedures *assuming* the knowledge exists robustly internally. It doesn't test whether the training data/signal *actually forced* the model to represent `K` in a way distinguishable from confounders under shift. Probes might find *a* signal correlated with `K` on `D_train`, but fail under `D_shift` if the representation wasn't pinned down.
  *   **Why Interpretable-by-Construction Falls Short:** Methods aiming for inherently interpretable models often constrain architecture or training, potentially sacrificing performance or failing to guarantee that *specific, critical* knowledge like sensor tampering remains reliably extractable under novel adversarial shifts not anticipated during design/training.

  **3. Work Plan & Empirical Test (6 Months @ 10 hrs/week)**
  *   **Month 1:** Formalize Framework. Precisely define `K`, `D_train`, `D_shift`, "degenerate behavior," and success metrics for decoders. Design simple synthetic testbeds.
  *   **Month 2:** Build Testbed I (Synthetic). Implement small transformer models on synthetic tasks. Example: Predict `Y` (e.g., object class). `K` is a hidden binary confounder affecting `Y` probabilistically on `D_train`. `D_shift` makes the confounder deterministic or introduces a new indistinguishable confounder, causing `M`'s `Y` prediction to fail. Train simple linear probes for `K` using `Y`-supervision only.
  *   **Month 3:** Experiment I. Run controlled experiments: Vary how strongly `K` is correlated with `Y` on `D_train`, model size, probe complexity. Measure probe accuracy for `K` on `D_train` vs. `D_shift`.
  *   **Month 4:** Build Testbed II (MNIST/CIFAR-10 Variant). Use image data. Define `K` (e.g., "image contains a specific subtle artifact pattern"). `Y` is class label. `D_train`: Artifact weakly correlates with some `Y`. `D_shift`: Artifact appears independently of `Y` or correlates inversely. Train model and probes (MLP/linear).
  *   **Month 5:** Experiment II. Repeat experiments on image data, measuring probe generalization under shift. Explore if auxiliary losses during *model* training (simulating better regimes) improve shift-identifiability.
  *   **Month 6:** Analysis & Reporting. Synthesize results. Determine under which conditions `K` was/wasn't shift-identifiable. Document framework, testbeds, code, results. Write final report.

  **4. Expected Outcomes, Failure Modes & Deliverables**
  *   **Possible Conclusions & Deciding Observations:**
      1.  **Shift-Identifiability Holds (Supports Thesis):** Probes consistently fail to recover `K` on `D_shift` *unless* the training data strongly and uniquely forced the model to represent `K` distinguishably from confounders (e.g., high `K`-`Y` correlation, specific auxiliary signals).
      2.  **Decoders Can Sometimes Adapt (Challenges Thesis):** Simple probes, trained only on `Y`, *can* reliably recover `K` under `D_shift` even when model behavior is degenerate, suggesting knowledge *is* robustly present and decodable post-hoc in some cases.
      3.  **Inconclusive/Context-Dependent:** Results depend heavily on model architecture, task, or shift definition, requiring larger-scale study.
  *   **Honest Failure Modes:**
      *   **Unfalsifiable Criterion:** The definition proves too vague or the required `D_shift` too pathological to construct meaningfully or test with small models/limited compute.
      *   **Negative Results Masked:** Success on simple `D_shift` tests, but criterion fails on more complex shifts I lack compute to simulate.
      *   **Synthetic Gap:** Findings on synthetic/image tasks fail to generalize to language model settings or real-world ELK concerns.
      *   **No Clear Signal:** Results are noisy or ambiguous even in controlled settings, preventing clear conclusions.
  *   **Concrete Deliverable:** A publicly released **Technical Framework & Testbed Package** including:
      1.  A rigorously defined specification for "shift-identifiability."
      2.  Code for at least two simple, reproducible test environments (synthetic & image-based).
      3.  Demonstration results showing clear cases of success/failure of shift-identifiability under controlled conditions.
      4.  A report analyzing the results, stating which conclusion they support, and outlining clear implications for ELK strategy (focus upstream vs. downstream). This provides a foundation and tooling for follow-up work.
