  - **Question 2**: Can the framework distinguish between "succeeds because approximately rational" and "succeeds because optimised for legibility"?  
    - **Analysis**: In the intentional stance, the pattern is real if it compresses and predicts well. The origin of the pattern (whether by natural rationality or by artificial legibility training) is not part of the criterion. However, note that the intentional stance assumes rationality. If the agent is not rational but only legible, then the stance might break when the agent is placed in new situations (if the legibility training did not generalise).  
    - **Framework Resources**: The framework does not inherently distinguish the two because both lead to a pattern that is real (by compression). However, we can test the robustness: if the pattern generalises to new contexts (out-of-distribution), then it is more likely to be real in a deeper sense.  
    - **Defect or Empty Distinction?**: The distinction might be empty from the real-patterns perspective because both cases produce a real pattern. But the distinction matters for explanatory depth: a system that is actually rational (i.e., its behaviour is generated by a rational process) might be more robust than one that is merely legible. Dennett's account does not require the system to be internally rational; it only requires the pattern to hold. So the distinction is not empty, but it is not captured by the real-patterns criterion alone. We need additional tests (like generalisation) to see if the pattern is deep or shallow.

  **Residue Report**:  
  We now discuss what translated cleanly, with distortion, or not at all.

  1. **Aboutness (Intentionality)**:  
     - **Translation Attempt**: In ML, we can model aboutness as the relationship between an internal representation (latent state) and the external state it represents (via a learned mapping).  
