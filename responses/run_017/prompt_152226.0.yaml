  2. **Normativity of Rationality**:  
     - **Translation**: Rationality is modelled as maximising expected utility. In IRL, we infer the utility function that makes the behaviour optimal.  
     - **Residue**: Rationality has a normative dimension (the agent *should* act rationally) that is not captured by the descriptive model. In ML, we have no "should" — only what the agent does.  
     - **Verdict**: This residue might show Dennett's claim to be less determinate. He might argue that the normativity is just the predictive success of the pattern.

  3. **Predicting vs. Explaining**:  
     - **Translation**: In ML, we often conflate prediction and explanation. A good predictive model (e.g., a world model) might be seen as explanatory.  
     - **Residue**: Dennett's stances are about prediction, but he also talks about explanation (e.g., the intentional stance explains why the system did what it did). In ML, we don't have a formal account of explanation beyond prediction or compression.  
     - **Verdict**: The residue indicts the ML framework because we lack a theory of explanation that goes beyond predictive accuracy (e.g., counterfactuals, interventions).

  4. **Teleology in Design Stance**:  
     - **Translation**: We can model teleology as an objective function in RL. The design stance is then using that objective to predict.  
     - **Residue**: The design stance implies a purpose that exists independently of the current optimisation (e.g., a broken thermostat still has the same purpose). In ML, if we retrain the agent, the objective might change.  
     - **Verdict**: The residue might be in the original claim — Dennett's design stance is about the intended function, which is historical and not necessarily current. Our ML models don't naturally capture historical intent.

  5. **Stance as Adopted vs. Found**:  
     - **Translation**: In ML, we can train a model to adopt a stance (e.g., a ToM module that uses the intentional stance).  
