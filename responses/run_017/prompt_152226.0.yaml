    - **Flag**: The original intentional stance does not specify the inference method (amortised vs. iterative). We choose amortised inference because it fits the "stance" as a habitual, quick method. Also, the "fact of the matter" claim is that the best compression (in terms of code length and predictive power) is real, even if the underlying physics does not have explicit belief states.

