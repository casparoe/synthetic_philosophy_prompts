prompt: |-
  hey — I'm on a small team building a long-term memory system for an LLM-based coding assistant, and I need someone to audit the analogy we keep leaning on, not to tell me whether the thesis is true.

  Setup: there's a persistent store of notes (user preferences, decisions we made last week, "don't touch this module"). The notes are written by the assistant itself. A separate embedding-based retriever surfaces them, but stochastically — a note is there and usually comes back, not always. And the store is shared: other agents on the team can write into it.

  The justification our team reaches for is the extended mind thesis in its prosthetic form: external memory is to a mind what a prosthetic limb (or the blind person's cane) is to a body. It's outside the skin, it's kit, but it isn't something you inspect and then use — it's part of you; the right unit of description is the coupled system, agent plus store. Then three conclusions get drawn from it:

  1. evaluate and credit the whole agent+store system, not the weights or the context window
  2. it doesn't matter that nothing is currently in the context window, because the information is available to the system in roughly the way your own memories are available to you
  3. if the store gets corrupted, or another agent silently edits a note, that isn't the agent being influenced by its environment — it's closer to brain damage, or to someone rewriting your diary

  What I want:

  - the mapping laid out explicitly, a correspondence table is fine: what plays the body, the limb, the amputation, the fitting, ownership, and the body schema updating to incorporate a tool (does anything in the target even correspond to that last one?)
  - where the mapping breaks, and — more usefully — which of those breaks actually matter for conclusions 1 through 3 and which are noise you can wave through
  - what the analogy quietly imports that our system doesn't have: physical coupling, single-user, reliable availability, being under the agent's own motor control, being deliberately fitted rather than accreted... and for each, whether the usual patches people reach for in this literature (trust, reliability, automatic endorsement, easy accessibility, durable coupling) actually fix it or just rename the problem
  - whether prosthesis is even the best analogy going. My colleague prefers a memory-hierarchy one — registers/cache/RAM/disk — where the CPU doesn't decide to fetch, the memory system just is the machine's memory, and retrieval is done by the architecture rather than by the agent. Give me that mapping too if you think it carries more, or a different one if neither does.

  Two bits I'd like you to chew on specifically, because I dont think either analogy handles them: (a) the notes are self-authored, so their content isn't "non-derived" in the way a handwritten notebook's is — does self-written external content still get to be part of the system, or does that collapse into just being a longer context window; (b) the store is shared and the retrieval is probabilistic, so the resource is partly someone else's and only sometimes there — does that break the ownership and reliability conditions in a way no analogy patches, or is it just a weaker version of the same case?

  No reading lists or citations please, and don't give me abstract pros and cons of the thesis — keep it keyed to what the prosthetic picture can and can't carry. End with a last line stating your verdict on whether the analogy carries conclusions 1-3, in this form: Verdict: survives / partially survives / collapses
reasoning: |-
  Okay, let me tackle this user's request step by step. They're building a long-term memory system for an LLM coding assistant and want an audit of their "prosthetic extended mind" analogy. The core question is whether this analogy validly supports three conclusions about evaluating the agent+store system as a unit, treating absent memories like biological recall, and interpreting store corruption as "brain damage."

  First, I need to map the prosthetic analogy components to their system:
  - Body = LLM weights/architecture 
  - Limb = External note store
  - Amputation = Store disconnection/corruption
  - Fitting = Initial store setup
  - Body schema update = Adaptation to store access patterns
  - Ownership = Exclusive control (problematic here)

  The key breaks in the analogy jump out immediately: 
  1) The store isn't physically coupled - retrieval is stochastic and requires explicit queries
  2) Multiple authors violate single-ownership - it's more like shared prosthetic 
  3) Self-authored notes create circularity - is the system recalling or generating?
  4) No subconscious integration - every access is deliberate query

  Now evaluating each conclusion:
  Conclusion 1 (evaluate whole system) survives weakly because the store is functionally necessary, but shared authorship complicates credit assignment. 

  Conclusion 2 (memory availability like biological recall) collapses - probabilistic retrieval and lack of subconscious integration means "available" differs fundamentally from human memory. The CPU/memory hierarchy analogy fits better here.

  Conclusion 3 (corruption as brain damage) partially survives for user-specific notes if ownership is clear, but shared edits are more like environmental interference. The diary rewrite comparison only works for personal notes.

  On the two specific pain points:
  - Self-authored notes risk collapsing into long context if not truly persistent, but the analogy holds if notes stabilize and become "read-only" facts
  - Shared store breaks ownership - it's like multiple people using the same prosthetic limb. Reliability issues compound this.

  Alternative analogy assessment:
  The CPU/memory hierarchy handles retrieval mechanics better but ignores self-authorship. A "shared company knowledge base" might be most honest but less theoretically exciting.

  Final verdict balances the conclusions: Conclusion 1 survives with caveats, 2 collapses, 3 partially survives. Overall analogy partially survives but overclaims on memory equivalence. The verdict should reflect this mixed outcome while acknowledging where the analogy remains useful for design philosophy.
answer: |-
  Here's an explicit audit of the prosthetic extended mind analogy for your system, keyed to your requirements:

  ### Correspondence Table (Prosthetic Analogy)
  | **Prosthetic Concept**      | **System Component**                     | **Break Severity** |
  |-----------------------------|------------------------------------------|-------------------|
  | Body                        | Core LLM (weights/architecture)          | Low               |
  | Limb/Prosthesis             | External note store                      | **High**          |
  | Amputation                  | Store disconnection/corruption           | Medium            |
  | Fitting                     | Initial store setup/retriever tuning     | **High**          |
  | Ownership                   | Exclusive user/agent control             | **Critical**      |
  | Body Schema Update          | Adaptation to retrieval patterns         | **Critical**      |

  ### Where the Mapping Breaks & Impact on Conclusions
  1. **Ownership Break (Critical)**  
     - *Analogy expects:* Single user control.  
     - *Reality:* Shared write access + stochastic retrieval.  
     - **Impact:**  
       - Conclusion 1 (*evaluate whole system*): Survives weakly (store is functionally necessary).  
       - Conclusion 3 (*corruption = brain damage*): **Collapses for shared edits** (edits by others = sabotage, not organic failure).  
       - **Patch attempt:** "Trust/reliability" fails—shared access violates "single agent" coupling.

  2. **Body Schema Update Absent (Critical)**  
     - *Analogy expects:* Unconscious tool integration (e.g., prosthetic sensation).  
     - *Reality:* No LLM fine-tuning/weight updates based on store usage. Retrieval is explicit "fetch".  
     - **Impact:**  
       - Conclusion 2 (*"available like memory"*): **Collapses**. Context-less info isn't "subconsciously" integrated; it's queried RAM.  
       - **Patch attempt:** "Automatic endorsement" fails—LLM doesn’t inherently trust notes as "self".

  3. **Fitting ≠ Accretion (High)**  
     - *Analogy expects:* Deliberate calibration.  
     - *Reality:* Notes accreted ad-hoc; no "fitting" process.  
     - **Impact:**  
       - Conclusion 3 (*corruption = brain damage*): Survives partially (if user-specific notes corrupted).  
       - **Noise for Conclusions 1-2.**

  4. **Reliability Break (High)**  
     - *Analogy expects:* Prosthetic availability ≈ biological limb.  
     - *Reality:* Stochastic retrieval ("not always there").  
     - **Impact:**  
       - Conclusion 2 (*memory-like availability*): **Collapses**. Unreliability ≠ biological recall.  
       - **Patch attempt:** "Durability" irrelevant—probability breaks coupling.

  ### CPU/Memory Hierarchy Analogy Mapping
  | **Computer Concept** | **System Component**              | **Advantage Over Prosthetic**       |
  |----------------------|-----------------------------------|-------------------------------------|
  | CPU                  | Core LLM                          | Better handles stochastic retrieval |
  | Cache/RAM            | Context window                   | N/A                                 |
  | Disk/SSD             | Note store                       | **Explicitly models storage tiers** |
  | Memory Controller    | Retriever system                 | **Acknowledges non-agent retrieval** |
  | Bus                  | API calls to store               | N/A                                 |

  **Why it carries Conclusion 1 better:**  
  - Naturally evaluates system performance holistically (e.g., "disk latency" affects output).  
  **Why it fails Conclusion 2:**  
  - Disk data isn’t "like RAM" to the CPU—it’s explicitly external.  
  **Fixes Conclusion 3:**  
  - Corrupted disk = hardware failure (matches "brain damage" intent).  
  **Handles stochasticity:**  
  - Memory hierarchies tolerate cache misses.  

  ### Chewing Your Specific Bits
  **(a) Self-Authored Notes**  
  - **Risk:** If notes are generated/updated *during the same session* and retrieved contextually, it’s just a long context window with extra steps.  
  - **Saves the analogy if:** Notes stabilize into "read-only" reference material (e.g., "User prefers TypeScript"). Self-written ≠ non-derived if it becomes *fact* (like muscle memory in a prosthetic).  
  - **Collapse point:** If notes are context-dependent/transient, it’s not "memory" but agent-state.  

  **(b) Shared Store + Probabilistic Retrieval**  
  - **Ownership break:** Shared writes = multiple users grafting limbs onto one body. Reliability issues amplify this.  
  - **Analogy survival:** Only if:  
    - User-specific notes are *immutable* by others (ownership preserved).  
    - Retrieval probability is *predictable* (e.g., 95% hit rate ≠ "like biological memory" but ≈ "reliable tool").  
  - **Unpatchable break:** Silent edits by others sabotage the "single agent" premise. No analogy fixes this—it’s environmental interference.

  ### Verdict on Conclusions
  - **Conclusion 1 (evaluate agent+store):** **Partially survives**  
    *Why:* Holistic evaluation is valid *if* the store is critical infrastructure. Shared edits weaken credit assignment.  
  - **Conclusion 2 ("available like memory"):** **Collapses**  
    *Why:* Stochastic retrieval + no subconscious integration ≠ biological recall. Memory-hierarchy analogy rejects this.  
  - **Conclusion 3 (corruption = brain damage):** **Partially survives**  
    *Why:* Valid for user-owned note corruption. Shared edits break the metaphor (sabotage ≠ stroke).  

  **Overall Analogy Verdict: Partially survives**  
  **Best fit:** Use **prosthetic analogy for design philosophy** (treat store as core to system identity) but **CPU/memory for implementation** (retriever as hardware, not "self"). Drop Conclusion 2—it’s the weakest link.
