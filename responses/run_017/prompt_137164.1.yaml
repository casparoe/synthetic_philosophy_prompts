prompt: |-
  I teach aesthetics at a mid-sized state university, and a friend who runs a small documentary festival has cornered me into writing her something I can't quite finish. She programmes maybe forty films a year and about six to eight times a year one of them turns out to have a problem: the director was abusing the crew, or the subject's consent was obtained under false pretences, or the filmmaker is facing charges for something that has nothing to do with the film at all. She has no in-house counsel, the board has to sign off on anything that looks like a political statement, and she usually finds out forty-eight hours before the programme grid goes to print. So I can't give her an essay on autonomism vs. moralism; I need something her programming associate, who has a film-studies BA and no philosophy, can actually run in one sitting, at the end of which it hands her one of four dispositions: show it as planned, show it with context (a note in the programme, an on-stage caveat, a panel afterwards), show it only if some condition is met (fee renegotiated, proceeds redirected to a victim's fund, a content warning), or pull it.

  The bit where I keep getting stuck is that I think the whole thing is secretly two separate procedures stapled together, and I want her to be able to tell which one she's running. There's a question about whether the work is worse as art because of what the maker did — the sort of claim that seems true when the immorality is visible in the work itself and much less plausible when it isn't — and then there's a completely different question about what a festival ought to platform, which is about money, audiences, and who gets to speak, and could go either way even if the artwork is flawless. I want both tracks, with a signpost at the fork. Along the way the procedure has to handle some cases I've invented for it, partly because I think they break the tidy versions: the constitutive case, where the wrongdoing is inside the work — footage gotten by deceiving the person filmed, a sculpture using material taken from a community's burial ground — so that you cannot remove the taint without destroying the piece; the taint-value case, where the piece is partly interesting because a notorious person made it, so the badness is doing some of the aesthetic work and sanitising it would leave you with nothing; the collaborative case, a forty-person crew with one person's misconduct somewhere in it, where I can't even say whose work it is; the split-victim case, where one of the people harmed wants the film shown as testimony and another wants it buried; and the timing case, a conviction last year versus an artist dead for ninety years, where the money flows somewhere different in each. It also has to say what to do in the epistemic muddle that actually comes up most: an allegation reported by one outlet, no charges, artist denies it, audience has never heard of it — and honestly, an audience that hasn't heard of it is a different situation from one that has, and I don't think either is more fundamental.

  So: write me the procedure. Number the questions in the order she should ask them, say what counts as a sufficient answer to each, where it stops with a no, and — this matters most to me — where it has to stop and hand the decision to a person because the issue is one of values rather than facts, with an explicit note on who signs off at that point. Keep every distinction you think must survive the simplification and drop the ones that don't, but tell me what you dropped and why it was safe to drop. Then run it on three composites of mine, no real names: a vérité feature about a recovering addict, made by a director who was in a coercive relationship with its central subject, and the subject is alive and wants it screened; an animated short about grief by someone convicted of financial fraud against his own family, unrelated to the film; and a large installation I've saved for last, because she's already booked the venue and spent the insurance money on it, built by a sculptor from objects taken without permission from a community's burial site, and that community is asking for it to be destroyed rather than shown. If the procedure gives her an answer on that third one that she won't like, say so plainly rather than fudging it. Finally, tell me what the procedure cannot do — I assume it can't tell her whether a film is any good, and I suspect there's a deeper thing it can't do around cases where the audience's knowledge of the artist is what makes the work worth showing at all, but I'd like you to name it better than I just did.
reasoning: |-
  Okay, let me start by understanding what the user needs. They teach aesthetics and have been tasked with creating a decision procedure for a documentary festival director. The main challenge is balancing ethical concerns with practical decisions under tight deadlines. The user mentioned two separate tracks: one about the artwork's integrity and another about the festival's responsibilities. 

  First, I need to outline a step-by-step process that's simple enough for someone with a film studies BA to use. The procedure should lead to one of four dispositions: show as planned, show with context, show conditionally, or pull. The key is to clearly separate the two tracks—artistic integrity and platforming ethics—and provide clear signposts.

  The user provided specific case types that the procedure must handle: constitutive cases, taint-value, collaborative issues, split-victim opinions, and timing differences. Each of these needs to be addressed within the steps. For instance, the constitutive case where the wrongdoing is integral to the work requires recognizing that removing the taint isn't possible without destroying the piece. 

  I should design the flowchart to start with factual questions first, like whether the allegation is credible. Then, split into Track A (artistic impact) and Track B (platforming ethics). Track A would assess if the misconduct affects the work's meaning or quality, while Track B deals with harm, consent, and community impact. 

  For the epistemic muddle—like an allegation with no charges—the procedure needs a credibility assessment. Also, audience awareness matters; if the audience doesn't know, contextual info might be necessary, whereas if they do, the context changes. 

  The user emphasized not fudging answers, especially in the burial site case. The procedure must be honest, even if the answer is to pull the film despite financial loss. 

  I should also note what the procedure can't do. It can't judge artistic merit or handle cases where the artist's notoriety is the primary value. Plus, it doesn't replace legal advice or handle external pressures like board approvals beyond specifying who signs off. 

  Testing the procedure on the three composites is crucial. For the addict documentary, Track A might not apply since the coercion isn't visible, but Track B requires consent and harm considerations. The subject's consent could lead to showing with context. The financial fraud case might proceed as planned since the crime is unrelated. The burial site installation, being a constitutive case, likely requires pulling the film, despite financial loss, due to irreversible harm and community request. 

  Finally, explaining limitations clearly: no artistic judgment, can't resolve value conflicts beyond flagging them, and doesn't manage PR fallout. The board handles value decisions when the procedure flags them.
answer: |-
  Here’s a streamlined decision procedure designed for speed, clarity, and actionable outcomes. It separates the two tracks ("Artwork Integrity" vs. "Platforming Ethics") and includes explicit handoffs for value judgments.  

  **Key Simplifications & Why They’re Safe:**  
  1.  **Dropped:** *Deep philosophical debates about art/morality*.  
       *Why:* The procedure focuses on *actionable consequences* (visible harm, consent violations, audience trust) rather than abstract ideals.  
  2.  **Dropped:** *Distinguishing "artist" vs. "subject" wrongdoing*.  
       *Why:* Harm to stakeholders (subjects, crew, communities) is the priority; the source matters less than the impact.  
  3.  **Dropped:** *Precise definitions of "artistic quality"*.  
       *Why:* The festival has already selected the work; this tool assesses *risks*, not merit.  

  ---

  **The Decision Procedure**  
  *(Run sequentially; stop and assign a disposition when reached)*  

  **STEP 0: INITIAL SCREENING (5 min)**  
  *   **Question:** Is there a *credible, specific allegation or confirmed fact* of serious harm (physical, psychological, financial, cultural) caused by the filmmaker(s) or tied to the film’s creation/subject?  
      *   *Sufficient Answer:* Public records, major reputable news sources, first-hand accounts from verified victims/crew, or direct confessions. Hearsay/social media rumors alone are **insufficient**.  
      *   **NO** → **DISPOSITION 1: SHOW AS PLANNED** (Proceed to final checks in Step 4).  
      *   **YES** → Proceed to Step 1.  

  **STEP 1: URGENCY & FACT CHECK (10 min)**  
  *   **Question:** Is the allegation *directly relevant* to **this film’s content, creation, or immediate stakeholders** (subjects, depicted communities, core crew)?  
      *   *Sufficient Answer:*  
          *   **YES:** Misconduct occurred during filming, involves the subject, uses illegally/immorally obtained materials, targets the depicted community, or involves key creative leads (Dir/DP/Producer).  
          *   **NO:** Misconduct is unrelated (e.g., financial fraud conviction unrelated to the film, historical allegation about long-dead artist where proceeds don’t benefit harm-doers).  
      *   **NO** → Proceed to **TRACK B (PLATFORMING ETHICS)**.  
      *   **YES** → Proceed to **TRACK A (ARTWORK INTEGRITY)**.  

  **SIGNPOST: THE FORK**  
  *   **TRACK A (ARTWORK INTEGRITY):** *"Is the harm baked into the work itself?"*  
  *   **TRACK B (PLATFORMING ETHICS):** *"Can we platform this without causing further harm, even if the work is 'clean'?"*  

  ---

  **TRACK A: ARTWORK INTEGRITY (15 min)**  
  *(Focus: Can the work be engaged with *aesthetically* without endorsing/obscuring the harm?)*  
  1.  **Question A1 (Constitutive Harm):** Is the alleged harm *necessary for the work’s existence or meaning*? (e.g., footage obtained via deception, stolen cultural materials used as medium).  
      *   **YES** → **DISPOSITION 4: PULL IT** (The work *is* the harm. Proceed to Step 4).  
      *   **NO** → Proceed to A2.  
  2.  **Question A2 (Visible Taint):** Is the harm *visibly present or legible within the work itself* to a reasonably informed viewer? (e.g., visible distress of a coerced subject, glorification of criminal acts by the filmmaker).  
      *   **YES** → **DISPOSITION 2: SHOW WITH CONTEXT** (Mandatory note/panel explaining the harm within the work).  
      *   **NO** → Proceed to **TRACK B (PLATFORMING ETHICS)**.  
      *   *Note for "Taint-Value":* If the work’s *only* value is its notoriety (true taint-value), it fails A2 (harm isn’t *critically* legible, just sensational) → **TRACK B**.  

  ---

  **TRACK B: PLATFORMING ETHICS (20 min)**  
  *(Focus: Will showing this cause further harm or violate trust, regardless of the art’s quality?)*  
  1.  **Question B1 (Active Harm):** Could screening this work *directly cause new harm* or *revictimize*? (e.g., screening against a living victim’s wishes, platforming an unrepentant abuser, enabling financial gain for a perpetrator, triggering trauma in the audience/community).  
      *   **YES** → Proceed to B2.  
      *   **NO** → Proceed to B3.  
  2.  **Question B2 (Mitigation Possible):** Can the harm be *practically mitigated* before/during screening? (e.g., redirecting proceeds to victims, adding prominent content warnings, securing *informed* consent from key victims/subjects, presenting with critical context).  
      *   **YES** → **DISPOSITION 3: SHOW CONDITIONALLY** (Define exact condition(s) in Step 4).  
      *   **NO** → **DISPOSITION 4: PULL IT**.  
  3.  **Question B3 (Stakeholder Consent):** Do *key stakeholders directly impacted by the harm* support the screening? (e.g., the coerced subject, the defrauded family, the desecrated community).  
      *   **UNANIMOUS YES** → **DISPOSITION 2: SHOW WITH CONTEXT** (Acknowledge harm/support).  
      *   **SPLIT VICTIMS / NO CONSENT** → **HANDOFF TO VALUES DECISION**.  
      *   *Who Signs Off:* **FESTIVAL DIRECTOR + BOARD CHAIR** (Requires weighing testimony, representation, and the festival's ethical stance).  
  4.  **Question B4 (Audience Awareness & Trust):** Is the harm *widely known* to the likely audience AND would screening without acknowledgment *significantly damage trust* in the festival?  
      *   **HIGH RISK** (Unknown harm + no context = betrayal; Known harm + no context = endorsement) → **DISPOSITION 2 or 3** (Context or conditions *essential*).  
      *   **LOW RISK** (Known harm + audience expects context; Historical/obscure harm) → **DISPOSITION 1: SHOW AS PLANNED** (Proceed to Step 4).  

  **STEP 4: FINAL CHECKS (All Tracks - 5 min)**  
  *   **For DISP 1/2/3:** Confirm logistics for context/conditions (program note text, panelists, fund redirection). Consult Board if context constitutes a "political statement" per their rules.  
  *   **For DISP 4 (PULL):** Initiate cancellation protocols.  
  *   **For HANDOFFS:** Document rationale for Director/Board decision.  

  ---

  **Test Runs on Composites**  

  1.  **Vérité Feature (Coercive Director/Subject Wants Screened):**  
      *   **Step 0:** YES (Credible allegation: coercive relationship).  
      *   **Step 1:** YES (Directly relevant: Involves subject & creation).  
      *   **Track A:**  
          *   A1: NO (Harm enabled the work but isn't *constitutive* like stolen materials).  
          *   A2: **PROBABLY YES** (Coercion may be legible in subject's portrayal/dynamic). → **DISP 2: SHOW WITH CONTEXT** (Mandatory note/panel discussing power dynamics, subject's agency in consenting to screen).  
      *   *TRACK B NOT NEEDED.* **Outcome:** Show with Context.  

  2.  **Animated Short (Convicted of Unrelated Family Fraud):**  
      *   **Step 0:** YES (Conviction = confirmed fact).  
      *   **Step 1:** **NO** (Unrelated to film's content/creation/stakeholders). → **TRACK B ONLY**.  
      *   **Track B:**  
          *   B1: NO (Screening unlikely to cause *new* direct harm).  
          *   B3: **HANDOFF** (Is the defrauded family a "key stakeholder"? Likely YES. Do they consent? Unstated → Requires Director/Board value judgment: Does platforming the artist *against family wishes* constitute new harm/endorsement?).  
          *   *If Family Consents/Uninvolved:* B4: LOW RISK (Known harm? Depends. Context likely prudent → **DISP 2**).  
          *   *If Family Objects:* **DISP 4: PULL IT** (Platforming over victim objections causes harm).  
      *   **Outcome:** Depends on Stakeholder Consent (Handoff).  

  3.  **Burial Site Installation (Community Requests Destruction):**  
      *   **Step 0:** YES (Confirmed: Objects taken without permission).  
      *   **Step 1:** YES (Directly relevant: Materials are the medium).  
      *   **Track A:**  
          *   A1: **YES** (Harm is constitutive - the work *cannot exist* without the desecration). → **DISP 4: PULL IT**.  
      *   *TRACK B NOT NEEDED.*  
      *   **Outcome:** **PULL IT.** The procedure delivers the hard answer: showing it perpetuates the original harm and violates the community's wishes. Financial loss is a consequence of ethical programming.  

  ---

  **What the Procedure CANNOT Do:**  

  1.  **Judge Artistic Merit:** It assumes the film was programmed on artistic grounds. It only assesses harm and ethical risk.  
  2.  **Resolve "Taint-Value" Ethically:** It flags taint-value as ethically problematic (usually pushing towards context or pull), but *cannot* justify exploiting harm for spectacle/notoriety as a valid reason to show.  
  3.  **Handle Epistemic Certainty:** It relies on a "credible allegation" threshold but cannot establish truth. It mitigates via context/conditions when uncertainty persists.  
  4.  **Override Legal Obligations:** If contracts/insurance demand showing, this tool highlights ethical conflicts but cannot solve them (Handoff to Director/Board/Lawyer).  
  5.  **Define Community Representation:** Determines *if* a community is a stakeholder but cannot decide *who speaks* for them (Requires external consultation).  
  6.  **Absolve the Festival of Responsibility:** A "Show As Planned" outcome doesn't mean the festival endorses the artist; it means the tool found no *actionable* ethical barrier under its criteria.  
  7.  **Manage PR/Political Fallout:** It provides an ethical rationale, not a communications strategy.  

  **The Deepest Limitation:** It **cannot transform an unethical act of platforming into an ethical one** solely because the audience finds the transgression interesting ("Taint-Value"). If the work's primary value stems from the artist's notoriety *for harm unrelated to critical engagement with that harm within the work itself*, the procedure will either demand context (making the harm, not just the notoriety, the subject) or recommend pulling it. It prioritizes minimizing harm over catering to voyeurism.  

  This procedure provides a clear, structured path through complex ethical terrain, forces explicit value judgments where needed, and prioritizes minimizing harm while acknowledging the realities of festival operations. It won't make the hard calls easy, but it will make them clearer and more defensible.
